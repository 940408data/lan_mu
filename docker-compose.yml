services:
  lan-mu:
    build: .
    image: lan-mu:latest
    container_name: lan-mu
    restart: unless-stopped
    tmpfs:
      - /tmp
    volumes:
      # 宿主 dist 作为重媒体（pdf/jpg/png）只读源——不烘进镜像
      - ./dist:/media:ro
    ports:
      - "127.0.0.1:${PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
