# 视觉模型角色配置 · collation/config/vision.yaml
# 两角色名固定（初校/覆校），底层模型可迭代——后期换更强模型只改 models，角色不变。
# key 走环境变量，不入仓库。

vision:
  keyEnv: DASHSCOPE_API_KEY                    # 百炼 key 经 env 注入
  endpoint: https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions
  roles:
    first: 初校        # 基本验证：快、广覆盖、低成本，默认先跑
    deep: 覆校         # 升级详定：强、精、贵，初校置信度低时升级
  models:
    first: qwen3.7-plus     # 底层模型（可迭代为更强版）
    deep: qwen3.8-max       # 底层模型（可迭代为更强版）
  threshold: 0.7            # 初校置信 < 此值 → 升级覆校
  thinking:                 # 按任务开关思考模式（对齐 guji_ocr 脚本：关思考快 5.7× 但版面判定变糙）
    jz: true                # 经注判定：需看图推理版面大小字 → 开思考保精度
    verify: true            # 单字辨形：需看图推理字形 → 开思考保精度
    layout: true            # 版面结构抽样/网格转写：需看图推理网格 → 开思考保精度
    ocr: false              # 纯 OCR 原文照录：看图抄字不需推理 → 关思考保速度
  render:
    dpi: 150                # 善本页渲染分辨率（pdftoppm）
