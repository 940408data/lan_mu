# 孟子注疏卷14（孫奭疏）：j 為經文＋漢趙岐注，z 為疏文。
sections:
  - id: juan14
    name: 正文
    blocks:
      - { type: j, text: "（尽心者，人之有心，为精气主，思虑可否，然後行之。犹人法天，天之执持纲维，以正二十八舍者，北辰也。《论语》曰：“北辰居其所，而众星拱之。”心者，人之北辰也。苟存其心，养其性，所以事天也，故以“尽心”为篇题。）" }
      - { type: z, text: "正义曰：前篇章首论告子之言性，此篇章首以论尽心，盖以情性有主於心，故次之以《尽心》也。言尽己之心，与天道通，是道之极者，故《孟子》七篇，所以终於《尽心》也。此篇凡八十四章，赵氏分成上下卷，此卷即有四十五章而已。一章言尽心知性。二章言为仁由己，富贵在天。三章言每必以诚，恕己而行。四章言人有仁端，达之为道。五章言远辱不为忧。六章言不慕大人，何能有耻。七章言王公尊贤，以贵下贱。八章言内定常满，贱不失道，达善天下。九章言小人待化。十章言人情富盛，莫不骄矜。十一章言劳人欲以佚之，杀人欲以生之。十二章言王政浩浩，与天地同道，霸者德小，民人速睹。十三章言明法审令，崇宽务化。十四章言本性良能，仁义是也。十五章言圣人潜隐。十六章言孤孽自危，故能显达。十七章言容悦凡臣，社稷股肱，天民行道，大人正己。十八章言育养贤才，乐过万乘。十九章言临莅天下，君子之乐，尚不与焉。二十章言王政普大，二老闻归。二十一章言教民之道，富而节用。二十二章言能大明者无不照。二十三章言好善从舜，好利从跖。二十四章言杨墨放荡，子莫执中。二十五章言饥不妄食。二十六章言下惠不恭。二十七章言为仁由己，必在究之。二十八章言仁在性体，其次假道。二十九章言放恶摄政，伊周有为，凡人志异，则生篡心。三十章言君子正己，以立於世。三十一章言人当尚志，善之所由，仁与义也。三十二章言事有轻重，行有小大。三十三章言奉法承天，政不可枉，大孝荣父，遗弃天下。三十四章言人性皆同，居使之异。三十五章言舆服器用，人用不殊，尊贵居之，志气以舒。三十六章言取人之道，必以恭敬。三十七章言圣人践形。三十八章言礼断三年，孝者欲益，富贵怠厌，思减其日。三十九章言教人之术，莫善五者。四十章言道大难追，人能弘道。四十一章言穷达卷舒，屈伸异变。四十二章言学尚虚己。四十三章言赏僭及淫，刑滥及士，季文三思。四十四章言君子布德，各有所思。四十五章言振裘持领，正罗惟纲。其馀三十九章，赵氏分在下卷，各有叙焉。○注“尽心者”至“篇题”。○正义曰：云“人之有心，为精气主，思虑可否，然後行之，犹人法天”者，盖以性之得於天，心之生於性。天莫之为，而所以命人者，性也。性则湛然自得，所以为主者，心也。则人之心为精气主，思虑可否然後行，由人法天也。云“天之执持维纲，以正二十八舍者，北辰也”者，二十八舍，案五行《天文志》云：东方：角、亢、氐、房、心、尾、箕；北方：斗、牛、女、虚、危、室、壁；西方：奎、娄、胃、昴、毕、觜、参；南方：井、鬼、柳、星、张、翼、轸。凡此四七之星，分布四方，是二十八舍也。然所以正之者，盖在乎北辰。《论语》曰：“北辰居其所，而众星拱之。”包注云“北辰之不移，而众星拱之。”《尔雅·释文》云：“北极谓之北辰。”郭璞曰：“北极，天之中以正四时。”然则极，中也。辰，时也。以其居天之中，故曰北极。以正四时，故曰北辰。又按《汉书·天文志》云：“中宫，太极星。其一明者，太乙之常居也。旁三星，三公环之。匡卫十二星，藩臣。皆曰紫宫。北斗七星，所谓璇玑玉衡，以齐七政。斗为帝车，运於中央，临制四方。分阴阳，建四时，均五行，移节度，定诸纪，皆系於斗，是众星所拱也。" }
      - { type: j, text: "孟子曰：“尽其心者，知其性也。知其性，则知天矣。（性有仁、义、礼、智之端，心以制之，惟心为正。人能尽极其心，以思行善，则可谓知其性矣。知其性，则知天道之贵善者也。）存其心，养其性，所以事天也。（能存其心，养育其正性，可谓仁人。天道好生，仁人亦好生。天道无亲，惟仁是与。行与天合，故曰所以事天也。）夭寿不贰，身以俟之，所以立命也。”（贰，二也。仁人之行，一度而已。虽见前人或夭或寿，终无二心改易其道。夭若颜渊，寿若邵公，皆归之命。正其身，以待天命，此所以立命之本。）" }
      - { type: z, text: "“孟子”至“命也”。○正义曰：此章指言尽心竭性，足以承天，夭寿祸福，秉心不违，立命之道，惟是为珍者也。“孟子曰：尽其心者”至“所以立命也”者，孟子言人能尽极其心以思之者，是能知其性也。知其性，则知天道矣。知存其心，养育其性，此所以能承事其天者也。以其天之赋性，而性者人所以得於天也，然而心者又生於性，性则湛然自得，而心者又得以主之也。盖仁、义、礼、智根於心，是性本固有而为天所赋也。尽恻隐、羞恶、恭敬、是非之心，则是知仁、义、礼、智之性。知吾性固有此者，则知天实赋之者也。如存此恻隐、羞恶、恭敬、是非之心，以长育仁、义、礼、智之性，是所以事天者也，是性即天也。故存心养性，是为事天矣。又言人之於命，虽有或夭或寿，但操执其心而不仁也。既夭寿不二，而修其身以待其在天者如何耳，如是所以为能立命之本也。以其夭寿皆定於未形有分之初，亦此而不二也，不可徼求之矣，但其在我以待之，是为立命也。如於夭寿而二其心，以废其所以其在我者，则非所以立命者也。《商书》云：“我生不有命在天。”是其意也。" }
      - { type: j, text: "孟子曰：“莫非命也，顺受其正。（莫，无也。人之终，无非命也。命有三名，行善得善曰受命，行善得恶曰遭命，行恶得恶曰随命。惟顺受命为受其正也已。）是故知命者不立乎岩墙之下。尽其道而死者，正命也。（知命者欲趋於正，故不立於岩墙之下，恐压覆也。尽身之道，以寿终者，得正命也。）桎梏死者，非正命也。”（畏、压、溺死，礼所不吊，故曰非正命也已。）" }
      - { type: z, text: "“孟子曰”至“非正命也”。○正义曰：此章指言人必趋命，贵受其正，岩墙之疑，君子远之也。“孟子曰莫非命”至“非正命也”者，孟子言人之死，无非是命也，然当顺受其正，尽道以生死也。《书》云：“惠迪吉。”是其顺受其正之旨也。是故知命之君子，不立身於岩墙危险之下，以其能压覆人也。是以尽其身之道而死亡者，乃为受正命而死也；陷於刑狱，为桎梏而死者，非受正命而死也，以其不能尽身之道而顺受其命而死也。桎，足械也。梏，手械也。今刑狱匣手足者也。案孔子云人有三死而非命：饮食不节，劳逸过度，是病其杀之者也；居下位而上诬其君，嗜欲无厌，是刑其杀之也；以少犯众，以弱侮强，是兵其杀之者也。又云人有三死而不吊：有畏而死者，有压而死者，有溺而死者。○注“莫，无也”至“正也”。○正义曰：云“命有三，行善得善曰受命”者，如舜闻一善言，见一善行，沛若决江河而莫之御，而终得升于帝而崩是也。“行善得恶曰遭命”，如《淮南子》“伯牛有癞”，《论语》曰“伯牛有疾，孔子自牖执其手，曰亡之命矣，夫斯人也而有斯疾也，斯人也而有斯疾也”，包曰“伯牛有恶疾”是也。“行恶得恶曰随命”，如舜之四凶之类是也。○注“畏、压、溺死，所不吊”。○正义曰：《礼》於《檀弓》云：“死而不吊者三，畏、压、溺。”郑氏云：“谓轻身忘孝也。畏，人或时以非罪，故己不能有以说之，死之者，孔子畏於匡是也。压，行止危险之下是也。溺，不乘桥船是也。”《荀子》曰：“夏首之南，有人曰涓蜀梁，其为人善畏，明月而宵行，俯见其影，以为伏鬼也。仰视其发，以为立魅。背而走，比至其家，失气而死。”是亦畏死者也。又秦武王时，大蛇从身出，复入穴，五女示之，五子拔蛇，压杀五女。是压死者也。尾生与女子期於梁下，水至不去，抱梁柱而死。是溺死者也。孟子之言，其趋则一也。" }
      - { type: j, text: "孟子曰：“求则得之，舍则失之，是求有益於得也，求在我者也。（谓仁行义，事在於我。我求则得，我舍则失，故求有益於得也。）求之有道，得之有命，是求无益於得也，求在外者也。”（谓贤者其天爵而人爵从之，故曰求之有道也。天爵者，或得或否，故曰得之有命也。爵禄须知己，知己者在外，非身所专，是以云求无益於得也，求在外者也。）" }
      - { type: z, text: "“孟子”至“者也”。○正义曰：此章指言为仁由己，富贵在天，故孔子曰：“如不可求，从吾所好。”孟子言仁、义、礼、智，性之所有，如就性而求之则得之，舍而不求则亡。是则仁、义、礼、智，求之有益於得者也，是求之在我者也。以其仁、义、礼、智，有生之初性固有者，是为在我者也，是为天爵也。求之有道，则其天爵而人爵从之故也。既其天爵，而人爵或有不得者，是或得或否，是得之有命也。是则人爵求之无益於得也，是求之在外者也。以其人爵非身所专，故为在外者也。如《论语》云“求仁而得仁”，是求则得之之谓也。《易》云“舍尔灵龟，凶”，是舍则失之之谓也。《诗》云“恺悌君子，求福不回”，是求之有道者也。《荀子》云“君子能为可用，不能使人必用己”，是得之有命者也。孟子所以言之以此。" }
      - { type: j, text: "孟子曰：“万物皆备於我矣。反身而诚，乐莫大焉。（物，事也。我，身也。普谓人为成人已往，皆备知天下万物，常有所行矣。诚者实也。反自思其身所施行，能皆实而无虚，则乐莫大焉。）强恕而行，求仁莫近焉。”（当自强勉以忠恕之道，求仁之术，此最为近也。）" }
      - { type: z, text: "“孟子”至“莫近焉”。○正义曰：此章指言每必以诚，恕己而行，乐在其中，仁之至也。孟子言人之生也，万物皆备足於我矣，但能反己思之以诚，不为物之丧己，是有得於内矣，有得於内，则为乐亦莫大焉。以其外物为乐，则所乐在物，不在於我，故为乐也小。以内为乐，则所乐在己，不在物，其为乐也大。又言勉强以忠恕之道而行之，以求仁之术为最近，故传有云“仁者必恕而後行”，是之谓也，斯亦“力行近乎仁”之意欤。" }
      - { type: j, text: "孟子曰：“行之而不著焉，习矣而不察焉，终身由之而不知其道者，众也。”（人皆有仁义之心，日自行之无所爱，而不能著明其道以施於大事；仁妻爱子亦以习矣，而不能察知可推以为善；由，用也，终身用之，以为自然，不究其道可成君子：此众庶之人也。）" }
      - { type: z, text: "正义曰：此章指言人有仁端，达之为道，凡人用之，不知其为实也。孟子言仁义之道人皆有之，然而行之而不著，则其迹不能彰明；习此仁义之道而不察，则其理不能推明；终身用而行之，而不知其是为道：凡如此者，非君子者也，是则为凡众者矣。故孟子以此闵之。" }
      - { type: j, text: "孟子曰：“人不可以无耻。（人不可以无所羞耻也。《论语》曰：“行己有耻。”）无耻之耻，无耻矣。”（人能耻己之无所耻，是为改行从善之人，终身无复有耻辱之累也。）" }
      - { type: z, text: "正义曰：此章指言耻身无分，独无所耻，斯必远辱，不为忧矣。孟子言人之不可无其羞耻也。人能无耻而尚有羞耻，是为迁善远罪之人，终身无复有耻辱累之矣。案《礼》云：“君子有五耻：朝不坐，燕不善，君子耻之；居其位，无其言，君子耻之；有其言，无其行，君子耻之；既得之，又失之，君子耻之；地有馀而民不足，君子耻之。”如此，则人可以无耻乎？此孟子所以有此言，而救时之弊与。" }
      - { type: j, text: "孟子曰：“耻之於人大矣。为机变之巧者，无所用耻焉。（耻者为不正之道，正人之所耻为也。今造机变阱陷之巧以攻战者，非古之正道也。取为一切可胜敌之宜，无以错於廉耻之心。）不耻不若人，何若人有？（不耻不如古之圣人，何有如贤人之名也？）" }
      - { type: z, text: "正义曰：此章指言不慕大人，何能有耻。是以隰朋愧不及黄帝，佐桓公以有勋；颜渊慕虞舜，孔子叹庶几之云。孟子言人之所以耻者，以其为不正之道也。不正之道，正宜羞耻而无为之也，是为耻之於人为大者也。今之人乃造机变阱陷，藏兵之巧，以为攻战者，是为不正之道也，是无所用而耻之也。如不耻不若古之圣贤，何能有古圣贤之名也！○注“隰朋颜渊”。○正义曰：凡於赵注有所要者，虽於文段不录，然於事未尝敢弃之而不明。今有以隰朋不及黄帝，佐齐桓以有勋；颜渊慕虞舜，仲尼叹庶几也。案杜预《春秋传》云：“隰朋，齐大夫也。”《史记》注云：徐广曰：朋或作崩，常愧耻不若黄帝之为人，後齐桓得之，辅佐桓公，四十一年卒。颜渊慕虞舜。案《经》云：“颜渊曰：‘舜何人也？予何人也？有为者亦若是。’”孔子所以曰：“回也其庶乎屡空。”是其叹也。赵注所以引而为解文。" }
      - { type: j, text: "孟子曰：“古之贤王好善而忘势。（乐善而自卑，若高宗得傅说而禀命。）古之贤士何独不然？乐其道而忘人之势。（何独不然，何独不有所乐有所忘也。乐道守志，若许由洗耳，可谓忘人之势矣。）故王公不致敬尽礼，则不得亟见之。见且由不得亟，而况得而臣之乎？”（亟，数也。若伯夷非其君不事，伊尹乐尧、舜之道，不致敬尽礼，而数见之乎？作者七人，隐各有方，岂可得而臣之。）" }
      - { type: z, text: "“孟子”至“之乎”。○正义曰：此章指言王公尊贤，以贵下贱之义也；乐道忘势，不以富贵动心之分也。各崇所尚，则义不亏矣。“孟子曰”至“而况得而臣之者乎”，孟子曰古之贤者之君，好人之善而忘己之势，古之为贤士者亦然，以其能乐己之乐而忘人之贵势也。如此，故有王公大人不致其敬而尽其礼，则不得数数见其贤者。然而见之且犹尚以为不可，而况得臣之而卑下者乎？○注“高宗得傅说而禀命”。○正义曰：案《尚书·说命篇》云高宗梦得说，使百工营求诸野，得诸傅岩，爰立作相。王置诸其左右，曰臣下罔有禀命。孔安国《传》云：“名说。禀，受也。令，命也。”○注“经许由洗耳，可谓忘人之势”。正义曰：案《高士传》云：“许由，颍川人也，隐箕山。尧闻之，躬聘为九州长。由不赴，遂洗耳於河。巢父见之，曰：‘吾欲饮牛，污吾牛口。’於是牵牛上流饮之。由大惭而隐。”是也。○注“亟数也”至“作者七人”。○正义曰：云伯夷、伊尹者，此盖本孟子之正文也，已说之详矣。云“作者七人”者，案《论语》之文也。七人，包注云凡七人，长沮、桀溺、丈人、石门、荷蒉、仪封人、楚狂接舆是也。王弼云七人，伯夷、叔齐、虞仲、夷逸、朱张、柳下惠、少连，是此七人者也。" }
      - { type: j, text: "孟子谓宋句践曰：“子好游乎？吾语子游，人知之亦嚣嚣，人不知亦嚣嚣。”（宋，姓也；句践，名也。好以道德游，欲行其道者。嚣嚣，自得无欲之貌也。）曰：“何如斯可以嚣嚣矣？”（句践问何执守可嚣嚣也。）曰：“尊德乐义，则可以嚣嚣矣。”（尊，贵也。孟子曰：能贵德而履之，乐义而行之，则可以嚣嚣无欲矣。）故士穷不失义，达不离道。穷不失义，故士得己焉。达不离道，故民不失望焉。（穷不失义，不为不义而苟得，故得己之本性也。达不离道，思利民之道，故民不失其望也。）古之人得志，泽加於民；不得志，身见於世。穷则独善其身，达则兼善天下。（古之人得志君国，则德泽加於民人。不得志，谓贤者不遭遇也，见，立也，独治其身以立於世间，不失其操也，是故独善其身。达谓得行其道，故能兼善天下也。）" }
      - { type: z, text: "“孟子”至“天下”。○正义曰：此章指言内定常满，嚣嚣无忧，可出可处，故云以游，身立世，贱不失道，达善天下，乃用其宝。句践好游，未得其要，孟子言之，然後乃喻。“孟子谓宋句践曰”至“嚣嚣”，宋句践，宋人，姓宋名句践。孟子谓句践曰：子好逸游乎？我今语以教子之游也，言人之知己，亦但嚣嚣然自得；人不知己，亦但嚣嚣然而自得。“曰何如斯可以嚣嚣矣”，句践问之，曰当何如此可以嚣嚣然自得矣。“曰尊德乐义”至“达则兼善天下”。孟子又与之曰：尊贵其德，所乐以义，以此则可以嚣嚣自得矣。盖德有所得於内，义有所不为於外。既所贵在德，而尽性於内；所乐在义，而穷理於外：是以乐天知命，故人知不知，斯嚣嚣然自得矣。如此，故士穷而在下，则不失义，而不为苟得；达而在上，则不离道，而常思利民。穷不失义而不为苟得，故得己之本性；达不离道而常思利民，故民不失其所望。是以古之人得志遭遇其时，则布恩泽而加被於民；不得志，则治其身以立於世间。是其穷则独善身，达则得行其道而兼善天下也。言古之人以是者，如颜子之徒穷而不得志，则不改其乐而独善其身，伊尹之徒得志而泽加於民也。" }
      - { type: j, text: "孟子曰：“待文王而後兴者，凡民也。若夫豪杰之士，虽无文王犹兴。”（凡民，无自知者也，故由文王之大化，乃能自兴起以趋善道。若夫豪杰之才知千万於凡人者，虽不遭文王，犹能自起以善守其身，正其行，不陷溺也。）" }
      - { type: z, text: "正义曰：此章指言小人待化，乃不邪僻；君子特立，不为俗移，故谓豪杰自兴也。孟子言必待文王之化而乃能兴起以从善道者，凡民也，以其无自知者也。若夫才有过於千万人之豪杰者，虽不遭遇文王之化，犹能自兴起以从善而正立其身也已。" }
      - { type: j, text: "孟子曰：“附之以韩、魏之家，如其自视然，则过人远矣。”（附，益也。韩、魏，晋六卿之富者也。言人既自有家，复益以韩、魏百乘之家，其富贵已美矣。而其人然不足，自知仁义之道不足也，此则过人甚远矣。）" }
      - { type: z, text: "正义曰：此章指言人情富盛，莫不骄矜，若能然，谓不如人，非但免过，卓绝乎凡也。孟子言人自有富，复附益以韩、魏晋六卿百乘之家富而贵之，如其自视己於仁义之道然不足，则超绝有过乎众人远矣。○注“韩、魏，晋六卿百乘之家”。正义曰：已说於《梁惠》首篇。" }
      - { type: j, text: "孟子曰：“以佚道使民，虽劳不怨。（谓教民趋农，役有常时，不使失业，当其虽劳，後获其利，则佚矣，若“亟其乘屋”之类也，故曰不怨。）以生道杀民，虽死不怨杀者。”（谓杀大辟之罪者，以坐杀人故也。杀此罪人者，其意欲生民也。故虽伏罪而死，不怨杀者，）" }
      - { type: z, text: "“孟子”至“杀者”。○正义曰：此章指言劳人欲以佚之，杀人欲以生之，则民不怨ゥ也。孟子言国君如使民趋於农耕，是以佚道使民，是农耕时虽为劳，然後有所获稼，则又有以佚乐矣。如是则何怨恨其劳乎？故曰：“以佚道使民，虽劳不怨。”又言国君杀戮其罪人者，以其恐有害於民，故杀之，而意有在於欲生其民也，是则罪人被杀，虽死且不怨恨杀者也。故曰：“以生道杀民，虽死不怨杀者。”○注“若亟其乘屋之类”。○正义曰：已於《滕文公》说之矣。○注“大辟之罪”。○正义曰：孔云：大辟之罪，死刑也。前已说。" }
      - { type: j, text: "孟子曰：“霸者之民，欢虞如也。王者之民，如也。杀之而不怨，利之而不庸，民日迁善而不知为之者。（霸者行善恤民，恩泽暴见易知，故民欢虞乐之也。王者道大法天，浩浩而德难见也。杀之不怨，故曰杀之而不怨。庸，功也。利之使趋时而农，六畜繁息，无冻饿之老，而民不知独是王者之功。修其庠序之教，又使日迁善，亦不能觉知谁为之者。言化迁善为之大道者也。）夫君子所过者化，所存者神，上下与天地同流，岂曰小补之哉！”（君子通於圣人，圣人如天。过此世能化之，存在此国，其化如神，故言与天地同流也。天地化物，岁成其功，岂曰使人知其小补益之者哉。）" }
      - { type: z, text: "“孟子”至“之哉。○正义曰：此章指言王政浩浩，与天地同道；霸者德小，民人速睹：是以贤者志其大者也。“孟子曰”至“小补之哉”者，孟子言霸者行善政以及民，以其恩泽暴见，故民欢而乐也；王者道大，故若天浩浩而难知难见者也，故民然自得而已矣。是以王者之民，杀之而不怨，以其生道杀之故也；利而不知为王者之功，以其佚道使之故也。自迹观之，则君子过之而不守拘其一，自妙道观之，则其所感而遂天下之故者未尝不有存焉，故曰“君子所过者化，所存者神”。今夫天地之化者，始乎春而终乎冬，而万物皆得以移易者也；天地之神者，始乎震而终乎艮，而阴阳不可测之者是也。然则王者之於民，所过者以化，所存者以神，宜美与天地上下同流而无间也。则是天地之化，以神而存之，岂曰使万物知其有小补益哉！王者之化，亦存以神，又岂曰使民知其有小补益之哉！如此，故王者之民所以如也。盖虞之为乐，必待虞度无患，然後为欢，则其乐浅；如也，以其使民舒通太平，自得而已，故於欢虞又有以间矣。此孟子所以抑区区之为，而尊崇其王者也。" }
      - { type: j, text: "孟子曰：“仁言不如仁声之入人深也。（仁言，政教法度之言也。仁声，乐声《雅》、《颂》也。仁言之政虽明，不如《雅》、《颂》感人心之深也。）善政不如善教之得民也。（善政使民不违上，善教使民尚仁义，心易得也。）善政，民畏之。善教，民爱之。善政得民财，善教得民心。”（畏之，不逋怠，故赋役举而财聚於一家也。爱之，乐风化而上下亲，故欢心可得也。）" }
      - { type: z, text: "“孟子”至“民心”。○正义曰：此章指言明法审令，民趋君命，崇宽务化，民爱君德，故曰移风易俗，莫善於乐。“孟子曰”至“善教得民心”，孟子言仁言为政教法度之言，不若仁声乐声《雅》、《颂》感人心之深也。善政使民不违上，又不若善教得民之易也。以其善政出於法度之粗，有刑威以行之，故民有以畏之。善教本人之德性，有仁恩以怀之，故民有以爱之。亦以善政有九职系万民，有九两以系万民。九职任万民，故一曰三农，以平地山泽，生黍、稷、禾、稻、麻、大、小豆、大、小麦之九；二曰园囿，以育草木；三曰虞衡，作山泽之材；四曰薮牧，养蕃鸟兽；五曰百工，饬化八材，八材，郑司农云“珠、象、玉、石、金、木、革、羽”是也；六曰商贾，阜通货贿；七曰嫔妇，化治丝，郑玄云“金玉曰货，布帛曰贿，嫔，妇人之美称也”；八曰臣妾，聚敛疏财；九曰闲民，无常职，转移执事。郑玄云：“疏材，百草根实可食者。”九两系万民：一曰牧，以地得民；二曰长，以贵得民；三曰师，以贤得民；四曰儒，以道得民；五曰宗，以族得民；六曰主，以利得民；七曰吏，以治得民；八曰友，以任得民；九曰薮，以富得民。凡此善政，为民财而已；善教因民心以教之，故能得民心矣：此所以为仁言不如仁声之入人深也，善政不如善教之得民。然而善政非不能得民，但得民财而已，又不若善教得民之心矣。○盖“移风易俗，莫大乎乐”，此礼之文然也，孟子所以同其趋焉。" }
      - { type: j, text: "孟子曰：“人之所不学而能者，其良能也。所不虑而知者，其良知也。（不学而能，性所自能。良，甚也。是人之所能甚也。知亦犹是能也。）孩提之童，无不知爱其亲者，及其长也，无不知敬其兄也。（孩提，二三岁之间，在襁褓，知孩笑可提抱者也。少知爱亲，长知敬兄，此所谓良能良知也。）亲亲，仁也。敬长，义也。无他，达之天下也。”（人仁义之心，少而皆有之，欲为善者无他，达，通也，但通此亲亲敬长之心，施之天下人也。）" }
      - { type: z, text: "“孟子”至“天下也”。○正义曰：此章指言本性良能，仁义是也，达之天下，恕乎己也。“孟子曰人之所不学而”至“达之天下也”者，孟子言人之所以不学而性自能，是谓良能者也；所以不待思虑而自然知者，是谓良知者也。孩提襁褓之童子，无有不知爱其父母，及其长大，无不知钦顺其兄，是则厚爱其亲，钦顺其兄，是仁义也，仁义即良知良能者也。言人之为善者，无更於他求也，但通达此亲亲敬长之良能良知，施之於天下耳。○注“襁褓者”。○正义曰：释云：襁褓，负也。负，儿衣也。织缕为之，广八寸，长二尺，以负儿於背上者也。是亦知孩提为二三岁。" }
      - { type: j, text: "孟子曰：“舜之居深山之中，与木石居，与鹿豕游。其所以异於深山之野人者几希。（舜耕历山之时，居木石间。鹿豕近人，若与人游也。希，远也。当此之时，舜与野人相去岂远哉。）及其闻一善言，见一善行，若决江河，沛然莫之能御也。”（舜虽外与野人同其居处，闻人一善言则从之，见人一善行则识之，沛然不疑，若江河之流，无能御止其所欲行也。）" }
      - { type: z, text: "“孟子”至“御也”。○正义曰：此章指言圣人潜隐，辟若神龙，亦能飞天，亦能潜藏，舜之谓也。孟子言虞舜初起於历山耕时，居於木石之间，以其近木石故也，与鹿豕游，以其鹿与豕近於人也。然而舜於此，其所以有异於深山之野人不远，但能及其闻一善言，见一善行，其从之若决江河之水，沛然其势，莫之能御止之也。○注“圣人潜隐若神龙者”。○正义曰：此盖《周易·乾卦》之文也，赵注引之以解其经。" }
      - { type: j, text: "孟子曰：“无为其所不为，无欲其所不欲，如此而已矣。”（无使人为己所不欲为者，无使人欲己之所不欲者，每以身先之如此，则人道足也。）" }
      - { type: z, text: "正义曰：此章指言己所不欲，勿施於人，仲尼之道也。孟子言人无为其所不为，以其所不为者不义也。无欲其所不欲者，以其不欲为不善也。人能无为不义，又不欲其所不善，则人道於是足矣，故曰如此也。" }
      - { type: j, text: "孟子曰：“人之有德慧术知者，恒存乎疾。（人所以有德行智慧道术才知者，在於有疾之人，疾之人，又力学，故能成德。）独孤臣孽子，其操心也危，其虑患也深，故达。”（此即人之疾也，自以孤微，惧於危殆之患而深虑之，勉为仁义，故至於达也。）" }
      - { type: z, text: "“孟子”至“故达”。○正义曰：此章指言孤孽自危，故能显达，膏粱难正，多用沉溺，是故在上不骄，以戒诸侯也。孟子言人之所以有德慧术知者，常在於疾之人也。疾，人之有小疾，常沾在身不去者，是为疾也。如孤臣孽子，其操心也常危，其虑患也常深，是若疾也。此孟子所以执此喻以自解也。言孤臣不得於其君者也，孽子不得於其亲者也。不得於其君与不得於其亲者，故能秉心常危，虑患常深，以勉力於为道德，故能显达也。操心常危，虑患常深，是人之疾常г在身而不去也，是孟子所以为疾之人有德慧术智也。然而非谓德慧术智必系乎有疾者，但常存乎疾之人而已。盖有得於己谓之德，述而行之谓之术，然德又以慧连，术又以智连之者，以其德以慧明，术以智释耳，是则所谓智虑生於忧患，岂非德慧术智存於疾之意有同欤？此孟子所以有是言之，而戒当时之人者也。" }
      - { type: j, text: "孟子曰：“有事君人者，事是君则为容悦者也。（事君，求君之意，为苟容以悦君者也。）有安社稷臣者，以安社稷为悦者也。（忠臣志在安社稷而後为悦者也。）有天民者，达可行於天下而後行之者也。（天民，知道者也。可行而行，可止而止。）有大人者，正己而物正者也。”（大人，大丈夫不为利害动移者也。正己物正，象天不言而万物化成也。）" }
      - { type: z, text: "“孟子”至“者也”。○正义曰：此章指言为悦凡臣，社稷股肱，天民行道，大人正身。凡此四科，优劣之差。“孟子曰：有事君人者，事是君则为容悦者也”，孟子言有人事其君以求君之意者，是为苟容以悦君者也。“有安社稷臣者，以安社稷为悦者也”，孟子又言有忠臣，为安社稷臣者也，在於安社稷而後为悦者也。“有天民者，达可行於天下而後行之者也”，言天民为之先觉者，志在於行道，然而既达而在位，可以行其道於天下，然後乃行之也。以其若穷而在下，未可行其道，则亦止而不行矣。是其穷、达一归於天而已。“有大人者，正己而物正者也”，言有大丈夫不为利害之所易动，是则自正治其己，而物後自取正於我也。凡此是其四科优劣差等也。" }
      - { type: j, text: "孟子曰：“君子有三乐，而王天下不与存焉。父母俱存，兄弟无故，一乐也。仰不愧於天，俯不怍於人，二乐也。得天下英才而教育之，三乐也。（天下之乐不得与此三乐之中。兄弟无故，无他故。不愧天，又不怍人，心正无邪也。育，养也。教养英才，成之以道，皆乐也。）君子有三乐，而王天下不与存焉。”（君子重言，是美之也。）" }
      - { type: z, text: "“孟子曰”至“存焉”。正义曰：此章指言保亲之养，兄弟无他，诚不愧天，育养英才，贤人能之，乐过万乘，孟子重焉，一章再云也。“孟子曰：君子有三乐，而王天下不与存焉”至“存焉”者，孟子言君子有三乐，而为王天下者不得与於其间。父母皆在，兄弟无有他故者，以其无嫌隙之事也，此乃一乐也；存诚於己，而仰无以有羞愧於天，俯无以有惭怍於人，此乃二乐也；己之有德，又得天下英才大贤，而推己以教而养育之，此乃三乐也。三乐如此，故孟子又重言之。然君子有三乐，而王天下不与存焉，以其有天下之乐，不若此三乐矣。故重言之，而美此三乐也。是以舜得天下而无足解忧。杨子云：“纡朱怀金之乐，不如颜氏子之乐。”是亦与此同意也。" }
      - { type: j, text: "孟子曰：“广土众民，君子欲之，所乐不存焉。中天下而立，定四海之民，君子乐之，所性不存焉。（广土众民，大国诸侯也。所乐不存，欲行礼也。中天下而立，谓王者。所性不存，乃所谓性於仁义者也。）君子所性，虽大行不加焉，虽穷居不损焉，分定故也。（大行，行之於天下。穷居不失性也，分定故不变。）君子所性，仁、义、礼、智。根於心，其生色也，然见於面，盎於背，施於四体。四体不言而喻。”（四者根生於心，色见於面。然，润泽之貌也。盎视其背而可知，其背盎盎然，盛流於四体。四体有匡国之纲，虽口不言，人自晓喻而知也。）" }
      - { type: z, text: "“孟子曰”至“而喻”。○正义曰：此章指言临莅天下，君国子民，君子之乐，尚不与存。仁义内充，身体履方，四支不言，蟠辟用张，心邪意溺，进退无容，於是之际，知其所不同也。“孟子曰广土众民”至“不言而喻”，孟子言广土地之大，众民人之多，以为大国之诸侯，君子者心欲好之，然其所乐不在此也。中天下之中而立，以安四海之民，是为之王，君子者虽乐於此，然而禀天性不在此焉。盖君子欲广土众民，以其足以行道於一国故也，然其所乐又在於定四海之民，而未乐於此一国而已。虽乐在於中天下而立，定四海之民，得以行道於天下，奈何所性不在此焉，是所性者特在仁、义、礼、智耳。故言於下文是也。是则君子所禀天之性，虽大而行道於天下，且不能加益其性；虽穷居在下，且不能损灭其性：以其所生之初，受之於天，有其分定故也。故君子所性，是仁、义、礼、智，四者根生於心，显而形诸德容，其生於色，则然润泽见於面，又有辉光乎其前，盎盎然见於背，又有充实乎其後，而旁溢流通乎左右上下四体。则一动静，一行止，固虽不言，而人以晓喻而知其所存，是其不言仁而喻其能仁，不言义而喻其能义，以至礼也智也亦若是矣。此所以故云“四体不言而喻”。《荀子》云：“君子之学入乎耳，著乎心，布乎四体，形乎动静。”又曰：“君子至德，默然而喻。”同意。" }
      - { type: j, text: "孟子曰：“伯夷辟纣，居北海之滨，闻文王作兴，曰：‘盍归乎来？吾闻西伯善养老者。’太公辟纣，居东海之滨，闻文王作兴，曰：‘盍归乎来？吾闻西伯善养老者。’（已说於上篇。）天下有善养老，则仁人以为己归矣。（天下有能若文王者，仁人呼复归之矣。）五亩之宅，树墙下以桑匹妇蚕之，则老者足以衣帛矣。五母鸡，二母彘，无失其时，老者足以无失肉矣。百亩之田，匹夫耕之，八口之家足以无饥矣。（五鸡、二彘，八口之家畜之，足以为畜产之本也。）所谓西伯善养老者，制其田里，教之树、畜，导其妻子，使养其老。五十非帛不暖，七十非肉不饱。不暖不饱，谓之冻馁。文王之民，无冻馁之老者，此之谓也。”（所谓无冻馁者，教导之使可以养老者，耳。非家赐而人益之也。）" }
      - { type: z, text: "“孟子”至“此之谓也”。○正义曰：此章指言王政普大，教其常业，各养其老，使不馁乏。二老闻之，归身自托，众鸟不罗，翔凤来集，亦斯类也。“孟子曰伯夷辟纣”至“此之谓也”，已说於上篇矣。此以大同小异，更不复说焉。然其类亦孔子所云“刳胎杀夭，则麒麟不至，覆巢毁卵，则凤凰不翔”。此亦类也。" }
      - { type: j, text: "孟子曰：“易其田畴，薄其税敛，民可使富也。食之以时，用之以礼，财不可胜用也。（易，治也。畴，一井也。教民治其田畴，薄其税敛，不逾什一，则民富矣。食取其征赋以时，用之以常礼，不逾礼以费财也，故畜积有馀，财不可胜用也。）民非水、火不生活，暮叩人之门户求水、火，无弗与者，至足矣。圣人治天下，使有菽粟如水、火。菽粟如水、火，而民焉有不仁者乎？（水、火能生，人有不爱者，至饶足故也。菽粟饶多若是，民皆轻施於人，而何有不仁者也。）" }
      - { type: z, text: "“孟子”至“者乎”。○正义曰：此章指言教民之道，富而节用，蓄积有馀，焉有不仁，故曰仓廪实知礼节也。“孟子曰易其田畴”至“不可胜用也”，孟子言如使在下者易治其田畴而不难耕作，则地无遗其利；又在上者又薄其赋敛而无横赋，则民皆可令其赋足也；又食之以时而其用不屈，用之以礼而其欲不穷，则财用有馀而不可胜用也。“民非水火不生活”至“焉有不仁者乎”，孟子又言人民非得其水、火则不能生活，然而昏暮之时，有敲人之门户而求之水、火，无不与之者，以其水、火至多矣。圣人如能治其天下，使民有其菽粟亦如水、火之多，则民人孰不以有馀而补其不足，而为仁者乎？故曰：“菽粟如水、火，而民焉有不仁者乎？此所谓仓廪实而知礼节者也。○注“畴，一井也”。○正义曰：《说文》云：“为耕治之田也。”不知一井何据。" }
      - { type: j, text: "孟子曰：“孔子登东山而小鲁，登太山而小天下，故观於海者难为水，游於圣人之门者难为言。（所览大者意大，观小者志小也。）观水有术，必观其澜。（澜，水中大波也。）日月有明，容光必照焉。（容光，小也。言大明照幽微也。）流水之为物也，不盈科不行。君子之志於道也，不成章不达。（盈，满也。科，坎也。流水满坎乃行，以喻君子之学必至成章，乃仕进者也。）" }
      - { type: z, text: "“孟子”至“不达”。正义曰：此章指言弘大明者无不照，包圣道者成其仁。是故贤者志大，宜为君子。“孟子曰孔子登东山”至“难为言”者，孟子言孔子登鲁国之东山，而所览者大，故小其鲁国，以鲁国莫大於东山也；登太山而能小其天下，亦所览者大，而天下亦莫大也於大山也。如此故观之於海者难为水也，以其水所同归於海者也，是以海为百谷王；游圣人之门者难为言，以其道之所同出又同归於此者也。杨子云“视日月而知众星之蔑如，仰天庭而知天下之居卑”，亦与此同意。“观水有术，必观其澜”者，孟子又言人之观於水，以其有术也，有术者，所谓观水必观其波澜，是为能观水者也。云此者，以其人之观书亦若是也，言观书亦当观其五经而已矣，五经所以载圣人之大道者也。“日月有明，容光必照焉”者，又言日月之有明，凡於几隙，但有容其光者，则必照之，亦若道之在天下无往而不在也。“流水之为物也，不盈科不行”至“不成章不达”者，又言流水为物，所流遇於科坎，不盈满其科坎则不流进而行也。如君子之学志在於道也，不成章则不达而进仕。以其君子於道，至於成章则充实，美在其中，畅於四支，发於事业，为美之至者也。此孟子所以有水为之喻焉。" }
      - { type: j, text: "孟子曰：“鸡鸣而起，孳孳为善者，舜之徒也。鸡鸣而起，孳孳为利者，跖之徒也。欲知舜与跖之分，无他，利与善之间也。”（跖，盗跖也。跖，舜之分，故以此别之也。）" }
      - { type: z, text: "正义曰：此章指言好善从舜，好利从跖，明明求之，常若不足，君子、小人，各一趣也。“孟子曰”至“间也”者，孟子言人之鸡鸣而起，孳孳劝笃於为善者，乃为舜之徒党也；如鸡鸣而起，孳孳但勤笃於为利者，乃为盗跖之徒也。傥言欲知舜与盗跖为君子、小人之分别，无他事焉，特一趋於利、一趋於善之间而已。○注“盗跖”。○正义曰：案李奇《汉书传》云：“盗跖乃是秦之大盗也。”" }
      - { type: j, text: "孟子曰：“杨子取为我，拔一毛而利天下，不为也。（杨子，杨朱也。为我，为己也。拔己一毛以利天下之民，不肯为也。）墨子兼爱，摩顶放踵利天下，为之。（墨子，墨翟也。兼爱他人，摩突其顶下至於踵，以利天下，己乐为之也。）子莫执中。（子莫，鲁之贤人也。其性中和专一者也。）执中为近之。执中无权，犹执一也。（执中和，近圣人之道，然不权。圣人之重权。执中而不知权，犹执一介之人，不知时变也。）所恶执一者，为其贼道也，举一而废百也。”（所以恶执一者，为其不知权，以一知而废百道也。）" }
      - { type: z, text: "“孟子”至“百也”。○正义曰：此章杨、墨放荡，子莫执一，圣人量时，不取此术，孔子行止，唯义所在。“孟子曰：杨子取为我，拔一毛而利天下，不为也”至“为之”，孟子谓杨朱所取以为己，虽拔己之一毛以利天下，且不为也；墨翟兼爱他人，虽摩突其顶而至於踵而利天下，且以为之。“子莫执一”，子莫，鲁贤人，言子莫执中和之性而不专一者也，以其无为己、兼爱之过而已，故曰“执中为近之”，言子莫执中为近圣人之道者也。如执中而不知权变，但若执一介之人，不知时变者也。然而所以恶疾其执一者，是为其有以贼害其道也，是若知举一道而废其百道也，故曰：“执中无权，犹执一也。所恶执一者，为其贼道，举一而废其百也。”" }
      - { type: j, text: "孟子曰：“饥者甘食，渴者甘饮，是未得饮食之正也，饥渴害之也。（饥渴害其本所以知味之性，令人强甘之。）岂惟口腹有饥渴之害？人心亦皆有害。（为利欲所害，亦犹饥渴得之。）人能无以饥渴之害为心害，则不及人不为忧矣。”（人能守正，不为邪利所害，虽谓富贵之事不及逮人，犹为君子。不为善人所忧患也。）" }
      - { type: z, text: "“孟子”至“忧矣”。○正义曰：此章指言饥不妄食，忍情节欲，贱不失道，不为苟求。能无心害，夫将何忧。“孟子曰饥者甘食”至“不为忧矣”，孟子言人之饥饿，则易为食，故以甘之；渴者易为饮，故以甘之：然而不得饮食味之正者也，以其但为饥渴害其本性耳。岂独饮食於口腹为有饥渴以害之？言人心亦皆有以害之也，以其利欲害之故也。人能无以饥渴之害为心之害，则所养不及於人，亦不足为可忧矣。盖无以饥渴为心害，则孟子以饥渴之害亦犹利欲之害，故假托而言之也。" }
      - { type: j, text: "孟子曰：“柳下惠不以三公易其介。”（介，大也。柳下惠执弘大之志，不耻污君，不以三公荣位易其大量也。）" }
      - { type: z, text: "正义曰：此章指言柳下惠不恭，用志大也，无可无否，以贱为贵也。孟子言柳下惠不以三公之荣位而移易己之大志也，以其所守之介，在道而已，是所以不羞小官者焉。今夫三公者，乃百僚之师师也，人臣之位极者也，衣则服兖，圭则执桓圭，而世之所谓富贵崇显者，无以过也。" }
      - { type: j, text: "孟子曰：“有为者辟若掘井，掘井九轫而不及泉，犹为弃井也。（有为，为仁义也。轫，八尺也。虽深而不及泉，喻有为者能於中道而尽弃前行者也。）" }
      - { type: z, text: "正义曰：此章指言为仁由己，必在究之，九轫而辍，无益成功。《论》之一篑，义与此同。孟子曰今之有为之道者，譬如掘井者也，掘井至九轫之深，而不及泉则止之，是弃其前掘井之功者也，喻为仁义之道，而不及之，则止而不为，是亦弃其仁义之道者也。孔子曰：“为山未成一篑，止，吾止也。”与此同意。○注“轫，八尺也”。○正义曰：案释云：七尺曰轫。" }
      - { type: j, text: "孟子曰：“尧、舜，性之也。汤、武，身之也。五霸，假之也。（性之，性好仁，自然也。身之，体之行仁，视之若身也。假之，假仁以正诸侯也。）久假而不归，恶知其非有也？”（五霸而能久假仁义，譬如假物久而不归，安知其不真有也。）" }
      - { type: z, text: "“孟子”至“非有也”。○正义曰：此章指言仁在性体，其次假借，用而不已，实何以易，在其勉之也。而行仁，本性之自然者也。汤、武利而行仁，视之若身也。五霸强而行仁，则力假之而已。然而久假而行之，而不归止，安知其非真有也。杨子曰：“假儒衣书服而读之，三月不归，孰曰非儒也。”亦同其旨。" }
      - { type: j, text: "公孙丑曰：“伊尹曰：‘予不狎于不顺。’放太甲于桐，民大悦。太甲贤，又反之，民大悦。贤者之为人臣也，其君不贤，则固可放与？”（丑怪伊尹贤者而放其君，何也？）孟子曰：“有伊尹之志则可，无伊尹之志则篡也。”（人臣秉忠，志若伊尹，欲宁殷国，则可放恶而不即立君，宿留冀改而复之。如无伊尹之忠，见间乘利，篡心乃生，何可放也！）" }
      - { type: z, text: "“公孙”至“篡也”。○正义曰：此章指言忧国忘家，意在出身，志在宁君，放恶摄政，伊周有焉。凡人志异，则生篡心也。公孙丑问孟子，谓伊尹有言我不迩于顺己者，故放太甲于桐宫，而民心大悦；及太甲悔改其过而归贤，则伊尹又迎而反之以复君位，商民大悦：且贤者之为人臣也，其君有不贤者，则固可以放之与？孟子对曰：如贤者有伊尹爱君之志，则可以放君；如无伊尹秉忠心以爱君，则放君而生篡夺君位之心者也，以为不可矣。" }
      - { type: j, text: "公孙丑曰：“《诗》曰：‘不素餐兮。’君子之不耕而食，何也？”（《诗·魏国·伐檀》之篇也。无功而食，则谓之素餐，世之君子有不耕而食，何也？）孟子曰：“君子居是国也，其君用之，则安富尊荣；其子弟从之，则孝悌忠信。不素餐兮，孰大於是？”（君子能使人化其道德，移其习俗，身安国富而保其尊荣，子弟孝悌而乐忠信，不素餐之功，谁大於是？何为不可以食禄！）" }
      - { type: z, text: "“公孙丑”至“於是”。○正义曰：此章指言君子正己，以立於世，世美其道，君臣是贵，所过者化，又何素餐之谓也。公孙丑问孟子曰：魏国《伐檀》之诗有云“不素餐兮”，言无功而食谓之素餐，然而君子有不自耕而食禄者，是如之何？孟子对之曰：君子居处此国，其君任用之，则安富尊荣，言安国保其尊荣；子弟从之，则能孝悌忠信：是则不素餐兮，谁有大於此者？言何为而不可食禄。○注“魏国《伐檀》之篇”。○正义曰：此《诗》盖剌在位贪鄙，无功而受禄，君子不得进仕尔。" }
      - { type: j, text: "王子垫问曰：“士何事？”（齐王子名垫也，问士当何事为事者耶。）孟子曰：“尚志。”（尚，贵也。士当贵上於用志也。）曰：“何谓尚志？”曰：“仁义而已矣。杀一无罪，非仁也。非其有而取之，非义也。居恶在？仁是也。路恶在？义是也。居仁由义，大人之事备矣。”（孟子言志之所尚，仁义而已矣。不杀无罪、不取非有者为仁义，欲知其所当居者仁为上，所由者义为贵，大人之事备矣。）" }
      - { type: z, text: "“王子”至“备矣”。○正义曰：此章指言人当尚志，志於善也，善之所由，仁与义也。欲使王子无过差者也。“王子垫问曰：士何事”者，王子垫，齐王之子名垫也。问孟子曰为士者当以何事为尚也。“孟子曰尚志”，孟子答之，曰为士者当以志为尚也。“曰何谓尚志”，王子又问孟子何以谓之尚志。“曰仁义而已矣”至“大人之事备矣”，孟子又答之。曰尚志则以仁义而已矣。言能以仁义为尚，则为尚志也。如杀一人之无罪，是为非仁也；非己之所有而取求之，是为非义也。如此非仁非义者，亦以所居有恶疾，在於仁，所行有恶疾，在於义是也。如仁以为居，义以为行，则大人之事亦备矣。此孟子所以欲使王子垫於无过之地也。" }
      - { type: j, text: "孟子曰：“仲子，不义与之齐国而弗受，人皆信之，是舍箪食豆羹之义也。（仲子，陈仲子处於陵者，人以为廉，谓以不义而与之齐国，必不受之。孟子以为仲子之义，若上章所道箪食豆羹无礼则不受，万锺则不辨礼义而受之也。）人莫大焉亡亲戚君臣上下。以其小者信其大者，奚可哉！”（人当以礼义为正，陈仲子避兄离母，不知仁义亲戚上下之叙，何可以其小廉信以为大哉？）" }
      - { type: z, text: "“孟子曰”至“奚可哉”。○正义曰：此章指言事有轻重，行有大小，以大包小可也，以小信大，未之闻者也。孟子言陈仲子以不义虽与之齐国之大而且不受，国人皆信之以为廉，是为舍箪食豆羹之小义也。人之所尚，当以莫大为尚焉者，是其知以亲戚君臣上下之叙者也。今陈仲子避兄离母，处於陵而不仕，是弃亲戚君臣上下之大分，尔徒取其辞受之小节而已。而信廉之大，又安可哉？以其非义之本耳，宜孟子以是闻之。○注“陈仲子”至“受之也”。○正义曰：此於前篇已说矣。" }
      - { type: j, text: "桃应问曰：“舜为天子，皋陶为士，瞽瞍杀人，则如之何？”（桃应，孟子弟子问皋陶为士官主执罪人，瞽瞍恶暴而杀人，则皋陶何如？）孟子曰：“执之而已矣。”（孟子曰：皋陶执之耳。）“然则舜不禁与？”（桃应以舜为天子，使有司执其父，不禁止之邪？）曰：“夫舜恶得而禁之？夫有所受之也。”（夫，辞也。孟子曰：夫舜恶得禁之，夫天下乃受之於尧，当为天理民，王法不曲，岂得禁之也！）“然则舜如之何？”（应问舜为之将如何。）曰：“舜视弃天下犹弃敝徙也。窃负而逃，遵海滨而处，终身然，乐而忘天下。”（孟子曰：舜视弃天下如拾弃敝徙。徙，草履可徙者也。敝喻不惜。舜必负父而远逃，终身然，忽忘天下之为至贵也。）" }
      - { type: z, text: "“桃应”至“天下”。○正义曰：此章指言奉法承天，政不可枉，大孝荣父，遗弃天下，虞舜之道，趋将若此。孟子之言，揆圣意也。“桃应问曰：舜为天子，皋陶为士，瞽瞍杀人，则如之何”，桃应问孟子曰：舜为天子，命皋陶为士官以执罪人，舜父瞽瞍杀人，则皋陶之士当如何也。“孟子曰：执之而已矣”，孟子答之，但当执而不纵也。“然则舜不禁与”，桃应问曰：如是则舜为天子，使有司执其父，而不禁之耶？“曰：夫舜恶得而禁之，夫有所受之也”，孟子又答之，曰：夫舜岂得而禁止之哉！夫以其法有所受之而已。“然则舜如之何”，桃应问曰：如是，舜不敢禁止皋陶无执其父，则舜将如之何？“曰舜视弃天下”至“忘天下”，孟子又答之曰：舜视天下如捐弃敝徙而不惜也，必将窃负戴其父而逃循海滨而处以逃之，且终身然，乐而忘去天下。是以舜得天下不足解忧，惟顺父母可以解忧也。" }
      - { type: j, text: "孟子自范之齐，望见齐王之子，喟然叹曰：“居移气，养移体。大哉居乎！夫非尽人之子与？”（范，齐邑，王庶子所封食也。孟子之范，见王子之仪，声气高凉，不与人同。还至齐，谓诸弟子，喟然叹曰：居尊则气高，居卑则气下。居之移人气志使之高凉，若供养之移人形身使充盛也。“大哉居乎”者，言当慎所居，人必居仁也。凡人与王子岂非尽是人之子也，王子居尊势，故仪声如是也。）" }
      - { type: z, text: "正义曰：赵云：此章指言人性皆同，居使之异，君子居仁，小人处利，譬犹王子，殊於众品也。孟子尝自范邑见齐王之子，仪体声气高爽，不与人同，乃往归齐，而於弟子之间喟然叹息之曰：夫居足以移易人之气，所养足以移易人之体。以其王子之仪体声气如是者，亦以所居所养之大移之使然也。“大哉居乎”，言人当慎所居，以仁为广居。众之人，岂非尽人之子与？言齐王之子亦人之子也，凡人亦人子也。下文观宜合此章。" }
      - { type: j, text: "孟子曰：“王子宫室、车马、衣服多与人同，而王子若彼者，其居使之然也。况居天下之广居者乎？（言王子宫室、乘服皆人之所用之耳，然而王子若彼高凉者，居势位故也，况居广居！谓行仁义，仁义在身，不言而喻也。）鲁君之宋，呼於垤泽之门。守者曰：‘此非吾君也，何其声之似我君也？’此无他，居相似也。”（垤泽，宋城门名也。人君之声相似者，以其俱居尊势，故音气同也。以城门不自肯夜开，故君自发声耳。章指言舆服器用，人用不殊，尊贵居之，志气以舒。是以居仁由义，盎然内优，胸中正者，眸子不瞀也。）" }
      - { type: z, text: "正义曰：此章宜与上章合而为一，不当分而为二也。孟子言王子所居宫室与车马之乘、衣服之饰，是皆与人同所用之也，然而王子若彼仪体声气高凉者，必其居势位，使之如是与人不同耳。言王所居势位能如此，而况居天下之广居，以仁为居者乎？且以鲁国之君往宋，乃呼於垤泽之门，守者曰此非吾君之身也，似我君也。言大亦无他事异焉，亦以皆居尊势，故其声之如是相似也。垤泽，宋城门之名。守者，监门之官也。是言能以大人之所居者处己，而与大人相似者也。" }
      - { type: j, text: "孟子曰：“食而弗爱，豕交之也。爱而不敬，兽畜之也。恭敬者，币之未将者也。恭敬而无实，君子不可虚拘。”（人之交接，但食之而不爱，若养豕也。爱而不敬，若人畜禽兽，但爱而不能敬也。且恭敬者如有币帛，当以行礼，而未以命将行之也。恭敬贵实，如其无实，何可虚拘致君子之心也。）" }
      - { type: z, text: "正义曰：此章指言取人之道，必以恭敬，恭敬贵实，虚则不应。实者谓敬爱者也。孟子言人之交接，但饮食为备，而欢意弗加者，非以爱相接者也，是为豕交之也。犬马者，人所爱而畜养者也，如爱诚虽至，而敬心弗加者，是谓爱而弗敬，以为兽畜之也。然而恭敬者，是币帛之礼未行之也。盖以恭敬为先，而币帛从之也，如恭敬而无币帛之实以将之，是又君子不可以虚拘矣。以其礼不可以徒虚而行，何必以恭敬修於内而为之本，币帛以将之而为之末，则君子交接之道毕矣。" }
      - { type: j, text: "孟子曰：“形、色，天性也。惟圣人然後可以践形。”（形谓君子体貌尊严也，《尚书·洪范》“一曰貌”。色谓妇人妖丽之容，《诗》云“颜如舜华”。此皆天假施於人也。践，履居之也。《易》曰：“黄中通理。”圣人内外文明，然后能以正道履居此美形，不言居色主名，尊阳抑阴之义也。）" }
      - { type: z, text: "正义曰：此章指言体德正容，大人所履，有表无里，谓之柚梓，是以圣人乃堪践形也。孟子言人之形与色，皆天所赋，性所有也。惟独圣人能尽其天性，然後可以践形而履之，不为形之所累矣。盖形有道之象，色为道之容，人之生也，性出於天命，道又出於率性，是以形之与色皆为天性也。惟圣人能因形以求其性，体性以践其形，故体性以践目之形，而得於性之明；践耳之形，而得於性之聪；以至践肝之形以为仁，践肺之形以为义，践心之形以通於神明。凡於百骸、九窍、五脏之形，各有所践也，故能以七尺之躯，方寸之微，六通四辟，其运无乎不在，兹其所以为圣人与！然而形与色皆天性，何独践形而不践色，何耶？盖形则一定而不易者也，色则有喜怒哀乐之变，以其无常者也，不可以践之矣。亦以圣人吉凶与人同，何践之以为异哉！是又孟子之深意然也。○注“形谓君子”至“抑阴之义也”。○正义曰：云“《洪范》一曰貌”者，盖以五事之一者也。孔安国云：“貌，容仪也，谓妇人妖丽之容。”“《诗》云：颜如舜华”者，此盖《有女同车》之篇文也，注云：“舜，木槿也。”“《易》曰：君子黄中通理”者，盖《坤》之卦文也，谓君子黄中通理，正位居体，美在其中，而畅於四支，发於事业，美之至也。是亦以正道履居此美形，不言居而言践，尊阳而抑阴也。" }
      - { type: j, text: "齐宣王欲短丧。公孙丑曰：“为期之丧，犹愈於已乎。”（齐宣王以三年之丧为太长久，欲减而短之，因公孙丑使自以其意问孟子：既不能三年丧，以期年差愈於止而不行丧者也。）孟子曰：“是犹或纟其兄之臂，子谓之姑徐徐云尔，亦教之孝悌而已矣。”（纟，戾也。孟子言有人戾其兄之臂，为不顺也，而子谓之曰：且徐徐云尔。是岂以徐徐之为差者乎？不若教之以孝悌，勿复戾其兄之臂也。令欲行其期丧，亦犹曰徐徐之类也。）王子有其母死者，其傅为之请数月之丧。公孙丑曰：“若此者，何如也？”（丑曰：王之庶夫人死，迫於夫人，不得行其丧亲之数，其傅为请之於君，欲使得行数月丧，如之何？）曰：“是欲终之而不可得也，虽加一日愈於已。谓夫莫之禁而弗为者也。”（孟子曰：如是王子欲终服其子礼而不能者也，加益一日则愈於止，况数月乎？所谓不当者，谓无禁自欲短之，故讥之也。）" }
      - { type: z, text: "“齐宣”至“者也”。○正义曰：此章指言礼断三年，孝者欲益，富贵怠厌，思减其日，君子正言，不可阿情。丑欲期之，故譬以纟兄徐徐也。“齐宣王欲短丧。公孙丑曰：为期之丧，犹愈於己乎”，齐宣王欲短三年之丧，公孙丑劝之，以为期年之丧，犹胜於止而不为者矣。期年，十二月也。“孟子曰”至“而已矣者，孟子言如此，是若或有纟戾其兄之臂者，子以为之姑且徐徐然纟其兄之臂云尔。但当教之以孝悌，不复戾兄之臂也。今子欲劝齐王短其三年之丧，而且谓为期年之丧，亦若徐徐然之谓也。“王子有其母死者，其傅为之请数月之丧。公孙丑曰：若此何如也”，公孙丑又复问孟子，曰王子有母死之者，其傅相者为之请行数月之丧，如此者，是如之何也？以其王子庶生之母死，迫於嫡母，而不敢终丧者也。“曰是欲终之而不可得也”至“弗为者也”，孟子答之。曰是王子欲终之丧，有所御而不可得而为者也，虽加益一日，亦足胜於止而不为者矣。今齐宣王欲短三年之丧，以其礼所当终之，而且谓期年之丧犹愈於已以劝之，是谓夫莫之禁止而自弗为者也。此孟子所以不取之也。《论语》“宰我问三年之丧，期已久矣”，孔子所以责之曰：“予之不仁也，汝安之则为之乎。”是亦孟子於此不取公孙丑之意也。" }
      - { type: j, text: "孟子曰：“君子之所以教者五。（教民之道有五品。）有如时雨化之者，（教之渐渍而浃洽也。）有成德者，有达财者，有答问者，有私淑艾者。（私，独。淑，善。艾，治也。君子独善其身，人法其仁，此亦与教法之道无差也。）此五者，君子之所以教也。”（申言之，孟子贵重此教之道也。）" }
      - { type: z, text: "“孟子”至“教也”。○正义曰：此章指言教人之术，莫善五者，养育英才，君子所珍，圣所不倦，其惟诲人者也。“孟子曰：君子之所以教者五”至“所以教也”者，孟子言君子所以教人之道有五品也，有如时雨之教者，以其教人渐渍，恰如时雨之泽也，是其润之以德，渐之以仁，善有萌芽，则诱之使敷秀；性有其材，则养之使长茂：凡此因其大以成大，小以成小，是为有若时雨而教者也。有成德者，以其因固有之德，但教而成之也，是其能仁不能反者，则教之以克己复礼；能勇不能怯者，则教之以临事而惧：是为有成德者也。有达财者，以其有财之具而不能用者，则教而达之也，“子贡问曰：赐也何如？子曰：女，器也。曰：何器也？曰：瑚琏也”，子谓子夏曰“女为君子儒，无为小人儒”：是为有达财之教者也。有答问者，以其在於答问之间也，不愤不启，不悱不发，举一隅不以三隅反则不复也，是为有答问之教也。有私淑艾者，以其独善其身，使彼法之也，“子曰：我非生而知之者，好古敏以求之者也”，“子不语怪力乱神”，凡此之类，是有私淑艾之教也。故重言之曰此五者之教，乃君子之所以教者也。《论语》云“有教无类”，同。" }
      - { type: j, text: "公孙丑曰：“道则高矣美矣，宜若登天然，似不可及也。何不使彼为可几及而日孳孳也。”（丑以为圣人之道大高远，将若登天，人不能及也，何不少近人情，令彼凡人可庶几，使日孳孳自勉也。）孟子曰：“大匠不为拙工改废绳墨，羿不为拙射变其彀率。君子引而不发，跃如也。中道而立，能者从之。”（大匠不为新学拙工故为之改凿废绳墨必正也，羿不为新学拙射者变其彀率之法也。彀弩张向，表率之正体，望之极思，用巧之时，不可变也。君子谓於射则引弓彀弩而不发，以待彀偶也。於道则中，道德之中，不以学者不能故卑下其道，将以须於能者往取之也。）" }
      - { type: z, text: "“公孙丑”至“从之”。○正义曰：此章指言曲高和寡，道大难追，然而履正者不枉，执德者不回，故曰人能弘道。丑欲下之，非也。“公孙丑曰”至“孳孳也”者，公孙丑问孟子，谓圣人之道则至高至美矣，学者慕之，宜如登天之难，似其不可得而及也，何不使彼之道几近，令人可庶几能及，而使之日孳孳自勉而至也。“孟子曰：大匠不为拙工改变绳墨”至“能者从之”，孟子答之，曰大匠之师不为新学拙工改去其绳墨之正，羿之善射不为新学拙射更变其彀率之法。彀率张弓向的，正体极思，用巧之时也。君子循循善诱而引人於道，不以开发者又且跃如，使进而无退也。是其不高不卑，但於中道而立教，使贤愚智者皆能从而学之也。此孟子所以讥於公孙丑也。" }
      - { type: j, text: "孟子曰：“天下有道，以道殉身。天下无道，以身殉道。未闻以道殉乎人者也。”（殉，从也。天下有道，得行王政，道从身施功实也。天下无道，道不得行，以身从道，守道而隐。不闻以正道从俗人也。）" }
      - { type: z, text: "正义曰：此章指言穷达卷舒，屈伸异变，变流从顾，守者所慎，故曰金石独止，不徇人也者也。孟子言天下有治道之时，则当以道从身，以施其功实也。以其身显而道彰也。天下无治道之时，则当以身从道，而卷藏守伏也。以其道藏则身伏也。未闻於此无道之时，以道从人，而饕富贵也。《论语》云：“天下有道则见，无道则隐。”同意。" }
      - { type: j, text: "公都子曰：“滕更之在门也，若在所礼。而不答，何也？”（滕更，滕君之弟，来学於孟子也。言国君之弟而乐在门人中，宜答见礼，而夫子不答，何也？）孟子曰：“挟贵而问，挟贤而问，挟长而问，挟有勋劳而问，挟故而问，皆所不答也。滕更有二焉。”（挟，接也。接己之贵势，接己之有贤才，接己长老，接己尝有功劳之恩，接己与师有故旧之好，凡恃此五者而以学问，望师之待以异意而教之，皆所不当答。滕更有二焉，接贵接贤，故不答矣。）" }
      - { type: z, text: "“公都”至“二焉”。正义曰：此章指言学尚虚己，师诲贵平，是以滕更恃二，孟子弗应。“公都子曰”至“何也”，公都子问孟子，谓滕君之弟滕更者，乐在门人中，宜若在所礼敬之，然而有所问而夫子不答，是如之何也。“孟子曰挟贵而问”至“滕更有二焉”，孟子答之，曰有挟己之贵势而问者，有挟己之贤才而问者，有挟己之长老而问者，有挟己有功劳之恩而问者，有挟己与师友故旧之好而问者，凡恃此五者而问，我皆所不答也。今滕更有二於此五者之中，以恃己之贵势与恃贤才，我所以不答之也。挟，接也。此孟子於滕更所以不答者，是亦不屑教之道也。奈何公都子不知以此，故有复而问焉。" }
      - { type: j, text: "孟子曰：“於不可已而已者，无所不已。於所厚者薄，无所不薄也。其进锐者，其退速。”（已，弃也。於义所不当弃而弃之，则不可，所以不可而弃之，使无罪者咸恐惧也。於义当厚而反薄之，何不薄也。不忧见薄者，亦皆自安矣。不审察人而过进，不肖越其伦，悔而退之必速矣。当翔而後集，慎如之何。）" }
      - { type: z, text: "“孟子曰”至“退速”。○正义曰：此章指言赏僭及淫，刑滥伤善，不僭不滥，诗人所纪。是以季文三思，而後之有。孟子言人君於不可弃去之者而反弃去之，是其馀之类无所不弃也。不可弃者，以其无罪之人也。所以弃之者，以其有罪者也，故弃之使人有所惧也。如尧去四凶之罪，是可以弃而弃之者也。其於赏，当所厚者反而薄之，是其馀之类亦无所不薄也。所以厚赏之者，以其有功，故厚赏之使人有所励也。如舜举八元、八凯，是所厚而厚之也。其於无所不弃、无所不薄之君，得锐进而为仕，则其被退黜亦必急速矣。无他，以其君不能鉴其贤否，不能信任，所以如是矣。故《诗》之《商颂》，所以於《殷武》之篇有云“不僭不滥”，《论语》“翔而後集”、“季文子三思而後行也”。" }
      - { type: j, text: "孟子曰：“君子之於物也，爱之而弗仁。（物，谓凡物可以养人者也，当爱育之，而不加之仁，若牺牲不得不杀也。）於民也，仁之而弗亲。（临民以非己族类，故不得与亲同也。）亲亲而仁民，仁民而爱物。”（先亲其亲戚，然後仁民，仁民然後爱物，用恩之次者也。）" }
      - { type: z, text: "正义曰：此章指言君子布德，各有所施，事得其宜，故谓之义者也。孟子言君子於凡物也，但当爱育之，而弗当以仁加之也，若牺牲不得不杀也。於民也，当仁爱之，而弗当亲之也，以爱有差等也。是则先亲其亲而後仁爱其民，先仁爱其民然後爱育其物耳，是又见君子用恩有其伦序也，故杨子所以事得其宜之谓义也。" }
      - { type: j, text: "孟子曰：“知者无不知也，当务之为急。仁者不爱也，急亲贤之为务。（知者，知所务善也。仁者，务爱其贤也。）尧、舜之知而不遍物，急先务也。尧、舜之仁不遍爱人，急亲贤也。（物，事也。尧、舜不遍知百工之事，不遍爱众人。先爱贤使治民，不一一自往亲加恩惠也。）不能三年之丧，而缌、小功之察；放饭流ヱ，而问无齿决：是之谓不知务。”（尚不能行三年之丧，而复察缌麻、小功之礼。放饭，大饭也。流ヱ，长ヱ也。齿决，断肉置其馀也。於尊者前赐食，大饭长ヱ，不敬之大者，齿决，小过耳。言世之先务，舍大讥小，有若大饭长ヱ而问无齿决类也。）" }
      - { type: z, text: "“孟子”至“不知务”。○正义曰：此章指言振裘持领，正罗维纲，君子百行，先务其崇，是以尧、舜亲贤，大化以隆道为要者也。“孟子曰：—者无不知也，当务之为急”至“是之谓不知务”者，孟子言为之智者，以其多知，故无所有而不知者也，然而但当知要务为急耳；为之仁者，以其泛爱，故无所有而不爱者也，然而但当急亲其贤为之要务。是以尧、舜二帝之智不能遍知百工之事，但急於知贤之为先务也；为仁不能遍爱於众人，但能急亲任其贤能，使之以治民也。今夫不能三年之丧，为不孝之大者也；而察缌、小功之礼，是孝之小者也。放饭流ヱ，不敬之大者也；问无齿决，责其不敬之小者也。如不能以知贤为先务，而务遍知百工之事为之先，不能以亲贤为急务，而务遍爱众人之为急，是若执亲之丧不能去不孝之大者，而乃反察孝之小者；食於尊者之前，不能去不敬之大者，而乃反责问不敬之小者也。如此，又安知先、後之务为缓急乎？盖缌麻，三月之服者；小功，五月之服者也。《荀子》云：“若挈裘领，屈三指而顿之，顺者不可胜数。”史云：“纲举而纲疏。提其纲则众目张。”与此同意。" }
