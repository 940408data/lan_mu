# 论语集注卷四（当涂郡斋刊递修本·善本底）：j 为经传大字，z 为章句小字。版面结构先行：顶格经/退格注。
sections:
  - id: pian1
    name: 述而第七
    blocks:
      - { type: z, text: 此篇多記聖人謙己誨人之辭及其容貌行事之實凡三十七章 }
      - { type: j, text: 子曰述而不作信而好古竊比於我老彭 }
      - { type: z, text: 好去聲○述傳舊而已作則創始也故作非聖人不能而述則賢者可及竊比尊之之辭我親之之辭老彭商賢大夫見大戴禮蓋信古而傳述者也孔子刪詩書定禮樂贊周易修春秋皆傳先王之舊而未嘗有所作也故其自言如此蓋不唯不敢當作者之聖而亦不敢顯然自附於古之賢人蓋其德愈盛而心愈下不自知其辭之謙也然當是時作者略備夫子蓋集羣聖之大成而折衷之其事雖述而功則倍於作矣此又不可不知也 }
      - { type: j, text: 子曰默而識之學而不厭誨人不倦何有於我哉 }
      - { type: z, text: 識音志又如字○識記也默識謂不言而存諸心也一說識知也不言而心解也前說近是何有於我言何者能有於我也三者已非聖人之極至而猶不敢當則謙而又謙之辭也 }
      - { type: j, text: 子曰德之不脩學之不講聞義不能徙不善不能改是吾憂也 }
      - { type: z, text: 尹氏曰德必脩而後成學必講而後明見善能徙改過不吝此四者日新之要也苟未能之聖人猶憂况學者乎 }
      - { type: j, text: 子之燕居申申如也夭夭如也 }
      - { type: z, text: 燕居間暇無事之時楊氏曰申申其容舒也夭夭其色愉也○程子曰此弟子善形容聖人處也爲申申字說不盡故更着夭夭字今人燕居之時不怠惰放肆必太嚴厲嚴厲時着此四字不得怠惰放肆時亦着此四字不得唯聖人便自有中和之氣 }
      - { type: j, text: 子曰甚矣吾衰也久矣吾不復夢見周公 }
      - { type: z, text: 復扶又反○孔子盛時志欲行周公之道故夢寐之間如或見之至其老而不能行也則無復是心而亦無復是憂矣故因此而自歎其衰之甚也○程子曰孔子盛時寤寐常存行周公之道及其老也則志慮衰而不可以有爲矣蓋存道者心無老少之異而行道者身老則衰也 }
      - { type: j, text: 子曰志於道 }
      - { type: z, text: 志者心之所之之謂道則人倫日用之間所當行者是也知此而心必之焉則所適者正而無他岐之惑矣 }
      - { type: j, text: 據於德 }
      - { type: z, text: 據者執守之意德則行道而有得於心而不失之謂也得之於心而守之不失則終始惟一而有日新之功矣 }
      - { type: j, text: 依於仁 }
      - { type: z, text: 依者不違之謂仁則私欲盡去而心德之全也功夫至此而無終食之違則存養之熟無適而非天理之流行矣 }
      - { type: j, text: 游於藝 }
      - { type: z, text: 游者玩物適情之謂藝則禮樂之文射御書數之法皆至理所寓而日用之不可闕者也朝夕游焉以博其義理之趣則應務有餘而心亦無所放矣○此章言人之爲學當如是也蓋學莫先於立志志道則心存於正而不他據德則道得於心而不失依仁則德性常用而物欲不行游藝則小物不遺而動息有養學者於此有以不失其先後之序輕重之倫焉則本末兼該內外交養日用之間無少間隙而涵泳從容忽不自知其入於聖賢之域矣 }
      - { type: j, text: 子曰自行束脩以上吾未嘗無誨焉 }
      - { type: z, text: 脩脯也十脡爲束古者相見必執贄以爲禮束脩其至薄者蓋人之有生同具此理故聖人之於人無不欲其入於善但不知來學則無往教之禮故苟以禮來則無不有以教之也 }
      - { type: j, text: 子曰不憤不啓不悱不發舉一隅不以三隅反則不復也 }
      - { type: z, text: 憤房粉反悱芳匪反復扶又反○憤者心求通而未得之意悱者口欲言而未能之貌啓謂開其意發謂達其辭物之有四隅者舉一可知其三反者還以相證之義復再告也上章已言聖人誨人不倦之意因并記此欲學者勉於用力以為受教之地也○程子曰憤悱誠意之見於色辭者也待其誠至而後告之既告之又必待其自得乃復告爾又曰不待憤悱而發則知之不能堅固待其憤悱而後發則沛然矣 }
      - { type: j, text: 子食於有喪者之側未嘗飽也 }
      - { type: z, text: 臨喪哀不能甘也 }
      - { type: j, text: 子於是日哭則不歌 }
      - { type: z, text: 哭謂弔哭一日之内餘哀未忘自不能歌也○謝氏曰學者於此二者可見聖人情性之正也能識聖人之情性然後可以學道 }
      - { type: j, text: 子謂顏淵曰用之則行舍之則藏惟我與爾有是夫舍上聲夫音扶尹氏曰用舍無與 }
      - { type: z, text: 與己行藏安於所遇命不足道也顏子幾於聖人故亦能之 }
      - { type: j, text: 子路曰子行三軍則誰與 }
      - { type: z, text: 萬二千五百人爲軍大國三軍子路見孔子獨美顏淵自負其勇意夫子若行三軍必與己同 }
      - { type: j, text: 子曰暴虎馮河死而無悔者吾不與也必也臨事而懼好謀而成者也馮皮冰反好去聲暴虎徒搏馮河 }
      - { type: z, text: 徒涉懼謂敬其事成謂成其謀言此皆以抑其勇而教之然行師之要實不外此子路蓋不知也○謝氏曰聖人於行藏之閒無意無必其行非貪 }
      - { type: j, text: 位其藏非獨善也若有欲心則不用而求行舍之而不藏矣是以惟顏子爲可以與於此子路雖非有欲心者然未能無固必也至以行三軍爲問則其論益卑矣夫子之言蓋因其失而救之夫不謀無成不懼必敗小事 }
      - { type: z, text: 尚然而況於行三軍乎 }
      - { type: j, text: 子曰冨而可求也雖執鞭之士吾亦爲之如不可求從吾所好 }
      - { type: z, text: 好去聲○執鞭賤者之事設言冨若 }
      - { type: j, text: 可求則雖身爲賤役以求之亦所不辭然有命焉非求之可得也則安於義理而巳矣何必徒取辱哉蘇氏 }
      - { type: z, text: 曰聖人未甞有意於求冨也豈問其可不可哉爲此語者特以明其決不可求爾○楊氏曰君子非惡冨貴而不求以其在天無可求之道也 }
      - { type: j, text: 子之所慎齊戰疾 }
      - { type: z, text: 齊側皆反○齊之爲言齊也將祭而齊其思慮之不齊者以交於神明也誠之至與不至神之饗與不饗皆决於此戰則衆之死生國之存亡繫焉疾又吾身之所以死生存亡者皆不可以不謹也○尹氏曰夫子無所不謹弟子記其大者耳 }
      - { type: j, text: 子在齊聞韶三月不知肉味曰不圖爲樂之至於斯也 }
      - { type: z, text: 史記三月上有學之二字不知肉味蓋心一於是而不及乎他也曰不意舜之作樂至於如此之美則有以極其情文之備而不覺其歎息之深也蓋非聖人不足以及此○范氏曰韶 }
      - { type: j, text: 盡美又盡善樂之無以加此也故學之三月不知肉味而歎美之如此誠之至感之深也冉有曰夫子為衛君乎子貢曰諾吾將問之 }
      - { type: z, text: 為去聲○為猶助也衛君出公輒也靈公逐其世子蒯瞶公薨而國人立蒯瞶之子輒於是晉納蒯瞶而輒拒之時孔子居衛衛人以蒯瞶得罪於父而輒嫡孫當立故冉有疑而問之諾應辭也 }
      - { type: j, text: 入曰伯夷叔齊何人也曰古之賢人也曰怨乎曰求仁而得仁又何怨出曰夫子不為也伯夷叔齊孤竹君之二子其父將死遺命立叔齊父卒叔齊遜伯夷伯夷 }
      - { type: z, text: 曰父命也遂逃去叔齊亦不立而逃之國人立其中子其後武王伐紂夷齊扣馬而諫武王滅商夷齊恥食周粟去隱于首陽山遂餓而死怨猶悔也君子居是邦不非其大夫況其君乎故子貢不斥衛君而以夷齊為問夫子告之如此則其不為衛君可知矣蓋伯夷以父命為尊叔齊以天倫為重其遜國也皆求所以合乎天理之正而即乎人心之安既而各得其志焉則視棄其國猶敝蹝爾何怨之有若衛輒之據國拒父而唯恐失之其不可同年而語明矣○程子曰伯夷叔齊遜國而逃諫伐而餓終無怨悔夫子以為賢故知其不與輒也 }
      - { type: j, text: 子曰飯疏食飲水曲肱而枕之樂亦在其中矣不義而冨且貴於我如浮雲 }
      - { type: z, text: 飯符晚反食音嗣枕去聲樂音洛。飯食之也䟽食麤飯也聖人之心渾然天理雖處困極而樂亦無不在焉其視不義之冨貴如浮雲之無有漠然無所動於其中也○程子曰非樂䟽食飲水也雖䟽食飲水不能改其樂也不義之冨貴視之輕如浮雲然又曰湏知所樂者何事 }
      - { type: j, text: 子曰加我數年五十以學易可以無大過矣 }
      - { type: z, text: 劉聘君見元城劉忠定公自言嘗讀他論加作假五十作卒蓋加假聲相近而誤讀卒與五十字相似而誤分也愚按此章之言史記作假我數年若是我於易則彬彬矣加正作假而無五十字蓋是時孔子年已幾七十矣五十字誤無疑也學易則明乎吉凶消長之理進退存亡之道故可以無大過蓋聖人深見易道之無窮而言此以教人使知其不可不學而又不可以易而學也 }
      - { type: j, text: 子所雅言詩書執禮皆雅言也 }
      - { type: z, text: 雅常也執守也詩以理情性書以道政事禮以謹節文皆切於日用之實故常言之禮獨言執者以人所執守而言非徒誦說而已也○程子曰孔子雅素之言止於如此若性與天道則有不可得而聞者要在默而識之也○謝氏曰此因學易之語而類記之 }
      - { type: j, text: 葉公問孔子於子路子路不對 }
      - { type: z, text: 葉舒渉反○葉公楚葉縣尹沈諸梁字子髙僭稱公也葉公不知孔子必有非所問而問者故子路不對抑亦 }
      - { type: j, text: 以聖人之德實有未易名言者與子曰女奚不曰其爲人也發憤忘食樂以忘憂不知老之將至云爾 }
      - { type: z, text: 未得則發憤而忘食已得則樂之而忘憂以是二者俛焉日有孳孳而不知年數之不足但自言其好學之篤耳然深味之則見其全體至極純亦不已之妙有非聖人不能及者蓋凡夫子之自言類如此學者宜致思焉 }
      - { type: j, text: 子曰我非生而知之者好古敏以求之者也 }
      - { type: z, text: 好去聲○生而知之者氣質清明義理昭著不待學而知也敏速也謂汲汲也。尹氏曰孔子以生知之聖每云好學者非惟勉人也蓋生而可知者義理爾若夫禮樂名物古今事變亦必待學而後有以驗其實也 }
      - { type: j, text: 子不語怪力亂神 }
      - { type: z, text: 怪異勇力悖亂之事非理之正固聖人所不語鬼神造化之迹雖非不正然非窮理之至有未易明者故亦不輕以語人也。謝氏曰聖人語常而不語怪語德而不語力語治而不語亂語人而不語神 }
      - { type: j, text: 子曰三人行必有我師焉擇其善者而從之其不善者而改之 }
      - { type: z, text: 三人同行其一我也彼二人者一善一惡則我從其善而改其惡焉是二人者皆我師也。尹氏曰見賢思齊見不賢而內自省則善惡皆我之師進善其有窮乎 }
      - { type: j, text: 子曰天生德於予桓魋其如予何 }
      - { type: z, text: 魋徒雷反○魋魋宋司馬向魋也出於威公故又稱威氏魋欲害孔子子言天既賦我以如是之德則威魋其奈我何言必不能違天害已 }
      - { type: j, text: 子曰二三子以我爲隱乎吾無隱乎爾吾無行而不與二三子者是丘也 }
      - { type: z, text: 諸弟子以夫子之道高深不可幾及故疑其有隱而不知聖人作止語默無非教也故夫子以此言曉之與猶示也○程子曰聖人之道猶天然門弟子親炙而冀及之然後知其高且遠也使誠以爲不可及則趨向之心不幾於怠乎故聖人之教常俯而就之如此非獨使資質庸下者勉思企及而才氣髙邁者亦不敢躐易而進也○吕氏曰聖人體道無隱與天象昭然莫非至教常以示人而人自不察 }
      - { type: j, text: 子以四教文行忠信 }
      - { type: z, text: 行去聲○程子曰教人以學文脩行而存忠信也忠信本也 }
      - { type: j, text: 子曰聖人吾不得而見之矣得見君子者斯可矣 }
      - { type: z, text: 聖人神明不測之號君子才德出衆之名 }
      - { type: j, text: 子曰善人吾不得而見之矣得見有恒者斯可矣 }
      - { type: z, text: 恒胡登反○子曰字疑衍文恒常乆之意○張子曰有常者不貳其心善人者志於仁而無惡 }
      - { type: j, text: 亡而爲有虛而爲盈約而爲泰難乎有恒矣 }
      - { type: z, text: 亡讀爲無○三者皆虛夸之事凡若 }
      - { type: j, text: 此者必不能守其常也張敬夫曰聖人君子以學言善人有恒者以質言愚謂有恒者之與聖人高下固懸絶矣然未有不自有恒而能至於聖者也故章末申言有恒之義其示人入德之門可謂深切而著明矣子釣而不綱弋不射宿 }
      - { type: z, text: 射食亦反○綱以大繩屬網絶流而 }
      - { type: j, text: 漁者也弋以生絲繫矢而射也宿宿鳥洪氏曰孔子少貧賤爲養與祭或不得已而釣弋如獵較是也然盡物取之出其不意亦不爲也此可見仁 }
      - { type: z, text: 人之本心矣待物如此待人可知小者如此大者可知 }
      - { type: j, text: 子曰蓋有不知而作之者我無是也多聞擇其善者而從之多見而識之知之次也 }
      - { type: z, text: 識音志○不知而作不知其理而妄作也孔子自言未嘗妄作蓋亦謙辭然亦可見其無所不知也識記也所從不可不擇記則善惡皆當存之以備參考如此者雖未能實知其理亦可以次於知之者也 }
      - { type: j, text: 互鄉難與言童子見門人惑 }
      - { type: z, text: 見賢遍反○互鄉鄉名其人習於不善難與言善惑者疑夫子不當見之也 }
      - { type: j, text: 子曰與其進也不與其退也唯何甚人潔己以進與其潔也不保其往也 }
      - { type: z, text: 疑此章有錯簡人潔至往也十四字當在與其進也之前潔修治也與許也往前日也言人潔己而來但許其能自潔耳固不能保其前日所爲之善惡也但許其進而來見耳非許其旣退而爲不善也蓋不追其旣往不逆其將來以是心至斯受之耳唯字上下疑又有闕文大抵亦不爲已甚之意○程子曰聖人待物之洪如此 }
      - { type: j, text: 子曰仁遠乎哉我欲仁斯仁至矣 }
      - { type: z, text: 仁者心之德非在外也放而不求故有以爲遠者反而求之則即此而在矣夫豈遠哉○程子曰爲仁由己欲之則至何遠之有 }
      - { type: j, text: 陳司敗問昭公知禮乎孔子曰知禮 }
      - { type: z, text: 陳國名司敗官名即司寇也昭公魯君名稠習於威儀之節當時以爲知禮故司敗以爲問而孔子答之如此 }
      - { type: j, text: 孔子退揖巫馬期而進之曰吾聞君子不黨君子亦黨乎君取於吳爲同姓謂之吳孟子君而知禮孰不知禮 }
      - { type: z, text: 取七住反○巫馬姓期字孔子弟子名施司敗揖而進之也相助匿非曰黨禮不娶同姓而魯與吳皆姬姓謂之吳孟子者諱之使若宋女子姓者然 }
      - { type: j, text: 巫馬期以告子曰丘也幸苟有過人必知之 }
      - { type: z, text: 孔子不可自謂諱君之惡又不可以娶同姓爲知禮故受以爲過而不辭○吳氏曰魯蓋夫子父母之國昭公魯之先君也司敗又未嘗顯言其事而遽以知禮為問其對之宜如此也及司敗以為有黨而夫子受以為過蓋夫子之盛德無所不可也然其受以為過也亦不正言其所以過初若不知孟子之事者可以為萬世之法矣 }
      - { type: j, text: 子與人歌而善必使反之而後和之 }
      - { type: z, text: 和去聲○反復也必使復歌者欲得其詳而取其善也而後和之者喜得其詳而與其善也此見聖人氣象從容誠意懇至而其謙遜審密不掩人 }
      - { type: j, text: 善又如此蓋一事之微而衆善之集有 }
      - { type: z, text: 不可勝既者焉讀者宜詳味之 }
      - { type: j, text: 子曰文莫吾猶人也躬行君子則吾未之有得 }
      - { type: z, text: 莫疑辭猶人言不能過人而尚可以及人采之有得則全未有得皆自謙之詞而足以見言行之難易緩急欲人之勉其實也○謝氏曰文雖聖人無不與人同故不遜能躬行君子斯可以入聖故不居猶言君子道者三我無能焉 }
      - { type: j, text: 子曰若聖與仁則吾豈敢抑為之不厭誨人不倦則可謂云爾已矣公西華曰正唯弟子不能學也 }
      - { type: z, text: 此亦夫子之謙辭也聖者大而化之仁則心德之全而人道之備也為之謂為仁聖之道誨人亦謂以此教人也然不厭不倦非己有之則不能所以弟子不能學也○晁氏曰當時有稱夫子聖且仁者以故夫子辭之苟辭之而已焉則無以進天下之材率天下之善將使聖與仁爲虛器而人終莫能至矣故孔子雖不居仁聖而必以爲之不厭誨人不倦自處也可謂云爾已矣者無他之辭也公西華仰而嘆之其亦深知夫子之意矣 }
      - { type: j, text: 子疾病子路請禱子曰有諸子路對曰有之誄曰禱爾于上下神祇子曰丘之禱久矣 }
      - { type: z, text: 誄力軌反○禱謂禱於鬼神有諸問有此理否誄者哀死而述其行之詞也上下謂天地天曰神地曰祇禱者悔過遷善以祈神之佑也無其理則不必禱既曰有之則聖人未嘗有過無善可遷其素行固已合於神明故曰丘之禱久矣又士喪禮疾病行禱五祀蓋臣子迫切之至情有不能自已者初不請於病者而後禱也故孔子之於子路不直拒之而但告以無所事禱之意 }
      - { type: j, text: 子曰奢則不孫儉則固與其不孫也寧固 }
      - { type: z, text: 孫去聲○孫順也固陋也奢儉俱失中而奢之害大○晁氏曰不得已而救時之敝也 }
      - { type: j, text: 子曰君子坦蕩蕩小人長戚戚 }
      - { type: z, text: 坦平也蕩蕩寬廣貌○程子曰君子循理故常舒泰小人役於物故多憂戚○程子曰君子坦蕩蕩心廣體胖 }
      - { type: j, text: 子温而厲威而不猛恭而安 }
      - { type: z, text: 厲嚴肅也人之德性本無不備而氣質所賦鮮有不偏惟聖人全體渾然陰陽合德故其中和之氣見於容貌之間者如此門人熟察而詳記之亦可見其用心之密矣抑非知足以知聖人而善言德行不能記故程子以爲曾子之言學者所宜反復而玩心也 }
  - id: pian2
    name: 泰伯第八
    blocks:
      - { type: z, text: 凡二十一章 }
      - { type: j, text: 子曰泰伯其可謂至德也已矣三以天下讓民無得而稱焉 }
      - { type: z, text: 泰伯周大王之長子至德謂德之至極無以復加者也三遜謂固遜也無得而稱其遜隱微無迹可見也蓋大王三子長泰伯次仲雍次季歷大王之時商道寖衰而周日彊大季歷又生子昌有聖德大王因有翦商之志而泰伯不從大王遂欲傳位季歷以及昌泰伯知之即與仲雍逃之荆蠻於是大王乃立季歷傳國至昌而三分天下有其二是爲文王文王崩子發立遂克商而有天下是爲武王夫以泰伯之德當商周之際固足以朝諸侯有天下矣乃棄不取而又泯其迹焉則其德之至極爲如何哉蓋其心即夷齊扣馬之心而事之難處有甚焉者宜夫子之歎息而贊美之也泰伯不從事見春秋傳 }
      - { type: j, text: 子曰恭而無禮則勞慎而無禮則葸勇而無禮則亂直而無禮則絞 }
      - { type: z, text: 葸絲里反絞古卯反○葸畏懼貌絞急切也無禮則無節文故有四者之弊 }
      - { type: j, text: 君子篤於親則民興於仁故舊不遺則民不偷 }
      - { type: z, text: 君子謂在上之人也興起也偷薄也○張子曰人道知所先後則恭不勞謹不葸勇不亂直不絞民化而德厚矣○吳氏曰君子以下當自爲一章乃曾子之言也愚按此一節與上文不相蒙而與首篇謹終追遠之意相類吳說近是 }
      - { type: j, text: 曾子有疾召門弟子曰啓予足啓予手詩云戰戰兢兢如臨深淵如履薄冰而今而後吾知免夫小子 }
      - { type: z, text: 夫音扶○啓開也曾子平日以爲身體受於父母不敢毀傷故於此使弟子開其衾而視之詩小旻之篇戰戰恐懼兢兢戒謹臨淵恐墜履冰恐陷也曾子以其所保之全示門人而言其所以保之之難如此至於將死而後知其得免於毀傷也小子門人也語畢而又呼之以致反復丁寧之意其警之也深矣○程子曰君子曰終小人曰死君子保其身以沒爲終其事也故曾子以全歸爲免矣○尹氏曰父母全而生之子全而歸之曾子臨終而啓手足爲是故也非有得於道能如是乎○范氏曰身體猶不可虧也況虧其行以辱其親乎 }
      - { type: j, text: 曾子有疾孟敬子問之 }
      - { type: z, text: 孟敬子魯大夫仲孫氏名捷問之者問其疾也 }
      - { type: j, text: 曾子言曰鳥之將死其鳴也哀人之將死其言也善 }
      - { type: z, text: 言自言也鳥畏死故鳴哀人窮反本故言善此曾子之謙辭欲敬子知其所言之善而識之也 }
      - { type: j, text: 君子所貴乎道者三動容貌斯遠暴慢矣正顏色斯近信矣出辭氣斯遠鄙倍矣籩豆之事則有司存 }
      - { type: z, text: 遠近並去聲○貴猶重也容貌舉一身而言暴粗厲也慢放肆也信實也正顏色而近信則非色莊也辭言語氣聲氣也鄙凡陋也倍與背同謂背理也籩竹豆豆木豆言道雖無所不在然君子所重者在此三事而已是皆脩身之要為政之本學者所當操存省察而不可有造次顛沛之違者也若夫籩豆之事器數之末道之全體固無不該然其分則有司之守而非君子之所重矣○程子曰動容貌舉一身而言也周旋中禮暴慢斯遠矣正顏色則不妄斯近信矣出辭氣正由中出斯遠鄙倍三者正身而不外求故曰籩豆之事則有司存○尹氏曰養於中則見於外曾子蓋以脩己爲爲政之本若乃器用事物之細則有司存焉 }
      - { type: j, text: 曾子曰以能問於不能以多問於寡有若無實若虛犯而不校昔者吾友嘗從事於斯矣 }
      - { type: z, text: 校計校也友馬氏以爲顏淵是也顏子之心唯知義理之無窮不見物我之有間故能如此○謝氏曰不知有餘在我不足在人不必得爲在己失爲在人非幾於無我者不能也 }
      - { type: j, text: 曾子曰可以託六尺之孤可以寄百里之命臨大節而不可奪也君子人與君子人也 }
      - { type: z, text: 與平聲○其才可以輔幼君攝國政其節至於死生之際而不可奪可謂君子矣與疑詞也決詞設爲問答所 }
      - { type: j, text: 以深著其必然也程子曰節操如是 }
      - { type: z, text: 可謂君子矣 }
      - { type: j, text: 曾子曰士不可以不弘毅任重而道遠 }
      - { type: z, text: 洪寬廣毅強忍也非洪不能勝其重非毅無以致其遠 }
      - { type: j, text: 仁以爲己任不亦重乎死而後已不亦遠乎 }
      - { type: z, text: 仁者人心之全德而必欲以身體而力行之可謂重矣一息尚存此志不容少懈可謂遠矣○程子曰洪而不毅則無規矩而難立毅而不洪則隘陋而無以居之又曰洪大剛毅然後能勝重任而遠到 }
      - { type: j, text: 子曰興於詩 }
      - { type: z, text: 興起也詩本人情有邪有正其爲言旣易知而吟詠之閒抑揚反復其感人又易入故學者之初所以興起其好善惡惡之心而不能自已者必於是而得之 }
      - { type: j, text: 立於禮 }
      - { type: z, text: 禮以恭敬辭遜爲本而有節文度數之詳可以固人肌膚之會筋骸之束故學者之中所以能卓然自立而不爲事物之所揺奪者必於此而得之 }
      - { type: j, text: 成於樂 }
      - { type: z, text: 樂有五聲十二律更唱迭和以爲歌 }
      - { type: j, text: 舞八音之節可以養人之情性而蕩滌 }
      - { type: z, text: 其邪穢消融其查滓故學者之終所以至於義精仁熟而自和順於道德者必於此而得之是學之成也○按內則十年學幼儀十三學樂誦詩二十而後學禮則此三者非小學傳授之次乃大學終身所得之難易先後淺深也○程子曰天下之英才不為少矣特以道學不明故不得有所成就夫古人之詩如今之歌曲雖閭里童稚皆習聞之而知其說故能興起今雖老師宿儒尚不能曉其義况學者乎是不得興於詩也古人自洒掃應對以至冠昏喪祭莫不有禮今皆廢壞是以人倫不明治家無法是不得立於禮也古人之樂聲音所以養其耳采色所以養其目歌詠所以養其性情舞蹈所以養其血脉今皆無之是不得成於樂也是以古之成材也易今之成材也難 }
      - { type: j, text: 子曰民可使由之不可使知之 }
      - { type: z, text: 民可使之由於是理之當然而不能使之知其所以然也○程子曰聖人設教非不欲人家喻而戸曉也然不能使之知但能使之由之爾若曰聖人不使民知則是後世朝四暮三之術也豈聖人之心乎 }
      - { type: j, text: 子曰好勇疾貧亂也人而不仁疾之已甚亂也 }
      - { type: z, text: 好去聲○好勇而不安分則必作亂惡不仁之人而使之無所容則必致亂二者之心善惡雖殊然其生亂一也 }
      - { type: j, text: 子曰如有周公之才之美使驕且吝其餘不足觀也已 }
      - { type: z, text: 才美謂智能技藝之美驕矜夸吝鄙嗇也○程子曰此甚言驕吝之不可也蓋有周公之德則自無驕吝若但有周公之才而驕吝焉亦不足觀矣又曰驕氣盈吝氣歉愚謂驕吝雖有盈歉之殊然其勢常相因蓋驕者吝之枝葉吝者驕之本根故嘗驗之天下之人未有驕而不吝吝而不驕者也 }
      - { type: j, text: 子曰三年學不至於穀不易得也 }
      - { type: z, text: 易去聲○穀禄也至疑當作志爲學之乆而不求禄如此之人不易得也○楊氏曰雖子張之賢猶以千禄爲問况其下者乎然則三年學而不至於穀宜不易得也 }
      - { type: j, text: 子曰篤信好學守死善道 }
      - { type: z, text: 好去聲○篤厚而力也不篤信則不能好學然篤信而不好學則所信或非其正不守死則不能以善其道然守死而不足以善其道則亦徒死而已蓋守死者篤信之效善道者好學之功 }
      - { type: j, text: 危邦不入亂邦不居天下有道則見無道則隱 }
      - { type: z, text: 見賢遍反○君子見危授命則仕危邦者無可去之義在外則不入可也亂邦未危而刑政紀綱紊矣故潔其身而去之天下舉一世而言無道則隱其身而不見也此惟篤信好學守死善道者能之 }
      - { type: j, text: 邦有道貧且賤焉恥也邦無道富且貴焉恥也 }
      - { type: z, text: 世治而無可行之道世亂而無能守之節碌碌庸人不足以為士矣可恥之甚也○晁氏曰有學有守而去就之義潔出處之分明然後為君子之全德也 }
      - { type: j, text: 子曰不在其位不謀其政 }
      - { type: z, text: 程子曰不在其位則不任其事也若君大夫問而告者則有矣 }
      - { type: j, text: 子曰師摯之始關雎之亂洋洋乎盈耳哉 }
      - { type: z, text: 摯音至雎七余反○師摯魯樂師名摯也亂樂之卒章也史記曰關雎之亂以為風始洋洋美盛意孔子自衛反魯而正樂適摯在官之初故樂之美盛如此 }
      - { type: j, text: 子曰狂而不直侗而不愿悾悾而不信吾不知之矣 }
      - { type: z, text: 侗音通悾音空○侗無知貌愿謹厚也悾悾無能貌吾不知之者甚絕之之辭亦不屑之教誨也○蘇氏曰天之生物氣質不齊其中材以下有是德則有是病有是病必有是德故馬之蹄齧者必善走其不善者必馴有是病而無是德則天下之棄才也 }
      - { type: j, text: 子曰學如不及猶恐失之 }
      - { type: z, text: 言人之爲學旣如有所不及矣而其心猶竦然惟恐其或失之警學者當如是也○程子曰學如不及猶恐失之不得放過才說姑待明日便不可也 }
      - { type: j, text: 子曰巍巍乎舜禹之有天下也而不與焉 }
      - { type: z, text: 與去聲○巍巍高大之貌不與猶言不相關言其不以位為樂也 }
      - { type: j, text: 子曰大哉堯之為君也巍巍乎唯天為大唯堯則之蕩蕩乎民無能名焉 }
      - { type: z, text: 唯猶獨也則猶準也蕩蕩廣遠之稱也言物之高大莫有過於天者而獨堯之德能與之準故其德之廣遠亦如天之不可以言語形容也 }
      - { type: j, text: 巍巍乎其有成功也煥乎其有文章 }
      - { type: z, text: 成功事業也煥光明之貌文章禮樂法度也堯之德不可名其可見者此爾○尹氏曰天道之大無為而成唯堯則之以治天下故民無得而名焉所可名者其功業文章巍然煥然而巳 }
      - { type: j, text: 舜有臣五人而天下治 }
      - { type: z, text: 治去聲○禹稷契臯陶伯益 }
      - { type: j, text: 武王曰予有亂臣十人 }
      - { type: z, text: 書泰誓之辭○馬氏曰亂治也十人謂周公旦召公奭太公望畢公榮公太顛閎夭散冝生南宫适其一人謂文母劉侍讀以爲子無臣母之義蓋邑姜也九人治外邑姜治内或曰亂本作乿古治字也 }
      - { type: j, text: 孔子曰才難不其然乎唐虞之際於斯爲盛有婦人焉九人而已 }
      - { type: z, text: 稱孔子者上係武王君臣之際記者謹之才難蓋古語而孔子然之也才者德之用也唐虞堯舜有天下之號際交會之間言周室人才之多惟唐虞之際乃盛於此降自夏商皆不能及然猶但有此數人爾是才之難得也 }
      - { type: j, text: 三分天下有其二以服事殷周之德其可謂至德也已矣 }
      - { type: z, text: 春秋傳曰文王率商之畔國以事紂蓋天下歸文王者六州荆梁雍豫徐楊也惟青兖冀尚屬紂耳〇范氏曰文王之德足以代商天與之人歸之乃不取而服事焉所以爲至德也孔子因武王之言而及文王之德且與泰伯皆以至德稱之其指微矣或曰冝斷三分以下別以孔子曰起之而自爲一章 }
      - { type: j, text: 子曰禹吾無間然矣菲飲食而致孝乎鬼神惡衣服而致美乎黻冕卑宮室而盡力乎溝洫禹吾無間然矣 }
      - { type: z, text: 間去聲菲音匪黻音弗洫呼域反○ }
      - { type: j, text: 間鑄隙也謂指其鑄隙而非議之也菲 }
      - { type: z, text: 薄也致孝鬼神謂享祀豐潔衣服常服黻蔽膝也以韋爲之冕冠也皆祭服也溝洫田間水道以正疆界備旱潦者也或豐或儉各適其宜所以無鑄隙之可議也故再言以深美之○楊氏曰薄於自奉而所勤者民之事所致飾者宗廟朝廷之禮所謂有天下而不與也夫何間然之有 }
      - { type: j, text: 論語卷第四 }
