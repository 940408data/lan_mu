labels:
  - page: 144
    col: 1
    role: j
    text: 論語卷第四朱熹集注
  - page: 144
    col: 2
    role: title
    text: 述而第七
  - page: 144
    col: 3
    role: z
    text: 此篇多記聖人謙己誨人之辭及其
  - page: 144
    col: 4
    role: z
    text: 容貌行事之實凡三十七章
  - page: 144
    col: 5
    role: j
    text: 子曰述而不作信而好古竊比於我老
  - page: 144
    col: 6
    role: j
    text: 彭
  - page: 144
    col: 7
    role: z
    text: 好去聲○述傳舊而已作則創始也
  - page: 144
    col: 8
    role: z
    text: 故作非聖人不能而述則賢者可及
  - page: 145
    col: 1
    role: z
    text: 竊比尊之之辭我親之之辭老彭商
  - page: 145
    col: 2
    role: z
    text: 賢大夫見大戴禮蓋信古而傳述者
  - page: 145
    col: 3
    role: z
    text: 也孔子刪詩書定禮樂贊周易修春
  - page: 145
    col: 4
    role: z
    text: 秋皆傳先王之舊而未嘗有所作也
  - page: 145
    col: 5
    role: z
    text: 故其自言如此蓋不唯不敢當作者
  - page: 145
    col: 6
    role: z
    text: 之聖而亦不敢顯然自附於古之賢
  - page: 145
    col: 7
    role: z
    text: 人蓋其德愈盛而心愈下不自知其
  - page: 145
    col: 8
    role: z
    text: 辭之謙也然當是時作者略備夫子
  - page: 145
    col: 9
    role: z
    text: 蓋集羣聖之大成而折衷之其事雖
  - page: 145
    col: 10
    role: z
    text: 述而功則倍於作矣此又不可不知
  - page: 145
    col: 11
    role: z
    text: 也
  - page: 145
    col: 12
    role: j
    text: 子曰默而識之學而不厭誨人不倦何
  - page: 145
    col: 13
    role: j
    text: 有於我哉
  - page: 145
    col: 14
    role: z
    text: 識音志又如字○識記也默識謂不
  - page: 145
    col: 15
    role: z
    text: 言而存諸心也一說識知也不言而
  - page: 145
    col: 16
    role: z
    text: 心解也前說近是何有於我言何者
  - page: 146
    col: 1
    role: z
    text: 能有於我也三者已非聖人之極至
  - page: 146
    col: 2
    role: z
    text: 而猶不敢當則謙而又謙之辭也
  - page: 146
    col: 3
    role: j
    text: 子曰德之不脩學之不講聞義不能徙
  - page: 146
    col: 4
    role: j
    text: 不善不能改是吾憂也
  - page: 146
    col: 5
    role: z
    text: 尹氏曰德必脩而後成學必講而後
  - page: 146
    col: 6
    role: z
    text: 明見善能徙改過不吝此四者日新
  - page: 146
    col: 7
    role: z
    text: 之要也苟未能之聖人猶憂况學者
  - page: 146
    col: 8
    role: z
    text: 乎
  - page: 146
    col: 9
    role: j
    text: 子之燕居申申如也夭夭如也
  - page: 146
    col: 10
    role: z
    text: 燕居間暇無事之時楊氏曰申申其
  - page: 146
    col: 11
    role: z
    text: 容舒也夭夭其色愉也○程子曰此
  - page: 146
    col: 12
    role: z
    text: 弟子善形容聖人處也爲申申字說
  - page: 146
    col: 13
    role: z
    text: 不盡故更着夭夭字今人燕居之時
  - page: 146
    col: 14
    role: z
    text: 不怠惰放肆必太嚴厲嚴厲時着此
  - page: 146
    col: 15
    role: z
    text: 四字不得怠惰放肆時亦着此四字
  - page: 146
    col: 16
    role: z
    text: 不得唯聖人便自有中和之氣
  - page: 147
    col: 1
    role: j
    text: 子曰甚矣吾衰也久矣吾不復夢見周
  - page: 147
    col: 2
    role: j
    text: 公
  - page: 147
    col: 3
    role: z
    text: 復扶又反○孔子盛時志欲行周公
  - page: 147
    col: 4
    role: z
    text: 之道故夢寐之間如或見之至其老
  - page: 147
    col: 5
    role: z
    text: 而不能行也則無復是心而亦無復
  - page: 147
    col: 6
    role: z
    text: 是憂矣故因此而自歎其衰之甚也
  - page: 147
    col: 7
    role: z
    text: ○程子曰孔子盛時寤寐常存行周
  - page: 147
    col: 8
    role: z
    text: 公之道及其老也則志慮衰而不可
  - page: 147
    col: 9
    role: z
    text: 以有爲矣蓋存道者心無老少之異
  - page: 147
    col: 10
    role: z
    text: 而行道者身老則衰也
  - page: 147
    col: 11
    role: j
    text: 子曰志於道
  - page: 147
    col: 12
    role: z
    text: 志者心之所之之謂道則人倫日用
  - page: 147
    col: 13
    role: z
    text: 之間所當行者是也知此而心必之
  - page: 147
    col: 14
    role: z
    text: 焉則所適者正而無他岐之惑矣
  - page: 147
    col: 15
    role: j
    text: 據於德
  - page: 147
    col: 16
    role: z
    text: 據者執守之意德則行道而有得於
  - page: 148
    col: 1
    role: z
    text: 心而不失之謂也得之於心而守之
  - page: 148
    col: 2
    role: z
    text: 不失則終始惟一而有日新之功矣
  - page: 148
    col: 3
    role: j
    text: 依於仁
  - page: 148
    col: 4
    role: z
    text: 依者不違之謂仁則私欲盡去而心
  - page: 148
    col: 5
    role: z
    text: 德之全也功夫至此而無終食之違
  - page: 148
    col: 6
    role: z
    text: 則存養之熟無適而非天理之流行
  - page: 148
    col: 7
    role: z
    text: 矣
  - page: 148
    col: 8
    role: j
    text: 游於藝
  - page: 148
    col: 9
    role: z
    text: 游者玩物適情之謂藝則禮樂之文
  - page: 148
    col: 10
    role: z
    text: 射御書數之法皆至理所寓而日用
  - page: 148
    col: 11
    role: z
    text: 之不可闕者也朝夕游焉以博其義
  - page: 148
    col: 12
    role: z
    text: 理之趣則應務有餘而心亦無所放
  - page: 148
    col: 13
    role: z
    text: 矣○此章言人之爲學當如是也蓋
  - page: 148
    col: 14
    role: z
    text: 學莫先於立志志道則心存於正而
  - page: 148
    col: 15
    role: z
    text: 不他據德則道得於心而不失依仁
  - page: 148
    col: 16
    role: z
    text: 則德性常用而物欲不行游藝則小
  - page: 149
    col: 1
    role: z
    text: 物不遺而動息有養學者於此有以
  - page: 149
    col: 2
    role: z
    text: 不失其先後之序輕重之倫焉則本
  - page: 149
    col: 3
    role: z
    text: 末兼該內外交養日用之間無少間
  - page: 149
    col: 4
    role: z
    text: 隙而涵泳從容忽不自知其入於聖
  - page: 149
    col: 5
    role: z
    text: 賢之域矣
  - page: 149
    col: 6
    role: j
    text: 子曰自行束脩以上吾未嘗無誨焉
  - page: 149
    col: 7
    role: z
    text: 脩脯也十脡爲束古者相見必執贄
  - page: 149
    col: 8
    role: z
    text: 以爲禮束脩其至薄者蓋人之有生
  - page: 149
    col: 9
    role: z
    text: 同具此理故聖人之於人無不欲其
  - page: 149
    col: 10
    role: z
    text: 入於善但不知來學則無往教之禮
  - page: 149
    col: 11
    role: z
    text: 故苟以禮來則無不有以教之也
  - page: 149
    col: 12
    role: j
    text: 子曰不憤不啓不悱不發舉一隅不以
  - page: 149
    col: 13
    role: j
    text: 三隅反則不復也
  - page: 149
    col: 14
    role: z
    text: 憤房粉反悱芳匪反復扶又反○憤
  - page: 149
    col: 15
    role: z
    text: 者心求通而未得之意悱者口欲言
  - page: 149
    col: 16
    role: z
    text: 而未能之貌啓謂開其意發謂達其
  - page: 150
    col: 1
    role: z
    text: 辭物之有四隅者舉一可知其三反
  - page: 150
    col: 2
    role: z
    text: 者還以相證之義復再告也上章已
  - page: 150
    col: 3
    role: z
    text: 言聖人誨人不倦之意因并記此欲
  - page: 150
    col: 4
    role: z
    text: 學者勉於用力以為受教之地也○
  - page: 150
    col: 5
    role: z
    text: 程子曰憤悱誠意之見於色辭者也
  - page: 150
    col: 6
    role: z
    text: 待其誠至而後告之既告之又必待
  - page: 150
    col: 7
    role: z
    text: 其自得乃復告爾又曰不待憤悱而
  - page: 150
    col: 8
    role: z
    text: 發則知之不能堅固待其憤悱而後
  - page: 150
    col: 9
    role: z
    text: 發則沛然矣
  - page: 150
    col: 10
    role: j
    text: 子食於有喪者之側未嘗飽也
  - page: 150
    col: 11
    role: z
    text: 臨喪哀不能甘也
  - page: 150
    col: 12
    role: j
    text: 子於是日哭則不歌
  - page: 150
    col: 13
    role: z
    text: 哭謂弔哭一日之内餘哀未忘自不
  - page: 150
    col: 14
    role: z
    text: 能歌也○謝氏曰學者於此二者可
  - page: 150
    col: 15
    role: z
    text: 見聖人情性之正也能識聖人之情
  - page: 150
    col: 16
    role: z
    text: 性然後可以學道
  - page: 151
    col: 1
    role: j
    text: 子謂顏淵曰用之則行舍之則藏惟我
  - page: 151
    col: 2
    role: j
    text: 與爾有是夫
  - page: 151
    col: 3
    role: j
    text: 舍上聲夫音扶○尹氏曰用舍無與
  - page: 151
    col: 4
    role: z
    text: 與己行藏安於所遇命不足道也顏
  - page: 151
    col: 5
    role: z
    text: 子幾於聖人故亦能之
  - page: 151
    col: 6
    role: j
    text: 子路曰子行三軍則誰與
  - page: 151
    col: 7
    role: z
    text: 萬二千五百人爲軍大國三軍子路
  - page: 151
    col: 8
    role: z
    text: 見孔子獨美顏淵自負其勇意夫子
  - page: 151
    col: 9
    role: z
    text: 若行三軍必與己同
  - page: 151
    col: 10
    role: j
    text: 子曰暴虎馮河死而無悔者吾不與也
  - page: 151
    col: 11
    role: j
    text: 必也臨事而懼好謀而成者也
  - page: 151
    col: 12
    role: j
    text: 馮皮冰反好去聲○暴虎徒搏馮河
  - page: 151
    col: 13
    role: z
    text: 徒涉懼謂敬其事成謂成其謀言此
  - page: 151
    col: 14
    role: z
    text: 皆以抑其勇而教之然行師之要實
  - page: 151
    col: 15
    role: z
    text: 不外此子路蓋不知也○謝氏曰聖
  - page: 151
    col: 16
    role: z
    text: 人於行藏之閒無意無必其行非貪
  - page: 152
    col: 1
    role: j
    text: 位其藏非獨善也若有欲心則不用
  - page: 152
    col: 2
    role: j
    text: 而求行舍之而不藏矣是以惟顏子
  - page: 152
    col: 3
    role: j
    text: 爲可以與於此子路雖非有欲心者
  - page: 152
    col: 4
    role: j
    text: 然未能無固必也至以行三軍爲問
  - page: 152
    col: 5
    role: j
    text: 則其論益卑矣夫子之言蓋因其失
  - page: 152
    col: 6
    role: j
    text: 而救之夫不謀無成不懼必敗小事
  - page: 152
    col: 7
    role: z
    text: 尚然而況於行三軍乎
  - page: 152
    col: 8
    role: j
    text: 子曰冨而可求也雖執鞭之士吾亦爲
  - page: 152
    col: 9
    role: j
    text: 之如不可求從吾所好
  - page: 152
    col: 10
    role: z
    text: 好去聲○執鞭賤者之事設言冨若
  - page: 152
    col: 11
    role: j
    text: 可求則雖身爲賤役以求之亦所不
  - page: 152
    col: 12
    role: j
    text: 辭然有命焉非求之可得也則安於
  - page: 152
    col: 13
    role: j
    text: 義理而巳矣何必徒取辱哉○蘇氏
  - page: 152
    col: 14
    role: z
    text: 曰聖人未甞有意於求冨也豈問其
  - page: 152
    col: 15
    role: z
    text: 可不可哉爲此語者特以明其決不
  - page: 152
    col: 16
    role: z
    text: 可求爾○楊氏曰君子非惡冨貴而
  - page: 153
    col: 1
    role: z
    text: 不求以其在天無可求之道也
  - page: 153
    col: 2
    role: j
    text: 子之所慎齊戰疾
  - page: 153
    col: 3
    role: z
    text: 齊側皆反○齊之爲言齊也將祭而
  - page: 153
    col: 4
    role: z
    text: 齊其思慮之不齊者以交於神明也
  - page: 153
    col: 5
    role: z
    text: 誠之至與不至神之饗與不饗皆决
  - page: 153
    col: 6
    role: z
    text: 於此戰則衆之死生國之存亡繫焉
  - page: 153
    col: 7
    role: z
    text: 疾又吾身之所以死生存亡者皆不
  - page: 153
    col: 8
    role: z
    text: 可以不謹也○尹氏曰夫子無所不
  - page: 153
    col: 9
    role: z
    text: 謹弟子記其大者耳
  - page: 153
    col: 10
    role: j
    text: 子在齊聞韶三月不知肉味曰不圖爲
  - page: 153
    col: 11
    role: j
    text: 樂之至於斯也
  - page: 153
    col: 12
    role: z
    text: 史記三月上有學之二字不知肉味
  - page: 153
    col: 13
    role: z
    text: 蓋心一於是而不及乎他也曰不意
  - page: 153
    col: 14
    role: z
    text: 舜之作樂至於如此之美則有以極
  - page: 153
    col: 15
    role: z
    text: 其情文之備而不覺其歎息之深也
  - page: 153
    col: 16
    role: z
    text: 蓋非聖人不足以及此○范氏曰韶
  - page: 154
    col: 1
    role: j
    text: 盡美又盡善樂之無以加此也故學
  - page: 154
    col: 2
    role: j
    text: 之三月不知肉味而歎美之如此誠
  - page: 154
    col: 3
    role: j
    text: 之至感之深也
  - page: 154
    col: 4
    role: j
    text: 冉有曰夫子為衛君乎子貢曰諾吾將
  - page: 154
    col: 5
    role: j
    text: 問之
  - page: 154
    col: 6
    role: z
    text: 為去聲○為猶助也衛君出公輒也
  - page: 154
    col: 7
    role: z
    text: 靈公逐其世子蒯瞶公薨而國人立
  - page: 154
    col: 8
    role: z
    text: 蒯瞶之子輒於是晉納蒯瞶而輒拒
  - page: 154
    col: 9
    role: z
    text: 之時孔子居衛衛人以蒯瞶得罪於
  - page: 154
    col: 10
    role: z
    text: 父而輒嫡孫當立故冉有疑而問之
  - page: 154
    col: 11
    role: z
    text: 諾應辭也
  - page: 154
    col: 12
    role: j
    text: 入曰伯夷叔齊何人也曰古之賢人也
  - page: 154
    col: 13
    role: j
    text: 曰怨乎曰求仁而得仁又何怨出曰夫
  - page: 154
    col: 14
    role: j
    text: 子不為也
  - page: 154
    col: 15
    role: j
    text: 伯夷叔齊孤竹君之二子其父將死
  - page: 154
    col: 16
    role: j
    text: 遺命立叔齊父卒叔齊遜伯夷伯夷
  - page: 155
    col: 1
    role: z
    text: 曰父命也遂逃去叔齊亦不立而逃
  - page: 155
    col: 2
    role: z
    text: 之國人立其中子其後武王伐紂夷
  - page: 155
    col: 3
    role: z
    text: 齊扣馬而諫武王滅商夷齊恥食周
  - page: 155
    col: 4
    role: z
    text: 粟去隱于首陽山遂餓而死怨猶悔
  - page: 155
    col: 5
    role: z
    text: 也君子居是邦不非其大夫況其君
  - page: 155
    col: 6
    role: z
    text: 乎故子貢不斥衛君而以夷齊為問
  - page: 155
    col: 7
    role: z
    text: 夫子告之如此則其不為衛君可知
  - page: 155
    col: 8
    role: z
    text: 矣蓋伯夷以父命為尊叔齊以天倫
  - page: 155
    col: 9
    role: z
    text: 為重其遜國也皆求所以合乎天理
  - page: 155
    col: 10
    role: z
    text: 之正而即乎人心之安既而各得其
  - page: 155
    col: 11
    role: z
    text: 志焉則視棄其國猶敝蹝爾何怨之
  - page: 155
    col: 12
    role: z
    text: 有若衛輒之據國拒父而唯恐失之
  - page: 155
    col: 13
    role: z
    text: 其不可同年而語明矣○程子曰伯
  - page: 155
    col: 14
    role: z
    text: 夷叔齊遜國而逃諫伐而餓終無怨
  - page: 155
    col: 15
    role: z
    text: 悔夫子以為賢故知其不與輒也
  - page: 155
    col: 16
    role: j
    text: 子曰飯疏食飲水曲肱而枕之樂亦在
  - page: 156
    col: 1
    role: j
    text: 其中矣不義而冨且貴於我如浮雲
  - page: 156
    col: 2
    role: z
    text: 飯符晚反食音嗣枕去聲樂音洛。
  - page: 156
    col: 3
    role: z
    text: 飯食之也䟽食麤飯也聖人之心渾
  - page: 156
    col: 4
    role: z
    text: 然天理雖處困極而樂亦無不在焉
  - page: 156
    col: 5
    role: z
    text: 其視不義之冨貴如浮雲之無有漠
  - page: 156
    col: 6
    role: z
    text: 然無所動於其中也○程子曰非樂
  - page: 156
    col: 7
    role: z
    text: 䟽食飲水也雖䟽食飲水不能改其
  - page: 156
    col: 8
    role: z
    text: 樂也不義之冨貴視之輕如浮雲然
  - page: 156
    col: 9
    role: z
    text: 又曰湏知所樂者何事
  - page: 156
    col: 10
    role: j
    text: 子曰加我數年五十以學易可以無大
  - page: 156
    col: 11
    role: j
    text: 過矣
  - page: 156
    col: 12
    role: z
    text: 劉聘君見元城劉忠定公自言嘗讀
  - page: 156
    col: 13
    role: z
    text: 他論加作假五十作卒蓋加假聲相
  - page: 156
    col: 14
    role: z
    text: 近而誤讀卒與五十字相似而誤分
  - page: 156
    col: 15
    role: z
    text: 也愚按此章之言史記作假我數年
  - page: 156
    col: 16
    role: z
    text: 若是我於易則彬彬矣加正作假而
  - page: 157
    col: 1
    role: z
    text: 無五十字蓋是時孔子年已幾七十
  - page: 157
    col: 2
    role: z
    text: 矣五十字誤無疑也學易則明乎吉
  - page: 157
    col: 3
    role: z
    text: 凶消長之理進退存亡之道故可以
  - page: 157
    col: 4
    role: z
    text: 無大過蓋聖人深見易道之無窮而
  - page: 157
    col: 5
    role: z
    text: 言此以教人使知其不可不學而又
  - page: 157
    col: 6
    role: z
    text: 不可以易而學也
  - page: 157
    col: 7
    role: j
    text: 子所雅言詩書執禮皆雅言也
  - page: 157
    col: 8
    role: z
    text: 雅常也執守也詩以理情性書以道
  - page: 157
    col: 9
    role: z
    text: 政事禮以謹節文皆切於日用之實
  - page: 157
    col: 10
    role: z
    text: 故常言之禮獨言執者以人所執守
  - page: 157
    col: 11
    role: z
    text: 而言非徒誦說而已也○程子曰孔
  - page: 157
    col: 12
    role: z
    text: 子雅素之言止於如此若性與天道
  - page: 157
    col: 13
    role: z
    text: 則有不可得而聞者要在默而識之
  - page: 157
    col: 14
    role: z
    text: 也○謝氏曰此因學易之語而類記
  - page: 157
    col: 15
    role: z
    text: 之
  - page: 157
    col: 16
    role: j
    text: 葉公問孔子於子路子路不對
  - page: 158
    col: 1
    role: z
    text: 葉舒渉反○葉公楚葉縣尹沈諸梁
  - page: 158
    col: 2
    role: z
    text: 字子髙僭稱公也葉公不知孔子必
  - page: 158
    col: 3
    role: z
    text: 有非所問而問者故子路不對抑亦
  - page: 158
    col: 4
    role: j
    text: 以聖人之德實有未易名言者與
  - page: 158
    col: 5
    role: j
    text: 子曰女奚不曰其爲人也發憤忘食樂
  - page: 158
    col: 6
    role: j
    text: 以忘憂不知老之將至云爾
  - page: 158
    col: 7
    role: z
    text: 未得則發憤而忘食已得則樂之而
  - page: 158
    col: 8
    role: z
    text: 忘憂以是二者俛焉日有孳孳而不
  - page: 158
    col: 9
    role: z
    text: 知年數之不足但自言其好學之篤
  - page: 158
    col: 10
    role: z
    text: 耳然深味之則見其全體至極純亦
  - page: 158
    col: 11
    role: z
    text: 不已之妙有非聖人不能及者蓋凡
  - page: 158
    col: 12
    role: z
    text: 夫子之自言類如此學者宜致思焉
  - page: 158
    col: 13
    role: j
    text: 子曰我非生而知之者好古敏以求之
  - page: 158
    col: 14
    role: j
    text: 者也
  - page: 158
    col: 15
    role: z
    text: 好去聲○生而知之者氣質清明義
  - page: 158
    col: 16
    role: z
    text: 理昭著不待學而知也敏速也謂汲
  - page: 159
    col: 1
    role: z
    text: 汲也。尹氏曰孔子以生知之聖每
  - page: 159
    col: 2
    role: z
    text: 云好學者非惟勉人也蓋生而可知
  - page: 159
    col: 3
    role: z
    text: 者義理爾若夫禮樂名物古今事變
  - page: 159
    col: 4
    role: z
    text: 亦必待學而後有以驗其實也
  - page: 159
    col: 5
    role: j
    text: 子不語怪力亂神
  - page: 159
    col: 6
    role: z
    text: 怪異勇力悖亂之事非理之正固聖
  - page: 159
    col: 7
    role: z
    text: 人所不語鬼神造化之迹雖非不正
  - page: 159
    col: 8
    role: z
    text: 然非窮理之至有未易明者故亦不
  - page: 159
    col: 9
    role: z
    text: 輕以語人也。謝氏曰聖人語常而
  - page: 159
    col: 10
    role: z
    text: 不語怪語德而不語力語治而不語
  - page: 159
    col: 11
    role: z
    text: 亂語人而不語神
  - page: 159
    col: 12
    role: j
    text: 子曰三人行必有我師焉擇其善者而
  - page: 159
    col: 13
    role: j
    text: 從之其不善者而改之
  - page: 159
    col: 14
    role: z
    text: 三人同行其一我也彼二人者一善
  - page: 159
    col: 15
    role: z
    text: 一惡則我從其善而改其惡焉是二
  - page: 159
    col: 16
    role: z
    text: 人者皆我師也。尹氏曰見賢思齊
  - page: 160
    col: 1
    role: z
    text: 見不賢而內自省則善惡皆我之師
  - page: 160
    col: 2
    role: z
    text: 進善其有窮乎
  - page: 160
    col: 3
    role: j
    text: 子曰天生德於予桓魋其如予何
  - page: 160
    col: 4
    role: z
    text: 魋徒雷反○魋魋宋司馬向魋也出
  - page: 160
    col: 5
    role: z
    text: 於威公故又稱威氏魋欲害孔子
  - page: 160
    col: 6
    role: z
    text: 子言天既賦我以如是之德則威魋
  - page: 160
    col: 7
    role: z
    text: 其奈我何言必不能違天害已
  - page: 160
    col: 8
    role: j
    text: 子曰二三子以我爲隱乎吾無隱乎爾
  - page: 160
    col: 9
    role: j
    text: 吾無行而不與二三子者是丘也
  - page: 160
    col: 10
    role: z
    text: 諸弟子以夫子之道高深不可幾及
  - page: 160
    col: 11
    role: z
    text: 故疑其有隱而不知聖人作止語默
  - page: 160
    col: 12
    role: z
    text: 無非教也故夫子以此言曉之與猶
  - page: 160
    col: 13
    role: z
    text: 示也○程子曰聖人之道猶天然門
  - page: 160
    col: 14
    role: z
    text: 弟子親炙而冀及之然後知其高且
  - page: 160
    col: 15
    role: z
    text: 遠也使誠以爲不可及則趨向之心
  - page: 160
    col: 16
    role: z
    text: 不幾於怠乎故聖人之教常俯而就
  - page: 161
    col: 1
    role: z
    text: 之如此非獨使資質庸下者勉思企
  - page: 161
    col: 2
    role: z
    text: 及而才氣髙邁者亦不敢躐易而進
  - page: 161
    col: 3
    role: z
    text: 也○吕氏曰聖人體道無隱與天象
  - page: 161
    col: 4
    role: z
    text: 昭然莫非至教常以示人而人自不
  - page: 161
    col: 5
    role: z
    text: 察
  - page: 161
    col: 6
    role: j
    text: 子以四教文行忠信
  - page: 161
    col: 7
    role: z
    text: 行去聲○程子曰教人以學文脩行
  - page: 161
    col: 8
    role: z
    text: 而存忠信也忠信本也
  - page: 161
    col: 9
    role: j
    text: 子曰聖人吾不得而見之矣得見君子
  - page: 161
    col: 10
    role: j
    text: 者斯可矣
  - page: 161
    col: 11
    role: z
    text: 聖人神明不測之號君子才德出衆
  - page: 161
    col: 12
    role: z
    text: 之名
  - page: 161
    col: 13
    role: j
    text: 子曰善人吾不得而見之矣得見有恒
  - page: 161
    col: 14
    role: j
    text: 者斯可矣
  - page: 161
    col: 15
    role: z
    text: 恒胡登反○子曰字疑衍文恒常乆
  - page: 161
    col: 16
    role: z
    text: 之意○張子曰有常者不貳其心善
  - page: 162
    col: 1
    role: z
    text: 人者志於仁而無惡
  - page: 162
    col: 2
    role: j
    text: 亡而爲有虛而爲盈約而爲泰難乎有
  - page: 162
    col: 3
    role: j
    text: 恒矣
  - page: 162
    col: 4
    role: z
    text: 亡讀爲無○三者皆虛夸之事凡若
  - page: 162
    col: 5
    role: j
    text: 此者必不能守其常也○張敬夫曰
  - page: 162
    col: 6
    role: j
    text: 聖人君子以學言善人有恒者以質
  - page: 162
    col: 7
    role: j
    text: 言愚謂有恒者之與聖人高下固懸
  - page: 162
    col: 8
    role: j
    text: 絶矣然未有不自有恒而能至於聖
  - page: 162
    col: 9
    role: j
    text: 者也故章末申言有恒之義其示人
  - page: 162
    col: 10
    role: j
    text: 入德之門可謂深切而著明矣
  - page: 162
    col: 11
    role: j
    text: 子釣而不綱弋不射宿
  - page: 162
    col: 12
    role: z
    text: 射食亦反○綱以大繩屬網絶流而
  - page: 162
    col: 13
    role: j
    text: 漁者也弋以生絲繫矢而射也宿宿
  - page: 162
    col: 14
    role: j
    text: 鳥○洪氏曰孔子少貧賤爲養與祭或
  - page: 162
    col: 15
    role: j
    text: 不得已而釣弋如獵較是也然盡物
  - page: 162
    col: 16
    role: j
    text: 取之出其不意亦不爲也此可見仁
  - page: 163
    col: 1
    role: z
    text: 人之本心矣待物如此待人可知小
  - page: 163
    col: 2
    role: z
    text: 者如此大者可知
  - page: 163
    col: 3
    role: j
    text: 子曰蓋有不知而作之者我無是也多
  - page: 163
    col: 4
    role: j
    text: 聞擇其善者而從之多見而識之知之
  - page: 163
    col: 5
    role: j
    text: 次也
  - page: 163
    col: 6
    role: z
    text: 識音志○不知而作不知其理而妄
  - page: 163
    col: 7
    role: z
    text: 作也孔子自言未嘗妄作蓋亦謙辭
  - page: 163
    col: 8
    role: z
    text: 然亦可見其無所不知也識記也所
  - page: 163
    col: 9
    role: z
    text: 從不可不擇記則善惡皆當存之以
  - page: 163
    col: 10
    role: z
    text: 備參考如此者雖未能實知其理亦
  - page: 163
    col: 11
    role: z
    text: 可以次於知之者也
  - page: 163
    col: 12
    role: j
    text: 互鄉難與言童子見門人惑
  - page: 163
    col: 13
    role: z
    text: 見賢遍反○互鄉鄉名其人習於不
  - page: 163
    col: 14
    role: z
    text: 善難與言善惑者疑夫子不當見之
  - page: 163
    col: 15
    role: z
    text: 也
  - page: 163
    col: 16
    role: j
    text: 子曰與其進也不與其退也唯何甚人
  - page: 164
    col: 1
    role: j
    text: 潔己以進與其潔也不保其往也
  - page: 164
    col: 2
    role: z
    text: 疑此章有錯簡人潔至往也十四字
  - page: 164
    col: 3
    role: z
    text: 當在與其進也之前潔修治也與許
  - page: 164
    col: 4
    role: z
    text: 也往前日也言人潔己而來但許其
  - page: 164
    col: 5
    role: z
    text: 能自潔耳固不能保其前日所爲之
  - page: 164
    col: 6
    role: z
    text: 善惡也但許其進而來見耳非許其
  - page: 164
    col: 7
    role: z
    text: 旣退而爲不善也蓋不追其旣往不
  - page: 164
    col: 8
    role: z
    text: 逆其將來以是心至斯受之耳唯字
  - page: 164
    col: 9
    role: z
    text: 上下疑又有闕文大抵亦不爲已甚
  - page: 164
    col: 10
    role: z
    text: 之意○程子曰聖人待物之洪如此
  - page: 164
    col: 11
    role: j
    text: 子曰仁遠乎哉我欲仁斯仁至矣
  - page: 164
    col: 12
    role: z
    text: 仁者心之德非在外也放而不求故
  - page: 164
    col: 13
    role: z
    text: 有以爲遠者反而求之則即此而在
  - page: 164
    col: 14
    role: z
    text: 矣夫豈遠哉○程子曰爲仁由己欲
  - page: 164
    col: 15
    role: z
    text: 之則至何遠之有
  - page: 164
    col: 16
    role: j
    text: 陳司敗問昭公知禮乎孔子曰知禮
  - page: 165
    col: 1
    role: z
    text: 陳國名司敗官名即司寇也昭公魯
  - page: 165
    col: 2
    role: z
    text: 君名稠習於威儀之節當時以爲知
  - page: 165
    col: 3
    role: z
    text: 禮故司敗以爲問而孔子答之如此
  - page: 165
    col: 4
    role: j
    text: 孔子退揖巫馬期而進之曰吾聞君子
  - page: 165
    col: 5
    role: j
    text: 不黨君子亦黨乎君取於吳爲同姓謂
  - page: 165
    col: 6
    role: j
    text: 之吳孟子君而知禮孰不知禮
  - page: 165
    col: 7
    role: z
    text: 取七住反○巫馬姓期字孔子弟子
  - page: 165
    col: 8
    role: z
    text: 名施司敗揖而進之也相助匿非曰
  - page: 165
    col: 9
    role: z
    text: 黨禮不娶同姓而魯與吳皆姬姓謂
  - page: 165
    col: 10
    role: z
    text: 之吳孟子者諱之使若宋女子姓者
  - page: 165
    col: 11
    role: z
    text: 然
  - page: 165
    col: 12
    role: j
    text: 巫馬期以告子曰丘也幸苟有過人必
  - page: 165
    col: 13
    role: j
    text: 知之
  - page: 165
    col: 14
    role: z
    text: 孔子不可自謂諱君之惡又不可以
  - page: 165
    col: 15
    role: z
    text: 娶同姓爲知禮故受以爲過而不辭
  - page: 165
    col: 16
    role: z
    text: ○吳氏曰魯蓋夫子父母之國昭公
  - page: 166
    col: 1
    role: z
    text: 魯之先君也司敗又未嘗顯言其事
  - page: 166
    col: 2
    role: z
    text: 而遽以知禮為問其對之宜如此也
  - page: 166
    col: 3
    role: z
    text: 及司敗以為有黨而夫子受以為過
  - page: 166
    col: 4
    role: z
    text: 蓋夫子之盛德無所不可也然其受
  - page: 166
    col: 5
    role: z
    text: 以為過也亦不正言其所以過初若
  - page: 166
    col: 6
    role: z
    text: 不知孟子之事者可以為萬世之法
  - page: 166
    col: 7
    role: z
    text: 矣
  - page: 166
    col: 8
    role: j
    text: 子與人歌而善必使反之而後和之
  - page: 166
    col: 9
    role: z
    text: 和去聲○反復也必使復歌者欲得
  - page: 166
    col: 10
    role: z
    text: 其詳而取其善也而後和之者喜得
  - page: 166
    col: 11
    role: z
    text: 其詳而與其善也此見聖人氣象從
  - page: 166
    col: 12
    role: z
    text: 容誠意懇至而其謙遜審密不掩人
  - page: 166
    col: 13
    role: j
    text: 善又如此蓋一事之微而衆善之集有
  - page: 166
    col: 14
    role: z
    text: 不可勝既者焉讀者宜詳味之
  - page: 166
    col: 15
    role: j
    text: 子曰文莫吾猶人也躬行君子則吾未
  - page: 166
    col: 16
    role: j
    text: 之有得
  - page: 167
    col: 1
    role: z
    text: 莫疑辭猶人言不能過人而尚可以
  - page: 167
    col: 2
    role: z
    text: 及人采之有得則全未有得皆自謙
  - page: 167
    col: 3
    role: z
    text: 之詞而足以見言行之難易緩急欲
  - page: 167
    col: 4
    role: z
    text: 人之勉其實也○謝氏曰文雖聖人
  - page: 167
    col: 5
    role: z
    text: 無不與人同故不遜能躬行君子斯
  - page: 167
    col: 6
    role: z
    text: 可以入聖故不居猶言君子道者三
  - page: 167
    col: 7
    role: z
    text: 我無能焉
  - page: 167
    col: 8
    role: j
    text: 子曰若聖與仁則吾豈敢抑為之不厭
  - page: 167
    col: 9
    role: j
    text: 誨人不倦則可謂云爾已矣公西華曰
  - page: 167
    col: 10
    role: j
    text: 正唯弟子不能學也
  - page: 167
    col: 11
    role: z
    text: 此亦夫子之謙辭也聖者大而化之
  - page: 167
    col: 12
    role: z
    text: 仁則心德之全而人道之備也為之
  - page: 167
    col: 13
    role: z
    text: 謂為仁聖之道誨人亦謂以此教人
  - page: 167
    col: 14
    role: z
    text: 也然不厭不倦非己有之則不能所
  - page: 167
    col: 15
    role: z
    text: 以弟子不能學也○晁氏曰當時有
  - page: 167
    col: 16
    role: z
    text: 稱夫子聖且仁者以故夫子辭之苟
  - page: 168
    col: 1
    role: z
    text: 辭之而已焉則無以進天下之材率
  - page: 168
    col: 2
    role: z
    text: 天下之善將使聖與仁爲虛器而人
  - page: 168
    col: 3
    role: z
    text: 終莫能至矣故孔子雖不居仁聖而
  - page: 168
    col: 4
    role: z
    text: 必以爲之不厭誨人不倦自處也可
  - page: 168
    col: 5
    role: z
    text: 謂云爾已矣者無他之辭也公西華
  - page: 168
    col: 6
    role: z
    text: 仰而嘆之其亦深知夫子之意矣
  - page: 168
    col: 7
    role: j
    text: 子疾病子路請禱子曰有諸子路對曰
  - page: 168
    col: 8
    role: j
    text: 有之誄曰禱爾于上下神祇子曰丘之
  - page: 168
    col: 9
    role: j
    text: 禱久矣
  - page: 168
    col: 10
    role: z
    text: 誄力軌反○禱謂禱於鬼神有諸問
  - page: 168
    col: 11
    role: z
    text: 有此理否誄者哀死而述其行之詞
  - page: 168
    col: 12
    role: z
    text: 也上下謂天地天曰神地曰祇禱者
  - page: 168
    col: 13
    role: z
    text: 悔過遷善以祈神之佑也無其理則
  - page: 168
    col: 14
    role: z
    text: 不必禱既曰有之則聖人未嘗有過
  - page: 168
    col: 15
    role: z
    text: 無善可遷其素行固已合於神明故
  - page: 168
    col: 16
    role: z
    text: 曰丘之禱久矣又士喪禮疾病行禱
  - page: 169
    col: 1
    role: z
    text: 五祀蓋臣子迫切之至情有不能自
  - page: 169
    col: 2
    role: z
    text: 已者初不請於病者而後禱也故孔
  - page: 169
    col: 3
    role: z
    text: 子之於子路不直拒之而但告以無
  - page: 169
    col: 4
    role: z
    text: 所事禱之意
  - page: 169
    col: 5
    role: j
    text: 子曰奢則不孫儉則固與其不孫也寧
  - page: 169
    col: 6
    role: j
    text: 固
  - page: 169
    col: 7
    role: z
    text: 孫去聲○孫順也固陋也奢儉俱失
  - page: 169
    col: 8
    role: z
    text: 中而奢之害大○晁氏曰不得已而
  - page: 169
    col: 9
    role: z
    text: 救時之敝也
  - page: 169
    col: 10
    role: j
    text: 子曰君子坦蕩蕩小人長戚戚
  - page: 169
    col: 11
    role: z
    text: 坦平也蕩蕩寬廣貌○程子曰君子
  - page: 169
    col: 12
    role: z
    text: 循理故常舒泰小人役於物故多憂
  - page: 169
    col: 13
    role: z
    text: 戚○程子曰君子坦蕩蕩心廣體胖
  - page: 169
    col: 14
    role: j
    text: 子温而厲威而不猛恭而安
  - page: 169
    col: 15
    role: z
    text: 厲嚴肅也人之德性本無不備而氣
  - page: 169
    col: 16
    role: z
    text: 質所賦鮮有不偏惟聖人全體渾然
  - page: 170
    col: 1
    role: z
    text: 陰陽合德故其中和之氣見於容貌
  - page: 170
    col: 2
    role: z
    text: 之間者如此門人熟察而詳記之亦
  - page: 170
    col: 3
    role: z
    text: 可見其用心之密矣抑非知足以知
  - page: 170
    col: 4
    role: z
    text: 聖人而善言德行不能記故程子以
  - page: 170
    col: 5
    role: z
    text: 爲曾子之言學者所宜反復而玩心
  - page: 170
    col: 6
    role: z
    text: 也
  - page: 170
    col: 7
    role: title
    text: 泰伯第八
  - page: 170
    col: 8
    role: z
    text: 凡二十一章
  - page: 170
    col: 9
    role: j
    text: 子曰泰伯其可謂至德也已矣三以天
  - page: 170
    col: 10
    role: j
    text: 下讓民無得而稱焉
  - page: 170
    col: 11
    role: z
    text: 泰伯周大王之長子至德謂德之
  - page: 170
    col: 12
    role: z
    text: 至極無以復加者也三遜謂固遜
  - page: 170
    col: 13
    role: z
    text: 也無得而稱其遜隱微無迹可見
  - page: 170
    col: 14
    role: z
    text: 也蓋大王三子長泰伯次仲雍次季
  - page: 170
    col: 15
    role: z
    text: 歷大王之時商道寖衰而周日彊大
  - page: 170
    col: 16
    role: z
    text: 季歷又生子昌有聖德大王因有翦
  - page: 171
    col: 1
    role: z
    text: 商之志而泰伯不從大王遂欲傳位
  - page: 171
    col: 2
    role: z
    text: 季歷以及昌泰伯知之即與仲雍逃
  - page: 171
    col: 3
    role: z
    text: 之荆蠻於是大王乃立季歷傳國至
  - page: 171
    col: 4
    role: z
    text: 昌而三分天下有其二是爲文王文
  - page: 171
    col: 5
    role: z
    text: 王崩子發立遂克商而有天下是爲
  - page: 171
    col: 6
    role: z
    text: 武王夫以泰伯之德當商周之際固
  - page: 171
    col: 7
    role: z
    text: 足以朝諸侯有天下矣乃棄不取而
  - page: 171
    col: 8
    role: z
    text: 又泯其迹焉則其德之至極爲如何
  - page: 171
    col: 9
    role: z
    text: 哉蓋其心即夷齊扣馬之心而事之
  - page: 171
    col: 10
    role: z
    text: 難處有甚焉者宜夫子之歎息而贊
  - page: 171
    col: 11
    role: z
    text: 美之也泰伯不從事見春秋傳
  - page: 171
    col: 12
    role: j
    text: 子曰恭而無禮則勞慎而無禮則葸勇
  - page: 171
    col: 13
    role: j
    text: 而無禮則亂直而無禮則絞
  - page: 171
    col: 14
    role: z
    text: 葸絲里反絞古卯反○葸畏懼貌絞
  - page: 171
    col: 15
    role: z
    text: 急切也無禮則無節文故有四者之
  - page: 171
    col: 16
    role: z
    text: 弊
  - page: 172
    col: 1
    role: j
    text: 君子篤於親則民興於仁故舊不遺則
  - page: 172
    col: 2
    role: j
    text: 民不偷
  - page: 172
    col: 3
    role: z
    text: 君子謂在上之人也興起也偷薄也
  - page: 172
    col: 4
    role: z
    text: ○張子曰人道知所先後則恭不勞
  - page: 172
    col: 5
    role: z
    text: 謹不葸勇不亂直不絞民化而德厚
  - page: 172
    col: 6
    role: z
    text: 矣○吳氏曰君子以下當自爲一章
  - page: 172
    col: 7
    role: z
    text: 乃曾子之言也愚按此一節與上文
  - page: 172
    col: 8
    role: z
    text: 不相蒙而與首篇謹終追遠之意相
  - page: 172
    col: 9
    role: z
    text: 類吳說近是
  - page: 172
    col: 10
    role: j
    text: 曾子有疾召門弟子曰啓予足啓予手
  - page: 172
    col: 11
    role: j
    text: 詩云戰戰兢兢如臨深淵如履薄冰而
  - page: 172
    col: 12
    role: j
    text: 今而後吾知免夫小子
  - page: 172
    col: 13
    role: z
    text: 夫音扶○啓開也曾子平日以爲身
  - page: 172
    col: 14
    role: z
    text: 體受於父母不敢毀傷故於此使弟
  - page: 172
    col: 15
    role: z
    text: 子開其衾而視之詩小旻之篇戰戰
  - page: 172
    col: 16
    role: z
    text: 恐懼兢兢戒謹臨淵恐墜履冰恐陷
  - page: 173
    col: 1
    role: z
    text: 也曾子以其所保之全示門人而言
  - page: 173
    col: 2
    role: z
    text: 其所以保之之難如此至於將死而
  - page: 173
    col: 3
    role: z
    text: 後知其得免於毀傷也小子門人也
  - page: 173
    col: 4
    role: z
    text: 語畢而又呼之以致反復丁寧之意
  - page: 173
    col: 5
    role: z
    text: 其警之也深矣○程子曰君子曰終
  - page: 173
    col: 6
    role: z
    text: 小人曰死君子保其身以沒爲終其
  - page: 173
    col: 7
    role: z
    text: 事也故曾子以全歸爲免矣○尹氏
  - page: 173
    col: 8
    role: z
    text: 曰父母全而生之子全而歸之曾子
  - page: 173
    col: 9
    role: z
    text: 臨終而啓手足爲是故也非有得於
  - page: 173
    col: 10
    role: z
    text: 道能如是乎○范氏曰身體猶不可
  - page: 173
    col: 11
    role: z
    text: 虧也況虧其行以辱其親乎
  - page: 173
    col: 12
    role: j
    text: 曾子有疾孟敬子問之
  - page: 173
    col: 13
    role: z
    text: 孟敬子魯大夫仲孫氏名捷問之者
  - page: 173
    col: 14
    role: z
    text: 問其疾也
  - page: 173
    col: 15
    role: j
    text: 曾子言曰鳥之將死其鳴也哀人之將
  - page: 173
    col: 16
    role: j
    text: 死其言也善
  - page: 174
    col: 1
    role: z
    text: 言自言也鳥畏死故鳴哀人窮反本
  - page: 174
    col: 2
    role: z
    text: 故言善此曾子之謙辭欲敬子知其
  - page: 174
    col: 3
    role: z
    text: 所言之善而識之也
  - page: 174
    col: 4
    role: j
    text: 君子所貴乎道者三動容貌斯遠暴慢
  - page: 174
    col: 5
    role: j
    text: 矣正顏色斯近信矣出辭氣斯遠鄙倍
  - page: 174
    col: 6
    role: j
    text: 矣籩豆之事則有司存
  - page: 174
    col: 7
    role: z
    text: 遠近並去聲○貴猶重也容貌舉一
  - page: 174
    col: 8
    role: z
    text: 身而言暴粗厲也慢放肆也信實也
  - page: 174
    col: 9
    role: z
    text: 正顏色而近信則非色莊也辭言語
  - page: 174
    col: 10
    role: z
    text: 氣聲氣也鄙凡陋也倍與背同謂背
  - page: 174
    col: 11
    role: z
    text: 理也籩竹豆豆木豆言道雖無所不
  - page: 174
    col: 12
    role: z
    text: 在然君子所重者在此三事而已是
  - page: 174
    col: 13
    role: z
    text: 皆脩身之要為政之本學者所當操
  - page: 174
    col: 14
    role: z
    text: 存省察而不可有造次顛沛之違者
  - page: 174
    col: 15
    role: z
    text: 也若夫籩豆之事器數之末道之全
  - page: 174
    col: 16
    role: z
    text: 體固無不該然其分則有司之守而
  - page: 175
    col: 1
    role: z
    text: 非君子之所重矣○程子曰動容貌
  - page: 175
    col: 2
    role: z
    text: 舉一身而言也周旋中禮暴慢斯遠
  - page: 175
    col: 3
    role: z
    text: 矣正顏色則不妄斯近信矣出辭氣
  - page: 175
    col: 4
    role: z
    text: 正由中出斯遠鄙倍三者正身而不
  - page: 175
    col: 5
    role: z
    text: 外求故曰籩豆之事則有司存○尹
  - page: 175
    col: 6
    role: z
    text: 氏曰養於中則見於外曾子蓋以脩
  - page: 175
    col: 7
    role: z
    text: 己爲爲政之本若乃器用事物之細
  - page: 175
    col: 8
    role: z
    text: 則有司存焉
  - page: 175
    col: 9
    role: j
    text: 曾子曰以能問於不能以多問於寡有
  - page: 175
    col: 10
    role: j
    text: 若無實若虛犯而不校昔者吾友嘗從
  - page: 175
    col: 11
    role: j
    text: 事於斯矣
  - page: 175
    col: 12
    role: z
    text: 校計校也友馬氏以爲顏淵是也顏
  - page: 175
    col: 13
    role: z
    text: 子之心唯知義理之無窮不見物我
  - page: 175
    col: 14
    role: z
    text: 之有間故能如此○謝氏曰不知有
  - page: 175
    col: 15
    role: z
    text: 餘在我不足在人不必得爲在己失
  - page: 175
    col: 16
    role: z
    text: 爲在人非幾於無我者不能也
  - page: 176
    col: 1
    role: j
    text: 曾子曰可以託六尺之孤可以寄百里
  - page: 176
    col: 2
    role: j
    text: 之命臨大節而不可奪也君子人與君
  - page: 176
    col: 3
    role: j
    text: 子人也
  - page: 176
    col: 4
    role: z
    text: 與平聲○其才可以輔幼君攝國政
  - page: 176
    col: 5
    role: z
    text: 其節至於死生之際而不可奪可謂
  - page: 176
    col: 6
    role: z
    text: 君子矣與疑詞也決詞設爲問答所
  - page: 176
    col: 7
    role: j
    text: 以深著其必然也○程子曰節操如是
  - page: 176
    col: 8
    role: z
    text: 可謂君子矣
  - page: 176
    col: 9
    role: j
    text: 曾子曰士不可以不弘毅任重而道遠
  - page: 176
    col: 10
    role: z
    text: 洪寬廣毅強忍也非洪不能勝其重
  - page: 176
    col: 11
    role: z
    text: 非毅無以致其遠
  - page: 176
    col: 12
    role: j
    text: 仁以爲己任不亦重乎死而後已不亦
  - page: 176
    col: 13
    role: j
    text: 遠乎
  - page: 176
    col: 14
    role: z
    text: 仁者人心之全德而必欲以身體而
  - page: 176
    col: 15
    role: z
    text: 力行之可謂重矣一息尚存此志不
  - page: 176
    col: 16
    role: z
    text: 容少懈可謂遠矣○程子曰洪而不
  - page: 177
    col: 1
    role: z
    text: 毅則無規矩而難立毅而不洪則隘
  - page: 177
    col: 2
    role: z
    text: 陋而無以居之又曰洪大剛毅然後
  - page: 177
    col: 3
    role: z
    text: 能勝重任而遠到
  - page: 177
    col: 4
    role: j
    text: 子曰興於詩
  - page: 177
    col: 5
    role: z
    text: 興起也詩本人情有邪有正其爲言
  - page: 177
    col: 6
    role: z
    text: 旣易知而吟詠之閒抑揚反復其感
  - page: 177
    col: 7
    role: z
    text: 人又易入故學者之初所以興起其
  - page: 177
    col: 8
    role: z
    text: 好善惡惡之心而不能自已者必於
  - page: 177
    col: 9
    role: z
    text: 是而得之
  - page: 177
    col: 10
    role: j
    text: 立於禮
  - page: 177
    col: 11
    role: z
    text: 禮以恭敬辭遜爲本而有節文度數
  - page: 177
    col: 12
    role: z
    text: 之詳可以固人肌膚之會筋骸之束
  - page: 177
    col: 13
    role: z
    text: 故學者之中所以能卓然自立而不
  - page: 177
    col: 14
    role: z
    text: 爲事物之所揺奪者必於此而得之
  - page: 177
    col: 15
    role: j
    text: 成於樂
  - page: 177
    col: 16
    role: z
    text: 樂有五聲十二律更唱迭和以爲歌
  - page: 178
    col: 1
    role: j
    text: 舞八音之節可以養人之情性而蕩滌
  - page: 178
    col: 2
    role: z
    text: 其邪穢消融其查滓故學者之終所
  - page: 178
    col: 3
    role: z
    text: 以至於義精仁熟而自和順於道德
  - page: 178
    col: 4
    role: z
    text: 者必於此而得之是學之成也○按
  - page: 178
    col: 5
    role: z
    text: 內則十年學幼儀十三學樂誦詩二
  - page: 178
    col: 6
    role: z
    text: 十而後學禮則此三者非小學傳授
  - page: 178
    col: 7
    role: z
    text: 之次乃大學終身所得之難易先後
  - page: 178
    col: 8
    role: z
    text: 淺深也○程子曰天下之英才不為
  - page: 178
    col: 9
    role: z
    text: 少矣特以道學不明故不得有所成
  - page: 178
    col: 10
    role: z
    text: 就夫古人之詩如今之歌曲雖閭里
  - page: 178
    col: 11
    role: z
    text: 童稚皆習聞之而知其說故能興起
  - page: 178
    col: 12
    role: z
    text: 今雖老師宿儒尚不能曉其義况學
  - page: 178
    col: 13
    role: z
    text: 者乎是不得興於詩也古人自洒掃
  - page: 178
    col: 14
    role: z
    text: 應對以至冠昏喪祭莫不有禮今皆
  - page: 178
    col: 15
    role: z
    text: 廢壞是以人倫不明治家無法是不
  - page: 178
    col: 16
    role: z
    text: 得立於禮也古人之樂聲音所以養
  - page: 179
    col: 1
    role: z
    text: 其耳采色所以養其目歌詠所以養
  - page: 179
    col: 2
    role: z
    text: 其性情舞蹈所以養其血脉今皆無
  - page: 179
    col: 3
    role: z
    text: 之是不得成於樂也是以古之成材
  - page: 179
    col: 4
    role: z
    text: 也易今之成材也難
  - page: 179
    col: 5
    role: j
    text: 子曰民可使由之不可使知之
  - page: 179
    col: 6
    role: z
    text: 民可使之由於是理之當然而不能
  - page: 179
    col: 7
    role: z
    text: 使之知其所以然也○程子曰聖人
  - page: 179
    col: 8
    role: z
    text: 設教非不欲人家喻而戸曉也然不
  - page: 179
    col: 9
    role: z
    text: 能使之知但能使之由之爾若曰聖
  - page: 179
    col: 10
    role: z
    text: 人不使民知則是後世朝四暮三之
  - page: 179
    col: 11
    role: z
    text: 術也豈聖人之心乎
  - page: 179
    col: 12
    role: j
    text: 子曰好勇疾貧亂也人而不仁疾之已
  - page: 179
    col: 13
    role: j
    text: 甚亂也
  - page: 179
    col: 14
    role: z
    text: 好去聲○好勇而不安分則必作亂
  - page: 179
    col: 15
    role: z
    text: 惡不仁之人而使之無所容則必致
  - page: 179
    col: 16
    role: z
    text: 亂二者之心善惡雖殊然其生亂一
  - page: 180
    col: 1
    role: z
    text: 也
  - page: 180
    col: 2
    role: j
    text: 子曰如有周公之才之美使驕且吝其
  - page: 180
    col: 3
    role: j
    text: 餘不足觀也已
  - page: 180
    col: 4
    role: z
    text: 才美謂智能技藝之美驕矜夸吝鄙
  - page: 180
    col: 5
    role: z
    text: 嗇也○程子曰此甚言驕吝之不可
  - page: 180
    col: 6
    role: z
    text: 也蓋有周公之德則自無驕吝若但
  - page: 180
    col: 7
    role: z
    text: 有周公之才而驕吝焉亦不足觀矣
  - page: 180
    col: 8
    role: z
    text: 又曰驕氣盈吝氣歉愚謂驕吝雖有
  - page: 180
    col: 9
    role: z
    text: 盈歉之殊然其勢常相因蓋驕者吝
  - page: 180
    col: 10
    role: z
    text: 之枝葉吝者驕之本根故嘗驗之天
  - page: 180
    col: 11
    role: z
    text: 下之人未有驕而不吝吝而不驕者
  - page: 180
    col: 12
    role: z
    text: 也
  - page: 180
    col: 13
    role: j
    text: 子曰三年學不至於穀不易得也
  - page: 180
    col: 14
    role: z
    text: 易去聲○穀禄也至疑當作志爲學
  - page: 180
    col: 15
    role: z
    text: 之乆而不求禄如此之人不易得也
  - page: 180
    col: 16
    role: z
    text: ○楊氏曰雖子張之賢猶以千禄爲
  - page: 181
    col: 1
    role: z
    text: 問况其下者乎然則三年學而不至
  - page: 181
    col: 2
    role: z
    text: 於穀宜不易得也
  - page: 181
    col: 3
    role: j
    text: 子曰篤信好學守死善道
  - page: 181
    col: 4
    role: z
    text: 好去聲○篤厚而力也不篤信則不
  - page: 181
    col: 5
    role: z
    text: 能好學然篤信而不好學則所信或
  - page: 181
    col: 6
    role: z
    text: 非其正不守死則不能以善其道然
  - page: 181
    col: 7
    role: z
    text: 守死而不足以善其道則亦徒死而
  - page: 181
    col: 8
    role: z
    text: 已蓋守死者篤信之效善道者好學
  - page: 181
    col: 9
    role: z
    text: 之功
  - page: 181
    col: 10
    role: j
    text: 危邦不入亂邦不居天下有道則見無
  - page: 181
    col: 11
    role: j
    text: 道則隱
  - page: 181
    col: 12
    role: z
    text: 見賢遍反○君子見危授命則仕危
  - page: 181
    col: 13
    role: z
    text: 邦者無可去之義在外則不入可也
  - page: 181
    col: 14
    role: z
    text: 亂邦未危而刑政紀綱紊矣故潔其
  - page: 181
    col: 15
    role: z
    text: 身而去之天下舉一世而言無道則
  - page: 181
    col: 16
    role: z
    text: 隱其身而不見也此惟篤信好學守
  - page: 182
    col: 1
    role: z
    text: 死善道者能之
  - page: 182
    col: 2
    role: j
    text: 邦有道貧且賤焉恥也邦無道富且貴
  - page: 182
    col: 3
    role: j
    text: 焉恥也
  - page: 182
    col: 4
    role: z
    text: 世治而無可行之道世亂而無能守
  - page: 182
    col: 5
    role: z
    text: 之節碌碌庸人不足以為士矣可恥
  - page: 182
    col: 6
    role: z
    text: 之甚也○晁氏曰有學有守而去就
  - page: 182
    col: 7
    role: z
    text: 之義潔出處之分明然後為君子之
  - page: 182
    col: 8
    role: z
    text: 全德也
  - page: 182
    col: 9
    role: j
    text: 子曰不在其位不謀其政
  - page: 182
    col: 10
    role: z
    text: 程子曰不在其位則不任其事也若
  - page: 182
    col: 11
    role: z
    text: 君大夫問而告者則有矣
  - page: 182
    col: 12
    role: j
    text: 子曰師摯之始關雎之亂洋洋乎盈耳
  - page: 182
    col: 13
    role: j
    text: 哉
  - page: 182
    col: 14
    role: z
    text: 摯音至雎七余反○師摯魯樂師名
  - page: 182
    col: 15
    role: z
    text: 摯也亂樂之卒章也史記曰關雎之
  - page: 182
    col: 16
    role: z
    text: 亂以為風始洋洋美盛意孔子自衛
  - page: 183
    col: 1
    role: z
    text: 反魯而正樂適摯在官之初故樂
  - page: 183
    col: 2
    role: z
    text: 之美盛如此
  - page: 183
    col: 3
    role: j
    text: 子曰狂而不直侗而不愿悾悾而不信
  - page: 183
    col: 4
    role: j
    text: 吾不知之矣
  - page: 183
    col: 5
    role: z
    text: 侗音通悾音空○侗無知貌愿謹厚
  - page: 183
    col: 6
    role: z
    text: 也悾悾無能貌吾不知之者甚絕之
  - page: 183
    col: 7
    role: z
    text: 之辭亦不屑之教誨也○蘇氏曰天
  - page: 183
    col: 8
    role: z
    text: 之生物氣質不齊其中材以下有是
  - page: 183
    col: 9
    role: z
    text: 德則有是病有是病必有是德故馬
  - page: 183
    col: 10
    role: z
    text: 之蹄齧者必善走其不善者必馴有
  - page: 183
    col: 11
    role: z
    text: 是病而無是德則天下之棄才也
  - page: 183
    col: 12
    role: j
    text: 子曰學如不及猶恐失之
  - page: 183
    col: 13
    role: z
    text: 言人之爲學旣如有所不及矣而其
  - page: 183
    col: 14
    role: z
    text: 心猶竦然惟恐其或失之警學者當
  - page: 183
    col: 15
    role: z
    text: 如是也○程子曰學如不及猶恐失
  - page: 183
    col: 16
    role: z
    text: 之不得放過才說姑待明日便不可
  - page: 184
    col: 1
    role: z
    text: 也
  - page: 184
    col: 2
    role: j
    text: 子曰巍巍乎舜禹之有天下也而不與
  - page: 184
    col: 3
    role: j
    text: 焉
  - page: 184
    col: 4
    role: z
    text: 與去聲○巍巍高大之貌不與猶言
  - page: 184
    col: 5
    role: z
    text: 不相關言其不以位為樂也
  - page: 184
    col: 6
    role: j
    text: 子曰大哉堯之為君也巍巍乎唯天為
  - page: 184
    col: 7
    role: j
    text: 大唯堯則之蕩蕩乎民無能名焉
  - page: 184
    col: 8
    role: z
    text: 唯猶獨也則猶準也蕩蕩廣遠之稱
  - page: 184
    col: 9
    role: z
    text: 也言物之高大莫有過於天者而獨
  - page: 184
    col: 10
    role: z
    text: 堯之德能與之準故其德之廣遠亦
  - page: 184
    col: 11
    role: z
    text: 如天之不可以言語形容也
  - page: 184
    col: 12
    role: j
    text: 巍巍乎其有成功也煥乎其有文章
  - page: 184
    col: 13
    role: z
    text: 成功事業也煥光明之貌文章禮樂
  - page: 184
    col: 14
    role: z
    text: 法度也堯之德不可名其可見者此
  - page: 184
    col: 15
    role: z
    text: 爾○尹氏曰天道之大無為而成唯
  - page: 184
    col: 16
    role: z
    text: 堯則之以治天下故民無得而名焉
  - page: 185
    col: 1
    role: z
    text: 所可名者其功業文章巍然煥然而
  - page: 185
    col: 2
    role: z
    text: 巳
  - page: 185
    col: 3
    role: j
    text: 舜有臣五人而天下治
  - page: 185
    col: 4
    role: z
    text: 治去聲○禹稷契臯陶伯益
  - page: 185
    col: 5
    role: j
    text: 武王曰予有亂臣十人
  - page: 185
    col: 6
    role: z
    text: 書泰誓之辭○馬氏曰亂治也十人
  - page: 185
    col: 7
    role: z
    text: 謂周公旦召公奭太公望畢公榮公
  - page: 185
    col: 8
    role: z
    text: 太顛閎夭散冝生南宫适其一人謂
  - page: 185
    col: 9
    role: z
    text: 文母劉侍讀以爲子無臣母之義蓋
  - page: 185
    col: 10
    role: z
    text: 邑姜也九人治外邑姜治内或曰亂
  - page: 185
    col: 11
    role: z
    text: 本作乿古治字也
  - page: 185
    col: 12
    role: j
    text: 孔子曰才難不其然乎唐虞之際於斯
  - page: 185
    col: 13
    role: j
    text: 爲盛有婦人焉九人而已
  - page: 185
    col: 14
    role: z
    text: 稱孔子者上係武王君臣之際記者
  - page: 185
    col: 15
    role: z
    text: 謹之才難蓋古語而孔子然之也才
  - page: 185
    col: 16
    role: z
    text: 者德之用也唐虞堯舜有天下之號
  - page: 186
    col: 1
    role: z
    text: 際交會之間言周室人才之多惟唐
  - page: 186
    col: 2
    role: z
    text: 虞之際乃盛於此降自夏商皆不能
  - page: 186
    col: 3
    role: z
    text: 及然猶但有此數人爾是才之難得
  - page: 186
    col: 4
    role: z
    text: 也
  - page: 186
    col: 5
    role: j
    text: 三分天下有其二以服事殷周之德其
  - page: 186
    col: 6
    role: j
    text: 可謂至德也已矣
  - page: 186
    col: 7
    role: z
    text: 春秋傳曰文王率商之畔國以事紂
  - page: 186
    col: 8
    role: z
    text: 蓋天下歸文王者六州荆梁雍豫徐
  - page: 186
    col: 9
    role: z
    text: 楊也惟青兖冀尚屬紂耳〇范氏曰
  - page: 186
    col: 10
    role: z
    text: 文王之德足以代商天與之人歸之
  - page: 186
    col: 11
    role: z
    text: 乃不取而服事焉所以爲至德也孔
  - page: 186
    col: 12
    role: z
    text: 子因武王之言而及文王之德且與
  - page: 186
    col: 13
    role: z
    text: 泰伯皆以至德稱之其指微矣或曰
  - page: 186
    col: 14
    role: z
    text: 冝斷三分以下別以孔子曰起之而
  - page: 186
    col: 15
    role: z
    text: 自爲一章
  - page: 186
    col: 16
    role: j
    text: 子曰禹吾無間然矣菲飲食而致孝乎
  - page: 187
    col: 1
    role: j
    text: 鬼神惡衣服而致美乎黻冕卑宮室而
  - page: 187
    col: 2
    role: j
    text: 盡力乎溝洫禹吾無間然矣
  - page: 187
    col: 3
    role: z
    text: 間去聲菲音匪黻音弗洫呼域反○
  - page: 187
    col: 4
    role: j
    text: 間鑄隙也謂指其鑄隙而非議之也菲
  - page: 187
    col: 5
    role: z
    text: 薄也致孝鬼神謂享祀豐潔衣服常
  - page: 187
    col: 6
    role: z
    text: 服黻蔽膝也以韋爲之冕冠也皆祭
  - page: 187
    col: 7
    role: z
    text: 服也溝洫田間水道以正疆界備旱
  - page: 187
    col: 8
    role: z
    text: 潦者也或豐或儉各適其宜所以無
  - page: 187
    col: 9
    role: z
    text: 鑄隙之可議也故再言以深美之○
  - page: 187
    col: 10
    role: z
    text: 楊氏曰薄於自奉而所勤者民之事
  - page: 187
    col: 11
    role: z
    text: 所致飾者宗廟朝廷之禮所謂有天
  - page: 187
    col: 12
    role: z
    text: 下而不與也夫何間然之有
  - page: 187
    col: 15
    role: j
    text: 論語卷第四
