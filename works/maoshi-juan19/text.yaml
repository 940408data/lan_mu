# 毛詩正義卷19（孔穎達疏）：j 為經文＋毛亨傳、鄭玄箋，z 為疏文。
sections:
  - id: juan19
    name: 正文
    blocks:
      - { type: j, text: "《小毖》，嗣王求助也。毖，慎也。天下之事，當慎其小。小時而不慎，後為禍大，故成王求忠臣早輔助已為政，以救患難。○毖音秘。難，乃旦反。禍難之難皆同。" }
      - { type: z, text: "“《小毖》八句”。○正義曰：《小毖》詩者，嗣王求助之樂歌也。謂周公歸政之後，成王初始嗣位，因祭在廟，而求群臣助己。詩人述其事而作此歌焉。經言創艾往過，戒慎將來，是求助之事也。毛以上三篇亦為歸政後事，於《訪落》言謀於廟，則進戒求助，亦在廟中，與上一時之事。鄭以上三篇居攝之前，此在歸政之後，然而頌之大判，皆由神明而興，此蓋亦因祭在廟而求助也。○箋“毖慎”至“患難”。○正義曰：“毖，慎”，《釋詁》文。箋以經文無小字，而名曰《小毖》，故解其意。此意出於“允彼桃蟲，翻飛維鳥”而來也。言早輔助者，初嗣王位，而即求之，是其早也。" }
      - { type: j, text: "予其懲而毖後患。莫予荓蜂，自求辛螫。毖，慎也。荓蜂，<廣挈>曳也。箋雲：懲，艾也。始者，管叔及其群弟流言於國，成王信之，而疑周公。至後三監叛而作亂，周公以王命舉兵誅之，歷年乃已。故今周公歸政，成王受之，而求賢臣以自輔助也。曰：我其創艾於往時矣，畏慎後復有禍難。群臣小人無敢我<廣挈>曳，謂為譎詐誑欺，不可信也。女如是，徒自求辛苦毒螫之害耳，謂將有刑誅。○懲，直升反，《韓詩》雲：“苦也。”荓，普經反，《爾雅》作“甹”，音同。蜂，本又作夆，孚逄反。螫音釋，《韓詩》作辛。赦，赦事也。<廣挈>，尺制反，本又作“掣”。曳，以制反。艾音刈，字或作“{乂心}”。下同。創，初亮反。復，扶又反。譎音決。誑，九況反。" }
      - { type: z, text: "“予其懲而”。○毛以為，成王即政，求助於群臣，告之雲：我其懲創於往時而。謂管、蔡誤己，以為創艾，故慎彼在後，恐更有患難。汝等群臣，莫復於我掣曳，牽我以入惡道。若其如是，我必刑誅於汝。是汝自求是辛苦毒螫之害耳。以管、蔡誤己，尋被誅戮，故自說懲創，戒使勿然。既言將欲慎患，又說當慎其小惡之初始。信如彼桃蟲耳，為惡不已，於後更大。似桃蟲翻然而飛，維為大鳥矣。其意言管、蔡始則讒毀周公，後遂舉兵謀叛逆，是積小成大。言後有此類，當小即誅之，勿使至大。又言求助之意，以我才智淺薄，未任獨當國家多難之事，恐我又集止於患難，似蓼菜之辛苦然，故須汝等助我慎之。言“又”者，非徒多難，又集辛苦。以此之故，求人助己也。○鄭於下四句文勢大同，屬意小異。言己所以創於往時者，往始之時，信以管、蔡之讒為小，如彼桃蟲耳，故不即誅之，乃叛而作亂，為王室大患。如桃蟲翻然而飛，維為大鳥矣。於時我年幼少，未任統理國家眾難成之事，故使周公攝政，即有三監及淮夷作亂，使我又會於辛苦，皆由不慎其小，以致使然。我今欲慎小防患，故須汝等助我。言己求助之意也。○傳“荓蜂，<廣挈>曳”。○正義曰：《釋訓》文。孫炎曰：“謂相掣曳入於惡也。”彼作“甹夆”，古今字耳。王肅雲：“以言才薄，莫之藩援，則自得辛毒。”孫毓雲：“群臣無肯牽引扶助我，我則自得辛螫之毒。”此二家以茾蜂為掣曳為善，自求為王身自求。案傳本無此意，故同之鄭說。○箋“懲艾”至“刑誅”。○正義曰：懲與創艾，皆嘗有事思自改悔之言。此雲“予其懲而”，明是有事可創，故鄭跡其創艾之所由。管叔及其群弟流言於國，成王信之而疑周公，《金縢》有其事也。三監叛而作亂，周公以王命誅之，《書序》有其事也。成王年十五，周公自東都反而居攝，稱元年。其年即舉兵東伐，至二年滅殷，三年踐奄，叛逆之事始得平定，是歷年乃已也。既創往時，畏慎後禍，恐其將復如是，故戒群臣小子無敢掣曳我也。掣曳者，從傍牽挽之言，是挽離正道，使就邪僻，故知謂譎詐誑欺不可信，若管、蔡流言之類也。毒螫，如彼毒蟲之螫，故言謂將有刑誅。" }
      - { type: j, text: "肇允彼桃蟲，拚飛維鳥。桃蟲，鷦也，鳥之始小終大者。箋雲：肇，始。允，信也。始者信以彼管、蔡之屬，雖有流言之罪，如鷦鳥之小，不登誅之，後反叛而作亂，猶鷦之翻飛為大鳥也。鷦之所為鳥，題肩也，或曰鴞，皆惡聲之鳥。○拚，芳煩反。鷦，子消反，鳥始小後大者也。" }
      - { type: z, text: "傳“桃蟲鷦”至“終大”。○正義曰：《釋鳥》雲：“桃蟲，鷦。其雌鴱。”舍人曰：“桃蟲名鷦，其雌名鴱。”郭璞曰：“鷦<眇鳥>亡消反，桃雀也，俗名為巧婦。鷦<眇鳥>小鳥，而生鵰鶚者也。”陸機《疏》雲：“今鷦鷯是也。微小於黃雀，其雛化而為雕，故俗語鷦鷯生雕。”言始小終大者，始為桃蟲，長大而為鷦鳥，以喻小惡不誅，成為大惡。傳言始小終大，其文得與箋同。但毛以周公為武王崩之明年即攝政，為元年時，即管、蔡流言，成王信之，周公舉兵誅之，成王猶尚未悟。既誅之後，得風雷之變，啟金縢之書，始信周公。箋言王意以管、蔡流言為小罪，恨不登時誅之。毛不得有此意耳，是其必異於鄭。當謂將來之惡，宜慎其小耳。故王肅雲“言患難宜慎其小”，是謂將來患難，非悔不誅管、蔡也。○箋“肇始”至“之鳥”。○正義曰：“肇，始。允，信”，《釋詁》文。管、蔡初為流言，成王信之。既信其言，自然不得誅之。今悔於不登時誅之者，此謂啟金縢後，既信周公之心，已知管、蔡之妄，宜即執而戮之，乃迎周公。當時以管、蔡罪小，不即誅殺，至使叛而作亂，為此大禍，故所以為創也。箋又言鷦之所為鳥題肩，或曰鴞，皆惡聲之鳥，定本、《集註》皆雲“或曰鴟，皆惡鳥也”。案《月令》季冬雲：“徵鳥厲。”注云：“徵鳥，題肩，齊人謂之擊徵，或曰鷹。”然則題肩是鷹之別名，與鴞不類。鴞自惡聲之鳥，鷹非惡聲，不得雲皆惡聲之鳥也。《說文》雲：“鷦<眇鳥>，桃蟲也。”郭璞雲：“桃蟲，巧婦也。”《方言》說巧婦之名，“自關而東謂之桑飛，或謂之工雀，或謂之過羸，或謂之女匠。自關而西，謂之桑飛，或謂之襪雀”。郭璞注云：“即鷦<眇鳥>是也。”諸儒皆以鷦為巧婦，與題肩又不類也。今箋以鷦與題肩及鴞三者為一，其義未詳。且言鷦之為鳥題肩，事亦不知所出，遺諸後賢。" }
      - { type: j, text: "未堪家多難，予又集於蓼。堪，任。予，我也。我又集於蓼，言辛苦也。箋雲：集，會也。未任統理我國家眾難成之事，謂使周公居攝時也。我又會於辛苦，遇三監及淮夷之難也。○蓼音了。" }
      - { type: z, text: "傳“堪任”至“辛苦”。○正義曰：《釋詁》雲“堪，勝”，亦任之義也。“予，我”，《釋詁》文。毛不得有追悔管、蔡之事。上經謂慎將來，則此亦謂將來之事，不得與鄭同也。當言己才智淺短，未任國家多難之事。既已多難，又會辛苦，故王肅雲：“非徒多難而已，又多辛苦。”是說將來之事，對多難為文。蓼，辛苦之菜，故云“又集於蓼”，言辛苦也。○箋“集會”至“之難”。○正義曰：“集，會”，《釋言》文。會謂逄遇之也。世道未平，戰鬥不息，於王者為辛苦之事，故言又會於辛苦也。上以翻飛為喻，謂長惡使成。此雲“又集於蓼”，謂逄其叛逆，故上箋言管、蔡，此箋言三監，猶是一事，但指憶有先後耳。言三監及淮夷之難者，淮夷之叛，亦三監使然，故連言之也。" }
      - { type: j, text: "《小毖》一章，八句。" }
      - { type: j, text: "《載芟》，春籍田而祈社稷也。籍田，甸師氏所掌。王載耒耜所耕之田，天子千畝，諸侯百畝。籍之言借也，借民力治之，故謂之籍田。○芟，所銜反，除草也。甸，田見反。" }
      - { type: z, text: "“《載芟》三十一句”。○正義曰：《載芟》詩者，春籍田而祈社稷之樂歌也。謂周公、成王太平之時，王者於春時親耕籍田，以勸農業，又祈求社稷，使獲其年豐歲稔。詩人述其豐熟之事，而為此歌焉。經陳下民樂治田業，收穫弘多，釀為酒醴，用以祭祀。是由王者耕籍田、祈社稷、勸之使然，故序本其多獲所由，言其作頌之意。經則主說年豐，故其言不及籍、社，所以經、序有異也。《月令》“孟春，天子躬耕帝籍。仲春，擇元日，命民人社”。《大司馬》“仲春，教振旅，遂以蒐田，獻禽以祭社”。然則天子祈社亦以仲春，與耕籍異月。而連言之者，雖則異月，俱在春時，故以春總之。《祭法》雲：“王為群姓立社曰泰社。王自為立社曰王社。”此二社皆應以春社之，但此為百姓祈祭，文當主於泰社，其稷與社共祭，亦當謂泰社社稷焉。○箋“籍田”至“籍田”。○正義曰：《天官·甸師》“掌耕耨王籍”。《月令》孟春雲：“天子親載耒耜，躬耕帝籍。”是籍田者，甸師所掌，王所耕也。“天子千畝，諸侯百畝”，《祭義》文。王親耕者，一人獨發，三推而已，借民力使終治之，故謂之籍田也。《月令》說耕籍之事雲：“天子三推，公五推，卿、諸侯九推。”《周語》說耕籍之事雲：“王耕一發，班三之，庶人終於千畝。”韋昭雲：“王無耦，以一耜耕。班，次也。三之者，下各三。其上王一發，公三，卿九，大夫二十七。”然則每耕人數如《周語》，其推之數如《月令》，則王一人發而三推，公三人發各五推，卿九人發各九推，大夫推數則無文，因以三孤並六卿是為九，其大夫雖多，見相三之數，取二十七人為之耳。其士蓋八十一人為之耳。《月令》止有卿，而韋昭兼言大夫，明亦宜有士也。庶人終於千畝，謂甸師之屬徒也。《天官》序雲：“甸師下士二人，府一人，史二人，胥三十人，徒三百人。”其職雲：“掌帥其屬而耕耨王籍。”注云：“其屬，府、史、胥、徒也。耨，芸芓也。王以孟春躬耕帝籍，天子三推，三公五推，卿、諸侯九推，庶人終於千畝。”庶人謂徒三百人。籍之言借也。王一耕之，而使庶人芸芓終之。是借民者，謂藉此甸師之徒也。王者役人，自是常事，而謂之借者，言此田耕耨皆當王親為之，但以聽政治民有所不暇，故借人之力以為己功，是以謂之借也。《漢書》孝文二年開籍田。應邵曰：“籍田千畝，典籍之田。”臣瓚案：“景帝詔曰：‘朕親耕，後親桑，率天下先’，本不得以假借為稱。”而鄭以為借民力者，凡言典籍者，謂作事設法，書而記之，或復追述前言，號為典法。此籍田在於公地，歲歲耕墾，此乃當時之事，何故以籍為名？若以事載典籍，即名籍田，則天下之事無非籍矣，何獨於此偏得籍名？瓚見親耕之言，即雲不得假借。豈籍田千畝，皆天子親耕之乎？聖王制法，為此籍田者，萬民之業，以農為本，五禮之事，唯祭為大。以天子之貴，親執耒耜，所以勸農業也。祭之所奉，必用己力，所以敬明神也。《祭義》雲：“天子為籍千畝，躬秉耒耜，以事天地山川社稷。先古以為醴酪齍盛，於是乎取之，敬之至也。”是說籍田之意也。" }
      - { type: j, text: "載芟載柞，其耕澤澤。千耦其耘，徂隰徂畛。侯主侯伯，侯亞侯旅，侯彊侯以。除草曰芟。除木曰柞。畛，埸也。主，家長也。伯，長子也。亞，仲叔也。旅，子弟也。強，強力也。以，用也。箋雲：載，始也。隰謂新發田也。畛謂舊田有徑路者。強，有餘力者。《周禮》曰：“以強予任民。”以謂閒民，今時傭賃也。《春秋》之義，能東西之曰以。成王之時，萬民樂治田業。將耕，先始芟柞其草木，土氣烝達而和，耕之則澤澤然解散，於是耘除其根株。輩作者千耦，言趨時也。或往之隰，或往之畛。父子餘夫俱行，強有餘力者相助，又取傭賃，務疾畢已當種也。○柞，側伯反，除木也。澤澤音釋釋，注同，《爾雅》作郝，音同，雲：“耕也。”郭雲：“言士解也。”耦，五口反。芸音雲，本又作“耘”，除草也。畛，之忍反，徐又音真。強，其良反，有餘力。易，本又作“埸”，音亦。長，張丈反。下同。徑，古定反。閒音閒。傭音容。賃，女鳩反。烝音證。解音蟹。" }
      - { type: z, text: "“載芟載柞”。○毛以為，周公、成王之時，耕籍以勸下民，祈社而求穀實，故其時之民樂治田業，於是始芟其所田之草，始柞其所田之木，待其土氣烝達，然後耕之。其耕則釋釋然土皆解散，又二人相對者有千耦之人，其皆耘除此所芟柞草木之根株也。其耘之時，或往之隰，或往之畛。其所往之人，維為主之家長，維處伯之長子，維次長之仲叔，維眾之子弟，維強力之兼士，維所以傭賃之人。此等俱往畛隰，芸除草木，盡家之眾，皆服作勞。有嗿然而眾其來餉饋之人，即其婦之與士也。此農人不以其身為苦，乃謂餉己為勞，思逆而媚其行餉之婦，有愛其從來子弟，是王化之深，務農之至也。此農人既去草木根株，有略然而利者，其所用之耜。以此利耜，始耕於南畝之中，以種其百眾之穀。此穀之種實，皆含此當生之活氣，故從土中驛驛然其鑽土以射出，其士也。乃有厭然而特茂者，其傑立之苗也。厭厭然而長大者，其齊等之苗也。於是農人則綿綿然用其力麃芸之，以此至於大熟，則獲刈之，濟濟然穗眾而難進。有成實而多者，其此民之積聚也，乃有萬與億而及秭，言其多無數也。天下豐熟，而此在上稅而取之，以為三種之酒，以為五齊之醴，進予先祖先妣，又以會聚其百眾之禮，而為祭祀。此所為之酒醴，有飶然其氣芬香，用之以祭祀，為鬼神所饗，為我國家之光榮也。此所為之酒醴，有如椒之馨香，用之以祭祀，為鬼神降福，則得年壽與成德之安寧也。既治田得穀，用之祭祀，而使鬼神歡悅，邦國安寧，祭祀得所，故能誠感天地。心非雲此而有此，謂禎祥之應，事未至而先來也。心非雲今而有今，謂嘉慶之事不先聞而即至也。此事乃自古以來當如此，言修德行禮莫不獲報，非獨於此周時。○鄭以“俶載”為“熾菑”，熾然入地而菑殺其草於南畝之中。又以“烝畀祖妣”為祭祀之禮，以事宗廟；“以洽百禮”，為饗燕之禮，以待賓客。既言二禮，又反而申之，言此所為之酒醴，有飶然其氣芬香，用之以饗燕賓客，為賓所悅，為我國家光榮也。又其為酒醴，有如椒之香馨，用之以祭祀鬼神，為鬼神降福，則得年壽與成德之安寧也。又以且為辭，以振為古。餘同。○傳“除草”至“以用”。○正義曰：隱六年《左傳》雲：“如農夫之務去草焉，芟夷蘊崇之。”是除草曰芟也。《秋官·柞氏》“掌攻草木及林麓”，是除木曰柞。《地官·遂人》雲“十夫有溝，溝土有畛”，則畛謂地畔之徑路也。至此而易之主，故以畛為埸，《信南山》雲“疆埸翼翼”是也。《坊記》雲：“家無二主。”主是一家之尊，故知“主，家長也”。主既家長，而別有伯，則伯是主之長子也。亞訓次也，次於伯，故知仲叔也。不言季者，以季幼少，宜與諸子為類也。令旅中兼之，旅訓眾也，謂幼者之眾，即季弟及伯仲叔之諸子，故云“旅，子弟也”。此子弟謂成人堪耕芸者，若幼則從餉而行，下雲“有依其士”是也。彊謂力能兼人，故云“彊，彊力也”。以者，傭賃之人，以意驅用，故云“用也”。○箋“載始”至“當種”。○正義曰：此本其開地之初，故載為始。原隰者，地形高下之別名。隰指田形而言，則是未嘗墾發，故知謂新發田也。畛是地畔道路之名，故知謂舊田有徑路者。彊有餘力，謂其人彊壯，治一夫之田仍有餘力，能佐助他事者也。“周禮曰以強予任民”，《地官·遂人》文。彼注云：“彊予，謂民有餘力，復予之田。”引之以證強有餘力。彼“民”作“甿”，注云：“變民言甿，異外內也。”然則甿民是一，故以民言之。以謂閒民，今時傭賃者，《太宰》“以九職任萬民，其九曰閒民，無常職，轉移執事”，鄭司農雲：“閒民謂無事業者。轉移為人執事，若今時傭力也。”是有閒民傭賃之事也。又解雲以之意。《春秋》之義，能東西之曰以。此傭力隨主人所東西，故稱以也。僖二十六年《左傳》曰：“凡師能左右之曰以。”左右即東西也。彼雖為師發例，要以者，任其東西，故引之以證此。太平之世，而得有閒民者，人之才度等級不同，自有不能存立，於為人所役者，聖人順而任之，《周禮》列於九職。是雖太平之世，必為人傭，故此得有之也。土氣烝達者，《周語》說將耕之事雲：“陽氣俱烝，土膏其動。”韋昭雲：“烝，升也。”《月令》“孟春，天氣下降，地氣上騰”，注云：“此陽氣烝達，可耕之候。”然則土氣烝達者，謂陽氣升上達出，於是耕之，故土得釋釋然而散也。《釋訓》雲：“釋釋，耕也。”舍人曰：“釋釋猶藿藿，解散之意。”言輩作者，閤家盡行，輩輩俱作，言趨時也。千耦謂為耦者千，是二千人為千耦，與“十千維耦”異也。或往之隰，或往之畛，言其所往皆遍也，故王肅雲：“有隰則有原，言畛新可見，美其陰陽和，得同時就功也。”又解所以閤家俱作之意。務疾畢已當種也，已猶了，欲疾耕使畢了，故下經而種之。" }
      - { type: j, text: "有嗿其饁，思媚其婦，有依其士。嗿，眾貌。士，子弟也。箋雲：饁，饋饟也。依之言愛也。婦子來饋饟其農人於田野，乃逆而媚愛之。言勸其事勞，不自苦。○嗿，敕感反。饁，於輒反。饋，其愧反。饟，式亮反。" }
      - { type: z, text: "傳“嗿眾”至“子弟”。○正義曰：以耘者千耦，饟者必多，故知嗿為眾貌。士者男子之稱，而不在耕芸之中，宜是幼者行饟，故為子弟。此經言“有嗿其饁”，以目之婦士，俱是行饟之人。《七月》雲“同我婦子”，子即此之士也。○箋“饁饋”至“自苦”。○正義曰：“饁，饋”，《釋詁》文。孫炎曰：“饁，野之饋也。”“依”文與“媚”相類，媚為愛，故知依亦愛也。" }
      - { type: j, text: "有略其耜，俶載南畝。播厥百穀，實函斯活。略，利也。箋雲：“俶載”當作“熾菑”。播猶種也。實，種子也。函，含也。活，生也。農夫既耘除草木根株，乃更以利耜熾菑之，而後種其種，皆成好含生氣。○略如字，字書作“”，同。俶載，毛並如字，鄭作“熾菑”。下篇同。函，戶南反。下篇同。熾，尺志反，盛也。菑，側其反。種，章勇反。下“其種”同。株音誅。" }
      - { type: z, text: "傳“略，利”。○正義曰：《釋詁》文。○箋“實種”至“活生”。○正義曰：此說初種，故知實為種子。函者，容藏之義，故轉為含，猶人口含之也。活者，生活，故為生。言種子內含生氣，種之必生也。" }
      - { type: j, text: "驛驛其達，有厭其傑。厭厭其苗，綿綿其麃。達，射也。有厭其傑，言傑苗厭然特美也。麃，耘也。箋雲：達，出地也。傑，先長者。厭厭其苗，眾齊等也。○驛音亦，《爾雅》作“繹繹”，雲：“生也。”厭，於豔反。下同。綿綿如字，《爾雅》雲：“麃也。”《韓詩》作“民民”，雲：“眾貌。”麃，表嬌反，芸也，《說文》作“穮”，音同，雲：“穮，耨鋤田也。”《字林》雲：“穮，耕禾間也。”方遙反。射，食亦反。長，張丈反。" }
      - { type: z, text: "傳“達射”至“麃耘”。○正義曰：苗生達地則射而出，故以達為射。《釋訓》雲：“驛驛，生也。”舍人曰：“穀皆生之貌。”是“驛驛其達”謂苗生達地也。厭者，苗長茂盛之貌。其傑，苗之傑者，亦是苗也，而與其苗異文，傑謂其中特美者，苗謂其餘齊等者，二者皆美茂，故俱稱厭。但以齊等苗多，重言厭厭耳。以二者相涉，故傳詳其文，故云“有厭其傑，言苗傑然特美也”。箋申特美之意，故云“先長者傑”。既是先長，明厭厭，其餘眾苗齊等者。麃是芸之別名，綿綿是麃之貌。《釋訓》雲：“綿綿，麃也。”孫炎曰：“綿綿，言詳密也。”郭璞曰：“芸不息也。”王肅雲：“芸者，其眾綿綿然不絕也。”" }
      - { type: j, text: "載穫濟濟，有實其積，萬億及秭。濟濟，難也。箋雲：難者，穗眾難進也。有實，實成也。其積之乃萬億及秭，言得多也。○穫，戶郭反。積，子賜反，又如字。注同。秭音姊。" }
      - { type: z, text: "傳“濟濟，難”。○正義曰：《釋訓》雲：“濟濟，容止也。”在田穫刈，不得有濟濟之容，但容止濟濟者，必舉動安舒，此刈者以禾稠難進，不能速疾，故亦以濟濟言之。言難者，箋申之雲：“穗眾難進也。”" }
      - { type: j, text: "為酒為醴，烝畀祖妣，以洽百禮。箋雲：烝，進。畀，予。洽，合也。進予祖妣，謂祭先祖先妣也。以洽百禮，謂饗燕之屬。○烝，之丞反。畀，必二反。注同。" }
      - { type: z, text: "傳“百禮言多”。○正義曰：檢定本、《集註》皆無此文，有者誤也。○箋“烝進”至“之屬”。○正義曰：“烝，進。畀，予。洽，合”，皆《釋詁》文。箋以下雲“有飶”、“有椒”，重設其文，則是二事，故分此以當之。以“洽百禮”為合聚眾禮。其用酒醴者，祭祀以外，唯饗燕耳，故言“謂饗燕之屬”。《賓之初筵》與《豐年》皆有“以洽百禮”之文，與此同。而《賓之初筵》其文之下即雲“有壬有林”，林謂諸侯之君，故箋以為合見百國所獻之禮。《豐年》止言報祭，無饗燕之義，故箋不為說，則與“烝畀祖妣”共為祭祀之禮。此以有二事，故以為饗燕之禮。皆觀文為義，故三者皆異。毛既無饗燕之言，明皆據祭祀，與鄭不同。" }
      - { type: j, text: "有飶其香，邦家之光。飶，芬香也。箋雲：芬香之酒醴，饗燕賓客，則多得其歡心，於國家有榮譽。○飶，蒲即反。芬，芳也。《說文》雲：“食之香也。”字又作“苾”，音同。一音蒲必反。注同。" }
      - { type: z, text: "傳“苾，芬香”。○正義曰：飶者，香之氣，故為芬香也。○箋“芬香”至“榮譽”。○正義曰：箋以此充饗燕，下充祭祀者，以言邦家之光，謂國有光榮，是於賓客之辭也。胡考之寧，言身得壽考，與祭之祝慶萬壽無疆義同，是於鬼神之辭也，故知此為饗燕，下為祭祀。以饗燕施於賓客，故云“得其歡心，於國家有榮譽”。祭祀進於祖妣，故云“多得福祿，於身得壽考”。" }
      - { type: j, text: "有椒其馨，胡考之寧。椒，猶飶也。胡，壽也。考，成也。箋雲：寧，安也。以芬香之酒醴，祭於祖妣，則多得其福右。○椒，子消反，徐子料反，沈作“俶”，尺叔反，雲：“作椒者，誤也。此論釀酒芬香，無取椒氣之芳也。”案《唐風·椒聊》箋雲：“椒之性芬芳。”王注云：“椒，芬芳之物。”此傳雲“椒猶飶”，“飶芬香”，椒是芬芳之物，此正相協，無故改字為椒，椒，始也，非芬香。馨，呼庭反。" }
      - { type: z, text: "傳“椒猶”至“考成”。○正義曰：椒是木名，非香氣也。但椒木之氣香，作者以椒言香，故傳辨之，雲“猶如飶也”。僖二十二年《左傳》曰：“雖及胡耈。”《周書·諡法》“保民耆艾曰胡”。胡為壽也。“考，成”，《釋詁》文。言考者，明老而有成德。《蕩》曰“雖無老成人”是也。" }
      - { type: j, text: "匪且有且，匪今斯今，振古如茲。且，此也。振，自也。箋雲：匪，非也。振亦古也。饗燕祭祀，心非雲且而有且，謂將有嘉慶禎祥先來見也。心非雲今而有此今，謂嘉慶之事不聞而至也。言修德行禮，莫不獲報，乃古古而如此，所由來者久，非適今時。○且，七也反，又子餘反。下同。見，賢遍反。" }
      - { type: z, text: "傳“且，此。振，自”。○正義曰：毛雖有此訓，其義與鄭不殊。○箋“振亦”至“今時”。○正義曰：箋以《爾雅》有此正訓，故易傳以為“振亦古也”。以上陳祭饗二事，此承上文，故云饗燕祭祀。直言饗燕祭祀，謂為之得其所也。有天下者，主於敬待神人，接之以禮，則人神慶悅，至誠感物，祥瑞必臻，故知“非且有且，非今斯今”，謂嘉慶、禎祥之事，非謂其有而已有之，以言報應之疾也。且實語助，但今謂今時，則且亦今時，其實是一，作者美其事而丁寧重言之耳。嘉慶謂王者所得美善之實事，禎祥謂嘉慶之前，先見為徵應者也。以其分為二文，故屬禎祥於上句，屬嘉慶於下句。但禎祥為嘉慶而先見，故言將有嘉慶禎祥先來見也。以禎祥是事之先應，故言先來見。嘉慶是善之實事，故云不聞而至。二者意亦同也。此禎祥、嘉慶自天為之，享燕之禮得所，不謂其至而已至。言修德行禮，莫不獲報，乃古又古以來當皆如此，非適今時美此大平之主，能重於農業，獲此福慶，故歌之也。" }
      - { type: j, text: "《戴芟》一章，三十一句。" }
      - { type: j, text: "《良耜》，秋報社稷也。○耜音似，田器也。" }
      - { type: z, text: "“《良耜》二十三句”。○正義曰：《良耜》詩者，秋報社稷之樂歌也。謂周公、成王太平之時，年穀豐稔，以為由社稷之所祐，故於秋物既成，王者乃祭社稷之神。以報生長之功。詩人述其事而作此歌焉。經之所陳，其末四句是報祭社稷之事。“婦子寧止”以上，言其耕種多獲，以明報祭所由，亦是報之事也。經言“百室盈止，婦子寧止”，乃是場功畢入，當十月之後，而得言秋報者，作者先陳人事使畢，然後言其報祭。其實報祭在秋，寧止在冬也。本或“秋”下有“冬”，衍字，與《豐年》之序相涉而誤。定本無“冬”字。" }
      - { type: j, text: "畟畟良耜，俶載南畝。播厥百穀，實函斯活。畟畟，猶測測也。箋雲：良，善也。農人測測以利善之耜，熾菑是南畝也，種此百穀，其種皆成好。含生氣，言得其時。○畟，楚側反，《爾雅》雲：“畟畟，耜也。”郭雲：“言嚴利也。”種，章勇反。" }
      - { type: z, text: "“畟畟良耜”。○毛以為，農人以畟畟然利刃善耜，始事於南畝而耕之，種其百眾之穀，其實皆含此當時生之氣，故生而漸長。農人事而芸之，於是有來視汝之農人者，載其方筐及其圓筥，其筐筥所盛以饟者，維是黍也。既饟到田，見其農夫所戴之笠維糾然，其田器之鎛以此趙而刺地，以薅去荼蓼之草。其荼蓼之草既朽敗止，黍稷乃茂盛止。及其成熟，乃獲刈之，挃挃然為聲。既獲訖，乃積聚之，慄慄然眾多。所積聚者，其大如城雉之峻壯，其比迫如櫛齒之相次。既蹂踐而治之，則以開百室，一時而納之。於是百室皆盈滿而多穀粟止，婦子皆不行而安寧止。天下大熟，民安如此，國家乃殺是犉牡之牲，有捄然者此牲之角。用此牲以報祭社稷。所以報祭之者，以嗣繼其先歲，復求其豐年，以續接其往事，復得以養人。又求良善司嗇以續古昔之人，庶其常勤勸農，常得豐年也。鄭唯“俶載”為“熾菑”為異。餘同。○傳“畟畟猶測測”。○正義曰：以畟畟文連良耜，則是刃利之狀，故猶測測以為利之意也。《釋訓》雲：“畟畟，耜也。”舍人曰：“畟畟，耜入地之貌。”郭璞曰：“言嚴利也。”" }
      - { type: j, text: "或來瞻女，載筐及筥。其饟伊黍，其笠伊糾。其鎛斯趙，以薅荼蓼。笠，所以御暑雨也。趙，刺也。蓼，水草也。箋雲：瞻，視也。有來視女，謂婦子來饁者也。筐筥，所以盛黍也。豐年之時，雖賤者猶食黍。饁者，見戴糾然之笠，以田器刺地，薅去荼蓼之事。言閔其勤苦。○筐，丘方反。筥，紀呂反。饟，式亮反。笠音立。糾，居黝反，又其皎反。鎛音博。趙，徒了反，刺也，又如字，沈起了反，又徒少反。薅，呼毛反，《說文》雲：“拔田草也。”又云：“或作茠。”引此以茠荼蓼。荼蓼，上音徒，下音了。刺，七亦反。下同。盛音成。去，起呂反。" }
      - { type: z, text: "傳“笠所”至“水草”。○正義曰：笠之為器，暑雨皆得御之，故兼言也。其鎛斯趙，則趙是用鎛之事。鎛是鋤類，故趙為刺地也。又《釋草》雲：“薔，虞蓼。”某氏曰：“薔一名虞蓼。”孫炎曰：“虞蓼是澤之所生，故為水草也。”蓼是穢草，荼亦穢草，非苦菜也。《釋草》雲：“荼，委葉。”舍人曰：“荼，一名委葉。某氏引此詩，則此荼謂委葉也。”王肅雲：“荼，陸穢。蓼，水草。”然則所由田有原有隰，故並舉水陸穢草。○箋“瞻視”至“勤苦”。○正義曰：“瞻，視”，《釋詁》文。下言“婦子寧止”，明此以為不寧，故知有來視汝，謂婦子來饁者也。筐筥之下，即雲饟黍，故知筐筥所以盛黍也。《少牢》、《特牲》大夫士之祭禮食有黍，明黍是貴也。《玉藻》雲：“子卯，稷食菜羹。”為忌日貶而用稷，是為賤也。賤者當食稷耳，故云“豐年之時，雖賤者猶食黍”。瞻汝，是見彼農人之時，而陳其笠其鎛，故知見農人戴糾然之笠，以田器刺地，薅去荼蓼之草。定本、《集註》皆雲“薅去荼蓼之事，言閔其勤苦”，與俗本不同。" }
      - { type: j, text: "荼蓼朽止，黍稷茂止。獲之挃々，積之慄慄。其崇如墉，其比如櫛，以開百室。挃々，獲聲也。慄慄，眾多也。墉，城也。箋雲：百室，一族也。草穢既除而禾稼茂，禾稼茂而穀成熟，谷成熟而積聚多。如墉也，如櫛也，以言積之高大，且相比迫也。其已治之，則百家開戶納之。千耦其耘，輩作尚眾也。一族同時納穀，親親也。百室者，出必共洫間而耕，入必共族中而居，又有祭酺合醵之歡。○朽，虛有反，爛也。挃，珍栗反。積，子賜反。比，毗志反。注同。櫛，側瑟反。酺音蒲，又音步。醵，其據反，又其略反，合錢飲酒也。" }
      - { type: z, text: "傳“挃挃”至“墉城”。○正義曰：《釋訓》雲：“挃挃，獲也。慄慄，眾也。”李巡曰：“慄慄，積聚之眾。”孫炎曰：“挃挃，獲聲也。”皆取此為說也。城之與牆，俱得為墉，但此比高大，故為城。○箋“百室”至“之歡”。○正義曰：《周禮》“五家為比，五比為閭，四閭為族”，是百室為一族。於六鄉則一族，於六遂則一酇。是鄭以鄉尊於遂，故舉鄉言耳。上篇言千耦，此篇言百室，雖未必一人作，而其文千百不同，故解其意。千耦其芸，輩作者尚眾，故舉多言也。一族同時納穀，見聚居者相親，故舉少言也。又解族、黨、州、鄉皆為聚屬，獨以百室為親親之意，由百室出必共洫間而耕，入必共族中而居，又有同祭酺合醵之歡也，故偏言之也。《遂人》雲：“百夫有洫。”故知百室共洫間而耕。彼注云：“百夫一酇之田，為六遂之法。族在六鄉，而引彼者，《小司徒》注云：“鄉之田制與遂同。”故得舉酇之制以言族也。祭酺者，《族師職》雲：“春秋祭酺。”注云：“酺者，為人物災害之神也。故書酺為步。杜子春雲：‘當為酺。’玄謂《校人職》又有‘冬祭馬步’，則未知此世所云蝝螟之酺與？人鬼之步與？蓋亦為壇位如雩禜。雲族無飲酒之禮，因祭酺而與其民以長幼相酬酢焉。”鄭於彼雖以酺步為疑，而以酺為正，故此以酺言之。蝝螟，食穀之蟲，害及人物，此神能為災害，故祭以止之。因此祭酺聚錢飲酒，故後世聽民聚飲，皆謂之酺。《漢書》每有嘉慶，令民大酺五日，是其事也。彼注云“因祭酺而與其民長幼相酬”，即此合醵也。《禮器》雲：“曾子曰：‘《周禮》其猶醵與？’”注云“合錢飲酒為醵。王居明堂之禮，乃命國醵”是也。《族師》雖雲祭酺，不言即為醵；《飲酒禮記》自有醵語，不雲醵是族法。鄭知祭酺必有飲酒，合醵是族法者，以《族師》上文雲月吉，則屬民而讀邦法，書其孝悌睦姻有學者，即雲春秋祭酺亦如之。是於祭酺亦屬民讀法，因祭而聚族民，明其必為行禮，不可徒然。又以族無飲酒之禮，故知因祭酺，必合錢飲酒，與其民長幼相酬酢也。《鄉飲酒》之禮，州長於春秋有屬民射於州序之禮，黨正於國索鬼神而祭祀，有屬民飲酒於序以正齒位之禮，此皆禮有飲酒，當以公物供之，無為須合錢也。唯族無飲酒之禮，明合錢飲酒，是《族師》之法，故箋以為同族之禮。" }
      - { type: j, text: "百室盈止，婦子寧止。殺時犉牡，有捄其角。以似以續，續古之人。黃牛黑唇曰犉。社稷之牛角尺。以似以續，嗣前歲，續往事也。箋雲：捄，角貌。五穀畢入，婦子則安，無行饁之事，於是殺牲報祭社稷。嗣前歲者，復求有豐年也。續往事者，復以養人也。續古之人，求有良司嗇也。○犉，如純反，本亦作“犉”。捄音虯。復，扶又反。下同。" }
      - { type: z, text: "傳“黃牛”至“往事”。○正義曰：《釋畜》直雲“黑唇犉”，以言黑唇，明不與身同色。牛之黃者眾，故知黃牛也。某氏亦云“黃牛黑唇曰犉”，取此傳為說也。《地官·牧人》雲：“凡陰祀，用黝生毛之。”注云：“陰祀，祭地北郊及社稷也。”然則社稷用黝，牛色以黑。而用黃者，蓋正禮用黝，至於報功，以社是土神，故用黃色，仍用黑唇也。以經言角，辨角之長短，故云“社稷之牛角尺”也。《王制》雲：“祭天地之牛，角繭栗。宗廟之牛，角握。賓客之牛，角尺。”無社稷之文。卑於宗廟，宜與賓客同尺也。《禮緯·稽命徵》雲：“宗廟社稷角握。”此箋不易毛傳，蓋以《禮緯》難信，不據以為正也。社稷太牢，獨雲牛者，牛三牲為大，故特言之。“以似以續”，似訓為嗣，嗣續俱是繼前之言，故為嗣前歲、續往歲之事。前、往，一也，皆求明年，使續今年，據明年而言，故謂今年為前、往也。○箋“捄角”至“司嗇”。○正義曰：此“有捄其角”，與“兕觥其”、“角弓其”，皆與角共文，故為角貌。以上言“其饟”，是婦子所為，此言“寧止”，遙結上句，故知安無行饁之事。序雲“秋報社稷”，故云“於是殺牲以報祭社稷”也。此為年豐報祭，而云更求嗣續，故知嗣前歲者，復求有豐年也。續往事者，復求以養人也。言今歲已有豐年，得穀養人，求今後歲復然也。嗣、續一義也，豐年、養人亦一事，箋因其異文而分屬之耳。《甫田》雲“以介我稷黍”，是求有年也。“以穀我士女”，是求養人也。“續古之人”，文連犉牡之末，則亦祭求之。非人無以續人，明求將來之人，使續往古之人。農事須人，唯司嗇耳，故知求有良司嗇，謂求善田畯也。言得善官教民，可以益使年豐故也。司嗇，己所選擇，而祭神求之者，得賢以否，亦是神明所助，故因祭求之。" }
      - { type: j, text: "《良耜》一章，二十三句。" }
      - { type: j, text: "《絲衣》，繹賓屍也。高子曰：“靈星之屍也。”繹，又祭也。天子諸侯曰繹，以祭之明日。卿大夫曰賓屍，與祭同日。周曰繹，商謂之肜。○繹，絲衣，繹祭之服，音亦，祭之明日又祭也。字書作“礻”。融，餘戎反，《尚書》作肜，音同。" }
      - { type: z, text: "“《絲衣》九句”。○正義曰：《絲衣》詩者，繹賓屍之樂歌也。謂周公、成王太平之時，祭宗廟之明日，又設祭事，以尋繹昨日之祭，謂之為繹。以賓事所祭之屍，行之得禮。詩人述其事而為此歌焉。經之所陳，皆繹祭始末之事也。子夏作序，則唯此一句而已。後世有“高子”者，別論他事。雲“靈星之屍”，言祭靈星之時，以人為屍。後人以高子言靈星尚有屍，宗廟之祭有屍，必矣，故引高子之言，以證賓屍之事。子夏說受聖旨，不須引人為證。毛公分序篇端，於時已有此語，必是子夏之後，毛公之前，有人著之，史傳無文，不知誰著之，故《鄭志》答張逸雲：“高子之言，非毛公後人著之。”止言“非毛公後人”，亦不知前人為誰也。以鄭言“非毛公後人著之”，不雲《詩》序本有此文，則知鄭意不以此為子夏之言也。鄭知非毛公後人著之者，鄭玄去毛公未為久遠，此書有所傳授，故知毛時有之。若是後人著之，則鄭宜除去，答之以此，明己不去之意，以毛公之時，已有此言故也。高子者，不知何人。孟軻弟子有公孫丑者，稱高子之言以問孟子，則高子與孟子同時。趙岐以為齊人。此言高子，蓋彼是也。靈星者，不知何星。《漢書·郊祀志》雲：“高祖詔御史：其令天下立靈星祠。”張晏曰：“龍星左角曰天田，則農祥也。晨見而祭之。”史傳之說靈星，唯有此耳。未知高子所言，是此以否。○箋“繹又”至“之肜”。○正義曰：“繹，又祭”，《釋天》文。李巡曰：“繹，明日復祭。”曰“又祭”，知天子諸侯同名曰繹。以祭之明日者，宣八年六月，“辛巳，有事於太廟。仲遂卒於垂。壬午，猶繹”。有事，謂祭事也。以辛巳日祭，壬午而繹，是魯為諸侯用祭之明日，此則天子之禮，同名曰繹，故知天子亦以祭之明日也。故《公羊傳》曰：“繹者何？祭之明日也。”知卿大夫曰賓屍者，今《少牢饋食禮》者，卿大夫之祭禮也，其下篇《有司徹》雲：“若不賓屍。”注云：“不賓屍，謂下大夫也。”以言“若不賓屍”，是對有賓屍者，《有司徹》所行，即賓屍之禮，是卿大夫曰“賓屍”。案其禮非異日之事，故知與祭同日。然則天子諸侯謂之繹，卿大夫謂之賓屍，是繹與賓屍事不同矣。而此序雲“繹賓屍”者，繹祭之禮，主為賓事此屍，但天子諸侯禮大，異日為之，別為立名，謂之為繹，言其尋繹昨日；卿大夫禮小，同日為之，不別立名，直指其事，謂之賓屍耳。此序言繹者，是此祭之名。賓屍是此祭之事，故特詳其文也。周曰繹，商謂之肜者，因繹又祭，遂取《釋天》以明異代之禮別也。彼雲“周曰繹，商曰肜”，孫炎曰：“肜者，亦相尋不絕之意。《尚書》有《高宗肜日》，是其事也。”" }
      - { type: j, text: "絲衣其紑，載弁俅俅。自堂徂基，自羊徂牛；鼐鼎及鼒，絲衣，祭服也。紑，絜鮮貌。俅俅，恭順貌。基，門塾之基。自羊徂牛，言先小後大也。大鼎謂之鼐。小鼎謂之鼒。箋雲：載，猶戴也。弁，爵弁也。爵弁而祭於王，士服也。繹禮輕，使士升門堂，視壺濯及籩豆之屬，降往於基，告濯具，又視牲從羊之牛，反告充已，乃舉鼎冪告潔，禮之次也。鼎圜弇上謂之鼒。○紑，孚浮反，徐孚不反，又音培，又音弗。載如字，又音戴，同。弁，皮變反。俅音求，恭慎也。《說文》作“絿”，同。鼐，乃代反，郭音乃。鼒音茲，徐音災，郭音才，《說文》作“鎡”字，音茲。塾音孰，門側堂也。或音育。冪，亡歷反，本亦作“{冖鼎}”。圜音圓。弇，古奄字。" }
      - { type: z, text: "“絲衣其紑”。○正義曰：此述繹祭之事。上五句言祭之初，下四句言祭之末。初言卑者恭順，則當祭尊者可知。祭末舉其不慢，則當祭敬明矣。是舉終始以見中，舉輕以明重。上言於祭之前，使士之行禮，在身所服，以絲為衣，其色紑然而鮮絜。在首載其爵色之麻弁，其貌俅俅而恭順。此絲衣載弁之人，從門堂之上，既視壺濯及籩豆，降往於門塾之基，告君以濯具。更視三牲，從羊而往牛，所以告肥充，又發舉其鼐鼎及鼒鼎之覆冪，而告此鼎之絜矣。祭之初，使卑者行事，尚能恭順，故至於當祭事屍，禮無失者，以此至於祭末，旅酬之節，兕觥罰爵，其然徒設，無所用之。所以然者，由此助祭飲美酒者，皆思自安，不讙譁，不傲慢，每事如禮，故無所罰。恭順如此，當於神明，是得壽考之休徵。言祭而得禮，必將得福，故美而歌之。○傳“絲衣”至“之鼒”。○正義曰：此述祭事，故知絲為之，故云“絲衣，祭服”。傳雖不解弁，亦當以為爵弁。爵弁之服，玄衣纁裳，皆以絲為之，故云絲衣也。絲衣與紑共文，故為絜鮮貌也。載弁，謂人戴弁也。戴弁者捄々，則俅俅人貌，故為恭順貌也。基，門塾之基者，《釋宮》雲：“門側之堂謂之塾。”孫炎曰：“夾門堂也。”《冬官·匠人》雲：“門堂三之二。”注云：“以為塾也。”《白虎通》雲：“所以必有塾何？欲以飾門，因取其名。明臣下當見於君，必熟思其事，是塾為門之堂也。直言‘自堂徂基’何？知非廟堂之基者。以繹禮在門，不在廟，故知非廟堂也。”《郊特牲》曰：“繹之於庫門內，祊之於東方，失之矣。”繹於門內為失，明其當在門外。祊以東方為失，明其當在西方。是祊之與繹，一時之事，故注云：“祊之禮宜於廟門外之西室，繹又於其堂，神位在西，二者同時，而大名曰繹。”又《禮器》曰：“為祊乎外。”注云：“祊祭，明日之繹祭也。謂之祊者，於廟門外之傍，因名焉。其祭之禮，既設祭於室，而事屍於堂。孝子求神非一處也。”以此二注言之，則祊、繹大同，而繹統名焉。繹必在門，故知基是門塾之基，謂廟門外西夾之堂基也。“自羊徂牛”，是從此往彼，為先後之次，故知詩意言先小後大，為行事之漸也。《釋器》雲：“鼎絕大者謂之鼐。”鼐既絕大，鼒自然小，故曰“小鼎謂之鼒”。此經自堂徂基，但言所往之處，不言所為之事。牛羊但言所視之物，不言所往之處，互相足也。鼐及鼒不言自徂，蒙上自徂之文。鼎則先大後小，與牛羊異者，取鼒為韻，故變其文也。○箋“載猶”至“之鼒”。○正義曰：載者，在上之名，故經稱載弁，若言以頭戴之，則於人易曉，故云載猶戴也。禮有冠弁、韋弁、皮弁，皆不以絲為衣，且非祭祀之服。《雜記》雲：“士弁而祭於公，冠而祭於己。”《士冠禮》有爵弁服純衣，與此絲衣相當，故知此弁是爵弁，士服之以助君祭也。又解天子之朝，群官多矣，所以不使服冕之人，而使戴弁之意，由繹之禮輕，故使士也。若正祭，則《小宗伯》雲：“視滌濯，祭之日，逆齊省鑊，告時於王，告備於王。”彼正祭重，使小宗伯。此繹祭輕，故使士，蓋亦宗伯之屬士也。知使士升門堂視壺濯及籩豆者，以《特牲》雖則士禮，而士卑，不嫌其禮得同君，故準《特牲》為說。《特牲》先夕陳事，主人即位於堂下。“宗人升自西階，視壺濯及籩豆，反降，東北面，告濯具。主人出，復外位。宗人視牲告充。宗人舉鼎冪告潔”。彼先視濯籩豆，次視牲，次舉冪，先後與此羊牛鼐次第正同。“自堂徂基”，文在牛羊之上，自然是視壺濯籩豆矣。以此知“自堂徂基”是告濯具，從羊之牛是告充，鼐鼎及鼒是舉冪告絜也。禮之次者，謂《特牲》之禮為此次，故準之以說天子之禮也。“鼎圜弇上謂之鼒”，《釋器》文。孫炎曰：“鼎斂上而小口者。”以傳直言小鼎，不說其形，故取《爾雅》文以足之。" }
      - { type: j, text: "兕觥其。旨酒思柔。不吳不敖，胡考之休！吳，譁也。考，成也。箋雲：柔，安也。繹之旅士用兕觥變於祭也，飲美酒者皆思自安，不讙譁，不敖慢也，此得壽考之休徵。○，字又作“兕”，徐履反。觥，古橫反，罰爵也，字又作“觵”，同。斛音虯，本又作“”。吳，舊如字，《說文》作吳。吳，大言也。何承天雲：“吳字誤，當作{口大}，從口，下大，故魚之大口者名{口大}，胡化反。此音恐驚俗也，音話。”敖，五誥反，本又作“傲”。注同。譁音花。讙，火官反，又火元反。慢，亡諫反。" }
      - { type: z, text: "傳“吳，譁。考，成”。○正義曰：人自娛樂，必讙譁為聲，故以娛為譁也。定本“娛”作“吳”。“考，成”，《釋詁》文。○箋“柔安”至“休徵”。○正義曰：“柔，安”，《釋詁》文。《少牢》、《特牲》大夫士之祭也，其禮小於天子，尚無兕觥，故知天子正祭無兕觥矣。今此繹之禮純，至旅酬而用兕觥，變於正祭也。知至旅而用之者，兕觥所以罰失禮，未旅之前，無所可罰，至旅而可獻酬交錯，或容失禮，宜於此時設之也。《有司徹》是大夫賓屍之禮，猶天子之繹，所以無兕觥。解者以大夫禮小，即以祭日行事，未宜有失，故無也。上經說祭初行禮，唯謂士耳。此言飲美酒皆思自安，則是諸助祭者，非獨士也。以祭末多倦怠傲慢，故美其於祭之末能不讙譁，不傲慢，則於祭前齊敬，明矣。恭敬明神必將獲福，故以此得壽考之休徵。壽考，未然之事，故言徵也。" }
      - { type: j, text: "《絲衣》一章，九句。" }
      - { type: j, text: "《酌》，告成《大武》也。言能酌先祖之道，以養天下也。周公居攝六年，制禮作樂，歸政成王，乃後祭於廟而奏之。其始成告之而已。○酌音灼，字亦作“汋”。大如字，徐音泰。" }
      - { type: z, text: "“《酌》九句”。○正義曰：《酌》詩者，告成《大武》之樂歌也。謂周公攝政六年，象武王之事，作《大武》之樂既成，而告於廟。作者睹其樂成，而思其武功，述之而作此歌焉。此經無酌字，序又說名“酌”之意，言武王能酌取先祖之道，以養天下之民，故名篇為《酌》。毛以為，述武王取紂之事，即是《武》樂所象。鄭以為，武王克殷，用文王之道，故經述文王之事，以昭成功所由。功成而作此樂，所以上本之也。言“告成《大武》”，不言所告之廟。《有瞽》“始作樂而合乎太祖”，此亦當告太祖也。《大司樂》“舞《大武》以享先祖”，然則諸廟之中，皆用此樂，或亦遍告群廟也。言酌先祖之道者，周之先祖，后稷以來，先世多有美道，武王酌取用之，除殘去暴，育養天下，故詩人為篇立名，謂之為《酌》。序其名篇之意，於經無所當也。鄭以經陳文王之道，武王得而用之，亦是酌取之義，但所酌之事不止此耳。經有“遵養時晦”，毛謂武王取紂，鄭為文王養紂，此言以養天下，則是愛養萬民，非養紂身。雖養字為同，非經養也。酌，《左傳》作“汋”，古今字耳。○箋“周公”至“而已”。○正義曰：“周公攝政六年，制禮作樂”，《明堂位》文。雖六年已作，歸政成王乃後祭於廟而奏之，初成之時未奏用也，其始成，告之而已，故此篇歌其告成之事。言此者，以明告之早晚，謂在居攝六年告之也。知然者，以《洛誥》為攝政七年之事，而經稱周公戒成王雲：“肇稱殷禮，祀於新邑。”明待成王即政，乃行《周禮》。禮既如此，樂亦宜然，故知《大武》之樂，歸政成王始祭廟奏，周公初成之日，告之而已。" }
      - { type: j, text: "於鑠王師，遵養時晦。時純熙矣，是用大介。鑠，美。遵，率。養，取。晦，昧也。箋雲：純，大。熙，興。介，助也。於美乎文王之用師，率殷之叛國以事紂，養是闇昧之君，以老其惡，是周道大興，而天下歸往矣，故有致死之士助之。○於音烏。注同，鑠，舒灼反。" }
      - { type: z, text: "“於鑠王師”。○毛以為，因告《大武》之成，故歌武王之事。於乎美哉，武王之用師也，率此師以取是闇昧之君。謂誅紂以定天下。由既誅紂，故於是令周道大明盛矣。是大明之故，遂有大而又大，謂致今時之太平也。又本用師取昧之事，所以為可美者，以我周家用天人之和而受。之言以和受殷，非苟用強力也。蹻蹻然有威武之貌者，我武王之所為，則用此武而有嗣文王之功。王能如是，故歎美之，實維爾王之事，信得用師之道，以此故作為《大武》，以象其事。鄭以為，《大武》象武王伐紂，本由文王之功，故因告成《大武》，追美文王之事。於乎美哉，文王之用師眾也，乃率殷之叛國，養是闇昧之君，以成其惡，故民服文王能以多事寡，以是周道乃大興矣。由有至美之德，誠義足以感人，是以大賢士來而助之。賢士既來，我文王寵而受之。來者既受用，故蹻蹻然有威武之士競於我王之造。言其皆來造王，王則寵而用之。以此而有嗣續，言其傳相致達，續來不絕。由是武王因之，得成功作樂，故歎美之。實維以武王之事，信得用師之道。言武王以文王之故，故得道也。○傳“鑠美”至“晦昧”。○正義曰：“鑠，美”，《釋詁》文。又云：“遵、率，循也。”俱訓為循，是遵得為率。武王於紂，養而取之，故以養為取。宣十二年《左傳》引此雲：“遵養時晦”，耆昧也。故轉晦為昧，言取是闇昧，則謂武王取紂，不得與鄭同也。又緝熙之訓，皆為光明。介字，毛皆為大，則此亦宜然。王肅雲：“於乎美哉，武王之用眾也，率以取是昧。謂誅紂定天下以除昧也，於是道大明。是用有大大，言太平也。”○箋“純大”至“助之”。○正義曰：“純，大。熙，興”，皆《釋詁》文。以卒句乃言信得用師之道，於此未宜歎其大大，故依常訓，以介為助。以武王之業因於文王，養紂不伐，是文王之事，此說大武功成，文宜本之於父，故以為美文王之師。養者，承事之辭，故云“率殷之叛國以事紂”。《左傳》雲：“耆昧也。”《皇矣》雲：“上帝耆之。”是養之至老，故云“養是闇昧之君，以老其惡”。《論語》雲：“三分天下有其二，以服事殷，周之德可謂之至德。”孔子歎美文王，謂之至德，是周道以養紂之故，遂得大興也。《孟子》說“伯夷避紂，居北海之濱。太公避紂，居東海之濱。聞文王作，興而歸之。二老者，天下之大老也，而歸之，是天下父歸之也。天下父歸之，其子焉往”也。是天下歸往之也。文武之士並歸周，但下言蹻蹻是威武之貌，故云“有致死之士眾來助之”。“文王率殷之叛國以事紂”，襄四年《左傳》文。" }
      - { type: j, text: "我龍受之，蹻蹻王之造，載用有嗣，龍，和也。蹻蹻，武貌。造，為也。箋雲：龍，寵也。來助我者，我寵而受用之。蹻蹻之士，皆爭來造王，王則用之。有嗣，傳相致。○蹻，居表反。造，毛才老反，鄭七報反，詣也。傳，直專反。" }
      - { type: z, text: "傳“龍和”至“造為”。○正義曰：龍之為和，其訓未聞。《魯頌》稱“蹻蹻虎臣”，故為武貌。“造，為”，《釋言》文。王肅雲：“我周家以天人之和而受殷，用武德嗣文之功。”傳意或然。天人之和，謂天助人從，和同與周也。○箋“龍寵”至“相致”。○正義曰：上言大介為大來助周，則我龍受之。龍此大介，寵字以龍為聲，故龍為寵也。來即寵受，人皆羨之，故蹻蹻之士爭來造王，而王又用之，則其餘嗣續而至。《儒行》說交友之道，久相待，遠相致，故以“有嗣”為“傳相致”也。從大介至有嗣，節之為三等，言從周之士有先後而至也。" }
      - { type: j, text: "實維爾公允師。公，事也。箋雲：允，信也。王之事所以舉兵克勝者，實維女之事信，得用師之道。" }
      - { type: z, text: "箋“允信”至“之道”。○正義曰：“允，信”，《釋詁》文。上說行文王之事，至此乃述武王，故言武王之事，所以舉兵克勝，謂伐紂勝之也。" }
      - { type: j, text: "《酌》一章，九句。" }
      - { type: j, text: "《桓》，講武類禡也。桓，武志也。類也，禡也，皆師祭也。○禡，馬嫁反。“桓，武志也”，本或以此句為注。" }
      - { type: z, text: "“《桓》九句”。○正義曰：《桓》詩者，講武類禡之樂歌也。謂武王將欲伐殷，陳列六軍，講習武事，又為類祭於上帝，為禡祭於所徵之地。治兵祭神，然後克紂。至周公、成王太平之時，詩人追述其事而為此歌焉。序又說名篇之意。桓者，威武之志。言講武之時，軍師皆武，故取桓字名篇也。此經雖有桓字，止言王身之武。名篇曰《桓》，則謂軍眾盡武。《諡法》“闢土服遠曰桓”，是有威武之義。桓字雖出於經，而與經小異，故特解之。經之所陳，武王伐紂之後，民安年豐，克定王業，代殷為王，皆由講武類禡得使之然。作者主美武王，意在本由類禡，故序達其意，言其作之所由。講武是軍眾初出，在國治兵也。類則於內祭天，禡則在於所徵之地。自內而出，為事之次也。○箋“類也”至“師祭”。○正義曰：《釋天》雲：“是類是禡，師祭也。”《王制》雲：“天子將出徵，類乎上帝，禡於所徵之地。”注云：“上帝，謂五德之帝所祭於南郊者。”言祭於南郊，則是感生之帝，夏正於南郊祭者。周則蒼帝靈威仰也。南郊所祭一帝而已，而云五德之帝者，以《記》文不指言周，不得斥言蒼帝，故漫言五德之帝以總之。又嫌普祭五帝，故言“南郊”以別之。五德者，五行之德。此五方之帝各有本德，故稱五德之帝。太昊炎帝之等，感五行之德生，亦得謂之五德之帝。但類於上帝，謂祭上天，非祭人帝也。且人帝無特在南郊祭者。以此知非人帝也。謂之類者，《尚書》歐陽說以事類祭之，天位在南方，就南郊祭之。《春官·肆師》雲：“類造上帝。”注云：“造猶即也。為兆以類禮即祭上帝也。”類禮依郊祀而為之者，言依郊祀為之，是用歐陽事類之說為義也。言為兆以祭上帝，則是隨兵所向，就而祭之，不必祭於南郊。但所祭者，是南郊所祭之天耳，正以言造，故知就其所往為其兆位而祭之，不要在南郊。此言小異於歐陽也。南郊之祭天，周以稷配。此師祭所配，亦宜用常配之人，周即當以後稷也。禡之所祭，其神不明。《肆師》雲：“凡四時之大田獵祭表貉，則為位。”注云：“貉，師祭也。於立表處為師祭，祭造軍法者，禱氣勢之增倍也。其神蓋蚩尤，或曰黃帝。”又《甸祝》“掌四時之田表貉之祝號”。杜子春雲：“貉，兵祭也。田以講武治兵，故有兵祭，習兵之禮，故貉祭禱氣勢之十百而多獲。”由此二注言之，則禡祭造兵為軍法者，為表以祭之。禡，《周禮》作“貉”，“貉”又或為“貊”字，古今之異也。貉之言百，祭祀此神，求獲百倍。" }
      - { type: j, text: "綏萬邦，婁豐年。箋雲：綏，安也。婁，亟也。誅無道，安天下，則亟有豐熟之年，陰陽和也。○婁，力住反。亟，欺冀反，數也。下同。" }
      - { type: z, text: "“綏萬邦”。○毛以為，武王誅紂之後，安此萬邦，使無兵寇之害，數有豐年，無饑饉之憂。所以得然者，上天所命，命為善不解倦者以為天子。桓桓然有威武之武王，則能安有其天下之事，是其為善不倦，故為天所命。於是用其武事於四方，除其四方之殘賊，能安定其家。謂成就先王之業，遂為天下之主。乃歎而美之，於乎此武王之德，乃明見於天。殷紂以暴虐之故，武王得用此美道以代之。○鄭唯下二句為異。言於明乎曰天，言天道之大明也。紂為天下之君，但由為惡之故，天以武王代之。餘同。○箋“綏安”至“陽和”。○正義曰：“綏，安”，《釋詁》文。又云：“亟、屢，疾也。”同訓為疾，是屢得為亟也。經言萬國，箋言天下，天下即萬國也。《堯典》雲：“協和萬邦。”哀七年《左傳》曰：“禹會諸侯於塗山，執玉帛者萬國。”則唐、虞、夏禹之時，乃有此萬國耳。《王制》之注以殷之與周唯千七百七十三國，無萬國矣。此言萬國者，因下有萬國，遂舉其大數。此文廣言天下之大，不斥諸侯之身，國數自可隨時變易，其地猶是萬國之境，故得舉萬言之。此安天下，有豐年，謂伐紂即然。僖十九年《左傳》雲：“昔周飢，克殷而年豐。”是伐紂之後，即有豐年也。" }
      - { type: j, text: "天命匪解。桓桓武王，保有厥士。於以四方，克定厥家。士，事也。箋雲：天命為善不解倦者，以為天子我桓桓有威武之武王，則能安有天下之事。此言其當天意也，於是用武事於四方，能定其家先王之業，遂有天下。○解音懈。注同。" }
      - { type: z, text: "箋“天命”至“天下”。○正義曰：以“天命匪解”為下文總之。“克定厥家”，是天子之事，故知天命以為天子也。安有天下之事，謂天下眾事，武王能安而有之，以天下為任，而行之不解，言其當於天意也。以當天意，故天命之，於是用其武事於四方，謂既能誅紂，又四方盡定，由是萬國得安，陰陽得和。此言結上之意也。家者，承世之辭，故云能定其家先王之業，遂有天下。先王雖有其業，而家道未定，故於伐紂，其家始定也。" }
      - { type: j, text: "於昭於天，皇以間之。間，代也。箋雲：於，曰也。皇，君也。於明乎曰天也，紂為天下之君，但由為惡，天以武王代之。○於音烏。注同，間，間廁之間。注同。" }
      - { type: z, text: "傳“間，代”。○正義曰：《釋詁》文。毛傳未有以於為曰，皇多為美，此義必不與鄭同也。王肅雲：“於乎周道，乃昭見於天，故用美道代殷，定天下。”傳意或然。○箋“於曰”至“代之”。○正義曰：“於，曰。皇，君”，《釋詁》文。言於明乎曰天，言天去惡與善，其道至光明也。以武王代紂，即是明之事。言武王當天意以代，紂所以歎美之。" }
      - { type: j, text: "《桓》一章，九句。" }
      - { type: j, text: "《賚》，大封於廟也。賚，予也，言所以錫予善人也。大封，武王伐紂時，封諸臣有功者。○賚，來代反，與也，徐又音來。" }
      - { type: z, text: "“《賚》六句”。○正義曰：《賚》詩者，大封於廟之樂歌也。謂武王既伐紂，於廟中大封有功之臣以為諸侯。周公、成王大平之時，詩人追述其事而為此歌焉。經無“賚”字，序又說其名篇之意。賚，予也。言所以錫予善德之人，故名篇曰《賚》。經之所陳，皆是武王陳文王之德，以戒敕受封之人，是其大封之事也。此言大封於廟，謂文王廟也。《樂記》說武王克殷之事雲：“將帥之士，使為諸侯。”下文則雲：“虎奔之士，脫劍祀乎明堂。”注云：“文王之廟為明堂制。”是大封諸侯在文王之廟也。○箋“大封”至“有功者”。○正義曰：以言大封，則所封者廣。唯初定天下，可有此事，守文之世，不應得然。且宣十二年《左傳》曰：“昔武王克商而作頌，其三曰：‘敷時繹思，我徂維求定。’”引此文以為武王之頌，故知武王伐紂時，封諸臣有功者，封為諸侯。《樂記》說“武王克殷，未及下車而封薊、祝、陳，下車而封杞、宋”，又言“將率之士使為諸侯”，是大封也。昭二十八年《左傳》曰“昔武王克商，光有天下，其兄弟之國者十有五人，姬姓之國者四十人”，《古文尚書·武成篇》說“武王克殷而反，祀於周廟，列爵惟五，分土惟三，大賚於四海，而萬民悅服”，皆是武王大封之事。此言大封於廟，《樂記》未至廟而已封三恪二代者，言其急於先代之意耳。《祭統》曰：“古者明君必賜爵祿於太廟，示不敢專也。”然則武王未及下車，雖有命封之，必至廟受策，乃成封耳，亦在此大封之中也。皇甫謐雲：“武王伐紂之年，夏四月乙卯，祀於周廟。將率之士皆封，諸侯國四百人，兄弟之國十五人，同姓之國四十人。”如謐之言，此大封是伐紂之年事也。" }
      - { type: j, text: "文王既勤止，我應受之。敷時繹思，我徂維求定。勤，勞。應，當。繹，陳也。箋雲：敷，猶徧也。文王既勞心於政事，以有天下之業，我當而受之。敷是文王之勞心，能陳繹而行之。今我往以此求定。謂安天下也。○敷音孚。繹音亦。徧音遍。下篇同。" }
      - { type: z, text: "“文王既勤止”。○正義曰：武王既封諸臣有功者於文王之廟，因以文王之道戒敕之。言我父文王既以勤勞於政事止，以勤勞於事，故有此天下之業。我當受而有之，故我徧於是文王勞心之事，皆陳而思行之，我往以此維求安定。言用文王之道，往行天下，以求天下之定。此文王勞心之事，是我周之受天命而王之所由。於乎，今汝諸臣受封者，亦當陳而思行之。言己陳行文王之道，敕諸臣，亦使陳而行之，以此而至於太平，故追述而歌之也。○傳“勤，勞。應，當。繹，陳”。○正義曰：皆《釋詁》文。○箋“敷猶”至“天下”。○正義曰：敷訓為布，是廣及之義，故云“猶徧也”。文王既勞心於政事者，《尚書》所謂“日昃不遑暇食”，是其事也。由此勞心，以有天下之業。我當受之，謂受其位為天子也。今我往以此求定者，往者，自已及物之辭，謂行之於天下，以求安定天下也。" }
      - { type: j, text: "時周之命，於繹思。箋雲：勞心者，是周之所以受天命，而王之所由也。於女諸臣受封者，陳繹而思行之，以文王之功業敕勸之。○於，鄭如字，王音烏。王，於況反，又如字。下篇同。" }
      - { type: z, text: "箋“勞心”至“勸之”。○正義曰：言是者，上之勞心也。上天之命，命不解怠者，故知勞心是周之所以受天命，而王之所由。此詩為大封而作，故知“於繹思”是敕諸臣受封，使陳而思行之。文王之道，可永為大法，故以文王之功業敕勸之。於亦歎辭也。" }
      - { type: j, text: "《賚》一章，六句。" }
      - { type: j, text: "《般》，巡守而祀四嶽河海也。般，樂也。○般，薄寒反。注同。守，手又反。“般樂也”，音洛。崔《集註》本用此注為序文。" }
      - { type: z, text: "“《般》七句”。○正義曰：《般》詩者，巡守而祀四嶽河海之樂歌也。謂武王既定天下，巡行諸侯所守之土，祭祀四嶽河海之神，神皆饗其祭祀，降之福助。至周公、成王太平之時，詩人述其事而作此歌焉。經稱“喬嶽”、“翕河”，是祀河、嶽之事也。經無“般”字，序又說其名篇之意。般，樂也，為天下所美樂。定本“般樂”二字為鄭注，未知孰是。嶽實有五，而稱四者，天子巡守，遠適四方，至於其方之嶽，有此祭禮。於中嶽無事，故序不言焉。四瀆者，五嶽之匹，故《周禮》嶽瀆連文。序既不言五嶽，故亦不言四瀆。以河是四瀆之一，故舉以為言。《漢書·溝洫志》曰：“中國川原以百數，莫著於四瀆，而河為宗。”然則河為四瀆之長。巡守四瀆皆祭，言河可以兼之。經無海而序言海者，海是眾川所歸，經雖不說，祭之可知，故序特言之。" }
      - { type: j, text: "於皇時周，陟其高山，嶞山喬嶽，允猶翕河。高山，四嶽也。墮山，山之嶞墮小者也。翕，合也。箋雲：皇，君。喬，高。猶，圖也。於乎美哉，君是周邦而巡守，其所至則登其高山而祭之，望秩於山川。小山及高嶽，皆信案山川之圖而次序祭之。河言合者，河自大陸之北敷為九，祭者合為一。○於音烏。注同。嶞，吐果反。注同。郭雲：“山狹而長也。”又同果反，字又作“墮”。喬嶽，上音橋，下音嶽。翕，許及反。" }
      - { type: z, text: "“於皇時周”。○毛以為，於乎美哉，是周家也。既定天下，巡省四方，所至之處，則登其高山之嶽而祭之。其祭之也，於大山之傍，有嶞嶞然之小山，與高而為嶽者，皆信案山川之圖者，又合九河為一，以大小次序而祭之也。徧天之下山川，皆聚其神於是，配而祭之。能為百神之主，德合山川之靈，是周之所以受天命由此也。○鄭唯以皇為君、褒為眾為異。餘同。○傳“高山”至“翕合”。○正義曰：嶽必山之高者，故知“高山，四嶽也”。嶞山對高山為小，故知山之小者墮墮然，言其狹長之意也。毛於皇字多訓為美。主肅雲：“美矣，是周道已成，天下無違，四面巡嶽，升祭其高山。”傳意或然。“翕，合”，《釋詁》文。○箋“皇君”至“為一”。○正義曰：“皇，君。喬，高”，《釋詁》文。“猶，圖”，《釋言》文。以於己是歎美之辭，故以皇為君。君是周邦，謂為天子也。巡守所至，則登其高山而祭之，謂每至其方，告祭其方之嶽也。《堯典》及《王制》說巡守之禮，皆言望秩于山川。《堯典》注云：“徧以尊卑次秩祭之。”則知“嶞山喬嶽，允猶翕河”，皆謂秩祭之事，故云“小山高嶽，皆信案山川之圖，而次序祭之”。此即望秩之事也。喬嶽與上句高山猶是一事，但巡守之禮，其祭主於方岳，故先言“陟其高山”。又說望秩之意，言小山亦可與四嶽同祭，故又言喬嶽，令與小山為類，見其同祭之耳。“允猶”之文，承“山嶽”之下，可案山圖耳。而並雲川者，山之與川，共為一圖，言望秩山川，則亦案圖耳。但河分為九，合而祭之一，故退“翕河”之文在“允猶”之下，使之不蒙“允猶”。自河以外，其餘眾川，明皆案圖祭之，故云“信案山川之圖”。信者，謂審信而案之。又解山不言合，獨河言合者，河自大陸之北敷為九河，祭者合之為一，故云翕也。《禹貢》“導河自積石，至於龍門。南至於華陰，東至於厎柱，又東至於孟津。東過洛汭，至於大岯。北過降水，至於大陸。又北播為九河，同為逆河，入於海”。是大陸之北敷為九河。敷者，分散之言，與播義同，故彼注云：“播，猶散也。同，合也。下尾合為逆河，言相迎受也。”然則因大陸分而為九，至下又合為一，以其首尾是一，故祭者合之。《漢書·地理志》“鉅鹿郡有鉅鹿縣，大陸澤在其北”。《禹貢》注云：“在鉅鹿。”《鄭志》答張逸雲：“鉅鹿，今名廣河澤。”然則河從廣河之北分為九也。《禹貢》兗州，“九河既道”，孔安國注云“河水分為九道，在此州界平原以北”是也。鄭注云：“河水自上至此，流盛而地平無岸，故能分為九，以衰其勢。壅塞，故通利之也。九河之名：徒駭、大史、馬頰、覆釜、胡蘇、簡、絜、鉤盤、鬲津。周時齊桓公塞之，同為一。今河間弓高以東，至平原鬲盤，往往有其遺處焉。”鄭言九河之名，《釋水》文也。李巡曰：“徒駭者，禹疏九河以徒眾起，故曰徒駭。大史者，禹大使徒眾通水道，故曰大史。馬頰者，河勢上廣下狹，狀如馬頰。覆釜者，水多渚，其渚往往而處狀如覆釜。胡蘇者，其水下流，故曰胡蘇。胡，下也。蘇，流也。簡者，水深而簡大也。絜者，言河水多山石之苦，故絜絜苦也。鉤盤者，河水曲如鉤，屈折如盤，故曰鉤盤。鬲津者，河水狹小，可隔為津，故曰鬲津。”孫炎曰：“徒駭者，禹疏九河，功難，眾懼不成，故曰徒駭。太史者，大使徒眾，故依名雲。胡蘇者，水流多散胡蘇然。簡者，水通易也。鉤盤者，水曲如鉤，盤桓不前也。鬲津者，水多阨狹，可隔以為津而橫渡也。”是解九河之名意也。《溝洫志》稱，成帝時，博士許商以為“古記九河之名，有徒駭、胡蘇、鬲津，今見在成平、東光、鬲界中。自鬲以北至徒駭間，相去二百餘裏，今河雖數移，不離此域”。如商此言，上舉三河之名，下以縣充之，則徒駭在成平，胡蘇在東光，鬲津在鬲縣。其餘六者，商所不言，蓋於時以不能詳知其處故也。又商言“自鬲以北至徒駭間，相去二百餘裏”，則徒駭是九河之最北者，鬲津是九河之最南者，然則《爾雅》之文從北而說也。太史、馬頰、覆釜文在胡蘇之上，則三者在成平之南、東光之北也。簡、絜、鉤盤文在胡蘇之下，則三者在東光之南、鬲縣之北也。鄭亦不能具知所在，故云“往往有其遺處”，是其不審之辭也。郭璞雲：“徒駭今在成平縣，東光有胡蘇亭，鬲、盤今皆為縣，屬平原渤海。東光、成平、河間、弓高以東，往往有其遺處焉。”璞言盤今為縣，以為盤縣，其餘亦不審也。雖古之河跡難得而詳，要於《禹貢》之時，皆在兗州之界。於漢之世，則兗州之所部近南，其界不及於北，故《鄭志》趙商謂“河在兗州之北已分為九河，分而複合，於大陸之北又分為九”。故問之曰：“《禹貢》導河至於大陸，又北播為九河，然則大陸以南固未播也，在於兗州安得有九？至於何時復得合為一，然後從大陸已北復播為九也？答曰：“兗州以濟河為界，河流分兗州界，文自明矣。複合為一，乃在下頭。子走南北，何所求乎？觀子所云，似徒見今兗州之界不及九河，而青、冀州分之，故疑之耳。”既知今，亦當知古，是鄭以古之九河皆在兗州之界，於漢乃冀州域耳。言複合為一，乃在下頭，正以經雲“同為逆河，入於海”，明併為一河，乃入於海，故云“在下頭”耳。亦不知所並之處，故不斥言之。齊桓公塞為一者，不知所出何書。其併為一，未知並從何者。" }
      - { type: j, text: "敷天之下，裒時之對，時周之命。裒，聚也。箋雲：裒，眾。對，配也。徧天之下眾山川之神，皆如是配而祭之，是周之所以受天命而王也。○裒，蒲侯反。“於繹思”，《毛詩》無此句，《齊》、《魯》、《韓詩》有之。今《毛詩》有者，衍文也。崔《集註》本有，是採三家之本，崔因有，故解之。" }
      - { type: z, text: "傳“裒，聚”。○正義曰：《釋詁》文。○箋“裒聚”至“而王”。○正義曰：《釋詁》雲：“裒、眾，多也。”俱訓為多，是裒得為眾。《釋詁》雲：“妃、合、會，對。”是對得為配。言徧天之下，則無有不祭，故以為眾山川之神皆配祭之。正言配者，山川大小相從配之，祭無不徧之意也。是周之所以受天命而王者，言其得神之助，故能受天之命。武王受命伐紂，後乃巡守，方始祭祀山川，而云受命由此者，作者以神能助人，歸功於神，見受命之前己能敬神，及今巡守猶能敬之，故所以得受天命而王天下，言此是神明之助故也。此篇末俗本有“於繹思”三字，誤也。" }
      - { type: j, text: "《般》一章，七句。" }
      - { type: j, text: "《毛詩正義》" }
