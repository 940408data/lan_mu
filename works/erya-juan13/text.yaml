# 爾雅注疏卷13（邢昺疏）：j 為經文＋晉郭璞注，z 為疏文。
sections:
  - id: juan13
    name: 正文
    blocks:
      - { type: z, text: "\"释丘第十\"。○释曰：案《广雅》云：\"小陵曰丘。\"《说文解字》曰：\"土之高也，非人所为也。从北，从一。一，地也。人居在丘南，故从北。中邦之居在昆仑东南。一曰：四方高、中央下为丘。象形。\"此下云非人为之丘。然则土有自然而高、小於陵者名丘也。其体虽一，其名则多。或近道途，或因水泽所如，则陵亩各异，其重则再三不同，通见《诗》、《书》。此篇具释，故名释丘。" }
      - { type: j, text: "丘，一成为敦丘，（成犹重也。《周礼》曰：\"为坛三成。\"今江东呼地高堆者为敦。○敦，都昆）" }
      - { type: z, text: "\"丘，一成为敦丘\"。○释曰：成，重也。言丘上更有一丘相重累者，名敦丘。《诗•卫风•氓》篇云：\"送子涉淇，至于顿丘。\"是也。○注\"成犹\"至\"为敦\"。○释曰：孙炎云：\"形如覆敦，敦器似盂。\"今案，下文别云\"如覆敦者，敦丘\"，则此自是丘之一重者。故郭氏云：\"成犹重也。\"与孙氏意异。云\"《周礼》曰'为坛三成'\"者，此《秋官•司仪职》文也。郑司农云：\"三成，三重也。\"引之证成为重也。" }
      - { type: j, text: "再成为陶丘，（今济阴定陶城中有陶丘）" }
      - { type: z, text: "\"再成为陶丘\"。○释曰：丘形上有两丘相重累者，名陶丘。李巡曰：\"再成，其形再重也。\"《禹贡》曰\"济水东出于陶丘北\"是也。○注\"今济\"至\"陶丘\"。○释曰：济阴，郡名；定陶，县名。《地理志》云\"定陶县西南有陶丘亭\"是也。" }
      - { type: j, text: "再成锐上为融丘，（纤顶者。○锐，音惠）" }
      - { type: z, text: "\"再成锐上为融\"。○释曰：丘形再重而顶纤者，名融丘也。" }
      - { type: j, text: "三成为昆仑丘。（昆仑山三重，故以名云）" }
      - { type: z, text: "\"三成为昆仑丘\"。○释曰：丘形三重者名昆仑丘。○注\"昆仑山三重，故以名云\"。○释曰：《昆仑山记》云：\"昆仑山，一名昆丘，三重，高万一千里。\"是也。凡丘之形三重者，因取此名云耳。" }
      - { type: j, text: "如椉者，椉丘。（形似车椉也。或云：\"椉者，谓稻田塍埒。\"○椉，绳正切）" }
      - { type: z, text: "\"如椉者，椉丘\"。释曰：郭氏两解：一云\"形似车椉也\"。（绳证切）二或云\"椉，谓稻田塍埒\"。椉，市陵切。许叔重云：塍埒，稻田畦堤。埒，畔也。案《地理志》云：\"泰山有椉丘。\"《春秋》庄十年：\"公败宋师于乘丘。\"是因丘以为名乎？" }
      - { type: j, text: "如陼者者，陼者丘。（水中小洲为陼者。○陼者，渚）" }
      - { type: z, text: "\"如陼者者，陼者丘\"。○释曰：陼者，水中可居之小者。丘形似之，名为陼者丘也。" }
      - { type: j, text: "水潦所止，泥丘。（顶上污下者。○潦，音老）" }
      - { type: z, text: "\"水潦所止，泥丘\"。○释曰：水潦，雨水也。丘形顶上污下，潦水停止而成泥泞者，名泥丘。" }
      - { type: j, text: "方丘，胡丘。（形四方）" }
      - { type: z, text: "\"方丘，胡丘\"。○释曰：丘形四方者名胡丘。" }
      - { type: j, text: "绝高为之京。（人力所作）" }
      - { type: z, text: "\"绝高为之京\"。○释曰：言卓绝高大如丘，而人力为作之者名京。案，《春秋》宣十二年《左传》楚败晋师於必阝。潘党曰：\"君盍筑武军而收晋尸以为京观？\"楚子曰云云，\"今罪无所，而民皆尽忠以死君命，又可以为京乎？\"是其类也。" }
      - { type: j, text: "非人为之丘。（地自然生）" }
      - { type: z, text: "\"非人为之丘\"。○释曰：李巡云：\"谓非人力所为，自然生者。\"孙炎曰：\"地性自然也。\"故郭云：\"地自然生。\"" }
      - { type: j, text: "水潦所还，埒丘。（谓丘边有界埒，水环绕之）" }
      - { type: z, text: "\"水潦所还，埒丘\"。○释曰：还，环绕也。埒，小堤也，壝土为之。言此丘边有其界埒，外则为水潦环绕者，名埒丘。" }
      - { type: j, text: "上正，章丘。（顶平）" }
      - { type: z, text: "\"上正，章丘\"。○释曰：丘顶上平正者，名章丘。章亦平也。" }
      - { type: j, text: "泽中有丘，都丘。（在池泽中）" }
      - { type: z, text: "\"泽中有丘，都丘\"。○释曰：都，水所聚也。言在池泽中者，因名都丘。" }
      - { type: j, text: "当途，梧丘。（途，道）" }
      - { type: z, text: "\"当途，梧丘\"。○释曰：途，道也。梧，遇也。当道有名梧丘，言若相遇於道路然也。" }
      - { type: j, text: "途出其右而还之，画丘。（言为道所规画。○还，音旋）" }
      - { type: z, text: "\"途出其右而还之，画丘\"。○释曰：右谓西也。还，绕也。画，规画也。言道出丘西而复环绕之者，名画丘，若为道所规画然也。" }
      - { type: j, text: "途出其前，戴丘。（道出丘南）" }
      - { type: z, text: "\"途出其前，戴丘\"。○释曰：谓道过丘南，若为道负戴，故为戴丘。" }
      - { type: j, text: "途出其後，昌丘。（道出丘北）" }
      - { type: z, text: "\"途出其後，昌丘\"。○释曰：谓道过丘北者，名昌丘。" }
      - { type: j, text: "水出其前，渻丘。水出其後，沮丘。水出其右，正丘。水出其左，营丘。（今齐之营丘，淄水过其南及东。○渻，所景。沮，辞与）" }
      - { type: z, text: "\"水出\"至\"营丘\"。○释曰：此释丘之前後左右有水过之者名也。左右犹东西也。○注\"今齐\"至\"及东\"。○释曰：《地理志》云：齐郡临淄\"城中有丘，即营丘也\"。《志》又云：泰山莱芜县，\"淄水所出，东至博昌入沛\"。然则淄水出莱芜，经临淄过营丘，南折而北至博昌入沛。言此以证水出其左者，名营丘。" }
      - { type: j, text: "如覆敦者，敦丘。（敦，盂也。○敦，音堆）" }
      - { type: z, text: "\"如覆敦者，敦丘\"。○释曰：案《周礼•九嫔》职云：\"凡祭祀，赞玉齍。\"注云：玉齍，玉敦也。受黍稷器。又《少牢礼》曰：\"主妇，执壹金敦黍，有盖。凡设四，敦皆南首。\"注云：\"敦有首者，尊者器饰也。饰象龟形。\"《孝经纬》说，敦与簠簋容受虽同，上下内外皆圆为异。郭氏言\"敦，孟\"，举其类而言之也。丘形如覆敦者，名敦丘。" }
      - { type: j, text: "逦迤，沙丘。（旁行连延。○逦，吕纸切。迤，余纸切）" }
      - { type: z, text: "\"逦迤，沙丘\"。注\"旁行连延\"。○释曰：《说文》云：\"逦，行也。\"\"迤，斜行也。\"故注云\"旁行连延\"也。连延谓连接延长，丘形邪行连接而长者名沙丘。《地理志》云：钜鹿有\"纣所作沙丘台在东北七十里\"。" }
      - { type: j, text: "左高，咸丘。右高，临丘。前高，旄丘。（《诗》云：\"旄丘之葛兮。\"）後高，陵丘。" }
      - { type: z, text: "\"左高\"至\"陵丘\"。○释曰：此四者，释丘形左右前後高而名不同也。○注\"《诗》云：'旄丘之葛兮。'\"○释曰：《邶风•旄丘》篇文也。" }
      - { type: j, text: "偏高，阿丘。（《诗》云：\"陟彼阿丘。\"）" }
      - { type: z, text: "\"偏高，阿丘\"。○注\"《诗》云：'陟彼阿丘。'\"○释曰：谓丘形四隅有一高而不正在左右前後者，名阿丘也。《诗》云\"陟彼阿丘\"者，《鄘风•载驰》篇文也。" }
      - { type: j, text: "宛中，宛丘。（宛谓中央隆高）" }
      - { type: z, text: "\"宛中，宛丘。\"注\"宛谓中央隆高\"。○释曰：案《诗•陈风》云：\"宛丘之上兮。\"毛传云：\"四方高中央下曰宛丘。\"李巡、孙炎亦皆云：\"中央下。\"而郭氏以为中央高者，以其四方高中央下即是上文\"水潦所止，泥丘\"也。又下云\"丘上有丘为宛丘\"。作者嫌人不晓，故重辩之。既言\"丘上有丘\"非\"中央隆高\"而何？此郭氏所以不从先儒也。" }
      - { type: j, text: "丘背有丘为负丘。（此解宛丘中央隆峻，状如负一丘於背上）" }
      - { type: z, text: "\"丘背有丘为负丘\"。○释曰：此解宛丘之状也。言中央隆峻，若丘背之上更有一丘而负戴之者，名宛丘，又名负丘也。" }
      - { type: j, text: "左泽，定丘。（定，下佞切）" }
      - { type: z, text: "\"左泽，定丘\"。○释曰：谓丘之东有水泽者名定丘。" }
      - { type: j, text: "右陵，泰丘。（宋有泰丘社亡，见《史记》）" }
      - { type: z, text: "\"右陵，泰丘\"。○释曰：谓丘之西有大阜者名泰丘。○注\"宋有大丘社亡，见《史记》\"。○释曰：案《六国年表》：\"周显王三十三年，秦惠文王二年，宋大丘社亡。\"是也。宋依丘作社，在宋国於时亡去，故云\"大丘社亡\"，亦咎徵也。" }
      - { type: j, text: "如亩，亩丘。（丘有垄界如田亩）" }
      - { type: z, text: "\"如亩，亩丘\"。○释曰：李巡曰：\"谓丘如田亩曰亩丘。\"孙炎云：\"方百步。\"郭以为田亩之垄也，丘形有界埒似之，因名云。《诗•小雅•巷伯》云：\"杨园之道，猗於亩丘。\"是也。" }
      - { type: j, text: "如陵，陵丘。（陵，大阜也）" }
      - { type: z, text: "\"如陵，陵丘。\"注\"陵，大阜也\"。○释曰：丘形如大阜者名陵丘。云\"陵，大阜\"者，《释地》文也。" }
      - { type: j, text: "丘上有丘为宛丘。（嫌人不了，故重晓之）陈有宛丘，（今在陈郡陈县）晋有潜丘，（今在太原晋阳县）淮南有州黎丘。（今在寿春县）天下有名丘五，三在河南，其二在河北。（说者多以州黎、宛、营为河南，潜敦为河北者。案，此方称天下之名丘，恐此诸丘碌碌未足用当之。殆自别更有魁梧桀大者五，但未详其名号、今者所在耳）丘。" }
      - { type: z, text: "注\"说者\"至\"在耳\"。○释曰：此郭氏破先儒说天下名丘未当也。碌，小石也。碌碌，多貌。恐此州黎等五丘碌碌然小耳。《史记》毛遂入楚谓平原君诸舍人曰：\"公等碌碌，所谓因人成事者也。\"意相类也。殆，近也。近自更有魁梧然桀大者五，但名号所在，今所未详知也。此已上释众丘之名义，故题曰丘也。" }
      - { type: j, text: "望厓洒而高，岸。（厓，水边。洒谓深也。视厓峻而水深者曰岸。○厓，牙。洒，先典切）" }
      - { type: z, text: "\"望厓洒而高，岸\"。○释曰：望，视也。厓，水边也。洒，水深也。言视水边之厓，其下水深，其厓高峻者，名岸。《诗•卫风》云：\"淇则有岸。\"" }
      - { type: j, text: "夷上洒下，不漘。（厓上平坦而下水深者为漘。不，发声。○漘，唇）" }
      - { type: z, text: "\"夷上洒下，不漘\"。○释曰：李巡云：\"夷上，平上。洒下，峭下。故名曰漘。\"孙炎曰：\"平上峭下，故名曰漘。不者，盖衍字。\"郭云：\"厓上平坦而下水深者为漘。不，发声也。\"《诗•王风•葛藟》云\"在河之漘\"是也。" }
      - { type: j, text: "隩，隈。（今江东呼为浦隩。《淮南子》曰：\"渔者不争隈。\"○隩，奥。隈，乌回切）" }
      - { type: z, text: "\"隩，隈\"。○释曰：隩，一名隈也。孙炎云：\"隈，水曲中也。\"《诗•卫风》云：\"瞻彼淇隩。\"故此释之也。○注《淮南子》曰：\"渔者不争隈。\"○释曰：案《淮南子•原道》篇云：\"昔舜耕於历山，期年而田者争处墝埆，以封畔肥饶相让。钓於河滨，期年而渔者争处湍濑，以曲隈深潭相予。\"是不争隈之事也。引之以证隈即厓内深隩之处也。" }
      - { type: j, text: "厓内为隩，外为隈。（别厓表里之名）" }
      - { type: z, text: "\"厓内\"至\"为隈\"。○释曰：别厓表里之名也。孙炎云：\"内曲，里也；外曲，表也。\"李巡曰：\"厓内近水为隩，其外为鞫。\"此句覆释上文\"隩，隈\"之处也。云\"外为隈\"者，隈当作鞫，传写误也。《诗•大雅•公刘》云：\"芮鞫之即。\"毛传云：\"水之外曰鞫。\"然则厓在水曲，其内名隩，又名隈；其外名鞫，又作坑，音义同。今以隩、隈一事，分为外内之名，故知误也。" }
      - { type: j, text: "毕，堂墙。（今终南山道名毕，其边若堂之墙）" }
      - { type: z, text: "\"毕，堂墙\"。○释曰：李巡云：\"堂墙名厓，似堂墙曰毕。\"郭以毕终南山之道名也，其边之厓如堂室之墙，言平正也。《诗•秦风》云：\"终南何有，有纪有堂。\"是也。" }
      - { type: j, text: "重厓，岸（两厓累者为岸。○重，直龙切）" }
      - { type: z, text: "\"重厓，岸\"。○释曰：言两厓相重累者，亦名岸也。" }
      - { type: j, text: "岸上，浒。（岸上地。○浒，音虎）" }
      - { type: z, text: "\"岸上，浒\"。○释曰：岸上平地，去水稍远者名浒。《诗•大雅•绵》篇云\"率西水浒\"之类也。" }
      - { type: j, text: "坟，大防。（谓堤）" }
      - { type: z, text: "\"坟，大防\"。○释曰：李巡云：\"坟谓厓岸，状如坟墓，名大防也。\"《诗•周南》云：\"遵彼汝坟。\"又《释地》云\"坟莫大於河滨\"是也。" }
      - { type: j, text: "涘为厓。（谓水边。○涘，音士）" }
      - { type: z, text: "\"涘为厓\"。○释曰：李巡曰：\"涘，一名厓，谓水边也。\"《诗•秦风》云：\"所谓伊人，在水之涘\"也。" }
      - { type: j, text: "穷渎，汜。（水无所通者。○汜，音似）" }
      - { type: z, text: "\"穷渎，汜\"。○释曰：谓穷困不通水渎名汜也。亦得名谿，即《释山》云：\"山无所通，谿。\"郭注云：\"所谓穷渎者，虽无所通，与水注川同名。\"是也。" }
      - { type: j, text: "谷者，溦。（通於谷。○溦，眉）厓岸。" }
      - { type: z, text: "\"谷者，溦\"。○释曰：谓穷渎汜谷能通於谷者，则别名溦也。此已上释厓岸之名也，故题\"厓岸\"。" }
