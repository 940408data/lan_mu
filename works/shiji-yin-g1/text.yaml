sections:
  - id: 殷本紀
    name: 殷本紀
    blocks:
      - type: j
        text: 殷契母曰簡狄有娀氏之女為帝嚳次妃三人行浴見玄鳥墮其卵簡狄取吞之因孕生契契長而佐禹治水有功帝舜乃命契曰百姓不親五品不訓汝為司徒而敬敷五教五教在寬封於商賜姓子氏契興於唐虞大禹之際功業著於百姓百姓以平契卒子昭明立昭明卒子相土立相土卒子昌若立昌若卒子曹圉立曹圉卒子冥立冥卒子振立振卒子微立
      - type: j
        text: 滋味說湯致于王道或曰伊尹處士湯使人聘迎之五反然後肯徃從湯言素王及九主之事湯舉任以國政伊尹去湯適夏既醜有夏復歸于亳入自北門遇女鳩女房作女鳩女房湯出見野張網四面祝曰自天下四方皆入吾網湯曰嘻盡之矣乃去其三面祝曰欲左左欲右右不用命乃入吾網諸侯聞之曰湯德至矣及禽獸當是時夏桀為虐政淫荒而諸侯昆吾氏為亂湯乃興師率諸侯伊尹從湯湯自把鉞
      - type: j
        text: 作湯誓於是湯曰吾甚武號曰武王桀敗於有娀之虛桀犇於鳴條夏師敗績湯遂伐三嵕俘厥寶玉義伯仲伯作典寶湯既勝夏欲遷其社不可作夏社伊尹報於是諸侯畢服湯乃踐天子位平定海內湯歸至於泰卷陶中罍作誥既絀夏命還亳作湯誥維三月王自至於東郊告諸侯羣后毋不有功於民勤力廼事予乃大罰殛女毋予怨曰古禹臯陶久勞于外其有功乎民民乃有安東為江北為濟西為河南為
      - type: j
        text: 湯適長孫也是為帝太甲帝太甲元年伊尹作伊訓作肆命作徂后帝太甲既立三年不明暴虐不遵湯法亂德於是伊尹放之於桐宫三年伊尹攝行政當國以朝諸侯帝太甲居桐宫三年悔過自責反善於是伊尹廼迎帝太甲而授之政帝太甲修德諸侯咸歸殷百姓以寧伊尹嘉之廼作太甲訓三篇褒帝太甲稱太宗太宗崩子沃丁立帝沃丁之時伊尹卒既葬伊尹於亳咎單遂訓伊尹事作沃丁沃丁崩弟太
      - type: j
        text: 子帝仲丁立帝仲丁遷于隞河亶甲居相祖乙遷于邢帝仲丁崩弟外壬立是為帝外壬仲丁書闕不具帝外壬崩弟河亶甲立是為帝河亶甲河亶甲時殷復衰河亶甲崩子帝祖乙立帝祖乙立殷復興巫咸任職祖乙崩子帝祖辛立帝祖辛崩弟沃甲立是為帝沃甲帝沃甲崩立沃甲兄祖辛之子祖丁是為帝祖丁帝祖丁崩立弟沃甲之子南庚是為帝南庚帝南庚崩立帝祖丁之子陽甲是為帝陽甲帝陽甲之
      - type: j
        text: 是為帝小辛帝小辛立殷復衰百姓思盤庚廼作盤庚三篇帝小辛崩弟小乙立是為帝小乙帝小乙崩子帝武丁立帝武丁即位思復興殷而未得其佐三年不言政事决定於冢宰以觀國風武丁夜夢得聖人名曰說以夢所見視羣臣百吏皆非也扵是廼使百工營求之野得說扵傅險中是時說為胥靡築扵傅險見於武丁武丁曰是也得而與之語果聖人舉以為相殷國大治故遂以傅險姓之號曰傅說帝武
      - type: j
        text: 甲崩子帝廪辛立帝廪辛崩弟庚丁立是為帝庚丁帝庚丁崩子帝武乙立殷復去亳徙河北帝武乙無道為偶人謂之天神與之博令人為行天神不勝乃僇辱之為革囊盛血仰而射之命曰射天武乙獵於河渭之間暴雷武乙震死子帝太丁立帝太丁崩子帝乙立帝乙立殷益衰帝乙長子曰微子啟啟母賤不得嗣少子辛辛母正后辛為嗣帝乙崩子辛立是為帝辛天下謂之紂帝紂資辨捷疾聞見甚敏材力
      - type: j
        text: 法以西伯昌九侯鄂侯為三公九侯有好女入之紂九侯女不憙淫紂怒殺之而醢九侯鄂侯爭之彊辨之疾并脯鄂侯西伯昌聞之竊嘆崇侯虎知之以告紂紂囚西伯羑里西伯之臣閎夭之徒求美女奇物善馬以獻紂紂乃赦西伯西伯出而獻洛西之地以請除炮烙之刑紂乃許之賜弓矢斧鉞使得征伐為西伯而用費中為政費中善諛好利殷人弗親紂又用惡来惡来善毀讒諸侯以此益疏西伯歸乃陰修
      - type: j
        text: 之東伐至盟津諸侯叛殷會周者八百諸侯皆曰紂可伐矣武王曰爾未知天命乃復歸紂愈淫亂不止微子數諫不聽乃與大師少師謀遂去比干曰為人臣者不得不以死爭迺強諫紂紂怒曰吾聞聖人心有七竅剖比干觀其心箕子懼乃詳狂為奴紂又囚之殷之太師少師乃持其祭樂器奔周周武王於是遂率諸侯伐紂紂亦發兵距之牧野甲子日紂兵敗紂走入登鹿臺衣其寶玉衣赴火而死周武王遂斬
      - type: j
        text: 桐氏稚氏北殷氏目夷氏孔子曰殷路車為善而色尚白
