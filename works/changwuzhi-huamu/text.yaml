# 長物志·花木：點校中導覽（teaser）
sections:
  - id: hua-mu
    name: 花木
    blocks:
      - type: j
        text: 花木
      - type: z
        text: 導：此章論花木。「弄花一歲，看花十日」，由惜花生出位置之法：虬枝古干、疏密扶疏，皆入圖畫。薦語：虬枝古干、孤枝獨秀。
      - type: j
        text: 弄花一歲，看花十日，故幃箔映蔽，鈴索護持，非徒富貴容也。
      - type: z
        text: 讀：歲歲之功換十日之看，正以美之易逝，幃箔鈴索非炫富，乃惜美之誠。開篇十字，花事之深情盡見。
      - type: j
        text: 乃若庭除檻畔，必以虬枝古干、異種奇名，枝葉扶疏，位置疏密，或水邊石際橫偃斜披，或一望成林，或孤枝獨秀。
      - type: z
        text: 讀：所貴在「古」與「奇」：橫偃、斜披、獨秀，無一不是畫法。讀此章，可悟庭中草木位置之方。
