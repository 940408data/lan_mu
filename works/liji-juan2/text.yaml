# 禮記正義卷2（孔穎達疏）：j 為經文＋鄭玄注，z 為疏文。
sections:
  - id: juan2
    name: 正文
    blocks:
      - { type: j, text: "從於先生，不越路而與人言。尊不二也。先生，老人教學者。○從，才用反，下皆同。遭先生於道，趨而進，正立拱手。為有教使。○拱，俱勇反。先生與之言則對，不與之言則趨而退。為其不欲與已並行。從長者而上丘陵，則必鄉長者所視。為遠視不察有所問。○上，時掌反，下同。" }
      - { type: z, text: "“從於”至“所視”。○正義曰：此一節明事師長之禮，並自恭謹之法，今各隨文解之。○“從於先生”者，謂從行時。先生，師也。謂師為先生者，言彼先已而生，其德多厚也。自稱為弟子者，言已自處如弟子，則尊師如父兄也。故公西華、子夏之徒答孔子，皆自稱弟子也。雷次宗以為師如父兄，故自稱弟子也。今明若從師行，不得輒往路傍與他人言也。而《論語》雲：“有酒食，先生饌。”則先生之號亦通父兄。崔靈恩雲：“凡言先生，謂年德俱高，又教道於物者。凡雲長者，直以年為稱也。凡言君子者，皆為有德尊之，不據年之長幼。故所稱不同也。”○“遭先生”至“拱手”，此明道路與師長相逢之法。遭，逢也。趨，疾也。拱手，見師而起敬，故疾趨而進就之也。又不敢斥問先生所為，故正立拱手而聽先生之教。○注“先生，老人教學者”。○正義曰：案《書傳略說》雲：“大夫士七十而致仕，大夫為父師，士為少師，教於州里。”《儀禮·鄉飲酒》注云：“先生，鄉大夫致仕者。”此雲“老人教學者”，則通凡老而教學者是，未必皆致仕者。○“與之言則對”者，此謂問時事之言則對，若問己大事，則辭讓然後對，故前文雲“長者問，不辭讓而對，非禮也”。○“則必鄉長者所視”者，長者東視則東視，長者西視則西視，從先生君子亦然。" }
      - { type: j, text: "登城不指，城上不呼。為惑人。○呼，火故反，號叫也。將適舍，求毋固。謂行而就人館。固猶常也。求主人物，不可以舊常致時乏無，《周禮·土訓》“辨地物，原其生，以詔地求”，其類。將上堂，聲必揚。警內人也。○警，京領反。" }
      - { type: z, text: "“將適舍，求毋固”。○正義曰：自此以下，雖從師長，兼明為賓客禮也。適猶往也。舍，主人家也。固猶常也。凡往人家，不可責求於主人，賝常舊有之物，故曰“求毋固”也。○注“《周禮》”至“其類”。○正義曰：案《地官·士訓職》雲：“辨地物。”鄭注云：“別其所有所無，原其生者，生有時以告王之求也。若地所無及物未生，則不求。”與此相類也。故引之證“求毋固”也。" }
      - { type: j, text: "戶外有二屨，言聞則入，言不聞則不入。將入戶，視必下。入戶奉扃，視瞻毋回。不於掩人之私也。奉扃，敬也。○屨，紀具反，單下曰屨。聞音問，又如字，下同。視，常止反，下同，徐音示，沈又市志反。扃，古螢反，何雲：“關也。”一雲門扇上鐶鈕。瞻毋，徐音如字。戶開亦開，戶闔亦闔。下以後來變先。○闔，胡臘反。有後入者，闔而勿遂。示不拒人。○拒，其許反。毋踐屨，毋席，摳衣趨隅，必慎唯諾。趨隅，升席必由下也。慎唯諾者，不先舉，見問乃應。○，在亦反，一音席，躐也。摳，苦侯反，提也，下及注同。趨，七俱反，向也，注同，本又作走，徐音奏，又如字。唯，於癸反，應辭也，注同，徐於比反，沈以水反。諾，乃各反。應，應對之應。" }
      - { type: z, text: "“戶外”至“唯諾”。○正義曰：此一節明謂室有兩人，故戶外有二屨，此謂兩人體敵，故二屨在外，知者以《鄉飲酒》無筭爵，賓主皆降，脫履於堂下，以體敵故也。若尊卑不同，則長者一人脫屨於戶內，故《少儀》雲“排闔脫屨於戶內者，一人而已矣”是也。案《屨人注》雲：“復下曰舄，襌下曰屨。古人言屨以通於復，今世言屨以通於襌。”如鄭此言，古人之言無問襌之與復，皆名為屨。今人言屨，正謂襌者也。○“言聞則入，言不聞則不入”者，若一屨有一人，一人無非法之私事，則外人可即入。若有二屨，二屨是有二人，或清問密事，若內人語聞於戶外，則外人乃可入也。熊氏以為一人之屨在戶內，其戶外有二屨，則三人也，下文雲：“離坐離立，無往參焉。”則知戶內二人不得參之，故知戶外有二屨者，當有三人，義亦通也。○“將入戶，視必下”者，雖聞言而入，亦不得舉目而視，恐睹人私，故必下。○“入戶奉扃”者，奉扃之說，事有多家，今謂禮有鼎扃，所以關鼎。今關戶之木，與關鼎相似，亦得稱扃。凡常奉扃之時，必兩手向心而奉之。今入戶雖不奉扃木，其手若奉扃然，以其手對戶若奉扃，言恭敬，故言奉扃也。是以注云：“奉扃，敬也。”○“視瞻毋回”者，初將入時視必下，而竟不得迴轉，廣有瞻視也。○“戶開亦開”者，既入戶，不以後來變先，若戶本開，則今入者不須闔也。○“戶闔亦闔”者，戶若本闔，則今入者不須開也。○“有後入者，闔而勿遂”者，有後入者，謂己於先入，後猶有人又應入者也，雖已應還闔，當徐徐欲作闔勢，以待後入，不得遂闔以成拒後人，故注云：“示不拒人。”○“毋踐屨”者，踐，蹋也。既並脫屨戶外，其人或多，若後進者，不得蹋先入者屨。○“毋席”者，猶躐也。席既地鋪，當有上下，將就坐，當從下而升，當己位上不發初從上，從上為躐席也。《玉藻》雲升席，“升席不由前為躐席”也。熊氏以為席猶逆席。逆席謂從上升，故鄭雲：“必由下。”《玉藻》所云者，自是不由席前升，與此別。○“摳衣趨隅”者，摳，提也。衣，裳也。趨猶向也。隅猶角也。既不席，當兩手提裳之前，徐徐向席之下角，從下而升，當己位而就坐也。○“必慎唯諾”者，唯，也。諾，應對也。既坐定，又慎於應對。○注“趨隅”至“乃應”。○正義曰：案《鄉飲酒》雲：“賓升席自西方。”注云：“升由下也。升必中席，彼謂近主人為上，故以主西為之下。凡席皆升由下，降由前。”雲“慎唯諾者，不先舉，見問乃應”者，舉猶問也，謂不先問也。" }
      - { type: j, text: "大夫士出入君門，由闑右。臣統於君。闑，門橛。○闑，魚列反，橛也。橛，求月反，門中木。不踐閾。閾，門限也。○閾，於逼反，一音況域反。" }
      - { type: z, text: "“大夫”至“踐閾”。○正義曰：此一節明大夫士出入君門之法。門以向堂為正，右在東，故盧注《檀弓下》雲：“門以向堂為正，主人位在門東，客位在門西。今此大夫士是臣，臣皆統於君，不敢自由賓，故出入君門恆從闑東也。其士之朝位，雖在西方東面，入時仍依闑東。”其《大射》注云：“左則由闑西者，泛解賓客入門之法也。”○“不踐閾”者，踐，履也。閾，門限也。出入不得踐履門限，所以爾者，一則自高，二則不淨，併為不敬。" }
      - { type: j, text: "凡與客入者，每門讓於客。下賓也。敵者迎於大門外。《聘禮》曰：“君迎賓於大門內。”○下，遐嫁反。客至於寢門，則主人請入為席。為猶敷也，雖君亦然。○敷，芳夫反。然後出迎客，客固辭，又讓先入。主人肅客而入。肅，進也。進客謂道之。○道音導。主人入門而右，客入門而左。右就其右，左就其左。主人就東階，客就西階。客若降等，則就主人之階。降，下也。謂大夫於君，士於大夫也，不敢輒由其階，卑統於尊，不敢自專。主人固辭，然後客復就西階。復其正。○複音服，後此音更不重出。主人與客讓登，主人先登，客從之，拾級聚足。拾當為涉，聲之誤也。級，等也。涉等聚足，謂前足躡一等，後足從之並。○拾，依注音涉。級音急，階等。躡，女攝反。並，步頂反。連步以上。重蹉跌也。連步謂足相隨不相過也。○上，時掌反，下皆同。重，直勇反，徐治恭反。蹉本亦作差，同，七何反。跌，大結反。過，古臥反，後不音者放此。上於東階，則先右足。上於西階，則先左足。近於相鄉敬。" }
      - { type: z, text: "“凡與”至“左足”。○正義曰：此一節明賓與主人送迎相讓，及升堂行步之法，各隨文解之。○言“凡”者，通貴賤也。“每門”者，天子五門，諸侯三門，大夫二門。客敵者，主人出門外迎客，主人輒先讓不先入，故曰“每門讓於客”也。貴賤禮不併存，且諸侯自相為賓之禮。凡賓主各有副，賓副曰介，主副曰擯及行人。若諸侯自行，則介各從其命數，至主國大門外，主人及擯出門相接。若主君是公，則擯者五人，侯伯則擯者四人，子男則擯者三人。所以不隨命者，謙也，故並用強半之數也。賓若是公，來至門外，直當闑西，去門九十步而下車，當軹北鄉而立。鄭注《考工記》雲：“軹，轂末也。”其侯伯立當前疾，胡下此。子男立當衡。注：衡謂車軛。其君當軫，而九介立在公之北，邐迤西北，並東鄉而列。主公出，直闑東南西向立，擯在主人之南，邐迤東南立，並西向也。使末擯與末介相對，中間傍相去三丈六尺。列擯介既竟，則主君就賓求辭。所以須求辭者，不敢自許人來詣己，恐為他事而至，故就求辭，自謙之道也。求辭之法，主人先傳求辭之言與上擯，上擯傳以至次擯，次擯繼傳以至末擯，末擯傳與賓末介，末介以次繼傳上至於賓。賓答辭隨其來意，又從上介而傳下至末介，末介又傳與末擯，末擯傳相次而上至於主人。傳辭既竟，而後進迎賓至門知。擯介朝位如此者，《大行人職》文。又知傳辭拜迎賓前至門者，《司儀職》文。其傳辭司儀之交擯也，其列擯介傳辭委曲，約《聘禮》文，若諸侯使卿大夫相聘，其介與主位，則《大行人》雲：“卿大夫之禮，各下其君二等。”鄭注云“介與朝位”是也。主君待之擯數，如待其君。其有異者，主君至大門而不出限，南面而立也。若公之使亦直闑西北向，七介，而去門七十步。侯伯使列五介，而去門五十步。子男使三介，而去門三十步。上擯出閾外，闑東南西向，陳介西北東面邐迤，如君自相見也，而末介末擯相對，亦相去三丈六尺。陳擯介竟，則不傳命，而上擯進至末擯間，南揖賓，賓亦進至末介間，上擯與賓相去亦三丈六尺。而上擯揖而請事，入告君，君在限內，後乃相與入也。知者，約《聘禮》文，不傳辭，《司儀》及《聘禮》謂之旅擯。君自來所以必傳命者，《聘義》雲：“君子於其所尊，弗敢質，敬之至也。”又若天子春夏受朝宗則無迎法，受享則有之，故《大行人》雲：“廟中將幣三享。”鄭雲：“朝先享，不言朝者，朝正禮，不嫌有等也。”若秋冬覲遇，一受之於廟，則亦無迎法，故《郊特牲》雲“覲禮，天子不下堂而見諸侯”，明冬遇依秋也。此雲“凡與客入者”，謂燕也。故下文雲“至寢門”，謂燕在寢也。若相朝，饗食皆在廟。○“每門讓於客者”，每門讓於客，自謙下，敬於賓也。○注“迎於”至“門內”。○正義曰：“迎於大門外”，證敵者則主人自出。“《聘禮》雲：君迎賓於大門內”者，證不敵者主人不出門也。使者是彼臣，故主君迎至門內而不出也。“客至於寢門，則主人請入為席”，寢門，最內門也，謂客與主人入至主人內門也。“主人請入為席”者，為猶敷也。客至於內門，而主人請先獨入敷席也。然主人鄉已應正席，今客至門，方請先入敷席者，其意有二：一則自謙，示不敢逆設席以招賢也；二則重慎，更宜視之。○注“雖君亦然”。○正義曰：知君迎臣，君亦先入者，案《聘禮》雲“及廟門，公揖入，立於中庭”是也。若敵者則更出迎，其不敵則不出迎，故《聘禮》雲“立於中庭”，注“不復出，如此得君行一，臣行二”是也。《聘禮》君使卿歸饔餼於賓，賓迎於門外，及廟門，賓揖俱入。是敵禮不重出迎者，尊主君之命，不敢當也。《聘禮》賓見主國大夫，及廟門，大夫揖入，不出迎者，尊聘君之命，不敢當也。○“然後出迎客”者，入鋪席竟，後更出迎客也。○“客固辭”者，固，如故也。禮有二辭，初曰禮辭，再曰固辭，三曰終辭。主人入鋪席竟。出而迎客，再辭不先入也。○“主人肅客而入”者，肅，進也，謂先導之也。客以再辭，故主人進道客也。故《公食大夫禮》雲“公揖入，賓從”是也。○“客若降等，則就主人之階”者，降等，卑下之客也。不敢亢禮，故就主人階，是繼屬於主人。○注“降下”至“自專”。○正義曰：“謂大夫於君，士於大夫”者，此“大夫於君”，大夫謂他國大夫也。案《聘禮》雲：“公迎賓，賓不就主人階。”《公食大夫禮》：“公迎賓，賓入門左。”注云：“左，西方。”此皆是降等不就主人階者，以《聘禮》及《公食大夫禮》並奉已君之命，不可苟下主人，故從客禮也。若君燕於臣，命宰夫為主人，則主人與賓皆從西階升，與此異也。案《聘禮》賓面主國大夫，他國大夫是敵禮，賓亦入門右。鄭注：“見私事，雖敵賓，猶謙，入門右，為若降等然。”○“主人與客讓登”者，客主至其階，又各讓，不先升也。○“主人先登”者，讓必以三，三竟而客不從，故主人先登，亦肅客之義。不言三者，略可知也。○“客從之”者，言主人前升至第二級，客乃升，中較一級，故云從之也。《公食禮》雲“公升二等，賓升”是也。案《燕禮》、《大射》賓先升者，公以宰夫為主人，賓尊也。故下注雲：“賓每先升，尊也。”案《聘禮》君使卿歸饔餼於賓館，卿升一等，賓從。於時賓為主人不先升者，卿銜主君之命尊，故先升也。至於賓設禮擯卿，賓升一等，大夫從升者，以賓作主人故也。“拾級聚足”者，此上階法也。拾，涉也。級，等也。聚足，謂每階先舉一足，而後足並之，不得後過前也。涉等聚足，謂前足躡一等，後足從而並之也。○“連步以上”者，上，上堂也。在級未在堂，後足不相過，故云“連步”也。涉而升堂，故云“以也”。" }
      - { type: j, text: "帷薄之外不趨，不見尊者行自由，不為容也。入則容，行而張足曰趨。○帷，位悲反。帷，幔也。薄，平博反，簾也。堂上不趨，為其迫也。堂下則趨。○為，於偽反，下並同。迫音伯。執玉不趨。志重玉也。《聘禮》曰：“上介授賓玉於廟門外。”○介音界。堂上接武，武，跡也。跡相接，謂每移足半躡之，中人之跡尺二寸。堂下布武。武謂每移足，各自成跡，不相躡。室中不翔。又為其迫也。行而張拱曰翔。並坐不橫肱，為害旁人。○並如字，又步頂反，後放此。肱，古弘反。授立不跪，授坐不立。為煩尊者，俯仰受之。○跪，求委反，本又作危。授坐，本又作“俯仰”。" }
      - { type: z, text: "“帷薄”至“不立”。○正義曰：此一節言趨步授受之儀。帷，幔也。薄，簾也。趨謂行而張足，疾趨而行，敬也。貴賤各有臣吏，故其敬處亦各有遠近也。《禮》：天子外屏，諸侯內屏，卿大夫以簾，士以帷。外屏，門外為之。內屏，門內為之。“邦君樹塞門”是也。臣來朝君，至屏而加肅敬，屏外不敬，故不趨也。今言“帷薄”，謂大夫士也。其外不趨，則內可趨，為敬也。此帷薄外不趨，謂平常法也。若祭祀之禮，《爾雅》雲：“室中謂之時，堂上謂之行，堂下謂之步，門外謂之趨，中庭謂之走，大路謂之奔。”知《爾雅》是祭祀者，以《召誥》雲：“王朝步自周，則至於豐。”注云：“告文主廟。告文王則告武王可知。”出廟入廟，不以遠為文是也。若迎賓，則《樂師》雲：“行以《肆夏》，趨以《採齊》。”行謂大寢之庭至路門，趨謂路門至應門。○“堂上不趨”者，亦謂不疾趨，堂上迫狹故也。下階則趨，故《論語》雲：“沒階，趨進，翼如也。”然《論語》雲是孔子見於君也。“執玉不趨”者，執玉須慎，不論堂之上下，皆不疾趨也。若張足疾趨，則或蹉跌失玉，故不趨。注云“《聘禮》曰：‘上介授賓玉於廟門外’”者，引證賓有執玉於堂下時也。賓當進聘，故上介授賓玉於主人廟門外，賓執玉進入門內，不疾趨而為徐趨。徐趨者，則《玉藻》雲：“圈豚行，不舉足，齊如流。”注云：“孔子執圭則然也。”又云：“執龜玉，舉前曳踵，蹜蹜如也。”注云：“著徐趨之事。”疾趨者，則《玉藻》雲：“疾趨則欲發，而手足母移。”注云：“疾趨謂直行也。疏數自若，母移欲其直且正也。”“堂上接武”者，武，跡也。既不欲疾趨，故跡相接也。鄭雲：“每移足半躡之。”王雲：“足相接也。”庾雲：“謂接則足連，非半也。”武跡相接，謂每移足半躡之也。中人跡一尺二寸，半躡之，是每進六寸也。○“堂下布武”者，鄭謂每移足各自成跡，不半相躡，王雲：“謂跡間容足。”若間容足，則中武，王說非也。○“授立不跪”者，謂尊者立之時，卑者以物授尊者，不得跪，煩尊者俯俛。若尊者形短，雖卑者得跪以授之，故《少儀》雲：“受立，授立不坐，性之直者則有之也。”注云“尊者短則跪，不敢以長臨之”是也。" }
      - { type: j, text: "凡為長者糞之禮，必加帚於箕上，如是得兩手奉箕，恭也。謂初執而往時也。《弟子職》曰：“執箕膺擖，厥中有帚。”○為，於偽反，扌糞，本又作糞，徐音奮，掃席前曰扌糞。帚，之手反。箕音基。膺，於陵反。葉如字，箕舌。以袂拘而退，其塵不及長者，謂埽時也。以袂擁帚之前，埽而卻行之。○袂，武世反，衣袖末。拘，古侯反，徐音俱。謂掃，先報反，又先早反。擁，於勇反，以箕自鄉而扱之。扱讀曰吸，謂收糞時也。箕去棄物，以鄉尊者則不恭。○扱依注音吸，許急反，斂也。去，丘呂反，下注同。奉席如橋衡。橫奉之，令左昂右低，如有首尾然。橋，井上<木挈>槔，衡上低昂。○橋，居廟反。令，力呈反。卬，本又作昂，又作仰，同，五剛反，又魚丈反，下同。<木挈>，本又作契，又作絜，同音結。槔，古毫反。絜皋，依字作桔槔，見《莊子》。請席何鄉，請衽何趾。順尊者所安也。衽，臥席也。坐問鄉，臥問趾，因於陰陽。○衽，而審反。趾音止。席南鄉北鄉，以西方為上；東鄉西鄉，以南方為上。布席無常，此其順之也。上，謂席端也。坐在陽則上左，坐在陰則上右。○坐，才臥反，又如字。" }
      - { type: z, text: "“凡為”至“為上”。○正義曰：此一節明為尊者埽除布席之儀，各隨文解之。“必加帚於箕上”者，謂初持箕往時也，以帚加置箕上，兩手舉箕也。。○注“《弟子職》曰：執箕膺擖，厥中有帚”。○正義曰：證加帚箕上。《弟子職》者，《管子》之書篇名也，其書述為弟子職也。膺，胸前也。擖，箕舌也。厥，其也。言執箕之禮，以箕舌向胸而帚置於箕中，箕是棄物之器，故不持鄉尊也。○“以袂拘而退”者，謂埽時也。袂，衣袂也。退，遷也。當掃時，卻遷以一手捉帚，又舉一手衣袂以拘障於帚前，且掃且遷，故云“拘而退”。○“以箕自鄉而扱之”者，扱，斂取也。謂以箕自鄉斂取糞穢，亦不以箕鄉尊也。○注“扱讀曰吸”。○正義曰：必讀扱為吸者，以其穢物少，吸然則盡，不得為一扱再扱，故讀從吸也。○“奉席如橋衡”者，所奉席席頭令左昂右低，如橋之衡。衡，橫也。左尊故昂，右卑故垂也。但席舒則有首尾，卷則無首尾，此謂卷席奉之法，故注云“如有首尾然”。言如有，則實無首尾，至於舒席之時，則有首尾，故《公食禮》雲：“莞席尋，卷自末。”注云：“末，終也。”終則尾也。○請席何鄉，請衽何趾”者，既奉席來，當隨尊者所欲眠坐也。席，坐席也。鄉，面也。衽，臥席也。趾，足也。坐為陽，面亦陽也，坐故問面欲何所鄉也。臥是陰，足亦陰也，臥故問足欲何所趾也。皆從尊者所安也。○注“衽，臥席也”。○正義曰：案《昏禮》同牢禮畢，將臥，雲“御衽於奧，媵衽良席，有枕北趾”，此是衽為臥席也。○“席南鄉北鄉，以西方為上”者，謂東西設席，南鄉北鄉，則以西方為上頭也。所以然者，凡坐隨於陰陽，若坐在陽則貴左，坐在陰則貴右，南坐是陽，其左在西，北坐是陰，其右亦在西也，俱以西方為上。○“東鄉西鄉，以南方為上”者，謂南北設席，皆以南方為上者。坐在東方西鄉，是在陽，以南方為上。坐若在西方東鄉，是在陰，亦以南方為上，亦是坐在陽則上左，坐在陰則上右。此據平常布席如此，若禮席則不然。案《鄉飲酒禮注》雲：“賓席牖前南面，主人席阼階上西面，介席西階上東面。”與此不同是也。" }
      - { type: j, text: "若非飲食之客，則布席，席間函丈。謂講問之客也。函猶容也。講問宜相對。容丈，足以指畫也。飲食之客，布席於牖前。丈或為杖。○函，胡南反。丈如字，丈尺之丈，王肅作杖。畫，胡麥反。牖，羊九反。○主人跪正席，雖來講問，猶以客禮待之，異於弟子。客跪撫席而辭。撫之者，答主人之親正。客徹重席，主人固辭。徹，去也。去重席，謙也。再辭曰固。○重，直龍反，注同。再辭曰固，一本作“曰固辭”。客踐席，乃坐。客安，主人乃敢安也，講問宜坐。主人不問，客不先舉。客自外來，宜問其安否無恙，及所為來故。○恙，羊尚反，《爾雅》雲：“憂也。”為，於偽反，不同。將即席，容毋怍。怍，顏色變也。○怍，才洛反，慚也。兩手摳衣，去齊尺。齊謂裳下緝也。○齊音諮，注同，本又作齋。緝，七立反。衣毋撥，撥，發揚貌。○撥，半末反，發揚。足毋蹶。蹶，行遽貌。○蹶本又作蹶，居衛反，又求月反，行急遽貌。遽，其據反。" }
      - { type: z, text: "“若非”至“毋蹶”。○正義曰：此一節明客主之禮儀。雲“若非飲食之客”者，飲食之客，謂來共飲食者。非飲食客，謂來講問者。布席，謂舒之令相對。若飲食之客，不須相對。若講問之客，布席相對，須講說指畫，使相見也。○“席間函丈”者，函，容也。既來講說，則所布兩席，中間相去使容一丈之地，足以指畫也。《文王世子》雲：“侍坐於大司成，遠近間三席。”席之制，三尺三寸三分寸之一，則三席是一丈，故鄭雲容丈也。○注“講問”至“為杖”。○正義曰：凡飲食燕饗，則賓位在室外牖前，列筵南鄉，不得布席相對。相對者，唯講說之客耳。不在牖前，或在於室。雲“丈或為杖”者，王肅以為杖，言古人講說，用杖指畫，故使容杖也。然二家可會。○“主人跪正席”者，客雖來講問，而主人宜敬，故跪而正席，示親客之來也。雖來講問，猶以客禮待之，異於弟子也。○“客跪撫席而辭”者，撫謂以手按止之也。客跪以手按止於席而辭，不聽主人之正席也。撫之者，答主人之親正席也。○“客徹重席”者，《禮器》雲：“諸侯三重，大夫再重。”又《鄉飲酒之禮》：“公三重，大夫再重。”是尊者多，卑者少，故主人為客設多重席，客謙而自徹也。○“主人固辭”者，固辭，再辭，止客之徹也。然尊卑有數，而客必徹之者，既言講說，本以德義相接，不以尊卑為用，故雖尊猶自徹也。“客踐席”者，踐猶履也。客起徹重席，主人止之，故客還履席將坐。○“乃坐”者，主人待客坐乃坐也。○“主人不問，客不先舉”者，舉亦問也。客從外來，宜問路中寒熱無恙。若主人未問，則客不可先問也。《爾雅·釋詁》雲：“恙，憂也”。○“將即席，容無怍”者，此明弟子講問初來之法。即，就也。怍，顏色變也。初將來就席，顏色宜莊，不得變動顏色。○“兩手摳衣，去齊尺”者，摳，提挈也。衣謂裳也。齊是裳下緝也。亦謂將就席之時，以兩手當裳前提挈裳使起，令裳下緝去地一尺，恐衣長轉足躡履之。“足毋蹶”者，蹶，行急遽貌也，亦謂客初至之時，勿得以為行遽，恐有蹶躓之貌也。" }
      - { type: j, text: "先生書策琴瑟在前，坐而遷之，戒勿越。廣敬也。在前，謂當行之前。○筴，本又作策，初革反，編簡也。虛坐盡後，謙也。○盡，津忍反，後放此。食坐盡前。為汙席。○汙，汙辱之汙，又一故反，後放此。坐必安，執爾顏。執猶守也。長者不及，毋儳言。儳猶暫也，非類雜。○儳，徐仕鑑反，又蒼鑑反，又蒼陷反。正爾容，聽必恭，聽先生之言，既說又敬。○說音悅。毋剿說，剿猶攬也，謂取人之說以為已說。○剿，初交反，一音初教反，攬取。說如字，注同，徐舒銳反。攬，徐力敢反。毋雷同，雷之發聲，物無不同時應者，人之言，當各由己，不當然也。《孟子》曰：“人無是非之心，非人也。”○應，應對之應，下同。必則古昔，稱先王。言必有依據。侍坐於先生，先生問焉，終則對。不敢錯亂尊者之言。○坐，才臥反，後放此。請業則起，請益則起。尊師重道也。起，若今摳衣前請也。業謂篇卷也。益謂受說不了，欲師更明說之。子路問政，子曰：“先之，勞之。”請益，曰：“無倦。”○卷音眷，徐久戀反。父召無“諾”，先生召無“諾”，“唯”而起。應辭，唯恭於諾。○唯，於癸反，徐於比反，注同。侍坐於所尊敬，毋餘席，必盡其所近尊者之端，為有後來者。○為，於偽反，下“為饌”同。見同等不起。不為私敬。燭至起，異晝夜。食至起，為饌變。上客起。敬尊者。燭不見跋。跋，本也。燭盡則去之，嫌若燼多有厭倦。○見，賢遍反。跋，半末反。去，起呂反。下“風去”、“免去”同。燼，才信反。厭，於豔反，下同。尊客之前不叱狗。主人於尊客之前不敢倦，嫌若風去之。○叱，尺質反。狗，古口反。風音芳鳳反，讓食不唾。嫌有穢惡。○唾，吐臥反。穢，紆廢反，徐烏外反。惡，烏路反。" }
      - { type: z, text: "“先生”至“不唾”。○正義曰：此一節明弟子事師、子事父之禮，各隨文解之。○“先生書策”者，策，篇簡也。坐亦跪也，坐通名跪，跪名不通坐也。越，逾也。弟子將行，若遇師諸物或當已前，則跪而遷移之，戒慎勿得逾越。廣敬也。○“虛坐盡後”者，凡坐各有其法。虛，空也。空謂非飲食坐也。盡後，不敢近前，以為謙也。《玉藻》雲“徒坐不盡席尺”是也。“食坐盡前”者，謂飲食坐也。古者地鋪席，而俎豆皆陳於席前之地，若坐近後則濺汙席，故盡前也。《玉藻》雲“讀書、食則齊豆去席尺”是也。○“坐必安”者，凡坐好自搖動，故戒之令必安坐。“執爾顏”者，執，守也。久坐好異，故必戒之宜如鄉者無作顏容也。故注云“執猶守也”。○“長者不及，毋儳言”者，長者猶先生也，互言耳。及謂所及之事也。儳，暫也。長者正論甲事，未及乙事，少者不得輒以乙事雜甲事，暫然雜錯師長之說。○“正爾容”者，正謂矜莊也。方受先生之道，當正己矜莊也。顏、容通語耳。○“聽必恭”者，聽師長之說，宜恭敬也。○“毋剿說”者，語當稱師友而言，無得攬取人之說以為已語。○“毋雷同”者，凡為人之法，當自立已心，斷其是非，不得聞他人之語，輒附而同之。若聞而輒同，則似萬物之生，聞雷聲而應，故云“毋雷同”。但雷之發聲，物無不同時而應者，人之言當各由已，不當然也。○“必則古昔”者，則，法也。雖不雷同，又不得專輒，故當必法於古昔之正。○“稱先王”者，既法古昔，而所言之事，必稱先王。先王，聖人為天子者也。如孔子說《孝經》，稱“先王有至德”也，言必有所依據。○注“人之”至“人也”。○正義曰：人之言評議是非，須自出已情，“不當然”者，“然”謂如此也，謂不當如此，隨附他意。《孟子》雲：“人無惻隱之心，非人也。人無是非之心，非人也。”引之者，明是非由己，不可一同餘人。“請益則起”者，益謂已受說而不解了，更諮問審之也，尊師重道也。“起，若今摳衣前請也”，漢時受學，有摳衣前請之法，故鄭引證之也。○注“子路”至“無倦”。○正義曰：子路受師說不了，故就孔子請益也。案《論語》雲，子路問為政之道，孔子答雲：“為政先行恩惠，後乃可使人為勞役。”子路嫌少，就孔子更請益。孔子答雲：“但勤行前恩惠之事，無倦怠則自足為政。”引之者，證請益也。○注“唯恭於諾”。○正義曰：父與先生呼召稱唯，唯，也，不得稱諾。其稱諾，則似寬緩驕慢。但今人稱諾，猶古之稱唯，則其意急也。今之稱，猶古之稱諾，其意緩也，是今古異也。○“侍坐於所尊敬，毋餘席”者，謂先生坐一席，己坐一席，己必坐於近尊者之端，勿得使近尊者之端更有空餘之席。所以然者，欲得親近先生，似若扶持然，備擬先生顧問，不可過遠，且擬後人之來故闕其在下空處以待之。○“見同等不起”者，雖見己之同等後來，不為之起，任其坐在下空處。所以然者，尊敬先生，不敢曲為私敬也。○“上客起”者，上客謂尊者之上客也。尊者見之則起，故侍者宜從之而起。然食與燭至起，則尊者不起。○“燭不見跋”者，《小爾雅》雲：“跋，本也。”本，把處也。古者未有蠟燭，唯呼火炬為燭也。火炬照夜易盡，盡則藏所然殘本。所以爾者，若積聚殘本，客見之，則知夜深，慮主人厭倦，或欲辭退也。故不見殘本，恆如然未盡也。○“尊客之前不叱狗”者，若有尊客至，而主人叱罵於狗，則似厭倦其客欲去之也。卑客亦當然，舉尊為甚。" }
      - { type: j, text: "侍坐於君子，君子欠伸，撰杖屨，視日蚤莫，侍坐者請出矣。以君子有倦意也。撰猶持也。○欠，丘劍反。伸音身。撰，仕轉反。屨，紀具反，下同。蚤音早，莫音暮。侍坐於君子，君子問更端，則起而對。離席對，敬異事也，君子必令復坐。○離，力智反。令，力呈反。侍坐於君子，若有告者曰：“少間，原有復也。”則左右屏而待。復，白也。言欲須少空間，有所白也。屏猶退也，隱也。○間音閒，注同。。○毋側聽，嫌探人之私也。側聽，耳屬於垣。○探音貪。屬，之玉反。垣音袁。毋噭應，毋淫視，毋怠荒。游毋倨，立毋跛，坐毋箕，寢毋伏。斂發毋髢，冠毋免，勞毋袒，暑毋褰裳。皆為其不敬。噭，號呼之聲也。淫視，睇眄也。怠荒，放散身體也。跛，偏任也。伏，覆也。髢，髲也，毋垂餘如髲也。免，去也。褰，袪也。髢或為肄。○噭，古吊反。視如字，徐巿志反。倨音據。跛，彼義反，又波我反，徐方寄反。髢，徒細反，發垂如髲。袒，徒旱反，露也。褰，起連反。為，於偽反，下“為妨”、“為於”、“皆為”、“為其”、“為後”同。號，戶高反，本又作啼字。呼，火故反，又如字，睇，大計反。眄，莫遍反。覆，芳伏反。髲，皮義反。袪，丘魚反。肄，以二反，餘也。" }
      - { type: z, text: "“侍坐”至“褰裳”。○正義曰：此一節明卑者事君子之禮。○“君子欠伸”者，君子志疲則欠，體疲則伸。“撰杖屨”者，則君子自執杖在坐，著屨升堂，脫之在側，若倦則自撰持之也。○“視日蚤莫”者，君子或瞻視其庭影，望日蚤晚也。○“侍坐者請出矣”者，禮，卑者賤者請進不請退，退由尊者，是以《論語》雲：“杖者出，斯出矣。”不敢自專。今若見尊者為上諸事，皆是欲起之漸，故侍坐者得請出矣。○“侍坐於君子”者，此又明卑侍尊，事異於上，故又言侍坐也。○“君子問更端”者，更端，別事也，謂向語已畢，更問他事。“則起而對”者，事異宜新更敬，又起對也。○“侍坐於君子”者，此亦卑事於尊，所明既異，故更言侍坐。○“若有告者曰：少間，原有復也”者，間謂清閒也。復，白也。卑者正侍坐於君子，而忽有一人來告君子云：“欲得君子少時無事清閒，己原有所白也。”○“則左右屏而待”者，屏，退也。侍者聞告欲有所白，則當各自屏退，左右避之，不得遠也。○“毋側聽”者，此已下亦是侍君子之法。凡人宜當正立，不得傾欹側聽人之語，嫌探人之私，故注云：“側聽，耳屬於垣。”若側聽，則耳屬於垣壁，聽旁人私言也。○“毋噭應”者，噭謂聲響高急，如叫之號呼也。應答宜徐徐而和，不得高急也。○“毋淫視”者，淫謂流移也。目當直瞻視，不得流動邪盻也。○“毋怠荒”者，謂身體放縱，不自拘斂也。○“游毋倨”者，游，行也。倨，慢也。身當恭謹，不得倨慢也。○“立毋跛”者，跛，偏也，謂挈舉一足，一足蹋地立。宜如齊，雙足並立，不得偏也。○“坐毋箕”者，箕謂舒展兩足，狀如箕舌也。○“寢毋伏”者，寢，臥也。伏，覆也。臥當或側或仰而不覆也。○“斂發毋髢”者，髢，髲也，垂如髲也。古人重發，以纚韜之，不使垂也。○“冠毋免”者，免，脫也。常著在首，不可脫也。○“勞毋袒”者，袒，露也。雖有疲勞之事，厭患其衣，而不得袒露身體。○“暑毋褰裳”者，暑雖炎熱，而不得褰袪取涼也。然上諸事條目，誡侍者左右屏隱之人也。既屏隱，好生上事，或私覘清閒，或隔尊自恣，故宜兼戒，亦可通戒為人之法也。" }
      - { type: j, text: "侍坐於長者，屨不上於堂，屨賤，空則不陳於尊者之側。○上，時掌反。解屨不敢當階。為妨後升者。○妨音芳。就屨，跪而舉之，屏於側。謂獨退也。就猶著也。屏亦不當階。○著，丁略反。鄉長者而屨，跪而遷屨，俯而納屨。謂長者送之也。不得屏遷之而已。俯，俛也。納，內也。遷或為還。" }
      - { type: z, text: "“侍坐”至“納屨”。○正義曰：此一節明解屨著屨之法，事異於上，故別言侍坐也。“屨不上於堂”者，長者在堂，而侍者屨賤，故脫於階下，不著上堂。若長者在室，則侍者得著屨上堂，而不得入室，戶外有二屨是也。或雲悉不得上也。戶外有二屨，是狎客，非須擯通也。○“解屨不敢當階”者，解，脫也。屨既不上於堂，故解之於階下也。謂脫為解者，案《內則》雲：“屨著綦。”鄭雲：“綦，履系也。”又《冠禮》雲：“黑屨青絇。”鄭雲：“絇之言拘也。以為行戒，狀如刀衣，鼻在屨頭。”案《內則注》有屨系之文，《冠禮》有“絇如刀衣，鼻在屨頭及行戒之間”，故師說雲：“用物穿屨頭為絇，相連為行戒也。”今雲“解屨”是解系也。故《隱義》雲：“古者屨頭鼻綦繩相連結之，將升堂解之也。”“不敢當階”者，謂人與屨並不當階，側就階邊而解。若留屨置階道，為妨後升也。“就屨，跪而舉之”者，此侍者或獨暫退時取屨法也。就猶著也。初升時解置階側，今下著之，先往階側，跪舉取之，故云“就屨，跪而舉之”。○“屏於側”者，屏，退也，退不當階也。○“鄉長者而屨”者，此明少者禮畢退去，為長者所送之法也。既為長者所送，則於階側跪取屨，稍移之，面鄉長者而著之，故云“鄉長者而屨”。○“跪而遷屨”者，遷，徙也。就階側跪取，稍移近前。○“俯而納屨”者，納，內也。既取，因俯身向長者而內足著之。不跪者，若跪則足向後不便，故俯也。雖不併跪，亦坐左納右，坐右納左耳。" }
      - { type: j, text: "離坐離立，毋往參焉。離立者不出中間。為幹人私也。離，兩也。○男女不雜坐，不同椸枷，不同巾櫛，不親授。嫂叔不通問，諸母不漱裳。外言不入於梱，內言不出於梱。女子許嫁，纓，非有大故，不入其門。姑、姊、妹女子子已嫁而反，兄弟弗與同席而坐，弗與同器而食。皆為重別，防淫亂，不雜坐，謂男子在堂，女子在房也。椸，可以枷衣者，通問謂相稱謝也。諸母，庶母也。漱，浣也。庶母賤，可使漱衣，不可使漱裳。裳賤，尊之者亦所以遠別。外言、內言，男女之職也。不出入者，不以相問也。梱，門限也。女子許嫁系纓，有從人之端也。大故，宮中有災變，若疾病，乃後入也。女子有宮者，亦謂由命士以上也。《春秋傳》曰：“群公子之舍，則已卑矣。”女子十年而不出嫁，及成人可以出矣。猶不與男子共席而坐，亦遠別也。○椸，羊支反，衣架也。枷本又作架，徐音稼，古本無此字。櫛，側乙反。嫂，字又作，素早反。漱，悉侯反。梱，本又作閫，苦本反。別，彼列反，下及注同。浣，戶管反。父子不同席。異尊卑也。男女非有行媒，不相知名。見媒往來傳昏姻之言，乃相知姓名。○媒音梅。不相知，本或作“不相知名”，名，衍字耳。傳，直專反。非受幣，不交不親。重別有禮，乃相纏固。故日月以告君，《周禮》凡取判妻入子者，媒氏書之以告君，謂此也。○判，普叛反。齊戒以告鬼神，《昏禮》凡受女之禮，皆於廟為神席以告鬼神，謂此也。○齊，側皆反。為酒食以召鄉黨僚友，會賓客也。以厚其別也。厚，重慎也。取妻不取同姓，故買妾不知其姓，則卜之。為其近禽獸也。妾賤，或時非媵，取之於賤者，世無本系。○取，七住反，本亦作娶，下“賀取妻”同。媵，羊證反，又繩證反。系音計，又音戶計反。寡婦之子，非有見焉，弗與為友。闢嫌也。有見，謂有奇才卓然，眾人所知。○見，賢遍反。闢音避，本亦作避，下同，餘皆放此。" }
      - { type: z, text: "“離坐”至“為友”。○正義曰：此一節總明不幹人私並遠嫌之法，今各隨文解之。○“離坐離立”，離，兩也。若見彼或二人並坐，或兩人並立，既唯二人，恐密有所論，則已不得輒往參預也。○“離立者不出中間”者，又若見有二人並立當己行路，則避之，不得輒當其中間出也。不雲離坐者，道路中非安坐之地，故不雲坐也。識與不識，通如此也。○注“離，兩也”。○正義曰：案《易·象》雲：“明兩作離。”是離為兩也。○“男女”至“而食”。○“不親授”者，男女有物，不親相授也。《內則》雲：“非祭非喪，不相授器。其相授，則女授以篚。無篚，則皆坐奠之而後取之。”○“諸母不漱裳”者，諸母謂父之諸妾有子者。漱，浣也。諸母賤，乃可使漱浣盛服，而不可使漱裳。裳，卑褻也，欲尊崇於兄弟之母，故不可使漱裳耳，又欲遠別也。○“外言不入於梱”者，外言，男職也。梱，門限也。男職在於官政，各有其限域，不得令婦人預之，故云“外言不入於梱”也。○“內言不出於梱”者，內言，女職也。女職謂織紝，男子不得濫預，故云“不出梱”也。○“女子許嫁，纓”者，女子，婦人通稱也。不要對文，故不重雲子也。婦人質弱，不能自固，必有系屬，故恆系纓。纓有二時，一是少時常佩香纓，二是許嫁時系纓，此則為許嫁時系纓。何以知然者？《內則》雲：“男女未冠笄，紟纓。”鄭以為佩香纓，不雲纓之形制，此雲許嫁“有從人之端也”。又《婚禮》：“主人入，親說婦纓。”鄭注云：“婦人十五許嫁，笄而禮之，因著纓，明有系也。蓋以五采為之，其制未聞。”又《內則》雲：“婦事舅姑，紟纓。”鄭雲：“婦人有纓，示系屬也。”以此而言，故知有二纓也。但婦人之紟纓即是五采者，故鄭雲：“示系屬也。”今此“許嫁”謂十五時。○“非有大故，不入其門”者，大故謂喪病之屬也。女子巳許嫁，則有宮門，列為成人。唯有喪病等，乃可入其門，非大故，則不入門也。○“女子子”者，謂已嫁女子子，是己之女，不直雲“女子”，而云“女子子”者，凡男子女子皆是父生，同為父之子，男子則單稱子，女子則重言子者，案鄭注《喪服》雲：“重言女子子，是別於男子，故云女子子。”○“兄弟弗與同席而坐”者，雖已嫁，及成人，猶宜別席，不雲侄及父，唯雲兄弟者，侄父尊卑，禮殊不嫌也。○“弗與同器而食”者，熊氏以為不得傳同器，未嫁亦然。今嫌嫁或有異於未出，故明之，皆為重別，防淫亂也。○注“不雜”至“別也”。○正義曰：謂男子在堂，女子在房也。○熊氏雲：“謂若大宗收族，宗子燕食族人於堂，宗子之婦燕食族婦於房也。”○注“《春秋傳》曰：群公子之舍，則已卑矣。”引《公羊傳》證女子有別宮也。莊元年“秋，築王姬之館於外”，《公羊傳》曰：“路寢則不可，小寢則嫌。群公子之舍，則以卑矣。”何休雲：“路寢是君聽事之處，不可嫁他女。小寢是夫人所居，天王女宜遠別，不可住也。”“群公子之舍，則以卑矣”者，群公子是魯侯之諸女也。魯侯女宮為卑，不可處王女也。何休又云：“當築夫人宮下，群公子宮上。”《公羊》以為築宮於外，非禮也。《左氏》以為築宮於外，禮也。鄭康成亦以為築宮當於宮外是也。○“男女非有行媒，不相知名”者，相知男女名者，先須媒氏行傳昏姻之意，後乃知名，見媒往來，傳婚姻之言，乃相知姓名也。故《婚禮》有六禮，二曰問名。○“非受幣，不交不親”者，幣謂聘之玄纁束帛也。先須禮幣，然後可交親也。○“故日月以告君”者，既男女須辨，故婦來，則書取婦之年月日時，以告國君也。注“《周禮》凡取判妻入子者，媒氏書之以告君，謂此也”。引《媒氏職》，證必書告君也。妻是判合，故云判也。“入子”者，鄭康成注云：“入子者，謂容媵及絰娣不聘者也。”妾既非判合，但廣其子胤而已，故云“入子”。○“齊戒以告鬼神”者，並厚重遠別也。”齊戒謂嫁女之家受於六禮，並在於廟布席告先祖也。明女是先祖之遺體，不可專輒許人。而取婦之家，父命子親迎，乃並自齊絜，但在已寢，不在廟也。所以爾者，《白虎通》雲：“娶妻不告廟者，示不必人女也。”然夫家若無父母，則三月廟見，亦是告鬼神，故云“齊戒以告鬼神”。○注“昏禮”至“此也”。○正義曰：《婚禮》：“納采，主人筵於戶西，西上右幾。”注：“為神布席，將以先祖之遺體許人，不敢不告。”《婚禮》又云：“受諸禮於廟而設几筵也。”○“故買妾不知，其姓則卜之”。○熊氏雲：“卜者卜吉兇。既不知其姓，但卜吉，則取之。”義或然也。○注“為其”至“本系”。○正義曰：《郊特牲》雲：“無別無義，禽獸之道。”此不取同姓，為其近禽獸故也。雲“妾賤，或時非媵，取之於賤者”，如諸侯取一國之女，則二國同姓以侄娣媵。媵，送也。妾送嫡行，則明知姓氏，大夫士取亦各有妾媵。或時非此媵類，取於賤者，不知何姓之後，則世無本系，但卜得吉者取之。○“寡婦之子，非有見焉，弗與為友”者，明避嫌也。見謂奇才卓異可見也。寡婦無夫，若其子有奇才異行者，則己可與之為友。若此子凡庸，而己與其往來，則於寡婦有嫌也。是以鄭注：“有見，謂奇才卓然，眾人所知也。”" }
      - { type: j, text: "賀取妻者，曰：“某子使某，聞子有客，使某羞。”謂不在賓客之中，使人往者。羞，進也，言進於客。古者謂候為進，其禮蓋壺酒、束脩若犬也。不斥主人，昏禮不賀。" }
      - { type: z, text: "“賀取”至“羞”。○正義曰：謂親朋友有昏，己有事礙不得自往，而遣人往也。案《郊特牲》雲：“昏禮不賀，人之序也。”此雲賀者，聞彼昏而送筐篚，將奉淳意，身實不在為賀，故云賀，而其辭則不稱賀。“曰某子使某”者，此使者辭也。“某子”者，賀者名。“使某”者，使自稱名也。言彼使我來也。○“聞子有客”者，“聞子”，呼娶妻者為子也。昏禮既不稱賀，故云“聞子有客”也。客者，鄉黨僚友之屬也。○“使某羞”者，“某”是使者名也。羞，進也。子既召賓客，或須飲食，故使我將此酒食以與子進賓客。○注“謂不”至“不賀”。○正義曰：羞，進也，言進於客也。“古者謂候為進”者，證呼送禮為進，候猶進也。古時謂迎客為進，漢時謂迎客為候，此記是古法，故飲食與彼迎接呼為進也。鄭注《周禮·候人》雲“候，候迎賓客之來”是也。雲“其禮蓋壺酒、束脩若犬也”者，言於禮物用壺酒及束脩。束脩，十脡脯也。若無脯，則壺酒及一犬，故云“若犬”也。《少儀》雲：“其以乘壺酒、束脩、一犬賜人。若獻人，則陳酒執脩以將命。”是酒脩獻人之法也。此賀用酒，或亦四壺也。雲“不斥主人，昏禮不賀”者，解所以不雲賀主人昏，而云有客之義，主人有嗣代之序，故不斥雲賀也。" }
      - { type: j, text: "貧者不以貨財為禮，老者不以筋力為禮。禮許儉，不非無也。年五十始杖，八十拜君命，一坐再至。○筋音斤。" }
      - { type: j, text: "名子者不以國，不以日月，不以隱疾，不以山川。此在常語之中，為後難諱也。《春秋傳》曰：“名，終將諱之。”隱疾，衣中之疾也，謂若“黑臀”、“黑肱”矣。疾在外者，雖不得言，尚可指摘。此則無時可闢，俗語云：“隱疾難為醫。”○臀，徒孫反。摘，徐吐歷反，或音的。醫，於其反。" }
      - { type: z, text: "“名子”至“山川”。○正義曰：此一節明與子造名字之法，各依文解之。○“名子者不以國”者，不以本國為名，故杜氏注《春秋》桓六年傳雲：“不以本國為名。”如是他國，即得為名，故桓十二年衛侯晉卒，襄十五年晉侯周卒是也。○“不以日月”者，不以甲乙丙丁為名。殷家得以為名者，殷質，不諱名故也。然案《春秋》魯僖公名申，蔡莊公名甲午者，週末亂世，不能如禮，或以為不以日月二字為名也。○“不以隱疾”者，謂不以體上幽隱之處疾病為名。○注“謂若黑臀、黑肱矣”。○正義曰：案宣二年，晉“使趙穿迎公子黑臀於周而立之”。《周語》單子云：“吾聞晉成公之生，夢神規其臀以黑，使有晉國，此天所命也。”有由而得為名。昭元年楚公子黑肱，昭三十一年邾黑肱得為名，或亦有由，或亂世而不能如禮。雲“名，終將諱之”者，案桓六年“九月丁卯，子同生，公問名於申繻，申繻對曰：‘名有五，有信，有義，有象，有假，有類。以名生為信。’”杜注云：“若唐叔虞、魯公子友”；“以德命為義”，“若文王名昌，武王名發”；“以類命為象”，“若仲尼首象尼丘”；“取於物為假”，“若伯魚生，人有饋之魚，因名之曰鯉”；“取於父為類”，若魯莊公與桓公同日生，名之曰同也。按傳文雲：“不以官，不以畜牲，不以器幣。”此《記》文略耳。傳雲：“以官則廢職，以山川則廢主，以畜牲則廢祀，以器幣則廢禮。晉以僖侯廢司徒，宋以武公廢司空，先君獻武廢二山。”杜注云，司徒改為中軍，司空改為司城。魯獻公名具，武公名敖，按《國語》：“範獻子聘魯，問具敖之山，魯人以鄉名對。獻子云：‘何不雲具敖乎？’對曰：‘先君獻武之所諱也。’”此等所以皆為名者，以其不能如禮，故申繻言之。周人以諱事神者，謂周人諱神之名而事神，其名終沒，為神之後，將須諱之，故不可以為名也。" }
      - { type: j, text: "男女異長。各自為伯、季也。男子二十，冠而字，成人矣，敬其名。○冠，古亂反。父前子名，君前臣名。對至尊，無大小皆相名。女子許嫁，笄而字。以許嫁為成人。○笄，古兮反。" }
      - { type: z, text: "“男女”至“而字”。○正義曰：此一節明男女冠笄名字之法，各依文解之。○“男女異長”者，按《冠禮》加字之時，“伯某甫，仲叔季，唯其所當”。又《檀弓》雲：“幼名冠字，五十以伯仲。”知女子亦各自為叔季者，《春秋》隱公二年“伯姬歸於紀”，隱七年“叔姬歸於紀”是也。《禮緯·含文嘉》雲：“文家稱叔，質家稱仲。”以此言之，則周有管叔、蔡叔之屬是文家，故稱叔也。《禮緯》又云：“嫡長稱伯，庶長稱孟。”○“君前臣名”者，成十六年鄢陵之戰，公陷於淖，欒書欲載晉侯，針曰：“書退。”針是書之子，對晉侯而稱書，是於君前臣名其父也。" }
      - { type: j, text: "凡進食之禮，左殽右胾。食居人之左，羹居人之右。皆便食也。殽，骨體也。胾，切肉也。食，飯屬也。居人左右，明其近也。殽在俎，胾在豆。○殽，戶交反，熟肉有骨曰殽。胾，側吏反，大臠。食音嗣，飯也，注“食，飯屬”同，徐音自。羹，古衡反，舊音衡。便音婢面反，下同。近如字。膾炙處外，醯醬處內。殽胾之外內也。近醯醬者，食之主。膾炙皆在豆。○膾，古外反。炙，章夜反，注同。醢，徐音海，本又作醯，呼兮反。醬，子匠反。蔥處末，，烝蔥也，處醯醬之左。言末者，殊加也。在豆。○，以制反。烝，之承反。酒漿處右。處羹之右，此言若酒若漿耳。兩有之，則左酒右漿。此大夫、士與賓客燕食之禮，其禮食，則宜放《公食大夫禮》雲。○漿，子羊反，字亦作將。燕，本亦作宴，於遍反。放，方兩反。公食音嗣，此《儀禮》篇名也，後放此，下文及注“執食”同。以脯脩置者，左朐右末。亦便食也。屈中曰朐。○朐，其俱反。客若降等，執食興辭。辭者，辭主人之臨己食，若欲食於堂下然。主人興，辭於客，然後客坐。復坐。主人延客祭。延，道也。祭，祭先也，君子有事，不忘本也。客不降等則先祭。○客祭，禮：飲食必祭，示有所先也。幹寶注《周禮》雲：“祭五行六陰之神，與人起居。”道音導。祭食，祭所先進。主人所先進先祭之，所後進後祭之，如其次。殽之序，徧祭之。謂胾、炙、膾也，以其本出於牲體也。《公食大夫禮》：“魚、臘、湆、醬不祭也。”○徧音遍，下注同。臘音昔。湆音泣。三飯，主人延客食胾，然後辯殽。先食胾，後食殽。殽，尊也。凡食殽，辨於肩，食肩則飽也。○飯，扶晚反，下注“禮飯以手”同。依字書，食旁作卞，扶萬反；食旁作反，符晚反，二字不同，今則混之，故隨俗而音此字。辨音遍，下同，主人未辯，客不虛口。俟主人也。虛口，謂酳也。客自敵以上，其酳不待主人飽，主人不先飽也。○酳音胤，又士覲反，嗽口也；以酒曰酳，以水曰漱。" }
      - { type: z, text: "“凡進”至“虛口”。○正義曰：此一節推明飲食之法也。各隨文解之。今此明卿大夫與客燕食之禮。○“左殽右胾”者，熟肉帶骨而臠曰殽，純肉切之曰胾，骨是陽，故在左。肉是陰，故在右。○“食居人之左，羹居人之右”者，食飯燥為陽，故居左；羹溼是陰，故右設之，並在殽胾之內。○注“皆便”至“在豆”。○正義曰：“皆便食也”者，此中有三便，一則純肉在右，先取為便也；二則羹飯並近人之食，先取羹飯亦便；三則飯在左，羹在右，右手取羹，羹重於右，亦便，故云：“皆便食。”雲“食，飯屬”者，知食是飯者，《春秋左氏傳》雲：“粢食不鑿。”《論語》雲：“一簞食。”《玉藻》雲：“子卯稷食。”皆飯也。言屬者，諸飯悉然，故云屬也。雲“居人左右，明其近也”者，以其系人言之，故云近也。雲“殽在俎”者，《春秋》宣十六年王享士會殽烝，下雲：“宴有折俎。”又《昏禮》及《特牲》、《少牢》皆骨體在俎，是“殽在俎”。知“胾在豆”者，《公食大夫禮》庶羞十六豆，有牛胾、羊胾，是胾在豆。○注“殽胾”至“在豆”。○正義曰：知在“殽胾之外內”者，以此饌之設，羹食最近人，羹食之外，乃有殽胾，今雲“膾炙處外，醯醬處內”，明其不得在羹食之內，故知在“殽胾之外內。”此醯醬，徐音作海，則醢之與醬，兩物各別。依《昏禮》及《公食大夫禮》醬在右，醢在左，此醯醬處內，亦當醬在右，醯在左也。按《公食大夫禮》：“宰夫自東房授醯醬，公設之。”鄭注云：“以醯和醬也”。又《周禮·醯人》“祭祀共齏菹醯物”，則醯醬共為一物也。今此經文若作醯字，則是一物也。醢之與醯，其義皆通，未知孰是。但鄭注“蔥”雲“處醯醬之左”，則醯醬一物為勝。雲“膾炙皆在豆”者，以公食下大夫十六豆，有牛炙、羊炙及芥醬魚膾，故知在豆。○注“處醯”至“在豆”。○正義曰：知“處醯醬之左”者，地道尊右，既雲“處末”，則末在左，上繼“醯醬”，文承其下，故云在醯醬之左。知蔥殊加者，以《儀禮》正饌唯有菹醢，無蔥，故知蔥為殊加也。以其菹類，故知在豆也。○注“若酒”至“禮雲”。正義曰：卑客則或酒或漿，若尊客則有酒有漿。案《公食大夫禮》雲：“設酒於豆東，是酒在左也。《公食大夫禮》又云，賓三飯，設漿飲於稻西。鄭注云：“酒在東，漿在西，所謂左酒右漿是也。”雲“此大夫與賓客燕食之禮，其禮食則宜放《公食大夫禮》雲”者，從上進食之禮，至此所陳饌具，皆是卿大夫燕食也。其禮食則似《公食大夫禮》所陳是也。案《公食大夫禮》，醯醬陳於席前，豆六，設於醬東，西上。韭菹以東，醯醢、昌本，南麋贊，以西菁菹、鹿贊。士設俎於豆南，牛俎在西，牛俎東羊俎，羊俎東豕俎，又牛俎南魚俎，魚俎東臘俎，臘俎東有腸胃俎，又有膚俎在兩行俎之東，縱設之。黍稷六簋，設於俎西，黍簋當牛俎西，其西稷，稷西黍，黍南稷，稷東黍，黍東稷，屈為兩行。大羹在醬西。鉶四，設於豆西，牛鉶在東，牛西羊，羊南豕，豕東牛。飯酒設於豆東，梁飯設於湆西，稻於粱西。庶羞十六豆，設於稻南，屈折而陳，凡為四行：膷東臐，臐東膮，膮東牛炙；炙南醢，醢西牛胾，胾西醢，醢西牛膾；膾南羊炙，炙東羊胾，胾東醢，醢東豕炙；炙南醢，醢西豕胾，胾西芥醬，醬西魚膾。此是公食。下大夫禮雲：“若上大夫，八豆、八簋、六鉶、九俎、庶羞二十也。”○“以脯脩置者”，設食竟所須也。脯訓始，始作即成也。脩亦脯也。脩訓治，治之乃成。鄭注《臘人》雲：“薄折曰脯，棰而施薑桂曰鍛脩。”今明置設脯脩與客之法，故云“以脯脩置者”。○“左朐右末”者，朐謂中屈也。屈脯朐朐然也。左朐，朐置左也。右末，末，邊際；置左，右手取際擘之便也。脯脩則處酒左，以燥為陽也。脯脩皆左邊也。注“亦便”至“便也”。○“客若降等”者，降，下等也，謂大夫為卿之客，其品等卑下也。○“執食興辭”者，執，捉也。食，飯也。興，起也。客既卑，故未食必先捉飯而起，以辭謝主人之臨已也。又若欲往堂下食然也，堂下是卑者食處。飯為食主，故特執之也。《公食大夫禮》雲“賓北面自間坐，左擁簠梁，右執湆以降”是也。鄭雲：“自間坐，由兩饌之間也。”辭主人臨己食，若欲食於堂下然。此降等謂大夫於卿，故欲降而不降，若臣於君，則降也，故《公食》雲“賓擁簠梁以降”是也。若敵者，全無欲降之禮，故《公食禮》雲：“大夫相食，賓執粱與湆，之西序端。”無降法也。○“主人興，辭於客，然後客坐”者，主人見客執飯起，故主人亦起，辭止之，則客從辭而止，乃坐食，復坐也。○“主人延客祭”者，延，道也。祭者，君子不忘本，有德必酬之，故得食而種種出少許，置在豆間之地，以報先代造食之人也。若敵客則得自祭，不須主人之延道。今此卑客聽主人先祭道之，己乃從之，故云“延客祭”也。○“祭食，祭所先進”，凡祭食之法，隨主人所設前後次第種種而次祭之，故主人所先進，先祭之，所後進，後祭之，所從如其次也。○“殽之序，徧祭之”者，序，次序也，謂膾炙胾之屬也。徧，匝也。炙胾之屬，雖同出於牲，今祭之，故種種次序，徧匝祭之。○注“謂胾”至“祭也”。○正義曰：案《公食大夫禮》雲：“三牲之肺不離，贊者辯取之，壹以授賓。賓興受，坐祭，挩手。”又云：“魚、臘、醬、湆不祭也。”○“三飯，主人延客食胾”者，三飯謂三食也。禮食三飧而告飽，須勸，乃更食。三飯竟，而主人乃道客食胾也。《公食大夫禮》雲：“賓三飯以湆醬。”鄭雲：“每飯歠湆以殽擩醬，食正饌也。”案彼文是三飯，但食醬及他饌而未食胾，故三飧竟，而主人道客使之食胾也。所以至三飧後乃食胾者，《公食禮》亦以胾為加，故客三飧前未食之，故鄭注云：“以殽擩醬，食正饌。”正饌則非胾也。然《公食禮》三飧竟，挩手，起，受漿漱口，受束帛之物，升降拜，禮畢，方是升還坐食，取飽，飽又三漱。不雲三飯延客食胾者，與此異也。○“然後辯殽”者，“然後”謂食胾竟後也。辯，匝也。主人皆道客令食至飽，食殽得匝也。○注“先食”至“飽也”。○正義曰：純肉為陰，陰，卑也。帶骨為陽，陽，尊也。尊故後食之也。雲“凡食殽，辯於肩，食肩則飽”者，案《特牲》、《少牢》雲，初食殽，次食脊，次食骼，後食肩。是辯於肩也，故云“食肩則飽”也。鄭雲：“舉前正脊後肩，自上而卻下，糹爭而前，終始之次也。”案鄭雲，是先食脅脊，次食骼，食骼竟，又屈食脅脊，竟，乃食肩。○“主人未辯，客不虛口”者，虛口謂食竟飲酒盪口，使清絜及安食也。用漿曰漱，令口以絜清為義。用酒曰酳，酳訓演，言食畢以酒演養其氣。主人若食殽未辯，則客雖已辯，而不得輒酳漱也。主人恆讓客，不自先飽，故客待主人辯，乃得為酳也。此謂卑客耳，敵客以上則不待主人也。《音義隱》雲：“飯畢盪口也。”○注“俟主”至“酳也”。○正義曰：案《公食禮》雲：“賓卒食，會飯三飲。”鄭雲：“三漱漿也。”明是食竟漱也。又初三飯竟，設漿稻西，“賓坐祭，遂飲”。鄭雲：“三飲漱也。”案此漱是三飧竟，又有事，故用漿漱口，若如斯，則公食之禮，雖設酒為優，賓不得用酳，故鄭注彼雲“設而不舉”，明但以漿漱口而已也。此是私客，故用酒以酳，所以異於《公食禮》也，故鄭此雲“謂酳也”。雲“客自敵已上，其酳不待主人飽”者，客不敵，故待主人。“主人不先飽”者，緣主人不先飽，故待之也。" }
      - { type: j, text: "侍食於長者，主人親饋，則拜而食。勸長者食耳。雖賤，不得執食興辭，拜而已，示敬也。○饋，徐其類反。主人不親饋，則不拜而食。以其禮於已不隆。" }
      - { type: z, text: "“侍食”至“而食”。○正義曰：鄉是自為客法，此明侍從尊長為客禮也。“主人親饋，則拜而食”者，饋謂進饌也。已雖侍尊長，而主人若自親饋與己，己則拜謝之而後食也。○注“勸長”至“敬也”。○正義曰：言己今侍食，雖賤，不得執食興辭，故但拜之，以示敬也。" }
      - { type: j, text: "共食不飽，謙也，謂共羹飯之大器也。共飯不澤手。為汗手不絜也。澤謂捼莎也。禮，飯以手。澤或為擇。○為，於偽反。汗，下半反，本或作汙。捼，乃禾反，沈耳佳反。莎，息禾反，沈又息隨反。" }
      - { type: z, text: "“共食”至“澤手”。○正義曰：共食，謂同事聚居，非禮食，則有同器食法，共食宜謙，不輒厭飫為飽也。共飯不澤手者，亦是共器盛飯也。澤謂光澤也。古之禮，飯不用箸，但用手，既與人共飯，手宜絜淨，不得臨食始捼莎手乃食，恐為人穢也。○注“為汗手不絜”。○正義曰：絜，淨也。若澤手，手必汗生，則不絜淨。一本汗生不圭。圭，絜也。言手澤汙飯也。" }
      - { type: j, text: "毋摶飯，為欲致飽，不謙。○摶，徒端反。為，於偽反，下皆同。" }
      - { type: z, text: "“毋摶飯”。○正義曰：共器若取飯作摶，則易得多，是欲爭飽，非謙也。故注云“為欲致飽，不謙”也。毋放飯，去手餘飯於器中，人所穢。○去，起呂反。毋流歠，大歠嫌欲疾。○歠，川悅反。毋吒食，嫌薄之。○吒，陟嫁反，叱吒也。毋齧骨，為有聲響，不敬。○齧，五結反。毋反魚肉，為已歷口，人所穢。毋投與狗骨，為其賤飲食之物。毋固獲，為其不廉也。欲專之曰固，爭取曰獲。○固獲，並如字，徐雲：“鄭撗霸反。一音護。”毋揚飯，飯黍毋以箸，毋嚃羹，亦嫌欲疾也。嚃，為不嚼菜。○飯，扶晚反。箸，直慮反，《說文》雲：“飯欹也。”嚃，他答反，一音吐計反，又音退。嚼，疾略反，又序略反。毋絮羹，為其詳於味也。絮猶調也。○絮，敕慮反，謂加以鹽梅也。毋剌齒，為其弄口也。口容止。○剌，七亦反。弄，魯凍反。毋歠醢。亦嫌詳於味也。歠者為其淡故。○淡，度敢反。客絮羹，主人辭不能亨。客歠醢，主人辭以窶。優賓。○亨，普彭反，煮也。窶，其禹反，貧也。濡肉齒決，決猶斷也。○音濡，字亦作濡。斷音短。乾肉不齒決，堅宜用手。毋嘬炙。為其貪食甚也。嘬謂一舉盡臠。《特牲》、《少牢》嚌之，加於俎。○嘬，初怪反。炙，章夜反。臠，力轉反。少，徐式照反，凡“少牢”皆同。嚌音才細反，" }
      - { type: z, text: "“毋放”至“嘬炙”。○正義曰：“毋放飯”者，手就器中取飯，飯若黏著手，不得拂放本器中也。“去手餘飯於器中，人所穢者，當棄餘於篚，無篚，棄餘於會。會謂簋蓋也。○“毋流歠”者，謂開口大歠，汁入口如水流，則欲多而速，是傷廉也。故鄭雲：“大歠嫌欲疾。”○“毋吒食”者，吒謂以舌口中作聲也。似若嫌主人之食也。○“毋齧骨”者，一則有聲；二則嫌主人食不足，以骨致飽，故庾雲“為無肉之嫌”；三則齧之口唇可憎，故不齧也。“為有聲響，不敬”，鄭舉一隅也。“毋反魚肉”者，謂與人同器也，已齧殘不可反還器中，為人穢之也。故鄭雲：“謂已歷口，人所穢。”崔靈恩雲：“不可反於故處。是以《少牢禮》屍所食之餘肉，皆別緻於肵俎，不反本處也。”○“毋投與狗骨”者，投，致也。狗，犬也。言為客之禮，無得食主肉後，棄其骨與犬，故鄭雲：“為其賤飲食之物。”○“毋固獲”者，專取曰固，爭取曰獲，與人共食，不可專固獨得及爭取也。盧植雲：“固獲取之，為其不廉也。”○“毋揚飯”者，飯熱當待冷，若揚去熱氣，則為貪快，傷廉也。○“飯黍毋以箸”者，飯黍無用箸，當用匕，故《少牢》雲：“廩人溉匕與敦。”注云“匕，所以匕黍稷”是也。○“毋嚃羹”者，人若不嚼菜，含而歠吞之，其欲速而多，又有聲，不敬，傷廉也。故鄭雲：“亦嫌欲疾也。”嚃為不嚼菜，羹有菜者用挾，故不得歠，當挾嚼也。○“毋絮羹”者，絮謂就食器中調和鹽梅也。若得主人羹，更於器中調和，是嫌主人食味惡也。○注“為其詳於味也。絮猶調也。”詳，審也，謂更詳審嫌淡也。○“毋剌齒”者，口容止，不得剌弄之，為不敬也，謂其弄口。《少儀》曰：“口容止。”容儀欲靜止也。“毋歠醢”者，醢，肉醬也。醬宜鹹，客若歠之，則是醬淡也。○“客絮羹，主人辭不能亨”者，亨，煮也。若客失禮而絮羹，則主人宜有優賓之辭謝之，雲己家不能亨煮，故羹味不調適也。○“客歠醢，主人辭以窶”者，窶，無禮也。若客失禮而歠醢，則主人亦致謝。雲主人作醢淡而無鹽，故可歠也。《詩》雲：“終窶且貧。”毛雲：“窶，無禮也。”《箋》雲：“君於已祿薄，終不足以為禮也。”兩辭皆優饒於賓也。“濡肉齒決”者，濡，溼也。溼軟不可用手擘，故用齒斷決而食之。決，猶斷也。○“乾肉不齒決”者，乾肉，脯屬也，堅肕不可齒決斷之，故須用手擘而食之。鄭注《臘人》雲：“大物解肆乾之，謂之乾肉也。”“毋嘬炙”者，火灼曰炙，炙肉濡，若食炙，先當以齒嚌而反置俎上，不一舉而並食，並食之曰嘬，是貪食也。○注“為其”至“於俎”。○正義曰：不細齧之，是一舉盡臠也。”《特牲》、《少牢》嚌之，加於俎”者，嚌至齒也。《特牲》、《少牢饋食禮》，屍及祝佐食主人之徒，得肉皆嚌之，嚌之竟而加置於俎上也。但此所嚌，取彼嚌至齒，反置於俎則同。然前雲“無反魚肉”，此得反於俎者，上文謂共人同器而食者，故鄭雲：“為其已歷口，人所穢。”《特牲》、《少牢》獨食，故得反也。" }
      - { type: j, text: "卒食，客自前跪，徹飯齊，以授相者。謙也。自，從也。齊，醬屬也。相者，主人贊饌者，《公食大夫禮》：“賓卒食，北面取粱與醬以降也。”○卒，子恤反，後更不音者同。齏本又作齊，將兮反。相，息亮反，注同。主人興，辭於客，然後客坐。不聽親徹。" }
      - { type: z, text: "“卒食”至“相者”。○正義曰：卒食，食已也。自，從也。食坐在前面向，候客食竟，加於俎。起從坐前北面，當以坐而跪，自徹已所食飯與齊，飯齊食主，故答主人初所親饋者也。此是卑者，侍食之客耳，若敵者則否。“以授相者”，相者謂主人所使進食者，賓以所徹飯齊以授之。○注“謙也”至“降也”。正義曰：齊，醬屬也。齊、醬、菹，通名耳。“《公食大夫禮》：賓卒食，北面取粱與醬以降”者，引證自徹是卑客也。大夫卑於公，所為客，故食竟親取飯及醬以降下，當知敵者否。○“主人”至“客坐者”，主人起，辭不聽自徹，則客亦止而坐也。" }
      - { type: j, text: "侍飲於長者，酒進則起，拜受於尊所。降席拜受，敬也。燕飲之禮鄉尊。○鄉音向。長者辭，少者反席而飲。長者舉未釂，少者不敢飲。不敢先尊者。盡爵曰釂。《燕禮》曰：“公卒爵而後飲也。”○少，式召反，下皆同。釂，子妙反，盡也。先，悉薦反，又如字。" }
      - { type: z, text: "“侍飲於長者”。○正義曰：明侍尊長飲酒法也。食竟宜飲酒，故次之。○“酒進則起”者，謂長者賜侍者酒，進至侍者前則起。侍者見酒至，不敢即飲，故起也。○“拜受於尊所”者，“尊所”者以陳尊之處也。侍者起而往尊處拜受之也。陳尊之所，貴賤不同，若諸侯燕禮、大射，設尊在東楹之西，自北鄉南陳之。酌者在尊東西向，以酌者之左為上尊。尊面有鼻，鼻向君，示君專有此惠也。若鄉飲酒及卿大夫燕，則設尊陳於房戶之間，賓主共之，尊面向南，酌者向北，以西為上尊。時主人在阼，西向，賓在戶西牖前，南鄉，使賓主得夾尊，示不敢專惠也。今雲“拜受於尊所”者，當是燕禮。而《燕禮》不雲拜受於尊所，《鄉飲酒》亦無此語，正是文不具耳。近尊鄉長者，故往於尊所鄉長者而拜。○注“降席”至“鄉尊”。○正義曰：何胤雲：“尊者，主人也。拜者，在尊所對主人也。降席下奠爵，再拜稽首，尊謂主人尊也。”崔靈恩雲：“卿大夫燕飲，主人面亦鄉尊。若鄉飲酒，皆主人與賓夾尊也。”今案，何、崔並是解此拜受尊若所鄉長者之證也。○“長者辭，少者反席而飲”者，長者辭止少者之起。長者既止，故少者復反還其席而飲賜也。○“長者舉未釂，少者不敢飲”者，舉猶飲也。釂，盡也。飲酒尊卑異爵，故《燕禮》公執膳爵，受賜爵者執散爵。今少者雖反席而飲，要須待長者盡爵後，少者乃得飲也。若長者飲未盡，則少者不敢飲也。○注“不敢”至“飲也”。○正義曰：證長者未盡，少者不敢飲也。《燕禮》曰：“受賜爵者以爵就席坐，公卒爵，然後飲。”鄭注云：“不敢先虛爵。明此勸惠從尊者來也。”然此與《燕禮》及注合，而與《士相見》及《玉藻》違。案《士相見禮》雲：“若君賜之爵，則下席再拜稽首，受爵升席祭，卒爵而俟，君卒爵，然後授虛爵。”鄭雲：“受爵者於尊所，至於授爵，坐授人耳。必俟君卒爵者，若欲其釂然也。”《玉藻》雲：“君若賜之爵，則越席再拜稽首受，登席祭之，飲卒爵而俟，君卒爵，然後授虛爵。”注云：“不敢先君盡爵。”案二文皆先君卒爵，而此雲後飲者，此據燕飲正禮，故引《燕禮》以證之，《玉藻》及《士相見禮》謂私燕之禮，故不同也。" }
      - { type: j, text: "長者賜，少者、賤者不敢辭。不敢亢禮也。賤者，僮僕之屬。○亢，苦浪反。潼音同。" }
      - { type: z, text: "“長者”至“敢辭”。○正義曰：此明凡受賜禮也。少謂幼稚，賤謂僮僕之屬也。若少者及賤者被尊長之賜，則不敢辭謙，宜即受也，不敢亢禮也。敵者亢而有辭，少者賤者，故不敢也。" }
      - { type: j, text: "賜果於君前，其有核者懷其核。嫌棄尊者物也。木實曰果。○核，戶革反。御食於君，君賜餘，器之溉者不寫，其餘皆寫。重汙辱君之器也。溉謂陶梓之器，不溉謂萑竹之器也。寫者，傳己器中乃食之也。勸侑曰御。○溉，古愛反。重，直勇反，徐治龍反。陶音桃，瓦器也，沈音遙。萑音九，葦也。傳，直專反。侑音又。" }
      - { type: z, text: "“御食於君”。○正義曰：御者非侍者，但是勸侑君食也。○“君賜餘”者，謂君食竟，以食殘餘賜御者也。○“器之溉者不寫”者，溉，滌也。寫謂倒傳之也。若所賜食之器可滌溉者，不畏汙則不須倒寫，仍於器中食之。食訖，乃澡潔以還君也。○“其餘皆寫”者，“其餘”謂不可滌溉之器也。若不倒寫，久則浸汙其器，又不可澡絜，則壞尊者物也，故皆倒寫之。○注“重汙”至“曰御”。○正義曰：“溉謂陶梓之器”者，陶是瓦甒之屬，梓是杯杅之屬，並可滌絜之者。何胤雲：“梓，漆也。”“不溉謂萑竹之器”者，萑，葦也，是織萑為之器，竹是織竹為之器，並謂筐筥之屬，並不可澡絜者。鄭注《司几筵職》雲：“萑如葦而細。”雲“勸侑曰御”者，何胤雲：“勸侑謂卑者勸美尊者之食也。”" }
      - { type: j, text: "餕餘不祭，父不祭子，夫不祭妻。食人之餘曰餕，餕而不祭，唯此類也。食尊者之餘則祭，盛之。○餕，子閏反。" }
      - { type: z, text: "“餕餘”至“祭妻”。○正義曰：餕者，食餘之名。祭謂祭先也。因前有“賜餘”，故明食人之餘不祭者也。凡食人之餘，及日晚食饌之餘，皆雲餕，故《玉藻》雲：“日中而餕。”鄭雲：“餕，食朝之餘也。”今此明凡食餘悉祭，若不祭者，唯此下二條也。“父不祭子，夫不祭妻”者，若父得子餘，夫得妻餘，不須祭者，言其卑故也。非此二條悉祭也。父得有子餘者，熊氏雲：“謂年老致仕，傳家事於子孫，子孫有賓客之事，故父得餕其子餘。”夫餕其妻餘者，謂宗婦與族人婦燕飲有餘，夫得食之。" }
      - { type: j, text: "御同於長者，雖貳不辭。謂侍食於長者，饌具與之同也。貳謂重殽膳也。辭之，為長者嫌。○重，直龍反。" }
      - { type: z, text: "“御同”至“不辭”。○正義曰：御謂侍也，同謂侍食而與長者同饌也。貳謂重也。侍者雖獲殽膳重，而己不須辭其多也。所以然者，此饌本為長者設耳，若辭之，則嫌當長者。何胤雲：“禮：當盛饌，宜辭以賤不能當之。此侍食於長者，盛饌不在已。”故鄭雲：“貳謂重殽膳也，辭之，為長者嫌也。”偶坐不辭盛饌不為已。○偶五口反配也。一曰：“副貳也。坐才臥反又如字" }
      - { type: z, text: "“偶坐不辭”。○正義曰：偶，媲也。或彼為客設饌，而召己往媲偶於客共食，此饌本不為已設，故己不辭之也。又一雲，偶，二也。若唯獨有己，主人設饌，己當辭謝。若與他人俱坐，則己不假辭，以主人意不必在已也。故鄭雲：“盛饌不為己。”並會兩通也。" }
      - { type: j, text: "羹之有菜者用梜，其無菜者不用梜。梜猶箸也。今人或謂箸為梜提。○梜，古協反，沈又音甲，《字林》作筴，雲：“箸也，公洽反。”箸，直慮反。" }
      - { type: z, text: "“羹之”至“用梜”。○正義曰：“有菜者”為鉶羹是也，以其有菜交橫，非梜不可。“無菜者”謂大羹湆也，直歠之而已。其有肉調者，犬羹兔羹之屬，或當用匕也。" }
      - { type: j, text: "為天子削瓜者副之，巾以絺。副，析也。既削，又四析之，乃橫斷之，而巾覆焉。○為，於偽反，下同。削，息略反。瓜，古華反。副，普逼反。絺，敕宜反，細葛。析，星曆反，下同。斷音短，下同。" }
      - { type: z, text: "“為天”至“以絺”。○正義曰：此為人君削瓜禮也。削，刊也。副，析也。絺，細葛也。謂先刊其皮，而析為四解，又橫切之，既破，又橫解，而細葛為巾，覆上而進之也。" }
      - { type: j, text: "為國君者華之，巾以綌。華，中裂之，不四析也。○華，胡瓜反。綌，去逆反，粗葛。為大夫累之，累，倮也，謂不巾覆也。○累，力果反，一音如字。倮，力果反，沈胡瓦反。士疐之，不中裂，橫斷去疐而已。○疐音帝。去，丘呂反，庶人齕之。不橫斷。○齕，恨沒反，徐胡切反。" }
      - { type: z, text: "“為國”至“齕之”。○正義曰：“為國君者華之，巾以綌”者，華謂半破也；綌，粗葛也。諸侯禮降，故破而不四析也，亦橫斷之。雖與天子俱無文，推理亦橫斷，而巾用粗葛，覆而進之。《爾雅》雲：“瓜曰華之。”郭璞雲：“食啖治擇之名。”○“為大夫累之”者，累，倮也，不巾覆也。大夫降於諸侯，直削而中裂，橫斷而已，不巾覆而進之。知對破而橫斷之者，鄭雲士“不中裂，橫斷去疐而已”，則知大夫猶中裂而橫斷，倮而已。○“士疐之”者，疐謂脫華處，士不半破，但除疐而橫斷，亦不覆也。下注庶人云“不橫斷”，則知士橫斷也，故鄭雲“士不中裂，橫斷去疐而已”。○“庶人齕之”者，庶人，府史之屬也，齕，齧也。既注云“不橫斷”，故知去疐而齧之也。然此削瓜等級不同，非謂平常之日，當是公庭大會之時也。" }
      - { type: j, text: "父母有疾，冠者不櫛，行不翔，憂不為容也。○冠如字，徐古亂反。為如字，徐於偽反。言不惰，憂不在私好。惰，不正之言。○惰，徒禾反，一音徒臥反，好音呼報反。琴瑟不御，憂不在樂。食肉不至變味，飲酒不至變貌，憂不在味。笑不至矧，怒不至詈，憂在心，難變也。齒本曰矧，大笑則見。○矧，本又作哂，失忍反，又詩忍反。詈，力智反，罵詈。則見，賢遍反。疾止復故。自若常也。有憂者側席而坐，側猶特也。憂不在接人，不布他面席。已有喪者專席而坐。降居處也，專猶單也。" }
      - { type: z, text: "“父母”至“而坐”。○正義曰：此已下明親疾人子之禮，及除喪後之儀，各隨文解之。○“言不惰”者，惰，訛不正之言。○注“憂不在私好”者。○正義曰：好謂華好，言語戲劇，華飾文辭，故云“不在私好”。○“食肉不至變味”。○正義曰：猶許食肉，但不許多耳。“變味”者，少食則味不變，多食則口味變也。○“有憂者側席而坐”者，憂亦謂親有病也。側猶獨也。獨席謂獨坐，不舒他面席也。明憂不在接人故也。平常則舒他面席也。○注“側猶特也”。○正義曰：案《聘禮》雲，公禮賓，“公側受醴”，是側猶特也。○“有喪者專席而坐”。○正義曰：專猶單也。吉時貴賤有重席之禮，若父母始喪，寢苫無席，卒哭後，乃有芐剪不納，自齊衰以下，始喪而有席，並不重，降居處也。" }
      - { type: j, text: "水潦降，不獻魚鱉。不饒多也。○潦音老，雨水謂之潦。獻鳥者佛其首，為其喙害人也。佛，戾也。蓋為小竹籠以冒之。○拂，本又作佛，扶弗反，下同。為，於偽反，下“為其”同。喙，籲廢反，又陟遘反，又知胃反，又丁角反。戾，力計反。籠，力東反。冒，莫報反。畜鳥者則勿佛也。畜，養也。養則馴。○畜，許六反，徐況又反。馴，似遵反，狎也，徐食倫反，沈養純反。獻車馬者執策綏，獻甲者執胄，獻杖者執末，獻民虜者操右袂，獻粟者執右契，獻米者操量鼓，獻孰食者操醬齊，獻田宅者操書致。凡操、執者，謂手所舉以告者也。設其大者，舉其小者，便也。甲，鎧也。胄，兜鍪也。民虜，軍所獲也，操其右袂制之。契，券要也，右為尊。量鼓，量器名。○綏音雖，執以登車者。胄，直又反。操，七刀反，持也，下及注皆同。契，苦計反。量音亮，又音良，升斛。鼓，《隱義》雲：“樂浪人呼容十二石者為鼓。”齊，本又作齏，同，子兮反。便，婢面反。鎧，苦愛反。兜，下侯反。鍪，莫侯反。券，字又作豢，音勸。凡遺人弓者，張弓尚筋，弛弓尚角，弓有往來體，皆欲令其下曲，隤然順也。遺人無時，已定體則張之，未定體則弛之。○遺，於季反，與也，注同。弛，本又作施，同，式是反，謂不張也，注同。隤，本又作頹，徒回反，順貌。右手執簫，左手承弣。簫，弭頭也，謂之簫。簫，邪也。弣，把中。○弣音撫，徐音甫，下同。弭，亡婢反，弓末也。邪，似嗟反。把音霸，手執處也。尊卑垂帨。帨，佩巾也。磬折則佩垂，授受之儀，尊卑一。○帨，徐始銳反。磬，徐苦定反。折，徐時列反，又之列反，沈雲：“舊音逝。”若主人拜，拜受也。則客還辟，闢拜。闢拜，謙不敢當。○闢辟，上扶亦反，下闢音避，注同。主人自受，由客之左，接下承弣，由，從也。從客之左，右客，尊之。接下，接客手下也。承弣卻手，則簫覆手與？○覆，芳服反。與音餘。鄉與客並，然後受。於堂上則俱南面，禮：敵者並授。進劍者左首。左首，尊也。進戈者前其鐏，後其刃。進矛戟者前其釒敦。後刃，敬也。三兵鐏、釒敦雖在下，猶為首。銳底曰鐏，取其鐏地，平底曰釒敦，取其釒敦地。○鐏，在困反，舊子困反，注同，一讀注音作管反。矛，本又作釒予，音謀，兵器。釒敦，本又作錞，徒對反，注同，一讀注丁亂反。" }
      - { type: z, text: "“水潦”至“其釒敦”。○正義曰：此一節明獻遺人物及授受之儀，今各隨文解之。○“水潦降，不獻魚鱉”者，案定四年《左傳》雲：“水潦方降。”今謂“水潦降”者，天降下水潦，魚鱉難得，故注云“不饒多也”。盧植、庾蔚之等並以為然，或解鄭雲“不饒多”者，以為水潦降下，魚鱉豐足，不饒益其多。○“獻鳥者佛其首”者，王雲：“佛謂取首戾轉之，恐其喙害人也。”鄭雲：“佛，戾也。蓋為小竹籠以冒之。”案王、鄭義同，而加籠籠之，為其喙害人也。○“畜鳥者則勿佛也”者，畜，養也。養則馴也。馴，善也。鳥經人養，則不喙害人，故獻之不用籠冒及戾之。○“獻車馬者執策綏”者，策是馬杖，綏是上車之繩。車馬不上於堂，不可投進尊者之前，但執策綏，策綏易呈，呈之則知有車馬。○“獻甲者執胄”者，甲，鎧也。謂鎧為甲者，言如龜鱉之有甲也。胄，兜鍪也。鎧大，兜鍪小，小者易舉，執以呈之耳。○“獻杖者執末”者，末，柱地頭也。柱地不淨，不可向人，故執以自向，持淨頭投與人。“獻民虜者，操右袂”者，“民虜”謂征伐所獲彼民以為外虜，故云“民虜”也。“右袂”者，右邊袖也。獻之，以左手操於囚之右邊袂，右邊袂，右邊有力，故此用右手以防其異心。凡言執、操，互言耳。○“獻粟者執右契”者，粟，粱稻之屬也。契謂兩書一札，同而別之。鄭注此雲：“契，券要也，右為尊。”以先書為尊故也。○“獻米者操量鼓”者，米，六米之等。量是知鬥斛之數，鼓是量器名也。《隱義》雲：“東海樂浪人呼容十二斛者為鼓，以量米，故云量鼓。獻米者執器以呈之。”米雲“量”，則粟亦量。粟雲“契”，則米亦書。但米可即食為急，故言量。粟可久儲為緩，故云“書”。書比量為緩也。○“獻孰食者操醬齊”者，孰食，蔥之屬。醬齊為食之主，執主來，則食可知。若見芥醬，必知獻魚膾之屬也。○“獻田宅者操書致”者，“書致”謂圖書於板，丈尺委曲書之，而致之於尊者也。以上諸物可動，故不雲“致”，而田宅著土，故板圖書畫以致之，故言“書”，又言“致”也。然古者田宅悉為官所賦，本不屬民，今得此田宅獻者，是或有重勳，為咀荃所賜，可為己有，故得有獻。“凡遺人弓”者，此謂敵體，故稱遺者也。“張弓尚筋”者，弓之為體，以木為身，以角為面，筋在外面，張之時曲來鄉內，故遺人之時使筋在上，弓身曲鄉其下，其弛弓之時反張向外，筋在曲內，角在曲外。今遺人之時，角向其上，弓形亦曲向下，故鄭注“皆欲令其下曲，隤然順也”。○注“遺人”至“弛之”。○正義曰：案《槀人》雲：“春獻素，秋獻成。”注云：“矢箙春作秋成。”矢箙既獻素，明知弓亦獻素。素，形樸也。故《士喪禮》注云：“形法定為素。”又《弓人》雲：“秋合三材，冬定體。”則合三材之時，可以獻入，故此注云“未定體則弛之”是也。○“右手執簫”者，簫，弓頭，頭稍剡，差邪似簫，故今為簫也。謂弓頭為鞘，鞘、簫之言，亦相似也。然執簫謂捉下頭，客覆右手執弓下頭也。○“左手承弣”者，弣謂弓把也。授在地，地道貴右，主人推客居右，客覆右手執弓下頭，又卻下左手以承弓把，把當中央而高、兩頭頹下以授主人，主人在左。所以知是執於弓下頭者，下頭拄地不淨，不可與人，故自執之，而以上頭授人，所以為敬也。“尊卑垂帨”者，“尊卑”謂賓主俱是大夫則為尊，若俱是士則為卑。帨，佩巾也。“若主人拜”者，主人將受，應當賓前而拜受所遺也。○“則客還辟，闢拜”者，“還辟”猶逡巡也。客謙不欲當主人之拜己，故少逡巡遷延闢之也。不雲客答拜者，執弓不得拜也。何胤雲：“執弓者回還，見主人拜而闢之也。”○“主人自受，由客之左”者，由，從也。主人既敵，故自受也。拜客既竟，從客左而受之。○“接下承弣”者，主人既還在客左，與客並，以卻左手接客左手之下而承弣，又覆右手捉弓下頭。○注“由從”至“手與”。○正義曰：客在右，故云“右客”也，是尊客，故使客在右也。雲“接下，接客手下也”者，客卻左手承弣，今主人卻左手接客左手之下而取弓。必知其客主俱卻左手承弣，右手覆簫者，若主人用右手承弣，便是主人倒執弓，故知然也。雲“承弣卻手，則簫覆手與”者，簫謂弓下頭也。客以弓上頭授與主人，主人以左手卻之接客手下，故又覆右手按捉弓下頭也。是客主授受皆卻左手承弣，覆右手執簫也。○“鄉與客並，然後受”者。前漫雲由左，恐人或相對而左右也。今明既拜客竟，則還前立處，與客俱鄉南而立，乃後受弓，故云“鄉與客並，然後受”也。○注“於堂”至“並授”。○正義曰：“俱南面”，解“鄉與客並”也。言於堂上俱南面，是嚮明故也。若不於堂上，則未必南面，當隨時便而俱嚮明。雲“禮：敵者並授”者，若不敵則不併授，此又證遺人是敵者也。然敵者並授，案《聘禮》賓問主國之卿，卿北面受幣，聘賓南面授幣，卿與聘賓是敵，不併授者，以聘賓銜聘君之命問卿，故卿北面受之，敬聘君之命也。○“進劍者左首”。正義曰：進亦謂遺也，言進授與人時也。首，劍拊環也。《少儀》曰：“澤劍首。”鄭雲：“澤，弄也。”推尋劍刃利不容可弄，正是劍環也。又云：“刀卻刃授穎。”鄭雲：“穎，鐶也。”案《少儀》而言，首則鐶也。不以刃授人，敬也。《春秋》魯定公十年，叔孫之圉人欲殺公若，偽不解禮而授劍末。杜雲：“以劍鋒末授之。”案解鋒為末，則鐶是首也。然劍有匣，又有衣也。故《少儀》雲：“劍則啟櫝，蓋襲之，加夫襓”是也。鄭雲“左首，尊”者，客在右，主人在左，劍首，首為尊，以尊處與主人也。假令對授，則亦左首，首尊，左亦尊，為宜也。○“進戈者前其鐏，後其刃”。○正義曰：戈，鉤孑戟也，如戟而橫安刃，但頭不鄉上為鉤也。直刃長八寸，橫刃長六寸，刃下接柄處長四寸，並廣二寸，用以鉤害人也。刃當頭而利者也，利故不持鄉人也。鐏在尾而鈍，鈍鄉人為敬，所以前鐏後刃也。○“進矛戟者前其釒敦”者，矛，如鋋而三廉也。戟，今之戟也。古作戟，兩邊皆安橫刃，長六寸，中刃長七寸半，橫刃下接柄處又長四寸半，並廣寸半。釒敦為矛戟柄尾，平底如釒敦柄下也。以平向人，敬也。亦應並授。不雲左右而云前後者，互文也。若相對則前後也，若並授則左右也。" }
      - { type: j, text: "進几杖者拂之。尊者所馮依，拂去塵，敬。○拂如字。馮，皮冰反。去，起呂反。效馬效羊者右牽之，用右手便。效猶呈見。○效，胡教反，下同。便，婢面反。見，賢遍反。效犬者左牽之。犬齜齧人，右手當禁備之。○齜，本亦作噬，常世反。執禽者左首。左首尊。飾羔雁者以繢。繢，畫也。諸侯大夫以布，天子大夫以畫。○繢，胡對反。受珠玉者以掬。慎也，掬手中。○掬，九六反，兩手曰掬。受弓劍者以袂。敬也。飲玉爵者弗揮。為其寶而脆。○揮音輝，何雲：“振去餘酒曰揮。”脆，七歲反。凡以弓劍、苞苴、簞笥問人者，問猶遺也。苞苴，裹魚肉，或以葦，或以茅。簞笥，盛飯食者，圜曰簞，方曰笥。○苞苴，子餘反；苞，裹也；苴，藉也。簞音單；笥，思嗣反，《字林》先自反，沈息裏反；簞笥，竹器也。裹音果。葦，韋鬼反。盛音成。圜音圓。操以受命，如使之容。謂使者。○使，色吏反，注及下“使者”、“使也”並同。" }
      - { type: z, text: "“進幾”至“之容”。○正義曰：此一節皆謂相獻遺及呈見之儀，各依文解之。○“進几杖者拂之”，謂拂去塵埃，為當馮執故也。前雲獻杖執末，與此互文也。此兼言幾者，幾雖無首末，亦拂之。或雲進幾者，以彎外授人，亦得順也。○“效馬效羊者右牽之”者，效，呈見也。此亦是遺人，而言效，亦互文也。馬羊多力，人右手亦有力，故用右手牽掣之也。○“效犬者左牽之”者，犬好齛齧人，故左牽之，而右手防禦也。案《少儀》雲“獻犬則右牽之”者，彼是田犬、畜犬，不齧人，不須防；今此是充食之犬，故防禦之也。然通而言之，狗、犬通名；若分而言之，則大者為犬，小者為狗。故《月令》皆為犬，而《周禮》有《犬人職》，無狗人職也，故《爾雅》雲“未成毫狗”是也。但燕禮亨狗，或是小者，或通語耳。○“執禽者左首”者，禽，鳥也。左，陽也，首亦陽也。“左首”謂橫捧之也，凡鳥皆然。若並授，則主人在左，故客以鳥首授之也。不牽，故執之也。○“飾羔雁者以繢”者，飾，覆也。羔，羊也。繢，畫也。畫布為雲氣，以覆羔雁為飾以相見也。《士相見禮》雲，下大夫以雁，上大夫以羔，飾之以布。並不言繢，此言繢者，鄭雲，彼是諸侯之卿大夫，卑，但用布；此天子之卿大夫，尊，故畫之也。“受珠玉者以掬”者，掬謂手中也。珠玉寶重宜慎。若受之，開匣而出，置在手中，下用袂承之，恐墜落也。○“受弓劍者以袂”者，不露手取之，故用衣袂承接之，以為敬也。○“飲玉爵者弗揮”者，玉爵，玉杯也。揮，振去餘也。《春秋左氏傳》雲：“奉匜沃盥，既而揮之揮之。”是振去餘也。○“凡以弓劍、苞苴、簞笥問人”者，凡謂凡此數事皆同然。苞者，以草苞裹魚肉之屬也。故《尚書》雲：“厥苞橘柚。”是其類也。苴者亦以草藉器而貯物也。簞圓笥方，俱是竹器，亦以葦為之。問人者，問謂因問有物遺之也。問者或自有事問人，或謂聞彼有事而問之。問之悉有物表其意，故自“弓劍”以下皆是也。○注“苞苴”至“以茅”。○正義曰：知“裹魚肉”者，《詩》雲：“野有死麕，白茅苞之。”《內則》雲：“炮取豚，編萑以苴之。”《既夕禮》雲：“葦苞長三尺。”是其裹魚肉用茅用葦也。○“操以受命，如使之容”者，言“使之容”者，言使者操持此上諸物以進，受尊者之命，如臣為君聘使，受君命，先習其威儀進退，令如其至所使之國時之儀容，故云“如使之容”也。" }
