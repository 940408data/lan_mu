aboutHtml: |-
  <h2>關於此卷</h2>
  <p>《周禮注疏》為唐賈公彥等奉敕撰，以漢鄭玄注為本，為十三經注疏之一。周禮設六官以統百職，此卷以宋刻本版式數字重刻，半葉八行、行十六字、注文雙行二十五字。</p>
  <p>卷二十三收正文，經注疏全帙。</p>
