aboutHtml: |-
  <h2>關於此卷</h2>
  <p>《春秋左傳正義》為唐孔穎達等奉敕撰，以晉杜預注為本，為十三經注疏之一。左氏傳事詳而文贍，此卷以宋刻本版式數字重刻，半葉八行、行十六字、注文雙行二十五字。</p>
  <p>卷四十八收昭十七年，經注疏全帙。</p>
