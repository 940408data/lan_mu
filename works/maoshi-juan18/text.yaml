# 毛詩正義卷18（孔穎達疏）：j 為經文＋毛亨傳、鄭玄箋，z 為疏文。
sections:
  - id: juan18
    name: 正文
    blocks:
      - { type: j, text: "《常武》，召穆公美宣王也。有常德以立武事，因以為戒然。戒者，“王舒保作，匪紹匪游，徐方繹騷”。○繹音亦。騷，素刀反，徐音蕭。" }
      - { type: z, text: "“《常武》六章，章八句”至“為戒然”。○正義曰：《常武》詩者，召穆公所作，以美宣王也。經無“常武”之字，故又解之雲：美其有常德之故，以立此武功征伐之事，故名為《常武》。非直美之，又因以為戒，戒之使常然。定本、《集註》皆有“然”字。經六章，三章上五句以上，言命遣將帥，修戒兵戎，無所暴掠，民得就業，此事可常以為法，是有常德也。三句以下，言征伐徐國，使之來庭，克翦放命，服王威武，此事武功成立，是立武事也。其因以為戒，則如箋之所言“就常德之中，戒使常行之也”。宣王末年德衰，此雲“有常德”者，是謂常時所行之德，可以為常，非言宣王終始有常，故因以為戒，戒王使之有常也。此章王肅述毛以為王不親行。王基述鄭為此章王自親行。王既親行，仍須命元帥以統領六軍，故《左傳》鄢陵之戰，楚王雖自親行，仍命子反將中軍，是也。○箋“戒者”至“釋騷”。○正義曰：“三事就緒”以上，命將帥之辭。“震驚徐方”以下，是往伐徐國之事。唯“赫赫業業”五句，說王之軍行，雲舒緩而無懈怠，自然前敵恐動。是用兵之道，不假暴疾。雖美其實事，亦戒使常然，故以此言當之。" }
      - { type: j, text: "赫赫明明，王命卿士，南仲大祖，大師皇父：“整我六師，以修我戎。赫赫然盛也。明明然察也。王命南仲於大祖，皇甫為大師。箋雲：南仲，文王時武臣也。顯著乎，昭察乎，宣王之命卿士為大將也。乃用其以南仲為大祖者，今大師皇父是也。使之整齊六軍之眾，治其兵甲之事。命將必本其祖者，因有世功，於是尤顯。大師者，公兼官也。○赫，火百反，字又作“爀”。大祖，音泰，下及注“大師”、“大祖”皆同。將，子匠反。第一章注同。" }
      - { type: j, text: "既敬既戒，惠此南國。”箋雲：敬之言警也。警戒六軍之眾，以惠淮浦之旁國。謂敕以無暴掠為之害也。每軍各有將，中軍之將尊也。○警音景。掠音亮。" }
      - { type: z, text: "“赫赫”至“南國”。○毛以為，今有赫赫然顯盛，明明然昭察者，宣王也。所以為盛察者，以王今命卿士南仲者於王太祖之廟，使之為元帥親兵。又命為太師之公者皇父，使之監撫軍眾。既使此二人為將為監，乃告之雲：當整齊我六軍之眾，以治我甲兵之事，令師嚴器備。既已嚴備，當恭敬臨之。既已恭敬，又當戒懼而處之，施仁愛之心於此南方淮浦之傍國，勿得暴掠為民之害。此是王之顯察也。鄭以南仲為皇父遠祖，止命皇父一人而已。言王命卿士以南仲為大祖者，太師三公皇父也。此人為將，以整齊六師。又以敬為警，言既已警肅之，既已戒敕之。以此為異。餘同。○傳“赫赫”至“太師”。○正義曰：《釋訓》雲：“赫赫，迅也。”孫炎曰：“赫赫，顯著之迅。”郭璞曰：“盛疾之貌。”是赫赫為盛之意也。“明明，察”，《釋訓》文。舍人曰：“明明，言其明甚。”孫炎曰：“明明，性理之察也。”言王命南仲於太祖，謂於太祖之廟命南仲也。皇父為太師，謂命此皇父為太師。毛蓋見其文煩，故以為二人。“南仲”、“卿士”，文在“太祖”之上，是先為卿士，今命以為大將。“太師皇父”在“太祖”之下，則於太祖之廟始命以為太師。其實皆在太祖之廟並命之，故太祖之文處其中也。南仲為卿士，未知於六官何卿也。皇父新為太師，未知於舊何官也。正以二文不同，知皇父新命之耳。下章“王謂尹氏，命程伯休父”，則此二人亦當尹氏命之矣。此言太祖，下言尹氏，互相足也。大師，三公之官，則是尊於卿士。先言王命南仲者，以南仲為上將，皇父為監。以皇父不親兵，故特言命南仲。王肅雲：“皇父以三公而撫軍也。殊南仲，於王命親兵也。”○箋“南仲”至“兼官”。○正義曰：箋以王命卿士以為大將，止當命一人為元帥，不應並命二人，故以為止命皇父而已。以《出車》之篇言之，知南仲，文王時武臣，是今所命者皇父之太祖，故本言之。命皇父為將，必遠本其祖者，因其有積世之功，尤欲使之彰顯故也。上言王命卿士，則皇父為卿士矣。太師，三公之名。復言“太師皇父”一人，是公兼官，謂三公而兼卿士之官。必易傳者，孫毓雲：“宣王之大將復字南仲，傳無聞焉。且古之命將，皆於禰廟，未有於后稷太祖之廟者。又經言‘南仲太祖’，明以南仲為太祖，非命於太祖之文也。昔陳勝舉兵，稱項燕，命將本祖，古今有之。箋義為長。”陳勝舉兵者，《史記》、《漢書》皆有其事。《十月之交》皇父擅恣，若為厲王則在此之先，若為幽王則在此之後，皆相接連，與此皇父得為一人。或皇氏父字，傳世稱之，亦未可知也。○箋“敬之”至“尊也”。○正義曰：箋以戒為戒敕，則敬非戒類，不宜相配而言，故知敬之言警，承上六師之下，故云“警戒六軍之士眾”，軍之所行，多苦暴掠，故知施惠南國，是使無暴掠為之害也。又以天子六軍，軍各有將，今獨命皇父，使整六師，惠南國，不命餘將，故解之，“雖每軍各有將，中軍之將尊”，故特命之，使總攝諸軍也。《左傳》稱晉作諸軍，常以中軍之將為元帥，元帥是其尊也。諸侯三軍，分為左右，可得有中軍焉。天子六軍，而得有中軍者，亦當分之為三，中與左右各二軍也。《春秋》桓五年，“蔡人、衛人、陳人從王伐鄭”。《左傳》曰：“王為中軍，虢公林父將右軍，周公黑肩將左軍。”是天子之軍分為左右之事也。鄭轉敬言警，而毛不為傳，則毛不變敬字，當以敬為恭敬，戒為戒懼。使此二將恭敬以臨之，戒懼而處之，不得與鄭同也。" }
      - { type: j, text: "王謂尹氏，命程伯休父：“左右陳行，戒我師旅。率彼淮浦，省此徐土。尹氏掌命卿士，程伯休父始命為大司馬。浦，涯也。箋雲：尹氏，天子世大夫也。率，循也。王使大夫尹氏策命程伯休父於軍將行治兵之時，使其士眾左右陳列而敕戒之，使循彼淮浦之旁，省視徐國之土地叛逆者。軍禮，司馬掌其誓戒。○陳如字，徐直覲反。行，戶剛反，列也。浦音普，涯也，《說文》雲：“水濱也。”" }
      - { type: j, text: "不留不處，三事就緒。”誅其君，吊其民，為之立三有事之臣。箋雲：緒，業也。王又使軍將豫告淮浦徐土之民雲：不久處於是也，女三農之事皆就其業。為其驚怖，先以言安之。○為之，於偽反。下“為其”同。將，子匠反。下同。" }
      - { type: z, text: "“王謂”至“就緒”。○毛以為，上命將元帥，此命司馬。王謂其內史大夫尹氏，汝當為策書，命此程國之伯字休父者，謂命之為大司馬之卿也。即言所命之意，今軍出之時，使此司馬令其士眾左右陳力而為行，稱王之命，戒敕我六軍之師旅，往循行淮之浦厓，省視此徐之國土，有叛逆者從而討之。又當預告徐上之人，我兵之來也，不久留，不停處，直誅爾叛逆之君，為汝立三有事之臣，使就其事業。當即還師，勿驚怖也。○鄭唯“三事就緒”謂“三農之事皆就業”為異。餘同。○傳“尹氏”至“浦厓”。○正義曰：以王謂之而使命人，故知尹氏掌命卿士，即內史也。其職曰：“凡命諸侯及孤卿大夫則策命之。”是也。特雲命之，知往前未為此官，始命之也。知為大司馬者，以《大司馬職》雲：“若大師則掌其戒令。”此言“戒我師旅”，是司馬之事。又《楚語》雲：“重黎氏世敘天地。其在周，程伯休父其後也。當宣王失其官守，而為司馬氏。”韋昭雲：“程國，伯爵。休父，名也。失官，謂失天地之官，而以諸侯為大司馬也。”案：父宜是字，而昭以為名，未能審之。孫炎曰：“厓，水邊也。”《說文》雲：“浦，水濱也。”則浦、厓一物，故云浦也。○箋“尹氏”至“誓戒”。○正義曰：此時尹氏當是尹吉甫也。下至春秋之世，天子大夫每有尹氏見於經傅，以此知天子世大夫也。吉甫，卿士也，而云大夫者，以吉甫身為卿士，其繼世者不必常得為卿，而大夫是其總號。且命臣者，內史之事，《周禮》內史中大夫，故以大夫言之。吉甫卿士而掌命臣者，蓋為卿而兼內史也。雲于軍將行治兵之時者，軍禮“出曰治兵”，此行治兵之禮然後乃出，故行禮之時，敕戒師旅也。禮，軍行，司馬掌其誓戒者，即其職所云“大師掌其戒令”，是也。此經雲“徐土”，下雲“徐方”、“徐國”，其義一也，言其居在一方而有國土耳。此徐當謂徐州之地，未必即是春秋之世徐子之國。何則？春秋之世，徐國甚小，宣王之時，非能背叛而使王親征之。六軍並出，則是強敵者也，明非春秋徐國，但不知於時之君何姓名耳。○傳“誅其”至“之臣”。○正義曰：告之以“不留不處”，是安慰民情之辭，故解其意，“誅其君，吊其民”。由吊愍其民，故不久留處而擾亂之。立三有事之臣，與《十月之交》“擇三有事”文同。彼傳雲：“三有事者，國之三卿。”即此亦為之立三卿也。止言立卿，不言立君，舉其立臣，明亦為之立君。或擇此君之宗賢者而立之，或別封他人，無文可以明之。就緒者，王肅雲：“就其事業。”亦當謂民得就業。○箋“緒”至“安之”。○正義曰：《釋詁》雲：“業，緒也。”反覆相訓，故緒為業。連上命將之事，而王實未行，故知又使軍將豫告之也。以誅君吊民，使之就業。民之就業，唯農事耳，故知三事謂三農之事。太宰九職，“一曰三農，生九穀”。注云：“三農，原隰及平地。”則三農謂此也。《十月之交》雲：“擇三有事。”是有事者三而擇立之。《雨無正》雲：“三事大夫。”文連大夫，故得以為公卿。至於此者，言民就農事，不宜以為三卿，故易傳也。" }
      - { type: j, text: "赫赫業業，有嚴天子。王舒保作，匪紹匪游。徐方繹騷，赫赫然盛也。業業然動也。嚴然而威。舒，徐也。保，安也。匪紹匪游，不敢繼以敖游也。繹，陳。騷，動也。箋雲：作，行也。紹，緩也。繹當作驛。王之軍行，其貌赫赫業業然，有尊嚴於天子之威，謂聞見者莫不憚之。王舒安，謂軍行三十里，亦非解緩也，亦非敖游也。徐國傳遽之驛見之，知王兵必克，馳走以相恐動。○嚴，毛魚檢反，鄭如字。紹如字，繼也，徐雲：“鄭尺遙反。”繹音亦，鄭作“驛”，音同，謂傳驛也。騷如字，徐音蕭。“舒，序也”，一本作“舒，徐也”。憚，徒旦反。解音懈。傳，張戀反。恐，丘勇反。下同。" }
      - { type: j, text: "震驚徐方，如雷如霆，徐方震驚。箋雲：震，動也。驛馳走相恐懼，以驚動徐國，如雷霆之恐怖人然，徐國則驚動而將服罪。○霆音庭。" }
      - { type: z, text: "“赫赫”至“震驚”。○毛以為，上言戒敕將帥，此言王軍往行。言赫赫然而盛，業業然而動，有儼然威武而為天子之容者，此宣王之軍也。以此而往征伐徐國之君，乃舒徐而安行，不為急疾。言其依於軍法，日行三十里耳。雖於禮舒行，又非敢繼之以敖游，言其不始而安行，末以敖游繼之，謂終常敬戒，不惰慢也。故徐土之方，斥候之使見其如此，乃陳說王之此威，往告以恐動之。其動驚此徐方之國，如雷之發聲，如霆之奮擊，以恐怖人然。故使徐方之國聞之，則皆動驚而將服罪。此事可常以為法，故美王能行之。○鄭以為，王之軍行，其儀貌赫赫然，有尊嚴於天子之威。王既其貌如此，出則舒而安行，亦非解緩，亦非敖游。由此徐方之國傳遽之驛見之，知王兵必克，馳走以相恐動。餘同。○傳“赫赫”至“騷動”。○正義曰：赫赫，盛貌。業業，動狀。軍行而又見其狀，故以業業為動也。儼然而有威，謂其軍儼然有可畏之貌。“舒，徐也”。定本雲“舒序”，非也。《釋詁》雲：“紹，繼也。”以紹、游共為一句，皆是不敢為之，故云“不敢繼以敖游”。以凡人之心，莫不初勤後惰，況今以安舒為始，或當以敖游繼之。而宣王能終始如一，故美其不敢繼以敖游。“繹，陳”，“騷，動”，皆《釋詁》文。○箋“作行”至“恐動”。○正義曰：此說軍已動發，故以為行。“匪紹匪游”，各自言匪每者一義，不得言繼以敖游也，故讀之為紹，訓之為緩。言“繹騷”，則騷由此驛，故知繹當作傳驛之驛。言有嚴天子為他人所尊嚴，故易傳言有嚴天子之威，謂聞見者莫不憚之。王舒安行，嫌其解緩，故云“亦非敖游也”。《左傳》稱“兵交，使在其間”。王將伐徐，必使候，故云徐國傳遽之驛見之，知王兵必克，歸以報其國，馳走以相恐動。" }
      - { type: j, text: "王奮厥武，如震如怒。進厥虎臣，闞如虓虎。鋪敦淮濆，仍執醜虜。虎之自怒虓然。濆，涯。仍，就。虜，服也。箋雲：進，前也。敦當作屯。醜，眾也。王奮揚其威武，而震雷其聲，而勃怒其色。前其虎臣之將闞然如虎之怒，陳屯其兵於淮水大防之上以臨敵，就執其眾之降服者也。○“如震如怒”，一本此兩“如”字皆作“而”。闞，呼減反，徐火斬反，又火敢反，一音啖。虓，火交反，虎怒貌。鋪，普吳反，徐音孚，陳也，《韓詩》作“敷”，雲：“大也。”敦，王申毛如字，厚也，《韓詩》雲“迫”，鄭作“屯”，徒門反。淮濆，符雲反，鄭“大防也”。仍如字，本或作“扔”，音同。勃，步忽反。降，戶江反。" }
      - { type: j, text: "截彼淮浦，王師之所。截，治也。箋雲：治淮之旁國有罪者，就王師而斷之。○截，才結反。斷，端亂反。" }
      - { type: z, text: "“王奮”至“之所”。○毛以為，既到淮浦，臨陣將戰，王乃奮揚其威武，其狀如天之震雷，其聲如人之勃怒其色。言嚴威之可懼也。即進而前，其虎臣之將闞然如虓怒之虎，令布陳敦厚之陣於淮水濆厓之上，就而執其眾所降服之虜。既敗其根本，又窮其枝葉，因復使人治彼淮浦之傍有罪之國，皆執而送之，來就王師之所而聽誓言，盡得其支黨也。○鄭唯以敦為屯為異。餘同。○傳“虎之”至“虜服”。○正義曰：此論武將之威，言如虓虎，故知虎之自怒虓然。《釋丘》雲：“墳，大防。”李巡曰：“墳謂厓岸，狀如墳墓。”是墳為厓也。《釋詁》雲：“仍，因也。”因是就之義也。虜者，囚系之名，為人虜獲，是屈服也。○箋“進前”至“服者”。○正義曰：以其臨陣當進而前之，故以進為前也。敦訓為厚，於義不協，故破之為屯。毛無破字之理，必以為厚，宜為布陳敦厚之陣也。“醜，眾”，《釋詁》文。言虎臣之將者，以虎臣稱臣，為王所特進，非廣言士卒，故知是將也。就執其降服者，此篇上下不言其戰，則是見敵即服，故就執之。" }
      - { type: j, text: "王旅嘽嘽，如飛如翰，如江如漢，如山之苞，如川之流，嘽嘽然盛也。疾如飛，摯如翰。苞，本也。箋雲：嘽嘽，閒暇有餘力之貌。其行疾，自發舉如鳥之飛也。翰，其中豪俊也。江漢以喻盛大也。山本以喻不可驚動也。川流以喻不可御也。○嘽，吐丹反。摯音至。閒音閒。" }
      - { type: j, text: "綿綿翼翼，不測不克，濯徵徐國。綿綿，靚也。翼翼，敬也。濯，大也。箋雲：王兵安靚且皆敬，其勢不可測度，不可攻勝。既服淮浦矣，今又以大徵徐國，言必勝也。○綿如字，《韓詩》作“民民”，同。度，待洛反。" }
      - { type: z, text: "“王旅”至“徐國”。○正義曰：上既克定淮浦之國，此又進而伐徐，言王之師旅雖經淮夷，其師之盛嘽嘽然，間暇而有餘力也。其行動之疾也，如鳥之飛。其赴敵之速也，如摯之翰。其軍之眾多也，如江之廣，如漢之大也。其固守則不可驚動，如山之基本。其往戰則不可御止，如川之流逝。其行之時，綿綿然安靜，不行暴掠，翼翼然恭敬，各司其事。其形勢不可測度，不可克勝。以此嚴威武力，將大往而徵此徐國，言其盛不可當，往必克敵也。○傳“嘽嘽”至“苞本”。○正義曰：嘽嘽，間暇之貌。由軍盛所以嘽嘽然，故云盛也。疾如飛，如鳥飛也。摯如翰者，摯，擊也，翰是飛之疾者。言其擊物尤疾，如鳥之疾飛者。“翰飛戾天”，飛、翰為一，此別言“如”，故為二事也。○箋“嘽嘽”至“可御”。○正義曰：此皆以傳大略，故申述之。鳥飛已是迅疾，翰又疾於飛，故云“翰，其中豪俊”者。若鷹顫之類摯擊眾鳥者也，故傳以為“摯如翰”，謂其擊戰之時也。江、漢以比盛大，即“漢之廣矣”，“江之永矣”，軍師之眾，其廣長似之也。兵法有動有靜，靜則不可驚動，故以山喻，動則不可御止，故以川喻。如川之流，取流為喻。“如江如漢”，不取其流，取其盛大耳。○傳“綿綿”至“濯大”。○正義曰：綿綿，舒緩之意，故為靜也。《釋訓》雲：“翼翼，恭也。”故為敬。“濯，大”，《釋詁》文。○箋“王兵”至“必勝”。○正義曰：以上文說其勇猛，而勇猛失於殘害，故言安靜且敬以解之。兵法應敵出奇，故美其不可測度，不可攻勝，正謂他人不能勝己也。上已言“截彼淮浦”，此言“濯徵徐國”，是既服淮浦之國，今又伐徐也。此篇與上篇事別，非召穆平淮夷之事，然則淮浦之國非淮夷也，未知何國。以強弱相懸，而云大徵，故知言必勝也。" }
      - { type: j, text: "王猶允塞，徐方既來。猶，謀也。箋雲：猶，尚。允，信也。王重兵，兵雖臨之，尚守信自實滿，兵未陳而徐國已來告服，所謂“善戰者不陳”。○陳，直刃反。下同。徐方既同，天子之功。四方既平，徐方來庭。來王庭也。" }
      - { type: j, text: "徐方不回，王曰還歸。箋雲：回，猶違也。還歸，振旅也。" }
      - { type: z, text: "“王猶”至“還歸”。○毛以為，王師既盛如此，又王之謀慮信而誠實，用兵有常，伐得其罪，故兵未陣而徐方既已自來告服其罪，因此歸功於王。徐方來，與他國同服於王者，是天子之功使之然也。又四方既已平定，徐方又來在王庭，便是天下宴安，不須用武。徐方先嚐叛者，已不敢違命，則無復有事。王乃告之曰：可以還歸矣。是武事既立，故述而美之。○鄭唯以“猶”為“尚”為異。○傳“猶，謀”。○正義曰：《釋詁》文。○箋“猶尚”至“不陳”。○正義曰：箋以徐方畏威，望軍而服，不由計謀所致，故易傳以猶為尚，兵法，臨敵設權，王尚守信自實，所以為美也。不言對戰執虜，故知兵未陣，徐國已來告服。“善戰者不陳”，莊八年《穀梁傳》文。○傳“來王庭”。○正義曰：言來王庭，謂既降服，後朝京師而至王庭，不必在王軍之庭也。" }
      - { type: j, text: "《常武》六章，章八句。" }
      - { type: j, text: "《瞻卬》，凡伯刺幽王大壞也。凡伯，天子大夫也。《春秋》魯隱公七年，“冬，天王使凡伯來騁”。○卬音仰。此及《召旻》二篇，幽王之《變大雅》也。" }
      - { type: z, text: "“《瞻卬》七章，上二章與卒章章十句，次三章盡六章章八句”至“大壞”。○正義曰：幽王承父宣王中興之後，以行惡政之故，而令周道廢壞，故刺之也。經七章，所陳皆刺大壞之事。○箋“凡伯”至“來聘”。○正義曰：凡國，伯爵。禮，侯伯之入王朝則為卿，故《板》箋以凡伯為卿士。此言大夫者，大夫，卿之總稱也。所引《春秋》者，隱七年經也。引之者，證天子之臣有凡伯也。凡國伯爵，稱世稱之，不謂與此必為一人矣。" }
      - { type: j, text: "瞻卬昊天，則不我惠。孔填不寧，降此大厲。昊天，斥王也。填，久。厲，惡也。箋雲：惠，愛也。仰視幽王為政，則不愛我下民甚久矣。天下不安，王乃下此大惡以敗亂之。○昊，戶老反。填音塵。下篇同。" }
      - { type: j, text: "邦靡有定，士民其瘵。蟊賊蟊疾，靡有夷屆。罪罟不收，靡有夷瘳。瘵，病。夷，常也。罪罟，設罪以為罟。瘳，愈也。箋雲：屆，極也。天下騷擾，邦國無有安定者。士卒與民皆勞病，其為殘酷痛病於民，如蟊賊之害禾稼然，為之無常，亦無止息時。施刑罪以羅網天下而不收斂，為之亦無常，無止息時，此目王所下大惡。○瘵，側界反，《字林》側例反。蛑，本又作“蟊”，音牟。屆音界。罟音古。瘳，敕留反。卒，尊忽反。" }
      - { type: z, text: "“瞻卬”至“夷瘳”。○正義曰：言己瞻望而仰視此昊天，王者之為政，曾不於我百姓而施恩愛也。若愛百姓，當以善政安之。今甚久矣，天下不安。言不安以來已久也。王又乃下此大惡之政，以敗亂之。又說所下大惡之狀。王為虐政，天下騷擾，邦國無有定安者，士卒與民其盡勞病矣。其殘酷於民，如蟊賊之蟲病害於禾稼然。為此殘酷，無有常，又無有已止時也。其殺害於民，則施刑罪以網羅天下，一逕施行，不復收斂，為此殺害，無有常，又無瘳愈時也。言王降大惡如此，故下民所以不安。○傳“昊天”至“填久”。○正義曰：以“則不我惠”，謂王不愛民，故知昊天斥王。卒章昊天與“無不克鞏”文連，固於天位是王之事，故知卒章昊天亦斥王也。作者既假昊天以斥王，其言天事則單言天耳。天何以刺？“天之降網”，實論天事，嫌亦斥王，故不言昊，以異其文。《釋詁》雲：“塵，久也。”古書填與塵同，故以為久。○箋“惠愛”至“亂之”。○正義曰：“惠，愛”，《釋詁》文也。言幽王為政，不惠愛我下民，正謂降此大厲，即是不愛之驗。先言不愛為目，乃覆說不愛之狀。甚久矣，天下不安來久。《鄭語》稱幽王九年，王室始騷。此言不安已久，蓋九年已後也。王下此惡以敗亂之，言其不安之意也。○傳“瘵病”至“瘳愈”。○正義曰：“瘵，病。夷，常”，《釋詁》文。彼“夷”作“彝”，音義同。罟非罪名，而云“罪罟”，故知設罪以為罟，謂多立科條，使人易犯，若設網以待鳥獸，是以謂之罟。雲瘳謂病癒，愈亦止也。○箋“屆極”至“大惡”。○正義曰：“屆，極”，《釋言》文。極者，窮盡之義，故又轉為已。已，止也。邦國是畿外之辭，故云天下騷擾，謂王以虐政擾動之也。以士民連文，故云士卒與民。士卒即從軍者也。言為殘酷與施刑罪者，殘酷謂加害於民，施刑謂布陳科禁，雖害民是一，所從言之異，故重設其文也。蟊賊者，害禾稼之蟲。“蟊疾”，是害禾稼之狀。言王之害民，如蟲之害稼，故比之也。箋以蟊賊是損害之實，故以殘酷痛疾言之。罪罟是張設之言，故以施刑罪言之。不收者，以田設網罟，有收斂之期，王施刑禁，則不復收斂，故責其不收也。言目王所下大惡者，謂條目王惡。定本作“目”，俗本為“自”，誤也。" }
      - { type: j, text: "人有土田，女反有之。人有民人，女覆奪之。箋雲：此言王削黜諸侯及卿大夫無罪者。覆猶反也。○覆，芳服反，服也。注及下同。此宜無罪，女反收之。彼宜有罪，女覆說之。收，拘收也。說，赦也。○說音稅。注同。一音他活反。" }
      - { type: j, text: "哲夫成城，哲婦傾城。哲，知也。箋雲：哲謂多謀慮也。城，猶國也。丈夫，陽也。陽動故多謀慮則成國。婦人，陰也。陰靜故多謀慮乃亂國。○知音智，王申毛如字。喆音哲，本亦作“哲”。" }
      - { type: z, text: "“人有”至“傾城”。○正義曰：上八句言王之為惡皆由婦人，下二句謂婦人之言不可聽用。若謂智多謀慮之丈夫，則興成人之城國；若為智多謀慮之婦人，則傾敗人之城國。婦言是用，國必滅亡。王何故用婦人之言，為此大惡，故疾之也。○傳“哲，知”。○箋“哲謂”至“亂國”。○正義曰：“哲，智”，《釋言》文。智者役心以謀慮，故云哲謂多謀慮也。國之所在，必築城居之，作者以城表國。箋以其有城居之嫌，故云城猶國也。箋以“丈夫，陽。陽動故多謀慮則成國。婦人，陰。陰靜故多謀慮則亂國”。由陰陽不等，動靜事異，故俱多謀慮而成傾有殊也。若然，謀慮苟當，則婦人亦成國，任、姒是也。謀慮理乖，雖丈夫亦傾城，宰嚭、無極是也。然則成敗在於是非得失，不由動靜。而云陰陽不同者，於時褒姒用事，干預朝政，其意言褒姒有智，唯欲身求代後，子圖奪宗，非有益國之謀，勸王不使聽用，非言婦人有智皆將亂邦也。" }
      - { type: j, text: "懿厥哲婦，為梟為鴟。箋雲：懿，有所痛傷之聲也。厥，其也。其，幽王也。梟鴟，惡聲之鳥，喻褒姒之言無善。○懿，於其反。注同。沈又如字。梟，古堯反。姒音似。" }
      - { type: j, text: "婦有長舌，維厲之階。亂匪降自天，生自婦人。匪教匪誨，時維婦寺。寺，近也。箋雲：長舌喻多言語。是王降大厲之階，階所由上下也。今王之有此亂政，非從天而下，但從婦人出耳。又非有人教王為亂。語王為惡者，是惟近愛婦人，用其言故也。○寺，徐音侍，亦如字。近，附近之近。下“近愛”、“近川”同。上，時掌反。語，魚據反。" }
      - { type: z, text: "箋“懿有”至“無善”。○正義曰：懿與噫，字雖異，音義同。《金縢》雲：“噫！公命我勿敢言。”與此同也。噫者，心有不平而為聲，故云有所痛傷之聲。痛傷褒姒亂國政也。“厥，其”，《釋言》文。此刺幽王，而褒姒是其婦，故知“其，幽王”也。○傳“寺，近”。○正義曰：寺即侍也。侍御者，必近其傍，故以寺為近。○箋“長舌”至“言故”。○正義曰：以舌動而為言，故謂多言為長舌。《論語》雲“駟不及舌”，亦謂言為舌也。" }
      - { type: j, text: "鞫人忮忒，譖始竟背。豈曰不極，伊胡為慝？忮，害。忒，變也。箋雲：鞫，窮也。譖，不信也。竟，猶終也。胡，何。慝，惡也。婦人之長舌者多謀慮，好窮屈人之語，忮害轉化，其言無常，始於不信，終於背違。人豈謂其是不得中乎？反雲維我言何用為惡不信也？○鞫，居六反。忮，之豉反。忒，他得反。譖本又作“僣”，子念反。背音佩。注同。慝，他得反。好，呼報反。" }
      - { type: j, text: "如賈三倍，君子是識。婦無公事，休其蠶織。休，息也。婦人無與外政，雖王后猶以蠶織為事。“古者天子為藉千畝，冕而朱紘，躬秉耒。諸侯為藉百畝，冕而青紘，躬秉耒。以事天地山川社稷先古，敬之至也。天子諸侯必有公桑蠶室，近川而為之，築宮仞有三尺，棘牆而外閉之。及大昕之朝，君皮弁素積，卜三官之夫人、世婦之吉者，使入蠶於蠶室，奉種浴於川，桑於公桑，風戾以食之。歲既單矣，世婦卒蠶，奉繭以示於君，遂獻繭於夫人。夫人曰：此所以為君服。與遂副褘而受之，少牢以禮之。及良日，後夫人繅，三盆手，遂佈於三宮夫人世婦之吉者，使繅，遂朱綠之，玄黃之，以為黼黻文章。服既成矣，君服之以祀先王先公，敬之至也。”箋雲：識，知也。賈物面有三倍之利者，小人所宜知也。君子反知之，非其宜也。今婦人休其蠶桑織紝之職，而與朝廷之事，其為非宜亦猶是也。孔子曰：“君子喻於義，小人喻於利。”○賈音古。注同。《爾雅》雲：“市也。”倍，蒲罪反。無與，音預。紘，獲耕反。耒，力對反。昕音欣。奉，芳勇反。下同。種，章勇反。戾，力計反，燥也。食音嗣。單音丹。繭，古顯反。君服與，音餘。褘音輝。副，首飾。褘是褘衣。少，詩照反。繅，素刀反，本亦作“縿”，同。盆，蒲門反。紝，女金反。而與，音預。朝，直遙反。下“朝廷”同。" }
      - { type: z, text: "“鞫人”至“蠶織”。○正義曰：上言長舌之惡，更說為惡之狀。此婦人之長舌多謀慮者，乃好窮屈人之言語，出言則為人患害，且又變化無常，所言以不信為始，終竟於後背而違之。豈肯自曰：我之此言不中正乎？反雲：維我此言，何用為惡？惡而不知其非，故為可痛傷也。既雲出言不善，又責其幹亂朝政，如商賈之求利三倍，乃君子之人於是識知之，非其宜也。汝今婦人之不宜與朝廷公事，而休止養蠶織紝，干預男子之政，亦非宜也。○傳“忮，害。忒，變”。○正義曰：忮者，以心忮格前人，為之患害，故以忮為害也。《釋言》雲：“爽，忒也。”孫炎曰：“忒，變雜不一。”是忒為變之義也。○箋“鞫窮”至“不信”。○正義曰：“鞫，窮”，《釋言》文。讒譖者，皆不信之言，故以譖為不信也。竟者，卒盡之義，故云竟猶終也。“胡，何。慝，惡”，皆詩之通訓。佞人似智，奸人亂德，皆自以為善。此刺褒姒自以為賢。“豈謂是不得中乎？反雲維我言何用為惡不信”，自謂所行皆得中，疾時人謂之惡。不自嫌其不信，所以至亡而不改也。○傳“休息”至“之至”。○正義曰：“休，息”，《釋詁》文。傳解婦人無與外事，雖王后之貴，猶以蠶織為事，故引《禮記》以證之。自“古者天子”以下，皆《祭義》文也。謂之藉田者，《天官·甸師》注云：“藉之言借也。王一耕之，而使庶人芸芓終之。”《月令》注云：“借民力所治之田也。”天子千畝，諸侯百畝，以事神有多少，因而為之等差也。冕者，祭服之冠。紘謂冕之下而仰屬者。止言服冕，而冕有等級，未知服何冕也。夫人受繭服副褘，則人君耕藉或亦用祭服，蓋天子以袞冕也。諸侯自祭其廟，用玄冕，耕藉之服不過用玄冕也。其紘，天子以朱，諸侯以青者，以朱，南方，太陽之色，故天子用之；青，東方，少陽之色，故諸候用之，所以下天子。天子藉田在南郊，諸侯藉田在東郊，亦此意也。躬秉耒耜，謂親耕之。《月令》孟春，“天子親載耒耜，躬耕帝藉”，是其事也。此文兼有天子諸侯，故云以事天地山川社稷先古，總舉諸神以為言也。《祭義》作“先古”，注云：“先古，先祖。”定本作“先公”，涉下先公而誤耳。既言人君親耕，又言王后親蠶，見祭祀之禮，必夫婦致敬也。蠶室必近川者，《夏官·馬質》注引《蠶書》雲：“蠶為龍精。”然則以龍是水物，故近川為之，取其氣勢也。築宮，謂築蠶宮之院牆也。七尺曰仞。言仞有三尺，則蠶宮之牆高一丈矣。《尚書夏傳》文與此略同，雲“築官有三尺”者，其文誤也。故彼注云：“‘官’當為‘宮’。雉長三丈，高一丈。度長以長，度高以高，則蠶宮高一丈。”《禮志》曰仞有三尺。七尺曰仞，彼文直雲“宮有三尺”，“宮”下當脫“仞”字也。雉者，城牆之度，故鄭計雉之數以推之。又引《禮記》以證之，復言七尺曰仞，是仞有三尺，乃充一雉之度，明其宮不得高丈三矣。彼注或雲“蠶宮高一丈三尺”者，衍“三尺”二字也。棘牆，謂牆上布棘，以禁人之逾越，不以禦寇，故外閉之。大昕之朝者，彼注云：“季春朔日之朝也。知者，以既卜之下即言養蠶之事。季春始蠶，故知是季春也。昕者，朝旦之名。言大昕，明是朔日之朝也。”皮弁素積者，《士冠禮》注云：“皮弁者，白鹿皮為冠，象上古也。積，猶闢也。以素為裳，闢蹙其腰中。皮弁之衣，用布十五升，其色象焉。”是也。卜三宮之夫人世婦之吉者，謂天子則卜三夫人，諸侯則卜世婦也。《月令》注“留養蠶者，所卜夫人與世婦”。是天子之夫人親蠶事也。《周禮》王后六宮，言三宮者，亦據諸侯言之也，故彼注云：“諸侯夫人三宮，半王后也。”言三宮，據諸侯夫人有三宮。言三宮之夫人，亦容天子。三夫人，人各居一宮也。以文兼天子諸侯，故雜互陳之。奉種浴於川，文承大昕之下，則以三月浴之矣。《天官·內宰》雲：“仲春，詔後率外內命婦始蠶於北郊。”《馬質》注云：“月直大火則浴其種。”以仲春浴之者，蓋二月浴之，至將生又浴之，故不同也。風戾以食之者，彼注云：“葉及早涼脆，採之風戾之，使露氣燥，乃可食蠶。蠶性惡溼也。”歲既單矣，單，盡，故彼注云：“歲單，謂三月月盡之後也。言歲者，蠶，歲之大功，事畢於此也。”世婦卒蠶，獻繭於夫人，據諸侯為說。若天子，則夫人卒蠶，獻於後。《夏傳》注云：“此諸侯之禮。天子則獻繭於後。”是也。於君言示，於夫人言獻，以繭是夫人之事，主獻夫人，故夫人受之。夫人而云副褘者，彼注云：“副褘，王后之服。而云夫人，記者容二王之後與？以記意或然，故言。”與為疑之辭，雖王后受繭，其服尊，不過亦副褘也。少牢以禮之者，設少牢之饌，以禮遇世婦也。彼注云：“禮之者，禮奉繭之世婦也。”繅三盆手者，彼注云：“三盆手者，三糹奄也。幾繅，每糹奄大總而手振之以出緒也。”《夏傳》注云：“手猶親也，言後夫人親以手總之也。”言君服之以祀先王先公，敬之至也。以文兼天子諸侯，故先王先公互言之。○箋“識知”至“於利”。○正義曰：利之多少，其數無常。必以三倍為言者，以三是三才之數，數之小成，故舉以言焉。" }
      - { type: j, text: "天何以刺？何神不富？舍爾介狄，維予胥忌。剌，責。富，福。狄，遠。忌，怨也。箋雲：介，甲也。王之為政，既無過惡，天何以責王見變異乎？神何以不福王而有災害也？王不念此而改修德，乃舍女被甲夷狄來侵犯中國者，反與我相怨。謂其疾怨群臣叛違也。○舍音捨。注同。介音界。狄，毛他歷反，鄭如字，謂夷狄。見，賢遍反。被，皮寄反。" }
      - { type: j, text: "不吊不祥，威儀不類。人之雲亡，邦國殄瘁。類，善。殄，盡。瘁，病也。箋雲：吊，至也。王之為政，德不至於天矣，不能致徵祥於神矣，威儀又不善於朝廷矣。賢人皆言奔亡，則天下邦國將盡困病。○吊如字，又音的。瘁，似醉反。" }
      - { type: z, text: "“天何”至“殄瘁”。○鄭唯以介狄別解。餘皆同。○傳“刺責”至“忌怨”。○正義曰：刺譏者，皆責之辭，故刺為責也。言“何神不富”，則富是神之所加，故以富為福也。毛讀狄為逖，故為遠也，則介當訓為大，不得與箋同也。忌者，相憎怨之言，故以忌為怨也。王肅雲：“舍爾大道遠慮，反與我賢者怨乎？”○箋“介甲”至“叛違”。○正義曰：以辭有與奪，意為彼此，言“維予胥忌”，是不當怨而怨，則“舍爾介狄”者，是當怨而舍之也。且幽王荒淫惑亂，將至滅亡，兵在其頸，尚不知悟，安能復知大道遠慮？又大道遠慮非幽王之所有，何雲舍汝乎？何以者，問之辭，故云王之政無過惡，天何以責王也？既問天之刺責，又問神不福助，亞前為勢，故何在神上。天者，群臣之精，言天則神可知。去天以外而別言神，則謂人鬼地祗山川社稷之類也。天之所責，唯有妖變而已，故云見變異，若日食、星殞、山崩、川竭之屬也。神所不福，則是己有禍罰，故云有災害，謂水旱、蟲螟、霜雹、疫癘之等也。於時已有此等事，故責王不改修德教也。不應舍而舍，則是已來犯王，故知被甲夷狄來侵犯中國者，臣若阿諛順旨，必不為王所怨，故知反與我相怨，謂其疾怨群臣叛違也。以正直不肯從邪，故為王所怨。○傳“類，善。殄，盡。瘁，病”。○正義曰：皆《釋詁》文。○箋“吊至”至“困病”。○正義曰：“吊，至”，《釋詁》文。此經與上義相配成天，刺神不福，皆由政惡所致。以王之為政，德不至於天，故天以刺之。不能致徵祥於神，故神不福之。威儀有不善於朝廷，故相與怨忌。" }
      - { type: j, text: "天之降罔，維其優矣。人之雲亡，心之憂矣。優，渥也。箋雲：優，寬也。天下羅罔以取有罪亦甚寬，謂但以災異譴告之，不指加罰於其身。疾王為惡之甚，賢者奔亡，則人心無不憂。○渥，於角反。譴，棄戰反。" }
      - { type: j, text: "天之降罔，維其幾矣。人之雲亡，心之悲矣。幾，危也。箋雲：幾，近也。言災異譴告離人身近，愚者不能覺。○離，力智反。" }
      - { type: z, text: "“天之”至“悲矣”。毛以為，上既言天刺責王，賢人將去，此又言其可憂之狀。天之所下此災異之羅網，維其僥渥而多矣。賢人之言皆雲已欲亡去。我天下之人其心為之憂愁矣。又丁寧言之，天之所下災異之羅網，維其危險而甚矣，賢人之言皆雲欲亡去，我天下之人其心為之悲哀矣。○鄭唯以優為寬、幾為近為異。餘同。○傳“優，渥”。○正義曰：以優為優饒之義，故為渥也。《信南山》雲：“既優既渥。”是優渥為豐多之意也。○箋“優寬”至“不憂”。○正義曰：以“天之降罔”，是羅網寬廣優饒者，寬容之義，故易傳以優為寬。天下羅網，以取有罪，正謂欲取王也。不指害其身，而微加譴告，是其寬也。。○傳“幾，危”。○正義曰：《釋詁》文。上言優者，謂自天降而多也。此言幾者，謂至人身而危。二者相接成也。○箋“幾，近”。○正義曰：《釋詁》文。上寬者，謂微加譴告，告而不改，則禍及其身，故離人近。二者亦相接成，但以忠臣諫君，宜稱禍近為切，故易傳也。" }
      - { type: j, text: "觱沸檻泉，維其深矣。心之憂矣，寧自今矣？不自我先，不自我後。箋雲：檻泉正出，湧出也。觱沸，其貌。湧泉之源，所由者深，喻己憂所從來久也。惡政不先己，不後己，怪何故正當之。○觱音必。沸音弗。觱沸，泉出貌。檻，胡覽反，徐音下斬反。藐藐昊天，無不克鞏。藐藐，大貌。鞏固也。箋雲：藐藐，美也。王者有美德藐藐然，無不能自堅固於其位者，微箴之也。○藐，亡角反。鞏，九勇反。箴，之林反。" }
      - { type: j, text: "無忝皇祖，式救爾後。箋雲：式，用也。後，謂子孫也。" }
      - { type: z, text: "“觱沸”至“爾後”。○正義曰：言觱沸然而湧出者，檻泉也。此泉濆湧而出，言其所從來維其深遠矣。喻天下之人心之憂悲，亦所由來久遠，寧從今日矣！我之所憂，憂此惡政。怨恨何故不從我之先，何故不從我之後，而正當我之身也？既言王政之惡，故以箴王。言人君有美大之德藐藐然，可以比於昊天，則無不能堅固於其位者。是守位者必由美德也。王當美德固之，無使辱汝君祖之先王，用此美德，以救汝後世之子孫，使之保守王位，無喪邦國也。○箋“檻泉正出，湧出”。○正義曰：《釋水》文也。李巡曰：“水泉從下上出曰湧泉。”○傳“藐藐”至“鞏固”。○正義曰：《釋詁》雲：“藐藐，美也。”言大貌者，為美大之貌也。“鞏，固”，《釋詁》文。○箋“王者”至“箴之”。○正義曰：下雲“無忝皇祖”，則知能固者，謂能固其王位也。不直言無德則不能固，而云有美德者無不能固，反言以見意，而文不指斥，是微箴之也。" }
      - { type: j, text: "《瞻卬》七章，三章章十句，四章章八句。" }
      - { type: j, text: "《召旻》，凡伯刺幽王大壞也。旻，閔也，閔天下無如召公之臣也。旻，病也。○召旻，上時照反，下密巾反。下同。" }
      - { type: z, text: "“《召旻》七章，上四章章五句，下三章章七句”至“之臣”。○正義曰：《召旻》詩者，周卿士凡國之伯所作，以刺幽王大壞也。又解名篇之義，是閔傷當時天下無如文、武之世召康公之臣。以時無賢臣，深可痛傷，故以《召旻》名篇。其敘大壞之意，經七章皆大壞之事也。首章曰“旻天疾威”，卒章雲“有如召公”，雖有召旻之字，而其文不次，作者錯綜以名篇，故《敘》特解經之旻天，自由天之閔下，以旻為天名，此《敘》轉為閔，箋訓為病，則與旻天之義其意小乖，是借名以見意，作者指言旻天，為此故也。先王佐命之臣，能開闢土地者蓋多矣，而獨言召公者，作者意所欲言，無他義也。" }
      - { type: j, text: "旻天疾威，天篤降喪。瘨我饑饉，民卒流亡。箋雲：天，斥王也。疾，猶急也。瘨，病也。病乎幽王之為政也，急行暴虐之法，厚下喪亂之教，謂重賦稅也。病中國以饑饉，令民盡流移。○瘨，都田反，沈又音殄，又音田。令，力呈反。一本作“令故民”。" }
      - { type: j, text: "我居圉卒荒。圉，垂也。箋雲：荒，虛也。國中至邊竟以此故盡空虛。○圉，魚呂反。竟音境，本亦作“境”。" }
      - { type: z, text: "“旻天”至“卒荒”。○正義曰：言比旻天之王者，其為政教乃急疾而行此威虐之法。比天之王者，又厚下與民喪亂之教，而病害我國中以饑饉，令國中之民盡流移而散亡。以此故令我所居中國至於四境邊陲，民皆逃散而盡空虛，是王暴虐所致之。○箋“天斥”至“流移”。○正義曰：箋以此詩刺王大壞，而承以饑饉流亡，明是王使之然。於文勢非言上天，故以天為斥王，旻天亦斥王也，故箋即言“幽王之為政，急行暴虐之法，厚下喪亂之教”。以幽王文總二事，是經之二天皆斥王也。《小旻》雲：“旻天疾威。”文與此同。彼箋雲：“旻天之德，疾王者以刑罰威恐萬民。”則以天為上天，疾為疾惡。而此不然者，以此下雲“天降罪罟”，承以“蟊賊內訌”。內訌是人自潰亂，非上天降之。文與下相類，故知疾威、降喪亦是王自行之，非天疾王，非天降之也。《小旻》之文連“敷於下土”，佈政下土是王之所為，明天以是故疾惡於王。觀文而說，故與此異。《蕩》之“疾威”，與此不同，義亦然也。急行暴虐之法，厚下喪亂之教，所以為異者，以二句相連，疾與篤為類，則威為酷刑罰，喪為亂亡賦稅則。急者行之必速之辭，厚者為之加重之稱，則二者俱急而且重也。但以言疾則為行之理已著，言篤直是厚而近為行之理未彰，故又言降以見之。因此，故下單言“天降”以配而成句也，其實天與旻天俱斥王耳。箋又總解暴虐、喪亂之事，正謂重賦斂，病中國以饑饉，令盡流移也。○傳“圉，垂”。○正義曰：《釋詁》文。○箋“荒虛”至“空虛”。○正義曰：“荒，虛”，《釋詁》文。某氏曰：“《周禮》雲：野荒民散則削之。”唯某氏之本有荒字耳，其諸家《爾雅》則無之。要《周禮》野荒必是虛之義也。居謂城中所居之處，圉謂邊境，以此故盡空虛以謂虐政故也。" }
      - { type: j, text: "天降罪罟，蟊賊內訌。訌，潰也。箋雲：訌，爭訟相陷入之言也。王施刑罪，以羅罔天下眾為殘酷之人，雖外以害人，又自內爭相讒惡。○訌，戶工反，徐雲：“鄭音工。”爭，爭鬥之爭。下同，惡。烏路反。" }
      - { type: j, text: "昏椓靡共，潰潰回遹，實靖夷我邦。椓，夭椓也。潰潰，亂也。靖，謀。夷，平也。箋雲：昏椓皆奄人也。昏，其官名也。椓，椓毀陰者也。王遠賢者，而近任刑奄之人，無肯共其職事者，皆潰潰然維邪是行，皆謀夷滅王之國。○椓，丁角反。共音恭。注皆同。潰，戶對反。遹音聿，一音述。奄如字，本又作“閹”。遠，於萬反。近，附近之近。邪，似嗟反。" }
      - { type: z, text: "“天降”至“我邦”。○正義曰：上言王以暴亂病民，此又言所病之事。今比天之王者，下此刑罰羅網之法於天下，諂佞之臣又助為此刑罰殘酷。其害於人，如蟊賊之害禾稼然，又內自潰亂梠陷以罪人也。又王所親任，是刑餘之人，此昏奄椓毀之小人，無供其職事者，皆潰潰然昏亂，其行邪僻，實謀滅我王之邦國，王何故信任之？○傳“訌，潰”。○正義曰：《釋言》文。○箋“訌爭”至“讒惡”。○正義曰：傳訌潰之義，以訌字從言，故知訌者是爭訟相陷入之言。由爭訟相陷，故至潰敗，故《爾雅》以訌為潰。訌言內，則蟊賊為外，故云眾為殘酷之人，雖外以害人，又內相讒惡。言惡人所在為害，又自不相親也。“天降罪罟”，是王所下之。知“蟊賊內訌”，是臣之眾殘酷之人為之者，以訌是相惡之言，若亦王所下之，不得言其相惡，故知臣之佞者，助王以殘酷害人，又內自相讒惡也。○傳“椓夭”至“夷平”。○正義曰：傳意亦以椓為去陰，但以《正月》雲“天夭是椓”，夭謂夭殺。椓謂椓破，夭椓文連，故並舉其類以曉人。潰潰，昏亂之意，故為亂也。“靖，謀”，《釋詁》文。“夷、平，易也”，俱訓為易，是夷得為平，言平殄而滅之。○傳“昏椓”至“王之國”。○正義曰：解名此人為昏椓之意，故云“皆奄人也”。《天官·閽人》注云：“閽人司昏晨以啟閉者。”是“昏，其官名也”。“椓，椓毀陰者”，為犯淫罪而刑之也。《書傳》曰：“男女不以禮交者，其刑宮。”《秋官·司刑》注云：“宮者，丈夫則割其勢，女子閉於宮中。”此椓毀其陰，即割勢是也。謂之奄者，《天官·酒人》注云：“奄，精氣閉藏者。”引《月令》“其器閎以奄”，是由割去其勢，精氣閉藏，故謂之奄人也。若然，《秋官·掌戮》雲：“墨者使守門。”《閽人》之注引《掌戮》之文，則閽人乃是墨者，非奄人矣。而此箋以昏為奄者，案《周禮·序官》閽人上有內小臣，下有寺人。內小臣之與寺人，皆是奄人為之，閽人與之為類，官居其閒，則亦奄人也。《閽人》雲：“王宮每門四人。囿游亦如之。”注云：“囿，禁院也。游，離宮也。”然則王宮之與囿游，所守門者，其官皆曰閽人，是閽之用人，非獨奄也。《掌戮》“墨者使守門，宮者使守內，刖者使守囿”。則墨、刖皆亦為閽，非獨宮刑者矣。但內門則用奄以守之，其外門則用墨耳。《閽人職》曰：“掌守王宮之中門之禁。”注云：“中門於外、內為中。天子五門，雉門為中門。”是雉門以內用奄，庫門以外用墨，其囿則用刖也。官與寺人為類，主以奄者為名。《月令》：“仲冬，命奄尹審門閭，謹房室。”是門房之守，皆奄為之，故知閽是奄人之官名也。奄者防守門閣，親近人主。凡庸之君，闇於善惡，以其少小慣習，朝夕給使，顧訪無猜憚之心，恩狎有可悅之色。且其人久處宮掖，頗曉舊章，常近床第，探知主意。或乃色和貌厚，挾術懷奸；或乃捷對敏才，飾巧亂實。於是邪正並行，情貌相越，遂能迷罔視聽，因惑愚主，謂其智足匡時，忠能輔國，信而使之，親而任之，國之滅亡，多由此作。故詩人責王遠賢者而近刑奄之人也。原其本心，不欲滅國，但所謀不當，滅國之道也，故謂之謀滅王國也。" }
      - { type: j, text: "皋皋訿訿，曾不知其玷。皋皋，頑不知道也。訿訿，窳不供事也。箋雲：玷，缺也。王政已大壞，小人在位，曾不知大道之缺。○皋音羔，《爾雅》雲：“刺素食也。”訿音紫，《爾雅》雲：“莫供職也。”玷，丁簟反。窳音庾。裴駰雲：“病也。”《說文》雲：“懶也。”一本又作“眾”。" }
      - { type: j, text: "兢兢業業，孔填不寧，我位孔貶。貶，隊也。箋雲：兢兢，戒也。業業，危也。天下之人，戒懼危怖甚久矣，其不安也，我王之位，又甚隊矣。言見侵侮，政教不行。後犬戎伐之，而周與諸侯無異。○業如字，一音五答反。貶，彼檢反。隊，直類反，又作“墜”。" }
      - { type: z, text: "“皋皋”至“孔貶”。○正義曰：上言小人為謀，將滅王國。此言其致滅之狀。小人在位，皋皋然志識頑鈍而不知治道，訿訿然在公窳惰而不供職事。心頑力惰，自以為宜。王政已壞，曾不知其大道之玷缺也。臣既如此，害及天下，故今時之人皆兢兢而戒懼，業業然而危怖甚久矣。天下不安，言不安已久矣。民既不安，其我王之位又甚貶退，言其卑微與諸侯無異也。○傳“皋皋”至“供事”。○正義曰：《釋訓》雲：“皋皋、琄琄，刺素食也。”舍人曰：“皋皋，不治之貌。”某氏曰：“無德而空食祿也。”無德不治而空食祿，是頑不知其道也。《釋訓》又云：“翕翕、訿訿，莫供職也。”是訿訿為窳不供其職也。《說文》雲：“窳，懶也。”草木皆自豎立，唯瓜瓠之屬臥而不起，似若懶人常臥室，故字從宀，音眠。" }
      - { type: j, text: "如彼歲旱，草不潰茂，如彼棲苴。潰，遂也。苴，水中浮草也。箋雲：“潰茂”之“潰”當作“匯”。匯，茂貌。王無恩惠於天下，天下之人如旱歲之草，皆枯槁無潤澤，如樹上之棲苴。○潰，毛戶對反，鄭作“匯”音謂。棲音西，謂棲息也。苴，鋤如反。槁，口老反。" }
      - { type: j, text: "我相此邦，無不潰止。箋雲：潰，亂也。無不亂者，言皆亂也。《春秋傳》曰：“國亂曰潰，邑亂曰叛。”○相，息亮反。" }
      - { type: z, text: "“如彼”至“潰止”。○毛以為，言王無恩於民，致使下民如彼歲之大旱，其草不得申遂而盛茂，致使此草如彼水上棲止逐流之浮苴也。旱歲之草，如水上之苴，言其枯槁無潤。下民不得王恩，亦如是也。民不見德，禍亂將起，詩人閔之，言我視此王之邦國無有不亂，止言其必將亂也。後犬戎殺王，是此言之信。○鄭唯以潰為匯、棲苴謂樹上為異。餘同。○傳“潰遂”至“浮草”。○正義曰：草之生，當遂其生長之性。今言“草不潰茂”，故以潰為遂。苴是草之枯槁逐水流者，故云：“苴，水中之浮草。”如是，則棲為浮義，謂棲息於水上也。○箋“潰茂”至“棲苴”。○正義曰：潰茂連文，以潰為遂，於義不安，故易傳言“潰當作匯”。如《易·泰卦》“拔茅以匯”之字，匯是茂盛之貌也。箋不直言“潰當作匯”，而云“潰茂”之“潰”當作“匯”者，以下有“無不潰止”，嫌亦為匯，故連茂言之。又以棲者，居在木上之名，謂水上為棲，理亦不愜，故以為如樹上之棲苴。苴是草木之枯槁者，故在樹未落及已落為水漂皆稱苴也，此經再雲“如”者，言民如旱草，草又如苴，見其枯槁之極，喻王無恩之甚也。○箋“春秋”至“曰叛”。○正義曰：僖四年《公羊傳》文也。引之者，證邦潰為國亂之意也。" }
      - { type: j, text: "維昔之富不如時。往者富仁賢，今也富讒佞。箋雲：富，福也。時，今時也。維今之疚不如茲。今則病賢也。箋雲：茲，此也。此者，此古昔明王。○疚音救，病也，字或作“{宀久}”。彼疏斯粺，胡不自替？職兄斯引。彼宜食疏，今反食精粺。替，廢。況，茲也。引，長也。箋雲：疏，粗也，謂糲米也。職，主也。彼賢者祿薄食粗，而此昏椓之黨反食精粺。女小人耳，何不自廢退，使賢者得進？乃茲復主長此為亂之事乎？責之也。米之率：糲十，粺九，鑿八，侍御七。○粺，皮賣反。兄音況。下同。糲，蘭末反，沈音賴，又音厲。復，扶又反。下回。長如字，又張丈反。率，字又作“卛”，音類，又音律，又所律反。鑿，子洛反，又音昨。《字林》雲：“糲米一斛舂為八斗。”音子沃反。" }
      - { type: z, text: "“維昔”至“斯引”。○毛以為，邦國之亂，由遠賢者而任小人，故舉明王之政以並之。言維昔明王之所富者，不如今之時。言昔時富賢人，今時富讒佞也。又言今時所以異於昔者，維今世之所病者，不如此明王，言明王富賢人，今世則病賢人，是其異於昔也。由病其賢者，故小人得進，故又責之。言彼宜食疏，今乃反食精粺之小人，由汝當路以病賢者。何不早自廢退，使賢者得進，乃復主為滋益此亂之事使更長也？言小人用事，益使亂長，故責之。○鄭唯“彼疏斯粺”為異。餘同。○傳“彼宜”至“引長”。○正義曰：以小人為彼，故云彼宜食疏，今食精粺。言其富小人也。“替，廢”，《釋言》文。《爾雅》之訓況為賜也。賜小人之物，使之益多，故以況為滋，滋又為益。“引，長”，《釋詁》文。○箋“疏粗”至“御七”。○正義曰：以疏封粺，則粗於粺也。粗於粺者，唯糲米耳，故知謂糲米也。“職，主”，《釋詁》文。以疏粺文稱彼此，則有相形之勢。上文責王病賢者富小人，則此亦相對，不得為一人，故易傳以賢者食粗，昏椓之黨食精也。“職況斯引”，職訓之為主。茲，此。引，長。言主為益此，使亂之長，故便而倒之雲：“乃茲復主長此為亂之事，責之也。”言“米之率：糲十，粺九，鑿八，侍御七”者，其術在《九章》粟米之法。彼雲：“粟率五十，糲米三十，粺二十七，鑿二十四，御二十一。”言粟五升，為糲米三升。以下則米漸細，故數益少。四種之米，皆以三約之，得此數也。言此，明糲粗於粺，故為疏也。" }
      - { type: j, text: "池之竭矣，不雲自頻？頻，厓也。箋雲：頻，當作“濱”。厓，猶外也。自，由也。池水之溢，由外灌焉。今池竭，人不言由外無益者與？言由之也。喻王猶池也，政之亂，由外無賢臣益之。○頻，舊雲毛如字，鄭作“濱”，音賓，俱雲厓也。案張揖《字詁》雲：“瀕，今濱。”則瀕是古濱字者。與音餘。泉之竭矣，不雲自中？泉水從中以益者也。箋雲：泉者，中水生則益深，水不生則竭。喻王猶泉也，政之亂，又由內無賢妃益之。" }
      - { type: j, text: "溥斯害矣，職兄斯弘，不烖我躬。箋雲：溥，猶徧也。今時徧有此內外之害矣，乃茲復主大此為亂之事，是不烖王之身乎？責王也。烖謂見誅伐。○溥音普。烖音災。徧音遍。下同。" }
      - { type: z, text: "“池之”至“我躬”。○正義曰：既言小人在朝，又傷王無輔助。言人見池水之竭盡矣，豈不言云由其外之濱厓無水以益之故也？以喻人見王政之喪亂矣，豈不言曰由其外之群臣無賢以佐之故也？人見泉水之枯竭矣，豈不言由其內之地中無水以生之故也？以喻人見王政危亂矣，豈不言曰由其內之妃後無德以助之故也？今王內無賢后，外無賢臣，溥徧有此內外無賢之害矣，而任政小人乃復主益此亂，使之更大亂漸益大，豈得不災害我身乎？言其必將害之。○箋“頻當”至“益之”。○正義曰：以水厓之濱，其字不應作頻，故破之也。傳作頻者，蓋以古多假借，或通用故也。池者，穿地引水。《家語》曰：“池水之大，魚鱉生焉，萑葦長焉，誰知其非泉也？”是池由自外引水而為之，故云“池水之益，由外灌焉”。上章刺王遠賢，故知以池竭喻外無賢臣益之也。既以池竭外無益以喻外無賢臣，故知下經以泉竭內無益以喻無賢妃也。" }
      - { type: j, text: "昔先王受命，有如召公，日闢國百里；今也日蹙國百里，闢，開。蹙，促也。箋雲：先王受命，謂文王、武王時也。召公，召康公也。言“有如”者，時賢臣多，非獨召公也。今，今幽王臣。○闢音闢。蹙，子六反。" }
      - { type: j, text: "於乎哀哉！維今之人，不尚有舊？箋雲：哀哉，哀其不高尚賢者，尊任有舊德之臣，將以喪亡其國。○喪，息浪反。" }
      - { type: z, text: "“昔先王”至“有舊”。○正義曰：言日闢、日蹙，甚言之耳。不得一日之間，便有百里之校。於“蹙國”之上不言無賢臣者，以“不尚有舊”事見於下，故空其文，以下句互而知之。" }
      - { type: j, text: "《召旻》七章，四章章五句，三章章七句。" }
      - { type: j, text: "《蕩之什》十一篇，九十二章，七百六十九句。" }
      - { type: j, text: "《毛詩正義》" }
