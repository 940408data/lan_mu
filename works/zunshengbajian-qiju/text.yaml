# 遵生八箋 卷七 起居安樂箋：點校中導覽（teaser）
# 原文據識典古籍四庫全書本，標點自施；導語/解讀為 AI 原創
sections:
  - id: qiju
    name: 起居安樂箋
    blocks:
      - type: j
        text: 起居安樂箋
      - type: z
        text: 導：此箋論起居日用之宜，以「安」「遵」二字為樞：安所過、遵所生，則無日不自得。薦語：樂天知命、休休焉自得。
      - type: j
        text: 高子曰：人能安所過而遵所生，不以得失役吾心，不以榮辱勞吾形，浮沉自如，樂天知命，休休焉無日而不自得也，是非安樂之機哉？
      - type: z
        text: 讀：得失榮辱不役心勞形，安樂不假外求——此箋之綱領。
      - type: j
        text: 若彼偃仰時尚，奔走要塗，遂使當食忘味，當臥忘寢。禍患之機乘之矣，可不知所戒哉！
      - type: z
        text: 讀：食忘味、臥忘寢，皆由心為外物所役；一「戒」字收束，警切。
