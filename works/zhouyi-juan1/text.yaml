# 周易正義卷一（孔穎達疏）：j 為經文＋王弼注，z 為正義疏文。
sections:
  - id: juan1
    name: 卷一
    blocks:
      - { type: j, text: "乾下乾上。乾：元、亨、利、貞。" }
      - { type: z, text: "正義曰：“乾”者，此卦之名。謂之卦者，《易緯》云：“卦者掛也，言縣掛物象，以示於人，故謂之卦。”但二畫之體，雖象陰陽之氣，未成萬物之象，未得成卦，必三畫以象三才，寫天、地、雷、風、水、火、山、澤之象，乃謂之卦也。故系辭云“八卦成列，象在其中矣”是也。但初有三畫，雖有萬物之象，於萬物變通之理，猶有未盡，故更重之而有六畫，備萬物之形象，窮天下之能事，故六畫成卦也。此乾卦本以象天，天乃積諸陽氣而成天，故此卦六爻皆陽畫成卦也。此既象天，何不謂之天，而謂之“乾”者？天者定體之名，“乾”者體用之稱。故《說卦》云：“乾，健也”。言天之體，以健為用。聖人作《易》本以教人，欲使人法天之用，不法天之體，故名“乾”，不名天也。天以健為用者，運行不息，應化無窮，此天之自然之理，故聖人當法此自然之象而施人事，亦當應物成務，云為不已，“終日乾乾”，無時懈倦，所以因天象以教人事。於物象言之，則純陽也，天也。於人事言之，則君也。父也。以其居尊，故在諸卦之首，為《易》理之初。但聖人名卦，體例不同，或則以物象而為卦名者，若否、泰、剝、頤、鼎之屬是也，或以象之所用而為卦名者，即乾、坤之屬是也。如此之類多矣。雖取物象，乃以人事而為卦名者，即家人、歸妹、謙、履之屬是也。所以如此不同者，但物有萬象，人有萬事，若執一事，不可包萬物之象；若限局一象，不可總萬有之事，故名有隱顯，辭有踳駁，不可一例求之，不可一類取之。故《系辭》云：“上下無常，剛柔相易，不可為典要。”韓康伯注云“不可立定準”是也。“元、亨、利、貞”者，是乾之四德也。子夏傳云：“元，始也。亨，通也。利，和也。貞，正也。”言此卦之德，有純陽之性，自然能以陽氣始生萬物而得元始亨通，能使物性和諧，各有其利，又能使物堅固貞正得終。此卦自然令物有此四種使得其所，故謂之四德：言聖人亦當法此卦而行善道，以長萬物，物得生存而為“元”也。又當以嘉美之事，會合萬物，令使開通而為“亨”也。又當以義協和萬物，使物各得其理而為“利”也。又當以貞固幹事，使物各得其正而為“貞”也。是以聖人法乾而行此四德，故曰“元、亨、利、貞”。其委曲條例，備在《文言》。" }
      - { type: j, text: "初九：潛龍勿用。《文言》備矣。" }
      - { type: z, text: "正義曰：居第一之位，故稱“初”；以其陽爻，故稱“九”。潛者，隱伏之名；龍者，變化之物。言天之自然之氣起於建子之月，陰氣始盛，陽氣潛在地下，故言“初九潛龍”也。此自然之象，聖人作法，言於此潛龍之時，小人道盛，聖人雖有龍德，於此時唯宜潛藏，勿可施用，故言“勿用”。張氏云：“以道未可行，故稱‘勿用’以誡之。”於此小人道盛之時，若其施用，則為小人所害。寡不敵眾，弱不勝強，禍害斯及，故誡“勿用”。若漢高祖生於暴秦之世，唯隱居為泗水亭長，是勿用也。諸儒皆以為舜始漁於雷澤。舜之時，當堯之世，堯君在上，不得為小人道盛。此“潛龍”始起，在建子之月，於義恐非也。第一位言“初”，第六位當言“終”；第六位言“上”，第一位當言“下”。所以文不同者，莊氏云：“下言初則上有末義。”故《大過·彖》云：“棟橈，本末弱。”是上有末義“六”言“上”，則“初”當言“下”。故《小象》云：“潛龍勿用，陽在下也。”則是初有下義，互文相通，義或然也。且第一言“初”者，欲明萬物積漸，從無入有，所以言初不言一與下也。六言“上”者，欲見位居卦上，故不言六與末也。此初九之等，是乾之六爻之辭，但乾卦是陽生之世，故六爻所述，皆以聖人出處託之，其餘卦六爻，各因象明義，隨義而發，不必皆論聖人。他皆仿此。謂之“爻”者，《系辭》云：“爻也者，效此者也。”聖人畫爻，以仿效萬物之象。先儒云，後代聖人以《易》佔事之時，先用蓍以求數，得數以定爻，累爻而成卦，因卦以生辭，則蓍為爻卦之本，爻卦為蓍之末。今案：《說卦》云：“聖人之作《易》也，幽贊於神明而生蓍，三天兩地而倚數，觀變於陰陽而立卦，發揮於剛柔而生爻。”《系辭》云：“成天下之亹亹者，莫大乎蓍龜。是故天生神物，聖人則之。”又《易乾鑿度》云：“垂皇策者犧。”據此諸文，皆是用蓍以求卦。先儒之說，理當然矣。然陽爻稱“九”，陰爻稱“六”，其說有二：一者《乾》體有三畫，《坤》體有六畫，陽得兼陰，故其數九，陰不得兼陽，故其數六。二者老陽數九，老陰數六，老陰老陽皆變，《周易》以變者為佔，故杜元凱注襄九年《傳》遇《艮》之八，及鄭康成注《易》，皆稱《周易》以變者為佔，故稱九、稱六。所以老陽數九，老陰數六者，以揲蓍之數，九遇揲則得老陽，六遇揲則得老陰，其少陽稱七，少陰稱八，義亦准此。張氏以為陽數有七有九，陰數有八有六，但七為少陽，八為少陰，質而不變，為爻之本體。九為老陽，六為老陰，文而從變，故為爻之別名。且七既為陽爻，其畫已長。今有九之老陽，不可復畫為陽，所以重錢，避少陽七數，故稱九也。八為陰數而畫陰爻，今六為老陰，不可復畫陰爻。故交其錢，避八而稱六。但《易》含萬象，所託多塗，義或然也。" }
      - { type: j, text: "九二：見龍在田，利見大人。出潛離隱，故曰“見龍”，處於地上，故曰“在田”。德施周普，居中不偏，雖非君位，君之德也。初則不彰，三則“乾乾”，四則“或躍”，上則過亢。“利見大人”，唯二、五焉。" }
      - { type: z, text: "“九二”至“利見大人”。○正義曰：陽處二位，故曰“九二”。陽氣發見，故曰“見龍”。田是地上可營為有益之處，陽氣發在地上，故曰“在田”。且一之與二，俱為地道，二在一上，所以稱“田”。“見龍在田”，是自然之象。“利見大人”，以人事託之，言龍見在田之時，猶似聖人久潛稍出，雖非君位而有君德，故天下眾庶利見九二之“大人”。故先儒云：若夫子教於洙泗，利益天下，有人君之德，故稱“大人”。案：《文言》云：“九二德博而化。”又云：“君德也。”王輔嗣注云：“雖非君位，君之德也。”是九二有人君之德，所以稱“大人”也。輔嗣又云：“利見大人，唯二五焉。”是二之與五，俱是“大人”，為天下所“利見”也。而褚氏、張氏同鄭康成之說，皆以為九二利見九五之大人，其義非也。且“大人”之云，不專在九五與九二，故《訟卦》云：“利見大人。”又《蹇卦》：“利見大人。”此“大人”之文，施處廣矣，故輔嗣注謂九二也。是“大人”非專九五。○注“處於地上”至“唯二五焉”。○正義曰：“處於地上，故曰在田”者，先儒以為重卦之時，重於上下兩體，故初與四相應，二與五相應，三與上相應。是上下兩體，論天地人各別，但《易》含萬象，為例非一。及其六位，則一、二為地道，三、四為人道，五、上為天道。二在一上，是九二處其地上，所田食之處，唯在地上，所以稱“田”也。觀輔嗣之注意，唯取地上稱田，諸儒更廣而稱之，言田之耕稼利益，及於萬物，盈滿有益於人，猶若聖人益於萬物，故稱“田”也。“德施周普”者，下《小象》文，謂周而普遍。“居中不偏”者，九二居在下卦之中，而於上於下，其心一等，是“居中不偏”也。不偏則周普也。“雖非君位”者，二為大人，己居二位，是非君位也。“君之德”者，以德施周普也。《文言》云：“德博而化。”又云：“君德也。”是九二有人君之德也。“初則不彰”者，謂潛隱不彰顯也。“三則乾乾”者，危懼不安也。“四則或躍”者，謂進退懷疑也。“上則過亢”，過謂過甚，亢謂亢極。“利見大人，唯二五焉”者，言範模乾之一卦，故云“唯二五焉”。於別卦言之，非唯二五而己。故訟卦、蹇卦並云“利見大人”，所以施處廣，非唯二五也。諸儒以為九二當太蔟之月，陽氣發見，則九三為建辰之月，九四為建午之月，九五為建申之月，為陰氣始殺，不宜稱“飛龍在天”。上九為建戌之月，群陰既盛，上九不得言“與時偕極”。於此時陽氣僅存，何極之有？諸儒此說，於理稍乖。此乾之陽氣漸生，似聖人漸出，宜據十一月之後。至建巳之月已來，此九二當據建醜、建寅之間，於時地之萌牙初有出者，即是陽氣發見之義。乾卦之象，其應然也。但陰陽二氣，共成歲功，故陰興之時，仍有陽在，陽生之月，尚有陰存。所以六律六呂，陰陽相間，取象論義，與此不殊。乾之初九，則與復卦不殊。乾之九二，又與臨卦無別。何以復、臨二卦與此不同者，但《易》論象，復、臨二卦，既有群陰見象於上，即須論卦之象義，各自為文。此乾卦初九、九二，只論居位一爻，無群陰見象，故但自明當爻之地，為此與臨、復不同。" }
      - { type: j, text: "九三：君子終日乾乾，夕惕若厲，無咎。處下體之極，居上體之下，在不中之位，履重剛之險。上不在天，未可以安其尊也。下不在田，未可以寧其居也。純脩下道，則居上之德廢；純脩上道，則處下之禮曠。故“終日乾乾”，至於夕惕猶若厲也。居上不驕，在下不憂，因時而惕，不失其幾，雖危而勞，可以“無咎”。處下卦之極，愈於上九之亢，故竭知力而後免於咎也。乾三以處下卦之上，故免亢龍之悔。坤三以處下卦之上，故免龍戰之災。" }
      - { type: z, text: "“九三君子”至“夕惕若厲無咎”。○正義曰：以陽居三位，故稱“九三”；以居不得中，故不稱“大人”；陽而得位，故稱君子。在憂危之地，故“終日乾乾”，言每恆終竟此日，健健自強，勉力不有止息。“夕惕”者，謂終竟此日後，至向夕之時，猶懷憂惕。“若厲”者，若，如也；厲，危也。言尋常憂懼，恆如傾危，乃得無咎。謂既能如此戒慎，則無罪咎，如其不然，則有咎。故《系辭》云：“無咎者，善補過也。”此一爻，因陽居九三之位，皆以人事明其象。○注“處下體之極”至“免龍戰之災”。○正義曰：“處下體之極”者，極，終也。三是上卦之下，下體之極，故云“極”也。又云：“居上體之下”者，四、五與上是上體，三居四下，未入上體，但居上體之下，四則已入上體，但居其上體之下，故九四注云“居上體之下”，與此別也。云“履重剛之險”者，上下皆有陽爻，剛強好為險難，故云“履重剛之險”。云“上不在天，未可以安其尊”者，若在天位，其尊自然安處，在上卦之下，雖在下卦之上，其尊未安，故云“未可以安其尊”也。“下不在田，未可以寧其居”者，田是所居之處，又是中和之所，既不在田，故不得安其居。“純脩下道，則居上之德廢”者，言若純脩下道以事上卦，則己居下卦之上，其德廢壞，言其太卑柔也。“純脩上道，則處下之禮曠”者，曠謂空曠，言已純脩居下卦之上道以自驕矜，則處上卦之下，其禮終竟空曠。“夕惕猶若厲也”者，言雖至於夕，恆懷惕懼，猶如未夕之前，當若厲也。案：此卦九三所居之處，實有危厲。又《文言》云：“雖危無咎。”是實有危也。據其上下文勢，“若”字宜為語辭，但諸儒並以“若”為“如”，如似有厲，是實無厲也，理恐未盡。今且依“如”解之。“因時而惕，不失其幾”者，“因時”謂因可憂之時，故《文言》云“因時而惕”，又云“知至至之，可與幾也”。是“因時而惕，不失其幾”也。“雖危而勞”者，“若厲”是“雖危”，“終日乾乾”是“而勞”也。“故竭知力而後免於咎”者，王以九三與上九相併，九三處下卦之極，其位猶卑，故竭知力而得免咎也。上九在上卦之上其位極尊，雖竭知力，不免亢極，言下勝於上，卑勝於尊。" }
      - { type: j, text: "九四：或躍在淵，無咎。去下體之極，居上體之下，乾道革之時也。上不在天，下不在田，中不在人，履重剛之險，而無定位所處，斯誠進退無常之時也。近乎尊位，欲進其道，迫乎在下，非躍所及。欲靜其居，居非所安，持疑猶豫未敢決志。用心存公，進不在私，疑以為慮，不謬於果，故“無咎”也。" }
      - { type: z, text: "“九四：或躍在淵，無咎”。○正義曰：“或，疑也。躍，跳躍也。言九四陽氣漸進，似若龍體欲飛，猶“疑或”也。躍於在淵，未即飛也。此自然之象，猶若聖人位漸尊高欲進於王位，猶豫鷃疑，在於故位，未即進也。云：“無咎”者，以其鷃疑進退，不即果敢以取尊位，故“無咎”也。若其貪利務進，時未可行而行，則物所不與，故有咎也。若周西伯內執王心，外率諸侯以事紂也。○注“去下體之極”至“無咎也”。○正義曰：“去下體之極”者，離下體入上體，但在下體之上，故云“去下體之極”。注九三云“處下體之極”，彼仍處九三，與此別也。云“乾道革之時”者，革，變也。九四去下體入上體，是乾道革之時。云“上不在天，下不在田，中不在人”者，《易》之為體，三與四為人道，人近在下不，近於上，故九四云“中不在人”，異於九三也。云“而無定位所處”者，九四以陽居陰上，既不在於天，下復不在於地，中又不當於人，上下皆無定位所處也。“斯誠進退無常之時”者，《文言》云“上下無常”、“進退無恆”是也。“欲進其道，迫乎在下，非躍所及”者，謂欲進已聖道而居王位，但逼迫於下，群眾未許，非己獨躍所能進及也。“欲靜其居，居非所安，持疑猶豫，未敢決志”者，謂志欲靜其居處，百姓既未離禍患，須當拯救，所以不得安居，故遲疑猶豫，未敢決斷其志而苟進也。“用心存公，進不在私”者，本為救亂除患，不為於己，是進不在私也。“疑以為慮，不謬於果”者，謬謂謬錯，果謂果敢；若不思慮，苟欲求進，當錯謬於果敢之事，而致敗亡；若疑惑以為思慮，則不錯謬於果敢之事。其錯謬者，若宋襄公與楚人戰而致敗亡是也。" }
      - { type: j, text: "九五：飛龍在天，利見大人。不行不躍而在乎天，非飛而何？故曰“飛龍”也。龍德在天，則大人之路亨也。夫位以德興，德以位敘，以至德而處盛位，萬物之睹，不亦宜乎？" }
      - { type: z, text: "“九五”至“利見大人”。○正義曰：言九五陽氣盛至於天，故云“飛龍在天”。此自然之象，猶若聖人有龍德飛騰而居天位，德備天下，為萬物所瞻睹，故天下利見此居王位之大人。○注“龍德在天”。○正義曰：“龍德在天，則大人之路亨”，謂若聖人有龍德居在天位，則大人道路得亨通。猶若文王拘在羑里，是大人道路未亨也。“夫位以德興”者，位謂王位，以聖德之人能興王位也。“德以位敘”者，謂有聖德之人，得居王位，乃能敘其聖德。若孔子雖有聖德，而無其位，是德不能以位敘也。" }
      - { type: j, text: "上九：亢龍有悔。" }
      - { type: z, text: "正義曰：上九亢陽之至，大而極盛，故曰“亢龍”。此自然之象，以人事言之，似聖人有龍德，上居天位，久而亢極，物極則反，故“有悔”也。純陽雖極，未至大凶，但有悔吝而己。《系辭》云：“悔吝者，言乎其小疵也。”故鄭引堯之末年，四凶在朝，是以有悔未大凶也。凡悔之為文，既是小疵，不單稱悔也。必以餘字配之。其悔若在，則言“有悔”，謂當有此悔，則此經是也。其悔若無，則言“悔亡”，言其悔已亡也，若《恆卦·九二》“悔亡”是也。其悔雖亡，或是更取他文結之，若《復卦·初九》“不遠復無祗悔”之類是也。但聖人至極，終始無虧，故《文言》云：“知進退存亡而不失其正者，其唯聖人乎？”是知大聖之人，本無此悔。但九五天位，有大聖而居者，亦有非大聖而居者，不能不有驕亢，故聖人設法以戒之也。" }
      - { type: j, text: "用九：見群龍，無首，吉。九，天之德也。能用天德，乃見“群龍”之義焉。夫以剛健而居人之首，則物之所不與也。以柔順而為不正，則佞邪之道也。故《乾》吉在“無首”，《坤》利在“永貞”。" }
      - { type: z, text: "“用九：見群龍，無首，吉”。○正義曰：“用九見群龍”者，此一句說“乾元”能用天德也。九，天德也。若體“乾元”，聖人能用天德，則見“群龍”之義。“群龍”之義，以無首為吉，故曰“用九，見群龍，無首，吉”也。○注“九，天之德”。○正義曰：“九，天之德”者，言六爻俱九，乃共成天德，非是一爻之九，則為天德也。" }
      - { type: j, text: "《彖》曰：大哉乾元！萬物資始，乃統天。云行雨施，品物流形，大明終始，六位時成，時乘六龍，以御天。乾道變化，各正性命。天也者，形之名也。健也者，用形者也。夫形也者，物之累也。有天之形而能永保無虧，為物之首，統之者豈非至健哉！大明乎終始之道，故六位不失其時而成，升降無常，隨時而用，處則乘潛龍，出則乘飛龍，故曰“時乘六龍”也。乘變化而御大器，靜專動直，不失大和，豈非正性命之情者邪？" }
      - { type: z, text: "“彖曰大哉乾元”至“各正性命”。○正義曰：夫子所作《彖》辭，統論一卦之義，或說其卦之德，或說其卦之義，或說其卦之名，故《略例》云：“彖者何也？統論一卦之體，明其所由之主。”案：褚氏、莊氏並云：“彖，斷也，斷定一卦之義，所以名為彖也。”但此《彖》釋乾與元、亨、利、貞之德。但諸儒所說此《彖》分解四德，意各不同。今案：莊氏之說，於理稍密，依而用之。“大哉乾元，萬物資始，乃統天”者，此三句裛釋乾與元也。“乾”是卦名，“元”是乾德之首，故以元德配乾釋之。“大哉乾元”者，陽氣昊大，乾體廣遠，又以元大始生萬物，故曰“大哉乾元”。“萬物資始”者，釋其“乾元”稱“大”之義，以萬象之物，皆資取“乾元”，而各得始生，不失其宜，所以稱“大”也。“乃統天”者，以其至健而為物始，以此乃能統領於天，天是有形之物，以其至健，能總統有形，是“乾元”之德也。“云行雨施，品物流形”者，此二句釋“亨”之德也，言乾能用天之德，使云氣流行，雨澤施布，故品類之物，流佈成形，各得亨通，無所壅蔽，是其“亨”也。“大明終始，六位時成”者，此二句總結乾卦之德也。以乾之為德，大明曉乎萬物終始之道，始則潛伏，終則飛躍，可潛則潛，可飛則飛，是明達乎始終之道，故六爻之位，依時而成。若其不明終始之道，應潛而飛，應飛而潛，應生而殺，應殺而生，六位不以時而成也。“時乘六龍，以御天”者，此二句申明“乾元”“乃統天”之義，言乾之為德，以依時乘駕六爻之陽氣，以控御於天體。六龍，即六位之龍也。以所居上下言之，謂之六位也；陽氣升降，謂之六龍也。上文以至健元始總明乾德，故云“乃統天”也。此名乘駕六龍，各分其事，故云“以御天”也。“乾道變化，各正性命”者，此二句更申明乾元資始之義。道體無形，自然使物開通，謂之為“道”。言乾卦之德，自然通物，故云“乾道”也。“變”謂後來改前，以漸移改，謂之變也。“化”謂一有一無，忽然而改，謂之為化。言乾之為道，使物漸變者，使物卒化者，各能正定物之性命。性者天生之質，若剛柔遲速之別；命者人所稟受，若貴賤夭壽之屬是也。○注“天也者形之名也”至“豈非正性命之情者邪”。○正義曰：夫形也者，物之累也。凡有形之物，以形為累，是含生之屬，各憂性命。而天地雖復有形，常能永保無虧，為物之首，豈非統用之者至極健哉！若非至健，何能使天形無累？見其無累，則知“至健”也。“乘變化而御大器”者，乘變化，則乘潛龍，飛龍之屬是也。“而御大器”，大器謂天也。乘此潛龍、飛龍而控御天體，所以運動不息，故云“而御大器”也。“靜專動直，不失大和”者，謂乾之為體，其靜住之時，則專一不轉移也，其運動之時，正直不傾邪也。故《上系辭》云：“夫乾，其靜也專，其動也直，是以大生焉。”韓康伯注云：“專，專一也。直，剛正也。”“不失大和”，則下文“保合大和”是也。“豈非正性命之情者邪”，以乾能正定物之性命，故云“豈非正性命之情者邪”，謂物之性命各有情，非天之情也。天本無情，何情之有？而物之性命，各有情也。所稟生者謂之性，隨時念慮謂之情，無識無情，今據有識而言，故稱曰“情”也。夫子為《彖》之體，斷明一卦之義，體例不同。莊氏以為凡有一十二體，今則略舉大綱，不可事事繁說。莊氏云“《彖》者發首則歎美卦”者，則此《乾·彖》云“大哉乾元”，《坤卦·彖》云“至哉坤元”。以乾、坤德大，故先歎美之，乃後詳說其義。或有先疊文解義而後歎者，則《豫卦·彖》云：“《豫》之時義大矣哉”之類是也。或有先釋卦名之義，後以卦名結之者，則《同人·彖》云“柔得位得中而應乎《乾》，曰同人”，《大有·彖》云：“柔得尊位大中而上下應之曰：“大有之例是也。或有特疊卦名而稱其卦者，則同人彖云：“《同人》曰：同人於野，亨。”注云：“‘同人於野，亨，利涉大川’，非二之所能也。是乾之所行，故特曰‘同人曰’。”此等之屬，為文不同，唯《同人》之《彖》特稱“同人曰”，注又別釋。其餘諸卦之《彖》，或詳或略，或先或後，故上下參差，體例不同，或難其解，或易略解。若一一比並，麴生節例，非聖人之本趣，恐學者之徒勞，心不曉也。今皆略而不言，必有其義，於卦下而具說。" }
      - { type: j, text: "保合大和，乃利貞。不和而剛暴。" }
      - { type: z, text: "正義曰：此二句釋“利貞”也。純陽剛暴，若無和順，則物不得利，又失其正。以能保安合會大利之道，乃能利貞於萬物，言萬物得利而貞正也。" }
      - { type: j, text: "首出庶物，萬國咸寧。萬國所以寧，各以有君也。" }
      - { type: z, text: "正義曰：自上已來，皆論乾德自然養萬物之道。此二句論聖人上法乾德，生養萬物，言聖人為君在眾物之上，最尊高於物，以頭首出於眾物之上，各置君長以領萬國，故萬國皆得寧也。人君位實尊高，故於此云首出於庶物者也。志須卑下，故前經云“無首，吉”也。但前文說乾用天德，其事既詳，故此文聖人以人事象乾，於文略也。以此言之，聖人亦當令萬物資始，統領於天位，而“云行雨施”，佈散恩澤，使兆庶眾物，各流佈其形，又大明乎盛衰終始之道，使天地四時貴賤高下，各以時而成。又任用群賢，以奉行聖化，使物各正性命。此聖人所以象乾而立化。" }
      - { type: j, text: "《象》曰：天行健，君子以自強不息。" }
      - { type: z, text: "“《象》曰天行健”至“自強不息”。○正義曰：此《大象》也。《十翼》之中第三翼，總象一卦，故謂之“大象”。但萬物之體，自然各有形象，聖人設卦以寫萬物之象。今夫子釋此卦之所象，故言“《象》曰”。天有純剛，故有健用。今畫純陽之卦以比擬之，故謂之《象》。《象》在《彖》後者，《彖》詳而《象》略也。是以過半之義，思在《彖》而不在《象》，有由而然也。“天行健”者，行者，運動之稱，健者強壯之名，“乾”是眾健之訓。今《大象》不取餘健為釋，偏說“天”者，萬物壯健，皆有衰怠，唯天運動日過一度，蓋運轉混沒，未曾休息，故云“天行健”。健是“乾”之訓也。順者“坤”之訓也。《坤》則云“地勢坤”。此不言“天行乾”而言“健”者，劉表云：“詳其名也。”然則“天”是體名，“乾”則用名，“健”是其訓，三者並見，最為詳悉，所以尊乾異於他卦。凡六十四卦，說象不同：或總舉象之所由，不論象之實體，又總包六爻，不顯上體下體，則乾、坤二卦是也。或直舉上下二體者，若“云雷，屯”，也。“天地交，泰”也。“天地不交，否”也。“雷電，噬嗑”也，“雷風，恆”也，“雷雨作，解”也，“風雷，益”也，“雷電皆至，豐”也，“洊雷，震”也，“隨風，巽”也，“習坎，坎”也，“明兩作，離”也，“兼山，艮”也，“麗澤，兌”也。凡此一十四卦，皆裛舉兩體而結義也。取兩體俱成，或有直舉兩體上下相對者，“天與水違行，訟”也，“上天下澤，履”也，“天與火同，人”也，“上火下澤，睽”也，凡此四卦，或取兩體相違，或取兩體相合，或取兩體上下相承而為卦也，故兩體相對而俱言也。雖上下二體，共成一卦，或直指上體而為文者，若“云上於天，需”也，“風行天上，小畜”也，“火在天上，大有”也，“雷出地奮，豫”也，“風行地上，觀”也，“山附於地，剝”也，“澤滅木，大過”也，“雷在天上，大壯”也，“明出地上，晉”也，“風自火出，家人”也，“澤上於天，夬”也，“澤上於地，萃”也。“風行水上，渙”也，“水在火上，既濟”也，“火在水上，未濟”也。凡此十五卦，皆先舉上象而連於下，亦意取上象以立卦名也。亦有雖意在上象，而先舉下象，以出上象者，“地上有水，比”也，“澤上有地，臨”也，“山上有澤，鹹”也，“山上有火，旅”也，“木上有水，井”也，“木上有火，鼎”也，“山上有木，漸”也，“澤上有雷，歸妹”也，“山上有水，蹇”也，“澤上有水，節”也，“澤上有風，中孚”也，“山上有雷，小過”也。凡此十二卦，皆先舉下象以出上象，亦意取上象，共下象而成卦也。或先舉上象而出下象，義取下象以成卦義者，“山下出泉，蒙”也，“地中有水，師”也，“山下有風，蠱”也，“山下有火，賁”也，“天下雷行，無妄”也，“山下有雷，頤”也，“天下有山，遯”也，“山下有澤，損”也，“天下有風，姤”也，“地中有山，謙”也，“澤中有雷，隨”也，“地中生木，升也”，“澤中有火，革”也。凡此十三卦，皆先舉上體，後明下體也。其上體是天，天與山則稱“下”也。若上體是地，地與澤則稱“中”也。或有雖先舉下象，稱在上象之下者，若“雷在地中，復”也，“天在山中，大畜”也，“明入地中，明夷”也，“澤無水，困”也。是先舉下象而稱在上象之下，亦義取下象以立卦也。所論之例者，皆大判而言之，其間委曲，各於卦下別更詳之。先儒所云此等象辭，或有實象，或有假象。實象者，若“地上有水，比”也，“地中生木，升”也，皆非虛，故言實也。假象者，若“天在山中”，“風自火出”，如此之類，實無此象，假而為義，故謂之假也。雖有實象、假象，皆以義示人，總謂之“象”也。“天行健”者，謂天體之行，晝夜不息，周而復始，無時虧退，故云“天行健”。此謂天之自然之象。“君子以自強不息”，此以人事法天所行，言君子之人，用此卦象，自彊勉力，不有止息。言“君子”者，謂君臨上位，子愛下民，通天子諸侯，兼公卿大夫有地者。凡言“君子”，義皆然也。但位尊者象卦之義多也，位卑者象卦之義少也。但須量力而行，各法其卦也，所以諸卦並稱“君子”。若卦體之義，唯施於天子，不兼包在下者，則言“先王”也。若《比卦》稱“先王以建萬國”，《豫卦》稱“先王以作樂崇德”，《觀卦》稱“先王以省方觀民設教”，《噬嗑》稱“先王以明罰敕法”，《復卦》稱“先王以至日閉關”，《無妄》稱“先王以茂對時育萬物”，《渙卦》稱“先王以享於帝立廟”，《泰卦》稱“後以財成天地之道”，《姤卦》稱“後以施命誥四方”。稱“後”兼諸侯也，自外卦並稱“君子”。" }
      - { type: j, text: "“潛龍勿用”，陽在下也。“見龍在田”，德施普也。“終日乾乾”，反覆道也。以上言之則不驕，以下言之則不憂，反覆皆道也。" }
      - { type: z, text: "“潛龍勿用”至“反覆道也”。正義曰：自此以下至“盈不可久”，是夫子釋六爻之《象》辭，謂之“小象”。以初九陽潛地中，故云“陽在下也”。經言“龍”而《象》言“陽”者，明經之稱“龍”，則陽氣也。此一爻之象，專明天之自然之氣也。“見龍在田，德施普”者，此以人事言之，用龍德在田，似聖人己出在世，道德恩施，能普遍也。《比》“初九勿用”，是其周普也。若《比》九五，則猶狹也。“終日乾乾，反覆道”者，此亦以人事言之。君子“終日乾乾”，自彊不息，故反之與覆，皆合其道。反謂進反在上也，處下卦之上，能不驕逸，是反能合道也。覆謂從上倒覆而下，居上卦之下，能不憂懼，是覆能合道也。" }
      - { type: j, text: "“或躍在淵”，進無咎也。“飛龍在天”，大人造也。“亢龍有悔”，盈不可久也。" }
      - { type: z, text: "“或躍在淵”至“盈不可久也”。○正義曰：“或躍在淵，進無咎”者，此亦人事言之。進則跳躍在上，退在潛處在淵，猶聖人疑或，而在於貴位也。心所欲進，意在於公，非是為私，故“進無咎”也。“飛龍在天，大人造”者，此亦人事言之。“飛龍在天”，猶聖人之在王位。造，為也。唯大人能為之而成就也。姚信、陸績之屬，皆以“造”為造至之“造”。今案：《象》辭皆上下為韻，則姚信之義，其讀非也。“亢龍有悔，盈不可久”者，此亦人事言之。九五是盈也，盈而不已則至上九，地致亢極，有悔恨也。故云“盈不可久也”。但此六爻《象》辭，第一爻言“陽在下”，是舉自然之象，明其餘五爻皆有自然之象，舉初以見未。五爻並論人事，則知初爻亦有人事，互文相通也。" }
      - { type: j, text: "用九，天德不可為首也。" }
      - { type: z, text: "正義曰：此一節釋經之“用九”之《象》辭。經稱“用九”，故《象》更疊云“用九”。云“天德不可為首”者，此夫子釋辭也。九是天之德也，天德剛健，當以柔和接待於下，不可更懷尊剛為物之首，故云“天德不可為首也”。" }
      - { type: j, text: "《文言》曰：元者善之長也，亨者嘉之會也，利者義之和也，貞者事之幹也。君子體仁足以長人，嘉會足以合禮，利物足以和義，貞固足以幹事。君子行此四德者，故曰：“乾，元、亨、利、貞。”" }
      - { type: z, text: "“《文言》曰”至“乾元亨利貞”。○正義曰：《文言》者，是夫子第七翼也。以乾、坤其《易》之門戶邪，其餘諸卦及爻，皆從乾、坤而出，義理深奧，故特作《文言》以開釋之。莊氏云：“文謂文飾，以乾、坤德大，故特文飾，以為《文言》。”今謂夫子但贊明易道，申說義理，非是文飾華彩，當謂釋二卦之經文，故稱《文言》。從此至“元亨利貞”，明乾之四德，為第一節；從“初九曰潛龍勿用”至“動而有悔”，明六爻之義，為第二節；自“潛龍勿用”下至“天下治也”，論六爻之人事，為第三節；自“潛龍勿用，陽氣潛藏”至“乃見天則”，論六爻自然之氣，為第四節；自“乾元者”至“天下平也”，此一節復說“乾元”之“四德”之義，為第五節；自“君子以成德為行”至“其唯聖人乎”，此一節更廣明六爻之義，為第六節。今各依文解之。此第一節論乾之四德也。“元者善之長也”，此巳下論乾之“四德”，但乾之為體，是天之用。凡天地運化，自然而爾，因無而生有也，無為而自為。天本無心，豈造“元亨利貞”之德也？天本無名，豈造“元亨利貞”之名也？但聖人以人事託之，謂此自然之功，為天之四德，垂教於下，使後代聖人法天之所為，故立天“四德”以設教也。莊氏云：“第一節‘元者善之長’者，謂天之體性，生養萬物，善之大者，莫善施生，元為施生之宗，故言‘元者善之長’也。‘亨者嘉之會’者，嘉，美也。言天能通暢萬物，使物嘉美之會聚，故云‘嘉之會’也。‘利者義之和’者，言天能利益庶物，使物各得其宜而和同也。‘貞者事之幹’者，言天能以中正之氣，成就萬物，使物皆得幹濟。”莊氏之意，以此四句明天之德也，而配四時。“元”是物始，於時配春，春為發生，故下云“體仁”，仁則春也。“亨”是通暢萬物，於時配夏，故下云“合禮”，禮則夏也。“利”為和義，於時配秋，秋既物成，各合其宜。“貞”為事幹，於時配冬，冬既收藏，事皆幹了也。於五行之氣，唯少土也。土則分王四季，四氣之行，非土不載，故不言也。“君子體仁足以長人”者，自此巳下，明人法天之行此“四德”，言君子之人，體包仁道，泛愛施生，足以尊長於人也。仁則善也，謂行仁德，法天之“元”德也。“嘉會足以合禮”者，言君子能使萬物嘉美集會，足以配合於禮，謂法天之“亨”也。“利物足以和義”者，言君子利益萬物，使物各得其宜，足以和合於義，法天之“利”也。“貞固足以幹事”者，言君子能堅固貞正，令物得成，使事皆幹濟，此法天之“貞”也。施於王事言之，元則仁也，亨則禮也，利則義也，貞則信也。不論智者，行此四事，並須資於知。且《乾鑿度》云：“水土二行，兼信與知也。”故略而不言也。“君子行此四德者，故曰：乾，元亨利貞”，以君子之人，當行此四種之德。是以文王作《易》，稱“元亨利貞”之德，欲使君子法之。但行此“四德”，則與天同功，非聖人不可。唯云“君子”者，但易之為道。廣為垂法。若限尚聖人，恐不逮餘下。故總云“君子”，使諸侯公卿之等，悉皆行之。但聖人行此“四德”，能盡其極也。君子行此“四德”，各量力而為，多少各有其分。但乾卦象天，故以此“四德”皆為天德。但陰陽合會，二象相成，皆能有德，非獨乾之一卦。是以諸卦之中亦有“四德”，但餘卦“四德”有劣於乾故乾。卦直云“四德”。更無所言，欲見乾之“四德”，無所不包。其餘卦“四德”之下，則更有餘事，以“四德”狹劣，故以餘事系之，即《坤卦》之類是也。亦有“四德”之上，即論餘事，若《革卦》云“巳日乃孚，元亨利貞，悔亡”也。由“乃孚”之後有“元亨利貞”，乃得“悔亡”也。有“四德”者，即乾、坤、屯、臨、隨、無妄、革七卦是也。亦有其卦非善，而有“四德”者，以其卦兇，故有“四德”乃可也。故《隨卦》有“元亨利貞”，乃得無咎”是也。“四德”具者，其卦未必善也。亦有三德者，即離、鹹、萃、兌、渙、小過。凡六卦就三德之中，為文不一，或總稱三德於上，更別陳餘事於下，若離、鹹之屬是也。就三德之中，上下不一，《離》則云“利貞亨”。由利貞乃得亨也。亦有先云“亨”，更陳餘事，乃始云“利貞”者，以有餘事，乃得利貞故也。有二德者，大有、蠱、漸、大畜、升、困、中孚凡七卦。此二德或在事上言之，或在事後言之由後有事，乃致此二德故也。亦有一德者，若蒙、師、小、畜、履、泰、謙、噬嗑、賁、復、大過、震、豐、節、既濟、未濟、凡十五卦，皆一德也，並是“亨”也。或多在事上言之，或在事後言。《履卦》云：“履虎尾，不咥人，亨。”由有事乃得亨。以前所論德者，皆於經文挺然特明德者乃言之也。其有因事相連而言德者，則不數之也。若《需卦》云：“需，有孚，光亨貞吉。”雖有亨、貞二德，連事起文，故不數也。《遯卦》云：“亨，小利貞。”雖有三德，亦不數也。《旅卦》云：“旅，小亨。旅，貞吉。”雖有亨、貞二德，亦連他事，不數也。《比卦》云：“原筮，元永貞，無咎。”《否卦》云：“否之匪人，不利君子貞。”雖有“貞”字，亦連他文言之，又非本卦德，亦不數之。《同人》云：“同人於野，亨。”《坎卦》云：“有孚，維心亨。”《損卦》云：“無咎可貞。”此等雖有一德，皆連事而言之，故亦不數，所以然者，但易含萬象，事義非一，隨時曲變，不可為典要故也。其有意義，各於卦下詳之。亦有卦善而德少者，若泰與謙、復之類，雖善，唯一德也。亦有全無德者，若豫、觀、剝、晉、蹇、解、夬、姤、井、艮、歸妹、凡十一卦也。大略唯有兇卦無德者，若剝、蹇、夬、姤之屬是也。亦有卦善而無德者，晉、解之屬是也。各於卦下詳之。凡“四德”者，亨之與貞，其德特行，若元之與利，則配連他事。其意以元配亨，以利配貞，雖配他事為文，元是元大也，始首也；利是利益也，合和也。以當分言之，各是其一德也。唯配亨、貞，俱為四德。元雖配亨，亦配他事，故比卦云“元永貞”，《坤·六五》“黃裳元吉”是也。利亦非獨利貞，亦所利餘事多矣，若“利涉大川”，“利建侯”，“利見大人”，“利君子貞”。如此之屬，是利字所施處廣，故諸卦謂他事之利，不數以為德也。此“四德”非唯卦下有之，亦於爻下有之，但爻下其事稍少。故“黃裳元吉”及“何天之衢亨，小貞吉，大貞兇”，此皆於爻下言之，其利則諸爻皆有。" }
      - { type: j, text: "初九曰“潛龍勿用”，何謂也？子曰：“龍德而隱者也。不易乎世，不為世俗所移易也。" }
      - { type: z, text: "“初九曰”至“不易乎世”。○正義曰：此第二節釋初九爻辭也。“初九曰潛龍勿用，何謂也”者，此夫子疊經初九爻辭，故言“初九曰”。方釋其義，假設問辭，故言“潛龍勿用何謂也”。“子曰龍德而隱者也”，此夫子以人事釋“潛龍”之義，聖人有龍德隱居者也。“不易乎世”者，不移易其心在於世俗，雖逢險難，不易本志也。" }
      - { type: j, text: "不成乎名，遁世無悶，不見是而無悶，樂則行之，憂則違之，確乎其不可拔，‘潛龍’也。”" }
      - { type: z, text: "“不成乎名”至“潛龍也”。○正義曰：“不成乎名”者，言自隱默，不成就於令名，使人知也。“遁世無悶”者，謂逃遁避世，雖逢無道，心無所悶。“不見是而無悶”者，言舉世皆非，雖不見善，而心亦無悶。上云“遁世無悶”，心處僻陋，不見是而無悶，此因見世俗行惡，是亦“無悶”，故再起“無悶”之文。“樂則行之，憂則違之”者，心以為樂，已則行之，心以為憂，已則違之。“確乎其不可拔”者，身雖逐物推移，隱潛避世，心志守道，確乎堅實其不可拔，此是“潛龍”之義也。" }
      - { type: j, text: "九二曰：“見龍在田，利見大人”，何謂也？子曰：“龍德而正中者也。庸言之信，庸行之謹，閒邪存其誠，善世而不伐，德博而化。《易》曰：‘見龍在田，利見大人。’君德也。”" }
      - { type: z, text: "“九二曰”至“君德也”。○正義曰：此釋九二爻辭。“子曰：龍德而正中”者，九二居中不偏，然不如九五居尊得位，故但云“龍德而正中者也”。“庸言之信，庸行之謹”者，庸謂中庸，庸，常也。從始至末，常言之信實，常行之謹慎。“閒邪存其誠”者，言防閒邪惡，當自存其誠實也。“善世而不伐”者，謂為善於世，而不自伐其功。“德博而化”者，言德能廣博，而變化於世俗。初爻則全隱遁避世，二爻則漸見德行以化於俗也。若舜漁於雷澤，陶於河濱，以器不窳，民漸化之是也。“《易》曰：見龍在田，利見大人。君德”者，以其異於諸爻，故特稱“《易》曰”。“見龍在田”，未是君位，但云“君德”也。" }
      - { type: j, text: "九三曰“君子終日乾乾，夕惕若厲，無咎”，何謂也？子曰：“君子進德脩業。忠信所以進德也。脩辭立其誠，所以居業也。知至至之，可與幾也。知終終之，可與存義也。處一體之極，是“至”也。居一卦之盡，是“終”也。處事之至而不犯咎，“知至”者也。故可與成務矣。處終而能全其終，“知終”者也。夫進物之速者，義不若利，存物之終者，利不及義。故“靡不有初，鮮克有終”。夫“可與存義”者，其唯“知終”者乎？" }
      - { type: z, text: "“九三曰”至“可與存義也”。○正義曰：此釋九三爻辭也。“子曰：君子進德脩業”者，德謂德行，業謂功業。九三所以“終日乾乾”者，欲進益道德，脩營功業，故“終日乾乾”匪懈也。“進德”則“知至”，將進也；“脩業”則“知終”，存義也。“忠信所以進德”者，復解進德之事，推忠於人，以信待物，人則親而尊之，其德日進，是“進德”也。“修辭立其誠，所以居業”者，辭謂文教，誠謂誠實也。外則脩理文教，內則立其誠實，內外相成，則有功業可居，故云“居業”也。上云“進德”，下復云“進德”；上云“脩業”，下變云“居業”者，以其間有脩辭之文，故避其脩文而云“居業”。且功業宜云“居”也。“知至至之，可與幾”者，九三處一體之極，方至上卦之下，是“至”也。既居上卦之下，而不兇咎，是“知至”也。既能知是將至，則是識幾知理，可與共論幾事。幾者，去無入有，有理而未形之時。此九三既知時節將至，知理欲到，可與共營幾也。“知終終之，可與存義”者，居一體之盡，而全其終竟，是“知終”也。既能知此終竟，是終盡之時，可與保存其義。義者宜也，保全其位，不有失喪，於事得宜。九三既能知其自全，故可存義。然九三唯是一爻，或使之欲進知幾也，或使之欲退存義也。一進一退，其意不同，以九三處進退之時，若可進則進，可退則退，兩意並行。○注“處一體之極”至“其唯知終者乎”。○正義曰：“處一體之極，是至也”者，莊氏云：“極即至也。三在下卦之上，是至極。”褚氏云：“一體之極是至者，是下卦巳極，將至上卦之下，至謂至上卦也。”下云“在下位而不憂”，注云“知夫至至，故不憂”，此以人事言之。既云“下位”，明知在上卦之下，欲至上卦，故不憂，是知將至上卦。若莊氏之說，直云“下卦”上極是至極，儻無上卦之體，何可至也？何須與幾也？是知至者，據上卦為文。莊說非也。“處事之至而不犯咎”，是“知至”者，謂三近上卦，事之將至，能以禮知屈，而不觸犯上卦之咎，則是知事之將至。“故可與成務”者，務謂事務。既識事之先幾，可與以成其事務。“與”猶許也，言可許之事，不謂此人共彼相與也。“進物之速者，義不若利”者，利則隨幾而發，見利則行也。義者依分而動，不妄求進。故進物速疾，義不如利，由義靜而利動故也。“存物之終者，利不及義”者，保全巳成之物，不妄興動，故“利不及義”也。“故靡不有初，鮮克有終”者，見利則行，不顧在後，是“靡不有初”；不能守成其業，是“鮮克有終”。" }
      - { type: j, text: "是故居上位而不驕，在下位而不憂。居下體之上，在上體之下，明夫終敝，故“不驕”也。知夫至至，故“不憂”也。" }
      - { type: z, text: "“是故居上位而不驕，在下位而不憂”。○正義曰：“是故居上位而不驕”者，謂居下體之上位而不驕也，以其“知終”，故不敢懷驕慢。“在下位而不憂”者，處上卦之下，故稱“下位”，以其知事將至，務幾欲進，故不可憂也。○注“明夫終敝故不驕也”至“故不憂也”。○正義曰：“明夫終敝，故不驕”者，解“知終”也。“知夫至至，故不憂”者，解“知至”也。前經“知至”在前，“知終”在後，此經先解“知終”，後解“知至”者，隨文便而言之也。" }
      - { type: j, text: "故乾乾因其時而惕，雖危無咎矣。惕，怵惕之謂也。處事之極，失時則廢，懈怠則曠，故“因其時而惕，雖危無咎”。" }
      - { type: z, text: "“故乾乾”至“無咎矣”。○正義曰：九三以此之故，恆“乾乾”也。因其巳終、巳至之時，而心懷惕懼，雖危不寧，以其知終、知至，故“無咎”。○注“處事之極”至“解怠則曠”。○正義曰：“處事之極，失時則廢”者，謂三在下卦之上體，是處事之極至也。至失時不進，則幾務廢闕，所以“乾乾”須進也。“懈怠則曠”者，既處事極，極則終也，當保守巳終之業；若懈怠驕逸，則功業空曠，所以“乾乾”也。“失時則廢”，解“知至”也。“懈怠則曠”，解“知終”也。" }
      - { type: j, text: "九四曰“或躍在淵，無咎”，何謂也？子曰：“上下無常，非為邪也。進退無恆，非離群也。君子進德脩業，欲及時也，故無咎。”" }
      - { type: z, text: "“九四曰”至“故無咎”。○正義曰：此明九四爻辭也。“子曰：“上下無常，非為邪”者，上而欲躍，下而欲退，是無常也。意在於公，非是為邪也。“進退無恆，非離群”者，何氏云：“所以‘進退無恆’者，時使之然，非苟欲離群也。”何氏又云：“言上下者，據位也。進退者，據爻也。”所謂“非離群”者，言雖“進退無恆”，猶依群眾而行，和光俯仰，並同於眾，非是卓絕獨離群也。“君子進德脩業，欲及時”者，“進德”則欲上、欲進也。“脩業”則欲下、欲退也。進者棄位欲躍，是“進德”之謂也。退者仍退在淵，是“脩業”之謂也。其意與九三同，但九四欲前進多於九三，故云“欲及時”也。九三則不云“及時”，但“可與言幾”而巳。" }
      - { type: j, text: "九五曰“飛龍在天，利見大人”，何謂也？子曰：“同聲相應，同氣相求。水流溼，火就燥，云從龍，風從虎，聖人作而萬物睹，本乎天者親上，本乎地者親下，則各從其類也。”" }
      - { type: z, text: "“九五曰”至“各從其類也”。○正義曰：此明九五爻之義。“飛龍在天”者，言天能廣感眾物，眾物應之，所以“利見大人”。因大人與眾物感應，故廣陳眾物相感應，以明聖人之作而萬物瞻睹以結之也。“同聲相應”者，若彈宮而宮應，彈角而角動是也。“同氣相求”者，若天欲雨而柱礎潤是也。此二者聲氣相感也。“水流溼，火就燥”者，此二者以形象相感，水流於地，先就溼處；火焚其薪，先就燥處。此同氣水火，皆無識而相感，先明自然之物，故發初言之也。“云從龍，風從虎”者，龍是水畜，云是水氣。故龍吟則景云出，是“云從龍”也。虎是威猛之獸，風是震動之氣，此亦是同類相感。故虎嘯則穀風生，是“風從虎”也。此二句明有識之物感無識，故以次言之，漸就有識而言也。“聖人作而萬物睹”者，此二句正釋“飛龍在天，利見大人”之義。“聖人作”則“飛龍在天”也，“萬物睹”則“利見大人”也。陳上數事之名，本明於此，是有識感有識也。此亦同類相感，聖人有生養之德，萬物有生養之情，故相感應也。“本乎天者親上，本乎地者親下”者，在上雖陳感應，唯明數事而巳。此則廣解天地之閒共相感應之義。莊氏云：“天地絪縕，和合二氣，共生萬物。”然萬物之體，有感於天氣偏多者，有感於地氣偏多者，故《周禮·大宗伯》有“天產”、“地產”《大司徒》云“動物”、“植物”，本受氣於天者，是動物含靈之屬，天體運動，含靈之物亦運動，是親附於上也。本受氣於地者，是植物無識之屬，地體凝滯，植物亦不移動，是親附於下也。“則各從其類者”，言天地之間，共相感應，各從其氣類。此類因聖人感萬物以同類，故以同類言之。其造化之性，陶甄之器，非唯同類相感，亦有異類相感者。若磁石引針，琥珀拾芥，蠶吐絲而商弦絕，銅山崩而洛鍾應，其類煩多，難一一言也。皆冥理自然，不知其所以然也。感者動也，應者報也。皆先者為感，後者為應，非唯近事則相感，亦有遠事遙相感者。若周時獲麟，乃為漢高之應；漢時黃星，後為曹公之兆。感應之事廣，非片言可悉，今意在釋理，故略舉大綱而巳。" }
      - { type: j, text: "上九曰“亢龍有悔”，何謂也？子曰：“貴而無位，高而無民。下無陰也。" }
      - { type: z, text: "正義曰：此明上九爻辭也。“子曰貴而無位”者，以上九非位而上九居之，是無位也。“高而無民”者，六爻皆無陰，是無民也。" }
      - { type: j, text: "賢人在下位而無輔，賢人雖在下而當位，不為之助。" }
      - { type: z, text: "正義曰：賢人雖在下位，不為之輔助也。" }
      - { type: j, text: "是以動而有悔也。處上卦之極而不當位，故盡陳其闕也。獨立而動物莫之與矣。《乾·文言》首不論“乾”而先說“元”，下乃曰“乾”，何也？夫“乾”者統行四事者也。君子以自強不息，行此四者，故首不論“乾”而下曰“乾、元、亨、利、貞”。餘爻皆說龍，至於九三獨以“君子”為目，何也？夫易者象也。象之所生，生於義也。有斯義，然後明之以其物，故以龍敘“乾”，以馬明“坤”，隨其事義而取象焉。是故初九、九二，龍德皆應其義，故可論龍以明之也。至於九三“乾乾夕惕”，非龍德也，明以君子當其象矣。統而舉之，“乾”體皆龍，別而敘之，各隨其義。" }
      - { type: z, text: "“是以動而有悔也”。○正義曰：聖人設戒，居此之時不可動作也。○注“夫乾者統行四事者也”。○正義曰：“夫乾者統行四事者也，君子以自強不息，行此四者”，注意以“乾”為四德之主，《文言》之首，不先說“乾”而先說四德者，故自發問而釋之，以“乾”體當分無功，唯統行此四德之事。行此四德，乃是“乾”之功。故《文言》先說君子以自強不息行此四德者，故先言之，發首不論“乾”也。但能四德既備，“乾”功自成，故下始云“乾元亨利貞”。" }
      - { type: j, text: "“潛龍勿用”，下也。“見龍在田”，時舍也。“終日乾乾”，行事也。“或躍在淵”，自試也。“飛龍在天”，上治也。“亢龍有悔”，窮之災也。乾元“用九”，天下治也。此一章全以人事明之也。九，陽也。陽，剛直之物也。夫能全用剛直，放遠善柔，非天下至理，未之能也。故“乾元用九”，則“天下治”也。夫識物之動，則其所以然之理，皆可知也。龍之為德，不為妄者也。潛而勿用，何乎？必窮處於下也。見而在田，必以時之通舍也。以爻為人以位為時，人不妄動，則時皆可知也。文王明夷，則主可知矣。仲尼旅人，則國可知矣。" }
      - { type: z, text: "“潛龍勿用”至“天下治也”。○正義曰：“此一節是《文言》第三節，說六爻人事所治之義。“潛龍勿用，下也”者，言聖人於此潛龍之時，在卑下也。”見龍在田，時舍”者，舍謂通舍。九二以見龍在田，是時之通舍也。“終日乾乾，行事”者，言行此知至、知終之事也。“或躍在淵，自試”者，言聖人逼近五位，不敢果決而進，唯漸漸自試，意欲前進，遲疑不定，故云“自試”也。“飛龍在天，上治”者，言聖人居上位而治理也。“亢龍有悔，窮之災”者，言位窮而致災，災則悔也，非為大禍災也。“乾元用九，天下治”者，《易經》上稱“用九”，“用九”之文，總是“乾”德。又“乾”字不可獨言，故舉“元”德以配“乾”也。言此“乾元”用九德而天下治。九五止是一爻，觀見事狹，但云“上治”。“乾元”裛包六爻，觀見事闊，故云“天下治”也。○注“此一章全以人事”至“國可知矣”。○正義曰：“此一章全以人事明之”者，下云“陽氣潛藏”，又云“乃位乎天德”，又云“乃見天則”此一章，但云“天下治”，是皆以人事說之也。“夫能全用剛直，放遠善柔，非天下至理，未之能也”者，以”乾元用九”，六爻皆陽，是“全用剛直”。“放遠善柔”，謂放棄善柔之人。善能柔諂，貌恭心狠，使人不知其惡，識之為難。此用九純陽者，是全用剛直，更無餘陰。柔善之人，堯尚病之，故云：“非天下之至理，未之能也”。“夫識物之動，則其所以然之理，皆可知”者，此欲明在下龍潛見之義。故張氏云：“識物之動，謂龍之動也。則其所以然之理，皆可知者，謂識龍之所以潛所以見，然此之理皆可知也。”“龍之為德，不為妄者”，言龍靈異於他獸，不妄舉動，可潛則潛，可見則見，是不虛妄也。“見而在田，必以時之通舍”者，經唯云“時舍”也。注云“必以時之通舍”者，則輔嗣以通解舍，“舍”是通義也。初九潛藏不見，九二既見而在田，是時之通舍之義也。“以爻為人，以位為時”者，爻居其位，猶若人遇其時，故“文王明夷，則主可知矣”。主則時也，謂當時無道，故明傷也。“仲尼旅人，則國可知矣”，國亦時也，若見仲尼羈旅於人，則知國君無道，令其羈旅出外。引文王、仲尼者，明龍潛、龍見之義。" }
      - { type: j, text: "“潛龍勿用”，陽氣潛藏。“見龍在田”，天下文明。“終日乾乾”，與時偕行。與天時俱不息。" }
      - { type: z, text: "“潛龍勿用”至“與時偕行”。○正義曰：此一節是《文言》第四節，明六爻天氣之義。“天下文明”者，陽氣在田，始生萬物，故天下有文章而光明也。“與時偕行”者，此以天道釋爻象也。所以九三乾乾不息，終日自戒者，同於天時，生物不息，言“與時偕行”也。偕，俱也。諸儒以為建辰之月，萬物生長，不有止息，與天時而俱行。若以不息言之，是建寅之月，三陽用事，三當生物之初，生物不息。同於天時生物不息，故言“與時偕行”也。" }
      - { type: j, text: "“或躍在淵”，乾道乃革。“飛龍在天”，乃位乎天德。“亢龍有悔”，與時偕極。與時運俱終極。" }
      - { type: z, text: "“或躍在淵”至“與時偕極”。○正義曰：“乾道乃革”者，去下體，入上體，故云“乃革”也。“乃位乎天德”者，位當天德之位，言九五陽居於天，照臨廣大，故云“天德”也。" }
      - { type: j, text: "“乾元用九”，乃見天則。此一章全說天氣以明之也。九，剛直之物，唯“乾”體能用之，用純剛以觀天，天則可見矣。" }
      - { type: z, text: "正義曰：“乃見天則”者，陽是剛亢之物，能用此純剛，唯天乃然，故云“乃見天則”。" }
      - { type: j, text: "“乾元”者，始而亨者也。“利貞”者，性情也。不為“乾元”，何能通物之始無不性其情，何能久行其正？是故“始而亨者”，必“乾元”也。利而正者，必“性情”也。" }
      - { type: z, text: "“乾元者”至“性情也”。○正義曰：“此一節是第五節，復明上初章及“乾”四德之義也。“乾元者，始而亨者也”，以“乾”非自當分有德，以元、亨、利、貞為德。“元”是四德之首，故夫子恆以“元”配“乾”而言之，欲見乾、元、相將之義也。以有“乾”之元德，故能為物之始而亨通也。此解元、亨二德也。“利貞者，性情也”者，所以能利益於物而得正者，由性制於情也。○注“不為乾元”至“必性情也”。○正義曰：“乾”之元氣，其德廣大，故能遍通諸物之始。若餘卦元德，雖能始生萬物，德不周普，故云“不為乾元，何能通物之始”？其實“坤元”亦能通諸物之始，以此《文言》論“乾元”之德，故注連言“乾元”也。“不性其情，何能久行其正”者，性者天生之質，正而不邪；情者性之欲也。言若不能以性制情，使其情如性，則不能久行其正。其六爻發揮之義，案：《略例。云“爻者，言乎變者也”。故合散屈伸，與體相乖，形躁好靜，質柔愛剛，體與情反，質與原違。是爻者所以明情，故六爻發散，旁通萬物之情。輔嗣之意，以初為無用之地，上為盡末之境。其居位者唯二、三、四、五，故《系辭》唯論此四爻。初、上雖無正位，統而論之，爻亦始末之位，故《乾·彖》云“六位時成”。二、四為陰位，陰居為得位，陽居為失位；三、五為陽位，陽居為得位，陰居為失位。《略例》云：“陽之所求者陰也，陰之所求者陽也”。一與四，二與五，三與上，若一陰一陽為有應，若俱陰俱陽為無應。此其六爻之大略，其義具於《系辭》，於此略言之。" }
      - { type: j, text: "乾始，能以美利利天下，不言所利，大矣哉！大哉乾乎，剛健中正，純粹精也！六爻發揮，旁通情也。“時乘六龍”，以御天也。“云行雨施”，天下平也。" }
      - { type: z, text: "“乾始，能以美利”至“天下平也”。○正義曰：“乾始，能以美利利天下，不言所利，大矣哉”者，此復說始而亨、利、貞之義。“乾始”，謂乾能始生萬物，解“元”也。“能以美利利天下”，解“利”也。謂能以生長美善之道，利益天下也。不復說亨、貞者，前文“亨”既連始，“貞”又連利，舉始舉利，則通包亨、貞也。“不言所利，大矣哉”者，若《坤卦》云“利牝馬之貞”，及“利建侯”，“利涉大川”，皆言所利之事。此直云“利貞”，不言所利之事，欲見無不利也。非唯止一事而已故云：“不言所利大矣哉其實此利為無所不利此貞亦無所不貞是乾德大也，“大哉乾乎，剛健中正，純粹精”者，此正論乾德，不兼通“元”也。故直云“大哉乾乎，剛健中正，謂純陽剛健，其性剛強，其行勁健。“中”謂二與五也，“正”謂五與二也，故云“剛健中正”。六爻俱陽，是純粹也。純粹不雜，是精靈，故云“純粹精也”。“六爻發揮，旁通情”者，發謂發越也，揮謂揮散也，言六爻發越揮散，旁通萬物之情也。“時乘六龍，以御天”者，重取《乾·彖》之文，以讚美此乾之義。“云行雨施，天下平”者，言天下普得其利而均平不偏陂。" }
      - { type: j, text: "君子以成德為行，日可見之行也。潛之為言也，隱而未見，行而未成，是以君子弗用也。" }
      - { type: z, text: "“君子以成德為行”至“君子弗用也”。○正義曰：此一節是《文言》第六節，更復明六爻之義。此節明初九爻辭。周氏云：“上第六節‘乾元者始而亨者也’，是廣明‘乾’與‘四德’之義，此‘君子以成德為行’，亦是第六節，明六爻之義，總屬第六節，不更為第七節。”義或當然也。“君子以成德為行”者，明初九“潛龍”之義，故先開此語也。言君子之人，當以成就道德為行，令其德行彰顯，使人日可見其德行之事，此君子之常也，不應潛隱。所以今日潛者，以時未可見，故須潛也。“潛之為言也，隱而未見，行而未成”，此夫子解“潛龍”之義。此經中“潛龍”之言，是德之幽隱而未宣見，所行之行未可成就。“是以君子弗用”者，德既幽隱，行又未成，是君子於時不用，以逢眾陰，未可用也。周氏云：“德出於己，在身內之物，故云：‘成’；行被於人，在外之事，故云為‘行’。”下又即云“行而未成”，是行亦稱成。周氏之說，恐義非也。“成德為行”者，言君子成就道德以為其行。其“成德為行”，未必文相對。" }
      - { type: j, text: "君子學以聚之，問以辯之，以君德而處下體，資納於物者也。" }
      - { type: z, text: "正義曰：此復明九二之德。“君子學以聚之”者，九二從微而進，未在君位，故且習學以畜其德。“問以辯之”者，學有未了，更詳問其事，以辯決於疑也。" }
      - { type: j, text: "寬以居之，仁以行之。《易》曰“見龍在田，利見大人”，君德也。" }
      - { type: z, text: "正義曰：“寬以居之”者，當用寬裕之道，居處其位也。“仁以行之”者，以仁恩之心，行之被物。“《易》曰‘見龍在田，利見大人’，君德”者，既陳其德於上，然後引《易》本文以結之。《易》之所云是君德，“寬以居之，仁以行之”是也。但有君德，未是君位。" }
      - { type: j, text: "九三，重剛而不中，上不在天，下不在田。故乾乾因其時而惕，雖危無咎矣。" }
      - { type: z, text: "“九三”至“無咎矣”。○正義曰：此明九三爻辭。上之初九、九二皆豫陳其德於上，不發首云初九、九二，此九三、九四，則發首先言九三、九四；其九五全不引《易》文，上九則發首云“亢之為言”也。上下不為例者，夫子意在釋經，義便則言，以潛見須言其始，故豫張本於上。三、四俱言“重剛不中”，恐其義同，故並先云爻位並重剛不中之事。九五前章已備，故不復引《易》，但云“大人”也。上九亦前章備顯，故此直言“亢之為言”也。案：初九云“潛之為言”，上爻云“亢之為言”，獨二爻云“言”者，褚氏以初、上居無位之地，故稱言也；其餘四爻是有位，故不云“言”，義或然也。“重剛”者，上下俱陽，故“重剛”也。“不中”者，不在二、五之位，故“不中”也。“上不在天”，謂非五位；“下不在田”，謂非二位也。“故乾乾因其時而惕，雖危無咎矣”者，居危之地，以“乾乾夕惕”，戒懼不息，得“無咎”也。" }
      - { type: j, text: "九四，重剛而不中，上不在天，下不在田，中不在人，故或之。或之者，疑之也，故無咎。" }
      - { type: z, text: "“九四”至“故無咎正義”。曰：此明九四爻辭也。其“重剛不中，上不在天，下不在田”，並與九三同也。“中不在人”者，三之與四，俱為人道。但人道之中，人下近於地，上遠於天，九三近二，是下近於地，正是人道，故九三不云“中不在人”。九四則上近於天，下遠於地，非人所處，故特云“中不在人”。“故或之”者，以其上下無定，故心或之也。“或之者，疑之也”者，此夫子釋經“或”字。經稱“或”是疑惑之辭，欲進欲退，猶豫不定，故疑之也。九三中雖在人，但位卑近下，向上為難，故危惕，其憂深也。九四則陽德漸盛，去五彌近，前進稍易，故但疑惑，憂則淺也。" }
      - { type: j, text: "夫大人者，與天地合其德，與日月合其明，與四時合其序，與鬼神合其吉凶。先天而天弗違，後天而奉天時。天且弗違，而況於人乎？況於鬼神乎？" }
      - { type: z, text: "“夫大人者”至“況於鬼神乎”。○正義曰：此明九五爻辭。但上節明大人與萬物相感，此論大人之德，無所不合，廣言所合之事。“與天地合其德”者，莊氏云：“謂覆載也”。“與日月合其明”者，謂照臨也。“與四時合其序”者，若賞以春夏，刑以秋冬之類也。“與鬼神合其吉凶”者，若福善禍淫也。“先天而天弗違”者，若在天時之先行事，天乃在後不違，是天合大人也。“後天而奉天時”者，若在天時之後行事，能奉順上天，是大人合天也。“天且弗違，而況於人乎，況於鬼神乎”者，夫子以天且不違，遂明大人之德，言尊而遠者尚不違，況小而近者可有違乎？況於人乎？況於鬼神乎？" }
      - { type: j, text: "“亢”之為言也，知進而不知退，知存而不知亡，知得而不知喪。其唯聖人乎！知進退存亡，而不失其正者，其唯聖人乎！" }
      - { type: z, text: "“亢之為言也”至“其唯聖人乎”。○正義曰：此明上九之義也。“知進而不知退，知存而不知亡，知得而不知喪”者，言此上九所以亢極有悔者，正由有此三事。若能三事備知，雖居上位，不至於“亢”也。此設誡辭。莊氏云：“進退據心，存亡據身，得喪據位。”“其唯聖人乎，知進退存亡”者，言唯聖人乃能“知進退存亡”也。何不云得喪者，得喪輕於存亡，舉重略輕也。“而不失其正者，其唯聖人乎”者，聖人非但只知進退存亡，又能不失其正道，其唯聖人乎！此經再稱“其唯聖人乎”者，上稱“聖人”為“知進退存亡”發文，下稱“其唯聖人乎”者，為“不失其正”發文，言“聖人”非但“知進退存亡”，又能“不失其正”，故再發“聖人”之文也。" }
      - { type: j, text: "坤下坤上。坤：元、亨，利牝馬之貞。坤，貞之所利，利於牝馬也。馬在下而行者也，而又牝焉，順之至也。至順而後乃“亨”，故唯利於“牝馬之貞”。" }
      - { type: z, text: "“坤：元、亨，利牝馬之貞”。○正義曰：此一節是文王於坤卦之下陳坤德之辭。但乾、坤合體之物，故乾後次坤，言地之為體，亦能始生萬物，各得亨通，故云“元亨”與乾同也。“利牝馬之貞”者，此與乾異。乾之所貞，利於萬事為貞，此唯云“利牝馬之貞”，“坤”是陰道，當以柔順為貞正，借柔順之象，以明柔順之德也。牝對牝為柔，馬對龍為順，還藉此柔順以明柔道，故云“利牝馬之貞”。“牝馬”，外物自然之象，此亦聖人因“坤元亨，利牝馬之貞”自然之德以垂教也。不云牛而云馬者，牛雖柔順，不能行地無疆，以見“坤”廣生之德，馬雖比龍為劣，所而亦能廣遠，象地之廣育。○注“至順而後乃亨”至“唯利於牝馬之貞”。○正義曰：“至順而後乃亨，故唯利於牝馬之貞”者，案：牝馬是至順，“牝馬”在“元亨”之下，在“貞”之上，應云至順而後乃貞。今云“至順而後乃亨”，倒取上文者，輔嗣之意，下句既云“牝馬之貞”，避此“貞”文，故云“乃亨”。但亨、貞相將之物，故云至順之“貞”，亦是至順之“亨”。此“坤”德以牝馬至順乃得貞也。下文又云“東北喪朋”，去陰就陽，乃得貞吉。上下義反者，但易含萬象，一屈一伸。此句與“乾”相對，不可純剛敵“乾”，故“利牝馬”。下句論凡所交接，不可純陰，當須剛柔交錯，故“喪朋吉”也。" }
      - { type: j, text: "君子有攸往，先迷後得，主利。西南得朋，東北喪朋，安貞吉。西南致養之地，與“坤”同道者也，故曰“得朋”。東北反西南者也，故曰“喪朋”。陰之為物，必離其黨，之於反類，而後獲安貞吉。" }
      - { type: z, text: "“君子有攸往”至“安貞吉”。○正義曰：“君子有攸往”者，以其柔順利貞，故君子利有所往。“先迷後得，主利”者，以其至柔，當待唱而後和。凡有所為，若在物之先即迷惑，若在物之後即得主利，以陰不可先唱，猶臣不可先君，卑不可先尊故也。“西南得朋”者，此假象以明人事。西南坤位，是陰也，今以陰詣陰乃得朋，俱是陰類，不獲吉也。猶人既懷陰柔之行，又向陰柔之方，是純陰柔弱，故非吉也。“東北喪朋，安貞吉”者，西南既為陰，東北反西南，即為陽也。以柔順之道，往詣於陽，是喪失陰朋，故得安靜貞正之吉，以陰而兼有陽故也。若以人事言之，象人臣離其黨而入君之朝，女子離其家而入夫之室。莊氏云：“‘先迷後得主利’者，唯據臣事君也。得朋、喪朋，唯據婦適夫也”。其褊狹，非復弘通之道。○注“西南致養之地”至“後獲安貞吉”。○正義曰：坤位居西南。《說卦》云：“坤也者，地也，萬物皆致養焉。”“坤”既養物，若向西南，“與坤同道”也。“陰之為物，必離其黨，之於反類，而後獲安貞吉”者，若二女同居，其志不同，必之於陽，是之於反類，乃得吉也。凡言朋者，非唯人為其黨，性行相同，亦為其黨。假令人是陰柔而之剛正，亦是離其黨。" }
      - { type: j, text: "《彖》曰：至哉坤元！萬物資生，乃順承天，坤厚載物，德合無疆。含弘光大，品物咸亨，牝馬地類，行地無疆。地之所以得“無疆”者，以卑順行之故也。乾以龍御天，坤以馬行地。" }
      - { type: z, text: "“《彖》曰”至“行合無疆”。○正義曰：“至哉坤元”至“德合無疆”，此五句總明坤義及二德之首也。但“元”是坤德之首，故連言之，猶乾之“元”德，與乾相通共文也。“至哉坤元”者，歎美坤德，故云“至哉”。“至”謂至極也，言地能生養至極，與天同也。但天亦至極，包籠於地，非但至極，又大於地。故《乾》言“大哉”，《坤》言“至哉”。“萬物資生”者，言萬物資地而生。初稟其氣謂之始，成形謂之生。“乾”本氣初，故云“資始”，“坤”據成形，故云“資生”。“乃順承天”者，“乾”是剛健能統領於天，“坤”是陰柔以和順承平於天。“坤厚載物，德合無疆”者，以其廣厚，故能載物，有此生長之德，合會無疆。凡言“無疆”者，其有二義，一是廣傳無疆，二是長久無疆也。自此已上，論“坤元”之氣也。“含弘光大，品物咸亨”者，包含以厚，光著盛大，故品類之物，皆得亨通。但“坤”比“元”，即不得大名，若比眾物，其實大也，故曰“含弘光大”者也。此二句釋“亨”也。“牝馬地類，行地無疆”者，以其柔順，故云“地類”，以柔順為體，終無禍患，故“行地無疆”不復窮已。此二句釋“利貞”也。故上文云“利牝馬之貞”是也。" }
      - { type: j, text: "柔順利貞，君子攸行，先迷失道，後順得常。“西南得朋”，乃與類行。“東北喪朋”，乃終有慶。“安貞”之吉，應地無疆。地也者，形之名也。“坤”也者，用地者也。夫用雄必爭，二主必危，有地之形，與剛健為耦，而以永保無疆，用之者不亦至順乎？若夫行之不以“牝馬”，利之不以“永貞”，方而又剛，柔而又圓，求安難矣。" }
      - { type: z, text: "“柔順利貞”至“應地無疆”。○正義曰：“柔順利貞，君子攸行”者，重釋“利貞”之義，是君子之所行，兼釋前文“君子有攸往”。“先迷失道”者，以陰在是之先，失其為陰之道。“後順得常”者，以陰在物之後，陽唱而陰和，人得“主利”，是“後順得常”。“西南得朋，乃與類行”者，以陰而造坤位，是乃與類俱行。“東北喪朋，乃終有慶”者，以陰而詣陽，初雖離群，乃終久有慶善也。“安貞之吉，應地無疆”者，安謂安靜，貞謂貞正，地體安靜而貞正，人若得靜而能正，即得其吉，應合地之無疆，是慶善之事也。○注“行之不以牝馬”至“求安難矣”。○正義曰：“行之不以牝“馬”，牝馬謂柔順也。“利之不以永貞”，永貞謂貞固剛正也，言坤既至柔順，而利之即不兼剛正也。”方而又剛“者，言體既方正，而性又剛強，即太剛也。所以須“牝馬”也。“柔而又圓”者，謂性既柔順，體又圓曲，謂太柔也，故須“永貞”也。若其坤無牝馬，又無永貞，求安難矣。云“永貞”者，是下“用六”爻辭也。“東北喪朋”，去陰就陽，是利之永貞。" }
      - { type: j, text: "《象》曰：地勢坤。地形不順，其勢順。" }
      - { type: z, text: "正義曰：地勢方直，是不順也。其勢承天，是其順也。" }
      - { type: j, text: "君子以厚德載物。" }
      - { type: z, text: "正義曰：君子用此地之厚德容載萬物。言“君子”者，亦包公卿諸侯之等，但“厚德載物”，隨分多少，非如至聖載物之極也。" }
      - { type: j, text: "初六：履霜，堅冰至。始於履霜，至於堅冰，所謂至柔而動也剛。陰之為道，本於卑弱而後積著者也，故取“履霜”以明其始。陽之為物，非基於始以至於著者也，故以出處明之，則以初為潛。" }
      - { type: z, text: "“初六：履霜，堅冰至”。○正義曰：初六陰氣之微，似若初寒之始，但履踐其霜，微而積漸，故堅冰乃至。義所謂陰道，初雖柔順，漸漸積著，乃至堅剛。凡易者象也，以物象而明人事，若《詩》之比喻也。或取天地陰陽之象以明義者，若《乾》之“潛龍”，“見龍”，《坤》之“履霜堅冰”，“龍戰”之屬是也。或取萬物雜象以明義者，若《屯》之六三“即鹿無虞”，六四“乘馬班如”之屬是也。如此之類，《易》中多矣。或直以人事，不取物象以明義者，若《乾》之九三“君子終日乾乾”，《坤》之六三“含章可貞”之例是也。聖人之意，可以取象者則取象也，可以取人事者則取人事也。故《文言》注云：“至於九三，獨以君子為目者何也？”“乾乾夕惕，非龍德也”。故以人事明之，是其義也。" }
      - { type: j, text: "《象》曰：“履霜堅冰，陰始凝也。馴致其道，至“堅冰”也。" }
      - { type: z, text: "“《象》曰履霜堅冰”至“至堅冰也”。○正義曰：夫子所作《象》辭，元在六爻經辭之後，以自卑退，不敢於亂先聖正經之辭。及至輔嗣之意，以為“象”者本釋經文，宜相附近，其義易了，故分爻之《象》辭，各附其當爻下言之，猶如元凱注《左傳》分經之年，與傳相附。“陰始疑也”者，釋“履霜”之義，言陰氣始凝，結而為霜也。“馴致其道，至堅冰也”者，馴猶狎順也。若鳥獸馴狎然。言順其陰柔之道，習而不已，乃至“堅冰”也。褚氏云：“履霜者，從初六至六三。堅冰者，從六四至上六。”陰陽之氣無為，故積馴履霜，必至於堅冰。以明人事有為，不可不制其節度，故於履霜而逆以堅冰為戒，所以防漸慮微，慎終於始也。" }
      - { type: j, text: "六二：直方大，不習無不利。居中得正，極於地質，任其自然而物自生，不假修營而功自成，故“不習”焉而“無不利”。" }
      - { type: z, text: "“六二”至“無不利”。正義曰：《文言》云：“直其正也”。二得其位，極地之質，故亦同地也。俱包三德，生物不邪，謂之直也。地體安靜，是其方也。無物不載，是其大也。既有三德極地之美，自然而生，不假修營，故云“不習無不利”。物皆自成，無所不利，以此爻居中得位，極於地體故，盡極地之義。此因自然之性，以明人事，居在此位，亦當如地之所為。注“居中得正”。○正義曰：“居中得正，極於地質”者，質謂形質，地之形質直方又大，此六二“居中得正”，是盡極地之體質也。所以“直”者，言氣至即生物，由是體正直之性。其運動生物之時，又能任其質性，直而且方，故《象》云：“六二之動，直以方也”。" }
      - { type: j, text: "《象》曰：六二之動，直以方也。動而直方，任其質也。" }
      - { type: z, text: "“《象》曰”至“直以方也”。○正義曰：言六二之體，所有興動，任其自然之性，故云“直以方”也。○注“動而直方”。正義曰：是質以直方，動又直方，是質之與行，內外相副。物有內外不相副者，故《略例》云“形躁好靜，質柔愛剛”，此之類是也。" }
      - { type: j, text: "不習無不利，地道光也。" }
      - { type: z, text: "正義曰：言所以不假修習，物無不利，猶地道光大故也。" }
      - { type: j, text: "六三：含章可貞，或從王事，無成有終。三處下卦之極，而不疑於陽，應斯義者也。不為事始，須唱乃應，待命乃發，含美而可正者也，故曰“含章可貞”也。有事則從，不敢為首，故曰“或從王事”也。不為事主，順命而終，故曰“無成有終”也。" }
      - { type: z, text: "“六三”至“無成有終”。○正義曰：“含章可貞”者，六三處下卦之極，而能不被疑於陽。章，美也。既居陰極，能自降退，不為事始，唯內含章美之道，待命乃行，可以得正，故曰“含章可貞”。“或從王事，無成有終”者，言六三為臣，或順從於王事，故不敢為事之首，主成於物，故云“無成”。唯上唱下和，奉行其終，故云“有終”。○注“三處下卦之極”。○正義曰：“三處下卦之極”者，欲見三雖陰爻，其位尊也。“不疑於陽”者，陰之尊極，將與陽敵，體必被陽所忌。今不被疑於陽言陽，不害也。“應斯義”者，斯，此也，若能應此義，唯行“含章可貞”已下之事，乃應斯義。此爻全以人事明之。" }
      - { type: j, text: "《象》曰：“含章可貞”，以時發也，“或從王事”，知光大也。知慮光大，故不擅其美。" }
      - { type: z, text: "“《象》曰”至“知光大也”。○正義曰：“含章可貞，以時發”者，夫子釋“含章”之義，以身居陰極，不敢為物之首，但內含章美之道，待時而發，是“以時發也”。“或從王事，知光大”者，釋“無成有終”也。既隨從王事，不敢主成物始，但奉終而行，是知慮光大，不自擅其美，唯奉於上。" }
      - { type: j, text: "六四：括囊，無咎地譽。處陰之卦，以陰居陰，履非中位，無“直方”之質，不造陽事，無“含章”之美，括結否閉，賢人乃隱。施慎則可，非泰之道。" }
      - { type: z, text: "“六四”至“無譽”。○正義曰：括，結也。囊所以貯物，以譬心藏知也。閉其知而不用，故曰“括囊”。功不顯物，故曰“無譽”。不與物忤，故曰“無咎”。○注“不造陽事”至“非泰之道”。○正義曰：“不造陽事，無含章之美”者，六三以陰居陽位，是造為陽事，但不為事始，待唱乃行，是陽事猶在，故云“含章”，章即陽之美也。今六四以陰處陰，內無陽事，是“不造陽事，無含章之美”，當“括結否閉”之時，是“賢人乃隱”，唯施謹慎則可，非通泰之道也。" }
      - { type: j, text: "《象》曰：“括囊無咎”，慎不害也。" }
      - { type: z, text: "正義曰：“慎不害”者，釋所以“括囊無咎”之義。曰其謹慎，不與物競，故不被害也。" }
      - { type: j, text: "六五：黃裳元吉。黃，中之色也，裳，下之飾也。“坤”為臣道，美盡於下。夫體無剛健而能極物之情，通理者也。以柔順之德，處於盛位，任夫文理者也。垂黃裳以獲元吉，非用武者也。極陰之盛，不至疑陽，以“文在中”，美之至也。" }
      - { type: z, text: "“六五黃裳元吉”。○正義曰：黃是中之色，裳是下之飾，“坤”為臣道，五居君位，是臣之極貴者也。能以中和通於物理，居於臣職，故云“黃裳元吉”。元大也。以其德能如此，故得大吉也。○注“黃中之色”。○正義曰：“黃，中之色，裳，下之飾”者，《左氏·昭十二年傳》文也。裳，下之飾，則上衣比君，下裳法臣也。“垂黃裳以獲元吉，非用武”者，以體無剛健，是非用威武也。以內有文德，通達物理，故象云“文在中”也。" }
      - { type: j, text: "《象》曰：“黃裳元吉”，文在中也。用黃裳而獲元吉，以“文在中也”。" }
      - { type: z, text: "正義曰：釋所以“黃裳元吉”之義，以其文德在中故也。既有中和，又奉臣職，通達文理，故云文在其中，言不用威武也。" }
      - { type: j, text: "上六：龍戰於野，其血玄黃。陰之為道，卑順不盈，乃全其美。盛而不已，固陽之地，陽所不堪，故“戰於野”。" }
      - { type: z, text: "“上六”至“其血玄黃”。○正義曰：以陽謂之龍，上六是陰之至極，陰盛似陽，故稱“龍”焉。“盛而不已，固陽之地，陽所不堪”，故陽氣之龍與之交戰，即《說卦》云“戰乎乾”是也。戰於卦外，故曰“於野”。陰陽相傷，故“其血玄黃”。○注“盛而不已”。○正義曰：“盛而不己，固陽之地”者，固為佔固，陰去則陽來，陰乃盛而不去，佔固此陽所生之地，故陽氣之龍與之交戰。" }
      - { type: j, text: "《象》曰：“龍戰於野”，其道窮也。" }
      - { type: j, text: "用六：利永貞。用六之利，“利永貞”也。" }
      - { type: z, text: "正義曰：“用六，利永貞”者，此坤之六爻裛辭也。言坤之所用，用此眾爻之六，六是柔順，不可純柔，故利在永貞。永，長也。貞，正也。言長能貞正也。" }
      - { type: j, text: "《象》曰：用六，“永貞”，以大終也。能以永貞大終者也。" }
      - { type: z, text: "正義曰：“以大終”者，釋“永貞”之義，既能用此柔順，長守貞正，所以廣大而終也。若不用永貞，則是柔而又圓，即前注云“求安難”矣。此“永貞”即坤卦之下“安貞吉”是也。" }
      - { type: j, text: "《文言》曰：坤至柔而動也剛，至靜而德方。動之方直，不為邪也。柔而又圓，消之道也。其德至靜，德必方也。" }
      - { type: z, text: "正義曰：此一節是第一節，明坤之德也。自“積善之家”以下是第二節也，分釋六爻之義。“坤至柔而動也剛”者，六爻皆陰，是至柔也。體雖至柔而運動也剛，柔而積漸，乃至堅剛，則上云“履霜堅冰”是也。又地能生物，初雖柔弱，後至堅剛而成就。“至靜而德方”者，地體不動，是“至靜”。生物不邪，是德能方正。" }
      - { type: j, text: "後得主而有常，含萬物而化光。“坤”道其順乎？承天而時行！" }
      - { type: z, text: "正義曰：“後得主而有常”者，陰主卑退，若在事之後，不為物先，即“得主”也。此陰之恆理，故云“有常”。“含萬物而化光”者，自明《彖》辭含弘光大，言含養萬物而德化光大也。“坤道其順乎，承天而時行”者，言“坤”道柔順，承奉於天，以量時而行，即不敢為物之先，恆相時而動。" }
      - { type: j, text: "積善之家，必有餘慶。積不善之家，必有餘殃。臣弒其君，子弒其父，非一朝一夕之故，其所由來者漸矣，由辯之不早辯也。《易》曰：“履霜堅冰至”，蓋言順也。" }
      - { type: z, text: "“積善之家”至“蓋言順也”。○正義曰：此一節明初六爻辭也。“積善之家，必有餘慶，積不善之家，必有餘殃”者，欲明初六其惡有漸，故先明其所行善惡事，由久而積漸，故致後之吉凶。“其所由來者漸矣”者，言弒君弒父，非一朝一夕率然而起，其禍患所從來者積漸久遠矣。“由辯之不早辯”者，臣子所以久包禍心，由君父欲辯明之事，不早分辯故也。此戒君父防臣子之惡。“蓋言順”者，言此“履霜堅冰至”，蓋言順習陰惡之道，積微而不已，乃致此弒害。稱“蓋”者是疑之辭。凡萬事之起，皆從小至大，從微至著，故上文善惡並言，今獨言弒君弒父有漸者，以陰主柔順，積柔不已，乃終至禍亂，故特於坤之初六言之，欲戒其防柔弱之初，又陰為弒害，故寄此以明義。" }
      - { type: j, text: "直其正也，方其義也。君子敬以直內，義以方外，敬義立而德不孤。“直方大，不習無不利”，則不疑其所行也。" }
      - { type: z, text: "“直其正也”至“所行也”。○正義曰：此一節釋六二爻辭。“直其正”者，經稱直是其正也。“方其義”者，經稱方是其義也。義者，宜也，於事得宜，故曰義。“君子敬以直內”者，覆釋“直其正”也。言君子用敬以直內，內謂心也，用此恭敬以直內理。“義以方外”者，用此義事，以方正外物，言君子法地正直而生萬物，皆得所宜，各以方正，然即前云“直其正也，方其義也”。下云“義以方外”，即此應云“正以直內”。改云“敬以直內”者，欲見正則能敬，故變“正”為“敬”也。“敬義立而德不孤”者，身有敬義，以接於人，則人亦敬，義以應之，是德不孤也。直則不邪，正則謙恭，義則與物無競，方則凝重不躁，既“不習無不利”，則所行不須疑慮，故曰“不疑其所行”。" }
      - { type: j, text: "陰雖有美，含之以從王事，弗敢成也。地道也，妻道也，臣道也。地道無成，而代有終也。" }
      - { type: z, text: "“陰雖有美”至“有終也”。○正義曰：此一節明六三爻辭，言“陰雖有美，含之以從王事”者，釋“含章可貞”之義也。言六三之陰，雖有美道包含之德，苟或從王事，不敢為主先成之也。“地道也，妻道也，臣道也”者，欲明“坤”道處卑，待唱乃和，故歷言此三事，皆卑應於尊，下順於上也。“地道無成，而代有終”者，其地道卑柔，無敢先唱成物，必待陽始先唱，而後代陽有終也。" }
      - { type: j, text: "天地變化，草木蕃，天地閉，賢人隱。《易》曰“括囊無咎無譽”，蓋言謹也。" }
      - { type: z, text: "“天地變化”至“蓋言謹也”。○正義曰：此一節明六四爻辭。“天地變化”，謂二氣交通，生養萬物，故草木蕃滋。“天地閉，賢人隱”者，謂二氣不相交通，天地否閉，賢人潛隱。天地通則草木蕃，明天地閉草木不蕃；“天地閉，賢人隱”，明天地通則賢人出，互而相通，此乃“括囊無咎”，故賢人隱屬天地閉也。“蓋言謹”者，謹謂謹慎，蓋言賢人君子於此之時須謹慎也。" }
      - { type: j, text: "君子黃中通理，正位居體，美在其中，而暢於四支，發於事業，美之至也。" }
      - { type: z, text: "“君子”至“美之至也”。○正義曰：此一節明六五爻辭也。“黃中通理”者，以黃居中，兼四方之色，奉承臣職，是通曉物理也。“正位居體”者，居中得正，是正位也；處上體之中，是居體也。黃中通理，是“美在其中”。有美在於中，必通暢於外，故云“暢於四支”。四支猶人手足，比於四方物務也。外內俱善，能宣發於事業。所營謂之事，事成謂之業，美莫過之，故云“美之至”也。" }
      - { type: j, text: "陰疑於陽必戰。辯之不早，疑盛乃動，故“必戰”。" }
      - { type: z, text: "正義曰：此一節明上六爻辭。“陰疑於陽，必戰”者，陰盛為陽所疑，陽乃發動，欲除去此陰，陰既強盛，不肯退避，故“必戰”也。" }
      - { type: j, text: "為其嫌於無陽也，為其嫌於非陽而戰。故稱“龍”焉。" }
      - { type: z, text: "正義曰：上六陰盛，似陽，為嫌純陰非陽，故稱“龍”以明之。" }
      - { type: j, text: "猶未離其類也，猶未失其陰類，為陽所滅。故稱“血”焉。猶與陽戰而相傷，故稱血。" }
      - { type: z, text: "正義曰：言上六雖陰盛似陽，然猶未能離其陽類，故為陽所傷而見成也。" }
      - { type: j, text: "夫玄黃者天地之雜也，天玄而地黃。" }
      - { type: z, text: "正義曰：釋“其血玄黃”之義。莊氏云：“上六之爻，兼有天地雜氣，所以上六被傷，‘其血玄黃’也。天色玄，地色黃，故血有天地之色。”今輔嗣注云“猶與陽戰而相傷”，是言陰陽俱傷也。恐莊氏之言，非王之本意，今所不取也。" }
      - { type: j, text: "震下坎上。屯：元、亨、利、貞。剛柔始交，是以“屯”也。不交則否，故屯乃大亨也。大亨則無險，故“利貞”。" }
      - { type: z, text: "正義曰：屯，難也。剛柔始交而難生，初相逢遇，故云“屯，難也”。以陰陽始交而為難，因難物始大通，故“元亨”也。萬物大亨，乃得利益而貞正，故“利貞”也。但“屯”之四德，劣於“乾”之四德，故屯乃元亨，亨乃利貞。“乾”之四德，無所不包。此即“勿用有攸往”，又別言“利建侯”，不如乾之無所不利。此已上說“屯”之自然之四德，聖人當法之。" }
      - { type: j, text: "勿用有攸往，往，益“屯”也。利建侯。得王則定。" }
      - { type: z, text: "正義曰：“勿用有攸往，利建侯”者，以其屯難之世，世道初創，其物未寧，故宜“利建侯”以寧之。此二句釋人事也。" }
      - { type: j, text: "《彖》曰：屯，剛柔始交而難生，動乎險中，大亨貞。始於險難，至於大亨，而後全正，故曰“屯，元亨利貞”。" }
      - { type: z, text: "“彖曰”至“大亨貞”。○正義曰：“屯，剛柔始交而難生”者，此一句釋屯之名，以剛柔二氣始欲相交，未相通感，情意未得，故“難生”也。若剛柔已交之後，物皆通泰，非復難也。唯初始交時而有難，故云“剛柔始交而難生”。“動乎險中，大亨貞”者，此釋四德也。坎為險，震為動，震在坎下，是動於險中。初動險中，故屯難動而不已；將出於險，故得“大亨貞”也。大亨即元亨也，不言“利”者，利屬於貞，故直言“大亨貞”。" }
      - { type: j, text: "雷雨之動滿盈。雷雨之動，乃得滿盈，皆剛柔始交之所為。" }
      - { type: z, text: "“雷雨之動滿盈”。○正義曰：周氏云：“此一句覆釋亨也”。但屯有二義，一難也，一盈也。上既以剛柔始交釋屯難也，此又以雷雨二象解盈也。言雷雨二氣，初相交動，以生養萬物，故得滿盈，即是亨之義也。覆釋“亨”者，以屯難之世不宜亨通，恐亨義難曉，故特釋之。此己下說屯之自然之象也。○注“雷雨之動乃得滿盈”。○正義曰：“雷雨之動，乃得滿盈”者，周氏、褚氏云：“釋亨也，萬物盈滿則亨通也”。“皆剛柔始交之所為”者，雷雨之動，亦陰陽始交也。萬物盈滿，亦陰陽而致之，故云“皆剛柔始交之所為”也。若取屯難，則坎為險，則上云“動乎險中”是也。若取亨通，則坎為雨，震為動，此云“雷雨之動”是也。隨義而取象，其義不一。" }
      - { type: j, text: "天造草昧，宜建侯而不寧。“屯”體不寧，故利“建侯”也。“屯”者，天地造始之時也，造物之始，始於冥昧，故曰“草昧”也。處造始之時，所宜之善，莫善“建侯”也。" }
      - { type: z, text: "“天造草昧至不寧”。○正義曰：釋“利建侯”也。草謂草創，昧謂冥昧，言天造萬物於草創之始，如在冥昧之時也。於此草昧之時，王者當法此屯卦，宜建立諸侯以撫卹萬方之物，而不得安居於事。此二句以人事釋“屯”之義。○注“屯體不寧”。○正義曰：“屯體不寧”者，以此屯邅險難，其體不寧，故“宜建侯”也。“造物之始，始於冥昧”者，“造物之始”，即天造草昧也。草謂草創初始之義，“始於冥昧”者，言物之初造，其形未著，其體未彰，故在幽冥闇昧也。" }
      - { type: j, text: "《象》曰：云雷屯，君子以經綸。君子經綸之時。" }
      - { type: z, text: "正義曰：“經”謂經緯，“綸”謂綱綸，言君子法此屯象有為之時，以經綸天下，約束於物，故云“君子以經綸”也。姚信云：“綸謂綱也，以織綜經緯。”此君子之事，非其義也。劉表、鄭玄云“以綸為淪字”，非王本意也。" }
      - { type: j, text: "初九：磐桓，利居貞，利建侯。處屯之初，動則難生，不可以進，故“磐桓”也。處此時也，其利安在？不唯居貞建侯乎？夫息亂以靜，守靜以侯，安民在正，弘正在謙。屯難之世，陰求於陽，弱求於強，民思其主之時也。初處其首而又下焉。爻備斯義，宜其得民也。" }
      - { type: z, text: "“初九”至“利建侯”。○正義曰：磐桓，不進之貌。處屯之初，動即難生，故“磐桓”也。不可進，唯宜利居處貞正，亦宜建立諸侯。○注“息亂以靜”至“得民也”。○正義曰：“息亂以靜”者，解“利居貞”也。“守靜以侯”者，解“利建侯”也。“安民在正”者，解“貞”也。“弘正在謙”者，取象其“以貴下賤”也。言弘大此屯，正在於謙也。“陰求於陽，弱求於強”者，解“大得民”也。" }
      - { type: j, text: "《象》曰：雖“磐桓”，志行正也。不可以進，故“磐桓”也。非為宴安棄成務也，故“雖磐桓，志行正也”。" }
      - { type: z, text: "“《象》曰”至“志行正也”。○正義曰：言初九雖磐桓不進，非苟求宴安，志欲以靜息亂，故居處貞也。非是苟貪逸樂，唯志行守正也。○注“非為宴安棄成務”。○正義曰：“非為宴安棄成務”者，言巳止為前進有難，故磐桓且住，非是苟求宴安，棄此所成之務而不為也。言身雖住，但欲以靜息亂也。" }
      - { type: j, text: "以貴下賤，大得民也。陽貴而陰賤也。" }
      - { type: z, text: "正義曰：貴謂陽也，賤謂陰也。言初九之陽在三陰之下，是“以貴下賤”。屯難之世，民思其主之時，既能“以貴下賤”，所以大得民心也。" }
      - { type: j, text: "六二：屯如邅如，乘馬班如，匪寇婚媾。女子貞不字，十年乃字。志在乎“五”，不從於初。屯難之時，正道未行，與初相近而不相得，困於侵害，故屯邅。“屯”時方屯難，正道未通，涉遠而行，難可以進，故曰：“乘馬班如”也。寇謂初也。無“初”之難，則與“五”婚矣，故曰“匪寇婚媾”也。“志在於五”，不從於初，故曰“女子貞不字”也。屯難之世，勢不過十年者也。十年則反常，反常則本志斯獲矣。故曰“十年乃字”。" }
      - { type: z, text: "“六二”至“十年乃字”。○正義曰：“屯如邅如”者，屯是屯難，邅是邅回，如是語辭也。言六二欲應於九五，即畏初九逼之，不敢前進，故“屯如邅如”也。“乘馬班如”者，《子夏傳》云：“班如者，謂相牽不進也”。馬季長云：“班，班旋不進也”。言二欲乘馬往適於五，正道未通，故班旋而不進也。“匪寇婚媾”者，寇謂初也，言二非有初九與巳作寇害，則得其五為婚媾矣。馬季長云：“重婚曰媾。”鄭玄云：“媾猶會也。”“女子貞不字”者，貞，正也，女子，謂六二也，女子以守貞正，不受初九之愛，“字”訓愛也。“十年乃字”者，十年難息之後，即初不害巳也。乃得往適於五，受五之字愛。十者數之極，數極則變，故云“十年”也。" }
      - { type: j, text: "《象》曰：六二之難，乘剛也。十年乃字，反常也。" }
      - { type: z, text: "正義曰：“六二之難，乘剛也”者，釋所以“屯如邅如”也。有畏難者，以其乘陵初剛，不肯從之，故有難也。“十年乃字，反常”者，謂十年之後，屯難止息，得“反常”者，謂反常道，即二適於五，是其得常也。巳前有難，不得行常，十年難息，得反歸於常以適五也。此爻因六二之象，以明女子婚媾之事，即其餘人事，亦當法此。猶如有人逼近於強，雖遠有外應，未敢苟進，被近者所陵，經夕之後，乃得與應相合。是知萬事皆象於此，非唯男女而巳。諸爻所云陰陽、男女之象，義皆仿於此。" }
      - { type: j, text: "六三：即鹿無虞，惟入於林中。君子幾，不如舍，往吝。三既近五而無寇難，四雖比五，其志在初，不妨已路，可以進而無屯邅也。見路之易，不揆其志，五應在二，往必不納，何異無虞以從禽乎？雖見其禽而無其虞，徒入於林中，其可獲乎？幾，辭也。夫君子之動，豈取恨辱哉！故不如舍，“往吝，窮也”。" }
      - { type: z, text: "“六三”至“舍往吝”。○正義曰：“即鹿無虞”者，即，就也。虞謂虞官，如人之田獵，欲從就於鹿，當有虞官助已，商度形勢可否，乃始得鹿，若無虞官，即虛入於林木之中，必不得虞，故云“唯入於林中”。此是假物為喻。今六三欲往從五，如就鹿也。五自應二，今乃不自揆度彼五之情納已以否，是“無虞”也。即徒往向五，五所不納，是徒入於林中。“君子幾，不如舍”者，幾，辭也。夫君子之動，自知可否，豈取恨辱哉！見此形勢，即不如休舍也。言六三不如舍此求五之心勿往也。“往吝”者，若往求五，即有悔吝也。○注“見路之易，不揆其志”。○正義曰：“見路之易，不揆其志”者，三雖比四，四不害已，身夫屯邅，是路之平易，即意欲向五而不預先揆度五之情意納已以否，是“無虞”也。獵人先遣虞官商度鹿之所有，猶若三欲適五，先遣人測度五之情意。幾為語辭，不為義也。知此“幾”不為事之幾微，凡“幾微”者，乃從無向有，其事未見，乃為“幾”也。今“即鹿無虞”，是巳成之事，事巳顯者，故不得為幾微之義。" }
      - { type: j, text: "《象》曰：“即鹿無虞”，以從禽也。君子舍之，“往吝”窮也。" }
      - { type: z, text: "正義曰：“即鹿無虞，以從禽”者，言即鹿當有虞官，即有鹿也，若無虞官，以從逐於禽，亦不可得也。“君子舍之，往吝窮”者，君子見此之時，當舍而不往。若往則有悔吝窮苦也。" }
      - { type: j, text: "六四：乘馬班如，求婚媾，往吉，無不利。二雖比初，執貞不從，不害巳志者也。求與合好，往必見納矣。故曰“往吉，無不利”。" }
      - { type: z, text: "正義曰：六四應初，故“乘馬”也。慮二妨巳路，故初時班如旋也。二既不從於初，故四求之為婚，必得媾合，所以“往吉，無不利”。" }
      - { type: j, text: "《象》曰：求而往，明也。見彼之情狀也。" }
      - { type: z, text: "正義曰：言求初而往婚媾，明識初與二之情狀，知初納巳，知二不害巳志，是其明矣。" }
      - { type: j, text: "九五：屯其膏，小貞吉，大貞兇。處屯難之時，居尊位之上，不能恢弘博施，無物不與，拯濟微滯，亨於群小，而系應在二，屯難其膏，非能光其施者也。固志同好，不容他間，小貞之吉，大貞之兇。" }
      - { type: z, text: "“九五屯其膏”至“大貞兇”。○正義曰：“屯其膏”者，“膏”謂膏澤恩惠之類，言九五既居尊位，當恢弘博施，唯系應在二，而所施者褊狹，是“屯難其膏”。“小貞吉，大貞兇”者，貞，正也。出納之吝謂之有司，是小正為吉。若大人不能恢弘博施，是大正為兇。○注“固志同好，不容他間”。○正義曰：“固志同好，不容他間”者，間者，廁也。五應在二，是堅固其志，在於同好，不容他人間廁其間也。" }
      - { type: j, text: "《象》曰：“屯其膏”，施未光也。" }
      - { type: j, text: "上六：乘馬班如，泣血漣如。處險難之極，下無應援，進無所適，雖比於五，五屯其膏，不與相得，居不獲安，行無所，適窮困闉厄，無所委仰，故“泣血漣如”。" }
      - { type: z, text: "正義曰：處險難之極，而下無應援，若欲前進，即無所之適，故“乘馬班如”，“窮困闉厄，無所委仰”，故“泣血漣如”。" }
      - { type: j, text: "《象》曰：“泣血漣如”，何可長也？" }
      - { type: z, text: "正義曰：“何可長”者，言窮困泣血，何可久長也？" }
      - { type: j, text: "坎下艮上。蒙：亨。匪我求童蒙，童蒙求我。初筮告，再、三瀆，瀆則不告。“筮”，筮者決疑之物也。童蒙之來求我，欲決所惑也。決之不一，不知所從，則復惑也。故初筮則告，再、三則瀆。瀆，蒙也。能為初筮，其唯二乎？以剛處中，能斷夫疑者也。" }
      - { type: z, text: "“蒙亨”至“瀆則不告”。○正義曰：蒙者，微昧闇弱之名。物皆蒙昧，唯原亨通，故云“蒙、亨”。“匪我求童蒙，童蒙求我”者，物既闇弱而意原亨通，即明者不求於闇，即匪我師德之高明往求童蒙之闇，但闇者求明，明者不諮於闇，故云“童蒙求我”也。“初筮告”者，初者，發始之辭；筮者，決疑之物。童蒙既來求我，我當以初始一理剖決告之。“再三瀆，瀆則不告”者，師若遲疑不定，或再或三，是褻瀆，瀆則不告。童蒙來問，本為決疑，師若以廣深二義再三之言告之，則童蒙聞之，轉亦瀆亂，故不如不告也。自此以上，解“蒙亨”之義。順此上事，乃得“亨”也。故“亨”文在此事之上也。不云“元”者，謂時當蒙弱，未有元也。○注“初筮告”。○正義曰：“初筮則告”者，童蒙既來求我，我當以初心所念所筮之義，一理而剖告之。“再三則瀆，瀆，蒙也”者，若以棄此初本之意，而猶豫遲疑，岐頭別說，則童蒙之人，聞之褻瀆而煩亂也。故“再三則瀆，瀆，蒙也”。“能為初筮，其唯二乎”者，以《彖》云“初筮告，以剛中”者，剛而得中故知是二也。" }
      - { type: j, text: "利貞。“蒙”之所利，乃利正也。夫明莫若聖，昧莫若蒙。蒙以養正乃聖功也。然則養正以明，失其道矣。" }
      - { type: z, text: "“利貞”。○正義曰：貞，正也。言蒙之為義，利以養正，故《彖》云“蒙以養正”，乃“聖功也”。若養正以明，即失其道也。○注“然則養正以明失其道”。○正義曰：“然則養正以明，失其道”者，言人雖懷聖德，若隱默不言，人則莫測其淺深，不知其大小，所以聖德彌遠而難測矣。若彰顯其德，苟自發明，即人知其所為，識其淺深。故《明夷》注云“明夷蒞眾，顯明於外，巧所避”是也。此卦，《系辭》皆以人事明之。" }
      - { type: j, text: "《彖》曰：蒙，山下有險，險而止，蒙。退則困險，進則閡山，不知所適，蒙之義也。" }
      - { type: z, text: "正義曰：“山下有險”者，坎在艮下，是山下有險。艮為止，坎上遇止，是險而止也。恐進退不可，故蒙昧也。此釋蒙卦之名。" }
      - { type: j, text: "“蒙，亨”，以亨行，時中也。時之所願，惟願“亨”也。以亨行之，得“時中”也。" }
      - { type: z, text: "正義曰：疊“蒙亨”之義，言居“蒙“之時，人皆願“亨”。若以亨道行之於時，則得中也。故云“時中”也。" }
      - { type: j, text: "“匪我求童蒙，童蒙求我”，志應也。“我”謂非“童蒙”者也。非“童蒙”者，即陽也。凡不識者求問識者，識者不求所告；闇者求明，明者不諮於闇。故《蒙》之為義，“匪我求童蒙，童蒙求我”也。童蒙之來求我，志應故也。" }
      - { type: z, text: "正義曰：以童蒙闇昧之志，而求應會明者，故云“志應”也。" }
      - { type: j, text: "初筮告，以剛中也。謂二也。二為眾陰之主也，無剛失中，何由得初筮之告乎？再、三瀆，瀆則不告。瀆，蒙也。蒙以養正，聖功也。" }
      - { type: z, text: "正義曰：“再三瀆，瀆則不告。瀆，蒙”者，所以再三不告，恐瀆亂蒙者。自此以上，《彖》辭總釋“蒙亨”之義。“蒙以養正，聖功也”者，能以蒙昧隱默自養正道，乃成至聖之功。此一句釋經之“利貞”。" }
      - { type: j, text: "《彖》曰：山下出泉，蒙。山下出泉，未知所適，蒙之象也。" }
      - { type: z, text: "正義曰：山下出泉，未有所適之處，是險而止，故蒙昧之象也。" }
      - { type: j, text: "君子以果行育德。“果行”者，初筮之義也。“育德”者，養正之功也。" }
      - { type: z, text: "正義曰：君子當發此蒙道，以果決其行，告示蒙者，則“初筮之義”。“育德”謂隱默懷藏，不自彰顯，以育養其德。“果行”、“育德”者，自相違錯，若童蒙來問，則果行也，尋常處眾則育德，是不相須也。" }
      - { type: j, text: "初六：發蒙，利用刑人，用說桎梏，以往吝。處蒙之初，二照其上，故蒙發也。蒙發疑明，刑說當也。“以往吝”，刑不可長。" }
      - { type: z, text: "“初六”至“以往吝”。正義曰：“發蒙”者，以初近於九二，二以陽處中，而明能照闇，故初六以能發去其蒙也。“利用刑人，用說桎梏”者，蒙既發去，無所疑滯，故利用刑戮於人，又利用說去罪人桎梏，以蒙既發去，疑事顯明，刑人說桎梏皆得當。在足曰桎，在手曰梏。《小雅》云：“杻謂之梏，械謂之桎。”“以往吝”者，若以正道而往，即其事益善矣；若以刑人之道出往，往之即有鄙吝。" }
      - { type: j, text: "《象》曰：“利用刑人‘，以正法也。刑人之道，道所惡也。以正法制，故刑人也。" }
      - { type: z, text: "正義曰：且刑人之道乃賊害於物，是道之所惡，以利用刑人者，以正其法制，不可不刑矣。故刑罰不可不施於國，鞭撲不可不施於家。案：此經刑人、說人二事，《象》直云“利用刑人”一者，但舉刑重故也。" }
      - { type: j, text: "九二：包蒙吉，納婦吉，子克家。以剛居中，童蒙所歸，包而不距則遠近鹹至，故“包蒙吉”也。婦者，配巳而成德者也。體陽而能包蒙，以剛而能居中，以此納配物莫不應，故“納婦吉”也。處於卦內，以剛接柔，親而得中，能幹其任，施之於子，克家之義。" }
      - { type: z, text: "“九二”至“子克家”。正義曰：“包”謂包含，九二以剛居中，童蒙悉來歸己，九二能含容而不距，皆與之決疑，故得吉也。九二以剛居中，陰來應之。“婦”謂配也，故納此匹配而得吉也。此爻在下體之中，能包蒙納婦，任內理中，幹了其任，即是子孫能克荷家事，故云“子克家”也。○注“親而得中”。○正義曰：“親而得中”者，言九二居下卦之中央，上下俱陰，以己之兩陽迎接上下二陰，陰陽相親，故云“親而得中”也。“能幹其任”者，既能包蒙，又能納匹，是能幹其任。" }
      - { type: j, text: "《象》曰：“子克家”，剛柔節也。" }
      - { type: z, text: "正義曰：以陽居於卦內，接待群陰，是剛柔相接，故克幹家事也。" }
      - { type: j, text: "六三：勿用取女。見金夫，不有躬，無攸利。童蒙之時，陰求於陽，晦求於明，各求發其昧者也。六三在下卦之上，上九在上卦之上，男女之義也。上不求三而三求上，女先求男者也。女之為體，正行以待命者也。見剛夫而求之，故曰“不有躬”也。施之於女行在不順故“勿用取女”，而“無攸利”。" }
      - { type: z, text: "“六三”至“無攸利”。○正義曰：“勿用取女”者，女謂六三，言勿用取此六三之女。所以不須者，此童蒙之世，陰求於陽，是女求男之時也。“見金夫”者，謂上九以其剛陽，故稱“金夫”。此六三之女，自往求見“金夫”。女之為禮，正行以待命而嫁。今先求於夫，是為女不能自保其躬，固守貞信，乃非禮而動，行既不順，若欲取之，無所利益，故云“不有躬，無攸利”也。" }
      - { type: j, text: "《象》曰：“勿用取女”，行不順也。" }
      - { type: z, text: "正義曰：釋“勿用取女”之義。所以勿用取此女者，以女行不順故也。" }
      - { type: j, text: "六四：困蒙，吝。獨遠於陽，處兩陰之中，闇莫之發，故曰“困蒙”也。困於蒙昧，不能比賢以發其志，亦以鄙矣，故曰“吝”也。" }
      - { type: z, text: "正義曰：此釋六四爻辭也。六四在兩陰之中，去九二既遠，無人發去其童蒙，故曰困於蒙昧而有鄙吝。" }
      - { type: j, text: "《象》曰：“困蒙”之吝，獨遠實也。陽稱實也。" }
      - { type: z, text: "“《象》曰”至“獨遠實也”。○正義曰：“獨遠實’者，實謂九二之陽也。九二以陽，故稱實也。六三近九二，六五近上九，又應九二，唯此六四既不近二，又不近上，故云“獨遠實也”。○注“陽實也”。○正義曰：陽主生息，故稱實。陰主消損，故不得言實。" }
      - { type: j, text: "六五：童蒙吉。以夫陰質居於尊位，不自任察而委於二，付物以能，不勞聰明，功斯克矣，故曰“童蒙吉”。" }
      - { type: z, text: "正義曰：言六五以陰居於尊位，其應在二，二剛而得中，五則以事委任於二，不勞巳之聰明，猶若童稚蒙昧之人，故所以得吉也。" }
      - { type: j, text: "《象》曰：“童蒙”之吉，順以巽也。委物以能，不先不為，“順以巽也”。" }
      - { type: z, text: "“《象》曰”至“順以巽也”。正義曰：“順以巽也”，釋童蒙之吉，巽以順也，猶委物於二。順謂心順，巽謂貌順。故褚氏云：“順者，心不違也。巽者，外跡相卑下也。”○注“委物以能”至“順以巽也”。○正義曰：“委物以能”，謂委付事物與有能之人，謂委二也。“不先不為”者，五雖居尊位，而專委任於二，不在二先而首唱，是順於二也。“不為”者，謂不自造為，是委任二也。不先於二，是心順也；不自造為，是貌順也。" }
      - { type: j, text: "上九：擊蒙，不利為寇，利御寇。處蒙之終，以剛居上，能擊去童蒙，以發其昧者也，故曰“擊蒙”也。童蒙原發而已能擊去之，合上下之願，故莫不順也。為之捍御，則物鹹附之。若欲取之，則物鹹叛矣，故“不利為寇，利御寇”也。" }
      - { type: z, text: "正義曰：處蒙之終，以剛居上，能擊去眾陰之蒙，合上下之願，故莫不順從也。若因物之來即欲取之而為寇害，物皆叛矣，故“不利為寇”也。若物從外來，為之捍御，則物鹹附之，故“利用御寇”也。" }
      - { type: j, text: "《象》曰：利用御寇，上下順也。" }
      - { type: z, text: "正義曰：所宜利為物御寇者，由上下順從故也。言此爻既能發去眾蒙，以合上下之願，又能為之御寇，故上下彌更順從也。" }
