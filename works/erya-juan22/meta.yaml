aboutHtml: |-
  <h2>關於此卷</h2>
  <p>《爾雅注疏》為宋邢昺疏，以晉郭璞注為本，為十三經注疏之一。爾雅十九篇，為訓詁之祖、五經之通路，此卷以宋刻本版式數字重刻，半葉八行、行十六字、注文雙行二十五字。</p>
  <p>卷二十二收釋畜第十九，經注疏全帙。</p>
