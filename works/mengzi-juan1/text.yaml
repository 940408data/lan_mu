# 孟子注疏卷1（孫奭疏）：j 為經文＋漢趙岐注，z 為疏文。
sections:
  - id: juan1
    name: 正文
    blocks:
      - { type: j, text: "朝散大夫《尚书》兵部郎中充龙图阁待制知通进银台司兼门下封事兼判国子监止护军赐紫金鱼袋（臣）孙撰" }
      - { type: j, text: "夫总群圣之道者，莫大乎六经。绍六经之教者，莫尚乎《孟子》。自昔仲尼既没，战国初兴，至化陵迟，异端并作，仪、衍肆其诡辩，杨、墨饰其淫辞。遂致王公纳其谋，以纷乱於上；学者循其踵，以蔽惑於下。犹洚水怀山，时尽昏垫，繁芜塞路，孰可芟夷？惟孟子挺名世之才，秉先觉之志，拔邪树正，高行厉辞，导王化之源，以救时弊；开圣人之道，以断群疑。其言精而赡，其旨渊而通，致仲尼之教，独尊於千古，非圣贤之伦，安能至於此乎？其书由炎汉之後，盛传於世，为之注者，则有赵岐、陆善经；为之音者，则有张镒、丁公著。自陆善经已降，其所训说，虽小有异同，而共宗赵氏。惟是音释二家，撰录俱未精当，张氏则徒分章句，漏落颇多；丁氏则稍识指归，伪谬时有。若非再加刊正，讵可通行？臣前奉敕与同判国子监王旭、国子监直讲马龟符、国子学说书吴易直、冯元等作《音义》二卷，已经进呈。今辄罄浅闻，随赵氏所说，仰效先儒释经，为之正义。凡理有所滞，事有所遗，质诸经训，与之增明。虽仰测至言，莫穷於奥妙，而广传博识，更俟於发挥。谨上。" }
      - { type: j, text: "○题辞解" }
      - { type: z, text: "正义曰：案《史记》云：“孟轲，受业子思门人，道既通，所于者不合，退与万章之徒序《诗》、《书》，述仲尼之意，作《孟子》七篇。”至嬴秦焚书坑儒，《孟子》之徒党自是尽矣。其七篇书号为诸子，故篇籍得不泯绝。汉兴，高皇未遑庠序之事，孝惠虽除挟书之律，然而公卿皆武力功臣，亦莫以为意。及孝文皇帝广游学之路，天下众书往往稍出，由是《论语》、《孟子》、《孝经》、《尔雅》皆置博士，当时乃有刘歆九种《孟子》，凡十一篇。炎汉之後，盛传於世为之注者，西京赵岐出焉。至于李唐又有陆善经出焉。自陆善经已降，其所训说虽小有异同，而咸归宗於赵氏。《隋志》云：赵岐注《孟子》十四卷。又有郑亢注《孟子》七卷。在梁时又有綦母邃《孟子》九卷。《唐书·艺文志》又云：《孟子》注凡四家，有三十五卷。至于皇朝《崇文总目》，《孟子》独存赵岐注十四卷，唐陆善经注《孟子》七卷，凡二家二十一卷。今校定仍据赵注为本。今以为主题辞者，赵岐谓此书《孟子》之所作，所以题号《孟子》之书，其题辞为《孟子》而作，故曰《孟子题辞》。" }
      - { type: j, text: "《孟子题辞》者，所以题号《孟子》之书本，末指义文辞之表也。" }
      - { type: z, text: "“孟子”至“表也”。○正义曰：此叙《孟子题辞》为《孟子》书之序也。张镒释云：《孟子题辞》即序也，赵注尚异，故不谓之序而谓之题辞。孟，姓也。" }
      - { type: z, text: "正义曰：此叙孟氏之所自也。案鲁史桓公之後，桓公子庄公为君，庶子公子庆父、公子叔牙、公子季友。仲孙是庆父之後，叔孙是叔牙之後，季孙是季友之後。其後子孙皆以仲、叔、季为氏。至仲孙氏後世，改仲曰孟。又云：孟庶长之称也。言已是庶，不敢与庄公为伯、仲、叔、季之次，故取庶长为始也。又定公六年有仲孙何忌如晋，《左传》即曰孟懿子往。是孟氏为仲孙氏之後改孟也。子者，男子之通称也。" }
      - { type: z, text: "正义曰：此叙凡称子之例也。案经传凡敌者相谓皆言吾子，或直言子，称师亦曰子。是子者，男子有德之通称也。《公羊传》云“子沈子曰”，何休云：“沈子称子冠氏上者，著其为师也。不但言子曰者，辟孔子也。”然则後人称先师则以子冠氏上，所以明其为师也。如子公羊子、子沈子之类是也。凡书传直言子曰者，皆指孔子，以其师范来世，人尽知之，故不必言氏也。孟轲有德，亦足以师范来世，宜其以氏冠子，使後人知之，非独云有孔子，又有孟子称为子焉。此书，孟子之所作也，故总谓之《孟子》。" }
      - { type: z, text: "正义曰：此叙孟子所作此书，故总名号为《孟子》也。唐林慎思《续孟子书》二卷，以谓《孟子》七篇，非轲自著，乃弟子共记其言。韩愈亦云：孟轲之书，非轲自著，轲既没，其徒万章、公孙丑相与记轲所言焉。今赵氏为《孟子》之所作，故？谓之《孟子》者，盖亦有由尔。" }
      - { type: j, text: "其篇目，则各自有名。" }
      - { type: z, text: "正义曰：此叙孟子七篇各有名目也。故《梁惠王》、《公孙丑》、《滕文公》、《离娄》、《万章》、《告子》、《尽心》是也。孟子，邹人也。名轲，字则未闻也。邹本《春秋》邾子之国，至孟子时改曰邹矣。国近鲁，後为鲁所并。又言邾为楚所并，非鲁也，今邹县是也。" }
      - { type: z, text: "正义曰：此叙孟子姓字及所居之国也。案《史记》列传云：“孟轲，邹人也。”不纪其字，故赵氏云字则未闻焉。後世或云字子舆。云“邹本春秋邾子之国”至“是也”者，案《春秋》隐公元年书“公及仪父盟于蔑”，杜注云：“邾，今鲁国邹县是也。”仪父事齐桓以奖王室，王命以为邾子。《说文》云：“邹，孔子乡也。一云：“邹，鲁附庸之国。”云“国近鲁”者，案《左传》哀公七年，“公伐邾，及范门，犹闻锺声”。又曰：“鲁击柝，闻於邾。”杜注云：“范门，邾郭门也。”是为鲁所并。云“为楚所并”者，案《史记》云：“鲁顷公二十四年，楚考烈王伐灭鲁。”是又为楚所并。" }
      - { type: j, text: "或曰：孟子，鲁公族孟孙之後。故孟子仕於齐，丧母而归葬於鲁也。三桓子孙既以衰微，分他国。" }
      - { type: z, text: "“或曰”至“他国”。○正义曰：此叙孟子为鲁公族孟孙之後也。其说在孟姓之段。云“仕於齐，葬於鲁”者，公孙丑篇之文也。《春秋》定公六年，季孙斯、仲孙何忌如晋。十年，叔孙仇如齐。哀公二十七年，公患三桓之後，欲以诸侯去之。杜预云：欲求诸侯以逐三桓後。至鲁顷公时，鲁遂绝祀。由是三桓子孙衰微。" }
      - { type: j, text: "《孟子》生有淑质，夙丧其父，幼被慈母三迁之教，长师孔子之孙子思，治儒述之道，通五经尤长於《诗》、《书》。" }
      - { type: z, text: "“孟子”至“诗书”。○正义曰：此叙孟子自幼至长之事也。案《史·列女传》云：孟轲母，其舍近墓，孟子少嬉游为墓间之事，孟母曰：此非吾所以处子也。乃去舍市，傍其嬉戏乃贾人卖之事。又曰：此非吾所以处子也。复徙舍学宫之傍，其嬉戏乃设俎豆揖逊进退。孟母曰：此真可以居吾子矣。遂居焉。及孟子既学而归，孟母问学所至，孟子自若也。孟母以刀断机，曰：子废学，若吾断机。孟子惧，旦夕勤学不息，师子思，遂成名儒。又案《史记》云：孟轲受业於子思之门人，道既通，所干不合，退与万章之徒叙《诗》、《书》。故赵氏云：“尤长於《诗》、《书》。" }
      - { type: j, text: "周衰之末，战国纵横，用兵争强以相侵夺，当世取士，务先权谋以为上贤。先王大道陵迟隳废，异端并起，若杨朱、墨翟放荡之言以干时感众者非一。孟子闵悼尧、舜、汤、文、周、孔之业将遂湮微，正涂壅底，仁义荒怠，佞伪驰骋，红紫乱朱。" }
      - { type: z, text: "“周衰之末”至“乱朱”。○正义曰：此叙周衰战国纵横之时，大道陵迟也。案太史公曰：秦纪至犬戎败幽王，周东迁洛邑，秦襄公始封为诸侯，作西，用事上帝，於是僭端见矣。自後陪臣执政，大夫世禄，六卿分晋，及田常弑简公而相齐国，诸侯晏然不讨，海内争於战攻，於是六国盛焉。其务在强兵并敌谋诈用，而纵横长短之说起。故秦用商君富国强兵，楚、魏用吴起战胜弱敌，齐威宣王用孙子、田忌之徒而诸侯东面朝齐。天下於是方务於合纵连横，以攻伐为贤，而杨朱、墨翟以兼爱自为，以害仁义。孟轲乃述唐虞三代之德，退叙《诗》、《书》，述孔子之意。当此之时，念非《孟子》有哀悯之心，则尧、舜、汤、文、周、孔之业将遂沉小，而正道郁塞，仁义荒怠，佞伪并行，红紫乱朱矣。杨雄云：古者杨、墨塞路，孟子辞而辟之。云湮微者，湮，沉也；微，小也。云壅底者，言正道郁塞而不明也。云仁义荒芜者，《释名》曰：仁，忍也，好生恶杀，善恶含忍也。义，宜也，裁制事物使合宜也。《庄子》云：爱仁利物之谓仁。杨子云：事得其宜谓之义。《尚书》云：无怠无荒。孔注云：迷乱曰荒，怠，懈怠也。云佞伪驰骋者，《论语》云：仁而不佞。孔云：佞，口辞捷给，为人所憎恶者，《说文》云：伪，诈也。驰骋，奔走。云红紫乱朱者，《论语》云：恶紫之夺朱也。孔注云：朱，正色；紫，间色。案皇氏云：青、赤、黄、白、黑，五方正色也。不正谓五方间色，绿、红、碧、紫、亚黄是也。青是东方正，绿是东方间，东为木木，色青。木克土，土色黄，并以所克为间。故绿色，青、黄也。朱是南方正，红是南方间，南为火，火色赤，火克金，金色白，故红色，赤、白也。白是西方正，碧是西方间，西为金，金色白，金克木，故碧色，青、白也。黑是北方正，紫是北方间，北方水，水色黑，水克火，火色赤，故紫色，赤、黑也。黄是中央正，亚黄是中央间，中央土，土色黄，土克水，水色黑，故亚黄色，黄、黑也。是正间然。" }
      - { type: j, text: "於是则慕仲尼，周流忧世，遂以儒道游於诸侯，思济斯民。然由不肯枉尺直寻，时君咸谓之迂阔於事，终莫能听纳其说。" }
      - { type: z, text: "“於是”至“其说”。○正义曰：此叙孟子周流聘世，时君不听纳其说也。言孟子心慕孔子遍忧其世，遂以儒家仁义之道历游诸侯之国，思欲救济天下之民。然而诸侯不能尊敬之者，孟子亦且不见也，虽召之而不往，以其不肯枉尺以直寻。十寸曰尺，八尺曰寻。《史记》云：孟子道既通，游事齐，齐宣王不能用。梁，梁惠王不果所言。是皆以为迂远而阔於事情，而莫有能听纳其说者。孟子亦自知遭苍姬之讫录，值炎刘之未奋。进不得佐兴唐虞雍熙之和，退不能信三代之馀风，耻没世而无闻焉。是故垂宪言以诒後人。仲尼有云：我欲托之空言，不如载之行事之深切著明也。" }
      - { type: z, text: "“孟子”至“著明”也。○正义曰：此叙孟子自知道不行於世，耻没世无名闻，故慕仲尼托之空言而载之行事也。言孟子生於六国之时，当衰周末，又遇汉之未兴，上不得辅起唐虞二世之治，下不能伸夏商周三代之风化，自愧没一世而无名闻，所以垂法言以贶後人。故托慕仲尼周流忧世，既不遇，乃退而与万章之徒叙《诗》、《书》而作此七篇也。赵氏意其然，乃引孔子之言而明孟子载七篇之意也。云苍姬者，周以木德王，故号为苍姬，姬，周姓也。云炎刘者，汉以火德王，故号为炎刘，刘，高祖之姓氏也。" }
      - { type: j, text: "於是退而论集所与高第弟子公孙丑、万章之徒难疑答问，又自撰其法度之言，著书七篇，二百六十一章三万四千六百八十五字。包罗天地，揆叙万类，仁义道德性命祸福粲然靡所不载。" }
      - { type: z, text: "“於是”至“不载”。○正义曰：此叙孟子退而著述篇章之数也。《史记》云：孟子所干者不合，退而与万章之徒叙《诗》、《书》，述仲尼之意，作《孟子》七篇。云二百六十一章者，合七篇之章数言也。据赵氏分章则《梁惠王》篇凡二十有一章《公孙丑》篇凡二十有三章《滕文公》篇凡十有五章《离娄》篇凡六十一章《万章》篇凡十有八章《告子》篇凡三十有六章《尽心》篇凡八十有四章总而计之，是二百六十一章也。云三万四千六百八十五字者，合七篇而言也。今计《梁惠王》篇凡五千三百三十三字，《公孙丑》篇凡五千一百二十字，《滕文公》篇凡四千五百三十三字，《离娄》篇凡四千二百八十五字，《万章》篇凡五千一百二十字，《告子》篇凡五千五百三十五字，《尽心》篇凡四千一百五十九字，总而计之，是三万四千六百八十五字也。云“包罗天地”至“靡所不载”者，言此七篇之书，大而至於天地，微而至於昆草木，又次而至於性命祸福，无有不载者也。然而篇所以七者，盖天以七纪璇玑运度，七政分离，圣以布曜，故法之也。章所以二百六十一者，三时之日数也。不敢比《易》当期之数，故取於三时。三时者，成岁之要时，故法之也。三万四千六百八十五字者，可以行五常之道，施七政之纪，故法五七之数而不敢盈也已。" }
      - { type: j, text: "帝王公侯遵之，则可以致隆平，颂清庙。卿、大夫、士蹈之，则可以尊君父，立忠信。守志厉操者仪之，则可以崇高节，抗浮云。" }
      - { type: z, text: "“帝王”至“浮云”。○正义曰：此叙《孟子》之七篇书为要者也。言上而帝王遵循之，则可以兴升平之治，次而公侯遵循之，则可以颂清庙。云“颂清庙”者，言公侯可以此助祭于天子之庙也。《诗》有《清庙》之篇以祀文王，注云：“天德清明，文王象焉，故祭而歌此诗也。”笺云：“诸侯有光明著见之德者，来助祭也。”卿、大夫、士蹈之，则可以尊钦君父，主其忠信。守志厉操者仪而法之，则可以此崇其高节而抗富贵如浮云。云帝王公侯卿大夫士者，盖帝以德言，王以业言，卿有诸侯之卿，有大夫之卿；士有中士，有下士。公侯是周之爵，所谓公侯伯子男，凡有五等是也。自帝王以下言之，则有公侯；自公侯以下，则有卿；自卿以下，则有大夫；自大夫以下，则止於有士也。" }
      - { type: j, text: "有风人之托物，二雅之正言，可谓直而不倨，曲而不屈，命世亚圣之大才者也。" }
      - { type: z, text: "“有风”至“者也”。○正义曰：此叙《孟子》七篇有风人二雅之言，为亚圣者也。如对惠王欲以与民同乐，故以文王灵台灵沼为言；对宣王欲以好货色与百姓同之，故以太王厥妃为言；论仁则托以为喻，论性则托以牛山之木为喻：是皆有风人之托物言也。云二雅之正言者，如引他人有心、予忖度之，乃积乃仓，古公父来朝，走马不失其驰，舍矢如破，几此之类，是皆有二雅之正言也。故可谓直其辞而且不失之倨傲，曲其辞而且不失之屈枉，而《孟子》诚为间世亚圣之大才者也。言孟子之才比於上圣人之才，但相王天而已，故谓亚圣大才。" }
      - { type: j, text: "孔子自卫反鲁，然後乐正，雅、颂各得其所，乃删《诗》、定《书》系《周易》、作《春秋》。" }
      - { type: z, text: "“孔子”至“春秋”。○正义曰：此叙引孔子退而著述之意也。案定公十四年，孔子去鲁应聘诸国。哀公十一年，自卫反鲁，是时道衰乐废，孔子来还乃正之。又哀公十一年，《左传》云：“冬卫孔文子将攻太叔，访於仲尼。仲尼曰：‘胡簋之事则尝学之，甲兵之事未之闻也。’退，命驾而行，曰：‘鸟则择木，木岂能择鸟？’文子遽止之，曰：‘圉岂敢度其私？访卫国之难也。’将止，鲁人以币召之，乃归。”杜预曰“於是自卫反鲁，然後乐正，雅、颂各得其所”是也。云乃删《诗》、定《书》、系《周易》、作《春秋》者，案《世家》云：鲁定公五年，季氏僭公室，陪臣执国命，是以鲁大夫以下皆潜离於正道，故孔子不什，退而修《诗》、《书》、《礼》、《乐》，弟子弥众，至自远方，莫不受业焉。至哀十一年自卫反鲁，乃上采契、后稷，中述商、周之盛，至幽、厉之缺，凡三百五篇，孔子皆弦歌之，以求合《韶》、《武》雅、颂之音，礼、乐自此可得而述，以备王道，成六艺。孔子晚喜《易》，序《彖》、《系》、《象》、《说卦》。孔子以《诗》、《书》、《礼》、《乐》教，弟子盖三千焉。哀十四年春狩大野，仲尼视之，曰麟也，取之曰：吾道穷矣。乃因史记作《春秋》，上至隐公，下讫哀十四年十二公，据鲁亲周，故商运之三代，约其文辞而指博，故曰：後世知丘者，其惟《春秋》；罪丘者，亦惟《春秋》。" }
      - { type: j, text: "孟子退自齐梁，述尧舜之道而著作焉，此大贤拟圣而作者也。" }
      - { type: z, text: "“孟子”至“者也”。○正义曰：此叙孟子退而拟孔子之圣而著述焉。案马迁作列传云：“《孟子》游仕齐宣王，宣王不能用。梁，梁惠王不果所言。是以退而叙《诗》、《书》，述仲尼之意，而作《孟子》七篇也。七十子之畴唬集夫子所言以为《论语》。《论语》者，五经之钅官钅害，六艺之喉衿也。" }
      - { type: z, text: "“七十子”至“衿也”。○正义曰：此叙引孔子弟子记诸善言而为《论语》也。案《汉书·艺文志》云：“《论语》者，孔子应答弟子时人及弟子相与言而接闻於夫子之语也。当时弟子各有所记，夫子既卒，门人相与集而论纂，故谓之《论语》。郑注云：“仲弓、子游、子夏等撰述。论者，纶也，以此书可以经纶世务，故曰论也。”语者，郑注《周礼》云：“答述曰语。此书所载，皆仲尼答弟子及时人之辞，故曰语，而在论字下。”钅官钅害者，车轴头铁也。《说文》云：“车键也。”喉衿者，《说文》云：喉咽也。衿，衣领也。言《论语》为五经六艺之要，如此钅官钅害与夫喉衿也。" }
      - { type: j, text: "《孟子》之书则而象之。" }
      - { type: z, text: "正义曰：此叙孟子作此七篇之书而仪象《论语》之书，是亦钅官钅官喉衿。" }
      - { type: j, text: "卫灵公问陈於孔子，孔子答以俎豆。梁惠王问利国，孟子对以仁义。宋桓欲害孔子，孔子称天生德於予。鲁臧仓毁鬲孟子，孟子曰臧氏之子焉能使予不遇哉！旨意合同，若此者众。" }
      - { type: z, text: "“卫灵公”至“遇哉”。○正义曰：此叙孟子作七篇则象《论语》之旨意也。卫灵公问陈於孔子，孔子对曰俎豆之事，此《论语》之文也。案《左传》哀公十一年云云，在孔子自卫反鲁段。云俎豆者，案《明堂位》云：“俎，有虞氏以完，夏后氏以，商以具，周以房。”俎，郑注云：完，断木为四足而已。" }
      - { type: j, text: "之言蹶也，谓中足为横距之象，《周礼》谓之距。具之言根具也，谓曲桡之也，谓足下跗也。上下两间有似於堂房。《鲁颂》曰笾豆大房，又曰夏氏以曷豆，商玉豆，周献豆。郑注云：曷，无异物之饰也。献，疏刻之。齐人谓无发为秃曷，其委曲制度，备在《礼图》。梁惠王问利国，孟子对以仁义，说在《梁惠王》篇。宋桓欲害孔子，孔子称天生德於予，是亦《论语》之文也。案《世家》：孔子宋，与弟子习礼大树下，宋司马桓欲杀孔子，拔其树，孔子去。弟子曰：可速矣。故孔子发此语，言“天生德於予”者，言孔子谓天授我以德性，德合天地，吉无不利，桓必不能害我，故曰其如予何！云“鲁臧仓毁鬲孟子，孟子曰臧氏之子焉能使予不遇哉”者，说在《惠王》下篇，凡此者，是皆旨意合若此类者甚众，故不特止此而已。" }
      - { type: j, text: "又有外书四篇，《性善》、《辩文》、《说孝经》、《为正》，其文不能弘深，不与内篇相似，似非孟子本真，後世依放而托之者也。" }
      - { type: z, text: "正义曰：凡此外书四篇，赵岐不尚，以故非之。汉中刘歆九种《孟子》有十一卷，时合此四篇。" }
      - { type: j, text: "孟子既没之後，大道遂绌，逮至亡秦，焚灭经术，坑戮儒生，孟子徒党尽矣。其书号为诸子，故篇籍得不泯绝。" }
      - { type: z, text: "“孟子”至“泯绝”。○正义曰：此叙《孟子》之书得其传也。盖孟子生於六国之时，悯道之不行，遂著述，作七篇之书。既没之後，先王之大道遂绌而不明于世，至嬴秦并六国，号为秦始皇帝，因李斯之言，遂焚书坑儒，自是孟子徒党尽矣。《秦纪》云：秦皇三十四年，丞相李斯曰：五帝不相复，三代不相袭，今陛下创大业，是万世之功，固非愚儒所知，且越言三代之事，臣请史官非《秦纪》皆烧之，非博士官所职，天下敢有藏《诗》、《书》、百家语者，悉诣守尉杂烧之。所不去者，惟有医、卜、种艺之书。故《孟子》之书号为诸子，以故篇籍不亡而得传於世。" }
      - { type: j, text: "汉兴，除秦虐禁，开延道德，孝文皇帝欲广游学之路，《论语》、《孝经》、《孟子》、《尔雅》皆置博士，後罢传记博士，独立五经而已。讫今诸经通义得引《孟子》以明事，谓之博文。" }
      - { type: z, text: "“汉兴”至“博文”。○正义曰：此叙孟子之书自汉而行也。案《汉书》云：高皇帝诛项羽，引兵围鲁，鲁中诸儒尚讲习礼，弦歌之音不绝，岂非圣人遗化好学之国哉！於是喟然兴於学。然尚有干戈，平定四海，亦未遑庠序之事。至孝惠乃除挟书之律，然公卿皆武力功臣，莫以为意。至孝文始使掌故晁错从伏生受《尚书》。《尚书》出于屋壁，《诗》始萌芽，天下众书往往颇出，犹广立於学官，为置博士。由是《论语》、《孟子》、《孝经》、《尔雅》皆置博士。及後罢传记博士，以至于後汉，惟有五经博士。博士，秦官，掌通古今，秩比六百石，员多至数十人。汉武建元五年初，置五经博士。宣帝黄龙九年，增员二十人。自是之後，五经独有博士，讫於西京赵岐之际，凡诸经通义，皆得引《孟子》以明事，故谓之博文也。" }
      - { type: j, text: "孟子长於譬喻，辞不迫切而意以独至，其言曰“说《诗》者不以文害辞，不以辞害志，以意逆志，为得之矣。”斯言殆欲使後人深求其意以解其文，不但施於说《诗》也。今诸解者往往摭取而说之，其说又多乖异不同。" }
      - { type: z, text: "正义曰：此叙孟子作七篇之书长於譬喻，其文辞不至迫切，而赵岐遂引孟子说《诗》之旨，亦欲使後人知之，但深求其意义，其旨不特止於说《诗》也。然今之解者摭取而说之，其说又多乖异而不同矣。《孟子》以来五百馀载，传之者亦已众多。" }
      - { type: z, text: "正义曰：此言《孟子》七篇之书，自孟子既没之後，至西京赵岐已五百有馀年。传七篇之书解者，亦甚众多也。" }
      - { type: j, text: "余生西京，世寻丕祚，有自来矣。少蒙义方训涉典文。知命之际，婴戚于天，遘屯离蹇，诡姓遁身，经营八之内，十有馀年，心剿形瘵，何勤如焉！尝息肩弛担於济岱之间，或有温故知新雅德君子矜我劬瘁，眷我皓首，访论稽古，慰以大道，余困吝之中，精神遐漂，靡所济集，聊欲系志於翰墨，得以乱思遗老也。惟六籍之学，先觉之士释而辩之者既已详矣。儒家惟有《孟子》闳远微妙，奥难见，宜在条理之科。於是乃述已所闻，证以经传，为之章句，具载本文，章别其旨，分为上、下，凡十四卷。究而言之，不敢以当达者，施於新学，可以寤疑辩惑。愚亦未能审於是非，後之明者见其违阙，傥改而正诸，不亦宜乎。" }
      - { type: z, text: "“余生”至“不亦宜乎”。○正义曰：此是赵岐自叙已意而为《孟子》解也。言我生自西汉之京，若以世代根寻其祚，其先与秦共祖，皆颛帝之裔孙也。其後子孙造父为穆王，攻徐偃王，大破之，以功封赵城，後因氏焉。故其来端有自矣。在幼少蒙义方教训之以先王典籍。及五十之岁间，乃零丁婴戚于天，是其时遇之险难，遂诡诈其姓氏，逃遁其身，经营治身於八之内，至十馀年，心神形色莫不焦瘁疲瘵，谓何勤如此之甚。曾因息肩弛负担於济岱之地，或有温故君子有雅德者，怜我勤苦焦瘁，见我头白，遂访我谈论，以稽考古人，仍慰我以大道。然於困吝之中，其精神亦且遐漂，未有归定，聊欲系志於笔墨，以乱思遗我老也。思其六经皆得先觉之贤士释而辩论之，亦巳甚详，於儒家独有《孟子》七篇之书，其理蕴奥，深妙难造，宜在於圣智条理之科，於是乃申述己之闻见，验以六经之传，断为章句，具载本文，章章别为意旨，分七篇作上、下篇，为十四卷。究极而言，虽不敢当於达士，然於初学者资之，亦可以晓悟其疑惑。其有是非得失，愚亦未敢审实，後之有明哲者，如见其违理疑阙者，改而正之，是其宜也。（原缺）云为之章句，分为上、下凡十四卷者，各於卷下有说，此更不言。（原缺）丁公著案：《汉书·赵岐本传》云：赵岐字卿，京兆长陵人也，尝遇疾甚，诫其子曰：吾死之後，置一圆石安墓前，刻曰汉有逸人姓赵名岐，有志无时。後疾瘳，仕至大仆卿。尝仕州郡，以廉直疾恶见惮焉。" }
