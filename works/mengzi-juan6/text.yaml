# 孟子注疏卷6（孫奭疏）：j 為經文＋漢趙岐注，z 為疏文。
sections:
  - id: juan6
    name: 正文
    blocks:
      - { type: j, text: "（滕文公者，滕，国名；文，谥也；公者，国人尊君之称也。文公於当时尊敬孟子，问以古道，犹卫灵公问陈於孔子，《论语》因以题篇。）" }
      - { type: z, text: "正义曰：前篇章首论公孙丑有政事之才，问管晏之功，故曰《公孙丑》为篇题。盖谓行政莫大乎反古之道，是以此篇滕文公尊敬孟子，问以古道，如《论语·卫灵公》问陈於孔子，遂以目为篇题，不亦宜乎。故次《公孙丑》之篇，所以揭《滕文公》为此篇之题也。此篇凡十五章赵注分之，遂成上下卷。据此上卷凡五章而已。一章言人当上则圣人，秉仁行义。二章言事莫当於奉礼，孝莫大於哀恸。三章言尊贤师智，采人之善，修学校，劝礼义，敕民事，正经界，均井田，赋什一。四章言神农务本，教於世民；许行蔽道，君臣同耕；陈相背师，降于幽谷。孟子博陈尧舜上下之叙以正之。五章言圣人缘情制礼，以直正枉。其馀十章赵注分为下卷，各有叙焉。○注“滕文公”至“题篇”。○正义曰：案《春秋》鲁隐公十一年，“滕侯、薛侯来朝，争长。滕侯曰：我，周之卜正也。乃长滕侯”，隐公七年，杜预注云：“滕国在沛国公丘县东南。”是滕文公之国，即滕侯之後也。《谥法》曰：慈惠爱民曰文，忠信接礼曰文。《论语》第十五篇，卫灵公问陈於孔子，孔子对：俎豆之事，则常闻之；军旅之事，未之学也。遂以为之篇题故也。" }
      - { type: j, text: "滕文公为世子，将之楚，过宋而见孟子。孟子道性善，言必称尧、舜。（文公为世子，使於楚而过宋，孟子时在宋，与相见也。滕侯，周文王之後也。《古纪》、《世本》录诸侯之世，滕国有考公麋，与文公之父定公相直；其子元公弘，与文公相直。似後世避讳，改“考公”为“定公”；以元公行文德，故谓之文公也。孟子与世子言人生皆有善性，但当充而用之耳；又言尧、舜之治天下，不失仁义之道，故勉世子。）世子自楚反，复见孟子。（从楚还，复诣孟子，欲重受法则也。）孟子曰：“世子疑吾言乎？夫道一而已矣。（世子疑吾言有不尽乎？天下之道一而已矣，惟有行善耳，复何疑邪。）成谓齐景公曰：‘彼丈夫也，我丈夫也，吾何畏彼哉？’（成，勇果者也。与景公言曰：尊贵者与我同丈夫，我亦能为之，何为畏彼之哉！）颜渊曰：‘舜何人也？予何人也？有为者亦若是。’（言欲有为，当若颜渊庶几、成不畏，乃能有所成耳。又以是勉世子也。）公明仪曰：‘文王我师也，周公岂欺我哉！’（公明仪，贤者也。师文王，信周公，言其知所法则也。）今滕绝长补短，将五十里也，犹可以为善国。（滕虽小，其境界长短相补，可得大五十里子男之国也，尚可以行善者也。）《书》曰：‘若药不瞑眩，厥疾不瘳。’”（《书》逸篇也。瞑眩，药攻人疾，先使瞑眩愦乱，乃是瘳愈。喻行仁当精熟，德惠乃洽也。）" }
      - { type: z, text: "“滕文公为世子”至“厥疾不瘳”。○正义曰：此章指言人上当则圣人，秉仁行义，高山景行，庶几不倦。《论语》曰“力行近仁”，盖不虚云。“滕文公为世子，将之楚，过宋而见孟子。孟子道性善，言必称尧舜”者，世子，诸侯子之称也，言滕文公为世子之时，往楚国，而在宋国过，见孟子。孟子乃与世子文公道其人性皆有善，但当行之而已；凡有言，则必以尧舜为言，盖尧舜古之受禅之帝，其治国所行之事，皆为後世所法，故言必尧舜之事，言於世子文公，以其欲勉世子文公也。文公者，後谥世子为文公也。“世子自楚反，复见孟子”者，是世子文公自宋而见孟子之後往至楚国，又自楚国反归，复见孟子於宋国也。“孟子曰：世子疑吾言乎，夫道一而已矣”者，孟子见世子复见，再有所问，乃曰：世子是疑我言有不尽，故复见乎？言道之在天下一而已，惟当善行焉，何必复疑而再欲问邪？“成谓齐景公曰：彼丈夫也，我丈夫也，吾何畏彼哉”者，孟子又引往日成尝谓齐景公曰：彼之尊贵者即丈夫也，我亦丈夫也，言即一耳，我何为畏之哉？是言我能为之，亦如彼之尊贵矣，又何畏？颜渊有曰：舜何人也，我何人也，亦言其人即一耳，但有能为之者，亦若此舜矣。故曰“舜何人也，予何人也，有为者亦若是”。“公明仪曰：文王我师也，周公岂欺我哉”者，孟子又以公明仪有曰：文王者，我师法者也，周公岂欺诬我哉？言周公我亦信而师法之耳。“今滕绝长补短，将五十里也，犹可以为善国”者，孟子谓世子，言今之滕国之地，绝长补短，其广大亦将有五十里也，尚可以为行善之国也。五十里者，子男之国也，故曰犹可以为善国。“《书》曰：若药弗瞑眩，厥疾不瘳”者，此盖今之《尚书·说命》之篇文也。孟子引《书》云：若药之攻人，人服之不以瞑眩愦乱，则其疾以不愈也。所以引此者，盖孟子恐云今滕国绝长补短、将有五十里、犹可为善国，有致世子之所嫌，乃引此而喻之，抑亦所谓良药苦口、忠言逆耳之意，而解世子又有以劝勉焉。○注“文公为世子”至“勉世子也”。○正义曰：此盖《古纪》、《世本》之文也。云滕有考公麋，与文公之父定公相直；其子元公洪，与文公相直。後世因避讳之故，更考公为定公，元公为文公。以其能安民大虑，故以定为谥；以其能慈惠爱民，故以文为谥。鲁有文公、定公之号，周有文王、定王之名。其谥虽与滕君同，然称其实，盖不无异焉。凡称公者，盖古者天子有三公称公，王者之後称公。其馀大国称侯伯，小国称子。男之君亦得称公者，非僭之也，以其国人尊之，故称公而已。○注云“成，勇果者也”，“公明仪，贤者也”。○正义曰：以意推之，则成之勇果、公明仪之贤者可知矣，人亦未详，《礼》於《檀弓》有公明仪，而注亦无所说，亦以孟子之时事罕有所载，学者亦不必规规务求极焉。○注“若药不瞑眩，厥疾不瘳”。○正义曰：《商书·说命》篇。孔氏《传》云：“开汝心，沃我心，如服药必瞑眩，极其病乃除，欲其出切言以自警。”" }
      - { type: j, text: "滕定公薨。世子谓然友曰：“昔者孟子尝与我言於宋，於心终不忘。今也不幸至於大故，吾欲使子问於孟子，然後行事。”（定公，文公父也。然友，世子之传也。大故，谓大丧也。）然友之邹，问於孟子。（孟子归在邹也。）孟子曰：“不亦善乎！亲丧固所自尽也。（不亦者，亦也。问此，亦其善也。）曾子曰：‘生，事之以礼；死，葬之以礼，祭之以礼：可谓孝矣。’（曾子传孔子之言。孟子欲令世子如曾子之从礼也。时诸侯皆不行礼，故使独行之也。）诸侯之礼，吾未之学也。虽然，吾尝闻之矣：三年之丧，斋疏之服，饣干粥之食，自天子达於庶人，三代共之。”（孟子言我虽不学诸侯之礼，尝闻师言，三代以事，君臣皆行三年之丧。斋疏，斋衰也。饣干，麋粥也。）然友反命，定为三年之丧父。兄百官皆不欲也，故曰：“吾宗国鲁先君莫之行，吾先君亦莫之行也。至於子之身而反之，不可。（父兄百官，滕文同姓异姓诸臣也，皆不欲使世子行三年。滕、鲁同姓，俱出文王。鲁，周公之後；滕，叔绣之後。敬圣人，故宗鲁者也。）且志曰：‘丧祭从先祖。’”曰：“吾有所受之也。”（父兄百官且复言也。志，记也，《周礼·小史》掌邦国之志。曰丧祭之事，各从其先祖之法。言我转有所受之，不可於己身独改更也。一说“吾有所受之”，世子言我受之於孟子也。）谓然友曰：“吾他日未尝学问，好驰马试剑。今也父兄百官不我足也，恐其不能尽於大事，子为我问孟子。”（父兄百官见我他日所行，谓我志行不足，似恐我不能尽大事之礼，故止我也。为我问孟子，当何以服其心，使其信我也。）然友复之邹问孟子。孟子曰：“然，不可以他求者也。孔子曰：‘君薨，听於冢宰。ヱ粥，面深墨，即位而哭，百官有司莫敢不哀，先之也。’（孟子言如是，不可用他事求也。丧尚哀，惟当以哀戚感之耳。国君薨，委政冢宰大臣，嗣君但尽哀情，ヱ粥不食，颜色深墨。深，甚也。墨，黑也。即丧位而哭，百官有司莫敢不哀者，以君先哀之也。）上有好者，下必有甚焉者矣。君子之德，风也。小人之德，草也。草上之风必偃。是在世子。”（上之所欲，下以为俗。尚，加也。偃，伏也。以风加草，莫不偃伏也。是在世子以身帅之也。）然友反命，世子曰：“然，是诚在我。”（世子闻之，知其在身，欲行之也。）五月居庐，未有命戒。百官族人可谓曰知。（诸侯五月而葬，未葬，居倚庐於中门之内也。未有命戒，居丧不言也。异姓同姓之臣可谓曰知世子之能行礼也。）及至葬，四方来观之，颜色之戚，哭泣之哀，吊者大悦。（四方诸侯之宾来吊会者，见世子之憔悴哀戚，大悦其孝行之高美也已。）" }
      - { type: z, text: "“滕定公薨”至“吊者大悦”。○正义曰：此章指言事莫当於奉礼，孝莫大於哀恸，从善如流，文公之谓也。“滕定公薨”者，滕文公之父死也。“世子谓然友曰：昔者孟子尝与我言於宋，於心终不忘。今也不幸，至於大故，吾欲使子问於孟子，然後行事”者，然友，世子之傅也。世子谓然友，言往日孟子曾与我言於宋国之事，於我心至今常存，终不为忘之也，今也不幸至於父丧之大故，我欲使子问於孟子，然後行其父丧之事。“然友之邹，问於孟子”者，孟子将以自宋归邹也，然友乃往邹国，问孟子以世子所问之事。“孟子曰：不亦善乎！亲丧固所自尽也”者，孟子答然友，谓不亦善然友以世子所问也。“曾子曰：生，事之以礼；死，葬之以礼，祭之以礼，可谓孝矣”至“三代共之”者，孟子以此答然友之问，言曾子谓父母在生之时，当以礼奉事之，如冬温夏清，昏定晨省，是其礼也；父母死之时，当以礼安葬之，如辟踊哭泣，哀以送之，卜其宅兆，而安厝之，是其礼也；及祭之礼，如春秋祭祀，以时思之，陈其簋，而哀戚之是也：能如此，则可谓之能孝者矣。如问其诸侯所行之礼，则我未之学也。虽然，为未尝学诸侯之礼，我尝闻知之矣言。闻三年父母之丧，以{文衣}疏{文衣}衰之服，以麋粥之食。凡此三年之丧，自上至於天子，下而达於庶人，三代夏、商、周共行之矣。“然友反命”者，然友自邹得孟子之言，乃反归命告於滕公也。“定为三年之丧，父兄百官皆不欲也，故曰：吾宗国鲁先君莫之行也”至“於子之身而反之，不可”者，是世子因然友问孟子归後，乃定为三年之丧事，其滕之同姓与异姓诸臣，皆不欲为三年之丧，遂曰：我宗国鲁先君莫之尝行此三年丧礼，我之先君亦莫之尝行也，今至於子之身而反违之，以为三年之丧，不可。言其不可反背先君，而以自为三年丧之礼也。“且志曰：丧祭从先祖。曰：吾有所受之也”，父兄百官言之後复引记有曰：丧祭之事，各从其先祖之法，我但有所承受之也，不可於已身独改更为三年丧耳。滕与鲁同姓，俱出鲁周公之後，故云吾宗国鲁先君。志，记也。“谓然友曰：吾他日未尝学问，好驰马试剑。今也父兄百官不我足也，恐其不能尽於大事，子为我问孟子”者，滕文公既定为三年之丧礼，而父兄百官见之皆不欲为，乃复谓然友曰：我所往他日未尝学问礼，但好驱驰走马试剑事，今也定为三年之丧，父兄百官见之，皆谓我志不足以行此三年之丧，恐其不能尽於大事之礼，子复为我之邹问孟子，以为如何当使父兄百官服其心而信我也？“然友复之邹问孟子”者，是然友自文公所乃，因其命，复往邹国，见孟子而问焉。“孟子曰：不可以他求也。孔子曰：君薨，听於冢宰，ヱ粥，面深墨，即位而哭。百官有司莫敢不哀先之也”至“是在世子”者，孟子答然友为世子之问，言如此则不可更以他事求也，惟当以哀戚感之耳。故引孔子曰：国君之薨，其政事皆委冢宰大臣听行之，嗣君者但ヱ麋粥而不食，面之颜色亦变为甚黑之色，即丧位而哀哭之，故百官有司莫敢不哀先之也。是所谓上有所好者，下必有甚焉者耳。且君子之德如风也，小人之德如草也，草加之以风，必偃伏而从风所趋耳。是在世子但以身率之尔。凡此皆孟子答然友为世子之问，而以此复教之矣。“然友反命，世子曰：是诚在我”者，然友自问孟子之後，乃以孟子之言反归告於世子，世子於是五月居於丧庐，不敢入处，故未有命以令人、未有戒以号人，以其在外思之而不言也。百官族人皆以为知礼、能行三年之丧，乃曰“可谓曰知”，以其百官族人指文公而言也。“及至葬，四方来观之，颜色之戚，哭泣之哀，吊者大悦”者，言及至葬日，四方诸侯来吊，慰而观之，颜色之戚而形於容，哭泣之哀而形於声，於是吊之者皆大悦，以喜其有孝行也。○注“定公，文公父也”。○正义曰：说在前段已详矣。○注“曾子传孔子之言”。○正义曰：案《论语》：“孟孙问孝於孔子，孔子对曰：‘生，事之以礼，死，葬之以礼，祭之以礼。’”是曾子传孔子之言而云，孟子所以引为曾子言矣。○注“滕、鲁国同姓，俱出鲁周公之後”。○正义曰：案鲁隐公十一年，滕侯与薛侯争长，薛侯曰：“我先封。”滕侯曰：“我，周之卜正也。薛，庶姓也，我不可以後之。”公使羽父请於薛侯曰：“君与滕侯辱在寡人。周谚有之曰：‘山有木，工则度之。宾有礼，主则择之。’周之宗盟，异姓为後。寡人若朝于薛，不敢与诸任齿。君若辱贶寡人，则愿以滕君为请。”薛侯许之，乃长滕侯。杜预云：“薛，任姓。”以此推之，则知滕为鲁之後，与鲁同姓也。○注“《周礼·小史》掌邦国之志”至“孟子也”。○正义曰：郑司农云：“志，谓记也。”《春秋传》所谓《周志》，《国语》所谓《郑志》之属也。两说者，其意皆行，谓之父兄百官言亦行，谓之世子亦行，但不逆意则可矣。○注“诸侯五月而葬，未葬，居倚庐於中门之内也”。○正义曰：案《左传》隐公元年云：“天子七月而葬，同轨毕至；诸侯五月而葬，同盟至；大夫三月，同位至；士逾月，外姻至。”又《丧大记》云“父母之丧，居倚庐”是也。" }
      - { type: j, text: "滕文公问为国。孟子曰：“民事不可缓也。（问治国之道也。民事不可缓之使怠惰，当以政督趣，教以生产之务也。）《诗》云：‘昼尔于茅，宵尔索。亟其乘屋，其始播百。’（《诗·风·七月》之篇，言教民昼取茅草，夜索以为。，绞也。及尔暇，亟而乘盖尔野外之屋，春事起，尔将始播百矣。言农民之事无休已。）民之为道也，有恒产者有恒心，无恒产者无恒心。苟无恒心，放僻邪侈，无不为已，及陷乎罪，然後从而刑之，是罔民也。焉有仁人在位，罔民而可为也？（义与上篇同。孟子既为齐宣王言之，滕文公问，复为究陈其义，故各自载之也。）是故贤君必恭俭、礼下，取於民有制。（古之贤君，身行恭俭，礼下大臣，赋取於民不过十一之制也。）阳虎曰：‘为富不仁矣，为仁不富矣。’（阳虎，鲁季氏家臣也。富者好聚，仁者好施，施不得聚，道相反也。阳虎非贤者也，言有可采，不以人废言也。）夏后氏五十而贡，殷人七十而助，周人百亩而彻，其实皆什一也。彻者，彻也。助者，藉也。（夏禹之世，号夏后氏。后，君也。禹受禅於君，故夏称后。殷，周顺人心而征伐，故言人也。民耕五十亩，贡上五亩；耕七十亩者，以七亩助公家；耕百亩者，彻取十亩以为赋：虽异名而多少同，故曰皆什一也。彻犹取人彻取物也。藉者借也，犹人相借力助之也。）龙子曰：‘治地莫善於助，莫不善於贡。’贡者，校数岁之中以为常。（龙子，古贤人也，言治土地之赋，无善於助者也。贡者，校数岁以为常。龙子，古贤人也，言治土地之赋，无善于助者也。贡者，校数岁以为常类而上之，民供奉之，有易有不易，故谓之莫不善於贡也。）乐岁粒米狼戾，多取之而不为虐，则寡取之。凶年粪其田而不足，则必取盈焉。（乐岁，丰年。狼戾，犹狼藉也。粒米，粟米之粒也。饶多狼藉，弃捐於地，是时多取於民，不为暴虐也，而反以常数少取之。至於凶年饥岁，民人粪治其田，尚无所得，不足以食，而公家取其税必满其常数焉。不若从岁饥、穰以为多少，与民同之也。）为民父母，使民ツツ然，将终岁勤动不得以养其父母，又称贷而益之，使老稚转乎沟壑，恶在其为民父母也！（ツツ，勤苦不休息之貌。动，作。称，举也。言民勤身动作终岁，不得以养食其父母。公赋当毕，有不足者，又当举贷子倍而益满之。至使老少转尸沟壑，安可以为民之父母也？）夫世禄，滕固行之矣。（古者诸侯、卿、大夫、士有功德，则世禄赐族者也。官有世功也，其子虽未任居官，得世食其父禄。贤者子孙必有土之义也，滕固知行是矣。言亦当恤民之子弟，闵其勤劳者也。）《诗》云：‘雨我公田，遂及我私。’惟助为有公田，由此观之，虽周亦助也。（《诗·小雅·大田》之篇。言太平时民悦其上，愿欲天之先雨公田，遂以次及我私田也，犹殷人助者，为有公田耳。此周《诗》也，而云“雨公田”，知虽周家之时亦有助之之制也。）设为庠序学校以教之，（以学习礼，教化於国。）庠者养也，校者教也，序者射也。夏曰校，殷曰序，周曰庠，学则三代共之，皆所以明人伦也。（养者养耆老，教者教以礼义，射者三耦四矢，以达物导气也。学则三代同名，皆谓之学。学乎人伦，人伦者人事也，犹《洪范》曰“彝伦攸序”，谓其常事有序者也。）人伦明於上，小民亲於下，有王者起，必来取法，是为王者师也。（有行三王之道而兴起者，当取法於有道之国也。）《诗》云：‘周虽旧邦，其命惟新。’文王之谓也。子力行之，亦以新子之国。”（《诗·大雅·文王》之篇。言周虽后稷以来旧为诸侯，其受王命，惟文王新复，修治礼义以致之耳。以是劝勉文公，欲使庶几新其国也。）使毕战问井地。（毕战，滕臣也。问古井田之法。时诸侯各去典籍，人自为政，故井田之道不明也。）孟子曰：“子之君将行仁政，选择而使子，子必勉之！夫仁政必自经界始。经界不正，井地不钧，禄不平。（子，毕战也。经亦界也。必先正其经界，勿慢邻国，乃可均井田，平禄。，所以为禄也。《周礼·小司徒》云：“乃经土地，而井其田野。”言正其土地之界，乃定受其井牧之处也。）是故暴君吏必慢其经界。经界既正，分田制禄，可坐而定也。（暴君，残虐之君。吏，贪吏也。慢经界，不正本也。必相侵陵，长争讼也。分田，赋庐井也。制禄，以庶人在官者比上农夫，转以为差，故可坐而定也。）夫滕，壤地褊小，将为君子焉，将为野人焉；无君子莫治野人，无野人莫养君子。（褊小，谓五十里也。为，有也。虽小国，亦有君子，亦有野人，言足以为善政也。）请野九一而助，国中什一使自赋。（九一者，井田以九顷为数，而供什一，郊野之赋也。助者，殷家税名也，周亦用之，龙子所谓“莫善於助”也。时诸侯不行助法。国中什一者，《周礼》“园廛二十而税一”，时行重法赋，责之什一也。而，如也。自，从也。孟子欲请使野人如助法，什一而税之；国中从其本赋，二十而税一以宽之也。）卿以下必有圭田，圭田五十亩，馀夫二十五亩。（古者卿以下至於士，皆受圭田五十亩，所以供祭祀也。圭，洁也。上田，故谓之圭田，所谓“惟士无田，则亦不祭”，言绌士无洁田也。井田之民，养公田者受百亩，圭田半之，故五十亩。馀夫者，一家一人受田，其馀老小尚有馀力者，受二十五亩，半於圭田，谓之馀夫也。受田者，田莱多少有上、中、下。《周礼》曰“馀夫亦如之”，亦如上、中、下之制也。《王制》曰“夫圭田无征”，谓馀夫圭田，皆不当征赋也。时无圭田馀夫，孟子欲令复古，所以重祭祀，利民之道也。）死徙无出乡，（死，谓葬死也。徙，谓爰士易居平肥硗也。不出其乡，易为功也。）乡田同井，出入相友，守望相助，疾病相扶持，则百姓亲睦。（同乡之田，共井之家，各相营劳也。出入相友，相友耦也。《周礼·大宰》曰“八曰友，以任得民。”守望相助，助察奸恶也。疾病相扶持，扶持其羸弱，救其困急。皆所以教民相亲睦之道。睦，和也。）方里而井，井九百亩，其中为公田。八家皆私百亩，同养公田。公事毕，然後敢治私事，所以别野人也。（方一里者，九百亩之地也，为一井。八家各私得百亩，同共养其公田之苗稼。公田八十亩，其馀二十亩以为庐井宅园圃，家二亩半也。先公後私，“遂及我私”之义也。则是野人之事，所以别於士伍者也。）此其大略也。若夫润泽之，则在君与子矣。”（略，要也。其井田之大要如是也。而加慈惠润泽之，则在滕君与子共戮力抚循之也。）" }
      - { type: z, text: "“滕文公问为国”至“则在君与子矣”。○正义曰：此章指言尊贤师知，采人之善，善之至也。修学校，劝礼义，敕民事，正经界，均井田，赋什一，则为国之大本也。“滕文公问为国”者，滕文公问孟子治国之道也。“孟子曰：民事不可缓也”者，孟子答文公言治国之道，惟民事当急而不可缓也。“《诗》云：昼尔于茅，宵尔索，亟其乘屋，其始播百”者，此盖《诗》之《风·七月》之篇文也。言民事於日中则取茅，夜中以索。，绞索也。昼，日中也。宵，夜中也。及尔闲暇之时，则亟疾乘盖其野外之屋，春事始兴，以为播百为也。以其民事当无休已。孟子所以引此而教之文公也，亦欲文公教民如此者焉。“民之为道也，有恒产者有恒心，无恒产者无恒心。苟无恒心，放辟邪侈，无不为已。及陷乎罪，然後从而刑之，是罔民也。焉有仁人在位，罔民而可为也”者，此义同前篇，此所以复言之者，以其前篇孟子为齐宣陈之也，此篇盖因文公为治国之道，故孟子复此为答，遂两载焉，此更不说。“是故贤君制民必恭俭、礼下，取民有制”者，言古之贤君必身行恭俭，恭则不侮人，俭则不夺人，非特不侮人不夺人，且又礼下接於贤人，其取民之赋又有什一之制。什一，盖十分则取一而已。“阳虎曰：为富不仁矣，为仁不富矣”者，阳虎，鲁季氏之家臣也，孟子言阳虎有云：凡为富者，则常聚民之财贿为己所有，故不仁；凡为仁者，以其常务博施济众，故不能富矣。孟子今引之而教文公者，盖欲使得其中矣。“夏后氏五十而贡，殷人七十而助，周人百亩而彻，其实皆什一也。彻者，彻也。助者，藉也”者，言夏后氏之时，民耕五十亩田，其於贡上之赋但五亩而已，是夏后氏五十而贡也；殷人之时，民耕七十亩田，其助公家则七亩而已，是殷人七十而助也；周人之时，民耕百亩，其彻取之赋则十而已，是周人百亩而彻也：总而论之，其实皆什一之赋也。“彻者，彻也。助者，藉也”，此孟子自解之义也。彻犹彻取，助但借民力而耕之矣，故藉借也。夏后氏与殷人、周人之称不同者，盖禹之受禅以继舜有天下，故夏称后。后，君也。殷周以征伐顺人心而有天下，故云人也。“龙子曰：治地莫善於助，莫不善於贡。贡者，校数岁之中以为常”者，龙子盖古之贤人也，孟子言龙子有云：治土地之赋，莫善於助者也，莫不善於贡也。以其助则借民力而耕之，其所出在岁之所熟如何耳；贡者以其捡校数岁之中以为有常之例也，其岁之所熟，则贡之数亦然，岁之荒，则贡之数亦然。盖以岁荒则有损於民也，故曰莫善於助，莫不善於贡。“乐岁粒米狼戾，多取之而不为虐，则寡取之。凶年粪其田而不足，则必取盈焉”者，此亦孟子自解其上文之言也。言丰乐之岁，其粒米狼藉饶多，虽多取之而不为暴虐，则以寡取之；凶荒之年，粪其田尚不足，则以取满其常数焉。是则校数岁之中以为常之意也。“为民父母，使民ツツ然，将终岁勤动不得以养其父母，又称贷而益之，使老稚转乎沟壑，恶在其为民父母也”，孟子言人君为下民之父母，使民ツツ相顾，将至终岁勤苦劳动，不得以赡养其父母，人君在上，又更称贷而益之，以满其常数之贡，致使老少羸弱饥饿而转尸於沟壑之中，如此安更可在上为下民父母也！言其不足以为民父母矣，以其为民父母，当子养其民，不当如此故也。“夫世禄，滕固行之矣”，孟子言今夫滕国於世禄固已知行之矣，但亦当怜悯民之老少与其勤劳者也。世禄者，以其有功德之臣，则世禄之，赐其土地也。谓其子虽未任居官，得食其父之禄，亦必有土地禄之也。“《诗》云：雨我公田，遂及我私。惟助为有公田，由此观之，虽周亦助也”者。此《诗》盖《小雅·大田》之篇文也，“惟助”至“助也”，孟子又自言之，因《诗》而解周之亦助也。其《诗》盖谓民乐其上，愿欲天之先雨及公田，次及我等私田也。孟子缘此而观之，遂知虽周百亩而彻取之赋，其亦有助之制焉。以其惟行助，则为有公田，如贡、彻则非有公田矣。孟子於此，所以复辨其周之亦有助法而取民之赋，盖谓其莫善於助之义也。“设为庠序学校以教之”者，此孟子亦欲文公富而教之之意也，言又不特止於制民之赋而已。既制其禄，又当开设为之庠序学校以教之矣，故曰“庠者养也，校者教也，序者射也””至“是为王者师也”者，此孟子欲详说其庠序学校之意也。言庠者以养耆老於此者也，校者所以教礼义於此者也，序者所以讲射於此而行尊卑揖逊之礼者也。夏之时谓之校，殷之时谓之序，周之时谓之庠，然而为学则三代皆共之，皆所以於此而明人伦之序。大伦既备明於上，小民既亲之於其下，如有王者兴起而用之，必来取法於此，是为王者之师也。孟子所以区区为滕文公言及此，又欲文公由此化民成俗故也。“《诗》云：周虽旧邦，其命惟新。文王之谓也。子力行之，亦以新子之国”者，《诗》云盖《诗·大雅·文王》之篇文也，其时周虽自后稷以来，但为之旧邦，其受王命复治而维新之，是文王之谓也。孟子言文公但能力行如此而治，亦以新子之国矣。以其欲以此勉文公，使庶几新其国也。“使毕战问井地”，毕战，滕文公之臣也，滕文公自问为国之道，孟子告之民事贡赋敕礼义之意，其後又使其臣毕战问孟子以井地之制也。“孟子曰：子之君将行仁政，选择而使子，子必勉之。夫仁政必自经界始。经界不正，井地不钧，禄不平”者，而以至“在君与子”矣，皆孟子答毕战问井地之制也。孟子言子之君将欲行其仁政，选择而使子来问以井地之制。子必当勉力，与民同行之耳。夫仁政必自经界为始，如经界不能正之，则井地由此不均齐；井地不均，则禄亦不平矣。所以为禄，故云禄。“是故暴君吏必慢其经界”至“定也”者，孟子言此故暴虐之君，污滥之吏，必慢其经界。所以告之以此者，孟子欲滕君不为暴君，毕战不为污吏也，故如是云然。经界既以正，则田由此而分，平禄由是而得制，是其分田制禄，可坐而定之也，以言其易定也。“夫滕，壤地褊小，将为君子焉，将为野人焉，无君子莫治野人，无野人莫养君子”，孟子言今夫滕国土壤之地褊小，即止於五十里，然将为之君子人焉，为之野人焉。以其无君子则莫能治其野人，无野人则莫能养其君子。孟子所以言此者，盖以滕国亦有君子，亦有野人，足以为善政也。“请野九一而助，国中什一使自赋”至“若夫润泽之，则在君与子矣”者，此皆孟子欲滕国为善政，故以是请教之也。今言请於郊野行井田之制，以九一而助佐公田为之赋，国中廛园以什一之法使贡自赋之，以其十中取一也。古者自卿以下皆有其圭田，谓之圭田者，所以名其洁而供祭祀之田也。言自卿以下，皆受此圭田五十亩。“馀夫二十五亩”，以其一家之人受田，其馀老少尚有馀力者，亦受此圭田二十五亩而已。“死徙无出乡”，以其死葬易居，无出其本乡耳。“乡田同井，出入相友，守望相助，疾病相扶持，则百姓亲睦”，以其谓同乡之田、共井之家者，凡有出入，皆相交友为伴，所以同其心也；相助以守，而此不可以威武夺，相助以望，而彼不得以投隙来；疾病则相扶持其羸弱而救其困急：则百姓於是相亲和睦矣。“方里而井”，以其方一里之地为之井。田九百亩，以其一井之田有九百亩。“其中为公田”，以其九百亩於井中抽百亩为公田之苗稼。“八家皆私百亩”，以其八口之家，皆受八百亩以为已之私田苗稼。“同养公田，公事毕，然後敢治私事”，以其八口之家同共耕养其公田，及至公田之事了毕，然後耕治已之私田，以为之私事。“所以别野人也”，此所以为野人之事以别於士伍者也。“此其大略也。若夫润泽之，则在君与子矣”，孟子言此则井田之大要如是也，若夫加之以慈惠润泽之，则有在於滕君与子矣。子者，称毕战为子也。○注“《诗·风·七月》之篇”至“无休已”。○正义曰：毛氏云：宵，夜也。，绞也。乘，升也。”笺云：“尔，女也。汝当昼日往取茅归，夜作绞索以待时用。亟，急也。乘，治也。十月定星将中，急当治野庐之屋。其始播百，谓期来年百于公社也。”此诗盖陈王业之艰难。○注“阳虎，鲁季氏家臣，非贤者也”。○正义曰：案《论语》云：“阳货欲见孔子，孔子不见。”孔传云：“阳货，阳虎也，季氏之家臣，而专鲁国之政。”是则姓阳名虎，字货也。孔子不见，所以知其非贤故也。○注“《诗·小雅·大田》之篇”至“亦助也”。○正义曰：此盖幽王之诗也。笺云：“其民之心，先公後私，令天注雨於公田，因及私田尔。言民怙君德，蒙其馀惠。”○注“《洪范》彝伦攸叙”。○正义曰：孔安国云：彝伦，常道也，言常道所以次叙也。洪，大也；范，道也。此箕子陈之於武王者也。○注“《诗·大雅·文王》之篇”。○正义曰：此诗盖言文王受命作周。笺云：大王聿来胥宇，而国於周，王迹起矣，而未有天命，至文王而受命。言新者，美之也。○注“《周礼·小司徒》曰：乃经土地，而井牧其田野”。○正义曰：郑注云：“小司徒为经之立其五沟五涂之界，其制似井之字，因取名焉。”郑司农云：“井牧者，《春秋传》所谓井衍、沃牧、隰皋者也。”郑玄云：“隰皋之地，九夫为牧，二牧而当一井。今造都鄙，授民田，有不易者，有一易者，有再易者，通率二而当一，是之谓井牧。昔少康在虞，思有田一成，有众一旅。一旅之众，而田一成，则井牧之法，先古然矣。九夫为井者，方一里，九夫所治之田也。此制小司徒经之，匠人为之，沟洫相包乃成耳。”○注“《周礼》园廛二十而税一”。○正义曰：郑司农云：园廛亦轻之者，廛无，园少利也。○注“《周礼》曰馀夫亦如之”，“《王制》曰夫圭田无征”。○正义曰：郑司农云：户计一夫一妇而赋之田，其一户有数口者，馀夫亦受此田也。“夫圭田无征”者，郑氏云：夫犹治也；征，税也；治圭田者不税，所以厚贤也。此则《周礼》之士田，以在近郊之地者也。○注“《周礼·大宰》曰：八曰友，以任得民”。○正义曰：案《大宰》之职：“以九两系邦国之民，一曰牧，以地得民。二曰长，以贵得民。三曰师，以贤得民。四曰儒，以道得民。五曰宗，以族得民。六曰主，以利得民。七曰吏，以治得民。八曰友，以任得民。九曰薮，以富得民。”注云：“两犹耦也，所以协耦万民。系，联缀也。牧，州长也。长，诸侯也。师，诸侯师氏有德行教民者也。儒，诸侯系氏有六艺以教民者也。宗，继别为大宗，牧族者也。”郑司农云：主谓公卿大夫，世世食至不绝者也。吏，小吏在乡邑者。友，谓同井相合耦锄作者。薮亦有虞掌其政令，为之厉禁者，使其地之民守其财物者。此《大宰》之职，有是以掌之也。" }
      - { type: j, text: "有为神农之言者许行，自楚之滕，踵门而告文公曰：“远方之人，闻君行仁政，愿受一廛而为氓。”（神农，三皇之君，炎帝神农氏。许，姓；行，名也。治为神农之道者。踵，至也。廛，居也。自称远方之人，愿为氓。氓，野人也。）文公与之处。其徒数十人皆衣褐，捆屦、织席以为食。（文公与之居。处，舍之宅也。其徒，学其业者也。衣褐，贫也。捆犹叩也，织屦欲使坚，故叩之也。卖屦席以供饮食也。）陈良之徒陈相与其弟辛，负耒耜而自宋之滕，曰：“闻君行圣人之政，是亦圣人也。愿为圣人氓。”（陈良，儒者也。陈相，良之门徒也。辛，相弟。圣人之政，谓仁政也。）陈相见许行而大悦，尽弃其学而学焉。（弃陈良之儒道，更学许行神农之道也。）陈相见孟子，道许行之言，曰：“滕君则诚贤君也。虽然，未闻道也。（陈相言许行以为滕君未达至道也。）贤者与民并耕而食，饔飧而治。今也滕有仓廪府库，则是厉民而以自养也，恶得贤？（相言许子以为古贤君当与民并耕而各自食其力。饔飧，熟食也。朝曰饔，夕曰飧。当身自具其食，兼治民事耳。今滕赋税有仓廪府库之富，是为厉病其民以自奉养，安得为贤君乎？三皇之时，质朴无事，故道若此者也。）孟子曰：“许子必种粟而後食乎？”（问：许子必自身种粟乃食之邪？）曰：“然。”（相曰：然，许子自种之。）“许子必织布然後衣乎？”（孟子曰：许子自织布然後衣之乎？）曰：“否。许子衣褐。”（相曰：不自织布，许子衣褐。以毳织之，若今马衣也。或曰：褐，衣也。一曰粗布衣也。）“许子冠乎？”（孟子问相冠乎？）曰：“冠。”（相曰：冠也。）曰：“奚冠？”（孟子问：许子何冠也？）曰：“冠素。”（相曰：许子冠素。）曰：“自织之与？”（孟子曰：许子自织素与？）曰：“否。以粟易之。”（相言许子以粟易素）曰：“许子奚为不自织？”（曰：许子自织素乎？）曰：“害於耕。”（相曰：织纺害於耕，故不自织也。）曰：“许子以釜甑爨，以铁耕乎？”（爨，炊也。孟子曰：许子宁以釜甑炊食，以铁为犁用之耕否邪？）曰：“然。”（相曰：用之。）“自为之与？”（孟子曰：许子自冶铁陶瓦器邪？）曰：“否，以粟易之。”（相曰：不自作铁瓦，以粟易之也。）“以粟易械器者，不为厉陶冶；陶冶亦以械器易粟者，岂为厉农夫哉？且许子何不为陶冶，舍皆取诸其宫中而用之，何为纷纷然与百工交易，何许子之不惮烦？”（械，器之总名也。厉，病也。以粟易器，不病陶冶，陶冶亦何以为病农夫乎？且许子何为不自陶冶。舍者，止也。止不肯皆自取之其宫宅中而用之，何为反与百工交易，纷纷而为之烦也。）曰：“百工之事，固不可耕且为也。”（相曰：“百工之事，固不可耕且为，故交易也。）“然则治天下独可耕且为与？（孟子言百工各为其事，尚不可得耕且兼之。人君自天子以下，当治天下政事，此反可耕且为邪？欲以穷许行之非滕君不亲耕也。孟子谓五帝以来，有礼义上下之事，不得复若三皇之道也，言许子不知礼者也。）有大人之事，有小人之事。且一人之身而百工之所为备，如必自为而後用之，是率天下而路也。（孟子言人道自有大人之事，谓人君行教化也。小人之事，谓农工商也。一人而备百工之所作，作之乃得用之者，是率导天下人以羸之路也。）故曰或劳心，或劳力。劳心者治人，劳力者治於人。治於人者食人，治人者食於人，天下之通义也。（劳心，君也。劳力，民也。君施教以治理之，民竭力治公田以奉养其上，天下通义，所常行者也。）当尧之时，天下犹未平，洪水横流，泛滥於天下，草木畅茂，禽兽繁殖，五不登，禽兽逼人，兽蹄鸟迹之道交於中国。尧独忧之，举舜而敷治焉。（遭洪水，故天下未平。水盛，故草木畅茂。草木盛，故禽兽繁息众多也。登，升也，五不足升用也。猛兽之迹，当在山林，而反交於中国，惧害人。故尧独忧念之。敷，治也。《书》曰：“禹敷土。”是言治其土也。）舜使益掌火，益烈山泽而焚之，禽兽逃匿。（掌，主也。主火之官，犹古之火正也。烈，炽。益视山泽草木炽者而焚之，故禽兽逃匿而奔走远窜也。）禹疏九河，瀹济、漯而注诸海，决汝、汉，排淮、泗而注之江，然後中国可得而食也。当是时也，禹八年於外，三过其门而不入，虽欲耕，得乎？（疏，通也。瀹，治也。排，壅也。於是水害除，故中国之地，可得耕而食也。禹勤事於外，八年之中，三过其门而不入。《书》曰：“辛壬癸甲，启呱呱而泣。”如此，宁可得耕也？）后稷教民稼穑，树艺五。五熟而民人育。（弃为后稷也。树，种。艺，殖也。五谓稻、黍、稷、麦、菽也。五所以养人也，故言民人育也。）人之有道也，饱食暖衣，逸居而无教，则近於禽兽。圣人有忧之，使契为司徒，教以人伦：父子有亲，君臣有义，夫妇有别，长幼有叙，朋友有信。（司徒主人，教以人事。父父子子，君君臣臣，夫夫妇妇，兄兄弟弟，朋友贵信，是为契之所教也。）放勋曰：劳之来之，匡之直之，辅之翼之，使自得之，又从而振德之。（放勋，尧号也。遭水灾恐其小民放僻邪侈，故劳来之。匡正直其曲心，使自得其本善性，然後又从而振其羸穷，加德惠也。）圣人之忧民如此，而暇耕乎！（重喻陈相。）尧以不得舜为己忧，舜以不得禹、皋陶为己忧。夫以百亩之不易为己忧者，农夫也。分人以财谓之惠，教人以善谓之忠，为天下得人者谓之仁。（言圣人以不得贤圣之臣为己忧，农夫以百亩不易治为己忧。）是故以天下与人易，为天下得人难。（为天下求能治天下者难得也，故言以天下传与人尚为易也。）孔子曰：‘大哉尧之为君，惟天为大，惟尧则之，荡荡乎民无能名焉。君哉舜也，巍巍乎有天下而不与焉。’尧舜之治天下，岂无所用其心哉，亦不用於耕耳。（天道荡荡乎大无私，生万物而不知其所由来，尧法天，故民无能名尧德者也。舜得人君之道哉，德盛而巍巍乎，有天下之位，虽贵盛，不能与益舜。巍巍之德，言德之大，大於天子位也。尧、舜荡荡巍巍如此，但不用心於躬自耕也。）吾闻用夏变夷者，未闻变於夷者也。（当以诸夏之礼义化变蛮夷之人耳，未闻变化於夷蛮之人，同其道也。）陈良，楚产也，悦周公、仲尼之道，北学於中国，北方之学者，未能或之先也，彼所谓豪杰之士也。子之兄弟事之数十年，师死而遂倍之。（陈良生於楚，北游中国，学者不能有先之也，所谓豪杰过人之士也。子之兄弟，谓陈相、陈辛也，数十年师事陈良，良死而倍之，更学於许行，非之也。）昔者孔子没，三年之外，门人治任将，归入揖於子贡，相向而哭，皆失声，然後归。子贡反，筑室於场，独居三年，然後归。（任，担也。失声，悲不能成声。场，孔子冢上祭祀坛场也。子贡独於场左右筑室，复三年，慎终追远也。）他日，子夏、子张、子游以有若似圣人，欲以所事孔子事之。强曾子，曾子曰：‘不可，江汉以濯之，秋阳以暴之，皓皓乎不可尚已！’（有若之貌似孔子，此三子者，思孔子而不可复见，故欲尊有若以作圣人，朝夕奉事之礼，如事孔子，以慰思也。曾子不肯，以为圣人之洁白，如濯之江汉，暴之秋阳。秋阳，周之秋，夏之五、六月盛阳也。皓皓，白甚也。何可尚而乃欲以有若之质於圣人之坐席乎？尊师道，故不肯也。）今也南蛮舌之人，非先王之道，子倍子之师而学之，亦异於曾子矣。吾闻出於幽谷、迁于乔木者，未闻下乔木而入于幽谷者。（今此许行乃南楚蛮夷，其舌之恶如鸟耳。，博劳鸟也。《诗》云：“七月鸣。”应阴而杀物者也。许子托於太古，非先圣王尧舜之之道，不务仁义，而欲使君臣并耕，伤害道德，恶如舌，与曾子之心亦异远也。人当出深谷，止乔木。今子反下乔木，入於幽谷。）《鲁颂》曰：‘戎狄是膺，荆舒是惩。’周公方且膺之，子是之学，亦为不善变矣！”（《诗·鲁颂·宫》之篇也。膺，击也。惩，艾也。周家时击戎狄之不善者，惩止荆、舒之人，使不敢侵陵也。周公常欲击之，言南蛮之人难用，而子反悦是人而学其道，亦为不善变更矣。孟子究陈此者，所以责陈相也。）“从许子之道，则市贾不贰，国中无伪。虽使五尺之童市，莫之或欺。布帛长短同，则贾相若；麻缕丝絮轻重同，则贾相若；五多寡同，则贾相若；屦大小同，则贾相若。”（陈相复为孟子言此，如使从许子淳朴之道，可使市无二价，不相为诈，不相欺愚小也。长短谓丈尺，轻重谓斤两，多寡谓斗石，大小谓尺寸，皆言同价，故曰市无二价者也。）曰：“夫物之不齐，物之情也。或相倍蓰，或相什百，或相千万，子比而同之，是乱天下也。巨屦小屦同贾，人岂为之哉？从许子之道，相率而为伪者也。恶能治国家？”（孟子曰：夫万物好丑异贾，精粗异功，其不齐同，乃物之情性也。蓰，五倍也。什，十倍也。至於千万相倍。譬若和氏之璧，虽与凡玉之璧尺寸厚薄等，其价岂可同哉简子欲以大小相比而同之，则使天下有争乱之道也。巨，粗屦也，小，细屦也。如使同价而卖之，人岂肯作其细哉！时许子教人伪者耳，安能治其国家者也。）" }
      - { type: z, text: "“有为神农之言”至“恶能治国家”。○正义曰：此章指言神农务本，教以凡民。许子蔽道，同之君臣。陈相倍师，降於幽谷，不理万情，谓之淳朴。是以孟子博陈尧、舜上下之叙以匡之也。“有为神农者许行”至“愿受一廛而为氓”者，神农，炎帝氏也。许行，南蛮之人也，姓许名行也，自楚蛮之地往滕国，至门而言，告於文公曰：我是远方楚蛮之人，闻滕君行仁政於此，我今所以来至，心愿受一廛居之，以为之氓也。氓，野人之称，已说在《孙丑》篇。“文公与之处，其徒数十人皆衣褐，捆屦织席以为食”，言文公乃与许行之居而处之，其许行之徒弟有数十人，皆衣短褐，叩扌豕织屦席以供其饮食也。“陈良之徒陈相与其弟辛”至“愿为圣人氓”，陈良，儒者也，陈相与其陈辛二人皆陈良徒弟也，言陈良徒弟陈相与其弟辛背负其耒耜，而从宋国往滕国，而向滕君曰：我闻知君行圣人之政事，是为圣人者也，今愿为圣人之氓。“陈相见许行而大悦，尽弃其学而学焉”，言陈相至滕，乃见许行而大悦乐之，遂尽弃去陈良之儒学，而就学於许行之道。“陈相见孟子，道许行之言，曰”至“恶得其贤”，言陈相後见孟子，乃道许行之言。曰滕君则诚为贤君者也，虽然，未闻至道也。古之贤君，乃与民同耕而食，饔飧而兼治政事。朝食曰饔，夕曰飧。今也滕君乃取财税而有仓廪府库之富，则是厉病其民以自奉养也，安得谓之贤君乎？仓廪，《释名》曰：“仓，藏也，藏物也。”廪，仓有屋曰廪。“孟子问许子必种粟而後食乎，曰然”，陈相答之，以为许行是自种而後食也。“许子必织布然後衣乎”，孟子又问许子必自织布然後衣乎。“曰：许子子衣褐”，陈相答之，许子不自纺织其布为衣，以其即著布也。“许子冠乎”，孟子问：许子戴冠乎？“曰冠”，陈相答之，许子戴冠也。“曰奚冠”，孟子又问许子戴何冠。“曰冠素”，陈相答之，许子冠以素为之尔。素，乌也。“曰自织之欤”，孟子又问许子以素为冠，其自织之欤？“曰否，以粟易之”，陈相答之，许子不自织为冠，以粟更易之而已。“曰：许子奚为不自织”，孟子又问许子何为而不自织为之乎？“曰害於耕”，陈相答之，以谓许子不自织为之也。以其自织者斯害於耕也。“曰：许子以釜甑爨，以铁耕乎”，孟子又问许子宁以釜甑炊食、以铁为犁用之耕否乎？“曰然”，陈相答之，以为许子用之也。“自为之欤”，孟子又问许子是自为釜甑炊食、铁犁耕乎？“曰否，以粟易之”，陈相答，以为许子之不自为也，以粟更易之而已。“以粟易械器者，不为厉陶冶”至“何许子之不惮烦”，孟子又复问，以许子将粟更易械器者不以厉病於陶治，陶治亦以器更易之以粟，岂为病厉其农夫哉皋陶，作瓦器之匠也，冶，铸金之匠也。且许子何不自为之陶冶，止皆取其宫室之中而用之乎？何为更纷纷然交易於百工欤？何许子之不畏其烦。故以此欲排之陈相也。“曰：百工之事，固不可耕且为也”，陈相又答之，以谓百工之事，固不可耕且为之也，所以用交易而用之耳。“然则治天下独可耕且为之欤”，孟子又排之，如是则为国君治天下，独可自耕且又为政事以治天下欤？陈相及此以应答，故孟子一向自言而排之，乃曰：有大人之事，大人之事则国君行教化也；有小人之事，即农工商也。且以一人之身而用百工之所作为备具，如必皆用自为然後方行用之也，此则驱率天下之人以羸困之路也。又一说云：如此是驱率天下之人如道路之人，但泛视而不知上下贵贱耳。以其许行、陈相皆欲君民并耕，不知有上不贵贱相待，故以此说，据下文意义相通，堪以此说为尚。所及亡嬴困之路者，但赵注之说耳。详而推之，嬴困之路，不若此说。“故曰或劳心，或劳力”至“天下之通义也”者，此下文之如此也，言天下之人，有但或劳其力，但或劳其心者。劳其心所以制政教，而治天下之人耳；劳其力所以见治於上人而已。见治於上之人者，竭力治公田以奉养上之人也；治天下之人者，以其爵禄皆出民之赋税，故食於人而已。言此是天下通义，人所常行者也。上之人君为言也，下之人民为言也，以此推之，则上下贵贱有所相待耳。“当尧之时，天下犹未平”至“举舜而敷治焉”，孟子又言当古之唐尧盛帝之时，天下犹尚未平，是以其大水横流，逆其势，泛泛滥浊，遍於天下，草木由是畅茂敷实，禽兽又由此而繁息而生殖焉。五：黍、稷、稻、麦、菽，於是不丰登，禽兽亦逼害於人，猛兽之变交驰於中国之道。尧帝乃独自忧惧之，以其有伤害於人民，故举用虞舜而广治之，广治其水土也。“舜使益掌火”至“禹疏九河”，“后稷教民稼穑”又至“使契为司徒”，止於“亦不用於耕耳”，言舜因尧帝举用，乃使伯益为掌火之官，益视山泽草木烦盛，乃烈山泽而焚烧之，禽兽於是惧而逃匿，远窜而不敢出。又使禹疏通九河，又瀹治济、漯之水而流注归海，又开决汝、汉之水而斟壅淮、泗二水，而同流注归之江。九河在东北，案《尔雅》云“九河一曰徒骇，二曰太史，三曰马颊，四曰覆釜，五曰湖苏，六曰简，七曰洁，八曰钩盘，九曰鬲津”是也。江，九江也，案《浔阳端地》有云“一曰乌江，二曰蚌江，三曰乌白江，四曰嘉匪江，五曰{困}江，六曰提江，七曰廪江，八曰源江，九曰畎江”是也。然後中国之地，人方可耕艺而食也。当此之时，大禹八年在外治水土，经三次过其家门而不得入其家，虽欲於时耕作之，其可得乎？又使后稷弃教天下民稼穑，种树艺殖五。五既丰熟，而天下人民於是得养育其生。稼穑者，《说文》云“种曰稼，敛曰穑”也。人之於是有养生之道，饱食而暖衣。逸乐居处而无以教之，则近类於禽兽，以其不知高下也。圣人有忧惧其民如此，舜又使笑为司徒之官，教以人伦。使天下之人知父子有亲亲慈孝，君臣有尊卑之义，夫妇有交别，长幼有等叙，朋友有忠信。又言“放勋有曰，劳之来之，匡之直之，辅之翼之，使自得之，又从而振德之”，民之有勤劳於事者，有以偿其劳，故曰劳之；因其民之来归者，有以偿其来，故曰来之；民之既能直其心，故以正其直为之正，故曰匡之；民之或曲其心，故以正其曲为之直，故曰直之；辅之如车辅，使民有所安於业，故曰辅之；翼之如羽翼，使民有所进於道，故曰翼之。劳之来之匡之直之辅之翼之，所以欲使其自得悦乐之而已矣。民既自得而悦乐之，於是又从加之恩惠而振德之。振德即恩惠耳。言圣人之忧於天下之民如此，尚何暇以耕为乎？又言尧以不得舜而举用使敷治焉，则为民之忧；舜既得尧举而用之，如舜复不得皋陶、禹为辅，则亦为己之忧。今夫以百亩之难耕，恐为己所忧者，农夫也。“分人以财谓之惠，教人以善谓之忠，为天下得人谓之仁”，以言其以己之财物市与人者，是谓忠惠也；以己之有善而以教诸人，谓其心之忠也，中心之谓忠；为天下求得其人而治天下者，是谓其仁者也，爱人之谓仁，所以为天下求得其人，不过爱天下之人，故如是也。“是故以天下与人易，为天下得人难”，孟子言如此故以天下传与其人，尚以为易也；为天下得其人而治天下者，犹以为难。“孔子曰：大哉尧之为君，惟天为大，惟尧则之，荡荡乎，民无能名焉”至“亦不用於耕耳”，孟子又引孔子有云：大哉尧帝之为君也，惟上天之为大而不可尚，惟尧帝又能则法上天而行之，故荡荡然，其德之大，而民无有能指名之者，亦若上天之荡荡，其覆载之德，人亦不能指名而穷极之故也。德於尧如此其大，故孔子所以曰大哉尧之为君。君哉舜也，巍巍乎其功德之大如此，而天下之事未尝自与及焉。无他，以其急於得人而辅之耳，所以但无为而享之，故不必自与及焉。然则尧帝、舜帝之治天下，岂为无所用其心哉？以其但急用心於得贤，亦且不用於躬耕耳。孟子所以言至於此者，盖欲排许子於陈相欲以滕君与民并耕而食，故演之以此也，是所以谓之之云耳。“吾闻用夏变夷者，未闻变於夷者也”至“亦为不言变矣”者，此盖孟子又欲以此而讥陈相学於许行者也。言其闻用中夏之礼义而变化於蛮夷之人，未闻以蛮夷之道而变化於中夏也。且陈良自楚国而生也，悦乐其周公、仲尼之大道，乃自楚之南而往北求学於中国，盖中国以楚地观之，则中国在北之地故也。北方之学者，未能有人或先之陈良。彼陈良所谓豪杰过人之士者也，子之兄弟，以师事数十年矣，至师死而遂背去其所学而学於许行，故以此而讥之。言往日孔子丧没至於三年之外，其门人有治担任而将归室者，乃至子贡之所，入揖於子贡，相向面而哭，乃至悲不成声，然後归之室，复感发子贡，追思孔子，又反至筑室於孔子冢上之坛，独居又至三年，然後方辞冢室而归处。又及他日，子夏、子张、子游三人以有若之貌状似孔子圣人，三人遂欲以往日所事孔子之礼旦夕奉事有子，至勉强曾子同以此事之。曾子乃曰不可，言“江汉以濯之”，则至清而不可污；“秋阳以曝之”，则至明而不可掩。其孔子如此江汉、秋阳皓皓然清洁明白，不可得而尚耳。故不可以有若比之，而以事孔子之礼事之也。孟子所以言之以此者，盖谓孔子之死至三年之久，而门人尚归与子贡相向而哭，乃至悲而不成声，又感子贡复筑室於冢上而追思之，以至子张、子游、子夏欲慰其心思，乃强曾子同以往日事孔子之礼而事之有若，曾子尚不忍以有若加於孔子，而今子之兄弟，但自师死之未久，遂便以背去之，而欲以许行为师而就学之，何忍之如是邪？故以此非之。然前又所谓用夏变夷，即陈良北学中国，以周公、仲尼之道为悦，是又孟子明言之也，岂见如许行、陈相兄弟用蛮夷之事而欲变於滕国也。“今也南蛮舌之人，非先王之道，子倍子之师而学之”至“为不善变矣”，孟子言今也许行乃南蛮舌之恶如於鸟者也，所行皆非先王之正道，而子之兄弟皆背去其己之师陈良，而以学许行，是亦有异於曾子不忍以有若加孔子矣。我闻出自幽谷之内而迁登于高大之木者，未闻有下高大之木而迁入于幽谷之内者也。又《鲁颂·官》之篇有曰：戎狄之人不善，周公於是膺击之；荆舒之人亦不善，周公於是惩诫之。然则戎狄之人，周公方且膺击之，今以南蛮之人，反悦其道而以学之，亦为不善变更者矣。盖戎狄、荆舒皆南蛮之地也，然周公一则膺击之，一则但惩诫之，是何邪？夫以戎狄之地远，荆舒之地近，以远者有所膺击，则近者自然从而治也。故戎狄是膺，荆舒是惩矣。此孟子所以又执此而非之陈相兄弟学于许行为不善，更变其师者焉。从许子之道，则市价相若者，此乃陈相之言从许行之道为美之之意於孟子也，言今从许行之道而行之，则市中物价贵贱则一而不二也，国中亦无奸伪欺诈，虽使五尺之童子往市中，亦莫有人或敢欺瞒之也，以其布与绢帛长短则同，其价例则相若不异；麻缕丝絮四者轻重又同，而价例亦相若而更无高低；五斗量多寡亦则同，而价例亦相若；脚屦大小亦同，而价则相若：凡此是皆市无二价也，故以此言於孟子。“曰：夫物之不齐，物之情也”至“恶能治国家”，此孟子又从而排之也。言夫万物之不齐等，是物有贵贱好恶之情也。然或相倍蓰，或相什伯，或相千万，其不同之有如此，而子今以为上皆同之而无二价，是使天下交争而乱之也。大屦与小屦同其价，则人必为之小屦而卖之，而大屦岂为之哉？言此屦之大小，则其他物之贵贱不言而可知矣。今从许行之道者，是相驱率而作诈伪者也，又安能治国家焉。此孟子至终而辟之以此也。○注“神农，三皇之君，炎帝，神农氏也”。○正义曰：案皇甫谧曰：《易》称包羲氏没，神农氏作，是为炎帝。班固云：教民耕农，故号曰神农。○注“褐马衣”至“粗布衣也”。○正义曰：案《说文》云：“编，袜也，一曰短衣也，又曰袍也，马被衣也。”注“古火正”。○正义曰：案《左传》昭公二十九年，有五行之官，木正曰勾芒，火正曰祝融，金正曰蓐收，水正曰玄冥，土正曰后土。颛顼氏之子曰犁，为祝融，是为火正故也。○注“《书》曰：辛壬癸甲，启呱呱而泣”。○正义曰：案《孔传》云：辛日娶妻，至于甲日复往治水。启，禹之子，禹治水过门不入，闻启泣声，不暇子名之，以大治度水土之功故也。○注“放勋，尧名也”。○正义曰：案徐广云：“放勋，号陶唐也。”孔安国云：“尧能放上世之功化也。”○注“场，孔子冢上祭祀坛场”。○正义曰：案《史记》云：“孔子葬鲁城北泗上。”皇览曰：孔子冢去城一里，冢营百亩，南北广十步，东西十三步，高一丈二尺。冢前以缶甓为祠坛，方六尺，与地平之。无祠堂。营中树以百数，皆异种。鲁人世世无能名其树者，民传言：孔子弟子异国，人各持其方树来种之。其树柞、、雒离、女贞、五味、檀之树，茔中不生荆棘及剌人草。○注“《鲁颂·宫》之篇”。○正义曰：此《诗》颂僖公能复周公之宇也。笺云：惩，艾也。僖公与齐桓举义兵，北当戎狄，南艾荆与群舒，是其解也。" }
      - { type: j, text: "墨者夷之，因徐辟而求见孟子。（夷之，治墨家之道者。徐辟，孟子弟子也。求见孟子，欲以辩道也。）孟子曰：“吾固愿见，今吾尚病，病愈，我且往见。”（我常愿见之，今值我病不能见也，病愈，将自往见。以辞之。）夷子不来。他日，又求见孟子。（是日夷子闻孟子病，故不来，他日复往求见之。）孟子曰：“吾今则可以见矣。不直则道不见，我且直之。（告徐子曰：今我可以见夷之矣，不直言之，则儒家圣道不见，我且欲直攻之也。）吾闻夷子墨者，墨之治丧也，以薄为其道也。夷子思以易天下，岂以为非是而不贵也？然而夷子葬其亲厚，则是以所贱事亲也。”（我闻夷子为墨道者，墨者治丧，贵薄而贱厚。夷子欲以此道易天下之化使从已，岂肯以薄为非是而不贵之也。如使夷子葬其父母厚也，是以所贱之道事其亲也。如其薄也，下言“上世不葬”者，又可鄙足以为戒也。吾欲以此攻之者也。）徐子以告夷子，夷子曰：“儒者之道，‘古之人若保赤子’，此言何谓也？之则以为爱无差等，施由亲始。”（之，夷子名也。盖‘儒家者’曰古之治即‘若爱’赤子，此何谓乎？之以为当同其恩爱，无有差次等级亲疏也。但施爱之事，先从己亲属始耳。若此，何为独非墨道也？）徐子以告孟子，孟子曰：“夫夷子信以为人之亲其兄之子为若亲其邻之赤子乎？彼有取尔也：赤子匍匐将入井，非赤子之罪也。（亲，爱也。夫夷子以为人爱兄子与爱邻人之子等耶。彼取赤子将入井，虽他人子亦爱救之，故谓之爱同也。但以赤子无知，故救之耳。夷子必以此况之，未尽达人情者也。）且天之生物也，使之一本，而夷子二本故也。（天生万物，各由一本而出。今夷子以他人之亲与己亲等，是为二本，故欲同其爱也。）盖上世尝有不葬其亲者，其亲死，则举而委之於壑。（上世，未制礼之时。壑，路傍坑壑也。其父母终，举而委之弃於壑也。）他日过之，狐狸食之，蝇蚋姑嘬之。其颡有Г，睨而不视。夫Г也，非为人Г，中心达於面目。盖归反{ぱ糸}里而掩之。掩之诚是也，则孝子仁人之掩其亲，亦必有道矣。”（嘬，相共食之也。颡，额也。Г，汗出ГГ然也，见其亲为兽虫所食，形体毁败，中心惭，故汗ГГ然出於额，非为他人而惭也，自出其心。圣人缘人心而制礼也。{ぱ糸}里，笼之属，可以取土者也。而掩之实是其道，则孝子仁人掩其亲亦有道矣。）徐子以告夷子，夷子怃然，为间，曰：“命之矣。”（孟子言是，以为墨家薄葬，不合道也。徐子复以告夷子，夷子怃然者，犹怅然也。为间者，有顷之间也。命之犹言受命教矣。）" }
      - { type: z, text: "“墨者夷之”至“命之矣”。○正义曰：此章指言圣人缘情，制礼奉终，墨子元同，质而违中，以直正枉，怃然改容，盖其理也。“墨者夷子，因徐辟而见孟子”，夷之，治墨家之道者姓名也。徐辟，孟子弟子也。言治墨家之道者夷之因孟子弟子徐辟而见孟子也。孟子曰：吾固愿见，今吾尚正病，且待病之瘥愈，我以往而见之也。“夷子不来，他日，又求见孟子”，夷子闻孟子以为尚病，故不来见至於他日，复往求见孟子。“孟子曰：吾今则可以见矣。不直则道不见，我且直之”，孟子见夷子复来求见，遂不得已，先言於徐子曰：我今则可以见矣，欲不见，则不得直己之道而正之，儒家先王之正道，则泯而不见。我且见而直己之道而正彼也。“吾闻夷子墨者，墨之治丧也，以薄为其道也”至“是以所贱事亲也”，此孟子，以此告徐子是其直己之道而正夷子也。以其夷子既以厚葬其亲，而尚治其墨家之道，故不知以此厚其亲是儒家之正道而已。孟子所以反覆直而正之，乃因徐子而告之曰：我闻夷子治墨家之道者也，夫墨者治丧不厚，但以薄之是为其道也，夷子思以墨道以变易天下之化，岂以薄其丧而不贵之者也？然而夷子葬其父母，以厚为之，则是以墨家所贱者而事父母之亲丧也。以其墨家贱厚而贵薄也。“徐子以告夷子”，徐子因孟子此言以告之夷子也。“夷子曰：儒者之道，古之人若保赤子”至“施由亲始”，此又夷子以言於徐子，而以墨道为是也。乃曰：儒者之道，有云古之人治民，若保安赤子者，是言何谓之乎？是则以为恩爱之道无有差等之异也，但施行恩爱之道，当自父母之亲为始耳，我所以厚葬其亲，何为独非以墨道也？之，夷子自称己之名也。徐子又以夷子此言告於孟子。“孟子曰：夫夷子信以为人之亲其兄之子”至“亦必有道矣”，孟子又言今夷子以为爱无差等，是夷子信以为人亲爱其兄之子，为若亲爱其邻家之赤子乎？然彼夷子盖亦有所取而云耳，故亦不足怪也。彼夷子必谓孺子有将入井，人皆有怵惕恻隐之心，故云爱无差等，又以古之人“若保赤子”为言也。盖其赤子匍匐将入於井，非赤子之罪恶也，但以赤子未有知，人故不忍见焉，故救之耳。今夷子必以此况之，而遂以为爱无差等，如亲其兄之子，为若亲其邻之赤子同是，则亲兄之子，必亦得将入井然後救之矣，是夷子未达人情者也。且天之生万物也，皆使其由一本而出矣。今夷子以他人之亲与己之亲同，是为有二本也，又安知先王制礼而称人之情以为之厚薄，施於父子者不以同於兄弟，行於同宗者不以行於邻族也。盖上世於太古未制礼之时，常有不葬其亲者。其亲之死，则抬举而委弃於路傍坑壑之中，他日，子过之於此，见其狐狸野兽食之，蝇蚋飞虫且共嘬食，其子之额ГГ然出汗，故眦睨而不敢详视。夫子所以有ГГ然之汗於额而出者，非为他人而惭也，故如是而ГГ，Г然而出於额也，以其中心有所不忍其亲之如是，故自中心之所痛恨，故发之於面目，所以有ГГ然之汗出於额也。盖不忍之如是，乃归取{ぱ糸}里笼取土而遮掩之，诚是其不忍其亲之道也。是则孝子仁人之心，而掩其亲亦必有道耳，孟子所以言是者，盖非墨家薄葬为非，而以厚葬为是，故以直其正道矣。夫以谓太古未制礼之时，子有不忍其亲为兽虫所食，尚知掩之之道，况今之世，先王所制定其礼，而可蔽之墨家道而薄葬为是、而以厚葬为非邪？夷子既以能厚其亲，而尚不知以墨家之所薄为非，所以执此而直之使正耳。“徐子以告夷子”至“命之矣”者，徐子又因孟子此言而告於夷子，夷子乃怃然而觉悟其己之罪，故顷然为间，曰：我今受孟子之教命，而不敢逆矣。" }
