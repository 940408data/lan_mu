# 尚書正義卷十六（孔穎達疏）：j 為經文＋孔安國注，z 為正義疏文。
sections:
  - id: juan16
    name: 卷十六
    blocks:
      - { type: j, text: "召公為保，周公為師，相成王為左右。○保，太保也。師，太師也。馬雲：“保氏、師氏皆大夫官。”相音息亮反。左右，馬雲：“分陝為二伯，東為左，西為右。”召公不說，周公作《君奭》。" }
      - { type: j, text: "君奭尊之曰君。奭，名，同姓也。陳古以告之，故以名篇。○說音悅。奭，始亦反。" }
      - { type: z, text: "“召公”至“君奭”○正義曰：成王即政之初，召公為保，周公為師，輔相成王為左右大臣。召公以周公嘗攝王之政，今復在臣位，其意不說。周公陳己意以告召公，史敘其事，作《君奭》之篇也。《周官》篇雲“立太師、太傅、太保，茲惟三公”，則此“為保”、“為師”亦為三公官也。此實太師、太保而不言“太”者，意在師法保安王身，言其實為左右爾，不為舉其官名，故不言“太”也。經傳皆言武王之時，太公為太師，此言“周公為師”，蓋太公薨，命周公代之。於時太傅蓋畢公為之，於此無事，不須見也。三公之次，先師後保，此序先言保者，篇之所作，主為召公不說，故先言召公，不以官位為次也。案經周公之言，皆說己留在王朝之意，則召公不說周公之留也。故鄭、王皆雲：“周公既攝王政，不宜複列於臣職，故不說。”然則召公大賢，豈不知周公留意而不說者？以周公留在臣職，當時人皆怪之，故欲開道周公之言，以解世人之惑。“召公疑之，作《君奭》。”非不知也。《史記·燕世家》雲：“成王既幻，周公攝政，當國踐阼，召公疑之，作《君奭》。”此篇是致政之後言留輔成王之意，其文甚明，馬遷妄為說爾。鄭玄不見《周官》之篇，言此師、保為《周禮》師氏、保氏大夫之職，言賢聖兼此官，亦謬矣。○傳“尊之”至“名篇”○正義曰：周公呼為“君奭”，是周公尊之曰君也。“奭”是其名，“君”非名也。僖二十四年《左傳》，富辰言文王之子一十六國，無名“奭”者，則召公必非文王之子。《燕世家》雲：“召公奭與周同姓姬氏。”譙周曰：“周之支族。”譙周考校古史，不能知其所出。皇甫謐雲：“原公名豐，是其一也，是為文王之子一十六國。”然文王之子本無定數，並原、豐為一，當召公於中以為十六，謬矣。此篇多言先世有大臣輔政，是“陳古道以告之”。呼居奭以告之，故以“君奭”名篇。" }
      - { type: j, text: "周公若曰：“君奭，順古道呼其名而告之。弗吊，天降喪於殷，殷既墜厥命，我有周既受。言殷道不至，故天下喪亡於殷。殷已墜失其王命，我有周道至已受之。○吊音的。我不敢知曰，厥基永孚於休，若天棐忱。廢興之跡，亦君所知，言殷家其始長信於美道，順天輔誠，所以國也。○棐音匪。忱，市林反。我亦不敢知曰，其終出於不祥。言殷紂其終墜厥命，以出於不善之故，亦君所知。" }
      - { type: z, text: "“周公”至“不祥”○正義曰：周公留在王朝，召公不說。周公為師，順古道而呼曰：“君奭，殷道以不至之故，故天下喪亡於殷。殷既墜失其王命，我有周已受之矣。今雖受命，貴在能終，若不能終，與殷無異，故視殷以為監戒。我不敢獨知殷家其初始之時，能長信於美道，能安順於上天之，道輔其誠信，所以有國，此亦君之所知。我亦不敢獨知曰，殷紂其終墜失其王命，由出於不善之故，亦君所知也。”○傳“廢興”至“以國”○正義曰：孔以《召誥》雲“我不敢知”者，其意召公言我不敢獨知，亦王所知，則此言“我不敢知”，亦是周公言我不敢獨知，是君奭所知，故以此及下句為說殷之興亡，言與君奭同知。舉其殷興亡為戒，鄭玄亦然也。" }
      - { type: j, text: "嗚呼！君已！曰，時我，我亦不敢寧於上帝命。歎而言曰：“君已！當是我之留，我亦不敢安於上天之命，故不敢不留。”○已音以。弗永遠念天威，越我民罔尤違。言君不長遠念天之威，而勤化於我民，使無過違之闕。惟人在我後嗣子孫，大弗克恭上下，遏佚前人光，在家不知。惟眾人共存在我後嗣子孫，若大不能恭承天地，絕失先王光大之道，我老在家，則不得知。○遏，於葛反。天命不易，天難諶，乃其墜命，弗克經歷。天命不易，天難信無德者，乃其墜失王命，不能經久歷遠，不可不慎。○易，以豉反，注同。諶，氏壬反。嗣前人，恭明德，在今予小子旦。繼先王之大業，恭奉其明德，正在今我小子旦。言異於餘臣。非克有正，迪惟前人光，施於我衝子。”我留非能有改正，但欲蹈行先王光大之道，施正於我童子。童子，成王。" }
      - { type: z, text: "“嗚呼”至“衝子”○正義曰：周公又歎而呼召公曰：“嗚呼！君已！”“已”，辭也。既歎乃復言曰：“君當是我之留，勿非我也。我亦不敢安於上天之命，故不敢不留。君何不長遠念天之威罰？禍福難量，當勤教於我下民，使無尤過違法之闕。惟今天下眾人，共誠心存在我後嗣子孫。觀其政之善惡，若此嗣王大不能恭承上天下地，絕失先王光大之道，令使眾人失望，我若退老在家，則不能得知，何得不留輔王也？天命不易，言甚難也。天難信，惡則去之，不常在一家，是難信也。天子若不稱天意，乃墜失其王命，不能經久歷遠，其事可不慎乎？繼嗣前人先王之大業，恭奉其明德也，正在今我小子旦。”周公自言已身當恭奉其先王之明德，留輔佐王。“非能有所改正，但欲蹈行先王光大之道，施政於我童子”。童子謂成王，意欲奉行先王之事，以教成王也。○傳“歎而”至“不留”○正義曰：歎而言曰：“嗚呼！君已！”“已”是引聲之辭，既呼君奭，歎而引聲，乃復言曰：“君當是我之留。”以其意不說，故令是我而勿非我。“我不敢安於上天之命”，孔意當謂天既命周，我當成就周道，故不敢不留。" }
      - { type: j, text: "又曰：“天不可信，我道惟寧王德延，無德去之，是天不可信，故我以道惟安寧王之德，謀欲延久。天不庸釋於文王受命。”言天不用令釋廢於文王所受命，故我留佐成王。" }
      - { type: z, text: "“又曰”至“受命”○正義曰：周公又言曰：“天不可信，無德則去之，是其不可信也。天難信之，故恐其去我周家，故我以道惟安行寧王之德，謀欲延長之。我原上天之意，不用令廢於文王所受命，若嗣王失德，則還廢之，故我當留佐成王也。”○傳“無德”至“延久”○正義曰：此經言“又曰”，傳不明解。鄭雲“人又云”，則鄭玄以此“又曰”為周公稱人之言也。王肅雲：“重言天不可信，明己之留蓋畏其天命。”則肅意以周公重言，故稱“又曰”。孔雖不解，當與王肅意同。言“寧王”者，即文王也，鄭、王亦同。" }
      - { type: j, text: "公曰：“君奭，我聞在昔成湯既受命，已放桀，受命為天子。時則有若伊尹，格於皇天。尹摯佐湯，功至大天。謂致太平。○摯音至。在太甲，時則有若保衡。太甲繼湯，時則有如此伊尹為保衡，言天下所取安，所取平。在太戊，太甲之孫。時則有若伊陟、臣扈，格於上帝，巫咸乂王家。伊陟、臣扈率伊尹之職，使其君不隕祖業，故至天之功不隕。巫咸治王家，言不及二臣。○隕，于敏反。在祖乙，時則有若巫賢。祖乙，殷家亦祖其功，時賢臣有如此巫賢。賢，鹹子。巫，氏。在武丁，時則有若甘盤。高宗即位，甘盤佐之，後有傅說。○說音悅。" }
      - { type: z, text: "“公曰君奭”至“甘盤”○正義曰：言“時則有若”者，言當其時有如此人也。指謂如此伊尹、甘盤，非謂別有如此人也。以湯是殷之始王，故言“在昔”、“既受命”，見其為天子也。以下“在太甲”、“在武丁”，亦言其為天子之時，有如此臣也。成湯未為天子，已得伊尹，言“既受命”者，以功格皇天，在受命之後，故言“既受命”也。“皇天”之與“上帝”，俱是天也，變其文爾。其功至於天帝，謂致太平而天下和之也。保衡、伊尹，一人也。異時而別號。“伊尹”之下，已言“格於皇天”，“保衡”之下不言“格於皇天”，從可知也。“伊陟、臣扈”，言“格於上帝”，則其時亦致太平，故與伊尹文異而事同。巫咸、巫賢、甘盤蓋功劣於彼三人，故無格天之言。○傳“尹摯”至“太平”○正義曰：伊尹名摯，諸子傳記名有其文。“功至大天”猶堯“格於上下”，知其“謂致太平”也。○傳“太甲”至“取平”○正義曰：據《太甲》之篇及諸子傳記，太甲犬臣惟有伊尹，知即保衡也。《說命》雲：“昔先正保衡，作我先王，佑我烈祖，格於皇天。”《商頌·那》祀成湯稱為“烈祖”，“烈祖”，湯之號，言保衡佐湯，明保衡即是伊尹也。《詩》稱“實維阿衡，實左右商王”，鄭玄雲：“阿，倚。衡，平也。伊尹湯所依倚而取平。”至太甲改曰保衡，保，安也，言天下所取安，所取平。此皆三公之官，當時為之號也。孔以《太甲》雲“嗣王不惠於阿衡”，則《太甲》亦曰阿衡，與鄭異也。○傳“太甲之孫”○正義曰：《史記·殷本紀》雲，太甲崩，子沃丁立。崩，弟太庚立。崩，子小甲立。崩，弟雍已立。崩，弟太戊立。是太戊為太甲之孫，太庚之子。《三代表》雲，小甲，太庚弟；雍己、太戊又是小甲弟，則太戊亦是沃丁弟，太甲子。《本紀》、《世表》俱出馬遷，必有一誤。孔於《鹹乂》序傳雲“太戊，沃丁弟之子”，是太戊為太甲之孫也。○傳“伊陟”至“二臣”○正義曰：伊尹“格於皇天”，此伊陟、臣扈雲“格於上帝”，其事既同，如此二臣能率循伊尹之職，輔佐其君，使其君不隕祖業，故至天之功亦不隕墜也。《夏社》序雲：“湯既勝夏，欲遷其社，不可。作《夏社》、《疑至》、《臣扈》。”則湯初有臣扈，已為大臣矣，不得至今仍在，與伊尹之子同時立功。蓋二人名同，或兩字一誤也。案《春秋》範武子光輔五君，或臣扈事湯而又事太戊也。“格於上帝”之下乃言“巫咸乂王家”，則巫咸亦是賢臣，俱能紹治王家之事而已，其功不得至天，言不及彼二臣。○傳“祖乙”至“巫氏”○正義曰：《殷本紀》雲，中宗崩，子仲丁立。崩，弟外壬立。崩，弟河亶甲立。崩，子祖乙立。則祖乙是太戊之孫也。孔以其人稱“祖”，故云“殷家亦祖其功”。賢是鹹子，相傳云然。父子俱稱為“巫”，知“巫”為氏也。○傳“高宗”至“傅說”○正義曰：《孔命》篇高宗雲：“臺小子舊學於甘盤，既乃遯於荒野。”高宗未立之前已有甘盤，免喪不言，乃求傅說，明其即位之初，有甘盤佐之，甘盤卒後有傅說。計傅說當有大功，此惟數六人，不言傅說者，周公意所不言，未知其故。" }
      - { type: j, text: "率惟茲有陳，保乂有殷，故殷禮陟配天，多歷年所。言伊尹至甘盤六臣佐其君，循惟此道，有陳列之功，以安治有殷，故殷禮能升配天，享國久長，多歷年所。天惟純佑命，則商實百姓。殷禮配天，惟天大佑助其王命，使商家百姓豐實，皆知禮節。" }
      - { type: z, text: "“率惟”至“百姓”○正義曰：此伊尹、甘盤六臣等輔佐其君，率循此為臣之道，有陳列之功，以安治有殷，故殷有安上治民之禮，升配上天，享國多歷年之次所。天惟大佑助其為王之命，則使商家富實百姓，為令使商之百姓家給人足，皆知禮節也。○傳“言伊”至“年所”○正義曰：“率”訓循也。說賢臣佐君雲“循惟此道”，當謂循此為臣之道。盡忠竭力以輔其君，故有陳烈於世，以安治有殷，使殷王得安治民。故殷得此安上治民之禮，能升配上天。天在人上，故謂之“升”。為天之子，是“配天”也。享國久長，多歷年所。○傳“殷禮”至“禮節”○正義曰：殷能以禮配天，故天降福。天惟大佑助其王命，風雨以時，年穀豐稔，使商家百姓豐實，家給人足。管子曰：“衣食足，知榮辱。倉廩實，知禮節。”" }
      - { type: j, text: "王人罔不秉德，明恤小臣，屏侯甸。自湯至武丁，其王人無不持德立業，明憂其小臣，使得其人，以為蕃屏侯甸之服。小臣且憂得人，則大臣可知。○屏，賓領反。矧鹹奔走，惟茲惟德稱，用又厥闢。王猶秉德憂臣，況臣下得不皆奔走？惟王此事，惟有德者舉，用治其君事。○闢，必亦反。故一人有事於四方，若卜筮，罔不是孚。”一人，天子也。君臣務德，故有事於四方，而天下化服。如卜筮，無不是而信之。" }
      - { type: z, text: "“王人”至“是孚”○正義曰：“王人”謂與人為王，言此上所說成湯、太甲、太戊、祖乙、武丁，皆王人也。無不持德立業，明憂小臣。雖則小臣，亦憂使得其賢人，以蕃屏侯甸之服。王恐臣之不賢，尚以為憂，況在臣下得不皆勤勞奔走，惟憂王此求賢之事，惟求有德者舉之，用治其君之事乎？君臣共求其有德，所在職事皆治，天子一人有事於四方，天下鹹化而服。如有卜筮之驗，無不是而信之。賢臣助君，致使大治，我留不去，亦當如此也。○傳“自湯”至“可知”○正義曰：王肅雲：“王人猶君人也。”“無不持德立業”，謂持人君之德，立王者之事業。人君之德在官賢人，官得其人，則事業立，故傳以“立業”配“持德”。明憂小臣之不賢，憂欲使得其人，以為蕃屏侯甸之服也。小臣且憂得人，則大臣憂之可知。侯甸尚思得其人，朝廷思之必矣。王肅雲：“小臣，巨之微者，舉小以明大也。”○傳“王猶”至“君事”○正義曰：君之所重，莫重於求賢。官之所急，莫急於得人。故此章所陳，惟言君憂得人，臣能舉賢。以王之尊，猶尚秉德憂臣，況其臣下得不皆奔走？惟王此求賢之事，惟有德者必舉之，置於官位用治其君事也。○傳“一人”至“信之”○正義曰：《禮》天子自稱曰予一人，故為天子也。君臣務求有德，眾官得其人，從上至下，遞相師法，職無大小，莫不治理，故天子有事於四方，發號出令而天下化服。譬如卜筮，無不是而信之。事既有驗，言如是則人皆信之。" }
      - { type: j, text: "公曰：“君奭，天壽平格，保乂有殷，有殷嗣，天滅威。言天壽有平至之君，故安治有殷。有殷嗣子紂，不能平至，天滅亡，加之有威。今汝永念，則有固命，厥亂明我新造邦。”今汝長念平至者安治，反是者滅亡。以為法戒，則有堅固王命，其治理足以明我新成國矣”。" }
      - { type: z, text: "“公曰君奭天”至“造邦”○正義曰：周公呼召公曰：“君奭，皇天賦命，壽此有平至之君。”言有德者必壽考也。“殷之先王有平至之德，故能安治有殷”。言故得安治也。“有殷嗣子紂不能平至，故天滅亡而加之以威。今汝奭當長念天道，平至者安治，不平至者滅亡。以此為法戒，則有堅固王命，其治理足以明我新成國矣”。○傳“言天”至“以威”○正義曰：“格”訓至也。“平”謂政教均平，“至”謂道有所至也。言“不吊”，謂道有不至者。此言“格”，謂道至者。“天壽有平至之君”，有平至之德，則天與之長壽，則知中宗高宗之屬身是也。由其君有平至之德，故能安治有殷，言有殷國安而民治也。有殷嗣子紂，其德不能平至，國不安，民不治，故天滅亡之而加之以威也。孔傳之意，此經專說君之善惡，其言不及臣也。王肅以為兼言君臣，注云：“殷君臣之有德，故安治有殷。言是者，不可不法殷家有良臣也。”鄭注以為專言臣事，“格”謂至於天也。與孔不同。○傳“今汝”至“國矣”○正義曰：上句言善者興而惡者亡，此句令其長安治及念明道。念上二者，故言“今汝長念平至者而安治，反是者滅亡”。念此以為法戒，則有堅固王命，王族必不傾壞。若能如此，其治理足以光明我新成國矣。周自武王伐紂，至此年歲末多，對殷而言故為新國。傳意言不及臣，周公說此事者，蓋言興滅由人，我欲輔王，使為平至之君。" }
      - { type: j, text: "公曰：“君奭，在昔上帝，割申勸寧王之德，其集大命於厥躬。在昔上天，割制其義，重勸文王之德，故能成其大命於其身。謂勤德以受命。○重，直用反。惟文王尚克修和我有夏，亦惟有若虢叔，有若閎夭，文王庶幾能修政化，以和我所有諸夏，亦惟賢臣之助為治，有如此虢、閎。閎，氏。虢，國；叔，字；文王弟。夭，名。○虢，寡白反，徐公伯反。閎音宏。夭，於表反，徐於驕反。有若散宜生，有若泰顛，有若南宮括。散、泰、南宮皆氏。宜生、顛、括皆名。凡五臣佐文王為胥附、奔走、先後、禦侮之任。" }
      - { type: z, text: "“公曰君奭”至“厥躬”○正義曰：公呼召公曰：“君奭，在昔上天斷割其義，重勸文王之德。以文王有德，勸勉使之成功，故文王能成之命於其身。”言文王能順天之意，勤德以受命。○傳“在昔”至“受命”○正義曰：文王去此未久，但欲遠本天意，故云“在昔上天”，作久遠言之。“割制”謂切割絕斷之意，故云“割制其義”。“重勸文王之德”者，文王既已有德，上天佑助而重勸勉，文王順天之意，故其能成大命於其身。王謂勤行德義，以受天命。○傳“文王”至“夭名”○正義曰：文王未定天下，庶幾能修政化，以和我所有諸夏，謂三分有二屬己之諸國也。僖五年《左傳》雲“虢仲、虢叔，王季之穆也”，是虢叔為文王之弟。虢，國名。叔，字。凡言人之名氏，皆上氏下名，故閎、散、泰、南宮皆氏，夭、宜生、顛、括皆名也。○傳“散泰”至“之任”○正義曰：《詩·綿》之卒章稱文王有疏附、先後、奔奏、禦侮之臣，《毛傳》雲：“率下親上曰疏附，相通前後曰先後，喻德宣譽曰奔奏，武臣折衝曰禦侮。”鄭箋雲：“疏附使疏者親也，奔奏使人歸趨之。”《詩》言文王有此四種之臣，經歷言五臣之名，故知五臣佐文王為此任也。此四事者五臣共為此任，非一臣當一事也。鄭雲：“不及呂望者，太師致文王以大德，周公謙不可以自比。”" }
      - { type: j, text: "又曰，無能往來，茲迪彝教文王蔑德，降於國人。有五賢臣，猶曰其少，無所能往來。而五人以此道法教文王以精微之德，下政令於國人。言雖聖人，亦須良佐。亦惟純佑，秉德迪知天威，乃惟時昭文王。文王亦如殷家惟天所大佑，文王亦秉德蹈知天威，乃惟是五人明文王之德。迪見冒聞於上帝，惟時受有殷命哉！言能明文王德，蹈行顯見，覆冒下民，彰聞上天，惟是故受有殷之王命。○見，賢遍反，注同。冒，莫報反，下同，馬作勖，勉也。聞音問，或如字。" }
      - { type: z, text: "“又曰”至“命哉”○正義曰：文王既有賢臣五人，又復言曰：“我之賢臣猶少，無所能往來。五人以此道法教文王以微蔑精妙之德，下政令於國人。德政既善，為天所佑。文王亦如殷家，惟為天所大佑。文王亦秉德，蹈知天威。文王德如此者，乃惟是五人明文王之德使然也。五人能明文王德，使蹈行顯見，覆冒下民，聞於上天，惟是之故得受有殷王之命哉！”言文王之聖，猶須良佐，我所以留輔成王。○傳“有五”至“良佑”○正義曰：“無能往來”一句，周公假為文王之辭。言文王有五賢臣，猶恨其少。又復言曰：“我臣既少，於事無能往來。”謂去還理事，未能周悉，言其好賢之深，不知厭足也。“迪”，道。“彝”，法也。“蔑”，小也，小謂精微也。而五人以此道法教文王以精微之德，用此精微之德下教令於國人。言雖聖人，亦須良佐，以見成王須輔佐之甚也。鄭玄亦云：“蔑，小也。”" }
      - { type: j, text: "武王惟茲四人，尚迪有祿。文王沒，武王立，惟此四人，庶幾輔相武王蹈有天祿。虢叔先死，故曰四人。○相，息亮反。後暨武王，誕將天威，鹹劉厥敵。言此四人後與武王皆殺其敵。謂誅紂。惟茲四人，昭武王，惟冒丕單稱德。惟此四人，明武王之德，使布冒天下，大盡舉行其德。" }
      - { type: z, text: "“武王”至“稱德”○正義曰：文王既沒，武王次立，武功初立，惟此四人，庶幾輔相武王蹈有天下之祿。其後四人，與武王大行天之威罰，皆與共殺其強敵，謂其誅紂也。武王之有天下，惟此四人明武王之德，惟武王佈德，覆冒天下，此四人大盡舉行武王之德。言武王亦得良臣之力。○傳“文王”至“四人”○正義曰：文王受命九年而崩，十三年方得殺紂。“文王沒，武王立”，謂武王初立之時，惟此四人而已。“庶幾輔相武王蹈有天祿”，初立則有此志，故下句言後與武王殺紂也。“虢叔先死，故曰四人”，以是文王之弟，其年應長，故言“先死”也。鄭玄疑不知誰死，注云：“至武王時，虢叔等有死者，餘四人也。”○傳“惟此”至“其德”○正義曰：“單”，盡。“稱”，舉也。使武王之德布冒天下，是此四人之力，言此四人大盡舉行武王之德也。" }
      - { type: j, text: "今在予小子旦，若游大川，予往暨汝奭其濟小子，同未在位，誕無我責。我新還政，今任重在我小子旦，不能同於四方。若游大川，我往與汝奭其共濟渡成王，同於未在位即政時，汝大無非責我留。收罔勖不及，耇造德不降，我則鳴鳥不聞，矧曰其有能格？”今與汝留輔成王，欲收教無自勉不及道義者，立此化，而老成德不降意為之。我周則鳴鳳不得聞，況曰其有能格於皇天乎？" }
      - { type: z, text: "“今在”至“能格”○正義曰：周公言：“我新還政成王，今任之重者，其在我小子之身也。我不能同於四人輔文武，使有大功德，但苟求救溺而已。譬如游於大川，我往與汝奭其共濟渡小子成王，用心輔弼，同於成王未在位之時。恐其未能嗣先人明德，我當與汝輔之，汝大無非責我之留也。我留與汝輔王者，欲收教無自勉力不及道義者。我今欲立此化，而老成德之人不降意為之。我周家則鳴鳳之鳥尚不得聞知，況曰其有能格於皇天者乎？”○傳“我新”至“我留”○正義曰：周公既已還政，則是舍重任矣。而猶言“今任重在我小子旦”者，周公既攝王政，又須傳授得人，若其不能負荷，仍是周公之責，以嗣子劣弱，故言“今任重猶在我小子旦”也。彼四人者能翼贊初基，佑成王業，我不能同於四人，望有大功，惟求救弱而已。《詩》雲“泳之游之”，《左傳》稱“閻敖游湧而逸”，則“游”者入水浮渡之名。譬若成王在大川，我往與汝奭其同共濟渡成王。若雲從此向川，故言“往”也。○傳“今與”至“天乎”○正義曰：王朝之臣有不勉力者，今與汝留輔成王者，正欲收斂教誨。無自勉力不及道義者，當教之勉力，使其及道義也。我欲成立此化，而老成德之人不肯降意為之。我周家則鳴鳳尚不聞知，況曰其有能如伊尹之輩，使其功格於皇天乎？言太平不可冀也。經言“耇造德不降”者，周公以己年老應退而留，因即傳言己類，言己若退，則老成德者悉皆退自逸樂，不肯降意為之。政無所成，祥瑞不至，我周家則鳴鳳不得聞。則鳳是難聞之鳥，必為靈瑞之物，故以“鳴鳥”為鳴鳳。孔子稱“鳳鳥不至”，是鳳鳥難聞也。《詩·大雅·卷阿》之篇歌成王之德，其九章曰：“鳳皇鳥矣，於彼高岡。”鄭雲：“因時鳳皇至，固以喻焉。”則成王之時鳳皇至也。《大雅》正經之作，多在周公攝政之後，成王即位之初，則周公言此之時已鳳皇至，見太平矣。而復言此者，恐其不復能然，故戒之。此經之意，言功格上天，難於致鳳，故以鳴鳳況之格天。案《禮器》雲：“升中於天，而鳳皇降，龜龍假。”“升中”謂功成告天也。如彼《記》文，似功至於天，鳳皇乃降，此以鳴鳳易致況格天之難者乎。《記》以龍鳳有形，是可見之物，故以鳳降龍至為成功之驗，非言成功告天，然後此物始至也。" }
      - { type: j, text: "公曰：“嗚呼！君，肆其監於茲。我受命無疆惟休，亦大惟艱。以朝臣無能立功至天，故其當視於此，我周受命無窮惟美，亦大惟艱難，不可輕忽，謂之易治。告君乃猷裕，我不以後人迷。”告君汝謀寬饒之道，我留與汝輔王，不用後人迷惑，故欲教之。" }
      - { type: z, text: "“公曰嗚呼”至“人迷”○正義曰：周公歎而呼召公曰：“嗚呼！君，我以朝臣無能立功至天之故，故君其當視於此。”謂視此朝臣無能立功之事。“我周家受天之命，無有境界惟美，亦大惟艱難，不可輕忽，謂之易治。我今告君，汝當謀寬饒之道以治下民，使其事可法，我不用使後世人迷惑，故欲教之也”。○傳“告君”至“教之”○正義曰：“猷”訓為謀，告君汝謀寬饒之道，故當以寬饒為法。我留與汝輔王，不用使後人迷惑怪之。無法則迷惑，故欲與汝作法以教之。鄭雲：“召公不說似隘急，故令謀於寬裕也。”" }
      - { type: j, text: "公曰：“前人敷乃心，乃悉命汝，作汝民極。前人文武布其乃心為法度，乃悉以命汝矣，為汝民立中正矣。曰，汝明勖偶王，在亶乘茲大命。汝以前人法度明勉配王，在於成信，行此大命而已。惟文王德，丕承無疆之恤。”惟文王聖德，為之子孫無忝厥祖，大承無窮之憂。" }
      - { type: z, text: "“公曰前”至“之恤”○正義曰：周公又言曰，前人文武布其乃心製法度，乃悉命汝，為民立中正之道矣。治民之法已成就也，戒召公汝當以前人之法度明自勉力，配此成王，在於誠信，行此大命而已。言已有舊法，易可遵行也。惟文王聖德造始周邦，為其子孫欲令無忝厥祖，大承無窮之憂，故我與汝不可不輔。○傳“前人”至“正矣”○正義曰：“乃”，緩辭，不訓為汝。○傳“汝以”至“而已”○正義曰：“勖”，勉也。“偶”，配也。“亶”，信也。汝當以前人法度明自勉力，配成王，在於誠信行大命而已。言其不復須勞心。傳以“乘”為行，蓋以乘車必行，故訓“乘”為行。" }
      - { type: j, text: "公曰：“君，告汝朕允。告汝以我之誠信也。保奭，其汝克敬以予，監於殷喪大否。呼其官而名之，敕使能敬以我言，視於殷喪亡大否。言其大不可不戒。肆念我天威，予不允惟若茲誥，予惟曰：‘襄我二人。’以殷喪大故，當念我天德可畏。言命無常，我不信惟若此誥。我惟曰：“當因我文武之道而行之。”汝有合哉！言曰：‘在時二人，天休滋至，惟時二人弗戡。’言汝行事，動當有所合哉！發言常在是文武，則天美周家，日益至矣，惟是文武不勝受。言多福。其汝克敬德，明我俊民在讓，後人於丕時。其汝能敬行德，明我賢人在禮讓，則後代將於此道大且是。" }
      - { type: z, text: "“公曰君告”至“丕時”○正義曰：周公呼召公曰：“君，我今告汝以我之誠信。”又呼其官而名之：“太保奭，其汝必須能敬以我之言，視於殷之喪亡。殷之喪亡，其事甚大，不可不戒慎。以殷喪大之故，當念我天德可畏。”言天命無常，無德則去之，甚可畏。“我不信惟若此誥而已。我惟言曰：‘當因我文武二人之道而行之。’汝所行事，舉動必當有所合哉！當與文王武王合也。汝所發言，常在是文王武王二人，則天美我周家，日日滋益至矣。其善既多，惟在是文武二人，不能勝受之矣。其汝能敬行德，明我賢俊之人在於禮讓，則後人於此道大且是也。”○傳“言汝”至“多福”○正義曰：“動當有所合哉”，舉動皆合文武也。“發言常在是文武”，言非文武道則不言。" }
      - { type: j, text: "嗚呼！篤棐時二人，我式克至於今日休。言我厚輔是文武之道而行之，或用能至於今日其政美。我鹹成文王功於不怠，丕冒海隅出日，罔不率俾。”今我周家皆成文王功於不懈怠，則德教大覆冒海隅日所出之地，無不循化而使之。" }
      - { type: z, text: "“嗚呼”至“率俾”○正義曰：周公言而歎曰：“嗚呼！我厚輔是二人之道而行之，我用能至於今日其政美。”言今日政美，由是文武之道。“我周家若能皆成文王之功，於事常不懈怠，則德教大覆四海之隅，至於日出之處，其民無不循我化，可臣使也”。戒召公與朝臣皆當法文王之功。" }
      - { type: j, text: "公曰：“君，予不惠若茲多誥，予惟用閔於天越民。”我不順若此多誥而已，欲使汝念躬行之閔勉也。我惟用勉於天道加於民。" }
      - { type: z, text: "“公曰君予”至“越民”○正義曰：公呼召公曰：“君，我不徒惟順如此之事多誥而已，欲使汝躬親行之。我惟用勉力自強於天道，行化於民。”顧氏雲：“我亦自用勉勸，躬行於天道，加益於民人也。”" }
      - { type: j, text: "公曰：“嗚呼！君，惟乃知民德，亦罔不能厥初，惟其終。惟汝所知民德，亦無不能其初，鮮能有終，惟其終則惟君子。戒召公以慎終。○鮮，息淺反。祗若茲，往敬用治。”當敬順我此言，自今以往，敬用治民職事。" }
      - { type: z, text: "“公曰嗚呼”至“用治”○正義曰：周公歎而呼召公曰：“嗚呼！君，惟汝知民之德行，亦無有不能其初，惟鮮能其終。”言行之雖易，終之實難，恐召公不能終行善政，故戒之以慎終。“汝當以敬順我此言，自今以往，宜敬用此治民職事”。戒之使行善不懈怠也。○傳“惟汝”至“慎終”○正義曰：《詩》雲：“靡不有初，鮮克有終。”是凡民之德，無不能其初，少能有終者。凡民皆如是，有終則惟君子。蓋召公至此已說，恐其不能終善，故戒召公汝慎終也。鄭雲：“召公是時意說，周公恐其復不說，故依違託言民德以剴切之。”" }
      - { type: j, text: "《尚書正義》" }
