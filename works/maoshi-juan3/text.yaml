# 毛詩正義卷3（孔穎達疏）：j 為經文＋毛亨傳、鄭玄箋，z 為疏文。
sections:
  - id: juan3
    name: 正文
    blocks:
      - { type: j, text: "《氓》，刺時也。宣公之時，禮義消亡，淫風大行，男女無別，遂相奔誘。華落色衰，復相棄背。或乃困而自悔，喪其妃耦，故序其事以風焉。美反正，刺淫泆也。○氓，莫耕反，民也。《韓詩》雲：“美貌。”別，彼列反。華，戶花反，或音花。復，扶又反。背音佩。喪，息浪反。妃音配。風，福鳳反。泆音逸。" }
      - { type: z, text: "“《氓》六章，章十句”至“淫，佚”。○正義曰：言男女無別者，若“外言不入於閫，內言不出於閫”，是有別也。今交見往來，是無別也。奔誘者，謂男子誘之，婦人奔之也。華落、色衰，一也，言顏色之衰，如華之落也。或乃困而自悔者，言當時皆相誘，色衰乃相棄，其中或有困而自悔棄喪其妃耦者，故敘此自悔之事，以風刺其時焉。美者，美此婦人反正自悔，所以刺當時之淫泆也。“復相棄背”以上，總言當時一國之事。“或乃困而自悔”以下，敘此經所陳者，是困而自悔之辭也。上二章說女初奔男之事，下四章言困而自悔也。“言既遂矣，至於暴矣”，是其困也。“躬自悼矣”，盡“亦已焉哉”，是自悔也。" }
      - { type: j, text: "氓之蚩蚩，抱布貿絲。氓，民也。蚩蚩，敦厚之貌。布，幣也。箋雲：幣者，所以貿買物也。季春始蠶，孟夏賣絲。○蚩，尺之反。貿，莫豆反。匪來貿絲，來即我謀。箋雲：匪，非。即，就也。此民非來買絲，但來就我，欲與我謀為室家也。送子涉淇，至於頓丘。丘一成為頓丘。箋雲：子者，男子之通稱。言民誘己，己乃送之，涉淇水至此頓丘，定室家之謀，且為會期。○頓，都寸反。稱，尺證反。匪我愆期，子無良媒。愆，過也。箋雲：良，善也。非我以欲過子之期，子無善媒來告期時。○愆，起虔反，字又作“諐”。將子無怒，秋以為期。將，原也。箋雲：將，請也。民欲為近期，故語之曰：請子無怒，秋以與子為期。○將，七羊反。語，魚據反。" }
      - { type: z, text: "“氓之”至“為期”。○毛以為，此婦人言己本見誘之時，有一民之善蚩蚩然顏色敦厚，抱布而來，雲當買絲。此民於時本心非為來買絲，但來就我，欲謀為室家之道，以買絲為辭，以來誘己。我時為男子所誘，即送此子涉淇水至於頓丘之地，與之定謀，且為會期。男子欲即於夏中以為期，己即謂之：非我欲得過子之期，但子無善媒來告其期時，近恐難可會，故原子無怒於我，與子秋以為期。○鄭唯以“將為”、“請為”異。其以時對面與之言，宜為請。○傳“氓，民”至“布，幣”。○正義曰：氓、民之一名，對文則異，故《遂人》注云：“變民言甿，異內外也。甿，猶懵懵無知貌。”是其別也。其實通，故下箋雲“言民誘己”，是也。《論語》及《靈臺》注皆雲：“民者，冥也。”此婦人見棄，乃追本男子誘己之時，己所未識，故以悠悠天子之民言之，不取於冥與無知。既求謀己與之相識，故以男子之通稱言之，“送子涉淇”、“將子無怒”是也。既因有廉恥之心，以君子所近而託號之，“以望復關”是也。以婦人號夫為君子，是其常稱，故傳曰：“復關，君子之所近。”又因男子告己雲“爾卜爾筮”，己亦答之雲“以爾車來”也。三章言士、女者，時賢者所言，非男女相謂也。士者，亦男子之大號，因賢者所言，故四章言“士貳其行”也。以蚩蚩言民之狀，故云“敦厚貌”。謂顏色敦厚，己所以悅之。《外府》注云：“布，泉也。其藏曰泉，其行曰布。取名於水泉，其流行無不遍。”《檀弓》注云：“古者謂錢為泉布，所以通布貨財。泉亦為布也。”知此布非泉，而言幣者，以言抱之，則宜為幣，泉則不宜抱之也。《載師》鄭司農雲：“里布者，布參印書，廣二寸，長二尺，以為幣貿易物。”引《詩》雲“‘抱布貿絲’，抱此布也”。司農之言，事無所出，故鄭易之雲“罰以一里二十五家之泉”也。此布幣謂絲麻布帛之布。幣者，布帛之名，故《鹿鳴》雲“實幣帛筐篚”，是也。○箋“季春”至“賣絲”。○正義曰：《月令》季春雲：“后妃齊戒以勸蠶事。”是季春始蠶。孟夏雲：“蠶事既畢，分繭稱絲。”是孟夏有絲賣之也。欲明此婦人見誘之時節，故言賣絲之早晚。以男子既欲為近期，女子請之至秋，明近期不過夏末，則賣絲是孟夏也。○傳“丘一成為頓丘”。○正義曰：《釋丘》雲：“丘一成為敦丘，再成為陶丘，三成為崑崙丘。”孫炎曰：“形如覆敦。敦器似盂。”郭璞曰：“成猶重也。”《周禮》曰：“為壇三成。”又云：“如覆敦者敦丘。”孫炎曰：“丘一成之形象也。”郭璞曰：“敦，盂也，音頓。”與此字異音同。○箋“子者”至“會期”。○正義曰：子者，有德之名。此男子非能有德，直以子者男子之通稱，故謂之為子也。上雲“來即我謀”，男就女來與之謀也。今此送之，故知至此頓丘定室家之謀。又下雲“匪我愆期”，則男子於此與之設期也，故知且為會期。言且者，兼二事也。" }
      - { type: j, text: "乘彼垝垣，以望復關。垝，毀也。復關，君子所近也。箋雲：前既與民以秋為期，期至，故登毀垣，鄉其所近而望之，猶有廉恥之心，故因復關以託號民，雲此時始秋也。○垝，俱毀反。垣音袁。所近，附近之近。鄉，許亮反，本又作“向”。" }
      - { type: z, text: "傳“復關，君子所近”。○正義曰：復關者，非人之名號，而婦人望之，故知君子所近之地。箋又申之猶有廉恥之心，故因其近復關以託號此民，故下雲“不見覆關”、“既見覆關”，皆號此民為復關。又知此時始秋者，上雲“秋以為期”。下四章“桑之落矣”為季秋，三章“桑之未落”為仲秋，故知此時始秋也。" }
      - { type: j, text: "不見覆關，泣涕漣漣。言其有一心乎君子，故能自悔。箋雲：用心專者怨必深。○漣音連，泣貌。既見覆關，載笑載言。箋雲：則笑則言，喜之甚。爾卜爾筮，體無咎言。龜曰卜。蓍曰筮。體，兆卦之體。箋雲：爾，女也。復關既見此婦人，告之曰：我卜女筮，女宜為室家矣。兆卦之繇，無兇諮之辭，言其皆吉，又誘定之。○筮，市制反。體如字，卦兆之體也，《韓詩》作“履”。履，幸也。咎，其九反。蓍音屍。繇，直又反，卦兆之辭也。" }
      - { type: z, text: "傳“體，兆卦之體”。箋“兆卦”至“定之”。○正義曰：傳以經卜、筮並言，故兼雲“兆卦之體”謂龜兆、筮卦也。《左傳》雲：“其繇曰：‘一薰一蕕，十年尚猶有臭。’”是龜之繇。《易》曰：“困於石，據於蒺藜。”是卦之繇也。二者皆有繇辭。此男子實不卜筮，而言皆吉無兇咎者，又誘以定之。前因貿絲以誘之，今復言卜筮以誘之，故言又也。" }
      - { type: j, text: "以爾車來，以我賄遷。賄，財。遷，徙也。箋雲：女，女復關也。信其卜筮皆吉，故答之曰：徑以女車來迎我，我以所有財遷徙就女也。○賄，呼罪反。徑，經定反。" }
      - { type: j, text: "桑之未落，其葉沃若。于嗟鳩兮，無食桑葚。于嗟女兮，無與士耽。桑，女功之所起。沃若，猶沃沃然。鳩，鶻鳩也。食桑葚過則醉而傷其性。耽，樂也。女與士耽則傷禮義。箋雲：桑之未落，謂其時仲秋也。於是時，國之賢者刺此婦人見誘，故於嗟而戒之。鳩以非時食葚，猶女子嫁不以禮，耽非禮之樂。○沃，如字，徐於縛反。葚，本又作“椹”，音甚，桑實也。耽，都南反。鶻音骨。樂音洛，下同。士之耽兮，猶可說也。女之耽兮，不可說也。箋雲：說，解也。士有百行，可以功過相除。至於婦人無外事，維以貞信為節。○行，下孟反。" }
      - { type: z, text: "“桑之”至“不可說”。○毛以為，桑之未落之時，其葉則沃沃然盛，以興己色未衰之時，其貌亦灼灼然美。君子則好樂於己，己與之耽樂。時賢者見己為夫所寵，非禮耽樂，故吁嗟而戒己，言“吁嗟鳩兮，無食桑椹”，猶“吁嗟女兮，無與士耽”。然鳩食桑椹過時則醉而傷其性，女與士耽過度則淫而傷禮義。然耽雖士、女所同，而女思於男，故言士之耽兮，尚可解說，女之耽兮，則不可解說。己時為夫所寵，不聽其言，今見棄背，乃思而自悔。○鄭以為，男子既秋來見己，己使之取車。男子既去，當桑之未落，其葉沃若，仲秋之時。國之賢者刺己見誘，故言：吁嗟鳩兮，無得非時食椹；吁嗟女兮，無得非禮與士耽。士之耽兮，尚可解說，女之耽兮，則不可解說。已時不用其言，至季秋乘車而從之，故今思而自悔。○傳“桑女”至“禮義”。○正義曰：言桑者，女功之所起，故此女取桑落與未落，以興己色之盛衰。毛氏之說，《詩》未有為記時者，明此以為興也。言“鳩，鶻鳩”者，《釋鳥》雲：“鶻鳩，鶻鵃。”某氏曰：“《春秋》雲‘鶻鳩氏司事’，春來冬去。”孫炎曰：“一名鳴鳩。”《月令》雲：“鳴鳩拂其羽。”郭璞曰：“似山鵲而小，短尾，青黑色，多聲。”“宛彼鳴鳩”，亦此鳩也。陸機雲：“班鳩也。”《爾雅》鳩類非一，知此是鶻鳩者，以鶻鳩冬始去，今秋見之，以為喻，故知非餘鳩也。鳩食椹過時者，謂食之過多，故醉而傷其性。經直言“無食桑椹”，而云“過時”者，以“與士耽”相對。耽者過禮之樂，則如食桑椹過時矣。女與士耽以過禮，故為傷禮義，則時賢者戒女之過禮，謂己為君子所寵過度，不謂非禮之嫁為耽也。○箋“桑之”至“之樂”。○正義曰：以上章初秋雲“以爾車來”，始令男子取車，下章季秋雲“漸車帷裳”，謂始適夫家，則桑之未落為仲秋明矣。言“士”、“女”則非自相謂之辭，故知國之賢者刺其見誘而戒之。其時仲秋則無椹，賢者禁鳩食之，由當時無也。假有而食之，為非時。以非時之食椹，以興非禮之行嫁，故云耽非禮之樂。《鄭志》張逸問：“箋雲‘耽非禮之樂’，《小雅》雲‘和樂且耽’，何謂也？”答曰：“禮樂者，五聲八音之謂也。《小雅》亦言過禮之盛。和樂，過禮之言也。燕樂嘉賓過厚，賢也。不以禮耽者，非禮之名，故此禁女為之。《小雅》論燕樂，言作樂過禮，以見厚意，故亦言耽，而文連和樂也。”○箋“士有”至“為節”。○正義曰：士有大功則掩小過，故云可以功過相除。齊桓、晉文皆殺親戚篡國而立，終能建立高勳於周世，是以功除過也。" }
      - { type: j, text: "桑之落矣，其黃而隕。自我徂爾，三歲食貧。淇水湯湯，漸車帷裳。隕，惰也。湯湯，水盛貌。帷裳，婦人之車也。箋雲：桑之落矣，謂其時季秋也。復關以此時車來迎已。徂，往也。我自是往之女家。女家乏穀食巳三歲，貧矣。言此者，明己之悔，不以女今貧故也。幃裳，童容也。我乃渡深水，至漸車童容，猶冒此難而往，又明己專心於女。○隕，韻謹反。湯音傷。漸，子廉反，注同，漬也，溼也。帷，位悲反。隋字又作“墮”，唐果反。冒音墨。難，乃旦反。女也不爽，士貳其行。爽，差也。箋雲：我心於女，故無差貳，而復關之行有二意。○行，下孟反，注同。士也罔極，二三其德。極，中也。" }
      - { type: z, text: "“桑之”至“其德”。○毛以為，桑之落矣之時，其葉黃而隕墜，以興婦人年之老矣之時，其色衰而彫落。時君子則棄己，使無自以託，故追說見薄之漸。言自我往爾男子之家，三歲之後，貧於衣食而見困苦，已不得其志。悔己本為所誘，涉湯湯之淇水，而漸車之帷裳而往，今乃見棄，所以自悔也。既追悔本之見誘，而又怨之，言我心於汝男子也不為差貳，而士何謂二三其行於已也？士也行無中正，故二三其德，及年老而棄已，所以怨也。○鄭以為，婦人言已本桑之落矣，其黃而隕之時，當季秋之月，我往之爾家。自我往汝家時，已聞汝家三歲以來乏於穀食，已貧矣。我不以汝貧之故，猶涉此湯湯之淇水，漸車之帷裳，冒難而來。言已專心於汝如是。今而見棄，所以悔也。餘同。○傳“帷裳，婦人之車”。○正義曰：傳以大夫之車立乘，有蓋無幃裳。此言帷裳者，婦人之車故也。傳於上章以桑為女功所起為興此，桑落黃隕亦興也。其黃而隕既興顏色之衰，則食貧在已衰之後。言自我徂爾，三歲食貧，謂至夫家三歲之後，始貧乏於衣食，漸不得志，乃追悔本冒漸車之難而來也。故王肅曰：“言其色黃而隕墜也。”婦人不慎其行，至於色衰無以自託。我往之汝家，從華落色衰以來，三歲食貧矣。貧者乏食，飢而不充，喻不得志也。○箋“桑之”至“於女”。○正義曰：《月令》季秋草木黃落，故知桑之落矣，其黃而隕，其時季秋也。上使“以爾車來”，不見其迎之事，此言漸車涉水，是始往夫家，故知復關以此時車來迎已也。此始鄉夫家。已言“自我徂爾，三歲食貧”，故以為自我往之汝家之時，汝家乏穀食已三歲，貧矣，我猶渡水而來。此婦人但當悔其來耳。而言穀食先貧者，於時君子家貧，恩意之情遇已漸薄，已遭困苦，所以悔。言已先知此貧而來，明已之悔不以汝今貧之故，直以二三其德，恩意疏薄故耳。幃裳一名童容，故《巾車》雲：重翟、厭翟、安車皆有容蓋。鄭司農雲：“容謂襜車，山東謂之裳幃，或曰童容。”以幃障車之傍，如裳以為容飾，故或謂之幃裳，或謂之童容。其上有蓋，四傍垂而下，謂之襜，故《雜記》曰：“其輤有裧。”注云：“裧謂鱉甲邊緣”，是也。然則童容與襜別。司農雲：“謂襜車者，以有童容，上必有襜，故謂之為襜車也。”此唯婦人之車飾為然，故《士昏禮》雲“婦車亦如之，有襜”，是也。幃裳在傍，渡水則溼，言已雖知汝貧，猶尚冒此深水漸車之難而來，明已專心於汝，故責復關有二意也。" }
      - { type: j, text: "三歲為婦，靡室勞矣。箋雲：靡，無也。無居室之勞，言不以婦事見困苦。有舅姑曰婦。夙興夜寐，靡有朝矣。箋雲：無有朝者，常早起夜臥，非一朝然。言已亦不解惰。○解音懈。言既遂矣，至於暴矣。箋雲：言，我也。遂猶久也。我既久矣，謂三歲之後，見遇浸薄，乃至見酷暴。○浸，子鴆反。兄弟不知，咥其笑矣。咥咥然笑。箋雲：兄弟在家，不知我之見酷暴。若其知之，則咥咥然笑我。○咥，許意反，又音熙，笑也。又一音許四反，《說文》雲：“大笑也”，虛記反，又大結反。靜言思之，躬自悼矣。悼，傷也。箋雲：靜，安。躬，身也。我安思君子之遇已無終，則身自哀傷。" }
      - { type: z, text: "“三歲”至“悼矣”。○正義曰：婦人追說已初至夫家，三歲為婦之時，顏色未衰，為夫所愛，無室家之勞，謂夫不以室家婦事以勞於己。時夫雖如此，己猶不恃寵自安，常自早起夜臥，無有一朝一夕而自解惰。我已三歲之後，在夫家久矣，漸見疏薄，乃至於酷暴矣。我兄弟不知我之見遇如此，若其知之，則咥咥然其笑我矣。我既本為夫所誘，遇己不終，安靜而思之，身自哀傷矣。○箋“有舅姑曰婦”。○正義曰：《公羊傳》曰：“稱婦，有姑之辭。”傳以國君無父，故云有姑。其實婦亦對舅，故《士昏禮》雲“贊見婦於舅姑”，是也。" }
      - { type: j, text: "及爾偕老，老使我怨。箋雲：及，與也。我欲與女俱至於老，老乎汝反薄我，使我怨也。淇則有岸，隰則有泮。泮，坡也。箋雲：泮讀為畔。畔，涯也。言淇與隰皆有厓岸，以自拱持。今君子放恣心意，曾無所拘制。○泮音判。坡本亦作“陂”，北皮反。《澤陂》詩傳雲：“障也。”呂忱北髲反，雲：“陂，阪也，亦所以為隰之限域也。”本或作“破”字，未詳。觀王述意，似作“破拱”，俱勇反，本又作“共”，音同。總角之宴，言笑晏晏。信誓旦旦，總角，結髮也。晏晏，和柔也。信誓旦旦然。箋雲：我為童女未笄結髮宴然之時，女與我言笑晏晏然而和柔，我其以信，相誓旦旦爾。言其懇惻款誠。○宴，如字。本或作“丱”者，非。旦，《說文》作“{且心}{且心}”。懇，起很反。惻，本亦作“{則心}”，楚力反。不思其反。箋雲：反，復也。今老而使我怨，曾不念復其前言。反是不思，亦已焉哉！箋雲：已焉哉，謂此不可奈何，死生自決之辭。" }
      - { type: z, text: "“及爾”至“已焉哉”。○正義曰：言男子本謂已雲：與汝為夫婦，俱至於老，不相棄背。何謂今我既老，反薄我，使我怨？何不念其前言也？然淇則有岸，隰則有泮，以自拱持。今君子反薄而棄己，放恣心意，曾無所拘制。言淇隰之不如。本我總角之宴然幼稚之時，君子與已言笑晏晏然和柔而相親，與已為信誓，許偕至於老者，旦旦然懇惻款誠如是。及今老而使我怨，是曾不思念復其前言，而棄薄我。我反覆是君子不思前言之事，則我亦已焉哉，無可奈何。○箋“我欲”至“我怨”。○正義曰：以下雲“不思其反”，責其不念前言，則男子之初與婦人有期約矣，則此“及爾偕老”，男子之辭，故箋述之雲：我欲與汝俱至於老，老乎汝反薄我，使我怨也。言反薄我，明“及爾偕老”，男子之言也。老者，以華落色衰為老，未必大老也。○傳“泮，坡”。箋“泮讀”至“拘制”。○正義曰：以隰者下溼，猶如澤，故以泮為陂。《澤陂》傳雲“陂，澤障”，是也。箋以泮不訓為陂，故讀為畔，以申傳也。但毛氏於《詩》無易字者，故箋易之，其義猶不異於傳也。畔者，水厓之名，以經雲“有岸”、“有泮”，明君子之無也，故云今君子放恣心意，曾無所拘制，則非君子。○傳“總角”至“旦旦然”。○正義曰：《甫田》雲：“總角丱兮，未幾見兮，突而弁兮”，是男子裛角未冠，則婦人裛角未笄也。故箋雲“我為童女未笄”，《內則》亦云：“男女未冠笄者，總角，衿纓。”以無笄，直結其發，聚之為兩角，故《內則》注云：“故髮結之。”《甫田》傳雲：“總角，聚兩髦也。”《釋訓》雲：“晏晏，柔也。”故此雲：“晏晏，和柔。”又曰：“晏晏，旦旦，悔爽忒也。”謂此婦人恨夫差貳其心，變本言信，故言此晏晏、旦旦而自悔。解言此之意，非訓此字也。定本雲“旦旦”猶“怛怛”。○箋“我為”至“款誠”。○正義曰：箋言結髮宴然之時，解經“總角之宴”。經有作“丱”者，因《甫田》“總角丱兮”，而誤也，定本作“宴”。傳直雲“信誓旦旦然”，不解旦旦之義，故箋申之言，旦旦者，言懇惻為信誓，以盡己款誠也。○箋“曾不復念其前言”。○正義曰：今定本雲“曾不念復其前言”，俗本多誤。“復其前言”者，謂前要誓之言，守而不忘，使可反覆。今乃違棄，是不思念復其前言也。" }
      - { type: j, text: "《氓》六章，章十句。" }
      - { type: j, text: "《竹竿》，衛女思歸也。適異國而不見答，思而能以禮者也。" }
      - { type: j, text: "籊々竹竿，以釣於淇。興也。籊々，長而殺也。釣以得魚，如婦人待禮以成為室家。○籊，他歷反。釣音吊。殺，色界反。豈不爾思？遠莫致之。箋雲：我豈不思與君子為室家乎？君子疏遠己，己無由致此道。○遠如字，又於萬反，注同。" }
      - { type: z, text: "“籊々”至“致之”。○正義曰：籊々然長而殺之竹竿，以釣於淇，必得魚，乃成為善釣，以興婦人嫁於夫，必得禮，乃成為室家。今君子不以禮答己，己豈不思與爾君子為室家乎？但君子疏遠於己，己無由致此室家之道耳" }
      - { type: j, text: "。" }
      - { type: j, text: "泉源在左，淇水在右。泉源，小水之源。淇水，大水也。箋雲：小水有流入大水之道，猶婦人有嫁於君子之禮。今水相與為左右而已，亦以喻已不見答。" }
      - { type: z, text: "傳“泉源”至“大水”。○正義曰：泉源者，泉水初出，故云小水之源。淇則衛地之川，故知大水。箋申說之，言小水有流入大水合為一之道，猶婦人於君子有相親倖之禮。今淇水與泉源左右而已，不相入，猶君子與已異處，不相親，故以喻己之不見答。" }
      - { type: j, text: "女子有行，遠兄弟父母。箋雲：行，道也。女子有道當嫁耳，不以不答而違婦禮。○遠，於萬反。" }
      - { type: j, text: "淇水在右，泉源在左。巧笑之瑳，佩玉之儺。瑳，巧笑貌。儺，行有節度。箋雲：己雖不見答，猶不惡君子，美其容貌與禮儀也。○瑳，七可反，沈又七何反。儺，乃可反，《說文》雲：“行有節也。”惡，烏路反。" }
      - { type: j, text: "淇水滺滺，檜楫松舟。滺滺，流貌。檜，柏葉松身。楫，所以棹舟也。舟楫相配，得水而行，男女相配，得禮而備。箋雲：此傷己今不得夫婦之禮。○浟，本亦作“滺”，音由。檜，古活反，又古會反，木名。楫，本又作“檝”，子葉反，徐音集，《方言》雲：“楫謂之橈，或謂之棹。”《釋名》雲：“楫，捷也，撥水舟行捷疾也。”橈音饒。棹，直教反。" }
      - { type: z, text: "傳“檜，柏葉”至“而備”。○正義曰：《釋木》雲“檜，柏葉松身”。《書》作“栝”字。《禹貢》雲：“杶榦栝柏。”注云：“柏葉松身曰栝。”與此一也。言楫所以棹舟，以喻女所以配男。此不答之詩，以舟楫喻男女，故反而為興，言舟楫相配，得水而行，男女相配，得禮而備。" }
      - { type: j, text: "駕言出游，以寫我憂。出游，思鄉衛之道。箋雲：適異國而不見答，其除此憂，維有歸耳。○鄉，本又作“向”，同，許亮反。" }
      - { type: z, text: "傳“出游，思鄉衛之道”。○正義曰：今定本“思”作“斯”，或誤。" }
      - { type: j, text: "《竹竿》四章，章四句。" }
      - { type: j, text: "《芄蘭》，刺惠公也。驕而無禮，大夫刺之。惠公以幼童即位，自謂有才能而驕慢。於大臣但習威儀，不知為政以禮。○芄音丸，本亦作“丸”。芄蘭，草名。" }
      - { type: z, text: "“《芄蘭》二章，章六句”至“刺之”。○正義曰：毛以為，君子當柔潤溫良，自謂無知。今而不然，是為驕慢，故二章章首一句及第四句是也。下二句言有威儀，是無禮也。次二句言佩觿、佩韘，明雖幼而行成人之事，不當驕慢。鄭以為，幼而行成人之事，當任用大臣，不當驕慢，上四句是也。刺之，亦下二句是也。○箋“惠公”至“以禮”。○正義曰：經言童子，則惠公時仍幼童。童者，未成人之稱，年十九以下皆是也。閔二年《左傳》曰：“初，惠公之即位也少。”杜預雲：“蓋年十五六。”杜氏以傳言“初，衛宣公烝於夷姜，生伋子，為之娶於齊而美，公娶之。生壽及朔。”言為之娶於齊，則宣公己即位也。宣公以隱四年冬立，假令五年即娶齊女，至桓十二年見經，凡十九年，而朔尚有兄壽，則宣公即位三四年始生惠公也，故疑為十五六也。且此自謂有才能，則非身幼也。經雲“能不我知”，是自謂有才能。刺之而言容璲之美，故知但習威儀，不知為政以禮。" }
      - { type: j, text: "芄蘭之支，興也。芄蘭，草也。君子之德當柔潤溫良。箋雲：芄蘭柔弱，恆蔓延於地，有所依緣則起。興者，喻幼稚之君，任用大臣，乃能成其政。○恆蔓於地，蔓音萬，本或作“蔓延於地”者，後人輒加耳。童子佩觿。觿，所以解結，成人之佩也。人君治成人之事，雖童子猶佩觿，早成其德。○佩，蒲對反，依字從人。或玉傍作者，非。觿，許規反，解結之器。雖則佩觿，能不我知。不自謂無知，以驕慢人也。箋雲：此幼稚之君，雖佩觿與，其才能實不如我眾臣之所知為也。惠公自謂有才能而驕慢，所以見刺。○與音餘，下“佩韘與”同。容兮遂兮，垂帶悸兮。容儀可觀，佩玉遂遂然垂其紳帶，悸悸然有節度。箋雲：容，容刀也。遂，瑞也。言惠公佩容刀與瑞及垂紳帶三尺，則悸悸然行止有節度，然其德不稱服。○悸，其季反，《韓詩》作“萃”，垂貌。紳音身。稱，尺證反。" }
      - { type: z, text: "“芄蘭”至“悸兮”。○毛以為，言芄蘭之支性柔弱阿儺，以興君子之德當柔潤溫良。今君之德何以不溫柔而為驕慢？以君今雖童子，而佩成人之觿，則當治成人之事，當須溫柔。何為今雖則佩觿，而才能不自謂我無知以驕慢人也？君非直驕慢，又不知為政當以禮，而徒善其外飾，使容儀可觀兮，佩玉璲々兮，垂其紳帶悸悸兮，而內德不稱，無禮以行之。○鄭以為，言芄蘭之支以柔弱恆延蔓於地，有所依緣則起，以興幼稚之君，以幼時恆闇昧，於政有所任用，乃能成其德教。君今幼弱，何以不任用大臣？君雖童子，佩成人之觿，則當治成人之事。君雖則佩觿，欲治成人之事，其才能實不如我眾臣之所知，何故不任大臣，而為驕慢矣！不知為政以禮，徒善其威儀，佩容刀與瑞玉及垂紳帶，使行止有節度悸悸兮，而內無德以稱之。○傳“芄蘭”至“溫良”。○正義曰：《釋草》雲：“雚，芄蘭。”郭璞曰：“蔓生，斷之有白汁，可啖。”陸機《疏》雲：“一名蘿摩，幽州人謂之雀瓢。”以此草支葉柔弱，序刺君驕慢，故以喻君子之德當柔潤溫良。○箋“芄蘭”至“其政”。○正義曰：以此大夫刺之，而下雲“能不我知”，則刺其驕慢自專，故易傳取其有所依緣，以興幼稚當須任用大臣也。○傳“觿所以”至“其德”。○正義曰：《內則》雲：“子事父母，左佩小觿，右佩大觿。”下別雲“男女未冠笄者”，故知成人之佩。《內則》注云“觿貌如錐，以象骨為之。”是可以解結也。又解童子而得佩成人之佩者，由人君治成人之事，故使得佩，以早成其德故也。《尚書》注云：“人君十二而冠佩為成人。”則似十二以上。要人君雖未十二，亦治成人之事，不必至冠也。此解觿以成人自當佩之，不必國君，為父母在乃服也。下章韘亦佩時有之，舉以言焉，不必國君常佩。○傳“不自謂無知”。○正義曰：傳以此直責君驕慢，言君於才能不肯自謂我無知。○箋“此幼”至“見刺”。○正義曰：箋以此大夫刺之，雲“能不我知”，則大夫自我也。以君才能不如我所知，因解其見刺之意，由自謂有才能而驕慢大臣，故刺之。○傳“容儀”至“節度”。○正義曰：傳以此三者皆言兮，故各為其狀。《孝經》曰：“容止可觀。”《大東》雲：“鞙鞙佩璲。”璲本所佩之物，因為其貌，故言佩玉璲々然。帶之垂者，唯有紳耳，故知垂其紳帶也。“悸悸然有節度”，總三者之辭。○箋“容刀”至“不稱服”。○正義曰：箋以容及璲與帶相類，則皆指體言也，故為容刀與瑞。知紳帶垂三尺者，《禮記·玉藻》雲“紳長，制三尺”，是也。“行止有節度”，亦總三者之辭也。定本雲“然其德不稱服”。" }
      - { type: j, text: "芄蘭之葉，箋雲：葉猶支也。童子佩韘。韘，玦也。能射御則佩韘。箋雲：韘之言沓，所以彄沓手指。○韘，夫涉反。玦，本又作“決”，音同。沓，徒答反。彄，苦侯反。" }
      - { type: z, text: "傳“韘，玦”。箋“韘之言沓”。○正義曰：傳雲玦者，以《禮》及《詩》言決拾。《車攻》傳曰：“決，鉤弦也。”《繕人》注云：“玦，挾矢時所以持弦飾也，著右手巨指。”引《士喪禮》曰：“玦用正，玉棘若擇棘。”則天子用象骨為之，著右臂大指以鉤弦闓體。《大射》、《士喪》注皆然。以士用棘，故推以上用骨。《大射》注“諸侯亦用象骨”，以大夫用骨，不必用象。彼注云“鉤弦”，與《車攻》傳同，則一也。拾，一名遂，以韋為之，著於左臂，所以遂弦，與玦別。鄭以《禮》無以韘為玦者，故易之為沓。《士喪禮》曰：“纊極二。”注云：“極猶放弦也。以沓指放弦，令不挈也。生者以朱韋為之而三，死用纊又二，明不用也。”知生用朱韋而三者，《大射》雲：“朱極三。”注云：“以朱韋為之，食指、將指、無名指。小指短，不用。”此是彄沓手指也。《車攻》雲：“決拾既佽。”箋雲：“手指相比次。”亦謂巨指既著玦，左臂加拾，右手指又著沓而相比次也。" }
      - { type: j, text: "雖則佩韘，能不我甲。甲，狎也。箋雲：此君雖佩韘與，其才能實不如我眾臣之所狎習。○甲如字，《爾雅》同，徐胡甲反，《韓詩》作“狎”。狎，戶甲反。容兮遂兮，垂帶悸兮。" }
      - { type: j, text: "《芄蘭》二章，章六句。" }
      - { type: j, text: "《河廣》，宋襄公母歸於衛，思而不止，故作是詩也。宋桓公夫人，衛文公之妹，生襄公而出。襄公即位，夫人思宋，義不可往，故作詩以自止。" }
      - { type: z, text: "“《河廣》二章，章四句”至“是詩”。○正義曰：作《河廣》詩者，宋襄公母，本為夫所出而歸於衛。及襄公即位，思欲鄉宋而不能止，以義不可往，故作《河廣》之詩以自止也。序言所思之意，經二章皆言義不得往之事。○箋“宋桓”至“自止”。○正義曰：《左傳》雲“公子頑烝於宣姜，生文公及宋桓夫人”，故知文公之妹。襄公，桓公之子，故知襄公之母。今定本無“襄公之母”四字，然子無出母之道，故知當桓公之時，生襄公而出。今系之襄公。言母歸者，明思而不止，當襄公時，故云“襄公即位，夫人思宋”也。所以義不得往者，以夫人為先君所出，其子承父之重，與祖為一體，母出與廟絕，不可以私反，故義不得也。《大戴禮》及《家語》皆雲：“婦有七出：不順父母出，為逆；無子出，為絕人世：淫佚出，為其亂族；疾妒出，為其亂家；有惡疾出，為其不可供粢盛；多口出，為其離親；盜竊出，為其反義。有三不去：有所取，無所歸，不去；更三年喪，不去；前貧賤，後富貴，不去。”於今令犯七出，雖在三不去之中，若不順父母與淫、無子亦出。雖古亦應然，以其終不可絕嗣與勃德故也。諸侯之夫人，雖無子不出，以嬪妾既多，不為絕嗣。故《易·同人》注云“天子諸侯後夫人不出”，是也。知者，以《春秋》魯夫人無子多矣，皆不出。若犯餘六出則去，故《雜記》有出夫人禮。又《春秋》杞伯姬來婦，及此宋桓夫人，皆是也。王后犯出，則廢之而已，皆不出，非徒無子，故《易·鼎卦》注云：“嫁於天子，雖失禮，無出，道遠之而已。”以天子天下為家，其後無所出故也。" }
      - { type: j, text: "誰謂河廣？一葦杭之。杭，渡也。箋雲：誰謂河水廣與？一葦加之則可以渡之，喻狹也。今我之不渡，直自不往耳，非為其廣。○葦，韋鬼反。杭，戶郎反。與音餘，下“遠與”同。狹音洽。為，於偽反。" }
      - { type: z, text: "箋“一葦”至“喻狹”。○正義曰：言一葦者，謂一束也，可以浮之水上而渡，若桴筏然，非一根葦也。此假有渡者之辭，非喻夫人之鄉宋渡河也。何者？此文公之時，衛已在河南，自衛適宋，不渡河。" }
      - { type: j, text: "誰謂宋遠？跂予望之。箋雲：予，我也。誰謂宋國遠與？我跂足則可以望見之。亦喻近也。今我之不往，直以義不往耳，非為其遠。○跂，丘豉反。" }
      - { type: z, text: "箋“誰謂”至“亦喻近”。○正義曰：宋去衛甚遠，故杜預雲：“宋，今梁國睢陽縣也。”言跂足可見，是喻近也。言“亦”者，以喻宋近，猶喻河狹，故俱言“亦”。定本無“亦”字，義亦通。" }
      - { type: j, text: "誰謂河廣？曾不容刀。箋雲：不容刀，亦喻狹小。船曰刀。○刀如字，《字書》作“舠”，《說文》作“<周舟>”，並音刀。" }
      - { type: z, text: "箋“小船曰刀”。○正義曰：上言一葦桴筏之小，此刀宜為舟船之小，故云“小船曰刀。”《說文》作“<舟周>”。<舟周>，小船也，字異音同。劉熙《釋名》雲：“二百斛以上曰艇，三百斛曰刀。江南所謂短而廣、安不傾危者也。”○" }
      - { type: j, text: "誰謂宋遠？曾不崇朝。箋雲：崇，終也。行不終朝，亦喻近。" }
      - { type: j, text: "《河廣》二章，章四句。" }
      - { type: j, text: "《伯兮》，刺時也。言君子行役，為王前驅，過時而不反焉。衛宣公之時，蔡人、衛人、陳人從王伐鄭。伯也為王前驅久，故家人思之。○為，於偽反，又如字。注下“為王”並同。“從王伐鄭”，讀者或連下“伯也”為句者，非。" }
      - { type: z, text: "“《伯兮》四章，章四句”至“不反焉”。○正義曰：此言過時者，謂三月一時。《穀梁傳》“伐不逾時”，故《何草不黃》箋雲“古者師出不逾時，所以厚民之性”，是也。此敘婦人所思之由。經陳所思之辭，皆由行役過時之所致。敘言“為王前驅”，雖辭出於經，總敘四章，非指一句也。○箋“衛宣”至“思之”。○正義曰：蔡人、衛人、陳人從王伐鄭，《春秋》桓五年經也。時當宣公，故云“衛宣公之時”。服虔雲：“言人者，時陳亂無君，則三國皆大夫也，故稱人。”《公羊傳》曰：“其言從王伐鄭何？從王，正也。”鄭答臨碩引《公羊》之文，言諸侯不得專征伐，有從天子及伯者之禮。然則宣公從王為得其正，以兵屬王節度，不由於衛君。而以過時刺宣公者，諸侯從王雖正，其時天子微弱，不能使衛侯從己，而宣公自使從之。據其君子過時不反，實宣公之由，故主責之宣公，而云“刺時”者也。" }
      - { type: j, text: "伯兮朅兮，邦之桀兮。伯，州伯也。朅，武貌。桀，特立也。箋雲：伯，君子字也。桀，英桀，言賢也。○朅，丘列反。桀，其列反。" }
      - { type: z, text: "傳“伯州伯”至“特立”。○正義曰：言為王前驅，則非賤者。今言伯兮，故知為州伯，謂州里之伯。若牧下州伯，則諸侯也，非衛人所得為諸侯之州長也。謂之伯者，伯，長也。《內則》雲“州史獻諸州伯，州伯命藏諸州府”。彼州伯對閭史、閭府，亦謂州里之伯。傑者，俊秀之名，人莫能及，故云特立。○箋“伯，君子字”。○正義曰：伯、仲、叔、季，長幼之字，而婦人所稱雲伯也，宜呼其字，不當言其官也。此在前驅而執兵，則有勇力，為車右，當亦有官，但不必州長為之。朅為武貌，則傑為有德，故云英傑。傑亦特立，與傳一也。" }
      - { type: j, text: "伯也執殳，為王前驅。殳長丈二而無刃。箋雲：兵車六等，軫也，戈也，人也，殳也，車戟也，酋矛也，皆以四尺為差。○殳，市朱反。長如字，又直亮反。軫，本亦作“<車爾>”，之忍反。酋，在由反，發聲。矛音謀。" }
      - { type: z, text: "傳“殳長丈二而無刃”。○正義曰：《考工記》雲：“殳長尋有四尺。”尋八尺，又加四尺，是丈二也。冶氏為戈戟之刃，不言殳刃，是無刃也。○箋“兵車”至“為差”。○正義曰：因殳是兵車之所有，故歷言六等之差。《考工記》曰：“兵車六等之數：車軫四尺，謂之一等。戈秘六尺有六寸，既建而迤，崇於軫四尺，謂之二等。人長八尺，崇於戈四尺，謂之三等。殳長尋有四尺，崇於人四尺，謂之四等。車戟常崇於殳四尺，謂之五等。酋矛常有四尺，崇於戟四尺，謂之六等。”是也。彼注云：“戈、殳、戟、矛皆插車輢。”此雲執之者，在車當插，用則執之，此據用以言也。又《廬人》先言戈、殳、車戟、酋矛、夷矛之長短，乃雲“攻國之兵”。又云：“六建既備，車不反覆。”注云：“六建，五兵與人也。”則六建於六等不數軫而數夷矛。不引之者，因六等自軫歷數人殳以上為差之備故。引之六等者，自地以上數之，其等差有六，故注云“法《易》之三才六畫”，非六建也。建者，建於車上，非車上所建也。凡兵車皆有六建，故《廬人》先言戈、殳、車戟、酋矛、夷矛，乃雲“攻國之兵”，又云“六建既備”，六建在車，明矣。但記者因酋矛、夷矛同為矛稱，故自軫至矛為六等，象三材之六畫，故不數夷矛。其實六建與六等一也。若自戈以上數為六等，則人於六建不處其中。故鄭雲“車有天地之象，人在其中焉”，明為由此，故自軫數之，以戈、軫為地材。人、殳為人材，矛、戟為天材，人處地上，故在殳下。如此則得其象矣。或以為，凡兵車則六建，前驅則六等。知不然者，以《考工記》“兵車六等之數”，鄭雲“此所謂兵車也”，明兵車皆然，非獨前驅也。前驅在車之右，其當有勇力以用五兵，不得無夷矛也。《司兵》雲“掌五兵”，鄭司農雲：“五兵者，戈、殳、戟、酋矛、夷矛。”又曰：“軍事，建車之五兵。”注云：“車之五兵，司農所云者是也。”步卒之五兵則無夷矛，而有弓矢，則前驅非步卒，必有夷矛明矣。知步卒五兵與在車不同者，《司右》雲：“凡國之勇力之士，能用五兵者屬焉。”注云：“勇力之士屬焉者，選右當於中。”《司馬法》雲弓矢、殳、矛、戈、戟相助，“凡五兵，長以衛短，短以救長”。以《司兵》雲“建車之五兵”，則步卒五兵與車兵異矣。夷矛長，非步卒所宜用，故以《司馬法》五兵弓矢、殳、矛、戈、戟當之。車之五兵雲“建”，與“六建”文同，故以司農所云戈、殳、戟、酋矛、夷矛當之。勇力之士屬司右，選右當於中，則仍是步卒，未為右也，故以步卒五兵解之。步卒無夷矛，數弓矢為五兵，在車則六建，除人即五兵。以弓矢不在建中，故不數也。其實兵車皆有弓矢，故《司弓矢》雲：“唐大利車戰、野戰。枉矢、絜矢用諸守城、車戰。”又《檀弓》注云：“射者在左。”又《左傳》曰：“前驅歂犬，射而殺之。”是皆有弓矢也。" }
      - { type: j, text: "自伯之東，" }
      - { type: z, text: "“自伯之東”。○正義曰：此時從王伐鄭，鄭在衛之西南，而言東者，時蔡、衛、陳三國從王伐鄭，則兵至京師乃東行伐鄭也。上雲“為王前驅”，即雲“自伯之東”，明從王為前驅而東行，故據以言之，非謂鄭在衛東。" }
      - { type: j, text: "首如飛蓬。婦人，夫不在，無容飾。豈無膏沐？誰適為容！適，主也。○適，都歷反，注同。為，於偽反，或如字。" }
      - { type: j, text: "其雨其雨，杲杲出日。杲杲然日復出矣。箋雲：人言其雨其雨，而杲杲然日復出，猶我言伯且來，伯且來，則復不來。○杲，右老反。出如字，沈推類反。復，扶又反，下同。原言思伯，甘心首疾！甘，厭也。箋雲：原，念也。我念思伯，心不能已。如人心嗜欲所貪，口味不能絕也。我憂思以生首疾。○厭，於豔反，下同。嗜，市志反。憂思，息嗣反。" }
      - { type: z, text: "“原言思伯，甘心首疾”。○毛於《二子乘舟》傳曰：“原，每也。”則此“原”亦為“每”。言我每有所言，則思念於伯，思之厭足於心，由此故生首疾。○傳“甘，厭”。○正義曰：謂思之不已，乃厭足於心，用是生首疾也。凡人飲食口甘，遂至於厭足，故云“甘，厭也”。○箋“如人”至“不能絕”。○正義曰：箋以甘心者，思之不能已，如口味之甘，故《左傳》雲“請受而甘心焉”。始欲取以甘心，則甘心未得為厭，故云“我念思伯，心不能已”。如人心嗜欲，甘口不能絕。“甘與子同夢”，義亦然。" }
      - { type: j, text: "焉得諼草，言樹之背？諼草令人善忘，背北堂也。箋雲：憂以生疾，恐將危身，欲忘之。○焉，於虔反。諼，本又作“萱”，況爰反，《說文》作“藼”，雲“令人忘憂也”，或作“蕿”。背音佩，沈又如字。令，力呈反。忘，亡向反，又如字。原言思伯，使我心痗！痗，病也。○痗音每，又音悔。" }
      - { type: z, text: "“焉得”至“心痗”。○毛以為，君子既過時不反，己思之至甚，既生首疾，恐以危身，故言我憂如此，何處得一忘憂之草，我樹之於北堂之上，冀觀之以忘憂。伯也既久而不來，每有所言思此伯也，使我心病。○鄭以“願”為“念”為異。○傳“諼草”至“北堂”。○正義曰：諼訓為忘，非草名，故傳本其意，言焉得諼草，謂欲得令人善忘憂之草，不謂諼為草名，故《釋訓》雲：“諼，忘也。”孫氏引《詩》雲“焉得諼草”，是諼非草名也。背者，鄉北之義，故知在北。婦人欲樹草於堂上，冀數見之，明非遠地也。婦人所常處者，堂也，故知北堂。《士昏禮》雲“婦洗在北堂”，《有司徹》雲“致爵於主婦，主婦北堂”，注皆雲：“北堂，房半以北為北堂。堂者，房室所居之地，總謂之堂。房半以北為北堂，房半以南為南堂也。”《昏禮》注云：“洗南北直室東隅，東西直房戶與隅間。”謂在房室之內也。此欲樹草，蓋在房室之北。堂者，總名，房外內皆名為堂也。" }
      - { type: j, text: "《伯兮》四章，章四句。" }
      - { type: j, text: "《有狐》，刺時也。衛之男女失時，喪其妃耦焉。古者國有凶荒，則殺禮而多昏，會男女之無夫家者，所以育人民也。育，生長也。○狐音胡。喪，息浪反，下注同。妃音配，下注同。殺，所戒反，又所例反。“所以育人民也”，本或作“蕃育”者，非。長，張丈反。" }
      - { type: z, text: "“《有狐》三章，章四句”至“人民”。○正義曰：作《有狐》詩者，刺時也。以時君不教民隨時殺禮為昏，至使衛之男女失年盛之時為昏，而喪失其妃耦，不得早為室家，故刺之。以古者國有凶荒，則減殺其禮，隨時而多昏，會男女之無夫家者，使為夫婦，所以蕃育人民。刺今不然，男女失時，謂失男女年盛之時，不得早為室家，至今人而無匹，是喪其妃耦，非先為妃而相棄也。與《氓序》文同而義異。《大司徒》曰：“以荒政十有二，聚萬民。十曰多昏。”注云：“荒，凶年也。多昏，不備禮而娶昏者多也。”是凶荒多昏之禮也。序意言古者有此禮，故刺衛不為之，而使男女失時。非謂以此詩為陳古也，故經皆陳喪其妃耦，不得匹行，思為夫婦之辭。" }
      - { type: j, text: "有狐綏綏，在彼淇梁。興也。綏綏，匹行貌。石絕水曰梁。○綏音雖。心之憂矣，之子無裳！之子，無室家者。在下曰裳，所以配衣也。箋雲：之子，是子也。時婦人喪其妃耦，寡而憂是子無裳。無為作裳者，欲與為室家。○無為，於偽反" }
      - { type: z, text: "“有狐”至“無裳”。○正義曰：有狐綏綏然匹行，在彼淇水之梁，而得其所，以興今衛之男女皆喪妃耦，不得匹行，乃狐之不如。故婦人言心之憂矣，是子無室家，已思欲與之為室家。裳之配衣，猶女之配男，故假言之子無裳，已欲與為作裳，以喻巳欲與之為室家。○傳“綏綏，匹行貌”。○正義曰：序雲“喪其妃耦”而言，故知綏綏是匹行之貌。○傳“之子”至“配衣”。○正義曰：以此稱婦人之辭。言之子無裳，則謂男子為之子也，故言“之子，無室家者”。直指言無裳，則因事見義，以喻己當配夫，故云“裳，所以配衣”。二章傳曰“帶，所以申束衣”，則傳皆以衣喻夫，以裳帶喻妻，宜配之也。故箋雲是子無裳，欲與為室家之道，申說傳“裳所以配衣”之義。" }
      - { type: j, text: "有狐綏綏，在彼淇厲。厲，深可厲之旁。○厲，力滯反。心之憂矣，之子無帶！帶，所以申束衣。" }
      - { type: j, text: "有狐綏綏，在彼淇側。心之憂矣，之子無服！言無室家，若人無衣服。" }
      - { type: j, text: "《有狐》三章，章四句。" }
      - { type: j, text: "《木瓜》，美齊桓公也。衛國有狄人之敗，出處於漕，齊桓公救而封之，遺之車馬器服焉。衛人思之，欲厚報之，而作是詩也。○瓜，古花反。遺，唯季反，下注同。" }
      - { type: z, text: "“《木瓜》三章，章四句”至“是詩”。○正義曰：有狄之敗，懿公時也。至戴公，為宋桓公迎而立之，出處於漕，後即為齊公子無虧所救。戴公卒，文公立，齊桓公又城楚丘以封之。則戴也、文也，皆為齊所救而封之也。下總言遺之車馬器服，則二公皆為齊所遺。《左傳》：“齊侯使公子無虧帥車三百乘以戍漕。歸公乘馬、祭服五稱、牛羊豕雞狗皆三百，與門材。歸夫人魚軒、重錦三十兩。”是遺戴公也。《外傳·齊語》曰：“衛人出廬於漕，桓公城楚丘以封之。其畜散而無育，齊桓公與之系馬三百。”是遺文公也。系馬，系於廄之馬，言遺其善者也。器服，謂門材與祭服。傳不言車，文不備。此不言羊豕雞狗，舉其重者言。欲厚報之，則時實不能報也，心所欲耳。經三章皆欲報之辭。" }
      - { type: j, text: "投我以木瓜，報之以瓊琚。木瓜，楙木也，可食之木。瓊，玉之美者。琚，佩玉名。○瓊，求營反，《說文》雲：“赤玉也。”琚音居，徐又音渠。楙音茂，字亦作“茂”，《爾雅》雲：“楙，木瓜也。”匪報也，永以為好也。箋雲：匪，非也。我非敢以瓊琚為報木瓜之惠，欲令齊長以為玩好，結已國之恩也。○為好，呼報反，篇內同。" }
      - { type: z, text: "“投我”至“為好”。○正義曰：以衛人得齊桓之大功，思厚報之而不能，乃假小事以言。設使齊投我以木瓜，我則報之而不能，乃假以瓊琚。我猶非敢以此瓊琚報齊之木瓜，欲令齊長以為玩好，結我以恩情而已。今國家敗滅，出處於漕，齊桓救而封我，如此太功，知何以報之。○傳“木瓜”至“玉名”。○正義曰：《釋木》雲：“楙，木瓜。”以下木桃、木李，皆可食之木，則此木瓜亦美木可食，故郭璞雲“實如小瓜，酸可食”，是也。以言瓊琚，琚是玉名，則瓊非玉名，故云：“瓊，玉之美者。”言瓊是玉之美名，非玉名也。《聘義》注云：“瑜，玉之美者，亦謂玉中有美處謂之瑜。”瑜非玉名也。《有女同車》雲“佩玉瓊琚”，故知“琚，佩玉名”。此言“琚，佩玉名”，下傳雲“瓊瑤，美石”，“瓊玖，玉石”。三者互也。琚言佩玉名，瑤、玖亦佩玉名。瑤言美石，玖言玉名，明此三者皆玉石雜也，故《丘中有麻》傳雲：“玖，石次玉。”是玖非全玉也。" }
      - { type: j, text: "投我以木桃，報之以瓊瑤。瓊瑤，美玉。○瑤音遙，《說文》雲：“美石。”匪報也。永以為好也。" }
      - { type: j, text: "投我以木李，報之以瓊玖。瓊玖，玉名。○玖音久，《書》雲：“玉黑色。”匪報也，永以為好也。孔子曰：“吾於《木瓜》，見苞苴之禮行。”箋雲：以果實相遺者，必苞苴之。《尚書》曰：“厥苞橘柚。”○苴，子餘反。橘，均栗反。柚，餘救反。" }
      - { type: z, text: "傳“孔子”至“禮行”。○正義曰：《孔叢》雲：孔子讀《詩》，自二《南》至於《小雅》，喟然歎曰：“吾於二《南》，見周道之所成。於《柏舟》，見匹夫執志之不易。於《淇奧》，見學之可以為君子。於《考槃》，見遯世之士而無悶於世。於《木瓜》，見苞苴之禮行。於《緇衣》，見好賢之至。”是也。傳於篇末乃言之者，以《孔叢》所言，總論一篇之事，故篇終言之。《小弁》之引《孟子》亦然。○箋“以果”至“橘柚”。○正義曰：箋解於木瓜所以得見苞苴之禮者，凡以果實相遺者，必苞苴之。此投人以木瓜、木李，必苞苴而往，故見苞苴之禮行。知果實必苞之者，《尚書》曰：“厥苞橘柚。”橘柚在苞，明果實皆苞之。《曲禮》注云：“苞苴裹魚肉。”不言苞果實者，注舉重而略之。此苞之所通，《曲禮》注云：“或以葦，或以茅。”故《既夕禮》雲“葦苞二”，《野有死麕》“白茅苞之”，是或葦或茅也。" }
      - { type: j, text: "《木瓜》三章，章四句。" }
      - { type: j, text: "衛國十篇，三十四章，二百四句。" }
      - { type: j, text: "《毛詩正義》" }
