# 長物志·禽魚：點校中導覽（teaser）
sections:
  - id: qin-yu
    name: 禽魚
    blocks:
      - type: j
        text: 禽魚
      - type: z
        text: 導：此章論禽魚。幽人與生靈會心：鳥聲魚色，皆成清玩；愛養餌飼，得其性情。薦語：「語鳥拂閣以低飛，游魚排荇而徑度」。
      - type: j
        text: 語鳥拂閣以低飛，游魚排荇而徑度，幽人會心，輒令竟日忘倦。
      - type: z
        text: 讀：「會心」是眼：所觀非鳥魚，乃自心。低飛、徑度二語寫生極細，誦之如見閣影水光。
      - type: j
        text: 故必疏其雅潔可供清玩者數種，令童子愛養餌飼，得其性情，庶幾馴鳥雀，狎鳧魚，亦山林之經濟也。
      - type: z
        text: 讀：愛物有道：「得其性情」非玩物，乃經世之小者。晚明士人之玩，亦是一種學問。
