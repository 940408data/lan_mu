# 孟子注疏卷2（孫奭疏）：j 為經文＋漢趙岐注，z 為疏文。
sections:
  - id: juan2
    name: 正文
    blocks:
      - { type: j, text: "（梁惠王者，魏惠王也。魏，国名。惠，谥也。王，号也。时天下有七王，皆僭号者，犹《春秋》之时，吴、楚之君称王也。魏惠王居於大梁，故号曰梁王。圣人及大贤有道德者，王公侯伯及卿大夫咸原以为师。孔子时，诸侯问疑质礼，若弟子之问师也。鲁、卫之君，皆专事焉，故《论语》或以弟子名篇，而有《卫灵公》、《季氏》之篇。孟子亦以大儒为诸侯师，是以《梁惠王》、《滕文公》题篇，以《公孙丑》等而为之，一例者也。）" }
      - { type: z, text: "“梁惠王章句上”。○正义曰：自此至《尽心》，是《孟子》七篇之目及次第也。总而言之，则《孟子》为此书之大名，“梁惠”以下为当篇之小目。其次第盖以圣王之盛，唯有尧舜，尧舜之道，仁义为首，故以梁惠王问利国，对以仁义为七篇之首也。此篇凡二十三章赵氏分为上下卷。此上卷只有七章一章言治国以仁义为名。二章言圣王之德，与民共乐，恩及禽兽。三章言王化之本，在於使民养生丧死之用足备。四章言王者为政之道，生民为首。五章言百里行仁，天下归之。六章言定天下者一道而已，不贪杀人者，人则归之。七章言典籍攸载，帝王之道无传霸之事。其馀十六章分在下卷，各有言说，大抵皆是君国之要务，故述为篇章之先。凡此二十三章既以梁惠王问利国为章首，遂以《梁惠王》为篇名。《公孙丑》以下诸篇，所以次当篇之下，各有所说。云章句者，章文之成也；句者，辞之绝也。又言章者，明也，总义包体，所以明情者也；句必联字而言，句者局也，联字分疆，所以局言者也。○注云：“梁惠”至“例者也”。○正义曰：案《史记·世家》云：“魏之先，毕公高之後也。武王伐纣，而高封於毕，是为毕姓。其後绝封，为庶人，或在夷狄，其裔曰毕万，事晋献公。献公十六年，以魏封毕万为大夫。卜偃曰：‘毕万之後必大矣。万，满数也。魏，大名也。’毕万封十一年，献公卒。毕万之世弥大，从其国名为魏氏。生武子，武子生悼，悼生嬴，嬴生魏献子，子生侈，侈之孙曰魏桓子，桓子孙曰文侯，文侯卒，子击立为武侯，武侯卒，子立为惠王。惠王二十一，齐、赵共伐我邑，於是徙都大梁。”然则梁惠王是武侯之子，名，谥曰惠。《谥法》云：“爱人好与曰惠。”《汲冢纪年》云：“梁惠成王九年四月甲寅徙都大梁。”○《字林》云：“王者天地人，一贯三为王，天下所法也。”是时天下有七王者，魏、赵、韩、秦、齐、楚、燕七雄之王也。云“《论语》或以弟子名篇，而有《卫灵》、《季氏》之篇者，如《颜渊》、《子路》、《子张》，是弟子名篇也，赵岐所以引而为例。" }
      - { type: j, text: "孟子见梁惠王。（孟子梁，魏惠王礼请孟子见之。）王曰：“叟，不远千里而来，亦将有以利吾国乎？”（曰，辞也。叟，长老之称，犹父也。孟子去齐，老而之魏，王尊礼之曰：父，不远千里之路而来，此亦将有以为寡人兴利除害者乎？）孟子对曰：“王何必曰利，亦有仁义而已矣。（孟子知王欲以富国强兵为利，故曰：王何以利为名乎？亦有仁义之道可以为名。以利为名，则有不利之患矣。因为王陈之。）王曰：‘何以利吾国？’大夫曰：‘何以利吾家？’士庶人曰：‘何以利吾身？’上下交征利，而国危矣。（征，取也。从王至庶人，故言上下交争，各欲利其身，必至於篡弑，则国危矣。《论语》曰：“放於利而行，多怨。”故不欲使王以利为名也。又言交为俱也。）万乘之国，弑其君者必千乘之家。（万乘，兵车万乘，谓天子也。千乘，诸侯也。夷羿之弑夏后，是以千乘取其万乘者也。）千乘之国，弑其君者必百乘之家。（天子建国，诸侯立家。百乘之家，谓大国之卿食采邑有兵车百乘之赋者也，若齐崔、卫甯、晋六卿等，是以其终亦皆弑君，此以百乘取千乘也。上下乘当言国，而言家者，诸侯以国为家，亦以避万乘称，故称家。君臣上下之辞。）万取千焉，千取百焉，不为不多矣。（周制：君十卿禄。君食万锺，臣食千锺，亦多，故不为不多矣。）苟为後义而先利，不夺不餍。（苟，诚也。诚令大臣皆後仁义而先自利，则不篡夺君位，不足自餍饱其欲矣。）未有仁而遗其亲者也，未有义而後其君者也。（仁者亲亲，义者尊尊。人无行仁而遗弃其亲也，无行义而忽後其君长。）王亦曰仁义而已矣，何必曰利！”（孟子复申此者，重嗟其祸也。）" }
      - { type: z, text: "“孟子见梁惠王”至“何必曰利”。○正义曰：此章言治国之道，当以仁义为名，然后上下和亲，君臣集穆，天经地义，不易之道，故以建篇立始也。“孟子见梁惠王”者，是孟子自齐至梁见惠王也。“王曰：叟，不远千里而来，亦将有以利吾国乎？”者，王，号也，以业为言也；曰，发语词也；叟，尊老之称也，言惠王尊老孟子也。惠王尊孟子，曰：叟，不远千里之路而至，此相将亦有以利益我国乎？云“亦”与”“乎”者，况外物不可必，又非可止於一事耳，故云“亦乎”，与《论语》云“不亦说乎”“不亦乐乎”同。“孟子对曰：王何必曰利，亦有仁义而已矣”者，是孟子答惠王也。言王何必特止曰财利，我亦有仁义之道，以利益而已。上利以财利为言，下利以利益为言。“王曰：何以利吾国？大夫曰：“何以利吾家？士庶人曰：何以利吾身？上下交征利，而国危矣”者，是孟子托言也。言惠王今问我曰何以利益我国，则为王之大夫必问我曰何以利益我家，为大夫既欲利益其家，则为王之士庶人亦必问我曰何以利益我身。假使上至下至於士庶人，皆且取其利益，而国必危乱丧亡矣。王以国为问，大夫以家为问，士庶人以身为问者，王称国，故以国问；大夫称家，故以家问；士庶人无称，故以身问而已。“万乘之国，弑其君者必千乘之家。千乘之国，弑其君者必百乘之家”者，孟子言上下交取其利而国丧亡者，是万乘之国，弑其君者必千乘之家所弑也，无它焉，则千乘之家欲以万乘之利为多也。千乘之国，弑其君者必百乘之家所弑也，亦无它焉，是百乘之家欲以千乘之利为多也。云弑者，自下杀上谓之弑。“万取千焉，千取百焉，不为不多”者，孟子言凡欲天子之万乘者，且於其内取千乘，而为天子之诸侯；欲诸侯之千乘者，且於其内但取百乘而为之大夫，是亦不为少矣，何必交相争夺，慕多为胜耶？“苟为後义而先利，不夺不餍”者，孟子言且令臣庶皆後去其仁义，而先且以自利，则不交相杀夺，故不足自饱餍。言必杀夺，如千乘夺取万乘，百乘夺取千乘，然後为饱足也。“未有仁而遗其亲者也，未有义而後其君者也”者，孟子言未有心存乎仁而遗弃其亲者，亦未有存义而後去其君者，“王亦曰仁义而已矣，何必曰利”者，孟子重嗟叹其祸，故曰：王今亦当曰亦有仁义而已矣，何必特止言其利。一说云：是惠王悟孟子之言为是，而以己言为非，故亦应之曰：仁义而已矣，何必言利。○注云“孟子”至“见之”。○正义曰：案《魏世家》云：“惠王三十五年，惠王以厚币招贤者，邹衍、淳于髡、孟子皆至梁”是也。○注“曰，辞也”。至“之魏”。○正义曰：词也，从口乙声，亦象口气出也。刘熙曰：叟，长老之称，依皓首之言父，矩也，家长率教者。云“去齐之魏”者，案《史记·列传》云“孟子事齐宣王，宣王不能用，乃魏”是也。○注“征，取也”至“俱也”。○正义曰：征，正也。盖言君子至於利也，非释之而弗取也，特不可交征而正取之尔，犹季氏聚敛以弱鲁，赵孟资之倾晋之类故也。引“《论语》曰：放於利而行，多怨”者，证其上下交征利而国危亡之意也。孔曰：放，依也。每事依利而行，取怨之道也。云“交，俱也”。盖云俱，皆也。○注“万乘”至“万乘也”。○正义曰：案《司马法》云“六尺为步，步百为亩，亩百为夫，夫三为屋，屋三为井，井十为通，通十为成，成方十里，成十为终，终十为同，同方百里，同十为封，封十为畿，畿方千里。有税有赋，税以足食，赋以足兵。一同百里，提封万井，定出赋六千四百井，戎马四百匹，兵车百乘，此卿大夫采地之大者也，是谓百乘之家。一封三百一十六里，提封十万井，定出赋六万四千井，戎马四千匹，兵车千乘，此诸侯之大者也，是谓千乘之国。天子畿方千里，提封百万井，定出赋六十四万井，戎马四万匹，兵车万乘，故称万乘之主。”云“夷羿弑夏后”者，引之以语千乘取万乘也。案鲁襄四年《左传》曰：“昔有夏之方衰也，后羿自Θ迁於穷石，因夏民以代夏政。杜预曰：“禹孙大康淫放失国，夏人立其弟仲康，仲康亦微弱。仲康卒，子相立。羿遂代相，号曰有穷，後为少康所灭。”注云夷羿者，《左传》襄四年杜注云：“夷，氏也。故云夷羿。○注云“齐崔、卫甯、晋六卿等”。○正义曰：此引之以证百乘取千乘也。齐崔，崔杼，为齐之大夫，《语》云“崔子弑齐君”，襄公二十五年《左传》云“崔杼作乱”是也。卫甯，甯喜也，为卫大夫，《史记·世家》卫献公十八年：甯惠子与孙文子逐献公，献公奔齐，齐置献公於聚邑，孙、甯共立定公弟秋为卫君，是为殇公。殇公十二年，为晋平公所执，献公复入卫。後元年诛甯喜。又襄二十六年书“甯喜弑其君剽”是也。六卿：魏献子与韩宣子、赵简子、智文子、中行氏子、范献子六人是也。《史记·世表》云：昭公二十八年，六卿诛公族，分其邑，各使其子为大夫故也。○注“周制”至“不多矣”。○正义曰：周制盖言周之所制也。《王制》云“君十卿禄”是也。云“锺，量名也”，晏子曰“齐旧四量：豆、区、釜、锺，四升为豆，四豆为区，四区为釜，釜十为锺”是也。○注“苟诚也”至“欲矣”。○正义曰：《语》云“苟子之不欲”、“苟能正其身”之苟同。去厌者，《说文》云：“餍，饱也，字从厌从食也，饱则厌食也。”此一章遂为七篇之首章。" }
      - { type: j, text: "孟子见梁惠王。王立於沼上，顾鸿雁麋鹿，曰：“贤者亦乐此乎？”（沼，池也。王好广苑囿，大池沼，与孟子游观，乃顾视禽兽之众多，其心以为娱乐，夸咤孟子曰：贤者，亦乐此乎。）孟子对曰：“贤者而後乐此。不贤者虽有此，不乐也。（惟有贤者然後乃得乐此耳。谓修尧舜之道，国家安宁，故得有此以为乐也。不贤之人，亡国破家，虽有此，亦为人所夺，故不得以为乐也。）《诗》云：‘经始灵台，经之营之，庶民攻之，不日成之。（《诗·大雅·灵台》之篇也。言文王始初经营规度此台，民并来治作之，而不与之相期日限，自来成之。）经始勿亟，庶民子来。（言文王不督促使之。亟，疾也。众民自来赴，若子来为父使之也。）王在灵囿，鹿攸伏，鹿濯濯，白鸟鹤鹤。（鹿，牝鹿也。言文王在囿中，鹿怀妊，安其所而伏不惊动也。兽肥饱则濯濯，鸟肥饱则鹤鹤而泽好而已。）王在灵沼，於刃鱼跃。’（文王在池沼，鱼乃跳跃喜乐，言其德及鸟兽鱼鳖也。）文王以民力为台为沼，而民欢乐之，谓其台曰灵台，谓其沼曰灵沼，乐其有麋鹿鱼鳖。（孟子谓王诵此诗，因曰文王虽以民力筑台凿池，民由欢乐之，谓其台、沼若神灵之所为，欲使其多禽兽以养文王者也。）古之人与民偕乐，故能乐也。（偕，俱也。言古贤之君，与民同乐，故能得其乐。）《汤誓》曰：‘时日害丧，予及女皆亡！’（《汤誓》，《尚书》篇名也。时，是也。是日，乙卯日也。害，大也。言桀为无道，百姓皆欲与汤共伐之，汤临士众誓，言是日桀当大丧亡，我与女俱往亡之。）民欲与之皆亡，虽有台池鸟兽，岂能独乐哉！”（孟子说《诗》、《书》之义，以感喻王，言民欲与汤共亡桀。虽有台池禽兽，何能独乐之哉！复申明上言“不贤者虽有此，不乐也”。）" }
      - { type: z, text: "“孟子见梁惠王”至“岂能独乐哉”。○正义曰：此章言圣王之德，与民共乐，恩及鸟兽，则忻戴其上，大平化兴；无道之君，众怨神怒，则国灭祀绝，不得保守其所乐也。“孟子见梁惠王。王立於沼上，顾鸿雁麋鹿”者，是孟子在梁时，见惠王立於沼之上，而顾盼鸿雁麋鹿之状也。曰“贤者亦乐此乎”者，是惠王称誉孟子为贤者，问孟子亦乐此池沼之上而顾盼鸿雁麋鹿乎？云“乎”，意恐孟子乐与不乐，所以云“乎”而作疑之之辞也。“孟子对曰：贤者而後乐此。不贤者虽有此，不乐也”者，是孟子答惠王。言唯有德之贤者为君，然後得乐於此；如君之不贤，虽有此鸿雁麋鹿之顾，亦不得其乐也。“《诗》云：经始灵台，经之营之，庶民攻之，不日成之。经始勿亟，庶民子来”者至“鱼跃”，是孟子为王诵此《灵台》之诗，以证贤者而後乐此也。言文王规度，始於灵台，而经营之际，众民皆作治之，故台不期日而有成。言其成之速也。既成之速，文王未尝亟疾使民成之用如此之速也，是众民自然若子来如为父之使耳，故如此之速也。“王在灵囿，鹿攸伏，鹿濯濯，白鸟鹤鹤”者，言文王在灵囿之时，鹿皆安其所而伏卧以怀其妊，又且不惊动，非特不惊动，又且濯濯然而肥饱，非特鹿之肥饱，其於白鸟又且鹤鹤然而肥泽也。鹿，牝鹿也。“王在灵沼，於刃鱼跃”者，言文王在灵沼之时，则鱼盈满乎沼中，又且跳跃喜乐如也。言其鱼之微物，亦且得其所也。“文王以民力为台为沼，而民欢乐之，谓其台曰灵台，谓其沼曰灵沼，乐其有麋鹿鱼鳖”者，是孟子至此又自言文王作台沼之意，而感喻于惠王也。文王虽以民力为其台、沼，然而民皆喜乐而为之，如谓其台、沼，则曰灵台、灵沼也。以灵台、灵沼云者，谓其文王之德化，亦乐其有之行如神灵之所至，故谓其台、沼必曰为灵台、灵沼，凡此者无他焉，是众民感文王之德化，亦乐其有鱼鳖禽兽之多以奉养文王也已。“古之人与民偕乐，故能乐也”者，言古之贤君如此文王与民同其乐，故能得此台池之乐也。“《汤誓》曰：时日害丧，予及女皆亡”者，是孟子引《商书》。谓桀於是时无道，暴虐百姓，故百姓皆欲与汤王共伐之。汤於是往伐，临於众中，诰誓之曰：是日桀当大灭，我与女众共往灭之。一云“时日害丧，予及女皆亡”者，是桀云，故《汤誓》引而言之也。谓桀云天有是日，犹吾之有民，日曷有亡哉！日亡则吾与民亦俱亡矣。“民欲与之皆亡，虽有台池鸟兽，岂能独乐哉”者，是孟子首对惠王曰“不贤者虽有此，不乐也”，故引此桀而证其言也。言桀为不贤之君，民亦欲与汤共伐之，虽有台池、鸟兽，岂能得独享其此乐哉！言不能得乐也。○注云“《诗·大雅》至“成之也”。○正义曰：《周诗·大雅》篇名，曰《灵台》，注云：“天子有灵台者，所以观象，察气之妖祥也。”神之精明者称曰灵，四方而高曰台。文王受命于周，作邑于丰，立灵台。又案《春秋传》曰：“公既视朔，遂登观台以望，而书云物为备。”○注“言文王”至“使也”。○正义曰：案《灵台》之诗，笺云：“亟，急也。度始灵台之基，众民各以子成父事而来攻之。”○注云“鹿”至“泽好”。○正义曰：毛氏《注》云：“鹿，牝鹿也。囿所以域养禽兽也。天子百里，诸侯四十里。”笺云：“攸，所也，言所游伏。”毛注云：“濯濯，娱游也。鹤鹤，肥泽也。”○注“文王”至“鱼鳖”。○正义曰：《诗》注云：“沼，池也。刃，满也。”笺云：“灵沼之鱼，盈满其中，皆跳跃，亦言得其所。”○注云“汤誓”至“亡之”。○正义曰：《汤誓》，《商书》之篇名也。案《史记》云：“是日何时丧？予与女皆亡”る注曰：“《尚书大传》云：桀云天之有日，犹吾之有民，日有亡哉？日亡则吾亦亡矣。”《尚书》孔安国注云：“比桀於日，曰是日何时丧，我与女皆亡，欲杀身以丧桀是也。”《檀弓》云“子卯不乐”，郑注云：“纣以甲子死，桀以乙卯亡也。”" }
      - { type: j, text: "梁惠王曰：“寡人之於国也，尽心焉耳矣。（王侯自称孤寡，言寡人於治国之政，尽心欲利百姓。焉耳者，恳至之辞。）河内凶，则移其民於河东，移其粟於河内。河东凶亦然。（言凶年以此救民也。魏旧在河东，後为强国，兼得河内也。）察邻国之政，无如寡人之用心者。（言邻国之君用心忧民，无如己也。）邻国之民不加少，寡人之民不加多，何也？”（王自怪为政有此惠，而民人不增多於邻国者，何也？）孟子对曰：“王好战，请以战喻。（因王好战，故以战事喻解王意）填然鼓之，兵刃既接，弃甲曳兵而走，或百步而後止，或五十步而後止。以五十步笑百步，则何如？”（填，鼓音也。兵以鼓进，以金退。孟子问王曰：今有战者，兵刃已交，其负者弃甲曳兵而走，五十步而止，足以笑百步者否？）曰：“不可，直不百步耳，是亦走也。”（王曰：不足以相笑也。是人俱走，直争不百步耳。）曰：“王如知此，则无望民之多於邻国也。（孟子曰：王如知此不足以相笑，王之政犹此也，王虽有移民转粟之善政，其好战残民与邻国同，而独望民之多，何异於五十步笑百步者乎？）不违农时，谷不可胜食也。（从此已下，为王陈王道也。使民得三时务农，不违夺其要时，则五饶穰，不可胜食。）数罟不入ㄜ池，鱼鳖不可胜食也。（数罟，密网也。密细之网所以捕小鱼鳖也，故禁之不得用。鱼不满尺不得食。）斧斤以时入山林，材木不可胜用也。（时谓草木零落之时，使材木茂畅，故有馀。）与鱼鳖不可胜食，材木不可胜用，是使民养生丧死无憾也。（憾，恨也。民所用者足，故无恨。）养生丧死无憾，王道之始也。（王道先得民心，民心无恨，故言王道之始。）五亩之宅，树之以桑，五十者可以衣帛矣。（庐井、邑居各二亩半以为宅，各入保城二亩半，故为五亩也。树桑墙下，古者年五十，乃衣帛矣。）鸡豚狗彘之畜，无失其时，七十者可以食肉矣。（言孕字不失时也。七十不食肉不饱。）百亩之田，勿夺其时，数口之家，可以无饥矣。（一夫一妇，耕耨百亩。百亩之田，不可以徭役夺其时功，则家给人足。农夫上中下所食多少各有差，故总言数口之家也。）谨庠序之教，申之以孝悌之义，颁白者不负戴於道路矣。（庠序者，教化之宫也。殷曰序，周曰庠。谨教化，申重孝悌之义。颁者，班也。头半白班班者也。壮者代老，心各安之，故颁者不负戴也。）七十者衣帛食肉，黎民不饥不寒，然而不王者，未之有也。（言百姓老稚温饱，礼义行，积之可以致王也。孟子欲以风王何不行此，可以王天下，有率土之民，何但望民多於邻国？）狗彘食人食而不知检，涂有饿莩而不知发。（言人君但养犬彘，使食人食，不知以法度检敛也。涂，道也。饿死者曰莩。《诗》曰：“莩有梅。”莩，零落也。道路之旁有饿死者，不知发仓廪以用赈救之也。）人死，则曰：‘非我也，岁也。’是何异於剌人而杀之，曰：‘非我也，兵也。’（人死，谓饿疫死者也。王政使然，而曰非我杀之，岁杀之也，此何以异於用兵杀人，而曰非我也，兵自杀之也。）王无罪岁，斯天下之民至焉。”（戒王无归罪於岁，责己而改行，则天下之民皆可致也。○）" }
      - { type: z, text: "“梁惠王曰”至“民至焉”。○正义曰：此章言王化之本，在於使民养生丧死之用足备，然后导之以礼义，责己矜穷，则斯民集矣。王侯自称曰寡，惠王与孟子曰：寡人之於国，尽其心而为民耳矣。“耳矣”者，言至极也。言河内凶荒，我则移徙民於河东之地；河东粟多，我则移之於河内；河东之地凶荒，我则又如此而移民，故曰亦然也。“察邻国之政，无如寡人之用心”者，察，详视也，言详视邻国之君，无有似寡人如此之用心者，然而邻国之人民不加益其损，寡人之人民不加益其多，是如之何？故曰：“邻国之民不加少，寡人之民不加多，何也？”遂以此而问孟子。“孟子对曰：王好战，请以战喻”，是孟子答惠王。言惠王心好征战，故孟子请以战事比喻而解王意。“填然鼓之，兵刃既接，弃甲曳兵而走，或百步而後止，或五十步而後止，以五十步笑百步，则何如”者，是孟子言战事之语也。填，塞也，又满也。赵氏云：鼓音，盖言鼓音之充塞洋洋而盈满也。言鼓音既充塞盈满於战阵之际，则兵刃刀枪既以交接，兵刃既交接，乃弃去其甲、曳散其兵而反走者，或百步之间而止，或五十步之间而止。以五十步之间而止者，则笑走至百步之间而止者，则王以为如何？曰“不可，直不百步耳，是亦走也”，惠王答孟子，言凡征战之际，鼓音既填然，则不可弃去其甲、曳散其兵而相笑走也。虽有走或只止於五十步，或有止於百步，言其但自弃甲曳兵而反走者，是虽止於五十步，不至於百步，然皆是走也，岂可以五十步笑百步哉！故曰“直不百步耳，是亦走也”。“曰：王如知此，则无望民之多於邻国”者，是孟子答惠王。言惠王如能知此不可以五十步笑百步，则王无更望其国民加多於邻国也。意谓王既好征战而残民，而以转粟移民为尽心，欲望民加多於邻国，是亦五十步笑百步之走者也。“不违农时，不可胜食”至“不王未之有也”者，是皆孟子又为王陈其王道也。言使民无违夺其春耕、夏耘、秋收三时之要，则五丰盛饶穰，虽胜食之多，亦不可尽也；密细之网不入於ㄜ池，则鱼鳖不可胜食；斧斤以草木零落之时入山林，不以草木生长之时入之，则材木不可胜用也。与鱼鳖既不可胜食，材木既不可胜用，是使民得以养生丧死无怨恨於不足也。五亩之宅，栽墙下以桑，则年至五十之老，可以着其绢帛；鸡豚狗彘不失其养字之时，则年至七十之老，可以食其肉；百亩之田，不夺其耕耨之时，则七八口之家，可以无饥。凡云“可”者，但得过而已，未至於富足有馀也。谨庠序教化之宫，以申举孝悌之义，而富以教之，则头班班然而半白者不自负戴於道涂之间矣。无他，人皆知孝悌之义，为之壮者必代之尔，故曰班白者不负戴於道路矣。是则五十之老足以衣帛，七十之老足以食肉，而黎庶之民故不饥不寒，然而君上能如此，而民不归往而王之者，必无也。故曰未之有也。“狗彘食人食而不知检，涂有饿莩而不知发，人死，则曰非我也，岁也。是何异於刺人而杀之，曰：非我也。兵也”者，是孟子以此讽惠王也。言人君但养其狗彘，而食人之所食，而王不知检敛；道涂之间有饿死者，而王不知发仓廪以救赈之，见其人死，则推之曰非我之罪，是岁之罪也。言是岁之凶荒而疫死之也，是何异於执其兵器而刺杀人，而曰非我杀也，是兵器自杀之类也。“王无罪於岁，则天下之民至焉”者，是孟子讽之，而又诫之也。言王傥人饿死不归罪於岁，但责己而改行，则天下之民莫不归往而至焉耳。为惠王好征战以麋烂其民，故以此讽之。○注云“王侯自称孤寡”。○正义曰：礼云：诸侯与民言，自称曰寡人，在凶服曰孤。老聃云“王侯寡不”是也。○注云“魏旧河东”至“河内”。○正义曰：案《地理》云：“魏地觜Δ，参之分野，其界自高陵以东，尽河东、河内。河东本殷之旧都，周既灭殷，分其地畿内为三国，《诗·风》邶、、卫是也。”○注云“战事”。○正义曰：庄公十一年《左传》曰：“皆阵曰战。”杜预云：“坚而有备，各得其所，成败决於志力者也。”○注“填，鼓音，兵以鼓进，以金退”。○正义曰：贾逵云：“填，塞也，满也。《礼》云：“色容填填。”《史》云：“车马骈填。”云“兵以鼓进，以金退”者，案《周官·大司马》“辨鼓铎镯铙之用，以教坐作进退疾徐疏数之节”，云“鼓人三鼓，司马振铎，群吏作旗，车徒鼓行，鸣镯，车徒皆行，鸣铙且却”是也。○注“使民得三时务农，不违夺其要时”。○正义曰：《王制》云：“用民之力，岁不过三日。”《周礼·内人职》云：“凡均力政，以岁上下，丰年则公旬用三日焉，中年则公旬用二日焉，无年则公旬用一日焉。”《语》云：“使民以时。”包注曰：“作使民必以其时，不妨夺农务。”荀卿曰：“春耕夏耘，秋收冬藏，四者不失时，故五不绝，而百姓有馀食。”是五不可胜食也。○注“数罟”至“不得食”。○正义曰：释云：数，密也。罟，网也。《荀子》曰：“网罟毒药不入泽，ㄜ池渊沼谨其时禁，故鱼鳖优多而百姓有馀用。”注云：“食足之外，可货易也。”○注“时谓”至“有馀”。○正义曰：《周官·山虞》“掌山林之政令”，云“仲冬斩阳木，仲夏斩阴木”，郑注云：“阳木春夏生，阴木秋冬生者，若松柏之属。”一云阳木生山阳在南者，阴木生山阴在北者。荀卿曰：斩伐养长，不失其时，故山林不童，而百姓有馀材也。○注“庐井”至“衣帛矣”。○正义曰：案《周礼》云：“乃经土地，而井牧其田野。九夫为井，四井为邑。”《遂人》：“掌邦之野，辨其野之土地。上地，夫一廛，田百亩，莱五十亩，馀夫亦如之。”中地，夫一廛，田百亩，莱百亩，馀夫亦如之。下地，夫一廛，田百亩，莱二百亩，馀夫亦如之。”郑司农云：“户计一夫一妇而赋之田，其一户有数口者，馀夫亦受此田也。”廛，居也。莱谓休不耕者。郑玄云：“廛，城邑之居。”《汉志》云：“六尺为步，步百为亩，亩百为夫，夫三为井，井方一里，是为九夫。八家共之，各受私田百亩，公田十亩，是为八百八十亩，馀为廛舍。里有序，而乡有庠。序以明教，庠以行礼，而视化焉。”其有秀异者，移乡，学于庠序；庠序之异者，移国，学于小学；小学之异者，移於大学，命曰造士。行同能偶，则别之以射，然後爵命焉。此先王制士处居、富而教之之大略也。《王制》云：“五十异粮始衰，六十非肉不饱，七十非帛不暖，八十非人不暖，九十虽得人不暖。”是古者五十乃衣帛矣。○注“言人君”至“救之也”。○正义曰：“饿死者曰莩。《诗》曰莩有梅。莩，零落”也者，案《毛诗》而言也。《毛诗》云：“莩，落也”，笺云“梅实尚馀而未落”，是其解也。" }
      - { type: j, text: "梁惠王曰：“寡人原安承教。”（原安意承受孟子之教令。）孟子对曰：“杀人以梃与刃，有以异乎？”（梃杖也。）曰：“无以异也。”（王曰：梃、刃杀人，无以异也。）“以刃与政，有以异乎？”（孟子欲以政喻王。）曰：“无以异也。”（王复曰：梃、刃杀人与政杀人无异也。）曰：“庖有肥肉，厩有肥马，民有饥色，野有饿莩，此率兽而食人也。（孟子言人君如此，率率兽而食人也。）兽相食，且人恶之，为民父母，行政不免於率兽而食人，恶在其为民父母也？（虎狼食禽兽，人犹尚恶视之。牧民为政，乃率禽兽食人，安在其为民父母之道也。）仲尼曰：‘始作俑者，其无後乎？’为其象人而用之也。如之何其使斯民饥而死也。”（俑，偶人也，用之送死。仲尼重人类，谓秦穆公时以三良殉葬，本由有作俑者也。恶其始造，故曰：此人其无後嗣乎？如之何其使斯民饥而死也。孟子陈此以教王爱其民也。○）" }
      - { type: z, text: "“梁惠王曰”至“死也”。○正义曰：此一段宜与前段合为一章赵氏分别之。章指言王者为政之道，生民为首，以政杀人，人君之咎，犹以自刃，疾之甚也。“梁惠王曰：寡人愿安承教”者，是惠王原安意承受孟子之教令也。“孟子对曰：杀人以挺与刃，有以异乎”者，是孟子答惠王，故托此而问惠王，言杀人以杖与刃，有以各异乎？云“乎”者，是又孟子未知惠王以为如何，故疑之也。“曰无以异”者，是惠王答孟子之问，言以杖杀人与刃杀人无以各异，是皆能杀人也。“以刃与政，有以异乎”者，孟子复问以刃与政杀人，有以异。“曰无以异也”者，惠王复曰政之杀人与刃之杀人，亦无以异也，言致人死则一也。“曰：庖有肥肉，厩有肥马，民有饥色，野有饿莩，此率兽而食人也”者，是孟子之讽惠王也。言庖厨之间有肥肉，栈厩之中有肥马，而民皆有饥饿之颜色，郊野之间又有饿而死者，此乃是王率兽而食人也。“兽相食，且人恶之。为民父母，行政不免於率兽而食人，恶在其为民之父母也”者，孟子言兽畜自相食，如虎狼食牛羊，且人犹尚恶见之，况为民之父母，其於行政以治民，尚不免驱率兽而食人，安在其为民之父母也？言行政如此，不足为民之父母也。“仲尼曰：始作俑者，其无後乎”，是孟子引仲尼之言也。言仲尼有云始初作俑偶人者，其无後嗣乎？无他焉，是为其象人而用之也，故後有秦穆公以生人从葬，故曰其无後嗣也。○注“梃，杖也”。○正义曰：《释文》云：“梃，木片也。”○注“俑，偶人也”。○正义曰：《记》云：“孔子谓为俑者不仁。”《埤仓》云：“木人送葬，设关而能踊跳，故名之曰俑。”鲁文公六年，秦穆公卒，以子车氏之三子奄息、仲行、针虎为殉。杜预曰：“以人从葬曰殉。”《诗》有《黄鸟》之篇以哀三良是也。孟子讽之，故曰：如之何使斯民饥饿而死。" }
      - { type: j, text: "梁惠王曰：“晋国，天下莫强焉，叟之所知也。（韩、魏、赵本晋六卿，当此时，号三晋，故惠王言晋国天下之强焉。）及寡人之身，东败於齐，长子死焉，西丧地於秦七百里，南辱於楚。寡人耻之，原比死者壹洒之，如之何则可？”（王念有此三耻，求策谋於孟子。）孟子对曰：“地方百里而可以王。（言古圣人以百里之地以致王天下，谓文王也。）王如施仁政於民，省刑罚，薄税敛，深耕易耨，壮者以暇日修其孝悌忠信，入以事其父兄，出以事其长上，可使制梃以挞秦、楚之坚甲利兵矣。（易耨，芸苗令简易也。制，作也。王如行此政，可使国人作杖以捶敌国坚甲利兵，何患耻之不雪也！）彼夺其民时，使不得耕耨以养其父母，父母冻饿，兄弟妻子离散。彼陷溺其民，王往而征之，夫谁与王敌？（彼，谓齐、秦、楚也。彼困其民，原王往征之也。彼失民心，民不为用，夫谁与共御王之师而为王之敌乎？）故曰：仁者无敌，王请勿疑。”（邻国暴虐，己修仁政，则无敌矣。王请行之，勿有疑也。）" }
      - { type: z, text: "“梁惠王”至“勿疑”。○正义曰：此章指言百里行仁，则天下归之，以政伤民，民乐其亡，以梃服强，仁与不仁也。“梁惠王曰：晋国天下莫强焉，叟之所知也”者，是梁惠王欲问孟子之谋策也。言晋国为天下之最强，叟必知之。“及寡人之身，东败於齐，长子死焉，西丧地於秦七百里，南辱於楚。寡人耻之，愿比死者壹洒之，如之何则可”者，是惠王言晋国逮及寡人之身，东则见败於齐而杀死其长子，西又丧去其地於秦七百里，南又常受辱於楚。寡人心甚愧耻之，今愿近死不惜命者一洗除之，当如之何谋则可以洗除此耻？“孟子对曰：地方百里而可以王”者，是孟子答惠王。言古之圣君，其地但止於百里，尚可以王天下也。“王如施仁政於民，省刑罚，薄税敛，深耕易耨，壮者以暇日修其孝悌忠信，入以事其父兄，出以事其长上，可使制梃以挞秦、楚之坚甲利兵矣”者，是孟子言王自今能施仁政以及民，又省去其刑罚，轻其税敛，使民皆得深耕易耨，壮者以闲暇日修孝悌忠信，入闺门之内以奉事其父兄，出乡党之间以奉事其长上，凡能如此，虽作一捶梃，亦可以鞭挞秦、楚之坚甲利兵矣。然以秦、楚有坚甲利兵，而以一挺可鞭挞者，盖秦、楚常违夺其农时，使民不得耕耨也，故云“彼夺其民时，使不得耕耨以养父母”。又云“父母冻饿，兄弟妻子离散，彼陷溺其民，王往而征之，夫谁与王敌”者，言民既不得耕耨以奉养父母，则为父母者被寒冻饥饿，兄弟者与妻子者皆离背散各。彼秦、楚陷溺其人民如此，而王往彼正其罪，夫更谁敢御王之师而为王之敌者！“故曰：仁者无敌，王请勿疑”者，是孟子请惠王行此仁政，而往正其罪而无敌，如所谓仁者无敌是也遂请之行而无更迟疑也。前所谓闲暇日者，盖言民於耕耨田地之外，有休息闲暇之日也。○注“韩赵魏”至“强焉”。○正义曰：案《史记·年表》云：“定王十六年，魏桓子与韩康子、赵襄子三人败知伯于晋阳，乃至分其地，故号为三晋，是为强国。”云“东败於齐而丧长子”者，案《史记·世家》“惠王三十年，魏伐赵，赵告急於齐。齐宣王用孙子计救赵，魏遂大兴师，大子申自将攻齐，遂与齐人战，败於马陵”是也。云：“西丧地於秦”者，案《史记·年表》云：“周显王十五年，秦与魏战元里，斩首七千，取少梁。”南则常辱於楚。马陵者，案徐广云：“地在於元城。”" }
      - { type: j, text: "孟子见梁襄王。出，语人曰：“望之不似人君，（襄，谥也。魏之嗣王也，望之无俨然之威仪也。）就之而不见所畏焉。（就与之言，无人君操柄之威，知其不足畏。）卒然问曰：‘天下恶乎定？’（卒暴问事。不由其次也。问天下安所定？言谁能定之。）吾对曰：‘定于一。’（孟子谓仁政为一也。）‘孰能一之？’（言孰能一之者。）对曰：‘不嗜杀人者能一之。’（嗜犹甘也。言今诸侯有不甘乐杀人者则能一之。）‘孰能与之？’（王言谁能与不嗜杀人者乎。）对曰：‘天下莫不与也？（孟子曰：时人皆苦虐政，如有行仁，天下莫不与之。）王知夫苗乎？七、八月之间旱，则苗槁矣。天油然作云，沛然下雨，则苗氵孛然兴之矣。其如是，孰能御之？（以苗生喻人归也。周七、八月，夏之五、六月也。油然，兴云之貌。沛然下雨，以润槁苗，则氵孛然己盛，孰能止之？）今夫天下之人牧，未有不嗜杀人者也。如有不嗜杀人者，则天下之民皆引领而望之矣。诚如是也，民归之，由水之就下，沛然谁能御之？’”（今天下牧民之君，诚能行此仁政，民皆延颈望欲归之，如水就下，沛然而来，谁能止之。）" }
      - { type: z, text: "“孟子见梁襄王”至“谁能御之”。○正义曰：此章言定天下者一道，仁政而已，不贪杀人，人则归之，是故文王视民如伤，此之谓也。“孟子见梁襄王，出，语人曰：望之不似人君，就之而不见所畏焉”者，是孟子在梁见襄王，而语於人曰：远望之襄王而不似人君，言无人君之威仪也；就而近之而不见所畏焉，言无人君操柄之威也。“卒然问曰：天下恶乎定”者，是孟子语於人，言襄王卒暴而问我，曰天下谁能定？“吾对曰定于一”者，言我对之曰：定天下者，在乎仁政为一者也。“孰能一之”，是孟子言襄王又问谁能仁政为一。“对曰不嗜杀人者能一之”者，是孟子言我复答之，唯不好杀人者能以仁政为一也。“孰能与之”者，言襄王又问谁能与之不好杀人者。“对曰天下莫不与也”。言我对曰天下之人无有不与之也。“王知夫苗乎？七、八月之间旱，则苗稿矣，天油然作云，沛然下雨，则苗氵孛然兴之矣。其如是，孰能御之”者，是孟子比喻而解王之意也。故问襄王曾知夫苗乎？言夫苗自七、八月之时，则乾旱而无水，苗於是枯稿，上天油然而起云，沛然而降雨，则枯稿之苗又氵孛然兴起而茂。其不嗜杀人者能一之，有如此苗而兴茂，谁能止之也。又言如有行仁，而天下莫不与之，谁能止之而不与也。“今夫天下之人牧，未有不嗜杀人者也”至“谁能御之”者，是孟子因比喻苗而解王之意，又以此复详明之，欲使襄王即晓之也。言今天下为牧养人民之君，未有不好杀人者也。言皆好杀人，若有不好杀人者，则天下之人民皆延颈而望王以归之矣。诚如此上言之者，则民皆归之，亦若水之流，自上而下，其势沛然而来，谁能止之？言无人能止之也。○注“襄谥也”至“仪”。○正义曰：案《世家》云：“惠王在位三十六年卒，子赫立，是为襄王。襄王在位六年卒，谥曰襄。”《谥法》云：“因事有功曰襄。”又曰：“辟土有德曰襄。”○注“周七、八月，夏之五、六月”。○正义曰：周之时，盖以子之月为正，夏之时，建寅之月为正，是知周之七、八月即夏之五、六月也。" }
      - { type: j, text: "齐宣王问曰：“齐桓、晋文之事，可得闻乎？”（宣，谥也。宣王问孟子，欲庶几齐桓公小白、晋文公重耳。孟子冀得行道，故仕於齐，齐不用，乃梁。建篇先梁者，欲以仁义为首篇，因言魏事，章次相从，然後道齐之事。）孟子对曰：“仲尼之徒，无道桓、文之事者，是以後世无传焉，臣未之闻也。（孔子之门徒，颂述宓义以来至文、武、周公之法制耳，虽及五霸，心贱薄之，是以儒家後世无欲传道之者。故曰臣未之闻也。）无以，则王乎？”（既不论三皇、五帝殊无所问，则尚当问王道耳，不欲使王问霸者之事。）曰：“德何如，则可以王矣？”（王曰：德行当何如而可得以王乎？）曰：“保民而王，莫之能御也。”（保，安也。御，止也。言安民则惠，而黎民怀之，若此以王，无能止也。）曰：“若寡人者，可以保民乎哉？”（王自恐德不足以安民，故问之。）曰：“可。”（孟子以为如王之性，可以安民也。）曰：“何由知吾可也？”（王问孟子何以知吾可以保民。）曰：“臣闻之胡曰：王坐於堂上，有牵牛而过堂下者，王见之曰：‘牛何之？’对曰：‘将以衅锺。’王曰：‘舍之，吾不忍其觳觫，若无罪而就死地。’对曰：‘然则废衅锺与？’曰：‘何可废也，以羊易之。’不识有诸？”（胡，王左右近臣也。觳觫，牛当到死地处恐貌。新铸钟，杀牲以血涂其衅郄，因以祭之，曰衅。《周礼·大祝》曰：“堕衅，逆牲逆尸，令锺鼓。”《天府》：“上春，衅宝钟及宝器。”孟子曰：臣受胡言王尝有此仁，不知诚充之否？）曰：“有之。”（王曰有之。）曰：“是心足以王矣。百姓皆以王为爱也，臣固知王之不忍也。”（爱，啬也。孟子曰：王推是仁心，足以至於王道。然百姓皆谓王啬爱其财，臣知王见牛恐惧不欲趋死，不忍，故易之也。）王曰：“然。诚有百姓者，齐国虽褊小，吾何爱一牛？即不忍其觳觫，若无罪而就死地，故以羊易之也。（王曰：亦诚有百姓所言者矣，吾国虽小，岂爱借一牛之财费哉！即见其牛哀之，衅锺又不可废，故易之以羊耳。）曰：“王无异於百姓之以王为爱也，以小易大，彼恶知之？王若隐其无罪而就死地，则牛、羊何择焉？”（异，怪也。隐，痛也。孟子言无怪百姓谓王爱财也，见王以小易大故也。王如痛其无罪，羊亦无罪，何为独释牛而取羊。）王笑曰：“是诚何心哉！我非爱其财而易之以羊也，宜乎百姓之谓我爱也。”（王自笑心不然，而不能自免为百姓所非，乃责己之以小易大，故曰宜乎其罪我也。）曰：“无伤也，是乃仁术也，见牛未见羊也。君子之於禽兽也，见其生，不忍见其死；闻其声，不忍食其肉：是以君子远庖厨也。”（孟子解王自责之心，曰无伤於仁，是乃王为仁之道也。时未见羊，羊之为牲次於牛，故用之耳。是以君子远庖厨，不欲见其生、食其肉也。）王说，曰：“《诗》云：‘他人有心，予忖度之。’夫子之谓也。夫我乃行之，反而求之，不得吾心。夫子言之，於我心有戚戚焉。此心之所以合於王者，何也？”（《诗·小雅·巧言》之篇也。王喜悦，因称是《诗》以嗟叹孟子忖度知己心，戚戚然心有动也。寡人虽有是心，何能足以合於王也。）曰：“有复於王者，曰‘吾力足以举百钧’，而不足以举一羽；‘明足以察秋毫之末’，而不见舆薪。则王许之乎？”（复，白也。许，信也。人有白王如此，王信之乎？百钧，三千斤也。）曰：“否。”（王曰：我不信也。）“今恩足以及禽兽，而功不至於百姓者，独何与？然则一羽之不举，为不用力焉；舆薪之不见，为不用明焉；百姓之不见保，为不用恩焉。故王之不王，不为也，非不能也。”（孟子言王恩及禽兽，而不安百姓，若不用力、不用明者也。不为耳，非不能也。）曰：“不为者与不能者之形何以异？”（王问其状何以异也。）曰：“挟太山以超北海，语人曰‘我不能’，是诚不能也。为长者折枝，语人曰‘我不能’，是不为也，非不能也。故王之不王，非挟太山以超北海之类也；王之不王，是折枝之类也。（孟子为王陈为与不为之形若是，王则不折枝之类也。折枝，案摩折手节解罢枝也。少者耻是役，故不为耳，非不能也。太山、北海皆近齐，故以为喻也。）老吾老，以及人之老；幼吾幼，以及人之幼：天下可运於掌。（老犹敬也，幼犹爱也，敬我之老，亦敬人之老；爱我之幼，亦爱人之幼：推此心以惠民，天下可转之掌上。言其易也。）《诗》云：‘刑于寡妻，至于兄弟，以御于家邦。’言举斯心加诸彼而已。（《诗·大雅·思齐》之篇也。刑，正也。寡，少也。言文王正已妻，则八妾从，以及兄弟。御，享也。享天下国家之福，但举己以加於人而已。）故推恩足以保四海，不推恩无以保妻子。古之人所以大过人者，无他焉，善推其所为而已矣。（大过人者，大有为之君也。善推其心所好恶，以安四海也。）今恩足以及禽兽，而功不至於百姓者，独何与？（复申此，言非王不能，不为之耳。）权，然後知轻重；度，然後知长短。物皆然，心为甚，王请度之。（权，铨衡也，可以称轻重。度，丈尺也，可以量长短。凡物皆当称度乃可知，心当行之乃为仁。心比於物，尤当为之甚者也。欲使王度心如度物也。）抑王兴甲兵，危士臣，构怨於诸侯，然後快於心与？”（抑，辞也。孟子问王抑亦如是，乃快邪？）王曰：“否。吾何快於是？将以求吾所大欲也。”（王言不然，我不快是也，将欲以求吾心所大欲者耳。）曰：“王之所大欲，可得闻与？”（孟子虽心知王意，而故问者，欲令王自道，遂因而陈之。）王笑而不言。（王意大而不敢正言。）曰：“为肥甘不足於口与？轻暖不足於体与？抑为采色不足视於目与？声音不足听於耳与？便嬖不足使令於前与？王之诸臣，皆足以供之，而王岂为是哉！”（孟子复问此五者，欲以致王所欲也，故发异端以问之也。）曰：“否，吾不为是也。”（王言我不为是也。）曰：“然则王之所大欲可知已。欲辟土地，朝秦、楚，莅中国而抚四夷也。（莅，临也。言王意欲庶几王者，临莅中国而安四夷者也。）以若所为，求若所欲，犹缘木而求鱼也。”（若，顺也。顺向者所为，谓构兵诸侯之事，求顺今之所欲莅中国之愿，其不可得，如缘乔木而求生鱼也。）王曰：“若是其甚与？”（王谓比之缘木求鱼为大甚。）曰：“殆有甚焉。缘木求鱼，虽不得鱼，无後灾。以若所为，求若所欲，尽心力而为之，後必有灾。”（孟子言尽心战斗，必有残民破国之灾，故曰殆有甚於缘木求鱼者也。）曰：“可得闻与？”（王欲知其害也。）曰：“邹人与楚人战，则王以为孰胜？”（言邹小楚大也。）曰：“楚人胜。”（王曰楚人胜也。）曰：“然则小固不可以敌大，寡固不可以敌众，弱固不可以敌强。海内之地，方千里者九，齐集有其一。以一服八，何以异於邹敌楚哉？（固，辞也。言小、弱固不可以敌强、大。集会齐地，可方千里，譬一州耳，今欲以一州服八州，犹邹欲敌楚也。）盖亦反其本矣。（王欲服之之道，盖当反王道之本耳。）今王发政施仁，使天下仕者皆欲立於王之朝，耕者皆欲耕於王之野，商贾皆欲藏於王之市，行旅皆欲出於王之涂，天下之欲疾其君者皆欲赴於王。其若是，孰能御之？”（反本道，行仁政，若此则天下归之，谁能止之也。）王曰：“吾忄昏，不能进於是矣。愿夫子辅吾志，明以教我。我虽不敏，请尝试之。”（王言我情思昏乱，不能进行此仁政，不知所当施行也。欲使孟子明言其道，以教训之。我虽不敏，愿尝使小行之也。）曰：“无恒产而有恒心者，惟士为能。若民则无恒产，因无恒心。（孟子为王陈其法也。恒，常也。产，生也。恒产，则民常可以生之业也。恒心，人常有善心也。惟有学士之心者，虽穷不失道，不求苟得耳。凡民迫於饥寒，则不能守其常善之心也。）苟无恒心，放辟邪侈，无不为已。及陷於罪，然後从而刑之，是罔民也。（民诚无恒心，放溢辟邪，侈於奸利，犯罪触刑，无所不为，乃就刑之，是由张罗罔以罔民者也。）焉有仁人在位，罔民而可为也？（安有仁人为君，罔陷其民，是政何可为也？）是故明君制民之产，必使仰足以事父母，俯足以畜妻子，乐岁终身饱，凶年免於死亡。然後驱而之善，故民之从之也轻。（言衣食足，知荣辱，故民从之，教化轻易也。）今也制民之产，仰不足以事父母，俯不足以畜妻子，乐岁终身苦，凶年不免於死亡，此惟救死而恐不赡，奚暇治礼义哉！（言今民困穷，救死恐冻饿而不给，何暇修礼行义乎？）王欲行之，则盍反其本矣！五亩之宅，树之以桑，五十者可以衣帛矣。鸡豚狗彘之畜，无失其时，七十者可以食肉矣。百亩之田，勿夺其时，八口之家可以无饥矣。谨庠序之教，申之以孝悌之义，颁白者不负戴於道路矣。老者衣帛食肉，黎民不饥不寒，然而不王者，未之有也。”（其说与上同。八口之家，次上农夫也。孟子所以重言此者，乃王政之本、常生之道，故为齐、梁之君各具陈之。当章究义，不嫌其重也。）" }
      - { type: z, text: "“齐宣王”至“未之有也”。○正义曰：此章言典籍攸载，帝王道纯，桓、文之事，谲正相纷，拨乱反正，圣意弗珍。故曰后世无传未闻。仁不施人，犹不成德，衅钟易牲，民不被泽，王请尝试，欲践其迹，答以反本，惟是为要。此盖孟子不屈道之言也，无传霸者之事也。“齐宣王问曰：“齐桓、晋文之事，可得闻乎”者，齐宣是齐威王之子辟︹是也，谥为宣。言齐宣王问孟子曰：齐威公小白、晋文公重耳二霸之事，可得而闻之乎？“孟子对曰：仲尼之徒，无道桓、文之事者，是以後世无传焉，臣未之闻也”者，是孟子答齐宣王之言也。言自孔子之门徒，无有道及桓、文二霸者事，是以後世无传焉，故臣于今未之曾闻知也。云“臣”者，是孟子对王而言，故自称己为臣也。“无以，则王乎”者，孟子言无以问及宓牺以来至文、武、周公之法，尚当以王者之道为问耳。“曰：德何如，则可以王矣”者，齐宣又问孟子，言德当何如则可以为王。“曰保民而王，莫之能御也”者，孟子言当安民而为之王，则天下之民莫之能止御之也。“曰若寡人者，可以保民乎哉”者，宣王又自问只如寡人之德，可以安民乎？王恐德不足以安民，故问之也。“曰可”者，孟子言如王之德，可以安民也。“曰何由知吾可也”者，宣王又问孟子何缘而知吾之德可以安民。“曰臣闻之胡曰：王坐於堂上，有牵牛而过堂下，王见之曰：牛何之”至“以羊易之”者，是孟子因胡之言而答宣王之问也。胡，王之左右近臣。言尝闻胡曰王坐於庙堂之上，有牵牛自堂下而过者，王见之，而问牵牛者曰，其牛牵去何所？牵牛者，对之曰：“相将以为衅钟也。王对牵牛者曰：舍去之，我不忍其牛之恐栗，若无罪之人而就於所死之地者也。牵牛者又对曰：如若王之所不忍，则废去衅锺之礼与？王复与牵牛者曰：涂衅祭锺之礼，何可得而废？以羊更易之而已。“不识有诸”者，是孟子又未知齐宣王还是有此言，故问宣王曰不识有诸。“曰有之”者，宣王答孟子，以为是有此言也。“曰是心足以王矣”者，是孟子於此言知王有此不忍之心，故足以为王矣。“百姓皆以王为爱也，臣固知王之不忍也”者，孟子言然百姓尽以王为爱财也，臣素知王有不忍之心，故如此也。“王曰：然”者，宣王复亦自谓百姓是有此疑也。“诚有百姓者，齐国虽褊小，吾何爱一牛？即不忍其觳觫，若无罪而就死地，故以羊易之也”者，宣王言诚有百姓以我为爱财者，齐国虽曰褊小狭隘，我亦何独止爱其一牛？即是不忍见其牛之恐栗，如无罪而就於所死之地，又为衅锺不可废，故以羊更之也。宣王必以羊易牛者，以其羊之为牲，次於牛也，故以羊易之。“曰王无异於百姓之以王为爱也，以小易大，彼恶知之？王若隐其无罪而就死地，则牛、羊何择焉”者，孟子对宣王，言王无怪百姓皆谓我为爱财也，以羊之小而易牛之大，彼百姓之人安知王以为不忍见其恐栗、又为衅锺不可废，故以羊易之之意也，彼必曰王若隐痛不忍见牛若无罪而就所死之地，则牛与羊何择焉？言羊之与牛，是皆若无罪而就死也，何独择取其牛而以羊就死也。“王笑曰：是诚何心哉！我非爱其财而易之以羊也，宜乎百姓之谓我爱也”者，是宣王自笑以其已之心不如是，故笑之也。笑而言曰：傥如此者，是何心哉！然我非爱其财，故以羊易牛也。云此者，宣王又疑孟子亦以为然，故以此言复答之也，宜乎百姓不知我之意，而谓我爱财也。“曰：无伤也，是乃仁术也，见牛未见羊也。君子之於禽兽也，见其生，不忍见其死；闻其声，不忍食其肉：是以君子远庖厨也”者，孟子复解王之自责之意也。言如此亦无伤害於为王也，此亦为仁之一术耳。无他，是见其牛之觳觫，未见其羊之觳觫也。凡君子之於禽兽，见其生貌，则不忍见其就死；闻其鸣声，则不忍食其肉。是以君子之人，凡於庖厨烹炙之事所以远去之也。“王悦，曰：《诗》云：他人有心，予忖度之。夫子之谓也”者，是宣王见孟子解其已意，故喜悦之，而引《诗》之文而言也。“他人有心，予忖度之”二句，是《小雅·巧言》之诗也，宣王引之，而为如夫子之所谓也。云“夫子”者，宣王尊孟子为夫子也。“夫我乃行之，反而求之，不得吾心。夫子言之，於我心有戚戚焉”者，宣王言我既行之事，尚且反而求之於己而不得其心之所之，自今夫子言之於我，心中戚戚然有动也。“此心之所以合於王者，何也”者，宣王言虽有是心，其所以得契合於王者，是如之何也？“曰：有复於王者，曰吾力足以举百钧，而不足以举一羽；明足以察秋毫之末，而不见舆薪，则王许之乎”者，是孟子欲以此比喻而解王也。言今有人复白於王曰：我力能举得三千斤之重，而不能举一羽毛之轻；目之明能观视其秋毫之末锐，而不能见一大车之薪木，则王信乎否乎？“曰否”者，是宣王答之。曰凡如此云者，我不信也。“今恩足以及禽兽，而功不至於百姓者，独何与”者，孟子复以此讽之也。言今王有恩德足以及其禽，而其功绩不至於百姓者，王独以为何如？“然则一羽之不举，为不用力焉；舆薪之不见，为不用明焉；百姓之不见保，为不用恩焉。故王之不王，不为也，非不能也”者，孟子又言苟如是一羽之轻所以不能举者，为其不用力也；一车薪之大所以不见之者，为其不用明也；今百姓所以不见安者，为其不用恩也。故王之所以不为王，是王之不为也，非不能也。“曰不为者与不能者之形何以异”者，是宣王问孟子。言不为与不能二状，何以为异也？“曰挟太山以超北海，语人曰我不能，是诚不能也。为长者折枝，语人曰我不能，是不为也，非不能也。故王之不王，非挟太山以超北海之类也，是折枝之类也”者，是孟子又以此比喻而解王问不为与不能之异状也。言今有人云挟太山而超过北海，而语人曰我不能挟太山超北海，此真不能也；如为长者按摩手节，而语人曰我不能为长者按摩手节，是耻见役使，但不为之耳，非不能也；今王之所以不王，非是挟太山超北海之类也，是不为长者折枝之类也，以其不为之耳。“老吾老，以及人之老；幼吾幼，以及人之幼：天下可运於掌”者，是孟子欲以此教宣王也。言敬吾之所敬，以及他人之所敬者，爱吾之所爱，以及他人之所爱者，凡能推此而惠民，则治天下之大，止如运转於掌上之易也。“《诗》云：刑于寡妻，至于兄弟，以御于家邦”者，是孟子引《大雅·思齐》之诗文也。言文王自正于寡妻，以至正于兄弟，自正于兄弟以至临御于家邦。言凡此是能举此心而加诸彼耳。“故推恩足以保四海，不推恩无以保妻子。古之人所以大过人者，无他焉，善推其所为而己矣”者，孟子言为君者但能推其恩惠，故足以安四海，苟不推恩惠，虽妻子亦不能安之。古之人君所以大过强於人者，无他事焉，独能推其所为恩惠耳。盖所谓老吾老以及人之老，幼吾幼以及人之幼；又如《诗》云文王刑于寡妻，至于兄弟，以御于家邦：是其善推其所为之意旨故也。“今恩足以及禽兽，而功不至於百姓者，独何与”者，孟子复言非王不能，但不为耳。故复云“然权，然後知轻重；度，然後知长短。物皆然，心为甚，王请度之”者，孟子又托物而讽王也。言为之权与度，然尚能知其轻重长短，其权度之为物也然尚皆然，而人心又甚於权度，故请王自忖度之耳。“抑王兴甲兵，危士臣，构怨於诸侯，然後快於心与”者，抑，辞也，与《语》曰“抑为之不厌”之“抑”同，孟子又以此数事而测王之意也。言抑是王欲兴起甲兵以伐人，危士臣以即戎，不以为危事，外结怨於诸侯，如此且然後快乐其心与。“王曰否”者，宣王答之，以为不如是也，言我何肯快心於此数事，我但将以求吾所大欲耳。“曰王之所大欲，可得闻与”者，是孟子欲知王之所大欲，故问之，曰：王大欲可得而闻之乎？“王笑而不言”，宣王知已之所欲甚大，但笑而不言也。“曰为肥甘不足於口与，轻暖不足於体与”至“不足使令於前与”者，是孟子又以此四事而测王所大欲也。言王之所大欲，是为其肥甘之味不足以供於口与？抑是其声音之乐不足供听於王之耳与？便嬖之幸不足使令於王之前与？采色之饰不足供视於王之目与？然此数事，而为王之诸臣者皆足以供奉王矣，而王岂用为此者与？故继之曰：“王之诸臣，皆足以供之，而王岂为是哉？”又曰“否，吾不为是”者，宣王答之曰：我不为是四者之事也。“曰然则王之所大欲可知已”者，孟子言如是则王之大欲，我今可得知已。“欲辟土地，朝秦、楚，莅中国而抚四夷也”者，孟子知王以此为所大欲也。“以若所为，求若所欲，犹缘木而求鱼也”者，孟子言王如若以此欲开辟其土地而求其广，又欲朝秦、楚之诸侯，以临莅其中国而抚安四夷，为所大欲，是若缘乔木之上而求其鱼也。“王曰：若是其甚与”者，宣王亦谓己之大欲若此求鱼之甚与？“曰：殆有甚焉。缘木求鱼，虽不得鱼，无後灾。以若所为，求若所欲，尽心力而为之，後必有灾”者，孟子言王如此大欲，殆有甚於缘木求鱼也，缘乔木而求鱼，虽不得鱼，又且无後灾难所及，而王如若以所欲，假使尽心力而为之，後亦必有大灾难所及也。“曰可得闻与”者，是宣王又问孟子，欲求知其大灾难也。“曰邹人与楚人战，则王以为孰胜者”，孟子以此比喻而解王也。言邹之小国，与楚之大国战斗，则王以为谁国胜之？“曰楚人胜”者，宣王答孟子，以为楚之大国人胜之也。“曰然则小固不可以敌大，寡固不可以敌众，弱固不可以敌强”者，孟子言如是则小国固不可敌大国，人之寡少固不可以敌人之众多，劣弱固不可以敌强悍也。“海内之地，方千里者九，齐集有其一，以一服八，何以异於邹敌楚哉”者，孟子又言今海内之地，方千里者有九，而齐国但集而有一，且以一而服八，是何以异於邹国之小而敌楚国之大哉？言与此无异也。王如欲服之，盖当反行王道之本耳，故云“盖亦反其本矣”。“今王发政施仁”至“孰能御之”者，孟子於此教宣王王道之本也。言今王发政而施仁，使天下为之仕者皆欲立於王之朝廷，耕者皆欲耕作於王之郊野，商贾皆欲藏於王之市，行旅皆欲出於王之道涂，凡天下欲疾恶其君者又皆欲奔赴王而告诉之，其如此，天下皆归之，谁能止御之也。商贾，《汉书》云：“通财鬻货曰商。”《白虎通》云：“卖曰贾。”行旅者，师旅也。《说文》云：“军，五百人也。”“王曰：吾忄昏，不能进於是矣。原夫子辅吾志，明以教我。我虽不敏，请尝试之”者，宣王欲孟子明其王道而教之也。故曰我之忄昏乱，不能进於此仁政，原夫子辅我志，以明白教我也，我虽不能敏疾而行之，但请尝试教之如何耳？“曰：无恒产而有恒心者，惟士为能。若民则无恒产，因无恒心。苟无恒心，放辟邪侈，无不为已”至“未之有也”者，是孟子为宣王陈王道之本而教之者也。言无常生之业而有常善之心者，惟士人为能有之。言士穷则独善其身，不求苟得，故能有常心也。若民则迫於穷困，不能守其常善，苟无常生之业，遂因之而无常善之心。苟无常善之心，则放辟邪侈之事，无有不为。及其陷溺於罪，然後又从而诛戮之，是若张罗网而罔民也。安有仁人之君在位，而以罔民而可为之也？故明哲之君，制别民之生产，必使其民仰而上之则足以奉事父母，俯而下之则足以畜养妻子，丰乐之岁，终身饱足，凶荒之年，又免其死亡，然後驱率而从善教，故其民从其善教亦轻易也。自今之君制民之产，仰则不足以奉养父母，俯则不足以畜养妻子，虽丰乐之岁，终身又且劳苦；而凶荒之年，又不得免其死亡。如此，则民惟独於救死尚恐其不足，何有闲暇而修治礼义哉。言无及修其礼义也。“王欲行之，则盍反其本矣”者，言王欲行之，则何不反其王道之本。“五亩之宅”至“未之有也”，是又孟子为宣王陈王道之本，其说已在前，此更不解。○注“宣，谥也”至“齐也”。○正义曰：周显王二十七年，《史记》云：“齐威卒，子辟疆立，是为齐宣王。在位十九年，卒谥曰宣。”《谥法》云：“善问周达曰宣。”云“齐桓公小白”者，庄公八年《左传》云：齐僖公母弟曰夷仲年，生公孙无知，有宠於僖公，弑君自立。九年春，弑无知，庄公纳子纠。桓公小白自莒入，於是立，为桓公元年。《史记》云：“桓公小白元年春，齐弑无知。五年，与鲁人会柯。七年始霸，会诸侯於鄄。”云“晋文公重耳”者，《史记》云：“周襄王十六年，晋文公重耳立，是为元年。”又云：晋献公五年，伐骊戎，得二姬，归生奚齐，其娣生卓子，骊姬嬖，欲立其子。重耳者，乃献公娶於戎，得二女，大戎狐姬之所生也。十二年居重耳於蒲城。二十六年，献公卒，立奚齐，里克杀之。及卓子又立，小戎所生夷吾者，为晋惠公。七年，重耳闻管仲死，自狄之齐。十四年，惠公夷吾卒，遂立重耳为晋文公。九年在位，卒。云“孟子不得行道，故仕於齐。齐不用，乃梁”者，案《史记·列传》已说在梁王段。○注云“宓羲”至“闻也”。正义曰：宓羲，古帝王氏也，即伏牺氏也。五霸者，即齐桓、晋文、秦缪、宋襄、楚庄是也。崔李云：夏昆吾、殷大彭、豕韦周、齐桓、晋文是也。谓之霸者，把也，把持诸侯之权也。案《国语》亦然。《荀子》云：“仲尼之门人，五尺之竖子，言羞称乎五霸。”是仲尼之徒无道桓文之事者之证也。○注云：“觳觫，牛於到死地处恐貌”。○正义曰：案《广雅》有云“觳觫，死貌”是也。云“《周礼·大祝》堕衅，逆牲逆尸，令钟鼓”者，郑司农云“堕衅谓荐血也。凡血祭曰衅，既堕衅後，言逆牲容逆鼎”是也。盖古者器成而衅以血，所以厌变怪，御妖衅，衅钟之衅谓之衅，亦治乱谓之乱之类也。云“《天府》云上春，衅宝钟及宝器”者，宝钟、宝器，玉瑞、玉器之美。上春，孟春也。又言衅谓以杀牲以血血之也，盖衅之法，其来有自矣，周之所衅，又非止此而已。如大司马於军器，小子於邦器，小人於龟器，鸡人於鸡，大祝逆牲，小祝祈号，皆在所衅也。○注“爱啬也”。○正义曰：《释文》云：“啬，爱、[A14C]也。字法从来[B08A]、来也。来者[B08A]而藏之，故田夫谓之啬夫。[B08A]音廪。”《书》云“啬夫驰”是也。○注“百钧三千斤也”。○正义曰：《律历志》云：“铢、两、斤、钧、石，本起於黄锺之重，一龠容千二百黍，重十二铢。二十四铢为两，十六两为斤，三十斤为钧，重一千五百二十铢，四钧为石，重百二十斤。”以此推之，则百钧是三十斤也。○注“太山北海近齐”。○正义曰：案《地理志》云“齐地南有太山，城阳北有千乘清河”是也。○注“权铨衡”至“度物也”。○正义曰：权重衡平，衡所以任权而均物，平轻重也。《释文》云：“铨，平木器。”又曰：“铨，衡也。”权，称锤也。度者，分寸尺丈引也，所以度长短也。本起於黄锺之长，以子巨黍中者，子，子在地，即黑黍，中者，不大不小，言黑黍子大小中者，率为分寸，一黍之广度之九十分。黄钟之长为十分，十分为寸，十寸为尺，十尺为丈，十丈为引。法用铜，高一寸，广二寸，长一丈，而分寸尺丈存焉。○注“八口之家次上农夫”。○正义曰：《王制》：“制：农田百亩，百亩之分，上农夫食九人，其次食八人。”《孟子》云：“一夫百亩，百亩之粪，上农夫食九人，上次食八人”是也。此云八口之家，所以特指次上农夫者而已，斯亦举其次而见上下之意耳。" }
