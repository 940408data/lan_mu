labels:
  - page: 51
    col: 1
    role: j
    text: 論語卷第二朱熹集注
  - page: 51
    col: 2
    role: title
    text: 八佾第三
  - page: 51
    col: 3
    role: z
    text: 凡二十六章通前篇末二章皆論禮
  - page: 51
    col: 4
    role: z
    text: 樂之事
  - page: 51
    col: 5
    role: j
    text: 孔子謂季氏八佾舞於庭是可忍也孰
  - page: 51
    col: 6
    role: j
    text: 不可忍也
  - page: 51
    col: 7
    role: z
    text: 佾音逸○季氏魯大夫季孫氏也佾
  - page: 51
    col: 8
    role: z
    text: 舞列也天子八諸侯六大夫四士二
  - page: 52
    col: 1
    role: z
    text: 每佾人數如其佾數或曰每佾八人
  - page: 52
    col: 2
    role: z
    text: 未詳孰是季氏以大夫而僭用天子
  - page: 52
    col: 3
    role: z
    text: 之樂孔子言其此事尚忍為之則何
  - page: 52
    col: 4
    role: z
    text: 事不可忍為或曰忍容忍也蓋深疾
  - page: 52
    col: 5
    role: z
    text: 之之辭○范氏曰樂舞之數自上而
  - page: 52
    col: 6
    role: z
    text: 下降殺以兩而已故兩之間不可以
  - page: 52
    col: 7
    role: z
    text: 毫髮僭差也孔子為政先正禮樂則
  - page: 52
    col: 8
    role: z
    text: 季氏之罪不容誅矣○謝氏曰君子
  - page: 52
    col: 9
    role: z
    text: 於其所不當為不敢湏臾處不忍故
  - page: 52
    col: 10
    role: z
    text: 也而季氏忍此矣則雖弑父與君亦
  - page: 52
    col: 11
    role: z
    text: 何所憚而不為乎
  - page: 52
    col: 12
    role: j
    text: 三家者以雍徹子曰相維辟公天子穆
  - page: 52
    col: 13
    role: j
    text: 穆奚取於三家之堂
  - page: 52
    col: 14
    role: z
    text: 徹直列反相去聲○三家魯大夫孟
  - page: 52
    col: 15
    role: z
    text: 孫叔孫季孫之家也雍周頌篇名徹
  - page: 52
    col: 16
    role: z
    text: 祭畢而収其俎也天子宗廟之祭則
  - page: 53
    col: 1
    role: z
    text: 歌雍以徹是時三家僭而用之相助
  - page: 53
    col: 2
    role: z
    text: 也辟公諸侯也穆穆深遠之意天子
  - page: 53
    col: 3
    role: z
    text: 之容也此雍詩之詞孔子引之言三
  - page: 53
    col: 4
    role: z
    text: 家之堂非有此事亦何取於此義而
  - page: 53
    col: 5
    role: z
    text: 歌之乎譏其無知妄作以取僭竊之
  - page: 53
    col: 6
    role: z
    text: 罪○程子曰周公之功固大矣皆臣
  - page: 53
    col: 7
    role: z
    text: 子之分所當為魯安得獨用天子禮
  - page: 53
    col: 8
    role: z
    text: 樂哉成王之賜伯禽之受皆非也其
  - page: 53
    col: 9
    role: z
    text: 因襲之弊遂使季氏僭八佾三家僭
  - page: 53
    col: 10
    role: z
    text: 雍徹故仲尼譏之
  - page: 53
    col: 11
    role: j
    text: 子曰人而不仁如禮何人而不仁如樂何
  - page: 53
    col: 12
    role: z
    text: 游氏曰人而不仁則人心亡矣其如
  - page: 53
    col: 13
    role: z
    text: 禮樂何哉言雖欲用之而禮樂不為
  - page: 53
    col: 14
    role: z
    text: 之用也○程子曰仁者天下之正理
  - page: 53
    col: 15
    role: z
    text: 失正理則無序而不和○李氏曰禮
  - page: 53
    col: 16
    role: z
    text: 樂待人而後行苟非其人則雖玉帛
  - page: 54
    col: 1
    role: z
    text: 交錯鍾鼓鏗鏘亦將如之何哉然記
  - page: 54
    col: 2
    role: z
    text: 者序此於八佾雍徹之後疑其爲僭
  - page: 54
    col: 3
    role: z
    text: 禮樂者發也
  - page: 54
    col: 4
    role: j
    text: 林放問禮之本
  - page: 54
    col: 5
    role: z
    text: 林放魯人見世之爲禮者專事繁文
  - page: 54
    col: 6
    role: z
    text: 而疑其本之不在是也故以爲問
  - page: 54
    col: 7
    role: j
    text: 子曰大哉問
  - page: 54
    col: 8
    role: z
    text: 孔子以時方逐末而放獨有志於本
  - page: 54
    col: 9
    role: z
    text: 故大其問蓋得其本則禮之全體無
  - page: 54
    col: 10
    role: z
    text: 不在其中矣
  - page: 54
    col: 11
    role: j
    text: 禮與其奢也寧儉喪與其易也寧戚
  - page: 54
    col: 12
    role: z
    text: 易去聲○易治也孟子曰易其田疇
  - page: 54
    col: 13
    role: z
    text: 在喪禮則節文習熟而無哀痛慘怛
  - page: 54
    col: 14
    role: z
    text: 之實者也戚則一於哀而文不足耳
  - page: 54
    col: 15
    role: z
    text: 禮貴得中奢易則過於文儉戚則不
  - page: 54
    col: 16
    role: z
    text: 及而質二者皆未合理然凡物之理
  - page: 55
    col: 1
    role: j
    text: 必先有質而後有文則質乃禮之本
  - page: 55
    col: 2
    role: j
    text: 也○范氏曰夫祭與其敬不足而禮
  - page: 55
    col: 3
    role: j
    text: 有餘也不若禮不足而敬有餘也喪
  - page: 55
    col: 4
    role: j
    text: 與其哀不足而禮有餘也不若禮不
  - page: 55
    col: 5
    role: j
    text: 足而哀有餘也禮失之奢喪失之易
  - page: 55
    col: 6
    role: j
    text: 皆不能反本而隨其末故也禮奢而
  - page: 55
    col: 7
    role: j
    text: 備不若儉而不備之愈也喪易而文
  - page: 55
    col: 8
    role: j
    text: 不若戚而不文之愈也儉者物之質
  - page: 55
    col: 9
    role: j
    text: 戚者心之誠故爲禮之本○楊氏曰
  - page: 55
    col: 10
    role: j
    text: 禮始諸飲食故汙尊而抔飲爲之簠
  - page: 55
    col: 11
    role: j
    text: 簋籩豆罍爵之飾所以文之也則其
  - page: 55
    col: 12
    role: j
    text: 本儉而已喪不可以徑情而直行爲
  - page: 55
    col: 13
    role: j
    text: 之衰麻哭踊之數所以節之也則其
  - page: 55
    col: 14
    role: j
    text: 本戚而已周衰世方以文滅質而林
  - page: 55
    col: 15
    role: j
    text: 放獨能問禮之本故夫子大之而告
  - page: 55
    col: 16
    role: j
    text: 之以此
  - page: 56
    col: 1
    role: j
    text: 子曰夷狄之有君不如諸夏之亡也
  - page: 56
    col: 2
    role: j
    text: 吳氏曰亡古無字通用○程子曰夷
  - page: 56
    col: 3
    role: j
    text: 狄且有君長不如諸夏之僭亂反無
  - page: 56
    col: 4
    role: j
    text: 上下之分也○尹氏曰孔子傷時之亂
  - page: 56
    col: 5
    role: j
    text: 而歎之也亡非實亡也雖有之不能
  - page: 56
    col: 6
    role: z
    text: 盡其道爾
  - page: 56
    col: 7
    role: j
    text: 季氏旅於泰山子謂冉有曰女弗能救
  - page: 56
    col: 8
    role: j
    text: 與對曰不能子曰嗚呼曾謂泰山不如
  - page: 56
    col: 9
    role: j
    text: 林放乎
  - page: 56
    col: 10
    role: j
    text: 女音汝與平聲○旅祭名泰山山名
  - page: 56
    col: 11
    role: j
    text: 在魯地禮諸侯祭封内山川季氏祭
  - page: 56
    col: 12
    role: j
    text: 之僭也冉有孔子弟子名求時爲季
  - page: 56
    col: 13
    role: j
    text: 氏宰救謂救其陷於僭竊之罪嗚呼
  - page: 56
    col: 14
    role: j
    text: 歎辭言神不享非禮欲季氏知其無
  - page: 56
    col: 15
    role: j
    text: 益而自止又進林放以厲冉有也○
  - page: 56
    col: 16
    role: j
    text: 范氏曰冉有從季氏夫子豈不知其
  - page: 57
    col: 1
    role: z
    text: 不可告也然而聖人不輕絶人盡己
  - page: 57
    col: 2
    role: z
    text: 之心安知冉有之不能救季氏之不
  - page: 57
    col: 3
    role: z
    text: 可諫也旣不能正則美林放以明泰
  - page: 57
    col: 4
    role: z
    text: 山之不可誣是亦教誨之道也
  - page: 57
    col: 5
    role: j
    text: 子曰君子無所争必也射乎揖讓而升
  - page: 57
    col: 6
    role: j
    text: 下而飲其争也君子
  - page: 57
    col: 7
    role: z
    text: 飲去聲○揖遜而升者大射之禮耦
  - page: 57
    col: 8
    role: z
    text: 進三揖而後升堂也下而飲謂射畢
  - page: 57
    col: 9
    role: z
    text: 揖降以俟衆耦皆畢勝者乃揖不勝
  - page: 57
    col: 10
    role: z
    text: 者升取觶立飲也言君子恭遜不與
  - page: 57
    col: 11
    role: z
    text: 人争惟於射而後有争然其争也雍
  - page: 57
    col: 12
    role: z
    text: 容揖遜乃如此則其争也君子而非
  - page: 57
    col: 13
    role: z
    text: 若小人之争矣
  - page: 57
    col: 14
    role: j
    text: 子夏問曰巧笑倩兮美目盼兮素以爲
  - page: 57
    col: 15
    role: j
    text: 絢兮何謂也
  - page: 57
    col: 16
    role: z
    text: 倩七練反盼普莧反絢呼縣反○此
  - page: 58
    col: 1
    role: z
    text: 逸詩也倩好口輔也盼目黑白分也
  - page: 58
    col: 2
    role: z
    text: 素粉地畫之質也絢采色畫之飾也
  - page: 58
    col: 3
    role: z
    text: 言人有此倩盼之美質而又加以華
  - page: 58
    col: 4
    role: z
    text: 采之飾如有素地而加采色也子夏
  - page: 58
    col: 5
    role: z
    text: 疑其反謂以素爲飾故問之
  - page: 58
    col: 6
    role: j
    text: 子曰繪事後素
  - page: 58
    col: 7
    role: z
    text: 繪胡對反○繪事繪畫之事也後素
  - page: 58
    col: 8
    role: z
    text: 後於素也考工記曰繪畫之事後素
  - page: 58
    col: 9
    role: z
    text: 功謂先以粉地爲質而後施五采猶
  - page: 58
    col: 10
    role: z
    text: 人有美質然後可加文飾
  - page: 58
    col: 11
    role: j
    text: 曰禮後乎子曰起予者商也始可與言
  - page: 58
    col: 12
    role: j
    text: 詩已矣
  - page: 58
    col: 13
    role: z
    text: 禮必以忠信爲質猶繪事必以粉素
  - page: 58
    col: 14
    role: z
    text: 爲先起猶發也起予言能起發我之
  - page: 58
    col: 15
    role: z
    text: 志意○謝氏曰子貢因論學而知詩
  - page: 58
    col: 16
    role: z
    text: 子夏因論詩而知學故皆可與言詩
  - page: 59
    col: 1
    role: z
    text: 楊氏曰甘受和白受采忠信之人可
  - page: 59
    col: 2
    role: z
    text: 以學禮苟無其質禮不虚行此繪事
  - page: 59
    col: 3
    role: z
    text: 後素之說也孔子曰繪事後素而子
  - page: 59
    col: 4
    role: z
    text: 夏曰禮後乎可謂能繼其志矣非得
  - page: 59
    col: 5
    role: z
    text: 之言意之表者能之乎商賜可與言
  - page: 59
    col: 6
    role: z
    text: 詩者以此若夫玩心於章句之末則
  - page: 59
    col: 7
    role: z
    text: 其爲詩也固而已矣所謂起予則亦
  - page: 59
    col: 8
    role: z
    text: 相長之義也
  - page: 59
    col: 9
    role: j
    text: 子曰夏禮吾能言之杞不足徵也殷禮
  - page: 59
    col: 10
    role: j
    text: 吾能言之宋不足徵也文獻不足故也
  - page: 59
    col: 11
    role: j
    text: 足則吾能徵之矣
  - page: 59
    col: 12
    role: z
    text: 杞夏之後宋商之後徵證也文典籍
  - page: 59
    col: 13
    role: z
    text: 也獻賢也言二代之禮我能言之而
  - page: 59
    col: 14
    role: z
    text: 二國不足取以爲證以其文獻不足
  - page: 59
    col: 15
    role: z
    text: 故也文獻若足則我能取之以證吾
  - page: 59
    col: 16
    role: z
    text: 言矣
  - page: 60
    col: 1
    role: j
    text: 子曰禘自旣灌而往者吾不欲觀之矣
  - page: 60
    col: 2
    role: z
    text: 禘大計反○趙伯循曰禘王者之大
  - page: 60
    col: 3
    role: z
    text: 祭也王者旣立始祖之廟又推始祖
  - page: 60
    col: 4
    role: z
    text: 所自出之帝祀之於始祖之廟而以
  - page: 60
    col: 5
    role: z
    text: 始祖配之也成王以周公有勲勞
  - page: 60
    col: 6
    role: z
    text: 賜魯重祭故得禘於周公之廟以文
  - page: 60
    col: 7
    role: z
    text: 王爲所出之帝而周公配之然非禮
  - page: 60
    col: 8
    role: z
    text: 矣灌者方祭之始用鬱鬯之酒灌地
  - page: 60
    col: 9
    role: z
    text: 以降神也魯之君臣當此之時誠意
  - page: 60
    col: 10
    role: z
    text: 未散猶有可觀自此以後則浸以懈
  - page: 60
    col: 11
    role: z
    text: 怠而無足觀矣蓋魯祭非禮孔子本
  - page: 60
    col: 12
    role: z
    text: 不欲觀至此而失禮之中又失禮焉
  - page: 60
    col: 13
    role: z
    text: 故發此歎也○謝氏曰夫子甞曰我
  - page: 60
    col: 14
    role: z
    text: 欲觀夏道是故之杞而不足證也我
  - page: 60
    col: 15
    role: z
    text: 欲觀商道是故之宋而不足證也又
  - page: 60
    col: 16
    role: z
    text: 曰我觀周道幽厲傷之吾舎魯何適
  - page: 61
    col: 1
    role: z
    text: 矣魯之郊禘非禮也周公其衰矣考
  - page: 61
    col: 2
    role: z
    text: 之杞宋已如彼考之當今又如此孔
  - page: 61
    col: 3
    role: z
    text: 子所以深歎也
  - page: 61
    col: 4
    role: j
    text: 或問禘之說子曰不知也知其說者之
  - page: 61
    col: 5
    role: j
    text: 於天下也其如示諸斯乎指其掌
  - page: 61
    col: 6
    role: z
    text: 先王報本追遠之意莫深於禘非仁
  - page: 61
    col: 7
    role: z
    text: 孝誠敬之至不足以與此非或人之
  - page: 61
    col: 8
    role: z
    text: 所及也而不王不禘之法又魯之所
  - page: 61
    col: 9
    role: z
    text: 當諱者故以不知答之示與視同指
  - page: 61
    col: 10
    role: z
    text: 其掌弟子記夫子言此而自指其掌
  - page: 61
    col: 11
    role: z
    text: 言其明且易也蓋知禘之說則理無
  - page: 61
    col: 12
    role: z
    text: 不明誠無不格而治天下不難矣聖
  - page: 61
    col: 13
    role: z
    text: 人於此豈眞有所不知也哉
  - page: 61
    col: 14
    role: j
    text: 祭如在祭神如神在
  - page: 61
    col: 15
    role: z
    text: 程子曰祭祭先祖也祭神祭外神也
  - page: 61
    col: 16
    role: z
    text: 祭先主於孝祭神主於敬愚謂此明
  - page: 62
    col: 1
    role: z
    text: 人記孔子祭祀之誠意
  - page: 62
    col: 2
    role: j
    text: 子曰吾不與祭如不祭
  - page: 62
    col: 3
    role: z
    text: 與去聲○又記孔子之言以明之言
  - page: 62
    col: 4
    role: z
    text: 己當祭之時或有故不得與而使它
  - page: 62
    col: 5
    role: z
    text: 人攝之則不得致其如在之誠故雖
  - page: 62
    col: 6
    role: z
    text: 已祭而此心缺然如未甞祭也○范
  - page: 62
    col: 7
    role: z
    text: 氏曰君子之祭七日戒三日齋必見
  - page: 62
    col: 8
    role: z
    text: 所祭者誠之至也是故郊則天神格
  - page: 62
    col: 9
    role: z
    text: 廟則人鬼享皆由己以致之也有其
  - page: 62
    col: 10
    role: z
    text: 誠則有其神無其誠則無其神可不
  - page: 62
    col: 11
    role: z
    text: 謹乎吾不與祭如不祭誠爲實禮爲
  - page: 62
    col: 12
    role: z
    text: 虛也
  - page: 62
    col: 13
    role: j
    text: 王孫賈問曰與其媚於奧寧媚於竈何
  - page: 62
    col: 14
    role: j
    text: 謂也
  - page: 62
    col: 15
    role: z
    text: 王孫賈衛大夫媚親順也室西南隅
  - page: 62
    col: 16
    role: z
    text: 爲奧竈者五祀之一夏所祭也凡祭
  - page: 63
    col: 1
    role: z
    text: 五祀皆先設主而祭於其所然後迎
  - page: 63
    col: 2
    role: z
    text: 尸而祭於奧略如祭宗廟之儀如祀
  - page: 63
    col: 3
    role: z
    text: 竈則設主於竈陘祭畢而更設饌於
  - page: 63
    col: 4
    role: z
    text: 奧以迎尸也故時俗之語因以奧有
  - page: 63
    col: 5
    role: z
    text: 常尊而非祭之主竈雖卑賤而當時
  - page: 63
    col: 6
    role: z
    text: 用事喻自結於君不如阿附權臣也
  - page: 63
    col: 7
    role: z
    text: 賈衛之權臣故以諷孔子
  - page: 63
    col: 8
    role: j
    text: 子曰不然獲罪於天無所禱也
  - page: 63
    col: 9
    role: z
    text: 天即理也其尊無對非奧竈之可比
  - page: 63
    col: 10
    role: z
    text: 也逆理則獲罪於天矣豈媚於奧竈
  - page: 63
    col: 11
    role: z
    text: 所能禱而免乎言但當順理非特不
  - page: 63
    col: 12
    role: z
    text: 當媚竈亦不可媚於奧也○謝氏曰
  - page: 63
    col: 13
    role: z
    text: 聖人之言遜而不迫使王孫賈而知
  - page: 63
    col: 14
    role: z
    text: 此意不爲無益使其不知亦非所以
  - page: 63
    col: 15
    role: z
    text: 取禍
  - page: 63
    col: 16
    role: j
    text: 子曰周監於二代郁郁乎文哉吾從周
  - page: 64
    col: 1
    role: z
    text: 郁於六反○監視也二代夏商也言
  - page: 64
    col: 2
    role: z
    text: 其視二代之禮而損益之郁郁文盛
  - page: 64
    col: 3
    role: z
    text: 貌○尹氏曰三代之禮至周大備夫
  - page: 64
    col: 4
    role: j
    text: 子美其文而從之
  - page: 64
    col: 5
    role: j
    text: 子入大廟每事問或曰孰謂鄹人之子
  - page: 64
    col: 6
    role: j
    text: 知禮乎入大廟每事問子聞之曰是禮也
  - page: 64
    col: 7
    role: z
    text: 大音泰鄹側留反○大廟魯周公廟
  - page: 64
    col: 8
    role: z
    text: 此蓋孔子始仕之時入而助祭也鄹
  - page: 64
    col: 9
    role: z
    text: 魯邑名孔子父叔梁紇甞爲其邑大
  - page: 64
    col: 10
    role: z
    text: 夫孔子自少以知禮聞故或人因此
  - page: 64
    col: 11
    role: z
    text: 而譏之孔子言是禮者敬謹之至乃
  - page: 64
    col: 12
    role: z
    text: 所以爲禮也○尹氏曰禮者敬而已
  - page: 64
    col: 13
    role: z
    text: 矣雖知亦問謹之至也其爲敬莫大
  - page: 64
    col: 14
    role: j
    text: 於此謂之不知禮者豈足以知孔子哉
  - page: 64
    col: 15
    role: j
    text: 子曰射不主皮爲力不同科古之道也
  - page: 64
    col: 16
    role: z
    text: 爲去聲○射不主皮鄉射禮文爲力
  - page: 65
    col: 1
    role: j
    text: 不同科孔子解禮之意如此也皮革
  - page: 65
    col: 2
    role: j
    text: 也布侯而棲革於其中以爲的所謂
  - page: 65
    col: 3
    role: j
    text: 鵠也科等也古者射以觀德但主於
  - page: 65
    col: 4
    role: j
    text: 中而不主於貫革蓋以人之力有強
  - page: 65
    col: 5
    role: j
    text: 弱不同等也記曰武王克商散軍郊
  - page: 65
    col: 6
    role: j
    text: 射而貫革之射息正謂此也周衰禮
  - page: 65
    col: 7
    role: j
    text: 廢列國兵争復尚貫革故孔子歎之○
  - page: 65
    col: 8
    role: j
    text: 楊氏曰中可以學而能力不可以強而
  - page: 65
    col: 9
    role: z
    text: 至聖人言古之道所以正今之失
  - page: 65
    col: 10
    role: j
    text: 子貢欲去告朔之餼羊
  - page: 65
    col: 11
    role: z
    text: 去起呂反告古篤反餼許氣反○告
  - page: 65
    col: 12
    role: z
    text: 朔之禮古者天子常以季冬頒來歲
  - page: 65
    col: 13
    role: z
    text: 十二月之朔于諸侯諸侯受而藏之
  - page: 65
    col: 14
    role: z
    text: 祖廟月朔則以特羊告廟請而行之
  - page: 65
    col: 15
    role: z
    text: 餼生牲也魯自文公始不視朔而有
  - page: 65
    col: 16
    role: z
    text: 司猶供此羊故子貢欲去之
  - page: 66
    col: 1
    role: j
    text: 子曰賜也爾愛其羊我愛其禮
  - page: 66
    col: 2
    role: z
    text: 愛猶惜也子貢蓋惜其無實而妄費
  - page: 66
    col: 3
    role: z
    text: 然禮雖廢羊存猶得以識之而可復
  - page: 66
    col: 4
    role: z
    text: 焉若并去其羊則此禮遂亡矣孔子
  - page: 66
    col: 5
    role: z
    text: 所以惜之○楊氏曰告朔諸侯所以
  - page: 66
    col: 6
    role: z
    text: 禀命於君親禮之大者魯不視朔矣
  - page: 66
    col: 7
    role: z
    text: 然羊存則告朔之名未泯而其實因
  - page: 66
    col: 8
    role: z
    text: 可舉此夫子所以惜之也
  - page: 66
    col: 9
    role: j
    text: 子曰事君盡禮人以爲謟也
  - page: 66
    col: 10
    role: z
    text: 黃氏曰孔子於事君之禮非有所加
  - page: 66
    col: 11
    role: z
    text: 也如是而後盡爾時人不能反以爲
  - page: 66
    col: 12
    role: z
    text: 謟故孔子言之以明禮之當然也○
  - page: 66
    col: 13
    role: z
    text: 程子曰聖人事君盡禮當時以爲謟
  - page: 66
    col: 14
    role: z
    text: 若他人言之必曰我事君盡禮小人
  - page: 66
    col: 15
    role: z
    text: 以爲謟而孔子之言止於如此聖人
  - page: 66
    col: 16
    role: z
    text: 道大德宏此亦可見
  - page: 67
    col: 1
    role: j
    text: 定公問君使臣臣事君如之何孔子對
  - page: 67
    col: 2
    role: j
    text: 曰君使臣以禮臣事君以忠
  - page: 67
    col: 3
    role: z
    text: 定公魯君名宋二者皆理之當然各
  - page: 67
    col: 4
    role: z
    text: 欲自盡而已○呂氏曰使臣不患其
  - page: 67
    col: 5
    role: z
    text: 不忠患禮之不至事君不患其無禮
  - page: 67
    col: 6
    role: z
    text: 患忠之不足○尹氏曰君臣以義合
  - page: 67
    col: 7
    role: z
    text: 者也故君使臣以禮則臣事君以忠
  - page: 67
    col: 8
    role: j
    text: 子曰關雎樂而不淫哀而不傷
  - page: 67
    col: 9
    role: z
    text: 樂音洛○關雎周南國風詩之首篇
  - page: 67
    col: 10
    role: z
    text: 也淫者樂之過而失其正者也傷者
  - page: 67
    col: 11
    role: z
    text: 哀之過而害於和者也關雎之詩言
  - page: 67
    col: 12
    role: z
    text: 后妃之德宜配君子求之未得則不
  - page: 67
    col: 13
    role: z
    text: 能無寤寐反側之憂求而得之則宜
  - page: 67
    col: 14
    role: z
    text: 其有琴瑟鐘鼓之樂蓋其憂雖深而
  - page: 67
    col: 15
    role: z
    text: 不害於和其樂雖盛而不失其正故
  - page: 67
    col: 16
    role: z
    text: 夫子稱之如此欲學者玩其辭審其
  - page: 68
    col: 1
    role: z
    text: 音而有以識其性情之正也
  - page: 68
    col: 2
    role: j
    text: 哀公問社於宰我宰我對曰夏后氏以
  - page: 68
    col: 3
    role: j
    text: 松殷人以栢周人以栗曰使民戰栗
  - page: 68
    col: 4
    role: j
    text: 宰我孔子弟子名予三代之社不同
  - page: 68
    col: 5
    role: j
    text: 者古者立社各樹其土之所宜木以
  - page: 68
    col: 6
    role: j
    text: 爲主也戰栗恐懼貌宰我又言周所
  - page: 68
    col: 7
    role: j
    text: 以用栗之意如此豈以古者戮人於
  - page: 68
    col: 8
    role: z
    text: 社故附會其說與
  - page: 68
    col: 9
    role: j
    text: 子聞之曰成事不說遂事不諫既往不咎
  - page: 68
    col: 10
    role: z
    text: 遂事謂事雖未成而勢不能已者孔
  - page: 68
    col: 11
    role: z
    text: 子以宰我所對非立社之本意又啓
  - page: 68
    col: 12
    role: z
    text: 時君殺伐之心而其言已出不可復
  - page: 68
    col: 13
    role: z
    text: 救故歷言此以深責之欲使謹其後
  - page: 68
    col: 14
    role: z
    text: 也○尹氏曰古者各以所宜木名其
  - page: 68
    col: 15
    role: z
    text: 社非取義於木也宰我不知而妄對
  - page: 68
    col: 16
    role: z
    text: 故夫子責之
  - page: 69
    col: 1
    role: j
    text: 子曰管仲之器小哉
  - page: 69
    col: 2
    role: z
    text: 管仲齊大夫名夷吾相威公霸諸侯
  - page: 69
    col: 3
    role: z
    text: 器小言其不知聖賢大學之道故局
  - page: 69
    col: 4
    role: z
    text: 量褊淺規模卑狹不能正身脩德以
  - page: 69
    col: 5
    role: z
    text: 致主於王道
  - page: 69
    col: 6
    role: j
    text: 或曰管仲儉乎曰管氏有三歸官事不
  - page: 69
    col: 7
    role: j
    text: 攝焉得儉
  - page: 69
    col: 8
    role: z
    text: 焉於虔反○或人蓋疑器小之為儉
  - page: 69
    col: 9
    role: z
    text: 三歸臺名事見說苑攝兼也家臣不
  - page: 69
    col: 10
    role: z
    text: 能具官一人常兼數事管仲不然皆
  - page: 69
    col: 11
    role: z
    text: 言其侈
  - page: 69
    col: 12
    role: j
    text: 然則管仲知禮乎曰邦君樹塞門管氏
  - page: 69
    col: 13
    role: j
    text: 亦樹塞門邦君為兩君之好有反坫管
  - page: 69
    col: 14
    role: j
    text: 氏亦有反坫管氏而知禮孰不知禮
  - page: 69
    col: 15
    role: z
    text: 好去聲坫丁念反○或人又疑不儉
  - page: 69
    col: 16
    role: z
    text: 為知禮屏謂之樹塞猶蔽也設屏於
  - page: 70
    col: 1
    role: j
    text: 門以蔽內外也好謂好會坫在兩楹
  - page: 70
    col: 2
    role: j
    text: 之間獻酬飲畢則反爵於其上此皆
  - page: 70
    col: 3
    role: j
    text: 諸侯之禮而管仲僭之不知禮也○
  - page: 70
    col: 4
    role: j
    text: 愚謂孔子譏管仲之器小其旨深矣
  - page: 70
    col: 5
    role: j
    text: 或人不知而疑其儉故斥其奢以明
  - page: 70
    col: 6
    role: j
    text: 其非儉或又疑其知禮故又斥其僭
  - page: 70
    col: 7
    role: j
    text: 以明其不知禮蓋雖不復明言小器
  - page: 70
    col: 8
    role: j
    text: 之所以然而其所以小者於此亦可
  - page: 70
    col: 9
    role: j
    text: 見矣故程子曰奢而犯禮其器之小
  - page: 70
    col: 10
    role: j
    text: 可知蓋器大則自知禮而無此失矣
  - page: 70
    col: 11
    role: j
    text: 此言當深味也○蘇氏曰自脩身正
  - page: 70
    col: 12
    role: j
    text: 家以及於國則其本深其及者遠是
  - page: 70
    col: 13
    role: j
    text: 謂大器楊雄所謂大器猶規矩準繩
  - page: 70
    col: 14
    role: j
    text: 先自治而後治人者是也管仲三歸
  - page: 70
    col: 15
    role: j
    text: 反坫威公內嬖六人而霸天下其本
  - page: 70
    col: 16
    role: j
    text: 固已淺矣管仲死威公薨天下不復
  - page: 71
    col: 1
    role: z
    text: 宗齊○揚氏曰夫子大管仲之功而
  - page: 71
    col: 2
    role: z
    text: 小其器蓋非王佐之才雖能合諸侯
  - page: 71
    col: 3
    role: z
    text: 正天下其器不足稱也道學不明而
  - page: 71
    col: 4
    role: z
    text: 王霸之畧混爲一途故聞管仲之器
  - page: 71
    col: 5
    role: z
    text: 小則疑其爲儉以不儉告之則又疑
  - page: 71
    col: 6
    role: z
    text: 其知禮蓋世方以詭遇爲功而不知
  - page: 71
    col: 7
    role: z
    text: 爲之範則不悟其小宜矣
  - page: 71
    col: 8
    role: j
    text: 子語魯大師樂曰樂其可知也始作翕
  - page: 71
    col: 9
    role: j
    text: 如也從之純如也皦如也繹如也以成
  - page: 71
    col: 10
    role: z
    text: 語去聲大音泰從音縱○語告也大
  - page: 71
    col: 11
    role: z
    text: 師樂官名時音樂廢缺故孔子教之
  - page: 71
    col: 12
    role: z
    text: 翕合也從放也純和也皦明也繹相
  - page: 71
    col: 13
    role: z
    text: 續不絶也成樂之一終也○謝氏曰
  - page: 71
    col: 14
    role: z
    text: 五音六律不具不足以爲樂翕然言
  - page: 71
    col: 15
    role: z
    text: 其合也五音合矣清濁高下如五味
  - page: 71
    col: 16
    role: z
    text: 之相濟而後和故曰純如合而和矣
  - page: 72
    col: 1
    role: z
    text: 欲其無相奪倫故曰皦如然豈宫自
  - page: 72
    col: 2
    role: z
    text: 宫而商自商乎不相反而相連如貫
  - page: 72
    col: 3
    role: z
    text: 珠可也故曰繹如也以成
  - page: 72
    col: 4
    role: j
    text: 儀封人請見曰君子之至於斯也吾未
  - page: 72
    col: 5
    role: j
    text: 甞不得見也從者見之出曰二三子何
  - page: 72
    col: 6
    role: j
    text: 患於喪乎天下之無道也乆矣天將以
  - page: 72
    col: 7
    role: j
    text: 夫子爲木鐸
  - page: 72
    col: 8
    role: z
    text: 請見見之之見賢遍反從喪皆去聲
  - page: 72
    col: 9
    role: z
    text: 儀衛邑封人掌封疆之官蓋賢而隱
  - page: 72
    col: 10
    role: z
    text: 於下位者也君子謂當時賢者至此
  - page: 72
    col: 11
    role: z
    text: 皆得見之自言其平日不見絶於賢
  - page: 72
    col: 12
    role: z
    text: 者而求以自通也見之謂通使得見
  - page: 72
    col: 13
    role: z
    text: 喪謂失位去國禮曰喪欲速貧是也
  - page: 72
    col: 14
    role: z
    text: 木鐸金口木舌施政教時所振以警
  - page: 72
    col: 15
    role: z
    text: 衆者也言亂極當治天必將使夫子
  - page: 72
    col: 16
    role: z
    text: 得位設教不乆失位也封人一見夫
  - page: 73
    col: 1
    role: z
    text: 子而遽以是稱之其所得於觀感之
  - page: 73
    col: 2
    role: z
    text: 間者深矣或曰木鐸所以徇于道路
  - page: 73
    col: 3
    role: z
    text: 言天使夫子失位周流四方以行其
  - page: 73
    col: 4
    role: z
    text: 教如木鐸之徇于道路也
  - page: 73
    col: 5
    role: j
    text: 子謂韶盡美矣又盡善也謂武盡美矣
  - page: 73
    col: 6
    role: j
    text: 未盡善也
  - page: 73
    col: 7
    role: z
    text: 韶舜樂武武王樂美者聲容之盛善
  - page: 73
    col: 8
    role: z
    text: 者美之實也舜紹堯致治武王伐紂
  - page: 73
    col: 9
    role: z
    text: 救民其功一也故其樂皆盡美然舜
  - page: 73
    col: 10
    role: z
    text: 之德性之也又以揖遜而有天下武
  - page: 73
    col: 11
    role: z
    text: 王之德反之也又以征誅而得天下
  - page: 73
    col: 12
    role: z
    text: 故其實有不同者○程子曰成湯放
  - page: 73
    col: 13
    role: z
    text: 桀惟有慙德武王亦然故未盡善堯
  - page: 73
    col: 14
    role: z
    text: 舜湯武其揆一也征伐非其所欲所
  - page: 73
    col: 15
    role: z
    text: 遇之時然爾
  - page: 73
    col: 16
    role: j
    text: 子曰居上不寬爲禮不敬臨喪不哀吾
  - page: 74
    col: 1
    role: j
    text: 何以觀之哉
  - page: 74
    col: 2
    role: z
    text: 居上主於愛人故以寛爲本爲禮以
  - page: 74
    col: 3
    role: z
    text: 敬爲本臨喪以哀爲本旣無其本則
  - page: 74
    col: 4
    role: z
    text: 以何者而觀其所行之得失哉
  - page: 74
    col: 5
    role: title
    text: 里仁第四
  - page: 74
    col: 6
    role: z
    text: 凡二十六章
  - page: 74
    col: 7
    role: j
    text: 子曰里仁爲美擇不處仁焉得知
  - page: 74
    col: 8
    role: z
    text: 處上聲焉於䖍反知去聲○里有仁
  - page: 74
    col: 9
    role: z
    text: 厚之俗爲美擇里而不居於是焉則
  - page: 74
    col: 10
    role: z
    text: 失其是非之本心而不得爲知矣
  - page: 74
    col: 11
    role: j
    text: 子曰不仁者不可以乆處約不可以長
  - page: 74
    col: 12
    role: j
    text: 處樂仁者安仁知者利仁
  - page: 74
    col: 13
    role: z
    text: 樂音洛知去聲○約窮困也利猶貪
  - page: 74
    col: 14
    role: z
    text: 也蓋深知篤好而必欲得之也不仁
  - page: 74
    col: 15
    role: z
    text: 之人失其本心乆約必濫乆樂必淫
  - page: 74
    col: 16
    role: z
    text: 惟仁者則安其仁而無適不然知者
  - page: 75
    col: 1
    role: z
    text: 則利於仁而不易所守蓋雖深淺之
  - page: 75
    col: 2
    role: z
    text: 不同然皆非外物所能奪矣○謝氏
  - page: 75
    col: 3
    role: z
    text: 曰仁者心無內外遠近精粗之間非
  - page: 75
    col: 4
    role: z
    text: 有所存而自不亡非有所理而自不
  - page: 75
    col: 5
    role: z
    text: 亂如目視而耳聽手持而足行也知
  - page: 75
    col: 6
    role: z
    text: 者謂之有所見則可謂之有所得則
  - page: 75
    col: 7
    role: z
    text: 未可有所存斯不亡有所理斯不亂
  - page: 75
    col: 8
    role: z
    text: 未能無意也安仁則一利仁則二安
  - page: 75
    col: 9
    role: z
    text: 仁者非顏閔以上去聖人為不遠不
  - page: 75
    col: 10
    role: z
    text: 知此味也諸子雖有卓越之才謂之
  - page: 75
    col: 11
    role: z
    text: 見道不惑則可然未免於利之也
  - page: 75
    col: 12
    role: j
    text: 子曰惟仁者能好人能惡人
  - page: 75
    col: 13
    role: z
    text: 好惡皆去聲○惟之為言獨也蓋無
  - page: 75
    col: 14
    role: z
    text: 私心然後好惡當於理程子所謂得
  - page: 75
    col: 15
    role: z
    text: 其公正是也○游氏曰好善而惡惡
  - page: 75
    col: 16
    role: z
    text: 天下之同情然人每失其正者心有
  - page: 76
    col: 1
    role: z
    text: 所繫而不能自克也惟仁者無私心
  - page: 76
    col: 2
    role: z
    text: 所以能好惡也
  - page: 76
    col: 3
    role: j
    text: 子曰苟志於仁矣無惡也
  - page: 76
    col: 4
    role: z
    text: 惡如字○苟誠也志者心之所之也
  - page: 76
    col: 5
    role: j
    text: 其心誠在於仁則必無爲惡之事矣○
  - page: 76
    col: 6
    role: z
    text: 楊氏曰苟志於仁未必無過舉也然
  - page: 76
    col: 7
    role: z
    text: 而爲惡則無矣
  - page: 76
    col: 8
    role: j
    text: 子曰冨與貴是人之所欲也不以其道
  - page: 76
    col: 9
    role: j
    text: 得之不處也貧與賤是人之所惡也不
  - page: 76
    col: 10
    role: j
    text: 以其道得之不去也
  - page: 76
    col: 11
    role: z
    text: 惡去聲○不以其道得之謂不當得
  - page: 76
    col: 12
    role: z
    text: 而得之然於冨貴則不處於貧賤則
  - page: 76
    col: 13
    role: j
    text: 不去君子之審冨貴而安貧賤也如此
  - page: 76
    col: 14
    role: j
    text: 君子去仁惡乎成名
  - page: 76
    col: 15
    role: z
    text: 惡平聲○言君子所以爲君子以其
  - page: 76
    col: 16
    role: z
    text: 仁也若貪冨貴而厭貧賤則是自離
  - page: 77
    col: 1
    role: j
    text: 其仁而無君子之實矣何所成其名乎
  - page: 77
    col: 2
    role: j
    text: 君子無終食之間違仁造次必於是顛
  - page: 77
    col: 3
    role: j
    text: 沛必於是
  - page: 77
    col: 4
    role: z
    text: 造七到反沛音貝○終食者一飯之
  - page: 77
    col: 5
    role: z
    text: 頃造次急遽苟且之時顛沛傾覆流
  - page: 77
    col: 6
    role: z
    text: 離之際蓋君子之不去乎仁如此不
  - page: 77
    col: 7
    role: z
    text: 但冨貴貧賤取舎之間而巳也○言
  - page: 77
    col: 8
    role: z
    text: 君子爲仁自冨貴貧賤取舎之間以
  - page: 77
    col: 9
    role: z
    text: 至於終食造次顛沛之頃無時無處
  - page: 77
    col: 10
    role: z
    text: 而不用其力也然取舎之分明然後
  - page: 77
    col: 11
    role: z
    text: 存養之功宻存養之功宻則其取舎
  - page: 77
    col: 12
    role: z
    text: 之分益明矣
  - page: 77
    col: 13
    role: j
    text: 子曰我未見好仁者惡不仁者好仁者
  - page: 77
    col: 14
    role: j
    text: 無以尚之惡不仁者其爲仁矣不使不
  - page: 77
    col: 15
    role: j
    text: 仁者加乎其身
  - page: 77
    col: 16
    role: z
    text: 好惡皆去聲○夫子自言未見好仁
  - page: 78
    col: 1
    role: z
    text: 者惡不仁者蓋好仁者眞知仁之可
  - page: 78
    col: 2
    role: z
    text: 好故天下之物無以加之惡不仁者
  - page: 78
    col: 3
    role: z
    text: 眞知不仁之可惡故其所以爲仁者
  - page: 78
    col: 4
    role: z
    text: 必能絕去不仁之事而不使少有及
  - page: 78
    col: 5
    role: z
    text: 於其身此皆成德之事故難得而見
  - page: 78
    col: 6
    role: z
    text: 之也
  - page: 78
    col: 7
    role: j
    text: 有能一日用其力於仁矣乎我未見力
  - page: 78
    col: 8
    role: j
    text: 不足者
  - page: 78
    col: 9
    role: z
    text: 言好仁惡不仁者雖不可見然或有
  - page: 78
    col: 10
    role: z
    text: 人果能一旦奮然用力於仁則我又
  - page: 78
    col: 11
    role: z
    text: 未見其力有不足者蓋爲仁在己欲
  - page: 78
    col: 12
    role: z
    text: 之則是而志之所至氣必至焉故仁
  - page: 78
    col: 13
    role: z
    text: 雖難能而至之亦易也
  - page: 78
    col: 14
    role: j
    text: 蓋有之矣我未之見也
  - page: 78
    col: 15
    role: z
    text: 蓋疑詞有之謂有用力而力不足者
  - page: 78
    col: 16
    role: z
    text: 蓋人之氣質不同故疑亦容或有此
  - page: 79
    col: 1
    role: j
    text: 昏弱之甚欲進而不能者但我偶未
  - page: 79
    col: 2
    role: j
    text: 之見耳蓋不敢終以爲易而又嘆人
  - page: 79
    col: 3
    role: j
    text: 之莫肯用力於仁也○此章言仁之
  - page: 79
    col: 4
    role: j
    text: 成德雖難其人然學者苟能實用其
  - page: 79
    col: 5
    role: j
    text: 力則亦無不可至之理但用力而不
  - page: 79
    col: 6
    role: j
    text: 至者今亦未見其人焉此夫子所以
  - page: 79
    col: 7
    role: z
    text: 反覆而歎惜之也
  - page: 79
    col: 8
    role: j
    text: 子曰人之過也各於其黨觀過斯知仁矣
  - page: 79
    col: 9
    role: j
    text: 黨類也○程子曰人之過也各於其
  - page: 79
    col: 10
    role: j
    text: 類君子常失於厚小人常失於薄君
  - page: 79
    col: 11
    role: j
    text: 子過於愛小人過於忍○尹氏曰於
  - page: 79
    col: 12
    role: j
    text: 此觀之則人之仁不仁可知矣○呉
  - page: 79
    col: 13
    role: j
    text: 氏曰後漢呉祐謂掾以親故受汙辱
  - page: 79
    col: 14
    role: j
    text: 之名所謂觀過知仁是也愚按此亦
  - page: 79
    col: 15
    role: j
    text: 但言人雖有過猶可即此而知其厚
  - page: 79
    col: 16
    role: j
    text: 薄非謂必俟其有過而後賢否可知也
  - page: 80
    col: 1
    role: j
    text: 子曰朝聞道夕死可矣
  - page: 80
    col: 2
    role: z
    text: 道者事物當然之理苟得聞之則生
  - page: 80
    col: 3
    role: z
    text: 順死安無復遺恨矣朝夕所以甚言
  - page: 80
    col: 4
    role: z
    text: 其時之近○程子曰言人不可以不
  - page: 80
    col: 5
    role: z
    text: 知道苟得聞道雖死可也又曰皆實
  - page: 80
    col: 6
    role: z
    text: 理也人知而信者爲難死生亦大矣
  - page: 80
    col: 7
    role: z
    text: 非誠有所得豈以夕死爲可乎
  - page: 80
    col: 8
    role: j
    text: 子曰士志於道而恥惡衣惡食者未足
  - page: 80
    col: 9
    role: j
    text: 與議也
  - page: 80
    col: 10
    role: z
    text: 心欲求道而以口體之奉不若人爲
  - page: 80
    col: 11
    role: j
    text: 恥其識趣之卑陋甚矣何足與議於道
  - page: 80
    col: 12
    role: z
    text: 哉○程子曰志於道而心役乎外何
  - page: 80
    col: 13
    role: z
    text: 足與議也
  - page: 80
    col: 14
    role: j
    text: 子曰君子之於天下也無適也無莫也
  - page: 80
    col: 15
    role: j
    text: 義之與比
  - page: 80
    col: 16
    role: z
    text: 適丁歷反比必二反○適專主也春
  - page: 81
    col: 1
    role: z
    text: 秋傳曰吾誰適從是也莫不肯也比
  - page: 81
    col: 2
    role: z
    text: 從也○謝氏曰適可也莫不可也無
  - page: 81
    col: 3
    role: z
    text: 可無不可苟無道以主之不幾於猖
  - page: 81
    col: 4
    role: z
    text: 狂自恣乎此佛老之學所以自謂心
  - page: 81
    col: 5
    role: z
    text: 無所住而能應變而卒得罪於聖人
  - page: 81
    col: 6
    role: z
    text: 也聖人之學不然於無可無不可之
  - page: 81
    col: 7
    role: z
    text: 間有義存焉然則君子之心果有所
  - page: 81
    col: 8
    role: z
    text: 倚乎
  - page: 81
    col: 9
    role: j
    text: 子曰君子懷德小人懷土君子懷刑小
  - page: 81
    col: 10
    role: j
    text: 人懷惠
  - page: 81
    col: 11
    role: z
    text: 懷思念也懷德謂存其固有之善懷
  - page: 81
    col: 12
    role: z
    text: 土謂溺其所處之安懷刑謂畏法懷
  - page: 81
    col: 13
    role: z
    text: 惠謂貪利君子小人趣向不同公私
  - page: 81
    col: 14
    role: z
    text: 之間而已○尹氏曰樂善惡不善所
  - page: 81
    col: 15
    role: z
    text: 以爲君子苟安務得所以爲小人
  - page: 81
    col: 16
    role: j
    text: 子曰放於利而行多怨
  - page: 82
    col: 1
    role: z
    text: 放上聲○孔氏曰放依也多怨謂多
  - page: 82
    col: 2
    role: z
    text: 取怨○程子曰欲利於己必害於人
  - page: 82
    col: 3
    role: z
    text: 故多怨
  - page: 82
    col: 4
    role: j
    text: 子曰能以禮讓為國乎何有不能以禮
  - page: 82
    col: 5
    role: j
    text: 讓為國如禮何
  - page: 82
    col: 6
    role: z
    text: 遜者禮之實也何有言不難也言有
  - page: 82
    col: 7
    role: z
    text: 禮之實以為國則何難之有不然則
  - page: 82
    col: 8
    role: z
    text: 其禮文雖具亦且無如之何矣而况
  - page: 82
    col: 9
    role: z
    text: 於為國乎
  - page: 82
    col: 10
    role: j
    text: 子曰不患無位患所以立不患莫己知
  - page: 82
    col: 11
    role: j
    text: 求為可知也
  - page: 82
    col: 12
    role: z
    text: 所以立謂所以立乎其位者可知謂
  - page: 82
    col: 13
    role: z
    text: 可以見知之實○程子曰君子求其
  - page: 82
    col: 14
    role: z
    text: 在己者而已矣
  - page: 82
    col: 15
    role: j
    text: 子曰參乎吾道一以貫之曾子曰唯
  - page: 82
    col: 16
    role: z
    text: 參所金反唯上聲○參乎者呼曾子
  - page: 83
    col: 1
    role: z
    text: 之名而告之貫通也唯者應之速而
  - page: 83
    col: 2
    role: z
    text: 無疑者也聖人之心渾然一理而泛
  - page: 83
    col: 3
    role: z
    text: 應曲當用各不同曾子於其用處蓋
  - page: 83
    col: 4
    role: z
    text: 巳隨事精察而力行之但未知其體
  - page: 83
    col: 5
    role: z
    text: 之一爾夫子知其眞積力乆將有所
  - page: 83
    col: 6
    role: z
    text: 得是以呼而告之曾子果能黙契其
  - page: 83
    col: 7
    role: z
    text: 指即應之速而無疑也
  - page: 83
    col: 8
    role: j
    text: 子出門人問曰何謂也曾子曰夫子之
  - page: 83
    col: 9
    role: j
    text: 道忠恕而巳矣
  - page: 83
    col: 10
    role: z
    text: 盡己之謂忠推己之謂恕而巳矣者
  - page: 83
    col: 11
    role: z
    text: 竭盡而無餘之詞也夫子之一理渾
  - page: 83
    col: 12
    role: z
    text: 然而泛應曲當譬則天地之至誠無
  - page: 83
    col: 13
    role: z
    text: 息而萬物各得其所也自此之外固
  - page: 83
    col: 14
    role: z
    text: 無餘法而亦無待於推矣曾子有見
  - page: 83
    col: 15
    role: z
    text: 於此而難言之故借學者盡己推己
  - page: 83
    col: 16
    role: z
    text: 之目以著明之欲人之易曉也蓋至
  - page: 84
    col: 1
    role: z
    text: 誠無息者道之體也萬殊之所以一
  - page: 84
    col: 2
    role: z
    text: 本也萬物各得其所者道之用也一
  - page: 84
    col: 3
    role: z
    text: 本之所以萬殊也以此觀之一以貫
  - page: 84
    col: 4
    role: z
    text: 之之實可見矣或曰中心爲忠如心
  - page: 84
    col: 5
    role: z
    text: 爲恕於義亦通○程子曰以己及物
  - page: 84
    col: 6
    role: z
    text: 仁也推己及物恕也違道不遠是也
  - page: 84
    col: 7
    role: z
    text: 忠恕一以貫之忠者天道恕者人道
  - page: 84
    col: 8
    role: z
    text: 忠者無妄恕者所以行乎忠也忠者
  - page: 84
    col: 9
    role: z
    text: 體恕者用大本達道也此與違道不
  - page: 84
    col: 10
    role: z
    text: 遠異者動以天爾又曰維天之命於
  - page: 84
    col: 11
    role: z
    text: 穆不已忠也乾道變化各正性命恕
  - page: 84
    col: 12
    role: z
    text: 也又曰聖人教人各因其才吾道一
  - page: 84
    col: 13
    role: z
    text: 以貫之唯曾子爲能達此孔子所以
  - page: 84
    col: 14
    role: z
    text: 告之也曾子告門人曰夫子之道忠
  - page: 84
    col: 15
    role: z
    text: 恕而已矣亦猶夫子之告曾子也中
  - page: 84
    col: 16
    role: z
    text: 庸所謂忠恕違道不遠斯乃下學上
  - page: 85
    col: 1
    role: z
    text: 達之義
  - page: 85
    col: 2
    role: j
    text: 子曰君子喻於義小人喻於利
  - page: 85
    col: 3
    role: z
    text: 喻猶曉也義者天理之所宜利者人
  - page: 85
    col: 4
    role: z
    text: 情之所欲○程子曰君子之於義猶
  - page: 85
    col: 5
    role: z
    text: 小人之於利也唯其深喻是以篤好
  - page: 85
    col: 6
    role: z
    text: 楊氏曰君子有舍生而取義者以利
  - page: 85
    col: 7
    role: z
    text: 言之則人之所欲無甚於生所惡無
  - page: 85
    col: 8
    role: z
    text: 甚於死孰肯舍生而取義哉其所喻
  - page: 85
    col: 9
    role: z
    text: 者義而已不知利之爲利故也小人
  - page: 85
    col: 10
    role: z
    text: 反是
  - page: 85
    col: 11
    role: j
    text: 子曰見賢思齊焉見不賢而内自省也
  - page: 85
    col: 12
    role: z
    text: 省悉井反○思齊者冀已亦有是善
  - page: 85
    col: 13
    role: z
    text: 内自省者恐已亦有是惡○胡氏曰
  - page: 85
    col: 14
    role: z
    text: 見人之善惡不同而無不反諸身者
  - page: 85
    col: 15
    role: z
    text: 則不徒羨人而甘自棄不徒責人而
  - page: 85
    col: 16
    role: z
    text: 忘自責矣
  - page: 86
    col: 1
    role: j
    text: 子曰事父母幾諫見志不從又敬不違
  - page: 86
    col: 2
    role: j
    text: 勞而不怨
  - page: 86
    col: 3
    role: j
    text: 此章與内則之言相表裏幾微也微
  - page: 86
    col: 4
    role: j
    text: 諫所謂父母有過下氣怡色柔聲以
  - page: 86
    col: 5
    role: j
    text: 諫也見志不從又敬不違所謂諫若
  - page: 86
    col: 6
    role: j
    text: 不入起敬起孝悅則復諫也勞而不
  - page: 86
    col: 7
    role: j
    text: 怨所謂與其得罪於郷黨州閭寧熟
  - page: 86
    col: 8
    role: j
    text: 諫父母怒不悅而撻之流血不敢疾
  - page: 86
    col: 9
    role: j
    text: 怨起敬起孝也
  - page: 86
    col: 10
    role: j
    text: 子曰父母在不遠遊遊必有方
  - page: 86
    col: 11
    role: j
    text: 遠遊則去親遠而爲日乆定省曠而
  - page: 86
    col: 12
    role: j
    text: 音問踈不惟己之思親不置亦恐親
  - page: 86
    col: 13
    role: j
    text: 之念我不忘也遊必有方如已告云
  - page: 86
    col: 14
    role: j
    text: 之東即不敢更適西欲親必知己之
  - page: 86
    col: 15
    role: j
    text: 所在而無憂召己則必至而無失也
  - page: 86
    col: 16
    role: j
    text: 范氏曰子能以父母之心爲心則孝
  - page: 87
    col: 1
    role: z
    text: 矣
  - page: 87
    col: 2
    role: j
    text: 子曰三年無改於父之道可謂孝矣
  - page: 87
    col: 3
    role: z
    text: 胡氏曰已見首篇此蓋複出而逸其
  - page: 87
    col: 4
    role: z
    text: 半也
  - page: 87
    col: 5
    role: j
    text: 子曰父母之年不可不知也一則以喜
  - page: 87
    col: 6
    role: j
    text: 一則以懼
  - page: 87
    col: 7
    role: z
    text: 知猶記憶也常知父母之年則既喜
  - page: 87
    col: 8
    role: z
    text: 其壽又懼其衰而於愛日之誠自有
  - page: 87
    col: 9
    role: z
    text: 不能已者
  - page: 87
    col: 10
    role: j
    text: 子曰古者言之不出耻躬之不逮也
  - page: 87
    col: 11
    role: z
    text: 言古者以見今之不然逮及也行不
  - page: 87
    col: 12
    role: z
    text: 及言可耻之甚古者所以不出其言
  - page: 87
    col: 13
    role: z
    text: 爲此故也○范氏曰君子之於言也
  - page: 87
    col: 14
    role: z
    text: 不得已而後出之非言之難而行之
  - page: 87
    col: 15
    role: z
    text: 難也人唯其不行也是以輕言之言
  - page: 87
    col: 16
    role: z
    text: 之如其所行行之如其所言則出諸
  - page: 88
    col: 1
    role: z
    text: 其口必不易矣
  - page: 88
    col: 2
    role: j
    text: 子曰以約鮮矣
  - page: 88
    col: 3
    role: z
    text: 鮮上聲○謝氏曰不侈然以自放之
  - page: 88
    col: 4
    role: z
    text: 謂約○尹氏曰凡事約則鮮失非止
  - page: 88
    col: 5
    role: z
    text: 謂儉約也
  - page: 88
    col: 6
    role: j
    text: 子曰君子欲訥於言而敏於行
  - page: 88
    col: 7
    role: z
    text: 行去聲○謝氏曰放言易故欲訥力
  - page: 88
    col: 8
    role: z
    text: 行難故欲敏○胡氏曰自吾道一貫
  - page: 88
    col: 9
    role: z
    text: 至此十章疑皆曾子門人所記也
  - page: 88
    col: 10
    role: j
    text: 子曰德不孤必有鄰
  - page: 88
    col: 11
    role: z
    text: 鄰猶親也德不孤立必以類應故有
  - page: 88
    col: 12
    role: z
    text: 德者必有其類從之如居之有鄰也
  - page: 88
    col: 13
    role: j
    text: 子游曰事君數斯辱矣朋友數斯疏矣
  - page: 88
    col: 14
    role: z
    text: 數色角反○程子曰數煩數也○胡
  - page: 88
    col: 15
    role: z
    text: 氏曰事君諫不行則當去導友善不
  - page: 88
    col: 16
    role: z
    text: 納則當止至於煩瀆則言者輕聽者
  - page: 89
    col: 1
    role: z
    text: 厭矣是以求榮而反辱求親而反疏
  - page: 89
    col: 2
    role: z
    text: 也○范氏曰君臣朋友皆以義合故
  - page: 89
    col: 3
    role: z
    text: 其事同也
  - page: 89
    col: 5
    role: j
    text: 論語卷第二
