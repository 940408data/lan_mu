# 论语集注卷二（当涂郡斋刊递修本·善本底）：j 为经传大字，z 为章句小字。版面结构先行：顶格经/退格注。
sections:
  - id: pian1
    name: 八佾第三
    blocks:
      - { type: z, text: 凡二十六章通前篇末二章皆論禮樂之事 }
      - { type: j, text: 孔子謂季氏八佾舞於庭是可忍也孰不可忍也 }
      - { type: z, text: 佾音逸○季氏魯大夫季孫氏也佾舞列也天子八諸侯六大夫四士二每佾人數如其佾數或曰每佾八人未詳孰是季氏以大夫而僭用天子之樂孔子言其此事尚忍為之則何事不可忍為或曰忍容忍也蓋深疾之之辭○范氏曰樂舞之數自上而下降殺以兩而已故兩之間不可以毫髮僭差也孔子為政先正禮樂則季氏之罪不容誅矣○謝氏曰君子於其所不當為不敢湏臾處不忍故也而季氏忍此矣則雖弑父與君亦何所憚而不為乎 }
      - { type: j, text: 三家者以雍徹子曰相維辟公天子穆穆奚取於三家之堂 }
      - { type: z, text: 徹直列反相去聲○三家魯大夫孟孫叔孫季孫之家也雍周頌篇名徹祭畢而収其俎也天子宗廟之祭則歌雍以徹是時三家僭而用之相助也辟公諸侯也穆穆深遠之意天子之容也此雍詩之詞孔子引之言三家之堂非有此事亦何取於此義而歌之乎譏其無知妄作以取僭竊之罪○程子曰周公之功固大矣皆臣子之分所當為魯安得獨用天子禮樂哉成王之賜伯禽之受皆非也其因襲之弊遂使季氏僭八佾三家僭雍徹故仲尼譏之 }
      - { type: j, text: 子曰人而不仁如禮何人而不仁如樂何 }
      - { type: z, text: 游氏曰人而不仁則人心亡矣其如禮樂何哉言雖欲用之而禮樂不為之用也○程子曰仁者天下之正理失正理則無序而不和○李氏曰禮樂待人而後行苟非其人則雖玉帛交錯鍾鼓鏗鏘亦將如之何哉然記者序此於八佾雍徹之後疑其爲僭禮樂者發也 }
      - { type: j, text: 林放問禮之本 }
      - { type: z, text: 林放魯人見世之爲禮者專事繁文而疑其本之不在是也故以爲問 }
      - { type: j, text: 子曰大哉問 }
      - { type: z, text: 孔子以時方逐末而放獨有志於本故大其問蓋得其本則禮之全體無不在其中矣 }
      - { type: j, text: 禮與其奢也寧儉喪與其易也寧戚 }
      - { type: z, text: 易去聲○易治也孟子曰易其田疇在喪禮則節文習熟而無哀痛慘怛之實者也戚則一於哀而文不足耳禮貴得中奢易則過於文儉戚則不及而質二者皆未合理然凡物之理 }
      - { type: j, text: 必先有質而後有文則質乃禮之本也范氏曰夫祭與其敬不足而禮有餘也不若禮不足而敬有餘也喪與其哀不足而禮有餘也不若禮不足而哀有餘也禮失之奢喪失之易皆不能反本而隨其末故也禮奢而備不若儉而不備之愈也喪易而文不若戚而不文之愈也儉者物之質戚者心之誠故爲禮之本楊氏曰禮始諸飲食故汙尊而抔飲爲之簠簋籩豆罍爵之飾所以文之也則其本儉而已喪不可以徑情而直行爲之衰麻哭踊之數所以節之也則其本戚而已周衰世方以文滅質而林放獨能問禮之本故夫子大之而告之以此子曰夷狄之有君不如諸夏之亡也吳氏曰亡古無字通用程子曰夷狄且有君長不如諸夏之僭亂反無上下之分也尹氏曰孔子傷時之亂而歎之也亡非實亡也雖有之不能 }
      - { type: z, text: 盡其道爾 }
      - { type: j, text: 季氏旅於泰山子謂冉有曰女弗能救與對曰不能子曰嗚呼曾謂泰山不如林放乎女音汝與平聲旅祭名泰山山名在魯地禮諸侯祭封内山川季氏祭之僭也冉有孔子弟子名求時爲季氏宰救謂救其陷於僭竊之罪嗚呼歎辭言神不享非禮欲季氏知其無益而自止又進林放以厲冉有也范氏曰冉有從季氏夫子豈不知其 }
      - { type: z, text: 不可告也然而聖人不輕絶人盡己之心安知冉有之不能救季氏之不可諫也旣不能正則美林放以明泰山之不可誣是亦教誨之道也 }
      - { type: j, text: 子曰君子無所争必也射乎揖讓而升下而飲其争也君子 }
      - { type: z, text: 飲去聲○揖遜而升者大射之禮耦進三揖而後升堂也下而飲謂射畢揖降以俟衆耦皆畢勝者乃揖不勝者升取觶立飲也言君子恭遜不與人争惟於射而後有争然其争也雍容揖遜乃如此則其争也君子而非若小人之争矣 }
      - { type: j, text: 子夏問曰巧笑倩兮美目盼兮素以爲絢兮何謂也 }
      - { type: z, text: 倩七練反盼普莧反絢呼縣反○此逸詩也倩好口輔也盼目黑白分也素粉地畫之質也絢采色畫之飾也言人有此倩盼之美質而又加以華采之飾如有素地而加采色也子夏疑其反謂以素爲飾故問之 }
      - { type: j, text: 子曰繪事後素 }
      - { type: z, text: 繪胡對反○繪事繪畫之事也後素後於素也考工記曰繪畫之事後素功謂先以粉地爲質而後施五采猶人有美質然後可加文飾 }
      - { type: j, text: 曰禮後乎子曰起予者商也始可與言詩已矣 }
      - { type: z, text: 禮必以忠信爲質猶繪事必以粉素爲先起猶發也起予言能起發我之志意○謝氏曰子貢因論學而知詩子夏因論詩而知學故皆可與言詩楊氏曰甘受和白受采忠信之人可以學禮苟無其質禮不虚行此繪事後素之說也孔子曰繪事後素而子夏曰禮後乎可謂能繼其志矣非得之言意之表者能之乎商賜可與言詩者以此若夫玩心於章句之末則其爲詩也固而已矣所謂起予則亦相長之義也 }
      - { type: j, text: 子曰夏禮吾能言之杞不足徵也殷禮吾能言之宋不足徵也文獻不足故也足則吾能徵之矣 }
      - { type: z, text: 杞夏之後宋商之後徵證也文典籍也獻賢也言二代之禮我能言之而二國不足取以爲證以其文獻不足故也文獻若足則我能取之以證吾言矣 }
      - { type: j, text: 子曰禘自旣灌而往者吾不欲觀之矣 }
      - { type: z, text: 禘大計反○趙伯循曰禘王者之大祭也王者旣立始祖之廟又推始祖所自出之帝祀之於始祖之廟而以始祖配之也成王以周公有勲勞賜魯重祭故得禘於周公之廟以文王爲所出之帝而周公配之然非禮矣灌者方祭之始用鬱鬯之酒灌地以降神也魯之君臣當此之時誠意未散猶有可觀自此以後則浸以懈怠而無足觀矣蓋魯祭非禮孔子本不欲觀至此而失禮之中又失禮焉故發此歎也○謝氏曰夫子甞曰我欲觀夏道是故之杞而不足證也我欲觀商道是故之宋而不足證也又曰我觀周道幽厲傷之吾舎魯何適矣魯之郊禘非禮也周公其衰矣考之杞宋已如彼考之當今又如此孔子所以深歎也 }
      - { type: j, text: 或問禘之說子曰不知也知其說者之於天下也其如示諸斯乎指其掌 }
      - { type: z, text: 先王報本追遠之意莫深於禘非仁孝誠敬之至不足以與此非或人之所及也而不王不禘之法又魯之所當諱者故以不知答之示與視同指其掌弟子記夫子言此而自指其掌言其明且易也蓋知禘之說則理無不明誠無不格而治天下不難矣聖人於此豈眞有所不知也哉 }
      - { type: j, text: 祭如在祭神如神在 }
      - { type: z, text: 程子曰祭祭先祖也祭神祭外神也祭先主於孝祭神主於敬愚謂此明人記孔子祭祀之誠意 }
      - { type: j, text: 子曰吾不與祭如不祭 }
      - { type: z, text: 與去聲○又記孔子之言以明之言己當祭之時或有故不得與而使它人攝之則不得致其如在之誠故雖已祭而此心缺然如未甞祭也○范氏曰君子之祭七日戒三日齋必見所祭者誠之至也是故郊則天神格廟則人鬼享皆由己以致之也有其誠則有其神無其誠則無其神可不謹乎吾不與祭如不祭誠爲實禮爲虛也 }
      - { type: j, text: 王孫賈問曰與其媚於奧寧媚於竈何謂也 }
      - { type: z, text: 王孫賈衛大夫媚親順也室西南隅爲奧竈者五祀之一夏所祭也凡祭五祀皆先設主而祭於其所然後迎尸而祭於奧略如祭宗廟之儀如祀竈則設主於竈陘祭畢而更設饌於奧以迎尸也故時俗之語因以奧有常尊而非祭之主竈雖卑賤而當時用事喻自結於君不如阿附權臣也賈衛之權臣故以諷孔子 }
      - { type: j, text: 子曰不然獲罪於天無所禱也 }
      - { type: z, text: 天即理也其尊無對非奧竈之可比也逆理則獲罪於天矣豈媚於奧竈所能禱而免乎言但當順理非特不當媚竈亦不可媚於奧也○謝氏曰聖人之言遜而不迫使王孫賈而知此意不爲無益使其不知亦非所以取禍 }
      - { type: j, text: 子曰周監於二代郁郁乎文哉吾從周 }
      - { type: z, text: 郁於六反○監視也二代夏商也言其視二代之禮而損益之郁郁文盛貌○尹氏曰三代之禮至周大備夫 }
      - { type: j, text: 子美其文而從之子入大廟每事問或曰孰謂鄹人之子知禮乎入大廟每事問子聞之曰是禮也 }
      - { type: z, text: 大音泰鄹側留反○大廟魯周公廟此蓋孔子始仕之時入而助祭也鄹魯邑名孔子父叔梁紇甞爲其邑大夫孔子自少以知禮聞故或人因此而譏之孔子言是禮者敬謹之至乃所以爲禮也○尹氏曰禮者敬而已矣雖知亦問謹之至也其爲敬莫大 }
      - { type: j, text: 於此謂之不知禮者豈足以知孔子哉子曰射不主皮爲力不同科古之道也 }
      - { type: z, text: 爲去聲○射不主皮鄉射禮文爲力 }
      - { type: j, text: 不同科孔子解禮之意如此也皮革也布侯而棲革於其中以爲的所謂鵠也科等也古者射以觀德但主於中而不主於貫革蓋以人之力有強弱不同等也記曰武王克商散軍郊射而貫革之射息正謂此也周衰禮廢列國兵争復尚貫革故孔子歎之楊氏曰中可以學而能力不可以強而 }
      - { type: z, text: 至聖人言古之道所以正今之失 }
      - { type: j, text: 子貢欲去告朔之餼羊 }
      - { type: z, text: 去起呂反告古篤反餼許氣反○告朔之禮古者天子常以季冬頒來歲十二月之朔于諸侯諸侯受而藏之祖廟月朔則以特羊告廟請而行之餼生牲也魯自文公始不視朔而有司猶供此羊故子貢欲去之 }
      - { type: j, text: 子曰賜也爾愛其羊我愛其禮 }
      - { type: z, text: 愛猶惜也子貢蓋惜其無實而妄費然禮雖廢羊存猶得以識之而可復焉若并去其羊則此禮遂亡矣孔子所以惜之○楊氏曰告朔諸侯所以禀命於君親禮之大者魯不視朔矣然羊存則告朔之名未泯而其實因可舉此夫子所以惜之也 }
      - { type: j, text: 子曰事君盡禮人以爲謟也 }
      - { type: z, text: 黃氏曰孔子於事君之禮非有所加也如是而後盡爾時人不能反以爲謟故孔子言之以明禮之當然也○程子曰聖人事君盡禮當時以爲謟若他人言之必曰我事君盡禮小人以爲謟而孔子之言止於如此聖人道大德宏此亦可見 }
      - { type: j, text: 定公問君使臣臣事君如之何孔子對曰君使臣以禮臣事君以忠 }
      - { type: z, text: 定公魯君名宋二者皆理之當然各欲自盡而已○呂氏曰使臣不患其不忠患禮之不至事君不患其無禮患忠之不足○尹氏曰君臣以義合者也故君使臣以禮則臣事君以忠 }
      - { type: j, text: 子曰關雎樂而不淫哀而不傷 }
      - { type: z, text: 樂音洛○關雎周南國風詩之首篇也淫者樂之過而失其正者也傷者哀之過而害於和者也關雎之詩言后妃之德宜配君子求之未得則不能無寤寐反側之憂求而得之則宜其有琴瑟鐘鼓之樂蓋其憂雖深而不害於和其樂雖盛而不失其正故夫子稱之如此欲學者玩其辭審其音而有以識其性情之正也 }
      - { type: j, text: 哀公問社於宰我宰我對曰夏后氏以松殷人以栢周人以栗曰使民戰栗宰我孔子弟子名予三代之社不同者古者立社各樹其土之所宜木以爲主也戰栗恐懼貌宰我又言周所以用栗之意如此豈以古者戮人於 }
      - { type: z, text: 社故附會其說與 }
      - { type: j, text: 子聞之曰成事不說遂事不諫既往不咎 }
      - { type: z, text: 遂事謂事雖未成而勢不能已者孔子以宰我所對非立社之本意又啓時君殺伐之心而其言已出不可復救故歷言此以深責之欲使謹其後也○尹氏曰古者各以所宜木名其社非取義於木也宰我不知而妄對故夫子責之 }
      - { type: j, text: 子曰管仲之器小哉 }
      - { type: z, text: 管仲齊大夫名夷吾相威公霸諸侯器小言其不知聖賢大學之道故局量褊淺規模卑狹不能正身脩德以致主於王道 }
      - { type: j, text: 或曰管仲儉乎曰管氏有三歸官事不攝焉得儉 }
      - { type: z, text: 焉於虔反○或人蓋疑器小之為儉三歸臺名事見說苑攝兼也家臣不能具官一人常兼數事管仲不然皆言其侈 }
      - { type: j, text: 然則管仲知禮乎曰邦君樹塞門管氏亦樹塞門邦君為兩君之好有反坫管氏亦有反坫管氏而知禮孰不知禮 }
      - { type: z, text: 好去聲坫丁念反○或人又疑不儉為知禮屏謂之樹塞猶蔽也設屏於 }
      - { type: j, text: 門以蔽內外也好謂好會坫在兩楹之間獻酬飲畢則反爵於其上此皆諸侯之禮而管仲僭之不知禮也愚謂孔子譏管仲之器小其旨深矣或人不知而疑其儉故斥其奢以明其非儉或又疑其知禮故又斥其僭以明其不知禮蓋雖不復明言小器之所以然而其所以小者於此亦可見矣故程子曰奢而犯禮其器之小可知蓋器大則自知禮而無此失矣此言當深味也蘇氏曰自脩身正家以及於國則其本深其及者遠是謂大器楊雄所謂大器猶規矩準繩先自治而後治人者是也管仲三歸反坫威公內嬖六人而霸天下其本固已淺矣管仲死威公薨天下不復 }
      - { type: z, text: 宗齊○揚氏曰夫子大管仲之功而小其器蓋非王佐之才雖能合諸侯正天下其器不足稱也道學不明而王霸之畧混爲一途故聞管仲之器小則疑其爲儉以不儉告之則又疑其知禮蓋世方以詭遇爲功而不知爲之範則不悟其小宜矣 }
      - { type: j, text: 子語魯大師樂曰樂其可知也始作翕如也從之純如也皦如也繹如也以成 }
      - { type: z, text: 語去聲大音泰從音縱○語告也大師樂官名時音樂廢缺故孔子教之翕合也從放也純和也皦明也繹相續不絶也成樂之一終也○謝氏曰五音六律不具不足以爲樂翕然言其合也五音合矣清濁高下如五味之相濟而後和故曰純如合而和矣欲其無相奪倫故曰皦如然豈宫自宫而商自商乎不相反而相連如貫珠可也故曰繹如也以成 }
      - { type: j, text: 儀封人請見曰君子之至於斯也吾未甞不得見也從者見之出曰二三子何患於喪乎天下之無道也乆矣天將以夫子爲木鐸 }
      - { type: z, text: 請見見之之見賢遍反從喪皆去聲儀衛邑封人掌封疆之官蓋賢而隱於下位者也君子謂當時賢者至此皆得見之自言其平日不見絶於賢者而求以自通也見之謂通使得見喪謂失位去國禮曰喪欲速貧是也木鐸金口木舌施政教時所振以警衆者也言亂極當治天必將使夫子得位設教不乆失位也封人一見夫子而遽以是稱之其所得於觀感之間者深矣或曰木鐸所以徇于道路言天使夫子失位周流四方以行其教如木鐸之徇于道路也 }
      - { type: j, text: 子謂韶盡美矣又盡善也謂武盡美矣未盡善也 }
      - { type: z, text: 韶舜樂武武王樂美者聲容之盛善者美之實也舜紹堯致治武王伐紂救民其功一也故其樂皆盡美然舜之德性之也又以揖遜而有天下武王之德反之也又以征誅而得天下故其實有不同者○程子曰成湯放桀惟有慙德武王亦然故未盡善堯舜湯武其揆一也征伐非其所欲所遇之時然爾 }
      - { type: j, text: 子曰居上不寬爲禮不敬臨喪不哀吾何以觀之哉 }
      - { type: z, text: 居上主於愛人故以寛爲本爲禮以敬爲本臨喪以哀爲本旣無其本則以何者而觀其所行之得失哉 }
  - id: pian2
    name: 里仁第四
    blocks:
      - { type: z, text: 凡二十六章 }
      - { type: j, text: 子曰里仁爲美擇不處仁焉得知 }
      - { type: z, text: 處上聲焉於䖍反知去聲○里有仁厚之俗爲美擇里而不居於是焉則失其是非之本心而不得爲知矣 }
      - { type: j, text: 子曰不仁者不可以乆處約不可以長處樂仁者安仁知者利仁 }
      - { type: z, text: 樂音洛知去聲○約窮困也利猶貪也蓋深知篤好而必欲得之也不仁之人失其本心乆約必濫乆樂必淫惟仁者則安其仁而無適不然知者則利於仁而不易所守蓋雖深淺之不同然皆非外物所能奪矣○謝氏曰仁者心無內外遠近精粗之間非有所存而自不亡非有所理而自不亂如目視而耳聽手持而足行也知者謂之有所見則可謂之有所得則未可有所存斯不亡有所理斯不亂未能無意也安仁則一利仁則二安仁者非顏閔以上去聖人為不遠不知此味也諸子雖有卓越之才謂之見道不惑則可然未免於利之也 }
      - { type: j, text: 子曰惟仁者能好人能惡人 }
      - { type: z, text: 好惡皆去聲○惟之為言獨也蓋無私心然後好惡當於理程子所謂得其公正是也○游氏曰好善而惡惡天下之同情然人每失其正者心有所繫而不能自克也惟仁者無私心所以能好惡也 }
      - { type: j, text: 子曰苟志於仁矣無惡也 }
      - { type: z, text: 惡如字○苟誠也志者心之所之也 }
      - { type: j, text: 其心誠在於仁則必無爲惡之事矣 }
      - { type: z, text: 楊氏曰苟志於仁未必無過舉也然而爲惡則無矣 }
      - { type: j, text: 子曰冨與貴是人之所欲也不以其道得之不處也貧與賤是人之所惡也不以其道得之不去也 }
      - { type: z, text: 惡去聲○不以其道得之謂不當得而得之然於冨貴則不處於貧賤則 }
      - { type: j, text: 不去君子之審冨貴而安貧賤也如此君子去仁惡乎成名 }
      - { type: z, text: 惡平聲○言君子所以爲君子以其仁也若貪冨貴而厭貧賤則是自離 }
      - { type: j, text: 其仁而無君子之實矣何所成其名乎君子無終食之間違仁造次必於是顛沛必於是 }
      - { type: z, text: 造七到反沛音貝○終食者一飯之頃造次急遽苟且之時顛沛傾覆流離之際蓋君子之不去乎仁如此不但冨貴貧賤取舎之間而巳也○言君子爲仁自冨貴貧賤取舎之間以至於終食造次顛沛之頃無時無處而不用其力也然取舎之分明然後存養之功宻存養之功宻則其取舎之分益明矣 }
      - { type: j, text: 子曰我未見好仁者惡不仁者好仁者無以尚之惡不仁者其爲仁矣不使不仁者加乎其身 }
      - { type: z, text: 好惡皆去聲○夫子自言未見好仁者惡不仁者蓋好仁者眞知仁之可好故天下之物無以加之惡不仁者眞知不仁之可惡故其所以爲仁者必能絕去不仁之事而不使少有及於其身此皆成德之事故難得而見之也 }
      - { type: j, text: 有能一日用其力於仁矣乎我未見力不足者 }
      - { type: z, text: 言好仁惡不仁者雖不可見然或有人果能一旦奮然用力於仁則我又未見其力有不足者蓋爲仁在己欲之則是而志之所至氣必至焉故仁雖難能而至之亦易也 }
      - { type: j, text: 蓋有之矣我未之見也 }
      - { type: z, text: 蓋疑詞有之謂有用力而力不足者蓋人之氣質不同故疑亦容或有此 }
      - { type: j, text: 昏弱之甚欲進而不能者但我偶未之見耳蓋不敢終以爲易而又嘆人之莫肯用力於仁也此章言仁之成德雖難其人然學者苟能實用其力則亦無不可至之理但用力而不至者今亦未見其人焉此夫子所以 }
      - { type: z, text: 反覆而歎惜之也 }
      - { type: j, text: 子曰人之過也各於其黨觀過斯知仁矣黨類也程子曰人之過也各於其類君子常失於厚小人常失於薄君子過於愛小人過於忍尹氏曰於此觀之則人之仁不仁可知矣呉氏曰後漢呉祐謂掾以親故受汙辱之名所謂觀過知仁是也愚按此亦但言人雖有過猶可即此而知其厚薄非謂必俟其有過而後賢否可知也子曰朝聞道夕死可矣 }
      - { type: z, text: 道者事物當然之理苟得聞之則生順死安無復遺恨矣朝夕所以甚言其時之近○程子曰言人不可以不知道苟得聞道雖死可也又曰皆實理也人知而信者爲難死生亦大矣非誠有所得豈以夕死爲可乎 }
      - { type: j, text: 子曰士志於道而恥惡衣惡食者未足與議也 }
      - { type: z, text: 心欲求道而以口體之奉不若人爲 }
      - { type: j, text: 恥其識趣之卑陋甚矣何足與議於道 }
      - { type: z, text: 哉○程子曰志於道而心役乎外何足與議也 }
      - { type: j, text: 子曰君子之於天下也無適也無莫也義之與比 }
      - { type: z, text: 適丁歷反比必二反○適專主也春秋傳曰吾誰適從是也莫不肯也比從也○謝氏曰適可也莫不可也無可無不可苟無道以主之不幾於猖狂自恣乎此佛老之學所以自謂心無所住而能應變而卒得罪於聖人也聖人之學不然於無可無不可之間有義存焉然則君子之心果有所倚乎 }
      - { type: j, text: 子曰君子懷德小人懷土君子懷刑小人懷惠 }
      - { type: z, text: 懷思念也懷德謂存其固有之善懷土謂溺其所處之安懷刑謂畏法懷惠謂貪利君子小人趣向不同公私之間而已○尹氏曰樂善惡不善所以爲君子苟安務得所以爲小人 }
      - { type: j, text: 子曰放於利而行多怨 }
      - { type: z, text: 放上聲○孔氏曰放依也多怨謂多取怨○程子曰欲利於己必害於人故多怨 }
      - { type: j, text: 子曰能以禮讓為國乎何有不能以禮讓為國如禮何 }
      - { type: z, text: 遜者禮之實也何有言不難也言有禮之實以為國則何難之有不然則其禮文雖具亦且無如之何矣而况於為國乎 }
      - { type: j, text: 子曰不患無位患所以立不患莫己知求為可知也 }
      - { type: z, text: 所以立謂所以立乎其位者可知謂可以見知之實○程子曰君子求其在己者而已矣 }
      - { type: j, text: 子曰參乎吾道一以貫之曾子曰唯 }
      - { type: z, text: 參所金反唯上聲○參乎者呼曾子之名而告之貫通也唯者應之速而無疑者也聖人之心渾然一理而泛應曲當用各不同曾子於其用處蓋巳隨事精察而力行之但未知其體之一爾夫子知其眞積力乆將有所得是以呼而告之曾子果能黙契其指即應之速而無疑也 }
      - { type: j, text: 子出門人問曰何謂也曾子曰夫子之道忠恕而巳矣 }
      - { type: z, text: 盡己之謂忠推己之謂恕而巳矣者竭盡而無餘之詞也夫子之一理渾然而泛應曲當譬則天地之至誠無息而萬物各得其所也自此之外固無餘法而亦無待於推矣曾子有見於此而難言之故借學者盡己推己之目以著明之欲人之易曉也蓋至誠無息者道之體也萬殊之所以一本也萬物各得其所者道之用也一本之所以萬殊也以此觀之一以貫之之實可見矣或曰中心爲忠如心爲恕於義亦通○程子曰以己及物仁也推己及物恕也違道不遠是也忠恕一以貫之忠者天道恕者人道忠者無妄恕者所以行乎忠也忠者體恕者用大本達道也此與違道不遠異者動以天爾又曰維天之命於穆不已忠也乾道變化各正性命恕也又曰聖人教人各因其才吾道一以貫之唯曾子爲能達此孔子所以告之也曾子告門人曰夫子之道忠恕而已矣亦猶夫子之告曾子也中庸所謂忠恕違道不遠斯乃下學上達之義 }
      - { type: j, text: 子曰君子喻於義小人喻於利 }
      - { type: z, text: 喻猶曉也義者天理之所宜利者人情之所欲○程子曰君子之於義猶小人之於利也唯其深喻是以篤好楊氏曰君子有舍生而取義者以利言之則人之所欲無甚於生所惡無甚於死孰肯舍生而取義哉其所喻者義而已不知利之爲利故也小人反是 }
      - { type: j, text: 子曰見賢思齊焉見不賢而内自省也 }
      - { type: z, text: 省悉井反○思齊者冀已亦有是善内自省者恐已亦有是惡○胡氏曰見人之善惡不同而無不反諸身者則不徒羨人而甘自棄不徒責人而忘自責矣 }
      - { type: j, text: 子曰事父母幾諫見志不從又敬不違勞而不怨此章與内則之言相表裏幾微也微諫所謂父母有過下氣怡色柔聲以諫也見志不從又敬不違所謂諫若不入起敬起孝悅則復諫也勞而不怨所謂與其得罪於郷黨州閭寧熟諫父母怒不悅而撻之流血不敢疾怨起敬起孝也子曰父母在不遠遊遊必有方遠遊則去親遠而爲日乆定省曠而音問踈不惟己之思親不置亦恐親之念我不忘也遊必有方如已告云之東即不敢更適西欲親必知己之所在而無憂召己則必至而無失也范氏曰子能以父母之心爲心則孝 }
      - { type: z, text: 矣 }
      - { type: j, text: 子曰三年無改於父之道可謂孝矣 }
      - { type: z, text: 胡氏曰已見首篇此蓋複出而逸其半也 }
      - { type: j, text: 子曰父母之年不可不知也一則以喜一則以懼 }
      - { type: z, text: 知猶記憶也常知父母之年則既喜其壽又懼其衰而於愛日之誠自有不能已者 }
      - { type: j, text: 子曰古者言之不出耻躬之不逮也 }
      - { type: z, text: 言古者以見今之不然逮及也行不及言可耻之甚古者所以不出其言爲此故也○范氏曰君子之於言也不得已而後出之非言之難而行之難也人唯其不行也是以輕言之言之如其所行行之如其所言則出諸其口必不易矣 }
      - { type: j, text: 子曰以約鮮矣 }
      - { type: z, text: 鮮上聲○謝氏曰不侈然以自放之謂約○尹氏曰凡事約則鮮失非止謂儉約也 }
      - { type: j, text: 子曰君子欲訥於言而敏於行 }
      - { type: z, text: 行去聲○謝氏曰放言易故欲訥力行難故欲敏○胡氏曰自吾道一貫至此十章疑皆曾子門人所記也 }
      - { type: j, text: 子曰德不孤必有鄰 }
      - { type: z, text: 鄰猶親也德不孤立必以類應故有德者必有其類從之如居之有鄰也 }
      - { type: j, text: 子游曰事君數斯辱矣朋友數斯疏矣 }
      - { type: z, text: 數色角反○程子曰數煩數也○胡氏曰事君諫不行則當去導友善不納則當止至於煩瀆則言者輕聽者厭矣是以求榮而反辱求親而反疏也○范氏曰君臣朋友皆以義合故其事同也 }
      - { type: j, text: 論語卷第二 }
