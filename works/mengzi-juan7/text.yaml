# 孟子注疏卷7（孫奭疏）：j 為經文，漢趙岐注為注，z 為疏文。
sections:
  - id: juan7
    name: 正文
    blocks:
      - { type: z, text: "正义曰：此卷赵注分上卷为之者也，此卷凡有十章一章言礼守正，非招不往，枉道富贵，君子不许。二章言以道正君，非礼不运，称大丈夫，阿意用谋，善战务胜，事虽有刚，心归柔顺。三章言君子务仕，思播其道，达义行仁，待礼而动，苟容干禄，逾墙之女，人之所贱。四章言百工食力，以禄养贤，修仁尚义，国之所尊，移风易俗，其功可珍，虽食诸侯，不为素餐。五章言德修无小，暴慢无强。六章言白沙在泥，不染自黑，蓬生麻中，不扶自直，言辅之者众也。七章言道异不谋，迫斯强之，段泄已甚，瞰之得宜，正己直行，不纳於邪。八章言从善改非，坐以待旦，知而为之，罪重於故。九章言忧世饥乱，勤以济之，义以正之。十章言圣人之道，亲亲尚和，志士之操，取介守持。凡此十章合上卷五章是《滕文公》一篇十有五章也。" }
      - { type: j, text: "陈代曰：“不见诸侯，宜若小然。今一见之，大则以王，小则以霸。且《志》曰‘枉尺而直寻’，宜若可为也。”" }
      - { type: z, text: "陈代，孟子弟子也。代见诸侯有来聘请见孟子，孟子有所不见，以为孟子欲以是为介，故言此介得无为狭小乎？如一见之，傥得行道，可以辅致霸王乎。志，记也。枉尺直寻，欲使孟子屈己信道，故言宜若可为也。" }
      - { type: j, text: "孟子曰：“昔齐景公田，招虞人以旌，不至，将杀之。" }
      - { type: z, text: "虞人，守苑囿之吏也，招之当以皮冠，而以旌，故招之而不至也。" }
      - { type: j, text: "‘志士不忘在沟壑，勇士不忘丧其元’，孔子奚取焉？取非其招不往也。如不待其招而往，何哉？" }
      - { type: z, text: "志士，守义者也。君子固穷，故常念死无棺椁，没沟壑而不恨也。勇土，义勇者也。元，首也。以义则丧首不顾也。孔子奚取？取守死善道，非礼招己则不往。言虞人不得其招尚不往，如何君子而不待其招，直事妄见诸侯者，何为也已？" }
      - { type: j, text: "且夫枉尺而直寻者，以利言也。如以利，则枉寻直尺而利，亦可为与？" }
      - { type: z, text: "尺小寻者，尚可任大就小，而以要其利也。" }
      - { type: j, text: "昔者赵简子使王良与嬖奚乘，终日而不获一禽，嬖奚反命曰：‘天下之贱工也。’" }
      - { type: z, text: "赵简子，晋卿也。王良，善御者也。嬖奚，简子幸臣也。以不能得一禽，故反命於简子，谓王良天下鄙贱之工师也。" }
      - { type: j, text: "或以告王良，良曰：‘请复之。’" }
      - { type: z, text: "闻嬖奚贱之，故请复与乘。" }
      - { type: j, text: "强而後可，（强嬖奚，乃肯行。）一朝而获十禽。嬖奚反命曰：‘天下之良工也。’" }
      - { type: z, text: "以一朝得十禽，故谓之良工。" }
      - { type: j, text: "简子曰：‘我使掌与女乘。’" }
      - { type: z, text: "掌，主也。使王良主与女乘。" }
      - { type: j, text: "谓王良，良不可，（王良不肯。）曰：‘吾为之范我驰驱，终日不获一；为之诡遇，一朝而获十。" }
      - { type: z, text: "范，法也。王良曰：我为之法度之御，应礼之射，正杀之禽，不能得一。横而射之曰诡遇，非礼之射，则能获十。言嬖奚小人也，不习於礼也。" }
      - { type: j, text: "《诗》云：不失其驰，舍矢如破。我不贯与小人乘，请辞。’" }
      - { type: z, text: "《诗·小雅·车攻》之篇也。言御者不失其驰驱之法，则射者必中之。顺毛而入，顺毛而出，一发贯臧，应矢而死者如破矣，此君子之射也。贯，习也。我不习与小人乘，不愿掌与嬖奚同乘，故请辞。" }
      - { type: j, text: "御者且羞与射者比，比而得禽兽，虽若丘陵，弗为也。如枉道而从彼，何也？" }
      - { type: z, text: "孟子引此以喻陈代，云御者尚知羞耻此射者，不欲与比，子如何欲使我枉正道而从彼骄慢诸侯而见之乎。" }
      - { type: j, text: "且子过矣！枉己者，未有能直人者也。”" }
      - { type: z, text: "谓陈代之言过谬也。人当以直矫枉耳，己自枉曲，何能正人。“陈代曰”至“未有能直人者也”。○正义曰：此章指言修礼守正，非招不往，枉道富贵，君子不许。是以诸侯虽有善其辞命，伯夷不屑就也。“陈代曰：不见诸侯，宜若小然。今一见之，大则以王，小则以霸。且志曰枉尺而直寻，宜若可为也”者，陈代，孟子弟子也，问孟子，以谓今不见诸侯，是宜若小其身，然今一往见诸侯，大则行道可以辅佐君为王，小则得行道而佐君为之霸。且记云：枉一尺而直其一寻，宜若可以为之也。尺，十寸为尺；寻，十丈为寻也。陈代欲孟子往见诸侯，故以此言问之。“孟子曰：昔齐景公田”至“何哉者”，孟子言往日齐国景公田猎，招聘其虞人，以旌旆招聘之，如有虞人不至者，则将杀戮之。虞人，掌山泽苑囿之吏也。然而志士守其义者，常念虽死无棺椁，但没在於沟壑之中而不恨也；勇义之士，念虽丧去其首，而且不顾也。孔子於此何取焉？盖孔子以取非其所招而能不往者也。如此则虞人不得其所招之礼，尚且守义，虽死而且不往应其招，如何为之君子且以不待所招聘而往见诸侯，是何为哉？盖先王制招聘之礼，旌所以招其大夫者。虞人之招，但以皮冠而已。今齐景公以旌招虞人，虞人守其职分，所以虽死而不往也。孟子引此，意以谓今之诸侯所以闻有能招己者，又非招己之所招而待之也，故我何往见之哉？所以不往见之也。“且夫枉尺而直寻者”至“亦可为与”，孟子又言，且夫子今以谓枉其尺而直其寻，以利言之而已。如以利为之，虽枉其寻，而但直其尺，而利亦可得而为之耳。孟子所以言之以此者，盖谓我苟志於利，虽枉寻而直尺，我亦为之况子以谓枉尺而直寻乎？本其我志於分义，不肯枉道以徇利，所以不欲屈己而求见於诸侯也，以其见之诸侯但为之徇利者矣，故虽枉尺而直寻不为也。“昔者赵简子使王良与嬖奚乘，终日而不获一禽，嬖奚反命曰：天下之贱工也”，孟子又引昔者晋卿赵简子尝使善御人王良与幸人奚乘而田，终日而不能得一禽，奚乃反命报於简子曰：王良，天下之贱工师也。“或以告王良，良曰：能复之”，或有人以嬖奚报简子之言为王良之贱，遂告王良。王良闻之，故请复与嬖奚乘而田。“强而後可”，王良强勉，嬖奚乃肯行。“一朝而获十禽，反命曰：天下之良工也”，言一日遂得十禽，嬖奚乃反命报於简子曰：王良乃天下之良善工师也，非贱者也。“简子曰：我使掌与女乘。谓王良，良不可”至“我不贯与小人乘，请辞”，赵简子言於嬖奚曰：我使王良与女乘。於是简子谓王良而使之，良乃不肯，遂言於简子曰：我为之法度之御，我与嬖奚驰驱而田，终一日而不能获其一禽，後为之诡而横射之，止一朝而以能获者十禽。且《诗·小雅·车攻》之篇有云：不失其驰驱之法，而所中者，应矢而死如破矣。此君子之所射也。我今不贯习与嬖奚小人同乘而畋也。故请辞之，不与掌乘。“御者且羞与射者比”至“未有能直人者也”，孟子引至此，乃自为之言曰：夫王良但为之御者，且尚能羞耻与嬖奚之射者比，并虽使王良与嬖奚比之，如得禽兽若丘陵之多，亦必不为之比矣。今子欲使我枉正道而从彼骄傲之诸侯而往见之，是何如哉？且子言此者，已失之过谬也，如枉己之正道者，未有能直其人者也，必自正己之道，然後可以直人矣。是亦杨子所谓“诎道而伸身，虽天下不可为也”同意。○注“招虞人以当皮冠”。○正义曰：经於《万章》篇云：“万章问孟子，招虞人何以？孟子曰：以皮冠”。是其文也。○注“赵简子晋卿”至“工师也”。正义曰：案《史记·世家》云：“赵景公率，赵鞅是为简子，为晋卿。晋出公十七年卒。”张华云：“简子家在临水界，冢上气成楼阁。”○注“《诗·小雅·车攻》之篇”。○正义曰：此篇盖言宣王复古也。笺云：不失其驰，舍矢如破，谓御者之良，得舒疾之中，射者之二矢，发则中，如锥破物也。○注“伯夷亦不屑就也”。○正义曰：此乃《公孙丑》篇末之文也。" }
      - { type: j, text: "景春曰：“公孙衍、张仪岂不诚大丈夫哉，一怒而诸侯惧，安居而天下熄。”" }
      - { type: z, text: "景春，孟子时人，为纵横之术者。公孙衍，魏人也，号为犀首，尝佩五国相印，为从长，秦王之孙，故曰公孙。张仪，合从者也，一怒则构诸侯，使强陵弱，故言惧也。安居不用辞说，则天下兵革熄也。" }
      - { type: j, text: "孟子曰：“是焉得为大丈夫乎？简子未学礼乎？丈夫之冠也，父命之；女子之嫁也，母命之。往送之门，戒之曰：‘往之女家，必敬必戒，无违夫、子。’以顺为正者，妾妇之道也。" }
      - { type: z, text: "孟子以礼言之，男子之道当以义匡君，女子则当婉顺从人耳。男子之冠，则命曰就尔成德。今此二子，从君顺指，行权合从，无辅弼之义，安得为大丈夫也。" }
      - { type: j, text: "居天下之广居，立天下之正位，行天下之大道，得志与民由之，不得志独行其道。富贵不能淫，贫贱不能移，威武不能屈，此之谓大丈夫。”" }
      - { type: z, text: "广居，谓天下也。正位，谓男子纯乾正阳之位也。大道，仁义之道也。得志行正，与民共之。不得志，隐居独善其身，守道不回也。淫，乱其心也；移，易其行也；屈，挫其志也：三者不惑，乃可以为之大丈夫矣。“景春曰”至“此之谓大丈夫”。○正义曰：此章指言以道匡君，非礼不运，称大丈夫；阿意用谋，善战务胜，事虽有刚，心归柔顺，故云妾妇，以况仪、衍者也。“景春曰：公孙衍、张仪岂不诚大丈夫哉，一怒而诸侯惧，安居而天下熄”，景春问孟子曰：公孙衍、张仪二者，岂不诚为大丈夫之人哉？夫二人一怒则诸侯惧之，以其能使强陵弱故也；安居处而不用辞说，则天下兵革於是乎熄灭。景春故以此，遂谓二人实为大丈夫。“孟子曰：是焉得为大丈夫乎，子未学礼乎”至“妾妇之道”，孟子答之景春曰：二人如此，安得为之大丈夫乎？子未尝学礼也？夫礼言丈夫之冠也，父则命之；女子之嫁也，母则命之。盖以冠者为丈夫之事，故父命之，以责其成人之道；嫁者女子之事，故母命之，以责其为妇之道也。以女子之临嫁，母则送之於门，而戒之女子曰：虽往女之家，必当敬其舅姑，亦必当戒慎以贞洁其己，无违遵敬夫、子。以其夫在，则得顺其夫，夫没则从其子，以顺从无违为正而已，固妾妇之道如此也。乃若夫之与子在所制，义固不可以从妇矣。苟为从妇，以顺为正，是焉得为大丈夫乎？孟子所以引此妾妇而言者，盖欲以此妾妇比之公孙衍、张仪也，以其二人非大丈夫耳。盖以二人为六国之乱，期合六国之君，希意导言，靡所不至。而当世之君，谗毁称誉，言无不听，喜怒可否，势无不行。虽一怒而诸侯惧，安居而天下熄，未免夫从人以顺为正者也，是则妾妇之道如此也，岂足为大丈夫乎？“居天下之广居，立天下之正位，行天下之大道”至“此之谓大丈夫”，孟子言能居仁道以为天下广大之居，立礼以为天下之正位，行义以为天下之大路，得志达而为仕，则与民共行乎此，不得志，则退隐独行此道而不回。虽使富贵，亦不足以淫其心；虽贫贱，亦不足以移易其行；虽威武而加之，亦不足屈挫其志：夫是乃得谓之大丈夫也。今且以公孙衍、张仪但能从人，而不知以此正其己，是则妾妇以顺为正之道，固不足以为大丈夫者焉。○注“景春”至“革熄也”。○正义曰：云景春，孟子时人，经传未详。公孙衍，魏人也，号为犀首，为秦王之孙，故曰公孙。案《史记》云：犀首者，魏之阴晋人也，名衍，姓公孙氏，与张仪不善。张仪之魏，魏王相张仪，犀首弗利，故令人谓韩公叔曰：张仪已合秦、魏矣，魏王所以欲贵张仪者，但欲得韩地，且韩之南阳已举矣，子何不少委焉以为衍功，则魏必图秦而弃仪。後相衍，张仪去，复相秦，卒。犀首入相秦，常佩五国之相印为从长。司马彪曰：犀首者，魏之官名，若今虎牙将军是也。张仪者，案《史家》本传云：张仪，魏人也，常事鬼谷先生，後相魏而卒。凡此是皆公孙衍、张仪之事矣。" }
      - { type: j, text: "周霄问曰：“古之君子仕乎？”" }
      - { type: z, text: "周霄，魏人也。问君子之道当仕否？" }
      - { type: j, text: "孟子曰：“仕。《传》曰：‘孔子三月无君，则皇皇如也，出疆必载质。’" }
      - { type: z, text: "质，臣所执以见君者也。三月，一时也。物变而不佐君化，故皇皇如有所求而不得尔。" }
      - { type: j, text: "公明仪曰：‘古之人三月无君则吊。’" }
      - { type: z, text: "公明仪，贤者也。言古人三月无君则吊，明当仕也。" }
      - { type: j, text: "“三月无君则吊，不以急乎？”" }
      - { type: z, text: "周霄怪乃吊於三月无君，何其急也。" }
      - { type: j, text: "曰：“士之失位也，犹诸侯之失国家也。《礼》曰：‘诸侯耕助，以供粢盛；夫人蚕缫，以为衣服。牺牲不成，粢盛不，衣服不备，不敢以祭。’‘惟士无田，则亦不祭。’牲杀、器皿、衣服不备，不敢以祭，则不敢以宴，亦不足吊乎？”" }
      - { type: z, text: "诸侯耕助者，躬耕劝率其民，收其藉助，以供粢盛。粢，稷，盛，稻也。夫人亲执蚕缫之事，以率女功。衣服，祭服；不成，不实肥盾也。惟，辞也。言惟诎禄之士无圭田者，不祭。牲必特杀，故曰杀。皿所以覆器者也。不祭则不宴，犹丧人也，不亦可吊乎。" }
      - { type: j, text: "“出疆必载质，何也？”" }
      - { type: z, text: "周霄问：出疆何为复载质？" }
      - { type: j, text: "曰：“士之仕也，犹农夫之耕也。农夫岂为出疆舍其耒耜哉！”" }
      - { type: z, text: "孟子言仕之为急，若农夫不可不耕。" }
      - { type: j, text: "曰：“晋国亦仕国也，未尝闻仕如此其急，仕，如此其急也。君子之难仕，何也？”" }
      - { type: z, text: "魏本晋也，周霄曰：我晋人也，亦仕，而不知其急若此，若此君子何为难仕？君子谓孟子，何为不急仕也？" }
      - { type: j, text: "曰：“丈夫生而愿为之有室，女子生而愿为之有家。父母之心，人皆有之。不待父母之命、媒妁之言，钻穴隙相窥，逾墙相从，则父母国人皆贱之。" }
      - { type: z, text: "言人不可触情从欲，须礼而行。" }
      - { type: j, text: "古之人未尝不欲仕也，又恶不由其道。不由其道而往者，与钻穴隙之类也。”" }
      - { type: z, text: "言古之人虽欲仕，如不由其正道，是与钻穴隙者何异。“周霄曰”至“钻穴隙之类也”。正义曰：此章指言君子务仕，思播其道，达义行仁，待礼而动，苟容干禄，逾墙之女，人之所贱，故弗为也。“周霄问曰：古之君子仕乎”，周霄问孟子曰：古之君子欲为仕乎否？“孟子曰：仕，《传》曰：三月无君，则皇皇如也，出疆必载质”者，此孟子答之，以为古之君子欲为仕也，传文有云：孔子三月不得佐其君，则心皇皇，如有所求而不得也，出其疆土，必载贽而行。贽者，如所谓三帛、二生、一死之贽也，臣所以执此而见君也。“公明仪曰：古之人三月无君则吊”，又引公明仪亦云古之人三月天时之一变，如不得佐其君，乃吊问之，明其欲仕也。“三月无君则吊，不以急乎”，周霄怪此言，复问之曰：三月无君，则吊问之，不以失之大急乎？“曰：士之失位也，犹诸侯之失国家也”至“亦不足吊乎”，孟子又答之曰：夫仕者欲行其道，若失其职位，则如诸侯之失其国家也，如此三月无君则吊，岂足谓之急欤？且《礼》有云：诸侯躬耕藉田，劝率其民，收其藉助以供给其粢盛稷稻；夫人乃亲养蚕缫丝以为之祭服。如牺牲不成肥盾，稷稻无以致，衣服又无以致备，则不敢以祭社稷宗庙。惟士之失位、无有田禄者则亦不祭，无他，以其牲杀器皿衣服不备，不敢以祭也。非特不敢祭，又且不敢以宴乐也。如此，是亦不足为吊之急矣。若公子重耳失其晋国，而且称丧人；孔子失鲁司寇之位，亦谓之丧；以至士大夫之去国，必为坛位，向国而哭，素衣素裳素冠彻缘，三月而复：盖亦此意也。然则士之三月无君则吊，尚何以为急乎？牲杀器皿，牲必杀，故曰杀；器皿，所以覆器者也。“出疆必载质，何也”，周霄又问孟子：士之出疆必载其质，是如之何？“曰：士之仕也，犹农夫之耕也。农夫岂为出疆舍其耒耜哉”，孟子答之曰：士之进於为仕也，若农夫之於耕也。夫农夫岂为出疆而耕，乃以舍去其耒耜哉？此十之为仕，所以出疆亦必执其贽也。“曰：晋国亦仕国也，未尝闻仕如此之急。仕，如此之急也，君子之难仕，何也”，周霄又问孟子曰：今之晋国亦可为仕之国也，然而未尝闻有仕者如此之急，又以仕既如此之急，然而君子之难进於仕，是如之何？故以并问之。“曰：丈夫生而愿为之有室，女子生而愿为之有家，父母之心，人皆有之”至“钻穴隙之类也”，孟子又答之曰：夫丈夫之生乃愿为之有室妇，女子之生乃愿为之有家而事之。其於欲慕为人子之父母心，人皆有之矣。然而欲为父母，其为室家，乃不待父母之命、媒妁而言之，遂私钻穴隙而相窥，逾墙而擅自相从，终虽得为父母，其於国中之众人，亦且皆贱之而不美矣。夫古之人未尝不欲为之仕也，然而又恶其不由其道而为之仕，所以君子难仕也。如不由其道而往为之仕者，是与此钻穴隙相窥而慕为人子之父母之类也。孟子所以终答之周霄以此者，以其士之仕，犹男女之相求，亦必待父母之命、媒妁之言也。○注“质臣所执以见君”至“不得尔”。○正义曰：盖质之为言至也，自五玉三帛二生一死，皆所以为质，以见其君，与自相质同也。" }
      - { type: j, text: "彭更问曰：“後车数十乘，从者数百人，以传食於诸侯，不以泰乎？”" }
      - { type: z, text: "泰，甚也。彭更，孟子弟子，怪孟子徒众多，而传食於诸侯之国，得无为甚奢泰者也？" }
      - { type: j, text: "孟子曰：“非其道，则一箪食不可受於人。如其道，则舜受尧之天下，不以为泰。子以为泰乎？”" }
      - { type: z, text: "箪，笥也。非以其道，一笥之食不可受也。子以舜受尧之天下为泰乎？" }
      - { type: j, text: "曰：“否！士无事而食，不可也。”" }
      - { type: z, text: "彭更曰：不以舜为泰也。谓仕无功而虚食人者，不可也。" }
      - { type: j, text: "曰：“子不通功易事，以羡补不足，则农有馀粟，女有馀布。子如通之，则梓、匠、轮、舆，皆得食於子。" }
      - { type: z, text: "孟子言凡人当通功易事，乃可各以奉其用。梓、匠，木工也。轮人、舆人，作车者也。交易则得食於子之所有矣。《周礼》攻木之工七，梓、匠、轮、舆，是其四者。羡，馀也。" }
      - { type: j, text: "於此有人焉，入则孝，出则悌，守先王之道，以待後之学者，而不得食於子。子何尊梓、匠、轮、舆而轻为仁义者哉？”" }
      - { type: z, text: "入则事亲孝，出则敬长顺也。悌，顺也。守先王之道，上德之士，可以化俗者。若此不得食子之禄，子何尊彼而贱此也。" }
      - { type: j, text: "曰：“梓、匠、轮、舆，其志将以求食也。君子之为道也，其志亦将以求食与？”" }
      - { type: z, text: "彭更以为彼志於食，此亦但志食也？" }
      - { type: j, text: "曰：“子何以其志为哉？其有功於子，可食而食之矣。且子食志乎，食功乎？”" }
      - { type: z, text: "孟子言禄以食功，子何食乎？" }
      - { type: j, text: "曰：“食志。”" }
      - { type: z, text: "彭更以为当食志也。" }
      - { type: j, text: "曰：“有人於此，毁瓦画墁，其志将以求食也，则子食之乎？”" }
      - { type: z, text: "孟子言人但破碎瓦画地，则复墁灭之，此无用之为也，然而其志反欲求食，则可食乎？" }
      - { type: j, text: "曰：“否。”" }
      - { type: z, text: "彭更曰不食也。" }
      - { type: j, text: "曰：“然则子非食志也，食功也。”" }
      - { type: z, text: "孟子曰：如是，则子果食功也，非食其志也。“彭更问曰”至“食功也”。○正义曰：此章指言百工食力，以禄养贤，修仁尚义，国之所尊，移风易俗，其功可珍，虽食诸侯，不为素餐。“彭更问曰：後车数十乘，从者数百人，以传食於诸侯，不以泰乎”，彭更，孟子弟子，问孟子，以谓车有数十乘之多，从徒又有数百人之众，皆以传食於诸侯，不以为泰甚乎？传食，盖以孟子食於诸侯，车徒又食於孟子，要之所食之禄皆出於诸侯之所供耳，故云传食诸侯。孟子曰：非其道，则一箪食不可受於人；如其道，则若舜受尧之天下，不以为之泰，子今以车徒传食於诸侯为之泰。以其不足为泰也。“曰：否，士无事而食，不可也”，彭更又曰否，不以舜为泰而言也。盖以士之无功事於诸侯，固不可虚食於诸侯也。“曰：子不通功易事，以羡补不足”至“皆食於子”，孟子又答之曰：今且以子言之，如子不通功易事而相济，以有馀而补其不足，则农夫有馀粟而人有受其饥，女有馀布而人有受其寒。子如通功易事，乃可以各奉其事业，则梓人成其器械以利用，匠人营其宫室以安居，轮人作车轮以运行，舆人作车舆以利载，是皆得食於子矣。事与功者，盖所作未成，则谓之事；事之成，则谓之功。孟子所以言之者，盖谓梓、匠、轮、舆皆小人之功也，如得以通功易事，而皆得食於子，况有君子之功，功於道者，而乃不得传食之於诸侯乎？故以下文言之。“於此有人焉，入则孝，出则悌，守先王之道，以待後之学者，而不得食於子，子何尊梓、匠、轮、舆而轻为仁义者哉”，孟子又言：今有人焉，入於闺门之内，则以孝为仁；出於乡党邦国之间，以悌为义；是守先王仁义之道，以待觉於後之学者：是有功於道者也，而乃不得食於子，是则子何独尊於梓、匠、轮、舆小人之功，而以轻为仁义有功於道者哉？“曰：梓、匠、轮、舆，其志将以求食。君子之为道也，其志亦将以求食欤”，彭更又以此言於孟子，曰彼梓、匠、轮、舆者，是其有志将以此业而求食者也，今以君子之为於道，其志亦将以为道而求食欤？彭更之意，以谓士志於道，不志於食，故以此疑，乃问孟子也。“曰：子何以志为哉，其有功於子，可食而食之矣”，然以子言之，则子今有食於人者，是则食其有志於为食者，乎，是则食其有功者乎？“曰：食志”，彭更又答之，以为有食则食其有志於求食者矣。“曰：有人於此，毁瓦画墁，其志将以求食也，则子食之乎”，孟子又欲排之，故以此喻之。言今有人於此，但以毁破碎之瓦而画地，又复墁灭之，是其志将以此求其食也，则子食之乎？“曰：否”，彭更以为如此者不食之也。“曰：然则子非食志也，食功也”，孟子乃言之曰：如是则子非食其有志於求食者也，是则食其有功者也。以其毁瓦画墁，但有志而无功者，而彭更不食之，是则知彭更是亦食於有功者矣。然则孟子志非欲传食於诸侯，而诸侯所以食之者，亦以孟子有功而已矣。○注“《周礼》攻木之工”。○正义曰：此盖《梁惠王》下卷说之矣。" }
      - { type: j, text: "万章问曰：“宋，小国也，今将行王政，齐、楚恶而伐之，则如之何？”" }
      - { type: z, text: "问：宋当如齐、楚何也？" }
      - { type: j, text: "孟子曰：“汤居亳，与葛为邻。葛伯放而不祀，汤使人问之，曰：‘何为不祀？’曰：‘无以供牺牲也。’汤使遗之牛羊，葛伯食之，又不以祀。" }
      - { type: z, text: "葛，夏诸侯，嬴姓之国。放纵无道，不祀先祖。" }
      - { type: j, text: "汤又使人问之曰：‘何为不祀？’曰：‘无以供粢盛也。’汤使亳众往为之耕，老弱馈食。葛伯率其民，要其有酒食黍稻者夺之，不授者杀之。有童子以黍肉饷，杀而夺之。《书》曰：‘葛伯仇饷。’此之谓也。" }
      - { type: z, text: "童子，未成人，杀之尢无状。《书》，《尚书》逸篇文。仇，怨也。言汤伐葛伯，怨其害此饷也。" }
      - { type: j, text: "为其杀是童子而征之，四海之内皆曰：‘非富天下也，为匹夫匹妇复雠也。’" }
      - { type: z, text: "四海之民皆曰：汤不贪天下富也，为一夫报仇也。" }
      - { type: j, text: "汤始征，自葛载，十一征而无敌於天下。东面而征，西夷怨；南面而征，北狄怨。曰：‘奚为後我？’民之望之，若大旱之望雨也。归市者弗止，芸者不变，诛其君，吊其民，如时雨降，民大悦。《书》曰：‘我后，后来其无罚！’" }
      - { type: z, text: "载，始也。言汤初征自葛始也，十一征而服天下。一说言当作“再”字，再十一征，而言汤再征十一国。再十一，凡征二十二国也。《书》，逸篇也。民曰：待我君来，我则无罚矣。归市不止，不以有军来征故市者止不行也。不使芸者变休也。" }
      - { type: j, text: "‘有攸不惟臣，东征，绥厥士女，匪厥玄黄，绍我周王见休，惟臣附于大邑周。’其君子实玄黄于匪，以迎其君子；其小人箪食壶浆，以迎其小人。救民於水火之中，取其残而已矣。" }
      - { type: z, text: "从“有攸”以下，道周武王伐纣时也，皆《尚书》逸篇之文也。攸，所也。言武王东征，安天下士女，小人各有所执往，无不惟念执臣子之节。匪厥玄黄，谓诸侯执三二之帛，愿见周王，望见休善，使我得附就大邑周家也。其君子小人，各有所执，以迎其类也。言武王之师，救殷民於水火之中，讨其残贼也。" }
      - { type: j, text: "《太誓》曰：‘我武惟扬，侵于之疆，则取于残，杀伐用张，于汤有光。’" }
      - { type: z, text: "《太誓》，古《尚书》百二十篇之时《泰誓》也。我武王用武之时，惟鹰扬也。侵纣之疆，侵纣之疆界，则取于残贼者，以张杀伐之功也。民有箪食壶浆之欢，比於汤伐桀，为有光宠，美武王德优前代也。今之《尚书·泰誓》篇，後得以充学，故不与古《太誓》同。诸传记引《泰誓》皆古《泰誓》也。" }
      - { type: j, text: "不行王政云尔；苟行王政，四海之内皆举首而望之，欲以为君，齐、楚虽大，何畏焉？”" }
      - { type: z, text: "万章忧宋迫於齐、楚不得行政，故孟子为陈殷汤周武之事以喻之。诚能行之，天下思以为君，何畏齐、楚之国焉。“万章问曰”至“齐楚虽大何畏焉”。○正义曰：此章指言修德无小，暴慢无强，是故夏商之末，民思汤武，虽欲不王，末由也已。“万章问曰：宋，小国也，今将行王政，齐、楚恶而伐之，则如之何”，万章问孟子，言宋国小国也，今将欲行王者之政，齐、楚大国恶其行之而欲伐之，则宋国当如之何而处之。“孟子曰：汤居亳，与葛为邻。葛伯放而不祀，汤使人问之曰：何为不祀”至“此之谓也”，孟子答之曰：汤王居亳地，与葛国为邻，葛国之伯放纵无道，而不祀先祖。汤王使人问之葛伯，何为而不祀先祖？乃答之曰：无以供其牺牲也。牲之色纯无杂色，谓之牺牲。汤乃使人遗赐之牛羊，葛伯既受之牛羊，又自食之而不祀先祖。汤又使人问葛伯，何为而又不祀？葛伯又曰：又无以供其粢盛也。汤复使亳之众往为葛伯耕作，以助其粢盛。有老弱者，馈耕者之食，葛伯又率己之民於路，要其有酒食黍稻者夺而食之，有不授与之者乃杀之，有童子以黍肉饭饷其耕者，葛伯率民杀其子而夺其黍肉，故《书》有云葛伯仇怨其有所饷者，故害之。是此之谓也。“为其杀是童子而征之，四海之内皆曰：非富天下也，为匹夫匹妇复雠也”，孟子又言，为其葛伯杀此童子，而汤乃往而征伐之，四海之内人皆曰：汤王非贪富於天下而征葛也，是为天下一匹之夫、一匹之妇复报其雠也。“汤始征，自葛载”至“后来其无罚”者，言汤王初征，自葛国始也。汤之十一征而天下无敢敌者，故东面而征其君，则西夷之国怨之，以为不先征其我君之罪；南面而征其君，则北夷之国怨之，以为不征其我君之罪而先於彼：故怨云何为而後去其我？民之望其汤之来，若大旱之时人望其云霓而雨之降也。遂使归市者得奔趋而贸易，芸苗者亦得芸而不为之休，亦以汤即诛其君之有罪者，而又能吊问存恤其人民，故如时雨之降，民皆大喜悦之。《书》云：民待我君之来，言我君之来，则我无诛罚矣。一说云十一征当作再字，再十一征者，言汤再征十一国，再十一，凡征二十二国也。“有攸不惟臣”至“取其残而已矣”，此皆逸《书》之文也，言殷之民有所征之，则无不惟念臣服之节，故武王东征而绥抚其士女，则为之士女皆以箱匪盛其玄黄之帛，以昭明我之周王见休美，惟臣皆得就附于大邑周家也。故其君子实则玄黄之帛，以迎其君子，小人箪食壶浆以迎其小人，是各从其类也。武王之师众中有君子、有小人，故商民有君子、有小人迎之者也。言武王所拯救殷民於水火之中，独取伐其残贼其民者也。今据《书》乃曰“昭我周王”，而此乃曰“绍我周王”，盖绍者继也，民皆以玄黄之帛盛於匪，而随武王之师後而继送之也。盖周王者，即武王也。然必以玄黄於匪者，盖天谓之玄，地谓之黄，武王能革殷之否而泰之，是能如天地以覆载以养民者也。必言士女者，以其武王所绥，不特匹夫匹妇而已，虽未冠之士，未笄之女，亦且绥之，故曰“绥厥士女”。“《太誓》曰：我武惟扬，侵于之疆，则取于残，杀伐用张，于汤有光”，此古之《太誓》篇之文也。言《太誓》有云：我武王用武之时，惟鹰扬也；侵于纣之疆界，则取于残贼者；於是杀伐之功用张行之，故比于汤王伐桀之时，又有以光于前代也。“不行王政云尔，苟行王政”至“齐，楚虽大，何畏焉”，孟子於此乃曰：今宋国不行王者之政，故云齐、楚恶而伐之尔，如宋国苟能行其王者之政，则四海之内，人皆举首引领而望之，欲以为之君也，齐、楚二国虽大，然何畏之有？○注“葛，夏诸侯，嬴姓之国”。○正义曰：案《地理志》云：葛，今梁国宁陵有葛乡，裴る亦引之而证《史记》亳都亦在梁国，故云为邻。《书》曰：汤征诸侯，葛伯不祀，汤始征之。孔安国云：葛国，伯爵也，废其土地山川及宗庙神皆不祀，汤始伐之。言伐始於葛也，《书》於是乎作《汤征》。今《尚书·仲虺之诰》曰：“乃葛伯仇饷，初征自葛。东征西夷怨，南征北狄怨，曰：奚独後予。”《孔传》云：“葛伯游行，见农民之饷於田者，杀其人，夺其饷，故谓之仇饷。仇，怨也。汤为是以不祀之罪伐之，从此後遂征无道。西夷、北狄，举远以言，则近者著矣。曰奚独後予者，盖怨者之辞也。”○注“从有攸下”至“残贼也”。○正义曰：云“匪厥玄黄，谓诸侯执玄三二之帛”者，《礼》云：“诸侯世子执，公之孤执玄，附庸之君执黄”，是帛也。郑司农云：“三染谓之。”此亦《周礼·锺氏》有三入为故也。" }
      - { type: j, text: "孟子谓戴不胜曰：“子欲子之王之善与？我明告子。" }
      - { type: z, text: "不胜，宋臣。" }
      - { type: j, text: "有楚大夫於此，欲其子之齐语也，则使齐人傅诸？使楚人傅诸？”" }
      - { type: z, text: "孟子假喻有楚大夫在此，欲变其子使学齐言，当使齐人傅之邪，使楚人自傅相之邪？" }
      - { type: j, text: "曰：“使齐人傅之。”" }
      - { type: z, text: "不胜曰：使齐人。" }
      - { type: j, text: "曰：“一齐人傅之，众楚人咻之，虽日挞而求其齐也，不可得矣。引而置之庄岳之间数年，虽日挞而求其楚，亦不可得矣。" }
      - { type: z, text: "言使一齐人傅相，众楚人咻之。咻之者，也。如此虽日挞之欲使齐言，不可得矣。言寡不胜众也。庄岳，齐街里名也。多人处之数年，而自齐也。" }
      - { type: j, text: "子谓薛居州善士也，使之居於王所。在於王所者，长幼卑尊皆薛居州也，王谁与为不善？" }
      - { type: z, text: "孟子曰：不胜常言居州，宋之善士也，欲使居於王所。如使在王所者，小大皆如居州，则王谁与为不善者也。" }
      - { type: j, text: "在王所者，长幼卑尊皆非薛居州也，王谁与为善？一薛居州，独如宋王何！”" }
      - { type: z, text: "如使在王左右者，皆非居州之畴，王当谁与为善乎？一薛居州，独如宋王何而能化之也。周之末世，列国皆僭号自称王，故曰宋王也。“孟子谓戴不胜”至“如宋王何”。○正义曰：此章指言自非圣人，在所变化，故谚曰：“白沙在泥，不染自黑。蓬生麻中，不扶自直。”言辅之者众也。“孟子谓戴不胜曰”至“亦不可得矣”，不胜，宋王之臣也，姓戴，名不胜。孟子谓之曰：子今欲子之宋王为善欤？我今明言而告子，且假喻今有楚国之大夫於此，欲使其子学齐人之言，则当使齐人傅诸，使楚人傅诸？“曰：使齐人傅之”，不胜答之，以为当使齐人傅相之。孟子又言，如使一齐人傅相其子之言，而众楚人皆咻之，虽日加鞭挞其子而求为齐言也，不可得已。如引其子置之闾巷之间，数年之久，虽日加鞭挞而求其子为楚言，亦不可得已。“子谓薛居州善士也”至“如宋王何”，孟子又言今不胜谓薛居州善士者也，使之居於宋王之所，如在宋王之所者，长幼卑尊皆如薛居州善士者也，则宋王谁与为不善也？如在宋王之左右，长幼卑尊皆非薛居州之善者也，则宋王谁能与为善？今以一薛居州独佐於宋王为善，其能如宋王何？无他，以其一人之寡不能胜其众也，故孟子所以齐人、楚人而比喻之也。薛居州，宋国之善士者也。" }
      - { type: j, text: "公孙丑问曰：“不见诸侯，何义？”" }
      - { type: z, text: "丑怪孟子不肯每辄应诸侯之聘，不见之，於义谓何也。" }
      - { type: j, text: "孟子曰：“古者不为臣不见。" }
      - { type: z, text: "古者不为臣不肯见，不义而富且贵者也。" }
      - { type: j, text: "段干木逾垣而辟之，泄柳闭门而不内，是皆已甚。迫，斯可以见矣。" }
      - { type: z, text: "孟子言魏文侯、鲁缪公有好善之心，而此二人距之太甚。迫窄，则可以见之。" }
      - { type: j, text: "阳货欲见孔子，而恶无礼。大夫有赐於士，不得受於其家，则往拜其门。" }
      - { type: z, text: "阳货，鲁大夫也。孔子，士也。" }
      - { type: j, text: "阳货瞰孔子之亡也，而馈孔子蒸豚。孔子亦瞰其亡也而往拜之。当是时，阳货先，岂得不见？" }
      - { type: z, text: "瞰，视也。阳货视孔子亡而馈之者，欲使孔子来答，恐其便答拜使人也。孔子瞰其亡者，心不欲见阳货也。《论语》曰“馈孔子豚”，孟子曰“蒸豚”，豚非大牲，故用熟馈也。是时阳货先加礼，岂得不往拜见之哉。" }
      - { type: j, text: "曾子曰：‘胁肩谄笑，病于夏畦。’" }
      - { type: z, text: "胁肩，竦体也。谄笑，强笑也。病，极也。言其意苦劳极，甚於仲夏之月治畦灌园之勤也。" }
      - { type: j, text: "子路曰：‘未同而言，观其色赧赧然，非由之所知也。’" }
      - { type: z, text: "未同，志未合也。不可与言而与之言，谓之失言也。观其色赧赧然，面赤，心不正之貌也。由，子路名，子路刚直，故曰非由所知也。" }
      - { type: j, text: "由是观之，则君子之所养，可知已矣。”" }
      - { type: z, text: "孟子言：由是观曾子、子路之言，以观君子之所养志可知矣。谓君子养正气，不以入邪也。“公孙丑问曰”至“可知已矣”。○正义曰：此章指言道异不谋，迫斯强之段、泄已甚，瞰亡得宜，正己直行，不纳於邪，赧然不接，伤若夏畦也。“公孙问曰：不见诸侯，何义”，丑怪孟子不见诸侯，故问之曰：不见诸侯，其义谓何也？“孟子曰：古者不为臣不见”至“可知已矣”，孟子答之公孙丑，言古之不为臣者不肯见，不义而饕富贵者也。如段干木逾垣墙而避魏文侯於外，泄柳闭门而拒鲁缪公於内，然皆不见之者，是皆文侯、缪公而就见已甚，迫切斯可以见矣，然干木、泄柳且不见之耳。阳货欲愿见於孔子，而畏孔子恶己之无礼而不见之。意已谓己为大夫而有遗赐，孔子但为之士，彼不得受其遗赐於其家，则必往谢己门，故阳货视孔子不在，遂馈送孔子蒸豚之礼。然而孔子至後亦以视阳货不在，乃往其门而拜谢之。故当是之时，阳货岂先不得见孔子？以其不合视孔子不在，乃馈蒸豚，孔子所以不欲见，亦复其亡而往谢之也。蒸豚，熟豚也。曾子又有云胁肩谄笑，竦缩其身，强容而笑者，其劳苦有甚於夏之五六月而灌园也。治畦曰灌园也。子路有云未合其志，而与之言，观其色赧赧然，面赤而心不正者，非我之所知也。由，子路自称名也。孟子曰：由此数者观之，则君子之所养以义，可得而知矣。盖就此数者论之，孟子必答孙丑以此者，则孟子不见诸侯是亦分也、义也。孙丑乃不知之，奈之何哉？今且以孟子不见诸侯，必以段干、泄柳为言者，盖谓魏文、鲁缪二君欲见此二子如此之迫切，而二子尚不见之，而况己往见诸侯哉？必以阳货为言者，盖谓孔子不见阳货者，乃阳货自取之尔。今己之不见诸侯者，亦以诸侯不礼於我矣。必以曾子所谓而言者，盖谓己如往见诸侯，亦是胁肩谄笑者也。必以子路所谓而言者，盖谓己如就见诸侯，亦是未同而观其色赧赧然之人也。此孟子所以执此而喻其意於公孙丑也。《说文》云：“畦，菜畦也”，是知即园也。○注“《论语》曰馈孔子豚”。○正义曰：案孔安国《传》云：阳货欲使孔子往谢，故遗孔子豚。阳货，阳虎也，名虎，字货，为季氏家臣，而专鲁国之政，欲见孔子，将使之仕也。豚，豕之小者。故《论语》於《阳货》篇云：“阳货欲见孔子，孔子不见，归孔子豚。孔子时其亡也，而往拜之，遇诸涂。谓孔子曰：‘来，予与尔言。’曰：‘怀宝而迷邦，可谓仁乎？’‘好从事而亟失时，可谓知乎。’曰：‘不可，日月逝矣，岁不我与。’孔子曰：‘诺，吾将仕矣。’凡此是其事也。○注“子路刚直”。正义曰：案《孔子弟子列传》云：“子路性鄙，好勇力，志伉直。”是为刚直也，後死於卫。" }
      - { type: j, text: "戴盈之曰：“什一，去关市之征，今兹未能，请轻之，以待来年然後已，何如？”" }
      - { type: z, text: "戴盈之，宋大夫。问孟子，欲使君去关市征税，复古行什一之赋，今年未能尽去，且使轻之，待来年然後复古，何如？" }
      - { type: j, text: "孟子曰：“今有人日攘其邻之鸡者，或告之曰：‘是非君子之道。’曰：‘请损之，月攘一鸡，以待来年然後已。’如知其非义，斯速已矣，何待来年？”" }
      - { type: z, text: "攘，取也，取自来之物也。孟子以此为喻知攘之恶当即止，何可损少，月取一鸡，待来年乃止乎？谓盈之之言若此类者也。“戴盈之曰”至“何待来年”。○正义曰：此章指言从善改非，坐而待旦，知而为之，罪重於故，譬犹攘鸡，多少同盗，变恶自新，速然後可也。“戴盈之曰：什一，去关市之征，今兹未能，请轻之，以待来年”，戴盈之即戴不胜，字盈之也，为宋国之大夫，问於孟子曰：欲使宋君去关市之征税，今年未能尽去，且使轻取之，以待来年然後尽去之，如之何？“孟子曰：今有人日攘其邻之鸡”至“何待来年”，孟子以此比喻之，以答盈之之言非也。言今有人日口攘取其邻家之鸡者，或有人告之曰：此攘鸡乃小人盗贼之道，非君子大公至正之道也。乃曰：请损之，但月攘一鸡，以待来年，然後止而勿攘。今子如知宋君取关市之税为非义，若此攘鸡之非道，斯可速而止之耳，何可待来年然後已乎？此孟子所以告之是耳。" }
      - { type: j, text: "公都子曰：“外人皆称夫子好辩，敢问何也？”" }
      - { type: z, text: "公都子，孟子弟子。外人，他人论议者也。好辩，言孟子好与杨、墨之徒辩争。" }
      - { type: j, text: "孟子曰：“予岂好辩哉，予不得已也。" }
      - { type: z, text: "曰：我不得已耳，欲救正道，惧为邪说所乱，故辩之也。" }
      - { type: j, text: "天下之生久矣，一治一乱。当尧之时，水逆行，泛滥於中国，蛇龙居之，民无所定，下者为巢，上者为营窟。" }
      - { type: z, text: "天下之生，生民以来也，迭有治乱，非一世。水生蛇龙，水盛则蛇龙居民之地也。民患水，避之，故无定居。埤下者於树上为巢，犹鸟之巢也。上者，高原之上也。凿岸而营度之，以为窟穴而处之。" }
      - { type: j, text: "《书》曰：‘洚水警余。’洚水者，洪水也。" }
      - { type: z, text: "《尚书》逸篇也。水逆行，洚洞无涯，故曰洚水也。洪，大也。" }
      - { type: j, text: "使禹治之，禹掘地而注之海，驱蛇龙而放之菹。水由地中行，江、淮、河、汉是也。险阻既远，鸟兽之害人者消，然後人得平土而居之。" }
      - { type: z, text: "尧使禹治洪水，通九州，故曰掘地而注之海也。菹，泽生草者也，今青州谓泽有草为菹。水流行於地而去也，民人下、高就平土，故远险阻也，水去，故鸟兽害人者消尽也。" }
      - { type: j, text: "尧、舜既没，圣人之道衰，暴君代作。坏宫室以为污池，民无所安息；弃田以为园囿，使民不得衣食；邪说暴行又作。园囿污池，沛泽多而禽兽至。" }
      - { type: z, text: "暴，乱也。乱君更兴，残坏民室屋，以其处为污池；弃五之田，以为园囿长逸游而弃本业，使民不得衣食，有饥寒并至之厄；其小人则放辟邪侈，故作邪伪之说，为奸寇之行。沛，草木之所生也。泽，水也。至，众也。田畴不垦，故禽兽众多。谓羿、桀之时也。" }
      - { type: j, text: "及纣之身，天下又大乱。周公相武王，诛纣伐奄，三年讨其君，驱飞廉於海隅而戮之；灭国者五十；驱虎豹犀象而远之：天下大悦。" }
      - { type: z, text: "奄，东方无道国。武王伐纣，至于孟津还归，二年复伐，前後三年也。飞廉，纣谀臣，驱之海隅而戮之，犹舜放四罪也。灭与纣共为乱政者五十国也。奄，大国，故特伐之。《尚书·多方》曰：“王来自奄。”" }
      - { type: j, text: "《书》曰：‘丕显哉！文王谟。丕承哉！武王烈。佑启我後人，咸以正无缺。’" }
      - { type: z, text: "《书》，《尚书》逸篇也。丕，大。显，明。承，缵。烈，光也。言文王大显明王道，武王大缵承天光烈，佑开後人，谓成康皆行正道无亏缺也，此周公辅相以拨乱之功也。" }
      - { type: j, text: "世衰道微，邪说暴行有作，臣弑其君者有之，子弑其父者有之，孔子惧，作《春秋》。《春秋》，天子之事也。是故孔子曰：‘知我者其惟《春秋》乎！罪我者其惟《春秋》乎！’" }
      - { type: z, text: "世衰道微，周衰之时也。孔子惧正道遂灭，故作《春秋》，因鲁史记，设素王之法，谓天子之事也。知我者谓我正纲纪也，罪我者谓时人见弹贬者。言孔子以《春秋》拨乱也。" }
      - { type: j, text: "圣王不作，诸侯放恣，处士横议，杨朱、墨翟之言盈天下，天下之言，不归杨则归墨。杨氏为我，是无君也。墨氏兼爱，是无父也。无父无君，是禽兽也。" }
      - { type: z, text: "言孔子之後，圣王之道不兴，战国纵横，布衣处士游说以干诸侯，若杨墨之徒，无尊异君父之义，而以攒议於世也。" }
      - { type: j, text: "公明仪曰：‘庖有肥肉，厩有肥马，民有饥色，野有饿莩，此率兽而食人也。’" }
      - { type: z, text: "公明仪，鲁贤人。言人君但崇庖厨，养犬马，不恤民，是为率禽兽而食人也。" }
      - { type: j, text: "杨、墨之道不息，孔子之道不著，是邪说诬民，充塞仁义也。仁义充塞，则率兽食人，人将相食。" }
      - { type: z, text: "言仁义塞则邪说行，兽食人则人相食，此乱之甚也。" }
      - { type: j, text: "吾为此惧，闲先圣之道，距杨墨，放淫辞，邪说者不得作。" }
      - { type: z, text: "闲，习也。淫，放也。孟子言我惧圣人之道不著，为邪说所乘，故习圣人之道以距之。" }
      - { type: j, text: "作於其心，害於其事；作於其事，害於其政。圣人复起，不易吾言矣。" }
      - { type: z, text: "说与上篇同。" }
      - { type: j, text: "昔者禹抑洪水而天下平，周公兼夷狄、驱猛兽而百姓宁，孔子成《春秋》而乱臣贼子惧。" }
      - { type: z, text: "抑，治也。周公兼怀夷狄之人，驱害人之猛兽也。言乱臣贼子惧，《春秋》之贬责也。" }
      - { type: j, text: "《诗》云：‘戎狄是膺，荆舒是惩，则莫我敢承。’" }
      - { type: z, text: "此诗已见上篇说。" }
      - { type: j, text: "无父无君，是周公所膺也。" }
      - { type: z, text: "是周公所欲伐击也。" }
      - { type: j, text: "我亦欲正人心，息邪说，距讠皮行，放淫辞，以承三圣者，岂好辩哉？予不得已也。" }
      - { type: z, text: "孟子言我亦欲正人心，距讠皮行，以奉禹、周公、孔子也。不得已而与人辩耳，岂好之哉？" }
      - { type: j, text: "能言距杨、墨者，圣人之徒也。”" }
      - { type: z, text: "孟子自谓能距杨、墨也。徒，党也。可以继圣人之道，谓名世者也，故曰圣人之徒也。“孟子曰：予岂好辩哉”至“圣人之徒也”。○正义曰：此章指言忧世拨乱，勤以济之，义以匡之，是故禹、稷骈踬，周公仰思，仲尼皇皇，墨突不及污，圣贤若此，岂不得辩也。公都子问孟子曰：外人皆称夫子好与杨、墨之徒争辩，敢问是何如？“孟子曰：予岂好辩哉，予不得已也”，孟子答之曰：我岂好与彼争辩之哉，但欲正人心，不得已而用辩之也。“天下之生久矣，一治一乱”至“上者为营窟”，孟子言天下之生民以来，至于今以久矣，其间一治一乱甚多。当尧之时，水逆势而流行，泛滥浊於中国，蛇龙由是居处於其间，民亦无所安其居处，以至居於埤下者，乃於树上为巢，如鸟之居於巢也；居於高原之上者，乃凿为穴窟而处之。“《书》曰：洚水警余。洚水，洪水也。使禹治之，禹掘地而注之海”至“然後人得平土而居之”，言《尚书》逸篇之文。云洚水警惧我，此盖舜言，故称余。余，我也。孟子引之，故自解之洚水，言洚水则洪大之水也。故舜使禹治其洪水，禹乃掘也，因其势顺而流注之海；又驱遣蛇龙而放之菹。菹，泽生草之所也。於是水从地中流行，故不泛逆，所谓导江导淮导河导入汉之水，是禹之治也。危险艰阻既以远去，而无泛滥之患，鸟兽之害於人者遂消灭，然後人皆得平坦之地而居之。所谓水逆行，泛滥於中国，蛇龙居之，为巢、营窟之难，於是免矣。“尧舜既没，圣人之道衰”至“及纣之身”，又至“咸以正无缺”者，孟子言自尧舜既没之後，圣人所行之道衰微，暴虐之君更兴，乃毁坏民之宫室以为之污池，而民皆无所安居休息；又弃五之田以为之园囿，而恣游傲，乃使民不得衣食，於是民有饥寒。其小人皆放辟邪侈，作邪伪之说，为奸寇之行。又作园囿污池，於是草木沛泽茂盛，而禽兽至众。及纣之世，又为大乱，周公乃辅相武王，诛伐其纣，又伐奄国，终始三年，讨戮残贼之君，乃驱逐飞廉谀臣於海隅之地而戮杀之，遂灭与纣共为乱之国者有五十国，然後驱遣其虎豹犀象之野兽而远去之。天下之人，已皆大悦，而归武王。《书》所谓“丕显哉，文王谟，丕承哉，武王烈，佑启我後人，咸以正无缺”，是斯之谓欤。盖言大明文王创始之谋谟，大缵集武王之功烈，佑开後人皆以正道行之，故无亏缺也。後人是谓成王、康王在後者也。“世衰道微，邪说暴行”至“其惟《春秋》乎”，孟子又言至周世之道衰於是微灭，邪说暴行之人又有起作，於是臣弑其君者有之，子弑其父者有之，惟孔子於此时乃恐惧正道遂灭，而害人正心，故因鲁史记而作《春秋》之经。盖《春秋》者，乃设素王之道，皆天子之事迹也。孔子云：知我正王纲者，其惟以《春秋》知我矣；罪我以谓迷乱天下者，其亦惟以《春秋》罪我矣。“圣王不作，诸侯放恣”至“是禽兽也”，孟子又言自孔子之後，圣王无有兴作於其间，诸侯乃放恣为乱，布衣之处士乃横议而游说於诸侯，於是杨朱、墨翟偏蔽之言盈满於天下。天下之言者，不归从杨朱之为己，则归从墨翟之兼爱。以其为己之言行，是使天下无其君也；兼爱之言行，是使天下无其父也：无父无君，是禽兽之类也，非人也。“公明仪曰”至“率兽而食人也”。孟子又引昔公明仪有云：君之庖厨乃多有其肥肉，栈厩之中多养其肥马，而下民以有饥饿之颜色，郊野之间以有饿死之莩者，如此是国君率兽而食人也。“杨、墨之道不息，孔子之道不著”至“吾为此惧”，又至“吾言矣”，孟子又言杨、墨自为、兼爱之道不熄灭，则孔子之正道不著明，是邪说欺诬其民，而充溢掩其仁义之道也。仁义既以邪说充塞而掩之，则不特率兽食人，而人亦将自相食也。孟子故言我为此恐惧，乃欲防闲，卫其先圣之正道，而排斥拒其杨、模放逐其淫辞，使邪说者不得兴作於其间。所谓作於其心，害於其事，作於其事，害於其政，圣人复起，必从吾言矣，此盖说在上篇，此更不说。“昔者禹抑洪水而天下平，周公兼夷狄、驱猛兽而百姓宁，孔子作《春秋》而乱臣贼子惧”，此皆孟子言至於此，又复自尧至於孔子再详总说之也。言往者自舜使禹抑治其水，而天下於是乎得平安；至周公相武王，兼征夷狄，驱逐暴兽，而人民於是乎得宁静；以至孔子作成《春秋》，而褒贬著，而乱臣贼子於是乎恐惧之。“《诗》云：戎狄是膺，荆舒是惩，则莫我敢承”，说在上篇详矣。孟子言如是则无父无君者，是周公所欲膺击而伐之也，我今亦欲正其人心，息灭其邪说，距止其险陂之行，放逐其淫辞，以奉承禹、周公、孔子三圣者，岂我好与杨墨之辩哉？是我不得已，故当与之争辩也。然而能言距止杨墨之道者，是亦为圣人之徒党也，故曰：“我亦欲正人心，息邪说，距讠皮行，放淫辞，以承三圣者，岂好辩哉？予不得已也。能言距杨墨者，圣人之徒也。”○注“尧使禹治洪水，通九州”至“消尽也”。正义曰：“禹通九州”者，盖始自尧所都冀州而起，遂从东南通于兖州；兖州既达，又东南通於青州；青州既达，又从南通於徐州；徐州既达，又南通於杨州；杨州既达，又西通於荆州；荆州既达，又从荆而北通於豫州；豫州既达，又从豫而西通於梁州；梁州既达，又从梁而北通於雍州；雍州既达，於是又通乎冀州；冀州乃帝都也。凡此是皆禹通之耳。○注“奄，东方无道国”至“王来自奄”。正义曰：案郑玄云：“奄国在淮夷之北。”裴る亦引而证《史记》。云伐奄者，孔安国云：周公归政之明年，淮夷奄国又叛，成王东伐淮夷，遂灭奄而徙其君。五月，自奄还至缟京，是王自奄也。云“飞廉，纣谀臣”，案《史记》云“飞廉乃颛顼之苗裔也，飞廉善走，其子恶来，恶来有力，父子俱以材力事殷纣，周武王伐纣，并杀之”是矣。“舜放四罪”，所谓流共工于幽州，放兜于崇山，窜三苗于三危，殛鲧于羽山。四罪而天下咸服。凡此是也。○注“禹稷胼胝，周公仰思，仲尼皇皇”。正义曰：经云禹稷手足胼胝，周公仰而思之夜以继日，扬雄云“仲尼皇皇”，是也，凡此盖言皆能勤於为生民耳。" }
      - { type: j, text: "匡章曰：“陈仲子岂不诚廉士哉？居於陵，三日不食，耳无闻，目无见也。井上有李，螬食实者过半矣，匍匐往将食之，三咽，然後耳有闻，目有见。”" }
      - { type: z, text: "匡章齐人也。陈仲子，齐一介之士，穷不苟求者，是以绝粮而馁也。螬，虫也。李实有虫，食之过半，言仲子目不能择也。" }
      - { type: j, text: "孟子曰：“於齐国之士，吾必以仲子为巨擘焉。虽然，仲子恶能廉？充仲子之操，则蚓而後可者也。夫蚓，上食槁壤，下饮黄泉。" }
      - { type: z, text: "巨擘，大指也。比於齐国之士，吾必以仲子为指中大者耳，非大器也。蚓，蚯蚓之虫也。充满其操行，似蚓而可行者也。蚓食土饮泉，极廉矣，然无心无识，仲子不知仁义，苟守一介，亦犹蚓也。" }
      - { type: j, text: "仲子所居之室，伯夷之所筑与？抑亦盗跖之所筑与？所食之粟，伯夷之所树与？抑亦盗跖之所树与？是未可知也。”" }
      - { type: z, text: "孟子问匡章：仲子岂能必使伯夷之徒筑室、树粟，乃居、食之邪？抑亦得盗跖之徒使作也，是殆未可知也。" }
      - { type: j, text: "曰：“是何伤哉？彼身织屦，妻辟纟卢，以易之也。”" }
      - { type: z, text: "匡章曰：恶人作之何伤哉？彼仲子身自织屦，妻缉纟卢，以易食、宅耳。缉绩其麻曰辟，练其麻曰纟卢，故云辟纟卢。" }
      - { type: j, text: "曰：“仲子，齐之世家也，兄戴，盖禄万锺。以兄之禄为不义之禄而不食也，以兄之室为不义之室而不居也，避兄离母，处於於陵。" }
      - { type: z, text: "孟子言仲子，齐之世卿大夫之家，兄名戴，为齐卿，食采於盖，禄万锺。仲子以为事非其君、行非其道以居富贵，故不义之，窜於於陵也。" }
      - { type: j, text: "他日归，则有馈其兄生鹅者，己频<戚页>曰：‘恶用是者为哉？’" }
      - { type: z, text: "他日，异日也。归省其母，见兄受人之鹅而非之。己，仲子也。频<戚页>不悦，曰：“安用是者为乎？，鹅鸣声" }
      - { type: j, text: "他日，其母杀是鹅也，与之食之。其兄自外至，曰：‘是之肉也。’出而哇之。以母则不食，以妻则食之；以兄之室则弗居，以於陵则居之：是尚为能充其类也乎？若仲子者，蚓而後充其操者也。”" }
      - { type: z, text: "异日母食以鹅，不知是前所频<戚页>者也。兄疾之告曰：“是之肉也。”仲子出门而哇吐之。孟子非其不食於母，而食妻所作屦纟卢易食也；不居兄室，而居於於陵人所筑室也：是尚能充人类乎？如蚓之性，然後可以充其操也。是以孟子喻以蚯蚓而比诸巨擘而已。“匡章曰”至“而後充其操者也”。○正义曰：此章指言圣人之道，亲亲尚和，志士之操，耿介特立，可以激浊，不可常法。是以孟子喻以丘蚓比诸巨擘也。“匡章曰：陈仲子岂不诚廉士哉”至“目有见”者，匡章齐国之人也。仲子，齐国一介之士也。匡章谓孟子曰：陈仲子之为人，岂不诚为廉士者哉？言仲子居处於於陵之地，三日无食，故不求食，以至饥饿，使耳聋而无闻，目盲而无见。井里之上有李果为螬虫所食者，其实已过半矣，但匍匐往而取食之，食至三吞然後耳方有所闻而不聋，目方有所见而不盲。言仲子之至如此之甚，尚不肯苟求於人，是所谓岂不诚廉洁之士哉。“孟子曰：於齐国之士”至“下饮黄泉”，孟子答之，以谓於齐国之众士中，吾必以陈仲子但如指中之大者耳。虽然，大指又安能为廉洁之士哉？如充满其仲子之操守，则必似蚯蚓而後可行也。故蚓但上食其槁壤之土，下饮其黄泉之水，是谓极廉矣。今仲子所居处之屋，且以为伯夷之所筑而居之欤？抑亦即盗跖为利者之所筑而居欤？仲子所食之粟米，且以伯夷之所种而食欤？抑亦即为盗跖者之所种而食欤？故孟子以此问之匡章乃曰：仲子所居之室，伯夷之所筑欤，抑亦盗跖之所筑欤？所食之粟，伯夷之所树欤，抑亦盗跖之所树欤？然孟子必以伯夷言之，又必以盗跖言之者，盖谓伯夷之清最为洁者，盗跖最为贪利者，而仲子必不能使伯夷之徒筑室、树粟乃居、食之也，但亦盗跖所筑、树而居、食之也，岂足谓之廉士哉？故曰“是未可知也”。以其但亦盗跖所筑、树也，殆未可得而知也。“曰：是何伤哉？彼身织屦，妻辟纟卢，以易之也”，匡章又言於孟子曰：此何伤於仲子为廉哉？言虽盗跖之徒而筑、树之，而仲子所居、食之，亦不足伤害仲子为廉洁之士矣。以其彼仲子亲织其草屦，妻缉绩其麻，以更易室粟而居、食之也。“曰：仲子，齐之世家也，兄戴，盖禄万锺，以兄之禄为不义之禄”至“蚓而後可充其操者也”，孟子又言仲子者，乃齐国世卿大夫之家也，其仲子之兄名戴者，食采於盖之邑，禄受万锺之秩，仲子乃以兄之禄为不义之禄而不食，以兄所居之室为不义之室而不居，遂逃避其兄，离去其母，而自处於於陵。於陵，齐之别邑也。异日，归省其母，见有馈遗其兄之生鹅者，乃频<戚页>不悦，而言曰：“安用是者为馈哉？又至异日，其仲子之母乃杀此鹅与仲子而食之，其仲子之兄自外而归至，见仲子食此鹅肉，乃疾告之曰：此是前日所馈我者之肉也。仲子觉为鹅肉，出门外哇而吐之。以其母所杀之食而且不食，乃食於妻子所辟纟卢而易所食而食之；以兄所居之屋而且不居，乃以於陵之人所居之屋而居之：如此，尚何能充为人之类乎？若仲子者，但如蚓之性然後可充其所操也。孟子意谓仲子之廉以此，是不足为廉者矣，人安可得而法之邪？匡章子所以言仲子为廉士者，以其欲则法之，宜孟子以是言而比喻巨擘、蚯蚓之类而排拒之也。巨擘，大指也。○注“缉绩其麻曰辟，练麻曰纟卢”。○正义曰：《释名》云：“辟，分辟也。纟卢，布纟卢也。”是知为缉绩练麻也。○注“食采於盖”。○正义曰：盖，齐之下邑也。《公孙丑》之篇亦有说焉。" }
