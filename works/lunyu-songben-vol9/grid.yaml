labels:
  - page: 386
    col: 1
    role: j
    text: 論語卷第九朱熹集注
  - page: 386
    col: 2
    role: title
    text: 陽貨第十七
  - page: 386
    col: 3
    role: z
    text: 凡二十六章
  - page: 386
    col: 4
    role: j
    text: 陽貨欲見孔子孔子不見歸孔子豚孔
  - page: 386
    col: 5
    role: j
    text: 子時其亡也而往拜之遇諸塗
  - page: 386
    col: 6
    role: z
    text: 歸如字一作饋○陽貨季氏家臣名
  - page: 386
    col: 7
    role: z
    text: 虎嘗囚季威子而專國政欲令孔子
  - page: 386
    col: 8
    role: z
    text: 來見己而孔子不往貨以禮大夫有
  - page: 387
    col: 1
    role: z
    text: 賜於士不得受於其家則往拜其門
  - page: 387
    col: 2
    role: z
    text: 故瞰孔子之亡而歸之豚欲令孔子
  - page: 387
    col: 3
    role: z
    text: 來拜而見之也
  - page: 387
    col: 4
    role: j
    text: 謂孔子曰來予與爾言曰懷其寶而迷
  - page: 387
    col: 5
    role: j
    text: 其邦可謂仁乎曰不可好從事而亟失
  - page: 387
    col: 6
    role: j
    text: 時可謂知乎曰不可日月逝矣歲不我
  - page: 387
    col: 7
    role: j
    text: 與孔子曰諾吾將仕矣
  - page: 387
    col: 8
    role: z
    text: 好亟知並去聲○懷寶迷邦謂懷藏
  - page: 387
    col: 9
    role: z
    text: 道德不救國之迷亂亟數也失時謂
  - page: 387
    col: 10
    role: z
    text: 不及事幾之會將者且然而未必之
  - page: 387
    col: 11
    role: z
    text: 辭貨語皆譏孔子而諷使欲仕孔子
  - page: 387
    col: 12
    role: z
    text: 固未嘗如此而亦非不欲仕也但不
  - page: 387
    col: 13
    role: z
    text: 仕於貨耳故直據理答之不復與辯
  - page: 387
    col: 14
    role: z
    text: 若不諭其意者○陽貨之欲見孔子
  - page: 387
    col: 15
    role: z
    text: 雖其善意然不過欲使助己爲亂耳
  - page: 387
    col: 16
    role: z
    text: 故孔子不見者義也其往拜者禮也
  - page: 388
    col: 1
    role: z
    text: 必時其亡而往者欲其稱也遇諸塗
  - page: 388
    col: 2
    role: z
    text: 而不避者不終絕也隨問而對者理
  - page: 388
    col: 3
    role: z
    text: 之直也對而不辨者言之孫而亦無
  - page: 388
    col: 4
    role: z
    text: 所詘也楊氏曰楊雄謂孔子於陽貨
  - page: 388
    col: 5
    role: z
    text: 也敬所不敬爲詘身以信道非知孔
  - page: 388
    col: 6
    role: z
    text: 子者蓋道外無身身外無道身詘矣
  - page: 388
    col: 7
    role: z
    text: 而可以信道吾未之信也
  - page: 388
    col: 8
    role: j
    text: 子曰性相近也習相遠也
  - page: 388
    col: 9
    role: z
    text: 此所謂性兼氣質而言者也氣質之
  - page: 388
    col: 10
    role: z
    text: 性固有美惡之不同矣然以其初而
  - page: 388
    col: 11
    role: z
    text: 言則皆不甚相遠也但習於善則善
  - page: 388
    col: 12
    role: z
    text: 習於惡則惡於是始相遠耳○程子
  - page: 388
    col: 13
    role: z
    text: 曰此言氣質之性非言性之本也若
  - page: 388
    col: 14
    role: z
    text: 言其本則性即是理理無不善孟子
  - page: 388
    col: 15
    role: z
    text: 之言性善是也何相近之有哉
  - page: 388
    col: 16
    role: j
    text: 子曰唯上知與下愚不移
  - page: 389
    col: 1
    role: j
    text: 知去聲○此承上章而言人之氣質
  - page: 389
    col: 2
    role: j
    text: 相近之中又有美惡一定而非習之
  - page: 389
    col: 3
    role: j
    text: 所能移者○程子曰人性本善有不
  - page: 389
    col: 4
    role: j
    text: 可移者何也語其性則皆善也語其
  - page: 389
    col: 5
    role: j
    text: 才則有下愚之不移所謂下愚有二
  - page: 389
    col: 6
    role: j
    text: 焉自暴自棄也人苟以善自治則無
  - page: 389
    col: 7
    role: j
    text: 不可移雖昏愚之至皆可漸磨而進
  - page: 389
    col: 8
    role: j
    text: 也唯自暴者拒之以不信自棄者絕
  - page: 389
    col: 9
    role: j
    text: 之以不爲雖聖人與居不能化而入
  - page: 389
    col: 10
    role: j
    text: 也仲尼之所謂下愚也然其質非必
  - page: 389
    col: 11
    role: j
    text: 昏且愚也往往彊戾而才力有過人
  - page: 389
    col: 12
    role: j
    text: 者商辛是也聖人以其自絕於善謂
  - page: 389
    col: 13
    role: j
    text: 之下愚然考其歸則誠愚也或曰此
  - page: 389
    col: 14
    role: j
    text: 與上章當合爲一子曰二字蓋衍文
  - page: 389
    col: 15
    role: z
    text: 耳
  - page: 389
    col: 16
    role: j
    text: 子之武城聞弦歌之聲
  - page: 390
    col: 1
    role: z
    text: 弦琴瑟也時子游爲武城宰以禮樂
  - page: 390
    col: 2
    role: z
    text: 爲敎故邑人皆弦歌也
  - page: 390
    col: 3
    role: j
    text: 夫子莞爾而笑曰割雞焉用牛刀
  - page: 390
    col: 4
    role: z
    text: 莞華版反焉於虔反○莞爾小笑貌
  - page: 390
    col: 5
    role: z
    text: 蓋喜之也因言其治小邑何必用此
  - page: 390
    col: 6
    role: z
    text: 大道也
  - page: 390
    col: 7
    role: j
    text: 子游對曰昔者偃也聞諸夫子曰君子
  - page: 390
    col: 8
    role: j
    text: 學道則愛人小人學道則易使也
  - page: 390
    col: 9
    role: z
    text: 易去聲○君子小人以位言之子游
  - page: 390
    col: 10
    role: z
    text: 所稱蓋夫子之常言言君子小人皆
  - page: 390
    col: 11
    role: z
    text: 不可以不學故武城雖小亦必敎以
  - page: 390
    col: 12
    role: z
    text: 禮樂
  - page: 390
    col: 13
    role: j
    text: 子曰二三子偃之言是也前言戲之耳
  - page: 390
    col: 14
    role: z
    text: 嘉子游之篤信又以解門人之惑也
  - page: 390
    col: 15
    role: z
    text: ○治有大小而其治之必用禮樂則
  - page: 390
    col: 16
    role: z
    text: 其爲道一也但衆人多不能用而子
  - page: 391
    col: 1
    role: z
    text: 游獨行之故夫子驟聞而深喜之因
  - page: 391
    col: 2
    role: z
    text: 反其言以戲之而子游以正對故復
  - page: 391
    col: 3
    role: z
    text: 是其言而自實其戲也
  - page: 391
    col: 4
    role: j
    text: 公山弗擾以費畔召子欲往
  - page: 391
    col: 5
    role: z
    text: 弗擾季氏宰與陽貨共執桓子據邑
  - page: 391
    col: 6
    role: z
    text: 以叛
  - page: 391
    col: 7
    role: j
    text: 子路不說曰末之也已何必公山氏之
  - page: 391
    col: 8
    role: j
    text: 之也
  - page: 391
    col: 9
    role: z
    text: 說音悅○末無也言道既不行無所
  - page: 391
    col: 10
    role: z
    text: 往矣何必公山氏之往乎
  - page: 391
    col: 11
    role: j
    text: 子曰夫召我者而豈徒哉如有用我者
  - page: 391
    col: 12
    role: j
    text: 吾其為東周乎
  - page: 391
    col: 13
    role: z
    text: 夫音扶○豈徒哉言必用我也為東
  - page: 391
    col: 14
    role: z
    text: 周言興周道於東方○程子曰聖人
  - page: 391
    col: 15
    role: z
    text: 以天下無不可有為之人亦無不可
  - page: 391
    col: 16
    role: z
    text: 改過之人故欲往然而終不往者知
  - page: 392
    col: 1
    role: z
    text: 其必不能改故也
  - page: 392
    col: 2
    role: j
    text: 子張問仁於孔子孔子曰能行五者於
  - page: 392
    col: 3
    role: j
    text: 天下為仁矣請問之曰恭寬信敏惠恭
  - page: 392
    col: 4
    role: j
    text: 則不侮寬則得眾信則人任焉敏則有
  - page: 392
    col: 5
    role: j
    text: 功惠則足以使人
  - page: 392
    col: 6
    role: z
    text: 行是五者則心存而理得矣於天下
  - page: 392
    col: 7
    role: z
    text: 言無適而不然猶所謂雖之夷狄不
  - page: 392
    col: 8
    role: z
    text: 可棄者五者之目蓋因子張所不足
  - page: 392
    col: 9
    role: z
    text: 而言耳任倚仗也又言其效如此○
  - page: 392
    col: 10
    role: z
    text: 張敬夫曰能行此五者於天下則其
  - page: 392
    col: 11
    role: z
    text: 心公平而周徧可知矣然恭其本與
  - page: 392
    col: 12
    role: z
    text: 李氏曰此章與六言六蔽五美四惡
  - page: 392
    col: 13
    role: z
    text: 之類皆與前後文體大不相似
  - page: 392
    col: 14
    role: j
    text: 佛肸召子欲往
  - page: 392
    col: 15
    role: z
    text: 佛音弼肸許密反○佛肸晉大夫趙
  - page: 392
    col: 16
    role: z
    text: 氏之中牟宰也
  - page: 393
    col: 1
    role: j
    text: 子路曰昔者由也聞諸夫子曰親於其
  - page: 393
    col: 2
    role: j
    text: 身爲不善者君子不入也佛肸以中牟
  - page: 393
    col: 3
    role: j
    text: 畔子之往也如之何
  - page: 393
    col: 4
    role: z
    text: 子路恐佛肸之浼夫子故問此以止
  - page: 393
    col: 5
    role: z
    text: 夫子之行親猶自也不入不入其黨
  - page: 393
    col: 6
    role: z
    text: 也
  - page: 393
    col: 7
    role: j
    text: 子曰然有是言也不曰堅乎磨而不磷
  - page: 393
    col: 8
    role: j
    text: 不曰白乎涅而不緇
  - page: 393
    col: 9
    role: z
    text: 磷力刃反涅乃結反○磷薄也涅染
  - page: 393
    col: 10
    role: z
    text: 皂物言人之不善不能浼已○楊氏
  - page: 393
    col: 11
    role: z
    text: 曰磨不磷涅不緇而後無可無不可
  - page: 393
    col: 12
    role: z
    text: 堅白不足而欲自試於磨涅其不磷
  - page: 393
    col: 13
    role: z
    text: 緇也者幾希
  - page: 393
    col: 14
    role: j
    text: 吾豈匏瓜也哉焉能繫而不食
  - page: 393
    col: 15
    role: z
    text: 焉於虔反○匏瓠也匏瓜繫於一處
  - page: 393
    col: 16
    role: z
    text: 而不能飲食人則不如是也○張敬
  - page: 394
    col: 1
    role: z
    text: 夫曰子路昔者之所聞君子守身之
  - page: 394
    col: 2
    role: z
    text: 常法夫子今日之所言聖人體道之
  - page: 394
    col: 3
    role: z
    text: 大權也然夫子於公山佛肸之召皆
  - page: 394
    col: 4
    role: z
    text: 欲往者以天下無不可變之人無不
  - page: 394
    col: 5
    role: z
    text: 可爲之事也其卒不往者知其人之
  - page: 394
    col: 6
    role: z
    text: 終不可變而事之終不可爲耳一則
  - page: 394
    col: 7
    role: z
    text: 生物之仁一則知人之智也
  - page: 394
    col: 8
    role: j
    text: 子曰由也女聞六言六蔽矣乎對曰未
  - page: 394
    col: 9
    role: j
    text: 也
  - page: 394
    col: 10
    role: z
    text: 女音汝下同○蔽遮掩也
  - page: 394
    col: 11
    role: j
    text: 居吾語女
  - page: 394
    col: 12
    role: z
    text: 語去聲○禮君子問更端則起而對
  - page: 394
    col: 13
    role: z
    text: 故孔子喻子路使還坐而告之
  - page: 394
    col: 14
    role: j
    text: 好仁不好學其蔽也愚好知不好學其
  - page: 394
    col: 15
    role: j
    text: 蔽也蕩好信不好學其蔽也賊好直不
  - page: 394
    col: 16
    role: j
    text: 好學其蔽也絞好勇不好學其蔽也亂
  - page: 395
    col: 1
    role: j
    text: 好剛不好學其蔽也狂
  - page: 395
    col: 2
    role: z
    text: 好知並去聲○六言皆美德然徒好
  - page: 395
    col: 3
    role: j
    text: 之而不學以明其理則各有所蔽愚若
  - page: 395
    col: 4
    role: j
    text: 可陷可罔之類蕩謂窮高極廣而無所
  - page: 395
    col: 5
    role: z
    text: 止賊謂傷害於物勇者剛之發剛者
  - page: 395
    col: 6
    role: z
    text: 勇之體狂躁率也○范氏曰子路勇
  - page: 395
    col: 7
    role: z
    text: 於爲善其失之者未能好學以明之
  - page: 395
    col: 8
    role: z
    text: 也故告之以此曰勇曰剛曰信曰直
  - page: 395
    col: 9
    role: z
    text: 又皆所以救其偏也
  - page: 395
    col: 10
    role: j
    text: 子曰小子何莫學夫詩
  - page: 395
    col: 11
    role: z
    text: 夫音扶○小子弟子也
  - page: 395
    col: 12
    role: j
    text: 詩可以興
  - page: 395
    col: 13
    role: z
    text: 感發志意
  - page: 395
    col: 14
    role: j
    text: 可以觀
  - page: 395
    col: 15
    role: z
    text: 考見得失
  - page: 395
    col: 16
    role: j
    text: 可以羣
  - page: 396
    col: 1
    role: z
    text: 和而不流
  - page: 396
    col: 2
    role: j
    text: 可以怨
  - page: 396
    col: 3
    role: z
    text: 怨而不怒
  - page: 396
    col: 4
    role: j
    text: 邇之事父遠之事君
  - page: 396
    col: 5
    role: z
    text: 人倫之道詩無不備二者舉重而言
  - page: 396
    col: 6
    role: j
    text: 多識於鳥獸草木之名
  - page: 396
    col: 7
    role: z
    text: 其緒餘又足以資多識○學詩之法
  - page: 396
    col: 8
    role: z
    text: 此章盡之讀是經者所冝盡心也
  - page: 396
    col: 9
    role: j
    text: 子謂伯魚曰女爲周南召南矣乎人而
  - page: 396
    col: 10
    role: j
    text: 不爲周南召南其猶正墻靣而立也與
  - page: 396
    col: 11
    role: z
    text: 女音汝與平聲○爲猶學也周南召
  - page: 396
    col: 12
    role: z
    text: 南詩首篇名所言皆脩身齊家之事
  - page: 396
    col: 13
    role: z
    text: 正墻靣而立言即其至近之地而一
  - page: 396
    col: 14
    role: z
    text: 物無所見一歩不可行
  - page: 396
    col: 15
    role: j
    text: 子曰禮云禮云玉帛云乎哉樂云樂云
  - page: 396
    col: 16
    role: j
    text: 鍾鼓云乎哉
  - page: 397
    col: 1
    role: z
    text: 敬而將之以玉帛則為禮和而發之
  - page: 397
    col: 2
    role: z
    text: 以鍾鼓則為樂遺其本而專事其末
  - page: 397
    col: 3
    role: z
    text: 則豈禮樂之謂哉○程子曰禮只是
  - page: 397
    col: 4
    role: z
    text: 一箇序樂只是一箇和只此兩字含
  - page: 397
    col: 5
    role: z
    text: 畜多少義理天下無一物無禮樂且
  - page: 397
    col: 6
    role: z
    text: 如置此兩倚一不正便是無序無序
  - page: 397
    col: 7
    role: z
    text: 便乖乖便不和又如賊盜至為不道
  - page: 397
    col: 8
    role: z
    text: 然亦有禮樂蓋必有緫屬必相聽順
  - page: 397
    col: 9
    role: z
    text: 乃能為盜不然則叛亂無統不能一
  - page: 397
    col: 10
    role: z
    text: 日相聚而為盜也禮樂無處無之學
  - page: 397
    col: 11
    role: z
    text: 者要須識得
  - page: 397
    col: 12
    role: j
    text: 子曰色厲而內荏譬諸小人其猶穿窬
  - page: 397
    col: 13
    role: j
    text: 之盜也與
  - page: 397
    col: 14
    role: z
    text: 荏而審反與平聲○厲威嚴也荏柔
  - page: 397
    col: 15
    role: z
    text: 弱也小人細民也穿穿壁窬踰墻言
  - page: 397
    col: 16
    role: z
    text: 其無實盜名而常畏人知也
  - page: 398
    col: 1
    role: j
    text: 子曰郷原德之賊也
  - page: 398
    col: 2
    role: j
    text: 郷者鄙俗之意原與愿同荀子原慤
  - page: 398
    col: 3
    role: z
    text: 注讀作愿是也郷原郷人之愿者也
  - page: 398
    col: 4
    role: z
    text: 蓋其同流合汙以媚於世故在郷人
  - page: 398
    col: 5
    role: z
    text: 之中獨以愿稱夫子以其似德非德
  - page: 398
    col: 6
    role: z
    text: 而反亂乎德故以為德之賊而深惡
  - page: 398
    col: 7
    role: z
    text: 之詳見孟子末篇
  - page: 398
    col: 8
    role: j
    text: 子曰道聽而塗說德之棄也
  - page: 398
    col: 9
    role: z
    text: 雖聞善言不為己有是自棄其德也
  - page: 398
    col: 10
    role: z
    text: ○王氏曰君子多識前言往行以畜
  - page: 398
    col: 11
    role: z
    text: 其德道聽塗說則棄之矣
  - page: 398
    col: 12
    role: j
    text: 子曰鄙夫可與事君也與哉
  - page: 398
    col: 13
    role: z
    text: 與平聲○鄙夫庸惡陋劣之稱
  - page: 398
    col: 14
    role: j
    text: 其未得之也患得之既得之患失之
  - page: 398
    col: 15
    role: z
    text: 何氏曰患得之謂不能得之
  - page: 398
    col: 16
    role: j
    text: 苟患失之無所不至矣
  - page: 399
    col: 1
    role: z
    text: 小則吮癰舐痔大則弑父與君皆生
  - page: 399
    col: 2
    role: z
    text: 於患失而已○胡氏曰許昌靳裁之
  - page: 399
    col: 3
    role: z
    text: 有言曰士之品大槩有三志於道德
  - page: 399
    col: 4
    role: z
    text: 者功名不足以累其心志於功名者
  - page: 399
    col: 5
    role: z
    text: 冨貴不足以累其心志於冨貴而已
  - page: 399
    col: 6
    role: z
    text: 矣則亦無所不至矣志於冨貴即孔
  - page: 399
    col: 7
    role: z
    text: 子所謂鄙夫也
  - page: 399
    col: 8
    role: j
    text: 子曰古者民有三疾今也或是之亡也
  - page: 399
    col: 9
    role: z
    text: 氣失其平則爲疾故氣禀之偏者亦
  - page: 399
    col: 10
    role: z
    text: 謂之疾昔所謂疾今亦無之傷俗之
  - page: 399
    col: 11
    role: z
    text: 益衰也
  - page: 399
    col: 12
    role: j
    text: 古之狂也肆今之狂也蕩古之矜也廉
  - page: 399
    col: 13
    role: j
    text: 今之矜也忿戾古之愚也直今之愚也
  - page: 399
    col: 14
    role: j
    text: 詐而已矣
  - page: 399
    col: 15
    role: z
    text: 狂者志願太髙肆謂不拘小節蕩則
  - page: 399
    col: 16
    role: z
    text: 踰大閑矣矜者持守太嚴廉謂稜角
  - page: 400
    col: 1
    role: z
    text: 峭厲忿戾則至於爭矣愚者暗昧不
  - page: 400
    col: 2
    role: z
    text: 明直謂徑行自遂詐則挾私妄作矣
  - page: 400
    col: 3
    role: z
    text: ○范氏曰末世滋僞豈惟賢者不如
  - page: 400
    col: 4
    role: z
    text: 古哉民性之蔽亦與古人異矣
  - page: 400
    col: 5
    role: j
    text: 子曰巧言令色鮮矣仁○子曰惡紫
  - page: 400
    col: 6
    role: j
    text: 之奪朱也惡鄭聲之亂雅樂也惡利口
  - page: 400
    col: 7
    role: j
    text: 之覆邦家者
  - page: 400
    col: 8
    role: z
    text: 惡去聲覆芳服反○朱正色紫間色
  - page: 400
    col: 9
    role: z
    text: 雅正也利口捷給覆傾敗也○范氏
  - page: 400
    col: 10
    role: z
    text: 曰天下之理正而勝者常少不正而
  - page: 400
    col: 11
    role: z
    text: 勝者常多聖人所以惡之也利口之
  - page: 400
    col: 12
    role: z
    text: 人以是為非以非為是以賢為不肖
  - page: 400
    col: 13
    role: z
    text: 以不肖為賢人君苟悅而信之則國
  - page: 400
    col: 14
    role: z
    text: 家之覆也不難矣
  - page: 400
    col: 15
    role: j
    text: 子曰予欲無言
  - page: 400
    col: 16
    role: z
    text: 學者多以語言觀聖人而不察其天
  - page: 401
    col: 1
    role: z
    text: 理流行之實有不待言而著者是以
  - page: 401
    col: 2
    role: z
    text: 徒得其言而不得其所以言故夫子
  - page: 401
    col: 3
    role: z
    text: 發此以警之
  - page: 401
    col: 4
    role: j
    text: 子貢曰子如不言則小子何述焉
  - page: 401
    col: 5
    role: z
    text: 子貢正以言語觀聖人者故疑而問
  - page: 401
    col: 6
    role: z
    text: 之
  - page: 401
    col: 7
    role: j
    text: 子曰天何言哉四時行焉百物生焉天
  - page: 401
    col: 8
    role: j
    text: 何言哉
  - page: 401
    col: 9
    role: z
    text: 四時行百物生莫非天理發見流行
  - page: 401
    col: 10
    role: z
    text: 之實不待言而可見聖人一動一靜
  - page: 401
    col: 11
    role: z
    text: 莫非妙道精義之發亦天而已豈待
  - page: 401
    col: 12
    role: z
    text: 言而顯哉此亦開示子貢之切惜乎
  - page: 401
    col: 13
    role: z
    text: 其終不喻也○程子曰孔子之道譬
  - page: 401
    col: 14
    role: z
    text: 如日星之明猶患門人未能盡曉故
  - page: 401
    col: 15
    role: z
    text: 曰予欲無言若顏子則便默識其他
  - page: 401
    col: 16
    role: z
    text: 則未免疑問故曰小子何述又曰天
  - page: 402
    col: 1
    role: z
    text: 何言哉四時行焉百物生焉則可謂
  - page: 402
    col: 2
    role: z
    text: 至明白矣愚按此與前篇無隱之意
  - page: 402
    col: 3
    role: z
    text: 相發學者詳之
  - page: 402
    col: 4
    role: j
    text: 孺悲欲見孔子孔子辭以疾將命者出
  - page: 402
    col: 5
    role: j
    text: 户取瑟而歌使之聞之
  - page: 402
    col: 6
    role: z
    text: 孺悲魯人嘗學士喪禮於孔子當是
  - page: 402
    col: 7
    role: z
    text: 時必有以得罪者故辭以疾而又使
  - page: 402
    col: 8
    role: z
    text: 知其非疾以警教之也○程子曰此
  - page: 402
    col: 9
    role: z
    text: 孟子所謂不屑之教誨所以深教之
  - page: 402
    col: 10
    role: z
    text: 也
  - page: 402
    col: 11
    role: j
    text: 宰我問三年之喪期已久矣
  - page: 402
    col: 12
    role: z
    text: 期音基下同期周年也
  - page: 402
    col: 13
    role: j
    text: 君子三年不為禮禮必壞三年不為樂
  - page: 402
    col: 14
    role: j
    text: 樂必崩
  - page: 402
    col: 15
    role: z
    text: 恐居喪不習而崩壞也
  - page: 402
    col: 16
    role: j
    text: 舊穀既沒新穀既升鑽燧改火期可已
  - page: 403
    col: 1
    role: j
    text: 矣
  - page: 403
    col: 2
    role: z
    text: 鑽祖宫反○没盡也升登也燧取火
  - page: 403
    col: 3
    role: z
    text: 之木也改火春取榆柳之火夏取棗
  - page: 403
    col: 4
    role: z
    text: 杏之火夏季取桑柘之火秋取柞楢
  - page: 403
    col: 5
    role: z
    text: 之火冬取槐檀之火亦一年而周也
  - page: 403
    col: 6
    role: z
    text: 已止也言朞年則天運一周時物皆
  - page: 403
    col: 7
    role: z
    text: 變喪至此可止也○尹氏曰短喪之
  - page: 403
    col: 8
    role: z
    text: 說下愚且恥言之宰我親學聖人之
  - page: 403
    col: 9
    role: z
    text: 門而以是爲問者有所疑於心而不
  - page: 403
    col: 10
    role: z
    text: 敢強焉爾
  - page: 403
    col: 11
    role: j
    text: 子曰食夫稻衣夫錦於女安乎曰安○
  - page: 403
    col: 12
    role: z
    text: 夫音扶下同衣去聲女音汝下同○
  - page: 403
    col: 13
    role: z
    text: 禮父母之喪旣殯食粥麤衰旣葬疏
  - page: 403
    col: 14
    role: z
    text: 食水飲受以成布期而小祥始食菜
  - page: 403
    col: 15
    role: z
    text: 果練冠縓縁要絰不除無食稻衣錦
  - page: 403
    col: 16
    role: z
    text: 之理夫子欲宰我反求諸心自得其
  - page: 404
    col: 1
    role: z
    text: 所以不忍者故問之以此而宰我不
  - page: 404
    col: 2
    role: z
    text: 察也
  - page: 404
    col: 3
    role: j
    text: 女安則爲之夫君子之居喪食旨不甘
  - page: 404
    col: 4
    role: j
    text: 聞樂不樂居處不安故不爲也今女安
  - page: 404
    col: 5
    role: j
    text: 則爲之
  - page: 404
    col: 6
    role: z
    text: 樂上如字下音洛○此夫子之言也
  - page: 404
    col: 7
    role: z
    text: 旨亦甘也初言汝安則爲之絶之之
  - page: 404
    col: 8
    role: z
    text: 辭又發其不忍之端以警其不察而
  - page: 404
    col: 9
    role: z
    text: 再言汝安則爲之以深責之
  - page: 404
    col: 10
    role: j
    text: 宰我出子曰予之不仁也子生三年然
  - page: 404
    col: 11
    role: j
    text: 後免於父母之懷夫三年之喪天下之
  - page: 404
    col: 12
    role: j
    text: 通喪也予也有三年之愛於其父母乎
  - page: 404
    col: 13
    role: z
    text: 宰我旣出夫子懼其眞以爲可安而
  - page: 404
    col: 14
    role: z
    text: 遂行之故深探其本而斥之言由其
  - page: 404
    col: 15
    role: z
    text: 不仁故愛親之薄如此也懷抱也又
  - page: 404
    col: 16
    role: z
    text: 言君子所以不忍於親而喪必三年
  - page: 405
    col: 1
    role: z
    text: 之故使之聞之或能反求而終得其
  - page: 405
    col: 2
    role: z
    text: 本心也○范氏曰喪雖止於三年然
  - page: 405
    col: 3
    role: z
    text: 賢者之情則無窮也特以聖人爲之
  - page: 405
    col: 4
    role: z
    text: 中制而不敢過故必俯而就之非以
  - page: 405
    col: 5
    role: z
    text: 三年之喪爲足以報其親也所謂三
  - page: 405
    col: 6
    role: z
    text: 年而後免於父母之懷特以責宰我
  - page: 405
    col: 7
    role: z
    text: 之無恩欲其有以跂而及之爾
  - page: 405
    col: 8
    role: j
    text: 子曰飽食終日無所用心難矣哉不有
  - page: 405
    col: 9
    role: j
    text: 博弈者乎爲之猶賢乎已
  - page: 405
    col: 10
    role: z
    text: 博局戲也弈圍碁也已止也○李氏
  - page: 405
    col: 11
    role: z
    text: 曰聖人非教人博弈也所以甚言無
  - page: 405
    col: 12
    role: z
    text: 所用心之不可爾
  - page: 405
    col: 13
    role: j
    text: 子路曰君子尚勇乎子曰君子義以爲
  - page: 405
    col: 14
    role: j
    text: 上君子有勇而無義爲亂小人有勇而
  - page: 405
    col: 15
    role: j
    text: 無義爲盜
  - page: 405
    col: 16
    role: z
    text: 尚上之也君子爲亂小人爲盜皆以
  - page: 406
    col: 1
    role: z
    text: 位而言者也○尹氏曰義以為尚則
  - page: 406
    col: 2
    role: z
    text: 其勇也大矣子路好勇故夫子以此
  - page: 406
    col: 3
    role: z
    text: 救其失也○胡氏曰疑此子路初見
  - page: 406
    col: 4
    role: z
    text: 孔子時問答也
  - page: 406
    col: 5
    role: j
    text: 子貢曰君子亦有惡乎子曰有惡惡稱
  - page: 406
    col: 6
    role: j
    text: 人之惡者惡居下流而訕上者惡勇而
  - page: 406
    col: 7
    role: j
    text: 無禮者惡果敢而窒者
  - page: 406
    col: 8
    role: z
    text: 惡去聲下同唯惡者之惡如字訕所
  - page: 406
    col: 9
    role: z
    text: 諫反○訕謗毀也窒不通也稱人惡
  - page: 406
    col: 10
    role: z
    text: 則無仁厚之意下訕上則無忠敬之
  - page: 406
    col: 11
    role: z
    text: 心勇無禮則為亂果而窒則妄作故
  - page: 406
    col: 12
    role: z
    text: 夫子惡之
  - page: 406
    col: 13
    role: j
    text: 曰賜也亦有惡乎惡徼以為知者惡不
  - page: 406
    col: 14
    role: j
    text: 孫以為勇者惡訐以為直者
  - page: 406
    col: 15
    role: z
    text: 徼古堯反知孫並去聲訐居謁反
  - page: 406
    col: 16
    role: z
    text: 惡徼以下子貢之言也徼伺察也訐
  - page: 407
    col: 1
    role: z
    text: 謂攻發人隂私○楊氏曰仁者無
  - page: 407
    col: 2
    role: z
    text: 不愛則君子疑若無惡矣子貢之有
  - page: 407
    col: 3
    role: z
    text: 是心也故問焉以質其是非○侯氏
  - page: 407
    col: 4
    role: z
    text: 曰聖賢之所惡如此所謂唯仁者能
  - page: 407
    col: 5
    role: z
    text: 惡人也
  - page: 407
    col: 6
    role: j
    text: 子曰唯女子與小人爲難養也近之則
  - page: 407
    col: 7
    role: j
    text: 不孫遠之則怨
  - page: 407
    col: 8
    role: z
    text: 近孫遠並去聲○此小人亦謂僕隸
  - page: 407
    col: 9
    role: z
    text: 下人也君子之於臣妾莊以涖之慈
  - page: 407
    col: 10
    role: z
    text: 以畜之則無二者之患矣
  - page: 407
    col: 11
    role: j
    text: 子曰年四十而見惡焉其終也已
  - page: 407
    col: 12
    role: z
    text: 惡去聲○四十成德之時見惡於人
  - page: 407
    col: 13
    role: z
    text: 則止於此而已勉人及時遷善改過
  - page: 407
    col: 14
    role: z
    text: 也○蘇氏曰此亦有爲而言不知其
  - page: 407
    col: 15
    role: z
    text: 爲誰也
  - page: 407
    col: 16
    role: title
    text: 微子第十八
  - page: 408
    col: 1
    role: j
    text: 此篇多記聖賢之出處凡十一章
  - page: 408
    col: 2
    role: j
    text: 微子去之箕子爲之奴比干諫而死
  - page: 408
    col: 3
    role: j
    text: 微箕二國名子爵也微子紂庶兄箕
  - page: 408
    col: 4
    role: j
    text: 子比干紂諸父微子見紂無道去之
  - page: 408
    col: 5
    role: j
    text: 以存宗祀箕子比干皆諫紂殺比干
  - page: 408
    col: 6
    role: j
    text: 囚箕子以爲奴箕子因佯狂而受辱
  - page: 408
    col: 7
    role: j
    text: 孔子曰殷有三仁焉
  - page: 408
    col: 8
    role: z
    text: 三人之行不同而同出於至誠惻怛
  - page: 408
    col: 9
    role: z
    text: 之意故不咈乎愛之理而有以全其
  - page: 408
    col: 10
    role: z
    text: 心之德也○楊氏曰此三人者各得
  - page: 408
    col: 11
    role: z
    text: 其本心故同謂之仁
  - page: 408
    col: 12
    role: j
    text: 柳下惠爲士師三黜人曰子未可以去
  - page: 408
    col: 13
    role: j
    text: 乎曰直道而事人焉往而不三黜枉道
  - page: 408
    col: 14
    role: j
    text: 而事人何必去父母之邦
  - page: 408
    col: 15
    role: z
    text: 三去聲焉於䖍反○士師獄官黜退
  - page: 408
    col: 16
    role: z
    text: 也柳下惠三黜不去而其辭氣雍容
  - page: 409
    col: 1
    role: z
    text: 如此可謂和矣然其不能枉道之意
  - page: 409
    col: 2
    role: z
    text: 則有確乎其不可拔者是則所謂必
  - page: 409
    col: 3
    role: z
    text: 以其道而不自失焉者也○胡氏曰
  - page: 409
    col: 4
    role: z
    text: 此必有孔子斷之之言而亡之矣
  - page: 409
    col: 5
    role: j
    text: 齊景公待孔子曰若季氏則吾不能以
  - page: 409
    col: 6
    role: j
    text: 季孟之間待之曰吾老矣不能用也孔
  - page: 409
    col: 7
    role: j
    text: 子行
  - page: 409
    col: 8
    role: z
    text: 魯三卿季氏最貴孟氏爲下卿孔子
  - page: 409
    col: 9
    role: z
    text: 去之事見世家然此言必非面語孔
  - page: 409
    col: 10
    role: z
    text: 子蓋自以告其臣而孔子聞之爾○
  - page: 409
    col: 11
    role: z
    text: 程子曰季氏強臣君待之之禮極隆
  - page: 409
    col: 12
    role: z
    text: 然非所以待孔子也以季孟之間待
  - page: 409
    col: 13
    role: z
    text: 之則禮亦至矣然復曰吾老矣不能
  - page: 409
    col: 14
    role: z
    text: 用也故孔子去之蓋不繫待之輕重
  - page: 409
    col: 15
    role: z
    text: 特以不用而去爾
  - page: 409
    col: 16
    role: j
    text: 齊人歸女樂季桓子受之三日不朝孔
  - page: 410
    col: 1
    role: j
    text: 子行
  - page: 410
    col: 2
    role: z
    text: 歸如字或作饋朝音潮○季威子魯
  - page: 410
    col: 3
    role: z
    text: 大夫名斯按史記定公十四年孔子
  - page: 410
    col: 4
    role: z
    text: 爲魯司冦攝行相事齊人懼歸女樂
  - page: 410
    col: 5
    role: z
    text: 以沮之○尹氏曰受女樂而怠於政
  - page: 410
    col: 6
    role: z
    text: 事如此其簡賢棄禮不足與有爲可
  - page: 410
    col: 7
    role: z
    text: 知矣夫子所以行也所謂見幾而作
  - page: 410
    col: 8
    role: z
    text: 不俟終日者與○范氏曰此篇記仁
  - page: 410
    col: 9
    role: z
    text: 賢之出處而折中以聖人之行所以
  - page: 410
    col: 10
    role: z
    text: 明中庸之道也
  - page: 410
    col: 11
    role: j
    text: 楚狂接輿歌而過孔子曰鳳兮鳳兮何
  - page: 410
    col: 12
    role: j
    text: 德之衰往者不可諫來者猶可追已而
  - page: 410
    col: 13
    role: j
    text: 已而今之從政者殆而
  - page: 410
    col: 14
    role: z
    text: 接輿楚人佯狂辟世夫子時將適楚
  - page: 410
    col: 15
    role: z
    text: 故接輿歌而過其車前也鳳有道則
  - page: 410
    col: 16
    role: z
    text: 見無道則隱接輿以比孔子而譏其
  - page: 411
    col: 1
    role: z
    text: 不能隱爲德衰也來者可追言及今
  - page: 411
    col: 2
    role: z
    text: 尚可隱去已止也而語助辭殆危也
  - page: 411
    col: 3
    role: z
    text: 接輿蓋知尊孔子而趨不同者也
  - page: 411
    col: 4
    role: j
    text: 孔子下欲與之言趨而辟之不得與之
  - page: 411
    col: 5
    role: j
    text: 言
  - page: 411
    col: 6
    role: z
    text: 辟去聲○孔子下車蓋欲告之以出
  - page: 411
    col: 7
    role: z
    text: 處之意接輿自以爲是故不欲聞而
  - page: 411
    col: 8
    role: z
    text: 辟之也
  - page: 411
    col: 9
    role: j
    text: 長沮桀溺耦而耕孔子過之使子路問
  - page: 411
    col: 10
    role: j
    text: 津焉
  - page: 411
    col: 11
    role: z
    text: 沮七余反溺乃歷反○二人隱者耦
  - page: 411
    col: 12
    role: z
    text: 並耕也時孔子自楚反乎蔡津濟度
  - page: 411
    col: 13
    role: z
    text: 處
  - page: 411
    col: 14
    role: j
    text: 長沮曰夫執輿者爲誰子路曰爲孔丘
  - page: 411
    col: 15
    role: j
    text: 曰是魯孔丘與曰是也曰是知津矣
  - page: 411
    col: 16
    role: z
    text: 夫音扶與平聲○執輿執轡在車也
  - page: 412
    col: 1
    role: z
    text: 蓋本子路御而執轡今下問津故夫
  - page: 412
    col: 2
    role: z
    text: 子代之也知津言數周流自知津處
  - page: 412
    col: 3
    role: j
    text: 問於桀溺桀溺曰子爲誰曰爲仲由曰
  - page: 412
    col: 4
    role: j
    text: 是魯孔丘之徒與對曰然曰滔滔者天
  - page: 412
    col: 5
    role: j
    text: 下皆是也而誰以易之且而與其從辟
  - page: 412
    col: 6
    role: j
    text: 人之士也豈若從辟世之士哉耰而不
  - page: 412
    col: 7
    role: j
    text: 輟
  - page: 412
    col: 8
    role: z
    text: 徒與之與平聲滔吐刀反辟去聲耰
  - page: 412
    col: 9
    role: z
    text: 音憂○滔滔流而不反之意以猶與
  - page: 412
    col: 10
    role: z
    text: 也言天下皆亂將誰與變易之而汝
  - page: 412
    col: 11
    role: z
    text: 也辟人謂孔子辟世桀溺自謂耰覆
  - page: 412
    col: 12
    role: z
    text: 種也亦不告以津處
  - page: 412
    col: 13
    role: j
    text: 子路行以告夫子憮然曰鳥獸不可與
  - page: 412
    col: 14
    role: j
    text: 同羣吾非斯人之徒與而誰與天下有
  - page: 412
    col: 15
    role: j
    text: 道丘不與易也
  - page: 412
    col: 16
    role: z
    text: 憮音武與如字○憮然猶悵然惜其
  - page: 413
    col: 1
    role: z
    text: 不喻己意也言所當與羣者斯人
  - page: 413
    col: 2
    role: z
    text: 而已豈可絕人逃世以為潔哉天下
  - page: 413
    col: 3
    role: z
    text: 若已平治則我無用變易之正為天
  - page: 413
    col: 4
    role: j
    text: 下無道故欲以道易之耳○程子曰聖
  - page: 413
    col: 5
    role: z
    text: 人不敢有忘天下之心故其言如此
  - page: 413
    col: 6
    role: z
    text: 也○張子曰聖人之仁不以無道必
  - page: 413
    col: 7
    role: z
    text: 天下而棄之也
  - page: 413
    col: 8
    role: j
    text: 子路從而後遇丈人以杖荷蓧子路問
  - page: 413
    col: 9
    role: j
    text: 曰子見夫子乎丈人曰四體不勤五穀
  - page: 413
    col: 10
    role: j
    text: 不分孰為夫子植其杖而芸
  - page: 413
    col: 11
    role: z
    text: 蓧徒弔反植音值○丈人亦隱者蓧
  - page: 413
    col: 12
    role: z
    text: 竹器分辨也五穀不分猶言不辨菽
  - page: 413
    col: 13
    role: z
    text: 麥爾責其不事農業而從師遠遊也
  - page: 413
    col: 14
    role: z
    text: 植立之也芸去草也
  - page: 413
    col: 15
    role: j
    text: 子路拱而立
  - page: 413
    col: 16
    role: z
    text: 知其隱者敬之也
  - page: 414
    col: 1
    role: j
    text: 止子路宿殺雞爲黍而食之見其二子
  - page: 414
    col: 2
    role: j
    text: 焉
  - page: 414
    col: 3
    role: z
    text: 食音嗣見賢遍反
  - page: 414
    col: 4
    role: j
    text: 明日子路行以告子曰隱者也使子路
  - page: 414
    col: 5
    role: j
    text: 反見之至則行矣
  - page: 414
    col: 6
    role: z
    text: 孔子使子路反見之蓋欲告之以君
  - page: 414
    col: 7
    role: z
    text: 臣之義而丈人意子路必將復來故
  - page: 414
    col: 8
    role: z
    text: 先去之以滅其跡亦接輿之意也
  - page: 414
    col: 9
    role: j
    text: 子路曰不仕無義長幼之節不可廢也
  - page: 414
    col: 10
    role: j
    text: 君臣之義如之何其廢之欲潔其身而
  - page: 414
    col: 11
    role: j
    text: 亂大倫君子之仕也行其義也道之不
  - page: 414
    col: 12
    role: j
    text: 行已知之矣
  - page: 414
    col: 13
    role: z
    text: 長上聲○子路述夫子之意如此蓋
  - page: 414
    col: 14
    role: z
    text: 丈人之接子路甚倨而子路益恭丈
  - page: 414
    col: 15
    role: z
    text: 人因見其二子焉則於長幼之節固
  - page: 414
    col: 16
    role: z
    text: 知其不可廢矣故因其所明以曉之
  - page: 415
    col: 1
    role: z
    text: 倫序也人之大倫有五父子有親君
  - page: 415
    col: 2
    role: z
    text: 臣有義夫婦有別長幼有序朋友有
  - page: 415
    col: 3
    role: z
    text: 信是也仕所以行君臣之義故雖知
  - page: 415
    col: 4
    role: z
    text: 道之不行而不可廢然謂之義則事
  - page: 415
    col: 5
    role: z
    text: 之可否身之去就亦自有不可苟者
  - page: 415
    col: 6
    role: z
    text: 是以雖不潔身以亂倫亦非忘義以
  - page: 415
    col: 7
    role: z
    text: 徇祿也福州有國初時寫本路下有
  - page: 415
    col: 8
    role: z
    text: 反子二字以此爲子路反而夫子言
  - page: 415
    col: 9
    role: j
    text: 之也未知是否○范氏曰隱者爲高故
  - page: 415
    col: 10
    role: z
    text: 往而不反仕者爲通故溺而不止不
  - page: 415
    col: 11
    role: z
    text: 與鳥獸同羣則決性命之情以饕富
  - page: 415
    col: 12
    role: j
    text: 貴此二者皆惑也是以依乎中庸者爲
  - page: 415
    col: 13
    role: z
    text: 難惟聖人不廢君臣之義而必以其
  - page: 415
    col: 14
    role: z
    text: 正所以或出或處而終不離於道也
  - page: 415
    col: 15
    role: j
    text: 逸民伯夷叔齊虞仲夷逸朱張柳下惠
  - page: 415
    col: 16
    role: j
    text: 少連
  - page: 416
    col: 1
    role: z
    text: 少去聲下同○逸遺逸民者無位之
  - page: 416
    col: 2
    role: z
    text: 稱虞仲即仲雍與大伯同竄荆蠻者
  - page: 416
    col: 3
    role: z
    text: 夷逸朱張不見經傳少連東夷人
  - page: 416
    col: 4
    role: j
    text: 子曰不降其志不辱其身伯夷叔齊與
  - page: 416
    col: 5
    role: z
    text: 與平聲
  - page: 416
    col: 6
    role: j
    text: 謂柳下惠少連降志辱身矣言中倫行
  - page: 416
    col: 7
    role: j
    text: 中慮其斯而已矣
  - page: 416
    col: 8
    role: z
    text: 中去聲下同○柳下惠事見上倫義
  - page: 416
    col: 9
    role: z
    text: 理之次第也慮思慮也中慮言有意
  - page: 416
    col: 10
    role: z
    text: 義合人心少連事不可考然記稱其
  - page: 416
    col: 11
    role: z
    text: 善居喪三日不怠三月不解朞悲哀
  - page: 416
    col: 12
    role: z
    text: 三年憂則行之中慮亦可見矣
  - page: 416
    col: 13
    role: j
    text: 謂虞仲夷逸隱居放言身中清廢中權
  - page: 416
    col: 14
    role: z
    text: 仲雍居吳斷髮文身裸以為飾隱居
  - page: 416
    col: 15
    role: z
    text: 獨善合乎道之清放言自廢合乎道
  - page: 416
    col: 16
    role: z
    text: 之權
  - page: 417
    col: 1
    role: j
    text: 我則異於是無可無不可
  - page: 417
    col: 2
    role: j
    text: 孟子曰孔子可以仕則仕可以止則
  - page: 417
    col: 3
    role: j
    text: 止可以乆則乆可以速則速所謂無
  - page: 417
    col: 4
    role: j
    text: 可無不可也○謝氏曰七人隱遯不
  - page: 417
    col: 5
    role: j
    text: 汙則同其立心造行則異伯夷叔齊
  - page: 417
    col: 6
    role: j
    text: 天子不得臣諸侯不得友蓋已遜世
  - page: 417
    col: 7
    role: j
    text: 離羣矣下聖人一等此其最高與柳
  - page: 417
    col: 8
    role: j
    text: 下惠少連雖降志而不枉己雖辱身
  - page: 417
    col: 9
    role: j
    text: 而不求合其心有不屑也故言能中
  - page: 417
    col: 10
    role: j
    text: 倫行能中慮虞仲夷逸隱居放言則
  - page: 417
    col: 11
    role: j
    text: 言不合先王之法者多矣然清而不
  - page: 417
    col: 12
    role: j
    text: 汙也權而適宜也與方外之士害義
  - page: 417
    col: 13
    role: j
    text: 傷教而亂大倫者殊科是以均謂之
  - page: 417
    col: 14
    role: j
    text: 逸民○尹氏曰七人各守其一節孔
  - page: 417
    col: 15
    role: j
    text: 子則無可無不可此所以常適其可
  - page: 417
    col: 16
    role: j
    text: 而異於逸民之徒也楊雄曰觀乎聖
  - page: 418
    col: 1
    role: j
    text: 人則見賢人是以孟子語夷惠亦必
  - page: 418
    col: 2
    role: z
    text: 以孔子斷之
  - page: 418
    col: 3
    role: j
    text: 大師摯適齊
  - page: 418
    col: 4
    role: z
    text: 大音泰○大師魯樂官之長摯其名
  - page: 418
    col: 5
    role: z
    text: 也
  - page: 418
    col: 6
    role: j
    text: 亞飯干適楚三飯繚適蔡四飯缺適秦
  - page: 418
    col: 7
    role: z
    text: 飯扶晚反繚音了○亞飯以下以樂
  - page: 418
    col: 8
    role: z
    text: 侑食之官干繚缺皆名也
  - page: 418
    col: 9
    role: j
    text: 鼓方叔入於河
  - page: 418
    col: 10
    role: z
    text: 鼓擊鼓者方叔名河河内
  - page: 418
    col: 11
    role: j
    text: 播鼗武入於漢
  - page: 418
    col: 12
    role: z
    text: 鼗徒刀反○播揺也鼗小鼓兩旁有
  - page: 418
    col: 13
    role: z
    text: 耳持其柄而揺之則旁耳還自擊武
  - page: 418
    col: 14
    role: z
    text: 名也漢漢中
  - page: 418
    col: 15
    role: j
    text: 少師陽擊磬襄入於海
  - page: 418
    col: 16
    role: z
    text: 少去聲○少師樂官之佐陽襄二人
  - page: 419
    col: 1
    role: z
    text: 名襄即孔子所從學琴者海海島也
  - page: 419
    col: 2
    role: z
    text: 此記賢人之隱遁以附前章然未必
  - page: 419
    col: 3
    role: z
    text: 夫子之言也末章放此○張子曰周
  - page: 419
    col: 4
    role: z
    text: 衰樂廢夫子自衛反魯一甞治之其
  - page: 419
    col: 5
    role: z
    text: 後伶人賤工識樂之正及魯益衰三
  - page: 419
    col: 6
    role: z
    text: 威僭妄自太師以下皆知散之四方
  - page: 419
    col: 7
    role: z
    text: 逾河蹈海以去亂聖人俄頃之助功
  - page: 419
    col: 8
    role: z
    text: 化如此如有用我期月而可豈虛語
  - page: 419
    col: 9
    role: z
    text: 哉
  - page: 419
    col: 10
    role: j
    text: 周公謂魯公曰君子不施其親不使大
  - page: 419
    col: 11
    role: j
    text: 臣怨乎不以故舊無大故則不棄也無
  - page: 419
    col: 12
    role: j
    text: 求備於一人
  - page: 419
    col: 13
    role: z
    text: 施陸氏本作弛詩紙反福本同○魯
  - page: 419
    col: 14
    role: z
    text: 公周公子伯禽也弛遺棄也以用也
  - page: 419
    col: 15
    role: z
    text: 大臣非其人則去之在其位則不可
  - page: 419
    col: 16
    role: z
    text: 不用大故謂惡逆○李氏曰四者皆
  - page: 420
    col: 1
    role: z
    text: 君子之事忠厚之至也○胡氏曰此
  - page: 420
    col: 2
    role: z
    text: 伯禽受封之國周公訓戒之辭魯人
  - page: 420
    col: 3
    role: z
    text: 傳誦久而不忘也其或夫子嘗與門
  - page: 420
    col: 4
    role: z
    text: 弟子言之歟
  - page: 420
    col: 5
    role: j
    text: 周有八士伯達伯适仲突仲忽叔夜叔
  - page: 420
    col: 6
    role: j
    text: 夏季隨季騧
  - page: 420
    col: 7
    role: z
    text: 騧烏瓜反○或曰成王時人或曰宣
  - page: 420
    col: 8
    role: z
    text: 王時人蓋一母四乳而生八子也然
  - page: 420
    col: 9
    role: z
    text: 不可考矣○張子曰記善人之多也
  - page: 420
    col: 10
    role: z
    text: 愚按此篇孔子於三仁逸民師摯八
  - page: 420
    col: 11
    role: z
    text: 士既皆稱贊而品列之於接輿沮溺
  - page: 420
    col: 12
    role: z
    text: 丈人又每有惓惓接引之意衰世之
  - page: 420
    col: 13
    role: z
    text: 志也其所感者深矣在陳之嘆蓋亦
  - page: 420
    col: 14
    role: z
    text: 如此三仁則無間然矣其餘數君子
  - page: 420
    col: 15
    role: z
    text: 者亦皆一世之高士若使得聞聖人
  - page: 420
    col: 16
    role: z
    text: 之道以裁其所過而勉其所不及則
  - page: 421
    col: 1
    role: z
    text: 其所立豈止於此而已哉
  - page: 421
    col: 4
    role: j
    text: 論語卷第九
