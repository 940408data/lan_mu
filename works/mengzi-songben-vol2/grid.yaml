labels:
  - page: 45
    col: 9
    role: j
    text: 孟子卷第二朱熹集注
  - page: 45
    col: 10
    role: j
    text: 梁惠王章句下
  - page: 45
    col: 11
    role: z
    text: 凡十六章
  - page: 45
    col: 12
    role: j
    text: 莊暴見孟子曰暴見於王王語暴以好
  - page: 45
    col: 13
    role: j
    text: 樂暴未有以對也曰好樂何如孟子曰
  - page: 45
    col: 14
    role: j
    text: 王之好樂甚則齊國其庶幾乎
  - page: 45
    col: 15
    role: j
    text: 見於之見音現下見於同語去聲下
  - page: 45
    col: 16
    role: j
    text: 同好去聲篇內並同○莊暴齊臣也
  - page: 46
    col: 1
    role: z
    text: 庶幾近辭也言近於治
  - page: 46
    col: 2
    role: j
    text: 他日見於王曰王嘗語莊子以好樂有
  - page: 46
    col: 3
    role: j
    text: 諸王變乎色曰寡人非能好先王之樂
  - page: 46
    col: 4
    role: j
    text: 也直好世俗之樂耳
  - page: 46
    col: 5
    role: z
    text: 變色者慚其好之不正也
  - page: 46
    col: 6
    role: j
    text: 曰王之好樂甚則齊其庶幾乎今之樂
  - page: 46
    col: 7
    role: j
    text: 猶古之樂也
  - page: 46
    col: 8
    role: z
    text: 今樂世俗之樂古樂先王之樂
  - page: 46
    col: 9
    role: j
    text: 曰可得聞與曰獨樂樂與人樂樂孰樂
  - page: 46
    col: 10
    role: j
    text: 曰不若與人曰與少樂樂與衆樂樂孰
  - page: 46
    col: 11
    role: j
    text: 樂曰不若與衆
  - page: 46
    col: 12
    role: z
    text: 聞與之與平聲樂樂下字音洛孰樂
  - page: 46
    col: 13
    role: z
    text: 亦音洛○獨樂不若與人與少樂不
  - page: 46
    col: 14
    role: z
    text: 若與衆亦人之常情也
  - page: 46
    col: 15
    role: j
    text: 臣請爲王言樂
  - page: 46
    col: 16
    role: z
    text: 爲去聲○此以下皆孟子之言也
  - page: 47
    col: 1
    role: j
    text: 今王鼓樂於此百姓聞王鍾鼓之聲管
  - page: 47
    col: 2
    role: j
    text: 籥之音舉疾首蹙頞而相告曰吾王之
  - page: 47
    col: 3
    role: j
    text: 好鼓樂夫何使我至於此極也父子不
  - page: 47
    col: 4
    role: j
    text: 相見兄弟妻子離散今王田獵於此百
  - page: 47
    col: 5
    role: j
    text: 姓聞王車馬之音見羽旄之美舉疾首
  - page: 47
    col: 6
    role: j
    text: 蹙頞而相告曰吾王之好田獵夫何使
  - page: 47
    col: 7
    role: j
    text: 我至於此極也父子不相見兄弟妻子
  - page: 47
    col: 8
    role: j
    text: 離散此無他不與民同樂也
  - page: 47
    col: 9
    role: z
    text: 蹙子六反頞音遏夫音扶同樂之樂
  - page: 47
    col: 10
    role: z
    text: 音洛○鍾鼓管籥皆樂器也舉皆也
  - page: 47
    col: 11
    role: z
    text: 疾首頭痛也蹙聚也頞額也人憂戚
  - page: 47
    col: 12
    role: z
    text: 則蹙其額極窮也羽旄旌屬不與民
  - page: 47
    col: 13
    role: z
    text: 同樂謂獨樂其身而不恤其民使之
  - page: 47
    col: 14
    role: z
    text: 窮困也
  - page: 47
    col: 15
    role: j
    text: 今王鼓樂於此百姓聞王鍾鼓之聲管
  - page: 47
    col: 16
    role: j
    text: 籥之音舉欣欣然有喜色而相告曰吾王
  - page: 48
    col: 1
    role: j
    text: 庶幾無疾病與何以能鼓樂也今王田獵
  - page: 48
    col: 2
    role: j
    text: 於此百姓聞王車馬之音見羽旄之美舉
  - page: 48
    col: 3
    role: j
    text: 欣欣然有喜色而相告曰吾王庶幾無疾
  - page: 48
    col: 4
    role: j
    text: 病與何以能田獵也此無他與民同樂也
  - page: 48
    col: 5
    role: j
    text: 病與之與平聲同樂之樂音洛○與
  - page: 48
    col: 6
    role: j
    text: 民同樂者推好樂之心以行仁政使
  - page: 48
    col: 7
    role: z
    text: 民各得其所也
  - page: 48
    col: 8
    role: j
    text: 今王與百姓同樂則王矣
  - page: 48
    col: 9
    role: z
    text: 好樂而能與百姓同之則天下之民
  - page: 48
    col: 10
    role: z
    text: 歸之矣所謂齊其庶幾者如此○范
  - page: 48
    col: 11
    role: z
    text: 氏曰戰國之時民窮財盡人君獨以
  - page: 48
    col: 12
    role: z
    text: 南面之樂自奉其身孟子切於救民
  - page: 48
    col: 13
    role: z
    text: 故因齊王之好樂開導其善心深勸
  - page: 48
    col: 14
    role: z
    text: 其與民同樂而謂今樂猶古樂其實
  - page: 48
    col: 15
    role: z
    text: 今樂古樂何可同也但與民同樂之
  - page: 48
    col: 16
    role: z
    text: 意則無古今之異耳若必欲以禮樂
  - page: 49
    col: 1
    role: z
    text: 治天下當如孔子之言必用韶舞必
  - page: 49
    col: 2
    role: z
    text: 放鄭聲蓋孔子之言爲邦之正道孟
  - page: 49
    col: 3
    role: z
    text: 子之言救時之急務所以不同楊氏
  - page: 49
    col: 4
    role: z
    text: 曰樂以和爲主使人鍾鼓管絃之之
  - page: 49
    col: 5
    role: z
    text: 音而疾首蹙頞則雖奏以咸英韶濩
  - page: 49
    col: 6
    role: z
    text: 無補於治也故孟子告齊王以此姑
  - page: 49
    col: 7
    role: z
    text: 正其本而已
  - page: 49
    col: 8
    role: j
    text: 齊宣王問曰文王之囿方七十里有諸
  - page: 49
    col: 9
    role: j
    text: 孟子對曰於傳有之
  - page: 49
    col: 10
    role: z
    text: 囿音又傳直戀反○囿者蕃育鳥獸
  - page: 49
    col: 11
    role: z
    text: 之所古者四時之田皆於農隙以講
  - page: 49
    col: 12
    role: z
    text: 武事然不欲馳騖於稼穡場圃之中
  - page: 49
    col: 13
    role: z
    text: 故度間曠之地以爲囿然文王七十
  - page: 49
    col: 14
    role: z
    text: 里之囿其亦三分天下有其二之後
  - page: 49
    col: 15
    role: z
    text: 也與傳謂古書
  - page: 49
    col: 16
    role: j
    text: 曰若是其大乎曰民猶以爲小也曰寡
  - page: 50
    col: 1
    role: j
    text: 人之囿方四十里民猶以為大何也曰
  - page: 50
    col: 2
    role: j
    text: 文王之囿方七十里芻蕘者往焉雉兔
  - page: 50
    col: 3
    role: j
    text: 者往焉與民同之民以為小不亦宜乎
  - page: 50
    col: 4
    role: z
    text: 芻音初蕘音饒芻草也蕘薪也
  - page: 50
    col: 5
    role: j
    text: 臣始至於境問國之大禁然後敢入臣
  - page: 50
    col: 6
    role: j
    text: 聞郊關之内有囿方四十里殺其麋鹿
  - page: 50
    col: 7
    role: j
    text: 者如殺人之罪則是方四十里為阱於
  - page: 50
    col: 8
    role: j
    text: 國中民以為大不亦宜乎
  - page: 50
    col: 9
    role: z
    text: 阱才性反○禮入國而問禁國外百
  - page: 50
    col: 10
    role: j
    text: 里為郊郊外有關阱坎地以陷獸者
  - page: 50
    col: 11
    role: z
    text: 言陷民於死也
  - page: 50
    col: 12
    role: j
    text: 齊宣王問曰交鄰國有道乎孟子對曰
  - page: 50
    col: 13
    role: j
    text: 有惟仁者為能以大事小是故湯事葛
  - page: 50
    col: 14
    role: j
    text: 文王事昆夷惟智者為能以小事大故
  - page: 50
    col: 15
    role: j
    text: 大王事獯鬻句踐事吳
  - page: 50
    col: 16
    role: z
    text: 獯音熏鬻音育句音鈎○仁人之心
  - page: 51
    col: 1
    role: z
    text: 寬洪惻怛而無較計大小彊弱之私
  - page: 51
    col: 2
    role: z
    text: 故小國雖或不恭而吾所以字之之
  - page: 51
    col: 3
    role: z
    text: 心自不能已智者明義理識時勢故
  - page: 51
    col: 4
    role: z
    text: 大國雖見侵陵而吾所以事之之禮
  - page: 51
    col: 5
    role: z
    text: 尤不敢廢湯事見後篇文王事見詩
  - page: 51
    col: 6
    role: z
    text: 大雅大王事見後章所謂狄人即獯
  - page: 51
    col: 7
    role: z
    text: 鬻也句踐越王名事見國語史記
  - page: 51
    col: 8
    role: j
    text: 以大事小者樂天者也以小事大者畏
  - page: 51
    col: 9
    role: j
    text: 天者也樂天者保天下畏天者保其國
  - page: 51
    col: 10
    role: z
    text: 樂音洛○天者理而已矣大之字小
  - page: 51
    col: 11
    role: z
    text: 小之事大皆理之當然也自然合理
  - page: 51
    col: 12
    role: z
    text: 故曰樂天不敢違理故曰畏天包含
  - page: 51
    col: 13
    role: z
    text: 徧覆無不周遍保天下之氣象也制
  - page: 51
    col: 14
    role: z
    text: 節謹度不敢縱逸保一國之規模也
  - page: 51
    col: 15
    role: j
    text: 詩云畏天之威于時保之
  - page: 51
    col: 16
    role: z
    text: 周頌我將之篇時是也
  - page: 52
    col: 1
    role: j
    text: 王曰大哉言矣寡人有疾寡人好勇
  - page: 52
    col: 2
    role: j
    text: 言以好勇故不能事大而恤小也
  - page: 52
    col: 3
    role: j
    text: 對曰王請無好小勇夫撫劒疾視曰彼
  - page: 52
    col: 4
    role: j
    text: 惡敢當我哉此匹夫之勇敵一人者也
  - page: 52
    col: 5
    role: j
    text: 王請大之
  - page: 52
    col: 6
    role: z
    text: 夫撫之夫音扶惡平聲○疾視怒目
  - page: 52
    col: 7
    role: z
    text: 而視也小勇血氣所爲大勇義理所
  - page: 52
    col: 8
    role: z
    text: 發
  - page: 52
    col: 9
    role: j
    text: 詩云王赫斯怒爰整其旅以遏徂莒以
  - page: 52
    col: 10
    role: j
    text: 篤周祜以對于天下此文王之勇也文
  - page: 52
    col: 11
    role: j
    text: 王一怒而安天下之民
  - page: 52
    col: 12
    role: j
    text: 詩大雅皇矣篇赫赫然怒貌爰於也
  - page: 52
    col: 13
    role: z
    text: 旅衆也遏詩作按止也徂往也莒詩
  - page: 52
    col: 14
    role: j
    text: 作旅徂旅謂宻人侵阮徂共之衆也
  - page: 52
    col: 15
    role: z
    text: 篤厚也祜福也對答也以答天下仰
  - page: 52
    col: 16
    role: z
    text: 望之心也此文王之大勇也
  - page: 53
    col: 1
    role: j
    text: 書曰天降下民作之君作之師惟曰其
  - page: 53
    col: 2
    role: j
    text: 助上帝寵之四方有罪無罪惟我在天
  - page: 53
    col: 3
    role: j
    text: 下曷敢有越厥志一人衡行於天下武
  - page: 53
    col: 4
    role: j
    text: 王恥之此武王之勇也而武王亦一怒
  - page: 53
    col: 5
    role: j
    text: 而安天下之民
  - page: 53
    col: 6
    role: z
    text: 衡與橫同○書周書泰誓之篇也然
  - page: 53
    col: 7
    role: z
    text: 所引與今書文小異今且依此解之
  - page: 53
    col: 8
    role: z
    text: 寵之四方寵異之於四方也有罪者
  - page: 53
    col: 9
    role: z
    text: 我得而誅之無罪者我得而安之我
  - page: 53
    col: 10
    role: z
    text: 旣在此則天下何敢有過越其心志
  - page: 53
    col: 11
    role: z
    text: 而作亂者乎衡行謂作亂也孟子釋
  - page: 53
    col: 12
    role: z
    text: 書意如此而言武王亦大勇也
  - page: 53
    col: 13
    role: j
    text: 今王亦一怒而安天下之民民惟恐王
  - page: 53
    col: 14
    role: j
    text: 之不好勇也
  - page: 53
    col: 15
    role: z
    text: 王若能如文武之爲則天下之民望
  - page: 53
    col: 16
    role: z
    text: 其一怒以除暴亂而拯己於水火之
  - page: 54
    col: 1
    role: z
    text: 中惟恐王之不好勇耳○此章言人
  - page: 54
    col: 2
    role: z
    text: 君能懲小忿則能恤小事大以交鄰
  - page: 54
    col: 3
    role: z
    text: 國能養大勇則能除暴救民以安天
  - page: 54
    col: 4
    role: z
    text: 下張敬夫曰小勇者血氣之怒也大
  - page: 54
    col: 5
    role: z
    text: 勇者理義之怒也血氣之怒不可有
  - page: 54
    col: 6
    role: z
    text: 理義之怒不可無知此則可以見性
  - page: 54
    col: 7
    role: z
    text: 情之正而識天理人欲之分矣
  - page: 54
    col: 8
    role: j
    text: 齊宣王見孟子於雪宫王曰賢者亦有
  - page: 54
    col: 9
    role: j
    text: 此樂乎孟子對曰有人不得則非其上
  - page: 54
    col: 10
    role: j
    text: 矣
  - page: 54
    col: 11
    role: z
    text: 樂音洛下同○雪宫離宫名言人君
  - page: 54
    col: 12
    role: z
    text: 能與民同樂則人皆有此樂不然則
  - page: 54
    col: 13
    role: z
    text: 下之不得此樂者必有非其君上之
  - page: 54
    col: 14
    role: z
    text: 心明人君當與民同樂不可使人有
  - page: 54
    col: 15
    role: z
    text: 不得者非但當與賢者共之而已也
  - page: 54
    col: 16
    role: j
    text: 不得而非其上者非也爲民上而不與
  - page: 55
    col: 1
    role: j
    text: 民同樂者亦非也
  - page: 55
    col: 2
    role: z
    text: 下不安分上不恤民皆非理也
  - page: 55
    col: 3
    role: j
    text: 樂民之樂者民亦樂其樂憂民之憂者
  - page: 55
    col: 4
    role: j
    text: 民亦憂其憂樂以天下憂以天下然而
  - page: 55
    col: 5
    role: j
    text: 不王者未之有也
  - page: 55
    col: 6
    role: z
    text: 樂民之樂而民樂其樂則樂以天下
  - page: 55
    col: 7
    role: z
    text: 矣憂民之憂而民憂其憂則憂以天
  - page: 55
    col: 8
    role: z
    text: 下矣
  - page: 55
    col: 9
    role: j
    text: 昔者齊景公問於晏子曰吾欲觀於轉
  - page: 55
    col: 10
    role: j
    text: 附朝儛遵海而南放于琅邪吾何脩而
  - page: 55
    col: 11
    role: j
    text: 可以比於先王觀也
  - page: 55
    col: 12
    role: z
    text: 朝音潮放上聲○晏子齊臣名嬰轉
  - page: 55
    col: 13
    role: z
    text: 附朝儛皆山名也遵循也放至也琅
  - page: 55
    col: 14
    role: z
    text: 邪齊東南境上邑名觀游也
  - page: 55
    col: 15
    role: j
    text: 晏子對曰善哉問也天子適諸侯曰巡
  - page: 55
    col: 16
    role: j
    text: 狩巡狩者巡所守也諸侯朝於天子曰
  - page: 56
    col: 1
    role: j
    text: 述職述職者述所職也無非事者春省
  - page: 56
    col: 2
    role: j
    text: 耕而補不足秋省歛而助不給夏諺曰
  - page: 56
    col: 3
    role: j
    text: 吾王不遊吾何以休吾王不豫吾何以
  - page: 56
    col: 4
    role: j
    text: 助一遊一豫爲諸侯度
  - page: 56
    col: 5
    role: z
    text: 狩舒救反省悉井反○述陳也省視
  - page: 56
    col: 6
    role: z
    text: 也歛收穫也給亦足也夏諺夏時之
  - page: 56
    col: 7
    role: z
    text: 俗語也豫樂也巡所守巡行諸侯所
  - page: 56
    col: 8
    role: z
    text: 守之土也述所職陳其所受之職也
  - page: 56
    col: 9
    role: z
    text: 皆無有無事而空行者而又春秋循
  - page: 56
    col: 10
    role: z
    text: 行郊野察民之所不足而補助之故
  - page: 56
    col: 11
    role: z
    text: 夏諺以爲王者一遊一豫皆有恩惠
  - page: 56
    col: 12
    role: z
    text: 以及民而諸侯皆取法焉不敢無事
  - page: 56
    col: 13
    role: z
    text: 慢遊以病其民也
  - page: 56
    col: 14
    role: j
    text: 今也不然師行而糧食飢者弗食勞者
  - page: 56
    col: 15
    role: j
    text: 弗息睊睊胥讒民乃作慝方命虐民飲
  - page: 56
    col: 16
    role: j
    text: 食若流流連荒亡爲諸侯憂
  - page: 57
    col: 1
    role: z
    text: 睊古縣反○今謂晏子時也師衆也
  - page: 57
    col: 2
    role: j
    text: 千二百五十人爲師春秋傳曰君行師
  - page: 57
    col: 3
    role: z
    text: 從糧謂糗糒之屬睊睊側目貌胥相
  - page: 57
    col: 4
    role: z
    text: 也讒謗也慝怨惡也言民不勝其勞
  - page: 57
    col: 5
    role: z
    text: 而起謗怨也方逆也命王命也若流
  - page: 57
    col: 6
    role: z
    text: 如水之流無窮極也流連荒亡解見
  - page: 57
    col: 7
    role: z
    text: 下文諸侯謂附庸之國縣邑之長
  - page: 57
    col: 8
    role: j
    text: 從流下而忘反謂之流從流上而忘反
  - page: 57
    col: 9
    role: j
    text: 謂之連從獸無厭謂之荒樂酒無厭謂
  - page: 57
    col: 10
    role: j
    text: 之云
  - page: 57
    col: 11
    role: z
    text: 厭平聲○此釋上文之義也從流下
  - page: 57
    col: 12
    role: z
    text: 謂放舟隨水而下從流上謂挽舟逆
  - page: 57
    col: 13
    role: z
    text: 水而上從獸田獵也荒廢也樂酒以
  - page: 57
    col: 14
    role: z
    text: 飲酒爲樂也云猶失也言廢時失事
  - page: 57
    col: 15
    role: z
    text: 也
  - page: 57
    col: 16
    role: j
    text: 先王無流連之樂荒亡之行
  - page: 58
    col: 1
    role: z
    text: 行去聲
  - page: 58
    col: 2
    role: j
    text: 惟君所行也
  - page: 58
    col: 3
    role: z
    text: 言先王之法今時之弊二者惟在君
  - page: 58
    col: 4
    role: z
    text: 所行耳
  - page: 58
    col: 5
    role: j
    text: 景公說大戒於國出舍於郊於是始興
  - page: 58
    col: 6
    role: j
    text: 發補不足召太師曰爲我作君臣相說
  - page: 58
    col: 7
    role: j
    text: 之樂蓋徵招角招是也其詩曰畜君何
  - page: 58
    col: 8
    role: j
    text: 尤畜君者好君也
  - page: 58
    col: 9
    role: z
    text: 說音悅爲去聲樂如字徵陟里反招
  - page: 58
    col: 10
    role: z
    text: 與韶同畜敕六反○戒告命也出舍
  - page: 58
    col: 11
    role: z
    text: 自責以省民也興發發倉廩也太師
  - page: 58
    col: 12
    role: z
    text: 樂官也君臣已與晏子也樂有五聲
  - page: 58
    col: 13
    role: z
    text: 三曰角爲民四曰徵爲事招舜樂也
  - page: 58
    col: 14
    role: z
    text: 其詩徵招角招之詩也尤過也言晏
  - page: 58
    col: 15
    role: z
    text: 子能畜止其君之欲宜爲君之所尤
  - page: 58
    col: 16
    role: z
    text: 然其心則何過哉孟子釋之以爲臣
  - page: 59
    col: 1
    role: j
    text: 能畜止其君之欲乃是愛其君也
  - page: 59
    col: 2
    role: z
    text: ○尹氏曰君之與民貴賤雖不同然
  - page: 59
    col: 3
    role: j
    text: 其心未始有異也孟子之言可謂深
  - page: 59
    col: 4
    role: j
    text: 切矣齊王不能推而用之惜哉
  - page: 59
    col: 5
    role: j
    text: 齊宣王問曰人皆謂我毀明堂毀諸已
  - page: 59
    col: 6
    role: j
    text: 乎
  - page: 59
    col: 7
    role: z
    text: 趙氏曰明堂太山明堂周天子東巡
  - page: 59
    col: 8
    role: j
    text: 守朝諸侯之處漢時遺址尚在人欲
  - page: 59
    col: 9
    role: j
    text: 毀之者蓋以天子不復巡守諸侯也
  - page: 59
    col: 10
    role: j
    text: 不當居之也王問當毀之乎且止乎
  - page: 59
    col: 11
    role: j
    text: 孟子對曰夫明堂者王者之堂也王欲
  - page: 59
    col: 12
    role: j
    text: 行王政則勿毀之矣
  - page: 59
    col: 13
    role: z
    text: 夫音扶○明堂王者所居以出政令
  - page: 59
    col: 14
    role: j
    text: 之所也能行王政則亦可以王矣何
  - page: 59
    col: 15
    role: j
    text: 必毀哉
  - page: 59
    col: 16
    role: j
    text: 王曰王政可得聞與對曰昔者文王之
  - page: 60
    col: 1
    role: j
    text: 治歧也耕者九一仕者世禄關市譏而
  - page: 60
    col: 2
    role: j
    text: 不征澤梁無禁罪人不孥老而無妻曰
  - page: 60
    col: 3
    role: j
    text: 鰥老而無夫曰寡老而無子曰獨幼而
  - page: 60
    col: 4
    role: j
    text: 無父曰孤此四者天下之窮民而無告
  - page: 60
    col: 5
    role: j
    text: 者文王發政施仁必先斯四者詩云哿
  - page: 60
    col: 6
    role: j
    text: 矣富人哀此煢獨
  - page: 60
    col: 7
    role: z
    text: 與平聲孥音奴鰥姑頑反哿工可反
  - page: 60
    col: 8
    role: z
    text: 煢音瓊○歧周之舊國也九一者井
  - page: 60
    col: 9
    role: z
    text: 田之制也方一里為一井其田九百
  - page: 60
    col: 10
    role: z
    text: 畝中畫井字界為九區一區之中為
  - page: 60
    col: 11
    role: z
    text: 田百畝中百畝為公田外八百畝為
  - page: 60
    col: 12
    role: z
    text: 私田八家各受私田百畝而同養公
  - page: 60
    col: 13
    role: z
    text: 田是九分而稅其一也世禄者先王
  - page: 60
    col: 14
    role: z
    text: 之世仕者之子孫皆教之教之而成
  - page: 60
    col: 15
    role: z
    text: 材則官之如不足用亦使之不失其
  - page: 60
    col: 16
    role: z
    text: 禄蓋其先世嘗有功德於民故報之
  - page: 61
    col: 1
    role: z
    text: 如此忠厚之至也關謂道路之關市
  - page: 61
    col: 2
    role: z
    text: 謂都邑之市譏察也征稅也關市之
  - page: 61
    col: 3
    role: z
    text: 吏察異服異言之人而不征商賈之
  - page: 61
    col: 4
    role: z
    text: 稅也澤謂瀦水梁謂魚梁與民同利
  - page: 61
    col: 5
    role: z
    text: 不設禁也孥妻子也惡惡止其身不
  - page: 61
    col: 6
    role: z
    text: 及妻子也先王養民之政導其妻子
  - page: 61
    col: 7
    role: z
    text: 使之養其老而恤其幼不幸而有鰥
  - page: 61
    col: 8
    role: z
    text: 寡孤獨之人無父母妻子之養則尤
  - page: 61
    col: 9
    role: z
    text: 宜憐恤故必以爲先也詩小雅正月
  - page: 61
    col: 10
    role: z
    text: 之篇哿可也煢困悴貌
  - page: 61
    col: 11
    role: j
    text: 王曰善哉言乎曰王如善之則何爲不
  - page: 61
    col: 12
    role: j
    text: 行王曰寡人有疾寡人好貨對曰昔者
  - page: 61
    col: 13
    role: j
    text: 公劉好貨詩云乃積乃倉乃裹餱糧于
  - page: 61
    col: 14
    role: j
    text: 橐于囊思戢用光弓矢斯張干戈戚揚
  - page: 61
    col: 15
    role: j
    text: 爰方啓行故居者有積倉行者有裹糧
  - page: 61
    col: 16
    role: j
    text: 也然後可以爰方啓行王如好貨與百
  - page: 62
    col: 1
    role: j
    text: 姓同之於王何有
  - page: 62
    col: 2
    role: z
    text: 篌音侯橐音托戢詩作輯音集○王
  - page: 62
    col: 3
    role: z
    text: 自以爲好貨故取民無制而不能行
  - page: 62
    col: 4
    role: z
    text: 此王政公劉后稷之曾孫也詩大雅
  - page: 62
    col: 5
    role: z
    text: 公劉之篇積露積也篌乾糧也無底
  - page: 62
    col: 6
    role: z
    text: 曰橐有底曰囊皆所以盛篌糧也戢
  - page: 62
    col: 7
    role: z
    text: 安集也言思安集其民人以光大其
  - page: 62
    col: 8
    role: z
    text: 國家也戚斧也揚鉞也爰於也啓行
  - page: 62
    col: 9
    role: z
    text: 言往遷于豳也何有言不難也孟子
  - page: 62
    col: 10
    role: z
    text: 言公劉之民富足如此是公劉好貨
  - page: 62
    col: 11
    role: z
    text: 而能推己之心以及民也今王好貨
  - page: 62
    col: 12
    role: z
    text: 亦能如此則其於王天下也何難之
  - page: 62
    col: 13
    role: z
    text: 有
  - page: 62
    col: 14
    role: j
    text: 王曰寡人有疾寡人好色對曰昔者太
  - page: 62
    col: 15
    role: j
    text: 王好色愛厥妃詩云古公亶甫來朝走
  - page: 62
    col: 16
    role: j
    text: 馬率西水滸至于岐下爰及姜女聿來
  - page: 63
    col: 1
    role: j
    text: 胥字當是時也内無怨女外無曠夫王
  - page: 63
    col: 2
    role: j
    text: 如好色與百姓同之於王何有
  - page: 63
    col: 3
    role: j
    text: 大音泰○王又言此者好色則心志
  - page: 63
    col: 4
    role: j
    text: 蠱惑用度奢侈而不能行王政也大
  - page: 63
    col: 5
    role: j
    text: 王公劉九世孫詩大雅綿之篇也古
  - page: 63
    col: 6
    role: j
    text: 公大王之本號後乃追尊爲大王也
  - page: 63
    col: 7
    role: j
    text: 亶父大王名也來朝走馬避狄人之
  - page: 63
    col: 8
    role: j
    text: 難也率循也滸水厓也岐下岐山之
  - page: 63
    col: 9
    role: j
    text: 下也姜女大王之妃也胥相也宇居
  - page: 63
    col: 10
    role: j
    text: 也曠空也無怨曠者是大王好色而
  - page: 63
    col: 11
    role: j
    text: 能推己之心以及民也○楊氏曰孟
  - page: 63
    col: 12
    role: j
    text: 子與人君言皆所以擴充其善心而
  - page: 63
    col: 13
    role: j
    text: 格其非心不止就事論事若使爲人
  - page: 63
    col: 14
    role: j
    text: 臣者論事每如此豈不能堯舜其君
  - page: 63
    col: 15
    role: j
    text: 乎愚謂此篇自首章至此大意皆同
  - page: 63
    col: 16
    role: j
    text: 蓋鍾鼓苑囿游觀之樂與夫好勇好
  - page: 64
    col: 1
    role: z
    text: 貨好色之心皆天理之所有而人情
  - page: 64
    col: 2
    role: z
    text: 之所不能無者然天理人欲同行異
  - page: 64
    col: 3
    role: z
    text: 情循理而公於天下者聖賢之所以
  - page: 64
    col: 4
    role: z
    text: 盡其性也縱欲而私於一己者衆人
  - page: 64
    col: 5
    role: z
    text: 之所以滅其天也二者之間不能以
  - page: 64
    col: 6
    role: z
    text: 髮而其是非得失之歸相去遠矣故
  - page: 64
    col: 7
    role: z
    text: 孟子因時君之問而剖析於幾微之
  - page: 64
    col: 8
    role: z
    text: 際皆所以遏人欲而存天理其法似
  - page: 64
    col: 9
    role: z
    text: 䟽而實宻其事似易而實難學者以
  - page: 64
    col: 10
    role: z
    text: 身體之則有以識其非曲學阿世之
  - page: 64
    col: 11
    role: z
    text: 言而知所以克己復禮之端矣
  - page: 64
    col: 12
    role: j
    text: 孟子謂齊宣王曰王之臣有託其妻子
  - page: 64
    col: 13
    role: j
    text: 於其友而之楚遊者比其反也則凍餒
  - page: 64
    col: 14
    role: j
    text: 其妻子則如之何王曰棄之
  - page: 64
    col: 15
    role: z
    text: 比必二反○託寄也比及也棄絶也
  - page: 64
    col: 16
    role: j
    text: 曰士師不能治士則如之何王曰已之
  - page: 65
    col: 1
    role: z
    text: 士師獄官也其屬有鄉士遂士之官
  - page: 65
    col: 2
    role: z
    text: 士師皆當治之已罷去也
  - page: 65
    col: 3
    role: j
    text: 曰四境之内不治則如之何王顧左右
  - page: 65
    col: 4
    role: j
    text: 而言他
  - page: 65
    col: 5
    role: z
    text: 治去聲○孟子將問此而先設上二
  - page: 65
    col: 6
    role: z
    text: 事以發之及此而王不能答也其憚
  - page: 65
    col: 7
    role: z
    text: 於自責恥於下問如此不足與有爲
  - page: 65
    col: 8
    role: z
    text: 可知矣○趙氏曰言君臣上下各勤
  - page: 65
    col: 9
    role: z
    text: 其任無墮其職乃安其身
  - page: 65
    col: 10
    role: j
    text: 孟子見齊宣王曰所謂故國者非謂有
  - page: 65
    col: 11
    role: j
    text: 喬木之謂也有世臣之謂也王無親臣
  - page: 65
    col: 12
    role: j
    text: 矣昔者所進今日不知其亡也
  - page: 65
    col: 13
    role: z
    text: 世臣累世勳舊之臣與國同休戚者
  - page: 65
    col: 14
    role: z
    text: 也親臣君所親信之臣與君同休戚
  - page: 65
    col: 15
    role: z
    text: 者也此言喬木世臣皆故國所宜有
  - page: 65
    col: 16
    role: z
    text: 然所以爲故國者則在此而不在彼
  - page: 66
    col: 1
    role: z
    text: 也昨日所進用之人今日有亡去而
  - page: 66
    col: 2
    role: z
    text: 不知者則無親臣矣况世臣乎
  - page: 66
    col: 3
    role: j
    text: 王曰吾何以識其不才而舍之
  - page: 66
    col: 4
    role: z
    text: 舍上聲○王意以為此亡去者皆不
  - page: 66
    col: 5
    role: z
    text: 才之人我初不知而誤用之故今不
  - page: 66
    col: 6
    role: z
    text: 以其去為意耳因問何以先識其不
  - page: 66
    col: 7
    role: z
    text: 才而舍之耶
  - page: 66
    col: 8
    role: j
    text: 曰國君進賢如不得已將使卑踰尊疏
  - page: 66
    col: 9
    role: j
    text: 踰戚可不慎與
  - page: 66
    col: 10
    role: z
    text: 與平聲○如不得已言謹之至也蓋
  - page: 66
    col: 11
    role: z
    text: 尊尊親親禮之常也然或尊者親者
  - page: 66
    col: 12
    role: z
    text: 未必賢則必進疏遠之賢而用之是
  - page: 66
    col: 13
    role: z
    text: 使卑者踰尊疏者踰戚非禮之常故
  - page: 66
    col: 14
    role: z
    text: 不可不謹也
  - page: 66
    col: 15
    role: j
    text: 左右皆曰賢未可也諸大夫皆曰賢未
  - page: 66
    col: 16
    role: j
    text: 可也國人皆曰賢然後察之見賢焉然
  - page: 67
    col: 1
    role: j
    text: 後用之左右皆曰不可勿聽諸大夫皆
  - page: 67
    col: 2
    role: j
    text: 曰不可勿聽國人皆曰不可然後察之
  - page: 67
    col: 3
    role: j
    text: 見不可焉然後去之
  - page: 67
    col: 4
    role: z
    text: 去上聲○左右近臣其言固未可信
  - page: 67
    col: 5
    role: z
    text: 諸大夫之言宜可信矣然猶恐其蔽
  - page: 67
    col: 6
    role: z
    text: 於私也至於國人則其論公矣然猶
  - page: 67
    col: 7
    role: z
    text: 必察之者蓋人有同俗而爲衆所悅
  - page: 67
    col: 8
    role: z
    text: 者亦有特立而爲俗所憎者故必自
  - page: 67
    col: 9
    role: z
    text: 察之而親見其賢否之實然後從而
  - page: 67
    col: 10
    role: z
    text: 用捨之則於賢者知之深任之重而
  - page: 67
    col: 11
    role: z
    text: 不才者不得以幸進矣所謂進賢如
  - page: 67
    col: 12
    role: z
    text: 不得已者如此
  - page: 67
    col: 13
    role: j
    text: 左右皆曰可殺勿聽諸大夫皆曰可殺
  - page: 67
    col: 14
    role: j
    text: 勿聽國人皆曰可殺然後察之見可殺
  - page: 67
    col: 15
    role: j
    text: 焉然後殺之故曰國人殺之也
  - page: 67
    col: 16
    role: z
    text: 此言非獨以此進退人才至於用刑
  - page: 68
    col: 1
    role: z
    text: 亦以此道蓋所謂天命天討皆非人
  - page: 68
    col: 2
    role: z
    text: 君之所得私也
  - page: 68
    col: 3
    role: j
    text: 如此然後可以為民父母
  - page: 68
    col: 4
    role: z
    text: 傳曰民之所好好之民之所惡惡之
  - page: 68
    col: 5
    role: z
    text: 此謂民之父母
  - page: 68
    col: 6
    role: j
    text: 齊宣王問曰湯放桀武王伐紂有諸孟
  - page: 68
    col: 7
    role: j
    text: 子對曰於傳有之
  - page: 68
    col: 8
    role: z
    text: 傳直戀反○放置也書云成湯放桀
  - page: 68
    col: 9
    role: z
    text: 于南巢
  - page: 68
    col: 10
    role: j
    text: 曰臣弑其君可乎
  - page: 68
    col: 11
    role: z
    text: 桀紂天子湯武諸侯
  - page: 68
    col: 12
    role: j
    text: 曰賊仁者謂之賊賊義者謂之殘殘賊
  - page: 68
    col: 13
    role: j
    text: 之人謂之一夫聞誅一夫紂矣未聞弑
  - page: 68
    col: 14
    role: j
    text: 君也
  - page: 68
    col: 15
    role: z
    text: 賊害也殘傷也害仁者凶暴淫虐滅
  - page: 68
    col: 16
    role: z
    text: 絶天理故謂之賊害義者顛倒錯亂
  - page: 69
    col: 1
    role: z
    text: 傷敗彝倫故謂之殘一夫言衆叛親
  - page: 69
    col: 2
    role: z
    text: 離不復以爲君也書曰獨夫紂蓋四
  - page: 69
    col: 3
    role: z
    text: 海歸之則爲天子天下叛之則爲獨
  - page: 69
    col: 4
    role: z
    text: 夫所以深警齊王垂戒後世也○王
  - page: 69
    col: 5
    role: z
    text: 勉曰斯言也惟在下者有湯武之仁
  - page: 69
    col: 6
    role: z
    text: 而在上者有桀紂之暴則可不然是
  - page: 69
    col: 7
    role: z
    text: 未免於篡弑之罪也
  - page: 69
    col: 8
    role: j
    text: 孟子見齊宣王曰爲巨室則必使工師
  - page: 69
    col: 9
    role: j
    text: 求大木工師得大木則王喜以爲能勝
  - page: 69
    col: 10
    role: j
    text: 其任也匠人斵而小之則王怒以爲不
  - page: 69
    col: 11
    role: j
    text: 勝其任矣夫人幼而學之壯而欲行之
  - page: 69
    col: 12
    role: j
    text: 王曰姑舎女所學而從我則何如
  - page: 69
    col: 13
    role: z
    text: 勝平聲夫音扶舎上聲女音汝下同
  - page: 69
    col: 14
    role: z
    text: ○巨室大宫也工師匠人之長匠人
  - page: 69
    col: 15
    role: z
    text: 衆工人也姑且也言賢人所學者大
  - page: 69
    col: 16
    role: z
    text: 而王欲小之也
  - page: 70
    col: 1
    role: j
    text: 今有璞玉於此雖萬鎰必使玉人彫琢
  - page: 70
    col: 2
    role: j
    text: 之至於治國家則曰姑舎女所學而從
  - page: 70
    col: 3
    role: j
    text: 我則何以異於教玉人彫琢玉哉
  - page: 70
    col: 4
    role: z
    text: 鎰音溢○璞玉之在石中者鎰二十
  - page: 70
    col: 5
    role: z
    text: 兩也玉人玉工也不敢自治而付之
  - page: 70
    col: 6
    role: z
    text: 能者愛之甚也治國家則徇私欲而
  - page: 70
    col: 7
    role: z
    text: 不任賢是愛國家不如愛玉也○范
  - page: 70
    col: 8
    role: z
    text: 氏曰古之賢者常患人君不能行其
  - page: 70
    col: 9
    role: z
    text: 所學而世之庸君亦常患賢者不能
  - page: 70
    col: 10
    role: z
    text: 從其所好是以君臣相遇自古以為
  - page: 70
    col: 11
    role: z
    text: 難孔孟終身而不遇蓋以此耳
  - page: 70
    col: 12
    role: j
    text: 齊人伐燕勝之
  - page: 70
    col: 13
    role: z
    text: 按史記燕王噲讓國於其相子之而
  - page: 70
    col: 14
    role: z
    text: 國大亂齊因伐之燕士卒不戰城門
  - page: 70
    col: 15
    role: z
    text: 不閉遂大勝燕
  - page: 70
    col: 16
    role: j
    text: 宣王問曰或謂寡人勿取或謂寡人取
  - page: 71
    col: 1
    role: j
    text: 之以萬乘之國伐萬乘之國五旬而舉
  - page: 71
    col: 2
    role: j
    text: 之人力不至於此不取必有天殃取之
  - page: 71
    col: 3
    role: j
    text: 何如
  - page: 71
    col: 4
    role: z
    text: 乘去聲下同○以伐燕爲宣王事與
  - page: 71
    col: 5
    role: z
    text: 史記諸書不同巳見序說
  - page: 71
    col: 6
    role: j
    text: 孟子對曰取之而燕民悅則取之古之
  - page: 71
    col: 7
    role: j
    text: 人有行之者武王是也取之而燕民不
  - page: 71
    col: 8
    role: j
    text: 悅則勿取古之人有行之者文王是也
  - page: 71
    col: 9
    role: z
    text: 商紂之世文王三分天下有其二以
  - page: 71
    col: 10
    role: z
    text: 服事商至武王十三年乃伐紂而有
  - page: 71
    col: 11
    role: z
    text: 天下張子曰此事間不容髮一日之
  - page: 71
    col: 12
    role: z
    text: 間天命未絶則是君臣當日命絶則
  - page: 71
    col: 13
    role: z
    text: 爲獨夫然命之絶否何以知之人情
  - page: 71
    col: 14
    role: z
    text: 而巳諸侯不期而會者八百武王安
  - page: 71
    col: 15
    role: z
    text: 得而止之哉
  - page: 71
    col: 16
    role: j
    text: 以萬乘之國伐萬乘之國簞食壺漿以
  - page: 72
    col: 1
    role: j
    text: 迎王師豈有他哉避水火也如水益深
  - page: 72
    col: 2
    role: j
    text: 如火益熱亦運而已矣
  - page: 72
    col: 3
    role: z
    text: 簞音丹食音嗣○簞竹器食飯也運
  - page: 72
    col: 4
    role: z
    text: 轉也言齊若更爲暴虐則民將轉而
  - page: 72
    col: 5
    role: z
    text: 望救於他人矣○趙氏曰征伐之道
  - page: 72
    col: 6
    role: z
    text: 當順民心民心悅則天意得矣
  - page: 72
    col: 7
    role: j
    text: 齊人伐燕取之諸侯將謀救燕宣王曰
  - page: 72
    col: 8
    role: j
    text: 諸侯多謀伐寡人者何以待之孟子對
  - page: 72
    col: 9
    role: j
    text: 曰臣聞七十里爲政於天下者湯是也
  - page: 72
    col: 10
    role: j
    text: 未聞以千里畏人者也
  - page: 72
    col: 11
    role: z
    text: 千里畏人指齊王也
  - page: 72
    col: 12
    role: j
    text: 書曰湯一征自葛始天下信之東靣而
  - page: 72
    col: 13
    role: j
    text: 征西夷怨南靣而征北狄怨曰奚爲後
  - page: 72
    col: 14
    role: j
    text: 我民望之若大旱之望雲霓也歸市者
  - page: 72
    col: 15
    role: j
    text: 不止耕者不變誅其君而弔其民若時
  - page: 72
    col: 16
    role: j
    text: 雨降民大悅書曰徯我后后來其蘇
  - page: 73
    col: 1
    role: z
    text: 霓五稽反徯胡禮反○兩引書皆商
  - page: 73
    col: 2
    role: z
    text: 書仲虺之誥文也與今書文亦小異
  - page: 73
    col: 3
    role: z
    text: 一征初征也天下信之信其志在救
  - page: 73
    col: 4
    role: z
    text: 民不為暴也奚為後我言湯何為不
  - page: 73
    col: 5
    role: z
    text: 先來征我之國也霓虹也雲合則雨
  - page: 73
    col: 6
    role: z
    text: 虹見則止變動也徯待也后君也蘇
  - page: 73
    col: 7
    role: z
    text: 復生也他國之民皆以湯為我君而
  - page: 73
    col: 8
    role: z
    text: 待其來使已得蘇息也此言湯之所
  - page: 73
    col: 9
    role: z
    text: 以七十里而為政於天下也
  - page: 73
    col: 10
    role: j
    text: 今燕虐其民王往而征之民以為將拯
  - page: 73
    col: 11
    role: j
    text: 己於水火之中也簞食壺漿以迎王師
  - page: 73
    col: 12
    role: j
    text: 若殺其父兄係累其子弟毀其宗廟遷
  - page: 73
    col: 13
    role: j
    text: 其重器如之何其可也天下固畏齊之
  - page: 73
    col: 14
    role: j
    text: 疆也今又倍地而不行仁政是動天下
  - page: 73
    col: 15
    role: j
    text: 之兵也
  - page: 73
    col: 16
    role: z
    text: 累力追反○拯救也係累繫縛也重
  - page: 74
    col: 1
    role: z
    text: 器寳器也畏忌也倍地并燕而増一
  - page: 74
    col: 2
    role: z
    text: 倍之地也齊之取燕若能如湯之征
  - page: 74
    col: 3
    role: z
    text: 葛則燕人恱之而齊可爲政於天下
  - page: 74
    col: 4
    role: z
    text: 矣今乃不行仁政而肆爲殘虐則無
  - page: 74
    col: 5
    role: z
    text: 以慰燕民之望而服諸侯之心是以
  - page: 74
    col: 6
    role: z
    text: 不免乎以千里而畏人也
  - page: 74
    col: 7
    role: j
    text: 王速出令反其旄倪止其重器謀於燕
  - page: 74
    col: 8
    role: j
    text: 衆置君而後去之則猶可及止也
  - page: 74
    col: 9
    role: z
    text: 旄與耄同倪五稽反○反還也旄老
  - page: 74
    col: 10
    role: z
    text: 人也倪小兒也謂所虜略之老小也
  - page: 74
    col: 11
    role: z
    text: 猶尚也及止及其未發而止之也○
  - page: 74
    col: 12
    role: z
    text: 范氏曰孟子事齊梁之君論道德則
  - page: 74
    col: 13
    role: z
    text: 必稱堯舜論征伐則必稱湯武蓋治
  - page: 74
    col: 14
    role: z
    text: 民不法堯舜則是爲暴行師不法湯
  - page: 74
    col: 15
    role: z
    text: 武則是爲亂豈可謂吾君不能而舎
  - page: 74
    col: 16
    role: z
    text: 所學以徇之哉
  - page: 75
    col: 1
    role: j
    text: 鄒與魯閧穆公問曰吾有司死者三十
  - page: 75
    col: 2
    role: j
    text: 三人而民莫之死也誅之則不可勝誅
  - page: 75
    col: 3
    role: j
    text: 不誅則疾視其長上之死而不救如之
  - page: 75
    col: 4
    role: j
    text: 何則可也
  - page: 75
    col: 5
    role: z
    text: 關胡弄反勝平聲長上聲下同○關
  - page: 75
    col: 6
    role: z
    text: 鬬聲也穆公鄒君也不可勝誅言人
  - page: 75
    col: 7
    role: z
    text: 衆不可盡誅也長上謂有司也民怨
  - page: 75
    col: 8
    role: z
    text: 其上故疾視其死而不救也
  - page: 75
    col: 9
    role: j
    text: 孟子對曰凶年飢歲君之民老弱轉乎
  - page: 75
    col: 10
    role: j
    text: 溝壑壯者散而之四方者幾千人矣而
  - page: 75
    col: 11
    role: j
    text: 君之倉廩實府庫充有司莫以告是上
  - page: 75
    col: 12
    role: j
    text: 慢而殘下也曾子曰戒之戒之出乎爾
  - page: 75
    col: 13
    role: j
    text: 者反乎爾者也夫民今而後得反之也
  - page: 75
    col: 14
    role: j
    text: 君無尤焉
  - page: 75
    col: 15
    role: z
    text: 幾上聲夫音扶○轉飢餓輾轉而死
  - page: 75
    col: 16
    role: z
    text: 也充滿也上謂君及有司也尤過也
  - page: 76
    col: 1
    role: j
    text: 君行仁政斯民親其上死其長矣
  - page: 76
    col: 2
    role: j
    text: 君不仁而求富是以有司知重歛而
  - page: 76
    col: 3
    role: j
    text: 不知恤民故君行仁政則有司皆愛
  - page: 76
    col: 4
    role: j
    text: 其民而民亦愛之矣○范氏曰書曰
  - page: 76
    col: 5
    role: j
    text: 民惟邦本本固邦寧有倉廩府庫所
  - page: 76
    col: 6
    role: j
    text: 以爲民也豐年則歛之凶年則散之
  - page: 76
    col: 7
    role: j
    text: 恤其飢寒救其疾苦是以民親愛其
  - page: 76
    col: 8
    role: j
    text: 上有危難則赴救之如子弟之衛父
  - page: 76
    col: 9
    role: j
    text: 兄手足之捍頭目也穆公不能反己
  - page: 76
    col: 10
    role: j
    text: 猶欲歸罪於民豈不誤哉
  - page: 76
    col: 11
    role: j
    text: 滕文公問曰滕小國也間於齊楚事齊
  - page: 76
    col: 12
    role: j
    text: 乎事楚乎
  - page: 76
    col: 13
    role: z
    text: 間去聲○滕國名
  - page: 76
    col: 14
    role: j
    text: 孟子對曰是謀非吾所能及也無已則
  - page: 76
    col: 15
    role: j
    text: 有一焉鑿斯池也築斯城也與民守之
  - page: 76
    col: 16
    role: j
    text: 效死而民弗去則是可爲也
  - page: 77
    col: 1
    role: z
    text: 無已見前篇一謂一說也效猶致也
  - page: 77
    col: 2
    role: z
    text: 國君死社稷故致死以守國至於民
  - page: 77
    col: 3
    role: z
    text: 亦爲之死守而不去則非有以深得
  - page: 77
    col: 4
    role: z
    text: 其心者不能也○此章言有國者當
  - page: 77
    col: 5
    role: z
    text: 守義而愛民不可僥倖而苟免
  - page: 77
    col: 6
    role: j
    text: 滕文公問曰齊人將築薛吾甚恐如之
  - page: 77
    col: 7
    role: j
    text: 何則可
  - page: 77
    col: 8
    role: z
    text: 薛國名近滕齊取其地而城之故文
  - page: 77
    col: 9
    role: z
    text: 公以其偪已而恐也
  - page: 77
    col: 10
    role: j
    text: 孟子對曰昔者大王居邠狄人侵之去
  - page: 77
    col: 11
    role: j
    text: 之岐山之下居焉非擇而取之不得已
  - page: 77
    col: 12
    role: j
    text: 也
  - page: 77
    col: 13
    role: z
    text: 邠與豳同○邠地名言大王非以岐
  - page: 77
    col: 14
    role: z
    text: 下爲善擇取而居之也詳見下章
  - page: 77
    col: 15
    role: j
    text: 苟爲善後世子孫必有王者矣君子創
  - page: 77
    col: 16
    role: j
    text: 業垂統爲可繼也若夫成功則天也君
  - page: 78
    col: 1
    role: j
    text: 如彼何哉彊爲善而已矣
  - page: 78
    col: 2
    role: z
    text: 夫音扶彊上聲○創造統緒也言能
  - page: 78
    col: 3
    role: z
    text: 爲善則如大王雖失其地而其後世
  - page: 78
    col: 4
    role: z
    text: 遂有天下乃天理也然君子造基業
  - page: 78
    col: 5
    role: z
    text: 於前而垂統緒於後但能不失其正
  - page: 78
    col: 6
    role: z
    text: 令後世可繼續而行耳若夫成功則
  - page: 78
    col: 7
    role: z
    text: 豈可必乎彼齊也君之力既無如之
  - page: 78
    col: 8
    role: z
    text: 何則但彊於爲善使其可繼而俟命
  - page: 78
    col: 9
    role: z
    text: 於天耳○此章言人君但當竭力於
  - page: 78
    col: 10
    role: z
    text: 其所當爲不可徼幸於其所難必
  - page: 78
    col: 11
    role: j
    text: 滕文公問曰滕小國也竭力以事大國
  - page: 78
    col: 12
    role: j
    text: 則不得免焉如之何則可孟子對曰昔
  - page: 78
    col: 13
    role: j
    text: 者大王居邠狄人侵之事之以皮幣不
  - page: 78
    col: 14
    role: j
    text: 得免焉事之以犬馬不得免焉事之以
  - page: 78
    col: 15
    role: j
    text: 珠玉不得免焉乃屬其耆老而告之曰
  - page: 78
    col: 16
    role: j
    text: 狄人之所欲者吾土地也吾聞之也君
  - page: 79
    col: 1
    role: j
    text: 子不以其所以養人者害人二三子何
  - page: 79
    col: 2
    role: j
    text: 患乎無君我將去之去邠踰梁山邑于
  - page: 79
    col: 3
    role: j
    text: 岐山之下居焉邠人曰仁人也不可失
  - page: 79
    col: 4
    role: j
    text: 也從之者如歸市
  - page: 79
    col: 5
    role: z
    text: 屬音燭○皮謂虎豹麋鹿之皮也幣
  - page: 79
    col: 6
    role: z
    text: 帛也屬會集也土地本生物以養人
  - page: 79
    col: 7
    role: z
    text: 今争地而殺人是以其所以養人者
  - page: 79
    col: 8
    role: z
    text: 害人也邑作邑也歸市人衆而争先
  - page: 79
    col: 9
    role: z
    text: 也
  - page: 79
    col: 10
    role: j
    text: 或曰世守也非身之所能爲也效死勿
  - page: 79
    col: 11
    role: j
    text: 去
  - page: 79
    col: 12
    role: z
    text: 又言或謂土地乃先人所受而世守
  - page: 79
    col: 13
    role: z
    text: 之者非已所能專但當致死守之不
  - page: 79
    col: 14
    role: z
    text: 可捨去此國君死社稷之常法傳所
  - page: 79
    col: 15
    role: z
    text: 謂國滅君死之正也正謂此也
  - page: 79
    col: 16
    role: j
    text: 君請擇於斯二者
  - page: 80
    col: 1
    role: j
    text: 能如大王則避之不能則謹守常法
  - page: 80
    col: 2
    role: j
    text: 蓋遷國以圖存者權也守正而俟死
  - page: 80
    col: 3
    role: j
    text: 者義也審己量力擇而處之可也○
  - page: 80
    col: 4
    role: j
    text: 楊氏曰孟子之於文公始告之以效
  - page: 80
    col: 5
    role: j
    text: 死而已禮之正也至其甚恐則以大
  - page: 80
    col: 6
    role: j
    text: 王之事告之非得已也然無大王之
  - page: 80
    col: 7
    role: j
    text: 德而去則民或不從而遂至於亡則
  - page: 80
    col: 8
    role: j
    text: 又不若效死之爲愈故又請擇於斯
  - page: 80
    col: 9
    role: j
    text: 二者又曰孟子所論自世俗觀之則
  - page: 80
    col: 10
    role: j
    text: 可謂無謀矣然理之可爲者不過如
  - page: 80
    col: 11
    role: j
    text: 此舎此則必爲儀秦之爲矣凡事求
  - page: 80
    col: 12
    role: j
    text: 可功求成取必於智謀之末而不循
  - page: 80
    col: 13
    role: z
    text: 天理之正者非聖賢之道也
  - page: 80
    col: 14
    role: j
    text: 魯平公將出嬖人臧倉者請曰他日君
  - page: 80
    col: 15
    role: j
    text: 出則必命有司所之今乗輿已駕矣有
  - page: 80
    col: 16
    role: j
    text: 司未知所之敢請公曰將見孟子曰何
  - page: 81
    col: 1
    role: j
    text: 哉君所爲輕身以先於匹夫者以爲賢
  - page: 81
    col: 2
    role: j
    text: 乎禮義由賢者出而孟子之後喪踰前
  - page: 81
    col: 3
    role: j
    text: 喪君無見焉公曰諾
  - page: 81
    col: 4
    role: z
    text: 乘去聲○乘輿君車也駕駕馬也孟
  - page: 81
    col: 5
    role: z
    text: 子前喪父後喪母踰過也言其厚母
  - page: 81
    col: 6
    role: z
    text: 薄父也諾應辭也
  - page: 81
    col: 7
    role: j
    text: 樂正子入見曰君奚爲不見孟軻也曰
  - page: 81
    col: 8
    role: j
    text: 或告寡人曰孟子之後喪踰前喪是以
  - page: 81
    col: 9
    role: j
    text: 不往見也曰何哉君所謂踰者前以士
  - page: 81
    col: 10
    role: j
    text: 後以大夫前以三鼎而後以五鼎與曰
  - page: 81
    col: 11
    role: j
    text: 否謂棺槨衣衾之美也曰非所謂踰也
  - page: 81
    col: 12
    role: j
    text: 貧富不同也
  - page: 81
    col: 13
    role: z
    text: 入見之見音現與平聲○樂正子孟
  - page: 81
    col: 14
    role: z
    text: 子弟子也仕於魯三鼎士祭禮五鼎
  - page: 81
    col: 15
    role: z
    text: 大夫祭禮
  - page: 81
    col: 16
    role: j
    text: 樂正子見孟子曰克告於君君爲來見
  - page: 82
    col: 1
    role: j
    text: 也嬖人有臧倉者沮君君是以不果來
  - page: 82
    col: 2
    role: j
    text: 也曰行或使之止或尼之行止非人所
  - page: 82
    col: 3
    role: j
    text: 能也吾之不遇魯侯天也藏氏之子焉
  - page: 82
    col: 4
    role: j
    text: 能使予不遇哉
  - page: 82
    col: 5
    role: z
    text: 爲去聲沮慈吕反尼女乙反焉於虔
  - page: 82
    col: 6
    role: z
    text: 反○克樂正子名沮尼皆止之之意
  - page: 82
    col: 7
    role: z
    text: 也言人之行必有人使之者其止必
  - page: 82
    col: 8
    role: z
    text: 有人尼之者然其所以行所以止則
  - page: 82
    col: 9
    role: z
    text: 固有天命而非此人所能使亦非此
  - page: 82
    col: 10
    role: z
    text: 人所能尼也然則我之不遇豈藏倉
  - page: 82
    col: 11
    role: z
    text: 之所能爲哉○此章言聖賢之出處
  - page: 82
    col: 12
    role: z
    text: 關時運之盛衰乃天命之所爲非人
  - page: 82
    col: 13
    role: z
    text: 力之可及
