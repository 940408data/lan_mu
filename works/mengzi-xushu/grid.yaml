labels:
  - page: 2
    col: 1
    role: j
    text: 孟子朱熹集注序說
  - page: 2
    col: 2
    role: j
    text: 史記列傳曰孟軻趙氏曰孟子魯公族
  - page: 2
    col: 3
    role: z
    text: 孟孫之後漢書
  - page: 2
    col: 4
    role: j
    text: 注云字子車騶人也騶亦作鄒國名也
  - page: 2
    col: 5
    role: j
    text: 一說字子輿本邾國也受業
  - page: 2
    col: 6
    role: j
    text: 子思之門人子思孔子之孫名伋索字
  - page: 2
    col: 7
    role: z
    text: 隱云王劭以人爲衍字
  - page: 2
    col: 8
    role: j
    text: 而趙氏注及孔叢子等書亦皆云道
  - page: 2
    col: 9
    role: j
    text: 孟子親受業於子思未知是否
  - page: 2
    col: 10
    role: j
    text: 旣通書程子曰孟子曰可以仕則仕
  - page: 2
    col: 11
    role: z
    text: 趙氏曰孟子通五經尤長於詩
  - page: 2
    col: 12
    role: j
    text: 可以止則止可以乆則乆可以速則
  - page: 2
    col: 13
    role: j
    text: 速孔子聖之時者也故知易者莫如
  - page: 2
    col: 14
    role: j
    text: 孟子又曰王者之迹熄而詩亡詩亡
  - page: 2
    col: 15
    role: j
    text: 然後春秋作又曰春秋無義戰文曰
  - page: 3
    col: 1
    role: j
    text: 春秋天子之事故知春秋者莫如孟
  - page: 3
    col: 2
    role: j
    text: 長於詩書而已游事齊宣王宣王不
  - page: 3
    col: 3
    role: j
    text: 能用適梁梁惠王不果所言則見以
  - page: 3
    col: 4
    role: j
    text: 為迂遠而闊於事情按史記梁惠王
  - page: 3
    col: 5
    role: j
    text: 酉孟子始至梁其後二十三年當齊
  - page: 3
    col: 6
    role: j
    text: 在齊故古史謂孟子先事齊宣王後
  - page: 3
    col: 7
    role: j
    text: 伐燕為宣王時事與史記荀子等書
  - page: 3
    col: 8
    role: j
    text: 十九年則是孟子先游梁而後至齊
  - page: 3
    col: 9
    role: j
    text: 孰是當是之時秦用商鞅楚魏用吳
  - page: 3
    col: 10
    role: j
    text: 起齊用孫子田忌天下方務於合從
  - page: 3
    col: 11
    role: j
    text: 連衡以攻伐為賢而孟軻乃述唐虞
  - page: 3
    col: 12
    role: j
    text: 三代之德是以所如者不合退而與
  - page: 3
    col: 13
    role: j
    text: 萬章之徒序詩書述仲尼之意作孟
  - page: 3
    col: 14
    role: j
    text: 子七篇趙氏曰凡二百六十一章三
  - page: 3
    col: 15
    role: j
    text: 曰孟軻之書非軻自著軻既没其徒
  - page: 3
    col: 16
    role: j
    text: 按二說不同
  - page: 4
    col: 1
    role: j
    text: 韓子曰堯以是傳之舜舜以是傳之禹
  - page: 4
    col: 2
    role: j
    text: 禹以是傳之湯湯以是傳之文武周公
  - page: 4
    col: 3
    role: j
    text: 公文武周公傳之孔子孔子傳之孟軻
  - page: 4
    col: 4
    role: j
    text: 軻軻之死不得其傳焉荀與楊也擇焉
  - page: 4
    col: 5
    role: j
    text: 而不精語焉而不詳焉荀與楊也擇焉
  - page: 4
    col: 6
    role: j
    text: 又曰孟氏醇乎醇者也荀與楊大醇而
  - page: 4
    col: 7
    role: j
    text: 小疵程子曰韓子論孟子甚善非兼得
  - page: 4
    col: 8
    role: j
    text: 荀楊則非也荀子極偏駁只一句性惡
  - page: 4
    col: 9
    role: j
    text: 太本已失楊子雖少過然亦不識性更
  - page: 4
    col: 10
    role: z
    text: ○又曰孔子之道大而能博門弟
  - page: 4
    col: 11
    role: j
    text: 子不能徧觀而盡識也故學焉而皆得
  - page: 4
    col: 12
    role: j
    text: 其性之所近其後離散分處諸侯之國
  - page: 4
    col: 13
    role: j
    text: 又各以其所能授弟子源遠而末益分
  - page: 4
    col: 14
    role: j
    text: 惟孟軻師子思而子思之學出於曾子
  - page: 4
    col: 15
    role: j
    text: 自孔子没獨孟軻氏之傳得其宗故求
  - page: 4
    col: 16
    role: j
    text: 觀聖人之道者必
  - page: 5
    col: 1
    role: j
    text: 自孟子始
  - page: 5
    col: 3
    role: z
    text: ○又曰揚子雲曰古者楊墨塞路孟
  - page: 5
    col: 4
    role: j
    text: 子辭而闢之廓如也夫楊墨行正道
  - page: 5
    col: 5
    role: j
    text: 廢孟子雖賢聖不得位空言無施雖
  - page: 5
    col: 6
    role: j
    text: 切何補然賴其言而今之學者尚知
  - page: 5
    col: 7
    role: j
    text: 宗孔氏崇仁義貴王賤霸而已其大
  - page: 5
    col: 8
    role: j
    text: 經大法皆云滅而不救壞爛而不收
  - page: 5
    col: 9
    role: j
    text: 所謂存十一於千百安在其能廓如
  - page: 5
    col: 10
    role: j
    text: 也然向無孟氏則皆服左衽而言侏
  - page: 5
    col: 11
    role: j
    text: 離矣故愈嘗推尊孟氏以爲功不在
  - page: 5
    col: 12
    role: j
    text: 禹下者爲此也
  - page: 5
    col: 13
    role: j
    text: 或問於程子曰孟子還可謂聖人否程
  - page: 5
    col: 14
    role: j
    text: 子曰未敢便道他是聖人然學已到
  - page: 5
    col: 15
    role: j
    text: 至處○程子又曰孟子
  - page: 5
    col: 16
    role: j
    text: 有功於聖門不可勝言仲尼只說一
  - page: 6
    col: 1
    role: z
    text: 箇仁義孟子開口便說仁義仲尼只
  - page: 6
    col: 2
    role: z
    text: 說一箇志孟子便說許多養氣出來
  - page: 6
    col: 3
    role: z
    text: 只此二字其功甚多。又曰孟子有
  - page: 6
    col: 4
    role: z
    text: 大功於世以其言性善也。又曰孟
  - page: 6
    col: 5
    role: z
    text: 子性善養氣之論皆前聖所未發。
  - page: 6
    col: 6
    role: z
    text: 又曰學者全要識時若不識時不足
  - page: 6
    col: 7
    role: z
    text: 以言學顏子陋巷自樂以有孔子在
  - page: 6
    col: 8
    role: z
    text: 焉若孟子之時世既無人安可不以
  - page: 6
    col: 9
    role: z
    text: 道自任。又曰孟子有些英氣才有
  - page: 6
    col: 10
    role: z
    text: 英氣便有圭角英氣甚害事如顏子
  - page: 6
    col: 11
    role: z
    text: 便渾厚不同顏子去聖人只毫髮間
  - page: 6
    col: 12
    role: z
    text: 孟子大賢亞聖之次也或曰英氣見
  - page: 6
    col: 13
    role: z
    text: 於甚處曰但以孔子之言比之便可
  - page: 6
    col: 14
    role: z
    text: 見且如冰與水精非不光比之玉自
  - page: 6
    col: 15
    role: z
    text: 是有溫潤含蓄氣象無許多光耀也
  - page: 6
    col: 16
    role: j
    text: 楊氏曰孟子一書只是要正人心教人
  - page: 7
    col: 1
    role: z
    text: 存心養性收其放心至論仁義禮智
  - page: 7
    col: 2
    role: z
    text: 則以惻隱羞惡辭遜是非之心爲之
  - page: 7
    col: 3
    role: z
    text: 端論邪說之害則曰生於其心害於
  - page: 7
    col: 4
    role: z
    text: 其政論事君則曰格君心之非一正
  - page: 7
    col: 5
    role: z
    text: 君而國定千變萬化只說從心上來
  - page: 7
    col: 6
    role: z
    text: 人能正心則事無足爲者矣大學之
  - page: 7
    col: 7
    role: z
    text: 修身齊家治國平天下其本只是正
  - page: 7
    col: 8
    role: z
    text: 心誠意而已心得其正然後知性之
  - page: 7
    col: 9
    role: z
    text: 善故孟子遇人便道性善歐陽永叔
  - page: 7
    col: 10
    role: z
    text: 却言聖人之教人性非所先可謂誤
  - page: 7
    col: 11
    role: z
    text: 矣人性上不可添一物堯舜所以爲
  - page: 7
    col: 12
    role: z
    text: 萬世法亦是率性而已所謂率性循
  - page: 7
    col: 13
    role: z
    text: 天理是也外邊用計用數假饒立得
  - page: 7
    col: 14
    role: z
    text: 功業只是人欲之私與聖賢作處天
  - page: 7
    col: 15
    role: z
    text: 地懸隔
