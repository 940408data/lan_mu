# 長物志·書畫：點校中導覽（teaser）
sections:
  - id: shu-hua
    name: 書畫
    blocks:
      - type: j
        text: 書畫
      - type: z
        text: 導：此章論書畫。自識鑒、閱玩至裝褫、銓次，層層言收藏之道；最忌以耳為目、口論貴賤。薦語：珍秘寶愛、真賞。
      - type: j
        text: 金生於山，珠產於淵，取之不窮，猶為天下所珍惜。況圖畫在宇宙，歲月既久，名人藝士不能復生，可不珍秘寶愛？
      - type: z
        text: 讀：金珠猶惜，況不可復生之墨跡。「不能復生」四字最醒，收藏之重，在惜其不可再得。
      - type: j
        text: 一入俗子之手，動見勞辱，卷舒失所，操揉燥裂，真書畫之厄也。
      - type: z
        text: 讀：勞辱、之厄，痛切語。雅俗之辨不在贫富，在有無真賞；此章可作藏家之鑑。
