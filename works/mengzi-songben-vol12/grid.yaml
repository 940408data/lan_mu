labels:
  - page: 424
    col: 1
    role: j
    text: 孟子卷第十二朱熹集注
  - page: 424
    col: 2
    role: title
    text: 告子章句下
  - page: 424
    col: 3
    role: z
    text: 凡十六章
  - page: 424
    col: 4
    role: j
    text: 任人有問屋廬子曰禮與食孰重曰禮
  - page: 424
    col: 5
    role: j
    text: 重
  - page: 424
    col: 6
    role: j
    text: 任平聲○任國名屋廬子名連孟子
  - page: 424
    col: 7
    role: z
    text: 弟子也
  - page: 424
    col: 8
    role: j
    text: 色與禮孰重
  - page: 425
    col: 1
    role: z
    text: 任人復問也
  - page: 425
    col: 2
    role: j
    text: 曰禮重曰以禮食則飢而死不以禮食
  - page: 425
    col: 3
    role: j
    text: 則得食必以禮乎親迎則不得妻不親
  - page: 425
    col: 4
    role: j
    text: 迎則得妻必親迎乎
  - page: 425
    col: 5
    role: z
    text: 迎去聲
  - page: 425
    col: 6
    role: j
    text: 屋廬子不能對明日之鄒以告孟子孟
  - page: 425
    col: 7
    role: j
    text: 子曰於答是也何有
  - page: 425
    col: 8
    role: z
    text: 於如字○何有不難也
  - page: 425
    col: 9
    role: j
    text: 不揣其本而齊其末方寸之木可使高
  - page: 425
    col: 10
    role: j
    text: 於岑樓
  - page: 425
    col: 11
    role: z
    text: 揣初委反○本謂下末謂上方寸之
  - page: 425
    col: 12
    role: z
    text: 木至卑喻食色岑樓樓之高銳似山
  - page: 425
    col: 13
    role: z
    text: 者至高喻禮若不取其下之平而升
  - page: 425
    col: 14
    role: z
    text: 寸木於岑樓之上則寸木反高岑樓
  - page: 425
    col: 15
    role: z
    text: 反卑矣
  - page: 425
    col: 16
    role: j
    text: 金重於羽者豈謂一鉤金與一輿羽之
  - page: 426
    col: 1
    role: j
    text: 謂哉
  - page: 426
    col: 2
    role: z
    text: 鉤帶鉤也金本重而帶鉤小故輕喻
  - page: 426
    col: 3
    role: z
    text: 禮有輕於食色者羽本輕而一輿多
  - page: 426
    col: 4
    role: z
    text: 故重喻食色有重於禮者
  - page: 426
    col: 5
    role: j
    text: 取食之重者與禮之輕者而比之奚翅
  - page: 426
    col: 6
    role: j
    text: 食重取色之重者與禮之輕者而比之
  - page: 426
    col: 7
    role: j
    text: 奚翅色重
  - page: 426
    col: 8
    role: z
    text: 翅與啻同古字通用施智反○禮食
  - page: 426
    col: 9
    role: z
    text: 親迎禮之輕者也飢而死以滅其性
  - page: 426
    col: 10
    role: z
    text: 不得妻而廢人倫食色之重者也奚
  - page: 426
    col: 11
    role: z
    text: 翅猶言何但言其相去懸絕不但有
  - page: 426
    col: 12
    role: z
    text: 輕重之差而已
  - page: 426
    col: 13
    role: j
    text: 往應之曰紾兄之臂而奪之食則得食
  - page: 426
    col: 14
    role: j
    text: 不紾則不得食則將紾之乎踰東家牆
  - page: 426
    col: 15
    role: j
    text: 而摟其處子則得妻不摟則不得妻則
  - page: 426
    col: 16
    role: j
    text: 將摟之乎
  - page: 427
    col: 1
    role: z
    text: 紾音軫摟音婁○紾戾也摟牽也處
  - page: 427
    col: 2
    role: z
    text: 子處女也此二者禮與食色皆其重
  - page: 427
    col: 3
    role: z
    text: 者而以之相較則禮為尤重也○此
  - page: 427
    col: 4
    role: z
    text: 章言義理事物其輕重固有大分然
  - page: 427
    col: 5
    role: z
    text: 於其中又各自有輕重之別聖賢於
  - page: 427
    col: 6
    role: z
    text: 此錯綜斟酌毫髮不差固不肯枉尺
  - page: 427
    col: 7
    role: z
    text: 而直尋亦未嘗膠柱而調瑟所以斷
  - page: 427
    col: 8
    role: z
    text: 之一視於理之當然而已矣
  - page: 427
    col: 9
    role: j
    text: 曹交問曰人皆可以為堯舜有諸孟子
  - page: 427
    col: 10
    role: j
    text: 曰然
  - page: 427
    col: 11
    role: z
    text: 趙氏曰曹交曹君之弟也人皆可以
  - page: 427
    col: 12
    role: z
    text: 為堯舜疑古語或孟子所嘗言也
  - page: 427
    col: 13
    role: j
    text: 交聞文王十尺湯九尺今交九尺四寸
  - page: 427
    col: 14
    role: j
    text: 以長句食粟而已如何則可
  - page: 427
    col: 15
    role: z
    text: 曹交問也食粟而已言無他材能也
  - page: 427
    col: 16
    role: j
    text: 曰奚有於是亦為之而已矣有人於此
  - page: 428
    col: 1
    role: j
    text: 力不能勝一匹雛則為無力人矣今曰
  - page: 428
    col: 2
    role: j
    text: 舉百鈞則為有力人矣然則舉烏獲之
  - page: 428
    col: 3
    role: j
    text: 任是亦為烏獲而已矣夫人豈以不勝
  - page: 428
    col: 4
    role: j
    text: 為患哉弗為耳
  - page: 428
    col: 5
    role: j
    text: 勝平聲○匹字本作鳴鴨也從省作
  - page: 428
    col: 6
    role: j
    text: 匹禮記說匹為鶩是也烏獲古之有
  - page: 428
    col: 7
    role: z
    text: 力人也能舉移千鈞
  - page: 428
    col: 8
    role: j
    text: 徐行後長者謂之弟疾行先長者謂之
  - page: 428
    col: 9
    role: j
    text: 兄夫徐行者豈人之所不能哉所不為
  - page: 428
    col: 10
    role: j
    text: 也堯舜之道孝弟而已矣
  - page: 428
    col: 11
    role: j
    text: 後去聲長上聲先去聲夫音扶○陳
  - page: 428
    col: 12
    role: j
    text: 氏曰孝弟者人之良知良能自然之
  - page: 428
    col: 13
    role: j
    text: 性也堯舜人倫之至亦率是性而已矣
  - page: 428
    col: 14
    role: j
    text: 豈能加毫末於是哉○楊氏曰堯舜
  - page: 428
    col: 15
    role: j
    text: 之道大矣而所以為之乃在夫行之
  - page: 428
    col: 16
    role: j
    text: 疾徐之間非有甚高難行之事也百
  - page: 429
    col: 1
    role: z
    text: 姓蓋日用而不知耳
  - page: 429
    col: 2
    role: j
    text: 子服堯之服誦堯之言行堯之行是堯
  - page: 429
    col: 3
    role: j
    text: 而已矣子服桀之服誦桀之言行桀之
  - page: 429
    col: 4
    role: j
    text: 行是桀而已矣
  - page: 429
    col: 5
    role: z
    text: 之行並去聲○言爲善爲惡皆在我
  - page: 429
    col: 6
    role: z
    text: 而已詳曹交之問淺陋麤率必其進
  - page: 429
    col: 7
    role: z
    text: 見之時禮貌衣冠言動之間多不循
  - page: 429
    col: 8
    role: z
    text: 理故孟子告之如此兩節云
  - page: 429
    col: 9
    role: j
    text: 曰交得見於鄒君可以假館願留而受
  - page: 429
    col: 10
    role: j
    text: 業於門
  - page: 429
    col: 11
    role: z
    text: 見音現○假館而後受業又可見其
  - page: 429
    col: 12
    role: z
    text: 求道之不篤
  - page: 429
    col: 13
    role: j
    text: 曰夫道若大路然豈難知哉人病不求
  - page: 429
    col: 14
    role: j
    text: 耳子歸而求之有餘師
  - page: 429
    col: 15
    role: z
    text: 夫音扶○言道不難知若歸而求之
  - page: 429
    col: 16
    role: z
    text: 事親敬長之間則性分之内萬理皆
  - page: 430
    col: 1
    role: z
    text: 備隨處發見無不可師不必留此而
  - page: 430
    col: 2
    role: z
    text: 受業也○曹交事長之禮旣不至求
  - page: 430
    col: 3
    role: z
    text: 道之心又不篤故孟子教之以孝弟
  - page: 430
    col: 4
    role: z
    text: 而不容其受業蓋孔子餘力學文之
  - page: 430
    col: 5
    role: z
    text: 意亦不屑之教誨也
  - page: 430
    col: 6
    role: j
    text: 公孫丑問曰高子曰小弁小人之詩也
  - page: 430
    col: 7
    role: j
    text: 孟子曰何以言之曰怨
  - page: 430
    col: 8
    role: z
    text: 弁音盤○高子齊人也小弁小雅篇
  - page: 430
    col: 9
    role: z
    text: 名周幽王娶申后生太子冝臼又得
  - page: 430
    col: 10
    role: z
    text: 褒姒生伯服而黜申后廢冝臼於是
  - page: 430
    col: 11
    role: z
    text: 冝臼之傅爲作此詩以叙其哀痛迫
  - page: 430
    col: 12
    role: z
    text: 切之情也
  - page: 430
    col: 13
    role: j
    text: 曰固哉高叟之爲詩也有人於此越人
  - page: 430
    col: 14
    role: j
    text: 關弓而射之則己談笑而道之無他疏
  - page: 430
    col: 15
    role: j
    text: 之也其兄關弓而射之則己垂涕泣而
  - page: 430
    col: 16
    role: j
    text: 道之無他戚之也小弁之怨親親也親
  - page: 431
    col: 1
    role: j
    text: 親仁也固矣夫髙叟之爲詩也
  - page: 431
    col: 2
    role: z
    text: 關與彎同射食亦反夫音扶○固謂
  - page: 431
    col: 3
    role: z
    text: 執滯不通也爲猶治也越蠻夷國名
  - page: 431
    col: 4
    role: z
    text: 道語也親親之心仁之發也
  - page: 431
    col: 5
    role: j
    text: 曰凱風何以不怨
  - page: 431
    col: 6
    role: z
    text: 凱風邶風篇名衛有七子之母不能
  - page: 431
    col: 7
    role: z
    text: 安其室七子作此以自責也
  - page: 431
    col: 8
    role: j
    text: 曰凱風親之過小者也小弁親之過大
  - page: 431
    col: 9
    role: j
    text: 者也親之過大而不怨是愈疏也親之
  - page: 431
    col: 10
    role: j
    text: 過小而怨是不可磯也愈疏不孝也不
  - page: 431
    col: 11
    role: j
    text: 可磯亦不孝也
  - page: 431
    col: 12
    role: z
    text: 磯音機○磯水激石也不可磯言微
  - page: 431
    col: 13
    role: z
    text: 激之而遽怒也
  - page: 431
    col: 14
    role: j
    text: 孔子曰舜其至孝矣五十而慕
  - page: 431
    col: 15
    role: z
    text: 言舜猶怨慕小弁之怨不爲不孝也
  - page: 431
    col: 16
    role: z
    text: ○趙氏曰生之膝下一體而分喘息
  - page: 432
    col: 1
    role: z
    text: 呼吸氣通於親當親而疏怨慕號天
  - page: 432
    col: 2
    role: z
    text: 是以小弁之怨未足爲愆也
  - page: 432
    col: 3
    role: j
    text: 宋牼將之楚孟子遇於石丘
  - page: 432
    col: 4
    role: z
    text: 牼口莖反○宋姓牼名石丘地名
  - page: 432
    col: 5
    role: j
    text: 曰先生將何之
  - page: 432
    col: 6
    role: z
    text: 趙氏曰學士年長者故謂之先生
  - page: 432
    col: 7
    role: j
    text: 曰吾聞秦楚搆兵我將見楚王說而罷
  - page: 432
    col: 8
    role: j
    text: 之楚王不悅我將見秦王說而罷之二
  - page: 432
    col: 9
    role: j
    text: 王我將有所遇焉
  - page: 432
    col: 10
    role: z
    text: 說音稅○時宋牼方欲見楚王恐其
  - page: 432
    col: 11
    role: z
    text: 不悅則將見秦王也遇合也按莊子
  - page: 432
    col: 12
    role: z
    text: 書有宋鈃者禁攻寢兵救世之戰上
  - page: 432
    col: 13
    role: z
    text: 說下教強聒不舍疏云齊宣王時人
  - page: 432
    col: 14
    role: z
    text: 以事考之疑即此人也
  - page: 432
    col: 15
    role: j
    text: 曰軻也請無問其詳願聞其指說之將
  - page: 432
    col: 16
    role: j
    text: 何如曰我將言其不利也曰先生之志
  - page: 433
    col: 1
    role: j
    text: 則大矣先生之號則不可
  - page: 433
    col: 2
    role: j
    text: 徐氏曰能於戰國擾攘之中而以罷
  - page: 433
    col: 3
    role: j
    text: 兵息民爲說其志可謂大矣然以利
  - page: 433
    col: 4
    role: z
    text: 爲名則不可也
  - page: 433
    col: 5
    role: j
    text: 先生以利說秦楚之王秦楚之王悅於
  - page: 433
    col: 6
    role: j
    text: 利以罷三軍之師是三軍之士樂罷而
  - page: 433
    col: 7
    role: j
    text: 悅於利也爲人臣者懷利以事其君爲
  - page: 433
    col: 8
    role: j
    text: 人子者懷利以事其父爲人弟者懷利
  - page: 433
    col: 9
    role: j
    text: 以事其兄是君臣父子兄弟終去仁義
  - page: 433
    col: 10
    role: j
    text: 懷利以相接然而不亡者未之有也
  - page: 433
    col: 11
    role: z
    text: 樂音洛下同
  - page: 433
    col: 12
    role: j
    text: 先生以仁義說秦楚之王秦楚之王悅
  - page: 433
    col: 13
    role: j
    text: 於仁義而罷三軍之師是三軍之士樂
  - page: 433
    col: 14
    role: j
    text: 罷而悅於仁義也爲人臣者懷仁義以
  - page: 433
    col: 15
    role: j
    text: 事其君爲人子者懷仁義以事其父爲
  - page: 433
    col: 16
    role: j
    text: 人弟者懷仁義以事其兄是君臣父子
  - page: 434
    col: 1
    role: j
    text: 兄弟去利懷仁義以相接也然而不王
  - page: 434
    col: 2
    role: j
    text: 者未之有也何必曰利
  - page: 434
    col: 3
    role: z
    text: 王去聲○此章言休兵息民爲事則
  - page: 434
    col: 4
    role: z
    text: 一然其心有義利之殊而其效有興
  - page: 434
    col: 5
    role: z
    text: 亡之異學者所當深察而明辨之也
  - page: 434
    col: 6
    role: j
    text: 孟子居鄒季任爲任處守以幣交受之
  - page: 434
    col: 7
    role: j
    text: 而不報處於平陸儲子爲相以幣交受
  - page: 434
    col: 8
    role: j
    text: 之而不報
  - page: 434
    col: 9
    role: z
    text: 任平聲相去聲下同○趙氏曰季任
  - page: 434
    col: 10
    role: z
    text: 任君之弟任君朝會於鄰國季任爲
  - page: 434
    col: 11
    role: z
    text: 之居守其國也儲子齊相也不報者
  - page: 434
    col: 12
    role: z
    text: 來見則當報之但以幣交則不必報
  - page: 434
    col: 13
    role: z
    text: 也
  - page: 434
    col: 14
    role: j
    text: 他日由鄒之任見季子由平陸之齊不
  - page: 434
    col: 15
    role: j
    text: 見儲子屋廬子喜曰連得間矣
  - page: 434
    col: 16
    role: z
    text: 屋廬子知孟子之處此必有義理故
  - page: 435
    col: 1
    role: z
    text: 喜得其間隙而問之
  - page: 435
    col: 2
    role: j
    text: 問曰夫之任見季子之齊不見儲子
  - page: 435
    col: 3
    role: j
    text: 爲其爲相與
  - page: 435
    col: 4
    role: z
    text: 爲其之爲去聲下同與平聲○言儲
  - page: 435
    col: 5
    role: j
    text: 子但爲齊相不若季子攝守君位故
  - page: 435
    col: 6
    role: z
    text: 輕之耶
  - page: 435
    col: 7
    role: j
    text: 曰非也書曰享多儀儀不及物曰不享
  - page: 435
    col: 8
    role: j
    text: 惟不役志于享
  - page: 435
    col: 9
    role: z
    text: 書周書洛誥之篇享奉上也儀禮也
  - page: 435
    col: 10
    role: j
    text: 物幣也役用也言雖享而禮意不及
  - page: 435
    col: 11
    role: j
    text: 其幣則是不享矣以其不用志于享
  - page: 435
    col: 12
    role: z
    text: 故也
  - page: 435
    col: 13
    role: j
    text: 爲其不成享也
  - page: 435
    col: 14
    role: z
    text: 孟子釋書意如此
  - page: 435
    col: 15
    role: j
    text: 屋廬子悅或問之屋廬子曰季子不得
  - page: 435
    col: 16
    role: j
    text: 之鄒儲子得之平陸
  - page: 436
    col: 1
    role: j
    text: 徐氏曰季子爲君居守不得往他國
  - page: 436
    col: 2
    role: j
    text: 以見孟子則以幣交而禮意巳備儲
  - page: 436
    col: 3
    role: j
    text: 子爲齊相可以至齊之境内而不來
  - page: 436
    col: 4
    role: j
    text: 見則雖以幣交而禮意不及其物也
  - page: 436
    col: 5
    role: j
    text: 淳于髠曰先名實者爲人也後名實者
  - page: 436
    col: 6
    role: j
    text: 自爲也夫子在三卿之中名實未加於
  - page: 436
    col: 7
    role: j
    text: 上下而去之仁者固如此乎
  - page: 436
    col: 8
    role: j
    text: 先後爲皆去聲○名聲譽也實事功
  - page: 436
    col: 9
    role: j
    text: 也言以名實爲先而爲之者是有志
  - page: 436
    col: 10
    role: j
    text: 於救民也以名實爲後而不爲者是
  - page: 436
    col: 11
    role: j
    text: 欲獨善其身者也名實未加於上下
  - page: 436
    col: 12
    role: z
    text: 言上未能正其君下未能濟其民也
  - page: 436
    col: 13
    role: j
    text: 孟子曰居下位不以賢事不肖者伯夷
  - page: 436
    col: 14
    role: j
    text: 也五就湯五就桀者伊尹也不惡汙君
  - page: 436
    col: 15
    role: j
    text: 不辭小官者柳下惠也三子者不同道
  - page: 436
    col: 16
    role: j
    text: 其趨一也一者何也曰仁也君子亦仁
  - page: 437
    col: 1
    role: j
    text: 而已矣何必同
  - page: 437
    col: 2
    role: z
    text: 惡趨並去聲○仁者無私心而合天
  - page: 437
    col: 3
    role: z
    text: 理之謂○楊氏曰伊尹之就湯以三
  - page: 437
    col: 4
    role: z
    text: 聘之勤也其就桀也湯進之也湯豈
  - page: 437
    col: 5
    role: z
    text: 有伐桀之意哉其進伊尹以事之也
  - page: 437
    col: 6
    role: z
    text: 欲其悔過遷善而已伊尹既就湯則
  - page: 437
    col: 7
    role: z
    text: 以湯之心為心矣及其終也人歸之
  - page: 437
    col: 8
    role: z
    text: 天命之不得已而伐之耳若湯初求
  - page: 437
    col: 9
    role: z
    text: 伊尹即有伐桀之心而伊尹遂相之
  - page: 437
    col: 10
    role: z
    text: 以伐桀是以取天下為心也以取天
  - page: 437
    col: 11
    role: z
    text: 下為心豈聖人之心哉
  - page: 437
    col: 12
    role: j
    text: 曰魯繆公之時公儀子為政子柳子思
  - page: 437
    col: 13
    role: j
    text: 為臣魯之削也滋甚若是乎賢者之無
  - page: 437
    col: 14
    role: j
    text: 益於國也
  - page: 437
    col: 15
    role: z
    text: 公儀子名休為魯相子柳泄柳也削
  - page: 437
    col: 16
    role: z
    text: 地見侵奪也髠譏孟子雖不去亦未
  - page: 438
    col: 1
    role: z
    text: 必能有爲也
  - page: 438
    col: 2
    role: j
    text: 曰虞不用百里奚而亡秦穆公用之而
  - page: 438
    col: 3
    role: j
    text: 霸不用賢則亡削何可得與
  - page: 438
    col: 4
    role: z
    text: 與平聲○百里奚事見前篇
  - page: 438
    col: 5
    role: j
    text: 曰昔者王豹處於淇而河西善謳綿駒
  - page: 438
    col: 6
    role: j
    text: 處於高唐而齊右善歌華周杞梁之妻
  - page: 438
    col: 7
    role: j
    text: 善哭其夫而變國俗有諸內必形諸外
  - page: 438
    col: 8
    role: j
    text: 爲其事而無其功者髡未嘗覩之也是
  - page: 438
    col: 9
    role: j
    text: 故無賢者也有則髡必識之
  - page: 438
    col: 10
    role: z
    text: 華去聲○王豹衛人善謳淇水名綿
  - page: 438
    col: 11
    role: j
    text: 駒齊人善歌高唐齊西邑華周杞梁
  - page: 438
    col: 12
    role: j
    text: 二人皆齊臣戰死於莒其妻哭之哀
  - page: 438
    col: 13
    role: j
    text: 國俗化之皆善哭髡以此譏孟子仕
  - page: 438
    col: 14
    role: z
    text: 齊無功未足爲賢也
  - page: 438
    col: 15
    role: j
    text: 曰孔子爲魯司冦不用從而祭燔肉不
  - page: 438
    col: 16
    role: j
    text: 至不稅冕而行不知者以爲爲肉也其
  - page: 439
    col: 1
    role: j
    text: 知者以為為無禮也乃孔子則欲以微
  - page: 439
    col: 2
    role: j
    text: 罪行不欲為苟去君子之所為衆人固
  - page: 439
    col: 3
    role: j
    text: 不識也
  - page: 439
    col: 4
    role: z
    text: 稅音脫為肉為無之為去聲○按史
  - page: 439
    col: 5
    role: z
    text: 記孔子為魯司冦攝行相事齊人聞
  - page: 439
    col: 6
    role: z
    text: 而懼於是以女樂遺魯君季威子與
  - page: 439
    col: 7
    role: z
    text: 魯君往觀之怠於政事子路曰夫子
  - page: 439
    col: 8
    role: z
    text: 可以行矣○孔子曰魯今且郊如致
  - page: 439
    col: 9
    role: z
    text: 膰于大夫則吾猶可以止威子卒受
  - page: 439
    col: 10
    role: z
    text: 齊女樂郊又不致膰俎于大夫孔子
  - page: 439
    col: 11
    role: z
    text: 遂行孟子言以為為肉者固不足道
  - page: 439
    col: 12
    role: z
    text: 以為為無禮則亦未為深知孔子者
  - page: 439
    col: 13
    role: z
    text: 蓋聖人於父母之國不欲顯其君相
  - page: 439
    col: 14
    role: z
    text: 之失又不欲為無故而苟去故不以
  - page: 439
    col: 15
    role: z
    text: 女樂去而以膰肉行其見幾明決而
  - page: 439
    col: 16
    role: z
    text: 用意忠厚固非衆人所能識也然則
  - page: 440
    col: 1
    role: j
    text: 孟子之所為豈髡之所能識哉○尹
  - page: 440
    col: 2
    role: z
    text: 氏曰淳于髡未甞知仁而未甞識賢
  - page: 440
    col: 3
    role: z
    text: 也宜乎其言若是
  - page: 440
    col: 4
    role: j
    text: 孟子曰五霸者三王之罪人也今之諸
  - page: 440
    col: 5
    role: j
    text: 侯五霸之罪人也今之大夫今之諸侯
  - page: 440
    col: 6
    role: j
    text: 之罪人也
  - page: 440
    col: 7
    role: z
    text: 趙氏曰五霸齊威晉文秦穆宋襄楚
  - page: 440
    col: 8
    role: z
    text: 莊也三王夏禹商湯周文武也○丁
  - page: 440
    col: 9
    role: z
    text: 氏曰夏昆吾商大彭豕韋周齊威晉
  - page: 440
    col: 10
    role: z
    text: 文謂之五霸
  - page: 440
    col: 11
    role: j
    text: 天子適諸侯曰廵狩諸侯朝於天子曰
  - page: 440
    col: 12
    role: j
    text: 述職春省耕而補不足秋省歛而助不
  - page: 440
    col: 13
    role: j
    text: 給入其疆土地辟田野治養老尊賢俊
  - page: 440
    col: 14
    role: j
    text: 傑在位則有慶慶以地入其疆土地荒
  - page: 440
    col: 15
    role: j
    text: 蕪遺老失賢掊克在位則有讓一不朝
  - page: 440
    col: 16
    role: j
    text: 則貶其爵再不朝則削其地三不朝則
  - page: 441
    col: 1
    role: j
    text: 六師移之是故天子討而不伐諸侯伐
  - page: 441
    col: 2
    role: j
    text: 而不討五霸者摟諸侯以伐諸侯者也
  - page: 441
    col: 3
    role: j
    text: 故曰五霸者三王之罪人也
  - page: 441
    col: 4
    role: z
    text: 朝音潮辟與闢同治平聲○慶賞也
  - page: 441
    col: 5
    role: z
    text: 益其地以賞之也掊克聚歛也讓責
  - page: 441
    col: 6
    role: z
    text: 也移之者誅其人而變置之也討者
  - page: 441
    col: 7
    role: z
    text: 出命以討其罪而使方伯連帥帥諸
  - page: 441
    col: 8
    role: z
    text: 侯以伐之也伐者奉天子之命聲其
  - page: 441
    col: 9
    role: z
    text: 罪而伐之也摟牽也五霸牽諸侯以
  - page: 441
    col: 10
    role: z
    text: 伐諸侯不用天子之命也自入其疆
  - page: 441
    col: 11
    role: z
    text: 至則有責言廵狩之事自一不朝至
  - page: 441
    col: 12
    role: z
    text: 六師移之言述職之事
  - page: 441
    col: 13
    role: j
    text: 五霸桓公爲盛葵丘之會諸侯束牲載
  - page: 441
    col: 14
    role: j
    text: 書而不歃血初命曰誅不孝無易樹子
  - page: 441
    col: 15
    role: j
    text: 無以妾爲妻再命曰尊賢育才以彰有
  - page: 441
    col: 16
    role: j
    text: 德三命曰敬老慈幼無忘賓旅四命曰
  - page: 442
    col: 1
    role: j
    text: 士無世官官事無攝取士必得無專殺
  - page: 442
    col: 2
    role: j
    text: 大夫五命曰無曲防無遏糴無有封而
  - page: 442
    col: 3
    role: j
    text: 不告曰凡我同盟之人既盟之後言歸
  - page: 442
    col: 4
    role: j
    text: 于好今之諸侯皆犯此五禁故曰今之
  - page: 442
    col: 5
    role: j
    text: 諸侯五霸之罪人也
  - page: 442
    col: 6
    role: z
    text: 歃所洽反糴音狄好去聲○按春秋
  - page: 442
    col: 7
    role: z
    text: 傳僖公九年葵丘之會陳牲而不殺
  - page: 442
    col: 8
    role: z
    text: 讀書加於牲上壹明天子之禁樹立
  - page: 442
    col: 9
    role: z
    text: 也已立世子不得擅易初命三事所
  - page: 442
    col: 10
    role: z
    text: 以脩身正家之要也賔賔客也旅行
  - page: 442
    col: 11
    role: z
    text: 旅也皆當有以待之不可忽忘也士
  - page: 442
    col: 12
    role: z
    text: 世祿而不世官恐其未必賢也官事
  - page: 442
    col: 13
    role: z
    text: 無攝當廣求賢才以充之不可以闕
  - page: 442
    col: 14
    role: z
    text: 人廢事也取士必得必得其人也無
  - page: 442
    col: 15
    role: z
    text: 專殺大夫有罪則請命于天子而後
  - page: 442
    col: 16
    role: z
    text: 殺之也無曲防不得曲爲隄防壅泉
  - page: 443
    col: 1
    role: j
    text: 激水以專小利病鄰國也無遏糴鄰
  - page: 443
    col: 2
    role: j
    text: 國凶荒不得閉糴也無有封而不告
  - page: 443
    col: 3
    role: j
    text: 者不得專封國邑而不告天子也
  - page: 443
    col: 4
    role: j
    text: 長君之惡其罪小逢君之惡其罪大今
  - page: 443
    col: 5
    role: j
    text: 之大夫皆逢君之惡故曰今之大夫今
  - page: 443
    col: 6
    role: j
    text: 之諸侯之罪人也
  - page: 443
    col: 7
    role: j
    text: 長上聲○君有過不能諫又順之者
  - page: 443
    col: 8
    role: j
    text: 長君之惡也君之過未萌而先意導
  - page: 443
    col: 9
    role: j
    text: 之者逢君之惡也○林氏曰邵子有
  - page: 443
    col: 10
    role: j
    text: 言治春秋者不先治五霸之功罪則
  - page: 443
    col: 11
    role: j
    text: 事無統理而不得聖人之心春秋之
  - page: 443
    col: 12
    role: j
    text: 間有功者未有大於五霸有過者亦
  - page: 443
    col: 13
    role: j
    text: 未有大於五霸故五霸者功之首罪
  - page: 443
    col: 14
    role: j
    text: 之魁也孟子此章之義其亦若此也
  - page: 443
    col: 15
    role: j
    text: 與然五霸得罪於三王今之諸侯得
  - page: 443
    col: 16
    role: j
    text: 罪於五霸皆出於異世故得以逃其
  - page: 444
    col: 1
    role: j
    text: 罪至於今之大夫冝得罪於今之諸
  - page: 444
    col: 2
    role: j
    text: 侯則同時矣而諸侯非惟莫之罪也
  - page: 444
    col: 3
    role: j
    text: 乃反以為良臣而厚禮之不以為罪
  - page: 444
    col: 4
    role: z
    text: 而反以為功何其謬哉
  - page: 444
    col: 5
    role: j
    text: 魯欲使慎子為將軍
  - page: 444
    col: 6
    role: z
    text: 順子魯臣
  - page: 444
    col: 7
    role: j
    text: 孟子曰不教民而用之謂之殃民殃民
  - page: 444
    col: 8
    role: j
    text: 者不容於堯舜之世
  - page: 444
    col: 9
    role: z
    text: 教民者教之禮義使知入事父兄出
  - page: 444
    col: 10
    role: z
    text: 事長上也用之使之戰也
  - page: 444
    col: 11
    role: j
    text: 一戰勝齊遂有南陽然且不可
  - page: 444
    col: 12
    role: z
    text: 是時魯蓋欲使慎子伐齊取南陽也
  - page: 444
    col: 13
    role: z
    text: 故孟子言就使慎子善戰有功如此
  - page: 444
    col: 14
    role: z
    text: 且猶不可
  - page: 444
    col: 15
    role: j
    text: 慎子勃然不悅曰此則滑釐所不識也
  - page: 444
    col: 16
    role: z
    text: 滑音骨○滑釐慎子名
  - page: 445
    col: 1
    role: j
    text: 曰吾明告子天子之地方千里不千里
  - page: 445
    col: 2
    role: j
    text: 不足以待諸侯諸侯之地方百里不百
  - page: 445
    col: 3
    role: j
    text: 里不足以守宗廟之典籍
  - page: 445
    col: 4
    role: z
    text: 待諸侯謂待其朝覲聘問之禮宗廟
  - page: 445
    col: 5
    role: z
    text: 典籍祭祀會同之常制也
  - page: 445
    col: 6
    role: j
    text: 周公之封於魯爲方百里也地非不足
  - page: 445
    col: 7
    role: j
    text: 而儉於百里太公之封於齊也亦爲方
  - page: 445
    col: 8
    role: j
    text: 百里也地非不足也而儉於百里
  - page: 445
    col: 9
    role: z
    text: 二公有大勲勞於天下而其封國不
  - page: 445
    col: 10
    role: z
    text: 過百里儉止而不過之意也
  - page: 445
    col: 11
    role: j
    text: 今魯方百里者五子以爲有王者作則
  - page: 445
    col: 12
    role: j
    text: 魯在所損乎在所益乎
  - page: 445
    col: 13
    role: j
    text: 魯地之大皆并吞小國而得之有王
  - page: 445
    col: 14
    role: z
    text: 者作則必在所損矣
  - page: 445
    col: 15
    role: j
    text: 徒取諸彼以與此然且仁者不爲况於
  - page: 445
    col: 16
    role: j
    text: 殺人以求之乎
  - page: 446
    col: 1
    role: j
    text: 徒空也言不殺人而取之也
  - page: 446
    col: 2
    role: j
    text: 君子之事君也務引其君以當道志於
  - page: 446
    col: 3
    role: j
    text: 仁而已
  - page: 446
    col: 4
    role: z
    text: 當道謂事合於理志仁謂心在於仁
  - page: 446
    col: 5
    role: j
    text: 孟子曰今之事君者曰我能爲君辟土地
  - page: 446
    col: 6
    role: j
    text: 充府庫今之所謂良臣古之所謂民賊也
  - page: 446
    col: 7
    role: j
    text: 君不鄉道不志於仁而求冨之是冨桀也
  - page: 446
    col: 8
    role: z
    text: 爲去聲辟與闢同鄉與向同下皆同
  - page: 446
    col: 9
    role: z
    text: ○辟開墾也
  - page: 446
    col: 10
    role: j
    text: 我能爲君約與國戰必克今之所謂良
  - page: 446
    col: 11
    role: j
    text: 臣古之所謂民賊也君不鄉道不志於
  - page: 446
    col: 12
    role: j
    text: 仁而求爲之強戰是輔桀也
  - page: 446
    col: 13
    role: z
    text: 約要結也與國和好相與之國也
  - page: 446
    col: 14
    role: j
    text: 由今之道無變今之俗雖與之天下不
  - page: 446
    col: 15
    role: j
    text: 能一朝居也
  - page: 446
    col: 16
    role: z
    text: 言必爭奪而至於危亡也
  - page: 447
    col: 1
    role: j
    text: 白圭曰吾欲二十而取一何如
  - page: 447
    col: 2
    role: z
    text: 白圭名丹周人也欲更稅法二十分
  - page: 447
    col: 3
    role: z
    text: 而取其一分。林氏曰按史記白圭
  - page: 447
    col: 4
    role: z
    text: 能薄飲食忍勞與童僕同苦樂樂
  - page: 447
    col: 5
    role: z
    text: 觀時變人棄我取人取我與以此居
  - page: 447
    col: 6
    role: z
    text: 積致冨其爲此論蓋欲以其術施之
  - page: 447
    col: 7
    role: z
    text: 國家也
  - page: 447
    col: 8
    role: j
    text: 孟子曰子之道貉也
  - page: 447
    col: 9
    role: z
    text: 貉音陌。貉北方夷狄之國名也
  - page: 447
    col: 10
    role: j
    text: 萬室之國一人陶則可乎曰不可器不
  - page: 447
    col: 11
    role: j
    text: 足用也
  - page: 447
    col: 12
    role: z
    text: 孟子設喻以誥圭而圭亦知其不可
  - page: 447
    col: 13
    role: z
    text: 也
  - page: 447
    col: 14
    role: j
    text: 曰夫貉五穀不生惟黍生之無城郭宮
  - page: 447
    col: 15
    role: j
    text: 室宗廟祭祀之禮無諸侯幣帛饔飱無
  - page: 447
    col: 16
    role: j
    text: 百官有司故二十取一而足也
  - page: 448
    col: 1
    role: z
    text: 夫音扶。北方地寒不生五穀黍早
  - page: 448
    col: 2
    role: z
    text: 熟故生之饔飧以飲食饋客之禮也
  - page: 448
    col: 3
    role: j
    text: 今居中國去人倫無君子如之何其可
  - page: 448
    col: 4
    role: j
    text: 也
  - page: 448
    col: 5
    role: z
    text: 無君臣祭祀交際之禮是去人倫無
  - page: 448
    col: 6
    role: z
    text: 百官有司是無君子
  - page: 448
    col: 7
    role: j
    text: 陶以寡且不可以爲國况無君子乎
  - page: 448
    col: 8
    role: z
    text: 因其辭以折之
  - page: 448
    col: 9
    role: j
    text: 欲輕之於堯舜之道者大貉小貉也欲
  - page: 448
    col: 10
    role: j
    text: 重之於堯舜之道者大桀小桀也
  - page: 448
    col: 11
    role: z
    text: 什一而稅堯舜之道也多則桀寡則
  - page: 448
    col: 12
    role: z
    text: 貉今欲輕重之則是小貉小桀而巳
  - page: 448
    col: 13
    role: j
    text: 白圭曰丹之治水也愈於禹
  - page: 448
    col: 14
    role: z
    text: 趙氏曰當時諸侯有小水白圭爲之
  - page: 448
    col: 15
    role: z
    text: 築隄壅而注之他國
  - page: 448
    col: 16
    role: j
    text: 孟子曰子過矣禹之治水水之道也
  - page: 449
    col: 1
    role: z
    text: 順水之性也
  - page: 449
    col: 2
    role: j
    text: 是故禹以四海爲壑今吾子以鄰國爲
  - page: 449
    col: 3
    role: j
    text: 壑
  - page: 449
    col: 4
    role: z
    text: 壑受水處也
  - page: 449
    col: 5
    role: j
    text: 水逆行謂之洚水洚水者洪水也仁人
  - page: 449
    col: 6
    role: j
    text: 之所惡也吾子過矣
  - page: 449
    col: 7
    role: z
    text: 惡去聲○水逆行者下流壅塞故水
  - page: 449
    col: 8
    role: z
    text: 逆流今乃壅水以害人則與洪水之
  - page: 449
    col: 9
    role: z
    text: 災無異矣
  - page: 449
    col: 10
    role: j
    text: 孟子曰君子不亮惡乎執
  - page: 449
    col: 11
    role: z
    text: 惡平聲○亮信也與諒同惡乎執言
  - page: 449
    col: 12
    role: z
    text: 凡事苟且無所執持也
  - page: 449
    col: 13
    role: j
    text: 魯欲使樂正子爲政孟子曰吾聞之喜
  - page: 449
    col: 14
    role: j
    text: 而不寐
  - page: 449
    col: 15
    role: z
    text: 喜其道之得行
  - page: 449
    col: 16
    role: j
    text: 公孫丑曰樂正子強乎曰否有知慮乎
  - page: 450
    col: 1
    role: j
    text: 曰否多聞識乎曰否
  - page: 450
    col: 2
    role: z
    text: 知去聲○此三者皆當世之所尚而
  - page: 450
    col: 3
    role: z
    text: 樂正子之所短故丑疑而歷問之
  - page: 450
    col: 4
    role: j
    text: 然則奚爲喜而不寐
  - page: 450
    col: 5
    role: z
    text: 丑問也
  - page: 450
    col: 6
    role: j
    text: 曰其爲人也好善
  - page: 450
    col: 7
    role: z
    text: 好去聲下同
  - page: 450
    col: 8
    role: j
    text: 好善足乎
  - page: 450
    col: 9
    role: z
    text: 丑問也
  - page: 450
    col: 10
    role: j
    text: 曰好善優於天下而況魯國乎
  - page: 450
    col: 11
    role: z
    text: 優有餘裕也言雖治天下尚有餘力
  - page: 450
    col: 12
    role: z
    text: 也
  - page: 450
    col: 13
    role: j
    text: 夫苟好善則四海之内皆將輕千里而
  - page: 450
    col: 14
    role: j
    text: 來告之以善
  - page: 450
    col: 15
    role: z
    text: 夫音扶下同○輕易也言不以千里
  - page: 450
    col: 16
    role: z
    text: 爲難也
  - page: 451
    col: 1
    role: j
    text: 夫苟不好善則人將曰訑訑予既已知
  - page: 451
    col: 2
    role: j
    text: 之矣訑訑之聲音顏色距人於千里之
  - page: 451
    col: 3
    role: j
    text: 外士止於千里之外則讒諂面諛之人
  - page: 451
    col: 4
    role: j
    text: 至矣與讒諂面諛之人居國欲治可得
  - page: 451
    col: 5
    role: j
    text: 乎
  - page: 451
    col: 6
    role: z
    text: 訑音移治去聲○訑訑自足其智不
  - page: 451
    col: 7
    role: z
    text: 嗜善言之貌君子小人迭爲消長直
  - page: 451
    col: 8
    role: z
    text: 諒多聞之士遠則讒諂面諛之人至
  - page: 451
    col: 9
    role: z
    text: 理勢然也○此章言爲政不在於用
  - page: 451
    col: 10
    role: z
    text: 一己之長而貴於有以來天下之善
  - page: 451
    col: 11
    role: j
    text: 陳子曰古之君子何如則仕孟子曰所
  - page: 451
    col: 12
    role: j
    text: 就三所去三
  - page: 451
    col: 13
    role: z
    text: 其目在下
  - page: 451
    col: 14
    role: j
    text: 迎之致敬以有禮言將行其言也則就
  - page: 451
    col: 15
    role: j
    text: 之禮貌未衰言弗行也則去之
  - page: 451
    col: 16
    role: z
    text: 所謂見行可之仕若孔子於季威子
  - page: 452
    col: 1
    role: z
    text: 是也受女樂而不朝則去之矣
  - page: 452
    col: 2
    role: j
    text: 其次雖未行其言也迎之致敬以有禮
  - page: 452
    col: 3
    role: j
    text: 則就之禮貌衰則去之
  - page: 452
    col: 4
    role: z
    text: 所謂際可之仕若孔子於衛靈公是
  - page: 452
    col: 5
    role: z
    text: 也故與公遊於囿公仰視蜚鴈而後
  - page: 452
    col: 6
    role: z
    text: 去之
  - page: 452
    col: 7
    role: j
    text: 其下朝不食夕不食飢餓不能出門戶
  - page: 452
    col: 8
    role: j
    text: 君聞之曰吾大者不能行其道又不能
  - page: 452
    col: 9
    role: j
    text: 從其言也使飢餓於我土地吾恥之周
  - page: 452
    col: 10
    role: j
    text: 之亦可受也免死而已矣
  - page: 452
    col: 11
    role: z
    text: 所謂公養之仕也君之於民固有周
  - page: 452
    col: 12
    role: z
    text: 之之義況此又有悔過之言所以可
  - page: 452
    col: 13
    role: j
    text: 受然未至於飢餓不能出門戶則猶
  - page: 452
    col: 14
    role: j
    text: 不受也其曰免死而已則其所受亦
  - page: 452
    col: 15
    role: z
    text: 有節矣
  - page: 452
    col: 16
    role: j
    text: 孟子曰舜發於畎畝之中傅說舉於版
  - page: 453
    col: 1
    role: j
    text: 築之間膠鬲舉於魚鹽之中管夷吾舉
  - page: 453
    col: 2
    role: j
    text: 於士孫叔敖舉於海百里奚舉於市
  - page: 453
    col: 3
    role: z
    text: 說音悅○舜耕歷山三十登庸說築
  - page: 453
    col: 4
    role: z
    text: 傅巖武丁舉之膠鬲遭亂鬻販魚鹽
  - page: 453
    col: 5
    role: z
    text: 文王舉之管仲囚於士官威公舉以
  - page: 453
    col: 6
    role: z
    text: 相國孫叔敖隱處海濱楚莊王舉之
  - page: 453
    col: 7
    role: z
    text: 爲令尹百里奚事見前篇
  - page: 453
    col: 8
    role: j
    text: 故天將降大任於是人也必先苦其心
  - page: 453
    col: 9
    role: j
    text: 志勞其筋骨餓其體膚空乏其身行拂
  - page: 453
    col: 10
    role: j
    text: 亂其所爲所以動心忍性曾益其所不
  - page: 453
    col: 11
    role: j
    text: 能
  - page: 453
    col: 12
    role: z
    text: 曾與增同○降大任使之任大事也
  - page: 453
    col: 13
    role: z
    text: 若舜以下是也空窮也乏絕也拂戾
  - page: 453
    col: 14
    role: z
    text: 也言使之所爲不遂多背戾也動心
  - page: 453
    col: 15
    role: z
    text: 忍性謂竦動其心堅忍其性也然所
  - page: 453
    col: 16
    role: z
    text: 謂性亦指氣稟食色而言耳○程子
  - page: 454
    col: 1
    role: z
    text: 曰若要熟也湏從這裏過
  - page: 454
    col: 2
    role: j
    text: 人恒過然後能改困於心衡於慮而後
  - page: 454
    col: 3
    role: j
    text: 作徵於色發於聲而後喻
  - page: 454
    col: 4
    role: z
    text: 衡與橫同○恒常也猶言大率也橫
  - page: 454
    col: 5
    role: z
    text: 不順也作奮起也徵驗也喻曉也此
  - page: 454
    col: 6
    role: z
    text: 又言中人之性常必有過然後能改
  - page: 454
    col: 7
    role: z
    text: 蓋不能謹於平日故必事勢窮蹙以
  - page: 454
    col: 8
    role: z
    text: 至困於心橫於慮然後能奮發而興
  - page: 454
    col: 9
    role: z
    text: 起不能燭於幾微故必事理暴著以
  - page: 454
    col: 10
    role: z
    text: 至驗於人之色發於人之聲然後能
  - page: 454
    col: 11
    role: z
    text: 警悟而通曉也
  - page: 454
    col: 12
    role: j
    text: 入則無法家拂士出則無敵國外患者
  - page: 454
    col: 13
    role: j
    text: 國恒亡
  - page: 454
    col: 14
    role: z
    text: 拂與弼同○此言國亦然也法家法
  - page: 454
    col: 15
    role: z
    text: 度之世臣也拂士輔拂之賢士也
  - page: 454
    col: 16
    role: j
    text: 然後知生於憂患而死於安樂也
  - page: 455
    col: 1
    role: z
    text: 樂音洛○以上文觀之則知人之生
  - page: 455
    col: 2
    role: z
    text: 全出於憂患而死亡由於安樂矣○
  - page: 455
    col: 3
    role: z
    text: 尹氏曰言困窮拂鬱能堅人之志而
  - page: 455
    col: 4
    role: z
    text: 熟人之仁以安樂失之者多矣
  - page: 455
    col: 5
    role: j
    text: 孟子曰教亦多術矣予不屑之教誨也
  - page: 455
    col: 6
    role: j
    text: 者是亦教誨之而已矣
  - page: 455
    col: 7
    role: z
    text: 多術言非一端屑潔也不以其人爲
  - page: 455
    col: 8
    role: z
    text: 潔而拒絕之所謂不屑之教誨也其
  - page: 455
    col: 9
    role: z
    text: 人若能感此退自修省則是亦我教
  - page: 455
    col: 10
    role: z
    text: 誨之也○尹氏曰言或抑或揚或與
  - page: 455
    col: 11
    role: z
    text: 或不與各因其才而篤之無非教也
  - page: 455
    col: 15
    role: j
    text: 孟子卷第十二
