labels:
  - page: 235
    col: 9
    role: j
    text: 孟子卷第七朱熹集注
  - page: 235
    col: 10
    role: title
    text: 離婁章句上
  - page: 235
    col: 11
    role: z
    text: 凡二十八章
  - page: 235
    col: 12
    role: j
    text: 孟子曰離婁之明公輸子之巧不以規
  - page: 235
    col: 13
    role: j
    text: 矩不能成方貟師曠之聰不以六律不
  - page: 235
    col: 14
    role: j
    text: 能正五音堯舜之道不以仁政不能平
  - page: 235
    col: 15
    role: j
    text: 治天下
  - page: 235
    col: 16
    role: z
    text: 離婁古之明目者公輸子名班魯之
  - page: 236
    col: 1
    role: z
    text: 巧人也規所以爲貟之器也矩所以
  - page: 236
    col: 2
    role: z
    text: 爲方之器也師曠晉之樂師知音者
  - page: 236
    col: 3
    role: z
    text: 也六律截竹爲筩隂陽各六以節五
  - page: 236
    col: 4
    role: z
    text: 音之上下黃鍾太蔟姑洗蕤賔夷則
  - page: 236
    col: 5
    role: z
    text: 無射爲陽大吕夾鍾仲吕林鍾南吕
  - page: 236
    col: 6
    role: z
    text: 應鍾爲隂也五音宫商角徵羽也○
  - page: 236
    col: 7
    role: z
    text: 范氏曰此言治天下不可無法度仁
  - page: 236
    col: 8
    role: z
    text: 政者治天下之法度也
  - page: 236
    col: 9
    role: j
    text: 今有仁心仁聞而民不被其澤不可法
  - page: 236
    col: 10
    role: j
    text: 於後世者不行先王之道也
  - page: 236
    col: 11
    role: z
    text: 聞去聲○仁心愛人之心也仁聞者
  - page: 236
    col: 12
    role: z
    text: 有愛人之聲聞於人也先王之道仁
  - page: 236
    col: 13
    role: z
    text: 政是也范氏曰齊宣王不忍一牛之
  - page: 236
    col: 14
    role: z
    text: 死以羊易之可謂有仁心梁武帝終
  - page: 236
    col: 15
    role: z
    text: 日一食蔬素宗廟以麵爲犧牲斷死
  - page: 236
    col: 16
    role: z
    text: 刑必爲之涕泣天下知其慈仁可謂
  - page: 237
    col: 1
    role: z
    text: 有仁聞然而宣王之時齊國不治武
  - page: 237
    col: 2
    role: z
    text: 帝之末江南大亂其故何哉有仁心
  - page: 237
    col: 3
    role: z
    text: 仁聞而不行先王之道故也
  - page: 237
    col: 4
    role: j
    text: 故曰徒善不足以為政徒法不能以自
  - page: 237
    col: 5
    role: j
    text: 行
  - page: 237
    col: 6
    role: z
    text: 徒猶空也有其心無其政是謂徒善
  - page: 237
    col: 7
    role: z
    text: 有其政無其心是謂徒法程子嘗言
  - page: 237
    col: 8
    role: z
    text: 為政須要有綱紀文章謹權審量讀
  - page: 237
    col: 9
    role: z
    text: 法平價皆不可闕而又曰必有關雎
  - page: 237
    col: 10
    role: z
    text: 麟趾之意然後可以行周官之法度
  - page: 237
    col: 11
    role: z
    text: 正謂此也
  - page: 237
    col: 12
    role: j
    text: 詩云不愆不忘率由舊章遵先王之法
  - page: 237
    col: 13
    role: j
    text: 而過者未之有也
  - page: 237
    col: 14
    role: z
    text: 詩大雅假樂之篇愆過也率循也章
  - page: 237
    col: 15
    role: z
    text: 典法也所行不過差不遺忘者以其
  - page: 237
    col: 16
    role: z
    text: 循用舊典故也
  - page: 238
    col: 1
    role: j
    text: 聖人旣竭目力焉繼之以規矩準繩以
  - page: 238
    col: 2
    role: j
    text: 爲方貟平直不可勝用也旣竭耳力焉
  - page: 238
    col: 3
    role: j
    text: 繼之以六律正五音不可勝用也旣竭
  - page: 238
    col: 4
    role: j
    text: 心思焉繼之以不忍人之政而仁覆天
  - page: 238
    col: 5
    role: j
    text: 下矣
  - page: 238
    col: 6
    role: z
    text: 勝平聲○準所以爲平繩所以爲直
  - page: 238
    col: 7
    role: z
    text: 覆被也此言古之聖人旣竭耳目心
  - page: 238
    col: 8
    role: z
    text: 思之力然猶以爲未足以徧天下及
  - page: 238
    col: 9
    role: z
    text: 後世故制爲法度以繼續之則其用
  - page: 238
    col: 10
    role: z
    text: 不窮而仁之所被廣矣
  - page: 238
    col: 11
    role: j
    text: 故曰爲髙必因丘陵爲下必因川澤爲
  - page: 238
    col: 12
    role: j
    text: 政不因先王之道可謂智乎
  - page: 238
    col: 13
    role: z
    text: 丘陵本髙川澤本下爲髙下者因之
  - page: 238
    col: 14
    role: z
    text: 則用力少而成功多矣鄒氏曰自章
  - page: 238
    col: 15
    role: z
    text: 首至此論以仁心仁聞行先王之道
  - page: 238
    col: 16
    role: j
    text: 是以惟仁者冝在髙位不仁而在髙位
  - page: 239
    col: 1
    role: j
    text: 是播其惡於衆也
  - page: 239
    col: 2
    role: z
    text: 仁者有仁心仁聞而能擴而充之以
  - page: 239
    col: 3
    role: z
    text: 行先王之道者也播惡於衆謂貽患
  - page: 239
    col: 4
    role: z
    text: 於下也
  - page: 239
    col: 5
    role: j
    text: 上無道揆也下無法守也朝不信道工
  - page: 239
    col: 6
    role: j
    text: 不信度君子犯義小人犯刑國之所存
  - page: 239
    col: 7
    role: j
    text: 者幸也
  - page: 239
    col: 8
    role: z
    text: 朝音潮○此言不仁而在高位之禍
  - page: 239
    col: 9
    role: z
    text: 也道義理也揆度也法制度也道揆
  - page: 239
    col: 10
    role: z
    text: 謂以義理度量事物而制其宜法守
  - page: 239
    col: 11
    role: z
    text: 謂以法度自守工官也度即法也君
  - page: 239
    col: 12
    role: z
    text: 子小人以位而言也由上無道揆故
  - page: 239
    col: 13
    role: z
    text: 下無法守無道揆則朝不信道而君
  - page: 239
    col: 14
    role: z
    text: 子犯義無法守則工不信度而小人
  - page: 239
    col: 15
    role: z
    text: 犯刑有此六者其國必亡其不亡者
  - page: 239
    col: 16
    role: z
    text: 僥倖而已
  - page: 240
    col: 1
    role: j
    text: 故曰城郭不完兵甲不多非國之災也
  - page: 240
    col: 2
    role: j
    text: 田野不辟貨財不聚非國之害也上無
  - page: 240
    col: 3
    role: j
    text: 禮下無學賊民興喪無日矣
  - page: 240
    col: 4
    role: z
    text: 辟與闢同喪去聲○上不知禮則無
  - page: 240
    col: 5
    role: z
    text: 以教民下不知學則易與爲亂鄒氏
  - page: 240
    col: 6
    role: z
    text: 曰自是以仁者至此所以責其君
  - page: 240
    col: 7
    role: j
    text: 詩曰天之方蹶無然泄泄
  - page: 240
    col: 8
    role: z
    text: 蹶居衛反泄弋制反○詩大雅板之
  - page: 240
    col: 9
    role: z
    text: 篇蹶顛覆之意泄泄怠緩悅從之貌
  - page: 240
    col: 10
    role: z
    text: 言天欲顛覆周室羣臣無得泄泄然
  - page: 240
    col: 11
    role: z
    text: 不急救正之
  - page: 240
    col: 12
    role: j
    text: 泄泄猶沓沓也
  - page: 240
    col: 13
    role: z
    text: 沓徒合反○沓沓即泄泄之意蓋孟
  - page: 240
    col: 14
    role: z
    text: 子時人語如此
  - page: 240
    col: 15
    role: j
    text: 事君無義進退無禮言則非先王之道
  - page: 240
    col: 16
    role: j
    text: 者猶沓沓也
  - page: 241
    col: 1
    role: z
    text: 非詆毀也
  - page: 241
    col: 2
    role: j
    text: 故曰責難於君謂之恭陳善閉邪謂之
  - page: 241
    col: 3
    role: j
    text: 敬吾君不能謂之賊
  - page: 241
    col: 4
    role: z
    text: 范氏曰人臣以難事責於君使其君
  - page: 241
    col: 5
    role: z
    text: 爲堯舜之君者尊君之大也開陳善
  - page: 241
    col: 6
    role: z
    text: 道以禁閉君之邪心唯恐其君或陷
  - page: 241
    col: 7
    role: z
    text: 於有過之地者敬君之至也謂其君
  - page: 241
    col: 8
    role: z
    text: 不能行善道而不以告者賊害其君
  - page: 241
    col: 9
    role: z
    text: 之甚也○鄒氏曰自詩云天之方蹶
  - page: 241
    col: 10
    role: z
    text: 至此所以責其臣○鄒氏曰此章言
  - page: 241
    col: 11
    role: z
    text: 爲治者當有仁心仁聞以行先王之
  - page: 241
    col: 12
    role: z
    text: 政而君臣又當各任其責也
  - page: 241
    col: 13
    role: j
    text: 孟子曰規矩方貟之至也聖人人倫之
  - page: 241
    col: 14
    role: j
    text: 至也
  - page: 241
    col: 15
    role: z
    text: 至極也人倫說見前篇規矩盡所以
  - page: 241
    col: 16
    role: z
    text: 爲方貟之理猶聖人盡所以爲人之
  - page: 242
    col: 1
    role: z
    text: 道
  - page: 242
    col: 2
    role: j
    text: 欲爲君盡君道欲爲臣盡臣道二者皆
  - page: 242
    col: 3
    role: j
    text: 法堯舜而已矣不以舜之所以事堯事
  - page: 242
    col: 4
    role: j
    text: 君不敬其君者也不以堯之所以治民
  - page: 242
    col: 5
    role: j
    text: 治民賊其民者也
  - page: 242
    col: 6
    role: z
    text: 法堯舜以盡君臣之道猶用規矩以
  - page: 242
    col: 7
    role: z
    text: 盡方貟之極此孟子所以道性善而
  - page: 242
    col: 8
    role: z
    text: 稱堯舜也
  - page: 242
    col: 9
    role: j
    text: 孔子曰道二仁與不仁而已矣
  - page: 242
    col: 10
    role: z
    text: 法堯舜則盡君臣之道而仁矣不法
  - page: 242
    col: 11
    role: z
    text: 堯舜則慢君賊民而不仁矣二端之
  - page: 242
    col: 12
    role: z
    text: 外更無佗道出乎此則入乎彼矣可
  - page: 242
    col: 13
    role: z
    text: 不謹哉
  - page: 242
    col: 14
    role: j
    text: 暴其民甚則身弑國亡不甚則身危國
  - page: 242
    col: 15
    role: j
    text: 削名之曰幽厲雖孝子慈孫百世不能
  - page: 242
    col: 16
    role: j
    text: 改也
  - page: 243
    col: 1
    role: z
    text: 幽暗厲虐皆惡謚也苟得其實則雖
  - page: 243
    col: 2
    role: z
    text: 有孝慈孫愛其祖考之甚者亦不
  - page: 243
    col: 3
    role: z
    text: 得廢公義而改之言不仁之禍必至
  - page: 243
    col: 4
    role: z
    text: 於此可懼之甚也
  - page: 243
    col: 5
    role: j
    text: 詩云殷鑒不遠在夏后之世此之謂也
  - page: 243
    col: 6
    role: z
    text: 詩大雅蕩之篇言商紂之所當鑒者
  - page: 243
    col: 7
    role: z
    text: 近在夏桀之世而孟子引之又欲後
  - page: 243
    col: 8
    role: z
    text: 人以幽厲為鑒也
  - page: 243
    col: 9
    role: j
    text: 孟子曰三代之得天下也以仁其失天
  - page: 243
    col: 10
    role: j
    text: 下也以不仁
  - page: 243
    col: 11
    role: z
    text: 三代謂夏商周也禹湯文武以仁得
  - page: 243
    col: 12
    role: z
    text: 之桀紂幽厲以不仁失之
  - page: 243
    col: 13
    role: j
    text: 國之所以廢興存亡者亦然
  - page: 243
    col: 14
    role: z
    text: 國謂諸侯之國
  - page: 243
    col: 15
    role: j
    text: 天子不仁不保四海諸侯不仁不保社
  - page: 243
    col: 16
    role: j
    text: 稷卿大夫不仁不保宗廟士庶人不仁
  - page: 244
    col: 1
    role: j
    text: 不保四體
  - page: 244
    col: 2
    role: z
    text: 言必死亡
  - page: 244
    col: 3
    role: j
    text: 今惡死亡而樂不仁是猶惡醉而強酒
  - page: 244
    col: 4
    role: z
    text: 惡去聲樂音洛強上聲○此承上章
  - page: 244
    col: 5
    role: z
    text: 之意而推言之也
  - page: 244
    col: 6
    role: j
    text: 孟子曰愛人不親反其仁治人不治反
  - page: 244
    col: 7
    role: j
    text: 其智禮人不答反其敬
  - page: 244
    col: 8
    role: z
    text: 治人之治平聲不治之治去聲○我
  - page: 244
    col: 9
    role: z
    text: 愛人而人不親我則反求諸己恐我
  - page: 244
    col: 10
    role: z
    text: 之仁未至也智敬放此
  - page: 244
    col: 11
    role: j
    text: 行有不得者皆反求諸己其身正而天
  - page: 244
    col: 12
    role: j
    text: 下歸之
  - page: 244
    col: 13
    role: z
    text: 不得謂不得其所欲如不親不治不
  - page: 244
    col: 14
    role: z
    text: 答是也反求諸己謂反其仁反其智
  - page: 244
    col: 15
    role: z
    text: 反其敬也如此則其自治益詳而身
  - page: 244
    col: 16
    role: z
    text: 無不正矣天下歸之極言其效也
  - page: 245
    col: 1
    role: j
    text: 詩云永言配命自求多福
  - page: 245
    col: 2
    role: z
    text: 解見前篇○亦承上章而言
  - page: 245
    col: 3
    role: j
    text: 孟子曰人有恒言皆曰天下國家天下
  - page: 245
    col: 4
    role: j
    text: 之本在國國之本在家家之本在身
  - page: 245
    col: 5
    role: z
    text: 恒胡登反○恒常也雖常言之而未
  - page: 245
    col: 6
    role: z
    text: 必知其言之有序也故推言之而又
  - page: 245
    col: 7
    role: z
    text: 以家本乎身也此亦承上章而言之
  - page: 245
    col: 8
    role: z
    text: 大學所謂自天子至於庶人壹是皆
  - page: 245
    col: 9
    role: z
    text: 以修身爲本爲是故也
  - page: 245
    col: 10
    role: j
    text: 孟子曰爲政不難不得罪於巨室巨室
  - page: 245
    col: 11
    role: j
    text: 之所慕一國慕之一國之所慕天下慕
  - page: 245
    col: 12
    role: j
    text: 之故沛然德教溢乎四海
  - page: 245
    col: 13
    role: z
    text: 巨室世臣大家也得罪謂身不正而
  - page: 245
    col: 14
    role: z
    text: 取怨怒也麥丘邑人祝齊威公曰願
  - page: 245
    col: 15
    role: z
    text: 主君無得罪於羣臣百姓意蓋如此
  - page: 245
    col: 16
    role: z
    text: 慕向也心悅誠服之謂也沛然盛大
  - page: 246
    col: 1
    role: j
    text: 流行之貌溢充滿也蓋巨室之心難
  - page: 246
    col: 2
    role: j
    text: 以力服而國人素所取信今既悅服
  - page: 246
    col: 3
    role: j
    text: 則國人皆服而吾德教之所施可以
  - page: 246
    col: 4
    role: j
    text: 無遠而不至矣此亦承上章而言蓋
  - page: 246
    col: 5
    role: j
    text: 君子不患人心之不服而患吾身之
  - page: 246
    col: 6
    role: j
    text: 不修吾身既修則人心之難服者先
  - page: 246
    col: 7
    role: j
    text: 服而無一人之不服矣○林氏曰戰
  - page: 246
    col: 8
    role: j
    text: 國之世諸侯失德巨室擅權為患甚
  - page: 246
    col: 9
    role: j
    text: 矣然或者不修其本而遽欲勝之則
  - page: 246
    col: 10
    role: j
    text: 未必能勝而適以取禍故孟子推本
  - page: 246
    col: 11
    role: j
    text: 而言惟務修德以服其心彼既悅服
  - page: 246
    col: 12
    role: j
    text: 則吾之德教無所留礙可以及乎天
  - page: 246
    col: 13
    role: j
    text: 下矣裴度所謂韓洪輿疾討賊承宗
  - page: 246
    col: 14
    role: j
    text: 斂手削地非朝廷之力能制其死命
  - page: 246
    col: 15
    role: j
    text: 特以處置得宜能服其心故爾政此
  - page: 246
    col: 16
    role: j
    text: 類也
  - page: 247
    col: 1
    role: j
    text: 孟子曰天下有道小德役大德小賢役
  - page: 247
    col: 2
    role: j
    text: 大賢天下無道小役大弱役強斯二者
  - page: 247
    col: 3
    role: j
    text: 天也順天者存逆天者亡
  - page: 247
    col: 4
    role: z
    text: 有道之世人皆修德而位必稱其德
  - page: 247
    col: 5
    role: z
    text: 之大小天下無道人不修德則但以
  - page: 247
    col: 6
    role: z
    text: 力相役而巳天者理勢之當然也
  - page: 247
    col: 7
    role: j
    text: 齊景公曰旣不能令又不受命是絶物
  - page: 247
    col: 8
    role: j
    text: 也涕出而女於吳
  - page: 247
    col: 9
    role: z
    text: 女去聲○引此以言小役大弱役強
  - page: 247
    col: 10
    role: z
    text: 之事也令出令以使人也受命聽命
  - page: 247
    col: 11
    role: z
    text: 於人也物猶人也女以女與人也呉
  - page: 247
    col: 12
    role: z
    text: 蠻夷之國也景公羞與爲昬而畏其
  - page: 247
    col: 13
    role: z
    text: 強故涕泣而以女與之
  - page: 247
    col: 14
    role: j
    text: 今也小國師大國而恥受命焉是猶弟
  - page: 247
    col: 15
    role: j
    text: 子而恥受命於先師也
  - page: 247
    col: 16
    role: z
    text: 言小國不修德以自強其般樂怠敖
  - page: 248
    col: 1
    role: j
    text: 皆若效大國之所為者而獨恥受其
  - page: 248
    col: 2
    role: z
    text: 教命不可得也
  - page: 248
    col: 3
    role: j
    text: 如恥之莫若師文王師文王大國五年
  - page: 248
    col: 4
    role: j
    text: 小國七年必為政於天下矣
  - page: 248
    col: 5
    role: j
    text: 此因其愧恥之心而勉以修德也文
  - page: 248
    col: 6
    role: j
    text: 王之政布在方策舉而行之所謂師
  - page: 248
    col: 7
    role: j
    text: 文王也五年七年以其所乘之勢不
  - page: 248
    col: 8
    role: j
    text: 同為差蓋天下雖無道然修德之至
  - page: 248
    col: 9
    role: j
    text: 則道自我行而大國反為吾役矣○
  - page: 248
    col: 10
    role: j
    text: 程子曰五年七年聖人度其時則可
  - page: 248
    col: 11
    role: j
    text: 矣然凡此類學者皆當思其作為如
  - page: 248
    col: 12
    role: z
    text: 何乃有益耳
  - page: 248
    col: 13
    role: j
    text: 詩云商之孫子其麗不億上帝既命侯
  - page: 248
    col: 14
    role: j
    text: 于周服侯服于周天命靡常殷士膚敏
  - page: 248
    col: 15
    role: j
    text: 祼將于京孔子曰仁不可為衆也夫國
  - page: 248
    col: 16
    role: j
    text: 君好仁天下無敵
  - page: 249
    col: 1
    role: z
    text: 祼音灌夫音扶好去聲○詩大雅文
  - page: 249
    col: 2
    role: z
    text: 王之篇孟子引此詩及孔子之言以
  - page: 249
    col: 3
    role: z
    text: 言文王之事麗數也十萬曰億侯維
  - page: 249
    col: 4
    role: z
    text: 也商士商孫子之臣也膚大也敏達
  - page: 249
    col: 5
    role: z
    text: 也祼宗廟之祭以鬱鬯之酒灌地而
  - page: 249
    col: 6
    role: z
    text: 降神也將助也言商之孫子眾多其
  - page: 249
    col: 7
    role: z
    text: 數不但十萬而已上帝既命周以天
  - page: 249
    col: 8
    role: z
    text: 下則凡此商之孫子皆臣服于周矣
  - page: 249
    col: 9
    role: z
    text: 所以然者以天命不常歸于有德故
  - page: 249
    col: 10
    role: z
    text: 也是以商士之膚大而敏達者皆執
  - page: 249
    col: 11
    role: z
    text: 祼獻之禮助王祭事于周之京師也
  - page: 249
    col: 12
    role: z
    text: 孔子因讀此詩而言有仁者則雖有
  - page: 249
    col: 13
    role: z
    text: 十萬之眾不能當之故國君好仁則
  - page: 249
    col: 14
    role: z
    text: 必無敵於天下也不可為眾猶所謂
  - page: 249
    col: 15
    role: z
    text: 難為兄難為弟云爾
  - page: 249
    col: 16
    role: j
    text: 今也欲無敵於天下而不以仁是猶執
  - page: 250
    col: 1
    role: j
    text: 熱而不以濯也詩云誰能執熱逝不以
  - page: 250
    col: 2
    role: j
    text: 濯
  - page: 250
    col: 3
    role: z
    text: 恥受命於大國是欲無敵於天下也
  - page: 250
    col: 4
    role: z
    text: 乃師大國而不師文王是不以仁也
  - page: 250
    col: 5
    role: z
    text: 詩大雅桑柔之篇逝語辭也言誰能
  - page: 250
    col: 6
    role: z
    text: 執持熱物而不以水自濯其手乎○
  - page: 250
    col: 7
    role: z
    text: 此章言不能自強則聽天所命修德
  - page: 250
    col: 8
    role: z
    text: 行仁則天命在我
  - page: 250
    col: 9
    role: j
    text: 孟子曰不仁者可與言哉安其危而利
  - page: 250
    col: 10
    role: j
    text: 其葘樂其所以亡者不仁而可與言則
  - page: 250
    col: 11
    role: j
    text: 何云國敗家之有
  - page: 250
    col: 12
    role: z
    text: 葘與灾同樂音洛○安其危利其葘
  - page: 250
    col: 13
    role: z
    text: 者不知其為危葘而反以為安利也
  - page: 250
    col: 14
    role: z
    text: 所以亡者謂荒淫暴虐所以致亡之
  - page: 250
    col: 15
    role: z
    text: 道也不仁之人私欲固蔽失其本心
  - page: 250
    col: 16
    role: z
    text: 故其顛倒錯亂至於如此所以不可
  - page: 251
    col: 1
    role: z
    text: 告以忠言而卒至於敗亡也
  - page: 251
    col: 2
    role: j
    text: 有孺子歌曰滄浪之水清兮可以濯我
  - page: 251
    col: 3
    role: j
    text: 纓滄浪之水濁兮可以濯我足
  - page: 251
    col: 4
    role: z
    text: 浪音郎○滄浪水名纓冠系也
  - page: 251
    col: 5
    role: j
    text: 孔子曰小子聽之清斯濯纓濁斯濯足
  - page: 251
    col: 6
    role: j
    text: 矣自取之也
  - page: 251
    col: 7
    role: z
    text: 言水之清濁有以自取之也聖人聲
  - page: 251
    col: 8
    role: z
    text: 入心通無非至理此類可見
  - page: 251
    col: 9
    role: j
    text: 夫人必自侮然後人侮之家必自毀而
  - page: 251
    col: 10
    role: j
    text: 後人毀之國必自伐而後人伐之
  - page: 251
    col: 11
    role: z
    text: 夫音扶○所謂自取之者
  - page: 251
    col: 12
    role: j
    text: 太甲曰天作孽猶可違自作孽不可活
  - page: 251
    col: 13
    role: j
    text: 此之謂也
  - page: 251
    col: 14
    role: z
    text: 解見前篇○此章言心存則有以審
  - page: 251
    col: 15
    role: z
    text: 夫得失之幾不存則無以辨於存亡
  - page: 251
    col: 16
    role: z
    text: 之著禍福之來皆其自取
  - page: 252
    col: 1
    role: j
    text: 孟子曰桀紂之失天下也失其民也失
  - page: 252
    col: 2
    role: j
    text: 其民者失其心也得天下有道得其民
  - page: 252
    col: 3
    role: j
    text: 斯得天下矣得其民有道得其心斯得
  - page: 252
    col: 4
    role: j
    text: 民矣得其心有道所欲與之聚之所惡
  - page: 252
    col: 5
    role: j
    text: 勿施爾也
  - page: 252
    col: 6
    role: z
    text: 惡去聲○民之所欲皆為致之如聚
  - page: 252
    col: 7
    role: z
    text: 斂然民之所惡則勿施於民鼂錯所
  - page: 252
    col: 8
    role: z
    text: 謂人情莫不欲壽三王生之而不傷
  - page: 252
    col: 9
    role: z
    text: 人情莫不欲富三王厚之而不困人
  - page: 252
    col: 10
    role: z
    text: 情莫不欲安三王扶之而不危人情
  - page: 252
    col: 11
    role: z
    text: 莫不欲逸三王節其力而不盡此類
  - page: 252
    col: 12
    role: z
    text: 之謂也
  - page: 252
    col: 13
    role: j
    text: 民之歸仁也猶水之就下獸之走壙也
  - page: 252
    col: 14
    role: z
    text: 走音奏○壙廣野也言民之所以歸
  - page: 252
    col: 15
    role: z
    text: 乎此以其所欲之在乎此也
  - page: 252
    col: 16
    role: j
    text: 故為淵敺魚者獺也為叢敺爵者鸇也
  - page: 253
    col: 1
    role: j
    text: 爲湯武敺民者桀與紂也
  - page: 253
    col: 2
    role: z
    text: 爲去聲敺與驅同獺音闥爵與雀同
  - page: 253
    col: 3
    role: z
    text: 鸇諸延反○淵深水也獺食魚者也
  - page: 253
    col: 4
    role: z
    text: 叢茂林也鸇食雀者也言民之所以
  - page: 253
    col: 5
    role: z
    text: 去此以其所欲在彼而所畏在此也
  - page: 253
    col: 6
    role: j
    text: 今天下之君有好仁者則諸侯皆爲之
  - page: 253
    col: 7
    role: j
    text: 敺矣雖欲無王不可得已
  - page: 253
    col: 8
    role: z
    text: 好爲王皆去聲
  - page: 253
    col: 9
    role: j
    text: 今之欲王者猶七年之病求三年之艾
  - page: 253
    col: 10
    role: j
    text: 也苟爲不畜終身不得苟不志於仁終
  - page: 253
    col: 11
    role: j
    text: 身憂辱以陷於死亡
  - page: 253
    col: 12
    role: z
    text: 王去聲○艾草名所以灸者乾乆益
  - page: 253
    col: 13
    role: z
    text: 善夫病已深而欲求乾乆之艾固卒
  - page: 253
    col: 14
    role: z
    text: 難辦然自今畜之則猶或可及不然
  - page: 253
    col: 15
    role: z
    text: 則病日益深死日益迫而艾終不可
  - page: 253
    col: 16
    role: z
    text: 得矣
  - page: 254
    col: 1
    role: j
    text: 詩云其何能淑載胥及溺此之謂也
  - page: 254
    col: 2
    role: z
    text: 詩大雅桑柔之篇淑善也載則也胥
  - page: 254
    col: 3
    role: z
    text: 相也言今之所爲其何能善則相引
  - page: 254
    col: 4
    role: z
    text: 以陷於亂亡而已
  - page: 254
    col: 5
    role: j
    text: 孟子曰自暴者不可與有言也自棄者
  - page: 254
    col: 6
    role: j
    text: 不可與有爲也言非禮義謂之自暴也
  - page: 254
    col: 7
    role: j
    text: 吾身不能居仁由義謂之自棄也
  - page: 254
    col: 8
    role: z
    text: 暴猶害也非猶毀也自害其身者不
  - page: 254
    col: 9
    role: j
    text: 知禮義之爲美而非毀之雖與之言
  - page: 254
    col: 10
    role: j
    text: 必不見信也自棄其身者猶知禮義
  - page: 254
    col: 11
    role: j
    text: 之爲美但溺於怠惰自謂必不能行
  - page: 254
    col: 12
    role: j
    text: 與之有爲必不能勉也○程子曰人
  - page: 254
    col: 13
    role: j
    text: 苟以善自治則無不可移者雖昏愚
  - page: 254
    col: 14
    role: j
    text: 之至皆可漸磨而進也惟自暴者拒
  - page: 254
    col: 15
    role: j
    text: 之以不信自棄者絕之以不爲雖聖
  - page: 254
    col: 16
    role: j
    text: 人與居不能化而入也此所謂下愚
  - page: 255
    col: 1
    role: z
    text: 之不移也
  - page: 255
    col: 2
    role: j
    text: 仁人之安宅也義人之正路也
  - page: 255
    col: 3
    role: j
    text: 仁宅已見前篇義者宜也乃天理之
  - page: 255
    col: 4
    role: z
    text: 當行無人欲之邪曲故曰正路
  - page: 255
    col: 5
    role: j
    text: 曠安宅而弗居舍正路而不由哀哉
  - page: 255
    col: 6
    role: z
    text: 舍上聲○曠空也由行也○此章言
  - page: 255
    col: 7
    role: z
    text: 道本固有而人自絕之是可哀已此
  - page: 255
    col: 8
    role: z
    text: 聖賢之深戒學者所當猛省也
  - page: 255
    col: 9
    role: j
    text: 孟子曰道在爾而求諸遠事在易而求
  - page: 255
    col: 10
    role: j
    text: 之難人人親其親長其長而天下平
  - page: 255
    col: 11
    role: z
    text: 爾邇古字通用易去聲長上聲○親
  - page: 255
    col: 12
    role: z
    text: 長在人為甚邇親之長在人為甚
  - page: 255
    col: 13
    role: z
    text: 易而道初不外是也舍此而它求則
  - page: 255
    col: 14
    role: z
    text: 遠且難而反失之但人人各親其親
  - page: 255
    col: 15
    role: z
    text: 各長其長則天下自平矣
  - page: 255
    col: 16
    role: j
    text: 孟子曰居下位而不獲於上民不可得
  - page: 256
    col: 1
    role: j
    text: 而治也獲於上有道不信於友弗獲於
  - page: 256
    col: 2
    role: j
    text: 上矣信於友有道事親弗悅弗信於友
  - page: 256
    col: 3
    role: j
    text: 矣悅親有道反身不誠不悅於親矣誠
  - page: 256
    col: 4
    role: j
    text: 身有道不明乎善不誠其身矣
  - page: 256
    col: 5
    role: z
    text: 獲於上得其上之信任也誠實也反
  - page: 256
    col: 6
    role: z
    text: 身不誠反求諸身而其所以爲善之
  - page: 256
    col: 7
    role: z
    text: 心有不實也不明乎善不能即事以
  - page: 256
    col: 8
    role: z
    text: 窮理無以眞知善之所在也○游氏
  - page: 256
    col: 9
    role: z
    text: 曰欲誠其意先致其知不明乎善不
  - page: 256
    col: 10
    role: z
    text: 誠乎身矣學至於誠身則安往而不
  - page: 256
    col: 11
    role: z
    text: 致其極哉以内則順乎親以外則信
  - page: 256
    col: 12
    role: z
    text: 乎友以上則可以得君以下則可以
  - page: 256
    col: 13
    role: z
    text: 得民矣
  - page: 256
    col: 14
    role: j
    text: 是故誠者天之道也思誠者人之道也
  - page: 256
    col: 15
    role: z
    text: 誠者理之在我者皆實而無僞天道
  - page: 256
    col: 16
    role: z
    text: 之本然也思誠者欲此理之在我者
  - page: 257
    col: 1
    role: z
    text: 皆實而無僞人道之當然也
  - page: 257
    col: 2
    role: j
    text: 至誠而不動者未之有也不誠未有能
  - page: 257
    col: 3
    role: j
    text: 動者也
  - page: 257
    col: 4
    role: z
    text: 至極也○楊氏曰動便是驗處若獲
  - page: 257
    col: 5
    role: z
    text: 乎上信乎友悅於親之類是也○此
  - page: 257
    col: 6
    role: z
    text: 章述中庸孔子之言見思誠爲脩身
  - page: 257
    col: 7
    role: z
    text: 之本而明善又爲思誠之本乃子思
  - page: 257
    col: 8
    role: z
    text: 所聞於曾子而孟子所受乎子思者
  - page: 257
    col: 9
    role: z
    text: 亦與大學相表裏學者冝潛心焉
  - page: 257
    col: 10
    role: j
    text: 孟子曰伯夷辟紂居北海之濱聞文王
  - page: 257
    col: 11
    role: j
    text: 作興曰盍歸乎來吾聞西伯善養老者
  - page: 257
    col: 12
    role: j
    text: 太公辟紂居東海之濱聞文王作興曰
  - page: 257
    col: 13
    role: j
    text: 盍歸乎來吾聞西伯善養老者
  - page: 257
    col: 14
    role: z
    text: 辟去聲○作興皆起也盍何不也西
  - page: 257
    col: 15
    role: z
    text: 伯即文王也紂命爲西方諸侯之長
  - page: 257
    col: 16
    role: z
    text: 得專征伐故稱西伯太公姜姓吕氏
  - page: 258
    col: 1
    role: z
    text: 名尚文王發政必先鰥寡孤獨庶人
  - page: 258
    col: 2
    role: z
    text: 之老皆無凍餒故伯夷太公來就其
  - page: 258
    col: 3
    role: z
    text: 養非求仕也
  - page: 258
    col: 4
    role: j
    text: 二老者天下之大老也而歸之是天下
  - page: 258
    col: 5
    role: j
    text: 之父歸之也天下之父歸之其子焉往
  - page: 258
    col: 6
    role: z
    text: 焉於虔反○二老伯夷太公也大老
  - page: 258
    col: 7
    role: z
    text: 言非常人之老者天下之父言齒德
  - page: 258
    col: 8
    role: z
    text: 皆尊如衆父然既得其心則天下之
  - page: 258
    col: 9
    role: z
    text: 心不能外矣蕭何所謂養民致賢以
  - page: 258
    col: 10
    role: z
    text: 圖天下者暗與此合但其意則有公
  - page: 258
    col: 11
    role: z
    text: 私之辨學者又不可以不察也
  - page: 258
    col: 12
    role: j
    text: 諸侯有行文王之政者七年之内必爲
  - page: 258
    col: 13
    role: j
    text: 政於天下矣
  - page: 258
    col: 14
    role: z
    text: 七年以小國而言也大國五年在其
  - page: 258
    col: 15
    role: z
    text: 中矣
  - page: 258
    col: 16
    role: j
    text: 孟子曰求也爲季氏宰無能改於其德
  - page: 259
    col: 1
    role: j
    text: 而賦粟倍他日孔子曰求非我徒也小
  - page: 259
    col: 2
    role: j
    text: 子鳴鼓而攻之可也
  - page: 259
    col: 3
    role: z
    text: 求孔子弟子冉求季氏魯卿宰家臣
  - page: 259
    col: 4
    role: z
    text: 賦猶取也取民之粟倍於他日也小
  - page: 259
    col: 5
    role: z
    text: 子弟子也鳴鼓而攻之聲其罪而責
  - page: 259
    col: 6
    role: z
    text: 之也
  - page: 259
    col: 7
    role: j
    text: 由此觀之君不行仁政而冨之皆棄於
  - page: 259
    col: 8
    role: j
    text: 孔子者也况於爲之強戰爭地以戰殺
  - page: 259
    col: 9
    role: j
    text: 人盈野爭城以戰殺人盈城此所謂率
  - page: 259
    col: 10
    role: j
    text: 土地而食人肉罪不容於死
  - page: 259
    col: 11
    role: z
    text: 爲去聲○林氏曰冨其君者奪民之
  - page: 259
    col: 12
    role: z
    text: 財耳而夫子猶惡之况爲土地之故
  - page: 259
    col: 13
    role: z
    text: 而殺人使其肝腦塗地則是率土地
  - page: 259
    col: 14
    role: z
    text: 而食人之肉其罪之大雖至於死猶
  - page: 259
    col: 15
    role: z
    text: 不足以容之也
  - page: 259
    col: 16
    role: j
    text: 故善戰者服上刑連諸侯者次之辟草
  - page: 260
    col: 1
    role: j
    text: 萊任土地者次之
  - page: 260
    col: 2
    role: z
    text: 辟與闢同○善戰如孫臏呉起之徒
  - page: 260
    col: 3
    role: z
    text: 連結諸侯如蘇秦張儀之類辟開墾
  - page: 260
    col: 4
    role: z
    text: 也任土地謂分土授民使任耕稼之
  - page: 260
    col: 5
    role: z
    text: 責如李悝盡地力商鞅開阡陌之類
  - page: 260
    col: 6
    role: z
    text: 也
  - page: 260
    col: 7
    role: j
    text: 孟子曰存乎人者莫良於眸子眸子不
  - page: 260
    col: 8
    role: j
    text: 能掩其惡胷中正則眸子瞭焉胷中不
  - page: 260
    col: 9
    role: j
    text: 正則眸子眊焉
  - page: 260
    col: 10
    role: z
    text: 眸音牟瞭音了眊音耄○良善也眸
  - page: 260
    col: 11
    role: z
    text: 子目瞳子也瞭明也眊者蒙蒙目不
  - page: 260
    col: 12
    role: z
    text: 明之貌蓋人與物接時其神在目
  - page: 260
    col: 13
    role: z
    text: 故胷中正則神精而明不正則神散
  - page: 260
    col: 14
    role: z
    text: 而昏
  - page: 260
    col: 15
    role: j
    text: 聽其言也觀其眸子人焉廋哉
  - page: 260
    col: 16
    role: z
    text: 焉於䖍反廋音搜○廋匿也言亦心
  - page: 261
    col: 1
    role: z
    text: 之所發故并此以觀則人之邪正不
  - page: 261
    col: 2
    role: z
    text: 可匿矣然言猶可以僞爲眸子則有
  - page: 261
    col: 3
    role: z
    text: 不容僞者
  - page: 261
    col: 4
    role: j
    text: 孟子曰恭者不侮人儉者不奪人侮奪
  - page: 261
    col: 5
    role: j
    text: 人之君惟恐不順焉惡得爲恭儉恭儉
  - page: 261
    col: 6
    role: j
    text: 豈可以聲音笑貌爲哉
  - page: 261
    col: 7
    role: z
    text: 惡平聲○惟恐不順言恐人之不順
  - page: 261
    col: 8
    role: z
    text: 已聲音笑貌僞爲於外也
  - page: 261
    col: 9
    role: j
    text: 淳于髠曰男女授受不親禮與孟子曰
  - page: 261
    col: 10
    role: j
    text: 禮也曰嫂溺則援之以手乎曰嫂溺不
  - page: 261
    col: 11
    role: j
    text: 援是豺狼也男女授受不親禮也嫂溺
  - page: 261
    col: 12
    role: j
    text: 援之以手者權也
  - page: 261
    col: 13
    role: z
    text: 與平聲援音爰○淳于姓髠名齊之
  - page: 261
    col: 14
    role: z
    text: 辯士授與也受取也古禮男女不親
  - page: 261
    col: 15
    role: z
    text: 授受以遠别也援救之也權稱錘也
  - page: 261
    col: 16
    role: z
    text: 稱物輕重而往來以取中者也權而
  - page: 262
    col: 1
    role: z
    text: 得中是乃禮也
  - page: 262
    col: 2
    role: j
    text: 曰今天下溺矣夫子之不援何也
  - page: 262
    col: 3
    role: z
    text: 言今天下大亂民遭陷溺亦當從權
  - page: 262
    col: 4
    role: z
    text: 以援之不可守先王之正道也
  - page: 262
    col: 5
    role: j
    text: 曰天下溺援之以道嫂溺援之以手子
  - page: 262
    col: 6
    role: j
    text: 欲手援天下乎
  - page: 262
    col: 7
    role: z
    text: 言天下溺惟道可以捄之非若嫂溺
  - page: 262
    col: 8
    role: j
    text: 可手援也今子欲援天下乃欲使我
  - page: 262
    col: 9
    role: j
    text: 枉道求合則先失其所以援之之具
  - page: 262
    col: 10
    role: j
    text: 矣是欲使我以手援天下乎○此章
  - page: 262
    col: 11
    role: j
    text: 言直己守道所以濟時枉道徇人徒
  - page: 262
    col: 12
    role: z
    text: 爲失己
  - page: 262
    col: 13
    role: j
    text: 公孫丑曰君子之不教子何也
  - page: 262
    col: 14
    role: z
    text: 不親教也
  - page: 262
    col: 15
    role: j
    text: 孟子曰勢不行也教者必以正以正不
  - page: 262
    col: 16
    role: j
    text: 行繼之以怒繼之以怒則反夷矣夫子
  - page: 263
    col: 1
    role: j
    text: 教我以正夫子未出於正也則是父子
  - page: 263
    col: 2
    role: j
    text: 相夷也父子相夷則惡矣
  - page: 263
    col: 3
    role: z
    text: 夷傷也教子者本爲愛其子也繼之
  - page: 263
    col: 4
    role: z
    text: 以怒則反傷其子矣父旣傷其子子
  - page: 263
    col: 5
    role: z
    text: 之心又責其父曰夫子教我以正道
  - page: 263
    col: 6
    role: z
    text: 而夫子之身未必自行正道則是子
  - page: 263
    col: 7
    role: z
    text: 又傷其父也
  - page: 263
    col: 8
    role: j
    text: 古者易子而教之
  - page: 263
    col: 9
    role: z
    text: 易子而教所以全父子之恩而亦不
  - page: 263
    col: 10
    role: z
    text: 失其爲教
  - page: 263
    col: 11
    role: j
    text: 父子之間不責善責善則離離則不祥
  - page: 263
    col: 12
    role: j
    text: 莫大焉
  - page: 263
    col: 13
    role: z
    text: 責善朋友之道也○王氏曰父有爭
  - page: 263
    col: 14
    role: z
    text: 子何也所謂爭者非責善也當不義
  - page: 263
    col: 15
    role: z
    text: 則爭之而已矣父之於子也如何曰
  - page: 263
    col: 16
    role: z
    text: 當不義則亦戒之而已矣
  - page: 264
    col: 1
    role: j
    text: 孟子曰事孰爲大事親爲大守孰爲大
  - page: 264
    col: 2
    role: j
    text: 守身爲大不失其身而能事其親者吾
  - page: 264
    col: 3
    role: j
    text: 聞之矣失其身而能事其親者吾未聞
  - page: 264
    col: 4
    role: j
    text: 之也
  - page: 264
    col: 5
    role: j
    text: 守身持守其身使不䧟於不義也一
  - page: 264
    col: 6
    role: z
    text: 失其身則虧體辱親雖日用三牲之
  - page: 264
    col: 7
    role: z
    text: 養亦不足以爲孝矣
  - page: 264
    col: 8
    role: j
    text: 孰不爲事事親事之本也孰不爲守守
  - page: 264
    col: 9
    role: j
    text: 身守之本也
  - page: 264
    col: 10
    role: z
    text: 事親孝則忠可移於君順可移於長
  - page: 264
    col: 11
    role: z
    text: 身正則家齊國治而天下平
  - page: 264
    col: 12
    role: j
    text: 曾子養曾晳必有酒肉將徹必請所與
  - page: 264
    col: 13
    role: j
    text: 問有餘必曰有曾晳死曾元養曾子必
  - page: 264
    col: 14
    role: j
    text: 有酒肉將徹不請所與問有餘曰亡
  - page: 264
    col: 15
    role: j
    text: 將以復進也此所謂養口體者也若曾
  - page: 264
    col: 16
    role: j
    text: 子則可謂養志也
  - page: 265
    col: 1
    role: z
    text: 養去聲復扶又反○此承上文事親
  - page: 265
    col: 2
    role: z
    text: 言之曾晳名點曾子父也曾元曾子
  - page: 265
    col: 3
    role: z
    text: 子也曾子養其父每食必有酒肉食
  - page: 265
    col: 4
    role: z
    text: 畢將徹去必請於父曰此餘者與誰
  - page: 265
    col: 5
    role: z
    text: 或父問此物尚有餘否必曰有恐親
  - page: 265
    col: 6
    role: z
    text: 意更欲與人也曾元不請所與雖有
  - page: 265
    col: 7
    role: z
    text: 言無其意將以復進於親不欲其與
  - page: 265
    col: 8
    role: z
    text: 人也此但能養父母之口體而已曾
  - page: 265
    col: 9
    role: z
    text: 子則能承順父母之志而不忍傷之
  - page: 265
    col: 10
    role: z
    text: 也
  - page: 265
    col: 11
    role: j
    text: 事親若曾子者可也
  - page: 265
    col: 12
    role: z
    text: 言當如曾子之養志不可如曾元但
  - page: 265
    col: 13
    role: z
    text: 養口體○程子曰子之身所能為者
  - page: 265
    col: 14
    role: z
    text: 皆所當為無過分之事也故事親若
  - page: 265
    col: 15
    role: z
    text: 曾子可謂至矣而孟子止曰可也豈
  - page: 265
    col: 16
    role: z
    text: 以曾子之孝為有餘哉
  - page: 266
    col: 1
    role: j
    text: 孟子曰人不足與適也政不足間也惟
  - page: 266
    col: 2
    role: j
    text: 大人爲能格君心之非君仁莫不仁君
  - page: 266
    col: 3
    role: j
    text: 義莫不義君正莫不正一正君而國定
  - page: 266
    col: 4
    role: j
    text: 矣
  - page: 266
    col: 5
    role: z
    text: 適音謫間去聲○趙氏曰適過也間
  - page: 266
    col: 6
    role: z
    text: 非也格正也○徐氏曰格者物之所
  - page: 266
    col: 7
    role: z
    text: 取正也書曰格其非心愚謂間字上
  - page: 266
    col: 8
    role: z
    text: 亦當有與字言人君用人之非不足
  - page: 266
    col: 9
    role: z
    text: 過謫行政之失不足非間惟有大人
  - page: 266
    col: 10
    role: z
    text: 之德則能格其君心之不正以歸於
  - page: 266
    col: 11
    role: z
    text: 正而國無不治矣大人者大德之人
  - page: 266
    col: 12
    role: z
    text: 正己而物正者也○程子曰天下之
  - page: 266
    col: 13
    role: z
    text: 治亂繫乎人君之仁與不仁耳心之
  - page: 266
    col: 14
    role: z
    text: 非即害於政不待乎發之於外也昔
  - page: 266
    col: 15
    role: z
    text: 者孟子三見齊王而不言事門人疑
  - page: 266
    col: 16
    role: z
    text: 之○孟子曰我先攻其邪心心旣正
  - page: 267
    col: 1
    role: z
    text: 而後天下之事可從而理也夫政事
  - page: 267
    col: 2
    role: z
    text: 之失用人之非知者能更之直者能
  - page: 267
    col: 3
    role: z
    text: 諫之然非心存焉則事事而更之後
  - page: 267
    col: 4
    role: z
    text: 復有其事將不勝其更矣人人而去
  - page: 267
    col: 5
    role: z
    text: 之後復用其人將不勝其去矣是以
  - page: 267
    col: 6
    role: z
    text: 輔相之職必在乎格君心之非然後
  - page: 267
    col: 7
    role: z
    text: 無所不正而欲格君心之非者非有
  - page: 267
    col: 8
    role: z
    text: 大人之德則亦莫之能也
  - page: 267
    col: 9
    role: j
    text: 孟子曰有不虞之譽有求全之毀
  - page: 267
    col: 10
    role: z
    text: 虞度也○吕氏曰行不足以致譽而
  - page: 267
    col: 11
    role: z
    text: 偶得譽是謂不虞之譽求免於毀而
  - page: 267
    col: 12
    role: z
    text: 反致毀是謂求全之毀言毀譽之言
  - page: 267
    col: 13
    role: z
    text: 未必皆實脩己者不可以是遽爲憂
  - page: 267
    col: 14
    role: z
    text: 喜觀人者不可以是輕爲進退
  - page: 267
    col: 15
    role: j
    text: 孟子曰人之易其言也無責耳矣
  - page: 267
    col: 16
    role: z
    text: 易去聲○人之所以輕易其言者以
  - page: 268
    col: 1
    role: z
    text: 其未遭失言之責故耳蓋常人之情
  - page: 268
    col: 2
    role: z
    text: 無所懲於前則無所警於後非以爲
  - page: 268
    col: 3
    role: z
    text: 君子之學必俟有責而後不敢易其
  - page: 268
    col: 4
    role: z
    text: 言也然此豈亦有爲而言之與
  - page: 268
    col: 5
    role: j
    text: 孟子曰人之患在好爲人師
  - page: 268
    col: 6
    role: z
    text: 好去聲○王勉曰學問有餘人資於
  - page: 268
    col: 7
    role: z
    text: 已不得已而應之可也若好爲人師
  - page: 268
    col: 8
    role: z
    text: 則自足而不復有進矣此人之大患
  - page: 268
    col: 9
    role: z
    text: 也
  - page: 268
    col: 10
    role: j
    text: 樂正子從於子敖之齊
  - page: 268
    col: 11
    role: z
    text: 子敖王驩字
  - page: 268
    col: 12
    role: j
    text: 樂正子見孟子孟子曰子亦來見我乎
  - page: 268
    col: 13
    role: j
    text: 曰先生何爲出此言也曰子來幾日矣
  - page: 268
    col: 14
    role: j
    text: 曰昔者曰昔者則我出此言也不亦宜
  - page: 268
    col: 15
    role: j
    text: 乎曰舍館未定曰子聞之也舍館定然
  - page: 268
    col: 16
    role: j
    text: 後求見長者乎
  - page: 269
    col: 1
    role: z
    text: 長上聲○昔者前日也館客舎也王
  - page: 269
    col: 2
    role: z
    text: 驩孟子所不與言者則其人可知矣
  - page: 269
    col: 3
    role: z
    text: 樂正子乃從之行其失身之罪大矣
  - page: 269
    col: 4
    role: z
    text: 又不早見長者則其罪又有甚者焉
  - page: 269
    col: 5
    role: z
    text: 故孟子姑以此責之
  - page: 269
    col: 6
    role: j
    text: 曰克有罪
  - page: 269
    col: 7
    role: z
    text: 陳氏曰樂正子固不能無罪矣然其
  - page: 269
    col: 8
    role: z
    text: 勇於受責如此非好善而篤信之其
  - page: 269
    col: 9
    role: z
    text: 能若是乎世有強辯飾非聞諫愈甚
  - page: 269
    col: 10
    role: z
    text: 者又樂正子之罪人也
  - page: 269
    col: 11
    role: j
    text: 孟子謂樂正子曰子之從於子敖來徒
  - page: 269
    col: 12
    role: j
    text: 餔啜也我不意子學古之道而以餔啜
  - page: 269
    col: 13
    role: j
    text: 也
  - page: 269
    col: 14
    role: z
    text: 餔博孤反啜昌恱反○徒但也餔食
  - page: 269
    col: 15
    role: z
    text: 也啜飲也言其不擇所從但求食耳
  - page: 269
    col: 16
    role: z
    text: 此乃正其罪而切責之
  - page: 270
    col: 1
    role: j
    text: 孟子曰不孝有三無後為大
  - page: 270
    col: 2
    role: j
    text: 趙氏曰於禮有不孝者三事謂阿意
  - page: 270
    col: 3
    role: j
    text: 曲從陷親不義一也家貧親老不為
  - page: 270
    col: 4
    role: j
    text: 祿仕二也不娶無子絕先祖祀三也
  - page: 270
    col: 5
    role: z
    text: 三者之中無後為大
  - page: 270
    col: 6
    role: j
    text: 舜不告而娶為無後也君子以為猶告
  - page: 270
    col: 7
    role: j
    text: 也
  - page: 270
    col: 8
    role: z
    text: 為無之為去聲○舜告焉則不得娶
  - page: 270
    col: 9
    role: j
    text: 而終於無後矣告者禮也不告者權
  - page: 270
    col: 10
    role: j
    text: 也猶告言與告同也蓋權而得中則
  - page: 270
    col: 11
    role: j
    text: 不離於正矣○范氏曰天下之道有
  - page: 270
    col: 12
    role: j
    text: 正有權正者萬世之常權者一時之
  - page: 270
    col: 13
    role: j
    text: 用常道人皆可守權非體道者不能
  - page: 270
    col: 14
    role: j
    text: 用也蓋權出於不得已者也若父非
  - page: 270
    col: 15
    role: j
    text: 瞽瞍子非大舜而欲不告而娶則天
  - page: 270
    col: 16
    role: j
    text: 下之罪人也
  - page: 271
    col: 1
    role: j
    text: 孟子曰仁之實事親是也義之實從兄
  - page: 271
    col: 2
    role: j
    text: 是也
  - page: 271
    col: 3
    role: z
    text: 仁主於愛而愛莫切於事親義主於
  - page: 271
    col: 4
    role: z
    text: 敬而敬莫先於從兄故仁義之道其
  - page: 271
    col: 5
    role: z
    text: 用至廣而其實不越於事親從兄之
  - page: 271
    col: 6
    role: z
    text: 間蓋良心之發最爲切近而精實者
  - page: 271
    col: 7
    role: z
    text: 有子以孝弟爲爲仁之本其意亦猶
  - page: 271
    col: 8
    role: z
    text: 此也
  - page: 271
    col: 9
    role: j
    text: 智之實知斯二者弗去是也禮之實節
  - page: 271
    col: 10
    role: j
    text: 文斯二者是也樂之實樂斯二者樂則
  - page: 271
    col: 11
    role: j
    text: 生矣生則惡可已也惡可已則不知足
  - page: 271
    col: 12
    role: j
    text: 之蹈之手之舞之
  - page: 271
    col: 13
    role: z
    text: 樂斯樂則之樂音洛惡平聲○斯二
  - page: 271
    col: 14
    role: z
    text: 者指事親從兄而言知而弗去則見
  - page: 271
    col: 15
    role: z
    text: 之明而守之固矣節文謂品節文章
  - page: 271
    col: 16
    role: z
    text: 樂則生矣謂和順從容無所勉強事
  - page: 272
    col: 1
    role: z
    text: 親從兄之意油然自生如草木之有
  - page: 272
    col: 2
    role: z
    text: 生意也旣有生意則其暢茂條達自
  - page: 272
    col: 3
    role: z
    text: 有不可遏者所謂惡可已也其又盛
  - page: 272
    col: 4
    role: z
    text: 則至於手舞足蹈而不自知矣○此
  - page: 272
    col: 5
    role: z
    text: 章言事親從兄良心眞切天下之道
  - page: 272
    col: 6
    role: z
    text: 皆原於此然必知之明而守之固然
  - page: 272
    col: 7
    role: z
    text: 後節之密而樂之深也
  - page: 272
    col: 8
    role: j
    text: 孟子曰天下大悅而將歸己視天下悅
  - page: 272
    col: 9
    role: j
    text: 而歸己猶草芥也惟舜爲然不得乎親
  - page: 272
    col: 10
    role: j
    text: 不可以爲人不順乎親不可以爲子
  - page: 272
    col: 11
    role: z
    text: 言舜視天下之歸己如草芥而惟欲
  - page: 272
    col: 12
    role: z
    text: 得其親而順之也得者曲爲承順以
  - page: 272
    col: 13
    role: z
    text: 得其心之悅而已順則有以諭之於
  - page: 272
    col: 14
    role: z
    text: 道心與之一而未始有違尤人所難
  - page: 272
    col: 15
    role: z
    text: 也爲人蓋泛言之爲子則愈密矣
  - page: 272
    col: 16
    role: j
    text: 舜盡事親之道而瞽瞍底豫瞽瞍底豫
  - page: 273
    col: 1
    role: j
    text: 而天下化瞽瞍底豫而天下之爲父子
  - page: 273
    col: 2
    role: j
    text: 者定此之謂大孝
  - page: 273
    col: 3
    role: z
    text: 底之爾反○瞽瞍舜父名底致也豫
  - page: 273
    col: 4
    role: z
    text: 悅樂也瞽瞍至頑嘗欲殺舜至是而
  - page: 273
    col: 5
    role: z
    text: 底豫焉書所謂不格姦亦允若是也
  - page: 273
    col: 6
    role: z
    text: 蓋舜至此而有以順乎親矣是以天
  - page: 273
    col: 7
    role: z
    text: 下之爲子者知天下無不可事之親
  - page: 273
    col: 8
    role: z
    text: 顧吾所以事之者未若舜耳於是莫
  - page: 273
    col: 9
    role: z
    text: 不勉而爲孝至於其親亦底豫焉則
  - page: 273
    col: 10
    role: z
    text: 天下之爲父者亦莫不慈所謂化也
  - page: 273
    col: 11
    role: z
    text: 子孝父慈各止其所而無不安其位
  - page: 273
    col: 12
    role: z
    text: 之意所謂定也爲法於天下可傳於
  - page: 273
    col: 13
    role: z
    text: 後世非止一身一家之孝而已此所
  - page: 273
    col: 14
    role: z
    text: 以爲大孝也○李氏曰舜之所以能
  - page: 273
    col: 15
    role: z
    text: 使瞽瞍底豫者盡事親之道共爲子
  - page: 273
    col: 16
    role: z
    text: 職不見父母之非而已昔羅仲素語
  - page: 274
    col: 1
    role: z
    text: 此云只爲天下無不是底父母了翁
  - page: 274
    col: 2
    role: z
    text: 聞而善之曰唯如此而後天下之爲
  - page: 274
    col: 3
    role: z
    text: 父子者定彼臣弑其君子弑其父者
  - page: 274
    col: 4
    role: z
    text: 常始於見其有一不是處耳
  - page: 274
    col: 7
    role: j
    text: 孟子卷第七
