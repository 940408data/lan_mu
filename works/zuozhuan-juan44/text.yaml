# 春秋左傳正義卷44（孔穎達疏）：j 為經文＋杜預注，z 為疏文。
sections:
  - id: juan44
    name: 正文
    blocks:
      - { type: j, text: "【經】七年，春，王正月，暨齊平。（暨，與也。燕與齊平。前年冬，齊伐燕，間無異事，故不重言燕，從可知。○暨，其器反，傳同。重，直用反。）" }
      - { type: z, text: "“暨與”至“可知”。○正義曰：“暨，與”，《釋詁》文也。此直言“暨齊平”，不知誰與齊平。《穀梁傳》雲：“以外及內曰暨。”謂此為魯與齊平。賈逵、何休亦以為魯與齊平。許惠卿以為燕與齊平。服虔雲：襄二十四年‘仲孫羯侵齊’，二十五年‘崔杼伐我’。自爾以來，齊、魯不相侵伐。且齊是大國，無為求與魯平。此六年冬，‘齊侯伐北燕，將納簡公’。齊侯貪賄，而與之平，故傳言‘齊求之也’，‘齊次於虢，燕人行成’。其文相比，許君近之。”案經例，即燕與齊平，當書“燕”；魯與諸侯平，皆言“暨”。下“三月公如楚，叔孫婼如齊蒞盟”，公不在國，故齊無來者。據經言之，賈君為得。杜則從許說也，故兩載其說，意從賈解。其所疑雲：“前年冬，齊伐燕”，文接此春，“間無異事，故不雲燕”，省文也。又此年稱齊暨燕平之月，傳所舉經文，知此是燕與齊平也。《釋例》曰：“昭六年冬‘齊侯伐北燕’，七年春而‘平’。冬春相接，間無異事，省文，故不重言燕。猶桓五年冬‘州公如曹’，六年春因書‘寔來’也。傳以其不分明，故起見齊燕平之月以正之也。”" }
      - { type: j, text: "三月，公如楚。" }
      - { type: j, text: "叔孫婼如齊蒞盟。無傳。公將遠適楚，故叔孫如齊尋舊好。○婼，敕略反，徐又音釋。好，呼報反。" }
      - { type: z, text: "注“公將”至“舊好”。○正義曰：魯與齊鄰，公遠適楚，慮其或來侵伐，遣使與之盟，尋舊好也。案經，婼之如齊，在“公如楚”下，杜言“將適楚”者，叔孫婼非公命則不得書經，明是公未發時命之，公發後始去，杜言“將”，見此意。" }
      - { type: j, text: "夏，四月，甲辰，朔，日有食之。" }
      - { type: j, text: "秋，八月，戊辰，衛侯惡卒。元年，大夫盟於虢。" }
      - { type: z, text: "“衛侯惡卒”。○正義曰：《穀梁傳》曰：“鄉曰衛齊惡，今曰衛侯惡，此何為君臣同名也？君子不奪人名，不奪親之所名，重其所以來也，王父名子也。”注云：“不奪人名，明臣雖欲改，君不當聽也。君不聽臣易名者，欲使人重父命也。父受名於王父，王父卒，則稱王父之命名之。”《曲禮》雲：“卒哭乃諱。”鄭玄雲：“敬鬼神之名也。生者不相闢名，衛侯名惡，大夫有石惡，君臣同名，《春秋》不非。”謂此事也。然則此君卒哭之後，臣當闢其諱。《曲禮》雲：“君子已孤不更名”，當舍名而稱字。○注“元年大夫盟於虢”。○正義曰：虢會不盟，而言盟者，令尹圍請讀舊書加於牲上，雖不為戰書，亦以名告神，與盟同也。" }
      - { type: j, text: "九月，公至自楚。" }
      - { type: j, text: "冬，十有一月，癸未，季孫宿卒。" }
      - { type: j, text: "十有二月，癸亥，葬衛襄公。" }
      - { type: j, text: "【傳】七年，春，王正月，暨齊平，齊求之也。（齊伐燕，燕人賂之，反從求平，如晏子言。）" }
      - { type: z, text: "“齊求之也”。○正義曰：傳雲：“齊求之”，自言其平之意。下雲“盟於濡上”，是其平之事也。下言“齊侯次於虢，燕人行成”，則是燕先發意。而言“齊求之”者，齊若志在伐燕，不當在竟久次，久次而不行，即是求之之狀也。燕必知其音意，乃成耳。" }
      - { type: j, text: "癸巳，齊侯次於虢。虢，燕竟。○虢，瓜百反。竟音境。燕人行成，曰：“敝邑知罪，敢不聽命？先君之敝器，請以謝罪。”敝器，瑤甕、玉櫝之屬。○瑤音遙。甕，烏送反，徐於容反。櫝，徒木反。公孫晳曰：“受服而退，俟釁而動，可也。”晳，齊大夫。○晳，星曆反，徐思益反。釁，許覲反。二月，戊午，盟於濡上。濡水出高陽縣東北，至河間鄚縣入易水。○濡，徐音須；《說文》女於反，一音而又反，又而於反。鄚音莫，本又作莫。" }
      - { type: z, text: "注“濡水”至“易水”。○正義曰：今案高陽無此水也。水源皆出於山，其出平地，皆是山中平地。燕趙之界無泉出者，未知杜言何所案據。" }
      - { type: j, text: "燕人歸燕姬，嫁女與齊侯。賂以瑤甕、玉櫝、斝耳，不克而還。瑤，玉也。櫝，匱也。斝耳，玉爵。○斝，古雅反，一音嫁。《禮記》：夏曰盞，殷曰斝，周曰爵。《說文》斝從鬥。匱，其位反。" }
      - { type: z, text: "注“瑤玉”至“玉爵”。○正義曰：孔安國《尚書傳》雲：“瑤，美石。”此雲瑤甕、玉櫝，與玉別文，亦似非玉。杜以瑤為玉者，《詩毛傳》雲：“瓊瑤，美玉。”則瑤之為物，在玉石之間，與玉小別，故或以為石，或以為玉。瓊是玉之美名。《詩》以瓊瑤為玉，故毛言“美玉”耳。《周禮·醢人》：“王舉則共醢六十甕，以齊醢菹臡實之。”則甕是小器，當以瓦為之。以瑤為甕，故為寶也。《論語》雲：“龜玉毀於櫝中”，是櫝為盛物之匱也。《明堂位》雲：“爵，夏后氏以盞，殷以斝，周以爵。”鄭玄雲：“斝，畫禾稼也。”斝是爵名，文承玉櫝之下，明亦以玉為之。言耳者，蓋此器旁有耳，若今之杯，故名耳。" }
      - { type: j, text: "楚子之為令尹也，為王旌以田。析羽為旌，王旌游至於軫。○旌音旌。析，星曆反。游音留。軫，之忍反。" }
      - { type: z, text: "注“析羽”至“於軫”。○正義曰：“析羽為旌”，《周禮·司常》文也。鄭玄雲：“析羽皆五采，系之於旞旌之上，所謂注旌於幹首也。凡九旗之帛皆用絳。”然則幹首有羽，羽為旌名，遂以旌為旗。稱其垂至軫者，謂游至軫，非羽至軫也。《禮緯·稽命徵》雲：“禮，天子旗九刃，曳地；諸侯七刃，齊軫；大夫五刃，齊較；士三刃，齊首。”《周禮·節服氏》：“袞冕六人，維王之大常。”鄭玄雲：“王旌十二旒，兩兩以縷綴連旁，三人持之。禮，天子旌曳地。”杜以楚雖僣號稱王，未必即如天子，不應建大常旌曳地，故以諸侯解之。言“王旌游至於軫”，謂楚王旌也，蓋建交龍之旗而游至軫耳。然諸侯之旌，短於王旌二刃。大夫之旌，亦短於諸侯之旌二刃。案《周禮》軫去地四尺，較去軫並五尺五寸，而《禮緯》雲諸侯齊軫，大夫齊較，於事為疑，不可知也。" }
      - { type: j, text: "芋尹無宇斷之曰：“一國兩君，其誰堪之？”及即位，為章華之宮，納亡人以實之。章華，南郡華容縣。○芋，於付反。斷音短。" }
      - { type: z, text: "“芋尹”。○正義曰：芋是草名。哀十七年陳有芋尹。蓋皆以草名官，不知其故。" }
      - { type: j, text: "無宇之閽入焉。有罪，亡入章華宮。無宇執之，有司弗與，王有司也。曰：“執人於王宮，其罪大矣。”執而謁諸王。執無宇也。王將飲酒，遇其歡也。無宇辭曰：“天子經略，經營天下，略有四海，故曰經略。諸侯正封，封疆有定分。○疆，居良反，下同。分，扶問反。" }
      - { type: z, text: "“天子”至“正封”。○正義曰：莊二十一年注云：“略，界也。”則此“略”亦為“界”也。經營天下，以四海為界，界內皆為已有，故言“略有四海”，謂有四海之內也。天子界內，天子自經營之，故言“經略”也。諸侯封內，受之天子，非已自營，故言“正封”，謂不侵人，不與人，正之使有定分。" }
      - { type: j, text: "古之制也。封略之內，何非君土？食土之毛，誰非君臣？毛，草也。故《詩》曰：‘普天之下，莫非王土。率土之濱，莫非王臣。’《詩·小雅》。濱，涯也。○普，本或作溥，音同；《毛傳》雲：“大也。”濱音賓。涯，五隹反。" }
      - { type: z, text: "“詩曰”至“王臣”。○正義曰：“《北山》，大夫剌幽王也，役使不均”。雲：“溥天之下”云云，鄭《箋》雲：“此言王之土地廣矣，王之臣又眾矣，何求而不得，何使而不行。”率土之濱者，地之形勢，水多於土，民居水畔，故云循土之涯也。" }
      - { type: j, text: "天有十日，甲至癸。人有十等，王至臺。下所以事上，上所以共神也。故王臣公，公臣大夫，大夫臣士，士臣皂，皂臣輿，輿臣隸，隸臣僚，僚臣僕，僕臣臺。馬有圉，牛有牧，養馬曰圉，養牛曰牧。○共音恭。圉，魚呂反。" }
      - { type: z, text: "“王臣”至“臣臺”。○正義曰：文十八年傳雲“舜臣堯”者，謂舜為臣以事堯也。此雲“王臣公”者，謂上以下為臣。文同而意異也。公者，五等諸侯之總名。《環齊要略》雲：“自營為厶，八厶為公，言正無私也。大夫者，夫之言扶也，大能扶成人也。士者事也，言能理庶事也。”服虔雲：“皂，造也，造成事也。輿，眾也，佐皂舉眾事也。隸，隸屬於吏也。僚，勞也，共勞事也。僕，僕豎，主藏者也。臺，給臺下，微名也。”此皆以意言之，循名求義，不必得本，故杜皆略而不說。" }
      - { type: j, text: "以待百事。今有司曰，女胡執人於王宮？將焉執之？周文王之法曰，有亡荒閱，荒，大也。閱，蒐也。有亡人當大蒐其眾。○女音汝。焉，於虔反。閱音悅。蒐，所由反。所以得天下也。吾先君文王，楚文王。作《僕區》之法，《僕區》，刑書名。○僕區，烏侯反，徐如字。服雲：僕，隱也；區，匿也。為隱匿亡人之法也。" }
      - { type: z, text: "注“僕區，刑書名”。○正義曰：引其言戒刑法，知是刑書名也。名曰“僕區”，未知其義。服虔雲：“僕，隱也；區，匿也。為隱亡人之法也。”" }
      - { type: j, text: "曰，‘盜所隱器，隱盜所得器。與盜同罪’，所以封汝也。行善法，故能啟疆北至汝水。" }
      - { type: z, text: "注“行善”至“汝水”。○正義曰：文王之法，所以得天下，言行善法，所以得為天子也。僕區之法，所以封汝，言去盜賊，所以大啟封疆也。哀十七年傳曰：“彭仲爽，申俘也，文王以為令尹，實縣申息，朝陳蔡，封畛於汝。”是文王啟疆至汝水。" }
      - { type: j, text: "若從有司，是無所執逃臣也。逃而舍之，是無陪臺也。言皆將逃。王事無乃闕乎？昔武王數紂之罪，以告諸侯曰：‘紂為天下逋逃主，萃淵藪。’萃，集也。天下通逃，悉以紂為淵藪澤而歸之。○數，色具反，又色主反。逋，布吳反。萃，在醉反。藪，素口反。" }
      - { type: z, text: "“昔武”至“淵藪”。○正義曰：此在《尚書·武成》篇也。武王既克殷，歸至於豐，乃陳伐紂之事，告於諸侯。言將伐之時，以商之罪，告於皇天后土，所過名山大川曰：“今商王受無道，暴殄天物，害虐烝民，為天下逋逃主，萃淵藪。”是言天下罪人逋逃者，以紂為主，集而歸之，如魚入深淵，獸奔藪澤也。" }
      - { type: j, text: "故夫致死焉。人欲致死討紂。○夫音扶，又方於反。君王始求諸侯而則紂，無乃不可乎？若以二文之法取之，盜有所在矣。”言王亦為盜。王曰：“取而臣以往，往，去之。盜有寵，未可得也。”盜有寵，王自謂，為葬靈王張本。遂赦之。赦無宇。" }
      - { type: j, text: "楚子成章華之臺，原以諸侯落之。宮室始成，祭之為落。臺今在華容城內。" }
      - { type: z, text: "注“宮室”至“城內”。○正義曰：《雜記》雲：成廟則釁之，“路寢成則考之而不釁。釁屋者，交神明之道也。”鄭玄雲：“言露寢，生人所居，不釁者，不神之也。考之者，設盛食以落之爾。《檀弓》曰：‘晉獻文子成室，諸大夫發焉’，是也。”然則不釁，似無祭，而杜言“宮室始成，祭之為落”者，以其言落，必是以酒澆落之，雖不如廟以血塗其上，當祭中霤之神以安之。" }
      - { type: j, text: "大宰薳啟彊曰：“臣能得魯侯。”薳啟彊來召公，辭曰：“昔先君成公，命我先大夫嬰齊曰：‘吾不忘先君之好，將使衡父照臨楚國，鎮撫其社稷，以輯寧爾民。’嬰齊受命於蜀，蜀盟在成二年。衡父，公衡。○好，呼報反。輯音集，又七入反。奉承以來，弗敢失隕，而致諸宗祧，言奉成公此語以告宗廟。○隕，于敏反。祧，他彫反。日我先君共王，引領北望，日月以。魯朝。○共音恭。" }
      - { type: z, text: "“日我”至“北望”。○正義曰：日謂往日也。嬰齊與魯盟於蜀，事在成二年。共王之初，共王即望魯朝，故言往耳我先君共王引領北望也。董遇注無日字。諡法“既過能改日共”。" }
      - { type: j, text: "傳序相授，於今四王矣。四王，共、康、郟、敖及靈王。○傳，直專反。郟，古洽反。嘉惠未至，唯襄公之辱臨我喪。襄公二十八年，如楚臨康王喪。孤與其二三臣，悼心失圖，在哀喪故。社稷之不皇，況能懷思君德！皇，暇也。言有大喪，多不暇。今君若步玉趾，辱見寡君，趾，足也。寵靈楚國，以信蜀之役，致君之嘉惠，是寡君既受貺矣，何蜀之敢望！言但欲使君來，不敢望如蜀復有質子。○復，扶又反。質音致，又如字。" }
      - { type: z, text: "“寵靈”至“貺矣”。○正義曰：言開其恩寵，賜以威靈，以及楚國，以明受命於蜀之事，不虛致令君之嘉惠於楚，即是寡君受貺矣。" }
      - { type: j, text: "其先君鬼神，實嘉賴之，豈唯寡君？君若不來，使臣請問行期，問魯見伐之期。○使，所吏反。寡君將承質幣而見於蜀，以請先君之貺。”請，問也。○質音致，徐之二反，又如字。見，賢遍反。公將往，夢襄公祖。祖，祭道神。" }
      - { type: z, text: "注“祖祭道神”。○正義曰：《詩》雲：“韓侯出祖”，“仲山甫出祖”，是出行必為祖也。《曾子問》曰：“諸侯適天子”與“諸侯相見”，皆雲“道而出”，是祖與道為一，知祖是祭道神也。《周禮·大馭》：“掌馭玉路以祀，及犯軷。王自左馭，馭下祝。登受轡，犯軷，遂驅之。”鄭玄雲：“行山曰軷。犯之者，封土為山象，以菩芻棘柏為神主。既祭，以車轢之而去，喻無險難也。”又《聘禮》記雲：“出祖，釋軷祭酒脯，乃飲酒於其側。”鄭玄雲：“祖，始也。”“行出國門，止陳車騎，釋酒脯之奠於軷，為行始也。《詩傳》曰：‘軷，道祭也。’謂祭道路之神。《春秋傳》曰：‘軷涉山川。’然則軷，山行之名也。道路以險阻為難，是以委土為山，或伏牲其上，使者為軷祭酒脯祈告也。卿大夫處者於是餞之，飲酒於其側，禮畢，乘車轢之而遂行。”是說祖軷之事也。《詩》雲：“取羝以軷”，謂諸侯也。天子則以犬，故《犬人》雲“伏瘞亦如之”。鄭司農雲：“伏謂伏犬，以王車轢之”，是也。大夫同酒脯。" }
      - { type: j, text: "梓慎曰：“君不果行。襄公之適楚也，夢周公祖而行。今襄公實祖，君其不行。”子服惠伯曰：“行。先君未嘗適楚，故周公祖以道之。襄公適楚矣，而祖以道，君不行，何之？”三月，公如楚，鄭伯勞於師之梁。鄭城門。○道之音導，下同。勞，力報反，下同。孟僖子為介，不能相儀。僖子，仲孫玃。○介音界。相，息亮反。玃，俱縛反，又俱碧反。及楚，不能答郊勞。為下僖子病不能相禮張本。" }
      - { type: j, text: "夏，四月，甲辰，朔，日有食之。晉侯問於士文伯曰：“誰將當日食？”對曰：“魯、衛惡之，受其兇惡。○惡之，如字；或烏路反，非也。衛大魯小。”公曰：“何故？”對曰：“去衛地，如魯地。衛地，豕韋也。魯地，降婁也。日食於豕韋之末，及降婁之始乃息，故禍在衛大，在魯小也。週四月，今二月，故日在降婁。○降，戶江反，下同。" }
      - { type: z, text: "注“衛地”至“降婁”。○正義曰：《周禮·保章氏》：“以星土辨九州之地所封，封域皆有分星。”是在地封域，必當天星之分，但古書亡失。鄭注《保章氏》引《堪輿》雲：寅，析木，燕也。卯，大火，宋也。辰，壽星，鄭也。巳，鶉尾，楚也。午，鶉火，周也。未，鶉首，秦也。申，實沈，晉也。酉，大梁，趙也。戌，降婁，魯也。亥，娵訾，衛也。子，玄枵，齊也。醜，星紀，吳越也。秦漢以來，地分天次。娵訾，衛也；降婁，魯也，娵訾之次，一名豕韋，故云“衛地，豕韋也”。《三統曆》：娵訾初日在危十六度，立春節在營室十四度，雨水中終於奎四度也。降婁初日在奎五度，驚蟄節在婁四度，春分中終於胃六度也。此時週四月，今二月，故日在降婁，但閏有前卻，不知日在何度而食也。言“去衛地，如魯地”，蓋始入降婁之初耳。" }
      - { type: j, text: "於是有災，魯實受之。災發於衛，而魯受其餘禍。其大咎，其衛君乎，魯將上卿。”八月衛侯卒，十一月季孫宿卒。○咎，其九反。公曰：“《詩》所謂‘彼日而食，於何不臧’者，何也？”感日食而問《詩》。" }
      - { type: z, text: "“詩所”至“不臧”。○正義曰：“《十月之交》，大夫刺幽王也。”“十月之交，朔月辛卯。日有食之，亦孔之醜。”注云：“日為君，辰為臣。辛，金也。卯，木也。又以卯侵辛，故甚惡也。”又云：“彼月而食，則為其常。此日而食，於何不臧。”《詩》作“此”，此雲“彼”者，師讀不同也。" }
      - { type: j, text: "對曰：“不善政之謂也。國無政，不用善，則自取謫於日月之災。謫，譴也。○謫，直革反。譴，遣戰反。" }
      - { type: z, text: "“對曰”至“之災”。○正義曰：士文伯緣公之問，設勸戒之辭，言人君為政不善，可以感動上天，則自取譴責於日月之災。以日食之災，由君行之所致也。《昏義》雲：“天子聽男教，後聽女順。天子治陽道，後治陰德。”是故男教不修，陽事不得，適見於天，日為之食。婦順不脩，陰教不得，適見於天，月為之食。”此傳彼記皆是勸戒辭耳。日月之會，自有常數。每於一百七十三日有餘，則日月之道一交，交則日月必食。雖千歲之日食，豫筭而盡知，寧復由教不脩而政不善也？此時周室微弱，王政不行，非復能動天也。設有天變，當與天下為災，何獨衛君、魯卿當其名也？若日食在其分次，其國即當有咎，則每於日食必有君死，豈日食之歲，常有一君死乎？足明士文伯言衛君、魯卿之死，不由日食而知矣。人君者，位貴居尊，志移心溢，或淫恣情欲，壞亂天下。聖人假之神靈，作為鑑戒。夫以昭昭大明，照臨下土，忽爾殲亡，俾晝作夜，其為怪異，莫斯之甚。故鳴之以鼓柝射之以弓矢。庶人奔走以相從，嗇夫馳騁以告眾。降物闢寢以哀之，祝幣史辭以禮之。立貶食去樂之數，制入門廢朝之典。示之以罪已之宜，教之脩德之法。所以重天變，警人君也。天道深遠，有時而驗，或亦人之禍釁，偶相逢，故聖人得因其變常，假為勸戒。知達之士，識先聖之幽情；中下之主，信妖祥以自懼。但神道可以助教，不可專以為教。神之則惑眾，去之則害宜。故其言若有若無，其事若信若不信，期於大通而已。世之學者，宜知其趣焉。" }
      - { type: j, text: "故政不可不慎也。務三而已，一曰擇人，擇賢人。二曰因民，因民所利而利之。三曰從時。”順四時之所務。" }
      - { type: j, text: "晉人來治杞田，前汝叔侯不盡歸，今公適楚，晉人恨，故復來治杞田。○復，扶又反；下復伐同。" }
      - { type: z, text: "注“前汝”至“杞田”。○正義曰：下雲“君之在楚，於晉罪也”，知晉人以此故，復來治杞田也。宋之盟雲，晉楚之從交相見，今復恨者，於時不免楚意為此盟耳，私心不欲諸侯向楚，又無辭可以禁之，故內懷恨而治其田。" }
      - { type: j, text: "季孫將以成與之。成，孟氏邑，本杞田。謝息為孟孫守，不可。謝息，僖子家臣。○為，於偽反，注及下為杞同。守，手又反，下守臣同。曰：“人有言曰，雖有挈瓶之知，守不假器，禮也。挈瓶，汲者，喻小知。為人守器，猶知不以借人。○挈，若結反。瓶，蒲丁反。之知音智，注小知同。汲音急。借，子夜反。夫子從君，而守臣喪邑，夫子，謂孟僖子，從公如楚。○喪，息浪反。雖吾子亦有猜焉。”言季孫亦將疑我不忠。○猜，七才反。季孫曰：“君之在楚，於晉罪也。言晉罪君之至楚。又不聽晉，魯罪重矣。晉師必至，吾無以待之，不如與之，間晉而取諸杞。侯晉間隙，可復伐杞取之。○間如字，注同。吾與子桃，魯國卞縣東南有桃虛。○虛，起居反。成反，誰敢有之，是得二成也。魯無憂，而孟孫益邑，子何病焉？”辭以無山，與之萊、柞，萊、柞，二山。○萊音來。柞，子洛反，又音昨。乃遷於桃。謝息遷也。晉人為杞取成。不書，非公命。" }
      - { type: j, text: "楚子享公於新臺，章華臺也。使長鬛者相，鬛，須也，欲光誇魯侯。○鬛，力輒反。相，息亮反。須音須。誇，苦華反。" }
      - { type: z, text: "“使長鬛者相”。○正義曰：吳楚之人少須，故選長鬛者相禮也。" }
      - { type: j, text: "好以大屈。宴好之賜。大屈，弓名。○好，呼報反，注同。屈，居勿反。大屈，弓名。服同，又云大麴也。賈雲寶金，可以為劍，出大屈也。" }
      - { type: z, text: "注“大屈，弓名”。○正義曰：賈逵雲：大屈，寶金，可以為劍。大屈，金所生地名。服虔雲：一曰大屈，弓名。《魯連書》曰：楚子享魯侯於章華之臺，與大麴之弓，既而悔之。蒍啟彊見魯侯，魯侯歸之大屈。即大麴也。" }
      - { type: j, text: "既而悔之。薳啟彊聞之，見公。公語之，拜賀。公曰：“何賀？”對曰：“齊與晉、越欲此久矣。寡君無適與也，而傳諸君，君其備禦三鄰。言齊、晉、越將伐魯而取之。○見，賢遍反。語，魚據反。適，丁歷反。傳，直專反。慎守寶矣，敢不賀乎？”公懼，乃反之。傳言楚靈不信，所以不終。" }
      - { type: j, text: "鄭子產聘於晉。晉侯疾，韓宣子逆客，私焉。私語。曰：“寡君寢疾，於今三月矣，並走群望，晉所望祀山川，皆走往祈禱。○禱，丁老反，又於報反。有加而無瘳。今夢黃熊入於寢門，其何厲鬼也？對曰：“以君之明，子為大政，其何厲之有？昔堯殛鯀於羽山，羽山在東海祝其縣西南。○瘳，救留反。黃熊音雄，獸名，亦作能，如字，一音奴來反，三足鱉也。解者雲，獸非入水之物，故是鱉也。一曰既為神，何妨是獸。案《說文》及《字林》皆雲，能，熊屬，足似鹿。然則能既熊屬，入為鱉類。今本作能者，勝也。東海人祭禹廟，不用熊白及鱉為膳，斯豈鯀化為二物乎？殛，紀力反，誅也；本又作極，音義同。鯀，古本反，下注同。" }
      - { type: z, text: "“今夢”至“寢門”。○正義曰：諸本皆作熊字。賈逵雲：“熊，獸也。”《說文》雲：“熊，獸，似豕，山居，冬蟄。”《釋獸》雲：“羆如熊，黃白文。”孫炎引《書》雲：“如熊如羆”，則熊似羆似豕之獸，即今之所謂熊是也。《釋獸》又云：“熊虎醜，其子狗。”李巡曰：“熊虎之類，其子名狗。”則熊獸似虎，非熊也。又《釋魚》雲：“鱉，三足能。”樊光曰：“鱉皆四足，今三足，故記之。”彼是鱉之異狀。張衡《東京賦》雲：“能鱉三趾。”梁王雲：“鯀之所化，是能鱉也。若是熊獸，何以能入羽淵？但以神之所化，不可以常而言之。若是能鱉，何以得入寢門？先儒既以為獸，今亦以為熊獸。”是也。汲冢書《瑣語》雲：晉平公夢見赤熊闚屏，惡之，而有疾，使問子產。言闚屏牆，必是獸也。張叔《皮論》雲：“賓爵下革，田鼠上騰。牛哀虎變，鯀化為熊。久血為磷，積灰生蠅。”傅玄《潛通賦》雲：“聲伯忌瓊瑰而弗佔兮，晝言諸而暮終。嬴正沈璧以祈福兮，鬼告兇而命窮。黃母化而黿兮，鯀變而成熊。”二者所韻不同。或疑張叔為“能”。著作郎王劭雲：“古人讀雄與熊者，皆於陵反，張叔用舊音，傅玄用新音。張叔亦作‘熊’也。”案《詩·無羊》與《正月》及襄十年衛卜禦寇之繇，皆以“雄”韻“陵”，劭言是也。" }
      - { type: j, text: "其神化為黃熊，以入於羽淵。實為夏郊，三代祀之。鯀，禹父，夏家郊祭之，歷殷、週二代，又通在群神之數，並見祀。○夏，戶雅反，注夏下同。" }
      - { type: z, text: "注“鯀禹”至“見祀”。○正義曰：《祭法》雲：“夏后氏禘黃帝而郊鯀。”言郊祭天，而以鯀配。是“夏家郊祭之”也。殷、週二代，自以其祖配天。雖復不以鯀配郊，鯀有治水之功，又通在群神之數，並亦見祀。通夏世為“三代祀之”也。《祭法》又曰：“夫聖王之制祀也”。“能御大菑則祀之，能捍大患則祀之”，“鯀鄣鴻水而殛死，禹能脩鯀之功”，“非此族也，不在祀典”。是言鯀有大功，而歷代祀之也。《祭法》又云：“有虞氏禘黃帝而郊嚳，祖顓頊而宗堯。夏后氏亦禘黃帝而郊鯀，祖顓頊而宗禹。殷人禘嚳而郊冥，祖契而宗湯。周人禘嚳而郊稷，祖文王而宗武王。”《家語》：子羔問曰：“周人祖文王而宗武王”，虞夏祖宗異代者，孔子曰：“殷周祖宗，其廟可以不毀，則其他所祖宗者，功德不殊，雖在異代，亦可以無疑矣。”周人愛召公，猶敬其樹，“況祖宗其功德，而可以不尊奉其廟哉！”" }
      - { type: j, text: "晉為盟主，其或者未之祀也乎？”言周衰，晉為盟主，得佐天子祀群神。" }
      - { type: z, text: "注“言周”至“群神”。○正義曰：《祭法》曰：“有天下者祭百神，諸侯在其地則祭之，亡其地則不祭。”然則鯀非晉地之神，晉人不合祭之也。但周室既衰，晉為盟主，得佐助天子祭祀群神，故不祀鯀而鯀為宗也。《晉語》說此事雲：“昔者鯀違帝命，殛之於羽山，化為黃熊，以入於羽淵，實為夏郊，三代舉之。夫鬼神之所及，非其族類，則紹其同位”，“今周室少卑，晉實繼之，其或者未舉夏郊邪？宣子以告，祀夏郊，董伯為屍，五日，晉侯疾間”。是言晉當繼周，得佐天子祀群神也。僖三十一年傳雲：“相之不享於此久矣，非衛之罪也。”“杞、鄫何事？”然則杞是夏後，自當祀相。衛不祀相，而晉祀鯀者，相無功，唯子孫當祀。鯀則列在祀典，天子祀之，故晉繼周祀鯀也。" }
      - { type: j, text: "韓子祀夏郊。祀鯀。" }
      - { type: z, text: "“祀夏郊”。○正義曰：言祀夏家所郊者，故注云“祀鯀”。" }
      - { type: j, text: "晉侯有間，間，差也。○差，初賣反。賜子產莒之二方鼎。方鼎，莒所貢。" }
      - { type: z, text: "“方鼎”。○正義曰：服虔雲：“鼎三足則圓，四足則方。”" }
      - { type: j, text: "子產為豐施歸州田於韓宣子，豐施，鄭公孫段之子。三年，晉以州田賜段。○為，於偽反，下為初言同。曰：“日君以夫公孫段為能任其事，而賜之州田。今無祿早世，不獲久享君德。其子弗敢有，不敢以聞於君，私致諸子。”此年正月，公孫段卒。○夫音扶。任音壬，下同。宣子辭。子產曰：“古人有言曰：‘其父析薪，其子弗克負荷。’荷，擔也。以微薄喻貴重。○析，星曆反。荷，本亦作何，河可反，又音荷。擔，丁甘反。施將懼不能任其先人之祿，其況能任大國之賜？縱吾子為政而可，後之人若屬有疆埸之言，敝邑獲戾，恐後代宣子者，將以鄭取晉邑罪鄭。○若屬音燭。疆，居良反。埸音亦。而豐氏受其大討。吾子取州，是免敝邑於戾，而建置豐氏也。敢以為請。”傳言子產貞而不諒。" }
      - { type: z, text: "注“傳言”至“不諒”。○正義曰：“貞而不諒”，《論語》文也。貞，正也。諒，信也。段受晉邑，卒而歸之，正也。知宣子欲之，而言畏懼後禍，是不信也。" }
      - { type: j, text: "宣子受之，以告晉侯。晉侯以與宣子。宣子為初言，病有之，初言，謂與趙文子爭州田。以易原縣於樂大心。樂大心，宋大夫。原，晉邑，以賜樂大心也。" }
      - { type: j, text: "鄭人相驚以伯有，曰“伯有至矣”，則皆走，不知所往。襄三十年，鄭人殺伯有。言其鬼至。鑄刑書之歲二月，在前年。或夢伯有介而行，介，甲也。介音界。曰：“壬子，餘將殺帶也。駟帶助子晳殺伯有。壬子，六年三月三日。明年壬寅，餘又將殺段也。”公孫段，豐氏黨。壬寅，此年正月二十八日。" }
      - { type: z, text: "注“公孫段，豐氏黨”。正義曰：劉炫雲：“段即豐氏，當言駟氏黨，字之誤。”以規杜氏。今知非者，段為豐氏，傳有明文。杜既注傳，無容不委。蓋後人轉寫之誤。劉君雖規，未必是杜之失。" }
      - { type: j, text: "及壬子，駟帶卒。國人益懼。齊、燕平之月，此年正月。壬寅，公孫段卒，國人愈懼。其明月，子產立公孫洩及良止以撫之，乃止。公孫洩，子孔之子也。襄十九年，鄭殺子孔。良止，伯有子也，立以為大夫，使有宗廟。○洩，息列反。子大叔問其故。子產曰：“鬼有所歸，乃不為厲，吾為之歸也。”大叔曰：“公孫洩何為？”子孔不為厲，問何為復立洩。○復，扶又反。子產曰：“說也，為身無義而圖說。伯有無義，以妖鬼故立之。恐惑民，並立洩，使若自以大義存誅絕之後者，以解說民心。○說如字，下及注同，徐始銳反。" }
      - { type: z, text: "“子產”至“圖說”。○正義曰：言立公孫洩者，所以解說民心也。伯有作亂而死，不應立其後祀。今立良止，民必怪之，為伯有之身無義立後，而圖謀自解說於民也。解說者，以子孔、良霄俱被誅殺，今並立二人，言若國家自以大義存誅絕之後，不為妖鬼立良止也，以此解說民心。" }
      - { type: j, text: "從政有所反之，以取媚也。民不可使知之，故治政或當反道以求媚於民。○治，直吏反。" }
      - { type: z, text: "“從政”至“媚也”。○正義曰：反之，謂反正道也。媚，愛也。從其政事治國家者，有所反於正道，以取民愛也。反正道者，子孔誅絕，於道理不合立公孫洩。今既立良止，恐民以鬼神為惑，故反違正道，兼立公孫洩，以取媚於民，令民不惑也。段與帶之卒，自當命盡而終耳，未必良霄所能殺也。但良霄為厲，因此恐民，民心不安，義須止遏，故立祀止厲，所以安下民也。何休《膏肓》難此，言孔子不語怪力亂神，以鬼神為政，必惑眾，故不言也。今左氏以此令後世信其然，廢仁義而祈福於鬼神，此大亂之道也。子產雖立良止，以託繼絕，此以鬼賞罰，要不免於惑眾，豈當述之以示季末。鄭玄答之曰：伯有，惡人也，其死為厲鬼。厲者，陰陽之氣相乘不和之名。《尚書·五行傳》六厲是也。人死體魄則降，知氣在上，有尚德者，附和氣而興利。孟夏之月，令雩祀百辟卿士有益於民者，由此也。為厲者，因害氣而施災，故謂之厲鬼。《月令》“民多厲疾”，《五行傳》有御六厲之禮。禮，天子立七祀，有大厲，諸侯立五祀，有國厲，欲以安鬼神，弭其害也。子產立良止，使祀伯有以弭害，乃禮與洪範之事也。子所不語，怪力亂神，謂虛陳靈象，於今無驗也。伯有為厲鬼，著明若此，而何不語乎？子產固為眾愚將惑，故並立公孫洩，雲“從政有所反之，以取媚也。”孔子曰：“民可使由之，不可使知之。”子產達於此也。" }
      - { type: j, text: "不媚不信，說而後信之。○說音悅。不信，民不從也。”及子產適晉，趙景子問焉，景子，晉中軍佐趙成。曰：“伯有猶能為鬼乎？”子產曰：“能。人生始化曰：“魄，魄，形也。○魄，普白反。既生魄，陽曰魂。陽，神氣也。" }
      - { type: z, text: "“人生”至“曰魂”。○正義曰：人稟五常以生，感陰陽以靈。有身體之質，名之曰形。有噓吸之動，謂之為氣。形氣合而為用，知力以此而彊，故得成為人也。此將說淫厲，故遠本其初。人之生也，始變化為形，形之靈者名之曰魄也。既生魄矣，魄內自有陽氣。氣之神者，名之曰魂也。魂魄神靈之名，本從形氣而有。形氣既殊，魂魄亦異。附形之靈為魄，附氣之神為魂也。附形之靈者，謂初生之時，耳目心識，手足運動，啼呼為聲，此則魄之靈也。附氣之神者，謂精神性識，漸有所知，此則附氣之神也。是魄在於前，而魂在於後，故云“既生魄，陽曰魂”。魂魄雖俱是性靈，但魄識少而魂識多。《孝經說》曰：魄，白也。魂，芸也。白，明白也。芸，芸動也。形有體質，取明白為名。氣唯噓吸，取芸動為義。鄭玄《祭義》注云：“氣謂噓吸出入者也。耳目之丘明為魄。”是言魄附形而魂附氣也。人之生也，魄盛魂強。及其死也，形消氣滅。《郊特牲》曰：“魂氣歸於天，形魄歸於地。”以魂本附氣，氣必上浮，故言“魂氣歸於天”；魄本歸形，形既入土，故言“形魄歸於地”。聖王緣生事死，制其祭祀；存亡既異，別為作名。改生之魂曰神，改生之魄曰鬼。《祭義》曰：“氣也者，神之盛也。魄也者，鬼之盛也。合鬼與神，教之至也。”“死必歸土，此之謂鬼。”“其氣發揚於上”，“神之著也”。是故魂魄之名為鬼神也。《檀弓》記延陵季子之哭其子云：“骨肉歸復於土，命也。若魂氣則無不之也。”《爾雅·釋訓》雲：“鬼之為言歸也。”《易·系辭》曰：“陰陽不測之謂神。”以骨肉必歸於土，故以“歸”言之。魂氣無所不通，故以“不測”名之。其實鬼神之本，則魂魄是也。劉炫雲：“人之受生，形必有氣，氣形相合，義無先後。而此雲‘始化曰魄’，‘陽曰魂’，是則先形而後氣，先魄而後魂。”魂魄之生，有先後者，以形有質而氣無質。尋形以知氣，故先魄而後魂。其實並生，無先後也。○注“陽，神氣也”。○正義曰：以形有質，故為陰；魂無形，故為陽。既以“化”表形，故以“陽”見氣。氣為陽，知形為陰，互相見也。" }
      - { type: j, text: "用物精多，則魂魄強。物，權勢。" }
      - { type: z, text: "“用物”至“魄強”。○正義曰：魂既附氣，氣又附形。形彊則氣彊，形弱則氣弱。魂以氣彊，魄以形強。若其居高官而任權勢，奉養厚，則魂氣強，故用物精而多，則魂魄強也。○注“物，權勢”。○正義曰：物非權勢之名，而以物為權勢者，言有權勢則物備。物謂奉養之物，衣食所資之總名也。" }
      - { type: j, text: "是以有精爽，至於神明。爽，明也。" }
      - { type: z, text: "“是以”至“神明”。○正義曰：此言從微而至著耳。精亦神也，爽亦明也。精是神之未著，爽是明之未昭。言權勢重，用物多，養此精爽，至於神明也。" }
      - { type: j, text: "匹夫匹婦強死，其魂魄猶能馮依於人，以為淫厲。強死，不病也。人謂匹夫匹婦賤身。○強，其丈反。況良霄，我先君穆公之胄，子良之孫，子耳之子，敝邑之卿，從政三世矣。鄭雖無腆，腆，厚也。○胄，直又反。從政三世矣，子良公子去疾生子耳公孫輒，輒生伯有良霄，三世為鄭卿。腆，他典反。" }
      - { type: z, text: "“從政三世”。○正義曰：子良、子耳、良霄，三世皆為卿。" }
      - { type: j, text: "抑諺曰，蕞爾國。蕞，小貌。○蕞，在最反。而三世執其政柄，其用物也弘矣，其取精也多矣。其族又大，所馮厚矣。良霄魂魄所馮者貴重。○柄，彼命反。而強死，能為鬼，不亦宜乎？”傳言子產之博敏。" }
      - { type: j, text: "子皮之族飲酒無度，相尚以奢，相困以酒。" }
      - { type: z, text: "注“相尚”至“以酒”。○正義曰：相尚以奢，食無度也。相困以酒，飲無度也。" }
      - { type: j, text: "故馬師氏與子皮氏有惡。馬師氏，公孫鉏之子罕朔也。襄三十年，馬師頡出奔，公孫鉏代之為馬師，與子皮俱同一族。○鉏，仕居反。頡，咖結反。齊師還自燕之月，在此年二月。罕朔殺罕魋。魋，子皮弟。○魋，徒回反。" }
      - { type: z, text: "“罕朔殺罕魋”。○正義曰：公孫鉏，子展之弟。展生子皮，鉏生罕朔。朔是子罕之孫，禮謂之從父昆弟。" }
      - { type: j, text: "罕朔奔晉。韓宣子問其位於子產。問朔可使在何位。子產曰：“君之羈臣，苟得容以逃死，何位之敢擇？卿違，從大夫之位，謂以禮去者，降位一等。罪人以其罪，罪重則多。古之制也。朔於敝邑，亞大夫也，其官，馬師也。大夫位，馬師職。獲戾而逃，唯執政所寘之。得免其死，為惠大矣。又敢求位？”宣子為子產之敏也，使從嬖大夫。為子產故，使降等，不以罪降。○為子，於偽反，注同。嬖，必計反。" }
      - { type: z, text: "“使從嬖大夫”。○正義曰：子產數游楚雲：“子晳，上大夫，女，嬖大夫，不尊貴也。”則晉之嬖大夫，亦是下大夫。子產雲：朔，亞大夫也。今晉侯使朔為下大夫，故杜雲：“為子產故，使降一等，不以罪降。”" }
      - { type: j, text: "秋，八月，衛襄公卒。晉大夫言於範獻子曰：“衛事晉為睦，睦，和也。晉不禮焉，庇其賊人，而取其地，賊人，孫林父。其地，戚也。○庇，必利反，又音珌。故諸侯貳。《詩》曰：‘<即鳥>鴒在原，兄弟急難。’《詩·小雅》。<即鳥>鴒，<邕鳥>渠也。飛則嗚，行則搖，喻兄弟相救於急難，不可自舍。○<即鳥>，本又作即，精亦反。鴒，本又作令，力丁反。難，如字，又乃旦反，注同。搖音遙，又以照反。" }
      - { type: z, text: "“詩曰”至“急難”。○正義曰：《小雅·棠棣》之篇也。以<即鳥>鴒之在原，喻兄弟之急難也。<即鳥>鴒，水鳥也，今而在原，失其常處。飛則鳴，行則搖，不能自舍也。喻人當居平安之世，今有兄弟在急難，相救之情，亦不能自舍也。但鳥有飛行可言，人之不能自舍，無狀可言耳。○注“<即鳥>鴒，<邕鳥>渠”。○正義曰：《釋鳥》文。郭璞曰：“雀屬。”" }
      - { type: j, text: "又曰：‘死喪之威，兄弟孔懷。’威，畏也。言有死喪，則兄弟宜相懷思。兄弟之不睦，於是乎不吊，不相吊恤。況遠人，誰敢歸之？今又不禮於衛之嗣，嗣，新君也。衛必叛我，是絕諸侯也。”獻子以告韓宣子。宣子說，使獻子如衛吊，且反戚田。傳言戚田所由還衛。○說音悅。還音環。衛齊惡告喪於周，且請命。王使臣簡公如衛吊。簡公，王卿士也。且追命襄公曰：“叔父陟恪，在我先王之左右，以佐事上帝。陟，登也。恪，敬也。帝，天也。叔父謂襄公。命如今之哀策。○恪，苦各反。" }
      - { type: z, text: "注“陟登”至“哀策”。○正義曰：“陟，登”，“恪，敬”，《釋詁》文也。《周禮》所云，上帝皆是天也。“如今之哀策”者，漢魏以來，賢臣既卒，或贈以本官印綬。近世或更贈以高官，褒德敘哀，載之於策，將葬，賜其家以告柩，“如今之哀策”謂此也。" }
      - { type: j, text: "餘敢忘高圉、亞圉？”二圉，周之先也。為殷諸侯，亦受殷王追命者。○圉，魚呂反。" }
      - { type: z, text: "注“二圉”至“命者”。正義曰：案《周本紀》，高圉是公劉玄孫之孫。高圉生亞圉。亞圉，大王亶父之祖也。併為殷之諸侯。今王追命襄公，而云不忘二圉，知其亦是受殷王追命。此杜以意言耳，二圉之受追命無文也。" }
      - { type: j, text: "九月，公至自楚。孟僖子病不能相禮，不能相儀答郊勞，以此為己病。○“病不能相禮”，本或作“病不能禮”。相，息亮反，注相儀同。勞，力報反。乃講學之，講習也。苟能禮者從之。及其將死也，二十四年孟僖子卒，傳終言之。召其大夫，僖子屬大夫。曰：“禮，人之幹也。無禮，無以立。吾聞將有達者，曰孔丘，僖子卒時，孔丘年三十五。" }
      - { type: z, text: "注“孔丘年三十五”。○正義曰：當言三十四，而云“五”，蓋相傳誤耳。" }
      - { type: j, text: "聖人之後也。聖人，殷湯。而滅於宋。孔子六代祖孔父嘉，為宋督所殺，其子奔魯。" }
      - { type: z, text: "注“孔子六代祖”。○正義曰：《家語·本姓篇》雲：宋泯公熙生弗父何，何生宋父周，周生世子勝，勝生正考父，考父生孔父嘉，其後以孔為氏也。孔父生木金父，金父生皋夷父，夷父生防叔，防叔闢華氏之逼而奔魯，生伯夏，伯夏即生梁紇，梁紇即生孔子。" }
      - { type: j, text: "其祖弗父何，以有宋而授厲公。弗父何，孔父嘉之高祖，宋閔公之子，厲公之兄。何適嗣當立，以讓厲公。○適，丁歷反。及正考父弗父何之曾孫。佐戴、武、宣，三人皆宋君。三命茲益共。三命，上卿也。言位高益共。故其鼎銘雲：考父廟之鼎。‘一命而僂，再命而亻區，三命而俯。俯共於亻區，亻區共於僂。○僂，力主反。亻區，紆甫反。循牆而走，言不敢安行。亦莫餘敢侮。其共如是，亦不敢侮慢之。○侮，亡甫反。饘於是，鬻於是，以餬餘口。’於是鼎中為饘鬻。饘鬻，餬屬，言至儉。○饘，之然反。《爾雅》：“餬，饘也”。鬻，之六反，孫炎雲，淖麋也。" }
      - { type: z, text: "“饘於”至“餘口”。○正義曰：《釋言》雲：“餬，饘也。”郭璞雲：“糜也”。又云：“鬻，糜也。”孫炎曰：“淖糜也。”然則餬、饘、鬻、糜，相類之物。稠者曰糜，淖者曰鬻。餬、饘是其別名。將糜向口，故曰“以餬餘口”，猶今人以粥向帛粘，使相著，謂之餬帛。" }
      - { type: j, text: "其共也如是。臧孫紇有言紇，武仲也。曰：‘聖人有明德者，若不當世，其後必有達人。’聖人之後，有明德而不當大位，謂正考父。" }
      - { type: z, text: "注“聖人”至“考父”。○正義曰：聖人，謂殷湯也。不當世，謂不得在位為國君也。上文具言考父之德，知此聖人之後有明德而不得在世當大位者，止謂正考父也。既是聖人之後，而又有明德，身無貴位，必慶隆子孫，故言其後必有達人，謂知能通達之人。於夫子身為大夫，乃稱夫子，此時仲尼未仕，不得稱為夫子。以未仕之時為仕後之語，是丘明竟尊之，而失事實。陳恆未死言諡，亦此類也。" }
      - { type: j, text: "今其將在孔丘乎？我若獲沒，得以壽終。必屬說與何忌於夫子，使事之說，南宮敬叔。何忌，孟懿子。皆僖子之子。○屬音燭。說音悅。而學禮焉，以定其位。”知禮則位安。" }
      - { type: z, text: "注“南宮”至“敬叔”。○正義曰：說南宮氏也。敬，諡也。叔，字也，又字容也，字括也，名說，一名縚。" }
      - { type: j, text: "故孟懿子與南宮敬叔師事仲尼。仲尼曰：“能補過者，君子也。《詩》曰：‘君子是則是效。’《詩·小雅》。孟僖子可則效巳矣。”" }
      - { type: j, text: "單獻公棄親用羈。獻公，周卿士，單靖公之子，頃公之孫。羈，寄客也。○單音善。" }
      - { type: j, text: "冬，十月，辛酉，襄、頃之族殺獻公而立成公。襄公，頃公之父。成公，獻公弟。○頃音傾。十一月，季武子卒。晉侯謂伯瑕伯瑕，士文伯。曰：“吾所問日食，從矣，可常乎？”衛侯、武子皆卒故。對曰：“不可。六物不同，各異時。民心不壹，政教殊。事序不類，有變易。官職不則，治官居職非一法。同始異終，胡可常也？《詩》曰：‘或燕燕居息，或憔悴事國。’《詩·小雅》。言不同。○憔，在遙反。《詩》作“盡”。瘁，在醉反。" }
      - { type: z, text: "“詩曰”至“事國”。○正義曰：《小雅·北山》，“大夫刺幽王也，役使不均，已勞於從事，而不得養其父母焉”。“或燕燕居息”，燕燕，安息貌。“或盡瘁事國”，盡力勞病以從國事。此作“憔悴”，蓋師讀不同。" }
      - { type: j, text: "其異終也如是。”公曰：“何謂六物？”對曰：“歲、時、日、月、星、辰是謂也”。公曰：“多語寡人辰，而莫同。何謂辰？”對曰：“日月之會是謂辰，一歲日月十二會，所會謂之辰。○語，魚據反。" }
      - { type: z, text: "“歲時日月星辰”。○正義曰：《釋天》雲：“載，歲也。夏曰歲”，“周曰年”。李巡曰：“載，一歲莫不覆載也。”孫炎曰：“四時一終曰歲，取歲星行一次也。年取年穀一熟。”是言歲即年也。時謂四時，春夏秋冬也。日謂十日，從甲至癸也。月從正月至十二月也。星，二十八宿也。辰謂日月所會，一歲十二會，從子至亥也。《周禮·馮相氏》：“掌十有二歲，十有二月，十有二辰。十日，二十有八星之位。”謂此六物也。大歲所在，十二年始匝，故為十二歲。○辰，而莫同。○正義曰：東南隅有辰也，大火謂之辰也，又有日月之會辰也，又北方有辰星也。日月會謂之辰者，辰時也，言日月聚會有時也。" }
      - { type: j, text: "故以配日。”謂以子醜配甲乙。" }
      - { type: z, text: "“故以配日”。○正義曰：言辰無常所，分在十二以十幹配之，明非一所也。" }
      - { type: j, text: "衛襄公夫人姜氏無子，姜氏，宣姜。嬖人婤姶生孟縶。孔成子夢康叔謂已：“立元，成子，衛卿，孔達之孫烝鉏也。元，孟縶弟，夢時元未生。○婤音周，又直周反，徐敕周反。姶，烏答反。縶，張立反。烝，之承反。" }
      - { type: z, text: "注“夢時元未生”。○正義曰：知者，傳曰“婤姶生孟縶”，即雲“成子夢”。若已生訖，當雲“婤姶生孟縶及元”，然雲“孔成子夢”，且說夢巳下，乃雲晉韓宣子聘歲生元。明未生也。" }
      - { type: j, text: "餘使羈之孫圉與史苟相之。”羈，烝鉏子。苟，史朝子。○羈，居宜反。相，息亮反，下同。朝如字。史朝亦夢康叔謂己：“餘將命而子苟，與孔烝鉏之曾孫圉，相元。”史朝見成子，告之夢，夢協。協，合也。晉韓宣子為政，聘於諸侯之歲，在二年。婤姶生子，名之曰元。孟縶之足不良，能行。跛也。○跛，波我反。" }
      - { type: z, text: "“之足不良”。正義曰：當斷不良為句。“能行”向下讀之。知者，案二十年杜注云：“縶足不良，故以官邑還豹”，是也。" }
      - { type: j, text: "孔成子以《周易》筮之曰：“元尚享衛國，主其社稷。”令蓍辭。遇《屯》。《震》下《坎》上，《屯》。○屯，張倫反。又曰：“餘尚立縶，尚克嘉之。”嘉，善也。遇《屯》之《比》。《坤》下《坎》上，《比》。《屯》初九爻變。○比，毗志反，注同。" }
      - { type: z, text: "“之比”。○正義曰：所以上《屯》無變者，皆遇少爻故也。" }
      - { type: j, text: "以示史朝。史朝曰：“元亨，又何疑焉。”《周易》曰：“《屯》，元亨。”○亨，許庚反，注元亨皆同。成子曰：“非長之謂乎？言《屯》之元亨，謂年長，非謂名元。○長，丁丈反，注同。對曰：“康叔名之，可謂長矣。善之長也。○名，如字，徐武政反。孟非人也。將不列於宗，不可謂長。足跛非全人，不可列為宗主。且其繇曰‘利建侯’。繇，卦辭。○繇，直又反。嗣吉何建？建非嗣也。嗣子有常位，故無所卜，又無所建。今以位不定，卜嗣得吉，則當從吉而建之也。○言何建，本或作可建。二卦皆雲，謂再得《屯》卦，皆有建侯之文。" }
      - { type: z, text: "“二卦皆雲”。○正義曰：謂前卜元之二卦，非謂後卜縶之卦也。" }
      - { type: j, text: "子其建之。康叔命之，二卦告之。筮襲於夢，武王所用也。弗從何為？《外傳》雲：“《大誓》曰：‘朕夢協朕卜，襲於休祥，戎商必克。’”此武王辭。" }
      - { type: z, text: "注“外傳雲”。○正義曰：《外傳》雲者，《國語》引《大誓》也。《古文尚書·大誓》具有此文。此傳之意，取《大誓》也。杜不見古文，故引《外傳》解之。" }
      - { type: j, text: "弱足者居。跛則偏弱，居其家，不能行。侯主社稷，臨祭祀，奉民人，事鬼神，從會朝，又焉得居？各以所利，不亦可乎？”孟跛利居，元吉利建。○焉，於虔反。故孔成子立靈公。十二月，癸亥，葬衛襄公。靈公，元也。" }
      - { type: j, text: "【經】八年，春，陳侯之弟招殺陳世子偃師。（以首惡從殺例，故稱弟，又稱世子。○招，常遙反。）" }
      - { type: z, text: "注“以首”至“世子”。○正義曰：招與公子過共殺偃師，而立公子留。及楚殺徵師，留出奔鄭，招乃歸罪於過，而使陳人殺之。及楚師來討，又推過為首，得免重責，不死，而放之於越，是以招為從罪也。若其從招之詐，如楚之意，則宜書過殺偃師。由是仲尼知其實狀，以招為首。傳言：“書曰‘陳侯之弟招，殺陳世子偃師’，罪在招也。”是仲尼新意，以招為首惡也。從殺例者，從兩下相殺之例也。《釋例》曰：“大臣相殺，死者無罪，則兩稱名氏，以示殺者之罪，王札子殺召伯、毛伯，是也。若死者有罪，則不稱殺者名氏，晉殺其大夫陽處父，是也。”然則世子雖是副主，猶是人臣，從此人臣相殺之例，故稱“弟”，以見殺者之罪也。又稱“世子”，以見世子亦人臣也。鄭段去“弟”陳招不去“弟”者，《釋例》雲：“陳招殺兄之子”，“然不推刃於其兄，故以首惡稱弟稱名，從兩下相殺也”。是言招罪輕於害兄，故存弟也。" }
      - { type: j, text: "夏，四月，辛丑，陳侯溺卒。襄二十七年“大夫盟於宋”。○溺，乃歷反。" }
      - { type: z, text: "注“襄二”至“於宋”。○正義曰：溺以襄五年即位，爾來陳常從楚，唯有襄二十七年大夫與魯同盟於宋。劉炫雲：“往年衛侯惡卒，杜雲‘元年大夫盟於虢’。此不數虢。”以杜為上下自相反。今知不然者，以盟於宋，經有明文，故指之。虢盟文不見經，故不數也。其衛侯惡更無盟處，唯有虢盟，故數之。劉不尋杜意，而規其過，非也。" }
      - { type: j, text: "叔弓如晉。" }
      - { type: j, text: "楚人執陳行人幹徵師，殺之。稱行人，明非行人罪。○幹，古丹反。陳公子留出奔鄭。留為招所立，未成君而出奔。" }
      - { type: j, text: "秋，蒐於紅。革車千乘，不言大者，經文闕也。紅，魯地。沛國蕭縣西有紅亭。遠疑。○蒐，所求反。紅，戶東反。乘，繩證反。沛音貝。" }
      - { type: z, text: "注“革車”至“闕也”。○正義曰：傳稱“革車千乘”，是大蒐也。十二年“大蒐於比蒲”，三十二年“大蒐於昌間”，定十三年、十四年“大蒐於比蒲”，皆雲“大蒐”。此不雲“大”，知經闕文也。《釋例》雲：“紅之蒐，傳言‘革車千乘’，所以示大蒐也。而經不書‘大’，諸事同而文異。傳不曲言經義者，直是時史之闕略，仲尼略而從之。《春秋》不可錯綜經文，此之類也。劉、賈、穎雲：‘蒐於紅’不言‘大’者，言公大失權在三家也。十一年‘蒐於比蒲’，經書‘大蒐’，復雲書大者，言大眾盡在三家。隨文造意，以非例為例，不復知其自違也。”" }
      - { type: j, text: "陳人殺其大夫公子過。與招共殺偃師，書名，罪之。○過，古禾反。" }
      - { type: j, text: "大雩。無傳。不旱而秋雩，過也。" }
      - { type: j, text: "冬，十月，壬午，楚師滅陳。不稱將帥，不以告。壬午，月十八日。○將，子匠反。執陳公子招，放之於越。無傳。複稱公子，兄已卒。○復，扶又反。殺陳孔奐。無傳。招之黨，楚殺之。○奐，呼亂反。" }
      - { type: z, text: "注“招之黨楚殺之”。○正義曰：孔奐之為招黨，傳無其文。正以殺稱名氏，是有罪之文，知其是招黨也。文七年“宋人殺其大夫”，傳曰：“不稱名，眾也，且言非其罪也。”無罪不稱名，知稱名為有罪矣。若使孔奐無罪，仲尼必當變文。但此非常例，先無定製，不知其將何所稱也。執招殺奐，皆是楚人為之，承上“楚師滅陳”之下，是楚可知，不復每文書楚。杜以註文隔，故言“楚殺”以明之。不言“殺陳大夫”者，殺他國之臣，例不書爵。宣十一年“楚人殺陳夏徵舒”，是其類也。此執招殺奐，皆“滅陳”乃為之，故依次而書，書在“滅陳”之下。" }
      - { type: j, text: "葬陳哀公。嬖人袁克葬之。魯注會，故書。○嬖，必計反。" }
      - { type: z, text: "注“嬖人”至“故書”。○正義曰：賈、服以“葬哀公”之文，在“殺孔奐”之下，以為楚葬哀公，故杜辯之“袁克葬之”。案傳“克欲殺馬毀玉，楚人將欲殺克”，不得為楚葬之。若是楚葬，宜云“楚人葬陳哀公”，當如“齊侯葬紀伯姬”，不得直言“葬”也。且諸言葬某公者，皆是魯往會葬之文，大夫不得書名，言其所為之事而已，故云“魯往會，故書”也。案傳袁克之葬，乃是私竊葬之。而魯得會者，諸侯之卒，告卒不告葬。但葬有常期，知卒即往會之，未必得以禮從赴也。" }
      - { type: j, text: "【傳】八年，春，石言於晉魏榆。（魏榆，晉地。○魏榆，服雲：“魏，邑也。榆，州里名。”）" }
      - { type: z, text: "注“魏榆晉地”。○正義曰：服虔雲：“魏，邑。榆，州里名。”襄二十三年叔孫豹“次於雍榆”。雍榆，地名，知魏榆亦地名也。" }
      - { type: j, text: "晉侯問於師曠曰：“石何故言？”對曰：“石不能言，或馮焉。謂有精神馮依石而言。○馮，皮冰反，注同。不然，民聽濫也。濫，失也。○濫，力暫反，下注同。" }
      - { type: z, text: "“民聽濫”。○正義曰：或民聽濫失實，無言而妄稱有言也。" }
      - { type: j, text: "抑臣又聞之抑，疑辭。曰：‘作事不時，怨讟動於民，則有非言之物而言。’今宮室崇侈，民力彫盡，彫，傷也。○讟，徒木反。侈，昌氏反，又尺氏反。怨讟並作，莫保其性。性，命也，民不敢自保其性命。石言，不亦宜乎！”於是晉侯方築虒祈之宮。虒祁，地名，在絳西四十里，臨汾水。○虒音斯，本又作，同。祁，巨之反，又音臣之反。汾，扶雲反。叔向曰：“子野之言，君子哉！子野，師曠字。君子之言，信而有徵，故怨遠於其身。怨咎遠其身也。○遠，於萬反，注同。咎，其九反，下文同。小人之言，僣而無徵，故怨咎及之。《詩》曰：‘哀哉不能言，匪舌是出，唯躬是瘁。《詩·小雅》也。不能言，謂不知言理。以僣言見退者，其言非不從舌出，以僣而無信，自取瘁病，故哀之。○僣，子念反，注同，不信也。出，如字，又尺遂反。瘁，在醉反。哿矣能言，巧言如流，俾躬處休。’其是之謂乎！哿嘉也。巧言如流謂非正言而順敘，以聽言見答者。言其可嘉，以信而有徵，自取安逸。師曠此言，緣問流轉，終歸於諫，故以比巧言如流也。當叔向時，《詩》義如此，故與今說《詩》者小異。○哿，古可反，《毛詩傳》雲可也。俾，必耳反，本又作卑。休，許虯反，美也。" }
      - { type: z, text: "“詩曰”至“謂乎”。○正義曰：《小雅·雨無正》之篇也。可哀愍哉，彼不能言之人。其所言者，非不從舌是出，但其言僣而無徵，惟於巳身是病。以不能言而自病其身，是可哀也。可嘉美矣，彼能言者，巧為言語如水之轉流，然其言“信而有徵”，自使其身處休美之地。以言能而自處其美地，故可嘉也。此能言處休者，其是子野之謂乎。○注“哿嘉”至“小異”。○正義曰：《詩毛傳》雲：“哿，可也。”哿無正訓，以其字從加從可，故各以意訓耳。此詩上文雲：“聽言則答，譖言則退”，然後次此“哀哉”，故杜以“哀哉不能言”覆上“僣言見退”，謂言而不見信，被黜退者也。“哿矣能言”覆上“聽言則答”，謂言可聽用見應答者也。以其言可嘉善，“信而有徵”，故“自取安逸”，處休美也。師曠因公之問，其言流轉，終歸於諫。其言實巧，故以比“巧言如流”也。據今毛鄭解《詩》“哀哉不能言”者，賢人不能言也，不能以其正道曲從君心，故身見困病。“哿矣能言”，乃指時世。所謂“能言”者，巧言從俗，如轉流矣。阿諛順旨，不依正法，得使身居休美。與此所引意異。故言“當叔向時，《詩》義如此，與今說《詩》者小異”。隱元年注云：“詩人之作，各以情言。君子論之，不以文害意。故《春秋傳》引《詩》，不皆與今說《詩》者同，他皆放此。”然則引《詩》斷章取義，得異於本，而云“叔向時《詩》義如此”者，但叔向此言在孔子刪《詩》之前，與刪《詩》之後，其義或異，故云“叔向時《詩》義如此”。隱元年論《詩》者君子之言，君子即丘明也。其言則刪《詩》之後，乃與《詩》說不同，故云引《詩》斷章。此杜大略而言。其實未脩之前，有引《詩》亦有斷章者。" }
      - { type: j, text: "是宮也成，諸侯必叛，君必有咎，夫子知之矣。”為十年晉侯彪卒傳。" }
      - { type: j, text: "陳哀公元妃鄭姬生悼大子偃師，元妃，嫡夫人也。二妃生公子留，下妃生公子勝。二妃嬖，留有寵，屬諸徒招與公子過。招及過皆哀公弟也。哀公有廢疾。○廢，甫肺反。三月，甲申，公子招、公子過殺悼大子偃師，而立公子留。" }
      - { type: j, text: "夏，四月，辛亥，哀公縊。憂恚自殺。經書辛丑，從赴。○諡，一豉反。恚，一睡反。" }
      - { type: z, text: "注“經書辛丑從赴”。○正義曰：經雲辛丑，傳言辛亥，經、傳異者，多是傳實經虛，故言從赴。《長曆》四月戊戌朔，四日辛丑，十四日辛亥。一月之內，有此二日，故不雲日誤。" }
      - { type: j, text: "幹徵師赴於楚，幹徵師，陳大夫。且糕有立君。公子勝愬之於楚，以招、過殺偃師告愬也。楚人執而殺之。殺於徵師。公子留奔鄭。書曰：“陳侯之弟招殺陳世子偃師”，罪在招也。“楚人執陳行人幹徵師殺之”，罪不在行人也。疑為招赴楚，當同罪，故重發之。○為，於偽反，下“為子良立宰”、“為之立宰”同。重，直用反。" }
      - { type: z, text: "注“疑為”至“發之”。○正義曰：襄十一年“楚人執鄭行人良霄”，傳稱“書曰行人，言使人也”。此復發傳，故言“重發之”也。《釋例》曰：“行人有六，而發傳有三者，因良霄以顯其稱行人，因幹徵師以示其非罪，因魯叔孫婼以同外內大夫，則餘三人皆隨例而為義也。”" }
      - { type: j, text: "叔弓如晉，賀虒祁也。賀宮成。游吉相鄭伯以如晉，亦賀虒祁也。史趙見子大叔曰：“甚哉，其相蒙也！蒙，欺也。○相，息亮反，下“而相吾室”同。可吊也，而又賀之？”子大叔曰：“若何吊也？其非唯我賀，將天下實賀。”言諸侯畏晉，非獨鄭。○若何吊也，本或作若何吊也。" }
      - { type: j, text: "秋，大蒐於紅，自根牟至於商、衛，革車千乘。大蒐，數軍實，簡車馬也。根牟，魯東界。琅邪陽都縣有牟鄉。商，宋地。魯西竟接宋、衛也。言千乘，明大蒐，且見魯眾之大數也。○乘，繩證反，注同。數，色主反。竟音境。見，賢遍反。" }
      - { type: j, text: "七月，甲戌，齊子尾卒，子旗欲治其室。子旗，欒施也。欲並治子尾之家政。丁丑，殺梁嬰。梁嬰，子尾家宰。八月，庚戌，逐子成、子工、子車，三子，齊大夫，子尾之屬。子成，頃公子固也。子工，成之弟鑄也。子車，頃公之孫捷也。○頃音傾，下文並同。鑄，之樹反。捷，在接反。皆來奔，不書，非卿。而立子良氏之宰。子良，子尾之子高彊也。子旗為子良立宰。其臣曰：“孺子長矣，孺子謂子良。○孺，而樹反，本亦作孺。長，丁丈反。而相吾室，欲兼我也。”兼，並也。授甲，將攻之。陳桓子善於子尾，亦授甲，將助之。或告子旗，子旗不信，則數人告。將往，又數人告於道，遂如陳氏。桓子將出矣，聞之而還，聞子旗至。○數，色主反，下同。" }
      - { type: z, text: "“將往”至“陳氏”。○正義曰：將往子良之家也，又數人告，不復敢向子良之家，遂如陳氏。服虔雲：“將往者，欲往到陳氏問助子良攻我意”，謬甚也。" }
      - { type: j, text: "游服而逆之，去戎備，著常游戲之服。○去，起呂反。著，張略反。請命。問桓子所至。對曰：“聞彊氏授甲將攻子，子聞諸？”曰：“弗聞。”“子盍亦授甲？無宇請從。”無宇，桓子名。○盍，胡臘反，下同。從，才用反。子旗曰：“子胡然？彼孺子也，吾誨之，猶懼其不濟，吾又寵秩之。謂為之立宰。其若先人何？子盍謂之？謂之使無攻我。《周書》曰：‘惠不惠，茂不茂。’《周書·康誥》也。言當施惠於不惠者，勸勉於不勉者，茂，勉也。康叔所以服弘大也。”服，行也。桓子稽顙曰：“頃、靈福子，頃公、靈公，樂氏所事之君。○稽音啟。顙，素黨反。" }
      - { type: z, text: "注“周書”至“勉也”。○正義曰：周公戒康叔，當施惠於不肯施惠者，勸勉其不能勉力者。今子良不能勉力為善，欲令桓子勸勉之，故引此書也。“茂，勉也”，《釋詁》文。○“頃”。○正義曰：諡法：“祗動追懼曰頃。”" }
      - { type: j, text: "吾猶有望。”望子旗惠及己。遂和之如初。和欒、高二家。陳公子招歸罪於公子過而殺之。言招所以不死而得放。九月，楚公子棄疾帥師奉孫吳圍陳，孫吳，悼大子偃師之子惠公。宋戴惡會之。戴惡，宋大夫。冬，十一月，壬午，滅陳。壬午，十月十八日。傳言十一月，誤。" }
      - { type: z, text: "注“壬午”至“月誤”。○正義曰：杜以《長曆》校之，十月乙丑朔，十八日得壬午也。十一月無壬午。經書十月，歷與經合，知傳言十一月者，誤也。" }
      - { type: j, text: "輿嬖袁克，殺馬毀玉以葬。輿，眾也。袁克，嬖人之貴者，欲以非禮厚葬哀公。" }
      - { type: z, text: "注“輿眾”至“哀公”。○正義曰：就眾嬖之內，特舉袁克之名，知克是嬖人之貴者也。葬無殺馬毀玉之法，知欲以非禮厚葬哀公也。服虔雲：“一曰：馬，陳侯所乘馬。玉，陳侯所佩玉。故殺馬毀玉，不欲使楚得之。”事亦有似。知不然者，楚既滅陳，則為已有，克不能私藏馬玉欲殘毀之，故不從。" }
      - { type: j, text: "楚人將殺之，請寘之。置馬、玉。○寘，之豉反。既又請私，私盡君臣恩。私於幄，加絰於顙而逃。幄，帳也。逃，不欲為楚臣。○幄，於角反。絰，直結反。使穿封戌為陳公，戌，楚大夫。滅陳為縣，使戌為縣公。○穿音川。戍音恤。曰：“城麇之役，不諂。成麇役在襄二十六年。戍與靈王爭皇頡。○麇，九倫反，注同。諂，敕檢反。頡，戶結反。侍飲酒於王。王曰：“城麇之役，女知寡人之及此，女其闢寡人乎？”及此，謂為王。○女音汝，下同。對曰：“若知君之及此，臣必致死禮，以息楚國。”息，寧靜也。晉侯問於史趙曰：“陳其遂亡乎？”對曰：“未也。”公曰：“何故？”對曰：“陳，顓頊之族也。陳祖舜，舜出顓頊。○顓音專。頊，許玉反。歲在鶉火，是以卒滅，陳將如之。顓頊氏以歲在鶉火而滅，火盛而水滅。○鶉，巿春反。" }
      - { type: z, text: "“對曰”至“楚國”。○正義曰：致死禮者，欲為郟敖致死殺靈王也。穿封戌既臣事靈王，而為此悖言，追恨不殺君者，以明在君為君之義，見巳忠直。若如今日有人欲謀靈王，巳必致死殺之，此對是諂，非悖也。○注“顓頊”至“水滅”。○正義曰：顓頊崩年，歲星在鶉火之次，於時猶有書專言之，故史趙得而知也。歲星，天之貴神，所在必昌。鶉火得歲而火益盛，火盛而水滅。顓頊水德，故以此年終也。陳是顓頊之族，故知滅將如之，亦當歲在鶉火，陳乃滅也。史趙別有以知，假此而為言耳。不可一準此言，以驗國之興滅。" }
      - { type: j, text: "今在析木之津，猶將復由。箕、鬥之間有天漢，故謂之析木之津。由，用也。○析，星曆反。復，扶又反，一音服。" }
      - { type: z, text: "注“箕斗”至“用也”。○正義曰：析木之津，於十二次為位在寅也。《釋天》雲：“析木之津，箕斗之間漢津也。”孫炎曰：“析別水木以箕、鬥之間，是天漢之津也。”劉炫謂是天漢，即天河也。天河在箕、鬥二星之間，箕在東方木位，鬥在北方水位。分析水、木，以箕星為隔。隔河須津樑以渡，故謂此次為析木之津也。不言析水而言析木者，此次自南而盡北，故依此次而名析木也。襄三十年傳稱“歲星在娵訾之口，其明年乃及降婁”。歲星歲行一次，降婁距此九年，故此年歲在析木之津也。“由，用”，《釋詁》文。言將用是而更興。" }
      - { type: j, text: "且陳氏得政於齊，而後陳卒亡。物莫能兩盛。自幕至於瞽瞍，無違命。幕，舜之先。瞽瞍，舜父。從幕至瞽瞍間，無違天命廢絕者。○幕音莫。瞽音古。瞍，素口反。" }
      - { type: z, text: "注“幕舜”至“絕者”。○正義曰：《魯語》雲：“幕，能師顓頊者也，有虞氏報焉。”孔晁雲：幕能修道，功不及祖，德不及宗，故每於歲之大烝而祭焉，謂之報。言虞舜祭幕，明幕是舜先，不知去舜遠近也。《帝系》雲：“顓頊生窮蟬，窮蟬生敬康，敬康生句芒，句芒生蟜牛，蟜牛生瞽瞍。”亦不知幕於蟜牛以前是誰名字之異也。“從幕至瞽叟，無違天命廢絕”，言其不絕世，繼嗣相傳，以至舜也。觀傳此文，瞽叟以前，似有國土。而《尚書·序》雲：“虞舜側微”，孔安國雲：“為庶人，故微賤。”經雲“有鰥在下，曰虞舜”，明是下賤矣。蓋至瞽叟，始失國耳。此久遠之事，不可知也。" }
      - { type: j, text: "舜重之以明德，寘德於遂，遂，舜後，蓋殷之興，存舜之後而封遂，言舜德乃至於遂。○重，直用反。" }
      - { type: z, text: "注“遂舜”至“於遂”。○正義曰：三年傳雲：“箕伯、直柄、虞遂、伯戲”，則遂在直柄之後，故云蓋殷興，存舜之後而封之也。言舜有明聖之德，其德流及於遂，故言“寘德於遂”。寘，置也，置此德於遂身，令使遂有德也。" }
      - { type: j, text: "遂世守之。及胡公不淫，故周賜之姓，使祀虞帝。胡公滿，遂之後也，事周武王，賜姓曰媯，封諸陳，紹舜後。○媯，九危反。" }
      - { type: z, text: "注“胡公”至“舜後”。正義曰：胡公封陳之由，襄二十五年傳巳具之矣。《世本》：“舜姓姚氏。”哀元年傳稱：夏後少康奔虞，虞思妻之以二姚。虞思，猶姓姚也。至胡公，周乃賜姓為媯耳。因昔虞舜居媯水，故周賜以媯為姓也。《陳世家》言“舜居媯汭，其後因姓媯氏”，謂胡公之前巳姓媯矣，是馬遷之妄也。" }
      - { type: j, text: "臣聞盛德必百世祀，虞之世數未也。繼守將在齊，其兆既存矣。”言陳氏興盛於齊，形兆巳見。○見，賢遍反。" }
      - { type: z, text: "“其兆既存矣”。○正義曰：陳氏世世益賢，而位漸高，有恩德而得民意，其有國之徵兆既存在矣，言可知也。" }
      - { type: j, text: "《春秋左傳正義》" }
