labels:
  - page: 10
    col: 9
    role: j
    text: 論語卷第一朱熹集注
  - page: 10
    col: 10
    role: title
    text: 學而第一
  - page: 10
    col: 11
    role: z
    text: 此爲書之首篇故所記多務本之意
  - page: 10
    col: 12
    role: z
    text: 乃入道之門積德之基學者之先務
  - page: 10
    col: 13
    role: z
    text: 也凡十六章
  - page: 10
    col: 14
    role: j
    text: 子曰學而時習之不亦說乎
  - page: 10
    col: 15
    role: z
    text: 說悅同○學之爲言效也人性皆善
  - page: 10
    col: 16
    role: z
    text: 而覺有先後後覺者必效先覺之所
  - page: 11
    col: 1
    role: z
    text: 爲乃可以明善而復其初也習鳥數
  - page: 11
    col: 2
    role: z
    text: 飛也學之不已如鳥數飛也悅喜意
  - page: 11
    col: 3
    role: z
    text: 也旣學而又時時習之則所學者熟
  - page: 11
    col: 4
    role: z
    text: 而中心喜說其進自不能已矣○程
  - page: 11
    col: 5
    role: z
    text: 子曰習重習也時復思繹浹洽於中
  - page: 11
    col: 6
    role: z
    text: 則說也又曰學者將以行之也時習
  - page: 11
    col: 7
    role: z
    text: 之則所學者在我故說○謝氏曰時
  - page: 11
    col: 8
    role: z
    text: 習者無時而不習坐如尸坐時習也
  - page: 11
    col: 9
    role: z
    text: 立如齊立時習也
  - page: 11
    col: 10
    role: j
    text: 有朋自遠方來不亦樂乎
  - page: 11
    col: 11
    role: z
    text: 樂音洛○朋同類也自遠方來則近
  - page: 11
    col: 12
    role: z
    text: 者可知○程子曰以善及人而信從
  - page: 11
    col: 13
    role: z
    text: 者衆故可樂又曰悅在心樂主發散
  - page: 11
    col: 14
    role: z
    text: 在外
  - page: 11
    col: 15
    role: j
    text: 人不知而不慍不亦君子乎
  - page: 11
    col: 16
    role: z
    text: 慍紆問反○慍含怒意君子成德之
  - page: 12
    col: 1
    role: z
    text: 名○尹氏曰學在己知不知在人何
  - page: 12
    col: 2
    role: z
    text: 慍之有○程子曰雖樂於及人不見
  - page: 12
    col: 3
    role: z
    text: 是而無悶乃所謂君子愚謂及人而
  - page: 12
    col: 4
    role: z
    text: 樂者順而易不知而不慍者逆而難
  - page: 12
    col: 5
    role: z
    text: 故惟成德者能之然德之所以成亦
  - page: 12
    col: 6
    role: z
    text: 曰學之正習之熟說之深而不已焉
  - page: 12
    col: 7
    role: z
    text: 耳○程子曰樂由說而後得非樂不
  - page: 12
    col: 8
    role: z
    text: 足以語君子
  - page: 12
    col: 9
    role: j
    text: 有子曰其爲人也孝弟而好犯上者鮮
  - page: 12
    col: 10
    role: j
    text: 矣不好犯上而好作亂者未之有也
  - page: 12
    col: 11
    role: z
    text: 弟好皆去聲鮮上聲下同○有子孔
  - page: 12
    col: 12
    role: z
    text: 子弟子名若善事父母爲孝善事兄
  - page: 12
    col: 13
    role: z
    text: 長爲弟犯上謂干犯在上之人鮮少
  - page: 12
    col: 14
    role: z
    text: 也作亂則爲悖逆爭鬥之事矣此言
  - page: 12
    col: 15
    role: z
    text: 人能孝弟則其心和順少好犯上必
  - page: 12
    col: 16
    role: z
    text: 不好作亂也
  - page: 13
    col: 1
    role: j
    text: 君子務本本立而道生孝弟也者其爲
  - page: 13
    col: 2
    role: j
    text: 仁之本與
  - page: 13
    col: 3
    role: z
    text: 與平聲○務專力也本猶根也仁者
  - page: 13
    col: 4
    role: z
    text: 愛之理心之德也爲仁猶曰行仁與
  - page: 13
    col: 5
    role: z
    text: 者疑詞謙退不敢質言也言君子凡
  - page: 13
    col: 6
    role: z
    text: 事專用力於根本根本旣立則其道
  - page: 13
    col: 7
    role: z
    text: 自生若上文所謂孝弟乃是爲仁之
  - page: 13
    col: 8
    role: z
    text: 本學者務此則仁道自此而生也○
  - page: 13
    col: 9
    role: z
    text: 程子曰孝弟順德也故不好犯上豈
  - page: 13
    col: 10
    role: z
    text: 復有逆理亂常之事德有本本立則
  - page: 13
    col: 11
    role: z
    text: 其道充大孝弟行於家而後仁愛及
  - page: 13
    col: 12
    role: z
    text: 於物所謂親親而仁民也故爲仁以
  - page: 13
    col: 13
    role: z
    text: 孝弟爲本論性則以仁爲孝弟之本
  - page: 13
    col: 14
    role: z
    text: 或問孝弟爲仁之本此是由孝弟可
  - page: 13
    col: 15
    role: z
    text: 以至仁否曰非也謂行仁自孝弟始
  - page: 13
    col: 16
    role: z
    text: 孝弟是仁之一事謂之行仁之本則
  - page: 14
    col: 1
    role: z
    text: 可謂是仁之本則不可蓋仁是性也
  - page: 14
    col: 2
    role: z
    text: 孝弟是用也性中只有箇仁義禮智
  - page: 14
    col: 3
    role: z
    text: 四者而已曷嘗有孝弟來然仁主於
  - page: 14
    col: 4
    role: z
    text: 愛愛莫大於愛親故曰孝弟也者其
  - page: 14
    col: 5
    role: z
    text: 爲仁之本與
  - page: 14
    col: 6
    role: j
    text: 子曰巧言令色鮮矣仁
  - page: 14
    col: 7
    role: z
    text: 巧好令善也好其言善其色致飾於
  - page: 14
    col: 8
    role: z
    text: 外務以悅人則人欲肆而本心之德
  - page: 14
    col: 9
    role: z
    text: 亡矣聖人詞不迫切專言鮮則絕無
  - page: 14
    col: 10
    role: z
    text: 可知學者所當深戒也○程子曰知
  - page: 14
    col: 11
    role: z
    text: 巧言令色之非仁則知仁矣
  - page: 14
    col: 12
    role: j
    text: 曾子曰吾日三省吾身爲人謀而不忠
  - page: 14
    col: 13
    role: j
    text: 乎與朋友交而不信乎傳不習乎
  - page: 14
    col: 14
    role: z
    text: 省悉井反爲去聲傳平聲○曾子孔
  - page: 14
    col: 15
    role: z
    text: 子弟子名參字子輿盡己之謂忠以
  - page: 14
    col: 16
    role: z
    text: 實之謂信傳謂受之於師習謂熟之
  - page: 15
    col: 1
    role: z
    text: 於已曾子以此三者日省其身有則
  - page: 15
    col: 2
    role: z
    text: 改之無則加勉其自治誠切如此可
  - page: 15
    col: 3
    role: z
    text: 謂得為學之本矣而三者之序則又
  - page: 15
    col: 4
    role: z
    text: 以忠信為傳習之本也○尹氏曰曾
  - page: 15
    col: 5
    role: z
    text: 子守約故動必求諸身○謝氏曰諸
  - page: 15
    col: 6
    role: z
    text: 子之學皆出於聖人其後愈遠而愈
  - page: 15
    col: 7
    role: z
    text: 失其真獨曾子之學專用心於內故
  - page: 15
    col: 8
    role: z
    text: 傳之無弊觀於子思孟子可見矣惜
  - page: 15
    col: 9
    role: z
    text: 乎其嘉言善行不盡傳於世也其幸
  - page: 15
    col: 10
    role: z
    text: 存而未泯者學者其可不盡心乎
  - page: 15
    col: 11
    role: j
    text: 子曰道千乘之國敬事而信節用而愛
  - page: 15
    col: 12
    role: j
    text: 人使民以時
  - page: 15
    col: 13
    role: z
    text: 道乘皆去聲○道治也馬氏云八百
  - page: 15
    col: 14
    role: z
    text: 家出車一乘千乘諸侯之國其地可
  - page: 15
    col: 15
    role: z
    text: 出兵車千乘者也敬者主一無適之
  - page: 15
    col: 16
    role: z
    text: 謂敬事而信者敬其事而信於民也
  - page: 16
    col: 1
    role: z
    text: 時謂農隙之時言治國之要在此五
  - page: 16
    col: 2
    role: z
    text: 者亦務本之意也○程子曰此言至
  - page: 16
    col: 3
    role: z
    text: 淺然當時諸侯果能此亦足以治其
  - page: 16
    col: 4
    role: z
    text: 國矣聖人言雖至近上下皆通此三
  - page: 16
    col: 5
    role: z
    text: 言者若推其極堯舜之治亦不過此
  - page: 16
    col: 6
    role: z
    text: 若常人之言近則淺近而已矣○楊
  - page: 16
    col: 7
    role: z
    text: 氏曰上不敬則下慢不信則下疑下
  - page: 16
    col: 8
    role: z
    text: 慢而疑事不立矣敬事而信以身先
  - page: 16
    col: 9
    role: z
    text: 之也易曰節以制度不傷財不害民
  - page: 16
    col: 10
    role: z
    text: 蓋侈用則傷財傷財必至於害民故
  - page: 16
    col: 11
    role: z
    text: 愛民必先於節用然使之不以其時
  - page: 16
    col: 12
    role: z
    text: 則力本者不獲自盡雖有愛人之心
  - page: 16
    col: 13
    role: z
    text: 而人不被其澤矣然此特論其所存
  - page: 16
    col: 14
    role: z
    text: 而已未及爲政也苟無是心則雖有
  - page: 16
    col: 15
    role: z
    text: 政不行焉○胡氏曰凡此數者又皆
  - page: 16
    col: 16
    role: z
    text: 以敬爲主愚謂五者反復相因各有
  - page: 17
    col: 1
    role: j
    text: 次第讀者宜細推之
  - page: 17
    col: 2
    role: j
    text: 子曰弟子入則孝出則弟謹而信汎愛
  - page: 17
    col: 3
    role: j
    text: 衆而親仁行有餘力則以學文
  - page: 17
    col: 4
    role: z
    text: 弟子之弟上聲則弟之弟去聲○謹
  - page: 17
    col: 5
    role: j
    text: 者行之有常也信者言之有實也汎
  - page: 17
    col: 6
    role: j
    text: 廣也衆謂衆人親近也仁謂仁者餘
  - page: 17
    col: 7
    role: j
    text: 力猶言暇日以用也文謂詩書六藝
  - page: 17
    col: 8
    role: j
    text: 之文○程子曰爲弟子之職力有餘
  - page: 17
    col: 9
    role: j
    text: 則學文不修其職而先文非爲己之
  - page: 17
    col: 10
    role: j
    text: 學也○尹氏曰德行本也文藝末也
  - page: 17
    col: 11
    role: j
    text: 窮其本末知所先後可以入德矣○
  - page: 17
    col: 12
    role: j
    text: 洪氏曰未有餘力而學文則文滅其
  - page: 17
    col: 13
    role: j
    text: 質有餘力而不學文則質勝而野愚
  - page: 17
    col: 14
    role: j
    text: 謂力行而不學文則無以考聖賢之
  - page: 17
    col: 15
    role: j
    text: 成法識事理之當然而所行或出於
  - page: 17
    col: 16
    role: j
    text: 私意非但失之於野而已
  - page: 18
    col: 1
    role: j
    text: 子夏曰賢賢易色事父母能竭其力事
  - page: 18
    col: 2
    role: j
    text: 君能致其身與朋友交言而有信雖曰
  - page: 18
    col: 3
    role: j
    text: 未學吾必謂之學矣
  - page: 18
    col: 4
    role: z
    text: 子夏孔子弟子姓卜名商賢人之賢
  - page: 18
    col: 5
    role: z
    text: 而易其好色之心好善有誠也致猶
  - page: 18
    col: 6
    role: z
    text: 委也委致其身謂不有其身也四者
  - page: 18
    col: 7
    role: z
    text: 皆人倫之大者而行之必盡其誠學
  - page: 18
    col: 8
    role: z
    text: 求如是而已故子夏言有能如是之
  - page: 18
    col: 9
    role: z
    text: 人苟非生質之美必其務學之至雖
  - page: 18
    col: 10
    role: z
    text: 或以爲未嘗爲學我必謂之已學也
  - page: 18
    col: 11
    role: z
    text: ○游氏曰三代之學皆所以明人倫
  - page: 18
    col: 12
    role: z
    text: 也能是四者則於人倫厚矣學之爲
  - page: 18
    col: 13
    role: z
    text: 道何以加此子夏以文學名而其言
  - page: 18
    col: 14
    role: z
    text: 如此則古人之所謂學者可知矣故
  - page: 18
    col: 15
    role: z
    text: 學而一篇大抵皆在於務本○吳氏
  - page: 18
    col: 16
    role: z
    text: 曰子夏之言其意善矣然詞氣之間
  - page: 19
    col: 1
    role: j
    text: 抑揚太過其流之弊將或至於廢學
  - page: 19
    col: 2
    role: j
    text: 必若上章夫子之言然後為無弊也
  - page: 19
    col: 3
    role: j
    text: 子曰君子不重則不威學則不固
  - page: 19
    col: 4
    role: j
    text: 重厚重威威嚴固堅固也輕乎外者
  - page: 19
    col: 5
    role: j
    text: 必不能堅乎内故不厚重則無威嚴
  - page: 19
    col: 6
    role: j
    text: 而所學亦不堅固也
  - page: 19
    col: 7
    role: j
    text: 主忠信
  - page: 19
    col: 8
    role: j
    text: 人不忠信則事皆無實為惡則易為
  - page: 19
    col: 9
    role: j
    text: 善則難故學者必以是為主焉○程
  - page: 19
    col: 10
    role: z
    text: 子曰人道唯在忠信不誠則無物且
  - page: 19
    col: 11
    role: j
    text: 出入無時莫知其鄉者人心也若無
  - page: 19
    col: 12
    role: z
    text: 忠信豈復有物乎
  - page: 19
    col: 13
    role: j
    text: 無友不如己者
  - page: 19
    col: 14
    role: j
    text: 無毋通禁止辭也友所以輔仁不如
  - page: 19
    col: 15
    role: z
    text: 己則無益而有損
  - page: 19
    col: 16
    role: j
    text: 過則勿憚改
  - page: 20
    col: 1
    role: z
    text: 勿亦禁止之辭憚畏難也自治不勇
  - page: 20
    col: 2
    role: z
    text: 則惡日長故有過當速改不可畏難
  - page: 20
    col: 3
    role: z
    text: 難而苟安也○程子曰學問之道無
  - page: 20
    col: 4
    role: z
    text: 他也知其不善則速改以從善而已
  - page: 20
    col: 5
    role: z
    text: ○程子曰君子自修之道當如是也
  - page: 20
    col: 6
    role: z
    text: ○游氏曰君子之道以威重為質而
  - page: 20
    col: 7
    role: z
    text: 學以成之學之道必以忠信為主而
  - page: 20
    col: 8
    role: z
    text: 以勝己者輔之然或吝於改過則終
  - page: 20
    col: 9
    role: z
    text: 無以入德而賢者亦未必樂告以善
  - page: 20
    col: 10
    role: z
    text: 道故以過勿憚改終焉
  - page: 20
    col: 11
    role: j
    text: 曾子曰慎終追遠民德歸厚矣
  - page: 20
    col: 12
    role: z
    text: 謹終者喪盡其禮追遠者祭盡其誠
  - page: 20
    col: 13
    role: z
    text: 民德歸厚謂下民化之其德亦歸於
  - page: 20
    col: 14
    role: z
    text: 厚蓋終者人之所易忽也而能謹之
  - page: 20
    col: 15
    role: z
    text: 遠者人之所易忘也而能追之厚之
  - page: 20
    col: 16
    role: z
    text: 道也故以此自為則已之德厚下民
  - page: 21
    col: 1
    role: z
    text: 化之則其德亦歸於厚也
  - page: 21
    col: 2
    role: j
    text: 子禽問於子貢曰夫子至於是邦也必
  - page: 21
    col: 3
    role: j
    text: 聞其政求之與抑與之與
  - page: 21
    col: 4
    role: z
    text: 之與之與平聲下同○子禽姓陳名
  - page: 21
    col: 5
    role: z
    text: 亢子貢姓端木名賜皆孔子弟子或
  - page: 21
    col: 6
    role: z
    text: 曰亢子貢弟子未知孰是抑反語辭
  - page: 21
    col: 7
    role: j
    text: 子貢曰夫子温良恭儉讓以得之夫子
  - page: 21
    col: 8
    role: j
    text: 之求之也其諸異乎人之求之與
  - page: 21
    col: 9
    role: z
    text: 温和厚也良易直也恭莊敬也儉節
  - page: 21
    col: 10
    role: z
    text: 制也讓謙遜也五者夫子之盛德光
  - page: 21
    col: 11
    role: z
    text: 輝接於人者也其諸語辭也人他人
  - page: 21
    col: 12
    role: z
    text: 也言夫子未嘗求之但其德容如是
  - page: 21
    col: 13
    role: z
    text: 故時君敬信自以其政就而問之耳
  - page: 21
    col: 14
    role: z
    text: 非若他人必求之而後得也聖人過
  - page: 21
    col: 15
    role: z
    text: 化存神之妙未易窺測然即此而觀
  - page: 21
    col: 16
    role: z
    text: 則其德盛禮恭而不願乎外亦可見
  - page: 22
    col: 1
    role: z
    text: 矣學者所當潛心而勉學也○謝氏
  - page: 22
    col: 2
    role: z
    text: 曰學者觀於聖人威儀之間亦可以
  - page: 22
    col: 3
    role: z
    text: 進德矣若子貢亦可謂善觀聖人矣
  - page: 22
    col: 4
    role: z
    text: 亦可謂善言德行矣今去聖人千五
  - page: 22
    col: 5
    role: z
    text: 百年以此五者想見其形容尚能使
  - page: 22
    col: 6
    role: z
    text: 人興起而況於親炙之者乎張敬夫
  - page: 22
    col: 7
    role: z
    text: 曰夫子至是邦必聞其政而未有能
  - page: 22
    col: 8
    role: z
    text: 委國而授之以政者蓋見聖人之儀
  - page: 22
    col: 9
    role: z
    text: 形而樂告之者秉彝好德之良心也
  - page: 22
    col: 10
    role: z
    text: 而私欲害之是以終不能用耳
  - page: 22
    col: 11
    role: j
    text: 子曰父在觀其志父沒觀其行三年無
  - page: 22
    col: 12
    role: j
    text: 改於父之道可謂孝矣
  - page: 22
    col: 13
    role: z
    text: 行去聲○父在子不得自專而志則
  - page: 22
    col: 14
    role: z
    text: 可知父沒然後其行可見故觀此足
  - page: 22
    col: 15
    role: z
    text: 以知其人之善惡然又必能三年無
  - page: 22
    col: 16
    role: z
    text: 改於父之道乃見其孝不然則所行
  - page: 23
    col: 1
    role: j
    text: 雖善亦不得爲孝矣○尹氏曰如其
  - page: 23
    col: 2
    role: j
    text: 道雖終身無改可也如其非道何待
  - page: 23
    col: 3
    role: j
    text: 三年然則三年無改者孝子之心有
  - page: 23
    col: 4
    role: j
    text: 所不忍故也○游氏曰三年無改亦
  - page: 23
    col: 5
    role: z
    text: 謂在所當改而可以未改者耳
  - page: 23
    col: 6
    role: j
    text: 有子曰禮之用和爲貴先王之道斯爲
  - page: 23
    col: 7
    role: j
    text: 美小大由之
  - page: 23
    col: 8
    role: z
    text: 禮者天理之節文人事之儀則也和
  - page: 23
    col: 9
    role: j
    text: 者從容不迫之意蓋禮之爲體雖嚴
  - page: 23
    col: 10
    role: j
    text: 而皆出於自然之理故其爲用必從
  - page: 23
    col: 11
    role: j
    text: 容而不迫乃爲可貴先王之道此其
  - page: 23
    col: 12
    role: j
    text: 所以爲美而小事大事無不由之也
  - page: 23
    col: 13
    role: j
    text: 有所不行知和而和不以禮節之亦不
  - page: 23
    col: 14
    role: j
    text: 可行也
  - page: 23
    col: 15
    role: j
    text: 承上文而言如此而復有所不行者
  - page: 23
    col: 16
    role: j
    text: 以其徒知和之爲貴而一於和不復
  - page: 24
    col: 1
    role: z
    text: 以禮節之則亦非復理之本然矣所
  - page: 24
    col: 2
    role: z
    text: 以流蕩忘反而亦不可行也○程子
  - page: 24
    col: 3
    role: z
    text: 曰禮勝則離故禮之用和為貴先王
  - page: 24
    col: 4
    role: z
    text: 之道以斯為美而小大由之樂勝則
  - page: 24
    col: 5
    role: z
    text: 流故有所不行者知和而和不以禮
  - page: 24
    col: 6
    role: z
    text: 節之亦不可行○范氏曰凡禮之體
  - page: 24
    col: 7
    role: z
    text: 主於敬而其用則以和為貴敬者禮
  - page: 24
    col: 8
    role: z
    text: 之所以立也和者樂之所由生也若
  - page: 24
    col: 9
    role: z
    text: 有子可謂達禮樂之本矣愚謂嚴而
  - page: 24
    col: 10
    role: z
    text: 泰和而節此理之自然禮之全體也
  - page: 24
    col: 11
    role: z
    text: 豪釐有差則失其中正而各倚於一
  - page: 24
    col: 12
    role: z
    text: 偏其不可行均矣
  - page: 24
    col: 13
    role: j
    text: 有子曰信近於義言可復也恭近於禮
  - page: 24
    col: 14
    role: j
    text: 遠恥辱也因不失其親亦可宗也
  - page: 24
    col: 15
    role: z
    text: 近遠皆去聲○信約信也義者事之
  - page: 24
    col: 16
    role: z
    text: 宜也復踐言也恭致敬也禮節文也
  - page: 25
    col: 1
    role: z
    text: 因猶依也宗猶主也言約信而合其
  - page: 25
    col: 2
    role: z
    text: 冝則言必可踐矣致恭而中其節則
  - page: 25
    col: 3
    role: z
    text: 能遠耻辱矣所依者不失其可親之
  - page: 25
    col: 4
    role: z
    text: 人則亦可以宗而主之矣此言人之
  - page: 25
    col: 5
    role: z
    text: 言行交際皆當謹之於始而慮其所
  - page: 25
    col: 6
    role: z
    text: 終不然則因仍苟且之間將有不勝
  - page: 25
    col: 7
    role: z
    text: 其自失之悔者矣
  - page: 25
    col: 8
    role: j
    text: 子曰君子食無求飽居無求安敏於事
  - page: 25
    col: 9
    role: j
    text: 而愼於言就有道而正焉可謂好學也
  - page: 25
    col: 10
    role: j
    text: 巳
  - page: 25
    col: 11
    role: z
    text: 好去聲○不求安飽者志有在而不
  - page: 25
    col: 12
    role: z
    text: 暇及也敏於事者勉其所不足謹於
  - page: 25
    col: 13
    role: z
    text: 言者不敢盡其所有餘也然猶不敢
  - page: 25
    col: 14
    role: z
    text: 自是而必就有道之人以正其是非
  - page: 25
    col: 15
    role: z
    text: 則可謂好學矣凡言道者皆謂事物
  - page: 25
    col: 16
    role: z
    text: 當然之理人之所共由者也○尹氏
  - page: 26
    col: 1
    role: z
    text: 曰君子之學能是四者可謂篤志力
  - page: 26
    col: 2
    role: z
    text: 行者矣然不取正於有道未免有差
  - page: 26
    col: 3
    role: z
    text: 如楊墨學仁義而差者也其流至於
  - page: 26
    col: 4
    role: z
    text: 無父無君謂之好學可乎
  - page: 26
    col: 5
    role: j
    text: 子貢曰貧而無諂富而無驕何如子曰
  - page: 26
    col: 6
    role: j
    text: 可也未若貧而樂富而好禮者也
  - page: 26
    col: 7
    role: z
    text: 樂音洛好去聲○諂卑屈也驕矜肆
  - page: 26
    col: 8
    role: z
    text: 也常人溺於貧富之中而不知所以
  - page: 26
    col: 9
    role: z
    text: 自守故必有二者之病無諂無驕則
  - page: 26
    col: 10
    role: z
    text: 知自守矣而未能超乎貧富之外也
  - page: 26
    col: 11
    role: z
    text: 凡曰可者僅可而有所未盡之辭也
  - page: 26
    col: 12
    role: z
    text: 樂則心廣體胖而忘其貧好禮則安
  - page: 26
    col: 13
    role: z
    text: 處善樂循理亦不自知其富矣子貢
  - page: 26
    col: 14
    role: z
    text: 貨殖蓋先貧後富而嘗用力於自守
  - page: 26
    col: 15
    role: z
    text: 者故以此爲問而夫子答之如此蓋
  - page: 26
    col: 16
    role: z
    text: 許其所已能而勉其所未至也
  - page: 27
    col: 1
    role: j
    text: 子貢曰詩云如切如磋如琢如磨其斯
  - page: 27
    col: 2
    role: j
    text: 之謂與
  - page: 27
    col: 3
    role: z
    text: 磋七多反與平聲○詩衛風淇澳之
  - page: 27
    col: 4
    role: z
    text: 篇言治骨角者旣切之而復磋之治
  - page: 27
    col: 5
    role: z
    text: 玉石者旣琢之而復磨之治之已精
  - page: 27
    col: 6
    role: z
    text: 而益求其精也子貢自以無謟無驕
  - page: 27
    col: 7
    role: j
    text: 爲至矣聞夫子之言又知義理之無窮
  - page: 27
    col: 8
    role: z
    text: 雖有得焉而未可遽自足也故引
  - page: 27
    col: 9
    role: z
    text: 是詩以明之
  - page: 27
    col: 10
    role: j
    text: 子曰賜也始可與言詩已矣告諸往而
  - page: 27
    col: 11
    role: j
    text: 知來者
  - page: 27
    col: 12
    role: j
    text: 往者其所已言者來者其所未言者○
  - page: 27
    col: 13
    role: z
    text: 愚按此章問答其淺深高下固不待
  - page: 27
    col: 14
    role: z
    text: 辨說而明矣然不切則磋無所施不
  - page: 27
    col: 15
    role: z
    text: 琢則磨無所措故學者雖不可安於
  - page: 27
    col: 16
    role: z
    text: 小成而不求造道之極致亦不可騖
  - page: 28
    col: 1
    role: j
    text: 於虛遠而不察切己之實病也
  - page: 28
    col: 2
    role: j
    text: 子曰不患人之不己知患不知人也
  - page: 28
    col: 3
    role: j
    text: 尹氏曰君子求在我者故不患人之
  - page: 28
    col: 4
    role: z
    text: 不己知不知人則是非邪正或不能
  - page: 28
    col: 5
    role: z
    text: 辨故以為患也
  - page: 28
    col: 6
    role: title
    text: 為政第二
  - page: 28
    col: 7
    role: z
    text: 凡二十四章
  - page: 28
    col: 8
    role: j
    text: 子曰為政以德譬如北辰居其所而衆
  - page: 28
    col: 9
    role: j
    text: 星共之
  - page: 28
    col: 10
    role: z
    text: 共音拱亦作拱○政之為言正也所
  - page: 28
    col: 11
    role: z
    text: 以正人之不正也德之為言得也得
  - page: 28
    col: 12
    role: z
    text: 於心而不失之謂也北辰北極天之
  - page: 28
    col: 13
    role: z
    text: 樞也居其所不動也共向也言衆星
  - page: 28
    col: 14
    role: z
    text: 四面旋繞而歸向之也為政以德則
  - page: 28
    col: 15
    role: z
    text: 無為而天下歸之其象如此○程子
  - page: 28
    col: 16
    role: z
    text: 曰為政以德然後無為○范氏曰為
  - page: 29
    col: 1
    role: z
    text: 政以德則不動而化不言而信無爲
  - page: 29
    col: 2
    role: z
    text: 而成所守者至簡而能御煩所處者
  - page: 29
    col: 3
    role: j
    text: 至靜而能制動所務者至寡而能服衆
  - page: 29
    col: 4
    role: j
    text: 子曰詩三百一言以蔽之曰思無邪
  - page: 29
    col: 5
    role: z
    text: 詩三百十一篇言三百者舉大數也
  - page: 29
    col: 6
    role: z
    text: 蔽猶蓋也思無邪魯頌駉篇之辭凡
  - page: 29
    col: 7
    role: z
    text: 詩之言善者可以感發人之善心惡
  - page: 29
    col: 8
    role: z
    text: 者可以懲創人之逸志其用歸於使
  - page: 29
    col: 9
    role: z
    text: 人得其情性之正而已然其言微婉
  - page: 29
    col: 10
    role: z
    text: 且或各因一事而發求其直指全體
  - page: 29
    col: 11
    role: z
    text: 則未有若此之明且盡者故夫子言
  - page: 29
    col: 12
    role: z
    text: 詩三百篇而惟此一言足以盡蓋
  - page: 29
    col: 13
    role: z
    text: 其義其示人之意亦深切矣○程子
  - page: 29
    col: 14
    role: z
    text: 曰思無邪者誠也○范氏曰學者必
  - page: 29
    col: 15
    role: z
    text: 務知要知要則能守約守約則足以
  - page: 29
    col: 16
    role: z
    text: 盡博矣經禮三百曲禮三千亦可以
  - page: 30
    col: 1
    role: z
    text: 一言蔽之曰毋不敬
  - page: 30
    col: 2
    role: j
    text: 子曰道之以政齊之以刑民免而無耻
  - page: 30
    col: 3
    role: z
    text: 道音導下同○道猶引導謂先之也
  - page: 30
    col: 4
    role: z
    text: 政謂法制禁令也齊所以一之也道
  - page: 30
    col: 5
    role: z
    text: 之而不從者有刑以一之也免而無
  - page: 30
    col: 6
    role: z
    text: 耻謂苟免刑罰而無所羞愧蓋雖不
  - page: 30
    col: 7
    role: z
    text: 敢爲惡而爲惡之心未甞亡也
  - page: 30
    col: 8
    role: j
    text: 道之以德齊之以禮有耻且格
  - page: 30
    col: 9
    role: z
    text: 禮謂制度品節也格至也言躬行以
  - page: 30
    col: 10
    role: z
    text: 率之則民固有所觀感而興起矣而
  - page: 30
    col: 11
    role: z
    text: 其淺深厚薄之不一者又有禮以一
  - page: 30
    col: 12
    role: z
    text: 之則民耻於不善而又有以至於善
  - page: 30
    col: 13
    role: z
    text: 也一說格正也書曰格其非心○愚
  - page: 30
    col: 14
    role: z
    text: 謂政者爲治之具刑者輔治之法德
  - page: 30
    col: 15
    role: z
    text: 禮則所以出治之本而德又禮之本
  - page: 30
    col: 16
    role: z
    text: 也此其相爲終始雖不可以偏廢然
  - page: 31
    col: 1
    role: z
    text: 政刑能使民遠罪而已德禮之效則
  - page: 31
    col: 2
    role: z
    text: 有以使民日遷善而不自知故治民
  - page: 31
    col: 3
    role: z
    text: 者不可徒恃其末又當深探其本也
  - page: 31
    col: 4
    role: j
    text: 子曰吾十有五而志于學
  - page: 31
    col: 5
    role: z
    text: 古者十五而入大學心之所之謂之
  - page: 31
    col: 6
    role: z
    text: 志此所謂學即大學之道也志乎此
  - page: 31
    col: 7
    role: z
    text: 則念念在此而爲之不厭矣
  - page: 31
    col: 8
    role: j
    text: 三十而立
  - page: 31
    col: 9
    role: z
    text: 有以自立則守之固而無所事志矣
  - page: 31
    col: 10
    role: j
    text: 四十而不惑
  - page: 31
    col: 11
    role: z
    text: 於事物之所當然皆無所疑則知之
  - page: 31
    col: 12
    role: z
    text: 明而無所事守矣
  - page: 31
    col: 13
    role: j
    text: 五十而知天命
  - page: 31
    col: 14
    role: z
    text: 天命即天道之流行而賦於物者乃
  - page: 31
    col: 15
    role: z
    text: 事物所以當然之故也知此則知極
  - page: 31
    col: 16
    role: z
    text: 其精而不惑又不足言矣
  - page: 32
    col: 1
    role: j
    text: 六十而耳順
  - page: 32
    col: 2
    role: z
    text: 聲入心通無所違逆知之之至不思
  - page: 32
    col: 3
    role: z
    text: 而得也
  - page: 32
    col: 4
    role: j
    text: 七十而從心所欲不踰矩
  - page: 32
    col: 5
    role: z
    text: 從如字○從隨也矩法度之器所以
  - page: 32
    col: 6
    role: z
    text: 爲方者也隨其心之所欲而自不過
  - page: 32
    col: 7
    role: z
    text: 於法度安而行之不勉而中也○程
  - page: 32
    col: 8
    role: z
    text: 子曰孔子生而知之也言亦由學而
  - page: 32
    col: 9
    role: z
    text: 至所以勉進後人也立能自立於斯
  - page: 32
    col: 10
    role: z
    text: 道也不惑則無所疑矣知天命窮理
  - page: 32
    col: 11
    role: z
    text: 盡性也耳順所聞皆通也從心所欲
  - page: 32
    col: 12
    role: z
    text: 不踰矩則不勉而中矣又曰孔子自
  - page: 32
    col: 13
    role: z
    text: 言其進德之序如此者聖人未必然
  - page: 32
    col: 14
    role: z
    text: 但爲學者立法使之盈科而後進成
  - page: 32
    col: 15
    role: z
    text: 章而後達耳○胡氏曰聖人之教亦
  - page: 32
    col: 16
    role: z
    text: 多術然其要使人不失其本心而已
  - page: 33
    col: 1
    role: z
    text: 欲得此心者惟志乎聖人所示之學
  - page: 33
    col: 2
    role: z
    text: 循其序而進焉至於一疵不存萬理
  - page: 33
    col: 3
    role: z
    text: 明盡之後則其日用之間本心瑩然
  - page: 33
    col: 4
    role: z
    text: 隨所意欲莫非至理蓋心即體欲即
  - page: 33
    col: 5
    role: z
    text: 用體即道用即義聲爲律而身爲度
  - page: 33
    col: 6
    role: z
    text: 矣又曰聖人言此一以示學者當優
  - page: 33
    col: 7
    role: z
    text: 游涵泳不可躐等而進二以示學者
  - page: 33
    col: 8
    role: z
    text: 當日就月將不可半途而廢也愚謂
  - page: 33
    col: 9
    role: z
    text: 聖人生知安行固無積累之漸然其
  - page: 33
    col: 10
    role: z
    text: 心未甞自謂已至此也是其日用之
  - page: 33
    col: 11
    role: z
    text: 間必有獨覺其進而人不及知者故
  - page: 33
    col: 12
    role: z
    text: 因其近似以自名欲學者以是爲則
  - page: 33
    col: 13
    role: z
    text: 而自勉非心實自聖而姑爲是退託
  - page: 33
    col: 14
    role: z
    text: 也後凡言謙詞之屬意皆放此
  - page: 33
    col: 15
    role: j
    text: 孟懿子問孝子曰無違
  - page: 33
    col: 16
    role: z
    text: 孟懿子魯大夫仲孫氏名何忌無違
  - page: 34
    col: 1
    role: z
    text: 謂不背於理
  - page: 34
    col: 2
    role: j
    text: 樊遲御子告之曰孟孫問孝於我我對
  - page: 34
    col: 3
    role: j
    text: 曰無違
  - page: 34
    col: 4
    role: z
    text: 樊遲孔子弟子名須御爲孔子御車
  - page: 34
    col: 5
    role: z
    text: 也孟孫即仲孫也夫子以懿子未達
  - page: 34
    col: 6
    role: z
    text: 而不能問恐其失指而以從親之令
  - page: 34
    col: 7
    role: z
    text: 爲孝故語樊遲以發之
  - page: 34
    col: 8
    role: j
    text: 樊遲曰何謂也子曰生事之以禮死葬
  - page: 34
    col: 9
    role: j
    text: 之以禮祭之以禮
  - page: 34
    col: 10
    role: z
    text: 生事葬祭事親之始終具矣禮即理
  - page: 34
    col: 11
    role: z
    text: 之節文也人之事親自始至終一於
  - page: 34
    col: 12
    role: z
    text: 禮而不苟其尊親也至矣是時三家
  - page: 34
    col: 13
    role: z
    text: 僭禮故夫子以是警之然語意渾然
  - page: 34
    col: 14
    role: z
    text: 又若不專爲三家發者所以爲聖人
  - page: 34
    col: 15
    role: z
    text: 之言也○胡氏曰人之欲孝其親心
  - page: 34
    col: 16
    role: z
    text: 雖無窮而分則有限得爲而不爲與
  - page: 35
    col: 1
    role: z
    text: 不得爲而爲之均於不孝所謂以禮
  - page: 35
    col: 2
    role: z
    text: 者爲其所得爲者而已矣
  - page: 35
    col: 3
    role: j
    text: 孟武伯問孝子曰父母惟其疾之憂
  - page: 35
    col: 4
    role: z
    text: 武伯懿子之子名彘言父母愛子之
  - page: 35
    col: 5
    role: z
    text: 心無所不至惟恐其有疾病常以爲
  - page: 35
    col: 6
    role: z
    text: 憂也人子體此而以父母之心爲心
  - page: 35
    col: 7
    role: z
    text: 則凡所以守其身者自不容於不謹
  - page: 35
    col: 8
    role: z
    text: 矣豈不可以爲孝乎舊說人子能使
  - page: 35
    col: 9
    role: z
    text: 父母不以其陷於不義爲憂而獨以
  - page: 35
    col: 10
    role: z
    text: 其疾爲憂乃可謂孝亦通
  - page: 35
    col: 11
    role: j
    text: 子游問孝子曰今之孝者是謂能養至
  - page: 35
    col: 12
    role: j
    text: 於犬馬皆能有養不敬何以別乎
  - page: 35
    col: 13
    role: z
    text: 養去聲別彼列反○子游孔子弟子
  - page: 35
    col: 14
    role: z
    text: 姓言名偃養謂飲食供奉也犬馬待
  - page: 35
    col: 15
    role: z
    text: 人而食亦若養然言人畜犬馬皆能
  - page: 35
    col: 16
    role: z
    text: 有以養之若能養其親而敬不至則
  - page: 36
    col: 1
    role: z
    text: 與養犬馬者何異甚言不敬之罪所
  - page: 36
    col: 2
    role: z
    text: 以深警之也○胡氏曰世俗事親能
  - page: 36
    col: 3
    role: z
    text: 養足矣狎恩恃愛而不知其漸流於
  - page: 36
    col: 4
    role: z
    text: 不敬則非小失也子游聖門髙弟未
  - page: 36
    col: 5
    role: z
    text: 必至此聖人直恐其愛踰於敬故以
  - page: 36
    col: 6
    role: z
    text: 是深警發之也
  - page: 36
    col: 7
    role: j
    text: 子夏問孝子曰色難有事弟子服其勞
  - page: 36
    col: 8
    role: j
    text: 有酒食先生饌曽是以爲孝乎
  - page: 36
    col: 9
    role: z
    text: 食音嗣○色難謂事親之際惟色爲
  - page: 36
    col: 10
    role: z
    text: 難也食飯也先生父兄也饌飲食之
  - page: 36
    col: 11
    role: z
    text: 也曽猶甞也蓋孝子之有深愛者必
  - page: 36
    col: 12
    role: z
    text: 有和氣有和氣者必有愉色有愉色
  - page: 36
    col: 13
    role: z
    text: 者必有婉容故事親之際惟色爲難
  - page: 36
    col: 14
    role: z
    text: 耳服勞奉養未足爲孝也舊說承順
  - page: 36
    col: 15
    role: z
    text: 父母之色爲難亦通○程子曰告懿
  - page: 36
    col: 16
    role: z
    text: 子告衆人者也對武伯者以其人多
  - page: 37
    col: 1
    role: z
    text: 可憂之事子游能養而或失於敬子
  - page: 37
    col: 2
    role: z
    text: 夏能直義而或少溫潤之色各因其
  - page: 37
    col: 3
    role: j
    text: 材之髙下與其所失而告之故不同也
  - page: 37
    col: 4
    role: j
    text: 子曰吾與回言終日不違如愚退而省
  - page: 37
    col: 5
    role: j
    text: 其私亦足以發回也不愚
  - page: 37
    col: 6
    role: z
    text: 回孔子弟子姓顔字子淵不違者意
  - page: 37
    col: 7
    role: z
    text: 不相背有聽受而無問難也私謂燕
  - page: 37
    col: 8
    role: z
    text: 居獨處非進見請問之時發謂發明
  - page: 37
    col: 9
    role: z
    text: 所言之理愚聞之師曰顔子深潛淳
  - page: 37
    col: 10
    role: z
    text: 粹其於聖人體叚巳具其聞夫子之
  - page: 37
    col: 11
    role: z
    text: 言黙識心融觸處洞然自有條理故
  - page: 37
    col: 12
    role: z
    text: 終日言但見其不違如愚人而巳及
  - page: 37
    col: 13
    role: z
    text: 退省其私則見其日用動靜語黙之
  - page: 37
    col: 14
    role: z
    text: 間皆足以發明夫子之道坦然由之
  - page: 37
    col: 15
    role: z
    text: 而無疑然後知其不愚也
  - page: 37
    col: 16
    role: j
    text: 子曰視其所以
  - page: 38
    col: 1
    role: z
    text: 以爲也爲善者爲君子爲惡者爲小
  - page: 38
    col: 2
    role: z
    text: 人
  - page: 38
    col: 3
    role: j
    text: 觀其所由
  - page: 38
    col: 4
    role: z
    text: 觀比視爲詳矣由從也事雖爲善而
  - page: 38
    col: 5
    role: z
    text: 意之所從來者有未善焉則亦不得
  - page: 38
    col: 6
    role: z
    text: 爲君子矣或曰由行也謂所以行其
  - page: 38
    col: 7
    role: z
    text: 所爲者也
  - page: 38
    col: 8
    role: j
    text: 察其所安
  - page: 38
    col: 9
    role: z
    text: 察則又加詳矣安所樂也所由雖善
  - page: 38
    col: 10
    role: z
    text: 而心所樂者不在於是則亦僞耳豈
  - page: 38
    col: 11
    role: z
    text: 能乆而不變哉
  - page: 38
    col: 12
    role: j
    text: 人焉廋哉人焉廋哉
  - page: 38
    col: 13
    role: z
    text: 焉於虔反廋所留反○焉何也廋匿
  - page: 38
    col: 14
    role: j
    text: 也重言以深明之○程子曰在己者能
  - page: 38
    col: 15
    role: z
    text: 知言窮理則能以此察人如聖人也
  - page: 38
    col: 16
    role: j
    text: 子曰温故而知新可以爲師矣
  - page: 39
    col: 1
    role: z
    text: 温尋繹也故者舊所聞新者今所得
  - page: 39
    col: 2
    role: z
    text: 言學能時習舊聞而每有新得則所
  - page: 39
    col: 3
    role: z
    text: 學在我而其應不窮故可以爲人師
  - page: 39
    col: 4
    role: z
    text: 若夫記問之學則無得於心而所知
  - page: 39
    col: 5
    role: z
    text: 有限故學記譏其不足以爲人師正
  - page: 39
    col: 6
    role: z
    text: 與此意互相發也
  - page: 39
    col: 7
    role: j
    text: 子曰君子不器
  - page: 39
    col: 8
    role: z
    text: 器者各適其用而不能相通成德之
  - page: 39
    col: 9
    role: z
    text: 士體無不具故用無不周非特爲一
  - page: 39
    col: 10
    role: z
    text: 才一藝而已
  - page: 39
    col: 11
    role: j
    text: 子貢問君子子曰先行其言而後從之
  - page: 39
    col: 12
    role: z
    text: 周氏曰先行其言者行之於未言之
  - page: 39
    col: 13
    role: z
    text: 前而後從之者言之於既行之後○
  - page: 39
    col: 14
    role: z
    text: 范氏曰子貢之患非言之艱而行之
  - page: 39
    col: 15
    role: z
    text: 艱故告之以此
  - page: 39
    col: 16
    role: j
    text: 子曰君子周而不比小人比而不周
  - page: 40
    col: 1
    role: z
    text: 周普徧也比偏黨也皆與人親厚之
  - page: 40
    col: 2
    role: z
    text: 意但周公而比私耳○君子小人所
  - page: 40
    col: 3
    role: z
    text: 爲不同如隂陽晝夜每每相反然究
  - page: 40
    col: 4
    role: z
    text: 其所以分則在公私之際毫釐之差
  - page: 40
    col: 5
    role: z
    text: 耳故聖人於周比和同驕泰之屬常
  - page: 40
    col: 6
    role: z
    text: 對舉而互言之欲學者察乎兩間而
  - page: 40
    col: 7
    role: z
    text: 審其取舎之幾也
  - page: 40
    col: 8
    role: j
    text: 子曰學而不思則罔思而不學則殆
  - page: 40
    col: 9
    role: z
    text: 不求諸心故昏而無得不習其事故
  - page: 40
    col: 10
    role: z
    text: 危而不安○程子曰博學審問謹思
  - page: 40
    col: 11
    role: z
    text: 明辨篤行五者廢其一非學也
  - page: 40
    col: 12
    role: j
    text: 子曰攻乎異端斯害也已
  - page: 40
    col: 13
    role: z
    text: 范氏曰攻專治也故治木石金玉之
  - page: 40
    col: 14
    role: z
    text: 工曰攻異端非聖人之道而別爲一
  - page: 40
    col: 15
    role: z
    text: 端如楊墨是也其率天下至於無父
  - page: 40
    col: 16
    role: z
    text: 無君專治而欲精之爲害甚矣○程
  - page: 42
    col: 1
    role: z
    text: 子曰佛氏之言比之楊墨尤爲近理
  - page: 42
    col: 2
    role: z
    text: 所以其害爲尤甚學者當如淫聲美
  - page: 42
    col: 3
    role: j
    text: 色以遠之不爾則駸駸然入於其中矣
  - page: 42
    col: 4
    role: j
    text: 子曰由誨女知之乎知之爲知之不知
  - page: 42
    col: 5
    role: j
    text: 爲不知是知也
  - page: 42
    col: 6
    role: z
    text: 女音汝○由孔子弟子姓仲字子路
  - page: 42
    col: 7
    role: z
    text: 子路好勇蓋有強其所不知以爲知
  - page: 42
    col: 8
    role: z
    text: 者故夫子告之曰我教女以知之之
  - page: 42
    col: 9
    role: z
    text: 道乎但所知者則以爲知所不知者
  - page: 42
    col: 10
    role: z
    text: 則以爲不知如此則雖或不能盡知
  - page: 42
    col: 11
    role: z
    text: 而無自欺之蔽亦不害其爲知矣况
  - page: 42
    col: 12
    role: z
    text: 由此而求之又有可知之理乎
  - page: 42
    col: 13
    role: j
    text: 子張學干祿
  - page: 42
    col: 14
    role: z
    text: 子張孔子弟子姓顓孫名師干求也
  - page: 42
    col: 15
    role: z
    text: 祿仕者之奉也
  - page: 42
    col: 16
    role: j
    text: 子曰多聞闕疑愼言其餘則寡尤多見
  - page: 43
    col: 1
    role: j
    text: 闕殆慎行其餘則寡悔言寡尤行寡悔
  - page: 43
    col: 2
    role: j
    text: 禄在其中矣
  - page: 43
    col: 3
    role: z
    text: 行寡之行去聲○吕氏曰疑者所未
  - page: 43
    col: 4
    role: z
    text: 信殆者所未安○程子曰尤罪自外
  - page: 43
    col: 5
    role: z
    text: 至者也悔理自内出者也愚謂多聞
  - page: 43
    col: 6
    role: z
    text: 見者學之博闕疑殆者擇之精謹言
  - page: 43
    col: 7
    role: z
    text: 行者守之約凡言在其中者皆不求
  - page: 43
    col: 8
    role: z
    text: 而自至之辭言此以救子張之失而
  - page: 43
    col: 9
    role: z
    text: 進之也○程子曰修天爵則人爵至
  - page: 43
    col: 10
    role: z
    text: 君子言行能謹得禄之道也子張學
  - page: 43
    col: 11
    role: z
    text: 干禄故告之以此使定其心而不爲
  - page: 43
    col: 12
    role: z
    text: 利禄動若顔閔則無此問矣或疑如
  - page: 43
    col: 13
    role: z
    text: 此亦有不得禄者孔子蓋曰耕也餒
  - page: 43
    col: 14
    role: z
    text: 在其中惟理可爲者爲之而已矣
  - page: 43
    col: 15
    role: j
    text: 哀公問曰何爲則民服孔子對曰舉直
  - page: 43
    col: 16
    role: j
    text: 錯諸枉則民服舉枉錯諸直則民不服
  - page: 44
    col: 1
    role: z
    text: 哀公魯君名蔣凡君問皆稱孔子對
  - page: 44
    col: 2
    role: z
    text: 曰者尊君也錯捨置也諸衆也○程
  - page: 44
    col: 3
    role: z
    text: 子曰舉錯得義則人心服○謝氏曰
  - page: 44
    col: 4
    role: z
    text: 好直而惡枉天下之至情也順之則
  - page: 44
    col: 5
    role: z
    text: 服逆之則去必然之理也然或無道
  - page: 44
    col: 6
    role: z
    text: 以照之則以直爲枉以枉爲直者多
  - page: 44
    col: 7
    role: z
    text: 矣是以君子大居敬而貴窮理也
  - page: 44
    col: 8
    role: j
    text: 季康子問使民敬忠以勸如之何子曰
  - page: 44
    col: 9
    role: j
    text: 臨之以莊則敬孝慈則忠舉善而教不
  - page: 44
    col: 10
    role: j
    text: 能則勸
  - page: 44
    col: 11
    role: z
    text: 季康子魯大夫季孫氏名肥莊謂容
  - page: 44
    col: 12
    role: z
    text: 貌端嚴也臨民以莊則民敬於己孝
  - page: 44
    col: 13
    role: z
    text: 於親慈於衆則民忠於己善者舉之
  - page: 44
    col: 14
    role: z
    text: 而不能者教之則民有所勸而樂於
  - page: 44
    col: 15
    role: z
    text: 爲善○張敬夫曰此皆在我所當爲
  - page: 44
    col: 16
    role: z
    text: 非爲欲使民敬忠以勸而爲之也然
  - page: 45
    col: 1
    role: z
    text: 能如是則其應蓋有不期而然者矣
  - page: 45
    col: 2
    role: j
    text: 或謂孔子曰子奚不爲政
  - page: 45
    col: 3
    role: z
    text: 定公初年孔子不仕故或人疑其不
  - page: 45
    col: 4
    role: z
    text: 爲政也
  - page: 45
    col: 5
    role: j
    text: 子曰書云孝乎惟孝友于兄弟施於有
  - page: 45
    col: 6
    role: j
    text: 政是亦爲政奚其爲爲政
  - page: 45
    col: 7
    role: z
    text: 書周書君陳篇書云孝乎者言書之
  - page: 45
    col: 8
    role: z
    text: 言孝如此也善兄弟曰友書言君陳
  - page: 45
    col: 9
    role: z
    text: 能孝於親友於兄弟又能推廣此心
  - page: 45
    col: 10
    role: z
    text: 以爲一家之政孔子引之言如此則
  - page: 45
    col: 11
    role: z
    text: 是亦爲政矣何必居位乃爲爲政乎
  - page: 45
    col: 12
    role: z
    text: 蓋孔子之不仕有難以語或人者故
  - page: 45
    col: 13
    role: z
    text: 託此以告之要之至理亦不外是
  - page: 45
    col: 14
    role: j
    text: 子曰人而無信不知其可也大車無輗
  - page: 45
    col: 15
    role: j
    text: 小車無軏其何以行之哉
  - page: 45
    col: 16
    role: z
    text: 輗五兮反軏音月○大車謂平地任
  - page: 46
    col: 1
    role: z
    text: 載之車輗轅端横木縛軛以駕牛者
  - page: 46
    col: 2
    role: z
    text: 小車謂田車兵車乘車軌轅端上曲
  - page: 46
    col: 3
    role: z
    text: 鉤衡以駕馬者車無此二者則不可
  - page: 46
    col: 4
    role: z
    text: 以行人而無信亦猶是也
  - page: 46
    col: 5
    role: j
    text: 子張問十世可知也
  - page: 46
    col: 6
    role: z
    text: 陸氏曰也一作乎○王者易姓受命
  - page: 46
    col: 7
    role: z
    text: 爲一世子張問自此以後十世之事
  - page: 46
    col: 8
    role: z
    text: 可前知乎
  - page: 46
    col: 9
    role: j
    text: 子曰殷因於夏禮所損益可知也周因
  - page: 46
    col: 10
    role: j
    text: 於殷禮所損益可知也其或繼周者雖
  - page: 46
    col: 11
    role: j
    text: 百世可知也
  - page: 46
    col: 12
    role: z
    text: 馬氏曰所因謂三綱五常所損益謂
  - page: 46
    col: 13
    role: z
    text: 文質三統愚按三綱謂君爲臣綱父
  - page: 46
    col: 14
    role: z
    text: 爲子綱夫爲妻綱五常謂仁義禮智
  - page: 46
    col: 15
    role: z
    text: 信文質謂夏尚忠商尚質周尚文三
  - page: 46
    col: 16
    role: z
    text: 統謂夏正建寅爲人統商正建丑爲
  - page: 47
    col: 1
    role: j
    text: 地統周正建子為天統三綱五常禮
  - page: 47
    col: 2
    role: j
    text: 之大體三代相繼皆因之而不能變
  - page: 47
    col: 3
    role: j
    text: 其所損益不過文章制度小過不及
  - page: 47
    col: 4
    role: j
    text: 之間而其已然之迹今皆可見則自
  - page: 47
    col: 5
    role: j
    text: 今以往或有繼周而王者雖百世之
  - page: 47
    col: 6
    role: j
    text: 遠所因所革亦不過此豈但十世而
  - page: 47
    col: 7
    role: j
    text: 已乎聖人所以知來者蓋如此非若
  - page: 47
    col: 8
    role: j
    text: 後世讖緯術數之學也○胡氏曰子
  - page: 47
    col: 9
    role: j
    text: 張之問蓋欲知來而聖人言其既往
  - page: 47
    col: 10
    role: j
    text: 者以明之也夫自修身以至於為天
  - page: 47
    col: 11
    role: j
    text: 下不可一日而無禮天叙天秩人所
  - page: 47
    col: 12
    role: j
    text: 共由禮之本也商不能改乎夏周不
  - page: 47
    col: 13
    role: j
    text: 能改乎商所謂天地之常經也若乃
  - page: 47
    col: 14
    role: j
    text: 制度文為或太過則當損或不足則
  - page: 47
    col: 15
    role: j
    text: 當益益之損之與時宜之而所因者
  - page: 47
    col: 16
    role: j
    text: 不壞是古今之通義也因往推來雖
  - page: 48
    col: 1
    role: z
    text: 百世之遠不過如此而已矣
  - page: 48
    col: 2
    role: j
    text: 子曰非其鬼而祭之謟也
  - page: 48
    col: 3
    role: z
    text: 非其鬼謂非其所當祭之鬼謟求媚
  - page: 48
    col: 4
    role: z
    text: 也
  - page: 48
    col: 5
    role: j
    text: 見義不爲無勇也
  - page: 48
    col: 6
    role: z
    text: 知而不爲是無勇也
  - page: 48
    col: 8
    role: j
    text: 論語卷第一
