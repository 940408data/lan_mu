# 论语集注（当涂郡斋刊递修本·善本底）：j 为经传大字，z 为章句小字。版面结构先行：顶格经/退格注。
sections:
  - id: pian1
    name: 學而第一
    blocks:
      - { type: z, text: 此爲書之首篇故所記多務本之意乃入道之門積德之基學者之先務也凡十六章 }
      - { type: j, text: 子曰學而時習之不亦說乎 }
      - { type: z, text: 說悅同○學之爲言效也人性皆善而覺有先後後覺者必效先覺之所爲乃可以明善而復其初也習鳥數飛也學之不已如鳥數飛也悅喜意也旣學而又時時習之則所學者熟而中心喜說其進自不能已矣○程子曰習重習也時復思繹浹洽於中則說也又曰學者將以行之也時習之則所學者在我故說○謝氏曰時習者無時而不習坐如尸坐時習也立如齊立時習也 }
      - { type: j, text: 有朋自遠方來不亦樂乎 }
      - { type: z, text: 樂音洛○朋同類也自遠方來則近者可知○程子曰以善及人而信從者衆故可樂又曰悅在心樂主發散在外 }
      - { type: j, text: 人不知而不慍不亦君子乎 }
      - { type: z, text: 慍紆問反○慍含怒意君子成德之名○尹氏曰學在己知不知在人何慍之有○程子曰雖樂於及人不見是而無悶乃所謂君子愚謂及人而樂者順而易不知而不慍者逆而難故惟成德者能之然德之所以成亦曰學之正習之熟說之深而不已焉耳○程子曰樂由說而後得非樂不足以語君子 }
      - { type: j, text: 有子曰其爲人也孝弟而好犯上者鮮矣不好犯上而好作亂者未之有也 }
      - { type: z, text: 弟好皆去聲鮮上聲下同○有子孔子弟子名若善事父母爲孝善事兄長爲弟犯上謂干犯在上之人鮮少也作亂則爲悖逆爭鬥之事矣此言人能孝弟則其心和順少好犯上必不好作亂也 }
      - { type: j, text: 君子務本本立而道生孝弟也者其爲仁之本與 }
      - { type: z, text: 與平聲○務專力也本猶根也仁者愛之理心之德也爲仁猶曰行仁與者疑詞謙退不敢質言也言君子凡事專用力於根本根本旣立則其道自生若上文所謂孝弟乃是爲仁之本學者務此則仁道自此而生也○程子曰孝弟順德也故不好犯上豈復有逆理亂常之事德有本本立則其道充大孝弟行於家而後仁愛及於物所謂親親而仁民也故爲仁以孝弟爲本論性則以仁爲孝弟之本或問孝弟爲仁之本此是由孝弟可以至仁否曰非也謂行仁自孝弟始孝弟是仁之一事謂之行仁之本則可謂是仁之本則不可蓋仁是性也孝弟是用也性中只有箇仁義禮智四者而已曷嘗有孝弟來然仁主於愛愛莫大於愛親故曰孝弟也者其爲仁之本與 }
      - { type: j, text: 子曰巧言令色鮮矣仁 }
      - { type: z, text: 巧好令善也好其言善其色致飾於外務以悅人則人欲肆而本心之德亡矣聖人詞不迫切專言鮮則絕無可知學者所當深戒也○程子曰知巧言令色之非仁則知仁矣 }
      - { type: j, text: 曾子曰吾日三省吾身爲人謀而不忠乎與朋友交而不信乎傳不習乎 }
      - { type: z, text: 省悉井反爲去聲傳平聲○曾子孔子弟子名參字子輿盡己之謂忠以實之謂信傳謂受之於師習謂熟之於已曾子以此三者日省其身有則改之無則加勉其自治誠切如此可謂得為學之本矣而三者之序則又以忠信為傳習之本也○尹氏曰曾子守約故動必求諸身○謝氏曰諸子之學皆出於聖人其後愈遠而愈失其真獨曾子之學專用心於內故傳之無弊觀於子思孟子可見矣惜乎其嘉言善行不盡傳於世也其幸存而未泯者學者其可不盡心乎 }
      - { type: j, text: 子曰道千乘之國敬事而信節用而愛人使民以時 }
      - { type: z, text: 道乘皆去聲○道治也馬氏云八百家出車一乘千乘諸侯之國其地可出兵車千乘者也敬者主一無適之謂敬事而信者敬其事而信於民也時謂農隙之時言治國之要在此五者亦務本之意也○程子曰此言至淺然當時諸侯果能此亦足以治其國矣聖人言雖至近上下皆通此三言者若推其極堯舜之治亦不過此若常人之言近則淺近而已矣○楊氏曰上不敬則下慢不信則下疑下慢而疑事不立矣敬事而信以身先之也易曰節以制度不傷財不害民蓋侈用則傷財傷財必至於害民故愛民必先於節用然使之不以其時則力本者不獲自盡雖有愛人之心而人不被其澤矣然此特論其所存而已未及爲政也苟無是心則雖有政不行焉○胡氏曰凡此數者又皆以敬爲主愚謂五者反復相因各有 }
      - { type: j, text: 次第讀者宜細推之子曰弟子入則孝出則弟謹而信汎愛衆而親仁行有餘力則以學文 }
      - { type: z, text: 弟子之弟上聲則弟之弟去聲○謹 }
      - { type: j, text: 者行之有常也信者言之有實也汎廣也衆謂衆人親近也仁謂仁者餘力猶言暇日以用也文謂詩書六藝之文程子曰爲弟子之職力有餘則學文不修其職而先文非爲己之學也尹氏曰德行本也文藝末也窮其本末知所先後可以入德矣洪氏曰未有餘力而學文則文滅其質有餘力而不學文則質勝而野愚謂力行而不學文則無以考聖賢之成法識事理之當然而所行或出於私意非但失之於野而已子夏曰賢賢易色事父母能竭其力事君能致其身與朋友交言而有信雖曰未學吾必謂之學矣 }
      - { type: z, text: 子夏孔子弟子姓卜名商賢人之賢而易其好色之心好善有誠也致猶委也委致其身謂不有其身也四者皆人倫之大者而行之必盡其誠學求如是而已故子夏言有能如是之人苟非生質之美必其務學之至雖或以爲未嘗爲學我必謂之已學也○游氏曰三代之學皆所以明人倫也能是四者則於人倫厚矣學之爲道何以加此子夏以文學名而其言如此則古人之所謂學者可知矣故學而一篇大抵皆在於務本○吳氏曰子夏之言其意善矣然詞氣之間 }
      - { type: j, text: 抑揚太過其流之弊將或至於廢學必若上章夫子之言然後為無弊也子曰君子不重則不威學則不固重厚重威威嚴固堅固也輕乎外者必不能堅乎内故不厚重則無威嚴而所學亦不堅固也主忠信人不忠信則事皆無實為惡則易為善則難故學者必以是為主焉程 }
      - { type: z, text: 子曰人道唯在忠信不誠則無物且 }
      - { type: j, text: 出入無時莫知其鄉者人心也若無 }
      - { type: z, text: 忠信豈復有物乎 }
      - { type: j, text: 無友不如己者無毋通禁止辭也友所以輔仁不如 }
      - { type: z, text: 己則無益而有損 }
      - { type: j, text: 過則勿憚改 }
      - { type: z, text: 勿亦禁止之辭憚畏難也自治不勇則惡日長故有過當速改不可畏難難而苟安也○程子曰學問之道無他也知其不善則速改以從善而已○程子曰君子自修之道當如是也○游氏曰君子之道以威重為質而學以成之學之道必以忠信為主而以勝己者輔之然或吝於改過則終無以入德而賢者亦未必樂告以善道故以過勿憚改終焉 }
      - { type: j, text: 曾子曰慎終追遠民德歸厚矣 }
      - { type: z, text: 謹終者喪盡其禮追遠者祭盡其誠民德歸厚謂下民化之其德亦歸於厚蓋終者人之所易忽也而能謹之遠者人之所易忘也而能追之厚之道也故以此自為則已之德厚下民化之則其德亦歸於厚也 }
      - { type: j, text: 子禽問於子貢曰夫子至於是邦也必聞其政求之與抑與之與 }
      - { type: z, text: 之與之與平聲下同○子禽姓陳名亢子貢姓端木名賜皆孔子弟子或曰亢子貢弟子未知孰是抑反語辭 }
      - { type: j, text: 子貢曰夫子温良恭儉讓以得之夫子之求之也其諸異乎人之求之與 }
      - { type: z, text: 温和厚也良易直也恭莊敬也儉節制也讓謙遜也五者夫子之盛德光輝接於人者也其諸語辭也人他人也言夫子未嘗求之但其德容如是故時君敬信自以其政就而問之耳非若他人必求之而後得也聖人過化存神之妙未易窺測然即此而觀則其德盛禮恭而不願乎外亦可見矣學者所當潛心而勉學也○謝氏曰學者觀於聖人威儀之間亦可以進德矣若子貢亦可謂善觀聖人矣亦可謂善言德行矣今去聖人千五百年以此五者想見其形容尚能使人興起而況於親炙之者乎張敬夫曰夫子至是邦必聞其政而未有能委國而授之以政者蓋見聖人之儀形而樂告之者秉彝好德之良心也而私欲害之是以終不能用耳 }
      - { type: j, text: 子曰父在觀其志父沒觀其行三年無改於父之道可謂孝矣 }
      - { type: z, text: 行去聲○父在子不得自專而志則可知父沒然後其行可見故觀此足以知其人之善惡然又必能三年無改於父之道乃見其孝不然則所行 }
      - { type: j, text: 雖善亦不得爲孝矣尹氏曰如其道雖終身無改可也如其非道何待三年然則三年無改者孝子之心有所不忍故也游氏曰三年無改亦 }
      - { type: z, text: 謂在所當改而可以未改者耳 }
      - { type: j, text: 有子曰禮之用和爲貴先王之道斯爲美小大由之 }
      - { type: z, text: 禮者天理之節文人事之儀則也和 }
      - { type: j, text: 者從容不迫之意蓋禮之爲體雖嚴而皆出於自然之理故其爲用必從容而不迫乃爲可貴先王之道此其所以爲美而小事大事無不由之也有所不行知和而和不以禮節之亦不可行也承上文而言如此而復有所不行者以其徒知和之爲貴而一於和不復 }
      - { type: z, text: 以禮節之則亦非復理之本然矣所以流蕩忘反而亦不可行也○程子曰禮勝則離故禮之用和為貴先王之道以斯為美而小大由之樂勝則流故有所不行者知和而和不以禮節之亦不可行○范氏曰凡禮之體主於敬而其用則以和為貴敬者禮之所以立也和者樂之所由生也若有子可謂達禮樂之本矣愚謂嚴而泰和而節此理之自然禮之全體也豪釐有差則失其中正而各倚於一偏其不可行均矣 }
      - { type: j, text: 有子曰信近於義言可復也恭近於禮遠恥辱也因不失其親亦可宗也 }
      - { type: z, text: 近遠皆去聲○信約信也義者事之宜也復踐言也恭致敬也禮節文也因猶依也宗猶主也言約信而合其冝則言必可踐矣致恭而中其節則能遠耻辱矣所依者不失其可親之人則亦可以宗而主之矣此言人之言行交際皆當謹之於始而慮其所終不然則因仍苟且之間將有不勝其自失之悔者矣 }
      - { type: j, text: 子曰君子食無求飽居無求安敏於事而愼於言就有道而正焉可謂好學也巳 }
      - { type: z, text: 好去聲○不求安飽者志有在而不暇及也敏於事者勉其所不足謹於言者不敢盡其所有餘也然猶不敢自是而必就有道之人以正其是非則可謂好學矣凡言道者皆謂事物當然之理人之所共由者也○尹氏曰君子之學能是四者可謂篤志力行者矣然不取正於有道未免有差如楊墨學仁義而差者也其流至於無父無君謂之好學可乎 }
      - { type: j, text: 子貢曰貧而無諂富而無驕何如子曰可也未若貧而樂富而好禮者也 }
      - { type: z, text: 樂音洛好去聲○諂卑屈也驕矜肆也常人溺於貧富之中而不知所以自守故必有二者之病無諂無驕則知自守矣而未能超乎貧富之外也凡曰可者僅可而有所未盡之辭也樂則心廣體胖而忘其貧好禮則安處善樂循理亦不自知其富矣子貢貨殖蓋先貧後富而嘗用力於自守者故以此爲問而夫子答之如此蓋許其所已能而勉其所未至也 }
      - { type: j, text: 子貢曰詩云如切如磋如琢如磨其斯之謂與 }
      - { type: z, text: 磋七多反與平聲○詩衛風淇澳之篇言治骨角者旣切之而復磋之治玉石者旣琢之而復磨之治之已精而益求其精也子貢自以無謟無驕 }
      - { type: j, text: 爲至矣聞夫子之言又知義理之無窮 }
      - { type: z, text: 雖有得焉而未可遽自足也故引是詩以明之 }
      - { type: j, text: 子曰賜也始可與言詩已矣告諸往而知來者往者其所已言者來者其所未言者 }
      - { type: z, text: 愚按此章問答其淺深高下固不待辨說而明矣然不切則磋無所施不琢則磨無所措故學者雖不可安於小成而不求造道之極致亦不可騖 }
      - { type: j, text: 於虛遠而不察切己之實病也子曰不患人之不己知患不知人也尹氏曰君子求在我者故不患人之 }
      - { type: z, text: 不己知不知人則是非邪正或不能辨故以為患也 }
  - id: pian2
    name: 為政第二
    blocks:
      - { type: z, text: 凡二十四章 }
      - { type: j, text: 子曰為政以德譬如北辰居其所而衆星共之 }
      - { type: z, text: 共音拱亦作拱○政之為言正也所以正人之不正也德之為言得也得於心而不失之謂也北辰北極天之樞也居其所不動也共向也言衆星四面旋繞而歸向之也為政以德則無為而天下歸之其象如此○程子曰為政以德然後無為○范氏曰為政以德則不動而化不言而信無爲而成所守者至簡而能御煩所處者 }
      - { type: j, text: 至靜而能制動所務者至寡而能服衆子曰詩三百一言以蔽之曰思無邪 }
      - { type: z, text: 詩三百十一篇言三百者舉大數也蔽猶蓋也思無邪魯頌駉篇之辭凡詩之言善者可以感發人之善心惡者可以懲創人之逸志其用歸於使人得其情性之正而已然其言微婉且或各因一事而發求其直指全體則未有若此之明且盡者故夫子言詩三百篇而惟此一言足以盡蓋其義其示人之意亦深切矣○程子曰思無邪者誠也○范氏曰學者必務知要知要則能守約守約則足以盡博矣經禮三百曲禮三千亦可以一言蔽之曰毋不敬 }
      - { type: j, text: 子曰道之以政齊之以刑民免而無耻 }
      - { type: z, text: 道音導下同○道猶引導謂先之也政謂法制禁令也齊所以一之也道之而不從者有刑以一之也免而無耻謂苟免刑罰而無所羞愧蓋雖不敢爲惡而爲惡之心未甞亡也 }
      - { type: j, text: 道之以德齊之以禮有耻且格 }
      - { type: z, text: 禮謂制度品節也格至也言躬行以率之則民固有所觀感而興起矣而其淺深厚薄之不一者又有禮以一之則民耻於不善而又有以至於善也一說格正也書曰格其非心○愚謂政者爲治之具刑者輔治之法德禮則所以出治之本而德又禮之本也此其相爲終始雖不可以偏廢然政刑能使民遠罪而已德禮之效則有以使民日遷善而不自知故治民者不可徒恃其末又當深探其本也 }
      - { type: j, text: 子曰吾十有五而志于學 }
      - { type: z, text: 古者十五而入大學心之所之謂之志此所謂學即大學之道也志乎此則念念在此而爲之不厭矣 }
      - { type: j, text: 三十而立 }
      - { type: z, text: 有以自立則守之固而無所事志矣 }
      - { type: j, text: 四十而不惑 }
      - { type: z, text: 於事物之所當然皆無所疑則知之明而無所事守矣 }
      - { type: j, text: 五十而知天命 }
      - { type: z, text: 天命即天道之流行而賦於物者乃事物所以當然之故也知此則知極其精而不惑又不足言矣 }
      - { type: j, text: 六十而耳順 }
      - { type: z, text: 聲入心通無所違逆知之之至不思而得也 }
      - { type: j, text: 七十而從心所欲不踰矩 }
      - { type: z, text: 從如字○從隨也矩法度之器所以爲方者也隨其心之所欲而自不過於法度安而行之不勉而中也○程子曰孔子生而知之也言亦由學而至所以勉進後人也立能自立於斯道也不惑則無所疑矣知天命窮理盡性也耳順所聞皆通也從心所欲不踰矩則不勉而中矣又曰孔子自言其進德之序如此者聖人未必然但爲學者立法使之盈科而後進成章而後達耳○胡氏曰聖人之教亦多術然其要使人不失其本心而已欲得此心者惟志乎聖人所示之學循其序而進焉至於一疵不存萬理明盡之後則其日用之間本心瑩然隨所意欲莫非至理蓋心即體欲即用體即道用即義聲爲律而身爲度矣又曰聖人言此一以示學者當優游涵泳不可躐等而進二以示學者當日就月將不可半途而廢也愚謂聖人生知安行固無積累之漸然其心未甞自謂已至此也是其日用之間必有獨覺其進而人不及知者故因其近似以自名欲學者以是爲則而自勉非心實自聖而姑爲是退託也後凡言謙詞之屬意皆放此 }
      - { type: j, text: 孟懿子問孝子曰無違 }
      - { type: z, text: 孟懿子魯大夫仲孫氏名何忌無違謂不背於理 }
      - { type: j, text: 樊遲御子告之曰孟孫問孝於我我對曰無違 }
      - { type: z, text: 樊遲孔子弟子名須御爲孔子御車也孟孫即仲孫也夫子以懿子未達而不能問恐其失指而以從親之令爲孝故語樊遲以發之 }
      - { type: j, text: 樊遲曰何謂也子曰生事之以禮死葬之以禮祭之以禮 }
      - { type: z, text: 生事葬祭事親之始終具矣禮即理之節文也人之事親自始至終一於禮而不苟其尊親也至矣是時三家僭禮故夫子以是警之然語意渾然又若不專爲三家發者所以爲聖人之言也○胡氏曰人之欲孝其親心雖無窮而分則有限得爲而不爲與不得爲而爲之均於不孝所謂以禮者爲其所得爲者而已矣 }
      - { type: j, text: 孟武伯問孝子曰父母惟其疾之憂 }
      - { type: z, text: 武伯懿子之子名彘言父母愛子之心無所不至惟恐其有疾病常以爲憂也人子體此而以父母之心爲心則凡所以守其身者自不容於不謹矣豈不可以爲孝乎舊說人子能使父母不以其陷於不義爲憂而獨以其疾爲憂乃可謂孝亦通 }
      - { type: j, text: 子游問孝子曰今之孝者是謂能養至於犬馬皆能有養不敬何以別乎 }
      - { type: z, text: 養去聲別彼列反○子游孔子弟子姓言名偃養謂飲食供奉也犬馬待人而食亦若養然言人畜犬馬皆能有以養之若能養其親而敬不至則與養犬馬者何異甚言不敬之罪所以深警之也○胡氏曰世俗事親能養足矣狎恩恃愛而不知其漸流於不敬則非小失也子游聖門髙弟未必至此聖人直恐其愛踰於敬故以是深警發之也 }
      - { type: j, text: 子夏問孝子曰色難有事弟子服其勞有酒食先生饌曽是以爲孝乎 }
      - { type: z, text: 食音嗣○色難謂事親之際惟色爲難也食飯也先生父兄也饌飲食之也曽猶甞也蓋孝子之有深愛者必有和氣有和氣者必有愉色有愉色者必有婉容故事親之際惟色爲難耳服勞奉養未足爲孝也舊說承順父母之色爲難亦通○程子曰告懿子告衆人者也對武伯者以其人多可憂之事子游能養而或失於敬子夏能直義而或少溫潤之色各因其 }
      - { type: j, text: 材之髙下與其所失而告之故不同也子曰吾與回言終日不違如愚退而省其私亦足以發回也不愚 }
      - { type: z, text: 回孔子弟子姓顔字子淵不違者意不相背有聽受而無問難也私謂燕居獨處非進見請問之時發謂發明所言之理愚聞之師曰顔子深潛淳粹其於聖人體叚巳具其聞夫子之言黙識心融觸處洞然自有條理故終日言但見其不違如愚人而巳及退省其私則見其日用動靜語黙之間皆足以發明夫子之道坦然由之而無疑然後知其不愚也 }
      - { type: j, text: 子曰視其所以 }
      - { type: z, text: 以爲也爲善者爲君子爲惡者爲小人 }
      - { type: j, text: 觀其所由 }
      - { type: z, text: 觀比視爲詳矣由從也事雖爲善而意之所從來者有未善焉則亦不得爲君子矣或曰由行也謂所以行其所爲者也 }
      - { type: j, text: 察其所安 }
      - { type: z, text: 察則又加詳矣安所樂也所由雖善而心所樂者不在於是則亦僞耳豈能乆而不變哉 }
      - { type: j, text: 人焉廋哉人焉廋哉 }
      - { type: z, text: 焉於虔反廋所留反○焉何也廋匿 }
      - { type: j, text: 也重言以深明之程子曰在己者能 }
      - { type: z, text: 知言窮理則能以此察人如聖人也 }
      - { type: j, text: 子曰温故而知新可以爲師矣 }
      - { type: z, text: 温尋繹也故者舊所聞新者今所得言學能時習舊聞而每有新得則所學在我而其應不窮故可以爲人師若夫記問之學則無得於心而所知有限故學記譏其不足以爲人師正與此意互相發也 }
      - { type: j, text: 子曰君子不器 }
      - { type: z, text: 器者各適其用而不能相通成德之士體無不具故用無不周非特爲一才一藝而已 }
      - { type: j, text: 子貢問君子子曰先行其言而後從之 }
      - { type: z, text: 周氏曰先行其言者行之於未言之前而後從之者言之於既行之後○范氏曰子貢之患非言之艱而行之艱故告之以此 }
      - { type: j, text: 子曰君子周而不比小人比而不周 }
      - { type: z, text: 周普徧也比偏黨也皆與人親厚之意但周公而比私耳○君子小人所爲不同如隂陽晝夜每每相反然究其所以分則在公私之際毫釐之差耳故聖人於周比和同驕泰之屬常對舉而互言之欲學者察乎兩間而審其取舎之幾也 }
      - { type: j, text: 子曰學而不思則罔思而不學則殆 }
      - { type: z, text: 不求諸心故昏而無得不習其事故危而不安○程子曰博學審問謹思明辨篤行五者廢其一非學也 }
      - { type: j, text: 子曰攻乎異端斯害也已 }
      - { type: z, text: 范氏曰攻專治也故治木石金玉之工曰攻異端非聖人之道而別爲一端如楊墨是也其率天下至於無父無君專治而欲精之爲害甚矣○程子曰佛氏之言比之楊墨尤爲近理所以其害爲尤甚學者當如淫聲美 }
      - { type: j, text: 色以遠之不爾則駸駸然入於其中矣子曰由誨女知之乎知之爲知之不知爲不知是知也 }
      - { type: z, text: 女音汝○由孔子弟子姓仲字子路子路好勇蓋有強其所不知以爲知者故夫子告之曰我教女以知之之道乎但所知者則以爲知所不知者則以爲不知如此則雖或不能盡知而無自欺之蔽亦不害其爲知矣况由此而求之又有可知之理乎 }
      - { type: j, text: 子張學干祿 }
      - { type: z, text: 子張孔子弟子姓顓孫名師干求也祿仕者之奉也 }
      - { type: j, text: 子曰多聞闕疑愼言其餘則寡尤多見闕殆慎行其餘則寡悔言寡尤行寡悔禄在其中矣 }
      - { type: z, text: 行寡之行去聲○吕氏曰疑者所未信殆者所未安○程子曰尤罪自外至者也悔理自内出者也愚謂多聞見者學之博闕疑殆者擇之精謹言行者守之約凡言在其中者皆不求而自至之辭言此以救子張之失而進之也○程子曰修天爵則人爵至君子言行能謹得禄之道也子張學干禄故告之以此使定其心而不爲利禄動若顔閔則無此問矣或疑如此亦有不得禄者孔子蓋曰耕也餒在其中惟理可爲者爲之而已矣 }
      - { type: j, text: 哀公問曰何爲則民服孔子對曰舉直錯諸枉則民服舉枉錯諸直則民不服 }
      - { type: z, text: 哀公魯君名蔣凡君問皆稱孔子對曰者尊君也錯捨置也諸衆也○程子曰舉錯得義則人心服○謝氏曰好直而惡枉天下之至情也順之則服逆之則去必然之理也然或無道以照之則以直爲枉以枉爲直者多矣是以君子大居敬而貴窮理也 }
      - { type: j, text: 季康子問使民敬忠以勸如之何子曰臨之以莊則敬孝慈則忠舉善而教不能則勸 }
      - { type: z, text: 季康子魯大夫季孫氏名肥莊謂容貌端嚴也臨民以莊則民敬於己孝於親慈於衆則民忠於己善者舉之而不能者教之則民有所勸而樂於爲善○張敬夫曰此皆在我所當爲非爲欲使民敬忠以勸而爲之也然能如是則其應蓋有不期而然者矣 }
      - { type: j, text: 或謂孔子曰子奚不爲政 }
      - { type: z, text: 定公初年孔子不仕故或人疑其不爲政也 }
      - { type: j, text: 子曰書云孝乎惟孝友于兄弟施於有政是亦爲政奚其爲爲政 }
      - { type: z, text: 書周書君陳篇書云孝乎者言書之言孝如此也善兄弟曰友書言君陳能孝於親友於兄弟又能推廣此心以爲一家之政孔子引之言如此則是亦爲政矣何必居位乃爲爲政乎蓋孔子之不仕有難以語或人者故託此以告之要之至理亦不外是 }
      - { type: j, text: 子曰人而無信不知其可也大車無輗小車無軏其何以行之哉 }
      - { type: z, text: 輗五兮反軏音月○大車謂平地任載之車輗轅端横木縛軛以駕牛者小車謂田車兵車乘車軌轅端上曲鉤衡以駕馬者車無此二者則不可以行人而無信亦猶是也 }
      - { type: j, text: 子張問十世可知也 }
      - { type: z, text: 陸氏曰也一作乎○王者易姓受命爲一世子張問自此以後十世之事可前知乎 }
      - { type: j, text: 子曰殷因於夏禮所損益可知也周因於殷禮所損益可知也其或繼周者雖百世可知也 }
      - { type: z, text: 馬氏曰所因謂三綱五常所損益謂文質三統愚按三綱謂君爲臣綱父爲子綱夫爲妻綱五常謂仁義禮智信文質謂夏尚忠商尚質周尚文三統謂夏正建寅爲人統商正建丑爲 }
      - { type: j, text: 地統周正建子為天統三綱五常禮之大體三代相繼皆因之而不能變其所損益不過文章制度小過不及之間而其已然之迹今皆可見則自今以往或有繼周而王者雖百世之遠所因所革亦不過此豈但十世而已乎聖人所以知來者蓋如此非若後世讖緯術數之學也胡氏曰子張之問蓋欲知來而聖人言其既往者以明之也夫自修身以至於為天下不可一日而無禮天叙天秩人所共由禮之本也商不能改乎夏周不能改乎商所謂天地之常經也若乃制度文為或太過則當損或不足則當益益之損之與時宜之而所因者不壞是古今之通義也因往推來雖 }
      - { type: z, text: 百世之遠不過如此而已矣 }
      - { type: j, text: 子曰非其鬼而祭之謟也 }
      - { type: z, text: 非其鬼謂非其所當祭之鬼謟求媚也 }
      - { type: j, text: 見義不爲無勇也 }
      - { type: z, text: 知而不爲是無勇也 }
      - { type: j, text: 論語卷第一 }
