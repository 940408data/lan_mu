labels:
  - page: 130
    col: 9
    role: j
    text: 孟子卷第四朱熹集注
  - page: 130
    col: 10
    role: title
    text: 公孫丑章句下
  - page: 130
    col: 11
    role: z
    text: 凡十四章自第二章以下記孟子出
  - page: 130
    col: 12
    role: z
    text: 處行實爲詳
  - page: 130
    col: 13
    role: j
    text: 孟子曰天時不如地利地利不如人和
  - page: 130
    col: 14
    role: z
    text: 天時謂時日支干孤虛王相之屬也
  - page: 130
    col: 15
    role: z
    text: 地利險阻城池之固也人和得民心
  - page: 130
    col: 16
    role: z
    text: 之和也
  - page: 131
    col: 1
    role: j
    text: 三里之城七里之郭環而攻之而不勝
  - page: 131
    col: 2
    role: j
    text: 夫環而攻之必有得天時者矣然而不
  - page: 131
    col: 3
    role: j
    text: 勝者是天時不如地利也
  - page: 131
    col: 4
    role: z
    text: 夫音扶○三里七里城郭之小者郭
  - page: 131
    col: 5
    role: z
    text: 外城環圍也言四靣攻圍曠日持乆
  - page: 131
    col: 6
    role: z
    text: 必有值天時之善者
  - page: 131
    col: 7
    role: j
    text: 城非不高也池非不深也兵革非不堅
  - page: 131
    col: 8
    role: j
    text: 利也米粟非不多也委而去之是地利
  - page: 131
    col: 9
    role: j
    text: 不如人和也
  - page: 131
    col: 10
    role: z
    text: 革甲也粟穀也委棄也言不得民心
  - page: 131
    col: 11
    role: z
    text: 民不爲守也
  - page: 131
    col: 12
    role: j
    text: 故曰域民不以封疆之界固國不以山
  - page: 131
    col: 13
    role: j
    text: 谿之險威天下不以兵革之利得道者
  - page: 131
    col: 14
    role: j
    text: 多助失道者寡助寡助之至親戚畔之
  - page: 131
    col: 15
    role: j
    text: 多助之至天下順之
  - page: 131
    col: 16
    role: z
    text: 域界限也
  - page: 132
    col: 1
    role: j
    text: 以天下之所順攻親戚之所畔故君子
  - page: 132
    col: 2
    role: j
    text: 有不戰戰必勝矣
  - page: 132
    col: 3
    role: z
    text: 言不戰則已戰則必勝○尹氏曰言
  - page: 132
    col: 4
    role: z
    text: 得天下者凡以得民心而已
  - page: 132
    col: 5
    role: j
    text: 孟子將朝王王使人來曰寡人如就見
  - page: 132
    col: 6
    role: j
    text: 者也有寒疾不可以風朝將視朝不識
  - page: 132
    col: 7
    role: j
    text: 可使寡人得見乎對曰不幸而有疾不
  - page: 132
    col: 8
    role: j
    text: 能造朝
  - page: 132
    col: 9
    role: z
    text: 章內朝並音潮唯朝將之朝如字造
  - page: 132
    col: 10
    role: z
    text: 七到反下同○王齊王也孟子本將
  - page: 132
    col: 11
    role: z
    text: 朝王王不知而託疾以召孟子故孟
  - page: 132
    col: 12
    role: z
    text: 子亦以疾辭也
  - page: 132
    col: 13
    role: j
    text: 明日出弔於東郭氏公孫丑曰昔者辭
  - page: 132
    col: 14
    role: j
    text: 以病今日弔或者不可乎曰昔者疾今
  - page: 132
    col: 15
    role: j
    text: 日愈如之何不弔
  - page: 132
    col: 16
    role: z
    text: 東郭氏齊大夫家也昔者昨日也或
  - page: 133
    col: 1
    role: z
    text: 者疑辭辭疾而出弔與孔子不見孺
  - page: 133
    col: 2
    role: z
    text: 悲取瑟而歌同意
  - page: 133
    col: 3
    role: j
    text: 王使人問疾醫來孟仲子對曰昔者有
  - page: 133
    col: 4
    role: j
    text: 王命有采薪之憂不能造朝今病小愈
  - page: 133
    col: 5
    role: j
    text: 趨造於朝我不識能至否乎使數人要
  - page: 133
    col: 6
    role: j
    text: 於路曰請必無歸而造於朝
  - page: 133
    col: 7
    role: z
    text: 要平聲○孟仲子趙氏以爲孟子之
  - page: 133
    col: 8
    role: z
    text: 從昆弟學於孟子者也采薪之憂言
  - page: 133
    col: 9
    role: z
    text: 病不能采薪謙辭也仲子權辭以對
  - page: 133
    col: 10
    role: z
    text: 又使人要孟子令勿歸而造朝以實
  - page: 133
    col: 11
    role: z
    text: 已言
  - page: 133
    col: 12
    role: j
    text: 不得已而之景丑氏宿焉景子曰内則
  - page: 133
    col: 13
    role: j
    text: 父子外則君臣人之大倫也父子主恩
  - page: 133
    col: 14
    role: j
    text: 君臣主敬丑見王之敬子也未見所以
  - page: 133
    col: 15
    role: j
    text: 敬王也曰惡是何言也齊人無以仁義
  - page: 133
    col: 16
    role: j
    text: 與王言者豈以仁義爲不美也其心曰
  - page: 134
    col: 1
    role: j
    text: 是何足與言仁義也云爾則不敬莫大
  - page: 134
    col: 2
    role: j
    text: 乎是我非堯舜之道不敢以陳於王前
  - page: 134
    col: 3
    role: j
    text: 故齊人莫如我敬王也
  - page: 134
    col: 4
    role: z
    text: 惡平聲下同○景丑氏齊大夫家也
  - page: 134
    col: 5
    role: z
    text: 景子景丑也惡歎辭也景丑所言敬
  - page: 134
    col: 6
    role: z
    text: 之小者也孟子所言敬之大者也
  - page: 134
    col: 7
    role: j
    text: 景子曰否非此之謂也禮曰父召無諾
  - page: 134
    col: 8
    role: j
    text: 君命召不俟駕固將朝也聞王命而遂
  - page: 134
    col: 9
    role: j
    text: 不果宜與夫禮若不相似然
  - page: 134
    col: 10
    role: z
    text: 夫音扶下同○禮曰父命呼唯而不
  - page: 134
    col: 11
    role: z
    text: 諾又曰君命召在官不俟屨在外不
  - page: 134
    col: 12
    role: z
    text: 俟車言孟子本欲朝王而聞命中止
  - page: 134
    col: 13
    role: z
    text: 似與此禮之意不同也
  - page: 134
    col: 14
    role: j
    text: 曰豈謂是與曾子曰晉楚之富不可及
  - page: 134
    col: 15
    role: j
    text: 也彼以其富我以吾仁彼以其爵我以
  - page: 134
    col: 16
    role: j
    text: 吾義吾何慊乎哉夫豈不義而曾子言
  - page: 135
    col: 1
    role: j
    text: 之是或一道也天下有達尊三爵一齒
  - page: 135
    col: 2
    role: j
    text: 一德一朝廷莫如爵鄉黨莫如齒輔世
  - page: 135
    col: 3
    role: j
    text: 長民莫如德惡得有其一以慢其二哉
  - page: 135
    col: 4
    role: z
    text: 與平聲慊口簟反長上聲○慊恨也
  - page: 135
    col: 5
    role: z
    text: 少也或作嗛字書以爲口衘物也然
  - page: 135
    col: 6
    role: z
    text: 則慊亦但爲心有所衘之義其爲快
  - page: 135
    col: 7
    role: z
    text: 爲足爲恨爲少則因其事而所衘有
  - page: 135
    col: 8
    role: z
    text: 不同耳孟子言我之意非如景子之
  - page: 135
    col: 9
    role: z
    text: 所言者因引曾子之言而云夫此豈
  - page: 135
    col: 10
    role: z
    text: 是不義而曾子肯以爲言是或別有
  - page: 135
    col: 11
    role: z
    text: 一種道理也達通也蓋通天下之所
  - page: 135
    col: 12
    role: z
    text: 尊有此三者曾子之說蓋以德言之
  - page: 135
    col: 13
    role: z
    text: 也今齊王但有爵耳安得以此慢於
  - page: 135
    col: 14
    role: z
    text: 齒德乎
  - page: 135
    col: 15
    role: j
    text: 故將大有爲之君必有所不召之臣欲
  - page: 135
    col: 16
    role: j
    text: 有謀焉則就之其尊德樂道不如是不
  - page: 136
    col: 1
    role: j
    text: 足與有爲也
  - page: 136
    col: 2
    role: j
    text: 樂音洛○大有爲之君大有作爲非
  - page: 136
    col: 3
    role: j
    text: 常之君也○程子曰古之人所以必
  - page: 136
    col: 4
    role: j
    text: 待人君致敬盡禮而後往者非欲自
  - page: 136
    col: 5
    role: z
    text: 爲尊大也爲是故耳
  - page: 136
    col: 6
    role: j
    text: 故湯之於伊尹學焉而後臣之故不勞
  - page: 136
    col: 7
    role: j
    text: 而王桓公之於管仲學焉而後臣之故
  - page: 136
    col: 8
    role: j
    text: 不勞而霸
  - page: 136
    col: 9
    role: z
    text: 先從受學師之也後以爲臣任之也
  - page: 136
    col: 10
    role: j
    text: 今天下地醜德齊莫能相尚無他好臣
  - page: 136
    col: 11
    role: j
    text: 其所教而不好臣其所受教
  - page: 136
    col: 12
    role: z
    text: 好去聲○醜類也尚過也所教謂聽
  - page: 136
    col: 13
    role: z
    text: 從於己可役使者也所受教謂己之
  - page: 136
    col: 14
    role: z
    text: 所從學者也
  - page: 136
    col: 15
    role: j
    text: 湯之於伊尹桓公之於管仲則不敢召
  - page: 136
    col: 16
    role: j
    text: 管仲且猶不可召而况不爲管仲者乎
  - page: 137
    col: 1
    role: j
    text: 不爲管仲孟子自謂也○范氏曰孟子
  - page: 137
    col: 2
    role: z
    text: 之於齊處賔師之位非當仕有官職
  - page: 137
    col: 3
    role: z
    text: 者故其言如此○此章見賔師不以
  - page: 137
    col: 4
    role: z
    text: 趨走承順爲恭而以責難陳善爲敬
  - page: 137
    col: 5
    role: z
    text: 人君不以崇高冨貴爲重而以貴德
  - page: 137
    col: 6
    role: z
    text: 尊士爲賢則上下交而德業成矣
  - page: 137
    col: 7
    role: j
    text: 陳臻問曰前日於齊王餽兼金一百而
  - page: 137
    col: 8
    role: j
    text: 不受於宋餽七十鎰而受於薛餽五十
  - page: 137
    col: 9
    role: j
    text: 鎰而受前日之不受是則今日之受非
  - page: 137
    col: 10
    role: j
    text: 也今日之受是則前日之不受非也夫
  - page: 137
    col: 11
    role: j
    text: 子必居一於此矣
  - page: 137
    col: 12
    role: z
    text: 陳臻孟子弟子兼金好金也其價兼
  - page: 137
    col: 13
    role: z
    text: 倍於常者一百百鎰也
  - page: 137
    col: 14
    role: j
    text: 孟子曰皆是也
  - page: 137
    col: 15
    role: z
    text: 皆適於義也
  - page: 137
    col: 16
    role: j
    text: 當在宋也予將有遠行行者必以贐辭
  - page: 138
    col: 1
    role: j
    text: 曰餽贐予何爲不受
  - page: 138
    col: 2
    role: z
    text: 贐徐刃反○贐送行者之禮也
  - page: 138
    col: 3
    role: j
    text: 當在薛也予有戒心辭曰聞戒故爲兵
  - page: 138
    col: 4
    role: j
    text: 餽之予何爲不受
  - page: 138
    col: 5
    role: z
    text: 爲兵之爲去聲○時人有欲害孟子
  - page: 138
    col: 6
    role: z
    text: 者孟子設兵以戒備之薛君以金餽
  - page: 138
    col: 7
    role: z
    text: 孟子爲兵備辭曰聞子之有戒心也
  - page: 138
    col: 8
    role: j
    text: 若於齊則未有處也無處而餽之是貨
  - page: 138
    col: 9
    role: j
    text: 之也焉有君子而可以貨取乎
  - page: 138
    col: 10
    role: z
    text: 焉於虔反○無遠行戒心之事是未
  - page: 138
    col: 11
    role: z
    text: 有所處也取猶致也○尹氏曰言君
  - page: 138
    col: 12
    role: z
    text: 子之辭受取予唯當於理而已
  - page: 138
    col: 13
    role: j
    text: 孟子之平陸謂其大夫曰子之持戟之
  - page: 138
    col: 14
    role: j
    text: 士一日而三失伍則去之否乎曰不待
  - page: 138
    col: 15
    role: j
    text: 三
  - page: 138
    col: 16
    role: z
    text: 去上聲○平陸齊下邑也大夫邑宰
  - page: 139
    col: 1
    role: z
    text: 也戟有枝兵也士戰士也伍行列也
  - page: 139
    col: 2
    role: z
    text: 去之殺之也
  - page: 139
    col: 3
    role: j
    text: 然則子之失伍也亦多矣凶年饑歲子
  - page: 139
    col: 4
    role: j
    text: 之民老羸轉於溝壑壯者散而之四方
  - page: 139
    col: 5
    role: j
    text: 者幾千人矣曰此非距心之所得爲也
  - page: 139
    col: 6
    role: z
    text: 幾上聲○子之失伍言其失職猶士
  - page: 139
    col: 7
    role: z
    text: 之失伍也距心大夫名對言此乃王
  - page: 139
    col: 8
    role: z
    text: 之大政使然非我所得專爲也
  - page: 139
    col: 9
    role: j
    text: 曰今有受人之牛羊而爲之牧之者則
  - page: 139
    col: 10
    role: j
    text: 必爲之求牧與芻矣求牧與芻而不得
  - page: 139
    col: 11
    role: j
    text: 則反諸其人乎抑亦立而視其死與曰
  - page: 139
    col: 12
    role: j
    text: 此則距心之罪也
  - page: 139
    col: 13
    role: z
    text: 爲去聲死與之與平聲○牧之養之
  - page: 139
    col: 14
    role: z
    text: 也牧牧地也芻草也孟子言若不得
  - page: 139
    col: 15
    role: z
    text: 自專何不致其事而去
  - page: 139
    col: 16
    role: j
    text: 他日見於王曰王之爲都者臣知五人
  - page: 140
    col: 1
    role: j
    text: 焉知其罪者惟孔距心爲王誦之王曰
  - page: 140
    col: 2
    role: j
    text: 此則寡人之罪也
  - page: 140
    col: 3
    role: z
    text: 見音現爲王之爲去聲○爲都治邑
  - page: 140
    col: 4
    role: z
    text: 也邑有先君之廟曰都孔大夫姓也
  - page: 140
    col: 5
    role: z
    text: 爲王誦其語欲以風曉王也○陳氏
  - page: 140
    col: 6
    role: z
    text: 曰孟子一言而齊之君臣舉知其罪
  - page: 140
    col: 7
    role: z
    text: 固足以興邦矣然而齊卒不得爲善
  - page: 140
    col: 8
    role: z
    text: 國者豈非說而不繹從而不改故耶
  - page: 140
    col: 9
    role: j
    text: 孟子謂蚳鼃曰子之辭靈丘而請士師
  - page: 140
    col: 10
    role: j
    text: 似也爲其可以言也今旣數月矣未可
  - page: 140
    col: 11
    role: j
    text: 以言與
  - page: 140
    col: 12
    role: z
    text: 蚳音遲鼃烏花反爲去聲與平聲○
  - page: 140
    col: 13
    role: z
    text: 蚳鼃齊大夫也靈丘齊下邑似也言
  - page: 140
    col: 14
    role: z
    text: 所爲近似有理可以言謂士師近王
  - page: 140
    col: 15
    role: z
    text: 得以諌刑罰之不中者
  - page: 140
    col: 16
    role: j
    text: 蚳鼃諌於王而不用致爲臣而去
  - page: 141
    col: 1
    role: z
    text: 致猶還也
  - page: 141
    col: 2
    role: j
    text: 齊人曰所以爲蚳鼃則善矣所以自爲
  - page: 141
    col: 3
    role: j
    text: 則吾不知也
  - page: 141
    col: 4
    role: z
    text: 爲去聲○譏孟子道不行而不能去
  - page: 141
    col: 5
    role: z
    text: 也
  - page: 141
    col: 6
    role: j
    text: 公都子以告
  - page: 141
    col: 7
    role: z
    text: 公都子孟子弟子也
  - page: 141
    col: 8
    role: j
    text: 曰吾聞之也有官守者不得其職則去
  - page: 141
    col: 9
    role: j
    text: 有言責者不得其言則去我無官守我
  - page: 141
    col: 10
    role: j
    text: 無言責也則吾進退豈不綽綽然有餘
  - page: 141
    col: 11
    role: j
    text: 裕哉
  - page: 141
    col: 12
    role: z
    text: 官守以官爲守者言責以言爲責者
  - page: 141
    col: 13
    role: z
    text: 綽綽寛貌裕寛意也孟子居賔師之
  - page: 141
    col: 14
    role: z
    text: 位未甞受禄故其進退之際寛裕如
  - page: 141
    col: 15
    role: z
    text: 此○丑氏曰進退乆速當於理而巳
  - page: 141
    col: 16
    role: j
    text: 孟子爲卿於齊出弔於滕王使蓋大夫
  - page: 142
    col: 1
    role: j
    text: 王驩爲輔行王驩朝暮見反齊滕之路
  - page: 142
    col: 2
    role: j
    text: 未嘗與之言行事也
  - page: 142
    col: 3
    role: z
    text: 蓋古蓋反見音現○蓋齊下邑也王
  - page: 142
    col: 4
    role: z
    text: 驩王嬖臣也輔行副使也反往而還
  - page: 142
    col: 5
    role: z
    text: 也行事使事也
  - page: 142
    col: 6
    role: j
    text: 公孫丑曰齊卿之位不爲小矣齊滕之
  - page: 142
    col: 7
    role: j
    text: 路不爲近矣反之而未嘗與言行事何
  - page: 142
    col: 8
    role: j
    text: 也曰夫旣或治之予何言哉
  - page: 142
    col: 9
    role: z
    text: 夫音扶○王驩蓋攝卿以行故曰齊
  - page: 142
    col: 10
    role: z
    text: 卿夫旣或治之言有司巳治之矣孟
  - page: 142
    col: 11
    role: z
    text: 子之待小人不惡而嚴如此
  - page: 142
    col: 12
    role: j
    text: 孟子自齊葬於魯反於齊止於嬴充虞
  - page: 142
    col: 13
    role: j
    text: 請曰前日不知虞之不肖使虞敦匠事
  - page: 142
    col: 14
    role: j
    text: 嚴虞不敢請今願竊有請也木若以美
  - page: 142
    col: 15
    role: j
    text: 然
  - page: 142
    col: 16
    role: z
    text: 孟子仕於齊喪母歸葬於魯嬴齊南
  - page: 143
    col: 1
    role: z
    text: 且充虞孟子弟子董治作棺之事
  - page: 143
    col: 2
    role: z
    text: 者也嚴急也木棺木也以已通以美
  - page: 143
    col: 3
    role: z
    text: 太美也
  - page: 143
    col: 4
    role: j
    text: 曰古者棺槨無度中古棺七寸槨稱之
  - page: 143
    col: 5
    role: j
    text: 自天子達於庶人非直爲觀美也然後
  - page: 143
    col: 6
    role: j
    text: 盡於人心
  - page: 143
    col: 7
    role: z
    text: 稱去聲○度厚薄尺寸也中古周公
  - page: 143
    col: 8
    role: z
    text: 制禮時也槨稱之與棺相稱也欲其
  - page: 143
    col: 9
    role: z
    text: 堅厚久遠非特爲人觀視之美而已
  - page: 143
    col: 10
    role: j
    text: 不得不可以爲悅無財不可以爲悅得
  - page: 143
    col: 11
    role: j
    text: 之爲有財古之人皆用之吾何爲獨不
  - page: 143
    col: 12
    role: j
    text: 然
  - page: 143
    col: 13
    role: z
    text: 不得謂法制所不當得得之爲有財
  - page: 143
    col: 14
    role: z
    text: 言得之而又爲有財也或曰爲當作
  - page: 143
    col: 15
    role: z
    text: 而
  - page: 143
    col: 16
    role: j
    text: 且比化者無使土親膚於人心獨無校
  - page: 144
    col: 1
    role: j
    text: 乎
  - page: 144
    col: 2
    role: j
    text: 比必二反校音效○比猶爲也化者
  - page: 144
    col: 3
    role: j
    text: 死者也校快也言爲死者不使土近
  - page: 144
    col: 4
    role: j
    text: 其肌膚於人子之心豈不快然無所
  - page: 144
    col: 5
    role: z
    text: 恨乎
  - page: 144
    col: 6
    role: j
    text: 吾聞之君子不以天下儉其親
  - page: 144
    col: 7
    role: z
    text: 送終之禮所當得爲而不自盡是爲
  - page: 144
    col: 8
    role: z
    text: 天下愛惜此物而薄於吾親也
  - page: 144
    col: 9
    role: j
    text: 沈同以其私問曰燕可伐與孟子曰可
  - page: 144
    col: 10
    role: j
    text: 子噲不得與人燕子之不得受燕於子
  - page: 144
    col: 11
    role: j
    text: 噲有仕於此而子悅之不告於王而私
  - page: 144
    col: 12
    role: j
    text: 與之吾子之禄爵夫士也亦無王命而
  - page: 144
    col: 13
    role: j
    text: 私受之於子則可乎何以異於是
  - page: 144
    col: 14
    role: j
    text: 伐與之與平聲下伐與殺與同夫音
  - page: 144
    col: 15
    role: j
    text: 扶○沈同齊臣以私問非王命也○子
  - page: 144
    col: 16
    role: z
    text: 噲子之事見前篇諸侯土地人民受
  - page: 145
    col: 1
    role: z
    text: 之天子傳之先君私以與人則與者
  - page: 145
    col: 2
    role: z
    text: 受者皆有罪也仕為官也士即從仕
  - page: 145
    col: 3
    role: z
    text: 之人也
  - page: 145
    col: 4
    role: j
    text: 齊人伐燕或問曰勸齊伐燕有諸曰未
  - page: 145
    col: 5
    role: j
    text: 也沈同問燕可伐與吾應之曰可彼然
  - page: 145
    col: 6
    role: j
    text: 而伐之也彼如曰孰可以伐之則將應
  - page: 145
    col: 7
    role: j
    text: 之曰為天吏則可以伐之今有殺人者
  - page: 145
    col: 8
    role: j
    text: 或問之曰人可殺與則將應之曰可彼
  - page: 145
    col: 9
    role: j
    text: 如曰孰可以殺之則將應之曰為士師
  - page: 145
    col: 10
    role: j
    text: 則可以殺之今以燕伐燕何為勸之哉
  - page: 145
    col: 11
    role: z
    text: 天吏解見上篇言齊無道與燕無異
  - page: 145
    col: 12
    role: z
    text: 如以燕伐燕也史記亦謂孟子勸齊
  - page: 145
    col: 13
    role: z
    text: 伐燕蓋傳聞此說之誤○楊氏曰燕
  - page: 145
    col: 14
    role: z
    text: 固可伐矣故孟子曰可使齊王能誅
  - page: 145
    col: 15
    role: z
    text: 其君弔其民何不可之有乃殺其父
  - page: 145
    col: 16
    role: z
    text: 兄虜其子弟而後燕人畔之乃以是
  - page: 146
    col: 1
    role: z
    text: 歸咎孟子之言則誤矣
  - page: 146
    col: 2
    role: j
    text: 燕人畔王曰吾甚慙於孟子
  - page: 146
    col: 3
    role: z
    text: 齊破燕後二年燕人共立太子平為
  - page: 146
    col: 4
    role: z
    text: 王
  - page: 146
    col: 5
    role: j
    text: 陳賈曰王無患焉王自以為與周公孰
  - page: 146
    col: 6
    role: j
    text: 仁且智王曰惡是何言也曰周公使管
  - page: 146
    col: 7
    role: j
    text: 叔監殷管叔以殷畔知而使之是不仁
  - page: 146
    col: 8
    role: j
    text: 也不知而使之是不智也仁智周公未
  - page: 146
    col: 9
    role: j
    text: 之盡也而況於王乎賈請見而解之
  - page: 146
    col: 10
    role: z
    text: 惡監皆平聲○陳賈齊大夫也管叔
  - page: 146
    col: 11
    role: z
    text: 名鮮武王弟周公兄也武王勝商殺
  - page: 146
    col: 12
    role: z
    text: 紂立紂子武庚而使管叔與弟蔡叔
  - page: 146
    col: 13
    role: z
    text: 霍叔監其國武王崩成王㓜周公攝
  - page: 146
    col: 14
    role: z
    text: 政管叔與武庚畔周公討而誅之
  - page: 146
    col: 15
    role: j
    text: 見孟子問曰周公何人也曰古聖人也
  - page: 146
    col: 16
    role: j
    text: 曰使管叔監殷管叔以殷畔也有諸曰
  - page: 147
    col: 1
    role: j
    text: 然曰周公知其將畔而使之與曰不知
  - page: 147
    col: 2
    role: j
    text: 也然則聖人且有過與曰周公弟也管
  - page: 147
    col: 3
    role: j
    text: 叔兄也周公之過不亦宜乎
  - page: 147
    col: 4
    role: z
    text: 與平聲○言周公乃管叔之弟管叔
  - page: 147
    col: 5
    role: z
    text: 乃周公之兄然則周公不知管叔之
  - page: 147
    col: 6
    role: z
    text: 將畔而使之其過有所不免矣或曰
  - page: 147
    col: 7
    role: z
    text: 周公之處管叔不如舜之處象何也
  - page: 147
    col: 8
    role: z
    text: 游氏曰象之惡已著而其志不過富
  - page: 147
    col: 9
    role: z
    text: 貴而已故舜得以是而全之若管叔
  - page: 147
    col: 10
    role: z
    text: 之惡則未著而其志其才皆非象比
  - page: 147
    col: 11
    role: z
    text: 也周公詎忍逆探其兄之惡而棄之
  - page: 147
    col: 12
    role: z
    text: 耶周公愛兄宜無不盡者管叔之事
  - page: 147
    col: 13
    role: z
    text: 聖人之不幸也舜誠信而喜象周公
  - page: 147
    col: 14
    role: z
    text: 誠信而任管叔此天理人倫之至其
  - page: 147
    col: 15
    role: z
    text: 用心一也
  - page: 147
    col: 16
    role: j
    text: 且古之君子過則改之今之君子過則
  - page: 148
    col: 1
    role: j
    text: 順之古之君子其過也如日月之食民
  - page: 148
    col: 2
    role: j
    text: 皆見之及其更也民皆仰之今之君子
  - page: 148
    col: 3
    role: j
    text: 豈徒順之又從爲之辭
  - page: 148
    col: 4
    role: z
    text: 更平聲○順猶遂也更改也辭辯也
  - page: 148
    col: 5
    role: z
    text: 更之則無損於明故民仰之順而爲
  - page: 148
    col: 6
    role: z
    text: 之辭則其過愈深矣責賈不能勉其
  - page: 148
    col: 7
    role: z
    text: 君以遷善改過而教之以遂非文過
  - page: 148
    col: 8
    role: z
    text: 也○林氏曰齊王慙於孟子蓋羞惡
  - page: 148
    col: 9
    role: z
    text: 之心有不能自已者使其臣有能因
  - page: 148
    col: 10
    role: z
    text: 是心而將順之則義不可勝用矣而
  - page: 148
    col: 11
    role: z
    text: 陳賈鄙夫方且爲之曲爲辯說而沮
  - page: 148
    col: 12
    role: z
    text: 其遷善改過之心長其飾非拒諫之
  - page: 148
    col: 13
    role: z
    text: 惡故孟子深責之然此書記事散出
  - page: 148
    col: 14
    role: z
    text: 而無先後之次故其說必參考而後
  - page: 148
    col: 15
    role: z
    text: 通若以第二篇十章十一章置於前
  - page: 148
    col: 16
    role: z
    text: 章之後此章之前則孟子之意不待
  - page: 149
    col: 1
    role: z
    text: 論說而自明矣
  - page: 149
    col: 2
    role: j
    text: 孟子致爲臣而歸
  - page: 149
    col: 3
    role: z
    text: 孟子乆於齊而道不行故歸也
  - page: 149
    col: 4
    role: j
    text: 王就見孟子曰前日願見而不可得得
  - page: 149
    col: 5
    role: j
    text: 侍同朝甚喜今又棄寡人而歸不識可
  - page: 149
    col: 6
    role: j
    text: 以繼此而得見乎對曰不敢請耳固所
  - page: 149
    col: 7
    role: j
    text: 願也
  - page: 149
    col: 8
    role: z
    text: 朝音潮
  - page: 149
    col: 9
    role: j
    text: 他日王謂時子曰我欲中國而授孟子
  - page: 149
    col: 10
    role: j
    text: 室養弟子以萬鍾使諸大夫國人皆有
  - page: 149
    col: 11
    role: j
    text: 所矜式子盍爲我言之
  - page: 149
    col: 12
    role: z
    text: 爲去聲○時子齊臣也中國當國之
  - page: 149
    col: 13
    role: z
    text: 中也萬鍾穀祿之數也鍾量名受六
  - page: 149
    col: 14
    role: z
    text: 斛四斗矜敬也式法也盍何不也
  - page: 149
    col: 15
    role: j
    text: 時子因陳子而以告孟子陳子以時子
  - page: 149
    col: 16
    role: j
    text: 之言告孟子
  - page: 150
    col: 1
    role: z
    text: 陳子卽陳臻也
  - page: 150
    col: 2
    role: j
    text: 孟子曰然夫時子惡知其不可也如使
  - page: 150
    col: 3
    role: j
    text: 予欲富辭十萬而受萬是爲欲富乎
  - page: 150
    col: 4
    role: z
    text: 夫音扶惡平聲○孟子旣以道不行
  - page: 150
    col: 5
    role: z
    text: 而去則其義不可以復留而時子不
  - page: 150
    col: 6
    role: z
    text: 知則又有難顯言者故但言設使我
  - page: 150
    col: 7
    role: z
    text: 欲富則我前日爲卿嘗辭十萬之祿
  - page: 150
    col: 8
    role: z
    text: 今乃受此萬鍾之饋是我雖欲富亦
  - page: 150
    col: 9
    role: z
    text: 不爲此也
  - page: 150
    col: 10
    role: j
    text: 季孫曰異哉子叔疑使己爲政不用則
  - page: 150
    col: 11
    role: j
    text: 亦已矣又使其子弟爲卿人亦孰不欲
  - page: 150
    col: 12
    role: j
    text: 富貴而獨於富貴之中有私龍斷焉
  - page: 150
    col: 13
    role: z
    text: 龍音壟○此孟子引季孫之語也季
  - page: 150
    col: 14
    role: z
    text: 孫子叔疑不知何時人龍斷罔壟之
  - page: 150
    col: 15
    role: z
    text: 斷而高也義見下文蓋子叔疑者嘗
  - page: 150
    col: 16
    role: z
    text: 不用而使其子弟爲卿季孫譏其旣
  - page: 151
    col: 1
    role: z
    text: 不得於此而又欲求得於彼如下文
  - page: 151
    col: 2
    role: z
    text: 賤丈夫登龍斷者之所爲也孟子引
  - page: 151
    col: 3
    role: z
    text: 此以明道既不行復受其祿則無以
  - page: 151
    col: 4
    role: z
    text: 異此矣
  - page: 151
    col: 5
    role: j
    text: 古之爲市者以其所有易其所無者有
  - page: 151
    col: 6
    role: j
    text: 司者治之耳有賤丈夫焉必求龍斷而
  - page: 151
    col: 7
    role: j
    text: 登之以左右望而罔市利人皆以爲賤
  - page: 151
    col: 8
    role: j
    text: 故從而征之征商自此賤丈夫始矣
  - page: 151
    col: 9
    role: z
    text: 孟子釋龍斷之說如此治之謂治其
  - page: 151
    col: 10
    role: z
    text: 爭訟左右望者欲得此而又取彼也
  - page: 151
    col: 11
    role: z
    text: 罔謂罔羅取之也從而征之謂人惡
  - page: 151
    col: 12
    role: z
    text: 其專利故就征其稅後世緣此遂征
  - page: 151
    col: 13
    role: z
    text: 商人也○程子曰齊王所以處孟子
  - page: 151
    col: 14
    role: z
    text: 者未爲不可孟子亦非不肯爲國人
  - page: 151
    col: 15
    role: z
    text: 矜式者但齊王實非欲尊孟子乃欲
  - page: 151
    col: 16
    role: z
    text: 以利誘之故孟子拒而不受
  - page: 152
    col: 1
    role: j
    text: 孟子去齊宿於晝
  - page: 152
    col: 2
    role: z
    text: 畫如字或曰當作畫音獲下同○畫
  - page: 152
    col: 3
    role: z
    text: 齊西南近邑也
  - page: 152
    col: 4
    role: j
    text: 有欲爲王留行者坐而言不應隱几而
  - page: 152
    col: 5
    role: j
    text: 卧
  - page: 152
    col: 6
    role: z
    text: 爲去聲下同隱於靳反○隱憑也客
  - page: 152
    col: 7
    role: z
    text: 坐而言孟子不應而卧也
  - page: 152
    col: 8
    role: j
    text: 客不悅曰弟子齊宿而後敢言夫子卧
  - page: 152
    col: 9
    role: j
    text: 而不聽請勿復敢見矣曰坐我明語子
  - page: 152
    col: 10
    role: j
    text: 昔者魯繆公無人乎子思之側則不能
  - page: 152
    col: 11
    role: j
    text: 安子思泄柳申詳無人乎繆公之側則
  - page: 152
    col: 12
    role: j
    text: 不能安其身
  - page: 152
    col: 13
    role: z
    text: 齊側皆反復扶又反語云聲○齊宿
  - page: 152
    col: 14
    role: z
    text: 齊戒越宿也繆公尊禮子思常使人
  - page: 152
    col: 15
    role: z
    text: 候伺道達誠意於其側乃能安而留
  - page: 152
    col: 16
    role: z
    text: 之也泄柳魯人申詳子張之子也繆
  - page: 153
    col: 1
    role: z
    text: 公尊之不如子思然二子義不苟容
  - page: 153
    col: 2
    role: z
    text: 非有賢者在其君之左右維持調護
  - page: 153
    col: 3
    role: z
    text: 之則亦不能安其身矣
  - page: 153
    col: 4
    role: j
    text: 子爲長者慮而不及子思子絕長者乎
  - page: 153
    col: 5
    role: j
    text: 長者絕子乎
  - page: 153
    col: 6
    role: z
    text: 長上聲○長者孟子自稱也言齊王
  - page: 153
    col: 7
    role: z
    text: 不使子來而子自欲爲王留我是所
  - page: 153
    col: 8
    role: z
    text: 以爲我謀者不及繆公留子思之事
  - page: 153
    col: 9
    role: z
    text: 而先絕我也我之臥而不應豈爲先
  - page: 153
    col: 10
    role: z
    text: 絕子乎
  - page: 153
    col: 11
    role: j
    text: 孟子去齊尹士語人曰不識王之不可
  - page: 153
    col: 12
    role: j
    text: 以爲湯武則是不明也識其不可然且
  - page: 153
    col: 13
    role: j
    text: 至則是干澤也千里而見王不遇故去
  - page: 153
    col: 14
    role: j
    text: 三宿而後出晝是何濡滯也士則茲不
  - page: 153
    col: 15
    role: j
    text: 悅
  - page: 153
    col: 16
    role: z
    text: 語去聲○尹士齊人也干求也澤恩
  - page: 154
    col: 1
    role: z
    text: 澤也濡滯遲留也
  - page: 154
    col: 2
    role: j
    text: 高子以告
  - page: 154
    col: 3
    role: z
    text: 高子亦齊人孟子弟子也
  - page: 154
    col: 4
    role: j
    text: 曰夫尹士惡知予哉千里而見王是予
  - page: 154
    col: 5
    role: j
    text: 所欲也不遇故去豈予所欲哉予不得
  - page: 154
    col: 6
    role: j
    text: 巳也
  - page: 154
    col: 7
    role: z
    text: 夫音扶下同惡平聲○見王欲以行
  - page: 154
    col: 8
    role: z
    text: 道也今道不行故不得巳而去非本
  - page: 154
    col: 9
    role: z
    text: 欲如此也
  - page: 154
    col: 10
    role: j
    text: 予三宿而出晝於予心猶以為速王
  - page: 154
    col: 11
    role: j
    text: 庶幾改之王如改諸則必反予
  - page: 154
    col: 12
    role: z
    text: 所改必指一事而言然今不可考矣
  - page: 154
    col: 13
    role: j
    text: 夫出晝而王不予追也予然後浩然有
  - page: 154
    col: 14
    role: j
    text: 歸志予雖然豈舍王哉王由足用為善
  - page: 154
    col: 15
    role: j
    text: 王如用予則豈徒齊民安天下之民舉
  - page: 154
    col: 16
    role: j
    text: 安王庶幾改之予日望之
  - page: 155
    col: 1
    role: j
    text: 浩然如水之流不可止也○楊氏曰齊
  - page: 155
    col: 2
    role: j
    text: 王天資朴實如好勇好貨好色好世
  - page: 155
    col: 3
    role: j
    text: 俗之樂皆以直告而不隱於孟子故
  - page: 155
    col: 4
    role: j
    text: 足以爲善若乃其心不然而謬爲大
  - page: 155
    col: 5
    role: j
    text: 言以欺人是人終不可與入堯舜之
  - page: 155
    col: 6
    role: z
    text: 道矣何善之能爲
  - page: 155
    col: 7
    role: j
    text: 予豈若是小丈夫然哉諫於其君而不
  - page: 155
    col: 8
    role: j
    text: 受則怒悻悻然見於其面去則窮日之
  - page: 155
    col: 9
    role: j
    text: 力而後宿哉
  - page: 155
    col: 10
    role: z
    text: 悻行頂反見音現○悻悻怒意也窮
  - page: 155
    col: 11
    role: z
    text: 盡也
  - page: 155
    col: 12
    role: j
    text: 尹士聞之曰士誠小人也
  - page: 155
    col: 13
    role: z
    text: 此章見聖賢行道濟時汲汲之本心
  - page: 155
    col: 14
    role: z
    text: 愛君澤民惓惓之餘意李氏曰於此
  - page: 155
    col: 15
    role: z
    text: 見君子憂則違之之情而荷蕢者所
  - page: 155
    col: 16
    role: z
    text: 以爲果也
  - page: 156
    col: 1
    role: j
    text: 孟子去齊充虞路問曰夫子若有不豫
  - page: 156
    col: 2
    role: j
    text: 色然前日虞聞諸夫子曰君子不怨天
  - page: 156
    col: 3
    role: j
    text: 不尤人
  - page: 156
    col: 4
    role: z
    text: 路問於路中間也豫悅也尤過也此
  - page: 156
    col: 5
    role: z
    text: 二句實孔子之言蓋孟子甞稱之以
  - page: 156
    col: 6
    role: z
    text: 教人耳
  - page: 156
    col: 7
    role: j
    text: 曰彼一時此一時也
  - page: 156
    col: 8
    role: z
    text: 彼前日此今日
  - page: 156
    col: 9
    role: j
    text: 五百年必有王者興其間必有名丗者
  - page: 156
    col: 10
    role: z
    text: 自堯舜至湯自湯至文武皆五百餘
  - page: 156
    col: 11
    role: z
    text: 年而聖人出名丗謂其人德業聞望
  - page: 156
    col: 12
    role: z
    text: 可名於一丗者為之輔佐若臯陶稷
  - page: 156
    col: 13
    role: z
    text: 契伊尹萊朱太公望散冝生之屬
  - page: 156
    col: 14
    role: j
    text: 由周而來七百有餘歳矣以其數則過
  - page: 156
    col: 15
    role: j
    text: 矣以其時考之則可矣
  - page: 156
    col: 16
    role: z
    text: 周謂文武之間數謂五百年之期時
  - page: 157
    col: 1
    role: z
    text: 謂亂極思治可以有為之日於是而
  - page: 157
    col: 2
    role: z
    text: 不得一有所為此孟子所以不能無
  - page: 157
    col: 3
    role: z
    text: 不豫也
  - page: 157
    col: 4
    role: j
    text: 夫天未欲平治天下也如欲平治天下
  - page: 157
    col: 5
    role: j
    text: 當今之世捨我其誰也吾何為不豫哉
  - page: 157
    col: 6
    role: z
    text: 夫音扶捨上聲○言當此之時而使
  - page: 157
    col: 7
    role: z
    text: 我不遇於齊是天未欲平治天下也
  - page: 157
    col: 8
    role: z
    text: 然天意未可知而其具又在我我何
  - page: 157
    col: 9
    role: z
    text: 為不豫哉然則孟子雖若有不豫然
  - page: 157
    col: 10
    role: z
    text: 者而實未甞不豫也蓋聖賢憂世之
  - page: 157
    col: 11
    role: z
    text: 志樂天之誠有並行而不悖者於此
  - page: 157
    col: 12
    role: z
    text: 見矣
  - page: 157
    col: 13
    role: j
    text: 孟子去齊居休公孫丑問曰仕而不受
  - page: 157
    col: 14
    role: j
    text: 禄古之道乎
  - page: 157
    col: 15
    role: z
    text: 休地名
  - page: 157
    col: 16
    role: j
    text: 曰非也於崇吾得見王退而有去志不
  - page: 158
    col: 1
    role: j
    text: 欲變故不受也
  - page: 158
    col: 2
    role: j
    text: 崇亦地名孟子始見齊王必有所不
  - page: 158
    col: 3
    role: z
    text: 合故有去志變謂變其去志
  - page: 158
    col: 4
    role: j
    text: 繼而有師命不可以請乆於齊非我志
  - page: 158
    col: 5
    role: j
    text: 也
  - page: 158
    col: 6
    role: z
    text: 師命師旅之命也國旣被兵難請去
  - page: 158
    col: 7
    role: z
    text: 也○孔氏曰仕而受祿禮也不受齊
  - page: 158
    col: 8
    role: z
    text: 祿義也義之所在禮有時而變公孫
  - page: 158
    col: 9
    role: z
    text: 丑欲以一端裁之不亦誤乎
  - page: 158
    col: 15
    role: j
    text: 孟子卷第四
