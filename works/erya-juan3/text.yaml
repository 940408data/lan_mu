# 爾雅注疏卷3（邢昺疏）：j 為經文＋晉郭璞注，z 為疏文。
sections:
  - id: juan3
    name: 正文
    blocks:
      - { type: j, text: "初、哉、首、基、祖、元、胎、俶、落、权舆，始也。（《尚书》曰：\"三月哉生魄。\"《诗》曰：\"令终有俶。\"又曰：\"俶载南亩。\"又曰：\"访予落止。\"又曰：\"胡不承权舆。\"胚胎未成，亦物之始也。其馀皆义之常行者。耳此所以释古今之异言，通方俗之殊语。○肇，音兆。俶，昌叔）" }
      - { type: z, text: "\"初哉\"至\"始也\"。○释曰：皆初始之异名也。初者，《说文》云：从衣从刀，裁衣之始也。哉者，古文作才，《说文》云：\"才，草木之初也。\"以声近借为哉始之哉。首者，头也，首之始也。基者，《说文》云：\"墙始筑也。\"肇者，说文作，始开也。祖者，宗庙之始也。元者，善之长也。长即始义。胎者，人成形之始也。俶者，动作之始也。落者，木叶陨坠之始也。权舆者，天地之始也。天圆而地方，因名云。此皆造字之本意也。及乎《诗》、《书》雅记所载之言，则不必尽取此理，但事之初始，俱得言焉。他皆仿此。○注\"《尚书》\"至\"殊语\"。○释曰：云\"《尚书》曰：\"三月哉生魄\"者，《康诰》文。云\"《诗》曰：令终有俶\"者，《大雅•既醉》文。\"又曰：俶载南亩\"者，《周颂•载芟》文。\"又曰：访予落止\"者，《周颂•访落》文。\"又曰：胡不承权舆\"者，《秦风•权舆》文。云\"胚胎未成，亦物之始也\"者，《说文》云：\"胚，妇孕一月也。胎，妇孕三月也。\"然则尚未成形而为形之始，故曰\"胚胎未成，亦物之始\"，物则形也。云\"其馀皆义之常者耳\"者，谓、初、首、基、祖、元也，通见《诗》、《书》，故曰\"义之常行\"。云\"此所以释古今之异言，通方俗之殊语\"者，杨雄说《方言》云：\"皆古今语也，初别国不相往来之言也，今或同。\"而旧书雅记、故俗语，不失其方，而後人不知，故为之作释也。郭彼注云\"谓作《释诂》、《释言》\"是也。" }
      - { type: j, text: "林、烝、天、帝、皇、王、后、辟、公、侯，君也。(诗曰：\"有壬有林。\"又曰：\"文王烝哉。\"其馀义皆通见《诗》、《书》。○辟，并亦反）" }
      - { type: z, text: "\"林烝\"至\"君也\"。○释曰：皆天子诸侯南面之君异称也。《白虎通》云：君，群也。群下之所归心也。林者，《说文》云：\"平地有丛木曰林。\"烝者，《左传》云：\"天生烝民，树之以君，而司牧之。\"然则人物之众，必立君长以司牧之。故以林、烝为君也。天者，《说卦》云：\"乾为天，为君\"，以其俱尊极故也。《大雅》皆谓\"君为天\"是也。帝、皇者，《白虎通》云：德合天地者称帝，帝者谛也，象可承也。皇，美也，大也，天之总美大称也。时质，故总称之。号之为皇，煌煌人莫违也。王者，往也，天下所归往。《说文》云：\"后者，继体君也。象人之形。施令以告四方。故后之，从一、口。发号者，君后也。\"辟者，法也，为下所法则也。公者，通也，公正无私之意也。侯者，候也，候迎顺也。天、帝、皇、王惟谓天子，公、侯惟谓诸侯，馀皆通称。○注\"《诗》曰\"至\"《诗》、《书》\"。○释曰：云\"《诗》曰：有壬有林\"者，《小雅•宾之初筵》文。又曰：文王烝哉\"者，《大雅•文王有声》文。云\"其馀义皆通见《诗》、《书》\"者，谓、天、帝、皇、王、后、辟、公、侯，皆义之常行，故不备引。" }
      - { type: j, text: "弘、廓、宏、溥、介、纯、夏、幠、厖、坟、嘏、丕、弈、洪、诞、戎、骏、假、京、硕、濯、訏、宇、穹、壬、路、淫、甫、景、废、壮、冢、简、箌、昄、晊、将、业、席，大也。（《诗》曰：\"我受命溥将。\"又曰：\"乱如此幠\"，\"为下国骏厖\"，\"汤孙奏嘏\"，\"王公伊濯\"，\"訏谟定命\"，\"有壬有林\"，\"厥声载路\"，\"既有淫威\"，\"废为残贼\"，\"尔土宇昄章\"，\"缁衣之席兮\"。廓落、宇宙、穹隆、至极，亦为大也。箌义未闻。《尸子》曰：\"此皆大，有十馀名而同一实。\"○幠音呼。厖，亡江切。诞音但。訏音吁。箌音罩。昄，蒲板切。晊，之日切）" }
      - { type: z, text: "\"弘廓\"至\"大也\"。○释曰：此皆广大之异言也。弘者，含容之大也。《周书•洛诰》云：\"武王弘朕恭。\"廓者，《方言》云：\"张小使大谓之廓。\"宏者，《书》曰：\"若保宏父。\"介者，《方言》云：\"东齐海岱之间谓之介。\"纯者，《鲁颂•閟宫》云：\"天锡公纯嘏。\"夏者，《方言》云：\"自关而西秦晋之间，凡物之壮大而爱伟之，谓之夏。\"厖者，深之大也。坟、嘏者，《方言》云：\"坟，地大也。青、幽之间凡土而高且大者谓之坟。秦晋之间凡物壮大谓之嘏。\"丕者，《书》云：\"嘉乃丕绩。\"弈者，《诗•大雅•韩弈》云：\"弈弈梁山。\"洪者，《书•大诰》云：\"延洪惟我幼冲人。\"诞者，《大雅•生民》云：\"诞弥厥月。\"戎者，《方言》云：\"宋鲁陈卫之间谓之嘏，或曰戎。\"京、硕、濯、訏者，秦晋之间凡人大谓之奘，燕之北鄙、齐楚之郊或曰京，齐宋之间日硕，荆吴杨瓯之郊曰濯，中齐西楚之间曰訏，此皆谓大，方俗之殊语也。甫者，《诗•齐风》云：\"无田甫田。\"景者，《周颂•潜》篇云：\"以介景福。\"壮者，秦晋之间，凡人大谓之奘，或谓之壮。冢者，舍人曰：冢，封之大也。《大雅•绵》篇云：\"乃立冢土。\"简者，《周颂•执竞》云：\"降福简简。\"箌者，郭云：\"义未闻。\"顾氏云：\"都角切。\"《说文》云：\"草大也。\"《韩诗》云：\"箌彼圃田。\"将者，《周颂》云：\"日就月将。\"业者，版之大也。《大雅•灵台》云：\"虞业维摐。\"馀皆见注。○注\"《诗》曰\"至\"一实\"。○释曰：\"《诗》云：我受命溥将\"者，《商颂•烈祖》文。\"又曰：乱如此幠\"者，《小雅•巧言》文。云\"下国骏厖\"者，《商颂•长发》文。云\"汤孙奏嘏\"者，《商颂•那》篇文。云\"王公伊濯\"者，《大雅•文王有声》文。云\"訏谟定命\"者，《大雅•抑》篇文。云\"有壬有林\"者，《小雅•宾之初筵》文。云\"厥声载路\"者，《大雅•生民》文。云\"既有淫威\"者，《周颂•有客》文。云\"废为残贼\"者，《小雅•四月》文。云\"尔土宇昄章\"者，《大雅•卷阿》文。云\"缁衣之席兮\"者，《郑风•缁衣》文。云\"廓落、宇宙、穹隆、至极，亦为大也\"者，廓落，大貌。四方上下曰宇。《说文》云：\"宙，舟舆所极也。\"穹隆，天之形也。郭氏读晊至为至，故云\"至极\"。是廓、宇、穹、晊亦为大也。云\"《尸子》曰：此皆大，有十馀名而同一实\"者，《汉书•艺文志》云：\"《尸子》二十篇。\"注曰：\"名佼，鲁人，秦相，商君师之。鞅死，佼逃入蜀。\"案《尸子•广泽篇》云：\"墨子贵兼，孔子贵公，皇子贵衷，田子贵均，列子贵虚，料子贵别，囿其学之相非也数世矣，而已皆弇於私也。天、帝、后、皇、辟、公、弘廓、闳、博、介、忳、夏、幕、蒙、赎、昄，皆大也，十有馀名而实一也。若使兼、公、虚、均、衷、平、易、别囿一实也，则无相非也。\"以其数字皆训为大，故引之也。周公作诂，必以始也、君也、大也居先者，始者，无先之称；君者，至尊之号；大则无所不包。故先言之。一曰：此三者天也，人也，地也。《易•乾卦》云：\"万物资始。\"《坤卦》云：\"直方大。\"《老子》云：\"域中有四大，王居其一焉。\"故以此三者为先。乾、坤，相对之物，而以地在人後者，以人居天地之中，且尊尚人君，故进之。自此而下随便即言，无义例也。" }
      - { type: j, text: "幠、厖，有也。（二者又为有也。《诗》曰：\"遂幠大东。\"）" }
      - { type: z, text: "\"幠、厖，有也\"。○释曰：二者又为有，言大有也。成十六年《左传》云：\"生民敦厖。言人生聚丰厚，大有也。○注\"诗曰：遂幠大东\"。○释曰：《鲁颂•閟宫》文也。案今《诗》本作\"遂荒\"。此言\"遂幠\"者，所见本异也。或当在齐、鲁、韩《诗》。" }
      - { type: j, text: "迄、臻、极、到、赴、来、弔、艐、格、戾、怀、摧、詹，至也。（齐楚之会郊曰怀，宋曰届。《诗》曰\"先祖于摧\"。又曰\"六日不詹\"。詹、摧，皆楚语，《方言》云。○极，纪力切。弔音的。艐音宗。摧，昨雷切）" }
      - { type: z, text: "\"迄、臻\"至\"至也\"。○释曰：迄者，自古至今也。《大雅•生民》云：\"以迄于今。\"臻者，《诗•邶风•泉水》云：\"遄臻于卫。\"言疾至於卫也。极者，穷尽之至也。《乐记》云：\"及夫礼乐之极乎天，而蟠乎地。\"言礼乐之道，上至於天，下委於地也。到者，自远而至也。《大雅•韩弈》云：\"靡国不到。\"赴者，趋而至也。《杂记》云：\"凡赴於君。\"来者，自彼至我也。《春秋经》曰：\"祭伯来。\"言至鲁也。弔者，《小雅•天保》云：\"神之弔矣。\"艐读为届。届、格、戾、怀、摧、詹，皆方俗语。○注\"齐楚\"至\"言云\"。○释曰：云\"齐楚之会郊曰怀，宋曰届\"者，《方言》文。云\"《诗》曰：先祖于摧\"者，《大雅•云汉》书。\"又曰：六日不詹\"者，《小雅•采绿》文。云\"詹、摧，皆楚语，《方言》云\"者，案《方言》云：\"徦（音驾）、[彳各]（古格字）、怀、摧、詹、戾、艐（古届字），至也。邠唐冀兖之间曰徦，或曰[彳各]，齐楚之会郊或曰怀。摧、詹、戾，楚语也。艐，宋语也。皆古雅之别语也，今则或同。\"是也。" }
      - { type: j, text: "如、適、之、嫁、徂、逝，往也。（《方言》云：\"自家而出谓之嫁，犹女出为嫁。\"）" }
      - { type: z, text: "\"如適\"至\"往也\"。○释曰：皆谓造於彼也。如者，自我而往也。《春秋》公及大夫朝聘皆曰如。之者，《论语》云：\"之一邦。\"言又往一国也。適、嫁、徂、逝，皆方俗语。○注\"《方言》\"至\"为嫁\"。○释曰：案《方言》云：\"嫁、逝、徂、適，往也。自家而出谓之嫁，犹女而出为嫁也。逝，秦晋语也。徂，齐语也。適，宋鲁语也。往，凡语也。\"" }
      - { type: j, text: "赉、贡、锡、畀、予、贶，赐也。（皆赐与也。○畀，必寐切。予，羊汝切）" }
      - { type: z, text: "\"赉贡\"至\"赐也\"。○释曰：皆谓赐与也。赉者，赐有功善人也。《书•汤誓》曰：\"予其大赉汝。\"贡者，下与上也。《左传》齐桓责楚云：\"尔贡包茅不入。\"锡者，嘉赐也。《禹贡》云：\"禹锡玄圭。\"畀者，付与也。《诗•鄘风•干旄》云：\"何以畀之？\"予者，授与也。《小雅•采菽》云：\"天子所予。\"贶者，惠赐也。《小雅•彤弓》云：\"中心贶之。\"" }
      - { type: j, text: "仪、若、祥、淑、鲜、省、臧、嘉、令、类、綝、彀、攻、榖、介、徽，善也。（《诗》曰：\"仪刑文王。\"《左传》曰：\"禁御不若。\"诗曰：\"永锡尔类\"，\"我车既攻\"，\"介人维藩\"，\"大姒嗣徽音\"。省、綝、彀，未详其义。馀皆常语。○鲜，息浅切。省，先郢切。令，力政切。綝，敕金切。彀，古豆切）" }
      - { type: z, text: "\"仪若\"至\"善也\"。○释曰：皆谓美善也。仪者，形象之善也。若者，惠顺之善也。祥者，李巡曰：\"福之善也。\"《书•泰誓》云：\"袭于休祥。\"淑者，有德之善也。《诗•曹风•鸤鸠》云：\"淑人君子。\"鲜者，清洁之善。《邶风•新台》云：\"籧篨不鲜。\"省、綝、彀，郭氏未详。臧者，功能之善也。《诗•齐风》云：\"射则臧兮。\"嘉者，美之善也。《诗•大雅•抑篇》云：\"无不柔嘉。\"令者，《大雅•卷阿》云：\"令问令望。\"类者，昭二十八年《左传》云：\"勤施无私曰类。\"攻者，坚致之善。榖者，养生之善。《诗•小雅•小明》云：\"式榖以女。\"介者，大善也。徽者，美善也。\"<注>《诗》曰\"至\"常语\"。○释曰：\"《诗》曰：仪刑文王\"者，《大雅•文王》篇文。云\"《左传》曰：禁御不若\"者，《左传》无全文。案文十八年说四凶云：\"投诸四裔，以御螭魅。\"宣三年传言：\"铸鼎象物，故民入山林，不逢不若。\"盖采合传文，故云\"禁御不若\"也。云\"《诗》曰：永锡尔类\"者，《大雅•既醉》文。云\"我车既攻\"者，《小雅•车攻》文。云\"介人维藩\"者，《大雅•板》篇文。云\"大姒嗣徽音\"者，《思齐》文。云\"馀皆常语\"者，谓祥、淑、鲜、臧、嘉、令、榖，书传多有之，故云\"皆常语\"。" }
      - { type: j, text: "舒、业、顺，叙也。（皆谓次叙）叙、业、顺、叙，绪也。（四者又为端绪）" }
      - { type: z, text: "\"舒业\"至\"绪也\"。○释曰：叙谓次叙。舒者，展舒，徐缓有次也。业者，事有次叙也。顺者，不逆，有叙也。舒、业、顺、叙四者又为端绪，互相训也。" }
      - { type: j, text: "怡、怿、悦、欣、衎、喜、愉、豫、恺、康、媅、般，乐也。（皆见《诗》。○媅，丁含切。般，盘。乐，洛）" }
      - { type: z, text: "\"怡怿\"至\"乐也\"。○释曰：皆谓喜乐。怡者，和乐也。《小雅•节南山》云：\"既夷既怿。\"怡、夷音义同。怿者，悦乐也。《商颂•那》篇云：\"亦不夷怿。\"悦者，心乐也。《小雅•都人士》云：\"我心不说。\"悦、说音义同。欣者，笑喜之乐也。《大雅•凫鹥》云：\"旨酒欣欣。\"毛传云：\"欣欣然乐也。\"衎者，饮食之乐也。《小雅•南有嘉鱼》云：\"嘉宾式燕以衎。\"喜者，《说文》云：\"不言而悦也。\"《小雅•彤弓》云：\"中心喜之。\"愉者，安闲之乐也。《唐风•山有枢》云：\"他人是愉。\"毛传云：\"愉，乐也。\"豫者，逸乐也。《小雅•白驹》云：\"逸豫无期。\"恺者，康乐也。《小雅•鱼藻》云：\"岂乐饮酒。\"康者，安乐也。《唐风•蟋蟀》云：\"无以大康。\"媅者，乐之久也。《小雅•鹿鸣》云：\"和乐且湛。\"又《卫风•氓》篇云：\"无与士耽。\"郑笺云：\"耽非礼之乐。\"般者，游乐也，《周颂》篇名也。郑笺云：\"般，乐也。\"○注\"皆见《诗》\"。○释曰：按郭以《尔雅》之作多为释《诗》，且《诗》中备有此文，故云\"皆见《诗》\"。其实六经之中所训亦尔，但以《诗》、《书》之作，作非一人，故有音义虽同，而字形踳驳者：《诗》文作湛、耽，而此作媅；《诗》文作夷、说、岂（原缺）、槃，而此作怡、悦、恺、般之类。直以异人之作，故不同尔，无义例也。他皆放此。" }
      - { type: j, text: "悦、怿、愉、释、宾、协，服也。（皆谓喜而服从）" }
      - { type: z, text: "\"悦怿\"至\"服也\"。○释曰：皆谓喜而服从也。悦、怿、愉者，皆喜乐而服也。释者，释去恨怨而服也。宾者，怀德而服也。《旅獒》云：\"四夷咸宾。\"协者，和合而服也。《左传》曰：\"谋其不协。\"" }
      - { type: j, text: "遹、遵、率、循、由、从，自也。（自犹从也）遹、遵、率，循也。（三者又为循行。○遹音聿）" }
      - { type: z, text: "\"遹遵\"至\"循也\"。○释曰：自亦从也，转互相训也。遹者，《大雅•绵》篇云：\"聿来胥宇。\"遹、聿音义同。遵者，《周南•汝坟》云：\"遵彼汝坟。\"率者，《大雅•绵》篇云：\"率西水浒。\"循者，《顾命》云：\"率循大卞。\"由者，《曲礼》：\"大夫、士出入君门，由闑右。\"从者，《小雅•何人斯》云：\"伊谁云从。\"遹、遵、率三者，又为循行。" }
      - { type: j, text: "靖、惟、漠、图、询、度、咨、诹、究、如、虑、谟、猷、肇、基、访，谋也。（国语曰：\"询于八虞，咨于二虢，度于闳夭，谋于南宫，诹于蔡、原，访于辛、尹。\"通谓谋议耳。如、肇所未详，馀皆见《诗》。○度，铎。趣，子须）" }
      - { type: z, text: "\"靖惟\"至\"谋也\"。○释曰：皆谓谋议也。靖者，安谋也。《小雅•小旻》云：\"靖共尔位。\"惟者，思谋也。漠者，舍人曰：心之谋也。《小雅•小弁》云：\"圣人莫之。\"漠、莫音义同。图者，《大雅•崧高》云：\"我图尔居。\"询、度、咨、诹者，《小雅•皇皇者华》传云：\"访问於善为咨。咨事为诹。咨事之难易为谋。咨礼义所宜为度。亲戚之谋为询。\"究者，《小雅•小弁》云：\"不舒究之。\"虑者，计谋也。谟者，大谋也。《大雅》云：\"訏谟定命。\"猷者，以道而谋也。《大雅•文王》云：\"厥猷翼翼。\"猷、犹音义同。肇者，《大雅•江汉》云：\"肇敏戎公。\"基者，君子作事谋始也。访者，谋政事也。○注\"《国语》\"至\"见《诗》\"。○释曰：云\"《国语》曰：询於八虞，咨於二虢，度於闳夭，谋於南宫，诹於蔡、原，访於辛、尹\"者，是《晋语》胥臣对文公辞，说文王之即位也。韦氏解云：\"八虞，周八士，皆在虞官。二虢，文王弟虢仲、虢叔。南宫，南宫括也。蔡，蔡公。原，原公。辛，辛甲。尹，尹逸。皆周大史也。\"" }
      - { type: j, text: "典、彝、法、则、刑、范、矩、庸、恒、律、戛、职、秩，常也。（庸、戛、职、秩义见《诗》、《书》，馀皆谓常法耳。○彝音夷）" }
      - { type: z, text: "\"典彝\"至\"常也\"。○释曰：皆谓常礼法也。典、刑者，《诗•大雅•荡》篇云：\"尚有典刑。\"彝者，《洪范》云：\"彝伦攸叙。\"法、则者，《天官•冢宰》：\"以八法治官府，．．．．．．以八则治都鄙。\"郑注云：\"邦国官府谓之礼法，常所守以为法式也。\"\"则亦法也。典、法、则所用异，异其名也。\"范者，模法之常也。矩者，度方有常也。庸者，《书•皋陶谟》云：\"自我五礼有庸哉！\"恒，久之常也。《汤诰》云：\"若有恒性。\"律者，常法也。戛者，《康诰》云：\"不率大戛。\"职者，主之常也。秩者，《商颂•烈祖》云：\"有秩斯祜\"。" }
      - { type: j, text: "柯、宪、刑、范、辟、律、矩、则，法也。（《诗》曰：\"伐柯伐柯，其则不远。\"《论语》曰：\"不逾矩。\"）" }
      - { type: z, text: "\"柯宪\"至\"法也\"。○释曰：此亦谓常法，转互相训。柯者，执以取法也。宪者，《大雅•桑扈》云：\"百辟为宪。\"辟，罪法也。刑、范、律、矩、则皆谓常法也。○注\"《诗》曰\"至\"逾矩\"。○释曰：云\"《诗》曰：伐柯伐柯，其则不远\"者，《豳风•伐柯》文。云\"《论语》曰：不逾矩\"者，《为政》文。" }
      - { type: j, text: "辜、辟、戾，辠也。（皆刑罪。○辟，婢亦切。辜音孤。辠音罪）" }
      - { type: z, text: "\"辜、辟、戾、辠也\"。○释曰：皆谓刑罪也。辜者，《书•仲虺之诰》云：\"罔不惧于非辜。\"辟者，《吕刑》云：\"墨辟疑赦。\"戾者，《大雅•抑》篇云：\"亦维斯戾。\"罪古今字也。《说文》云：\"辠，犯法也。从辛，从自。言辠人蹙鼻，苦辛之忧。秦以辠似皇，改为罪。\"取非人自投於网。自，古文以为鼻。" }
      - { type: j, text: "黄发、齯齿、鲐背、耇、老，寿也。（黄发，发落更生黄者。齯齿，齿堕更生细者。鲐背，背皮如鲐鱼。耇犹耆也。皆寿考之通称。○齯音倪。鲐音台。耇音狗）" }
      - { type: z, text: "\"黄发\"至\"寿也\"。○释曰：皆寿考之通称也。黄发者，舍人曰：黄发，老人发白复黄也。郭云：\"黄发，发落更生黄者。\"齯齿者，《说文》云：\"齯，老人儿齿也。\"郭云：\"齿堕更生细者。\"《鲁颂•閟宫》云：\"既多受祉，黄发儿齿。\"郑笺云：\"儿齿亦寿徵。\"鲐背者，舍人曰：老人气衰，皮肤消瘠，背若鲐鱼。郭云：\"鲐背，背皮如鲐鱼。\"刘熙《释名》云：\"九十曰鲐背，背有鲐文。\"《大雅•行苇》云：\"黄耇台背。\"毛传云：\"台背，大老也。\"郑笺云：\"台之言鲐也。大老则背有鲐文。\"《方言》云：\"秦晋之郊，陈兖之会，谓老曰耇鲐。\"耇者，郭云：\"耆也。\"《方言》云：\"燕代北鄙，谓耇为梨。\"郭彼注云：\"梨，面色似冻梨也。\"舍人曰：耇，觏也。血气精华觏竭，言色赤黑如狗矣。孙炎曰：\"耇面如冻梨，色似浮垢，老人寿徵也。\"老者，《说文》云：\"七十曰老。从人、毛、匕。言须发变白也。\"" }
      - { type: j, text: "允、孚、亶、展、谌、诚、亮、询，信也。（《方言》曰：\"荆吴淮汭之间曰展，燕岱东齐曰谌，宋卫曰询。\"亦皆见《诗》。○亶，丁简切。谌，市林切）" }
      - { type: z, text: "\"允孚\"至\"信也\"。○释曰：皆谓诚实不欺也。○注\"《方言》\"至\"见诗\"。○释曰：案《方言》云：\"允、訦（音谌）、恂（音询）、展、谅（音亮）、穆，信也。齐鲁之间曰允，燕岱东齐曰訦，宋卫汝颍之间曰恂，荆吴淮汭之间曰展，西瓯毒屋黄石野之间曰穆，众信曰谅，周南、召南、卫之语也。\"云\"亦皆见《诗》\"者，《鄘风•定之方中》云：\"终然允臧。\"《大雅•文王》云：\"万邦作孚。\"《小雅•祈父》云：\"亶不聪。\"《鄘风•君子偕老》云：\"展如之人兮。\"《大雅•荡》篇云：\"其命匪谌。\"诚者，复言之复也。《鄘•柏舟》云：\"不谅人只。\"《郑风•溱洧》云：\"洵訏且乐。\"谌、亮、谅、询、洵，音义同。" }
      - { type: j, text: "展、谌、允、慎、亶，诚也。（转相训也。《诗》曰：\"慎尔优游。\"）" }
      - { type: z, text: "\"展谌\"至\"诚也\"。○释曰：皆谓至诚，转相训也。○注\"《诗》曰：慎尔优游\"。○释曰：《小雅•白驹》文。" }
      - { type: j, text: "谑浪笑敖，戏谑也。（谓调戏也。见《诗》）" }
      - { type: z, text: "\"谑浪\"至\"谑也\"。○释曰：《诗》曰\"谑浪笑敖\"者，不敬之戏谑也。舍人曰：谑，戏谑也。浪，意明也。笑，心乐也。敖，意舒也。戏笑，邪戏，谑笑之貌。郭云\"谓调戏也。见《诗》\"者，此《邶风•终风》文。" }
      - { type: j, text: "粤、于、爰，曰也。（《书》曰：\"土爰稼穑。\"《诗》曰：\"对越在天\"，\"王于出征\"）爰、粤，于也。（转相训。○粤音曰）" }
      - { type: z, text: "\"粤于\"至\"于也\"。○释曰：皆谓语辞发端，转互相训也。《说文》云：\"曰从开口，象气出於口也。\"○注\"《书》曰\"至\"出征\"。○释曰：\"云\"《书》曰：土爰稼穑\"者，《周书•洪范》文。云\"诗曰：对越在天\"者，《周颂•清庙》文。云\"王于出征\"者，《小雅•六月》文。" }
      - { type: j, text: "爰、粤、于、那、都、繇，於也。（《左传》曰：\"弃甲则那。\"那犹今人云那那也。《书》曰：\"皋陶曰：都。\"繇，辞。於，乎。皆语之韵绝。○繇音由。於音乌）" }
      - { type: z, text: "\"爰粤\"至\"於也\"。○释曰：\"皆语之韵绝，叹辞也。爰、粤于三者又为於乎。○注\"《左传》\"至\"韵绝\"。○释曰：云\"《左传》曰：弃甲则那\"者，宣二年华元答讴者辞也。云\"《书》曰：皋陶曰都\"者，《虞书•皋陶谟》文也。云\"繇，辞\"者，繇卦兆之辞也。云\"於乎\"者，《周颂•维天之命》云：\"於乎不显。\"是也。" }
      - { type: j, text: "㪉、郃、盍、翕、仇、偶、妃、匹、会，合也。（皆谓对合也。○㪉音阁。郃，合。盍，胡腊切。妃音配）" }
      - { type: z, text: "\"㪉郃\"至\"合也\"。○释曰：皆谓对合也。㪉者，《说文》云：\"合会也。\"郃者，和合也。盍者，众合也。《易•豫卦•九四》云：\"勿疑朋盍簪。\"翕者，敛合也。《书•皋陶谟》云：\"翕受敷施。\"仇者，《左传》曰：\"怨耦曰仇。\"偶者，相对合也。《左传》曰：\"大都耦国。\"妃者，嘉耦曰妃。匹者，配合也。《大雅•文王有声》云：\"作丰伊匹。\"会者，集合也。《周礼》曰：\"时见曰会。" }
      - { type: j, text: "仇、雠、敌、妃、知、仪，匹也。（《诗》云：\"君子好仇\"，\"乐子之无知\"，\"实维我仪\"。《国语》亦云：\"丹朱凭身以仪之。\"雠犹俦也。《广雅》云：\"雠，辈也）" }
      - { type: z, text: "\"仇雠\"至\"匹也\"。○释曰：皆谓匹合也。仇者，孙炎云：\"相求之匹。\"雠者，俦、侣、辈、类之匹也。敌者，相当之匹也。妃，合耦之匹也。○注\"《诗》云\"至\"辈也\"。○释曰：云\"《诗》云：君子好仇\"者，《周南•关睢》文。云\"乐子之无知\"者，《桧风•隰有苌楚》文。云\"实维我仪\"者，《鄘•柏舟》文也。云\"《国语》亦云：丹朱冯身仪之\"者，案《周语》惠王十五年，有神降于莘，王问於内史过曰：\"今是何神也？\"对曰：\"昔昭王娶於房，曰房后，实有爽德，协于丹朱，丹朱冯身以仪之，生穆王焉。实临昭周之子孙而祸福之，夫神一不远徙迁若。由是观之，其丹朱乎！\"韦氏解云：\"冯，依也。仪，匹也。言房后之行有似丹朱，丹朱冯依其身而匹偶之，生穆王焉。\"" }
      - { type: j, text: "妃、合、会，对也。（皆相当对）妃，媲也。（相偶媲也。○媲，普计切）" }
      - { type: z, text: "\"妃合\"至\"媲也\"。○释曰：此三者又为当对，妃又为媲，谓相偶媲也。" }
      - { type: j, text: "绍、胤、嗣、续、纂、緌、绩、武、系，继也。（《诗》曰：\"下武维周。\"緌见《释水》。馀皆常语。○纂，子管切）" }
      - { type: z, text: "\"绍胤\"至\"继也\"。○释曰：皆联继不绝也。绍者，《大雅•抑》篇云：\"弗念厥绍。\"胤者，《大雅•既醉》云：\"永锡祚胤。\"嗣者，《周颂•酌》篇云：\"载用有嗣。\"续者，《小雅•斯干》云：\"似续妣祖。\"纂者，《鲁颂•閟宫》云：\"缵禹之绪。\"緌、武见注。绩者，《陈风•东门之扮》云：\"不绩其麻。\"系者，系属之继。《易》曰：\"系小子，失丈夫。\"○注\"《诗》曰\"至\"常语\"。○释曰：云\"《诗》曰：下武维周\"者，《大雅•下武》文。云\"緌见《释水》\"者，彼云：\"汎汎杨舟，绋缡维之。绋，綷也。缡，緌也。\"是矣。" }
      - { type: j, text: "忥、谥、溢、蛰、慎、貉、谧、顗、頠、密、宁，静也。（忥、顗、頠，未闻其义。馀皆见《诗传》。○音戏。谥音侍。貉音陌。谧音密。顗音拟。頠，鱼毁切）" }
      - { type: z, text: "\"谥\"至\"静也\"。○释曰：皆安静也。谥者，人死将葬，诔列其行而作之也。溢者，盈溢者宜静。《周颂•维天之命》云：\"假以溢我。\"蛰者，藏伏静处也。《易》曰：\"龙蛇之蛰。\"慎者，谨静也。《大雅》云：\"淑慎尔止。\"貉者，静定也。《大雅•皇矣》云：\"貊其德音。\"郑笺云：\"德政应和曰貊。\"谧者，《说文》云：\"静语也。\"密者，《周颂•昊天有成命》云：\"夙夜基命宥密。\"宁者，《周颂•良耜》云：\"妇子宁止。\"" }
      - { type: j, text: "陨、磒、湮、下、降、坠、摽、蘦，落也。（磒犹陨也。方俗语有轻重耳。湮，沈落也。摽、蘦见《诗》。○陨，于闵切。磒于敏切。摽，婢眇切。蘦音零）" }
      - { type: z, text: "\"陨磒\"至\"落也\"。○释曰：皆谓堕落也。陨者，《说文》云：\"从高坠也。\"《易》曰：\"有陨自天。\"磒者，石落也。郭云：\"磒犹陨也。方俗语有轻重耳。\"湮，沈落也。下者，自上而落也。降即下也。《曲礼》谓羽鸟死曰降。坠者，《说文》曰：\"从高堕也。\"《左传》曰：\"弗敢失坠。\"摽者，《召南》云：\"摽有梅。\"蘦者，《说文》云：\"草曰蘦，木曰落。\"此对文尔。散而言之，他物之落亦言蘦。《鄘风•定之方中》云：\"灵雨既零。\"蘦、零音义同。" }
      - { type: j, text: "命、令、禧、畛、祈、请、谒、讯、诰，告也。（禧未闻。《礼记》曰：\"畛於鬼神。\"○令，力政切。畛，稹。告，谷）" }
      - { type: z, text: "\"命令\"至\"告也\"。○释曰：皆谓告谕也。命者，使告也。《诗•唐风•扬之水》云：\"我闻有命。\"令，发号以告也。《论语》云：\"其身正，不令而行。\"畛者，致告也。祈者，求告也。《书•召诰》云：\"祈天永命。\"请者，言告也。婚礼五曰请期。谒者，告白也。《月令》曰：\"谒於天子。\"讯者，告问也。《诗》云：\"歌以讯之。\"诰者，布告也。《书•大诰》、《洛诰》之类是也。○注\"《礼记》曰：畛於鬼神\"。○释曰：下《曲礼》文" }
      - { type: j, text: "永、悠、迥、违、遐、逷、阔，远也。（《书》曰：\"逷矣西土之人。\"○迥，户顶切。逷音惕）永、悠、迥、远，遐也。（遐亦远也，转相训）" }
      - { type: z, text: "\"永悠迥违\"至\"遐也\"。○释曰：皆谓辽远也。永者，长远也。《周南•汉广》云：\"江之永矣。\"悠者，《小雅•渐渐之石》云：\"山川悠远。\"迥者，《大雅》云：\"泂酌彼行潦。\"迥、泂音义同。远者，离远也。《召南•殷其雷》云：\"何斯违斯。\"遐者，《大雅•旱麓》云：\"遐不作人。\"逷者，古文逖也。阔者，相疏远也。《邶风•击鼓》云：\"于嗟阔兮。\"永、悠、迥、远四者，又远，遐也；遐亦远也。转相训尔。○注\"《书》曰：逷矣西土之人\"。○释曰：《周书•牧誓》文也。" }
      - { type: j, text: "亏、坏、圮、垝，毁也。（《书》曰：\"方命圮族。\"《诗》曰：\"乘彼垝垣。\"亏通语耳。○坏音怪。圮，房美切。垝音鬼）" }
      - { type: z, text: "\"亏怀\"至\"毁也\"。○释曰：皆谓毁败也。亏者，损毁。《祭义》云：\"不亏其体。\"坏者，人毁也，音怪；一云自毁也，乎怪切。圮者，岸毁也。《书》叙曰：\"祖乙圮于耿。\"垝，是毁垣也。○注\"《书》曰\"至\"语耳\"。○释曰：云\"书曰：方命圮族\"者，《尧典》文。孔安国云：\"圮，毁；族，类也。言鲧性狠戾，好比方名，命而行事，辄毁败善类。\"云\"《诗》曰：乘彼垝垣\"者，《卫风•氓》篇文也。" }
      - { type: j, text: "矢、雉、引、延、顺、荐、刘、绎、尸、旅，陈也。（《礼记》曰：\"尸，陈也。\"雉、顺、刘皆未详）" }
      - { type: z, text: "\"矢雉\"至\"陈也\"。○释曰：皆谓敷陈也。矢者，《书》叙云：\"皋陶矢厥谟。\"引者，伸陈也。延，铺陈也。荐者，馔陈也。绎者，复陈也。《周颂•赉》篇云：\"时周之命於绎思。\"尸者，主陈也。旅者，谓布陈也。《大雅•宾之初筵》云：\"殽核维旅。\"○注\"《礼记》曰：尸，陈也\"。○释曰：《郊特牲》文。" }
      - { type: j, text: "尸、职，主也。（《左传》曰：\"杀老牛，莫之敢尸。\"《诗》曰：\"谁其尸之。\"又曰：\"职为乱阶。\"）" }
      - { type: z, text: "\"尸、职，主也\"。○释曰：皆谓为之主宰也。○注\"《左传》\"至\"乱阶\"。○释曰：云\"《左传》曰：杀老牛莫之敢尸\"者，成十七年传云：晋栾书、中行偃遂执公焉。召韩厥，韩厥辞，曰：\"昔吾畜於赵氏。孟姬之谗，吾能违兵。古人有言曰：'杀老牛，莫之敢尸。'而况君乎！二三子不能事君，焉用厥也？\"是其事。云\"《诗》曰：谁其尸之\"者，《召南•采蘋》文。\"又曰：职为乱阶\"者，《小雅•巧言》文。" }
      - { type: j, text: "尸，寀也。（谓寀也）寀、寮，官也。（官地为寀，同官为寮。○寀，七代反）" }
      - { type: z, text: "\"尸寀\"至\"官也\"。○释曰：寀谓寀地。主事者必有寀地。寀，采也，采取赋税以供己有。寀地及言同寮者，皆谓居官者也。○注\"官地\"至\"为寮\"。○释曰：云\"官地为寀\"者，《礼运》云：\"大夫有采以处其子孙。\"是也。云\"同官为寮\"者，《左传》文七年荀林父告先蔑之辞也。" }
      - { type: j, text: "绩、绪、采、业、服、宜、贯、公，事也。（《论语》曰：\"仍旧贯。\"馀皆见《诗》、《书》）" }
      - { type: z, text: "\"绩绪\"至\"事也\"。○释曰：皆事为也。绩者，功事也。《商颂》云：\"设都于禹之绩。\"绪者，事业也。《鲁颂•閟宫》云：\"缵大王之绪。\"采者，《皋陶谟》云：\"亮采有邦。\"业者，学人所有事。《书•周官》云：\"业广惟勤。\"服者，《周南•关睢》云：\"寤寐思服。\"宜者，宜其事也。《大雅•凫鹥》云：\"公尸来燕来宜。\"贯者，《魏风•硕鼠》云：\"三岁贯女。\"公者，《周颂•酌》篇云：\"实维尔公允师。\"○注\"《论语》曰：仍旧贯\"。○释曰：《先进》篇云：\"鲁人为长府。闵子骞曰：'仍旧贯，如之何？何必改作？'\"是也。" }
      - { type: j, text: "永、羕、引、延、融、骏，长也。（宋卫荆吴之间曰融。羕所未详。○羕音样）" }
      - { type: z, text: "\"永羕\"至\"长也\"。○释曰：《说文》云：\"长，久远也。\"《方言》云：\"施於众长谓之永。\"引者，《汉书•律历志》云：\"十丈为引，引者信也。\"颜师古曰：\"信读曰伸，言其长。\"延者，《方言》云：\"延，年长也，凡施於年者谓之延。\"又宋卫荆吴之间曰融。\"骏者，长大也。" }
      - { type: j, text: "乔、嵩、崇，高也。（皆高大貌。《左传》曰：\"师叔，楚之崇也。\"）崇，充也。（亦为充盛）" }
      - { type: z, text: "\"乔嵩\"至\"充也\"。○释曰：皆高大貌。乔，《周颂•般》篇云：\"堕山乔岳。\"《释山》云：\"山大而高，崧。\"嵩、崧音义同。崇者，高贵也，亦为充盛。《乐记》云：\"复缀以崇。\"○注\"《左传》曰：师叔，楚之崇也\"。○释曰：宣十二年传文也。杜注云：\"师叔，潘<九亚>，为楚人所崇贵。\"" }
      - { type: j, text: "犯、奢、果、毅、剋、捷、功、肩、堪，胜也。（陵犯、夸奢、果毅，皆得胜也。《左传》曰：\"杀敌为果。\"肩即克耳。《书》曰：\"西伯堪黎。\"○毅音义）" }
      - { type: z, text: "\"犯奢\"至\"胜也\"。○释曰：皆谓得胜也。舍人曰：\"肩，强之胜也。\"孙炎曰：\"戡，胜之胜也。\"陵犯、夸奢、杀敌为果、致果、为义、克杀、捷获、有功、肩克、堪任，是皆得胜也。○注\"《左传》\"至\"堪黎\"。○释曰：云\"《左传》曰：杀敌为果\"者，宣二年君子辞也。云\"《书》曰：西伯堪黎\"者，《商颂》篇名也。" }
      - { type: j, text: "胜、肩、戡、刘、杀，克也。（转相训耳。《公羊传》曰：\"克之者何杀之也。\"○戡音堪）" }
      - { type: z, text: "\"胜肩\"至\"克也\"。○释曰：克亦胜也。《诗•周颂•敬之》云：\"佛时仔肩。\"克也。又为杀也。皆谓得胜而杀之。转互相训耳。○注\"《公羊》\"至\"之也\"。○释曰：《公羊》者，在隐元年。经曰：\"夏五月，郑伯克段于鄢。\"传曰：\"克之者何？杀之也。\"" }
      - { type: j, text: "刘、狝、斩、刺，杀也。（《书》曰：\"咸刘厥敌。\"秋猎曰狝，应杀气也。《公羊传》曰：\"刺之者何？杀之也。\"○狝，鲜。刺，次）" }
      - { type: z, text: "\"刘狝\"至\"杀也\"。○释曰：《说文》云：\"杀，戮也。\"斩者，文二年《左传》曰：\"狼曋取戈以斩囚。\"馀皆具注。○注\"《书》曰\"至\"之也\"。○释曰：\"书曰：咸刘厥敌\"者，《周书•君奭》文。云\"秋猎为狝\"者，《释天》文。云\"应杀气也\"者，言秋气肃杀，故名\"秋猎为狝\"。《大司马》云：\"中秋教治兵，遂以狝田\"是也。云\"《公羊传》曰：刺之者何？杀之也\"者，僖二十七年传文也。经云：\"公子买戍卫，不卒戍，刺之。\"故传云此也。" }
      - { type: j, text: "亹亹、蠠没、孟、敦、勖、钊、茂、劭、勔，勉也。（《诗》曰：\"亹亹文王。\"蠠没犹黾勉。《书》曰：\"茂哉茂哉。\"《方言》云：周郑之间相劝勉为勔钊。孟未闻。○亹音尾。蠠音密。钊音招。劭音邵。勔音泯）" }
      - { type: z, text: "\"亹亹\"至\"勉也\"。○释曰：皆谓劝勉也。敦者，厚相勉也。勖者，《邶风•燕燕》云：\"以勖寡人。\"劭者，勉力也。馀皆见注。○注\"《诗》曰\"至\"未闻\"。○释曰：云\"《诗》曰：亹亹文王\"者，《大雅•文王》文也。言勉勉乎不倦，文王之勤，用明德也。云\"蠠没犹黾勉\"者，以其声相近，方俗语有轻重耳。《邶风•谷风》云：\"黾勉同心。\"云\"《书》曰：茂哉茂哉\"者，《皋陶谟》文也。《书》作懋。茂、懋古今字也。云\"《方言》云\"以下者，案彼云：\"钊、薄，勉也。秦晋曰钊，或曰薄，故其鄙语曰：'薄努犹勉努也。'南楚之外曰薄努。自关而东，周郑之间曰勔钊，齐鲁曰勖兹。\"是也。" }
      - { type: j, text: "骛、务、昏、睯，强也。（驰骛事务皆曰勉强。《书》曰：\"不昏作劳\"，\"睯不畏死\"。○骛音务。睯音闵。强，其丈切）" }
      - { type: z, text: "\"骛务\"至\"强也\"。○释曰：皆谓自勉强也。骛谓驰骛。务谓先务。二者皆以力勉强。孙炎曰：昏，夙夜之强也。○注\"《书》曰\"至\"畏死\"。○释曰：云\"《书》曰：不昏作劳\"者，《盘庚》文。云\"睯不畏死\"者，《康诰》文。" }
