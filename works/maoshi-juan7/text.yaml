# 毛詩正義卷7（孔穎達疏）：j 為經文＋毛亨傳、鄭玄箋，z 為疏文。
sections:
  - id: juan7
    name: 正文
    blocks:
      - { type: j, text: "◎曹蜉蝣詁訓傳第十四" }
      - { type: j, text: "○陵曰：曹者，武王之弟叔振鐸所封之國也。爵為伯。其封域在兗州陶丘之北，菏澤之野，今濟陰定陶是也。" }
      - { type: j, text: "曹譜曹者，《禹貢》兗州陶丘之北，地名。○正義曰：《禹貢》雲：“濟、河惟兗州。”王肅雲：“東南據濟，西北距河。不言距濟，而云據者，則州境東南逾濟水也。”《禹貢》又云：“導沇水東流為濟，入於河，溢為滎，東出於陶丘北。”《漢書·地理志》雲：“濟陰定陶縣，故曹國，周武王弟叔振鐸所封。《禹貢》陶丘在西南陶丘亭。”是也。言丘在曹之西南，則曹在丘之東北。止言北者，舉其大望所在耳。雖在濟南，猶屬兗州，故言兗州地名也。○周武王既定天下，封弟叔振鐸於曹，今曰濟陰定陶是也。○正義曰：《曹世家》雲：“曹叔振鐸者，周武王母弟也。武王克殷，封叔振鐸於曹。”《地理志》雲：“濟陰定陶，《詩·風》曹國。”是鄭所引之文也。曹都雖在濟陰，其地則逾濟北。《春秋》僖三十一年“取濟西田”。《左傳》曰：“濟西田，分曹地也。”案《禹貢》濟自陶丘之北，又東至於菏，又東北會於汶。曹在汶南、濟東，據魯而言是濟西，是曹地在濟北也。其封域在雷夏、菏澤之野。○正義曰：《禹貢》兗州雲：“雷夏既澤。”又云：“導菏澤，被盟豬。”案《地理志》雷夏澤在濟陰成陽縣西北，菏澤在濟陰定陶縣東，二澤同屬濟陰。濟陰，曹都所在，是曹之封域在二澤。" }
      - { type: j, text: "昔堯嘗游成陽，死而葬焉。舜漁於雷澤，民俗始化，其遺風重厚，多君子，務稼穡，薄衣食以致畜積。○正義曰：此皆《地理志》文。《志》又云：“濟陰成陽縣有堯冢。”既有堯冢，是死而葬焉。由堯、舜二帝嘗經游處，故民俗化而效之，其遺風多君子也。將言後世驕侈，故先雲其民俗畜積也。○夾於魯、衛之間，又寡於患難，末時富而無教，乃更驕侈。○正義曰：魯在其東南，衛在其西北。魯、衛雖大於曹，非如齊、秦、晉、楚自專征伐，畏懼霸主，不敢侵曹，由此所以寡於患難。又言其改變堯、舜之化而驕侈，無復重厚之風也。《蜉蝣序》雲：“刺奢也。昭公無法以自守，好奢而任小人。”是富而無教，驕侈之事也。言末時者，正謂周王惠、襄之間。作詩之時，鄰國非獨魯、衛而已。舉魯、衛以協句，略餘國而不言也。曹之後世雖為宋所滅，宋亦不數伐曹，故得寡於患難。十一世當週惠王時，政衰，昭公好奢而任小人，曹之變風始作。○正義曰：《曹世家》雲：“叔振鐸卒，子太伯脾立。卒，子仲君平立。卒，子宮伯侯立。卒，子孝伯雲立。卒，子夷伯喜立。卒，弟幽伯強立。九年，弟蘇殺幽伯代立，是為戴伯。三十年，卒，子惠伯兕立。三十六年，卒，子碩甫立，其弟武攻之代立，是為繆公。三年，卒，子桓公終生立。五十五年，卒，子莊公射姑立。三十一年，卒，子釐公夷立。九年，卒，子昭公班立。九年，卒，子共公襄立。”此其君次也。自叔振鐸至昭公，凡十五君，以碩甫不成為君，幽伯、戴伯二及，又不數叔振鐸始封之君，故十一世。昭公以魯閔公元年即位，僖七年卒。周惠王以莊十八年即位，僖八年崩。是當週惠王時也。其詩，《蜉蝣》序雲昭公，昭公詩也。《候人》、《下泉》序雲共公，《鳲鳩》在其間，亦共公詩也。鄭於左方中，皆以此而知。" }
      - { type: j, text: "《蜉蝣》，刺奢也。昭公國小而迫，無法以自守，好奢而任小人，將無所依焉。○蜉蝣，上音浮，下音由，渠略也。國小，一本作“昭公國小而迫”。案《鄭譜》雲：“昭公好奢而任小人，曹之變風始作。”此詩箋雲：“喻昭公之朝。”是《蜉蝣》為昭公詩也。《譜》又云《蜉蝣》至《下泉》四篇，共公時作。今諸本此序多無“昭公”字，崔《集註》本有，未詳其正也。" }
      - { type: z, text: "“《蜉蝣》三章，章四句”至“依焉”。○正義曰：作《蜉蝣》詩者，刺奢也。昭公之國既小，而迫脅於大國之間，又無治國之法以自保守，好為奢侈而任用小人，國家危亡無日，君將無所依焉，故君子憂而刺之也。好奢而任小人者，三章上二句是也。將無所依，下二句是也。三章皆刺好奢，又互相見。首章言“衣裳楚楚”，見其鮮明。二章言“采采”，見其眾多。卒章言“麻衣”，見其衣體。卒章“麻衣”，是諸侯夕時所服，則首章是朝時所服及其餘衣服也。二章言眾多，見其上下之服皆眾多也。首章言“蜉蝣之羽”，二章言“之翼”，言有羽翼而己，不言其美。卒章乃言其色美，亦互以為興也。" }
      - { type: j, text: "蜉蝣之羽，衣裳楚楚。興也。蜉蝣，渠略也，朝生夕死，猶有羽翼以自修飾。楚楚，鮮明貌。箋雲：興者，喻昭公之朝，其群臣皆小人也。徒整飾其衣裳，不知國之將迫脅，君臣死亡無日，如渠略然。○楚楚，如字，《說文》作“<黹虘>々”，雲“會五采鮮色也”。渠，本或作“蟝”，音同，其居反；略，本或作“”，音同，沈雲：“二字並不施蟲。”是也。朝，直遙反，下皆同；一讀下朝夕字，張遙反。" }
      - { type: j, text: "心之憂矣，於我歸處。箋雲：歸，依歸。君當於何依歸乎？言有危亡之難，將無所就往。○難，乃旦反。" }
      - { type: z, text: "“蜉蝣”至“歸處”。○正義曰：言蜉蝣之蟲，有此羽翼，以興昭公君臣有此衣裳楚楚也。蜉蝣之小蟲，朝生夕死，不知己之性命死亡在近，有此羽翼以自修飾，以興昭公之朝廷皆小人，不知國將迫脅，死亡無日，猶整飾此衣裳以自修絜。君任小人，又奢如是，故將滅亡。詩人之言，我心緒為之憂矣。此國若亡，於我君之身當何所歸處乎？○傳“蜉蝣”至“明貌”。○正義曰：《釋蟲》雲：“蜉蝣，渠略。”舍人曰：“蜉蝣，一名渠略，南陽以東曰蜉蝣，梁、宋之間曰渠略。”孫炎曰：“《夏小正》雲：‘蜉蝣，渠略也，朝生而暮死。’”郭璞曰：“似蛣蜣，身狹而長，有角，黃黑色。叢生糞土中，朝生暮死。豬好啖之。”陸機《疏》雲：“蜉蝣，方土語也，通謂之渠略，似甲蟲，有角，大如指，長三四寸，甲下有翅，能飛。夏月陰雨時，地中出。今人燒炙啖之，美如蟬也。“樊光謂之糞中蠍蟲，隨陰雨時為之，朝生而夕死。定本亦云“渠略”，俗本作“渠螻”者，誤也。○箋“興者”至“渠略”。○正義曰：以序雲“任小人”，故云其群臣皆小人耳。其實此言衣裳楚楚，亦刺昭公之身，非獨刺小人也。何則？卒章“麻衣”謂諸侯之身夕服深衣，則知此章衣裳亦有君之衣裳。以蜉蝣朝生夕死，故知喻國將迫脅，死亡無日。" }
      - { type: j, text: "蜉蝣之翼，采采衣服。采采，眾多也。" }
      - { type: z, text: "傳“采采，眾多”。○正義曰：以《卷耳》、《芣苡》言“采采”者，眾多非一之辭，知此“采采”亦為眾多。“楚楚”於“衣裳”之下，是為衣裳之貌。今“采采”在“衣服”之上，故知言多有衣服，非衣裳之貌也。" }
      - { type: j, text: "心之憂矣，於我歸息。息，止也。" }
      - { type: j, text: "蜉蝣掘閱，麻衣如雪。掘閱，容閱也。如雪，言鮮絜。箋雲：掘閱，掘地解，謂其始生時也。以解閱喻君臣朝夕變易衣服也。麻衣，深衣。諸侯之朝朝服，朝夕則深衣也。○掘，求勿反。閱音悅。解音蟹，下同。" }
      - { type: j, text: "心之憂矣，於我歸說。箋雲：說猶舍息也。○說音稅，協韻如字。" }
      - { type: z, text: "“蜉蝣”至“歸說”。○正義曰：蜉蝣之蟲，初掘地而出，皆解閱，以興昭公群臣皆麻衣鮮絜如雪也。蜉蝣之蟲，朝生夕死，掘地而出，甚解閱，後又生其羽翼，為此修飾，以興昭公君臣不知死亡無日，亦朝夕變易衣服而為修飾也。君既任小人，又好奢如是，故君子憂之，言我心為之憂矣。此國若亡，於我君之身當何所歸依而說舍乎？言小人不足依恃也。○傳“掘閱”至“鮮絜”。○正義曰：此蟲土裏化生。閱者，悅懌之意。掘閱者，言其掘地而出，形容解閱也。麻衣者，白布衣。如雪，言甚鮮絜也。○箋“掘地”至“深衣”。○正義曰：定本雲“掘地解閱，謂開解而容閱”，義亦通也。上言羽翼，謂其成蟲之後。此掘閱，舉其始生之時。蟲以朝夕容貌不同，故知喻君臣朝夕變易衣服也。言麻衣，則此衣純用布也。衣裳即布，而色白如雪者，謂深衣為然，故知麻衣是深衣也。鄭又自明己意，所以知麻是布深衣者，以諸侯之朝夕則深衣故也。《玉藻》說諸侯之禮雲：“夕深衣，祭牢肉。”是諸侯之服夕深衣也。深衣，布衣，升數無文也。《雜記》雲：“朝服十五升。”然則深衣之布亦十五升矣，故《間傳》雲“大祥素縞麻衣”，注云：“麻衣，十五升，布深衣也。純用布，無採飾。”是鄭以深衣之布為十五升也。彼是大祥之服，故云“無採飾”耳。而《禮記·深衣》之篇說深衣之制雲：“孤子衣純以素。非孤子者，皆不用素純。”此諸侯夕服當用十五升布深衣，而純以採也。以其衣用布，故稱麻耳。案《喪服記》：“公子為其母麻衣，縓緣。”注云：“麻衣者，小功布深衣。”引詩云：“麻衣如雪。”若深衣用十五升布為，而彼注以麻衣為小功布者，以大功章雲：“公之庶昆弟為其母。”言公之昆弟，則父卒矣。父卒為母大功，父在之時，雖不在五服之例，其縷粗細宜降大功一等，用小功布深衣。引此者，證麻衣是布深衣耳，不謂此言麻衣，其縷亦如小功布也。" }
      - { type: j, text: "《蜉蝣》三章，章四句。" }
      - { type: j, text: "《候人》，刺近小人也。共公遠君子而好近小人焉。○候人，官名。近，附近之近，下同。共音恭，下篇同。遠，於萬反，下注同。好，呼報反。" }
      - { type: z, text: "“《候人》四章，章四句”至“人焉”。○正義曰：首章上二句言其遠君子，以下皆近小人也。此詩主刺君近小人。以君子宜用而被遠，小人應疏而卻近，故經先言遠君子也。" }
      - { type: j, text: "彼候人兮，何戈與祋。候人，道路送賓客者。何，揭。祋，殳也。言賢者之官，不過候人。箋雲：是謂遠君子也。○何，何可反，又音何。祋，都外反，又都律反。揭音竭，又其謁反。殳，市朱反。" }
      - { type: j, text: "彼其之子，三百赤芾。彼，彼曹朝也。芾，韠也。一命縕芾黝珩，再命赤芾黝珩，三命赤芾蔥珩。大夫以上赤芾乘軒。箋雲：之子，是子也。佩赤芾者三百人。○其音記，下皆同。芾音弗，祭服謂之芾，沈又甫味反。朝，直遙反，下“在朝”同。縕，音溫，何烏本反，赤黃之色。黝，於糾反，黑色。珩音衡。以上，時掌反。" }
      - { type: z, text: "“彼候”至“赤芾”。○正義曰：言共公疏遠君子。曹之君子正為彼候迎賓客之人兮，荷揭戈與祋在於道路之上。言賢者之官，不過候人，是遠君子也。又親近小人，彼曹朝上之子三百人皆服赤芾，是其近小人也。諸侯之制，大夫五人。今有三百赤芾，愛小人過度也。○傳“候人”至“候人”。○正義曰：《夏官》序雲：“候人，上士六人，下士十有二人，史六人，徒百有二十人。”注云：“候人，迎賓客之來者。”彼天子之官，候人是上士、下士，則諸侯之候人亦應是士。此說賢者為候人，乃身荷戈祋，謂作候人之徒屬，非候人之官長也。天子候人之徒百二十人，諸侯候人之徒數必少於天子。賢者之身，充此徒中之一員耳。其職雲：“候人各掌其方之道治，與其禁令，以設候人。”注云：“禁令，備奸寇也。以設候人者，選士卒以為之。”引此詩云：“彼候人兮，何戈與祋。”言以設候人，是其徒亦名為候人也。鄭言選士卒為之，即引此詩，明知此詩所陳，是彼候人之士卒者。若居候人之職，則是官為上士，不宜身荷戈祋，不得刺遠君子。以此知賢者所為，非候人之官長也。其職又云：“若有方治，則帥而致於朝。及歸，送之於境。”注云：“方治，其方來治國事者也。《春秋傳》曰‘晉欒盈過周，王使候人出諸轘轅。’是其送之也。”官以候迎為名，有四方來者則致之於朝，歸則送之於境，以是知候人是道路送迎賓客者。案《秋官·環人》：“掌送迎邦國之賓客，以路節達諸四方。”又《掌訝》：“掌待賓客。有賓客至，逆於境為前驅而入。及歸，送亦如之。”若候人主送迎賓客，而環人、掌訝又掌送迎賓客者，環人掌執節導引，使門關無禁；掌訝以禮送迎，詔贊進止；候人則荷戈兵防衛奸寇，雖復同是送迎，而職掌不同，故異官也。戈祋須人擔揭，故以荷為揭也。《考工記·廬人》雲：“戈柲六尺有六寸，殳長尋有四尺。”戈、殳俱是短兵，相類故也。且祋字從殳，故知祋為殳也。《說文》雲：“祋，殳也。”本刺遠君子，而舉候人，是作者之意言賢者之官不過候人也。賢者所作候人，乃是候人之士卒，言官者，以賢人宜為大官。今在官任使，唯為候人，故以官言之。○傳“彼彼”至“乘軒”。○正義曰：桓二年《左傳》雲“袞、冕、黻、珽”，則芾是配冕之服。《易·困卦》“九五，困於赤芾”，知用享祀則芾服，祭祀所用也。《士冠禮》“陳服皮弁、素韠、玄端、爵韠”，則韠之所用，不施於祭服矣。《玉藻》說韠之制雲：“下廣二尺，上廣一尺，長三尺，其頸五寸，肩革帶博二寸。”《書傳》更不見芾之別制，明芾之形制亦同於韠，但尊祭服，異其名耳。言“芾，韠”者，以其形制大同，故舉類以曉人。其禮別言之，則祭服謂之芾，他服謂之韠，二者不同也。一命縕芾黝珩，再命赤芾黝珩，三命赤芾蔥珩，皆《玉藻》文。彼注云：“玄冕爵弁服之韠，尊祭服，異其名耳。韍之言蔽也。縕，赤黃之間色，所謂韍也。珩，珮玉之珩也。黑謂之黝，青謂之蔥。《周禮》公侯伯之卿三命，下大夫再命，上士一命。”然則曹為伯爵大夫再命，是大夫以上皆服赤芾，於法又得乘軒，故連言之。定十三年《左傳》雲：“齊侯斂諸大夫之軒。”哀十五年傳稱衛太子謂渾良夫曰：“苟使我入國，服冕乘軒。”是大夫乘軒也。閔二年傳稱齊桓公遺衛夫人以魚軒。以夫人乘軒，則諸侯亦乘軒，故云“大夫以上”也。傳因赤芾，遂言乘軒者，僖十八年《左傳》稱“晉文公入曹，數之以其不用僖負羈，而乘軒者三百人也，且曰獻狀”。杜預雲：“軒，大夫之車也。言其無德而居位者，多故責其功狀。”彼正當共公之時，與此三百文同，故傳因言乘軒，以為共公近小人之狀。" }
      - { type: j, text: "維鵜在梁，不濡其翼。鵜，洿澤鳥也。梁，水中之梁。鵜在梁，可謂不濡其翼乎？箋雲：鵜在梁，當濡其翼，而不濡者，非其常也。以喻小人在朝亦非其常。○鵜，徒低反。洿音烏，一音火故反。" }
      - { type: j, text: "彼其之子，不稱其服。箋雲：不稱者，言德薄而服尊。○稱，尺證反，注同。" }
      - { type: z, text: "“維鵜”至“其服”。○毛以為，維鵜鳥在梁，可謂不濡其翼乎？言必濡其翼。以興小人之在朝，可謂不亂其政乎？言必亂其政。彼其曹朝之子，謂卿大夫等，其人無德，不能稱其尊服，言其終必亂國也。鄭上二句別義，具箋。○傳“鵜洿”至“翼乎”。○正義曰：“鵜，洿澤”，《釋鳥》文。舍人曰：“鵜，一名洿澤。”郭樸曰：“今之鵜鶘也。好群飛，入水食魚，故名洿澤，俗呼之為淘河。”陸機《疏》雲：“鵜，水鳥，形如鶚而極大，喙長尺餘，直而廣，口中正赤，頷下胡大如數升囊。若小澤中有魚，便群共杼水滿其胡而棄之，令水竭盡，魚陸地，乃共食之，故曰淘河。”以鵜是食魚之鳥，故知梁是水中之梁，謂魚梁也。○箋“鵜在”至“其常”。○正義曰：箋以經言“不濡其翼”，是怪其不濡，故知言非其常，以喻小人在朝亦非其常。" }
      - { type: j, text: "維鵜在梁，不濡其咮。咮，喙也。○咮，陟救反，徐又都豆反。喙，虛穢反，又尺稅反，又陟角反，鳥口也。" }
      - { type: j, text: "彼其之子，不遂其媾。媾，厚也。箋雲：遂猶久也。不久其厚，言終將薄於君也。○媾，古豆反。" }
      - { type: z, text: "傳“媾，厚”。○正義曰：重昏媾者，以情必深厚，故媾為厚也。" }
      - { type: j, text: "薈兮蔚兮，南山朝隮。薈、蔚，雲興貌。南山，曹南山也。隮，升雲也。箋雲：薈蔚之小云，朝升於南山，不能為大雨，以喻小人雖見任於君，終不能成其德教。" }
      - { type: j, text: "婉兮孌兮，季女斯飢。婉，少貌。孌，好貌。季，人之少子也。女，民之弱者。○箋雲：天無大雨，則歲不熟，而幼弱者飢，猶國之無政令，則下民困病。" }
      - { type: z, text: "“薈兮”至“斯飢”。○正義曰：薈兮蔚兮之小云，在南山而朝升，不能興為大雨，以興小人在上位而見任，不能成其德教。此接勢為喻，天若無大雨，則歲穀不熟。婉兮而少，孌兮而好，季子少女幼弱者，斯必飢矣。以喻德教不成，國無政令，則其民將困病矣。刺君近小人而病下民也。○傳“薈蔚”至“升雲”。○正義曰：言南山朝隮，則有物從山上升也，必是雲矣，故知“薈兮蔚兮”皆是雲興之貌。詩人之作，自歌土風，故云“南山，曹南山也”。“隮，升”，《釋詁》文。定本及《集註》皆雲“隮，升雲也”。○箋“薈蔚”至“德教”。○正義曰：以經唯言云興，不言雨降，故知薈蔚雲興者，是小云之興也。○傳“婉少”至“弱者”。○正義曰：以季女謂少女、幼子，故以婉為少貌，孌為好貌。《齊·甫田》亦云“婉兮孌兮”，而下句雲“總角丱兮”，丱是幼稚，故傳以婉孌併為少好貌。《野有蔓草》雲“清揚婉兮”，思以為妻，則非復幼稚，故以婉為美貌。《採蘋》雲“有齊季女”，謂大夫之妻，《車舝》雲“思孌季女逝兮”，欲取以配王，皆不得有男在其間，故以季女為少女。此言斯飢，當謂幼者並飢，非獨少女而已，故以季女為人之少子、女子。皆觀經為訓，故不同也。伯仲叔季，則季處其少。女比於男，則男強女弱，不堪久飢，故詩言少女耳。定本雲“季，人之少子。女，民之弱者”。○箋“天無”至“困病”。○正義曰：箋以此經輒言“斯飢”，文無致飢之狀，而上句取不雨為喻，是因不雨為興，故知此言歲穀不熟，則幼弱者飢，國無政令，則民困病。今定本直雲“歲不熟”，無“穀”字。" }
      - { type: j, text: "《候人》四章，章四句。" }
      - { type: j, text: "《鳲鳩》，刺不壹也。在位無君子，用心之不壹也。○鳲音屍，本亦作“屍”。" }
      - { type: z, text: "“《鳲鳩》四章，章六句”至“不壹”。○正義曰：經雲“正是四國”、“正是國人”，皆謂諸侯之身，能為人長，則知此雲“在位無君子”者，正謂在人君之位無君子之人也。在位之人既用心不壹，故經四章皆美用心均壹之人，舉善以駁時惡。首章“其子七兮”，言生子之數。下章雲“在梅”、“在棘”，言其所在之樹。見鳲鳩均壹養之，得長大而處他木也。鳲鳩常言“在桑”，其子每章異木，言子自飛去，母常不移也。" }
      - { type: j, text: "鳲鳩在桑，其子七兮。興也。鳲鳩，秸鞠也。鳲鳩之養其子，朝從上下，莫從下上，平均如一。箋雲：興者，喻人君之德，當均一於下也。以刺今在位之人不如鳲鳩。○秸，居八反，又音吉。鞠，居六反。莫音暮。下上，時掌反。淑人君子，其儀一兮。箋雲：淑，善。儀，義也。善人君子，其執義當如一也。" }
      - { type: j, text: "其儀一兮，心如結兮。言執義一則用心固。" }
      - { type: z, text: "“鳲鳩”至“結兮”。○正義曰：言有鳲鳩之鳥，在於桑木之上為巢，而其子有七兮。鳲鳩養之，能平均用心如壹。以興人君之德，養其國人，亦當平均如壹。彼善人君子在民上，其執義均平，用心如壹。既如壹兮，其心堅固不變，如裹結之兮。言善人君子能如此均壹，剌曹君用心不均也。○傳“鳲鳩”至“如一”。○正義曰：“鳲鳩，秸鞠”，《釋鳥》文。鳲鳩之養七子也，旦從上而下，莫從下而上，其於子也平均如壹。蓋相傳為然，無正文。○箋“淑，善”至“如一”。○正義曰：“淑，善”，《釋詁》文。此美其用心均壹。均壹在心，不在威儀。以儀、義理通，故轉儀為義。言善人君子，執公義之心，均平如壹。○傳“言執義一則用心固”。○正義曰：如結者，謂如不以散，如物之裹結，故言執義壹則用心固也。《素冠》雲“我心蘊結”，又為憂愁不散如裹結，與此同。" }
      - { type: j, text: "鳲鳩在桑，其子在梅。飛在梅也。" }
      - { type: j, text: "淑人君子，其帶伊絲。其帶伊絲，其弁伊騏。騏，騏文也。弁，皮弁也。箋雲：“其帶伊絲”，謂大帶也。大帶用素絲，有雜色飾焉。騏當作“<王綦>”，以玉為之，言此帶弁者，刺不稱其服。○弁，皮彥反。騏音其，纂文也，《說文》作“<王綦>”，雲：“弁飾也，往往冒玉也。或亦作璂，音其。”稱，尺證反。" }
      - { type: z, text: "“鳲鳩”至“伊騏”。○毛以為，言鳲鳩之鳥在桑，其子飛去在梅，以其平均養之，故得長大而飛去。以興人君之德，亦能均壹養民，養民得成就而安樂。彼善人君子，執義如壹者，其帶維是絲為之，其弁維作騏之文也。舉其帶、弁，言德稱其服，故民愛之。刺曹君不稱其服，使民惡之。○鄭唯“其弁伊騏”，言皮弁之<王綦>，以玉為之。餘同。○傳“騏，綦文。弁，皮弁”。○正義曰：馬之青黑色者謂之騏。此字從馬，則謂弁色如騏馬之文也。《春官·司服》：“凡兵事韋弁服，視朝皮弁服。凡田冠弁服，凡吊事弁絰服。”則弁類多矣。知此是皮弁者，以其韋弁以即戎，冠弁以從禽，弁絰又是吊兇之事，非諸侯常服也，且不得與絲帶相配，唯皮弁是諸侯視朝之常服。又朝天子亦服之。作者美其德能養民，舉其常服，知是皮弁。○箋“其帶”至“其服”。○正義曰：《玉藻》說大帶之制雲：“天子素帶朱里終闢。諸侯素帶終闢。大夫素帶闢垂。士練帶率下闢。”是大夫以上，大帶用素，故知“其帶伊絲”，謂大帶用素絲，故言絲也。《玉藻》又云：“雜帶，君朱綠，大夫玄華，士緇闢。”是其有雜色飾焉。《夏官·弁師》雲：“王之皮弁，會五采玉<王綦>。”注云：“會，逢中也。<王綦>，結也。皮弁之逢中，每貫結五采玉以為飾，謂之綦。”引此詩云：“其弁伊綦。”又云：“諸侯及孤卿大夫之皮弁，各以其等為之。”注云：“皮弁，侯伯綦飾七，子男綦飾五，玉用三採。”如彼《周禮》之文，諸侯皮弁有綦玉之飾。此雲“其弁伊騏”，知騏當作“<王綦>”，以玉為之。以此故易傳也。孫毓雲：“皮弁之飾，有玉<王綦>而無綦文。綦文非所以飾弁。箋義為長。”若然，《顧命》雲：“四人騏弁執戈。”注云：“青黑曰騏。”不破騏字為玉綦者，以《顧命》之文，於“四人騏弁”之下，每雲“一人冕”，身服冕則是大夫也。於“四人騏弁”之上，雲“二人爵弁執惠”，身服爵弁，則是士也。於“爵弁”之下，次雲“騏弁”，明亦是士。《弁師》之文，上雲“孤卿大夫之皮弁，各以其等為之”，不言士之皮弁，則士之皮弁無<王綦>飾矣，故《弁師》注云：“士之皮弁之會無結飾。”以士之皮弁無玉綦飾，故知《顧命》士之騏弁，正是弁作青黑色，非綦玉之皮弁矣。禮無騏色之弁，而《顧命》有之者，以新王即位，特設此服，使士服此騏弁，執兵衛王。玉綦，常服也。此言諸侯常服，故知騏當作<王綦>，說善人君子而言此帶弁者，以善人能稱其服，刺今不稱其服也。" }
      - { type: j, text: "鳲鳩在桑，其子在棘。淑人君子，其儀不忒。忒，疑也。○忒，他得反。" }
      - { type: z, text: "傳“忒，疑”。○正義曰：《釋言》文。執義如一，無疑貳之心。" }
      - { type: j, text: "其儀不忒，正是四國。正，是也。箋雲：執義不疑，則可為四國之長。言任為侯伯。○長，張丈反，下同。任音壬。" }
      - { type: z, text: "箋“執義”至“侯伯”。○正義曰：傳言“正，長”，《釋訓》文。非為州牧，不得為四國之長，故任為侯伯也。僖元年《左傳》曰：“凡侯伯，救患、分災、討罪，禮也。”是諸侯之長，侯伯也。" }
      - { type: j, text: "鳲鳩在桑，其子在榛。淑人君子，正是國人。正是國人，胡不萬年。箋雲：正，長也。能長人，則人欲其壽考。○榛，側巾反，木名也。又仕巾反，《字林》雲：“木叢生也。”《字林》榛木之字從辛木，雲：“似梓，實如小栗，音壯巾反。”" }
      - { type: j, text: "《鳲鳩》四章，章六句。" }
      - { type: j, text: "《下泉》，思治也。曹人疾共公侵刻下民，不得其所，憂而思明王賢伯也。。○思治，直吏反。刻音克。" }
      - { type: z, text: "“《下泉》四章，章四句”至“賢伯”。○正義曰：此謂思上世明王賢伯治平之時，若有明王賢伯，則能督察諸侯，共公不敢暴虐，故思之也。上三章皆上二句疾共公侵刻下民，下二句言思古明王。卒章思古賢伯。上三章說共公侵刻，而思古明王能紀理諸侯，使之不得侵刻。卒章言賢伯勞來諸侯，則明王亦能勞來諸侯，互相見。" }
      - { type: j, text: "洌彼下泉，浸彼苞稂。興也。洌，寒也。下泉，泉下流也。苞，本也。稂，童梁。非溉草，得水而病也。箋雲：興者，喻共公之施政教，徒困病其民。稂當作“涼”，涼草，蕭蓍之屬。○洌音列。浸，本作“浸”，子鴆反。稂音郎，徐又音良。溉，古愛反。蓍音屍。" }
      - { type: j, text: "愾我寤歎，念彼周京。箋雲：愾，歎息之意。寤，覺也。念周京者，思其先王之明者。○愾，苦愛反，歎息也，《說文》雲：“大息也。”音火既反。覺音教。" }
      - { type: z, text: "“洌彼”至“周京”。○正義曰：洌然而寒者，彼下流之泉，浸彼苞稂之草。稂非灌溉之草，得水則病，以喻共公之政教甚酷虐於民，下民不堪侵刻，遭之亦困病。民既困病，思古明王，愾然我寢寐之中，覺而歎息，念彼周室京師之明王。言時有明王，則無此困病也。○鄭唯稂草有異，其文義則同。○傳“洌寒”至“而病”。○正義曰：《七月》雲“二之日栗洌”，字從冰，是遇寒之意，故為寒也。《釋水》雲：“沃泉縣出。縣出，下出也。”李巡曰：“水泉從上溜下出。”此言“下泉”謂“泉下流”，是《爾雅》之沃泉也。《易》稱“系於苞桑”，謂桑本也。泉之所浸，必浸其根本，故以苞為本。“稂，童梁”，《釋草》文。舍人曰：“稂，一名童梁。”郭樸曰：“莠類也。”陸機《疏》雲：“禾秀為穗而不成，崱嶷然，謂之童梁。今人謂之宿田翁，或謂宿田也。《大田》雲‘不稂不莠’，《外傳》曰‘馬不過稂莠’，皆是也。”此稂是禾之秀而不實者，故非灌溉之草，得水而病。○箋“興者”至“之屬”。○正義曰：以序雲“侵刻下民”，故喻困病下民也。箋以苞稂則是童梁，為禾中別物，作者當言浸禾，不應獨舉浸稂，且下章蕭、蓍皆是野草，此不宜獨為禾中之草，故易傳以為“稂當作涼。涼草，蕭蓍之屬”。《釋草》不見草名涼者，未知鄭何所據。○箋“愾歎”至“明者”。○正義曰：《祭義》說祭之事雲：“周旋出戶，愾然而聞乎歎息之聲。”是愾為歎息之意也。序雲“思明王”，故知念周京是思先王之明者。周京與京師，一也，因異章而變文耳。周京者，周室所居之京師也。京周者，京師所治之周室也。桓九年《公羊傳》雲：“京師者何？天子之居也。京者何？大也。師者何？眾也。天子之居，必以‘大’、‘眾’言之。”是說天子之都名為京師也。" }
      - { type: j, text: "洌彼下泉，浸彼苞蕭。蕭，蒿也。○蒿，好刀反。愾我寤歎，念彼京周。" }
      - { type: j, text: "洌彼下泉，浸彼苞蓍。蓍，草也。愾我寤歎，念彼京師。" }
      - { type: j, text: "芃芃黍苗，陰雨膏之。芃芃，美貌。○芃，薄工反，又薄雄反。膏，古報反。" }
      - { type: j, text: "四國有王，郇伯勞之。郇伯，郇侯也。諸侯有事，二伯述職。箋雲：有王，謂朝聘於天子也。郇侯，文王之子，為州伯，有治諸侯之功。" }
      - { type: z, text: "“芃芃”至“勞之”。○正義曰：言芃芃然盛者，黍之苗也。此苗所以得盛者，由上天以陰雨膏澤之故也。以興四方之國，有從王之事，所以得治者，由有郇國之侯為伯，以恩德勞來之故也。今無賢伯，致曹國之不治，故思之。○鄭唯說伯有異，其文義則同。○傳“郇伯”至“述職”。○正義曰：以經言郇伯，嫌是伯爵，故言“郇伯，郇侯也”。知郇為侯爵者，定四年《左傳》祝鮀說文王之子，唯言曹為伯，明自曹以外，其爵皆尊於伯，故知爵為侯也。諸侯有事，二伯述職，謂東西大伯，分主一方，各自述省其所職之諸侯者，昭五年《左傳》雲：“小有述職，大有巡功。”服虔雲：“諸侯適天子曰述職。”謂六年一會王官之伯，命事考績述職之事也。○箋“有王”至“之功”。○正義曰：莊二十三年《左傳》曰：“諸侯有王，王有巡守。”巡守是天子巡省諸侯，則知有王是諸侯朝聘天子。思古明王賢伯也，言諸侯朝聘天子者，若上有明王，下有賢伯，則諸侯以時朝聘，善惡則有黜陟之義。《大司馬》“掌九伐之法，正邦國。賊賢害民則伐之。”爾時諸侯必不敢暴虐。今由無明王賢伯，不復朝聘。共公侵刻下民，無所畏憚，故思治世有朝聘之時也。僖二十四年《左傳》說富辰稱‘畢、原、酆、郇，文之昭也”，知郇伯是文王之子也。時為州伯，有治諸侯之功，謂為牧下二伯，治其當州諸侯也。易傳者，以經、傳考之，武王、成王之時，東西大伯唯有周公、召公、大公、畢公為之，無郇侯者，知為牧下二伯也。" }
      - { type: j, text: "《下泉》四章，章四句。" }
      - { type: j, text: "曹國四篇，十五章，六十八句。" }
      - { type: j, text: "《毛詩正義》" }
