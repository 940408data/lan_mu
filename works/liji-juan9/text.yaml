# 禮記正義卷9（孔穎達疏）：j 為經文＋鄭玄注，z 為疏文。
sections:
  - id: juan9
    name: 正文
    blocks:
      - { type: z, text: "正義曰：案鄭《目錄》雲：“義同前篇，以簡策繁多，故分為上下二卷。”" }
      - { type: j, text: "君之適長殤，車三乘。公之庶長殤，車一乘。大夫之適長殤，車一乘。皆下成人也。自上而下，降殺以兩，成人遣車五乘，長殤三乘，下殤一乘，尊卑以此差之。庶子言公，卑遠之。傳曰：“大功之殤小從上。”○適，丁歷反，下及下“適室”同。長殤，丁丈反，下及注同：下式羊反。乘，繩證反，下及注同。皆下，戶嫁反。殺，色戒反。遣，棄戰反。差，初隹反，又初宜反。遠，於萬反。" }
      - { type: z, text: "“君之”至“一乘”。○正義曰：此一節論諸侯及卿大夫之子送葬遣車之數。○“君”者，五等諸侯也。今此謂諸侯適子在長殤而死，故云“君之適長殤”也。“車三乘”者，遣車也。葬柩朝廟畢，將行，設遣奠竟，取遣奠牲體臂臑，折之為段，用此車載之，以遣送亡者，故謂之遣車。然遣車之形甚小，《周禮·巾車》雲：“大喪飾遣車鄭雲：“使人以次舉之以如墓也。又雜記遣車視牢具置於四隅鄭雲：“四隅，郭中之四隅。”以此而推，故知小也。所以必須遣車者，《雜記》雲：“大饗既饗，卷三牲之俎，歸於賓館，父母而賓客之、所以為哀也。”是言父母方將遠去，亦如賓客之義，所以載牲體送之也。但遣車之數，貴賤不同。若生有爵命車馬之賜，則死有遣車送之，諸侯七乘，大夫五乘，此後有明文。鄭惟諸侯既七乘，降殺宜兩，則國王宜九乘，士三乘也。今此所明並是殤未成人，未有爵命車馬之賜而得遣車者，言其父有之，得與子也。王九乘，若適子成人，則應七乘，在長殤而死，則五乘。中殤從上亦五乘，下殤，三乘也。若有國王庶子成人，則應五乘，長殤中殤三乘，下殤一乘也。諸侯既自得七乘，其適子成人五乘，長殤三乘，故“君之適長殤，車三乘”也。中則從上，若下殤則一乘也。○“公之庶長殤，車一乘”者，公亦諸侯也。適長殤既三乘，庶子若成人乃三乘，而長殤則一乘，故云“車一乘”也。中殤亦從上，若下殤則無。“大夫之適長殤，車一乘”者，大夫自得五乘，適子成人三乘，長殤降二，故一乘也。中殤從上，亦一乘。若下殤及庶殤並不得也。案下注雲：“人臣賜車馬，乃得有遣車。”禮：三命始賜車馬。然諸侯大夫再命而下，則不合有遣車。今大夫適子長殤得有遣車一乘者，以其身為大夫，德位既重，雖未三命，得有遣車，約鄭注《雜記》雲，則士無遣車。禮，天子上士三命，得有車馬之賜，而云“士無遣車”者，謂諸侯之士及天子中士、下士也。但喪禮質略，天子之臣與諸侯之臣命數雖殊，喪禮不異，故鄭雲大夫以上乃有遣車。文主天子大夫，其實兼諸侯大夫也。鄭以士無遣車者，文王諸侯之士，其實亦兼天子中、下士也。諸侯及大夫之子。”熊氏雲：“人臣得車馬賜者，遣車得及子。若不得車馬賜者，雖為大夫，遣車不得及子。”案此經雲“大夫之適長殤，車一乘”，則大夫之身五乘。下雲：“大夫五個，遣車五乘。”二文兆墁，但此總為殤而言之，故言其子。下文為晏子大儉，故舉國君及大夫之身，本無及子不及子之義，橫生異意，無所證據，熊氏非也。《雜記》雲：“遣車視牢具。”則遣車一乘，當苞一個，士無遣車，《既夕禮》苞三個者，亦是豐小殺大禮之義。若服虔之意，“視牢具”者，視饔餼牢具。故襄二十五年崔杼葬莊公，“下車七乘”，服注云：“上公饔餼九牢，遣車九乘。”與此異也。○注“庶子”至“從上”。○正義曰：君是對臣之名，有地大夫以上，皆有君號。公則五等之上，又同三公之尊。今庶子言“公”，就其尊號，是卑遠於庶子也。此有公、君相對，故為此解。若文無所對，嫡與稱公，故《喪服》雲“公子嫡子”是也。又鄭引《喪服傳》雲“大功之殤中從上”者，證此遣車亦中從上也。必知然者，服是生人所著，哀念死者，車亦生者所有，被及亡人，車、服雖殊，皆緣生者之事，故車馬與服同中從上；若其瓦棺堲周之屬，本為死者，中殤年實童幼，故從於下。盧植以為遣車亦中從下，非其宜。" }
      - { type: j, text: "公之喪，諸達官之長杖。謂君所命，雖有官職，不達於君，則不服斬。" }
      - { type: z, text: "“公之”至“長杖”。○正義曰：此一節論臣為君杖法。公者，五等諸侯也。諸者，非一之辭。達官，謂國之卿大夫士被君命者也。既被君命，故稱“達官”也。既達於官，而貴有其職，此對不達者為長，故云“長”也。若遭君喪，則備服衰杖，故云“諸達官之長杖”也。不雲“衰”，從可知也。○注“謂君”至“服斬”。○正義曰：“不達於君”，謂府史之屬也。賤不被命，是不達於君也。不服斬衰，但服齊衰三月耳。故《喪服》齊衰三月章有“庶人為國君”。鄭雲：“不言民而言庶人，庶人或有在官者。”案彼注即是不達者也，皆是幾謂庶人在官者。若其近臣閽寺之屬，雖無爵命，但嗣君服斬，則亦服斬，與此異也。故《喪服》斬衰章雲：“公士大夫之眾臣，為其君布帶繩屨。”傳曰：“近臣，君服斯服矣。”鄭注云：“近臣，閽寺之屬。”若大夫之臣，雖不被命於諸侯，得為大夫之君服斬與杖，但眾臣降其帶屨，用布帶繩屨耳。" }
      - { type: j, text: "君於大夫，將葬，吊於宮，及出，命引之，三步則止。以義奪孝子。宮，殯宮。出謂柩已在路。如是者三，咀芩。退，去也。三命引之，凡移九步。朝亦如之，哀次亦如之。君吊不必於宮。朝，喪朝廟也。次，他日賓客所受大門外舍也。孝子至此而哀，君或於是吊焉。○朝，直遙反，注同。" }
      - { type: z, text: "“君於”至“如之”。○正義曰：此一節論君吊臣之禮。君於大夫之喪，將至葬時，君必親往吊於殯宮，謂就殯宮以吊孝子。吊禮既畢，及其柩出殯宮之門，孝子號慕攀轅，柩車不動，君奪孝子之情，命遣引之。引者三步則止，所以止者，引者不忍頓奪孝子之情，故且止柩住。君又命引之，引之者三步而止。君又命引之，引之者三步而止。故如是者三，君又命引之，柩車遂行，君便退去。君或來吊，參差早晚，不必恆在殯宮。或當朝廟明日將發之時，亦如柩出殯宮，命引之三步，如是者三之事，故云“朝亦如之”。君吊或晚，不及朝廟之時，朝廟已畢，柩出大門，至平生待賓客次舍之處，孝子哀其平生次舍之處，停柩不行，君於是始吊。吊畢，君命引之使行，如上來之事，故云“哀次亦如之”。○注“宮殯”至“在路”。○正義曰：知此是“殯宮”者，以下雲朝及哀次以朝廟及出大門哀次之事，此文在其前，以事前後，故知是殯宮也。雲“出謂柩已在路”者，對宮中未行，今已出殯門，將往向廟，謂之在路。賀瑒以路謂載柩之車，義亦通也。○注“退去”至“九步”。○正義曰：鄭嫌“退”謂逡巡且退，故云“退，去也”。雲“三命引之，凡移九步”者，以禮成於三，故知凡為九步。鄭必分明言九步者，以經上雲“引之，三步則止”，下雲“如是者三”，恐別更為三，通前為四，十有二步之嫌，故明言“九步”也。九步既停，君又須命引之，則當四命也。或可君既三命，柩雖三步暫停，孝子更須有事，君即退。○注“君吊”至“吊焉”。○正義曰：君於大夫恩義，或有厚薄，或吊有早晚，故云“君吊不必於宮”也。“宮”謂殯宮也，從上可知也。知“朝”是喪朝廟者，朝與哀次相對，故知朝廟也。柩之朝廟，今日至廟，明日乃去。此吊謂明日將去之時，故有命引之。雲“次，他日賓客所受大門外舍也”者，以《覲禮》諸侯受次舍於廟門外，明大夫大門外亦有賓次也。然主位在門東，孝子必哀門西張次者，以平生門東待賓客無次，孝子見門西張次之處而哀，故云“哀次”。雲“君或於是吊焉”者，以君吊正禮當於殯宮，或於朝祖廟，無門外君吊之禮。君來吊或晚，有邂逅於是吊焉，故云“或”，“或”是不定之辭。" }
      - { type: j, text: "五十無車者，不越疆而吊人。氣力始衰。○疆，居良反，本又作疆，下“越疆”同。" }
      - { type: z, text: "“五十”至“吊人”。○正義曰：此一節論衰老不許徒行遠吊之事。所以時不許越疆而吊人者，五十既衰，越疆則道路遙遠，吊人又悲感哀戚，恐增衰恐，故不許也。" }
      - { type: j, text: "季武子寢疾，蟜固不說齊衰而入見，曰：“斯道也將亡矣，士唯公門說齊衰。”季武子，魯大夫季孫夙也。世為上卿，強且專政，國人事之如君，蟜固能守禮，不畏之，矯失俗也。道猶禮也。○蟜，居表反。蟜固，人姓名。說，他活反，本亦作稅，徐又音申銳反，下同。見，賢遍反。矯，居表反。武子曰：“不亦善乎！君子表微。”時無如之何，佯若善之。表猶明也。及其喪也，曾點倚其門而歌。明己不與也。點字晳，曾參父。○點，多忝反。倚，於綺反，徐其綺反。晳，星曆反。" }
      - { type: z, text: "“季武”至“而歌”。○正義曰：此一節論季武子無禮，蟜固正之事。武子，魯之執政上卿，時人畏之，事之如君，入其門皆說衰。唯蟜固不說齊衰而入見武子，謂武子曰：“我所以著齊衰而入者，以此著齊衰之道，將亡絕矣。以時人畏爾，入門者皆說齊衰，故此著齊衰入大夫之門，其道將絕。又語武子：“若依正禮，士唯入公門乃說齊衰，而入大夫之門不合說也。”言“將亡”者，其時鄉餘大夫之門，猶有著齊衰者，故云“將亡”將亡者，未絕之辭。武子既得蟜固之言，心雖恚恨，身既寢疾，無奈之何，乃佯言若美之：“汝之所言，不亦善乎！所以善者，若失禮顯著，凡人皆知。若失禮微細，唯君子乃能表明之。今說齊衰失禮之微，汝能知之，是君子之人，故云君子表微。”及武子之喪，曾點幕蟜固之直，乃倚武子之門而歌，明己不與武子，故無哀戚。○注“季武”至“禮也”。○正義曰：知是上卿專政者，《左傳》文雲：“國人事之如君者，入君門說齊衰。”今入武子之門亦說齊衰，是與咀墁也。此謂不杖齊衰，若杖齊衰，雖入公門，亦不說之，具在下《曲禮》疏。雲“蟜固能守禮，不畏之，矯失俗也”者，謂失禮風俗，矯而正之。據鄭此言，則蟜固，人之姓名，其字從蟲。若矯正之字，從矢。熊氏雲：“或有人矯武子固陋。”對文不知，一何甚也！注“時無”至“善之”。○正義曰：知非實善，雲佯善者，其實善，則尋常不合說齊衰，故知佯若善蟜固也。心實不善而佯善之，是無如之何。凡外貌為陽，內心為陰，實無內心、但有外貌者謂之為陽，故《史記》韓非《說難》雲“陽收其身而實疏之，陰用其言而顯棄之”是也。此“陽”或言“佯”者，字相假借，義亦通也。○注“點字晳，曾參父”。正義曰：此《史記·仲尼弟子傳》文。彼文“點”字作“箴”。" }
      - { type: j, text: "大夫吊，當事而至，則辭焉。辭猶告也，擯者，以主人有事告也。主人無事，則為大夫出。○擯，必刃反，本又作儐，同，後放此。為，於偽反，下“亦為”、“為之變”同。吊於人，是曰不樂。君子哀樂不同日。子於是日哭，則不歌。○日，人一反。樂音嶽，又音洛，注同。婦人不越疆而吊人。不通於外。行吊之日，不飲酒食肉焉。以全哀也。吊於葬者，必執引，若從柩及壙，皆執紼。示助之以力，車曰引，棺曰紼，從柩贏者。○引音胤，注同，車索。壙，若晃反，又音曠，後同。紼音弗，棺索。贏音盈。○喪，公吊之，必有拜者，往謝之。雖朋友、州里、舍人可也。謂無主後。吊曰：“寡君承事。”示亦為執事來。主人曰：“臨。”君辱臨其臣之喪。○臨如字，徐力鴆反。君遇柩於路，必使人吊之。君於民臣有父母之恩。大夫之喪，庶子不受吊。不以賤者為有爵者主。" }
      - { type: z, text: "“大夫”至“受吊”。○正義曰：此一節論吊哭之禮，各依文解之。○“大夫吊”者，謂大夫吊士也。“當事”，當主人有大小斂殯之事也。大夫尊，來吊士，則孝子應出下堂迎之。若正有事而至，則孝子遣人辭告之，道有事不得出也，○注“辭猶”至“夫出”。○正義曰：此“出”者正謂出之於庭，不得出門外，以男子之事自堂及門故也。若未小斂以前，唯君命出，故《士喪禮》雲：“唯君命出。”鄭注云：“大夫以下時來吊襚，不出，始喪哀戚甚，在室。”是小斂以前，不為大夫出也。正當小斂之節，大夫來吊，則辭之以有事。斂畢當踴之時，延大夫而入，絕踴而拜之。或大夫正當斂後踴時始來，則亦絕踴拜之，故《雜記》雲：“當袒，大夫至，雖當踴，絕踴而拜之。”注云：“尊大夫來至，則拜之，不待事已也。若士來吊，雖當斂，不告以有事。事畢，踴後，引士入，然後拜之。”故《雜記》雲“於士，既事成，踴襲而後拜之”是也。此雲不當事則為大夫出，於士，雖不當事則不為之出。然《士喪禮》既小斂以後，主人降自西階，遂拜賓，大夫特拜，士旅之，得出拜士者，以主人將襲絰於序東，因降階而拜之，非故為士而出拜之。不當事為大夫出，謂出迎至庭。若大夫退，則出送於門外。故《士喪禮》：“賓出，主人拜送於門外。”鄭注云：“廟門外也。”廟門謂殯宮門也。○“婦人不越疆而吊人”，此是凡吊之法，婦人無外事，故不越疆而吊人。○“吊於葬者，必執引”，引，柩車索也。吊葬本為助執事，故必相助引柩車也。○“若從柩及壙，皆執紼”者，及，至也。紼，引棺索也。凡執引用人，貴賤有數，若其數足，則餘人不得遙行，皆散而從柩也。至壙下棺窆時，則不限人數，皆悉執紼，是助力也。○注“示助”至“贏者”。○正義曰：“引“者長遠之名，故在車，車行遠也。“紼”是撥舉之義，故在棺，棺唯撥舉，不長遠也。雲“從柩贏”者，贏，餘也。從柩者，是執引所餘贏長者也。何東山雲：“天子千人，諸侯五百人，大夫三百人，士五十人。”贏，首茆也。○“喪，公吊之，必有拜”者。○“喪”謂諸侯臣之喪。公來親吊，或遣人來吊，喪家雖無主後，必有以次疏親而往拜之，以謝其恩。疏親亦無，雖死者朋友及同州同裏及喪家典舍之人而往拜之可也。此以無後，故許他人拜謝。若其有後，主人故自當親拜。是以《既夕禮》雲：“主人乘惡車。”鄭注云：“拜君命”是也。○“吊曰：寡君承事”者，此是君來語擯者，使傳君來之辭也。吊為助事，故雖君之尊，亦稱“承事”也。○“主人曰：臨”者，主人辭謝之，曰君屈辱降臨某之喪。文稱“寡君”，應是吊他國之臣，上承“公吊”之下，則是已國之臣。稱“寡君”者，以其示欲供承喪家之事，故謙言“寡君”，此謂大夫之喪也。若吊士直稱君，故《士喪禮》“君使某吊，如何不淑”是也。○“君遇柩於路”者，君於其臣，當特吊於家，故《喪大記》於大夫及士皆親吊之，又《禮》譏蕢尚受吊，及杞梁之妻不受野吊是也。其或卑小之臣及庶人之等，君不豫知其喪，造次遇柩於路。既有民臣之恩，以此使人吊，故鄭答張逸：“謂行而遇之，謂凡民也。”雖以民為主，亦兼微小臣，君不豫知其喪，故此雲兼臣也。○“大夫之喪，庶子不受吊”者，“不受吊”者，謂不為主人也。適子主喪，受吊拜賓。若適子或有他故不在，則雖庶子不敢受吊，明己卑，闢適也。言大夫庶子不受吊，則士之庶子得受吊也。言“不受吊”，不可以賤者為有爵者喪主也。" }
      - { type: j, text: "妻之昆弟為父後者死，哭之適室，以其正也。子為主，袒、免、哭、踴。親者主之。○免音問。夫入門右，北面闢正主。○闢音避，下“闢難”同。使人立於門外，告來者，狎則入哭。狎，相習知者。○使，色吏反，又如字。狎，戶甲反。父在，哭於妻之室。不以私喪幹尊。非為父後者，哭諸異室。○有殯，聞遠兄弟之喪，哭於側室。嫌哭殯。無側室，哭於門內之右。近南者為之變位。○近，附近之近。同國則往哭之。喪無外事。" }
      - { type: z, text: "“妻之”至“哭之”。○正義曰：此一節論哭無服者之事。適室，正寢也。《禮》：女子適人者，為昆弟為父後者不降，以其正故也。故姊妹之夫為之哭於適室之中庭也。○“子為主”者，子，已子也。甥服舅緦，故命已子為主，受吊拜賓也。○“袒、免、哭、踴”者，冠尊，不居肉袒上，必先免，故凡哭哀則踴，踴必先袒，袒必先免，故“袒、免、哭、踴”也。○“夫入門右”者，夫謂此子之父，即哭妻兄弟者也。言“夫”者，據妻之為喪也。子既為主位，在東階之下西向，父入門右，近南而北向哭也。鄭注知此“北面”者，鄭推子既為主，在阼階下西向，父不為主，若又西向，便似二主，故入門右而北面，示闢為主之處也。鄭又所以知父必北面者，《曾子問》雲，衛靈公吊季康子，魯哀公為主，康子立於門右北面，闢主人之位。故鄭知此當北面闢主人之位也。而《禮》本多將鄭注“北面”為經文者，非也。案古舊本及盧、王《禮》亦無“北面”字，唯鄭注云“北面”耳。庾蔚亦謂非經文也。○“使人立於門外，告來者”者，以門內有哭，則鄉里聞之，必來相吊，故主人所使人出門外，告語來吊者，述所哭之由，明為主在子，不關己也。○“狎則入哭”者，若吊人與此亡者曾經相識狎習，當進入共哭。“父在，哭於妻之室”者，此夫若父，在則適室由父，故但於妻室之前而哭之。亦子為主，使人立於門外也。故鄭注云：“不以私喪於尊。”○“非為父後者，哭諸異室”者，案《奔喪禮》，妻之黨哭諸寢，此哭於適室及異室者，寢是大名，雖適室及妻室、異室，總皆曰寢。此雲子為主，袒免哭踴，則夫入門右亦哭踴。知者以其上文“申祥之哭言思”，婦人倡踴，故知夫入門右亦踴，但文不備耳。○注“近南者為之變位”。○正義曰：此哭於門內之右，謂庶人無側室者，故《內則》雲“庶人無側室”者，言近南為之變位，以其尋常為主，當在阼階東西面，今稱門內之右，故知近南為之變位也。必變之者，以哭於大門內之右，既非常哭之處，故繼門而近於南也。鄭雲近南則猶西面，但近南耳。必知西面者，案《士喪禮》朝夕哭，眾主人、眾兄弟繼婦人南皆西面，明此哭兄弟亦西面也。下雲“同國則往哭之”，上雲聞遠兄弟之喪，謂異國也。所以同國則往哭，異國則否者，以其已有喪殯，不得向他國，故鄭雲：“喪無外事。”" }
      - { type: j, text: "子張死，曾子有母之喪，齊衰而往哭之。或曰：“齊衰不以吊。”以其無服非之。曾子曰：“我吊也與哉？”於朋友哀痛甚而往哭之，非若凡吊。○與音餘。" }
      - { type: z, text: "“子張”至“與哉”。○正義曰：此一節論哭朋友失禮之事。○注“以其”至“非之”。○正義曰：言曾子與子張無服，不應往哭，故或人非之也。若有服者，雖緦亦往也。" }
      - { type: j, text: "有若之喪，悼公吊焉，悼公，魯哀公之子。○悼音道。子游擯，由左。擯，相侑喪禮者。喪禮廢亡，時人以為此儀當如詔辭而皆由右相，是善子游正之。《孝經》說曰：“以身擯侑。”○擯，必忍反，注同。相，息亮反，下同。詔音照。侑音又。" }
      - { type: z, text: "“有若”至“由左”。○正義曰：此一節論擯相之法。在主人曰擯，在客曰介。○注“擯相”至“擯侑”。○正義曰：庾蔚雲：“相主人以禮接賓，皆謂之擯，亦無當於吉凶。”鄭以為相侑喪禮，據此事而言之，《大宗伯》注：“出接賓曰擯，入詔禮曰相。”雲“喪禮廢亡，時人以為此儀當如詔辭而皆由右相，是善子游正之”者，《少儀》雲：“詔辭自右。”鄭雲：“為君出命也，立者尊右。”案立者尊右，若已傳君之詔辭，詔辭為尊，則宜處右。今擯者宜右也。若於喪事，則惟賓主居右，而已自居左。而當時禮廢，言相喪亦如傳君詔辭，己自居右。子游知禮，故推賓居右，己居左也。雲“《孝經說》曰：以身擯侑”者，引《孝經說》證擯是相侑也。孔子身為君作擯侑，故《論語》雲“君召使擯”是也。" }
      - { type: j, text: "齊穀王姬之喪，穀當為告，聲之誤也。王姬，周女，齊襄公之夫人。○穀音告，又古毒反。魯莊公為之大功。或曰：“由魯嫁，故為之服姊妹之服。”或曰：“外祖母也，故為之服。”《春秋》周女由魯嫁，卒，服之如內女服姊妹，是也。天子為之無服，嫁於王者之後乃服之。莊公，齊襄公女弟文姜之子，當為舅之妻，非外祖母也。外祖母又小功也。○為之，於偽反，下及注同。王如字，徐於況反。" }
      - { type: z, text: "“齊穀”至“之服”。○正義曰：此一節論諸侯為王姬著服之事。案莊二年秋，齊王姬卒，齊來告魯。雲“王姬之喪，魯莊公為之大功”，或人解之雲：“王姬，周女也。命魯為主，由魯嫁，比之魯女，故為之服出嫁姊妹之服。”更有或人解雲：“王姬為莊公外祖母，故為之著大功之服。”此或人之言，乃為二非也。王姬是莊公舅妻，不得為外祖母，是一非。假令為外祖母，正合小功，不服大功，是二非也。○注“王姬”至“夫人”。○正義曰：案莊公十一年王女共姬為齊桓公夫人，知此王姬非齊桓公夫人者，以桓公夫人經無卒文，是不告於魯襄公夫人。莊二年經書“王姬卒”，是來告魯，此言齊告王姬之喪，故知是襄公夫人。○注“《春秋》”至“服之”。○正義曰：《春秋》莊二年“齊王姬卒”，《穀梁傳》雲：“為之主者，卒之也。”案莊元年秋，“築王姬之館於外”，下雲“王姬歸於齊”，是由魯嫁也。《喪服》大功章君為姑姊妹女子子嫁於國君者，著大功之服，王姬既比之內女，故服大功也。雲“天子為之無服”者，以尊卑不敵故也。若嫁於王者之後，天子以賓禮待之，則亦大功也。其女反為兄弟為諸侯者，亦大功，以《喪服》女子出嫁為兄弟大功故也。案《喪服》雲女子子為父後者期，謂大夫士之妻有往來歸宗之義。故《喪服》傳雲：“婦人雖在外，必有歸宗，曰小宗。”鄭答趙商雲：“自其家之宗。”言宗及小宗，故知是大夫士也。諸侯夫人，父母卒，無復歸寧之理，故知諸侯夫人為兄弟為諸侯者，但大功耳，不得服期。熊氏以為服期，非也。案《喪服小記》雲“與諸侯為兄弟者服斬”，卑賤降等，雖不為臣，猶服斬衰，與此別也。" }
      - { type: j, text: "晉獻公之喪，秦穆公使人吊公子重耳，獻公殺其世子申生，重耳闢難出奔，是時在翟，就吊之。○重，直龍反，注及下皆同。難，乃旦反。翟音迪，本又作狄。且曰：“寡人聞之，亡國恆於斯，得國恆於斯。言在喪代之際。雖吾子儼然在憂服之中，喪亦不可久也，時亦不可失也。孺子其圖之。”勸其反國，意欲納之。喪謂亡失位。孺，穉也。○嚴，魚檢反，本亦作儼，同。喪，息浪反，注及下皆同。孺，如樹反，後同。穉，直吏反，本又作稚，同。以告舅犯，舅犯，重耳之舅狐偃也，字子犯。舅犯曰：“孺子其辭焉！喪人無寶，仁親以為寶。寶謂善道可守者，仁親，親行仁義。父死之謂何？又因以為利，欲反國求為後，是利父死。而天下其孰能說之？孺子其辭焉！”說猶解也。公子重耳對客曰：“君惠吊亡臣重耳，身喪父死，不得與於哭泣之哀，以為君憂。謝之。○與音預。父死之謂何？或敢有他志以辱君義。”" }
      - { type: z, text: "“晉獻”至“君義”。○正義曰：此一節論公子重耳不因父喪以取國之事，各依文解之。○“且曰”至“圖之”。○使者吊重耳，重耳受吊禮已畢，使者出門，則應遂還賓館，使者方須致穆公之命以勸重耳，故言“且曰”。言“且”者，非特吊耳。“且”者，兼有餘事。使者且更言曰，稱穆公之命，言寡人聞前古以來，失亡其國，恆於此喪禍交代之時，得其國家，亦恆在於此交代之時。言此喪禍交代之際，是得國失國之機，求之則得，不求則失。雖吾子儼然端靜在憂戚喪服之中，無求國之意，然身喪在外，亦不可久為，言辛苦也。得國之時，亦不可失，言當求也。欲使重耳從其言，故云“孺子其圖之”。○“父死”至“君義”。○言父身死亡，謂是何事，正是兇禍之事。既是兇禍，豈得又因此兇禍以有為已利，欲求反國。必其如此，而天下聞之，其誰解說我以為無罪。公子重耳用舅犯之言，出而對客，既敘其吊意，又謝其欲納之言。“君惠吊亡臣重耳”，此一句是敘其吊意。言身喪父死，不得在國與於哭泣之哀，以為君之憂慮，欲納於我。既謝其恩，又道不可之意，言以父死，謂是何事，豈復敢悲哀之外，別有他志，以屈辱君之義事乎。言己無他志，不敢受君勸以反國之義。言“義”者，宜也。穆公之意，以重耳反國為宜，故云“義”也。" }
      - { type: j, text: "稽顙而不拜，哭而起，起而不私。○稽音啟。顙，桑黨反。子顯以致命於穆公。使者，公子縶也。盧氏雲：“古者名字相配，顯當作韅。”○顯依注音韅，呼遍反，徐苦見反。使，色吏反。縶，陟立反，後同。穆公曰：“仁夫公子重耳！夫稽顙而不拜，則未為後也，故不成拜。哭而起，則愛父也。起而不私，則遠利也。”○夫音符。遠，於萬反。" }
      - { type: z, text: "“稽顙”至“遠利也”。○正義曰：此穆公本意勸重耳反國，重耳若其為後，則當拜謝其恩，今不受其勸，故不拜謝。穆公以其不拜，故云“未為後”也。所以稽顙者，自為父喪哀號也。凡喪禮，先稽顙而後拜乃成。今直稽顙而不拜，故云“不成拜”也。今既聞父死勸其反國之義，哀慟而起，若欲攀轅然，故云“哭而起，則愛父也”。以其愛父，故起若欲攀轅。既哭而起，不私與使者，言必無心反國，是“遠利”也。鄭注知在翟吊之，及“使者，公子縶”者，並《國語》文。雲：“縶吊重耳而退，吊公子夷吾於梁，如吊重耳之命。夷吾見使者，再拜稽首，起而不哭，退而私於公子縶曰：裏克與我矣，吾命之以汾陽之田百萬。丕鄭與我矣，吾命之以負蔡之田七十萬。亡人苟入，掃除宗廟，定社稷，且入河外列城五。”言亡人之所懷。案《國語》之說夷吾，則穆公美重耳之言，皆是形夷吾而起。" }
      - { type: j, text: "帷殯，非古也。自敬姜之哭穆伯始也。穆伯，魯大夫，季悼子之子公甫靖也。敬姜，穆伯妻，文伯歜之母也。《禮》：“朝夕哭，不帷。”○歜，昌燭反。" }
      - { type: z, text: "“帷殯”至“始也”。○正義曰：此一節論哭殯不合帷殯之事。○注“穆伯”至“不帷”。○正義曰：知穆伯是季悼子之子公甫靖者，《世本》文。知敬姜是文伯歜之母者，下文雲：“文伯之喪，敬姜晝夜哭。”又《國語》雲“敬姜自績，文伯諫之”是也。“朝夕哭，不帷”，是《雜記》文，以孝子思念其親，故朝夕哭時，乃褰徹其帷也。今敬姜之哭穆伯，以闢嫌之故，遂朝夕哭，不復徹帷，故下文雲：“穆伯之喪，敬姜晝哭。”與此同也。案《春秋》文十五年公孫敖之喪，“聲已不視，帷堂而哭”。公孫敖亦是穆伯，此不雲聲已之哭穆伯始者，聲已是帷堂，非帷殯也。聲已哭在堂下，怨恨穆伯，不欲見其堂，故帷堂。敬姜哭於堂上，遠嫌不欲見夫之殯，故帷殯。案張逸答陳鏗雲：“敬姜早寡晝哭，以闢嫌帷殯，或亦闢嫌，表夫之遠色也。”" }
      - { type: j, text: "喪禮，哀戚之至也。節哀，順變也。君子念始之者也。始猶生也。念父母生已，不欲傷其性。" }
      - { type: z, text: "“喪禮”至“者也”。○正義曰：此一節記人總論孝子遭喪，所為哭踴、復魄、飯含、重主、殯葬、反哭之事，各依文解之。○“喪禮，哀戚之至也”者，言人或有禍災，雖或悲哀，未是哀之至極。唯居父母喪禮，是哀戚之至極也。既為至極，若無節文，恐其傷性，故闢踴有節筭，裁節其哀也。故下文：“闢踴，哀之至，有筭，為之節文也。”所以節哀者，欲順孝子悲哀，使之漸變也。故下文雲：“慍，哀之變也。”所以必此順變者，君子思念父母之生已，恐其傷性，故順變也。" }
      - { type: j, text: "復，盡愛之道也，有禱祠之心焉。復謂招魂，且分禱五祀，庶幾其精氣之反。○禱，丁老反，一音丁報反。祠音詞。望反諸幽，求諸鬼神之道也。鬼神處幽暗，望其從鬼神所來。北面，求諸幽之義也。鄉其所從來也。《禮》復者升屋北面。鄉本又作向，同，許亮反。" }
      - { type: z, text: "“復盡”至“義也”。○正義曰：始死招魂復魄者，盡此孝子愛親之道也。非直招魂，又分禱五祀，冀精氣之復反，故云“有禱祠之心焉”。言招魂之時，於平生館舍求魂欲反，又於五祀禱請求之，復與五祀，總是祈禱，故云“禱祀之心焉”，以總結之。又解復魄之時，冀望魂神於幽處而來，所以望諸幽者，求諸鬼神之道也。言鬼神處在幽暗，故望幽以求之。又解望幽所在，北方是幽暗，復者北面，求鬼神之義。○注“復謂”至“之反”。○正義曰：“招魂”者，是六國以來之言，故《楚辭》有《招魂》之篇，《禮》則雲：“復，冀精氣反覆於身形。”“分禱五祀”者，《既夕禮》文。直言乃行禱者，謂非直招魂，兼有分禱，俱是求神之義。言分遣其人，以禱五祀。五祀，博言之耳，士唯二祀。" }
      - { type: j, text: "拜、稽顙，哀戚之至隱也。稽顙，隱之甚也。隱，痛也。稽顙者，觸地無容。" }
      - { type: z, text: "“拜稽”至“甚也”。○正義曰：孝子拜賓之時，先為稽顙而後拜者，哀戚之至痛，就拜與稽顙二事之中，稽顙為痛之甚，此“拜稽顙”，“拜”文在上，以《周禮》言之，將拜稽顙。或可下文，殷、周並陳，此雲“拜稽顙”，或舉殷禮，故先言“拜”也。○注“隱痛”。○正義曰：《釋詁》文也。" }
      - { type: j, text: "飯用米、貝，弗忍虛也。不以食道，用美焉爾。尊之也，食道褻，米貝美。○飯，扶晚反。褻，息列反。" }
      - { type: z, text: "“飯用”至“焉爾”。○正義曰：死者既無所知，所以飯用米貝，不忍虛其口。既不忍虛其口，所以不用飯食之道以實之。必用米貝者，以食道褻，米貝美，尊之不敢用褻，故用米貝，美善焉爾。飯食，人所造作，細碎不絜，故為褻也。米貝，天性自然為美。凡含用米貝，案《喪大記》雲：“君沐粱，大夫沐稷，士沐粱。”又以所沐之米以飯之，故《士喪禮》“祝淅米於堂”，又云“祝受米，奠於貝北，主人左，扱米實於右”，是飯用沐米也。則是諸侯用粱，大夫用稷，大用梁。士用粱者，謂天子之士，諸侯之士用稻，故《士喪禮》雲“稻米一豆，實於筐”是也。以次差之，天子當沐黍與？是天子飯用黍也。其含，案《周禮·典瑞》雲：“大喪，其飯玉，含玉。”鄭注云：“含玉，如璧形而小耳。”是天子用璧也。又“飯玉，碎玉以雜米也”，故云“共飯玉”。《雜記》雲“含者執璧將命”，是諸侯亦含以璧也。卿大夫無文。案成十七年公孫嬰齊夢贈瓊瑰，注云“食珠玉，含象”，則卿大夫蓋用珠也。案《士喪禮》“貝三實於笲”，注云：“貝，水物，古者以為貨，江水出焉。笲，竹器名。”是士用貝三，依《雜記》，則大夫當五，諸侯七，天子九。何休注《公羊》雲：“天子以珠，諸侯以玉，大夫以碧，士以貝。”又《禮緯·稽命徵》：“天子飯以珠，含以玉。諸侯飯以珠，含以璧。卿大夫飯以珠，含以貝。”此等或是異代禮，非周法也。" }
      - { type: j, text: "銘，明旌也。神明之精。○銘音名。旌音精。以死者為不可別已，故以其旗識之。不可別，形貌不見。○別已，彼列反，注同，本或無己字，非。識，式至反，皇如字。愛之，斯錄之矣。敬之，斯盡其道焉耳。謂重與奠。○重與奠也，與音如字，一本作“重與奠與”，二“與”並音餘。重，主道也。始死未作主，以重主其神也。重既虞而埋之，乃後作主。《春秋傳》曰：“虞主用桑，練主用栗。”殷主綴重焉，綴猶聯也。殷人作主，而聯其重，縣諸廟也。去顯考，乃埋之。○綴，丁劣反，又丁衛反。聯音連。縣音玄。周主重徹焉。周人作主，徹重埋之。" }
      - { type: z, text: "“銘明”至“徹焉”。○正義曰：案《士喪禮》“為銘各以其物。”又《司常》雲：“大喪共銘旌。”注云：“王則大常。”案《司常》雲：“王建大常，諸侯建旂，孤卿建旃，大夫士建物。”則銘旌亦然，但以尺寸易之。案《士喪禮》士長三尺，大夫五尺，諸侯七尺，天子九尺，從遣車之差，以喪事略故也。若不命之士，則《士喪禮》雲“以緇，長半幅”，長一尺；“赬末，長終幅”，長二尺，總長三尺。○“愛之，斯錄之矣”。○“愛之，斯錄之”者，謂孝子思念其親，追愛之道。斯，此也。故於此為重，以存錄其神也。○“敬之，斯盡其道焉”耳者，謂於此設奠，盡其孝養之道焉耳。鄭以下文有“重”及“奠”，故以此一經為下張本，故云“重與奠”也。此“愛之，斯錄之矣”，及“敬之，斯盡其道焉耳”，亦得總焉於“明旌”之義，故《士喪禮》“為銘”之下，鄭注引此愛之敬之二事，以解銘旌，以義得兩通，故鄭彼此二解。○“重主”至“徹焉”。○言始死作重，猶若吉祭木主之道。主者吉祭所以依神，在喪重亦所以依神，故云“重，主道也”。○“殷主綴重焉”者，謂殷人始殯，置重於廟庭，作虞主訖，則綴重縣於新死者所殯之廟也。○“周主重徹焉”者，謂周人虞而作主，而重則徹去而埋之，故云“周主重徹焉”。但殷人綴而不即埋，周人即埋，不縣於廟為異也。○注“始死未作”至“練主用栗”。○正義曰：案《士喪禮》雲士有重無主，而此雲“重，主道”者，此據天子諸侯有主者言之，卿大夫以下無主。《春秋》孔悝為礻石主，鄭《駁異義》雲：“孔悝祭所出君，故有主。”雲“重既虞而埋之，乃後作主”者，謂既虞之後，乃始埋重，埋重之後，乃始作主。案天子九虞，九虞之後，乃埋重。重與柎相近，故《公羊》雲“虞主用桑，謂虞祭之末也”。《左傳》雲“祔而作主”，謂用主之初，俱是喪主，其義不異，故《異義》：“《公羊》說虞而作主，《左氏》說天子九虞，十六日祔而作主謂喪主，許慎謹案：《左氏》說與《禮》同。”鄭氏不駁，則是從《左氏》之義，非是虞祭之日即作主也。故此注云埋重之後，乃作主也。其卒哭之祭，己用主也。必知然者，以卒哭日成事，以吉祭易喪祭，故知與虞異也。○注“殷人”至“埋之”。○正義曰：知縣之廟者，“周主重徹焉”，明殷之作主，重不徹焉。主之與重，本為死者入廟，重既不徹，故知重隨死者縣於廟。雲“去顯考，乃埋之”者，謂今死者世世遞遷，至為顯考，其重恆在，死者去離顯考，乃埋其重及主，以其既遷，無復有廟，故顯考謂高祖也。其遷早晚，《左氏》以為三年喪畢，乃遷廟，故僖三十三年《左氏傳》雲：“烝嘗褅於廟。”杜、服皆以為三年禘祭，乃遷此廟，鄭則以為練時則不禘而遷廟主，故鄭注《士虞禮》“以其班祔”之下雲“練而遷廟”，又注《鬯人》“廟用卣”，“謂始禘時”。鄭必謂以練者，以文二年“作僖公主”，《穀梁傳》雲：“於練焉，壞廟。壞廟之道，易簷可也，改塗可也。”範寧雲：“親過高祖則毀其廟，以次而遷，將納新神，故示有所加。”是鄭之所據。其主之狀，範人云：“正方，穿中央，達四方。天子長尺二寸，諸侯長一尺。”○注“周人”至“埋之”。○正義曰：案《既夕禮》將葬，“甸人抗重出自道，道左倚之”。鄭注云：“重既虞，將埋之。”是鄭埋重於門外之道左也。若虞主，亦埋之於祖廟門外之道左。案《異義》：“《戴禮》及《公羊》說虞主埋於壁兩楹之間，一說埋之於廟北牖下，《左氏》說虞主所藏無明文。”鄭駁之雲：“案《士喪禮》重與柩相隨之禮，柩將出，則重倚於道左。柩將入於廟，則重止於門西。虞主與神相隨之禮，亦當然。練時既特作栗主，則入廟之時，祝奉虞主於道左。”練祭訖，乃出就虞主而埋之，如既虞埋重於道左。是鄭既練，埋虞主於廟門之道左也。" }
      - { type: j, text: "奠以素器，以生者有哀素之心也。哀素，言哀痛無飾也。凡物無飾曰素。唯祭祀之禮，主人自盡焉爾，豈知神之所饗？亦以主人有齊敬之心也。哀則以素，敬則以飾，禮由人心而已。○齊，側皆反。" }
      - { type: z, text: "“奠以”至“心也”。○正義曰：“奠”謂始死至葬之時祭名，以其時無屍，奠置於地，故謂之“奠”也。悉用素器者，表主人有哀素之心。既因用素表孝子哀素，遂論虞祭之後，及卒哭練祥之祭，故云此等祭祀之禮，既見親終，於主人自盡致孝養之道焉爾，豈知神之所饗須設此祭？所以設之者，亦以主人有齊敬之心，若親存然，故設祭亦如生存之有齊敬，今死亦齊敬，故云“亦”也。○注“哀則”至“以飾”。○正義曰：哀則以素謂葬前，敬則以飾謂虞後，故《士虞禮》不用素器也。知經中祭祀非尋常吉祭者，以上下所論，皆是喪事，不應吉祭廁在其間。其實吉祭，主人亦有齊敬之心也。" }
      - { type: j, text: "闢踴，哀之至也。有算，為之節文也。算，數也。○闢踴，媿亦反，下音勇。算，桑亂反。" }
      - { type: z, text: "“闢踴”至“文也”。○正義曰：撫心為闢，跳躍為踴。孝子喪親，哀慕至懣，男踴女闢，是哀痛之至極也。若不裁限，恐傷其性，故闢踴有算，為準節文章。準節之數，其事不一。每一踴三跳，三踴九跳，都為一節。士舍死日三日而殯，凡有三踴。初死日襲，襲而踴。明日小斂，小斂而踴。又明日大斂，大斂又踴。凡三日為三踴也。大夫五踴，舍死日四日而殯，初死日一踴，明日襲又一踴，至三日小斂朝一踴，至小斂時又一踴，至四日大斂朝不踴。當大斂時又一踴，凡四日為五踴。諸侯七踴，舍死日六日而殯，初死日一，明日襲又一，至三日小斂朝一，當小斂時又一，四日無事一，五日又一，至六日朝不踴，亦當大斂時又一，凡六日七踴。《周禮》王九踴，舍死日八日而殯，死日一，明日襲一，其間二日為二，至五日小斂為二，其間二日又二，至八日大斂，則其朝不踴也，大斂時又一，凡八日九踴。故云“為之節文”也。故《雜記》雲：“公七踴，大夫五踴，士三踴。”鄭注云“士小斂之朝不踴，君大夫大斂之朝乃不踴”是也。" }
      - { type: j, text: "袒、括髮，變也。慍，哀之變也。去飾，去美也。袒、括髮，去飾之甚也。有所袒，有所襲，哀之節也。" }
      - { type: z, text: "“袒括”至“節也”。○正義曰：言袒衣括髮者，是孝子形貌之變也。悲哀慍恚者，是孝子哀情之變也。去其尋常吉時服飾也者，是去其華美也。孝子去飾，雖有多塗，袒括髮者，就去飾之中，最為甚也。孝子悲哀，理應常袒，何以有所袒、有所襲時者，表明哀之限節，哀甚則袒，哀輕則襲。" }
      - { type: j, text: "弁絰葛而葬，與神交之道也。接神之道，不可以純兇。天子諸侯變服而葬，冠素弁，以葛為環絰，既虞卒哭，乃服受服也。《雜記》曰：“凡弁絰，其衰侈袂。”○括，觀闊反。慍，庾、皇紆粉反，積也，又紆運反，怨恚也，徐又音鬱。去，羌呂反，下及注“去樂”、“去桃茢”並同。衰，七雷反。侈袂，昌氏反，下彌世反。" }
      - { type: z, text: "注“接神”至“侈袂”。○正義曰：葬時居喪，著喪冠麻絰，身服衰裳，是純兇也。又尋常弁絰，以麻為環絰，今乃去喪冠，著素弁，又加環絰，用葛，不以麻，故云交神之道，不可以純兇。雲“天子諸侯，變服而葬”者，以下雲“有敬心焉”。以日月逾時，故敬心乃生。大夫與士，三月而葬，敬心未生，故知天子諸侯也。雲“冠素弁，以葛為環絰”者，素謂素帛為弁，故鄭注《周禮·司服》雲：“弁如爵弁而素。”不雲麻，是用素絹也。以“葛”以“弁絰”連文，故云葛環絰。然則要帶猶用麻也。雲“卒哭，乃服受服也”者，以受服者無文，故鄭解不定。《喪服》注：“天子諸侯既虞，大夫士卒哭，乃受服。”此雲卒哭乃受服，是不定喪服，以大夫以上卒哭與虞，其月不同。士虞與卒哭同在一月，故解為大夫以上。既虞，士卒哭受服。皇氏雲：“《檀弓》足本當言既虞與喪服，注會雲卒哭者，誤也。”引《雜記》“其衰侈袂”者，證既服弁絰，其衰亦改。案《喪服》衰袂二尺二寸，袪尺二寸，則葬時更制其衰袂三尺三寸，袪尺八寸，是改喪服之衰也。熊氏、皇氏等併為錫衰。皇氏又引鄭說，稱鄭衝雲：“《小記》曰，諸侯吊必皮弁錫衰，則此弁絰之衰，亦是吊服也。”案《喪服》改葬尚服緦麻，今葬服錫衰，其義疑也。" }
      - { type: j, text: "有敬心焉。逾時哀衰而敬生，敬則服有飾，大夫士三月而葬，未逾時。○衰，所追反。" }
      - { type: z, text: "注“大夫”至“逾時”。○正義曰：案鄭《箴膏肓》雲：“人君殯數來日，葬首薺月，大夫以上，殯皆以來日數，則大夫並死月四月而葬。”雲“未逾時”者，謂未逾一時。假令四月而死，七月而葬，是未逾越夏之一時也。非如《春秋》之逾年也。若以為逾年言之，則三月死，至四月，是亦逾時。《穀梁傳》雲：“古者行役不逾時。”豈三月行，不至四月即須反？故知不然也。" }
      - { type: j, text: "周人弁而葬，殷人冔而葬。周弁、殷冔，俱象祭冠，而素禮同也。○<口馵>，況甫反。" }
      - { type: z, text: "注“周弁”至“同也”。○正義曰：《士冠禮》：“周弁，殷冔，夏收。”《王制》雲：“夏后氏收而祭，殷人冔而祭，周人弁而祭。”此弁既對冔，故知俱象祭冠。" }
      - { type: j, text: "歠主人、主婦、室老，為其病也。君命食之也。尊者奪人易也。歠，歠粥也。○歠，徐昌悅反，一音常悅反。為其，於偽反，下注“為父母”、“為有兇”、“為人甚”同。食音嗣。易，以豉反。粥，之六反，後同。" }
      - { type: z, text: "“歠主”至“之也”。○正義曰：此一節論尊者奪孝子情之法。歠者，親喪三日之後，歠粥之時，主人，亡者之子。主婦，亡者之妻。室老，家之長相。此三者並是大夫之家貴者，為其歠粥，病困之，故君必有命食疏飯也。若非三者，雖復歠粥致疾病，君不命食之，以其賤故也。其士之主人主婦，君不命也。《喪大記》主婦食疏，食謂既殯之後；此主婦歠者，謂未殯前，故《問喪》雲：“鄰里為之麋粥以飲食之。”" }
      - { type: j, text: "反哭升堂，反諸其所作也。親所行禮之處。○處，昌慮反，下同。主婦入於室，反諸其所養也。親所饋食之處。○養，徐羊尚反。" }
      - { type: z, text: "“反哭”至“養也”。○正義曰：謂葬窆訖，反哭升於廟。所以升堂者，反覆於親所行禮之處。行禮者，謂平生祭祀冠昏在於堂也。主婦反哭，所以入於室，反覆於親所饋食供養之處，此皆謂在廟也。故《既夕禮》主人“反哭，入，升自西階東面”。鄭注云：“反諸其所作也。”又云：“主婦入於室。”注云：“反諸其所養也。”下始雲“遂適殯宮”，故知初反哭在廟也。下雲“反哭之吊也”，亦謂在廟也。" }
      - { type: j, text: "反哭之吊也，哀之至也。反而亡焉，失之矣，於是為甚。哀痛甚。殷既封而吊，周反哭而吊。封當為窆，窆，下棺也。○封，依注音窆，彼驗反，下同。" }
      - { type: z, text: "注“封當”至“棺也”。○正義曰：知非既封土為墳者，以《既夕禮》：“實土三，主人拜鄉人，乃反哭。”周既如此，明殷亦然。且殷既不為墳，故知封當為窆。孔子曰：“殷已愨，吾從周。”愨者，得哀之始，未見其甚。○愨，本又作殻，苦角反，注及後同。" }
      - { type: z, text: "注“愨者”至“其甚”。○正義曰：廟是親之平生行禮之處，今反哭於廟，思想其親而不見，故悲哀為甚。壙者，非親存所在之處，今柩暫來至此，始有悲哀，未是甚極。今吊者於此而來，哀情質愨，故云“愨”也。" }
      - { type: j, text: "葬於北方，北首，三代之達禮也，之幽之故也。北方，國北也。○首，手又反。" }
      - { type: z, text: "“之幽之故也”。○正義曰：上“之”訓往，下“之”語助，言葬於國北及北首者，鬼神尚幽暗，往詣幽冥故也。殯時仍南首者，孝子猶若其生，不忍以神待之。" }
      - { type: j, text: "既封，主人贈，而祝宿虞屍。贈以幣，送死者於壙也。於主人贈，祝先歸。" }
      - { type: z, text: "“既封”至“虞屍”。○正義曰：“既封”，謂葬已下棺。鄭不破“窆”字者，從上可知也。雲“主人贈，而祝宿虞屍”者，謂主人以幣贈死者於壙之時，祝先歸宿戒虞屍。案《既夕禮》主人“贈用制幣，玄纁束帛也”。案《士虞禮記》雲：“男，男屍。女，女屍。”是虞有屍也。" }
      - { type: j, text: "既反哭，主人與有司視虞牲，日中將虞，省其牲。有司以几筵舍奠於墓左，反，日中而虞。所使奠墓有司來歸乃虞也。舍奠墓左，為父母形體在此，禮其神也。《周禮·冢人》：“凡祭墓為屍。”○舍奠音釋，注同。" }
      - { type: z, text: "“有司”至“而虞”。○正義曰：此謂既窆之後事也。有司，修虞之有司也。幾，依神也。筵，坐神席也。席敷陳曰筵。舍，釋也。奠，置也。墓道向南，以東為左，孝子先反脩虞，故有司以几筵及祭饌置於墓左，禮地神也。言以父母形體所託，故禮其地神以安之也。“反，日中而虞”者，“反”謂所使奠墓左有司歸也。“虞”者，葬日還殯宮安神之祭名。必用日中者，是日時之正也。《士虞禮》雲：“日中而行事。”注云：“朝葬，日中而虞。君子舉事必用辰正也。再虞、三虞皆用質明。”案周人尚赤，大事用日出，故朝葬也。○注“所使”至“為屍”。○正義曰：鄭恐奠墓有司未歸，即非虞祭，故云“奠墓有司來歸，乃虞也”。必知歸始虞者，以經雲“奠於墓左，反，日中而虞”，是奠墓者回反，日中而虞。引《周禮·冢人》“凡祭墓為屍”者，證葬畢奠墓。案《周禮·冢人》“為屍”謂祈禱，不同者，以言“凡祭墓”，“凡”者非一，諸祭皆是。" }
      - { type: j, text: "葬日虞，弗忍一日離也。弗忍其無所歸。○離，力智反，下同。是月也，以虞易奠。虞，喪祭也。卒哭曰“成事”。既虞之後，卒哭而祭，其辭蓋曰“哀薦成事”，成祭事也。祭以吉為成。" }
      - { type: z, text: "注“既虞”至“為成”。○正義曰：既虞祭之後，至於卒哭，其卒哭祭辭，蓋曰“成事”。所以稱“蓋”者，以其《士虞禮》無文，唯《雜記》及此有卒哭成事，故鄭約之為解，又稱“蓋”以疑之。以虞祭之時，以其尚兇，祭禮未成。今既卒無時之哭，唯有朝夕二哭，漸就於吉，故云“成事”，祭以吉為成故也。其虞與卒哭，尊卑不同。案《雜記》：“士三月而葬，是月而卒哭。大夫三月而葬，五月而卒哭。諸侯五月而葬，七月而卒哭。”又《雜記》雲：“內此天子七月而葬，九月而卒哭。”《雜記》又云：“諸侯七虞，大夫五，士三。”謂之“虞”者，鄭注《士虞禮》雲：“虞，安也，所以安神。”虞皆用柔日。柔日者，鄭注《士虞禮》雲：“柔日陰，陰取其靜。”最後一虞用剛日。故《士虞記》雲：“三虞卒哭，他用剛日。”鄭注云：“用剛日，剛日，陽也。陽取其動。”謂動而將祔廟也。《雜記》雲：“諸侯七虞。”然則天子九虞也。士三虞卒哭，同在一月。初虞已葬日而用柔，第二虞亦用柔日。假令丁日葬，葬日而虞，則已日二虞，後虞改用剛，則庚日三虞也。故鄭注《士虞禮》雲：“士則庚日三虞。”三虞與卒哭相接，則壬日卒哭也。《士虞禮》雲：“明日祔於祖父。”則祭明日，祔也。士之三虞用四日，則大夫五虞當八日，諸侯七虞當十二日，天子九虞當十六日，最後一虞，與卒哭雷墁，“用剛日”。大夫以上卒哭者，去虞相校兩月，則虞祭既終，不得與卒哭相接。崔氏解：“既正禮得終，其虞後卒哭之前，剛日雖多，不須設祭，以正禮成也。故此下雲：‘不忍一日未有所歸也。’謂不成正禮，赴葬赴虞是也。”崔又一解。虞後卒之前，不可無祭，亦以剛日接之，恐此解非也。" }
      - { type: j, text: "是日也，以吉祭易喪祭。卒哭吉祭。○易，以豉反，徐音亦。明日，祔於祖父。祭告於其祖之廟。○祔音附。其變而之吉祭也。比至於祔，必於是日也接；不忍一日末有所歸也。末，無也。日有所用接之，《虞禮》所謂“他用剛日”也。其祭，祝曰哀薦，曰成事。○比，必利反。" }
      - { type: z, text: "“其安”至“歸也”。正義曰：上雲虞卒哭及祔，皆據得常正禮，此經所云，謂不得正禮，故謂之“變”，以其變常禮也。所以有變者，或時有迫促，或事有忌諱，未及葬期，死而即葬者，即《喪服小記》所云赴葬者，赴虞者，三月而後卒哭。彼據士禮而言，速葬速虞之後，卒哭之前，其日尚賒，不可無祭，謂之為變。其既虞之後，變禮而之吉祭也。之，往也。既虞，往至吉祭。其禮如何？既虞比至於祔以來，必於是日接，謂於是三虞卒哭之間，剛日而連接其祭，謂恆用剛日。所以恆用剛日接之者，孝子不忍使親每一日之間無所歸依。○注“末無”至“成事”。○正義曰：“《虞禮》所謂他用剛日”者，此經所云“變”者，虞禮謂之“他”也。案《士虞禮》雲：“三虞卒哭，他，用剛日，哀薦日成事。”鄭注云：“他謂不及時而葬者。《喪服小記》曰，赴葬者，赴虞者，三月而後卒哭。則虞與卒哭之間有祭事者，亦用剛日，其祭無名，謂之他者，假設言之耳。”如鄭此言，《虞禮》謂之“他”，此經謂之“變”，其義一也。皆據速葬速虞者而言之。雲“其祭，祝曰哀薦，日成事”，雖所行三事虞，卒哭及他之下，鄭意惟屬於他，故引來為注。其依時葬及虞者，後去卒哭雖遠，其間不復祭。崔氏一解雲：“雖依時葬，虞後至卒哭，仍以剛日接。”其義恐非也。《喪服小記》雲“赴葬者”據士，故云“三月而卒哭”。此經亦據士，故云“比至於祔，必於是日也接”。若大夫以上，赴葬、赴虞之後為接祭，至常葬之月，終虞之祭日乃止，其祝亦稱哀薦雲“成事”焉。" }
      - { type: j, text: "殷練而祔，周卒哭而祔，孔子善殷。期而神之，人情。○期音基。" }
      - { type: j, text: "君臨臣喪，以巫祝桃茢執戈，惡之也。為有兇邪之氣在側。君聞大夫之喪，去樂卒事而往，未襲也。其已襲，則止巫，去桃茢。桃，鬼所惡。茢，萑苕，可掃不祥。○茢音列，徐音例，杜預雲：“黍穰也。”鄭注《周禮》雲：“苕帚。”惡，烏路反，注及下注同。兇邪，似嗟反，下注同。萑音完。苕，大雕反。所以異於生也。生人無兇邪。" }
      - { type: z, text: "“君臨”至“生也”。○正義曰：此一節論君臨臣喪之禮。“君”謂天子，臣喪未襲之前，咀薺臨吊，則以巫執桃，祝執茢，又使小臣執戈。所以然者，惡其兇邪之氣。必惡之者，所以異於生人也。若往臨生者，但有執戈，無巫祝執桃茢之事，今有巫祝，故云“異於生”也。○注“君聞”至“桃茢”。○正義曰：“君聞大夫之喪，去樂卒事”者，昭十五年《公羊傳》文。言“而往，未襲也”，是鄭意所加之言也。《公羊》直雲“去樂卒事”，鄭必知往者，以下雲柳莊之卒，衛侯不脫祭服而往，明其王有大臣之喪，亦當然也。以聞喪即往，故知“未襲”也。雲“已襲，則止巫，去桃茢”者，“襲”謂死之明日，則止巫門外，去桃茢，祝代巫而入，又小臣執戈。鄭知然者，案《喪大記》大夫之喪，將大斂，咀薺，巫止於門外，祝先入。又云《士喪禮》亦如此。又《士喪禮》大斂而往，“巫止於廟門外，祝代之。小臣二人執戈先，二人後”。此皆大斂之時，小斂及殯更無文，明與大斂同。直言巫止，無“桃茢”之文，《喪大記》雖記諸侯之禮，明天子亦然，故云“已襲，則止巫，去桃茢”也。此經所云，謂天子禮，故鄭注《士喪禮》引《檀弓》雲：“君臨臣喪，以巫祝桃茢執戈以惡之，所以異於生也，皆天子禮也。”諸侯臨臣之喪，則使祝代巫，執茢居前，下天子也。以此言之，知此文據天子禮也。鄭注《士喪禮》雲：“諸侯臨臣之喪，則使祝代巫執茢”，亦謂未襲以前也。若已襲之後，茢亦去之，與天子同。是天子未襲之前，臨臣之喪，巫祝、桃茢、執戈，三者並具。諸侯臨臣喪，未襲之前，巫止，祝執茢，小臣執戈。若既襲之後，斂殯以來，天子與諸侯同。並巫止，祝代之，無桃茢。案《士喪禮》君吊之時，當大斂之節，而鄭注云：“巫祝桃茢執戈，天子禮也。使祝代巫執茢，諸侯禮也。”以當大斂之時，而解為未襲前者，以《士喪禮》未襲之前，君無親吊。今大斂君來，巫止門外，故鄭以未襲之前解天子諸侯之異。必知襲後無桃茢者，案《喪大記》大斂唯有“巫止”之文，無桃茢之事，故注云：“此己襲，則止巫去桃茢。”下雲：“荊人使公親襚，巫先拂柩。”時荊王以襄二十八年十二月死，至明年正月，則殯來已久，得有始行襲禮。“巫先拂柩”者，彼雲襲者，謂加衣於殯，非為屍加衣，故下雲“拂柩”。及《左傳》雲“袚殯而襚”，是既殯也。公以楚人無禮於已，故公用天子未襲之前君臨臣喪之法，以巫祝桃茢也。" }
      - { type: j, text: "喪有死之道焉，言人之死，有如鳥獸死之狀。鳥獸之死，人賤之。先王之所難言也。聖人不明說，為人甚惡之。○難，乃旦反。" }
      - { type: z, text: "“喪有”至“言也”。○正義曰：此一節論先王恐生者惡死者之事，言人之喪也，有如鳥獸死散之道焉。“先王之所難言”，死散之義，若言其死散，則人之所惡，故難言也。" }
      - { type: j, text: "喪之朝也，順死者之孝心也。朝謂遷柩於廟。○朝，直遙反，注及下皆同。其哀離其室也，故至於祖考之廟而後行。殷朝而殯於祖，周朝而遂葬。" }
      - { type: z, text: "“喪之”至“遂葬”。○正義曰：此一節論殷、周死者朝廟之事。“喪之朝也”者，謂將葬前，以柩朝廟者，夫為人子之禮，出必告，反必面，以盡孝子之情。今此所以車載柩而朝，是順死者之孝心也。然朝廟之禮，每廟皆朝，故《既夕禮》雲：“其二廟，則饌於禰廟。”下雲：“降柩，如初適祖。”則天子諸侯以下，每廟皆一日，至遠祖之廟，當日朝畢，則為祖祭，至明日設遣奠而行。○“其哀離其室也”者，謂死者神靈悲哀，棄離其室，故至於祖考之廟，辭而後行。殷人尚質，敬鬼神而遠之，死則為神，故云朝而殯於祖廟。周則尚文，親雖亡歿，故猶若存在，不忍便以神事之，故殯於路寢，及朝廟遂葬。夫子不論二代得失，皆合當代之禮，無所是非。以此言之，則周人不殯於廟。按僖八年“致哀姜”，《左傳》雲：“不殯於廟，則弗致也。”則正禮當殯於廟者，服氏雲：“不薨於寢，寢謂小寢。不殯於廟，廟謂殯宮。鬼神所在謂之廟。”鄭康成以為《春秋》變周之文，從殷之質，故殯於廟。杜預以為不以殯朝廟，未詳孰是。" }
      - { type: j, text: "孔子謂為明器者，知喪道矣，備物而不可用也。神與人異道，則不相傷。哀哉！死者而用生者之器也，不殆於用殉乎哉！殆，幾也。殺人以衛死者曰殉。用其器者，漸幾於用人。○殉，辭俊反，以人從死曰殉。畿音祈，又音機，下同。其曰明器，神明之也。神明，死者異於生人。塗車、芻靈，自古有之，芻靈，束茅為人馬。謂之靈者，神之類。○芻，初拘反。明器之道也。言與明器同。孔子謂為芻靈者善，謂為俑者不仁，殆於用人乎哉！俑，偶人也。有面目機發，有似於生人。孔子善古而非周。○俑音勇。" }
      - { type: z, text: "“孔子”至“乎哉”。○正義曰：此一節皆記者錄孔子之言，善古非殷周之事，故云孔子謂夏家為明器者，知死喪之道焉。以孝子之事親不可闕，故備其器物，若似生存；以鬼神異於人，故物不可用。孔子既論夏家之事，是又言殷代之非，故云，可哀哉！殷之送死者而用生者之祭器，不殆於用生人為殉乎哉！“殆”，近也，謂近於用乎生人為殉。所以近者，以生人食器而供死者，似若用生人而殉死人，故云近也。既言殷代之事，將言周代用偶人為非禮，故先言明器芻靈，後論偶人之事。故言“其曰明器，神明之也”。死者之物，還可用塗車、芻靈，即明器之物一類，自古帝王所制而有之，此則豈不可為用，故云“明器之道”也。記者錄孔子之言，又說孔子臧否古今得失，以其語更端，故重言“孔子”，謂古之為芻靈者善，謂周家為俑者不仁，不近於用生人乎哉！言近於用生人。所以近者，謂刻木為人，而自發動，與生人無異，但無性靈智識，故云近。此雲“用人”，前言“用殉”，殉是已死之人，形貌不動，與器物相似，故言“用殉”。此雲“用人”者，謂用生人入壙，今俑者形貌發動，有類生人，故云“用人”。上文雲“塗車、芻靈”，此不言“塗車”，直雲“芻靈”者，以其束茅為人，與俑者相對，故不取塗作車也。○注“俑偶”至“非周”。○正義曰：謂造作形體，偶類人形，故《史記》有土偶人、木偶人是也。雲“孔子善古而非周”者，“古”謂周以前，虞以後，故上雲“虞氏瓦棺，始不用薪”，明虞氏以來，始有塗車、芻靈。言“非周”者，謂周為俑人，如鄭康成之意，則周初即用偶人，故《冢人職》“言鸞車象人”，司農注云：“象人謂以芻為人。”康成注引此“謂為俑者不仁”，是象人即俑人也。其餘車馬器物猶為塗車，芻靈，故《校人》“大喪飾遣車之馬，及葬埋之”，鄭注云：“言埋之則是馬塗車之芻靈。”是偶人之外，猶有塗車、芻靈之制，雖或用木，無機識發動。偶人謂之俑者，皇氏雲：“機械發動踴躍，故謂之俑也。”" }
      - { type: j, text: "穆公問於子思曰：“為舊君反服，古與？”仕焉而已者。穆公，魯哀公之曾孫。○為，於偽反，下“為君”、“為使人”皆同。與音餘，下同。子思曰：“古之君子，進人以禮，退人以禮，故有舊君反服之禮也。今之君子進人若將加諸膝，退人若將隊諸淵，毋為戎首，不亦善乎？又何反服之禮之有？”言放逐之臣，不服舊君也。為兵主來攻伐曰戎首。○膝音悉。隊，本又作墜，直媿反。" }
      - { type: z, text: "“穆公”至“之有”。○正義曰：此一節論不為舊君著服之事。○注“仕焉”至“曾孫”。○正義曰：案《喪服》齊衰三月章為舊君凡有三條，其一雲“為舊君，君之母妻”，傳雲“仕焉而已者也”。注云：“謂老若有廢疾而致仕者”，兼服其母妻。其二“大夫在外，其妻長子為舊國君”，注云：“在外待放已去者”，傳雲“妻言與民同也，長子言未去也”，注云：“妻雖從夫而出，古者大夫不外娶，婦人歸宗往來猶民也，長子去可以無服”，此則大夫身不為服，唯妻與長子為舊君耳。其三為“舊君”，注云“大夫待放未去者”，傳曰“大夫去君，掃其宗廟，言其以道去君，而猶未絕也”，注云“以道去君，為三諫不從，待放於郊未絕者。言爵祿尚有列於朝，出入有詔於國”，若已絕則不服也。以此言之，凡舊君，若年老致仕，退歸在國不仕者，身為之服齊衰三月，並各服其母妻也。若三諫不從，待放已去而絕者，唯妻與長子服之，己則無服。若待放未去，爵位未絕，身及妻子皆為之服。然則去仕他國，己絕之後，不服舊君。而《雜記》雲“違諸侯，之大夫，不反服”，則違諸侯之諸侯反服，得為舊君服者，《雜記》所云，謂不便其居，或闢仇讎，有故不得在國者。故《孟子》：“齊宣王問孟子云：‘禮為舊君有服，何如斯可為服矣？’《孟子》對曰：‘諫行言聽，膏澤下於民。有故而去，則君使人導之出疆，送至彼國，明其無罪。其所往三年不反，然後收其田裏。此之謂三有禮焉。如此者得為舊君反服矣。’”與《雜記》同。鄭注此雲“仕焉而已者”，取《喪服》第一條，謂年老致仕在國者。鄭必以第一條解之者，以穆公所問為舊君之反服，宜問喪服正禮，故以第一條致仕者解之。其實亦兼三諫未絕及有故出在他國者，故下子思雲“古之君子，進人以禮，退人以禮”是也。雲“穆公，魯哀公之曾孫”者，案者，案《世本》雲“哀公生悼公靈，靈生元公嘉，嘉生穆公不衍”是也。○注“言放逐之臣，不服舊君也”。○正義曰：言放逐之臣者，解經中今之君子進人退人不能以禮也。如此者不服舊君，謂三諫不從，去而已絕，及不能三諫，闢罪逃亡。言“放”者，則宣元年“晉放其大夫胥甲父於衛”是也。言“逐”者，則《春秋》諸侯大夫言出奔是也。" }
      - { type: j, text: "悼公之喪，季昭子問於孟敬子曰：“為君何食？”悼公，魯哀公之子。昭子，康子之曾孫，名強。敬子，武伯之子，名捷。○捷，在接反。敬子曰：“食粥，天下之達禮也。吾三臣者之不能居公室也，四方莫不聞矣。言鄰國皆知吾等不能居公室，以臣禮事君也。三臣，仲孫、叔孫、季孫也。勉而為瘠，則吾能，毋乃使人疑夫不以情居瘠者乎哉？我則食食。”存時不盡忠，喪又不盡禮，非也。孔子曰：“喪事不敢不勉。”○瘠，徐在益反。夫音扶。食食，上如字，下音嗣。" }
      - { type: j, text: "衛司徒敬子死，司徒，官氏，公子許之後。子夏吊焉，主人未小斂，絰而往。子游吊焉，主人既小斂，子游出絰，反哭。皆以朋友之禮往，而二人異。子夏曰：“聞之也與？”曰：“聞諸夫子，主人未改服，則不絰。”" }
      - { type: z, text: "“衛司”至“不絰”。○正義曰：此一節論吊者主人改服乃改服之事。○注“皆以”至“人異”。○正義曰：此唯雲“絰”，鄭知是朋友者，凡吊者主人成服，則客乃服吊絰，今此隨主人，主人始小斂未成服，而已便出著絰，故知有緦之恩，隨主人變，如五服親也。又至小斂出絰反哭，與子游前裼裘吊朋友同也，前子游雲“帶絰”，故知是朋友。此下不雲“帶”，知是朋友者，凡吊則應弁絰環絰之屬也。此雖不雲“帶”，凡單雲“絰”，則知有帶，猶如《喪服》雲“苴絰”，《檀弓》為師“二三子皆絰而出”，及“朋友群居則絰”，皆是包“帶”之文也。" }
      - { type: j, text: "曾子曰：“晏子可謂知禮也已，恭敬之有焉。”言禮者，敬而已矣。有若曰：“晏子一狐裘三十年，遣車一乘，及墓而反。國君七個，遣車七乘，大夫五個，遣車五乘。晏子焉知禮？”言其大儉偪下，非之。及墓而反，言其既窆則歸，不留賓客有事也。人臣賜車馬者，乃得有遣車。遣車之差，大夫五，諸侯七，則天子九。諸侯不以命數，喪數略也。個，謂所包遣奠牲體之數也。《雜記》曰：“遣車視牢具。”○遣，棄戰反。乘，繩證反。個，古賀反。焉，於虔反。木音泰，或他佐反。逼音逼，本或作逼。包，伯交反。曾子曰：“國無道，君子恥盈禮焉。國奢則示之以儉，國儉則示之以禮。”時齊方奢，矯之是也。" }
      - { type: z, text: "“曾子”至“以禮”。○正義曰：此一節論晏子故為非禮以矯齊之事。○有子者，孔子弟子有若也。聞曾子說晏子知禮，故舉晏子不知禮之事以拒曾子也。狐裘貴在輕新，而晏子一狐裘三十年，是儉不知禮也。“遣車一乘”者，其父晏桓子是大夫，大夫遣車五乘，其葬父唯用一乘，又是儉失禮也。○“及墓而反”者，“及墓”謂葬時也。禮，窆後孝子贈幣辭親，辭親畢，而親情賓客應是送別，別竟乃反。於時晏子窆竟則反，賓客並去，又是儉失禮也。○“國君七個，遣車七乘，大夫五個，遣車五乘”者，此更舉正禮以證晏子失禮也。“個”謂所包遣奠牲體臂臑也。折為七段五段，以七乘五乘遣車載之。今晏子略不從禮數，是不知也。○“晏子焉知禮”者，條失事已竟，故此並結晏子焉知禮也。○注“言其”至“非之”。○正義曰：“大儉”解三十年一狐裘，並“及墓而反”也。“偪下”解一乘也。“下”謂其子及凡在巳下者也。大夫五乘，適子三乘，今其父自用一乘，則其子更無，是“偪下”也。○注“及墓”至“牢具”。○正義曰：經唯雲“及墓而反”，鄭知不以及墓而反，而云“既窆則歸”者，晏子雖為儉約，不應柩未入壙則歸，故云“既窆”也。雲“不留賓客有事也”者，案《既夕禮》：“乃窆，主人哭，踴無筭，襲，贈用制幣玄纁束。拜稽顙，踴如初。卒，袒，拜賓，主婦亦拜賓。賓出，則拜送。藏器於旁，加見。藏苞筲於旁，加杭席。覆之，加杭木。實士三，主人拜鄉人，乃反哭。”今晏子既窆，贈幣，拜稽顙，踴訖則還，不復拜賓及送賓之事，故云“不留賓客有事也”。雲“人臣賜車馬者，乃得有遣車”者，案《士喪禮》無遣車，諸侯之士一命。《曲禮》雲：“三賜不及車馬。”故諸侯之士無遣車也。若諸侯大夫，雖未三命，以其位尊，故得有遣車。知天子遣車九乘者，案《雜記》諸侯七月而卒哭，天子則九月而卒哭。今諸侯七乘，故知天子九乘也。雲“諸侯不以命數，喪數略也”者，案《大行人》上公九乘，侯伯七乘，子男五乘，今總雲七乘，是不以命數，喪事略也。引“《雜記》雲：遣車視牢具”者，以證經個與遣車首墁，故云個是牢具也。故《雜記》注云：“天子大牢包九個，諸侯亦大牢包七個，大夫亦大牢包五個，士少牢包三個。”案《既夕禮》“苞牲取下體”，鄭注：“前脛折取臂、臑，後脛折取骼。”是一牲取三體。士少牢二牲，則六體也。分為三個，一個有二體。然大夫以上，皆用大牢，牲有三體，凡九體。大夫九體分為十五段，三段為一包，凡為五包。諸侯分為二十一段，凡七包。天子分為二十七段，凡九包。蓋尊者所取三體，其肉多。卑者雖取三體，其肉少。鄭又云：“天子遣奠用馬牲，其取個未詳也。”此遣奠所包，皆用左胖，以其喪禮反吉。《士虞禮》“載左胖也”。" }
      - { type: j, text: "國昭子之母死，問於子張曰：“葬及墓，男子、婦人安位？”國昭子，齊大夫。子張曰：“司徒敬子之喪，夫子相，男子西鄉，婦人東鄉。”夾羨道為位。夫子，孔子也。○相，息亮反，下注同。鄉，許亮反，下皆同。俠，古洽反，一音頰。羨，徐音賤，《音義隱》雲：“羨，車道。”曰：“噫！毋。”噫，不寤之聲。毋，禁止之辭。○噫，本又作意，同，於其反。毋音無。曰：“我喪也斯沾。斯，盡也。沾讀曰覘。覘，視也。國昭子自謂齊之大家，有事人盡視之，欲人觀之，法其所為。○斯音賜。沾依注音覘，敕廉反。爾專之，賓為賓焉，主為主焉。專猶司也。時子張相。婦人從男子皆西鄉。”非也。" }
      - { type: z, text: "“國昭”至“西鄉”。○正義曰：此一節論葬之在壙，男女面位之事。○“曰：噫，毋”者，止子張也。子張既相，以男子西鄉，婦人東鄉，而昭子不悟禮意，乃曰：“噫，毋得如是男子西鄉，婦人東鄉。”既止子張，又自言我居喪也，既是齊之大家。斯，盡也。人盡來覘視於我，當須更為別禮，豈得以依舊禮。專猶同也。爾當同此婦人與男子一處，若婦女之賓為賓位焉，與男子之賓同處，婦女之主為主位焉，與男子之主同處。於是昭子家婦人從男子皆西鄉，同在主位，賓之男子及賓之婦人皆西廂東鄉。言非也。" }
      - { type: j, text: "穆伯之喪，敬姜晝哭。文伯之喪，晝夜哭。孔子曰：“知禮矣。”喪夫不夜哭，嫌思情性也。文伯之喪，敬姜據其床而不哭，曰：“昔者吾有斯子也，吾以將為賢人也。蓋見其有才藝。吾未嘗以就公室。未嘗與到公室，觀其行也。季氏，魯之宗卿，敬姜有會見之禮。○行，下孟反。見，賢遍反，下文“不敢見”同。今及其死也，朋友諸臣未有出涕者，而內人皆行哭失聲。斯子也，必多曠於禮矣夫。”內人，妻妾。○夫音扶，下同，本亦有無“夫”字者。" }
      - { type: z, text: "“穆伯”至“矣夫”。○正義曰：此一節論喪夫不夜哭，並母知子賢愚之事。○“斯子也，必多曠於禮矣夫”。○正義曰：斯，此也。曠猶疏薄也。言此子平生為行，必疏薄於賓客朋友之禮，故賓客朋友未有感戀為之出涕者。此不哭者，謂暫時不哭，故上雲“晝夜哭”是也。案《家語》雲：“文伯歜卒，其妻妾皆行哭失聲。敬姜戒之曰：‘吾聞好外者士死之，好內者女死之。今吾子早夭，吾惡其好內聞也。二三婦共祭祀者，無加服。’孔子聞之曰：‘女智莫若公父氏之婦，知禮矣。’”與此不同者，彼戒婦人而成子之德，此論子之惡，各舉一邊，相包乃具。" }
      - { type: j, text: "季康子之母死，陳褻衣。褻衣，非上服。陳之，將以斂。敬姜曰：“婦人不飾，不敢見舅姑。將有四方之賓來，褻衣何為陳於斯？”命徹之。言四方之賓來，嚴於舅姑。敬姜者，康子從祖母。○從，才用反。" }
      - { type: z, text: "注“敬姜者，康子從祖母”。○正義曰：案《世本》：“悼子紀生平子意如，意如生桓子斯，斯生康子肥。”《世本》又云：“悼子紇生穆伯靖。”靖與意如是親兄弟，意如是康子祖，穆伯是康子祖之兄弟，敬姜是穆伯之妻，故云“康子從祖母”也。" }
      - { type: j, text: "有子與子游立，見孺子慕者，有子謂子游曰：“予壹不知夫喪之踴也，予欲去之久矣。情在於斯，其是也夫。”喪之踴猶孺子之號慕。○去，羌呂反。號，戶刀反。子游曰：“禮有微情者，節哭踴。有以故興物者，衰絰之制。有直情而逕行者，戎狄之道也。哭踴無節，衣服無制。○徑，古定反。禮道則不然。與戎狄異。人喜則斯陶，陶，鬱陶也。○陶，徒刀反。陶斯詠，詠，謳也。○詠音詠。謳，本亦作嘔，鳥侯反。詠斯猶，猶當為搖，聲之誤也。搖謂身動搖也，秦人猶、搖聲相近。○猶依注作搖，音遙。近，附近之近。猶斯舞，手舞之。舞斯慍，慍猶怒也。慍斯戚，戚，憤恚。○慍斯戚，紆運反。此喜怒哀樂相對，本或於此句上有“舞斯慍”一句，並注皆衍文。憤，扶粉反。恚，一瑞反。戚斯歎，歎，吟息。○吟，本或作唫，魚金反。歎斯闢，闢，拊心。○闢，婢亦反，撫心也。闢斯踴矣。踴，躍。○躍，羊灼反。品節斯，斯之謂禮。舞踴皆有節，乃成禮。人死，斯惡之矣。無能也，斯倍之矣。無能，心謂之無所復能。○惡，烏路反。倍音佩，下同。復，扶又反。是故制絞衾，設蔞翣，為使人勿惡也。絞衾，屍之飾。蔞翣，棺之牆飾。《周禮》蔞作柳。○絞衾，戶交反，下音飾。蔞音柳。翣，所甲反。始死，脯醢之奠。將行，遣而行之。既葬而食之。將行，將葬也。葬有遣奠。食，反虞之祭。○食音嗣，注同，謂虞祭也。未有見其饗之者也。自上世以來，未之有舍也，為使人勿倍也。舍猶廢也。○舍音舍，注同。故子之所剌於禮者，亦非禮之訾也。”訾，病也。○訾，似斯反。" }
      - { type: z, text: "“有子”至“訾也”。○正義曰：此一節論子游言制禮有節之事。○“有子與子游同立，見孺子號慕者，有子謂子游曰：予壹不知夫喪之踴也”，言我專壹，不知夫喪之踴也，何須有節？直似孺子慕者，其事足矣。予欲去此踴節，其意久矣。斯，此也。言孝子之情在於此，小兒直號慕而已。“其是也夫”，但如小兒，其事即是，何須為哭踴之節。子游乃對之曰：“禮有微情者。”微，殺也。言若賢者喪親，必致滅性，故制使三日而食，哭踴有數，以殺其內情，使之俯就也。何胤雲：“哭踴之情，必發於內。謂之微，微者，不見也。”○“有以故興物”者，興，起也。“物”謂衰絰也。若不肖之屬，本無哀情，故為衰絰，使其睹服思哀，起情企及也。引由外來，故云“興物”也。然衰絰之用，一則為孝子至痛之飾，二則使不肖之人企及，今止說“興物”以對，微情之故。“有直情而逕行者，戎狄之道也”，謂直肆巳情而逕行之也，無哭踴節制，乃是戎狄之道。○“禮道則不然”者，“然”猶如是也，言中國禮道則不如是夷狄也。○“人喜則斯陶”者，為明踴以節，而踴由心哀，故此以下極言哀樂之本也。喜者，外竟會心之謂也。斯，語助也。陶者，鬱陶。鬱陶者，心初悅而未暢之意也。言人若外竟會心，則懷抱欣悅，但始發俄爾，則鬱陶未暢，故云“斯陶”也。《爾雅》雲：“鬱陶，繇喜也。”何胤雲：“陶，懷喜未暢意也。《孟子》曰：‘鬱陶以思君。’”○“陶斯詠”者，詠，歌詠也。鬱陶情轉暢，故口歌詠之也。○“詠斯猶”者，搖動身也。詠歌不足，漸至自搖動身體也。“猶斯舞”者，舞，起舞也。搖身不足，乃至起舞，足蹈手揚，樂之極也。○“舞斯慍”者，慍，怒也，外竟違心之謂也。凡喜怒相對，哀樂相生，故若舞而無節，形疲厭倦，事與心違，故所以怒生。怒生由於舞極，故云“舞斯慍”也。故《曲禮》雲：“樂不可極。”即此謂也。何胤雲：“樂終則慍起，非始之慍相連系也。”○“慍斯戚”者，戚，憤恚也。怒來戚心，故憤恚起也。此句對“喜斯陶”也。○“戚斯歎”者，歎，吟息也。憤恚轉深，故因發吟息也。此句對“陶斯詠”。○“歎斯闢”者，闢，撫心也。歎息不洩，故至撫心也。此句對“詠斯猶”。○“闢斯踴矣”者，撫心不洩，乃至跳踴奮擊，亦哀之極也。此句對“猶斯舞”也。○“品節斯，斯之謂禮”者，品，階格也。節，制斷也。斯，此也。此之謂於哀樂也。若喜而不節，自陶至舞，俄傾不慍生。若怒而不節，從戚至踴，踴極則笑，故夷狄無禮，朝殞夕歌，童兒任情，倏啼欻笑。今若品節此二塗，使踴舞有數，有數則久長，故云此之謂禮。如鄭此《禮》本雲“舞斯慍”者，凡有九句，首末各四，正明哀樂相對。中央“舞斯慍”一句，是哀樂相生，故一句之中，有“舞”及“慍”也。而鄭諸本亦有無“舞斯慍”一句者，取義不同。而鄭又一本雲：“舞斯蹈，蹈斯慍”，益於一句，凡有十句，當是後人所加耳，亦不得對。而盧《禮》本亦有“舞斯慍”之一句。而王《禮》本又長雲“人喜則斯循，循斯陶”，既與盧、鄭不同，亦當新足耳。○“人死斯惡之矣”者，以上明闢踴之節，以下明飾喪以奠祭之事。“人死斯惡之”者，以人身既死，形體腐敗，故惡之，故倍之。以其恐惡之，故制絞紟衾，設蔞翣以飾之，故使人勿惡也。以其恐倍之，故始死設脯醢之奠，以至於葬，將行之，又設遣奠而行送之，既葬反哭，設虞祭以食之。雖設奠祭，未曾見其死者而饗食之也。既不饗食，自上世以來，未之有舍此奠祭而不為者也，所以設奠祭者，為使人勿倍其親故也。禮意既然，不可無節，故子之所譏剌於禮有踴節者，亦非禮之病害也。言哭踴有節，正是禮之所宜，非禮之病。上有若見孺子之慕，唯譏哭踴有節，不譏絞衾奠祭之事，子游秖應答以闢踴即止。今更陳絞衾、脯醢之事者，以有若之意，欲直同孺子，生者不節其哀，死者不加其飾，故子游既言生節哀，遂說死者加飾，備言禮之節制與夷狄不同也。" }
      - { type: j, text: "吳侵陳，斬祀殺厲。祀，神位有屋樹者。厲，疫病。吳侵陳，以魯哀元年秋。○疫音役。師還出竟，陳大宰嚭使於師，夫差謂行人儀曰：“是夫也多言，盍嘗問焉？師必有名，人之稱斯師也者，則謂之何？”大宰、行人，官名也。夫差，吳子光之子。盍，何不也。嘗猶試也。夫差修舊怨，庶幾其師有善名。○還音旋。竟音境。大音泰，注及下文注“大宰”、“大師”、“大史”、“大廟”、“大傅”皆同。嚭，普彼反。使，色吏反。夫差音扶，下初佳反，吳王名，闔廬子。盍，戶臘反。大宰嚭曰：“古之侵伐者，不斬祀，不殺厲，不獲二毛。獲謂系虜之。二毛，鬢髮斑白。○斑，伯山反，本又作頒，音同。今斯師也，殺厲與？其不謂之殺厲之師與？”欲微切之，故其言似若不審然，正言殺厲，重人。○與音餘，下及注“有此與”同。曰：“反爾地，歸爾子，則謂之何？”子謂所獲民臣。曰：“咀荃討敝邑之罪，又矜而赦之，師與有無名乎？”又微勸之，終其意。吳楚僣號稱王。" }
      - { type: z, text: "“吳侵”至“名乎”。○正義曰：此一節明徵伐不合斬祀殺厲之事，各依文解之。○注“吳侵”至“年秋”。○正義曰：知者，案《左傳》：“吳伐楚，使召陳懷公，懷公朝國人而問焉，曰：‘欲與楚者右，欲與吳者左。陳人有田從田，無田從黨。’逢滑當公而進，曰：‘楚未可棄，吳未可從。’陳懷公遂不從吳子光之召。至今夫差克越，乃修先君之怨。秋八月，吳侵陳，修舊怨。”是其事。案哀六年吳伐陳，鄭知非六年者，稱“伐”不雲“侵”。哀元年經雖不見，傳雲“吳侵陳”，與此文同，俱雲“侵”，故為哀元年。○“夫差”至“之何”。○夫差既見陳大宰嚭來，謂行人之官名儀曰：“是夫也多言。”夫，謂大宰嚭，言是大宰嚭也，博聞強識，多有所言。盍，何不也。嘗，試也。何不試就問焉。我脩先君之怨而興此師，必有善名在外，眾人稱此師也，則謂之何？欲令行人儀以此辭而問大宰嚭也。○注“大宰”至“之子”。○正義曰：據《周禮》有大宰卿一人，又有大、小行人，故知大宰及行人皆官名。此大宰嚭與吳大宰嚭名號同而人異也。雲“夫差，吳子光之子”者，《世本》及《吳世家》文也。○“古之侵伐者，不斬祀，不殺厲，不獲二毛”。○此謂以至勝攻至暴，用兵如此。若兩軍相敵則不然。《左傳》雲：“雖及胡耈，獲則取之。”大宰嚭特舉古之善以駮吳師之惡。○注“正言殺厲重人”。○正義曰：以其殺人，故重於斬祀。若其不殺，直拘囚人而已，則輕也。故《穀梁傳》雲：“苞人民歐牛馬曰侵，斬樹木壞宮室曰伐。”是侵輕而伐重也。○“師與有無名乎”者，既反地歸子，其事既善，師豈有無善名乎？言必有善名也。“與是”語辭。○注“又微勸之，終其意”。○正義曰：上以“微切之”，謂譏斬祀殺厲，今復勸之反地歸子，故言“又”也。因吳王反地歸子，則雲師有善名，是“微勸之”也。“終其意”者，上譏切斬祀及殺厲，是初有其意，欲吳哀矜，既得吳哀矜，則雲師有善名，是終竟其欲哀矜之意。" }
      - { type: j, text: "顏丁善居喪，顏丁，魯人。始死，皇皇焉如有求而弗得。及殯，望望焉如有從而弗及。既葬，慨焉如不及其反而息。從，隨也。慨，憊貌。○慨，皆愛反。憊，皮拜反。" }
      - { type: z, text: "“顏丁”至“而息”。正義曰：此一節論孝子居喪哀殺有漸之事。○“始死，皇皇焉如有求而弗得”者，“皇皇”猶彷徨，如所求物不得。上《檀弓》雲：“始死，充充如有窮。”謂形貌窮屈，亦彷徨求而不得之心。彼此各舉其一。○“及殯，望望焉如有從而弗及”者，謂殯後容貌望望焉，如有從逐人後行而不及之。上《檀弓》雲“既殯，瞿瞿如有求而不得”，與此亦同也。但始死，據內心所求，殯後，據外貌所求，故此經始死求而不得，據內心也。上《檀弓》雲“既殯，求而不得”，據外貌也。○“既葬，慨焉如不及”者，謂既葬之後，中心悲，慨然如不復所及。既不可及，“其反而息”者，上殯後雲從而不及，似有可及之理。“既葬，慨焉如不及”，謂不復可及，所以文異也。上《檀弓》雲：“既葬，皇皇如有望而不至。”此謂“既葬慨焉如不及”，亦同也。此“始死，皇皇”者，是皇皇之甚，故云“如有求而弗得”。上《檀弓》雲“既葬，皇皇”是輕，故云“望而不至”。此既葬則止，不說練祥，故葬後則慨然。止《檀弓》葬後更說練祥，故云：“練而慨然，祥而廓然。”但親之死亡，哀悼在心，初則為甚，已後漸輕，皆有求而不得，望而不及，但所據有淺深耳。殯後雖據外貌，亦猶哀在內心，但稍輕耳，故鄭註上《檀弓》雲：“皆哀悼在心之貌。”" }
      - { type: j, text: "子張問曰：“《書》雲：‘高宗三年不言，言乃讙。’有諸？”時人君無行三年之喪，禮者問有此與？怪之也。讙，喜說也。言乃喜說，則民臣望其言久。○讙音歡。說音悅，下同。仲尼曰：“胡為其不然也？古者天子崩，王世子聽於冢宰三年。”冢宰，天官卿，貳王事者，三年之喪，使之聽朝。" }
      - { type: z, text: "“子張”至“三年”。○正義曰：此一節論世子遭喪冢宰聽政之事。○“言乃讙”者，《尚書·無逸》雲：“言乃雍。”雍、讙字相近，義得兩通，故鄭隨而解之。" }
      - { type: j, text: "知悼子卒，未葬。悼子，晉大夫荀盈，魯昭九年卒。○知音智，下同。平公飲酒，與群臣燕。平公，晉侯彪。○彪，彼虯反。師曠、李調侍，侍，與君飲也。《燕禮記》曰：“請旅侍臣。”○李調如字，《左傳》作“外嬖嬖叔”。鼓鍾。樂作也。《燕禮》賓入門奏《肆夏》，既獻而樂闋，獻君亦如之。○闋，古穴反，止也。杜蕢自外來，聞鐘聲，曰：“安在？”怪之也。杜蕢或作屠蒯。○蕢，古怪反，注蒯同。屠音徒。曰：“在寢。”燕於寢。杜蕢入寢，歷階而升，酌，曰：“曠飲斯。”又酌，曰：“調飲斯。”又酌，堂上北面坐飲之。降，趨而出。三酌皆罰。○曠飲，於鴆反，下“飲斯”、“飲之”、“飲曠”、“飲調”、“飲寡人”皆同。平公呼而進之曰：“蕢，曩者爾心或開予，是以不與爾言。曩，曏也，謂始來入時。開謂諫爭有所發起。○曩，乃黨反。向，本又作曏，同，許亮反。爭，爭鬥之爭。爾飲曠何也？”曰：“子卯不樂，紂以甲子死，桀以乙卯亡，王者謂之疾日，不以舉樂為吉事，所以自戒懼。○子卯不樂，如字，賈逵雲：“桀以乙卯日死，受以甲子日亡，故以為戒。”鄭同。《漢書》翼奉說則不然。張宴雲：“子刑卯，卯刑子，相刑之日，故以為忌。而云夏殷亡日，不推湯武以興乎？”疾日，人一反。知悼子在堂，斯其為子卯也大矣。言大臣喪重於疾日也。《雜記》曰：“君於卿大夫，比葬，不食肉，比卒，哭，不舉樂。”○比，必利反，下同。曠也大師也，不以詔，是以飲之也。”詔，告也。大師典奏樂。“爾飲調何也？”曰：“調也，君之褻臣也，為一飲一食，亡君之疾，是以飲之也。”言調貪酒食。褻，嬖也。近臣亦當規君疾憂。○為，於偽反。嬖，必計反。“爾飲何也？”曰：“蕢也，宰夫也。非刀匕是共，又敢與知防，是以飲之也。”防禁放溢。○匕，必李反。共音供。與音預。防音房，又扶放反。平公曰：“寡人亦有過焉，酌而飲寡人。”聞義則服。杜蕢洗而揚觶。舉爵於君也，《禮》揚作騰。揚，舉也。騰，送也。揚近得之。○觶，之豉反，《字林》音支，又云：“酒器。”近，附近之近，下“聲相近”同。公謂侍者曰：“如我死，則必無廢斯爵也。”欲後世以為戒。至於今，既畢獻，斯揚觶，謂之杜舉。此爵遂因杜蕢為名。畢獻，獻賓與君。" }
      - { type: z, text: "“知悼”至“杜舉”。○正義曰：此一節論君有大臣之喪，不得有作樂飲酒之事，各依文解之。○注“悼子”至“年卒”。○正義曰：並《左傳》文。下注雲“平公，晉侯彪”，亦《春秋》文。○注“《燕禮記》曰：請旅侍臣”。○正義曰：案《燕禮記》雲：“凡公所酬，既拜，請旅侍臣。”謂公既酬臣，臣受酬者，既拜謝公恩，請行旅酬於侍臣。引之者，證師曠、李調是侍飲之臣也。鼓鍾，鼓猶奏也，謂燕奏鐘樂也。○注“燕禮”至“如之”。○正義曰：案《燕禮記》雲：“若以樂納賓，則賓及庭，奏《肆夏》。賓拜酒，主人答拜，而樂闋。”是“賓入門奏《肆夏》，既獻而樂闋”。《燕禮記》又云：“公拜受爵，而奏《肆夏》。公卒爵，主人升，受爵以下，而樂闋。”是“獻君亦如之”。經唯雲“鼓鍾”，《燕禮》雲“若舞則《勺》”，知非工入升歌，下管間歌，合樂之後，無時奏鍾，必以為賓初入門奏《肆夏》者，以《鍾師》雲“以鐘鼓奏《九夏》”，故知聞鍾是初奏《肆夏》也。○注“杜蕢或作屠蒯”。○正義曰：《春秋》作“屠蒯”，故云“或作屠蒯”。杜蕢、屠蒯聲相近，故《禮》、《傳》不同也。○注“燕於寢”。○正義曰：《燕禮記》雲“燕朝服於寢”，故知“燕於寢也”。○“曰蕢”至“爾言”。曩，曏也。平公呼蕢而進之，呼其名曰：“蕢，曏者汝酌三酌，是汝之心，或開發於予。予望汝有諫，是以不與汝言。”○注“紂以甲子死，桀以乙卯亡”。○正義曰：案《尚書》：“時甲子昧爽，武王朝，至於商郊。”又《史記》雲，兵敗，紂自焚而死。是紂甲子死也。案昭十八年二月乙卯，“周毛得殺毛伯過而代之。萇弘曰：‘毛得必亡，是昆吾稔之日也。’”《詩》雲：“韋顧既伐，昆吾夏桀。”同誅昆吾，既乙卯而亡，明桀亦以乙卯被放也。鄭司農注《春秋》，以為五行子卯自刑，非鄭義也，今所不用也。○“斯其為子卯也大矣”者，言悼子喪在堂，此比其為子卯之忌大矣。言悼子之喪，大於子卯。○“為一飲一食，忘君之疾，是以飲之也”者，調是君之嬖褻之臣，臣當規正君過，唯欲行燕會，貪求一飲一食，忘君違禮之疾而不諫，是以飲之。○“非刀匕是供，又敢與知防”者，蕢言調是君之嬖褻臣也，當規正君憂疾，言巳身是宰夫，亦當規正於君，若非因刀匕是共，又敢與知防諫之事。皇氏雲：“非，不也。杜蕢言各憂其事，宰夫不以刀匕是共，乃又敢與諫爭，越官侵職，是以飲也。”○注“舉爵”至“得之”。○正義曰：知“揚觶”是舉爵於君，以上雲“平公曰：寡人亦有過焉，酌而飲寡人”，即雲“杜蕢洗而揚觶”，故知“舉爵於君”。案《燕禮》獻君之後，行酬之初，媵爵者洗象觶，升實之序，進坐奠於薦南，是舉爵於君也。“揚作騰”者，謂《燕禮》大射凡舉爵皆為媵。此雲揚觶，鄭雲：揚，舉也。《燕禮》雲媵，故鄭雲：媵，送也。揚、騰義得兩通。但此雲“杜舉”，“揚”訓為“舉”，故“揚近得之”，此謂舉為得也。○“公謂”至“杜舉”。○公謂侍者，雲我死之後，則必無廢棄此爵，恆當留之，為後鑑戒。當時在未獻之前，故又語侍者雲：“至於今，既畢獻之後，此所揚之觶，是謂之杜舉。”表明此爵實杜蕢所舉。○注“畢獻，獻賓與君”。○正義曰：知“獻君與賓”者，與杜蕢此事舉爵在燕禮之初，賓主既入，得杜蕢之言，不可即廢。唯獻君與賓，燕事則止。皇氏以為“至於今”，謂記錄之人至於今為記之時，謂之杜舉。《春秋》雲：“晉侯飲酒樂，膳宰屠蒯趍入，請佐公使尊，許之。而遂酌以飲工。曰：‘女為君耳，將司明也。辰在子卯，謂之疾日，君徹宴樂，學人舍業，為疾故也。君之卿佐，是謂股肱。股肱或虧，何痛如之？女弗聞而樂，是不聰也。’又飲外嬖嬖叔曰：‘女為君目，將司明也。服以旌禮，以行事，事有其物，物有其容。今君之容，非其物也，而女不見，是不明也。’亦自飲，曰：“味以行氣，氣以實志，志以定言，言以出令。臣實司味，二御失官，而君弗命，臣之罪也。”案《春秋》與此小異，亦所聞不同，或二文互相足也。" }
