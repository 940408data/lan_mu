# 爾雅注疏卷10（邢昺疏）：j 為經文＋晉郭璞注，z 為疏文。
sections:
  - id: juan10
    name: 正文
    blocks:
      - { type: z, text: "\"释乐第七\"。○释曰：案《乐记》云：\"乐者，乐也，君子乐得其道，小人乐得其欲也。\"《说文》云：\"乐，五声八音之总名。象鼓鞞之形。木，虡也。白，歌也。又象锺磬也。\"五声者，商、角、宫、徵、羽也。《律历志》云：\"商之为言章也，物成孰可章度。角，触也。物触地而出，戴芒角也。宫，中也。居中央，畅四方，唱始施生，为四声纲也。徵，祉也，物盛大而繁祉也。羽，宇也，物聚藏宇覆之也。\"又云：\"八音：土曰埙，匏曰笙，皮曰鼓，竹曰管，丝曰弦，石曰磬，金曰锺，木曰柷。\"此篇总释五声之名及八音之器，故名\"释乐\"也。" }
      - { type: j, text: "宫谓之重，商谓之敏，角谓之经，徵谓之迭，羽谓之柳。（皆五音之别名。其义未详。○徵，之矢反）" }
      - { type: z, text: "\"宫谓\"至\"之柳\"。○释曰：案此文则宫一名重，商一名敏，角一名经，徵一名迭，羽一名柳。但未见义所出也。注\"皆五\"至\"未详\"。○释曰：云\"皆五音\"者，案郑玄注《乐记》云\"杂比曰音\"，谓宫、商、角、徵、羽清浊相杂和比谓之音。\"单出曰声\"，谓五声之内唯单有一声，更无馀声相杂也。然则初发口单出者谓之声，众声和合成章谓之音，金、石、干、戚、羽、旄谓之乐，则声为初，音为中，乐为末。此云五音者，举中而言也。云\"之别名\"者，谓重、敏、经、迭、柳是宫、商、角、徵、羽之别名也。云\"其义未详\"者，以《尔雅》之作以释六艺，今经典之中无此五名，或在亡逸中，不可得而知其义，故未详。案孙叔然云：\"宫浊而迟，故曰重也。\"孙氏虽有此说，更无经据，故不取也。" }
      - { type: j, text: "大瑟谓之洒。（长八尺一寸，广一尺八寸，二十七弦。○洒，所蟹反）" }
      - { type: z, text: "\"大瑟谓之洒\"。注\"长八\"至\"七弦\"。○释曰：瑟者，登歌所用之乐器也，故先释之。《世本》曰：\"庖牺作五十弦，黄帝使素女鼓瑟，哀不自胜，乃破为二十五弦，具二均声。\"《礼图》旧云：\"雅瑟长八尺一寸，广一尺八寸，二十三弦，其常用者十九弦，其馀四弦谓之番。番，赢也。颂瑟长七尺二寸，广尺八寸，二十五弦，尽用之。\"熊氏云：\"瑟两头有孔，其在厎下者名越。\"《乡饮酒礼》云：\"二人皆左何瑟，後首，挎越。\"注云：\"越，瑟下孔也。\"《燕礼》云：\"小臣左何瑟，面鼓，执越。\"注云：\"越，瑟下孔也。若用之祭祀，则练其弦，疏其越。《乐记》云：\"《清庙》之瑟，朱弦而疏越。\"郑注云：\"朱弦，练朱弦，练则声浊。越，瑟下孔也。画疏之，使声迟也。以其不练则体劲而声清，练则丝熟而声浊也。疏，通也。使两头孔相连而通也。孔小则声急，孔大则声迟故也。其大者别名洒。孙叔然云：\"音多变，布如洒出也。\"郭云\"二十七弦\"，未见所出。" }
      - { type: j, text: "大琴谓之离。（或曰琴大者二十七弦，未详长短。《广雅》曰：\"琴长三尺六寸六分，五弦）" }
      - { type: z, text: "\"大琴谓之离\"。注\"或曰\"至\"五弦\"。○释曰：《琴操》曰：\"伏羲作琴。\"《世本》云：\"神农作琴。\"《白虎通》曰：\"琴者禁也，禁止於邪，以正人心也。\"琴之大者别名离也。孙叔然云：\"音多变，声流离也。\"云\"或曰琴大者二十七弦，未详长短\"者，或人言琴有二十七弦，是琴之大者也，但未详其长短耳。云\"《广雅》曰：琴长三尺六寸六分，五弦\"者，此常用之琴也，象三百六十六日，五弦象五行，大弦为君，小弦为臣，文王、武王加二弦，以合君臣之恩也。又五弦第一弦为宫，其次商、角、徵、羽，文武二弦为少宫、少商。又《琴操》曰：\"广六寸，象六合也。\"又上曰池，言其平。下曰滨，言其服。前广後狭，象尊卑，上圆下方，法天地。然琴为乐器，通见《诗》、《书》，故此释之也。" }
      - { type: j, text: "大鼓谓之鼖，（鼖长八寸。○鼖，坟）小者谓之应。（《诗》曰\"应朄县鼓\"，在大鼓侧。○应音膺）" }
      - { type: z, text: "\"大鼓\"至\"之应\"。○释曰：别鼓大小之名也。鼓之大者名鼖。《周礼鼓人职》曰：\"以鼖鼓鼓军事是也。\"其小者名应，言声应於大鼓也。李巡云：\"小者声音相承，故曰应也。\"孙炎云：\"和应大鼓也。\"注\"鼖长八尺\"。○释曰：知者案《考工记》人为鼓，\"长八尺，鼓四尺，中围加三之一，谓之鼖\"。後郑注云：\"中围加三之一者，加於面之围以三分之一也。面四尺，其围十二尺，加以三分一，四尺，则中围十六尺，径五尺三寸三分寸之一也。今以合二十版，则版六寸三分寸之二耳。大鼓谓之鼖，以鼖鼓鼓军事。郑司农云鼓四尺，谓革所蒙者广四尺。\"○注\"《诗》曰\"至\"鼓侧\"。○释曰：\"应朄县鼓\"，《周颂•有瞽》篇文也。郑笺云：\"朄，小鼓，在大鼓旁。应，鼙之属也。\"案朄，引也，谓击小鼓引乐声。" }
      - { type: j, text: "大磬谓之毊。（毊形似犁錧，以玉石为之。○毊，虚骄反）" }
      - { type: z, text: "\"大磬谓之毊\"。○释曰：磬，乐器名也，以玉石为之。《世本》曰：\"无句作磬。\"《释名》云：\"磬，罄也，声坚罄罄然。\"《考工记》曰：\"磬氏为磬，倨句一矩有半，其博为一，股为二，鼓为三。参分其股博，去一以为鼓博。参分其鼓博，以其一为之厚。已上则磨其旁，已下则磨其耑。\"是其制也。大者名毊。孙炎云：\"毊，乔也。乔，高也。谓其声高也。\"李巡云：\"大磬声清燥也，故曰毊。毊，操也。注\"毊形\"至\"为之\"。○释曰：《字林》云：\"錧，田器也。\"自江而南呼犁刃为錧，此毊形似犁錧，但大尔。云\"以玉石为之\"者，《左传》云：\"玉磬纪甗。\"又八音谓磬为石。故知\"以玉石为之\"也。" }
      - { type: j, text: "大笙谓之巢，（列管瓠中，施簧，管端大者十九簧）小者谓之和。（十三簧者。《乡射记》曰：\"三簧一和而成声。\"）" }
      - { type: z, text: "\"大笙\"至\"之和\"。○释曰：《世本》云：\"随作笙。\"《礼记》曰：\"女娲之笙簧。\"《释名》曰：\"笙，生也。象物贯地而生。\"《说文》云：\"笙，正月之音。物生，故谓之笙。\"有十三簧，象凤之身。\"其大者名巢。巢，高也。言其声高。小者名和。李巡云：\"小者声少，音相和也。\"孙炎云：\"应和於笙。\"注\"列管\"至\"九簧\"。○释曰：瓠，匏也，以匏为底，故八音谓笙为匏。簧者，笙管之中金薄钅叶也。笙管必有簧，故或谓笙为簧。《诗•王风》云：\"左执簧。\"是也。大者十九簧，以时验而言也。注\"十三\"至\"成声\"。○释曰：云\"十三簧\"者，郑司农注《周礼》亦云\"十三簧\"，相传为然。云\"《乡射记》曰：三笙一和而成声\"者，彼郑注云：\"三人吹笙，一人吹和。\"是也。" }
      - { type: j, text: "大篪谓之沂。（篪以竹为之，长尺四寸，围三寸，一孔上出，一寸三分，名翘，横吹之。小者尺二寸。《广雅》云：\"八孔。\"○篪，池。沂，银）" }
      - { type: z, text: "\"大篪谓之沂\"。○释曰：李巡曰：\"大篪其声悲一也。\"孙炎曰：\"篪声悲。沂，悲也。\"《释名》曰：\"篪，啼也，声如婴儿啼。\"郭云：\"篪以竹为之，长尺四寸，围三寸，一孔上出寸三分，名翘，横吹之。小者尺二寸。《广雅》云：'八孔。'\"郑司农注《周礼》云：\"篪七空。\"盖不数其上出者，故七也。" }
      - { type: j, text: "大埙谓之嘂。（埙，烧土为之，大如鹅子，锐上，平底，形如称锤，六孔。小者如鸡子。○埙，喧。嘂，叫）" }
      - { type: z, text: "\"大埙谓之嘂\"。○释曰：《说文》云：\"埙，乐器名。从土，熏声。\"埙、壎古今字。《释名》云：\"埙，喧也，声浊喧喧然。\"大埙名嘂。孙炎曰：\"音大如叫呼声。\"郭云：\"埙，烧土为之，大如鹅子，锐上，平底，形如称锤，六孔。小者如鸡子。\"《周礼•小师》注云：\"埙，烧土为之，大如雁卵。\"郑司农亦云\"六孔\"，是相传为然也。《世本》云：\"暴辛公作埙。苏成公作篪。\"谯周《古史》云：\"古有埙篪，尚矣。周幽王时暴辛公善埙，苏成公善篪，记者因以为作，谬矣。\"《世本》之谬，信如周言。其云苏公、暴公所善，亦未知所出。盖以《诗•小雅》云：\"伯氏吹埙，仲氏吹篪。\"苏公剌暴公也，故致斯谬。" }
      - { type: j, text: "大钟谓之镛，（《书》曰：\"笙镛以间。\"亦名鑮。○鑮音博）其中谓之剽，小者谓之栈。" }
      - { type: z, text: "\"大钟\"至\"之栈\"。○释曰：此别钟大小之名也。《说文》云：\"钟，乐器也。\"《世本》云：\"垂作钟。\"《考工记》：\"凫氏为钟。\"《释名》曰：\"钟，空也，内空受气多。\"其大者名镛。李巡曰：\"大钟，音声大。镛，大也。\"孙炎曰：\"镛，深长之声。\"又名鑮。《大射礼》云：\"乐人宿县于阼阶东，笙磬西面，其南笙钟，其南鑮。\"郑云：\"鑮，如钟而大。\"是也。其不大不小者，名剽。孙炎曰：\"剽者，声轻疾也。\"李巡云：\"其中微小，故曰剽。剽，小也。其小者名栈。李巡云：\"栈，浅也。\"东晋太兴元年，会稽剡县人家井中得一钟，长三寸，口径四寸，上有铭古文，云栈，钟之小者，既长三寸，自然浅也。○注\"《书》曰：笙镛以间\"。○释曰：《尚书•益稷》篇文也。" }
      - { type: j, text: "大箫谓之言，（编二十三管，长尺四寸）小者谓之筊。（十六管，长尺二寸。箫，一名籁。○筊，音交）" }
      - { type: z, text: "\"大箫\"至\"之筊\"。○释曰：此别箫大小之名也。《风俗通》云：\"舜作箫。其形参差，以象凤翼。十管，长二尺。\"《博雅》曰：\"箫大者二十三管，无底。小者十六管，有底。\"其大者名言。李巡曰：\"大箫，声大者言言也。\"郭云：\"编二十三管，长尺四寸。\"其小者名茭。李巡曰：\"小者声扬而小，故言茭。茭，小也。\"郭云：\"十六管，长尺二寸。箫，一名籁。\"又《通卦验》云：\"箫长尺四寸，其言管数、长短虽异，要是编小竹管为之耳。\"" }
      - { type: j, text: "大管谓之簥，（管长尺，围寸，并漆之，有底。贾氏以为如篪，六孔。\"○簥，娇）其中谓之篞，小者谓之篎。（篞，乃结切。篎音眇）" }
      - { type: z, text: "\"大管\"至\"之篎\"。○释曰：别管大小之名也。大管名簥。李巡云：\"声高大，故曰簥。簥，高也。郭云：\"管长尺，围寸，并漆之，有底。贾氏以为如篪，六孔。\"《小师》注云：\"管如笛，形小，并两管而吹之。今大予乐官有之。\"是也。其中不大不小者，名篎。" }
      - { type: j, text: "大籥谓之产，（籥如笛，三孔而短小）其中谓之仲，小者谓之箹。" }
      - { type: z, text: "\"大籥\"至\"之箹\"。○释曰：籥，乐器名。其大者名产，其中者名仲，小者名箹。郭云：\"籥如笛，三孔而短小。\"《广雅》云：\"七孔。\"《周礼》：\"笙师掌教吹籥。\"郑注云：\"籥如笛，三空。\"《诗•邶风》云：\"左手执籥。\"毛传云：\"籥六孔。\"所见异也。" }
      - { type: j, text: "徒鼓瑟谓之步，（独作之）徒吹谓之和，徒歌谓之谣，（《诗》云：\"我歌且谣。\"○吹，昌睡切。和，去声）徒击鼓谓之咢，（《诗》云：\"或歌或咢。\"○咢，五各切）徒鼓钟谓之修，徒鼓磬谓之寋。（未见义所出。○寋，纪展切）" }
      - { type: z, text: "\"徒鼓瑟\"至\"之寋\"。○释曰：凡八音备作曰乐，一音独作，不得乐名，故此辨其异名也。徒，空也。郑注《周礼•小师》云：\"出音曰鼓。\"空作一器以出其音者，谓之徒鼓．故郭云\"独作之\"也。○注\"《诗》云：我歌且谣\"。○释曰：此《魏风•园有桃》篇文也。毛传云：\"曲合乐曰歌，徒歌曰谣。\"孙炎云：\"声消摇也。\"注\"或歌或咢\"。○释曰：《大雅•行苇》篇文也。毛传云：\"歌有比於琴瑟也，徒击鼓曰咢。\"孙炎云：\"声惊咢也。\"" }
      - { type: j, text: "所以鼓柷谓之止，（柷如漆桶，方二尺四寸，深一尺八寸，中有椎柄，连底桐之，令左右击。止者，其椎名。○柷，昌孰切）所以鼓敔谓之籈。（敔如伏虎，背上有二十七鉏鋙，刻以木，长尺，栎之，籈者其名。○籈音真）" }
      - { type: z, text: "\"所以鼓柷\"至\"之籈\"。○释曰：此别柷敔之名也。《周礼》：\"小师掌教鼓鼗柷敔。\"柷敔皆以木为之，故《大师》注云：\"木柷敔也。\"《礼记》谓之椌楬。所以鼓动其柷以出其音者名止，所以鼓动其敔以出其音者名籈。郭云：\"柷如漆桶，方二尺四寸，深一尺八寸，中有椎柄，连底桐之，令左右击。止者，其椎名。\"\"敔如伏虎，背上有二十七鉏鋙，刻以木，长尺，栎之，籈者其名。\"《皋陶谟》云：\"合止柷敔。\"郑注云：\"柷，状如漆桶，中有椎，合之者投椎於其中而撞之。敔，状如伏虎，背上刻之，所以鼓之以止乐。\"此等形状，盖依汉之大予乐而知之。" }
      - { type: j, text: "大鼗谓之麻，小者谓之料。（麻者音概而长也，料者声清而不乱。○鼗，桃。料，聊）" }
      - { type: z, text: "\"大鼗\"至\"之料\"。○释曰：《诗•颂》云：\"鼗磬柷敔。\"郑注《小师职》云：\"鼗如鼓而小，持其柄摇之，旁耳还自击。\"一名麻。其小者名料。麻者音概而长也，料者声清而不乱。" }
      - { type: j, text: "和乐谓之节。" }
      - { type: z, text: "\"和乐谓之节\"。○释曰：八音克谐，无相夺伦，谓之和乐。乐和则应节。《乐记》云：\"治世之音安以乐，其政和。\"是也。《乐记》又云：\"大业与天地同和，大礼与天地同节。\"此对文尔。总而言之，则礼乐相将，故此和乐亦谓之节。一云：节，乐器名，谓相也。《乐记》云：\"治乱以相。\"郑注云：\"相即拊也，亦以节乐。拊者以韦为表，装之以糠。糠一名相，因以名焉。\"言治理奏乐之时，击拊以辅相於乐，而为节也。既以柷作乐，以敔止乐，故以节为和乐，义所通也。" }
