# 爾雅注疏卷2（邢昺疏）：j 為經文＋晉郭璞注，z 為疏文。
sections:
  - id: juan2
    name: 正文
    blocks:
      - { type: z, text: "释曰：\"尔雅\"者，《释文》云：\"所以训释五经，辨章同异，实九经之通路，百氏之指南，多识鸟兽草木之名，博览而不惑者也。尔，近也。雅，正也。言可近而取正也。《释诂》一篇，盖周公所作，《释言》以下，或言仲尼所增，子夏所足，叔孙通所益，梁文所补。\"张揖云：\"昔在周公，缵述唐虞，宗翼文武，克定四海。勤相成王，践阼理政。日昃不食，坐而待旦。德化宣流，越裳来贡，嘉禾贯桑。六年制礼，以导天下。著《尔雅》一篇，以释其义。传乎後嗣，历载五百。坟典散落，唯《尔雅》常存。《礼三朝•记》：\"哀公曰：寡人欲学小辩以观於政，其可乎？孔子曰：《尔雅》以观於古，足以辩言矣。'《春秋元命包》言：'子夏问，夫子作《春秋》，不以'初'、'哉'、'首'、'基'为'始'何？是以知周公所造也。'率斯以降，超绝六国，越逾秦楚，爰暨帝刘。鲁人叔孙通撰置《礼记》，文不违古。今俗所传三篇《尔雅》，或言仲尼所增，或言子夏所益，或言叔通所补，或言沛郡梁文所著，皆解家所说。先师口传，既无正验圣人所言，是故疑不足能明也。夫《尔雅》之为书也，文约而义固；其陈道也，精研而无误。真九经之检度，学问之阶路，儒林之楷素也。\"\"序\"与绪音义同。《释诂》云：\"叙，绪也。\"言已注述之由，叙陈此经之旨，若茧之抽绪耳。孔子作《书序》，子夏作《诗序》，故郭氏亦谓之序。序之大指，凡有五焉：初自\"夫《尔雅》者\"至\"辨同实而殊号者也\"，明此书之用也。二自\"诚九流之津涉\"至\"摛翰者之华苑也\"，言为群经之枢要也。三自\"若乃\"至\"莫近於《尔雅》\"，言其博物，他书不之过也。四自\"《尔雅》者\"至\"其业亦显\"，明其兴隆之时也。五自\"英儒赡闻之士\"至叙未，序已所以作注之意也。今各依文解之。" }
      - { type: j, text: "夫《尔雅》者，所以通诂训之指归，叙诗人之兴咏，总绝代之离词，辩同实而殊号者也。" }
      - { type: z, text: "\"夫《尔雅》\"至\"同实而殊号者也\"。○释曰：此明其用也。\"夫\"者发语辞，亦指示语，指此\"《尔雅》者所以通诂训之指归\"也。\"诂\"，古也，通古今之言使人知也。\"训\"，道也，道物之貌以告人也。\"指归\"谓指意归乡也。言此书所以通畅古今之言，训道百物之貌，使人知其指意归乡也。若言\"初、哉、首、基\"者，其指归在\"始\"也。若言\"番番、矫矫\"者，其指归在\"勇\"也。略举一隅，他皆放此。云\"叙诗人之兴咏\"者，叙，次叙也。郑玄注《周礼•大司乐》云：\"兴者以善物喻善事。\"又注《大师》云：\"兴者，见今之美嫌於媚谀，取善事以喻劝之。\"郑司农云：\"兴者，托於事物。\"\"词\"者，永言也。故《舜典》云：\"歌永言。\"孔注云：\"歌咏其义以长其言。\"又《诗序》云：\"言之不足，故嗟叹之；嗟叹之不足，故永歌之。\"斯皆诗人所为，此书能次叙之，故言\"叙诗人之兴咏\"也。若言\"噰噰喈喈\"，以兴民协服也；\"其虚其徐\"，以咏威仪容止也。如此之类，皆是。案《尔雅》所释，遍解六经，而独云\"叙诗人之兴咏\"者，以《尔雅》之作多为释《诗》，故毛公传《诗》皆据《尔雅》，谓之诂训传，亦此意也。云：\"总绝代之离词\"者，总，聚也；绝代，犹远代也；离词，犹异词也。郭璞叙《方言》云\"标六代之绝语，类离词之指韵\"，亦犹此也。以其六代绝远，四方乖越，故今古语异，夷夏词殊。此书能总聚而释之，使人知也。若其\"绎又祭也，周曰绎，商曰肜，夏曰复胙\"，及注引《方言》之类是也。云\"辩同实而殊号者也\"者，辩谓辩别，凡物虽殊其号而同一实者，此书辩之。若\"繴谓之罿，罿，罬也；罬谓之罦，罦，覆车也。\"又《释草》云：\"唐、蒙，女萝。女萝，菟丝。\"注云：\"别四名。\"如此之类，是也。" }
      - { type: j, text: "诚九流之津涉，六艺之钤键，学览者之潭奥，摛翰者之华苑也。（○键音件，摛音痴）" }
      - { type: z, text: "\"诚九\"至\"苑也\"。○释曰：此明其枢要也。云\"诚九流之津涉\"者，诚，实也；九流者，叙六艺为九种，言於六经若水之下流也；津涉者，济渡之处名。言九流之多，非此书无以通，喻九河之广，非津涉无以渡。案《汉书•艺文志》云：\"儒家者流五十三家，八百三十五篇，盖出於司徒之官，助人君顺阴阳、明教化者也。游文於六经之中，留意於仁义之际，祖述尧舜，宪章文武，宗师仲尼，以重其言，於道最为高。孔子曰：'如有所誉，其有所试。'唐虞之隆，殷周之盛，仲尼之业，已试之效者也。然惑者既失精微，而僻者又随时抑扬，违离道本，苟以讠华取宠，後进循之，是以五经乖析，儒学浸衰，此僻儒之患也。道家者流三十七家，九百九十三篇，盖出於史官，历记成败、存亡、祸福、古今之道，然後知秉要执本，清虚以自守，卑弱以自持，此人君南面之术也。合於尧舜之克让，《易》之嗛嗛，一谦而四益。此其所长也。阴阳家者流二十一家，二百六十九篇，盖出於羲和之官，敬顺昊天，历象日月星辰，敬授民时，此其所长也。法家者流十家，二百一十七篇，盖出於理官，信赏必罚，以辅礼制。《易》曰：'先王以明罚饬法。'此其所长也。名家者流十家，三十六篇，盖出於礼官，古者名位不同，礼亦异数。孔子曰：'必也正名乎！名不正则言不顺，言不顺则事不成。'此其所长也。墨家者流六家，八十六篇，盖出於清庙之官。茅屋采椽，是以贵俭；养三老五更，是以兼爱；选士大射，是以上贤；宗祀严父，是以右鬼；顺四时而行，是以非命；以孝视天下，是以上同。此其所长也。纵横家者流十二家，百七篇，盖出於行人之官。孔子曰：'诵《诗》三百，使於四方，不能专对：虽多，亦奚以为？'又曰：'使乎，使乎！'言其当权事制宜，受命而不受辞。此其所长也。杂家者流二十家，四百三篇，盖出於议官，兼儒墨，合名法，知国体之有此，见王治之无不贯，此其所长也。农家者流九家，百一十四篇，盖出於农稷之官，播百谷，劝耕桑，以足衣食，故八政，一曰食，二曰货。孔子曰：'所重民食。'此其所长也。\"此九流之大旨也。云\"六艺之钤键\"者，案《汉书•艺文志》六艺谓《易》、《书》、《诗》、《礼》、《乐》、《春秋》六经也。\"凡六艺，一百三家，三千一百二十三篇。\"《说文》云：\"钤，锁也。\"《方言》云：\"户钥，自关之东，陈、楚之间谓之键。\"《小尔雅》云：\"键谓之钥。\"言此书为六艺之锁钥，必开通之，然後得其微旨也，故云\"六艺之钤键\"也。云\"学览者之潭奥\"者，潭，渊也；室中西南隅谓之奥，言隐奥也。此书释二仪之形象，载八表之昏荒，虽博学广览之士，莫能究渊深隐奥，故云\"学览者之潭奥\"也。云\"摛翰者之华苑也\"者，言此书森罗万有，纯粹六经，摛文染翰之士，足以掇其英华若园苑然，故云\"华苑\"也。" }
      - { type: j, text: "若乃可以博物不惑，多识於鸟兽草木之名者，莫近於《尔雅》。" }
      - { type: z, text: "\"若乃\"至\"《尔雅》\"。○释曰：此言其博物也。云\"若乃\"者，因上起下语。上既言其功用，此复美其博物，故云\"若乃\"。既可以博释庶物，又能多识辨於鸟兽草木之名者，\"莫近於《尔雅》\"，言《尔雅》最近之。又案《公羊传》说《春秋》功德云：\"拨乱世，反诸正，莫近诸《春秋》。\"何休云：\"莫近，犹莫过之也。\"然则博物多识，他书亦莫过於《尔雅》也。" }
      - { type: j, text: "《尔雅》者，盖兴於中古，隆於汉氏，豹鼠既辩，其业亦显。" }
      - { type: z, text: "\"《尔雅》\"至\"亦显\"。○释曰：此言兴隆之时也。云\"盖兴於中古\"者，《尔雅》之作，经传莫言其人及时，世但相传云周公作之以教成王，无正文，故云\"盖\"以疑之。经典通以伏牺为上古，文王为中古，孔子为下古。周公，文王子，父统子业，周公亦可言中古，故云\"盖兴於中古\"。云\"隆於汉氏\"者，以夫子没後，书纪散亡，战国陵迟，嬴秦燔灭，则此书亦从而坠矣。洎乎汉氏御宇，旁求典籍，除挟书之律，开献书之路，此书亦从而隆矣，故曰\"隆於汉氏\"也。云\"豹鼠既辩，其业亦显\"者，谓汉武帝时，孝廉郎终军既辩豹文之鼠，人服其博物，故争相传授，《尔雅》之业，於是遂显。言不但兴行，兼亦广显，故云\"亦\"也。" }
      - { type: j, text: "英儒赡闻之士，洪笔丽藻之客，靡不钦玩耽味，为之义训。璞不揆梼昧，少而习焉，沈研钻极，二九载矣。虽注者十馀，然犹未详备，多纷谬，有所漏略。是以复缀集异闻，会稡旧说；考方国之语，采谣俗之志；错综樊、孙，博关言；剟其瑕砾，搴其萧稂；事有隐滞，援据徵之；其所易了，阙而不论；别为音图，用袪未寤。辄复拥篲清道，企望尘躅者，以将来君子为亦有涉乎此也。（○赡，时艳反。璞音朴。梼音桃。少，时照切。会，古外切。稡，子外切。剟音掇。砾音历。搴音。稂音郎。易，以豉切。了音疗。篲，似税切。企，豉切。躅音逐）" }
      - { type: z, text: "\"英儒\"至序末。○释曰：此言已所以作注之意也。云\"英儒赡闻之士\"者，案《礼辞名记》：\"德过千人曰英。\"儒者，柔也，能以德柔服人也。赡，多也。士者，有德之称。言英俊通儒，多闻之士也。云\"洪笔丽藻之客\"者，洪，大也；丽，美也；藻，水草也，有文，以喻人之文章。言大有词笔，美於文章之客也。云\"靡不钦玩耽味，为之义训\"者，靡，无也；钦玩，犹敬爱也；耽味，犹乐嗜也。言英儒等无不敬爱此书，如耽广乐嗜嘉肴然，故曰\"耽味\"。而为之义理训解，谓作注也。云\"璞不揆梼昧，少而习焉\"者，此自谦也。揆，度也。梼谓梼杌，无知之貌。昧，暗也。郭氏言已不度其无知暗昧，自少小而习此书焉。云\"沈研钻极，二九载矣\"者，此言用功深，不敢苟为注解也。谓深沈研核，钻求穷极，凡十八载，故云\"二九载矣\"。云\"虽注者十馀，然犹未详备\"者，言作注者虽十有馀家，犹尚未能精详具备。十馀家者，陆德明《叙录》犍为文学注二卷、刘歆注三卷、樊光注六卷、李巡注三卷、孙炎注三卷，为此五家而己；又《五经正义》援引有某氏、谢氏、顾氏。今郭氏言十馀者，典籍散亡，未知谁氏。或云沈旋、施乾、谢峤、顾野王者，非也。此四家存郭氏之後，故知非也。云\"并多纷谬，有所漏略\"者，言十家所注，多纷纭错缪。若孙叔然\"覭髳，茀离\"，字别为义，是纷缪也；其所难解，则全不入根节，是漏略也。云\"是以复缀集异闻，会稡旧说\"者，\"是以\"者，因前起後语。因前十家所注纷缪漏，起己作注之意，故言\"是以\"。对前巳有注，故云\"复\"。\"缀集\"，谓联缀聚集。\"异闻\"者，注所引六经子史之类是也。\"会稡\"者，《广雅》云：\"会收也。稡，聚也。\"\"旧说\"，谓十家所说也，虽不能尽善，亦时有可观，其所善者，则收聚用之也。云\"考方国之语\"者，考，成也。四方之国，言语不同，有所通释者，则援引考成之，注引《方言》是也。云\"采谣俗之志\"者，采，取也。徒歌谓之谣。案《汉书•地理志》云：\"好恶取舍，动静亡常，随君上之情欲，故谓之俗。\"但童谣嬉戏之言，及俗间有所记志可以通此书者，亦采用之，若\"榽梳\"注引齐人谚曰\"上山斫檀，榽梳先殚\"、\"蟏蛸\"注云\"俗呼为喜子\"之类是也。云\"错综樊、孙\"者，谓交错综聚樊光、孙炎二家之注，取其理长者用之。云\"博关群言\"者，关，通也；群言，谓子史及小说也。言非但援引六经，亦博通此子史等以为注说也。云\"剟其瑕砾，搴其萧稂\"者，此喻已作注，去恶取善也。\"剟其瑕砾\"，以玉石喻也。剟，削也。削去其疵瑕瓦砾，以取瑾瑜也。\"搴其萧稂\"，以禾莠喻也。搴，拔也。萧，蒿也。稂，童粱，莠类也。拔去其萧蒿稂莠，以存其嘉禾也。云\"事有隐滞，援据徵之\"者，援，引也；徵，成也。若事有隐奥滞泥者，则援引经据以证成之也。云\"其所易了，阙而不论\"者，谓通见《诗》、《书》，不难晓了者，则不须援引，故阙而不论也。云\"别为音图，用袪未寤\"者，谓注解之外，别为《音》一卷，《图赞》二卷，字形难识者，则审音以知之；物状难辩者，则披图以别之。用此音图以袪除未晓寤者，故云\"用袪未寤\"也。云\"辄复拥篲清道，企望尘躅\"者，此郭氏自问也。拥，手持也。篲，帚也。清道，谓清洁道涂也。企望者，企踵而瞻望也。尘躅者，尘路躅迹也。言己注此书，若人持帚以清道，企踵而望其芳尘美迹。所以然者何，谓是自问也。云\"以将来君子，为亦有涉乎此也\"者，此自答也。言已注此书非他，以为将来有德君子之为必欲研核百氏，探讨九流，非《尔雅》不可，必涉历此途，若其注释未备，则恐迷误後人。作注之由，良为此也。" }
      - { type: j, text: "《尔雅》卷上" }
      - { type: z, text: "释曰：上者对中下生名，直以编重多，分为上、中、下三卷，无义例也。" }
      - { type: j, text: "郭璞注" }
      - { type: z, text: "郭璞，字景纯，河东人，东晋弘农太守著作郎。注者，著也。解释经指，使义理著明也。亦言己注意，以释此书也。《诗》、《书》谓之传者，传，传也，博识经意，传示後人也。此皆其人自题，故或言传，或言注，无义例也。" }
      - { type: z, text: "释曰：释，解也。诂，古也。古今异言，解之使人知也。《释言》则《释诂》之别。故《尔雅•叙篇》云：《释诂》、《释言》，通古今之字，古与今异言也。第，次也。一，数之始也。以其作最在先，故为第一。此篇相承以为周公作，但其文有周公後事，故先儒共疑焉。或曰仲尼、子夏所增足也，或曰当周公时有之，今无者，或在散亡之中。然则《诗》、《书》所有，非周公所释，乃後人依放故言雅记而为之文，故与之同。郭氏因即援据以成其义。若言\"胡不承权舆\"及\"缁衣之蓆兮\"，此秦康、郑武之诗，在周公之後明矣。其义犹今为文，采摭故事以为辞耳。则此篇所载，悉周公时所有，何足怪也！其诸篇所次，旧无明解，或以为有亲必须宫室，宫室既备，事资器用，今谓不然，何则？造物之始，莫先两仪，而乐器居天地之先，岂天地乃乐器所资乎！盖以先作者居前，增益者处後，作非一时，故题次无定例也。其篇之名义，逐篇具释，此不繁言。此书之作，以释六经之言，而字别为义，无复章句。今而作疏，亦不分科段，所解经文，若其易了，及郭氏未详者，则阙而不论。其稍难解，则援引经据及诸家之说以证之。郭氏之注，多采经记，若其通见可晓者，则但指篇目而巳。而或书名僻异，义旨隐奥者，则具载彼文以袪未寤者耳。" }
