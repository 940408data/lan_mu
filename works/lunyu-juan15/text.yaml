# 論語注疏卷15（邢昺疏）：j 為經文＋魏何晏集解，z 為疏文。
sections:
  - id: juan15
    name: 正文
    blocks:
      - { type: z, text: "正义曰：此章记孔子先礼後兵，去乱就治，并明忠、信、仁、知、劝学，" }
      - { type: j, text: "为邦无所毁誉，必察好恶。志士君子之道，事君相师之仪，皆有耻且格之事，故" }
      - { type: j, text: "次前篇也。" }
      - { type: j, text: "卫灵公问陈於孔子。（孔曰：“军陈行列之法。”）孔子对曰：“俎豆之事，" }
      - { type: j, text: "则尝闻之矣。”（孔曰：“俎豆，礼器。”）军旅之事，未之学也。”（郑曰：" }
      - { type: j, text: "“万二千五百人为军，五百人为旅。军旅末事，本未立，不可教以末事。”）" }
      - { type: z, text: "“卫灵”至“学也”。○正义曰：此章记孔子先礼後兵之事也。“卫灵" }
      - { type: j, text: "公问陈於孔子”者，问军陈行列之法於孔子也。“孔子对曰：俎豆之事，则尝闻" }
      - { type: j, text: "之矣。军旅之事，未之学也”者，俎豆，礼器。万二千五百人为军，五百人为旅。" }
      - { type: j, text: "孔子之意，治国以礼义为本，军旅为末，本未立，则不可教以末事。今灵公但问" }
      - { type: j, text: "军陈，故对曰：“俎豆行礼之事，则尝闻之。军旅用兵之事，未之学也。”《左" }
      - { type: j, text: "传》哀十一年，“孔文子之将攻大叔”也，访於仲尼。仲尼曰：‘胡簋之事，则" }
      - { type: j, text: "尝学之矣。甲兵之事，未之闻也。’”其意亦与此同。军旅甲兵亦治国之具也，" }
      - { type: j, text: "彼以文子非礼，欲国内用兵；此以灵公空问军陈，故并不答，非轻甲兵也。○注" }
      - { type: j, text: "“俎豆，礼器”。○正义曰：案《明堂位》云：“俎，有虞氏以完，夏后氏以" }
      - { type: j, text: "，殷以具，周以房俎。”郑注云：“完，断木为四足而已。之言" }
      - { type: j, text: "蹶也，谓中足为横距之象，《周礼》谓之距。具之言枳具也，谓曲桡之也。" }
      - { type: j, text: "房谓足下跗也，上下两间，有似於堂房。《鲁颂》曰：‘笾豆大房。’”又曰：" }
      - { type: j, text: "“夏后氏以曷豆，殷玉豆，周献豆。”郑注云：“曷，无异物之饰也。献，" }
      - { type: j, text: "疏刻之。齐人谓无发为秃曷。”其委曲制度备在礼图。○注“郑曰：万二千五" }
      - { type: j, text: "百人为军，五百人为旅。”○正义曰：皆《司马序官》文也。" }
      - { type: j, text: "明日遂行。在陈绝粮，从者病，莫能兴。（孔曰：“从者，弟子。兴，起也。" }
      - { type: j, text: "孔子去卫如曹，曹不容，又之宋。宋遭匡人之难，又之陈。会吴伐陈，陈乱，故" }
      - { type: j, text: "乏食。”）子路愠见曰：“君子亦有穷乎？”子曰：“君子固穷，小人穷斯滥矣。”" }
      - { type: j, text: "（滥，溢也。君子固亦有穷时，但不如小人穷则滥溢为非。）" }
      - { type: z, text: "“明日”至“滥矣”。○正义曰：此章记孔子厄於陈也。“明日遂行”" }
      - { type: j, text: "者，既答灵公之明日也，遂去卫国而之於他邦也。“在陈绝粮，从者病，莫能兴”" }
      - { type: j, text: "者，从者，弟子也。兴，起也。孔子在陈，会吴伐陈，陈乱，故乏绝粮食，弟" }
      - { type: j, text: "子从者困病，莫能兴起也。“子路愠见曰：君子亦有穷乎”者，愠，怒也。子路" }
      - { type: j, text: "以为，君子学，则禄在其中，不当有穷困。今乃穷困，故愠怒而见，问於夫子曰：" }
      - { type: j, text: "“君子岂亦如常人有穷困邪？”“子曰：君子固穷，小人穷斯滥矣”者，滥，溢" }
      - { type: j, text: "也。言君子固亦有穷困时，但不如小人穷则滥溢为非。○注“孔曰”至“乏食”。" }
      - { type: j, text: "○正义曰：云“孔子去卫如曹，曹不容，又之宋。宋遭匡人之难，又之陈。会吴" }
      - { type: j, text: "伐陈”者，皆以《孔子世家》文而知也。如、之皆训往。" }
      - { type: j, text: "子曰：“赐也，女以予为多学而识之者与？”对曰：“然，（孔曰：“然谓" }
      - { type: j, text: "多学而识之。”）非与？”（孔曰：“问今不然。”）曰：“非也，予一以贯之。”" }
      - { type: j, text: "（善有元，事有会，天下殊涂而同归，百虑而一致。知其元则众善举矣，故不待" }
      - { type: j, text: "多学而一知之。）" }
      - { type: z, text: "“子曰”至“贯之”。○正义曰：此章言善道有统也。“子曰：赐也，" }
      - { type: j, text: "女以子为多学而识之者与”者，孔子问子贡：女意以我为多其学问记识之者与？" }
      - { type: j, text: "与，语辞。“对曰：然”者，子贡意以为然，是夫子多学而识之也。“非与”者，" }
      - { type: j, text: "子贡又言：今乃非多学而识之者与？“曰：非也，予一以贯之”者，孔子答言，" }
      - { type: j, text: "己之善道，非多学而识之也，我但用一理以通贯之。以其善有元，事有会，知其" }
      - { type: j, text: "元则众善举矣，故不待多学，一以知之。○注“天下殊涂而同归，百虑而一致”。" }
      - { type: j, text: "○正义曰：《周易·下系辞》文也。" }
      - { type: j, text: "子曰：“由，知德者鲜矣！”（王曰：“君子固穷，而子路愠见，故谓之小" }
      - { type: j, text: "於知德。”）" }
      - { type: z, text: "“子曰：由知德者鲜矣！”○正义曰：此一章言子路鲜於知德。鲜，少" }
      - { type: j, text: "也。由，子路名。言君子固穷，而子路愠见，故谓之少於知德也。" }
      - { type: j, text: "子曰：“无为而治者，其舜也与？夫何为哉？恭已正南面而已矣。”（言任" }
      - { type: j, text: "官得其人，故无为而治。）" }
      - { type: z, text: "“子曰：无为而治者，其舜也与？夫何为哉？恭己正南面而已矣”。○" }
      - { type: j, text: "正义曰：此一章美帝舜也。帝王之道，贵在无为清静而民化之，然後之王者，以" }
      - { type: j, text: "罕能及，故孔子曰：“无为而天下治者，其舜也与？”所以无为者，以其任官得" }
      - { type: j, text: "人。夫舜何必有为哉，但恭敬己身，正南面乡明而已。○注“言任官得其人，故" }
      - { type: j, text: "无为而治”。○正义曰：案《舜典》命禹宅百揆，弃、后稷、契作司徒，皋陶作" }
      - { type: j, text: "士，垂、共工、益作朕虞，伯夷作秩宗，夔典乐教胄子，龙作纳言，并四岳十二" }
      - { type: j, text: "牧，凡二十二人，皆得其人，故舜无为而治也。" }
      - { type: j, text: "子张问行。子曰：“言忠信，行笃敬，虽蛮貊之邦，行矣。言不忠信，行不" }
      - { type: j, text: "笃敬，虽州里，行乎哉？（郑曰：“万二千五百家为州，五家为邻，五邻为里，" }
      - { type: j, text: "行乎哉？言不可行。”）立则见其参於前也，在舆则见其倚於衡也，夫然後行。”" }
      - { type: j, text: "（包曰：“衡，轭也。言思念忠信，立则常想见，参然在目前。在舆，则若倚车" }
      - { type: j, text: "轭。”）子张书诸绅。（孔曰：“绅，大带。”）" }
      - { type: z, text: "“子张”至“诸绅”。○正义曰：此一章言可常行之行也。“子张问行”" }
      - { type: j, text: "者，问於夫子，何如则可常行。“子曰：言忠信，行笃敬，虽蛮貊之邦行矣。言" }
      - { type: j, text: "不忠信，行不笃敬，虽州里，行乎哉”者，孔子答言，必当言尽忠诚，不欺於物，" }
      - { type: j, text: "行唯敦厚而常谨敬，则虽蛮貊远国，其道行矣。反此，虽州里近处，而行乎哉？" }
      - { type: j, text: "言不可行也。“立则见其参於前也，在舆，则见其倚於衡也，夫然後行”者，舆" }
      - { type: j, text: "是车舆也。衡，轭也。言常思念忠信笃敬，立则想见，参然在目前。在舆则若倚" }
      - { type: j, text: "车轭。夫能如是，而後可行。“子张书诸绅”者，绅，大带也。子张以孔子之言" }
      - { type: j, text: "书之绅带，意其佩服无忽忘也。○注“郑曰”至“为里”。○正义曰：《周礼·" }
      - { type: j, text: "大司徒职》云：“五家为比，五比为闾，四闾为族，五族为党，五党为州。”是" }
      - { type: j, text: "二千五百家为州也。今云万二千五百家为州，误也。云“五家为邻，五邻为里”，" }
      - { type: j, text: "《遂人职》文也。○注“绅，大带”。○正义曰：以带束腰，垂其馀以为饰，谓" }
      - { type: j, text: "之绅。《玉藻》说带云“大夫大带”，是一名大带也。《玉藻》称“天子素带朱" }
      - { type: j, text: "里，终辟。诸侯素带不朱里而终辟。大夫素带，辟垂。士练带，率下辟。居士锦" }
      - { type: j, text: "带，弟子缟带。并纫约用组”。“三寸，长齐於带。绅长，制，士三尺，有司二" }
      - { type: j, text: "尺有五寸。子游曰：‘参分带下，绅居二焉。绅结三齐。’大夫大带四寸，杂" }
      - { type: j, text: "带。君朱绿，大夫玄华，士缁辟，二寸，再缭四寸。凡带，有率，无箴功。”此" }
      - { type: j, text: "绅带之制也。" }
      - { type: j, text: "子曰：“直哉，史鱼！（孔曰：“卫大夫史酋。”）邦有道，如矢。邦无" }
      - { type: j, text: "道，如矢。（孔曰：“有道无道，行直如矢，言不曲。”）君子哉，蘧伯玉！邦" }
      - { type: j, text: "有道，则仕。邦无道，则可卷而怀之。”（包曰：“卷而怀，谓不与时政柔顺，" }
      - { type: j, text: "不忤於人。”）" }
      - { type: z, text: "“子曰”至“怀之”。○正义曰：此章美卫大夫史酋、蘧瑗之行也。" }
      - { type: j, text: "“直哉，史鱼”者，美史鱼之行正直也。“邦有道，如矢。邦无道，如矢”者，" }
      - { type: j, text: "此其直之行也。矢，箭也。史酋之德，其性惟直，国之有道无道，行直如箭，" }
      - { type: j, text: "言不随世变曲也。“君子哉，蘧伯玉”者，美伯玉有君子之德也。“邦有道，则" }
      - { type: j, text: "仕。邦无道，则可卷而怀之”者，此其君子之行也。国若有道，则肆其聪明而在" }
      - { type: j, text: "仕也。国若无道，则韬光晦知、不与时政，亦常柔顺不忤逆校人。是以谓之君子" }
      - { type: j, text: "也。" }
      - { type: j, text: "子曰：“可与言而不与言，失人。不可与言而与之言，失言。知者不失人，" }
      - { type: j, text: "亦不失言。”" }
      - { type: z, text: "“子曰：可与言而不与言，失人。不可与言而与之言，失言。知者不失" }
      - { type: j, text: "人，亦不失言”。○正义曰：此章戒其知人也。若中人以上，可以语上，是可与" }
      - { type: j, text: "言，而不与言，是失於彼人也。若中人以下，不可以语上，而己与之言，则失於" }
      - { type: j, text: "己言也。惟知者明於事，二者俱不失。" }
      - { type: j, text: "子曰：“志士仁人，无求生以害仁，有杀身以成仁。”（孔曰：“无求生以" }
      - { type: j, text: "害仁，死而後成仁，则志士仁人不爱其身也。”）" }
      - { type: z, text: "“子曰：志士仁人，无求生以害仁，有杀身以成仁”。○正义曰：此章" }
      - { type: j, text: "言志善之士，仁爱之人，无求生而害仁。若身死而後成仁，则志士仁人不爱其身，" }
      - { type: j, text: "有杀其身以成其仁者也。若伯夷、叔齐及比干是也。" }
      - { type: j, text: "子贡问为仁。子曰：“工欲善其事，必先利其器。居是邦也，事其大夫之贤" }
      - { type: j, text: "者，友其士之仁者。”（孔曰：“言工以利器为用，人以贤友为助。”）" }
      - { type: z, text: "“子贡”至“仁者”。○正义曰：此章明为仁之法也。“子贡问为仁”" }
      - { type: j, text: "者，子贡欲为仁，未知其法，故问之。“子曰：工欲善其事，必先利其器”者，" }
      - { type: j, text: "将答问仁，先为设譬也。若百工欲善其所为之事，当先利所用之器。“居是邦" }
      - { type: j, text: "也，事某大夫之贤者，友其士之仁者”，此答譬也。言工以利器为用，人以贤友" }
      - { type: j, text: "为助。大夫尊，故言事。士卑，故言友。大夫言贤，士言仁，互文也。" }
      - { type: j, text: "颜渊问为邦。子曰：“行夏之时，（据见万物之生，以为四时之始，取其易" }
      - { type: j, text: "知。）乘殷之辂，（马曰：“殷车曰大辂。《左传》曰：‘大辂越席，昭其俭也。”）" }
      - { type: j, text: "服周之冕，（包曰：“冕，礼冠。周之礼文而备，取其︻纟广塞耳，不任视听。”）" }
      - { type: j, text: "乐则《韶舞》。（“《韶》，舜乐也。尽善尽美，故取之。”）放郑声，远佞人。" }
      - { type: j, text: "郑声淫，佞人殆。”（孔曰：“郑声、佞人亦俱能惑人心，与雅乐、贤人同，而" }
      - { type: j, text: "使人淫乱危殆，故当放远之。”）" }
      - { type: z, text: "“颜渊”至“人殆”。○正义曰：此章言治国之法也。“颜渊问为邦”" }
      - { type: j, text: "者，为犹之治。问治国之礼法於孔子也。“子曰：行夏之时”者，此下孔子答以" }
      - { type: j, text: "为邦所行用之礼乐车服也。夏之时，谓以建寅之月为正也。据见万物之生，以为" }
      - { type: j, text: "四时之始，取其易知，故使行之。“乘殷之辂”者，殷车曰大辂，谓木辂也。取" }
      - { type: j, text: "其俭素，故使乘之。“服周之冕”者，冕，礼冠也。周之礼文而备，取其︻纟广" }
      - { type: j, text: "塞耳，不任视听，故使服之。“乐则《韶舞》”者，《韶》，舜乐名也。以其尽" }
      - { type: j, text: "善尽美，故使取之。“放郑声，远佞人。郑声淫，佞人殆”者，又当放弃郑、卫" }
      - { type: j, text: "之声，远离辨佞之人，以郑声、佞人亦俱能惑人心，与雅乐、贤人同，然而使人" }
      - { type: j, text: "淫乱危殆，故使放远之。○注“马曰”至“俭也”。正义曰：云“殷车曰大辂”" }
      - { type: j, text: "者，《明堂位》曰：“大辂，殷辂也。”郑注云“大路，木路也。汉祭天乘殷之" }
      - { type: j, text: "路，今谓之桑根车”者，是也。路训大也。君之所在，以大为号，门曰路门，寝" }
      - { type: j, text: "曰路寝，车曰路车，故人君之车，通以路为名。《周礼·巾车》“掌王之五路”。" }
      - { type: j, text: "郑玄云：“王在焉曰路。”彼解天子之车，故云王在耳。其实诸侯之车亦称为路。" }
      - { type: j, text: "云“《左传》曰：大辂越席，昭其俭也”者，桓二年文也。越席，结蒲为席，置" }
      - { type: j, text: "於路中以茵藉，示其俭也。服虔云：“大路，木路。”引之者以证殷路一名大路" }
      - { type: j, text: "也。杜元凯以大路为玉路，今所不取。○注“包曰”至“视听”。正义曰：云" }
      - { type: j, text: "“冕，礼冠。周之礼文而备”者，冠者，首服之大名；冕者，冠中之别号，故云" }
      - { type: j, text: "“冕，礼冠”也。《世本》云：“黄帝作冕。”宋仲子云：“冕，冠之有旒者，" }
      - { type: j, text: "礼文残缺，形制难详。”《周礼·弁师》“掌王之五冕，皆玄冕朱里”。止言玄" }
      - { type: j, text: "朱而已，不言所用之物。《子罕篇》云：“麻冕，礼也。”盖以木为，而用布" }
      - { type: j, text: "衣之。上玄下朱，取天地之色，其长短广狭，则经传无文。阮谌《三礼图·汉礼" }
      - { type: j, text: "器制度》云：“冕制皆长尺六寸，广八寸，天子以下皆同。”沈引董巴《舆服志》" }
      - { type: j, text: "云：“广七寸，长尺二寸。”应劭《汉官仪》云：“广七寸，长八寸。”沈又云：" }
      - { type: j, text: "“广八寸，长尺六寸者，天子之冕。广七寸，长尺二寸者，诸侯之冕。广七寸，" }
      - { type: j, text: "长八寸者，大夫之冕。”但古礼残缺，未知孰是，故备载焉。司马彪《汉书·舆" }
      - { type: j, text: "服志》云：“孝明帝永平二年，初诏有司采《周官》、《礼记》、《尚书》之文" }
      - { type: j, text: "制冕，皆前圆後方，朱里玄上，前垂四寸，後垂三寸，天子白玉珠十二旒，三公" }
      - { type: j, text: "诸侯青玉珠七旒，卿大夫黑玉珠五旒。皆有前无後。”此则汉法耳。其古礼，郑" }
      - { type: j, text: "玄注《弁师》云天子衮冕，以五采缫，前後十二ヵ，ヵ有五采玉十有二。冕，" }
      - { type: j, text: "前後九ヵ。毳冕，前後七ヵ。希冕，前後五ヵ。玄冕，前後三ヵ。ヵ皆五采玉十" }
      - { type: j, text: "有二。上公衮冕，三采缫，前後九ヵ，ヵ有三采玉九。侯伯冕，三采缫，前後" }
      - { type: j, text: "七ヵ，ヵ有三采玉七。子男毳冕，三采缫，前後五ヵ，ヵ有三采玉五。孤卿以下，" }
      - { type: j, text: "皆二采缫，二采玉焉。盖以缫采玉其ヵ。又玉名，依命数耳。谓之冕者，冕，" }
      - { type: j, text: "亻免也，以其後高前下，有亻免俯之形，故因名焉。盖以在上位者失於骄矜，欲" }
      - { type: j, text: "令位弥高而志弥下，故制此服，令贵者下贱也。云“取其︻纟广塞耳，不任视听”" }
      - { type: j, text: "者，︻纩，黄绵也。案今礼图衮冕以下皆有充耳，天子以︻纩，诸侯以青纩，以" }
      - { type: j, text: "其冕旒垂目，︻纩塞耳，欲使无为清静，以化其民，故不任视听也。" }
      - { type: j, text: "子曰：“人无远虑，必有近忧。”（王曰：“君子当思患而预防之。”）" }
      - { type: z, text: "“子曰：人无远虑，必有近忧”。○正义曰：此章戒人备豫不虞也。○" }
      - { type: j, text: "注“王曰：君子当思患而预防之”。○正义曰：此《周易·既济·象辞》也。王" }
      - { type: j, text: "弼云：“存不忘亡，既济不忘未济也。”" }
      - { type: j, text: "子曰：“已矣乎！吾未见好德如好色者也。”" }
      - { type: z, text: "“子曰：已矣乎！吾未见好德如好色者也”。○正义曰：此章疾时人好" }
      - { type: j, text: "色而不好德也。" }
      - { type: j, text: "子曰：“臧文仲其窃位者与！知柳下惠之贤而不与立也。”（孔曰：“柳下" }
      - { type: j, text: "惠，展禽也。知贤而不举，是为窃位。”）" }
      - { type: z, text: "“子曰：臧文仲其窃位者与！知柳下惠之贤而不与立也”。○正义曰：" }
      - { type: j, text: "此章勉人举贤也。窃，盗也。鲁大夫臧文仲知贤不举，偷安於位，故曰窃位。以" }
      - { type: j, text: "其知柳下惠之贤，不称举与立於朝廷也。○注“柳下惠，展禽也”。○正义曰：" }
      - { type: j, text: "案《鲁语》“展禽对臧文仲云：获闻之”。是其人氏展，名获，字禽。柳下是其" }
      - { type: j, text: "所食之邑名，谥曰惠。《列女传》：“柳下惠死，门人将谥之。妻曰：‘夫子之" }
      - { type: j, text: "谥，宜为惠乎？’门人从，以为谥。”《庄子》云“柳下季”者，季是五十字，" }
      - { type: j, text: "禽是二十字。" }
      - { type: j, text: "子曰：“躬自厚，而薄责於人，则远怨矣。”（孔曰：“责已厚，责人薄，" }
      - { type: j, text: "所以远怨咎。”）" }
      - { type: z, text: "“子曰：躬自厚，而薄责於人，则远怨矣”。○正义曰：此章戒人责已" }
      - { type: j, text: "也。躬，身也。言凡事自责厚，薄责於人，则所以远怨咎也。" }
      - { type: j, text: "子曰：“不曰‘如之何，（孔曰：“不曰如之何者，犹言不曰奈是何。”）" }
      - { type: j, text: "如之何’者，吾末如之何也已矣。”（孔曰：“如之何者，言祸难已成，吾亦无" }
      - { type: j, text: "如之何。”）" }
      - { type: z, text: "“子曰：不曰‘如之何，如之何’者，吾末如之何也已矣”。○正义曰：" }
      - { type: j, text: "此章戒人豫防祸难也。如，奈也。“不曰如之何”，犹言“不曰奈是何”。末，" }
      - { type: j, text: "无也。若曰奈是何者，则是祸难已成，不可救药，吾亦无柰之何。" }
      - { type: j, text: "子曰：“群居终日，言不及义，好行小慧，难矣哉！”（郑曰：“小慧，谓" }
      - { type: j, text: "小小之才知。难矣哉，言终无成。”）" }
      - { type: z, text: "“子曰：群居终日，言不及义，好行小慧，难矣哉！”○正义曰：此章" }
      - { type: j, text: "贵义。小慧，谓小小才知。言人群朋共居，终竟一日，所言不及义事，但好行小" }
      - { type: j, text: "小才知，以陵夸於人，难有所成矣哉！言终无成也。" }
      - { type: j, text: "子曰：“君子义以为质，礼以行之，孙以出之，信以成之。君子哉！”（郑" }
      - { type: j, text: "曰：“义以为质，谓操行。孙以出之，谓言语。”）" }
      - { type: z, text: "“子曰：君子义以为质，礼以行之，孙以出之，信以成之，君子哉！”" }
      - { type: j, text: "○正义曰：此章论君子之行也。义以为质，谓操执以行者，当以义为体质。文之" }
      - { type: j, text: "以礼，然後行之。孙顺其言语以出之。守信以成之。能此四者，可谓君子哉！" }
      - { type: j, text: "子曰：“君子病无能焉，不病人之不己知也。”（包曰：“君子之人但病无" }
      - { type: j, text: "圣人之道，不病人之不己知。”）" }
      - { type: z, text: "“子曰：君子病无能焉，不病人之不己知也”。○正义曰：此章戒人" }
      - { type: j, text: "己也。病犹患也。言君子之人，但患己无圣人之道，不患人之不知己也。" }
      - { type: j, text: "子曰：“君子疾没世而名不称焉。”（疾，犹病也。）" }
      - { type: z, text: "“子曰：君子疾没世而名不称焉”。○正义曰：此章劝人德也。疾，" }
      - { type: j, text: "犹病也。言君子病其终世而善名不称也。" }
      - { type: j, text: "子曰：“君子求诸己，小人求诸人。”（君子责己，小人责人。）" }
      - { type: z, text: "“子曰：君子求诸己，小人求诸人”。○正义曰：此章言君子责於己，" }
      - { type: j, text: "小人责於人也。求，责也。诸，於也。" }
      - { type: j, text: "子曰：“君子矜而不争，（包曰：“矜，矜庄也。”）群而不党。”（孔曰：" }
      - { type: j, text: "“党，助也。君子虽众，不相私助，义之与比。”）" }
      - { type: z, text: "“子曰：君子矜而不争，群而不党”。○正义曰：此章言君子貌虽矜庄" }
      - { type: j, text: "而不争斗，君子虽众而不私相党助，义之与比也。" }
      - { type: j, text: "子曰：“君子不以言举人，（包曰：“有言者不必有德，故不可以言举人。”）" }
      - { type: j, text: "不以人废言。”（王曰：“不可以无德而废善言。”）" }
      - { type: z, text: "“子曰：君子不以言举人，不以人废言”。○正义曰：此章言君子用人，" }
      - { type: j, text: "取其善节也。有言者不必有德，故不可以言举人，当察言观行然後举之。夫妇之" }
      - { type: j, text: "愚，可以与知，故不可以无德而废善言也。" }
      - { type: j, text: "子贡问曰：“有一言而可以终身行之者乎？”子曰：“其恕乎！己所不欲，" }
      - { type: j, text: "勿施於人。”（言已之所恶，勿加施於人。）" }
      - { type: z, text: "“子贡”至“於人”。○正义曰：此章言人当恕已不及物也。“子贡问" }
      - { type: j, text: "曰：有一言可以终身行之者乎”者，问於孔子，求身之要道也。“子曰：其恕" }
      - { type: j, text: "乎！已所不欲，勿施於人”者，孔子答言，唯仁恕之一言，可终身行之也。己之" }
      - { type: j, text: "所恶，勿欲施於人，即恕也。" }
      - { type: j, text: "子曰：“吾之於人也，谁毁谁誉？如有所誉者，其有所试矣。（包曰：“所" }
      - { type: j, text: "誉者，辄试以事，不虚誉而已。”）斯民也，三代之所以直道而行也。”（马曰：" }
      - { type: j, text: "“三代夏、殷、周用民如此，无所阿私，所以云直道而行。”）" }
      - { type: z, text: "“子曰”至“行也”。○正义曰：此章论正直之道也。“子曰：吾之於" }
      - { type: j, text: "人也，谁毁谁誉”者，毁谓谮害，誉谓称扬。言我之於人，於谁毁？於谁誉？无" }
      - { type: j, text: "私毁誉也。“如有所誉者，其有所试矣”者，言所称誉者，辄试以事，不虚誉而" }
      - { type: j, text: "已也。“斯民也，三代之所以直道而行也”者，斯，此也。三代，夏、殷、周也。" }
      - { type: j, text: "言如此用民，无所阿私，夏、殷、周三代之令王所以得称直道而行也。" }
      - { type: j, text: "子曰：“吾犹及史之阙文也。（包曰：“古之良史，於书字有疑则阙之，以" }
      - { type: j, text: "待知者。”）有马者借人乘之，今亡矣夫！”（包曰：“有马不能调良，则借人" }
      - { type: j, text: "乘习之。孔子自谓及见其人如此，至今无有矣。言此者，以俗多穿凿。”）" }
      - { type: z, text: "“子曰”至“矣夫”。○正义曰：此章疾时人多穿凿也。“子曰：吾犹" }
      - { type: j, text: "及史之阙文也”者，史是掌书之官也。文，字也。古之良史，於书字有疑则阙之，" }
      - { type: j, text: "以待能者，不敢穿凿。孔子言我尚及见此古史阙疑之文。“有马者借人乘之”者，" }
      - { type: j, text: "此举喻也。喻己有马不能调良，当借人乘习之也。“今亡矣夫”者，亡，无也。" }
      - { type: j, text: "孔子自谓及见其人如此，阙疑至今，则无有矣。言此者，以俗多穿凿。" }
      - { type: j, text: "子曰：“巧言乱德。小不忍，则乱大谋。”（孔曰：“巧言利口则乱德义。" }
      - { type: j, text: "小不忍则乱大谋。”）" }
      - { type: z, text: "“子曰：巧言乱德。小不忍，则乱大谋”。○正义曰：此章戒人慎口忍" }
      - { type: j, text: "事也。有言者不必有德，故巧言利口则乱德义。山薮藏疾，国君含垢，故小事不" }
      - { type: j, text: "忍，则乱大谋。" }
      - { type: j, text: "子曰：“众恶之，必察焉。众好之，必察焉。”（王曰：“或众阿党比周，" }
      - { type: j, text: "或其人特立不群，故好恶不可不察也。”）" }
      - { type: z, text: "“子曰：“众恶之，必察焉。众好之，必察焉”。○正义曰：此章论知" }
      - { type: j, text: "人之事也。夫知人未易，设有一人，为众所恶，不可即从雷同而恶之。或其人特" }
      - { type: j, text: "立不群，故必察焉。又设有一人，为众所好，亦不可即从众而好之。或此人行恶，" }
      - { type: j, text: "众乃阿党比周，故不可不察。○注“王曰：或众阿党比周”。○正义曰：此解众" }
      - { type: j, text: "好之也，谓众多恶人，私相阿曲朋党，比近周密也。文十八年《左传》言浑敦之" }
      - { type: j, text: "恶云：“顽嚣不友，是与比周。”杜注云：“比，近也。周，密也。”言比是相" }
      - { type: j, text: "近也，周是亲密也。唯是亲爱之义，非为善恶之名。《为政篇》“子曰：君子周" }
      - { type: j, text: "而不比，小人比而不周”。孔曰：“忠信为周，阿党为比。”以君子小人相对，" }
      - { type: j, text: "故观文为说也。" }
      - { type: j, text: "子曰：“人能弘道，非道弘人。”（王曰：“才大者道随大，才小者道随小，" }
      - { type: j, text: "故不能弘人。”）" }
      - { type: z, text: "“子曰：人能弘道，非道弘人”。○正义曰：此章论道也。弘，大也。" }
      - { type: j, text: "道者，通物之名，虚无妙用，不可须臾离。但仁者见之谓之仁，知者见之谓之知，" }
      - { type: j, text: "是人才大者，道随之大也，故曰人能弘道。百姓则日用而不知，是人才小者，道" }
      - { type: j, text: "亦随小，而道不能大其人也，故曰非道弘人。" }
      - { type: j, text: "子曰：“过而不改，是谓过矣。”" }
      - { type: z, text: "“子曰：过而不改，是谓过矣”。正义曰：此章戒人改过也。人谁无过，" }
      - { type: j, text: "过而能改，善莫大焉。过而不改，是谓过矣。" }
      - { type: j, text: "子曰：“吾尝终日不食，终夜不寝，以思，无益，不如学也。”" }
      - { type: z, text: "“子曰：吾尝终日不食，终夜不寝，以思，无益，不如学也”。○正义" }
      - { type: j, text: "曰：此章劝人学也。" }
      - { type: j, text: "子曰：“君子谋道不谋食。耕也，馁在其中矣。学也，禄在其中矣。君子忧" }
      - { type: j, text: "道不忧贫。”（郑曰：“馁，饿也。言人虽念耕而不学，故饥饿。学则得禄，虽" }
      - { type: j, text: "不耕而不馁。此劝人学。”）" }
      - { type: z, text: "“子曰：君子谋道不谋食。耕也，馁在其中矣。学也，禄在其中矣。君" }
      - { type: j, text: "子忧道不忧贫”。○正义曰：此章亦劝人学也。人非道不立，故必先谋於道，道" }
      - { type: j, text: "高则禄来，故不假谋於食。馁，饿也。言人虽念耕而不学，则无知岁有凶荒，故" }
      - { type: j, text: "饥饿。学则得禄，虽不耕而不馁。是以君子但忧道德不成，不忧贫乏也。然耕也" }
      - { type: j, text: "未必皆饿，学也未必皆得禄，大判而言，故云耳。" }
      - { type: j, text: "子曰：“知及之，仁不能守之，虽得之，必失之。（包曰：“知能及治其官，" }
      - { type: j, text: "而仁不能守，虽得之，必失之。”）知及之，仁能守之，不庄以莅之，则民不敬。" }
      - { type: j, text: "（包曰：“不严以临之，则民不敬从其上。”）知及之，仁能守之，庄以莅之，" }
      - { type: j, text: "动之不以礼，未善也。”（王曰：“动必以礼然後善。”）" }
      - { type: z, text: "“子曰”至“善也”。○正义曰：此章论居官临民之法也。“子曰：知" }
      - { type: j, text: "及之，仁不能守之，虽得之，必失之”者，得位由知，守位在仁。若人知能及治" }
      - { type: j, text: "其官，而仁不能守，虽得禄位，必将失之。“知及之，仁能守之，不庄以莅之，" }
      - { type: j, text: "则民不敬”者，庄，严也。莅，临也。言虽知及其官，仁能守位，不严以临之，" }
      - { type: j, text: "则民不敬从其上。“知及之，仁能守之，庄以莅之，动之不以礼，未善也”者，" }
      - { type: j, text: "言动必以礼然後善。李充云：“夫知及以得，其失也荡；仁守以静，其失也宽；" }
      - { type: j, text: "庄莅以威，其失也猛，故必须礼然後和之。以礼制知，则精而不荡；以礼辅仁，" }
      - { type: j, text: "则温而不宽；以礼御庄，则威而不猛，故安上治民，莫善於礼。”颜特进云：" }
      - { type: j, text: "“知以通其变，仁以安其性，庄以安其慢，礼以安其情，化民之善，必备此四者。”" }
      - { type: j, text: "子曰：“君子不可小知而可大受也；小人不可大受，而可小知也。”（王曰：" }
      - { type: j, text: "“君子之道深远，不可小了知，而可大受；小人之道浅近，可小了知，而不可大" }
      - { type: j, text: "受也。”）" }
      - { type: z, text: "“子曰：君子不可小知，而可大受也；小人不可大受，而可小知也”。" }
      - { type: j, text: "○正义曰：此章言君子小人道德深浅不同之事也。言君子之道深远，仰之弥高，" }
      - { type: j, text: "钻之弥坚，故不可小了知也，使人餍饫而已，是可大受也。小人之道浅近易为穷" }
      - { type: j, text: "竭，故不可大受，而可小了知也。" }
      - { type: j, text: "子曰：“民之於仁也，甚於水火。（马曰：“水火及仁，故民所仰而生者，" }
      - { type: j, text: "仁最为甚。”）水火，吾见蹈而死者矣，未见蹈仁而死者也。”（马曰：“蹈水" }
      - { type: j, text: "火或时杀人，蹈仁未尝杀人。”）" }
      - { type: z, text: "“子曰”至“者也”。○正义曰：此章劝人行仁道也。“子曰：民之於" }
      - { type: j, text: "仁也，甚於水火”者，言水火饮食所由，仁者善行之长，皆民所仰而生者也。若" }
      - { type: j, text: "较其三者所用，则仁最为甚也。“水火，吾见蹈而死者矣，末见蹈仁而死者也”" }
      - { type: j, text: "者，此明仁甚於水火之事也。蹈犹履也。水火虽所以养人，若履蹈之，或时杀人。" }
      - { type: j, text: "若履行仁道，未尝杀人也。王弼云：“民之远於仁，甚於水火，见有蹈水火者，" }
      - { type: j, text: "未尝见蹈仁者也。”虽与马意不同，亦得为一义。" }
      - { type: j, text: "子曰：“当仁不让於师。”（孔曰：“当行仁之事，不复让於师，言行仁急。”）" }
      - { type: z, text: "“子曰：当仁不让於师”。正义曰：此章言行仁之急也。弟子之法，为" }
      - { type: j, text: "事虽当让於师，若当行仁之事，不复让於师也。" }
      - { type: j, text: "子曰：“君子贞而不谅。”（孔曰：“贞，正。谅，信也。君子之人，正其" }
      - { type: j, text: "道耳，言不必小信。”）" }
      - { type: z, text: "“子曰：君子贞而不谅”。○正义曰：此章贵正道而轻小信也。贞，正" }
      - { type: j, text: "也。谅，信也。君子之人，正其道耳。言不必小信。案昭七年《左传》云：“子" }
      - { type: j, text: "产为丰施归州田於韩宣子，曰：‘日君以夫公孙段为能任其事，而赐之州田。今" }
      - { type: j, text: "无禄早世，不获久享君德。其子弗敢有，不敢以闻於君，私致诸子。’宣子辞。" }
      - { type: j, text: "子产曰：‘古人有言曰：其父析薪，其子弗克负荷。施将惧不能任其先人之禄，" }
      - { type: j, text: "其况能任大国之赐？纵吾子为政而可，後之人若属有疆场之言，敝邑获戾，而丰" }
      - { type: j, text: "氏受其大讨。吾子取州，是免敝邑於戾，而建置丰氏也。敢以为请。’”杜注云：" }
      - { type: j, text: "“《传》言子产贞而不谅。”言段受晋邑，卒而归之，是正也。知宣子欲之，而" }
      - { type: j, text: "言畏惧後祸，是不信，故杜氏引此文为注也。" }
      - { type: j, text: "子曰：“事君，敬其事而後其食。”（孔曰：“先尽力而後食禄。”）" }
      - { type: z, text: "“子曰：事君，敬其事而後其食”。○正义曰：此章言其为臣事君之法" }
      - { type: j, text: "也，言当先尽力敬其职事，必有勋绩而後食禄也。" }
      - { type: j, text: "子曰：“有教无类。”（马曰：“言人所在见教，无有种类。”）" }
      - { type: z, text: "“子曰：有教无类”。○正义曰：此章言教人之法也。类谓种类。言人" }
      - { type: j, text: "所在见教，无有贵贱种类也。" }
      - { type: j, text: "子曰：“道不同，不相为谋。”" }
      - { type: z, text: "“子曰：道不同，不相为谋”。○正义曰：此章言人之为事，必须先谋。" }
      - { type: j, text: "若道同者共谋，则情审不误。若道不同而相为谋，则事不成也。" }
      - { type: j, text: "子曰：“辞达而已矣。”（孔曰：“凡事莫过於实，辞达则足矣，不烦文艳" }
      - { type: j, text: "之辞。”）" }
      - { type: z, text: "“子曰：辞达而已矣”。○正义曰：此章明言语之法也。凡事莫过於实，" }
      - { type: j, text: "辞达则足矣，不烦文艳也。" }
      - { type: j, text: "师冕见，（孔曰：“师，乐人盲者，名冕。”）及阶，子曰：“阶也。”及" }
      - { type: j, text: "席，子曰：“席也。”皆坐，子告之曰：“某在斯，某在斯。”（孔曰：“历告" }
      - { type: j, text: "以坐中人姓字、所在处。”）师冕出。子张问曰：“与师言之道与？”子曰：" }
      - { type: j, text: "“然，固相师之道也。”（马曰：“相，导也。”）" }
      - { type: z, text: "“师冕见”至“道也”。○正义曰：此章论相师之礼也。“师冕见”者，" }
      - { type: j, text: "师，乐人盲者，名冕。见，谓来见孔子也。“及阶，子曰：‘阶也。’及席，子" }
      - { type: j, text: "曰：‘席也’”者，师冕及阶、及席，孔子并告之，使师冕知而升阶、登席也。" }
      - { type: j, text: "“皆坐，子告之曰：某在斯，某在斯”者，孔子见瞽者必起，弟子亦起。冕既登" }
      - { type: j, text: "席而坐，孔子及弟子亦皆坐。孔子历以坐中人姓字、所在处告师冕，使知也。" }
      - { type: j, text: "“师冕出。子张问曰：与师言之道与”者，道谓礼也。子张见孔子历告之，未尝" }
      - { type: j, text: "知此礼。既师冕出去，而问孔子曰：“此是与师言之礼与？”“子曰：然，固相" }
      - { type: j, text: "师之道也”者，相犹导也。孔子然答子张，言此固是相导乐师之礼也。" }
