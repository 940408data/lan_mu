# 論語注疏卷19（邢昺疏）：j 為經文＋魏何晏集解，z 為疏文。
sections:
  - id: juan19
    name: 正文
    blocks:
      - { type: z, text: "正义曰：此篇记士行、交情、仁人、勉学，或接闻夫子之语，或辨扬圣" }
      - { type: j, text: "师之德，以其皆弟子所言，故善次诸篇之後。" }
      - { type: j, text: "子张曰：“士见危致命，（孔曰：“致命，不爱其身。”）见得思义，祭思" }
      - { type: j, text: "敬，丧思哀，其可已矣。”" }
      - { type: z, text: "“子张曰：士见危致命，见得思义，祭思敬，丧思哀，其可已矣”。○" }
      - { type: j, text: "正义曰：此章言士行也。士者，有德之称，自卿大夫已下皆是。致命，谓不爱其" }
      - { type: j, text: "身。子张言，为士者，见君有危难，不爱其身，致命以救之；见得利禄，思义然" }
      - { type: j, text: "後取；有祭事，思尽其敬；有丧事，当尽其哀，有此行者，其可以为士已矣。" }
      - { type: j, text: "子张曰：“执德不弘，信道不笃，焉能为有？焉能为亡？”（孔曰：“言无" }
      - { type: j, text: "所轻重。”）" }
      - { type: z, text: "“子张曰：执德不弘，信道不笃，焉能为有？焉能为亡？”○正义曰：" }
      - { type: j, text: "此章言人行之不备者。弘，大也。笃，厚也。亡，无也。言人执守其德，不能弘" }
      - { type: j, text: "大，虽信善道，不能笃厚，人之若此，虽存於世，何能为有而重？虽没於世，何" }
      - { type: j, text: "能为无而轻？言於世无所轻重也。" }
      - { type: j, text: "子夏之门人问交於子张。（孔曰：“问与人交接之道。”）子张曰：“子夏" }
      - { type: j, text: "云何？”对曰：“子夏曰：‘可者与之，其不可者拒之。’”子张曰：“异乎吾" }
      - { type: j, text: "所闻。君子尊贤而容众，嘉善而矜不能。我之大贤与，於人何所不容？我之不贤" }
      - { type: j, text: "与，人将拒我，如之何其拒人也？”（包曰：“友交当如子夏，交当如子张。”）" }
      - { type: z, text: "“子夏”至“人也”。○正义曰：此章论与人结交之道。“子夏之门人" }
      - { type: j, text: "问交於子张”者，门人，谓弟子。“问交”，问与人交接之道。“子张曰：子夏" }
      - { type: j, text: "云何”者，子张反问子夏之门人，汝师尝说结交之道云何乎？“对曰：子夏曰：" }
      - { type: j, text: "可者与之，不可者拒之”者，子夏弟子对子张述子夏之言也。子夏言：结交之道，" }
      - { type: j, text: "若彼人贤，可与交者，即与之交；若彼人不贤，不可与之交者，则拒之而不交。" }
      - { type: j, text: "“子张曰：异乎吾所闻”者，言已之所闻结交之道与子夏所说异也。“君子尊贤" }
      - { type: j, text: "而容众，嘉善而矜不能”者，此所闻之异者也。言君子之人，见彼贤则尊重之，" }
      - { type: j, text: "虽众多亦容纳之。人有善行者则嘉美之，不能者则哀矜之。“我之大贤与，於人" }
      - { type: j, text: "何所不容？我之不贤与，人将拒我，如之何其拒人也”者，既陈其所闻，又论其" }
      - { type: j, text: "不可拒人之事。诚如子夏所说，可者与之，不可者拒之。设若我之大贤，则所在" }
      - { type: j, text: "见容也。我若不贤，则人将拒我，不与己交，又何暇拒他人乎？然二子所言，各" }
      - { type: j, text: "是其见论交之道，不可相非。友交当如子夏，交当如子张。" }
      - { type: j, text: "子夏曰：“虽小道，必有可观者焉，（小道，谓异端。）致远恐泥，（包曰：" }
      - { type: j, text: "“泥难不通。”）是以君子不为也。”" }
      - { type: z, text: "“子夏曰：虽小道，必有可观者焉；致远恐泥，是以君子不为也”。○" }
      - { type: j, text: "正义曰：此章勉人学为大道正典也。小道谓异端之说，百家语也。虽曰小道，亦" }
      - { type: j, text: "必有小理可观览者焉，然致远经久，则恐泥难不通，是以君子不学也。" }
      - { type: j, text: "子夏曰：“日知其所亡，（孔曰：“日知其所未闻。”）月无忘其所能，可" }
      - { type: j, text: "谓好学也已矣。”" }
      - { type: z, text: "“子夏曰：日知其所亡，月无忘其所能，可谓好学也已矣”。○正义曰：" }
      - { type: j, text: "此章劝学也。亡，无也。旧无闻者当学之，使日知其所未闻。旧已能者当温寻之，" }
      - { type: j, text: "使月无忘也。能如此者，可以谓之好学。" }
      - { type: j, text: "子夏曰：“博学而笃志，（孔曰：“广学而厚识之。”）切问而近思，（切" }
      - { type: j, text: "问者，切问於己所学未悟之事。近思者，思己所未能及之事。问所未学，远思" }
      - { type: j, text: "所未达，则於所习者不精，所思者不解。）仁在其中矣。”" }
      - { type: z, text: "“子夏曰：博学而笃志，切问而近思，仁在其中矣”。○正义曰：此章" }
      - { type: j, text: "论好学近於仁也。博，广也。笃，厚也。志，识也。言广学而厚识之，使不忘。" }
      - { type: j, text: "切问者，亲切问於己所学未悟之事，不滥问之也。近思者，思己所未能及之事，" }
      - { type: j, text: "不远思也。若问所未学，远思所未达，则於所习者不精，所思者不解。仁者之" }
      - { type: j, text: "性纯笃，今学者既能笃志近思，故曰仁在其中矣。" }
      - { type: j, text: "子夏曰：“百工居肆以成其事，君子学以致其道。”（包曰：“言百工处其" }
      - { type: j, text: "肆则事成，犹君子学以致其道。”）" }
      - { type: z, text: "“子夏曰：百工居肆以成其事，君子学以致其道”。○正义曰：此章亦" }
      - { type: j, text: "勉人学，举百工以为喻也。审曲面势以饬五材，以辨民器，谓之百工。五材各有" }
      - { type: j, text: "工，言百，众言之也。肆，谓官府造作之处也。致，至也。言百工处其肆，则能" }
      - { type: j, text: "成其事，犹君子勤於学，则能至於道也。" }
      - { type: j, text: "子夏曰：“小人之过也必文。”（孔曰：“文饰其过，不言情实。”）" }
      - { type: z, text: "“子夏曰：小人之过也必文”。○正义曰：此章言小人不能改过也。言" }
      - { type: j, text: "小人之有过也，必文饰其过，强为辞理，不言情实也。" }
      - { type: j, text: "子夏曰：“君子有三变：望之俨然，即之也温，听其言也厉。”（郑曰：" }
      - { type: j, text: "“厉，严正。”）" }
      - { type: z, text: "“子夏曰：君子有三变：望之俨然，即之也温，听其言也厉。”○正义" }
      - { type: j, text: "曰：此章论君子之德也。望之、即之及听其言也，有此三者，变易常人之事也。" }
      - { type: j, text: "厉，严正也。常人，远望之则多懈惰，即近之则颜色猛厉，听其言则多佞邪。唯" }
      - { type: j, text: "君子则不然，人远望之则正其衣冠，尊其瞻视，常俨然也；就近之则颜色温和，" }
      - { type: j, text: "及听其言辞，则严正而无佞邪也。" }
      - { type: j, text: "子夏曰：“君子信而後劳其民，未信则以为厉己也。（王曰：“厉，犹病也。”）" }
      - { type: j, text: "信而後谏，未信则以为谤己也。”" }
      - { type: z, text: "“子夏曰：君子信而後劳其民，未信则以为厉己也。信而後谏，未信则" }
      - { type: j, text: "以为谤己也。”○正义曰：此章论君子使下事上之法也。厉，犹病也。言君子若" }
      - { type: j, text: "在上位，当先示信於民，然後劳役其民，则民忘其苦也。若未尝施信而便劳役之，" }
      - { type: j, text: "则民以为从欲崇侈、妄加困病於己也。若为人臣，当先尽忠於君，待君信己，而" }
      - { type: j, text: "後可谏君之失。若君未信己，而便称君过失以谏诤之，则君以为谤ゥ於己也。" }
      - { type: j, text: "子夏曰：“大德不逾闲，（孔曰：“闲，犹法也。”）小德出入可也。”" }
      - { type: j, text: "（孔曰：“小德不能不逾法，故曰出入可。”）" }
      - { type: z, text: "“子夏曰：大德不逾闲，小德出入可也”。○正义曰：此章论人之德有" }
      - { type: j, text: "小大，而行亦不同也。闲，犹法也。大德之人，谓上贤也，所行皆不越法则也。" }
      - { type: j, text: "小有德者，谓次贤之人，不能不逾法。有时逾法而出，旋能入守其法，不责其备，" }
      - { type: j, text: "故曰可也。" }
      - { type: j, text: "子游曰：“子夏之门人小子，当洒扫应对进退，则可矣，抑末也。本之则无，" }
      - { type: j, text: "如之何？”（包曰：“言子夏弟子，但当对宾客威仪礼节之事则可。然此但是" }
      - { type: j, text: "人之末事耳，不可无其本，故云本之则无，如之何？”）子夏闻之，曰：“噫！" }
      - { type: j, text: "（孔曰：“噫，心不平之声。”）言游过矣！君子之道，孰先传焉？孰後倦焉？" }
      - { type: j, text: "（包曰：“言先传业者必先厌倦，故我门人先教以小事，後将教以大道。”）譬" }
      - { type: j, text: "诸草木，区以别矣。（马曰：“言大道与小道殊异。譬如草木，异类区别，言学" }
      - { type: j, text: "当以次。”）君子之道，焉可诬也？（马曰：“君子之道，焉可使诬言我门人但" }
      - { type: j, text: "能洒扫而已。”）有始有卒者，其唯圣人乎！”（孔曰：“终始如一，唯圣人耳。”）" }
      - { type: z, text: "“子游”至“人乎”。○正义曰：此章论人学业有先後之法也。“子游" }
      - { type: j, text: "曰：子夏之门人小子，当洒扫应对进退，则可矣，抑未也。本之则无，如之何”" }
      - { type: j, text: "者，子游，言偃也。门人小子，谓弟子也。应，当也。抑，语辞也。本，谓先王" }
      - { type: j, text: "之道。言偃有时评论子夏之弟子，但当对宾客威仪礼节之事则可。然此但是人" }
      - { type: j, text: "之末事耳，不可无其本。今子夏弟子於其本先王之道则无有，不可奈何，故云如" }
      - { type: j, text: "之何也。“子夏闻之，曰：噫”者，噫，心不平之声。子夏既闻子游之言，中心" }
      - { type: j, text: "不平之，故曰噫！“言游过矣”者，谓言偃所说为过失也。“君子之道，孰先传" }
      - { type: j, text: "焉？孰後倦焉”者，言君子教人之道，先传业者必先厌倦，谁有先传而後倦者乎？" }
      - { type: j, text: "子夏言，我之意，恐门人闻大道而厌倦，故先教以小事，後将教以大道也。“譬" }
      - { type: j, text: "诸草木，区以别矣”者，诸，之也。言大道与小道殊异，譬之草木，异类区别，" }
      - { type: j, text: "言学当以次也。“君子之道，焉可诬也”者，言君子之道，当知学业以次，安可" }
      - { type: j, text: "便诬罔言我门人但能洒扫而已。“有始有卒者，其唯圣人乎”者，卒，犹终也。" }
      - { type: j, text: "言人之学道，靡不有初，鲜克有终，能终始如一，不厌倦者，其唯圣人耳。" }
      - { type: j, text: "子夏曰：“仕而优则学，（马曰：“行有馀力，则以学文。”）学而优则仕。”" }
      - { type: z, text: "“子夏曰：仕而优则学，学而优则仕”。○正义曰：此章劝学也。言人" }
      - { type: j, text: "之仕官行己职而优间有馀力，则以学先王之遗文也。若学而德业优长者则当仕进，" }
      - { type: j, text: "以行君臣之义也。" }
      - { type: j, text: "子游曰：“丧致乎哀而止。”（孔曰：“毁不灭性。”）" }
      - { type: z, text: "“子游曰：丧致乎哀而止”。○正义曰：此章言居丧之礼也。言人有父" }
      - { type: j, text: "母之丧，当致极哀，不得过毁以至灭性，灭性则非孝。○注“毁不灭性”。○" }
      - { type: j, text: "正义曰：此《孝经》文也。注云：“不食三日，哀毁过情，灭性而死，皆亏孝道，" }
      - { type: j, text: "故圣人制礼施教，不令至於陨灭。”" }
      - { type: j, text: "子游曰：“吾友张也为难能也，（包曰：“言子张容仪之难及。”）然而未" }
      - { type: j, text: "仁。”" }
      - { type: z, text: "“子游曰：吾友张也为难能也，然而未仁”。○正义曰：此章论子张材" }
      - { type: j, text: "德也。子游言吾同志之友子张，其容仪为难能及也，然而其德未仁。" }
      - { type: j, text: "曾子曰：“堂堂乎张也，难与并为仁矣。”（郑曰：“言子张容仪盛，而於" }
      - { type: j, text: "仁道薄也。”）" }
      - { type: z, text: "“曾子曰：“堂堂乎张也，难与并为仁矣。”○正义曰：此章亦论子张" }
      - { type: j, text: "材德也。堂堂，容仪盛貌。曾子言子张容仪堂堂然盛，於仁道则薄，故难与并为" }
      - { type: j, text: "仁矣。" }
      - { type: j, text: "曾子曰：“吾闻诸夫子：人未有自致者也，必也亲丧乎！”（马曰：“言人" }
      - { type: j, text: "虽未能自致尽於他事，至於亲丧，必自致尽。”）" }
      - { type: z, text: "“曾子曰：吾闻诸夫子：人未有自致者也，必也亲丧乎！”○正义曰：" }
      - { type: j, text: "此章论人致诚之事也。诸，之也。曾子言：“我闻之夫子言，人虽未能自致尽其" }
      - { type: j, text: "诚於他事，至於亲丧，必自致尽也。”" }
      - { type: j, text: "曾子曰：“吾闻诸夫子：孟庄子之孝也，其他可能也；其不改父之臣与父之" }
      - { type: j, text: "政，是难能也。”（马曰：“孟庄子，鲁大夫仲孙连也。谓在谅阴之中，父臣及" }
      - { type: j, text: "父政虽有不善者，不忍改也。”）" }
      - { type: z, text: "“曾子曰：吾闻诸夫子：孟庄子之孝也，其他可能也；其不改父之臣与" }
      - { type: j, text: "父之政，是难能也”。○正义曰：此章论鲁大夫仲孙连之孝行也。言其他哭泣之" }
      - { type: j, text: "哀，齐斩之情，饣粥之食，他人可能及之也。其在谅阴之中，父臣及父政虽有" }
      - { type: j, text: "不善者，不忍改之也，是他人难能也。" }
      - { type: j, text: "孟氏使阳肤为士师，（包曰：“阳肤，曾子弟子。士师，典狱之官。”）问" }
      - { type: j, text: "於曾子。曾子曰：“上失其道，民散久矣。如得其情，则哀矜而勿喜！”（马曰：" }
      - { type: j, text: "“民之离散为轻漂犯法，乃上之所为，非民之过，当哀矜之，勿自喜能得其情。”）" }
      - { type: z, text: "“孟氏”至“勿喜”。○正义曰：此章论典狱之法也。“孟氏使阳肤为" }
      - { type: j, text: "士师”者，阳肤，曾子弟子。士师，典狱之官。“问於曾子”者，问其师求典狱" }
      - { type: j, text: "之法也。曾子曰：“上失其道，民散久矣。如得其情，则哀矜而勿喜”者，言上" }
      - { type: j, text: "失为君之道，民人离散，为轻易漂掠，犯於刑法亦已久矣，乃上之失政所为，非" }
      - { type: j, text: "民之过。女若求得其情，当哀矜之勿自喜也。" }
      - { type: j, text: "子贡曰：“纣之不善，不如是之甚也。是以君子恶居下流，天下之恶皆归焉。”" }
      - { type: j, text: "（孔曰：“纣为不善，以丧天下，後世憎甚之，皆以天下之恶归之於纣。”）" }
      - { type: z, text: "“子贡曰：纣之不善，不如是之甚也。是以君子恶居下流，天下之恶皆" }
      - { type: j, text: "归焉”。○正义曰：此章戒人为恶也。纣名辛，字受德，商末世之王也。为恶不" }
      - { type: j, text: "道，周武王所杀。《谥法》：“残义损善曰纣。”言商纣虽为不善，以丧天下，" }
      - { type: j, text: "亦不如此之甚也，乃後人憎甚之耳。下流者，谓为恶行而处人下，若地形卑下，" }
      - { type: j, text: "则众流所归。人之为恶处下，众恶所归，是以君子常为善，不为恶，恶居下流故" }
      - { type: j, text: "也。纣为恶行，居下流，则人皆以天下之恶归之於纣也。" }
      - { type: j, text: "子贡曰：“君子之过也，如日月之食焉：过也，人皆见之；更也，人皆仰之。”" }
      - { type: j, text: "（孔曰：“更，改也。”）" }
      - { type: z, text: "“子贡曰：君子之过也，如日月之食焉；过也，人皆见之；更也，人皆" }
      - { type: j, text: "仰之。”正义曰：此章论君子之过，似日月之食也。更，改也。言君子苟有过也，" }
      - { type: j, text: "则为众所知，如日月正当食时，则万物皆观也。及其改过之时，则人皆复仰其德，" }
      - { type: j, text: "如日月明生之後，则万物亦皆仰其明。" }
      - { type: j, text: "卫公孙朝（马曰：“公孙朝，卫大夫。”）问於子贡曰：“仲尼焉学？”子" }
      - { type: j, text: "贡曰：“文、武之道，未坠於地，在人。贤者识其大者，不贤者识其小者，莫不" }
      - { type: j, text: "有文、武之道焉。夫子焉不学？（孔曰：“文武之道，未坠落於地，贤与不贤各" }
      - { type: j, text: "有所识。夫子无所不从学。”）而亦何常师之有？”（孔曰：“无所不从学，故" }
      - { type: j, text: "无常师。”）" }
      - { type: z, text: "“卫公”至“之有”。正义曰：此章论仲尼之德也。“卫公孙朝”者，" }
      - { type: j, text: "卫大夫也。“问於子贡曰：仲尼焉学”者，问子贡：仲尼何所从学，而得成此圣" }
      - { type: j, text: "也？意谓孔子生知，无师所从学也。“子贡曰：文、武之道，未坠於地，在人。" }
      - { type: j, text: "贤者识其大者，不贤者识其小者，莫不有文、武之道焉。夫子焉不学”者，焉，" }
      - { type: j, text: "犹安也。言文、武之道，未坠落於地，行之在人。贤与不贤，各有所识。夫子皆" }
      - { type: j, text: "从而学，安得不学乎？“而亦何常师之有”者，言夫子无所不从学，故无常师。" }
      - { type: j, text: "叔孙武叔语大夫於朝（马曰：“鲁大夫叔孙州仇。武，谥。”）曰：“子贡" }
      - { type: j, text: "贤於仲尼。”子服景伯以告子贡。子贡曰：“譬之宫墙，赐之墙也及肩，见室" }
      - { type: j, text: "家之好。夫子之墙数仞，不得其门而入，不见宗庙之美，百官之富。得其门者或" }
      - { type: j, text: "寡矣。（包曰：“七尺曰仞。”）夫子之云，不亦宜乎！”（包曰：“夫子，谓" }
      - { type: j, text: "武叔。”）" }
      - { type: z, text: "“叔孙”至“宜乎”。○正义曰：此章亦明仲尼之听也。“叔孙武叔语" }
      - { type: j, text: "大夫於朝曰：子贡贤於仲尼”者，叔孙武叔，鲁大夫。有时告语诸大夫於朝中曰：" }
      - { type: j, text: "“子贡贤才过於仲尼。”“子服景伯以告子贡”者，景伯亦鲁大夫，子服何也。" }
      - { type: j, text: "以武叔之言告之子贡也。“子贡曰：譬之宫墙，赐之墙也及肩，见室家之好。" }
      - { type: j, text: "夫子之墙数仞，不得其门而入，不见宗庙之美，百官之富”者，子贡闻武叔之言" }
      - { type: j, text: "已贤於仲尼，此由君子之道不可小知，故致武叔有此言。乃为之举喻曰：譬如人" }
      - { type: j, text: "居之宫，四围各有墙，墙卑则可见其在内之美，犹小人之道可以小知也；墙高" }
      - { type: j, text: "则不可见在内之美，犹君子之道不可小知也。今赐之墙也才及人肩，则人见" }
      - { type: j, text: "墙内室家之美好。夫子之墙，高乃数仞。七尺曰仞。若人不得其门而入，则不见" }
      - { type: j, text: "宗庙之美备，百官之富盛也。“得其门者或寡矣”者，言夫圣阈非凡可及，故得" }
      - { type: j, text: "其门而入者或少矣。“夫子之云，不亦宜乎”者，夫子，谓武叔。以此论之，即" }
      - { type: j, text: "武叔云子贡贤於仲尼，亦其宜也，不足怪焉。○注“马曰：鲁大夫叔孙州仇。武，" }
      - { type: j, text: "谥”。○正义曰：案《世本》，州仇，父子叔牙此六世孙叔孙不敢子也。《春秋》" }
      - { type: j, text: "定十年“秋，叔孙州仇、仲孙何忌帅师围后阝”。《左传》曰：“武叔懿子围" }
      - { type: j, text: "后阝。”是知叔孙武叔即州仇也。《谥法》云：“刚强直理曰武。”" }
      - { type: j, text: "叔孙武叔毁仲尼。子贡曰：“无以为也！仲尼不可毁也。他人之贤者，丘陵" }
      - { type: j, text: "也，犹可逾也；仲尼，日月也，无得而逾焉。人虽欲自绝，其何伤於日月乎？多" }
      - { type: j, text: "见其不知量也。”（言人虽自绝弃於日月，其何能伤之乎？足自见其不知量也。）" }
      - { type: z, text: "“叔孙”至“量也”。○正义曰：此章亦明仲尼也。“叔孙武叔毁仲尼”" }
      - { type: j, text: "者，訾毁孔子之德也。“子贡曰：无以为也！仲尼不可毁也”者，言无用为此毁" }
      - { type: j, text: "訾，夫仲尼之德不可毁也。“他人之贤者，丘陵也，犹可逾也；仲尼，日月也，" }
      - { type: j, text: "无得而逾焉”者，子贡又为设譬也。言他人之贤，譬如丘陵，虽曰广显，犹可逾" }
      - { type: j, text: "越；至於仲尼之贤，则如日月之至高，人不可得而逾也。“人虽欲自绝，其何伤" }
      - { type: j, text: "於日月乎”者，言人虽欲毁訾夫日月，特自绝弃，於日月其何能伤之乎？故人虽" }
      - { type: j, text: "欲毁仲尼，亦不能伤仲尼也，多见其不知量也。多，犹也。言非不能毁仲尼，" }
      - { type: j, text: "又足自见其不知量也。○注“言人”至“量也”。○正义曰：云“足自见其" }
      - { type: j, text: "不知量也”者，据此注意，似训“多”为“”。所以“多”得为“”者，古" }
      - { type: j, text: "人多、同音。“多见其不知量”，犹襄二十九年《左传》云：“多见疏也”，" }
      - { type: j, text: "服虔本作“祗见疏”，解云：“，也。”晋宋杜本皆作“多”。张衡《西京" }
      - { type: j, text: "赋》云：“炙炮夥，清酤多，皇恩溥，洪德施。”施与多为韵。此类众矣，故以" }
      - { type: j, text: "“多”为“”也。" }
      - { type: j, text: "陈子禽谓子贡曰：“子为恭也，仲尼岂贤於子乎？”子贡曰：“君子一言以" }
      - { type: j, text: "为知，一言以为不知，言不可不慎也。夫子之不可及也，犹天之不可阶而升也。" }
      - { type: j, text: "夫子之得邦家者，（孔曰：“谓为诸侯若卿大夫。”）所谓立之斯立，道之斯行，" }
      - { type: j, text: "绥之斯来，动之斯和。其生也荣，其死也哀，如之何其可及也？”（孔曰：“绥，" }
      - { type: j, text: "安也。言孔子为政，其立教则无不立，道之则莫不兴行，安之则远者来至，动之" }
      - { type: j, text: "则莫不和睦，故能生则荣显，死则哀痛。”）" }
      - { type: z, text: "“陈子”至“及也”。○正义曰：此章亦明仲尼之德也。“陈子禽谓子" }
      - { type: j, text: "贡曰：子为恭也，仲尼岂贤於子乎”者，此子禽必作陈亢，当是同其姓字耳。见" }
      - { type: j, text: "其子贡每事称誉其师，故谓子贡云：当是子为恭孙故也，其实仲尼才德岂贤於子" }
      - { type: j, text: "乎？“子贡曰：君子一言以为知，一言以为不知，言不可不慎也”者，子贡闻子" }
      - { type: j, text: "禽之言，以此言拒而非之也。言君子出一言是，则入以为有知；出一言非，则人" }
      - { type: j, text: "以为不知。知与不知，既由一言，则其言不可不慎也。今乃云仲尼岂贤於子乎？" }
      - { type: j, text: "则是女不慎其言，是为不知也。“夫子之不可及也，如天之不可阶而升也”者，" }
      - { type: j, text: "又为设譬，言夫子之德不可及也。他人之贤，犹他物之高者，可设阶梯而升上之。" }
      - { type: j, text: "至於仲尼之德，犹天之高，不可以阶梯而升上之。“夫子之得邦家者，所谓立之" }
      - { type: j, text: "斯立，道之斯行，绥之斯来，动之斯和。其生也荣，其死也哀，如之何其可及也”" }
      - { type: j, text: "者，又为广言仲尼为政之德也。得邦，谓为诸侯。得家，谓为卿大夫。绥，安也。" }
      - { type: j, text: "言孔子为政，其立教则无不立，道之则莫不兴行，安之则远者来至，动之则民莫" }
      - { type: j, text: "不和睦，故能生则荣显，死则哀痛，故如之何其可及也！" }
