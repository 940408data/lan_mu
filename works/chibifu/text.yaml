# du：斷讀段字符串列表（句讀施朱），各段須為 text 連續前綴片段，段末鈐朱點；列尾無段不施點
sections:
  - id: text
    name: 賦
    columns:
      - line: 1
        text: 壬戌之秋七月既望蘇子與
        du: [壬戌之秋, 七月既望]
      - line: 2
        text: 客泛舟遊於赤壁之下
        du: [客泛舟, 遊於赤壁之下]
      - line: 3
        text: 清風徐來水波不興舉酒屬客
        du: [清風徐來, 水波不興, 舉酒屬客]
      - line: 4
        text: 誦明月之詩歌窈窕之章
        du: [誦明月之詩, 歌窈窕之章]
      - line: 5
        text: 少焉月出於東山之上
        du: [少焉, 月出於東山之上]
      - line: 6
        text: 徘徊於斗牛之間白露橫江
        du: [徘徊於斗牛之間, 白露橫江]
      - line: 7
        text: 水光接天縱一葦之所如
        du: [水光接天, 縱一葦之所如]
      - line: 8
        text: 凌萬頃之茫然浩浩乎如馮
        du: [凌萬頃之茫然]
      - line: 9
        text: 虛御風而不知其所止
        du: [虛御風, 而不知其所止]
      - line: 10
        text: 飄飄乎如遺世獨立羽化而
        du: [飄飄乎如遺世獨立]
      - line: 11
        text: 登仙於是飲酒樂甚扣舷而
        du: [登仙, 於是飲酒樂甚]
      - line: 12
        text: 歌之歌曰桂棹兮蘭槳
        du: [歌之, 歌曰, 桂棹兮蘭槳]
      - line: 13
        text: 擊空明兮溯流光渺渺兮予懷
        du: [擊空明兮溯流光, 渺渺兮予懷]
      - line: 14
        text: 望美人兮天一方客有吹洞
        du: [望美人兮天一方]
      - line: 15
        text: 簫者倚歌而和之其聲嗚嗚然
        du: [簫者, 倚歌而和之, 其聲嗚嗚然]
      - line: 16
        text: 如怨如慕如泣如訴餘音嫋嫋
        du: [如怨如慕, 如泣如訴, 餘音嫋嫋]
      - line: 17
        text: 不絕如縷舞幽壑之潛蛟
        du: [不絕如縷, 舞幽壑之潛蛟]
      - line: 18
        text: 泣孤舟之嫠婦蘇子愀然
        du: [泣孤舟之嫠婦, 蘇子愀然]
      - line: 19
        text: 正襟危坐而問客曰何為其
        du: [正襟危坐而問客曰]
      - line: 20
        text: 然也客曰月明星稀烏鵲南飛
        du: [然也, 客曰, 月明星稀, 烏鵲南飛]
      - line: 21
        text: 此非曹孟德之詩乎西望夏口
        du: [此非曹孟德之詩乎, 西望夏口]
      - line: 22
        text: 東望武昌山川相繆鬱乎蒼蒼
        du: [東望武昌, 山川相繆, 鬱乎蒼蒼]
      - line: 23
        text: 此非孟德之困於周郎者乎
        du: [此非孟德之困於周郎者乎]
      - line: 24
        text: 方其破荊州下江陵順流而
        du: [方其破荊州, 下江陵]
      - line: 25
        text: 東也舳艫千里旌旗蔽空
        du: [東也, 舳艫千里, 旌旗蔽空]
      - line: 26
        text: 釃酒臨江橫槊賦詩固一世
        du: [釃酒臨江, 橫槊賦詩]
      - line: 27
        text: 之雄也而今安在哉況吾與
        du: [之雄也, 而今安在哉]
      - line: 28
        text: 子漁樵於江渚之上侶魚蝦
        du: [子漁樵於江渚之上]
      - line: 29
        text: 而友麋鹿駕一葉之扁舟
        du: [而友麋鹿, 駕一葉之扁舟]
      - line: 30
        text: 舉匏樽以相屬寄蜉蝣於天地
        du: [舉匏樽以相屬, 寄蜉蝣於天地]
      - line: 31
        text: 渺滄海之一粟哀吾生之須臾
        du: [渺滄海之一粟, 哀吾生之須臾]
      - line: 32
        text: 羨長江之無窮挾飛仙以遨遊
        du: [羨長江之無窮, 挾飛仙以遨遊]
      - line: 33
        text: 抱明月而長終知不可乎驟得
        du: [抱明月而長終, 知不可乎驟得]
      - line: 34
        text: 托遺響於悲風蘇子曰
        du: [托遺響於悲風, 蘇子曰]
      - line: 35
        text: 客亦知夫水與月乎逝者如斯
        du: [客亦知夫水與月乎, 逝者如斯]
      - line: 36
        text: 而未嘗往也盈虛者如彼
        du: [而未嘗往也, 盈虛者如彼]
      - line: 37
        text: 而卒莫消長也蓋將自其變
        du: [而卒莫消長也]
      - line: 38
        text: 者而觀之則天地曾不能以
        du: [者而觀之]
      - line: 39
        text: 一瞬自其不變者而觀之
        du: [一瞬, 自其不變者而觀之]
      - line: 40
        text: 則物與我皆無盡也而又何
        du: [則物與我皆無盡也]
      - line: 41
        text: 羨乎且夫天地之間物各有主
        du: [羨乎, 且夫天地之間, 物各有主]
      - line: 42
        text: 苟非吾之所有雖一毫而莫取
        du: [苟非吾之所有, 雖一毫而莫取]
      - line: 43
        text: 惟江上之清風與山間之明月
        du: [惟江上之清風, 與山間之明月]
      - line: 44
        text: 耳得之而為聲目遇之而成色
        du: [耳得之而為聲, 目遇之而成色]
      - line: 45
        text: 取之無禁用之不竭是造物
        du: [取之無禁, 用之不竭]
      - line: 46
        text: 者之無盡藏也而吾與子之
        du: [者之無盡藏也]
      - line: 47
        text: 所共適客喜而笑洗盞更酌
        du: [所共適, 客喜而笑, 洗盞更酌]
      - line: 48
        text: 餚核既盡杯盤狼籍相與枕
        du: [餚核既盡, 杯盤狼籍]
      - line: 49
        text: 藉乎舟中不知東方之既白
        du: [藉乎舟中, 不知東方之既白]
