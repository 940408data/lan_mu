labels:
  - page: 424
    col: 9
    role: j
    text: 論語卷第十朱熹集注
  - page: 424
    col: 10
    role: title
    text: 子張第十九
  - page: 424
    col: 11
    role: z
    text: 此篇皆記弟子之言而子夏爲多
  - page: 424
    col: 12
    role: z
    text: 子貢次之蓋孔門自顔子以下穎
  - page: 424
    col: 13
    role: z
    text: 悟莫若子貢自曾子以下篤實無
  - page: 424
    col: 14
    role: z
    text: 若子夏故特記之詳焉凡二十五
  - page: 424
    col: 15
    role: z
    text: 章
  - page: 424
    col: 16
    role: j
    text: 子張曰士見危致命見得思義祭思敬
  - page: 425
    col: 1
    role: j
    text: 喪思哀其可已矣
  - page: 425
    col: 2
    role: z
    text: 致命謂委致其命猶言授命也四者
  - page: 425
    col: 3
    role: z
    text: 立身之大節一有不至則餘無足觀
  - page: 425
    col: 4
    role: z
    text: 故言士能如此則庶乎其可矣
  - page: 425
    col: 5
    role: j
    text: 子張曰執德不弘信道不篤焉能為有
  - page: 425
    col: 6
    role: j
    text: 焉能為亡
  - page: 425
    col: 7
    role: z
    text: 焉於虔反亡讀作無下同○有所得
  - page: 425
    col: 8
    role: z
    text: 而守之太狹則德孤有所聞而信之
  - page: 425
    col: 9
    role: z
    text: 不篤則道廢焉能為有亡猶言不足
  - page: 425
    col: 10
    role: z
    text: 為輕重
  - page: 425
    col: 11
    role: j
    text: 子夏之門人問交於子張子張曰子夏
  - page: 425
    col: 12
    role: j
    text: 云何對曰子夏曰可者與之其不可者
  - page: 425
    col: 13
    role: j
    text: 拒之子張曰異乎吾所聞君子尊賢而
  - page: 425
    col: 14
    role: j
    text: 容衆嘉善而矜不能我之大賢與於人
  - page: 425
    col: 15
    role: j
    text: 何所不容我之不賢與人將拒我如之
  - page: 425
    col: 16
    role: j
    text: 何其拒人也
  - page: 426
    col: 1
    role: j
    text: 賢與之與平聲。子夏之言迫狹子
  - page: 426
    col: 2
    role: j
    text: 張譏之是也但其所言亦有過高之
  - page: 426
    col: 3
    role: j
    text: 病蓋大賢雖無所不容然大故亦所
  - page: 426
    col: 4
    role: j
    text: 當絕不賢固不可以拒人然損友亦
  - page: 426
    col: 5
    role: z
    text: 所當遠學者不可不察
  - page: 426
    col: 6
    role: j
    text: 子夏曰雖小道必有可觀者焉致遠恐
  - page: 426
    col: 7
    role: j
    text: 泥是以君子不為也
  - page: 426
    col: 8
    role: j
    text: 泥去聲。小道如農圃醫卜之屬泥
  - page: 426
    col: 9
    role: j
    text: 不通也。楊氏曰百家眾技猶耳目
  - page: 426
    col: 10
    role: j
    text: 鼻口皆有所明而不能相通非無可
  - page: 426
    col: 11
    role: j
    text: 觀也致遠則泥矣故君子不為也
  - page: 426
    col: 12
    role: j
    text: 子夏曰日知其所亡月無忘其所能可
  - page: 426
    col: 13
    role: j
    text: 謂好學也已矣
  - page: 426
    col: 14
    role: z
    text: 亡讀作無好去聲。云無也謂己之
  - page: 426
    col: 15
    role: j
    text: 所未有。尹氏曰好學者日新而不
  - page: 426
    col: 16
    role: j
    text: 失
  - page: 427
    col: 1
    role: j
    text: 子夏曰博學而篤志切問而近思仁在
  - page: 427
    col: 2
    role: j
    text: 其中矣
  - page: 427
    col: 3
    role: z
    text: 四者皆學問思辨之事耳未及乎力
  - page: 427
    col: 4
    role: z
    text: 行而爲仁也然從事於此則心不外
  - page: 427
    col: 5
    role: z
    text: 馳而所存自熟故曰仁在其中矣○
  - page: 427
    col: 6
    role: z
    text: 程子曰博學而篤志切問而近思何
  - page: 427
    col: 7
    role: z
    text: 以言仁在其中矣學者要思得之了
  - page: 427
    col: 8
    role: z
    text: 此便是徹上徹下之道又曰學不博
  - page: 427
    col: 9
    role: z
    text: 則不能守約志不篤則不能力行切
  - page: 427
    col: 10
    role: z
    text: 問近思在己者則仁在其中矣又曰
  - page: 427
    col: 11
    role: z
    text: 近思者以類而推○蘇氏曰博學而
  - page: 427
    col: 12
    role: z
    text: 志不篤則大而無成泛問遠思則勞
  - page: 427
    col: 13
    role: z
    text: 而無功
  - page: 427
    col: 14
    role: j
    text: 子夏曰百工居肆以成其事君子學以
  - page: 427
    col: 15
    role: j
    text: 致其道
  - page: 427
    col: 16
    role: z
    text: 肆謂官府造作之處致極也工不居
  - page: 428
    col: 1
    role: z
    text: 肆則遷於異物而業不精君子不學
  - page: 428
    col: 2
    role: z
    text: 則奪於外誘而志不篤○尹氏曰學
  - page: 428
    col: 3
    role: z
    text: 所以致其道也百工居肆必務成其
  - page: 428
    col: 4
    role: z
    text: 事君子之於學可不知所務哉愚按
  - page: 428
    col: 5
    role: z
    text: 二說相湏其義始備
  - page: 428
    col: 6
    role: j
    text: 子夏曰小人之過也必文
  - page: 428
    col: 7
    role: z
    text: 文去聲○文飾之也小人憚於改過
  - page: 428
    col: 8
    role: z
    text: 而不憚於自欺故必文以重其過
  - page: 428
    col: 9
    role: j
    text: 子夏曰君子有三變望之儼然即之也
  - page: 428
    col: 10
    role: j
    text: 温聽其言也厲
  - page: 428
    col: 11
    role: z
    text: 儼然者貌之莊温者色之和厲者辭
  - page: 428
    col: 12
    role: z
    text: 之確○程子曰他人儼然則不温温
  - page: 428
    col: 13
    role: z
    text: 則不厲惟孔子全之○謝氏曰此非
  - page: 428
    col: 14
    role: z
    text: 有意於變蓋並行而不相悖也如良
  - page: 428
    col: 15
    role: z
    text: 玉温潤而栗然
  - page: 428
    col: 16
    role: j
    text: 子夏曰君子信而後勞其民未信則以
  - page: 429
    col: 1
    role: j
    text: 爲厲己也信而後諫未信則以爲謗己
  - page: 429
    col: 2
    role: j
    text: 也
  - page: 429
    col: 3
    role: z
    text: 信謂誠意惻怛而人信之也厲猶病
  - page: 429
    col: 4
    role: z
    text: 也事上使下皆必誠意交孚而後可
  - page: 429
    col: 5
    role: z
    text: 以有爲
  - page: 429
    col: 6
    role: j
    text: 子夏曰大德不踰閑小德出入可也
  - page: 429
    col: 7
    role: z
    text: 大德小德猶言大節小節閑闌也所
  - page: 429
    col: 8
    role: z
    text: 以止物之出入言人能先立乎其大
  - page: 429
    col: 9
    role: j
    text: 者則小節雖或未盡合理亦無害也○
  - page: 429
    col: 10
    role: z
    text: 吳氏曰此章之言不能無弊學者詳
  - page: 429
    col: 11
    role: z
    text: 之
  - page: 429
    col: 12
    role: j
    text: 子游曰子夏之門人小子當洒掃應對
  - page: 429
    col: 13
    role: j
    text: 進退則可矣抑末也本之則無如之何
  - page: 429
    col: 14
    role: z
    text: 洒色賣反掃素報反○子游譏子夏
  - page: 429
    col: 15
    role: z
    text: 弟子於威儀容節之間則可矣然此
  - page: 429
    col: 16
    role: z
    text: 小學之末耳推其本如大學正心誠
  - page: 430
    col: 1
    role: j
    text: 意之事則無有
  - page: 430
    col: 2
    role: j
    text: 子夏聞之曰噫言游過矣君子之道孰
  - page: 430
    col: 3
    role: j
    text: 先傳焉孰後倦焉譬諸草木區以別矣
  - page: 430
    col: 4
    role: j
    text: 君子之道焉可誣也有始有卒者其惟
  - page: 430
    col: 5
    role: j
    text: 聖人乎
  - page: 430
    col: 6
    role: z
    text: 別彼列反焉於虔反○倦如誨人不
  - page: 430
    col: 7
    role: z
    text: 倦之倦區猶類也言君子之道非以
  - page: 430
    col: 8
    role: z
    text: 其末爲先而傳之非以其本爲後而
  - page: 430
    col: 9
    role: z
    text: 倦教但學者所至自有淺深如草木
  - page: 430
    col: 10
    role: z
    text: 之有大小其類固有別矣若不量其
  - page: 430
    col: 11
    role: z
    text: 淺深不問其生熟而槩以高且遠者
  - page: 430
    col: 12
    role: z
    text: 強而語之則是誣之而已君子之道
  - page: 430
    col: 13
    role: z
    text: 豈可如此若夫始終本末一以貫之
  - page: 430
    col: 14
    role: z
    text: 則惟聖人爲然豈可責之門人小子
  - page: 430
    col: 15
    role: z
    text: 乎○程子曰君子教人有序先傳以
  - page: 430
    col: 16
    role: z
    text: 小者近者而後教以大者遠者非先
  - page: 431
    col: 1
    role: z
    text: 傳以近小而後不教以遠大也又曰
  - page: 431
    col: 2
    role: z
    text: 洒掃應對便是形而上者理無大小
  - page: 431
    col: 3
    role: z
    text: 故也故君子只在慎獨又曰聖人之
  - page: 431
    col: 4
    role: z
    text: 道更無精粗從洒掃應對與精義入
  - page: 431
    col: 5
    role: z
    text: 神通貫只一理雖洒掃應對只看所
  - page: 431
    col: 6
    role: z
    text: 以然如何又曰凡物有本末不可分
  - page: 431
    col: 7
    role: z
    text: 本末為兩段事洒掃應對是其然必
  - page: 431
    col: 8
    role: z
    text: 有所以然又曰自洒掃應對上便可
  - page: 431
    col: 9
    role: z
    text: 到聖人事愚按程子第一條說此章
  - page: 431
    col: 10
    role: z
    text: 文意最為詳盡其後四條皆以明精
  - page: 431
    col: 11
    role: z
    text: 粗本末其分雖殊而理則一學者當
  - page: 431
    col: 12
    role: z
    text: 循序而漸進不可厭末而求本蓋與
  - page: 431
    col: 13
    role: z
    text: 第一條之意實相表裏非謂末即是
  - page: 431
    col: 14
    role: z
    text: 本但學其末而本便在此也
  - page: 431
    col: 15
    role: j
    text: 子夏曰仕而優則學學而優則仕
  - page: 431
    col: 16
    role: z
    text: 優有餘力也仕與學理同而事異故
  - page: 432
    col: 1
    role: z
    text: 當其事者必先有以盡其事而後可
  - page: 432
    col: 2
    role: z
    text: 及其餘然仕而學則所以資其仕者
  - page: 432
    col: 3
    role: z
    text: 益深學而仕則所以驗其學者益廣
  - page: 432
    col: 4
    role: j
    text: 子游曰喪致乎哀而止
  - page: 432
    col: 5
    role: z
    text: 致極其哀不尚文飾也○楊氏曰喪
  - page: 432
    col: 6
    role: z
    text: 與其易寧戚不若禮不足而哀有餘
  - page: 432
    col: 7
    role: z
    text: 之意愚按而止二字亦微有過於高
  - page: 432
    col: 8
    role: z
    text: 遠而簡略細微之弊學者詳之
  - page: 432
    col: 9
    role: j
    text: 子游曰吾友張也爲難能也然而未仁
  - page: 432
    col: 10
    role: z
    text: 子張行過高而少誠實惻怛之意
  - page: 432
    col: 11
    role: j
    text: 曾子曰堂堂乎張也難與並爲仁矣
  - page: 432
    col: 12
    role: z
    text: 堂堂容貌之盛言其務外自高不可
  - page: 432
    col: 13
    role: z
    text: 輔而爲仁亦不能有以輔人之仁也
  - page: 432
    col: 14
    role: z
    text: 范氏曰子張外有餘而内不足故門
  - page: 432
    col: 15
    role: z
    text: 人皆不與其爲仁子曰剛毅木訥近
  - page: 432
    col: 16
    role: z
    text: 仁寧外不足而内有餘庶可以爲仁
  - page: 433
    col: 1
    role: j
    text: 矣
  - page: 433
    col: 2
    role: j
    text: 曾子曰吾聞諸夫子人未有自致者也
  - page: 433
    col: 3
    role: j
    text: 必也親喪乎
  - page: 433
    col: 4
    role: z
    text: 致盡其極也蓋人之眞情所不能自
  - page: 433
    col: 5
    role: z
    text: 已者○尹氏曰親喪固所自盡也於
  - page: 433
    col: 6
    role: z
    text: 此不用其誠惡乎用其誠
  - page: 433
    col: 7
    role: j
    text: 曾子曰吾聞諸夫子孟莊子之孝也其
  - page: 433
    col: 8
    role: j
    text: 他可能也其不改父之臣與父之政是
  - page: 433
    col: 9
    role: j
    text: 難能也
  - page: 433
    col: 10
    role: z
    text: 孟莊子魯大夫名速其父獻子名蔑
  - page: 433
    col: 11
    role: z
    text: 獻子有賢德而莊子能用其臣守其
  - page: 433
    col: 12
    role: z
    text: 政故其他孝行雖有可稱而皆不若
  - page: 433
    col: 13
    role: z
    text: 此事之爲難
  - page: 433
    col: 14
    role: j
    text: 孟氏使陽膚爲士師問於曾子曾子曰
  - page: 433
    col: 15
    role: j
    text: 上失其道民散乆矣如得其情則哀矜
  - page: 433
    col: 16
    role: j
    text: 而勿喜
  - page: 434
    col: 1
    role: z
    text: 陽膚曾子曰上失情理不相維繫
  - page: 434
    col: 2
    role: z
    text: 相維繫○謝氏曰民之散也以俟之
  - page: 434
    col: 3
    role: z
    text: 無道教之無素故其犯法也非迫於
  - page: 434
    col: 4
    role: z
    text: 不得已則陷於不知也故得其情則
  - page: 434
    col: 5
    role: z
    text: 哀矜而勿喜
  - page: 434
    col: 6
    role: j
    text: 子貢曰紂之不善不如是之甚也是以
  - page: 434
    col: 7
    role: j
    text: 君子惡居下流天下之惡皆歸焉
  - page: 434
    col: 8
    role: z
    text: 惡居之惡去聲○下流地形卑下之
  - page: 434
    col: 9
    role: z
    text: 處衆流之所歸喻人身有汙賤之實
  - page: 434
    col: 10
    role: z
    text: 亦惡名之所聚也子貢言此欲人常
  - page: 434
    col: 11
    role: z
    text: 自警省不可一置其身於不善之地
  - page: 434
    col: 12
    role: z
    text: 非謂紂本無罪而虛被惡名也
  - page: 434
    col: 13
    role: j
    text: 子貢曰君子之過也如日月之食焉過
  - page: 434
    col: 14
    role: j
    text: 也人皆見之更也人皆仰之
  - page: 434
    col: 15
    role: z
    text: 更平聲
  - page: 434
    col: 16
    role: j
    text: 衛公孫朝問於子貢曰仲尼焉學
  - page: 435
    col: 1
    role: z
    text: 朝音潮焉於虔反○公孫朝衛大夫
  - page: 435
    col: 2
    role: j
    text: 子貢曰文武之道未墜於地在人賢者
  - page: 435
    col: 3
    role: j
    text: 識其大者不賢者識其小者莫不有文
  - page: 435
    col: 4
    role: j
    text: 武之道焉夫子焉不學而亦何常師之
  - page: 435
    col: 5
    role: j
    text: 有
  - page: 435
    col: 6
    role: z
    text: 識音志下焉字於虔反○文武之道
  - page: 435
    col: 7
    role: z
    text: 謂文王武王之謨訓功烈與凡周之
  - page: 435
    col: 8
    role: z
    text: 禮樂文章皆是也在人言人有能記
  - page: 435
    col: 9
    role: z
    text: 之者識記也
  - page: 435
    col: 10
    role: j
    text: 叔孫武叔語大夫於朝曰子貢賢於仲
  - page: 435
    col: 11
    role: j
    text: 尼
  - page: 435
    col: 12
    role: z
    text: 語去聲朝音潮○武叔魯大夫名州
  - page: 435
    col: 13
    role: z
    text: 仇
  - page: 435
    col: 14
    role: j
    text: 子服景伯以告子貢子貢曰譬之宫牆
  - page: 435
    col: 15
    role: j
    text: 賜之牆也及肩窺見室家之好
  - page: 435
    col: 16
    role: z
    text: 牆卑室淺
  - page: 436
    col: 1
    role: j
    text: 夫子之牆數仞不得其門而入不見宗
  - page: 436
    col: 2
    role: j
    text: 廟之美百官之富
  - page: 436
    col: 3
    role: j
    text: 七尺曰仞不入其門則不見其中之
  - page: 436
    col: 4
    role: j
    text: 所有言牆高而宮廣也
  - page: 436
    col: 5
    role: j
    text: 得其門者或寡矣夫子之云不亦宜乎
  - page: 436
    col: 6
    role: z
    text: 此夫子指武叔
  - page: 436
    col: 7
    role: j
    text: 叔孫武叔毁仲尼子貢曰無以爲也仲
  - page: 436
    col: 8
    role: j
    text: 尼不可毁也他人之賢者丘陵也猶可
  - page: 436
    col: 9
    role: j
    text: 踰也仲尼日月也無得而踰焉人雖欲
  - page: 436
    col: 10
    role: j
    text: 自絶其何傷於日月乎多見其不知量
  - page: 436
    col: 11
    role: j
    text: 也
  - page: 436
    col: 12
    role: z
    text: 量去聲○無以爲猶言無用爲此土
  - page: 436
    col: 13
    role: z
    text: 高曰丘大阜曰陵日月喻其至高自
  - page: 436
    col: 14
    role: z
    text: 絶謂以謗毁自絶於孔子多與祇同
  - page: 436
    col: 15
    role: z
    text: 適也不知量謂不自知其分量
  - page: 436
    col: 16
    role: j
    text: 陳子禽謂子貢曰子爲恭也仲尼豈賢
  - page: 437
    col: 1
    role: j
    text: 於子乎
  - page: 437
    col: 2
    role: z
    text: 爲恭謂爲恭敬推遜其師也
  - page: 437
    col: 3
    role: j
    text: 子貢曰君子一言以爲知一言以爲不
  - page: 437
    col: 4
    role: j
    text: 知言不可不愼也
  - page: 437
    col: 5
    role: z
    text: 知去聲○責子禽不謹言
  - page: 437
    col: 6
    role: j
    text: 夫子之不可及也猶天之不可階而升
  - page: 437
    col: 7
    role: j
    text: 也
  - page: 437
    col: 8
    role: z
    text: 階梯也大可爲也化不可爲也故曰
  - page: 437
    col: 9
    role: z
    text: 不可階而升
  - page: 437
    col: 10
    role: j
    text: 夫子之得邦家者所謂立之斯立道之
  - page: 437
    col: 11
    role: j
    text: 斯行綏之斯來動之斯和其生也榮其
  - page: 437
    col: 12
    role: j
    text: 死也哀如之何其可及也
  - page: 437
    col: 13
    role: z
    text: 道去聲○立之謂植其生也道引也
  - page: 437
    col: 14
    role: z
    text: 謂教之也行從也綏安也來歸附也
  - page: 437
    col: 15
    role: z
    text: 動謂鼓舞之也和所謂於變時雍言
  - page: 437
    col: 16
    role: z
    text: 其感應之妙神速如此榮謂莫不尊
  - page: 438
    col: 1
    role: z
    text: 親哀則如喪考妣。程子曰此聖人
  - page: 438
    col: 2
    role: z
    text: 之神化上下與天地同流者也。謝
  - page: 438
    col: 3
    role: z
    text: 氏曰觀子貢稱聖人語乃知晚年進
  - page: 438
    col: 4
    role: z
    text: 德蓋極於高遠也夫子之得邦家者
  - page: 438
    col: 5
    role: z
    text: 其鼓舞羣動捷於桴鼓影響人雖見
  - page: 438
    col: 6
    role: z
    text: 其變化而莫窺其所以變化也蓋不
  - page: 438
    col: 7
    role: z
    text: 離於聖而有不可知者存焉此殆難
  - page: 438
    col: 8
    role: z
    text: 以思勉及也
  - page: 438
    col: 9
    role: title
    text: 堯曰第二十
  - page: 438
    col: 10
    role: z
    text: 凡三章
  - page: 438
    col: 11
    role: j
    text: 堯曰咨爾舜天之曆數在爾躬允執其
  - page: 438
    col: 12
    role: j
    text: 中四海困窮天祿永終
  - page: 438
    col: 13
    role: z
    text: 此堯命舜而禪以帝位之辭咨嗟歎
  - page: 438
    col: 14
    role: z
    text: 聲曆數帝王相繼之次第猶歲時氣
  - page: 438
    col: 15
    role: z
    text: 節之先後也允信也中者無過不及
  - page: 438
    col: 16
    role: z
    text: 之名四海之人困窮則君祿亦永絕
  - page: 439
    col: 1
    role: z
    text: 矣戒之也
  - page: 439
    col: 2
    role: j
    text: 舜亦以命禹
  - page: 439
    col: 3
    role: z
    text: 舜後遜位於禹亦以此辭命之今見
  - page: 439
    col: 4
    role: z
    text: 於虞書大禹謨比此加詳
  - page: 439
    col: 5
    role: j
    text: 曰予小子履敢用玄牡敢昭告于皇皇
  - page: 439
    col: 6
    role: j
    text: 后帝有罪不敢赦帝臣不蔽簡在帝心
  - page: 439
    col: 7
    role: j
    text: 朕躬有罪無以萬方萬方有罪罪在朕
  - page: 439
    col: 8
    role: j
    text: 躬
  - page: 439
    col: 9
    role: z
    text: 此引商書湯誥之辭蓋湯旣放桀而
  - page: 439
    col: 10
    role: z
    text: 告諸侯也與書文大同小異曰上當
  - page: 439
    col: 11
    role: z
    text: 有湯字履蓋湯名用玄牡夏尚黑未
  - page: 439
    col: 12
    role: z
    text: 變其禮也簡閱也言桀有罪己不敢
  - page: 439
    col: 13
    role: z
    text: 赦而天下賢人皆上帝之臣己不敢
  - page: 439
    col: 14
    role: z
    text: 蔽簡在帝心惟帝所命此述其初請
  - page: 439
    col: 15
    role: z
    text: 命而伐桀之詞也又言君有罪非民
  - page: 439
    col: 16
    role: z
    text: 所致民有罪實君所爲見其厚於責
  - page: 440
    col: 1
    role: z
    text: 己薄於責人之意此其告諸侯之辭
  - page: 440
    col: 2
    role: z
    text: 也
  - page: 440
    col: 3
    role: j
    text: 周有大賚善人是富
  - page: 440
    col: 4
    role: z
    text: 賚來代反○此以下述武王事賚予
  - page: 440
    col: 5
    role: z
    text: 也武王克商大賚于四海見周書武
  - page: 440
    col: 6
    role: z
    text: 成篇此言其所冨者皆善人也詩序
  - page: 440
    col: 7
    role: z
    text: 云賚所以錫予善人蓋本於此
  - page: 440
    col: 8
    role: j
    text: 雖有周親不如仁人百姓有過在予一
  - page: 440
    col: 9
    role: j
    text: 人
  - page: 440
    col: 10
    role: z
    text: 此周書泰誓之詞○孔氏曰周至也
  - page: 440
    col: 11
    role: z
    text: 言紂至親雖多不如周家之多仁人
  - page: 440
    col: 12
    role: j
    text: 謹權量審法度修廢官四方之政行焉
  - page: 440
    col: 13
    role: z
    text: 權稱錘也量斗斛也法度禮樂制度
  - page: 440
    col: 14
    role: z
    text: 皆是也
  - page: 440
    col: 15
    role: j
    text: 興滅國繼絕世舉逸民天下之民歸心
  - page: 440
    col: 16
    role: j
    text: 焉
  - page: 441
    col: 1
    role: z
    text: 興滅繼絶謂封黃帝堯舜夏商之後
  - page: 441
    col: 2
    role: z
    text: 舉逸民謂釋箕子之囚復商容之位
  - page: 441
    col: 3
    role: z
    text: 三者皆人心之所欲也
  - page: 441
    col: 4
    role: j
    text: 所重民食喪祭
  - page: 441
    col: 5
    role: z
    text: 武成曰重民五教惟食喪祭
  - page: 441
    col: 6
    role: j
    text: 寛則得衆信則民任焉敏則有功公則
  - page: 441
    col: 7
    role: j
    text: 說
  - page: 441
    col: 8
    role: z
    text: 說音悅○此於武王之事無所見恐
  - page: 441
    col: 9
    role: z
    text: 或汎言帝王之道也○楊氏曰論語
  - page: 441
    col: 10
    role: z
    text: 之書皆聖人微言而其徒傳守之以
  - page: 441
    col: 11
    role: z
    text: 明斯道者也故於終篇具載堯舜咨
  - page: 441
    col: 12
    role: z
    text: 命之言湯武誓師之意與夫施諸政
  - page: 441
    col: 13
    role: z
    text: 事者以明聖學之所傳者一於是而
  - page: 441
    col: 14
    role: z
    text: 已所以著明二十篇之大旨也孟子
  - page: 441
    col: 15
    role: z
    text: 於終篇亦歷叙堯舜湯文孔子相承
  - page: 441
    col: 16
    role: z
    text: 之次皆此意也
  - page: 442
    col: 1
    role: j
    text: 子張問於孔子曰何如斯可以從政矣
  - page: 442
    col: 2
    role: j
    text: 子曰尊五美屏四惡斯可以從政矣子
  - page: 442
    col: 3
    role: j
    text: 張曰何謂五美子曰君子惠而不費勞
  - page: 442
    col: 4
    role: j
    text: 而不怨欲而不貪泰而不驕威而不猛
  - page: 442
    col: 5
    role: z
    text: 費芳味反
  - page: 442
    col: 6
    role: j
    text: 子張曰何謂惠而不費子曰因民之所
  - page: 442
    col: 7
    role: j
    text: 利而利之斯不亦惠而不費乎擇可勞
  - page: 442
    col: 8
    role: j
    text: 而勞之又誰怨欲仁而得仁又焉貪君
  - page: 442
    col: 9
    role: j
    text: 子無衆寡無小大無敢慢斯不亦泰而
  - page: 442
    col: 10
    role: j
    text: 不驕乎君子正其衣冠尊其瞻視儼然
  - page: 442
    col: 11
    role: j
    text: 人望而畏之斯不亦威而不猛乎
  - page: 442
    col: 12
    role: z
    text: 焉於虔反
  - page: 442
    col: 13
    role: j
    text: 子張曰何謂四惡子曰不教而殺謂之
  - page: 442
    col: 14
    role: j
    text: 虐不戒視成謂之暴慢令致期謂之賊
  - page: 442
    col: 15
    role: j
    text: 猶之與人也出納之吝謂之有司
  - page: 442
    col: 16
    role: z
    text: 出去聲○虐謂殘酷不仁暴謂卒遽
  - page: 443
    col: 1
    role: z
    text: 無漸致期刻期也賊者切害之意
  - page: 443
    col: 2
    role: z
    text: 於前而急於後以誤其民而必刑之
  - page: 443
    col: 3
    role: z
    text: 是賊害之也猶之猶言均之也均之
  - page: 443
    col: 4
    role: j
    text: 而物與人而於其出納之際乃或吝
  - page: 443
    col: 5
    role: j
    text: 而不果則是有司之事而非爲政之
  - page: 443
    col: 6
    role: z
    text: 體所與雖多人亦不懷其惠矣項羽
  - page: 443
    col: 7
    role: z
    text: 使人有功當封刻印刓忍弗能予卒
  - page: 443
    col: 8
    role: z
    text: 以取敗亦其驗也○尹氏曰告問政
  - page: 443
    col: 9
    role: z
    text: 者多矣未有如此之備者也故記之
  - page: 443
    col: 10
    role: z
    text: 以繼帝王之治則夫子之爲政可知
  - page: 443
    col: 11
    role: z
    text: 也
  - page: 443
    col: 12
    role: j
    text: 子曰不知命無以爲君子也
  - page: 443
    col: 13
    role: z
    text: 程子曰知命者知有命而信之也人
  - page: 443
    col: 14
    role: z
    text: 不知命則見害必避見利必趨何以
  - page: 443
    col: 15
    role: z
    text: 爲君子
  - page: 443
    col: 16
    role: j
    text: 不知禮無以立也
  - page: 444
    col: 1
    role: z
    text: 不知禮則耳目無所加手足無所措
  - page: 444
    col: 2
    role: j
    text: 不知言無以知人也
  - page: 444
    col: 3
    role: z
    text: 言之得失可以知人之邪正○尹氏
  - page: 444
    col: 4
    role: z
    text: 曰知斯三者則君子之事備矣弟子
  - page: 444
    col: 5
    role: z
    text: 記此以終篇得無意乎學者少而讀
  - page: 444
    col: 6
    role: z
    text: 之老而不知一言爲可用不幾於侮
  - page: 444
    col: 7
    role: z
    text: 聖言者乎夫子之罪人也可不念哉
  - page: 444
    col: 8
    role: j
    text: 論語卷第十
sections:
  - id: pian1
    name: 子張第十九
    from:
      page: 424
      col: 10
      row: 1
    to:
      page: 438
