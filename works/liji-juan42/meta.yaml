aboutHtml: |-
  <h2>關於此卷</h2>
  <p>《禮記正義》為唐孔穎達等奉敕撰，以漢鄭玄注為本，為十三經注疏之一。禮記四十九篇，述禮之義理，此卷以宋刻本版式數字重刻，半葉八行、行十六字、注文雙行二十五字。</p>
  <p>卷四十二收雜記下第二十一，經注疏全帙。</p>
