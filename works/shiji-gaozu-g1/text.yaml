sections:
  - id: 高祖本紀
    name: 高祖本紀
    blocks:
      - type: j
        text: 高祖沛豐邑中陽里人姓劉氏字季父曰太公母曰劉媼其先劉媼嘗息大澤之陂夢與神遇是時雷電晦冥太公徃視則見蛟龍於其上巳而有身遂產高祖高祖為人隆凖而龍顏美須髯左股有七十二黑子仁而愛人喜施意豁如也常有大度不事家人生產作業及壯試為吏為泗水亭長廷中吏無所不狎侮好酒及色常從王媼武負貰酒醉卧武負王媼見
      - type: j
        text: 劉季固多大言少成事高祖因狎侮諸客遂坐上坐無所詘酒闌吕公因目固留高祖高祖竟酒後吕公曰臣少好相人相人多矣無如季相願季自愛臣有息女願為季箕帚妾酒罷吕媼怒吕公曰公始常欲奇此女與貴人沛令善公求之不與何自妄許與劉季吕公曰此非兒女子所知也卒與劉季吕公女乃吕后也生孝惠魯元公主高祖為亭長時常告歸之田吕后與兩子居田中耨有一老父過請飲吕后因
      - type: j
        text: 山徒多道亡自度比至皆亡之到豐西澤中止飲夜乃解縱所送徒曰公等皆去吾亦從此逝矣徒中壮士願從者十餘人高祖被酒夜徑澤中令一人行前行前者還報曰前有大蛇當徑願還高祖醉曰壮士行何畏乃前拔劔擊斬蛇蛇遂分為兩徑開行數里醉因卧後人来至蛇所有一老嫗夜哭人問何哭嫗曰人殺吾子故哭之人曰嫗子何為見殺嫗曰吾子白帝子也化為蛇當道今為赤帝子斬之故哭人乃
      - type: j
        text: 沛應涉掾主吏蕭何曹參乃曰君為秦吏今欲背之率沛子弟恐不聴願君召諸亡在外者可得數百人因劫衆衆不敢不聴乃令樊噲召劉季劉季之衆巳數十百人矣扵是樊噲從劉季来沛令後悔恐其有變乃閉城城守欲誅蕭曹蕭曹恐踰城保劉季劉季乃書帛射城上謂沛父老曰天下苦秦久矣今父老雖為沛令守諸侯並起今屠沛沛今共誅令擇子弟可立者立之以應諸侯則家室完不然父子俱屠無
      - type: j
        text: 故上赤於是少年豪吏如蕭曹樊噲等皆為收沛子弟二三千人攻胡陵方與還守豐秦二世二年陳涉之將周章軍西至戲而還燕趙齊魏皆自立為王項氏起吳秦泗川監平將兵圍豐二日出與戰破之命雍齒守豐引兵之薛泗川守壯敗於薛走至戚沛公左司馬得泗川守壯殺之沛公還軍亢父至方與周市來攻方與未戰陳王使魏人周市略地周市使人謂雍齒曰豐故梁徙也今魏地已定者數十城齒今
      - type: j
        text: 餘徃見之項梁益沛公卒五千人五大夫将十人沛公還引兵攻豐從項梁月餘項羽已㧞襄城還項梁盡召别将居薛聞陳王定死因立楚後懷王孫心為楚王治盱台項梁號武信君居數月北攻亢父救東阿破秦軍齊軍歸楚獨追北使沛公項羽别攻城陽屠之軍濮陽之東與秦軍戰破之秦軍復振守濮陽環水楚軍去而攻定陶定陶未下沛公與項羽西畧地至雍丘之下與秦軍戰大破之斬李由還攻外黄
      - type: j
        text: 封為武安侯将碭郡兵封項羽為長安侯號為魯公吕臣為司徒其父吕青為令尹趙數請救懷王乃以宋義為上将軍項羽為次将范増為末将北救趙令沛公西畧地入關與諸将約先入定關中者王之當是時秦兵彊常乗勝逐北諸将莫利先入關獨項羽怨秦破項梁軍奮願與沛公西入關懷王諸老将皆曰項羽為人僄悍猾賊項羽嘗攻襄城襄城無遺類皆阬之諸所過無不殘滅且楚數進取前陳王項梁
      - type: j
        text: 高陽酈食其謂監門曰諸將過此者多吾視沛公大人長者乃求見說沛公沛公方踞牀使兩女子洗足酈生不拜長揖曰足下必欲誅無道秦不宜踞見長者於是沛公起攝衣謝之延上坐食其說沛公襲陳留得秦積粟乃以酈食其為廣野君酈商為將將陳留兵與偕攻開封開封未拔西與秦將楊熊戰白馬又戰曲遇東大破之楊熊走之滎陽二世使使者斬以徇南攻潁陽屠之因張良遂畧韓地轘轅當是時
      - type: j
        text: 足下留守宛宛大郡之都也連城數十人民衆積蓄多吏人自以為降必死故皆堅守乘城今足下盡日止攻士死傷者必多引兵去宛宛必隨足下後足下前則失咸陽之約後又有彊宛之患為足下計莫若約降封其守因使止守引其甲卒與之西諸城未下者聞聲爭開門而待足下通行無所累沛公曰善乃以宛守為殷侯封陳恢千户引兵西無不下者至丹水高武侯鰓襄侯王陵降西陵還攻胡陽遇番君别
      - type: j
        text: 漢元年十月沛公兵遂先諸侯至霸上秦王子嬰素車白馬係頸以組封皇帝璽符節降軹道旁諸將或言誅秦王沛公曰始懷王遣我固以能寬容且人已服降又殺之不祥乃以秦王屬吏遂西入咸陽欲止宫休舍樊噲張良諫乃封秦重寳財物府庫還軍霸上召諸縣父老豪傑曰父老苦秦苛法久矣誹謗者族偶語者弃市吾與諸侯約先入關者王之吾當王關中與父老約法三章耳殺人者死傷人及盜抵罪
      - type: j
        text: 中兵以自益距之沛公然其計從之十一月中項羽果率諸侯兵西欲入關關門閉聞沛公已定關中大怒使黥布等攻破函谷關十二月中遂至戲沛公左司馬曹無傷聞項王怒欲攻沛公使人言項羽曰沛公欲王關中令子嬰為相珍寶盡有之欲以求封亞父勸項羽擊沛公方饗士旦日合戰是時項羽兵四十萬號百萬沛公兵十萬號二十萬力不敵會項伯欲活張良夜往見良因以文諭項羽項羽乃止沛公
      - type: j
        text: 項羽自立為西楚霸王王梁楚地九郡都彭城負約更立沛公為漢王王巴蜀漢中都南鄭三分關中立秦三将章邯為雍王都廢丘司馬欣為塞王都櫟陽董翳為翟王都高奴楚将瑕丘申陽為河南王都洛陽趙将司馬卬為殷王都朝歌趙王歇徙王代趙相張耳為常山王都襄國當陽君黥布為九江王都六懷王柱國共敖為臨江王都江陵番君吳芮為衡山王都邾燕将臧荼為燕王都薊故燕王韓廣徙王遼
      - type: j
        text: 功天下已定人皆自寧不可復用不如決策東鄉爭權天下項羽出關使人徙義帝曰古之帝者地方千里必居上游乃使使徙義帝長沙郴縣趣義帝行羣臣稍倍叛之乃陰令衡山王臨江王擊之殺義帝江南項羽怨田榮立齊将田都為齊王田榮怒因自立為齊王殺田都而反楚予彭越将軍印令反梁地楚令蕭公角擊彭越彭越大破之陳餘怨項羽之弗王已也令夏說說田榮請兵擊張耳齊予陳餘兵擊破
      - type: j
        text: 二年漢王東畧地塞王欣翟王翳河南王申陽皆降韓王昌不聴使韓信撃破之於是置隴西北地上郡渭南河上中地郡關外置河南郡更立韓太尉信為韓王諸将以萬人若以一郡降者封萬戸繕治河上塞諸故秦苑囿園池皆令人得田之正月虜雍王弟章平大赦罪人漢王之出關至陝撫關外父老還張耳来見漢王厚遇之二月令除秦社稷更立漢社稷三月漢王從臨晉渡魏王豹将兵從下河内虜殷王
      - type: j
        text: 橫立榮子廣為齊王齊王反楚城陽項羽雖聞漢東既已連齊兵欲遂破之而擊漢漢王以故得劫五諸侯兵遂入彭城項羽聞之乃引兵去齊從魯出胡陵至蕭與漢大戰彭城靈壁東睢水上大破漢軍多殺士卒睢水為之不流乃取漢王父母妻子於沛置之軍中以為質當是時諸侯見楚彊漢敗還皆去漢復為楚塞王欣亡入楚吕后兄周吕侯為漢將兵居下邑漢王從之稍收士卒軍碭漢王乃西過梁地至虞
      - type: j
        text: 布與龍且戰不勝與隨何間行歸漢漢王稍收士卒與諸將及關中卒益出是以兵大振滎陽破楚京索間三年魏王豹謁歸視親疾至即絕河津反為楚漢王使酈生說豹豹不聽漢王遣將軍韓信擊大破之虜豹遂定魏地置三郡曰河東太原上黨漢王乃令張耳與韓信遂東下井陘擊趙斬陳餘趙王歇其明年立張耳為趙王漢王軍滎陽南築甬道屬之河以取
      - type: j
        text: 西門遁令御史大夫周苛魏豹樅公守滎陽諸將卒不能從者盡在城中周苛樅公相謂曰反國之王難與守城因殺魏豹漢王之出滎陽入關收兵欲復東袁生說漢王曰漢與楚相距滎陽數歲漢常困願君王出武關項羽必引兵南走王深壁令滎陽成皐間且得休使韓信等輯河北趙地連燕齊君王乃復走滎陽未晚也如此則楚所備者多力分漢得休復與之戰破楚必矣漢王從其計出軍宛葉間與黥布行
      - type: j
        text: 南饗軍小修武南欲復戰郎中鄭忠乃說止漢王使高壘深塹勿與戰漢王聽其計使盧綰劉賈將卒二萬人騎數百渡白馬津入楚地與彭越復擊破楚軍燕郭酉遂復下梁地十餘城淮陰已受命東未渡平原漢王使酈生往說齊王田廣廣叛楚與漢和共擊項羽韓信用蒯通計遂襲破齊齊王烹酈生東走高密項羽聞韓信已舉河北兵破齊趙且欲擊楚則使龍且周蘭往擊之韓信與戰騎將灌嬰擊大破楚軍
      - type: j
        text: 春侯破乃引兵還漢軍方圍鍾離昧於滎陽東項羽至盡走險阻韓信已破齊使人言曰齊邉楚權輕不為假王恐不能安齊漢王欲攻之留侯曰不如因而立之使自為守乃遣張良操印綬立韓信為齊王項羽聞龍且軍破則恐使盱台人武涉徃說韓信韓信不聽楚漢久相持未決丁壯苦軍旅老弱罷轉饟漢王項羽相與臨廣武之間而語項羽欲與漢王獨身挑戰漢王數項羽曰始與項羽俱受命懷王曰先入
      - type: j
        text: 而弑其主殺已降為政不平主約不信天下所不容大逆無道罪十也吾以義兵從諸侯誅殘賊使刑餘罪人擊殺項羽何苦乃與公挑戰項羽大怒伏弩射中漢王漢王傷胷乃捫足曰虜中吾指漢王病創臥張良彊請漢王起行勞軍以安士卒毋令楚乘勝於漢漢王出行軍病甚因馳入成臯病愈西入關至櫟陽存問父老置酒梟故塞王欣頭櫟陽市留四日復如軍軍廣武關中兵益出當此時彭越将兵居梁地
      - type: j
        text: 地圍壽春漢王敗固陵乃使使者召大司馬周殷舉九江兵而迎之武王行屠城父隨何劉賈齊梁諸侯皆大會垓下立武王布為淮南王五年高祖與諸侯兵共擊楚軍與項羽決勝垓下淮陰侯將三十萬自當之孔將軍居左費將軍居右皇帝在後絳侯柴將軍在皇帝後項羽之卒可十萬淮陰先合不利卻孔將軍費將軍縱楚兵不利淮陰侯復乘之大敗垓下項羽卒聞漢軍之楚歌以為漢盡
      - type: j
        text: 死守之漢王三讓不得已曰諸君必以為便便國家甲午乃即皇帝位汜水之陽皇帝曰義帝無後齊王韓信習楚風俗徙為楚王都下邳立建成侯彭越為梁王都定陶故韓王信為韓王都陽翟徙衡山王吳芮為長沙王都臨湘番君之將梅鋗有功從入武關故德番君淮南王布燕王臧荼趙王敖皆如故天下大定高祖都雒陽諸侯皆臣屬故臨江王驩為項羽叛漢令盧綰劉賈圍之不下數月而降殺之雒陽五
      - type: j
        text: 籌策帷帳之中决勝於千里之外吾不如子房鎮國家撫百姓給餽饟不絶糧道吾不如蕭何連百萬之軍戰必勝攻必取吾不如韓信此三者皆人傑也吾能用之此吾所以取天下也項羽有一范增而不能用此其所以為我擒也高祖欲長都雒陽齊人劉敬說及留侯勸上入都關中高祖是日駕入都關中六月大赦天下十月燕王臧荼反攻下代地高祖自将擊之得燕王臧荼即立太尉盧綰為燕王使丞相噲
      - type: j
        text: 太公太公曰帝人主也柰何以我亂天下法於是高祖乃尊太公為太上皇心善家令言賜金五百斤十二月人有上變事告楚王信謀反上問左右左右爭欲擊之用陳平計乃偽遊雲夢會諸侯於陳楚王信迎即因執之是日大赦天下田肯賀因說高祖曰陛下得韓信又治秦中秦形勝之國帶河山之險縣隔千里持戟百萬秦得百二焉地勢便利其以下兵於諸侯譬猶居高屋之上建瓴水也夫齊東有琅邪即
      - type: j
        text: 七年匈奴攻韓王信馬邑信因與同謀反太原白土曼丘臣王黃立故趙將趙利為王以反高祖自往擊之會天寒士卒墮指者什二三遂至平城匈奴圍我平城七日而後罷去令樊噲止定代地立兄劉仲為代王二月高祖自平城過趙雒陽至長安長樂宫成丞相已下徙治長安八年高祖東擊韓王信餘反寇於東垣蕭丞相營作未央宫立東闕北闕前殿武庫太倉高祖還見宫闕
      - type: j
        text: 高祖大朝諸侯羣臣置酒未央前殿高祖奉玉卮起為太上皇壽曰始大人常以臣無賴不能治產業不如仲力今某之業所就孰與仲多殿上羣臣皆呼萬歲大笑為樂十年十月淮南王黥布梁王彭越燕王盧綰荆王劉賈楚王劉交齊王劉肥長沙王吳芮皆來朝長樂宫春夏無事七月太上皇崩櫟陽宫楚王梁王皆來送葬赦櫟陽囚更命酈邑曰新豐八月趙相國陳豨反
      - type: j
        text: 蒙與齊将擊大破之太尉周勃道太原入定代地至馬邑馬邑不下即攻殘之豨将趙利守東垣高祖攻之不下月餘卒罵高祖高祖怒城降令出罵者斬之不罵者原之於是乃分趙山北立子恒以為代王都晉陽春淮隂侯韓信謀反關中夷三族夏梁王彭越謀反廢遷蜀復欲反遂夷三族立子恢為梁王子友為淮陽王秋七月淮南王黥布反東并荆王劉賈地北渡淮楚王交走入薛高祖自徃擊之立子長為淮
      - type: j
        text: 遂有天下其以沛為朕湯沐邑復其民世世無有所與沛父兄諸母故人日樂飲極驩道舊故為笑樂十餘日高祖欲去沛父兄固請留高祖高祖曰吾人衆多父兄不能給乃去沛中空縣皆之邑西獻高祖復留止張飲三日沛父兄皆頓首曰沛幸得復豐未復唯陛下哀憐之高祖曰豐吾所生長極不忘耳吾特為其以雍齒故反我為魏沛父兄固請乃并復豐比沛於是拜沛侯劉濞為吳王漢将别擊布軍洮水南
      - type: j
        text: 者立皇子建為燕王高祖擊布時為流矢所中行道病病甚吕后迎良醫醫入見高祖問醫醫曰病可治於是高祖嫚罵之曰吾以布衣持三尺劒取天下此非天命乎命乃在天雖扁鵲何益遂不使治病賜金五十斤罷之已而吕后問陛下百歲後蕭相國即死令誰代之上曰曹參可問其次上曰王陵可然陵少戇陳平可以助之陳平智有餘然難以獨任周勃重厚少文然安劉氏者必勃也可令為太尉吕后復問
      - type: j
        text: 臣内叛諸侯外反亡可翹足而待也審食其入言之乃以丁未發喪大赦天下盧綰聞高祖崩遂亡入匈奴丙寅葬己巳立太子至太上皇廟羣臣皆曰高祖起微細撥亂世反之正平定天下為漢太祖功最高上尊號為高皇帝太子襲號為皇帝孝惠帝也令郡國諸侯各立高祖廟以歲時祠及孝惠五年思高祖之悲樂沛以沛宮為高祖原廟高祖所教歌兒百二十人皆令為吹樂後有缺輒補之高帝八男長庶齊
      - type: j
        text: 繆乎故漢興承敝易變使人不倦得天統矣朝以十月車服黃屋左纛葬長陵
  - id: 吕后本紀
    name: 吕后本紀
    blocks:
      - type: j
        text: 吕太后者高祖微時妃也生孝惠帝女魯元太后及高祖為漢王得定陶戚姬愛幸生趙隱王如意孝惠為人仁弱高祖以為不類我常欲廢太子立戚姬子如意如意類我戚姬幸常從上之關東日夜啼泣欲立其子代太子吕后年長常留守希見上益疏如意立為趙王後幾代太子者數矣賴大臣爭之及留侯策太子得毋廢吕后為人剛毅佐高祖定天下所誅
      - type: j
        text: 夫人及其子趙王廼令永巷囚戚夫人而召趙王使者三反趙相建平侯周昌謂使者曰高帝屬臣趙王趙王年少竊聞太后怨戚夫人欲召趙王并誅之臣不敢遣王王且亦病不能奉詔吕后大怒廼使人召趙相趙相徵至長安廼使人復召趙王王来未到孝惠帝慈仁知太后怒自迎趙王霸上與入宫自挟與趙王起居飲食太后欲殺之不得閒孝惠元年十二月帝晨出射趙王少不能蚤起太后聞其獨居使人
      - type: j
        text: 置上坐如家人之禮太后怒廼酌兩卮酖置前令齊王起為壽齊王起孝惠亦起取卮欲俱為壽太后廼恐自起泛孝惠卮齊王恠之因不敢飲詳醉去問知其酖齊王恐自以為不得脫長安憂齊內史士說王曰太后獨有孝惠與魯元公主今王有七十餘城而公主廼食數城王誠以一郡上太后為公主湯沐邑太后必喜王必無憂於是齊王廼上城陽之郡尊公主為王太后吕后喜許之廼置酒齊邸樂飲罷歸齊
      - type: j
        text: 下九月辛丑葬太子即位為帝謁髙廟元年號令一出太后太后稱制議欲立諸吕為王問右丞相王陵王陵曰髙帝刑白馬盟曰非劉氏而王天下共擊之今王吕氏非約也太后不說問左丞相陳平絳侯周勃勃等對曰髙帝定天下王子弟今太后稱制王昆弟諸吕無所不可太后喜罷朝王陵讓陳平絳侯曰始與髙帝啑血盟諸君不在邪今髙帝崩太后女主欲王吕氏諸君縱欲阿意背約何面目見髙帝地下
      - type: j
        text: 諡為魯元太后子偃為魯王魯王父宣平侯張敖也封齊悼惠王子章為朱虛侯以吕禄女妻之齊丞相壽為平定侯少府延為梧侯乃封吕種為沛侯吕平為扶柳侯張買為南宫侯太后欲王吕氏先立孝惠後宫子彊為淮陽王子不疑為常山王子山為襄成侯子朝為軹侯子武為壺關侯太后風大臣大臣請立酈侯吕台為吕王太后許之建成康侯釋之卒嗣子有罪廢立其弟吕禄為胡陵侯續康侯後二年常
      - type: j
        text: 中言帝病甚左右莫得見太后曰凡有天下治為萬民命者盖之如天容之如地上有歡心以安百姓百姓欣然以事其上歡欣交通而天下治今皇帝病久不已廼失惑惛亂不能繼嗣奉宗廟祭祀不可屬天下其代之羣臣皆頓首言皇太后為天下齊民計所以安宗廟社稷甚深羣臣頓首奉詔帝廢位太后幽殺之五月丙辰立常山王義為帝更名曰弘不稱元年者以太后制天下事也以軹侯朝為常山王置太
      - type: j
        text: 吕用事兮劉氏危迫脅王侯兮彊授我妃我妃既妬兮誣我以惡讒女亂國兮上曾不寤我無忠臣兮何故弃國自决中壄兮蒼天舉直于嗟不可悔兮寧蚤自財為王而餓死兮誰者憐之吕氏絶理兮託天報仇丁丑趙王幽死以民禮葬之長安民冡次已丑日食晝晦太后惡之心不樂乃謂左右曰此為我也二月徙梁王恢為趙王吕王産徙為梁王梁王不之國為帝太傅立皇子平昌侯太為吕王更名梁曰吕吕
      - type: j
        text: 使告代王欲徙王趙代王謝願守代邉太傅産丞相平等言武信侯吕禄上侯位次第一請立為趙王太后許之追尊禄父康侯為趙昭王九月燕靈王建薨有美人子太后使人殺之無後國除八年十月立吕肅王子東平侯吕通為燕王封通弟吕荘為東平侯三月中吕后袚還過軹道見物如蒼犬據高后掖忽弗復見卜之云趙王如意為祟高后遂病掖傷高后為外孫魯元王偃年少蚤失父母孤弱廼封張敖前
      - type: j
        text: 皆以秩賜金大赦天下以吕王産為相國以吕禄女為帝后高后已葬以左丞相審食其為帝太傅朱虛侯劉章有氣力東牟侯興居其弟也皆齊哀王弟居長安當是時諸吕用事擅權欲為亂畏高帝故大臣絳灌等未敢發朱虛侯婦吕禄女隂知其謀恐見誅廼隂令人告其兄齊王欲令發兵西誅諸吕而立朱虛侯欲從中與大臣為應齊王欲發兵其相弗聴八月丙午齊王欲使人誅相相召平廼反舉兵欲圍王
      - type: j
        text: 人率兵入誅不當為王者漢聞之相國吕産等廼遣潁隂侯灌嬰将兵擊之灌嬰至滎陽廼謀曰諸吕權兵關中欲危劉氏而自立今我破齊還報此益吕氏之資也廼留屯滎陽使使諭齊王及諸侯與連和以待吕氏變共誅之齊王聞之廼還兵西界待約吕禄吕産欲發亂關中内憚絳侯朱虚等外畏齊楚兵又恐灌嬰畔之欲待灌嬰兵與齊合而發猶豫未决當是時濟川王太淮陽王武常山王朝名為少帝弟及
      - type: j
        text: 諸侯所疑足下何不歸将印以兵屬太尉請梁王歸相國印與大臣盟而之國齊兵必罷大臣得安足下高枕而王千里此萬世之利也吕禄信然其計欲歸将印以兵屬太尉使人報吕産及諸吕老人或以為便或曰不便計猶豫未有所决吕禄信酈寄時與出游獵過其姑吕嬃嬃大怒曰若為将而弃軍吕氏今無處矣廼悉出珠玉寳器散堂下曰毋為他人守也左丞相食其免八月庚申旦平陽侯窋行御史大夫
      - type: j
        text: 門行令軍中曰為吕氏右檀為劉氏左檀軍中皆左檀為劉氏太尉行至将軍吕禄亦已解上将印去太尉遂将北軍然尚有南軍平陽侯聞之以吕産謀告丞相平丞相平廼召朱虚侯佐太尉太尉令朱虚侯監軍門令平陽侯告衛尉毋入相國産殿門吕産不知吕禄已去北軍廼入未央宫欲為亂殿門弗得入徘徊徃来平陽侯恐弗勝馳語太尉太尉尚恐不勝諸吕未敢訟言誅之廼遣朱虚侯謂曰急入宫衛帝
      - type: j
        text: 燕王吕通而廢魯王偃壬戌以帝太傅食其復為左丞相戊辰徙濟川王王梁立趙幽王子遂為趙王遣朱虛侯章以誅諸吕氏事告齊王令罷兵灌嬰兵亦罷滎陽而歸諸大臣相與隂謀曰少帝及梁淮陽常山王皆非真孝惠子也吕后以計詐名他人子殺其母養後宫令孝惠子之立以為後及諸王以彊吕氏今皆已夷滅諸吕而置所立即長用事吾屬無類矣不如視諸王最賢者立之或言齊悼惠王高帝長子
      - type: j
        text: 子代王數讓羣臣固請然後聽東牟侯興居曰誅吕氏吾無功請得除宫迺與太僕汝隂侯滕公入宫前謂少帝曰足下非劉氏不當立乃顧麾左右執戟者掊兵罷去有數人不肯去兵宦者令張澤諭告亦去兵滕公迺召乘輿車載少帝出少帝曰欲將我安之乎滕公曰出就舍舍少府迺奉天子法駕迎代王於邸報曰宫謹除代王即夕入未央宫有謁者十人持戟衛端門曰天子在也足下何為者而入代王迺謂
