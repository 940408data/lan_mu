sections:
  - id: 項羽本紀
    name: 項羽本紀
    blocks:
      - type: j
        text: 項籍者下相人也字羽初起時年二十四其季父項梁梁父即楚將項燕為秦將王翦所戮者也項氏世世為楚將封於項故姓項氏項籍少時學書不成去學劒又不成項梁怒之籍曰書足以記名姓而已劒一人敵不足學學萬人敵於是項梁乃教籍兵法籍大喜畧知其意又不肯竟學項梁嘗有櫟陽逮乃請蘄獄掾曹咎書抵櫟陽獄掾司馬欣以故事得已項
      - type: j
        text: 制吾欲發兵使公及桓楚將是時桓楚亡在澤中梁曰桓楚亡人莫知其處獨籍知之耳梁乃出誡籍持劒居外待梁復入與守坐曰請召籍使受命召桓楚守曰諾梁召籍入須臾梁眴籍曰可行矣於是籍遂拔劒斬守頭項梁持守頭佩其印綬門下大驚擾亂籍所擊殺數十百人一府中皆慴伏莫敢起梁乃召故所知豪吏諭以所為起大事遂舉吳中兵使人收下縣得精兵八千人梁部署吳中豪傑為校尉候司
      - type: j
        text: 適用乃請陳嬰嬰謝不能遂彊立嬰為長縣中從者得二萬人少年欲立嬰便為王異軍蒼頭特起陳嬰母謂嬰曰自我為汝家婦未嘗聞汝先古之有貴者今暴得大名不祥不如有所屬事成猶得封侯事敗易以亡非世所指名也嬰乃不敢為王謂其軍吏曰項氏世世将家有名於楚今欲舉大事将非其人不可我倚名族亡秦必矣於是衆從其言以兵屬項梁項梁渡淮黥布蒲将軍亦以兵屬焉凡六七萬人軍
      - type: j
        text: 之還報項梁項梁聞陳王定死召諸别将會薛計事此時沛公亦起沛徃焉居鄛人范增年七十素居家好奇計徃說項梁曰陳勝敗固當夫秦滅六國楚最無罪自懷王入秦不反楚人憐之至今故楚南公曰楚雖三戸亡秦必楚也今陳勝首事不立楚後而自立其勢不長今君起江東楚蠭起之将皆爭附君者以君世世楚将為能復立楚之後也於是項梁然其言乃求楚懷王孫心民間為人牧羊立以為楚懷王
      - type: j
        text: 角田間以市於齊齊遂不肯發兵助楚項梁使沛公及項羽别攻城陽屠之西破秦軍濮陽東秦兵收入濮陽沛公項羽乃攻定陶定陶未下去西畧地至雝丘大破秦軍斬李由還攻外黃外黃未下項梁起東阿西北至定陶再破秦軍項羽等又斬李由益輕秦有驕色宋義乃諫項梁曰戰勝而将驕卒惰者敗今卒少惰矣秦兵日益臣為君畏之項梁弗聽乃使宋義使於齊道遇齊使者高陵君顯曰公将見武信君
      - type: j
        text: 南築甬道而輸之粟陳餘為将将卒數萬人而軍鉅鹿之北此所謂河北之軍也楚兵已破於定陶懷王恐從盱台之彭城并項羽吕臣軍自将之以吕臣為司徒以其父吕青為令尹以沛公為碭郡長封為武安侯将碭郡兵初宋義所遇齊使者高陵君顯在楚軍見楚王曰宋義論武信君之軍必敗居數日軍果敗兵未戰而先見敗徵此可謂知兵矣王召宋義與計事而大說之因置以為上将軍項羽為魯公為次
      - type: j
        text: 身送之至無鹽飲酒高會天寒大雨士卒凍饑項羽曰將戮力而攻秦久留不行今歲饑民貧士卒食芋菽軍無見糧乃飲酒高會不引兵渡河因趙食與趙并力攻秦乃曰承其敝夫以秦之彊攻新造之趙其勢必舉趙趙舉而秦彊何敝之承且國兵新破王坐不安席埽境内而專屬於將軍國家安危在此一舉今不恤士卒而徇其私非社稷之臣項羽晨朝上將軍宋義即其帳中斬宋義頭出令軍中曰宋義與齊
      - type: j
        text: 是至則圍王離與秦軍遇九戰絕其甬道大破之殺蘇角虜王離涉間不降楚自燒殺當是時楚兵冠諸侯諸侯軍救鉅鹿下者十餘壁莫敢縱兵及楚擊秦諸将皆從壁上觀楚戰士無不一以當十楚兵呼聲動天諸侯軍無不人人惴恐於是已破秦軍項羽召見諸侯将入轅門無不膝行而前莫敢仰視項羽由是始為諸侯上将軍諸侯皆屬焉章邯軍棘原項羽軍漳南相持未戰秦軍數却二世使人讓章邯章邯
      - type: j
        text: 三歲矣所亡失以十萬數而諸侯並起滋益多彼趙高素諛日久今事急亦恐二世誅之故欲以法誅將軍以塞責使人更代將軍以脫其禍夫將軍居外久多內郤有功亦誅無功亦誅且天之亡秦無愚智皆知之今將軍內不能直諫外為亡國將孤特獨立而欲常存豈不哀哉將軍何不還兵與諸侯為從約共攻秦分王其地南面稱孤此孰與身伏鈇質妻子為僇乎章邯狐疑陰使候始成使項羽欲約約未成項
      - type: j
        text: 秦吏卒秦吏卒多竊言曰章將軍等詐吾屬降諸侯今能入關破秦大善即不能諸侯虜吾屬而東秦必盡誅吾父母妻子諸將微聞其計以告項羽項羽乃召黥布蒲將軍計曰秦吏卒尚衆其心不服至關中不聽事必危不如擊殺之而獨與章邯長史欣都尉翳入秦於是楚軍夜擊阬秦卒二十餘萬人新安城南行畧定秦地函谷關有兵守關不得入又聞沛公已破咸陽項羽大怒使當陽君等擊關項羽遂入至
      - type: j
        text: 良張良是時從沛公項伯乃夜馳之沛公軍私見張良具告以事欲呼張良與俱去曰毋從俱死也張良曰臣為韓王送沛公沛公今事有急亡去不義不可不語良乃入具告沛公沛公大驚曰為之柰何張良曰誰為大王為此計者曰鯫生說我曰距關毋內諸侯秦地可盡王也故聽之良曰料大王士卒足以當項王乎沛公默然曰固不如也且為之柰何張良曰請徃謂項伯言沛公不敢背項王也沛公曰君安與
      - type: j
        text: 於是項伯復夜去至軍中具以沛公言報項王因言曰沛公不先破關中公豈敢入乎今人有大功而擊之不義也不如因善遇之項王許諾沛公旦日從百餘騎來見項王至鴻門謝曰臣與將軍戮力而攻秦將軍戰河北臣戰河南然不自意能先入關破秦得復見將軍於此今者有小人之言令將軍與臣有郤項王曰此沛公左司馬曹無傷言之不然籍何以至此項王即日因留沛公與飲項王項伯東嚮坐亞父
      - type: j
        text: 者項莊拔劒舞其意常在沛公也噲曰此迫矣臣請入與之同命噲即帶劒擁盾入軍門交戟之衛士欲止不内樊噲側其盾以撞衛士仆地噲遂入披帷西嚮立瞋目視項王頭髮上指目眥盡裂項王按劒而跽曰客何為者張良曰沛公之叅乗樊噲者也項王曰壮士賜之卮酒則與斗卮酒噲拜謝起立而飲之項王曰賜之彘肩則與一生彘肩樊噲覆其盾於地加彘肩上拔劒切而啗之項王曰壮士能復飲乎樊
      - type: j
        text: 公已出項王使都尉陳平召沛公沛公曰今者出未辭也為之柰何樊噲曰大行不顧細謹大禮不辭小讓如今人方為刀俎我為魚肉何辭為於是遂去乃令張良留謝良問曰大王來何操曰我持白璧一雙欲獻項王玉斗一雙欲與亞父會其怒不敢獻公為我獻之張良曰謹諾當是時項王軍在鴻門下沛公軍在霸上相去四十里沛公則置車騎脫身獨騎與樊噲夏侯嬰靳彊紀信等四人持劒盾步走從酈山
      - type: j
        text: 誅殺曹無傷居數日項羽引兵西屠咸陽殺秦降王子嬰燒秦宫室火三月不滅收其貨寳婦女而東人或說項王曰關中阻山河四塞地肥饒可都以霸項王見秦宫室皆以燒殘破又心懷思欲東歸曰富貴不歸故鄉如衣繡夜行誰知之者說者曰人言楚人沐猴而冠耳果然項王聞之烹說者項王使人致命懷王懷王曰如約乃尊懷王為義帝項王欲自王先王諸将相謂曰天下初發難時假立諸侯後以伐秦
      - type: j
        text: 獄掾嘗有德於項梁都尉董翳者本勸章邯降楚故立司馬欣為塞王王咸陽以東至河都櫟陽立董翳為翟王王上郡都高奴徙魏王豹為西魏王王河東都平陽瑕丘申陽者張耳嬖臣也先下河南郡迎楚河上故立申陽為河南王都雒陽韓王成因故都都陽翟趙将司馬卬定河内數有功故立卬為殷王王河内都朝歌徙趙王歇為代王趙相張耳素賢又從入關故立耳為常山王王趙地都襄國當陽君黥布
      - type: j
        text: 田榮者數負項梁又不肯將兵從楚擊秦以故不封成安君陳餘棄將印去不從入關然素聞其賢有功於趙聞其在南皮故因環封三縣番君將梅鋗功多故封十萬戶侯項王自立為西楚霸王王九郡都彭城漢之元年四月諸侯罷戲下各就國項王出之國使人徙義帝曰古之帝者地方千里必居上游乃使使徙義帝長沙郴縣趣義帝行其羣臣稍稍背叛之乃隂令衡山臨江王擊殺之江中韓王成無軍功項
      - type: j
        text: 今盡王故王於醜地而王其羣臣諸将善地逐其故主趙王乃北居代餘以為不可聞大王起兵且不聴不義願大王資餘兵請以撃常山以復趙王請以國為扞蔽齊王許之因遣兵之趙陳餘悉發三縣兵與齊并力撃常山大破之張耳走歸漢陳餘迎故趙王歇於代反之趙趙王因立陳餘為代王是時漢還定三秦項羽聞漢王皆已并關中且東齊趙叛之大怒乃以故吳令鄭昌為韓王以距漢令蕭公角等撃彭
      - type: j
        text: 田榮弟田橫收齊亡卒得數萬人反城陽項王因留連戰未能下春漢王部五諸侯兵凡五十六萬人東伐楚項王聞之即令諸将擊齊而自以精兵三萬人南從魯出胡陵四月漢皆已入彭城收其貨寳美人日置酒高會項王乃西從蕭晨擊漢軍而東至彭城日中大破漢軍漢軍皆走相隨入穀泗水殺漢卒十餘萬人漢卒皆南走山楚又追擊至靈壁東睢水上漢軍却為楚所擠多殺漢卒十餘萬人皆入睢水睢
      - type: j
        text: 軍遂與歸報項王項王常置軍中是時吕后兄周吕侯為漢将兵居下邑漢王間徃從之稍稍收其士卒至滎陽諸敗軍皆會蕭何亦發關中老弱未傅悉詣滎陽復大振楚起於彭城常乘勝逐北與漢戰滎陽南京索間漢敗楚楚以故不能過滎陽而西項王之救彭城追漢王至滎陽田横亦得收齊立田榮子廣為齊王漢王之敗彭城諸侯皆復與楚而背漢漢軍滎陽築甬道屬之河以取敖倉粟漢之三年項王數
      - type: j
        text: 疽發背而死漢將紀信說漢王曰事已急矣請為王誑楚為王王可以間出於是漢王夜出女子滎陽東門被甲二千人楚兵四面擊之紀信乘黃屋車傅左纛曰城中食盡漢王降楚軍皆呼萬歲漢王亦與數十騎從城西門出走成臯項王見紀信問漢王安在信曰漢王已出矣項王燒殺紀信漢王使御史大夫周苛樅公魏豹守滎陽周苛樅公謀曰反國之王難與守城乃共殺魏豹楚下滎陽城生得周苛項王謂
      - type: j
        text: 侯兵欲渡河南鄭忠說漢王乃止壁河内使劉賈将兵佐彭越燒楚積聚項王東擊破之走彭越漢王則引兵渡河復取成臯軍廣武就敖倉食項王已定東海来西與漢俱臨廣武而軍相守數月當此時彭越數反梁地絶楚糧食項王患之為高俎置太公其上告漢王曰今不急下吾烹太公漢王曰吾與項羽俱北面受命懷王曰約為兄弟吾翁即若翁必欲烹而翁則幸分我一桮羹項王怒欲殺之項伯曰天下事
      - type: j
        text: 復出漢王使人間問之乃項王也漢王大驚於是項王乃即漢王相與臨廣武間而語漢王數之項王怒欲一戰漢王不聽項王伏弩射中漢王漢王傷走入成臯項王聞淮隂侯已舉河北破齊趙且欲擊楚乃使龍且往擊之淮隂侯與戰騎将灌嬰擊之大破楚軍殺龍且韓信因自立為齊王項王聞龍且軍破則恐使盱台人武涉往說淮隂侯淮隂侯弗聽是時彭越復反下梁地絶楚糧項王乃謂海春侯大司馬曹
      - type: j
        text: 不出使人辱之五六日大司馬怒渡兵汜水士卒半渡漢擊之大破楚軍盡得楚國貨賂大司馬咎長史翳塞王欣皆自剄汜水上大司馬咎者故蘄獄掾長史欣亦故櫟陽獄吏兩人嘗有德於項梁是以項王信任之當是時項王在睢陽聞海春侯軍敗則引兵還漢軍方圍鍾離眜於滎陽東項王至漢軍畏楚盡走險阻是時漢兵盛食多項王兵罷食絕漢遣陸賈說項王請太公項王弗聽漢王復使侯公往說項王
      - type: j
        text: 淮隂侯韓信建成侯彭越期會而擊楚軍至固陵而信越之兵不會楚擊漢軍大破之漢王復入壁深塹而自守謂張子房曰諸侯不從約為之柰何對曰楚兵且破信越未有分地其不至固宜君王能與共分天下今可立致也即不能事未可知也君王能自陳以東傅海盡與韓信睢陽以北至穀城以與彭越使各自為戰則楚易敗也漢王曰善於是乃發使者告韓信彭越曰并力擊楚楚破自陳以東傅海與齊王
      - type: j
        text: 氣盖世時不利兮騅不逝騅不逝兮可柰何虞兮虞兮柰若何歌數闋美人和之項王泣數行下左右皆泣莫能仰視於是項王乃上馬騎麾下壯士騎從者八百餘人直夜潰圍南出馳走平明漢軍乃覺之令騎将灌嬰以五千騎追之項王渡淮騎能屬者百餘人耳項王至陰陵迷失道問一田父田父紿曰左左乃陷大澤中以故漢追及之項王乃復引兵而東至東城乃有二十八騎漢騎追者數千人項王自度不
      - type: j
        text: 瞋目而叱之赤泉侯人馬俱驚辟易數里與其騎會為三處漢軍不知項王所在乃分軍為三復圍之項王乃馳復斬漢一都尉殺數十百人復聚其騎亡其兩騎耳乃謂其騎曰何如騎皆伏曰如大王言於是項王乃欲東渡烏江烏江亭長檥船待謂項王曰江東雖小地方千里衆數十萬人亦足王也願大王急渡今獨臣有船漢軍至無以渡項王笑曰天之亡我我何渡為且籍與江東子弟八千人渡江而西今無
      - type: j
        text: 數十人最其後郎中騎楊喜騎司馬吕馬童郎中吕勝楊武各得其一體五人共會其體皆是分其地為五封吕馬童為中水侯封王翳為杜衍侯封楊喜為赤泉侯封楊武為吳防侯封吕勝為涅陽侯項王已死楚地皆降漢獨魯不下漢乃引天下兵欲屠之為其守禮義為主死節乃持項王頭視魯魯父兄乃降始楚懷王初封項籍為魯公及其死魯最後下故以魯公禮葬項王穀城漢王為發哀泣之而去諸項氏
      - type: j
        text: 王侯叛巳難矣自矜功伐奮其私智而不師古謂霸王之業欲以力征經營天下五年卒亡其國身死東城尚不覺寤而不自責過矣乃引天亡我非用兵之罪也豈不謬哉
