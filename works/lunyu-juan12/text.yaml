# 論語注疏卷12（邢昺疏）：j 為經文＋魏何晏集解，z 為疏文。
sections:
  - id: juan12
    name: 正文
    blocks:
      - { type: z, text: "正义曰：此篇论仁政明达、君臣父子、辨惑折狱、君子文为，皆圣贤之" }
      - { type: j, text: "格言，仕进之阶路，故次先进也。" }
      - { type: j, text: "颜渊问仁。子曰：“克已复礼为仁。（马曰：“克已约身。”孔曰：“复，" }
      - { type: j, text: "反也。身能反礼则为仁矣。”）一日克已复礼，天下归仁焉。（马曰：“一日犹" }
      - { type: j, text: "见归，况终身乎。”）为仁由已，而由人乎哉！”（孔曰：“行善在己，不在人" }
      - { type: j, text: "也。”）颜渊曰：“请问其目。”（包曰：“知其必有条目，故请问之。”）子" }
      - { type: j, text: "曰：“非礼勿视，非礼勿听，非礼勿言，非礼勿动。”（郑曰：“此四者，克已" }
      - { type: j, text: "复礼之目。”）颜渊曰：“回虽不敏，请事斯语矣。”（王曰：“敬事此语，必" }
      - { type: j, text: "行之。”）" }
      - { type: z, text: "“颜渊”至“语矣”。○正义曰：此并下三章，皆明仁也。“子曰：克" }
      - { type: j, text: "已复礼为仁”者，克，约也。已，身也。复，反也。言能约身反礼则为仁矣。" }
      - { type: j, text: "“一日克已复礼，天下归仁焉”者，言人君若能一日行克已复礼，则天下皆归此" }
      - { type: j, text: "仁德之君也。一日犹见归，况终身行仁乎。“为仁由已，而由人乎哉”者，言行" }
      - { type: j, text: "善由已，岂由他人乎哉。言不在人也。“颜渊曰：请问其目”者，渊意知其为仁" }
      - { type: j, text: "必有条目，故请问之。“子曰：非礼勿视，非礼勿听，非礼勿言，非礼勿动”者，" }
      - { type: j, text: "此四者，克已复礼之目也。《曲礼》曰“视瞻毋回”、“立视五”、“式视马" }
      - { type: j, text: "尾”之类，是礼也。非此则勿视。《曲礼》云：“毋侧听”，侧听则非礼也。言" }
      - { type: j, text: "无非礼，则口无择言也。动无非礼，则身无择行也。四者皆所以为仁。“颜渊曰：" }
      - { type: j, text: "回虽不敏，请事斯语矣”者，此颜渊预谢师言也，言回虽不敏达，请敬事此语，" }
      - { type: j, text: "必行之也。○注“马曰：克已约身”。○正义曰：此注“克”训为“约”。刘炫" }
      - { type: j, text: "云：“克训胜也，已谓身也。身有嗜欲，当以礼义齐之。嗜欲与礼义战，使礼义" }
      - { type: j, text: "胜其嗜欲，身得归复於礼，如是乃为仁也。复，反也。言情为嗜欲所逼，已离礼，" }
      - { type: j, text: "而更归复之。今刊定云：克训胜也，己谓身也，谓能胜去嗜欲，反复於礼也。”" }
      - { type: j, text: "仲弓问仁。子曰：“出门如见大宾，使民如承大祭。（孔曰：“为仁之道，" }
      - { type: j, text: "莫尚乎敬。”）已所不欲，勿施於人。在邦无怨，在家无怨。”（包曰：“在邦" }
      - { type: j, text: "为诸侯，在家为卿大夫。”）仲弓曰：“雍虽不敏，请事斯语矣。”" }
      - { type: z, text: "“仲弓问仁”至“语矣”。○正义曰：此章明仁在敬恕也。“子曰：出" }
      - { type: j, text: "门如见大宾，使民如承大祭”者，此言为仁之道，莫尚乎敬也。大宾，公侯之宾" }
      - { type: j, text: "也。大祭，郊之属也。人之出门，失在倨傲，故戒之出门如见公侯之宾。使民" }
      - { type: j, text: "失於骄易，故戒之如承奉郊之祭。“已所不欲，勿施於人”者，此言仁者必恕" }
      - { type: j, text: "也。已所不欲，无施之於人，以他人亦不欲也。“在邦无怨，在家无怨”者，言" }
      - { type: j, text: "既敬且恕，若在邦为诸侯必无人怨，在家为卿大夫亦无怨也。“仲弓曰：雍虽不" }
      - { type: j, text: "敏，请事斯语矣”者，亦承谢之语也。" }
      - { type: j, text: "司马牛问仁。子曰：“仁者，其言也讠刃。”（孔曰：“讠刃，难也。牛，" }
      - { type: j, text: "宋人，弟子司马犁。”）曰：“其言也讠刃，斯谓之仁已乎？”子曰：“为之难，" }
      - { type: j, text: "言之得无讠刃乎？”（子曰：“行仁难，言仁亦不得不难。”）" }
      - { type: z, text: "“司马牛问仁”至“讠刃乎”。○正义曰：此章言仁之难也。“子曰：" }
      - { type: j, text: "仁者，其言也讠刃”者，讠刃，难也。言仁道至大，非但行之难也，其言之亦难。" }
      - { type: j, text: "“曰：其言也讠刃，斯谓之仁已乎”者，牛意嫌孔子所言未尽其理，故复问曰：" }
      - { type: j, text: "“只此其言也讠刃，便谓仁已乎？”“子曰：为之难，言之得无讠刃乎”者，此" }
      - { type: j, text: "孔子又为牛说言讠刃之意，行仁既难，言仁亦不得不难。○注“孔子”曰至“马" }
      - { type: j, text: "犁”。○正义曰：《史记·弟子传》云：“司马耕字子牛。多言而躁。问仁於孔" }
      - { type: j, text: "子，孔子曰：‘仁者，其言也讠刃。’”是也。" }
      - { type: j, text: "司马牛问君子。子曰：“君子不忧不惧。”（孔曰：“牛兄桓将为乱，牛" }
      - { type: j, text: "自宋来学，常忧惧，故孔子解之。”）曰：“不忧不惧，斯谓之君子已乎？”子" }
      - { type: j, text: "曰：“内省不疚，夫何忧何惧？”（包曰：“疚，病也。自省无罪恶，无可忧惧。”）" }
      - { type: z, text: "“司马”至“何惧”。○正义曰：此章明君子也。“司马牛问君子”者，" }
      - { type: j, text: "问於孔子言君子之行何如也。“子曰：君子不忧不惧”者，言君子之人，不忧愁，" }
      - { type: j, text: "不恐惧。时牛兄桓将为乱，牛自宋来学，常忧惧，故孔子解之也。“曰：不忧" }
      - { type: j, text: "不惧，斯谓之君子已乎”者，亦意少其言，故复问之。“子曰：内省不疚，夫何" }
      - { type: j, text: "忧何惧”者，此孔子更为牛说不忧惧之理。疚，病也。自省无罪恶，则无可忧惧。" }
      - { type: j, text: "司马牛忧曰：“人皆有兄弟，我独亡。”（郑曰：“牛兄桓行恶，死亡无" }
      - { type: j, text: "日，我为无兄弟。”）子夏曰：“商闻之矣：死生有命，富贵在天。君子敬而无" }
      - { type: j, text: "失，与人恭而有礼，四海之内皆兄弟也。君子何患乎无兄弟也？”（包曰：“君" }
      - { type: j, text: "子疏恶而友贤，九州之人皆可以礼亲。”）" }
      - { type: z, text: "“司马”至“弟也”。○正义曰：此章言人当任命友贤也。“司马牛忧" }
      - { type: j, text: "曰：人皆有兄弟，我独亡”者，亡，无也。牛兄桓行恶，死亡无日，故牛常忧" }
      - { type: j, text: "而告人曰：“他人皆有兄弟，若桓死亡之後，我为独无兄弟也。”“子夏曰：" }
      - { type: j, text: "商闻之矣：死生有命，富贵在天。君子敬而无失，与人恭而有礼，四海之内皆兄" }
      - { type: j, text: "弟也。君子何患乎无兄弟也”者，子夏见牛忧无兄弟，以此言解之也。商，子夏" }
      - { type: j, text: "名，谦，故云商闻之矣，示非妄谬也。言人死生短长，各有所禀之命，财富位贵" }
      - { type: j, text: "则在天之所予，君子但当敬慎而无过失，与人结交恭谨而有礼。能此疏恶而友贤，" }
      - { type: j, text: "则东夷、西戎、南蛮、北狄，四海之内，九州之人，皆可以礼亲之为兄弟也。君" }
      - { type: j, text: "子何须忧患於无兄弟也。○注“郑曰”至“兄弟”。○正义曰：云“牛兄桓行" }
      - { type: j, text: "恶，死亡无日”者，案哀十四年《左传》云：“宋桓之宠害於公，公将讨之。" }
      - { type: j, text: "未及，先谋公。公知之，召皇司马子仲及左师向巢，以命其徒攻桓氏。向遂" }
      - { type: j, text: "入於曹以叛。民叛之，而奔卫，遂奔齐。”是其行恶死亡之事也。桓氏即向也，" }
      - { type: j, text: "又谓之桓司马，即此桓也。" }
      - { type: j, text: "子张问明。子曰：“浸润之谮，肤受之，不行焉，可谓明也已矣。（郑曰：" }
      - { type: j, text: "“谮人之言，如水之浸润，渐以成之。”马曰：“肤受之，皮肤外语，非其内" }
      - { type: j, text: "实。”）浸润之谮，肤受之，不行焉，可谓远也已矣。”（马曰：“无此二者，" }
      - { type: j, text: "非但为明，其德行高远，人莫能及。”）" }
      - { type: z, text: "“子张”至“已矣”。○正义曰：此章论人之明德。“子张问明”者，" }
      - { type: j, text: "问於孔子，何如可谓之明德也。“子曰：浸润之谮，肤受之，不行焉，可谓明" }
      - { type: j, text: "也已矣”者，此答为明也。夫水之浸润，渐以坏物，皮肤受尘，渐成垢秽。谮人" }
      - { type: j, text: "之言，如水之浸润，皮肤受尘，亦渐以成之，使人不觉知也。若能辨其情伪，使" }
      - { type: j, text: "谮之言不行，可谓明德也。“浸润之谮，肤受之不行焉，可谓远也已矣”者，" }
      - { type: j, text: "言人若无此二者，非但为明，其德行可谓高远矣，人莫能及之也。○注“马曰：" }
      - { type: j, text: "肤受之，皮肤外语，非其内实”。○正义曰：亦谮也，变其文耳。皮肤受尘，" }
      - { type: j, text: "垢秽其外，不能入内也，以喻谮毁之语，但在外萋斐构成其过恶，非其人内实有" }
      - { type: j, text: "罪也。" }
      - { type: j, text: "子贡问政。子曰：“足食，足兵，民信之矣。”子贡曰：“必不得已而去，" }
      - { type: j, text: "於斯三者何先？”曰：“去兵。”子贡曰：“必不得已而去，於斯二者何先？”" }
      - { type: j, text: "曰：“去食。自古皆有死，民无信不立。”（孔曰：“死者，古今常道，人皆有" }
      - { type: j, text: "之。治邦不可失信。”）" }
      - { type: z, text: "“子贡问政”至“不立”。正义曰：此章贵信也。“子曰：足食，足兵，" }
      - { type: j, text: "民信之矣”者，此答为政之事也。足食则人知礼节，足兵则不轨畏威，民信之则" }
      - { type: j, text: "服命从化。“子贡曰：必不得已而去，於斯三者何先”者，子贡复问曰：若不获" }
      - { type: j, text: "已而除去，於此三者之中何者为先？“曰：去兵”者，孔子答言，先去兵。以兵" }
      - { type: j, text: "者凶器，民之残也，财用之蠹也，故先去之。“子贡曰：必不得已而去，於斯二" }
      - { type: j, text: "者何先”者，子贡复问：设若事不获已，须要去之，於此食与信二者之中先去何" }
      - { type: j, text: "者？“曰：去食。自古皆有死，民无信不立”者，孔子答言，二者之中先去食。" }
      - { type: j, text: "夫食者，人命所须，去之则人死。而去食不去信者，言死者古今常道，人皆有之，" }
      - { type: j, text: "治国不可失信，失信则国不立也。" }
      - { type: j, text: "棘子成曰：“君子质而已矣，何以文为？”（郑曰：“旧说云：棘子成，卫" }
      - { type: j, text: "大夫。”）子贡曰：“惜乎！夫子之说君子也，驷不及舌。（郑曰：“惜乎！夫" }
      - { type: j, text: "子之说君子也，过言一出，驷马追之不及。”）文犹质也，质犹文也。虎豹之" }
      - { type: j, text: "享，犹犬羊之享。”（孔曰：“皮去毛曰享。虎豹与犬羊别者，正以毛文" }
      - { type: j, text: "异耳。今使文质同者，何以别虎豹与羊犬邪？”）" }
      - { type: z, text: "“棘子”至“之享”。○正义曰：此章贵尚文章也。“棘子成曰：君" }
      - { type: j, text: "子质而已矣，何以文为”者，卫大夫棘子成言曰：君子之人，淳质而已，则可矣，" }
      - { type: j, text: "何用文章乃为君子？意疾时多文章。“子贡曰：惜乎！夫子之说君子也，驷不及" }
      - { type: j, text: "舌”者，夫子指子成也。子贡闻子成言君子不以文，为其言过谬，故叹曰：可惜" }
      - { type: j, text: "乎！棘子成之说君子也，过言一出於舌，驷马追之不及。“文犹质也，质犹文也。" }
      - { type: j, text: "虎豹之享，犹犬羊之享”者，此子贡举喻，言文章不可去也。皮去毛曰享。" }
      - { type: j, text: "言君子、野人异者，质、文不同故也。虎豹与犬羊别者，正以毛文异耳。今若文" }
      - { type: j, text: "犹质，质犹文，使文质同者，则君子与鄙夫何以别乎？如虎豹之皮，去其毛文，" }
      - { type: j, text: "以为之享，与犬羊之享同处，何以别虎豹与犬羊也？" }
      - { type: j, text: "哀公问於有若曰：“年饥，用不足，如之何？”有若对曰：“盍彻乎？”" }
      - { type: j, text: "（郑曰：“盍，何不也。周法什一而税谓之彻，彻，通也，为天下之通法。”）" }
      - { type: j, text: "曰：“二，吾犹不足，如之何其彻也？”（孔曰：“二谓什二而税。”）对曰：" }
      - { type: j, text: "“百姓足，君孰与不足？百姓不足，君孰与足？”（孔曰：“孰，谁也。”）" }
      - { type: z, text: "“哀公”至“与足”。○正义曰：此章明税法也。“哀公问於有若曰：" }
      - { type: j, text: "年饥，用不足，如之何”者，鲁君哀公问於孔子弟子有若曰：“年不熟，国用" }
      - { type: j, text: "不足，如之何使国用得足也？“有若对曰：盍彻乎”者，盍犹何不也。周法什一" }
      - { type: j, text: "而税谓之彻，彻，通也，为天下之通法。有若意讥哀公重敛，故对曰：既国用不" }
      - { type: j, text: "足，何不依通法而税取乎？“曰：二，吾犹不足，如之何其彻也”者，二谓什二" }
      - { type: j, text: "而税。哀公不觉其讥，故又曰：什而税二，吾之国用犹尚不足，如之何其依彻法" }
      - { type: j, text: "什而税一乎？“对曰：百姓足，君孰与不足？百姓不足，君孰与足”者，孰，谁" }
      - { type: j, text: "也。哀公既言重敛之实，故有若又对以盍彻足用之理。言若依通法而税，则百姓" }
      - { type: j, text: "家给人足。百姓既足，上命有求则供，故曰：君孰与不足也。今君重敛，民则困" }
      - { type: j, text: "穷，上命所须，无以供给，故曰：百姓不足，君孰与足也。○注“郑曰”至“通" }
      - { type: j, text: "法”。○正义曰：云“周法什一而税谓之彻”者，《公羊传》曰：“古者什一而" }
      - { type: j, text: "藉。古者曷为什一而藉？什一者，天下之中正也。多乎什一，大桀小桀。寡乎什" }
      - { type: j, text: "一，大貉小貉。什一者，天下之中正也。什一行而颂声作矣。”何休云：“多取" }
      - { type: j, text: "於民，比於桀。蛮貉无百官制度之费，税薄。”《梁传》亦云：“古者什一而" }
      - { type: j, text: "藉。”《孟子》云：“夏后氏五十而贡，殷人七十而助，周人百亩而彻，其实皆" }
      - { type: j, text: "什一也。”赵岐注云：“民耕五十亩者贡上五亩，耕七十亩者以七亩助公家，耕" }
      - { type: j, text: "百亩者彻取十亩以为赋，虽异名义，多少同，故云皆什一也。”书传云十一者多" }
      - { type: j, text: "矣，故杜预云：“古者公田之法，十取其一，谓十亩内取一。”旧法既已十亩取" }
      - { type: j, text: "一矣，《春秋》鲁宣公十五年初税亩，又履其馀亩，更复十收其一，乃是十取其" }
      - { type: j, text: "二，故此哀公曰：二，吾犹不足。谓十内税二，犹尚不足，则从宣公之後，遂以" }
      - { type: j, text: "十二为常，故曰初。言初税十二自宣公始也。诸书皆言十一而税，而《周礼·载" }
      - { type: j, text: "师》云凡任地，“近郊十一，远郊二十而三，甸稍县都皆无过十二，漆林之征二" }
      - { type: j, text: "十而五”者，彼谓王畿之内所共多，故赋税重；诸书所言什一，皆谓畿外之国，" }
      - { type: j, text: "故此郑玄云：“什一而税谓之彻，彻，通也。为天下之通法。”言天下皆什一耳，" }
      - { type: j, text: "不言畿内亦什一也。《孟子》又曰：“方里为井，井九百亩。其中为公田，八家" }
      - { type: j, text: "皆私百亩，同养公田。公事毕，然後敢治私事。”《汉书·食货志》取彼意而为" }
      - { type: j, text: "之文云：“井田方一里，是为九夫。八家共之，各受私田百亩，公田十亩，是为" }
      - { type: j, text: "八百八十亩，馀二十亩为庐舍。”诸儒多用彼为义。如彼所言，则家别一百一十" }
      - { type: j, text: "亩，是为十外税一也。郑玄《诗笺》云：“井税一夫，其田百亩。”则九而税一，" }
      - { type: j, text: "其意异於《汉书》，不以《志》为说也。又孟子对滕文公云：“请野九一而助，" }
      - { type: j, text: "国中什一使自赋。”郑玄《周礼·匠人注》引《孟子》此言乃云：“是邦国亦异" }
      - { type: j, text: "外内之法。”则郑玄以为，诸侯郊外郊内其法不同，郊内十一使自赋其一；郊外" }
      - { type: j, text: "九而助一，是为二十而税二。故郑玄又云：“诸侯谓之彻者，通其率以十一为正。”" }
      - { type: j, text: "言郊内郊外相通其率为十税一也。杜预直云十取其一，则又异於郑，唯谓一夫百" }
      - { type: j, text: "亩，以十亩归公。赵岐不解夏五十、殷七十之意，盖古者人多田少，一夫唯得五" }
      - { type: j, text: "十、七十亩耳。五十而贡，贡五亩；七十而助，助七亩，好恶取於此。郑注《考" }
      - { type: j, text: "工记》云：“周人畿内用夏之贡法，邦国用殷之助法也。”" }
      - { type: j, text: "子张问崇德辨惑。（孔曰：“辨别也。”）子曰：“主忠信，徙义，崇德也。" }
      - { type: j, text: "（包曰：“徙义，见义则徙意而从之。”）爱之欲其生，恶之欲其死。既欲其生，" }
      - { type: j, text: "又欲其死，是惑也。（包曰：“爱恶当有常。一欲生之，一欲死之，是心惑也。”）" }
      - { type: j, text: "诚不以富，亦祗以异。”（郑曰：“此《诗·小雅》也。祗，也。言此行诚不" }
      - { type: j, text: "可以致富，足以为异耳。取此《诗》之异义以非之。”）" }
      - { type: z, text: "“子张”至“以异”。○正义曰：此章言人当有常德也。“子张问崇德" }
      - { type: j, text: "辨惑”者，崇，充也；辨，别也。言欲充盛道德，别疑惑，何为而可也。“子" }
      - { type: j, text: "曰：主忠信，徙义，崇德也”者，主，亲也。徙，迁也。言人有忠信者则亲友之，" }
      - { type: j, text: "见义事则迁意而从之，此所以充盛其德也。“爱之欲其生，恶之欲其死。既欲其" }
      - { type: j, text: "生，又欲其死，是惑也”者，言人心爱恶当须有常。若人有顺己，己即爱之，便" }
      - { type: j, text: "欲其生；此人忽逆於己，己即恶之，则原其死，一欲生之，一欲死之，用心无常，" }
      - { type: j, text: "是惑也。既能别此是惑，则当之，“诚不以富，亦祗以异”者，此《诗·小雅" }
      - { type: j, text: "·我行其野篇》文也。祗，也。言此行诚不足以致富，足以为异耳。取此诗" }
      - { type: j, text: "之异义，以非人之惑也。○注“郑曰”至“非之”。○正义曰：案诗刺淫昏之俗，" }
      - { type: j, text: "不思旧姻，而求新昏也，彼诚作成。郑笺云：“女不以礼为室家，成事不足以得" }
      - { type: j, text: "富也，女亦以此自异於人道，言可恶也。”此引《诗》断章，故不与本义同也。" }
      - { type: j, text: "齐景公问政於孔子。孔子对曰：“君君，臣臣，父父，子子。”（孔曰：" }
      - { type: j, text: "“当此之时，陈桓制齐，君不君，臣不臣，父不父，子不子，故以对。”）公曰：" }
      - { type: j, text: "“善哉！信如君不君，臣不臣，父不父，子不子，虽有粟，吾得而食诸？”（孔" }
      - { type: j, text: "曰：“言将危也。陈氏果灭齐。”）" }
      - { type: z, text: "“齐景”至“食诸”。○正义曰：此章明治国之政也。“齐景公问政於" }
      - { type: j, text: "孔子”者，齐君景公问为国之政於夫子也。“孔子对曰：君君，臣臣，父父，子" }
      - { type: j, text: "子”者，言政者正也，若君不失君道，乃至子不失子道，尊卑有序，上下不失，" }
      - { type: j, text: "而後国家正也。当此之时，陈桓为齐大夫以制齐国，君不君，臣不臣，父不父，" }
      - { type: j, text: "子不子，故孔子以此对之。“公曰：善哉！信如君不君，臣不臣，父不父，子不" }
      - { type: j, text: "子，虽有粟，吾得而食诸”者，诸，之也。景公闻孔子之言而信服之，故叹曰：" }
      - { type: j, text: "“善哉！信如夫子之言，而今齐国君不君，以至子不子，虽有其粟，吾得而食之" }
      - { type: j, text: "乎？”言将见危亡，必不得食之也。○注“陈氏果灭齐”。○正义曰：《史记·" }
      - { type: j, text: "田完世家》：完卒，谥为敬仲，仲生犀孟夷，夷生泯孟庄，庄生文子须无，文" }
      - { type: j, text: "子生桓子无宇，桓子生武子启及僖子乞；乞卒；子当代之，是为田成子；成子弑" }
      - { type: j, text: "简公，专齐政；成子生襄子盘，盘生庄子白，白生大公和，和迁齐康公於海上；" }
      - { type: j, text: "和立为齐侯；和孙威王称王，四世而秦灭之。是陈氏灭齐也。《世家》云敬仲之" }
      - { type: j, text: "如齐，以陈子为田氏，《左传》终始称陈，则田必非敬仲所改，未知何时改耳。" }
      - { type: j, text: "子曰：“片言可以折狱者，其由也与？”（孔曰：“片犹偏也。听讼必须两" }
      - { type: j, text: "辞以定是非，偏信一言以折狱者，唯子路可。”）子路无宿诺。（宿，犹豫也。" }
      - { type: j, text: "子路笃信，恐临时多故，故不豫诺。）" }
      - { type: z, text: "“子曰”至“宿诺”。○正义曰：此章言子路有明断笃信之德也。“子" }
      - { type: j, text: "曰：片言可以折狱者，其由也与”者，片，犹偏也。折，犹决断也。凡听讼必须" }
      - { type: j, text: "两辞以定是非，偏信一言以决断狱讼者，唯子路可，故云其由也。“与子路无宿" }
      - { type: j, text: "诺”者，宿，犹豫也。子路笃信，恐临时多故，故不豫也。或分此别为一章，今" }
      - { type: j, text: "合之。○注“孔曰”至“路可”。○正义曰：云“听讼必须两辞以定是非”者，" }
      - { type: j, text: "《周礼·秋官·大司寇职》云：“以两造禁民讼，以两剂禁民狱。”注云：“讼" }
      - { type: j, text: "谓以财货相告者。狱谓相告以罪名者。造，至也。剂，今券书也。使讼者两至，" }
      - { type: j, text: "狱者各赍券书，既两至、两券书，乃治之。不至及不券书，则是自服不直者也。”" }
      - { type: j, text: "故知听讼必须两辞方定是非。偏信一言，则是非难决。唯子路才性明辨，能听偏" }
      - { type: j, text: "言决断狱讼，故云唯子路可。" }
      - { type: j, text: "子曰：“听讼，吾犹人也。（包曰：“与人等。”）必也，使无讼乎！（王" }
      - { type: j, text: "曰：“化之在前。”）" }
      - { type: z, text: "“子曰：听讼，吾犹人也。必也，使无讼乎！”○正义曰：此章孔子言" }
      - { type: j, text: "已至诚也。言听断狱讼之时，备两造，吾亦犹如常人，无以异也。言与常人同。" }
      - { type: j, text: "必也，在前以道化之，使无争讼乃善。○注“王曰：化之在前”。○正义曰：案" }
      - { type: j, text: "《周易·讼卦·象》曰：“天与水违行，讼。君子以作事谋始。”王弼云：“听" }
      - { type: j, text: "讼，吾犹人也，必也，使无讼乎！无讼在於谋始，谋始在於作制。契之不明，讼" }
      - { type: j, text: "之所以生也。物有其分，职不相滥，争何由兴？讼之所以起，契之过也。故有德" }
      - { type: j, text: "司契而不责於人。”是化之在前也。又案：《大学》云：“子曰：‘听讼，吾犹" }
      - { type: j, text: "人也。必也，使无讼乎！’无情者不得尽其辞，大畏民志。”郑注云：“情犹实" }
      - { type: j, text: "也。无实者多虚诞之辞，圣人之听讼与人同耳。必使民无实者不敢尽其辞，大畏" }
      - { type: j, text: "其心志，使诚其意，不敢讼。”然则“听讼，吾犹人也，必也，使无讼乎”，是" }
      - { type: j, text: "夫子辞。“无情者不得尽其辞，大畏民志”，是记者释夫子无讼之事，意与此注" }
      - { type: j, text: "及王弼不同，未知谁是，故具载之。" }
      - { type: j, text: "子张问政。子曰：“居之无倦，行之以忠。”（王曰：“言为政之道，居之" }
      - { type: j, text: "於身，无得解倦，行之於民，必以忠信。”）" }
      - { type: z, text: "“子张问政。子曰：居之无倦，行之以忠。”○正义曰：此章言为政之" }
      - { type: j, text: "道，若居之於身，无解倦，行之於民，必以忠信也。" }
      - { type: j, text: "子曰：“博学於文，约之以礼，亦可以弗畔矣夫。”（郑曰：“弗畔，不违" }
      - { type: j, text: "道。”）" }
      - { type: z, text: "“子曰”至“弗畔矣夫”。○正义曰：此章及注与《雍也篇》同，当是" }
      - { type: j, text: "弟子各记所闻，故重载之。或本亦有作“君子博学於文”。" }
      - { type: j, text: "子曰：“君子成人之美，不成人之恶。小人反是。”" }
      - { type: z, text: "“子曰：君子成人之美，不成人之恶。小人反是。”○正义曰：此章言" }
      - { type: j, text: "君子之於人，嘉善而矜不能，又复仁恕，故成人之美，不成人之恶也。小人则嫉" }
      - { type: j, text: "贤乐祸，而成人之恶，不成人之美，故曰反是。" }
      - { type: j, text: "季康子问政於孔子。孔子对曰：“政者，正也。子帅以正，孰敢不正！”" }
      - { type: j, text: "（郑曰：“康子，鲁上卿，诸臣之帅也。”）" }
      - { type: z, text: "“季康子问政”至“不正”。○正义曰：此章言为政在乎修已。“对曰：" }
      - { type: j, text: "政者，正也”者，言政教者在於齐正也。“子帅以正，孰敢不正”者，言康子为" }
      - { type: j, text: "鲁上卿，诸臣之帅也，若已能每事以正，则已下之臣民谁敢不正也。" }
      - { type: j, text: "季康子患盗，问於孔子。孔子对曰：“苟子之不欲，虽赏之不窃。”（孔曰：" }
      - { type: j, text: "“欲，多情欲。言民化於上，不从其令，从其所好。”）" }
      - { type: z, text: "“季康子”至“不窃”。○正义曰：此章言民从上化也。“季康子患盗，" }
      - { type: j, text: "问於孔子”者，时鲁多盗贼，康子患之，问於孔子，欲以谋去也。“孔子对曰：" }
      - { type: j, text: "苟子之不欲，虽赏之不窃”者，孔子言，民化於上，不从其令，从其所好。苟，" }
      - { type: j, text: "诚也。诚如子之不贪欲，则民亦不窃盗。非但不为，假令赏之，民亦知耻而不窃" }
      - { type: j, text: "也。今多盗贼者，正由子之贪欲故耳。○注“孔曰”至“所好”。○正义曰：云" }
      - { type: j, text: "“民化於上，不从其令，从其所好”者，《大学》曰：“尧、舜率天下以仁而民" }
      - { type: j, text: "从之，桀、纣率天下以暴而民从之。其所令反其所好，而民不从。”注云：言民" }
      - { type: j, text: "化君行也。君若好货，而禁民淫於财利，不能正也。”" }
      - { type: j, text: "季康子问政於孔子曰：“如杀无道，以就有道，何如？”（孔曰：“就，成" }
      - { type: j, text: "也。欲多杀以止奸。”）孔子对曰：“子为政，焉用杀？子欲善而民善矣。君子" }
      - { type: j, text: "之德风，小人之德草。草上之风，必偃。”（孔曰：“亦欲令康子先自正。偃，" }
      - { type: j, text: "仆也。加草以风，无不仆者，犹民之化於上。”）" }
      - { type: z, text: "“季康子”至“必偃”。○正义曰：此章言为政不须刑杀，但在上自正，" }
      - { type: j, text: "则民化之也。“季康子问政於孔子曰：如杀无道，以就有道，何如”者，就，成" }
      - { type: j, text: "也。康子之意，欲多杀止奸，以成为有道也。“孔子对曰：子为政，焉用杀”者，" }
      - { type: j, text: "言子为执政，安用刑杀也。“子欲善而民善矣”者，言子若为善，则民亦化之为" }
      - { type: j, text: "善矣。“君子之德风，小人之德草。草上之风，必偃”者，此为康子设譬也。偃，" }
      - { type: j, text: "仆也。在上君子为政之德若风，在下小人从化之德如草，加草以风，无不仆者。" }
      - { type: j, text: "犹化民以正，无不从者。亦欲令康子先自正也。" }
      - { type: j, text: "子张问：“士何如斯可谓之达矣？”子曰：“何哉，尔所谓达者？”子张对" }
      - { type: j, text: "曰：“在邦必闻，在家必闻。”（郑曰：“言士之所在，皆能有名誉。”）子曰：" }
      - { type: j, text: "“是闻也，非达也。夫达也者，质直而好义，察言而观色，虑以下人。（马曰：" }
      - { type: j, text: "“常有谦退之志，察言语，观颜色，知其所欲，其志虑常欲以下人。”）在邦必" }
      - { type: j, text: "达，在家必达。（马曰：“谦尊而光，卑而不可逾。”）夫闻也者，色取仁而行" }
      - { type: j, text: "违，居之不疑。（马曰：“此言佞人假仁者之色，行之则违，安居其伪而不自疑。”）" }
      - { type: j, text: "在邦必闻，在家必闻。”（马曰：“佞人党多。”）" }
      - { type: z, text: "“子张”至“必闻”。○正义曰：此章论士行。“子张问：士何如斯可" }
      - { type: j, text: "谓之达矣”者，士，有德之称。问士行何如可谓通达也。“子曰：何哉，尔所谓" }
      - { type: j, text: "达者”者，夫子复问子张，何者是汝意所谓达者。欲使试言之也。“子张对曰：" }
      - { type: j, text: "在邦必闻，在家必闻”者，闻谓有名誉，使人闻之也。言士有德行，在邦臣於诸" }
      - { type: j, text: "侯，必有名闻；在家臣於卿大夫，亦必有名闻。言士之所在，皆有名誉，意谓此" }
      - { type: j, text: "为达也。“子曰：是闻也，非达也”者，言汝所陈，正是名闻之士，非是通达之" }
      - { type: j, text: "士也。“夫达也者，质直而好义，察言而观色，虑以下人”者，此孔子又说达士" }
      - { type: j, text: "之行也，为性正直，所好义事，察人言语，观人颜色，知其所欲，其念虑常欲以" }
      - { type: j, text: "下人。言常有谦退之志也。“在邦必达，在家必达”者，以其谦退，故所在通达" }
      - { type: j, text: "也。“夫闻也者，色取仁而行违，居之不疑”者，此言佞人色则假取仁者之色，" }
      - { type: j, text: "而行则违之，安居其伪而不自疑也。“在邦必闻，在家必闻”者，言佞人党多，" }
      - { type: j, text: "妄相称誉，故所在皆有名闻也。○注“马曰：谦尊而光，卑而不可逾。”○正义" }
      - { type: j, text: "曰：此《周易·谦卦·彖辞》也。言尊者有谦而更光明盛大，卑者有谦而不可逾" }
      - { type: j, text: "越。引证士有谦德则所在必达也。" }
      - { type: j, text: "樊迟从游於舞雩之下，（包曰：“舞雩之处有坛单树木，故下可游焉。”）" }
      - { type: j, text: "曰：“敢问崇德、慝、辨惑。”（孔曰：“慝，恶也。，治也。治恶为善。”）" }
      - { type: j, text: "子曰：“善哉问！先事後得，非崇德与？（孔曰：“先劳於事，然後得报。”）" }
      - { type: j, text: "攻其恶，无攻人之恶，非慝与？一朝之忿，忘其身，以及其亲，非惑与？”" }
      - { type: z, text: "“樊迟”至“惑与”。○正义曰：此章言身之事也。樊迟从游於舞雩" }
      - { type: j, text: "之处，有坛单树木，故弟子樊迟随从孔子游於其下也。曰：“敢问崇德、慝、" }
      - { type: j, text: "辨惑”者，，治也。慝，恶也。此樊迟因从行而问孔子，曰：“敢问欲充盛其" }
      - { type: j, text: "德，治恶为善，别疑惑，何为而可也？”“子曰：善哉问”者，其问皆身之" }
      - { type: j, text: "要，故善之。“先事後得，非崇德与”者，言先劳於事，然後得报，是崇德也。" }
      - { type: j, text: "“攻其恶，无攻人之恶，非慝与”者，攻，治也。言治其已过，无治人之过，" }
      - { type: j, text: "是治恶也。“一朝之忿，忘其身，以及其亲，非惑与”者，言君子忿则思难。若" }
      - { type: j, text: "人有犯己，一朝忿之，不思其难，则忘身也。辱其身则羞其亲，故曰：“以及其" }
      - { type: j, text: "亲也，非惑与？”言是惑也。注“坛单”。○正义曰：封土为坛，除地为单。" }
      - { type: j, text: "言雩坛在所除地中，故连言坛单。" }
      - { type: j, text: "樊迟问仁。子曰：“爱人。”问知。子曰：“知人。”樊迟未达。子曰：" }
      - { type: j, text: "“举直错诸枉，能使枉者直。”（包曰：“举正直之人用之，废置邪枉之人，则" }
      - { type: j, text: "皆化为直。”）樊迟退，见子夏曰：“乡也吾见於夫子而问知，子曰：‘举直错" }
      - { type: j, text: "诸枉，能使枉者直。’何谓也？”子夏曰：“富哉言乎！（孔曰：“富，盛也。”）" }
      - { type: j, text: "舜有天下，选於众，举皋陶，不仁者远矣。汤有天下，选於众，举伊尹，不仁者" }
      - { type: j, text: "远矣。”（孔曰：“言舜、汤有天下，选择於众，举皋陶、伊尹，则不仁者远矣，" }
      - { type: j, text: "仁者至矣。”）" }
      - { type: z, text: "“樊迟”至“远矣”。○正义曰：此章明仁、知也。“樊迟问仁。子曰：" }
      - { type: j, text: "爱人”者，言爱济众是仁道也。“问知。子曰：知人”者，言知人贤才而举之，" }
      - { type: j, text: "是知也。“樊迟未达。子曰：举直错诸枉，能使枉者直”者，樊迟未晓达知人之" }
      - { type: j, text: "意，故孔子复解之，言举正直之人而用之，废置邪枉之人，则皆化为直，故曰能" }
      - { type: j, text: "使枉者直也。“樊迟退，见子夏曰：乡也吾见於夫子而问知，子曰：举直错诸枉，" }
      - { type: j, text: "能使枉者直。何谓也”者，樊迟虽问举直错枉之语，犹自未喻，故复问子夏也。" }
      - { type: j, text: "“子夏曰：富哉言乎”者，子夏闻言即解，故叹美之曰：“富盛哉，此言乎！”" }
      - { type: j, text: "“舜有天下，选於众，举皋陶，不仁者远矣。汤有天下，选於众，举伊尹，不仁" }
      - { type: j, text: "者远矣”者，此子夏为樊迟说举直错枉之事也。言舜、汤有天下，选择於众，举" }
      - { type: j, text: "用皋陶、伊尹，则不仁者远矣，仁者至矣。是其能使邪枉者亦化为直也。" }
      - { type: j, text: "子贡问友。子曰：“忠告而善道之，不可则止，毋自辱焉。”（包曰：“忠" }
      - { type: j, text: "告，以是非告之。以善道导之，不见从则止。必言之，或见辱。”）" }
      - { type: z, text: "“子贡问友。子曰：忠告而善道之，不可则止，毋自辱焉”。○正义曰：" }
      - { type: j, text: "此章论友也。言尽其忠以是非告之，又以善道导之，若不从己，则止而不告不导" }
      - { type: j, text: "也。毋得强告导之，以自取困辱焉。以其必言之，或时见辱。" }
      - { type: j, text: "曾子曰：“君子以文会友，（孔曰：“友以文德合。”）以友辅仁。”（孔" }
      - { type: j, text: "曰：“友相切磋之道，所以辅成己之仁。”）" }
      - { type: z, text: "“曾子曰：君子以文会友，以友辅仁。”○正义曰：此章以论友，言君" }
      - { type: j, text: "子之人以文德会合朋友，朋友有相切磋琢磨之道，所以辅成已之仁德也。" }
