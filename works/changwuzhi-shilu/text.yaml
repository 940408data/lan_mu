# 長物志·室廬：點校中導覽（teaser）
sections:
  - id: shi-lu
    name: 室廬
    blocks:
      - type: j
        text: 室廬
      - type: z
        text: 導：此章論居室，自擇地至庭臺齋閣，以「雅潔」為歸。文震亨所貴不在華侈，而在曠士之懷、幽人之致，讀之如遊晚明江南園亭。薦語：門庭雅潔、亭臺具曠士之懷，齋閣有幽人之致。
      - type: j
        text: 居山水間者為上，村居次之，郊居又次之。吾儕縱不能棲巖止谷，追綺園之蹤，而混跡廛市，要須門庭雅潔，室廬清靚，亭臺具曠士之懷，齋閣有幽人之致。
      - type: z
        text: 讀：上、次、又次三層，先立居室之格：所求非華屋，乃清靚之心。混跡廛市而猶要曠士之懷、幽人之致，此八字是全書基調，宜緩讀。
