    <p><b>宋體</b>近刊本，字口清勁�?b>寫經�?/b>取楷法，逐字微側微欹，如唐人寫經�?b>行楷</b>筆勢流走，字形略欹側而互有呼應。三體共用同一版心格律，行數字數不變。若你的系統未裝相應中文字體，會自動退回可用的最近字體�?/p>
    <p>《序》云：「以其聲微而志遠，而不堪授人。」此卷之神，正在一個「微」字�?/p>
