    <h3>復刻取捨</h3>
    <p>行數與每行字數嚴格依原卷結構；字�?28、行�?46（比例約合原卷），墨色按「蘸墨—行筆—墨盡」的節奏逐字微調濃淡，夾注作雙行小字置於行左�?/p>
    <p>點綴取魏晉意度：卷首折枝一支、拖尾補蘭一叢，卷中十處自天頭地腳淡淡探入一兩葉，不作全株。朱印取序中語「聲微志遠」，並散鈐「淡」「微」「隱」「韻遠」四印。皆極淡，遠觀若無，近察方見�?/p>
