    columns:
      - line: 1
        class: title
        text: 碣石調幽蘭序一名倚蘭
        marks: "032006069168151220235064039037"
      - line: 2
        class: intro
        text: 丘公字明會稽人也梁末隱於九疑山妙絕楚調於
        marks: "029059067106112237234260377007065135106178257230235308014048"
      - line: 3
        class: intro
        text: 幽蘭一曲尤特精絕以其聲微而志遠而不堪授人
        marks: "030016008028179170143216200006053011141136276259348368002013"
      - line: 4
        class: intro
        text: 以陳禎明三年授宜都王叔明隨開皇十年於丹陽
        marks: "072070023136168216031017171172179235241219350344413022026006"
      - line: 5
        class: intro
        text: 縣卒年九十七無子傳之其聲遂簡耳
        marks: "035044073073144114154223257321061007009175105"
