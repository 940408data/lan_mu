# 周易正義卷三（孔穎達疏）：j 為經文＋王弼注，z 為正義疏文。
sections:
  - id: juan三
    name: 卷三
    blocks:
      - { type: j, text: "震下兌上。隨：元亨，利貞，無咎。" }
      - { type: z, text: "“隨元亨利貞無咎”。○正義曰：“元亨”者，於相隨之世，必大得亨通。若其不大亨通，則無以相隨，逆於時也。“利貞”者，相隨之體，須利在得正。隨而不正，則邪僻之道，必須利貞也。“無咎”者，有此四德、乃無咎。以苟相從，涉於朋黨，故必須四德乃無咎也。凡卦有四德者，或其卦當時之義，即有四德，如乾、坤、屯、臨、無妄，此五卦之時，即能四德備具。其隨卦以惡相隨，則不可也。有此四德乃無咎，無此四德則有咎也。與前五卦其義稍別。其《革卦》“巳日乃孚有四德”，若不“巳日乃孚”，則無四德，與乾、坤、屯、臨、無妄、隨其義又別。若當卦之時，其卦雖美，未有四德。若行此美，方得在後始致四德者，於卦則不言其德也。若謙、泰及復之等，德義既美，行之不巳，久必致此四德。但當初之時，其德未具，故卦不顯四德也。其諸卦之三德巳下，其義大略亦然也。" }
      - { type: j, text: "《彖》曰：隨，剛來而下柔，動而說，隨。大亨貞無咎，而天下隨時。隨時之義大矣哉！震剛而兌柔也，以剛下柔動而之說，乃得隨也。為隨而不大通，逆於時也。相隨而不為利，正災之道也。故大通利貞，乃得無咎也。為隨而令大通利貞，得於時也。得時則天下隨之矣。隨之所施，唯在於時也。時異而不隨，否之道也，故“隨時之義大矣哉”！" }
      - { type: z, text: "“彖曰”至“大矣哉”。○正義曰：“隨剛來而下柔，動而說，隨”者，此釋隨卦之義。所以致此隨者，由剛來而下柔。“剛”謂震也，柔謂兌也。震處兌下，是剛來下柔。震動而兌說，既能下人，動則喜說，所以物皆隨從也。“大亨貞無咎而天下隨時”者，以有大亨貞正，無有咎害，而天下隨之，以正道相隨，故隨之者廣。若不以“大亨貞無咎”，而以邪僻相隨，則天下不從也。“隨時之義大矣哉”，若以“元亨利貞”，則天下隨從，即隨之義意廣大矣哉，謂隨之初始，其道未弘，終久義意而美大者。特云“隨時”者，謂隨其時節之義，謂此時宜行“元亨利貞”，故云“隨時”也。○注“震剛而兌”至“大矣哉”！○正義曰：為隨而不大通，逆於時也。物既相隨之時，若王者不以廣大開通，使物閉塞，是違逆於隨從之時也。“相隨而不為利，正災之道”者，凡物之相隨，多曲相朋附，不能利益於物，守其正直，此則小人之道長，災禍及之，故云“災之道”也。“隨之所施，唯在於時”者，釋“隨時”之義，言隨時施設，唯在於得時。若能大通利貞，是得時也。若不能大通利貞，是失時也。“時異而不隨，否之道”者，凡所遇之時，體無恆定，或值不動之時，或值相隨之時，舊來恆往，今須隨從。時既殊異於前，而不使物相隨，則是否塞之道，當須可隨則隨，逐時而用，所利則大，故云“隨時之義大矣哉”！" }
      - { type: j, text: "《象》曰：澤中有雷，隨，君子以鄉晦入宴息。澤中有雷，“動說”之象也。物皆說隨，可以無為，不勞明鑑。故君子“嚮晦入宴息”也。" }
      - { type: z, text: "“象曰”至“宴息”。○正義曰：《說卦》云：“動萬物者莫疾乎雷，……說萬物者莫說乎澤。故《注》云：“澤中有雷，動說之象也。”“君子以鄉晦入宴息”者，明物皆說豫相隨，不勞明鑑，故君子象之。鄭玄云：“晦，宴也。猶人君既夕之後，入於宴寢而止息。”" }
      - { type: j, text: "初九：官有渝，貞吉。出門交有功。居隨之始，上無其應，無所偏系，動能隨時，意無所主者也。隨不以欲，以欲隨宜者也。故官有渝變，隨不失正也。出門無違，何所失哉！" }
      - { type: z, text: "“初九”至“有功”。○正義曰：“官有渝”者，官謂執掌之職。人心執掌，與官同稱，故人心所主，謂之“官渝變”也。此初九既無其應，無所偏系，可隨則隨，是所執之志有能渝變也。唯正是從，故“貞吉”也。“出門交有功”者，所隨不以私欲，故見善則往隨之，以此出門，交獲其功。○注“居隨之始”至“何所失哉”。○正義曰：言“隨不以欲，以欲隨宜”者，若有其應，則有私欲，以無偏應，是所隨之事不以私欲，有正則從，是以欲隨其所宜也。" }
      - { type: j, text: "《象》曰：“官有渝”，從正吉也。“出門交有功”，不失也。" }
      - { type: z, text: "正義曰：“官有渝從正吉”者，釋“官有渝”之義。所執官守正，能隨時渝變，以見貞正則往隨從，故云“從正吉”。“出門交有功不失”者，釋“交有功”之義。以所隨之處，不失正道，故出門即有功也。" }
      - { type: j, text: "六二：系小子，失丈夫。陰之為物，以處隨世，不能獨立，必有系也。居隨之時，體於柔弱，而以乘夫剛動，豈能秉志違於所近？隨此失彼，弗能兼與。五處已上，初處已下，故曰“系小子，失丈夫”也。" }
      - { type: z, text: "“六二”至“失丈夫”。○正義曰：“小子”謂初九也。“丈夫”謂九五也。初九處卑，故稱“小子”。五居尊位，故稱“丈夫”。六二既是陰柔，不能獨立所處，必近系屬初九，故云“系小子”。既屬初九，則不得往應於五，故云“失丈夫”也。" }
      - { type: j, text: "《象》曰：“系小子”，弗兼與也。" }
      - { type: z, text: "正義曰：釋“系小子”之意。既隨此初九，則失彼九五丈夫，是不能兩處兼有，故云“弗兼與”也。" }
      - { type: j, text: "六三：系丈夫，失小子。隨有求得，利居貞。陰之為物，以處隨世，不能獨立，必有系也。雖體下卦，二巳據初，將何所附？故舍初系四，志在“丈夫”。四俱無應，亦欲於巳隨之，則得其所求矣，故曰“隨有求得”也。應非其正，以系於人，何可以妄曰“利居貞”也？初處己下，四處已上，故曰“系丈夫，失小子”也。" }
      - { type: z, text: "“六三系丈夫”至“利居貞”。○正義曰：六三陰柔，近於九四，是系於“丈夫”也。初九既被六二之所據，六三不可復往從之，是“失小子”也。“隨有求得”者，三從往隨於四，四亦更無他應。己往隨於四，四不能逆己，是三之所隨，有求而皆得也。“利居貞”者，己非其正，以系於人，不可妄動，唯利在俱處守正，故云“利居貞也”。○注“四俱無應”至“小子也”。○正義曰：“四俱無應”者，三既無應，四亦無應，是四與三俱無應也。此六二、六三因陰陽之象，假丈夫、小子以明人事，餘無義也。" }
      - { type: j, text: "《象》曰：“系丈夫”，志舍下也。“下”謂初也。" }
      - { type: z, text: "正義曰：釋“系丈夫”之義。六三既系九四之“丈夫”，志意則舍下之初九也。" }
      - { type: j, text: "九四：隨有獲，貞兇。有孚在道以明，何咎？處說之初，下據二陰，三求系己，不距則獲，故曰“隨有獲”也。居於臣地，履非其位，以擅其民，失於臣道，違正者也，故曰“貞兇”。體剛居說而得民心，能幹其事，而成其功者也。雖為常義，志在濟物，心有公誠，著信在道以明其功，何咎之有？" }
      - { type: z, text: "“九四”至“餌咎”。○正義曰：“隨有獲”者，處說之初，下據二陰，三求系己，不距則獲，故曰“隨有獲”也。“貞兇”者，居於臣地，履非其位，以擅其民，失其臣道，違其正理，故“貞兇”也。“有孚在道以明，何咎”者，體剛居說而得民心，雖違常義，志在濟物，心存公誠，著信在於正道，有功以明，更有何咎？故云“有孚在道以明，何咎”也。" }
      - { type: j, text: "《象》曰：“隨有獲”，其義兇也。“有孚在道”，明功也。" }
      - { type: z, text: "正義曰：“隨有獲其義兇”者，釋“隨有獲貞兇”之意。九四既有六三、六二，獲得九五之民，為臣而擅君之民，失於臣義，是以宜其兇也。“有孚在道明功”者，釋“以明何咎”之義。既能著信在於正道，是明立其功，故無咎也。" }
      - { type: j, text: "九五：孚於嘉，吉。履正居中，而處隨世，盡“隨時”之宜，得物之誠，故“嘉吉”也。" }
      - { type: z, text: "正義曰：嘉，善也。履中居正，而處隨世，盡隨時之義，得物之誠信，故獲美善之吉也。" }
      - { type: j, text: "《象》曰：“孚於嘉，吉”，位正中也。" }
      - { type: j, text: "上六：拘系之乃從。維之。王用亨於西山。隨之為體，陰順陽者也。最處上極，不從者也。隨道巳成，而特不從，故“拘系之乃從”也。“率土之濱，莫非王臣”，而為不從，王之所討也，故“維之王用亨於西山”也。兌為西方，山者，途之險隔也。處西方而為不從，故王用通於西山。" }
      - { type: z, text: "“《象》曰”至“於西山”。○正義曰：最處上極，是不隨從者也。隨道巳成而特不從，故須拘系之，乃始從也。“維之王用亨於西山”者，若欲維系此上六，王者必須用兵，通於西山險難之處，乃得拘系也。山謂險阻，兌處西方，故謂“西山”。令有不從，必須維系，此乃王者必須用兵通於險阻之道，非是意在好刑，故曰：“王用亨於西山。”" }
      - { type: j, text: "《象》曰：“拘系之”，上窮也。處於上極，故窮也。" }
      - { type: z, text: "正義曰：釋“拘系”之義。所以須拘系者，以其在上而窮極，不肯隨從故也。" }
      - { type: j, text: "巽下艮上。蠱：元亨，利涉大川。先甲三日，後甲三日。" }
      - { type: z, text: "“蠱元亨”至“後甲三日”。○正義曰：蠱者事也。有事營為，則大得亨通。有為之時，利在拯難，故“利涉大川”也。“先甲三日，後甲三日”者，甲者創制之令，既在有為之時，不可因仍舊令。今用創制之令以治於人，人若犯者，未可即加刑罰，以民未習，故先此宣令之前三日，殷勤而語之，又如此宣令之後三日，更丁寧而語之，其人不從，乃加刑罰也。其褚氏、何氏、周氏等並同鄭義，以為“甲”者造作新令之日，甲前三日，取改過自新，故用辛也。甲後三日，取丁寧之義，故用丁也。今案輔嗣《注》，“甲者，創制之令”，不云創制之日。又《巽卦》九五“先庚三日，後庚三日”，輔嗣《注》：“申命令謂之庚”。輔嗣又云：“甲、庚皆申命之謂”。則輔嗣不以甲為創制之日，而諸儒不顧輔嗣《注》旨，妄作異端，非也。" }
      - { type: j, text: "《彖》曰：蠱，剛上而柔下，上剛可以斷制，下柔可以施令。巽而止。蠱。既巽又止，不競爭也。有事而無競爭之患，故可以有為也。" }
      - { type: z, text: "“《彖》曰”至“止蠱”。○正義曰：“剛上而柔下，巽而止蠱”者，此釋蠱卦之名，並明稱蠱之義也。以上剛能制斷，下柔能施令，巽順止靜，故可以有為也。褚氏云：“蠱者惑也。物既惑亂，終致損壞，當須有事也，有為治理也。故《序卦》云：‘蠱者事也。’”謂物蠱必有事，非謂訓蠱為事義當然也。" }
      - { type: j, text: "蠱，元亨而天下治也。有為而大亨，非天下治而何也？" }
      - { type: z, text: "正義曰：釋“元亨”之義。以有為而得“元亨”，是天下治理也。" }
      - { type: j, text: "“利涉大川”，往有事也。“先甲三日，後甲三日”，終則有始，天行也。蠱者有事而待能之時也。可以有為，其在此時矣。物巳說隨，則待夫作制以定其事也。進德修業，往則亨矣。故“元亨，利涉大川”也。甲者，創制之令也。創制不可責之以舊，故先之三日，後之三日，使令治而後乃誅也。因事申令，終則復始，若天之行用四時也。" }
      - { type: z, text: "正義曰：“利涉大川，往有事也”者，釋“利涉大川”也。蠱者有為之時，拔拯危難，往當有事，故“利涉大川”。此則假外象以喻危難也。“先甲三日，後甲三日，終則有始天行”者，釋“先甲三日，後甲三日”之義也。民之犯令，告之巳終，更復從始，告之殷勤不巳，若天之行，四時既終，更復從春為始，象天之行，故云“天行也”。○注“蠱者”至“四時也”。○正義曰：“蠱者有事待能之時”者，物既蠱壞，須有事營為，所作之事，非賢能不可。故《經》云“幹父之蠱”，幹則能也。“甲者創制之令”者。甲為十日之首，創造之令為在後諸令之首，故以創造之令謂之為甲。故漢時謂令之重者謂之“甲令”，則此義也。“創制不可責之以舊”者，以人有犯令而致罪者，不可責之舊法，有犯則刑。故須先後三日，殷勤語之，使曉知新令，而後乃誅，誅謂兼通責讓之罪，非專謂誅殺也。" }
      - { type: j, text: "《象》曰：山下有風，蠱。君子以振民育德。蠱者，有事而待能之時也，故君子以濟民養德也。" }
      - { type: z, text: "正義曰：必云“山下有風”者，風能搖動，散佈潤澤。今“山下有風”，取君子能以恩澤下振於民，育養以德。“振民”，象“山下有風”；“育德”象山在上也。" }
      - { type: j, text: "初六：幹父之蠱，有子，考無咎，厲終吉。處事之首，始見任者也。以柔巽之質，幹父之事，能承先軌，堪其任者也，故曰“有子”也。任為事首，能堪其事，“考”乃無咎也，故曰“有子考無咎”也。當事之首，是以危也。能堪其事，故“終吉”。" }
      - { type: z, text: "“初六”至“厲終吉”。○正義曰：“幹父之蠱”者，處事之首，以柔巽之質幹父之事，堪其任也。“有子考無咎”者，有子既能堪任父事，“考”乃“無咎”也。以其處事之初，若不堪父事，則“考”有咎也。“厲終吉”者，厲，危也。既為事初，所以危也。能堪其事，所以“終吉”也。" }
      - { type: j, text: "《象》曰：“幹父之蠱”，意承“考”也。幹事之首，時有損益，不可盡承，故意承而已。" }
      - { type: z, text: "正義曰：釋“幹父之蠱”義。凡堪幹父事，不可小大損益一依父命，當量事制宜以意承考而巳。對文父沒稱“考”，若散而言之，生亦稱“考”。若《康誥》云：“大傷厥考心。”是父在稱考。此避幹父之文，故變云“考也”。" }
      - { type: j, text: "九二：幹母之蠱，不可貞。居於內中，宜幹母事，故曰“幹母之蠱”也。婦人之性難可全正，宜屈已剛。既幹且順，故曰“不可貞”也。幹不失中，得中道也。" }
      - { type: z, text: "正義曰：居內處中，是幹母事也。“不可貞”者，婦人之性難可全正，宜屈己剛，不可固守貞正，故云“不可貞”也。" }
      - { type: j, text: "《象》曰：“幹母之蠱”，得中道也。" }
      - { type: z, text: "正義曰：“得中道”者，釋“幹母之蠱”義。雖不能全正，猶不失在中之道，故云“得中道”也。" }
      - { type: j, text: "九三：幹父之蠱，小有悔，無大咎。以剛幹事，而無其應，故“有悔”也。履得其位，以正幹父，雖“小有悔”，終無大咎。" }
      - { type: z, text: "正義曰：“幹父之蠱小有悔”者，以剛幹事而無其應，故“小有悔”也。“無大咎”者，履得其位，故終無大咎也。" }
      - { type: j, text: "《象》曰：“幹父之蠱”，終無咎也。" }
      - { type: j, text: "六四：裕父之蠱，往見吝。體柔當位，幹不以剛而以柔和，能裕先事者也。然無其應，往必不合，故曰“往見吝”。" }
      - { type: z, text: "“《象》曰”至“見吝”。○正義曰：“裕父之蠱”者，體柔當位，幹不以剛，而以柔和能容裕父之事也。“往見吝”者，以其無應，所往之處，見其鄙吝，故“往未得”也。" }
      - { type: j, text: "《象》曰：“裕父之蠱”，往未得也。" }
      - { type: j, text: "六五：幹父之蠱，用譽。以柔處尊，用中而應，承先以斯，用譽之道也。" }
      - { type: z, text: "“《象》曰”至“用譽”。○正義曰：“幹父之蠱用譽”者，以柔處尊，用中而應，以此承父，用有聲譽。" }
      - { type: j, text: "《象》曰：“幹父用譽”，承以德也。以柔處中，不任威力也。" }
      - { type: z, text: "正義曰：釋“幹父用譽”之義。奉承父事，唯以中和之德，不以威力，故云“承以德”也。" }
      - { type: j, text: "上九：不事王侯，高尚其事。最處事上而不累於位，“不事王侯，高尚其事”也。" }
      - { type: z, text: "正義曰：最處事上，不復以世事為心，不系累於職位，故不承事王侯，但自尊高慕尚其清虛之事，故云“高尚其事”也。" }
      - { type: j, text: "《象》曰：“不事王侯”，志可則也。" }
      - { type: z, text: "正義曰：釋“不事王侯”之義。身既不事王侯，志則清虛高尚，可法則也。" }
      - { type: j, text: "兌下坤上。臨：元亨利貞。至於八月有兇。" }
      - { type: z, text: "“臨元亨”至“有兇”。○正義曰：案《序卦》云：“臨，大也。”以陽之浸長，其德壯大，可以監臨於下。故曰“臨”也。剛既浸長，說而且順，又以剛居中，有應於外大，得亨通而利正也，故曰“元亨利貞”也。“至於八月有兇”者，以物盛必衰，陰長陽退，臨為建醜之月，從建醜至於七月建申之時，三陰既盛，三陽方退，小人道長，君子道消，故八月有兇也。以盛不可終保，聖人作《易》以戒之也。" }
      - { type: j, text: "《彖》曰：臨，剛浸而長，說而順，剛中而應，大亨以正，天之道也。陽轉進長，陰道日消，君子日長，小人日憂，“大亨以正”之義。" }
      - { type: z, text: "“《彖》曰”至“天之道也”。○正義曰：“臨剛浸而長說而順”者，此釋卦義也。凡諸卦之例，說而順之，下應以“臨”字結之。此無“臨”字者，以其剛中而應，亦是“臨”義，故不得於剛中之上而加“臨”也。“剛中而應，大亨以正，天之道”者，天道以剛居中而下，與地相應，使物大得亨通而利正，故《乾卦》“元、亨、利、貞”。今此《臨》卦，其義亦然，故云“天之道也”。" }
      - { type: j, text: "至於八月有兇，消不久也。八月陽衰而陰長，小人道長，君子道消也，故曰“有兇”。" }
      - { type: z, text: "“至於八月”至“久也”。○正義曰：證“有兇”之義，以其陽道既消，不可常久，故“有兇”也。但復卦一陽始復，剛性尚微，又不得其中，故未有“元亨利貞”。泰卦三陽之時，三陽在下，而成乾體，乾下坤上，象天降下，地升上，上下通泰，物通則失正，故不具四德。唯此卦二陽浸長，陽浸壯大，特得稱臨，所以四德具也。然陽長之卦，每卦皆應“八月有兇”。但此卦名臨，是盛大之義，故於此卦特戒之耳。若以類言之，則陽長之卦，至其終末皆有兇也。○注“八月”至“有兇”。○正義曰：云“八月”者，何氏云：“從建子陽生至建未為八月。”褚氏云：“自建寅至建酉為八月。”今案：此注云“小人道長，君子道消”，宜據否卦之時，故以臨卦建醜，而至否卦建申為八月也。" }
      - { type: j, text: "《象》曰：澤上有地，臨。君子以教思無窮，容保民無疆。相臨之道，莫若說順也。不恃威制，得物之誠，故物無違也。是以“君子教思無窮，容保民無疆”也。" }
      - { type: z, text: "“《象》曰”至“無疆”。○正義曰：“澤上有地”者，欲見地臨於澤，在上臨下之義，故云“澤上有地”也。“君子以教思無窮”者，君子於此臨卦之時，其下莫不喜說和順，在上但須教化，思念無窮巳也，欲使教恆不絕也。“容保民無疆”者，容謂容受也。保安其民，無有疆境，象地之闊遠，故云“無疆”也。" }
      - { type: j, text: "初九：鹹臨，貞吉。“鹹”感也。感，應也。有應於四，感以臨者也。四履正位，而已應焉，志行正者也。以剛感順，志行其正，以斯臨物，正而獲吉也。" }
      - { type: z, text: "正義曰：鹹，感也。有應於四，感之而臨，志行得正，故“貞吉”也。" }
      - { type: j, text: "《象》曰：“鹹臨貞吉”，志行正也。" }
      - { type: z, text: "正義曰：“鹹臨貞吉，志行正”者，釋“鹹臨貞吉”之義。四既履得正位，己往與之相應，是己之志意行而歸正也。" }
      - { type: j, text: "九二：鹹臨，吉，無不利。有應在五，感以臨者也。剛勝則柔危，而五體柔，非能同斯志者也。若順於五，則剛德不長，何由得“吉無不利”乎？全與相違，則失於感應，其得“鹹臨，吉無不利”，必未順命也。" }
      - { type: z, text: "正義曰：“鹹臨吉”者，鹹，感也。有應於五，是感以臨而得其吉也。“無不利”者，二雖與五相應，二體是剛，五體是柔，兩雖相感，其志不同。若純用剛往，則五所不從，若純用柔往，又損已剛性，必須商量事宜，有從有否，乃得“無不利”也。" }
      - { type: j, text: "《象》曰：“鹹臨，吉，無不利”，未順命也。" }
      - { type: z, text: "正義曰：“未順命”者，釋“無不利”之義。未可盡順五命，須斟酌事宜，有從有否，故得“無不利”也。則君臣上下獻可替否之義也。" }
      - { type: j, text: "六三：甘臨，無攸利。既憂之，無咎。甘者，佞邪說媚不正之名也。履非其位，居剛長之世，而以邪說臨物，宜其“無攸利”也。若能盡憂其危，改脩其道，剛不害正，故“咎不長”。" }
      - { type: z, text: "正義曰：“甘臨”者，謂甘美諂佞也。履非其位，居剛長之世，而以邪說臨物，故“無攸利”也。“既憂之無咎”者，既，盡也。若能盡憂其危，則剛不害正，故“無咎”也。" }
      - { type: j, text: "《象》曰：“甘臨”，位不當也。“既憂之”，咎不長也。" }
      - { type: z, text: "正義曰：“既憂之，咎不長”者，能盡憂其事，改過自脩，其咎則止，不復長久，故“無咎”也。" }
      - { type: j, text: "六四：至臨，無咎。處順應陽，不忌剛長，而乃應之，履得其位，盡其至者也。剛勝則柔危，柔不失正，乃得“無咎”也。" }
      - { type: z, text: "正義曰：履順應陽，不畏剛長，而巳應之，履得其位，能盡其至極之善而為臨，故云“至臨”。以柔不失正，故“無咎”也。" }
      - { type: j, text: "《象》曰：“至臨，無咎”，位當也。" }
      - { type: z, text: "正義曰：釋“無咎”之義。以六四以陰所居得正，柔不為邪，位當其處，故無咎也。" }
      - { type: j, text: "六五：知臨，大君之宜，吉。處於尊位，履得其中，能納剛以禮，用建其正，不忌剛長而能任之，委物以能而不犯焉，則聰明者竭其視聽，知力者盡其謀能，不為而成，不行而至矣。“大君之宜”，如此而已，故曰“知臨大君之宜吉”也。" }
      - { type: z, text: "正義曰：“處於尊位，履得其中，能納剛以禮，用建其正，不忌剛長而能任之”，故“聰明者竭其視聽，知力者盡其謀能”，是知為臨之道，大君之所宜以吉也。" }
      - { type: j, text: "《象》曰：“大君之宜”，行中之謂也。" }
      - { type: z, text: "正義曰：釋“大君之宜”，所以得宜者，止由六五處中，行此中和之行，致得“大君之宜”，故言“行中之謂也”。" }
      - { type: j, text: "上六：敦臨，吉，無咎。處坤之極，以敦而臨者也。志在助賢，以敦為德，雖在剛長，剛不害厚，故“無咎”也。" }
      - { type: z, text: "正義曰：敦，厚也。上六處坤之上，敦厚而為臨，志在助賢，以敦為德，故云“敦臨，吉”。雖在剛長，而志行敦厚，剛所以不害，故“無咎”也。" }
      - { type: j, text: "象曰：“敦臨”之吉，志在內也。" }
      - { type: z, text: "正義曰：釋“敦臨吉”之義。雖在上卦之極，志意恆在於內之二陽，意在助賢，故得吉也。" }
      - { type: j, text: "坤下巽上。觀：盥而不薦，有孚顒若。王道之可觀者，莫盛乎宗廟。宗廟之可觀者，莫盛於盥也。至薦簡略，不足復觀，故觀盥而不觀薦也。孔子曰：“禘自既灌而往者，吾不欲觀之矣。”盡夫觀盛，則“下觀而化”矣。故觀至盥則“有孚顒若”也。" }
      - { type: z, text: "“觀盥而”至“顒若”。○正義曰：“觀”者，王者道德之美而可觀也，故謂之觀。“觀盥而不薦”者，可觀之事，莫過宗廟之祭盥，其禮盛也。薦者，謂既灌之後，陳薦籩豆之事，故云“觀盥而不薦”也。“有孚顒若”者，孚，信也。但下觀此盛禮，莫不皆化，悉有孚信而顒然，故云“有孚顒若”。○注“王道之可觀”至“有孚顒若也”。○正義曰：“盡夫觀盛則下觀而化”者，“觀盛”謂觀盥禮盛則休而止，是觀其大，不觀其細，此是下之效上，因“觀”而皆化之矣。故“觀至盥則有孚顒若”者，顒是嚴正之貌，“若”為語辭，言“下觀而化”，皆孚信容貌儼然也。" }
      - { type: j, text: "《彖》曰：大觀在上，下賤而上貴也。" }
      - { type: z, text: "正義曰：謂大為在下，所觀唯在於上，由在上既貴，故在下大觀。今大觀在於上。" }
      - { type: j, text: "順而巽，中正以觀天下，觀。“盥而不薦，有孚顒若”，下觀而化也。觀天之神道，而四時不忒。聖人以神道設教，而天下服矣。統說觀之為道，不以刑制使物，而以觀感化物者也。神則無形者也。不見天之使四時，“而四時不忒”，不見聖人使百姓，而百姓自服也。" }
      - { type: z, text: "“順而巽”至“天下服矣”。○正義曰：順而和巽，居中得正，以觀於天下，謂之“觀”也。此釋觀卦之名。“觀盥而不薦，有孚顒若，下觀而化”者，釋“有孚顒若”之義，本由在下，觀效在上而變化，故“有孚顒若”也。“觀天之神道而四時不忒”者，此盛名觀卦之美，言“觀盥”與天之神道相合，觀此天之神道而四時不有差忒。“神道”者，微妙無方，理不可知，目不可見，不知所以然而然，謂之“神道”，而四時之節氣見矣。豈見天之所為，不知從何而來邪？蓋四時流行，不有差忒，故云“觀天之神道而四時不忒”也。“聖人以神道設教，而天下服矣”者，此明聖人用此天之神道，以“觀”設教而天下服矣。天既不言而行，不為而成，聖人法則天之神道，本身自行善，垂化於人，不假言語教戒，不須威刑恐逼，在下自然觀化服從，故云“天下服矣”。" }
      - { type: j, text: "《象》曰：風行地上，觀。先王以省方觀民設教。" }
      - { type: z, text: "正義曰：“風行地上”者，風主號令行於地上，猶如先王設教在於民上，故云“風行地上觀”也。“先王以省方觀民設教”者，以省視萬方，觀看民之風俗，以設於教，非諸侯以下之所為，故云“先王”也。" }
      - { type: j, text: "初六：童觀，小人無咎，君子吝。處於觀時，而最遠朝美，體於陰柔，不能自進，無所鑑見，故曰“童觀”。巽順而巳，無所能為，小人之道也，故曰“小人無咎”。君子處大觀之時而為“童觀”，不亦鄙乎？" }
      - { type: z, text: "正義曰：“童觀”者，處於觀時而最遠朝廷之美觀，是柔弱不能自進，無所鑑見，唯如童稚之子而觀之。為“小人無咎君子吝”者，為此觀看，趣在順從而巳，無所能為，於小人行之，才得無咎，若君子行之，則鄙吝也。" }
      - { type: j, text: "象曰：“初六童觀”，小人道也。" }
      - { type: j, text: "六二：闚觀，利女貞。處在於內，無所鑑見。體性柔弱，從順而巳。猶有應焉，不為全蒙，所見者狹，故曰“闚觀”。居觀得位，柔順寡見，故曰“利女貞”，婦人之道也。處“大觀”之時，居中得位，不能大觀廣鑑，闚觀而巳，誠“可醜”也。" }
      - { type: z, text: "“象曰”至“利女貞”。○正義曰：“闚觀利女貞”者，既是陰爻，又處在卦內，性又柔弱，唯闚竊而觀。如此之事，唯利女之所貞，非丈夫所為之事也。注“處在於內”至“誠可醜也”。○正義曰：“猶有應焉，不為全蒙”者，六二以柔弱在內，猶有九五剛陽與之為應，則為有闚竊，不為全蒙。童蒙如初六也，故能闚而外觀。此童“觀”、闚“觀”，皆讀為去聲也。" }
      - { type: j, text: "《象》曰：“闚觀，女貞”，亦可醜也。" }
      - { type: j, text: "六三：觀我生進退。居下體之極，處二卦之際，近不比尊，遠不“童觀”，觀風者也。居此時也，可以“觀我生進退”也。" }
      - { type: z, text: "“象曰”至“進退”。○正義曰：“觀我生進退”者，“我生”，我身所動出。三居下體之極，是有可進之時；又居上體之下，復是可退之地。遠則不為童觀，近則未為觀國，居在進退之處，可以自觀我之動出也。故時可則進，時不可則退，觀風相幾，未失其道，故曰“觀我生進退”也。道得名“生”者，道是開通生利萬物。故《系辭》云“生生之謂易”，是道為“生”也。" }
      - { type: j, text: "《象》曰：“觀我生進退”，未失道也。處進退之時，以觀進退之幾，“未失道”也。" }
      - { type: j, text: "六四：觀國之光，利用賓於王。居觀之時，最近至尊，“觀國之光”者也。居近得位，明習國儀者也，故曰“利用賓於王”也。" }
      - { type: z, text: "正義曰：最近至尊，是“觀國之光”。“利用賓於王”者，居在親近而得其位，明習國之禮儀，故曰利用賓於王庭也。" }
      - { type: j, text: "《象》曰：“觀國之光”，尚賓也。" }
      - { type: z, text: "正義曰：釋“觀國之光”義。以居近至尊之道，志意慕尚為王賓也。" }
      - { type: j, text: "九五：觀我生，君子無咎。居於尊位，為觀之主，宣弘大化，光於四表，觀之極者也。上之化下，猶風之靡草，故觀民之俗，以察己道，百姓有罪，在於一人。君子風著，己乃“無咎”。上為觀主，將欲自觀乃觀民也。" }
      - { type: z, text: "正義曰：九五居尊，為觀之主。四海之內，由我而觀，而教化善，則天下有君子之風；教化不善，則天下著小人之俗，故則民以察我道，有君子之風著，則無咎也。故曰：“觀我生，君子無咎”也。" }
      - { type: j, text: "《象》曰：“觀我生”，觀民也。" }
      - { type: z, text: "正義曰：謂觀民以觀我，故觀我即觀民也。" }
      - { type: j, text: "上九：觀其生，君子無咎。“觀我生”，自觀其道也。“觀其生”，為民所觀者也。不在於位，最處上極，高尚其志，為天下所觀者也。處天下所觀之地，可不慎乎？故君子德見，乃得“無咎”。“生”，猶動出也。" }
      - { type: z, text: "“上九”至“無咎”。○正義曰：“觀其生”者，最處上極，高尚其志，生亦道也。為天下觀其巳之道，故云“觀其生”也。“君子無咎”者，既居天下可觀之地，可不慎乎？故居子謹慎，乃得“無咎”也。注“觀我生”至“動出也”。○正義曰：“生猶勸出”者，或動、或出，是生長之義。故云“生猶動出”。六三、九五皆云“觀我生”，上九云“觀其生”，此等云“生”皆為“動出”，故於卦末，《注》總明之也。" }
      - { type: j, text: "《象》曰：“觀其生”，志未平也。將處異地，為眾所觀，不為平易，和光流通，“志未平”也。" }
      - { type: z, text: "正義曰：釋“觀其生”之義。以特處異地，為無所觀，不為平易。和光流通，志未與世俗均平。世無危懼之憂，我有符同之慮，故曰“志未平”也。" }
      - { type: j, text: "震下離上。噬嗑：亨。利用獄。噬，齧也；嗑，合也。凡物之不親，由有間也。物之不齊，由有過也。有間與過，齧而合之，所以通也。刑剋以通，獄之利也。" }
      - { type: z, text: "正義曰：“噬嗑亨”者，噬，齧也；嗑，合也。物在於口，則隔其上下，若齧去其物，上下乃合而得“亨”也。此卦之名，假借口象以為義，以喻刑法也。凡上下之間，有物間隔，當須用刑法去之，乃得亨通，故云“噬嗑亨”也。“利用獄”者，以刑除間隔之物，故“利用獄”也。" }
      - { type: j, text: "《彖》曰：頤中有物，曰“噬嗑”。頤中有物，齧而合之，“噬嗑”之義也。" }
      - { type: z, text: "正義曰：此釋“噬嗑”名也。案：諸卦之《彖》，先標卦名，乃復言曰某卦、曰同人、曰大有、曰小畜之類是也。此發首不疊卦名者，若義幽隱者，先出卦名，後更以卦名結之，若具義顯露，則不先出卦名，則此“頤中有物曰噬嗑”之類，其事可知，故不先出卦名。此乃夫子因義理文勢，隨義而發，不為例也。" }
      - { type: j, text: "噬嗑而亨。有物有間，不齧不合，無由“亨”也。" }
      - { type: z, text: "正義曰：釋“亨”義，由“噬嗑”而得“亨”也。" }
      - { type: j, text: "剛柔分動而明，雷電合而章。剛柔分動，不溷乃明，雷電併合，不亂乃章，皆“利用獄”之義。" }
      - { type: z, text: "“剛柔分動”至“合而章”。正義曰：釋“利用獄”之義。剛柔既分，不相溷雜，故動而顯明也。雷電既合，而不錯亂，故事得彰著，明而且著，可以斷獄。剛柔分謂震剛在下，離柔在上。“剛柔”云“分”，“雷電”云“合”者，欲見“明”之與“動”，各是一事，故“剛柔”云“分”也。明、動雖各一事，相須而用，故“雷電”云“合”。但易之為體，取象既多。若取分義，則云“震下離上”。若取合義，則云離、震合體，共成一卦也。此釋二象“利用獄”之義也。○注“剛柔分動”至“用獄之義”。○正義曰：“雷電併合，不亂乃章”者，《彖》文唯云“雷電合”，注云“不亂乃章”者，不亂之文，以其上云“剛柔分”。“剛柔分”則是不亂，故云“雷電併合，不亂乃章”也。" }
      - { type: j, text: "柔得中而上行，雖不當位，“利用獄”也。謂五也。能為齧合而通，必有其主，五則是也。“上行”謂所之在進也。凡言“上行”，皆所之在貴也。雖不當位，不害用獄也。" }
      - { type: z, text: "“柔得中”至“用獄也”。○正義曰：此釋爻有“利用獄”之義。陰居五位，是“柔得中”也。而“上行”者既居上卦，意在向進，故云“上行”。其德如此，雖不當位者，所居陰位，猶“利用獄”也。○注“謂五也”至“不害用獄也”。正義曰：凡言“上行”，皆所之在貴者，輔嗣此注，恐畏之適五位則是上行，故於此明之。凡言“上行”，但所之在進，皆曰“上行”，不是唯向五位，乃稱“上行”也。故《謙卦》序《彖》云：“地道卑而上行”，坤道體在上，故總云“上行”，不止也。又《損卦·彖》云：“損下益上曰上行。”是減下卦益上卦，謂之“上行”，是亦不據五也。然則此云“上行”，及《晉卦·彖》云“上行”，既在五位而又稱上行，則似若王者，雖見在尊位，猶意在欲進，仰慕三皇五帝可貴之道，故稱“上行”者也。" }
      - { type: j, text: "《象》曰：“雷電”“噬嗑”，先王以明罰敕法。" }
      - { type: z, text: "正義曰：“雷電噬嗑”者，但噬嗑之象，其象在口。雷電非噬嗑之體，但“噬嗑”象外物，既有雷電之體，則雷電欲取明罰敕法，可畏之義，故連云“雷電”也。" }
      - { type: j, text: "初九：屨校滅趾，無咎。居無位之地以處刑初，受刑而非治刑者也。凡過之所始，必始於微，而後至於著。罰之所始，必始於薄，而後至於誅。過輕戮薄，故“屨校滅趾”，桎其行也。足懲而巳，故不重也。過而不改，乃謂之過。小懲大誡，乃得其福，故“無咎”也。“校”者，以木絞校者也，即械也，校者取其通名也。" }
      - { type: z, text: "“初九”至“無咎”。○正義曰：“屨校滅趾”者，屨謂著而履踐也，校謂所施之械也。處刑之初，居無位之地，是“受刑”之人，“非治刑”之主。“凡過之所始，必始於微”，積而不已，遂至於著。“罰之所始”，必始於薄刑。薄刑之不巳，遂至於誅。在刑之初，過輕戮薄，必校之在足，足為懲誡，故不復重犯。故校之在足，巳沒其趾，桎其小過，誡其大惡，過而能改，乃是其福。雖復“滅趾”，可謂“無咎”，故言“屨校滅趾無咎”也。" }
      - { type: j, text: "《象》曰：“屨校滅趾”，不行也。過止於此。" }
      - { type: z, text: "正義曰：釋“屨校滅趾”之義，猶著校滅沒其趾也。小懲大誡，故罪過止息不行也。" }
      - { type: j, text: "六二：噬膚滅鼻，無咎。噬，齧也。齧者，刑剋之謂也。處中得位，所刑者當，故曰“噬膚”也。乘剛而刑，未盡順道，噬過其分，故“滅鼻”也。刑得所疾，故雖“滅鼻”而“無咎”也。“膚”者，柔脆之物也。" }
      - { type: z, text: "正義曰：六二處中得位，是用刑者。所刑中當，故曰“噬膚”。膚是柔脆之物，以喻服罪受刑之人也。“乘剛而刑，未盡順道，噬過其分”，故至“滅鼻”，言用刑大深也。“無咎”者，用刑得其所疾，謂刑中其理，故“無咎”也。" }
      - { type: j, text: "《象》曰：“噬膚滅鼻”，乘剛也。" }
      - { type: z, text: "正義曰：“乘剛”者，釋“噬膚滅鼻”之義，以其乘剛，故用刑深也。" }
      - { type: j, text: "六三：噬臘肉，遇毒，小吝無咎。處下體之極，而履非其位，以斯食物，其物必堅。豈唯堅乎？將遇其毒。“噬”以喻刑人，“臘”以喻不服，“毒”以喻怨生。然承於四而不乘剛，雖失其正，刑不侵順，故雖“遇毒，小吝無咎”。" }
      - { type: z, text: "正義曰：“噬臘肉”者，“臘”是堅剛之肉也。“毒”者，苦惡之物也。三處下體之上，失政刑人，刑人不服。若齧其“臘肉”，非但難齧，亦更生怨咎，猶噬臘而難入，復遇其毒味然也。三以柔不乘剛，刑不侵順道，雖有遇毒之吝，於德亦無大咎，故曰：“噬臘肉遇毒，小吝無咎”也。" }
      - { type: j, text: "《象》曰：“遇毒”，位不當也。" }
      - { type: z, text: "正義曰：“位不當”者，謂處位不當也。" }
      - { type: j, text: "九四：噬乾胏，得金矢。利艱貞吉。雖體陽爻，為陰之主，履不獲中，而居其非位，以斯噬物，物亦不服，故曰“噬乾胏”也。金，剛也，矢，直也。“噬乾胏”而得剛直，可以利於艱貞之吉，未足以盡通理之道也。" }
      - { type: z, text: "正義曰：“噬乾胏”者，乾胏是臠肉之乾者，履不獲中，居其非位，以斯治物，物亦不服，猶如“噬乾胏”然也。“得金矢”者，金，剛也。矢，直也。雖刑不能服物，而能得其剛直也。“利艱貞吉”者，既得剛直，利益艱難，守貞正之吉，猶未能光大通理之道，故《象》云“未光”也。" }
      - { type: j, text: "《象》曰：“利艱貞吉”，未光也。" }
      - { type: j, text: "六五：噬乾肉，得黃金，貞厲無咎。乾肉，堅也。黃，中也。金，剛也。以陰處陽，以柔乘剛，以噬於物，物亦不服，故曰：“噬乾肉”也。然處得尊位，以柔乘剛而居於中，能行其戮者也。履不正而能行其戮，剛勝者也。噬雖不服，得中而勝，故曰“噬乾肉得黃金”也。己雖不正，而刑戮得當，故雖“貞厲”而“無咎”也。" }
      - { type: z, text: "“《象》曰”至“貞厲無咎”。○正義曰：“噬乾肉”者，乾肉，堅也。以陰處陽，以柔乘剛，以此治罪於人，人亦不服，如似“噬乾肉”也。“得黃金”者，黃，中也。金，剛也。以居於中是黃也，“以柔乘剛”是金也。既中而行剛，“能行其戮，剛勝者”也。故曰“得黃金”也。“貞厲無咎”者，巳雖不正，刑戮得當，故雖貞正自危而無咎害。位雖不當，而用刑得當，故《象》云“得當”也。" }
      - { type: j, text: "《象》曰：“貞厲無咎”，得當也。" }
      - { type: j, text: "上九：何校滅耳，兇。處罰之極，惡積不改者也。罪非所懲，故刑及其首，至於“滅耳”，及首非誡，“滅耳”非懲，兇莫甚焉。" }
      - { type: z, text: "“《象》曰”至“滅耳兇”。正義曰：“何校滅耳兇”者，“何”謂簷何，處罰之極，惡積不改，故罪及其首，何簷枷械，滅沒於耳，以至誥沒。以其聰之不明，積惡致此，故《象》云“聰不明”也。○注“處罰之極”至“兇莫甚焉”。○正義曰：“罪非所懲”者，言其惡積既深，尋常刑罪，非能懲誡，故云“罪非所懲”也。“及首非誡，滅耳非懲”者，若罪未及首，猶可誡懼歸善也。罪巳“及首”，性命將盡，非復可誡，故云“及首非誡”也。校既“滅耳”，將欲刑殺，非可懲改，故云“滅耳非懲”也。" }
      - { type: j, text: "《象》曰：“何校滅耳”，聰不明也，聰不明，故不慮惡積，至於不可解也。" }
      - { type: j, text: "離下艮上。賁：亨。小利有攸往。" }
      - { type: z, text: "正義曰：“賁”飾也。以剛柔二象交相文飾也。“賁亨”者，以柔來文剛而得亨通，故曰“賁亨”也。“小利有攸往”者，以剛上文柔，不得中正，故不能大有所往，故云“小利有攸往”也。" }
      - { type: j, text: "《彖》曰：賁“亨”，柔來而文剛，故“亨”。分剛上而文柔，故“小利有攸往”。剛柔不分，文何由生？故坤之上六來居二位，“柔來文剛”之義也。柔來文剛，居位得中，是以“亨”。乾之九二，分居上位，分剛上而文柔之義也。剛上文柔，不得中位，不若柔來文剛，故“小利有攸往”" }
      - { type: z, text: "“《彖》曰”至“有攸往”。○正義曰：“賁亨柔來而文剛故亨”者，此釋“賁亨”之義。不直言“賁”連云“賁亨”者，由“賁”而致亨，事義相連也，若“大哉乾元”以“元”連“乾”者也。“柔來而文剛，故亨”，柔來文剛，以文相飾，是賁義也。相飾即有為亨，故云“賁亨”。“亨”之下不重，以“賁”字結之者，以“亨”之與“賁”相連而釋，所以“亨”下不得重結“賁”字。分剛上而文柔，故“小利有攸往”者，釋“小利有攸往”義。乾體在下，今分乾之九二，上向文飾坤之上六，是“分剛上而文柔”也。棄此九二之中，往居無立之地，棄善從惡，往無大利，故“小利有攸往”也。○注“剛柔不分”至“小利有攸往”。○正義曰：坤之上六，何以來居二位不居於初三，乾之九二，何以分居上位不居於五者，乾性剛亢，故以巳九二居坤極；坤性柔順，不為物首，故以巳上六下居乾之二位也。且若柔不分居乾二，剛不分居坤極，則不得文明以止故也。又陽本在上，陰本在下，應分剛而下，分柔而上，何因分剛向上，分柔向下者，今謂此本泰卦故也。若天地交泰，則剛柔得交。若乾上坤下，則是天地否閉，剛柔不得交，故分剛而上，分柔而下也。" }
      - { type: j, text: "剛柔交錯，天文也。剛柔交錯而成文焉，天之文也。" }
      - { type: z, text: "正義曰：天之為體，二象剛柔，剛柔交錯成文，是天文也。" }
      - { type: j, text: "文明以止，人文也。止物不以威武而以文明，人之文也。" }
      - { type: z, text: "正義曰：文明，離也；以止，艮也。用此文明之道，裁止於人，是人之文德之教，此賁卦之象。既有天文、人文，欲廣美天文、人文之義，聖人用之以治於物也。" }
      - { type: j, text: "觀乎“天文”，以察時變；觀乎“人文”，以化成天下。觀天之文，則時變可知也；觀人之文，則化成可為也。" }
      - { type: z, text: "正義曰：“觀乎天文，以察時變”者，言聖人當觀視天文，剛柔交錯，相飾成文，以察四時變化。若四月純陽用事，陰在其中，靡草死也。十月純陰用事，陽在其中，齊麥生也。是觀剛柔而察時變也。“觀乎人文以化成天下”者，言聖人觀察人文，則《詩》、《書》、《禮》、《樂》之謂，當法此教而“化成天下”也。" }
      - { type: j, text: "《象》曰：山下有火，賁。君子以明庶政，無敢折獄。處賁之時，止物以文明，不可以威刑，故“君子以明庶政”，而“無敢折獄”。" }
      - { type: z, text: "正義曰：“山下有火賁”者，欲見火上照山，有光明文飾也。又取山含火之光明，象君子內含文明，以理庶政，故云“山有火賁”也。“以明庶政”者，用此文章明達以治理庶政也。“無敢折獄”者，勿得直用果敢，折斷訟獄。" }
      - { type: j, text: "初九：賁其趾，舍車而徒。在賁之始，以剛處下，居於無位，棄於不義，安夫徒步以從其志者也。故飾其趾，舍車而徒，義弗乘之謂也。" }
      - { type: z, text: "正義曰：在《賁》之始，以剛處下，居於無位之地，乃棄於不義之車，而從有義之徒步，故云“舍車而徒”。以其志行高絜，不苟就輿乘，是以義不肯乘，故《象》云“義弗乘”也。" }
      - { type: j, text: "《象》曰：“舍車而徒”，義弗乘也。" }
      - { type: j, text: "六二：賁其須。得其位而無應，三亦無應，俱無應而比焉，近而相得者也。“須”之為物，上附者也。循其所履以附於上，故曰“賁其須”也。" }
      - { type: z, text: "正義曰：“賁其須”者，須是上須於面，六二常上附於三，若似賁飾其須也。循其所履，以附於上，與上同為興起，故《象》云“與上興”也。" }
      - { type: j, text: "《象》曰：“賁其須”，與上興也。" }
      - { type: j, text: "九三：賁如濡如，永貞吉。處下體之極，居得其位，與二相比，俱履其正，和合相潤，以成其文者也。既得其飾，又得其潤，故曰“賁如濡如”也。永保其貞，物莫之陵，故曰“永貞吉”也。" }
      - { type: z, text: "正義曰：“賁如濡如”者，賁如，華飾之貌。濡如，潤澤之理。居得其位，與二相比，和合文飾，而有潤澤，故曰：“賁如濡如”。其美如此，長保貞吉，物莫之陵，故《象》云：“永貞之吉，終莫之陵”也。" }
      - { type: j, text: "《象》曰：“永貞”之“吉”，終莫之陵也。" }
      - { type: j, text: "六四：賁如皤如，白馬翰如。匪寇，婚媾。有應在初而閡於三，為己寇難，二志相感，不獲通亨，欲靜則疑初之應，欲進則懼三之難，故或飾或素，內懷疑懼也。鮮絜其馬，“翰如”以待，雖履正位，未敢果其志也。三為剛猛，未可輕犯，匪寇乃婚，終無尤也。" }
      - { type: z, text: "“《象》曰永貞之吉”至“匪寇婚媾”。正義曰：“賁如皤如”者，皤是素白之色。六四有應在初，欲往從之，三為已難，故已猶豫。或以文絜，故“賁如”也；或守質素，故“皤如”也。“白馬翰如”者，但鮮絜其馬，其色“翰如”，徘徊待之，未敢輒進也。“匪寇婚媾”者，若非九三為已寇害，乃得與初為婚媾也。" }
      - { type: j, text: "《象》曰：六四當位，疑也。“匪寇，婚媾”，終無尢也。" }
      - { type: z, text: "正義曰：“六四當位疑”者，以其當位，得與初為應，但礙於三，故遲疑也。若不當位，則與初非應，何須欲往而致遲疑也？“匪寇婚媾，終無尢”者，釋“匪寇婚媾”之義。若待匪有寇難乃為婚媾，則終無尢過。若犯寇難而為婚媾，則終有尢也。" }
      - { type: j, text: "六五：賁於丘園，束帛戔戔。吝，終吉。處得尊位，為飾之主，飾之盛者也。施飾於物，其道害也。施飾丘園，盛莫大焉，故賁於束帛，丘園乃落，賁於丘園帛，乃“戔戔”。用莫過儉，泰而能約，故必“吝”焉乃得終吉也。" }
      - { type: z, text: "“六五，賁於丘園”至“終吉”。○正義曰：“賁於丘園”者，丘園是質素之處。六五“處得尊位，為飾之主”。若能施飾在於質素之處，不華侈費用，則所束之帛，“戔戔”眾多也。“吝終吉”者，初時儉約，故是其“吝”也。必儉約之“吝”，乃得“終吉”，而有喜也，故《象》云“六五之吉，有喜”也。○注“處得尊位”至“乃得終吉也”。○正義曰：“為飾之主，飾之盛者”，若宮室輿服之屬，五為飾主。若施設華飾在於輿服宮館之物，則大道損害也。“施飾丘園盛莫大焉”者，丘謂丘墟，園謂園圃。唯草木所生，是質素之處，非華美之所。若能施飾，每事質素，與丘園相似，“盛莫大焉”。故“賁於束帛，丘園乃落”者，束帛，財物也。舉束帛言之，則金銀珠玉之等皆是也。若賁飾於此束帛，珍寶則素質之道乃隕落，故云“丘園乃落”也。“賁於丘園，帛乃戔戔”者，設飾在於丘園質素之所，則不靡費財物，束帛乃“戔戔”眾多也。諸儒以為若賁飾束帛，不用聘士，則丘園之上乃落也。若賁飾丘園之士與之，故束帛乃“戔戔”也。諸家注《易》，多為此解。但今案：輔嗣之《注》全無聘賢之意，且爻之與《象》，亦無待士之文。輔嗣云：“用莫過儉，泰而能約，故必吝焉，乃得終吉。”此則普論為國之道，不尚華侈，而貴儉約也。若從先師，唯用束帛招聘丘園，以儉約待賢，豈其義也？所以漢聘隱士，或乃用羔雁玄纁，蒲輪駟馬，豈止“束帛”之間，而云儉約之事？今觀《注》意，故為此解耳。" }
      - { type: j, text: "《象》曰：六五之“吉”，有喜也。" }
      - { type: j, text: "上九：白賁，無咎。處飾之終，飾終反素，故在其質素，不勞文飾而“無咎”也。以白為飾，而無患憂，得志者也。" }
      - { type: z, text: "正義曰：“白賁無咎”者，“處飾之終”，飾終則反素，故在其質素，不勞文飾，故曰：“白賁無咎”也。守志任真，得其本性，故《象》云“上得志”也。言居上得志也。" }
      - { type: j, text: "《象》曰：“白賁無咎”，上得志也。" }
      - { type: j, text: "坤下艮上。剝：不利有攸往。" }
      - { type: z, text: "正義曰：“剝”者，剝落也。今陰長變剛，剛陽剝落，故稱“剝”也。小人既長，故“不利有攸往”也。" }
      - { type: j, text: "《彖》曰：剝，剝也，柔變剛也。“不利有攸往”，小人長也。順而止之，觀象也。君子尚消息盈虛，天行也。“坤”順而“艮”止也。所以“順而止之”，不敢以剛止者，以觀其形象也。強亢激拂，觸忤以隕身，身既傾焉。功又不就，非君子之所尚也。" }
      - { type: z, text: "“彖曰”至“天行也”。○正義曰：“剝，剝也”者，釋剝卦名為“剝”，不知何以稱“剝”，故釋云“剝”者解“剝”之義，是陰長解剝於陽也。“柔變剛”者，釋所以此卦名剝之意也。“不利有攸往，小人道長”者，此釋“不利有攸往”之義。小人道長，世既闇亂，何由可進？往則遇災，故“不利有攸往”也。“順而止之觀象”者，明在剝之時，世既無道，君子行之，不敢顯其剛直，但以柔順止約其上，唯望君上形象，量其顏色而止也。“君子尚消息盈虛天行”者，解所以在剝之時，順而止之。觀其顏色形象者，須量時制變，隨物而動。君子通達物理，貴尚消息盈虛，道消之時，行消道也，道息之時，行息道也；在盈之時，行盈道也；在虛之時，行虛道也。若值消虛之時，存身避害，“危行言遜”也。若值盈息之時，極言正諫，建事立功也。“天行”謂逐時消息盈虛，乃天道之所行也。春夏始生之時，天氣盛大，秋冬嚴殺之時，天氣消滅，故云“天行”也。○注“坤順而艮止也”至“君子之所尚也”。○正義曰：“非君子之所尚”者，不逐時消息盈虛，於無道之時，剛亢激拂，觸忤以隕身；身既傾隕，功又不就，“非君子之所尚也”。" }
      - { type: j, text: "《象》曰：山附於地，剝。上以厚下安宅。“厚下”者，無不見剝也。“安宅”者，物不失處也。“厚下安宅”，治“剝”之道也。" }
      - { type: z, text: "正義曰：“山附於地剝”者，山本高峻，今附於地，即是剝落之象，故云“山附於地剝”也。“上以厚下安宅”者，剝之為義，從下而起，故在上之人，當須豐厚於下，安物之居，以防於剝也。" }
      - { type: j, text: "初六：剝床以足，蔑貞兇。床者，人之所以安也。“剝床以足”，猶云剝床之足也。“蔑”猶削也。剝床之足，滅下之道也。下道始滅，剛隕柔長，則正削而兇來也。" }
      - { type: z, text: "正義曰：“剝床以足”者，床者人之所以安處也。在剝之初，剝道從下而起，剝床之足，言床足已“剝”也。下道始滅也。“蔑貞兇”者，蔑，削也。貞，正也。下道既蔑，則以侵削其貞正，所以“兇”也。" }
      - { type: j, text: "《象》曰：“剝床以足”，以滅下也。" }
      - { type: z, text: "正義曰：“釋剝床以足”之義。床在人下，足又在床下。今剝床之足，是盡滅於下也。" }
      - { type: j, text: "六二，剝床以辨，蔑貞兇。“蔑”猶甚極之辭也。辨者，足之上也。剝道浸長，故“剝”其辨也。稍近於“床”，轉欲滅物之所處，長柔而削正。以斯為德，物所棄也。" }
      - { type: z, text: "“六二”至“蔑貞兇”。○正義曰：“剝床以辨”者，辨，謂床身之下，無足之上，足與床身分辨之處也。今剝落侵上，乃至於“辨”，是漸近人身，故云“剝床以辨”也。“蔑貞兇”者，蔑，削也。削除中正之道，故“兇”也。初六“蔑貞”，但小削而已，六二“蔑貞”，是削之甚極，故更云“蔑貞兇”也。長此陰柔，削其正道，以此為德，則物之所棄。故《象》云“未有與”也。言無人與助之也。○注“蔑猶甚極”至“物所棄也”。○正義曰：“蔑猶甚極之辭”者，初既稱“蔑”，二又稱“蔑”，“蔑”上覆“蔑”，此為蔑甚極，故云“蔑猶甚極之辭”也。“蔑”謂微蔑，物之見削，則微蔑也，故以“蔑”為“削”。“稍近於床轉欲蔑物之處”者，物之所處謂床也。今剝道既至於辨，在床體下畔之間，是將欲滅床，故云“轉欲滅物之所處”也。" }
      - { type: j, text: "《象》曰：“剝床以辨”，未有與也。" }
      - { type: j, text: "六三：剝之，無咎。與上為應，群陰剝陽，我獨協焉，雖處於剝，可以“無咎”。" }
      - { type: z, text: "正義曰：六三與上九為應，雖在剝陽之時，獨能與陽相應，雖失位處剝而“無咎”也。" }
      - { type: j, text: "《象》曰：“剝之，無咎”，失上下也。三上下各有二陰，而二獨應於陽，則“失上下”也。" }
      - { type: z, text: "正義曰：釋所以無咎之義。上下群陰皆悉剝陽也，己獨能違失上下之情而往應之，所以“無咎”也。" }
      - { type: j, text: "六四：剝床以膚，兇。初二剝床，民所以安，未剝其身也。至四剝道浸長，床既剝盡，以及人身，小人遂盛，物將失身，豈唯削正，靡所不兇。" }
      - { type: z, text: "正義曰：四道浸長，剝床已盡，乃至人之膚體，物皆失身，所以兇也。" }
      - { type: j, text: "《象》曰：“剝床以膚”，切近災也。" }
      - { type: z, text: "正義曰：“切近災”者，其災已至，故云“切近災”也。" }
      - { type: j, text: "六五：貫魚，以宮人寵，無不利。處剝之時，居得尊位，為“剝”之主者也。“剝”之為害，小人得寵，以消君子者也。若能施寵小人，於宮人而己，不害於正，則所寵雖眾，終無尤也。“貫魚”謂此眾陰也，駢頭相次，似“貫魚”也。" }
      - { type: z, text: "正義曰：“貫魚以宮人寵”者，處得尊位，“為剝之主”，剝之為害，小人得寵以消君子。“貫魚”者，謂眾陰也。駢頭相次，似若貫穿之魚。此六五若能處待眾陰，但以宮人之寵相似。宮人被寵，不害正事，則終無尤過，無所不利，故云“無不利”。故《象》云“終無尤也”。" }
      - { type: j, text: "《象》曰：“以宮人寵”，終無尤也。" }
      - { type: j, text: "上九：碩果不食，君子得輿，小人剝廬。處卦之終，獨全不落，故果至於碩而不見食也。君子居之，則為民覆蔭；小人用之，則剝下所庇也。" }
      - { type: z, text: "正義曰：“碩果不食”者，處卦之終，獨得完全，不被剝落，猶如碩大之果，不為人食也。“君子得輿”者，若君子而居此位，能覆蔭於下，使得全安，是君子居之，則得車輿也。若小人居之，下無庇廕，在下之人，被剝徹廬舍也。" }
      - { type: j, text: "《象》曰：“君子得輿”，民所載也。“小人剝廬”，終不可用也。" }
      - { type: z, text: "正義曰：“君子得輿民所載”者，釋“得輿”之義。若君，剝徹民之廬舍，此小人終不可用為君也。" }
      - { type: j, text: "震下坤上。復：亨。出入無疾，朋來無咎。反覆其道，七日來復，利有攸往。" }
      - { type: z, text: "正義曰：“復亨”者，陽氣反覆而得亨通，故云“復亨”也。“出入無疾”者，出則剛長，入則陽反，理會其時，故無疾病也。“朋來無咎”者，朋謂陽也。反覆眾陽，朋聚而來，則“無咎”也。若非陽眾來，則有咎，以其眾陽之來，故“無咎”也。“反覆其道，七日來復”者，欲速反之與復而得其道，不可過遠。唯七日則來復，乃合於道也。“利有攸往”者，以陽氣方長，往則小人道消，故“利有攸往”也。" }
      - { type: j, text: "《彖》曰：“復，亨”，剛反動而以順行，是以“出入無疾”，入則為反，出則剛長，故“無疾”。疾猶病也。“朋來無咎”，“朋”謂陽也。" }
      - { type: z, text: "“彖曰”至“無咎”。○正義曰：“復亨”者，以陽復則亨，故以亨連復而釋之也。“剛反動而以順行”者，既上釋“復亨”之義，又下釋“出入無疾朋來無咎”之理，故云“是以出入無疾朋來無咎”也。" }
      - { type: j, text: "“反覆其道，七日來復”陽氣始剝盡至來復時，凡七日。" }
      - { type: z, text: "正義曰：“陽氣始剝盡”，謂陽氣始於剝盡之後，至陽氣來復時，凡經七日。觀《注》之意，陽氣從剝盡之後，至於反覆，凡經七日。其《注》分明。如褚氏、莊氏並云“五月一陰生，至十一月一陽生”，凡七月。而云“七日”，不云“月”者，欲見陽長鬚速，故變月言日。今輔嗣云“剝盡”至“來復”，是從盡至來復，經七日也。若從五月言之，何得云“始盡”也？又臨卦亦是陽長而言八月，今《復卦》亦是陽長，何以獨變月而稱七日？觀《注》之意，必謂不然，亦用《易緯》六日七分之義，同鄭康成之說。但於文省略，不復具言。案《易緯稽覽圖》云：“卦氣起中孚。”故離、坎、震、兌，各主其一方，其餘六十卦，卦有六爻，爻別主一日，凡主三百六十日。餘有五日四分日之一者，每日分為八十分，五日分為四百分四分日之一又為二十分，是四百二十分。六十卦分之，六七四十二卦，別各得七分，是每卦得六日七分也。剝卦陽氣之盡在於九月之末，十月當純坤用事。坤卦有六日七分。坤卦之盡，則復卦陽來，是從剝盡至陽氣來復，隔坤之一卦六日七分，舉成數言之，故輔嗣言“凡七日”也。“反覆”者，則出入之義。反謂入而倒反覆謂既反，之後復而向上也。" }
      - { type: j, text: "天行也。以天之行，反覆不過七日，復之不可遠也。" }
      - { type: z, text: "正義曰：“反覆其道，七日來復。天行”者，以天行釋“反覆其道七日來復”之義。言反之與復得合其道。唯七日而來復，不可久遠也。此是天之所行也。天之陽氣絕滅之後，不過七日，陽氣復生，此乃天之自然之理，故曰“天行”也。" }
      - { type: j, text: "“利有攸往”，剛長也。往則小人道消也。" }
      - { type: z, text: "正義曰：“以剛長”釋“利有攸往”之義也。" }
      - { type: j, text: "復，其見天地之心乎。復者，反本之謂也，天地以本為心者也。凡動息則靜，靜非對動者也。語息則默，默非對語者也。然則天地雖大，富有萬物，雷動風行，運化萬變，寂然至無，是其本矣。故動息地中，乃天地之心見也。若其以有為心，則異類未獲具存矣。" }
      - { type: z, text: "“復見天地之心乎”。○正義曰：“復其見天地之心乎”者，此贊明覆卦之義。天地養萬物，以靜為心，不為而物自為，不生而物自生，寂然不動，此天地之心也。此復卦之象，“動”息地中，雷在地下，息而不動，靜寂之義，與天地之心相似。觀此復象，乃“見天地之心”也。天地非有主宰，何得有心？以人事之心，託天地以示法爾。○注“復者反本之謂也”至“未獲具存矣”。○正義曰：“復者反本之謂也”者，往前離本處而去，今更反於本處，是“反本”之謂也。“天地以本為心”者，“本”謂靜也。言天地寂然不動，是“以本為心”者也。凡動息則靜，靜非對動者也。天地之動，靜為其本，動為其末，言靜時多也，動時少也。若暫時而動，止息則歸靜，是靜非對動，言靜之為本，自然而有，非對動而生靜，故曰“靜非對動”者也。“語息則默，默非對語”者，語則聲之動，默則口之靜，是不語之時，恆常默也。非是對語有默以動靜語默，而地別體，故云“非對”也。云“天地雖大，富有萬物，雷動風行，運化萬變”者，此言天地之動也。言“寂然至無是其本矣”者，凡有二義：一者萬物雖運動於外，而天地寂然至於其內也。外是其末，內是其本，言天地無心也。二者雖雷動風行，千化萬變，若其雷風止息，運化停住之後，亦寂然至無也。“若其以有為心，則異類未獲具存”者，凡以無為心，則物我齊致，親疏一等，則不害異類，彼此獲寧。若其以有為心，則我之自我，不能普及於物，物之自物，不能普賴於我，物則被害，故“未獲具存”也。" }
      - { type: j, text: "《象》曰：雷在地中，復。先王以至日閉關，商旅不行，後不省方。方，事也。冬至，陰之復也。夏至，陽之復也。故為復則至於寂然大靜，先王則天地而行者也。動復則靜，行復則止，事復則無事也。" }
      - { type: z, text: "“《象》曰”至“後不省方”。○正義曰：“雷在地中復”者，雷是動物，復卦以動息為主，故曰“雷在地中”。“先王以至日閉關”者，先王象此復卦，以二至之日閉塞其關，使商旅不行於道路也。“後不省方”者，方，事也。後不省視其方事也。以地掩閉於雷，故關門掩閉，商旅不行。君後掩閉於事，皆取“動息”之義。○注“方事也”至“事復則無事也”。○正義曰：“方，事”者，恐“方”是四方境域，故以“方”為事也。言至日不但不可出行，亦不可省視事也。“冬至陰之復，夏至陽之復”者，復謂反本，靜為動本。冬至一陽生，是陽動用而陰復於靜也。夏至一陰生，是陰動用而陽復於靜也。“動復則靜，行復則止，事復則無事”者，動而反覆則歸靜，行而反覆則歸止，事而反覆則歸於無事也。" }
      - { type: j, text: "初九：不遠復，無祗悔，元吉。最處復初，始復者也。復之不速，遂至迷兇，不遠而復，幾悔而反，以此修身，患難遠矣。錯之於事，其始庶幾乎？故“元吉”也。" }
      - { type: z, text: "正義曰：“不遠復”者，最處復初，是始復者也。既在陽復，即能從而復之，是迷而不遠，即能復也。“無祗悔元吉”者，韓氏云：“祗，大也。”既能速復，是無大悔，所以大吉。" }
      - { type: j, text: "《象》曰：“不遠”之復，以脩身也。" }
      - { type: z, text: "正義曰：“釋不遠之復”也。所以不遠速復者，以能脩正其身，有過則改故也。" }
      - { type: j, text: "六二：休復，吉。得位處中，最比於初。上無陽爻以疑其親，陽為仁行，在初之上而附順之，下仁之謂也。既處中位，親仁善鄰，復之休也。" }
      - { type: z, text: "正義曰：得位處中，最比於初，陽為仁行，已在其上，附而順之，是降下於仁，是休美之復，故云“休復吉”也。以其下仁，所以“吉”也。故《象》云“休復之吉，以下仁也”。" }
      - { type: j, text: "《象》曰：“休復”之吉，以下仁也。" }
      - { type: j, text: "六三：頻復，厲無咎。頻，頻蹙之貌也。處下體之終，雖愈於上六之迷，巳失復遠矣，是以蹙也。蹙而求復，未至於迷，故雖危無咎也。複道宜速，蹙而乃復，義雖無咎，它來難保。" }
      - { type: z, text: "“《象》曰休復之吉”至“無咎”。○正義曰：“頻復”者，頻謂頻蹙。六三處下體之上，去復稍遠，雖勝於上六迷復，猶頻蹙而復，複道宜速，謂蹙而求復也。去復猶近，雖有危厲，於義無咎。故《象》云“義無咎”也。注“頻蹙之貌”至“它來難保”。○正義曰：“義雖無咎，它來難保”者，去復未甚大遠，於義雖復無咎，謂以道自守，得“無咎”也。若自守之外，更有他事而來，則難可保此無咎之吉也。所以《象》云“義無咎”，守常之義得無咎也。" }
      - { type: j, text: "《象》曰：“頻復”之厲，義無咎也。" }
      - { type: j, text: "六四：中行獨復。四上下各有二陰而處厥中，履得其位而應於初，獨得所復，順道而反，物莫之犯，故曰“中行獨復”也。" }
      - { type: z, text: "“《象》曰”至“中行獨復”。○正義曰：“中行獨復”者，處於上卦之下，上下各有二陰，巳獨應初，居在眾陰之中，故云“中行”。獨自應初，故云“獨復”。從道而歸，故《象》云“以從道也”。" }
      - { type: j, text: "《象》曰：“中行獨復”，以從道也。" }
      - { type: j, text: "六五：敦復，無悔。居厚而履中，居厚則無怨，履中則可以自考，雖不足以及“休復”之吉，守厚以復，悔可免也。" }
      - { type: z, text: "正義曰：“敦復無悔”者，處坤之中，是敦厚於復，故云“敦復”。既能履中，又能自考成其行。既居敦厚物，無所怨，雖不及六二之“休復”，猶得免於悔吝，故云“無悔”也。" }
      - { type: j, text: "《象》曰：“敦復，無悔”，中以自考也。" }
      - { type: z, text: "正義曰：釋“無悔”之義。以其處中，能自考其身，故“無悔”也。" }
      - { type: j, text: "上六：迷復，兇，有災眚。用行師，終有大敗。以其國君兇，至於十年不克徵。最處復後，是迷者也。以迷求復，故曰“迷復”也。用之行師，難用有克也，終必大敗。用之於國，則反乎君道也。大敗乃復量斯勢也。雖復十年修之，猶未能徵也。" }
      - { type: z, text: "“上六迷復兇”至“不克徵”。○正義曰：“迷復兇”者，最處復後，是迷闇於復。“以迷求復”，所以“兇”也。“有災眚”者，闇於複道，必無福慶，唯有災眚也。“用行師終有大敗”者，所為既兇，故用之行師，必無克勝，唯“終有大敗”也。“以其國君兇”者，以，用也。用此迷復於其國內，則反違君道，所以兇也。“至於十年不克徵”者，師敗國兇，量斯形勢，雖至十年猶不能征伐。以其迷闇不復，而反違於君道，故《象》云“迷復之兇，反君道也”。" }
      - { type: j, text: "《象》曰：“迷復”之兇，反君道也。" }
      - { type: j, text: "震下乾上。無妄：元、亨、利、貞。其匪正有眚，不利有攸往。" }
      - { type: z, text: "正義曰：無妄者，以剛為內主，動而能健，以此臨下，物皆無敢詐偽虛妄，俱行實理，所以大得亨通，利於貞正，故曰“元亨利貞”也。“其匪正有眚不利有攸往”者，物既無妄，當以正道行之。若其匪依正道，則有眚災，不利有所往也。" }
      - { type: j, text: "《彖》曰：無妄，剛自外來而為主於內。謂震也。動而健，震動而乾健也。" }
      - { type: z, text: "正義曰：以此卦象釋能致無妄之義。以震之剛從外而來，為主於內，震動而乾健，故能使物“無妄”也。" }
      - { type: j, text: "剛中而應。謂五也。" }
      - { type: z, text: "正義曰：明爻義能致無妄。九五以剛處中，六二應之，是“剛中而應”。剛中則能制斷虛實，有應則物所順從，不敢虛妄也。" }
      - { type: j, text: "大亨以正，天之命也。剛自外來，而為主於內，動而愈健。“剛中而應”，威剛方正，私欲不行，何可以妄？使有妄之道滅，無妄之道成，非大亨利貞而何？剛自外來，而為主於內，則柔邪之道消矣。動而愈健，則剛直之道通矣。“剛中而應”，則齊明之德著矣。故“大亨以正”也。天之教命，何可犯乎？何可妄乎？是以匪正則有眚，而“不利有攸往”也。" }
      - { type: z, text: "“大亨以正，天之命也”。○正義曰：釋“元亨利貞”之義。威剛方正，私欲不行，何可以妄？此天之教命也。天道純陽，剛而能健，是乾德相似，故云“天之命”也。既是天命，豈可犯乎？○注“剛自外來”至“不利有攸往”也。○正義曰：云“使有妄之道滅，無妄之道成”者，妄，謂虛妄矯詐，不循正理。若無剛中之主，柔弱邪僻，則物皆詐妄，是有妄之道興也。今遇剛中之主，威嚴剛正，在下畏威，不敢詐妄，是有妄之道滅，無妄之道成。" }
      - { type: j, text: "“其匪正有眚，不利有攸往”。無妄之往，何之矣？天命不祐，行矣哉！匪正有眚，不求改以從正，而欲有所往，居不可以妄之時，而欲以不正有所往，將欲何之天命之所不祐，竟矣哉！" }
      - { type: z, text: "“其匪正有眚”至“天命不祐行矣哉”。○正義曰：“其匪正有眚，不利有攸往，無妄之往何之矣”者，此釋“匪正有眚不利有攸往”之義也。“無妄之往何之矣”，上“之”是語辭，下“之”是適也。身既非正，在“無妄”之世，欲有所往，何所之適矣？故云“無妄之往何之矣”。“天命不祐行矣哉”者，身既非正，欲有所往，犯違天命，則天命不祐助也。必竟行矣哉！言終竟行此不祐之事也。○注“匪正有眚”至“不祐竟矣哉”。○正義曰：“竟矣哉”者，竟謂終竟，言天所不祐，終竟行矣哉！" }
      - { type: j, text: "《象》曰：天下雷行，物與無妄。與，辭也，猶皆也。天下雷行，物皆不可以妄也。" }
      - { type: z, text: "正義曰：“天下雷行”者，雷是威恐之聲。今天下雷行，震動萬物，物皆驚肅，無敢虛妄，故云“天下雷行”，物皆“無妄”也。" }
      - { type: j, text: "先王以茂對時育萬物。茂，盛也。物皆不敢妄，然後萬物乃得各全其性，對時育物，莫盛於斯也。" }
      - { type: z, text: "正義曰：茂，盛也。對，當也。言先王以此無妄盛事，當其無妄之時，育養萬物也。此唯王者其德乃耳，非諸侯已下所能，故不云君子，而言“先王”也。案：諸卦之《象》，直言兩象，即以卦名結之，若“雷在地中，復”。今《無妄》應云：“天下雷行，無妄。”今云“物與無妄”者，欲見萬物皆無妄，故加“物與”二字也。其餘諸卦，未必萬物皆與卦名同義，故直顯象，以卦結之。至如復卦，唯陽氣復，非是萬物皆復。舉復一卦，餘可知矣。" }
      - { type: j, text: "初九：無妄往，吉。體剛處下，以貴下賤，行不犯妄，故往得其志。" }
      - { type: z, text: "正義曰：體剛居下，以貴下賤，所行教化，不為妄動，故“往吉”而得志也。" }
      - { type: j, text: "《象》曰：“無妄”之往，得志也。" }
      - { type: j, text: "六二：不耕穫，不菑畬，則利有攸往。不耕而獲，不菑而畬，代終已成而不造也。不擅其美，乃盡臣道，故“利有攸往”。" }
      - { type: z, text: "“《象》曰”至“利有攸往”。○正義曰：“不耕穫不菑畬”者，六二處中得位，盡於臣道，不敢創首，唯守其終，猶若田農不敢發首而耕，唯在後獲刈而已。不敢菑發新田，唯治其菑熟之地，皆是不為其始而成其末，猶若為臣之道，不為事始而代君有終也。則“利有攸往”者，為臣如此，則利有攸往，若不如此，則往而無利也。" }
      - { type: j, text: "《象》曰：“不耕穫”，未富也。" }
      - { type: z, text: "正義曰：釋“不耕而獲”之義。不敢前耕，但守後獲者，未敢以耕耕之與獲，俱為己事。唯為後獲，不敢先耕事。既闕初，不擅其美，故云“未富也”。" }
      - { type: j, text: "六三：無妄之災，或系之牛。行人之得，邑人之災。以陰居陽，行違謙順，是“無妄”之所以為災也。牛者稼穡之資也。二以不耕而獲，“利有攸往”，而三為不順之行，故“或系之牛”，是有司之所以為獲，彼人之所以為災也，故曰“行人之得，邑人之災”也。" }
      - { type: z, text: "“六三”至“人之災”。○正義曰：“無妄”之世，邪道不行。六三陰居陽位，失其正道，行違謙順而乖臣範，故“無妄”之所以為災矣。牛者稼穡之資。六三僣為耕事，行唱始之道，而為不順王事之行，故有司或系其牛，制之使不妄造，故曰“或系之牛”也。“行人”者，有司之義也。有司系得其牛，是“行人”制之得功，故曰“行人之得”。彼居三者，是處邑之人僣為耕事，受其災罰，故曰：“行人之得，邑人之災”也。" }
      - { type: j, text: "《象》曰：“行人”得牛，“邑人”災也。" }
      - { type: z, text: "正義曰：釋“行人之得”義也。以行人所得，謂得牛也。此則得牛，彼則為災，故云“邑人災”也。" }
      - { type: j, text: "九四：可貞，無咎。處“無妄”之時，以陽居陰，以剛乘柔，履於謙順，比近至尊，故可以任正，固有所守而“無咎”也。" }
      - { type: z, text: "正義曰：以陽居陰，以剛乘柔，履於謙順，上近至尊，可以任正，固有所守而無咎，故曰“可貞無咎”也。" }
      - { type: j, text: "《象》曰：“可貞，無咎”，固有之也。" }
      - { type: z, text: "正義曰：釋“可貞無咎”之義。所以可執貞正，言堅固有所執守，故曰“無咎”也。" }
      - { type: j, text: "九五：無妄之疾，勿藥有喜。居得尊位，為無妄之主者也。下皆“無妄”，害非所致而取藥焉，疾之甚也。非妄之災，勿治自復，非妄而藥之則兇，故曰“勿藥有喜”。" }
      - { type: z, text: "正義曰：“無妄之疾”者，凡禍疾所起，由有妄而來。今九五居得尊位，為無妄之主，下皆“無妄”，而偶然有此疾害，故云“無妄之疾”也。“勿藥有喜”者，若疾自己招，或寒暑飲食所致，當須治療。若其自然之疾，非己所致，疾當自損，勿須藥療而“有喜”也。此假病象以喻人事，猶若人主而剛正自修，身無虛妄，下亦無虛妄，而遇逢兇禍，若堯、湯之厄，災非己招，但順時修德，勿須治理，必欲除去，不勞煩天下，是“有喜”也。然堯遭洪水，使鯀、禹治之者，雖知災未可息，必須順民之心。鯀之不成，以災未息也。禹能治救，災欲盡也，是亦自然之災，“勿藥有喜”之義也。" }
      - { type: j, text: "《象》曰：無妄之藥，不可試也。藥攻有妄者也，而反攻“無妄”，故不可試也。" }
      - { type: z, text: "正義曰：解“勿藥有喜”之義。若有妄致疾，其藥可用。若身既“無妄”，自然致疾，其藥不可試也。若其試之，恐更益疾也。言非妄有災不可治也，若必欲治之，則勞煩於下，害更甚也。此非直施於人主，至於凡人之事，亦皆然也。若己之無罪，忽逢禍患，此乃自然之理，不須憂勞救護，亦恐反傷其性。" }
      - { type: j, text: "上九：無妄行，有眚，無攸利。處不可妄之極，唯宜靜保其身而已，故不可以行也。" }
      - { type: z, text: "正義曰：處不可妄之極，唯宜靜保其身。若動行，必有災眚，無所利也。位處窮極，動則致災。故《象》云：“無妄之行，窮之災也。”" }
      - { type: j, text: "《象》曰：“無妄”之行，窮之災也。" }
      - { type: j, text: "乾下艮上。大畜：利貞。不家食，吉。利涉大川。" }
      - { type: z, text: "正義曰：謂之“大畜”者，乾健上進，艮止在上，止而畜之，能畜止剛健，故曰“大畜”。《彖》云：“能止健，大正”也。是能止健，故為大畜也。小畜則巽在乾上，以其巽順，不能畜止乾之剛，故云小畜也。此則艮能止之，故為大畜也。“利貞”者，人能止健，非正不可，故“利貞”也。“不家食吉”者，己有大畜之資，當須養順賢人，不使賢人在家自食，如此乃吉也。“利涉大川”者，豐則養賢，應於天道，不憂險難，故“利涉大川”。" }
      - { type: j, text: "《彖》曰：《大畜》，剛健篤實，輝光日新其德。凡牧既厭而退者，弱也；既榮而隕者，薄也。夫能“輝光日新其德”者，唯“剛健篤實”也。" }
      - { type: z, text: "正義曰：言“大畜剛健篤實”者，此釋大畜之義，“剛健”謂乾也。乾體剛性健，故言“剛健”也。“篤實”，謂艮也。艮體靜止，故稱“篤實”也。“輝光日新其德”者，以其剛健篤實之故，故能輝耀光榮，日日增新其德。若無剛健，則劣弱也，必既厭而退。若無篤實，則虛薄也，必既榮而隕，何能久有輝光，日新其德乎？○注“凡物既厭”至“剛健篤實也”。○正義曰：“凡物既厭而退者，弱也”者，釋《經》“剛健”也。若不剛健，則見厭被退。能剛健，則所為日進，不被厭退也。“既榮而隕者薄也”者，釋《經》“篤實”也。凡物暫時榮華而即損落者，由體質虛薄也。若能篤厚充實，則恆保榮美，不有損落也。" }
      - { type: j, text: "剛上而尚賢，謂上九也。處上而大通，剛來而不距，“尚賢”之謂也。" }
      - { type: z, text: "“剛上而尚賢”。○正義曰：“剛上”謂上九也。乾剛向上，上九不距，是貴尚賢也。○注“謂上九”至“尚賢之謂也”。○正義曰：“謂上九也”者，言上九之德，見乾之上進而不距逆，是貴“尚賢”也。“處上而大通”者，釋上九“何天之衢亨”，是處上通也。既處於上，下應於天，有大通之德也。“剛來而不距”者，以有大通，既見乾來而不距逆，是“尚賢”之義也。" }
      - { type: j, text: "能止健，大正也。健莫過乾而能止之，非夫“大正”，未之能也。" }
      - { type: z, text: "正義曰：釋“利貞”義。所以艮能止乾之健者，德能大正，故“能止健”也。" }
      - { type: j, text: "“不家食吉”，養賢也。“利涉大川”，應乎天也。有大畜之實，以之養賢，令賢者不家食，乃吉也。“尚賢”制健，“大正”應天，不憂險難，故“利涉大川”也。" }
      - { type: z, text: "“不家食吉”至“應乎天也”。○正義曰：“不家食吉，養賢”者，釋“不家食吉”，所以不使賢者在家自食而獲吉也。以在上有“大畜”之實，養此賢人，故不使賢者在家自食也。“利涉大川應乎天”者，以貴尚賢人，大正應天，可逾越險難，故“利涉大川”也。○注“有大畜之實”至“利涉大川也”。○正義曰：“尚賢制健”者，謂上九剛來不距，“尚賢”之謂也。艮能畜剛，“制健”之謂也。故上《經》云：“剛上而尚賢”。王《注》云：“謂上九也。”又云：“能止健，大正也。”王《注》云：“健莫過乾，而能止之，非夫大正，未之能也。”則是全論艮體。“明知尚賢”，謂上九也。“制健”謂艮體也。“大正應天”者，謂艮也。故前文云：“能止健，大正也。”止健是艮也，應天者，上體之艮，應下體之乾，故稱“應天”也。此取上卦、下卦而相應，非謂一陰一陽而相應也。" }
      - { type: j, text: "《象》曰：天在山中，大畜。君子以多識前言往行，以畜其德。物之可畜於懷，令德不散，盡於此也。" }
      - { type: z, text: "“《象》曰”至“以畜其德”。○正義曰：“天在山中”者，欲取德積於身中，故云“天在山中”也。“君子以多識前言，往行以畜其德”者，君子則此“大畜”，物既“大畜”，德亦“大畜”，故多記識前代之言，往賢之行，使多聞多見，以畜積己德，故云“以畜其德”也。○注“物之可畜”至“盡於此也”。○正義曰：物之可畜於懷，令其道德不有棄散者，唯貯藏“前言往行”於懷，可以令德不散也。唯此而已，故云“盡於此也”。" }
      - { type: j, text: "初九：有厲利巳。四乃畜巳，未可犯也。故進則有厲，已則利也。" }
      - { type: z, text: "正義曰：初九雖有應於四，四乃抑畜於己。己今若往，則有危厲。唯利休巳，不須前進，則不犯禍兇也。故《象》云：“不犯災也。”" }
      - { type: j, text: "《象》曰：“有厲利巳”，不犯災也。處健之始，未果其健者，故能利巳。" }
      - { type: j, text: "九二：輿說輹。五處畜盛，未可犯也。遇斯而進，故“輿說輹”也。居得其中，能以其中不為馮河，死而無悔，遇難能止，故“無尤”也。" }
      - { type: z, text: "正義曰：九二雖與六五相應，“五處畜盛，未可犯也”。若遇斯而進，則輿說其輹，車破敗也。以其居中，能遇難而止，則無尤過，故《象》云“中無尤”也。以其居中能自止息，故“無尤”也。此“輿說輹”，亦假象以明人事也。" }
      - { type: j, text: "《象》曰：“輿說輹”，中無尤也。" }
      - { type: j, text: "九三：良馬逐，利艱貞。曰：閒輿衛，利有攸往。凡物極則反，故畜極則通。初二之進，值於畜盛，故不可以升。至於九三，升於上九，而上九處天衢之亨，途徑大通，進無違距，可以馳騁，故曰“良馬逐”也。履當其位，進得其時，在乎通路，不憂險厄，故“利艱貞”也。閒，閡也。衛，護也。進得其時，雖涉艱難而無患也，輿雖遇閒而故衛也。與上合志，故“利有攸往”也。" }
      - { type: z, text: "正義曰：“九三良馬逐”者，“初二之進，值於畜盛”，不可以升。“至於九三，升於上九，而上九處天衢之亨，途徑大通，進無違距”，故九三可以良馬馳逐也。“利艱貞”者，“履當其位，進得其時，在乎通路，不憂險厄”，故宜利艱難而貞正也。若不值此時，雖平易守正而尚不可，況艱難而欲行正乎？“曰閒輿衛”者，進得其時，涉難無患，雖曰有人欲閒閡車輿，乃是防衛見護也，故云“曰閒輿衛”也。“利有攸往”者，與上合志，利有所往，故《象》曰“上合志”也。" }
      - { type: j, text: "《象》曰：“利有攸往”，上合志也。" }
      - { type: j, text: "六四：童牛之牿，元吉。處艮之始，履得其位，能止健初，距不以角，柔以止剛，剛不敢犯。抑銳之始，以息強爭，豈唯獨利？乃將“有喜”也。" }
      - { type: z, text: "正義曰：“童牛之牿”者，處艮之始，履得其位，能抑止剛健之初。距此初九，不須用角，故用童牛牿止其初也。“元吉”者，柔以止剛，剛不敢犯，以息彊爭所以大吉而有喜也，故《象》云“元吉，有喜也。”" }
      - { type: j, text: "《象》曰：六四“元吉”，有喜也。" }
      - { type: j, text: "六五：豶豕之牙，吉。豕牙橫猾，剛暴難制之物，謂二也。五處得尊位，為畜之主。二剛而進，能豶其牙，柔能制健，禁暴抑盛，豈唯能固其位，乃將“有慶”也！" }
      - { type: z, text: "“《象》曰”至“豶豕之牙吉”。○正義曰：“豶豕之牙”者，豕牙謂九二也。二既剛陽，似豕牙之橫猾。九二欲進，此六五處得尊位，能豶損其牙，故云“豶豕之牙”。柔能制剛，禁暴抑盛，所以“吉”也。非唯獨吉，乃終久有慶。故《象》云“六五之吉，有慶也”。○注“豕牙橫猾”至“將有慶”。○正義曰：“能豶其牙者，觀注意則豶是禁制損去之名褚氏云：“豶除也。除其牙也。然豶之為除，《爾雅》無訓。案《爾雅》云：“墳，大防。”則墳是隄防之義。此“豶其牙”，謂防止其牙。古字假借，雖豕傍土邊之異，其義亦通。“豶其牙”，謂止其牙也。" }
      - { type: j, text: "《象》曰：六五之“吉”，有慶也。" }
      - { type: j, text: "上九：何天之衢，亨。處畜之極，畜極則通，大畜以至於大亨之時。何，辭也，猶云何畜，乃天之衢亨也。" }
      - { type: z, text: "正義曰：“何天之衢亨”者，何謂語辭，猶云“何畜”也。處畜極之時，更何所畜？乃天之衢亨，無所不通也。故《象》云：“何天之衢，道大行也”。何氏云：“天衢既通，道乃大亨。”" }
      - { type: j, text: "《象》曰：“何天之衢”，道大行也。" }
      - { type: j, text: "震下艮上。頤：貞吉。觀頤，自求口實。" }
      - { type: z, text: "正義曰：“頤貞吉”者，於頤養之世，養此貞正，則得吉也。“觀頤”者，頤，養也，觀此聖人所養物也。“自求口實”者，觀其自養，求其口中之實也。" }
      - { type: j, text: "《彖》曰：頤“貞吉”，養正則吉也。“觀頤”，觀其所養也。“自求口實”，觀其自養也。天地養萬物，聖人養賢以及萬民，頤之時太矣哉！" }
      - { type: z, text: "“《彖》曰”至“大矣哉”。○正義曰：“頤貞吉，養正則吉”者，釋“頤貞吉”之義。頤，養也。貞，正也。所養得正，則有吉也。其養正之言，乃兼二義：一者養此賢人，是其“養正”，故下云“聖人養賢以及萬民”。二者謂養身得正，故《象》云“慎言語，節飲食”。以此言之，則“養正”之文，兼養賢及自養之義也。“觀頤觀其所養也”者，釋“觀頤”之義也。言在下觀視在上頤養所養何人，故云“觀頤，觀其所養也”。“自求口實，觀其自養”者，釋“自求口實”之義也。謂在下之人，觀此在上自求口中之實，是觀其自養，則是在下觀上，乃有二義：若所養是賢，及自養有節，則是其德盛也；若所養非賢，及自養乖度，則其德惡也。此卦之意，欲使所養得也，不欲所養失也。“天地養萬物”者，自此已下，廣言《頤卦》所養事大，故云“天地養萬物”也。“聖人養賢以及萬民”者，先須養賢，乃得養民，故云“養賢以及萬民”也。聖人但養賢人使治眾，眾皆獲安，有如虞舜五人，周武十人，漢帝張良，齊君管仲，此皆養得賢人以為輔佐，政治世康，兆庶鹹說，此則“聖人養賢以及萬民”之養也。“頤之時大矣哉”者，以《彖》釋“頤”義於理既盡，更無餘意，故不云義，所以直言“頤之時大矣哉”。以所養得廣，故云“大矣哉”。" }
      - { type: j, text: "《象》曰：山下有雷，頤。君子以慎言語，節飲食。言語、飲食猶慎而節之，而況其餘乎？" }
      - { type: z, text: "正義曰：山止於上，雷動於下。頤之為用，下動上止，故曰“山下有雷，頤。”人之開發言語、咀嚼、飲食，皆動頤之事，故君子觀此頤象，以謹慎言語，裁節飲食。先儒云：“禍從口出，患從口入。”故於頤養而慎節也。" }
      - { type: j, text: "初九：舍爾靈龜，觀我朵頤，兇。“朵頤”者，嚼也。以陽處下而為動始，不能令物由己養，動而求養者也。夫安身莫若不競，修己莫若自保。守道則福至，求祿則辱來。居養賢之世，不能貞其所履以全其德，而舍其靈龜之明兆，羨我朵頤而躁求，離其致養之至道，闚我寵祿而競進，兇莫甚焉。" }
      - { type: z, text: "“初九”至“觀我朵頤兇”。○正義曰：“靈龜”謂神靈明鑑之龜。“兆”以喻己之明德也。“朵頤”謂朵動之頤以嚼物，喻貪婪以求食也。初九“以陽處下而為動始”，不能使物賴已而養，而更自動求養，是舍其靈龜之明兆，觀我朵頤而躁求。是損己廉靜之德，行其貪竊之情，所以“兇”也。不足可貴，故《象》云“亦不足貴”也。注“朵頤者嚼也”至“兇莫甚焉”。○正義曰：“朵頤者嚼也”者，朵是動義，如手之捉物謂之朵也。今動其頤，故知嚼也。“不能令物猶己養”者，若道德弘大，則己能養物，是物由己養。今身處無位之地，又居震動之始，是動而自求養也。“離其致養之至道，闚我寵祿而競進”者，若能自守廉靜，保其明德，則能致君上所養。今不能守廉靜，是“離其致養之至道”，反以求其寵祿而競進也。" }
      - { type: j, text: "《象》曰：“觀我朵頤”，亦不足貴也。" }
      - { type: j, text: "六二：顛頤，拂經於丘。頤，徵兇。養下曰顛。拂，違也。經猶義也。丘，所履之常也。處下體之中，無應於上，反而養初居下，不奉上而反養下，故曰“顛頤拂經於丘也”。以此而養，未見其福也；以此而行，未見有與，故曰“頤貞兇”。" }
      - { type: z, text: "正義曰：顛，倒也。拂，違也。經，義也。丘，所履之常處也。六二處下體之中，無應於上，反倒下養初，故曰“顛頤”。下當奉上，是義之常處也。今不奉於上，而反養於下，是違此經義於常之處，故云“拂經於丘”也。“頤徵兇”者，徵，行也。若以此而養，所行皆兇，故曰“頤徵兇”也。" }
      - { type: j, text: "《象》曰：六二，“徵兇”，行失類也。類皆上養，而二處下養初。" }
      - { type: z, text: "正義曰：頤養之體，類皆養上也。今此獨養下，是所行失類也。" }
      - { type: j, text: "六三：拂頤，貞兇。十年勿用，無攸利。履夫不正，以養於上，納上以諂者也。拂養正之義，故曰“拂頤貞兇”也。處頤而為此行，十年見棄者也。立行於斯，無施而利。" }
      - { type: z, text: "正義曰：“拂頤貞兇”者，拂，違也。履夫不正，以養上九，是自納於上以諂媚者也。違養正之義，故曰拂頤貞而有兇也。為行如此，雖至十年，猶勿用而見棄也，故曰“十年勿用”。立行於此，故無所利也。" }
      - { type: j, text: "《象》曰：“十年勿用”，道大悖也。" }
      - { type: z, text: "正義曰：釋“十年勿用”之義。以其養上以諂媚，則於正道大悖亂，解“十年勿用”見棄也。" }
      - { type: j, text: "六四：顛頤，吉。虎視耽耽，其欲逐逐，無咎。體屬上體，居得其位，而應於初，以上養下，得頤之義，故曰“顛頤吉”也。下交不可以瀆，故“虎視耽耽”，威而不猛，不惡而嚴。養德施賢，何可有利？故“其欲逐逐”，尚敦實也。修此二者，然後乃得全其吉而“無咎”。觀其自養則履正，察其所養則養陽，頤爻之貴，斯為盛矣。" }
      - { type: z, text: "“六四，顛頤吉”至“無咎”。○正義曰：“顛頤吉”者，“體屬上體，居得其位，而應於初，以上養下”，得養之宜，所以吉也。“虎視耽耽”者，以上養下，不可褻瀆，恆如虎視耽耽，然威而不猛也。“其欲逐逐”者，既養於下，不可有求，其情之所欲逐逐然，尚於敦實也。“無咎”者，若能“虎視耽耽，其欲逐逐”，雖復“顛頤”養下，則得吉而“無咎”也。○注“體屬上體”至“斯為盛矣”。○正義曰：“觀其自養則履正”者，以陰處陰，四自處其身，是觀其自養，則能履正道也。“察其所養則養陽”者，六四下養於初，是觀其所養。初是陽爻，則能養陽也。" }
      - { type: j, text: "《象》曰：“顛頤”之吉，上施光也。" }
      - { type: z, text: "正義曰：釋“顛頤吉”之義。“上”謂四也。下養於初，是上施也。能威而不猛，如虎視耽耽，又寡欲少求，其欲逐逐，能為此二者，是上之所施有光明也。然六二“顛頤”則為兇，六四“顛頤”得為吉者，六二身處下體而又下養，所以兇也；六四身處上體，又應於初，陰而應陽，又能威嚴寡欲，所以吉也。" }
      - { type: j, text: "六五：拂經，居貞，吉。不可涉大川。以陰居陽，“拂頤”之義也。行則失類，故宜“居貞”也。無應於下而比於上，故可守貞從上，得頤之吉，雖得居貞之吉，處頤違謙，難未可涉也。" }
      - { type: z, text: "正義曰：拂，違也。經，義也。以陰居陽，不有謙退，乖違於“頤養”之義，故言“拂經”也。“居貞吉”者，行則失類，“居貞吉”也。“不可涉大川”者，處頤違謙，患難未解，故“不可涉大川”，故“居貞吉”也。" }
      - { type: j, text: "《象》曰：“居貞”之吉，順以從上也。" }
      - { type: z, text: "正義曰：釋“居貞”之義。以五近上九，以陰順陽，親從於上，故得“居貞吉”也。" }
      - { type: j, text: "上九：由頤，厲吉，利涉大川。以陽處上而履四陰，陰不能獨為主，必宗於陽也。故莫不由之以得其養，故曰“由頤”。為眾陰之主，不可瀆也，故厲乃吉。有似《家人》“悔厲”之義，貴而無位，是以厲也。高而有民，是以吉也。為養之主，物莫之違，故“利涉大川”也。" }
      - { type: z, text: "正義曰：“由頤”者，以陽處上而履四陰，陰不能獨為其主，必宗事於陽也。眾陰莫不由之以得其養，故曰“由頤”也。“厲吉”者，為眾陰之主，不可褻瀆，嚴厲乃吉，故曰“厲吉”也。“利涉大川”者，為養之主，無所不為，故“利涉大川”而有慶也。故《象》云“大有慶也”。" }
      - { type: j, text: "《象》曰：“由頤厲吉”，大有慶也。" }
      - { type: j, text: "巽下兌上。大過：音相過之過。" }
      - { type: z, text: "“大過”。○正義曰：“過”謂過越之“過”，非經過之“過”。此衰難之世，唯陽爻，乃大能過越常理以拯患難也。故曰“大過”。以人事言之，猶若聖人過越常理以拯患難也。○注“音相過之過”。○正義曰：“相過”者，謂相過越之甚也，非謂相過從之“過”，故《象》云“澤滅木”。是過越之甚也。四陽在中，二陰在外，以陽之過越之甚也。" }
      - { type: j, text: "棟撓，利有攸往，亨。" }
      - { type: z, text: "正義曰：“棟撓”者，謂屋棟也。本之與末俱撓弱，以言衰亂之世，始終皆弱也。“利有攸往亨”者，既遭衰難，聖人“利有攸往”，以拯患難，乃得亨通，故云“利有攸往亨”也。" }
      - { type: j, text: "《彖》曰：大過，大者過也。大者乃能過也。" }
      - { type: z, text: "正義曰：釋大過之義也。“大者過”，謂盛大者乃能過其分理以拯難也。故於二爻陽處陰位，乃能拯難也，亦是過甚之義。" }
      - { type: j, text: "“棟撓”，本末弱也。初為本，而上為末也。" }
      - { type: z, text: "正義曰：釋“棟撓”義。以大過本末俱弱，故屋棟撓弱也，似若衰難之時始終弱。" }
      - { type: j, text: "剛過而中，謂二也。居陰，“過”也；處二，“中”也。拯弱興衰，不失其中也。巽而說行，“巽而說行”，以此救難，難乃濟也。“利有攸往”，乃亨。危而弗持，則將安用？故往乃亨。" }
      - { type: z, text: "正義曰：“剛過而中巽而說行利有攸往乃亨”者，此釋“利有攸往乃亨”義。“剛過而中”謂二也。以陽處陰，是剛之過極之甚，則陽來拯此陰難，是過極之甚也。“巽而說行”者，既以巽順和說而行，難乃得濟，故“利有攸往得亨”也。故云“乃亨”。" }
      - { type: j, text: "大過之時大矣哉！是君子有為之時也。" }
      - { type: z, text: "正義曰：此廣說大過之美。言當此大過之時，唯君子有為拯難，其功甚大，故曰“大矣哉”也。" }
      - { type: j, text: "象曰：澤滅木，大過。君子以獨立不懼，遁世無悶。此所以為“大過”，非凡所及也。" }
      - { type: z, text: "正義曰：“澤滅木”者，澤體處下，木體處上，澤無滅木之理。今云“澤滅木”者，乃是澤之甚極而至滅木，是極大過越之義。其大過之卦有二義也：一者物之自然大相過越常分，即此“澤滅木”是也。二者大人大過越常分以拯患難，則九二“枯楊生稊，老夫得其女妻”是也。“君子以獨立不懼，遁世無悶”者，明君子於衰難之時，卓爾獨立，不有畏懼，隱遁於世而無憂悶，欲有遁難之心，其操不改。凡人遇此則不能，然唯君子獨能如此，是其過越之義。" }
      - { type: j, text: "初六：藉用白茅，無咎。以柔處下，過而可以“無咎”，其唯慎乎！" }
      - { type: z, text: "正義曰：以柔處下，心能謹慎，薦藉於物，用絜白之茅，言以絜素之道奉事於上也。“無咎”者，既能謹慎如此，雖遇大過之難，而“無咎”也。以柔道在下，所以免害。故《象》云“柔在下也”。" }
      - { type: j, text: "《象》曰：“藉用白茅”，柔在下也。" }
      - { type: j, text: "九二：枯楊生稊，老夫得其女妻，無不利。“稊”者，楊之秀也。以陽處陰，能過其本而救其弱者也。上無其應，心無持吝處過以此，無衰不濟也。故能令枯楊更生稊，老夫更得少妻，拯弱興衰，莫盛斯爻，故“無不利”也。老過則枯，少過則稚。以老分少，則稚者長；以稚分老，則枯者榮，過以相與之謂也。大過至衰而已至壯，以至壯輔至衰，應斯義也。" }
      - { type: z, text: "“《象》曰藉用白茅”至“無不利”。○正義曰：“枯楊生稊”者，“枯”謂枯稿，“稊”謂“楊之秀”者。九二以陽處陰，能過其本分，而救其衰弱。上無其應，心無特吝，處大過之時，能行此道，無有衰者不被拯濟。故衰者更盛，猶若枯槁之楊，更生少壯之稊；枯老之夫，得其少女為妻也。“無不利”者，謂拯弱興衰，莫盛於此。以斯而行，無有不利也。○注“稊者楊之秀也”至“應斯義也”。○正義曰：“稊”者楊柳之穗，故云“楊之秀也”。“以陽處陰，能過其本而救其弱”者，若以陽處陽，是依其本分。今以陽處陰，是過越本分，拯救陰弱也。“老過則枯，少過則稚”者，老之太過則枯槁，少之太過則幼稚也。“以老分少則稚者長也”，謂老夫減老而與女妻，女妻得之而更益長，故云“以老分少則稚者長也”。“以稚分老則枯者榮”者，謂女妻減少而與老夫，老夫得之，似若槁者而更得生稊，故云“則枯者榮也。”云“大過至衰而已至壯，以至壯輔至衰，應斯義”者，此大過之卦，本明至壯輔至衰，不論至衰減至壯。故輔嗣此《注》特云“以至壯輔至衰也”。“《象》曰過以相與”者，因至壯而輔至衰，似女妻而助老夫，遂因云老夫減老而與少，猶若至衰減衰而與壯也。其實不然也。" }
      - { type: j, text: "《象》曰“老夫女妻”，過以相與也。" }
      - { type: z, text: "正義曰：釋“老夫女妻”之義。若老夫而有老妻，是依分相對。今老夫而得女妻，是過分相與也。老夫得女妻，是女妻以少而與老夫。老夫得少而更壯，是女妻過分而與夫也。女妻而得少夫，是依分相對。今女妻得老夫，是老夫減老而與少。女妻既得其老則益長，是老夫過分而與妻也，故云“過以相與”。《象》直云“老夫”、“女妻”，不云“枯楊生稊”者，“枯楊”則是老夫也，“生稊”則女妻也。其意相似，故《象》略而不言。" }
      - { type: j, text: "九三：棟橈，兇。居大過之時，處下體之極，不能救危拯弱，以隆其棟，而以陽處陽，自守所居，又應於上，系心在一，宜其淹弱而兇衰也。" }
      - { type: z, text: "正義曰：居大過之時，處下體之極，以陽居陽，不能救危拯弱，唯自守而已。獨應於上，系心在一，所以“兇”也。心既褊狹，不可以輔救衰難，故《象》云“不可以有輔也”。" }
      - { type: j, text: "《象》曰：“棟橈”之兇，不可以有輔也。" }
      - { type: j, text: "九四：棟隆，吉。有它吝。體屬上體，以陽處陰，能拯其弱，不為下所橈者也，故“棟隆”吉也。而應在初，用心不弘，故“有它吝”也。" }
      - { type: z, text: "正義曰：“棟隆吉”者，體居上體，以陽處陰，能拯救其弱，不為下所橈，故得棟隆起而獲吉也。“有它吝”者，以有應在初，心不弘闊，故“有它吝”也。" }
      - { type: j, text: "《象》曰：“棟隆”之吉，不橈乎下也。" }
      - { type: z, text: "正義曰：釋“棟隆之吉”，以其能拯於難，不被橈乎在下，故得“棟隆吉”。九四應初，行又謙順，能拯於難，然唯只拯初，初謂下也。下得其拯，猶若所居屋棟隆起，下必不橈。若何得之，不被橈乎在下。但《經》文云“棟橈”，《彖》釋“棟橈”者，本末弱也。以屋棟橈弱而偏，則屋下榱柱亦先弱。柱為本，棟為末，觀此《彖》辭，是足見其義。故子產云：“棟折榱崩，僑將壓焉。”以屋棟橈折，則榱柱亦同崩，此則義也。" }
      - { type: j, text: "九五：枯楊生華，老婦得其士夫，無咎無譽。處得尊位，而以陽處陽，未能拯危。處得尊位，亦未有橈，故能生華，不能生稊；能得夫，不能得妻。處“棟橈”之世，而為“無咎無譽”，何可長哉！故生華不可久，士夫誠可醜也。" }
      - { type: z, text: "“九五枯楊生華”至“無咎無譽”。正義曰：“枯楊生華”者，處得尊位而以陽居陽，未能拯危，不如九二“枯楊生稊”。但以處在尊位，唯得“枯楊生華”而巳。言其衰老，雖被拯救，其益少也。又似年老之婦，得其彊壯士夫，婦已衰老，夫又彊大，亦是其益少也。所拯難處少，才得無咎而已，何有聲譽之美？故“無咎無譽”也。○注“處得尊位”至“誠可醜也”。○正義曰：“處得尊位，亦未有橈”者，以九三不得尊位，故有棟橈。今九五雖與九三同以陽居陽，但九五處得尊位，功雖未廣，亦未有橈弱。若其橈弱，不能拯難，不能使“枯楊生華”也。以在尊位，微有拯難，但其功狹少，但使“枯楊生華”而已，“不能生稊”也。“能得夫，不能得妻”者，若拯難功闊，則“老夫得其女妻”，是得少之甚也。今既拯難功狹，但能使老婦得士夫而已，不能使女妻，言老婦所得利益薄少，皆為拯難功薄，故所益少也。" }
      - { type: j, text: "《象》曰：“枯楊生華”，何可久也？老婦士夫，亦可醜也。" }
      - { type: z, text: "正義曰：“枯楊生華，何可久”者，枯稿之楊，被拯才得生華，何可長久？尋當衰落也。“老婦士夫，亦可醜也”者，婦當少稚於夫，今年老之婦，而得彊壯士夫，亦可醜辱也。此言九五不能廣拯衰難，但使“枯楊生華”而已，但使“老婦得其士夫”而已。拯難狹劣，故不得長久，誠可醜辱，言不如九二也。" }
      - { type: j, text: "上六：過涉滅頂，兇，無咎。處太過之極，過之甚也。涉難過甚，故至於“滅頂兇”。志在救時，故不可咎也。" }
      - { type: z, text: "正義曰：處大過之極，是過越之甚也。以此涉危難，乃至於滅頂，言涉難深也。既滅其頂，所以“兇”也。“無咎”者，所以涉難滅頂，至於兇亡，本欲濟時拯難，意善功惡，無可咎責。此猶龍逄、比干，憂時危亂，不懼誅殺，直言深諫，以忤無道之主，遂至滅亡。其意則善，而功不成，復有何咎責？此亦“過涉滅頂兇無咎”之象，故《象》云“不可咎”，言不可害於義理也。" }
      - { type: j, text: "《象》曰：“過涉”之兇，不可咎也。雖兇無咎，不害義也。" }
      - { type: j, text: "坎下坎上。習坎：“坎”，險陷之名也。“習”謂便習之。" }
      - { type: z, text: "正義曰：“坎”是險陷之名。“習”者，便習之義。險難之事，非經便習，不可以行。故須便習於坎，事乃得用，故云“習坎”也。案：諸卦之名，皆於卦上不加其字。此坎卦之名特加“習”者，以坎為險難，故特加“習”名。“習”有二義：一者習重也，謂上下俱坎，是重疊有險，險之重疊，乃成險之用也。二者人之行險，先須使習其事，乃可得通，故云“習”也。" }
      - { type: j, text: "有孚，維心亨，剛正在內，“有孚”者也。陽不外發而在乎內，“心亨”者也。" }
      - { type: z, text: "“有孚維心亨”。○正義曰：“有孚”者，亨，信也，由剛正在內，故有信也。“維心亨”者，陽不發外而在於內，是“維心亨”，言心得通也。○注“剛正在內”至“心亨者也”。○正義曰：“剛正在內”者，謂陽在中也。因心剛正，則能有誠信，故云“剛正在內有孚者也，陽不外發而在乎內，心亨者也”。若外陽內陰，則內心柔弱，故不得亨通。今以陽在於內，陽能開通，故維其在心之亨也。" }
      - { type: j, text: "行有尚。內亨外闇，內剛外順，以此行險，“行有尚”也。" }
      - { type: z, text: "“行有尚”。○正義曰：內亨外闇，內剛外柔，以此行險，事可尊尚，故云“行有尚”也。○注“內亨外闇”至“行有尚也”。○正義曰：“內亨外闇”者，內陽故內亨，外陰故外闇。以亨通之性，而往謂陰闇之所，能通於險，故行可貴尚也。" }
      - { type: j, text: "《彖》曰：“習坎”，重險也。坎以險為用，故特名曰“重險”，言“習坎”者，習重乎險也。" }
      - { type: z, text: "“《彖》曰：習坎重險也”。○正義曰：釋“習坎”之義。言“習坎”者，習行重險。險，難也。若險難不重，不為至險，不須便習，亦可濟也。今險難既重，是險之甚者，若不便習，不可濟也，故注云“習坎者習重險也”。注“坎以險為用”至“習乎重險也”。○正義曰：言“習坎者，習乎重險也”者，言人便習於“坎”，止是便習重險。便習之語以釋“習”名。兩“坎”相重，謂之“重險”，又當“習”義，是一“習”之名，有此兩義。" }
      - { type: j, text: "水流而不盈，行險而不失其信。險峭之極，故水流而不能盈也。處至險而不失剛中，“行險而不失其信”者，“習坎”之謂也。" }
      - { type: z, text: "“水流而不盈”至“不失其信”。○正義曰：此釋“重險”“習坎”之義。“水流而不盈”，謂險陷既極，坑阱特深，水雖流注，不能盈滿，言險之甚也，釋“重險”之義也。“行險而不失其信”，謂行此至險。能守其剛中，不失其信也。此釋“習坎”及“有孚”之義也。以能便習於險，故守剛中，“不失其信”也。○注“險穭之極”至“習坎之謂也”。○正義曰：“險峭之極，故水流而不能盈”者，若淺岸平谷，則水流有可盈滿。若其崖岸險峻，澗谷洩漏，是水流不可盈滿，是險難之極也。" }
      - { type: j, text: "“維心亨”，乃以剛中也。“行有尚”，往有功也。便習於“坎”而之“坎”地，盡坎之宜，故往必有功也。" }
      - { type: z, text: "正義曰：“維心亨乃以剛中也”者，釋“維心亨”義也。以剛在於中，故維得心亨也。“行有尚，往有功”者，此釋“行有尚”也。既便習於坎而往之險地，必有其功，故云“行有尚，往有功也”。" }
      - { type: j, text: "天險不可升也，不可得升，故得保其威尊。" }
      - { type: z, text: "正義曰：此已下廣明險之用也。言天之為險，懸邈高遠，不可升上，此天之險也。若其可升，不得保其威尊，故以“不可升”為“險”也。" }
      - { type: j, text: "地險山川丘陵也，有山川丘陵，故物得以保全也。" }
      - { type: z, text: "正義曰：言地以山川丘陵而為險也，故使地之所載之物保守其全。若無山川丘陵，則地之所載之物失其性也。故地以山川丘陵而為險也。" }
      - { type: j, text: "王公設險以守其國。國之為衛，恃於險也。言自天地以下莫不須險也。" }
      - { type: z, text: "正義曰：言王公法象天地，固其城池，嚴其法令，以保其國也。" }
      - { type: j, text: "險之時用大矣哉！非用之常，用有時也。" }
      - { type: z, text: "正義曰：言天地已下，莫不須險，險雖有時而用，故其功盛大矣哉！○注“非國之常，用有時也”。○正義曰：若“天險”“地險”不可暫無，此謂人之設險，用有時也。若化洽平治，內外輯睦，非用險也。若家國有虞，須設險防難，是“用有時”也。" }
      - { type: j, text: "《象》曰：水洊至，“習坎”。重險懸絕，故“水洊至”也。不以“坎”為隔絕，相仍而至，習乎“坎”也。" }
      - { type: z, text: "正義曰：重險懸絕，其水不以險之懸絕，水亦相仿而至，故謂為“習坎”也。以人之便習於“坎”，猶若水之洊至，水不以險為難也。" }
      - { type: j, text: "君子以常德行，習教事。至險未夷，教不可廢，故以常德行而習教事也。“習於坎”，然後乃能不以險難為困，而德行不失常也。故則夫“習坎”，以常德行而習教事也。" }
      - { type: z, text: "正義曰：言君子當法此，便習於坎，不以險難為困，當守德行而習其政教之事。若能習其教事，則可便習於險也。" }
      - { type: j, text: "初六：“習坎”，入於坎窞，兇。“習坎”者，習為險難之事也。最處坎底，入坎窞者也。處重險而復入坎底，其道“兇”也。行險而不能自濟，“習坎”而入坎窞，失道而窮在坎底，上無應援可以自濟，是以“兇”也。" }
      - { type: z, text: "正義曰：既處坎底，上無應援，是習為險難之事。無人應援，故入於坎窞而至兇也。以其失道，不能自濟，故《象》云“失道兇”也。" }
      - { type: j, text: "《象》曰：“習坎”入“坎”，失道兇也。" }
      - { type: j, text: "九二：坎有險，求小得。履失其位，故曰“坎”。上無應援，故曰“有險”。坎而有險，未能出險之中也。處中而與初三相得，故可以“求小得”也。初三未足以為援，故曰“小得”也。" }
      - { type: z, text: "正義曰：“坎有險”者，履失其位，故曰“坎”也。上無應援，故曰“有險”。既在坎難而又遇險，未得出險之中，故《象》云“未出中”也。“求小得”者，以陽處中，初三來附，故可以“求小得”也。初三柔弱，未足以為大援，故云“求小得”也。" }
      - { type: j, text: "《象》曰：“求小得”，未出中也。" }
      - { type: j, text: "六三：來之坎坎，險且枕，“入於坎窞”，勿用。既履非其位，而又處兩“坎”之間，出則之“坎”，居則亦“坎”，故曰“來之坎坎”也。“枕”者，枕枝而不安之謂也。出則無之，處則無安，故曰“險且枕”也。來之皆“坎”，無所用之，徒勞而已。" }
      - { type: z, text: "正義曰：“來之坎坎”者，履非其位而處“兩坎”之閒，出之與居，皆在於“坎”，故云“來之坎坎”也。“險且枕”者，“枕”，枝而不安之謂也。出則無應，所以險處則不安，故“且枕”也。“入於坎窞”者，出入皆難，故“入於坎窞”也。“勿用”者，不可出行。若其出行，終必無功，徒勞而已，故《象》云“終無功”也。" }
      - { type: j, text: "《象》曰：“來之坎坎”，終無功也。" }
      - { type: j, text: "六四：樽酒簋貳，用缶，納約自牖，終無咎。處重險而履正，以柔居柔，履得其位，以承於五，五亦得位，剛柔各得其所，不相犯位，皆無餘應以相承比，明信顯著，不存外飾，處“坎”以斯，雖復一樽之酒，二簋之食，瓦缶之器，納此至約，自進於牖，乃可羞之於王公，薦之於宗廟，故“終無咎”也。" }
      - { type: z, text: "“《象》曰”至“自牖終無咎”。○正義曰：“樽酒簋貳”者，處重險而履得其位，以承於五，五亦得位，剛柔各得其所，皆無餘應，以相承比，明信顯著，不假外飾。處“坎”以此，雖復一樽之酒，二簋之食，故云“樽酒簋貳”也。“用缶”者，既有“樽酒簋貳”，又用瓦缶之器，故云“用缶”也。“納約自牖終無咎”者，納此儉約之物，從牖而薦之，可羞於王公，可薦於宗廟，故云“終無咎”也。" }
      - { type: j, text: "《象》曰：“樽酒簋貳”，剛柔際也。剛柔相比而相親焉，“際”之謂也。" }
      - { type: z, text: "正義曰：釋“樽酒簋貳”義。所以一樽之酒、貳簋之食得進獻者，以六四之柔與九五之剛兩相交際而相親，故得以此儉約而為禮也。" }
      - { type: j, text: "九五：坎不盈，祗既平，無咎。為坎之主而無應輔可以自佐，未能盈坎者也。坎之不盈，則險不盡矣。祗，辭也。為坎之主，盡平乃無咎，故曰“祗既平無咎”也。說既平乃無咎，明九五未免於咎也。" }
      - { type: z, text: "正義曰：“坎不盈”者，為坎之主而無應輔可以自佐，險難未能盈坎，猶險難未盡也。故云“坎不盈”也。“祗既平無咎”者，祗，辭也，謂險難既得盈滿而平，乃得“無咎”。若坎未盈平，仍有咎也。" }
      - { type: j, text: "《象》曰：“坎不盈”，中未大也。" }
      - { type: z, text: "正義曰：釋“坎不盈”之義，雖復居中而無其應，未得光大，所以坎不盈滿也。" }
      - { type: j, text: "上六：系用徽纆，置於叢棘，三歲不得，兇。險峭之極，不可升也。嚴法峻整，難可犯也。宜其囚執寘于思過之地。三歲，險道之夷也。險終乃反，故三歲不得自脩，三歲乃可以求復，故曰“三歲不得兇”也。" }
      - { type: z, text: "正義曰：“系用徽纆置於叢棘”者，險峭之極，不可升上。嚴法峻整，難可犯觸。上六居此險峭之處，犯其峻整之威，所以被系用其徽纆之繩。“置於叢棘”，謂囚執之處，以棘叢而禁之也。“三歲不得兇”者，謂險道未終，三歲已來，不得其吉，而有兇也。險終乃反，若能自修，三歲後可以求復自新，故《象》云“上六，失道兇，三歲也”。言失道之兇，唯三歲之後可以免也。" }
      - { type: j, text: "《象》曰：上六，失道兇，三歲也。" }
      - { type: j, text: "離下離上。離：利貞，亨。離之為卦，以柔為正，故必貞而後乃亨，故曰“利貞亨”也。" }
      - { type: z, text: "“離利貞亨”。○正義曰：離，麗也。麗謂附著也。言萬物各得其所附著處，故謂之“離”也。“利貞亨”者，離卦之體，陰柔為主，柔則近於不正，不正則不亨通，故利在行正，乃得亨通。以此故“亨”在“利貞”之下，故云“利貞亨”。○注“離之為卦”至“利貞亨也”。○正義曰：“離之為卦，以柔為正”者，二與五俱是陰爻，處於上下兩卦之中，是以柔為正。" }
      - { type: j, text: "畜牝牛，吉。柔處於內而履正中，牝之善也。外強而內順，牛之善也。離之為體，以柔順為主者也。故不可以畜剛猛之物，而“吉”於“畜牝牛”也。" }
      - { type: z, text: "“畜牝牛吉”。正義曰：柔處於內而履正中，是牝之善者，外強內順，是牛之善者也。離之為體，以柔順為主，故畜養牝牛，乃得其吉。若畜養剛健，則不可也。此云“畜牝牛”，假象以明人事也。言離之為德，須內順外強，而行此德則得吉也。若內剛外順，則反離之道也。○注“柔處於內”至“畜牝牛也”。○正義曰：“柔處於內而履正中牝之善也”者，若柔不處於內，似婦人而預外事；若柔而不履正中，則邪僻之行，皆非牝之善也。若柔能處中，行能履正，是為“牝之善”也。云“外強而內順牛之善”者，若內外俱強，則失於猛害；若外內俱順，則失於劣弱。唯外強內順，於用為善，故云“外強內順牛之善也”。“離之為體，以柔順為主，故不可以畜剛猛之物”者，既以柔順為主，若畜剛猛之物，則反其德，故不可畜剛猛而“畜牝牛”也。" }
      - { type: j, text: "《彖》曰：離，麗也。麗猶著也。各得所著之宜。" }
      - { type: z, text: "正義曰：釋離卦之名。麗謂附著也。以陰柔之質，附著中正之位，得所著之宜，故云“麗”也。" }
      - { type: j, text: "日月麗乎天，百穀草木麗乎土。重明以麗乎正，乃化成天下。柔麗乎中正，故亨。是以“畜牝牛，吉”也。柔著於中正，乃得通也。柔通之吉，極於“畜牝牛”，不能及剛猛也。" }
      - { type: z, text: "“日月麗乎天”至“是以畜牝牛吉也”。○正義曰：“日月麗乎天，百穀草木麗乎土”者，此廣明附著之義。以柔附著中正，是附得宜，故廣言所附得宜之事也。“重明以麗乎正，乃化成天下”者，此以卦象，說離之功德也，並明“利貞”之義也。“重明”，謂上下俱離。“麗乎正”者，謂兩陰在內，既有重明之德，又附於正道，所以“化成天下”也。然陰居二位，可謂為正。若陰居五位，非其正位，而云“重明麗乎正”者，以五處於中正，又居尊位，雖非陰陽之正，乃是事理之正，故總云“麗於正”也。“柔麗乎中正，故亨。是以牝牛吉”者，釋《經》“亨”義也，又總釋“畜牝牛吉”也。“柔麗於中正”，謂六五、六二之柔，皆麗於中，中則不偏，故云“中正”。以中正為德，故萬事亨。以中正得通，故畜養牝牛而得吉也。以牝牛有中正故也。案諸卦之《彖》，釋卦名之下，乃釋卦下之義，於後乃歎而美之。此《彖》既釋卦名，即廣歎為卦之美，乃釋卦下之義。與諸卦不例者，此乃夫子隨義則言，因文之便也。比既釋“離”名麗，因廣說日月草木所麗之事，然後卻明卦下之義，更無義例。" }
      - { type: j, text: "《象》曰：明兩作，離。大人以繼明照於四方。“繼”謂不絕也，明照相繼，不絕曠也。" }
      - { type: z, text: "正義曰：“明兩作離”者，離為日，日為明。今有上下二體，故云“明兩作，離”也。案：八純之卦，論象不同，各因卦體事義，隨文而發。乾、坤不論上下之體，直總云“天行健”、“地勢坤”，以天地之大，故總稱上下二體也。雷是連續之至，水為流注不已，義皆取連續相因，故震云“洊雷”，坎云“洊至”也。風是搖動相隨之物，故云“隨風巽”也。山澤各自為體，非相入之物，故云“兼山艮”，“麗澤兌”，是兩物各行也。今明之為體，前後各照，故云“明兩作，離”，是積聚兩明，乃作於離。若一明暫絕，其離未久，必取兩明前後相續，乃得作離卦之美，故云“大人以繼明照於四方”，是繼續其明，乃照於四方。若明不繼續，則不得久為照臨，所以特云“明兩作，離”，取不絕之義也。" }
      - { type: j, text: "初九：履錯然，敬之，無咎。“錯然”者，警慎之貌也。處離之始，將進而盛，未在既濟，故宜慎其所履，以敬為務，闢其咎也。" }
      - { type: z, text: "“初九，履錯然，敬之無咎”。○正義曰：“履錯然”者，身處離初，將欲前進，其道未濟，故其所履踐，恆錯然敬慎不敢自寧，故云“履錯然敬之無咎”。若能如此恭敬，則得避其禍而“無咎”，故《象》云：“履錯之敬，以避咎也”。○注“錯然者警慎之貌也”至“闢其咎也”。○正義曰：“錯然者警慎之貌”者，是警懼之狀，其心未寧故“錯然”也。言“處離之始，將進而盛，未在既濟”者，“將進而盛”，謂將欲前進而向盛也。若位在於三，則得“既濟”。今位在於初，是未在“既濟”。謂功業未大，故宜慎其所履，恆須錯然避咎也。" }
      - { type: j, text: "《象》曰：“履錯”之敬，以闢咎也。" }
      - { type: j, text: "六二：黃離，元吉。居中得位，以柔處柔，履文明之盛而得其中，故曰“黃離元吉”也。" }
      - { type: z, text: "正義曰：黃者中色，“離”者文明。居中得位而處於文明，故“元吉”也。故《象》云“得中道”，以其得中央黃色之道也。" }
      - { type: j, text: "《象》曰：“黃離元吉”，得中道也。" }
      - { type: j, text: "九三：日昃之離，不鼓缶而歌，則大耋之嗟，兇。嗟，憂歎之辭也。處下離之終，明在將沒，故曰“日昃之離”也。明在將終，若不委之於人，養志無為，則至於耋老有嗟，兇矣，故曰“不鼓缶而歌，則大耋之嗟兇”也。" }
      - { type: z, text: "正義曰：“日昃之離”者，處下離之終，其明將沒，故云“日昃之離”也。“不鼓缶而歌，大耋之嗟兇”者，時既老耄，當須委事任人，自取逸樂。若不委之於人，則是不鼓擊其缶而為歌，則至於大耋老耄而諮嗟，何可久長？所以兇也。故《象》云：“日昃之離，何可久也？”" }
      - { type: j, text: "《象》曰：“日昃之離”，何可久也？" }
      - { type: j, text: "九四：突如其來如，焚如，死如，棄如。處於明道始變之際，昏而始曉，沒而始出，故曰“突如其來如”。其明始進，其炎始盛，故曰“焚如”。逼近至尊，履非其位，欲進其盛，以炎其上，命必不終，故曰“死如”。違“離之義，無應無承，無所不容，故曰“棄如”也。" }
      - { type: z, text: "“九四，突如其來如，焚如，死如，棄如”。○正義曰：“突如其來如”者，四處始變之際，三為始昏，四為始曉。三為已沒，四為始出，突然而至，忽然而來，故曰“突如其來如”也。“焚如”者，逼近至尊，履非其位，欲進其盛，以焚炎其上，故云“焚如”也。死如者，既焚其上，命必不全，故云“死如”也。“棄如”者，違於離道，無應無承，眾所不容，故云“棄如”。是以《象》云：“無所容也。”" }
      - { type: j, text: "《象》曰：“突如其來如”，無所容也。" }
      - { type: j, text: "六五：出涕沱若，戚嗟若，吉。履非其位，不勝所履。以柔乘剛，不能制下，下剛而進，將來害已，憂傷之深，至於沱嗟也。然所麗在尊，四為逆首，憂傷至深，眾之所助，故乃沱嗟而獲吉也。" }
      - { type: z, text: "正義曰：“出涕沱若”者，履非其位，不勝其任，以柔乘剛，不能制下，下剛而進，將來害已，憂傷之深，所以出涕滂沱，憂戚而諮嗟也。“若”是語辭也。“吉”者，以所居在尊位，四為逆首，已能憂傷悲嗟，眾之所助，所以“吉”也。" }
      - { type: j, text: "《象》曰：六五之“吉”，離王公也。" }
      - { type: z, text: "正義曰：此釋“六五吉”義也。所以終得吉者，以其所居在五，離附於王公之位，被眾所助，故得吉也。五為王位，而言公者，此連王而言公，取其便文以會韻也。" }
      - { type: j, text: "上九：王用出徵，有嘉折首，獲匪其醜，無咎。“離”，麗也，各得安其所麗謂之“離”。處離之極，離道已成，則除其非類以去民害，“王用出徵”之時也。故必“有嘉折首，獲匪其醜”，乃得“無咎”也。" }
      - { type: z, text: "正義曰：“王用出徵”者，處離之極，離道既成，物皆親附，當除去其非類，以去民害，故“王用出徵”也。“有嘉折首，獲匪其醜”者，以出征罪人，事必克獲，故有嘉美之功，折斷罪人之首，獲得匪其醜類，乃得“無咎”也。若不出徵除害，居在終極之地，則有咎也。" }
      - { type: j, text: "《象》曰：“王用出徵”，以正邦也。" }
      - { type: z, text: "正義曰：釋“出征”之義。言所出征者，除去民害，以正邦國故也。" }
      - { type: j, text: "上一頁 目錄頁 下一頁" }
