  colophon: |-
    依<b>宋刻本</b>版式排比：一版兩個半葉，中縫為版心。經文大字單行，孔穎達正義小字雙行；遇卦別行；疏隨經注而下，與純注列網格對齊，本列不敷乃另起列；雙行並進，長短相差不過一字。<br>版心上下留白口，上鐫單黑魚尾，次書名卷次、葉次，末署刻工姓名。<br>注文之制，備疏朗、雅正、宋槧三版，可於欄內遞轉；疏朗字大易誦，宋槧嚴守舊觀。<br>句讀以朱筆點之，附於字之右下，不占字位，點之斜正輕重因字而變，以仿手批氣韻。<br>本卷錄《周易正義》卷三上經隨傳：隨、蠱、臨、觀、噬嗑、賁、剝、復、無妄、大畜、頤、大過、坎、離十四卦，經文據魏王注本，疏文為唐孔穎達等奉敕撰。
