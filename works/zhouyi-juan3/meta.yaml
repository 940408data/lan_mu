aboutHtml: |-
  <h2>關於此卷</h2>
  <p>《周易正義》為唐孔穎達等奉敕撰，以魏王弼、韓康伯注為本，兼採漢魏諸家之說，為十三經注疏之一。此卷以宋刻本版式數字重刻，半葉八行、行十六字、注文雙行二十五字。</p>
  <p>卷三收上經隨傳：隨、蠱、臨、觀、噬嗑、賁、剝、復、無妄、大畜、頤、大過、坎、離十四卦，含卦辭、爻辭、彖傳、象傳，經注疏全帙。</p>