# 中庸章句（当涂郡斋刊递修本·善本底）：j 为经传大字，z 为章句小字。版面结构先行：顶格经/退格注。
sections:
  - id: xu
    name: 中庸章句序
    blocks:
      - { type: j, text: 中庸章句序中庸何爲而作也子思憂道學之失其傳而作也蓋自上古聖神繼天立極而道統之傳有自來矣其見於經則允執厥中者堯之所以授舜也人心惟危道心惟微惟精惟一允執厥中者舜之所以授禹也堯之一言至矣盡矣而舜復益之以三言者則所以明夫堯之一言必如是而后可庶幾也蓋嘗論之心之虛靈知覺一而已矣而以為有人心道心之異者則以其或生於形氣之私或原於性命之正而所以為知覺者不同是以或危殆而不安或微妙而難見耳然人莫不有是形故雖上智不能無人心亦莫不有是性故雖下愚不能無道心二者雜於方寸之間而不知所以治之則危者愈危微者愈微而天理之公卒無以勝夫人欲之私矣精則察夫二者之閒而不雜也一則守其本心之正而不離也從事於斯無少閒斷必使道心常為一身之主而人心每聽命焉則危者安微者著而動靜云為自無過不及之差矣夫堯舜禹天下之大聖也以天下相傳天下之大事也以天下之大聖行天下之大事而其授受之際丁寧告戒不過如此則天下之理豈有以加於此哉自是以來聖聖相承若成湯文武之爲君臯陶伊傅周召之爲臣旣皆以此而接夫道統之傳若吾夫子則雖不得其位而所以繼徃聖開來學其功反有賢於堯舜者然當是時見而知之者惟顔氏曽氏之傳得其宗及曽氏之再傳而復得夫子之孫子思則去聖逺而異端起矣子思懼夫愈乆而愈失其眞也於是推本堯舜以來相傳之意質以平日所聞父師之言更互演繹作爲此書以詔後之學者蓋其憂之也深故其言之也切其慮之也逺故其說之也詳其曰天命率性則道心之謂也其曰擇善固執則精一之謂也其曰君子時中則執中之謂也世之相後千有餘年而其言之不異如合符節歷選前聖之書所以提挈綱維開示緼奧未有若是其明且盡者也自是而又再傳以得孟氏爲能推明是書以承先聖之統及其没而遂失其傳焉則吾道之所寄不越乎言語文字之間而異端之說日新月盛以至於老佛之徒出則彌近理而大亂眞矣然而尚幸此書之不泯故程夫子兄弟者出得有所考以續夫千載不傳之緒得有所據以斥夫二家似是之非蓋子思之功於是爲大而微程夫子則亦莫能因其語而得其心也惜乎其所以爲說者不傳而凡石氏之所輯録僅出於其門人之所記是以大義雖明而微言未析至其門人所自爲說則雖頗詳盡而多所發明然倍其師說而淫於老佛者亦有之矣熹自蚤歲即嘗受讀而竊疑之沉潜反復蓋亦有年一旦恍然似有以得其要領者然後乃敢會衆說而折其中旣爲定著章句一篇以竢後之君子而一二同志復取石氏書刪其繁亂名以輯略且記所嘗論辯取舎之意別爲或問以附其後然後此書之旨支分節解脉絡貫通詳略相因巨細畢舉而凡諸說之同異得失亦得以曲暢旁通而各極其趣雖於道統之傳不敢妄議然初學之士或有取焉則亦庶乎行逺升髙之一助云爾淳熙己酉春三月戊申新安朱熹序 }
