# 春秋左傳正義卷59（孔穎達疏）：j 為經文＋杜預注，z 為疏文。
sections:
  - id: juan59
    name: 正文
    blocks:
      - { type: j, text: "【經】十有二年，春，用田賦。（直書之者，以示改法重賦。）" }
      - { type: z, text: "注“直書”至“重賦”。正義曰：“用田賦”者，用田之所收以為賦，令之出牛馬也。依實直書之，以示改常法重賦斂。成元年“作丘甲”，甲是造作之物，故言“作”。馬牛，賦稅以充之，非造作之物，且譏其賦，不譏其作，故書“用”，言舊不用，而今用之。" }
      - { type: j, text: "夏，五月，甲辰，孟子卒。魯人諱娶同姓，謂之孟子，《春秋》不改，所以順時。○娶，本或作“取”，七喻反，又如字。" }
      - { type: z, text: "注“魯人”至“順時”。○正義曰：《論語》雲：“君取於吳為同姓，謂之吳孟子。”是魯人常言稱孟子也。《坊記》雲：“《魯春秋》去夫人之姓曰吳，其死曰孟子卒。”是舊史書為“孟子卒”。及仲尼修《春秋》，以魯人巳知其非，諱而不稱姬氏，諱國惡禮也。因而不改，所以順時世也。”《魯春秋》去夫人之姓曰吳”，《春秋》無此文。《坊記》云然者，禮，夫人初至，必書於策。若娶齊女，則雲“夫人姜氏至自齊”。此孟子初至之時，亦當書曰“夫人姬氏至自吳”，同姓不得稱姬。舊史所書，蓋直雲“夫人至自吳”，是去夫人之姓，直書曰吳而已。仲尼修《春秋》，以犯禮明著，全去其文，故今經無其事。" }
      - { type: j, text: "公會吳於橐皋。橐皋，在淮南逡遒縣東南。○橐，章夜反。一音托。逡音峻，又七倫反。遒音囚，又音巡。" }
      - { type: j, text: "秋，公會衛侯、宋皇瑗於鄖。鄖，發陽也。廣陵海陵縣東南有發繇亭。○繇音遙。" }
      - { type: z, text: "注“鄖發陽也”。○正義曰：十七年傳雲孟武伯問於高柴曰‘諸侯盟，誰執牛耳？’季羔曰‘發陽之役，衛石魋’。指此會也。知鄖即發陽，一也二名也。" }
      - { type: j, text: "宋向巢帥師伐鄭。" }
      - { type: j, text: "冬，十有二月，螽。周十二月，今十月，是歲置閏，而失不置。雖書十二月，實今之九月。司歷誤一月。九月之初尚溫，故得有螽。○螽音終。" }
      - { type: j, text: "【傳】十二年，春，王正月，用田賦。（終前年事。）" }
      - { type: j, text: "夏，五月，昭夫人孟子卒。昭公娶於吳，故不書姓。諱娶同姓，故謂之“孟子”，若宋女。" }
      - { type: z, text: "注“諱娶”至“宋女”。○正義曰：諱娶同姓，不得謂之吳女。宋是子姓，長女字孟，故惠公元妃謂之孟子。今亦稱孟子者，全改其本，若言此夫人是宋國之長女也。《釋例》曰：“經書‘孟子卒’，傳言‘昭公娶於吳，故不書姓’。此為昭公加諱，不復系吳，改其姓號，傳因而弗革也。《論語》謂之吳孟子，蓋時人常言，非經、傳正文也。而賈氏以為言孟子，若言吳之長女也。稱吳長女，既不異於同姓之長女，且娶同姓，長之與少，未聞其異，無所為別也。”" }
      - { type: j, text: "死不赴，故不稱夫人。不稱夫人，故不言薨。不反哭，故不言葬小君。反哭者，夫人禮也。以同姓故，不成其夫人喪。" }
      - { type: z, text: "注“反哭”至“人喪”。○正義曰：禮，既葬，日中自墓反，虞於正寢，所謂反哭於寢。反哭者，是夫人之正禮也。季氏以同姓之故，不成其夫人之喪，不為反哭，故不書葬，所以懲臣子之過也。《釋例》曰：“若昭之孟子者，以同姓為闕。生革其姓，過而知悔也。然吳之大伯，下及魯昭，於親遠矣，所諱在於名義而已。居夫人之位，籍小君之尊，已三世矣。季氏當國而不為之服，至令仲尼釋己之絰，國朝不成其喪，以世適夫人不書於策，此季氏之咎也。”杜言不書於策，謂不以夫人之禮書於經也。" }
      - { type: j, text: "孔子與吊，適季氏。季氏不絻，放絰而拜。孔子始老，故與吊也。絻，喪冠也。孔子以小君禮往吊，季孫不服喪，故去絰，從主節制。○與吊，音預，注同。絻音問。絰，大結反。去，其呂反。" }
      - { type: z, text: "注“孔子”至“節制”。○正義曰：杜以“孔子與吊”，明其巳去臣位。若在臣位，則服小君之喪，不得雲“與吊”而已，故云“孔子始老”。始老者，謂始致事也。劉炫雲：“按十六年，‘仲尼卒，哀公誄之’。子貢譏雲“生不能用’，則是哀公不用仲尼為臣也。又《世家》及諸書無雲仲尼仕於哀公，杜焉得雲‘孔子始老’乎？”今知不然者，以上十一年傳稱仲尼在衛，魯人以幣召之。是召之而來，當以任用，故冉有云“子為國老，待子而行”，後乃致事，故孟子之喪而來與吊。若哀公全不能用，何須以幣召之？但哀公不用其言，故云“生不能用”。於傳文上下理甚符同。劉以為不仕哀朝以規杜過，非也。《喪服》“齊衰三月”章曰“為舊君君之母妻。傳曰：為舊君者孰謂也？仕焉而已者也。何以服齊衰三月？言與民同也。君之母妻則不君也”。鄭玄雲：“仕焉而已者，謂老苦有廢疾而致仕者也。為小君服者，恩深於民也。”是其服與民同，不服臣為小君之服，故與常吊也。禮，齊衰之喪，始死而絻，以至於成服。絻以代吉冠，故以絻為喪冠也。孔子以季孫當服臣為小君之禮，故以小君禮往吊季氏。傳言“適季氏”，謂適季氏哭位，故杜言往吊謂就其哭位也。季孫既不服喪，孔子不得服吊服，故去絰，從主節制也。大夫之吊，服牟絰。鄭玄雲：“弁絰者，如爵弁而素，而加環絰。”“大如緦之絰”，纏而不糾也。《曲禮》雲：“凡非吊喪，非見國君，無不答拜者。”鄭玄雲：“喪賓不答拜，不自賓客也。”禮吊無拜法，而此言孔子放絰而拜者，記言喪賓不答拜，謂喪主既拜賓，賓不答拜耳。其初見主人，或吊者先拜。據此傳文，必有拜法。記無其事，記不具耳。" }
      - { type: j, text: "公會吳於橐皋。吳子使大宰嚭請尋盟。尋鄫盟。公不欲，使子貢對曰：“盟，所以周信也，周，固。故心以制之，制其義。玉帛以奉之，奉贄明神。○贄音至。言以結之，結其信。明神以要之。要以禍福。○要，一遙反，注同。寡君以為苟有盟焉，弗可改也已。若猶可改，日盟何益？今吾子曰，必尋盟。若可尋也，亦可寒也。”尋，重也。寒，歇也。○重，直龍反。歇，許謁反。" }
      - { type: z, text: "注“尋重也寒歇也”。○正義曰：《少牢·有司徹》雲“乃尋屍俎”，鄭玄雲：“尋，溫也。”引此“若可尋也，亦可寒也”。則諸言“尋盟”者，皆以前盟巳寒，更溫之使熱。溫舊即是重義，故以尋為重。傳意言若可重溫使熱，亦可歇之使寒，故言寒歇，不訓寒為歇也。" }
      - { type: j, text: "乃不尋盟。" }
      - { type: j, text: "吳徵會於衛。初，衛人殺吳行人且姚而懼，謀於行人子羽。子羽，衛大夫。○且，子餘反。子羽曰：“吳方無道，無乃辱吾君，不如止也。”子木曰：“吳方無道，子木，衛大夫。國無道，必棄疾於人。吳雖無道，猶足以患衛。為衛患也。往也！長木之斃，無不摽也。摽，擊。○斃，婢世反。摽，敷蕭反，又普交反。國狗之，無不噬也。，狂也。噬，齧也。○狗音苟。，吉世反。噬，市制反。齧，五結反，本或作“咬”。" }
      - { type: z, text: "“長木”至“噬也”。○正義曰：長木，喻吳國大也。狗，喻吳失道也。國狗猶家狗。言家畜狂狗，必齧人也。" }
      - { type: j, text: "而況大國乎？”秋，衛侯會吳於鄖。公及衛侯、宋皇瑗盟，盟不書，畏吳竊盟。" }
      - { type: z, text: "注“盟不”至“竊盟”。○正義曰：畏吳竊盟，恐吳知之，故不敢書於策也。成二年公及楚人、秦人云雲盟於蜀。傳曰：“卿不書，匱盟也。於是乎畏晉而竊與楚盟，故曰匱盟。”彼以畏晉竊盟，故諸侯之卿皆貶而稱“人”。此亦畏吳竊盟，宜應貶此三國。經遂沒而不書者，彼以晉是盟主，諸侯不應背晉，故貶諸侯之卿，以成晉為霸主。此吳以夷禮自處，不合主諸侯之盟，故與吳盟者悉皆不書，是不與吳為盟主也。既不與吳，則三國私盟，於義可許，不合貶責。但魯自不書，仲尼亦從而不書之耳。《釋例》曰：“諸侯畏晉而竊與楚盟，而貶其卿，所以成晉為盟主也。吳之彊大，始於會鄫，終於黃池。凡三會三伐三盟，唯書會伐而不書盟者，吳以盟主自居，而行其夷禮，禮儀不典，則盟神不蠲，非所以結信義、昭明德，故不錄其盟，不與其成為盟主也。既不與吳之為盟主，則宋魯衛三國私盟可許，故無貶文。”是其說也。杜言三會三伐三盟者，七年會於鄫，十二年會於橐皋，十三年會於黃池，是三會也；八年吳伐我，十年公會吳伐齊，十一年齊國書及吳戰於艾陵，是三伐也；七年傳雲夏盟於鄫衍，八年傳雲吳人盟而還，十三年傳雲秋七月辛丑盟吳晉爭先，是三盟也。" }
      - { type: j, text: "而卒辭吳盟。吳人藩衛侯之舍。藩，籬。○藩，方元反，注及下同。籬，力知反。子服景伯謂子貢曰：“夫諸侯之會，事既畢矣，侯伯致禮，地主歸餼，侯伯致禮，以禮賓也。地主，所會主人也。餼，生物。○餼，許氣反。" }
      - { type: z, text: "注“侯伯”至“生物”。○正義曰：侯伯，諸侯之長，謂盟主也。侯伯為主，則諸侯之從已者皆為賓致禮。禮賓，當謂有以禮之，或設飲食與之宴也。地主，所會之地主人也，當歸生物於賓。禮，牲生曰餼。服虔雲：致賓禮於地主。傳言“吳不行禮於衛”衛非地主。" }
      - { type: j, text: "以相辭也。各以禮相辭讓。今吳不行禮於衛，而藩其君舍以難之，難，苦困也。○難，乃旦反。子盍見大宰？”乃請束錦以行。以賂吳。○盍，音戶獵反。語及衛故。若本不為衛請者。○為，於偽反。大宰嚭曰：“寡君原事衛君，衛君之來也緩，寡君懼，故將止之。”止，執。子貢曰：“衛君之來，必謀於其眾。其眾或欲或否，是以緩來。其欲來者，子之黨也。其不欲來者，子之仇也。若執衛君，是墮黨而崇仇也。墮，毀也。○墮，許規反，注及下皆同。夫墮子者，得其志矣。且合諸侯而執衛君，誰敢不懼？墮黨崇仇，而懼諸侯，或者難以霸乎！”大宰嚭說，乃舍衛侯。衛侯歸，效夷言。子之尚幼，子之，公孫彌牟。○說音悅，下同。舍，音舍，釋也；又音赦。效，戶教反。曰：“君必不免，其死於夷乎！執焉，而又說其言，從之固矣。”出公輒後卒死於越。" }
      - { type: j, text: "冬，十二月，螽。季孫問諸仲尼，仲尼曰：“丘聞之，火伏而後蟄者畢。火，心星也。火伏在今十月。○蟄，直切反。今火猶西流，司歷過也。猶西流，言未盡沒。知是九月，歷官失一閏，《釋例》論之備。" }
      - { type: z, text: "注“猶西”至“之備”。○正義曰：《月令》季夏之月，昏火星中。《詩》雲：“七月流火。”《毛傳》雲：“流，下也。”謂昏而見於西南，漸下流也。《周禮·司爟》雲“季秋內火”，是九月之昏火始入，十月之昏則伏矣。猶西流者，言其未盡沒，是夏九月也。經書“十二月”，則是夏十月，歷官失一閏，故以九月為十月。《釋例·長曆》言“諸儒皆以為冬實周之九月，而書十二月，謂之再失閏。若如其言，乃成三失，非但再也。今以《長曆》推《春秋》，此十二月乃夏之九月，實周之十一月也。此年當有閏，而今不置閏，此為失一閏月耳。十二月不應螽，故季孫怪之。仲尼以鬥建在戌，火星尚未盡沒，據今猶見，故言‘猶西流’，明夏之九月尚可有螽也。季孫雖聞仲尼此言，猶不即改。明年十二月復螽，於是始悟，十四年春乃置閏，欲以補正時歷也。傳於十五年書閏月，蓋置閏正之，欲明十四年之閏，於法當在十二年也”。" }
      - { type: j, text: "宋鄭之間有隙地焉，隙地，閒田。○隙，去逆反。間，音閒；又一本作“間地”，一音如字。曰彌作、頃丘、玉暢、嵒、戈、鍚。凡六邑。○彌，亡支反，又亡爾反。頃，苦穎反，又音傾。暢，敕亮反；一本作“王暢”。嵒，五鹹反。戈，古禾反。鍚音羊，一音星曆反。子產與宋人為成，曰：“勿有是。”俱棄之。及宋平、元之族自蕭奔鄭，在定十五年。鄭人為之城嵒、戈、鍚。城以處平、元之族。○為，之於偽反。九月，宋向巢伐鄭，取鍚，殺元公之孫，遂圍嵒。十二月，鄭罕達救嵒，丙申，圍宋師。此事，經在“十二月螽”上，今倒在下，更具列其月以為別者，丘明本不以為義例，故不皆齊同。○倒，丁老反。別，如字，又彼列反。" }
      - { type: z, text: "注“此事”至“齊同”。○正義曰：杜以此與經別，故言丘明不以為義例，故使文不齊同。劉炫以為傳說當時事耳，更倒本隙地之事，載其日月，使與明年相接。今知不然者，案宣二年“壬申，朝於武宮”，是十月五日，下乃雲“冬，趙盾為旄車之族”。彼注云“壬申是十月五日也。既有日而無月，冬又在壬申下，明傳文無較例”。彼既無倒本其事，與後年相接，足知此亦不為倒本其事，使九月在十二月之下，明傳因簡牘舊文，或日月前後不以為例。若以倒敘其事為後年張本，案傳之上下，凡倒敘事為後年張本者，唯道事之所由，不具載其日月。劉以此而規杜過，非也。" }
      - { type: j, text: "【經】十有三年，春，鄭罕達帥師取宋師於嵒。（書“取”，覆而敗之。）夏，許男成卒。（無傳。○成音城，本或作戊。）" }
      - { type: j, text: "公會晉侯及吳子於黃池。陳留封丘縣南有黃亭，近濟水。夫差欲霸中國，尊天子，自去其僣號而稱子，以告令諸侯，故史承而書之。○近，附近之近。去，起呂反。僣，子念反。" }
      - { type: z, text: "注“夫差”至“書之”。○正義曰：七年會吳於鄫，十二年會吳於橐皋，皆不稱子。此稱“吳子”，故解之。夫差欲霸中國，尊天子，而自號為王，則諸侯不服，故去僣號，自稱吳子，以告令諸侯，故諸侯之策承而書曰“吳子”。《吳語》說此事雲，晉侯命董褐告吳王曰：“今君奄王東海，以淫名聞於天下，君有短垣，而自逾之，況蠻荊則何有於周室？夫命圭有命，固曰吳伯，不曰吳王。諸侯是以敢辭。夫諸侯無二君，而周無二王，君若無卑天子，而曰吳公，孤敢不順從君命！”吳王許諾。是其去僣號也。於此會去王號耳，其於吳國猶稱王不改也。" }
      - { type: j, text: "楚公子申帥師伐陳。無傳。" }
      - { type: j, text: "於越入吳。" }
      - { type: j, text: "秋，公至自會。無傳。" }
      - { type: j, text: "晉魏曼多帥師侵衛。無傳。" }
      - { type: j, text: "葬許元公。無傳。" }
      - { type: j, text: "九月，螽。無傳。書災。" }
      - { type: j, text: "冬，十有一月，有星孛於東方。無傳。平旦眾星皆沒，而孛乃見，故不言所在之次。○孛，步內反。見，賢遍反。" }
      - { type: z, text: "注“平旦”至“之次”。○正義曰：《公羊傳》曰：“孛者何？彗星也。其言於東方何？見於旦也。”杜用彼說。眾星皆沒，故不言所在之次。" }
      - { type: j, text: "盜殺陳夏區夫。無傳。稱盜，非大夫。○夏，戶雅反。區，烏侯反。十有二月，螽。無傳。前年季孫雖問仲尼之言，而不正歷，失閏至此年，故復十二月螽，實十一月。○復，扶又反。" }
      - { type: j, text: "【傳】十三年，春，宋向魋救其師。（救前年圍嵒師。）鄭子賸使徇曰：“得桓魋者有賞。”魋也逃歸，遂取宋師於嵒，獲成讙、郜延。（二子，宋大夫。○徇，似俊反。讙，火官反。郜，古報反，又古毒反。）以六邑為虛。（空虛之，名不有。○為虛，並如字，或音墟，非。）" }
      - { type: j, text: "夏，公會單平公、晉定公、吳夫差於黃池。平公，周卿士也。不書，尊之，不與會。○單音善。不與，音預。" }
      - { type: j, text: "六月，丙子，越子伐吳，為二隧。隧，道也。○隧音遂，注同。疇無餘、謳陽自南方，二子，越大夫。○謳，烏侯反。先及郊。吳大子友、王子地、王孫彌庸、壽於姚自泓上觀之。觀越師。泓，水名。○泓，烏宏反。彌庸見姑蔑之旗，姑蔑，越地。今東陽大宋縣。○蔑，亡結反。旗音其。大音泰，孟康雲“大音闥”。曰：“吾父之旗也。彌庸父為越所獲，故姑蔑人得其旌旗。不可以見讎而弗殺也。”大子曰：“戰而不克，將亡國。請待之。”彌庸不可，屬徒五千，屬，會也。○屬音燭，注同。王子地助之。乙酉，戰，彌庸獲疇無餘，地獲謳陽。越子至，王子地守。丙戌，復戰，大敗吳師。獲大子友、王孫彌庸、壽於姚。地守，故不獲。○守，手又反，下注同。復，扶又反。丁亥，入吳。吳人告敗於王，王惡其聞也，惡諸侯聞之。○惡，烏路反，注同。自剄七人於幕下。以絕口。○剄，古頂反。" }
      - { type: j, text: "秋，七月，辛丑，盟，吳晉爭先。爭歃血先後。○歃，所洽反，又所甲反。吳人曰：“於周室，我為長。”吳為大伯後，故為長。○長，丁丈反，注並同。大音泰。晉人曰：“於姬姓，我為伯。”為侯伯。趙鞅呼司馬寅寅，晉大夫。曰：“日旰矣，旰，晚也。○旰，古旦反。大事未成，二臣之罪也。大事，盟也。二臣，鞅與寅。建鼓整列，二臣死之，長幼必可知也。”" }
      - { type: z, text: "“趙鞅”至“知也”。○正義曰：如此傳文，則趙鞅先欲與吳戰也。《吳語》雲：吳晉爭長未成，邊遽仍至，以越亂告。吳王懼，乃合大夫而謀曰：“無會而歸與會而先晉，孰利？”王孫雄先對曰：“二者莫利。必會而先之。”乃為吳王設計布陳，雞鳴乃定。去晉軍一里。昧明，王乃秉枹，鳴鼓，三軍皆譁，聲動天地。於是晉軍大駭，乃令董褐請事。賈逵等皆雲，董褐，司馬寅也。如彼文，則吳請先戰。《國語》各記其國之事，言有彼此，故其文不同。○注“二臣鞅與寅”。○正義曰：杜以鞅呼寅與語，明其同憂國事，故以二臣為鞅與寅也。劉炫以為吳晉二臣。今知不然者，以趙鞅呼司馬寅，自相與語云“建鼓整列，二臣死之”，皆是鞅寅自謂，故知二臣鞅與寅也。鞅既不共吳臣對論曲直，何得以二臣為吳晉之臣？劉以為吳晉之臣而規杜氏，非也。○“建鼓”。○正義曰：建，立也。立鼓，擊之與戰也。《大射禮》雲“建鼓在阼階西”，鄭玄雲：“建猶樹也。以木貫而載之，樹之跗也。”彼謂立之於地，所謂殷人楹鼓，與此別也。" }
      - { type: j, text: "對曰：“請姑視之。”反曰：“肉食者無墨。墨，氣色下。今吳王有墨，國勝乎？國為敵所勝。大子死乎？且夷德輕，不忍久，請少待之。”少待，無與爭。○輕，遣政反。" }
      - { type: z, text: "“反曰”至“死乎”。正義曰：《吳語》說此事雲：“董褐既致命，乃告趙鞅曰：臣觀吳王之色，類有大憂，小則嬖妾，適子死，不然則國有難，大則越入吳，將毒，不可與戰。主其許之。”說與此傳小異。" }
      - { type: j, text: "乃先晉人。盟不書，諸侯恥之，故不錄。" }
      - { type: z, text: "“乃先晉人”。正義曰：《吳語》說此事雲：“吳公先歃，晉侯亞之。”與此異者，經書“公會晉侯及吳子”，傳稱“公會單平公、晉定公、吳夫差”，吳皆在下，晉實先矣。經據魯史策書，傳採魯之簡牘，魯之所書，必是依實。《國語》之書，當國所記，或可曲筆直已，辭有抑揚，故與《左傳》異者多矣。鄭玄雲：不可以《國語》亂周公所定法。傅玄雲：《國語》非丘明所作。凡有共說一事而二文不同，必《國語》虛而《左傳》實，其言相反，不可強合也。" }
      - { type: j, text: "吳人將以公見晉侯，子服景伯對使者曰：“王合諸侯，則伯帥侯牧以見於王。伯，王官伯。侯牧，方伯。○見晉，如字，又賢遍反。使，所吏反。以見，賢遍反。伯合諸侯，則侯帥子男以見於伯。伯，諸侯長。" }
      - { type: z, text: "“王合”至“於伯”。○正義曰：《曲禮》雲：“五官之長曰伯，是職方也。九州之長，入天子之國，曰牧。於外，曰侯。”職方者，二伯各主一方。州長者，州牧，各主一州。《周禮》所謂“八命作牧、九命作伯”是也。“王合諸侯，則伯帥侯牧”，當如康王之誥，太保帥西方諸侯，畢公帥東方諸侯，以見於王也。計當盡帥諸侯，獨言帥侯牧者，舉尊而言，其實盡帥之也。“伯合諸侯，則侯帥子男”。侯，謂牧也，牧帥諸國之君見於伯也，亦當盡帥在會諸侯，獨雲子男，舉小為言，其實亦見在會者，盡帥以見伯也。" }
      - { type: j, text: "自王以下，朝聘玉帛不同。故敝邑之職貢於吳，有豐於晉，無不及焉，以為伯也。今諸侯會，而君將以寡君見晉君，則晉成為伯矣，敝邑將改職貢。魯賦於吳八百乘。若為子男，則將半邾以屬於吳，半邾，三百乘。○豐，芳中反。乘，繩證反，下及注同。而如邾以事晉。如邾，六百乘。" }
      - { type: z, text: "“故敝”至“伯也”。○正義曰：言共職貢於吳，有豐於晉，無有不及晉時，以吳為伯故也。○“魯賦”至“事晉”。○正義曰：七年傳茅夷鴻請救於吳雲“魯賦八百乘，君之貳也。邾賦六百乘，君之私也。”今魯賦八百乘以貢於吳，以吳為伯故也。吳今帥魯以見於晉，則吳為州牧，魯為子男，晉成伯矣。邾是子爵，以六百乘貢吳，邾以吳為伯故也。魯既以晉為伯，吳為牧，牧卑於伯，則將半邾三百乘以屬於吳，而如邾六百乘以事於晉也。" }
      - { type: j, text: "且執事以伯召諸侯，而以侯終之，何利之有焉？”吳人乃止。既而悔之，謂景伯欺之。將囚景伯。景伯曰：“何也立後於魯矣。何，景伯名。將以二乘與六人從，遲速唯命。”遂囚以還。及戶牖，戶牖，陳留外黃縣西北東昏城是。○從，才用反。牖音酉。謂太宰曰：“魯將以十月上辛，有事於上帝先王，季辛而畢。何世有職焉，有職於祭事。" }
      - { type: z, text: "“魯將”至“而畢”。○正義曰：七月，辛丑，盟，囚景伯以還。今景伯稱十月，當謂周之十月。周之十月，非祭上帝先公之時，且祭禮終朝而畢，無上辛盡於季辛之事。景伯以吳信鬼，皆虛言以恐吳耳。" }
      - { type: j, text: "自襄以來，未之改也。魯襄公。若不會，祝宗將曰：‘吳實然。’言魯祝宗將告神雲：景伯不會，坐為吳所囚。吳人信鬼，故以是恐之。○坐，才臥反。恐，丘勇反。且謂魯不共，而執其賤者七人，何損焉？”大宰嚭言於王曰：“無損於魯，而祗為名，適為惡名。○共音恭。祗音支。不如歸之。”乃歸景伯。吳申叔儀乞糧於公孫有山氏。申叔儀，吳大夫；公孫有山，魯大夫，舊相識。曰：“佩玉兮，餘無所系之。然服飾備也，已獨無以系佩。言吳王不恤下。○，而捶反，又而水反。旨酒一盛兮，餘與褐之父睨之。”一盛，一器也。睨，視也。褐，寒賤之人。言但得視，不得飲。○盛音成，又市政反，注同。褐，戶葛反。父如字，又音甫。睨，五計反。" }
      - { type: z, text: "注“一盛”至“得飲”。○正義曰：酒盛於器，故謂一器為一盛。《說文》雲：“睨，邪視也。”《詩》雲：“無衣無褐，何以卒歲！”鄭玄雲：“褐，毛布也。人之貴者無衣，賤者無褐。”是褐者寒賤人之衣服也。言我與彼褐之父，但得共邪視之，不得飲之。告己之乏飲也。" }
      - { type: j, text: "對曰：“粱則無矣，粗則有之。若登首山以呼曰，庚癸乎！則諾。”軍中不得出糧，故為私隱。庚，西方，主穀。癸，北方，主水。傳言吳子不與士共飢渴，所以亡。○粗，本又作<分鹿}，七奴反。呼，火故反。" }
      - { type: z, text: "“對曰”至“則諾”。○正義曰：食以稻粱為貴，故以梁表精。若求梁米之飯，則無矣；粗者，則有之。若我登首山以叫呼“庚癸乎”，女則諾。軍中不得出糧與人，故作隱語，為私期也。庚在西方，穀以秋熟，故以庚主穀。癸在北方，居水之位，故以癸主水。言欲致餅並致飲也。《土地名》首山，闕，不知其處。當在吳所營車之旁。" }
      - { type: j, text: "王欲伐宋，殺其丈夫，而囚其婦人。以宋不會黃池故。言吳子悖惑。○殺其丈夫，直兩反，又作“大夫”，誤。悖，補內反。大宰嚭曰：“可勝也，而弗能居也。”乃歸。冬，吳及越平。終伍員之言。" }
      - { type: z, text: "“吳及越平”。正義曰：言吳不能報越，求與之平。終伍員所謂“三年始弱”也。" }
      - { type: j, text: "【經】十有四年，春，西狩獲麟。（麟者，仁獸，聖王之嘉瑞也。時無明王，出而遇獲。仲尼傷周道之不興，感嘉瑞之無應，故因《魯春秋》而脩中興之教，絕筆於獲麟之一句，所感而作，固所以為終也。冬獵曰狩，蓋虞人脩常職，故不書狩者。大野在魯西，故言“西狩”。得用曰獲。○狩，手又反。麟，呂辛反，又力珍反，瑞獸也。解見《詩音》。瑞，常恚反。應，應對之應。中，丁仲反。）" }
      - { type: z, text: "注“麟者”至“曰獲”。○正義曰：《公羊傳》曰：“麟者，仁獸也。”何休雲：“一角而戴肉，設武備而不為害，所以為仁也。”鄭玄《詩箋》雲：“麟角之末有肉，示有武而不用。”《釋獸》雲：“麐，麕身，牛尾，一角。”李巡曰：“麟，瑞應獸名。”孫炎曰：“靈獸也。”京房《易傳》曰：“麟，麕身牛尾，狼額馬蹄，有五采，腹下黃，高丈二。”《廣雅》雲：“麒麟，狼頭肉角，含仁懷義，音中鍾呂，行步中規，折旋中矩，游必擇土，翔必有處，不履生蟲，不折生草，不群不旅，不入陷阱，不入羅網，文章斌斌。”《說文》雲：“麒，仁獸。從鹿，其聲。麟，大牝鹿也。從鹿，粦聲。”《公羊傳》曰：“麟，有王者則至，無王者則不至”。《孝經·援神契》雲：“德至鳥獸，則麒麟臻。”是言麟為聖王之嘉瑞也。此時無明王，麟出無所應也。出而遇獲，失其所以歸也。夫以靈瑞之物，轗軻若是，聖人見此，能無感乎？所以感者，以聖人之生非其時，道無所施，言無所用，與麟相類，故為感也。仲尼見此獲麟，於是傷周道之不興，感嘉瑞之無應，故因《魯春秋》文加褒貶而脩中興之教。若能用此道，則周室中興，故謂《春秋》為中興之教也。《春秋》編年之書，不待年終，而絕筆於獲麟之一句者，本以所感而作，故所以用此為終也。《釋天》雲：“冬獵為狩。”周之春，夏之冬，故稱狩也。桓四年“公狩於郎”，莊四年“公及齊人狩於禚”，禚郎二者，公親行，皆書公狩。此狩不書公卿者，蓋是虞人賤官，自修常職，公卿不行，故不書狩者名氏。此狩常事，本不合書，書之，為獲麟故也。傳稱“狩於大野”，大野之澤在魯國之西，故言“西狩”。“得用曰獲”，定九年傳例也。杜以獲麟之義，唯此而已。先儒穿鑿，妄生異端。《公羊傳》曰：“有以告者，曰：‘有麕而角者。’孔子曰：‘孰為來哉？孰為來哉？’反袂拭面，涕沾袍，曰：‘吾道窮矣。’說《公羊》者雲：麟是漢將受命之瑞，周亡天下之異，夫子知其將有六國爭彊，秦項交戰，然後劉氏乃立。夫子深閔民之離害，故為之隕泣。麟者，太平之符，聖人之類。又云：麟得而死，此亦天告夫子將沒之徵也。案：此時去漢二百七十有餘年矣。漢氏起於匹夫，先無王跡，前期三百許歲，天已豫見徵兆，其為靈命，何大遠乎？言既不經，事無所據，苟佞時世，妄為虛誕，故杜氏序雲：“至於反袂拭面，稱吾道窮，亦無取焉。”蓋賤其虛誣，鄙其妖妄，故無所取之也。說《左氏》者雲：麟生於火，而游於土，中央軒轅，大角之獸。孔子作《春秋》。《春秋》者，禮也，脩火德以致其子，故麟來而為孔子瑞也。奉德侯陳欽說麟，西方毛蟲金精也。孔子作《春秋》，有立言，西方兌為口，故麟來。許慎稱劉向、尹更始等皆以為吉凶不併，瑞災不兼。今麟為周異，不得復為漢瑞，知麟應孔子而至。鄭玄以為脩母致子不如立言之說密也。賈逵、服虔、潁容等皆以為孔子自衛反魯，考正禮樂，脩《春秋》，約以周禮，三年文成致麟，麟感而至，取龍為水物，故以為脩母致子之應。若然，龍為水物，以其育於水耳，麟生於火，豈其產於火乎？孔子之作《春秋》，門徒盡知之矣。丘明親承聖旨，目見獲麟，丘明何以不言？弟子何以不說？子思、孟軻去聖尤近，荀卿著書，尊崇孔德，麟若應孔子而來，著書無容不述，何乃經傳群籍了爾不言？以其既妖且妄，故杜悉無所取。" }
      - { type: j, text: "小邾射以句繹來奔。射，小邾大夫。句繹，地名。《春秋》止於獲麟，故射不在三叛人之數。自此以下至十六年，皆《魯史記》之文，弟子欲存孔子卒，故並錄以續孔子所脩之經。○射音亦。句，古侯反。繹音亦。" }
      - { type: z, text: "注“射小”至“之經”。○正義曰：此文與“邾庶其、黑肱、莒牟夷”文同，知射是小邾大夫，以句繹之地來奔魯也。其事既同，其罪亦等。傳稱庶其等為三叛人，不通數此為四叛人者，以《春秋》之經止於獲麟。獲麟以上褒貶是仲尼之意，此雖文與彼同，而事非孔意，故不數也。若然，魯史書此舊與彼同，則竊地顯名，史先然矣。而昭三十一年傳盛論書三叛人名，懲不義也，其善志也。杜言書曰故書，皆是仲尼新意。案此類彼，則彼是舊文。言新意者，仲尼所脩有因有革。因者雖是仲尼因舊，舊合仲尼之心，因而不改，即是新意。所以彼傳歸功脩者，謂之“善志”，為傳所以脩之既定，乃成為善也。故《釋例·終篇》杜自問而釋之雲：“丘明之為傳，所以釋仲尼《春秋》，仲尼《春秋》皆因舊史策書，義之所在，則時加增損，或仍舊史之無，或改舊史之有，雖因舊文，固是仲尼之書也。丘明所發，固是仲尼之意也。”是其說也。《公羊》、《穀梁》之經皆至獲麟而盡。《左氏》之經更有此下事者，自此以下至十六年，皆是魯史記事之正文也。仲尼所脩，脩此記也。此上仲尼脩記，此下是其本文。弟子欲存孔子卒，故因經之末並錄魯之舊史，以續孔子所脩之經，記仲尼卒之月日，示後人使知之耳。賈逵亦云，此下弟子所記，但不言是魯之舊史耳。" }
      - { type: j, text: "夏，四月，齊陳恆執其君，寘於舒州。○寘，之豉反。" }
      - { type: z, text: "“陳恆執其君”。○正義曰：成十七年晉欒書執晉厲公，亦先執後弒，與此事同。彼不書者，或此告彼不告，且此非孔子所脩，不可以為例也。" }
      - { type: j, text: "庚戌，叔還卒。無傳。" }
      - { type: j, text: "五月，庚申，朔，日有食之。無傳。陳宗豎出奔楚。無傳。○豎，上主反。" }
      - { type: j, text: "宋向魋入於曹以叛。曹，宋邑。○向，舒丈反。魋，徒回反。" }
      - { type: j, text: "莒子狂卒。無傳。○狂，其廷反。" }
      - { type: j, text: "六月，宋向魋自曹出奔衛。宋向巢來奔。" }
      - { type: j, text: "齊人弒其君壬於舒州。" }
      - { type: z, text: "“齊人弒其君壬”。○正義曰：宣四年傳例曰：“凡弒君稱君，君無道也；稱臣，臣之罪也。”發凡言例，是周公舊典。此魯史不書陳恆之名，蓋依凡例以齊君無道故。" }
      - { type: j, text: "秋，晉趙鞅帥師伐衛。無傳。○鞅，於丈反。" }
      - { type: j, text: "八月，辛丑，仲孫何忌卒。" }
      - { type: j, text: "冬，陳宗豎自楚復入於陳，陳人殺之。無傳。○復，扶又反。陳轅買出奔楚。無傳。" }
      - { type: j, text: "有星孛。無傳。不言所在，史失之。○孛，步內反。" }
      - { type: j, text: "飢。無傳。" }
      - { type: j, text: "【傳】十四年，春，西狩於大野，叔孫氏之車子鉏商獲麟，（大野，在高平鉅野縣東北大澤是也。車子，微者，鉏商，名。○鉏，仕居反。）" }
      - { type: z, text: "注“大野”至“商名”。○正義曰：巨訓大也。由其旁有大澤，故縣以鉅野為名。其澤在曲阜之西，故稱西狩。不書地者，得常不書也。賈逵雲：周在西，明夫子道系周。服虔雲：“言西者，有意於西，明夫子有立言，立言之位在西方，故著於西也。”按：此澤實在魯西，舊史因書西耳。仲尼不改舊史，何以得示己意？若其本實東狩，仲尼不得輒改為西，以己意之所示，妄改魯之狩處，雖則下愚，知其不可。豈有斯人而為斯事？以此立說，何妄之甚！杜以“車子”連文為將車之子，故為微者。鉏商是其名也。《家語》說此事雲：“叔孫氏之車士曰子鉏商。”王肅雲：車士，將車者也。子，姓。鉏商，名。今傳無“士”字。服虔雲：“車，車士，微者也。子，姓；鉏商，名。”以子為姓，與杜異。" }
      - { type: j, text: "以為不祥，以賜虞人。時所未嘗見，故怪之。虞人，掌山澤之官。" }
      - { type: z, text: "“以為”至“虞人”。○正義曰：《家語》雲：“子鉏商採薪於大野，獲麟焉，折其前左足，載而歸。叔孫以為不祥，棄之於郭外。使人告於孔子，孔子曰：‘麟也。’然後取之。”王肅雲：傳曰狩，此曰採薪，時實狩獵，鉏商非狩者，採薪而獲麟也。傳曰“以賜虞人”，此雲“棄之於郭外”，棄之於郭外，所以賜虞人也。然肅意欲成彼《家語》，令與經、傳符同，故強為之辭，冀合其說，要其文正乖，不可合也。今傳言狩而獲麟，非採薪者也。鉏商不是狩者，麟非狩之所獲，何以書為狩乎？以賜虞人，虞人當受之矣。棄之郭外，非賜人之辭，不得棄之以為賜人也。《公羊傳》曰：“西狩獲麟，何以書？記異也。何異爾？非中國之獸也。然則孰狩之？薪採者也。薪採者，則微者也。曷為以狩言之？大之也。曷為大之？為獲麟大之也。”則《公羊》之意，當時實無狩者，為大麟而稱狩也。《家語》雖出孔家，乃是後世所錄，取《公羊》之說節之以成文耳，不可與《左氏》合也。" }
      - { type: j, text: "仲尼觀之，曰：“麟也。”然後取之。言魯史所以得書獲麟。" }
      - { type: z, text: "注“言魯”至“獲麟”。○正義曰：若舉國不識，則無由得書。傳說“仲尼觀之”，言魯史所以得書獲麟由仲尼辨之故也。服虔雲：仲尼名之曰麟，明麟為仲尼至也。然則麟非常見，魯人所疑，仲尼聖者，所言必信，故魯從而取之。此則愚民之信聖也。服虔以仲尼名之，即雲“為仲尼至”，然則防風之骨、肅慎之矢、季氏之墳羊、楚王之萍實，皆問仲尼而後知，豈為仲尼至也？" }
      - { type: j, text: "小邾射以句繹來奔，曰：“使季路要我，吾無盟矣。”子路信誠，故欲得與相要誓，而不須盟。孔子弟子既續書魯策以系於經，丘明亦隨而傳之，終於哀公以卒前事。其異事則皆略而不傳，故此經無傳者多。○要，於妙反，又一遙反，注同。使子路，子路辭。季康子使冉有謂之曰：“千乘之國，不信其盟，而信子之言，子何辱焉？”對曰：“魯有事於小邾，不敢問故，死其城下可也。彼不臣而濟其言，是義之也。由弗能。”濟，成也。○乘，繩證反，年內同。" }
      - { type: z, text: "“使子”至“弗能”。○正義曰：季孫之意，以小邾射不信千乘之國，而信子路之言，是其重子路過於一國，子路當以為榮，不宜恥與言約。子路之意，魯伐小邾，非己能禁，將令己言不信，不可與射約也。又射是竊地叛臣，臣之罪惡者也，而子路與之相要，便是以射為義，恥與不義交好，故辭而不能也。" }
      - { type: j, text: "齊簡公之在魯也，闞止有寵焉。簡公，悼公陽生子壬也。闞止，子我也。事在六年。○闞，苦暫反。及即位，使為政。陳成子憚之，驟顧諸朝。成子，陳常。心不安，故數顧之。○憚，大旦反。驟，仕救反。數，所角反。諸御鞅言於公鞅，齊大夫。曰：“陳、闞不可並也，君其擇焉。”擇用一人。弗聽。子我夕，夕視事。陳逆殺人，逢之，陳逆，子行，陳氏宗也。子我逢之。遂執以入。執逆至朝。陳氏方睦，欲謀齊國，故宗族和。使疾而遺之潘沐，備酒肉焉，使詐病，因內潘沐，並得內酒肉。潘，米汁，可以沐頭。○遺，唯季反。潘，芳袁反，注皆同。沐音木。汁，之十反。饗守囚者，醉而殺之而逃。子我盟諸陳於陳宗。失陳逆，懼其反為患，故盟之。" }
      - { type: z, text: "“盟諸陳於陳宗”。○正義曰：陳宗，陳氏宗主，謂陳成子也。盡集陳氏宗族，就成子家盟也。" }
      - { type: j, text: "初，陳豹欲為子我臣，豹，亦陳氏族。使公孫言已，言已，介達之。○介，音界，媒介也，亦因也。巳有喪而止。既而言之，既，終喪也。曰：“有陳豹者，長而上僂，肩背僂。○長，如字，又丁丈反。僂，力主反。望視，目望陽。事君子必得志。得君子意。欲為子臣，吾憚其為人也，恐多詐。故緩以告。”子我曰：“何害？是其在我也。”使為臣。他日，與之言政，說，遂有寵。謂之曰：“我盡逐陳氏，而立女，若何？”對曰：“我遠於陳氏矣。言已疏遠。○說音悅。女音汝。遠如字，又子萬反。且其違者，不過數人，違，不從也。○數，所注反。何盡逐焉？”遂告陳氏。子行曰：“彼得君，弗先，必禍子。”子行舍於公宮。子行逃，而隱於陳氏。今又隱於公宮。夏，五月，壬申，成子兄弟四乘如公。成子之兄弟，昭子莊、簡子齒、宣子夷、穆子安、廩丘子意茲、芒子盈、惠子得，凡八人，二人共一乘。○廩，力甚反。芒音亡。" }
      - { type: z, text: "注“成子”至“一乘”。正義曰：案《世本》僖子生昭子莊、簡子齒、宣子其夷、穆子安、廩丘子鑿茲、芒子盈、惠子得。" }
      - { type: j, text: "子我在幄，幄，帳也。聽政之處。○幄，於角反。處，昌慮反。出逆之。遂入，閉門。成子入，反閉門，不納子我。侍人御之，子我侍人。○御，本亦作“御”，魚呂反。子行殺侍人。素在內，故得殺人。公與婦人飲酒於檀臺，成子遷諸寢。徙公使居正寢。○檀，大丹反。公執戈，將擊之。疑其欲作亂。大史子餘曰：“非不利也，將除害也。”言將為公除害。○大音泰。將為，於偽反，下文“逆為餘請”、下注“為公”同。成子出舍於庫，以公怒故。聞公猶怒，將出，曰：“何所無君？”子行抽劍曰：“需，事之賊也。言需疑則害事。○需音須。誰非陳宗？言陳氏宗族眾多。" }
      - { type: z, text: "“誰非陳宗”。○正義曰：子行稱國內之人誰非陳宗，言陳氏宗族眾多，力足成事，何為畏子我欲出奔？" }
      - { type: j, text: "所不殺子者，有如陳宗！”言子若欲出，我必殺子，明如陳宗。" }
      - { type: z, text: "“所不”至“陳宗”。○正義曰：子行慮其必出，故以殺子懼之。陳宗，謂陳之先人。此稱“有如陳宗”，由定六年孟懿子謂範獻子曰“所不以陽虎為中軍司馬者，有如先君”。彼注云“稱先君以徵其言”。此亦然也。服虔雲：陳宗，先祖鬼神也。" }
      - { type: j, text: "乃止。子我歸，屬徒攻闈與大門，闈，宮中小門。大門，公門也。○屬，之欲反。闈音韋。" }
      - { type: z, text: "注“闈宮”至“門也”。○正義曰：《釋宮》雲：“宮中之門謂之闈。”孫炎曰：“宮中相通小門也。”成子在公宮內，知大門公門也。討闈在宮內，必是得入大門乃得至闈。今言攻闈與大門皆不勝者，公宮非止一門，蓋從別門而入，兵得至闈，故與大門並攻也。" }
      - { type: j, text: "皆不勝，乃出。陳氏追之，失道於弇中，適豐丘。弇中，狹路。豐丘，陳氏邑。○弇，於檢反，又音淹。狹音洽。豐丘人執之以告，殺諸郭關。齊關名。成子將殺大陸子方，子方，子我臣。陳逆請而免之，以公命取車於道。子方取道中行人車。及耏，眾知而東之。知其矯命，奪車遂使東。○而彡音而。矯，本又作“橋”，居表反。出雍門，齊城門也。○雍，於用反。陳豹與之車，弗受，曰：“逆為餘請，豹與余車，餘有私焉。事子我而有私於其讎，何以見魯、衛之士？”傳言陳氏務施。○施，式豉反。東郭賈奔衛。賈，即子方。庚辰，陳恆執公於舒州。公曰：“吾早從鞅之言，不及此。”悔不誅陳氏。" }
      - { type: j, text: "宋桓魋以寵，害於公。恃寵驕盈。公使夫人驟請享焉，而將討之。夫人，景公母也。數請享飲，欲因請討之。○數，所角反。未及，魋先謀公，請以鞍易薄。鞍，向魋邑。薄，公邑。欲因易邑，為公享宴而作亂。○鞍音安。公曰：“不可。薄，宗邑也。”宗廟所在。乃益鞍七邑，而請享公焉。偽喜於受賜。以日中為期，家備盡往。甲兵之備。公知之，告皇野曰：“餘長魋也。少長育之。皇野，司馬子仲。○長，丁丈反，注同。少，詩照反。今將禍餘，請即救。”司馬子仲曰：“有臣不順，神之所惡也，而況人乎？敢不承命。不得左師不可，左師，向魋兄向巢也。○惡，烏路反。請以君命召之。”左師每食擊鍾。聞鍾聲，公曰：“夫子將食。”既食，又奏。奏樂。公曰：“可矣。”以乘車往，曰：“跡人來告主跡禽獸者。○跡，子亦反。" }
      - { type: z, text: "注“主跡禽獸者”。○正義曰：《周禮·地官》“跡人掌邦田之地政。凡田獵者受令焉”。鄭玄雲：“跡之言跡知禽獸之處也。”" }
      - { type: j, text: "曰：‘逢澤有介麇焉。’《地理志》言逢澤在熒陽開封縣東北，遠，疑非。介，大也。○介音界。麇，九倫反，獐也；本又作“麋”，亡悲反。" }
      - { type: z, text: "注“地理”至“大也”。○正義曰：《漢書·地理志》雲：“開封縣，逢澤在東北，或曰宋之逢澤也。”臣瓚案：“《汲郡古文》梁惠王廢逢忌之藪以賜民，今浚儀縣有逢忌陂是也。”《土地名》：“宋都雎陽”，計去開封四百餘裏，非輕行可到，故杜以“遠，疑非”也。蓋於宋都之旁別有近地名逢澤也。介，大也，《釋詁》文。案：《方言》“畜無耦曰介”。杜雲“大”者，逢澤大處，不應唯有一麇，若跡人止告一麇，不應公喚左師俱獵，故以介為大。劉炫以為一麇而規杜氏，非也。" }
      - { type: j, text: "公曰：‘雖魋未來，得左師，吾與之田，若何？’皇野稱公命。君憚告子。難以游戲煩大臣。○難，乃旦反，下文及注同。野曰：‘嘗私焉。’嘗，試也。君欲速，故以乘車逆子。”與之乘，至，公告之故，拜不能起。司馬曰：“君與之言。”使公與要誓。公曰：“所難子者，上有天，下有先君。”言雖誅魋，要不負言，使禍難及子。對曰：“魋之不共，宋之禍也。敢不唯命是聽。”司馬請瑞焉，瑞，符節，以發兵。" }
      - { type: z, text: "注“瑞符節以發兵”。○正義曰：《周禮·典瑞》雲：“牙璋以起軍旅，以治兵守。”鄭眾雲：“牙璋琢以為牙，牙齒兵象，故以牙璋發兵，若今特以銅虎符發兵也。”彼用牙璋，天子之法，諸侯於其封內亦自以瑞發兵，其物無文以言之。" }
      - { type: j, text: "以命其徒攻桓氏。桓氏，向魋。其父兄故臣曰：“不可。”司馬故臣與桓魋無怨者。其新臣曰：“從吾君之命。”遂攻之。子頎騁而告桓司馬。子頎，桓魋弟。桓司馬即魋也。○頎音祈。騁，敕領反。司馬欲入，入攻君。子車止之，車亦魋弟。曰：“不能事君，而又伐國，民不與也，祇取死焉。”向魋遂入於曹以叛。哀八年，宋滅曹以為邑。○祇音支。六月，使左師巢伐之，欲質大夫以入焉。巢不能克魋，恐公怒，欲得國內大夫為質，還入國。○質音致，注及下同。不能。亦入於曹取質。不能得大夫，故入曹，劫曹人子弟而質之，欲以自固。魋曰：“不可。既不能事君，又得罪於民，將若之何？”乃舍之。舍曹子弟。○舍音赦，又音舍，注同。民遂叛之。向魋奔衛。向巢來奔，宋公使止之，曰：“寡人與子有言矣，不可以絕向氏之祀。”辭曰：“臣之罪大，盡滅桓氏可也。若以先臣之故，而使有後，君之惠也。若臣則不可以入矣。”司馬牛致其邑與珪焉，而適齊。牛，桓魋弟也。珪，守邑符信。向魋出於衛地，公文氏攻之，公文氏，衛大夫。求夏后氏之璜焉。與之他玉，而奔齊，陳成子使為次卿。司馬牛又致其邑焉，而適吳。示不與魋同。○夏，戶雅反。璜音黃。吳人惡之而反。趙簡子召之，陳成子亦召之，卒於魯郭門之外，坑氏葬諸丘輿。坑氏，魯人也。泰山南城縣西北有輿城。錄其卒葬所在，愍賢者失所。○惡，烏路反。坑，苦庚反，或音岡。輿音餘。" }
      - { type: j, text: "甲午，齊陳恆弒其君壬於舒州。壬，簡公也。孔丘三日齊，而請伐齊三。公曰：“魯為齊弱久矣，子之伐之，將若之何？”對曰：“陳恆弒其君，民之不與者半。以魯之眾，加齊之半，可克也。”公曰：“子告季孫。”孔子辭。辭不告。○三日齊，側皆反；本又作“齋”。伐齊三，如字，又息皆反。退而告人，曰：“吾以從大夫之後也，故不敢不言。”嘗為大夫而去，故言後。" }
      - { type: z, text: "“孔丘”至“告人”。○正義曰：《論語》錄此事與此小異。彼雲“沐浴而朝”，此雲“齊而請”。彼雲“公曰告夫三子”，此雲“公曰子告季孫”。禮齊必沐浴，三子，季孫為長。各記其一，故不同耳。彼於“退而告人”之下又云“之三子告”。此無文者，傳是史官所錄，記其與君言耳。退後別告三子，唯弟子知之。史官不見其告，故傳無文也。" }
      - { type: j, text: "初，孟孺子洩將圉馬於成。洩，孟懿子之子孟武伯也。圉，畜養也。成，孟氏邑。○洩，息列反。圉，魚呂反。成宰公孫宿不受，曰：“孟孫為成之病，不圉馬焉。”病，謂民貧困。○為，於偽反。孺子怒，襲成。從者不得入，乃反。成有司使，孺子鞭之。恨恚，故鞭成有司之使人。○從者，才用反。使，所吏反，注同。恚，一瑞反。秋，八月，辛丑，孟懿子卒。成人奔喪，弗內。袒免哭於衢。聽共，弗許。請聽命共使。○內，如字，又音納。袒音怛。免音問。衢，其俱反。共音恭，注同。懼，不歸。不敢歸成，為明年成叛傳。" }
      - { type: j, text: "【經】十有五年，春，王正月，成叛。" }
      - { type: j, text: "夏，五月，齊高無丕出奔北燕。無傳。○丕，普悲反。" }
      - { type: j, text: "鄭伯伐宋。無傳。" }
      - { type: j, text: "秋，八月，大雩。無傳。○雩音於。" }
      - { type: j, text: "晉趙鞅帥師伐衛。" }
      - { type: j, text: "冬，晉侯伐鄭。無傳。" }
      - { type: j, text: "及齊平。魯與齊平。" }
      - { type: j, text: "衛公孟彄出奔齊。無傳。○彄，苦侯反。" }
      - { type: j, text: "【傳】十五年，春，成叛於齊。武伯伐成，不克，遂城輸。（以逼成。）夏，楚子西、子期伐吳，及桐汭。（宣城廣德縣西南有桐水，出白石山西北，人丹陽湖。○汭，如銳反。）陳侯使公孫貞子吊焉，（吊為楚所伐。）及良而卒。（良，吳地。）將以屍入，（《聘禮》：“若賓死，未將命，則既斂於棺，造於朝，介將命。”○斂，力驗反，下同。造，七報反，下文同。介音界。下文注皆仿此。）" }
      - { type: z, text: "注“聘禮”至“將命”。正義曰：《聘禮》文也。服虔雲：“在床曰屍，在棺曰柩。”禮稱“既斂於棺”，傳言“將以屍入”者，記言對文耳，散則可以通。隱元年傳曰“贈死不及屍”，注云“屍，未葬之通稱也”。案《聘禮》“賓入竟而死，遂也，主人為之具而殯，介攝其命。君吊，介為主人。主人歸禮幣，必以用。介受賓禮，無辭也，不饗食”。此謂入竟未至國都，賓死，其禮如此。《聘禮》又云：“若賓死，未將命，則既斂於棺，造於朝，介將命。”鄭注云：“未將命，謂俟間之後也。”此謂賓已至朝，主人將欲行禮，賓請間之後，賓死，以柩造朝，以屍將事。今公孫貞子卒於竟內，依禮唯可以屍而入，殯於賓館，不合以柩造朝，以屍將事。今上介芋尹雲“以屍將事”者，以吳人不納，故芋尹引禮，深以辯之。杜以傳有“以屍將事”，故引《聘禮》“斂於棺，造於朝，介將命”以釋之。其實貞子當殯於館，不得以屍將事也。" }
      - { type: j, text: "吳子使大宰嚭勞，且辭曰：“以水潦之不時，無乃廩然隕大夫之屍，廩然，傾動貌。○勞，力報反。潦音老。廩，力甚反。隕，于敏反，下同。以重寡君之憂。寡君敢辭上介。”芋尹蓋對蓋，陳大夫，貞子上介。○重，直用反，下注同。“寡君敢辭上介”，絕句。芋，音於付反。曰：“寡君聞楚為不道，薦伐吳國，薦，重也。○薦，在遍反。滅厥民人。寡君使蓋備使，吊君之下吏。備，猶副也。○備使，所吏反。蓋，芋尹蓋，辭同。無祿，使人逢天之戚，大命隕隊，絕世於良，絕世，猶言棄世。廢日共積，廢行道之日，以共具殯斂所積聚之用。○共音恭，注同。積，子賜反，又如字，注同。殯，必刃反。聚，才喻反，又如字。一日遷次。一日便遷次，不敢留君命。今君命逆使人曰：‘無以屍造於門。’是我寡君之命委於草莽也。且臣聞之曰：‘事死如事生，禮也。’於是乎有朝聘而終，以屍將事之禮，朝聘道死，以屍行事。○莽，亡黨反。" }
      - { type: z, text: "“於是”至“之禮”。○正義曰：上注所引者，是聘賓終以屍將事之禮。《聘禮》又云：“聘遭喪，入竟則遂也，不郊勞，不筵几，主人畢歸禮，賓唯饔餼之受。”是聘而遭喪之禮也。其朝禮雖亡，賓終及主遭喪，必亦有禮。文六年“季文子聘於晉，求遭喪之禮”是也。" }
      - { type: j, text: "又有朝聘而遭喪之禮。遭所聘之喪。若不以屍將命，是遭喪而還也，無乃不可乎！以禮防民，猶或逾之。今大夫曰：‘死而棄之’，是棄禮也。其何以為諸侯主？謂主盟也。先民有言曰：‘無穢虐士。’虐士，死者。備使奉屍將命，苟我寡君之命達於君所，雖隕於深淵，則天命也。非君與涉人之過也。”吳人內之。傳言芋尹蓋知禮。○內，如字，又音納。" }
      - { type: j, text: "秋，齊陳瓘如楚。瓘，陳恆之兄子玉也。○瓘，古喚反。過衛，仲由見之，仲由，子路。○過，古禾反。曰：“天或者以陳氏為斧斤，既斫喪公室，而他人有之，不可知也。其使終饗之，亦不可知也。饗，受也。○斫，陟角反。喪，息浪反，下並注皆同。若善魯以待時，不亦可乎？何必惡焉？”仲由事孔子，故為魯言。○故為，於偽反，下“為衛”、“為請”並同。子玉曰：“然，吾受命矣。子使告我弟。”弟，成子也。" }
      - { type: j, text: "冬，及齊平。子服景伯如齊，子贛為介，見公孫成，公孫成，成宰公孫宿也。曰：“人皆臣人，而有揹人之心。況齊人雖為子役，其有不貳乎？言子叛魯，齊人亦將叛子。○背音佩。" }
      - { type: z, text: "“曰人”至“貳乎”。○正義曰：“人皆臣人”，謂凡人皆臣事於人，當一心事上。今公孫成“而有揹人之心”，謂背魯適齊，況他國齊人雖為子役，豈有不學子而為叛貳乎？言必效子而為叛貳，故杜雲“言子叛魯，齊人亦將叛子”也。" }
      - { type: j, text: "子，周公之孫也。多饗大利，猶思不義。利不可得，而喪宗國，將焉用之？”喪宗國，謂以邑入齊，使魯有危亡之禍。○焉，於虔反。成曰：“善哉！吾不早聞命。”傳言仲尼之徒，皆忠於魯國。陳成子館客，使景伯、子贛就館。曰：“寡君使恆告曰，寡君願事君如事衛君。”言衛與齊同好，而魯未肯。○好，呼報反。景伯揖子贛而進之。對曰：“寡君之願也。昔晉人伐衛，在定八年。齊為衛故，伐晉冠氏，喪車五百，在定九年。冠氏，陽平館陶縣。○冠，如字，又古喚反。因與衛地，自濟以西，禚、媚、杏以南，書社五百。二十五家為一社，籍書而致之。○濟，子禮反。禚，諸若反。吳人加敝邑以亂，在八年。齊因其病，取讙與闡。亦在八年。寡君是以寒心。若得視衛君之事君也，則固所願也。”成子病之，乃歸成。病其言也。公孫宿以其兵甲入於嬴。嬴，齊邑。○嬴音盈。" }
      - { type: j, text: "衛孔圉取大子蒯聵之姊，生悝。孔圉，孔文子也。蒯聵姊，孔伯姬。○圉，魚呂反。蒯，苦怪反。聵，魚怪反。悝，苦回反。孔氏之豎渾良夫，長而美，孔文子卒，通於內。通伯姬。○渾，戶門反。長，丁丈反，又如字。大子在戚，孔姬使之焉。使良夫詣大子所。○使之，所吏反，又如字。大子與之言曰：“苟使我入獲國，服冕乘軒，三死無與。”冕，大夫服。軒，大夫車。三死，死罪三。○無與，音預。與之盟，為請於伯姬。良夫為大夫請。閏月，良夫與大子入，舍於孔氏之外圃。圃，園。○圃，布五反。昏，二人蒙衣而乘，二人，大子與良夫。蒙衣，為婦人服也。○乘，繩證反，下及注同。寺人羅御，如孔氏。孔氏之老欒寧問之，稱姻妾以告。自稱昏姻家妾。○欒，力丸反。姻音因。遂入，適伯姬氏。既食，孔伯姬杖戈而先，大子與五人介，輿豭從之。介，被甲。輿豭豚，欲以盟。○杖，直亮反，又音丈。豭音加。被，皮寄反。" }
      - { type: z, text: "“輿豭”。○正義曰：豭是豕之牡者。傳稱“諸侯盟，誰執牛耳”？則盟當用牛。此用豕者，鄭玄雲：“人君用牛。伯姬迫孔悝以豭，下人君耳。”然則蒯聵自謀取國，寧復降下人君？於時迫促，難得牲耳。牲不備牛，如孟任割臂以盟莊公，楚昭王割子期之心以盟隨人，此及明年大子疾輿豭為盟，皆臨時逼切，難以禮論也。" }
      - { type: j, text: "迫孔悝於廁，強盟之，孔氏專政，故動孔悝，欲令逐輒。○迫孔悝，本又作“叔悝”。廁，初吏反。強，其丈反。劫，居業反。令，力呈反。遂劫以登臺。欒寧將飲酒，灸未熟，聞亂，使告季子。季子，子路也，為孔氏邑宰。○灸，章夜反，下同。" }
      - { type: z, text: "注“季子”至“邑宰”。○正義曰：《論語》稱子路為季路，則字季，故呼為季子也。使告季子，則季子在外。下雲“食焉，不闢其難”。是食孔氏之祿，故知為孔氏邑宰。" }
      - { type: j, text: "召獲駕乘車，召獲，衛大夫，駕乘車，言不欲戰。○召，上照反，注同。行爵食灸，奉衛侯輒來奔。季子將入，遇子羔將出，子羔，衛大夫高柴，孔子弟子，將出奔。" }
      - { type: z, text: "“召獲”至“食灸”。○正義曰：丘明為傳，雖詳於當時，而此太煩碎，計欒寧飲酒，無可記錄。又此句顛倒，辭義不允。若倒此一句，則上下各自相連。當是後來誤耳。" }
      - { type: j, text: "曰：“門已閉矣。”季子曰：“吾姑至焉。”且欲至門。子羔曰：“弗及，不踐其難。”言政不及已，可不須踐其難。○難，乃旦反，注及下皆同。季子曰：“食焉，不闢其難。”謂食孔氏祿。" }
      - { type: z, text: "“子羔”至“闢其難”。○正義曰：子羔謂季子將欲救君，故言政不及巳，不當踐其難。季子欲救孔悝，故言食其祿焉，不闢其難。" }
      - { type: j, text: "子羔遂出。子路入，及門，公孫敢門焉，守門。曰：“無入為也。”言輒已出，無為復入。○復，扶又反。季子曰：“是公孫也，求利焉而逃其難。由不然，利其祿，必救其患。”有死者出，乃入。因門開而入。○使，所吏反。曰：“大子焉用孔悝？雖殺之，必或繼之。”言巳必繼孔悝為難攻大子。○焉，於虔反。且曰：“大子無勇，若燔臺，半，必舍孔叔。”大子聞之懼，下石乞、盂黶敵子路。二子，蒯聵黨。敵，當也。○燔音煩。舍音舍，又如字。盂音於。黶，於減反。以戈擊之，斷纓。子路曰：“君子死，冠不免。”不使冠在地。○斷，丁管反。結纓而死。孔子聞衛亂，曰：“柴也其來，由也死矣。”孔悝立莊公。莊公，蒯聵也。莊公害故政，欲盡去之。故政，輒之臣。○去，起呂反。先謂司徒瞞成曰：“寡人離病於外久矣，子請亦嘗之。”歸告褚師比，欲與之伐公，不果。比，褚師聲子，為明年瞞成奔起。○瞞，莫幹反。褚，中呂反。" }
      - { type: j, text: "《春秋左傳正義》" }
