# 禮記正義卷12（孔穎達疏）：j 為經文＋鄭玄注，z 為疏文。
sections:
  - id: juan12
    name: 正文
    blocks:
      - { type: j, text: "天子將出，類乎上帝，宜乎社，造乎禰。諸侯將出，宜乎社，造乎禰。帝謂五德之帝，所祭於南郊者。類、宜、造，皆祭名，其禮亡。○禷音類。造，七報反，下及注同。" }
      - { type: z, text: "“天子”至“乎禰”。○正義曰：此一經論天子巡守之禮也。將出，謂初出時也。知此是巡守者，以下別雲“天子將出徵，類乎上帝”，故知此是巡守也。“類乎”上帝者，謂祭告天也。“宜乎社”者，此巡行方事誅殺封割，應載社主也。雲“宜”者，令誅伐得宜，亦隨其宜而告也。社主於地，又為陰，而誅殺亦陰，故於社也。故《書》雲“弗用命，戮於社”是也。○“造乎禰”者，造，至也。謂至父祖之廟也。然此出歷至七廟，知者，前歸假既雲祖禰，明出亦告祖禰也。今惟雲禰者，《白虎通》雲：“獨見禰何？辭從卑，不敢留尊者之命，至禰，不嫌不至祖也。”皇氏申之雲：“行必有主，無則主命載於齊車。《書》雲‘用命賞於祖’是也。今出辭別，先從卑起，最後至祖，仍取遷主則行也。若前至祖，後至禰，是留尊者之命，為不敬也。故《曲禮》曰：“巳受命君言，不宿於家。”亦其類也。若還，則先祖後禰，如前所言也。所以然者，先應反主祖廟故也。然出告天地及廟，還惟告廟，不告天地者，《白虎通》雲：“還不復告天者，天道無外內，故不復告也。”○“諸侯將出”者，謂朝王及自相朝、盟會、征伐之事也。○“宜乎社”者，不得告天，故從社始也，亦載社主也。○“造乎禰”者，亦告祖及載主也。惟言出告，則歸亦告也。《曾子問》曰“出反必親告於祖禰”是也。天子用特牲，諸侯卑則否也。《曾子問》注云“皆奠幣以告之”是也。○注“帝謂”至“禮亡”。○正義曰：證天子類帝，是祭五德帝也。鄭注《月令》祈穀於上帝，為大微之帝。注此上帝為五德，五德似如大皞五人之帝，二文不同。庾蔚雲：“謂大微五帝，應於五行，五行各有德，故謂五德之帝。木神仁，金神義，火神禮，水神知，土神信，是五德也。”雲“所祭於南郊者”，按五德之帝，應祭四郊，此獨雲祭於南郊者，謂王者將行各祭所出之帝於南郊，猶周人祭靈威仰於南郊，是五帝之中一帝，故上總雲“帝謂五德之帝”。此據特祭所出之帝，故云“祭於南郊”。雲“類、宜、造皆祭名”者，按《小宗伯》雲：“凡天地之大災，類社稷宗廟，則為位。”鄭注云：“禱祈禮輕，類者依其禮而為之。”是類為祭名也。按《爾雅·釋天》雲：“起大事，動大眾，必先有事乎社而後出，謂之宜。”孫炎注云：“求便宜也。”是宜為祭名也。按《大祝》六祈：“一曰類、二曰造。”是造為祭名也。但天道懸遠，以事類告之，社主殺戮，故求其便宜，廟為親近，故以奉至言之，各隨義立名也。" }
      - { type: j, text: "天子無事，與諸侯相見曰朝。事謂征伐。○與如字。朝，直遙反。考禮、正刑、一德，以尊於天子。天子賜諸侯樂，則以柷將之。賜伯子男樂，則以鼗將之。將，謂執以致命。柷、鼗皆所以節樂。○柷，昌六反。樂音嶽。鼗音桃，○諸侯賜弓矢，然後徵。賜鈇鉞，然後殺。賜圭瓚，然後為鬯。未賜圭瓚，則資鬯於天子。得其器，乃敢為其事。圭瓚，鬯爵也。鬯，秬酒也。○鈇，方於反，又音斧。鉞音越。圭，字又作珪，按《說文》珪，古字；圭，今字。瓚，才旦反。鬯，敕亮反。秬音巨，黑黍也。" }
      - { type: z, text: "“天子”至“天子”。○正義曰：此一節論諸侯朝天子，天子賜之事，各隨文解之。○注“事謂征伐”。○正義曰：知事非喪故，而為征伐者，若王室有喪，則朝赴不廢，故傳雲“天子七月而葬，同軌畢至”。此朝謂常朝，雖四時而來朝，朝是總名也。若時會之禮，有徵伐之事，則此常朝別也。○“考禮、正刑、一德，以尊於天子”者，考禮謂諸侯相與朝王之時，考校禮儀，正定刑法，專一道德，以尊崇天子。不言樂者，禮中兼之。禮刑是施用於人，故先言之。道德是已之所行，故後言之。○注“將謂”至“節樂”。○正義曰：凡與人之物，置其所與大者於地，執其小者以致命於人。將，行也，謂執以行命。雲“柷、鼗皆所以節樂”者，按《漢禮器制度》，柷狀如漆筒，中有椎，將作樂，先擊之。鼗如小鼓，長柄，旁有耳，搖之使自擊。柷之節樂，節一曲之始，其事寬，故以將諸侯之命。鼗所以節一唱之終，其事狹，故以將伯子男之命。○“諸侯”至“天子”。○“賜弓矢”者，謂八命作牧者，若不作牧，則不得賜弓矢，故《宗伯》雲：“八命作牧。”注云：“謂諸伯有功德者，加命得專征伐。”此謂征伐當州之內。若九命為二伯，則得專征一方五侯九伯也。若七命以下，不得弓矢賜者，《尚書大傳》雲“以兵屬於得專征伐”者，此弓矢，則《尚書》“彤弓一，彤矢百；盧弓十，盧矢千”。於《周禮》則當“唐弓大弓”，合七而成規者，故《司弓矢》雲：“唐弓大弓，以授使者勞者。”注云：“若晉文侯文公受王弓矢之賜者。”“賜鈇鉞”者，謂上公九命，得賜鈇鉞，然後鄰國臣弒君，子弒父者，得專討之。晉文侯雖受弓矢，不受鈇鉞。崔氏雲：“以不得鈇鉞，不得專殺，故執衛侯，歸之於京師。”○“賜圭瓚”者，亦謂上公九命者，若未賜圭瓚者，則用璋瓚，故《周禮·小宗伯》注云：“天子圭瓚，諸侯璋瓚。”既不得鬯，則用薰，故《王度記》雲：“天子以鬯，諸侯以薰。”圭瓚之制，按《玉人職》“大璋中璋”之下雲：“黃金勺，青金外，朱中。鼻寸，衡四寸。”鄭注云“鼻，勺流也，凡流皆為龍口也”，三璋之勺，形如圭瓚”。又《典瑞》注：“瓚槃大五升，口徑八寸，下有槃，口徑一尺。”又《明堂位》注云：“以大圭為柄。”《玉人》注又云：“有流前注。”此是圭瓚之形也。鬯者，釀秬黍為酒，和以鬱金之草，謂之鬱鬯。不以鬱和，直謂之鬯。此鬯者，謂鬯也。此弓矢、鈇鉞、圭瓚等八命、九命，而加九賜也。晉文侯雖以州牧之禮命之，所賜者皆九賜之物，但無鈇鉞之賜。其前文賜樂者，非九賜之樂，故伯子男亦得受之。魯無弓矢之賜，陳恆弒君，孔子請討之者，春秋之時，見鄰國篡逆，亦得專征伐。若鄰國無罪而輒徵之，則不可，故哀公八年魯伐邾，吳子討之是也。" }
      - { type: j, text: "天子命之教，然後為學，小學在公宮南之左，大學在郊。學，所以學士之宮。《尚書傳》曰：“百里之國，二十里之郊。七十里之國，九里之郊。五十里之國，三里之郊。”此小學大學，殷之制。天子曰辟廱，諸侯曰頖宮。尊卑學異名。闢，明也。廱，和也。所以明和天下。頖之言班也，所以班政教也。○闢音壁，注同。頖音泮。" }
      - { type: z, text: "“天子”至“頖宮”。○正義曰：此一節論天子命諸侯立學及學名之事，各依文解之。○注“尚書”至“之制”。正義曰：所引《書傳》者，伏生《多士傳》文。假令百里之國，國城居中，面有五十里，二十里置郊，郊外仍有三十里。七十里之國，國城居中，面有三十五里，九里置郊，郊外仍有二十六里。五十里之國，國城居中，面有二十五里，三里置郊，郊外仍有二十二里。此皆以四里為差。此經“小學在公宮南之左，大學在郊”，既是殷制，故引《書傳》郊之所在以明之。若周制，則《司馬法》雲：“百里郊，天子畿內方千里。”百里為郊，則諸侯之郊，皆計竟大小，故《聘禮》注云：“遠郊上公五十里，侯四十里，伯三十里，子二十里，男十里也。近郊各半之。”鄭必知近郊半遠郊者，按《書序》雲：“命君陳分正東郊成周。”注云：“東郊，周之近郊也。”蓋五十里。今河南洛陽相去則然，以天子近郊半遠郊，則知諸侯近郊皆半遠郊也。以經文承上諸侯之下，故直雲“天子命之教”。不雲命諸侯，從可知。雲“此小學大學，殷之制”者，以下文雲“殷人養國老於右學，養庶老於左學”，則左學小，右學大。此經雲“小學在公宮南之左”，故知殷制也。周則大學在國，小學在四郊，下文具也。○注“闢明”至“教也”。○正義曰：《釋話》雲：“闢，君也。”君則尊明。“廱，和也”，《釋訓》文。雲“所以明和天下”者，謂於此學中習學道藝，欲使天下之人悉皆明達諧和，故云“明和天下”。雲“頖之言班也，所以班政教也”者，頖是分判之義，故為班。於此學中施化，使人觀之，故云“所以班政教也”。按詩注云：“土雝水之外圓如璧。”注又云：“頖之言半，以南通水，北無也。”二注不同者，此註解其義，《詩》註解其形。於此必解其義者，以上雲“天子命之教”，是政教治理之事，故以義解之。《詩》雲：“王在在靈沼，於牣魚躍。”又云：“思樂泮水，薄採其芹。”皆論水之形狀，故《詩》注以形言之。" }
      - { type: j, text: "天子將出徵，類乎上帝，宜乎社，造乎禰，禡於所徵之地。禡，師祭也，為兵禱，其禮亦亡。○禡，馬怕反，又音百，注同。為，於偽反，下“為盡物”同。禱，丁老反。受命於祖，告祖也。受成於學。定兵謀也。出征執有罪，反釋奠於學，以訊馘告。釋菜奠幣，禮先師也。訊馘，所生獲斷耳者。《詩》曰：“執訊獲醜。”又曰：“在頖獻馘。”馘或為國。○訊，本又作誶，音信，注同。馘，古獲反，截耳。斷音短，下“斷殺”同“" }
      - { type: z, text: "“天子”至“馘告”。○正義曰：此一經論天子出征所祭之事，各依文解之。○注“禡師”至“亦亡”。○正義曰：按《釋奠》雲：“是類是禡，師祭也。”故知禡為師祭也。謂之禡者，按《肆師》注云“貉讀如十百之百”，“為師祭造軍法者，禱氣勢之增倍也。其神蓋蚩蚘，或曰黃帝”。鄭既雲祭造軍法者，則是不祭地。熊氏以禡為祭地，非。師祭皆稱類，《爾雅》類既為師祭，所以上文雲天子將出巡守，類乎上帝，及舜之攝位，亦類乎上帝。並非師祭，皆稱類者，但《爾雅》所釋，多為釋《詩》，以《皇矣》雲“是類是禡”，止釋《皇矣》類禡為師祭，不謂餘文類皆為師祭。但類者，以事類告天，若以攝位事類告天，亦謂之為類。若以巡守事類告天，亦謂之為類，故《異義》夏侯歐陽說以類祭天者，以事類祭之。《古尚書》說“非時祭天謂之類”，許慎謹按：“《周禮》郊天，無言類者，知類非常祭”，從《古尚書》說。鄭氏無駁，與許同也。然《今尚書》及《古尚書》二說，其文雖異，其意同也。以事類告祭，則是非常，故孔注《尚書》亦云：“以攝位事類告天。”鄭又以類雖非常祭，亦比類正禮而為之。故《小宗伯》注云“類者，依其正禮而為之”是也。○“受命”至“馘告”。○“受命於祖”，謂出時告祖，是不敢自專，有所稟承，故言受命。祖禰皆告，以祖為尊，故特言祖。此受命於祖，則前文造乎禰也。但前文據告行，故云“造乎禰”。此據以征伐之事，故云“受命於祖”，所以重起其文也。然則受命於祖，在造乎禰之前，但前文類帝，宜社，禡於所徵之地，總說出行之時，然後卻本初時受命於祖、受成於學之事，所以文倒也。“受成於學”者，謂在學謀論兵事好惡可否，其謀成定，受此成定之謀，在於學裏，故云“受成於學”。○“出征執有罪”者，謂出師征伐，執此有罪之人。還反而歸，釋菜奠幣在於學，以可言問之訊，截左耳之馘，告先聖先師也。○注“釋菜”至“獻馘”。○正義曰：按《大胥職》雲：“春入學，舍採合舞。”《文王世子》亦云“釋菜”，鄭注云：“釋菜，禮輕也。”則釋菜惟釋蘋藻而巳，無牲牢，無幣帛。《文王世子》又云：“始立學者，既興器用幣。”注云：“禮樂之器成，則釁之。又用幣告先聖先師以器成。”此則徒用幣而無菜，亦無牲牢也。《文王世子》又云：“凡始立學者，必釋奠於先聖先師，及行事必以幣。”是釋奠有牲牢，又有幣帛，無用菜之文。熊氏以此為釋菜奠幣者，謂釋奠之禮，以獻俘馘，故云“釋菜奠幣”。言釋奠之時，既有牲牢，菜幣兩有。今按注云“釋菜”，解經中釋字。奠幣，解經中奠字。又云禮先師，不雲祭先師，則以訊馘告之時，但有菜幣而巳，未必為釋奠有牲牢也。於事有疑，未知孰是，故備存焉。然則釋菜奠幣，皆告先聖先師，此直雲先師，文不具耳。雲“訊馘所生獲斷耳”者，以生獲解訊，以斷耳解馘。按《釋言》雲：“訊，言也。”故《詩》注云：“執其可言問者。”《釋詁》雲：“馘，獲也。”訊是生者，馘是死而截耳者。雲“《詩》曰‘執訊獲醜’”者，《詩·小雅·出車》篇文也。雲“又曰‘在頖獻馘’”者，《魯頌·泮水》篇文也。按《周禮·宗伯》：“師還，獻愷於祖。”《司馬職》雲：“愷樂獻於社。”此記不雲祖及社者，文不具。《周禮》不雲獻愷於學者，亦文不具。" }
      - { type: j, text: "天子諸侯無事，則歲三田，一為乾豆，二為賓客，三為充君之庖。三田者，夏不田，蓋夏時也。《周禮》“春曰蒐，夏曰苗，秋曰獮，冬曰狩”。乾豆，謂臘之以為祭祀豆實也。庖，今之廚也。乾音幹。庖，步交反。蒐，所交反。獮，息淺反。臘音昔。無事而不田，曰不敬。田不以禮，曰暴天物。不敬者，簡祭祀，略賓客。天子不合圍，諸侯不掩群。為盡物也。○合如字，徐音閤。揜音掩，本又作掩。天子殺則下大綏，諸侯殺則下小綏，綏當為緌。緌，有虞氏之旌旗也。下謂弊之。○綏，依注音緌，耳佳反，下注同。大夫殺則止佐車。佐車止則百姓田獵。佐車，驅逆之車。○獵，力輒反。驅，丘於反，又丘遇反。獺祭魚，然後虞人入澤梁。豺祭獸，然後田獵。鳩化為鷹，然後設罻羅。草木零落，然後入山林。昆蟲未蟄，不以火田。取物必順時候也。梁，絕水取魚者。罻，小網也。昆，明也。明蟲者，得陽而生，得陰而藏。○獺，徐他達反，又他瞎反。豺，仕皆反。罻音尉，一音鬱。零，本又作苓，音同。《說文》雲：“草曰苓，木曰落。”蟲，直隆反，下同。蟄，直立反。不麛，不卵，不殺胎，不殀夭，重傷未成物。殀，斷殺。少長曰夭。○麛，本又作麑，音迷，同。卵，力管反。胎，吐來反。殀夭，上於表反，下烏老反。斷，丁亂反，又音段。少長，上詩召反，下丁丈反。不覆巢。覆，敗也。○覆，芳服反，注同。" }
      - { type: z, text: "“天子”至“覆巢”。○正義曰：此一節論天子以下田獵之事，各隨文解之。○“天子諸侯無事”者，謂無征伐出行喪兇之事，則一歲三時田獵，獵在田中，又為田除害，故稱田也。○“一為乾豆”者，謂乾之以為豆實。豆實非脯，而云乾者，謂作醢及贊，先乾其肉，故云乾豆，是上殺者也。二為賓客，中殺者也。○三為充君之庖，下殺者也。故《穀梁》桓四年，範寧雲：“上殺中心，死速，乾之以為豆實。次殺射髀髂，死差遲，故為賓客。下殺中腸汙泡，死最遲，故充庖廚。”又《車攻》毛傳雲：“自左膘而射之，達於右腢，為上殺。射右耳本次之。射左髀，達於右，為下殺。”是亦有三等之殺。先宗廟，次賓客者，尊神敬賓之義。○注“三田”至“曰狩”。○正義曰：夏不田，蓋夏時也者，以夏是生養之時，夏禹以仁讓得天下，又觸其夏名，故夏不田。鄭之此注，取《春秋緯·運鬥樞》之文，故以為夏不田。若何休稍異於此，故《穀梁傳》桓四年“公狩於郎”，傳曰：“春曰田，夏曰苗，秋曰蒐，冬曰狩。”何休雲：“《運鬥樞》曰：‘夏不田。’《穀梁》有夏田，於義為短。”鄭玄釋之雲：“四時皆田，夏殷之禮。《詩》雲：‘之子於苗，選徒囂囂。’夏田明矣。孔子雖有聖德，不敢顯然改先王之法，以教授於世。若其所欲改，其陰書於緯，藏之以傳后王。《穀梁》四時田者，近孔子故也。《公羊》正當六國之亡，讖緯見，讀而傳為三時田，作傳有先後，雖異，不足以斷《穀梁》也。”如鄭此言，三時之田，不敢顯露，陰書於緯。四時之田，顯然在《春秋》之經，穀梁為傳之時，去孔子既近，不見所藏之緯，唯睹《春秋》見經，故以為四時田也。公羊當六國之時，去孔子既遠，緯書見行於世，公羊既見緯文，故以為三時田。又鄭《釋廢疾》雲“歲三田，謂以三事為田”，即上一曰乾豆之等。是深塞何休之言，當以注為正。雲“《周禮》春曰蒐”以下，《周禮·大司馬職》文。彼注云“夏田為苗，擇取不孕任者，若治苗去不秀實者”；“秋田為獮，獮，殺也”，“中殺者多也”；“冬田為狩，言守取之無所擇也”。鄭不釋蒐者，蒐，擇也，亦謂擇取不孕者，以義可知，故不解也。然《春秋》四時田獵皆曰蒐，皆以春蒐之禮行之故也。“田不以禮，曰暴天物”者，若田獵不以其禮，殺傷過多，是暴害天之所生之物。以禮田者，則下文“天子不合圍”以下，至“不覆巢”皆是也。○“天子”至“掩群”。○天子四時田獵皆得圍，但圍而不合。若諸侯惟春田不得圍，其夏秋冬皆得圍，圍亦不合，故下《曲禮》雲“國君春田不圍澤”。○“諸侯不掩群”者，是畿內諸侯為天子大夫，故下《曲禮》雲“大夫不掩群”。此皆是熊氏之說。若皇氏以此為夏、殷禮，下《曲禮》為《周禮》，義或然也。○注“綏當”至“弊之”。○正義曰：綏字是糸旁妥，是登車之索。緌字是糸旁委，是旌旗之名。經作綏字，故云“綏當為緌”。雲“有虞氏之旌旗也”者，按《明堂位》雲：“有虞氏之旂，夏后氏之緌。”鄭注云：“有虞氏當言緌。”旗旗無旒者，周謂之大麾。於周則春夏田用綏，故鄭答趙商雲：“春夏用大麾，秋冬用大常“。雲““下謂弊之”者，謂弊僕於地也。若初殺時則抗之，巳殺獵止之時則弊之，故《詩傳》雲：“天子發抗大綏，諸侯發抗小綏。”此抗綏以表天子諸侯之獲。《周禮·大司馬》：“以旗致民。”注云：“以旗者，立旗期民於其下也。”《山虞》雲“植虞旗”，《澤虞》雲“植虞旌”，謂田獵罷，致禽旌旗也。並與此緌不同也。○“大夫”至“田獵”。○“大夫殺則止佐車”，則天子諸侯殺，未止佐車也。雲“佐車止則百姓田獵”，以此推之，則天子殺然後諸侯殺，諸侯殺然後大夫殺，故《詩傳》雲“天子發然後諸侯發，諸侯發然後大夫士發”是也。此雲“佐車止則百姓田獵”，謂冬獵之時。然則大緌小緌者，是夏、殷之法，秋冬皆用緌，異於周也。○注“佐車，驅逆之車”。○正義曰：按《大司馬》雲：“乃設驅逆之車。”注云：“驅，驅出禽獸，使趨亡者也。逆，逆要不得令走。”凡四時田獵，欲止之剩奰各不同也。按《大司馬》春火弊，謂春時田獵，殺獲禽獸將畢，總放火焚萊而後止。春用火者，鄭注“因焚萊除陳草，皆殺而火止”。《大司馬》又云夏車弊，注云“車弊，驅獸之車止也”，謂獵人殺禽既畢，佈列車乘，總驅禽獸而後止息。鄭雲“夏田主用車，示所取物希，皆殺而車止”，鄭即引《王制》雲：“大夫殺則止佐車，佐車止則百姓田獵。”是殺禽既畢，佐車休止。但夏時佐車止，百姓未得田獵。鄭雲百姓田獵者，因引《王制》之成文。《大司馬》又云秋羅弊，注云“秋田主用罔，中殺者多也”。皆殺而罔止。《大司馬》又云冬徒弊，注云“冬田主用眾物，多眾得取也”。○“獺祭”至“火田”。○按《月令》正月“獺祭魚”，《孝經緯》雲“獸蟄伏，獺祭魚”，則十月中也。是獺一歲再祭魚。此下文“鳩化為鷹”，“草木零落”，文相連接，則“獺祭魚，然後虞人入澤梁”，謂十月時。按《魯語》李革雲：“鳥獸孕，水蟲成，於是乎禁罝罦羅網。”又云：“獸長麛夭，鳥翼鷇卵。”注云謂季春時。然則正月雖獺祭魚，虞人不得入澤梁。○“豺祭獸然後田獵”者，按《月令》九月“豺乃祭獸”。《夏小正》十月“豺祭獸”，則是九月末十月之初。豺祭獸之後，百姓可以田獵。“鳩化為鷹，然後設罻羅”者，謂八月時，但鳩化有漸，故《月令》季夏雲“鷹乃學習”，孟秋雲“鷹乃祭鳥”。其鳩化為鷹，則八月時也。以《月令》二月時“鷹化為鳩”，則八月鳩化為鷹也。故《周禮·司裘》雲“中秋，獻良裘”，鄭司農注云“中秋鳩化為鷹”是也。“設罻羅”者，按《說文》雲：“罻，捕鳥網也。”又《爾雅》雲：“鳥罟謂之羅。”罻羅，總是捕鳥之網。○“草木零落，然後入山林”者，謂十月時。按《月令》季秋“草木黃落”，其零落芟折，則在十月也。故《毛詩傳》雲：“草木不折，不操斧斤，不入山林。”此謂官民總取林木。若依時取者，則《山虞》雲：“仲冬斬陽木，仲夏斬陰木。”不在零落之時。昆蟲未蟄，不以火田”者，謂未十月之時，十月則得火田，故《羅氏》雲：“蠟則作羅襦。”注云：“今俗放火張羅。”從十月以後至仲春，皆得火田，故《司馬職》雲春火弊是也。若陶鑄之火，則季春出火，季秋內火，按《司爟》雲“季春出火”，“季秋內火”。知是陶鑄之火者，按《春秋》昭六年《左傳》雲“三月，鄭人鑄刑鼎”，“士文伯曰：火未出而作火，鄭其有災乎”！刑鼎，則陶鑄也。○注“昆，明也”。○正義曰：按《說文》曰：“旻，同也。”今雲明者，以字從日，故為明。“不麛”至“殀夭”。○“不麛不卵”，據春時特甚，不殀夭之等亦然，故《國語》雲“獸長麛天，鳥翼鷇卵”，是春尢甚。此注云“重傷未成物”，則四時皆然也。《國語》既雲“獸長麛夭”，夭與麛相連，故鄭雲“少長曰夭”。" }
      - { type: j, text: "冢宰制國用，必於歲之杪，五穀皆入，然後制國用。制國用，如今度支經用。杪，末也。○杪，亡小反。度支，大各反，下音之。用地小大，視年之豐耗。小國大國，豐兇之年，各以歲之收入，制其用多少，多不過禮，少有所殺。○耗，呼報反。殺，色戒反，又色別反。以三十年之通制國用，量入以為出。通三十年之率，當有九年之蓄。出謂所當給為。○量音亮。率音律，又音類，本又作繂。之畜，敕六反，後皆同。祭用數之仂。筭今年一歲經用之數，用其什一。○仂音勒，又音力。什音十。喪三年不祭，唯祭天地社稷，為越紼而行事。不敢以卑廢尊。越猶躐也。紼，輴車索。○紼音弗。躐，力輒反。輴，敕倫反。索，悉各反。喪用三年之仂，喪，大事，用三歲之什一。喪祭用不足曰暴，有餘曰浩。暴猶耗也。浩猶饒也。○浩，胡老反。祭，豐年不奢，凶年不儉。常用數之仂。國無九年之畜曰不足，無六年之蓄曰急，無三年之蓄曰國非其國也。三年耕，必有一年之食。九年耕，必有三年之食。以三十年之通，雖有兇旱水溢，民無菜色，然後天子食，日舉以樂。菜色，食菜之色。民無食菜之飢色，天子乃日舉以樂以食。○日，人一反，下同。" }
      - { type: z, text: "“冢宰”至“以樂”。○正義曰：此一節論冢宰制國用及年之豐耗，並喪祭及所蓄積之法，各隨文解之。○“用地小大視年之豐耗”者。○用謂制國之用。凡制國用多少，必計地小大。又視年之豐耗，若地大年豐，則制用多；若地小年耗，則制用少。故鄭雲“多不過禮，少有所殺”。○“以三十年之通制國用，量入以為出”者，言欲制國用之時，先以三十年通融之法，留九年蓄外，計見在之物以制國用，假令一年有四萬斛，以一萬斛擬三十年通融積聚為九年之蓄，以見在茸茯斛，制國之來歲一年之用。量其今年入之多少，以為來年出用之數。○注“通三”至“給為”。○正義曰：“通三十年之率“者，每年之率入物分為四分，一分擬為儲積，三分而當年所用。二年又留一分，三年又留一分，是三年總得三分為一年之蓄。三十年之率，當有十年之蓄，此雲“當有九年之蓄”者，崔氏雲：“三十年之間，大略有閏月十二，足為一年，故為有九年之蓄。是王肅以為二十七年有九年之蓄，而言三十者，舉全數，兩義皆通，未知孰是也。雲“出謂所當給為”者，給謂給百官賓客及民人也，為謂為造國家器物也。○注“算今”至“什一”。○正義曰：知用今年一歲經用者，以下文雲“喪用三年之仂”。此直雲數之仂，故知是一歲之仂也。又知仂為什一者，以仂是分散之名，故《考工記》雲：“石有時以泐。”《考工記》又云：“以其圍之阞，捎其藪。”彼注“阞，謂三分之一”，此雲“什一”者，以民稅一歲之十一，則國祭所用亦什一也。此謂當年經用之內，用其什一，非是通計擬三年儲積之蓄也，故鄭雲“一歲經用之數”。○注“不敢”至“車索”。○正義曰：私喪者是其卑，天地社稷是其尊。今雖遭私喪，既殯巳後，若有天地社稷之祭即行之，故云“不敢以卑廢尊”也。越是踐躐之義，故云“越猶躐也”。但未葬之前，屬紼於輴，以備火災。今既祭天地社稷，須越躐此紼而往祭之，故云越紼。雲“紼，輴車索”者，以停住之時，指其繩體，則謂之紼。若在塗，人挽而行之，則謂之引。故鄭注《雜記》雲：“廟中曰紼，在塗曰引。”天地社稷，故有越紼之禮。六宗及山川之等，卑於天地社稷，待喪終乃祭。故《鄭志》答田瓊雲：“天地郊社，至尊，不可廢，故越紼祭之。六宗山川之神，則否。”其宮中五祀在喪內，則亦祭之。故《曾子問》雲君薨，五祀之祭不行，既殯而祭之，自啟至於反哭。五祀之祭不行，既葬而祭之，但祭時須人既少，眾官不皆使盡去，不須越紼，故鄭答田瓊雲：“五祀，宮中之神，喪時朝夕出入所祭，不為越紼也。”天地社稷之祭，豫卜時日。今忽有喪，故既殯，越紼行事。若遭喪之後，當天地郊社常祭之日，其啟殯至於反哭，則避此郊社祭日而為之。按禮卒哭而祔，練而禘於廟。此等為新死者而為之，則非常祭也。其常祭法，必待三年喪畢也。其春秋之時，未至三年而為吉祭者，皆非禮也。若杜預之意，以為既祔以後，宗廟得四時常祭。三年大禘，乃同於吉，故僖公三十三年“凡君薨，卒哭而祔，祔而作主。特祀於主，烝嘗禘於廟”，杜注云“新主既特祀於寢，則宗廟四時當祀，三年禮畢，又大禘，乃皆同於吉”。如杜之意，與三年不祭違者，按《釋例》雲：“《禮記》，後儒所作，不正與《春秋》同。”是杜不盡用《禮記》也。○注“暴猶”至“饒也”。○正義曰：暴是殘暴，物被殘暴則虛耗，故云“暴猶耗也”。浩浩，是多大之義，故《堯典》雲：“浩浩滔天。”故云“浩猶饒也”。○“雖有兇旱水溢，民無菜色”者，兇旱，謂凶荒遭旱也。水溢，謂水之汎溢。凡水旱之歲，歷運有常，按《律曆志》雲：十九歲為一章，四章為一部，二十部為一統，茸艹為一元，則一元有四千五百六十歲。初人元一百六歲有陽九，謂旱九年。次三百七十四歲陰九，謂水九年。以一百六歲並三百七十四歲，為四百八十歲，注云六乘八之數。次四百八十歲有陽九，謂旱九年。次七百二十歲陰七，謂水七年。次七百二十歲陽七，謂旱七年，又注云七百二十者，九乘八之數。次六百歲陰三，謂水三年。次六百歲陽五，謂旱五年。注云：六百歲者，以八乘八，八八六十四；又以七乘八，七八五十六，相乘為一千二百歲，於《易》七八不變，氣不通，故合而數之，各得六百歲。次四百八十歲陰三，次四百八十歲陽三。從入元至陽三，除去災歲，總有四千五百六十年。其災歲兩個陽九年，一個陰九年，一個陰陽各七年，一個陰陽各五年，一個陰陽各三年，災歲總有五十七年，並前四千五百六十年，通為四千六百一十七歲。此一元之氣終矣。如《律歷》之言，此是陰陽水旱之大數也。所以正用七八九六相乘者，以水數六、火數七、木數八、金數九、故以此交互相乘也。以七八九六陰陽之數，自然故有九年、七年、五年、三年之災，須三年、六年、九年之蓄也。然災歲有陽七、陰七、陽五、陰五，此記直雲三年、六年、九年之蓄，不雲七五者，此各以其三相因，故不言七五也。舉六年，則七年、五年之蓄可知。若貯積滿九年之後，則腐壞，當隨時給用也。" }
      - { type: j, text: "天子七日而殯，七月而葬。諸侯五日而殯，五月而葬。大夫、士、庶人三日而殯，三月而葬。尊者舒，卑者速。《春秋傳》曰：“天子七月而葬，同軌畢至。諸侯五月，同盟至。大夫三月，同位至。士逾月，外姻至。”三年之喪，自天子達。下通庶人，於父母同。天子諸侯降期。○期，居宜反。庶人縣封，葬不為雨止，不封不樹。喪不貳事，縣封，當為縣窆。縣窆者，至卑，不得引紼下棺，雖雨猶葬，以其禮儀少。封，謂聚土為墳。不封之，不樹之，又為至卑無飾也。《周禮》曰“以爵等為丘封之度，與其樹數”，則士以上乃皆封、樹。貳之言二也。庶人終喪無二事，不使從政也。《喪大記》曰：“大夫士既葬，公政入於家。既卒哭，弁絰帶，金革之事無闢也。”○縣封，上音玄；下音窆，彼念反。不為，於偽反，注“又為”同。紼音弗。上，時掌反，下“大夫以上”同。闢音避。自天子達於庶人。喪從死者，祭從生者，支子不祭。從死者，謂衣衾棺槨。從生者，謂奠祭之牲器。" }
      - { type: z, text: "“君子”至“不祭”。○正義曰：此一節明天子以下殯葬日月不同，及衣衾牲器之數，各依文解之。○注“尊者”至“姻至”。○正義曰：天子諸侯位既尊重，送終禮物，其數既多，身在於喪，許其申遂，故日月緩也。大夫及士禮數既卑，送終之物，其數簡少，又職唯促遽，義許奪情，故日月促也。必至三日者，冀其更生，三日不生，亦不生矣。所引“《春秋傳》”以下，隱元年《左氏》文。同軌者，杜預雲“言同軌，以別四夷之國”，謂中國諸侯，車同軌轍，盡皆來至。同盟者，杜預雲“同在方岳之盟”。同位者，杜預雲“古者行役不逾時”。諸侯以下，不言畢至者，有來有否，不必盡來，故不雲畢。按《左傳》大夫言三月，士言逾月，此總雲大夫士三月而葬者，此記者許以降二為差，故總雲三月。《左傳》細言其別，故云大夫三月，士逾月。其實大夫三月者，除死月為三月。士三月者，數死月為三月，正是逾越一月，故言逾月耳。按《膏肓》，休以為士禮三月而葬，今《左氏》雲逾月，於義《左氏》為短。玄箴之曰：“禮，人君之喪，殯葬，皆數來月來日。士殯葬，皆首薺月往日。尊卑相下之差數，故大夫士俱三月，其實不同。士之三月，及大夫之逾月也。”鄭《箴膏肓》以正禮而言，故云“人君殯葬，數來月來日”。若春秋之時，天子諸侯之葬皆數死月，故文八年八月“天王崩”，九年二月“葬襄王”。又成十八年八月“公薨”，十二月葬，傳雲“書順也”，是皆數死月也。故鄭又云：“人君殯數來日，葬首薺月。”據《春秋》為說，其殯日之義，巳具在上《曲禮》疏。其諸侯奔喪，按《異義》：“《公羊》說天王喪，赴者至，諸侯哭。雖有父母之喪，越紼而行事，葬畢，乃還。《左氏》說王喪，赴者至，諸侯既哭，問故，遂服斬衰，使上卿吊，上卿會葬。經書叔孫得臣如京師葬襄王，以為得禮。許慎謹按：易下邳傳其容說，諸侯在千里內皆奔喪，千里外不奔喪。若同姓，千里外猶奔喪，親親也。容說為近禮。”鄭駮之雲：“天子於諸侯無服，諸侯為天子斬衰三年，尊卑有差。按魯夫人成風薨，‘王使榮叔歸含且賵’，‘召伯來會葬’，傳曰‘禮也’。‘襄王崩’，‘叔孫得臣如周，葬襄王’。天子於魯既含且賵，又會葬，為得禮，則是魯於天子，一大夫會，為不得禮可知。又《左傳》雲鄭游吉雲：‘靈王之喪，我先君簡公在楚。我先大夫印段實往，敝邑之少卿也。王吏不討，恤所無也。’豈非《左氏》諸侯奔天子之喪及會葬之明文？說《左氏》者，雲諸侯不得棄其所守奔喪，自違其傳。同姓雖千里外猶奔喪，又與禮乖。”鄭之所駮，從《公羊》之義。又以《左氏傳》諸侯亦奔喪，但說《左氏》者自違其傳，雲不奔喪，又難許慎雲“千里外同姓猶奔喪，與禮乖也”，此是鄭氏之意。其諸侯自相奔喪禮，按《公羊》說遣大夫吊君會其葬。《左氏》說諸侯之喪，士吊，大夫會葬。文、襄之霸，令大夫吊，卿共葬事。許慎謹按：“《周禮》無諸侯會葬義，知不相會葬。”從《左氏》義。鄭氏無駁，與許同。其諸侯夫人喪，《公羊》說卿吊，君自會葬。《左氏》說諸侯夫人喪，士吊，士會葬。文、襄霸，士吊，大夫會葬，叔弓如宋葬宋共姬。上卿行，過厚非禮。許慎謹按：“《公羊》說同盟諸侯薨，君會葬；其夫人薨，君又會葬，是其不遑國政而常在路。《公羊》、《左氏》說俱不別同姓異姓。《公羊》言當會，許以為同姓也。《左氏》雲不當會，據異姓也。”鄭駮之雲：“按禮，君與夫人尊同，故《聘禮》卿聘君，因聘夫人。兇時會吊，主於相哀愍，略於相尊敬，故使可降一等，士吊，大夫會葬，禮之正也。《周禮》‘諸侯之邦交，歲相問也，殷相聘也，世相朝也’，無異姓同姓親疏之數。”雲夫人喪，士會葬，說者致之，非傳辭者，鄭氏意引《周禮》無同姓異姓之別者，破許慎雲“同姓則會，異姓則不會”。鄭又云“夫人喪，士會葬，說者致之，非傳辭”，破《異義》“《左氏》說夫人喪，士吊，士會葬”之文也。按《左氏》昭三年傳雲：“君薨，大夫吊。夫人，士吊”，無士會葬之文，故云說者致之。言士會葬，實非本傳之辭也。則鄭氏以為古者君薨，士吊，大夫會葬。文、襄之霸，君薨，大夫吊，卿會葬。其夫人之喪，則古及文、襄之時，皆士吊，大夫會葬，故鄭雲“士吊，大夫會葬，禮之正”。○“庶人”至“貳事”。○庶人之喪，賤，無碑繂。窆謂下棺。縣繩下棺，故云縣窆。威儀既少，日又促遽，將葬之時，不為雨而止。庶人既卑小，不須顯異，不蛔芰為封，不標墓以樹。若士以上，負國恩重，雖在喪中，金革無闢。庶人既無爵命，更無殊禮，三年之內，許其終喪。餘居喪之外，不供他事，故下雲“父母之喪，三年不從政”。○注“縣封”至“闢也”。○正義曰：知縣封當為縣窆者，若封是封土，無縣系之理，不得與縣相連，故知為窆也。不直雲封當為窆，而與縣相連者，以經有兩封，若不連縣言之，恐與不封相涉，故連縣言之也。故云“不得引紼下棺”者，士雖無碑，猶有二繂。今庶人無紼，唯以繩縣棺，故云“不得引紼下棺”。雲“雖雨猶葬，以其禮儀少”者，按《異義》：“《公羊》說雨不克葬，謂天子諸侯也。卿大夫臣賤，不能以雨止。《穀梁》說葬既有日，不為雨止。《左氏》說卜葬先遠日，闢不懷，吾不汲汲葬其親，不可行事，廢禮不行，庶人不為雨止。許慎謹按：《論語》雲‘死，葬之以禮’，以雨而葬，是不行禮，《穀梁》說非也。”從《公羊》、《左氏》之說，鄭氏無駮，與許同。按《釋廢疾》雲：“雖庶人葬為雨止。《公羊》說卿大夫臣賤，不能以雨止。此等之說，則在廟未發之時，庶人及卿大夫亦得為雨止。若其巳發在路，及葬，則不為雨止。其人君在廟，及在路，及葬，皆為雨止。”雲“封謂聚土為墳”者，以對上封為窆，故明之雲“封謂聚土為墳”。雲“《周禮》曰以爵等為丘封之度”者，是《周禮·冢人》文。既雲爵等，明有爵者乃有丘封。周以士為爵，故云“則士以上乃皆封、樹”，是庶人不封、樹。彼注云：“王公曰立，諸臣曰封。”又引《漢律》曰：“列侯墳高四丈，關內侯以下至庶人各有差。”又《禮記》雲：“孔子合葬於防”，“崇四尺”，鄭雲“蓋周之士制”，其樹數則無文。按《白虎通》雲：“天子松，諸侯柏，大夫栗，士槐。”雲“貳之言二也”者，上貳是副貳之貳，下二是二三之二。喪不貳事者，謂不為兩事，故讀從二三之二也。引“《喪大記》”以下者，證大夫士在喪有二事也。○注“從死”至“牲器”。○正義曰：盧植解雲：“從生者，謂除服之後，吉祭之時，以子孫官祿祭其父祖。”故云從生者。若喪中之祭，虞祔練祥，仍從死者之爵，故《小記》雲：“士祔於大夫則易牲。”又云：“其妻為大夫而卒，而後其夫不為大夫，而祔於其妻，則不易牲。”又《雜記》雲：“上大夫之虞也少牢，卒哭成事，祔，皆大牢。下大夫之虞也犆牲，卒哭成事，祔，皆少牢。”是喪中之祭，仍從死者之禮，而鄭雲“謂奠祭之牲器”。雲奠，則是喪中之祭，得從生者之爵，與《小記》、《雜記》違者。《小記》、《雜記》據死者子孫身無官爵，生者又無可祭享，故喪中之祭，皆用死者之禮。若其生者有爵，則祭從生者之法。喪祭尚爾，喪後吉祭可知。奠謂葬前，祭謂葬後，包喪終吉祭也。鄭必知祭兼喪祭，與盧植別者，以此雲祭從生者，喪從死者相對。又《中庸》雲：“父為大夫，子為士，葬以大夫，祭以士。”又云：“父為士，子為大夫，葬以士，祭以大夫。”祭又與葬相對，皆祭與喪葬連文，是一時之言，故祭中兼為喪奠也。或雲在喪中祭，尚從死者爵，至吉祭乃用生者祿耳，故知盧解鄭言奠者，自吉祭之奠，及非時祭耳。" }
      - { type: j, text: "天子七廟，三昭三穆，與大祖之廟而七。此周制。七者，大祖及文王、武王之祧，與親廟四。大祖，后稷。殷則六廟，契及湯與二昭二穆。夏則五廟，無大祖，禹與二昭二穆而巳。○祧，他彫反。契，息列反。諸侯五廟，二昭二穆，與大祖之廟而五。大祖，始封之君。王者之後，不為始封之君廟。大夫三廟，一昭一穆，與大祖之廟而三。太祖別子始爵者，《大傳》曰“別子為祖”，謂此雖非別子，始爵者亦然。士一廟。謂諸侯之中士下士，名曰官師者。上士二廟。庶人祭於寢。寢，適寢也。適，丁歷反。" }
      - { type: z, text: "“天子”至“於寢”。○正義曰：此一節明天子以下立廟多少不同之事，各隨文解之。○注“此周”至“而巳”。○正義曰：鄭氏之意，天子立七廟，唯謂周也。鄭必知然者，按《禮緯稽命徵》雲：“唐虞五廟，親廟四，始祖廟一。夏四廟，至子孫五。殷五廟，至子孫六。”《鉤命決》雲：“唐堯五廟，親廟四，與始祖五。禹四廟，至子孫五。殷五廟，至子孫六。週六廟，至子孫七。”鄭據此為說，故謂七廟，周制也。周所以七者，以文王武王受命，其廟不毀，以為二祧，並始祖后稷，及高祖以下親廟四，故為七也。若王肅則以為天子七廟者，謂高祖之父，及高祖之祖廟為二祧，並始祖及親廟四為七，故《聖證論》肅難鄭雲：“周之文武受命之王，不遷之廟，權禮所施，非常廟之數。殷之三宗，宗其德而存其廟，亦不以為數。凡七廟者，皆不稱周室。《禮器》雲：‘有以多為貴者，天子七廟。’孫卿雲：‘有天下者事七世。’又云：‘自上以下，降殺以兩。’今使天子諸侯立廟，並親廟四而止，則君臣同制，尊卑不別。禮，名位不同，禮亦異數，況其君臣乎。又《祭法》雲‘王下祭殤五’，及五世來孫。則下及無親之孫，而祭上不及無親之祖，不亦詭哉！《穀梁傳》雲：‘天子七廟，諸侯五。’《家語》雲：‘子羔問尊卑立廟制，孔子云：禮，天子立七廟，諸侯立五廟，大夫立三廟。’又云：‘遠廟為祧，有二祧焉。’”又儒者難鄭雲：“《祭法》‘遠廟為祧’，鄭注《周禮》雲：‘遷主所藏曰祧’，違經正文。鄭又云‘先公之遷主，藏於后稷之廟。先王之遷主，藏於文武之廟’，便有三祧，何得《祭法》雲有二祧？”難鄭之義，凡有數條，大略如此，不能具載。鄭必為天子七廟唯周制者，馬昭難王義雲“按《喪服小記》王者立四廟”，又引《禮緯》夏無大祖，宗禹而巳，則五廟。殷人祖契而宗湯，則六廟。周尊后稷，宗文王武王則七廟。自夏及周，少不減五，多不過七。《禮器》雲周旅酬六屍，一人發爵，則周七屍，七廟明矣。今使文武不在七數，既不同祭，又不享嘗，豈禮也哉！故漢侍中盧植說文雲“二祧謂文武”。《曾子問》當七廟，無虛主；《禮器》天子七廟，堂九尺；《王制》七廟。盧植雲：“皆據周言也。《穀梁傳》天子七廟，尹更始說天子七廟，據周也。《漢書》韋玄成四十八人議，皆雲周以後稷始封，文武受命。石渠論《白虎通》雲：‘周以後稷文武特七廟。’”又張融謹按：“《周禮·守祧職》‘奄八人，女祧每廟二人’。自太祖以下與文、武及親廟四，用七人，姜嫄用一人，適盡。若除文武，則奄少二人。《曾子問》孔子說周事，而云七廟無虛主。若王肅數高祖之父、高祖之祖廟，與文、武而九，主當有九。孔子何雲七廟無虛主乎？”故云以《周禮》孔子之言為本，《穀梁》說及《小記》為枝葉，韋玄成石渠論《白虎通》為證驗，七廟斥言，玄說為長，是融申鄭之意。且天子七廟者，有其人則七，無其人則五。若諸侯廟制，雖有其人，不得過五。則此天子諸侯七、五之異也。王肅雲“君臣同制，尊卑不別”，其義非也。又“王下祭殤五”者，非是別立殤廟，七廟外親盡之祖，禘祫猶當祀之。而王肅雲下祭無親之孫，上不及無親之祖，又非通論。且《家語》雲先儒以為肅之所作，未足可依。按《周禮》惟存后稷之廟不毀。按昭七年傳雲“餘敢忘高圉、亞圉”，注云“周人不毀其廟，報祭之”，似高圉、亞圉廟亦不毀者。此是不合鄭說，故馬融說雲“周人所報而不立廟”。○注“大祖”至“君廟”。○正義曰：凡始封之君，謂王之子弟，封為諸侯，為後世之大祖，當此君之身，不得立出王之廟，則全無廟也，故諸侯不敢祖天子。若有大功德，王特命立之則可。若魯有文王之廟，鄭祖厲王是也。魯非但得立文王之廟，又立姜嫄之廟，及魯公文公之廟，並周公及親廟，除文王廟外，猶八廟也。此皆有功德特賜，非禮之正。此始封君之子，得立一廟。始封六世之孫，始五廟備也。若異姓始封，如大公之屬，初封則得立五廟，從諸侯禮也。雲“王者之後，不為始封之君廟”者，以其始封之君，非有功德，惟因先代之後以封之，不得為後世之大祖，得立此君所出王者之廟。必知然者，以經傳無文雲微子為宋之始祖故也。而《左傳》雲“宋祖帝乙”是也。若二王之後，郊天之時，則得以遠代之祖配天而祭，《故禮》運雲：“杞之郊也，禹也。宋之郊也，契也。”○注“大祖”至“亦然”。○正義曰：此據諸侯之子始為卿大夫，謂之別子者也。是嫡夫人之次子，或眾妾之子，別異於正君，繼父言之，故云別子。引《大傳》者，證此大祖是別子也。雲“雖非別子，始爵者亦然”者，此事凡有數條：一是別子，初雖身為大夫，中間廢退，至其遠世子孫，始得爵命者，則以為大祖，別子不得為大祖也。二是別子及子孫，不得爵命者，後世始得爵命，自得為大祖。三是全非諸侯子孫，異姓為大夫者，及它國之臣初來任為大夫者，亦得為大祖，故云“雖非別子，始爵者亦然”。此總包上三事，如《鄭志》答趙商，此王制所論皆殷制，故云“雖非別子”，亦得立大祖之廟。若其周制，別子始爵，其後得立別子為大祖。若非別子之後，雖為大夫，但立父、祖、曾祖三廟而巳，隨時而遷，不得立始爵者為大祖。故鄭答趙商問“《祭法》雲‘大夫立三廟，曰考廟、曰王考廟、曰皇考廟’，注‘非別子’，故知祖考無廟。商按《王制》‘大夫三廟，一昭一穆，與大祖之廟而三’，注云‘大祖別子始爵者’，‘雖非別子，始爵者亦然’，二者不知所定”？鄭答雲“《祭法》，周禮。《王制》之雲，或以夏、殷雜，不合周制”，是鄭以為殷、周之別也。鄭必知周制別子之後得立別子為大祖者，以《大傳》雲“別子為祖，系之以姓而弗別，綴之以食而弗殊，雖百世而昏姻不通者，周道然也”，故知別子百世不遷為大祖也。周既如此，明殷不系姓，不綴食。《大傳》又云“其庶姓別於上而戚單於下，五世而昏姻可以通”，明五世之後，不復繼以別子，但始爵者，則得為大祖也。此大夫三廟者，天子諸侯之大夫皆同。知者，以此及《祭法》歷陳天子諸侯即雲大夫，更不別雲諸侯之大夫，故知與天子大夫同也。卿即大夫總號，故《春秋》殺卿，經皆總號大夫，其三公即與諸侯同。若附庸之君亦五廟，故莊三年《公羊傳》雲“紀季以酅入於齊”，傳曰“請後五廟，以存姑姊妹”。又附庸得稱朝，是與諸侯同。○“廟謂諸”至“二廟”。○正義曰：按《祭法》雲“適士二廟”，今此雲“士一廟”，故知是諸侯之中士下士。《祭法》雲“官師一廟”，故云“名曰官師者”。鄭既雲諸侯之中士、下士一廟，則天子之中士、下士皆二廟也。必知皆二廟者，以其總稱元士，故《昏義》雲“八十一元士”，是不分別上下也。鄭又知諸侯中士與下士同一廟者，以《祭法》雲“適士二廟”，言適士則不得兼中下也。○注“寢，適寢也”。○正義曰：此庶人祭寢，謂是庶人在官府史之屬，及尋常庶人。此祭謂薦物，以其無廟，故惟薦而已。薦獻不可褻處，故知適寢也。" }
      - { type: j, text: "天子諸侯宗廟之祭，春曰礿，夏曰禘，秋曰嘗，冬曰烝。此蓋夏殷之祭名。周則改之，春曰祠，夏曰礿，以禘為殷祭。《詩·小雅》曰：“礿祠烝嘗，於公先王。”此週四時祭宗廟之名。○礿，餘若反。夏曰，戶嫁反，注“夏曰礿”，“夏祭曰”，下雲“夏薦”同。禘，大計反。烝，之承反。祠音詞。天子祭天地，諸侯祭社稷，大夫祭五祀。五祀，謂司命也，中霤也，門也，行也，厲也。此祭謂大夫有地者，其無地祭三耳。○霤，力救反。天子祭天下名山大川，五嶽視三公，四瀆視諸侯。視，視其牲器之數。諸侯祭名山大川之在其地者。魯人祭泰山，晉人祭河是也。" }
      - { type: z, text: "“天子”至“地者”。○正義曰：此一節論夏殷天子諸侯大夫四時祭宗廟，及祭天地山川之事，各隨文解之。○“春曰礿”者。皇氏雲：“礿，薄也。春物未成，其祭品鮮薄也。”孫炎雲：“礿者，新菜可礿。”○“夏曰禘”者，皇氏雲：“禘者，次第也。夏時物雖未成，宜依時次第而祭之。”○“秋曰嘗”者，《白虎通》雲：“嘗者，新穀熟而嘗之。”○“冬曰烝”者，烝者眾也。冬之時物成者眾。孫炎雲：“烝，進也。進品物也。”○注“此蓋”至“之名”。○正義曰：疑為夏殷祭名者，以其祭名與周不同，故以為夏殷祭名。其夏殷之祭又無文，故稱蓋以疑之。此雲春礿，而《郊特牲》雲春禘者，鄭彼注云“禘當為禴”，從此為正。《祭義》曰“春禘”，鄭注直雲“夏殷禮”，不改禘字者，以《郊特牲》已改禘為禴，故於《祭義》略之，從可知也。雲“周則改之，春曰祠，夏曰礿”者，按《宗伯》雲“以祠春享先王，以禴夏享先王”。又知周以禘為殷祭者，按《公羊傳》曰“五年而再殷祭”，又《春秋經》僖八年“秋，七月，禘於大廟”，是禘為殷祭，殷猶大也，謂五年一大祭。引《詩·小雅》者，是文王之詩，《天保》之篇，謂文王受命，已改殷之祭名，以夏祭之禘，改名曰礿。而《詩》先言礿後祠者，從便文，嘗在烝下，以韻句也。於公，諸盩至不窋也。先王，謂后稷、大王、王季也。○注“五祀”至“三耳”。○正義曰：知五祀是司命、中霤、門、行、厲者，按《祭法》雲“王立七祀，曰司命、曰中霤、曰國門、曰國行、曰泰厲、曰戶、曰灶”，諸侯五祀無戶、灶，自外與天子同，明大夫五祀與諸侯同。明知是司命、中霤、門、行、厲也。雲“此祭謂大夫有地者”，以其祭五祀與諸侯同，故知大夫有采地者。雲“其無地祭三耳”者，以《祭法》雲“大夫立三祀，曰族厲、曰門、曰行”也。鄭意以此及《祭法》俱是周禮，有地者祭五，無地者祭三。按下《曲禮》大夫祭五祀，謂戶、灶、中霤、門、行，以為殷禮。此大夫五祀，為有地大夫五祀之神。又別者，以《曲禮》天子諸侯大夫皆祭五祀，更無等差，故以《月令》五祀當之，總為殷禮。此文天子云祭天地，諸侯雲祭社稷，大夫雲祭五祀，既別為尊卑之差，故以周法解之。○注“視視”至“之數”。○正義曰：按《夏傳》雲：“五嶽視三公，四瀆視諸侯，其餘山川視伯，小者視子男。”鄭注云：“謂其牲幣粢盛籩豆爵獻之數，非謂尊卑。”按《周禮》上公饔餼九牢，飧五牢，饗禮九獻，豆四十。侯伯饔餼七牢，飧四牢，饗禮七獻，豆三十有二。子男饔餼五牢，飧三牢，饗禮五獻，豆二十有四。又五等諸侯，膳皆大牢，祭亦大牢，簋皆十有二，祭四望山川，用毳冕。鄭注《禮器》“五獻察，謂祭四望山川也”。又侯伯無別，三公與子男同。今此《王制》雲“五嶽視三公，四瀆視諸侯”，則三公尊於諸侯。《夏傳》雲“四瀆視諸侯，其餘山川視伯，小者視子男”，是伯與侯別。今鄭注此“視，視其牲器”，又注《夏傳》“謂其牲幣粢盛籩豆爵獻之數”，參驗上下，並與《周禮》不同，不可強解合之為一。此《王制》所陳，多論夏殷之制。《夏傳》所說，又非周代之禮。鄭之所注者，當據異代法也。此經雲“四瀆視諸侯”，《夏傳》“視諸侯”之下，雲“其餘山川視伯，小者視子男”，則此諸侯謂是侯爵者，不得總為五等諸侯。○注“魯人”至“是也”。○正義曰：知“魯人祭泰山”者，以《論語》雲“季氏旅於泰山”，明魯君祭泰山，季氏僣之也。又《公羊》雲茸茺，“祭泰山、河、海”，是魯祭泰山。但泰山是齊魯之界，故齊亦祭之。是以《禮器》雲“齊人將有事於泰山，必先有事於配林”，《禮器》又云“晉人將有事於河，必先有事於惡池”，是晉人祭河也。" }
      - { type: j, text: "天子諸侯，祭因國之在其地而無主後者。謂所因之國，先王先公有功德，宜享世祀。今絕無後為之祭主者，昔夏后氏郊鮌，至杞為夏後，而更郊禹。晉侯夢黃熊入國而祀夏郊，此其禮也。○鮌，古本反。能，乃登反，一本又作熊，音雄。" }
      - { type: z, text: "“天子”至“後者”。○正義曰：此一節論天子置都之所，及諸侯所封之內，皆因古昔先王先公所居之地，今其地子孫絕滅而無主後者，則天子諸侯祭此先王先公，故云“祭因國之在其地而無主後者”。若天子因先公之後，亦祭先公。若諸侯因先王之後，亦祭先王。先王先公，皆謂有德宜世祀者。○注“昔夏”至“禮也”。○正義曰：按《祭法》夏后氏亦禘黃帝而郊鯀，是夏郊篰。雲“至杞為夏後，而更郊禹”者，按《禮運》雲“杞之郊也，禹也”，是杞郊禹也。殷滅夏之時，殷則不應郊鯀，必應封夏之後，但不知名杞以否，至周封夏後於杞，據《禮運》成文，故云杞更郊禹也，不廢殷時夏後已郊禹也。雲“晉侯夢黃熊入國而祀夏郊”者，按昭七年晉侯有疾，夢黃熊入於寢門。於時子產聘晉，韓宣子問子產：“其何厲鬼？”子產曰：“昔堯殛鯀於羽山，其神化為黃熊，以入於羽淵，實為夏郊，三代祀之。晉為盟主，其或者未之祀也。韓子祀夏郊，晉侯有間。”如傳所云，夏後之時，郊祭鯀以配天。至殷周之時，鯀雖不配天，以其有功，列於群祀，故云“三代祀之”。但《春秋》之時，周衰禮廢，不能祀鯀。晉既為盟主，當代天子祭群神群祀，傳之意義，謂晉當代天子攝群神之祀，不謂因此國在地無主後者。今鄭引之以證祭無主後，則謂鯀是夏家之先，晉居夏之舊地，鯀無主後，故晉祀之，禮之與傳意少異。然夏後有杞，而云無主後者，以杞不祭鯀，故云“無主後”也。其黃熊之言，稱入羽淵，按《爾雅》“鱉三足，能”，先師或以為黃熊，義或然也。" }
      - { type: j, text: "天子犆礿，祫禘、祫嘗、祫烝。犆猶一也。祫，合也。天子諸侯之喪畢，合先君之主於祖廟而祭之，謂之祫。後因以為常。天子先祫而後時祭，諸侯先時祭而後祫。凡祫之歲，春一礿而巳。不祫，以物無成者不殷祭。周改夏祭曰礿，以禘為殷祭也。魯禮，三年喪畢而祫於大祖，明年春禘於群廟。自爾之後，五年而再殷祭，一祫一禘。○犆音特。祫音洽。諸侯礿則不禘，禘則不嘗，嘗則不烝，烝則不礿。虞夏之制，諸侯歲朝，廢一時祭。○朝，直遙反。諸侯礿犆，互明礿、犆文。○互音戶，又戶故反。禘一犆一祫。下天子也。祫歲不禘。○下，戶嫁反。嘗祫，烝祫。" }
      - { type: z, text: "“天子”至“烝祫”。○正義曰：此一節論夏殷天子諸侯大祭及時祭之事，各隨文解之。○天子之祭，當祫之歲，以春物未成，不為祫祭。惟犆為時祭之礿，故云“犆礿”。下秋冬之時，先為祫祭，後為時祭，故云“祫禘、祫嘗、祫烝”。○注“天子”至“一禘”。○正義曰：按文二年“八月，丁卯，大事於大廟”，《公羊傳》雲：“大事者何？大祫也。”按僖公三十三年十二月薨，至文二年八月，二十一月，於禮少四月，未得喪畢，是喪畢當祫。諸侯既爾，明天子亦然，故云“天子諸侯之喪畢，合先君之主於祖廟而祭之，謂之祫。”雲“後因以為常”者，按《禮緯》“三年一祫，五年一禘”，故知每三年為一祫祭，是後因以為常。雲“天子先祫而後時祭”者，以經雲“祫禘、祫嘗、祫烝”，天子位尊，故先為大禮也。雲“諸侯先時祭而後祫”者，以下文雲諸侯“嘗祫，烝祫”，諸侯位卑，取其漸備，故先小禮，後大禮。此等皆因巳前之制，但不知幾年一祫。《禮緯》雲“三年一祫，五年一禘”，鄭雲“百王通義”，則虞夏及殷，皆與周同袷，亦三年為一也。皇氏取先儒之義，以為虞夏祫祭，每年皆為。又云“三時祫”者，謂是秋冬。或一時得祫則為之，不三時俱祫。然按鄭雲：“三年一祫，五年一禘，百王通義。”鄭又注此雲：“春一礿而己。不祫，以物無成者不殷祭。”又《禘祫志》雲：“《王制》記先王之法，祫為大祭，祫於秋於夏於冬。周公制禮，祭不欲數。”如鄭此言，則夏殷三時俱殷祭，皇氏之說也。雲“魯禮三年喪畢而祫於大祖”者，僖公以三十三年十二月薨，文二年八月“大事於大廟”，於禮少四月，文公應合二年十二月而祫大祖廟也。是新君即位之二年，而云三年喪畢者，通死君之年為三年。雲“明年春禘於群廟”者，以僖公八年“禘於大廟”，宣公八年“辛已，有事於大廟”。有事，禘也，為仲遂卒略言有事。僖也，宣也，皆八年禘。既五年一禘，則後禘去前禘五年也。前禘當三年，今二年而祫，故云“明年春禘於群廟”。按閔二年五月“吉禘於莊公”，昭十五年“禘於武宮”，昭二十五年“將禘於襄公”，禘皆各就廟為之，故云群廟。雲“自爾之後，五年而再殷祭”者，《公羊傳》文。雲“自爾”者，謂自三年禘群廟之後，每五年之內，再為殷祭，故鄭《禘祫志》雲：“閔公之喪，僖三年禘，僖六年祫，僖八年禘。凡三年喪畢，新君二年為祫。”新君三年為禘，皆祫在禘前，閔公二年五月“吉禘於莊公”，則祫當在吉禘之前，故《禘祫志》雲：“四月祫，五月禘。”不譏祫者，慶父作亂，國家多難。故莊公既葬，絰不入庫門。閔公早厭其亂，故四月祫，不譏，五月即禘。比月而為大祭，又於禮少四月，故書譏其速也。鄭《禘祫志》雲：“魯莊三十二年八月公薨，閔二年五月吉禘。時慶父殺子般之後，公懼於難，不得時葬。葬則去首絰於門外，乃入，務自尊成以厭其禍。若巳練然，免喪又速。二年四月夏則祫。既祫，又即以五月禘於其廟。此月大祭，故譏其速也。閔公之服，凡二十一月，於禮少四月，又不禫，雲吉禘，譏其無恩也。閔公以二年八月薨，僖二年除喪，始祫大廟，明年禘於群廟，自此而後，五年再殷祭，六年祫，故八年禘。僖公以三十三年十二月薨，至文二年七月間有閏，積二十一月，明月即祫。經雲‘八月，丁卯，大事於大廟，躋僖公’，於文公之服，亦少四月，以其逆祀，故特譏之。文公十八年二月薨，宣二年除喪而祫，三年禘於群廟，自此之後，亦五年再殷祭，與僖同。六年祫，故八年禘。昭十一年五月‘夫人齊歸薨’，十三年平丘之會，歸，不及祫。冬，公如晉，昭十四年春歸，乃祫，故十五年春乃禘。經雲‘二月，癸酉，有事於武宮’，至十八年祫，二十年禘，二十三年祫。昭二十五年，禘於襄公也。”此是鄭論魯之禘祫。鄭又云：“《明堂位》曰魯，王禮也。以此相推兄可知。”是鄭以天子之禮與魯同也。按《穀梁傳》以年數者不數閏，而鄭數莊公及僖公之喪，皆雲通閏二十一月者，鄭欲盛言日月闕少，假令通閏，止有二十一月耳。鄭於《禘祫志》除莊公之喪少四月，而答趙商雲於禮少六月者，通禫月言之也。哀姜之喪，僖三年乃除。僖二年得除閔公喪而祫者，以是喪祭雖在前喪之內，亦得為後喪之祭，故《雜記》雲“三年之喪，則既顈，其練祥皆行”是也。此雲三年喪畢，祫於太祖廟，明年春禘於群廟。按《玄鳥》箋雲“三年既畢，禘於其廟，而後祫祭於太祖”，更有禘於其廟之文。不同者，謂練時遷主遞廟。新死者，當禘祭於其廟以安之，故《鬯人》雲“廟用脩”，注云“謂始禘時”。《左氏》說禘謂既期之後。然則禘於其廟，在於練時。而《玄鳥》箋雲“喪三年既畢，禘於其廟”者，鄭將練禘總就喪畢祫於太祖而言之，其實禘廟在練時也。熊氏一說，謂三年除喪，特禘新死者於廟，未知然否。其禘祫大小，鄭以《公羊傳》雲“大事者何？大祫也”，“毀廟之主，陳於太祖。未毀廟之主，皆升，合食於太祖”，故為大事。若王肅、張融、孔晁皆以禘為大，祫為小，故王肅論引賈逵說吉禘於莊公。禘者，遞也，審遞昭穆遷主遞位，孫居王父之處，又引禘於太廟。《逸禮》“其昭屍穆屍，其祝辭總稱孝子孝孫”，則是父子並列。《逸禮》又云“皆升合於其祖”，所以劉歆、賈逵、鄭眾、馬融等皆以為然。鄭不從者，以《公羊傳》為正，《逸禮》不可用也。又《曾子問》雲“七廟、五廟無虛主，虛主者，惟天子崩“，與祫祭，祝取群廟之主。明禘祭不取群廟之主可知。《爾雅》雲：“禘，大祭也。”謂比四時為大也。故孫炎等注《爾雅》，雲皆以禘為五年一大祭。若《左氏》說及杜元凱，皆以禘為三年一大祭，在大祖之廟。傳無祫文，然則祫即禘也。取其序昭穆謂之禘，取其合集群祖謂之祫。鄭康成祫禘及四時祭所以異者，此祫謂祭於始祖之廟，毀廟之主，及未毀廟之主，皆在始祖廟中，始祖之主於西方東面，始祖之子為昭，北方南面，始祖之孫為穆，南方北面。自此以下皆然。從西為上，禘則太王、王季以上遷主，祭於后稷之廟，其坐位乃與祫相似。其文武以下遷主，若穆之遷主，祭於文王之廟，文王東面，穆主皆北面，無昭主。若昭之遷主，祭於武王之廟，武王東面，其昭主皆南面，無穆主。又祭親廟四。其四時之祭，惟后稷文武及親四廟也。○“諸侯”至“不礿”。○“礿則不禘”者，虞夏之制，歲朝皆闕一時之祭也。此從南方始也。南方諸侯有礿祭竟，夏來朝，故闕夏禘，故云“礿則不禘”也。○“禘則不嘗”，此西方諸侯秋來朝也，行夏祭竟，而秋來朝，故不嘗也。○“嘗則不烝”，此北方諸侯冬來朝者也，行秋祭竟，而冬來朝，故廢烝也。“烝則不礿”，此東方諸侯春來朝者也，行冬祭竟，而春來朝，故廢礿也。然各廢一時耳，餘三時皆祭也。今不從東方始，而從南方始者，欲舉春礿得祭者為始故也。○注“虞夏”至“祭時”。○正義曰：此雲“虞夏之制”者，雜明諸代，不專殷。又此春礿，而注云夏殷，則知夏殷春祭俱名礿也。○“諸侯”至“烝祫”。○諸侯降於天子，故礿在犆上也。欲見先時祭，故礿在犆上。○“禘一犆一祫”者，言諸侯當在夏祭一禘之時，不為禘祭，惟犆一祫而已，闕時祭也。不雲一禘而云禘一者，禘在礿前，與礿在犆前，其義同，皆見先時祭也。○“嘗祫烝祫”者，謂諸侯先作時祭烝嘗，然後為大祭之祫，故云“嘗祫烝祫”。鄭既雲諸侯祫歲不禘，是諸侯當祫之歲，法不作禘。而皇氏雲諸侯夏時若祫，則不禘，若禘則不祫，故違鄭注，其義非也。" }
      - { type: j, text: "天子社稷皆大牢。諸侯社稷皆少牢。大夫、士宗廟之祭，有田則祭，無田則薦。有田者既祭，又薦新。祭以首時，薦以仲月。士薦牲用特豚，大夫以上用羔，所謂“羔豚而祭，百官皆足”。《詩》曰：“四之日其早，獻羔祭韭。”○大牢如字，又音泰。少，詩照反。日，人一反。庶人春薦韭，夏薦麥，秋薦黍，冬薦稻。韭以卵，麥以魚，黍以豚，稻以雁。庶人無常牲，取與新物相宜而巳。○稻音盜。卵，力管反。祭天地之牛角繭栗，宗廟之牛角握，賓客之牛角尺。握，謂長不出膚。○繭字又作蠒，公典反。握，厄角反。長，丁丈反。膚，方於反。諸侯無故不殺牛，大夫無故不殺羊，士無故不殺犬豕，庶人無故不食珍。故，謂祭饗。" }
      - { type: z, text: "“天子”至“食珍”。○正義曰：此一節論天子諸侯祭用牲牢，及庶人所薦之物，各隨文解之。○注“有田者既祭”至“祭韭”。○正義曰：知有田既祭又薦新者，以《月令》天子祭廟，又有薦新，故《月令》四月“以彘嘗麥，先薦寢廟”。又《士喪禮》有薦新如朔奠，謂有地之士，大斂小斂以特牲，而云薦新，故知既祭又薦新也。雲“祭以首時，薦以仲月”者，《晏子春秋》雲“天子以下至士，皆祭以首時”，故《禮記·明堂位》雲：“季夏六月，以禘禮祀周公於大廟。”週六月，是夏四月也。又《雜記》雲：“七月而禘，獻子為之也。”譏其用七月，明當用六月是也。魯以孟月為祭。魯，王禮也，則天子亦然。大夫、士無文，從可知也。其《周禮》四仲祭者，因田獵而獻禽，非正祭也。服虔注桓公五年傳雲：“魯祭天以孟月，祭宗廟以仲月。”非鄭義也。此薦以仲月，謂大夫士也。既以首時祭，故薦用仲月。若天子諸侯禮尊，物熟則薦之，不限孟仲季，故《月令》孟夏薦麥，孟秋薦黍，季秋薦稻是也。大夫既薦以仲月，而服虔注昭元年傳：“祭，人君用孟月，人臣用仲月。”不同者，非鄭義也。南師解雲：“祭以首時者，謂大夫、士也。若得祭天者，祭天以孟月，祭宗廟以仲月。其禘祭、祫祭、時祭，亦用孟月，其餘諸侯不得祭天者，大祭及時祭皆用孟月。”既無明據，未知孰是，義得兩通，故並存焉。按《春秋》桓八年“正月，已卯，烝”，“夏，五月，丁丑，烝”，書者，《左氏》見其瀆。桓十四年八月“乙亥，嘗”，書以“御廩災”。《左氏》、《公羊》以為不應嘗。僖八年“七月，禘”，鄭以為公會王人於洮，故歸，七月乃禘。昭十五年二月禘於武宮者，鄭《禘祫志》以十一年齊歸薨，十五年喪終之禘，不擇月。定公八年冬十月順祀先公，以陽虎作亂，求福先公，特為此祭，故不用常月。此等皆不用孟月者，以春秋亂世，不能如禮，故參差不一，難以禮論也。雲“士薦牲用特豚”者，按《儀禮·特牲》，是有地之士用特牲，今無地之士薦宜貶降，不用成牲，故用特豚。雲“大夫以上用羔”者，以諸侯大夫有地祭者，用少牢，其無地薦者則用羔也。言以上，則包天子皆用羔也。雖用羔，天子諸侯亦用餘牲，不皆用羔，故《月令》以彘嘗麥，以犬嘗麻。雲“所謂羔豚而祭，百官皆足”者，所謂是《禮器》文。士薦而云百官者，舉大夫以上而言。士之屬吏，以眾言之，亦曰百官，故任厥問雲：“《天官·司裘》注云：‘士不太射，士無臣，祭無所擇。’此雲百官皆足，則有臣矣。”汜閤答曰：“此上下兼說之耳。士雖無臣，猶有屬官佐祭。《特牲饋食》雲‘公有司私臣，皆殽{丞月}’，百官皆足，抑謂此也。”引“《詩》曰”者，是《豳風·七月》之篇也。雲四之日，謂周之四月，夏之二月，其朔旦之時獻羔，祭用韭，薦於廟。引之者，證薦用羔之義。○注“新物相宜”。○正義曰：言相宜者，謂四時之間，有此牲穀，兩物俱有，故云相宜，非謂氣味相宜。其相宜者，若牛宜稌、羊宜黍之屬是也。○注“握謂長不出膚”。○正義曰：《公羊傳》曰“膚寸而合”，鄭注《投壺禮》雲“四指曰扶”，扶則膚也。○注“故謂祭饗”。○正義曰：按《膳夫》王日一舉，鼎十有二物，謂大牢也。是周公制禮，天子日食大牢，則諸侯日食少牢，大夫日食特牲，士日食特豚。至後世衰亂，《玉藻》雲“天子食日少牢，朔月大牢，諸侯食日特牲，朔月少牢”，則知大夫食日特豚，朔日特牲。士日食無文，朔月特豚，故《內則》曰“見子具視朔食”，注云“天子大牢，諸侯少牢，大大特豕，士特豚”，是常食有限，不得逾越，故知謂祭也。謂諸侯祭以大牢，得殺牛。諸侯之大夫祭以少牢，得殺羊。天子大夫祭，亦得殺牛。其諸侯及大夫饗食賓，得用牛也，故《大行人》、《掌客》，諸侯待賓，皆用牛也。公食大夫禮、大夫食賓禮亦用牛也，故云“謂祭饗”也。" }
      - { type: j, text: "庶羞不逾牲，祭以羊，則不以牛肉為羞。燕衣不逾祭服，寢不逾廟。" }
      - { type: z, text: "注“祭以”至“為羞”。○正義曰：按《有司徹》是少牢之祭，雲“宰夫羞房中之羞”，注“酏食糝食”。《內則》雲“糝取牛羊豕之肉”。得用牛者，祭既用少牢，則糝亦不用牛肉，以羊肉為羞。" }
      - { type: j, text: "古者公田藉而不稅，藉之言借也。借民力治公田，美惡取於此，不稅民之所自治也。《孟子》曰：“夏后氏五十而貢，殷人七十而助，周人百畝而徹。”則所云古者，謂殷時。○燕，伊見反。藉，在亦反。稅，式贅反。借，子夜反。市廛而不稅，廛，市物邸舍，稅其舍，不稅其物。○廛，直連反。邸，丁禮反。關譏而不徵，譏，譏異服，識異言。徵亦稅也。《周禮》：“國兇札，則無門關之徵，猶譏也。”○譏，居宜反。徵，本又作正，音同，注下皆同。札，側八反，又音截。林麓川澤，以時入而不禁。麓，山足也。○麓音鹿。夫圭田無徵。夫猶治也。徵，稅也。《孟子》曰：“卿以下必有圭田。”治圭田者不稅，所以厚賢也。此則《周禮》之士田，以任近郊之地，稅什一。○圭音珪。" }
      - { type: z, text: "“古者”至“無徵”。○正義曰：此一節論古者公田不稅，及關市圭田無徵之事，各隨文解之。○自“古者”以下，至“夫圭田無徵”，並非周法，故云古者。其藉而不稅，正謂殷時市廛而不稅。以下或兼虞夏殷以言之。○“公田藉而不稅”者，謂民田之外，別作公田。一井之中，凡有九夫，中央一夫，以為公田。藉之言借也。惟借八家之力，以治此公田，美惡取於此，而不稅民之私田。○“市廛而不稅”者，廛謂公家邸舍，使商人停物於中，直稅其所舍之處價，不稅其在市所賣之物。市內空地曰廛，城內空地曰肆。○“關譏而不徵”者，徵，稅也。關，竟上門也。譏，謂呵察。公家但呵察非違，不稅行人之物。此夏殷法，周則有關門之徵，但不知稅之輕重。若凶年則無稅也，猶須譏禁，禁謂防遏。○“林麓川澤，以時入而不禁”者，以時入者，獺祭魚，然後虞人入澤梁謂民庶須有采取隨時而入官不限禁之。○夫圭田無徵者，夫猶治也。畿內無公田，故有圭田，卿大夫士皆以治此圭田，公家不稅其物，故云無徵。必雲圭者，圭，絜白也。言卿大夫德行絜白，乃與之田，此殷禮也。殷政寬緩，厚重賢人，故不稅之。周則兼通士稅之，故注云“《周禮》之士田，以任近郊之地，稅什一”。○注“藉之”至“殷時”。○正義曰：“治公田，美惡取於此，不稅民之所自治也”者，按宣十五年“初稅畝”，傳雲“非禮”，謂稅民所自治為非禮，明依禮，惟取公田之物，故云“美惡取於此”。引《孟子》者，證三代稅法不同。按《孟子》滕文公問為國於《孟子》，《孟子》對曰：“夏后氏五十而貢，殷人七十而助，周人百畝而徹，其實皆什一。”劉氏及皇氏皆雲：“夏時民多，家得五十畝而貢五畝。殷時民稍稀，家得七十畝而助七畝。周時其民至稀，家得百畝而徹十畝。故云其實皆什一。”而云夏時人眾，殷世人稀。又十口之家，惟得五十畝之地，皆不近人情，未知可否。熊氏一說以為夏政寬簡，一夫之地，惟稅五十畝。殷政稍急，一夫之地，稅七十畝。周政極煩，一夫之地，稅皆通稅。所稅之中，皆十而稅一，故云其實皆什一。此則計田雖不得什一，理稍可通。既古意難知，故彼此俱載。又鄭注《匠人》雲：“貢者，自治其所受田，貢其稅穀。助者，借民之力以治公田，又使收斂焉。夏則有貢無助，殷則有助無貢。”鄭注《匠人》又云：“以《載師職》及《司馬法》論之，周制畿內，用夏之貢法，稅夫無公田；以《詩》、《春秋》、《論語》、《孟子》論之，周制邦國用殷之助法，制公田不稅夫，此三代所以別也。”雲“古者謂殷時”者，以《春秋》宣十五年雲“穀出不過藉”，藉謂借民力也。此經亦云藉，皆謂借民力也。助官治田，與殷七十而助相當，故云古謂殷時。鄭知周之畿內用夏貢法者，按《載師》雲：“以廛裏任國中之地，以埸圃任園地，以宅田、士田、賈田任近郊之地，以官田、牛田、賞田、牧田任遠郊之地，以公邑之田任甸地，以家邑之田任稍地，以小都之田任縣地，以大都之田任畺地。”鄭注云“廛裏，邑居里矣。廛民，居之區域也”，“宅田，致仕者之家所受田也”，“仕田，自卿以下所受圭田也”，“賈田，在市賈人其家所受田也。官田，庶人在官者其家所受田也。牛田、牧田，畜牧者之家所受田”，“賞田者，賞賜之田”，“公邑，謂六遂餘地，天子使大夫治之”，“家邑、大夫之采地。小都，卿之采地。大都，公之采地”。《載師》又云：“園廛二十而一，近郊十一，遠郊二十而三，甸、稍、縣、都皆無過十二。”又《司馬法》雲：“井十為通，通為匹馬。三十家士一人，徒二人，通十為成，成百井。三百家革車一乘，士十人，徒二十人，計一成百井。井有九家，百井即九百家。”而云“一成三百家”者，以此田上中下除宮室塗巷三分之一，自餘通率一家受二夫，故一成為三百家。是一井九家為定，無公田也，故鄭雲“以《載師職》及《司馬法》論之，周制畿內用夏之貢法”。不稅夫者，謂鄉遂及公邑若采地，即為井田，稅夫與畿外同。知畿外用助法者，按《詩·小雅》：“雨我公田，遂及我私。”《春秋》宣十五年雲“初稅畝”，傳雲：“穀出不過藉。”《論語》雲：“盍徹乎？”《孟子》雲：“方里而井，井九百畝，其中為公田，八家皆私百畝。”是皆論公田之事，故鄭雲“以《詩》、《春秋》、《論語》、《孟子》論之，周制邦國用殷之助法，制公田不稅夫”。然畿外諸侯雖立公田，其實諸侯郊外亦用貢法，故《孟子》雲野，九夫之田而稅一，即“九一而助，國中什一使自賦”，故鄭雲邦國亦異外內耳。但郊內地少，郊外地多，從多言之，故云“畿外製公田，不稅夫也”。凡賦法無過十一，故《孟子》雲輕於十一，大貉小貉；重於十一，大桀小桀。十一而稅，堯舜之道。但周之畿內有參差，皆不同，而言之十一，若畿外，先儒約《孟子》、《樂緯》，皆九夫為井，八家共治公田八十畝，已外二十畝以為八家井灶廬舍，是百畝之外別助，是十外稅一。郊外既十外稅一，郊內亦十外稅一。假令治一夫之田，得百一十碩粟，而貢十碩，是亦十外稅一也。劉氏以為《匠人》注引《孟子》野九夫而稅一，國中什一，諸侯謂之徹者，通其率以十一為正，則謂野九夫之田而稅一，國中十一夫之田而稅一，是二十夫之田中而稅二。計地言之，是十中稅一。若計夫實稅，猶十外稅一，與先儒同也。但不知諸侯郊內十夫受十一夫之地，若為周制耳。或畿外地寬也，一夫受百一十畝之地，與畿內異也。○注“周禮”至“譏也”。○正義曰：引《周禮》者，證凶荒之時，雖無徵稅，猶須譏禁，禁謂防遏為重。其殷則雖無凶荒，縱不賦稅，猶須譏禁，與周凶荒時同，則門關有稅，但不知稅之輕重。○注“麓山足”。正義曰：按僖十四年“沙鹿崩”，《穀梁傳》雲“林屬於山為鹿”。鹿，山足也。按鄭注《大司徒》雲：“竹木曰林，注瀆曰川，水鍾曰澤。”林麓山澤之異也。○注“徵稅”至“什一”。○正義曰：《載師》雲“漆林之徵，二十而五”，又云“凡任地，國宅無徵”，是正謂稅也。引《孟子》書者，證卿以下有圭田。謂之圭者，圭，絜也，言德行絜白也。而與之田，殷所不稅者，殷政寬厚，重賢人，周則稅之。故鄭雲“此即《周禮》之士田，以任近郊之地，稅什一”者，《載師》文也。" }
      - { type: j, text: "用民之力，歲不過三日。治宮室城郭道渠。" }
      - { type: z, text: "正義曰：此一經前明以殷法，此則兼通周禮。三日，謂使民治城郭道渠，年歲雖豐，不得過三日，自下皆然。按《周禮·均人》雲：“豐年旬用三日，中年旬用二日，無年旬用一日。”年歲不同，雖豐不得過三日。" }
      - { type: j, text: "田裏不粥，墓地不請。皆受於公，民不得私也。粥，賣也。請，求也。" }
      - { type: z, text: "“田裏”至“不請”。○正義曰：田地裏邑，既受之於公，民不得粥賣。冢墓之地，公家所給，族葬有常，不得輒請求餘處。" }
      - { type: j, text: "司空執度度地。司空，冬官卿，掌邦事者。度，丈尺也。○度度，上如字；下大洛反，量也。居民山川沮澤，時四時，觀寒暖燥溼。沮，謂萊沛。○沮，將慮反，沮沮如也。暖，乃管反，又況袁反，下文汀，萊音來，何胤雲：“草所生曰萊。”庾雲：“草也。”沛，蒲具反，何胤雲：“水所生曰沛。”何休注《公羊傳》雲：“草棘曰沛。”量地遠近，制邑井之處。○處，昌慮反。興事任力。事，謂築邑、廬、宿、市也。○任，而鴆反。築音竹。凡使民，任老者之事，食壯者之食。寬其力，饒其食。○食壯音嗣，又如字；下側狀反。" }
      - { type: z, text: "“司空”至“之食”。○正義曰：此一節論司空居民並任以事食之事。言“司空執度度地”者，謂司空執丈尺之度，以量度於地，居處於民，觀山川高下之宜，沮澤浸潤之處。又必以時候此四時，知其寒暖。○注“觀寒”至“萊沛”。○正義曰：言觀寒暖，解四時燥溼，解山川沮澤。燥謂山也，溼謂川與沮，澤謂萊沛者，何胤雲：“沮澤，下溼地也。草所生為萊，水所生為沛。”言沮地是有水草之處也。○注“制邑井之處”。○正義曰：按《小司徒》雲：“九夫為井，四井為邑。”為邑之處，謂平原之地，衍沃之所，堪造邑井，即《左傳》所謂“井衍沃”也。若山林藪澤，則不堪邑井也。○注“事謂”至“市也”。○正義曰：上雲用民之力，惟三日而巳，故注云“治宮室城郭道渠”。此言興事，言興則用力難重，故云“事謂築邑“。築邑則築城也。又築廬之與宿及市。按《遺人》雲“凡國野之道，十里有廬”，“三十里有宿”，“五十里有市”是也。○“凡使民，任老者之事，食壯者之食”者。○凡國家為役之法，老少功程不同，老則功少，壯則功多。今使民之時，雖役壯者，限以老者之功程，故曰“任老者之事”。凡廩餼牲體，壯者食多，老者食少，雖老者給以壯者之料，故食壯者之食，壯者從老者之功，故注云“寬其力”。老給壯糧，故云“饒其食”。" }
      - { type: j, text: "凡居民材，必因天地寒暖燥溼。使其材藝堪地氣也。○燥，素老反。廣谷大川異制，謂其形象，民生其間者異俗，謂其所好惡。○好惡，上呼報反；下烏路反。剛柔、輕重、遲速異齊。謂其情性緩急。○齊，才細反。緩，戶管反。五味異和，謂香臭與鹹苦。○和，胡臥反，下同。臭，尺救反。器械異制，謂作務之用。○械，戶戒反，何休注《公羊》雲：“攻守之器曰械。”鄭注《大傳》雲：“禮樂之器及兵甲也。”郭璞《三蒼解詁》雲：“械，器之總名。”衣服異宜。謂旃裘與絺綌。○旃裘，上之然反；下音求。絺，初宜反。綌，去逆反。脩其教，不易其俗。齊其政，不易其宜。教謂禮義，政謂刑禁。中國戎夷，五方之民，皆有性也，不可推移。地氣使之然。東方曰夷，被髮文身，有不火食者矣。南方曰蠻，雕題交趾，有不火食者矣。雕，文。謂刻其肌，以丹青之。交趾，足相鄉然，浴則同川，臥則僢。不火食，地氣暖，不為病。○被，皮義反，下同。雕，本又作彫，同；彫，刻鏤也。題，大兮反。趾音止。刻音克。肌音飢。，乃結反。相鄉，許亮反。僢，昌戀反。西方曰戎，被髮衣皮，有不粒食者矣。北方曰狄，衣羽毛穴居，有不粒食者矣。不粒食，地氣寒，少五穀。○衣，於既反，下同。粒音立。中國、夷、蠻、戎、狄，皆有安居、和味、宜服、利用、備器。其事雖異，各自足。五方之民，言語不通，嗜欲不同。達其志，通其欲，東方曰寄，南方曰象，西方曰狄鞮，北方曰譯。皆俗間之名，依其事類耳。鞮之言知也。今冀部有言狄鞮者。○嗜欲，市志反。寄，京義反。鞮，丁兮反。譯音亦。間如字，又間廁之間。" }
      - { type: z, text: "“凡居”至“曰譯”。○正義曰：此一節論中國及四夷居處言語衣服飲食不同之事，各隨文解之。○“凡居民材，必因天地寒暖燥溼”者，材謂氣性材藝，言五方之人，其能各殊。五者居處，各須順其性氣材藝，使堪其地氣，故盧植雲“能寒者使居寒，能暑者使居暑”，即其義也。○注“情性緩急”。○正義曰：性謂稟性自然，故《孝經說》雲“性者，生之質。若木性則仁，金性則義，火性則禮，水性則信，土性則知”，《中庸》雲“天命之謂性”，是賦命自然。情者，既有識知，心有好惡，當逐物而遷，故有喜怒哀樂好惡。此經雲“剛柔輕重遲速”，天生自然，是性也。而連言情者，情是性之小別，因性連言情者耳。若指而言之，則上文異俗是情也。故注云“謂其所好惡”。今經有“剛柔輕重遲速”六事，而注惟雲緩急者，細別則有六，大總惟二。剛輕速，總是急也。柔重遲，總是緩也，此大略而言。人性不同，亦有柔而躁者，剛而遲者，故《尚書》雲“皋陶行有九德”是也。○注“謂作務之用”。○正義曰：作務之用者，謂民之作務所用，五方不同，故《考工記》若粵之用鎛，胡之用弓車，故云“器械異制”。器謂總用之器，械謂兵器，故《公羊傳》何休雲：“攻守之器曰械。”○“脩其”至“其宜”。○俗謂民之風俗，宜謂土地器物所宜，教謂禮義教化，政謂政令施為，言脩此教化之時，當隨其風俗，故云“不易其俗”。○“齊其政”者，謂齊其政令之事，當逐物之所宜，故云“不易其宜”。教主教化，故注云“教謂禮義”。政主政令，故注云“政謂刑禁”也。○“中國”至“曰譯”。○正義曰：從此以下至北方曰譯，總論四夷中國之異。○“中國戎夷五方之民”者，舉戎夷則蠻狄可知。“五方之民”者，謂中國與四夷也。○“文身”者，謂以丹青文飾其身。○“有不火食”者，以其地氣多暖，雖不火食，不為害也。言有不火食者，亦有火食者。○“彫題交趾”者，彫謂刻也，題謂額也。謂以丹青彫刻其額，非惟彫額，亦文身也。故仲雍居吳越，《左傳》雲“斷髮文身”。趾，足也。言蠻臥時頭鄉外，而足在內而相交，故云“交趾”。不雲被髮者，發斷故也。○“衣皮，有不粒食者矣”者，以無絲麻，惟食禽獸，故衣皮。地氣寒，少五穀，故有不粒食者。○“衣羽毛於穴居”者，東北方多鳥，故衣羽。正北多羊，故衣毛。凝寒至盛，林木又少，故穴居。其有不粒食者，與西戎同。○“中國夷蠻戎狄，皆有安居”者，言中國與四夷雖異，各有所安之居。○“和味、宜服、利用、備器”者，言中國與四夷皆有所和之味，所宜之服，所利之用，所備之器，其事雖異，各自充足。○“五方之民，言語不通，嗜欲不同”者，以水土各異，故言語不通；好惡殊別，故嗜欲不同。○“達其志，通其欲”者，謂帝王立此傳語之人，曉達五方之志，通傳五方之欲，使相領解。其通傳東方之語官謂之曰寄，言傳寄外內言語。通傳南方語官謂之曰象者，言放象外內之言。其通傳西方語官謂之狄鞮者，鞮，知也，謂通傳夷狄之語，與中國相知。其通傳北方語官謂之曰譯者，譯，陳也，謂陳說外內之言。東方謂之夷者，《風俗通》雲：“東方人好生，萬物牴觸地而出。夷者，牴也。”其類有九，依《東夷傳》“夷有九種，曰畎夷、於夷、方夷、黃夷、白夷、赤夷、元夷、風夷、陽夷。”又李巡注《爾雅》雲：“一曰玄菟、二曰樂浪、三曰高驪、四曰滿飾、五曰鳧臾、六曰索家、七曰東屠、八曰倭人、九曰天鄙。”南方曰蠻者，《風俗通》雲：“君臣同川而浴，極為簡慢。蠻者，慢也。”其類有八，李巡注《爾雅》雲：“一曰天竺、二曰咳首、三曰僬僥、四曰跛踵、五曰穿焜、六曰儋耳、七曰狗軹、八曰旁春。”西方曰戎者，《風俗通》雲：“斬伐殺生，不得其中。戎者，兇也。”其類有六，李巡注《爾雅》雲：“一曰僥夷，二曰戎央，三曰老白、四曰耆羌、五曰鼻息、六曰天剛。”北方曰狄者，《風俗通》雲：“父子嫂叔，同穴無別。狄者，闢也。”其行邪辟，其類有五，李巡注《爾雅》雲：“一曰月支、二曰穢貊、三曰匈奴、四曰單于、五曰白屋。”○注“彫文”至“為病”。○正義曰：按《漢書·地理志》文，越俗斷髮文身，以闢蛟龍之害，故刻其肌，以丹青之。以東方南方皆近於海，故俱文身。雲“浴則同川，臥則僢”者，言首在外而足相鄉內，故《典瑞》注云“僢而同邸”。正本直雲“臥則僢，”無同字。俗本有同字，誤也。○注“皆俗”至“鞮者”。○正義曰：言寄、象、狄鞮、譯，皆是四夷與中國，皆俗間之名也。雲“依其事類耳”者，○中國通傳之人，各依其當方事之比類而言說之，即寄者寄付東方之言，象者象似南方之言，是依其事類者也。雲“今冀部有言狄鞮者”，今日之言，必有從於古，欲證古有狄鞮之言，鞮與知聲相近，故鞮為知也。" }
      - { type: j, text: "凡居民，量地以制邑，度地以居民，地邑民居，必參相得也。得猶足也。○度，大洛反。參，七南反。無曠土，無游民，食節事時，民咸安其居，樂事勸功，尊君親上，然後興學。立小學大學。○鹹，行緘反。樂音嶽，又音洛。" }
      - { type: z, text: "“凡居”至“興學”。正義曰：此一節論居民與地相得，及食節事時勸功尊君立學之事。○食節，謂食得其節。事時，謂事得其時。樂事，謂民樂悅事務。勸功，謂勉勵立功。尊君，謂臣民尊君。親上，謂在下親愛長上。民富而可教，謂民事既得如此，然後可得興學也。" }
      - { type: j, text: "《禮記正義》" }
