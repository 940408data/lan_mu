# 遵生八箋 卷九 延年卻病箋：點校中導覽（teaser）
# 原文據識典古籍四庫全書本，標點自施；導語/解讀為 AI 原創
sections:
  - id: yannian
    name: 延年卻病箋
    blocks:
      - type: j
        text: 延年卻病箋
      - type: z
        text: 導：此箋言養氣導引之術，以「我命在我，不在於天」為膽。薦語：我命在我、形氣相依。
      - type: j
        text: 高子曰：生身以養壽為先，養身以卻病為急。經曰：我命在我，不在於天。昧用者夭，善用者延。
      - type: z
        text: 讀：「我命在我」八字振起：延年卻病之要，在「善用」二字，養生以主動為宗。
      - type: j
        text: 故人之所生，神依於形，形依於氣。氣存則榮，氣敗則滅。形氣相依，全在攝養。
      - type: z
        text: 讀：神、形、氣輾轉相依，而樞紐在「攝養」。養氣保神、運體卻病，諸術皆由此出。
