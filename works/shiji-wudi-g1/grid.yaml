labels:
  - page: 6
    col: 9
    role: z
    text: 五帝本紀
  - page: 6
    col: 10
    role: j
    text: 黃帝者少典之子姓公孫名曰軒轅生而神靈弱而
  - page: 6
    col: 11
    role: j
    text: 能言幼而徇齊長而敦敏成而聰明軒轅之時神農
  - page: 6
    col: 12
    role: j
    text: 氏世衰諸侯相侵伐暴虐百姓而神農氏弗能征於
  - page: 6
    col: 13
    role: j
    text: 是軒轅乃習用干戈以征不享諸侯咸来賔從而蚩
  - page: 6
    col: 14
    role: j
    text: 尤最為暴莫能伐炎帝欲侵陵諸侯諸侯咸歸軒轅
  - page: 6
    col: 15
    role: j
    text: 軒轅乃修德振兵治五氣藝五種撫萬民度四方教
  - page: 6
    col: 16
    role: j
    text: 熊羆貔貙虎以與炎帝戰於阪泉之野三戰然後
  - page: 7
    col: 1
    role: j
    text: 得其志蚩尤作亂不用帝命於是黄帝乃徵師諸侯
  - page: 7
    col: 2
    role: j
    text: 與蚩尤戰於涿鹿之野遂禽殺蚩尤而諸侯咸尊軒
  - page: 7
    col: 3
    role: j
    text: 轅為天子代神農氏是為黄帝天下有不順者黄帝
  - page: 7
    col: 4
    role: j
    text: 從而征之平者去之披山通道未嘗寧居東至于海
  - page: 7
    col: 5
    role: j
    text: 登丸山及岱宗西至于空桐登雞頭南至于江登熊
  - page: 7
    col: 6
    role: j
    text: 湘北逐葷粥合符釜山而邑于涿鹿之阿遷徙徃来
  - page: 7
    col: 7
    role: j
    text: 無常處以師兵為營衛官名皆以雲命為雲師置左
  - page: 7
    col: 8
    role: j
    text: 右大監監于萬國萬國和而鬼神山川封禪與為多
  - page: 7
    col: 9
    role: j
    text: 焉獲寳鼎迎日推筴舉風后力牧常先大鴻以治民
  - page: 7
    col: 10
    role: j
    text: 順天地之紀幽明之占死生之說存亡之難時播百
  - page: 7
    col: 11
    role: j
    text: 穀草木淳化鳥獸蟲蛾旁羅日月星辰水波土石金
  - page: 7
    col: 12
    role: j
    text: 玉勞勤心力耳目節用水火材物有土德之瑞故號
  - page: 7
    col: 13
    role: j
    text: 黄帝黄帝二十五子其得姓者十四人黄帝居軒轅
  - page: 7
    col: 14
    role: j
    text: 之丘而娶於西陵之女是為嫘祖嫘祖為黄帝正妃
  - page: 7
    col: 15
    role: j
    text: 生二子其後皆有天下其一曰玄囂是為青陽青陽
  - page: 7
    col: 16
    role: j
    text: 降居江水其二曰昌意降居若水昌意娶蜀山氏女
  - page: 8
    col: 1
    role: j
    text: 曰昌僕生高陽高陽有聖德焉黄帝崩葬橋山其孫
  - page: 8
    col: 2
    role: j
    text: 昌意之子高陽立是為帝顓頊也
  - page: 8
    col: 3
    role: j
    text: 帝顓頊高陽者黄帝之孫而昌意之子也靜淵以有
  - page: 8
    col: 4
    role: j
    text: 謀疏通而知事養材以任地載時以象天依鬼神以
  - page: 8
    col: 5
    role: j
    text: 制義治氣以教化潔誠以祭祀北至于幽陵南至于
  - page: 8
    col: 6
    role: j
    text: 交趾西至于流沙東至于蟠木動靜之物小大之神
  - page: 8
    col: 7
    role: j
    text: 日月所照莫不砥屬帝顓頊生子曰窮蟬顓頊崩而
  - page: 8
    col: 8
    role: j
    text: 玄囂之孫高辛立是為帝嚳
  - page: 8
    col: 9
    role: j
    text: 帝嚳高辛者黄帝之曾孫也高辛父曰蟜極蟜極父
  - page: 8
    col: 10
    role: j
    text: 曰玄囂玄囂父曰黄帝自玄囂與蟜極皆不得在位
  - page: 8
    col: 11
    role: j
    text: 至高辛即帝位高辛於顓頊為族子高辛生而神靈
  - page: 8
    col: 12
    role: j
    text: 自言其名普施利物不於其身聰以知遠明以察微
  - page: 8
    col: 13
    role: j
    text: 順天之義知民之急仁而威惠而信修身而天下服
  - page: 8
    col: 14
    role: j
    text: 取地之財而節用之撫教萬民而利誨之曆日月而
  - page: 8
    col: 15
    role: j
    text: 迎送之明鬼神而敬事之其色郁郁其德嶷嶷其動
  - page: 8
    col: 16
    role: j
    text: 也時其服也士帝嚳溉執中而徧天下日月所照風
  - page: 9
    col: 1
    role: j
    text: 雨所至莫不從服帝嚳娶陳鋒氏女生放勳娶娵訾
  - page: 9
    col: 2
    role: j
    text: 氏女生摯帝嚳崩而摯代立帝摯立不善崩而弟放
  - page: 9
    col: 3
    role: j
    text: 勳立是為帝堯
  - page: 9
    col: 4
    role: j
    text: 帝堯者放勳其仁如天其知如神就之如日望之如
  - page: 9
    col: 5
    role: j
    text: 雲富而不驕貴而不舒黃收純衣彤車乘白馬能明
  - page: 9
    col: 6
    role: j
    text: 馴德以親九族九族既睦便章百姓百姓昭明合和
  - page: 9
    col: 7
    role: j
    text: 萬國乃命羲和敬順昊天數法日月星辰敬授民時
  - page: 9
    col: 8
    role: j
    text: 分命羲仲居郁夷曰暘谷敬道日出便程東作日中
  - page: 9
    col: 9
    role: j
    text: 星鳥以殷中春其民析鳥獸字微申命羲叔居南交
  - page: 9
    col: 10
    role: j
    text: 便程南譌敬致日永星火以正中夏其民因鳥獸希
  - page: 9
    col: 11
    role: j
    text: 革申命和仲居西土曰昧谷敬道日入便程西成夜
  - page: 9
    col: 12
    role: j
    text: 中星虛以正中秋其民夷易鳥獸毛毨申命和叔居
  - page: 9
    col: 13
    role: j
    text: 北方曰幽都便在伏物日短星昴以正中冬其民燠
  - page: 9
    col: 14
    role: j
    text: 鳥獸氄毛歲三百六十六日以閏月正四時信飭百
  - page: 9
    col: 15
    role: j
    text: 官眾功皆興堯曰誰可順此事放齊曰嗣子丹朱開
  - page: 9
    col: 16
    role: j
    text: 明堯曰吁頑凶不用堯又曰誰可者讙兜曰共工旁
  - page: 10
    col: 1
    role: j
    text: 聚布功可用堯曰共工善言其用僻似恭漫天不可
  - page: 10
    col: 2
    role: j
    text: 堯又曰嗟四嶽湯湯洪水滔天浩浩懷山襄陵下民
  - page: 10
    col: 3
    role: j
    text: 其憂有能使治者皆曰鯀可堯曰鯀負命毀族不可
  - page: 10
    col: 4
    role: j
    text: 嶽曰异哉試不可用而已堯於是聽嶽用鯀九歲功
  - page: 10
    col: 5
    role: j
    text: 用不成堯曰嗟四嶽朕在位七十載汝能庸命踐朕
  - page: 10
    col: 6
    role: j
    text: 位嶽應曰鄙德忝帝位堯曰悉舉貴戚及疏遠隱匿
  - page: 10
    col: 7
    role: j
    text: 者衆皆言於堯曰有矜在民間曰虞舜堯曰然朕聞
  - page: 10
    col: 8
    role: j
    text: 之其何如嶽曰盲者子父頑母嚚弟傲能和以孝烝
  - page: 10
    col: 9
    role: j
    text: 烝治不至姦堯曰吾其試哉於是堯妻之二女觀其
  - page: 10
    col: 10
    role: j
    text: 德於二女舜飭下二女於嬀汭如婦禮堯善之乃使
  - page: 10
    col: 11
    role: j
    text: 舜慎和五典五典能從乃徧入百官百官時序賓於
  - page: 10
    col: 12
    role: j
    text: 四門四門穆穆諸侯遠方賓客皆敬堯使舜入山林
  - page: 10
    col: 13
    role: j
    text: 川澤暴風雷雨舜行不迷堯以為聖召舜曰女謀事
  - page: 10
    col: 14
    role: j
    text: 至而言可績三年矣女登帝位舜讓於德不懌正月
  - page: 10
    col: 15
    role: j
    text: 上日舜受終於文祖文祖者堯大祖也於是帝堯老
  - page: 10
    col: 16
    role: j
    text: 命舜攝行天子之政以觀天命舜乃在璿璣玉衡以
  - page: 11
    col: 1
    role: j
    text: 齊七政遂類於上帝禋于六宗望于山川辯於羣神
  - page: 11
    col: 2
    role: j
    text: 揖五瑞擇吉月日見四嶽諸牧班瑞歲二月東廵狩
  - page: 11
    col: 3
    role: j
    text: 至於岱宗柴望秩於山川遂見東方君長合時月正
  - page: 11
    col: 4
    role: j
    text: 日同律度量衡修五禮五玉三帛二生一死為摯如
  - page: 11
    col: 5
    role: j
    text: 五器卒乃復五月南廵狩八月西廵狩十一月北廵
  - page: 11
    col: 6
    role: j
    text: 狩皆如初歸至于祖禰廟用特牛禮五歲一廵狩羣
  - page: 11
    col: 7
    role: j
    text: 后四朝徧告以言明試以功車服以庸肇十有二州
  - page: 11
    col: 8
    role: j
    text: 決川象以典刑流宥五刑鞭作官刑扑作教刑金作
  - page: 11
    col: 9
    role: j
    text: 贖刑眚哉過赦怙終賊刑欽哉欽哉惟刑之靜哉讙
  - page: 11
    col: 10
    role: j
    text: 兜進言共工堯曰不可而試之工師共工果淫辟四
  - page: 11
    col: 11
    role: j
    text: 嶽舉鯀治鴻水堯以為不可嶽彊請試之試之而無
  - page: 11
    col: 12
    role: j
    text: 功故百姓不便三苗在江淮荊州數為亂於是舜歸
  - page: 11
    col: 13
    role: j
    text: 而言於帝請流共工于幽陵以變北狄放驩兜於崇
  - page: 11
    col: 14
    role: j
    text: 山以變南蠻遷三苗於三危以變西戎殛鯀於羽山
  - page: 11
    col: 15
    role: j
    text: 以變東夷四臯而天下咸服堯立七十年得舜二十
  - page: 11
    col: 16
    role: j
    text: 年而老令舜攝行天子之政薦之於天堯辟位凡二
  - page: 12
    col: 1
    role: j
    text: 十八年而崩百姓悲哀如喪父母三年四方莫舉樂
  - page: 12
    col: 2
    role: j
    text: 以思堯堯知子丹朱之不肖不足授天下於是乃權
  - page: 12
    col: 3
    role: j
    text: 授舜授舜則天下得其利而丹朱病授丹朱則天下
  - page: 12
    col: 4
    role: j
    text: 病而丹朱得其利堯曰終不以天下之病而利一人
  - page: 12
    col: 5
    role: j
    text: 而卒授舜以天下堯崩三年之喪畢舜讓辟丹朱於
  - page: 12
    col: 6
    role: j
    text: 南河之南諸侯朝覲者不之丹朱而之舜獄訟者不
  - page: 12
    col: 7
    role: j
    text: 之丹朱而之舜謳歌者不謳歌丹朱而謳歌舜舜曰
  - page: 12
    col: 8
    role: j
    text: 天也夫而後之中國踐天子位焉是為帝舜
  - page: 12
    col: 9
    role: j
    text: 虞舜者名曰重華重華父曰瞽叟瞽叟父曰橋牛橋
  - page: 12
    col: 10
    role: j
    text: 牛父曰句望句望父曰敬康敬康父曰窮蟬窮蟬父
  - page: 12
    col: 11
    role: j
    text: 曰帝顓頊顓頊父曰昌意以至舜七世矣自從窮蟬
  - page: 12
    col: 12
    role: j
    text: 以至帝舜皆微為庶人舜父瞽叟盲而舜母死瞽叟
  - page: 12
    col: 13
    role: j
    text: 更娶妻而生象象傲瞽叟愛後妻子常欲殺舜舜避
  - page: 12
    col: 14
    role: j
    text: 逃及有小過則受罪順事父及後母與弟日以篤謹
  - page: 12
    col: 15
    role: j
    text: 匪有懈舜冀州之人也舜耕歷山漁雷澤陶河濱作
  - page: 12
    col: 16
    role: j
    text: 什器於壽丘就時於負夏舜父瞽叟頑母嚚弟象傲
  - page: 13
    col: 1
    role: j
    text: 皆欲殺舜舜順適不失子道兄弟孝慈欲殺不可得
  - page: 13
    col: 2
    role: j
    text: 即求嘗在側舜年二十以孝聞三十而帝堯問可用
  - page: 13
    col: 3
    role: j
    text: 者四嶽咸薦虞舜曰可於是堯乃以二女妻舜以觀
  - page: 13
    col: 4
    role: j
    text: 其內使九男與處以觀其外舜居媯汭內行彌謹堯
  - page: 13
    col: 5
    role: j
    text: 二女不敢以貴驕事舜親戚甚有婦道堯九男皆益
  - page: 13
    col: 6
    role: j
    text: 篤舜耕歷山歷山之人皆讓畔漁雷澤雷澤上人皆
  - page: 13
    col: 7
    role: j
    text: 讓居陶河濱河濱器皆不苦窳一年而所居成聚二
  - page: 13
    col: 8
    role: j
    text: 年成邑三年成都堯乃賜舜絺衣與琴為築倉廩予
  - page: 13
    col: 9
    role: j
    text: 牛羊瞽叟尚復欲殺之使舜上塗廩瞽叟從下縱火
  - page: 13
    col: 10
    role: j
    text: 焚廩舜乃以兩笠自扞而下去得不死後瞽叟又使
  - page: 13
    col: 11
    role: j
    text: 舜穿井舜穿井為匿空旁出舜既入深瞽叟與象共
  - page: 13
    col: 12
    role: j
    text: 下土實井舜從匿空出去瞽叟象喜以舜為已死象
  - page: 13
    col: 13
    role: j
    text: 曰本謀者象象與其父母分於是曰舜妻堯二女與
  - page: 13
    col: 14
    role: j
    text: 琴象取之牛羊倉廩予父母象乃止舜宫居鼓其琴
  - page: 13
    col: 15
    role: j
    text: 舜徃見之象鄂不懌曰我思舜正鬱陶舜曰然爾其
  - page: 13
    col: 16
    role: j
    text: 庶矣舜復事瞽叟愛弟彌謹於是堯乃試舜五典百
  - page: 14
    col: 1
    role: j
    text: 官皆治昔高陽氏有才子八人世得其利謂之八愷
  - page: 14
    col: 2
    role: j
    text: 高辛氏有才子八人世謂之八元此十六族者世濟
  - page: 14
    col: 3
    role: j
    text: 其美不隕其名至於堯堯未能舉舜舉八愷使主后
  - page: 14
    col: 4
    role: j
    text: 土以揆百事莫不時序舉八元使布五教于四方父
  - page: 14
    col: 5
    role: j
    text: 義母慈兄友弟恭子孝內平外成昔帝鴻氏有不才
  - page: 14
    col: 6
    role: j
    text: 子掩義隱賊好行凶慝天下謂之渾沌少皞氏有不
  - page: 14
    col: 7
    role: j
    text: 才子毀信惡忠崇飾惡言天下謂之窮奇顓頊氏有
  - page: 14
    col: 8
    role: j
    text: 不才子不可敎訓不知話言天下謂之檮杌此三族
  - page: 14
    col: 9
    role: j
    text: 世憂之至于堯堯未能去縉雲氏有不才子貪於飲
  - page: 14
    col: 10
    role: j
    text: 食冒于貨賄天下謂之饕餮天下惡之比之三凶舜
  - page: 14
    col: 11
    role: j
    text: 賓於四門乃流四凶族遷于四裔以御螭魅於是四
  - page: 14
    col: 12
    role: j
    text: 門辟言毋凶人也舜入于大麓烈風雷雨不迷堯乃
  - page: 14
    col: 13
    role: j
    text: 知舜之足授天下堯老使舜攝行天子政廵狩舜得
  - page: 14
    col: 14
    role: j
    text: 舉用事二十年而堯使攝政攝政八年而堯崩三年
  - page: 14
    col: 15
    role: j
    text: 喪畢讓丹朱天下歸舜而禹臯陶契后稷伯夷夔龍
  - page: 14
    col: 16
    role: j
    text: 倕益彭祖自堯時而皆舉用未有分職於是舜乃至
  - page: 15
    col: 1
    role: j
    text: 於文祖謀于四嶽辟四門明通四方耳目命十二牧
  - page: 15
    col: 2
    role: j
    text: 論帝德行厚德遠佞人則蠻夷率服舜謂四嶽曰有
  - page: 15
    col: 3
    role: j
    text: 能奮庸美堯之事者使居官相事皆曰伯禹為司空
  - page: 15
    col: 4
    role: j
    text: 可美帝功舜曰然嗟禹汝平水土維是勉哉禹拜稽
  - page: 15
    col: 5
    role: j
    text: 首讓於稷契與皋陶舜曰然往矣舜曰弃黎民始饑
  - page: 15
    col: 6
    role: j
    text: 汝后稷播時百穀舜曰契百姓不親五品不馴汝為
  - page: 15
    col: 7
    role: j
    text: 司徒而敬敷五教在寬舜曰皋陶蠻夷猾夏寇賊姦
  - page: 15
    col: 8
    role: j
    text: 軌汝作士五刑有服五服三就五流有度五度三居
  - page: 15
    col: 9
    role: j
    text: 維明能信舜曰誰能馴予工皆曰垂可於是以垂為
  - page: 15
    col: 10
    role: j
    text: 共工舜曰誰能馴予上下草木鳥獸皆曰益可於是
  - page: 15
    col: 11
    role: j
    text: 以益為朕虞益拜稽首讓于諸臣朱虎熊羆舜曰往
  - page: 15
    col: 12
    role: j
    text: 矣汝諧遂以朱虎熊羆為佐舜曰嗟四嶽有能典朕
  - page: 15
    col: 13
    role: j
    text: 三禮皆曰伯夷可舜曰嗟伯夷以汝為秩宗夙夜維
  - page: 15
    col: 14
    role: j
    text: 敬直哉維靜潔伯夷讓夔龍舜曰然以夔為典樂教
  - page: 15
    col: 15
    role: j
    text: 穉子直而溫寬而栗剛而無虐簡而無傲詩言意歌
  - page: 15
    col: 16
    role: j
    text: 長言聲依永律和聲八音能諧毋相奪倫神人以和
  - page: 16
    col: 1
    role: j
    text: 夔曰於予擊石拊石百獸率舞舜曰龍朕畏忌讒說
  - page: 16
    col: 2
    role: j
    text: 殄偽振驚朕眾命汝為納言夙夜出入朕命惟信舜
  - page: 16
    col: 3
    role: j
    text: 曰嗟女二十有二人敬哉惟時相天事三歲一考功
  - page: 16
    col: 4
    role: j
    text: 三考絀陟遠近眾功咸興分北三苗此二十二人咸
  - page: 16
    col: 5
    role: j
    text: 成厥功皐陶為大理平民各伏得其實伯夷主禮上
  - page: 16
    col: 6
    role: j
    text: 下咸讓垂主工師百工致功益主虞山澤辟弃主稷
  - page: 16
    col: 7
    role: j
    text: 百穀時茂契主司徒百姓親和龍主賓客遠人至十
  - page: 16
    col: 8
    role: j
    text: 二牧行而九州莫敢辟違唯禹之功為大披九山通
  - page: 16
    col: 9
    role: j
    text: 九澤決九河定九州各以其職来貢不失厥宜方五
  - page: 16
    col: 10
    role: j
    text: 千里至于荒服南撫交阯北發西戎析枝渠廋氐羌
  - page: 16
    col: 11
    role: j
    text: 北山戎發息慎東長鳥夷四海之内咸戴帝舜之功
  - page: 16
    col: 12
    role: j
    text: 扵是禹乃興九招之樂致異物鳳皇来翔天下明德
  - page: 16
    col: 13
    role: j
    text: 皆自虞帝始舜年二十以孝聞年三十堯舉之年五
  - page: 16
    col: 14
    role: j
    text: 十攝行天子事年五十八堯崩年六十一代堯踐帝
  - page: 16
    col: 15
    role: j
    text: 位踐帝位三十九年南廵狩崩於蒼梧之野葬扵江
  - page: 16
    col: 16
    role: j
    text: 南九疑是為零陵舜之踐帝位載天子旗徃朝父瞽
  - page: 17
    col: 1
    role: j
    text: 叟夔夔唯謹如子道封弟象為諸侯舜子商均亦不
  - page: 17
    col: 2
    role: j
    text: 肖舜乃豫薦禹於天十七年而崩三年喪畢禹亦乃
  - page: 17
    col: 3
    role: j
    text: 讓舜子如舜讓堯子諸侯歸之然後禹踐天子位堯
  - page: 17
    col: 4
    role: j
    text: 子丹朱舜子商均皆有疆土以奉先祀服其服禮樂
  - page: 17
    col: 5
    role: j
    text: 如之以客見天子天子弗臣示不敢專也自黃帝至
  - page: 17
    col: 6
    role: j
    text: 舜禹皆同姓而異其國號以章明德故黃帝為有熊
  - page: 17
    col: 7
    role: j
    text: 帝顓頊為高陽帝嚳為高辛帝堯為陶唐帝舜為有
  - page: 17
    col: 8
    role: j
    text: 虞帝禹為夏后而别氏姓姒氏契為商姓子氏弃為
  - page: 17
    col: 9
    role: j
    text: 周姓姬氏
  - page: 17
    col: 10
    role: j
    text: 太史公曰學者多稱五帝尚矣然尚書獨載堯以来
  - page: 17
    col: 11
    role: j
    text: 而百家言黃帝其文不雅馴薦紳先生難言之孔子
  - page: 17
    col: 12
    role: j
    text: 所傳宰予問五帝德及帝繫姓儒者或不傳余嘗西
  - page: 17
    col: 13
    role: j
    text: 至空峒北過涿鹿東漸於海南浮江淮矣至長老皆
  - page: 17
    col: 14
    role: j
    text: 各往往稱黃帝堯舜之處風教固殊焉總之不離古
  - page: 17
    col: 15
    role: j
    text: 文者近是予觀春秋國語其發明五帝德帝繫姓章
  - page: 17
    col: 16
    role: j
    text: 矣顧弟弗深考其所表見皆不虛書缺有間矣其軼
