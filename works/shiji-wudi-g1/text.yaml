sections:
  - id: 五帝本紀
    name: 五帝本紀
    blocks:
      - type: j
        text: 黃帝者少典之子姓公孫名曰軒轅生而神靈弱而能言幼而徇齊長而敦敏成而聰明軒轅之時神農氏世衰諸侯相侵伐暴虐百姓而神農氏弗能征於是軒轅乃習用干戈㠯征不享諸侯咸来賔從而蚩尤最為暴莫能伐炎帝欲侵陵諸侯諸侯咸歸軒轅軒轅乃修徳振兵治五氣藝五種撫萬民度四方教熊羆貔貅貙虎以與炎帝戰於阪泉之野三戰然後
      - type: j
        text: 焉獲寶鼎迎日推筴舉風后力牧常先大鴻以治民順天地之紀幽明之占死生之說存亡之難時播百穀草木淳化鳥獸蟲蛾旁羅日月星辰水波土石金玉勞勤心力耳目節用水火材物有土德之瑞故號黃帝黃帝二十五子其得姓者十四人黃帝居軒轅之丘而娶於西陵之女是為嫘祖嫘祖為黃帝正妃生二子其後皆有天下其一曰玄囂是為青陽青陽降居江水其二曰昌意降居若水昌意娶蜀山氏女
      - type: j
        text: 帝嚳高辛者黄帝之曾孫也高辛父曰蟜極蟜極父曰玄囂玄囂父曰黄帝自玄囂與蟜極皆不得在位至高辛即帝位高辛於顓頊為族子高辛生而神靈自言其名普施利物不於其身聰以知遠明以察微順天之義知民之急仁而威惠而信修身而天下服取地之財而節用之撫教萬民而利誨之曆日月而迎送之明鬼神而敬事之其色郁郁其德嶷嶷其動也時其服也士帝嚳溉執中而徧天下日月所照風
      - type: j
        text: 星鳥以殷中春其民析鳥獸字微申命羲叔居南交便程南譌敬致日永星火以正中夏其民因鳥獸希革申命和仲居西土曰昧谷敬道日入便程西成夜中星虚以正中秋其民夷易鳥獸毛毨申命和叔居北方曰幽都便在伏物日短星昴以正中冬其民燠鳥獸氄毛歲三百六十六日以閏月正四時信飭百官衆功皆興堯曰誰可順此事放齊曰嗣子丹朱開明堯曰吁頑凶不用堯又曰誰可者讙兠曰共工旁
      - type: j
        text: 烝治不至姦堯曰吾其試哉於是堯妻之二女觀其德於二女舜飭下二女於嬀汭如婦禮堯善之乃使舜慎和五典五典能從乃徧入百官百官時序賔於四門四門穆穆諸侯遠方賔客皆敬堯使舜入山林川澤暴風雷雨舜行不迷堯以為聖召舜曰女謀事至而言可績三年矣女登帝位舜讓於德不懌正月上日舜受終於文祖文祖者堯大祖也於是帝堯老命舜攝行天子之政以觀天命舜乃在璿璣玉衡以
      - type: j
        text: 贖刑眚災過赦怙終賊刑欽哉欽哉惟刑之靜哉讙兜進言共工堯曰不可而試之工師共工果淫辟四嶽舉鯀治鴻水堯以為不可嶽彊請試之試之而無功故百姓不便三苗在江淮荆州數為亂於是舜歸而言於帝請流共工于幽陵以變北狄放驩兜於崇山以變南蠻遷三苗於三危以變西戎殛鯀於羽山以變東夷四罪而天下咸服堯立七十年得舜二十年而老令舜攝行天子之政薦之於天堯辟位凡二
      - type: j
        text: 虞舜者名曰重華重華父曰瞽叟瞽叟父曰橋牛橋牛父曰句望句望父曰敬康敬康父曰窮蟬窮蟬父曰帝顓頊顓頊父曰昌意以至舜七世矣自從窮蟬以至帝舜皆微為庶人舜父瞽叟盲而舜母死瞽叟更娶妻而生象象傲瞽叟愛後妻子常欲殺舜舜避逃及有小過則受罪順事父及後母與弟日以篤謹匪有懈舜冀州之人也舜耕歷山漁雷澤陶河濱作什器於壽丘就時於負夏舜父瞽叟頑母嚚弟象傲
      - type: j
        text: 牛羊瞽叟尚復欲殺之使舜上塗廩瞽叟從下縱火焚廩舜乃以兩笠自扞而下去得不死後瞽叟又使舜穿井舜穿井為匿空旁出舜既入深瞽叟與象共下土實井舜從匿空出去瞽叟象喜以舜為已死象曰本謀者象象與其父母分於是曰舜妻堯二女與琴象取之牛羊倉廩予父母象乃止舜宫居鼓其琴舜往見之象鄂不懌曰我思舜正鬱陶舜曰然爾其庶矣舜復事瞽叟愛弟彌謹於是堯乃試舜五典百
      - type: j
        text: 世憂之至于堯堯未能去縉雲氏有不才子貪於飲食冒于貨賄天下謂之饕餮天下惡之比之三凶舜賔於四門乃流四凶族遷于四裔以御螭魅於是四門辟言毋凶人也舜入于大麓烈風雷雨不迷堯乃知舜之足授天下堯老使舜攝行天子政廵狩舜得舉用事二十年而堯使攝政攝政八年而堯崩三年喪畢讓丹朱天下歸舜而禹臯陶契后稷伯夷夔龍倕益彭祖自堯時而皆舉用未有分職於是舜乃至
      - type: j
        text: 維明能信舜曰誰能馴予工皆曰垂可於是以垂為共工舜曰誰能馴予上下草木鳥獸皆曰益可於是以益為朕虞益拜稽首讓于諸臣朱虎熊羆舜曰往矣汝諧遂以朱虎熊羆為佐舜曰嗟四嶽有能典朕三禮皆曰伯夷可舜曰嗟伯夷以汝為秩宗夙夜維敬直哉維靜潔伯夷讓夔龍舜曰然以夔為典樂教穉子直而溫寬而栗剛而無虐簡而無傲詩言意歌長言聲依永律和聲八音能諧毋相奪倫神人以和
      - type: j
        text: 九澤決九河定九州各以其職来貢不失厥宜方五千里至于荒服南撫交阯北發西戎析枝渠廋氐羌北山戎發息慎東長鳥夷四海之内咸戴帝舜之功於是禹乃興九招之樂致異物鳳皇来翔天下明德皆自虞帝始舜年二十以孝聞年三十堯舉之年五十攝行天子事年五十八堯崩年六十一代堯踐帝位踐帝位三十九年南廵狩崩於蒼梧之野葬於江南九疑是為零陵舜之踐帝位載天子旗徃朝父瞽
  - id: 周姓姬氏
    name: 周姓姬氏
    blocks:
      - type: j
        text: 太史公曰學者多稱五帝尚矣然尚書獨載堯以來而百家言黃帝其文不雅馴薦紳先生難言之孔子所傳宰予問五帝德及帝繫姓儒者或不傳余嘗西至空峒北過涿鹿東漸於海南浮江淮矣至長老皆各往往稱黃帝堯舜之處風教固殊焉總之不離古文者近是予觀春秋國語其發明五帝德帝繫姓章矣顧弟弗深考其所表見皆不虛書缺有間矣其軼
