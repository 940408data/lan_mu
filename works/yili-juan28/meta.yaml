aboutHtml: |-
  <h2>關於此卷</h2>
  <p>《儀禮注疏》為唐賈公彥等奉敕撰，以漢鄭玄注為本，為十三經注疏之一。儀禮十七篇，冠昏喪祭之制備焉，此卷以宋刻本版式數字重刻，半葉八行、行十六字、注文雙行二十五字。</p>
  <p>卷二十八收喪服第十一，經注疏全帙。</p>
