# 論語注疏卷6（邢昺疏）：j 為經文＋魏何晏集解，z 為疏文。
sections:
  - id: juan6
    name: 正文
    blocks:
      - { type: z, text: "正义曰：此篇亦论贤人、君子及仁、知、中庸之德，大抵与前相类，故" }
      - { type: j, text: "以次之。" }
      - { type: j, text: "子曰：“雍也，可使南面。”（包曰：“可使南面者，言任诸侯治。”）" }
      - { type: z, text: "“子曰：雍也，可使南面。”正义曰：此章称弟子冉雍之德行。南面，" }
      - { type: j, text: "谓诸侯也。言冉雍有德行，堪任为诸侯治理一国者也。" }
      - { type: j, text: "仲弓问子桑伯子。（王曰：“伯子，书传无见焉。”）子曰：“可也简。”" }
      - { type: j, text: "（孔曰：“以其能简，故曰可也。”）仲弓曰：“居敬而行简，以临其民，不亦" }
      - { type: j, text: "可乎？（孔曰：“居身敬肃，临下宽略，则可。”）居简而行简，无乃大简乎？”" }
      - { type: j, text: "（包曰：“伯子之简太简。”）子曰：“雍之言然。”" }
      - { type: z, text: "“仲弓”至“言然”。○正义曰：此章明行简之法。“仲弓问子桑伯子”" }
      - { type: j, text: "者，仲弓，冉雍字也。问子桑伯子其人德行何如。“子曰：可也简”者，孔子为" }
      - { type: j, text: "仲弓述子桑伯子之德行也。简，略也。言其人可也，以其行能宽略故也。“仲弓" }
      - { type: j, text: "曰：居敬而行简，以临其民，不亦可乎”者，仲弓因辨简之可否，言若居身敬肃，" }
      - { type: j, text: "而行宽略以临其下民，不亦可乎？言其可也。“居简而行简，无乃太简乎”者，" }
      - { type: j, text: "言居身宽略，而行又宽略，乃大简也。则子桑伯子之简是太简也。“子曰：雍之" }
      - { type: j, text: "言然”者，然，犹是也。夫子许仲弓之言，是故曰然。○注“王曰：伯子，书传" }
      - { type: j, text: "无见焉。○正义曰：书传无见，不知何人也。子桑伯子当是一人，故此注及下包" }
      - { type: j, text: "氏皆唯言伯子而已。郑以《左传》秦有公孙枝字子桑，则以此为秦大夫，恐非。" }
      - { type: j, text: "哀公问：“弟子孰为好学？”孔子对曰：“有颜回者好学，不迁怒，不贰过。" }
      - { type: j, text: "不幸短命死矣。今也则亡，未闻好学者也。”（凡人任情，喜怒违理。颜回任道，" }
      - { type: j, text: "怒不过分。迁者，移也。怒当其理，不移易也。不贰过者，有不善，未尝复行。）" }
      - { type: z, text: "“哀公”至“者也”。○正义曰：此章称颜回之德。“哀公问：弟子孰" }
      - { type: j, text: "为好学”者，鲁君哀公问於孔子曰：“弟子之中，谁为乐於好学者？”“孔子对" }
      - { type: j, text: "曰：有颜回者好学，不迁怒，不贰过。不幸短命死矣。今也则亡，未闻好学者也”" }
      - { type: j, text: "者，孔子对哀公曰：“有弟子颜回者，其人好学。”迁，移也。凡人任情，喜怒" }
      - { type: j, text: "违理。颜回任道，怒不过分而当其理，不移易，不迁怒也。人皆有过惮改。颜回" }
      - { type: j, text: "有不善，未尝不知；知之，未尝复行，不贰过也。凡事应失而得曰幸，应得而失" }
      - { type: j, text: "曰不幸，恶人横夭则惟其常。颜回以德行著名，应得寿考，而反二十九发尽白，" }
      - { type: j, text: "三十二而卒，故曰不幸短命死矣。亡，无也。言命则无好学者矣，未闻更有好学" }
      - { type: j, text: "者也。○注“凡人”至“复行”。○正义曰：云“凡人任情，喜怒违理”者，言" }
      - { type: j, text: "凡常之人，信任邪情，恣其喜怒，违於分理也。云“颜回任道，怒不过分”者，" }
      - { type: j, text: "言颜回好学既深，信用至道，故怒不过其分理也。云“有不善，未尝复行”者，" }
      - { type: j, text: "《周易·下系辞》文。彼云：“子曰：颜氏之子，其殆庶几乎！有不善未尝不知，" }
      - { type: j, text: "知之未尝复行也。”韩康伯注云：“在理则昧，造形而悟，颜子之分也。失之於" }
      - { type: j, text: "几，故有不善；得之於贰，不远而复，故知之未尝复行也。”引之以证不贰过也。" }
      - { type: j, text: "此称其好学，而言不迁怒、贰过者，以不迁怒、贰过，由於学问既笃，任道而行，" }
      - { type: j, text: "故举以言焉，以明好学之深也。一曰：以哀公迁怒、贰过，而孔子因以讽谏。" }
      - { type: j, text: "子华使於齐，冉子为其母请粟。子曰：“与之釜。”（马曰：“子华，弟子" }
      - { type: j, text: "公西华赤之字。六斗四升曰釜。”）请益。曰：“与之庾。”（包曰：“十六斗" }
      - { type: j, text: "曰庾。”）冉子与之粟五秉。（马曰：“十六斛曰秉，五秉合为八十斛。”）子" }
      - { type: j, text: "曰：“赤之齐也，乘肥马，衣轻裘。吾闻之也：君子周急，不继富。”（郑曰：" }
      - { type: j, text: "“非冉有与之太多。”）" }
      - { type: z, text: "“子华”至“继富”。○正义曰：此章论君子当赈穷周急。“子华使於" }
      - { type: j, text: "齐”者，弟子公西赤字子华，时仕鲁，为鲁使於齐也。“冉子为其母请粟”者，" }
      - { type: j, text: "冉子，即冉有也，为其子华之母请粟於夫子，言其子出使而家贫也。“子曰：与" }
      - { type: j, text: "之釜”者，夫子令与粟六斗四升也。“请益”者，冉有嫌其粟少，故更请益之。" }
      - { type: j, text: "“曰：与之庾”者，夫子令益与十六斗也。“冉子与之粟五秉”者，冉有终以为" }
      - { type: j, text: "少，故自与粟八十斛也。“子曰：赤之齐也，乘肥马，衣轻裘。吾闻之也：君" }
      - { type: j, text: "子周急，不继富”者，此孔子非冉有与之太多也。赤，子华名。，往也。言子" }
      - { type: j, text: "华使往齐国，乘驾肥马，衣著轻裘，则是富也，富则母不阙粟。吾尝闻之，君子" }
      - { type: j, text: "当周救人之穷急，不继接於富有。今子华家富，而多与之粟，则是继富，故非之" }
      - { type: j, text: "也。○注“马曰”至“曰釜”。○正义曰：《史记·弟子传》云：“公西赤字子" }
      - { type: j, text: "华。”郑玄曰：“鲁人，少孔子四十二岁。”云“六斗四升曰釜”者，昭三年" }
      - { type: j, text: "《左传》：“晏子曰：齐旧四量，豆、区、釜、锺。四升为豆，各自其四，以登" }
      - { type: j, text: "干釜。”杜注云：“四豆为区，区斗六升。四区为釜，釜六斗四升。”是也。○" }
      - { type: j, text: "注“包曰：十六斗曰庾”，“马曰：十六斛曰秉”。○正义曰：案《聘礼记》云：" }
      - { type: j, text: "“十斗曰斛。十六斗曰{数}。十{数}曰秉。”郑注云：“秉十六斛，今江淮" }
      - { type: j, text: "之间量名有为{数}者，今文{数}为逾。”是庾、逾、{数}其数同，故知然" }
      - { type: j, text: "也。" }
      - { type: j, text: "原思为之宰，（包曰：“弟子原宪。思，字也。孔子为鲁司寇，以原宪为家" }
      - { type: j, text: "邑宰。”）与之粟九百，辞。（孔曰：“九百，九百斗。辞，辞让不受。“）子" }
      - { type: j, text: "曰：“毋！（孔曰：“禄法所得，当受无让。”）以与尔邻里乡党乎！（郑曰：" }
      - { type: j, text: "“五家为邻，五邻为里，万二千五百家为乡，五百家为党。”）" }
      - { type: z, text: "“原思”至“党乎”。○正义曰：此章明为受禄之法。原思，弟子原宪" }
      - { type: j, text: "也。孔子为鲁司寇，以原宪为家邑宰也。“与之粟九百，辞”者，孔子与之粟九" }
      - { type: j, text: "百斗，原思辞让不受。“子曰：毋”者，毋，禁辞也。孔子禁止其让，言禄法所" }
      - { type: j, text: "得，当受无让也。“以与尔邻里乡党乎”者，言於已有馀，可分与尔邻里乡党之" }
      - { type: j, text: "人，亦不可辞也。○注“包曰”至“邑宰”。○正义曰：《史记·弟子传》曰：" }
      - { type: j, text: "“原宪字子思。”郑玄曰：“鲁人。”云“孔子为鲁司寇，以原宪为家邑宰”者，" }
      - { type: j, text: "《世家》云：“孔子由中都宰为司空，由司空为司寇。”鲁司寇，大夫也，必有" }
      - { type: j, text: "采邑。大夫称家，故以原宪为家采邑之宰也。○注“郑曰”至“为党”。正义曰：" }
      - { type: j, text: "云：“五家为邻，五邻为里”者，《地官·遂人职》文。案《大司徒职》云：" }
      - { type: j, text: "“五家为比，五比为闾，四闾为族，五族为党，五党为州，五州为乡。”故知万" }
      - { type: j, text: "二千五百家为乡，五百家为党也。" }
      - { type: j, text: "子谓仲弓，曰：“犁牛之子も且角，虽欲勿用，山川其舍诸？”（犁，杂文。" }
      - { type: j, text: "も，赤也。角者，角周正，中牺牲。虽欲以其所生犁而不用，山川宁肯舍之乎？" }
      - { type: j, text: "言父虽不善，不害於子之美。）" }
      - { type: z, text: "“子谓”至“舍诸”。○正义曰：此章复谓冉雍之德也。“子谓仲弓，" }
      - { type: j, text: "曰：犁牛之子も且角，虽欲勿用，山川其舍诸”者，杂文曰犁。も，纯赤色也。" }
      - { type: j, text: "角者，角周正也。舍，弃也。诸，之也。仲弓父，贱人，而行不善，故孔子称谓" }
      - { type: j, text: "仲弓曰：“譬若杂文之犁牛，生纯赤且角周正之子，中祭祀之牺牲，虽欲以其所" }
      - { type: j, text: "生犁而不用，山川宁肯舍弃之乎？”言仲弓父虽不善，不害於子之美也。" }
      - { type: j, text: "子曰：“回也，其心三月不违仁，其馀则日月至焉而已矣。”（馀人暂有至" }
      - { type: j, text: "仁时，唯回移时而不变。）" }
      - { type: z, text: "“子曰：回也。其心三月不违仁，其馀则日月至焉而已矣”。○正义曰：" }
      - { type: j, text: "此章称颜回之仁。三月为一时，天气一变。人心行善，亦多随时移变。唯回也，" }
      - { type: j, text: "其心虽经一时复一时，而不变移违去仁道也。其馀则有至仁时，或一日或一月" }
      - { type: j, text: "而已矣。" }
      - { type: j, text: "季康子问：“仲由可使从政也与？”子曰：“由也果，（包曰：“果谓果敢" }
      - { type: j, text: "决断。”）於从政乎何有？曰：“赐也可使从政也与？”曰：“赐也达，（孔曰：" }
      - { type: j, text: "“达谓通於物理。”）於从政乎何有？曰：“求也可使从政也与？”曰：“求也" }
      - { type: j, text: "艺，（孔曰：“艺谓多才艺。”）於从政乎何有？”" }
      - { type: z, text: "“季康”至“何有”。○正义曰：此章明子路、子贡、冉有之才也。" }
      - { type: j, text: "“季康子问：仲由可使从政也欤者，康子，鲁卿季孙肥也，问於孔子曰：“仲由" }
      - { type: j, text: "之才，可使从一官而为政治也欤？”“子曰：由也果，於从政乎何有”者，果，" }
      - { type: j, text: "谓果敢决断。何有，言不难也。孔子言，仲由之才，果敢决断，其於从政，何有" }
      - { type: j, text: "难乎？言仲由可使从政也。“曰：赐也，可使从政也欤”者，季康子又问子贡也。" }
      - { type: j, text: "“曰：赐也达，於从政乎何有”者，达，谓通於物理。孔子答言，子贡之才，通" }
      - { type: j, text: "达物理，亦言可从政也。“曰：求也可使从政也欤”者，康子又问冉有也。“曰：" }
      - { type: j, text: "求也艺，於从政乎何有”者，艺，谓多才艺。孔子答言，冉求多才艺，亦可从政" }
      - { type: j, text: "也。" }
      - { type: j, text: "季氏使闵子骞为费宰。（孔曰：“费，季氏邑。季氏不臣，而其邑宰数畔。" }
      - { type: j, text: "闻子骞贤，故欲用之。”）闵子骞曰：“善为我辞焉。（孔曰：“不欲为季氏宰，" }
      - { type: j, text: "使者善为我辞焉，说令不复召我。”）如有复我者，（孔曰：“复我者，重来" }
      - { type: j, text: "召我。”）则吾必在汶上矣。”（孔曰：“去之汶水上，欲北如齐。”）" }
      - { type: z, text: "“季氏”至“上矣”。○正义曰：此章明闵损之贤也。“季氏使闵子骞" }
      - { type: j, text: "为费宰”者，费，季氏邑。季氏不臣，而其邑宰数畔。闻子骞贤，故欲使之也。" }
      - { type: j, text: "“闵子骞曰：善为我辞焉”者，子骞不欲为季氏宰，故语使者曰：善为我作辞说，" }
      - { type: j, text: "令不复召我也。“如有复我者，则吾必在汶上矣”者，复，重也。言如有重来召" }
      - { type: j, text: "我者，则吾必去之在汶水上，欲北如齐也。○注“孔曰”至“用之”。○正义曰：" }
      - { type: j, text: "云“费，季氏邑”者，《左传》文也。云“季氏不臣，而其邑宰数畔”者，僭礼" }
      - { type: j, text: "乐，逐昭公，是不臣也。昭十二年，南蒯以费畔，又公山弗扰以费畔，是数畔也。" }
      - { type: j, text: "○注“去之汶水上，欲北如齐”。○正义曰：《地理志》云：汶水出泰山莱芜西" }
      - { type: j, text: "南入济。在齐南鲁北，故曰欲北如齐。" }
      - { type: j, text: "伯牛有疾，（马曰：“伯牛，弟子冉耕。”）子问之，自牖执其手，（包曰：" }
      - { type: j, text: "“牛有恶疾，不欲见人，故孔子从牖执其手也。”）曰：“亡之，（孔曰：“亡，" }
      - { type: j, text: "丧也。疾甚，故持其手曰丧之。”）命矣夫！斯人也而有斯疾也！斯人也而有斯" }
      - { type: j, text: "疾也！（包曰：“再言之者，痛惜之甚。”）" }
      - { type: z, text: "“伯牛”至“疾也”。○正义曰：此章孔子痛惜弟子冉耕有德行而遇恶" }
      - { type: j, text: "疾也。伯牛，冉耕字也。有疾，有恶疾也。“子问之，自牖执其手”者，自，从" }
      - { type: j, text: "也。伯牛恶疾，不欲见人，故孔子问之，从牖执其手也。“曰：亡之”者，亡，" }
      - { type: j, text: "丧也。疾甚，故持其手曰：“丧之。”命矣夫！斯人也而有斯疾也！斯人也而有" }
      - { type: j, text: "斯疾也”者，行善遇凶，非人所召，故归之於命，言天命矣夫！斯，此也。此善" }
      - { type: j, text: "人也，而有此恶疾也。是孔子痛惜之也。再言之者，痛惜之甚。○注“马曰：伯" }
      - { type: j, text: "牛，弟子冉耕。”○正义曰：《史记·弟子传》曰：“冉耕字伯牛。”郑玄曰：" }
      - { type: j, text: "“鲁人。”○注“包曰：伯牛有恶疾”。○正义曰：恶疾，疾之恶者也。《淮南" }
      - { type: j, text: "子》云：“伯牛癞。”" }
      - { type: j, text: "子曰：“贤哉，回也！一箪食，一瓢饮，（孔曰：“箪，笥也。”）在陋巷，" }
      - { type: j, text: "人不堪甚忧，回也不改其乐。贤哉，回也！”（孔曰：“颜渊乐道，虽箪食在陋" }
      - { type: j, text: "巷，不改其所乐。”）" }
      - { type: z, text: "“子曰”至“回也”。○正义曰：此章叹颜回之贤，故曰：“贤哉，回" }
      - { type: j, text: "也！”云“一箪食，一瓢饮”者，箪，竹器。食，饭也。瓢，瓠也。言回家贫，" }
      - { type: j, text: "唯有一箪饭，一瓠瓢饮也。“在陋巷，人不堪其忧，回也不改其乐”者，言回居" }
      - { type: j, text: "处又在隘陋之巷，他人见之不任其忧，唯回也不改其乐道之志，不以贫为忧苦也。" }
      - { type: j, text: "叹美之甚，故又曰：“贤哉，回也！”○注“孔曰：箪，笥也”。○正义曰：案" }
      - { type: j, text: "郑注《曲礼》云：“圆曰箪，方曰笥。”然则箪与笥方圆异，而此云“箪，笥”" }
      - { type: j, text: "者，以其俱用竹为之，举类以晓人也。" }
      - { type: j, text: "冉求曰：“非不说子之道，力不足也。”子曰：“力不足者，中道而废。今" }
      - { type: j, text: "女画。”（孔曰：“画，止也。力不足者，当中道而废。今女自止耳，非力极。”）" }
      - { type: z, text: "“冉求曰”至“女画”。○正义曰：此章勉人学也。“冉求曰：非不说" }
      - { type: j, text: "子之道，力不足也”者，弟子冉求言己非不说乐子之道而勤学之，但以力不足故" }
      - { type: j, text: "也。“子曰：力不足者，中道而废。今女画”者，画，止也。此孔子责冉求之不" }
      - { type: j, text: "说学也。言力不足者，当中道而废。今女自止耳，非力极也。" }
      - { type: j, text: "子谓子夏曰：“女为君子儒，无为小人儒。”（孔曰：“君子为儒，将以明" }
      - { type: j, text: "道。小人为儒，则矜其名。”）" }
      - { type: z, text: "“子谓子夏曰：女为君子儒，无为小人儒”。○正义曰：此章戒子夏为" }
      - { type: j, text: "君子也。言人博学先王之道，以润其身者，皆谓之儒，但君子则将以明道，小人" }
      - { type: j, text: "则矜其才名。言女当明道，无得矜名也。" }
      - { type: j, text: "子游为武城宰。（包曰：“武城，鲁下邑。”）子曰：“女得人焉耳乎？”" }
      - { type: j, text: "（孔曰：“焉、耳、乎，皆辞。”）曰：“有澹台灭明者，行不由径，非公事，" }
      - { type: j, text: "未尝至於偃之室也。”（包曰：“澹台，姓。灭明，名。字子羽。言其公且方。”）" }
      - { type: z, text: "“子游”至“室也”。○正义曰：此章明子羽公方也。“子游为武城宰”" }
      - { type: j, text: "者，武城，鲁下邑。子游时为之宰也。“子曰：女得人焉耳乎”者，孔子问子游" }
      - { type: j, text: "言：“女在武城，得其有德之人乎？”焉、耳、乎皆语助辞。“曰：有澹台灭明”" }
      - { type: j, text: "者，此子游对孔子言已所得之人也，姓澹台名灭明。“行不由径，非公事，未尝" }
      - { type: j, text: "至於偃之室也”者，此言其人之德也。行遵大道，不由小径，是方也。若非公事，" }
      - { type: j, text: "未尝至於偃之室，是公也。既公且方，故以为得人。○注“包曰”至“且方”。" }
      - { type: j, text: "○正义曰：《史记·弟子传》云：“澹台灭明，武城人，字子羽，少孔子三十九" }
      - { type: j, text: "岁。状貌甚恶。欲事孔子，孔子以为材薄。既已受业，退而行，名施乎诸侯。" }
      - { type: j, text: "孔子闻之曰：‘吾以貌取人，失之子羽。’”是亦弟子也。故注不言弟子者，从" }
      - { type: j, text: "可知也。云“言其公且方”者，公，无私也；方，正直也。" }
      - { type: j, text: "子曰：“孟之反不伐，（孔曰：“鲁大夫孟之侧，与齐战，军大败。不伐者，" }
      - { type: j, text: "不自伐其功。”）奔而殿，将入门，策其马，曰：‘非敢後也，马不进也。’”" }
      - { type: j, text: "（马曰：“殿，在军後。前曰启，後曰殿，孟之反贤而有勇，军大奔，独在後为" }
      - { type: j, text: "殿。人迎，功之。不欲独有其名，曰：‘我非敢在後拒敌，马不能前进。’”）" }
      - { type: z, text: "“子曰”至“进也”。○正义曰：此章言功以不伐为善也。“孟之反不" }
      - { type: j, text: "伐”者，夸功曰伐。孟之反，鲁大夫孟之侧也。有军功而不夸伐也。“奔而殿，" }
      - { type: j, text: "将入门，策其马曰：非敢後也，马不进也”者，此其不伐之事也。在军後曰殿。" }
      - { type: j, text: "策，捶也。鲁与齐战，鲁师败而奔，孟之反贤而有勇，独在後为殿。人迎，功之。" }
      - { type: j, text: "不欲独有其名，故将入国门，乃捶其马，欲先奔者入城也。且曰：“我非敢在後" }
      - { type: j, text: "为殿以拒敌，马不能前进故也。”○注“孔曰：鲁大夫孟之侧”。○正义曰：杜" }
      - { type: j, text: "预曰：“之侧，孟氏族，字反。”是也。○注“马曰”至“前进”。○正义曰：" }
      - { type: j, text: "云“殿，在军後。前曰启，後曰殿”者，案《司马法·谋帅篇》曰：“夫前驱启，" }
      - { type: j, text: "乘车大震，ヘ车属焉。”大震即大殿也，音相似。襄二十三年《左传》曰：“齐" }
      - { type: j, text: "侯伐卫。大殿，商子游御夏之御寇。”《诗》曰：“元戎十乘，以先启行。”是" }
      - { type: j, text: "殿在军後，前曰启也。案哀十一年《左传》说此事云：齐师伐我，及清。孟孺子" }
      - { type: j, text: "泄帅右师，冉求帅左师。师及齐师战于郊。右师奔，齐人从之。孟之侧後入以为" }
      - { type: j, text: "殿，抽矢策其马，曰：“马不进也。”文不同者，各据所闻而记之也。" }
      - { type: j, text: "子曰：“不有祝它之佞，而有宋朝之美，难乎免於今之世矣。”（孔曰：" }
      - { type: j, text: "“佞，口才也。祝它，卫大夫子鱼也，时世贵之。宋朝，宋之美人而善淫。言" }
      - { type: j, text: "当如祝它之佞，而反如宋朝之美，难乎免於今之世害也。”）" }
      - { type: z, text: "“子曰：不有祝它之佞，而有宋朝之美，难乎免於今之世矣。”○正" }
      - { type: j, text: "义曰：此章言世尚口才也。佞，口才也。祝它，卫大夫子鱼也。有口才，时世" }
      - { type: j, text: "贵之。宋朝，宋之美人，善淫，时世疾之。言人当如祝它之有口才，则见贵重，" }
      - { type: j, text: "若无祝它之佞，而反有宋朝之美，难乎免於今之世害也。○注“孔曰”至“善" }
      - { type: j, text: "也”。○正义曰：云“祝它，卫大夫子鱼也。时世贵之”者，《春秋》定四年：" }
      - { type: j, text: "“会于召陵，盟于皋鼬。”《左传》曰：“将会，卫子行敬子言於灵公曰：‘会" }
      - { type: j, text: "同难，啧有烦言，莫之治也。其使祝它从。’公曰：‘善。’乃使子鱼。”是" }
      - { type: j, text: "祝它即子鱼也。《传》又曰：“及皋鼬，将盟，将长蔡於卫。卫侯使祝它私" }
      - { type: j, text: "於苌弘。（文多不载）苌弘说，告刘子，与范献子谋之，乃长卫侯於盟。”是时" }
      - { type: j, text: "世贵之也。云“宋朝，宋之美人而善淫”者，案定十四年《左传》曰：“卫侯为" }
      - { type: j, text: "夫人南子召宋朝。”杜注云：“南子，宋女也。朝，宋公子，旧通于南子，在宋" }
      - { type: j, text: "呼之。”是朝为宋之美人而善淫也。" }
      - { type: j, text: "子曰：“谁能出不由户？何莫由斯道也？”（孔曰：“言人立身成功当由道，" }
      - { type: j, text: "譬犹出入要当从户。”）" }
      - { type: z, text: "“子曰：谁能出不由户？何莫由斯道也？”○正义曰：此章言道为立身" }
      - { type: j, text: "之要也，故曰：“谁人能出入不由门户？”以譬何人立身不由於此道也。言人立" }
      - { type: j, text: "身成功当由道，譬犹出入要当从户。" }
      - { type: j, text: "子曰：“质胜文则野，（包曰：“野，如野人言鄙略也。”）文胜质则史。" }
      - { type: j, text: "（包曰：“史者，文多而质少。”）文质彬彬，然後君子。”（包曰：“彬彬，" }
      - { type: j, text: "文质相半之貌。”）" }
      - { type: z, text: "“子曰”至“君子”。○正义曰：此章明君子也。“质胜文则野”者，" }
      - { type: j, text: "谓人若质多胜於文，则如野人言鄙略也。“文胜质则史”者，言文多胜於质，则" }
      - { type: j, text: "如史官也。“文质彬彬，然後君子”者，彬彬，文质相半之貌。言文华质朴相半，" }
      - { type: j, text: "彬彬然，然後可为君子也。" }
      - { type: j, text: "子曰：“人之生也直，（马曰：“言人所生於世而自终者，以其正直也。”）" }
      - { type: j, text: "罔之生也幸而免。”（包曰：“诬罔正直之道而亦生者，是幸而免。”）" }
      - { type: z, text: "“子曰：人之生也直，罔之生也幸而免”。○正义曰：此章明人以正直" }
      - { type: j, text: "为德，言人之所以生於世而自寿终不横夭者，以其正直故也。罔，诬罔也。言人" }
      - { type: j, text: "有诬罔正直之道而亦生者，是幸而获免也。" }
      - { type: j, text: "子曰：“知之者不如好之者，好之者不如乐之者。”（包曰：“学问，知之" }
      - { type: j, text: "者不如好之者笃，好之者不如乐之者深。”）" }
      - { type: z, text: "“子曰：知之者不如好之者，好之者不如乐之者”。○正义曰：此章言" }
      - { type: j, text: "人之学道用心深浅之异也。言学问，知之者不如好之者笃厚也，好之者又不如悦" }
      - { type: j, text: "乐之者深也。" }
      - { type: j, text: "子曰：“中人以上可以语上也，中人以下不可以语上也。”（王曰：“上，" }
      - { type: j, text: "谓上知之所知也。两举中人，以其可上可下。”）" }
      - { type: z, text: "“子曰：中人以上可以语上也，中人以下不可以语上也”。○正义曰：" }
      - { type: j, text: "此章言授学之法，当称其才识也。语，谓告语。上，谓上知之所知也。人之才识" }
      - { type: j, text: "凡有九等，谓上上、上中、上下、中上、中中、中下、下上、下中、下下也。上" }
      - { type: j, text: "上则圣人也，下下则愚人也，皆不可移也。其上中以下，下中以上，是可教之人" }
      - { type: j, text: "也。中人，谓第五中中之人也以上，谓上中、上下、中上之人也，以其才识优长，" }
      - { type: j, text: "故可以告语上知之所知也。中人以下，谓中下、下上、下中之人也，以其才识暗" }
      - { type: j, text: "劣，故不可以告语上知之所知也。此应云“中人以上可以语上，以下不可以语上”，" }
      - { type: j, text: "而繁文两举中人者，以其中人可上、可下故也。言此中人，若才性稍优，则可以" }
      - { type: j, text: "语上；才性稍劣，则不可以语上，是其可上、可下也。" }
      - { type: j, text: "樊迟问知。子曰：“务民之义，（王曰：“务所以化道民之义。”）敬鬼神" }
      - { type: j, text: "而远之，可谓知矣。”（包曰：“敬鬼神而不黩。”）问仁。曰：“仁者先难而" }
      - { type: j, text: "後获，可谓仁矣。”（孔曰：“先劳苦而後得功，此所以为仁。”）" }
      - { type: z, text: "“樊迟”至“仁矣”。○正义曰：此章明仁、知之用也。“樊迟问知”" }
      - { type: j, text: "者，弟子樊须问於孔子，何为可谓之知。“子曰：务民之义，敬鬼神而远之，可" }
      - { type: j, text: "谓知矣”者，孔子答其为知也。言当务所以化道民之义，恭敬鬼神而疏远之，不" }
      - { type: j, text: "亵黩，能行如此，可谓为知矣。“问仁”者，樊迟又问何为可谓之仁。“子曰：" }
      - { type: j, text: "仁者先难而後获，可谓仁矣”者，此答其为仁也。获，犹得也。言为仁者先受劳" }
      - { type: j, text: "苦之难，而後乃得功，此所以为仁也。" }
      - { type: j, text: "子曰：“知者乐水，（包曰：“知者乐运其才知以治世，如水流而不知已。”）" }
      - { type: j, text: "仁者乐山。（仁者乐如山之安固，自然不动，而万物生焉。）知者动，（包曰：" }
      - { type: j, text: "“日进故动。”）仁者静。（孔曰：“无欲故静。”）知者乐，（郑曰：“知者" }
      - { type: j, text: "自役得其志故乐。”）仁者寿。”（包曰：“性静者多寿考。”）" }
      - { type: z, text: "“子曰”至“仁者寿”。○正义曰：此章初明知、仁之性，次明知、仁" }
      - { type: j, text: "之用，三明知，仁之功也。“知者乐水”者，乐，谓爱好。言知者性好运其才知" }
      - { type: j, text: "以治世，如水流而不知已止也。“仁者乐山”者，言仁者之性好乐如山之安固，" }
      - { type: j, text: "自然不动，而万物生焉。“知者动”者，言知者常务进故动。“仁者静”者，言" }
      - { type: j, text: "仁者本无贪欲，故静。“知者乐”者，言知者役用才知，成功得志故欢乐也。" }
      - { type: j, text: "“仁者寿”者，言仁者少思寡欲，性常安静，故多寿考也。" }
      - { type: j, text: "子曰：“齐一变至於鲁，鲁一变至於道。”（包曰：“言齐、鲁有太公、周" }
      - { type: j, text: "公之馀化，太公大贤，周公圣人，今其政教虽衰，若有明君兴之，齐可使如鲁，" }
      - { type: j, text: "鲁可使如大道行之时。”）" }
      - { type: z, text: "“子曰：齐一变至於鲁，鲁一变至於道。”○正义曰：此章言齐、鲁有" }
      - { type: j, text: "太公、周公之馀化，太公大贤，周公圣人，今其政教虽衰，若有明君兴之，齐可" }
      - { type: j, text: "一变使如於鲁，鲁可一变使如於大道行之时也。" }
      - { type: j, text: "子曰：“觚不觚，（马曰：“觚，礼器。一升曰爵，二升曰觚。”）觚哉！" }
      - { type: j, text: "觚哉！”（觚哉！觚哉！言非觚也，以喻为政不得其道则不成。）" }
      - { type: z, text: "“子曰：觚不觚，觚哉！觚哉！○正义曰：此章言为政须遵礼道也。觚" }
      - { type: j, text: "者，礼器，所以盛酒。二升曰觚。言觚者，用之当以礼，若用之失礼，则不成为" }
      - { type: j, text: "觚也，故孔子叹之觚哉！觚哉！言非觚也，以喻人君为政当以道，若不得其道，" }
      - { type: j, text: "则不成为政也。○注“马曰：觚，礼器。一升曰爵，二升曰觚。○正义曰：案" }
      - { type: j, text: "《特牲礼》：“用二爵二觚四觯一角三散。”是觚为礼器也。《异义》：《韩诗" }
      - { type: j, text: "为》“一升曰爵。爵，尽也，足也。二升曰觚。觚，寡也，饮当寡少。三升曰觯。" }
      - { type: j, text: "觯，也，饮当自也。四升曰角。角，触也，不能自，触罪过也。五升曰散。" }
      - { type: j, text: "散，讪也，饮不省节，为人谤讪。总名曰爵，其实曰觞。觞者，饷也。觥亦五升。" }
      - { type: j, text: "所以罚不敬。觥，廓也。所以著明之貌。君子有过，廓然著明，非所以饷，不得" }
      - { type: j, text: "名觞”。此唯言爵、觚者，略言之也。" }
      - { type: j, text: "宰我问曰：“仁者，虽告之曰：‘井有仁焉。’其从之也？”（孔曰：“宰" }
      - { type: j, text: "我以仁者必济人於患难，故问有仁人堕井将自投下，从而出之不乎？欲极观仁者" }
      - { type: j, text: "忧乐之所至。”）子曰：“何为其然也？君子可逝也，不可陷也。（孔曰：“逝，" }
      - { type: j, text: "往也。言君子可使往视之耳，不肯自投从之。”）可欺也，不可罔也。”（马曰：" }
      - { type: j, text: "“可欺者，可使往也。不可罔者，不可得诬罔令自投下。”）" }
      - { type: z, text: "“宰我”至“罔也”。○正义曰：此章明仁者之心也。“宰我问曰：仁" }
      - { type: j, text: "者，虽告之曰：‘井有仁焉。其从之也’”者，宰我以仁者必济人於患难，故问" }
      - { type: j, text: "曰：仁者之人，设有来告曰：井中有仁人焉。言仁人堕井也，此承告之仁人，将" }
      - { type: j, text: "自投下，从而出之不乎？意欲极观仁者忧人乐生之所至也。“子曰：何为其然也？" }
      - { type: j, text: "君子可逝也，不可陷也”者，此孔子怪拒之辞。逝，往也。然，如是也。言何为" }
      - { type: j, text: "能使仁者如是自投井乎？夫仁人君子，但可使往视之耳，不可陷入於井。言不可" }
      - { type: j, text: "自投从之也。“可欺也，不可罔也”者，唯可欺之使往视，不可得诬罔令自投下" }
      - { type: j, text: "也。" }
      - { type: j, text: "子曰：“君子博学於文，约之以礼，亦可以弗畔矣夫！”（郑曰：“弗畔，" }
      - { type: j, text: "不违道。”）" }
      - { type: z, text: "“子曰：君子博学於文，约之以礼，亦可以弗畔矣乎！”○正义曰：畔，" }
      - { type: j, text: "违也。此章言君子若博学於先王之遗文，复用礼以自捡约，则不违道也。" }
      - { type: j, text: "子见南子，子路不说。夫子矢之曰：“予所否者，天厌之！天厌之！”（孔" }
      - { type: j, text: "曰：“旧以南子者，卫灵公夫人，淫乱，而灵公惑之。孔子见之者，欲因以说灵" }
      - { type: j, text: "公，使行治道。矢，誓也。子路不说，故夫子誓之。行道既非妇人之事，而弟子" }
      - { type: j, text: "不说，与之咒誓，义可疑焉。”）" }
      - { type: z, text: "“子见”至“厌之”。○正义曰：此章孔子屈已，求行治道也。“子见" }
      - { type: j, text: "南子”者，南子，卫灵公夫人，淫乱，而灵公惑之。孔子至卫，见此南子，意欲" }
      - { type: j, text: "因以说灵公，使行治道故也。“子路不说”者，子路性刚直，未达孔子之意，以" }
      - { type: j, text: "为君子当义之与比，而孔子乃见淫乱妇人，故不说乐。“夫子矢之”者，矢，誓" }
      - { type: j, text: "也。以子路不说，故夫子告誓之。“曰：予所否者，天厌之！天厌之”者，此誓" }
      - { type: j, text: "辞也。予，我也。否，不也。厌，弃也。言我见南子，所不为求行治道者，原天" }
      - { type: j, text: "厌弃我。再言之者，重其誓，欲使信之也。○注“孔曰”至“疑焉”。○正义曰：" }
      - { type: j, text: "云“孔曰：旧以南子者，卫灵公夫人，淫乱，而灵公惑之。孔子见之者，欲因以" }
      - { type: j, text: "说灵公，使行治道。矢，誓也。子路不说，故夫子誓之”者，先儒旧有此解也。" }
      - { type: j, text: "云“行道既非妇人之事，而弟子不说，与之咒誓，义可疑焉”者，安国以为，先" }
      - { type: j, text: "儒旧说，不近人情，故疑其义也。《史记·世家》：孔子至卫，“灵公夫人有南" }
      - { type: j, text: "子者，使人谓孔子曰：‘四方之君子不辱欲与寡君为兄弟者，必见寡小君。寡小" }
      - { type: j, text: "君原见。’孔子辞谢，不得已而见之。夫人在帷中。孔子入门，北面稽首。夫" }
      - { type: j, text: "人自帷中再拜，环玉声ギ然。孔子曰：‘吾乡为弗见，见之礼答焉。’子路不" }
      - { type: j, text: "说。孔子矢之曰：‘天厌之！天厌之！’”是子见南子之事也。栾肇曰：“见南" }
      - { type: j, text: "子者，时不获已，犹文王之拘里也。天厌之者，言我之否屈乃天命所厌也。”" }
      - { type: j, text: "蔡谟云：“矢，陈也。夫子为子路陈天命也。”" }
      - { type: j, text: "子曰：“中庸之为德也，其至矣乎！民鲜久矣。”（庸，常也。中和可常行" }
      - { type: j, text: "之德。世乱，先王之道废，民鲜能行此道久矣，非今。）" }
      - { type: z, text: "“子曰：中庸之为德也，其至矣乎！民鲜久矣”。○正义曰：此章言世" }
      - { type: j, text: "乱，人不能行中庸之德也。中，谓中和。庸，常也。鲜，罕也。言中和可常行之" }
      - { type: j, text: "德也，其至极矣乎！以世乱，先王之道废，故民罕能行此道久多时矣，非而今" }
      - { type: j, text: "也。" }
      - { type: j, text: "子贡曰：“如有博施於民而能济众，何如？可谓仁乎？”子曰：“何事於仁！" }
      - { type: j, text: "必也圣乎！尧、舜其犹病诸！（孔曰：“君能广施恩惠，济民於患难，尧、舜至" }
      - { type: j, text: "圣，犹病其难。”）夫仁者，己欲立而立人，己欲达而达人。能近取譬，可谓仁" }
      - { type: j, text: "之方也已。”（孔曰：“更为子贡说仁者之行。方，道也。但能近取譬於已，皆" }
      - { type: j, text: "恕己所欲而施之於人。”）" }
      - { type: z, text: "“子贡”至“也已”。○正义曰：此章明仁道也。“子贡曰：如有博施" }
      - { type: j, text: "於民而能济众，何如？可谓仁乎”者，子贡问夫子曰：“设如人君能广施恩惠於" }
      - { type: j, text: "民而能振济众民於患难者，此德行何如？可以谓之仁人之君乎？”“子曰：何事" }
      - { type: j, text: "於仁！必也圣乎！尧、舜其犹病诸”者，此孔子答子贡之语也。言君能博施济众，" }
      - { type: j, text: "何止事於仁！谓不啻於仁，必也为圣人乎！然行此事甚难，尧、舜至圣，犹病之" }
      - { type: j, text: "以为难也。“夫仁者，已欲立而立人，已欲达而达人。能近取譬，可谓仁之方也" }
      - { type: j, text: "已”者，此孔子更为子贡说仁者之行也。方，犹道也。言夫仁者，己欲立身进达" }
      - { type: j, text: "而先立达他人，又能近取譬於已，皆恕已所欲而施之於人，已所不欲，弗施於人，" }
      - { type: j, text: "可谓仁道也。" }
