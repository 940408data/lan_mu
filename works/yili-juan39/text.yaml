# 儀禮注疏卷39（賈公彥疏）：j 為經文＋鄭玄注，z 為疏文。
sections:
  - id: juan39
    name: 正文
    blocks:
      - { type: j, text: "公賵，玄纁束，馬兩。公，國君也。賵，所以助主人送葬也。兩馬，士制也。《春秋傳》曰：宋景曹卒，魯季康子使冉求賵之以馬，曰：其可以稱旌繁乎？" }
      - { type: z, text: "“公贈”至“馬兩”。○注“公國”至“繁乎”。○釋曰：自此盡“入復位杖”，論國君賵法之事。雲“公，國君也”者，公及大夫皆有臣，臣皆尊其君，呼之曰公，故《左氏傳》伯有之臣曰：“吾公在壑谷。”今此雲公，則國君，非大夫君也。以下雲“主人釋杖，迎於廟門外”，與《喪大記》如此迎送者，皆據國君也。雲“賵，所以助主人送葬也”者，案兩小《傳》皆雲：車馬曰賵，施於生及送死者，故云助主人送葬者也。是以下注雲“賵奠於死生兩施”是也。雲“兩馬，士制也”者，謂士在家常乘之法。若出使及征伐，則乘駟馬，其大夫以上則常乘駟馬，故鄭駁異義雲天子駕駟。《尚書·康王之誥》康王始即位，雲諸侯“皆布乘黃朱”；《詩》雲“駟騵彭彭”，武王所乘；《魯頌》雲“六轡耳耳”，僖公所乘；《小雅》雲“駟牡騑騑”，大夫所乘；是大夫以上駕駟之文也。引《春秋》者，《左氏傳》哀公二十三年春，“宋景曹卒”，注云：“景曹，宋元公夫人小邾女，季桓子外祖母。”又云：“季康子使冉有吊，且送葬，曰：敝邑有社稷之事，使肥與有職競焉，是以不得助執紼，使求從輿人。”注云：“輿，眾也。”又云：“曰：以肥之得備彌甥也。”注云：“彌，遠也。康子父之舅氏，故稱彌甥。”又云：“有不腆先人之產馬，使求薦諸夫人之宰，其可以稱旌繁乎！”注云：“稱，舉也。繁馬飾繁纓也。”引之者，證公有賵馬助人之事。" }
      - { type: j, text: "擯者出請，入告。主人釋杖，迎於廟門外，不哭，先入門右，北面，及眾主人袒。尊君命也。眾主人自若西面。" }
      - { type: z, text: "“擯者”至“人袒”。○注“尊君”至“西面”。○釋曰：雲“尊君命也”者，謂釋杖迎入，是尊君命也。故下文賓賵，擯者出告須，注云“不迎”。則此經皆是尊君命，故鄭無所指屬君命，故鄭解經“不哭”。又前文袒襲皆據主人，此則眾主人亦袒，亦是尊君命。雲“眾主人自若西面”者，以其主人一人迎賓入門，門東而右，其餘眾主人不迎賓，明自若常位，柩東西面可知也。" }
      - { type: j, text: "馬入設。設於庭，在重南。" }
      - { type: z, text: "“馬入設”。○注“設於庭在重南”。○釋曰：以馬是庭實，故云“設於庭”。知“在重南”者，以庭實法，皆參分庭一在南設之，又重北陳，明器不得設馬，故知在重南也。" }
      - { type: j, text: "賓奉幣，由馬西當前輅，北面致命。賓，使者。幣，玄纁也。輅，轅縛，所以屬引。由馬西，則亦當前輅之西，於是北面致命，得鄉柩與奠。柩車在階閒少前，參分庭之北，輅有前後。" }
      - { type: z, text: "“賓奉”至“致命”。○注“賓使”至“前後”。○釋曰：雲“賓，使者”，案此使者即士也。知者，《士喪禮》“君使人吊”，注：“使人，士也，禮使人各以其爵。”故知是士也。雲“輅，轅縛，所以屬引”者，謂以木縛於柩車轅上以屬引，於上而挽之，故名轅縛也。雲“由馬西，則亦當前輅之西”者，以經直雲“當前輅”，不言輅之東西及前後，鄭以義言之，以其馬在重南，當門，柩車在階閒少南，亦當門，賓由馬西北行，當前輅致命，明在輅西可知。雲“於是北面致命，得鄉柩與奠”者，以賓當輅西，經雲“北面致命”，明當奠柩之南，北面，是得鄉柩與奠也。雲“柩車在階閒少前，參分庭之北”者，案下記雲“遂匠納車於階閒”，是柩車在階閒也。雲少前者，上經祖還車訖，雲“婦人降，即位於階閒”，明柩車少南，是少前也。雲參分庭之北者，以其中庭陳明器，不得在中庭，故知在參分庭之北，謂參分庭在北分之北，此解賓“致命”之處。雲“輅有前後”者，以經雲前輅，明有後，以對前，故知輅有前後也。" }
      - { type: j, text: "主人哭，拜稽顙，成踴。賓奠幣於棧左服，出。棧，謂柩車也。幾士車制無漆飾，左服，象授人授其右也。服，車箱。今文棧作輚。" }
      - { type: z, text: "“主人”至“服出”。○注“棧謂”至“作輚”。○釋曰：“主人哭拜”者，仍於門右北面，以賓致命訖，遂哭拜也。雲“成踴”者，三者三，凡九踴。雲“棧謂柩車也，凡士車制無漆飾”者，此棧車即柩車，以其賓由輅西而致命。雲“奠幣於棧”者，明此棧車、柩車即蜃車，四輪迫地，無漆飾，故言棧也。雲“左服，象授人授其右也”者，案《聘禮》宰授使者圭時，雲“同面”，使者在左，宰在右，而授其右也。此車南鄉，以東為左，屍在車上，以東為右，故授左服，容授屍之右也。" }
      - { type: j, text: "宰由主人之北，舉幣以東。柩東，主人位。以東，藏之。" }
      - { type: z, text: "“宰由”至“以東”。○注“柩東”至“藏之”。○釋曰：雲“柩東，主人位”者，解經“由主人之北”，以幣在車東，主人在車東，故宰由主人位北，而鄉左服上取幣，以東藏之於內也。但此時主人仍在門東，北面，此位雖無主人，既有定位，故宰由位北而取幣，不得履主人之位，故由主人之北也。" }
      - { type: j, text: "士受馬以出。此士謂胥徒之長也。有勇力者受馬。《聘禮》曰“皮馬相閒”可也。" }
      - { type: z, text: "“士受馬以出”。○注“此士”至“可也”。○釋曰：雲“此士謂胥徒之長也，有勇力者受馬”，不得為屬士，以其受幣者宜尊，受馬者宜卑，故知受馬是胥徒之長，以其受馬，故知有勇力者也。若然，《婚禮》記雲：“士受皮。”注云士謂中士、下士不為胥徒者。彼主人親受幣，明受皮非胥徒，是正士也。引《聘禮》者，欲見此用皮亦可也。" }
      - { type: j, text: "主人送於外門外，拜，襲，入復位，杖。" }
      - { type: z, text: "“主人”至“位杖”。○釋曰：主人既送賓，還入廟門，車東復位杖也。" }
      - { type: j, text: "賓賵者將命。賓，卿大夫士也。" }
      - { type: z, text: "“賓賵者將命”。○注“賓卿大夫士也”。○釋曰：自此盡“知生者賻”，論賓及兄弟賻奠之事。雲“賓，卿大夫士也”者，以其上雲君，下有兄弟，則此賓是國中三卿、五大夫、二十七士可知。言“將命”者，身不來，遣使者將命告主人。" }
      - { type: j, text: "擯者出請，入告，出告須。不迎，告曰：“孤某須。”" }
      - { type: z, text: "注“不迎”至“某須”。○釋曰：案《雜記》諸侯使卿吊鄰國諸侯，主人使擯者告賓雲：“孤某須矣。”故引之為義。" }
      - { type: j, text: "馬入設。賓奉幣，擯者先入，賓從，致命如初。初，公使者。主人拜於位，不踴。柩車東位也。既啟之後，與在室同。" }
      - { type: z, text: "注“柩車”至“室同”。○釋曰：雲“既啟之後，與在室同”者，案上篇始死時，雲庶兄弟襚，使人以將命於室，主人拜於位。此主人亦拜於位，俱是不為賓出，故云與在室同。至於有君命，亦出迎也。" }
      - { type: j, text: "賓奠幣如初，舉幣，受馬如初。擯者出請。賓出在外，請之，為其復有事。" }
      - { type: z, text: "注“賓出”至“有事”。○釋曰：雲“賓出在外，請之，為其復有事”者，以其賓既行賵訖，出更請之，為其復有事。若無事，賓報事畢，送去也。" }
      - { type: j, text: "若奠，賓致可以奠也。" }
      - { type: z, text: "“若奠”。○注“賓致可以奠也”。○釋曰：謂賓不辭，此釋所致之物，或可堪為元缺一字奠於祭祀者也。" }
      - { type: j, text: "入告，出，以賓入。將命如初。士受羊如受馬，又請。士亦謂胥徒之長。又，復也。" }
      - { type: z, text: "注“士亦”至“復也”。○釋曰：以其受羊與馬，同是畜類，故知亦胥徒之類。但受羊不須勇力，故鄭不言也。" }
      - { type: j, text: "若賻，賻之言，補也，助也，貨財曰賻。" }
      - { type: z, text: "“若賻”。○注“賻之”至“曰膊”。○釋曰：雲“貨財曰賻”者，《公羊傳》文也。" }
      - { type: j, text: "入告。主人出門左，西面。賓東面將命。主人出者，賻主施於主人。" }
      - { type: z, text: "注“主人”至“主人”。○釋曰：鄭知“施於主人”者，以下經雲“知生者賻”，是施於主人也。案《春秋》文五年春，“王使榮叔歸含，且賵”。《傳》譏一人兼二事。此賓所以兼事者，彼譏一人獨行，不與介各行，故譏。若《雜記》雲上客吊，即其介各行含、襚、賵，則不譏。則卿大夫士禮，一人行數事可也。" }
      - { type: j, text: "主人拜，賓坐委之。宰由主人之北，東面舉之，反位。坐委之，明主人哀戚，志不在受人物。反位，反主人之後位。" }
      - { type: z, text: "注“坐委”至“後位”。○釋曰：鄭知“反位，反主人之後位”者，以主人在門東西面，而云“宰由主人之北”，鄉賓奠幣之處舉幣，明宰位在主人之後，故得由主人之北，西行，是以宰位在主人之後也。" }
      - { type: j, text: "若無器，則捂受之。謂對相授，不委地。" }
      - { type: z, text: "“若無”至“受之”。○注“謂對”至“委地”。○釋曰：以堂上授有並受法，以其在門外，若有器盛之，則坐委於地。若無器，則對面相授受，故云“捂受之”，捂即選也，對面相逢受也。" }
      - { type: j, text: "又請，賓告事畢，拜送，入。贈者將命。贈，送。擯者出請，納賓如初。如其入告，出告須。" }
      - { type: z, text: "注“如其”至“告須”。○釋曰：謂如上賓賵時，擯者出請，入告，出告須也。" }
      - { type: j, text: "賓奠幣如初。亦於棧左服。若就器，則坐奠於陳。就猶善也。贈無常，唯玩好所有。陳，明器之陳。" }
      - { type: z, text: "“若就”至“於陳”。○注“就猶”至“之陳”。○釋曰：知“贈無常”者，案下記雲“凡贈幣無常”，注云：“賓之贈也。玩好曰贈，在所有。”言“玩好”者，謂生時玩好之具，與死者相知，皆可以贈死者，故此經雲“若就器則坐奠於陳”者，就器則是玩好之器也。雲“陳，明器之陳”者，以其廟中所陳者唯明器，即陳於車之西以外，或言薦，或言設，無言陳者，故指明器而言也。" }
      - { type: j, text: "凡將禮，必請而後拜送。雖知事畢猶請，君子不必人意。" }
      - { type: z, text: "“凡將”至“拜送”。○注“雖知”至“人意”。○釋曰：雲“君子不必人意”者，義取孔子云“無必，無固”之言也。" }
      - { type: j, text: "兄弟，賵、奠可也。兄弟，有服親者，可且賵且奠，許其厚也。賵奠於死生兩施。" }
      - { type: z, text: "“兄弟賵奠可也”。○注“兄弟”至“兩施”。○釋曰：知“兄弟，有服親”者，《喪服傳》雲：“凡小功以下為兄弟。”既言兄弟，明有服親者也。知非大功以上者，以大功以上有同財之義，無致賵奠之法。雲“可且賵且奠，許其厚也”者，若然，此所知許其賵，不許其奠，兄弟許其貳賵兼奠，而上經亦賓而有賵、有奠、有賻三者，彼亦不使並行俱見之。見三禮之中，有則任行其一，故總見之。雲“賵奠於死生兩施”者，以下經雲“知死者贈，知生者賻”，注云：“各主於所知。”此賵奠不偏言所主，明於生死兩施也。" }
      - { type: j, text: "所知，則賵而不奠。所知，通問相知也，降於兄弟。奠，施於死者為多，故不奠。" }
      - { type: z, text: "“所知”至“不奠”。○注“所知”至“不奠”。○釋曰：雲“所知，通問相知也”者，言所知，明是朋友通問相知。言“降於兄弟”者，許賵不許奠也。雲“奠，施於死者為多，故不奠”者，但賵與奠皆生死兩施，其奠雖兩施，施於死者為多，知者，以其言奠為死者而行，故知元缺一字所知為疏不許行之也。" }
      - { type: j, text: "知死者贈，知坐者賻。各主於所知。" }
      - { type: z, text: "“知死”至“為賻”。○注“各主於所知”。○釋曰：雲“各主於所知”者，以其贈是玩好施於死者，故知死者行之。賻是補主人不足，施於生者，故知生者行之，是各施於所知也。" }
      - { type: j, text: "書賵於方，若九，若七，若五。方，板也。書賵奠賻贈之人名與其物於板。每板若九行，若七行，若五行。" }
      - { type: z, text: "“書賵”至“若五”。○注“方版”至“五行”。○釋曰：以賓客所致，有賻、有賵、有贈、有奠，直雲“書賵”者，舉首而言，但所送有多少，故行數不同。" }
      - { type: j, text: "書遣於策。策，簡也。遣猶送也。謂所當藏物茵以下。" }
      - { type: z, text: "“書遣於策”。○注“策簡”至“以下”。○釋曰：雲“策，簡”者，編連為策，不編為簡，故《春秋左氏傳》雲南史氏執簡以往，上書賵雲方，此言書遣於策，不同者，《聘禮》記雲“百名以上書於策，不及百名書於方”，以賓客贈物名字少，故書於方，則盡遣送死者。明器之等並贈死者玩好之物，名字多，故書之於策。策書明器之物，應在上文，而於此言之者，遣中並有贈物，故在賓客贈賄與賵之下特書也。" }
      - { type: j, text: "乃代哭如初。棺柩有時將去，不忍絕聲也。初，謂既小斂時。" }
      - { type: z, text: "“乃代哭如初”。○注“棺柩”至“斂時”。○釋曰：案《喪大記》大夫以上官代哭，士無官，以親疏代哭。雲“初謂既小斂時”者，案《喪大記》小斂之後乃代哭，初死直主人哭不絕聲，士二日小斂，小斂主人懈怠，容更代而哭也。" }
      - { type: j, text: "宵，為燎於門內之右。為哭者為明。" }
      - { type: z, text: "“宵為”至“之右”。○注“為哭者為明”。○釋曰：燎，大燭，必於門內之右門東者，奠於柩車西，鬼神尚幽闇，不須明。柩車東有主人，階閒有婦人，故於門右照之，為明而哭也。" }
      - { type: j, text: "厥明，陳鼎五於門外，如初。鼎五，羊、豕、魚、臘、鮮獸各一鼎也。士禮，特牲三鼎，盛葬奠加一等，用少牢也。如初，如大斂奠時。" }
      - { type: z, text: "“厥明”至“如初”。○注“鼎五”至“奠時”。○釋曰：自此盡“主人要節而踴”，論葬日之明，陳大遣奠於廟門外之事。知五鼎是“羊豕魚臘鮮獸各一鼎”者，以下經雲羊左胖，豕亦如之，魚、臘、鮮獸皆如初，與少牢禮同，故知也。雲“士禮，特牲三鼎”者，《特牲饋食禮》陳三鼎，故知也。雲“盛葬奠加一等，用少牢也”者，以其常祭用特牲，今大遣奠與大夫常祭用少牢，同是盛此葬奠，故加一等用少牢也。雲“如初，如大斂奠時”者，以其上遷祖奠時，雲如殯謂如大斂，明此雲如初亦如大斂，在廟門外及東方之饌也。雖如大斂，鼎數仍不同，以其大斂三鼎，此則五鼎。然大小斂時無黍稷，朔月則有黍稷，此葬奠又無黍稷者，大斂前無黍稷者，以其初死，至朔月乃有之，故鄭注云至此乃有黍稷。今葬奠更無黍稷者，以其始死至殯，自啟至葬，其禮同，故無黍稷亦同也。凡牢鼎數或多或少不同，若用特豚者，或一鼎，或三鼎，若《士冠禮》醮子及《婚禮》盥饋並小斂之奠，與朝禰之奠皆一鼎也。三鼎者，《婚禮》同牢，《士喪》大斂朔月遷祖及祖奠，皆三鼎，而以魚、臘配之是也。其用少牢者，或三鼎，或五鼎，三鼎者，則《有司徹》雲：“陳三鼎，如初。”以其繹祭殺之於正祭，故用少牢而鼎三也。五鼎者，少牢五鼎，大夫之常事，此葬奠，士攝之奠用少牢，亦五鼎。《聘禮》致飧，眾介皆少牢，亦五鼎。《玉藻》諸侯朔月少牢，亦五鼎。其用大牢者，或七，或九，或十，或十二。其雲七鼎九鼎者，《公食大夫》下大夫大牢鼎七，上大夫鼎九是也。鼎十與十二者，《聘禮》致飧於賓，飪一牢，鼎九，羞鼎三，是十二也。又云上介飪一牢，鼎七，羞鼎三，是其十。若然，案《郊特牲》雲“鼎俎奇而籩豆偶”，以象陰陽，鼎有十與十二者，以其正鼎與陪鼎各別，數則為奇數也。" }
      - { type: j, text: "其實：羊左胖，反吉祭也。言左胖者，體不殊骨也。" }
      - { type: z, text: "“其實羊左胖”。○注“反吉”至“骨也”。○釋曰：雲“反吉祭也”者，以其《特牲》、《少牢》吉祭皆升右胖，此雲“左胖”，故云反吉祭也。雲“言左胖者，體不殊骨也”者，既言左胖，則左邊共為一段，故云體不殊骨。雖然，下雲“髀不升”，則除髀以下，胳仍升之，則與上肩脅脊別升，則左胖仍為三段矣。而云體不殊骨，據脊脅以上，胳已下，共為一，亦得為體不殊骨也。" }
      - { type: j, text: "髀不升，周貴肩賤髀。古文髀作脾。" }
      - { type: z, text: "“髀不升”。○注“周貴肩賤髀”。○釋曰：雲“髀不升”者，則已上去之，取胳已下。雲“周貴肩賤髀”者，案《祭統》雲：“殷人貴髀，周人貴肩。”故云髀不升。" }
      - { type: j, text: "腸五，胃五，亦盛之也。" }
      - { type: z, text: "“腸五胃五”。○注“亦盛之也”。○釋曰：“亦盛之”者，以其不用《特牲》，而用《少牢》，是盛葬奠。案《少牢》用腸三，胃三，今加至五，亦是盛此奠也。" }
      - { type: j, text: "離肺。離，扌奎。" }
      - { type: z, text: "“離肺”。○注“離扌奎”。○釋曰：此非直升腸胃，又升離肺者，案《少儀》雲“牛羊之肺，離而不提心”，注云：“提猶絕也。奎刂離之，不絕中央少者，使易絕以祭耳。”此為食而舉，亦名舉肺也。" }
      - { type: j, text: "豕亦如之，豚解，無腸胃。如之，如羊左胖，髀不升，離肺也。豚解，解之如解豚，亦前肩、後肫、脊、脅而已。無腸胃者，君子不食溷腴。" }
      - { type: z, text: "“豕亦”至“腸胃”。○注“如之”至“溷腴”。○釋曰：雲“亦如之”，鄭雲“如之，如羊左胖，髀不升，離肺也”者，謂豕與羊同者左胖，雖同，仍與羊異，以其羊則體不殊骨，上下共為二段，此豕之左胖則為四段矣，故別雲“豚解”。豚解總有七段，今取左胖仍為四段矣。雲“亦前肩、後肫、脊、脅而已”者，鄭欲為四段與羊異也。雲“君子不食溷腴”者，《禮記·少儀》文。彼鄭注云：“謂犬豕之屬，食米穀者也。腴有似人穢。”引之者，證不取腸胃之義也。" }
      - { type: j, text: "魚、臘，鮮獸，皆如初。鮮，新殺者，士臘用兔。加鮮獸而無膚者，豕既豚解，略之。" }
      - { type: z, text: "“魚臘”至“如初”。○注“鮮新”至“略之”。○釋曰：雲“士臘用兔”者，謂此臘是其乾者。雲“鮮，新殺”者，二者皆用兔。必知“士臘用兔”者，雖無正文，案《少牢禮》，大夫臘用麋，鄭雲：“大夫用麋，士用兔與？”以無正文，故云“與”以疑之。此亦云士臘用兔，雖不雲與，亦同疑可知。但士臘宜小，故疑用兔也。雲“加鮮獸而無膚”者，豕既豚解略之者，以葬奠用少牢，攝盛則當有膚，與少牢同以豕，既豚解四段，喪事略，則無膚者，亦略之而加鮮獸也。" }
      - { type: j, text: "東方之饌：四豆，脾析、蜱醢、葵菹、蠃醢；脾，讀為雞脾<月此>之脾。脾析，百葉也。蜱，蜯也。今文蠃為蝸。" }
      - { type: z, text: "“東方”至“蠃醢”。○注“脾讀”至“為蝸”。○釋曰：陳鼎既訖，又陳東方之饌於主人之南，前輅之東，其豆有四：脾析一，蜱醢二，葵菹三，蠃醢四。案《周禮》鄭注《醢人》雲：“細切為誹齏，全物若<月枼>為菹。”又云“齏菹之稱，菜肉通。”又經不雲菹者，類皆是齏，則此經雲“脾析”者，即齏也。雲“脾讀為雞脾肶之脾”者，鄭讀之，欲見此脾雖與脾腎之脾同，正謂百葉名為脾析，故讀音從雞脾肶之脾。時俗有此語，故讀從之也。案《醢人》注云：“脾析，牛百葉也。”此不雲牛者，彼天子禮，容有牛，此用少牢無牛，當是羊百葉，故不雲牛也。雲“蜱，蜯也”者，即蛤也，知蜱即蛤者，以《周禮·醢人》雲“螷醢”，注云：“螷，蛤也。”此注云蜱，蜯也。以蜱、螷是一物，故知蜱蜯即螷蛤也。" }
      - { type: j, text: "四籩：棗、糗、栗、脯；糗，以豆糗粉餌。" }
      - { type: z, text: "“四籩棗糗栗脯”。○注“糗以豆糗粉餌”。○釋曰：雲“糗，以豆糗粉餌”者，案《籩人》雲：“羞籩之實，糗餌粉餈。”鄭雲“此二物皆粉，稻米、黍米所為也。合蒸曰餌，餅之曰餈。糗者，搗粉熬大豆為餌，餈之粘著以粉之耳。餌言糗，餈言粉，互相足”者，此本一物，餌言糗，謂熬之亦粉之；餈言粉，搗之亦糗之。不言互文而云互相足者，凡言互文者，是二物各舉一邊而省文，故云互文。此糗與粉唯一物分為二，文皆語不足，故云互相足也。又案《籩人》羞有二邊，糗餌及粉餈。此經直言糗，則舉糗以見餌，而無餈，故鄭雲糗以豆糗粉餌也。" }
      - { type: j, text: "醴、酒。此東方之饌，與祖奠同，在主人之南，當前輅，北上，巾之。" }
      - { type: z, text: "“醴酒”。○注“此東”至“巾之”。○釋曰：鄭知義然者，案下記雲：“祝饌祖奠於主人之南，當前輅，北上，巾之。”注云：“既祖祝乃饌。”以此言之，祝饌祖奠即是還柩鄉外，乃饌之於主人之南，自還柩車，至此饌葬奠，柩車未動，則此葬奠，東方之饌亦饌於主人之南，當與前同處，故注云“與祖奠同，在主人之南”。但祖奠與大斂奠同二豆二籩，此葬奠四豆四籩，籩豆雖不同，而同處耳。雲“北上”者，蓋兩甒在北，次南饌四豆，豆南饌四籩也。" }
      - { type: j, text: "陳器。明器也。夜斂藏之。" }
      - { type: z, text: "“陳器”。○注“明器”至“藏之”。○釋曰：陳饌已訖，又陳明器也。本作夜斂，適似寫誤，雲“適斂”者，以其上朝祖之日已陳明器，此復陳之者，由朝祖至夜斂藏之，至此厥明更陳之也。" }
      - { type: j, text: "滅燎。執燭，俠輅，北面。炤徹與葬奠也。" }
      - { type: z, text: "“滅燎至北面”。○注“炤徹與葬奠也”。○釋曰：昨日朝祖，日至夕雲“宵為燎於門內之右”，至此滅燎。既滅，二人執燭俠輅北面，一人在輅東，一人在輅西，輅西者炤祖奠，輅東者炤葬奠之饌，故注云“炤徹與葬奠也”。" }
      - { type: j, text: "賓入者，拜之。明自啟至此，主人無出禮。" }
      - { type: z, text: "“賓入者拜之”。○注“明自”至“出禮”。○釋曰：此時有吊葬之賓，主人皆不出迎，但在位拜之。所以不出迎者，既啟之後，既睹屍柩，不可離位以迎賓，唯有君命乃出，故注云“明自啟至此，主人無出禮”也。" }
      - { type: j, text: "徹者入，丈夫踴。設於西北，婦人踴。猶阼階升時也，亦既盥乃入。入由重東，而主人踴，猶其升也。自重北西面而徹，設於柩車西北，亦由序西南。" }
      - { type: z, text: "“徹者”至“人踴”。○注“猶阼”至“西南”。○釋曰：雲“徹者入”者，謂將設葬奠，先徹祖奠，故云徹者入。入謂祝與執事徹祖奠者，亦既盥乃入，由重東而主人踴，至徹訖，設柩車西北，則婦人踴也。雲“猶阼階升”者，謂徹小斂奠者，門外盥訖，入，升自阼階，丈夫踴。今徹者亦門外盥訖，入由重東，主人踴，故云“猶其升”也。雲“自重北西面而徹，設於柩車西北，亦猶序西南”者，此徹祖奠設於柩車西北，亦猶小斂、大斂、朔月奠設於序西南也。" }
      - { type: j, text: "徹者東。由柩車北，東適葬奠之饌。" }
      - { type: z, text: "“徹者東”。○注“由柩”至“之饌”。○釋曰：以其徹訖當設葬，奠故徹者由柩車北，東適葬奠之饌，取而設於柩車西也。知由柩車北而東者，以其徹者設於柩車西北而云徹者東，若柩車南不得雲徹者東，故知在柩車北，東行也。" }
      - { type: j, text: "鼎入。舉入陳之也。陳之蓋於重東北，西面北上如初。" }
      - { type: z, text: "“鼎入”。○注“舉入”至“如初”。○釋曰：以其徹者既祖，當設葬奠，故五鼎皆入陳也。雲“陳之也，蓋於重東北西面北上如初”者，以其上篇小斂奠，舉鼎入阼階前，西面錯。大斂奠雲舉鼎入西面，北上。又朔月奠雲鼎入皆如初。其遷祖奠雲陳鼎皆如殯，則皆在阼階下西面，北上。今此但云“鼎入”，不言如初，無正文，故云“蓋”以疑之。既疑而知在東北西面北上者，以其奠祭在室，掌設者皆陳鼎於阼階下西面，如大、小斂，故知也。" }
      - { type: j, text: "乃奠，豆西上，綪。籩，蠃醢南，北上，綪。籩蠃醢南，闢醴酒也。" }
      - { type: z, text: "“乃奠”至“上綪”。○注“籩蠃”至“酒也”。○釋曰：雲“籩蠃醢南，闢醴酒也”者，如上所饌，則先饌脾析於西南，次北脾醢，次東葵菹，次南蠃醢，陳設要方，則四籩宜亦設於脾析，已南綪之為次。今不於脾析已南為次，而發蠃醢已南為次，故知闢醴酒。醴酒當設在脾析之南可知也。" }
      - { type: j, text: "俎二以成，南上，不綪，特鮮獸。成猶並也。不綪者，魚在羊東，臘在豕東。古文特為俎。" }
      - { type: z, text: "“俎二”至“鮮獸”。○注“成猶”至“為俎”。○釋曰：知俎二以並不綪者，若綪，則宜先設羊於西南，次北設豕，次東設魚，次南設臘。今於西南設羊，次北豕，以魚設於羊東，設臘於魚北，還從南為始，是不綪也。其鮮獸在北，北無偶，故云“特”也，是以鄭雲“不綪者魚在羊東，臘在豕東”也。" }
      - { type: j, text: "醴酒在籩西，北上。統於豆也。" }
      - { type: z, text: "“醴酒”至“北上”。○注“統於豆也”。○釋曰：雲“統於豆”者，豆即脾析也。以其雲“北上”，上謂二甒，醴酒繼豆言北上，故云統於豆也。" }
      - { type: j, text: "奠者出，主人要節而踴。亦以往來為節。奠由重北西，既奠，由重南東。" }
      - { type: z, text: "“奠者”至“而踴”。○注“亦以”至“南東”。○釋曰：自上已來，堂下設奠、徹奠皆雲“主人要節而踴”，注皆雲“往來為節”，此主人要節而踴，亦以往來為節。奠來時由重北而西，既奠由重南而東，此奠饌在輅之東，言由重北者，亦是由車前明器之北，鄉柩車西設之，設訖，由柩車南而來者，禮之常也。" }
      - { type: j, text: "甸人抗重，出自道，道左倚之。還重不言甸人。抗重言之者，重既虞將埋之，言其官，使守視之。抗，舉也。出自道，出從門中央也。不由闑東西者，重不反，變於恆出入。道左，主人位。今時有死者，鑿木置食其中，樹於道側，由此。" }
      - { type: z, text: "“甸人”至“倚之”。○注“還重”至“由此”。○釋曰：自此盡“徹者出踴如初”，論將葬重及車馬之等，以次出之事。雲“道左倚之”者，當倚於門東北壁。雲“還重不言甸人”者，上雲二人還重，不言甸人，至此乃言甸人也。雲“重既虞將埋之”者，《雜記》文。彼注云：“就所倚處埋之。”但天子九虞，諸侯七虞，大夫五虞，士三虞，未虞以前，以重主其神。虞所以安神，雖未作主，初虞其神即安於寢，不假重為神主。又士大夫無木主，明亦初虞即埋之也。雲“不由闑東西者，重不反，變於恆出入”者，恆出入則闑東闑西也。雲“道左，主人位”者，《檀弓》雲“重主道”，注云：“始死，未作主，以重主其神也。”則重主死者，故於主人之位埋之也。鄭雲“今時”以下者，引漢法，證重倚道左之事也。" }
      - { type: j, text: "薦馬，馬出自道，車各從其馬，駕於門外，西面而俟，南上。南上，便其行也。行者乘車在前，道、槁序從。" }
      - { type: z, text: "“薦馬”至“南上”。○注“南上”至“序從”。○釋曰：雲“南上”者，謂於門外之時南上。雲“便其行也”者，以其葬於國北，在路則南上，上者常在前，故云便其行也。雲“行者乘車在前，道槁序從”者，案下記雲：“乘車載旃，道車載朝服，槁車載蓑笠。”是序從也。" }
      - { type: j, text: "徹者入，踴如初。徹巾，苞牲，取下體。苞者，象既饗而歸賓俎者也。取下體者，脛骨象行，又俎實之終始也。士苞三個，前脛折取臂臑，後脛折取骼，亦得俎釋三個。《雜記》曰：“父母而賓客之，所以為哀。”" }
      - { type: z, text: "“徹者”至“下體”。○注“苞者”至“為哀”。○釋曰：雲“苞者，象既饗而歸賓俎者”也，案《雜記》文而言之。雲“取下體者，脛骨象行”者，以父母將行鄉壙，故取前脛後脛，下體行者以送之，故云象行也。雲“又俎實之終始也”者，此盛葬奠用少牢，其載牲體亦當與少牢同。案《少牢》載俎雲：“肩臂臑骼在兩端。”又云“肩在上”，以此言之，則肩臂臑在俎上端，為俎實之始，胳在俎下端，為俎實之終。今取此兩端脛骨，包以歸父母，直取脛骨為象行，又兩端為俎實之終始也。雲“土包三個”者，自上之差。案《檀弓》雲：“國君七個，遣車七乘，大夫五個，遣車五乘。”注云：“人臣賜車馬者，乃得有遣車。遣車之差，大夫五，諸侯七，則天子九。諸侯不以命數，喪數略也。個，謂所包遣奠牲體之數也。《雜記》曰：遣車視牢具。”彼注云：“言車多少，各如所包遣奠牲體之數也。然則遣車載所包，遣奠而藏之者與？遣奠，天子大牢包九個，諸侯亦大牢包七個，大夫亦大牢包五個，士少牢包三個，大夫以上乃有遣車。”以此而言，士無遣車，則所包者不載於車，直持之而已。士有一包，而云包三個，鄭又云個謂所包遣奠，則士一包之中有三個牲體，故云“前脛折取臂、臑，後脛折取骼”者。若然，大夫雲遣車五乘，包五個，則一包之中有五個，五五二十五，一大牢而為二十五體。則亦取下體，前脛取臂、臑，後脛取骼，三牲有九體，又就九體折分為二十五個，五包，包各五個。諸侯亦大牢而包七個，天子亦一大牢，又加以馬牲，牲別有三體，則十二體。就十二體中，細分為八十一個，九包，包各九個。大夫以上，皆不得全體，謂若《少儀》雲大牢則以“牛左肩臂臑折九個”之類，亦為不全體也。雲“亦得俎釋三個”者，羊俎，上注云“體不殊骨也”，其脾又不升，則骼別為一段在俎。今前脛折取臂、臑，其肩仍著胖為一段，後脛折取骼，仍有肫一節在俎，則羊俎仍有兩段在俎，豕則左胖，豚解為四段在俎。今前脛折取臂、臑，後脛折取骼，仍有四段在俎。若然，羊俎有二段，豕俎有四段，相通則二俎，俎有三段在，故得為俎釋三個。案《特牲》“俎釋三個”，注云：“為改饌於西北隅遺之。”則此奠雖不改，為饌西北隅留之，亦為分禱五祀也。引《雜記》者，案彼雲：曾子謂或人曰：“吾子不見大饗乎？夫大饗，既饗，卷三牲之俎，歸於賓館，父母而賓客之，所以為哀也。”注云：“既饗歸賓俎，所以厚之也。言父母家之主，今賓客之，是孝子哀親之去也。”取此者，以證此包牲歸父母，亦是賓客父母之事也。" }
      - { type: j, text: "不以魚臘。非正牲也。" }
      - { type: z, text: "“不以魚臘”。○注“非正牲也”。○釋曰：雲“非正牲也”者，正牲謂上三牲魚臘。非正牲，故不以魚臘載之，故云非正牲。" }
      - { type: j, text: "行器，目葬行明器在道之次。" }
      - { type: z, text: "“行器”。○注“目葬”至“之次”。○釋曰：包牲訖，明器當行鄉壙，故云“行器”。雲“目葬行明器”者，即下雲“茵包”已下是也，故云目葬行也。" }
      - { type: j, text: "茵、苞、器序從，如其陳之先後。" }
      - { type: z, text: "“茵包器序從”。○注“如其陳之先後”。○釋曰：此直雲“序從”者，序從即上文“器西南上茵包”已下是也。故此亦言茵包，以其為首故也。" }
      - { type: j, text: "車從。次器。" }
      - { type: z, text: "“車從”。○注“次器”。○釋曰：上陳明器訖，次列車以從明器，故云“次器”也。" }
      - { type: j, text: "徹者出，踴如初。於是廟中當行者唯柩車。" }
      - { type: z, text: "“徹者出踴如初”。○注“於是”至“柩車”。○釋曰：徹者，謂包牲訖，當徹去，所釋者出廟門，分禱五祀者，徹者出時，主人踴。雲“於是廟中當行者唯柩車”者，以其上文明器及車馬鄉壙者皆出，唯有柩車在廟未出，故云於是廟中當行者唯柩車也。" }
      - { type: j, text: "主人之史請讀賵，執筭從。柩東，當前束，西面。命毋哭。哭者相止也。唯主人、主婦哭。燭在右，南面。史北面請，既而與執筭西面於主人之前讀書釋筭。燭在右，南面，炤書便也。古文筭皆為筴。" }
      - { type: z, text: "“主人”至“南面”。○注“史北”至“為筴”。○釋曰：自此盡“滅燭出”，論讀賵、讀遣之事。經直雲“史請讀賵”，鄭知“史北面請”者，以其主人於車東，北面，所請者，請於主人，明史北面問之，故知史北面也。又知在“主人之前讀之”，對面當柩，故知在主人之前西鄉柩也。請訖，乃西面，請時及入時，書在前，筭在後，則史西面之時，筭在史南西面。今燭在史北，近史，炤書為便。若在左，則隔筭，不便也。" }
      - { type: j, text: "讀書，釋筭則坐。必釋筭者，榮其多。" }
      - { type: z, text: "“讀書釋筭則坐”。○注“必釋”至“其多”。○釋曰：讀書者，立讀之，敬也。釋筭者，坐為釋之，便也。雲“必釋筭者，榮其多”者，以其所賵之物言之，亦得今必釋筭，顯其數者，榮其多故也。" }
      - { type: j, text: "卒，命哭，滅燭，書與筭執之以逆出。卒，已。" }
      - { type: z, text: "“卒命”至“逆出”。○釋曰：言“逆出”，則入時長在前，出時長在後。燭言滅不言出者，以其燭已滅，不得言燭出，其人亦出可知。" }
      - { type: j, text: "公史自西方東面，命毋哭，主人、主婦皆不哭。讀遣，卒，命哭。滅燭，出。公史，君之典禮書者。遣者，入壙之物。君使史來讀之，成其得禮之正以終也。燭俠輅。" }
      - { type: z, text: "“公史”至“燭出”。○注“公史”至“俠輅”。○釋曰：知公史是君之典禮書者，以其言公史，故知君史。案《周禮》大史、小史皆掌禮，則諸侯史亦掌典禮可知。雲“成其得禮之正以終”者，以其死葬之以禮，是死者得禮之終事，故以君史讀而成之也。知“燭俠輅”者，上陳設葬奠，雲執燭夾輅，北面，故知也。" }
      - { type: j, text: "商祝執功布以御柩，執披。居柩車之前，若道有低仰傾虧，則以布為抑揚左右之節，使引者執披者知之。士執披八人。今文無以。" }
      - { type: z, text: "“商祝”至“執披”。○注“居柩”至“無以”。○釋曰：自此盡“杖乃行”，論柩車在道發行之事。雲“執功布”者，謂執大功之布粗者也。雲“以御柩執披”者，葬時乘人，故有柩車前引柩者，及在傍執披者，皆御治之，故云御柩執披也。雲“柩車之前，若道有低仰傾虧，則以布為抑揚左右之節”者，道有低，謂下阪時，道有仰，謂上阪時，傾虧謂道之兩邊，在車左右轍有高下。雲以布為抑揚左右之節者，道有低則抑下其布，使知下阪，道有仰則揚舉其布，使知上阪。雲左右者，謂道傾虧高下，則左右其布，使知道之有傾虧也。若東轍下，則下其布向東，西邊執披者持之；西轍下，則下其布向西，東邊執披者持之。若然，鄭雲“使引者執披者知之”者，執披者知其左右，引者知其上下也。知士執披八人者，案下記雲：“執披者旁四人。”注云：“前後左右各二人。”是士執披者八人也。" }
      - { type: j, text: "主人袒，乃行，踴無筭。袒，為行變也。乃行，謂柩車行也。凡從柩者，先後左右如遷於祖之序。" }
      - { type: z, text: "“主人”至“無筭”。○注“袒為”至“之序”。○釋曰：雲“乃行謂柩車行”者，經雲“乃行”，文承“主人袒”下，嫌主人行，故云乃行謂柩車行。以行處據柩為主，柩車行主人行可知，故舉柩車行也。雲“凡從柩者，先後左右如遷於祖之序”者，上遷於祖時，注云：“主人從者，丈夫由右，婦人由左。”以服之親疏為先後，各從其昭穆，男賓在前，女賓在後。此從柩向壙之序，一如遷於祖之序，故如之也。" }
      - { type: j, text: "出宮，踴，襲。哀次。" }
      - { type: z, text: "“出宮踴襲”。○注“哀次”。○釋曰：雲“哀次”者，以經雲“出宮踴襲”，以出宮有此踴襲。以出宮有此踴者，止為出宮大門外，有賓客次舍之處，父母生時接賓之所，故主人至此感而哀，此次是以有踴，踴訖，即襲，襲訖而行也。故《檀弓》雲：“哀次亦如之。”注云“次，他日賓客所受大門外舍也。孝子至此而哀”是也。" }
      - { type: j, text: "至於邦門，公使宰夫贈玄纁束。邦門，城門也。贈，送也。" }
      - { type: z, text: "“至於”至“纁束”。○注“邦門”至“送也”。○釋曰：雲“邦門”者，案《檀弓》雲：“葬於北方北首，三代之達禮也。”此邦門者，國城北門也。贈用玄纁束帛者，即是至壙窆訖，主人贈死者用玄纁束帛也。以其君物所重，故用之送終也。" }
      - { type: j, text: "主人去杖，不哭，由左聽命。賓由右致命。柩車前輅之左右也。當時止柩車。" }
      - { type: z, text: "“主人”至“致命”。○注“柩車”至“柩車”。○釋曰：此謂宰夫將致命，主人乃去杖，不哭，由柩車前輅之左右。若然，在廟，柩車南鄉，左則在東，此出國北門，柩車鄉北，左則在前輅之西也。賓由右致命，則在柩車之東矣。經直雲左右，鄭必知據“前輅左右”者，次柩車在廟門時，賓在柩車右，主人在柩車左，故知此亦當前輅左右也。雲“當時止柩車”者，下記雲：“唯君命，止柩於堩，其餘則否。”注云：“不敢留神。”明此宰夫致命時，柩車止也。" }
      - { type: j, text: "主人哭，拜稽顙。賓升，實幣於蓋，降。主人拜送，復位，杖，乃行。升柩車之前，實其幣於棺蓋之柳中，若親受之然。復位，反柩車後。" }
      - { type: z, text: "“主人”至“乃行”。○注“升柩”至“車後”。○釋曰：賓既致公贈命訖，主人乃哭拜稽顙，賓乃升車，實幣於棺之蓋中，載以之壙。上文在廟所贈之幣，皆奠於左服。此實於蓋中者，彼贈幣生死兩施，故奠左服。此贈專為死者，故實於蓋中，若親授之然。雲“復位反柩車後”者，上在廟位，在柩車東，此行道，故在柩車後也。" }
      - { type: j, text: "《儀禮註疏》" }
