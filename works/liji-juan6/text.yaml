# 禮記正義卷6（孔穎達疏）：j 為經文＋鄭玄注，z 為疏文。
sections:
  - id: juan6
    name: 正文
    blocks:
      - { type: j, text: "陸曰：“檀弓，魯人。檀，大丹反，姓也。弓，名。以其善於禮，故以名篇。”" }
      - { type: z, text: "正義曰：案鄭《目錄》雲：“名曰《檀弓》者，以其記人善於禮，故著姓名以顯之。姓檀名弓，今山陽有檀氏。此於《別錄》屬《通論》。”此《檀弓》在六國之時，知者，以仲樑子是六國時人，此篇載仲樑子，故知也。案子游譏司寇惠子廢適立庶，又《檀弓》亦譏仲子舍適孫而立庶子，其事同，不以子游名篇，而以《檀弓》為首者，子游是孔門習禮之人，未足可嘉，《檀弓》非是門徒，而能達禮，故善之，以為篇目。" }
      - { type: j, text: "公儀仲子之喪，檀弓免焉。故為非禮，以非仲子也。《禮》：“朋友皆在他邦，乃袒免。”○公儀仲子，公儀，氏；仲子，字；魯之同姓也，其名未聞。免音問，注同，以布廣一寸，從項中而前，交於額上，又卻向後繞於髻。袒音但。仲子舍其孫而立其子。此其所立非也。公儀蓋魯同姓。《周禮》適子死，立適孫為後。○舍音舍，下皆同。適，多歷反，下皆同。《檀弓》曰：“何居？我未之前聞也。”居，讀為姬姓之姬，齊魯之間語助也。前猶故也。○居音毆，下同。趨而就子服伯子於門右，曰：“仲子舍其孫而立其子，何也？”去賓位，就主人兄弟之賢者而問之。子服伯子，蓋仲孫蔑之玄孫子服景伯。蔑，魯大夫。○蔑音芒結反。伯子曰：“仲子亦猶行古之道也。昔者文王舍伯邑考而立武王，微子舍其孫腯而立衍也。夫仲子亦猶行古之道也。”伯子為親者隱耳，立子非也。文之立武王，權也。微子適子死，立其弟衍，殷禮也。○腯，徐本作遁，徒本反，又徒遜反。衍，以善反。為，於偽反，下“為晉”、“禮為”、“為師”同。子游問諸孔子，孔子曰：“否。立孫。”據周禮。○孔子曰否，絕句。" }
      - { type: z, text: "“公儀”至“立孫”。正義曰：此一節論仲子廢適立庶，為檀弓所譏之事。公儀仲子而身今喪亡，檀弓與之為友，又非處他邦，為之著免，故為重服。譏其失禮。所以譏者，仲子適子既死，舍其適孫而立其庶子。檀弓居在賓位而言曰“何居”？居是語辭，言仲子舍適孫立庶子，是何道理乎？“我未之前聞”，前猶故也。言我未聞故昔有此事。既言之後，乃從賓位趍而就子服伯子於門右，問之曰：“仲子舍其適孫而立庶子，是何禮也？”伯子為仲子隱諱，乃言曰：“仲子雖生周世，猶上行古之道也。”言“亦”者，餘人有行古之道，仲子亦如餘人，故云“亦”也。即引文王、微子之事，為古之道也。更繼之雲“仲子亦猶行古之道”，與文王、微子無異。子游以此為疑，問諸孔子。孔子以仲子周人，當從周禮，不得立庶子，當立孫也。○注“禮朋友”至“袒免”。○正義曰：知者，《喪服記》雲：“若他邦來，還家而無主，猶為之免。”故鄭注云：“歸有主人乃已，明無主猶袒免也。若朋友俱在家，則吊服加麻。加麻者，素弁上加緦之環絰，若一在一否亦然。”知者，以雲“皆在他邦，乃祖免”，明不皆在者則否。○注“公儀蓋魯同姓”。○正義曰：知者，案《史記》魯相公儀休，此雲子服伯子是魯人，故疑魯同姓也。知同姓者，以《春秋》有公鳥、公若、公儀，同稱公，故知同姓也。○注“去賓”至“大夫”。正義曰：案賓位之法，隨主人而變。小斂之前，主人未忍在主位，有事在西階下，則賓亦入門西，吊於西階下，故《士喪禮》，君使人襚，主人拜送，拜賓，即位西階下東面。鄭雲：“未忍即主人位也”。小斂之後，屍則出堂廉，然後有飾主人位，則在阼階下西面，賓吊者入門東，於東階下吊也。故《士喪禮》小斂訖，“故士舉，男女奉屍侇於堂。主人降自西階，即位踴，襲絰於序東”。鄭雲：“即位踴，東方位也。”則眾主人不接賓，發初在東耳。而檀弓之來者，當在小斂之前，初於西階行譏，吊而主人未覺，後乃趍鄉門右，問伯子焉。必知小斂前者，以仲子初喪即正適庶之位故也。未小斂而著免者，故為非禮之吊，亦異常也。然則子游之吊惠子，是小斂後也。故服衰而在門東，故鄭雲：“大夫家臣，位在賓後。”又云：“在門內北面。”雲“子服伯子，蓋仲孫蔑之玄孫子服景伯”者，案《世本》，獻子蔑生孝伯，孝伯生惠伯，惠伯生昭伯，昭伯生景伯。雲“蓋”者，彼雲子服景伯，此雲子服伯子，不同，故云“蓋”。景是諡，伯是字也。○注“文王之立武王，權也”。○正義曰：案文王在殷之世，殷禮：自得舍伯邑考而立武王。而言權者，殷禮若適子死，得立弟也。今伯邑考見在而立武王，故云“權”也。故《中候》雲：“發行誅紂，且弘道也，是七百年之基驗也。”" }
      - { type: j, text: "事親有隱而無犯，隱，謂不稱揚其過失也。無犯，不犯顏而諫。《論語》曰：“事父母，幾諫。”左右就養無方，左右，謂扶持之。方，猶常也。子則然，無常人。○左右，徐上音佐，下音佑，今並如字，下同。養，以尚反，下同。服勤至死，致喪三年。勤，勞辱之事也。致謂戚容稱其服也。凡此以恩為制。○稱，尺證反。事君有犯而無隱，既諫，人有問其國政者，可以語其得失，若齊晏子為晉叔向言之。○語，魚據反，又如字。向，香亮反；叔向，羊舌肸。左右就養有方，不可侵官。服勤至死，方喪三年。方喪，資於事父。凡此以義為制。事師無犯無隱，左右就養無方，服勤至死，心喪三年。心喪，戚容如父而無服也。凡此以恩義之間為制。" }
      - { type: z, text: "“事親”至“三年”。○正義曰：此一節論事親事君及事師之法，臣子著服之義，各依文解之。○注“無犯”至“幾諫”。○正義曰：據親有尋常之過，故無犯。若有大惡，亦當犯顏，故《孝經》雲“父有爭子，則身不陷於不義”是也。《論語》曰：“事父母幾諫。”是尋常之諫也。○注“左右”至“常人”。○正義曰：凡言“左右”，者據僕從之臣，故立有左右僕從之官位。此左右言“扶持之”，謂子在親左相右相而奉持之。雲“子則然，無常人”，然猶如是也。但是子則須如是，或左右奉持，不常遣一人在左，一人在右，故云“無常人”。○注“勤勞”至“為制”。○正義曰：言“服勤”者，謂服持勤苦勞辱之事。故云“致謂戚容稱其服也”者，致之言至也，謂哀情至極而居喪禮，故云“致謂戚容稱其服也”。上《曲禮》雲：“五十不致毀。”與此同。雲“凡此以恩為制”者，凡上三事對下君與師，故云“以恩為制”。○注“既諫”至“言之”。○正義曰：知既諫而後，人有問其國政，可以語其得失者，昭三年《左傳》雲：“晏子謂景公曰：‘小人近市，朝夕得所求。’景公曰：‘子近市，何貴何賤？’於是景公繁於刑，有鬻踴者。故對曰：‘踴貴屨賤。’”諫景公重刑。後及其聘晉，與叔向言齊國之政將歸陳氏，景公厚斂焉。陳氏厚施焉。是既諫得言君之過。若其未諫而言君過，則不可，故昭三年子大叔如晉，張趯與子大叔言云：“火星中而寒暑退。此其極也，能無退乎？”未曾諫君，輒言君德之退，故傳雲：“張趯有知，其由在君子之後乎！”是其被譏也。魯昭公取同姓，孔子不仕昭公，既先諫，所以《論語》稱孔子為昭公諱而稱丘也過者，聖人含弘勸獎，攬過歸己，非實事也。若史策書，理則不一，若其良史，直筆不隱君過，董狐書趙盾弒君，及丹楹刻桷之屬是也。若忠順臣，則諱君親之惡者，《春秋》闢諱皆是，故僖元年《左傳》雲：“諱國惡，禮也。”○注“不可侵官”。○正義曰：案成十六年《左傳》雲，晉楚戰於鄢陵，時欒書將中軍，欒針為晉侯車右，晉侯陷於淖。“欒書將載晉侯，針曰：‘書退！侵官，冒也。失官，慢也。離局，奸也。’”時欒書棄元帥之任，欲載晉侯，是侵官也。故云“不可侵官”。此謂君有平常小事，若有危難當致死，故《論語》雲：“事君能致其身。”○注“方喪，資於事父”。○正義曰：方謂比方也，謂比方父喪禮以喪君，故云“資於事父”。資，取也。取事父之喪禮以喪君，但居處飲食同耳，不能戚容稱其服。○注“心喪”至“為制”。○正義曰：凡親有冥造之功，又有生育之惠，故懷哀戚之痛，同君衰服之限。君則徒有榮身顯親之事，而無冥造生育之功，故唯服粗衰，表盡哀戚。師則以恩愛成已，有同於親，故不為制服，故云“心喪，戚容如喪父”，為恩愛成己故也。雲“而無服”者，既無親之冥造，又無君之榮顯，故無服也。雲“以恩義之間為制”者，無犯是同親之恩，無隱是同君之義，兼有親恩君義，故言“恩義之間為制”。但子之事親，本主恩愛，不欲聞親有過惡，故有隱，不欲違親顏色，故無犯。臣之事君，利在功義，若有惡不諫，社稷傾亡，故有犯。君之過惡，眾所同知，故云“無隱”也。" }
      - { type: j, text: "季武子成寢，武子，魯公子季友之曾孫季孫夙。杜氏之葬在西階之下，請合葬焉，許之入宮而不敢哭。武子曰：“合葬，非古也。自周公以來，未之有改也。自見夷人冢墓以為寢，欲文過。○葬，徐才浪反，又如字。合如字，徐音閤，後“合葬”皆同。文如字，徐音問。吾許其大而不許其細，何居？”命之哭。記此者，善其不奪人之恩。" }
      - { type: z, text: "“季武”至“之哭”。○正義曰：此一節明不奪人之恩，兼論夷人冢墓為寢，欲文過之事，各隨文解之。○注“武子”至“孫夙”。○正義曰：案《世本》公子友生齊仲，齊仲生無逸，無逸生行父，行父生夙。夙是公子友曾孫也。○注“自見”至“文過”。○正義曰：言“文過”者，武子自雲，合葬之禮，非古昔之法，從周公以來，始有合葬，至今未改。我成寢之時，謂此冢墓是周公以前之事，不須合葬，故我夷平之以為寢。不肯服理，是文飾其過。先儒皆以杜氏喪從外來，就武子之寢合葬，與孔子合葬於防同。又案《晏子春秋》景公成路寢之臺，逢於阿盆成逆後喪，並得附葬景公寢中。與此同也。○“吾許”至“何居”。○“吾許其大”者，聽之將喪而入葬，是許其大。“不許其細”，哭是細也。“何居”，“居”，語辭。既許其大，而不許其細，是何道理，故云“何居”。" }
      - { type: j, text: "子上之母死而不喪，子上，孔子曾孫，子思伋之子，名白，其母出。○不喪，如字，下同，徐息浪反，下放此。伋音急，子思名也，孔子之孫。門人問諸子思曰：“昔者子之先君子喪出母乎？”曰：“然。”禮，為出母期。父卒，為父後者不服耳。○期，居宜反，本又作期，後放此。“子之不使白也喪之，何也？”子思曰：“昔者吾先君子無所失道，道隆則從而隆，道汙則從而汙。汙猶殺也。有隆有殺，進退如禮。○隆，力中反，盛也。汙音烏，下同。殺，所戒反，又所例反，下同。伋則安能？自予不能及。○予，羊許反，許也；一雲我也，又音餘。為伋也妻者，是為白也母。不為伋也妻者，是不為白也母。故孔氏之不喪出母，自子思始也。記禮所由廢，非之。" }
      - { type: z, text: "“子上”至“始也”。○正義曰：此一節論子上不喪出母之事，各隨文解之。○注“禮為”至“服耳”。○正義曰：案《喪服》齊衰杖期章：“出妻之子為母。”又云：“出妻之子為父後者，則為出母無服。傳雲，與尊者為一體，不敢服其私親。”是也。子思既在，子上當為出母有服，故門人疑而問之。雲“子之先君子”，謂孔子也，令子喪出母乎？子思曰：“然。”然猶如是也，言是喪出母故也。伯魚之母被出，死，期而猶哭，是喪出母也。○“子思”至“而汙”。○道猶禮也，言吾之先君子無所失道，道有可隆，則從而隆。謂父在，為出母宜加隆厚，為之著服。“道汙”者，汙猶殺也，若禮可殺則從而殺。謂父卒，子為父後，上繼至尊，不敢私為出母禮。當減殺，則不為之著服。“伋則安能”者，子思自以才能淺薄，不及聖祖，故云伋則何能。鄭雲：“自予不能及，予猶許也。自許不能及也。”" }
      - { type: j, text: "孔子曰：“拜而後稽顙，頹乎其順也。此殷之喪拜也。頹，順也。先拜賓，順於事也。○顙，素黨反，稽顙，觸地無容。頹，徒回反。稽顙而後拜，頎乎其至也。此周之喪拜也。頎，至也。先觸地無容，哀之至。○頎音懇，惻隱之貌，又音畿。觸音昌欲反。三年之喪，吾從其至者。”重者尚哀戚，自期如殷可。" }
      - { type: z, text: "“孔子”至“至者”。○正義曰：此一節論殷、周喪拜之異也。拜者，主人孝子拜賓也。稽顙者，觸地無容也，頹然不逆之意也。拜是為賓，稽顙為己，前賓後已，各以為頹然而順序也。○“稽顙而後拜，頎乎其至也”者，頎，惻隱貌也。先觸地無容，後乃拜賓也。是為親痛深貌，惻隱之至也。○“三年之喪，吾從其至”者，孔子評二代所拜也。至者，謂先稽顙後拜也。重喪，主貌惻隱，故三年喪則從其頎至者也。○注“重者”至“殷可”。○正義曰：三年之喪，尚哀戚則從周。自期以下如殷可。此經直雲“拜而後稽顙”，“稽顙而後拜”，鄭知拜而後稽顙是“殷之喪拜”，稽顙而後拜是“周之喪拜”者，於孔子所論，每以二代相對，故下檀弓雲：“殷人既封而吊，周人反哭而吊，殷以愨，吾從周。”又云：“殷朝而殯於祖，周朝而遂葬。”皆以殷、周相對，故知此亦殷、周相對也。知並是殷、周喪拜者，此雲“三年之喪，吾從其至”，明非三年喪者，則從其順，故知並是喪拜。但殷之喪拜，自斬衰以下，緦麻以上，皆拜而後稽顙，以其質故也。周則杖期以上，皆先稽顙而後拜，不期杖以下，乃作殷之喪拜。鄭知殷先拜而後稽顙，周先稽顙而後拜者，以孔子所論皆先殷而後周；今“拜而後稽顙”，文在其上，故為殷也；“稽顙而後拜”，文在其下，故為周也。且下《檀弓》雲，秦穆公使人吊公子重耳，重耳稽顙而不拜，示不為後也。若為後，當稽顙而後拜也。重耳既在周時，明知先稽顙而後拜者。若然，《士喪禮》既是周禮，所以主人拜稽顙，似亦先拜而後稽顙者，《士喪禮》雲“拜稽顙”者，謂為拜之時先稽顙。其《喪大記》每拜稽顙者，與《士喪禮》同。案《晉語》雲，秦穆公吊重耳，重耳再拜不稽顙。與下篇重耳稽顙不拜文異者，《國語》之文，不可用此稽顙而後拜。即《大祝》“兇拜”之下，鄭注：“稽顙而後拜，謂三年服者。”此拜而後稽顙，即《大祝》吉拜。鄭注云：“謂齊衰不杖以下者。”鄭知兇拜是三年服者，以《雜記》雲：“三年之喪，以其喪拜。”喪拜即兇拜。鄭又云：“吉拜，齊衰不杖以下。”則齊衰杖者，亦用兇拜者。知齊衰杖用兇拜者，以《雜記》雲：“父母在，為妻不杖不稽顙。”明父母歿，為妻杖得稽顙也。是知杖齊衰得為兇拜。若然，《雜記》雲：“三年之喪，以其喪拜。非三年之喪，以吉拜。”則杖期以下，皆用吉拜。今此杖期得用兇拜者，《雜記》所云，大判而言，雖有杖期，總屬三年之內。熊氏以為《雜記》所論，是拜問拜賜，故杖期亦屬吉拜。必知然者，以鄭注《大祝》“兇拜”雲“三年服者”，是用《雜記》之文，解以兇拜之義，則拜賓、拜問、拜賜不得殊也。且《雜記》“問”與“賜”與於“拜”文，上下不相接次，不可用也。《周禮·大祝》“一曰稽首”，鄭雲：“頭至地。”案《中候》：“我應雲王，再拜稽首。”鄭雲：“稽首，頭至手也。”此即臣拜君之拜，故《左傳》雲：“天子在，寡君無所稽首。”大夫於諸侯亦稽首，故下《曲禮》雲：“大夫之臣不稽首。”則大夫於君得稽首。“二曰頓首”，鄭曰：“頭叩地不停留也。”此平敵以下拜也，諸侯相拜則然，以其不稽首，唯頓首也。“三曰空首”，鄭雲：“頭至手，所謂拜手也。”以其與拜手是一，故為頭至手也。此答臣下之拜，其敵者既用頓首，故知不敵者用空首。“四曰振動”，鄭雲：“戰慄變動之拜。”謂有敬懼，故為振動，故《尚書·泰誓》火流為烏、王動色變是也。“五曰吉拜”者，謂先作頓首拜，後作稽顙，故鄭康成注與頓首相近。“六曰兇拜”者，既重於吉拜，當先作稽顙，而後稽首。“七曰奇拜”，鄭大夫雲：“奇拜謂一拜也。”鄭康成雲：“一拜答臣下。”然《燕禮》、《大射》公答再拜者，為初敬之，為賓尊之，故再拜。燕末無筭爵之後，唯止一拜而已。“八曰褒拜”者，鄭大夫雲：“褒讀為報，報拜，再拜也。”鄭康成雲：“再拜，拜神與屍。”“九曰肅拜”者，鄭司農雲：“但俯下手，今時撎是也。介者不拜。”引成十六年“為事故，敢肅使者”。此禮拜，體為空首一拜而已，其餘皆再拜也。其肅拜或至再，故成十六年晉郤至三肅使者。此肅又謂婦人之拜，故《少儀》雲“婦人吉事，雖有君賜，肅拜”是也。" }
      - { type: j, text: "孔子既得合葬於防，言既得者，少孤不知其墓。○少，詩召反，下文同。曰：“吾聞之，古也墓而不墳。墓謂兆域，今之封塋也。古謂殷時也。土之高者曰墳。○墳，扶雲反。今丘也，東西南北之人也，不可以弗識也。”於是封之，崇四尺。東西南北，言居無常處也。聚土曰封，封之，周禮也。《周禮》曰：“以爵等為丘封之度。”崇，高也。高四尺，蓋周之士制。○識，式志反，又如字。處，昌慮反。之度，本又作“之數”。孔子先反，當脩虞事。門人後。雨甚，至。後，待封也。孔子問焉，曰：“爾來何遲也？”曰：“防墓崩。”言所以遲者，脩之而來。○防墓，防地之墓也。庾雲：“防衛墓崩。”孔子不應。以其非禮。○應，應對之應。三，三言之，以孔子不聞。○三，息暫反，又如字。孔子泫然流涕曰：“吾聞之，古不脩墓。”脩，猶治也。○泫，胡犬反。涕音體。" }
      - { type: z, text: "“孔子”至“修墓”。○正義曰：此一節論古者不修墓之事，各依文解之。○天子之墓一丈，諸侯八尺，其次降差以兩。○“今丘也，東西南北之人也，不可以弗識也”。○今既東西南北，不但在鄉，若久乃歸還，不知葬之處所，故云不可以不作封墳，記識其處。○注“《周禮》”至“士制”。○正義曰：引《周禮·冢人》，雲“高四尺，蓋周之士制”者，其父梁紇雖為大夫，《周禮》公侯伯之大夫再命，與天子中士同，雲“周之士制”者，謂天子之士也。○“曰，防墓崩”。○防地之墓新始蛔芰，遇甚雨而崩。庾蔚雲：“防守其墓，備擬其崩。”若如庾之言，墓實不崩，鄭何以言“修之而來”？孔子何以言“古不修墓”？違經背注，妄說異同，非也。○“孔子泫然流涕”。○自傷修墓違古，致令今崩，弟子重修，故流涕也。" }
      - { type: j, text: "孔子哭子路於中庭。寢中庭也。與哭師同，親之。有人吊者，而夫子拜之。為之主也。既哭，進使者而問故。使者，自衛來赴者。故，謂死之意狀。○使，色吏反，下及注同。使者曰：“醢之矣。”時衛世子蒯聵篡輒而立，子路死之。醢之者，示欲啗食以怖眾。○醢音海。蒯，苦怪反。聵，五怪反。蒯聵，衛靈公之太子出公輒之父莊公也。篡輒，初患反；輒，出公名也。啗，本又作“啖”，待敢反。怖，普故反，遂命覆醢。覆，棄之。不忍食。○覆，芳服反，注同。" }
      - { type: z, text: "“孔子”至“覆醢”。○正義曰：此一節論師資之恩，兼明子路死之意狀。○注“寢中”至“親之”。○正義曰：下文雲“師，吾哭諸寢”，今“哭子路於中庭”，故云“與哭師同，親之”。若其不親，當哭於寢門外，與朋友同，故下雲“朋友，哭諸寢門外”。案《奔喪》雲“師於廟門外”者，謂周禮也。下文據殷法也。○注“故，謂死之意狀”。○正義曰：案哀十五年《左傳》雲：“孔子聞衛亂，曰：‘柴也其來，由也其死矣。’”則是預知，所以進使者問故者，以子路忠而好勇，必知其死難，但不知其死之委曲，更問之也。○注“時衛”至“怖眾”。○正義曰：案哀十五年《左傳》雲，蒯瞶潛入孔悝之家，與伯姬“迫孔悝於廁，強盟之，遂劫以登臺。子路入，逐之至臺下，且曰：‘大子無勇，若燔臺半，必舍孔叔。’大子聞之，懼，下石乞、盂黶敵子路，以戈擊之，斷纓。子路曰：‘君子死，冠不免。’”○注云：“不使冠在地。遂絕纓而死。”" }
      - { type: j, text: "曾子曰：“朋友之墓，有宿草而不哭焉。”宿草，謂陳根也。為師心喪三年，於朋友期可。○期音期。" }
      - { type: z, text: "“曾子”至“哭焉”。○正義曰：曾子，孔子弟子，姓曾名參，字子輿，魯人也。宿草，陳根也。草經一年陳，根陳也。朋友相為哭一期，草根陳，乃不哭也。所以然者，朋友雖無親，而有同道之恩。言朋友期而猶哭者，非謂在家立哭位，以終期年。張敷雲：“謂於一成之內，如聞朋友之喪，或經過朋友之墓及事故須哭，如此則哭焉。若期之外，則不哭也。”" }
      - { type: j, text: "子思曰：“喪三日而殯，凡附於身者，必誠必信，勿之有悔焉耳矣。三月而葬，凡附於棺者，必誠必信，勿之有悔焉耳矣。言其日月，欲以盡心脩備之。附於身，謂衣衾。附於棺，謂明器之屬。○衾音欽。喪三年以為極亡，去已久遠，而除其喪。○以為極亡，並如字；極，已也，徐紀力反；王以“極”字絕句，亡作“忘”，向下讀；孫依鄭作“亡”，而如王分句。則弗之忘矣。則之言曾。故君子有終身之憂，念其親。而無一朝之患，毀不滅性。故忌日不樂。”謂死日，言忌日不用舉吉事。○樂如字，又音洛。" }
      - { type: z, text: "“子思”至“不樂”。○正義曰：此一節論喪之初死及葬送終之具，須盡孝子之情，及思念父母不忘之事，今各隨文解之。“三日而殯”者，據大夫士禮，故云三日也。○“凡附於身”者，謂衣衾也。夫祀必求仁者之粟，故送終之物，悉用誠信，必令合禮，不使少有非法，後追悔咎。“焉耳矣”者，助句之辭。○“三月而葬，凡附於棺者，必誠必信，勿之有悔焉耳矣”者，三月而葬，亦大夫士禮也。附謂明器之屬，亦當必誠信，不追悔也。○注“言其”至“之屬”。○正義曰：此“言其日月，欲以盡心修備之”，鄭意但言凡附身附棺自足，又更雲“三日”、“三月”，言棺中物少者，三日之期，家計可使量度，則必中，棺外物多，三月之賒，思忖必就，故言日月，欲見宜慎也。雲“謂明器之屬”者，案《既夕禮》除明器之外，有用器弓矢、耒耜、兩敦、兩杅、盤匜、燕樂器、甲、胄、幹、笮、杖、笠、翣等，故云“之屬”也。○“喪三年以為極亡”，○此亦子思語辭也。言服親之喪，以經三年，以為極亡，可以棄忘，而孝子有終身之痛，曾不暫忘於心也。注云“則之言曾”，故君子有終竟己身，恆慘念親。此則是不忘之事。雖終身念親，而不得有一朝之間有滅性禍患，恐其常毀，故唯忌日不為樂事，他日則可，防其滅性故也。所以不滅性者，父母生己，欲其存寧，若滅性，傷親之志，又身已絕滅，無可祭祀故也。○注“謂死”至“吉事”。○正義曰：下篇子卯為人君忌日，恐此忌日亦為子卯，故云“謂死日”也。言“忌”者，以其親亡忌難，吉事不舉之。" }
      - { type: j, text: "孔子少孤，不知其墓。孔子之父郰叔梁紇與顏氏之女徵在野合而生孔子，徵在恥焉，不告。○郰，側留反，又作鄒。紇，恨發反，徐胡切反，又胡沒反。殯於五父之衢，欲有所就而問之。孔子亦為隱焉，殯於家，則知之者無由怪己，欲發問端。五父，衢名，蓋郰曼父之鄰。○父音甫，注及下同。衢，求於反。為如字，又於偽反。曼音萬。人之見之者，皆以為葬也。見柩行於路。其慎也，蓋殯也。慎，當為引，禮家讀然，聲之誤也。殯引，飾棺以輤，葬引，飾棺以柳翣。孔子是時以殯引，不以葬引，時人見者，謂不知禮。○慎，依注作引，羊刃反。輤，七見反。翣，所甲反。○問於郰曼父之母，然後得合葬於防。曼父之母，與徵在為鄰，相善。○鄰有喪，舂不相；裏有殯，不巷歌。皆所以助哀也。相，謂以音聲相勸。○相，息亮反，注同。喪冠不緌。去飾。○緌，本又作綏，同，耳佳反。去，起呂反。" }
      - { type: z, text: "“孔子”至“於防”。○正義曰：此一節論孔子訪父墓之事。雲孔子既少孤失父，其母不告父墓之處。今母既死，欲將合葬，不知父墓所在，意欲問人，故若殯母於家，則禮之常事，他人無由怪己。故殯於五父之衢，欲使他人怪而致問於己。外人見柩行路，皆以為葬。但葬引柩之時，飾棺以柳翣，其殯引之禮，飾棺以輤。當夫子飾其所引之棺以輤，故云其引也蓋殯也。殯不應在外，故稱“蓋”，為不定之辭。於時郰曼父之母，素與孔子母相善，見孔子殯母於外，怪問孔子。孔子因其所怪，遂間郰曼父之母，始知父墓所在，然後得以父母屍柩合葬於防。○注“孔子”至“不告”。○正義曰：按《史記·孔子世家》雲：“叔梁紇與顏氏女野合而生孔子。”鄭用《世家》之文，故注言“野合”，不備於禮也，若《論語》雲：“先進於禮樂，野人也。及野哉！由也。”非謂草野而合也。但徵在恥其與夫不備禮為妻，見孔子知禮，故不告。言“不知其墓”者，謂不委曲適知柩之所在，不是全不知墓之去處。其或出辭入告，總望本處而拜。今將欲合葬，須正知處所，故云“不知其墓”。今古不知墓處，於事大有，而講者喧喧，競為異說，恐非經記之旨。案《家語》雲：“叔梁紇年餘七十無妻，顏父有三女。顏父謂其三女曰：‘鄒大夫身長七尺，武力絕倫，年餘七十，誰能與之為妻？’二女莫對，徵在進曰：‘從父所制，將何問焉？’父曰：‘即爾能矣。’遂以妻之，為妻而生孔子，三歲而叔梁紇卒。”王肅據《家語》之文以為《禮記》之妄。又《論語緯·撰考》雲：“叔梁紇與徵在禱尼丘山，感黑龍之精以生仲尼。”今鄭雲“叔梁紇與顏氏之女徵在野合”，於《家語》文義亦無殊，何者？七十之男，始取徵在，灼然不能備禮，亦名野合。又徵在幼少之女而嫁七十之夫，是以羞慚，不能告子。又叔梁紇生子三歲而後卒，是孔子少孤。又與《撰考》之文禱尼丘山而生孔子，於野合之說，亦義理無妨，鄭與《家語》、《史記》並悉符同。王肅妄生疑難，於義非也。○注“慎當”至“知禮”。○正義曰：挽柩為引，無名慎者，以慎、引聲相近，故云“慎”當為引。雲“禮家讀然”者，“然”猶如是也，言禮家讀如是引字。故《大司徒》雲：“大喪屬其六引。”是讀引也。雲“殯引，飾棺以輤”者，案《雜記》雲，諸侯行而死於道，其輤有裧，緇布裳惟。輤為赤色，大夫布裳帷，士葦蓆以為屋，蒲席以為裳帷。大夫以下雖無輤，取諸侯輤同名，故飾棺以輤。雲“葬引，飾棺以輤”者，案《喪大記》雲，君龍帷、黼荒、黼翣二、黻翣二、畫翣二、大夫畫帷、畫荒、黻翣二、畫翣二、士布帷，布荒、畫翣二。在上曰荒，在旁曰帷，總謂之柳，故云“飾棺以柳翣”。" }
      - { type: j, text: "有虞氏瓦棺，始不用薪也。有虞氏上陶。○陶，大刁反。夏后氏堲周，火熟曰堲，燒土冶以周於棺也。或謂之土周，由是也。《弟子職》曰：“右手摺堲。”○即周，本又作堲，同，子栗反，又音稷，注下同。何雲：“冶土為磚，四周於棺。”燒，叔招反。折，之設反，《管子》雲：“左手執燭，右手摺堲。”即，燭頭燼也。《弟子職》，其篇名。殷人棺槨，槨，大也。以木為之，言槨大於棺也。殷人上梓。○棺音官。槨音郭。梓音子。周人牆置翣。牆，柳衣也。凡此言后王之制文。○牆，在良反。周人以殷人之棺槨葬長殤，以夏后氏之堲周葬中殤、下殤，以有虞氏之瓦棺葬無服之殤。略未成人。○長殤，丁丈反，下式羊反；十六至十九為長殤，十二至十五為中殤，八歲至十一為下殤，七歲已下為無服之殤，生未三月不為殤。" }
      - { type: z, text: "“有虞”至“之殤”。○正義曰：此一節論棺槨所起及用棺槨之事，各隨文解之。○注“始不”至“上陶”。○正義曰：案《易·下系辭》雲：“古之葬者，厚衣之以薪，葬之中野，不封不樹，喪期無數。後世聖人易之以棺槨，蓋取諸《大過》。”《大過》者，巽下兌上之卦。初六在巽體，巽為木，上六位在已，已當巽位。巽又為木，二木在外，以夾四陽。四陽互體為二乾，乾為君為父，二木夾君父，是棺槨之象。今虞氏既造瓦棺，故云“始不用薪”。然虞氏瓦棺，則未有槨也，《系辭》何以雲“後世聖人易之以棺槨”？連言“槨”者？以後世聖人其文開廣，遠探殷、周。而言喪期，有虞氏則然，故《尚書》雲：“三載，四海遏密八音。”雲“有虞氏上陶”者，案《考工記》陶人造瓦器，故引之證瓦棺。○注“火熟”至“折堲”。○正義曰：“火熟“者，以《弟子職》雲：“折燭之炎燼，名之曰堲。”故知堲是火熟者。雲“燒土冶以周於棺也”者，謂鑿土為陶冶之形，大小得容棺，故云“燒土冶以周於棺”也。雲“或謂之土周，由是也”者，《曾子問》雲：“下殤土周葬於園。”雲“由是”者，燒土周棺，得喚作土周。引《弟子職》者，證火熟曰堲之意。案《管子書》有《弟子職》篇，雲“左手秉燭，右手正堲”。鄭雲：“折堲者，即是正除之義。”○注“槨大”至“上梓”。○正義曰：槨聲與寬廓相近，故云“大於棺”也。“殷人上梓”，亦《考工記》文，引之以證槨也。《考工記》又云：“夏后氏上匠。”於“堲周”，不引之者，以匠無所不為，非獨聖周而已，故不引也。《考工記》又云：“周人上輿。”輿非牆之事，故於“周人牆置翣”亦不引之也。○注“牆柳”至“制文”。○正義曰：案《喪大記注》雲：“在旁曰帷，在上曰荒。”帷荒所以衣柳，則以帷荒之內木材為柳，其實帷荒及木材等總名曰柳。故《縫人》雲：“衣翣柳之材。”注云：“柳之言聚，諸飾之所聚。”是帷荒總稱柳也。雲“凡此言后王之制文”者，“凡”謂虞、夏、殷、周。有虞氏唯有瓦棺，夏后氏瓦棺之外加堲周，殷則梓棺替瓦棺，又有木為槨替堲周，周人棺槨，又更於槨傍置柳、置翣扇，是后王之制，以漸加文也。夏言“後”者，《白虎通》雲：“以揖讓受於君，故稱後。殷、周稱人者，以行仁義，人所歸往，故稱人。”夏對殷、周稱人，故言後，見受之於君。虞則不對殷、周。自五帝之內，雖受於君，不須稱後也。" }
      - { type: j, text: "夏后氏尚黑，以建寅之月為正，物生色黑。○正者徵，下同，又如字。大事斂用昏，昏時亦黑。此大事謂喪事也。○斂，力驗反，下皆同。戎事乘驪，戎，兵也。馬黑色曰驪。《爾雅》曰：“騋，牝驪，牡玄。”○驪，力知反，徐郎志反。純黑色馬。騋音來，馬七尺已上為騋。牡用玄。玄，黑類也。殷人尚白，以建醜之月為正，物牙色白。大事斂用日中，日中時亦白。戎事乘翰，翰，白色馬也。《易》曰：“白馬翰如。”○翰，字又作鶾，胡旦反，又音寒。牲用白。周人尚赤，以建子之月為正，物萌色赤。○萌，亡耕反。大事斂用日出，日出時亦赤。戎事乘騵，騵，騮馬，白腹。○騵音原。騮，力求反，赤馬，黑鬛尾。牲用騂。騂，赤類。○騂，息營反，徐呼營反，純赤色也。一雲赤黃色。" }
      - { type: z, text: "“夏後”至“用騂”。○正義曰：此一節論三代正朔所尚色不同，各依文解之。○夏尚黑，殷尚白，周尚赤，此之謂茸艹，故《書傳略說》雲：“天有茸艹，物有三變，故正色有三。天有三生三死，故土有茸荃，王特一生死。”又《春秋緯·元命苞》及《樂緯·稽耀嘉》雲：“夏以十三月為正，息卦受泰。”注云：“物之始，其色尚黑，以寅為朔。”“殷以十二月為正，息卦受泰。”注云：“物之牙，其色尚白，以雞鳴為朔。”“周以十一月為正，息卦受復，其色尚赤，以夜半為朔。”又《三正記》雲：“正朔三而改，文質再而復。”以此推之，自夏以上皆正朔三而改也。鄭注《尚書》：“三帛，高陽氏之後用赤繒，高辛氏之後用黑繒，其餘諸侯用白繒。”如鄭此意，卻而推之，舜以十一月為正，尚赤。堯以十二月為正，尚白，故曰：“其餘諸侯用白繒。”高辛氏以十二月為正，尚黑。故云：“高辛氏之後用赤繒。”高陽氏以十一月為正，尚赤，故云：“高陽氏之後用赤繒。”帝少皞以十二月為正，尚白。黃帝以十三月為正，尚黑。神農以十一月為正，尚赤。女媧以十二月為正，尚白。伏犧以上，未有聞焉。《易·說卦》雲“帝出乎震”，則伏羲也。建寅之月，又木之始。其三正當從伏羲，以下文質再而復者，文質法天地，文法天，質法地。周文法地而為天正，殷質法天而為地正者，正朔文質不相須，正朔以三而改，文質以二而復，各自為義，不相須也。建子之月為正者，謂之天統。以天之陽氣始生，為百物得陽氣，微稍動變，故為天統。建醜之月為地統者，以其物已吐牙，不為天氣始動，物又未出，不得為人所施功，唯在地中含養萌牙，故為地統。建寅之月為人統者，以其物出於地，人功當須修理，故謂之人統。統者，本也，謂天地人之本也。然王者必以此三月為正者，以其此月物生微細，又是歲之始生，王者繼天理物，含養微細，又取其歲初為正朔之始。既天地人之三者所繼不同，故各改正朔，不相襲也。所尚既異，符命亦隨所尚而來，故《禮緯·稽命徵》雲：“其天命以黑，故夏有玄珪。天命以赤，故周有赤雀銜書。天命以白，故殷有白狼銜鉤。”是天之所命，亦各隨人所尚。符命雖逐所尚，不必皆然。故天命禹觀河，見白麵長人。《洛予命》雲：“湯觀於洛，沈璧，而黑龜與之書，黃魚雙躍。”《泰誓》言武王伐紂，而白魚入於王舟。是符命不皆逐正色也。鄭康成之義，自古以來，皆改正朔。若孔安國則改正朔殷、週二代，故注《尚書》湯承堯舜禪代之後，革命創制，改正易服，是從湯始改正朔也。○注“昏時”至“事也”。○正義曰：知“大事”是喪事者，以其與“斂”文連，故知大事是喪事也。○注《爾雅》曰：騋，牝驪，牡玄”。○正義曰：引《爾雅·釋畜》文。“騋，牝驪，牡玄”，謂七尺曰騋，牝者色驪，牡者色玄。引之者，證“驪”是玄之類也。案《廋人》雲：“八尺以上為龍，七尺以上為騋，六尺以上為馬。”凡馬皆有驪牡玄，獨言騋者，舉中以見上下，明其諸馬皆然。或《爾雅》釋《詩》雲：“騋牝。”郭璞注：“玄駒，小馬。”稍異鄭也。○注“玄黑類也”。○正義曰：案《周禮·考工記》：“七入為緇。”鄭雲：“玄則六入者與？”是玄黑類。○注“翰白”至“翰如”。○正義曰：所引《易》者，《易·賁卦·六四》：“賁如皤如，白馬翰如。”《賁》離下艮上，鄭注云：“六四，巽爻也。有應於初九，欲自飾以適初，既進退未定，故皤如也。”“白馬翰如”，謂九三位在辰，得巽氣為白馬。翰猶幹也。見六四適初未定，欲幹而有之，引此者證“翰”為白色。案彼以幹為翰者，以“翰如”、“白馬”連文，故以翰為幹，望經為義，以此不同。○注“物萌色赤”。○正義曰：案上“殷尚白”之下，注云：“物牙色白。”此“萌色赤”不同者，萌是牙之微細，故建子云萌，建醜雲牙。若散而言之，萌即牙也。故《書傳略說》雲：“周以至動，殷以萌，夏以牙。”此皆據一種之草，大汎而言，故建子始動，建寅乃出，至如薺麥以秋而生，《月令》仲冬荔挺出，不在此例也。此文質雖異，殷、質周文，大泛言之，乃前代質，後代文也。故《表記》雲“虞、夏之質，殷、周之文”是也。○注“騵，騮馬，白腹”。○正義曰：《爾雅·釋畜》文。武王伐紂所乘也。故《詩》雲：“駟騵彭彭。”《毛傳》雲：“上週下殷。”故周人戎事乘之，若其餘事，則《明堂位》雲“周人黃馬蕃鬛”是也。" }
      - { type: j, text: "穆公之母卒，穆公，魯哀公之曾孫。使人問於曾子曰：“如之何？”問居喪之禮。曾子，曾參之子，名申。○參，所金反，一音七南反，後同。對曰：“申也聞諸申之父曰：“哭泣之哀，齊斬之情，饘粥之食，自天子達。子喪父母，尊卑同。○齊音諮，本亦作齎，齎衰之字，後皆放此。饘，本又作飦，之然反，《說文》雲：“糜也。”周謂之饘，宋、衛謂之{衍食}。粥，之六反，徐又音育，《字林》雲：“淖，糜也。”布幕，衛也。縿幕魯也。’”幕，所以覆棺上也，縿，縑也。縿讀如綃。衛，諸侯禮。魯，天子禮。兩言之者，僣已久矣。幕或為幦。○幕，本又作冪，音莫，徐音覓，下同。縿音綃，徐又音蕭。縑，古謙反。綃音消，徐本又作綃，桑堯反。僣，子念反。幦，莫歷反。" }
      - { type: z, text: "“穆公”至“魯也”。○正義曰：此一節論尊卑之喪有同有異之事，各依文解之。○注“穆公”至“曾孫”。○正義曰：案《世本》傳記，哀公蔣生悼公寧，寧生元公嘉，嘉生穆公不衍，是曾孫也。○“曰哭”至“子達”者，曾申對穆公使人云，哭泣之哀，謂有聲之哭，無聲之泣，併為哀然，故曰“哭泣之哀”也。“齊斬之情”者，齊是為母，斬是為父，父母情同，故答雲“之情”也。“饘粥之食”者，厚曰饘，希曰粥，朝夕食米一溢，孝子以此為食，故曰“食”也。“自天子達”者，父母之喪，貴賤不殊，“哭泣”以下，自天子至庶人如一，故云“自天子達”。○“布幕，衛也。縿幕，魯也”者，既言齊斬饘粥同，又言覆棺之幕天子諸侯各別。以布為幕者衛，是諸侯之禮；以縿為幕者魯，是天子之制。幕者，謂覆殯棺者也。下文雲：“加斧於槨上。”鄭雲：“以剌繡於縿幕，加槨以覆棺，已乃屋其上，盡塗之。”如鄭此言，繡幕加斧文塗之，內以覆棺槨也。周公一人得用天子禮，而後代僣用之，故曾申舉衛與魯俱是諸侯，則後代不宜異，謂魯之諸公不宜與衛異也。崔靈恩雲：“當時諸侯僣效天子也，恐魯穆公不能辨，故兩言以明顯魯與諸侯之別也。”今案崔言雖異，而是曾申為穆公說則同也。然《周禮·幕人》：“掌帷、幕、幄、帟。”注云：“在傍曰帷，在上曰幕。幕或在地，展陳於上。帷、幕皆以布為之。四合象宮室曰幄，王所居之帳也。帟，王在幕，若幄中坐，上承塵也。幄、帟皆以繒為之。”而今雲天子用綃幕者，崔靈恩雲：“《周禮》所陳只謂幄帟之帷幕，不論襯棺自用縿也。天子別加斧於上畢塗屋，此所陳袛謂衤親棺幕在於畢塗之內者也。若其塗上之帟，則大夫以上有之，故《掌次》雲：‘凡喪，王則張帟三重，諸侯再重，孤卿大夫不重。’下雲‘君於士有賜帟’，然士無覆棺之幕，下雲‘子張之喪，楮幕丹質’者，彼謂將葬啟殯以覆棺，故鄭注彼雲：‘葬覆棺別也。’”" }
      - { type: j, text: "晉獻公將殺其世子申生，信驪姬之譖。○孋，本又作麗，亦作驪，同，力知反。公子重耳謂之曰：“子蓋言子之志於公乎！”蓋皆當為盍。盍，何不也。志，意也。重耳欲使言見譖之意。重耳，申生異母弟，後立為文公。○重，直龍反，注皆同。子蓋，依注音盍，戶臘反，下同。世子曰：“不可，君安驪姬，是我傷公之心也。”言其意則驪姬必誅也。驪姬，獻公伐驪戎所獲女也。申生之母蚤卒，驪姬嬖焉。○蚤音早。嬖，必計反。曰：“然則蓋行乎？”行猶去也。世子曰：“不可，君謂我欲弒君也。天下豈有無父之國哉！吾何行如之？”言人有父，則皆惡欲弒父者。○弒，本又作煞，音試，注同。徐雲：“字又作嗣，音同。”惡，烏路反。使人辭於狐突曰：“申生有罪，不念伯氏之言也，以至於死。申生不敢愛其死。辭猶告也。狐突，申生之傅，舅犯之父也。前此者，獻公使申生伐東山皋落氏，狐突謂申生欲使之行。今言此者，謝之。伯氏，狐突別氏。○突，徒忽反。傅音富。咎，其九反。皋，古刀反。雖然，吾君老矣，子少，國家多難。子，驪姬之子奚齊。○少，詩召反。難，乃旦反。伯氏不出而圖吾君，圖猶謀也。不出為君謀國家之政。然則自皋落氏反後，狐突懼，乃稱疾。○為，於偽反，下“為時”同。伯氏苟出而圖吾君，申生受賜而死。”則猶惠也。再拜稽首，乃卒。既告狐突，乃雉經。○雉經，如字，徐古定反，如雉之自經也。是以為恭世子也。言行如此，可以為恭，於孝則未之有。○共音恭，本亦作恭，注同。行，下孟反。" }
      - { type: z, text: "“晉獻”至“子也”。○正義曰：此一節論獻公殺申生之事，各依文解之。○注“信驪姬之譖”。正義曰：案僖四年《左傳》雲：“姬謂大子曰：‘君夢齊姜，必速祭之。’大子祭於曲沃，歸胙於公。公田，姬置諸宮，六日，毒而獻之。公祭之地，地墳。與犬，犬斃。與小臣，小臣亦斃。姬泣曰：‘賊由大子。’”又《晉語》雲：“姬寘鴆於酒，置堇於肉。”堇謂烏頭，是驪姬譖申生之事也。○注“蓋皆”至“文公”。○正義曰：此雲“蓋言子志”及下“蓋行乎”，以蓋非一，故云“皆當為盍”。言“重耳欲使言見譖之意”者，重耳欲使申生言見驪姬所譖之意。《左傳》雲：“或謂太子曰：‘子辭，君必辨焉。’”杜預雲：“以六日之狀自理。”謂毒酒經宿輒敗，若申生初則置罪，經六日，其酒必壞，何以經六日，其酒尚好，明臨至加藥焉。雲“重耳，申生異母弟”者，案莊二十八年《左傳》雲：“晉獻公烝於齊姜，生太子申生。大戎狐姬生公子重耳。”是異母弟也。○注“言其”至“嬖焉”。○正義曰：案僖四年《左傳》雲：“大子曰：‘君非姬氏，居不安，食不飽。君老矣，吾又不樂。’”謂我若自理，驪姬必誅，姬死之後，公無復歡樂，故此雲“是我傷公之心”。雲“驪姬，獻公伐驪戎所獲女也”者，莊二十八年《左傳》雲：“初，晉獻公滅驪戎，驪戎男女以驪姬，驪姬嬖，生奚齊，其娣生卓子。”是驪姬，嬖也。雲“申生之母蚤卒”者，以《左傳》雲：“姬命大子祭齊姜。”是蚤死也。○“使人”至“而死”。○時狐突謝病在晉都，大子出奔曲沃，於是狐突欲令大子出奔。大子不用其言，故今臨死，使人辭謝言於狐突曰：“申生有愚短之罪，不念伯氏之言，出奔避禍。今日被譖，以至於死，申生不敢愛惜其身命之死。”言死不受命。“雖然不惜身命，猶有所憂。吾君已老，子又幼少，又國家多有危難，伯氏又謝病不出圖吾君之事，吾以為憂。伯氏誠能出外而圖謀吾君國家之事，申生受伯氏恩賜，甘心以死”。○注“前此”至“別氏”。○正義曰：案《左傳》閔二年，獻公使申生伐東山皋落氏，狐突欲令申生行雲：“雖欲勉之，狄可盡乎？”下又云“狐突欲行”，是狐突欲使行之事。言“前此”者，此謂僖四年申生將死之時，前謂閔二年伐皋落氏之時，在前五年，故云前。皋落氏在晉都之東，居在山內。皋落氏，杜預雲“是赤狄別種”，故云“東山皋落氏”。雲“伯氏，狐突別氏”者，既言辭狐突，又云伯氏，故云“狐突別氏”。狐是總氏，伯仲者是兄弟之字，字伯者，謂之伯氏，字仲者謂之仲氏，故傳雲“叔氏其忘諸乎”，又下雲“叔氏專以禮許人”，是一人身，字則別為氏也。○注“圖猶”至“稱疾”。○正義曰：“圖，謀”，《釋詁》文。“自皋落氏反後，狐突懼，乃稱疾”者，以經雲“伯氏不出而圖吾君”，故知稱疾必有所因，反自皋落，去此不遠，知自皋落反而稱疾也。○注“既告”至“雉經”。○正義曰：雉，牛鼻繩也。申生以牛繩自縊而死也。故鄭注《封人》雲：“緣，著牛鼻繩，所以牽牛者也，今時人謂之雉。”或為雉鼻耿介，被人所獲，必自屈折其頭而死。《漢書》載趙人貫高自絕亢而死，申生當亦然也。傳雲：“申生縊死。”《晉語》：“申生使猛足辭於狐突，乃雉於新成廟。”○注“言行”至“之有”。○正義曰：《春秋左傳》雲：“晉侯殺其世子申生。”父不義也，孝子不陷親於不義，而申生不能自理，遂陷父有殺子之惡。雖心存孝，而於理終非，故不曰孝，但諡為恭，以其順於父事而已。《諡法》曰：“敬順事上曰恭。”" }
      - { type: j, text: "魯人有朝祥而莫歌者，子路笑之。笑其為樂速。○莫音暮，樂音洛，又音嶽。夫子曰：“由，爾責於人，終無已夫！三年之喪，亦已久矣夫。”為時如此人行三年喪者希，抑子路以善彼。○已夫音扶，絕句，本或作“已矣夫”。子路出，夫子曰：“又多乎哉！逾月則其善也。”又，復也。○復，扶又反。" }
      - { type: z, text: "“魯人”至“善也”。○正義曰：此一節論大祥除衰杖之日，不得即歌之事，今各依文解之。○“魯人有朝祥莫歌”者，魯人不辨其姓名，祥謂二十五月大祥，歌、哭不同日，故仲由笑之也。故鄭注：“笑其為樂速。”然祥日得鼓素琴。○“夫子”至“善也”。○夫子抑子路，呼其名雲：“由，若人治喪不備三年，各有可責。今此人既滿三年，爾尚責之，女罪於人，終無休已之時。“夫”是助語也。三年之喪，計其日月已過，亦已久矣。人皆廢，此獨能行，其人既美，何須笑之。時孔子抑子路，善彼人。既不當實禮，恐學者致惑，待子路出，後更以正禮言之。夫子曰：“魯人可歌之時節，豈有多經日月哉！但逾越後月，即其善。”言歌合於禮。案《喪服四制》：“祥之日，鼓素琴。”不譏彈琴而譏歌者，下注雲：“琴以手，笙歌以氣。”手在外而遠，氣在內而近也。" }
      - { type: j, text: "魯莊公及宋人戰於乘丘，十年夏。○乘，繩證反。夏，戶嫁反。縣賁父御，卜國為右。縣、卜，皆氏也。凡車右，勇力者為之。○縣音玄，卷內皆同。賁父，上音奔，下音甫，人名，字皆同。馬驚，敗績，驚奔失列。○“馬驚，敗”，一本無“驚”字。公隊，佐車授綏。戎車之貳曰佐。授綏乘公。○隊，宜類反。綏，息佳反。公曰：“末之，卜也。”末之猶微哉，言卜國無勇。縣賁父曰：“他日不敗績，而今敗績，是無勇也。公他日戰，其御馬未嘗驚奔。遂死之。二人赴敵而死。圉人浴馬，有流矢在白肉。圉人，掌養馬者。白肉，股裏肉。○圉，魚呂反。股裏，上音古，下音裏。公曰：“非其罪也。”流矢中馬，非御與右之罪。○中，丁仲反。遂誄之。誄其赴敵之功，以為諡。○誄，力軌反，諡也。士之有誄，自此始也。記禮失所由來也。周雖以士為爵，猶無諡也。殷大夫以上為爵。○上，時掌反。" }
      - { type: z, text: "“魯莊”至“始也”。○正義曰：此一節論魯莊公與士為諡失禮之事，各依文解之。○“戰於乘丘”者，乘丘，魯地，莊公十年夏六月，“齊師、宋師次於郎，公子偃曰：‘宋師不整，可敗也。宋敗，齊必還，請擊之。’大敗宋師於乘丘，齊師乃還”。○注“縣、卜皆氏也”。○正義曰：知“縣、卜皆氏”者，此有縣賁父，下有縣子瑣，《七十二弟子傳》有卜商，故知皆氏也。○注“戎車之貳曰佐”。○正義曰：案《周禮》“戎僕掌倅車之政”，“道僕掌貳車之政”，“田僕掌佐車之政”，則戎車之貳曰倅。此雲佐者，《周禮》相對為文有異，若散而言之，則田獵兵戎俱是武事，故同稱佐車。《少儀》注“戎獵之副曰佐”是也。熊氏以為此皆諸侯法。“公曰，末之，卜也”者，末，微也。之，哉也。言微弱哉！此卜國也，以其微弱無勇，致使我馬敗績。○注“二人赴敵而死”。○正義曰：知“二人”者，以卜國被責，縣賁父職掌馬事，自稱無勇，既序兩人於上，即陳“遂死”於下，明兩人俱死也。○注“圉人”至“裏肉”。○正義曰：“圉人，掌養馬者”，案昭七年《左傳》雲：“牛有牧，馬有圉。”是圉人掌馬也。雲“白肉，股裏肉”者，以股裏白，故謂之白肉，非謂肉色白也。○注“周雖”至“為爵”。○正義曰：知周以士為爵者，案《掌客》雲：“凡介行人宰史，皆有飧饔餼，以其爵等為之牢禮之數陳。”凡介行人皆為士，而云“爵等”，是士有爵也。故鄭注《大行人》雲：“命者五，公、侯、伯、子、男。爵者四，孤、卿、大夫、士。”雲“猶無諡也”者，以此雲“士之有誄，自此始”，故知周士無諡也。雲“殷大夫以上為爵”者，案《士冠禮》雲：“古者生無爵，死無諡。”於士冠之下而為此記，又不雲諸侯大夫，明“生無爵，死無諡”，據士也。《士冠禮》是周禮，而云“古者”，故知是殷以上。" }
      - { type: j, text: "曾子寢疾，病。病謂疾困。樂正子春坐於床下，子春，曾參弟子。曾元、曾申坐於足，元、申、曾參之子。童子隅坐而執燭。隅坐，不與成人並。成人並，音並，絕句。童子曰：“華而睆，大夫之簀與？”華，畫也。簀，謂床笫也。說者以睆為刮節目，字或為刮。○睆，華板反，明貌，孫炎雲：“睆，漆也。”徐又音刮。簀音責。與音餘，下同。畫，衡賣反。床笫，上音床，下側吏反。刮，古滑反。子春曰：“止！”以病困不可動。曾子聞之，瞿然曰：“呼。”呼，虛憊之聲。○瞿，紀具反，下同。曰籲音虛，注同，吹氣聲也。一音況於反。憊，皮拜反，羸困也。曰：“華而睆，大夫之簀與？”曾子曰：“然，斯季孫之賜也，我未之能易也。元，起易簀。”未之能易，己病故也。曾元曰：“夫子之病革矣，不可以變，幸而至於旦，請敬易之。”言夫子者，曾子親沒之後，齊嘗聘以為卿而不為也。革，急也。變，動也。幸，覬也。○革，紀力反，並又音極，注同。請，七領反。覬音冀。曾子曰：“爾之愛我也不如彼。彼，童子也。君子之愛人也以德，成已之德，細人之愛人也以姑息。息，猶安也。言苟容取安也。吾何求哉？吾得正而斃焉，斯已矣。”斃，僕也。○斃音弊。僕，蒲北反，又音赴。舉扶而易之，反席未安而沒。言病雖困，猶勤於禮。○沒音歿。" }
      - { type: z, text: "“曾子”至“而沒”。○正義曰：此一節論曾子臨死守禮不變之事，各依文解之。○注“華畫”至“為刮”。○正義曰：凡繪畫，五色必有光華故云：“華畫也。雲：“簀謂床笫”者，《爾雅·釋器》雲：“簀謂之笫。”雲“說者以睆為刮節目”者，說者謂在鄭之前解說《禮》者，說此睆為刮削木之節目，使其睆睆然好。故《詩》雲：“睍睆黃鳥。”傳雲“睍睆，好貌”是也。雲“字或為刮”者，謂《禮記》之本有以“睆”字為“刮”，雲“華而刮”者，故云字或為“刮”。○注“未之能易，己病故也”。○正義曰：言此未病之時，猶得寢臥。既病之後，當須改正。以已今病，氣力虛弱，故時復一時，未能改易。聞童子之言，乃便驚駭。○注“曾子”至“覬也”。○正義曰：知“齊嘗聘以為卿”者，《韓詩外傳》雲：“曾子仕於莒，得粟三秉。方是之時，曾子重其身而輕其祿”，親沒之後，齊迎以相，楚迎以令尹，晉迎以上卿。”“方是之時，曾子重其身而輕其祿”，既言“輕其祿”，是不為也。但齊以相，楚以令尹，晉以上卿，而鄭言“齊嘗聘為卿”者，以三國文連，含帶為注耳。且相即是上卿。“革，急也”，《釋言》文。○“曾子”至“己矣”。○曾參謂曾元曰：爾之愛我也，不如彼童子。何者？君子之愛人也，必以善事成已之德，則童子是也。細小之人愛人也，不顧道理，且相寧息，即汝是也。吾今更何求焉？唯求正道，易換其簀，而即僕焉。“斯已矣”者，斯，此也，已猶了也，此則正一世事了，不陷於惡，故君子慎終如始。《禮》雲：“男子不死於婦人之手，婦人不死於男子之手。”故《春秋》魯僖公薨於小寢，譏“即安也”。成公薨於路寢，傳曰：“言道也。”他人名己，得呼為大夫之稱，而言夫子，若懷不為大夫，則己所為當須依禮，不得寢大夫之床也。" }
      - { type: j, text: "始死，充充如有窮。既殯，瞿瞿如有求而弗得。既葬，皇皇如有望而弗至。練而慨然，祥而廓然。皆憂悼在心之貌也。求猶索物。○慨，苦愛反。廓，苦郭反，何雲：“開也。”索，所白反。" }
      - { type: z, text: "“始死”至“廓然”。○正義曰：此記人因前有死事，遂廣說孝子形節也。事盡理屈為窮。言親始死，孝子匍匐而哭之，心形充屈，如急行道極無所復去，窮急之容也。○“既殯瞿瞿，如有求而弗得”者，殯斂後，心形稍緩也。瞿瞿，眼目速瞻之貌。求猶覓也。貌恆瞿瞿，如有所失而求覓之不得然也。“既葬，皇皇如有望而弗至”者，又漸緩也。皇皇猶棲棲也。至葬後，親歸草土，孝子心形棲棲皇皇，無所依託，如有望彼人來而彼人不至也。○“練而慨然”者，轉緩也。至小祥，但歎慨日月若馳之速也。○“祥而廓然”者，至大祥，而寥廓情意，不樂而已。" }
      - { type: j, text: "邾婁復之以矢，蓋自戰於升陘始也。戰於升陘，魯僖二十二年秋也。時師雖勝，死傷亦甚，無衣可以招魂。○邾音誅。婁，力俱反，或如字。邾人呼邾聲曰婁，故曰邾婁。《公羊傳》與此記同，《左氏》、《穀梁》但作邾。陘音形。僖，許宜反。魯婦人之髽而吊也，自敗於臺鮐始也。敗於臺鮐，魯襄四年秋也。臺當為壺字之誤也。《春秋傳》作狐鮐。時家家有喪，髽而相吊。去纚而紒曰髽。《禮》：婦人吊服，大夫之妻錫衰，士之妻則疑衰與？皆吉笄無首素總。○髽，測瓜反。臺鮐，上音胡，下音臺。去，羌呂反。纚，所買反，又所綺反，黑繒韜。紒音計。錫衰，上悉歷反，下七雷反。與音餘。笄音雞。總音總。" }
      - { type: z, text: "“邾婁”至“始也”。○正義曰：此一節論二國失禮之事。○注“戰於”至“招魂”。○正義曰：魯僖公二十二年“春，伐邾，取須句。秋八月及邾人戰於升陘”。《左傳》雲：“邾人以須句故出師。公卑邾，不設備而御之。臧文仲曰：‘國無小，不可易也。無備，雖眾不可恃也。先王之明德，無不懼也，況我小國乎？君其無謂邾小，蜂蠆有毒，而況國乎？’不聽，公及邾師戰於升陘”是也。○注“時師雖勝，死傷亦甚”者，則傳雲“我師敗績，邾人獲公胄，縣諸魚門”是也。鄭雲此者，解“復之以矢”之意，以其死傷者多，無衣可以招魂，故用矢招之也。必用矢者，時邾人志在勝敵，矢是心之所好，故用所好招魂，冀其復反。然招魂唯據死者，而鄭兼雲“傷”者，以其雖勝，故連言“死傷”以狹句耳。若因兵而死，身首斷絕不生者，應無復法。若身首不殊，因傷致死，復有可生之理者，則用矢招魂。《左氏》直言“邾”，《公羊》雲“邾婁”者，何休雲：“夷言婁聲相近也。”○注“敗於”至“素總”。○正義曰：案《左傳》魯襄公四年冬十月，“邾人伐鄫，臧紇救鄫，侵邾，敗於狐鮐”。魯人怨而歌之。魯襄四年冬也，此雲“秋”，鄭舉其初也。雲“臺當為壺字之誤也”，《春秋傳》作狐鮐，《左傳》雲：“臧之狐裘，敗我於狐鮐。我君小子，朱儒是使。侏儒，侏儒，使我敗於邾。”臧紇，武仲也，言狐裘武仲所服也。是時襄公年七歲微弱，故云“我君小子”也。侏儒，短人也。臧武仲短小，故云“侏儒”。雲“去纚而紒曰髽”者。案《士冠禮》“纚廣終幅，長六尺”，所以縚發。今以凶事，故去之，但露紒而已。雲“《禮》：婦人吊服，大夫之妻錫衰”者，《喪服傳》雲：“大夫吊於命婦，錫衰。命婦吊於大夫，亦錫衰。”是大夫之妻吊服錫衰也。雲“士之妻則疑衰與”者，以士妻吊服之文，故云“疑衰與”。必以疑衰者，案《周禮·司服》有錫衰、緦衰、疑衰。錫衰為上，緦衰次之，疑衰為下。案《喪服》大夫吊服錫衰，《喪服小記》雲：“諸侯吊必皮弁錫衰。”則君吊大夫，大夫相吊皆錫衰，其服同也。錫衰之下，但有緦衰、疑衰。天子吊諸侯皆以緦衰，吊大夫、士以疑衰。若諸侯吊大夫以錫衰，吊同姓之士緦衰，吊異姓之士疑衰，故鄭注《文王世子》雲：“同姓士緦衰，異姓士疑衰，以其士自相吊如一皆疑衰。”故鄭注《司服》雲：“舊說士吊服素委貌冠朝服。”此近庶人吊服而衣猶非也，士當事弁絰，疑衰變其裳以素耳。士不以緦衰為吊服者，以緦衰是士之喪服，不以吊也。故注《喪服》雲：“士以緦衰為喪服，其吊服則疑衰也。改其裳以素，闢諸侯。”以此言之，是士吊服疑衰素裳也。故以為士妻吊服疑衰。必知吊服夫妻同者，以《喪服》大夫、命婦俱以錫衰吊故也。雲“皆吉笄無首素總”者，《大戴禮》文也。" }
      - { type: j, text: "南宮縚之妻之姑之喪，南宮縚，孟僖子之子南宮閱也，字子容，其妻孔子兄女。○縚，吐刀反。閱音悅。夫子誨之髽，曰：“爾毋從從爾，爾毋扈扈爾。誨，教。爾，女也。從從，謂大高。扈扈，謂大廣。爾，語助。○毋音無，後同。從音總，高也，一音崇，又仕江反。扈音戶，廣也，大也。女音汝。大音泰，一音敕佐反，下“大廣已”、“猶大夫重”同。蓋榛以為笄，長尺，而總八寸。總，束髮垂為飾，齊衰之總八寸。○榛，側巾反，木名，又士鄰反。長，直亮反，凡度長短曰長，皆同此音。" }
      - { type: z, text: "“南宮”至“八寸”。○正義曰：此一節論婦人為舅姑服髽與笄總之法。○“南宮縚之妻之姑之喪”者，之，並是語辭也。南宮縚妻姑喪，謂夫之母也。以是夫子兄之女，故夫子誨之作髽法。○“曰，爾毋從從爾，爾毋扈扈爾”者，上“爾”為女，下“爾”語辭，言期之髽稍輕，自有常法。女造髽時，無得從從而大高，又無得扈扈而大廣。既教以作髽，又教以笄總之法，其笄用木無定，故教之雲，蓋用榛木為笄，其長尺，而束髮垂餘之總垂八寸。○注“南宮”至“兄女”。○正義曰：知“孟僖子之子南宮閱”者，案《左氏》昭七年傳雲，孟僖子將卒，召其大夫雲：“屬說與何忌於夫子，以事仲尼。”以南宮為氏，故《世本》雲“仲孫玃生南宮縚”是也。雲“字子容，其妻孔子兄女”者，《論語》雲“以其兄之子妻之”是也。○注“從從”至“大廣”。○正義曰：“從從”是高之貌狀，故《楚辭·招隱》雲：“山氣巃鷁兮石嵯峨。”則“巃嵸”是高也。扈扈猶廣也，《爾雅·釋山》雲：“卑而大扈。”郭雲：“扈是廣貌也。”此雲無得高廣者，謂無得如斬衰高廣也。○注“總束”至“八寸”。○正義曰：案《喪服傳》雲“總六升，長六寸”，謂斬衰也。故此齊衰長八寸也，以二寸為差也。以下亦當然，無文以言之。《喪服》箭笄長一尺，吉笄長尺二寸，榛笄長尺斬衰齊衰笄同二尺，降於吉笄二寸也。但惡笄或用櫛，或用榛，故《喪服》有櫛笄，故夫子稱“蓋”以疑之。" }
      - { type: j, text: "孟獻子禫，縣而不樂，比御而不入。可以御婦人矣，尚不復寢。孟獻子，魯大夫仲孫蔑。○禫，大感反。比，必利反，下“比及”同。蔑，迷結反。夫子曰：“獻子加於人一等矣。”加猶逾也。" }
      - { type: z, text: "“孟獻”至“等矣”。○正義曰：此一節論獻子除喪作樂，得禮之宜也。依禮，禫祭暫縣省樂而不恆作也。至二十八月，乃始作樂。又依禮，禫後吉祭，乃始復寢。當時人禫祭之後，則恆作樂，未至吉祭而復寢。今孟獻子既禫，暫縣省樂而不恆作，比可以御婦人而不入寢，雖於禮是常，而特異餘人，故夫子善之雲：“獻子加於人一等矣。”不謂加於禮一等。其祥禫之月，先儒不同，王肅以二十五月大祥，其月為禫，二十六月作樂。所以然者，以下雲“祥而縞，是月禫，徙月樂”，又與上文魯人朝祥而莫歌，孔子云：“逾月則其善。”是皆祥之後月作樂也。又《間傳》雲：“三年之喪，二十五月而畢。”又《士虞禮》“中月而禫”，是祥月之中也，與《尚書》“文王中身享國”謂身之中間同。又文公二年冬，“公子遂如齊納幣”，是僖公之喪，至此二十六月。左氏雲：“納幣，禮也。”故王肅以二十五月禫除喪畢，而鄭康成則二十五月大祥，二十七月而禫，二十八月而作樂復平常鄭必以為二十七月禫者，以雜記雲：“父在為母為妻十三月大祥，十五月禫。為母為妻尚祥、禫異月，豈容三年之喪乃祥、禫同月。若以父在為母，屈而不伸，故延禫月，其為妻當亦不申祥、禫異月乎？若以中月而禫，為月之中間，應雲月中而禫，何以言中月乎？案《喪服小記》雲“妾祔於妾祖姑，亡則中一以上而祔”，又《學記》雲“中年考校”，皆以中為間，謂間隔一年，故以中月為間隔一月也。下雲“祥而縞，是月禫，徙月樂”是也。謂大祥者縞冠，是月禫，謂是此禫。月而禫二者，各自為義，事不相干。故《論語》雲：“子於是日哭，則不歌。”文無所繼，亦云“是日”。文公二年“公子遂如齊納幣”者，鄭《箴膏肓》：“僖公母成風主婚，得權時之禮，若《公羊》猶談其喪娶。其“魯人朝祥而莫歌”，及《喪服四制》雲“祥之日，鼓素琴”，及“夫子五日彈琴不成聲，十日成笙歌”，並此“獻子禫縣”之屬，皆據省樂忘哀，非正樂也。其八音之樂，工人所奏，必待二十八月也，即此下文“是月禫，徙月樂”是也。其朝祥莫歌非正樂歌，是樂之細別，亦得稱樂，故鄭雲：“笑其為樂速也。”其《三年問》雲：“三年之喪，二十五月而畢。”據喪事終，除衰去杖，其餘哀未盡，故更延兩月，非喪之正也。王肅難鄭雲：“若以二十七月禫，其歲未遭喪，則出入四年，《喪服小記》何以雲‘再期之喪三年’？”如王肅此難，則為母十五月而禫，出入三年，《小記》何以雲“期之喪二年”？明《小記》所云，據喪之大斷也。又肅以月中而禫。案《曲禮》“喪事先遠日”，則大祥當在下旬，禫祭又在祥後，何得雲“中月而禫”？又禫後何以容吉祭？故鄭雲二十七月也。戴德《喪服變除禮》“二十五月大祥，二十七月而禫”，故鄭依而用焉。鄭以二十八月樂作，《喪大記》何以雲“禫而內無哭者，樂作矣”？以禫後許作樂者，《大記》所謂禫後方將作樂，釋其“內無哭者”之意，非謂即作樂。《大記》又云“禫而從御，吉祭而復寢”，《間傳》何以雲“大祥居復寢”？《間傳》所云者，去堊室，復殯宮之寢，《大記》雲“禫而從御”，謂禫後得御婦人，必待吉祭，然後復寢。其吉祭者，是禫月值四時而吉祭，外而為之，其祝辭猶不稱以某妃配，故《士虞禮》雲：“吉祭猶未配。”○注“孟獻子，魯大夫仲孫蔑”。○正義曰：知者，案襄五年經書“仲孫蔑會吳於善道”，傳雲：“孟獻子會吳於善道”，是孟獻子為仲孫蔑也。仲稱孟者，是慶父之後。鄭注《論語》雲：“慶父輈稱死，時人為之諱，故云孟氏。”杜預以為慶父是莊公長庶兄，庶長故稱孟。" }
      - { type: j, text: "孔子既祥，五日彈琴而不成聲，哀未忘。○彈，徒丹反。十日而成笙歌。逾月且異旬也。祥亦凶事，用遠日。五日彈琴，十日笙歌，除由外也。琴以手，笙歌以氣。○笙音生。" }
      - { type: z, text: "“孔子”至“笙歌”。○正義曰：此一節論孔子除喪作樂之限。○“十日而成笙歌”者，上雲“彈琴而不成聲”，此雲十日而成笙歌之聲音，曲諧和也。○注“五日”至“以氣”。○正義曰：此者解先彈琴，後笙歌之意。由彈以手，手是形之外，故曰“除由外也”。祥是凶事，用遠日，故十日得逾月。若其卜遠不吉，則用近日，雖祥後十日，亦不成笙歌，以其未逾月也。" }
      - { type: j, text: "有子蓋既祥而絲屨、組纓。譏其早也。禮：既祥，白屨無絇，縞冠素紕。有子，孔子弟子有若。○屨音句。組音祖。絇，其俱反。縞，古老反，又古報反。" }
      - { type: z, text: "“有子”至“組纓”。○正義曰：此一節明除喪失禮之事。有子，孔子弟子有若也。“蓋”是疑辭，錄記之人傳聞有子既祥而絲屨，未知審否，意以為實，故云蓋既祥而絲屨，以組為纓也。○注“譏其”至“有若”。○正義曰：此絲屨組纓，禫後之服。今既祥而著，故云“譏其早也”。雲“禮，既祥，白屨無絇”，戴德《喪服變除禮》文。雲“縞冠素紕”者，《玉藻》文。素紕當用素為纓，未用組，今用素組為纓，故譏之。案《玉藻》文雲“玄冠綦組纓”，知此非綦組纓者，若其綦組為纓，則當以玄色為冠，若既祥玄冠，則失禮之甚，不應直譏組纓也。案《士冠禮》“冬皮屨”，“夏用葛”，無雲“絲屨”者，此絲屨，以絲為飾。絇，繶純之屬，故《士冠禮》雲：白屨，緇絇、繶純；纁屨，黑絇、繶純。鄭注《屨人》雲：“絇，屨頭飾。繶是縫中紃。純，緣也。”此有子蓋亦白屨，以素絲為繶純也。" }
      - { type: j, text: "死而不吊者三：謂輕身忘孝也。畏，人或時以非罪攻己，不能有以說之死之者。孔子畏於匡。厭，行止危險之下。○厭，於甲反。溺。不乘橋舡。○溺，奴狄反。" }
      - { type: z, text: "“死而”至“厭溺”。○正義曰：此一節論非理橫死不合吊哭之事。○“畏”謂有人以非罪攻己，己若不有以解說之而死者，則不吊。鄭玄注引《論語》以證之，明須解說也。案《世家》雲，陽虎嘗侵暴於匡，時又孔子弟子顏刻為陽虎御車。後孔子亦使刻御車，從匡過。孔子與陽虎相似，故匡人謂孔子為陽虎，因圍，欲殺之。孔子自說，故匡又解圍也。自說者，謂卑辭遜禮。《論語注》雲：“微服而去。”謂身著微服，潛行而去，不敢與匡人鬥，以媚悅之也。○“厭”謂行止危險之下，為崩墜所厭殺也。○“溺”謂不乘橋舡而入水死者，何胤雲：“馮河、潛泳，不為吊也。”除此三事之外，其有死不得禮亦不吊。故昭二十年，衛齊豹欲攻孟縶，宗魯事孟縶。是時齊豹欲攻孟縶，宗魯許齊豹攻之，不告孟縶。及孟縶被殺而死，宗魯亦死之。孔子弟子琴張欲往吊之，孔子止之曰：“齊豹之盜，而孟縶之賊。女何吊焉？”杜預雲：“言齊豹所以為盜，孟縶所以見賊，皆由宗魯。”是失禮者，亦不吊也。”" }
      - { type: j, text: "子路有姊之喪，可以除之矣，而弗除也。孔子曰：“何弗除也？”子路曰：“吾寡兄弟而弗忍也。”孔子曰：“先王制禮，行道之人，皆弗忍也。”行道，猶行仁義。○弗除，如字，徐治慮反。子路聞之，遂除之。" }
      - { type: z, text: "“子路”至“除之”。○正義曰：庾蔚雲：“子路緣姊妹無主後，猶可得反服，推己寡兄弟，亦有申其本服之理，故於降制已遠而猶不除，非在室之姊妹欲申服過期也。是子路已事仲尼，始服姊喪，明姊已出嫁，非在室也。”" }
      - { type: j, text: "《禮記正義》" }
