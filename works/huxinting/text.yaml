        text: 大喜曰湖中焉得更有此人
        du: [大喜曰, 湖中焉得更有此人]
      - line: 12
        text: 拉余同飲余強飲三大白而別
        du: [拉余同飲, 余強飲三大白而別]
      - line: 13
        text: 問其姓氏是金陵人客此
        du: [問其姓氏, 是金陵人, 客此]
      - line: 14
        text: 及下船舟子喃喃曰
        du: [及下船, 舟子喃喃曰]
