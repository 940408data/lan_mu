  <h2>關於這卷</h2>
    <p>《湖心亭看雪》，明張岱作，出《陶庵夢憶》卷三。崇禎五年（1632）十二月，大雪三日，西湖人鳥聲俱絕，張岱獨往湖心亭看雪，遇金陵二客對坐飲酒，強飲三大白而別。全文一百五十七字，寫雪夜空靈之境與「癡」之胸次，為晚明小品名作�?/p>
    <h3>復刻取捨</h3>
    <p>本卷以蘭木手卷引擎重排：行文依維基文庫底本。依骈對斷句、參差成行，凡十五行，短者八字、長者十三字，行氣隨文意起伏。墨色按蘸墨—行筆—墨盡的節奏逐字微調濃淡（種子確定性生成，無手�?marks）。無夾注�?/p>
    <p>點綴：引首鈐「看雪」朱文閒章一枚、卷末鈐「張岱」白文名章一枚，極淡，遠觀若無，近察方見�?/p>
