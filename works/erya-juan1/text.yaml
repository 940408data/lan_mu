# 爾雅注疏卷1（邢昺疏）：j 為經文＋晉郭璞注，z 為疏文。
sections:
  - id: juan1
    name: 正文
    blocks:
      - { type: j, text: "翰林侍讲学士朝请大夫守国子祭酒上柱国赐紫金鱼袋臣邢昺等奉敕校定" }
      - { type: j, text: "夫《尔雅》者，先儒授教之术，後进索隐之方，诚传注之滥觞，为经籍之枢要者也。夫混元辟而三才肇位，圣人作而六艺斯兴。本乎发德於衷，将以纳民於善。洎夫醇ㄤ既异，步骤不同，一物多名，系方俗之语；片言殊训，滞今古之情，将使後生若为钻仰？繇是圣贤间出，诂训递陈，周公倡之於前，子夏和之於後。虫鱼草木，爰自尔以昭彰；《礼》、《乐》、《诗》、《书》，尽由斯而纷郁。然又时经战国，运历挟书，传授之徒浸微，发挥之道斯寡，诸篇所释，世罕得闻。惟汉终军独深其道，豹鼠既辨，斯文遂隆。其後相传，乃可详悉。其为注者，则有犍为文学、刘歆、樊光、李巡、孙炎，虽各名家，犹未详备。惟东晋郭景纯用心几二十年，注解方毕，甚得六经之旨，颇详百物之形。学者祖焉，最为称首。其为义疏者，则俗间有孙炎、高琏，皆浅近俗儒，不经师匠。今既奉敕校定，考案其事，必以经籍为宗；理义所诠，则以景纯为主。虽复研精覃思，尚虑学浅意疏。谨与尚书驾部员外郎直秘阁（臣）杜镐、尚书都官外郎秘阁校理（臣）舒雅、大常博士直集贤院（臣）李维、诸王府侍讲大常博士兼国子监直讲（臣）孙奭、殿中丞（臣）李慕清大理寺丞国子监直讲（臣）王焕、大理评事国子监直讲（臣）崔偓佺、前知洺州永年县事（臣）刘士玄等，共相讨论，为之疏释，凡一十卷。虽上遵睿旨，共竭於颛蒙，而下示将来，尚惭於疏略。谨叙。" }
