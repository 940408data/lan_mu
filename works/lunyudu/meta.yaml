    依<b>宋刻本</b>版式排比：一版兩個半葉，中縫為版心。程子語錄大字單行。<br>版心上下留白口，上鐫單黑魚尾，次書名卷次、葉次，末署刻工姓名。<br>句讀依宋本朱筆圈點之法，附於字之右下，圈為句、點為讀，不占字位；<br>可於經注並朱、惟經施朱、惟注施朱、白文無點四式間遞轉。<br>文本錄自朱熹《論語集注》卷首「讀論語孟子法」：程子論讀論孟之法凡十條。
