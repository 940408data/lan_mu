# 讀論語孟子法（朱熹卷首，程子語錄）：j 為大字
# 底本：本地《四書章句集注》CHM 電子本（input_data/chm_extract/6.htm）
sections:
  - id: lunyu-dufa
    name: 讀論語孟子法
    blocks:
      - { type: j, text: 讀論語孟子法 }
      - { type: z, text: 據清仿宋大字本補。 }
      - { type: j, text: 程子曰：「學者當以論語孟子為本。論語孟子既治，則六經可不治而明矣。讀書者當觀聖人所以作經之意，與聖人所以用心，聖人之所以至於聖人，而吾之所以未至者，所以未得者。句句而求之，晝誦而味之，中夜而思之，平其心，易其氣，闕其疑，則聖人之意可見矣。」 }
      - { type: j, text: 程子曰：「凡看文字，須先曉其文義，然後可以求其意。未有不曉文義而見意者也。」 }
      - { type: j, text: 程子曰：「學者須將論語中諸弟子問處便作自己問，聖人答處便作今日耳聞，自然有得。雖孔孟復生，不過以此教人。若能於語孟中深求玩味，將來涵養成甚生氣質！」 }
      - { type: j, text: 程子曰：「凡看語孟，且須熟讀玩味。須將聖人言語切己，不可只作一場話說。人只看得二書切己，終身盡多也。」 }
      - { type: j, text: 程子曰：「論孟只剩讀?，便自意足。學者須是玩味。若以語言解?，意便不足。」 }
      - { type: j, text: 或問：「且將論孟緊要處看，如何？」程子曰：「固是好，但終是不浹洽耳。」 }
      - { type: j, text: 程子曰：「孔子言語句句是自然，孟子言語句句是事實。」 }
      - { type: j, text: 程子曰：「學者先讀論語孟子，如尺度權衡相似，以此去量度事物，自然見得長短輕重。」 }
      - { type: j, text: 程子曰：「讀論語孟子而不知道，所謂『雖多，亦奚以為』。」 }
