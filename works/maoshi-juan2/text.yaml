# 毛詩正義卷2（孔穎達疏）：j 為經文＋毛亨傳、鄭玄箋，z 為疏文。
sections:
  - id: juan2
    name: 正文
    blocks:
      - { type: j, text: "《簡兮》，刺不用賢也。衛之賢者仕於伶官，皆可以承事王者也。伶官，樂官也。伶氏世掌樂官而善焉，故後世多號樂官為伶官。○簡，居限反，字從竹。或作“蕳”，是草名，非也。泠音零，字從水，亦作“伶”。" }
      - { type: z, text: "“《簡兮》三章，章六句”至“王者”。○正義曰：作《簡兮》詩者，刺不能用賢也。衛之賢者仕於伶官之賤職，其德皆可以承事王者，堪為王臣，故刺之。伶官者，樂官之總名。經言“公庭方舞”，即此仕於伶官在舞職者也。《周禮》掌舞之官有舞師、籥師、旄人、韎師也。《舞師》雲“凡野舞，則皆教之”，不教國子。下傳曰“教國子弟”，則非舞師也。籥師掌教國子舞羽吹籥，則不教《萬》舞。經言“公庭《萬》舞”，則非籥師也。旄人、韎師皆教夷樂，非《萬》舞，又不教國子，且夷狄之樂，諸侯所無，非賢者所得為也。唯《大司樂》雲“以樂教國子”，《樂師》雲“以教國子小舞”。其用人則大司樂中大夫二人，樂師下大夫四人、上士八人、下士十有六人。此乃天子之官也。諸侯之禮，亡其官屬，不可得而知。《燕禮》注云“樂正於天子為樂師也”，則諸侯有樂正之屬乎？首章傳曰：“非但在四方，親在宗廟、公庭。”二章傳曰：“祭有畀韗胞翟閽寺者，惠下之道。”《禮記》雲“翟者，樂吏之賤者也”，則此賢者身在舞位，在賤吏之列，必非樂正也。又刺衛不用賢，而箋雲“擇人”。擇人則君所置用，又非府史也。若府史，則官長所自闢除，非君所擇也。《祭統》曰：“屍飲九，以散爵獻士。”下言祭之末，乃賜之一爵，又非士也，蓋為樂正之屬。祭廟、教國子皆在舞位，則為舞人也，若周官旄人舞者眾寡無數，韎師舞者十有六人之類也。周官司樂、樂師，其下無舞人，此蓋諸侯官而有之。然則此非府史，而言樂吏者，以賤，故以吏言之。故韗胞閽寺悉非府史，皆以吏言之也。言“皆可以”者，見不用者非一，或在其餘賤職，故言“皆”也。時周室卑微，非能用賢，而言“可以承事王者”，見碩人德大，堪為王臣，而衛不用，非要周室所能任也。“仕於伶官”，首章是也。二章言“多才多藝”，卒章言“宜為王臣”，是可以承事王者之事也。○箋“伶官”至“為伶官”。○《正義》曰：《左傳》鍾儀對晉侯曰：“伶人也。”“使與之琴，操南音。”《周語》曰：“周景王鍾成，伶人告和。”《魯語》雲：“伶蕭詠歌及《鹿鳴》之三。”此雲“仕於伶官”，以“伶氏世掌樂官而善焉，故後世多號樂官為伶官”。《呂氏春秋》及《律曆志》雲“黃帝使伶倫氏，自大夏之西，崑崙之陰，取竹斷雨節間而吹之，為黃鍾之宮”。《周語》“景王鑄無射，而問於伶州鳩”。是伶氏世掌樂官。" }
      - { type: j, text: "簡兮簡兮，方將《萬》舞。簡，大也。方，四方也。將，行也。以幹羽為《萬》舞，用之宗廟山川，故言於四方。箋雲：簡，擇。將，且也。擇兮擇兮者，為且祭祀當《萬》舞也。《萬》舞，幹舞也。○為，於偽反。日之方中，在前上處。教國子弟，以日中為期。箋雲：“在前上處”者，在前列上頭也。《周禮》：“大胥掌學士之版，以待致諸子。春，入學，舍採合舞。”○胥，思徐反。版音板。舍音釋，下篇“舍軷”同。採音菜。碩人俁俁，公庭《萬》舞。碩人，大德也。俁俁，容貌大也。《萬》舞，非但在四方，親在宗廟、公庭。○俁，疑矩反。《韓詩》在扈扈雲“美貌”。" }
      - { type: z, text: "“簡兮”至“萬舞”。○毛以為，言衛不用賢。有大德之人兮，大德之人兮，祭山川之時，乃使之於四方，行在《萬》舞之位。又至於日之方中，教國子弟習樂之時，又使之在舞位之前行而處上頭，親為舞事以教之。此賢者既有大德，復容貌美大俁俁然，而君又使之在宗廟、公庭親為《萬》舞，是大失其所也。○鄭以為，衛君擇人兮，擇人兮，為有方且祭祀之時，使之當為《萬》舞。又日之方中，仲春之時，使之在前列上頭，而教國子弟習樂。為此賤事，不當用賢，而使大德之人，容貌俁俁然者，於祭祀之時，親在宗廟、公庭而《萬》舞。言擇大德之人，使為樂吏，是不用賢也。○傳“以幹羽”至“四方”。○正義曰：《萬》，舞名也。謂之“萬”者，何休雲：“象武王以萬人定天下，民樂之，故名之耳。”《商頌》曰：“《萬》舞有奕。”殷亦以武定天下，蓋象湯之伐桀也。何休指解周舞，故以武王言之。《萬》舞之名，未必始自武王也。以《萬》者，舞之總名，干鏚與羽籥皆是，故云“以幹羽為《萬》舞”，以祭山川宗廟。宜幹、羽並有，故云“用之宗廟山川”。由山川在外，故云“於四方”，解所以言四方之意也。《周禮》舞師教羽舞，帥而舞四方之祭祀；教兵舞，帥而舞山川之祭祀，則山川與四方別。此言山川，而云四方者，以《周禮》言“天子法四方為四望”，故注云：“四方之祭祀，謂四望也。”《大司樂》注云：“四望，謂五嶽、四鎮、四瀆。”然則除此以外，乃是山川也，故山川與四方別舞。諸侯之祭山川，其在封內則祭之，非其地則不祭，無嶽、瀆之異，唯祭山川而已，故以山川對宗廟在內為四方也。此傳幹羽為《萬》舞，宗廟、山川同用之，而《樂師》注云“宗廟以人，山川以幹”，皆非羽舞，宗廟、山川又不同。此得同者，天子之禮大，故可為之節文，別祀別舞。諸侯唯有時王之樂，禮數少，其舞可以同也。○箋“簡擇”至“幹舞”。○正義曰：以下雲“公言錫爵”，當祭末，則“公庭《萬》舞”是祭時。此方論擇人為《萬》舞，故為且祭祀也。傳亦以此推之，故用之宗廟、山川為祭也。知《萬》舞為幹舞，不兼羽籥者，以《春秋》雲“萬入去《籥》”別文。《公羊傳》曰：“《籥》者何？籥舞。《萬》者何？幹舞。”言幹則有戚矣，《禮記》雲“朱干玉鏚，冕而舞《大武》”。言籥則有羽矣，《籥師》曰“教國子舞羽吹籥”。羽、籥相配之物，則羽為《籥》舞，不得為《萬》也。以干鏚武事，故以萬言之；羽籥文事，故指體言籥耳。是以《文王世子》雲“春夏學干戈，秋冬學羽籥”，注云：“干戈，《萬》舞，象武也。羽籥，《籥》舞，象文也。”是幹、羽之異也。且此《萬》舞併兼羽籥，則碩人故能《籥》舞也。下二章論碩人之才藝，無為復言“左手執籥，右手秉翟”也。明此言干鏚舞，下說羽籥舞也。以此知《萬》舞唯幹，無羽也。孫毓亦云：“《萬》舞，干鏚也。羽舞，翟之舞也。”傳以幹羽為《萬》舞，失之矣。○傳“教國”至“為期”。○正義曰：知教國子弟者，以言“在前上處”。在前列上頭，唯教者為然。祭祀之禮，旦明而行事，非至日之方中始在前上處也。此既為樂官，明其所教者，國子也。國子，謂諸侯大夫士之適子。言“弟”，容諸侯之庶子，於適子為弟，故《王制》雲“王太子、王子、群后之太子、卿大夫元土之適子”。彼雖天子之法，推此諸侯亦有庶子在國學，故言國子弟也。傳言“日中為期”，則謂一日之中，非春秋日夜中也。若春秋，言不當為期也，故王肅雲“教國子弟，以日中為期，欲其遍至”，是也。○箋“在前”至“合舞”。○正義曰：《公羊傳》曰：“諸侯四佾，則舞者為四列。”使此碩人居前列上頭，所以教國子諸子學舞者，令法於己也。《周禮》者，皆《春官·大胥職》文也。彼注云：“學士，謂卿大夫諸子學舞者。版，籍也。大胥主此版籍，以待當召聚學舞者。卿大夫之諸子，則案此籍以召之。”又云“春，入學”者，注云：“春始以學士入學宮而學之合舞等，其進退使應節奏。《月令》仲春之月，命樂正習舞。入學者必釋菜以禮先師，謂蘋藻之屬也。”此賢者非為大胥也。引此者以證此“日之方中”，即彼“春，入學”是矣，謂二月日夜中也。《尚書》雲“日中星鳥”，《左傳》曰“馬日中而出”，皆與此同也。○傳“碩人”至“公庭”。○正義曰：碩者，美大之稱，故諸言碩人者，傳皆以為大德。唯《白華》“碩人”，傳不訓此。及《考槃》傳意類之，則亦為大德也。故王肅雲：“碩人謂申後。此刺不用賢。”則箋意亦以碩人為大德。其餘則隨義而釋，不與此同，故《白華》碩人為妖大之人，謂褒姒也。碩既為大德，故俁俁為容貌大也。上亦教國子，此直雲“非但在四方”，不併言教國子者，以“在前上處”文無舞，故據《萬》舞言也。" }
      - { type: j, text: "有力如虎，執轡如組。組，織組也。武力比於虎，可以御亂。御眾有文章，言能治眾，動於近，成於遠也。箋雲：碩人有御亂、御眾之德，可任為王臣。○轡，悲位反。組音祖。任音壬。左手執籥，右手秉翟。籥，六孔。翟，翟羽也。箋雲：碩人多才多藝，又能籥舞。言文武道備。○籥，餘若反，以竹為之，長三尺，執之以舞。鄭注《禮》雲“三孔”。郭璞同，雲“形似笛而小”。《廣雅》雲“七孔”。翟，亭歷反。赫如渥赭，公言錫爵。赫，赤貌。渥，厚漬也。祭有畀煇、胞、翟、閽、寺者，惠下之道，見惠不過一散。箋雲：碩人容色赫然，如厚傅丹，君徒賜其一爵而已。不知其賢而進用之。散受五升。" }
      - { type: z, text: "“有力”至“錫爵”。○正義曰：言碩人既有武力，比如虎，可以能御亂矣。又有文德，能治民，如御馬之執轡，使之有文章，如織組矣。以御者執轡於此，使馬騁於彼；織組者總紕於此，而成文於彼，皆動於近，成於遠。以興碩人能治眾施化，於己而有文章，在民亦動於近，成於遠矣。碩人既有御眾、御亂之德，又有多才多藝之伎，能左手執管籥，右手秉翟羽而舞，復能為文舞矣。且其顏色赫然而赤，如厚漬之丹赭。德能容貌若是，而君不用。至於祭祀之末，公唯言賜一爵而已，是不用賢人也。○傳“組織”至“於遠”。○正義曰：以義取動近成遠，故知為織組，非直如組也。武力比於虎，故可以御亂也。御，治也，謂有侵伐之亂，武力可以治之。定本作“御”字。又言“御眾有文章”者，御眾似執轡，有文章似織組。又云“言能治眾，動於近，成於遠”者，又總解御眾有文章之事也。以執轡及於如組與治眾，三者皆動於近、成於遠也。此治民似執轡，執轡又似織組，轉相如，故經直雲“執轡如組”，以喻御眾有文章也。《大叔于田》雲“執轡如組”，謂段之能御車，以御車似織組。知此不然者，以彼說段之田獵之伎，故知為實御，此碩大堪為王臣，言“有力如虎”，是武也，故知“執轡如組”比其文德，不宜但為御矣。○傳“籥，六孔。翟，翟羽”。○正義曰：《釋樂》雲：“大籥謂之產。”郭璞曰：“籥如笛，三孔而短小。”《廣雅》雲：“七孔。”鄭於《周禮·笙師》及《少儀》、《明堂位》注皆雲“籥如笛，三孔”。此傳雲六孔，與鄭不同，蓋以無正文，故不復改。傳“翟，翟羽”，謂雉之羽也，故《異義》：《公羊》說樂《萬》舞，以鴻羽取其勁輕，一舉千里；《詩毛》說《萬》以翟羽；《韓詩》說以夷狄大鳥羽。謹案：《詩》雲“右手秉翟”，《爾雅》說“翟，鳥名，雉屬也”，知翟，羽舞也。○箋“碩人”至“道備”。○正義曰：籥雖吹器，舞時與羽並執，故得舞名。是以《賓之初筵》雲“《籥》舞笙鼓”，《公羊傳》曰“籥者何？《籥》舞”是也。首章雲“公庭《萬》舞”，是能武舞，今又說其《籥》舞，是又能為文舞也。碩人有多才多藝，又能為此《籥》舞，言文武備也。言其能而已，非謂碩人實為之也。何者？此章主美其文德，不論其在職之事。○傳“渥厚”至“一散”。○正義曰：渥者，浸潤之名，故《信南山》曰“益之以霢霂，既優既渥”，是也。故此及《終南》皆雲“渥，厚漬也”。言漬之人厚則有光澤，故以興顏色之潤。是以《終南》箋雲“如厚漬之丹，言赤而澤”是也。定本“渥，厚也”，無“漬”字。“祭有畀韗、胞、翟、閽、寺者，惠下之道”，皆《祭統》文。彼又云：“畀之為言與也，能以其餘畀於下也。煇者，甲吏之賤者。胞者，肉吏之賤者。翟者，樂吏之賤者。閽者，守門之賤者。”注云：“煇，《周禮》作‘韗’，蓋謂磔皮革之官。”《周禮》韗人為鼓，鮑人為甲。《禮記》是諸侯兼官，故韗為甲吏也。胞，即《周禮》庖人，故注云：“庖之言苞也，裹肉曰苞苴。其職供王之膳羞。”是肉吏是也。其官次於韗人。《周禮》韗人亡。庖人，中士四人，下士八人。閽人，王宮每門四人。寺人，王之正內五人。以庖人類之，則皆非府史，不在獻，又非士。庖人於天子為士，於諸侯故亦非士。引之證此碩人亦樂吏，故於祭末乃是賜也。知此亦是樂吏者，以經雲“錫爵”，若士，則屍飲九而獻之，不得既祭乃賜之，故知在“惠下”之中。經雲“爵”，傳言“散”者，《禮器獻》雲：“禮有以小為貴者，貴者獻以爵，賤者獻以散。”《祭統》雲：“屍飲九，以散爵獻士。”士猶以散獻爵，賤無過散，故知不過一散。散謂之爵，爵總名也。" }
      - { type: j, text: "山有榛，隰有苓。榛，木名。下溼曰隰。苓，大苦。箋雲：榛也苓也，生各得其所。以言碩人處非其位。○榛，本亦作“蓁”，同側巾反，子可食。苓音零，《本草》雲：“甘草。”雲誰之思？西方美人。箋雲：我誰思乎？思周室之賢者，以其宜薦碩人，與在王位。○與音預，或如字。彼美人兮，西方之人兮！乃宜在王室。箋雲：彼美人，謂碩人也。" }
      - { type: z, text: "“山有”至“人兮”。○正義曰：山之有榛木，隰之有苓草，各得其所，以興衛之有碩人而在賤職，可謂處非其位，乃榛苓之不如。碩人既不寵用，故令我雲：誰思之乎？思西方周室之美人。若得彼美人，當薦此碩人，使在王朝也。彼美好之碩人兮，乃宜在王朝為西方之人兮，但無人薦之耳。○傳“榛，木名。苓，大苦”。○正義曰：陸機雲“栗屬，其子小，似柿子，表皮黑，味如栗”，是也。榛字或作“蓁”，蓋一木也。《釋草》雲：“蘦，大苦。”孫炎曰：“《本草》雲：‘蘦，今甘草’，是也。蔓延生。葉似荷，青黃。其莖赤，有節，節有枝相當。或雲蘦似地黃。”○箋“彼美人，謂碩人”。正義曰：上言西方之美人，謂周室之賢人，以薦此碩人，故知“彼美人”謂碩人，“西方之人”謂宜為西方之人，故傳曰“乃宜在王位”，言宜在王朝之位為王臣也。" }
      - { type: j, text: "簡兮三章，章，六句" }
      - { type: j, text: "《泉水》，衛女思歸也。嫁於諸侯，父母終，思歸寧而不得，故作是詩以自見也。“以自見”者，見已志也。國君夫人，父母在則歸寧，沒則使大夫寧於兄弟。衛女之思歸，雖非禮，思之至也。○見，賢遍反，上同。“思之至”，一本“思”作“恩”。" }
      - { type: z, text: "“《泉水》四章，章六句”至“以自見”。○正義曰：此時宣公之世，宣父莊，兄桓。此言父母已終，未知何君之女也。言嫁於諸侯，必為夫人，亦不知所適何國。蓋時簡札不記，故序不斥言也。四章皆思歸寧之事。○箋“衛女”至“之至”。○正義曰：以之衛女思歸，雖非禮，而思之至極也。君子善其思，故錄之也。定本作“思”字。" }
      - { type: j, text: "毖彼泉水，亦流於淇。興也。泉水始出，毖然流也。淇，水名也。箋雲：泉水流而入淇，猶婦人出嫁於異國。○毖，悲位反，《韓詩》作“秘”，《說文》作“<耳必>”雲“直視也”。淇音其。有懷於衛，靡日不思。箋雲：懷，至。靡，無也。以言我有所至念於衛，我無日不思也。所至念者，謂諸姬，諸姑伯姊。孌彼諸姬，聊與之謀。孌，好貌。諸姬，同姓之女。聊，原也。箋雲：聊，且，略之辭。諸姬者，未嫁之女。我且欲略與之謀婦人之禮，觀其志意，親親之恩也。○孌，力轉反，下篇同。" }
      - { type: z, text: "“毖彼”至“之謀”。○毛以為，毖彼然而流者，是泉水亦流入於淇水，以興行嫁者是我婦人，我婦人亦嫁於異國，故我有所至念於衛，無一日而不思念之也。我所思念者，念孌然彼諸姬未嫁之女，願欲與之謀婦人之禮。○鄭唯以“聊”為“且欲略與之謀”為異，餘同。○傳“泉水始出，毖然流”。○正義曰：以此連雲泉水，知為始出毖然流也。是以《衡門》傳亦云：“泌，泉水也。”言“亦流於淇”者，以本敘衛女之情，故言亦。亦，己也。○箋“懷至”至“伯姊”。○正義曰：以下雲“靡日不思”，此“懷”不宜復為思，故以為“至念於衛”。以下文言之，知至念者，諸姬伯姊。○箋“聊且”至“之恩”。○正義曰：言“且”者，意不盡，故言“略之辭”，以言諸姬是未嫁之辭，又向衛所見，宜據未嫁者。傳言同姓之女，亦謂未嫁也。言諸姬，容兄弟之女，及五服之親，故言同姓以廣之。所以先言諸姬，後姑姊者，便文互見，以諸姬總辭，又卑欲與謀婦人之禮也。姑姊尊，故云問，明亦與謀婦人之禮。此衛女思歸，但當思見諸姬而已，思與謀婦禮，觀其志意，是親親之恩也。" }
      - { type: j, text: "出宿於泲，飲餞於禰。泲，地名。祖而舍軷，飲酒於其側曰餞，重始有事於道也。禰，地名。箋雲：泲、禰者，所嫁國適衛之道所經，故思宿餞。○泲，子禮反。餞音踐，徐又才箭反，送行飲酒也。禰，乃禮反，地名，《韓詩》作“坭”，音同。軷，蒲末反，道祭也。女子有行，遠父母兄弟。箋雲：行，道也。婦人有出嫁之道，遠於親親，故禮緣人情，使得歸寧。○遠，於萬反，注同。問我諸姑，遂及伯姊。父之姊妹稱姑。先生曰姊。箋雲：寧則又問姑及姊，親其類也。先姑後姊，尊姑也。" }
      - { type: z, text: "“出宿”至“伯姊”。○正義曰：衛女思歸，言我思欲出宿於泲，先飲餞於禰，而出宿以鄉衛國，而以父母既沒，不得歸寧，故言女子生而有適人之道，遠於父母兄弟之親，故禮緣人情，使得歸寧。今何為不聽我乎？我之向衛，為覲問諸姑，遂及伯姊而已，豈為犯禮也哉！而止我也？○傳“泲，地名”至“禰，地名”。○正義曰：言祖而舍軷，飲酒於其側者，謂為祖道之祭，當釋酒脯於軷舍。軷即釋軷也。於時送者遂飲酒於祖側，曰餞。餞，送也。所以為祖祭者，重已方始有事於道，故祭道之神也。《聘禮記》曰：“出祖釋軷，祭酒脯，乃飲酒於其側。”注云：“祖，始也。既受聘享之禮，行出國門，止陳車騎，釋酒脯之奠於軷，為行始。《詩傳》曰：‘軷，道祭’，謂祭道路之神。《春秋傳》曰‘軷涉山川’，然則軷，山行之名也。道路以阻險為難，是以委土為山，或伏牲其上，使者為軷，祭酒脯，祈告。卿大夫處者於是餞之，飲酒於其側。禮畢，乘車轢之而遂行，舍於近郊矣。其牲犬羊可也。”《大馭》：“掌馭玉輅，及犯軷，遂驅之。”注云：“封土為山象，以菩芻棘柏為神主。既祭之，以車轢之而去，喻無險難也。”以此言之，軷者，本山行之名，以祭道路之神，求無險難，故取名焉。知出國而為之者，以《聘禮》、《烝民》、《韓奕》皆言出祖，則不在國內；以祖為行道之始，則不得至郊，故知在國門外也。以軷者軷壤之名，與中霤行神之位同，知“委土為山”。言“或伏牲其上”者，據天子諸侯有牲，卿大夫用酒脯而已。《犬人》雲“伏瘞亦如之”，明天子以犬伏於軷上。《羊人》無伏祭之事，則天子不用羊。《詩》雲“取羝以軷”，謂諸侯也。故云“其有牲，則犬羊耳”。謂天子以犬，諸侯以羊，尊卑異禮也。以《大馭》雲“犯軷”，即雲“遂驅之”，故知禮畢，乘車轢之也。以《聘禮》上文“既受聘享之禮”，雲“遂行，舍於郊”，故知轢之而遂行，舍於郊也。卿大夫之聘，出國則釋軷，聘禮於家，“又釋幣於行”。注云：“告將行也。行者之先，其古人之名未聞。天子諸侯有常祀，在冬。大夫三祀，曰門，曰行，曰厲。喪禮有毀宗躐行。出於大門，則行神之位在廟門外西方。今時民春秋祭祀有行神，古之遺禮。”是在家釋幣，告將行；出國門用酒脯以祈告，故二處不同也。《月令》：“冬其祀行。”注依中霤之禮雲：“行在廟門外之西，為軷壤，厚二寸，廣五尺，輪四尺。有主有屍，用特牲。”是天子諸侯常祀在冬，與軷異也。軷祭，則天子諸侯卿大夫皆於國外為之。《大馭》雲“犯軷”，《詩》雲“取羝以軷”，《聘禮》雲“釋軷”是也。又名祖，《聘禮》及《詩》雲“出祖”，是也。又名道，《曾子問》雲“道而出”，是也。以其為犯軷，祭道路之神，為行道之始，故一祭而三名也。皆先軷而飲餞，乃後出宿。此先言出宿者，見飲餞為出宿而設，故先言以致其意。《韓奕》雲：“韓侯出祖，出宿於屠。”既祖，即當出宿，故彼箋雲：“祖於國外，畢，乃出宿者，示行不留於是也。”欲先明祖必出宿，故皆先言出宿，後言飲餞也。《聘禮》“遂行，舍於郊”，則此出宿當在郊。而傳雲“泲，地名”，不言郊者，與下傳互也。下“幹”雲“所適國郊”，則此泲亦在郊也。此泲雲地名，則幹亦地名矣。正以《聘禮》“遂行，舍於郊”，則此衛女思宿焉，明亦在郊也。幹、泲思宿焉，傳以為在郊，則言禰思餞焉，差近在國外耳。計宿、餞當各在一處而已。而此雲泲、禰，下雲幹、言，別地者，下箋雲：“幹、言猶泲、禰，未聞遠近同異。”要是衛女所嫁國適衛之道所經見，所思之耳。下傳或兼雲“幹、言，所適國郊”者，一郊不得二地，宿餞不得同處，“言”，衍字耳。定本、《集註》皆雲“幹，所適國郊”。○箋“婦人”至“歸寧”。○正義曰：此與《蝃蝀》、《竹竿》文同而義異者，以此篇不得歸寧而自傷，故為由遠親親而望歸寧；《蝃蝀》刺其淫奔，故為禮自得嫁，何為淫奔；《竹竿》以不見答，思而能以禮，故為出嫁為常，不可違禮。詩者各本其意，故為義不同。○傳“父之”至“曰姊”。正義曰：《釋親》文。孫炎曰：“姑之言古，尊老之名也。”然則姑姊，尊長，則當已嫁，父母既沒，當不得歸。所以得問之者，諸侯之女有嫁於卿大夫者，去歸則見之。○箋“寧則”至“尊姑”。○正義曰：以上章思與諸姬謀，今復問姑及姊，故言“又”也。不問兄弟宗族，而問姑及姊，由親其類也。" }
      - { type: j, text: "出宿於幹，飲餞於言。幹、言，所適國郊也。箋雲：幹、言猶泲、禰，未聞遠近同異。載脂載舝，還車言邁。脂舝其車，以還我行也。箋雲：言還車者，嫁時乘來，今思乘以歸。○舝，胡瞎反，車軸頭金也。還音旋，此字例同音，更不重出。遄臻於衛，不瑕有害？遄，疾。臻，至。瑕，遠也。箋雲：瑕猶過也。害，何也。我還車疾至於衛而返，於行無過差，有何不可而止我？○遄，市專反。瑕音遐。害，毛如字，鄭音曷。行，下孟反。差，初懈反，又初加反，卷末注同。" }
      - { type: z, text: "“出宿”至“有害”。○毛以為，我思欲出宿於幹，先飲餞於言，而歸衛國耳。則為我脂車，則為我設舝，而還回其車，我則乘之以行。而欲疾至衛，不得為違禮遠義之害，何故不使我歸寧乎？傳以瑕為遠。王肅雲“言原疾至於衛，不遠禮義之害”，是也。○鄭唯“不瑕有害”為異。○傳“脂舝”至“我行”。○正義曰：古者車不駕則脫其舝，故《車舝》雲“間關車之舝兮”，傳曰“間關，設舝貌”，是也。今將行，既脂其車，又設其舝，故云“脂舝其車”。雲還者，本乘來，今欲乘以還，故箋雲：“言還車者，嫁時乘來，今思乘以歸。”" }
      - { type: j, text: "我思肥泉，茲之永歎。所出同、所歸異為肥泉。箋雲：茲，此也。自衛而來所渡水，故思此而長歎。○肥字或作“淝”，音同。" }
      - { type: z, text: "傳“所出同，所歸異，為肥泉”。○正義曰：《釋水》雲：“泉歸異出同流，肥。”○箋“自衛”至“渡水”。○正義曰：以下須、漕是衛邑，故知此肥泉是衛水也。思須與漕，我心悠悠。須、漕，衛邑也。箋雲：自衛而來所經邑，故又思之。○漕音曹。" }
      - { type: z, text: "傳“須、漕，衛邑”。○正義曰：《鄘》雲：“以廬於漕。”漕是衛邑，須與漕連，明亦衛邑。" }
      - { type: j, text: "駕言出游，以寫我憂。寫，除也。箋雲：既不得歸寧，且欲乘車出游，以除我憂。" }
      - { type: z, text: "箋“既不”至“我憂”。○正義曰：以此不得歸寧，而出游不過出國，故言且出游。《竹竿》不見答，故以出游為歸，是以彼箋雲：“適異國而不見答，其除此憂，維有歸耳。”" }
      - { type: j, text: "《泉水》四章，章六句。" }
      - { type: j, text: "《北門》，刺仕不得志也。言衛之忠臣不得其志爾。不得其志者，君不知巳志而遇困苦。" }
      - { type: z, text: "“《北門》三章，章七句”至“志爾”。○正義曰：謂衛君之闇，不知士有才能，不與厚祿，使之困苦，不得其志，故刺之也。經三章皆不得志之事也。言士者，有德行之稱。其仕為官，尊卑不明也。" }
      - { type: j, text: "出自北門，憂心殷殷。興也。北門背明鄉陰。箋雲：自，從也。興者，喻已仕於闇君，猶行而出北門，心為之憂殷殷然。○殷，本又作“{殷心}”，同於巾反，沈於文反，又音隱，《爾雅》雲：“憂也。”背，蒲對反。鄉，本又作“向”，同許亮反。為，於偽反。終窶且貧，莫知我艱。窶者，無禮也。貧者，困於財。箋雲：艱難也。君於已祿薄，終不足以為禮。又近困於財，無知已以此為難者。言君既然矣，諸臣亦如之。○窶，其矩反，無禮也，《爾雅》雲：“貧也。”案：謂貧無可為禮。已焉哉，天實為之，謂之何哉！箋雲：謂勤也。詩人事君無二志，故自決歸之於天。我勤身以事君，何哉？忠之至。" }
      - { type: z, text: "“出自”至“何哉”。○正義曰：衛之忠臣，不得其志。言人出自北門者，背明鄉陰而行，猶已仕於亂世，鄉於闇君而仕。由君之闇，已則為之憂心殷殷然。所以憂者，以君於已祿薄，使已終當窶陋，無財為禮，又且貧困，無資充用，而眾臣又莫知我貧窶之艱難者。君於已雖祿薄，已又不忍去之，止得守此貧困，故自決雲：已焉哉，我之困苦，天實為之。使我遭此君，我止當勤以事之，知復奈何哉！○傳“北門背明鄉陰”。○正義曰：本取人鄉陰行，似已仕闇君，故以出自北門為喻。傳以鄉陰者必背明耳，不取背明為義，何者？此人既仕闇君，雖困不去，非恨本不擇君，故知不以背明為喻也。○傳“窶者”至“於財”。○正義曰：《釋言》雲：“窶，貧也。”則貧、窶為一也。傳此經雲“終窶且貧”，為二事之辭，故為窶與貧別。窶謂無財可以為禮，故言“窶者，無禮”；貧謂無財可以自給，故言“貧者，困於財”。是以箋雲“祿薄，終不足以為禮”，是終窶也。“又近困於財”，是且貧也。言近者，已所資給，故言近；對以之為禮者，為遠也。無財謂之貧，此二者皆無財之事，故《爾雅》貧、窶通也。“終窶且貧”，言君於已祿薄，是君既然矣，莫知我艱，總謂人無知己，是諸臣亦如之。以頒祿由君，故怨已貧窶祿薄，不由諸臣，故但恨其不知已也。○箋“詩人”至“之至”。○正義曰：此詩人敘仕者之意，故謂之“詩人事君”，不知已而不去，是“無二志”也。己困苦，應去而不去，是終當貧困，故言“已焉哉”，是自決也。此實由君，言“天實為之”，是歸之於天也。君臣義合，道不行則去。今君於已薄矣，猶雲勤身以事之，知復何哉！無去心，是忠之至也。" }
      - { type: j, text: "王事適我，政事一埤益我。適，之。埤，厚也。箋雲：國有王命役使之事，則不以之彼，必來之我；有賦稅之事，則減彼一而以益我。言君政偏，己兼其苦。○埤，避支反。偏音篇。我入自外，室人交徧謫我。謫，責也。箋雲：我從外而入，在室之人更迭遍來責我，使已去也。言室人亦不知已志。○徧，古遍字，注及下同。凡徧字從行，偏字從人，後皆放此。謫，直革反，《玉篇》知革反。更音庚。迭，待結反。" }
      - { type: z, text: "“王事”至“謫我”。○正義曰：此仕者言君既昏闇，非直使已貧窶，又若國有王命役使之事，則不以之彼，必來之我，使已勞於行役；若有賦稅之事，則減彼一而厚益我，使己困於資財。君既政偏，己兼其苦，而我入自外而歸，則室家之人更迭而徧來責我。言君既政偏，爾何不去？此忠臣不忍去，而室人不知以責己。外為君所困，內為家人不知，故下又自決歸天。○傳“埤，厚”。○正義曰：謂減彼一以厚益己，使巳厚出賦稅之事是也。○箋“國有”至“其苦”。○正義曰：政事雲一埤益我，有可減一，則為賦稅之事。政事是賦稅，則王事是役使可知。役使之事，不之彼而之我，使我勞而彼逸；賦稅之事，減彼一而益我，使彼少而我多。此王事不必天子事，直以戰伐行役皆王家之事，猶《鴇羽》雲“王事靡盬”，於時甚亂，非王命之事也。○箋“我從”至“己志”。○正義曰：禮，君臣有合離之義。今遭困窮，而室人責之，故知使之去也。此士雖困，志不去君，而家人使之去，是不知己志。上言諸臣莫知我艱，故云室人亦不知己志。" }
      - { type: j, text: "已焉哉，天實為之，謂之何哉！" }
      - { type: j, text: "王事敦我，政事一埤遺我。敦，厚。遺，加也。箋雲：敦猶投擲也。○敦，毛如字；《韓詩》雲“敦，迫”；鄭都回反，投擿也。遺，唯季反。擿，呈釋反，與擲同；本或作“摘”，非。" }
      - { type: z, text: "傳“敦，厚”。箋“敦猶投擲”。○正義曰：箋以役事與之，無所為厚也。且上雲“適我”，此亦宜為“之己”之義，故易傳以為投擲於己也。" }
      - { type: j, text: "我入自外，室人交遍摧我。摧，沮也。箋雲：摧者，刺譏之言。○摧，徂回反，或作“催”，音同。《韓詩》作“訁崔”，音千隹、子隹二反，就也。沮，在呂反，何音阻。" }
      - { type: z, text: "傳“摧，沮”。箋“摧者，刺譏之言”。○正義曰：毛以為，室人更責則乖沮己志。定本、《集註》皆雲“摧，沮也”。箋以上章類之，言謫己者是室人責己，故以摧為刺譏己也。" }
      - { type: j, text: "已焉哉，天實為之，謂之何哉！" }
      - { type: j, text: "《北門》三章，章七句。" }
      - { type: j, text: "《北風》，刺虐也。衛國併為威虐，百姓不親，莫不相攜持而去焉。○攜，穴圭反。" }
      - { type: z, text: "“《北風》三章，章六句”至“去焉”。○正義曰：作《北風》詩者，刺虐也。言衛國君臣併為威虐，使國民百姓不親附之，莫不相攜持而去之，歸於有道也。此主刺君虐，故首章、二章上二句皆獨言君政酷暴。卒章上二句乃君臣並言也。三章次二句皆言攜持去之，下二句言去之意也。" }
      - { type: j, text: "北風其涼，雨雪其雱。興也。北風，寒涼之風。雱，盛貌。箋雲：寒涼之風，病害萬物。興者，喻君政教酷暴，使民散亂。○涼音良。雨，於付反，又如字，下同。雱，普康反。酷，苦毒反。惠而好我，攜手同行。惠，愛。行，道也。箋雲：性仁愛而又好我者，與我相攜持同道而去。疾時政也。○好，呼報反，下及注同。行音衡。其虛其邪？既亟只且！虛，虛也。亟，急也。箋雲：邪讀如徐。言今在位之人，其故威儀虛徐寬仁者，今皆以為急刻之行矣，所以當去，以此也。" }
      - { type: z, text: "“北風”至“只且”。○正義曰：言天既為北風，其寒涼矣，又加之雨雪其雱然而盛。由涼風盛雪，病害萬物，以興君政酷暴，病害百姓也。百姓既見病害，莫不散亂，故皆雲：彼有性仁愛而又好我者，我與此人攜手同道而去。欲以共歸有德。我所以去之者，非直為君之酷虐，而在位之臣，雖先日其寬虛，其舒徐，威儀謙退者，今莫不盡為急刻之行，故已所以去之。既，盡也。只且，語助也。○箋“寒涼”至“散亂”。○正義曰：風雪並喻君虐，而箋獨言涼風者，以風非所害物，但北風寒涼，故害萬物，與常風異，是以興君政酷暴也。而雪害物，不言可知。○“性仁”至“而去”。○正義曰：以經“攜手”之文承“惠好”之下，則與此惠而好我者相攜手也。○傳“虛，虛”。箋“邪讀如徐”。○正義曰：《釋訓》雲：“其虛其徐，威儀容止也。”孫炎曰：“虛、徐，威儀謙退也。”然則虛徐者，謙虛閒徐之義，故箋雲“威儀虛徐寬仁者”也。但傳質，詁訓疊經文耳，非訓虛為徐。此作“其邪”，《爾雅》作“其徐”，字雖異，音實同，故箋雲“邪讀如徐”。" }
      - { type: j, text: "北風其喈，雨雪其霏。喈，疾貌。霏，甚貌。○喈音皆。霏，芳非反。惠而好我，攜手同歸。歸有德也。其虛其邪？既亟只且！" }
      - { type: j, text: "莫赤匪狐，莫黑匪烏。狐赤烏黑，莫能別也。箋雲：赤則狐也，黑則烏也，猶今君臣相承，為惡如一。○別，彼竭反。" }
      - { type: z, text: "“莫赤”至“匪烏”。○正義曰：衛之百性疾其時政，以狐之類皆赤，烏之類皆黑，人莫能分別赤以為非狐者，莫能分別黑以為非烏者，由狐赤烏黑，其類相似，人莫能別其同異，以興今君臣為惡如一，似狐、烏相類，人以莫能別其同異。言君惡之極，臣又同之，已所以攜持而去之。○傳“狐赤”至“能別”。○正義曰：狐色皆赤，烏色皆黑，以喻衛之君臣皆惡也。人於赤狐之群，莫能別其赤而非狐者，言皆是狐；於黑烏之群，莫能別其黑而非烏者，言皆是烏，以喻於衛君臣，莫能別其非惡者，言皆為惡，故箋雲“猶今之君臣相承，為惡如一”也，故序雲“併為威虐”，經雲“莫赤”、“莫黑”，總辭，故知並刺君臣，以上下皆惡，故云相承也。" }
      - { type: j, text: "惠而好我，攜手同車。攜手就車。其虛其邪？既亟只且！" }
      - { type: j, text: "《北風》三章，章六句。" }
      - { type: j, text: "《靜女》，刺時也。衛君無道，夫人無德。以君及夫人無道德，故陳靜女遺我以彤管之法德，如是可以易之為人君之配。○遺，唯季反，下同。" }
      - { type: z, text: "“《靜女》三章，章四句”至“無德”。○正義曰：道德一也，異其文耳。經三章皆是陳靜女之美，欲以易今夫人也，庶輔臡於君，使之有道也。此直思得靜女以易夫人，非謂陳古也，故經雲“俟我”、“貽我”，皆非陳古之辭也。" }
      - { type: j, text: "靜女其姝，俟我於城隅。靜，貞靜也。女德貞靜而有法度，乃可說也。姝，美色也。俟，待也。城隅，以言高而不可逾。箋雲：女德貞靜，然後可畜；美色，然後可安。又能服從，待禮而動，自防如城隅，故可愛之。○姝，赤朱反，《說文》作“<女殳>”，雲“好也”。說音悅，篇末注同。愛而不見，搔首踟躕。言志往而行正。箋雲：志往謂踟躕，行正謂愛之而不往見。○搔，蘇刀反。踟，直知反。躕，直誅反。" }
      - { type: z, text: "“靜女”至“踟躕”。○正義曰：言有貞靜之女，其美色姝然，又能服從君子，待禮而後動，自防如城隅然，高而不可逾。有德如是，故我愛之，欲為人君之配。心既愛之，而不得見，故搔其首而踟躕然。○傳“女德”至“可逾”。○正義曰：言靜女，女德貞靜也。俟我於城隅，是有法度也。女德如是，乃可悅愛，故下雲“愛而不見”是也。姝、孌皆連靜女，靜既為德，故姝為美色也。《東方之日》傳：“姝者，初昏之貌。”以彼論初昏之事，亦是美色，故箋雲：“姝姝然美好之子。”《幹旄》傳曰：“姝，順貌。”以賢者告之善道，不以色，故為順，亦謂色美之順也。城隅高於常處，以喻女之自防深故。《周禮》“王城高七雉，隅九雉”，是高於常處也。○“女德”至“可愛”。○正義曰：箋解本舉女靜德與美色之意，言女德貞靜，然後可保畜也；有美色，然後可意安以為匹也，故德色俱言之。據女為說，故云服從、待禮，謂待君子媒妁聘好之禮，然後乃動。不為淫佚，是其自防如城隅，故可愛也。" }
      - { type: j, text: "靜女其孌，貽我彤管。既有靜德，又有美色，又能遺我以古人之法，可以配人君也。古者後夫人必有女史彤管之法，史不記過，其罪殺之。后妃群妾以禮御於君所，女史書其日月，授之以環，以進退之。生子月辰，則以金環退之。當御者，以銀環進之，著於左手；既御，著於右手。事無大小，記以成法。箋雲：彤管，筆赤管也。○貽，本又作“詒”，音怡，遺也，下同。下句協韻，亦音以志反。彤，徒冬反。彤，赤也。管，筆管。著，知略反，又直略反，下同。彤管有煒，說懌女美。煒，赤貌。彤管以赤心正人也。箋雲：“說懌”當作“說釋”。赤管煒煒然，女史以之說釋妃妾之德，美之。○煒，於鬼反。說，本又作“悅”，毛、王上音悅，下音亦。鄭：說音始悅反：懌作“釋”，始亦反。" }
      - { type: z, text: "“靜女”至“女美”。○毛以為，言有貞靜之女，其色孌然而美，又遺我以彤管之法，不違女史所書之事，成其妃妾之美。我欲易之，以為人君之妃。此女史彤管能成靜女之德，故嘉善此彤管之狀有煒煒然，而喜樂其能成女德之美。因靜女能循彤管之法，故又悅美彤管之能成靜女。王肅雲：“嘉彤管之煒煒然，喜樂其成女美也。”○鄭唯“說釋女美”為異。以上句既言遺我彤管之法，故說彤管以有法，由女史執之，以筆陳說而釋此妃妾之德美。有進退之法，而靜女不違，是遺我彤管之法也。○傳“既有”至“人君”。○正義曰：既有靜德，謂靜女也。又有美色，謂其孌也。遺我以古人之法，即貽我彤管也。○傳“古者”至“成法”。○正義曰：傳以經雲“貽我彤管”是女史之事，故具言女史之法也。《周禮》“女史八人”，注云：“女史，女奴曉書者。”其職雲：“掌王后之禮職，掌內治之貳，以詔後治內政。逆內宮，書內令。凡後之事，以禮從。”夫人女史亦如之，故此總雲“後夫人必有女史彤管之法”也。女史若有不記妃妾之過，其罪則殺之，謂殺此女史。凡后妃群妾以禮次序御於君所之時，使女史書其日月，使知某日某當御，某日當次某也。“授之以環，以進退之”者，即下句是也。“生子月辰”，謂將生子之月，故《內則》“妻將生子，及月辰，居側室”是也。此以月辰將產為文，實有娠即宜退之，故《生民》箋雲“於是遂有身而肅戒不復御”，是也。《內則》月辰所居側室者，為將產異其處，非謂始不御也。“當御，以銀環進之，著於左手；既御，乃著於右手。”金環不言著，略之。此妃妾進御煩碎之事，而令女史書之者，事無大小，記以成法也。此是女史之法。靜女遺我者，謂遺我不違女史之法，使妃妾德美也。此似有成文，未聞所出。定本、《集註》“女吏”皆作“女史”。○傳“彤管以赤心正人”。○正義曰：必以赤者，欲使女史以赤心正人，謂赤心事夫人，而正妃妾之次序也。○箋“說懌”至“美之”。○正義曰：以女史執此赤管而書，記妃妾進退日月所次序，使不違失，宜為書說而陳釋之，成此妃妾之德美，故美之也。" }
      - { type: j, text: "自牧歸荑，洵美且異。牧，田官也。荑，茅之始生也。本之於荑，取其有始有終。箋雲：洵，信也。茅，絜白之物也。自牧田歸荑，其信美而異者，可以供祭祀，猶貞女在窈窕之處，媒氏達之，可以配人君。○牧，州牧之牧，徐音目。荑，徒兮反。洵，本亦作“詢”，音荀。共音恭。窈，烏了反。窕，徒了反。處，昌慮反。匪女之為美，美人之貽。非為荑徒說美色而已，美其人能遺我法則。箋雲：遺我者，遺我以賢妃也。○為，於偽反，注同。或如字。" }
      - { type: z, text: "“自牧”至“之貽”。○毛以為，詩人既愛靜女而不能見，思有人歸之，言我欲令有人自牧田之所歸我以茅荑，信美好而且又異者，我則供之以為祭祀之用，進之於君，以興我原有人自深宮之所，歸我以貞信之女，信美好而又異者，我則進之為人君之妃。又言我所用此女為人君之妃者，由此女之美。我非徒悅其美色，又美此女人之能遺我彤管之法，故欲易之以配人君。○鄭唯下二句為異。言若有人能遺我貞靜之女，我則非此女之為美，言不美此女，乃美此人之遺於我者。愛而不見，冀於得之，故有人遺之，則美其所遺之人也。○傳“荑茅”至“有終”。○正義曰：傳以茅則可以供祭祀之用。荑者，茅之始生，未可供用，而本之於荑者，欲取興女有始有終，故舉茅生之名也。言始為荑，終為茅，可以供祭祀，以喻始為女能貞靜，終為婦有法則，可以配人君。○箋“茅絜”至“人君”。○正義曰：箋解以茅喻之意。以茅絜白之物，信美而異於眾草，故可以供祭祀，喻靜女有德，異於眾女，可以配人君，故言洵美且異也。言供祭祀之用者，祭祀之時，以茅縮酒。《左傳》曰“爾貢包茅不入，王祭不供，無以縮酒”是也。定本、《集註》雲“信美而異者”。○箋“遺我”至“賢妃”。○正義曰：箋以上“自牧歸荑”，欲人貽己以美女，此言“非女之為美，美人之貽”，則非美其女，美貽己之人也，故易之以為遺我以賢妃也。" }
      - { type: j, text: "《靜女》三章，章四句。" }
      - { type: j, text: "《新臺》，刺衛宣公也。納伋之妻，作新臺於河上而要之。國人惡之，而作是詩也。伋，宣公之世子。○新臺，脩舊曰新。《爾雅》雲：“四方而高曰臺。”孔安國雲：“土高曰臺。”伋音急，宣公世子名。要，於遙反。惡，烏路反。" }
      - { type: z, text: "“《新臺》三章，章四句”至“是詩”。○正義曰：此詩伋妻蓋自齊始來，未至於衛，而公聞其美，恐不從己，故使人於河上為新臺，待其至於河，而因臺所以要之耳。若已至國，則不須河上要之矣。" }
      - { type: j, text: "新臺有泚，河水瀰瀰。泚，鮮明貌。瀰瀰，盛貌。水所以絜汙穢，反於河上而為淫昏之行。○泚音此，徐又七禮反，鮮明貌。《說文》作“玼”，雲：“新色鮮也。”彌，莫爾反，徐又莫啟反，水盛也。《說文》雲：“水滿也。”汙音烏。行，下孟反。篇注同。燕婉之求，籧篨不鮮。燕，安。婉，順也。籧篨，不能俯者。箋雲：鮮，善也。伋之妻，齊女，來嫁於衛。其心本求燕婉之人，謂伋也，反得籧篨不善，謂宣公也。籧篨口柔，常觀人顏色而為之辭，故不能俯也。○燕，於典反，又於見反，安也。婉，迂阮反，徐於管反。籧音渠。篨音儲。鮮，斯踐反；王，少也；依鄭又音仙。" }
      - { type: z, text: "“新臺”至“不鮮”。○毛以為，衛人惡公納伋之妻，故言所要之處。雲公新作高臺，有泚然鮮明，在於河水瀰瀰之處，而要齊女以為淫昏也。水者所以絜汙穢，反於河上作臺而為淫昏之行，是失其所也。又言齊女來嫁，本燕婉之人，是求欲以配伋，乃今為所要，反得行籧篨佞媚之行不少者之宣公，是非所求也。○鄭唯“不鮮”為異。○傳“此鮮”至“之行”。○正義曰：此與下傳互也。臺泚言鮮明，下言高峻，見臺體高峻而其狀鮮明也。河彌言盛貌，下言平地，見河在平地而波流盛也。以公作臺要齊女，故須言臺。又言河水者，表作臺之處也。言水流之盛者，言水之盛流，當以絜汙穢，而公反於其上為淫昏，故惡之也。○傳“籧篨，不能俯者”。○正義曰：籧篨、戚施，本人疾之名，故《晉語》雲“籧篨不可使俯，戚施不可使仰”，是也。但人口柔者，必仰面觀人之顏色而為辭，似籧篨不能俯之人，因名口柔者為籧篨。面柔者，必低首下人，媚以容色，似戚施之人，因名面柔者為戚施。故箋雲“籧篨口柔，常觀人顏色而為之辭，故不能俯。”戚施面柔，下人以色，故不能仰也。時宣公為此二者，故惡而比之，非宣公實有二病，故箋申傳意，以為口柔、面柔也。籧篨口柔，戚施面柔，《釋訓》文。李巡曰：“籧篨巧言好辭，以口饒人，是謂口柔。戚施和顏悅色以誘人，是謂面柔也。”" }
      - { type: j, text: "新臺有灑，河水浼浼。灑，高峻也。浼浼，平地也。○灑，七罪反，《韓詩》作“漼”，音同，雲“鮮貌”。浼，每罪反，《韓詩》作“浘”。浘音尾，雲“盛貌”。燕婉之求，籧篨不殄。殄，絕也。箋雲：殄當作腆。腆，善也。殄，毛徒典反，鄭改作“腆”，吐典反。" }
      - { type: z, text: "傳“殄，絕”。○正義曰：《釋詁》文。言齊女反得籧篨之行而不絕者，謂行之不止常然。推此則首章“鮮”為“少”，傳不言耳，故王肅亦為“少”也。○殄當作“腆”。腆，善。○正義曰：箋雲籧篨口柔，當不能俯，言“少”與“不絕”，非類也，故以上章“鮮”為“善”，讀此“殄”為“腆”。腆與殄，古今字之異，故《儀禮》注云“腆，古文字作殄”，是也。" }
      - { type: j, text: "魚網之設，鴻則離之。言所得非所求也。箋雲：設魚網者宜得魚，鴻乃鳥也，反離焉。猶齊女以禮來求世子，而得宣公。燕婉之求，得此戚施。戚施，不能仰者。箋雲：戚施面柔，下人以色，故不能仰也。○戚，幹歷反。下，遐嫁反。" }
      - { type: j, text: "《新臺》三章，章四句。" }
      - { type: j, text: "《二子乘舟》，思伋、壽也。衛宣公之二子爭相為死，國人傷而思之，作是詩也。○為，於偽反。" }
      - { type: z, text: "“《二子乘舟》二章，章四句”至“是詩”。○正義曰：作《二子乘舟》詩者，思伋、壽也。衛宣公之二子伋與壽，爭相為死，故國人哀傷而思念之，而作是《二子乘舟》之詩也。二子爭相為死，即首章二句是也。國人傷而思之，下二句是也。" }
      - { type: j, text: "二子乘舟，汎汎其景。二子，伋、壽也。宣公為伋取於齊女而美，公奪之，生壽及朔。朔與其母愬伋於公，公令伋之齊，使賊先待於隘而殺之。壽知之，以告伋，使去之。伋曰：“君命也，不可以逃。”壽竊其節而先往，賊殺之。伋至，曰：“君命殺我，壽有何罪？”賊又殺之。國人傷其涉危遂往，如乘舟而無所薄，汎汎然迅疾而不礙也。○汎、芳劍反。景如字，或音影。愬，蘇路反。令，力征反。隘，於賣反。駛疾，所吏反；本或無“駛”字；一本作“迅疾”。原言思子，中心養養。願，每也。養養然憂不知所定。箋雲：願，念也。念我思此二子，心為之憂養養然。" }
      - { type: z, text: "“二子”至“養養”。○毛以為，二子伋、壽爭相為死，赴死似歸，不顧其生，如乘舟之無所薄，觀之汎汎然，見其影之去往而不礙。猶二子爭死，遂往而亦不礙也。故我國人傷之，每有所言，思此二子，則中心為之憂養養然，不知所定。○鄭唯以“原言思子”為“念我思此二子”為異。○傳“二子”至“不礙”。○正義曰：以序雲“思伋、壽”，故知二子伋、壽也。傳因言二子爭死之由，其言與桓十六年《左傳》小異大同也。此言“愬伋於公”，《傳》言“構伋子”。服虔雲“構，會其過惡”，亦是愬之也。此言“先待於隘”，《傳》言“使盜待諸莘”。服虔雲“莘，衛東地”，則莘與隘一處也。此言君命不可逃也，壽竊其節而先往，《傳》言“壽子告之，使行。不可，曰：棄父之命，惡用子矣？有無父之國則可也。‘及行，飲以酒。壽子載其旌以先”。此文不足，亦當如《傳》飲以酒也。旌、節不同，蓋載旌旗以為節信也。《衛世家》所說與《左傳》略同，雲“壽盜其白旄而先”。言白旄者，或以白旄為旌節也。言“國人傷其涉危遂往”者，解經以乘舟為喻之意。以二子遂往，不愛其死，如乘舟無所薄，汎汎然迅疾而不礙。無所薄猶涉危也，謂涉渡危難而取死。下言“其影”，以其影謂舟影，觀其去而見其影，義取其遂往不還，故卒章雲“其逝”。傳曰“逝，往”，謂舟汎汎然，其形往，影形可見，故言往也。" }
      - { type: j, text: "二子乘舟，汎汎其逝。逝，往也。" }
      - { type: j, text: "原言思子，不瑕有害。言二子之不遠害。箋雲：瑕猶過也。我思念此二子之事，於行無過差，有何不可而不去也？○害，毛如字，鄭音曷，何也。遠，於萬反。" }
      - { type: z, text: "“二子”至“有害”。○正義曰：下二句毛、鄭別。○箋“我念”至“不去”。○正義曰：此國人思念之至，故追言其本，何為不去而取死。深閔之之辭也。" }
      - { type: j, text: "《二子乘舟》二章，章四句。" }
      - { type: j, text: "邶國十九篇，七十一章，三百六十三句。" }
      - { type: j, text: "《毛詩正義》" }
