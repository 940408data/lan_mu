# 大学章句（当涂郡斋刊递修本·善本底）：j 为经传大字，z 为章句小字。版面结构先行：顶格经/退格注。
sections:
  - id: xu
    name: 序
    blocks:
      - { type: j, text: 大學章句序大學之書古之大學所以教人之法也蓋自天降生民則旣莫不與之以仁義禮智之性然其氣質之稟或不能齊是以不能皆有以知其性之所有而全之也一有聰明睿智能盡其性者出於其閒則天必命之以爲億兆之君師使之治而教之以復其性此伏羲神農黃帝堯舜所以繼天立極而司徒之職典樂之官所由設也三代之隆其法寖備然後王宮國都以及閭巷莫不有學人生八歲則自王公以下至於庶人之子弟皆入小學而教之以洒埽應對進退之節禮樂射御書數之文及其十有五年則自天子之元子衆子以至公卿大夫元士之適子與凡民之俊秀皆入大學而教之以窮理正心修己治人之道此又學校之教大小之節所以分也夫以學校之設其廣如此教之之術其次第節目之詳又如此而其所以爲教則又皆本之人君躬行心得之餘不待求之民生日用彝倫之外是以當世之人無不學其學焉者無不有以知其性分之所固有職分之所當爲而各俛焉以盡其力此古昔盛時所以治隆於上俗美於下而非後世之所能及也及周之衰賢聖之君不作學校之政不修教化陵夷風俗頹敗時則有若孔子之聖而不得君師之位以行其政教於是獨取先王之法誦而傳之以詔後世若曲禮少儀內則弟子職諸篇固小學之支流餘裔而此篇者則因小學之成功以著大學之明法外有以極其規模之大而內有以盡其節目之詳者也三千之徒蓋莫不聞其說而曾氏之傳獨得其宗於是作爲傳義以發其意及孟子没而其傳泯焉則其書雖存而知者鮮矣自是以來俗儒記誦詞章之習其功倍於小學而無用異端虛無寂滅之教其高過於大學而無實其他權謀術數一切以就功名之說與夫百家衆技之流所以惑世誣民充塞仁義者又紛然雜出乎其聞使其君子不幸而不得聞大道之要其小人不幸而不得蒙至治之澤晦盲否塞反覆沈痼以及五季之衰而壞亂極矣天運循環無往不復宋德隆盛治教休明於是河南程氏兩夫子出而有以接乎孟氏之傳實始尊信此篇而表章之旣又爲之次其簡編發其歸趣然後古者大學教人之法聖經賢傳之指粲然復明於世雖以熹之不敏亦幸私淑而與有聞焉顧其爲書猶頗放失是以忘其固陋采而輯之閒亦竊附己意補其闕略以俟後之君子極知僣踰無所逃罪然於國家化民成俗之意學者修己治人之方則未必無小補云淳熙己酉二月甲子新安朱熹序 }
  - id: jing
    name: 經一章
    blocks:
      - { type: j, text: 大學朱熹章句 }
      - { type: z, text: 大舊音泰今讀如字 }
      - { type: j, text: 子程子曰大學孔氏之遺書而初學入德之門也於今可見古人為學次第者獨賴此篇之存而論孟次之學者必由是而學焉則庶乎其不差矣大學之道在明明德在親民在止於至善 }
      - { type: z, text: 程子曰親當作新○大學者大人之學也明明之也明德者人之所得乎天而虛靈不昧以具衆理而應萬事者也但爲氣稟所拘人欲所蔽則有時而昏然其本體之明則有未嘗息者故學者當因其所發而遂明之以復其初也新者革其舊之謂也言旣自明其明德又當推以及人使之亦有以去其舊染之汙也止者必至於是而不遷之意至善則事理當然之極也言明明德新民皆當至於至善之地而不遷蓋必其有以盡夫天理之極而無一毫人欲之私也此三者大學之綱領也 }
      - { type: j, text: 知止而后有定定而后能靜靜而后能安安而后能慮慮而后能得 }
      - { type: z, text: 后與後同後放此○止者所當止之地即至善之所在也知之則志有定向靜謂心不妄動安謂所處而安慮謂處事精詳得謂得其所止 }
      - { type: j, text: 物有本末事有終始知所先後則近道矣 }
      - { type: z, text: 明德為本新民為末知止為始能得為終本始所先末終所後此結上文兩節之意 }
      - { type: j, text: 古之欲明明德於天下者先治其國欲治其國者先齊其家欲齊其家者先脩其身欲脩其身者先正其心欲正其心者先誠其意欲誠其意者先致其知致知在格物 }
      - { type: z, text: 治平聲後放此○明明德於天下者使天下之人皆有以明其明德也心者身之所主也誠實也意者心之所發也實其心之所發欲其一於善而無自欺也致推極也知猶識也推極吾之知識欲其所知無不盡也格至也物猶事也窮至事物之理欲其極處無不到也此八者大學之條目也 }
      - { type: j, text: 物格而后知至知至而后意誠意誠而后心正心正而后身脩身脩而后家齊家齊而后國治國治而后天下平 }
      - { type: z, text: 治去聲後放此○物格者物理之極處無不到也知至者吾心之所知無不盡也知既盡則意可得而實矣意既實則心可得而正矣脩身以上明明德之事也齊家以下新民之事也物格知至則知所止矣意誠以下則皆得所止之序也 }
      - { type: j, text: 自天子以至於庶人壹是皆以脩身爲本 }
      - { type: z, text: 壹是一切也正心以上皆所以脩身也齊家以下則舉此而錯之耳 }
      - { type: j, text: 其本亂而末治者否矣其所厚者薄而其所薄者厚未之有也 }
      - { type: z, text: 本謂身也所厚謂家也此兩節結上文兩節之意 }
  - id: zhuan1
    name: 傳之首章
    blocks:
      - { type: j, text: 之凡二百五字其傳十章則曾子之意 }
      - { type: z, text: 而門人記之也舊本頗有錯簡今因程子所定而更考經文别爲序次如左凡千五百四十六字凡傳文雜引經傳若無統紀然文理接續血脉貫通深淺始終至爲精宻熟讀詳味乆當見之今不盡釋也 }
      - { type: j, text: 康誥曰克明德 }
      - { type: z, text: 康誥周書克能也 }
      - { type: j, text: 大甲曰顧諟天之明命 }
      - { type: z, text: 大讀作泰諟古是字○大甲商書顧謂常目在之也諟猶此也或曰審也天之明命即天之所以與我而我之所以爲德者也常目在之則無時不明矣 }
      - { type: j, text: 帝典曰克明峻德 }
      - { type: z, text: 峻書作俊○帝典堯典虞書峻大也 }
      - { type: j, text: 皆自明也 }
      - { type: z, text: 結所引書皆言自明己德之意 }
  - id: zhuan2
    name: 傳之二章
    blocks:
      - { type: z, text: 此通下三章至止於信舊本誤在沒世不忘之下 }
      - { type: j, text: 湯之盤銘曰苟日新日日新又日新 }
      - { type: z, text: 盤沐浴之盤也銘名其器以自警之辭也苟誠也湯以人之洗濯其心以去惡如沐浴其身以去垢故銘其盤言誠能一日有以滌其舊染之汙而自新則當因其已新者而日日新之又曰新之不可略有閒斷也 }
      - { type: j, text: 康誥曰作新民 }
      - { type: z, text: 鼓之舞之之謂作言振起其自新之民也 }
      - { type: j, text: 詩曰周雖舊邦其命惟新 }
      - { type: z, text: 詩大雅文王之篇言周國雖舊至於文王能新其德以及於民而始受天命也 }
      - { type: j, text: 是故君子無所不用其極 }
      - { type: z, text: 自新新民皆欲止於至善也 }
  - id: zhuan3
    name: 傳之三章
    blocks:
      - { type: j, text: 詩云邦畿千里惟民所止 }
      - { type: z, text: 詩商頌玄鳥之篇邦畿王者之都也止居也言物各有所當止之處也 }
      - { type: j, text: 詩云緡蠻黃鳥止于丘隅子曰於止知其所止可以人而不如鳥乎 }
      - { type: z, text: 緡詩作綿○詩小雅綿蠻之篇緡蠻鳥聲丘隅岑蔚之處子曰以下孔子說詩之辭言人當知所當止之處也 }
      - { type: j, text: 詩云穆穆文王於緝熙敬止為人君止於仁為人臣止於敬為人子止於孝為人父止於慈與國人交止於信 }
      - { type: z, text: 於緝之於音烏○詩文王之篇穆穆深遠之意於歎美辭緝繼續也熙光明也敬止言其無不敬而安所止也引此而言聖人之止無非至善五者乃其目之大者也學者於此究其精微之蘊而又推類以盡其餘則於天下之事皆有以知其所止而無疑矣 }
      - { type: j, text: 詩云瞻彼淇澳菉竹猗猗有斐君子如切如磋如琢如磨瑟兮僩兮赫兮喧兮有斐君子終不可諠兮如切如磋者道學也如琢如磨者自脩也瑟兮僩兮者恂慄也赫兮喧兮者威儀也有斐君子終不可諠兮者道盛德至善民之不能忘也 }
      - { type: z, text: 澳於六反菉詩作綠猗叶韻音阿僩下版反喧詩作咺諠詩作諼並況晚反恂鄭氏讀作峻○詩衛風淇澳之篇淇水名澳隈也猗猗美盛貌興也斐文貌切以刀鋸琢以椎鑿皆裁物使成形質也磋以鑢鐋磨以沙石皆治物使其滑澤也治骨角者既切而復磋之治玉石者既琢而復磨之皆言其治之有緒而益致其精也瑟嚴密之貌僩武毅之貌赫喧宣著盛大之貌諠忘也道言也學謂講習討論之事自脩者省察克治之功恂慄戰懼也威可畏也儀可象也引詩而釋之以明明明德者之止於至善道學自脩言其所以得之之由恂慄威儀言其德容表裏之盛卒乃指其實而歎美之也 }
      - { type: j, text: 詩云於戲前王不忘君子賢其賢而親其親小人樂其樂而利其利此以沒世不忘也 }
      - { type: z, text: 於戲音嗚呼樂音洛○詩周頌烈文之篇於戲嘆辭前王謂文武也君子謂其後賢後王小人謂後民也此言前王所以新民者止於至善能使天下後世無一物不得其所所以旣没世而人思慕之愈乆而不忘也此兩節咏嘆淫泆其味深長當熟玩之 }
  - id: zhuan4
    name: 傳之四章
    blocks:
      - { type: z, text: 此章内自引淇澳詩以下舊本誤在誠意章下 }
      - { type: j, text: 子曰聽訟吾猶人也必也使無訟乎無情者不得盡其辭大畏民志此謂知本猶人不異於人也情實也引夫子之言而言聖人能使無實之人不敢盡其虛誕之辭蓋我之明德旣明自然有以畏服民之心志故訟不待聽而自無也觀於此言可以知本末之先後矣 }
  - id: zhuan5
    name: 傳之五章
    blocks:
      - { type: z, text: 此章舊本誤在止於信下 }
      - { type: j, text: 此謂知本 }
      - { type: z, text: 程子曰衍文也 }
      - { type: j, text: 此謂知之至也 }
      - { type: z, text: 此句之上別有闕文此特其結語耳 }
  - id: zhuan6
    name: 傳之六章
    blocks:
      - { type: z, text: 而今云矣此章舊本通下章誤在經文之下閒嘗竊取程子之意以補之曰所謂致知在格物者言欲致吾之知在即物而窮其理也蓋人心之靈莫不有知而天下之物莫不有理惟於理有未窮故其知有不盡也是以大學始教必使學者即凡天下之物莫不因巳知之理而益窮之以求至乎其極至於用力之乆而一旦豁然貫通焉則衆物之表裏精粗無不到而吾心之全體大用無不明矣此謂物格此謂知之至也 }
      - { type: j, text: 所謂誠其意者毋自欺也如惡惡臭如好好色此之謂自謙故君子必愼其獨也 }
      - { type: z, text: 惡好上字皆去聲謙讀爲慊苦刼反○誠其意者自脩之首也毋者禁止之辭自欺云者知爲善以去惡而心之所發有未實也慊快也足也獨者人所不知而巳所獨知之地也言欲自脩者知爲善以去其惡則當實用其力而禁止其自欺使其惡惡則如惡惡臭好善則如好好色皆務决去而求必得之以自快足於己不可徒苟且以徇外而爲人也然其實與不實蓋有他人所不及知而己獨知之者故必謹之於此以審其幾焉 }
      - { type: j, text: 小人閒居爲不善無所不至見君子而后厭然揜其不善而著其善人之視己如見其肺肝然則何益矣此謂誠於中形於外故君子必慎其獨也 }
      - { type: z, text: 閒音閑厭鄭氏讀爲黶○閒居獨處也厭然銷沮閉藏之貌此言小人陰爲不善而陽欲揜之則是非不知善之當爲與惡之當去也但不能實用其力以至此耳然欲揜其惡而卒不可揜欲詐爲善而卒不可詐則亦何益之有哉此君子所以重以爲戒而必謹其獨也 }
      - { type: j, text: 曾子曰十目所視十手所指其嚴乎 }
      - { type: z, text: 引此以明上文之意言雖幽獨之中而其善惡之不可揜如此可畏之甚也 }
      - { type: j, text: 富潤屋德潤身心廣體胖故君子必誠其意 }
      - { type: z, text: 胖步丹反○胖安舒也言富則能潤屋矣德則能潤身矣故心無愧怍則廣大寬平而體常舒泰德之潤身者然也蓋善之實於中而形於外者如此故又言此以結之 }
  - id: zhuan7
    name: 傳之七章
    blocks:
      - { type: z, text: 經曰欲誠其意先致其知又曰知至而后意誠蓋心體之明有所未盡則其所發必有不能實用其力而苟焉以自欺者然或已明而不謹乎此則其所明又非已有而無以爲進德之基故此章之指必承上章而通考之然後有以見其用力之始終其序不可亂而功不可闕如此云 }
      - { type: j, text: 所謂脩身在正其心者身有所忿懥則不得其正有所恐懼則不得其正有所好樂則不得其正有所憂患則不得其正 }
      - { type: z, text: 程子曰身有之身當作心忿弗粉反懥敕值反好樂並去聲○忿懥怒也蓋是四者皆心之用而人所不能無者然一有之而不能察則欲動情勝而其用之所行或不能不失其正矣 }
      - { type: j, text: 心不在焉視而不見聽而不聞食而不知其味 }
      - { type: z, text: 心有不存則無以檢其身是以君子必察乎此而敬以直之然後此心常存而身無不脩也 }
      - { type: j, text: 此謂脩身在正其心 }
  - id: zhuan8
    name: 傳之八章
    blocks:
      - { type: z, text: 此亦承上章以起下章蓋意誠則眞無惡而實有善矣所以能存是心以檢其身然或但知誠意而不能密察此心之存否則又無以直内而脩身也○自此以下並以舊文爲正 }
      - { type: j, text: 所謂齊其家在脩其身者人之其所親愛而辟焉之其所賤惡而辟焉之其所畏敬而辟焉之其所哀矜而辟焉之其所敖惰而辟焉故好而知其惡惡而知其美者天下鮮矣 }
      - { type: z, text: 辟讀爲僻惡而之惡敖好並去聲鮮上聲○人謂衆人之猶於也辟猶偏也五者在人本有當然之則然常人之情惟其所向而不加審焉則必陷於一偏而身不脩矣 }
      - { type: j, text: 故諺有之曰人莫知其子之惡莫知其苗之碩 }
      - { type: z, text: 諺音彦碩叶韻時若反○諺俗語也溺愛者不明貪得者無厭是則偏之爲害而家之所以不齊也 }
      - { type: j, text: 此謂身不脩不可以齊其家 }
  - id: zhuan9
    name: 傳之九章
    blocks:
      - { type: j, text: 所謂治國必先齊其家者其家不可教而能教人者無之故君子不出家而成教於國孝者所以事君也弟者所以事長也慈者所以使衆也 }
      - { type: z, text: 弟去聲長上聲○身脩則家可教矣孝弟慈所以脩身而教於家者也然而國之所以事君事長使衆之道不外乎此此所以家齊於上而教成於下也 }
      - { type: j, text: 康誥曰如保赤子心誠求之雖不中不遠矣未有學養子而后嫁者也 }
      - { type: z, text: 中去聲○此引書而釋之又明立教之本不假強爲在識其端而推廣之耳 }
      - { type: j, text: 一家仁一國興仁一家讓一國興讓一人貪戾一國作亂其機如此此謂一言僨事一人定國 }
      - { type: z, text: 僨音奮○一人謂君也機發動所由也僨覆敗也此言教成於國之效 }
      - { type: j, text: 堯舜帥天下以仁而民從之桀紂帥天下以暴而民從之其所令反其所好而民不從是故君子有諸己而后求諸人所藏乎身不恕而能喻諸人者未之有也 }
      - { type: z, text: 好去聲○此又承上文一人定國而言有善於己然後可以責人之善無惡於己然後可以正人之惡皆推己以及人所謂恕也不如是則所令反其所好而民不從矣喻曉也 }
      - { type: j, text: 故治國在齊其家 }
      - { type: z, text: 通結上文 }
      - { type: j, text: 詩云桃之夭夭其葉蓁蓁之子于歸宜其家人宜其家人而后可以教國人 }
      - { type: z, text: 夭平聲蓁音臻○詩周南桃夭之篇夭夭少好貌蓁蓁美盛貌興也之子 }
      - { type: j, text: 猶言是子此指女子之嫁者而言也 }
      - { type: z, text: 婦人謂嫁曰歸宜猶善也 }
      - { type: j, text: 詩云宜兄宜弟宜兄宜弟而后可以教國人 }
      - { type: z, text: 詩小雅蓼蕭篇 }
      - { type: j, text: 詩云其儀不忒正是四國其爲父子兄弟足法而后民法之也 }
      - { type: z, text: 詩曹風鳴鳩篇忒差也 }
      - { type: j, text: 此謂治國在齊其家 }
      - { type: z, text: 此三引詩皆以咏歎上文之事而又結之如此其味深長最宜潜玩 }
  - id: zhuan10
    name: 傳之十章
    blocks:
      - { type: j, text: 所謂平天下在治其國者上老老而民興孝上長長而民興弟上恤孤而民不倍是以君子有絜矩之道也 }
      - { type: z, text: 長上聲弟去聲倍與背同絜胡結反○老老所謂老吾老也興謂有所感發而興起也孤者幼而無父之稱絜度也矩所以爲方也言此三者上行下效捷於影響所謂家齊而國治也亦可以見人心之所同而不可使有一夫之不獲矣是以君子必當因其所同推以度物使彼我之閒各得分願則上下四旁均齊方正而天下平矣 }
      - { type: j, text: 所惡於上毋以使下所惡於下毋以事上所惡於前毋以先後所惡於後毋以從前所惡於右毋以交於左所惡於左毋以交於右此之謂絜矩之道 }
      - { type: z, text: 惡先並去聲○此覆解上文絜矩二字之義如不欲上之無禮於我則必以此度下之心而亦不敢以此無禮使之不欲下之不忠於我則必以此度上之心而亦不敢以此不忠事之至於前後左右無不皆然則身之所處上下四旁長短廣狹彼此如一而無不方矣彼同有是心而興起焉者又豈有一夫之不獲哉所操者約而所及者廣此平天下之要道也故章內之意皆自此而推之 }
      - { type: j, text: 詩云樂只君子民之父母民之所好好之民之所惡惡之此之謂民之父母 }
      - { type: z, text: 樂音洛只音紙好惡並去聲下並同○詩小雅南山有臺之篇只語助辭言能絜矩而以民心爲己心則是愛民如子而民愛之如父母矣 }
      - { type: j, text: 詩云節彼南山維石巖巖赫赫師尹民具爾瞻有國者不可以不愼辟則爲天下僇矣 }
      - { type: z, text: 節讀爲截辟讀爲僻僇與戮同○詩小雅節南山之篇節截然髙大貌師尹周太師尹氏也具俱也辟偏也言在上者人所瞻仰不可不謹若不能絜矩而好惡徇於一己之偏則身弑國亡爲天下之大戮矣 }
      - { type: j, text: 詩云殷之未喪師克配上帝儀監于殷峻命不易道得衆則得國失衆則失國 }
      - { type: z, text: 喪去聲儀詩作宜峻詩作駿易去聲○詩文王篇師衆也配對也配上帝言其爲天下君而對乎上帝也監視也峻大也不易言難保也道言也引詩而言此以結上文兩節之意有天下者能存此心而不失則所以絜矩而與民同欲者自不能已矣 }
      - { type: j, text: 是故君子先愼乎德有德此有人此有土有土此有財有財此有用 }
      - { type: z, text: 先謹乎德承上文不可不謹而言德即所謂明德有人謂得衆有土謂得國有國則不患無財用矣 }
      - { type: j, text: 德者本也財者末也 }
      - { type: z, text: 本上文而言 }
      - { type: j, text: 外本内末爭民施奪 }
      - { type: z, text: 人君以德爲外以財爲内則是爭闘其民而施之以刼奪之教也蓋財者人之所同欲不能絜矩而欲專之則民亦起而爭奪矣 }
      - { type: j, text: 是故財聚則民散財散則民聚 }
      - { type: z, text: 外本内末故財聚爭民施奪故民散反是則有德而有人矣 }
      - { type: j, text: 是故言悖而岀者亦悖而入貨悖而入者亦悖而出 }
      - { type: z, text: 悖布内反○悖逆也此以言之出入明貨之出入也自先謹乎德以下至此又因財貨以明能絜矩與不能者之得失也 }
      - { type: j, text: 康誥曰惟命不于常道善則得之不善則失之矣 }
      - { type: z, text: 道言也因上文引文王詩之意而申言之其丁寧反覆之意益深切矣 }
      - { type: j, text: 楚書曰楚國無以為寶惟善以為寶 }
      - { type: z, text: 楚書楚語言不寶金玉而寶善人也 }
      - { type: j, text: 舅犯曰亡人無以為寶仁親以為寶 }
      - { type: z, text: 舅犯晉文公舅狐偃字子犯亡人文公時為公子出亡在外也仁愛也事見檀弓此兩節又明不外本而内末之意 }
      - { type: j, text: 秦誓曰若有一个臣斷斷兮無他技其心休休焉其如有容焉人之有技若己有之人之彦聖其心好之不啻若自其口出寔能容之以能保我子孫黎民尚亦有利哉人之有技媢疾以惡人之之彦聖而違之俾不通寔不能容以不能保我子孫黎民亦曰殆哉 }
      - { type: z, text: 个古賀反書作介斷丁亂反媢音冒○秦誓周書斷斷誠一之貌彦美士也聖通明也尚庶幾也媢忌也違拂戾也殆危也 }
      - { type: j, text: 唯仁人放流之迸諸四夷不與同中國此謂唯仁人為能愛人能惡人 }
      - { type: z, text: 迸讀為屏古字通用○迸猶逐也言有此媢疾之人妨賢而病國則仁人必深惡而痛絕之以其至公無私故能得好惡之正如此也 }
      - { type: j, text: 見賢而不能舉舉而不能先命也見不善而不能退退而不能遠過也命鄭氏云當作慢程子云當作怠未詳孰是遠去聲若此者知所愛惡矣而未能盡愛惡之道蓋君子而未 }
      - { type: z, text: 仁者也 }
      - { type: j, text: 好人之所惡惡人之所好是謂拂人之性菑必逮夫身 }
      - { type: z, text: 菑古灾字夫音扶○拂逆也好善而 }
      - { type: j, text: 惡惡人之性也至於拂人之性則不仁之甚者也自秦誓至此又皆以申言好惡公私之極以明上文所引南 }
      - { type: z, text: 山有臺節南山之意 }
      - { type: j, text: 是故君子有大道必忠信以得之驕泰以失之君子以位言之道謂居其位而脩己 }
      - { type: z, text: 治人之術發己自盡爲忠循物無違謂信驕者矜高泰者侈肆此因上所引文王康誥之意而言章内三言得失而語益加切蓋至此而天理存亡之幾決矣 }
      - { type: j, text: 生財有大道生之者衆食之者寡爲之者疾用之者舒則財恒足矣 }
      - { type: z, text: 恒胡登反○吕氏曰國無遊民則生者衆矣朝無幸位則食者寡矣不奪農時則爲之疾矣量入爲出則用之舒矣愚按此因有土有財而言以明足國之道在乎務本而節用非必外本内末而後財可聚也自此以至終篇皆一意也 }
      - { type: j, text: 仁者以財發身不仁者以身發財 }
      - { type: z, text: 發猶起也仁者散財以得民不仁者亡身以殖貨 }
      - { type: j, text: 未有上好仁而下不好義者也未有好義其事不終者也未有府庫財非其財者也 }
      - { type: z, text: 上好仁以愛其下則下好義以忠其上所以事必有終而府庫之財無悖出之患也 }
      - { type: j, text: 孟獻子曰畜馬乘不察於雞豚伐冰之家不畜牛羊百乘之家不畜聚斂之臣與其有聚斂之臣寧有盗臣此謂國不以利爲利以義爲利也 }
      - { type: z, text: 畜許六反乘斂並去聲○孟獻子魯之賢大夫仲孫蔑也畜馬乘士初試爲大夫者也伐冰之家卿大夫以上喪祭用冰者也百乘之家有采地者 }
      - { type: j, text: 也君子寧亡己之財而不忍傷民之力故寧有盜臣而不畜聚斂之臣此謂以下釋獻子之言也長國家而務財用者必自小人矣彼爲善之小人之使爲國家菑害並至雖有善者亦無如之何矣此謂國不以利爲利以義爲利也 }
      - { type: z, text: 長上聲彼爲善之此句上下疑有闕文誤字○自由也言由小人導之也此一節深明以利爲利之害而重言以結之其丁寧之意切矣此章之義務在與民同好惡而不專其利皆推廣絜矩之意也能如是則親賢樂利各得其所而天下平矣 }
