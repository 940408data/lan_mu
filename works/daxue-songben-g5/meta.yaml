aboutHtml: |-
  <h2>關於此卷</h2>
  <p>《大學章句》為朱熹《四書章句集注》之一。朱子更定舊本次序，分經一章、傳十章；右傳第五章原闕，朱子取程子之意補之。此卷錄全帙，自經一章至傳之十章，終於「讀者不可以其近而忽之也」，以宋刻本版式數字重刻；朱子《大學章句序》另成一卷。</p>
