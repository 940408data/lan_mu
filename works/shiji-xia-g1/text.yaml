sections:
  - id: 夏本紀
    name: 夏本紀
    blocks:
      - type: j
        text: 夏禹名曰文命禹之父曰鯀鯀之父曰帝顓頊顓頊之父曰昌意昌意之父曰黃帝禹者黃帝之玄孫而帝顓頊之孫也禹之曾大父昌意及父鯀皆不得在帝位為人臣當帝堯之時鴻水滔天浩浩懷山襄陵下民其憂堯求能治水者羣臣四嶽皆曰鯀可堯曰鯀為人負命毀族不可四嶽曰等之未有賢於鯀者願帝試之於是堯聽四嶽用鯀治水九年而水不息
      - type: j
        text: 穆為綱為紀禹乃遂與益后稷奉帝命命諸侯百姓興人徒以傅土行山表木定高山大川禹傷先人父鯀功之不成受誅乃勞身焦思居外十三年過家門不敢入薄衣食致孝于鬼神卑宫室致費於溝淢陸行乘車水行乘船泥行乘橇山行乘檋左准繩右規矩載四時以開九州通九道陂九澤度九山令益予衆庶稻可種卑濕命后稷予衆庶難得之食食少調有餘相給以均諸侯禹乃行相地宜所有以貢及山
      - type: j
        text: 上厥貢鹽絺海物維錯岱畎絲枲鉛松怪石莱夷為牧其篚檿絲浮於汶通於濟海岱及淮維徐州淮沂其治蒙羽其藝大野既都東原厎平其土赤埴墳草木漸包其田上中賦中中貢維土五色羽畎夏翟嶧陽孤桐泗濱浮磬淮夷蠙珠泉魚其篚玄纖縞浮于淮泗通于河淮海維揚州彭蠡既都陽鳥所居三江既入震澤致定竹箭既布其草惟夭其木惟喬其土塗泥田下下賦下上上雜貢金三品瑶琨竹箭齒革
      - type: j
        text: 錫貢磬錯浮於雒達於河華陽黑水惟梁州汶嶓既藝沱涔既道蔡蒙旅平和夷厎績其土青驪田下上賦下中三錯貢璆鐵銀鏤砮磬熊羆狐狸織皮西傾因桓是来浮于潛踰于沔入于渭亂于河黑水西河惟雍州弱水既西涇屬渭汭漆沮既從灃水所同荆岐已旅終南敦物至于鳥鼠原隰厎績至于都野三危既度三苗大序其土黄壤田上上賦中下貢璆琳琅玕浮於積石至於龍門西河會于渭汭織皮昆侖
      - type: j
        text: 陸北播為九河同為逆河入于海嶓冢道漾東流為漢又東為蒼浪之水過三澨入于大别南入于江東匯澤為彭蠡東為北江入于海汶山道江東别為沱又東至于醴過九江至于東陵東迆北會于匯東為中江入于海道沇水東為濟入于河泆為滎東出陶丘北又東至于荷又東北會于汶又東北入于海道淮自桐栢東會于泗沂東入于海道渭自鳥鼠同穴東會于灃又東北至于涇東過漆沮入于河道雒自
      - type: j
        text: 三百里夷二百里蔡要服外五百里荒服三百里蠻二百里流東漸于海西被于流沙朔南暨聲教訖于四海於是帝錫禹玄圭以告成功於天下天下於是太平治臯陶作士以理民帝舜朝禹伯夷臯陶相與語帝前臯陶述其謀曰信其道德謀明輔和禹曰然如何臯陶曰於慎其身修思長敦序九族衆明高翼近可遠在已禹拜美言曰然臯陶曰於在知人在安民禹曰吁皆若是惟帝其難之知人則智能官人能
      - type: j
        text: 行皋陶曰余未有知思賛道哉帝舜謂禹曰汝亦昌言禹拜曰於予何言予思日孳孳皋陶難禹曰何謂孳孳禹曰鴻水滔天浩浩懷山襄陵下民皆服於水予陸行乗車水行乗舟泥行乗橇山行乗檋行山栞木與益予衆庶稻鮮食以決九川致四海浚畎澮致之川與稷予衆庶難得之食食少調有餘補不足徙居衆民乃定萬國為治皋陶曰然此而美也禹曰於帝慎乃在位安爾止輔徳天下大應清意以昭待上
      - type: j
        text: 能成水土功輔成五服至于五千里州十二師外薄四海咸建五長各道有功苗頑不即功帝其念哉帝曰道吾德乃女功序之也皋陶於是敬禹之德令民皆則禹不如言刑從之舜德大明於是夔行樂祖考至羣后相讓鳥獸翔舞簫韶九成鳳皇来儀百獸率舞百官信諧帝用此作歌曰陟天之命維時維幾乃歌曰股肱喜哉元首起哉百工熙哉皋陶拜手稽首揚言曰念哉率為興事慎乃憲敬哉乃更為歌曰元
      - type: j
        text: 稽而崩以天下授益三年之喪畢益讓帝禹之子啓而辟居箕山之陽禹子啓賢天下屬意焉及禹崩雖授益益之佐禹日淺天下未洽故諸侯皆去益而朝啓曰吾君帝禹之子也於是啓遂即天子之位是為夏后帝啓夏后帝啓禹之子其母塗山氏之女也有扈氏不服啓伐之大戰於甘将戰作甘誓乃召六卿申之啓曰嗟六事之人予誓告女有扈氏威侮五行怠棄三正天用剿絕其命今予維共行天之罰左不
      - type: j
        text: 降崩弟帝扃立帝扃崩子帝厪立帝厪崩立帝不降之子孔甲是為帝孔甲帝孔甲立好方鬼神事淫亂夏后氏德衰諸侯畔之天降龍二有雌雄孔甲不能食未得豢龍氏陶唐既衰其後有劉累學擾龍于豢龍氏以事孔甲孔甲賜之姓曰御龍氏受豕韋之後龍一雌死以食夏后夏后使求懼而遷去孔甲崩子帝皋立帝皋崩子帝發立帝發崩子帝履癸立是為桀帝桀之時自孔甲以來而諸侯多畔夏桀不務德
      - type: j
        text: 正云自虞夏時貢賦備矣或言禹會諸侯江南計功而崩因葬焉命曰會稽會稽者會計也
