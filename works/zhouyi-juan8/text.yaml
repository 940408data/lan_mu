# 周易正義卷八（孔穎達疏）：j 為經文＋王弼注，z 為正義疏文。
sections:
  - id: juan8
    name: 卷八
    blocks:
      - { type: j, text: "周易系辭下第八。" }
      - { type: z, text: "正義曰：此篇章數，諸儒不同，劉瓛為十二章，以對上《系》十二章也。周氏、莊氏併為九章，今從九章為說也。第一起“八卦成列”至“非曰義”，第二起“古者包犧”至“蓋取諸夬”，第三起“易者象也”至“德之盛”，第四起“困於石”至“勿恆兇”，第五起“乾坤其易之門”至“失得之報”，第六起“《易》之興”至“巽以行權”，第七起“《易》之為書”至“思過半矣”，第八起“二與四”至“謂易之道”，第九起“夫乾天下”至“其辭屈”。" }
      - { type: z, text: "正義曰：“八卦成列”至“非曰義”，此第一章。覆釋上系第二章象爻剛柔吉凶悔吝之事，更具而詳之。" }
      - { type: j, text: "八卦成列，象在其中矣。備天下之象也。" }
      - { type: z, text: "正義曰：言八卦各成列位，萬物之象，在其八卦之中也。" }
      - { type: j, text: "因而重之，爻在其中矣。夫八卦備天下之理，而未極其變，故因而重之以象其動用，擬諸形容以明治亂之宜，觀其所應以著適時之功，則爻卦之義，所存各異，故爻在其中矣。" }
      - { type: z, text: "“因而”至“中矣”。○正義曰：謂因此八卦之象，而更重之，萬物之爻，在其所重之中矣。然象亦有爻，爻亦有象，所以象獨在卦，爻獨在重者，卦則爻少而象多，重則爻多而象少，故在卦舉象，在重論爻也。○注“夫八卦”至“其中矣”。○正義曰：“夫八卦備天下理”者，前注云“備天下之象”，據其體；此云“備天下之理”，據其用也。言八卦大略有八，以備天下大象大理，大者既備，則小者亦備矣。直是不變之備，未是變之備也，故云“未極其變，故因而重之，以象其動用”也。云“則爻卦之義，所存各異”者，謂爻之所存，存乎巳變之義，“因而重之，爻在其中”是也。卦之所存，存於未變之義，“八卦成列，象在其中”是也。" }
      - { type: j, text: "剛柔相推，變在其中矣。" }
      - { type: z, text: "正義曰：則上《系》第二章云“剛柔相推而生變化”，是變化之道，在剛柔相推之中。剛柔即陰陽也。論其氣即謂之陰陽，語其體即謂之剛柔也。" }
      - { type: j, text: "系辭焉而命之，動在其中矣。剛柔相推，況八卦相蕩，或否或泰，系辭焉而斷其吉凶，況之六爻，動以適時者也。立卦之義，則見於《彖》、《象》，適時之功，見存之爻辭。王氏之例詳矣。" }
      - { type: z, text: "“系辭”至“中矣”。○正義曰：謂系辭於爻卦之下，而呼命其卦爻得失吉凶，則適時變動好惡，故在其系辭之中矣。○注“立卦”至“詳矣”。○正義曰：云“立卦之義，則見於《彖》、《象》”者，《彖》、《象》，謂卦下之辭，說其卦之義也。“適時之功，則存於爻辭”者，卦者時也，六爻在一卦之中，各以適當時之所宜以立功也。欲知適時之功用，觀於爻辭也。云“王氏之例詳矣”者，案《略例·論彖》云：“《彖》者何也？統論一卦之體，明其所由之主者也。夫眾不能治眾，治眾者，至寡者也。論卦體皆以一為主，是卦之大略也。”又《論爻》云：“爻者何也？言乎其變者也。變者何也？情偽之所為也。夫情偽之動，非數之所求也。故合散屈伸，與體相乖。形躁好靜，質柔愛剛。體與情反，質與原違。是故情偽相感，遠近相追，愛惡相攻，屈伸相推。見情者獲，直往則違。此是爻之大略也。”其義既廣，不能備載，是王氏之例詳矣。" }
      - { type: j, text: "吉凶悔吝者，生乎動者也。有變動而後有吉凶。" }
      - { type: z, text: "正義曰：上既云動在系辭之中，動則有吉凶悔吝，所以悔吝生在乎無所動之中也。" }
      - { type: j, text: "剛柔者，立本者也。變通者，趣時者也。立本況卦，趣時況爻。" }
      - { type: z, text: "正義曰：“剛柔者，立本者也”，言剛柔之象，立在其卦之根本者也。言卦之根本，皆由剛柔陰陽往來。“變通者，趣時者也”，其剛柔之氣，所以改變會通，趣向於時也。若乾之初九，趣向勿用之時，乾之上九，趣向亢極之時。是諸爻之變，皆臻趣於時也。其剛柔立本者，若剛定體為乾，若柔定體為坤，陽卦兩陰而一陽，陰卦兩陽而一陰，是立其卦本而不易也。則上“八卦成列，象在其中矣”是也。卦既與爻為本，又是總主其時，故《略例》云“卦者，時也；變通者，趣時者也”。則上“因而重之，爻在其中矣”是也。卦既總主一時，爻則就一時之中，各趣其所宜之時，故《略例》云“爻者，趣時者也”。" }
      - { type: j, text: "吉凶者，貞勝者也。貞者，正也，一也。夫有動則未免乎累，殉吉則未離乎兇。盡會通之變，而不累於吉凶者，其唯貞者乎？《老子》曰：“王侯得一，以為天下貞。”萬變雖殊，可以執一御也。" }
      - { type: z, text: "“吉凶”至“者也”。○正義曰：貞，正也。言吉之與兇，皆由所動不能守一而生吉凶，唯守一貞正，而能克勝此吉凶。謂但能貞正，則免此吉凶之累也。○注“貞者”至“御也”。○正義曰：“貞者，正也，一也”者，言貞之為訓，訓正訓一，正者體傾邪，一者情無差二，寂然無慮，任運而行者也。凡吉凶者，由動而來，若守貞靜寂，何吉何兇之有？是貞正能勝其吉凶也。云“夫有動則未能免乎累”者，寂然不動，則無所可累。若動有營求，則恥累將來，故云動則未免於累也。云“殉吉則未離乎兇”者，殉，求也。若不求其吉，無慮無思，兇禍何因而至？由其求吉，有所貪欲，則兇亦將來，故云殉吉未離乎兇也。云“盡會通之變，而不累於吉凶者，其唯貞者乎”，言若能窮盡萬物會通改變之理，而不系累於吉凶之事者，唯貞一者乃能然也。猶若少必有老，老必有死，能知此理，是盡會通之變。既知老必將死，是運之自然，何須憂累於死，是不累乎吉凶。唯守貞一，任其自然，故云“其唯貞者乎”。云“《老子》曰，王侯得一，以為天下貞”者，王侯若不得一，二三其德，則不能治正天下。若得純粹無二無邪，則能為天下貞也。謂可以貞正天下也。云“萬變雖殊，可以執一御也”者，猶若寒變為暑，暑變為寒，少變為壯，壯變為老，老變為死，禍變為福，盛變為衰，變改不同，是萬變殊也。其變雖異，皆自然而有，若能知其自然，不造不為，無喜無戚，而乘御於此，是可以執一御也。" }
      - { type: j, text: "天地之道，貞觀者也。明夫天地萬物，莫不保其貞，以全其用也。" }
      - { type: z, text: "正義曰：謂天覆地載之道，以貞正得一，故其功可為物之所觀也。" }
      - { type: j, text: "日月之道，貞明者也。天下之動，貞夫一者也。夫乾，確然示人易矣。夫坤，隤然示人簡矣。確，剛貌也。隤，柔貌也。乾坤皆恆一其德，物由以成，故簡易也。" }
      - { type: z, text: "正義曰：“日月之道，貞明者也”，言日月照臨之道，以貞正得一而為明也。若天覆地載，不以貞正而有二心，則天不能普覆，地不能兼載，則不可以觀。由貞乃得觀見也。日月照臨，若不以貞正，有二之心，則照不普及，不為明也，故以貞而為明也。“天下之動，貞夫一者也”，言天地日月之外，天下萬事之動，皆正乎純一也。若得於純一，則所動遂其性；若失於純一，則所動乖其理。是天下之動，得正在一也。“夫乾，確然示人易矣”者，此明天之得一之道，剛質確然，示人以和易，由其得一無為，物由以生，是示人易也。“夫坤，隤然示人簡矣”者，此明地之得一，以其得一，故坤隤然而柔，自然無為，以成萬物，是示人簡矣。若乾不得一，或有隤然，則不能示人易矣。若坤不隤然，或有確然，則不能示人簡矣。" }
      - { type: j, text: "爻也者，效此者也。象也者，像此者也。爻象動乎內，兆數見於卦也。" }
      - { type: z, text: "正義曰：“爻也者，效此者也”，此釋爻之名也。言爻者，效此物之變動也。“象也者，像此者”也。言象此物之形狀也。“爻象動乎內”者，言爻之與象，發動於卦之內也。" }
      - { type: j, text: "吉凶見乎外，失得驗於事也。" }
      - { type: z, text: "正義曰：其爻象吉凶見於卦外，在事物之上也。" }
      - { type: j, text: "功業見乎變，功業由變以興，故見乎變也。" }
      - { type: z, text: "正義曰：言功勞事業，由變乃興，故功業見於變也。" }
      - { type: j, text: "聖人之情見乎辭。辭也者，各指其所之，故曰情也。" }
      - { type: z, text: "正義曰：辭則言其聖人所用之情，故觀其辭而知其情也。是聖人之情，見乎爻象之辭也。若《乾》之初九，其辭云：“潛龍勿用。”則聖人勿用之情見於初九爻辭也。他皆放此。" }
      - { type: j, text: "天地之大德曰生，施生而不為，故能常生，故曰大德也。" }
      - { type: z, text: "正義曰：自此己下，欲明聖人同天地之德，廣生萬物之意也。言天地之盛德，在乎無常生，故言曰生。若不常生，則德之不大。以其常生萬物，故云大德也。" }
      - { type: j, text: "聖人之大寶曰位。夫無用則無所寶，有用則有所寶也。無用而常足者，莫妙乎道，有用而弘道者，莫大乎位，故曰“聖人之大寶曰位”。" }
      - { type: z, text: "正義曰：言聖人大可寶愛者在於位耳，位是有用之地，寶是有用之物。若以居盛位，能廣用無疆，故稱大寶也。" }
      - { type: j, text: "何以守位？曰仁。何以聚人？曰財。財所以資物生也。" }
      - { type: z, text: "正義曰：“何以守位曰仁”者，言聖人何以保守其位，必信仁愛，故言“曰仁”也。“何以聚人曰財”者，言何以聚集人眾，必須財物，故言“曰財”也。" }
      - { type: j, text: "理財正辭，禁民為非曰義。" }
      - { type: z, text: "正義曰：言聖人治理其財，用之有節，正定號令之辭，出之以理，禁約其民為非僻之事，勿使行惡，是謂之義。義，宜也。言以此行之，而得其宜也。" }
      - { type: z, text: "正義曰：“古者包犧”至“取諸夬”，此第二章。明聖人法自然之理而作《易》，象《易》以制器而利天下。此一章其義既廣，今各隨文釋之。" }
      - { type: j, text: "古者包犧氏之王天下也，仰則觀象於天，俯則觀法於地，觀鳥獸之文，與地之宜，聖人之作《易》，無大不極，無微不究。大則取象天地，細則觀鳥獸之文，與地之宜也。" }
      - { type: z, text: "正義曰：“自此”至“取諸離”。此一節明包犧法天地造作八卦，法離卦而為罔罟也。云“仰則觀象於天，俯則觀法於地”者，言取象大也。“觀鳥獸之文，與地之宜”者，言取象細也。大之與細，則無所不包也。“地之宜”者，若《周禮》五土，動物植物各有所宜是也。" }
      - { type: j, text: "近取諸身，遠取諸物，於是始作八卦，以通神明之德，以類萬物之情。作結繩而為罔罟，以佃以漁，蓋取諸離。離，麗也。罔罟之用，必審物之所麗也。魚麗於水，獸麗於山也。" }
      - { type: z, text: "正義曰：“近取諸身”者，若耳目鼻口之屬是也。“遠取諸物”者，若雷風山澤之類是也。舉遠近則萬事在其中矣。“於是始作八卦，以通神明之德”者，言萬事云為，皆是神明之德。若不作八卦，此神明之德，閉塞幽隱。既作八卦，則而象之，是通達神明之德也。“以類萬物之情”者，若不作《易》，物情難知。今作八卦以類象萬物之情，皆可見也。“作結繩而為罔罟，以佃以漁”者，用此罟罔，或陸畋以羅鳥獸，或水澤以罔魚鱉也。“蓋取諸離”者，離，麗也。麗謂附著也。言罔罟之用，必審知鳥獸魚無所附著之處。故稱離卦之名，為罔罟也。案諸儒象卦制器，皆取卦之爻象之體，今韓氏之意，直取卦名，因以制器。案上《系》云：“以制器者，尚其象”，則取象不取名也。韓氏乃取名不取象，於義未善矣。今既遵韓氏之學，且依此釋之也。" }
      - { type: j, text: "包犧氏沒，神農氏作，斫木為耜，揉木為耒，耒耨之利，以教天下，蓋取諸益。制器致豐，以益萬物。日中為巿，致天下之民，聚天下之貨，交易而退，各得其所，蓋取諸噬嗑。噬嗑，合也。巿人之所聚，異方之所合，設法以合物，噬嗑之義也。" }
      - { type: z, text: "正義曰：“包犧氏”至“取諸噬嗑”，此一節明神農取卦造器之義。一者制耒耜，取於益卦，以利益民也。二者日中為巿，聚合天下之貨，設法以合物，取於噬嗑，象物噬齧，乃得通也。包犧者，案《帝王世紀》云：大皞帝包犧氏，風姓也。母曰華胥，燧人之世，有大人跡出於雷澤，華胥履之而生包犧。長於成紀，蛇身人首，有聖德，取犧牲以充包廚，故號曰“包犧氏”。後世音謬，故或謂之伏犧，或謂之虙犧，一號皇雄氏，在位一百一十年。包犧氏沒，女媧氏代立為女皇，亦風姓也。女媧氏沒，次有大庭氏、柏黃氏、中央氏、栗陸氏、驪連氏、赫胥氏、尊盧氏、混沌氏、皞英氏、有巢氏、朱襄氏、葛天氏、陰康氏、無懷氏，凡十五世，皆習包犧氏之號也。神農者，案《帝王世紀》云：炎帝神農氏，姜姓也。母曰任己，有蟜氏女，名曰女登。為少典正妃，游華山之陽，有神龍首感女登於尚羊，生炎帝，人身牛首，長於姜水，有聖德，繼無懷之後，本起烈山，或稱烈山氏，在位一百二十年而崩。納奔水氏，女曰聽談，生帝臨魁，次帝承，次帝明，次帝直，次帝釐，次帝哀，次帝榆罔，凡八代及軒轅氏也。" }
      - { type: j, text: "神農氏沒，黃帝、堯、舜氏作，通其變，使民不倦；通物之變，故樂其器用，不解倦也。" }
      - { type: z, text: "正義曰：“神農氏沒”至“吉無不利”，此一節明神農氏沒後，乃至黃帝、堯、舜、通其《易》之變理，於是廣制器物。此節與下制器物為引緒之勢，為下起文。“黃帝、堯、舜氏作”者，案：《世紀》云：黃帝有熊氏，少典之子，姬姓也。母曰附寶，其先即炎帝母家有蟜氏之女。附寶見大電光繞北斗樞星，照於郊野，感附寶，孕二十四月而生黃帝於壽丘。長於姬水，龍顏有聖德，戰蚩尢於涿鹿，擒之。在位一百年崩。子青陽代立，是為少皞。少皞帝名摯，字青陽，姬姓也。母曰女節，黃帝時，大星如鬥，下臨華渚，女節夢接意感，生少皞，在位八十四年而崩。顓頊高陽氏，黃帝之孫，昌意之子。母曰昌僕，蜀山氏之女，為昌意正妃，謂之女樞。瑤光之星，貫月如虹，感女樞於幽房之宮，生顓頊於弱水，在位七十八年而崩。少皞之孫，蟜極之子代立，是為帝嚳。帝嚳高辛氏，姬姓也。其母不見。生而神異，自言其名，在位七十年而崩。子帝摯立，在位九年。摯立不肖而崩，弟放勳代立，是為帝堯。帝堯陶唐氏，伊祈姓，母曰慶都，生而神異，常有黃云覆其上。為帝嚳妃，出以觀河，遇赤龍，晻然陰風而感慶都，孕十四月而生堯於丹陵，即位九十八年而崩。帝舜代立。帝舜姚姓，其先出自顓頊。顓頊生窮蟬，窮蟬生敬康，敬康生句芒，句芒生蟜牛，蟜牛生瞽瞍，瞍之妻握登，見大虹，意感而生舜於姚墟，故姓姚氏。此歷序三皇之後至堯舜之前所為君也。此既云黃帝即云堯舜者，略舉五帝之終始，則少皞、顓頊、帝嚳在其間也。“通其變，使民不倦”者，事久不變，則民倦而變。今皇帝、堯、舜之等，以其事久或窮，故開通其變，量時制器，使民用之日新，不有懈倦也。" }
      - { type: j, text: "神而化之，使民宜之。易窮則變，變則通，通則久。通變則無窮，故可久也。" }
      - { type: z, text: "正義曰：“神而化之，使民宜之”者，言所以“通其變”者，欲使神理微妙而變化之，使民各得其宜。若黃帝已上，衣鳥獸之皮，其後人多獸少，事或窮乏。故以絲麻布帛而製衣裳，是神而變化，使民得宜也。“易窮則變，變則通，通則久”者，此覆說上文“通則變”之事，所以“通其變”者，言易道若窮，則須隨時改變。所以須變者，變則開通得久長，故云“通則久”也。" }
      - { type: j, text: "是以自天祐之，吉無不利。" }
      - { type: z, text: "正義曰：此明若能通變，則無所不利，故引《易》文，證結變通之善，上《系》引此文者，證明人事之信順，此乃明易道道之變通，俱得天之祐，故各引其文也。" }
      - { type: j, text: "黃帝、堯、舜垂衣裳而天下治，蓋取諸乾、坤。垂衣裳以辨貴賤，乾尊坤卑之義也。" }
      - { type: z, text: "正義曰：自此已下，凡有九事，皆黃帝、堯、舜取易卦以制象，此於九事之第一也。所以連云堯、舜者，謂此九事黃帝制其初，堯舜成其末，事相連接，共有九事之功，故連云“黃帝堯舜”也。案皇甫謐《帝王世紀》載此九事，皆為黃帝之功。若如所論，則堯舜無事，《易·系》何須連云“堯舜”？則皇甫之言，未可用也。“垂衣裳”者，以前衣皮，其制短小，今衣絲麻布帛所作衣裳，其制長大，故云“垂衣裳”也。“取諸乾坤”者，衣裳辨貴賤，乾坤則上下殊體，故云“取諸乾坤”也。" }
      - { type: j, text: "刳木為舟，剡木為楫。舟楫之利，以濟不通，致遠以利天下，蓋取諸渙。渙者，乘理以散通也。" }
      - { type: z, text: "正義曰：“此九事之第二也。舟必用大木，刳鑿其中，故云“刳木也”。“剡木為楫”者，楫必須纖長，理當剡削，故曰“剡木”也。“取諸渙”者，渙，散也。渙卦之義，取乘理以散動也。舟楫以乘水以載運，故取諸渙也。" }
      - { type: j, text: "服牛乘馬，引重致遠，以利天下，蓋取諸隨。隨，隨宜也。服牛乘馬，隨物所之，各得其宜也。" }
      - { type: z, text: "正義曰：此九事之第三也。隨者謂隨時之所宜也，今服用其牛，乘駕其馬，服牛以引重，乘馬以致遠，是以人之所用，各得其宜，故取諸“隨”也。" }
      - { type: j, text: "重門擊柝，以待暴客，蓋取諸豫。取其豫備。" }
      - { type: z, text: "正義曰：此九事之第四也。豫者取其豫有防備，韓氏以此九事，皆以卦名而為義者。特以此象文，取備豫之義，其事相合。故其餘八事，皆以卦名解義，量為此也。" }
      - { type: j, text: "斷木為杵，掘地為臼，臼杵之利，萬民以濟，蓋取諸小過。以小用而濟物也。" }
      - { type: z, text: "正義曰：此九事之第五也。杵須短木，故斷木為杵；臼須鑿地，故掘地為臼。取諸小過，以小事之用過而濟物，杵臼亦小事，過越而用以利民，故取諸小過也。" }
      - { type: j, text: "弦木為弧，剡木為矢，弧矢之利，以威天下，蓋取諸睽。睽，乖也。物乖則爭興，弧矢之用，所以威乖爭也。" }
      - { type: z, text: "正義曰：此九事之第六也。案《爾雅》：“弧，木弓也。”故云“弦木為弧”。“取諸睽”者，睽謂乖離，弧矢所以服此乖離之人，故取諸睽也。案弧、矢、杵、臼、服牛、乘馬、舟、楫皆云之“利”，此皆器物益人，故稱“利”也。重門擊柝，非如舟楫杵臼，故不云“利”也。變稱“以御暴客”，是以利也。垂衣裳不言利者，此亦隨便立稱，故云“天下治”，治亦利也。此皆義便而言，不可以一例取也。" }
      - { type: j, text: "上古穴居而野處，後世聖人易之以宮室，上棟下宇，以待風雨，蓋取大壯。宮室壯大於穴居，故製為宮室，取諸大壯也。" }
      - { type: z, text: "正義曰：此九事之第七也。巳前不云“上古”，已下三事，或言“上古”，或言“古”，與上不同者，巳前未造此器之前，更無餘物之用，非是後物以替前物，故不云“上古”也。此巳下三事皆是未造此物之前，巳更別有所用，今將後用而代前用，欲明前用所有，故本之云“上古”及“古”者，案未有衣裳之前，則衣鳥獸之皮，亦是巳前有用，不云“上古”者，雖云古者衣皮，必不專衣皮也，或衣草衣木，事無定體，故不得稱上古衣皮也。若此穴居野處，及結繩以治，唯專一事，故可稱上古，由後物代之也。“取諸大壯”者，以造制宮室，壯大於穴居野處，故取大壯之名也。" }
      - { type: j, text: "古之葬者厚衣之以薪，葬之中野，不封不樹，喪期無數，後世聖人易之以棺槨，蓋取諸大過。取其過厚。" }
      - { type: z, text: "正義曰：此九事之第八也。不云“上古”，直云“古之葬者”，若極遠者，則云“上古”，其次遠者，則直云“古”。則厚衣之以薪，葬之中野，猶在穴居結繩之後，故直云“古”也。“不封不樹”者，不積土為墳，是不封也。不種樹以標其處，是不樹也。“喪期無數”者，哀除則止，無日月限數也。“後世聖人易之以棺槨”者，若《禮記》云“有虞氏瓦棺”，未必用木為棺也。則《禮記》又云“殷人之棺槨”，以前云槨，無文也。“取諸大過”者，送終追遠，欲其甚大過厚，故取諸大過也。案《書》稱堯崩，百姓如喪考妣，三載四海遏密八音，則喪期無數，在堯巳前，而棺槨自殷已後，則夏已前，棺槨未具也。所以其文參差，前後不齊者，但此文舉大略，明前後相代之義，不必確在一時故九事上從黃帝，下稱堯舜，連延不絕，更相增脩也。" }
      - { type: j, text: "上古結繩而治，後世聖人易之以書契，百官以治，萬民以察，蓋取諸夬。夬，決也。書契所以決斷萬事也。" }
      - { type: z, text: "正義曰：此明九事之終也。夬者，決也。造立書契，所以決斷萬事，故取諸夬也。“結繩”者，鄭康成注云：“事大大結其繩，事小小結其繩。”義或然也。" }
      - { type: z, text: "正義曰：“是故易者”至“德之盛也”，此第三章。明陰陽二卦之體，及日月相推而成歲，聖人用之，安身崇德，德之盛也。" }
      - { type: j, text: "是故易者，象也。象也者，像也。彖者，材也。材，才德也。彖言成卦之材，以統卦義也。" }
      - { type: z, text: "正義曰：“是故易者象也”者，但前章皆取象以制器，以是之故，易卦者，寫萬物之形象，故云“易者象也”。“象也者，像也”者，謂卦為萬物象者，法像萬物，猶若乾卦之象，法像於天也。“彖者，材也”者，謂卦下彖辭者，論此卦之材德也。" }
      - { type: j, text: "爻也者，效天下之動者也。是故吉凶生而悔吝著也。陽卦多陰，陰卦多陽，其故何也？陽卦奇，陰卦耦。夫少者，多之所宗；一者，眾之所歸。陽卦二陰，故奇為之君；陰卦二陽，故耦為之主。" }
      - { type: z, text: "正義曰：“爻也者，效天下之動”者，謂每卦六爻，皆仿效天下之物而發動也。“吉凶生而悔吝著”者，動有得失，故吉凶生也。動有細小疵病，故悔吝著也。“陽卦多陰，陰卦多陽，其故何也”者，此夫子將釋陰陽二卦不同之意，故先發其問，云“其故何也”。“陽卦多”陰，謂震、坎、艮一陽而二陰也；“陰卦多陽”，謂巽、離、兌一陰而二陽也。“陽卦奇，陰卦耦”者，陽卦則以奇為君，故一陽而二陰，陽為君，陰為臣也。陰卦則以耦為君，故二陽而一陰，陰為君，陽為臣也。故《注》云“陽卦二陰，故奇為之君；陰卦二陽，故耦為之主”。" }
      - { type: j, text: "其德行何也？辨陰陽二卦之德行也。" }
      - { type: z, text: "正義曰：前釋陰陽之體，未知陰陽德行之故。故夫子將釋德行，先自問之，故云“其德行何也”。" }
      - { type: j, text: "陽一君而二民，君子之道也。陰二君而一民，小人之道也。陽，君道也。陰，臣道也。君以無為統眾，無為則一也。臣以有事代終，有事則二也。故陽爻畫奇，以明君道必一；陰爻畫兩，以明臣體必二，斯則陰陽之數，君臣之辨也。以一為君，君之德也。二居君位，非其道也。故陽卦曰“君子之道”，陰卦曰“小人之道”也。" }
      - { type: z, text: "“陽一”至“道也”。○正義曰：“陽一君而二民，君子之道”者，夫君以無為統眾，無為者，為每事因循，委任臣下，不司其事，故稱一也。臣則有事代終，各司其職，有職則有對，故稱二也。今陽爻以一為君，以二為民，得其尊卑相正之道，故為君子之道者也。“陰二君而一民，小人之道”者，陰卦則以二為君，是失其正，以一為臣，乖反於理，上下失序，故稱小人之道也。○注“陽君”至“道也”。○正義曰：“陽，君道”者，陽是虛無為體，純一不二，君德亦然，故云“陽，君道也”。“陰，臣道”者，陰是形器，各有質分，不能純一，臣職亦然，故云“陰，臣道也”。案《經》云“民”而《注》云“臣”者，臣則民也。《經》中對君，故稱民，《注》意解陰，故稱臣也。" }
      - { type: j, text: "《易》曰：“憧憧往來，朋從爾思。”天下之動，必歸乎一，思以求朋，未能一也。一以感物，不思而至。" }
      - { type: z, text: "正義曰：此明不能無心感物，使物來應，乃憧憧然役用思慮，或來或往，然後朋從爾之所思。若能虛寂，以純一感物，則不須憧憧往來，朋自歸也。此一之為道，得為可尚，結成前文陽爻以一為君，是君子之道也。《注》云“天下之動，必歸乎一。思以求朋，未能一也。一以感物，不思而至”矣。" }
      - { type: j, text: "子曰：“天下何思何慮？天下同歸而殊塗，一致而百慮，天下何思何慮？夫少則得，多則感。塗雖殊，其歸則同；慮雖百，其致不二。苟識其要，不在博求；一以貫之，不慮而盡矣。" }
      - { type: z, text: "正義曰：“子曰：天下何思何慮”者，言得一之道，心既寂靜，何假思慮也。“天下同歸而殊塗”者，言天下萬事，終則同歸於一，但初時殊異其塗路也。“一致而百慮”者，所致雖一，慮必有百。言慮雖百種，必歸於一致也；塗雖殊異，亦同歸於至真也。言多則不如少，動則不如寂，則天下之事，何須思也？何須慮也？" }
      - { type: j, text: "日往則月來，月往則日來，日月相推而明生焉。寒往則暑來，暑往則寒來，寒暑相推而歲成焉。往者屈也，來者信也，屈信相感而利生焉。" }
      - { type: z, text: "正義曰：“日往則月來”至“相推而歲成”者，此言不須憂慮，任運往來，自然明生，自然歲成也。“往者屈也，來者信也”者，此覆明上日往則月來，寒往則暑來，自然相感而生利之事也。往是去藏，故為屈也；來是施用，故為信也。一屈一信，遞相感動而利生，則上云“明生”、“歲成”是“利生”也。" }
      - { type: j, text: "尺蠖之屈，以求信也。龍蛇之蟄，以存身也。精義入神，以致用也。精義，物理之微者也。神寂然不動，感而遂通，故能乘天下之微，會而通其用也。" }
      - { type: z, text: "正義曰：“尺蠖之屈，以求信”者，覆明上往來相感，屈信相須。尺蠖之蟲，初行必屈者，欲求在後之信也。言信必須屈，屈以求信，是相須也。“龍蛇之蟄，以存身”者，言靜以求動也。蛟蛇初蟄，是靜也；以此存身，是後動也。言動必因靜也。靜而得動，亦動靜相須也。“精義入神，以致用”者，亦言先靜而後動。此言人事之用，言聖人用精粹微妙之義，入於神化，寂然不動，乃能致其所用。“精義入神”，是先靜也；“以致用”，是後動也。是動因靜而來也。" }
      - { type: j, text: "利用安身，以崇德也。利用之道，由安其身而後動也。精義由於入神，以致其用；利用由於安身，以崇其德。理必由乎其宗，事各本乎其根。歸根則寧，天下之理得也。若役其思慮，以求動用，忘其安身，以殉功美，則偽彌多而理愈失，名彌美而累愈彰矣。" }
      - { type: z, text: "“利用”至“德也”。○正義曰：此亦言人事也。言欲利已之用，先須安靜其身，不須役其思慮，可以增崇其德。言“利用安身”，是靜也；言“崇德”，是動也。此亦先靜而後動，動亦由靜而來也。○注“利用之道”至“崇其德”。○正義曰：云“利用之道，皆安其身而後動”者，言欲利益所用，先須自安其身。身既得安，然後舉動，德乃尊崇。若不先安身，身有患害，何能利益所用以崇德也。云“精義由於入神，以致其用”者，言精粹微妙之義由入神寂然不動，乃能致其用。云“利用由於安身，以崇德”者，言欲利益所用，先須自安其身，乃可以增崇其德也。" }
      - { type: j, text: "過此以往，未之或知也。窮神知化，德之盛也。”" }
      - { type: z, text: "正義曰：“過此以往，未之或知也”者，言精義入神以致用，利用安身以崇德，此二者皆人理之極。過此二者以往，則微妙不可知，故云“未之或知”也。“窮神知化，德之盛”者，此言過此二者以往之事。若能過此以往，則窮極微妙之神，曉知變化之道，乃是聖人德之盛極也。" }
      - { type: z, text: "正義曰：《易》曰：“困於石”至“勿恆兇”，此第四章，凡有九節。以上章先利用安身，可以崇德，若身自危辱，何崇德之有？故此章第一節引困之六三危辱之事以證之也。" }
      - { type: j, text: "《易》曰：“困於石，據於蒺藜，入於其宮，不見其妻，兇。”子曰：“非所困而困焉，名必辱。非所據而據焉，身必危。既辱且危，死期將至，妻其可得見耶？”" }
      - { type: z, text: "正義曰：《困》之六三，履非其地，欲上於於四，四自應初，不納於已，是困於九四之石也。三又乘二，二是剛陽，非已所乘，是下向據於九二之蒺藜也。六三又無應，是入其宮，不見其妻，死期將至，所以兇也。“子曰：非所困而困焉”者，夫子既引《易》文，又釋其義，故云“不曰”。“非所困”，謂九四。若六三不往犯之，非六三之所困，而六三彊往幹之而取困焉。“名必辱”者，以向上而進取，故以聲名言之，云“名必辱”也。“非所據而據焉”者，謂九二也。若六三能卑下九二，則九三不為其害，是非所據也。今六三彊往陵之，是非所據而據焉。“身必危”者，下向安身之處，故以身言之，云“身必危”也。" }
      - { type: j, text: "《易》曰：“公用射隼於高墉之上，獲之，無不利。”子曰：“隼者，禽也。弓矢者，器也。射之者，人也。君子藏器於身，待時而動，何不利之有。動而不括，是以出而有獲。語成器而動者也。”括，結也。君子待時而動，則無結閡之患也。" }
      - { type: z, text: "“《易》曰”至“動者也”。○正義曰：以前章先須安身可以崇德，故此第二節論明先藏器於身，待時而動，而有利也。故引《解》之上六以證之。三不應上，又以陰居陽，此上六處解之極，欲除其悖亂，而去其三也。故公用射此六三之隼於下體高墉之上，云自上攻下，合於順道，故獲之無不利也。“子曰：隼者，禽也”者，既引《易》文於上，下以解之，故言“子曰”也。“君子藏器於身，待時而動，何不利”者，猶若射人持弓矢於身，此君子若包藏其器於身，待時而動，何不利之有？似此射隼之人也。“動而不括”者，言射隼之人，既持弓矢，待隼可射之動而射之，則不括結而有礙也。猶若君子藏善道於身，待可動之時而興動，亦不滯礙而括結也。“語成器而後動”者，謂易之所說此者，語論有見成之器，而後興動也。" }
      - { type: j, text: "子曰：“小人不恥不仁，不畏不義，不見利不勸，不威不懲。小懲而大誡，此小人之福也。《易》曰：‘履校滅趾，無咎。’此之謂也。" }
      - { type: z, text: "正義曰：此章第三節也。明小人之道，不能恆善，若因懲誡而得福也，此亦證前章安身之事。故引《易·噬嗑》初九以證之。以初九居無位之地，是受刑者以處卦初，其過未深，故屨校滅趾而無咎也。" }
      - { type: j, text: "善不積，不足以成名；惡不積，不足以滅身。小人以小善為無益而弗為也，以小惡為無傷而弗去也。故惡積而不可揜，罪大而不可解。《易》曰：‘何校滅耳，兇。’”" }
      - { type: z, text: "正義曰：此章第四節也。明惡人為惡之極以致兇也。此結成前章不能安身之事，故引《噬嗑》上九之義以證之。上九處斷獄之終，是罪之深極者。故有何校滅耳之兇。案第一、第二節皆先引《易》文於上，其後乃釋之。此第三巳下，皆先豫張卦義於上，然後引《易》於下以結之，體例不同者，蓋夫子隨義而言不為例也。" }
      - { type: j, text: "子曰：“危者，安其位者也。亡者，保其存者也。亂者，有其治者也。是故君子安而不忘危，存而不忘亡，治而不忘亂，是以身安而國家可保也。《易》曰：‘其亡其亡，系於苞桑。’”" }
      - { type: z, text: "正義曰：此第五節。以上章有安身之事，故此節恆須謹慎，可以安身，故引《否》之九五以證之。“危者，安其位者也”，言所以今有傾危者，由往前安樂於其位，自以為安，不有畏慎，故致今日危也。“亡者，保其存”者，所以今日滅亡者，由往前保有其存，恆以為存，不有憂懼，故今致滅亡也。“亂者，有其治”者，所以今有禍亂者，由往前自恃有其冶理也，謂恆以為治，不有憂慮，故今致禍亂也。是故君子今雖復安，心恆不忘傾危之事；國之雖存，心恆不忘滅亡之事；政之雖治，心恆不忘禍亂之事。“其亡其亡，其系於苞桑”者，言心恆畏慎：其將滅亡！其將滅亡！乃系於苞桑之固也。" }
      - { type: j, text: "子曰：“德薄而位尊，知小而謀大，力小而任重，鮮不及矣。《易》曰：‘鼎折足，覆公餗，其形渥，兇。’言不勝其任也。”" }
      - { type: z, text: "“子曰”至“其任也”。○正義曰：此第六節。言不能安其身，知小謀大而遇禍，故引《易·鼎》卦九四以證之。“鼎折足，覆公餗，其形渥，兇”者，處上體之下，而又應初，既承且施，非已所堪，故有折足之兇。既覆敗其美道，災及其形，以致渥兇也。言不勝其任者。此夫子之言，引《易》後以此結之，其文少，故不云“子曰”也。" }
      - { type: j, text: "子曰：“知幾其神乎？君子上交不諂，下交不瀆，其知幾乎？形而上者況之道。形而下者況之器。於道不冥而有求焉，未離乎諂也。於器不絕而有交焉，未免乎瀆也。能無諂、瀆，窮理者乎？" }
      - { type: z, text: "正義曰：“子曰知幾其神乎”至“萬夫之望”者，此第七節。前章云精義入神，故此章明知幾入神之事，故引《豫》之六二以證之。云“《易》曰：介於石，不終日，貞吉”、“知幾其神乎”者，神道微妙，寂然不測。人若能豫知事之幾微，則能與其神道合會也。“君子上交不諂，下交不瀆”者，上謂道也，下謂器也。若聖人知幾窮理，冥於道，絕於器，故能上交不諂，下交不瀆。若於道不冥而有求焉，未能離於諂也；於器不絕而有交焉，未能免於瀆也。能無諂、瀆、知幾窮理者乎？" }
      - { type: j, text: "幾者，動之微。吉之先見者也。幾者去無入有，理而無形，不可以名尋，不可以形睹者也。唯神也不疾而速，感而遂通，故能朗然玄昭，鑑於未形也。合抱之木，起於毫末。吉凶之彰，始於微兆，故為吉之先見也。" }
      - { type: z, text: "正義曰：此釋“幾”之義也。幾，微也。是巳動之微，動謂心動、事動。初動之時，其理未著，唯纖微而已。若其已著之後，則心事顯露，不得為幾。若未動之前，又寂然頓無，兼亦不得稱幾也。幾是離無入有，在有無之際，故云“動之微”也。若事著之後乃成為吉，此幾在吉之先，豫前已見，故云“吉之先見者也”。此直云吉不云兇者，凡豫前知幾，皆向吉而背兇，違兇而就吉，無復有兇，故特云吉也。諸本或有兇字者，其定本則無也。" }
      - { type: j, text: "君子見幾而作，不俟終日。《易》曰：‘介於石，不終日，貞吉。’介如石焉，寧用終日，斷可識矣。定之於始，故不待終日也。" }
      - { type: z, text: "正義曰：“君子見幾而作，不俟終日”者，言君子既見事之幾微，則須動作而應之，不得待終其日。言赴幾之速也。“《易》曰：介於石，不終日，貞吉”者，此《豫》之六二辭也。得位居中，故守介如石，見幾則動，不待終其一日也。“介如石焉，寧用終日，斷可識矣”者，此夫子解釋此爻之時，既守志耿介，如石不動，才見幾微，即知禍福，何用終竟其日，當時則斷可識矣。" }
      - { type: j, text: "君子知微知彰，知柔知剛，萬夫之望。”此知幾其神乎？" }
      - { type: z, text: "正義曰：“君子知微知彰”者，初見是幾，是知其微；既見其幾，逆知事之禍福，是知其彰著也。“知柔知剛”者，剛柔是變化之道，既知初時之柔，則逆知在後之剛，言凡物之體，從柔以至剛，凡事之理，從微以至彰，知幾之人，既知其始，又知其末，是合於神道，故為萬夫所瞻望也。萬夫舉大略而言。若知幾合神，則為天下之主，何直只云萬夫而已，此知幾其神乎者也。" }
      - { type: j, text: "子曰：“顏氏之子，其殆庶幾乎？有不善，未嘗不知，知之未嘗復行也。”在理則昧，造形而悟，顏子之分也。失之於幾，故有不善。得之於二，不遠而復，故知之未嘗復行也。" }
      - { type: z, text: "正義曰：“子曰顏氏之子”至“元吉者”，此第八節。上節明其知幾是聖人之德，此節論賢人唯庶於幾，雖未能知幾，故引顏氏之子以明之也。“其殆庶幾乎”者，言聖人知幾，顏子亞聖，未能知幾，但殆近庶慕而已，故云“其殆庶幾乎”，又以“殆”為辭。“有不善，未嘗不知”者，若知幾之人，本無不善。以顏子未能知幾，故有不善。不近於幾之人，既有不善，不能自知於惡。此顏子以其近幾，若有不善，未嘗不自知也。“知之未嘗復行”者，以顏子通幾，既知不善之事，見過則改，未嘗復更行之，但顏子於幾理闇昧，故有不善之事，於形器顯著，乃自覺悟，所有不善，未嘗復行。" }
      - { type: j, text: "《易》曰：‘不遠復，無祇悔，元吉。’吉凶者，失得之象也。得一者於理不盡，未至成形，故得不遠而復，舍兇之吉，免夫祗悔，而終獲元吉。祗，大也。" }
      - { type: z, text: "正義曰：以去幾既近，尋能改悔，故引《復》卦初九以明之也。以復卦初九既在卦初，則能復於陽道，是速而不遠，則能復也。所以無大悔而有元吉也。" }
      - { type: j, text: "天地絪縕，萬物化醇，男女構精，萬物化生。" }
      - { type: z, text: "正義曰：“天地絪縕”至“勿恆兇”，此第九節也。以前章利用安身以崇德也，安身之道在於得一，若已能得一，則可以安身。故此節明得一之事也。“天地絪縕，萬物化醇”者，絪縕，相附著之義。言天地無心，自然得一，唯二氣絪縕，共相和會，萬物感之變化而精醇也。天地若有心為二，則不能使萬物化醇也。“男女構精，萬物化生”者，構，合也。言男女陰陽相感，任其自然，得一之性，故合其精則萬物化生也。若男女無自然之性，而各懷差二，則萬物不化生也。" }
      - { type: j, text: "《易》曰：‘三人行，則損一人；一人行，則得其友。’言致一也。”致一而後化成也。" }
      - { type: z, text: "正義曰：此《損》卦六三辭也。言六三若更與二人同往承上，則上所不納，是三人俱行，並六三不相納，是則損一人也。若六三獨行，則上所容受，故云“一人行，則得其友”。此言無不如寡，三不及一也。言“致一也”者，此夫子釋此爻之意，謂此爻所論，致其醇一也。故一人獨行，乃得其友也。" }
      - { type: j, text: "子曰：“君子安其身而後動，易其心而後語，定其交而後求。君子脩此三者，故全也。危以動，則民不與也。懼以語，則民不應也。無交而求，則民不與也。莫之與，則傷之者至矣。" }
      - { type: z, text: "正義曰：“子曰：君子安其身而後動”者，此明致一之道，致一者，在身之謂。若己之為得，則萬事得；若己之為失，則萬事失也。欲行於天下，先在其身之一，故先須安靜其身而後動，和易其心而後語，先以心選定其交而後求。若其不然，則傷之者至矣。" }
      - { type: j, text: "《易》曰：‘莫益之，或擊之，立心勿恆，兇。’”夫虛己存誠，則眾之所不迕也。躁以有求，則物之所不欲也。" }
      - { type: z, text: "正義曰：此《益》之上九爻辭，在無位高亢，獨唱無和，是“莫益之”也。眾怒難犯，是“或擊之”也。勿，無也。由己建立其心，無能有恆，故兇危也。《易》之此言，若虛己存誠，則眾之所與；躁以有求，則物之所不與也。" }
      - { type: z, text: "正義曰：“子曰乾坤其《易》”至“失得之報”，此第五章也。前章明安身崇德之道，在於知幾得一也。此明《易》之體用，辭理遠大，可以濟民之行，以明失得之報也。" }
      - { type: j, text: "子曰：“乾坤，其易之門邪？”乾，陽物也。坤，陰物也。陰陽合德而剛柔有體，以體天地之撰，撰，數也。" }
      - { type: z, text: "正義曰：“子曰：乾坤，其易之門邪”者，易之變化，從乾坤而起，猶人之興動，從門而出，故乾坤是易之門邪。“乾，陽物也。坤，陰物也。陰陽合德而剛柔有體”者，若陰陽不合，則剛柔之體無從而生。以陰陽相合，乃生萬物，或剛或柔，各有其體。陽多為剛，陰多為柔也。“以體天地之撰”者，撰，數也。天地之內，萬物之象，非剛則柔，或以剛柔體象天地之數也。" }
      - { type: j, text: "以通神明之德。其稱名也，雜而不越。備物極變，故其名雜也。各得其序，不相逾越，況爻繇之辭也。" }
      - { type: z, text: "正義曰：“以通神明之德”者，萬物變化，或生或成，是神明之德。《易》則象其變化之理，是其《易》能通達神明之德也。“其稱名也雜而不越”者，《易》之其稱萬物之名，萬事論說，故辭理雜碎，各有倫敘，而不相乖越。《易》之爻辭，多載細小之物，若“見豕負塗”之屬，是雜碎也。辭雖雜碎，各依爻卦所宜而言之，是不相逾越也。" }
      - { type: j, text: "於稽其類，其衰世之意邪？有憂患而後作《易》，世衰則失得彌彰，爻繇之辭，所以明失得，故知衰世之意邪，稽，猶考也。" }
      - { type: z, text: "正義曰：稽，考也。類，謂事類。然考校《易》辭事類，多有悔之憂虞，故云變亂之世所陳情意也。若盛德之時，物皆遂性，人悉歡娛，無累於吉凶，不憂於禍害。今《易》所論，則有“亢龍有悔”，或稱“龍戰於野”，或稱“箕子明夷”，或稱“不如西鄰之禴祭”，此皆論戰爭盛衰之理，故云“衰世之意”也。凡云“邪”者，是疑而不定之辭也。" }
      - { type: j, text: "夫易彰往而察來，而微顯闡幽。易無往不彰，無來不察，而微以之顯，幽以之闡。闡，明也。" }
      - { type: z, text: "正義曰：“夫易彰往而察來”者，往事必載，是彰往也。來事豫佔，是察來也。“而微顯闡幽”者，闡，明也。謂微而之顯，幽而闡明也。言《易》之所說，論其初微之事，以至其終末顯著也；論其初時幽闇，以至終末闡明也。皆從微以至顯，從幽以至明。觀其《易》辭，是微而幽闇也；演其義理，則顯見著明也。以體言之，則云“微顯”也；以理言之，則云“闡幽”，其義一也，但以體以理，故別言之。" }
      - { type: j, text: "開而當名，辨物正言，斷辭則備矣。開釋爻卦，使各當其名也。理類辨明，故曰“斷辭”也。" }
      - { type: z, text: "正義曰：“開而當名”者，謂開釋爻卦之義，使各當所象之名，若乾卦當龍，坤卦當馬也。“辨物正言”者，謂辨天下之物，各以類正定言之。若辨健物，正言其龍；若辨順物，正言其馬，是辨物正言也。“斷辭則備矣”者，言開而當名，及辨物正言，凡此二事，決斷於爻卦之辭，則備具矣。" }
      - { type: j, text: "其稱名也小，其取類也大。託象以明義，因小以喻大。" }
      - { type: z, text: "正義曰：“其稱名也小”者，言《易》辭所稱物名多細小，若“見豕負塗”“噬臘肉”之屬，是其辭碎小也。“其取類也大”者，言雖是小物，而比喻大事，是所取義類而廣大也。" }
      - { type: j, text: "其旨遠，其辭文，其言曲而中。變化無恆，不可為典要，故其言曲而中也。" }
      - { type: z, text: "正義曰：“其旨遠”者，近道此事，遠明彼事，是其旨意深。若“龍戰於野”，近言龍戰，乃遠明陰陽鬥爭、聖人變革，是其旨遠也。“其辭文”者，不直言所論之事，乃以義理明之，是其辭文飾也。若“黃裳元吉”，不直言得中居職，乃云黃裳，是其辭文也。“其言曲而中”者，變化無恆，不可為體例，其言隨物屈曲，而各中其理也。" }
      - { type: j, text: "其事肆而隱。事顯而理微也。" }
      - { type: z, text: "正義曰：其《易》之所載之事，其辭放肆顯露，而所論義理深而幽隱也。" }
      - { type: j, text: "因貳以濟民行，以明失得之報。貳則失得也，因失得以通濟民行，故明失得之報也。“失得之報”者，得其會則吉，乖其理則兇。" }
      - { type: z, text: "正義曰：“因貳以濟民行”者，貳，二也，謂吉凶二理。言易因自然吉凶二理，以濟民之行也，欲令趨吉而避兇，行善而不行惡也。“以明失得之報”者，言易明人行失之與得所報應也。失則報之以兇，得則報之以吉，是明失得之報也。" }
      - { type: z, text: "正義曰：“《易》之興也”至“巽以行權”，此第六章。明所以作《易》，為其憂患故。作《易》既有憂患，須脩德以避患，故明九卦為德之所用也。" }
      - { type: j, text: "《易》之興也，其於中古乎？作《易》者，其有憂患乎？無憂患則不為而足也。" }
      - { type: z, text: "正義曰：“其於中古乎”者，謂《易》之爻卦之辭，起於中古。若《易》之爻卦之象，則在上古伏犧之時，但其時理尚質素，聖道凝寂，直觀其象，足以垂教矣。但中古之時，事漸澆浮，非象可以為教，又須系以文辭，示其變動吉凶，故爻卦之辭，起於中古。則《連山》起於神農，《歸藏》起於黃帝，周《易》起於文王及周公也。此之所論，謂《周易》也。“作《易》者其有憂患乎”者，若無憂患，何思何慮，不須營作。今既作《易》，故知有憂患也。身既患憂，須垂法以示於後，以防憂患之事，故系之以文辭，明其失得與吉凶也。其作《易》憂患，已於初卷詳之也。" }
      - { type: j, text: "是故履，德之基也。基，所蹈也。" }
      - { type: z, text: "正義曰：以為憂患，行德為本也。六十四卦悉為脩德防患之事，但於此九卦，最是脩德之甚，故特舉以言焉，以防憂患之事。故履卦為德之初基。故為德之時，先須履踐其禮，敬事於上，故履為德之初基也。" }
      - { type: j, text: "謙，德之柄也。復，德之本也。夫動本於靜，語始於默，復者，各反其所始，故為德之本也。" }
      - { type: z, text: "正義曰：“謙，德之柄也”者，言為德之時，以謙為用，若行德不用謙，則德不施用，是謙為德之柄，猶斧刃以柯柄為用也。“復，德之本”者，言為德之時，先從靜默而來，復是靜默，故為德之根本也。" }
      - { type: j, text: "恆，德之固也。固，不傾移也。" }
      - { type: z, text: "正義曰：言為德之時，恆能執守，始終不變，則德之堅固，故為德之固也。" }
      - { type: j, text: "損，德之脩也。益，德之裕也。能益物者，其德寬大也。" }
      - { type: z, text: "正義曰：“損，德之脩”者，行德之時，恆自降損，則其德自益而增新，故云“損，德之脩”也。謙者，論其退下於人；損者，能自減損於己，故謙、損別言也。“益，德之裕”者，裕，寬大也。能以利益於物，則德更寬大也。" }
      - { type: j, text: "困，德之辨也。困而益明。" }
      - { type: z, text: "正義曰：若遭困之時，守操不移，德乃可分辨也。" }
      - { type: j, text: "井，德之地也。所處不移，象居得其所也。" }
      - { type: z, text: "正義曰：改邑不改井，井是所居之常處，能守處不移，是德之地也。言德亦不移動也。" }
      - { type: j, text: "巽，德之制也。巽，所以申命明制也。" }
      - { type: z, text: "正義曰：巽申明號令，以示法制。故能與德為制度也。自此已上，明九卦各與德為用也。" }
      - { type: j, text: "履，和而至。和而不至，從物者也。和而能至，故可履也。" }
      - { type: z, text: "正義曰：自此己下，明九卦之德也。言履卦與物和諧，而守其能至，故可履踐也。" }
      - { type: j, text: "謙，尊而光。復，小而辨於物。微而辨之，不遠復也。" }
      - { type: z, text: "正義曰：“謙，尊而光”者，以能謙卑，故其德益尊而光明也。“復，小而辨於物”者，言復卦於初細微小之時，即能辨於物之吉凶，不遠速復也。" }
      - { type: j, text: "恆，雜而不厭。雜而不厭，是以能恆。" }
      - { type: z, text: "正義曰：言恆卦雖與物雜碎並居，而常執守其操，不被物之不正也。" }
      - { type: j, text: "損，先難而後易。刻損以脩身，故先難也。身脩而無患，故後易也。" }
      - { type: z, text: "正義曰：先自減損，是先難也。後乃無患，是後易也。" }
      - { type: j, text: "益，長裕而不設。有所興為，以益於物，故曰長裕。因物興務，不虛設也。" }
      - { type: z, text: "正義曰：益是增益於物，能長養寬裕於物，皆因物性自然而長養，不空虛妄設其法而無益也。" }
      - { type: j, text: "因，窮而通。處窮而不屈其道也。" }
      - { type: z, text: "正義曰：言困卦於困窮之時，而能守節，使道通行而不屈也。" }
      - { type: j, text: "井，居其所而遷。改邑不改井，井所居不移，而能遷其施也。" }
      - { type: z, text: "正義曰：言井卦居得其所，恆住不移，而能遷其潤澤，施惠於外也。" }
      - { type: j, text: "巽，稱而隱。稱揚命令，而百姓不知其由也。" }
      - { type: z, text: "正義曰：言巽稱揚號令，而不自彰伐而幽隱也。自此已上，辨九卦性德也。" }
      - { type: j, text: "履以和行。謙以制禮。復以自知。求諸已也。" }
      - { type: z, text: "正義曰：“履以和行”者，自此以下，論九卦各有施用而有利益也。言履者以禮敬事於人，是調和性行也。“謙以制禮”者，性能謙順，可以裁製於禮。“復以自知”者，既能返復求身，則自知得失也。" }
      - { type: j, text: "恆以一德。以一為德也。" }
      - { type: z, text: "正義曰：恆能終始不移，是純一其德也。" }
      - { type: j, text: "損以遠害。止於脩身，故可以遠害而已。" }
      - { type: z, text: "正義曰：自降損脩身，無物害已，故遠害也。" }
      - { type: j, text: "益以興利。困以寡怨。困而不濫，無怨於物。" }
      - { type: z, text: "正義曰：“益以興利”者，既能益物，物亦益己，故興利也。“困以寡怨”者，遇困，守節不移，不怨天，不尤人，是無怨於物，故寡怨也。" }
      - { type: j, text: "井以辯義。施而無私，義之方也。" }
      - { type: z, text: "正義曰：井能施而無私，則是義之方所，故辨明於義也。" }
      - { type: j, text: "巽以行權。權反經而合道，必合乎巽順，而後可以行權也。" }
      - { type: z, text: "正義曰：巽順以。既能順時合宜，故可以權行也。若不順時制變，不可以行權也。" }
      - { type: z, text: "正義曰：“《易》之為書”至“思過半矣”，此第七章。明《易》書體用也。" }
      - { type: j, text: "《易》之為書也不可遠，擬議而動，不可遠也。" }
      - { type: z, text: "正義曰：“不可遠”者，言《易》書之體，皆仿法陰陽，擬議而動，不可遠離陰陽物象而妄為也。" }
      - { type: j, text: "為道也屢遷，變動不居，周流六虛，六虛，六位也。" }
      - { type: z, text: "正義曰：“其為道也屢遷”者，屢，數也。言易之為道，皆法象陰陽，數數遷改，若《乾》之初九則“潛龍”，九二則“見龍”，是屢遷也。“變動不居”者，言陰陽六爻，更互變動，不恆居一體也。若一陽生為復，二陽生為臨之屬是也。“周流六虛”者，言陰陽周遍，流動在六位之虛。六位言“虛”者，位本無體，因爻始見，故稱“虛”也。" }
      - { type: j, text: "上下無常，剛柔相易，不可為典要。不可立定準也。" }
      - { type: z, text: "正義曰：“上下無常”者，初居一位，又居二位，是上無常定也。既窮上位之極，又下來居於初，是上下無常定也。若九月剝卦，一陽上極也，十一月，一陽下來歸初也。“剛柔相易，不可為典要”者，言陰陽六爻，兩相交易，或以陰易陽，或以陽易陰，或在初位相易，在二位相易，六位錯綜上下，所易皆不同，是不可為典常要會也。" }
      - { type: j, text: "唯變所適。變動貴於適時，趣舍存乎會也。" }
      - { type: z, text: "正義曰：言剛柔相易之時，既無定準，唯隨應變之時所之適也。" }
      - { type: j, text: "其出入以度，外內使知懼，明出入之度，使物之外內之戒也。出入尢行藏，外內尢隱顯。遯以遠時為吉，豐以幽隱致兇，漸以高顯為美，明夷以處昧利貞，此外內之戒也。" }
      - { type: z, text: "正義曰：“其出入以度”者，出入尢行藏也。言行藏各有其度，不可違失於時，故韓氏云豐以幽隱致兇，明夷以處昧利貞，是出入有度也。“外內使知懼”者，外內尢隱顯，言欲隱顯之人，使知畏懼於易也。若不應隱而隱，不應顯而顯，必有兇咎，使知畏懼兇咎而不為也。" }
      - { type: j, text: "又明於憂患與故。故，事故也。" }
      - { type: z, text: "正義曰：故，事故也。非但使人隱顯知懼，又使人明曉於憂患並與萬事也。" }
      - { type: j, text: "無有師保，如臨父母。安而不忘危，存而不忘亡。終日乾乾，不可以怠也。" }
      - { type: z, text: "正義曰：言使人畏懼此易，歸行善道，不須有師保教訓，恆常恭敬，如父母臨之，故云“如臨父母也”。" }
      - { type: j, text: "初率其辭而揆其方，既有典常。能循其辭以度其義，原其初以要其終，則唯變所適，是其常典也。明其變者，存其要也，故曰“苟非其人，道不虛行”。" }
      - { type: z, text: "正義曰：“初率其辭而揆其方”者，率，循也。揆，度也。方，義也。言人君若能初始依循其《易》之文辭，而揆度其易之義理，則能知易有典常也，故云“既有典常”。易雖千變萬化，不可為典要，然循其辭，度其義，原尋其初，要結其終，皆唯變所適，是其常典也。言惟變是常，既以變為常，其就變之中，剛之與柔相易，仍不常也。故上云“不可為典要”也。" }
      - { type: j, text: "苟非其人，道不虛行。" }
      - { type: z, text: "正義曰：言若聖人，則能循其文辭，揆其義理，知其典常，是易道得行也；若苟非通聖之人，則不曉達易之道理，則易之道不虛空得行也。言有人則易道行，若無人則易道不行，無人而行，是虛行也。必不如此，故云“道不虛行”也。" }
      - { type: j, text: "《易》之為書也，原始要終，以為質也。質，體也。卦兼終始之義也。" }
      - { type: z, text: "正義曰：此以下亦明《易》辭體用，尋其辭，則吉凶可以知也。“原始要終，以為質”者，質，體也。言《易》之為書，原窮其事之初始，乾“初九，潛龍勿用”，是原始也；又要會其事之終末，若“上九亢龍有悔”，是要終也。言《易》以原始要終，以為體質也，此“潛龍”、“亢龍”，是一卦之始終也。諸卦亦然，若大畜初畜而後通，皆是也。亦有一爻之中原始要終也。故《坤》卦之初六“履霜，堅冰至”，履霜，是原始也；“堅冰至”，是要終也。" }
      - { type: j, text: "六爻相雜，唯其時物也。爻各存乎其時。物，事也。" }
      - { type: z, text: "正義曰：物，事也。一卦之中，六爻交相雜錯，唯各會其時，唯各主其事。若《屯》卦初九“盤桓利居貞”，是居貞之時，有居貞之事。六二，“屯如邅如”，是乘陽屯邅之時，是有屯邅之事也。略舉一爻，餘爻仿此也。" }
      - { type: j, text: "其初難知，其上易知，本末也。初辭擬之，卒成之終。夫事始於微而後至於著。初者，數之始，擬議其端，故難知也。上者，卦之終，事皆成著，故易知也。" }
      - { type: z, text: "正義曰：“其初難知”者，謂卦之初始，起於微細，始擬議其端緒，事未顯著，故難知也。“其上易知”者，其上謂卦之上爻，事巳終極，成敗巳見，故易知也。上云其上，則其初宜云下也。初既言初，則上應稱末，互文也。以《易經》爻辭言初言上，故此從《經》文也。“本末也”者，其初難知是本也，其上易知，是末也。以事本，故難知；以事末，故易知，故云“本末也”。“初辭擬之”者，覆釋“其初難知”也。以初時以辭擬議其始，故難知也。“卒成之終”者，覆釋“其上易知”也。言上是事之卒了，而成就終竟，故易知也。" }
      - { type: j, text: "若夫雜物撰德，辯是與非，則非其中爻不備。噫亦要存亡吉凶，則居可知矣。知者觀其彖辭，則思過半矣。夫彖者，舉立象之統，論中爻之義，約以存博，簡以兼眾，雜物撰德，而一以貫之。形之所宗者道，眾之所歸者一。其事彌繁，則愈滯乎形；其理彌約，則轉近乎道。彖之為義，存乎一也。一之為用，同乎道矣。形而上者，可以觀道，過半之益，不亦宜乎。" }
      - { type: z, text: "“若夫”至“過半矣”。正義曰：“若夫雜物撰德，辨是與非，則非其中爻不備”者，言雜聚天下之物，撰數眾人之德，辨定是之與非，則非其中之一爻，不能備具也。謂一卦之內，而有六爻，各主其物，各數其德，欲辨定此六爻之是非，則總歸於中爻，言中爻統攝一卦之義多也。若非中爻，則各守一爻，不能盡統卦義，以中爻居一無偏，故能統卦義也。尤《乾》之九二“見龍在田，利見大人”，九五“飛龍在天，利見大人”，是總攝乾卦之義也。乾是陽長，是行利見大人之時。二之與五，統攝乾德。又《坤》之六二云“直方大”，攝坤卦地道之義。六五“黃裳元吉”，亦統攝“坤”之臣道之義也。“噫亦要存亡吉凶，則居可知矣”者，噫者，發聲之辭。卦爻雖眾，意義必在其中爻，噫乎發歎，要定或此卦存之與亡，吉之與兇，但觀其中爻，則居然可知矣。謂平居自知，不須營為也。“知者觀其彖辭，則思過半矣”者，彖辭，謂文王卦下之辭。言聰明知達之士，觀此卦下彖辭，則能思慮有益以過半矣。○注“夫彖者”至“近乎道”。○正義曰：“夫彖者，舉立象之統”者，謂文王卦下彖辭，舉明立此卦象之綱統也。云：“論中爻之義”者，言彖辭論量此卦中爻義意也。“舉立象之統”者，若《屯》卦彖云“利貞”，夫子釋云：“動於險中，大亨”。貞者，是舉立象之統也。論“中爻之義”者，若《蒙》卦云“蒙，亨”、“初筮告”，注云：“能為初筮，其唯二乎？”是《彖》云“初筮”，其在九二，是論中爻之義也。云“約以存博，簡以兼眾”者，唯舉中爻，是約是簡；存備六爻之義，是存博兼眾也。云“雜物撰德，而一以貫之”者，一卦六爻，雜聚諸物，撰數諸德，而用一道以貫穿之，一謂中爻也。以其居中，於上於下，無有偏二，故稱一也。“其事彌繁，則愈滯乎無形”者，愈，益也。滯，謂陷滯也。若事務彌更繁多，則轉益滯陷於形體，言處處妨礙也。云“其理彌約，則轉近乎道”者，若理能簡約則轉，轉附近於道，道以約少，無為之稱，故少則近於道也。" }
      - { type: z, text: "正義曰：“二與四”至“易之道也”，此第八章也。明諸卦二、三、四、五爻之功用，又明三才之道，並明《易》興之時，總贊明易道之大也，各隨文釋之。" }
      - { type: j, text: "二與四同功，同陰功也。而異位，有內外也。其善不同，二多譽，二處中和，故多譽也。四多懼，近也。位逼於君，故多懼也。柔之為道，不利遠者，其要無咎，其用柔中也。四之多懼，以近君也，柔之為道，須援而濟，故有不利遠者。二之能無咎，柔而處中也。" }
      - { type: z, text: "正義曰：“柔之為道，不利遠”者，此覆釋上“四多懼”之意。凡陰柔為道，當須親附於人以得濟。今乃遠其親援，而欲上逼於君，所以多懼。其不宜利於疏遠也。“其要無咎，其用柔中”者，覆釋上“二多譽”也。言二所多譽者，言二所以要會，無罪咎而多譽也。所以然者，以其用柔而居中也。" }
      - { type: j, text: "三與五同功，同陽功也。而異位，有貴賤也。三多兇，五多功，貴賤之等也。其柔危，其剛勝邪？三、五陽位，柔非其位，處之則危，居以剛健，勝其任也。夫所貴剛者，閒邪存誠，動而不違其節者也。所貴柔者，含弘居中，順而不失其貞者也。若剛以犯物，則非剛之道；柔以卑佞，則非柔之義也。" }
      - { type: z, text: "正義曰：“貴賤之等，其柔危，其剛勝邪”者，此釋“三與五同功”之義，五為貴，三為賤，是貴賤之等也。此並陽位，若陰柔處之則傾危，陽剛處之則克勝其任，故云“其柔危，其剛勝”也。諸本“三多兇五多功”之下，皆有注，今定本無也。三居下卦之極，故多兇。五居中處尊，故多功也。" }
      - { type: j, text: "《易》之為書也，廣大悉備，有天道焉，有人道焉，有地道焉，兼三材而兩之，故六。六者非它也，三材之道也。《說卦》備矣。" }
      - { type: z, text: "正義曰：“《易》之為書”至“吉凶生焉”。此節明三材之義，六爻相雜之理也。“六者非他，三材之道也”者，言六爻所效法者，非更別有他義，唯三材之道也。" }
      - { type: j, text: "道有變動，故曰爻，爻有等，故曰物。等，類也。乾，陽物也。坤，陰物也。爻有陰陽之類，而後有剛柔之用，故曰“爻有等，故曰物”。" }
      - { type: z, text: "正義曰：“道有變動，故曰爻”者，言三材之道，既有變化而移動，故重畫以象之，而曰爻也。“爻有等，故曰物”者，物，類也。言爻有陰陽貴賤等級，以象萬物之類，故謂之物也。" }
      - { type: j, text: "物相雜，故曰文。剛柔交錯，玄黃錯雜。" }
      - { type: z, text: "正義曰：言萬物遞相錯雜，若玄黃相間，故謂之文也。" }
      - { type: j, text: "文不當，故吉凶生焉。" }
      - { type: z, text: "正義曰：若相與聚居，間雜成文，不相妨害，則吉凶不生也。由文之不當，相與聚居，不當於理，故吉凶生也。" }
      - { type: j, text: "《易》之興也，其當殷之末世、周之盛德邪？當文王與紂之事邪？文王以盛德蒙難而能亨其道，故稱文王之德，以明易之道也。是故其辭危。文王與紂之事，危其辭也。" }
      - { type: z, text: "正義曰：“《易》之興也”至“易之道也”。此一節明《易》之興起在紂之末世，故其辭者，憂其傾危也。以當紂世憂畏滅亡，故作《易》辭，多述憂危之事，亦以垂法於後，使保身危懼，避其患難也。周氏云：“謂當紂時，不敢指斥紂惡，故其辭微危而不正也。”今案康伯之注云：“文王與紂之事，危其辭也”。則似周釋為得也。案下覆云：“危者使平”，則似危謂憂危，是非既未可明，所以兩存其釋也。" }
      - { type: j, text: "危者使平，易者使傾。易，慢易也。" }
      - { type: z, text: "正義曰：“危者使平”者，既有傾厄，以蒙大難，文王有天下，是危者使平也。“易者使傾”者，若其慢易，不循易道者，則使之傾覆，若紂為兇惡，以至誅滅也。" }
      - { type: j, text: "其道甚大，百物不廢。懼以終始，其要無咎。此之謂易之道也。夫文不當而吉凶生，則保其存者亡，不忘亡者存，有其治者亂，不忘危者安，懼以終始，歸於無咎，安危之所由，爻象之本體也。" }
      - { type: z, text: "正義曰：“其道甚大，百物不廢”者，言易道功用甚大，百種之物，賴之不有休廢也。“懼以終始”者，言恆能憂懼於終始，能於始思終，於終思始也。“其要無咎”者，若能始終皆懼，要會歸於無咎也。“此之謂易之道”者，言易之為道，若能終始之懼，則無兇咎，此謂易之所用之道，其大體如此也。" }
      - { type: z, text: "正義曰：“夫乾天下”至“其辭屈”，此第九章。自此巳下終篇末，總明易道之美，兼明易道愛惡相攻，情偽相感，吉凶悔吝由此而生，人情不等，制辭各異也。" }
      - { type: j, text: "夫乾，天下之至健也，德行恆易以知險。夫坤，天下之至順也，德行恆簡以知阻。能說諸心，能研諸侯之慮，諸侯，物主有為者也。能說萬物之心，能精為者之務。" }
      - { type: z, text: "正義曰：“德行恆易以知險”者，謂乾之德行，恆易略，不有艱難，以此之故，能知險之所興。若不有易略，則為險也，故行易以知險也。“德行恆簡以知阻”者，言坤之德行，恆為簡靜，不有煩亂，以此之故，知阻之所興也。若不簡則為阻難，故行簡靜，以知阻也。大難曰險，乾以剛健，故知其大難；小難曰阻，坤以柔順，故知其小難。知大難曰險者，案《坎》卦《彖》云：“天險不可升，地險山川丘陵”。言險不云阻，故知險為大難，險既為大，明阻為小也。“能說諸心”者，萬物之心，皆患險阻。今以阻險逆告於人，則萬物之心，無不喜說，故曰“能說諸心”也。“能研諸侯之慮”者，研，精也。諸侯既有為於萬物，育養萬物，使令得所，易既能說諸物之心，則能精妙諸侯之慮。謂諸侯以此易之道，思慮諸物，轉益精粹，故云“研諸侯之慮”也。" }
      - { type: j, text: "定天下之吉凶，成天下之亹亹者。是故變化云為，吉事有祥。象事知器，佔事知來。“夫變化云為”者，行其吉事，則獲嘉祥之應；觀其象事，則知制器之方；玩其佔事，則睹方來之驗也。" }
      - { type: z, text: "正義曰：“定天下之吉凶”者，言易道備載諸物得失，依之則吉，逆之則兇，是易能定天下之吉凶也。“成天下之亹亹”者，亹亹，勉也。天下有所營為，皆勉勉不息。若依此易道，則所為得成，故云“成天下之亹亹”也。“是故變化云為”者，易既備含諸事以是之故，物之或以漸變改，或頓從化易，或口之所云，或身之所為也。“吉事有祥”者，若行吉事則有嘉祥之應也。“象事知器”者，觀其所象之事，則知作器物之方也。“佔事知來”者，言卜佔之事，則知未來之驗也。言易之為道，有此諸德也。" }
      - { type: j, text: "天地設位，聖人成能。聖人乘天地之正，萬物各成其能。" }
      - { type: z, text: "正義曰：“天地設位”者，言聖人乘天地之正，設貴賤之位也。“聖人成能”者，聖人因天地所生之性，各成其能，令皆得所也。" }
      - { type: j, text: "人謀鬼謀，百姓與能。人謀，況議於眾以定失得也；鬼謀，況寄卜筮以考吉凶也。不役思慮，而失得自明；不勞探討，而吉凶自著。類萬物之情，通幽深之故，故百姓與能，樂推而不厭也。" }
      - { type: z, text: "正義曰：謂聖人欲舉事之時，先與人眾謀圖以定得失，又卜筮於鬼神以考其吉凶，是與鬼為謀也。聖人既先與人謀鬼神謀，不煩思慮與探討，自然能類萬物之情，能通幽深之理，是其能也，則天下百姓，親與能人，樂推為王也。自此巳上，論易道之大，聖人法之而行。" }
      - { type: j, text: "八卦以象告，以象告人。爻彖以情言。辭有險易，而各得其情也。" }
      - { type: z, text: "正義曰：自此巳下，又明卦爻剛柔變動情偽相感之事也。" }
      - { type: j, text: "剛柔雜居，而吉凶可見矣。變動以利言，變而通之，以盡利也。" }
      - { type: z, text: "正義曰：“剛柔雜居，而吉凶可見矣”者，剛柔二爻相雜而居，得理則吉，失理則兇，故吉凶可見也。“變動以利言”者，若不變不動，則於物有損有害；今變而動之，使利益於物，是變動以利而言說也。" }
      - { type: j, text: "吉凶以情遷。吉凶無定，唯人所動。情順乘理以之吉，情逆違道以蹈兇，故曰“吉凶以情遷”也。" }
      - { type: z, text: "正義曰：遷，謂遷移。凡得吉者，由情遷移於善也。所得兇者，由情遷於惡也。" }
      - { type: j, text: "是故愛惡相攻而吉凶生，泯然同順，何吉何兇？愛惡相攻，然後逆順者殊，故吉凶生。" }
      - { type: z, text: "正義曰：若泯然無心，事無得失，何吉凶之有，由有所貪愛，有所憎惡，兩相攻擊，或愛攻於惡，或惡攻於愛，或兩相攻擊，事有得失，故吉凶生也。" }
      - { type: j, text: "遠近相取而悔吝生，相取，尢相資也。遠近之爻，互相資取，而後有悔吝也。" }
      - { type: z, text: "正義曰：遠謂兩卦上下相應之類，近謂比爻共聚，迭相資取，取之不以理，故悔吝生也。" }
      - { type: j, text: "情偽相感而利害生。情以感物則得利，偽以感物則致害也。" }
      - { type: z, text: "正義曰：情，謂實情；偽，謂虛偽。虛實相感，若以情實相感則利生，若以虛偽相感則害生也。" }
      - { type: j, text: "凡易之情，近而不相得則兇。近，況比爻也。易之情，剛柔相摩，變動相適者也。近而不相得，必有乖違之患。或有相違而無患者，得其應也；相順而皆兇者，乖於時也。存事以考之，則義可見矣。" }
      - { type: z, text: "正義曰：近，謂兩爻相近而不相得，以各無外應，則致兇咎；若各有應，雖近不相得，不必皆兇也。" }
      - { type: j, text: "或害之，悔且吝。夫無對於物而後盡全順之道，豈可有欲害之者乎？雖能免濟，必有悔吝也。或，欲害之辭也。" }
      - { type: z, text: "正義曰：言若能弘通，不偏對於物，盡竭順道，物豈害之？今既有心於物，情意二三，其外物則或欲害之，則有兇禍。假令自能免濟，猶有悔及吝也。故云“或害之，悔且吝”也。" }
      - { type: j, text: "將叛者其辭慚，中心疑者其辭枝。吉人之辭寡，躁人之辭多。誣善之人其辭游，失其守者其辭屈。" }
      - { type: z, text: "正義曰：“將叛者其辭慚”者，此巳下說人情不同，其辭各異。將欲違叛巳者，貌雖相親，辭不以實，故其辭慚也。“中心疑者其辭枝”者，枝，謂樹枝也。中心於事疑惑，則其心不定，其辭分散若閒枝也。“吉人之辭寡”者，以其吉善辭直，故辭寡也。“躁人之辭多”者，以其煩躁，故其辭多也。“誣善之人其辭游”者，游，謂浮游。誣罔善人，其辭虛漫，故言其辭游也。“失其守者其辭屈”者，居不值時，失其所守之志，故其辭屈橈不能申也。凡此辭者，皆論《易經》之中有此六種之辭，謂作《易》之人，述此六人之意，各準望其意而制其辭也。" }
      - { type: j, text: "上一頁 目錄頁 下一頁" }
