# 長物志·水石：點校中導覽（teaser）
sections:
  - id: shui-shi
    name: 水石
    blocks:
      - type: j
        text: 水石
      - type: z
        text: 導：此章論水石。「石令人古，水令人遠」，園林最不可無；一峰一勺，縮太華江湖於几席。薦語：「一峰則太華千尋，一勺則江湖萬里」。
      - type: j
        text: 石令人古，水令人遠。園林水石，最不可無。要須迴環峭拔，安插得宜，一峰則太華千尋，一勺則江湖萬里。
      - type: z
        text: 讀：古、遠是水石予人之境，一峰、一勺是縮地之法。園林縮千里於咫尺，盡在此十六字。
      - type: j
        text: 又須修竹老木，怪藤丑樹，交覆角立，蒼崖碧澗，奔泉汛流，如入深嚴絕壑之中，乃為名區勝地。
      - type: z
        text: 讀：竹木藤樹為水石作襯，「如入」二字是造園之眼：園者造境，貴在使人忘其為境。
