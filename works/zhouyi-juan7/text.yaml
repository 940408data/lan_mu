# 周易正義卷七（孔穎達疏）：j 為經文＋王弼注，z 為正義疏文。
sections:
  - id: juan7
    name: 卷七
    blocks:
      - { type: j, text: "周易系辭上第七。" }
      - { type: z, text: "正義曰：謂之“系辭”者，凡有二義，論字取系屬之義。聖人系屬此辭於爻卦之下，故此篇第六章云：“系辭焉以斷其吉凶。”第十二章云：“系辭焉以盡其言。”是系屬其辭於爻卦之下，則上下二篇《經》辭是也。文取系屬之義，故字體從“毄”。又音為系者，取剛系之義。卦之與爻，各有其辭以釋其義，則卦之與爻，各有剛系，所以音謂之系也。夫子本作《十翼》，申說上下二篇《經》文，《系辭》條貫義理，別自為卷，總曰《系辭》。分為上下二篇者，何氏云：上篇明無，故曰“易有太極”，太極即無也。又云“聖人以此洗心，退藏於密”，是其無也。下篇明幾，從無入有，故云“知幾其神乎”。今謂分為上下，更無異義，有以簡編重大，是以分之。或以上篇論易之大理，下篇論易之小理者，事必不通。何則？案上《系》云：“君子出其言善，則千里之外應之。出其言不善，則千里之外違之。”又云：“藉用白茅，無咎。”皆人言語小事，及小慎之行，豈為易之大理？又下《系》云：“天地之道，貞觀者也。日月之道，貞明者也。”豈復易之小事乎？明以大小分之，義必不可。故知聖人既無其意，若欲強釋，理必不通。諸儒所釋上篇，所以分段次下，凡有一十二章。周氏云：“天尊地卑”為第一章，“聖人設卦觀象”為第二章，“彖者言乎象者”為第三章，“精氣為物”為第四章，“顯諸仁藏諸用”為第五章，“聖人有以見天下之賾”為第六章，“初六藉用白茅”為第七章，“大衍之數”為第八章，“子曰知變化之道”為第九章，“天一地二”為第十章，“是故易有太極”為第十一章，“子曰書不盡言”為第十二章。馬季長、荀爽、姚信等又分“白茅”章後，取“負且乘”更為別章，成十三章。案“白茅”以下，歷序諸卦，獨分“負且乘”以為別章，義無所取也。虞翻分為十一章，合“大衍之數”並“知變化之道”，共為一章，案“大衍”一章，總明揲蓍策數，及十有八變之事，首尾相連。其“知變化之道”己下，別明“知神”及“唯幾”之事，全與“大衍”章義不類，何得合為一章？今從先儒以十二章為定。" }
      - { type: z, text: "正義曰：“天尊地卑”至“其中矣”，此第一章，明天尊地卑，及貴賤之位，剛柔動靜寒暑往來，廣明乾坤簡易之德。聖人法之，能見天下之理。" }
      - { type: j, text: "天尊地卑，乾坤定矣。乾坤其易之門戶，先明天尊地卑，以定乾坤之體。" }
      - { type: z, text: "“天尊”至“定矣”。○正義曰：天以剛陽而尊，地以柔陰而卑，則乾坤之體安定矣。乾健與天陽同，坤順與地陰同，故得乾坤定矣。若天不剛陽，地不柔陰，是乾坤之體不得定也。此《經》明天地之德也。○注“先明”至“之體”。○正義曰：云：“先明天尊地卑，以定乾坤之體”者，易含萬象，天地最大。若天尊地卑，各得其所，則乾坤之義得定矣。若天之不尊，降在滯溺；地之不卑，進在剛盛，則乾坤之體，何由定矣？案乾坤是天地之用，非天地之體，今云乾坤之體者，是所用之體，乾以健為體，坤以順為體，故云“乾坤之體”。" }
      - { type: j, text: "卑高以陳，貴賤位矣。天尊地卑之義既列，則涉乎萬物，貴賤之位明矣。" }
      - { type: z, text: "“卑高”至“位矣”。○正義曰：卑，謂地體卑下；高，謂天體高上。卑高既以陳列，則物之貴賤，得其位矣。若卑不處卑，謂地在上，高不處高，謂天在下。上下既亂，則萬物貴賤則不得其位矣。此《經》明天地之體，此雖明天地之體，亦涉乎萬物之形。此“貴賤”總兼萬物，不唯天地而已，先云“卑”者，使文爾。案前《經》云“天尊地卑”，“天地”別陳。此“卑高以陳”，不更別陳。總云“卑高”者，上文詳，於此略也。○注“天尊”至“明矣”。○正義曰：“天尊地卑之義既列”，解《經》“卑高以陳”也。云“則涉乎萬物貴賤之位明矣”，解《經》“貴賤位矣”。上《經》既云“天尊地卑”，此《經》又云“貴賤”者，則貴非唯天地，是兼萬物之貴賤。" }
      - { type: j, text: "動靜有常，剛柔斷矣。剛動而柔止也。動止得其常體，則剛柔之分著矣。" }
      - { type: z, text: "正義曰：天陽為動，地陰為靜，各有常度，則剛柔斷定矣。動而有常則成剛，靜而有常則成柔，所以剛柔可斷定矣。若動而無常，則剛道不成；靜而無常，則柔道不立。是剛柔雜亂，動靜無常，則剛柔不可斷定也。此《經》論天地之性也。此雖天地動靜，亦裛兼萬物也。萬物稟於陽氣多而為動也，稟於陰氣多而為靜也。" }
      - { type: j, text: "方以類聚，物以群分，吉凶生矣。方有類，物有群，則有同有異，有聚有分也。順其所同，則吉；乖其所趣，則兇，故吉凶生矣。" }
      - { type: z, text: "“方以類聚”至“生矣”。○正義曰：方，謂法術性行，以類共聚，固方者則同聚也。物，謂物色群黨，共在一處，而與他物相分別。若順其所同，則吉也；若乖其所趣，則兇也，故曰“吉凶生矣”。此《經》雖因天地之性，亦廣包萬物之情也。○注“方有類”。○正義曰：云“方有類”者，方，謂法術情性趣舍，故《春秋》云“教子以義方”，《注》云：“方，道也。”是方謂性行法術也。言方雖以類而聚，亦有非類而聚者。若陰之所求者陽，陽之所求者陰，是非類聚也。若以人比禽獸，即是非類，雖男女不同，俱是人例，亦是以類聚也。故云“順所同則吉，乖所趣則兇”。" }
      - { type: j, text: "在天成象，在地成形，變化見矣。象況日月星辰，形況山川草木也。懸象運轉以成昏明，山澤通氣而云行雨施，故變化見矣。" }
      - { type: z, text: "正義曰：“象”謂懸象，日月星辰也。“形”謂山川草木也。懸象運轉而成昏明，山澤通氣而云行雨施，故變化是也。" }
      - { type: j, text: "是故剛柔相摩，相切摩也，言陰陽之交感也。" }
      - { type: z, text: "正義曰：以變化形見，即陽極變為陰，陰極變為陽，陽剛而陰柔，故剛柔共相切摩，更遞變化也。" }
      - { type: j, text: "八卦相蕩。相推蕩也，言運化之推移。" }
      - { type: z, text: "正義曰：剛則陽爻也。柔則陰爻也。剛柔兩體，是陰陽二爻，相雜而成八卦，遞相推蕩。若十一月一陽生而推去一陰，五月一陰生而推去一陽。雖諸卦遞相推移，本從八卦而來，故云“八卦相蕩也”。" }
      - { type: j, text: "鼓之以雷霆，潤之以風雨。日月運行，一寒一暑。乾道成男，坤道成女。乾知大始，坤作成物。乾以易知，坤以簡能。天地之道，不為而善始，不勞而善成，故曰易簡。" }
      - { type: z, text: "“鼓之以雷霆”至“簡能”。○正義曰：“鼓之以雷霆，潤之以風雨，日月運行，一寒一暑”者，重明上《經》“變化見矣”及“剛柔相摩，八卦相蕩”之事。八卦既相推蕩，各有功之所用也。又鼓動之以震雷離電，滋潤之以巽風坎雨，或離日坎月，運動而行，一節為寒，一節為暑，直云震、巽、離、坎，不云乾、坤、艮、兌者，乾、坤上下備言，艮、兌非鼓動運行之物，故不言之，其實亦一焉。雷電風雨，亦出山澤也。“乾道成男，坤道成女”者，道謂自然而生，故乾得自然而為男，坤得自然而成女。必云成者有故，以乾因陰而得成男，坤因陽而得成女，故云成也。“乾知太始”者，以乾是天陽之氣，萬物皆始在於氣，故云知其大始也。“坤作成物”者，坤是地陰之形，坤能造作以成物也。初始無形，未有營作，故但云知也。巳成之物，事可營為，故云作也。“乾以易知”者，易謂易略，無所造為，以此為知，故曰“乾以易知”也。“坤以簡能”者，簡謂簡省凝靜，不須繁勞，以此為能，故曰“坤以簡能”也。若於物艱難，則不可以知，故以易而得知也。若於事繁勞，則不可能也。必簡省而後可能也。○注“天地之道”至“易簡”。○正義曰：云：“天地之道，不為而善始”者，釋《經》之“乾以易知”。“不勞而善成”者，釋《經》“坤以簡能”也。案《經》乾易坤簡，各自別言，而《注》合云天地者，若以坤對乾，乾為易也，坤為簡也。《經》之所云者是也。若據乾坤相合皆無為，自然養物之始也，是自然成物之終也。是乾亦有簡，坤亦有易，故《注》合而言之也。用使聖人俱行易簡，法無為之化。" }
      - { type: j, text: "易則易知，簡則易從。易知則有親，易從則有功。順萬物之情，故曰有親。通天下之志，故曰有功。" }
      - { type: z, text: "正義曰：“易則易知”者，此覆說上“乾以易知”也。乾德既能說易，若求而行之，則易可知也。“簡則易從”者，覆說上“坤以簡能”也。於事簡省，若求而行之，則易可從也。上“乾以易知，坤以簡能”，論乾坤之體性也。“易則易知，簡則易從”者，此論乾坤既有此性，人則易可仿效也。“易知則有親”者，性意易知，心無險難，則相和親，故云“易知則有親”也。“易從則有功”者，於事易從，不有繁勞，其功易就，故曰“易從則有功”。此二句，論聖人法此乾坤易簡，則有所益也。" }
      - { type: j, text: "有親則可久，有功則可大。有易簡之德，則能成可久可大之功。" }
      - { type: z, text: "正義曰：“有親則可久”者，物既和親，無相殘害，故可久也。“有功則可大”者，事業有功，則積漸可大。此二句，論人法乾坤，久而益大。" }
      - { type: j, text: "可久則賢人之德，可大則賢人之業。天地易簡，萬物各載其形。聖人不為，群方各遂其業。德業既成，則入於形器，故以賢人目其德業。" }
      - { type: z, text: "“可久”至“之業”。○正義曰：“可久則賢人之德”者，使物長久，是賢人之德，能養萬物，故云“可久則賢人之德”也。“可大則賢人之業”者，功勞既大，則是賢人事業。行天地之道，總天地之功，唯聖人能。然今云賢人者，聖人則隱跡藏用，事在無境。今云“可久”“可大”，則是離無入有，賢人則事在有境。故“可久”“可大”，以賢人目之也。○注“聖人”至“其業”。○正義曰：云：“聖人不為，群方各遂其業”者，聖人顯仁藏用，唯見生養之功，不見其何以生養，猶若日月見其照臨之力，不知何以照臨，是聖人用無為以及天下，是聖人不為也。云“德業既成，則入於形器”者，初行德業未成之時，不見其所為，是在於虛無。若德業既成，復被於物，在於有境，是入於形器也。賢人之分，則見其所為，見其成功始末，皆有德之與業，是所有形器，故以賢人目其德業。然則本其虛無玄象謂之聖，據其成功事業謂之賢也。" }
      - { type: j, text: "易簡而天下之理得矣。天下之理，莫不由於易簡而各得順其分位也。" }
      - { type: z, text: "“易簡”至“得矣”。○正義曰：此則贊明聖人能行天地易簡之化，則天下萬事之理，並得其宜矣。○注“易簡”。○正義曰：若能行說易簡靜，任物自生，則物得其性矣。故《列子》云：“不生而物自生，不化而物自化。”若不行易簡，法令茲章，則物失其性也。《老子》云：“水至清則無魚，人至察則無徒”。又莊云：“馬翦剔羈絆，所傷多矣。”是天下之理未得也。" }
      - { type: j, text: "天下之理得，而成位乎其中矣。成位至立象也。極易簡則能通天下之理，通天下之理，故能成象，並乎天地言其中，則並明天地也。" }
      - { type: z, text: "正義曰：成位況立象，言聖人極易簡之善，則能通天下之理，故能成立卦象於天地之中，言並天地也。" }
      - { type: z, text: "正義曰：“聖人設卦”至“不利”，此第二章也。前章言天地成象成形，簡易之德，明乾坤之大旨。此章明聖人設卦觀象，爻辭吉凶，悔吝之細別。" }
      - { type: j, text: "聖人設卦觀象，此總言也。" }
      - { type: z, text: "“聖人”至“觀象”。○正義曰：謂聖人設畫其卦之時，莫不瞻觀物象，法其物象，然後設之，卦象則有吉有兇，故下文云“吉凶者，失得之象也。悔吝者，憂虞之象。變化者，進退之象。剛柔者，晝夜之象”。是施設其卦，有此諸象也。○注“此總言也”。○正義曰：此設卦觀象，總為下而言，故云“此總言也”。" }
      - { type: j, text: "系辭焉而明吉凶，剛柔相推而生變化。系辭所以明吉凶，剛柔相推所以明變化也。吉凶者，存乎人事也。變化者，存乎運行也。" }
      - { type: z, text: "正義曰：“系辭焉而明吉凶”者，卦象爻象，有吉有兇。若不系辭，其理未顯。故系屬吉凶之文辭於卦爻之下，而顯明此卦爻吉凶也。案吉凶之外，猶有悔吝憂虞，直云而明吉凶者，悔吝憂虞，是兇中之小，別舉吉凶，則包之可知也。“剛柔相推而生變化”者，八純之卦，卦之與爻，其象既定，變化猶少；若剛柔二氣相推，陰爻陽爻交變，分為六十四卦，有三百八十四爻，委曲變化，事非一體，是“而生變化”也。系辭而明吉凶，明系辭之意；剛柔相推而生變化，明其推引而生雜卦之意也。" }
      - { type: j, text: "是故吉凶者，失得之象也。由有失得，故吉凶生。" }
      - { type: z, text: "正義曰：此下四句《經》，總明諸象不同之事，辭之吉者是得之象；辭之兇者是失之象，故曰“吉凶者，是失得之象也”。初時於事有失有得，積漸成著，乃為吉凶也。然《易》之諸卦及爻不言吉凶者，義有數等。或吉凶據文可知，不須明言吉凶者。若《乾》“元亨利貞”及“九五，飛龍在天，利見大人”之屬，尋文考義，是吉可知，故不須云吉也。若其《剝》“不利有攸往”，《離》之九四“突如其來如，焚如，死如，棄如”之屬，據其文辭，其兇可見，故不言兇也。亦有爻處吉凶之際，吉凶未定，行善則吉，行惡則兇。是吉凶未定，亦不言吉凶，若《乾》之九三“君子終日乾乾，夕惕若，厲無咎”，若《屯》之六二“屯如邅如，乘馬班如，匪寇，婚媾，女子貞不字，十年乃字”，是吉凶未定，亦不言吉凶也。又諸稱無咎者，若不有善應則有咎，若有善應則無咎，此亦不定言吉凶也。諸稱吉凶者，皆嫌其吉凶不明，故言吉凶以正之，若《坤》之六五“黃裳元吉”，以陰居尊位，嫌其不吉，故言吉以明之。推此餘可知也。亦有於事無嫌，吉凶灼然可知，而更明言吉凶者，若《剝》之初六“剝床以足，蔑貞兇”、六二“剝床以辨，蔑貞兇”者，此皆兇狀灼然，而言兇也。或有一卦之內，或一爻之中，得失相形，須言吉凶。若《大過》九三“棟橈兇”、九四“棟隆吉”，是一卦相形也；《屯》卦九五“屯其膏，小貞吉，大貞兇”，是一爻相形也。亦有一事相形，終始有異。若《訟》卦“有孚窒惕，中吉，終兇”之類是也。大略如此。原夫《易》之為書，曲明萬象，苟在釋辭，明其意，達其理，不可以一爻為例，義有變通也。" }
      - { type: j, text: "悔吝者，憂虞之象也。失得之微者，足以致憂虞而巳，故曰悔吝。" }
      - { type: z, text: "正義曰：《經》稱悔吝者，是得失微小，初時憂念虞度之形象也。以憂虞不巳，未是大凶，終致悔吝。悔者，其事巳過，意有追悔之也。吝者，當事之時，可輕鄙恥，故云吝也。吝既是小兇，則《易》之為書亦有小吉，則無咎之屬善補過是也。此亦小吉，而不言者，下《經》備陳之也，故於此不言。其餘元亨利貞，則是吉象之境，有四德別言，故於此不言也。其以祉有慶有福之屬，各於爻卦別言，故不在此而說。且《易》者戒人為惡，故於惡事備言也。" }
      - { type: j, text: "變化者，進退之象也。往復相推，迭進退也。" }
      - { type: z, text: "正義曰：萬物之象，皆有陰陽之爻，或從始而上進，或居終而倒退，以其往復相推，或漸變而頓化，故云“進退之象也”。" }
      - { type: j, text: "剛柔者，晝夜之象也。晝則陽剛，夜則陰柔，始總言吉凶變化，而下別明悔吝、晝夜者，悔吝則吉凶之類，晝夜亦變化之道，吉凶之類，則同因系辭而明；變化之道，則俱由剛柔而著，故始總言之，下則明失得之輕重，辨變化之小大，故別序其義也。" }
      - { type: z, text: "“剛柔”至“象也”。○正義曰：晝則陽日照臨，萬物生而堅剛，是晝之象也。夜則陰潤浸被，萬物而皆柔弱，是夜之象也。○注“始總”至“變化”。○正義曰：云：“始總言吉凶變化”者，謂上文云“系辭焉而明吉凶，剛柔相推而生變化”，是始總言吉凶變化也。云“而下別明悔吝晝夜”者，謂次文云“悔吝者，憂虞之象”，“剛柔者，晝夜之象”，是別明悔吝晝夜也。言“悔吝則吉凶之類”者，案上文系辭而明吉凶，次又別序云：“吉凶者，失得之象。”“悔吝者，憂虞之象。”是吉凶之外，別生悔吝，是悔吝亦吉凶之類。大略總言吉凶，是細別之，吉凶之外，別有悔吝也，故云“悔吝則吉凶之類”。云“晝夜亦變化之道”者，案上文云“剛柔相推而生變化”，次文別云“變化者，進退之象”，“剛柔者，晝夜之象”，變化之外，別云晝夜，總言之則變化晝夜是一，分之則變化晝夜是殊，故云“晝夜亦變化之道”也。云“吉凶之類，則同因系辭而明”者，案上文云“系辭焉而明吉凶”，次文別序云“吉凶”“悔吝”，兩事同因上系辭而明之也，故云“吉凶之類，則同因《系辭》而明”也。云“變化之道，則俱由剛柔而著”者，上文“剛柔相推而生變化”，次文別序云：“變化者，進退之象。剛柔者，晝夜之象。”上文則變化剛柔合為一，次文則別序變化剛柔分為二。合之則同，分之則異，是變化從剛柔而生，故云“變化之道，俱由剛柔而著”也。云“故始總言之”也。上文“系辭焉而明吉凶”，不云悔吝，是總言之也。又上文“剛柔相推而生變化”，不云晝夜，是總變化言之也。云“下則明失得之輕重，辨變化之小大，故別序其義”者，案次文別序云：“吉凶者，失得之象。”是失得重也；“悔吝者，憂虞之象”。是失得輕也。又次《經》云：“變化者，進退之象。”是變化大也；“剛柔者，晝夜之象”。是變化小也。兩事並言，失得別明輕重，變化別明小大，是別序其義。" }
      - { type: j, text: "六爻之動，三極之道也。三極，三材也。兼三材之道，故能見吉凶，成變化也。" }
      - { type: z, text: "正義曰：此覆明變化進退之義，言六爻遞相推動而生變化，是天地人三才至極之道，以其事兼三才，故能見吉凶而成變化也。" }
      - { type: j, text: "是故君子所居而安者，易之序也。序，易象之次序。" }
      - { type: z, text: "正義曰：以其在上，吉凶顯其得失，變化明其進退，以此之故，君子觀象知其所處，故可居治之位，而安靜居之，是易位之次序也。若居在乾之初九，而安在勿用，若居在乾之九三，而安在乾乾，是以所居而安者，由觀易之位次序也。" }
      - { type: j, text: "所樂而玩者，爻之辭也。是故君子居則觀其象而玩其辭，動則觀其變而玩其佔。是以自天祐之，吉無不利。" }
      - { type: z, text: "“所樂”至“無不利”。○正義曰：“所樂而玩者，爻之辭也”者，言君子愛樂而習翫者，是六爻之辭也。辭有吉凶悔吝，見善則思齊其事，見惡則懼而自改，所以愛樂而耽玩也。卦之與爻，皆有其辭，但爻有變化，取象既多，以知得失。故君子尢所愛樂，所以特云“爻之辭”也。“是故君子居則觀其象而玩其辭”者，以易象則明其善惡，辭則示其吉凶，故君子自居處其身，觀看其象，以知身之善惡，而習翫其辭，以曉事之吉凶。“動則觀其變而玩其佔”者，言君子出行興動之時，則觀其爻之變化，而習翫其佔之吉凶。若《乾》之九四“或躍在淵”，是動則觀其變也。《春秋傳》云：“先王卜征五年。”又云：“卜以決疑。”是動玩其佔也。“是以自天祐之，吉無不利”者，君子既能奉遵易象，以居處其身，無有兇害，是以從天以下，悉皆祐之，吉無不利。此《大有》上九爻辭。" }
      - { type: z, text: "正義曰：“彖者言乎”至“生之說”，此第三章也。上章明吉凶悔吝系辭之義，而細意未盡，故此章更委曲說卦爻吉凶之事。是以義理深奧，能彌綸天地之道，仰觀俯察，知死生之說。" }
      - { type: j, text: "彖者，言乎象者也。彖總一卦之義也。" }
      - { type: z, text: "正義曰：《彖》謂卦下之辭，言說乎一卦之象也。" }
      - { type: j, text: "爻者，言乎變者也。爻各言其變也。" }
      - { type: z, text: "正義曰：謂爻下之辭，言說此爻之象改變也。" }
      - { type: j, text: "吉凶者，言乎其失得也。悔吝者，言乎其小疵也。無咎者，善補過也。是故列貴賤者存乎位，爻之所處曰位，六位有貴賤也。" }
      - { type: z, text: "正義曰：“吉凶者，言乎其失得也”者，謂爻卦下辭也。著其吉凶者，言論其卦爻失之與得之義也。前章言據其卦爻之象，故云“吉凶者，失得之象”。此章據其卦爻之辭，故云“吉凶者，言乎其失得”也。“悔吝者，言乎其小疵也”者，辭著悔吝者，言說此卦爻有小疵病也。有小疵病，必預有憂虞，故前章云：“悔吝者，憂虞之象。”但前章據其象，此章論其辭也。“無咎者，善補過也”者，辭稱無咎者，即此卦爻能補其過。若不能補過，則有咎也。案《略例》：無咎有二，一者善能補過，故無咎。二者其禍自已招，無所怨咎，故《節》之六三：“不節之嗟，又誰咎也？”但如此者少，此據多者言之，故云“善補過也”。前章舉其大略，故不細言無咎之事，此章備論也。“是故列貴賤者存乎位”者，以爻者言乎變，以此之故，陳列物之貴賤者在存乎六爻之位，皆上貴而下賤也。" }
      - { type: j, text: "齊小大者存乎卦，卦有小大也，齊猶言辨也，即彖者言乎象也。" }
      - { type: z, text: "正義曰：以彖者言乎象，象有小大，故齊辨物之小大者存乎卦也。猶若《泰》則“小往大來，吉亨”，《否》則“大往小來”之類是也。" }
      - { type: j, text: "辯吉凶者存乎辭，辭，爻辭也，即“爻者言乎變”也。言象所以明小大，言變所以明吉凶。故小大之義存乎卦，吉凶之狀見乎爻。至於悔吝無咎，其例一也。吉凶悔吝小疵無咎，皆主乎變，事有小大，故下歷言五者之差也。" }
      - { type: z, text: "“辯吉”至“乎辭”。○正義曰：謂辯明卦之與爻之吉凶，存乎卦爻下之言辭是也。○注“辭爻”至“差也”。○正義曰：云：“辭，爻辭也”者，其實卦之與爻，皆有其辭。知是爻辭者，但卦辭變化少，爻辭變化多，此《經》“辯吉凶者存乎辭”，與“齊小大者存乎卦”，二文相對，上既云卦，故此辭為爻辭也。云“言象所以明小大”者，即“齊小大者存乎卦”是也。云“言變化所以明吉凶”者，則“辯吉凶者存乎辭”是也。云“故小大之義存乎卦”者，覆說“言象所以明小大”也。云“吉凶之狀見乎爻”者，覆說“言變所以明吉凶”也。云“悔吝無咎，其例一也”者，謂悔吝無咎，體例與吉凶一也，皆是存乎辭。云“悔吝小疵無咎，皆生乎變”者，謂皆生於爻也。言乎變者，謂皆從爻變而來。云“事有小大”者，大則為吉凶，小則為悔吝無咎也。云“故下歷言五者之差”者，謂於吉凶下歷次言五者之差別，數五者，謂吉一，兇二，悔三，吝四，無咎五。“然諸儒以為五者，皆數列貴賤者存乎位，”是其一也。“齊小大者存乎卦”，是其二也。“辯吉凶者存乎辭”，是其三也。“憂悔吝者存乎介”，是其四也。“震無咎者存乎無悔”，是其五也。於《經》數之為便，但於《注》理則乖，今並存焉，任後賢所釋。" }
      - { type: j, text: "憂悔吝者存乎介，介，纖介也。王弼曰：憂悔吝之時，其介不可慢也。即“悔吝者言乎小疵也”。" }
      - { type: z, text: "正義曰：介謂纖介，謂小小疵病。能預憂虞悔吝者，存於細小之疵病也。" }
      - { type: j, text: "震無咎者存乎無悔。無咎者，善補過也。震，動也。故動而無咎，存乎無悔過也。" }
      - { type: z, text: "正義曰：震，動也。動而無咎者，存乎能自悔過也。" }
      - { type: j, text: "是故卦有小大，辭有險易。其道光明曰大，君子道消曰小；之泰則其辭易，之否則其辭險。" }
      - { type: z, text: "正義曰：其道光明謂之大，其道消散謂之小。若之適通泰，其辭則說易，若之適否塞，其辭則難險也。" }
      - { type: j, text: "辭也者，各指其所之。《易》與天地準，作《易》以準天地。" }
      - { type: z, text: "正義曰：“辭也者，各指其所之”者，謂爻卦之辭，各斥其爻卦之之適也。若之適於善，則其辭善。若之適於惡，則其辭惡也。“《易》與天地準”者，自此已上，論卦爻辭理之義；自此已下，廣明《易》道之美。言聖人作《易》，與天地相準。謂準擬天地，則乾健以法天，坤順以法地之類是也。" }
      - { type: j, text: "故能彌綸天地之道，仰以觀於天文，俯以察於地理，是故知幽明之故。原始反終，故知死生之說。幽明者，有形無形之象。死生者，終始之數也。" }
      - { type: z, text: "正義曰：“故能彌綸天地之道”者，以《易》與天地相準，為此之故聖人用易，能彌綸天地之道，彌謂彌縫補合，綸謂經綸牽引，能補合牽引天地之道，用此易道也。““仰以觀於天文，俯以察於地理”者，天有懸象而成文章，故稱文也。地有山川原隰，各有條理，故稱理也。“是故知幽明之故”者，故謂事也。故以用易道，仰觀俯察，知無形之幽，有形之明，義理事故也。“原始反終，故知生死之說”者，言用易理，原窮事物之初始，反覆事物之終末，始終吉凶，皆悉包羅，以此之故，知死生之數也。正謂用易道參其逆順，則禍福可知；用蓍策求其吉凶，則死生可識也。" }
      - { type: z, text: "正義曰：“精氣為物”至“鮮矣”，此第四章也。上章明卦爻之義，其事類稍盡，但卦爻未明鬼神情狀。此章說物之改變而為鬼神，易能通鬼神之變化，故於此章明之。" }
      - { type: j, text: "精氣為物，游魂為變，精氣煙熅，聚而成物。聚極則散，而游魂為變也。游魂，言其游散也。" }
      - { type: z, text: "正義曰：云：“精氣為物”者，謂陰陽精靈之氣，氤氳積聚而為萬物也。“游魂為變”者，物既積聚，極則分散，將散之時，浮游精魂，去離物形，而為改變，則生變為死，成變為敗，或未死之間，變為異類也。" }
      - { type: j, text: "是故知鬼神之情狀。盡聚散之理，則能知變化之道，無幽而不通也。" }
      - { type: z, text: "“是故”至“情狀”。○正義曰：能窮易理，盡生死變化，以此之故，能知鬼神之內外情狀也。物既以聚而生，以散而死，皆是鬼神所為，但極聚散之理，則知鬼神之情狀也。言聖人以易之理面能然也。○注“知變化之道”。○正義曰：案下云“神無方”，韓氏云自此以上皆言神之所為。則此《經》“情狀”是虛地之神。聖人極虛無之神，如變化之道，幽冥悉通，故能知鬼神之情狀。" }
      - { type: j, text: "與天地相似，故不違。德合天地，故曰相似。" }
      - { type: z, text: "正義曰：天地能知鬼神，任其變化。聖人亦窮神儘性，能知鬼神，是與天地相似，所為所作，故不違於天地，能與天地合也。" }
      - { type: j, text: "知周乎萬物，而道濟天下，故不過。知周萬物，則能以道濟天下也。" }
      - { type: z, text: "正義曰：“知周乎萬物，而道濟天下”者，聖人無物不知，是知周於萬物。天下皆養，是道濟天下也。“故不過”者，所為皆得其宜，不有愆過，使物失分也。" }
      - { type: j, text: "旁行而不流，應變旁通，而不流淫也。" }
      - { type: z, text: "正義曰：言聖人之德，應變旁行，無不被及，而不有流移淫過。若不應變化，非理而動，則為流淫也。" }
      - { type: j, text: "樂天知命，故不憂。順天之化，故曰樂也。" }
      - { type: z, text: "正義曰：順天施化，是歡樂於天；識物始終，是自知性命。順天道之常數，知性命之始終，任自然之理，故不憂也。" }
      - { type: j, text: "安土敦乎仁，故能愛。安土敦仁者，萬物之情也。物順其情，則仁功贍矣。" }
      - { type: z, text: "正義曰：言萬物之性，皆欲安靜於土，敦厚於仁。聖人能行此安土敦仁之化，故能愛養萬物也。" }
      - { type: j, text: "範圍天地之化而不過。範圍者，擬範天地，而周備其理也。" }
      - { type: z, text: "正義曰：範謂模範，圍謂周圍，言聖人所為所作，模範周圍天地之化養，言法則天地以施其化，而不有過失違天地者也。" }
      - { type: j, text: "曲成萬物而不遺。曲成者，乘變以應物，不系一方者也，則物宜得矣。" }
      - { type: z, text: "正義曰：言聖人隨變而應，屈曲委細，成就萬物，而不有遺棄細小而不成也。" }
      - { type: j, text: "通乎晝夜之道而知。通幽明之故，則無不知也。" }
      - { type: z, text: "正義曰：言聖人通曉於晝夜之道，晝則明也，夜則幽也，言通曉於幽明之道，而無事不知也。自此以上，皆神之所為，聖人能極神之幽隱之德也。" }
      - { type: j, text: "故神無方，而易無體。自此以上，皆言神之所為也。方、體者，皆系於形器者也。神則陰陽不測，易則唯變所適，不可以一方、一體明。" }
      - { type: z, text: "“故神”至“無體”。○正義曰：神則寂然虛無，陰陽深遠，不可求難，是無一方可明也。易則隨物改變，應變而往，無一體可定也。○注“自此以上”。○正義曰：自此以上，皆言神之所為者，謂從“神無方”以上，至“精氣為物”以下，《經》之所云，皆言神所施為。神者，微妙玄通，不可測量，故能知鬼神之情狀，與天地相似。知周萬物，樂天知命，安土敦仁，範圍天地，曲成萬物，通乎晝夜，此皆神之功用也。作《易》者因自然之神以垂教，欲使聖人用此神道以被天下，雖是神之所為，亦是聖人所為。云“方體者，皆系於形器”者，方是處所之名，體是形質之稱。凡處所形質，非是虛無，皆系著於器物，故云“皆系於形器”也。云“神則陰陽不測”者，既幽微不可測度，不可測，則何有處所，是“神無方”也。云“易則唯變所適”者，既是變易，唯變之適，不有定往，何可有體，是“易無體”也。云“不可以一方一體明”者，解“無方”“無體”也。凡“無方”“無體”，各有二義。一者神則不見其處所云為，是無方也；二則周游運動，不常在一處，亦是無方也。無體者，一是自然而變，而不知變之所由，是無形體也；二則隨變而往，無定在一體，亦是無體也。" }
      - { type: j, text: "一陰一陽之謂道，道者何？無之稱也，無不通也，無不由也，況之曰道。寂然天體，不可為象。必有之用極，而無之功顯，故至乎“神無方，而易無體”，而道可見矣。故窮變以盡神，因神以明道，陰陽雖殊，無一以待之。在陰為無陰，陰以之生；在陽為無陽，陽以之成，故曰“一陰一陽”也。" }
      - { type: z, text: "“一陰”至“謂道”。○正義曰：一謂無也，無陰無陽，乃謂之道。一得為無者，無是虛無，虛無是大虛，不可分別，唯一而已，故以一為無也。若其有境，則彼此相形，有二有不得為一。故在陰之時，而不見為陰之功；在陽之時，而不見為陽之力，自然而有陰陽，自然無所營為，此則道之謂也。故以言之為道，以數言之謂之一，以體言之謂之無，以物得開通謂之道，以微妙不測謂之神，以應機變化謂之易，總而言之，皆虛無之謂也。聖人以人事名之，隨其義理，立其稱號。○注“道者”至“一陽也”。○正義曰：云：“道者何？無之稱”者，此韓氏自問其道而釋之也。道是虛無之稱，以虛無能開通於物，故稱之曰道。云“無不通，無不由”者，若處於有，有則為物礙難，不可當通。道既虛無為體，則不為礙難，故曰“無不通”也。“無不由”者，言萬物皆因之而通，由之而有。云“況之曰道”者，比況道路以為稱也。“寂然無體，不可為象”者，謂寂然幽靜而無體，不可以形象求，是不可為象。至如天覆地載，日照月臨，冬寒夏暑，春生秋殺，萬物運動，皆由道而然，豈見其所營，知其所為？是“寂然無體，不可為象”也。云“必有之用，極而無之功顯”者，猶若風雨是有之所用，當用之時，以無為心，風雨既極之後，萬物賴此風雨而得生育，是生育之功，由風雨無心而成。是“有之用極，而無之功顯”，是神之發作動用，以生萬物，其功成就，乃在於無形。應機變化，雖有功用，本其用之所以，亦在於無也。故至乎“神無方，而《易》無體”，自然無為之道，可顯見矣。當其有用之時，道未見也。云“故窮變以盡神”者，神則杳然不測，千變萬化。聖人則窮此千變萬化，以盡神之妙理，故云窮變化以盡神。云“因神以明道”者，謂盡神之理，唯在虛無，因此虛無之神，以明道之所在，道亦虛無，故云“因神以明道”也。“陰陽雖殊，無一以待之”者，言陰之與陽，雖有兩氣，恆用虛無之一，以擬待之。言在陽之時，亦以為虛無，無此陽也。在陰之時，亦以為虛無，無此陰也。云“在陰為無陰，陰以之生”者，謂道雖在於陰，而無於陰，言道所生皆無陰也。雖無於陰，陰終由道而生，故言“陰以之生”也。“在陽為無陽，陽以之成”者，謂道雖在陽，陽中必無道也。雖無於陽，陽必由道而成，故言“陽以成之”也。道雖無於陰陽，然亦不離於陰陽，陰陽雖由道成，即陰陽亦非道，故曰“一陰一陽”也。" }
      - { type: j, text: "繼之者善也，成之者性也。仁者見之謂之仁，知者見之謂之知，仁者資道以見其仁，知者資道以見其知，各盡其分。" }
      - { type: z, text: "正義曰：“繼之者善也”者，道是生物開通，善是順理養物，故繼道之功者，唯善行也。“成之者性也”者，若能成就此道者，是人之本性。若性仁者成就此道為仁性，知者成就此道為知也。故云“仁者見之謂之仁，知者見之謂之知”。是仁之與知，皆資道而得成仁知也。" }
      - { type: j, text: "百姓日用而不知，故君子之道鮮矣。君子體道以為用也。仁知則滯於所見，百姓則日用而不知。體斯道者，不亦鮮矣？故“常無欲，以觀其妙”，始可以語至而言極也。" }
      - { type: z, text: "“百姓”至“鮮矣”。○正義曰：“百姓日用而不知”者，言萬方百姓，恆日日賴用此道而得生，而不知道之功力也。言道冥昧不以功為功，故百姓日用而不能知也。“故君子之道鮮矣”者，君子謂聖人也。仁知則各滯於所見，百姓則日用不知，明體道君子，不亦少乎？○注“君子體道”至“極也”。○正義曰：“君子體道以為用”者，謂聖人為君子，體履於至道，法道而施政，則《老子》云“為而不宰，功成不居”是也。云“仁知則滯於所見”者，言仁知雖賢猶有偏，見仁者觀道謂道為仁，知者觀道謂道為知，不能遍曉，是滯於所見也。是道既以無為用，若以仁以知，則滯所見也。至於百姓，但日用通生之道，又不知通生由道而來，故云“百姓日用而不知”也。云“體斯道者，不亦鮮矣”者，是聖人君子獨能悟道，故云“不亦鮮矣”。云“故常無欲以觀其妙”者，引《老子·道經》之文，以結成此義。“無欲”謂無心，若能寂然無心無欲，觀其道之妙趣，謂不為所為，得道之妙理也。云“始可以語至而言極也”者，若能無欲觀此道之妙理，無事無為，如此，可以語說其至理，而言其極趣也。若不如此，不可語至而言極也。" }
      - { type: z, text: "正義曰：“顯諸仁”至“之門”，此第五章也。上章論神之所為，此章廣明易道之大，與神功不異也。" }
      - { type: j, text: "顯諸仁，藏諸用，衣被萬物，故曰“顯諸仁”。日用而不知，故曰“藏諸用”。" }
      - { type: z, text: "正義曰：“顯諸仁”者，言道之為體，顯見仁功，衣被萬物，是“顯諸仁”也。“藏諸用”者，謂潛藏功用，不使物知，是“藏諸用”也。" }
      - { type: j, text: "鼓萬物而不與聖人同憂，萬物由之以化，故曰“鼓萬物”也。聖人雖體道以為用，未能全無以為體，故順通天下，則有經營之跡也。" }
      - { type: z, text: "“鼓萬物”至“同憂”。○正義曰：言道之功用，能鼓動萬物，使之化育，故云“鼓萬物”。聖人化物，不能全無以為體，猶有經營之憂；道則虛無為用，無事無為，不與聖人同用，有經營之憂也。○注“聖人雖體以為用”。○正義曰：云“聖人雖體道以為用”者，言聖人不能無憂之事。道則無心無跡，聖人則亦無心有跡，聖人能體附於道，其跡以有為用。云“未能全無以為體”者，道則心跡俱無，是其全無以為體；聖人則無心有跡，是跡有而心無，是不能全無以為體。云“故順通天下，則有經營之跡”者，言聖人順通天下之理，內則雖是無心，外則有經營之跡，則有憂也。道則心跡俱無，無憂無患，故云“不與聖人同憂”也。" }
      - { type: j, text: "盛德大業，至矣哉！夫物之所以通，事之所以理，莫不由乎道也。聖人功用之母，體同乎道，盛德大業，所以能至。" }
      - { type: z, text: "正義曰：聖人為功用之母，體同於道，萬物由之而通，眾事以之而理，是聖人極盛之德，廣大之業，至極矣哉！於行謂之德，於事謂之業。" }
      - { type: j, text: "富有之謂大業，廣大悉備，故曰“富有”。" }
      - { type: z, text: "正義曰：自此已下，覆說“大業”“盛德”，因廣明易與乾坤，及其佔之與事，並明神之體，以廣大悉備，萬事富有，所以謂之“大業”。" }
      - { type: j, text: "日新之謂盛德。體化合變，故曰“日新”。" }
      - { type: z, text: "正義曰：聖人以能變通體化，合變其德，日日增新，是德之盛極，故謂之盛德也。" }
      - { type: j, text: "生生之謂易，陰陽轉易，以成化生。" }
      - { type: z, text: "正義曰：生生，不絕之辭。陰陽變轉，後生次於前生，是萬物恒生，謂之易也。前後之生，變化改易。生必有死，易主勸戒，獎人為善，故云生不云死也。" }
      - { type: j, text: "成象之謂乾，擬乾之象。" }
      - { type: z, text: "正義曰：謂畫卦成乾之象，擬乾之健，故謂卦為乾也。" }
      - { type: j, text: "效法之謂坤，效坤之法。" }
      - { type: z, text: "正義曰：謂畫卦效坤之法，擬坤之順，故謂之坤也。" }
      - { type: j, text: "極數知來之謂佔，通變之謂事，物窮則變，變而通之，事之所由生也。" }
      - { type: z, text: "正義曰：“極數知來之謂佔”者，謂窮極蓍策之數，豫知來事，佔問吉凶，故云“謂之佔”也。“通變之謂事”者，物之窮極，欲使開通，須知其變化，乃得通也。凡天下之事，窮則須變，萬事乃生，故云“通變之謂事”。" }
      - { type: j, text: "陰陽不測之謂神。神也者，變化之極，妙萬物而為言，不可以形詰者也，故曰“陰陽不測”。嘗試論之曰：原夫兩儀之運，萬物之動，豈有使之然哉！莫不獨化於大虛，欻爾而自造矣。造之非我，理自玄應；化之無主，數自冥運，故不知所以然，而況之神。是以明兩儀以太極為始，言變化而稱極乎神也。夫唯知天之所為者，窮理體化，坐忘遺照。至虛而善應，則以道為稱。不思而玄覽，則以神為名。蓋資道而同乎道，由神而冥於神也。" }
      - { type: z, text: "“陰陽”至“謂神”。○正義曰：天下萬物，皆由陰陽，或生或成，本其所由之理，不可測量之謂神也，故云“陰陽不測之謂神”。○注“神也者”至“神也”。○正義曰：云“神也者，變化之極”者，言神之施為，自將變化之極以為名也。云“妙萬物而為言”者，妙謂微妙也。萬物之體，有變象可尋，神則微妙於萬物而為言也，謂不可尋求也。云“不可以形詰”者，杳寂不測，無形無體，不可以物之形容所求而窮語也。云“造之非我，理自玄應”者，此言神力也。我，謂宰主之名也。言物之造作，非由我之宰主所為，其造化之理，自然玄空相應，而自然造作也。云“是以明兩儀以太極為始”者，言欲明兩儀天地之體，必以太極虛無為初始，不知所以然，將何為始也？云“言變化而稱極乎神”者，欲言論變化之理，不知涯際，唯“稱極乎神”，神則不可知也。云“夫唯知天之所為者，窮理體化，坐忘遺照”者，言若能知天之所造為者，會能窮其物理，體其變化，靜坐而忘其事，及遺棄所照之物，任其自然之理，不以他事系心，端然玄寂，如此者，乃能知天之所為也。言天之道亦如此也。“坐忘遺照”之言，事出《莊子·大宗師》篇也。云“至虛而善應，則以道為稱”者，此解道之目也。言至極空虛而善應於物，則乃目之為道，故云“則以道為稱”。云“不思而玄覽，則以神為名”者，謂不可思量而玄遠，覽見者乃目之為神，故云“則以神為名”也。云“蓋資道而同乎道”者，此謂聖人設教，資取乎道，行無為之化，積久而遂同於道，內外皆無也。云“由神而冥於神也”者，言聖人設教，法此神之不測，無體無方，以垂於教，久能積漸，而冥合於神，不可測也。此皆謂聖人初時雖法道法神以為無，體未能全無，但行之不已，遂至全無不測，故云“資道而同於道，由神而冥於神也”。" }
      - { type: j, text: "夫易，廣矣大矣，以言乎遠則不御；窮幽極深，無所止也。" }
      - { type: z, text: "正義曰：“夫易廣矣，大矣”者，此贊明易理之大，易之變化，極於四遠，是廣矣，窮於上天是大矣，故下云“廣大配天地”也。“以言乎遠則不御”者，御，止也。言乎易之變化，窮極幽深之遠，則不有御止也。謂無所止息也。" }
      - { type: j, text: "以言乎邇則靜而正；則近而當。" }
      - { type: z, text: "正義曰：邇，近也。言易之變化，在於邇近之處，則寧靜而得正。謂變化之道，於其近處，物各靜而得正，不煩亂邪僻也。遠尚不御，近則不御可知；近既靜正，則遠亦靜正，互文也。" }
      - { type: j, text: "以言乎天地之間，則備矣。夫乾，其靜也專，其動也直，是以大生焉。專，專一也。直，剛正也。" }
      - { type: z, text: "正義曰：“以言乎天地之間，則備矣”者，變通之道，遍滿天地之內，是則備矣。“夫乾其靜也專，其動也直，是以大生焉”者，上《經》既論易道資陰陽而成，故此《經》明乾，復兼明坤也。乾是純陽，德能普備，無所偏主，唯專一而已。若氣不發動，則靜而專一，故云“其靜也專”。若其運轉，則四時不忒，寒暑無差，則而得正，故云“其動也直”。以其動靜如此，故能大生焉。" }
      - { type: j, text: "夫坤，其靜也翕，其動也闢，是以廣生焉。翕，斂也。止則翕斂其氣，動則關開以生物也。乾統天首物，為變化之元，通乎形外者也。坤則順以承陽，功盡於已，用止乎形者也。故乾以專直言乎其材，坤以翕闢言乎其形。" }
      - { type: z, text: "正義曰：此《經》明坤之德也。坤是陰柔，閉藏翕斂，故“其靜也翕”；動則開生萬物，故“其動也闢”。以其如此，故能廣生於物焉。天體高遠，故乾云“大生”；地體廣博，故坤云“廣生”。對則乾為物始，坤為物生，散則始亦為生，故總云生也。" }
      - { type: j, text: "廣大配天地，變通配四時，陰陽之義配日月，易簡之善配至德。《易》之所載配此四義。" }
      - { type: z, text: "正義曰：“廣大配天地”者，此《經》申明易之德，以易道廣大，配合天地，大以配天，廣以配地。“變通配四時”者，四時變通，易理亦能變通，故云“變通配四時”也。“陰陽之義配日月，易簡之善配至德”者，案初章論乾坤易簡，可久可大，配至極微妙之德也。然《易》初章易為賢人之德，簡為賢人之業，今總云“至德”者，對則德業別，散則業由德而來，俱為德也。" }
      - { type: j, text: "子曰：“易其至矣乎？夫易，聖人所以崇德而廣業也。窮理入神，其德崇也。兼濟萬物，其業廣也。" }
      - { type: z, text: "正義曰：“子曰易其至矣乎”者，更美易之至極，是語之別端，故言“子曰”。“夫易，聖人所以崇德而廣業”者，言易道至極，聖人用之，增崇其德，廣大其業，故云“崇德而廣業也”。" }
      - { type: j, text: "知崇禮卑，知以崇為貴，禮以卑為用。" }
      - { type: z, text: "正義曰：易兼知之與禮，故此明知禮之用。知者通利萬物，象天陽無不覆，以崇為貴也。禮者卑敬於物象，地柔而在下，故以卑為用也。" }
      - { type: j, text: "崇效天，卑法地。極知之崇，象天高而統物；備禮之用，象地廣而載物也。" }
      - { type: z, text: "正義曰：知既崇高，故效天；禮以卑退，故法地也。" }
      - { type: j, text: "天地設位，而易行乎其中矣。天地者，易之門戶，而易之為義，兼周萬物，故曰“行乎其中矣”。" }
      - { type: z, text: "正義曰：天地陳設於位，謂知之與禮，而效法天地也。“而易行乎其中矣”者，變易之道，行乎知禮之中。言知禮與易而並行也。若以實象言之，天在上，地在下，是天地設位；天地之間，萬物變化，是易行乎天地之中也。" }
      - { type: j, text: "成性存存，道義之門。物之存成，由乎道義也。" }
      - { type: z, text: "正義曰：此明易道既在天地之中，能成其萬物之性，使物生不失其性，存其萬物之存，使物得其存成也。性，謂稟其始也。存，謂保其終也。道，謂開通也。義，謂得其宜也。既能成性存存，則物之開通，物之得宜，從此易而來，故云“道義之門”，謂易與道義為門戶也。" }
      - { type: z, text: "正義曰：“聖人有以”至“如蘭”，此第六章也。上章既明易道變化，神理不測，聖人法之，所以配於天地，道義從易而生；此章又明聖人擬議易象，以贊成變化。又明人擬議之事，先慎其身，在於慎言語，同心行，動舉措，守謙退，勿驕盈，保靜密，勿貪非位，凡有七事。是行之於急者，故引七卦之議，以證成之。" }
      - { type: j, text: "聖人有以見天下之賾，而擬諸其形容，象其物宜，乾剛坤柔，各有其體，故曰“擬諸形容”。" }
      - { type: z, text: "正義曰：“聖人有以見天下之賾”者，賾謂幽深難見，聖人有其神妙，以能見天下深賾之至理也。“而擬諸其形容”者，以此深賾之理，擬度諸物形容也。見此剛理，則擬諸乾之形容；見此柔理，則擬諸坤之形容也。“象其物宜”者，聖人又法象其物之所宜。若象陽物，宜於剛也；若象陰物，宜於柔也，是各象其物之所宜。六十四卦，皆擬諸形容，象其物宜也。若泰卦比擬泰之形容，象其泰之物宜；若否卦則比擬否之形容，象其否之物宜也。舉此而言，諸卦可知也。" }
      - { type: j, text: "是故謂之象。聖人有以見天下之動，而觀其會通，以行其典禮，典禮，適時之所用。" }
      - { type: z, text: "正義曰：“是故謂之象”者，以是之故，謂之象也，謂六十四卦是也，故前章云卦者言乎象者也。此以上結成卦象之義也。“聖人有以見天下之動”者，謂聖人有其微妙，以見天下萬物之動也。“而觀其會通，以行其典禮”者，既知萬物以此變動，觀看其物之會合變通，當此會通之時，以施行其典法禮儀也。" }
      - { type: j, text: "系辭焉以斷其吉凶，是故謂之爻。言天下之至賾而不可惡也。言天下之至動而不可亂也。《易》之為書，不可遠也。惡之則逆於順，錯之則乖於理。" }
      - { type: z, text: "正義曰：“系辭焉以斷其吉凶”者，既觀其會通而行其典禮，以定爻之通變，而有三百八十四爻。於此爻下系屬文辭，以斷定其吉凶。若會通典禮得則為吉，若會通典禮失則為兇也。“是故謂之爻”者，以是之故，議此會通之事而為爻也。夫爻者效也，效諸物之通變，故上章云“爻者，言乎變者也”。自此巳上，結爻義也。“言天下之至賾，而不可惡也”者，此覆說前文“見天下之賾”，卦象義也。謂聖人於天下至賾之理，必重慎明之，不可鄙賤輕惡也。若鄙賤輕惡，不存意明之，則逆於順道也。“言天下之至動，而不可亂”者，覆說上聖人“見天下之至動”，爻之義也。謂天下至賾變動之理，論說之時，明不可錯亂也。若錯亂，則乖違正理也。若以文勢上下言之，宜云“至動而不可亂也”。" }
      - { type: j, text: "擬之而後言，議之而後動，擬議以成其變化。擬議以動，則盡變化之道。" }
      - { type: z, text: "正義曰：“擬之而後言”者，覆說上“天下之至賾不可惡也”，聖人欲言之時，必擬度之而後言也。“議之而後動”者，覆說上“天下之至動不可亂也”，謂欲動之時，必議論之而後動也。“擬議以成其變化”者，言則先擬也，動則先議也，則能成盡其變化之道也。" }
      - { type: j, text: "“鳴鶴在陰，其子和之；我有好爵，吾與爾靡之”。鶴鳴則子和，脩誠則物應，我有好爵，與物散之，物亦以善應也。明擬議之道，繼以斯義者，誠以吉凶失得存乎無所動。同乎道者，道亦得之；同乎失者，失亦違之。莫不以同相順，以類相應。動之斯來，緩之斯至。鶴鳴於陰，氣同則和。出言戶庭，千里或應。出言猶然，況其大者乎；千里或應，況其邇者乎。故夫憂悔吝者，存乎纖介；定失得者，慎於樞機。是以君子擬議以動，慎其微也。" }
      - { type: z, text: "正義曰：“鳴鶴在陰”者，上既明擬議而動，若擬議於善，則善來應之；若擬於惡，則惡亦隨之。故引鳴鶴在陰，取同類相應以證之。此引《中孚》九二爻辭也。鳴鶴在幽陰之處，雖在幽陰而鳴，其子則在遠而和之，以其同類相感召故也。“我有好爵”者，言我有美好之爵，而在我身。“吾與爾靡之”者，言我雖有好爵，不自獨有，吾與汝外物共靡散之。謂我既有好爵，能靡散以施於物，物則有感我之恩，亦來歸從於我。是善往則善者來，皆證明擬議之事。我擬議於善以及物，物亦以善而應我也。" }
      - { type: j, text: "子曰：“君子居其室，出其言善，則千里之外應之，況其邇者乎；居其室，出其言不善，則千里之外違之，況其邇者乎。言出乎身，加乎民；行發乎邇，見乎遠。言行，君子之樞機。樞機，制動之主。" }
      - { type: z, text: "“子曰君子”至“樞機”。正義曰：“子曰君子居其室”者，既引《易》辭，前語巳絕，故言“子曰”。“況其邇者乎”者，出其言善遠尚應之，則近應可知，故曰“況其邇者乎”。此證明擬議而動之事。言身有善惡，無問遠近皆應之也。“言行，君子之樞機”者，樞謂戶樞，機謂弩牙。言戶樞之轉，或明或闇；弩牙之發，或中或否，猶言行之動，從身而發，以及於物，或是或非也。" }
      - { type: j, text: "樞機之發，榮辱之主也。言行，君子之所以動天地也，可不慎乎？”“同人先號咷而後笑”。子曰：“君子之道，或出或處，或默或語，二人同心，其利斷金。”同人終獲後笑者，以有同心之應也。夫所況同者，豈系乎一方哉！君子出處默語，不違其中，則其跡雖異，道同則應。" }
      - { type: z, text: "正義曰：“言行，君子之所以動天地”者，言行雖初在於身，其善惡積而不已，所感動天地，豈可不慎乎？“同人先號咷而後笑”者，證擬議而動，則同類相應。以同人初未和同，故先號咷；後得同類，故後笑也。“子曰君子之道”者，各引《易》之後，其文勢已絕，故言“子曰”。“或出或處，或默或語”者，言同類相應，本在於心，不必共同一事。或此物而出，或彼物而處；或此物而默，或彼物而語，出處默語，其時雖異，其感應之事，其意則同，或處應於出，或默應於語。“二人同心，其利斷金”者，二人若同齊其心，其纖利能斷截於金。金是堅剛之物，能斷而截之，盛言利之甚也。此謂二人心行同也。" }
      - { type: j, text: "同心之言，其臭如蘭。" }
      - { type: z, text: "正義曰：言二人同齊其心，吐發言語，氤氳臭氣，香馥如蘭也。此謂二人言同也。" }
      - { type: z, text: "正義曰：“初六藉用”至“盜之招也”，此第七章也。此章欲求外物來應，必須擬議謹慎，則外物來應之。故引“藉用白茅無咎”之事，以證謹慎之理。" }
      - { type: j, text: "“初六：藉用白茅，無咎”。子曰：“苟錯諸地而可矣，藉之用茅，何咎之有？慎之至也。夫茅之為物薄，而用可重也。慎斯術也以往，其無所失矣。”" }
      - { type: z, text: "正義曰：此“藉用白茅”，《大過》初六爻辭也。“子曰：苟錯諸地而可矣”者，苟，且也；錯，置也。凡薦獻之物，且置於地，其理可矣。言今乃謹慎，薦藉此物而用絜白之茅，可置於地。“藉之用茅，何咎之有”者，何愆咎之有，是謹慎之至也。" }
      - { type: j, text: "“勞謙，君子有終，吉。”子曰：“勞而不伐，有功而不德，厚之至也。語以其功下人者也。" }
      - { type: z, text: "正義曰：“勞謙君子有終吉”者，欲求外物來應，非唯謹慎，又須謙以下人。故引《謙》卦九三爻辭以證之也。“子曰勞而不伐”者，以引卦之後，故言“子曰”。“勞而不伐”者，雖謙退疲勞，而不自伐其善也。“有功而不德，厚之至”者，雖有其功，而不自以為恩德，是篤厚之至極。“語以其功下人”者，言《易》之所言者，語說其《謙》卦九三，能以其有功卑下於人者也。" }
      - { type: j, text: "德言盛，禮言恭。謙也者，致恭以存其位者也。”" }
      - { type: z, text: "正義曰：“德言盛，禮言恭”者，謂德以盛為本，禮以恭為主：德貴盛新，禮尚恭敬，故曰“德言盛，禮言恭”。“謙也者，致恭以存其位”者，言謙退致其恭敬，以存其位者也。言由恭德，保其祿位也。" }
      - { type: j, text: "“亢龍有悔。”子曰：“貴而無位，高而無民，賢人在下，位而無輔，是以動而有悔也。”" }
      - { type: z, text: "正義曰：“亢龍有悔”者，上既以謙德保位，此明無謙則有悔。故引《乾》之上九“亢龍有悔”，證驕亢不謙也。" }
      - { type: j, text: "“不出戶庭，無咎”子曰：“亂之所生也，則言語以為階。”" }
      - { type: z, text: "正義曰：“不出戶庭，無咎”者，又明擬議之道，非但謙而不驕，又當謹慎周密，故引《節》之初九周密之事以明之。“子曰：亂之所生，則言語以為階”者，階謂梯也。言亂之所生，則由言語以為亂之階梯也。" }
      - { type: j, text: "君不密則失臣，臣不密則失身，幾事不密則害成。是以君子慎密而不出也。" }
      - { type: z, text: "正義曰：“君不密則失臣”者，臣既盡忠，不避危難，為君謀事，君不慎密乃彰露臣之所為，使在下聞之，眾共嫉怒，害此臣而殺之，是失臣也。“臣不密則失身”者，言臣之言行，既有虧失，則失身也。“幾事不密則害成”者，幾謂幾微之事，當須密慎，預防禍害。若其不密而漏洩，禍害交起，是害成也。“是以君子慎密而不出”者，於易言之，是身慎密不出戶庭，於此義言之，亦謂不妄出言語也。" }
      - { type: j, text: "子曰：“作《易》者，其知盜乎？言盜亦乘釁而至也。" }
      - { type: z, text: "正義曰：此結上不密失身之事，事若不密，人則乘此機危而害之，猶若財之不密，盜則乘此機危而竊之。易者，愛惡相攻，遠近相取，盛衰相變，若此爻有釁隙衰弱，則彼爻乘變而奪之。故云：“作《易》者，其知盜乎？”" }
      - { type: j, text: "《易》曰：‘負且乘，致寇至。’負也者，小人之事也。乘也者，君子之器也。小人而乘君子之器，盜思奪之矣。上慢下暴，盜思伐之矣。慢藏誨盜，冶容誨淫。" }
      - { type: z, text: "“《易》曰”至“誨淫”。○正義曰：“《易》曰：負且乘，致寇至”者，此又明擬議之道，當量身而行，不可以小處大，以賤貪貴，故引《解》卦六三以明之也。“負也者，小人之事也”，負者，擔負於物，合是小人所為也。“乘也者，君子之器”者，言乘車者，君子之器物。言君子合乘車。今應負之人而乘車，是小人乘君子之器也，則盜竊之人，思欲奪之矣。“上慢下暴，盜思伐之矣”者，小人居上位必驕慢，而在下必暴虐。為政如此，大盜思欲伐之矣。“慢藏誨盜，冶容誨淫”者，若慢藏財物，守掌不謹，則教誨於盜者，使來取此物；女子妖冶其容，身不精愨，是教誨淫者，使來淫巳也。以此小人而居貴位，驕矜而不謹慎，而致寇至也。" }
      - { type: j, text: "《易》曰：‘負且乘，致寇至’，盜之招也。" }
      - { type: z, text: "正義曰：又引《易》之所云，是盜之招來也，言自招來於盜。以慎重其事，故首尾皆稱“《易》曰”，而載《易》之爻辭也。" }
      - { type: z, text: "正義曰：“大衍之數”至“祐神矣”，此第八章，明占筮之法、揲蓍之體，顯天地之數，定乾坤之策，以為六十四卦，而生三百八十四爻。" }
      - { type: j, text: "大衍之數五十，其用四十有九。王弼曰：演天地之數，所賴者五十也。其用四十有九，則其一不用也。不用而用以之通，非數而數以之成，斯易之太極也。四十有九，數之極也。夫無不可以無明，必因於有，故常於有物之極，而必明其所由之宗也。" }
      - { type: z, text: "“大衍”至“有九”。○正義曰：京房云：“五十者，謂十日、十二辰、二十八宿也，凡五十。其一不用者，天之生氣，將欲以虛來實，故用四十九焉。”馬季長云：“易有太極，謂北辰也。太極生兩儀，兩儀生日月，日月生四時，四時生五行，五行生十二月，十二月生二十四氣。北辰居位不動，其餘四十九轉運而用也。”荀爽云：“卦各有六爻，六八四十八，加乾、坤二用，凡有五十。《乾》初九‘潛龍勿用’，故用四十九也。”鄭康成云：“天地之數五十有五，以五行氣通。凡五行減五，大衍又減一，故四十九也。”姚信、董遇云：“天地之數五十有五者，其六以象六畫之數，故減之而用四十九。”但五十之數，義有多家，各有其說，未知孰是。今案王弼云“演天地之數，所賴者五十”，據王弼此說，其意皆與諸儒不同。萬物之策，凡有萬一千五百二十。其用此策推演天地之數，唯用五十策也。一謂自然所須策者唯用五十，就五十策中，其所用揲蓍者，唯用四十有九。其一不用，以其虛無，非所用也，故不數之。顧歡同王弼此說。故顧歡云：“立此五十數，以數神，神雖非數，因數而顯。故虛其一數，以明不可言之義。”只如此意，則別無所以，自然而有此五十也。今依用之。○注“王弼”至“宗也”。○正義曰：“王弼云：演天地之數，所賴者五十”者，韓氏親受業於王弼，承王弼之旨，故引王弼云以證成其義。“演天地之數，所賴者五十，”謂萬物籌，策雖萬有一千五百二十，若用之推演天地之數，所賴者唯賴五十，其餘不賴也。但賴五十者，自然如此，不知其所以然。云“則其一不用”者，《經》既云“五十”，又云“其用四十九”也。既稱其“用”，明知五十之內，其一是不用者也。言不用而用以之通者，若全不用，理應不賴。此既當論用，所以並言不用為用。五十者，雖是不用，其有用從不用而來，以不用而得用也。故云“不用而用以之通”。所用者則四十九蓍也。蓍所以堪用者，從造化虛無而生也。若無造化之生，此蓍何由得用也？言“非數而數以之成”者，太一虛無，無形無數，是非可數也。然有形之數，由非數而得成也。即四十九是有形之數，原從非數而來，故將非數之一，總為五十。故云“非數而數以之成也”。言“斯易之太極”者，斯，此也。言此其一不用者，是易之太極之虛無也。無形，即無數也。凡有皆從無而來，故易從太一為始也。言“夫無不可以無明，必因於有”者，言虛無之體，處處皆虛，何可以無說之，明其虛無也。若欲明虛無之理，必因於有物之境，可以無本虛無。猶若春生秋殺之事，於虛無之時，不見生殺之象，是不可以無明也。就有境之中，見其生殺，卻推於無，始知無中有生殺之理，是明無必因於有也。言“故常於有物之極，而必明其所由之宗”者，言欲明於無，常須因有物至極之處，而明其所由宗。若易由太，有由於無，變化由於神，皆是所由之宗也。言有且何因如此，皆由於虛無自然而來也。" }
      - { type: j, text: "分而為二以象兩，掛一以象三，揲之以四，以象四時，歸奇於扐以象閏。五歲再閏，故再扐而後掛。奇，況四揲之餘，不足復揲者也。分而為二，既揲之餘，合掛於一，故曰“再扐而後掛”。凡閏，十九年七閏為一章，五歲再閏者二，故略舉其凡也。" }
      - { type: z, text: "正義曰：“分而為二以象兩”者，五十之內，去其一，餘有四十九，合同未分，是象太一也。今以四十九分而為二，以象兩儀也。“掛一以象三”者，就兩儀之間，於天數之中，分掛其一，而配兩儀，以象三才也。“揲之以四，以象四時”者，分揲其蓍，皆以四四為數，以象四時。“歸奇於扐以象閏”者，奇謂四揲之餘，歸此殘奇於所扐之策而成數，以法象天道。歸殘聚餘，分而成閏也。“五歲再閏”者，凡前閏後閏，相去大略三十二月，在五歲之中，故五歲再閏。“再扐而後掛”者，既分天地，天於左手，地於右手，乃四四揲天之數，最末之餘，歸之合於扐掛之一處，是一揲也。又以四四揲地之數，最末之餘，又合於前所歸之扐而裛掛之，是再扐而後掛也。" }
      - { type: j, text: "天數五。五，奇也。" }
      - { type: z, text: "正義曰：謂一、三、五、七、九也。" }
      - { type: j, text: "地數五。五，耦也。" }
      - { type: z, text: "正義曰：謂二、四、六、八、十也。" }
      - { type: j, text: "五位相得而各有合，天地之數各五，五數相配，以合成金、木、水、火、土。" }
      - { type: z, text: "正義曰：若天一與地六相得，合為水，地二與天七相得，合為火，天三與地八相得，合為木，地四與天九相得合為金，天五與地十相得，合為土也。" }
      - { type: j, text: "天數二十有五，五奇合為二十五。" }
      - { type: z, text: "正義曰：總合五奇之數。" }
      - { type: j, text: "地數三十。五耦合為三十。" }
      - { type: z, text: "正義曰：總合五耦之類也。" }
      - { type: j, text: "凡天地之數五十有五。此所以成變化而行鬼神也。變化以此成，鬼神以此行。" }
      - { type: z, text: "正義曰：“凡天地之數五十有五”者，是天地二數相合為五十五，此乃天地陰陽奇耦之數，非是上文演天地之策也。“此所以成變化而行鬼神”者，言此陽奇陰耦之數，成就其變化。言變化以此陰陽而成，故云“成變化”也。而宣行鬼神之用，言鬼神以此陰陽而得宣行，故云“而行鬼神也”。" }
      - { type: j, text: "《乾》之策二百一十有六，陽爻六，一爻三十六策，六爻二百一十六策。" }
      - { type: z, text: "正義曰：以乾老陽，一爻有三十六策，六爻凡有二百一十六策也。乾之少陽，一爻有二十八策，六爻則有一百六十八策，此《經》據老陽之策也。" }
      - { type: j, text: "坤之策百四十有四，陰爻六，一爻二十四策，六爻百四十四策。" }
      - { type: z, text: "正義曰：坤之老陰，一爻有二十四策，六爻故一百四十有四策也。若坤之少陰，一爻有三十二，六爻則有一百九十二。此《經》據坤之老陰，故百四十有四也。" }
      - { type: j, text: "凡三百有六十，當期之日。二篇之策，萬有一千五百二十，當萬物之數也。二篇三百八十四爻，陰陽各半，合萬一千五百二十策。" }
      - { type: z, text: "正義曰：“凡三百有六十，當期之日”者，舉合乾、坤兩策，有三百有六十，當期之數。三百六十日，舉其大略，不數五日四分日之一也。“二篇之策，萬有一千五百二十，當萬物之數”者，二篇之爻，總有三百八十四爻，陰陽各半，陽爻一百九十二爻，爻別三十六，總有六千九百一十二也。陰爻亦一百九十二爻，爻別二十四，總有四千六百八也。陰陽總合，萬有一千五百二十，當萬物之數也。" }
      - { type: j, text: "是故四營而成易，分而為二，以象兩，一營也。掛一以象三，二營也。揲之以四，三營也。歸奇於扐，四營也。" }
      - { type: z, text: "正義曰：營謂經營，謂四度經營蓍策，乃成易之一變也。" }
      - { type: j, text: "十有八變而成卦，八卦而小成。引而伸之。伸之六十四卦。" }
      - { type: z, text: "正義曰：“十有八變而成卦”者，每一爻有三變，謂初一揲，不五則九，是一變也。第二揲，不四則八，是二變也。第三揲，亦不四則八，是三變也。若三者俱多為老陰，謂初得九，第二、第三俱得八也。若三者俱少為老陽，謂初得五，第二第三，俱得四也。若兩少一多為少陰，謂初與二、三之間，或有四或有五而有八也。或有二個四而有一個九，此為兩少一多也。其兩多一少為少陽者，謂三揲之間，或有一個九，有一個八而有一個四，或有二個八，而有一個五，此為兩多一少也。如此三變既畢，乃定一爻。六爻則十有八變，乃始成卦也。“八卦而小成”者，象天地雷風日月山澤，於大象略盡，是易道小成。“引而伸之”者，謂引長八卦而伸盡之，謂引之為六十四卦也。" }
      - { type: j, text: "觸類而長之，天下之能事畢矣。" }
      - { type: z, text: "正義曰：“觸類而長之”者，謂觸逢事類而增長之，若觸剛之事類，以次增長於剛。若觸柔之事類，以次增長於柔。“天下之能事畢矣”者，天下萬事，皆如此例，各以類增長，則天下所能之事，法象皆盡，故曰“天下之能事畢矣”也。" }
      - { type: j, text: "顯道，顯，明也。神德行。由神以成其用。" }
      - { type: z, text: "正義曰：言易理備盡天下之能事，故可以顯明無為之道，而神靈其德行之事。言大虛以養萬物為德行，今易道以其神靈助太虛而養物，是神其德行也。" }
      - { type: j, text: "是故可與酬酢，可與祐神矣。可以應對萬物之求助，成神化之功也。酬酢，猶應對也。" }
      - { type: z, text: "正義曰：“是故可與酬酢”者，酬酢，謂應對報答，言易道如此。若萬物有所求為，此易道可與應答，萬物有求則報，故曰“可與酬酢也”。“可與祐神矣”者，祐，助也。易道弘大，可與助成神化之功也。" }
      - { type: z, text: "正義曰：“子曰知變化”至“此之謂也”。此第九章也。上章既明大衍之數，極盡蓍策之名數，可與助成神化之功。此又廣明易道深遠，聖人之道有四，又明易之深遠，窮極幾神也。" }
      - { type: j, text: "子曰：“知變化之道者，其知神之所為乎？夫變化之道，不為而自然。故知變化者，則知神之所為。" }
      - { type: z, text: "正義曰：言易既知變化之道理，不為而自然也。則能知神化之所為，言神化亦不為而自然也。" }
      - { type: j, text: "《易》有聖人之道四焉：以言者尚其辭，以動者尚其變，以制器者尚其象，以卜筮者尚其佔。”此四者存乎器象，可得而用也。" }
      - { type: z, text: "“《易》有”至“其佔”。○正義曰：“《易》有聖人之道四焉”者，言《易》之為書，有聖人所用之道者凡有四事焉。“以言者尚其辭”者，謂聖人發言而施政教者，貴尚其爻卦之辭，發其言辭，出言而施政教也。“以動者尚其變”者，謂聖人有所興動營為，故法其陰陽變化。變有吉凶，聖人之動，取吉不取兇也。“以制器者尚其象”者，謂造制形器，法其爻卦之象。若造弧矢，法睽之象，若造杵臼，法小過之象也。“以卜筮者尚其佔”者，策是筮之所用，並言卜者，卜雖龜之見兆，亦有陰陽三行變動之狀。故卜之與筮，尚其爻卦變動之佔也。○注“器象”。○正義曰：“辭”是爻辭，爻辭是器象也。“變”是變化，見其來去，亦是器象也。“象”是形象，“佔”是佔其形狀，並是有體之物。有體則是物之可用，故云“可得而用者也”。" }
      - { type: j, text: "是以君子將有為也，將有行也，問焉而以言。其受命也如響，無有遠近幽深，遂知來物。非天下之至精，其孰能與於此？" }
      - { type: z, text: "正義曰：“是以君子將有為也，將有行也，問焉而以言”者，既易道有四，是以君子將欲有所施為，將欲有所行，往佔問其吉凶，而以言命蓍也。“其受命也如響”者，謂蓍受人命，報人吉凶，如響之應聲也。“無有遠近幽深”者，言易之告人吉凶，無問遠之與近，及幽遂深遠之處，悉皆告之也。“遂知來物”者，物，事也。然易以萬事告人，人因此遂知將來之事也。“非天下之至精，其孰能與於此”者，言易之功深如此，若非天下萬事之內，至極精妙，誰能參與於此，與易道同也。此已上論易道功深，告人吉凶，使豫知來事，故以此結之也。" }
      - { type: j, text: "參伍以變，錯綜其數，通其變，遂成天下之文；極其數，遂定天下之象。非天下之至變，其孰能與於此？" }
      - { type: z, text: "正義曰：“參伍以變”者，參，三也。伍，五也。或三或五，以相參合，以相改變。略舉三五，諸數皆然也。“錯綜其數”者，錯謂交錯，綜謂總聚，交錯裛聚其陰陽之數也。“通其變”者，由交錯總聚，通極其陰陽相變也。“遂成天地之文”者，以其相變，故能遂成就天地之文。若青赤相雜，故稱文也。“極其數，遂定天下之象”者，謂窮極其陰陽之數，以定天下萬物之象。猶若極二百一十六策，以定乾之老陽之象，窮一百四十四策，以定坤之老陰之象，舉此餘可知也。“非天下之至變，其孰能與於此”者，言此易之理，若非天下萬事至極之變化，誰能與於此者，言皆不能也。此結成易之變化之道，故更言“與於此”也。前《經》論易理深，故云“非天下之至精”。此《經》論極數變通，故云“非天下之至變”也。" }
      - { type: j, text: "易無思也，無為也，寂然不動，感而遂通天下之故，非天下之至神，其孰能與於此？夫非忘象者，則無以制象。非遺數者，無以極數。至精者，無籌策而不可亂。至變者，體一而無不周。至神者，寂然而無不應。斯蓋功用之母，象數所由立，故曰非至精至變至神，則不得與於斯也。" }
      - { type: z, text: "“易無思”至“於此”。○正義曰：“易無思也，無為也”者，任運自然，不關心慮，是無思也；任運自動，不須營造，是無為也。“寂然不動，感而遂通天下之故”者，既無思無為，故“寂然不動”。有感必應，萬事皆通，是“感而遂通天下之故”也。故謂事故，言通天下萬事也。“非天下之至神，其孰能與於此”者，言易理神功不測，非天下萬事之中，至極神妙，其孰能與於此也。此《經》明易理神妙不測，故云“非天下之至神”，若非天下之至神，誰能與於此也。○注“非忘象”。○正義曰：云“夫非忘象者，則無以制象”者，凡自有形象者，不可以制他物之形象，猶若海不能制山之形象，山不能制海之形象。遺忘巳象者，乃能制眾物之形象也。“非遺數者，無以極數”者，若以數數物，則不能極其物數。猶若以萬而數，則不能苞億，以一億而數，則不能苞千億萬億。遺去數名者，則無所不苞。是非遺去其數，無以極盡於數也。言“至精者，無籌策而不可亂”者，以其心之至精，理在玄通，無不記億，雖無籌策，而不可亂也。言“至變者，體一而無不周”者，言至極曉達變理者，能體於淳一之理，其變通無不周遍。言雖萬類之變，同歸於一變也。“斯蓋功用之母，象數所由立”者，言至精、至變、至神，三者是物之功用之母。物之功用，象之與數，由此至精、至變、至神所由來，故云“象數所由立”也。言象之所以立有象者，豈由象而來，由太虛自然而有象也；數之所以有數者，豈由數而來，由太虛自然而有數也；是太虛之象，太虛之數，是其至精至變也。由其至精，故能制數；由其至變，故能制象。若非至精、至變、至神，則不得參與妙極之玄理也。" }
      - { type: j, text: "夫易，聖人之所以極深而研幾也。唯深也，故能通天下之志。唯幾也，故能成天下之務。極未形之理則曰深，適動微之會則曰幾。" }
      - { type: z, text: "正義曰：“夫易聖人之所以極深而研幾也”者，言易道弘大，故聖人用之，所以窮極幽深，而研核幾微也。“極深”者，則前《經》初一節云：“君子將有為，將有行，問焉而以言，其受命如響，無有遠近幽深”，是極深也。“研幾”者，上《經》次節云“參伍以變，錯綜其數，通其變，遂成天地之文；極其數，以定天下之象”，是研幾也。“唯深也，故能通天下之務”者，聖人用易道以極深，故聖人德深也，故能通天下之志意，即是前《經》上節“問焉而以言，其受命如響”，“遂知來物”，是通天下之志也。“唯幾也，故能成天下之務”者，聖人用易道以研幾，故聖人知事之幾微，是前《經》次節“參伍以變，錯綜其數，通其變，遂成天地之文”是也。幾者離無入有，是有初之微。以能知有初之微。則能興行其事，故能成天下之事務也。" }
      - { type: j, text: "唯神也，故不疾而速，不行而至。子曰：“易有聖人之道四焉”者，此之謂也。四者由聖道以成，故曰“聖人之道”。" }
      - { type: z, text: "正義曰：“唯神也，故不疾而速，不行而至”者，此覆說上《經》下節易之神功也。以無思無為，寂然不動，感而遂通，故不須急疾，而事速成；不須行動，而理自至也。案下節云“唯深也”言“通天下之志”，“唯幾也”言“成天下之務”。今“唯神也”直云“不疾而速，不行而至”，不言“通天下”者，神則至理微妙，不可測知。無象無功，於天下之事，理絕名言，不可論也。故不云“成天下之功”也。子曰：“易有聖人之道四焉者，此之謂也”者，章首論聖人之道四焉，章中歷陳其三事，章末結而成之，故曰“聖人之道四焉”是此之謂也。章首“聖人之道有四”者，韓氏注云“此四者存乎器象，可得而用者”，則辭也，變也，象也，佔也。是有形之物，形器可知也。若章中所陳則有三事，一是至精，精則唯深也。二是至變，變則唯幾也。三是至神，神則微妙無形，是其無也。神既無形，則章中三事，不得配章首四事。韓氏云“四者存乎器象”，故知章中三事，不得配章首四事者也。但行此四者，即能致章中三事。故章中歷陳三事，下總以“聖人之道四焉”結之也。" }
      - { type: z, text: "正義曰：“天一地二”至“謂之神”，此第十章也。前章論《易》有聖人之道四焉，以卜筮尚其佔。此章明卜筮蓍龜所用，能通神知也。" }
      - { type: j, text: "天一，地二；天三，地四；天五，地六；天七，地八；天九，地十。易以極數通神明之德，故明易之道，先舉天地之數也。" }
      - { type: z, text: "“天一”至“地十”。○正義曰：此言天地陰陽自然奇偶之數也。○注“易以極”至“數也”。○正義曰：“易以極數通神明之德”者，謂易之為道，先由窮極其數，乃以通神明之德也。“故明易之道，先舉天地之數”者，此章欲明神之德，先由天地之數而成，故云“故明易之道，先舉天地之數”也。" }
      - { type: j, text: "子曰：“夫易，何為者也？夫易，開物成務，冒天下之道，如斯而已者也。”冒，覆也。言易通萬物之志，成天下之務，其道可以覆冒天下也。" }
      - { type: z, text: "正義曰：“子曰夫易何為”者，言易之功用，其體何為，是問其功用之意。“夫易開物成務，冒天下之道，如斯而已”者，此夫子還自釋易之體，用之狀言易能開通萬物之志，成就天下之務，有覆冒天下之道。斯，此也，易之體用如此而已。" }
      - { type: j, text: "是故聖人以通天下之志，以定天下之業，以斷天下之疑。是故蓍之德圓而神，卦之德方以知，圓者運而不窮，方者止而有分。言蓍以圓象神，卦以方象知也。唯變所適，無數不周，故曰圓。卦列爻分，各有其體，故曰方也。" }
      - { type: z, text: "“是故聖人”至“以知”。正義曰：“是故聖人以通天下之志”者，言易道如此，是故聖人以其易道通達天下之志，極其幽深也。“以定天下之業”者，以此易道定天下之業，由能研幾成務，故定天下之業也。“以斷天下之疑”者，以此易道決斷天下之疑，用其蓍龜占卜，定天下疑危也。“是故蓍之德圓而神，卦之德方以知”者，神以知來，是來無方也；知以藏往，是往有常也。物既有常，猶方之有止；數無恆體，猶圓之不窮。故蓍之變通則無窮，神之象也；卦列爻分有定體，知之象也。知可以識前言往行，神可以逆知將來之事，故蓍以圓象神，卦以方象知也。注“圓者”至“方也”。○正義曰：“圓者運而不窮”者，謂團圓之物，運轉無窮已，猶阪上走丸也。蓍亦運動不已，故稱圓也。言“方者止而有分”者，方謂處所，既有處所，則是止而有分。且物方者，著地則安，其卦既成，更不移動，亦是止而有分，故卦稱方也。" }
      - { type: j, text: "六爻之義易以貢。貢，告也。六爻變易，以告吉凶。" }
      - { type: z, text: "正義曰：貢，告也。六爻有吉凶之義，變易以告人也。" }
      - { type: j, text: "聖人以此洗心，洗濯萬物之心。" }
      - { type: z, text: "正義曰：聖人以此易之卜筮，洗盪萬物之心。萬物有疑則卜之，是蕩其疑心；行善得吉，行惡遇兇，是蕩其噁心也。" }
      - { type: j, text: "退藏於密。言其道深微，萬物日用而不能知其原，故曰“退藏於密”，猶藏諸用也。" }
      - { type: z, text: "正義曰：言易道進則蕩除萬物之心，退則不知其所以然，萬物日用而不知，有功用藏於密也。" }
      - { type: j, text: "吉凶與民同患。表吉凶之象，以同民所憂患之事，故曰“吉凶與民同患也”。" }
      - { type: z, text: "正義曰：易道以示人吉凶，民則亦憂患其吉凶，是與民同其所憂患也。兇者民之所憂也，上並言吉凶，此獨言同患者，兇雖民之所患，吉亦民之所患也。既得其吉，又患其失。故《老子》云“寵辱若驚”也。" }
      - { type: j, text: "神以知來，知以藏往。明蓍卦之用，同神知也。蓍定數於始，於卦為來。卦成象於終，於蓍為往。往來之用相成，猶神知也。" }
      - { type: z, text: "正義曰：此明蓍卦德同神知，知來藏往也。蓍定數於始，於卦為來。卦成象於終，於蓍為往。以蓍望卦，則是知卦象將來之事，故言“神以知來”。以卦望蓍，則是聚於蓍象往去之事，故言“知以藏往”也。" }
      - { type: j, text: "其孰能與此哉！古之聰明叡知神武而不殺者夫！服萬物而不以威形也。" }
      - { type: z, text: "正義曰：“其孰能與此哉”者，言誰能同此也，蓋是古之聰明叡知神武而不殺者夫。易道深遠，以吉凶禍福，威服萬物。故古之聰明叡知神武之君，謂伏犧等，用此易道，能威服天下，而不用刑殺而畏服之也。" }
      - { type: j, text: "是以明於天之道，而察於民之故，是興神物以前民用。定吉凶於始也。" }
      - { type: z, text: "正義曰：“是以明於天之道”者，言聖人能明天道也。“而察於民之故”者，故，事也。易窮變化而察知民之事也。“是興神物以前民用”者，謂易道興起神理事物，豫為法象，以示於人，以前民之所用。定吉凶於前，民乃法之所用，故云“以前民用”也。" }
      - { type: j, text: "聖人以此齊戒，洗心曰齊，防患曰戒。" }
      - { type: z, text: "正義曰：聖人以“易”道自齊自戒，謂照了吉凶，齊戒其身。洗心曰齊，防患曰戒。" }
      - { type: j, text: "以神明其德夫。是故闔戶謂之坤。坤道包物。" }
      - { type: z, text: "正義曰：以“神明其德夫”者，言聖人既以易道自齊戒，又以易道神明其已之德化也。“是故闔戶謂之坤”者，聖人既用此易道以化天下，此以下又廣明易道之大。易從乾坤而來，故更明乾坤也。凡物先藏而後出，故先言坤而後言乾。闔戶，謂閉藏。萬物若室之閉闔其戶，故云“闔戶謂之坤”也。" }
      - { type: j, text: "闢戶謂之乾。乾道施生。" }
      - { type: z, text: "正義曰：闢戶，謂吐生萬物也；若室之開闢其戶，故云“闢戶謂之乾”也。" }
      - { type: j, text: "一闔一闢謂之變，往來不窮謂之通。見乃謂之象。兆見曰象。" }
      - { type: z, text: "正義曰：“一闔一闢謂之變”者，開閉相循，陰陽遞至，或陽變為陰，或開而更閉，或陰變為陽，或閉而還開，是謂之變也。“往來不窮謂之通”者，須往則變來為往，須來則變往為來，隨須改變，不有窮已，恆得通流，是“謂之通”也。“見乃謂之象”者，前往來不窮，據其氣也。氣漸積聚，露見萌兆，乃謂之象，言物體尚微也。" }
      - { type: j, text: "形乃謂之器。成形曰器。" }
      - { type: z, text: "正義曰：體質成器，是謂器物。故曰“形乃謂之器”，言其著也。" }
      - { type: j, text: "制而用之謂之法。利用出入，民鹹用之謂之神。" }
      - { type: z, text: "正義曰：“制而用之謂之法”者，言聖人裁製其物而施用之，垂為模範，故云“謂之法”。“利用出入，民鹹用之謂之神”者，言聖人以利而用，或出或入，使民鹹用之，是聖德微妙，故云“謂之神”。" }
      - { type: z, text: "正義曰：“是故易有”至“無不利也”。此第十一章也。前章既明蓍卦有神明之用，聖人則而象之，成其神化。此又明易道之大，法於天地，明象日月，能定天下之吉凶，成天下之亹亹也。" }
      - { type: j, text: "是故易有太極，是生兩儀。夫有必始於無，故太極生兩儀也。太極者，無稱之稱，不可得而名，取有之所極，況之太極者也。" }
      - { type: z, text: "正義曰：太極謂天地未分之前，元氣混而為一，即是太初、太一也。故《老子》云：“道生一。”即此太極是也。又謂混元既分，即有天地，故曰“太極生兩儀”，即《老子》云：“一生二”也。不言天地而言兩儀者，指其物體，下與四象相對，故曰兩儀，謂兩體容儀也。" }
      - { type: j, text: "兩儀生四象，四象生八卦。卦以象之。" }
      - { type: z, text: "正義曰：“兩儀生四象”者，謂金木水火，稟天地而有，故云：“兩儀生四象”，土則分王四季，又地中之別，故唯云四象也。“四象生八卦”者，若謂震木、離火、兌金、坎水，各主一時，又巽同震木，乾同兌金，加以坤、艮之土為八卦也。" }
      - { type: j, text: "八卦定吉凶。八卦既立，則吉凶可定。" }
      - { type: z, text: "正義曰：八卦既立，爻象變而相推，有吉有兇，故八卦定吉凶也。" }
      - { type: j, text: "吉凶生大業。既定吉凶，則廣大悉備。" }
      - { type: z, text: "正義曰：萬事各有吉凶，廣大悉備，故能王天下大事業也。" }
      - { type: j, text: "是故法象莫大乎天地，變通莫大乎四時，縣象著明莫大乎日月，崇高莫大乎富貴。位所以一天下之動，而濟萬物。" }
      - { type: z, text: "正義曰：“是故法象莫大乎天地”者，言天地最大也。“變通莫大乎四時”者，謂四時以變得通，是變中最大也。“縣象著明莫大乎日月”者，謂日月中時，遍照天下，無幽不燭，故云“著明莫大乎日月”也。“崇高莫大乎富貴”者，以王者居九五富貴之位，力能齊一天下之動，而道濟萬物，是崇高之極，故云“莫大乎富貴”。" }
      - { type: j, text: "備物致用，立成器以為天下利，莫大乎聖人。" }
      - { type: z, text: "正義曰：謂備天下之物，招致天下所用，建立成就天下之器，以為天下之利，唯聖人能然，故云“莫大乎聖人也”。" }
      - { type: j, text: "探賾索隱，鉤深致遠，以定天下之吉凶，成天下之亹亹者，莫大乎蓍龜。" }
      - { type: z, text: "正義曰：探，謂闚探求取。賾，謂幽深難見。卜筮則能闚探幽昧之理，故云探賾也。索，謂求索。隱，謂隱藏。卜筮能求索隱藏之處，故云索隱也。物在深處，能鉤取之；物在遠方，能招致之，卜筮能然，故云“鉤深致遠”也。以此諸事，正定天下之吉凶，成就天下之亹亹者，唯卜筮能然，故云“莫大乎蓍龜”也。案《釋詁》云：“亹亹，勉也。”言天下萬事，悉動而好生，皆勉勉營為，此蓍龜知其好惡得失，人則棄其得而取其好，背其失而求其得，是成天下之亹亹也。" }
      - { type: j, text: "是故天生神物，聖人則之。天地變化，聖人效之。天垂象，見吉凶，聖人象之。河出圖，洛出書，聖人則之。" }
      - { type: z, text: "正義曰：“是故天生神物，聖人則之”者，謂天生蓍龜，聖人法則之以為卜筮也。“天地變化，聖人效之”者，行四時生殺，賞以春夏，刑以秋冬，是聖人效之。“天垂象，見吉凶，聖人象之”者，若璿璣玉衡，以齊七政，是聖人象之也。“河出圖，洛出書，聖人則之”者，如鄭康成之義，則《春秋緯》云：河以通乾出天苞，洛以流坤吐地符。河龍圖發，洛龜書感。《河圖》有九篇，《洛書》有六篇。孔安國以為《河圖》則八卦是也，《洛書》則九疇是也。輔嗣之義，未知何從。" }
      - { type: j, text: "易有四象，所以示也。系辭焉，所以告也。定之以吉凶，所以斷也。" }
      - { type: z, text: "正義曰：“易有四象，所以示”者，莊氏云：四象，謂六十四卦之中，有實象，有假象，有義象，有用象，為四象也。今於釋卦之處，已破之矣。何氏以為四象，謂“天生神物，聖人則之”一也。“天地變化，聖人效之”，二也。“天垂象，見吉凶，聖人象之”，三也。“河出圖，洛出書，聖人則之”，四也。今謂此等四事，乃是聖人易外別有其功，非專易內之物，何得稱“易有四象”？且又云“易有四象，所以示也”。系辭焉，所以告也。然則象之與辭，相對之物。辭既爻卦之下辭，則象為爻卦之象也。則上兩儀生四象，七八九六之謂也。故諸儒有為七八九六，今則從以為義。“系辭焉，所以告”者，系辭於象卦下，所以告其得失也。“定之以吉凶，所以斷”者，謂於系辭之中，定其行事吉凶，所以斷其行事得失。" }
      - { type: j, text: "《易》曰：“自天祐之，吉無不利。”子曰：“祐者，助也。天之所助者，順也；人之所助者，信也。履信思乎順，又以尚賢也。是以自天祐之，吉無不利也。”" }
      - { type: z, text: "正義曰：“《易》曰：自天祐之，吉無不利”者，言人於此易之四象所以示，系辭所以告，吉凶告所斷而行之，行則鬼神無不祐助，無所不利，故引《易》之《大有》上九爻辭以證之。“子曰：祐者助也”者，上既引《易》文，下又釋其易理，故云“子曰：祐者助也”。“天之所助者，順也；人之所助者，信也。履信思乎順”者，人之所助，唯在於信，此上九能履踐於信也；天之所助，唯在於順，此上九恆思於順；既有信思順，又能尊尚賢人，是以從天已下，皆祐助之，而得其吉，無所不利也。" }
      - { type: z, text: "正義曰：子曰：“書不盡言”至“乎德行”，此第十二章也。此章言立象盡意，系辭盡言。易之興廢，存乎其人事也。" }
      - { type: j, text: "子曰：“書不盡言，言不盡意。”然則聖人之意，其不可見乎？" }
      - { type: z, text: "正義曰：此一節夫子自發其問，謂聖人之意難見也。所以難見者，書所以記言，言有煩碎，或楚夏不同，有言無字，雖欲書錄，不可盡竭於其言，故云“書不盡言”也。“言不盡意”者，意有深邃委曲，非言可寫，是言不盡意也。聖人之意，意又深遠。若言之不能盡聖人之意，書之又不能盡聖人之言，是聖人之意，其不可見也。故云：“然則聖人之意，其不可見乎？”疑而問之，故稱“乎”也。" }
      - { type: j, text: "子曰：聖人立象以盡意，設卦以盡情偽，系辭焉以盡其言，變而通之以盡利，極變通之數，則盡利也。故曰“易窮則變，變則通，通則久。”" }
      - { type: z, text: "正義曰：“子曰聖人立象以盡意”巳下，至“幾乎息矣”，此一節是夫子還自釋聖人之意，有可見之理也。“聖人立象以盡意”者，雖言不盡意，立象可以盡之也。“設卦以盡情偽”者，非唯立象以盡聖人之意，又設卦以盡百姓之情偽也。“系辭焉以盡其言”者，雖書不盡言，系辭可以盡其言也。“變而通之以盡利”者，變，謂化而裁之，通，謂推而行之，故能盡物之利也。" }
      - { type: j, text: "鼓之舞之以盡神。乾坤其易之縕邪？縕淵奧也。" }
      - { type: z, text: "正義曰：“鼓之舞之以盡神”者，此一句總結立象盡意，系辭盡言之美。聖人立象以盡其意，《系辭》則盡其言，可以說化百姓之心，百姓之心自然樂順，若鼓舞然，而天下從之，非盡神，其孰能與於此？故曰“鼓之舞之以盡神也”。“乾坤其易之縕邪”者，上明盡言盡意，皆由於易道，此明易之所立，本乎乾坤。若乾坤不存，則易道無由興起，故乾坤是易道之所縕積之根源也。是與易川府奧藏。故云“乾坤其易之縕邪”。" }
      - { type: j, text: "乾坤成列，而易立乎其中矣。乾坤毀，則元以見易。易不可見，則乾坤或幾乎息矣。" }
      - { type: z, text: "正義曰：“乾坤成列，而易立乎其中矣”者，夫易者，陰陽變化之謂。陰陽變化，立爻以效之，皆從乾坤而來。故乾生三男，坤生三女而為八卦，變而相重，而有六十四卦，三百八十四爻，本之根源，從乾坤而來。故乾坤既成列位，而易道變化建立乎乾坤之中矣。“乾坤毀，則無以見易”者，易既從乾坤而來，乾坤若缺毀，則易道損壞，故云“無以見易”也。“易不可見，則乾坤或幾乎息矣”，若易道毀壞，不可見其變化之理，則乾坤亦壞，或其近乎止息矣。幾，近也。猶若樹之枝幹生乎根株，根株毀，則枝條不茂。若枝幹已枯死，其根株雖未全死，僅有微生，將死不久。根株譬乾坤也，易譬枝幹也。故云：“易不可見，則乾坤或幾乎息矣”。" }
      - { type: j, text: "是故形而上者謂之道，形而下者謂之器。化而裁之謂之變，因而制其會通，適變之道也。" }
      - { type: z, text: "正義曰：“是故形而上者謂之道，形而下者謂之器”者，道是無體之名，形是有質之稱。凡有從無而生，形由道而立，是先道而後形，是道在形之上，形在道之下。故自形外已上者謂之道也，自形內而下者謂之器也。形雖處道器兩畔之際，形在器，不在道也。既有形質，可為器用，故云“形而下者謂之器”也。“化而裁之謂之變”者，陰陽變化而相裁節之，謂之變也。是得以理之變也。猶若陽氣之化不可久長，而裁節之以陰雨也，是得理之變也。陰陽之化，自然相裁，聖人亦法此而裁節也。" }
      - { type: j, text: "推而行之謂之通。乘變而往者，無不通也。" }
      - { type: z, text: "正義曰：因推此以可變而施行之，謂之通也。猶若亢陽之後變為陰雨，因陰雨而行之，物得開通，聖人亦當然也。" }
      - { type: j, text: "舉而錯之天下之民，謂之事業。事業所以濟物，故舉而錯之於民。" }
      - { type: z, text: "正義曰：謂舉此理以為變化，而錯置於天下之民。凡民得以營為事業，故云“謂之事業”也。此乃自然以變化錯置於民也，聖人亦當法此錯置變化於萬民，使成其事業也。凡《系辭》之說，皆說易道，以為聖人德化，欲使聖人法易道以化成天下，是故易與聖人，恆相將也。以作易者，本為立教故也，非是空說易道，不關人事也。" }
      - { type: j, text: "是故夫象，聖人有以見天下之賾，而擬諸其形容，象其物宜，是故謂之象。聖人有以見天下之動，而觀其會通，以行其典禮，系辭焉以斷其吉凶，是故謂之爻。" }
      - { type: z, text: "正義曰：“是故夫象聖人有以見天下之賾”至“是故謂之爻”者，於第六章已具其文，今於此更復言者何也？為下云“極天下之賾存乎卦，鼓天下之動存乎辭”，為此故更引其文也。且巳下又云“存乎變”“存乎通”“存乎其人”，廣陳所存之事，所以須重論也。" }
      - { type: j, text: "極天下之賾者存乎卦，鼓天下之動者存乎辭。辭，爻辭也。爻以鼓動，效天下之動也。" }
      - { type: z, text: "正義曰：“極天下之賾存乎卦”者，言窮極天下深賾之處存乎卦，言觀卦以知賾也。“鼓天下之動存乎辭”者，鼓，謂發揚天下之動。動有得失，存乎爻卦之辭，謂觀辭以知得失也。" }
      - { type: j, text: "化而裁之存乎變，推而行之存乎通，神而明之存乎其人。體神而明之，不假於象，故存乎其人。" }
      - { type: z, text: "正義曰：“化而裁之存乎變”者，謂覆說上文“化而裁之謂之變”也。“推而行之存乎通”者，覆說上文“推而行之謂之通”也。“神而明之存乎其人”者，言人能神此易道而顯明之者，存在於其人。若其人聖，則能神而明之；若其人愚，則不能神而明之；故存於其人，不在易象也。" }
      - { type: j, text: "默而成之，不言而信，存乎德行。德行，賢人之德行也。順足於內，故默而成之也。體與理會，故不言而信也。" }
      - { type: z, text: "正義曰：若能順理足於內，默然而成就之，闇與理會，不須言而自信也。“存乎德行”者，若有德行，則得默而成就之，不言而信也。若無德行則不能然。此言德行，據賢人之德行也。前《經》“神而明之，存乎其人”，謂聖人也。" }
      - { type: j, text: "上一頁 目錄頁 下一頁" }
