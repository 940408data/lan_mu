# 孟子注疏卷13（孫奭疏）：j 為經文＋漢趙岐注，z 為疏文。
sections:
  - id: juan13
    name: 正文
    blocks:
      - { type: z, text: "正义曰：此卷赵氏分为下卷者也。此卷十有六章。其一章言临事量宜，权其轻重，以礼为先，食色为後，若有偏殊，从其大者。二章言天下大道，人病不由，不患不能，是以曹交请学，孟子辞焉。三章言生之膝下，一体而分，当亲而疏，怨慕号天，是以《小弁》之怨，未足以为愆也。四章言上之所欲，下以为俗。五章言君子交接，动不违道，享见之仪，亢答不差。其六章见几而作，不俟终日，孔子将行，冕不及税。七章言王道浸衰，转为罪人。八章言招携怀远，贵以德礼，义胜为上，战胜为下。九章言善为国者，必藏於民，贼民以往，其馀何观。十章言先王典礼，万世可遵，什一供贡，下富上尊。十一章言君子除害，普为人也。十二章言民无信不立。十三章言好善从人，圣人一概。十四章言仕虽正道，亦有量宜，听言为上，礼貌次之，困而免死，斯为下矣。十五章言圣贤困穷，天坚其志，次贤感激，乃奋其意。十六章言学而见贱，耻之大者，教诲之方，或析或引。凡此十六章，合上卷二十章，是《告子》之篇有三十六章矣。" }
      - { type: j, text: "任人有问屋庐子曰：“礼与食，孰重？”（任国之人问孟子弟子屋庐连，问二者何者为重。）曰：“礼重。”（答曰：礼重。）“色与礼，孰重？”曰：“礼重。”（重如上也。）曰：“以礼食则饥而死，不以礼食则得食，必以礼乎？亲迎则不得妻，不亲迎则得妻，必亲迎乎？”（任人难屋庐子，云若是则必待礼乎？）屋庐子不能对。明日之邹，以告孟子，孟子曰：“於！答是也何有？（於音乌，叹辞也。何有为不可答也。）不揣其本，而齐其末，方寸之木，可使高於岑楼；金重於羽者，岂谓一钩金与一舆羽之谓哉！取食之重者与礼之轻者而比之，奚翅食重？取色之重者与礼之轻者而比之，奚翅色重？”（孟子言夫物当揣量其本，以齐等其末。知其大小轻重乃可言也。不节其数，累积方寸之木，可使高於岑楼。岑楼，山之锐岭者，宁可谓寸木高於山邪？金重於羽，谓多少同而金重耳，一带钩之金，岂重一车羽邪？如取食、色之重者，比礼之轻者，何翅食、色重哉！翅，辞也。若言何其重也。）往应之曰：“‘纟兄之臂而夺之食，则得食，不纟则不得食，则将纟之乎？逾东家墙而搂其处子，则得妻，不搂则不得妻，则将搂之乎？’”（教屋庐子往应任人如是。纟，戾也。搂，牵也。处子，处女也。则是礼重，食、色轻者也。）" }
      - { type: z, text: "“任人”至“搂之乎”。○正义曰：此章指言临事量宜，权其轻重，以礼为先，食、色为後，若有偏殊，从其大者。屋庐子未达，故譬搂、纟也。“任人有问屋庐子曰：礼与食孰重”，任人，任国之人，任国之人有问屋庐子曰：礼与食二者，何者为重？“曰礼重”，屋庐子答之以为礼重。屋庐子，孟子弟子也。任人又问色与礼二者孰重？“曰礼重”，屋庐子又答之以为礼重。“曰：以礼食则饥而死”至“必亲迎乎”，任人又问之曰：人若待有礼然後食，则饥饿而死，不待礼而食者，则得其食而不见饥饿，必待以礼然後食乎？任人意以为不待礼而食也。行亲迎婚之礼，则不得其妻，不待亲迎之礼，则得其妻，必待亲迎之礼？任人意又以为不待亲迎也。所谓礼食者，案《礼》云：“主人亲馈则客祭，主人不亲馈则客不祭。”故君子苟无礼，虽美不食焉，凡此之谓。所谓亲迎者，又案《礼》云：夏氏迎於庭，商人迎於室，周人迎於户，凡此是也。今任人不知此为重，故以食、色并而问之。“屋庐子不能对，明日之邹，以告孟子”，屋庐子未有言以答应，故不能对任人之问，乃明日之邹国，以任人此言告於孟子。“孟子曰：於！答是也何有”至“则将搂之乎”，孟子见庐子不能答此言，乃而叹之曰：答此之言，何有难乎？何为不可答也。言凡物有常，如不揣量其本，但齐等其末，则虽方寸之木，可令高於岑楼。岑楼，山之锐峰也。此乃齐等其末，而不量其本之谓也。言虽可谓之一带钩之金与一车羽毛之谓哉，是亦不揣其本，而齐其末之谓也。以其揣之以本，则方寸之木不能过於岑楼，一带钩之金不能重於一车之羽也。如不揣其本，则取食之重者与礼之轻者比喻之，何啻食为重也。取色之重者与礼之轻者比并之，则何啻为色重也。如此，是犹积累方寸之木，可使高於岑楼；积叠一车之羽毛，可使重於一钩金也。是则任人不揣其本，而齐其末也。且为不以礼食则饥而死，则人谁不以食为重也；不亲迎则得妻，则人谁不以色为重也。故孟子所以於此又教之屋庐子，使往应於任人曰：纟戾其兄之臂而夺之食，则得其食，不纟戾之则不得其食，则将可以纟戾兄之臂乎？逾越东家之墙而牵其处女，则得为之妻，不牵之则不得为之妻，则将可以牵处女乎？言不可如是也，故以“乎”言之。所谓东家则托此言之矣，如谓邻家也。然而邻亦有西、南、北，何不言之，盖言东，则西、南、北不言而在矣。○注“任国”。○正义曰：任，薛同姓之国，在齐楚之间，後亦有案文，在孟子居邹之段。○注“岑楼，山之锐岭”。○正义曰：释云：山小而高者曰岑。是知岑楼即知为锐岭之峰也。曰楼者，盖重屋曰楼，亦取其重高之意也。○注云“处女”。○正义曰：“未嫁者也。”" }
      - { type: j, text: "曹交问曰：“人皆可以为尧、舜，有诸？”孟子曰：“然。”（曹交，曹君之弟。交，名也。答曰然者，言人皆有仁义之心，尧、舜行仁义而已。）“交闻文王十尺，汤九尺。今交九尺四寸以长，食粟而已，如何则可？”（交闻文王与汤皆长而圣。今交亦长，独但食粟而已，当如之何？）曰：“奚有於是？亦为之而已矣。有人於此，力不能胜一匹雏，则为无力人矣。今曰举百钧，则为有力人矣。然则举乌获之任，是亦为乌获而已矣。夫人岂以不胜为患哉？弗为耳。（孟子曰：何有於是言乎？仁义之道，亦当为之乃为贤耳。人言我力不能胜一小雏，则谓之无力之人。言我能举百钧，百钧，三千斤也，则谓之有力之人。乌获，古之有力人也，能移举千钧。人能举其所任，是为乌获才也。夫一匹雏不举，岂患不能胜哉？但不为之耳。）徐行後长者谓之弟，疾行先长者之不弟。夫徐行者，岂人所不能哉！所不为也。（长者，老者也。弟，顺也。人谁不能徐行者，患不肯为也。）尧、舜之道，孝悌而已矣。子服尧之服，诵尧之言，行尧之行，是尧而已矣。子服桀之服，诵桀之言，行桀之行，是桀而已矣。”（孝悌而已，人所能也。尧服，衣服不逾礼也。尧言，仁义之言。尧行，孝悌之行。桀服，谲诡非常之服。桀言，不行仁义之言。桀行，淫虐之行。为尧似尧，为桀似桀而已矣。）曰：“交得见於邹君，可以假馆，愿留而受业於门。”（交欲学於孟子，愿因邹君假馆舍，备门徒也。）曰：“夫道，若大路然，岂难知哉？人病不求耳。子归而求之，有馀师。”（孟子言尧、舜之道，较然若大路，岂有难知，人苦不肯求耳。子归曹而求行其道。有馀师，师不少也，不必留馆学也。）" }
      - { type: z, text: "“曹交”至“馀师”。○正义曰：此章指言天下大道，人病由之，病于不为，不患不能，是以曹交请学，孟子辞焉，盖《诗》三百，一言以蔽之。“曹交问曰：人皆可以为尧、舜，有诸”，曹交，曹君之弟也，姓曹名交。然曹交问孟子曰：凡人皆可以为尧、舜二帝，有诸否乎？“孟子曰然”，孟子答之，以为诚如是也。“交闻文王十尺”至“如何则可”者，曹交又言，交尝闻文王身长十尺，汤王身长九尺，今交身亦长九尺四寸，但独食粟而已，当如之何则可以为尧、舜。“曰奚有於是”至“是桀而已矣”，孟子答之，曰何有於此言之谓乎！言非论身长、短之谓也，所以为尧舜者，是亦为之而已。且托今有人於此，其力不能举任一匹雏之小，是则为无筋力之人也。今又曰能举任三千钧之重，则为有筋力之人也。如是言之，则能举乌获千钧之重任者，此亦足为乌获之徒而已矣。且夫人岂以不能举胜一匹夫之雏小为忧患哉！但不为之耳。如用力举之，则胜矣。以言人之所欲为尧舜者，岂患其不能为之哉？亦但不为之耳。且以徐缓而行，後於长者，是谓之悌顺；急疾而行，先於长者，谓之不悌顺。夫徐缓而行者，岂凡人所不能如是哉！但所不为徐行之矣。夫尧舜二帝，之道而已，子今若身服尧之法服，以衣服不越礼，口诵尧之法言，以其言有法度，所行则行尧所行尧所行之迹，以其行不淫虐，如此，是亦为尧之徒矣。若子於今身乃服桀非常之服，口诵诡懦之言，所行乃行桀淫虐之行，如此，是亦为桀而已矣。“交得见於邹君”至“於门”，曹交闻孟子言至此，乃曰：交得见邹君，可以因而假馆舍，愿留止而受业於夫子之门，而学於孟子也。“曰：夫道若大路”至“馀师”，孟子乃答之曰：夫道若大路，较然易行也，岂为难知者哉？言不难知也。但人病不求之耳，子归曹而自能求之而行其道，亦不少师也，何必愿受业於我。孟子所以答之此者，盖为曹交欲挟邹君而问，是挟贵而问者也，是以辞之而已，抑亦不屑教诲之谓也。○注“百钧三千斤”。○正义曰：已前篇说之矣。○注“乌获有力人也”。正义曰：案皇甫士安《帝王世纪》云：秦武王好多力之士，乌获之徒并皆归焉。秦王於洛阳举周鼎，乌获两目血出。六国时人也。孟子假是而开辟曹交之蔽而已矣。" }
      - { type: j, text: "公孙丑问曰：“高子曰：‘《小弁》，小人之诗也。’”孟子曰：“何以言之？”曰：“怨。”（高子，齐人也。《小弁》，《小雅》之篇，伯奇之诗也。怨者，怨亲之过，故谓之小人。）曰：“固哉！高叟之为诗也。有人於此，越人关弓而射之，则己谈笑而道之，无他，疏之也。其兄关弓而射之，则己垂涕泣而道之，无他，戚之也。《小弁》之怨，亲亲也。亲亲，仁也。固遥夫，高叟之为诗也。（固，陋也。高子年长，孟子曰：陋哉！高父之为诗也。疏越人，故谈笑。戚，亲也，亲其兄，故号泣而道之，怪怨之意也。伯奇，仁人，而父虐之，故作《小弁》之《诗》曰：何辜于天？亲亲而悲怨之辞也。重言固陋，伤高叟不达诗人之意也。）曰：“《凯风》何以不怨？”（《诗·邶风·凯风》之篇也。公孙丑曰：《凯风》，亦孝子之诗，何以独不怨？）曰：“《凯风》，亲之过小者也。《小弁》，亲之过大者也。亲之过大而不怨，是愈疏也。亲之过小而怨，是不可矶也。愈疏，不孝也。不可矶，亦不孝也。孔子曰：‘舜其至孝矣，五十而慕。’”（孟子曰：《凯风》言“莫慰母心”，母心不悦也，知亲之过小也。《小弁》曰“行有死人，尚或堇之”，而曾不闵己，知亲之过大也。愈，益也。过已大矣。而孝子不怨思其亲之意何为如是！是益疏之道也，故曰不孝。矶，激也。过小耳，而孝子感激，辄怨其亲，是亦不孝也。孔子以舜年五十而慕其亲不殆，称曰孝之至矣，孝之不可以已也。知高叟讥《小弁》为不得矣。）" }
      - { type: z, text: "“公孙丑”至“而慕”。○正义曰：此章指言生之膝下，一体而分，喘息呼吸，气通於亲，当亲而疏，怨慕号天，是以《小弁》之怨，未足以为愆也。“公孙丑问曰：高子曰：《小弁》，小人之诗也”，高子，齐人也，公孙丑问孟子曰：高子有云《小弁》之诗，是小人之诗也。“孟子曰：何以言之”，孟子又问孙丑，以谓高子何以言为小人之诗。“曰怨”，孙丑又答之，曰为其有怨也。“曰：固哉！高叟之为诗也”又至“为诗也”，固，陋矣；高子老，孟子称曰叟，盖叟，长老之称也。孟子曰：陋哉！高叟之谓此诗为小人之诗也。今且托以有人於此，是为越南蛮人，被人弯弓而射之，则己见之，则但谈笑而道之也，此无他，是与越人疏也。其兄如被人弯弓而射之，则己见之必垂涕泪，号泣而道之，此无他，是与兄为亲也。《小弁》之诗，其辞有怨，是亲亲之故也。亲亲，仁道也。陋矣夫，高子之谓此诗为小人之诗也，然孟子所以重言之，深诮高子不达诗人之意之甚者也。“曰《凯风》何以不怨”，公孙丑再问孟子，然则《凯风》亦孝子之诗也，何以独不怨？《凯风》，《邶风》之诗也。“曰《凯风》，亲之过小者也”至“五十而慕”者，孟子又答之曰：《凯风》之诗，是亲之过小者也，以诗观之，有曰“有子七人，莫慰母心”，是为亲之过小者也；《小弁》之诗，是亲之过大者也，以诗观之，有曰“何辜于天，我罪伊何”，是则怨以责己，为亲之过大者也。亲之过大而不怨慕之，是益疏其亲也。亲之过小而怨之，是怼其亲也，是谓父母不可以矶激之者也。是亲之过大者，以其幽王信褒姒谗言，疏太子宜臼之亲，非特放之，又将以杀之，是以《小弁》为太子之傅作焉，而著父之过为大者也。亲之过小者，以其先王制礼，夫死，妻稚子幼，然後其妻始与人，今七子之母，则非稚齿子幼者也，乃反不安其室而欲去嫁，是以《凯风》美孝子，以著母之过为小者也。故曰益疏其亲而不怨慕之者，是不孝者也；谓父母不可激之者，是亦不为孝也。云矶者，盖矶，激也，若微切以感激之，以几谏者也，譬如石之激水，顺其流而激之耳。今乃谓亲之不可几谏，安得谓孝子乎？所以云愈疏不孝也，不可矶亦不孝也。又引孔子有云舜其为至孝者耳，以其但亦五十之年，尚能慕亲矣。孟子又引以此，盖谓至孝则当怨慕之也。然则《小弁》之怨，安得谓为小人乎！宜高子所以见诮於吾孟子矣。○注“伯奇仁人，而父虐之”至“何辜于天”。○正义曰：按《史记》云：幽王嬖爱褒姒，姒生子伯服，幽王欲废太子，太子母申侯女而为后，後幽王得褒姒，爱之，欲废申后，并去太子宜臼，以褒为后，以伯服为太子。後立为平王者，是宜臼者也。以此推之，则伯奇，宜臼也。故《小弁》之诗注云：“幽王娶申女，生太子宜臼。又娶褒姒，生子伯服，立以为后，而放宜臼，将杀之。故也。○注“《凯风》”至“《小弁》曰行有死人，尚或堇之”。○正义曰：《凯风》，美孝子之诗也。云“莫慰母心”者，注云：慰，安也。言有子七人，无以安母之心也。云“行有死人，尚或堇之”者，注云“堇，路冢也”。笺云：“相视投掩之行道也，视彼人将掩兔，尚有先驱走之者，道中有死人，尚有覆堇之成其堇者，言其心所不忍也。”" }
      - { type: j, text: "宋将之楚，孟子遇於石丘，曰：“先生将何之？”（宋，宋人名，学士年长者，故谓之先生。石丘，地名也。道遇，问欲何之也。）曰：“吾闻秦、楚构兵，我将见楚王说而罢之。楚王不悦，我将见秦王说而罢之。二王我将有所遇焉。”（自谓往说二王，必有所遇，得从其志也。）曰：“轲也请无问其详，愿闻其指，说之将何如？”（孟子敬宋，自称其名曰轲。不敢详问，愿闻其指，欲如何说之。）曰：“我将言其不利也。”（曰：“我将为二王言兴兵之不利也。）曰：“先生之志则大矣，先生之号则不可。先生以利说秦、楚之王，秦、楚之王悦於利，以罢三军之师，是三军之士乐罢而悦於利也。为人臣者，怀利以事其君；为人子者，怀利以事其父；为人弟者，怀利以事其兄：是君臣、父子、兄弟终去仁义，怀利以相接，然而不亡者，未之有也。（孟子曰：先生志诚大矣，所称名号不可用也。二王悦利罢三军，三军士乐之而悦利，则举国尚利以相接待，而忘仁义，则其国从而亡矣。）先生以仁义说秦、楚之王，秦、楚之王悦於仁义而罢三军之师，是三军之士乐罢而悦於仁义也。为人臣者，怀仁义以事其君；为人子者，怀仁义以事其父；为人弟者，怀仁义以事其兄：是君臣、父子、兄弟去利怀仁义以相接也，然而不王者，未之有也。何必曰利？”（以仁义之道，不忍兴兵，三军之士悦，国人化之，咸以仁义相接，可以致王，何必以利为名也。）" }
      - { type: z, text: "“宋”至“何必曰利”。○正义曰：此章指言上之所欲，下以为俗，俗化於善，久而致平；俗化於恶，久而致倾。是以君子创业，慎其所以为名也。“宋将之楚，孟子遇於石丘，曰先生将何之”，宋，宋国之人，姓宋名，孟子尊老之曰先生。宋将欲往楚国，孟子相逢於石丘之地，石丘则宋国地也。孟子乃问之曰：先生将何往？“曰：吾闻秦、楚构兵”至“我将有遇焉”，宋答孟子曰：我闻秦、楚二国交兵，我将见楚王说而罢之。如楚王不悦我说，我将又见秦王说而罢之。秦、楚二王，我将有所得从其志也。“曰轲也”至“将何如”，孟子敬宋，故自称名，曰：轲也请无敢问其详悉，愿闻其指，意说之将如何说之。“曰：我将言其不利也”，答之曰：我将说之，以言其兴兵之不利也。“曰先生之志则大矣”至“何必曰利”，孟子又答之，曰先生之志则诚为大矣，先生之名号则不可用也。先生今以利说秦、楚二王，秦、楚二王悦於利，是必罢三军之众，万二千五百人为军，三军之众乃三万七千五百人也。如此，是三军之士卒乐罢兵而悦利也。为人臣者，苟怀抱其利以奉君；为人子者，又怀抱利以事其父；为人弟者，又怀抱利以奉其兄：是则君臣、父子、兄弟终皆亡去仁义之道，特怀利以相接待。君臣、父子、兄弟皆以利相接待，然而不身亡者，未之有也。言必亡其身矣。先生将以仁义之道说秦、楚之王，秦、楚之王悦从仁义而罢去三军之众也。如此，是三军之士卒乐罢兵而悦从於仁义也。为人臣者，怀抱仁义之道以奉其君；为人子者，怀抱仁义之道以奉其父；为人弟者，怀抱仁义之道以奉其兄：是则君臣、父子、兄弟乃去其利，而抱仁义相接待也。既怀抱仁义而相接待，则父父子子、君君臣臣、兄兄弟弟，如此则不为王者，未之有也。言如此则可以为王矣，何必曰利以说之乎！盖为利则其害至於亡身，为仁义则其利至於王，故曰何必曰利也。此孟子所以持仁义之道教宋事其秦、楚，讥其欲以利说秦、楚也。○注“宋，宋人，名”。○正义曰：案《荀卿·非十二子》云：“不知壹天下，建国家之权称，曾不足以容辨异、悬君臣，然而其持之有故，其言之成理，足以欺惑愚众，是宋钅开也。”杨亻京云：“宋钅开，宋人，与孟子、尹文子，彭蒙，慎到同时。”《孟子》作宋，与钅开同，口茎反，是也。" }
      - { type: j, text: "孟子居邹。季任为任处守，以币交，受之而不报。处於平陆，储子为相，以币交，受之而不报。（任，薛之同姓小国也。季任，任君季弟也。任君朝会於邻国，季任为之居守其国，致币帛之礼以交孟子，受之而不报。平陆，齐下邑也。储子，齐相也，亦致礼以交於孟子，孟子而不答之也。）他日，由邹之任，见季子；由平陆之齐，不见储子。屋庐子喜曰：“连得间矣！”问曰：“夫子之任见季子，之齐不见储子，为其为相与？”（连，屋庐子名也。见孟子答此二人有异，故喜曰：连今日乃得一见夫子与之间隙也。俱答二人，独见季子，不见储子者，以季子当君国子民之处，储子为相，故轻之邪。）曰：“非也。《书》曰：‘享多仪，仪不及物，曰不享。惟不役志于享。’为其不成享也。（孟子曰：非也。非以储子为相，故不见。《尚书·洛诰篇》曰“享多仪”，言享见之礼多仪法也。物，事也。仪不及事，谓有阙也，故曰不成享礼。储子本礼不足，故我不见也。）屋庐子悦。或问之，屋庐子曰：“季子不得之邹，储子得之平陆。”（屋庐子已晓其意，闻义则服。人问之曰：“何为若是？屋庐子曰：季子守国，不得越境至邹，不身造孟子可也；储子为相，得循行国中，但遥交礼，为其不尊贤，故礼答而不见之也。）" }
      - { type: z, text: "“孟子居邹”至“平陆”。○正义曰：此章指言君子交接，动不违礼，享见之仪，亢答不差，是以孟子或见或否，各以其宜者也。“孟子居邹”至“而不报”，言孟子居处邹国，季任为任国居守者也。以其任国之君朝会於邻国，季任为居守其国也。季任为居守，以币帛之礼以交孟子，孟子受而不答。孟子为齐卿相之时，居处於平陆，齐之下邑，储子为齐相，以币帛交孟子，孟子亦受之而不答。“他日，由邹之任”至“不见储子”，言孟子异日自邹之任国，乃见其季子；自平陆往齐国，乃不见储子。“屋庐子喜曰”至“为相与”，屋庐子见孟子於此二人见与不见，故喜而言曰：连於今日得间隙与夫子为语矣。故问孟子曰：夫子往任国乃见季子，往齐国乃不见储子，是为其储子为齐相，故欲轻之欤？“曰非也”至“为其不成享也”，孟子答之曰：非为其为相，故不见而轻之耳。以其《尚书·洛诰》篇有云“享多仪”，言享见之礼多仪法也。如仪不及享献之物，是曰不享。以其无仪法，虽有物以享之，但亦如不享耳。惟在上者，不役使下之志於享也，是以我不见储子者，为其仪不及物，不成享也，我所以受之币而不见答也。“屋庐子悦”至“得之平陆”，屋庐子已晓，故闻孟子言而喜悦。或人见屋庐子，故问之曰：此《洛诰》云，是何之谓？屋庐子答之曰：季子以其守国，故不得越境亲至邹国见孟子，故但以币交孟子，孟子所以往而见答也。储子为齐相，得循行国中，可以亲至平陆见孟子，然以不亲见之，但亦以币交之，是其不尊贤者也，是所谓仪不及物，为不成享也，孟子所以之齐，故不见而答之也。○注“任，薛之同姓。”正义曰：案鲁隐公十一年《左传》云：“滕侯、薛侯来朝，争长，公使羽父请於薛侯曰：‘周之宗盟，异姓为後，寡人若朝于薛，不敢与诸任齿。’”杜预云：“薛，任姓也。齿，列也。”是知薛与任为同姓也。○注“《尚书·洛诰》篇云”。○正义曰：此篇召公既相宅，周公往营成周，使来告卜，作此《洛诰》之篇也。孔安国云：既成洛邑，将欲成王告以居洛之义也。云“享多仪”至“惟不役志于享”者，案安国传云：“奉上谓之享，言奉上之道多威仪，威仪不及於礼物，惟曰不奉上。人君惟不役志於奉上，则凡人化之。惟曰不奉上矣。”" }
      - { type: j, text: "淳于髡曰：“先名实者，为人也。後名实者，自为也。夫予在三卿之中，名实未加於上下而去之，仁者固如此乎？”（淳于，姓。髡，名也。齐之辨士。名者，有道德之名。实者，治国惠民之功实也。齐，大国，有三卿，谓孟子尝处此三卿之中矣。未闻名实，下济於民，上匡其君，而速去之。仁者之道，固当然邪？）孟子曰：“居下位，不以贤事不肖者，伯夷也。五就汤，五就桀者，伊尹也。不恶污君，不辞小官者，柳下惠也。三子者，不同道，其趋一也。”（伊尹为汤见贡於桀，桀不用而归汤，汤复贡之，如此者五。思济民，冀得施行其道也。此三人虽异道，所履则一也。）“一者何也？”（髡问一者何也。）曰：“仁也。君子亦仁而已矣，何必同？”（孟子言君子进退行止，未必同也，趋於屡仁而已。髡为其速去，故引三子以喻意也。）曰：“鲁缪公之时，公仪子为政，子柳、子思为臣，鲁之削也滋甚。若是乎贤者之无益於国也。”（髡曰：鲁缪公时，公仪休为执政之卿。子柳，泄柳也；子思，孔子之孙也，二人为师傅之臣。不能救鲁之见削夺亡其土地者多。若是，贤者无所益於国家者，何用贤为？）曰：“虞不用百里奚而亡，秦缪公用之而霸。不用贤则亡，削何可得欤？”（孟子云：百里奚所去国亡，所在国霸，无贤国亡，何但得削？岂可不用贤也！）曰：“昔者王豹处於淇，而河西善讴。绵驹处於高唐，而齐右善歌。华周、杞梁之妻善哭其夫，而变国俗。有诸内必形诸外，为其事而无其功者，髡未尝睹之也。是故无贤者也，有则髡必识之。”（王豹，卫之善讴者。淇，水名。《卫诗·竹竿》之篇曰：“泉源在左，淇水在右。”《硕人》之篇曰：“河水洋洋，北流活活。”卫地滨於淇水，在北流河之西，故曰处淇水而河西善讴，所谓郑卫之声也。绵驹，善歌者也。高唐，齐西邑。绵驹处之，故曰齐右善歌。华周，华旋也。杞梁，杞殖也。二人，齐大夫，死於戎事者，其妻哭之哀，城为之崩，国俗化之，则效其哭。髡曰：如是歌、哭者尚能变俗，有中则见外。为之而无功者，髡不闻也。有功，乃为贤者，不见其功，故谓之无贤者也。如有之，则髡必识之矣。）曰：“孔子为鲁司寇，不用，从而祭，燔肉不至，不税冕而行。不知者以为为肉也，其知者以为为无礼也，乃孔子则欲以微罪行，不欲为苟去。君子之所为，众人固不识也。”（孟子言孔子为鲁贤臣。不用，不能用其道也。从鲁君而祭於宗庙，当赐大夫以胙，燔肉不至。膊炙者为燔，《诗》云：“燔炙芬芬，反归其舍。”未及税冕而行，出他国。不知者以为不得燔肉而愠也。知者以为为君无礼，乃欲以微罪行。燔肉不至我党，从祭之礼不备，有微罪乎，乃圣人之妙旨，不欲为，诚欲急去也。众人固不识君子之所为，谓髡不能知贤者之志也。）" }
      - { type: z, text: "“淳于”至“不识也”。○正义曰：此章指言见机而作，不俟终日，孔子将行，冕不及税。庸人不识，课以功实。淳于虽辨，终亦屈服，正者胜也。“淳于髡曰”至“固如是乎”，淳于髡，齐国之辨士也，淳于髡问孟子曰“先名实者，为人也，後名实者，自为也”，言名生于实者也，有功利之实，斯有功利之名，进而治国济民，则名利在所先，故先名实者为人；退而独善其身，则功利在所後，故後名实者为自为。今夫子尝处於三卿之中，而名实未加及於上下而去之，仁人固肯如是乎？髡之意，以为仁人必不如是也，故以此讥之。盖名实未加於上下，以其上无以辅佐君而治国，下无以惠泽而济於民也。“孟子曰”至“其趋也”者，孟子乃答曰：居臣下之位，不肯以贤而奉事不肖者，是伯夷也，所谓“伯夷非其君不事”是矣；五就於汤，五就於桀者，是伊尹也，所谓“何事非君，治亦进，乱亦进”是矣；不耻恶污君，不辞小官者，谓柳下惠也，所谓“尔为尔，我为我，尔焉能浼我哉？厄穷而不悯，遗佚而不怨”是矣：此三子者，虽进退之道不同，然其所履则一而已。“一者，何也”，髡又问孟子所谓其趋一者是何也。“曰：仁也，君子亦仁而已矣，何必同”，孟子又答，曰其一者，是一於仁也。言三子进退行止皆一於仁也。伯夷之仁，则见於必退以为清；伊尹之仁，则见於必进而为任；下惠之仁，则见於不必进、亦不必退而为和。如此，则君子进退行止，亦履仁而已，何用同其进退行止然後为仁也。孟子所以引此三子而喻者，盖谓之去齐，是亦伯夷之清者也，是亦有仁而已，故以是答淳于髡。“曰：鲁缪公之时，公仪子为政”至“无益於国也”，髡又曰鲁缪公之时，公仪休为执政之乡，泄柳、孔为师傅之臣，而鲁国为敌国所侵削益甚，如此，是贤者不能拯救之，是贤者无所益於国家也。“曰：虞不用百里奚而亡”至“何可得欤”者，孟子又答之，曰虞君不能信用百里奚而亡其国，秦缪公任用之而得为霸，是则不能用贤则国亡矣，何特止於见削欤？故曰“削何可得欤”？盖百里奚知虞公之不可谏而去之秦，而穆公释其囚，授之以国政，号曰五大夫，是其事也，又说於《万章》首卷之末详矣。“曰昔者王豹处於淇上”至“识之”者，髡又曰往日卫之善讴咏者王豹居於淇水，而西河之人皆善讴；齐之善讴咏者绵驹居於高唐，而齐右之人皆能善歌：凡此是皆以讴相尚，故然也。齐之二大夫华周、杞梁皆死於戎事，其二人妻哭哀，城为之崩，国俗化之，而皆效其哭，是以如此歌、哭者，尚能变化其俗，则有诸中必见於外。如无其功者，髡未曾见之也。如此是故无贤者也，有贤者则髡必知之矣。淳于髡所以又言之此者，以其不知缪公不能师公仪休、泄柳、子思三子之道，徒疑之以为不贤，又以此明孟子名实未加於上下而去之亦若是矣。故引而言之，复讥於孟子。淇水、河西、高唐、齐右，皆地名也。“曰孔子为鲁司寇”至“众人固不识也”，孟子又答，曰孔子尝为鲁国司寇之官，不得用其道，从鲁君祭於宗庙，当赐大夫以胙燔肉，且不至孔子，孔子遂反归其舍，未及脱祭祀之冕而他国。不知孔子者，以谓孔子不得燔肉，故为此而行也。其知孔子者，以谓为君无礼，乃欲以微罪行。微罪，以其孔子为司寇大夫之官，凡有祭，则大夫之党党从君祭，既从祭之，礼有不备，所以有罪矣。然则君子之所为者，庸众之人固不能识而知也。孟子言此者，又有以讥诮髡也。意谓吾之去齐，是亦君子之道也，岂淳于髡所识也。○注“淳于髡”至“然也”。正义曰：案《史记·列传》云“淳于髡者，齐之赘婿也。长不满七尺，滑稽多辨，数使诸侯，未尝屈辱。齐威之时，喜隐好为淫乐长夜之饮酒，不治，委政於卿大夫，百官荒乱，诸侯并侵，国且危之，左右莫敢谏。淳于髡曰：“国中有大鸟”云云。文恐烦，更不具述。○注“髡曰鲁缪公”至“贤为”。○正义曰：云“公仪休为执政之卿”者，案《史记》云：“公仪休，鲁博士，以高弟为鲁相，奉法循理，无所变更，百官自正，使食禄者不得与下民争利，受大者不得取小。”《汉书》曰：“公仪子相鲁，之其家，见织帛，怒而出。其妻於舍而茹葵，愠而拔其葵，曰：“吾以食禄，又夺园夫、织女利乎？”是公仪休执政之事也。云“子柳，泄柳也”，《檀弓》云“子柳”，郑注云：“子柳，鲁敬仲皮之子，子硕兄也。”子思，孔，已说於前矣。○注“孟子云百里奚去国”至“贤也”。正义曰：云百里奚所去国亡、所在国霸者，即经所谓知虞之将亡而先去之、相秦而霸其君是也。云何但得削者，如杨子云“或人问鲁用儒而削，雄曰：鲁不用真儒故也，如用真儒，无敌於天下，安得削”亦是意也。○注“王豹，卫之善讴”至“知之”。○正义曰：王豹卫之善讴者，注案《卫诗》，以淇水在卫地。《说文》云：“淇水出河内，其北山东入河。”又《晋世家》云“晋西有河，西与秦接境，北边翟，东至河内”是也。《竹竿》、《硕人》，皆卫国之诗也。云“高唐齐西邑”，案齐庄公元年“晋伐齐，至高唐”，杜氏曰“高唐在祝阿县西北”是也。云“华周，华旋也；杞梁，杞殖也”，二人，齐大夫。案鲁襄公二十三年“齐庄公旋自晋，不入，遂袭莒。杞梁、华旋载甲，夜入宿于莒郊。明日，先遇莒子於蒲侯氏”。杜注云：“近莒之邑也。”“莒子重赂之，使无死，曰：‘请有盟。’华周对曰：‘贪货弃命，亦君所恶也。昏而受命，日未中而弃之，何以事君？’莒子亲鼓之，从而伐之，获杞梁。莒人行成，齐侯归，杞梁之妻於郊，使吊之。辞曰：‘殖之有罪，何辱命焉？若免於罪，犹有先人之敝庐在，下妾不得与郊吊。’齐侯吊诸室。”杜注云：杞梁，杞殖也。华周即华旋也。或云齐庄公袭莒，逐而死，其妻孟姜向城而哭，城为之崩。○注“孔子为鲁贤臣，从鲁君而祭於宗庙，燔肉不至者”。○正义曰：案《孔子世家》云：鲁定九年，孔子为中都宰，一年四方皆则之，由中都宰为司空，由司空为大司寇。定公十三年，季氏将堕费，十四年，孔子由大司寇摄行相事，有喜色。门人闻：君子祸至不惧，福至不喜。孔子曰：有是言也。於是诛大夫乱政者少正卯。齐人归女乐，定公有怠政事，子路曰：“夫子可以行矣。”孔子曰：“鲁今且郊，如致燔于大夫，则吾犹可止。”於是不致燔俎于大夫，孔子遂行，宿于此，此鲁国之南地也。王肃曰：“燔，祭肉也。”孔子因卫矣。" }
      - { type: j, text: "孟子曰：“五霸者，三王之罪人也。（五霸者，大国秉直道以率诸侯，齐桓、晋文、秦缪、宋襄、楚庄是也。三王：夏禹、商汤、周文王是也。）今之诸侯，五霸之罪人也。今之大夫，今之诸侯之罪人也。（谓当孟子之时诸侯及大夫也。诸侯，臣，总谓之大夫。罪人之事，下别言之。）天子诸侯曰巡狩，诸侯朝於天子曰述职。春省耕而补不足，秋省敛而助不给。入其疆，土地辟，田野治，养老尊贤，俊杰在位，则有庆，庆以地。入其疆，土地荒芜，遗老失贤，掊克在位，则有让。一不朝则贬其爵，再不朝则削其地，三不朝则六师移之。是故天子讨而不伐，诸侯伐而不讨。五霸者，搂诸侯以伐诸侯者也。故曰五霸者，三王之罪人也。（巡狩、述职，皆以助人民。庆，赏也。养老尊贤，能者在位，赏之以地，益其地也。掊克不良之人在位，则责让之。不朝而至三，则讨之以六师，移之，就之也。讨者，上讨下也。伐者，敌国相征伐也。五霸强搂牵诸侯以伐诸侯，不以王命也，於三王之法，乃为之罪人也。）五霸桓公为盛，葵兵之会诸侯，束牲载书而不歃血。初命曰：‘诛不孝，无易树子，无以妾为妻。’再命曰：‘尊贤育才，以彰有德。’三命曰：‘敬老慈幼，无忘宾旅。’四命曰：‘士无世官，官事无摄；取士必得，无专杀大夫。’五命曰：‘无曲防，无遏籴，无有封而不告。’曰：‘凡我同盟之人，既盟之後，言归于好。’今之诸侯皆犯此五禁，故曰今之诸侯，五霸之罪人也。（齐桓公，五霸之盛者也，与诸侯会于葵丘，束缚其牲，但加载书，不复歃血。言畏桓公，不敢负之，不得专诛不孝。树，立也。已立世子，不得擅易也。不得立爱妾为嫡妻也。尊贤养才，所以彰明有德之人。敬老爱小，恤矜孤寡，客羁旅勿忘忽也。仕为大臣，不得世官，贤臣乃得世禄也。官事无摄，无旷庶僚也。取士必得贤也，立贤无方也。无专杀大夫，不得以私怒行戮也。无敢违王法而以己意设防禁也，无遏止籴不通邻国也，无以私恩擅有封赏而不告盟主也。言归于好，无构怨也。桓公施此五命，而今诸侯皆犯之，故曰罪人也。）长君之恶其罪小，逢君之恶其罪大。今之大夫皆逢君之恶，故曰今之大夫，今之诸侯之罪人也。”（君有恶命，臣长大而宣之，其罪在不能拒逆君命，故曰小也。逢，迎也。君之恶心未发，臣以谄媚逢迎之，而导君为非，故曰罪大。今诸侯之大夫皆逢君之恶，故曰罪人也。）" }
      - { type: z, text: "“孟子”至“罪人也”。○正义曰：此章指言王道浸衰，转为罪人，孟子伤之，是以博思古法，匡时君也。“孟子曰：五霸者，三王之罪人也”至“五霸之罪人也”者，又至“今之诸侯之罪人也”，孟子言齐桓、晋文、秦缪、宋襄、楚庄五霸者，乃为夏禹、商汤、周之罪人也；今之诸侯，谓孟子时之诸侯，乃为五霸者之罪人也；今之大夫，亦谓孟子时之大夫，乃为今之时诸侯之罪人也。自“天子诸侯”至“三王之罪人也”者，此一段是孟子自解五霸为三王之罪人也。“天子诸侯曰巡守”至“助不给”，已说在《惠王篇》，言入其疆，谓古天子行巡守之礼，巡诸侯所守之地，至入其诸侯疆境，见其土地开辟而不芜，田野耕治而不荒，又能养其耆老，尊敬贤者，有俊杰之才能在位行政事。如此，则有庆赏，以其庆赏益其地也。入其封︹，见土地荒芜而不开辟，又遗弃其耆老，失其贤人，惟以掊克多取聚敛之臣在其位，以残民。如此，则有责让。不特责让之，又其一不朝觐述所职，则贬损其爵；至二不朝，则削减其土地；以至三不朝，则命六师以移易其位也，以其不能保安社稷也。是故天子於诸侯，有其罪则讨，而不行兵征伐。诸侯之於诸侯，则行兵征伐而不讨。盖彼有罪，而布令陈辞以责之，是谓讨也；彼有罪而用兵行师以加之，是谓伐也。且五霸者，牵率诸侯者也，故曰五霸者，三王之罪人也。以其五霸擅自专权，不待天子锡之弓矢然後征，锡之钺然後杀者也，特牵率诸侯以伐诸侯而已，是则岂非三王之罪人欤？故齐桓率诸侯以伐蔡，晋文率诸侯以灭曹，秦缪率诸侯以伐晋，宋襄率诸侯以伐楚，楚庄率诸侯以伐陈，是搂诸侯以伐诸侯者也。“五霸桓公为盛”至“五霸之罪人也”，此一段是孟子自解今之诸侯乃五霸之罪人也。言齐桓公为五霸最盛者也，以其土地之广，甲兵之众，强制诸侯，惧其未尽从己也，於是期约诸侯，为葵丘之会。葵丘，杜预曰：“陈留外黄县有葵丘，鲁地也。”诸侯皆束缚其牲，但加载书，而不复歃血。歃血，ヱ血也，言不敢负桓公之约也。桓公於是初命之曰：“诛不孝”，言所诛在不孝矣；“无易树子”，言世子已立，更不得擅自变易也；“无以妾为妻”，言不得以爱幸之妾而立嫡妻也。其再命之曰：“尊贤育才，以彰有德”，言贤者当尊之於朝，以崇其才；德者当养之於学，以成其德，是所谓以彰明有德者也。其三命之曰：“敬老慈幼，无忘宾旅”，言当敬重其耆老，慈悯其幼，少又当无忘忽其宾客羁旅。其四命之曰：“士无世官”，不得兼摄其职也，以其一官不专，则一事不举也；“取士必得”，言所取之士，必得其贤，不得使之群小ゾ乱之也；“无专杀大夫”，言大夫有罪者，当皆请命於天子，而诸侯不得专杀之也。其五命之曰：“无曲防，言不得曲防其水，以专利也，当通水利而防鄣之而已；“无遏籴‘，言不得遏止籴不通於邻国也；“无有封而不告”，言不得有私自封赏而不告於天子也。五命之後，於是又布告之，曰：凡我同盟会盟之人，自今既盟誓之後，言当归於交好，无更构怨也。然今之诸侯，皆犯此桓公之五禁，故曰今之诸侯，五霸之罪人也。五禁即五命是也。“长君之恶”至“今之诸侯之罪人也”者，此一段孟子自解今之大夫为今之诸侯罪人者也，盖自诸侯之下，皆为大夫者也。言君有恶命，臣长益而宣布之，其罪犹小，以其但不能距逆君之命也；君之恶未著，而为之臣乃谄媚逢迎而导君为非，故曰其罪大，以其有以启之也。然今之大夫，皆有以迎君之恶而启之，故曰今之大夫，今之诸侯之罪人也。○注“五霸”至“者也”。正义曰：云“齐桓、晋文”至“楚庄”五者，今案《史记·诸侯年表》云：周庄王十二年，齐桓公小白即位，周王三年始霸，会旅诸侯於甄，周惠王二十三年，诸侯伐郑，周襄王元年夏，会诸侯於葵丘，天子使宰孔赐胙命，无拜，襄王九年卒。是桓公自王三年始霸，至卒，凡得四十三年。晋文公重耳自周襄王十六年即位，是为霸。五年率诸侯以伐曹，襄王二十四年薨，即位凡得九年而已。宋襄公兹父自周襄王三年即位，十三年伐楚，十四年死泓战，是岁襄王十五年矣。秦缪公任好自周惠王十五年即位，二十八年会晋伐楚朝周，是岁周襄王二十年，三十五年伐晋报ゾ，败于汪，三十九年卒，以人从死，是岁襄王三十一年矣。楚庄王侣自周顷王六年即位，十三年伐陈，十六年率诸侯诛陈夏徵舒，立陈成公午，三十三年薨，是岁周定王十六年矣。云“夏禹、商汤、周文武”，说於前矣。○注“齐桓”至“罪人也”。正义曰：云与诸侯会于葵丘，案鲁僖公九年《左传》云：“夏会诸侯于葵丘，寻盟，且好，礼也。秋，齐桓盟诸侯于葵丘，曰：‘凡我同盟之人，既盟之後，言归于好。’”是之谓也。是岁所谓周襄王元年矣。云“诛不孝”者，如卫世子辄拒其父蒯聩，楚世子商臣弑其父，凡此之类，是不孝者也。云“无易其世子”者，如晋献公立奚齐，以易申生，是易世子者也。云“无立爱妾为嫡”者，正妃曰嫡也，如晋献公於骊姬，是以爱妾为嫡也。云“尊贤育才”者，如《南有嘉鱼》之诗云“太平之君子”至“诚乐与贤者共之也”，《菁菁者莪》之诗云“乐育才也”，凡此是尊贤养才之意也。云“敬老爱小，恤矜寡孤”，如《周礼·大司徒》之职云“以保息六养万民，一曰慈幼，二曰养老”；孟子曰“文王发政施仁，必先鳏寡孤独”：是其旨也。云“宾客羁旅，无忽忘也”，《周礼·太宰职》云以礼待宾客之治，是不忘宾客也；孟子曰关讥而不征，是不忘忽羁旅也。云“仕为大臣，不得世官，乃得世禄”者，如鲁有臧孙氏、仲孙氏、叔仲氏、季孙氏，晋有狐氏、赵氏、荀氏、氏、栾氏、范氏，齐有高氏、国氏、崔氏，卫有甯氏、孙氏，是皆世官之类也；孟子曰文王治岐，士者世禄，是世禄之谓也。云“无旷庶僚”者，孔安国云僚，官也，旷，空也，《尚书》注云“无旷庶官，天工人其代之，位非其人为空官，言人代天理官，不可以天官私非其人，亦具官而事无摄，则为非礼”；孔子曰管仲官事不摄，焉得俭，所以讥诮之矣。云“取士必得，立之无方”者，如桓公取管仲於贼国，汤立贤无方是矣；若晋奚齐之於里克，陈灵公於夏徵舒，是取士不得矣。云“不得以私怒行戮”者，如文公六年《左传》云“贾季怨阳子之易其班，而知其无援於晋，乃使续鞠居杀处父”；成公八年，晋杀其大夫赵括；十五年，宋杀其大夫山；十六年，楚杀其大夫公子侧。是也，凡此之类，《春秋》书之四十有七，是专杀大夫也。云“无敢违王法而以己意私设防禁”者，然而此意亦通义矣，奈何据其下文曰“遏籴”，则无曲防是为无曲防障其水以专利者也。故先王制畎遂沟洫，所以为此矣。是齐桓会诸侯于阳，《公羊》以为障谷；会诸侯于葵丘，《梁》以为无壅泉：凡此可见矣。云无止籴，如秦饥、晋闭之籴是也。云无以私恩擅有封赏，如成公十八年楚取彭城以封鱼石是也。凡此五命，案《左传》文则曰“凡我同盟之人，既盟之後，言归于好”，而不及五命。案《公》、《梁》述葵丘会，有云“无遏籴，无易立子，无以妾为妻，无使妇人与国事，无壅泉而不及，诛不孝，尊贤育材，士无世官，官事无摄，取士必得，无专杀大夫，无有封而不告”。案《公羊》述桓公阳之会，则云“无障谷，无贮众，无易立子，无以妾为妻”，而不及无使妇人与国事。其详略与此不同，盖所以相终始而已。又案《春秋》凡书诸侯会有四十九，而齐桓十有八焉；内臣会凡二十有六，而齐居四焉；书外相会凡十有三，而齐居六焉。案《史记》云“兵车之会三，乘车之会六”，孔子曰“桓公九合诸侯，一匡天下”，《梁传》云“衣裳之会十有一”，范注云“十三年会北杏，十四年会鄄，十五年会邮，十六年会幽，二十七年又会幽，僖公元年会柽，二年会贯，三年会阳，五年会首戴，七年会甯，九年会葵丘”，凡十一会也。" }
      - { type: j, text: "鲁欲使慎子为将军。孟子曰：“不教民而用之，谓之殃民。殃民者，不容於尧、舜之世。一战胜齐，遂有南阳，然且不可。”（慎子，善用兵者。不教民以仁义而用之战斗，是使民有殃祸也。尧、舜之世，皆行仁义，故好战殃民者，不能自容也。就使慎子能为鲁一战取齐南阳之地，且犹不可。山南曰阳，岱山之南，谓之南阳也。）慎子勃然不悦，曰：“此则滑所不识也。”（滑，慎子名。不悦，故曰我所不知此言何谓也。）曰：“吾明告子：天子之地方千里，不千里，不足以待诸侯。诸侯之地方百里，不百里，不足以守宗庙之典籍。周公之封於鲁为方百里也，地非不足，而俭於百里。太公之封於齐也，亦为方百里也，地非不足也，而俭於百里。今鲁方百里者五，子以为有王者作，则鲁在所损乎，在所益乎？徒取诸彼以与此，然且仁者不为，况於杀人以求之乎！（孟子见慎子不悦，故曰：明告子，天子诸侯制制如是。诸侯当来朝聘，故言守宗庙，典籍，谓先祖常籍法度之文也。周公大公，地尚不能满百里，俭而不足也，後世兼侵小国，今鲁乃五百里矣。有王者作，若文王、武王者，子以为鲁在所损之中邪、在所益之中也？言其必见损也。但取彼与此为无伤害，仁者尚不肯为，况战斗杀人以求广土地乎！）君子之事君也，务引其君以当道，志於仁而已。”（言君子事君之法，牵引其君以当正道者，仁也。志仁而已，欲使慎子辅君以仁也。）" }
      - { type: z, text: "“鲁欲使慎子”至“而已”。○正义曰：此章指言招携怀远，贵以德礼，既其用兵，庙胜为上，战胜为下，明贱战者也。“鲁欲使慎子为将军”，慎子名滑，善用兵者也，鲁国遂欲使慎子为将军战斗。孟子曰：不教民以仁义之道，而用之战斗，是谓殃祸以残害民也，故好战而殃祸残害其民者，不容於尧、舜二帝之世也。以其尧、舜之世，民皆仁义，但如四凶者，则诛戮之，是不容殃民者也。今欲使慎子为将军，虽为鲁一战而遂取南阳之地，然且犹不可，况有不胜者乎？慎子勃然不悦，曰：此则滑之罪也。慎子见孟子此言，乃勃然变颜而不悦，而愤之曰：此言则滑所不知也。故自称名为滑，是以因知滑为慎子名也。“曰吾明告子”至“於仁而已”，孟子乃与之曰：我分明告子以其不可之意也，且天子之地，方员千里，不阔千里，则其中无可以待诸侯；诸侯之地，方阔百里，不阔百里，则其中无以守宗庙之典籍。典籍，常籍法度之文也，谓先祖之典籍也。周公之封於鲁也，其地为方阔百里者也，非其地不足，而俭用於百里，然亦不敢纵欲以败王制也。太公之封於齐亦然。今鲁国方百里之地有五，以其方五百里者也，子今且以为有王者兴作，则此鲁国之地在所损之中乎，在所益之中乎？言必在所损也。是则徒务战斗，取彼以与此也，是则仁者且不肯为，而战斗杀人以求广土地乎？○注“慎子善用兵”至“南阳也”。○正义曰：案《史记》：“慎到，赵人也。学黄老道德之术，著十二篇。”徐广曰：“今《慎子》，刘向所定，有四十六篇。”《墨子》云：“公输子意不过欲杀臣，杀臣，宋莫能守，可攻也。然臣之弟子滑等三百人，已持鲁国之器在宋城上，而待楚寇也。虽杀臣，不能绝也。於是楚王曰：善哉，吾请无攻宋城矣。”是慎子即慎到矣，《荀卿·非十二子》篇注云“慎子与宋钅开、孟子同时”是也。《墨子》之云，则又知是为善用兵者矣。云“山南曰阳，岱山之南谓之南阳”者，案《尚书·禹贡》“岳阳”，孔安国云“山南曰阳”。岱山即太山，在齐国之南者也。周公封於鲁，太公封於齐。案《周礼》上公之地五百里，齐、鲁是为上公之封，则百里实封之，五百里兼附庸之地也。今鲁方百里，非兼附庸也，安诗自广而已。《礼记》曰“周公封於曲阜百里”，《史记》云“周封伯禽於鲁，四百里；太公於齐，兼五侯地”，是皆臆说，不足取信也。" }
      - { type: j, text: "孟子曰：“今之事君者皆曰：‘我能为君辟土地，充府库。’今之所谓良臣，古之所谓民贼也。（辟土地，侵小国也。充府库，重赋敛也。今之所谓良臣，於古之法为民贼。伤民，故谓之贼也。）君不乡道，不志於仁，而求富之，是富桀也。（为恶君聚敛以富之，为富桀也。谓若夏桀也。）‘我能为君约与国，战必克’。今之所谓良臣，古之所谓民贼也。（连诸侯以战，求必胜之也。）君不乡道，不志於仁，而求为之强战，是辅桀也。（说与上同。）由今之道，无变今之俗，虽与之天下，不能一朝居也。”（今之道非善道，今之世俗渐恶久矣，若不变更，虽得天下之政而治之，不能自安一朝之间居其位也。）" }
      - { type: z, text: "“孟子”至“居也”。○正义曰：此章指言善为国者，必藏於民，贼民以往，其馀何观，变俗移风，非乐不化，以乱齐民，不知其善也。“孟子曰”至“不能一朝居也”，孟子言今之世为臣而奉事君者，皆曰我能为君广辟土地、充实府库，以其皆掊克之人也；今之所谓忠臣良臣者，皆古之先王治世所谓为残贼民者也。孟子於此，又言君既不趋向慕於道，其心之所之又不志於仁，是为恶也。而为臣者，又掊克聚敛而求富之，是如富於夏桀之君也。又且曰我能为君期与敌国战斗，必能胜，如此，是今之所谓良臣，即古之所谓民贼者也。君既不向慕道、不志於仁，而为臣者又求为之强战斗於敌国，是辅桀也。若犹用今之不善之道，又不能变更今之世俗，如此者，虽与之以天下，亦且不能自安一朝之间以居其位也。是以孟子於鲁欲使慎子为将军，所以深辟之也。" }
      - { type: j, text: "白圭曰：“吾欲二十而取一，何如？”（白圭，周人也。节以货殖，欲省赋利民，使二十而税一。）孟子曰：“子之道，貉道也。万室之国，一人陶，则可乎？”（貉，夷貉之人，在荒服者也。貉之说，二十而取一。万家之国，使一人陶瓦器，则可乎？以此喻白圭之所言而已矣。）曰：“不可，器不足用也。”（白圭曰：一人陶，则瓦器不足以供万室之用也。）曰：“夫貉，五不生，惟黍生之。无城郭宫室、宗庙祭祀之礼，无诸侯币帛饔餮，无百官有司，故二十而取一而足也。（貉在北方，其气寒，不生五。黍早熟，故独生之。无中国之礼，如此之用，故可二十而取一而足也。）今居中国，去人伦，无君子，如之何其可也皋陶以寡，且不可以为国，况无君子乎！欲轻之於尧、舜之道者，大貉小貉也。欲重之於尧、舜之道者，大桀小桀也。”（今之居中国，当行礼义，而欲效夷貉无人伦之叙、无君子之道，岂可哉皋陶器者少，尚不可以为国，况无君子之道乎？尧、舜以来，什一而税，足以行礼，故以此为道。今欲轻之，二十而税一者，夷貉为大貉，子为小貉也。欲重之，过什一，则是夏桀为大桀，而子为之小桀也。）" }
      - { type: z, text: "“白圭”至“小桀也”。○正义曰：此章指言先王典礼，万世可遵，什一供贡，下富上尊。裔土简惰，二十而税，夷狄有君，不足为贵。圭欲法之，孟子斥之以王制者也。“白圭曰：吾欲二十而取一，何如”，白圭，周人也，白圭言於孟子曰：我今欲省赋利民，但二十中而税一，如之何？“孟子曰：子之道，貉道也。万室之国，一人陶，则可乎”，孟子欲辟之，故与之曰：子以二十而税一之道，乃荒服北裔貉之道也。故托喻以问之，曰万家之国，但以一人陶瓦器而供使用，则可乎，否乎？“曰不可，器不足用也”，白圭答之，曰一人陶器而供万家之国，则器不足用也，是为不可也。“曰夫貉，五不生”至“大桀小桀也”，孟子又与之言曰：夫貉居於北方，其地寒燥，而五不生长，惟黍为熟於寒燥，故生之。又以其无中国之城郭宫室，又无宗庙祭祀之礼，又无币帛饔飧之费，又无百官之众供赡。朝食曰饔，夕食曰飧。如此，无有费用供赡，故於貉但二十而税一亦足给也。今居中国之地，如去人伦之叙，使无君子之道，如何为可乎！然而陶器之少，且尚不可以为供国之用，况於国而无君子之道乎！且自尧、舜二帝以来，皆以什一而税也，今欲轻於尧、舜什一之道，而欲二十而取一，则夷貉为大貉，而子为小貉也；如欲重於尧、舜什一之道，而过於什一，则夏桀为大桀，而子为小桀也，以其桀暴於赋敛者也。此孟子所辟之白圭也。○注曰“圭，周人也”。○正案班固志货殖传云“白圭，周人也。当魏文侯时，李克务尽地力，而白圭乐观时变，故人弃我取，人取我与。能薄饮食，忍嗜欲，节衣服。曰吾治生，与伊尹、吕尚之谋，孙吴用兵，商鞅行法”是也。又《公羊传》曰古者什一而籍；古者易为什一而籍，什一者，天下之中正也；多乎什一，大桀小桀，寡乎什一，大貉小貉；什一者，天下之中正也，什一行而天下颂声作矣。何休云多取於民，比於桀，蛮貉无百官制度之费，税薄。《梁》云古者什一而籍；孟子曰夏氏五十而贡，殷人七十而助，周人百亩而彻。凡书传云什一者众矣。杜预曰古者公田之法，十取其一，谓十亩内取一。旧法既以十亩取一矣，《春秋》鲁宣公十五年，初税亩，又履其馀亩，更复十取其一，乃是什取其二。故鲁哀公问有若曰：二吾犹不足，如之何其彻也。《周礼·载师》云凡任地近郊十一，远郊二十而三，甸、稍、县、都皆取过十二，漆林之征二十而五。彼谓王畿之内所共多，故赋税重，诸书所言什一，皆谓畿外之国。故郑玄曰：“云什一而税谓之彻。彻，通也。为天下之通法，言天下皆什一耳。”不言畿内亦什一也。孟子云：“方百里为井，井九百亩，其中为公田，八家皆私百亩，同养公田，公事毕，然後敢治私事。”郑玄云：《诗笺》云：井税一夫，其田百亩。则九而税一，其意又异於《汉·食货志》。云井田方一里，是为八九家共之，各受私田百亩，公田十亩，是为八百八十亩，馀二十亩为庐舍。然而诸儒多用孟子为义，如孟子所言，则家别一百一十亩，是为十外税一也，是为郑玄有异於此也。又孟子对滕公，请野九一而助，国中什一使自赋。郑玄《周礼·匠人》注，孟子此言，乃云是邦国，亦异外内之法。则郑玄以为诸侯郊外郊内，郊其法不同，郊内十一，使自赋其一，郊外九而助一，是为二十而税一。故郑玄又云，诸侯谓之彻者，通其率以十一为正，郊内郊外相通，其率为十税一也。杜预直云十取其一，则又异於郑。惟谓一夫百亩，以十亩归公。赵注不解夏五十，殷七十而助助七亩。好恶取於此。郑注《考工记》云：“周人畿内用夏之贡法，邦国用殷之助法也。”" }
      - { type: j, text: "白圭曰：“丹之治水也，愈於禹。”（丹，名；圭，字也。当诸侯之时有小水，白圭为治除之，因自谓过乎禹也。）孟子曰：“子过矣。禹之治水，水之道也，是故禹以四海为壑。今吾子以邻国为壑，水逆行，谓之洚水。洚水者，洪水也。仁人之所恶也，吾子过矣。”（子之所言过矣，禹除中国之害，以四海为沟壑以受其害水，故後世赖之。今子除水，近注之邻国，触於洚水之名，仁人恶为之，自以为愈於禹，是子亦过甚矣。）" }
      - { type: z, text: "“白圭”至“过矣”。○正义曰：此章指言君子除害，普为人也，白圭壑邻，亦以狭矣。是故贤者志其大者、远者也。“白圭曰：丹之治水也，愈於禹”，丹圭，名也，赵注所以知其为圭字也。孟子与之曰：子此言有过谬矣，夫大禹之治水，因水道而疏通归於海也，此故禹以四海为沟壑，以受其水害，故当时民皆得平土而居之；今吾子以邻国为壑以受害，而又有逆其水道，且逆水者，所以谓之洚水，谓洚水即洪大之水也，是为仁人之所恶之也。今子如是，乃云有愈於大禹，是吾子之过谬矣。白圭云所以言此者，是又不知大禹不自满假、不自伐之谓也。於禹治水之功，是又白圭未得禹万分之一也。宜其孟子辞而辟之，以为过谬者矣。抑亦不思天下有溺者由己溺之谓也。" }
      - { type: j, text: "孟子曰：“君子不亮，恶乎执？”（亮，信也。《易》曰：“君子履信思顺。”若为君子之道，舍信将安所执之邪。）" }
      - { type: z, text: "正义曰：此章指言《论语》曰“自古皆有死，民无信不立”，重信之至者也。孟子言君子之道如不以信为主，则君之道恶乎执？言执君子之道，特在乎信也。亮，信也。然言亮而不言信者，盖亮之为义，其体在信，其用在明。君子之道，惟明为能，明善在信，为能诚身，不明乎善，不能诚其身矣。是则君子不亮，又恶乎执欤？以其诚也者，择善而固执之者也。故《论语》云：“自古皆有死，民无信不立。”是重信之至也。" }
      - { type: j, text: "鲁欲使乐正子为政。（乐正子，克也，鲁君使之执政於国。）孟子曰：“吾闻之，喜而不寐。”（喜其人道德得行，为之喜而不寐。）公孙丑曰：“乐正子强乎？”曰：“否。”“有知虑乎？”曰：“否。”“多闻识乎？”曰：“否。”（丑问乐正子有此三问之所能乎？孟子皆曰：否，不能有此也。）“然则奚为喜而不寐？”（丑问无此三者，何为喜而不寐。）曰：“其为人也好善。”（孟子言乐正子之为人也能好善，故为之喜。）“好善足乎？”（丑问以但好善，足以治国乎？）曰：“好善优於天下，而况鲁国乎？夫苟好善，则四海之内，皆将轻千里而来告之以善。夫苟不好善，则人将曰：‘讠讠，予既已知之矣。’讠讠之声音颜色，距人於千里之外。（孟子曰：好善乐闻，善言是采，用之也以此治天下，可以优之，舜是也，何况於鲁不能治乎！人诚好善，四海之内皆轻行千里以善来告之；诚不好善，则其人将曰讠讠，贱他人之言。讠讠者，自足其智，不嗜善言之貌。讠讠之人，发声音，见颜色，人皆知其不欲受善言也。道术之士闻之，止於千里之外而不来也。）士止於千里之外，则谗谄面谀之人至矣。与谗谄面谀之人居，国欲治，可得乎？”（怀善之士止於千里之外，不肯就之，则邪恶顺意之人至矣。与邪恶居，欲使国治，岂可得乎？）" }
      - { type: z, text: "“鲁欲”至“得乎”。○正义曰：此章指言好善从人，圣人一概，禹闻谠言，答之而拜。讠讠吐之，善人亦逝，善去恶来，道若合符。《诗》曰：“雨雪漉漉，见见聿消。”此之谓也。鲁欲使乐正子执政，故言於弟子曰：我闻鲁欲使乐正子为政，遂喜而不寐。以其乐正子将得行其道也。“公孙丑曰：乐正子强乎”至“曰否”，公孙丑见孟子此言以为喜而不寐，乃问孟子曰：乐正子有强力胜乎？曰否，孟子答，无以力胜也。公孙丑问：有智虑能善谋乎？曰否，孟子又答之，曰无用智虑谋也。公孙丑又问曰：有多闻见识乎？曰否，孟子又答，曰无多闻见识也。“然则奚为喜而不寐？曰：其为人也好善”，孟子曰：乐正子为人能好善言，故为之喜也。“好善足乎”，又问，言乐正子但好善言，足以治国乎？“曰：好善优於天下”至“可得乎”，孟子与之曰：能好善言，足优为於天下也，而况鲁国乎？夫人苟好善，则四海之内，有善言之士，皆得不远千里而来告之也；苟不能好善，则四海之内，人将曰彼人之讠讠自足其智，不好善言，我既已知之，如此，则讠讠之人，发声音，形颜色，以距止人於千里之外。是则善言之士既止於千里之外而不来告之，则谗恶谄佞面从之人至矣。然而与谗恶谄佞面谀之人居，国欲使之治，尚可得乎？言不可得而治也。《庄子》云：“好言人之恶以为谗，希意导言以为谄，不择是非而言以为谀”。○注“乐正子克”。○正义曰：已说於前矣。○注“闻善言，虞舜是也”。○正义曰：孟子曰：“舜闻一善言，见一善行，若决江河，沛然莫之能御。”是之谓也。○注“禹闻谠言，答之以拜”至“此之谓也”。○正义曰：禹闻善言则拜。《尚书》“谠言”，说於前矣。“《诗》曰：雨雪漉漉，见见曰消”者，此盖《角弓》之诗文也。注云：见，日也；漉漉，雨雪之盛貌。" }
      - { type: j, text: "陈子曰：“古之君何如则仕？”（陈臻问：古之君子谓何礼可以仕也。）孟子曰：“所就三，所去三。迎之致敬以有礼，言将行其言也，则就之；礼貌未衰，言弗行也，则去之。其次，虽未行其言也，迎之致敬以有礼，则就之；礼貌衰，则去之。其下，朝不食，夕不食，饥饿不能出门户，君闻之，曰：‘吾大者不能行其道，又不能从其言也。使饥饿於我土地，吾耻之。’周之，亦可受也，免死而已矣。”（所去就，谓下事也，礼者，接之以礼也；貌者，颜色和顺，有乐贤之容。礼衰，不敬也；貌衰，不悦也。其下者，困而不能与之禄，则当去。矜其困而问之，苟免死而已。此三就三去之道。穷饿而去不疑也，故不言去，免死而留，为死故也。权时之宜，嫌其疑也，故载之也。）" }
      - { type: z, text: "“陈子”至“己矣”。○正义曰：此章指言士虽正道，亦有量宜，听言为上，礼貌次之，困而免死，斯为下矣。备此三科，亦无疑也。“陈子曰：古之君子何如则仕”，陈臻问孟子：古之君子何如则可进为之仕。“孟子曰：所就三，所去三”，孟子答之，曰古之君子为仕，所去、就有三也。下文孟子解之者是也。自“迎之致敬”至“死而已矣”，是解所去、就有三矣。言国君迎接之，致其敬以有礼，言将行用其言也，则就而仕之，是所谓行可之仕也。如礼貌接之以礼，又有乐贤之容未衰，而言弗得行也，则当退而去之，以其为道而仕，道不行则去矣。其次国君虽未行用其言，然而接之致敬以有礼，则就而仕之，是所谓际可之仕也。及其国君接之不以礼，又无乐贤之容，是其礼貌衰也，是则退而去之，以其为礼而仕，礼既衰则去矣。其下朝旦无以食，夕昏又无以食，以至饥饿困乏不能出其门户，国君闻之，乃曰吾大为之君者，不能使之得行其道，又不能听从其言，而使饥饿於我之土地，吾羞耻之也。如此，国君有以周赐之，亦可以受之而不辞也。无他，免其饿死而已矣。以其为贫而仕，是公养之仕也。是以昔之孔子去、就如是，此孟子答陈臻之问，所以执此而详悉告之。" }
      - { type: j, text: "孟子曰：“舜发於畎亩之中，傅说举於版筑之间，胶鬲举於鱼盐之中，管夷吾举於士，孙叔敖举於海，百里奚举於。故天将降大任於是人也，必先苦其心志，劳其筋骨，饿其体肤，空乏其身，行拂乱其所为，所以动心忍性，曾益其所不能。（舜耕历山，二十徵庸。傅说筑傅岩，武丁举以为相。胶鬲，殷之贤臣，遭纣之乱，隐遁为商，文王於鬻贩鱼盐之中得其人，举之以为臣也。士，狱官也。管仲自鲁囚执於士官，桓公举以为相国。孙叔敖隐处耕於海滨，楚庄王举之以为令尹。百里奚亡虞秦，隐於都，穆公举之於而以为相也。言天将降下大事以任圣贤，必先勤劳其身，饿其体而瘠其肤，使其身乏资绝粮，所行不从拂戾而乱之者，所以动惊其心，坚忍其性，使不违仁，困而知勤，增益其素所以不能行之者也。）人恒过，然後能改。困於心，衡於虑，而後作。徵於色，发於声，而後喻。（人常以有谬思过行，不得福，然後乃更其所为，以不能为能也。困瘁於心，衡，横也，横塞其虑於胸中，而後作为奇计异策、愤激之说也。徵验见於颜色，若屈愿憔悴，渔父见而怪之，发於声而後喻，若甯戚商歌，桓公异之，是而已矣。）入则无法家拂士，出则无敌国外患者，国恒亡。然後知生於忧患，而死於安乐也。”（入，谓国内也。无法度大臣之家、辅弼之士。出，谓国外也。无敌国可难，无外患可忧，则凡庸之君骄慢荒怠，国常以此亡也。故知能生於忧患，死於安乐也。死，亡也。安乐怠慢，使人亡其知能者也。）" }
      - { type: z, text: "“孟子曰”至“安乐也”。○正义曰：此章指言圣贤困穷，天坚其志。次贤感激，乃奋其虑。凡人佚乐，以丧知能。贤愚之叙也。“孟子曰：舜发於畎亩之中”至“死於安乐也”者，孟子言舜初起发自历山亩亩之中，而尧禅其位；傅说筑於傅岩之间，而高宗举之为相；胶鬲鬻贩於鱼盐之中而商，文王举为贤臣；管仲为士官之囚，而桓公举为相国；孙叔敖隐遁於海滨，而楚庄王举为令尹；百里奚亡虞归秦，而隐於都市，秦缪公任之以为相。故天欲降其大任，与之卿相之位於此六人也，必先所以如是苦楚其心志，劬劳其身，已饿其体，使之焦枯疫瘠其皮肤，又使其身空乏无资财，所行不遂，而拂戾其所为，又所以惊动其心，坚忍其性，曾益其素所不能而已。又言人常以过谬，然後更改而迁善。困瘁於心而无所通，则其操心也危，横塞其虑而思虑无所达，而後乃能兴作，其大憔悴枯槁之容而验於色，而後有吟咏叹息之气而发於声，则人见其色，闻其声，而後喻晓其所为矣。又言国君者入於国内，无大夫循守其职而为之法家，又无辅弼谏诤之士；出於国外，则无强敌之大国为危难之警：如是者，其国未为不丧亡矣，故曰国常亡。如是，则然後因而知人以忧患谋虑而生，以安乐怠慢而死也，故曰：“生於忧患，而死於安乐也。”○注“舜耕历山”至“不能行”。○正义曰：“自舜耕历山”至“缪公举之以为相也”，是皆案《史记》之文也。○注若屈愿憔悴，与甯戚商歌，桓公异之。○正义曰：案《史记》：“屈原名平，与楚同姓，事怀王，为三闾大夫，王甚任之。上官大夫与之同列，争宠，而心害其能，因谗之。王怒而疏平，复逐放之。平乃游江滨，被发行吟泽畔，颜色憔悴，形容枯槁。时有渔父钓於江滨，怪而问之曰：‘子非三闾大夫乎，何故至此？’原曰：‘举世混浊，而我独清。众人皆醉，而我独醒。’渔父曰：‘圣人不凝滞於物，与世推移。举世皆浊，何不混其泥而扬其波。众人皆醉，何不啜其糟而其ㄤ。’原曰：‘吾闻新沐者必弹冠，新浴者必振衣。谁能以身察察，受物之汶汶者乎？宁赴常流，而葬鱼腹中耳。’遂作《长沙》之赋，怀石自投汨罗以死。後百馀年，贾谊为长沙王大傅，过湘，投书以吊之。”甯戚角歌者，案《三齐记》云：“齐桓公夜出迎客，甯戚疾击其牛角，高歌曰：‘南山粲，白石烂，生不遭尧与舜禅，短布单衣至，从昏饭牛薄夜半，长夜曼曼何时旦？’桓公乃召与语，说之，遂以为大夫。”" }
      - { type: j, text: "孟子曰：“教亦多术矣！予不屑之教诲也者，是亦教诲之而已矣。”（教人之道多术。予，我也。屑，也。我不其人之行，故不教诲之。其人感此，退自修学而为仁义，是亦教诲之一道也。）" }
      - { type: z, text: "正义曰：此章指言学而见贱，耻之大者，激而厉之，能者以改，教诲之方，或折或引，同归殊途，成之而已。孟子言教人之道，非特一术耳，以其多有也。我之所以於不人之行而不教之者，此亦我有以教之也。以其使彼感激自勉修为之而已，是以亦为教诲之者也。盖谓教亦多术者，有君子之五教，或三隅不反，则不复也；或叩两端而竭；於鄙夫或渎则不告；或谓子之归求有馀师；或为挟贵而不答：是教之多术矣。" }
