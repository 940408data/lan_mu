sections:
  - id: 孝景本紀
    name: 孝景本紀
    blocks:
      - type: j
        text: 孝景皇帝者孝文之中子也母竇太后孝文在代時前后有三男及竇太后得幸前后死及三子更死故孝景得立元年四月乙卯赦天下乙巳賜民爵一級五月除田半租為孝文立太宗廟令羣臣無朝賀匈奴入代與約和親二年春封故相國蕭何孫係為武陵侯男子二十而
      - type: j
        text: 誅晁錯遣袁盎諭告不止遂西圍梁上乃遣大将軍竇嬰太尉周亞夫将兵誅之六月乙亥赦亡軍及楚元王子藝等與謀反者封大将軍竇嬰為魏其侯立楚元王子平陸侯劉禮為楚王立皇子端為膠西王子勝為中山王徙濟北王志為菑川王淮陽王餘為魯王汝南王非為江都王齊王将廬燕王嘉皆薨四年夏立太子立皇子徹為膠東王六月甲戌赦天下後九月更以弋陽為陽陵復置津關用傳出入冬
      - type: j
        text: 七年冬廢栗太子為臨江王十二月晦日有食之春免徒隷作陽陵者丞相青免二月乙巳以太尉條侯周亞夫為丞相四月乙巳立膠東王太后為皇后丁巳立膠東王為太子名徹中元年封故御史大夫周苛孫平為繩侯故御史大夫周昌子左車為安陽侯四月乙巳赦天下賜爵一級除禁錮地動衡山原都雨雹大者尺八寸中二年二月匈奴入燕遂不和親三月召臨江王来
      - type: j
        text: 天下賜爵一級天下大潦更命諸侯丞相曰相秋地動中六年二月己卯行幸雍郊見五帝三月雨雹四月梁孝王城陽共王汝南王皆薨立梁孝王子明為濟川王子彭離為濟東王子定為山陽王子不識為濟陰王梁分為五封四侯更命廷尉為大理将作少府為将作大匠主爵中尉為都尉長信詹事為長信少府将行為大長秋大行為行人奉常為太常典客為
      - type: j
        text: 内史郡不得食馬粟沒入縣官令徒隷衣七緵布止馬春為歲不登禁天下食不造歲省列侯遣之國三月匈奴入鴈門十月租長陵田大旱衡山國河東雲中郡民疫後三年十月日月皆食赤五日十二月晦霅日如紫五星逆行守太微月貫天庭中正月甲寅皇太子冠甲子孝景皇帝崩遣詔賜諸侯王以下至民為父後爵一級天下戸百錢出宫人歸其家復無所與太子
