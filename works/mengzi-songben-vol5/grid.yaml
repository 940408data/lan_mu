labels:
  - page: 162
    col: 1
    role: j
    text: 孟子卷第五朱熹集注
  - page: 162
    col: 2
    role: title
    text: 滕文公章句上
  - page: 162
    col: 3
    role: z
    text: 凡五章
  - page: 162
    col: 4
    role: j
    text: 滕文公爲世子將之楚過宋而見孟子
  - page: 162
    col: 5
    role: z
    text: 世子太子也
  - page: 162
    col: 6
    role: j
    text: 孟子道性善言必稱堯舜
  - page: 162
    col: 7
    role: z
    text: 道言也性者人所禀於天以生之理
  - page: 162
    col: 8
    role: z
    text: 也渾然至善未嘗有惡人與堯舜初
  - page: 163
    col: 1
    role: z
    text: 無少異但衆人汨於私欲而失之堯
  - page: 163
    col: 2
    role: z
    text: 舜則無私欲之蔽而能充其性爾故
  - page: 163
    col: 3
    role: z
    text: 孟子與世子言每道性善而必稱堯
  - page: 163
    col: 4
    role: z
    text: 舜以實之欲其知仁義不假外求聖
  - page: 163
    col: 5
    role: z
    text: 人可學而至而不懈於用力也門人
  - page: 163
    col: 6
    role: z
    text: 不能悉記其辭而撮其大旨如此○
  - page: 163
    col: 7
    role: z
    text: 程子曰性即理也天下之理原其所
  - page: 163
    col: 8
    role: z
    text: 自未有不善喜怒哀樂未發何嘗不
  - page: 163
    col: 9
    role: z
    text: 善發而中節即無往而不善發不中
  - page: 163
    col: 10
    role: z
    text: 節然後爲不善故凡言善惡皆先善
  - page: 163
    col: 11
    role: z
    text: 而後惡言吉凶皆先吉而後凶言是
  - page: 163
    col: 12
    role: z
    text: 非皆先是而後非
  - page: 163
    col: 13
    role: j
    text: 世子自楚反復見孟子孟子曰世子疑
  - page: 163
    col: 14
    role: j
    text: 吾言乎夫道一而已矣
  - page: 163
    col: 15
    role: z
    text: 復扶又反夫音扶○時人不知性之
  - page: 163
    col: 16
    role: z
    text: 本善而以聖賢爲不可企及故世子
  - page: 164
    col: 1
    role: z
    text: 於孟子之言不能無疑而復來求見
  - page: 164
    col: 2
    role: z
    text: 蓋恐別有卑近易行之說也孟子知
  - page: 164
    col: 3
    role: z
    text: 之故但告之如此以明古今聖愚本
  - page: 164
    col: 4
    role: z
    text: 同一性前言已盡無復有它說也
  - page: 164
    col: 5
    role: j
    text: 成覸謂齊景公曰彼丈夫也我丈夫也
  - page: 164
    col: 6
    role: j
    text: 吾何畏彼哉顏淵曰舜何人也予何人
  - page: 164
    col: 7
    role: j
    text: 也有爲者亦若是公明儀曰文王我師
  - page: 164
    col: 8
    role: j
    text: 也周公豈欺我哉
  - page: 164
    col: 9
    role: z
    text: 覸古覓反○成覸人姓名彼謂聖賢
  - page: 164
    col: 10
    role: z
    text: 也有爲者亦若是言人能有爲則皆
  - page: 164
    col: 11
    role: z
    text: 如舜也公明姓儀名魯賢人也文王
  - page: 164
    col: 12
    role: z
    text: 我師也蓋周公之言公明儀亦以文
  - page: 164
    col: 13
    role: z
    text: 王爲必可師故誦周公之言而嘆其
  - page: 164
    col: 14
    role: z
    text: 不我欺也孟子既告世子以道無二
  - page: 164
    col: 15
    role: z
    text: 致而復引此三言以明之欲世子篤
  - page: 164
    col: 16
    role: z
    text: 信力行以師聖賢不當復求它說也
  - page: 165
    col: 1
    role: j
    text: 今滕絶長補短將五十里也猶可以爲
  - page: 165
    col: 2
    role: j
    text: 善國書曰若藥不瞑眩厥疾不瘳
  - page: 165
    col: 3
    role: z
    text: 瞑莫甸反眩音縣○絶猶截也書商
  - page: 165
    col: 4
    role: z
    text: 書說命篇瞑眩憒亂言滕國雖小猶
  - page: 165
    col: 5
    role: z
    text: 足爲治但恐安於卑近不能自克則
  - page: 165
    col: 6
    role: z
    text: 不足以去惡而爲善也○愚按孟子
  - page: 165
    col: 7
    role: z
    text: 之言性善始見於此而詳具於告子
  - page: 165
    col: 8
    role: z
    text: 之篇然默識而旁通之則七篇之中
  - page: 165
    col: 9
    role: z
    text: 無非此理其所以擴前聖之未發而
  - page: 165
    col: 10
    role: z
    text: 有功於聖人之門程子之言信矣
  - page: 165
    col: 11
    role: j
    text: 滕定公薨世子謂然友曰昔者孟子甞
  - page: 165
    col: 12
    role: j
    text: 與我言於宋於心終不忘今也不幸至
  - page: 165
    col: 13
    role: j
    text: 於大故吾欲使子問於孟子然後行事
  - page: 165
    col: 14
    role: z
    text: 定公文公父也然友世子之傅也大
  - page: 165
    col: 15
    role: z
    text: 故大喪也事謂喪禮
  - page: 165
    col: 16
    role: j
    text: 然友之鄒問於孟子孟子曰不亦善乎
  - page: 166
    col: 1
    role: j
    text: 親喪固所自盡也曾子曰生事之以禮
  - page: 166
    col: 2
    role: j
    text: 死葬之以禮祭之以禮可謂孝矣諸侯
  - page: 166
    col: 3
    role: j
    text: 之禮吾未之學也雖然吾甞聞之矣三
  - page: 166
    col: 4
    role: j
    text: 年之喪齊䟽之服飦粥之食自天子逹
  - page: 166
    col: 5
    role: j
    text: 於庶人三代共之
  - page: 166
    col: 6
    role: z
    text: 齊音資䟽所居反飦諸延反○當時
  - page: 166
    col: 7
    role: j
    text: 諸侯莫能行古喪禮而文公獨能以
  - page: 166
    col: 8
    role: j
    text: 此爲問故孟子善之又言父母之喪
  - page: 166
    col: 9
    role: j
    text: 固人子之心所自盡者蓋悲哀之情
  - page: 166
    col: 10
    role: j
    text: 痛疾之意非自外至冝乎文公於此
  - page: 166
    col: 11
    role: j
    text: 有所不能自巳也但所引曽子之言
  - page: 166
    col: 12
    role: j
    text: 本孔子告樊遲者豈曽子甞誦之以
  - page: 166
    col: 13
    role: j
    text: 告其門人歟三年之喪者子生三年
  - page: 166
    col: 14
    role: j
    text: 然後免於父母之懷故父母之喪必
  - page: 166
    col: 15
    role: j
    text: 以三年也齊衣下縫也不緝曰斬衰
  - page: 166
    col: 16
    role: j
    text: 緝之曰齊衰䟽麤也麤布也飦糜也
  - page: 167
    col: 1
    role: j
    text: 喪禮三日始食粥旣葬乃疏食此古
  - page: 167
    col: 2
    role: z
    text: 今貴賤通行之禮也
  - page: 167
    col: 3
    role: j
    text: 然友反命定爲三年之喪父兄百官皆
  - page: 167
    col: 4
    role: j
    text: 不欲曰吾宗國魯先君莫之行吾先君
  - page: 167
    col: 5
    role: j
    text: 亦莫之行也至於子之身而反之不可
  - page: 167
    col: 6
    role: j
    text: 且志曰喪祭從先祖曰吾有所受之也
  - page: 167
    col: 7
    role: j
    text: 父兄同姓老臣也滕與魯俱文王之
  - page: 167
    col: 8
    role: j
    text: 後而魯祖周公爲長兄弟宗之故滕
  - page: 167
    col: 9
    role: j
    text: 已魯爲宗國也然謂二國不行三年
  - page: 167
    col: 10
    role: j
    text: 之喪者乃其後世之失非周公之法
  - page: 167
    col: 11
    role: j
    text: 本然也志記也引志之言而釋其意
  - page: 167
    col: 12
    role: j
    text: 以爲所以如此者蓋爲上世以來有
  - page: 167
    col: 13
    role: j
    text: 所傳受雖或不同不可改也然志所
  - page: 167
    col: 14
    role: j
    text: 言本謂先王之世舊俗所傳禮文小
  - page: 167
    col: 15
    role: j
    text: 異而可以通行者耳不謂後世失禮
  - page: 167
    col: 16
    role: j
    text: 之甚者也
  - page: 168
    col: 1
    role: j
    text: 謂然友曰吾他日未嘗學問好馳馬試
  - page: 168
    col: 2
    role: j
    text: 劒今也父兄百官不我足也恐其不能
  - page: 168
    col: 3
    role: j
    text: 盡於大事子爲我問孟子然友復之鄒
  - page: 168
    col: 4
    role: j
    text: 問孟子孟子曰然不可以他求者也孔
  - page: 168
    col: 5
    role: j
    text: 子曰君薨聽於冢宰歠粥面深墨即位
  - page: 168
    col: 6
    role: j
    text: 而哭百官有司莫敢不哀先之也上有
  - page: 168
    col: 7
    role: j
    text: 好者下必有甚焉者矣君子之德風也
  - page: 168
    col: 8
    role: j
    text: 小人之德草也草尚之風必偃是在世
  - page: 168
    col: 9
    role: j
    text: 子
  - page: 168
    col: 10
    role: z
    text: 好爲皆去聲復扶又反歠川悅反○
  - page: 168
    col: 11
    role: z
    text: 不我足謂不以我滿足其意也然者
  - page: 168
    col: 12
    role: z
    text: 然其不我足之言不可他求者言當
  - page: 168
    col: 13
    role: z
    text: 責之於已冢宰六卿之長也歠飲也
  - page: 168
    col: 14
    role: z
    text: 深墨甚黑色也即就也尚加也論語
  - page: 168
    col: 15
    role: z
    text: 作上古字通也偃伏也孟子言但在
  - page: 168
    col: 16
    role: z
    text: 世子自盡其哀而已
  - page: 169
    col: 1
    role: j
    text: 然友反命世子曰然是誠在我五月居
  - page: 169
    col: 2
    role: j
    text: 廬未有命戒百官族人可謂曰知及至
  - page: 169
    col: 3
    role: j
    text: 葬四方來觀之顏色之戚哭泣之哀弔
  - page: 169
    col: 4
    role: j
    text: 者大悅
  - page: 169
    col: 5
    role: z
    text: 諸侯五月而葬未葬居倚廬於中門
  - page: 169
    col: 6
    role: z
    text: 之外居喪不言故未有命令教戒也
  - page: 169
    col: 7
    role: z
    text: 可謂曰知疑有闕誤或曰皆謂世子
  - page: 169
    col: 8
    role: z
    text: 之知禮也○林氏曰孟子之時喪禮
  - page: 169
    col: 9
    role: z
    text: 旣壞然三年之喪惻隱之心痛疾之
  - page: 169
    col: 10
    role: z
    text: 意出於人心之所固有者初未甞亡
  - page: 169
    col: 11
    role: z
    text: 也惟其溺於流俗之弊是以喪其良
  - page: 169
    col: 12
    role: z
    text: 心而不自知耳文公見孟子而聞性
  - page: 169
    col: 13
    role: z
    text: 善堯舜之說則固有以啓發其良心
  - page: 169
    col: 14
    role: z
    text: 矣是以至此而哀痛之誠心發焉及
  - page: 169
    col: 15
    role: z
    text: 其父兄百官皆不欲行則亦反躬自
  - page: 169
    col: 16
    role: z
    text: 責悼其前行之不足以取信而不敢
  - page: 170
    col: 1
    role: z
    text: 有非其父兄百官之心雖其資質有
  - page: 170
    col: 2
    role: z
    text: 過人者而學問之力亦不可誣也及
  - page: 170
    col: 3
    role: z
    text: 其斷然行之而遠近見聞無不悅服
  - page: 170
    col: 4
    role: z
    text: 則以人心之所同然者自我發之而
  - page: 170
    col: 5
    role: z
    text: 彼之心悅誠服亦有所不期然而然
  - page: 170
    col: 6
    role: z
    text: 者人性之善豈不信哉
  - page: 170
    col: 7
    role: j
    text: 滕文公問爲國
  - page: 170
    col: 8
    role: z
    text: 文公以禮聘孟子故孟子至滕而文
  - page: 170
    col: 9
    role: z
    text: 公問之
  - page: 170
    col: 10
    role: j
    text: 孟子曰民事不可緩也詩云晝爾于茅
  - page: 170
    col: 11
    role: j
    text: 宵爾索綯亟其乘屋其始播百穀
  - page: 170
    col: 12
    role: z
    text: 綯音陶亟紀力反○民事謂農事詩
  - page: 170
    col: 13
    role: z
    text: 豳風七月之篇于往取也綯絞也亟
  - page: 170
    col: 14
    role: z
    text: 急也乘升也播布也言農事至重人
  - page: 170
    col: 15
    role: z
    text: 君不可以爲緩而忽之故引詩言治
  - page: 170
    col: 16
    role: z
    text: 屋之急如此者蓋以來春將復始播
  - page: 171
    col: 1
    role: z
    text: 百穀而不暇爲此也
  - page: 171
    col: 2
    role: j
    text: 民之爲道也有恒産者有恒心無恒産
  - page: 171
    col: 3
    role: j
    text: 者無恒心苟無恒心放辟邪侈無不爲
  - page: 171
    col: 4
    role: j
    text: 已及陷乎罪然後從而刑之是罔民也
  - page: 171
    col: 5
    role: j
    text: 焉有仁人在位罔民而可爲也
  - page: 171
    col: 6
    role: z
    text: 音義並見前篇
  - page: 171
    col: 7
    role: j
    text: 是故賢君必恭儉禮下取於民有制
  - page: 171
    col: 8
    role: z
    text: 恭則能以禮接下儉則能取民以制
  - page: 171
    col: 9
    role: j
    text: 陽虎曰爲冨不仁矣爲仁不冨矣
  - page: 171
    col: 10
    role: z
    text: 陽虎陽貨魯季氏家臣也天理人欲
  - page: 171
    col: 11
    role: z
    text: 不容並立虎之言此恐爲仁之害於
  - page: 171
    col: 12
    role: z
    text: 冨也孟子引之恐爲冨之害於仁也
  - page: 171
    col: 13
    role: z
    text: 君子小人每相反而已矣
  - page: 171
    col: 14
    role: j
    text: 夏后氏五十而貢殷人七十而助周人
  - page: 171
    col: 15
    role: j
    text: 百畒而徹其實皆什一也徹者徹也助
  - page: 171
    col: 16
    role: j
    text: 者藉也
  - page: 172
    col: 1
    role: j
    text: 徹敕列反藉子夜反○此以下乃言
  - page: 172
    col: 2
    role: j
    text: 制民常產與其取之之制也夏時一
  - page: 172
    col: 3
    role: j
    text: 夫受田五十畝而每夫計其五畝之
  - page: 172
    col: 4
    role: j
    text: 入以為貢商人始為井田之制以六
  - page: 172
    col: 5
    role: j
    text: 百三十畝之地畫為九區區七十畝
  - page: 172
    col: 6
    role: j
    text: 中為公田其外八家各授一區但借
  - page: 172
    col: 7
    role: j
    text: 其力以助耕公田而不復稅其私田
  - page: 172
    col: 8
    role: j
    text: 周時一夫授田百畝鄉遂用貢法十
  - page: 172
    col: 9
    role: j
    text: 夫有溝都鄙用助法八家同井耕則
  - page: 172
    col: 10
    role: j
    text: 通力而作收則計畝而分故謂之徹
  - page: 172
    col: 11
    role: j
    text: 其實皆什一者貢法固以十分之一
  - page: 172
    col: 12
    role: j
    text: 為常數惟助法乃是九一而商制不
  - page: 172
    col: 13
    role: j
    text: 可考周制則公田百畝中以二十畝
  - page: 172
    col: 14
    role: j
    text: 為廬舍一夫所耕公田實計十畝通
  - page: 172
    col: 15
    role: j
    text: 私田百畝為十一分而取其一蓋又
  - page: 172
    col: 16
    role: j
    text: 輕於十一矣竊料商制亦當如此而
  - page: 173
    col: 1
    role: j
    text: 以十四畝爲廬舍一夫實耕公田七
  - page: 173
    col: 2
    role: j
    text: 畝是亦不過什一也徹通也均也藉
  - page: 173
    col: 3
    role: z
    text: 借也
  - page: 173
    col: 4
    role: j
    text: 龍子曰治地莫善於助莫不善於貢貢
  - page: 173
    col: 5
    role: j
    text: 者校數歲之中以爲常樂歲粒米狼戾
  - page: 173
    col: 6
    role: j
    text: 多取之而不爲虐則寡取之凶年糞其
  - page: 173
    col: 7
    role: j
    text: 田而不足則必取盈焉爲民父母使民
  - page: 173
    col: 8
    role: j
    text: 盻盻然將終歲勤動不得以養其父母
  - page: 173
    col: 9
    role: j
    text: 又稱貸而益之使老稚轉乎溝壑惡在
  - page: 173
    col: 10
    role: j
    text: 其爲民父母也
  - page: 173
    col: 11
    role: j
    text: 樂音洛盻五禮反從目從兮或音普
  - page: 173
    col: 12
    role: j
    text: 莧反者非養去聲惡平聲○龍子古
  - page: 173
    col: 13
    role: j
    text: 賢人狼戾猶狼藉言多也糞擁也盈
  - page: 173
    col: 14
    role: j
    text: 滿也盻恨視也勤動勞苦也稱舉也
  - page: 173
    col: 15
    role: j
    text: 貸借也取物於人而出息以償之也
  - page: 173
    col: 16
    role: j
    text: 益之以足取盈之數也稚幼子也
  - page: 174
    col: 1
    role: j
    text: 夫世禄滕固行之矣
  - page: 174
    col: 2
    role: z
    text: 夫音扶○孟子甞言文王治岐耕者
  - page: 174
    col: 3
    role: z
    text: 九一仕者世禄二者王政之本也今
  - page: 174
    col: 4
    role: z
    text: 世禄滕已行之惟助法未行故取於
  - page: 174
    col: 5
    role: z
    text: 民者無制耳蓋世禄者授之土田使
  - page: 174
    col: 6
    role: z
    text: 之食其公田之入實與助法相爲表
  - page: 174
    col: 7
    role: z
    text: 裏所以使君子野人各有定業而上
  - page: 174
    col: 8
    role: z
    text: 下相安者也故下文遂言助法
  - page: 174
    col: 9
    role: j
    text: 詩云雨我公田遂及我私惟助爲有公
  - page: 174
    col: 10
    role: j
    text: 田由此觀之雖周亦助也
  - page: 174
    col: 11
    role: z
    text: 雨于付反○詩小雅大田之篇雨降
  - page: 174
    col: 12
    role: z
    text: 雨也言願天雨於公田而遂及私田
  - page: 174
    col: 13
    role: z
    text: 先公而後私也當時助法盡廢典籍
  - page: 174
    col: 14
    role: z
    text: 不存惟有此詩可見周亦用助故引
  - page: 174
    col: 15
    role: z
    text: 之也
  - page: 174
    col: 16
    role: j
    text: 設爲庠序學校以教之庠者養也校者
  - page: 175
    col: 1
    role: j
    text: 教也序者射也夏曰校殷曰序周曰庠
  - page: 175
    col: 2
    role: j
    text: 學則三代共之皆所以明人倫也人倫
  - page: 175
    col: 3
    role: j
    text: 明於上小民親下
  - page: 175
    col: 4
    role: z
    text: 庠以養老為義校以教民為義序以
  - page: 175
    col: 5
    role: z
    text: 習射為義皆鄉學也學國學也共之
  - page: 175
    col: 6
    role: z
    text: 無異名也倫序也父子有親君臣有
  - page: 175
    col: 7
    role: z
    text: 義夫婦有別長幼有序朋友有信此
  - page: 175
    col: 8
    role: z
    text: 人之大倫也庠序學校皆以明此而
  - page: 175
    col: 9
    role: z
    text: 巳
  - page: 175
    col: 10
    role: j
    text: 有王者起必來取法是為王者師也
  - page: 175
    col: 11
    role: z
    text: 滕國褊小雖行仁政未必能興王業
  - page: 175
    col: 12
    role: z
    text: 然為王者師則雖不有天下而其澤
  - page: 175
    col: 13
    role: z
    text: 亦足以及天下矣聖賢至公無我之
  - page: 175
    col: 14
    role: z
    text: 心於此可見
  - page: 175
    col: 15
    role: j
    text: 詩云周雖舊邦其命惟新文王之謂也
  - page: 175
    col: 16
    role: j
    text: 子力行之亦以新子之國
  - page: 176
    col: 1
    role: z
    text: 詩大雅文王之篇言周雖后稷以來
  - page: 176
    col: 2
    role: z
    text: 舊爲諸侯其受天命而有天下則自
  - page: 176
    col: 3
    role: z
    text: 文王始也子指文公諸侯未踰年之
  - page: 176
    col: 4
    role: z
    text: 稱也
  - page: 176
    col: 5
    role: j
    text: 使畢戰問井地孟子曰子之君將行仁
  - page: 176
    col: 6
    role: j
    text: 政選擇而使子子必勉之夫仁政必自
  - page: 176
    col: 7
    role: j
    text: 經界始經界不正井地不鈞穀禄不平
  - page: 176
    col: 8
    role: j
    text: 是故暴君汙吏必慢其經界經界旣正
  - page: 176
    col: 9
    role: j
    text: 分田制禄可坐而定也
  - page: 176
    col: 10
    role: z
    text: 夫音扶○畢戰滕臣文公因孟子之
  - page: 176
    col: 11
    role: z
    text: 言而使畢戰主爲井地之事故又使
  - page: 176
    col: 12
    role: z
    text: 之來問其詳也井地即井田也經界
  - page: 176
    col: 13
    role: z
    text: 謂治地分田經畫其溝塗封植之界
  - page: 176
    col: 14
    role: z
    text: 也此法不修則田無定分而豪強得
  - page: 176
    col: 15
    role: z
    text: 以兼并故井地有不鈞賦無定法而
  - page: 176
    col: 16
    role: z
    text: 貪暴得以多取故穀禄有不平此欲
  - page: 177
    col: 1
    role: z
    text: 行仁政者之所以必從此始而暴君
  - page: 177
    col: 2
    role: z
    text: 汗吏則必欲慢而廢之也有以正之
  - page: 177
    col: 3
    role: z
    text: 則分田制禄可不勞而定矣
  - page: 177
    col: 4
    role: j
    text: 夫滕壤地褊小將爲君子焉將爲野人
  - page: 177
    col: 5
    role: j
    text: 焉無君子莫治野人無野人莫養君子
  - page: 177
    col: 6
    role: z
    text: 夫音扶養去聲○言滕地雖小然其
  - page: 177
    col: 7
    role: z
    text: 間亦必有爲君子而仕者亦必有爲
  - page: 177
    col: 8
    role: z
    text: 野人而耕者是以分田制禄之法不
  - page: 177
    col: 9
    role: z
    text: 可偏廢也
  - page: 177
    col: 10
    role: j
    text: 請野九一而助國中什一使自賦
  - page: 177
    col: 11
    role: z
    text: 此分田制禄之常法所以治野人使
  - page: 177
    col: 12
    role: z
    text: 養君子也野郊外都鄙之地也九一
  - page: 177
    col: 13
    role: z
    text: 而助爲公田而行助法也國中郊門
  - page: 177
    col: 14
    role: z
    text: 之内鄉遂之地也田不井授但爲溝
  - page: 177
    col: 15
    role: z
    text: 洫使什而自賦其一蓋用貢法也周
  - page: 177
    col: 16
    role: z
    text: 所謂徹法者蓋如此以此推之當時
  - page: 178
    col: 1
    role: z
    text: 非惟助法不行其貢亦不止什一矣
  - page: 178
    col: 2
    role: j
    text: 卿以下必有圭田圭田五十畝
  - page: 178
    col: 3
    role: z
    text: 此世禄常制之外又有圭田所以厚
  - page: 178
    col: 4
    role: z
    text: 君子也圭潔也所以奉祭祀也不言
  - page: 178
    col: 5
    role: z
    text: 世禄者滕已行之但此未備耳
  - page: 178
    col: 6
    role: j
    text: 餘夫二十五畝
  - page: 178
    col: 7
    role: z
    text: 程子曰一夫上父母下妻子以五口
  - page: 178
    col: 8
    role: z
    text: 八口爲率受田百畝如有弟是餘夫
  - page: 178
    col: 9
    role: z
    text: 也年十六別受田二十五畝俟其壯
  - page: 178
    col: 10
    role: z
    text: 而有室然後更受百畝之田愚按此
  - page: 178
    col: 11
    role: z
    text: 百畝常制之外又有餘夫之田以厚
  - page: 178
    col: 12
    role: z
    text: 野人也
  - page: 178
    col: 13
    role: j
    text: 死徙無出鄉鄉田同井出入相友守望
  - page: 178
    col: 14
    role: j
    text: 相助疾病相扶持則百姓親睦
  - page: 178
    col: 15
    role: z
    text: 死謂葬也徙謂徙其居也同井者八
  - page: 178
    col: 16
    role: z
    text: 家也友猶伴也守望防冦盜也
  - page: 179
    col: 1
    role: j
    text: 方里而井井九百畝其中爲公田八家
  - page: 179
    col: 2
    role: j
    text: 皆私百畝同養公田公事畢然後敢治
  - page: 179
    col: 3
    role: j
    text: 私事所以別野人也
  - page: 179
    col: 4
    role: z
    text: 養去聲別彼列反○此詳言井田形
  - page: 179
    col: 5
    role: z
    text: 體之制乃周之助法也公田以爲君
  - page: 179
    col: 6
    role: z
    text: 子之祿而私田野人之所受先公後
  - page: 179
    col: 7
    role: z
    text: 私所以別君子野人之分也不言君
  - page: 179
    col: 8
    role: z
    text: 子據野人而言省文耳上言野及國
  - page: 179
    col: 9
    role: z
    text: 中二法此獨詳於治野者國中貢法
  - page: 179
    col: 10
    role: z
    text: 當世已行但取之過於什一爾
  - page: 179
    col: 11
    role: j
    text: 此其大略也若夫潤澤之則在君與子
  - page: 179
    col: 12
    role: j
    text: 矣
  - page: 179
    col: 13
    role: z
    text: 夫音扶○井地之法諸侯皆去其籍
  - page: 179
    col: 14
    role: z
    text: 此特其大略而已潤澤謂因時制宜
  - page: 179
    col: 15
    role: z
    text: 使合於人情宜於土俗而不失乎先
  - page: 179
    col: 16
    role: z
    text: 王之意也○吕氏曰子張子慨然有
  - page: 180
    col: 1
    role: j
    text: 意三代之治論治人先務未始不以
  - page: 180
    col: 2
    role: j
    text: 經界爲急講求法制粲然備具要之
  - page: 180
    col: 3
    role: j
    text: 可以行于今如有用我者舉而措之
  - page: 180
    col: 4
    role: j
    text: 耳甞曰仁政必自經界始貧冨不均
  - page: 180
    col: 5
    role: j
    text: 教養無法雖欲言治皆苟而巳丗之
  - page: 180
    col: 6
    role: j
    text: 病難行者未始不以亟奪冨人之田
  - page: 180
    col: 7
    role: j
    text: 爲辭然兹法之行恱之者衆苟處之
  - page: 180
    col: 8
    role: j
    text: 有術期以數年不刑一人而可復所
  - page: 180
    col: 9
    role: j
    text: 病者特上之未行耳乃言曰縱不能
  - page: 180
    col: 10
    role: j
    text: 行之天下猶可驗之一鄕方與學者
  - page: 180
    col: 11
    role: j
    text: 議古之法買田一方畫爲數井上不
  - page: 180
    col: 12
    role: j
    text: 失公家之賦役退以其私正經界分
  - page: 180
    col: 13
    role: j
    text: 宅里立歛法廣儲蓄興學校成禮俗
  - page: 180
    col: 14
    role: j
    text: 救菑恤患厚本抑末足以推先王之
  - page: 180
    col: 15
    role: j
    text: 遺法明當今之可行有志未就而卒
  - page: 180
    col: 16
    role: z
    text: ○愚按喪禮經界兩章見孟子之學
  - page: 181
    col: 1
    role: z
    text: 識其大者是以雖當禮法廢壞之後
  - page: 181
    col: 2
    role: z
    text: 制度節文不可復考而能因略以致
  - page: 181
    col: 3
    role: z
    text: 詳推舊而爲新不屑屑於旣往之迹
  - page: 181
    col: 4
    role: z
    text: 而能合乎先王之意真可謂命世亞
  - page: 181
    col: 5
    role: z
    text: 聖之才矣
  - page: 181
    col: 6
    role: j
    text: 有爲神農之言者許行自楚之滕踵門
  - page: 181
    col: 7
    role: j
    text: 而告文公曰逺方之人聞君行仁政願
  - page: 181
    col: 8
    role: j
    text: 受一廛而爲氓文公與之處其徒數十
  - page: 181
    col: 9
    role: j
    text: 人皆衣褐捆屨織席以爲食
  - page: 181
    col: 10
    role: z
    text: 衣去聲捆音閫○神農炎帝神農氏
  - page: 181
    col: 11
    role: z
    text: 始爲耒耜教民稼穡者也爲其言者
  - page: 181
    col: 12
    role: z
    text: 史遷所謂農家者流也許姓行名也
  - page: 181
    col: 13
    role: z
    text: 踵門足至門也仁政上章所言井地
  - page: 181
    col: 14
    role: z
    text: 之法也廛民所居也氓野人之稱褐
  - page: 181
    col: 15
    role: z
    text: 毛布賤者之服也捆扣㧻之欲其堅
  - page: 181
    col: 16
    role: z
    text: 也以爲食賣以供食也○程子曰許
  - page: 182
    col: 1
    role: z
    text: 行所謂神農之言乃後世稱述上古
  - page: 182
    col: 2
    role: z
    text: 之事失其義理者耳猶陰陽醫方稱
  - page: 182
    col: 3
    role: z
    text: 黃帝之說也
  - page: 182
    col: 4
    role: j
    text: 陳良之徒陳相與其弟辛負耒耜而自
  - page: 182
    col: 5
    role: j
    text: 宋之滕曰聞君行聖人之政是亦聖人
  - page: 182
    col: 6
    role: j
    text: 也願爲聖人氓
  - page: 182
    col: 7
    role: z
    text: 陳良楚之儒者耜所以起土耒其柄
  - page: 182
    col: 8
    role: z
    text: 也
  - page: 182
    col: 9
    role: j
    text: 陳相見許行而大悅盡棄其學而學焉
  - page: 182
    col: 10
    role: j
    text: 陳相見孟子道許行之言曰滕君則誠
  - page: 182
    col: 11
    role: j
    text: 賢君也雖然未聞道也賢者與民並耕
  - page: 182
    col: 12
    role: j
    text: 而食饔飧而治今也滕有倉廩府庫則
  - page: 182
    col: 13
    role: j
    text: 是厲民而以自養也惡得賢
  - page: 182
    col: 14
    role: z
    text: 饔音雍飧音孫惡平聲○饔飧熟食
  - page: 182
    col: 15
    role: z
    text: 也朝曰饔夕曰飧言當自炊爨以爲
  - page: 182
    col: 16
    role: z
    text: 食而兼治民事也厲病也許行此言
  - page: 183
    col: 1
    role: j
    text: 蓋欲陰壞孟子分別君子野人之法
  - page: 183
    col: 2
    role: j
    text: 孟子曰許子必種粟而後食乎曰然許
  - page: 183
    col: 3
    role: j
    text: 子必織布而後衣乎曰否許子衣褐許
  - page: 183
    col: 4
    role: j
    text: 子冠乎曰冠曰奚冠曰冠素曰自織之
  - page: 183
    col: 5
    role: j
    text: 與曰否以粟易之曰許子奚爲不自織
  - page: 183
    col: 6
    role: j
    text: 曰害於耕曰許子以釜甑爨以鐵耕乎
  - page: 183
    col: 7
    role: j
    text: 曰然自爲之與曰否以粟易之
  - page: 183
    col: 8
    role: z
    text: 衣去聲與平聲○釜所以煑甑所以
  - page: 183
    col: 9
    role: j
    text: 炊爨然火也鐵耜屬也此語八反皆
  - page: 183
    col: 10
    role: z
    text: 孟子問而陳相對也
  - page: 183
    col: 11
    role: j
    text: 以粟易械器者不爲厲陶冶陶冶亦以
  - page: 183
    col: 12
    role: j
    text: 其械器易粟者豈爲厲農夫哉且許子
  - page: 183
    col: 13
    role: j
    text: 何不爲陶冶舎皆取諸其宫中而用之
  - page: 183
    col: 14
    role: j
    text: 何爲紛紛然與百工交易何許子之不
  - page: 183
    col: 15
    role: j
    text: 憚煩曰百工之事固不可耕且爲也
  - page: 183
    col: 16
    role: z
    text: 舎去聲○此孟子言而陳相對也械
  - page: 184
    col: 1
    role: z
    text: 器釜甑之屬也陶爲甑者冶爲釜鐵
  - page: 184
    col: 2
    role: z
    text: 者舎止也或讀屬上句舎謂作陶冶
  - page: 184
    col: 3
    role: z
    text: 之處也
  - page: 184
    col: 4
    role: j
    text: 然則治天下獨可耕且爲與有大人之
  - page: 184
    col: 5
    role: j
    text: 事有小民之事且一人之身而百工之
  - page: 184
    col: 6
    role: j
    text: 所爲備如必自爲而後用之是率天下
  - page: 184
    col: 7
    role: j
    text: 而路也故曰或勞心或勞力勞心者治
  - page: 184
    col: 8
    role: j
    text: 人勞力者治於人治於人者食人治人
  - page: 184
    col: 9
    role: j
    text: 者食於人天下之通義也
  - page: 184
    col: 10
    role: z
    text: 與平聲食音嗣○此以下皆孟子言
  - page: 184
    col: 11
    role: z
    text: 也路謂奔走道路無時休息也治於
  - page: 184
    col: 12
    role: z
    text: 人者見治於人也食人者出賦稅以
  - page: 184
    col: 13
    role: z
    text: 給公上也食於人者見食於人也此
  - page: 184
    col: 14
    role: z
    text: 四句皆古語而孟子引之也君子無
  - page: 184
    col: 15
    role: z
    text: 小人則飢小人無君子則亂以此相
  - page: 184
    col: 16
    role: z
    text: 易正猶農夫陶冶以粟與械器相易
  - page: 185
    col: 1
    role: z
    text: 乃所以相濟而非所以相病也治天
  - page: 185
    col: 2
    role: z
    text: 下者豈必耕且爲哉
  - page: 185
    col: 3
    role: j
    text: 當堯之時天下猶未平洪水橫流氾濫
  - page: 185
    col: 4
    role: j
    text: 於天下草木暢茂禽獸繁殖五穀不登
  - page: 185
    col: 5
    role: j
    text: 禽獸偪人獸蹄鳥跡之道交於中國堯
  - page: 185
    col: 6
    role: j
    text: 獨憂之舉舜而敷治焉舜使益掌火益
  - page: 185
    col: 7
    role: j
    text: 烈山澤而焚之禽獸逃匿禹疏九河瀹
  - page: 185
    col: 8
    role: j
    text: 濟漯而注諸海決汝漢排淮泗而注之
  - page: 185
    col: 9
    role: j
    text: 江然後中國可得而食也當是時也禹
  - page: 185
    col: 10
    role: j
    text: 八年於外三過其門而不入雖欲耕得
  - page: 185
    col: 11
    role: j
    text: 乎
  - page: 185
    col: 12
    role: z
    text: 瀹音藥濟子禮反漯佗合反○天下
  - page: 185
    col: 13
    role: z
    text: 猶未平者洪荒之世生民之害多矣
  - page: 185
    col: 14
    role: z
    text: 聖人迭興漸次除治至此尙未盡平
  - page: 185
    col: 15
    role: z
    text: 也洪大也橫流不由其道而散溢妄
  - page: 185
    col: 16
    role: z
    text: 行也氾濫橫流之貌暢茂長盛也繁
  - page: 186
    col: 1
    role: z
    text: 殖衆多也五穀稻黍稷麥菽也登成
  - page: 186
    col: 2
    role: z
    text: 熟也道路也獸蹄鳥跡交於中國言
  - page: 186
    col: 3
    role: z
    text: 禽獸多也敷布也益舜臣名烈熾也
  - page: 186
    col: 4
    role: z
    text: 禽獸逃匿然後禹得施治水之功䟽
  - page: 186
    col: 5
    role: z
    text: 通也分也九河曰徒駭曰太史曰馬
  - page: 186
    col: 6
    role: z
    text: 頰曰覆釜曰胡蘇曰簡曰潔曰鉤盤
  - page: 186
    col: 7
    role: z
    text: 曰鬲津瀹亦䟽通之意濟漯二水名
  - page: 186
    col: 8
    role: z
    text: 決排皆去其壅塞也汝漢淮泗亦皆
  - page: 186
    col: 9
    role: z
    text: 水名也據禹貢及今水路惟漢水入
  - page: 186
    col: 10
    role: z
    text: 江耳汝泗則入淮而淮自入海此謂
  - page: 186
    col: 11
    role: z
    text: 四水皆入于江記者之誤也
  - page: 186
    col: 12
    role: j
    text: 后稷教民稼穡樹藝五穀五穀熟而民
  - page: 186
    col: 13
    role: j
    text: 人育人之有道也飽食煖衣逸居而無
  - page: 186
    col: 14
    role: j
    text: 教則近於禽獸聖人有憂之使契爲司
  - page: 186
    col: 15
    role: j
    text: 徒教以人倫父子有親君臣有義夫婦
  - page: 186
    col: 16
    role: j
    text: 有別長㓜有序朋友有信放勲曰勞之
  - page: 187
    col: 1
    role: j
    text: 來之匡之直之輔之翼之使自得之又
  - page: 187
    col: 2
    role: j
    text: 從而振德之聖人之憂民如此而暇耕
  - page: 187
    col: 3
    role: j
    text: 乎
  - page: 187
    col: 4
    role: j
    text: 契音薛別彼列反長放皆上聲勞來
  - page: 187
    col: 5
    role: j
    text: 皆去聲○言水土平然後得以教稼
  - page: 187
    col: 6
    role: j
    text: 穡衣食足然後得以施教化后稷官
  - page: 187
    col: 7
    role: j
    text: 名棄為之然言教民則亦非並耕矣
  - page: 187
    col: 8
    role: j
    text: 樹亦種也藝殖也契亦舜臣名也司
  - page: 187
    col: 9
    role: j
    text: 徒官名也人之有道言其皆有秉彝
  - page: 187
    col: 10
    role: j
    text: 之性也然無教則亦放逸怠惰而失
  - page: 187
    col: 11
    role: j
    text: 之故聖人設官而教以人倫亦因其
  - page: 187
    col: 12
    role: j
    text: 固有者而道之耳書曰天叙五典勅
  - page: 187
    col: 13
    role: j
    text: 我五典五惇哉此之謂也放勳本史
  - page: 187
    col: 14
    role: j
    text: 臣贊堯之辭孟子因以為堯號也德
  - page: 187
    col: 15
    role: j
    text: 猶惠也堯言勞者勞之來者來之邪
  - page: 187
    col: 16
    role: j
    text: 者正之枉者直之輔以立之翼以行
  - page: 188
    col: 1
    role: z
    text: 之使自得其性矣又從而提撕警覺
  - page: 188
    col: 2
    role: z
    text: 以加惠焉不使其放逸怠惰而或失
  - page: 188
    col: 3
    role: z
    text: 之蓋命契之辭也
  - page: 188
    col: 4
    role: j
    text: 堯以不得舜為己憂舜以不得禹皋陶
  - page: 188
    col: 5
    role: j
    text: 為己憂夫以百畝之不易為己憂者農
  - page: 188
    col: 6
    role: j
    text: 夫也
  - page: 188
    col: 7
    role: z
    text: 夫音扶易去聲○易治也堯舜之憂
  - page: 188
    col: 8
    role: z
    text: 民非事事而憂之也急先務而已所
  - page: 188
    col: 9
    role: z
    text: 以憂民者其大如此則不惟不暇耕
  - page: 188
    col: 10
    role: z
    text: 而亦不必耕矣
  - page: 188
    col: 11
    role: j
    text: 分人以財謂之惠教人以善謂之忠為
  - page: 188
    col: 12
    role: j
    text: 天下得人者謂之仁是故以天下與人
  - page: 188
    col: 13
    role: j
    text: 易為天下得人難
  - page: 188
    col: 14
    role: z
    text: 為易並去聲○分人以財小惠而已
  - page: 188
    col: 15
    role: z
    text: 教人以善雖有愛民之實然其所及
  - page: 188
    col: 16
    role: z
    text: 亦有限而難久惟若堯之得舜舜之
  - page: 189
    col: 1
    role: z
    text: 得禹皋陶乃所謂爲天下得人者而
  - page: 189
    col: 2
    role: z
    text: 其恩惠廣大教化無窮矣此其所以
  - page: 189
    col: 3
    role: z
    text: 爲仁也
  - page: 189
    col: 4
    role: j
    text: 孔子曰大哉堯之爲君惟天爲大惟堯
  - page: 189
    col: 5
    role: j
    text: 則之蕩蕩乎民無能名焉君哉舜也巍
  - page: 189
    col: 6
    role: j
    text: 巍乎有天下而不與焉堯舜之治天下
  - page: 189
    col: 7
    role: j
    text: 豈無所用其心哉亦不用於耕耳
  - page: 189
    col: 8
    role: z
    text: 與去聲○則法也蕩蕩廣大之貌君
  - page: 189
    col: 9
    role: z
    text: 哉言盡君道也巍巍髙大之貌不與
  - page: 189
    col: 10
    role: z
    text: 猶曰不相關言其不以位爲樂也
  - page: 189
    col: 11
    role: j
    text: 吾聞用夏變夷者未聞變於夷者也陳
  - page: 189
    col: 12
    role: j
    text: 良楚産也悅周公仲尼之道北學於中
  - page: 189
    col: 13
    role: j
    text: 國北方之學者未能或之先也彼所謂
  - page: 189
    col: 14
    role: j
    text: 豪傑之士也子之兄弟事之數十年師
  - page: 189
    col: 15
    role: j
    text: 死而遂倍之
  - page: 189
    col: 16
    role: z
    text: 此以下責陳相倍師而學許行也夏
  - page: 190
    col: 1
    role: z
    text: 諸夏禮義之教也變夷變化蠻夷之
  - page: 190
    col: 2
    role: z
    text: 人也變於夷反見變化於蠻夷之人
  - page: 190
    col: 3
    role: z
    text: 也產生也陳良生於楚在中國之南
  - page: 190
    col: 4
    role: z
    text: 故北遊而學於中國也先過也豪傑
  - page: 190
    col: 5
    role: z
    text: 才德出衆之稱言其能自拔於流俗
  - page: 190
    col: 6
    role: z
    text: 也倍與背同言陳良用夏變夷陳相
  - page: 190
    col: 7
    role: z
    text: 變於夷也
  - page: 190
    col: 8
    role: j
    text: 昔者孔子没三年之外門人治任將歸
  - page: 190
    col: 9
    role: j
    text: 入揖於子貢相嚮而哭皆失聲然後歸
  - page: 190
    col: 10
    role: j
    text: 子貢反築室於場獨居三年然後歸他
  - page: 190
    col: 11
    role: j
    text: 日子夏子張子游以有若似聖人欲以
  - page: 190
    col: 12
    role: j
    text: 所事孔子事之彊曾子曾子曰不可江
  - page: 190
    col: 13
    role: j
    text: 漢以濯之秋陽以暴之皜皜乎不可尚
  - page: 190
    col: 14
    role: j
    text: 已
  - page: 190
    col: 15
    role: z
    text: 任平聲彊上聲暴蒲木反皜音杲○
  - page: 190
    col: 16
    role: z
    text: 三年古者爲師心喪三年若喪父而
  - page: 191
    col: 1
    role: z
    text: 無服也任檐也場冢上之壇場也有
  - page: 191
    col: 2
    role: z
    text: 若似聖人蓋其言行氣象有似之者
  - page: 191
    col: 3
    role: z
    text: 如檀弓所記子游謂有若之言似夫
  - page: 191
    col: 4
    role: z
    text: 子之類是也所事孔子所以事夫子
  - page: 191
    col: 5
    role: z
    text: 之禮也江漢水多言濯之潔也秋日
  - page: 191
    col: 6
    role: z
    text: 燥烈言暴之乾也皜皜潔白貌尚加
  - page: 191
    col: 7
    role: z
    text: 也言夫子道德明著光輝潔白非有
  - page: 191
    col: 8
    role: z
    text: 若所能彷彿也或曰此三語者孟子
  - page: 191
    col: 9
    role: z
    text: 賛美曽子之辭也
  - page: 191
    col: 10
    role: j
    text: 今也南蠻鴃舌之人非先王之道子倍
  - page: 191
    col: 11
    role: j
    text: 子之師而學之亦異於曽子矣
  - page: 191
    col: 12
    role: j
    text: 鴃亦作鵙古役反。鴃博勞也惡聲
  - page: 191
    col: 13
    role: z
    text: 之鳥南蠻之聲似之指許行也
  - page: 191
    col: 14
    role: j
    text: 吾聞出於幽谷遷于喬木者未聞下喬
  - page: 191
    col: 15
    role: j
    text: 木而入於幽谷者
  - page: 191
    col: 16
    role: z
    text: 小雅伐木之詩云伐木丁丁鳥鳴嚶
  - page: 192
    col: 1
    role: z
    text: 嚶出自幽谷遷于喬木
  - page: 192
    col: 2
    role: j
    text: 魯頌曰戎狄是膺荆舒是懲周公方且
  - page: 192
    col: 3
    role: j
    text: 膺之子是之學亦為不善變矣
  - page: 192
    col: 4
    role: z
    text: 魯頌閟宮之篇也膺擊也荆楚本號
  - page: 192
    col: 5
    role: z
    text: 也舒國名近楚者也懲艾也按今此
  - page: 192
    col: 6
    role: z
    text: 詩為僖公之頌而孟子以周公言之
  - page: 192
    col: 7
    role: z
    text: 亦斷章取義也
  - page: 192
    col: 8
    role: j
    text: 從許子之道則市賈不貳國中無偽雖
  - page: 192
    col: 9
    role: j
    text: 使五尺之童適市莫之或欺布帛長短
  - page: 192
    col: 10
    role: j
    text: 同則賈相若麻縷絲絮輕重同則賈相
  - page: 192
    col: 11
    role: j
    text: 若五穀多寡同則賈相若屨大小同則
  - page: 192
    col: 12
    role: j
    text: 賈相若
  - page: 192
    col: 13
    role: z
    text: 賈音價下同○陳相又言許子之道
  - page: 192
    col: 14
    role: z
    text: 如此蓋神農始為市井故許行又託
  - page: 192
    col: 15
    role: z
    text: 於神農而有是說也五尺之童言幼
  - page: 192
    col: 16
    role: z
    text: 小無知也許行欲使市中所粥之物
  - page: 193
    col: 1
    role: z
    text: 皆不論精粗美惡但以長短輕重多
  - page: 193
    col: 2
    role: z
    text: 寡大小爲價也
  - page: 193
    col: 3
    role: j
    text: 曰夫物之不齊物之情也或相倍蓰或
  - page: 193
    col: 4
    role: j
    text: 相什伯或相千萬子比而同之是亂天
  - page: 193
    col: 5
    role: j
    text: 下也巨屨小屨同賈人豈爲之哉從許
  - page: 193
    col: 6
    role: j
    text: 子之道相率而爲僞者也惡能治國家
  - page: 193
    col: 7
    role: z
    text: 夫音扶蓰音師又山綺反比必二反
  - page: 193
    col: 8
    role: z
    text: 惡平聲○倍一倍也蓰五倍也什伯
  - page: 193
    col: 9
    role: z
    text: 千萬皆倍數也比次也孟子言物之
  - page: 193
    col: 10
    role: z
    text: 不齊乃其自然之理其有精粗猶其
  - page: 193
    col: 11
    role: z
    text: 有大小也若大屨小屨同價則人豈
  - page: 193
    col: 12
    role: z
    text: 肯爲其大者哉今不論精粗使之同
  - page: 193
    col: 13
    role: z
    text: 價是使天下之人皆不肯爲其精者
  - page: 193
    col: 14
    role: z
    text: 而競爲濫惡之物以相欺耳
  - page: 193
    col: 15
    role: j
    text: 墨者夷之因徐辟而求見孟子孟子曰
  - page: 193
    col: 16
    role: j
    text: 吾固願見今吾尚病病愈我且往見夷
  - page: 194
    col: 1
    role: j
    text: 子不來
  - page: 194
    col: 2
    role: z
    text: 辟音璧又音闢○墨者治墨翟道
  - page: 194
    col: 3
    role: z
    text: 者夷姓之名徐辟孟子弟子孟子稱
  - page: 194
    col: 4
    role: z
    text: 疾疑亦託辭以觀其意之誠否
  - page: 194
    col: 5
    role: j
    text: 他日又求見孟子孟子曰吾今則可以
  - page: 194
    col: 6
    role: j
    text: 見矣不直則道不見我且直之吾聞夷
  - page: 194
    col: 7
    role: j
    text: 子墨者墨之治喪也以薄爲其道也夷
  - page: 194
    col: 8
    role: j
    text: 子思以易天下豈以爲非是而不貴也
  - page: 194
    col: 9
    role: j
    text: 然而夷子葬其親厚則是以所賤事親
  - page: 194
    col: 10
    role: j
    text: 也
  - page: 194
    col: 11
    role: z
    text: 不見之見音現○又求見則其意已
  - page: 194
    col: 12
    role: z
    text: 誠矣故因徐辟以質之如此直盡言
  - page: 194
    col: 13
    role: z
    text: 以相正也莊子曰墨子生不歌死無
  - page: 194
    col: 14
    role: z
    text: 服桐棺三寸而無椁是墨之治喪以
  - page: 194
    col: 15
    role: z
    text: 薄爲道也易天下謂移易天下之風
  - page: 194
    col: 16
    role: z
    text: 俗也夷子學於墨氏而不從其教其
  - page: 195
    col: 1
    role: z
    text: 心必有所不安者故孟子因以誥之
  - page: 195
    col: 2
    role: j
    text: 徐子以告夷子夷子曰儒者之道古之
  - page: 195
    col: 3
    role: j
    text: 人若保赤子此言何謂也之則以爲愛
  - page: 195
    col: 4
    role: j
    text: 無差等施由親始徐子以告孟子孟子
  - page: 195
    col: 5
    role: j
    text: 曰夫夷子信以爲人之親其兄之子爲
  - page: 195
    col: 6
    role: j
    text: 若親其鄰之赤子乎彼有取爾也赤子
  - page: 195
    col: 7
    role: j
    text: 匍匐將入井非赤子之罪也且天之生
  - page: 195
    col: 8
    role: j
    text: 物也使之一本而夷子二本故也
  - page: 195
    col: 9
    role: z
    text: 夫音扶下同匍音蒲匍匍北反○若
  - page: 195
    col: 10
    role: z
    text: 保赤子周書康誥篇文此儒者之言
  - page: 195
    col: 11
    role: z
    text: 也夷子引之善欲援儒而入於墨以
  - page: 195
    col: 12
    role: z
    text: 拒孟子之非己又曰愛無差等施由
  - page: 195
    col: 13
    role: z
    text: 親始則推墨而附於儒以釋己所以
  - page: 195
    col: 14
    role: z
    text: 厚葬其親之意皆所謂遁辭也孟子
  - page: 195
    col: 15
    role: z
    text: 言人之愛其兄子與鄰之子本有差
  - page: 195
    col: 16
    role: z
    text: 等書之取譬本爲小民無知而犯法
  - page: 196
    col: 1
    role: j
    text: 如赤子無知而入井耳且人物之生
  - page: 196
    col: 2
    role: j
    text: 必各本於父母而無二乃自然之理
  - page: 196
    col: 3
    role: j
    text: 若天使之然也故其愛由此立而推
  - page: 196
    col: 4
    role: j
    text: 以及人自有差等今如夷子之言則
  - page: 196
    col: 5
    role: j
    text: 是視其父母本無異於路人但其施
  - page: 196
    col: 6
    role: j
    text: 之之序姑自此始耳非二本而何哉
  - page: 196
    col: 7
    role: j
    text: 然其於先後之間猶知所擇則又其
  - page: 196
    col: 8
    role: j
    text: 本心之明有終不得而息者此其所
  - page: 196
    col: 9
    role: z
    text: 以卒能受命而自覺其非也
  - page: 196
    col: 10
    role: j
    text: 蓋上世嘗有不葬其親者其親死則舉
  - page: 196
    col: 11
    role: j
    text: 而委之於壑他日過之狐狸食之蠅蚋
  - page: 196
    col: 12
    role: j
    text: 姑嘬之其顙有泚睨而不視夫泚也非
  - page: 196
    col: 13
    role: j
    text: 為人泚中心達於面目蓋歸反虆梩而
  - page: 196
    col: 14
    role: j
    text: 掩之掩之誠是也則孝子仁人之掩其
  - page: 196
    col: 15
    role: j
    text: 親亦必有道矣
  - page: 196
    col: 16
    role: z
    text: 蚋音汭嘬楚怪反泚七禮反睨音詣
  - page: 197
    col: 1
    role: j
    text: 爲去聲纍力追反梩力知反○因夷
  - page: 197
    col: 2
    role: j
    text: 子厚葬其親而言此以深明一本之
  - page: 197
    col: 3
    role: j
    text: 意上世謂太古也委棄也壑山水所
  - page: 197
    col: 4
    role: j
    text: 趨也蚋蚊屬姑語助聲或曰螻蛄也
  - page: 197
    col: 5
    role: j
    text: 嘬攢共食之也顙額也泚然汗出之
  - page: 197
    col: 6
    role: j
    text: 貌睨邪視也視正視也不能不視而
  - page: 197
    col: 7
    role: j
    text: 又不忍正視哀痛迫切不能爲心之
  - page: 197
    col: 8
    role: j
    text: 甚也非爲人泚言非爲他人見之而
  - page: 197
    col: 9
    role: j
    text: 然也所謂一本者於此見之尤爲親
  - page: 197
    col: 10
    role: j
    text: 切蓋惟至親故如此在他人則雖有
  - page: 197
    col: 11
    role: j
    text: 不忍之心而其哀痛迫切不至若此
  - page: 197
    col: 12
    role: j
    text: 之甚矣反覆也纍土籠也梩土轝也
  - page: 197
    col: 13
    role: j
    text: 於是歸而掩覆其親之尸此葬埋之
  - page: 197
    col: 14
    role: j
    text: 禮所由起也此掩其親者若所當然
  - page: 197
    col: 15
    role: j
    text: 則孝子仁人所以掩其親者必有其
  - page: 197
    col: 16
    role: j
    text: 道而不以薄爲貴矣
  - page: 198
    col: 1
    role: j
    text: 徐子以告夷子夷子憮然爲間曰命之
  - page: 198
    col: 2
    role: j
    text: 矣
  - page: 198
    col: 3
    role: z
    text: 憮音武間如字○憮然茫然自失之
  - page: 198
    col: 4
    role: z
    text: 貌爲間者有頃之間也命猶教也言
  - page: 198
    col: 5
    role: z
    text: 孟子已教我矣蓋因其本心之明以
  - page: 198
    col: 6
    role: z
    text: 攻其所學之蔽是以吾之言易入而
  - page: 198
    col: 7
    role: z
    text: 彼之惑易解也
  - page: 198
    col: 8
    role: j
    text: 孟子卷第五
