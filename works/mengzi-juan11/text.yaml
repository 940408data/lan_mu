# 孟子注疏卷11（孫奭疏）：j 為經文＋漢趙岐注，z 為疏文。
sections:
  - id: juan11
    name: 正文
    blocks:
      - { type: z, text: "正义曰：此卷即赵注分上卷为下卷也，此卷中凡九章。一章言圣人由力，力有常也，贤者由巧，巧可增也，仲尼天高不可阶，它人丘陵犹可逾。二章言圣人制禄，上下差叙。三章言匹夫友贤，下之以德；三公友贤，授之以爵。四章言圣人忧民，乐行其道，不合则去，亦不淹久。五章言国有道则能者处卿相，国无道则圣人居乘田。六章言知贤之道，举之为上，养之为次，不举不养，贤恶肯归？七章言君子之志，志於行道，不得其礼，亦不苟往。八章言好高慕远，君子之道。九章言国须贤臣，必择忠良，亲近贵戚，或遭祸殃。凡此九章，合上卷九章，是万章有十八章矣。" }
      - { type: j, text: "孟子曰：“伯夷目不视恶色，耳不听恶声；非其君不事，非其民不使；治则进，乱则退。横政之所出，横民之所止，不忍居也。思与乡人处，如以朝衣朝冠坐於涂炭也。当纣之时，居北海之滨，以待天下之清也。故闻伯夷之风者，顽夫廉，懦夫有立志。（孟子反覆差伯夷、伊尹、柳下惠之德，以为足以配於圣人，故数章陈之，犹诗人有所诵述。至於数四，盖其留意者也。义见上篇矣。此复言不视恶色，谓行不正而有美色者，若夏姬之比也。耳不听恶声，谓郑声也。後世闻其风者，顽贪之夫，更思廉；懦弱之人，更思有立义之志也。）伊尹曰：‘何事非君？何使非民？’治亦进，乱亦进。曰：‘天之生斯民也，使先知觉後知，使先觉觉後觉。予，天民之先觉者也。予将以此道觉此民也。’思天下之民，匹夫匹妇有不与被尧、舜之泽者，如己推而内之沟中，其自任以天下之重也。（说与上同。）柳下惠不羞污君，不辞小官，进不隐贤，必以其道，遗佚而不怨，厄穷而不悯，与乡人处，由由然不忍去也。‘尔为尔，我为我，虽袒裼裸裎於我侧，尔焉能浼我哉？’故闻柳下惠之风者，鄙夫宽，薄夫敦。（鄙狭者更宽优，薄浅者更深厚。）孔子之去齐，接淅而行。去鲁，曰：‘迟迟吾行也，去父母国之道也。’可以速而速，可以久而久，可以处而处，可以仕而仕，孔子也。”（淅，渍米也。不及炊，避恶亟也。鲁，父母之国，迟迟不忍去也，是其道也。孔子，圣人，故能量时宜动中权也。）孟子曰：“伯夷，圣之清者也；伊尹，圣之任者也；柳下惠，圣之和者也；孔子，圣之时者也。孔子之谓集大成。集大成也者，金声而玉振之也。金声也者，始条理也。玉振之也者，终条理也。（伯夷清，伊尹任，柳下惠和，皆得圣人之道也。孔子时行则行，时止则止，孔子集先圣之大道，以成己之圣德者也，故能金声而玉振之。振，扬也。故如金音之有杀，振扬玉音终始如一也。始条理者，金从革，可始之使条理。终条理者，玉终其声而不细也，合三德而不挠也。）始条理者，智之事也。终条理者，圣之事也。（智者知理物，圣人终始同。）智，譬则巧也。圣，譬则力也。由射於百步之外也，其至，尔力也；其中，非尔力也。”（智，譬犹人之有技巧也，可学而益之。以圣，譬犹力之有多少，自有极限，不可强增。圣人受天性，可庶几而不可及也。夫射远而至，尔努力也，其中的者，尔之巧也。思改其手用巧意，乃能中也。）" }
      - { type: z, text: "“孟子曰伯夷”至“非尔力也”。○正义曰：此章指言圣人由力，力有常也；贤者由巧，巧可增也。仲尼天高，故不可阶，他人丘陵，丘陵犹可逾。所谓小同而大异者也。“孟子曰：伯夷目不视恶色，耳不听恶声”至“薄夫敦”，已说上篇详矣。此言不视恶色，不听恶声者，言伯夷清洁其身，不欲以乱色留於明，奸声留於聪也。於是使闻伯夷之清风者，顽贪之夫莫不变而为廉洁之人，懦弱之夫莫不变而为能有立其刚志也。闻下惠之和风者，莫不变鄙狭而为宽博，变浅薄而为敦厚也。“孔子之去齐”至“孔子也”，言孔子之去齐急速，但渍米不及炊而即行，以其避恶，故如是也；去鲁国，则曰迟迟而不忍行去，此为去父母国之道也。所谓父母国者，孔子所生於鲁国，故为父母之国也。大抵孔子量时变，其去国可以速则速，故於齐不待炊而行也；可以久而未去则久之，故於鲁国所以迟迟吾行也；可以处此国则处之，故未尝有三年之淹；可以仕於其君则仕之，故有行可、际可、公养之仕也：凡如此者，故曰孔子如是也。“孟子曰”至“非尔力也”，孟子又曰伯夷之行，为圣人之清者也，是其不以物污其己，而成其行於清也；伊尹之行，为圣人之任者也，是其乐於自为，而以天下之重自任也；柳下惠之行，为圣人之和者也，是其不以己异於物，而无有所择也。唯孔子者，独为圣人之时者也，是其所行之行，惟时变，可以清则清，可以任则任，可以和则和，不特倚於一偏也，故谓之孔子为集其大成、得纯全之行者也。闰集大成，即集伯夷、伊尹、下惠三圣之道，是为大成耳。如所谓危邦不入，乱邦不居，是孔子之清，而不至伯夷一於清也；佛召而欲往，是孔子之任，而不至伊尹一於任也；南子见所不见，阳货敬所不敬，是孔子之和，而不至下惠一於和也。然则伯夷、伊尹、下惠，是皆止於一偏，未得其大全也，而孟子亦皆取之为圣者，盖伯夷、伊尹、下惠各承其时之有弊，不得不如是而救也。以孔子观之，又能集此三圣而为大成者也。方伯夷之时，天下多进寡退，而伯夷所以如是洁己不殉。方伊尹之时，天下多退而寡进，而伊尹所以如是而以天下为己任。方下惠之时，天下多洁己而异俗，而下惠所以如是俯身而同众。故伯夷承伊尹之弊而救之清，下惠承伯夷之弊而救之和。孔子又承而集之，遂为大成者。谁谓伯夷、伊尹、下惠救时弊如此，可不谓为圣者耶？虽然，孟子取为三圣，其言又不无意於其间也。言伯夷但圣之清者也，以其取清而言之矣；伊尹但圣之任者也，以其取任而言之矣；下惠但圣之和者也，以其取和而言之矣；孔子之圣则以时也，其时为言，以谓时然则然，无可无不可，故谓之集其大成，又非止於一偏而已。故孟子於下故取金声玉振而喻之也，言集大成者，如金声而玉振之者也。金声者，是其始条理也，言金声始则隆而终则杀者也，如伯夷能清而不能任，伊尹能任而不能和，下惠能和而不能清者也；玉振之者，是其终条理也，言玉振则终始如一而无隆杀者也，如孔子能清、能任、能和者也，所以合金声而玉振之而言也，以其孔子其始如金声之隆，而能清、能任、能和，其终且如玉振无隆杀，又能清而且任、任而且和、和而且清，有始有终，如一者也。然则孟子於此，且合金声玉振之条理而喻归于孔子，是其宜也。然而始条理者，是为智者之事也；终条理者，是为圣人之事也。以智者而譬之，则若人之有巧也’以圣人而譬之，则若人之有力也。如射於百步之外，为远其射至於百步之外，是人之力也；其所以中的者，非人之力也，以其人之巧耳。此譬伯夷、伊尹、下惠但如射於百步之外，能至而不能中；孔子於射能至，又能中者也。盖能至，亦射之善者矣；而能至能中者，又备其善者也；能清、能任、能和，是圣人之善者也；能时，又备其圣人之善者也。此一段则孟子总意而解其始终条理也，而始终条理又解金声玉振者也，金声玉振又喻孔子集三圣之大成者耳。盖条理者，条则有数而不紊，理则有分而不可易也。○注“夏姬郑声”。○正义曰：云“夏姬”者，按《史记》云：“夏姬，夏徵舒之母，陈大夫御叔之妻，三为王后，二为夫人，纳之者无不迷惑。陈灵公与大夫孔宁仪共通於夏姬，废失朝政。徵舒遂杀灵公及申公盖，将夏姬来奔於晋，晋人杀巫臣，又娶夏姬。”凡此是也。云“郑声”者，已说於《公孙丑》篇。○注“伯夷清、伊尹任、柳下惠和，孔子时行则行，时止则止”者。○正义曰：已说於上篇。" }
      - { type: j, text: "北宫问曰：“周室班爵禄也，如之何？”（北宫，卫人。班，列也。问周家班列爵禄，等差谓何？）孟子曰：“其详不可得闻也。诸侯恶其害己也，而皆去其籍，然而轲也尝闻其略也。（详，悉也。不可得备知也。诸侯欲恣行，憎恶其法度妨害己之所为，故灭去典籍。今《周礼》司禄之官无其职，是则诸侯皆去之，故使不复存也。轲，孟子名也。略，粗也。言尝闻其大纲如此矣。今考之《礼记·王制》则合矣。）天子一位，公一位，侯一位，伯一位，子、男同一位，凡五等也。（公谓上公九命及二王後也。自天子以下，列尊卑之位，凡五等。）君一位，卿一位，大夫一位，上士一位，中士一位，下士一位，凡六等。（诸侯法天子，臣名亦有此六等，从君下至於士。）天子之制，地方千里，公侯皆方百里，伯七十里，子、男五十里，凡四等。不能五十里，不达於天子，附於诸侯，曰附庸。（凡此四等，制地之等差也。天子封畿千里，诸侯方百里，象雷震也。小者不能特达於天子，因大国以名通，曰附庸也。）天子之卿受地视侯，大夫受地视伯，元士受地视子、男。（视，比也。天子之卿、大夫、士所受采地之制。）大国地方百里，君十卿禄，卿禄四大夫，大夫倍上士，上士倍中士，中士倍下士，下士与庶人在官者同禄，禄足以代其耕也。（公、侯之国为大国，卿禄居於君禄十分之一也，大夫禄居於卿禄四分之一也，上士之禄居大夫禄二分之一也，中士、下士转相倍。庶人在官者，未命为士者也，其禄比上农夫。士不得耕，以禄代耕也。）次国地方七十里，君十卿禄，卿禄三大夫，大夫倍上士，上士倍中士，中士倍下士，下士与庶人在官者同禄，禄足以代其耕也。（伯为次国，大夫禄居卿禄三分之一也。）小国地方五十里，君十卿禄，卿禄二大夫，大夫倍上士，上士倍中士，中士倍下士，下士与庶人在官者同禄，禄足以代其耕也。（子、男为小国，大夫禄居卿禄二分之一也。）耕者之所获，一夫百亩，百亩之粪，上农夫食九人，上次食八人，中食七人，中次食六人，下食五人。庶人在官者，其禄以是为差。”（获，得也。一夫一妇佃田百亩，百亩之田加之以粪，是为上农夫，其所得足以食九口。庶人在官者，食禄之等差，由农夫有上、中、下之次，亦有此五等，若今之斗食、佐史、除吏也。）" }
      - { type: z, text: "“北宫”至“为差”。○正义曰：此章指言圣人制禄，上下差叙，贵有常尊，贱有等威。诸侯僭越，灭籍从私。孟子略托言其大纲，以答北宫之问。“北宫问曰：周室班爵禄也，如之何”者，北宫问孟子，以谓周家班列其爵禄，高下等差，如之何也？“孟子曰：其详不可得而闻也”至“尝闻其略也”者，孟子答之，谓其详悉则不可得而闻，诸侯放恣，憎恶其法度有妨於己之所为，尽灭去其典籍，故今不复有，然而轲也但尝闻得其大纲也。“天子一位，公一位，侯一位，伯一位，子、男同一位，凡五等”至“上次食八人，中食七人，中次食六人，下食五人。庶人在官者，其禄以是为差”者，此皆孟子言周室班爵禄之大纲也。云“天子一位”至“凡五等也”者，盖父天母地，而为之子者，天子也；爵位盛大，以无私为德者，公也；斥候於外，以君人为德者，侯也；体仁足以长人者，伯也；子，字也，字，养也，而其德足以养人者，故曰子也；男，任也，任，安也，而其德足以安人者，故曰男也。自天子至於子、男，皆有君道，故尊卑之位凡有五等，然公、侯、伯、子、男皆臣乎天子，而爵位之列自天子始，所以与天子同其班。“君一位，卿一位”至“凡六等”者，盖出命足以正众者，君也；知进退而其道上达者，卿也；智足以帅人者，大夫也；才足以事人者，士也。自君以下至於士，皆有臣道焉，故尊卑之位凡六等，然卿、大夫、士皆臣乎国君，而爵位之列自国君，所以与国君同其班。凡此者，是皆孟子所谓班君臣之爵也。“天子之制地方千里”至“附庸”者，此孟子言土地之等差也。故天子尊於公、侯，故制地方广千里，盖不方千里，则无以待天下之诸侯故也；公、侯卑於天子，故地广百里，盖不广百里则无以守宗庙之典籍故也；伯又卑於公、侯，子、男又卑於伯，故其地之广狭亦莫不有七十里、五十里之差。凡是四等，而其德不足以合瑞於天子，而其地又不足以敌广於公、侯，其势又难以特达於天子者，故因大国以名通，则谓之附庸。“天子之卿受地视侯，大夫受地视伯，元士受地视子男”者，此言天子之卿、大夫、士所受采地之制也。《周礼》上公九命，侯、伯七命，子、男五命，王之三公八命，其卿六命，其大夫四命。郑玄云“王之上士三命”，则元士者即上士也。盖以六命之卿，其所受之地则视七命之诸侯；以四命之大夫，则所受之地而视七命之伯；以二命之元士，其所受之地则视五命之子、男故也。“大国地方百里，君十卿禄”至“禄足以代其耕也”者，盖公、侯之国是为大国者也，大国之地方百里，而国君之禄则十倍於卿，而卿之禄是为居於君禄十分之一也；卿所居之禄又四倍於大夫，而大夫之禄是为居卿禄四分之一也；大夫所受之地则一倍於上士，而上士之禄是为居大夫二分之一也；中士、下士，亦皆转为相倍。而下士与庶人在官者同禄者，盖庶人在官者，是未命为士者也，谓府史之属，官长所除，不命於天子、国君者也。其禄比於上农夫，然而不耕之者，盖以士劳力於事人，不为无庸也，而禄且足以代其耕矣。“次国地方七十里，君十卿禄”至“禄足以代其耕也”者，盖伯之国是为次国者也，君、卿、大夫、士之禄亦同大国之君、卿、大夫、士之禄相为倍差，其下士与庶人在官者，亦以禄足以代其耕矣。“小国地方五十里，君十卿禄”至“禄足以代其耕也”者，盖子、男者是为小国者也，君、卿、大夫、士之禄亦相为倍差，与上同，其禄足以代其耕亦然。“耕者之所获，一夫百亩，百亩之粪，上农夫食九人，上次食八人，中食七人，中次食六人，下食五人。庶人在官者，其禄以是为差”者，盖耕者所得，一夫一妇佃田百亩，而百亩之田，加之以粪，是为上农夫，其所得之足以食养其九口，上次则食八人，中食七人，中次则食六人，下食五人。其庶人在官者，食禄之等差，亦如农夫有上、中、下之次，有此五等矣，若今之斗食佐史、属吏是也。《王制》云：“王者之制禄、爵、公、侯、伯、子、男凡五等。诸侯之上大夫卿、下大夫、上士、中士、下士，凡五等。”其不及天子，又无六等，殆与孟子不合者，盖以孟子所言则周制，而《王制》所言则夏、商之制也。《王制》云：“公、侯田方百里，伯七十里，子、男五十里，不能五十里者，不合於天子，附於诸侯，曰附庸。”而孟子不言田而言地者，盖禄以田为主，《王制》主於分田以制禄，孟子主於制地以分国，而国以地为主，此所以有田、地之异也。《王制》云：“天子之三公田视公侯，天子之卿视伯，天子之大夫视子、男，天子之元士视附庸。”而孟子则言天子之卿受地视伯，元士受地视子男，其视不同者，亦以周制与夏、商之制不同也。孟子所以不言天子之公受地视侯，而特言其卿者，盖卿与公同其所受，是所谓举卑以见尊之意也。此又孟子所云班臣之禄也。○注“详，悉也”至“则其合也”。○正义曰：云“诸侯欲恣行，憎恶其法妨害己之所为，故灭去典籍。今《周礼》司录之官无其职，是则诸侯皆去之，故使不复有也”者，盖自列国之後，先王之法浸坏，上无道揆，下无法守，而诸侯类皆以强吞弱，以大并小，而齐、鲁之始封俭於百里，至孟子时，齐方百里者十，鲁方百里者五，此诸侯所以恶其籍害己，而去司禄之职也。是时周室班爵禄之道，孟子所以不得闻其详，特以大略而答北宫之问也。云“今考《王制》则合也”者，盖自《王制》推之，亦有不合者矣，已说於前欤。○注“公谓上公九命及二王後也”至“凡五等”。○正义曰：《周礼·典命职》云“上公九命为伯”，郑氏云“上公谓王之三公，有德者加命为二伯，二王之後，亦为上公”是也。○注“凡此四等，土地之等差也”至“曰附庸”。○正义曰：云“天子封畿千里，诸侯方百里，象雷震也”者，按《周官》建王国，制其畿方千里，诸侯方百里；象雷震者，按《周易》云“震惊百里，惊远而惧迩”是也。《王制》云：“天子之田方千里，公、侯田方百里，伯七十里，子、男五十里。不能五十里者，不合於天子，附於诸侯，曰附庸。”郑氏云：“象日月之大，亦取略同也。天子方千里，所谓县内以禄公、卿、大夫、元士。”自公侯百里至子男五十里，郑氏注云：“星辰之大小也。附庸者，小城曰附庸，附庸者以国事附於大国，未能以其名通也。”○注“视，比也”至“制也”。○正义曰：《王制》云：“天子之三公之田视公、侯，天子之卿视伯，天子之大夫视子、男，天子之元士视附庸。”郑注云：“视犹比也。元，善也。善士谓命士也。此殷所因夏爵三等之制也。殷有鬼侯、梅伯。春秋变周之文，从殷之质，合伯、子、男以为一，则殷爵三等者，公、侯、伯也，异畿内谓之子。周武王初定天下，更立五等之爵，增以子、男，而犹因殷之地，以九州之界尚狭也。周公摄政，致太平，斥大九州之界，制礼，成武王之意，封王者之後为公及有功之诸侯，大者地方五百里，其次侯四百里，其次伯三百里，其次子二百里，其次男百里，所因殷之诸侯亦以功黜陟之，其不合者，皆益之地为百里焉。是有周世有爵尊而国小，爵卑而国大者，唯天子畿内，不用以禄群臣，不主为治民也。”《周礼·大司职》云：“以土圭之法求地中，以建王国，制其畿方千里。诸公之地，封疆方五百里，其食者半。诸侯之地，封疆方四百里，其食者参之一。诸伯之地，封疆方三百里，其食者参之一。诸子之地，封疆方二百里，其食者四之一。诸男之地，封疆方百里，其食者四之一。”是又郑注本此而言也。云“天子之卿、大夫、士所受采地之制”者，按《《周礼》》云：“凡造都鄙，制其地域而封沟之。以其室数制之，不易之地家百亩，一易之地家二百亩，再易之地家三百亩。”又注云：“都鄙者，王子弟公卿大夫采地，其界曰都，鄙，所居也。”《王制》曰：“天子之县内方百里之国七，七十里之国二十有一，五十里之国六十有三。”此盖变时采地之数，周未闻矣。是宜孟子但言其大纲，而其详所以未之闻也。○注“公侯之国为大国”至“代耕也”，又自“伯为次国”至“三分之一也”，又“子男为小国”至“二分之一也”。○正义曰：《王制》云：“凡四海之内九州，州方千里，建百里之国三十，七十里之国六十，五十里之国百有二十，凡二百一十国。名山大泽不以封，其馀以为附庸间田。八州，州二百一十国。”郑氏云：“立大国三十，十三公也。立次国六十，十六卿也。立小国百三十，十二少卿也。名山大泽不以封，与民同财，不得障管，亦赋税矣。此大界方三千里，三三而九，方千里者九也。其一为县内，馀八，各立一州，此殷制也。周公制礼，九州大界方七千里，七七四十九，方千里者四十九也。其一为畿内，馀四十八。八州各有方千里者六，设法一州封地方五百里者不过四，谓之大国；又封方四百里者不过六，又封方三百里不过十一，谓之次国；又封方二百里者不过二十五，及馀方百里者谓之小国。盈上四等之数，并四十六，一州二百一十国，则馀方百里者百六十四也。凡处地方千里者五，方百里者五十九，其馀方百里者四十一，附庸地也。”又云：“大国三卿，皆命於天子，下大夫五人，上士二十七人；次国三卿，二卿命於天子，一卿命於其君，下大夫五人，上士二十七人；小国二卿，皆命於其君，下大夫五人，上士二十七人。”然而先王之制，列爵惟五，分土惟三，此所以有公、侯、伯、子、男，而又有大国、次国、小国之殊制尔。故三十里之遂，二十里之郊，九里之城，三里之宫，是大国之制如此也。自二十里之遂，九里之郊，三里之城，一里之宫，是次国之制如此也。自九里之遂，三里之郊，一里之城，以城为宫，是小国之制如此也。大抵上綦於大国，下綦於小国，其地虽广狭不同，其禄虽多寡有异，及君之所受，均十卿之禄而已。自卿以下至於士，其禄各相杀，以一此卿禄居於君禄十分之一，大夫居於卿禄四分之一，上士居大夫禄二分之一；次国大夫居卿禄三分之一；小国大夫居卿禄二分之一也。其间《王制》、《周官》与《孟子》虽有不合者，亦於前言其大概也。○注“获，得也。一夫一妇，佃田百亩”至“若今之斗食佐史除吏也”。○正义曰：古者制民之产，以六尺为步，步百为亩，亩百为夫。此耕者之所得，所以一夫受田百亩也。《王制》云：“农夫百亩。百亩之分，上农夫食九人，其次食八人，其次食七人，其次食六人。下农夫食五人。”郑氏以谓农夫皆受田於公，田肥瘠有五等，收入不同。其说是矣。然孟子言上农夫食九人，上次食八人，中食七人，中次食六人，下食五人。凡三等，又与此异。盖以《周礼》以一易、再易、不易之地言之，所以有三等。《孟子》、《王制》论所入食人之众寡，此所以有五等也。《周礼》上地家七人，而孟子言上地、上农夫食九人，上次食八人者，盖上农夫足以食九人，而其家七人者，亦得以受之，此民所以有馀财。自七人以下，则不得以受上地矣。先王之制禄，诸侯之下士视上农夫，禄足以代其耕，则庶人在官者与下士同禄。其多寡之数，一视五等农夫为差，而班禄亦不外此。" }
      - { type: j, text: "万章问曰：“敢问友？”（问朋友之道也。）孟子曰：“不挟长，不挟贵，不挟兄弟而友。友也者，友其德也，不可以有挟也。（长，年长。贵，贵势。兄弟，兄弟有富贵者。不挟是乃为友，谓相友以德也。）孟献子，百乘之家也，有友五人焉：乐正裘、牧仲，其三人则予忘之矣。献子之与此五人者友也，无献子之家者也。此五人者亦有献子之家，则不与之友矣。（献子，鲁卿，孟氏也，有百乘之赋。乐正裘、牧仲其五人者，皆贤人无位者也。此五人者，自有献子之家富贵，而复有德，不肯与献子友也。献子以其富贵下此五人，五人屈礼而就之也。）非惟百乘之家为然也，虽小国之君亦有之。费惠公曰：‘吾於子思则师之矣，吾於颜般则友之矣。王顺、长息，则事我者也。’（小国之君，若费惠公者也。王顺、长息，德不能见师友，故曰事我者也。）非惟小国之君为然也，虽大国之君亦有之。晋平公於亥唐也，入云则入，坐云则坐，食云则食。虽蔬食菜羹，未尝不饱，盖不敢不饱也。然终於此而已矣。（大国之君，如晋平公者也。亥唐，晋贤人也，隐居陋巷，晋平公常往造之，亥唐言入，平公乃入，言坐乃坐，言食乃食也。蔬食，粝食也。不敢不饱，敬贤也。终於此，平公但以此礼下之而已。）弗与共天位也，弗与治天职也，弗与食天禄也。士之尊贤者也，非王公尊贤也。（位、职、禄，皆天之所以授贤者，而平公不与亥唐共之，而但卑身下之，是乃匹夫尊贤者之礼耳。王公尊贤，当与共天职矣。）舜尚见帝，帝馆甥于贰室，亦飨舜，迭为宾主，是天子而友匹夫也。（尚，上也。舜在畎亩之时，尧友礼之。舜上见尧，尧舍之於贰室。贰室，副宫也。尧亦就享舜之所设，更迭为宾主。礼谓妻父曰外舅，谓我舅者吾谓之甥。尧以女妻舜，故谓舜甥。卒与之天位，是天子而友匹夫也。）用下敬上谓之贵贵，用上敬下谓之尊贤，贵贵尊贤其义一也。”（下敬上，臣恭於君也；上敬下，君礼於臣也：皆礼所尚，故云其义一也。”）" }
      - { type: z, text: "“万章问曰”至“其义一也”。○正义曰：此章指言匹夫友贤，下之以德，王公友贤，授之以爵，大圣之行，千载为法者也。“万章问曰：敢问友”者，是万章问孟子为朋友之道如何也。“孟子曰”至“挟也”，孟子答之，以谓不挟戴年长，又不挟戴其贵势，抑又不挟戴其兄弟有富贵者，而友朋友也，是友其德也，以其不可以有挟戴其势而友之也。“孟献子，百乘之家也”至“其义一也”，孟子又言孟献子，鲁卿，是有兵车百乘之家者也，有友五人焉，其二人曰乐正裘、牧仲，其三人则我忘其姓名矣。夫献子之与此五人者，是友也，以此五人无献子之家富贵也。此五人如亦有献子之家富贵，则不与献子为之友矣。无他，以其两贵不能以相下故也。献子与之为友，则以贵下贱故也，所谓好人之善而忘己之势者也。今五人与献子为友者，亦所谓乐己之道而忘人之势者也。非惟百乘之家为然也，虽为小国之君亦有如是也。费惠公乃小国之君也，尝云我於子思则师事之矣，我於颜般则友之矣，王顺、长息，则不足为之师友，但事我者也。非惟小国之君为如是也，虽大国之君亦有如是矣。晋平公者乃大国之君也，尝往於亥唐之家，亥唐言入则入其门，言坐则坐，言食则食，虽蔬食菜羹之薄，亦未尝不饱也，盖为不敢不饱也。然终於此以礼下之而已矣，而平公弗能与之共天位也，又弗能与之治天职也，抑又不与食其天禄也。且职、位、禄皆云天者，盖此三者皆天之所以授於人也。故云国君之位必曰天位，云职必曰天职，云禄则曰天禄耳。言平公以身礼之，是士者之尊贤矣，非所谓王公大人尊贤者也，以其王公大人尊贤，则当与共天位也，不当以身礼下之也。夫舜於往日上见於尧帝，尧乃馆舍之於副宫，尧亦就副宫而飨舜所设，更为之宾主，然卒禅其天位，此天子之友其匹夫也。云匹夫者，盖舜本则耕於历山，但侧微之贱者也，故云匹夫。云甥者，盖尧为舜之外舅，尧所以谓舜为甥也。且用下敬上，如舜之上见於尧，故钦尧为友，是谓贵其贵；用上敬下，如尧馆于贰室，故钦舜而与之为友，是谓尊其贤。贵贵尊贤，礼皆所尚，故曰其义则一而无二也。盖献子有五人者，《左传》赵简子云“鲁孟献子有斗臣五人”，岂谓此五人者乎？然亦名字则未之详。○注“妻父曰外舅”，○正义曰：此盖案《礼记》而云也。" }
      - { type: j, text: "万章曰：“敢问交际何心也？”（际，接也。问交接道当执何心为可也。）孟子曰：“恭也。”（当执恭敬为心。）曰：“之之为不恭，何哉？”（万章问不受尊者礼，谓之不恭，何然也？）曰：“尊者赐之。曰：其所取之者，义乎？不义乎？而後受之，以是为不恭，故弗也。”（孟子曰，今尊者赐己，己问其所取此物宁以义乎？得无不义，乃後受之，以是为不恭。故不当问尊者不义而之也。）曰：“请无以辞之，以心之。曰：其取诸民之不义也。而以他辞无受，不可乎？”（万章曰：请无正以不义之辞也，心知其不义，以他辞让，无受之，不可邪？）曰：“其交也以道，其接也以礼，斯孔子受之矣。”（孟子言其来交求己以道理，其接待己有礼者，若斯，孔子受之矣。盖言其可受之也。）万章曰：“今有御人於国门之外者，其交也以道，其馈也以礼，斯可受御与？”（御人，以兵御人而夺之货，如是而以礼道来交接己，斯可受乎？）曰：“不可。《康诰》曰：‘杀越人于货，闵不畏死，凡民罔不憝。’是不待教而诛者也。殷受夏，周受殷，所不辞也。於今为烈，如之何其受之？”（孟子曰不可受也。《康诰》、《尚书》篇名，周公戒成王，康叔封。越，于，皆於也。杀於人，取於货，闵然不知畏死者，憝，杀也，凡民无不得杀之者也。若此之恶，不待君之教命，遭人得讨之，三代相传以此法，不须辞问也，於今为烈，烈，明法。如之何受其馈也。）曰：“今之诸侯取之於民也，犹御也。苟善其礼际矣，斯君子受之，敢问何说也？”（万章曰：今之诸侯赋税於民，不由其道，履亩强求，犹御人也。欲善其礼以接君子，君子欲受之何说也？君子谓孟子也。）曰：“子以为有王者作，将比今之诸侯而诛之乎？其教之不改而後诛之乎？夫谓非其有而取之者，盗也，充类至，义之尽也。孔子之仕於鲁也，鲁人猎较，孔子亦猎较。猎较犹可，而况受其赐乎？”（孟子谓万章曰：子以为後如有圣人兴作，将比地尽诛今之诸侯乎？将教之，其不改者乃诛之乎？言必教之，诛其不改者也。殷之衰，亦犹周之末。武王不尽诛殷之诸侯，灭国五十而已。知後王者亦不尽诛也。谓非其有而窃取之者为盗。充，满。至，甚也。满其类大过至者，但义尽耳，未为盗也。诸侯本当税民之类者，今大尽耳，亦不可比於御。孔子随鲁人之猎较。猎较者，田猎相较，夺禽兽得之以祭，时俗所尚，以为吉祥。孔子不违而从之，所以小同於世也。猎较尚犹可为，况受其赐而不可也！）曰：“然则孔子之仕也，非事道与？”（万章问孔子之仕，非欲事行其道与？）曰：“事道也。”（孟子曰：孔子所仕者，欲事行其道。）“事道奚猎较也？”（万章曰：孔子欲事道，如何可猎较也？）曰：“孔子先簿正祭器，不以四方之食供簿正。”（孟子曰：孔子仕於衰世，不可卒暴改戾，故以渐正之，先为簿书以正其宗庙祭祀之器，即其旧礼，取备於国中，不以四方珍食供其所簿正之器，度珍食难常有，乏绝则为不敬，故猎较以祭也。）曰：“奚不去也。”（万章曰：孔子不得行道，何为不去也？）曰：“为之兆也。兆足以行矣，而不行，而後去，是以未尝有所终三年淹也。（兆，始也。孔子每仕，常为之正本造始，欲以次治之，而不见用，占其事始而退。足以行之矣而君不行也，然後则孔子去矣。终者，竟也。孔子未尝得竟事一国也三年淹留而不去者也。）孔子有见行可之仕，有际可之仕，有公养之仕。於季桓子，见行可之仕也。於卫灵公，际可之仕也。於卫孝公，公养之仕也。”（行可，冀可行道也。鲁卿季桓子秉国之政，孔子仕之，冀可得因之行道也。际，接也。卫灵公接遇孔子以礼，故见之也。卫孝公以国君养贤者之礼养孔子，孔子故留宿以答之也。）" }
      - { type: z, text: "“万章问曰”至“公养之仕也”。○正义曰：此章指言圣人忧民，乐行其道，苟善辞命，不忍逆距，不合则去，亦不淹久。盖仲尼行止之节者也。“万章问曰：敢问交际何心也”，万章问孟子，凡交接之际，当执何心而交接也。“孟子曰恭也”，孟子答之曰：但当执恭敬之心也。“曰：却之却之为不恭，何哉”，万章又问孟子，言却去之、却去之而不受，是为不恭敬。然也何哉者？是何然也。“曰：尊者赐之，曰其所取之者义乎”至“故弗却也”，孟子又答之，言尊长赐己，己乃问之曰：其所取此物宁以义取之乎？不以义取之乎？乃方受之，以此是为不恭敬也。但当受之，不当问尊长所取不义，则却去之也。谓宜受之，故不可却去也。“曰请无以辞却之”至“不可乎”，万章又问曰：如尊长赐己之物，其所取之不义，但请无以直言不义之辞却之，但以己心却去而不受，为取民之不义也，然後饰以他辞而不受，不可乎？故以此问。“孟子曰：其交也以道，其接也以礼，斯孔子受之矣”，孟子又答之，曰：其以物来交己以道理，其接待於己亦以礼度，此孔子受之矣。言其如此交接，则可受之也。“万章曰：今有御人於国门之外”至“斯可以受御与”，万章又问曰：假使今有人以兵御人於国门之外者，而夺得其货物，其来交己也以道理交之，其馈赐己也亦以礼度，如此诚可以受御夺之物与？“曰不可”至“如之何其受之”，孟子又答之，以为不可受也。且《尚书·康诰》之篇有云，杀於人而取于货，[B139]然强暴，为不畏死者，虽凡之众民，无有不憝恶之也。如此者，是可不待教而後诛杀之者也。言即杀之，更不必待其教命之後也。如若殷受夏之天下，周受殷之天下，所不辞也，无他，以其夏桀、殷纣无道义，当伐之而受其天下也。於今乃窃比圣王之迹，而遂以杀人而受物於人，为之暴烈，如之何可受之？言不可受此之馈也。“曰今之诸侯”至“敢问何也”，万章又曰：今之诸侯赋税於民，不以其道，亦如御人而夺货者也，苟善其礼以交接之，斯君子且受之，敢问何谓也？“曰子以为有王者作”至“而况受其赐乎”，孟子又谓万章曰：子今以为後如有王者兴作，将比今之诸侯无道而尽诛之乎？其待教之，其不改者乃诛之乎？言必待教之不改者也，夫所谓非其所有而取之者，是为盗也。如充取民赋税之类至大过者，但义之尽耳，亦未为盗者也。故曰：夫所谓非其有而取之者，是为盗也，充类至，义之尽也。然孟子必以此言者，其意盖谓今之诸侯虽取於民不以义，然而受教之，犹庶几能省刑罚，薄税敛，为善政也，此固在所教而不诛，今万章乃曰今之诸侯犹御也，殊不知与御人之元恶、不待教而诛者异矣。然则万章之所问，乃云此者，是其缪也，宜孟子答之此耳。孔子之仕於鲁国，鲁国之人田猎较夺禽兽，孔子亦田猎较夺其禽兽。然而猎较而孔子犹尚可为，而况受其赐而乃为不可也。言此者，但有道理以交接，则可受而不可辞却也。“曰：然则孔子之仕也，非事道与”，万章又问孟子，言如此则是孔子之为仕也，非欲事其道与？“曰事道也”，孟子答之，以为孔子之事是欲行其道也。“事道奚猎较也”，万章又问曰：孔子既以欲行其道，何以田猎较夺禽兽也。“曰：孔子先簿正祭器，不以四方之食供簿正”，孟子又答之曰：孔子所以猎较者，以其孔子仕於衰世，不可以卒暴更变，故先且即簿书而正宗庙之祭器，既欲正其祭器，又不以四方之珍食供簿正祭器，所以猎较而供簿正耳。然而孔子必以猎较禽兽而供簿正祭器，且不以四方之珍食者，但为四方珍食，难常有之，恐後人无珍食以供之，故又绝其祭之礼，所以如此也。“曰奚不去也”，万章又问曰：言孔子既仕於衰世，不可卒暴更变以行其道，何为而不去而莫仕也？“曰为之兆也”至“淹也”者，孟子又答之曰：孔子所以不去而且猎较者，以其假为行道之始也。兆，始也。然假猎较为兆，既足以行之矣，而君乃不行之者，孔子然後去之也。如此，是以孔子历聘，未尝有於一国得终三年淹留而不去也。是其时君不行孔子之兆故也。如得行其兆，孔子遂大行其道，以辅佐其君，虽留而弗去可也。“孔子有见行可之仕”至“公养之仕也”，孟子又因而言孔子有见行可之仕，有际可之仕，有公养之仕。如於鲁卿季桓子再三时受，乃语鲁君，为周道游，往观终日，怠於政事，子路曰：“夫子可以行矣。”孔子曰：“鲁今且郊，如致番乎大夫，则吾犹可以止。”桓子卒受女乐，又不致番俎於大夫，孔子遂行宿于鲁之南屯地，桓子喟然叹曰：“夫子罪我以群婢故也。凡此是孔子有见行可之仕也，以其见既行之後，乃且叹曰：夫子罪我以群婢故也。孰谓非於季桓子有见行可之仕乎？於卫灵公，是际可之仕也。今按《世家》又云：“卫灵公闻孔子来，喜郊迎，问伐蒲之事。後又问陈於孔子，孔子曰俎豆之事，则尝闻之矣，军旅之事，未之学也。”凡此是孔子有际可之仕也，以其接遇孔子，而孔子因言之此，又孰谓非於卫灵公有际可之仕乎？於卫孝公为公养之仕者，《史记》诸家於卫国并无孝公，所谓公养之仕，但言以养贤之礼养孔子也。今按《史记》纪孔子，则亦卫灵公也，据《春秋年表》云：“卫灵公即位三十八年，孔子来，禄之。”又案《孔子世家》云：“孔子卫，卫灵公问孔子：‘居鲁得禄几何？’对曰：‘奉粟六万。’卫人亦致粟六万。居顷之，或谮孔子，孔子遂去卫。”是则孔子於卫灵公有公养之仕也。如卫孝公，则吾亦未能信，以其无以按据故也。以时推之，则孔子於季桓子受女乐之时，则灵公即位之三十七年也，鲁定公十二年也。定公十三年，是卫灵公即位之三十八年也。问陈之时，则即位之四十三年，卫灵公是年卒。後之学者，宜精究之。○注“《康诰》、《尚书》篇名。周公戒成王，封康叔”。○正义曰：案《尚书》云：成王既伐管叔、蔡叔，以殷馀民封康叔，作《康诰》。孔安国传云：命康叔之诰。康，圻内国名。叔，封字也。云“杀越人于货，[B139]不畏死，凡民罔弗憝”，注云：杀人颠越人，於是以取货利。[B139]，强也。自强为恶，而不畏死，人无不恶之者。言当消绝之。释云：越，于也，於也。○注“诸侯灭国五十”。○正义曰：此盖据经之文也，已在《滕文公》之篇说焉。○注“鲁卿季桓子秉国之政”至“答之”。○正义曰：《左传》定公五年夏，“季平子卒，桓子嗣立”。杜预云：“季孙斯也。”云“卫孝公养贤者之礼养孔子”，不知何据。" }
      - { type: j, text: "孟子曰：“仕非为贫也，而有时乎为贫。娶妻非为养也，而有时乎为养。（仕本为行道济民也，而有以居贫亲老而仕者。娶妻本为继嗣也，而有以亲执釜灶，不择妻而娶者。）为贫者，辞尊居卑，辞富居贫。（为贫之仕，当让高显之位，无求重禄。）辞尊居卑，辞富居贫，恶乎宜乎？抱关击柝。（辞尊富者，安所宜乎？宜居抱关击柝监门之职也。柝，门关之木也。击，椎之也。或曰柝，行夜所击木也。《传》曰：“鲁击柝，闻於邾。”）孔子尝为委吏矣，曰：‘会计当而已矣。’尝为乘田矣，曰：‘牛羊茁壮长而已矣。’位卑而言高，罪也。立乎人之本朝而道不行，耻也。”（孔子尝以贫而禄仕，委吏，主委积仓庾之吏也，不失会计当直其多少而已。乘田，苑囿之吏也，主六畜之刍牧者也，牛羊茁壮肥好长大而已。茁，生长貌也，《诗》云：“彼茁者葭。”位卑不得高言豫朝事，故但称职而已。立本朝，大道当行，不行为己之耻。是以君子禄仕者，不处大位。）" }
      - { type: z, text: "“孟子曰”至“耻也”。○正义曰：此章指言国有道则能者处卿相，国无道则圣人居乘田。量时安卑，不受言责，独善其身者也。“孟子曰：仕非为贫”至“道不行，耻也”，孟子言为仕者，志在欲行其道，以济生民，非为家贫乏财，故为仕也。然而家贫亲老而仕者，亦有时而为贫也。娶妻志在为继嗣以传业，非为其欲奉养其己，故娶妻也。然而有以亲执釜爨，不择妻而娶者，是娶妻亦有时乎为养也。然以孟子於此乃言娶妻之谓者，盖妻亦臣之喻，故因言为仕，而带言之也。所以於下文不复叙之，而独继之以为贫而言也。言为贫者不苟贪，但免朝不食、夕不食、饥饿不能出门户足矣，高爵非所慕也，故辞其尊而处卑；重禄非所慕也，故辞其富而处贫。凡此者，以其爵有尊、卑，禄有多、寡故然也，以其禄之少者，则又以贫言之，非所谓家贫之贫也。此又知孟子立言之法也。言辞尊而处卑，辞富而居贫，是安所而宜之乎？言抱关击柝者是也。抱关击柝之职，乃监门守御之吏也，击柝者，所以击关门之木以警寇也。以其是爵之卑、禄之贫者也，故曰恶乎宜乎，抱关击柝。又引孔子而证之，言孔子尝以贫而禄仕，但为委吏，以掌仓庾。又尝为乘田之吏，以掌苑囿，主刍牧也。为委吏，则曰会计当料量多少斯已矣，未尝侵官犯分也；为乘田之助吏，则曰牛羊茁壮肥长斯已矣，又未尝侵官犯分也：是皆但为称职耳。孟子於此，遂因言之曰：如位处卑，而言在高位者，是罪之极也；如立乎人之朝，而道不得行者，君子之所耻辱也。孔子曰“不在其位，不谋其政”，又曰“邦无道，富且贵焉，耻也”，皆此之谓也。○注“亲老而仕”至“娶者”。○正义曰：传云“任重而道远者，不择地而息，家贫亲老者，不择官而仕”，是其意欤。○注“传曰鲁击柝闻於邾”。○正义曰：已说在叙篇。○注“孔子”至“道也”。○正义曰：案《孔子世家》云：“孔子贫且贱，尝为委氏吏而料量平，尝为司职吏而畜息蕃田，是为司空，已而去鲁。”是其事也。云“《诗》云：彼茁者葭”，注云：“茁，出也。葭，芦也。”笺云：“言芦之始出者。”" }
      - { type: j, text: "万章曰：“士之不托诸侯，何也？”（托，寄也。谓若寄公食禄於所托之国也。）孟子曰：“不敢也。诸侯失国而後托於诸侯，礼也。士之托於诸侯，非礼也。（谓士位轻，本非诸侯敌体，故不敢比失国诸侯得为寄公也。）万章曰：“君馈之粟，则受之乎？”（士穷而无禄，君馈之粟，则可受之乎？）曰：“受之。”（孟子曰受之也。）“受之何义也？”（万章曰：受粟何义也？）曰：“君之於氓也，固周之。”（氓，民也。孟子曰：君之于民，固当周其穷乏，况於士乎？）曰：“周之则受，赐之则不受，何也？”（万章言士穷居周之则受赐之则不受何也。周者，谓周急？贫民之常料也。赐者，谓礼赐横加也。）曰：“不敢也。”（孟子曰士不敢受赐。）曰：“敢问其不敢何也？”（万章问何为不敢。）曰：“抱关击柝者，皆有常职以食於上，无常职而赐於上者，以为不恭也。”（孟子曰：有职事者，可食於上禄。士不仕，自以不任职事而空受赐，为不恭，故不受也。）曰：“君馈之则受之，不识可常继乎？”（万章曰：君礼馈贤臣，贤臣受之，不知可继续而常来致之乎？将当辄更以君命将之也。）曰：“缪公之於子思也，亟问，亟馈鼎肉。子思不悦，於卒也，В使者出诸大门之外，北面稽首再拜而不受，曰：‘今而後知君之犬马畜。’盖自是台无馈也。（孟子曰：鲁缪公时尊礼子思。数问。数馈鼎肉．子思以君命烦，故不悦也。於卒者，末後复来时也。В，麾也。麾使者出大门之外，再拜叩头不受，曰今而後知君以犬马畜。，子思名也。责君之不优以不烦，而但数与之食物，若养犬马。台，贱官，主使令者。《传》曰仆臣台从是之。後台不持馈来，缪公愠也。愠，恨也。）悦贤不能举，又不能养也，可谓悦贤乎？”（孟子讥缪公之虽欲有悦贤之意，而不能举用使行其道，又不能优养终竟之，岂可谓悦贤也。）曰：“敢问国君欲养君子，如何斯可谓养矣？”（万章问国君养贤之法也。）曰：“以君命将之，再拜稽首而受。其後廪人继粟，庖人继肉，不以君命将之。子思以为鼎肉使己仆仆尔，亟拜也，非养君子之道也。（将者，行也。孟子曰：始以君命行，礼拜受之。其後仓廪之吏继其粟，将尽复送，厨宰之人日送其肉，不复以君命者，欲使贤者不答以敬，所以优之也。子思所以非缪公者，以为鼎肉使己数拜故也。仆仆，烦猥貌，谓其不得养君子之道也。）尧之於舜也，使其子九男事之，二女女焉，百官牛羊仓廪备，以养舜於畎亩之中，後举而加诸上位，故曰王公之尊贤者也。”（尧之於舜如是，是王公尊贤之道也。九男以下，已说於上篇。上位，尊帝位也。）" }
      - { type: z, text: "“万章曰”至“尊贤者也”。○正义曰：此章指言知贤之道，举之为上，养之为次。不举不养，贤恶肯归？是以孟子上陈尧、舜之大法，下剌缪公之不弘者也。“万章曰：士之不托诸侯何也”，万章问孟子，言士之不寄公食禄於诸侯，是如之何也？“孟子曰：不敢也”至“非礼也”者，孟子答之，以为士之所以不托於诸侯者，以其不敢也，如诸侯失去其国，然後托於诸侯，是礼也；士之托於诸侯，非是礼也。以其诸侯失国，不得继世，而托食禄於诸侯，则所托之诸侯不敢臣之也，以宾礼之而已，盖为诸侯，於诸侯有宾道焉。士之於诸侯，则臣道也，有臣之道，故不敢托也，如托於诸侯，则非礼也。“万章曰：君馈之粟，则受之乎”，万章又问孟子，士既穷而无禄，如国君馈赐之以粟，则可受之乎？“曰受之”，孟子以为可受之也。“受之何义也”，万章又问受之是何义也。“曰君之於氓也，固周之”，孟子又答云：君之於民，固当周其穷乏，况为士乎。“曰周之则受，赐之则不受，何也”，万章又问，谓国君周之则受之也，君所赐则不受，是如之何？“曰不敢也”，孟子又答之，以为是不敢也。“曰敢问其不敢何也”，万章又以此问之。“曰抱关击柝者”至“恭也”，孟子又答之曰：抱关击柝为监门之吏者，是皆有常职事，可以食於君也；如士者，是无常职事，若空见赐於君者，是以为不恭，故不敢受也。以其受与不受，特在义之而已。“曰君馈之则受之，不识可常继乎”，万章又问，以谓国君馈之以粟，则可以受之，不知可以常继续而馈之与。“曰缪公之於子思”至“可谓悦贤者乎”，孟子又答之，言鲁缪公尊於子思，数数问之，而又数数馈赐其鼎肉。子思以君命如是之烦，故愤而不喜悦。於卒末後复来馈之时，子思乃麾使者出诸大门之外，乡北稽首，再拜辞之而不受，曰：至今而後乃知鲁君以犬马畜养其也。，曾子自称其名也。盖自子思如是辞之之後，仆臣台从此不持馈来也。孟子於此，又因而讥缪公既能悦其子思之贤，而不能举而用之，又不能以禄养之，可谓为能悦贤者乎？言不可为悦贤之君也。“曰敢问国君欲养君子，如何斯可谓养矣”，万章又问国君今欲养贤，如之何可以谓之养也。“曰以君命将之”至“王公之尊贤者也”，孟子答之，以为始以君命赐行，礼拜而受之，其後仓庾之吏继其粟，将尽又送馈之，厨宰之人继送其肉而不绝，又不以君命，欲使贤者不答以敬，以是为优其养。所以非缪公以为鼎肉，使己数数拜而仆仆然也。仆仆即烦猥貌也。如此，是非所以养贤之道也。且尧帝於舜也，乃使九男事之，二女女焉，女者以女嫁人谓之女也。又以百官牛羊仓廪备，以养舜於畎亩侧微之中，後能举用而加诸帝位。如此，则为王公大人所以尊贤者也。孟子引此，所以讥缪公不能举用子思，徒使鼎肉有迫子思之烦猥也。抑又所以救时之弊者焉。○注“托，寄也，谓若寄公”。○正义曰：案《礼记·大丧服》云“君之丧未敛为寄公者”是也。○注“九男二女”。更不复说。" }
      - { type: j, text: "万章曰：“敢问不见诸侯，何义也？”（问诸侯聘请而夫子不见之，於义何取也。）孟子曰：“在国曰市井之臣，在野曰草莽之臣，皆谓庶人。庶人不传质为臣，不敢见於诸侯，礼也。”（在国谓都邑也，民会於市，故曰市井之臣。在野居之，曰草莽之臣。莽亦草也。庶，众也。庶众之人，未得为臣。传，执也。见君之质，执雉之属也。未为臣，则不敢见之礼也。）万章曰：“庶人召之役则往役，君欲见之，召之则不往见之，何也？”（庶人召使给役事，则往供役事，君召之见，不月往见，何也？）曰：“往役，义也。往见，不义也。且君之欲见之也，何为也哉？”（孟子曰：庶人法当给役，故往役，义也；庶人非臣也，不当见君，故往见，不义也。且君何为欲见而召之？）曰：“为其多闻也，为其贤也。”（万章曰：君以是欲见之也。）曰：“为其多闻也，则天子不召师，而况诸侯乎？为其贤也，则吾未闻欲见贤而召之也。（孟子曰：安有召师、召贤之礼，而可往见。）缪公亟见於子思，曰：‘古千乘之国以友士，何如？’子思不悦，曰：‘古之人有言曰：事之云乎？岂曰友之云乎？’子思之不悦也，岂不曰：‘以位，则子君也，我臣也，何敢与君友也？以德，则子事我者也，奚可以与我友？’千乘之君，求与之友而不可得也，而况可召与？（鲁缪公欲友子思，子思不悦，而称曰：古人曰见贤人当事之，岂云友之邪？孟子云：子思所以不悦者，岂不谓臣不可友君，弟子不可友师也。若子思之意，亦不可友，况乎可召之。）齐景公田，招虞人以旌，不至，将杀之。‘志士不忘在沟壑，勇士不忘丧其元’，孔子奚取焉？取非其招不往也。”（已说於上篇。）曰：“敢问招虞人何以？”（万章问招虞人当何用也。）曰：“以皮冠。庶人以旃，士以，大夫以旌。（孟子曰：招礼若是。皮冠，弁也。旃，通帛也，因章曰旃。，旌有铃者。旌，注旄首者者。）以大夫之招招虞人，虞人死不敢往。以士之招招庶人，庶人岂敢往哉？况乎以不贤人之招招贤人乎？（以贵者之招招贱人，贱人尚不敢往，况以不贤人之招招贤人乎？不贤之招，是不以礼者也。）欲见贤人而不以其道，犹欲其入而闭之门也。夫义，路也；礼，门也。惟君子能由是路，出入是门也。（欲人之入而闭其门，何得而入乎？闭门如闭礼也。）《诗》云：‘周道如，其直如矢。君子所履，小人所视。’”（《诗·小雅·大东》之篇。，平。矢，直。视，比也。周道平直，君子履直道，小人比而则之。以喻虞人能效君子守死善道也。）万章曰：“孔子君命召不俟驾而行，然则孔子非与？”（俟，待也。孔子不待驾而应君命也，孔子为之非与？）曰：“孔子当仕，有官职，而以其官召之也。”（孟子言孔子所以不待驾者，孔子当仕位，有官职之事，君以其官名召之，岂得不颠倒。《诗》云：“颠之倒之，自公召之。”不谓贤者无位而君欲召见也。）" }
      - { type: z, text: "“万章曰”至“召之也”。○正义曰：此章指言君子之志，志於行道，不得其礼，亦不苟往。于礼之可，伊尹三聘而后就汤。道之未洽，沮溺耦耕，接舆佯狂，岂可见也？“万章曰：敢问不见诸侯，何义也”，万章问孟子所以不见诸侯，其义谓何？“孟子曰：在国曰市井之臣”至“礼也”孟子答之，以谓凡在都邑谓之市井之臣，在郊野谓之草莽之臣，然总而言之，皆谓之众庶之人。如众庶之人未得传质为臣者，故不敢就见於君也，以其无礼也。传质者，所执其物以见君也。如公执桓圭，侯执信圭，伯执躬圭，子执璧，男执蒲璧。又诸侯世子执，孤执玄，附庸之君执黄，卿执羔，大夫执雁，士执雉，是所以为贽也。“万章曰：庶人召之役则往役，君欲见，召之则不往见之，何也”，万章又问孟子曰：庶人於君，召之给役，则庶人往就其役事，今君欲见，召之乃不往者，是如之何也？万章见齐王召孟子，孟子不往，所以有是问之。“曰：往役，义也。往见，不义也”，孟子答之曰：庶人往应其役，是其义当往也。以其庶人於君，其法当为之役故也。往而见君者，是不义也，以其庶人非臣也，义不当往见君故也。“且君之欲见之也者，何为也哉”，孟子又以此问万章，言且国君所欲见之者，何为也哉？“曰：为其多闻也，为其贤也”，万章答之曰：君之所以欲见之者，是为多闻，又为其贤有德也。“曰为其多闻也”至“而召之也”，孟子又曰：如是为其多闻也者，则虽天子，亦且不召其师，而况诸侯可召而见之乎？如是贤为有其德也，则我未曾闻知有欲见贤者而以召之也。“缪公亟见子思”至“不往也”，孟子又引缪公而证之，言鲁缪公数数见於子思，乃曰古者千乘之国君以友其士，何如？子思遂愠而不喜，曰：古之人有言曰：见贤人则当事矣，岂尝云友之乎？然而子思所以不悦者，其意岂不谓以位推之，则子是为君，尊矣，而我则臣下也，何敢与君为之交友也？以有德论之，则子事我，为子之师也，奚可以与我为友？是则千乘之国君求贤者与之为友，而尚且不可得也，而况诸侯於今可召贤者而见之乎？“齐景公”至“不往也”，说於上篇矣，此更不云。“曰敢问招虞人何以”，万章见孟子言齐景公招虞人之事，遂因问之，曰：招虞人当用何物而招之。“曰以皮冠，庶人以旃”至“贤人乎”，孟子以答之，曰招虞人当以皮弁而招之也，庶人则以通帛招之，士以，大夫以旌，如以大夫之旌招虞人，虞人虽死亦且不敢往应其招也，以其士之而招庶人，庶人岂敢往而应之哉？而况以不贤之招而招贤人乎。不贤之招，即不以礼之谓也。“欲见贤人而不以道”至“小人所视”，孟子又言今之诸侯欲见贤人而不以其道，是若欲人入其门而反闭其门也，如此，尚何可得而见之乎？夫义是若路也，礼若门也，惟君子之人能由行此义之路，出入此礼之门。上今乃反塞其义路，而闭其礼门，使君子何由而出入哉！此孟子亦即此谓今之诸侯欲见贤人，而乃欲召之，则贤尚可得而见邪？而《小雅·大东》之诗，有云周道平直如砥之平箭之直也，君子亦所常履行此平直之道，而为小人所常视而则法之矣。然以此证之者，盖谓贤人所以不往见於诸侯者，是所守以义，而为众人所矜式耳。“万章曰：孔子君命召不俟驾而行，然则孔子非与？”万章又问孟子，以谓孔子常於君命召，则不敢坐待驾而後行。如此，则孔子诚为非与？“曰：孔子当仕，有官职，而以其官召之也”，孟子又答之曰：孔子所以不俟驾而行者，以其当於为仕有官职，而国君以其官而召之也，岂得为非耶。○注“质，执雉之属”。○正义曰：己说於前矣。○注“孟子曰”至“首者”。○正义曰：案《士冠礼》注云：“皮弁以白鹿为之象，旧《礼图》云：以鹿皮浅毛黄白者为之，高尺二寸。今虞人以皮弁者，皮弁以田故也。”又案《周礼·司常职》云：“交龙为，通帛为旃，析羽为旌。”郑注云“通帛谓大赤，从周，正色，无饰，析羽，皆五采系之於旌之上，所谓注旄於首”是也。○注“《诗·小雅》”至“善道也”。○正义曰：此《诗》盖剌乱之诗也。谭国在东，其大夫作是诗，故云《大东》。注云：“如砥贡财，予均也；如矢赏罚，不偏也。”言君子皆法效，履而行之，其如砥矢之平直，小人又皆视之，共之无怨也。○注“孟子言孔子所以不待驾”至“岂可见也”。○正义曰：《语》云君命召，不俟驾而行。是时孔子为中都宰，以其有官职也。《诗》云“颠之倒之，自公召之”，此乃《国风·东方未明》之章文也。笺云：“群臣颠倒衣裳而朝，人又从君所来而召之也。”云“伊尹三聘而後就汤”，孟子云汤三使往聘之，是其文也。云“沮溺耦耕，接舆佯狂”，按《论语》云：“长沮、桀溺耦而耕。”郑注云：“长沮、桀溺，隐者也。耜广五寸，二耜为耦。”又云：“楚狂接舆歌而过孔子曰：凤兮凤兮。”盖楚狂接舆，是楚人，姓陆，名通，字接舆也。昭王时政令无常，乃被发佯狂，不仕，时人谓之楚狂也。赵注引而证其解。" }
      - { type: j, text: "孟子谓万章曰：“一乡之善士，斯友一乡之善士。一国之善士，斯友一国之善士。天下之善士，斯友天下之善士。（乡，乡人之善者。国，一国之善者。天下四海之内，各以大小来相友，自为畴匹也。）以友天下之善士为未足，又尚论古之人。颂其诗，读其书，不知其人可乎？是以论其世也，是尚友也。”（好善者以天下之善士为未足极其善道也。尚，上也。乃复上论古之人，颂其诗。诗歌国近故曰颂。读其书者，犹恐未知古人高下，故论其世以别之也。在三皇之世为上，在五帝之世为次，在三王之世为下，是为好上友之人也。）" }
      - { type: z, text: "“孟子”至“尚友也”。○正义曰：此章指言好高慕远，君子之道，虽各有伦，乐其崇茂，是以仲尼曰“毋友不如己者”，高山仰止，景行行止。“孟子谓万章曰”至“是尚友也”，孟子谓万章，言一乡之中有其善者，所友斯亦一乡之善士者也。一国之中有善士，所友者亦一国之善士者也。天下於四海之内，有其善士者，所友亦以天下之善士者也。如友天下之善士者为未足以极其善道，则又上论古之人，而颂歌其诗，看读其书，如此，不知其如是之人可以友也乎？然犹未知其人之可友也，抑又当论其人所居之世如何耳？能以此，乃是尚友之道也。孟子所以谓之以此者，盖欲教当时之人尚友也。孔子云“无友不如己者”，与其《诗》云“高山仰止，景行行止”，亦其意与。" }
      - { type: j, text: "齐宣王问卿。孟子曰：“王何卿之问也？”（王问何卿也。）王曰：“卿不同乎？”曰：“不同。有贵戚之卿，有异姓之卿。”（孟子曰：“卿不同，贵戚之卿谓内外亲族也，异姓之卿谓有德命为王卿也。）王曰：“请问贵戚之卿！”（问贵戚之卿如何。）曰：“君有大过则谏，反覆之而不听，则易位。”（孟子曰：贵戚之卿，反覆谏君，君不听，则欲易君之位，更立亲戚之贵者。）王勃然变乎色。（王闻此言，愠怒而惊惧，故勃然变色。）曰：“王勿异也。王问臣，臣不敢不以正对。”（孟子曰：王勿怪也。王问臣，臣不敢不以其正义对。）王色定，然後请问异姓之卿。（王意解，颜色定，复问异姓之卿如之何也。）曰：“君有过则谏，反覆之而不听，则去。”（孟子言异姓之卿谏君不从三而待放，遂不听之，则去而之他国也。）" }
      - { type: z, text: "“齐宣”至“则去”。○正义曰：此章指言国须贤臣，必择忠良，亲近贵戚，或遭殃祸。伊发有莘，为殷兴道，故云成汤立贤无方也。“齐宣王问卿”，是齐王问孟子为卿者如之何也。“孟子曰：王何卿之问”，孟子答之，以谓王问何卿也。“王曰：卿不同乎”，宣王见孟子以为问何卿，故问之曰：然是卿有不同而异之乎？“曰不同，有贵戚之卿，有异姓之卿”，孟子又答之，曰卿不同也，以其有贵戚内外亲族之卿，有异姓有贵之卿也。“王曰：请问贵戚之卿”，宣王又问贵戚之卿是如之何也。曰：君有过谬则谏诤，以至反覆数谏，君不听从，则欲更易君位，更立其君者也。“王勃然变乎色”，宣王闻此言，遂愤而惊恐，乃勃然变乎颜色。“曰：王勿异也，王问臣，臣不敢不以正对”，孟子又曰：王勿怪异我之言也，王之所以问臣，臣不敢不以正义对王也。“王色定，然後请问异姓之卿”，宣王见孟子此言，颜色遂解，而心且安定，故无惊恐，然後又问其异姓之卿是如之何。“曰：君有过则谏，反覆之而不听，则去”，孟子又答之曰：国君有过谬则谏诤之，以至反覆数谏，而不听从，则去而之他国者是也。如纣之无道，微子、比干谏之而不听，一则虽为之见剖，一则抱祭器而从周。伊尹发於有莘之野，而为殷汤兴治天下，盖亦本汤立贤无方故也，宜孟子以是而告齐王。" }
