# 毛詩正義卷6（孔穎達疏）：j 為經文＋毛亨傳、鄭玄箋，z 為疏文。
sections:
  - id: juan6
    name: 正文
    blocks:
      - { type: j, text: "《蒹葭》，刺襄公也。未能用周禮，將無以固其國焉。秦處周之舊土，其人被周之德教日久矣。今襄公新為諸侯，未習周之禮法，故國人未服焉。○兼葭，上古恬反，下音加。被，皮寄反。" }
      - { type: z, text: "“《蒹葭》三章，章八句”至“國焉”。○正義曰：作《蒹葭》詩者，刺襄公也。襄公新得周地，其民被周之德教日久，今襄公未能用周禮以教之。禮者為國之本，未能用周禮，將無以固其國焉，故刺之也。經三章，皆言治國須禮之事。" }
      - { type: j, text: "蒹葭蒼蒼，白露為霜。興也。蒹，薕。葭，蘆也。蒼蒼，盛也。白露凝戾為霜，然後歲事成；國家待禮，然後興。箋雲：蒹葭在眾草之中蒼蒼然彊盛，至白露凝戾為霜則成而黃。興者，喻眾民之不從襄公政令者，得周禮以教之則服。○薕音廉。所謂伊人，在水一方。伊，維也。一方，難至矣。箋雲：伊當作繄，繄猶是也，所謂是知周禮之賢人，乃在大水之一邊。假喻以言遠。○繄，於奚反。溯洄從之，道阻且長。逆流而上曰溯洄。逆禮則莫能以至也。箋雲：此言不以敬順往求之，則不能得見。○溯，蘇路反。洄音回。上，時掌反。" }
      - { type: j, text: "溯游從之，宛在水中央。順流而涉曰溯游。順禮求濟，道來迎之。箋雲：宛，坐見貌。以敬順求之則近耳，易得見也。○宛，紆阮反，本亦作“苑”。易，以豉反。" }
      - { type: z, text: "“蒹葭”至“中央”。○毛以為，蒹葭之草蒼蒼然雖盛，未堪家用，必待白露凝戾為霜，然後堅實中用，歲事得成，以興秦國之民雖眾，而未順德教，必待周禮以教之，然後服從上命，國乃得興。今襄公未能用周禮，其國未得興也。由未能用周禮，故未得人服也。所謂維是得人之道，乃遠在大水一邊，大水喻禮樂，言得人之道乃在禮樂之一邊。既以水喻禮樂，禮樂之傍有得人之道，因從水內求之。若逆流溯洄而往從之，則道險阻且長遠，不可得至。言逆禮以治國，則無得人道，終不可至。若順流溯游而往從之，則宛然在於水之中央。言順禮治國，則得人之道，自來迎己，正近在禮樂之內。然則非禮必不得人，得人必能固國，君何以不求用周禮乎！○鄭以為，蒹葭在眾草之中，蒼蒼然彊盛，雖似不可雕傷，至白露凝戾為霜，則成而為黃矣。以興眾民之強者，不從襄公教令，雖似不可屈服，若得周禮以教，則眾民自然服矣。欲求周禮，當得知周禮之人。所謂是知周禮之人在於何處？在大水之一邊，假喻以言遠。既言此人在水一邊，因以水行為喻。若溯洄逆流而從之，則道阻且長，終不可見。言不以敬順往求之，則此人不可得之。若溯游順流而從之，則此人宛然在水中央，易得見。言以敬順求之，則此人易得。何則？賢者難進而易退，故不以敬順求之，則不可得。欲令襄公敬順求知禮之賢人，以教其國也。○傳“蒹葭”至“後興”。○正義曰：“蒹，薕”，“葭，蘆”，《釋草》文。郭璞曰：“蒹似萑而細，高數尺。蘆，葦也。”陸機《疏》雲：“蒹，水草也。堅實，牛食之令牛肥強，青、徐州人謂之薕，兗州、遼東通語也。”《祭義》說養蠶之法雲：“風戾以食之。”注云：“使露氣燥乃食蠶。”然則戾為燥之義。下章“未睎”，謂露未乾為霜，然則露凝為霜，亦如乾燥然，故云“凝戾為霜”。探下章之意以為說也。八月白露節，秋分八月中；九月寒露節，霜降九月中。白霜凝戾為霜，然後歲事成，謂八月、九月葭成葦，可以為曲簿充歲事也。《七月》雲：“八月萑葦。”則八月葦已成。此雲白露為霜，然後歲事成者，以其霜降草乃成，舉霜為言耳。其實白露初降，已任用矣。此以霜降物成，喻得禮則國興。下章“未晞”、“未已”，言其未為霜則物不成，喻未得禮則國不興。此詩主刺未能用周禮，故先言得禮則興，後言無禮不興，所以倒也。○箋“蒹葭”至“則服”。○正義曰：箋以序雲“未能用周禮，將無以固其國”，當謂民未服從，國未能固，故易傳用周禮教民則服。○傳“伊維”至“難至”。○正義曰：“伊，維”，《釋詁》文。傳以詩剌未能用周禮，則未得人心，則所謂維是得人之道也。下傳以溯洄喻逆禮，溯游喻順禮，言水內有得人之道，在大水一方，喻其遠而難至。言得人之道，在禮樂之傍，須用禮樂以求之，故下句言從水內以求所求之物，喻用禮以求得人之道。故王肅雲：“維得人之道，乃在水之一方。”一方，難至矣，水以喻禮樂，能用禮則至於道也。○箋“伊當”至“言遠”。○正義曰：箋以上句言用周禮教民則民服，此經當是勸君求賢人使之用禮，故易傳以“所謂伊人”，“所謂是知周禮之賢人，在大水一邊，假喻以言遠”，故下句逆流、順流喻敬順，皆述求賢之事。一邊，水傍。下雲在湄、在涘，是其居水傍也。○傳“逆流”至“以至”。○正義曰《釋水》雲：“逆流而上曰溯洄，順流而下曰溯游。”孫炎曰：“逆渡者，逆流也。順渡者，順流也。”然則逆、順流皆謂渡水有逆順，故下傳曰：“順流而涉，見其是人渡水也。”此謂得人之道，在於水邊。逆流則道阻且長，言其不可得至，故喻逆禮則莫能以至。言不得人之道，不可至。上言得人之道，在水一方，下句言水中央，則是行未渡水，禮自來水內，故言順禮未濟，道來迎之。未濟，謂未渡水也。以其用水為喻，故以未濟言之。箋以伊人為知禮之人，故易傳以為求賢之事。○傳“順禮未濟，道來迎之”。○正義曰：定本“未濟”作“求濟”，義亦通也。" }
      - { type: j, text: "蒹葭萋萋，白露未晞。萋萋，猶蒼蒼也。晞，乾也。箋雲：未晞，未為霜。○悽，本亦作“萋”，七奚反。晞音希。" }
      - { type: z, text: "傳“晞，乾”。○正義曰：《湛露》雲“匪陽不晞”，言見日則乾，故知晞為乾也。彼言露晞，謂露盡乾。此篇上章言白露為霜，則此言未晞謂未乾為霜，與彼異，故箋雲“未晞，未為霜也。”" }
      - { type: j, text: "所謂伊人，在水之湄。湄，水隒也。○湄音眉。隒，魚檢反，又音檢。" }
      - { type: z, text: "傳“湄，水隒”。○正義曰：《釋水》雲：“水草交為湄。”謂水草交際之處，水之岸也。《釋山》雲：“重甗，隒。”隒是山岸，湄是水岸，故云“水隒”。" }
      - { type: j, text: "溯洄從之，道阻且躋。躋，升也。箋雲：升者，言其難至，如升阪。○躋，本又作“隮”，子西反。" }
      - { type: j, text: "溯游從之，宛在水中坻。坻，小渚也。○坻，直屍反。" }
      - { type: z, text: "傳“坻，小渚”。○正義曰：《釋水》雲：“小洲曰渚。小渚曰沚。小沚曰坻。”然則坻是小沚，言小渚者，渚、沚皆水中之地，小大異也。以渚易知，故系渚言之。" }
      - { type: j, text: "蒹葭采采，白露未已。采采，猶萋萋也。未已，猶未止也。所謂伊人，在水之涘。涘，厓也。○涘音俟。" }
      - { type: j, text: "溯洄從之，道阻且右。右，出其右也。箋雲：右者，言其迂迴也。○迂音於。" }
      - { type: z, text: "傳“右，出其右”。○正義曰：此說道路艱難，而云“且右”，故知右謂出其右也。若正與相當，行則易到，今乃出其右廂，是難至也。箋雲：右，言其迂迴。出其左亦迂迴。言右，取其與涘、沚為韻。" }
      - { type: j, text: "溯游從之，宛在水中沚。小渚曰沚。○沚音止。" }
      - { type: j, text: "《蒹葭》三章，章八句。" }
      - { type: j, text: "《終南》，戒襄公也。能取周地，始為諸侯，受顯服，大夫美之，故作是詩以戒勸之。" }
      - { type: z, text: "“《終南》二章，章六句”至“勸之”。○正義曰：美之者，美以功德，受顯服。戒勸之者，戒令修德無倦，勸其務立功業也。既見受得顯服，恐其惰於為政，故戒之而美之。戒勸之者，章首二句是也。美之者，下四句是也。《常武》美宣王有常德，因以為戒。彼先美后戒，此先戒後美者，《常武》美宣王，因以為戒，此主戒襄公，因戒言其美。主意不同，故序異也。" }
      - { type: j, text: "終南何有？有條有梅。興也。終南，周之名山中南也。條，槄。梅，柟也。宜以戒不宜也。箋雲：問何有者，意以為名山高大，宜有茂木也。興者，喻人君有盛德，乃宜有顯服，猶山之木有大小也，此之謂戒勸。○條，本又作“<木條>”，音同。槄，吐刀反，山榎也。柟，如鹽反。沈雲：“孫炎稱荊州曰梅，揚州曰柟，重實揚州人不聞名柟。”君子至止，錦衣狐裘。錦衣，采色也。狐裘，朝廷之服。箋雲：至止者，受命服於天子而來也。諸侯狐裘，錦衣以裼之。○朝，直遙反。裼，星曆反。" }
      - { type: j, text: "顏如渥丹，其君也哉？箋雲：渥，厚漬也。顏色如厚漬之丹，言赤而澤也。其君也哉，儀貌尊嚴也。○渥，於角反，淳漬。丹如字，《韓詩》作“沰”，音撻各反。沰，赭也。淳，之純反，又如字，本亦作“厚”字。漬，辭賜反。" }
      - { type: z, text: "“終南”至“也哉”。○正義曰：彼終南大山之上何所有乎？乃有條有梅之木，以興彼盛德人君之身何所有乎？乃宜有榮顯之服。然山以高大之故宜有茂木，人君以盛德之故有顯服。若無盛德，則不宜矣。君當務崇明德，無使不宜。言其宜以戒其不宜也。既戒令修德，又陳其美之勸誘之。君子襄公自王朝至止之時，何所得乎？受得錦衣狐裘而來。既受得顯服，德亦稱之，其顏色容貌赫然如厚漬之丹，其儀貌尊嚴如是，其得人君之度也哉？○傳“終南”至“不宜也”。○正義曰：《地理志》稱“扶風武功縣東有大壹山，古文以為終南。”其山高大，是為周地之名山也。昭四年《左傳》曰：“荊山、中南，九州之險。”是此一名中南也。《釋木》雲：“槄，山檟。”李巡曰：“山檟一名槄也。”孫炎曰：“《詩》雲‘有條有梅’，條，槄也。”郭璞曰：“今之山楸也。”“梅，柟”，《釋木》文。孫炎曰：“荊州曰梅，楊州曰柟。”郭璞曰：“似杏實酢。”陸機《疏雲：“槄，今山楸也，亦如下田楸耳，皮葉白，色亦白，材理好。宜為車板，能溼。又可為棺木，宜陽。共北山多有之。梅樹皮葉似豫樟，豫樟葉大如牛耳，一頭尖，赤心，華赤黃，子青，不可食。柟葉大，可三四葉一叢。木理細緻於豫樟，子赤者材堅，子白者材脆。江南及新城、上庸、蜀皆多樟柟，終南山與上庸、新城通，故亦有柟也。”○傳“錦衣”至“之服”。○正義曰：錦者，雜採為文，故云采衣也。狐裘，朝廷之服，謂狐白裘也。白狐皮為裘，其上加錦衣以為裼，其上又加皮弁服也。《玉藻》雲：“君衣狐白裘，錦衣以裼之。”注云：“君衣狐白毛之裘，則以素錦為衣覆之，使可裼也。袒而有衣曰裼。必覆之者，裘，褻也。《詩》雲‘衣錦褧衣，裳錦褧裳’，然則錦衣復有上衣明矣。天子狐白之上衣皮弁服，與凡裼衣象裘色也。”是鄭以錦衣之上有皮弁服也。正以錦文大著上有衣，衣象裘，裘是狐白，則上服亦白皮弁服，以白布為之衣，衣之白者，唯皮弁服耳，故言“天子狐白之上衣皮弁服與”，明諸侯狐白亦皮弁服，以無正文，故言“與”為疑之辭也。《玉藻》又云：“錦衣狐裘，諸侯之服也。”此箋雲“諸侯狐裘，錦衣以裼之”，引《玉藻》為說，以明為裘之裼衣，非裼上之正服也。若然，鄭於《坊記》注云：“在朝君臣同服。”《士冠禮》注云：“諸侯與其臣，皮弁以視朔，朝服以日視朝。”《論語》雲：“素衣麑裘。”雲素衣，諸侯視朔之服。《聘禮》雲：“公側授宰玉，裼降立。”注引《論語》曰：“‘素衣麑裘’，皮弁時或素衣，其裘同，可知也。”然則諸侯在國視朔，及受鄰國之聘，其皮弁服皆服麑裘，不服狐白。此言狐裘為朝廷之服者，謂諸侯在天子之朝廷服此服耳，其歸在國則不服之。《曾子問》雲：“孔子曰：‘天子賜諸侯冕弁服於太廟。歸設奠，服賜服。’”然則諸侯受天子之賜，歸則服之以告廟而已，於後不復服之。知視朔、受聘服麑裘。此美其受賜而歸，故言“錦衣狐裘”耳。" }
      - { type: j, text: "終南何有？有紀有堂。紀，基也。堂，畢道平如堂也。箋雲：畢也堂也，亦高大之山所宜有也。畢，終南山之道名，邊如堂之牆然。○紀如字，本亦作“屺”，沈音起。" }
      - { type: z, text: "傳“紀基”至“如堂”。○正義曰：案《集註》本作“屺”，定本作“紀”，以下文有堂，故以為基，謂山基也。《釋丘》雲：“畢，堂牆。”李巡曰：“堂牆名崖，似堂牆，曰畢。”郭璞曰：“今終南山道名畢，其邊若堂之牆。”以終南之山見有此堂，知是畢道之側，其崖如堂也。定本又云“畢道平如堂”，據經文有基有堂，便是二物。今箋唯雲“畢也堂也”，止釋經之有堂一事者，以基亦是堂，因解傳“畢道如堂”，遂不復雲基。" }
      - { type: j, text: "君子至止，黻衣繡裳。黑與青謂之黻。五色備謂之繡。○黻音弗。" }
      - { type: z, text: "傳“黑與”至“之繡”。○正義曰：《考工記·繢人》文也。鄭於《周禮》之注差次章色，黻皆在裳。言黻衣者，衣大名，與繡裳異其文耳。" }
      - { type: j, text: "佩玉將將，壽考不亡！○將，七羊反。" }
      - { type: j, text: "《終南》二章，章六句。" }
      - { type: j, text: "《黃鳥》，哀三良也。國人刺穆公以人從死，而作是詩也。三良，三善臣也，謂奄息、仲行、釒鹹虎也。從死，自殺以從死。○行，戶郎反，下皆同。釒鹹，其廉反，徐又音針。從死，上才容反。" }
      - { type: z, text: "“《黃鳥》三章，章十二句”。○箋“三良”至“從死”。○正義曰：文六年《左傳》雲：“秦伯任好卒，以子車氏之三子奄息、仲行、針虎為殉，皆秦之良也。國人哀之，為之賦《黃鳥》。”服虔雲：“子車，秦大夫氏也。殺人以葬，璇環其左右曰殉。”又《秦本紀》雲：“穆公卒，葬於雍，從死者百七十人。”然則死者多矣。主傷善人，故言“哀三良也”。殺人以殉葬，當是後有為之，此不刺康公，而刺穆公者，是穆公命從己死，此臣自殺從之，非後主之過，故箋辯之雲：“從死，自殺以從死。”" }
      - { type: j, text: "交交黃鳥，止於棘。興也。交交，小貌。黃鳥以時往來得其所，人以壽命終亦得其所。箋雲：黃鳥止於棘，以求安己也。此棘若不安則移，興者，喻臣之事君亦然。今穆公使臣從死，刺其不得黃鳥止於棘之本意。誰從穆公？子車奄息。子車，氏。奄息，名。箋雲：言誰從穆公者，傷之。維此奄息，百夫之特。乃特百夫之德。箋雲：百夫之中最雄俊也。臨其穴，惴惴其栗。慄慄，懼也。箋雲：穴，謂冢壙中也。秦人哀傷此奄息之死，臨視其壙，皆為之悼栗。○惴，之瑞反。慄音栗。壙，苦晃反。彼蒼者天，殲我良人！殲盡良善也。箋雲：言彼蒼者天，愬之。○殲，子廉反，徐又息廉反。愬，蘇路反" }
      - { type: j, text: "如可贖兮，人百其身！箋雲：如此奄息之死，可以他人贖之者，人皆百其身。謂一身百死猶為之，惜善人之甚。○贖，食燭反，又音樹。" }
      - { type: z, text: "“交交”至“其身”。○毛以為，交交然而小者，是黃鳥也。黃鳥飛而往來，止於棘木之上，得其所，以興人以壽命終亦得其所。今穆公使良臣從死，是不得其所也。有誰從穆公死乎？有子車氏名奄息者從穆公死也。此奄息何等人哉？乃是百夫之中特立雄俊者也。今從穆公而死，秦人悉哀傷之，臨其壙穴之上，皆惴惴然恐懼而其心悼栗。乃愬之於天，彼蒼蒼者是在上之天，今穆公盡殺我善人也，如使此人可以他人贖代之兮，我國人皆百死其身以贖之。愛惜良臣，寧一人百死代之。○鄭以為，交交然之黃鳥，止於棘木以求安。棘若不安則移去。以興臣仕於君，以求行道，道若不行則移去。言臣有去留之道，不得生死從君。今穆公以臣從死，失仕於君之本意。餘同。○傳“交交”至“其所”。○正義曰：黃鳥，小鳥也，故以交交為小貌。《桑扈》箋雲：“交交猶佼佼，飛而往來貌。”則此亦當然，故云“往來得其所”，是交交為往來狀也。以此哀三良不得其所，故以鳥止得所，喻人命終得所。○箋“黃鳥”至“本意”。○正義曰：箋以鳥之集木，似臣之仕君，故易傳也。以鳥止木，喻臣仕君，故言“不得黃鳥止於棘之本意”，正謂不得臣仕於君之本意也。言其若得鳥止之意，知有去留之道，則不當使之從死。○傳“子車，氏。奄息，名”。○正義曰：《左傳》作“子輿”，輿、車字異義同。傳以奄息為名，仲行亦為名。箋以仲行為字者，以伯仲叔季為字之常，故知仲行是字也。然則針虎亦名矣。或名或字，取其韻耳。○傳“乃特百夫之德”。○正義曰：言百夫之德，莫及此人。此人在百夫之中，乃孤特秀立，故箋申之雲：“百夫之中最雄俊也。”○傳“惴惴，懼”。○正義曰：《釋訓》文。" }
      - { type: j, text: "交交黃鳥，止於桑。誰從穆公？子車仲行。箋雲：仲行，字也。維此仲行，百夫之防。防，比也。箋雲：防猶當也。言此一人當百夫。○防，徐雲：“毛音方，鄭音房。”臨其穴，惴惴其慄。彼蒼者天，殲我良人！如可贖兮，人百其身！" }
      - { type: j, text: "交交黃鳥，止於楚。誰從穆公？子車針虎。維此針虎，百夫之御。御，當也。○御，魚呂反，注同。臨其穴，惴惴其栗。彼蒼者天，殲我良人！如可贖兮，人百其身！" }
      - { type: j, text: "《黃鳥》三章，章十二句。" }
      - { type: j, text: "《晨風》，刺康公也。忘穆公之業，始棄其賢臣焉。" }
      - { type: j, text: "鴥彼晨風，鬱彼北林。興也。鴥，疾飛貌。晨風，鸇也。鬱，積也。北林，林名也。先君招賢人，賢人往之，駛疾如晨風之飛入北林。箋雲：先君謂穆公。○鴆，說又作“鴥”，尹橘反，疾飛貌”，《字林》於叔反。鸇，字又作“<鳥亶>”，之然反。《草木疏》雲：“似鷂，青色。”《說文》止仙反，《字林》屍先反。駛，所吏反。未見君子，憂心欽欽。思望之，心中欽欽然。箋雲：言穆公始未見賢者之時，思望而憂之。如何如何？忘我實多！今則忘之矣。箋雲：此以穆公之意責康公。如何如何乎？女忘我之事實多。" }
      - { type: z, text: "“鴥疾”至“實多”。○正義曰：鴥然而疾飛者，彼晨風之鳥也。鬱積而茂盛者，彼北林之木也。北林由鬱茂之故，故晨風飛疾而入之。以興疾歸於秦朝者，是彼賢人；能招者，是彼穆公。穆公由能招賢之故，故賢者疾往而歸之。太穆公招賢人之時，如何乎穆公未見君子之時，思望之，其憂在心，欽欽然唯恐不見，故賢者樂往。今康公乃棄其賢臣，故以穆公之意責之雲：汝康公如何乎？忘我之功業實大多也。○傳“鴥疾”至“北林”。○正義曰：鴥者，鳥飛之狀，故為疾貌。“晨風，鸇”，《釋鳥》文。舍人曰：“晨風一名鸇。鸇，摯鳥也。”郭璞曰：“鷂屬。”陸機《疏》雲：“鸇似鷂，青黃色，燕頷勾喙，向風搖翅，乃因風飛，急疾擊鳩鴿燕雀食之。”鬱者，林木積聚之貌，故云：“鬱，積也。”北林者，據作者所見有此林也。以下句說思賢之狀，故此喻賢人從穆公也。" }
      - { type: j, text: "山有苞櫟，隰有六駮。櫟，木也。駮如馬，倨牙，食虎豹。箋雲：山之櫟，隰之駮，皆其所宜有也。以言賢者亦國家所宜有之。○櫟，盧狄反。駮，邦角反，獸名。《草木疏》雲：“駮馬，木名，梓榆也。”倨音據。" }
      - { type: z, text: "傳“櫟木”至“虎豹”。○正義曰：《釋木》雲：“櫟，其實梂。”孫炎曰：“櫟實，橡也，有梂匯自裹也。”陸機《疏》雲：“秦人謂柞櫟為櫟，河內人謂木蓼為櫟，椒樧之屬也。其子房生為梂。木蓼子亦房生，故說者或曰柞櫟，或曰木蓼。機以為此秦詩也，宜從其方土之言柞櫟是也。”《釋畜》雲：“駮如馬，倨牙，食虎豹。”郭璞引《山海經》雲：“有獸名駮，如白馬黑尾，倨牙，音如鼓，食虎豹。”然則此獸名駮而已。言六駮者，王肅雲：“言六，據所見而言也。”倨牙者，蓋謂其牙倨曲也。言山有木，隰有獸，喻國君宜有賢也。陸機《疏》雲：“駮馬，梓榆也。其樹皮青白駮犖，遙視似駮馬，故謂之駮馬。下章雲‘山有苞棣，隰有樹檖’，皆山、隰之木相配，不宜云獸。”此言非無理也，但箋、傳不然。" }
      - { type: j, text: "未見君子，憂心靡樂。如何如何？忘我實多！○樂音洛。" }
      - { type: j, text: "山有苞棣，隰有樹檖。棣，唐棣也。檖，赤羅也。○棣音悌。檖音遂，或作遂。" }
      - { type: z, text: "傳“棣唐”至“赤羅”。○正義曰：《釋木》有唐棣、常棣，傳必以為唐棣，未詳聞也。《釋木》雲：“檖，赤羅。”郭璞雲：“今揚檖也，實似梨而小，酢可食。”陸機《疏》雲：“檖一名赤羅，一名山梨，今人謂之楊檖，實如梨但小耳。一名鹿梨，一名鼠梨。今人亦種之，極有脆美者，亦如梨之美者。”" }
      - { type: j, text: "未見君子，憂心如醉。如何如何？忘我實多！" }
      - { type: j, text: "《晨風》三章，章六句。" }
      - { type: j, text: "《無衣》，刺用兵也。秦人刺其君好攻戰，亟用兵，而不與民同欲焉。○好，呼報反，下注同。攻，古弄反，又如字，下注同。亟，欺冀反。" }
      - { type: z, text: "“《無衣》三章，章五句”至“欲焉”。○正義曰：康公以文七年立，十八年卒。案《春秋》文七年，晉人、秦人戰於令狐。十年，秦伯伐晉。十二年，晉人、秦人戰於河曲。十六年，楚人、秦人滅庸。見於經、傳者已如是，是其好攻戰也。《葛生》刺好攻戰，序雲“刺獻公”，此亦刺好攻戰，不雲刺康公，而云“刺用兵”者，《葛生》以君好戰，故“國人多喪”，指刺獻公，然後追本其事。此指刺用兵，序順經意，故云刺用兵也。不與民同欲，章首二句是也。好攻戰者，下三句是也。經、序倒者，經刺君不與民同欲，與民同怨，故先言不同欲，而後言好攻戰。序本其怨之所由，由好攻戰而不與民同欲，故民怨。各自為次，所以倒也。" }
      - { type: j, text: "豈曰無衣？與子同袍。興也。袍，襺也。上與百姓同欲，則百姓樂致其死。箋雲：此責康公之言也。君豈嘗曰：女無衣，我與女共袍乎？言不與民同欲。○袍，抱毛反。襺，古顯反，本亦作“繭”。" }
      - { type: j, text: "王於興師，修我戈矛，與子同仇！戈長六尺六寸，矛長二丈。天下有道，則禮樂征伐自天子出。仇，匹也。箋雲：於，於也。怨耦曰仇。君不與我同欲，而於王興師，則雲：修我戈矛，與子同仇，往伐之。刺其好攻戰。○仇音求。長，直亮反，又如字，下同。" }
      - { type: z, text: "“豈曰”至“同仇”。○毛以為，古之朋友相謂雲：我豈曰子無衣乎？我冀欲與子同袍。朋友同欲如是，故朋友成其恩好，以興明君能與百姓同欲，故百姓樂致其死。至於王家於是興師之時，百姓皆自相謂：修我戈矛，與子同為仇匹，而往徵之。由上與百姓同欲，故百姓樂從征伐。今康公不與百姓同欲，非王興師，而自好攻戰故，百姓怨也。○鄭以為，康公平常之時，豈肯言曰：汝百姓無衣乎？吾與子同袍。終不肯言此也。及於王法於是興師之時，則曰：修治我之戈矛，與子百姓同往伐此怨耦之仇敵。不與百姓同欲，而唯同怨，故刺之。○傳“袍襺”至“其死”。○正義曰：“袍，襺”，《釋言》文。《玉藻》雲：“纊為襺。縕為袍。”注云：“衣有著之異名也。縕謂今纊及舊絮也。”然則純著新綿名為襺，雜用舊絮名為袍。雖著有異名，其制度是一，故云“袍，襺也”。傳既以此為興，又言“上與百姓同欲，則百姓樂致其死”，則此經所言朋友相與同袍，以興上與百姓同欲，故王肅雲：“豈謂子無衣乎？樂有是袍，與子為朋友，同共弊之。以興上與百姓同欲，則百姓樂致其死，如朋友樂同衣袍也。”○箋“此責”至“同欲”。○正義曰：易傳者，以此刺康公不與民同欲。而經言子、我，是述康公之意，謂民自稱為我。然則士卒眾矣，人君不可皆與同衣。而責君不與己共袍者，以仁者在上，恤民飢寒，知其有無，救其睏乏，故假同袍以為辭耳，非百姓皆欲望君與之共袍也。○傳“戈長”至“仇匹”。○正義曰：“戈長六尺六寸”，《考工記·廬人》文也。《記》又云：“酋矛常有四尺。”注云：“八尺曰尋。倍尋曰常。常有四尺。”是矛長二丈也。矛長二丈，謂酋矛也。夷矛則三尋，長二丈四尺矣。《記》又云：“攻國之兵用短，守國之兵用長。”此言興師以伐人國，知用二丈之矛，非夷矛也。又解稱王於興師之意。天下有道，禮樂征伐自天子出，諸侯不得專輒用兵。疾君不由王命，自好攻戰，故言王也。王肅雲：“疾其好攻戰，不由王命，故思王興師是也。”“仇，匹”，《釋詁》文。○箋“於於”至“攻戰”。○正義曰：“於，於”，《釋詁》文。“怨耦曰仇”，桓二年《左傳》文。易傳者，以上二句假為康公之言，則此亦康公之言，陳其號令之辭。刺其好攻戰也。案此時當週頃王、匡王，天子之命不行於諸侯。檢《左傳》，於時天子未嘗出師，又不見康公從王征伐。且從王出征，乃是為臣之義，而刺其好攻戰者，箋言“王於興師”，謂於王法興師。今是康公自興之，王不興師也。以出師征伐是王者之法，故以王為言耳。猶《北門》言“王事敦我”，《鴇羽》雲“王事靡盬”，皆非天子之事，亦稱王事。" }
      - { type: j, text: "豈曰無衣？與子同澤。澤，潤澤也。箋雲：澤，褻衣，近汙垢。○澤如字，《說文》作“襗”，雲：“衤誇也。”褻，仙列反。近，附近之近。汙音烏，又汙穢之汙。垢，古口反。" }
      - { type: z, text: "傳“澤，潤澤”。○正義曰：衣服之暖於身，猶甘雨之潤於物，故言與子同澤，正謂同袍、裳是共潤澤也。箋以上袍下裳，則此亦衣名，故易傳為“襗”。《說文》雲：“襗，衤誇也。”是其褻衣近汙垢也。襗是袍類，故《論語》注云：“褻衣，袍襗也。”" }
      - { type: j, text: "王於興師，修我矛戟，與子偕作！作，起也。箋雲：戟，車戟常也。" }
      - { type: z, text: "箋“戟，車戟常”。○正義曰：“車戟常”，《考工記·廬人》文。常長丈六" }
      - { type: j, text: "。" }
      - { type: j, text: "豈曰無衣？與子同裳。王於興師，修我甲兵，與子偕行！行，往也。" }
      - { type: j, text: "《無衣》三章，章五句。" }
      - { type: j, text: "《渭陽》，康公念母也。康公之母，晉獻公之女。文公遭麗姬之難，未反，而秦姬卒。穆公納文公，康公時為大子，贈送文公於渭之陽，念母之不見也。我見舅氏，如母存焉。及其即位，思而作是詩也。○渭陽，音謂，水名。水北曰陽。麗，本又作“驪”，同力馳反。難，乃旦反。大音泰。" }
      - { type: z, text: "“《渭陽》二章，章四句”至“是詩”。○正義曰：作《渭陽》詩者，言康公念母也。康公思其母，自作此詩。秦康公之母，是晉獻公之女。文公者，獻公之子，康公之舅。獻公嬖麗姬，譖文公，獻公欲殺之。文公遭此麗姬之難，奔，未得反國，而康公母秦姬已卒。及穆公納文公為晉君，於是康公為太子，贈送文公至於渭水之陽，思念母之不見，舅歸也，康公見其舅氏，如似母之存焉，於是之時，思慕深極。及其即位為君，思本送舅時事，而作是《渭陽》之詩，述己送舅念母之事也。案《左傳》莊二十八年傳“晉獻公烝於齊姜，生秦穆夫人及太子申生。又娶二女於戎，大戎狐姬生重耳，小戎子生夷吾”。是康公之母為文公異母姊也。僖四年傳稱麗姬譖申生，申生自殺。又“譖二公子曰：‘皆知之。’重耳奔蒲，夷吾奔屈”。僖五年傳稱“晉侯使寺人披伐蒲。重耳奔翟”。是文公遭麗姬之難也。僖十五年秦穆公獲晉侯以歸。尚有夫人為之請。至二十四年穆公納文公。然則秦姬之卒，在僖十五年之後，二十四年以前，未知何年卒也。以秦國夫人而其姓為姬，故謂之秦姬。案齊姜麗姬皆以姓系所生之國，此秦姬以姓系於所嫁之國者，婦人不以名行，以姓為字，故或系於父，或系於夫，事得兩施也。秦姬生存之時，欲使文公反國。康公見舅得反，憶母宿心，故念母之不見，見舅如母存也。謂舅為氏者，以舅之與甥，氏姓必異，故《書傳》通謂為舅氏。秦康公以文七年即位，文公時亦卒矣。追念送時之事，作此詩耳。經二章皆陳贈送舅氏之事。“悠悠我思”，念母也。因送舅氏而念母，為念母而作詩，故《序》主言“念母也”。" }
      - { type: j, text: "我送舅氏，曰至渭陽。母之昆弟曰舅。箋雲：渭，水名也。秦是時都雍，至渭陽者，蓋東行送舅氏於咸陽之地。○雍，於用反，縣名，今屬扶風。" }
      - { type: j, text: "何以贈之？路車乘黃。贈，送也。乘黃，四馬也。○乘，繩證反，注同。" }
      - { type: z, text: "傳“母之昆弟曰舅”。○正義曰：《釋親》文。孫炎曰：“舅之言舊，尊長之稱。”○箋“渭水”至“之地”。○正義曰：雍在渭南，水北曰陽，晉在秦東，行必渡渭。今言至於渭陽，故云“蓋東行送舅氏於咸陽之地”。《地理志》雲：“右扶風渭城縣，故咸陽也。”其地在渭水之北。" }
      - { type: j, text: "我送舅氏，悠悠我思。何以贈之？瓊瑰玉佩。瓊瑰，石而次玉。○思，息嗣反。瑰，古回反。" }
      - { type: z, text: "傳“瓊瑰”至“次玉”。○正義曰：瓊者，玉之美名，非玉名也。瑰是美石之名也。以佩玉之制，唯天子用純，諸侯以下則玉石雜用。此贈晉侯，故知瓊瑰是美石，次玉。成十七年《左傳》稱“聲伯夢涉洹，或與己瓊瑰食之，泣而為瓊瑰盈其懷，懼不敢佔”。後三年而言，“言之，至莫而卒”。服虔雲：“聲伯惡瓊瑰贈死之物，故畏而不言。”然則瓊瑰是贈死之玉，康公以贈舅者，玉之所用，無生死之異。喪禮飯含用玉，聲伯夢見食之，故惡之耳。" }
      - { type: j, text: "《渭陽》二章，章四句。" }
      - { type: j, text: "《權輿》，刺康公也。忘先君之舊臣，與賢者有始而無終也。○權輿，音餘。權輿，始也。" }
      - { type: z, text: "“《權輿》二章，章五句”至“無終”。○正義曰：作《權輿》詩者，刺康公也。康公遺忘其先君穆公之舊臣，不加禮餼，與賢者交接，有始而無終，初時殷勤，後則疏薄，故刺之。經二章，皆言禮待賢者有始無終之事。" }
      - { type: j, text: "於我乎！夏屋渠渠，夏，大也。箋雲：屋，具也。渠渠，猶勤勤也。言君始於我，厚設禮食大具以食我，其意勤勤然。○夏，胡雅反。屋如字，具也。食我，音嗣，注篇內同。今也每食無餘。箋雲：此言君今遇我薄，其食我才足耳。" }
      - { type: j, text: "于嗟乎！不承權輿！承，繼也。權輿，始也。" }
      - { type: z, text: "“於我”至“權輿”。○正義曰：此述賢人之意，責康公之辭。言康公始者於我賢人乎！重設饌食禮物大具，其意勤勤然，於我甚厚也。至於今日也，禮意疏薄，設饌校少，使我每食才足，無復盈餘也。于嗟乎！此君之行，不能承繼其始。以其行無終始，故於嗟歎之。○傳“夏，大”。○正義曰：《釋詁》文。○箋“屋具”至“勤勤然”。正義曰：“屋，具”，《釋言》文。渠渠猶勤勤。言設食既具，意又勤勤也。案崔駰《七依》說宮室之美雲：“夏屋渠渠。”王肅雲：“屋則立之於先君，食則受之於今君，故居大屋而食無餘。”義似可通。鄭不然者，詩刺有始無終。上言“於我乎”，謂始時也。下言“今也”，謂其終時也。始則大具，今終則無餘，猶下章始則四簋，今則不飽，皆說飲食之事，不得言屋宅也。若先君為立大屋，今君每食無餘，則康公本自無始，何責其無終也？且《爾雅》“屋，具”正訓，以此故知謂禮物大具。○傳“承，繼也。權輿，始”。○正義曰：承其後是繼嗣，故以承為繼。“權輿，始”，《釋詁》文。" }
      - { type: j, text: "於我乎！每食四簋，四簋，黍稷稻粱。○簋音軌，內方外圓曰簋，以盛黍稷。外方內圓曰簠，用貯稻粱。皆容一斗二升。" }
      - { type: z, text: "傳“四簋”至“稻粱”。○正義曰：《考工記》雲：“瓬人為簋，其實一觳。豆實三而成觳。”昭三年《左傳》雲：“四升為豆。”然則簋是瓦器，容二升也。《易·損卦》：“二簋可用享。”注云：“離為日，日體圓。巽為木，木器圓，簋象。”則簋亦以木為之也。《地官·舍人》注云：“方曰簠。圓曰簋。”則簠、簋之制，其形異也。案《公食大夫禮》雲：“宰夫設黍稷六簋。”又云：“宰夫授公粱，公設之。宰夫膳稻於粱西。”注云：“膳猶進也。進稻粱者以簠。”《秋官·掌客》注云：“簠，稻粱器也。簋，黍稷器也。”然則稻粱當在簠，而云“四簋，黍稷稻粱”者，以詩言“每食四簋”，稱君禮物大具，則宜每器一物，不應以黍稷二物分為四簋。以公食大夫禮有稻有粱，知此四簋之內兼有稻粱。公食大夫之禮，是主國之君與聘客禮食，備設器物，故稻粱在簠。此言每食，則是平常燕食，器物不具，故稻粱在簋。公食大夫，黍稷六簋，猶有稻粱。此唯四簋者，亦燕食差於禮食也。" }
      - { type: j, text: "今也每食不飽。于嗟乎！不承權輿！" }
      - { type: j, text: "《權輿》二章，章五句。" }
      - { type: j, text: "秦國十篇，二十七章，百八十一句。" }
      - { type: j, text: "《毛詩正義》" }
