labels:
  - page: 288
    col: 1
    role: j
    text: 論語卷第七朱熹集注
  - page: 288
    col: 2
    role: title
    text: 子路第十三
  - page: 288
    col: 3
    role: z
    text: 凡三十章
  - page: 288
    col: 4
    role: j
    text: 子路問政子曰先之勞之
  - page: 288
    col: 5
    role: z
    text: 勞如字○蘇氏曰凡民之行以身先
  - page: 288
    col: 6
    role: z
    text: 之則不令而行凡民之事以身勞之
  - page: 288
    col: 7
    role: z
    text: 則雖勤不怨
  - page: 288
    col: 8
    role: j
    text: 請益曰無倦
  - page: 289
    col: 1
    role: z
    text: 無古本作毋○吳氏曰勇者喜於有
  - page: 289
    col: 2
    role: z
    text: 爲而不能持乆故以此告之○程子
  - page: 289
    col: 3
    role: z
    text: 曰子路問政孔子旣告之矣及請益
  - page: 289
    col: 4
    role: z
    text: 則曰無倦而已未嘗復有所告姑使
  - page: 289
    col: 5
    role: z
    text: 之深思也
  - page: 289
    col: 6
    role: j
    text: 仲弓爲季氏宰問政子曰先有司赦小
  - page: 289
    col: 7
    role: j
    text: 過舉賢才
  - page: 289
    col: 8
    role: z
    text: 有司衆職也宰兼衆職然事必先之
  - page: 289
    col: 9
    role: z
    text: 於彼而後考其成功則己不勞而事
  - page: 289
    col: 10
    role: z
    text: 畢舉矣過失誤也大者於事或有所
  - page: 289
    col: 11
    role: z
    text: 害不得不懲小者赦之則刑不濫而
  - page: 289
    col: 12
    role: z
    text: 人心恱矣賢有德者才有能者舉而
  - page: 289
    col: 13
    role: z
    text: 用之則有司皆得其人而政益修矣
  - page: 289
    col: 14
    role: j
    text: 曰焉知賢才而舉之曰舉爾所知爾所
  - page: 289
    col: 15
    role: j
    text: 不知人其舎諸
  - page: 289
    col: 16
    role: z
    text: 焉於䖍反舎上聲○仲弓慮無以盡
  - page: 290
    col: 1
    role: j
    text: 知一時之賢才故孔子告之以此○
  - page: 290
    col: 2
    role: j
    text: 程子曰人各親其親然後不獨親其
  - page: 290
    col: 3
    role: j
    text: 親仲弓曰焉知賢才而舉之子曰舉
  - page: 290
    col: 4
    role: j
    text: 爾所知爾所不知人其舎諸便見仲
  - page: 290
    col: 5
    role: j
    text: 弓與聖人用心之大小推此義則一
  - page: 290
    col: 6
    role: j
    text: 心可以興邦一心可以喪邦只在公
  - page: 290
    col: 7
    role: j
    text: 私之間爾○范氏曰不先有司則君
  - page: 290
    col: 8
    role: j
    text: 行臣職矣不赦小過則下無全人矣
  - page: 290
    col: 9
    role: j
    text: 不舉賢才則百職廢矣失此三者不
  - page: 290
    col: 10
    role: z
    text: 可以爲季氏宰况天下乎
  - page: 290
    col: 11
    role: j
    text: 子路曰衛君待子而爲政子將奚先
  - page: 290
    col: 12
    role: j
    text: 衛君謂出公輒也是時魯哀公之十
  - page: 290
    col: 13
    role: z
    text: 年孔子自楚反乎衛
  - page: 290
    col: 14
    role: j
    text: 子曰必也正名乎
  - page: 290
    col: 15
    role: j
    text: 是時出公不父其父而禰其祖名實
  - page: 290
    col: 16
    role: j
    text: 紊矣故孔子以正名爲先○謝氏曰
  - page: 291
    col: 1
    role: z
    text: 正名雖爲衛君而言然爲政之道皆
  - page: 291
    col: 2
    role: z
    text: 當以此爲先
  - page: 291
    col: 3
    role: j
    text: 子路曰有是哉子之迂也奚其正
  - page: 291
    col: 4
    role: z
    text: 迂謂遠於事情言非今日之急務也
  - page: 291
    col: 5
    role: j
    text: 子曰野哉由也君子於其所不知蓋闕
  - page: 291
    col: 6
    role: j
    text: 如也
  - page: 291
    col: 7
    role: z
    text: 野謂鄙俗責其不能闕疑而率爾妄
  - page: 291
    col: 8
    role: z
    text: 對也
  - page: 291
    col: 9
    role: j
    text: 名不正則言不順言不順則事不成
  - page: 291
    col: 10
    role: z
    text: 楊氏曰名不當其實則言不順言不
  - page: 291
    col: 11
    role: z
    text: 順則無以考實而事不成
  - page: 291
    col: 12
    role: j
    text: 事不成則禮樂不興禮樂不興則刑罰
  - page: 291
    col: 13
    role: j
    text: 不中刑罰不中則民無所措手足
  - page: 291
    col: 14
    role: z
    text: 中去聲○范氏曰事得其序之謂禮
  - page: 291
    col: 15
    role: z
    text: 物得其和之謂樂事不成則無序而
  - page: 291
    col: 16
    role: z
    text: 不和故禮樂不興禮樂不興則施之
  - page: 292
    col: 1
    role: z
    text: 政事皆失其道故刑罰不中
  - page: 292
    col: 2
    role: j
    text: 故君子名之必可言也言之必可行也
  - page: 292
    col: 3
    role: j
    text: 君子於其言無所苟而已矣
  - page: 292
    col: 4
    role: z
    text: 程子曰名實相須一事苟則其餘皆
  - page: 292
    col: 5
    role: z
    text: 苟矣○胡氏曰衛世子蒯聵恥其母
  - page: 292
    col: 6
    role: z
    text: 南子之淫亂欲殺之不果而出奔靈
  - page: 292
    col: 7
    role: z
    text: 公欲立公子郢郢辭公卒夫人立之
  - page: 292
    col: 8
    role: z
    text: 又辭乃立蒯聵之子輒以拒蒯聵夫
  - page: 292
    col: 9
    role: z
    text: 蒯聵欲殺母得罪於父而輒據國以
  - page: 292
    col: 10
    role: z
    text: 拒父皆無父之人也其不可有國也
  - page: 292
    col: 11
    role: z
    text: 明矣夫子為政而以正名為先必將
  - page: 292
    col: 12
    role: z
    text: 具其事之本末告諸天王請于方伯
  - page: 292
    col: 13
    role: z
    text: 命公子郢而立之則人倫正天理得
  - page: 292
    col: 14
    role: z
    text: 名正言順而事成矣夫子告之之詳
  - page: 292
    col: 15
    role: z
    text: 如此而子路終不喻也故事輒不去
  - page: 292
    col: 16
    role: j
    text: 卒死其難徒知食焉不避其難之為義
  - page: 293
    col: 1
    role: z
    text: 而不知食輒之食爲非義也
  - page: 293
    col: 2
    role: j
    text: 樊遲請學稼子曰吾不如老農請學爲
  - page: 293
    col: 3
    role: j
    text: 圃曰吾不如老圃
  - page: 293
    col: 4
    role: z
    text: 種五穀曰稼種蔬菜曰圃
  - page: 293
    col: 5
    role: j
    text: 樊遲出子曰小人哉樊須也
  - page: 293
    col: 6
    role: z
    text: 小人謂細民孟子所謂小人之事者
  - page: 293
    col: 7
    role: z
    text: 也
  - page: 293
    col: 8
    role: j
    text: 上好禮則民莫敢不敬上好義則民莫
  - page: 293
    col: 9
    role: j
    text: 敢不服上好信則民莫敢不用情夫如
  - page: 293
    col: 10
    role: j
    text: 是則四方之民襁負其子而至矣焉用
  - page: 293
    col: 11
    role: j
    text: 稼
  - page: 293
    col: 12
    role: z
    text: 好去聲夫音扶襁居丈反焉於虔反
  - page: 293
    col: 13
    role: z
    text: ○禮義信大人之事也好義則事合
  - page: 293
    col: 14
    role: z
    text: 冝情誠實也敬服用情蓋各以其類
  - page: 293
    col: 15
    role: z
    text: 而應也襁織縷爲之以約小兒於背
  - page: 293
    col: 16
    role: z
    text: 者○楊氏曰樊須遊聖人之門而問
  - page: 294
    col: 1
    role: z
    text: 稼圃志則陋矣辭而闢之可也待其
  - page: 294
    col: 2
    role: z
    text: 出而後言其非何也蓋於其問也自
  - page: 294
    col: 3
    role: z
    text: 謂農圃之不如則拒之者至矣須之
  - page: 294
    col: 4
    role: z
    text: 學疑不及此而不能問不能以三隅
  - page: 294
    col: 5
    role: z
    text: 反矣故不復及其既出則懼其終不
  - page: 294
    col: 6
    role: z
    text: 喻也求老農老圃而學焉則其失愈
  - page: 294
    col: 7
    role: z
    text: 遠矣故復言之使知前所言者意有
  - page: 294
    col: 8
    role: z
    text: 在也
  - page: 294
    col: 9
    role: j
    text: 子曰誦詩三百授之以政不達使於四
  - page: 294
    col: 10
    role: j
    text: 方不能專對雖多亦奚以爲
  - page: 294
    col: 11
    role: z
    text: 使去聲○專獨也詩本人情該物理
  - page: 294
    col: 12
    role: z
    text: 可以驗風俗之盛衰見政治之得失
  - page: 294
    col: 13
    role: z
    text: 其言溫厚和平長於風諭故誦之者
  - page: 294
    col: 14
    role: z
    text: 必達於政而能言也○程子曰窮經
  - page: 294
    col: 15
    role: z
    text: 將以致用也世之誦詩者果能從政
  - page: 294
    col: 16
    role: z
    text: 而專對乎然則其所學者章句之末
  - page: 295
    col: 1
    role: z
    text: 耳此學者之大患也
  - page: 295
    col: 2
    role: j
    text: 子曰其身正不令而行其身不正雖令
  - page: 295
    col: 3
    role: j
    text: 不從○子曰魯衛之政兄弟也
  - page: 295
    col: 4
    role: z
    text: 魯周公之後衛康叔之後本兄弟之
  - page: 295
    col: 5
    role: z
    text: 國而是時衰亂政亦相似故孔子嘆
  - page: 295
    col: 6
    role: z
    text: 之
  - page: 295
    col: 7
    role: j
    text: 子謂衛公子荆善居室始有曰苟合矣
  - page: 295
    col: 8
    role: j
    text: 少有曰苟完矣富有曰苟美矣
  - page: 295
    col: 9
    role: z
    text: 公子荆衛大夫苟聊且粗略之意合
  - page: 295
    col: 10
    role: z
    text: 聚也全備也言其循序而有節不以
  - page: 295
    col: 11
    role: z
    text: 欲速盡美累其心○楊氏曰務為全
  - page: 295
    col: 12
    role: z
    text: 美則累物而驕吝之心生公子荆皆
  - page: 295
    col: 13
    role: z
    text: 曰苟而已則不以外物為心其欲易
  - page: 295
    col: 14
    role: z
    text: 足故也
  - page: 295
    col: 15
    role: j
    text: 子適衛冉有僕
  - page: 295
    col: 16
    role: z
    text: 僕御車也
  - page: 296
    col: 1
    role: j
    text: 子曰庶矣哉
  - page: 296
    col: 2
    role: z
    text: 庶衆也
  - page: 296
    col: 3
    role: j
    text: 冉有曰既庶矣又何加焉曰富之
  - page: 296
    col: 4
    role: z
    text: 庶而不富則民生不遂故制田里薄
  - page: 296
    col: 5
    role: z
    text: 賦歛以富之
  - page: 296
    col: 6
    role: j
    text: 曰既富矣又何加焉曰教之
  - page: 296
    col: 7
    role: z
    text: 富而不教則近於禽獸故必立學校
  - page: 296
    col: 8
    role: z
    text: 明禮義以教之○胡氏曰天生斯民
  - page: 296
    col: 9
    role: z
    text: 立之司牧而寄以三事然自三代之
  - page: 296
    col: 10
    role: z
    text: 後能舉此職者百無一二漢之文明
  - page: 296
    col: 11
    role: z
    text: 唐之太宗亦云庶且富矣西京之教
  - page: 296
    col: 12
    role: z
    text: 無聞焉明帝尊師重傅臨雍拜老宗
  - page: 296
    col: 13
    role: z
    text: 戚子弟莫不受學唐太宗大召名儒
  - page: 296
    col: 14
    role: z
    text: 增廣生員教亦至矣然而未知所以
  - page: 296
    col: 15
    role: z
    text: 教也三代之教天子公卿躬行於上
  - page: 296
    col: 16
    role: z
    text: 言行政事皆可師法彼二君者其能
  - page: 297
    col: 1
    role: z
    text: 然乎
  - page: 297
    col: 2
    role: j
    text: 子曰苟有用我者朞月而已可也三年
  - page: 297
    col: 3
    role: j
    text: 有成
  - page: 297
    col: 4
    role: z
    text: 朞月謂周一歲之月也可者僅辭言
  - page: 297
    col: 5
    role: z
    text: 綱紀布也有成治功成也○尹氏曰
  - page: 297
    col: 6
    role: z
    text: 孔子歎當時莫能用已也故云然愚
  - page: 297
    col: 7
    role: z
    text: 按史記此蓋為衛靈公不能用而發
  - page: 297
    col: 8
    role: j
    text: 子曰善人為邦百年亦可以勝殘去殺
  - page: 297
    col: 9
    role: j
    text: 矣誠哉是言也
  - page: 297
    col: 10
    role: z
    text: 勝平聲去上聲○為邦百年言相繼
  - page: 297
    col: 11
    role: z
    text: 而久也勝殘化殘暴之人使不為惡
  - page: 297
    col: 12
    role: z
    text: 也去殺謂民化於善可以不用刑殺
  - page: 297
    col: 13
    role: z
    text: 也蓋古有是言而夫子稱之○程子
  - page: 297
    col: 14
    role: z
    text: 曰漢自高惠至于文景黎民醇厚幾
  - page: 297
    col: 15
    role: z
    text: 致刑措庶乎其近之矣○尹氏曰勝
  - page: 297
    col: 16
    role: z
    text: 殘去殺不為惡而已善人之功如是
  - page: 298
    col: 1
    role: z
    text: 若夫聖人則不待百年其化亦不止
  - page: 298
    col: 2
    role: z
    text: 此
  - page: 298
    col: 3
    role: j
    text: 子曰如有王者必世而後仁
  - page: 298
    col: 4
    role: z
    text: 王者謂聖人受命而興也三十年爲
  - page: 298
    col: 5
    role: z
    text: 一世仁謂教化浹也○程子曰周自
  - page: 298
    col: 6
    role: z
    text: 文武至于成王而後禮樂興即其効
  - page: 298
    col: 7
    role: z
    text: 也○或問三年必世遲速不同何也
  - page: 298
    col: 8
    role: z
    text: 程子曰三年有成謂法度紀綱有成
  - page: 298
    col: 9
    role: z
    text: 而化行也漸民以仁摩民以義使之
  - page: 298
    col: 10
    role: z
    text: 浹於肌膚淪於骨髓而禮樂可興所
  - page: 298
    col: 11
    role: z
    text: 謂仁也此非積乆何以能致
  - page: 298
    col: 12
    role: j
    text: 子曰苟正其身矣於從政乎何有不能
  - page: 298
    col: 13
    role: j
    text: 正其身如正人何○冉有退朝子曰何
  - page: 298
    col: 14
    role: j
    text: 晏也對曰有政子曰其事也如有政雖
  - page: 298
    col: 15
    role: j
    text: 不吾以吾其與聞之
  - page: 298
    col: 16
    role: z
    text: 朝音潮與去聲○冉有時爲季氏宰
  - page: 299
    col: 1
    role: z
    text: 朝季氏之私朝也晏晚也政國政事
  - page: 299
    col: 2
    role: z
    text: 家事以用也禮大夫雖不治事猶得
  - page: 299
    col: 3
    role: z
    text: 與聞國政是時季氏專魯其於國政
  - page: 299
    col: 4
    role: z
    text: 蓋有不與同列議於公朝而獨與家
  - page: 299
    col: 5
    role: z
    text: 臣謀於私室者故夫子爲不知者而
  - page: 299
    col: 6
    role: z
    text: 言此必季氏之家事耳若是國政我
  - page: 299
    col: 7
    role: z
    text: 嘗爲大夫雖不見用猶當與聞今旣
  - page: 299
    col: 8
    role: z
    text: 不聞則是非國政也語意與魏證獻
  - page: 299
    col: 9
    role: z
    text: 陵之對略相似其所以正名分抑季
  - page: 299
    col: 10
    role: z
    text: 氏而教冉有之意深矣
  - page: 299
    col: 11
    role: j
    text: 定公問一言而可以興邦有諸孔子對
  - page: 299
    col: 12
    role: j
    text: 曰言不可以若是其幾也
  - page: 299
    col: 13
    role: z
    text: 幾期也詩曰如幾如式言一言之間
  - page: 299
    col: 14
    role: z
    text: 未可以如此而必期其効
  - page: 299
    col: 15
    role: j
    text: 人之言曰爲君難爲臣不易
  - page: 299
    col: 16
    role: z
    text: 易去聲○當時有此言也
  - page: 300
    col: 1
    role: j
    text: 如知爲君之難也不幾乎一言而興邦
  - page: 300
    col: 2
    role: j
    text: 乎
  - page: 300
    col: 3
    role: z
    text: 因此言而知爲君之難則必戰戰兢
  - page: 300
    col: 4
    role: z
    text: 兢臨深履薄而無一事之敢忽然則
  - page: 300
    col: 5
    role: z
    text: 此言也豈不可以必期於興邦乎爲
  - page: 300
    col: 6
    role: z
    text: 定公言故不及臣也
  - page: 300
    col: 7
    role: j
    text: 曰一言而喪邦有諸孔子對曰言不可
  - page: 300
    col: 8
    role: j
    text: 以若是其幾也人之言曰予無樂乎爲
  - page: 300
    col: 9
    role: j
    text: 君唯其言而莫予違也
  - page: 300
    col: 10
    role: z
    text: 喪去聲下同樂音洛言他無所樂惟
  - page: 300
    col: 11
    role: z
    text: 樂此耳
  - page: 300
    col: 12
    role: j
    text: 如其善而莫之違也不亦善乎如不善
  - page: 300
    col: 13
    role: j
    text: 而莫之違也不幾乎一言而喪邦乎
  - page: 300
    col: 14
    role: z
    text: 范氏曰言不善而莫之違則忠言不
  - page: 300
    col: 15
    role: z
    text: 至於耳君日驕而臣日謟未有不喪
  - page: 300
    col: 16
    role: z
    text: 邦者也○謝氏曰知爲君之難則必
  - page: 301
    col: 1
    role: z
    text: 敬謹以持之惟其言而莫予違則讒
  - page: 301
    col: 2
    role: z
    text: 諂面諛之人至矣邦未必遽興喪也
  - page: 301
    col: 3
    role: z
    text: 而興喪之源分於此然此非識微之
  - page: 301
    col: 4
    role: z
    text: 君子何足以知之
  - page: 301
    col: 5
    role: j
    text: 葉公問政
  - page: 301
    col: 6
    role: z
    text: 音義並見第七篇
  - page: 301
    col: 7
    role: j
    text: 子曰近者說逺者來
  - page: 301
    col: 8
    role: z
    text: 說音悅○被其澤則悅聞其風則來
  - page: 301
    col: 9
    role: z
    text: 然必近者悅而後逺者來也
  - page: 301
    col: 10
    role: j
    text: 子夏爲莒父宰問政子曰無欲速無見
  - page: 301
    col: 11
    role: j
    text: 小利欲速則不逹見小利則大事不成
  - page: 301
    col: 12
    role: z
    text: 父音甫○莒父魯邑名欲事之速成
  - page: 301
    col: 13
    role: z
    text: 則急遽無序而反不逹見小者之爲
  - page: 301
    col: 14
    role: z
    text: 利則所就者小而所失者大矣○程
  - page: 301
    col: 15
    role: j
    text: 子曰子張問政子曰居之無倦行之
  - page: 301
    col: 16
    role: j
    text: 以忠子夏問政子曰無欲速無見小
  - page: 302
    col: 1
    role: j
    text: 利子張常過高而未仁子夏之病常
  - page: 302
    col: 2
    role: z
    text: 在近小故各以切己之事告之
  - page: 302
    col: 3
    role: j
    text: 葉公語孔子曰吾黨有直躬者其父攘
  - page: 302
    col: 4
    role: j
    text: 羊而子證之
  - page: 302
    col: 5
    role: z
    text: 語去聲○直躬直身而行者有因而
  - page: 302
    col: 6
    role: z
    text: 盜曰攘
  - page: 302
    col: 7
    role: j
    text: 孔子曰吾黨之直者異於是父為子隱
  - page: 302
    col: 8
    role: j
    text: 子為父隱直在其中矣
  - page: 302
    col: 9
    role: z
    text: 為去聲○父子相隱天理人情之至
  - page: 302
    col: 10
    role: z
    text: 也故不求為直而直在其中○謝氏
  - page: 302
    col: 11
    role: z
    text: 曰順理為直父不為子隱子不為父
  - page: 302
    col: 12
    role: z
    text: 隱於理順邪瞽瞍殺人舜竊負而逃
  - page: 302
    col: 13
    role: z
    text: 遵海濱而處當是時愛親之心勝其
  - page: 302
    col: 14
    role: z
    text: 於直不直何暇計哉
  - page: 302
    col: 15
    role: j
    text: 樊遲問仁子曰居處恭執事敬與人忠
  - page: 302
    col: 16
    role: j
    text: 雖之夷狄不可棄也
  - page: 303
    col: 1
    role: z
    text: 恭主容敬主事恭見於外敬主乎中
  - page: 303
    col: 2
    role: z
    text: 之夷狄不可棄勉其固守而勿失也
  - page: 303
    col: 3
    role: z
    text: ○程子曰此是徹上徹下語聖人初
  - page: 303
    col: 4
    role: z
    text: 無二語也充之則睟面盎背推而達
  - page: 303
    col: 5
    role: z
    text: 之則篤恭而天下平矣○胡氏曰樊
  - page: 303
    col: 6
    role: z
    text: 遲問仁者三此最先先難次之愛人
  - page: 303
    col: 7
    role: z
    text: 其最後乎
  - page: 303
    col: 8
    role: j
    text: 子貢問曰何如斯可謂之士矣子曰行
  - page: 303
    col: 9
    role: j
    text: 己有恥使於四方不辱君命可謂士矣
  - page: 303
    col: 10
    role: z
    text: 使去聲○此其志有所不為而其材
  - page: 303
    col: 11
    role: z
    text: 足以有為者也子貢能言故以使事
  - page: 303
    col: 12
    role: z
    text: 告之蓋為使之難不獨貴於能言而
  - page: 303
    col: 13
    role: z
    text: 已
  - page: 303
    col: 14
    role: j
    text: 曰敢問其次曰宗族稱孝焉鄉黨稱弟
  - page: 303
    col: 15
    role: j
    text: 焉
  - page: 303
    col: 16
    role: z
    text: 弟去聲○此本立而材不足者故為
  - page: 304
    col: 1
    role: j
    text: 其次
  - page: 304
    col: 2
    role: j
    text: 曰敢問其次曰言必信行必果硜硜然
  - page: 304
    col: 3
    role: j
    text: 小人哉抑亦可以爲次矣
  - page: 304
    col: 4
    role: z
    text: 行去聲硜苦耕反○果必行也硜小
  - page: 304
    col: 5
    role: z
    text: 石之堅確者小人言其識量之淺狹
  - page: 304
    col: 6
    role: z
    text: 也此其本末皆無足觀然亦不害其
  - page: 304
    col: 7
    role: z
    text: 爲自守也故聖人猶有取焉下此則
  - page: 304
    col: 8
    role: z
    text: 市井之人不復可爲士矣
  - page: 304
    col: 9
    role: j
    text: 曰今之從政者何如子曰噫斗筲之人
  - page: 304
    col: 10
    role: j
    text: 何足算也
  - page: 304
    col: 11
    role: z
    text: 筲所交反算亦作筭悉亂反○今之
  - page: 304
    col: 12
    role: z
    text: 從政者蓋如魯三家之屬噫心不平
  - page: 304
    col: 13
    role: z
    text: 聲斗量名容十升筲竹器容斗二升
  - page: 304
    col: 14
    role: z
    text: 斗筲之人言鄙細也算數也子貢之
  - page: 304
    col: 15
    role: z
    text: 問每下故夫子以是警之○程子曰
  - page: 304
    col: 16
    role: z
    text: 子貢之意蓋欲爲皎皎之行聞於人
  - page: 305
    col: 1
    role: j
    text: 者夫子告之皆篤實自得之事
  - page: 305
    col: 2
    role: j
    text: 子曰不得中行而與之必也狂狷乎狂
  - page: 305
    col: 3
    role: j
    text: 者進取狷者有所不為也
  - page: 305
    col: 4
    role: j
    text: 狷音絹○行道也狂者志極高而行
  - page: 305
    col: 5
    role: j
    text: 不掩狷者知未及而守有餘蓋聖人
  - page: 305
    col: 6
    role: j
    text: 本欲得中道之人而教之然既不可
  - page: 305
    col: 7
    role: j
    text: 得而徒得謹厚之人則未必能自振
  - page: 305
    col: 8
    role: j
    text: 拔而有為也故不若得此狂狷之人
  - page: 305
    col: 9
    role: j
    text: 猶可因其志節而激厲裁抑之以進
  - page: 305
    col: 10
    role: j
    text: 於道非與其終於此而已也○孟子
  - page: 305
    col: 11
    role: j
    text: 曰孔子豈不欲中道哉不可必得故
  - page: 305
    col: 12
    role: j
    text: 思其次也如琴張曾皙牧皮者孔子
  - page: 305
    col: 13
    role: j
    text: 之所謂狂也其志嘐嘐然曰古之人
  - page: 305
    col: 14
    role: j
    text: 古之人夷考其行而不掩焉者也狂
  - page: 305
    col: 15
    role: j
    text: 者又不可得欲得不屑不潔之士而
  - page: 305
    col: 16
    role: j
    text: 與之是狷也是又其次也
  - page: 306
    col: 1
    role: j
    text: 子曰南人有言曰人而無恆不可以作
  - page: 306
    col: 2
    role: j
    text: 巫醫善夫
  - page: 306
    col: 3
    role: z
    text: 恆胡登反夫音扶○南人南國之人
  - page: 306
    col: 4
    role: z
    text: 恆常久也巫所以交鬼神醫所以寄
  - page: 306
    col: 5
    role: z
    text: 死生故雖賤役而尤不可以無常孔
  - page: 306
    col: 6
    role: z
    text: 子稱其言而善之
  - page: 306
    col: 7
    role: j
    text: 不恆其德或承之羞
  - page: 306
    col: 8
    role: z
    text: 此易恆卦九三爻辭承進也
  - page: 306
    col: 9
    role: j
    text: 子曰不占而已矣
  - page: 306
    col: 10
    role: z
    text: 復加子曰以別易文也其義未詳○
  - page: 306
    col: 11
    role: z
    text: 楊氏曰君子於易苟玩其占則知無
  - page: 306
    col: 12
    role: z
    text: 常之取羞矣其為無常也蓋亦不占
  - page: 306
    col: 13
    role: z
    text: 而已矣意亦略通
  - page: 306
    col: 14
    role: j
    text: 子曰君子和而不同小人同而不和
  - page: 306
    col: 15
    role: z
    text: 和者無乖戾之心同者有阿比之意
  - page: 306
    col: 16
    role: z
    text: ○尹氏曰君子尚義故有不同小人
  - page: 307
    col: 1
    role: z
    text: 尚利安得而和
  - page: 307
    col: 2
    role: j
    text: 子貢問曰鄉人皆好之何如子曰未可
  - page: 307
    col: 3
    role: j
    text: 也鄉人皆惡之何如子曰未可也不如
  - page: 307
    col: 4
    role: j
    text: 鄉人之善者好之其不善者惡之
  - page: 307
    col: 5
    role: z
    text: 好惡並去聲○一鄉之人宜有公論
  - page: 307
    col: 6
    role: z
    text: 矣然其間亦各以類自為好惡也故
  - page: 307
    col: 7
    role: z
    text: 善者好之而惡者不惡則必其有苟
  - page: 307
    col: 8
    role: z
    text: 合之行惡者惡之而善者不好則必
  - page: 307
    col: 9
    role: z
    text: 其無可好之實
  - page: 307
    col: 10
    role: j
    text: 子曰君子易事而難說也說之不以道
  - page: 307
    col: 11
    role: j
    text: 不說也及其使人也器之小人難事而
  - page: 307
    col: 12
    role: j
    text: 易說也說之雖不以道說也及其使人
  - page: 307
    col: 13
    role: j
    text: 也求備焉
  - page: 307
    col: 14
    role: z
    text: 易去聲說音悅○器之謂隨其材器
  - page: 307
    col: 15
    role: z
    text: 而使之也君子之心公而恕小人之
  - page: 307
    col: 16
    role: z
    text: 心私而刻天理人欲之間每相反而
  - page: 308
    col: 1
    role: z
    text: 已矣
  - page: 308
    col: 2
    role: j
    text: 子曰君子泰而不驕小人驕而不泰
  - page: 308
    col: 3
    role: j
    text: 君子循理故安舒而不矜肆小人逞
  - page: 308
    col: 4
    role: z
    text: 欲故反是
  - page: 308
    col: 5
    role: j
    text: 子曰剛毅木訥近仁
  - page: 308
    col: 6
    role: z
    text: 程子曰木者質樸訥者遲鈍四者質
  - page: 308
    col: 7
    role: z
    text: 之近乎仁者也○楊氏曰剛毅則不
  - page: 308
    col: 8
    role: z
    text: 屈於物欲木訥則不至於外馳故近
  - page: 308
    col: 9
    role: z
    text: 仁
  - page: 308
    col: 10
    role: j
    text: 子路問曰何如斯可謂之士矣子曰切
  - page: 308
    col: 11
    role: j
    text: 切偲偲怡怡如也可謂士矣朋友切切
  - page: 308
    col: 12
    role: j
    text: 偲偲兄弟怡怡
  - page: 308
    col: 13
    role: z
    text: 胡氏曰切切懇到也偲偲詳勉也怡
  - page: 308
    col: 14
    role: z
    text: 怡和說也皆子路所不足故告之又
  - page: 308
    col: 15
    role: z
    text: 恐其混於所施則兄弟有賊恩之禍
  - page: 308
    col: 16
    role: z
    text: 朋友有善柔之損故又別而言之
  - page: 309
    col: 1
    role: j
    text: 子曰善人教民七年亦可以即戎矣
  - page: 309
    col: 2
    role: z
    text: 教民者教之孝悌忠信之行務農講
  - page: 309
    col: 3
    role: z
    text: 武之法即就也戎兵也民知親其上
  - page: 309
    col: 4
    role: z
    text: 死其長故可以即戎○程子曰七年
  - page: 309
    col: 5
    role: j
    text: 云者聖人度其時可矣如云朞月三
  - page: 309
    col: 6
    role: z
    text: 年百年一世大國五年小國七年之
  - page: 309
    col: 7
    role: z
    text: 類皆當思其作爲如何乃有益
  - page: 309
    col: 8
    role: j
    text: 子曰以不教民戰是謂棄之
  - page: 309
    col: 9
    role: z
    text: 以用也言用不教之民以戰必有敗
  - page: 309
    col: 10
    role: z
    text: 亡之禍是棄其民也
  - page: 309
    col: 11
    role: title
    text: 憲問第十四
  - page: 309
    col: 12
    role: z
    text: 胡氏曰此篇疑原憲所記凡四十七
  - page: 309
    col: 13
    role: z
    text: 章
  - page: 309
    col: 14
    role: j
    text: 憲問恥子曰邦有道穀邦無道穀恥也
  - page: 309
    col: 15
    role: z
    text: 憲原思名穀祿也邦有道不能有爲
  - page: 309
    col: 16
    role: z
    text: 邦無道不能獨善而但知食祿皆可
  - page: 310
    col: 1
    role: z
    text: 恥也憲之狷介其於邦無道穀之可
  - page: 310
    col: 2
    role: z
    text: 恥固知之矣至於邦有道穀之可恥
  - page: 310
    col: 3
    role: z
    text: 則未必知也故夫子因其問而并言
  - page: 310
    col: 4
    role: z
    text: 之以廣其志使知所以自勉而進於
  - page: 310
    col: 5
    role: z
    text: 有為也
  - page: 310
    col: 6
    role: j
    text: 克伐怨欲不行焉可以為仁矣
  - page: 310
    col: 7
    role: z
    text: 此亦原憲以其所能而問也克好勝
  - page: 310
    col: 8
    role: z
    text: 伐自矜怨忿恨欲貪欲
  - page: 310
    col: 9
    role: j
    text: 子曰可以為難矣仁則吾不知也
  - page: 310
    col: 10
    role: z
    text: 有是四者而能制之使不得行可謂
  - page: 310
    col: 11
    role: z
    text: 難矣仁則天理渾然自無四者之累
  - page: 310
    col: 12
    role: z
    text: 不行不足以言之也○程子曰人而
  - page: 310
    col: 13
    role: z
    text: 無克伐怨欲惟仁者能之有之而能
  - page: 310
    col: 14
    role: z
    text: 制其情使不行斯亦難能也謂之仁
  - page: 310
    col: 15
    role: z
    text: 則未也此聖人開示之深惜乎憲之
  - page: 310
    col: 16
    role: z
    text: 不能再問也或曰四者不行固不得
  - page: 311
    col: 1
    role: z
    text: 爲仁矣然亦豈非所謂克己之事求
  - page: 311
    col: 2
    role: z
    text: 仁之方乎曰克去己私以復乎禮則
  - page: 311
    col: 3
    role: z
    text: 私欲不留而天理之本然者得矣若
  - page: 311
    col: 4
    role: z
    text: 但制而不行則是未有拔去病根之
  - page: 311
    col: 5
    role: z
    text: 意而容其濳藏隱伏於胷中也豈克
  - page: 311
    col: 6
    role: z
    text: 己求仁之謂哉學者察於二者之間
  - page: 311
    col: 7
    role: z
    text: 則其所以求仁之功益親切而無滲
  - page: 311
    col: 8
    role: z
    text: 漏矣
  - page: 311
    col: 9
    role: j
    text: 子曰士而懷居不足以爲士矣
  - page: 311
    col: 10
    role: z
    text: 居謂意所便安處也
  - page: 311
    col: 11
    role: j
    text: 子曰邦有道危言危行邦無道危行言
  - page: 311
    col: 12
    role: j
    text: 孫
  - page: 311
    col: 13
    role: z
    text: 行孫並去聲○危高峻也孫卑順也
  - page: 311
    col: 14
    role: z
    text: 尹氏曰君子之持身不可變也至於
  - page: 311
    col: 15
    role: z
    text: 言則有時而不敢盡以避禍也然則
  - page: 311
    col: 16
    role: z
    text: 爲國者使士言孫豈不殆哉
  - page: 312
    col: 1
    role: j
    text: 子曰有德者必有言有言者不必有德
  - page: 312
    col: 2
    role: j
    text: 仁者必有勇勇者不必有仁
  - page: 312
    col: 3
    role: z
    text: 有德者和順積中英華發外能言者
  - page: 312
    col: 4
    role: z
    text: 或便佞口給而巳仁者心無私累見
  - page: 312
    col: 5
    role: z
    text: 義必爲勇者或血氣之強而巳○尹
  - page: 312
    col: 6
    role: z
    text: 氏曰有德者必有言徒能言者未必
  - page: 312
    col: 7
    role: z
    text: 有德也仁者志必勇徒能勇者未必
  - page: 312
    col: 8
    role: z
    text: 有仁也
  - page: 312
    col: 9
    role: j
    text: 南宫适問於孔子曰羿善射奡盪舟俱
  - page: 312
    col: 10
    role: j
    text: 不得其死然禹稷躬稼而有天下夫子
  - page: 312
    col: 11
    role: j
    text: 不答南宫适出子曰君子哉若人尚德
  - page: 312
    col: 12
    role: j
    text: 哉若人
  - page: 312
    col: 13
    role: z
    text: 适古活反羿音詣奡五報反盪土浪
  - page: 312
    col: 14
    role: z
    text: 反○南宫适即南容也羿有窮之君
  - page: 312
    col: 15
    role: z
    text: 善射滅夏后相而篡其位其臣寒浞
  - page: 312
    col: 16
    role: z
    text: 又殺羿而代之奡春秋傳作澆浞之
  - page: 313
    col: 1
    role: z
    text: 子也力能陸地行舟後爲夏后少康
  - page: 313
    col: 2
    role: z
    text: 所誅禹平水土曁稷播種身親稼穡
  - page: 313
    col: 3
    role: z
    text: 之事禹受舜禪而有天下稷之後至
  - page: 313
    col: 4
    role: z
    text: 周武王亦有天下适之意蓋以羿奡
  - page: 313
    col: 5
    role: z
    text: 比當世之有權力者而以禹稷比孔
  - page: 313
    col: 6
    role: z
    text: 子也故孔子不答然适之言如此可
  - page: 313
    col: 7
    role: z
    text: 謂君子之人而有尚德之心矣不可
  - page: 313
    col: 8
    role: z
    text: 以不與故俟其出而賛美之
  - page: 313
    col: 9
    role: j
    text: 子曰君子而不仁者有矣夫未有小人
  - page: 313
    col: 10
    role: j
    text: 而仁者也
  - page: 313
    col: 11
    role: z
    text: 夫音扶〇謝氏曰君子志於仁矣然
  - page: 313
    col: 12
    role: z
    text: 毫忽之間心不在焉則未免爲不仁
  - page: 313
    col: 13
    role: z
    text: 也
  - page: 313
    col: 14
    role: j
    text: 子曰愛之能勿勞乎忠焉能勿誨乎
  - page: 313
    col: 15
    role: z
    text: 蘇氏曰愛而勿勞禽犢之愛也忠而
  - page: 313
    col: 16
    role: z
    text: 勿誨婦寺之忠也愛而知勞之則其
  - page: 314
    col: 1
    role: z
    text: 爲愛也深矣忠而知誨之則其爲忠
  - page: 314
    col: 2
    role: z
    text: 也大矣
  - page: 314
    col: 3
    role: j
    text: 子曰爲命裨諶草創之世叔討論之行
  - page: 314
    col: 4
    role: j
    text: 人子羽脩飾之東里子産潤色之
  - page: 314
    col: 5
    role: z
    text: 裨婢之反諶時林反○裨諶以下四
  - page: 314
    col: 6
    role: z
    text: 人皆鄭大夫草略也創造也謂造爲
  - page: 314
    col: 7
    role: z
    text: 草藁也世叔游吉也春秋傳作子太
  - page: 314
    col: 8
    role: z
    text: 叔討尋究也論講議也行人掌使之
  - page: 314
    col: 9
    role: z
    text: 官子羽公孫揮也脩飾謂增損之東
  - page: 314
    col: 10
    role: z
    text: 里地名子産所居也潤色謂加以文
  - page: 314
    col: 11
    role: z
    text: 采也鄭國之爲辭命必更此四賢之
  - page: 314
    col: 12
    role: z
    text: 手而成詳審精密各盡所長是以應
  - page: 314
    col: 13
    role: z
    text: 對諸侯鮮有敗事孔子言此蓋善之
  - page: 314
    col: 14
    role: z
    text: 也
  - page: 314
    col: 15
    role: j
    text: 或問子産子曰惠人也
  - page: 314
    col: 16
    role: z
    text: 子産之政不專於寛然其心則一以
  - page: 315
    col: 1
    role: z
    text: 愛人爲主故孔子以爲惠人蓋舉其
  - page: 315
    col: 2
    role: z
    text: 重而言也
  - page: 315
    col: 3
    role: j
    text: 問子西曰彼哉彼哉
  - page: 315
    col: 4
    role: z
    text: 子西楚公子申能遜楚國立昭王而
  - page: 315
    col: 5
    role: z
    text: 改紀其政亦賢大夫也然不能革其
  - page: 315
    col: 6
    role: z
    text: 僭王之號昭王欲用孔子又沮止之
  - page: 315
    col: 7
    role: z
    text: 其後卒召白公以致禍亂則其爲人
  - page: 315
    col: 8
    role: z
    text: 可知矣彼哉者外之之詞
  - page: 315
    col: 9
    role: j
    text: 問管仲曰人也奪伯氏駢邑三百飯疏
  - page: 315
    col: 10
    role: j
    text: 食没齒無怨言
  - page: 315
    col: 11
    role: z
    text: 人也猶言此人也伯氏齊大夫駢邑
  - page: 315
    col: 12
    role: z
    text: 地名齒年也蓋威公奪伯氏之邑以
  - page: 315
    col: 13
    role: z
    text: 與管仲伯氏自知己罪而心服管仲
  - page: 315
    col: 14
    role: z
    text: 之功故窮約以終身而無怨言荀卿
  - page: 315
    col: 15
    role: z
    text: 所謂與之書社三百而富人莫之敢
  - page: 315
    col: 16
    role: z
    text: 拒者即此事也○或問管仲子產孰
  - page: 316
    col: 1
    role: z
    text: 優曰管仲之德不勝其才子產之才
  - page: 316
    col: 2
    role: z
    text: 不勝其德然於聖人之學則槩乎其
  - page: 316
    col: 3
    role: z
    text: 未有聞也
  - page: 316
    col: 4
    role: j
    text: 子曰貧而無怨難冨而無驕易
  - page: 316
    col: 5
    role: z
    text: 易去聲○處貧難處冨易人之常情
  - page: 316
    col: 6
    role: z
    text: 然人當勉其難而不可忽其易也
  - page: 316
    col: 7
    role: j
    text: 子曰孟公綽爲趙魏老則優不可以爲
  - page: 316
    col: 8
    role: j
    text: 滕薛大夫
  - page: 316
    col: 9
    role: z
    text: 公綽魯大夫趙魏晉卿之家老家臣
  - page: 316
    col: 10
    role: z
    text: 之長大家勢重而無諸侯之事家老
  - page: 316
    col: 11
    role: z
    text: 望尊而無官守之責優有餘也滕薛
  - page: 316
    col: 12
    role: z
    text: 二國名大夫任國政者滕薛國小政
  - page: 316
    col: 13
    role: z
    text: 繁大夫位高責重然則公綽蓋廉靜
  - page: 316
    col: 14
    role: z
    text: 寡欲而短於才者也○楊氏曰知之
  - page: 316
    col: 15
    role: z
    text: 弗豫枉其才而用之則爲棄人矣此
  - page: 316
    col: 16
    role: z
    text: 君子所以患不知人也言此則孔子
  - page: 317
    col: 1
    role: z
    text: 之用人可知矣
  - page: 317
    col: 2
    role: j
    text: 子路問成人子曰若臧武仲之知公綽
  - page: 317
    col: 3
    role: j
    text: 之不欲卞莊子之勇冉求之藝文之以
  - page: 317
    col: 4
    role: j
    text: 禮樂亦可以爲成人矣
  - page: 317
    col: 5
    role: z
    text: 知去聲○成人猶言全人武仲魯大
  - page: 317
    col: 6
    role: z
    text: 夫名紇莊子魯卞邑大夫言兼此四
  - page: 317
    col: 7
    role: z
    text: 子之長則知足以窮理廉足以養心
  - page: 317
    col: 8
    role: z
    text: 勇足以力行藝足以泛應而又節之
  - page: 317
    col: 9
    role: z
    text: 以禮和之以樂使德成於內而文見
  - page: 317
    col: 10
    role: z
    text: 乎外則材全德備渾然不見一善成
  - page: 317
    col: 11
    role: z
    text: 名之迹中正和樂粹然無復偏倚駮
  - page: 317
    col: 12
    role: z
    text: 雜之蔽而其爲人也亦成矣然亦之
  - page: 317
    col: 13
    role: z
    text: 爲言非其至者蓋就子路之所可及
  - page: 317
    col: 14
    role: z
    text: 而語之也若論其至則非聖人之盡
  - page: 317
    col: 15
    role: z
    text: 人道不足以語此
  - page: 317
    col: 16
    role: j
    text: 曰今之成人者何必然見利思義見危
  - page: 318
    col: 1
    role: j
    text: 授命乆要不忘平生之言亦可以爲成
  - page: 318
    col: 2
    role: j
    text: 人矣
  - page: 318
    col: 3
    role: z
    text: 復加曰字者旣答而復言也授命言
  - page: 318
    col: 4
    role: z
    text: 不愛其生持以與人也乆要舊約也
  - page: 318
    col: 5
    role: z
    text: 平生平日也有是忠信之實則雖其
  - page: 318
    col: 6
    role: z
    text: 才知禮樂有所未備亦可以爲成人
  - page: 318
    col: 7
    role: z
    text: 之次也○程子曰知之明信之篤行
  - page: 318
    col: 8
    role: z
    text: 之果天下之達德也若孔子所謂成
  - page: 318
    col: 9
    role: z
    text: 人亦不出此三者武仲知也公綽仁
  - page: 318
    col: 10
    role: z
    text: 也卞莊子勇也須是合此四人之能
  - page: 318
    col: 11
    role: z
    text: 文之以禮樂亦可以爲成人矣然而
  - page: 318
    col: 12
    role: z
    text: 論其大成則不止於此若今之成人
  - page: 318
    col: 13
    role: z
    text: 有忠信而不及於禮樂則又其次者
  - page: 318
    col: 14
    role: z
    text: 也又曰臧武仲之知非正也若文之
  - page: 318
    col: 15
    role: z
    text: 以禮樂則無不正矣又曰語成人之
  - page: 318
    col: 16
    role: z
    text: 名非聖人孰能之孟子曰惟聖人然
  - page: 319
    col: 1
    role: z
    text: 後可以踐形如此方可以稱成人之
  - page: 319
    col: 2
    role: z
    text: 名○胡氏曰今之成人以下乃子路
  - page: 319
    col: 3
    role: z
    text: 之言蓋不復聞斯行之之勇而有終
  - page: 319
    col: 4
    role: z
    text: 身誦之之固矣未詳是否
  - page: 319
    col: 5
    role: j
    text: 子問公叔文子於公明賈曰信乎夫子
  - page: 319
    col: 6
    role: j
    text: 不言不笑不取乎
  - page: 319
    col: 7
    role: z
    text: 公叔文子衛大夫公孫枝也公明姓
  - page: 319
    col: 8
    role: z
    text: 賈名亦衛人文子爲人其詳不可知
  - page: 319
    col: 9
    role: z
    text: 然必廉靜之士故當時以三者稱之
  - page: 319
    col: 10
    role: j
    text: 公明賈對曰以告者過也夫子時然後
  - page: 319
    col: 11
    role: j
    text: 言人不厭其言樂然後笑人不厭其笑
  - page: 319
    col: 12
    role: j
    text: 義然後取人不厭其取子曰其然豈其
  - page: 319
    col: 13
    role: j
    text: 然乎
  - page: 319
    col: 14
    role: z
    text: 厭者苦其多而惡之之辭事適其可
  - page: 319
    col: 15
    role: z
    text: 則人不厭而不覺其有是矣是以稱
  - page: 319
    col: 16
    role: z
    text: 之或過而以爲不言不笑不取也然
  - page: 320
    col: 1
    role: z
    text: 此言也非禮義充溢於中得時措之
  - page: 320
    col: 2
    role: z
    text: 冝者不能文子雖賢疑未及此但君
  - page: 320
    col: 3
    role: j
    text: 子與人爲善不欲正言其非也故曰
  - page: 320
    col: 4
    role: z
    text: 其然豈其然乎蓋疑之也
  - page: 320
    col: 5
    role: j
    text: 子曰臧武仲以防求爲後於魯雖曰不
  - page: 320
    col: 6
    role: j
    text: 要君吾不信也
  - page: 320
    col: 7
    role: z
    text: 要平聲○防地名武仲所封邑也要
  - page: 320
    col: 8
    role: z
    text: 有挾而求也武仲得罪奔邾自邾如
  - page: 320
    col: 9
    role: z
    text: 防使請立後而避邑以示若不得請
  - page: 320
    col: 10
    role: z
    text: 則將據邑以叛是要君也○范氏曰
  - page: 320
    col: 11
    role: z
    text: 要君者無上罪之大者也武仲之邑
  - page: 320
    col: 12
    role: z
    text: 受之於君得罪出奔則立後在君非
  - page: 320
    col: 13
    role: z
    text: 己所得專也而據邑以請由其好智
  - page: 320
    col: 14
    role: z
    text: 而不好學也○楊氏曰武仲卑辭請
  - page: 320
    col: 15
    role: z
    text: 後其跡非要君者而意實要之夫子
  - page: 320
    col: 16
    role: z
    text: 之言亦春秋誅意之法也
  - page: 321
    col: 1
    role: j
    text: 子曰晉文公譎而不正齊桓公正而不
  - page: 321
    col: 2
    role: j
    text: 譎
  - page: 321
    col: 3
    role: z
    text: 譎古穴反晉文公公名重耳齊威公
  - page: 321
    col: 4
    role: z
    text: 名小白譎詭也二公皆諸侯盟主攘
  - page: 321
    col: 5
    role: z
    text: 夷狄以尊周室者也雖其以力假仁
  - page: 321
    col: 6
    role: z
    text: 心皆不正然威公伐楚仗義執言不
  - page: 321
    col: 7
    role: z
    text: 由詭道猶爲彼善於此文公則伐衛
  - page: 321
    col: 8
    role: z
    text: 以致楚而隂謀以取勝其譎甚矣二
  - page: 321
    col: 9
    role: z
    text: 君他事亦多類此故夫子言此以發
  - page: 321
    col: 10
    role: z
    text: 其隱
  - page: 321
    col: 11
    role: j
    text: 子路曰桓公殺公子糾召忽死之管仲
  - page: 321
    col: 12
    role: j
    text: 不死曰未仁乎
  - page: 321
    col: 13
    role: z
    text: 糾居黝反召音邵按春秋傳齊襄
  - page: 321
    col: 14
    role: z
    text: 公無道鮑叔牙奉公子小白奔莒及
  - page: 321
    col: 15
    role: z
    text: 無知弑襄公管夷吾召忽奉公子糾
  - page: 321
    col: 16
    role: z
    text: 奔魯魯人納之未克而小白入是爲
  - page: 322
    col: 1
    role: z
    text: 威公使魯殺子糾而請管召召忽死
  - page: 322
    col: 2
    role: z
    text: 之管仲請囚鮑叔牙言於威公以爲
  - page: 322
    col: 3
    role: z
    text: 相子路疑管仲忘君事讎忍心害理
  - page: 322
    col: 4
    role: z
    text: 不得爲仁也
  - page: 322
    col: 5
    role: j
    text: 子曰桓公九合諸侯不以兵車管仲之
  - page: 322
    col: 6
    role: j
    text: 力也如其仁如其仁
  - page: 322
    col: 7
    role: z
    text: 九春秋傳作糾督也古字通用不以
  - page: 322
    col: 8
    role: z
    text: 兵車言不假威力也如其仁言誰如
  - page: 322
    col: 9
    role: z
    text: 其仁者又再言以深許之蓋管仲雖
  - page: 322
    col: 10
    role: z
    text: 未得爲仁人而其利澤及人則有仁
  - page: 322
    col: 11
    role: z
    text: 之功矣
  - page: 322
    col: 12
    role: j
    text: 子貢曰管仲非仁者與桓公殺公子糾
  - page: 322
    col: 13
    role: j
    text: 不能死又相之
  - page: 322
    col: 14
    role: z
    text: 與平聲相去聲○子貢意不死猶可
  - page: 322
    col: 15
    role: z
    text: 相之則巳甚矣
  - page: 322
    col: 16
    role: j
    text: 子曰管仲相桓公霸諸侯一匡天下民
  - page: 323
    col: 1
    role: j
    text: 到于今受其賜微管仲吾其被髮左衽
  - page: 323
    col: 2
    role: j
    text: 矣
  - page: 323
    col: 3
    role: z
    text: 被皮寄反任而審反○霸與伯同長
  - page: 323
    col: 4
    role: z
    text: 也匡正也尊周室攘夷狄皆所以正
  - page: 323
    col: 5
    role: z
    text: 天下也微無也衽衣衿也被髮左衽
  - page: 323
    col: 6
    role: z
    text: 夷狄之俗也
  - page: 323
    col: 7
    role: j
    text: 豈若匹夫匹婦之為諒也自經於溝瀆
  - page: 323
    col: 8
    role: j
    text: 而莫之知也
  - page: 323
    col: 9
    role: z
    text: 諒小信也經縊也莫之知人不知也
  - page: 323
    col: 10
    role: z
    text: 後漢書引此文莫字上有人字○程
  - page: 323
    col: 11
    role: z
    text: 子曰威公兄也子糾弟也仲私於所
  - page: 323
    col: 12
    role: z
    text: 事輔之以爭國非義也威公殺之雖
  - page: 323
    col: 13
    role: z
    text: 過而糾之死實當仲始與之同謀遂
  - page: 323
    col: 14
    role: z
    text: 與之同死可也知輔之爭為不義將
  - page: 323
    col: 15
    role: z
    text: 自免以圖後功亦可也故聖人不責
  - page: 323
    col: 16
    role: z
    text: 其死而稱其功若使威弟而糾兄管
  - page: 324
    col: 1
    role: z
    text: 仲所輔者正威奪其國而殺之則管
  - page: 324
    col: 2
    role: z
    text: 仲之與威不可同世之讎也若計其
  - page: 324
    col: 3
    role: z
    text: 後功而與其事威聖人之言無乃害
  - page: 324
    col: 4
    role: z
    text: 義之甚啓萬世反覆不忠之亂乎如
  - page: 324
    col: 5
    role: z
    text: 唐之王珪魏證不死建成之難而從
  - page: 324
    col: 6
    role: z
    text: 太宗可謂害於義矣後雖有功何足
  - page: 324
    col: 7
    role: z
    text: 贖哉愚謂管仲有功而無罪故聖人
  - page: 324
    col: 8
    role: z
    text: 獨稱其功王魏先有罪而後有功則
  - page: 324
    col: 9
    role: z
    text: 不以相掩可也
  - page: 324
    col: 10
    role: j
    text: 公叔文子之臣大夫僎與文子同升諸
  - page: 324
    col: 11
    role: j
    text: 公
  - page: 324
    col: 12
    role: z
    text: 僎士免反○臣家臣公公朝謂薦之
  - page: 324
    col: 13
    role: z
    text: 與己同進爲公朝之臣也
  - page: 324
    col: 14
    role: j
    text: 子聞之曰可以爲文矣
  - page: 324
    col: 15
    role: z
    text: 文者順理而成章之謂謚法亦有所
  - page: 324
    col: 16
    role: z
    text: 謂錫民爵位曰文者○洪氏曰家臣
  - page: 325
    col: 1
    role: j
    text: 之賤而引之使與己並有三善焉知
  - page: 325
    col: 2
    role: z
    text: 人一也忘己二也事君三也
  - page: 325
    col: 3
    role: j
    text: 子言衛靈公之無道也康子曰夫如是
  - page: 325
    col: 4
    role: j
    text: 奚而不喪
  - page: 325
    col: 5
    role: z
    text: 夫音扶喪去聲○喪失位也
  - page: 325
    col: 6
    role: j
    text: 孔子曰仲叔圉治賔客祝鮀治宗廟王
  - page: 325
    col: 7
    role: j
    text: 孫賈治軍旅夫如是奚其喪
  - page: 325
    col: 8
    role: z
    text: 仲叔圉即孔文子也三人皆衛臣雖
  - page: 325
    col: 9
    role: j
    text: 未必賢而其才可用靈公用之又各
  - page: 325
    col: 10
    role: j
    text: 當其才○尹氏曰衛靈公之無道宜
  - page: 325
    col: 11
    role: j
    text: 喪也而能用此三人猶足以保其國
  - page: 325
    col: 12
    role: j
    text: 而況有道之君能用天下之賢才者
  - page: 325
    col: 13
    role: j
    text: 乎詩曰無競維人四方其訓之
  - page: 325
    col: 14
    role: j
    text: 子曰其言之不怍則爲之也難
  - page: 325
    col: 15
    role: z
    text: 大言不慙則無必爲之志而不自度
  - page: 325
    col: 16
    role: z
    text: 其能否矣欲踐其言豈不難哉
  - page: 326
    col: 1
    role: j
    text: 陳成子弑簡公
  - page: 326
    col: 2
    role: z
    text: 成子齊大夫名恒簡公齊君名壬事
  - page: 326
    col: 3
    role: z
    text: 在春秋哀公十四年
  - page: 326
    col: 4
    role: j
    text: 孔子沐浴而朝告於哀公曰陳恒弑其
  - page: 326
    col: 5
    role: j
    text: 君請討之
  - page: 326
    col: 6
    role: z
    text: 朝音潮○是時孔子致事居魯沐浴
  - page: 326
    col: 7
    role: z
    text: 齊戒以告君重其事而不敢忽也臣
  - page: 326
    col: 8
    role: z
    text: 弑其君人倫之大變天理所不容人
  - page: 326
    col: 9
    role: z
    text: 人得而誅之况鄰國乎故夫子雖已
  - page: 326
    col: 10
    role: z
    text: 告老而猶請哀公討之
  - page: 326
    col: 11
    role: j
    text: 公曰告夫三子
  - page: 326
    col: 12
    role: z
    text: 夫音扶下告夫同○三子三家也時
  - page: 326
    col: 13
    role: z
    text: 政在三家哀公不得自專故使孔子
  - page: 326
    col: 14
    role: z
    text: 告之
  - page: 326
    col: 15
    role: j
    text: 孔子曰以吾從大夫之後不敢不告也
  - page: 326
    col: 16
    role: j
    text: 君曰告夫三子者
  - page: 327
    col: 1
    role: z
    text: 孔子出而自言如此意謂弑君之賊
  - page: 327
    col: 2
    role: z
    text: 法所必討大夫謀國義所當告君乃
  - page: 327
    col: 3
    role: z
    text: 不能自命三子而使我告之耶
  - page: 327
    col: 4
    role: j
    text: 之三子告不可孔子曰以吾從大夫之
  - page: 327
    col: 5
    role: j
    text: 後不敢不告也
  - page: 327
    col: 6
    role: z
    text: 以君命往告而三子魯之彊臣素有
  - page: 327
    col: 7
    role: z
    text: 無君之心實與陳氏聲勢相倚故沮
  - page: 327
    col: 8
    role: z
    text: 其謀而夫子復以此應之其所以警
  - page: 327
    col: 9
    role: z
    text: 之者深矣○程子曰左氏記孔子之
  - page: 327
    col: 10
    role: z
    text: 言曰陳恒弑其君民之不予者半以
  - page: 327
    col: 11
    role: z
    text: 魯之衆加齊之半可克也此非孔子
  - page: 327
    col: 12
    role: z
    text: 之言誠若此言是以力不以義也若
  - page: 327
    col: 13
    role: z
    text: 孔子之志必將正名其罪上告天子
  - page: 327
    col: 14
    role: z
    text: 下告方伯而率與國以討之至於所
  - page: 327
    col: 15
    role: z
    text: 以勝齊者孔子之餘事也豈計魯人
  - page: 327
    col: 16
    role: z
    text: 之衆寡哉當是時天下之亂極矣因
  - page: 328
    col: 1
    role: z
    text: 是足以正之周室其復興乎魯之君
  - page: 328
    col: 2
    role: z
    text: 臣終不從之可勝惜哉○胡氏曰春
  - page: 328
    col: 3
    role: z
    text: 秋之法弑君之賊人得而討之仲尼
  - page: 328
    col: 4
    role: z
    text: 此舉先發後聞可也
  - page: 328
    col: 5
    role: j
    text: 子路問事君子曰勿欺也而犯之
  - page: 328
    col: 6
    role: z
    text: 犯謂犯顔諫争○范氏曰犯非子路
  - page: 328
    col: 7
    role: z
    text: 之所難也而以不欺爲難故夫子教
  - page: 328
    col: 8
    role: z
    text: 以先勿欺而後犯也
  - page: 328
    col: 9
    role: j
    text: 子曰君子上達小人下達
  - page: 328
    col: 10
    role: z
    text: 君子反天理故日進乎高明小人徇
  - page: 328
    col: 11
    role: z
    text: 人欲故日究乎汙下
  - page: 328
    col: 12
    role: j
    text: 子曰古之學者爲已今之學者爲人
  - page: 328
    col: 13
    role: z
    text: 爲去聲○程子曰爲已欲得之於己
  - page: 328
    col: 14
    role: z
    text: 也爲人欲見知於人也○程子曰古
  - page: 328
    col: 15
    role: z
    text: 之學者爲已其終至於成物今之學
  - page: 328
    col: 16
    role: z
    text: 者爲人其終至於喪已愚按聖賢論
  - page: 329
    col: 1
    role: j
    text: 學者用心得失之際其說多矣然未
  - page: 329
    col: 2
    role: z
    text: 有如此言之切而要者於此明辨而
  - page: 329
    col: 3
    role: j
    text: 日省之則庶乎其不昧於所從矣
  - page: 329
    col: 4
    role: j
    text: 蘧伯玉使人於孔子
  - page: 329
    col: 5
    role: z
    text: 使去聲下同○蘧伯玉衛大夫名瑗
  - page: 329
    col: 6
    role: j
    text: 孔子居衛嘗主於其家既而反魯故
  - page: 329
    col: 7
    role: z
    text: 伯玉使人來也
  - page: 329
    col: 8
    role: j
    text: 孔子與之坐而問焉曰夫子何為對曰
  - page: 329
    col: 9
    role: j
    text: 夫子欲寡其過而未能也使者出子曰
  - page: 329
    col: 10
    role: j
    text: 使乎使乎
  - page: 329
    col: 11
    role: z
    text: 與之坐敬其主以及其使也夫子指
  - page: 329
    col: 12
    role: z
    text: 伯玉也言其但欲寡過而猶未能則
  - page: 329
    col: 13
    role: z
    text: 其省身克己常若不及之意可見矣
  - page: 329
    col: 14
    role: z
    text: 使者之言愈自卑約而其主之賢益
  - page: 329
    col: 15
    role: z
    text: 彰亦可謂深知君子之心而善於詞
  - page: 329
    col: 16
    role: z
    text: 令者矣故夫子再言使乎以重美之
  - page: 330
    col: 1
    role: z
    text: 按莊周稱伯玉行年五十而知四十
  - page: 330
    col: 2
    role: z
    text: 九年之非又曰伯玉行年六十而六
  - page: 330
    col: 3
    role: z
    text: 十化蓋其進德之功老而不倦是以
  - page: 330
    col: 4
    role: z
    text: 踐履篤實光輝宣著不唯使者知之
  - page: 330
    col: 5
    role: z
    text: 而夫子亦信之也
  - page: 330
    col: 6
    role: j
    text: 子曰不在其位不謀其政
  - page: 330
    col: 7
    role: z
    text: 重出
  - page: 330
    col: 8
    role: j
    text: 曾子曰君子思不出其位
  - page: 330
    col: 9
    role: z
    text: 此艮卦之象也曾子蓋嘗稱之記者
  - page: 330
    col: 10
    role: z
    text: 因上章之語而類記之也○范氏曰
  - page: 330
    col: 11
    role: z
    text: 物各止其所而天下之理得矣故君
  - page: 330
    col: 12
    role: z
    text: 子所思不出其位而君臣上下大小
  - page: 330
    col: 13
    role: z
    text: 皆得其職也
  - page: 330
    col: 14
    role: j
    text: 子曰君子恥其言而過其行
  - page: 330
    col: 15
    role: z
    text: 行去聲○恥者不敢盡之意過者欲
  - page: 330
    col: 16
    role: z
    text: 有餘之詞
  - page: 331
    col: 1
    role: j
    text: 子曰君子道者三我無能焉仁者不憂
  - page: 331
    col: 2
    role: j
    text: 知者不惑勇者不懼
  - page: 331
    col: 3
    role: z
    text: 知去聲○自責以勉人也
  - page: 331
    col: 4
    role: j
    text: 子貢曰夫子自道也
  - page: 331
    col: 5
    role: z
    text: 道言也自道猶云謙辭○尹氏曰成
  - page: 331
    col: 6
    role: z
    text: 德以仁爲先進學以智爲先故夫子
  - page: 331
    col: 7
    role: z
    text: 之言其序有不同者以此
  - page: 331
    col: 8
    role: j
    text: 子貢方人子曰賜也賢乎哉夫我則不
  - page: 331
    col: 9
    role: j
    text: 暇
  - page: 331
    col: 10
    role: z
    text: 夫音扶○方比也乎哉疑辭比方人
  - page: 331
    col: 11
    role: z
    text: 物而較其短長雖亦窮理之事然專
  - page: 331
    col: 12
    role: z
    text: 務爲此則心馳於外而所以自治者
  - page: 331
    col: 13
    role: z
    text: 踈矣故褒之而疑其詞復自貶以深
  - page: 331
    col: 14
    role: z
    text: 抑之○謝氏曰聖人責人辭不迫切
  - page: 331
    col: 15
    role: z
    text: 而意已獨至如此
  - page: 331
    col: 16
    role: j
    text: 子曰不患人之不已知患其不能也
  - page: 332
    col: 1
    role: z
    text: 凡章指同而文不異者一言而重出
  - page: 332
    col: 2
    role: z
    text: 也文小異者屢言而各出也此章凡
  - page: 332
    col: 3
    role: z
    text: 四見而文皆有異則聖人於此一事
  - page: 332
    col: 4
    role: z
    text: 蓋屢言之其丁寧之意亦可見矣
  - page: 332
    col: 5
    role: j
    text: 子曰不逆詐不億不信抑亦先覺者是
  - page: 332
    col: 6
    role: j
    text: 賢乎
  - page: 332
    col: 7
    role: z
    text: 逆未至而迎之也億未見而意之也
  - page: 332
    col: 8
    role: z
    text: 詐謂人欺己不信謂人疑己抑反語
  - page: 332
    col: 9
    role: z
    text: 辭言雖不逆不億而於人之情偽自
  - page: 332
    col: 10
    role: z
    text: 然先覺乃為賢也○楊氏曰君子一
  - page: 332
    col: 11
    role: z
    text: 於誠而已然未有誠而不明者故雖
  - page: 332
    col: 12
    role: z
    text: 不逆詐不億不信而常先覺也若夫
  - page: 332
    col: 13
    role: z
    text: 不逆不億而卒為小人所罔焉斯亦
  - page: 332
    col: 14
    role: z
    text: 不足觀也已
  - page: 332
    col: 15
    role: j
    text: 微生畝謂孔子曰丘何為是栖栖者與
  - page: 332
    col: 16
    role: j
    text: 無乃為佞乎
  - page: 333
    col: 1
    role: z
    text: 與平聲○微生姓畝名也畝名呼夫
  - page: 333
    col: 2
    role: z
    text: 子而辭甚倨蓋有齒德而隱者栖栖
  - page: 333
    col: 3
    role: z
    text: 依依也爲佞言其務爲口給以悅人
  - page: 333
    col: 4
    role: z
    text: 也
  - page: 333
    col: 5
    role: j
    text: 孔子曰非敢爲佞也疾固也
  - page: 333
    col: 6
    role: z
    text: 疾惡也固執一而不通也聖人之於
  - page: 333
    col: 7
    role: z
    text: 達尊禮恭而言直如此其警之亦深
  - page: 333
    col: 8
    role: z
    text: 矣
  - page: 333
    col: 9
    role: j
    text: 子曰驥不稱其力稱其德也
  - page: 333
    col: 10
    role: z
    text: 驥善馬之名德謂調良也○尹氏曰
  - page: 333
    col: 11
    role: z
    text: 驥雖有力其稱在德人有才而無德
  - page: 333
    col: 12
    role: z
    text: 則亦奚足尚哉
  - page: 333
    col: 13
    role: j
    text: 或曰以德報怨何如
  - page: 333
    col: 14
    role: z
    text: 或人所稱今見老子書德謂恩惠也
  - page: 333
    col: 15
    role: j
    text: 子曰何以報德
  - page: 333
    col: 16
    role: z
    text: 言於其所怨旣以德報之矣則人之
  - page: 334
    col: 1
    role: z
    text: 有德於我者又將何以報之乎
  - page: 334
    col: 2
    role: j
    text: 以直報怨以德報德
  - page: 334
    col: 3
    role: z
    text: 於其所怨者愛憎取捨一以至公而
  - page: 334
    col: 4
    role: z
    text: 無私所謂直也於其所德者則必以
  - page: 334
    col: 5
    role: z
    text: 德報之不可忘也○或人之言可謂
  - page: 334
    col: 6
    role: z
    text: 厚矣然以聖人之言觀之則見其出
  - page: 334
    col: 7
    role: z
    text: 於有意之私而怨德之報皆不得其
  - page: 334
    col: 8
    role: z
    text: 平也必如夫子之言然後二者之報
  - page: 334
    col: 9
    role: z
    text: 各得其所然怨有不讎而德無不報
  - page: 334
    col: 10
    role: z
    text: 則又未嘗不厚也此章之言明白簡
  - page: 334
    col: 11
    role: z
    text: 約而其指意曲折反復如造化之簡
  - page: 334
    col: 12
    role: z
    text: 易易知而微妙無窮學者所宜詳玩
  - page: 334
    col: 13
    role: z
    text: 也
  - page: 334
    col: 14
    role: j
    text: 子曰莫我知也夫
  - page: 334
    col: 15
    role: z
    text: 夫音扶○夫子自歎以發子貢之問
  - page: 334
    col: 16
    role: z
    text: 也
  - page: 335
    col: 1
    role: j
    text: 子貢曰何爲其莫知子也子曰不怨天
  - page: 335
    col: 2
    role: j
    text: 不尤人下學而上逹知我者其天乎
  - page: 335
    col: 3
    role: j
    text: 不得於天而不怨天不合於人而不
  - page: 335
    col: 4
    role: z
    text: 尤人但知下學而自然上逹此但自
  - page: 335
    col: 5
    role: z
    text: 言其反己自修循序漸進耳無以甚
  - page: 335
    col: 6
    role: z
    text: 異於人而致其知也然深味其語意
  - page: 335
    col: 7
    role: z
    text: 則見其中自有人不及知而天獨知
  - page: 335
    col: 8
    role: z
    text: 之之妙蓋在孔門唯子貢之智幾足
  - page: 335
    col: 9
    role: z
    text: 以及此故特語以發之惜乎其猶有
  - page: 335
    col: 10
    role: z
    text: 所未逹也○程子曰不怨天不尤人
  - page: 335
    col: 11
    role: j
    text: 在理當如此又曰下學上逹意在言表
  - page: 335
    col: 12
    role: z
    text: 又曰學者須守下學上逹之語乃學
  - page: 335
    col: 13
    role: z
    text: 之要蓋凡下學人事便是上逹天理
  - page: 335
    col: 14
    role: z
    text: 然習而不察則亦不能以上逹矣公
  - page: 335
    col: 15
    role: j
    text: 伯寮愬子路於季孫子服景伯以告曰
  - page: 335
    col: 16
    role: j
    text: 夫子固有惑志於公伯寮吾力猶能
  - page: 336
    col: 1
    role: j
    text: 肆諸市朝
  - page: 336
    col: 2
    role: z
    text: 朝音潮○公伯寮魯人子服氏景謚
  - page: 336
    col: 3
    role: z
    text: 伯字魯大夫子服何也夫子指季孫
  - page: 336
    col: 4
    role: z
    text: 言其有疑於寮之言也肆陳尸也言
  - page: 336
    col: 5
    role: z
    text: 欲誅寮
  - page: 336
    col: 6
    role: j
    text: 子曰道之將行也與命也道之將廢也
  - page: 336
    col: 7
    role: j
    text: 與命也公伯寮其如命何
  - page: 336
    col: 8
    role: z
    text: 與平聲○謝氏曰雖寮之愬行亦命
  - page: 336
    col: 9
    role: z
    text: 也其實寮無如之何愚謂言此以曉
  - page: 336
    col: 10
    role: z
    text: 景伯安子路而警伯寮耳聖人於利
  - page: 336
    col: 11
    role: z
    text: 害之際則不待決於命而後安然也
  - page: 336
    col: 12
    role: j
    text: 子曰賢者辟世
  - page: 336
    col: 13
    role: z
    text: 辟去聲下同○天下無道而隱若伯
  - page: 336
    col: 14
    role: z
    text: 夷太公是也
  - page: 336
    col: 15
    role: j
    text: 其次辟地
  - page: 336
    col: 16
    role: z
    text: 去亂國適治邦
  - page: 337
    col: 1
    role: j
    text: 其次辟色
  - page: 337
    col: 2
    role: z
    text: 禮貌衰而去
  - page: 337
    col: 3
    role: j
    text: 其次辟言
  - page: 337
    col: 4
    role: z
    text: 有違言而後去也○程子曰四者雖
  - page: 337
    col: 5
    role: z
    text: 以大小次第言之然非有優劣也所
  - page: 337
    col: 6
    role: z
    text: 遇不同爾
  - page: 337
    col: 7
    role: j
    text: 子曰作者七人矣
  - page: 337
    col: 8
    role: z
    text: 李氏曰作起也言起隱去者今七
  - page: 337
    col: 9
    role: z
    text: 人矣不可知其誰何必求其人以實
  - page: 337
    col: 10
    role: z
    text: 之則鑿矣
  - page: 337
    col: 11
    role: j
    text: 子路宿於石門晨門曰奚自子路曰自
  - page: 337
    col: 12
    role: j
    text: 孔氏曰是知其不可而爲之者與
  - page: 337
    col: 13
    role: z
    text: 與平聲○石門地名晨門掌晨啓門
  - page: 337
    col: 14
    role: z
    text: 蓋賢人隱於抱關者也自從也問其
  - page: 337
    col: 15
    role: z
    text: 何所從來也胡氏曰晨門知世之不
  - page: 337
    col: 16
    role: z
    text: 可而不爲故以是譏孔子然不知聖
  - page: 338
    col: 1
    role: j
    text: 人之視天下無不可爲之時也
  - page: 338
    col: 2
    role: j
    text: 子擊磬於衛有荷蕢而過孔氏之門者
  - page: 338
    col: 3
    role: j
    text: 曰有心哉擊磬乎
  - page: 338
    col: 4
    role: z
    text: 荷去聲○磬樂器荷擔也蕢草器也
  - page: 338
    col: 5
    role: z
    text: 此荷蕢者亦隱士也聖人之心未嘗
  - page: 338
    col: 6
    role: z
    text: 忘天下此人聞其磬聲而知之則亦
  - page: 338
    col: 7
    role: z
    text: 非常人矣
  - page: 338
    col: 8
    role: j
    text: 旣而曰鄙哉硜硜乎莫己知也斯巳而
  - page: 338
    col: 9
    role: j
    text: 巳矣深則厲淺則揭
  - page: 338
    col: 10
    role: z
    text: 硜苦耕反莫己之己音紀餘音以揭
  - page: 338
    col: 11
    role: z
    text: 起例反○硜硜石聲亦專確之意以
  - page: 338
    col: 12
    role: z
    text: 衣渉水曰厲攝衣渉水爲揭此兩句
  - page: 338
    col: 13
    role: z
    text: 衛風匏有苦葉之詩也譏孔子人不
  - page: 338
    col: 14
    role: z
    text: 知己而不止不能適淺深之冝
  - page: 338
    col: 15
    role: j
    text: 子曰果哉末之難矣
  - page: 338
    col: 16
    role: z
    text: 果哉歎其果於忘世也末無也聖人
  - page: 339
    col: 1
    role: z
    text: 心同天地視天下猶一家中國猶一
  - page: 339
    col: 2
    role: z
    text: 人不能一日忘也故聞荷蕢之言而
  - page: 339
    col: 3
    role: z
    text: 歎其果於忘世且言人之出處若但
  - page: 339
    col: 4
    role: z
    text: 如此則亦無所難矣
  - page: 339
    col: 5
    role: j
    text: 子張曰書云高宗諒陰三年不言何謂
  - page: 339
    col: 6
    role: j
    text: 也
  - page: 339
    col: 7
    role: z
    text: 高宗商王武丁也諒陰天子居喪之
  - page: 339
    col: 8
    role: z
    text: 名未詳其義
  - page: 339
    col: 9
    role: j
    text: 子曰何必高宗古之人皆然君薨百官
  - page: 339
    col: 10
    role: j
    text: 總己以聽於冢宰三年
  - page: 339
    col: 11
    role: z
    text: 言君薨則諸侯亦然總己謂總攝己
  - page: 339
    col: 12
    role: z
    text: 職冢宰大宰也百官聽於冢宰故君
  - page: 339
    col: 13
    role: z
    text: 得以三年不言也○胡氏曰位有貴
  - page: 339
    col: 14
    role: z
    text: 賤而生於父母無以異者故三年之
  - page: 339
    col: 15
    role: z
    text: 喪自天子達子張非疑此也殆以為
  - page: 339
    col: 16
    role: z
    text: 人君三年不言則臣下無所禀令禍
  - page: 340
    col: 1
    role: z
    text: 亂或由以起也孔子告以聽於冢宰
  - page: 340
    col: 2
    role: z
    text: 則禍亂非所憂矣
  - page: 340
    col: 3
    role: j
    text: 子曰上好禮則民易使也
  - page: 340
    col: 4
    role: z
    text: 好易皆去聲○謝氏曰禮達而分定
  - page: 340
    col: 5
    role: z
    text: 故民易使
  - page: 340
    col: 6
    role: j
    text: 子路問君子子曰脩己以敬曰如斯而
  - page: 340
    col: 7
    role: j
    text: 已乎曰脩己以安人曰如斯而已乎曰
  - page: 340
    col: 8
    role: j
    text: 脩己以安百姓脩己以安百姓堯舜其
  - page: 340
    col: 9
    role: j
    text: 猶病諸
  - page: 340
    col: 10
    role: z
    text: 脩己以敬夫子之言至矣盡矣而子
  - page: 340
    col: 11
    role: z
    text: 路少之故再以其充積之盛自然及
  - page: 340
    col: 12
    role: z
    text: 物者告之無他道也人者對己而言
  - page: 340
    col: 13
    role: z
    text: 百姓則盡乎人矣堯舜猶病言不可
  - page: 340
    col: 14
    role: z
    text: 以有加於此以抑子路使反求諸近
  - page: 340
    col: 15
    role: z
    text: 也蓋聖人之心無窮世雖極治然豈
  - page: 340
    col: 16
    role: z
    text: 能必知四海之內果無一物不得其
  - page: 341
    col: 1
    role: z
    text: 所哉故堯舜猶以安百姓為病若曰
  - page: 341
    col: 2
    role: z
    text: 吾治已足則非所以為聖人矣○程
  - page: 341
    col: 3
    role: z
    text: 子曰君子脩己以安百姓篤恭而天
  - page: 341
    col: 4
    role: z
    text: 下平唯上下一於恭敬則天地自位
  - page: 341
    col: 5
    role: z
    text: 萬物自育氣無不和而四靈畢至矣
  - page: 341
    col: 6
    role: z
    text: 此體信達順之道聰明睿知皆由是
  - page: 341
    col: 7
    role: z
    text: 出以此事天饗帝
  - page: 341
    col: 8
    role: j
    text: 原壤夷俟子曰幼而不孫弟長而無述
  - page: 341
    col: 9
    role: j
    text: 焉老而不死是為賊以杖叩其脛
  - page: 341
    col: 10
    role: z
    text: 孫弟並去聲長上聲叩音口脛其定
  - page: 341
    col: 11
    role: z
    text: 反○原壤孔子之故人母死而歌蓋
  - page: 341
    col: 12
    role: z
    text: 老氏之流自放於禮法之外者夷蹲
  - page: 341
    col: 13
    role: z
    text: 踞也俟待也言見孔子來而蹲踞以
  - page: 341
    col: 14
    role: z
    text: 待之也述猶稱也賊者害人之名以
  - page: 341
    col: 15
    role: z
    text: 其自幼至老無一善狀而久生於世
  - page: 341
    col: 16
    role: z
    text: 徒足以敗常亂俗則是賊而已矣脛
  - page: 342
    col: 1
    role: z
    text: 足骨也孔子既責之而因以所曳
  - page: 342
    col: 2
    role: z
    text: 杖微擊其脛若使勿蹲踞然
  - page: 342
    col: 3
    role: j
    text: 闕黨童子將命或問之曰益者與
  - page: 342
    col: 4
    role: z
    text: 與平聲○闕黨黨名童子未冠者
  - page: 342
    col: 5
    role: j
    text: 稱將命謂傳賓主之言或人疑此童子
  - page: 342
    col: 6
    role: z
    text: 子學有進益故孔子使之傳命以寵
  - page: 342
    col: 7
    role: z
    text: 異之也
  - page: 342
    col: 8
    role: j
    text: 子曰吾見其居於位也見其與先生並
  - page: 342
    col: 9
    role: j
    text: 行也非求益者也欲速成者也
  - page: 342
    col: 10
    role: z
    text: 禮童子當隅坐隨行孔子言吾見此
  - page: 342
    col: 11
    role: z
    text: 童子不循此禮不能求益但欲速成
  - page: 342
    col: 12
    role: z
    text: 爾故使之給使令之役觀長少之序
  - page: 342
    col: 13
    role: z
    text: 習揖遜之容蓋所以抑而教之非寵
  - page: 342
    col: 14
    role: z
    text: 而異之
