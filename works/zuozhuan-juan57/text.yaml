# 春秋左傳正義卷57（孔穎達疏）：j 為經文＋杜預注，z 為疏文。
sections:
  - id: juan57
    name: 正文
    blocks:
      - { type: j, text: "◎哀公○陸曰：“哀公名蔣，定公之子。蓋夫人定姒所生，敬王二十八年即位。諡法：‘恭仁短折曰哀。’”" }
      - { type: j, text: "【經】元年，春，王正月，公即位。（無傳。）" }
      - { type: j, text: "楚子、陳侯、隨侯、許男圍蔡。隨世服於楚，不通中國。吳之入楚，昭王奔隨，隨人免之，卒復楚國。楚人德之，使列於諸侯，故得見經。定六年，鄭滅許，此復見者，蓋楚封之。○見，賢遍反，下同。此復，扶又反。" }
      - { type: z, text: "注“隨世”至“封之”。○正義曰：僖二十年，楚人代隨，自爾以來，隨不復見。以隨世服於楚，為楚私屬，不通於諸侯，征伐盟會，不齒於列，故史不得書之。猶如邾、滕為人私屬，不序於宋盟也。定四年保護昭王，楚得復國，楚人感其恩德，使隨列於諸侯。今楚帥諸侯圍蔡，令隨在其班次，以之告魯，故得見經。定六年，鄭滅許，以許男斯歸，殺之。此時許復見者，以許屬楚，故疑蓋楚封之，當如蔡侯廬、陳侯吳受封於楚也。《世族譜》許男斯之後有元公成、悼公孫，則是楚封元公為許男也。" }
      - { type: j, text: "鼷鼠食郊牛，改卜牛。" }
      - { type: j, text: "夏，四月，辛巳郊。無傳。書，過也。不言所食，非一處。○處，昌慮反。" }
      - { type: z, text: "注“書過”至“一處”。○正義曰：桓五年傳例雲：“凡祀，啟蟄而郊，過則書。”今以四月始郊，巳入春分之氣，故書過也。宣三年“郊牛之口傷”，成七年“鼷鼠食郊牛角”，言其傷食之處。此不言所食處者，所食非一處也。" }
      - { type: j, text: "秋，齊侯、衛侯伐晉。" }
      - { type: j, text: "冬，仲孫何忌帥師伐邾。無傳。" }
      - { type: j, text: "【傳】元年，春，楚子圍蔡，報柏舉也。（在定四年。）裏而栽，（栽，設板築為圍壘，周匝去蔡城一里。○栽，才代反，又音再，注同；《說文》雲：“築牆長板。”壘，力軌反。匝，子合反。）" }
      - { type: z, text: "注“栽設”至“一里”。○正義曰：築牆立板謂之栽。栽者，豎木以約版也。楚慮外人救蔡，則於表裏受敵，故築圍壘，周匝去蔡城一里，以圍之，欲置兵其內以攻蔡，使外人不得救之。" }
      - { type: j, text: "廣丈，高倍。壘厚一丈，高二丈。○廣，古曠反。高倍，並如字；高，又古報反，注同。厚，戶豆反。夫屯晝夜九日，夫，猶兵也。壘未成，故令人在壘裏屯守蔡。○屯，徒門反。夫，兵也。屯，守也。令，力呈反。" }
      - { type: z, text: "注“夫猶”至“守蔡”。○正義曰：劉炫雲：“杜言：‘夫，猶兵也。以壘未成，故令人在壘裏屯守蔡。’然則未築壘前，兵豈遠城乎？壘成之後，兵復出壘乎？以圍人夜守常事，何言‘晝夜九日’？以後兵豈散乎？炫以‘夫屯’謂伕役屯聚，晝夜不止，九日而築壘成耳。夫者，別有城夫，非戰士。”劉炫以為，丁夫築城晝夜九日。杜必以夫為兵，屯守九日者，以屯是戍守之名。故《詩·序》雲“屯戍於母家”，又案傳，晉有軘車，皆是兵之屯守。經籍未有作役之人，而為屯守之號者，故杜為此解。劉妄規其失，非也。" }
      - { type: j, text: "如子西之素。子西本計，為壘當用九日而成。蔡人男女以辨，辨，別也。男女各別，系累而出降。○辨，扶免反，又方免反。別，彼列反，下同。累，力維反。降，戶江反。使疆於江、汝之間而還。楚欲使蔡徙國在江水之北，汝水之南，求田以自安也。蔡權聽命，故楚師還。○疆，居良反。" }
      - { type: z, text: "注“楚欲”至“師還”。○正義曰：服虔雲：“蔡使楚進疆於故江國與汝水之間。”其意言蔡割地以賂楚也。杜不然者，以昭七年傳甲無宇雲：“先君文王，作僕區之法，所以封汝”；哀十七年傳曰：“彭仲爽，申俘也，文王以為令尹，實縣申、息，朝陳、蔡封畛於汝。”則楚於文王之時，其竟巳至汝水，寧於此役，蔡始令楚進疆於江、汝之間也？且汝水、江國，不可共文。故杜以為楚使蔡徙其國都於江北、汝水之南，目擇疆宇。欲令遷都近楚，為楚屬國。蔡人冀令楚去，心雖不肯，權宜許之。楚還之後，蔡更自議：巳與楚惡，不如事吳。故請遷於吳，以吳為援。" }
      - { type: j, text: "蔡於是乎請遷於吳。楚既還，蔡人更叛楚就吳，為明年蔡遷州來傳。吳王夫差敗越於夫椒，報槜李也。槜李，在定十四年。夫椒，吳郡吳縣西南大湖中椒山。○夫音扶。椒，又作棑，子消反。槜音醉。大音泰。" }
      - { type: z, text: "注“夫椒”至“椒山”。○正義曰：杜於此注以椒為山名，《土地名》以夫椒為地名，以戰必在山旁，以山表地耳。" }
      - { type: j, text: "遂入越。越子以甲楯五千保於會稽，上會稽山也。在會稽山陰縣南。○楯，食允反，又音允。會，古外反。稽，古兮反。上，時掌反。使大夫種因吳大宰嚭以行成。吳子將許之。伍員曰：“不可。臣聞之：‘樹德莫如滋，去疾莫如盡。’昔有過澆殺斟灌以伐斟鄩，澆，寒浞子，封於過者。二斟，夏同姓諸侯。襄四年傳曰：“澆用師滅斟灌。”○嚭，普鄙反。員音雲。去疾，起呂反，本又作“去惡”。過，古禾反，國名，注及下同。澆，五叫反，一音五報反，下同。斟，諸林反。灌，古亂反。鄩音尋。浞，仕捉反。夏，戶雅反，下注皆同。" }
      - { type: z, text: "注“澆寒”至“斟灌”。○正義曰：襄四年傳稱夏之衰也，有窮后羿因夏民以代夏政，而用寒浞。寒浞殺羿，因其室而生澆，處澆於過。是言澆是寒浞之子，封於過也。“二斟，夏同姓諸侯”，《夏本紀》文也。又襄四年傳雲“澆用師滅斟灌”，此言“殺斟灌”者，王肅雲：“滅，殺也。古者滅、殺尊卑同名。”其意言殺其君而滅其國，故二文各言其一也。賈逵雲：“夏後相依斟灌而國，故曰殺夏後相也。”案下句別言“滅夏後相”，王解是也。" }
      - { type: j, text: "滅夏後相。夏後相，啟孫也。後相失國，依於二斟，復為澆所滅。○相，息亮反，注及下注同。復，扶又反。" }
      - { type: z, text: "注“夏後”至“所滅”。○正義曰：《夏本紀》雲：“禹生啟，啟注大康。大康崩，弟仲康立。仲康崩，子相立。”是相為仲康之子，啟之孫也。《書·序》雲：“大康失邦，作《五子之歌》。”其經雲：“大康尸位以逸豫，乃畋於有洛之表，十旬弗反。有窮后羿因民弗忍，距於河。”則大康之時羿巳權盛，能廢大康矣。《胤徵》雲：“唯仲康肇位四海。”孔安國雲：“羿廢大康，而立其弟仲康為天子。”仲康，羿之所立也。仲康崩，子相立，蓋亦羿立之矣。傳言羿“因夏民以代夏政”，蓋於相時羿始自立為天子。相於是失國，依於二斟。及澆滅斟灌，相復為澆所滅。" }
      - { type: j, text: "後緡方娠，逃出自竇，後緡，相妻。娠，懷身也。○緡，亡巾反。娠音震，又音身。竇音豆。歸於有仍，後緡，有仍氏女。生少康焉。為仍牧正，牧官之長。○少，詩照反。長，丁丈反。惎澆能戒之。惎，毒也。戒，備也。○惎音忌。澆使椒求之，椒，澆臣。逃奔有虞，為之庖正，以除其害。虞舜後諸侯也。梁國有虞縣。庖正，掌膳羞之官。賴此以得除巳害。○庖，步交反。" }
      - { type: z, text: "注“虞舜”至“巳害”。○正義曰：“《尚書·堯典》雲：“有鰥在下，曰虞舜。”又曰：“釐降二女於媯汭，濱於虞。”皇甫謐雲：嬪於虞，因以虞為氏。虞，今河東大陽縣西山上虞城是也。然則舜有天下，其代號虞，因本河東大陽之虞。及周之興，封仲雍之後為虞國，即彼地是也。但舜既禪禹，禹封舜後為諸侯，雖取虞為國名，未必封於河東虞地。而梁國有虞縣，其地以虞為名，疑是夏時虞國。杜以地名言“有”者，皆是疑辭，言“有”以示不審也。庖正，當《周禮》之庖人。用之為正，噹噹是食官之長，故為掌膳羞之官也。賴此以得除己害，得在浞之世不被殺也。" }
      - { type: j, text: "虞思於是妻之以二姚，思，有虞君也。虞思自以二女妻少康。姚，虞姓。○妻，七計反。姚，羊昭反。而邑諸綸。綸，虞邑。○綸音倫。有田一成，有眾一旅。方十里為成，五百人為旅。" }
      - { type: z, text: "注“方十”至“為旅”。○正義曰：“方十里為成”，《司馬法》文也。“五百人為旅”，《夏官·序》文也。“田一成”、“眾一旅”。言食此一成之地，其內有為兵者五百人。《周禮·小司徒》雲：“乃井牧其田野。”鄭眾雲：“井牧者，《春秋傳》所謂‘井衍沃’、‘牧隰皋’者也。”鄭玄雲：“隰皋之地，九夫為牧，二牧而當一井。今造都鄙，授民田，有不易，有一易，有再易，通率二而當一，是之謂井牧。昔夏少康在虞思，有田一成，有眾一旅。一旅之眾，而田一成，則井牧之法，先古然矣。”杜解“牧隰皋”雖與鄭異，其授民田二而當一，理亦宜然。計方十里為方一里者百，方一里有九夫之田，則十里容九百夫也。其一百夫授上地不易者，其四百夫授一易二而當一，則得為五百夫矣。" }
      - { type: j, text: "能布其德，而兆其謀，兆，始。以收夏眾，撫其官職。襄四年傳曰：“靡自有鬲氏，收二國之燼，以滅浞而立少康。”○鬲音革。燼，徐刃反，又秦刃反。" }
      - { type: z, text: "注“襄四”至“少康”。○正義曰：引此傳者，言少康能布恩惠，以收夏眾。以德撫靡，故得用靡遺民滅浞而立之。" }
      - { type: j, text: "使女艾諜澆，女艾，少康臣。諜，候也。○女，如字，又音汝。艾，五蓋反。諜音偞。使季杼誘豷，豷，澆弟也。季杼，少康子後杼也。○杼，直呂反。豷，許器反。遂滅過、戈，復禹之績。過，澆國。戈，豷國。○過、戈，並古禾反。之績，一本作跡。祀夏配天，不失舊物。物，事也。今吳不如過，而越大於少康，或將豐之，不亦難乎！言與越成，是使越豐大，必為吳難。○難，乃旦反。句踐能親而務施，施不失人，所加惠賜，皆得其人。○施，始豉反，下同。親不棄勞。推親愛之誠，則不遺小勞。與我同壤，而世為仇讎。於是乎克而弗取，將又存之，違天而長寇讎，猶言天與不取。○長，丁丈反，下同。" }
      - { type: z, text: "注“猶言天與不取”。○正義曰：《吳語》雲，越滅吳，吳王請行成，越王曰：“背天以越賜吳，而吳不取。”是也。" }
      - { type: j, text: "後雖悔之，不可食巳。食，消也。巳，止也。" }
      - { type: z, text: "“後雖”至“食巳”。○正義曰：言悔恨之深，結於心腹，不可如食之消止。" }
      - { type: j, text: "姬之衰也，日可俟也。姬，吳姓。言可計日而待。○俟，本又作竢，音仕。介在蠻夷，而長寇讎，以是求伯，必不行矣。”弗聽。退而告人曰：“越十年生聚，而十年教訓，生民聚財，富而後教之。○介音界。伯，如字，又音霸。聚，才喻反，又如字。" }
      - { type: z, text: "注“生民”至“教之”。正義曰：服虔雲：“令少者無娶老婦，老者無娶少婦。女十七不嫁，男二十不娶，父母有罪也。將生子，以告，與之<殹巫}，饋之餼也。死者釋其徵，必哭泣葬埋，如其子也。孺子游者必餔歠之也。非手所種、夫人所織不用，十年不收於國。”" }
      - { type: j, text: "二十年之外，吳其為沼乎！”謂吳宮室廢壞，當為汙池。為二十二年越入吳起本。○沼，之非反。汙音烏。三月，越及吳平。吳入越，不書，吳不告慶，越不告敗也。嫌夷狄不與華同，故復發傳。○復，扶又反。" }
      - { type: j, text: "夏，四月，齊侯、衛侯救邯鄲，圍五鹿。趙稷以邯鄲叛，範、中行氏之黨也。五鹿，晉邑。○邯音寒。鄲音丹。" }
      - { type: j, text: "吳之入楚也，在定四年。使召陳懷公。懷公朝國人而問焉，曰：“欲與楚者右，欲與吳者左。陳人從田，無田從黨。”都邑之人無田者，隨黨而立，不知所與，故直從所居。田在西者居右，田在東者居左。逢滑當公而進，當公，不左不右。○滑，於八反。曰：“臣聞國之興也以福，其亡也以禍。今吳未有福，楚未有禍，楚未可棄，吳未可從。而晉，盟主也，若以晉辭吳，若何？”公曰：“國勝君亡，非禍而何？”楚為吳所勝。對曰：“國之有是多矣，何必不復？小國猶復，況大國乎？臣聞，國之興也，視民如傷，是其福也；如傷，恐驚動。其亡也，以民為土芥，是其禍也。芥，草也。○芥，古邁反。楚雖無德，亦不艾殺其民。吳日敝於兵，暴骨如莽，草之生於廣野，莽莽然，故曰草莽。○艾，魚廢反。暴，步卜反。莽，亡黨反。而未見德焉。天其或者正訓楚也，使懼而改過。禍之適吳，其何日之有？”言今至。陳侯從之。及夫差克越，乃脩先君之怨。秋，八月，吳侵陳，脩舊怨也。傳言吳不脩德而脩怨，所以亡。" }
      - { type: j, text: "齊侯、衛侯會於乾侯，救範氏也。師及齊師、衛孔圉、鮮虞人伐晉，取棘蒲。魯師不書，非公命也。孔圉，孔烝鉏曾孫。鮮虞，狄師，賤故不書。○圉，魚呂反。烝，之承反。鉏，仕居反。" }
      - { type: z, text: "注“魯師”至“不書”。○正義曰：杜以經書齊、衛伐晉，傳言四國伐晉，故唯解魯與鮮虞不書意也。劉炫以齊、衛會乾侯，救範氏者，師相會因而行伐，二君親行，告伐不告會也。行伐之後，魯與鮮虞會之，齊、衛更遣師與同伐也。但齊將卑師眾，故稱“師”；衛將尊師少，故云“孔圉”。後伐四國，並皆不書，非獨魯與鮮虞不書也。當謂魯師不書非公命，餘者不書皆不告。義出百塗，並得通也。今知劉非者，杜以傳齊侯、衛侯止雲“會乾侯”，不言伐晉，即雲“師及齊師、衛孔圉、鮮虞人伐晉”，與經齊侯、衛侯伐晉文相次，當以為一，鮮虞，狄師，賤，故略而不書，猶邲之戰唐侯從楚而不書，平丘之會狄人從晉而不書之類是也。劉以為孔圉等更別伐晉，魯師不書非公命，餘者不告故不書，而規杜過，非也。" }
      - { type: j, text: "吳師在陳，楚大夫皆懼，曰：“闔廬惟能用其民，以敗我於柏舉。今聞其嗣又甚焉，將若之何？”子西曰：“二三子恤不相睦，無患吳矣。昔闔廬食不二味，居不重席，室不崇壇，平地作室，不起壇也。○重，直龍反。壇，徒丹反。" }
      - { type: z, text: "“食不二味”。○正義曰：謂與在下同其好惡，不別二為美味也。" }
      - { type: j, text: "器不彤鏤，彤，丹也。鏤，刻也。○彤，徒冬反。鏤，魯豆反。宮室不觀，觀，臺榭。○觀，古亂反，注同。榭音謝。舟車不飾，衣服財用，擇不取費。選取堅厚，不尚細靡。○費，芳味反。在國，天有菑癘，癘，疾疫也。○菑音災。癘，本或作“天無菑癘”，非，疫音役。" }
      - { type: z, text: "“在國天有菑癘”。○正義曰：“在國”與“在軍”相對，“天有菑癘”與下句相連，言有菑癘之時，親自巡孤寡，共其乏困也。本或作“天無”，誤耳。" }
      - { type: j, text: "親巡其孤寡而共其乏困。在軍，熟食者分，而後敢食。必須軍士皆分熟食，不敢先食。分，猶徧也。○共音恭。熟食者分，如字。一讀以“分”字連下句。徧音遍。" }
      - { type: z, text: "注“必須”至“徧也”。○正義曰：《孫武兵書》雲：“軍井未達，將不言渴；軍灶未炊，將不言飢。”故闔閭在軍，如良將之法，必須軍士皆分熱食然後敢食，王不先自食也。服虔雲：“以其半分軍士，而後自食其餘，若單醪注流也。”杜以分王半食，不足遍及軍人，且所嘗珍異，乃得卒乘與焉，王所自食，不得分軍士也，故顯而異之。分猶遍也，待遍熟食，王乃自食也。" }
      - { type: j, text: "其所嘗者，卒乘與焉。所嘗甘珍，非常食。○卒，子忽反。乘，繩證反。與音預。勤恤其民，而與之勞逸，是以民不罷勞，死不知曠。知身死不見曠棄。○罷音皮。吾先大夫子常易之，所以敗我也。易，猶反也。今聞夫差，次有臺榭陂池焉，積土為高曰臺，有木曰榭，過再宿曰次。○陂，彼宜反。" }
      - { type: z, text: "注“積土”至“曰次”。○正義曰：《釋宮》雲：“闍謂之臺。”郭璞雲：“積土四方也。”又云：“有木者謂之榭。”李巡雲：“臺上有屋謂之榭。”又曰：“無室曰榭，四方而高曰臺。”莊三年傳例曰：“凡師，一宿為舍，再宿為信，過信為次。”孔安國《尚書傳》雲：“澤彰曰陂，停水曰池。”言夫差所停三日，則役民為此也。" }
      - { type: j, text: "宿有妃嬙嬪御焉。妃嬙，貴者。嬪御，賤者。皆內官。○嬙，本又作牆，或作牆，在羊反。嬪，毗人反。" }
      - { type: z, text: "注“妃嬙”至“內官”。○正義曰：《曲禮》雲：“天子之妃曰後。”則妃，上下通名也。《釋詁》雲：“妃、合、會，對也。妃，媲也。”是匹對於夫婦，官之最貴者也。嬙在妃下，次於妃也。《周禮》有九嬪、女御。以有四名，分為三等，故言王嬙貴者，嬪御賤者，皆婦官之名。《周禮》無嬙，蓋後世為之名。漢有掖庭王嬙，是因於古也。" }
      - { type: j, text: "一日之行，所欲必成，玩好必從。珍異是聚，觀樂是務。視民如讎，而用之日新。夫先自敗也已，安能敗我？”為二十二年越滅吳起本。○好，呼報反。夫先自敗也巳，夫音扶；本或作“夫差先自敗者”，非。" }
      - { type: j, text: "冬，十一月，晉趙鞅伐朝歌。討範、中行氏。" }
      - { type: j, text: "【經】二年，春，王二月，季孫斯、叔孫州仇、仲孫何忌帥師伐邾，取漷東田及沂西田。（邾人以賂，取之易也。○漷，火虢反，又音郭。沂，魚依反。易，以豉反。）癸巳，叔孫州仇、仲孫何忌及邾子盟於句繹。（句繹，邾地。取邑，盟以要之。○句，古侯反。繹音亦。要，以遙反。）" }
      - { type: z, text: "注“句繹”至“要之”。正義曰：既取其田，慮後悔競，故共盟以要之。伐則三卿，盟唯二卿者，服虔雲：“季孫尊卿，敵服先歸，使二子與之盟。”《穀梁傳》曰：“三人伐而二人盟何？各盟其得也。”其意言季孫不得田，故不與盟也。案十四年小邾射以句繹來奔，則句繹，小邾地也。注言“邾地”者，以傳雲“伐邾，邾人愛其土，賂以漷、沂之田而受盟”。被伐受盟，則盟在邾地，猶若成二年楚人伐我師於蜀，公及楚公子嬰齊盟於蜀之類是也。邾與小邾，國竟相近，句繹所屬，亦無定準，猶齊、魯汶陽之田，莒、魯爭鄆之事，一彼一此，豈有常乎？而劉炫以句繹為小邾地，而規杜，非也。" }
      - { type: j, text: "夏，四月，丙子，衛侯元卒。定四年盟皋鼬。" }
      - { type: z, text: "注“定四年盟皋鼬”。○正義曰：元以昭八年即位，三十二年大夫盟於狄泉，以未告公而公薨，故不數。" }
      - { type: j, text: "滕子來朝。無傳。" }
      - { type: j, text: "晉趙鞅帥師納衛世子蒯聵於戚。" }
      - { type: z, text: "“衛世子”。○正義曰：世子者，父在之名。蒯聵父既死矣，而稱世子者，晉人納之，以世子告，言是正世子，以示宜為君也。《春秋》以其本是世子，未得衛國，無可褒貶，故因而書“世子”耳。" }
      - { type: j, text: "秋，八月，甲戌，晉趙鞅帥師及鄭罕達帥師戰於鐵，鄭師敗績。皆陳曰戰。大崩曰敗績。鐵在戚城南。罕達，子皮孫。○鐵，天結反。陳，直覲反。冬，十月，葬衛靈公。無傳。七月而葬，緩。" }
      - { type: j, text: "十有一月，蔡遷於州來。畏楚而請遷，故以自遷為文。蔡殺其大夫公子駟。懷土而欺大國，故罪而書名。" }
      - { type: j, text: "【傳】二年，春，伐邾，將伐絞。（絞，邾邑。○絞，古卯反。）邾人愛其土，故賂以漷、沂之田而受盟。" }
      - { type: j, text: "初，衛侯游於郊，子南僕。子南，靈公子郢也。僕，御也。○郢，以井反。公曰：“餘無子，將立女。”蒯聵奔，無大子。○女音汝。不對。他日，又謂之。對曰：“郢不足以辱社稷，君其改圖。君夫人在堂，三揖在下，三揖，卿、大夫、士。○揖，一入反。" }
      - { type: z, text: "注“三揖卿大夫士”。○正義曰：《周禮·司士》雲：“孤卿特揖，大夫以其等旅揖，士旁三揖。”鄭玄雲：“特揖，一一揖之。”旅，眾也，大夫爵同者，眾揖之。三揖者，士有上、中、下。”鄭眾雲：“卿、大夫、士，皆君之所揖禮，《春秋傳》所謂‘三揖在下’。”服虔雲：“三揖，卿、大夫、士。士揖庶姓，時揖異姓，天揖同姓。”" }
      - { type: j, text: "君命衹辱。”言立適當以禮，與內外同之。今君私命，事必不從，適為辱。○祇音支。適，丁歷反。下“適孫”同。夏，衛靈公卒。夫人曰：“命公子郢為大子，君命也。”對曰：“郢異於他子，言用意不同。且君沒於吾手，若有之，郢必聞之。言當以臨沒為正。且亡人之子輒在。”輒，蒯聵之子出公也，靈公適孫。乃立輒。六月，乙酉，晉趙鞅納衛大子於戚。宵迷，陽虎曰：“右河而南，必至焉。”是時河北流過元城界，戚在河外，晉軍巳渡河，故欲出河右而南。" }
      - { type: z, text: "注“是時”至“而南”。○正義曰：《土地名》雲：“河經河內之南界，東北經汲郡、魏郡、頓丘、陽平、平原、樂陵之東南入海。”是言晉時河所經也。春秋之時，河未必然，故云“是時河北流過元城界”，與晉時河道異也。《土地名》又云：“戚，頓丘衛縣西戚城，在枯河東。”是春秋時戚在河東也。從晉而言，河西為內，東為外，故云“戚在河外”也。是時晉軍巳渡河矣，師人皆迷，不知戚處。陽虎憶其渡處在戚之北，河既北流，據水所向，則東為右，故欲出河右而南行也。" }
      - { type: j, text: "使大子絻，絻者，始發喪之服。○絻音問。喪音桑。" }
      - { type: z, text: "注“絻者始發喪之服”。○正義曰：《士喪禮》：“既小斂，主人括髮袒，眾主人免於房。”鄭玄雲：“括髮者，去笄纚而紒也。眾主人免者，齊衰將袒，以免代冠。冠，服之尤尊，不以袒也。”又《奔喪之禮》：“至於家，入門哭盡哀，括髮袒。自齊衰以下，入門哭盡哀，免麻於序東。”如彼禮文，則主人當括髮，齊衰以下乃免。此“大子絻”者，禮，不至喪所，不括髮，故以絻代之耳。靈公以四月卒，今以六月而大子絻，故云：絻，始發喪之服也。遠道不臨喪者，不得括髮，故始發喪服絻也。鄭玄注《士喪禮》雲：“免之制未聞，舊說以為如冠狀，廣一寸。《喪服小記》曰：‘斬衰括髮以麻，免而以布。’此用麻布為之，狀如今之著幓頭矣。自項中而前交於額上，郤繞紒也。”" }
      - { type: j, text: "八人衰絰，偽自衛逆者，欲為衛人逆，故衰絰成服。○衰，七雷反。絰，田結反。告於門，哭而入，遂居之。" }
      - { type: j, text: "秋，八月，齊人輸範氏粟，鄭子姚、子般送之。子姚，罕達。子般，駟弘。○般音班。士吉射逆之，趙鞅御之，遇於戚。陽虎曰：“吾車少，以兵車之旆與罕、駟兵車先陳。旆，先驅車也。以先驅車益以兵車以示眾。○陳，直覲反，下注同。罕、駟自後隨而從之，彼見吾貌，必有懼心，晉人先陳，鄭人隨之，不知其虛實，見車多必懼。於是乎會之，會，合戰。必大敗之。”從之。卜戰，龜焦。兆不成。樂丁曰：“《詩》曰：‘爰始爰謀，爰契我龜。’樂丁，晉大夫。《詩·大雅》。言先人事，後卜筮。○契，苦計反，又苦結反。" }
      - { type: z, text: "“詩曰”至“我龜”。○正義曰：《詩·大雅·綿》之篇，美太王遷岐之事。爰，於也。既見周原之地肥美可居，於是始集豳人從己者，於是與謀議。人謀既從，於是契灼我龜而卜之。言先人謀，後卜筮也。" }
      - { type: j, text: "謀協以故兆，詢可也。”詢，諮詢也。故兆，始納衛大子，卜得吉兆。言今既謀同，可不須更卜。○謀協以故兆，絕句。詢可也，思遒反。簡子誓曰：“範氏、中行氏反易天明，不事君也。" }
      - { type: z, text: "“反易天明”。○正義曰：天有尊卑，人有上下。下事上，臣事君，法則天之明道；臣不事君，是反易天之明道也。" }
      - { type: j, text: "斬艾百姓，欲擅晉國而滅其君。寡君恃鄭而保焉。今鄭為不道，棄君助臣，二三子順天明，從君命，經德義，除詬恥，在此行也。克敵者，上大夫受縣，下大夫受郡，《周書·作雒篇》：千里百縣，縣有四郡。○艾，魚廢反。擅，市戰反。而滅其君，滅或作戕，音殘。詬，呼豆反，又音苟。雒音洛。千里百縣，縣方百里；縣有四郡，郡方五十里。" }
      - { type: z, text: "“經德義”。○正義曰：此“經德義”與傳“經國家”、《詩·序》“經夫婦”皆意同也。“經”謂經紀營理之。不除君惡，則德義廢矣，宜經紀德義，使不壞也。○“克敵”至“受郡”。○正義曰：“上大夫”、“下大夫”謂於大夫之內分為上下，其上大夫非卿也。此言先無田祿者，若能克敵，得此賞也。○注“周書”至“四郡”。○正義曰：《周禮·小司徒》雲：“九人為井，四井為邑，四邑為丘，四丘為甸，四甸為縣，四縣為都。”鄭玄雲：“邑方二里，丘方四里，甸方八里，旁加一里，則方十里，為一成。縣方二十里，都方四十里，四都方八十里，旁加十里，乃得方百里，為一同也。”如彼文，則縣方二十里耳。《周禮》又無郡，不可用以解此，故引《周書》解之。或曰，《周書》者，孔子刪《尚書》之餘。今案其存者，其文非《尚書》之類。其《作雒篇》有此言。方千里者為方百里者百，千里百縣，則縣方百里。計成方十里，出車一乘，縣方百里，則出車百乘也。昭五年傳雲，晉有四十縣，遺守四千乘。是縣別有百乘，與《作雒》之言合也。上大夫受縣，縣則為百乘之家，言得進為卿也。縣有四郡，則郡方五十里，下大夫得此方五十里之采邑。" }
      - { type: j, text: "士田十萬，千萬畝也。" }
      - { type: z, text: "注“十萬畝”。○正義曰：《王制》雲：“方一里者為田九百畝，方十里者為方一里者百，為田九萬畝。”則士田十萬，為方千里有餘。" }
      - { type: j, text: "庶人工商遂，得遂進仕。人臣隸圉免。去斯役。○廝役如字，字又作斯，音同；何休注《公羊》雲：“艾草為防者曰廝，汲水漿者曰役”；蘇林注《漢書》雲：“廝，取薪者”；韋昭雲：“析薪曰廝。”志父無罪，君實圖之。志父，趙簡子之一名也。言巳事濟，君當圖其賞。○志父音甫。服雲：趙鞅入晉陽以畔，後得歸，改名志父。《春秋》仍舊，猶書趙鞅。" }
      - { type: z, text: "注“志父”至“其賞”。○正義曰：《牧誓》武王誓眾，尚自稱名，況以人臣誓眾，固當自稱名矣。知志父是簡子名也。簡子名鞅，又名志父者，服虔雲：“趙鞅入於晉陽以叛，諸侯之策書曰‘晉趙鞅以叛’。既復，更名志父。”或當然也。楚公子圍弒君取國，改名曰虔，經即書虔；公子棄疾弒君取國，改名曰居，經即書居；今趙鞅改名志父，經書猶雲趙鞅者，彼楚子既為國君，臣下以所改之名告於鄰國，故得書所改之名。趙鞅人臣，家國不為之諱，仍以趙鞅名告，故書鞅也。鞅言“君實圖之”，言巳事濟，君當謀其賞也。簡子言此君當謀其賞者，言君當賞其在下，副上所誓之言，欲使在下信之，非欲自求賞也。" }
      - { type: j, text: "若其有罪，絞縊以戮，絞，所以縊人物。○縊，一賜反。戮音六。桐棺三寸，不設屬闢，屬闢，棺之重數。王棺四重，君再重，大夫一重。○桐棺三寸，《禮記》雲：“夫子制於中都，四寸之棺，五寸之槨，以斯知不欲速朽也。”鄭康成注云：“此庶人之制也。”案禮，上大夫棺八寸，屬六寸；下大夫棺六寸，屬四寸。無三寸棺制也。棺用難朽之木，桐木易壞，不堪為棺，故以為罰。墨子尚儉，有“桐棺三寸”。不設屬，音燭，注同，次大棺也。闢，步歷反，注同，親身棺也。禮，大夫無闢。重，直龍反，下同。王棺四重，《禮記》雲：“水兕革棺被之，其厚三寸，杝棺一，梓棺二。”杝棺，闢也。梓棺二，屬與大棺也。被水牛及兕之革為一重，闢為二重，屬為三重，大棺為四重。君再重，君謂侯、伯、子、男、侯、伯巳下無革棺，屬與闢為一重，大棺為再重。上公則唯無水革耳，兕革與闢為一重，屬為再重，大棺為三重。大夫一重，大夫唯屬與大棺為一重。今雲“不設闢”者，時僣耳，非正禮也。" }
      - { type: z, text: "注“屬闢”至“一重”。正義曰：《禮·喪大記》雲：“君大棺八寸，屬六寸，椑四寸。上大夫大棺八寸，屬六寸。下大夫大棺六寸，屬四寸。”是屬闢為棺之重數也。《大記》之文，從外向內，大棺之內有屬，屬之丙有椑。椑，親身之棺。鄭玄雲：“椑，堅著之意也。”如記文，大夫無椑。今簡子自言有罪始不設闢者，鄭玄雲：“趙簡子云‘不設屬椑’，時僣也。”為時僣日久，自言無罪則僣設，有罪乃不設耳。記言“士棺六寸”，《檀弓》又云：“夫子為中都宰，制四寸之棺，五寸之槨。”鄭玄雲：“為民作制。”民猶四寸，簡子言三寸者，亦示其罰之重，令制度卑於民也。記有杝棺、梓棺，杝謂椵也，不以桐為棺。簡子言桐棺者，鄭玄雲：“凡棺用能溼之物，梓、椵能溼，故禮法尚之。”桐易腐壞，亦以桐為罰也。《檀弓》又云：“天子之棺四重。”鄭玄雲：“尚深邃也。諸公三重，諸侯再重，大夫一重，士不重。”又云：“水兕革棺被之，其厚三寸，杝棺一，梓棺二，四者皆周。”鄭玄雲：“以水牛、兕牛之革以為棺被，革各厚三寸，合六寸也，此為一重。”杝棺一，所謂椑棺也。椊棺二，所謂屬與大棺也。《檀弓》之文，自內向外，水牛之革，一也，兕牛之革，二也，二者相襲乃得為重，故以此二者為一重也。又有椑也，屬也，大棺也，此是天子四重。為數五棺，為四重也。《喪大記》之文，君有大棺也，椑也，屬也；大夫有大棺也，屬也。鄭玄注《檀弓》“天子之棺四重”，以是差之，上公革棺不被，三重也；諸侯無革棺，再重也；大夫無椑，一重也；士無屬不重也。是上公數四棺，為三重；諸侯數三棺，為再重；大夫數二棺，為一重；士以一棺，為一重也。杜之此注，惟無上公、士耳，其言重數與鄭同也。若然，《禮器》雲：天子葬五重，諸侯葬三重，大夫葬再重，以多為貴也。彼重亦當謂棺，而其數皆較一者，鄭玄雲：“天子葬五重者，謂杭木與茵也。葬者杭木在上，茵在下。”然則茵以藉棺，杭為負土，天子乃諸侯、大夫皆數彼以增棺數，故皆多較一也。杜言此棺之重數者，以明不設屬闢為罰也。" }
      - { type: j, text: "素車樸馬，以戴柩。○樸，普卜反。柩，其又反。" }
      - { type: z, text: "“素車樸馬”。○正義曰：素車，無飾，謂不以翣、柳飾車也。《曲禮》雲：“大夫去國，為位而哭，乘髦馬。”鄭玄雲：“髦馬，不鬄落也。”則此樸馬亦謂不鬄落，用此以載柩也。《雜記》稱：“士喪有與天子同者三：其終夜燎，及乘人，專道而行。”然則柩皆人挽，此用車馬載者，禮言乘人設法許之耳，道遠者當用牛馬，且此言亦為罰也。" }
      - { type: j, text: "無入於兆，兆，葬域。" }
      - { type: z, text: "“無入於兆”。○正義曰：《周禮·冢人》雲：“凡死於兵者，不入兆域。”鄭玄雲：“戰敗無勇，投諸塋外以罰之。”此言不入兆域，亦罰也。" }
      - { type: j, text: "下卿之罰也。”為眾設賞，自設罰，所以能克敵。○為，於偽反。甲戍，將戰，郵無恤御簡子，衛太子為右。郵無恤，王良也。○郵音尤。" }
      - { type: z, text: "注“郵無恤王良也”。○正義曰：下雲子良授綏，是也。服虔雲：王良也。《孟子》說王良善御之事。古者車駕四馬，御之為難，故為六藝之一。王良之善御，最有名，於書傳多稱之。《楚辭》雲：“當世豈無騏驥兮？誠無王良之善御。見執轡者非其人兮，故駒跳而遠去。”" }
      - { type: j, text: "登鐵上，鐵，丘名。望見鄭師眾，大子懼，自投於車下。子良授大子綏而乘之，曰：“婦人也。”言其怯。○怯，去業反。" }
      - { type: z, text: "“授大子綏”。○正義曰：《曲禮》雲：“凡僕人之禮，必授人綏。”《論語》稱孔子上車，“必正立，執綏”而升。綏者，挽以上車之索，故授之使之升也。《少儀》雲：“僕者右帶劍，負良綏，申之面，杝諸幦。”鄭玄雲：“面，前也。幦，覆苓也。良綏，君綏也。負之由左肩上入右腋下，申之於前覆苓上也。”" }
      - { type: j, text: "簡子巡列，曰：“畢萬，匹夫也，七戰皆獲，有馬百乘，死於牖下。畢萬，晉獻公卿也。皆獲，有功。死於牖下，言得壽終。○乘，繩證反。牖，羊九反。" }
      - { type: z, text: "“有馬”至“牖下”。○正義曰：襄二十七年傳曰：“唯卿備百邑。”注云：“一乘之邑也。”《坊記》雲：“家富不過百乘。”百乘，卿之極制也。《檀弓》雲：“飯於牖下，小斂於戶內，大斂於阼，殯於客位，祖於庭，葬於墓，所以即遠也。”則禮之正法死於牖下。" }
      - { type: j, text: "群子勉之，死不在寇。”言有命。繁羽御趙羅，宋勇為右。三子，晉大夫。羅無勇，麇之。麇，束縛也。○麇，丘隕反，注同。吏詰之，御對曰：“痁作而伏。”痁，瘧疾也。○詰，起吉反。痁，詩佔反。瘧，魚略反。衛大子禱曰：“曾孫蒯聵，敢昭告皇祖文王、周文王。皇，大也。○禱，丁老反，一音丁報反。" }
      - { type: z, text: "“衛大”至“襄公”。○正義曰：禮於曾祖以上冒稱曾孫。此雖並告三祖，對文王、康叔稱曾孫也。《晉語》說此事於襄公之下，又有“昭考靈公”。《國語》與傳異者多矣，此下雲“無作三祖羞”，是無昭考也。" }
      - { type: j, text: "烈祖康叔、烈，顯也。文祖襄公：繼業守文，故曰文祖。蒯聵，襄公之孫。鄭勝亂從，勝，鄭聲公名。釋君助臣，為從於亂。晉午在難，午，晉定公名。○難，乃旦反，下注“為難”同。不能治亂，使鞅討之。鞅，簡子名。蒯聵不敢自佚，備持矛焉。戎右持矛。○佚音逸。矛，亡侯反。敢告無絕筋，無折骨，無面傷，以集大事，無作三祖羞。集，成也。○筋，居銀反。大命不敢請，佩玉不敢愛。”不敢愛，故以祈禱。" }
      - { type: z, text: "“大命”至“敢愛”。○正義曰：上言“無絕筋、無折骨”，謂軍之士眾，無令損傷，以成大事。此雲“大命不敢請”者，謂巳之身命，不敢私請，苟以求生。“佩玉不敢愛”，《尚書·金縢》稱周公植璧秉珪以告大王、王季、文王，是禱請用玉也。在軍無珪璧，故以佩玉。" }
      - { type: j, text: "鄭人擊簡子，中肩，斃於車中，斃，踣也。○中肩，丁仲反。斃，婢世反，本亦作獘。踣，蒲北反。獲其蜂旗。蜂旗，旗名。○蜂，芳恭反。大子救之以戈，鄭師北，獲溫大夫趙羅。羅無勇，故鄭師雖北，猶獲羅。大子復伐之，鄭師大敗，獲齊粟千車。趙孟喜曰：“可矣。”趙孟，簡子也。喜大子前怯，今更勇。○復，扶又反。傅傁曰：“雖克鄭，猶有知在，憂未艾也。”傅傁，簡子屬也。言知氏將為難，後竟有晉陽之患。○傁，素口反；又作叟。有知，音智。艾，魚廢反，又五蓋反。初，周人與範氏田，公孫尨稅焉，尨，範氏臣，為範氏收周人所與田之稅。○尨，武江反。稅，始銳反。為，於偽反，下文“為其注”同。趙氏得而獻之。得尨以獻簡子。吏請殺之，趙孟曰：“為其主也，何罪？”止而與之田。還其所稅。及鐵之戰，以徒五百人宵攻鄭師，取蜂旗於子姚之幕下，獻，曰：“請報主德。”追鄭師，姚、般、公孫林殿而射，前列多死。晉前列。○幕音莫。姚、般，子姚、子般。殿，丁電反。射，食亦反。趙孟曰：“國無小。”言雖小國，猶有善射者。既戰，簡子曰：“吾伏弢嘔血，弢，弓衣。嘔，吐也。○弢，吐刀反。嘔，本又作<口咎>，烏口反。吐，他路反。鼓音不衰，今日我上也。”我功為上。大子曰：“吾救主於車，退敵於下，我，右之上也。”郵良曰：“我兩靷將絕，吾能止之，止，使不絕。○靷，以刃反。我，御之上也。”駕而乘材，兩靷皆絕。材，橫木。明細小也。傳言簡子不讓下自伐。" }
      - { type: z, text: "“兩靷”至“皆絕”。○正義曰：古之駕四馬者，服馬夾轅，其頸負軛，兩驂在旁挽靷助之，《詩》所謂“陰靷鋈續”是也。《說文》雲：“靷，引軸也。”僖二十八年注云：“在胸曰靷。”然則此皮約馬胸而引車軸也。兩靷將絕而能制焉，言其御之和也。“駕而乘材”，材謂橫地細小之木也。乘小木而靷絕，示其將絕之驗也。" }
      - { type: j, text: "吳洩庸如蔡納聘，而稍納師。師畢入，眾知之。元年，蔡請遷於吳，中悔，故因聘襲之。○洩，息列反，一音息引反，未詳。中，丁仲反。蔡侯告大夫，殺公子駟以說。殺駟以說吳，言不時遷，駟之為。哭而遷墓。將遷，與先君辭，故哭。冬，蔡遷於州來。" }
      - { type: j, text: "【經】三年，春，齊國夏、衛石曼姑帥師圍戚。（曼姑為子圍父，知其不義，故推齊使為兵首。戚不稱衛，非叛人。○曼音萬。為子，於偽反。）" }
      - { type: z, text: "注“曼姑”至“叛人”。正義曰：春秋行兵征伐，自非霸王之命，諸國共行，皆以主兵為首。此圍戚實出衛意，引齊使之助己，計應曼姑為首，而序在齊下者，曼姑為子圍父，知其不義，推齊使為兵首，故先書齊也。《穀梁傳》曰：“此衛事也，其先國夏何也？子圍父也。”是先儒及杜皆同《穀梁》之說也。宋魚石去而復入，據宋之彭城，襄元年經書“圍宋彭城”，傳曰：“非宋地，追書也。於是為宋討魚石，故稱宋，且不登叛人也。”此蒯聵在戚，齊、衛圍之，與圍宋彭城事類同矣。彭城稱宋，此不稱衛者，蒯聵據戚與輒爭國，非是叛人，故不須系之衛也。《公羊傳》曰：“齊國夏曷為與衛石曼姑帥師圍戚？伯討也。此其為伯討奈何？曼姑受命乎靈公而立輒，以曼姑之義，為固可以距之也。輒者曷為者也？蒯聵之子也。然則曷為不立蒯聵而立輒？蒯聵為無道，靈公逐蒯聵而立輒。然則輒之義可以立乎？曰：可。其可奈何？不以父命辭王父命，以王父命辭父命，是父之行乎子也。不以家事辭王事，以王事辭家事，是上之行乎下也。”其意言靈公廢蒯聵，不用使之得國。輒不以國與蒯聵，是靈公之命行於蒯聵也。立為國君，是王事也；以國與父，是私事也。不以國與父，是天子之命行於諸侯也。如《公羊》之言，則輒義可以距父，圍戚不為不義。而杜言曼姑“知其不義”，則輒不合距父，意與《公羊》異者，據《左傳》，公子郢讓國不受，然後立輒。然則輒之立也。以周禮，無適子，則立適孫。緣是以得立耳，非有靈公之命使立之也。為輒之義，自可讓而不受。以巳是適孫，緣有可立之勢，貪國以距父耳，非有靈公之命、天子之敕，使之距蒯聵也。《論語》說此事雲：“冉有曰：‘夫子為衛君乎？’子貢曰：‘諾。吾將問之。’入曰：‘伯夷、叔齊何人也？’曰：‘古之賢人也。’曰：‘怨乎？’曰：‘求仁而得仁，又何怨乎？’出曰：‘夫子不為也。’”孔子意不助輒，明是輒為不義，故曼姑自知不義，推齊為主。" }
      - { type: j, text: "夏，四月，甲午，地震。無傳。" }
      - { type: j, text: "五月，辛卯，桓宮、僖宮災。天火曰災。" }
      - { type: j, text: "季孫斯、叔孫州仇帥師城啟陽。無傳。魯黨範氏，故懼晉，比年四城。啟陽，今琅邪開陽縣。" }
      - { type: j, text: "宋樂髡帥師伐曹。無傳。○髡，苦孫反。" }
      - { type: j, text: "秋，七月，丙子，季孫斯卒。" }
      - { type: j, text: "蔡人放其大夫公孫獵於吳。無傳。公子駟之黨。" }
      - { type: j, text: "冬，十月，癸卯，秦伯卒。無傳。不書名，未同盟。" }
      - { type: j, text: "叔孫州仇、仲孫何忌帥師圍邾。無傳。" }
      - { type: j, text: "【傳】三年，春，齊、衛圍戚，求援於中山。（中山，鮮虞。）" }
      - { type: j, text: "夏，五月，辛卯，司鐸火。司鐸，宮名。○鐸，待洛反。" }
      - { type: z, text: "注“司鐸宮名”。○正義曰：僖二十年，西宮災，書之。此不書者，西宮，公之西宮，親近逼君，忽被天火，故重而書之。此司鐸雖是公小宮，在公宮之後，非君來往之急，又是人火，所以輕而不書。或可舉廟重以略之。" }
      - { type: j, text: "火逾公宮，桓、僖災。桓公、僖公廟。" }
      - { type: z, text: "“桓僖災”。○正義曰：傳言火，而經書災者，司鐸初被人火，火越宮而至廟。以火逾宮，故以災言之。" }
      - { type: j, text: "救火者皆曰顧府。言常人愛財。南宮敬叔至，命周人出御書，俟於宮，敬叔，孔子弟子南宮閱。周人，司周書典籍之官。御書，進於君者也。使待命於宮。○閱音悅。曰：“庀女，而不在，死。”庀，具也。○庀，匹婢反。女音汝。子服景伯至，命宰人出禮書，景伯，子服何也。宰人，冢宰之屬。以待命。命不共，有常刑。待求之命。○共音恭。校人乘馬，巾車脂轄，校人，掌馬。巾車，掌車。乘馬，使四匹相從，為駕之易。○校，戶教反，注及下同。乘，繩證反，注及下皆同。轄，戶瞎反，本又作鎋，同。為，於偽反。易，以豉反。百官官備，府庫慎守，官人肅給。國有火災，恐有變難，故慎為備。○難，乃旦反。濟濡帷幕，鬱攸從之。鬱攸，火氣也。濡物於水，出用為濟。○濟，子細反，又子禮反，注同。帷，位悲反。幕音莫。攸音由。蒙葺公屋，以濡物冒覆公屋。○葺，七入反，一音子入反。自大廟始，外內以悛。悛，次也。先尊後卑，以次救之。○悛，大全反。助所不給。有不用命，則有常刑，無赦。公父文伯至，命校人駕乘車。乘車，公車。季桓子至，御公立於象魏之外，象魏，門闕。命救火者，傷人則止，財可為也。命藏象魏，《周禮》，正月縣教令之法於象魏，使萬民觀之，故謂其書為象魏。○縣音玄。" }
      - { type: z, text: "注“周禮”至“象魏”。正義曰：《周禮·大宰》雲：“正月之吉，始和，布治於邦國都鄙，乃縣治象之法於象魏，使萬民觀治象。浹日而斂之。”鄭玄雲：“正月，周之正月。吉，謂朔日。大宰以正月朔日布王治之事於天下，至正歲又書而縣於象魏，使萬民觀焉。凡治有故，言‘始和’者，若改造云爾。鄭眾雲：‘從甲至甲，謂之浹日，凡十日。’”其《地官》、《夏官》、《秋官》皆有此言：《地官》雲：“佈教縣教象”；《夏官》雲：“佈政縣政象”；《秋官》雲：“布刑縣刑象。”各縣所掌之事為異，其文悉同。唯《春官》不縣者，以禮法一頒，百事皆足，不可又縣，故不縣之。杜總彼意言“縣教令之法”，彼所縣者皆是教令之事故也。由其縣於象魏，故謂其書為象魏，命藏其書也。彼言朔日縣之，十日即斂之，則救火之時，其書久巳藏矣。而此立象魏之外，方始命藏此書者，象魏是縣書之處，見其處而念及其書，非始就縣處斂藏之。" }
      - { type: j, text: "曰：“舊章不可亡也。”富父槐至，曰：“無備而官辦者，猶拾瀋也。”槐，富父終生之後。沈，汁也。言不備而責辦，不可得。○父音甫。槐音懷。官辦，辦具之辦，注並同。拾音十。沈，尺審反；北土呼汁為沈。於是乎去表之槁，表，表火道。風所向者，去其槁積。○去，起呂反，注同。槁，古老反，注同。向，許亮反。積，子賜反。道還公宮。開除道，周匝公官，使火無相連。○還，本又作環，戶關反，又音患，注同。孔子在陳，聞火，曰：“其桓、僖乎！”言桓、僖親盡而廟不毀，宜為天所災。" }
      - { type: z, text: "注“言桓”至“所災”。○正義曰：禮，諸侯親廟四焉，高祖之父，即當毀其廟。計桓之於哀，八世祖也，僖，六世祖也，親盡而廟不毀，言其宜為天所災也。所以不毀者，服虔雲：“季氏出桓公，又為僖公所立，故不毀其廟。”其意或然。《公羊傳》曰：“此皆毀廟也，其言災何？復立也。曷為不言其復立？《春秋》見者不復見也。何以不言及？敵也。”其意言哀公更立之，不可通於《左氏》，故以為元不毀耳。服虔又云：“俱在迭毀，故不言及。”杜無說，或當同時災。無先後，故不言及。" }
      - { type: j, text: "劉氏、範氏世為婚姻，劉氏，周卿士。範氏，晉大夫。萇弘事劉文公，為之屬大夫。故周與範氏。趙鞅以為討。責周與範氏。六月，癸卯，周人殺萇弘。終違天之禍。" }
      - { type: z, text: "“萇弘”至“萇弘”。○正義曰：文公以定四年卒也，為之屬大夫，謂當昭公之世也。此時文公已卒，萇弘知政。以已先事劉子，劉氏又與範氏親，既握國權，遂與範氏。故周人殺之，以說於晉。" }
      - { type: j, text: "秋，季孫有疾，命正常曰：“無死！正常，桓子之寵臣，欲付以後事，故敕令勿從巳死。○令，力呈反。南孺子之子，男也，則以告而立之；南孺子，季桓子之妻。言若生男，告公而立之。○孺，如住反。女也，則肥也可。”肥，康子也。季孫卒，康子即位。既葬，康子在朝。在公朝也。南氏生男，正常載以如朝，告曰：“夫子有遺言，命其圉臣曰：‘南氏生男，則以告於君與大夫而立之。’今生矣，男也，敢告。”遂奔衛。康子請退。退，闢位也。公使共劉視之，共劉，魯大夫。○共音恭。則或殺之矣。乃討之。討殺者。召正常，正常不反。畏康子也。傳備言季氏家事。" }
      - { type: z, text: "“召正常正常不反”。○正義曰：服虔雲：“召而問兒死意。”然則兒於正常去後始死，死非正常得知，召之復何所問也？當欲問不立康子之意，故正常畏康子不反。" }
      - { type: j, text: "冬，十月，晉趙鞅圍朝歌，師於其南。範、中行所在。荀寅伐其郛，伐其北郭圍。○郛，芳夫反。使其徒自北門入，已犯師而出。荀寅使在外救已之徒擊趙氏，圍之北門，因外內攻得出。" }
      - { type: z, text: "“荀寅”至“而出”。○正義曰：荀寅從內伐其北郭之郛，又使其救已之徒，自外伐圍郛之北門而入，因外內攻，故得出也。" }
      - { type: j, text: "癸丑，奔邯鄲。十一月，趙鞅殺士皋夷，惡範氏也。惡範氏而殺其族，言遷怒。○惡，烏路反，注同。" }
      - { type: j, text: "【經】四年，春，王二月，庚戌，盜殺蔡侯申。（賤者故稱盜，不言弒其君，賤盜也。○盜殺，申志反。蔡侯申，今本皆如此。案宣十七年，蔡侯申卒，是文侯也。今昭侯是其玄孫，不容與高祖同名，未詳何者誤也。）" }
      - { type: z, text: "“蔡侯申”。○正義曰：宣十七年蔡侯申卒，是文侯也。《蔡世家》雲：文侯申生景侯固，固生靈侯般，般生隱大子。今昭侯申是隱大子之子。杜《世族譜》亦然。計昭侯是文侯玄孫，乃與高祖同名，周人以諱事神，二申必有誤者，俱是經文，未知孰誤。○注“賤者”至“盜也”。○正義曰：公孫辰、公孫姓、公孫霍雖並是弒君之黨，而非弒君之首，首是公孫翩。翩賤，故稱盜。不言弒其君者，賤此盜也。盜賤，不得有其君，故以盜為文，不得言弒其君。" }
      - { type: j, text: "蔡公孫辰出奔吳。弒君賊之黨，故書名。" }
      - { type: j, text: "葬秦惠公。無傳。宋人執小邾子。無傳。邾子無道於其民，故稱人以執。" }
      - { type: j, text: "夏，蔡殺其大夫公孫姓、公孫霍。皆弒君黨。○姓音生，又作生，或一音性。" }
      - { type: j, text: "晉人執戎蠻子赤歸於楚。晉恥為楚執諸侯，故稱人以告，若蠻子不道於其民也。赤本屬楚，故言歸。○恥為，於偽反。" }
      - { type: j, text: "城西郛。無傳。魯西郭，備晉也。六月，辛丑，亳社災。無傳。天火也。亳社，殷社，諸侯有之，所以戒亡國。○亳，步各反。" }
      - { type: z, text: "注“天火”至“亡國”。○正義曰：傳例曰“天火曰災”，知天火也。殷有天下，作都於亳，故知亳社，殷社也。蓋武王伐紂，以其社班賜諸侯，使各各立之，所以戒亡國也。其社有屋，故火得焚之。《公羊傳》曰：“蒲社者何？亡國之社也。社者，封也，其言災何？亡國之社蓋揜之，揜其上而柴其下。”《穀梁傳》曰：“亳社者，亳之社也。亳，亡國也。亡國之社以為廟屏，戒也。其屋亡國之社，不得達上也。”說者以為立亳社於廟鬥之外，以為屏蔽，使人君視之而致戒也。《左傳》稱“間於兩社”，事當為然。《郊特牲》亦云，喪國之社，屋之不受天陽，故災其屋也。" }
      - { type: j, text: "秋，八月，甲寅，滕子結卒。無傳。同盟於皋鼬。" }
      - { type: j, text: "冬，十有二月，葬蔡昭公。無傳。亂故，是以緩。" }
      - { type: j, text: "葬滕頃公。無傳。" }
      - { type: j, text: "【傳】四年，春，蔡昭侯將如吳。諸大夫恐其又遷也，承，（承音懲，蓋楚言。○懲，直升反。）" }
      - { type: z, text: "注“承音懲蓋楚言”。○正義曰：懲創往年之遷，恐其更復遷徙。承、懲音相近，蓋是楚人之言，聲轉而字異耳。" }
      - { type: j, text: "公孫翩逐而射之，入於家人而卒。翩，蔡大夫。○翩音篇。射，食亦反，下同。" }
      - { type: z, text: "“入於家人而卒”。○正義曰：言“將如吳”，巳適吳矣，翩在路逐而殺之，遂入於凡人之家。言此者，說其非理之意。" }
      - { type: j, text: "以兩矢門之，眾莫敢進。翩以矢自守其門。文之鍇後至，鍇，蔡大夫。○鍇音楷，又音皆，又客駭反。曰：“如牆而進，多而殺二人。”並行如牆俱進。○並，步頂反。鍇執弓而先，翩射之，中肘。鍇遂殺之。故逐公孫辰而殺公孫姓、公孫盱。盱，即霍也。○中，丁仲反。肘，竹九反。盱，況於反。" }
      - { type: j, text: "夏，楚人既克夷虎，夷虎，蠻夷叛楚者。乃謀北方。左司馬眅、申公壽餘、葉公諸梁致蔡於負函，三子，楚大夫也。此蔡之故地人民，楚因以為邑。致之者，會其眾也。○眅，普版反，《字林》匹奸反。葉，始涉反。函音鹹。致方城之外於繒關。負函、繒關皆楚也。○繒，才陵反。曰：“吳將溯江入郢，逆流曰溯。○溯音素。郢，以井反，又以政反。將奔命焉。”為一昔之期，襲梁及霍。偽辭當備吳，夜結期，明日便襲梁、霍，使不知之。梁，河南梁縣西南故城也。南梁有霍陽山，皆蠻子之邑也。單浮餘圍蠻氏，蠻氏潰。浮餘，楚大夫。○單音善。潰，戶內反。蠻子赤奔晉陰地。陰地，河南山北自上雒以東至陸渾。○渾，戶門反。司馬起豐、析與狄戎，楚司馬眅也。析縣屬南鄉郡，析南有豐鄉，皆楚邑。發此二邑人及戎狄。○析，星曆反，注同。以臨上雒。左師軍於菟和，菟和山在上雒東也。○菟音徒。右師軍於倉野，蒼野在上雒縣。使謂陰地之命大夫士蔑命大夫，別縣監尹。○監，古銜反。" }
      - { type: z, text: "注“命大”至“監尹”。○正義曰：陰地者，河南山北東西橫長其間非一邑也。若是典邑大夫，則當以邑冠之，乃言“陰地之命大夫”，則是特命大夫，使總監陰地，故以為別縣監尹也。以其去國遙遠，別為置監。楚官稱尹，故以尹言之。" }
      - { type: j, text: "曰：“晉、楚有盟，好惡同之。若將不廢，寡君之原也。不然，將通於少習以聽命。”少習，商縣武關也。將大開武關道以伐晉。○少，詩照反，又如字。士蔑請諸趙孟，趙孟曰：“晉國未寧，安能惡於楚？必速與之！”未寧，時有範、中行之難。○難，乃旦反。士蔑乃致九州之戎，九州戎在晉陰地陸渾者。將裂田以與蠻子而城之，少許蠻子。且將為之卜。卜城。○為，於偽反，下注同。蠻子聽卜，遂執之，與其五大夫，以畀楚師於三戶。今丹水縣北三戶亭。○畀，必利反，與也。司馬致邑立宗焉，以誘其遺民，楚復詐為蠻子作邑，立其宗主。○復，扶又反。而盡俘以歸。" }
      - { type: j, text: "秋，七月，齊陳乞、弦施、衛甯跪救範氏。陳乞，僖子。弦施，弦多。○跪，其委反。庚午，圍五鹿。五鹿，晉邑。九月，趙鞅圍邯鄲。冬，十一月，邯鄲降。荀寅奔鮮虞，趙稷奔臨。臨，晉邑。○降，戶江反。十二月，弦施逆之，遂墮臨。國夏伐晉，取邢、任、欒、鄗、逆畤、陰人、於、壺口。八邑，晉也。欒在趙國平棘縣西北。鄗即高邑縣也。路縣東有壺口關。○墮，許規反。邢音刑。任音壬。欒，力官反。鄗，呼洛反；郭璞《三蒼解詁》音臛；《字林》，火沃反；韋昭，呼告反；闞駰雲，讀磽確，同。駰音止。盂音於。" }
      - { type: z, text: "“遂墮臨”。○正義曰：稷初奔臨，欲據臨距國。今弦施逆稷，故納之他邑。以臨險固，故毀之。" }
      - { type: j, text: "會鮮虞，納荀寅於柏人。晉邑也。今趙國柏人縣也。弦施與鮮虞會也。" }
      - { type: j, text: "【經】五年，春，城毗。（無傳。備晉也。○毗，頻夷反。）" }
      - { type: j, text: "夏，齊侯伐宋。無傳。" }
      - { type: j, text: "晉趙鞅帥師伐衛。" }
      - { type: j, text: "秋，九月，癸酉，齊侯杵臼卒。再同盟也。○杵，昌呂反。臼，求又反。" }
      - { type: z, text: "注“再同盟”。○正義曰：襄二十五年，崔杼弒莊公而立杵臼，昭二十八年，盟於鄟陵，定四年於皋鼬，是再同盟也。昭三十二年，大夫盟於狄泉，未告公而公薨，故不數也。" }
      - { type: j, text: "冬，叔還如齊。" }
      - { type: j, text: "閏月，葬齊景公。無傳。" }
      - { type: j, text: "【傳】五年，春，晉圍柏人，荀寅、士吉射奔齊。初，範氏之臣王生惡張柳朔，言諸昭子，使為柏人。（為柏人宰也。昭子，範吉射也。○惡，烏路反，下同。柳，良久反。）昭子曰：“夫非而讎乎？”對曰：“私讎不及公，（公家之事也。○夫音扶。）好不廢過，惡不去善，義之經也，臣敢違之？”及範氏出，（出柏人奔齊。○好，呼報反。去，起呂反。）張柳朔謂其子：“爾從主，勉之！我將止死，主生授我矣，（授我死節。）吾不可以僣之。”遂死於柏人。（為吉射距晉戰死。○僣，子念反，後同。為，於偽反。）" }
      - { type: j, text: "夏，趙鞅伐衛，範氏之故也，遂圍中牟。衛助範氏故也。" }
      - { type: j, text: "齊燕姬生子，不成而死。燕姬，景公夫人。不成，未冠也。○燕，於賢反。冠，古喚反。諸子鬻姒之子荼嬖，諸子，庶公子也。鬻姒，景公妾。荼，安孺子。○鬻音育。姒音似。荼音舒，又音徒，又丈加反。嬖，必計反。諸大夫恐其為大子也，言於公曰：“君之齒長矣，未有大子，若之何？”公曰：“二三子間於憂虞，則有疾疢，亦姑謀樂，何憂於無君？”景公意欲立荼而未發，故以此言塞大夫請。○長，丁丈反。閒音閒，又音閒廁之間，又如字。疢，敕覲反，本或作疹，乃結反。樂音洛。" }
      - { type: z, text: "“間於”至“無君”。○正義曰：公謂群臣雲，若間暇於憂虞，謂國無憂虞事得間暇，則恐有疾疢，不得飲樂。今既無憂虞，又無疾疢，亦且謀樂，何憂乎無君？" }
      - { type: j, text: "公疾，使國惠子、高昭子立荼，惠子，國夏。昭子，高張。寘群公子於萊。萊，齊東鄙邑。○寘，之豉反。群，或作諸。萊音來。秋，齊景公卒。冬，十月，公子嘉、公子駒、公子黔奔衛，公子鉏、公子陽生來奔。皆景公子在萊者。○黔，巨廉反，又音琴。鉏，仕居反。萊人歌之曰：“景公死乎不與埋，三軍之事乎不與謀，師乎師乎，何黨之乎？”師，眾也。黨，所也。之，往也。稱諡，蓋葬後而為此歌，哀群公子失所。○與音預，下同。埋，亡皆反。" }
      - { type: z, text: "注“師眾”至“失所”。○正義曰師，眾；之，往，《釋詁》文也。《周禮》，五百家為黨，言其共居一所，故以黨為名。是黨為所也。經書“閏月，葬齊景公”，《長曆》閏十一月，禮，葬乃有諡，此歌稱諡，明是葬後。傳言“冬十月”者，記公子出奔之月。其萊人之歌，在公子出奔之後。杜以文承十月之下，故云“蓋”耳。《公羊》以為“喪以閏數”，謂通數閏月。《穀梁》雲“不正其閏也”，謂喪事不數。左氏無傳，未知所從。" }
      - { type: j, text: "鄭駟秦富而侈，嬖大夫也，而常陳卿之車服於其庭。鄭人惡而殺之。子思曰：“《詩》曰：‘不解於位，民之攸塈。’子思，子產子國參也。《詩·大雅》。攸，所也。塈，息也。○侈，昌氏反，又尺氏反。惡，烏路反。解，佳賣反。塈音許器反。" }
      - { type: z, text: "“詩曰”至“攸塈”。○正義曰：《詩·大雅·嘉樂》之篇也。言在上者不解惰於其位，民之所以得安息。駟秦棄位僣上，是惰於位也。" }
      - { type: j, text: "不守其位，而能久者鮮矣。《商頌》曰：‘不僣不濫，不敢怠皇，命以多福。’”僣，差也。濫，溢也。皇，暇也。言駟秦違《詩》、《商頌》，故受禍。○鮮，息淺反。濫，力暫反。溢音逸。" }
      - { type: z, text: "“商頌”至“多福”。○正義曰：《商頌·殷武》之篇。歌成湯之德，不僣差，不濫溢，不敢怠惰而自暇，以此之故，上天命以多福也。《詩》於“怠皇”之下，更雲：“命於下國，封建厥福。”傳言“命以多福”，不復具引《詩》文，取其意而言之也。杜雲：“違《詩》、《商頌》”，上言《詩》，下言《頌》，以駟秦於此二詩皆違，故言違《詩》與《商頌》。" }
      - { type: j, text: "《春秋左傳正義》" }
