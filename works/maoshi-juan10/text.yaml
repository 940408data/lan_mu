# 毛詩正義卷10（孔穎達疏）：j 為經文＋毛亨傳、鄭玄箋，z 為疏文。
sections:
  - id: juan10
    name: 正文
    blocks:
      - { type: j, text: "《車攻》，宣王復古也。宣王能內修政事，外攘夷狄，覆文、武之境土。修車馬，備器械，復會諸侯於東都，因田獵而選車徒焉。東都，王城也。○攘，如羊反，除也，卻也。竟音境。械，戶戒反。《三蒼》雲：“械，總名也。”《說文》雲：“無所盛曰械。”復會，扶又反。選，宣兗反，數也；沈思戀反。下同。" }
      - { type: z, text: "“《車攻》八章，章四句”至“車徒焉”。○正義曰：以詩次有義，故序者每乘上篇而詳之。言內修政事，外攘夷狄者，由內事修治，故能外平強寇，即上二篇南征、北伐是也。不言蠻，言夷者，總名也。既攘去夷狄，即是復竟土，是為復古也。案《王制》注以為，武王因殷之地，中國三千，海隅五千。至周公、成王斥大九州之界，乃中國七千，海隅萬里。彼注者，據文而言耳，其實武王與成王之時，土境不甚相遠也。何則？武王崩後，王室流言，四國皆叛，不暇外討。三監既定，即為大平，制禮便雲大界。以此知其境土廣狹不得相懸也。《王制》據其初伐紂言耳。武王之末，境應稍大。言覆文、武之境土，以文、武，周之先王，舉以言之。此當復成、康之時也。何則？文王未得天下，其境與武王不同，而配武言之，明為先王而言也。成初武末，土境略同，故舉文、武而言大界，《王制》之法，據禮為正耳。不然，豈周公數年攝政，能使三倍大於武王？宣王攘去夷狄，仍小成王三倍？且宣王，中興明君，美其復古，比諸成、康才四分之一，則展也大成，徒虛言耳。若宣王復古，始廣三千，則厲王之末，當城壞壓境，以文逆意，理在不然，故知復古，復成、康之時。以文、武先生，舉而言之耳。言修車馬，即首章、二章，上二句是也。言備器械攻戰之具，三章“建旐設旄”之類是也。復會諸侯於東都，四章是也。言復者，對上篇為復，猶《卷耳》言又也。因田獵，即六章、七章是也。而選車徒，即三章上二句是也。經先言選徒，序先言田獵者，選徒然後東行，故經先言之。序以選徒本為田獵，故言因田獵選車徒也。言因者，以會為主，因會而獵也。王者能使諸侯朝會，是事之美者，故以會諸侯為主焉。上三章先致其意。首章致會同之意，二章、三章致田獵之意，故云“駕言”、“摶獸”，皆致意之辭，未實行也。四章言既至東都，諸侯來會。五章言田罷之後，射餘獲之禽。六章、七章言田獵之事。卒章總歎美之也。班餘獲射在田獲之後，而先田言之者，以射是諸侯群臣之事，因上章諸侯來會而即說之，令臣事自相次也。" }
      - { type: j, text: "我車既攻，我馬既同，攻，堅。同，齊也。宗廟齊毫，尚純也。戎事齊力，尚強也。田獵齊足，尚疾也。○豪，戶刀反，依字作“毫”也。" }
      - { type: j, text: "四牡龐龐，駕言徂東。龐龐，充實也。東，洛邑也。○龐，鹿同反，徐扶公反。" }
      - { type: z, text: "“我車”至“徂東”。○正義曰：宣王言，我會同之戎車既堅緻矣，我戎馬既齊力矣，四牡之馬龐龐然充實矣，當為我駕，我當乘之以往東都，與諸侯行會同也。○傳“宗廟”至“尚疾”。○正義曰：“宗廟齊毫，戎事齊力，田獵齊足”，《釋畜》文也。“尚純”、“尚強”、“尚疾”，是毛以義增解之也。齊其毫毛，尚純色；齊其馬力，尚強壯；齊其馬足，尚迅疾也。引之者，證經“既同”為齊力之義，因連引宗廟、田獵之全文。李巡曰：“祭於宗廟，當加謹敬，取其同色也。”某氏曰：“戎事，謂兵革戰伐之事，當齊其力，以載干戈之屬。”舍人曰：“田獵，取牲於苑囿之中，追飛逐走，取其疾而已。”" }
      - { type: j, text: "田車既好，四牡孔阜，東有甫草，駕言行狩。甫，大也。田者，大芟草以為防，或舍其中。褐纏旃以為門，裘纏質以為槸，間容握，驅而入，擊則不得入。之左者之左，之右者之右，然後焚而射焉。天子發然後諸侯發，諸侯發然後大夫、士發。天子發抗大綏，諸侯發抗小綏，獻禽於其下，故戰不出頃，田不出防，不逐奔走，古之道也。箋雲：甫草者，甫田之草也。鄭有甫田。○甫，毛如字，大也。鄭音補，謂圃田，鄭藪也。艾，魚廢反。褐音曷。槸，魚列反，何魚子反，門中闑。轚音計，劉兆注《穀梁》雲“繼也”，本又作“擊”，音同，或古歷反。“之左者之左”，一本無上“之”字，下句亦然。射，食弋反。抗，苦浪反，舉也。綏，本亦作“緌”，而隹反，下同。頃，苦穎反。甫田，舊音補，十藪，鄭有圃田，下同；毛依字。甫，大也。" }
      - { type: z, text: "“田車”至“行狩”。毛以為，宣王言我田獵之車既善好，四牡之馬又甚盛大，東都之界有廣大之草，可以就而田獵焉。當為我駕此車馬，我將乘之而往，狩獵於彼。言既會諸侯，又與田也。鄭唯以“東有甫草”為“圃田之草”為異耳。○傳“甫大”至“之道”。○正義曰：以田法，芟草為防，是廣大之處，故訓甫為大也。謂寬大之地，有草可芟，故言甫草也。因而廣言田獵之法，次在大草之意。田獵者，必大芟殺野草以為防限，作田獵之場，擬殺圍之處。或復止舍其中，謂未田之前，誓士戒眾，故教示戰法，當在其間止舍也。其防之廣狹無文。即為防限，當設周衛而立門焉。乃以織毛褐布纏通帛旃之竿，以為門之兩傍，其門蓋南開，併為二門，用四旃四褐也。又以裘纏椹質以為門中之闑。闑，車軌之裏，兩邊約車輪者。其門之廣狹，兩軸頭去旃竿之間各容一握。握人四指為四寸，是門廣於軸八寸也。入此門，當馳走而入，不得徐也。以教戰試其能否，故令驅焉。若驅之，其軸頭擊著門傍旃竿，則不得入也。所以罰不一也。以天子六軍，分為左右，雖同舍防內，令三軍各在一方，取左右相應。其屬左者之左門，屬右者之右門，不得越離部位，以此故有二門也。此屬夏苗之田也。《周禮》“仲夏，教茇舍。”鄭雲：“茇舍，草止也。軍有草止之法。”此苗田即草止，明芟草止其中焉。或舍其中也。以教戰即軍禮，同，故言軍有草止之法。仲夏舉草舍之法，田禮皆當然也。故“仲冬教大閱”雲：“前期群吏，戒眾庶，修戰法。虞人萊所田之野為表，百步則一，為三表。又五十步為一表。田之日，司馬建旗於後表之中，群吏以旗物鼓鐸鐲鐃，各帥其民而致。質明，弊旗，誅後至者。乃陳車徒，如戰之陳。注云：“萊，芟除可陳之處。表，所以識正行列也。四表積二百五十步。左右之廣，當容三軍，步數未聞。”鄭雲“芟除可陳之處”，是芟草為教戰之所。傳言“田者，大芟草以為防”，則芟草為田獵之處，明先獵以教戰，合圍又在間焉，二者同處也。鄭以最南一表，以北百步為二表，又北百步為三表，又北五十步為四表，謂之後表。是四表二百五十步也。以下有以旌為左右和之門，故言“左右之廣，當容三軍，但步數未聞耳”。彼又曰：“以旌為左右和之門，群吏各帥其車徒，以敘和出左右。”注云：“軍門曰和，今謂之壘門，立兩旌以為之。敘和出，用次第出和門也。”彼旌即此旃也。彼言“敘和出”，此言“驅而入”，不同者，此據質明時初入和門。既入，同在後表之中，將以教戰也。既誓，從後表前至第二表，一弊其旗，車徒皆坐。又從第二表至前第三，又然。又從前第三至最前，退卻，教振旅，至後表。禮畢，當從是以出田，故敘和出左右，與此終始各舉其一，故不同也。計立旌為門，當在教戰之前。《周禮》以旌為左右和之門，文在教戰下者，以教戰之時，直言建旌後表之中，不說入門之事，故不言立門。教畢，以敘和出。因其將出而言立門，故文在下。其實戰之前，門已先設也。教戰既畢，士卒出和，乃分地為屯。既陳，車驅卒奔，驅禽，內之於防，然後焚燒此防草，在其中而射之。天子先發，然後諸侯發，然後大夫、士發。發謂發矢射之也。其天子發則先抗舉其大綏，諸侯發則舉其小綏。必舉此綏為表，天子諸侯殺之時，因獻其禽於其下也，故戰不出所期之頃田，不出所芟之防，不逐奔走。謂出於頃防者，不逐之，古之道也。抗綏，謂既射舉之，因置虞旗於其中，受而致禽焉。受禽獵止則弊之，故《王制》曰：“天子殺則下大綏，諸侯殺則下小綏。”注云：“下謂弊之。”是殺禽已訖，田止而弊綏也。各舉終始之一，故與此不同也。此等似有成文，未知其事所出。昭八年《穀梁傳》曰：“芟蘭以為防。以葛覆質為槷。”與此不同。《鄭志》答張逸雲：“戰有頃數，不能盡其多少，猶今戰場者不出其頃界，田者不出其防也。”《王制》雲：“昆蟲未蟄，不以火田。”則用火田獵。唯在冬耳．此言焚而射之。自焚所芟之草。非放火田獵。四時皆焚之也。故《地耿·山虞》、《澤虞》皆雲：“大田，萊山田之野。”言大田，則天子四時之田皆然矣。既萊其地，明悉焚之。此時王仍未至本都，非正田之時。毛因大草，廣言獵法，不謂此時即然也。○箋“甫草”至“甫田”。○正義曰：以下雲“搏獸於敖”，敖，地名，則甫草亦是地名，不宜為大，故易之為圃田之草。且東都之地，自有圃田，故引《爾雅》以證之。“鄭有圃田”，《釋地》文也。郭璞曰：“今滎陽中牟縣西圃田澤是也。”《職方》曰：“河南曰豫州，其澤藪曰圃田。”宣王之時，未有鄭國，圃田在東都畿內，故宣王得往田焉。" }
      - { type: j, text: "之子於苗，選徒囂囂。之子，有司也。夏獵曰苗。囂囂，聲也。維數車徒者，為有聲也。箋雲：於，曰也。○囂，五刀反，或許驕反。數，所主反。" }
      - { type: j, text: "建旐設旄，搏獸於敖。敖，地名。箋雲：獸，田獵搏獸也。敖，鄭地，今近滎陽。○搏音博，舊音付。近，附近之近。" }
      - { type: z, text: "“之子”至“於敖”。○毛言宣王欲鄉東都之時，其是子群吏之有司於是為將夏田之苗，選數車徒，不為讙譁，唯數者有聲囂囂然。言時官人皆能其事也。既選車徒，王言當建立旐於車，而設旄牛尾於旐之首，與旄同建，我當乘之，往搏取禽獸於敖地也。○鄭以“於”為“曰”，則之子斥宣王，為異耳。○傳“之子”至“有聲”。○正義曰：《大司馬》：“仲夏，教茇舍，如振旅之陳。群吏選車徒。”謂數擇之也。此時事與彼同，則有司謂群吏有事者，大司馬之屬矣。傳以此子為有司，下文“之子”亦非王身，當謂凡從王者，非獨司馬官屬也。夏獵曰苗，則此時宣王為夏田也。上雲“駕言行狩”者，是獵之總名，但冬獵大於三時，故狩為冬獵名耳，非宣王發意向東，許歷冬夏也。下雲“有聞無聲”，則在軍不得讙譁。而云囂囂之聲，故知唯數者為有聲。○箋“於，曰”。○正義曰：傳之訓“於”為“於”、為“往”，無為“曰”者，箋以為“曰”，則與傳不同。言“之子曰”，“曰”則是命事之辭，“之子”當斥宣王，不得為有司也。下雲“之子於徵”，亦謂宣王行也，但不訓“於”字，則“於徵”當為往徵矣。" }
      - { type: j, text: "駕彼四牡，四牡奕奕。言諸侯來會也。" }
      - { type: j, text: "赤芾金舄，會同有繹。諸侯“赤芾金舄”，舄，達屨也。時見曰會，殷見曰同。繹，陳也。箋雲：金舄，黃硃色也。○舄音昔。繹音亦。見，賢遍反，下同。" }
      - { type: z, text: "“駕彼”至“有繹”。○正義曰：言宣王之至東都，四方諸侯駕彼四牡之馬而來，其四牡之馬則奕奕然閒習。既朝見於王，而服赤芾金舄之飾。與王行會同之禮者，有陳於會同之位，言各以爵之尊卑，陳列於其位次者。○傳“諸侯”至“曰同”。○正義曰：言諸侯赤芾，對天子當朱芾也。言“金舄，達屨”者，《天官·屨人》注云：“舄有三等，赤舄為上，冕服之舄，下有白舄、黑舄。”此雲金舄者，即禮之赤舄也，故箋雲“金舄，黃硃色”。加金為飾，故謂之金舄。白舄、黑舄猶有在其上者，為尊未達。其赤舄則所尊莫是過，故云“達屨”，言是屨之最上達者也。此舄也，而曰屨，屨，通名。以舄是祭服，尊卑異之耳，故屨人兼掌屨舄，是屨為通名也。“時見曰會，殷見曰同”，《大宗伯》文也。定本雲“殷頫曰同”，誤也。注云：“時見者，無常期。”諸侯有不服者，王將有徵伐之事，則既朝覲，王為壇於國外，合諸侯而命事焉。殷，眾也。十二歲，王如不巡狩，則六服盡朝。朝禮既畢，王為壇合諸侯，以命政焉。如是，則會、同其禮各別，不得並行之矣。但此時王與諸侯會東都，非十二年之事。言“同”者，以會、同對文則別，散則義通。會者，交會。同者，同聚。理既是一，故《論語》及此連言之。" }
      - { type: j, text: "決拾既佽，弓矢既調。決，鉤弦也。拾，遂也。佽，利也。箋雲：佽，謂手指相佽比也。調，謂弓強弱與矢輕重相得。○夬，本又作“決”，或作“抉”，同古穴反。佽音次，《說文》子利反，雲：“便利也。”比，毗志反。" }
      - { type: j, text: "射夫既同，助我舉柴。柴，積也。箋雲：既同，已射，同復將射之位也。雖不中必助中者，舉積禽也。○柴，子智反，又才寄反，《說文》作“{此手}”，士賣反。中，丁仲反，下“中者”同。" }
      - { type: z, text: "“決拾”至“舉柴”。○正義曰：此章言諸侯從王田罷，賜射餘獲之事也。言時諸侯所有決之與拾既與手指相比次而和利矣，弓之與矢既強弱相得而調適矣，既田畢，王以餘獲之禽賜之，則以此射而取之。此射夫皆已射一番，若中得禽者，既同復將射之位，欲更射以求禽也。若以射之而不中者，則又助我中者舉積禽。此文承諸侯之下，射夫即諸侯也。其大夫亦在獲射之中，則此可以兼焉。諸侯而謂之射夫者，夫，男子之總名。○箋“佽謂”至“相得”。○正義曰：鄭以佽為利，其義不明，故申而成之。決著於右手大指，所以鉤弦，開體遂著於左臂，所以遂弦，手指相比次，而後射得和利，故毛雲“佽，利”，謂相次然後射利，非訓佽為利也。言“調，謂弓強弱與矢輕重相得”者，弓體有強弱，各其力之所便。又弓矢之各有安危，調之使相得。○箋“既同”至“積禽”。○正義曰：田無射禮，唯既田乃有班餘獲射在於澤宮。言同復將射之位，在澤宮之位也。以言助我舉積，是不得利者助他人也，故射雖不中，必助中者舉積禽矣。《鄉射禮》雲“禮，射不主皮，不勝者降”，即此是也。此謂士大夫以上有禮射者，庶人則以主皮當禮射，故鄉大夫以五物詢眾，三曰主皮，是也。" }
      - { type: j, text: "四黃既駕，兩驂不猗。言御者之良也。○猗，於寄反，又於綺反。" }
      - { type: j, text: "不失其馳，舍矢如破。言習於射御法也。箋雲：御者之良，得舒疾之中。射者之工，矢發則中，如椎破物也。○舍音捨。椎，直追反。" }
      - { type: z, text: "“四黃”至“如破”。○正義曰：王既會諸侯，乃與之田。言王乘四黃之馬既駕矣，兩驂之馬不相依猗，御者節御此馬，令不失其馳騁之法。故令射者舍放其矢，則如椎破物，能中而駃也。言御良射善，所以美之。○箋“言御者之良”。○正義曰：《駟鐵》雲：“六轡在手。”箋雲：“言馬之良。”此雲御良者，雖馬御相須，而設文有意。彼雲在手，主說馬良，不用御者之力，故言在手而已。此雲驂不相猗，乃御者使之然，故云御良。各觀其文而為說也。" }
      - { type: j, text: "蕭蕭馬鳴，悠悠旆旌，言不讙譁也。○讙音歡，又音暄。譁音花。徒御不驚，大庖不盈。徒，輦也。御，御馬也。不驚，驚也。不盈，盈也。一曰乾豆，二曰賓客，三日充君之庖，故自左膘而射之，達於右腢，為上殺。射右耳本，次之。射左髀，達於右<骨肖>，為下殺。面傷不獻。踐毛不獻。不成禽不獻。禽雖多，擇取三十焉，其餘以與大夫、士。以習射於澤宮，田雖得禽，射不中不得取禽。田雖不得禽，射中則得取禽。古者以辭讓取，不以勇力取。箋雲：不驚，驚也。不盈，盈也。反其言，美之也。“射右耳本”，“射”當為“達”。三十者，每禽三十也。○庖，蒲茅反。膘，頻小反，又扶了反。《三蒼》雲：“小腹兩邊肉也。”《說文》雲：“脅後髀前肉也。”本亦作“髀”，蒲禮反。或又作“”。射，食亦反，下“射左髀”同。腢，本亦作“髃”，音愚，又五厚反，謂肩前也；《說文》同；郭音偶，謂肩前兩間骨；何依注。《公羊》自左膘射之，達於右腢，中心死疾，鮮潔也。又五回、五公二反。射右耳，食亦反。脾，本又作“髀”，方爾反，又薄禮反，謂股外。，餘繞反，又胡了反，謂水膁也。字書無此字，一本作“<骨號>”，音羊紹反，又羊招反，呂忱於小反。本或作“膘”。踐，子淺反。" }
      - { type: z, text: "“蕭蕭”至“不盈”。○正義曰：言王之田獵，非直射良御善，又軍旅齊肅，唯聞蕭蕭然馬鳴之聲，見悠悠然旆旌之狀，無敢有讙譁者。徒行鞔輦者，與車上御馬者，豈不驚戒乎？言以相警戒也。君之大庖，所獲之禽不充滿乎？言充滿也。○傳“徒輦”至“力取”。○正義曰：諸徒皆為徒行，此獨以為輦者，《釋訓》雲：“徒御不驚輦者也。”《爾雅》特釋此文，故依而為說。《地官·鄉師》雲：“大軍旅會同治其輦。”注云：“輦人挽行，所以載任器也。止以為蕃營。”《司馬法》輦有一斧一斤一鑿一梩。周輦加二板二築，夏后氏二十人而輦，殷十八人而輦，周十五人而輦。是會田獵，人挽輦以徒行也。徒既為輦者，故御為御馬者也。以此美宣王之歌，故知不驚、不盈，聲而疊之，故箋反其言美之，此為美之深者也。鄭於此申毛者，反“鄂不韡韡”不從毛說，以上未有此比，故於是言之，明以後此類皆然矣。傳又因經“大庖不盈”，廣言殺獸充庖之事。一曰乾豆，謂第一上殺者，乾足以為豆實，供宗廟也。二曰賓客，謂第二殺者，別之以待賓客也。三曰充君之庖，謂第三下殺者，取之以充實君之庖廚也。君尊宗廟，敬賓客，故先人而後己，取其下也。又分別殺之三等，故自左膘而射之，達過於右肩腢，為上殺，以其貫心死疾，肉最絜美，故以為乾豆也。“射右耳本”，箋雲“射”當為“達”，亦自左射之，達右耳本而死者，為次殺，以其遠心，死稍遲，肉已微惡，故以為賓客也。不言自左者，蒙上文可知。射左股髀，而達過於右脅，為下殺，以其中脅，死最遲，肉又益惡，充君之庖也。凡射獸，皆逐後從左廂而射之，達於右，言射左髀，則上殺達於右腢，當自左脅也。次殺右耳本，當自左肩腢也。不言自左，舉下殺之射左髀，可推而知也。《王制》及《公羊》、《穀梁》皆雲“充君之庖”，無“廚”字。鄭雲“庖，今之廚”，則傳本亦無“廚”字，“廚”，衍字也。定本亦無“廚”字。箋知射當為達者，以射必自左，不得從右而射，且與上下不類，故知當為達也。面傷不獻者，謂當面射之。翦毛不獻，謂在傍而逆射之。二者皆為逆射，不獻者，嫌誅降之義。不成禽不獻者，惡其害幼少。此不能使獵者無之，自君所不取，以示教法耳。禽雖多，擇取三十焉。鄭雲：“三十者，每禽三十。”以君之獵，不宜諸種止取三十，故以為每禽焉。則宗廟、賓客、君庖各十也。其餘每禽三十之外，以與卿、大夫、士習射澤宮，所以班餘獲射也。不言諸侯，諸侯不常在。卿、大夫尚得與射，諸侯在射，可知也。以大獸公之，非復己物，君賜使射，故非中不取。言曏者田獵所取，用勇力；今射者，禮樂所取，用辭讓也。此當有成文，《書傳》、《穀梁傳》與此略同。" }
      - { type: j, text: "之子於徵，有聞無聲，有善聞而無喧譁之聲。箋雲：晉人伐鄭。陳成子救之，舍於柳舒之上，去穀七里，穀人不知。可謂有聞無聲。○聞音問，注同，本亦作“問”。" }
      - { type: j, text: "允矣君子，展也大成。箋雲：允，信。展，誠也。大成，謂致太平也。" }
      - { type: z, text: "“之子”至“大成”。○毛以為，是從王往行群臣有善聞，而率其所部，無喧譁之聲。王能使所從若是，信矣君子，宣王誠實也，其功大成。言太平也。○鄭以“之子”斥“宣王”為異耳。○箋“晉人”至“無聲”。○正義曰：事在哀二十七年《左傳》，曰：“晉荀瑤伐鄭，次於桐丘。鄭駟弘請救於齊。陳成子救鄭。及留舒，違穀七里，穀人不知。”是其事也。留、柳不同，蓋所據書異。穀本齊邑，而引之者，證無聲也。" }
      - { type: j, text: "《車攻》八章，章四句。" }
      - { type: j, text: "《吉日》，美宣王田也。能慎微接下，無不自盡以奉其上焉。" }
      - { type: z, text: "“《吉日》四章，章六句”至“其上焉”。○正義曰：作《吉日》詩者，美宣王田獵也。以宣王能慎於微事，又以恩意接及群下，王之田獵能如是，則群下無不自盡誠心以奉事其君上焉。由王如此，故美之也。慎微，即首章上二句是也。接下，卒章下二句是也。四章皆論田獵，言田足以總之。時述此慎微接下二事者，以天子之務，一日萬機，尚留意於馬祖之神，為之祈禱，能謹慎於微細也。人君游田，或意在適樂，今王求禽獸，唯以給賓，是恩隆於群下也。二者，人君之美事，故時言之也。下無不自盡以奉其上，述宣王接下之義，於經無所當也。" }
      - { type: j, text: "吉日維戊，既伯既禱。維戊，順類乘牡也。伯，馬祖也。重物慎微，將用馬力，必先為之禱其祖。禱，禱獲也。箋雲：戊，剛日也，故乘牡為順類也。○禱，丁老反，馬祭也，《說文》作“禂”。為之，於偽反。" }
      - { type: j, text: "田車既好，四牡孔阜。升彼大阜，從其群醜。箋雲：醜，眾也。田而升大阜，從禽獸之群眾也。" }
      - { type: z, text: "“吉日”至“群醜”。正義曰：言王於先以吉善之日維戊也，於馬祖之伯既祭之求禱矣，以田獵當用馬力，故為之禱祖，求其馬之強健也。田獵之車既善好，四牡之馬甚盛大，王乃乘之，升彼大陵阜之上，從逐其群眾之禽獸。言車牢馬健，故得歷險從禽，是由禱之故也。○傳“維戊”至“禱獲”。○正義曰：馬，國之大用，王者重之，故《夏官·校人》：“春祭馬祖，夏祭先牧，秋祭馬社，冬祭馬步。”注云：“馬祖，天駟。先牧，始養馬者。馬社，始乘馬者，馬步，神為災害馬者。”既四時各有所為祭之。馬祖祭之在春，其常也，而將用馬力，則又用彼禮以禱之。祭必用戊者，日有剛柔，猶馬有牝牡，將乘牡馬，故禱用剛日，故云維戊，順其剛之類而乘牡馬。知“伯，馬祖”者，《釋天》雲：“既伯既禱，馬祭也。”為馬而祭，故知馬祖謂之伯。伯者，長也。馬祖始是長也。鄭雲：“馬祖，天駟。”《釋天》雲：“天駟，房也。”孫炎曰：“龍為天馬，故房四星謂之天駟。”鄭亦引《孝經說》曰“房為龍馬”，是也。言重物慎微者，重其馬之為物，慎其祭之微者。將用馬力，必先為之禱其祖，是謹慎其微細也。言禱獲者，為田而禱馬祖，求馬強健，則能馳逐獸而獲之。" }
      - { type: j, text: "吉日庚午，既差我馬。外事以剛日。差，擇也。獸之所同，麀鹿麌々。鹿牝曰麀。麌々，眾多也。箋雲：同猶聚也。麕牡曰麌。麌復麌，言多也。○麀音憂。麌，愚甫反，《說文》作“噳”，雲：“麋鹿群口相聚也。”麕，本又作“麇”，俱倫反。復，扶又反。" }
      - { type: j, text: "漆沮之從，天子之所。漆沮之水，麀鹿所生也。從漆沮驅禽，而致天子之所。○沮，七徐反。" }
      - { type: z, text: "“吉日”至“之所”。○毛以為，王以吉善之日庚午日也，既簡擇我田獵之馬，擇取強者，王乘以田也。至於田所，而又有禽獸。其獸之所同聚者，則麀之與鹿麌麌然眾多，遂以驅逆之車，驅之於漆沮之傍，從彼以至天子之所。以獵有期處，故驅禽從之也。上言乘車升大阜，下言獸在中原，此雲驅之漆沮，皆見獸之所在驅逐之事以相發明也。鄭唯以麌為獸名為異耳。○傳“外事”至“差擇”。○正義曰：“外事以剛日”，《曲禮》文也。言此者，上章順剛之類，故言維戊，擇馬不取順類，亦用庚為剛日，故解之，由擇馬是外事故也。莊二十九年《左傳》曰：“凡馬，日中而出，日中而入。”則秋分以至春分，馬在廄矣。擇馬不必在廄，得為外事者，馬雖在廄，擇則調試善惡，必在國外故也。《禮記》注外事內事皆謂祭事，此擇馬非祭，而得引此文者，彼雖主祭事，其非祭事，亦以內外而用剛柔，故斷章引之也。庚則用外，必用午日者，蓋於辰午為馬故也。“差，擇”，《釋詁》文。○傳“鹿牝”至“眾多”。○正義曰：《釋獸》雲：“鹿，牝麚，牝麀。”是鹿牝曰麀也。“麋麋，眾多”，與《韓奕》同，則傳本作麌字。○箋“麕牝”至“言多”。○正義曰：《釋獸》雲：“麕，牡麌，牝麋。”是麕牡曰麌也。郭璞引《詩》曰：“麀鹿麌々。”鄭康成解即謂此也，但重言耳。《音義》曰：“‘麕’，或作‘麏’，或作‘麇’。”是為麇牡曰麌也。由麇之相類，又承鹿牡之下。本或作“麇牝”者，誤也。《釋獸》又云：“麋，牡麔，牝麎。”下箋雲“祁當作麎。麎，麋牝”是也。必易傳者，以言獸之所同，明獸類非一，故知其所言者皆獸名。下“其祁孔有”，傳訓祁為大，直雲其大甚有，不言獸名，不知大者何物。且《釋獸》有麎之名，故易傳而從《爾雅》也。注《爾雅》者，某氏亦引《詩》雲“瞻彼中原，其麎孔有”，與鄭同。下箋雲“祁”當作“麎”。此麌不破字，則鄭本亦作麌也。" }
      - { type: j, text: "瞻彼中原，其祁孔有。祁，大也。箋雲：“祁”當作“麎”。麎，麋牝也。中原之野甚有之。○祁，毛巨私反，又止之反；鄭改作“麎”，音辰；郭音脤；何止屍反；沈市屍反。麋，亡悲反。儦儦俟俟，或群或友。趨則儦儦，行則俟俟。獸三曰群，二曰友。○儦，本作“麃”，又作“爊”，表嬌反，趨也，《廣雅》雲：“行也。”俟音士，行也；徐音矣。" }
      - { type: j, text: "悉率左右，以燕天子。驅禽之左右，以安待天子。箋雲：率，循也。悉驅禽順其左右之宜，以安待王之射也。○射，食亦反。" }
      - { type: z, text: "“瞻彼”至“天子”。○毛以為，視彼中原之野，其諸禽獸大而甚有，謂形大而多也，故儦儦然有趨者，俟俟然有行者。其趨行或三三為群，或二二為友，是其甚有也。既而趨逆之車，驅而至於彼防。虞人乃悉驅之，循其左右之宜，以安待天子之射也。○鄭以為，視彼中原之野，其麋牝之獸甚有之。言中原甚有麎。餘同。○傳“趨則”至“二曰友”。○正義曰：上言多有諸獸，此宜說其行容。獸行多疾，當先言其趨，故以趨則儦儦，行則俟俟。《周語》曰“獸三為群”，故二曰友。友親於群，其數宜少。《易·損卦·六三》雲：“一人行則得其友。”獸亦當然，故二曰友，三曰群。謂自三以上皆稱群，不必要三也。○傳“驅禽”至“天子”。○正義曰：此言安待天子，謂已入防中，乃虞人驅之，故《騶虞》傳曰：“虞人翼五豝以待公之發。”《駟鐵》箋雲：“奉是時牡。”謂虞人與此待同也。言驅禽之左右者，以禽必在左射之，或令左驅令右，皆使天子得其左廂之便。以其未明，故箋又申之雲：“循其左右之宜，以安待王之射。”" }
      - { type: j, text: "既張我弓，既挾我矢，發彼小豝，殪此大兕。殪，壹發而死。言能中微而制大也。箋雲：豕牡曰豝。○挾，子洽反，又子協反，又戶頰反。豝音巴。殪，於計反。兕，徐履反，本又作“”。中，張伸反。" }
      - { type: j, text: "以御賓客，且以酌醴。饗醴，天子之飲酒也。箋雲：御賓客者，給賓客之御也。賓客謂諸侯也。酌醴，酌而飲群臣，以為俎實也。" }
      - { type: z, text: "“既張”至“酌醴”。○正義曰：虞人既驅禽待天子，故言既已張我天子所射之弓，既挾我天子所射發之矢，發而中彼小豝，亦又殪此大兕也。既殺得群獸以給御諸侯之賓客，且以酌醴與群臣飲時為俎實也。○傳“殪壹”至“制大”。○正義曰：《釋詁》雲：“殪，死也。”發矢射之即殪，是壹發而死也。又解小豝、大兕俱是發矢殺之，但小者射中必死，苦於不能射中；大者射則易中，唯不能即死。小豝雲發，言發則中之。大兕言殪，言射著即死。異其文者，言中微而制大。○傳“饗醴”至“飲酒”。○正義曰：醴不可專飲。天子之於群臣，不徒設醴而已。此言酌醴者，《左傳》天子饗諸侯每雲“饗醴，命之宥”。是饗有醴者，天子飲之酒，故舉醴言之也。○箋“御賓”至“俎實”。○正義曰：御者，給與充用之辭，故知御賓客者，給賓客之御也。知賓客謂諸侯者，天子之所賓客者，唯諸侯耳，故《周禮》“六服之內，其君為大賓，其臣為大客”，是也。彼對文，則君為大賓，故臣為大客。若散，則賓亦客也。故此賓客並言之，此箋舉尊言耳。其臣來及從君，則王亦以此給之也。言酌而醴群臣以為俎實者，以言“且以酌醴”，是當時且用之辭，則得禽即與群臣飲酒，故知以為俎實也。若乾之為脯，漬之為醢，則在籩豆矣，不得言俎實也。" }
      - { type: j, text: "《吉日》四章，章六句。" }
