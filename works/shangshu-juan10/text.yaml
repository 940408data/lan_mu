# 尚書正義卷十（孔穎達疏）：j 為經文＋孔安國注，z 為正義疏文。
sections:
  - id: juan10
    name: 卷十
    blocks:
      - { type: j, text: "殷既錯天命，錯，亂也。○錯，七各反，馬雲：“廢也。”微子作誥父師、少師。告二師而去紂。○少，詩照反。" }
      - { type: z, text: "“殷既”至“少師”○正義曰：殷紂既暴虐無道，錯亂天命，其兄微子知紂必亡，以作言誥告父師箕子、少師比干。史敘其事而作此篇也。名曰《微子》而不言“作《微子》”者，已言“微子作誥”，以可知而省文也。○傳“錯，亂也”○正義曰：交錯是渾亂之義，故為亂也。不指言紂惡而言“錯亂天命”者，天生烝民，立君以牧之，為君而無君道，是錯亂天命，為惡之大，故舉此以見惡之極耳。" }
      - { type: j, text: "微子微，圻內國名。子，爵。為紂卿士，去無道。" }
      - { type: z, text: "傳“微圻”至“無道”○正義曰：微國在圻內，先儒相傳為然。鄭玄以為微與箕俱在圻內，孔雖不言箕，亦當在圻內也。王肅雲：“微，國名。子，爵。入為王卿士。”肅意蓋以微為圻外，故言“入”也。微子名啟，《世家》作開，避漢景帝諱也。啟與其弟仲衍，皆是紂之同母庶兄，《史記》稱“微仲衍”。衍亦稱“微”者，微子封微，以微為氏，故弟亦稱微，猶如春秋之世虞公之弟稱虞叔，祭公之弟稱祭叔。微子若非大臣，則無假憂紂，亦不必須去，以此知其為卿士也。傳雲“去無道”者，以“去”見其為卿士也。" }
      - { type: j, text: "微子若曰：“父師、少師，父師，太師，三公，箕子也。少師，孤卿，比干。微子以紂距諫，知其必亡，順其事而言之。殷其弗或亂正四方。或，有也。言殷其不有治正四方之事，將必亡。○治，直吏反。我祖底遂陳於上，言湯致遂其功，陳列於上世。我用沈酗於酒，用亂敗厥德於下。我，紂也。沈湎酗，敗亂湯德於後世。○沈，徐直金反。酗，況具反，以酒為兇曰酗，《說文》作<酉句>，雲：“酒。”湎，面善反。音詠，《說文》於命反，<酉句>酒也。殷罔不小大，好草竊奸宄。草野竊盜，又為奸宄於內外。○好，呼報反。宄音軌。" }
      - { type: j, text: "卿士師師非度，凡有辜罪，乃罔恆獲。六卿典士相師效，為非法度，皆有辜罪，無秉常得中者。○度如字。小民方興，相為敵讎。卿士既亂，而小人各起一方，共為敵讎。言不和同。○讎，常周反。今殷其淪喪，若涉大水，其無津涯。淪，沒也。言殷將沒亡，如涉大水，無涯際，無所依就。○淪音倫，徐力允反。喪，息浪反。涯，五皆反，又宜佳反。殷遂喪，越至於今。”言遂喪亡於是，至於今，到不待久。" }
      - { type: z, text: "“微子”至“於今”○正義曰：微子將欲去殷，順其去事而言，曰“父師”、“少師”，呼二師與之言也。今殷國其將不復有治正四方之事，言其必滅亡也。昔我祖成湯，致行其道，遂其功業，陳列於上世矣。今我紂惟用沈湎酗Ｅ１於酒，用是亂敗其祖之德於下。由紂亂敗之故，今日殷人無不小大皆好草竊奸宄。雖在朝卿士，相師師為非法度之事。朝廷之臣皆有辜罪，乃無有一人能秉常得中者。在外小人，方方各起，相與共為敵讎。荒亂如此，今殷其沒，亡若涉大水，其無津濟涯岸。殷遂喪亡，言不復久也。“此喪亡於是，至於今，到必不得更久也”。○傳“父師”至“言之”○正義曰：以《畢命》之篇王呼畢公為“父師”，畢公時為太師也。《周官》雲：“太師、太傅、太保，茲惟三公。少師、少傅、少保曰三孤。”《家語》雲：“比干官則少師。”少師是比干，知太師是箕子也。遍檢書傳，不見箕子之名，惟司馬彪注《莊子》雲：“箕子名胥餘。”不知出何書也。《周官》以少師為孤，此傳言“孤卿”者，孤亦卿也，《考工記》曰“外有九室，九卿朝焉”，是三孤六卿共為九卿也。比干不言封爵，或本無爵，或有而不言也。《家語》雲：“比干是紂之親，則諸父。”知比干是紂之諸父耳。箕子則無文。《宋世家》雲：“箕子者，紂親戚也。”止言親戚，不知為父為兄也。鄭玄、王肅皆以箕子為紂之諸父，服虔、杜預以為紂之庶兄，既無正文，各以意言之耳。微子以紂距諫，知其必亡，心欲去之，故順其去事而言，呼二師以告之。○傳“或有”至“必亡”○正義曰：“或”者不定之辭，其事欲當然，則是有此事，故以“或”為有也。鄭玄《論語注》亦云：“或之言有也，不有言無也。”天子，天下之主，所以治正四方，“言殷其不有治正四方之事”，言將必亡。○傳“我紂”至“後世”○正義曰：嗜酒亂德，是紂之行，故知“我”，我紂也。人以酒亂，若沈於水，故以耽酒為“沈”也。湎然是齊同之意，《詩》雲：“天不湎爾以酒。”鄭雲：“天不同汝顏色以酒。”是“湎”謂酒變面色，湎然齊同，無復平時之容也。《說文》雲：“酗，也。”然則“酗”、“”一物，謂飲酒醉而發怒。經言亂敗其德，必有所屬，上言“我祖”指謂成湯，知言“敗亂湯德於後世”也。上謂前世，故下為後世也。○傳“六卿”至“中者”○正義曰：“士”訓事也，故“卿士”為“六卿典事”。“師師”言相師效為非法度之事也。止言“卿士”，以貴者尚爾，見賤者皆然。故王肅雲：“卿士以下，轉相師效為非法度之事也。”鄭雲：“凡猶皆也。”傳意亦然，以“凡”為皆，言卿士以下在朝之臣，其所舉動皆有辜罪，無人能秉常行得中正者。" }
      - { type: j, text: "曰：“父師、少師，我其發出狂，吾家耄遜於荒。我念殷亡，發疾生狂，在家耄亂，故欲遯出於荒野。言愁悶。○出，尺遂反。耄，字又作旄，莫報反，注同。遯，徒困反，徐徒頓反，一音都困反。今爾無指，告予顛隮，若之何其？”汝無指意告我殷邦顛隕隮墜，如之何其救之？○隮，子細反，《玉篇》子兮反，《切韻》祖稽反。隕，于敏反。" }
      - { type: z, text: "“曰父師”至“何其”○正義曰：微子既言紂亂，乃問身之所宜，止而復言，故別加一“曰父師少師”，更呼而告之也。“我念殷亡之故，其心發疾生狂，吾在家心內耄亂，欲遜遯出於荒野。今汝父師少師無指滅亡之意告我雲，殷邦其隕墜，則當如之何其救之乎？”恐其留己共救之也。○傳“我念”至“愁悶”○正義曰：狂生於心而出於外，故傳以“出狂”為“生狂”。應璩詩云“積念發狂痴”，此其事也。在家思念之深，精神益以耄亂。鄭玄雲：“耄，昏亂也。”在家不堪耄亂，故欲遯出於荒野，言愁悶之至。《詩》雲：“駕言出游，以寫我憂。”亦此意也。○傳“汝無”至“救之”○正義曰：“無指意告我者”，謂無指殷亡之事告我，言殷將隕墜，欲留我救之。“顛”謂從上而隕，“隮”謂墜於溝壑，皆滅亡之意也。昭十三年《左傳》曰：“小人老而無子，知隮於溝壑矣。”王肅雲：“隮，隮溝壑。”言此“隮”之義如《左傳》也。" }
      - { type: j, text: "父師若曰：“王子，比干不見，明心同，省文。微子帝乙元子，故曰王子。○見，賢遍反。省，所景反。天毒降災荒殷邦，方興沈酗於酒，天生紂為亂，是天毒下災，四方化紂沈湎，不可如何。乃罔畏畏，咈其耇長舊有位人。言起沈湎，上不畏天災，下不畏賢人。違戾耇老之長致仕之賢，不用其教，法紂故。○咈，扶勿反。耇，工口反。長，丁丈反，注同。今殷民乃攘竊神祇之犧牷牲用，以容將食，無災。自來而取曰攘。色純曰犧。體完曰牷。牛羊豕曰牲。器實曰用。盜天地宗廟牲用，相容行食之，無災罪之者。言政亂。○攘，如羊反，因來而取曰攘。竊，馬雲：“往盜曰竊。”神祇，天曰神，地曰祇。犧，許宜反。牷音全。降監殷民，用乂讎斂，召敵讎不怠。下視殷民，所用治者，皆重賦傷民、斂聚怨讎之道，而又亟行暴虐，自召敵讎不解怠。○讎如字，下同。徐雲：“鄭音疇。”馬本作稠，雲：“數也。”豔，力檢反；馬、鄭力豔反，謂賦斂也；徐雲：“鄭力劍反。”治，直吏反。亟，欺忌反，數也；又紀力反；本又作極，如字，至也。解，佳賣反。罪合於一，多瘠罔詔。言殷民上下有罪，皆合於一法紂，故使民多瘠病，而無詔救之者。○瘠，在益反。商今其有災，我興受其敗。災滅在近，我起受其敗，言宗室大臣義不忍去。商其淪喪，我罔為臣僕。詔王子出迪。商其沒亡，我二人無所為臣僕，欲以死諫紂。我教王子出，合於道。○臣僕，一本無臣字。我舊雲刻子，王子弗出，我乃顛隮。刻，病也。我久知子賢，言於帝乙。病立子，帝乙不肯。病子不得立，則宜為殷後者子。今若不出逃難，我殷家宗廟乃隕墜無主。○舊雲，馬雲：“言也。”刻音克，馬雲：“侵刻也。”難，乃旦反。自靖人自獻於先王，各自謀行其志，人人自獻達於先王，以不失道。○靖，馬本作清，謂潔也。我不顧行遁。”言將與紂俱死，所執各異，皆歸於仁，明君子之道，出處語默非一途。○顧音故，徐音鼓。" }
      - { type: z, text: "“父師”至“行遁”○正義曰：父師亦順其事而報微子曰：“王子，今天酷毒下災，生此昏虐之君，以荒亂殷之邦國。紂既沈湎，四方化之，皆起而沈湎酗於酒，不可如何。小人皆自放恣，乃無所。上不畏天災，下不畏賢人，違戾其耇老之長與舊有爵位致仕之賢人。今殷民乃攘竊祭祀神祗之犧牷牲用，以相通容，行取食之，無災罪之者。”盜天地大祀之物用而不得罪，言政亂甚也。“我又下視殷民，所用為治者，皆讎怨斂聚之道”也。言重賦傷民，民以在上為讎，重賦乃是斂讎也。“既為重賦，又急行暴虐，此所以益招民怨，是乃自召敵讎不懈怠也。上下各有罪，合於一紂之身”。言紂化之使然也。“故使民多瘠病，而無詔救之者。商今其有滅亡之災，我起而受其敗。商其沒亡喪滅，我無所為人臣僕”。言不可別事他人，必欲諫取死也。“我教王子出奔於外，是道也。我久雲子賢，言於帝乙，欲立子，不肯。我乃病傷子不得立為王，則宜終為殷後。若王子不出，則我殷家宗廟乃隕墜無主”。既勸之出，即與之別雲：“各自謀行其志，人人各自獻達於先王，我不顧念行遁之事。”明期與紂俱死。○傳“比干”至“王子”○正義曰：諮二人而一人答，“明心同，省文”也。鄭雲：“少師不答，志在必死。”然則箕子本意豈必求生乎？身若求生，何以不去？既“不顧行遁”，明期於必死，但紂自不殺之耳。若比干意異，箕子則別有答，安得默而不言？孔解“心同”是也。“微子帝乙元子”，《微子之命》有其文也。父師言微子為“王子”，則父師非王子矣，鄭、王等以為紂之諸父當是實也。○傳“天生”至“如何”○正義曰：“荒殷邦”者，乃是紂也，而云“天毒降災”，故言“天生紂為亂”，本之於天，天毒下災也。以微子云“若之何”，此答彼意，故言“四方化紂沈湎，不可如何”。○傳“言起”至“紂故”○正義曰：文在“方興沈酗”之下，則此無所畏畏者，謂當時四方之民也。民所當畏，惟畏天與人耳，故知二畏者，上不畏天，下不畏賢人。違戾耇長與舊有位人，即是不畏賢人，故不用其教，紂無所畏，此民無所畏，謂法紂故也。○傳“自來”至“政亂”○正義曰：“攘”、“竊”同文，則“攘”是竊類。《釋詁》雲：“攘，因也。”是因其自來而取之名“攘”也。《說文》雲：“犧，宗廟牲也。”《曲禮》雲：“天子以犧牛。”天子祭牲必用純色，故知“色純曰犧”也。《周禮》：“牧人掌牧六牲，以供祭祀之牲牷。”以“牷”為言，必是體全具也，故“體完曰牷”。經傳多言“三牲”，知“牲”是牛羊豕也。以“犧”、“牷”、“牲”三者既為俎實，則“用”者簠簋之實，謂黍稷稻粱，故云“器實曰用”，謂粢盛也。《禮》“天曰神，地曰祗”，舉天地則人鬼在其間矣，故總雲“盜天地宗廟牲用”也。訓“將”為行，“相容行食之”謂所司相通容，使盜者得行盜而食之。大祭祀之物，物之重者，盜而無罪，言政亂甚也。漢魏以來著律皆雲：“敢盜郊祀宗廟之物，無多少皆死。”為特重故也。○傳“下視”至“懈怠”○正義曰：箕子身為三公，下觀世俗，故云“下視殷民”。“所用治者”謂卿士已下是治民之官也。以紂暴虐，務稱上旨，“皆重賦傷民”。民既傷矣，則以上為讎，《泰誓》所謂“虐我則讎”是也。重斂民財，乃是“聚斂怨讎之道”。既為重斂，而又亟行暴虐。亟，急也。急行暴虐，欲以威民，乃是“自召敵讎”。勤行虐政，是“不懈怠”也。○傳“商其”至“於道”○正義曰：“有災”與“淪喪”一事，而重出文者，上言“商今其有災，我興受其敗”，逆言災雖未至，至則己必受禍；此言“商其淪喪，我罔為臣僕”，豫言殷滅之後，言己不事異姓，辭有二意，故重出其文。我無所為臣僕，言不能與人為臣僕，必欲以死諫紂。但箕子之諫，值紂怒不甚，故得不死耳。“我教王子出，合於道”，保全身命，終為殷後，使宗廟有主，享祀不絕，是合其道也。○傳“刻病”至“無主”○正義曰：“刻”者，傷害之義，故為病也。《呂氏春秋·仲冬紀》雲：“紂之母生微子啟與仲衍，其時猶尚為妾，改而為妻後生紂。紂之父欲立微子啟為太子，太史據法而爭，曰：‘有妻之子，不可立妾之子。’故立紂為後。”於時箕子蓋謂請立啟而帝乙不聽，今追恨其事，我久知子賢，言於帝乙，欲立子為太子，而帝乙不肯，我病子不得立，則宜為殷後。○傳“言將”至“一途”○正義曰：不肯遁以求生，“言將與紂俱死”也。或去或留，所執各異，皆歸於仁。孔子稱“殷有三仁焉”，是“皆歸於仁”也。《易·系辭》曰：“君子之道，或出或處，或默或語。”是“非一途”也。何晏雲：“仁者愛人，三人行異而同稱仁者，以其俱在憂亂寧民。”" }
      - { type: j, text: "《尚書正義》" }
