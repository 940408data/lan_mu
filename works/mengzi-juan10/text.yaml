# 孟子注疏卷10（孫奭疏）：j 為經文，漢趙岐注為注，z 為疏文。
sections:
  - id: juan10
    name: 正文
    blocks:
      - { type: z, text: "万章者，万，姓；章，名。孟子弟子也。万章问舜孝，犹《论语》颜渊问仁，因以题其篇也。正义曰：前篇论离娄之明，此篇论万章问孝，盖以明者当明其行，而行莫大於为孝。今万章问孝，故以“万章”为此篇之题，以次於前篇矣。此篇凡十八章，赵氏分为上下卷。据此上卷，凡有九章而已。一章言孝为百行之本，无物以先之，虽富有天下，而不能取悦其父母也。二章言仁圣所存者大，舍小从大，达权之义，不告而娶，守正道也。三章言仁人之心。四章言孝莫大於严父，行莫大於蒸蒸。五章言德合於天，则天爵归之，行归於仁，则天下与之。六章言义於人，则四海宅心，守正不足，则圣位莫保者也。七章言贤达之理世务，推政以济时物，守己直行，不枉道以取容。八章言君子大居正位，以礼进退，屈伸达节，不违贞信。九章言君子时行则行，时舍则舍，故能显君明道，不为苟合。其馀九章，分在下卷，各有说焉。○注“万章”至“篇也”。○正义曰：万章，孟子弟子，已说在叙段。云：“《论语》颜渊问仁”者，盖《论语》第十二篇，首颜渊问为仁，孔子曰：“克己复礼为仁。”因以“颜渊”目其篇，盖其文也。《孟子》於此则而象之尔。" }
      - { type: j, text: "万章问曰：“舜往于田，号泣于天，何为其号泣也？”" }
      - { type: z, text: "问舜往至于田，何为号泣也？谓耕于历山之时然也。" }
      - { type: j, text: "孟子曰：“怨慕也。”" }
      - { type: z, text: "言舜自怨遭父母见恶之厄而思慕也。" }
      - { type: j, text: "万章曰：“父母爱之，喜而不忘。父母恶之，劳而不怨。然则舜怨乎？”" }
      - { type: z, text: "言孝法当不怨，如是舜何故怨？" }
      - { type: j, text: "曰：“长息问於公明高曰：‘舜往于田，则吾既得闻命矣。号泣于天、于父母则吾不知也。’公明高曰：‘是非尔所知也。’" }
      - { type: z, text: "长息，公明高弟子。公明高，曾子弟子。天，秋天也。幽阴气也，故诉于天。高非息之问不得其义，故曰非尔所知也已。" }
      - { type: j, text: "夫公明高以孝子之心为不若是恝。" }
      - { type: z, text: "恝，无愁之貌。孟子以万章之问，难自距之，故为言高、息之问对如此。夫公明高以为孝子不得意於父母，自当怨悲，岂可恝恝然无忧哉。因以万章具陈其意耳。" }
      - { type: j, text: "‘我竭力耕田，共为子职而已矣。父母之不我爱，於我何哉？’" }
      - { type: z, text: "我共人子之事，而父母不我爱，於我之身独有何罪哉？自求责於己而悲感焉。" }
      - { type: j, text: "帝使其子九男二女，百官牛羊仓廪备，以事舜於畎亩之中。" }
      - { type: z, text: "帝，尧也。尧使九子事舜以为师，以二女妻舜，百官致牛羊仓廪，致粟米之饩，备具馈礼，以奉事舜於畎亩之中。由是遂赐舜以仓廪牛羊，使得自有之。《尧典》曰：“厘降二女”，不见九男。孟子时，《尚书》凡百二十篇，逸书有《舜典》之《叙》，亡失其文。孟子诸所言舜事，皆《舜典》逸书所载。独丹朱以胤嗣之子，臣下以距尧求禅，其馀八庶无事，故不见於《尧典》。犹晋献公之子九人，五人以事见於《春秋》，其馀四子亦不复见於经。" }
      - { type: j, text: "天下之士多就之者，帝将胥天下而迁之焉；为不顺於父母，如穷人无所归。" }
      - { type: z, text: "天下之善士，多就舜而悦之。胥，须也。尧须天下悉治，将迁位而禅之。顺，爱也。为不爱於父母，其为忧愁，若困穷之人无所归往也。" }
      - { type: j, text: "天下之士悦之，人之所欲也，（欲，贪也。）而不足以解忧。好色，人之所欲，妻帝之二女，而不足以解忧；富，人之所欲，富有天下，而不足以解忧；贵，人之所欲，贵为天子，而不足以解忧。人悦之、好色、富、贵，无足以解忧者，惟顺於父母可以解忧。" }
      - { type: z, text: "言为人所悦，将见禅为天子，皆不足以解忧，独见爱於父母为可以解己之忧。" }
      - { type: j, text: "人少则慕父母，知好色则慕少艾，有妻子则慕妻子，仕则慕君，不得於君则热中。" }
      - { type: z, text: "慕，思慕也。人少，年少也。艾，美好也。不得於君，失意於君也。热中，心热恐惧也。是乃人之情。" }
      - { type: j, text: "大孝，终身慕父母，五十而慕者，予於大舜见之矣。”" }
      - { type: z, text: "大孝之人，终身慕父母。巷老莱子七十而慕，衣五采之衣，为婴儿匍匐於父母前也。我於大舜见五十而尚慕父母。《书》曰：“舜生三十徵庸，三十在位。”在位时尚慕，故言五十也。“万章问舜往于田”至“予於大舜见之矣”。○正义曰：此章指言夫孝，百行之本，无物以先之，虽富有天下，而不能取悦於其父母，莫有可也。孝道明著则六合归仁矣。“万章问曰：舜往于田，号泣于天，何为其号泣也”者，万章问孟子，谓舜往耕于田，乃号泣于天，是何为其号泣於此也？天，秋天之号也，以其情主乎悯也，《尔雅》曰“秋曰天”是也。“孟子曰：怨慕也”，孟子答之曰：舜所以号泣于田者，自怨遭父母之恶而思慕之也。“万章曰：父母爱之”至“怨乎”，万章又曰：父母以慈爱爱息其子，子则当喜悦而不敢忘其父母之所爱；父母恶之，其子亦当勤劳奉事之而不可怨恨父母。今舜若是，则舜诚有怨恨父母乎？“曰：长息问於公明高”至“是非尔所知也”，孟子难以自为言拒之，乃托以长息问公明高之言而答也。言长息常问公明高曰：舜往于田，则我既以得闻教命矣，号泣于天，则我不能知也，故问之。公明高乃答之曰：此非尔所能知者也。以其所问不得其义，故答之此也。“夫公明高以孝子之心为不若是恝”至“於我何哉”者，孟子又言夫公明高以谓孝子之心，有不得意於父母，为不若此恝恝然而无忧也，以其有不得父母意，故有是怨也。其舜必谓我竭尽其力而耕作田业，以供为子之事，以奉养父母，而父母今反不我爱恤，诚於我有何罪哉？故自求责於己，而号泣怨慕也。“帝使其子九男二女”至“予於大舜见之矣”。孟子至此，乃继其言而答万章，言舜尧帝使其子九男与二女，兼百官及牛羊仓廪皆备具，以事舜於畎亩之中。天下之善士多就归舜而悦之者，尧帝又将须以天下而迁位让之，其舜尚以有不得爱於父母，其亦忧愁，若穷困苦极之人无所归告者矣。且天下之善士悦而就之，是人之所皆欲也，而尚不足以解舜之忧。好色之女，是人之所皆欲者也，妻以尧帝之二女，而尚亦不足以解舜之忧。富是人之所皆欲者也，而尧以百官牛羊仓廪备以事之，而尚亦不足以解舜之忧。贵是人之所皆欲者也，而尧将以天下迁而让之而为天子，尚亦更不足以解其忧。凡以人悦之、好色、富、贵此数者，皆无足以解舜之忧，惟得於父母然後可以解其忧。夫人少小之时则知思慕父母，及长知好其女色则思慕其少艾，有妻子则思慕其妻子，至於为仕则思慕其君，如不得遇於君，则热中心而恐惧之也，是则人之常情如此。如为大孝者，则终身思慕父母而不忘也。然则孟子言至於五十之岁者而思慕父母而不敢忘者，我於大舜见之矣。故历以此答其万章之问。○注“耕于历山”。○正义曰：上卷首章已说详矣。○注“尧典”至“不复见”。○正义曰：云“《尧典》曰：厘降二女，不见九男。惟丹朱胤嗣之子，臣下以距尧求禅，其馀八庶无事，故不见”，二女，即娥皇、女英是也。案《尚书·尧典》：”放齐曰：‘胤子朱，启明。’帝曰：‘吁，へ讼，可乎？’”孔安国云：“胤，国名。子，爵。朱，胤子之名也。”《益稷》云：“无若丹朱傲。”孔注云：“丹朱，尧之子。”是尧九子，但见丹朱一人矣。其馀八子，亦未详，以其经传无见为云。如晋献公九人，以事见於《春秋》，馀四子亦不所见者。按鲁庄公二十八年《左传》云：晋献公娶于贾，无子。於齐姜，生秦穆夫人及大子申生。又娶二女於戎，大戎生重耳，小戎子生夷吾。晋伐骊戎，骊戎男女以骊姬。归，生奚齐。其娣生卓子。凡此九人，但见其此，即此五人是也。云“献公有九人”，按《史记·世家》云“献公有子九人，而太子申生、重耳、夷吾皆有贤行”，以此则知献公有子九人而已。其馀四者，亦以经传无见焉。○注“慕，思慕”至“人之情”。正义曰：云“少，年少也。艾，美好也”者，盖世之传《孟子》者，以少女为少艾也。按《说文》云：“艾，老也，长也。”又按《礼记》云：“五十曰艾。”是则艾诚老长之称也，谓之少艾，安可乎？是则云艾、美好也者，又不知何据为之误也。殆亦未可知。○注“老莱子七十而慕”至“《书》曰：舜生三十徵庸，三十在位”。正义曰：云老莱子者，按《高士传》云：“老莱子，楚人，少以孝行，养亲极甘脆，年七十，父母犹存，莱子服荆兰之衣，为婴儿戏亲前，言不称老，为亲取食上堂，足跌而偃，因为婴儿啼，诚至发中。楚室方乱，乃隐耕於蒙山之阳，著书号《莱子》，莫知所终。”又云老莱著五采五色斑斓之衣，出《列女传》，文今不载。" }
      - { type: j, text: "万章问曰：“《诗》云：‘娶妻如之何？必告父母。’信斯言也，宜莫如舜。舜之不告而娶，何也？”" }
      - { type: z, text: "《诗·齐风·南山》之篇。言娶妻之礼，必告父母。舜合信此诗之言，何为违礼，不告而娶也？" }
      - { type: j, text: "孟子曰：“告则不得娶。男女居室，人之大伦也。如告，则废人之大伦以怼父母，是以不告也。”" }
      - { type: z, text: "舜父顽母へ，常欲害舜。告则不听其娶，是废人之大伦，以怨怼於父母也。" }
      - { type: j, text: "万章曰：“舜之不告而娶，则吾既得闻命矣。帝之妻舜而不告，何也？”" }
      - { type: z, text: "礼，娶须五礼，父母先答以辞，是相告也。帝，谓尧。何不告舜父母？" }
      - { type: j, text: "曰：“帝亦知告焉则不得妻也。”" }
      - { type: z, text: "帝尧知舜大孝，父母止之，舜不敢违，则不得妻之，故亦不告也。" }
      - { type: j, text: "万章曰：“父母使舜完廪，捐阶，瞽瞍焚廪。使浚井，出，从而扌之。" }
      - { type: z, text: "完，治。廪，仓。阶，梯也。使舜登廪屋，而捐去其阶，焚烧其廪也。一说捐阶，舜即旋从阶下，瞽瞍不知其已下，故焚廪也。使舜浚井，舜入而即出，瞽瞍不知其已出，从而盖扌其井，以为舜死矣。" }
      - { type: j, text: "象曰：‘谟盖都君，咸我绩。" }
      - { type: z, text: "象，舜异母弟也。谟，谋。盖，覆也。都，於也。君，舜也，舜有牛羊仓廪之奉，故谓之君。咸，皆。绩，功也。象言谋覆於君而杀之者，皆我之功。欲与父母分舜之有，取其善者，故引为己之功也。" }
      - { type: j, text: "牛羊，父母；仓廪，父母。" }
      - { type: z, text: "欲以牛羊、仓廪与其父母。" }
      - { type: j, text: "干戈，朕；琴，朕；氐，朕；二嫂，使治朕栖。’" }
      - { type: z, text: "干，。戈，戟也。琴，舜所弹五弦琴也。氐，雕弓也，天子曰雕弓，尧禅舜天下，故赐之雕弓，尧禅舜天下，故赐之雕也。栖，床也。二嫂：娥皇、女英。使治床，欲以为妻也。" }
      - { type: j, text: "象往人舜宫，舜在床琴，象曰：‘郁陶思君尔。’忸怩。" }
      - { type: z, text: "象见舜生，在床鼓琴，愕然，反辞曰：我郁陶思君，故来。尔，辞也。忸怩而惭，是其情也。" }
      - { type: j, text: "舜曰：‘唯兹臣庶，汝其于予治。’" }
      - { type: z, text: "兹，此也。象素憎舜，不至其宫也，故舜见来而喜曰：惟念此臣众，汝故助我治事。" }
      - { type: j, text: "不识舜不知象之将杀己与？”" }
      - { type: z, text: "万章言我不知舜不知象之将杀己与？何为好言顺辞以答象也。" }
      - { type: j, text: "曰：“奚而不知也？象忧亦忧，象喜亦喜。”" }
      - { type: z, text: "奚，何也。孟子曰：舜何为不知象恶己也？仁人爱其弟，忧喜随之。象方言思君，故以顺辞答之。" }
      - { type: j, text: "曰：“然则舜伪喜者与？”" }
      - { type: z, text: "诈伪也。万章言如是则为舜行至诚，而诈喜以悦人矣。" }
      - { type: j, text: "曰：“否！昔者有馈生鱼於郑子产，子产使校人畜之池。校人烹之，反命曰：‘始舍之，圉圉焉；少则洋洋焉，攸然而逝。’子产曰：‘得其所哉，得其所哉。’" }
      - { type: z, text: "孟子言否，云舜不诈喜也。因为说子产以喻之。子产，郑子国之子公孙侨，大贤人也。校人，生池沼小吏也。圉圉，鱼在水羸劣之貌。洋洋，舒缓摇尾之貌。攸然，迅走水趣深处也。故曰得其所哉。重言之者，嘉得鱼之志也。" }
      - { type: j, text: "校人出，曰：‘孰谓子产智？予既烹而食之，曰：得其所哉！得其所哉！’故君子可欺以其方，难罔以非其道。彼以爱兄之道来，故诚信而喜之，奚伪焉？”" }
      - { type: z, text: "方，类也。君子可以事类欺，故子产不知校人之食其鱼。象以其爱兄之道来问舜，是亦其类也。故诚信之而喜，何为伪喜也？“万章问曰”至“奚伪焉”。○正义曰：此章指言仁圣所存者大，舍小从大，达权之义也，不告而娶，守正道也。“万章问曰”至“何也”者，万章问孟子，言《齐风·南山》之诗有云“娶妻如之何，必告父母”，如信此诗之言，宜莫如舜信之，今舜乃不告父母而娶，是如之何也？“孟子曰”至“是以不告也”，孟子答之，曰：舜如告父母，则不得娶之也，男女居室，是人之大伦者也，如告之，则舜必不得娶也，不得娶，是废人之大伦，以致怨怼於父母也。是以舜为此所以不告父母而娶也。“万章曰”至“何也”者，万章又问孟子，言舜之不告而娶，则我既已得闻教命矣，然尧帝而以二女妻於舜，而不告舜父母，是如之何也？故以此问之。妻者，以女嫁人谓之妻也。“曰：帝亦知告焉则不得妻也”，孟子又答之曰：帝尧亦知告舜父母，则舜父母止之，则不得以妻之也。“万章曰”至“不知象之将杀己与”，万章又问孟子，言舜之父母使舜完治仓廪，舜既登仓廪，即捐梯而下，瞽瞍不知已下，乃焚廪，欲因此以烧杀其舜；又使舜深浚其井，舜既浚井，即反出之，瞽瞍不知已出，又欲从而掩之，以溺杀其舜。其舜有弟名象，乃曰：谋扌盖而杀都君者，皆我之功也。都君，即象称舜也。然谓之都君者，盖以舜在侧微之时，渔雷泽，一年所居成聚，二年成邑，三年成都，故以此遂因为之都君矣。注曰：“都，於也”，其说亦通。又曰：牛羊与父母，仓廪与父母，干戈留我，琴亦留我，氐亦留我，二嫂使治我之床以为我妻。欲与父母分此，故先设言为谟盖都君者，咸我绩耳。於是象遂往入舜之宫，遇舜又在床而鼓五弦之琴，愕然反其辞曰：我气闭积思意君，故来此。遂忸怩其颜，而乃惭耻形於面容也，以其恐舜知已谋其二嫂故也。“舜曰：惟兹臣庶，汝其于予治”，是舜见象素不来至其宫，遂见至宫，乃曰：“念此臣之众，汝其来助我治耳。如此，故万章乃问孟子，言舜帝不知其弟象之将欲杀其己与？故以此好言而答其象也。“曰：奚而不知也，象忧亦忧，象喜亦喜”，孟子又言舜何为而不知象谋杀己也？以其仁人爱其弟，故象忧亦忧，象喜亦喜，故以好言答之也。曰：然则舜伪为喜以悦人者与？“曰否”至“奚伪焉”，孟子又答之曰：舜非伪喜以悦人者矣，又引以子产有馈生鱼事而证之。言往者有人馈赐生鱼於郑之子产，子产受之，乃使主池沼之吏曰校人者畜养於池。校人烹煮而食之，遂反归命告於子产曰：我始初放之於池，则鱼尚羸乏圉圉然於水而未游，少顷则洋洋然舒缓摇尾，而走趣於深处。子产信之以为然，乃曰此鱼是得其所养哉。故重言之，乃叹鱼之得志於水甚快然也。其校人乃出而与人曰：谁谓子产为智者，有知於人？予既烹煮而食其鱼，子产乃曰得其所哉，得其所哉。如此，孟子故於此言，故君子者可欺伪以其方类，难诬罔全以非其道也。彼象谓以郁陶思君，是以爱兄之道来至於宫，是以但欺以其方类也，故舜遂必以诚深信之而喜其来，故以好辞答之矣，何为以舜为伪喜者焉。言舜不伪也，亦若校人欺子产之谓，故子产亦必曰得其所哉，得其所哉耳。所谓方类者，以其在疑似之间故也。○注“完，治”至“为死矣”。○正义曰：云捐去其阶焚舜之说，不若旋阶之说通也。按《史记》云：瞽瞍欲杀舜，使舜上涂廪，瞽瞍从下纵火焚廪，舜乃以两笠自而下去，得不死。後瞽瞍又使舜穿井为匿空旁出，舜既入深，瞽瞍与象共下土实井，舜从匿空旁出去，瞽瞍与象喜，以为舜死矣。象曰：本谋者，象之谋也。象於是与父母分，於是曰：“舜妻尧二女与琴，象取之，牛羊仓廪事父母。象乃止舜宫居，鼓其琴，舜往见之，象愕不怿曰：我思舜，正郁陶。舜曰：然尔其庶。舜复事瞽瞍，爱弟弥谨。凡此亦其事也。以《史记》观之，则捐阶之说，是此之文也。大抵学者不可执此以为深然也，当以意喻，默然有自判之论可矣。○注“干戈戟也”至“妻也”。○正义曰：云“干，也”者，按孔安国云“干，也”，《周礼》掌五兵五，郑玄“五，干橹之属”。云“戈戟也”者，《礼图》云：戈，今之勾戟，或谓之鸡鸣，或之拥颈内谓胡，以内接秘者也。长四寸，胡六寸。疏云：胡子横插，微邪向上，不勾。不勾，似罄之折杀也。又云：戟，今之三锋戟也，内长四寸半，胡长六寸，以其与戈相类，故云戈戟也。论其则别矣。云“雕弓天子之弓”者，雕弓，漆赤弓也，《尚书》云：“彤弓，一彤矢百。”孔安国云：“诸侯有大功，赐弓矢，然後专征伐，彤弓，所以讲德习射，藏示子孙。”《周礼·司弓》云：“天子之弓合九而成规，诸侯之弓合七而成规，大夫合五而成规，士合三而成规。”是其等也。云“五弦琴”者，《史记》云“舜弹五弦之琴”是矣。云栖床者，盖取类於禽栖故也。以其床则主木而言，栖则主栖而言，二女即娥皇、女英是也。○注“郑子国之子公孙侨”者。○正义曰：按《左传》云：子产，穆公之孙，公子发之子，名侨，公子之子曰公孙。襄三十年执郑国之政，为郑大夫。公子发，字子国。公孙之子，以王父字为氏，据後而言，故称为国侨。" }
      - { type: j, text: "万章问曰：“象日以杀舜为事。立为天子则放之，何也？”" }
      - { type: z, text: "怪舜放之何故。" }
      - { type: j, text: "孟子曰：“封之也，或曰放焉。”" }
      - { type: z, text: "舜封象於有庳，或有人以为放之。" }
      - { type: j, text: "万章曰：“舜流共工于幽州，放兜于崇山，杀三苗于三危，殛鲧于羽山，四罪而天下咸服，诛不仁也。象至不仁，封之有庳，有庳之人奚罪焉？仁人固如是乎？在他人则诛之，在弟则封之。”" }
      - { type: z, text: "舜诛四佞，以其恶也。象恶亦甚，而封之，仁人用心当如是乎？罪在他人当诛之，在弟则封之。" }
      - { type: j, text: "曰：“仁人之於弟也，不藏怒焉，不宿怨焉，亲爱之而已矣。亲之欲其贵也，爱之欲其富也。封之有庳，富贵之也。身为天子，弟为匹夫，可谓亲爱之乎？”" }
      - { type: z, text: "孟子言仁人於弟，不问善恶，亲爱之而已。封者欲使富贵耳。身既已为天子，弟虽不仁，岂可为匹夫？" }
      - { type: j, text: "“敢问或曰放者何谓也？”" }
      - { type: z, text: "万章问放之意。" }
      - { type: j, text: "曰：“象不得有为於其国，天子使吏治其国而纳其贡税焉，故谓之放，岂得暴彼民哉！" }
      - { type: z, text: "象不得施教於其国，天子使吏代其治，而纳贡赋与之，比诸见放也。有庳虽不得贤君，象亦不侵其民也。" }
      - { type: j, text: "虽然，欲常常而见之，故源源而来，不及贡，以政接于有庳。" }
      - { type: z, text: "虽不使象得豫政事，舜以兄弟之恩，欲常常见之无已，故源源而来，如流水之与源通。不及贡者，不待朝贡诸侯常礼乃来也。其间岁岁自至京师，谓若天子以政事接见有庳之君者，实亲亲之恩也。" }
      - { type: j, text: "此之谓也。”" }
      - { type: z, text: "此“常常”以下，皆《尚书》逸篇之辞。孟子以告万章，言此乃象之谓也。“万章问曰”至“此之谓也”。○正义曰：此章指言恳诚于内者，则外发于事，仁人之心也。象为无道极矣，友于之性，忘其悖逆，况其仁贤乎。“万章问曰：象日以杀舜为事，立为天子，则放之，何也”者，万章问孟子，以谓象日日以谋杀舜为事，然舜既立为天子，则放象而不诛，如之何？“孟子曰：封之也，或曰放焉”，孟子答之曰：是封象也，或人言放焉。“万章曰”至“在弟则封之”，万章又问舜流共工於幽州，放兜於崇山，杀三苗于三危，殛鲧于羽山，诛罪此四者，而天下於是咸服，此乃是诛戮其不仁者也。然象傲极不仁，乃反封之於有庳之国，则有庳之国中人何罪也，仁人固肯如此乎？在他人之恶则诛戮焉，在弟则封之国，故曰仁人固如是乎？万章之意，以谓仁人必不肯如此也。孔安国注《尚书》云：“共工象恭滔天，足以惑世，故流放之。幽州北裔。水中可居者曰洲。兜党於共工，罪恶同。崇山，南裔也。三苗，国名，缙云氏之後，为诸侯，号饕餮。三危，西裔。鲧方命圮族，绩用不成。羽山，东裔，在海中。”按《史记》云：“共工，少氏不才子，天下谓之穷奇者也。兜，帝鸿氏不才子，天下谓之混沌者也。鲧，颛顼氏不才子，天下谓之饕餮者也。”“曰：仁人之於弟也”至“可谓亲爱之乎”，孟子又答之，曰：仁者之人於其弟也，不藏怒心，不隔宿怨，但亲爱之而已，所以亲之者，以欲其贵也；爱之者，以欲其富也。今舜封象於有庳者，是所以富贵之也，如舜身自为天子，而使弟只为之匹夫，可谓为亲爱其弟者乎？有庳，国之名号也。“敢问或曰放者何谓也”，万章又问孟子：或人言放之者，是何所谓也？“曰：象不得有为於其国”至“此之谓也”，孟子又答之曰：象之於庳，不得施政教於其国中，天子使吏代之以治其国，而纳天子之贡赋焉，故谓之为放也。象岂得暴彼有庳之国民哉？以其使吏代之故也。虽然，不使象得施政教，而舜以兄弟亲亲之恩，欲常常见之，故源源如水之流与源而通，不以朝贡之诸侯常礼乃来也。其自至而见天子如天子，以政事接见於有庳之君也。故孟子云是此之谓也。○注云“自常常已下，皆《尚书》逸篇之辞”。○正义曰：按《隋·经籍志》，《尚书》逸篇出於齐、梁之间，考其篇目，似孔氏壁中书之残缺者，故附《尚书》之末，唐有三卷，徐邈为之注焉。盖其文也。" }
      - { type: j, text: "咸丘蒙问曰：“语云：盛德之士，君不得而臣，父不得而子。舜南面而立，尧帅诸侯北面而朝之，瞽瞍亦北面而朝之。舜见瞽瞍，其容有蹙。孔子曰：‘於斯时也，天下殆哉，岌岌乎。’不识此语诚然乎哉？”" }
      - { type: z, text: "咸丘蒙，孟子弟子。语者，谚语也。言盛德之士，君不敢臣，父不敢子。尧与瞽瞍皆臣事舜，其容有蹙不自安也。孔子以为君、父为臣，岌岌乎不安貌也，故曰殆哉。不知此语实然乎？" }
      - { type: j, text: "孟子曰：“否！" }
      - { type: z, text: "言不然也。" }
      - { type: j, text: "此非君子之言，齐东野人之语也。" }
      - { type: z, text: "东野，东作田野之人所言耳。咸丘蒙，齐人也，故闻齐野人之言。《书》曰“平秩东作”，谓治农事也。" }
      - { type: j, text: "尧老而舜摄也。《尧典》曰：‘二十有八载，放勋乃徂落，百姓如丧考妣。三年，四海遏密八音。’" }
      - { type: z, text: "孟子言舜摄行事耳，未为天子也。放勋，尧名。徂落，死也。如丧考妣，思之如父母也。遏，止也。密，无声也。八音不作，哀思甚也。" }
      - { type: j, text: "孔子曰：‘天无二日，民无二王。’舜既为天子矣，又帅天下诸侯以为尧三年丧，是二天子矣。”" }
      - { type: z, text: "日一，王一，言不得并也。" }
      - { type: j, text: "咸丘蒙曰：“舜之不臣尧，则吾既得闻命矣。" }
      - { type: z, text: "不以尧为臣也。" }
      - { type: j, text: "《诗》云：‘普天之下，莫非王土。率土之滨，莫非王臣。’而舜既为天子矣，敢问瞽瞍之非臣如何？”" }
      - { type: z, text: "《诗·小雅·北山》之篇。普，遍。率，循也。遍天下循土之滨，无有非王者之臣，而曰瞽瞍非臣如何也？" }
      - { type: j, text: "曰：“是诗也，非是之谓也。劳於王事，而不得养父母也。曰：‘此莫非王事，我独贤劳也。’" }
      - { type: z, text: "孟子言此诗非舜臣父之谓也。诗言皆王臣也，何为独使我以贤才而劳苦，不得养父母乎？是以怨也。" }
      - { type: j, text: "故说诗者不以文害辞，不以辞害志。以意逆志，是为得之，如以辞而已矣，《云汉》之诗曰：‘周馀黎民，靡有孑遗。’信斯言也，是周无遗民也。" }
      - { type: z, text: "文，诗之文章所引以兴事也。辞，诗人所歌咏之辞。志，诗人志所欲之事。意，学者之心意也。孟子言说诗者当本之，不可以文害其辞，文不显乃反显也。不可以辞害其志，辞曰“周馀黎民，靡有孑遗”，志在忧旱灾，民无孑然遗脱不遭旱灾者，非无民也。人情不远，以己之意逆诗人之志，是为得其实矣。王者有所不臣，不可谓皆为王臣，谓舜臣其父也。" }
      - { type: j, text: "孝子之至，莫大乎尊亲。尊亲之至，莫大乎以天下养。为天子父，尊之至也。以天下养，养之至也。" }
      - { type: z, text: "尊之至，瞽瞍为天子之父；养之至，舜以天下之富奉养其亲。至，极也。" }
      - { type: j, text: "诗曰：‘永言孝思，孝思惟则。’此之谓也。" }
      - { type: z, text: "《诗·大雅·下武》之篇。周武王所以长言孝道，欲以为天下法则。此舜之谓也。" }
      - { type: j, text: "《书》曰：‘祗载见瞽瞍，夔夔斋栗，瞽瞍亦允若。’是为父不得而子也。”" }
      - { type: z, text: "《书》，《尚书》逸篇。祗，敬。载，事也。夔夔斋栗，敬慎战惧貌。舜既为天子，敬事严父，战栗以见瞽瞍。瞍亦信知舜之大孝，若是为父不得而子也，以此解咸丘蒙之疑。“咸丘蒙”至“不得而子也”。○正义曰：此章指言孝莫大於严父而尊之矣，行莫过於蒸蒸而执子之政者也。此圣人轨道，无有加焉。“咸丘蒙问曰”至“诚然乎哉”者，咸丘蒙问孟子曰：谚语有云，盛德之士，君不得而臣之，父不得而子之。今舜向南面而立为天子，尧帝乃率天下诸侯北面而朝之，而舜见瞽瞍，其容蹙然而不敢自安。孔子亦云：於此时也，而天下危殆岌岌乎如也。岌岌，不安之貌也。然未知此谚语，实如是乎？“孟子曰：否，此非君子之言，齐东野人之语也”者，孟子答以否，不然也，此语非君子之言也，即齐东作田野人之语也。“尧老而舜摄之”至“是二天子矣”，孟子又言尧帝既老，而舜於是摄权尧行事耳，未为天子也。《尧典》之篇有云：言舜摄尧行事，至二十有八年，放勋乃徂落而死。放勋，尧之号也。魂气往为徂，体魄殒为落，大抵则死也。尧既死，天下百姓如丧其父母，三年，四海之内绝尽八音，以其哀思之甚也。《礼记》曰：“生曰父曰母，死曰考曰妣。”郑注云：考，成也，言其德行之成也。妣之言媲也，媲於考故也。八音：金、石、丝、竹、匏、土、革、木是也。孔子云天无两日，民无两王，如舜既为天子矣，又率诸侯以为尧三年之丧，是则为二天子矣。言日与王不可得而并也。以其舜方摄尧行事，未为天子故也。“咸丘蒙曰”至“非臣如何”者，咸丘蒙又言舜之不得臣尧，则我既得闻教命矣，然而《诗·小雅·北山》之篇有云：遍天之下，莫非为王之土地；循土之滨，莫非为王之臣。而舜既得为天子矣，敢问舜父瞽瞍之非臣，是如之何？“曰：是诗也，非是之谓也”至“是周无遗民也”者，孟子又答之曰：此《北山》之诗，云非是舜臣父之谓也，其诗盖言勤劳於王事而不得奉养其父母者也，故云：“普天之下，莫非王土。率土之滨，莫非王臣。”言皆是王臣也，以其无非为王事者也，何为独使我以贤才而劳苦，不得奉养其父母也？故以是而怨之也。故说诗者不以文而害逆其辞，又不可以其辞而害逆其诗人之志，以己之心意而逆求知诗人之志，是为得诗人之辞旨。人如说诗者，但以歌咏之辞为然，而不以己之意而求诗人志之所在，而为得诗人之旨而已矣，则《云汉》之篇，有云“周馀黎民，靡有孑遗”，信此言也，是周无遗民矣。殊不知此《云汉》之诗，其诗人之志盖在忧旱灾，以其多有死亡者矣，今其馀民无有单孑得遗脱不遭旱灾者，非谓无民也。孑，单也。孟子引此，所以证此《北山》之诗云“普天之下，莫非王土，率土之滨，莫非王臣”，亦非谓舜臣父之意也。“孝子之至，莫大乎尊亲”至“是为父不得而子也”者，孟子又言孝子之至，不可以有加者，莫大乎尊亲为之至也；尊亲之至，莫大乎以天下奉养其亲，是为尊亲之至也。今瞽瞍为天子之父，是舜尊亲之至者也；舜以天下奉养之，是养之至者也。《诗·大雅·下武》之篇云：武王长言孝心之所思，所思者，维则法大王、王季、文王三后之所行耳。此亦舜之谓也。《书》於《大禹谟》篇亦云：舜敬以事，见于父，夔夔然悚惧斋庄战栗，瞽瞍亦信顺之。见舜以瞍为父，而不得子之也。孔安国注云：“，敬。载，事也。允，信。若，顺也。”○注“咸丘蒙”。○正义曰：云为孟子弟子齐人也者，他经传未详。今按《春秋》桓公七年有“焚咸丘”，杜预云：“咸丘，鲁地。”以此推之，则此所谓咸丘蒙者，岂咸丘之人，有以蒙为名者邪？是未可知也。注乃云“齐人也”者，盖鲁国，孟子时为齐之所侵，故咸丘之地乃为齐之地故也。有所问於孟子，即为弟子矣。○注“《书》平秩东作”。○正义曰：孔安国《传》云：“平均次序东作之事，以务农也。”○注“《诗·小雅·北山》之篇。○正义曰：此篇盖剌幽王役使不均，己劳於从事而不得养其父母也。○注“《大雅·下武》之篇。○正义曰：此诗盖咏武王有圣德，复受天命，能昭先人之功也。○注“逸篇”。○正义曰：据今《大禹谟》有云此，非特止於逸篇文也已矣。" }
      - { type: j, text: "万章曰：“尧以天下与舜，有诸？”" }
      - { type: z, text: "欲知尧实以天下与舜否？" }
      - { type: j, text: "孟子曰：“否。" }
      - { type: z, text: "尧不与之。" }
      - { type: j, text: "天子不能以天下与人。”" }
      - { type: z, text: "当与天意合之，非天命者，天子不能违天命也。“尧曰咨尔舜，天之历数在尔躬”是也。" }
      - { type: j, text: "“然则舜有天下也，孰与之？”" }
      - { type: z, text: "万章言谁与之也。" }
      - { type: j, text: "曰：“天与之。”" }
      - { type: z, text: "孟子言天与之。" }
      - { type: j, text: "“天与之者，谆谆然命之乎？”" }
      - { type: z, text: "万章言天有声音命与之乎？" }
      - { type: j, text: "曰：“否。天不言，以行与事示之而已矣。”" }
      - { type: z, text: "孟子曰：天不言语，但以其人之所行善恶，又以其事从而示天下也。" }
      - { type: j, text: "曰：“以行与事示之者，如之何？”" }
      - { type: z, text: "万章欲知示之之意。" }
      - { type: j, text: "曰：“天子能荐人於天，不能使天与之天下。诸侯能荐人於天子，不能使天子与之诸侯。大夫能荐人於诸侯，不能使诸侯与之大夫。昔者尧荐舜於天而天受之，暴之於民而民受之。故曰：天不言，以行与事示之而已矣。”" }
      - { type: z, text: "孟子言下能荐人於上，不能令上必用之。舜，天人所受，故得天下也。" }
      - { type: j, text: "曰：“敢问荐之於天而天受之，暴之於民而民受之，如何？”" }
      - { type: z, text: "万章言天人受之，其事云何？" }
      - { type: j, text: "曰：“使之主祭，而百神享之，是天受之；使之主事而事治，百姓安之，是民受之也。天与之，人与之，故曰天子不能以天下与人。" }
      - { type: z, text: "百神享之，祭祀得福也。百姓安之，民皆讴歌其德也。" }
      - { type: j, text: "舜相尧二十有八载，非人之所能为也，天也。" }
      - { type: z, text: "二十八年之久，非人为也，天与之也。" }
      - { type: j, text: "尧崩，三年之丧毕，舜避尧之子於南河之南。天下诸侯朝觐者，不之尧之子而之舜；讼狱者，不之尧之子而之舜；讴歌者，不讴歌尧之子而讴歌舜。故曰天也。夫然後之中国，践天子位焉。而居尧之宫，逼尧之子，是篡也，非天与也。" }
      - { type: z, text: "南河之南，远地南夷也，故言然後之中国。尧子，胤子丹朱。讼狱，狱不决其罪，故讼之。讴歌，讴歌舜德也。" }
      - { type: j, text: "《泰誓》曰：‘天视自我民视，天听自我民听。’此之谓也。”" }
      - { type: z, text: "《泰誓》，《尚书》篇名。自，从也。言天之视听，从人所欲也。“万章曰”至“此之谓也”。○正义曰：此章指言德合於天，则天爵归之；行归於仁，则天下与之天命不常，此之谓也。“万章曰：尧以天下与舜，有诸”万章问孟子，尧帝以天下与舜，有之乎？“孟子曰：否”，孟子答之，尧不与之也。“天子不能以天下与人”，孟子言天子不能以天下与其人也。“然则舜有天下也，孰与之”，万章又问孟子，言如此则舜有天下也，谁与之？“曰天与之”，孟子答以为天与之也。“天与之者，谆谆然命之乎”，万章又问天与之舜者，天有声音，谆谆然命与之乎？“曰：天不言，以行与事示之而已矣”，孟子又答之，言天不以言语谆谆然命之也，但以人之所行善恶与其事，从而示之而止矣。“曰：以行与事示之者，如之何？”万章又问，以行与事示之者，是如之何也？“曰：天子能荐人”至“示之而已矣”，孟子答之，言天子者虽能举荐人於上天也，又不能使上天以与之天下也；诸侯者能举荐人於天子，而不能使天子必与为之诸侯；大夫者能荐人於诸侯，而不能使诸侯必与为之大夫。往者尧举荐舜於上天，而天受之；暴之於民，而民受之：我故曰天不言，以行与事示之矣。“曰：敢问荐之於天而天受之，暴之於民而民受之，如何”，万章又问荐之於天而天受之，与暴之於民而民受之，是如之何也？“曰：使之主祭，而百神享之，是天受之也。使之主事而事治，百姓安之，是民受之也。天与之，人与之，故曰天不能以天下与人也”，《书》云“纳于大麓”，是尧荐舜於天也；“烈风雷雨弗迷”，是天受之也。所谓百神享之，亦可知也。“慎徽五典，纳于百揆”，是暴之於民也；“五典克从，百揆时叙”，是民受之也。所谓百姓安之，亦可知也，曰“黎民於变时雍”是也。然於天则云荐，於民则云暴者，盖天远而在上，是为尊者也，圣人於天，举其所知，而取舍不在我，故云荐之也；民近而在下，是为卑者也，圣人之於民，显其功业，而使之自附，故云暴之也。所谓受之者，即是与之也。“舜相尧”至“此之谓也”，孟子又言舜摄行尧事辅相之，得二十八年之久，非人所能为之也，乃天与之也。尧帝既崩死，舜率天下诸侯为尧三年丧，三年丧既毕，舜乃逃避尧之子丹朱而隐於南河之南，天下诸侯朝觐而来者，不往朝觐於尧之子丹朱，而往朝觐於舜；讼狱有未决断者，不往求治於尧之子丹朱，而往求治於舜；讴歌吟咏者，不吟咏尧之子丹朱，而吟咏舜：故曰天与之也。如此，然後往归中国，履天子之位焉。如使舜不避尧之子，而居尧帝之宫，逼逐尧之子，是则为篡夺者也，非谓为天与之也。《泰誓》篇亦云天之所视从我民之所视，天之所听亦从我民之所听，是此天与之、人与之之谓也。○注“咨尔舜，天之历数在尔躬”。○正义曰：案《论语·尧曰》篇有此文，《书》亦有此。何晏曰：“历数，列次也。”孔安国云：“历数，天道。谓天历运之数，帝王易姓而兴，故言历数谓天道。”○注“河南，南夷也”。○正义曰：案裴る云：刘熙曰：南河之南，九河之最南者是也。是知为南夷也。所谓中国，刘熙云：帝王所都为中，故曰中国。○注“《泰誓》，《尚书》篇”。○正义曰：孔安国传云：《泰誓》者，大会以誓众也。又云天因民以视听，民所恶者，天诛之而已。" }
      - { type: j, text: "万章问曰：“人有言‘至於禹而德衰，不传於贤而传於子’，有诸？”" }
      - { type: z, text: "问禹之德衰，不传於贤而自传於子，有之否乎？" }
      - { type: j, text: "孟子曰：“否，不然也。" }
      - { type: z, text: "否，不也。不如人所言。" }
      - { type: j, text: "天与贤，则与贤；天与子，则与子。" }
      - { type: z, text: "言随天也。" }
      - { type: j, text: "昔者舜荐禹於天，十有七年，舜崩。三年之丧毕，禹避舜之子於阳城，天下之民从之，若尧崩之後不从尧之子而从舜也。禹荐益於天，七年，禹崩。三年之丧毕，益避禹之子於箕山之阴，朝觐讼狱者不之益而之启，曰：‘吾君之子也。’讴歌者不讴歌益而讴歌启，曰：‘吾君之子也。’丹朱之不肖，舜之子亦不肖。舜之相尧，禹之相舜也，历年多，施泽於民久。启贤，能敬承继禹之道。益之相禹也，历年少，施泽於民未久。" }
      - { type: z, text: "舜荐禹、禹荐益同也，以启之贤，故天下归之，益又未久故也。阳城，箕山之阴，皆嵩山下深谷之中以藏处也。" }
      - { type: j, text: "舜、禹、益相去久远，其子之贤不肖皆天也，非人之所能为也。莫之为而为者，天也。莫之致而至者，命也。" }
      - { type: z, text: "莫，无也。人无所欲为而横为之者，天使为也。人无欲致此事而此事自至者，是其命而已矣。故曰命也。" }
      - { type: j, text: "匹夫而有天下者，德必若舜、禹而又有天子荐之者，故仲尼不有天下。继世而有天下，（仲尼无天子之荐，故不得以有天下。继世之君，虽无仲尼之德，袭父之位，非匹夫，故得有天下也。）天之所废，必若桀、纣者也，故益、伊尹、周公不有天下。" }
      - { type: z, text: "益值启之贤，伊尹值大甲能改过，周公值成王有德，不遭桀、纣，故以匹夫而不有天下。" }
      - { type: j, text: "伊尹相汤以王於天下，汤崩，太丁未立，外丙二年，仲壬四年。太甲颠覆汤之典刑，伊尹放之於桐三年。太甲悔过，自怨自艾，於桐处仁迁义三年，以听伊尹之训已也，复归于亳。" }
      - { type: z, text: "太丁，汤之太子，未立而薨。外丙立二年，仲壬立四年，皆太丁之弟也。太甲，太丁子也，伊尹以其颠覆典刑，放之於桐邑。处，居也。迁，徙也。居仁徙义，自怨其恶行。艾，治也。治而改过，以听伊尹之教训已，故复得归之於亳，反天子位也。" }
      - { type: j, text: "周公之不有天下，犹益之於夏，伊尹之於殷也。孔子曰：‘唐、虞禅，夏后、殷、周继，其义一也。’”" }
      - { type: z, text: "周公与益、伊尹虽有圣贤之德，不遭者时。然孔子言禅、继其义一也。“万章问曰”至“其义一也”。○正义曰：此章指言笃志於仁，则四海宅心，守正不足，则贤位莫继，丹朱、商均是也。是以圣人孜孜于仁德也。万章问孟子曰：世人有言，至於禹之代而德衰微，不传於贤而传於子，有诸此乎否？孟子答之曰：否，不然也。天与之贤者，则与贤者；天与之子，则与子。以其随天如何耳。往者舜荐禹於天，及得十有七年，舜於是崩死。禹以三年服丧毕，遂避舜之子商均，隐於阳城，天下之民从禹，若尧之死後民之舜而不之丹朱也。禹其後又荐益於天，及得七年，禹即崩死，益以三年服丧毕，益遂避禹之子启，隐於箕山之阴，朝觐讼狱讴歌者皆不归益而归禹之子启，咸曰：我君之子也。无它，以其尧子丹朱不肖，舜子商均亦不肖，而舜之辅相尧、禹之辅相舜而历年多矣，施恩泽於民已久，天下之民所以归舜与禹，不归丹朱、商均也。启以贤，能敬承续禹之治，而益又辅相禹但七年，其历年尚少，不如舜相尧二十有八年、禹相舜十有七年之多，而施恩泽於民亦未至久，所以天下之民不归益而归启也，又况启有贤德，与丹朱、商均之不同耶。舜、禹、益相去年代己久远，其子之或贤或不肖，天使然也。非人所能为之也。人莫之为然而为然者，故曰天使然也，人莫能致之此事而其事自至者，是其命有是也。言天与命者，究其义则一也，以其无为而无不为，故曰天也；天之使我有是之谓命，故曰命也。天下善否，天实使之然也；禄位器服，乃其所命故也。今丹朱、商均与启三者之或贤或否，是其天也；天下之民或归之或不归之，是其命也。与《书》所谓天难谌命靡常，孔子云死生有命富贵在天，凡此亦天与命之意也。匹夫之贱而有天下者，其义必如舜、禹，而又得天子荐之者，故得有天下也。故孔子不有天下，虽言有德，然而无天子以荐之者，是不有天下也。继世之君，虽无仲尼之德，然而袭父之位，又非匹夫，故得有天下也。夫天之所以废灭者，必若桀与纣之暴虐，然後无乃废灭之矣。故益、伊尹、周公三者，不有天下，以其时值启、太甲、成王三君皆贤，天不废此三君，故益、伊尹、周公所以不有天下也。伊尹相汤王天下也，及汤崩死，太子太丁未立而丧，於是太丁弟外丙立，外丙即位二年崩，外丙弟仲壬立，仲壬即位四年崩，太丁子太甲立。太甲即位，遂颠覆汤之典刑，伊尹乃放之於桐宫，及三年，太甲乃自悔过，而怨其已恶，遂治身於桐宫，於是居仁徙义，以听伊尹之教训，复归于亳都，反天子之位焉。周公之不有天下，若益之於夏禹、伊尹之於殷汤故也。孔子曰：唐、虞二帝，禅让其位，夏禹、殷汤、周武继父之位，其义则一，更无二也。谓其义则一而无二者，盖唐、虞与贤，夏后、殷、周与子，天与贤则与贤，天与子则与子，其为顺天则一而已，故曰其义则一也。云禅者，盖唐、虞禅祭而告传位，故曰禅也。○注“阳城、箕山之阴，皆嵩山下深谷中”。正义曰：案《史记》裴る注云：刘熙曰：阳城是今之颍川也；箕山，嵩高之北是也。○注“太丁汤之子”至“位也”。○正义曰：案《史记》文，已具在《公孙丑》篇内，此更不录。然《史记》乃云外丙即位三年，今孟子云外丙二年，盖《史记》不稽《孟子》之过也。○注“丹朱、商均”。○正义曰：尧、舜之子。皇甫谧云：娥皇无子，商均，女英生也。" }
      - { type: j, text: "万章问曰：“人有言‘伊尹以割烹要汤’，有诸？”" }
      - { type: z, text: "人言伊尹负鼎俎而干汤，有之否？" }
      - { type: j, text: "孟子曰：“否，然。" }
      - { type: z, text: "否，不也，不如是也。" }
      - { type: j, text: "伊尹耕於有莘之野，而乐尧、舜之道焉。非其义也，非其道也，禄之以天下弗顾也，系马千驷弗视也。非其义也，非其道也。一介不以与人，一介不以取诸人。" }
      - { type: z, text: "有莘，国名。伊尹初隐之时，耕於有莘之国，乐仁义之道。非仁义之道者，虽以天下之禄加之，不一顾而觎也。千驷，四千匹也，虽多，不一眄视也。一介草不以与人，亦不以取於人也。" }
      - { type: j, text: "汤使人以币聘之，嚣嚣然曰：‘我何以汤之聘币为哉？我岂若处畎亩之中，由是以乐尧、舜之道哉？’" }
      - { type: z, text: "汤闻其贤，以玄之币帛往聘之，嚣嚣然，自得之志，无欲之貌也。曰：岂若居畎亩之中而无忧哉，乐我尧、舜仁义之道。" }
      - { type: j, text: "汤三使往聘之，既而幡然改曰：‘与我处畎亩之中，由是以乐尧、舜之道，吾岂若使是君为尧、舜之君哉！吾岂若使是民为尧、舜之民哉！吾岂若於吾身亲见之哉！" }
      - { type: z, text: "幡，反也。三聘既至，而後幡然改本之计，欲就汤聘，以行其道，使君为尧、舜之君，使民为尧、舜之民。" }
      - { type: j, text: "天之生此民也，使先知觉後知，使先觉觉後觉也。予，天民之先觉者也，予将以斯道觉斯民也，非予觉之而谁也？’" }
      - { type: z, text: "觉，悟也。天欲使先知之人悟後知之人，我先悟觉者也，我欲以此仁义之道觉悟此未知之民，非我悟之，将谁教乎？" }
      - { type: j, text: "思天下之民，匹夫匹妇有不被尧、舜之泽者，若己推而内之沟中，其自任以天下之重如此，故就汤而说之以伐夏救民。" }
      - { type: z, text: "伊尹思念不以仁义之道化民者，如己推排内之沟壑中也。自任之重如此，故就汤说之伐夏桀、救民之厄也。" }
      - { type: j, text: "吾未闻枉己而正人者也，况辱己以正天下者乎？" }
      - { type: z, text: "枉己者尚不能以正人，况於辱己之身而有正天下者也。" }
      - { type: j, text: "圣人之行不同也，或远或近，或去或不去，归洁其身而已矣。" }
      - { type: z, text: "不同，谓所由不同，大要当同归，但殊涂耳。或远者，处身远也；或近者，仕者近君也；或去者，不屑就也；或不去者，云焉能浼我也，归於身不污己而已。" }
      - { type: j, text: "吾闻其以尧、舜之道要汤，未闻以割烹也。" }
      - { type: z, text: "我闻伊尹以仁义干汤，致汤为王，不闻以割烹牛羊为道。" }
      - { type: j, text: "《伊训》曰：‘天诛造攻，自牧宫。朕载自亳。’”" }
      - { type: z, text: "《伊训》，《尚书》逸篇名。牧宫，桀宫。朕，我也，谓汤也。载，始也。亳，殷都也。言意欲诛伐桀造作可攻计之罪者，从牧宫桀起自取之也。汤曰我始与伊尹谋之於亳，遂顺天而诛之也。“万章问曰”至“自亳”。○正义曰：此章指言贤达之理世务也，推正以济时物，守己直行，不枉道以取容，期於益治而已矣。“万章问曰”至“有诸”者，万章问孟子，谓世人有言伊尹以负鼎俎割烹之事而干汤，有之否乎？“孟子曰：否”至“朕载自亳”，孟子答之。曰：否，不是也，伊尹耕於有莘之国野而乐行尧、舜二帝之道，如非其义与非其道也，虽禄赐之以天下之大，且不顾而若无也；系马虽千匹之多，亦且不眄视也。非其义也，非其道也，虽一草介亦不取诸人也，以其伊尹所操守如是也。汤闻如此之贤，乃使人以币帛之物往聘之。伊尹且嚣嚣然自得，而曰：我何为以汤之币聘是为出哉？我岂如居处有莘之畎亩之中，缘此以乐尧、舜之道哉？汤至三次使人往以币帛聘之，既至而後反然改本之计曰：与我居处有莘之畎亩之中，由是以乐尧、舜之道，我岂如使此君成汤为尧、舜之君哉？吾岂若使汤之民为尧、舜之民哉？我岂若吾身今得亲见致君为尧、舜之君，致民为尧、舜之民哉？於是又曰：上天之生此人民也，是使为先知以觉悟後知者也，是使为先觉悟以觉悟其後觉者也。我今亦天民之先觉者也，我将亦以伊尹乐尧、舜仁义之道以觉悟今之民，如非我觉悟之，而谁能也？孟子於此又言伊尹思念天下之民，虽一匹之夫妇有不被尧、舜之恩泽者，如己推而内之於沟壑中也。其伊尹自任以天下之重如此，然後故就汤而说之，以伐夏桀而救人民之厄也。我未闻有枉其己身而能正人者也，而况伊尹肯辱身负鼎俎割烹之事以为正天下者乎？且圣人所行之迹不同也，或远处其身而不仕，或近而仕君，或去而不屑就，或不去以为尔焉能浼我哉，但归其身而不污己而已矣。如是，则我所以但闻伊尹以尧、舜之道干说其汤，未闻以鼎俎割烹之事而要汤也。故《尚书·伊训》之篇有云：天行诛伐，始攻之罪者，自桀宫起也。汤言我始与伊尹谋之，自亳地也。以此详之，则知伊尹非事割烹之污而要汤伐桀者也。伊尹或远而不仕，谓在有莘之野是也；或近而仕，谓汤三聘而往见之是也；去亳夏，所谓或去是也；既丑有夏，复归于亳，所谓或不去是也。○注“伊尹负鼎俎而干汤”。○正义曰：案《史记·殷本纪》云：“伊尹名阿衡，欲干汤而无由，乃为有莘氏媵臣，负鼎俎，以滋味说汤，致於王道。或曰伊尹处士，汤使人聘迎之，五反然後肯往从汤，言素王及九主事，汤举任以国政。伊尹去汤夏，既丑有夏，复归于亳。”裴る云：《列女传》曰：“汤妃，有莘氏之女。”刘向《别录》曰“九主者，有去君、专君、授君、劳君、寄君、等君、破君、国君、三岁社君，凡九品。图画其形”是也。○注“有莘，国名”至“人也”。○正义曰：案《左传》庄公三十二年秋七月“有神降于莘”，杜预曰：“莘，虢地。”又云：“虢国，今荥阳县”是也。云“千驷，四千匹”。案《论语》，孔子云：“齐景公有马千驷。”孔安国注云：“千驷，四千匹。”○注“伊训”至“牧宫”。○正义曰：云《伊训》，逸篇之名，盖今之《尚书》亦有《伊训》之篇，乃其文则曰：“造攻自鸣条，朕哉自亳。”孔安国传云：“造皆始也。鸣条，地在安邑之西。”又云：“汤始居亳。”孔安国云：“帝喾都亳，汤自商丘迁焉。”是则亳，帝喾之都也。今云殷都，即因汤居而言尔。" }
      - { type: j, text: "万章问曰：“或谓孔子於卫主痈疽，於齐主侍人瘠环，有诸乎？”" }
      - { type: z, text: "有人以孔子为然。痈疽，痈疽之医者也。瘠，姓；环，名，侍人也。卫君、齐君之所近狎人也。" }
      - { type: j, text: "孟子曰：“否。然也。好事者为之也。" }
      - { type: z, text: "否，不也，不如是也。但好事毁人德行者为之辞尔。" }
      - { type: j, text: "於卫主颜雠由。弥子之妻与子路之妻，兄弟也。弥子谓子路曰：‘孔子主我，卫卿可得也。’子路以告，孔子曰：‘有命。’孔子进以礼，退以义，得之不得曰‘有命’。而主痈疽与侍人瘠环，是无义无命也。" }
      - { type: z, text: "颜雠由，卫贤大夫，孔子以为主。弥子，弥子瑕也，因子路欲为孔子主，孔子知弥子幸於灵，不以正道，故不纳之，而归於命也。孔子进以礼，退以义，必曰有天命也。若主此二人，是为无义无命者也。" }
      - { type: j, text: "孔子不悦於鲁、卫，遭宋桓司马，将要而杀之，微服而过宋。是时孔子当厄，主司城贞子，为陈侯周臣。" }
      - { type: z, text: "孔子以道不合，不见悦鲁、卫之君而去诸侯，遭宋桓之故，乃变更微服而过宋。司城贞子，宋卿也，虽非大贤，亦无谄恶之罪，故谥为贞子。陈侯周，陈怀公子也，为楚所灭，故无谥，但曰陈侯周。是时孔子遭厄难，不暇择大贤臣，而主贞子，为陈侯周臣也。於卫、齐无厄难，何为主痈疽、瘠环者也。" }
      - { type: j, text: "吾闻观近臣，以其所为主；观远臣，以其所主。若孔子主痈疽与侍人瘠环，何以为孔子？”" }
      - { type: z, text: "近臣，当为远方来贤者为主。远臣自远而至，当主於在朝之臣贤者。若孔子主於卑幸之臣，是为凡人耳。何谓孔子得见称为圣人乎？“万章问曰”至“孔子”。○正义曰：此章指言君子大居正，以礼进退，屈伸达节，不违贞信。故孟子辩之，正其大义者也。“万章问曰”至“有诸乎”，万章问孟子曰：或有人谓孔子於卫国主痈疽之医者，於齐国主侍人姓瘠名环者，诚有诸此乎否？“孟子曰：否”至“何以为孔子”，孟子答之曰：否，言不如是也，但好事毁人德行者为此言也。夫孔子於卫主颜雠由，雠由，贤大夫也。弥子瑕之妻与子路之妻是兄弟也，弥子瑕乃谓子路曰：孔子如主於我，则卫之卿，孔子可得也。子路以此言告孔子，孔子遂曰：我有命也。以其得与不得皆命也。孟子於此言夫孔子进以礼而有辞逊之心，退以义而有羞恶之心，其得用与不得用，则曰有命，如为主於痈疽与侍人瘠环者，是无义无命者也，是孔子所不为也。然则孔子於卫主颜雠由者，以其义也；於卫不主弥子，以其有命也。以义则得其宜也，以命则得与不得无所忧也。然而孔子又尝不悦於鲁、卫二国，遂之宋国，是时宋国司马桓将要求孔子而杀之，孔子乃变更微服而过宋。当此时也，孔子是遭其厄，不得已，遂至陈，主司城贞子家，为陈侯周之臣。孟子於此又曰：我闻观远方之来臣者，但观其所为主者如何，则知其贤否也。今孔子如主痈疽与侍人瘠环，二人但卑佞之臣耳，为凡人也，何得为之孔子？今以司城贞子之行不可得而详，由其谥而推之，则司城贞子亦为守正之臣者也，非痈疽、瘠环之比也。然则孔子当厄，不得己而主之者尚且如是，况痈疽、瘠环者，孰谓孔子肯主之乎？盖司城者，今以宋六卿考之，则司城在司寇之上，右师、左师、司马、司徒之下，其位则六卿之中也。古有司空之官，无司城之名，特宋有之者，按《左传》鲁桓公六年“宋以武公废司空”。杜预曰：“武公名司空，遂变为司城也。”○注“痈疽之医”，“瘠，姓；环，名，侍人也”。○正义曰：未详其人，但以经文推之，亦诚然也。○注“颜雠由”至“灵公”。○正义曰：案孔子世家《史记》云：“孔子自鲁卫，主於子路妻兄颜浊邹家。”是则颜雠由即浊邹也，为卫大夫。又案鲁哀公二十五年《左传》云：“弥子饮卫侯酒。”杜预云：“弥子，弥子瑕也。是其有幸於卫灵公者也。”○注“遭宋桓之故”至“陈侯周”。○正义曰：案《史记》：“孔子自卫过曹，及去曹宋，与弟子习礼大树下。宋司马桓欲杀孔子，拔其树。遂郑，与弟子相失。遂至陈，主於司城贞子家。岁馀，吴王夫差伐陈，取三邑而去。”由是推之，则司城贞子为陈国之卿，非宋卿也。亦恐史家谬误。云陈侯周，怀公子也，今案《史记·世家》“陈怀公之子名越者，乃为公”，又案《公年表》“六年，孔子来”，是则陈侯周即公，是为怀公之子。公即位二十四年，楚惠王复国，以兵北伐，杀公，遂灭陈而有之，是岁孔子卒於鲁。案《孔子世家》云：“孔子在陈三岁，晋、楚争强，更伐陈。及吴侵陈，孔子遂曰：归与归与。”然则孔子公六年来至，居三岁，遂复卫而归鲁，是公八年去陈也。由此推之，则孔子主於司城，是为公之臣矣。今孟子乃云为陈侯周臣，是陈侯周即也。" }
      - { type: j, text: "万章问曰：“或曰：‘百里奚自鬻於秦养牲者，五羊之皮，食牛，以要秦缪公。’信乎？”" }
      - { type: z, text: "人言百里奚自卖五羊皮，为人养牛，以是而要秦缪之相，实然不？" }
      - { type: j, text: "孟子曰：“否，然，好事者为之也。" }
      - { type: z, text: "好事毁败人之德行者为设此言也。" }
      - { type: j, text: "百里奚，虞人也。晋人以垂棘之璧与屈产之乘，假道於虞以伐虢。宫之奇谏，（垂棘，美玉所出地名。屈产，地，良马所生。乘，四马也。皆晋国之所宝。宫之奇，虞之贤臣，谏之不欲令虞公受璧、马而假晋道。）百里奚不谏，知虞公之不可谏而去。之秦，年已七十矣，曾不知以食牛干秦缪公之为污也，可谓智乎？不可谏而不谏，可谓不智乎？知虞公之将亡而先去之，不可谓不智也。时举於秦，知缪公之可与有行也而相之，可谓不智乎？相秦而显其君於天下，可传於後世，不贤而能之乎？”" }
      - { type: z, text: "百里奚知虞公之不可谏而去之秦，年七十而不知食牛、干人君之为污，是为不智也。欲言其不智，下有三智，知食牛干秦为不然也。卒相秦，显其君，不贤之人岂能如是？言其实贤也。" }
      - { type: j, text: "自鬻以成其君，乡党自好者不为，而谓贤者为之乎？" }
      - { type: z, text: "人自鬻於污辱，而已传相成立其君，乡党邑里自喜好名者尚不肯为也，况贤人肯辱身而为之乎？“万章问曰”至“贤者为之乎”。○正义曰：此章指言君子时行则行，时舍则舍，故能显君明道，不为苟合，而为正者也。“万章问曰”至“信乎者”，万章问孟子，谓或有人曰百里奚自卖五羊之皮於秦，为人养牛，以此而干秦缪公为之相，今信乃为实然乎，否乎？“孟子曰：否”至“而谓贤者为之乎”，孟子答之，以为否，不信然也。百里奚，虞国之大夫也。晋献公以垂棘之璧与屈产之乘，假道於虞以伐虢国。虞之大夫宫之奇谏之，令虞公无受璧与马以借与道也。百里奚不谏之，以其知虞公之不可谏而去之。遂往秦，时百里奚年己七十岁矣，岂不知食养牛、干秦缪公之为有污辱也？苟如是，不知以食牛为污辱，可谓为智者？言不可谓之智者矣。知虞公为君不可得而谏，故不谏，可谓为不智乎？言如此可谓为智者也。又知虞公将亡其国，而乃先去之而之秦，不可谓之不智也。时得举用於秦国，百里奚知秦缪公可与有行其道也，遂辅相之，可谓不智乎？言可谓之智者矣。及辅相秦缪公，而显其君名扬於天下，又可传於後世，不为贤者而能如是乎？言百里奚真贤者，乃能如是显其君於天下，可传於後世。如自卖而污辱其身，乃为成立其君，虽乡党邑里自喜好名者，尚亦不肯为自鬻以污身，今乃谓百里奚为真贤者而肯为乎？言百里奚不肯为是也。盖宫之奇者，按杜预《春秋传》云：“虞之忠臣也。”○注“五羊皮”。○正义曰：《说文》云：“，夏羊牝曰羊也。”○注“垂棘”至“晋道”。○正义曰：《左传》鲁僖公二年云：“晋荀息请以屈产之乘与垂棘之璧，假道於虞以伐虢。”杜预曰：“荀息，荀叔也。屈产生良马，垂棘出美玉，故以为名。四马曰乘。”《史记》云：“百里奚者，晋献公既虏百里奚以为秦缪公媵於秦，百里奚亡秦走宛，楚鄙人说之，缪公闻百里奚贤，欲重赎之，恐楚人不与，乃使人请以五羊之皮赎之。楚人许之，缪公乃释其囚，授之以国政，号曰五大夫。”是其事矣。又僖公五年，云：“晋侯复假道於虞以伐虢。宫之奇谏曰：‘虢，虞之表也。虢亡，虞必从之。晋不可启，寇不可玩，一之谓甚，其可再乎为？’二年，假晋道，灭下阳是也，谚所谓‘辅车相依，唇亡齿寒’，其虞、虢之谓也。宫之奇以其族行，曰：‘虞不腊矣，在此行也。’冬十二月，晋灭虢，虢公丑奔京师。师还，馆于虞。遂袭虞，灭之，执虞公及其大夫井伯，以媵秦穆姬。而虞祀，且归其职贡於王。故书曰：‘晋人执虞公。’罪虞，且言易也。”此孟子所以据且云焉。" }
