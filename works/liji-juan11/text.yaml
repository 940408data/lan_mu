# 禮記正義卷11（孔穎達疏）：j 為經文＋鄭玄注，z 為疏文。
sections:
  - id: juan11
    name: 正文
    blocks:
      - { type: j, text: "陸曰：“如字，徐於況反。盧雲：‘漢文帝令博士諸生作此篇。’”" }
      - { type: z, text: "正義曰：案鄭《目錄》雲：“名曰《王制》者，以其記先王班爵、授祿、祭祀養老之法度，此於《別錄》屬制度。”《王制》之作，蓋在秦漢之際。知者，案下文雲“有正聽之”，鄭雲“漢有正平承，秦所置”。又有“古者以周尺”之言，“今以周尺”之語，則知是周亡之後也。秦昭王亡周，故鄭答臨碩雲：“孟子當赧王之際，《王制》之作，復在其後。”盧植雲：“漢孝文皇帝令博士諸生作此《王制》之書。”" }
      - { type: j, text: "王者之制祿爵：公、侯、伯、子、男，凡五等。諸侯之上大夫卿、下大夫、上士、中士、下士，凡五等。二五，象五行剛柔十日。祿，所受食。爵，秩次也。上大夫曰卿。○王者如字，徐於況反。十日，人一反。" }
      - { type: z, text: "“王者”至“五等”。○正義曰：此一經論為王者之制祿爵，公、侯、卿大夫以下及士之法。凡王者之制度，祿爵為重，其食祿受爵之人，有公、侯、伯、子、男，並南面之君，凡五等也。其諸侯之下，北面之臣，有上大夫卿，有下大夫，有上士，有中士，有下士，凡五等也。南面之君五等，法五行之柔日。北面之臣五者，法五行之柔日。不以王朝之臣，而以諸侯臣者，王朝之臣本是事王，今《王制》統天下，故不自在其數，謂制統天下之君及天下之臣，取君臣自相對，故不取王臣也。此作記者，雖記虞氏皇而祭之文，大都總記茸荃制度，故言王者之制，不雲帝皇制也。不雲天子制者，《白虎通》雲：“王是天子爵號。”《穀梁傳》曰：“王者，仁義歸往曰王，以其身有仁義，眾所歸往謂之王。”王者制統海內，故云“王制”，不雲天子制也。凡王者不得稱官，故《學記》雲“大德不官”，而得稱職，故《詩》雲“袞職有闕”，《考工記》雲“國有六職”，坐而論道，謂之王公”是也。此並互文以見義。既天子不官，亦當不主一職。若以主天下為職，亦得管天下為官矣。祿者，穀也，故鄭注《司錄》雲“祿之言穀，年穀豐乃後製祿”，《援神契》雲“祿者，錄也”，《白虎通》雲“祿者，錄也。上以收錄接下，下以名錄謹以事上”是也。爵者，盡也，熊氏雲“醮盡其才而用之”，故《白虎通》雲“爵者，盡也，所以盡人才”是也。按下文雲“位定然後祿之”，又《大司徒》雲“十有一曰以賢制爵”，“十有二曰以庸制祿”，並祿在爵後。此祿在爵前者，祿是田財之物，班布在下，最是國之重事，須裁節得所，王者制度重之，故在於先，故此經下文先雲天子之田，乃雲諸侯之田，次雲制農田，又云“下士視上農夫祿”，又云“君十卿祿”，並先言祿。下始雲次國上卿當大國中卿，是後雲爵也。熊氏、皇氏以為試功之祿，故在爵前。按此王者制度，必當舉其正禮，何得唯明試功之祿？下雲“君十卿祿”，豈試功乎？熊氏、皇氏之說，於義疑也。公者，按《元命包》雲：“公者，為言平也，公平正直。侯者，候也，候王順逆。伯者，伯之為言白也，明白於德也。子者，奉恩宣德。男者，任功立業。”此五等者，謂虞夏及周制。殷則三等，公、侯、伯也。此公、侯、伯、子、男，獨以侯為名，而稱諸侯者，舉中而言，又《爾雅》侯為君，故以侯言之。伯亦居中，不言諸伯者，嫌是東、西二伯，及九州之伯故也。上大夫卿者，見下文雲“下大夫倍上士，卿四大夫祿”，是下大夫之上則有卿，故知上大夫即卿也。此上大夫卿外，惟有下大夫，所以下文除卿之外，更有上大夫、下大夫者，謂就下大夫之中，更分為上下耳。卿者，《白虎通》雲：“卿之言向也，為人所歸向。”大夫者，達人，謂扶達於人。上者，事也，皇氏、熊氏皆為任職事。其大夫之稱，亦得兼三公，故《詩》雲“三事大夫”，謂三公也。上大夫卿，亦兼孤也，故《春秋》陽處父為大傅，經雲“晉殺其大夫陽處父”是也。孤亦稱公，故《鄉飲酒禮》雲“公三重”，是孤也。卿亦得稱公，故《春秋》襄三十年傳雲鄭伯有之臣，稱伯有曰“吾公在壑谷”。士既命同，而分為三等者，言士職卑德薄，義取漸進，故細分為三。卿與大夫德高位顯，各有別命，不復細分。其諸侯以下，及三公至士，總而言之，皆謂之官。官者，管也，以管領為名，若指其所主，則謂之職，故《周禮》雲“設官分職”，通卿、大夫、士也。知諸侯亦為官者，《尚書·周官》雲“唐虞稽古，建官惟百”，下雲“外有州牧侯伯”，是州牧侯伯亦為官也。若細而言之，諸侯非偏有所主，則非官也，故《學記》雲“大德不官”，注云“天子諸侯”是也。諸侯亦稱職，故《左傳》雲“小有述職，大有巡功”，述職謂諸侯朝天子，是諸侯稱職也。其爵，則殷以前大夫以上有爵，故《士冠禮》雲“古者生無爵，死無諡”，謂士也。周則士亦有爵，故鄭注“周制以士為爵，死猶不為諡耳”是也。○注“二五”至“十日”。○正義曰：知象陰陽者，按《元命包》雲“周爵五等法五精”，注云“五精，是其總法五行，分之則法五剛，甲、丙、戊、庚、壬。其諸侯之臣法五柔，乙、丁、巳、辛、癸”是也。" }
      - { type: j, text: "天子之田方千里，象日月之大，亦取晷同也。此謂縣內，以祿公、卿、大夫、元士。○晷音軌，日影。公侯田方百里，伯七十里，子男五十里。不能五十里者，不合於天子，附於諸侯曰附庸。天子之三公之田視公侯，天子之卿視伯，天子之大夫視子男，天子之元士視附庸。皆象星辰之大小也。不合，謂不朝會也。小城曰附庸。附庸者，以國事附於大國，未能以其名通也。視猶比也。元，善也。善士謂命士也。此地，殷所因夏爵三等之制也。殷有鬼侯、梅伯，《春秋》變周之文，從殷之質，合伯、子、男以為一，則殷爵三等者，公、侯、伯也。異畿內謂之子。周武王初定天下，更立五等之爵，增以子、男，而猶因殷之地，以九州之界尚狹也。周公攝政致大平，斥大九州之界，制禮成武王之意，封王者之後為公，及有功之諸侯，大者地方五百里，其次侯四百里，其次伯三百里，其次子二百里，其次男百里。所因殷之諸侯，亦以功黜陟之，其不合者，皆益之地為百里焉。是以周世有爵尊而國小，爵卑而國大者，唯天子畿內不增，以祿群臣，不主為治民。○朝，直遙反，卷內皆同。畿，求衣反。狹音洽，後文同。太平音泰。斥，昌石反。黜陟，上醜律反；下竹力反。主為，於偽反，下“為有”，“亦為有”同。" }
      - { type: z, text: "“天子”至“附庸”。○正義曰：此一節論天子畿內之田及畿外五等諸侯，及畿內公、卿受地多少之法，各隨文解之。○注“象日”至“元士”。○正義曰：按《元命包》雲“日圓望之廣尺，以應千里”，故云“象日月之大，亦取晷同也”者。按《考靈耀》雲“地與星辰四游升降於茸茯裏之中。夏至之景，尺有五寸，是半茸茯裏，得萬五千裏”。故鄭注《司徒》雲“凡日景於地，千里而差一寸”，是千里同一寸也。細而言之，就千里之內，亦漸漸分數不同。此雲同一寸者，大略而言之，非但象日月大小，又取晷同，故云亦。雲“以祿公、卿、大夫元士”者，即下文“三公之田視公侯，天子之卿視伯”以下是也。按下注雲“待封王之子弟”，此唯言“公、卿、大夫、元士”者，舉正者言之耳。○注“皆象”至“治民”。○正義曰：“皆象星辰之大小也”者，按《元命包》雲“王者封之，上應列宿之位”，注云“若角亢為鄭，房心為宋之比”。又云“其餘小國不中星辰者，以為附庸”，是象星辰大小也。非但象星辰，其百里者又象雷，故《援神契》雲“王者之後稱公，大國稱侯，皆千乘，象雷震百里”，是取法於雷也。其七十里者倍減於百里，五十里者倍減於七十里，故《孝經》雲德不倍者，不異其爵；功不倍者，不異其土，故轉相半，別優劣。雲“不合謂不朝會也”者，謂不得與諸侯集合朝會天子也。雲“小城曰附庸”者，庸，城也，謂小國之城，不能自通、以其國事附於大國，故曰附庸。此不能五十里，故為小國之城。若《詩》“崇墉言言”，及《易》“公用射隼於高墉之上”，是大國之城亦名庸也。雲“元，善也。善士謂命士也”者，按《易·文言》雲“元者，善之長也”，故元為善也。按《周禮》注“天子上士三命，中士再命，下士一命”，故云“善士謂命士”，則上中下之士，皆稱元士也。天子之士所以稱元者，異於諸侯之士也。《周禮》公侯伯之士，雖一命不得稱元士，其夏、殷以上，諸侯之士皆不命也。故下文雲“小國之卿，與下大夫一命”，是士不得命也。雲“此地，殷所因夏爵三等之制也”者，以夏會諸侯於塗山，執玉帛者萬國。若不百里、七十里、五十里，則不得為萬國也。故知夏爵三等之制，如此經文不直舉夏時，而云殷所因者，若經指夏時，則下當雲萬國，不得雲凡九州千七百七十三國，故以為殷所因夏爵三等之制也，其國則少於夏也。雲“殷有鬼侯梅伯”，按《明堂位》雲“脯鬼侯”，又《呂氏春秋》雲“昔紂為無道，殺梅伯而醢之，殺鬼侯而脯之，以禮諸侯於廟”，《楚辭》雲“梅伯菹醢”，是殷有鬼侯梅伯也。鄭引此者，證殷有侯有伯，二王之後稱公，則殷亦有公可知也。雲“《春秋》改周之文，從殷之質，合伯、子、男以為一”者，按《公羊傳》桓十一年九月，“鄭忽出奔衛。忽何以名？《春秋》伯、子、男一也，辭無所貶”，何休雲“《春秋》改周之文，從殷之質，合伯、子、男為一，一辭無所貶，皆從子”。《春秋》之時，伯亦得稱子，子亦得稱伯。今鄭是伯爵，忽若稱子，與成君無異，則不見在喪之降貶，故在喪降而稱名，非為貶責稱名，故云辭無所貶。何休之意，合伯、子、男為一，皆從稱子也。鄭康成此注之意，合伯、子、男以為一，皆稱伯也，與何休不同，故鄭雲“殷爵三等者，公、侯、伯也”。若殷家夷狄之君，大者亦稱伯，故《書序》雲“巢伯來朝”，注云“伯，爵也。南方遠國”。雲“則殷爵三等者，公、侯、伯也”者，則公百里，侯七十里，伯五十里也。雲“異畿內謂之子”者，畿外既有公、侯、伯，標異畿內，特謂之子爵。雖為子，若作三公，則受百里之地。若作卿，則受七十里之地。若作大夫，則受五十里之地。殷家雖因於夏，畿內之制，與夏不同。夏之畿內國，皆方五十里，故鄭注《尚書》萬國之數雲“四百國，在畿內”，是皆五十里。殷之畿內，據下文“有百里之國九，七十里之國二十有一，五十里之國六十有三，凡九十三國”，是與夏不同也。張逸問：“殷爵三等，公、侯、伯，《尚書》有微子、箕子何？”鄭答雲：“微子、箕子，實是畿內采地之爵，非畿外治民之君，故云子也。”雲“周武王初定天下，更立五等之爵，增以子、男”者，按《尚書·武成》雲“列爵惟五，分土惟三”，既雲“列爵惟五”，故知增以子、男也。雲“而猶因殷之地，以九州之界尚狹也”者，解所以列爵既五，則應五等之土，上公五百里以下，猶因殷之地。公、侯百里，伯七十里，子、男五十里為三等，以雖伐紂，九州之地尚隘狹，未得五等之封故也。雲“周公攝政致太平，斥大九州之界，制禮成武王之意”者，斥大謂開斥廣大，於先中國方三千里，今方七千，是斥大九州之界也。武王既列爵惟五，是意欲為五等之封，但為界狹。今周公為五等之封，是成武王之意。雲“諸侯大者地方五百里”以下，皆《大司徒職》文。雲“所因殷之諸侯，亦以功黜陟之”者，謂周之諸侯，既以有功封建其國，所因殷之諸侯，既無大罪，不可以絕滅。亦如周之諸侯，以勳多少黜退之，升陟之。殷之諸侯大者百里，今日有功則升陟，或二百里，或三百里，是陟之也。雲黜者，謂於周家有過，諸侯黨紂為惡者，皆黜退之，不復得為諸侯。或黜鹹至七十、五十里，或有罪黜為附庸也。雲“其不合者，皆益之地為百里焉”，謂其不以功過黜陟者，謂平常諸侯，皆益之地，使滿百里焉。雲“周世有爵尊而國小，爵卑而國大”者，張逸疑而不解，以問於鄭，鄭答之雲：“設今有五十里之國於此，無功可進，無過可退，亦就益其地，為百里之國。爵尊而國小者，若虞虢之君，爵為公，地方百里。爵卑而國大者，侯四百里，伯三百里，子、男二百里，皆大於虞虢。”鄭通言男亦二百里者，據男有功，得附庸者言之耳，大於虞虢百里之意。雲“惟天子畿內不增以祿群臣，不主為治民”者，解畿內之地，公、侯、伯、子、男皆增其地，今畿內、公卿大夫采地不增益之者，本以祿賜群臣，不須增益其地，以其不主為治民者也。外土諸侯本為治民，須使民利國，故須增益其封。周之畿內有百里之國，有五十里之國，有二十五里之國。鄭注《小司徒》雲：“百里之國凡四都，五十里之國凡四縣，二十五里之國凡四甸。”故崔氏雲：“畿內有百里之國，有五十里之國，有二十五里之國。”《元命包》雲：“周爵五等法五精，《春秋》三等象三光。”說者因此以為文家爵五等，質家爵三等。若然，夏家文應五等，虞家質應三等。按《虞書》“輯五瑞”，“修五禮五玉”，豈復三等乎？又《禮緯含文嘉》雲：“殷爵三等，殷正尚白，白者兼正中，故三等。夏尚黑，亦從三等。”按《孝經》夏制，而云公、侯、伯、子男，是不為三等也。《含文嘉》之文，又不可用也。" }
      - { type: j, text: "制：農田百畝。百畝之分，上農夫食九人，其次食八人，其次食七人，其次食六人。下農夫食五人。庶人在官者，其祿以是為差也。農夫皆受田於公，田肥墽有五等，收入不同也。庶人在官，謂府史之屬，官長所除，不命於天子國君者。分或為糞。○分，扶問反。食音嗣，下同，徐音自。差，初佳反，徐初宜反，下注同。墝本又作墽，苦交反。長，丁丈反，下文及注皆同。糞，方運反。諸侯之下士視上農夫，祿足以代其耕也。中士倍下士，上士倍中士，下大夫倍上士。卿四大夫祿，君十卿祿。次國之卿三大夫祿，君十卿祿。小國之卿倍大夫祿，君十卿祿。此班祿尊卑之差。" }
      - { type: z, text: "“制農”至“卿祿”。○正義曰：此一節論制農田有上中下，以祿庶人在官及士大夫，並卿及君之祿，各隨文解之。○注“農夫”至“為糞”。○正義曰：“農夫皆受田於公”者，以經雲“制農田”，是王者制度；授農以田，是農夫受田於公也。雲“肥墽有五等，收入不同也”者，按《周禮》地有九等，故《司徒》“上地家七人，中地家六人，下地家五人”，注云“有夫有婦，然後為家。自二人以至於十人為九等”，“一家男女七人以上，則授之以上地，所養者眾也。男女五人以下，則授之以下地，所養者寡也。正以七人六人五人為率者”，舉中而言。如鄭此言上地家七人者，為中地之上；家六人者謂中地之中；家五人者謂中地之下。以此推之，下地之上家四人，下地之中家三人，下地之下家二人，則上地之上家十人，上地之中家九人，上地之下家八人，是有九等，從十人而以至於二人。此經地惟五等，自九人而下至五人不同者，《大司徒》所云農夫授田，實有九等。此據準庶人在官之祿，最下者猶五人，故從上農夫至五人而已。《司徒》“上地家七人”，此雲“上農夫食九人”者，謂上中之地亦為上地，即上農夫，不言上上者，欲取九人當下士祿，亦與《司徒》不異也。既有九等，按《大司徒》“不易之地家百畝，一易之地家二百畝，再易之地家三百畝”，地惟有三等者，《大司徒》言其大綱，其實不易、一易、再易各為三等，則九等也。按《異義》：“《左氏》說山林之地，九夫為度，九度而當一井。藪澤之地，九夫為鳩，八鳩當一井。京陵之地，九夫為辨，七辨而當一井。淳滷之地，九夫為表，六表而當一井。疆潦之地，九夫為數，五數而當一井。偃豬之地，九夫為規，四規而當一井。原防之地，九夫為町，三町而當一井。隰皋之地，九夫為牧，二牧而當一井。衍沃之地，九夫為井。賦法積百井，除山川坑岸三十六井，定出賦者六十四井，則千里之畿，地方百萬井，除山川坑岸三十六萬井，定出賦者六十四萬井，長轂萬乘。”如《異義》此說，則方十里凡百井。三十六井為山川坑岸，六十四井為平地出稅。按鄭注《小司徒》成方十里，緣邊一里，治為溝洫，則三十六井，其餘方八里為甸，六十四井出田稅，與《異義》不同者，《異義》所云通山林藪澤九等而言之，鄭注《小司徒》者，據衍沃平地而言之，所以不同也。《異義》九等者，據大略國中有山林，至衍沃之等言之。《周禮》九等者，據授民地肥瘠有九等，與《異義》不同也。《尚書·禹貢》注云：“一井上上，出九夫稅，上中出八夫稅，上下出七夫稅，中上出六夫稅，中中出五夫稅，中下出四夫稅，下上出三夫稅，下中出二夫稅，下下出一夫稅。”所以又有此九等者，以《禹貢》九州有上中下九等。出沒不同，故以井田計之，以一州當一井。假令冀州上上出九百萬夫之稅，兗州下下出一百萬夫之稅，是九州大較，相比如此，非謂冀州之民皆出上上，兗州之民皆出下下，與《周禮》九等又不同也。所以上農夫得食九人者，以《史記》雲上地畝一鍾，鍾六斛四鬥，百畝百鍾，則六百四十斛。按《食貨志》又云“上孰，其收自四斛”，則百畝四百斛也。按《廩人》中歲人食三鬴，其九人之內，老幼相通，不皆人食三鬴，故食九人也。其民之常稅不過什一，又庶民喪祭費用又少，且年有豐儉，不恆上孰。崔氏以為畝皆一鍾，人恆食四鬴，又為什二而稅，又云祭用數之仂者，苟欲計筭使合其義，非也。雲“庶人在官，謂府史之屬”者，則《周禮·大宰》雲“府六人，史十有二人。”雲之屬，謂工人、賈人及胥徒也。雲“官長所除，不命於天子國君者”，官長謂冢宰為天官之長，司徒為地官之長，自所命，或若大府為府藏官之長，大司樂為樂官之長是也。言所除者，謂所命之官，除去其舊名籍。《周禮》注云“凡府史以下，官長所自闢除”，以其非九命之內，故知不命於天子國君也。若子男之士雖無命，亦當命於國君也，以其稱士故也。○注“此班”至“之差”。○正義曰：經雲“下士視上農夫，祿足以代其耕也”，則庶人在官者，雖食八人以下，不得代耕，故《載師》有官田，謂庶人在官之田，大夫以下，位卑祿少，故大小國不殊，卿與君祿重位尊，故祿隨國之大小為節。按《周禮》天子卿、大夫、士，與諸侯之臣執贄同，則祿亦同也。此自下士至小國之卿倍大夫祿，皆據無采地者言之，故鄭答臨碩雲：“王畿方千里者，凡九百萬夫之地，三分去一，定受田者三百萬夫。出都家之田，以其餘地之稅，祿無田者，下士食九人，中士食十八人，上士三十六人，下大夫七十二人，中大夫百四十四人，卿二百八十八人。" }
      - { type: j, text: "次國之上卿，位當大國之中，中當其下，下當其上大夫。小國之上卿，位當大國之下卿，中當其上大夫，下當其下大夫。此諸侯使卿大夫覜聘並會之序也。其爵位同，小國在下，爵異，固在上耳。○覜，吐吊反。" }
      - { type: z, text: "“次國”至“大夫”。○正義曰：此一節論諸侯使卿、大夫、士覜聘班序行列之法，各隨文解之。○注“此諸”至“上耳”。○正義曰：經文既稱大國小國大小並在則非是特來故知使卿大夫覜聘並會也。雲：“其位爵同小國在下者，爵同，謂同作卿也。據經文，小國卑於大國，故知小國之卿在大國之卿下。雲“爵異，固在上耳”者，謂大國是大夫，小國是卿，則經雲小國之卿，位當大國之上大夫，是小國之卿，爵異於大國之大夫。其爵既異，固當在大夫之上。必知爵異，小國在上者，以其卿執羔，大夫執雁，使卿絺冕，大夫玄冕，故知小國之卿，不得在大國大夫之下也。" }
      - { type: j, text: "其有中士下士者，數各居其上之三分。謂其為介，若特行而並會也。居猶當也。此據大國而言，大國之士為上，次國之士為中，小國之士為下。士之數，國皆二十七人，各三分之上九、中九、下九，以位相當，則次國之上士當大國之中，中當其下，小國之上士當大國之下。凡非命士，亦無出會之事。《春秋傳》謂士為微。○三分如字。為界音界。" }
      - { type: z, text: "“其有”至“三分”。○正義曰：中士者，謂次國之士。下士者，謂小國之士。大國之士既分為三分，次國小國之士亦分為三分。今大國之士既定在朝會，若其有中國之士小國之士者，其行位之數，各居其上國之三分之二，謂次國以大國為上，而次國上九當大國中九，次國中九當大國下九，是當其大國之三分之二。小國以次國為上，小國上九當次國中九，小國中九當次國下九，亦是居上三分之二也。是各居上之三分。○注“謂其”至“為微”。○正義曰：言“謂其為介”者，若《聘禮》“士介四人”是也。若特行，則隱元年“及宋人盟於宿”是也。本國出使，其行至他國，與諸國並會也。雲“此據大國而言”者，以經必雲中士下士，不雲上士，是文以大國為主，以中國下國來當之，故知據大國而言。雲“大國之士為上，次國之士為中，小國之士為下”者，解經之中士為中國之士，下士為下國之士。經雖無上士之文，以中士下士類之，則上士為大國之士也。就上士中士下士之內，各分為上九、中九、下九。言大國之士為上，不解經之上字者，自謂次國以大國為上，小國以次國為上耳。雲“凡非命士，亦無出會之事”者，即《祭法》庶士是也。雲“《春秋傳》謂士為微”者，隱元年“及宋人盟於宿”，《公羊傳》雲“孰及之？內之微者也”，是謂士為微也。" }
      - { type: j, text: "凡四海之內九州。州方千里，州建百里之國三十，七十里之國六十，五十里之國百有二十，凡二百一十國。名山大澤不以封，其餘以為附庸間田。八州，州二百一十國。建，立也。立大國三十，十三公也。立次國六十，十六卿也。立小國百二十，十二小卿也。名山大澤不以封者，其民同財，不得障管，亦賦稅之而已。此大界方三千里，三三而九，方千里者九也。其一為縣內，餘八各立一州，此殷制也。周公制禮，九州大界方七千裏，七七四十九，方千里者四十有九也。其一為畿內，餘四十八。八州各有方千里者六，設法一州，封地方五百里者不過四，謂之大國。又封方四百里者不過六，又封方三百里者不過十一，謂之次國。又封方二百里者不過二十五，及餘方百里者，謂之小國。盈上四等之數，並四十六。一州二百一十國，則餘方百里者百六十四也。凡處地方千里者五方，百里者五十九，其餘方百里者四十一，附庸地也。○間音閒，章，之尚反。" }
      - { type: z, text: "“凡四”至“十國”。○正義曰：此一節論四海之內九州，州別建國多少及附庸間田之法，如鄭所注，此經雲是殷法也。《周禮》則九服，夷鎮蕃三服謂之四海，四海之內，謂要服以內。殷則服數無文，則必不與周同。按《爾雅·釋地》雲：“九夷八狄七戎六蠻，謂之四海。”孫炎雲：“海之言晦，晦闇於禮義。”此言四海之內，謂夷狄之內也。地方三千里，以開方計之，三三如九，方千里者有九。其一為天子縣內，下文具之。以外八州，州別方千里者有一。州建百里之國三十，是公國也；七十里之國六十，是侯國也；五十里之國百有二十，是伯國也，是一州凡二百一十國。必二百一十國者，按《元命包》雲：“陽成於三，列於七，三七二十一，故二百一十國也。”“其餘以為附庸間田”，謂置二百一十國外之餘地，為附庸間田也。若封人，附於大國謂之附庸。若未封人，謂之間田。每州二百一十國所餘之地者，則下文雲“方百里者十，方十里者六十”是也。○注“建立”至“地也”。○正義曰：建是樹立之義，故建為立也。雲“立大國三十，十三公也”者，鄭以天子縣內三公之國亦百里，今畿外大國亦百里，是準擬畿內三公之地，故云“十三公”也。每十個國則準一公，是三十國準於三公也。雲“立次國六十，十六卿也”者，亦以畿內六卿之地方七十里，今畿外次國亦七十里，故知準擬六卿，言十於六卿六十也。通三孤則謂之九卿，據有職事者言之，故為六卿也。雲“立小國百二十，十二小卿也”者，小卿則天子畿內大夫，國方五十里，今畿外小國亦五十里，是準擬大夫，當十於十二小卿也。定本雲“十十二小卿”，重有十字，俗本直雲十二小卿，俗本誤也。雲“名山大澤不以封者，與民同財”者，若封諸侯，則諸侯為主，若不得取其財物，故不封諸侯，使民共取，故《山虞職》雲“令萬民時斬材，有期日”是也。雲“不得障管，亦賦稅之而已”者，既不封諸侯，其諸侯不得障塞管領，禁民取物，民既取物，隨其所取賦稅而已，故《澤虞》雲“使其地之人，守其財物，以時入之於王府”是也。定本雲“不得不管，亦賦稅而已”，謂雖不封諸侯，諸侯不得不管。若如此解，則於“而已”二字為妨，恐定本誤也。雲“此殷制也”者，以夏時萬國，則地餘三千里，周又中國方七千裏，今大界三千，非夏非周，故云“殷制也”。其實夏之末年，亦與殷同方三千里，故下雲“天子之縣內”，鄭注云“縣內，夏時天子所居州界名也”。又云“夏末既衰，夷狄內侵”，“土地減，國數少”是也。雲“周公制禮，九州大界方七千裏”者，按《大行人》“邦畿方千里，其外方五百里，謂之侯服”、甸服、男服、採服、衛服、要服，服五百里，通王畿四面相距為七千裏。《大行人》要服已外，即雲“九州之外，謂之蕃國”，是要服以內為中國也。雲“設法一州，封地方五百里者不過四”者，言設法謂假設為法，非實封也，故《職方》雲“千里封公，以方五百里則四公”，注云“每事言則者，設法也”，是不實封。必知不實封者，以每州有四公，八州則三十二公。周之上公，則惟杞、宋耳，故知非實封也。一州有千里之方六，則一個千里之方，為方百里者百；一個五百里之國，為方百里者二十五，四個二十五用千里之方一，是方五百里者不過四也。雲“又封方四百里者不過六”者，以一個四百里之國，為方百里者一十六，六個一十六為九十六，是用百里之方九十六，為六個四百里之國，故云“方四百里者不過六”，用千里之方一，猶餘百里之方四。雲“又封方三百里者不過十一”者，以一個三百里之國，為方百里者九，十一個九為九十九，是用百里之方九十九，故云“封方三百里者不過十一”，用千里之方一，猶餘百里之方一。雲“又封方二百里者不過二十五”者，以一個二百里之國，為方百里者四，二十五個二百里國，用千里之方一，故云“封方二百里者不過二十五”。雲“盈上四等之數”者，謂將此百里小國一百六十四，添盈公、侯、伯、子四等之數四十六，則為一州二百一十國也。雲“則餘方百里者，百六十四也”者，以其上惟雲“餘方百里者，謂之小國”，不顯其數多少，直言盈上四等之數。四等既有四十六，若添滿二百一十，必須百六十四，故云“方百里者，百六十四也”。雲“凡處地方千里者五，方百里者五十九”者，封公則四，是用千里之方一；封侯則六，又用千里之方一；封伯十一，又用千里之方一；封子二十五，又用千里之方一，封男百，又用千里之方一。是處地方千里者五，男國更須六十四，則應須百里之方六十四，但千里之方六，封侯之外，猶餘百里之方四，千里之方封伯十一之外，猶餘百里之方一，是五個千里之方內，總餘百里之方五，得為五個男國，則五個千里之方，更得五十九外個百里之方，是滿六十四也。雲“其餘方百里者四十一，附庸地也”者，以百里之方百，去其五十九，故餘四十一也。按鄭注《大司徒》雲“侯附庸九同，伯附庸七同，子附庸五同，男附庸茸墁。”今一州，惟有方百里者四十一，得備侯、伯、子、男一百一十國附庸者。鄭注《司徒》雲“凡諸侯為牧正帥長，及有德者，乃有附庸”，非國國皆有。且此雲州別二百一十國，及侯附庸九同，皆設法而言，非實事也。注“侯附庸九同”者，諸侯有功可進為公，為四百里之上加九同，得進為五百里也。伯於三百之上加七同，得為四百里，進為侯也。子於二百里之上加五同，得為二百里，進為伯也。男於百里之上加茸墁，得為二百里，進為子也。言同者，謂積累眾附庸而滿同也，非謂一附庸居一同也。鄭注《司徒》雲“公無附庸”，以其尊極故也。故鄭雲魯以周公之故，得兼四等，加二十四附庸，方七百里也。" }
      - { type: j, text: "天子之縣內，方百里之國九，七十里之國二十有一，五十里之國六十有三，凡九十三國。名山大澤不以朌，其餘以祿士，以為間田。縣內，夏時天子所居州界名也。殷曰畿，《詩·殷頌》曰：“邦畿千里，維民所止。”周亦曰畿，畿內大國九者，三公之田三，為有致仕者副之為六也，其餘三，待封王之子弟。次國二十一者，卿之田六，亦為有致仕者副之為十二，又三為三孤之田，其餘六，亦待封王之子弟。小國六十三，大夫之田二十七，亦為有致仕者副之為五十四，其餘九，亦以待封王之子弟。三孤之田不副者，以其無職，佐公論道耳，雖有致仕，猶可即而謀焉。朌讀為班。○朌音班，賦也。" }
      - { type: z, text: "“天子”至“間田”。○正義曰：此經明天子縣內之國數多少及祿士之法。按殷之與周稱，畿唐虞稱服，無雲縣者，今此特雲縣內，故鄭雲“夏時天子所居州界名也”。按鄭注《益稷》雲“禹會諸侯於塗山，執玉帛者萬國，四百國在畿內”。今此畿內惟有九十三國者，蓋夏之一代畿內稱縣，當夏禹之初有四百國，至夏之末，土地既鹹，故與禹世不同，未知於時縣內國數多少，湯承夏末之後，製為九十三國。記者言縣，明其承夏之餘，國數是殷湯之制，故與四百國不同也。“名山大澤不以朌”者，畿外列土諸侯有封建之義，故云不以封；畿內之臣，既不世位，有朌賜之義，故云不以朌。所以不朌者，亦為與民共財，不障管也。雖不障民，取其財物，亦入之王府，即《周禮》山虞、澤虞所掌是也。“其餘以祿士，以為間田”者，謂九十三國之餘，則下文雲“其餘方百里者六十四，方十里者九十六”是也。以九十一國以封公卿大夫，故特雲以祿士。其實公卿之子，父死之後，既不世爵，得食父祿，故下文雲“大夫不世爵”，“未賜爵，視天子之元士，以君其國”，是九十三國之外，既雲視元士，則此祿士包之也。其不封公卿大夫及祿士之外，併為間田，則《周禮》雲“公邑也”。不雲附庸者，以縣內無附庸也。所以畿外州建二百一十國之外，則間田少，畿內立九十三國之外間田多者，以畿外諸侯有大功德，始有附庸，故間田少，畿內每須朌賜，故間田多。依《周禮》，間田自二百里之外，以至五百里，其大夫則於三百里為采地，卿則於四百里為采地，公則於五百里為采地，故《載師》雲“以公邑之田任甸地，以家邑之田任稍地，以小都之田任縣地，以大都之田任畺地”是也。未知殷制如甸？其周之畿內采邑大小未聞，則鄭注《小司徒》雲“百里之國凡四都”，“五十里之國凡四縣”，“二十五里之國凡四甸”，是謂畿內大國百里，次國五十里，小國二十五里。又注《大司徒》雲“畿內之制未聞”，是知疑而不定。此雲祿士，謂無地之士，給之以地而當其祿，不得為采邑耳。其實春秋之時，公卿亦有無地者，故《春秋》經劉子、單子，是有地者稱爵；“王子虎卒”，是無地者不稱爵也。○注“詩殷”至“謀焉”。○正義曰：引《詩·殷頌》者，是《玄鳥》“祀高宗”之篇，證殷稱畿也。雲“周亦曰畿”者，《周禮·職方》雲“千里曰王畿”是也。雲“為有致仕者副之”者，以三公在朝，既有正田，今身既致仕，不可仍食三公采邑，身又見存，不可全無其地，故公卿大夫皆有正職之田，又有致仕副邑。雲“其餘三，待封王之子弟”者，《禮運》雲“天子有田，以處其子孫”。又《周禮》有都宗人、家宗人祭祀，皆致福於王，是有封王之子弟也。但王之子弟有同毋異毋有親疏之異，親寵者封之與三公同，平常者與六卿同，疏遠者與大夫同，故有三等之差也。雲“三孤之田不副”者，自上差之，三公之外，其餘有三；卿之外，其餘有六；大夫之外，其餘有九，皆以次相三。若三孤有致仕之副，則卿與公同，其餘三，非差次也。雲“以其無職，佐公論道耳。雖其致仕，猶可即而謀焉”者，按《周禮》三公雖無正職，猶列於官，參六卿之事，故《司徒》雲“鄉老二鄉，則公一人”。三孤則不列於官，故云無職，但佐公論道，在朝在家，其事一等，雖退致仕，猶可就而謀事，不須致仕之後，朝上更別立官，故知不有致仕之副。" }
      - { type: j, text: "凡九州，千七百七十三國。天子之元士，諸侯之附庸，不與。不與，不在數中也。《春秋傳》雲：“禹會諸侯於塗山，執玉帛者萬國。”言執玉帛，則是惟謂中國耳。中國而言萬國，則是諸侯之地有方百里，有方七十里，有方五十里者，禹承堯舜而然矣。要服之內，地方七千裏，乃能容之。夏末既衰，夷狄內侵，諸侯相併，土地減，國數少。殷湯承之，更制中國方三千里之界，亦分為九州，而建此千七百七十三國焉。周公復唐虞之舊域，分其五服為九，其要服之內，亦方七千裏，而因殷諸侯之數廣其土，增其爵耳。《孝經說》曰：“周千八百諸侯，佈列五千裏內。”此文改周之法，關盛衰之中，三七之間以為說也。終此說之意，五五二十五，方千里者二十五，其一為畿內，餘二十四州，各有方千里者三，其餘諸侯之地，大小則未得而聞。○與音預，注及下注“不與”同。塗音徒。要，一遙反，下“要服”皆同。並，必政反，又如字。減，古斬反。關盛衰，並讀如字。" }
      - { type: z, text: "“凡九”至“不與”。正義曰：此一節總明殷之畿內畿外國數之法。前文雲“凡四海之內”，明殷之畿外諸侯。次經明天子縣內殷之畿內國數。此經總明殷之畿內畿外，故云“凡九州，千七百七十三國”。天子之元士、諸侯之附庸不在數中，故云“不與”。商王大計地方三千里，畿外八州，每一州二百一十國，封爵三等，八州一千六百八十國，並王畿內九十三國，計千七百七十三國。“天子之元士”，則下雲“方百里者六十”，四方十里者九十六”，是天子之元士。又下雲“其餘方百里者十，方十里者六十”，是諸侯附庸，不在千七百七十三之數。○注“春秋”至“而聞”。○正義曰：引《春秋傳》者，哀七年《左傳》文。時魯欲伐邾，孟孫不欲，諸大夫答孟孫雲：“禹會諸侯於塗山，執玉帛者萬國，今其存者無數十焉。”又襄二十五年傳雲：“若無侵小，何以至焉？”杜預雲：“塗山在壽春東北，與會稽別也。”若鄭康成之意，塗山則會稽也，故注《尚書》雲“禹朝群臣於會稽，執玉帛者萬國”。是以張逸疑而問鄭：“按《左傳》‘禹會諸侯於塗山，執玉帛者萬國’，《外傳》雲‘禹朝群臣於會稽，防風氏後至’，不與注相應何？”鄭答雲“欲明諸侯守土之祀，故兼用《外傳》、《內傳》語”者，鄭意以塗山、會稽為一，以諸侯為守土之祀，故云“禹朝群臣，群臣則諸侯也”。鄭雲“兼用《外傳》、《內傳》語”者，“禹朝群臣於會稽”，是《外傳》語；“執玉帛者萬國”，是《內傳左氏》語。雲“言執玉帛，則是惟謂中國耳”者，按《覲禮》諸侯享王璧以帛，是執玉帛也。按《大行人》侯、甸、男、採、衛、要，各以其服貢物，下雲“九州之外謂之蕃國，各以其所貴寶為摯”，鄭注貴寶，若白狼白鹿，夷狄不執玉帛，故云“執玉帛惟謂中國耳”。雲“中國而言萬國，則是諸侯之地有方百里，有方七十里，有方五十里”者，鄭言此者，以周之大國方五百里而下，則不得有萬國，故云然也。按萬國之數，鄭注《皋陶謨》：“堯初制五服，更五百里，禹所弼每服五百里，故始有百里之封焉。猶用要服之內為九州，州立十二人為諸侯師，蓋百國一師，則州十有二師，則每州千二百國也。八州九千六百國，其餘四百國在畿內。”鄭又云：“百里者三，封國七有奇。所以百里三封國七者，以百里之方一，為公侯之國一；又以百里之方一，為伯七十里之國二；又以百里之方一，為子男五十里之國四。”是百里之方三封國七也。言有奇者，謂百里之方一，封七十里之國二。有奇者，以百里之方一，為十里之方百，七十里之國一，用十里之方四十九，七十里之國二，用十里之方九十八，餘有十里之方二，故云有奇。以此計之，州有千里之方六，以千里之方二為公侯之國二百，又以千里之方二為伯七十里之國四百有奇，又以千里之方二為子男五十里之國八百，總為一千四百國。以二百國及奇餘為附庸山澤，故州有千二百國。鄭雲“四百國在畿內”者，以大略據子男為言，非實法也。趙商不達鄭旨，而問鄭雲：“以《王制》論之，畿內之國有百里，有七十里，有五十里。今率以下等計之，又有王城關遂郊郭，卿大夫之采地，數不在中。今就四百，似頗不合。鄭答之雲：“三代異物，《王制》之法，唐虞或不盡然。堯舜之德，守在四疆，鄉遂有無，無以言也。公卿大夫有田祿者，其四百國，非采地為何？王城之大，郊關之處幾何？而子責急也。此鄭亦隨問而答，非事實也。必知非實者，以地形不可方平如圖，又有山澤不封之地，何有同積釭無空缺之處？故知略計地為四百國耳。雲“禹承堯舜而然矣”者，以堯未遭洪水之前，帝德寬廣，不制以法，故中國五千。禹因治水之後，德化漸大，故中國更廣，而有萬國。雲“要服之內，地方七千，裏乃能容之”者，王畿內五百里，又五百里外侯服，去城外五百里是一千里。又五百里甸服，是一千五百里。又五百里男服，是二千里。又五百里採服，是二千五百里。又五百里衛服，是三千里。又五百里為要服，是三千五百里。要服去王畿三千五百里，四面相距為七千裏，是九州之內，此雲要服之內，地方七千裏也。按《尚書·咎繇》注：“禹弼成五服，去王城五百里曰甸服。其弼當侯服，去王城千里。其外五百里為侯服，當甸服，去王城一千五百里。其弼當男服，去王城二千里。又其外五百里為綏服，當採服，去王城二千五百里。其弼當衛服，去王城三千里。又其外五百里為要服，與周要服相當，去王城三千五百里。四面相距為七千裏，是九州之內也。”故此雲要服之內，地方七千裏。《咎繇》注又云：“要服之弼，當其夷服，去王城當四千裏。又其外五百里曰荒服，當鎮服，其弼當蕃服，去王城五千裏。四面相距，為方萬里也。”雲“夏末既衰，夷狄內侵，諸侯相併，土地減，國數少”者，以湯承於夏末，中國惟方三千里，明所因有漸，承夏末之地。上雲“天子縣內”，是夏末殷初，其界相似也。必知此《王制》之文以為殷制者，正以百里、七十里、五十里之國與周不同，又千七百七十三國與禹萬國數復異。又虞夏及周皆曰牧，此經稱伯，故知大略皆據殷而言也。其天子七廟，及下雜論虞夏商周四代之制，亦兼載焉。雲“周公復唐虞之舊域，分其五服為九，其要服之內，亦方七千裏”者，言復唐虞舊域，謂治水之後舊域也。按《周禮·職方》雲：“方千里曰王畿，其外方五百里曰侯服，又其外方五百里曰甸服，又其外方五百里曰男服，又其外方五百里曰採服，又其外方五百里曰衛服，又其外方五百里曰蠻服，又其外方五百里曰夷服，又其外方五百里曰鎮服，又其外方五百里曰藩服。”蠻服則要服。是分其五服為九，以要服之內方七千裏也。雲“因殷諸侯之數，廣其土，增其爵耳”者，按《洛誥》傳雲“天下諸侯之來，進受命於周，退見文武屍者，千七百七十三諸侯”，其數與此同，是周因殷諸侯之數也。按《大司徒》公五百里，侯四百里，與此公侯百里不同，是廣其土也。殷爵三等，周爵五等，是增其爵耳。雲“《孝經說》曰‘周千八百諸侯，佈列五千裏內’”者，此《孝經緯》文。雲“千八百”者，舉成數，其實亦千七百七十三諸侯也，佈列在中國五千裏之內。雲“此文改周之法，關盛衰之中，三七之間以為說也”者，此文謂此《孝經緯》文。改周之法，謂改周公盛時之法，盛謂地方七千裏，衰謂地方三千里，故云“關盛衰之中，三七之間”。若指文言之，盛謂周公制禮太平時也，衰謂夏末殷初之時也。盛衰之中，謂武王時也。若以當代言之，衰謂週末幽、厲之時，與夏末同。盛衰之中，謂昭王、恭王之時，與武王同。雲“終此說之意”者，謂終竟此《孝經緯》所說之意。雲“其餘諸侯之地，大小則未得而聞”者，謂一州之內，千里之方有三，而一州建二百一十國，但未知國之大小及封建制度，故云未聞。《異義》：“《公羊》說‘殷三千諸侯，周千八百諸侯’。《古春秋左氏傳》說‘禹會諸侯於塗山，執玉帛者萬國’。唐虞之地萬里，容百里地萬國。其侯伯七十里，子男五十里，餘為天子間田。許慎謹按：《易》曰：‘萬國咸寧。’《尚書》雲：‘協和萬邦。’”從《左氏》說。鄭駮之雲：“而諸侯多少，異世不同。萬國者，謂唐虞之制也。武王伐紂，三分有二，八百諸侯，則殷末諸侯千二二百也。至周公制禮之後，準《王制》千七百七十三國，而言周千八百者，舉其全數。”又《異義》：“《今尚書》歐陽夏侯說‘中國方五千裏’，《古尚書》說‘五服旁五千裏，相距萬里’。許慎謹按：以今漢地考之，自黑水至東海，衡山之陽至於朔方，經略萬里。”從《古尚書》說‘鄭氏無駮，與許同。按《易·下系》雲：“一君二民，君子之道。二君一民，小人之道。”鄭注：“一君二民，謂黃帝堯舜，謂地方萬里為方千里者百，中國之民居七千裏，七七四十九，方千里者四十九。夷狄之民居千里者五十一，是中國夷狄，二民共事一君。二君一民，謂三代之末，以地方五千裏，一君有五千裏之土，五五二十五，更足以一君二十五，始滿千里之方五十，乃當堯舜一民之地，故云二君一民。”實無此二君一民，假之以地廣狹為優劣也。" }
      - { type: j, text: "天子，百里之內以共官，千里之內以為御。謂此地之田稅所給也。官謂其文書財用也。御謂衣食。○共音恭。" }
      - { type: z, text: "“天子”至“為御”。○正義曰：此一節論畿內千里之地田稅所共給之事。○注“謂此”至“衣食”。○正義曰：經雲“百里之內”者，謂去王城百里，四面相距則二百里。經雲“千里之內以為御”者，謂四面相距為千里，去王城四面五百里，二者相互。雲“此地之田稅所給也”者，依《周禮》有口率出泉，恐此是口率之泉，故云“此地之田稅所給也”。知非口率出泉所給者，按《周禮》大府九賦之泉，各有所給，故其職雲“關市之賦，以醋荃之膳服。邦中之賦，以待賓客。四郊之賦，以待稍秣。家削之賦，以待匪頒。邦甸之賦，以待工事。邦縣之賦，以待幣帛。邦都之賦，以待祭祀。山澤之賦，以待喪紀。幣餘之賦，以待賜予”，是口率出泉，各有所用也。知“官謂其文書財用也”者，以其稱官，是官府所須，故為文書財用。御是進御所須，故為衣食。但官卑褻，故用近物；御為尊重，故用遠物，此為殷法也。但未知有口率出泉以否。" }
      - { type: j, text: "千里之外設方伯，五國以為屬，屬有長。十國以為連，連有帥。三十國以為卒，卒有正。二百一十國以為州，州有伯。屬、連、卒、州，猶聚也。伯、帥、正，亦長也。凡長皆因賢侯為之。殷之州長曰伯，虞夏及周皆曰牧。○帥，色類反，注及下同。卒，子忽反，下及注同。牧音木。八州八伯，五十六正，百六十八帥，三百三十六長。八伯各以其屬，屬於天子之老二人，分天下以為左右，曰二伯。老謂上公。《周禮》曰：“九命作伯。”《春秋傳》曰：“自陝以東，周公主之。自陝以西，召公主之。”○陝，失冉反，一音古洽反。召，詩照反。" }
      - { type: z, text: "“千里”至“二伯”。○正義曰：此一節論千里之外設方伯及連帥卒正兼二伯之事，各隨文解之。○注“屬連”至“曰牧”。○正義曰：屬是系屬，連是連接，卒是卒伍，州是聚居，故云“屬、連、卒、州，猶聚也”。伯、帥、正俱是長，但異其名。雲“凡長皆因賢侯為之”者，既長諸侯，非賢不可，故知賢侯為之。言因者，因其州內賢侯，非州外別取州牧，則知以賢侯為之，故下《曲禮》以侯為牧。周制牧下有二伯，則侯伯皆得為之，故《詩·旄丘》“責衛伯也”。衛是侯爵，而為州伯。張逸疑而問鄭，鄭答雲：“侯德適任之，謂衛侯之德，適可任州伯也。”然則伯之賢者，亦可進為牧，故《周禮·宗伯》“八命作牧”，注云“謂侯伯有功德者，加命得專征伐，是伯得為牧也”。鄭必知州牧之下，更有二伯者，以《左傳》雲五侯九伯，服、杜皆為五等諸侯，九州之伯。《鄭志》雲：“若徵五等諸侯九州之伯，何夾輔之有？大公為王官伯，分主自陝以東，不可分為四侯半，故稱五侯。四州有八伯，畿內有一伯，故為九伯也。”按《鄭志》注《尚書》為八伯，張逸問雲：“九州而八伯者何？”鄭答雲：“畿內之州不置伯，有鄉遂之吏主之。”伯即牧也。故《周禮·大宰》雲“施典於邦國，建其牧，立其監”，是畿外邦國有牧，畿內不置也。畿內既不置牧，則應無牧下之伯。而立五侯九伯，畿內有一伯者，但比擬畿外應有而言之，其實無也。州長既用賢侯為之，則卒正、連帥、屬長，節級用伯、子、男賢者而為之。鄭注《曲禮》雲“二王之後不為牧”，則殷亦當然。殷既亦有連、屬、卒等，則周亦然也。故《詩·旄丘》責衛伯不能修方伯連率之職是也。雲“虞夏及周皆曰牧”者，按《尚書·舜典》雲“覲四嶽群牧”，又云“諮十有二牧“，是虞稱牧也。虞雖稱牧，亦稱伯，故《書傳》雲“惟元祀，巡此四嶽八伯”。按《左傳》宣三年雲夏之方有德也，貢金九牧”，是夏稱牧也。《大宰》雲“建其牧”，是周稱牧也。故云“虞夏及周皆曰牧”。○注“周禮”至“主之”。○正義曰：“九命作伯”，《大宗伯職》文。“《春秋傳》曰”以下，《春秋》隱五年公羊傳文。故傳雲“三公者何？天子之相也。自陝而東者，周公主之。自陝而西者，召公主之，一相處乎內”是也。" }
      - { type: j, text: "千里之內曰甸。服治田，出穀稅。○甸，大薦反。千里之外曰採，九州之內地，取其美物，以當穀稅。○採，蒼改反。當，丁浪反，又如字。曰流。謂九州之外也，夷狄流移，或貢或不。《禹貢》荒服之外，“三百里蠻，二百里流”。○蠻，莫還反。" }
      - { type: z, text: "“千里”至“曰流”。○正義曰：此一節總論畿內畿外九州治田及採取美物，並九州之外或貢或否之事，各隨文解之。○注“服治”至“穀稅”。○正義曰：定本直雲“服治田，出穀稅”，無甸字。知甸是服治田出穀稅者，按《禹貢》“五百里曰甸服”，下又云“百里賦納總，二百里納銍”，及秸、粟、米之等，是甸為治田也。○注“九州”至“穀稅”。○正義曰：經雲“千里之外曰採”，謂規方千里之外，若於王城五百里之外，以殷制言之，中國方三千里，而面別去王城千五百里。今五百里以為畿內，千里之外，惟千里耳。採取美物，故言曰採。周則王畿之外，面別三千里，採取美物，則《大行人》侯服其貢祀物，甸服其貢嬪物，男服其貢器物，採服其貢服物，衛服其貢材物，要服其貢貨物是也。○注“謂九”至“裏流”。○正義曰：流謂九州之外，或貢或否，流移不定。殷則面別千五百里之外，二千五百里之內，謂之為流。週三千五百里之外，五千裏之內為流也。" }
      - { type: j, text: "天子三公、九卿、二十七大夫、八十一元士。此夏制也。《明堂位》曰“夏后氏之官百”，舉成數也。" }
      - { type: z, text: "“天子”至“元士”。○正義曰：此一經論夏天子設公卿大夫元士之數。○注“此夏”至“數也”。○正義曰：以《周禮》，其官三百六十，此官百二十，故云夏制。以夏制不明，更引《明堂位》“夏后氏之官百”以證之，直雲百不雲百二十，故云“舉成數也”。《王制》之文，鄭皆以為殷法。此獨雲夏制者，以《明堂》殷官二百，與此百二十數不相當，故不得雲殷制也。記者，故雜記而言之，或舉夏，或舉殷也。" }
      - { type: j, text: "大國三卿，皆命於天子，下大夫五人，上士二十七人。○次國三卿，二卿命於天子，一卿命於其君，下大夫五人，上士二十七人。○小國二卿，皆命於其君，下大夫五人，上士二十七人。命於天子者，天子選用之，如今詔書除吏矣。小國亦三卿，一卿命於天子，二卿命於其君。此文似誤脫耳，或者欲見畿內之國二卿與？○選，宣戀反。見，賢遍反。與音餘。" }
      - { type: z, text: "“大國”至“七人”。○正義曰：此一節論夏家天子命諸侯之國卿、大夫及士之數。前既雲夏官，此亦夏禮。卿、大夫、士數，五等之國悉同，但大國三卿，並受命於天子也。夏之大國，謂公與侯也。殷、周大國，並公也。崔氏雲：“三卿者，依周制而言，謂立司徒兼冢宰之事，立司馬兼宗伯之事，立司空兼司寇之事。”故《春秋左傳》雲季孫為司徒，叔孫為司馬，孟孫為司空，此是三卿也。以此推之，故知諸侯不立冢宰、宗伯、司寇之官也。下大夫五人者，崔氏雲“三卿命於天子”，則大夫以下，皆其君自命之也。三卿，則上中下三品而含上下。今雲“下大夫五人”者，取卿為言耳。知大夫有上下者，按前雲次國之下卿，位當大國之上大夫是也。何以五人者？謂司徒之下，置小卿二人，一是小宰，一是小司徒。司空之下，亦置二小卿，一是小司寇，一是小司空也。司馬之下惟置一小卿，小司馬也。故《公羊》襄十一年“作三軍，三軍者何？三卿也”，“古者上卿下卿，上士下士”，何休雲“古者諸侯有司徒、司空，上卿各一，下卿各二。司馬事省，上下卿各一。若有軍事，上士相上卿，下士相下卿，足以為治”，今襄公乃益司馬，故云作三軍，逾王制，故譏之。下卿即大夫也，故此雲“下大夫五上，士二十七人”者，雲上士者，對府、史之屬也。《周禮》五等國悉三卿、五大夫、二十七士，皆與此同。但公國長有四命，孤一人，故《典命》雲“公之孤四命，以皮帛小國之君。其卿三命，其大夫再命，其士一命”，侯伯之卿、大夫、士亦如之。子男之卿再命，其大夫壹命，其士不命”。而鄭注再引《王制》，以成彼義。當恐周之人數，與《王制》同也。且《曾子問》是明當時周法，而云國家五官，則五大夫，大夫若五，則知餘亦不異也。且《曾宰》雲“施典於邦國”，“設其參，傅其伍”，鄭雲“參謂卿三人，伍謂大夫五人”。“次國三卿，二卿命於天子，一卿命於其君，下大夫五人，上士二十七人”者，次國者，夏則伯，殷則侯也，周則侯伯也。而卿、大夫、士之命及人之數，與大國同。但一卿其君自命為異也，下文備也。“小國二卿，皆命於其君，下大夫五人，上士二十七人”者，小國者，殷謂伯，夏、周同子男也。按鄭注言“小國亦三卿”，差次而言，應一卿命於天子，二卿命於其君。此惟言二卿，則似誤也。鄭何以得知應三卿？按前雲小國又有上中下三卿，位當大國之下大夫，若無三卿，何上中下之有乎？故知有三卿也。按《周禮》“三命受位”，鄭雲“謂此列國之卿，始有列位於王，為王之臣也”。若三命卿始得列位於王，則子男之卿再命，不應得一卿命於王。而鄭今雲一卿命於王者，謂子男之卿亦得王命。而彼注三命，下雲列國卿三命者，此自據侯伯為言，以會彼“三命受位”者耳。○注“或者”至“卿與”。正義曰：鄭又為一說，畿內之國，唯置二卿，並是其君自命之。今記者或欲因子男此文以見畿內之法，故舍去子男一卿命於王者，而不言也。" }
      - { type: j, text: "天子使其大夫為三監，監於方伯之國，國三人。使佐方伯領諸侯。○監，古蹔反。監於，古御反，卷末同。" }
      - { type: z, text: "“天子使其”至“三人”。○正義曰：此一節論天子遣大夫往監方伯之國，州別各置三人之事。“天子使其大夫”者，謂使在朝之大夫，往監於方伯，每一州輒三人，三八二十四人。崔氏雲：“此謂殷之方伯，皆有三人以輔之。佐其伯，謂監所領之諸侯也。”周則於牧下置二伯，亦或因殷使大夫為三監，故《燕禮》雲設諸公之坐，鄭雲公，孤也。大國孤公一人，而云諸公者，容牧有三監。然則天子於州牧之國，則置三大夫以輔之，其尊卑之差，則下文其祿視諸侯之卿，其爵視次國之君。其祿視諸侯之卿者，謂公之孤也，故《燕禮》謂之諸公，與公孤同也。《尚書》使管叔、蔡叔、霍叔為三監者，為武庚也。與此別也。" }
      - { type: j, text: "天子之縣內諸侯，祿也。選賢置之於位，其國之祿如諸侯，不得位。" }
      - { type: z, text: "“天子”至“祿也”。○正義曰：此一節論天子縣內食采邑諸侯得祿不得繼世之事。此言縣內，則夏法也。言諸侯祿者，得采國為祿而不繼世，故云祿也。故下雲“大夫不世爵”是也。此謂畿內公卿大夫之子，父死之後，得食父之故國采邑之地，不得繼父為公卿大夫也，故經直雲祿也。則子孫恆得食之，有罪乃奪之。此雲諸侯，下雲“大夫不世爵”，則諸侯總據大夫以上，而《司裘》“諸侯，則共熊侯、豹侯”，鄭注云“諸侯，謂三公及王子弟”。鄭惟據三公及王子弟者，以下別雲“卿大夫，則共麋侯”，故諸侯惟止三公及王子弟而已。此父死子祿者，不在九十三國之數。此雖論夏法，殷、周亦然。畿內諸侯，父死視元士，若有賢德，乃復父位。若畿外諸侯，父死未賜爵，亦視元士，除服則得襲父故位，故下文雲“未賜爵，視天子元士，以君其國”，注云“列國及縣內之國也”。必知列國未賜爵，亦視元士者，以《詩》雲“韎韐有奭，以作六師”，是諸侯世子未爵命，服士之韎韐之服是也。" }
      - { type: j, text: "外諸侯，嗣也。有功乃封之，使之世也。《冠禮記》曰：“繼世以立諸侯，象賢也。”○冠，古亂反。" }
      - { type: z, text: "“外諸侯，嗣也”。○正義曰：此一節論外諸侯父死子得嗣位之事。此畿外諸侯，世世象賢傳嗣其國也，故下雲“諸侯世子世國”。所以畿內諸侯不世爵，而畿外得世者，以畿內諸侯，則公卿大夫輔佐於王，非賢不可，故不世也。畿外諸侯嘗有大功，報其勞效，又在外少事故得世也。《異義》：“按《公羊》、《穀梁》說雲‘卿大夫世則權並一姓，妨塞賢路，經譏尹氏崔氏’是也。古《春秋左氏》說‘卿大夫得世祿不世位，父為大夫，死，子得食其故采地，如有賢才，則復父故位’。許慎謹按：《易》爻位三為三公，食舊德，謂食父故祿。《尚書》雲：‘世選爾勞’，《論語》雲‘興滅國，繼絕世’，《詩》雲‘凡周之士，不顯亦世’，《孟子》雲‘文王之治岐也，仕者世祿’。知周世祿也，從《左氏》義。鄭氏無駮，與許同。殷之大夫亦世祿，故《祭義》雲“殷人貴富而尚齒”，注云“臣能世祿曰富”是也。其諸侯之大夫，則下文雲不世爵祿，謂殷禮也。若周制，諸侯之大夫有功者，亦得世祿，故隱公八年“無駭卒”，《左傳》雲“官有世功，則有官族”。《論語》雲“管氏奪伯氏駢邑三百”，以無功而奪之。若有功則不奪也。" }
      - { type: j, text: "制：三公一命卷，若有加則賜也，不過九命。次國之君，不過七命。小國之君，不過五命。卷，俗讀也，其通則曰袞。三公八命矣，復加一命，則服龍袞，與王者之後同。多於此，則賜，非命服也。虞夏之制，天子服有日月星辰。《周禮》曰：“諸公之服，自袞冕而下，如王之服。”○命卷音袞，古本反。復，扶又反。冕音勉。" }
      - { type: z, text: "“制三”至“五命”。○正義曰：此一經論王制三公已下，次國小國之君爵命之數。制謂王者制度，言王者制度，三公八命，身著鷩冕，若加一命，則為上公，與王者之後齊同，而著袞冕，故云“一命卷”。“若有加則賜也”者，謂九命卷龍之外，依制不合有其服，若有加益者，則是君之特賜，非禮法之常也，則《雜記》謂之褒衣也。此則《禮緯》九賜之衣服也，與《宗伯》“再命受服”不同。此篇之作，皆是王者之制，而於此特言制者，以三公位尊，又加一命，其事極重，記者以其重，故特雲制也。“不過九命”，“不過七命”，“不過五命”者，此謂夏、殷之制也，亦與周同。○注“卷俗”至“之服”。○正義曰：《禮記》文皆作“卷”字，是記者承俗人之言，故云“卷，俗讀也”。雲“其通則曰袞”者，謂以通理正法言之，則曰袞，故《周禮·司服》及《覲禮》皆作袞，是禮之正經也，故云“其通則曰袞”。雲“虞夏之制，天子服有日月星辰”者，以此經雖以殷為主，亦雜記虞夏之事，故鄭引虞夏之制言之。按“有虞氏皇而祭之”下，注云“夏、殷未聞”，此雲“虞夏之制，天子服有日月星辰”者，此雲特謂虞舜與禹相接，事相關穿，故《尚書》堯舜禹之書謂之《虞》、《夏書》，伏生《書傳》有《虞夏傳》，以《皋陶謨》雲“予欲觀古人之象”，《皋陶謨》是虞夏之書，故云“虞夏之制”，其實虞也。下文有虞夏殷週四代並陳，故云“夏殷未聞”也。雲“《周禮》曰諸公之服，自皋冕而下，如王之服”者，是《司服》文。引之者，證三公一命袞。然則此經三公一命袞，謂周制也，故以周制解之。若周以前，則山在袞上，不得雲一命袞也。衣服之制，歷代不同。按《易·系辭》雲：“黃帝堯舜垂衣裳而天下治，蓋取諸乾坤。”玄衣法天，黃裳法地，故《易·坤·六五》“黃裳元吉”是也。衣裳從黃帝以來而有也。虞氏以來，其裳用纁，故下文歷陳虞夏殷周，注云“其服皆玄，上纁下裳”。用纁者，鄭注《易·下系辭》雲：“土記位南方，南方色赤，黃而兼赤，故為纁也。”按禮祭地，牲玉用黃，以放地色。裳既法地而用纁者，凡衣服著其身，有章採文物，以黃色太質，故用纁也。衣為天色玄，禮天牲玉用蒼者，以天色晝則蒼，夜則玄，衣不用蒼，亦以其太質故也。然祭天亦有牲用玄者，《尚書》及《論語》雲“敢用玄牡，敢昭告於皇皇后帝”是也。虞夏之制，天子祭服，自日月而下十有二章，故《尚書·皋陶》雲“予欲觀古人之象，日、月、星、辰、山、龍、華蟲，作會；宗彝、藻、火、粉米、黼、黻，絺繡”是也。日，一也。月，二也。星辰，三也。山，四也。龍，五也。華蟲，六也。此六者皆畫於衣，故言作會，以法於天。其數六者，法天之陽氣之六律也。宗彝，七也。藻，八也。火，九也。粉米，十也。黼，十一也。黻，十二也。此六者皆繡於裳，故云絺繡。絺，紩也。謂紩剌以為繡文，以法地之陰氣六呂也。按鄭注《司服》雲至周“登龍於山，登火於宗彝，尊其神明也”。龍取其神，火取其明。然則諸物各有所象，故說日月星辰取其明。山者，安靜養物，畫山者必兼畫山物，故《考工記》雲“山以章”。龍者，取其神化。龍是水物，畫龍必兼畫水，故《考工記》雲“水以龍”。華蟲者，謂雉也。取其文采，又性能耿介。必知華蟲是雉者，以《周禮》差之，而當鷩冕，故為雉也。雉是鳥類，其頸毛及尾似蛇，兼有細毛似獸，故《考工記》雲“鳥獸蛇”。此六者，以高遠在上，故畫於衣。宗彝者，謂宗廟彝尊之飾，有虎蜼二獸。虎有猛，蜼能闢害，故象之。不言虎蜼，而謂之宗彝者，取其美名。按《周禮》有六彝，有雞彝、鳥彝、斝彝、黃彝、虎彝、蜼彝。此直雲宗彝，知非雞彝、鳥、斝。黃必為虎、蜼者，按《明堂位》雲“夏后氏雞彝，殷以斝，周以黃目”。又《周禮》陳六尊六彝，皆遠代者在後，故六尊之次，犧、象、著、壺、大、山，大是虞氏之尊，山是夏後之尊。六彝之次，亦虎彝、蜼彝在後，故知虎、蜼，虞夏已飾於尊，但舜時已稱宗彝，不得有雞、斝之等，以周禮差之，而當毳冕，故知虎、蜼有毛之物也，虎、蜼淺毛細毳故也。藻者，取其絜清有文。火者，取其明照烹飪。粉米，取其絜白生養。黼謂斧也，取其決斷之義。黻謂兩已相背，取其善惡分辨。大意取象如此，而皇氏乃繁文曲說，橫生義例，恐非本旨。此是天子之服，其諸侯以下，未得而聞。按《皋陶謨》雲：“五服五章哉！”鄭注云：“五服，十二也、九也、七也、五也。三也。”如鄭之意，九者謂公侯之服，自山而下。七也是伯之服，自華蟲而下。五也謂子男之服，自藻而下。三也卿大夫之服，自粉米而下。與《孝經》注不同者，《孝經》舉其大綱，或雲《孝經》非鄭注。以上所云虞舜之制，而夏殷，注云未聞。至周則日月星辰畫於旌旗，又登龍於山，登火於宗彝，故注《司服》雲“王者相變，至周而以日月星辰畫於旌旗，所謂三辰旂旗，昭其明也。而冕服九章，初一曰龍，次二曰山，次三曰華蟲，次四曰火，次五曰宗彝，皆畫以為繢。六曰藻，次七曰粉米，次八曰黼，次九曰黻，皆希以為繡，則袞之衣五章，裳四章，凡九也。鷩之衣三章，裳四章，凡七也。毳之衣三章，裳二章，凡五也。希之衣一章，裳二章，凡三也。玄者衣無文，裳剌黻而已，是以謂玄焉”。鄭必知日月星辰畫於旌旗者，以《司服》王自袞冕而下，則袞服最尊，尚無日月星辰，故知日月星辰不在衣服，畫於旌旗也。知登龍於山者，依舊山在龍上。若不登龍，則袞冕不為最尊，故知登龍於山也。知登火於宗彝者，若不登火，則五章之服，自藻而下，不得稱為毳冕。若登火於宗彝之上，則五章自宗彝而下，與毳冕相當。然宗彝之下，有藻、火兩章，知不登藻，而必登火者，火有光明之盛。《春秋傳》雲“火龍黼黻”，《禮記》“殷火周龍章”，是火貴於藻也，故知登火不登藻。自九章而下，以次相差，故知袞之衣五章，鷩衣毳衣者三章，絺衣一章。衣法天，故章數奇。裳法地，章數偶。以下其數漸少，則裳上之章漸勝於衣，事勢須然，非有義意。皇氏每事曲為其說，恐理非也。衣章並畫，絺冕之衣獨繡者，以粉米地物養人，服之以祭社稷。又地祗並是陰類，故衣章亦繡也。周之衣服既無日月，而《郊特牲》雲“袞冕日月之章”者，謂魯禮也。魯以周公之故，袞冕亦日月之章。其周之天子所用祭服，則《司服》雲“王祀昊天上帝，則服大裘而冕，祀五帝亦如之。享先王則袞冕，享先公饗射則鷩冕，祀四望山川則毳冕，祭社稷五祀則希冕，祭群小祀則玄冕”。鄭司農雲：“大裘，羔裘也。”知羔裘者，以祭天至質，故知羔裘。以天色玄，謂黑羔裘。其六冕所祀，依冕之先後，祭神之尊卑，以袞冕之服華，故祭先王；以絺冕陰類，故祭社稷五祀；以玄冕質素，故祭群小祀。日月雖尊，以天神從質，故亦玄冕。故《玉藻》雲“天子玄端以朝日”，鄭注云“端當為冕”。其祭地之服無文。按《詩·昊天有成命》“郊祀天地也”，天地相對，則祭地亦用大裘，故《孝經援神契》雲“祭地之禮，與祭天同”，亦據衣服同也。又有皮弁以日視朝，韋弁以即戎，冠弁以田獵，故《司服》雲“凡兵事韋弁服”，注云“韋弁，以韎韋為弁，又以為衣裳”。《詩·采芑》注云“韋弁服，朱衣裳”，則韎，韋也，其事同。鄭志又以韋弁為素裳，未知孰是。《司服》又云：“眡朝，則皮弁服。”鄭注云：“視朝，視內外朝之事。皮弁之服，十五升白布衣，積素以為裳。王受諸侯朝覲於廟，則袞冕。”其皮弁又以燕諸公，故《詩》雲“有頍者弁”，注云“弁，皮弁”，詩人責王不以皮弁燕諸公，此則朝服燕也。又以食，故《玉藻》雲“皮弁以日視朝，遂以食”。又郊祭之前服之，以聽祭報，故《郊特牲》雲“皮弁以聽祭報”。又著以舞大夏，故《明堂位》雲“皮弁素積，以舞大夏”。雖是魯禮，王所同之。其賓射燕射時，亦皮弁也。知者，按《射人職》賓射在朝，故知用朝服也。《燕禮記》雲“燕朝服於寢”，明天子燕亦以朝服，故知賓射燕射亦皮弁也。《司服》又云“凡甸，冠弁服”，注云“甸，田獵也。冠弁，委貌。其服緇布衣，亦積素以為裳”，“王卒食而居則玄端”。此玄端亦緇衣朱裳，故《玉藻》注云“天子諸侯，玄端朱裳”。謂之端者，已外之服，其袂三尺三寸，其袪尺八寸，其玄端則二尺二寸，祛尺二寸。端，正也。以幅廣二尺二寸，袂廣二尺二寸，與之正方，故云玄端也。哭諸侯則爵弁，故《檀弓》雲“天子之哭諸侯也，爵弁紂衣”。爵弁者，加爵頭色。又有素服，凶荒則服之，故《司服》雲“大札、大荒、大災，素服”。其衣服首飾大裘之冕，其冕無旒，故注《弁師》雲“冕服有六，而言五冕者，大裘之冕，蓋無旒，不聯數也“。凡冕之制，皆玄上纁下，故注《弁師》雲“皆玄覆朱里”。師說以木版為中，以三十升玄布衣之於上，謂之延也。以朱為裏，但不知用布繒耳。當應以繒為之，以其前後旒用絲故也。按《漢禮器制度》廣八寸，長尺六寸也。又董巴《輿服志》雲：“廣七寸，長尺二寸。”皇氏謂此為諸侯之冕，應劭《漢官儀》廣七寸，長八寸，皇氏以為卿大夫之冕服也。若如皇氏言，豈董巴專記諸侯，應劭專記卿大夫？蓋冕隨代變異，大小不同。今依《漢禮器制度》為定也。今天子五冕之旒，皆用五采之絲為旒，垂五采之玉，故《弁師》雲“掌王之五冕”，五采繅，十有二就，皆五采玉十有二“，鄭注云“每就間蓋一寸，旒別有五采玉十有二。袞冕，故前後各十二旒，用玉二百八十八。鷩冕九旒，用玉二百一十六。毳冕七旒，用玉一百六十八。絺冕五旒，用玉百二十。玄冕三旒，用玉七十二”。皮弁縫中亦五采玉十二，故《弁師》雲“王之皮弁，會五采玉璂”，鄭注云“會，縫中也”，“縫中，每貫結五采玉十二以為飾”。韋弁亦然，故《弁師》雲“諸侯及孤卿大夫之冕，韋弁皮弁，弁絰各以其等為之”，則知天子韋弁與皮弁同也。其冠弁亦與皮弁同，故注《弁師》雲“不言冠弁，冠弁兼於韋弁皮弁矣”。自此以前，皆王者之服。祭服則以衣名冕，象上古先有衣後有冕。皮弁以下，則以弁名衣。餘服既輕，舉為重故也。其諸侯以下，則《司服》雲：公之服自鷩冕而下，侯伯之服白鷩冕而下，子男之服自毳冕而下，孤之服自希冕而下，卿大夫之服自玄冕而下，士之服自皮弁而下，公之袞冕數與王同，其就數則異。故鄭注《覲禮》雲“上公袞無升龍”，其旒則九，不十二也。其三公，《司服》無文。按《射人》三公執璧與子男同，則服毳冕也。凡此諸侯所著之服，皆為助祭於王，若助王祭天地，及祭先王大祀之等，皆服已上之服。若其從王祭祀小祀，雖有應著上服，皆逐王所著之服，不得逾王也。自在國祭其先君，則皆玄冕，故《玉藻》雲“諸侯玄端以祭”，鄭雲“端當為冕”。其二王之後，祭受命之王，各服已上之服，其自祭餘廟與諸侯同。有孤之國，其孤則絺冕，卿大夫玄冕，士爵弁，此皆謂助君祭服也。無孤之國，卿絺冕，大夫玄冕，以注《玉藻》雲“諸侯之臣，皆分為三等：其夫卿也，則服鞠衣；其夫大夫，則服襢衣；其夫士，則服禒衣”。以此言之，卿絺冕，大夫玄冕，士爵弁也，此服皆謂助祭君也。若其自祭，則皆降焉。諸侯士則玄端，大夫則朝服，故《儀禮·特牲》士祭玄端，《少牢》，上大夫祭朝服，公之孤爵弁以自祭。故《雜記》雲“大夫冕而祭於公，弁而祭於已。士弁而祭於公，冠而祭於已”。鄭注云“爵弁而祭於已，唯孤爾”，其天子卿大夫則無文。諸侯當玄冕以祭，其孤卿之等當爵弁也，大夫則皮弁。知者，以諸侯大夫朝服自祭，故知天子大夫亦用朝服自祭，朝服則皮弁，故鄭注《玉藻》雲“四命以上，齊祭異冠”。按《玉藻》雲：“玄冠丹組纓，諸侯之齊冠也。”諸侯既用玄冠而齊，則孤卿大夫以下並用玄冠齊也。諸侯玄冕而祭，天子孤卿及公之孤卿爵弁而祭，天子大夫皮弁而祭之，皆與齊時玄冠不同，故云“四命以上，齊祭異冠”。其三命以下玄冠齊、玄冠祭，是齊、祭同冠。其諸侯則皮弁以視朔，朝服以視朝，韋弁以即戎，與天子同。諸侯田獵亦用韋弁，故《左傳》衛獻公射鴻於囿，不釋皮冠而與孫林父言；又昭十二年“楚子狩於州來”，皮冠豹舄。諸侯又以皮弁受聘享，故《聘禮》“公皮弁”。天子諸侯亦以玄端燕居，故《玉藻》注云“天子諸侯，玄端朱裳”是也。諸侯亦以朝服食，夕則深衣，故《玉藻》雲“朝服以食”，“夕深衣，祭牢肉”。又大祥之祭服朝服，故《喪服小記》“除成喪者，其祭也朝服縞冠”，大祥以後則麻衣。麻衣，則白布深衣也，但緣之以布耳。又有長衣，遭喪權時所服，故《聘禮》雲“主國之喪，主人長衣待賓”是也。其長衣制與深衣同，但緣之以素，長衣之袂稍長，故《玉藻》注云“長衣中衣，繼揜尺，深衣則緣而已”。其中衣制如長衣，在上服之，自天子以下皆有。若祭服中衣用素，故《詩》雲“素衣朱襮”。其他服中衣用布，故《玉藻》雲“以帛里布，非禮也”。其天子卿大夫士，以皮弁為朝服，諸侯卿大夫士，以玄冠緇衣素裳為朝服。凡在朝，君臣上下同服，但士服則謂之玄端，袂廣二尺二寸故也。其大夫以上則皆侈袂，袂三尺三寸故也。其大夫以上所論玄端者，皆其制與士同。其大夫士，按《玉藻》雲“朝玄端，夕深衣”。其大祥朝服及既祥麻衣，並與諸侯同。天子祥禫，其服無文，或亦與諸侯無異。其首飾，諸侯皆以三採為藻，垂三採之玉，公袞冕九旒，鷩冕七旒，毳冕五旒，絺冕三旒，玄冕蓋無旒，旒皆九玉。侯伯鷩冕七旒，以下與公同，旒皆七玉。子男毳冕五旒，以下與公同，旒皆五玉。若熊氏之義，公以下諸冕，其旒並依命數不減，其韋弁、皮弁、冠弁縫中之玉，各依命數，玉皆三採，朱、白、蒼也。孤絺冕而下，其旒及玉皆二採，朱綠各依命數。其皮弁、韋弁、冠弁，玉亦二採，各依其命數。其一命大夫玄冕，及士則爵弁，皆無旒。知諸侯以下首飾藻旒玉數如此者，按《弁師》雲“諸侯及孤卿大夫之冕，韋弁皮弁，各以其等為之”，故鄭注云“繅斿玉璂，如其命數也。冕則侯伯繅七就，用玉九十八；子男繅五就，用玉五十，繅玉皆三採；孤繅四就，用玉三十二；命之卿繅三就，用玉十八；再命之大夫繅再就，用玉八，藻玉皆朱綠。韋弁皮弁，則侯伯璂飾七，子男璂飾五，玉亦三採；孤則璂飾四，三命之卿璂飾三，再命之大夫璂飾二，玉亦二採；一命之大夫冕而無斿，士變冕為爵弁。其韋弁皮弁之會，無結飾”，“不言冠弁，冠弁兼於韋弁皮矣”是也。" }
      - { type: j, text: "大國之卿，不過三命，下卿再命。小國之卿與下大夫一命。不著次國之卿者，以大國之下互明之。此卿命則異，大夫皆同。《周禮》公侯伯之卿三命，其大夫再命，子男之卿再命，其大夫一命。" }
      - { type: z, text: "“大國”至“一命”。○正義曰：此一節論大國小國卿大夫命數多少不同之事。○注“不著”至“一命”。○正義曰：經直雲大國之卿及小國之卿，不雲次國，故云“不著次國之卿”。雲“以大國之下互明之”者，以大國之卿不過三命，則知次國之卿不過再命，大國下卿再命，則知次國下卿一命，故云“互明之”。雲“此卿命則異“者，以大國上卿三命，下卿再命，次國上卿再命，下卿一命，小國上下卿並皆一命，故云“卿命則異”。雲“大夫皆同”者，謂大國次國小國，大夫皆同一命。今經雲“小國之卿與下大夫一命”，既與小國連文，知非直據小國。下大夫一命者，以經雲大國“下卿再命”，以次差之，明大夫一命，自然次國大夫亦一命，故云“大夫皆同”。此夏、殷制也。按《周禮》雲“公國之孤四命”，與餘卿不同，則知此大國之卿不過三命，亦謂孤也。大國下卿再命者，謂除孤以外之卿，就再命之中，分為中卿、下卿也，故前文雲“次國之上卿，位當大國之中”是也。次國之卿再命，亦謂上卿執政者，若魯之季孫。下卿一命，亦分為中下二等，故前文雲“中當其下，下當其上大夫”是也。小國之卿雖同一命，亦分為三等，故前文雲“次國之上卿，位當大國之下卿，中當其上大夫，下當其下大夫”。其大國次國小國，大夫雖同一命，當皆分為上下二等，文已具於上。今總雲下大夫者，對卿言之。雲“《周禮》公侯伯之卿三命”以下者，皆《周禮·典命》文。以經雲“大國之卿不過三命”，故引公侯伯之卿三命以對之。《周禮》“公之孤四命”，不與三命相當，故不引之也。" }
      - { type: j, text: "凡官民材，必先論之。論，謂考其德行道藝。○行，下孟反。論辨，然後使之。辨，謂考問得其定也。《易》曰：“問以辨之。”任事，然後爵之。爵，謂正其秩次。○任，而鴆反。位定，然後祿之。與之以常食。○與如字，又音預。" }
      - { type: z, text: "“凡官”至“祿之”。○正義曰：此一節論擇賢材任以爵祿之事，各隨文解之。○注“辨謂”至“辨之”。○正義曰：“辨，謂考問得其定也”者，謂官其人，必先論量德行道藝。今論量考問，事已分辨，得其定實，故云“辨，謂考問得其定也”。引《易》曰“問以辨之”，是《易·文言》文。○“任事然後爵之”。○正義曰：“爵，謂正其秩次”，言雖考問，知其實有德行道藝，未明其幹能，故試任以事事，事又幹了，然後正其秩次。除授位定，然後與之以祿。" }
      - { type: j, text: "爵人於朝，與士共之。刑人於市，與眾棄之。必共之者，所以審慎之也。《書》曰：“克明德慎罰。”是故公家不畜刑人，大夫弗養，士遇之塗，弗與言也。屏之四方，唯其所之，不及以政，亦弗故生也。屏猶放去也。已施刑則放之棄之，役賦不與，亦不授之以田，睏乏又無周餼也。《虞書》曰“五流有宅，五宅三居”是也。周則墨者使守門，劓者使守關，宮者使守內，刖者使守囿，髡者使守積。○畜，許六反。塗音徒，本又作塗。屏，必政反。去，羌呂反。賙音周。餼，許既反。有宅，王肅注《尚書》如字，鄭音知嫁反，懲艾也，下同。劓，魚氣反。刖，五刮反，又音月。囿音又。髡，五忽反，本又作完，音同，徐戶官反。積，子智反。" }
      - { type: z, text: "“爵人”至“生也”。○正義曰：此一節論爵人及刑人之事，各依文解之。此雲“爵人於朝”，謂殷法也。周則天子特假祖廟而拜授之，故《洛誥》雲“烝祭歲，文王騂牛一，武王騂牛一”，時冊命周公，故特祭文、武。若諸侯爵人，因嘗祭之日，故《祭統》雲“祭之日一獻，君降立於阼階之南，南鄉，所命北面”是也。“刑人於市，與眾棄之”者，亦謂殷法，謂貴賤皆刑於市，周則有爵者刑於甸師氏也。“是故公家不畜刑人”者，既與眾棄之，以是之故，天子諸侯之家不畜刑人也。大夫不得育養，士遇刑人於塗，弗與言也，謂逢遇於途，不與之言。“屏之四方，惟其所之”者，屏猶放去也，謂已施刑暴，故放逐棄去，使鄉四方，量其罪之輕重，合所之適處而居之。既是罪人被放，不幹及以政教之事，謂不以王政賦役驅使，非但不使，意在亦不欲使生，睏乏又無周餼，直放之化外，任其自死自生也。○注“役賦”至“守積”。○正義曰：“役賦不與“，謂役賦之事，不幹與於刑人，解經“不及以政”。雲“亦不授之以田，睏乏又無周餼也”者，解經“亦弗故生也”。田裏所以安其身，周餼所以養其命，皆是為生之具，今並不與，是不故欲使其生也。雲“《虞書》曰‘五流有宅，五宅三居’是也”者，證經“屏之四方”。此雲《虞書》者，《舜典》文。鄭注云“宅讀曰咜，懲刈之器”，謂五刑之流皆有器。懲刈五吒者，是五種之器，謂桎一梏二拲二。三居謂周之夷服、鎮服、蕃服。雲“周則墨者使守門”以下，是《周禮·掌戮》文。按《掌戮》“墨者使守門”，注云“黥者無妨於禁御”；雲“劓者使守關”，注云“截鼻亦無妨以貌醜遠之”；雲“宮者使守內”，注云“以人道絕也”；雲“刖者使守囿”，注云“斷足驅衛禽獸，無急行”；雲“髡者使守積”，注云“王之同族，不宮之者髡頭而已。守積，積在隱者宜也”。引之者，欲明周家畜刑人，異於夏殷法也。" }
      - { type: j, text: "諸侯之於天子也，比年一小聘，三年一大聘，五年一朝。比年，每歲也。小聘使大夫，大聘使卿，朝則君自行。然此大聘與朝，晉文霸時所制也。虞夏之制，諸侯歲朝。周之制，侯、甸、男、採、衛、要服六者，各以其服數來朝。○一朝，直遙反。數，色角反，又所具反。。○天子五年一巡守。天子以海內為家，時一巡省之。五年者，虞、夏之制也。周則十二歲一巡守。○守，手又反，本又作狩，後“巡守”皆同。省，色景反。" }
      - { type: z, text: "“諸侯”至“一朝”。正義曰：此一經論諸侯遣卿大夫聘問及自親朝之事。○注“小聘”至“來朝”。正義曰：知“小聘使大夫”者，按《聘禮記》雲“小聘曰問，三介，大聘使卿，為介有五人，其小聘唯三介”，故知“小聘使大夫”。雲“此大聘與朝，晉文霸時所制也”者，按昭三年《左傳》，鄭子大叔曰“文、襄之霸也，其務不煩諸侯，令諸侯三處而聘，五歲而朝”，故云“晉文霸時所制”。而晉文霸時，亦應有比年大夫之聘，但子大叔略而不言，此亦據傳文，直雲大聘與朝，不雲比年小聘。按《左傳》文三年聘，五年朝，諸侯相朝之法，今此經文雲“諸侯之於天子，三年一大聘，五年一朝，則文、襄之制，諸侯朝天子，與自相朝同也。如鄭此注，唯據文、襄，故鄭雲此“晉文霸時所制”。又鄭《駮異義》雲：“《公羊》說比年一小聘，三年一大聘，五年一朝，以為文、襄之制。錄《王制》者，記文、襄之制耳，非虞夏及殷法也。”熊氏或以此為虞夏法，或以為殷法，文義雜亂，不復相當，曲為解說，其義非也。雲“虞夏之制，諸侯歲朝”者，按《尚書·堯典》雲“五載一巡守，群后四朝”，鄭注云“巡守之年，諸侯朝於方岳之下，其間四年，四方諸侯分來朝於京師，歲遍”是也。按《孝經》注“諸侯五年一朝天子，天子亦五年一巡守”。熊氏以為虞、夏製法，諸侯歲朝，分為四部，四年又遍，總是五年一朝，天子乃巡守，故云“諸侯五年一朝天子，天子亦五年一巡守”。按鄭注《尚書》“四方諸侯分來朝於京師，歲遍”，則非五年乃遍。又《孝經》之注，多與鄭義乖違，儒者疑非鄭注，今所不取，熊氏之說非也。虞夏之制，但有歲朝之文。其諸侯自相朝聘及天子之事則無文，不可知也。鄭此注虞夏之制，即雲周之制，不雲殷者，虞夏及周，經有明文，故指而言之，殷則經籍不見，故不言也。按《春秋》文十五年《左傳》雲：“諸侯五年再相朝，以脩王制，古之制也。”按《鄭志》孫皓問雲：“諸侯五年再相朝，不知所合典禮。”鄭答雲：“古者據時而道前代之言，唐虞之禮，五載一巡守。夏、殷之時，天子蓋六年一巡守，諸侯間而朝天子。其不朝者朝罷朝，五年再朝，似如此制，禮典不可得而詳。”如《鄭志》之言，則夏、殷天子六年一巡守，其間諸侯分為五部，每年一部來朝天子，朝罷還國，其不朝者朝罷朝諸侯，至後年不朝者，往朝天子而還，前年朝者，今既不朝，又朝罷朝諸侯，是再相朝也，故鄭雲“朝罷朝也”。如鄭之意，此為夏、殷之禮。而鄭又云“虞、夏之制，諸侯歲朝”，以夏與虞同，與《鄭志》乖者，以群后四朝，文在《堯典》。《堯典》是虞、夏之書，故連言夏，其實虞也。故《鄭志》雲：“唐虞之禮，五載一巡守。”今知諸侯歲朝，唯指唐虞也。其夏、殷朝天子，及自相朝，其禮則然，其聘天子及自相聘，則無文也。雲“周之制”以下，《周禮·大行人》文。故《大行人》雲：侯服歲壹見，甸服二歲壹見，男服三歲壹見，採服四歲壹見，衛服五歲壹見，要服六歲壹見。是六者各以其服數來朝，皆當方分為四部分，隨四時而來。鄭注《大行人》雲“朝貢之歲，四方各四分，趨四時而來”，是方別各為四分也。近東者，朝春近南者，宗夏近西者，覲秋近北者，遇冬故韓侯是北方諸侯而近於西，故稱韓侯入覲。鄭雲“秋見天子曰覲”。又鄭注《明堂位》雲：“魯在東方，朝必以春，魯於東方，近東故也。”以此言之，則侯服朝者，東方以秋，南方以冬，西方以春，北方以夏，以其近京師，舉此一隅，自外可知悉。按《大宗伯》雲“春見曰朝”，注云“朝猶朝也，欲其來之早”；“夏見曰宗”，注云“宗，尊也，欲其尊王”；“秋見曰覲”，注云“覲之言勤也，欲其勤王之事”；“冬見曰遇”，注云“遇，偶也，欲其若不期而俱至”；“時見曰會”，注云“時見者，言無常期，諸侯有不順服者，王將有徵討之事”，即《春秋左傳》雲“有事而會也”；“殷見曰同”，注云“殷，眾也，十二歲王如不巡守，則六服盡朝”，“四方四時分來，歲終則遍”。每當一時一方總來，不四分也。此六者諸侯朝王之禮。又諸侯有聘問王之禮，故《宗伯》雲“時聘曰問”，注云“時聘者，亦無常期，天子有事乃聘之焉”；“殷覜曰視”，注云“殷覜，謂一服朝之歲，以朝者少，諸侯乃使卿以大禮眾聘焉。一服朝在元年、七年、十一年”。其諸侯自相朝，則《大行人》雲“凡諸侯之邦交，歲相問也，殷相聘也，世相朝也”，注云“小聘曰問。殷，中也。久無事，又於殷朝者，及而相聘也。父死子立曰世。凡君即位，大國朝焉，小國聘焉”。鄭知久無事而相聘者，按昭九年《左傳》稱“孟僖子如齊，殷聘禮也”。知“凡君即位，大國朝焉，小國聘焉”者，以襄元年“邾子來朝”，“衛子叔晉知武子來聘”，《左傳》雲“凡諸侯即位，小國朝之，大國聘焉”。邾是小國，故稱朝。衛晉是大國，故稱聘。若俱是敵國，亦得來聘朝，故《司儀》雲“諸侯相為賓”是也。若已初即位，亦朝聘大國，故文公元年“公孫敖如齊”，《左傳》雲“凡君即位，卿出並聘”。若已是小國，則往朝大國，故文十一年“曹伯來朝”，《左傳》雲“即位而來見也”。其天子亦有使大夫聘諸侯之禮，故《大行人》雲“間問以諭諸侯之志”，“歲遍存，三歲遍覜，五歲遍省”，間年一聘，以至十一歲。按昭十三年《左傳》雲：“歲聘以志業，間朝以講禮，再朝而會以示威，再會而盟以顯昭明。”賈逵、服虔皆以為朝天子之法，崔氏以為朝霸主之法，鄭康成以為不知何代之禮，故《異義》雲：“《公羊》說諸侯比年一小聘，三年一大聘，五年一朝天子。《左氏》說十二年之間八聘、四朝、再會、一盟。許慎謹按：《公羊》說，虞、夏制。《左氏》說，周禮。傳曰三代不同物，明古今異說。”鄭駮之雲：“三年聘，五年朝，文、襄之霸制。《周禮·大行人》‘諸侯各以服數來朝’，其諸侯歲聘間朝之屬，說無所出。晉文公強盛諸侯耳，非所謂三代異物也。”是鄭以歲聘間聘朝，文無所出，不用其義也。言晉文公但強盛諸侯耳，何能制禮？而云三代異物乎？是難許慎之辭也。《異義》：“朝名，《公羊》說諸侯四時見天子，及相聘皆曰朝。以朝時行禮，卒而相逢於路曰遇。《古周禮》說‘春曰朝，夏曰宗，秋曰覲，冬曰遇’。許慎按：《禮》有覲經，《詩》曰：‘韓侯入覲。’《書》曰：‘江漢朝宗於海。’知有朝覲宗遇之禮。”從《周禮》說。鄭駮之雲：“此皆有似不為古昔。按《覲禮》曰：‘諸侯前朝，皆受舍於朝。朝通名。’”如鄭此言，《公羊》言其總號，《周禮》指其別名。《異義》：“天子聘諸侯。《公羊》說天子無下聘義。”《周禮》說間問以諭諸侯之志。許慎謹按：禮，臣疾，君親問之。天子有下聘之義。”從《周禮》說。鄭無駮，與許慎同也。○注“五年”至“巡守”。○正義曰：知五年是虞、夏之制者，《堯典》雲“五載一巡守”，此正謂虞也。以虞、夏同科，連言夏耳。若夏與殷，依《鄭志》，當六年一巡守也。雲“周則十二歲一巡守”者，《大行人》雲“十有二歲，王巡守殷國”，故知周制十二年也。按《白虎通》雲：“所以巡守者何？巡者循也，守者牧也。為天子循行守土，收民道德大平，恐遠近不同化，幽隱不得其所者，故必親自行之，謙敬重民之至也。所以不歲巡守何？為大煩。過五年，為其大疏。因天道三歲一閏，天道小備，五歲再閏，天道大備，故五年一巡守。”以此言之，夏、殷六歲者，取半一歲之律呂也。周十二歲者，象歲星一週也。" }
      - { type: j, text: "歲二月，東巡守，至於岱宗。岱宗，東嶽。○岱音代。柴而望，祀山川。柴，祭天告至也。○柴，仕佳反，依字作祡。覲諸侯，覲，見也。○覲見，如字，舊賢遍反。問百年者就見之。就見老人。命大師陳詩，以觀民風。陳詩，謂採其詩而視之。○大音泰，後“大學”、“大祖”、“大子”、“大樂正”、“大史”皆同。命市納賈，以觀民之所好惡，志淫好闢。市，典市者。賈，謂物貴賤厚薄也。質則用物貴，淫則侈物貴。民之志淫邪，則其所好者不正。○賈音嫁，注同。好，呼報反，下及注同。惡，烏路反。闢，匹亦反，徐芳亦反。侈，昌氏反，又式氏反。邪，似嗟反。命典禮，考時月，定日，同律、禮、樂、制度、衣服，正之。同陰律也。山川神祗，有不舉者為不敬，不敬者君削以地。舉猶祭也。○削，息約反。宗廟有不順者為不孝，不孝者君絀以爵。不順者，謂若逆昭穆。○絀，醜律反，退也。昭，常遙反，凡言昭穆放此。變禮易樂者為不從，不從者君流。流，放也。○樂音嶽。革制度衣服者為畔，畔者君討。討，誅也。有功德於民者，加地進律。律，法也。五月南巡守，至於南嶽，如東巡守之禮。八月西巡守，至於西嶽，如南巡守之禮。十有一月北巡守，至於北嶽，如西巡守之禮。歸假於祖禰，用特。假，至也。特，特牛也。祖下及禰皆一牛。○嶽音嶽，下同。假，音格禰乃禮反父廟也。" }
      - { type: z, text: "“歲二”至“用特”。○正義曰：此一經論王者巡守四嶽，柴望及絀陟之事，各依文解之。○“歲二月，東巡守”者，皆以夏之仲月，以夏時仲月者，律歷常得其中也。二月八月，又晝夜分。五月十一月者，陰陽終，故取四仲月也。○注“岱宗東嶽”。○正義曰：嶽者何？嶽之為言桷也，桷，功德也。必先於此岱山者，言萬物皆相代於東方，故歲二月東巡守，至於岱宗。宗者，尊也。岱為五嶽之首，故為尊也。○注“柴，祭天告至也”。○正義曰：“柴，祭天告至“，謂燔柴以祭上天而告至，其祭天之後，乃望祀山川。所祭之天，則蒼帝靈威仰。○“覲諸侯”。○覲，見也，謂見東方諸侯。其見之禮，按《覲禮》雲“諸侯覲於天子，為宮方三百步，四門壇十有二尋，深四尺”，鄭注云“王巡守至於方岳之下，諸侯會之，亦為此宮以見之”是也。《覲禮》又云“天子乘龍，載大旂”，“拜日於東門之外，反祀方明”，鄭注引《朝事儀》曰“天子冕而執鎮圭，尺有二寸”，雲“帥諸侯而朝日於東郊，所以教尊尊也，退而朝諸侯。由此二者言之，已祀方明，乃以會同之禮見諸侯也。凡會同者，不協而盟，盟時設方明於壇上，乃以載辭告焉”。如《覲禮》及鄭注所云，既告至之後，為宮加方明於壇。天子出宮東門外拜日，反祀方明，祀方明之後，乃徹去方明，故鄭雲“由此二者言之，已祀方明，乃以會同之禮見諸侯”。雲二者，謂《覲禮》經文“朝日東門”，“反祀方明”。《朝事儀》雲“朝日東郊，退而朝諸侯“，故云“由此雲二者言之，已祀方明，乃以會同之禮見諸侯也”。今於《覲禮》，未祀方明之前，未有見諸侯之事，皇氏以為未祀方明之前，己見諸侯，非也。其祀方明之後，見諸侯之時，王升立於壇上南面，諸公中階之前北面，諸侯東階之東西面，諸伯西階之西東面，諸子門東北面，諸男門西北面。王降階南面而見之，三揖，既升壇，使諸侯升，公拜於上等，侯伯於中等，子男於下等。見諸侯訖，若有不協，更加方明於壇上。諸侯等俱北面，戎石傳敦血以授歃者，司盟主其職，故《司盟》雲：“掌其盟約之載，及其禮儀，北面詔明神。”於時王立無文，不可與諸侯同北面，當於阼階上西面。此是見諸侯之禮，祀方明之時，祭天則燔柴也。天謂日也。與此岱宗柴所用事別。《覲禮》雲“祭天燔柴”，謂天子之盟也；“祭地瘞”，謂王官之伯盟也；“祭山丘陵升及祭川沈”者，是諸侯之盟也。此是巡守及諸侯之盟祭也，故注云“升沈必就祭者也。就祭則是謂王巡守，及諸侯之盟祭也”，“祭天柴，謂祭日也”，“祭地瘞者，祭月也”，“王巡守之盟，其神主日”，諸侯之盟，其神主山川”，則“王官之伯，會諸侯而盟，其神主月”。與今此《王制》所注岱宗柴者，謂祭天告至，而《覲禮》注引《王制》雲“王巡守，至於岱宗”，柴是王巡守之盟，其神主日。又以柴為盟之所用不同者，告至與盟，必非一事。鄭意證巡守盟時有柴，故引岱宗以證之，其實別也。《覲禮》云為宮即言加方明，經文相連，鄭注云“王巡守至於方岳之下，諸侯會之，亦為此宮”，則亦有方明，但文不具耳。故巡守祭天燔柴，祭地瘞埋，皆是祭方明也。故鄭於方明“設六玉”之下，注云“上宜以蒼璧，下宜以黃琮。而不以者，則上下之神，非天地之至貴者也”。以此言之，明天子巡守之祭有方明也。而皇氏雲“諸侯來就王會同有方明，王巡守見諸侯無方明”，皇氏用之為說，其義非也。○“問百年者就見之”。○此謂到方岳之下，見諸侯之後，問百年者就見之。若未至方岳，於道路之上，有百年者，則亦王先見之。故《祭義》雲“天子巡守，諸侯待於竟，天子先見百年者”，下雲“八十九十者，東行，西行者弗敢過”，道經之則見之，則知百年者，道雖不經所在，就見之，與此少別。○“命大師陳詩以觀民風”。○此謂王巡守，見諸侯畢，乃命其方諸侯。大師是掌樂之官，各陳其國風之詩，以觀其政令之善惡。若政善，詩辭亦善；政惡，則詩辭亦惡。觀其詩，則知君政善惡，故《天保》詩云“民之質矣，日用飲食”，是其政和。若其政惡，則《十月之交》“徹我牆屋，田卒汙萊”是也。○“命市”至“好闢”。○命典市之官，進納物賈之書，以觀民之所有愛好，所有嫌惡。若民志淫邪，則愛好邪辟之物，民志所以淫邪，由在上教之不正。此陳詩納賈，所以觀民風俗，是欲知君上善惡也。○“命典”至“正之”。○典禮之官，於周則大史也。考校四時，及十二月之大小，時有節氣早晚，月有弦望晦朔，考之使各當其節。又正定甲乙之日，陰管之同，陽管之律，玉帛之禮，鍾鼓之樂，及制度衣服，各有等差，當正之使正。《堯典》雲：“協時月正日，同律度量衡。”文雖小異，大意與此同也。○注“同陰律也”。○正義曰：鄭以先儒以同為齊同此律，故辨之雲“同陰律也”。故《大師》雲“執同律以聽軍聲”。又《典同》注云“同陰律也”。不以陽律名管者，因其先言耳。所以先言者，以同為平聲，平為發語之本，今古悉然，故先言耳。○“山川”至“以爵”。○山川是外神，故云“不舉”。不舉，不敬也。山川在其國竟，故削以地。宗廟是內神，故云“不順”。不順，不孝也。宗廟可以表明爵等，故絀以爵。○注“不順”至“昭穆”。○正義曰：按文二年秋“八月，丁卯，大事於大廟，躋僖公，逆祀也”，《左傳》曰“夏父弗忌為宗伯”，“曰，吾見新鬼大，故鬼小，先大後小，順也”，於是躋僖公於閔公之上，是逆昭穆也。○“變禮”至“君討”。○禮樂雖為大事，非是切急所須，故以為不從，君惟流放。制度衣服，便是政治之急，故以為畔，君須誅討。此四罪先輕後重。○注“律，法也”。○正義曰：“律，法”，《釋詁》文。法謂法度，諸事皆是，即《大行人》上公九命”繅藉九寸，冕服九章，建常九斿”之等是也。“五月”至“用特”。○言“五月南巡，至於南嶽”者，孔注《尚書》雲“自東嶽南巡守，五月至”，則是從東嶽而去，故鄭注《尚書》雲“每歸格於祖”。既言每歸，似是嶽別一歸。若嶽別一歸而更去，便是路遠，無由可至。《尚書》既雲“巡守四嶽”，即雲“五載一巡守”，鄭雲“每歸者，謂每五年巡守而歸也”。其南嶽、西嶽、北嶽者，按《爾雅·釋山》雲“泰山為東嶽”，郭景純注云“泰山為東嶽，在奉高縣西北”。“霍山為南嶽”，郭注“山在衡陽湘南縣南”，郭又云“今在廬江潛縣西，漢武帝以說衡山遼曠，因讖緯皆以霍山為南嶽，故移其神於此，其土俗人皆呼為南嶽。南嶽本自兩山為名，非從近也”。如郭此言，則南嶽衡山自有兩名，一名衡山，一名霍山。自漢武帝以來，始徙南嶽之神於廬江霍山耳。“華山為西嶽”，鄭注云“在弘農華陰縣西南”。“恆山為北嶽”，郭注云“在常山上曲陽縣西北”。○注“假至”至“一牛”。○正義曰：“假，至也”，《釋詁》文也。雲“祖下及禰皆一牛”者，謂從始祖下及於禰廟，別皆一牛。鄭以經雲“祖禰用特”，恐同用一牛。必知每廟皆一牛者，以《尚書·堯典》雲“歸格於藝祖，用特”，祖既用特，明知各用特也。唐、虞及夏五廟，則用五特也。殷用六，周用七也。又《尚書·洛誥》雲“文王騂牛一，武王騂牛一”，是各用一牛也。自此以上皆是巡守之禮，雖未大平得為之，故《詩·時邁》“巡守告祭柴望也”。《時邁》是武王詩。邁，行也。時未大平而巡守也。故《大司馬》雲“及師，大合軍，以行禁令，以救無辜，伐有罪”，鄭注云“師所謂王巡守，若會同”，“不言大者，未有敵，不尚武”，又注云“大師王出征伐也”，以此故知未大平，得巡守。皇氏以為未大平，不巡守，非也。其封禪者，必因巡守大平，乃始為之，故《中候準讖哲》雲：“桓公欲封禪，管仲曰：‘昔聖王功成道洽符出，乃封泰山。今皆不至，鳳皇不臻，麒麟逃遁，未可以封。’”又《禮器》雲：“升中於天，鳳皇降，龜龍假。”又《鉤命決》雲：“刑罰藏，頌聲作，鳳皇至，麒麟應，封泰山，禪梁甫。”《管子》又云：“封禪者，須北里禾，鄗上黍，江淮之間三脊茅以為藉，乃得封禪。”是大平祥瑞總至，乃得封禪也。然武王之時未大平。而《時邁》“巡守”之下注雲：“天子巡行邦國，至於方岳之下而封禪也。”似武王得封禪者，鄭因巡行連言封禪耳，不謂當時封禪也。《白虎通》雲：“封禪所以必於泰山何？萬物之始，交代之處，必於其上何？因高告高，順其類也。故升封者，增高也。下禪梁甫之基，廣厚也。天以高為尊，故增泰山之高以報天。地以厚為德，附梁甫之基以報地。刻石紀號者，著已之功跡。或曰封以金泥銀繩，或曰石泥金繩，封之印璽。”《孝經緯》雲：“封於泰山，考績燔燎，禪於梁甫，刻石紀號。”又《管子》雲：“昔古封禪七十二家，夷吾所識，十有二焉。無懷氏封太山，伏犧、神農、少皞、黃帝、顓頊、帝嚳、帝堯、帝舜、禹、湯、周成王皆封泰山，惟禹禪會稽、成王禪社首為異。自外皆禪云云。”《白虎通》雲：“三皇禪於繹繹之山，明已成功而去，有德者居之。繹繹者無窮之意。五帝禪於亭亭之山。亭亭者，制度審諦，道德著明也。茸荃禪於梁甫之山。梁者信也。甫者輔也。信輔天地之道而行之。”所禪之山，與《管子》不同者，異人之說，未知孰是云云。亭亭、繹繹、梁甫，並泰山旁小山名也。" }
      - { type: j, text: "《禮記正義》" }
