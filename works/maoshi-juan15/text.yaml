# 毛詩正義卷15（孔穎達疏）：j 為經文＋毛亨傳、鄭玄箋，z 為疏文。
sections:
  - id: juan15
    name: 正文
    blocks:
      - { type: j, text: "《綿蠻》，微臣刺亂也。大臣不用仁心，遺忘微賤，不肯飲食教載之，故作是詩也。微臣，謂士也。古者卿大夫出行，士為末介。士之祿薄，或睏乏於資財，則當週贍之。幽王之時，國亂禮廢恩薄，大不念小，尊不恤賤，故本其亂而刺之。○綿蠻，面延反，下如字。飲食，上於鴆反，下音嗣。篇內皆同，注如字。介音界。周音周。贍，市豔反。" }
      - { type: z, text: "“《綿蠻》三章，八句”至“是詩”。○正義曰：《綿蠻》詩者，周之微賤之臣所作，以刺當時之亂也。以時大臣卿大夫等皆不用仁愛之心，而多遺棄忽忘微賤之臣，至於共行不肯飲食教載之，謂在道睏乏，渴則不與之飲，飢則不與之食，不教之以事，不載之以車。大不念小，尊不恤賤，是國政昏亂所致，故作是《綿蠻》之詩以刺之也。言刺亂者，不為己困而私以責人，是王法為失，故言亂也。大臣不用仁心，遺忘微賤，敘其為亂之意。於經為總指而言之，經三章上四句是也。不肯飲食教載之，為三章下四句是也。由其不然，故經所以反而責之。不言誨之者，以教誨相對則為二，散則相兼，故略之以便文。○箋“微臣”至“刺之”。○正義曰：以微臣，臣之微賤者，唯士為然。府史則官長，闢除不在臣例。大夫則爵尊祿重，是為大臣。故知臣謂士也。士之作詩，亦應多矣。此篇獨言微臣者，以為此大臣遺忘微賤而刺之，義取於微，故言之也。又解所以怨大臣遺忘之者，以古者卿大夫出行，士為末介。以士之祿薄，或睏乏資財，則當週贍之。以不周餼為遺忘也。知士為末介者，以為賓而作介，猶為主而作擯，以《聘禮》及《聘義》皆言士為紹擯，繼於卿大夫之末，為末擯，故知出行作末介也。《王制》說班祿之法：“下士食九人，中士十八人，上士三十六人。”公私雜費有不足，故云“士之祿薄，或睏乏於資財也”。言“或”，容有不困者也。大臣不用仁心，非王身之過，列於《王雅》而言刺亂，故解其所由。自幽王之時，國亂禮廢，以下是也。" }
      - { type: j, text: "綿蠻黃鳥，止於丘阿。興也。綿蠻，小鳥貌。丘阿，曲阿也。鳥止於阿，人止於仁。箋雲：止，謂飛行所止託也。興者，小鳥知止於丘之曲阿靜安之處而託息焉，喻小臣擇卿大夫有仁厚之德者而依屬焉。○處，昌慮反。道之雲遠，我勞如何！飲之食之，教之誨之。命彼後車，謂之載之。箋雲：在國依屬於卿大夫之仁者。至於為末介，從而行，道路遠矣，我罷勞則卿大夫之恩宜如何乎？渴則予之飲，飢則予之食，事未至則豫教之，臨事則誨之，車敗則命後車載之。後車，倅車也。○罷音皮。下同。倅，七對反，副車。" }
      - { type: z, text: "“綿蠻”至“載之”。○正義曰：言綿蠻然而小者，是黃鳥也。此黃鳥飛行，則止於丘阜之曲阿安靜之處者，而自託息焉。以興微賤者，小臣也。我小臣之動止，亦當擇大臣有仁厚愛養之德者，而自依屬焉。既擇大臣之仁者依屬焉，至於大臣聘使，則為末介，從之而行。其道路之上，亦云遠矣，我罷勞矣，則卿大夫之恩宜如何乎？渴則當飲之，飢則當食之，事未至則教之，臨事則誨之，車敗則命彼在後之倅車，謂之使載之。大臣之於小臣，其義當然。今大臣何為遺忘己，而不肯飲食教載之？○傳“綿蠻”至“於仁”。○正義曰：綿蠻文連黃鳥，黃鳥小鳥，故知綿蠻小貌。《釋丘》雲：“非人為之丘。”李巡曰：“謂非人力所為，自然生為丘也。”《釋地》雲：“大陵曰阿。”則丘之與阿為二物矣。而以丘阿為曲阿者，以下丘側、丘隅類之，則丘阿非二物也。《卷阿》雲：“有卷者阿。”知丘阿是丘之曲中也。此為大臣無仁心而作，故知鳥止於阿，似人止於仁。○箋“止謂”至“屬焉”。○正義曰：鳥必飛而後止，故知止謂飛行所止託也。以鳥楚有畏之物，故知取安靜之處而託息焉。《大學》注云：“鳥知擇岑蔚，安閒而止處之。”與此同也。此黃鳥刺大臣不用仁心，故知喻小臣當擇卿大夫有仁厚之德者而依屬焉。小臣而得擇大臣依之者，以臣雖君之所置，而貴賤不等，小臣當依屬大臣。《論語》雲：“事其大夫之賢者，友其士之仁者。”是得以已情擇而依之也。然則此微臣自擇不得人而責之者，以己本親之，冀其恤己，但當時國亂禮廢，臣皆不仁，己雖擇之，猶不免困，所以刺上也。○箋“在國”至“倅車”。○正義曰：此微臣隨大臣而行，言道之雲遠，是必聘使諸國，故為介從也。聘問之介，當是君所命遣，而得自以己意，在國依屬，出則從行者。或使主所自引，或君知其依屬而遣之也。言飲之、食之、教之、誨之、載之四者語便之，當故隨文為次。教誨雖於人無費，而無仁心亦不肯也，故《論語》曰：“愛之能勿勞乎？忠焉能勿誨乎？”是不愛則不誨也，教誨一也。別言之，事有至與未至，故箋因其文之先後，而分以充之雲：“事未至則豫教之，臨事則誨之。”從行遠道，不應初即無車，故言車敗則載之，以士無倅車故也。“後車，倅車”者，明後為副也。《夏宮·戎僕》“掌倅車之政”，《道僕》“掌貳車之政”，《田僕》“掌佐車之政”，是朝祀之副曰貳，兵戎之副曰倅，田獵之副曰佐。此是聘問之事，宜與朝祀同名，當言貳車。言倅者，《周禮》以相對而異名，其實貳、倅皆副也，散則義通，故以倅言之。" }
      - { type: j, text: "綿蠻黃鳥，止於丘隅。箋雲：丘隅，丘角也。豈敢憚行，畏不能趨。箋雲：憚，難也。我罷勞，車又敗，豈敢難徒行乎？畏不能及時疾至也。○憚，徒旦反。下同。難，乃旦反。下同。飲之食之，教之誨之。命彼後車，謂之載之。" }
      - { type: j, text: "綿蠻黃鳥，止於丘側。箋雲：丘側，丘旁也。豈敢憚行，畏不能極。箋雲：極，至也。○極如字。飲之食之，教之誨之。命彼後車，謂之載之。" }
      - { type: j, text: "《綿蠻》三章，章八句。" }
      - { type: j, text: "《瓠葉》，大夫刺幽王也。上棄禮而不能行，雖有牲牢饔餼，不肯用也。故思古之人，不以微薄廢禮焉。牛羊豕為牲，系養者曰牢，熟曰饔，腥曰餼，生曰牽。不肯用者，自養厚而薄於賓客。○瓠，戶故反。牢，老刀反。雍，於恭反，字又作“饔”。餼，許氣反。腥音星。" }
      - { type: z, text: "“《瓠葉》四章，章四句”至“廢禮焉”。○正義曰：《瓠葉》詩者，周大夫所作，以刺幽王也。以在上位者棄其養賓之禮而不能行，雖有牲牢饔餼之物，而不肯用之以行禮，故作詩者思古之人，不以菹羞微薄而廢其禮焉。言古之人，賤者尚不以微薄廢禮，則當時貴者行之可知。由上行其禮以化下，反駁今上棄其禮而不行也。今在上者尚棄禮不行，卑賤者廢之，明矣。舉輕以見重，是作者之深意也。經四章，皆上二句言菹羞之薄，下二句言行禮之事，是古之人不以微薄廢禮也。○箋雲“牛羊豕”至“賓客”。○正義曰：《孝經》雲：“三牲之養。”則牲兼三畜，故牛羊豕曰牲也。《公劉》曰：“執豕於牢。”《地官·充人》：“掌系祭祀之牲牷，祀五帝則系於牢，芻之三月”。牢者，牲所居之處，故系養者為牢也。《天官》內、外饔皆掌割亭之事。亨人“掌外內饔之爨亨煮”。饔是煮肉之名，故熟曰饔。饔既為熟，則餼非熟矣。僖三十三年《左傳》曰：“餼牽竭矣。”餼與牽相對，是牲可牽行，則餼是已殺。殺又非熟，故知腥曰餼，謂生肉未煮者也。既有饔餼，遂因解牽。使肉之別名，皆盡於此。此與牽、饔相對，故餼為腥。其實餼亦生。哀二十四年《左傳》雲：“晉師乃還，餼臧石牛。”是以生牛賜之也。《論語》及《聘禮》注云：“牲生曰餼。”而不與牽、饔相對，故為生也。凡言禮者，皆與人行事。經陳獻酢與賓客為禮，故知不肯用者，自養厚而薄於賓客" }
      - { type: j, text: "幡幡瓠葉，採之亨之。君子有酒，酌言嘗之。幡幡，瓠葉貌。庶人之菜也。箋雲：亨，熟也。熟瓠葉者，以為飲酒之菹也。此君子謂庶人之有賢行者也。其農功畢，乃為酒漿，以合朋友，習禮講道藝也。酒既成，先與父兄室人亨瓠葉而飲之，所以急和親親也。飲食而曰嘗者，以其為之主於賓，客賓客則加之以羞。《易·兌·象》曰：“君子以朋友講習。”○幡，孚煩反。亨，普庚反。注同。菹，莊魚反。行，下孟反。兌，徒外反，《易》卦名也，訓悅。" }
      - { type: z, text: "“幡幡”至“嘗之”。○正義曰：幡幡然者，是瓠之葉也。我君子令人採取之，既得而又亨煮之，釀以為飲酒之菹也。庶人農功畢，君子賢者有酒，令人酌此酒，我當與父兄室人嘗而飲之，所以相親愛也。言古者不以微薄而廢禮，尚亨瓠葉而用之。今乃有牲牢饔餼而不肯用，故以刺之也。○傳“幡幡”至“之菜”。○正義曰：士禮有特牲豚豕，此止言瓠葉與兔首，明非有位之人，故言庶人之菜。《七月》雲“八月斷壺”，即言“食我農夫”，彼雖瓠體，與此為類，明亦農夫之菜，故箋申之雲：“庶人有賢行者。”○箋“亨熟”至“講習”。○正義曰：序雲“不以微薄廢禮”，下連“君子有酒”，故知亨熟瓠葉者，以為飲酒之菹。知為菹者，以禮飲酒有菹醢故也。此美君子行禮，而亨庶人之菜，故知君子是庶人有賢行者也。庶人而能為酒以行禮者，以其農功畢，則閒而無事，於此之時，乃為酒漿，以合會朋友，習行禮事，講其道藝故也。以民在田畝必無容暇，故知農功畢而為之。以三時務農，將闕於禮，故為酒會朋友以講習之。此酒為朋友而釀，先言嘗之，則未與朋友賓客飲也，故知酒既成，先與父兄室人亨瓠葉而飲之。酒為朋友所作，而與父兄先飲，是所以急和親親，亦是為行禮也。又解飲酒而曰嘗者，以其為之主於賓客故也。以此嘗之言，故知為酒將以會朋友也。作酒本為行禮，和親亦是禮事，欲見敬重賓客，故言嘗以美之。以此在獻前，又無殽羞，明與下章事別，故知與父兄室人。室人者，即家內之小大皆是也。賓客則加之以羞者，明重得兼輕，此父兄直有菹，賓客亦有菹，又有兔為之羞。《鄉飲酒》及《燕禮》是為大禮，雖有牲殽，尚有菹醢，明賓雖有羞，亦有菹，故云加之也。引《易·兌·象》曰“君子以朋友講習”者，以此與賓客即朋友也，所會朋友，必為講習，以《易》有此言以著義，故知此合朋友為習禮講藝，故引以證之。講習必非農時，故知農功畢，意亦出於此文也。" }
      - { type: j, text: "有兔斯首，炮之燔之。君子有酒，酌言獻之。毛曰炮。加火曰燔。獻，奏也。箋雲：斯，白也，今俗語“斯白”之字作“鮮”，齊、魯之間聲近斯。有兔曰首者，兔之小者也。炮之燔之者，將以為飲酒之羞也。飲酒之禮，既奏酒於賓，乃薦羞。每酌言言者，禮不下庶人，庶人依士禮立賓主為酌名。○兔，他故反。下同。斯首，毛如字，此也。鄭作“鮮”，音仙，白首也。炮，本作“炰”，白交反。燔音煩。近，附近之近。下，遐嫁反。" }
      - { type: z, text: "“有兔”至“獻之”。○毛以為，古人行禮，有兔之斯首，謂唯有一兔，雖微耳，尚並毛而炮之，加火而燔之，以為飲酒之羞。君子之賢者有酒，令酌之，我當以此酒奏獻之於賓，以行禮也。古之人不以微薄廢禮，今乃有牲牢而不用，故刺之。鄭唯斯首謂白頭為異。餘同。○傳“毛曰”至“獻奏”。○正義曰：《地官·封人》雲：“毛炮之豚。”注云：“爓去其毛而炮之。”唯肉炮。《內則》“炮取豚若將，編萑以苴之”，故云毛炮之。此述庶人之禮，傳直言“毛曰炮”，當是合毛而炮之，未必能如八珍之食，去毛炮之也。毛無改字之理，斯字當訓為此。王肅、孫毓述毛雲：“唯有一兔頭耳。”然案經有“炮之燔之”，且有炙之，則非唯一兔首而已。既能有兔，不應空用其頭。若頭既待賓，其肉安在？以事量理，不近人情。蓋詩人之作，以首表兔，唯有一兔，即是不以微薄廢禮也。為肉至薄，明是並毛炮之，不可爓矣。箋言鮮者，毛炮之亦當然也。加置於火上，是燔燒之，故言加火曰燔。以獻酒者必奏進於賓，故言“獻，奏也”。○箋“斯白”至“酌名”。○正義曰：鄭以斯首以見兔小，與毛為異。斯為兔首之色，故言“斯，白也”。又解斯得為白之意，“今俗斯白之字當作鮮”，以鮮明是絜白之義故也。鮮而變為斯者，齊、魯之間其語鮮、斯聲相近，故變而作斯耳。宣二年《左傳》曰：“于思于思。”服虔雲：“白頭貌。”字雖異，蓋亦以思聲近鮮，故為“白頭”也。畜獸小則毛悅長則色重，故言有兔白首。兔之小者，明其微薄也。“炮之燔之”者，將以為飲酒之羞。羞，進也。謂既飲酒而進此兔肉於賓也。飲酒之禮，既奏酒於賓，乃薦羞者，因此酒羞並有，言先後之宜，且辨經雖先為羞，進則在後也。今《禮·鄉飲酒》、《燕禮》、《大射》皆先進酒，乃薦脯醢，乃羞庶羞，故知然也。經言不以微薄廢禮，故先述菹羞，酒無厚薄之異，故後言之。四章皆雲“酌言”。言，我也。其意雲：酌酒我當用之。若是禮合當然，不應每事言我。今每言我，則是行用他法，故解之，言“每酌言言”者，以禮既不下及庶人而為之制，庶人依準士禮，立賓主為酌名以行之，故每酌道我與賓相亢為禮，以行獻酢酬之名也。不於上章解之者，以前直言嘗之，無獻酢之名，此有獻之，故就而言焉。然則嘗之亦云“酌言”者，以酒為賓作，嘗亦行禮，故亦云“酌言”也。禮不下庶人，不制篇卷耳。其庶人執鶩，庶人見國君走亦往，往見於禮焉。" }
      - { type: j, text: "有兔斯首，燔之炙之。君子有酒，酌言酢之。炕火曰炙。酢，報也。箋雲：報者，賓既卒爵，洗而酌主人也。凡治兔之宜，鮮者毛炮之，柔者炙之，乾者燔之。○炙音只。酢，才洛反。炕，苦浪反，何、沈又苦郎反。" }
      - { type: z, text: "傳“炕火曰炙”。○正義曰：炕，舉也，謂以物貫之而舉於火上以炙之。○箋“報者”至“燔之”。○正義曰：申傳“酢，報”之義，故言“報者，賓既卒爵，洗而酌與主人”，是得主人之獻酌而報之也。於一兔之上，而經有三種，故辨之。言凡治兔之所宜，若鮮明而新殺者，合毛炮之；若割截而柔者，則臠貫而炙之，若今炙肉也；乾者謂脯臘，則加之火上炙之，若今燒乾脾也。柔，謂殺巳多日而未乾也。" }
      - { type: j, text: "有兔斯首，燔之炮之。君子有酒，酌言醻之。醻，道飲也。箋雲：主人既卒酢爵，又酌自飲，卒爵復酌進賓，猶今俗之勸酒。○醻，市周反。道，徒報反，本亦作“導”，同。復，扶又反。“俗之”一本作“俗人”。" }
      - { type: z, text: "傳“醻，道飲”。○正義曰：以醻者，欲以醻賓而先自飲以導之。此舉醻之初，其賓飲訖，進酒於賓，乃謂之醻也。○箋“主人”至“勸酒”。○正義曰：傳以醻為導飲。嫌其謂主人自飲為醻，故辨之。“主人既卒酢爵，又酌自飲，卒爵復酌以進賓”，如此乃謂之醻，猶今俗人勸酒者。俗人亦先自飲而後勸人，故云醻之。箋皆準《鄉飲酒》、《燕禮》而為說也。" }
      - { type: j, text: "《瓠葉》四章，章四句。" }
      - { type: j, text: "《漸漸之石》，下國刺幽王也。戎狄叛之，荊舒不至，乃命將率東征。役久病於外，故作是詩也。荊，謂楚也。舒，舒鳩、舒鄝、舒庸之屬。役，謂士卒也。○漸漸，士銜反，沈時銜反，亦作“慚慚”，下同。翟，徒歷反，本或作“狄”。叛音畔。將率，上子亮反，下所類反。注及後篇“將率”放此。“役久病於外”，一本作“役人久病”，人，衍字。鄝音了，本又作“蓼”。士卒，尊忽反。下篇“士卒”同。" }
      - { type: z, text: "“《漸漸之石》三章，章六句”至“是詩”。○正義曰：《漸漸之石》詩者，下國所作，以刺幽王也。以幽王無道，西戎北狄共違叛之，荊楚之群舒又不來至，乃命將率東行征伐之。其役人士卒巳久而疲病，勞苦於外，故作是《漸漸之石》詩以刺之。下國，諸侯之言，對天子為上，故稱下國也。言下國者，此詩下國之人所作，未必即諸侯之身作之。幽王之役人自病，而下國作詩刺之者，王師出征，亦使諸侯從己，諸侯之人亦病，故刺之也。定本、《集本》“役”下無“人”字，其箋、注亦無“人”字。俗本有者，誤也。毛以“戎狄叛之”，經三章上四句是也。“荊舒不至”，下二句是也。“乃命將率東征，役人久病於外”，副上“戎狄叛之，荊舒不至”之言，為六句之總。三方皆有徵伐，而久病獨言東征者，以經有東征之文，因言以廣之，其實戎狄亦伐之也。鄭以“戎狄叛之”，經上二章上二句是也；“荊舒不至”，上二章次二句及卒章上四句是也；“乃命將率東征，役人久病於外”，三章皆下二句是也。以詩言命將東征，無伐戎狄之事，則不伐戎狄也。言不至與叛之，則明由叛而不至，其義一也。下篇言“四夷交侵”，“師旅並起”，“用兵不息”，則戎狄亦當伐之，但自此篇不言之耳。○箋“荊謂”至“士卒”。○正義曰：以楚居荊州，故或以州言之。《春秋經》賈氏《訓詁》雲：“秦始皇父諱楚，而改為荊州。”亦以其居荊州，故因諱而改之。亦有本自作荊者，非為諱也。《春秋公羊》、《穀梁》皆言州不若國，賤楚，故以荊言之。彼自《春秋》之例，其外《書傳》或州或國，自從時便，非褒貶也。《殷武》曰“維汝荊楚”，已並言之，是楚之稱荊，亦巳久矣。《魯頌》亦曰“荊舒是懲”，是隨時之名不定也。以傳有舒鳩、舒鄝、舒庸，又有舒龍，謂之群舒。此直言舒，不指一國。箋又引舒國不盡，故言之屬。既言將率，別雲役人，故知謂士卒也。" }
      - { type: j, text: "漸漸之石，維其高矣。山川悠遠，維其勞矣。漸漸，山石高峻。箋雲：山石漸漸然高峻，不可登而上，喻戎狄眾彊而無禮義，不可得而伐也。山川者，荊舒之國所處也，其道里長遠，邦域又勞勞廣闊，言不可卒服。○勞如字。" }
      - { type: j, text: "武人東征，不皇朝矣。箋雲：武人，謂將率也。皇，王也。將率受王命，東行而征伐，役人罷病，必不能正荊舒，使之朝於王。" }
      - { type: z, text: "“漸漸”至“朝矣”。○毛以為，此時戎狄已叛，將率徵之，與其士卒伐而不息。言戎狄之地，有漸漸然險峻之山石，維其高大矣。又山之與川，其間悠悠然路復長遠。我等登此高山，涉此遠路，維其勞苦矣。不但伐戎狄而已，又其武人將率，以役人東征，征伐荊國之國，疲於軍役而病，不暇修禮而相朝矣。○鄭以漸漸為漸漸然險峻之山石，維其高大，不可登而上矣，以興戎狄眾強，不可得而伐矣。其荊舒所在之國，山川其道路悠悠然而長遠，維其邦域廣闊又勞勞然矣，雖往徵之，難可卒服。武人將率雖受命東征，役人罷病，必不能正之使朝於王矣。○傳“漸漸，山石高峻”。○正義曰：以“漸漸”文連“之石”，為山石之狀，又言“維其高矣”，故知為高峻貌。此傳無異鄭之文，正以漸漸乃是上句，而於此釋之，明以四句為一事。鄭以勞為遼，遼言廣闊之意。毛無改字之理，必不與鄭同。“勞矣”當為勞苦，故王肅雲：“言遠征戎狄，戍役不息，乃更漸漸之高石，長遠之山川，維其勞苦也。”孫毓雲：“篇義言役人久病於外，故經曰山川悠遠，維其勞矣。”此皆以上四句併為徵戎狄而言，俱是述毛為說，傳意或當然也。下篇《苕之華序》曰：“西戎東夷交侵中國，師旅並起。”《何草不黃序》曰：“四夷交侵，用兵不息。”此序言“戎狄叛之”，明其亦伐戎狄。傳又總而注之，則王、孫之言，非無理矣，故據為毛說。若然，卒章上四句毛則分之者，以豕之與月、天地不同，故分之。則此山川事類，故並之。○箋“山石”至“卒服”。○正義曰：以漸漸高不可上，故喻戎狄彊不可伐也。知非戎狄之國高山者，以序唯言“戎狄叛之”，不言征伐戎狄，則不得歷其國之高山。又荊舒之地，山川悠遠，而尚伐之不得，言戎狄山高不可伐，故以喻其眾強也。“維其高矣”，還是漸漸之石高也，則知“維其勞矣”，是山川悠遠之勞勞也，故曰山川者，荊舒之國所處，其道里長遠，邦域又勞勞廣闊。說此者，言其不可卒服，故下句言不能正之也。廣闊遼遼之字，當從遼遠之遼，而作勞字者，以古之字少，多相假借，詩又口之詠歌，不專以竹帛相授，音既相近，故遂用之此字，義自得通，故不言當作遼也。毛並注四句，則是以為一事。箋分為二者，以下雲“武人東征，不皇朝矣”，必上有難徵之事，乃可言不能正之，不得不言荊舒，故知山川悠遠是荊舒之地，為下事發端也。不併以四句為下事之端者，以序雲“戎狄叛之”，經亦當有其事，不得全無所陳，故以上二句充之也。卒章不分之者，以序雲“命將率東征”，則荊舒之惡為甚，是詩所主言，而下章文勢接連，上言涉波，下言滂沱，俱是水事，明其共為一喻，故皆以為荊舒焉。○箋“武人”至“於王”。○正義曰：以序雲“命將率東征”，故知武人謂將率也。“皇，王”，《釋言》文。朝者，諸侯見王之辭。序雲“役久病於外”，明其所將之人罷病，不能正之使朝，故言將率受王命，東行而征伐，役人罷病，必不能正荊舒使朝於王。王肅雲：“武人，王之武臣徵役者。言皆勞病，東行征伐東國，以困病，不暇修禮而相朝。”此自王肅之說，毛意無以見其為然，正以《詩》中諸言“不皇”多為不暇，故存其說代毛耳。凡諸侯邦交，有相朝之法。此將率當是王之公卿，不得有相朝之禮。且受命出征，務服前敵，無暇相朝，自其常事，不當以此為怨，而列於詠歌。王氏之義，不為長矣。" }
      - { type: j, text: "漸漸之石，維其卒矣。山川悠遠，曷其沒矣？卒，竟。沒，盡也。箋雲：卒者，崔嵬也，謂山巔之末也。曷，何也。廣闊之處，何時其可盡服。○卒，毛子恤反，鄭在律反。崔，罪回反。嵬，五回反，本作“峞”。處，昌慮反。下同。" }
      - { type: j, text: "武人東征，不皇出矣。箋雲：不能正之，令出使聘問於王。" }
      - { type: z, text: "“漸漸”至“出矣”。○毛以為，時遠征戎狄，戍役罷勞。言戎狄之地，有漸漸然險峻之山石，我等登之。維其終竟，言當遍歷此石也。又山之與川，其間悠悠然路復長遠，我所登歷，何時其可盡遍矣。由行不可遍，故久病勞苦也。不但伐戎狄而已，又其武人將率，以役人東征，疲於軍役，而辛苦不暇出而相與為禮也。○鄭以為，漸漸然險峻之山石，維其崔嵬然不可登而上矣，以興戎狄眾強，不可得而伐矣。其荊舒所在之國，山川其道里悠悠然而長遠，雖往伐之，其處廣闊，何時其可盡服之矣。由此，故武人東征之，不能正之，使出聘問於王矣。○傳“卒，竟。沒，盡”。○正義曰：《釋詁》雲：“卒，終也。”終亦竟之義，故云“卒，竟也”。《釋詁》又云：“泯，盡也。”李巡雲：“泯沒之盡。”泯沒義同，故沒為盡也。此經卒、沒之義略同，而“維其”、“曷其”文異者，“維其”言已行當竟之，“曷其”憂行不可盡，勢相接也。○箋“卒者”至“盡服”。○正義曰：箋以上“高矣”類之，則“卒”亦石之形也，故讀為崒。《釋山》雲：“崒者厜<廠義>。”郭璞曰：“謂山峰頭巉巖者。”箋雲：“崒者，崔嵬”，謂山巔之末，雖音字小異，是取《爾雅》為說也。上章言“勞勞廣闊”，此言不可盡服，亦勢相接，故上箋雲言其“不可卒服”，意取於此。" }
      - { type: j, text: "有豕白蹢，烝涉波矣。豕，豬也。蹢，蹄也。將久雨，則豕進涉水波。箋雲：烝，眾也。豕之性能水，又唐突難禁制。四蹄皆白曰駭，則白蹄其尢躁疾者。今離其繒牧之處，與眾豕涉入水之波漣矣。喻荊舒之人，勇悍捷敏，其君猶白蹄之豕也，乃率民去禮義之安，而居亂亡之危。賤之，故比方於豕。○蹢音的，都歷反。烝，之丞反。“將久雨”一本作“天將雨”。能，奴代反，本又作“耐”。駭，戶楷反，《爾雅》、《說文》皆作“豥”，古哀反。躁，子到反。離，力智反。繒，在陵反，《爾雅》“豕所寢曰繒”，《方言》作“橧”，從木，音同。漣，音連，一本作“瀾”，力安反。悍，下旦反。月離於畢，俾滂沱矣。畢，噣也。月離陰星則雨。箋雲：將有大雨，徵氣先見於天。以言荊舒之叛，萌漸亦由王出也。豕既涉波，今又雨使之滂沱，疾王甚也。○滂，普郎反。沱，徒何反。注同。噣，直角反，又音晝，本又作“濁”。見，賢遍反。" }
      - { type: j, text: "武人東征，不皇他矣。箋雲：不能正之，令其守職，不幹王命。○它音他。" }
      - { type: z, text: "“有豕”至“他矣”。○毛以為，此時征伐戎狄，役人勞苦，而有豕豬之白蹄，進而涉入水之波漣之處矣，是在地為將雨之徵也。又直月更離歷於畢之陰星，在天為將雨之候。以此徵候，果致大雨，使其水滂沱而盛矣。己等役人遇之，尤以疲病，不但久勞，又逢大雨，為甚苦之辭也。又王之武人將率，以役人東征，伐荊舒之國，皆以勞病，不暇更有他事矣。故不得相朝為禮也。○鄭以為，荊舒之人似眾豕，其君猶白蹄者。豕之性能水，又唐突難禁制。以荊舒之人性好亂，又勇悍難制服。言有豕之白蹄者，領其眾豕，離其繒牧之處，涉入於水波漣矣。以興荊舒之君，率其眾民，去其禮義之安，居於亂亡之危。矣豕性本自能水，月復離歷於畢星，天又雨之，使滂沱矣。群豕既得此水，彌唐突而難制，以喻荊舒本自好亂，王又為不善之政以加陵之矣，荊舒既被此政，彌彊梁而難服。武人雖則東征，不能正之，使不為他矣。干犯王命，是為他事。言不能正之，使不幹王命。○傳“豕豬”至“水波”。○正義曰：“豕，豬”，《釋獸》文。《釋詁》雲：“烝，進也。”言進涉，是訓烝為進也。毛以下經“月離於畢”為雨徵類之，則此亦雨徵也，故云“天將大雨，則豕進涉波水矣”。並以二經為雨徵，言役人遇雨之勞苦也。○箋“烝眾”至“於豕”。○正義曰：“烝，眾”，《釋詁》文。豕之性能水，言其自好涉波，非雨徵也。以唐突難禁制，喻荊舒之難制服也。《釋獸》釋豕雲：“四蹢皆白，豥。”孫炎曰：“蹢，蹄也。”傳已訓蹢為蹄，故箋即以蹄言之。經直雲白蹢，不雲豥，則白蹢亦不知幾蹄白。而箋引此者，以《爾雅》主為釋《詩》，《詩》中言“豕白蹢”，唯此而已，故知本以訓此也。馬驚謂之駭，則駭者躁疾之言。白蹢名之為豥，是躁疾於餘豕，故云“則白蹄其中尤躁疾者”也。駭與豥字異義同，《釋獸》於豕之下“所寢橧”。舍人曰：“豕所寢草名為橧。”某氏曰：“臨淮人謂野豬所寢為橧。”李巡曰：“豬臥處名橧。”橧是所居之處，牧是所食之地，故云離其橧牧之處，與眾豕涉入水之波漣矣。繒與橧音義亦同。荊舒之人勇悍捷敏者，謂上俗民人勇而剽悍，其舉動便捷敏速。以其性輕，故好叛，難禁制也。其君猶白蹄之豕，言其民猶眾豕也。乃率其臣民，去禮義之安，而居亂亡之危，正謂叛也。諸侯之朝天子，上下相敬，是禮義也。叛違王命，以致征討，是亂亡也。豕者，言獸之尤穢，今以荊舒比之，故賤之。比方於豕，以其餘興喻，立文猶隱。此雲有豕，正是指斥辭，有憎疾之旨，故知有賤之意。○傳“月離”至“則雨”。○正義曰：以畢為月所離而雨，是陰雨之星，故謂之陰星。“月離於畢”，即言“俾滂沱矣”，故知月離陰星則雨也。《洪範》曰：“星有好風，星有好雨”者，即此畢是也。《春秋緯》說雲：“月離於箕，風揚沙。”則好風者箕也，所以箕好風。畢好雨者，鄭《洪範》注云：“風，土也，為木妃；雨，木也，為金妃，故星好焉。”推此而往，南宮好陽，北宮好燠，中宮四季好寒也。是由己所克而得其妃，從其妃之所好故也。鄭知然者，以庶徵曰雨、曰陽、曰燠、曰寒、曰風，而休徵肅時雨若、乂時陽若、晢時燠若、謀時寒若、聖時風若。此肅、乂、晢、謀、聖本之五事，則肅由貌也為木，乂由言也為金，晢由視也為火，謀由聽也為水，聖由思也為土。故《五行傳》以為貌屬木，言屬金，視屬火，聽屬水，思屬土。庶徵亦依此貌、言、視、聽、思為次。鄭由此故云：雨，木氣也，春而施生，故木氣為雨也。陽，金氣也，秋物成而堅，故金氣為陽也。燠，火氣也。寒，水氣也。風，土氣也。凡氣，非風不行，猶金、木、水、火非土不處，故知土氣為風。以此知風土、雨木皆從妃所好。言好，是好樂他辭，非己性也。此庶徵寒燠，即晦明也，加之以陰，則為六氣，故《五行傳》陰屬皇極，故曰“皇之不極，厥罰常陰”，是也。而賈逵、服虔因此及《春秋緯》之文，即以“風，東方；雨，西方”。又云“陰，中央；晦，北方；明，南方”，“唯天陽不變，唯晦明所屬”為當。餘甚謬矣，失之於《書傳》也。○箋“將有”至“王甚”。○正義曰：此與上經相接為喻，言豕性本自能水，又加以滂沱之雨，是豕彌得性，益難禁制。以喻荊舒本自好叛，加以王之不善，是彼彌得志，益難威服。本言滂沱之喻，唯此而已，但詩人言大雨，更生一意。言“月離於畢”，然後天為大雨，是滂沱之雨，萌漸由離畢也。言王為不善，然後荊舒背叛，是叛之萌漸亦由王出也。萌者，事之初，猶物之萌牙，漸而成大也。豕既涉波，今又雨之使滂沱，是疾此雨之甚。言荊舒自好叛，王又使之叛，是疾王之甚。鄭知然者，正以言俾，不然，言雨足矣，何須言使也？○箋“不能”至“王命”。○正義曰：他者，謂職分之外，橫為餘事，棄其所守，干犯王命，是為他矣。故知不能正之，令其守職，不幹王命，即幹王命是他也。" }
      - { type: j, text: "《漸漸之石》三章，章六句。" }
      - { type: j, text: "《苕之華》，大夫閔時也。幽王之時，西戎東夷交侵中國，師旅並起，因之以饑饉。君子閔周室之將亡，傷己逢之，故作是詩也。師旅並起者，諸侯或出師，或出旅，以助王距戎與夷也。大夫將師出，見戎夷之侵周而閔之。今當其難，自傷近危亡。○苕音條，徐音韶，草名。華音花。距音巨。難，乃旦反。下“之難”同。近，附近之近。" }
      - { type: z, text: "“《苕之華》三章，章四句”至“是詩”。○正義曰：言西戎東夷交侵中國，不言南蠻北狄者，下篇序曰：“西夷交侵中國”，則蠻狄亦侵。序於上下相互以明耳。言“西戎東夷交侵中國，師旅並起”，即序首章上二句之事。“因之以饑饉”，卒章下二句是也。“閔周室之將亡”，卒章上二句是也。“傷己逢之”，即首章下二句是也。經、序倒者，序以由師旅饑饉致周室之亡，所以傷之。經則因文以弘義，逢師旅而己傷，乃覆言可傷之事，故言因以饑饉於下，明其彌是可傷。各自為義次也。○箋“師旅並”至“危亡”。○正義曰：以四夷在中國之外，從外內侵，則綠邊諸侯被侵矣。又言師旅並起者，非一之辭，明其非獨王室，故知諸侯或出師，或出旅，以助王距戎與夷也。《周禮》制諸侯從王之法雲：“大國三軍，次國二軍，小國一軍。”今俱出師旅者，《周禮》言其極耳。行則隨時多少，不必盡然。且於時諸侯衰弱，或不能備軍，故才出師、旅也。知大夫將師出，見戎狄之侵周者，以序雲“傷已逢之”，經雲“知我如此，不如無生”。若非身自當之，不應如此深恨，故知身自將師而出，見戎狄交侵，而發憤閔傷也。且上下皆言下國，明此亦下國大夫自將其國之師，故二章箋雲“諸侯微弱，而王之臣當出見也。”是於時王臣未出，不得逢之也。逢之，是身見之辭，故云“今當其難，自傷近危亡”也。" }
      - { type: j, text: "苕之華，芸其黃矣。興也。苕，陵苕也。將落則黃。箋雲：陵苕之華，紫赤而繁。興者，陵苕之幹喻如京師也，其華猶諸夏也，故或謂諸夏為諸華。華衰則黃，猶諸侯之師旅罷病將敗，則京師孤弱。○芸音雲，沈音運。夏，戶雅反。下同。罷音皮。" }
      - { type: j, text: "心之憂矣，維其傷矣！箋雲：傷者，謂國日見侵削。" }
      - { type: z, text: "“苕之華”至“傷矣”。○正義曰：陵苕之英華，本紫赤而繁多，至今亦芸然，其色黃而衰矣。以興周室之諸夏，本兵強國盛，今其師病而微矣。陵華衰則將落，落則苕幹特立矣。諸侯師病則將敗，敗則京師孤弱矣。以周室之盛，忽見如此之衰，故我心為之憂愁矣。維其傷病矣，傷其見侵削也。○傳“苕陵”至“則黃”。○正義曰：《釋草》雲：“苕，陵苕。黃華蔈，白華茇。”舍人曰：“苕，陵苕也。黃華名蔈。白華名茇。別華色之名也。”某氏曰：“《本草》雲‘陵蒔，一名陵苕’。”陸機《疏》雲：“一名鼠尾，生下溼水中，七八月中華紫，似今紫草。華可染皂，煮以沐發即黑。”如《釋草》之文，則苕華本自有黃有白，傳言將落則黃，是初不黃矣。箋雲“陵苕之華，紫赤而繁”。陸機《疏》亦言其華紫色。蓋就紫色之中，有黃紫、白紫耳。及其將落，則全變為黃。以《裳裳者華》言之，則芸為極黃之貌，故將落乃然。○箋“陵苕”至“孤弱”。○正義曰：紫赤而繁華，衰則黃，皆以時事驗知。苕之幹喻京師，華猶諸夏者，以序雲交侵中國，即九州之諸夏也。師旅並起，是諸侯之師起而助王也。華之衛幹，如諸夏之衛京師，故知幹如京師，其華猶諸夏也。又解不以葉喻之意，以其諸夏本亦名諸。華襄四年《左傳》魏絳諫晉侯曰：“諸華必叛。”昭三十年《左傳》子西諫楚王曰：“吳，周之曾裔也，今而始大，比於諸華。”是或謂諸夏為諸華也。謂之夏者，夏，大也。以其中國有禮義之華可嘉大也。《論語》曰：“不如諸夏之亡。”是也。華黃落則苕幹衰，故喻諸夏之師旅罷病將敗，則京師孤弱也。" }
      - { type: j, text: "苕之華，其葉青青。華落，葉青青然。箋雲：京師以諸夏為障蔽。今陵苕之華衰而葉見青青然，喻諸侯微弱，而王之臣當出見也。○青青，子零反。注同。鄣，章亮反。見，賢遍反。下同。" }
      - { type: j, text: "知我如此，不如無生！箋雲：我，我王也。知王之為政如此，則已之生不如不生也。自傷逢今世之難，憂閔之甚。" }
      - { type: z, text: "“苕之”至“無生”。○毛以為，上言華將落，故於此言已落。言陵苕之上，黃華今已殞落矣，唯有葉青青然獨在耳。以興王室之外，諸夏今已喪敗矣，唯有其臣當出見耳。是戎夷之強，侵敗諸夏，藩衛既弱，周室將亡，大夫傷已逢之，故言知我王政之如此，不能撫和戎夷，使諸夏喪敗，不如己之本無生也。自傷生逢今世。○鄭唯以華衰為異。言陵苕之上，黃華其色既巳衰矣，唯其葉見青青然，以興周室之外，諸夏其師既已罷矣，獨王臣當出見。華已衰而葉未殞，猶諸夏已病而王臣未發，明鄣蔽既衰，出亦敗矣。餘同。○傳“華落，葉青青”。○正義曰：事必有漸，物無雨盛。上言將落，則此已落矣。又言其葉，明唯葉在耳，故言“華落，葉青青然”，則毛意以華喻所出之師。上章以華喻師病，此落喻已敗。諸侯既敗，則王臣當出。天下諸侯眾矣，尚不能御之，王兵若出，亦當敗矣，故上章為諸侯未敗，此為已敗。下所以言亡，為事之漸也。宣王之伐蠻狄，皆出王室之兵。此先諸夏，後京師者，王者強盛，則命將征討，諸侯從之。衰弱，則諸侯先自禦寇，王師大急乃出。此則理之常也。且此時戎狄從外而侵，將內及王室，詩人先雲諸侯之敗，見其危之漸耳。○箋“京師”至“出見”。○正義曰：既言苕之華，又言其葉。華之映葉，猶諸夏之葉京師，故言京師以諸夏為鄣蔽。華衰而葉見，故喻諸侯微弱，王臣當出也。易傳者，以經仍雲苕之華，則華猶未落，且華喻諸夏，時諸夏未為皆亡，不可以落喻，故為衰耳。○箋“我我”至“之甚”。○正義曰：知我非詩人自我，而以我為我王者，以逢時多難，非己所為，詩人不當自責，故知我為王之政。人莫不好生，而云己不用生，生非已所裁，而以生為恨，故知巳自傷逢今世也。" }
      - { type: j, text: "牂羊墳首，三星在罶。牂羊，牝羊也。墳，大也。罶，曲梁也，寡婦之笱也。“牂羊墳首”，言無是道也。三星在罶，言不可久也。箋雲：無是道者，喻周已衰，求其復興，不可得也。不可久者，喻周將亡，如心星之光耀，見於魚笱之中，其去須臾也。○牂，子桑反。墳，扶雲反。罶音柳，本又作“霤”。牝，頻忍反。笱音苟。復，扶又反。" }
      - { type: j, text: "人可以食，鮮可以飽！治日少而亂日多。箋雲：今者，士卒人人於晏早皆可以食矣。時饑饉，軍興乏少，無可以飽之者。○鮮，息淺反。治，直吏反。" }
      - { type: z, text: "“牂羊”至“以飽”。○毛以為，諸侯既敗，周室將亡。今牂羊而責其大首，終無是道也。以興周衰而求其大興，亦無此理也。周不復興，其亡亦速。三星之光耀，在於魚罶之中，其去斯須，不可久也。以喻周室之亡期將至，欲望其存，亦不可久也。人於亂世，乏食而飢。人於治世，豐食而飽。今亂日多，故人可粗得食，而治日少，故少可以飽。○鄭下二句為異。言時師旅既起，因之以饑饉，故言此士卒之人，於宴早可以與之食，但時乏少，無可以飽之，是所以可傷也。○傳“牂羊”至“可久”。○正義曰：《釋畜》雲：“羊牡羒，牝牂。”故知牂羊，牝羊也。“墳，大”，《釋詁》文。牝，小羊也。首必稱身，小羊而責大首，必無是道理也。星隨天運，晝夜一週，魚笱之間，蹔見心星之光曜，須臾即過，故言不可久也。○箋“無是”至“須臾”。○正義曰：以此詩主論周衰，故知喻求其復興，不可得也。序言閔周室之將亡，故知不可久者，喻周將亡，其去須臾也。○箋“今者”至“飽之者”。○正義曰：鄭以幽王時恆多禍亂，曾無治時，何得雲治日少乎？所以易毛。" }
      - { type: j, text: "《苕之華》三章，章四句。" }
      - { type: j, text: "《何草不黃》，下國刺幽王也。四夷交侵，中國背叛，用兵不息，視民如禽獸。君子憂之，故作是詩也。○背音佩。" }
      - { type: z, text: "“《何草不黃》四章，章四句”至“是詩”。○正義曰：上言下國，後雲君子，則作者下國君子也。君子無尊卑之限，國君以下，有德者皆是也。言“四夷交侵，中國背叛”，序其用兵之意，於經無所當也。用兵不息，上二章是也。視民如禽獸，下二章是也。經言虎兕及狐，止有獸耳，言禽以足句，且散則獸亦名禽也。" }
      - { type: j, text: "何草不黃，何日不行。箋雲：用兵不息，軍旅自歲始，草生而出，至歲晚矣，何草而不黃乎？言草皆黃也。於是之間，將率何日不行乎？言常行勞苦之甚。" }
      - { type: j, text: "何人不將，經營四方。言萬民無不從役。" }
      - { type: z, text: "“何草”至“四方”。○正義曰：言天下之人，於草生正月之時從役，去時草始生耳。今至十月，何草而不黃乎？言草皆黃矣。去草生，至於草黃，於是之間，將率何日而不行乎？言常行，是勞苦之甚也。又言萬民何人而不為將率所將之，以經營四方乎？言皆為將之以經營也。是非直將率為勞，萬民又甚苦焉。○箋“用兵”至“之甚”。○正義曰：言用兵不息，是用之過久。何草不黃，是見黃而怨。若草大始去，或欲黃乃行，不應見草之黃，嗟怨若此。明草有生死之期，行者睹物而思，故云軍旅自歲始，草生而出，謂正月二月之中也。至歲晚矣，何草而不黃乎？草皆黃矣，是九月十月之中也。氣則時經寒熱，物則革變死生，日月長久，徵行不息，是其所以怨也。故云“於是之間，將率何日不行乎？是其勞苦之甚也”。知此句謂將率者，以言何日不行，明行者有人。下雲“何人不將”，為人所將，則是士卒也。下句既為士卒，知此為將率也。" }
      - { type: j, text: "何草不玄，何人不矜。箋雲：玄，赤黑色。始春之時，草牙孽者將生，必玄於此時也，兵猶復行。無妻曰矜。從役者皆過時不得歸，故謂之矜。○矜，古頑反。注同。孽，魚列反。復，扶又反。" }
      - { type: j, text: "哀我征夫，獨為匪民。箋雲：征夫，從役者也。古者師出不逾時，所以厚民之性也。今則草玄至於黃，黃至於玄，此豈非民乎？" }
      - { type: z, text: "“何草”至“匪民”。○正義曰：將率以草黃之時，既不得歸，又至明年之春。言今何草不玄，言眾草將生而皆玄之也。於此之時，何人而不為矜耳。言皆矜也。久而不歸，失夫婦之道，而皆為矜夫也。既久役如此，哀我徵行之夫，豈獨為非民乎！若亦是民，當休息，何為使之從役，久而不得歸也？○箋“玄赤”至“之矜”。○正義曰：鄭於《冬官·鍾氏》注差約之雲：“玄色，在緅緇之間，其六入者與？”三人赤，三人黑，故云“玄，赤黑色”。《春秋·元命苞》、《稽耀嘉》皆雲：“夏以十三月為正。”物生色黑，故知始春之時，草牙孽者，將生必玄也。《釋天》雲：“九月為玄。”孫炎曰：“物衰而色玄也。《詩》曰‘何草不玄’，與此始春之言不同者，《爾雅》所言月名，皆不以草色。”李巡曰：“九月萬物草盡，陰氣侵寒，其色皆黑。”是陰而氣寒之黑，不由草玄色，孫炎之言謬矣。無妻曰矜，《書傳》及《王制》文。彼言老，宜為六十之外。禮，六十不與服戎。自六十以下，不必皆老，但行役過時，久不得歸，與無妻者同，故謂之矜也。舜年三十，以無室家之端，《書》亦謂之“有鰥在下”。矜與鰥，古今字。○箋“古者”至“民乎”。○正義曰：隱五年《穀梁傳》曰：“古者征伐不逾時”。是古者師出不逾時也，所以厚愛民之性命，恐勞苦故也。今草玄至於黃，黃又至於玄，期年不歸，是為非民，言其不厚之也。" }
      - { type: j, text: "匪兕匪虎，率彼曠野。兕、虎，野獸也。曠，空也。箋雲：兕虎，比戰士也。○兕，徐履反。" }
      - { type: j, text: "哀我征夫，朝夕不暇。" }
      - { type: z, text: "“匪兕”至“不暇”。○正義曰：言我此役人，若是野獸，可常在外。今非是兕，非是虎，何為久不得歸，常循彼空野之中，與兕虎禽獸無異乎？時既視民如禽獸，故哀我此徵行之夫，朝夕常行而不得閒暇。○傳“兕、虎，野獸”。○正義曰：傳言野獸者，解本舉此之意，以役人不宜在野，故言視民如禽獸也。許慎雲：“兕，野牛。其皮堅厚，可為鎧。”《釋獸》雲：“兕似牛。”某氏曰：“兕牛千斤。”郭景純雲：“一角，青色，重千斤是也。”○箋“兕、虎，比戰士”。○正義曰：序雲“視民如禽獸”，則直取在野以比之。而下章以狐比有棧之車，則比中各自取象，故云“兕、虎，比戰士”，取其猛也。" }
      - { type: j, text: "有芃者狐，率彼幽草。有棧之車，行彼周道。芃，小獸貌。棧車，役車也。箋雲：狐草行草止，故以比棧車輦者。○芃，薄紅反，沈又扶東反。棧，士板反。“輦者”，一本作“輦車”。" }
      - { type: z, text: "“有芃”至“周道”。○正義曰：有芃芃然而小者，當狐也。此狐本是草中之獸，故可循彼幽草。今我有棧之輦車，人挽以行。此人本非禽獸，何為行彼周道之上，常在外野，與狐在幽草同乎？故傷之也。○傳“芃小”至“役車”。○正義曰：以芃是狐之狀，非大獸，故言“芃，小獸貌”也。此言用兵不息，明此車，士卒供役之車，故云“棧車，役車”。○箋“狐草”至“輦者”。○正義曰：以上言“率彼曠野”，而此又云“幽草”，明義取於草。以狐草行草止，故比輦者亦道行道止，故以幽草與周道相對也。故《周官·鄉師》雲：“大軍旅，會同，正治其徒役，與其輦輦。”注云：“輦人挽行，所以載任器。止以為蕃營。”是行止常依於道，似狐之依於草也。以循草比人，故知比輦者也。《鄉師》注引《司馬法》曰：“夏后氏謂輦曰余車，殷曰胡奴車，周曰輜輦。輦一斧、一斤、一鑿、一梩、一鋤。周輦加二板、二築。”又曰：“夏后氏二十人而輦，殷十八人而輦，周十五人而輦。”是軍行必有輦，皆人挽以行也。《春官·巾車》王后五路有輦，雖載任，與此不同，亦人挽以行，故謂之輦也。若然《巾車》言“服車五乘”，有“士乘棧車，庶人乘役車”。注云：“服車者，服事者之車。棧車，不革挽而漆之。役車，方箱可載任器以供役。”以此言之，則彼自有棧車，何知此非彼者？以彼棧車，士之所乘以服事，非此軍旅徒役所當有，以此知非《巾車》之棧車也。若然，傳雲“棧車，役車”，則與彼庶人役車同。又知非彼役車者，以役車庶人之所乘，但庶人賤，以供役為名耳，非輦者也，即《唐·蟋蟀》言“役車其休”，是矣。彼不以人挽，故知不與此同。此謂從軍供役之輦車耳，有棧，是車狀，非士所乘之棧名也。" }
      - { type: j, text: "《何草不黃》四章，章四句。" }
      - { type: j, text: "《魚藻之什》十四篇，六十二章，三百二句。" }
