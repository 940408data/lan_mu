# 儀禮注疏卷7（賈公彥疏）：j 為經文＋鄭玄注，z 為疏文。
sections:
  - id: juan7
    name: 正文
    blocks:
      - { type: z, text: "《士相見禮》第三。○鄭《目錄》雲：“士以職位相親，始承摯相見禮。《雜記》會葬禮曰：相見也，反哭而退，朋友虞祔而退。士相見於五禮屬賓禮。大、小戴及《別錄》皆第三。”○釋曰：鄭雲“士以職位相親，始承摯相見”者，釋經亦有大夫及庶人見君之禮，亦士見大夫之法，獨以《士相見》為名者，以其兩士職位不殊，同類暱近，故以《士相見》為首。雲“《雜記》：相見也，反哭而退，朋友虞祔而退”者，以送葬之禮，恩厚者退遲，恩薄者退疾。引之者，證有執摯相見之義也。雲“士相見於五禮屬賓禮”者，案《周禮·大宗伯》“五禮”賓禮之別有八：春朝、夏宗、秋覲、冬遇、時會、殷同，此六者，是五等諸侯見天子，兼有自相朝覲之禮。彼又云“時聘曰問，殷覜曰視”二者是諸侯使臣出聘，天子及自相聘之禮，並執玉帛而行，無執禽摯之法。此屬直新升為士大夫之等，同國執禽摯相見及見君之禮，雖非出聘，亦是賓主相見之法，故屬賓禮也。且士卑，唯得作介，從君與卿大夫出向他國，無身自聘問之事。案《周禮》行夫是士官，其有美惡無禮，特行無介，始得出向他邦，亦非聘問之法也。然昏、冠及喪、祭，尊卑各自有禮，及執摯相見，唯有此《士相見》。其篇內含卿大夫相見，以其新升為士，或士自相見，或士往見卿大夫，或卿大夫下見士，或見己國君，或士大夫見他國君來朝者，新出仕從微至著，以士為先後，更有功乃升為大夫已上，故以士為總號也。又天子之孤卿、大夫、士與諸侯之孤卿、大夫、士，執摯既同，相見之禮亦無別也。" }
      - { type: j, text: "士相見之禮。摯，冬用雉，夏用腒。左頭奉之，曰：“某也原見，無由達。某子以命命某見。”摯，所執以至者，君子見於所尊敬，必執摯以將其厚意也。士摯用雉者，取其耿介，交有時，別有倫也。雉必用死者，為其不可生服也。夏用腒，備腐臭也。左頭，頭，陽也。無由達，言久無因緣以自達也。某子，今所因緣之姓名也。以命者，稱述主人之意。今文頭為脰。" }
      - { type: z, text: "“士相見”至“某見”。○釋曰：自此至“送於門外再拜”，論士與士相見之事也。雲“某也原見，無由達”者，謂新升為士，欲見舊為士者，謂久無紹介中閒之人達彼此之意，雖原見，無由得與主人通達相見也。雲“某子以命命某見”者，某子是紹介中閒之人姓名，以主人之命命某，是賓之名命某來見主人也。案《少儀》“始見君子者，辭曰：某固原聞名於將命”者，謂以卑見尊法。彼又云“敵者曰：某固願見”於將命者，此兩士相見，亦是敵者。不言原見於將命者者，此既言願見，無由達見敵者始欲相見。案下文及還摯者，皆雲於將命者，明此亦有原見於將命者，不言者，文不具也。○注“摯所”至“為脰”。○釋曰：雲“摯，所執以至”者，摯得訓為至，升為士者元缺一字彼人相見，欲相尊敬，必執禽鳥始得至，故云摯所執以至者也。雲“士摯用雉”者，對大夫已上所執羔、雁不同也。雲“取其耿介，交有時，別有倫也”者，倫，類也。交接有時，至於別後，則雄雌不雜，謂春交秋別也。士之義亦然，義取耿介不犯於上也。雲“雉必用死者，為其不可生服也”者，經直雲冬用雉，知用死雉者，《尚書》雲：“三帛、二牲、一死摯。”則雉，義取耿介，為君致死也。雲“夏用腒，備腐臭也”者，案《周禮·庖人》雲：“春行羔豚，夏行腒鱐。”鄭雲：“腒，乾雉。鱐乾魚。”腒鱐熱而乾，乾則不腐臭，故此取不腐臭也。冬時雖死，形體不異，故存本名，稱曰雉。夏為乾腒，形體異，故變本名稱曰腒也。雲“左頭，頭，陽也”者，《曲禮》雲“執禽者左首”，雉與羔、雁同是合生執之物，以不可生服，故殺之雖死，猶尚左以從陽也。雲“某子，今所因緣之姓名也”者，謂紹介之姓名。雲“以命者，稱述主人之意”者，言紹介之人稱述主人之辭意傳來賓也。雲“今文頭為脰”者，鄭不從今文者，以其脰，項也，項不得為頭，故不從也。但此雲某子以命命某見，謂舊未相見，今始來見主人，故須某子傳，通孺悲欲見孔子，不由紹介，故孔子辭以疾。且經雲某子，鄭雲某子，今所因緣之姓名。案《鄉飲酒》雲“某子受酬”，注云：“某者，眾賓姓。”又《鄉射》雲“某酬某子”，注云：“某子者，氏也。”與此注某子為姓名不同者。彼旅酬下為上，尊敬在上，以《公羊傳》：“名不若字，字不若子。”故下者稱姓，以配子，彼對面語，故不言名。此非對面之言，於彼遙稱紹介之意，若不言名，直稱姓是何人，故鄭以姓名解之也。若然，《特牲》雲“皇祖某子”，注為伯子、仲子者，以孫不宜云父祖姓，故以伯子、仲子言之，望經為義，故注有殊。若然，注宜有名，無者誤也。" }
      - { type: j, text: "主人對曰：“某子命某見，吾子有辱。請吾子之就家也，某將走見。”有，又也。某子命某往見，今吾子又自辱來，序其意也。走，猶往也。今文無走。" }
      - { type: z, text: "“主人”至“走見”。○釋曰：雲“某子命某見”者，某子則是紹介姓名，以某子是中閒之人，故賓主共稱之也。此上下皆言請，不言辭。辭而不受，須相見，故言請而已。○注“有又”至“無走”。○釋曰：鄭轉有為又者，以言某子以命命某，往就彼見吾子，又自辱來，於義為便，故從又，不從有也。雲“走，猶往也”者，以言走，直取急往相見之意，非走驟之義，故釋從往也。雲“今文無走”字者，無走，於文義不足，故不從今文從古文也。" }
      - { type: j, text: "賓對曰：“某不足以辱命，請終賜見。”命，謂請吾子之就家。" }
      - { type: j, text: "主人對曰：“某不敢為儀，固請吾子之就家也，某將走見。”不敢為儀，言不敢外貌為威儀，忠誠欲往也。固，如故也。今文不為非，古文雲“固以請”也。" }
      - { type: z, text: "注“不敢”至“以請”。○釋曰：固如故也者，固為堅固，堅固則如故，以再請如前，故云固如故也。雲“今文不為非”者，雲非敢於義不便，故不從今文非也。雲“古文雲‘固以請’”者，固請於文從便，若有以字於文賒緩，故不從古文“固以請”也。" }
      - { type: j, text: "賓對曰：“某不敢為儀，固以請。”言如固請終賜見也。今文不為非。" }
      - { type: j, text: "主人對曰：“某也固辭，不得命，將走見。聞吾子稱摯，敢辭摯。”不得命者，不得見許之命也。走，猶出也。稱，舉也。辭其摯，為其大崇也。古文曰“某將走見”。" }
      - { type: z, text: "注“不得”至“走見”。○釋曰：雲“走猶出也”者，亦如上之走往，披據句賓家，故走為往，此據出門，故云走猶出也。雲“辭其摯，為其大崇也”者，凡賓主相見，唯此新升為士有摯，又初不相識，故有摯為重。對重相見，則無摯為輕。是以始相見，辭之為大崇，故也。雲“古文曰‘某將走見’”者，上再番皆雲“某將走見”，今此三者亦云“某將走見”，與前同，此疊古文不從者，以上第一番請賓主皆無“不敢為儀”，第二番賓及主人皆雲“不敢為儀”，文句既異，若不雲某，於文不便，故須雲某也。此三番於上已雲某也，固辭不得命，於下不須雲某，於文便，古文更雲“某將走見”，文疊，故不從也。" }
      - { type: j, text: "賓對曰：“某不以摯不敢見。”見於所尊敬而無摯，嫌大簡。" }
      - { type: z, text: "注“見於”至“大簡”。○釋曰：此士相見唯是平敵相伉，案《曲禮》雲：“主人敬客則先拜客，客敬主人則先拜主人。”並不問爵之大小，唯以相尊敬為先後，故雖兩士，亦得雲相尊敬，不敢空手，須以摯相見。若無摯相見，是則大簡略也。" }
      - { type: j, text: "主人對曰：“某不足以習禮，敢固辭。”言不足習禮者，不敢當其崇禮來見己。" }
      - { type: z, text: "注“言不”至“見己”。○釋曰：案上經賓雲某不以摯不敢見，是賓以崇禮來見主人。今主人不敢當其崇禮來見己，故變文言“不足以習禮”，故鄭雲言不足習禮者，不敢當其崇禮來見已也。" }
      - { type: j, text: "賓對曰：“某也不依於摯不敢見，固以請。”言依於摯，謙自卑也。今文無也。" }
      - { type: z, text: "注“言依”至“卑也”。○釋曰：凡相見之禮，以卑見尊必依摯。《禮記·檀弓》雲“魯人有周豐也者，哀公執摯請見之”者，是下賢，非正法。今《士相見》雲“不依於摯不敢見”，謙自卑也。" }
      - { type: j, text: "主人對曰：“某也固辭，不得命，敢不敬從！”出迎於門外，再拜。賓答再拜。主人揖，入門右。賓奉摯，入門左。主人再拜受。賓再拜送摯，出。右，就右也。左，就左也。受摯於庭，既拜受，送則出矣。不受摯於堂，下人君也。今文無。" }
      - { type: z, text: "注“右就”至“無文”。○釋曰：凡門出，則以西為右，以東為左；入門則以東為右，以西為左，依賓西主東之位也。知“受摯於庭”者，以其入門左右，不言揖讓而升之事，故知在庭也。雲“既拜，送則出矣”者，欲見賓拜送摯訖而言出，則去還家，無意得待主人留己也。雲“不受摯於堂，下人君也”者，《聘禮》賓升堂致命授玉，又下雲君在堂升見無方階，亦是升堂見君法，故云不升堂下人君也。" }
      - { type: j, text: "主人請見，賓反見，退。主人送於門外，再拜。請見者，為賓崇禮來，相接以矜莊，歡心未交也。賓反見，則燕矣。下雲“凡燕見於君”至“凡侍坐於君子”，博記反見之燕義，臣初見於君，再拜，奠摯而出。" }
      - { type: z, text: "“主人請見”至“再拜”。○注“請見”至“而出”。○釋曰：鄭解主人留賓之意。雲“請見”者，為賓崇禮來相接，則執摯來是也。雲“以矜莊，歡心未交也”者，正謂入門拜受，拜送時賓主俱矜莊相敬，歡心未交也。雲“賓反見，則燕矣”者，上《士冠》禮賓、《士昏》納采之等，《禮記》皆有禮賓、饗賓之事，明此行禮，主人留必不虛，宜有歡燕，故云則燕矣。以摯相見，非聘問之禮。燕既在寢，明前相見亦在寢之庭矣。若諸文有留賓者，多是禮賓之事，知此不行禮賓而云燕者，彼諸文皆是為餘事相見，以其事重，故為禮賓。此直當身相見，其事輕，故直有燕矣。是以諸文禮賓，此燕賓，故直雲“請見”也。雲“‘凡燕見於君’至‘反見之燕義’”者，凡燕見，或反見，或本來侍坐，非反見，下注雲“此謂特見圖事，非立賓主之燕”是也。侍坐於君子之下，乃有侍坐、問夜、膳葷、賜食爵之等，不引證燕見者，彼直是侍坐法，非燕見之禮故也。雲“臣初見於君，再拜，奠摯而出”者，鄭欲見自“燕見於君”下至“凡侍坐於君子”皆反見燕法，其中仍有臣見於君法，臣始事見於君法，禮畢，奠摯而出，君亦當遣人留之燕也。若然，下有他邦之人則還摯，雖不見反燕，臣尚燕他邦，有燕可知，但文不具也。" }
      - { type: j, text: "主人復見之，以其摯，曰：“曏者吾子辱，使某見。請還摯於將命者。”復見之者，禮尚往來也。以其摯，謂曏時所執來者也。曏，曩也。將猶傳也。傳命者，謂擯相者。" }
      - { type: z, text: "“主人”至“命者”。○釋曰：自此至“賓退送再拜”論主人還於賓之事。○注“復見”至“相者”。○釋曰：雲“復見之者，禮尚往來也”者，鄭解主人還摯之意，雲“禮尚往來”，《曲禮》文。五等諸侯，身自出朝及遣臣出聘，以其圭璋重，不可遙復，朝聘訖，即還之。璧琮財輕，故不還。彼朝聘用玉，自為一禮，有不還之義，其在國之臣，自執摯相見，雖禽摯皆還之。臣見於君，則不還。義與朝聘異，不可相決也。雲“將猶傳也。傳命者，謂擯相者”者，謂出接賓曰擯，入詔禮曰相，一也。故《聘禮》與《冠義》皆雲每一門止一相，是謂擯介為相也。" }
      - { type: j, text: "主人對曰：“某也既得見矣，敢辭。”讓其來答己也。" }
      - { type: z, text: "“主人”至“敢辭”。○釋曰：上言主人，此亦言主人者，上言主人者據前為主人而言。此雲主人者，謂前賓今在己家而說也。" }
      - { type: j, text: "賓對曰：“某也非敢求見，請還摯於將命者。”言不敢求見，嫌褻主人，不敢當也。今文無也。" }
      - { type: z, text: "注“言不”至“當也”。○釋曰：雲“嫌褻主人，不敢當也”者，曏者主人見己，今即來見主人，賓主頻見，是褻也。今雲“非敢求見”，嫌褻主人，不敢更相見也，故不敢當相見之法，直雲“還摯”而已。" }
      - { type: j, text: "主人對曰：“某也既得見矣，敢固辭。”固，如故也。賓對曰：“某不敢以聞，固以請於將命者。”言不敢以聞，又益不敢當。" }
      - { type: z, text: "注“言不敢”至“敢當”。○釋曰：上雲“非敢求見”，已是不敢當，此雲“不敢以聞”，耳聞疏於目見，故云“又益不敢當”也。" }
      - { type: j, text: "主人對曰：“某也固辭，不得命，敢不從。”許受之也。異日則出迎，同日則否。" }
      - { type: z, text: "注“異日”至“則否”。○釋曰：下雲“賓奉摯入”，不言主人出迎，又不言厥明，是與前相見同日。知異日出迎者，《鄉飲酒禮》雲：明日，乃息司正，主人出迎之。司正猶迎之，況同僚乎，是知異日出迎也。若然，《聘禮》公迎於大門內，至禮賓又出迎者，彼初是公迎，彼初之命不為迎賓身，故至醴賓身，雖同日亦出迎之，故鄭注云公出迎者，已之禮更端是也。《昏禮》賓為男家使，初時出迎，至醴賓身，雖同日亦出迎也。《有司徹》前為屍，後為賓，所為異，故云雖同日亦出迎。此二者亦是更端之義也。案《鄉飲酒》及《公食大夫》皆於戒賓之時，未行賓主之禮，是以賓至乃迎之，故雖同日，亦迎賓，非更端之義也。" }
      - { type: j, text: "賓奉摯入，主人再拜受。賓再拜送摯，出。主人送於門外，再拜。士見於大夫，終辭其摯。於其入也，一拜其辱也。賓退，送，再拜。終辭其摯，以將不親答也。凡不答而受其摯，唯君於臣耳。大夫於士，不出迎。入一拜，正禮也。送再拜，尊賓。" }
      - { type: z, text: "“士見於大夫”至“再拜”。○注“終辭”至“尊賓”。○釋曰：雲“以將不親答也”者，事未至謂之將，如上《士相見》賓來見士，後將親答就士家，則辭而受其摯。此則以將不親答，終不受也。若然，經直雲“終辭其摯”，不言一辭、再辭，亦有可知，但略而不言也。又《少儀》雲始見君子曰“願聞名”此不言願聞，亦文不具也。雲“凡不答而受其摯，唯君於臣耳”者，見下文“他邦之人則使擯者還其摯”，見己君不言還摯。又文有三辭：初辭、中辭、終辭。初辭之時，則雲“使某”，中辭雲“命某”，以辭在中者，傳言而已，故云“命某”。然使某者是尊君卑臣之義，其心重。若雲“命某”者，尊君卑臣，稍淺漸輕之義，故鄭雲或言命某傳言耳。必知有此義者，案僖九年《左傳》曰：“天子有事於文武，使孔賜伯舅胙。”以伯舅耋老，加勞賜一級，無下拜，是尊君。稱使傳言，雲命有輕重之義也。" }
      - { type: j, text: "若嘗為臣者，則禮辭其摯，曰：“某也辭，不得命，不敢固辭。”禮辭，一辭其摯而許也。將不答而聽其以摯入，有臣道也。賓入，奠摯，再拜。主人答壹拜。奠摯，尊卑異，不親授也。古文壹為一。賓出，使擯者還其摯於門外，曰：“某也使某還摯。”還其摯者，闢正君也。賓對曰：“某也既得見矣，敢辭。”辭君還其摯也。今文無。擯者對曰：“某也命某，某非敢為儀也。敢以請。”還摯者請使受之。賓對曰：“某也夫子之賤私，不足以踐禮，敢固辭。”家臣稱私。踐，行也。言某臣也，不足以行賓客禮。賓客所不答者，不受摯。擯者對曰：“某也使某，不敢為儀也。固以請。”言使某，尊君也。或言命某，傳言耳。" }
      - { type: j, text: "賓對曰：“某固辭，不得命，敢不從！”再拜受。受其摯而去之。" }
      - { type: z, text: "注“受其摯而去之”。○釋曰：雲“受其摯而去”者，以其嘗為臣為輕，既不受其摯，又相見無饗燕之禮，故鄭雲而去以絕之也。" }
      - { type: j, text: "下大夫相見，以雁，飾之以布，維之以索，如執雉。雁，取知時，飛翔有行列也。飾之以布，謂裁縫衣其身也。維，謂系聯其足。" }
      - { type: z, text: "“下大夫”至“執雉”。○釋曰：言“下大夫”者，國皆有三卿五大夫。言上大夫，據三卿，則此下是五大夫也。二十七士與五大夫轉相副貳，則三卿宜有六大夫，而五者，何休雲：司馬事省，闕一大夫。○注“雁取”至“其足”。○釋曰：雲“雁，取知時”者，以其木落南翔，冰泮北徂，隨陽南北，義取大夫能從君政教而施之。雲“飛翔有行列也”者，義取大夫能依其位次，尊卑有敘也。上士執雉，左頭奉之，此雲“如執雉”，明執雁者亦左頭奉之也。案《曲禮》雲：“飾羔雁者以繢。”彼天子卿大夫，非直以布，上又畫之，此諸侯卿大夫執摯，雖與天子之臣同飾羔雁者，直用布為飾，無繢。彼不言士，則天子之士與諸侯之士同，亦無飾。士賤，故無別也。" }
      - { type: j, text: "上大夫相見，以羔，飾之以布，四維之，結於面，左頭，如麛執之。上大夫，卿也。羔取其從帥，群而不黨也。面，前也。系聯四足，交出背上，於焜前結之也。如麛執之者，秋獻麛，有成禮，如之。或曰麛，孤之摯也。其禮蓋謂左執前足，右執後足。今文頭為脰。" }
      - { type: z, text: "“上大夫”至“執之”。○注“上大”至“為脰”。○釋曰：雲“上大夫，卿也”者，即三卿也。雲“羔取其從帥”者，凡羔羊群皆有引帥，若卿之從君之命者也。雲“群而不黨也”者，羊羔群而不黨，義取三卿亦皆正直，雖群居不阿黨也。雲“系聯四足，交出背上，於胸前結之”者，謂先以繩雙系前兩足，復以繩系後兩足，乃以雙繩於左右從腹下向背上交過，於胸前結之也。雲“如麛執之者，秋獻麛，有成禮，如之”者，案《周禮·獸人》雲：“冬獻狼，夏獻麋，春秋獻獸物。”鹿、豕、群獸及狐狸可也。麛是鹿子，與鹿同時獻之，又《庖人》雲“秋行犢麛”，則獻當在秋時，故云秋獻麛也。又案《禮器》“曲禮三千”，鄭雲：“曲猶事也。事禮謂今禮也，其中事儀三千。”則禮未亡之時，三千條內有此獻麛之法，是有成禮可依，故此經得如之也。雲“或曰麛，孤之摯也”者，案《大宗伯》及《大行人》與《聘禮》皆雲孤執皮帛，謂天子之孤與諸侯之孤執皮帛。今此執麛者，謂新升為孤，見己君法，至餘事則皆皮帛也。雲“其禮蓋謂左執前足，右執後足”者，案經雲左頭則與雉、雁同，是以《曲禮》雲“執禽者左首”。此鄭又云執之，蓋謂左執前足，右執後足者。元缺起此此釋經麛執之，據四足而言之。凡以摯相見之法，唯有新升為臣，及聘朝，及他國君來，主國之臣見，皆執摯相見。常朝及餘會聚皆執笏，無執摯之禮。又執摯者，或平敵，或以卑見尊，皆用摯。尊無執摯見卑之法。《檀弓》雲哀公執摯見己臣周豐者，彼謂下賢，非正法也。" }
      - { type: j, text: "如士相見之禮。大夫雖摯異，其儀猶如士。" }
      - { type: z, text: "“如士相見之禮”。○釋曰：此下大夫及卿，其摯雖有羔、雁之異，其相見之儀則皆如士也。○注“大夫”至“如士”。○釋曰：雲“儀猶如士”者，或兩大夫，或兩卿相見，皆如上文“某也原見無由達己”下至“主人拜送於門外”也。" }
      - { type: j, text: "始見於君，執摯，至下，容彌蹙。下，謂君所也。蹙猶促也，促，恭愨貌也。其為恭，士、大夫一也。" }
      - { type: z, text: "注“下謂”至“一也”。○釋曰：直雲“見於君”，不辨臣之貴賤，則臣之貴賤皆同。故鄭雲“其為恭，士大夫一也”。不言所而言“下”者，凡臣視袷已下，故不言所、言下也。" }
      - { type: j, text: "庶人見於君，不為容，進退走。容，謂趨翔。" }
      - { type: z, text: "注“容謂趨翔”。○釋曰：此不言民而言庶人，則是庶人在官，謂若《王制》雲：“庶人在官者，其祿以是為差。”即府史胥徒是也。按鄭注《曲禮》雲：“行而張足曰趨，行而張拱曰翔。”皆是庶人貌也。此庶人見君不趨翔，謂是常法。《論語》是孔子行事，而云“趨進翼如”者，彼謂孔子與君圖事於堂，圖事訖，降堂，向時揖處至君前橫過，向門，特加肅敬，與庶人同也。" }
      - { type: j, text: "士大夫則奠摯，再拜稽首，君答壹拜。言君答士大夫一拜，則於庶人不答之。庶人之摯鶩。古文壹作一。" }
      - { type: z, text: "注“言君”至“作一”。○釋曰：臣拜君雲再拜稽首，則君答一拜者，當作空首，則九拜中奇拜是也。雲“言君答士大夫一拜則於庶人不答之”者，案《曲禮》“君於士不答拜”，謂己士。此得與大夫同答一拜者，士賤，君不答拜。此以新升為士，故答拜。《聘禮》問勞雲答士拜者，亦以新使反，故拜之也。雲“庶人之摯鶩”者，案《大宗伯》雲“以禽作六摯，庶人執鶩”，注云：“鶩取其不飛遷。”象庶人安土重遷是也。" }
      - { type: j, text: "若他邦之人，則使擯者還其摯，曰：“寡君使某還摯。”賓對曰：“君不有其外臣，臣不敢辭。”再拜稽首，受。" }
      - { type: z, text: "釋曰：賓不辭即受摯，以君所不臣，禮無受他臣摯法，賓如此法，故不敢亢禮於他君，故不辭即受之也。凡臣無境外之交，今得以摯執見他邦君者，謂他國之君來朝，此國之臣因見之，謂若《掌客》“卿皆見以羔”之類是也。《春秋》卿、大夫與他國之君相見者，皆因聘會乃見之，非特行也。" }
      - { type: j, text: "凡燕見於君，必辯君之南面。若不得，則正方，不疑君。辯猶正也。君南面，則臣見正北面。君或時不然，當正東面，若正西面，不得疑君所處邪鄉之。此謂特見圖事，非立賓主之燕也。疑，度之。" }
      - { type: z, text: "釋曰：案上文注以此為博記反見之燕義，則此與燕義、燕禮立賓主之燕，別以其此經君之面位正南，臣北面向之。若不得南面，或君東、西面，則臣亦正方向之，不可預度君之面位，邪立向之，皆與《燕禮》君在阼階西面為正異，故知此經是特見，皆圖事，並與賓反見之燕義也。知有“圖事”者，《論語·鄉黨》雲孔子與君圖事於庭、圖事於堂，《燕禮》亦云君與卿同事之時，有此面位無常之法也。" }
      - { type: j, text: "君在堂，升見無方階，辯君所在。升見，升堂見於君也。君近東，則升東階。君近西，則升西階。" }
      - { type: z, text: "注“升見”至元缺止此“西階”。○釋曰：此文據君所在，隨便升階，無常之事，亦謂反燕及圖事之法。若立賓主，君升自阼階，賓及主人升自西階，《燕禮》所云是也。" }
      - { type: j, text: "凡言，非對也，妥而後傳言。凡言，謂己為君言事也。妥，安坐也。傳言，猶出言也。若君問，可對則對，不待安坐也。古文妥為綏。" }
      - { type: z, text: "“凡言”至“傳言”。○注“凡言”至“為綏”。○釋曰：此據臣與君言之法也。雲“凡言”，謂己為君言事也者，謂臣有圖，為君言也。《禮記·少儀》雲：“量而後入，不入而後量。”是臣有事將入見君，須量己所言，亦當量君安坐，乃可得入，而後傳出己言，向君道之。雲“妥，安坐也”者，《爾雅·釋詁》文。" }
      - { type: j, text: "與君言，言使臣。與大人言，言事君。與老者言，言使弟子。與幼者言，言孝弟於父兄。與眾言，言忠信慈祥。與居官者言，言忠信。博陳燕見言語之儀也。言使臣者，使臣之禮也。大人，卿大夫也。言事君者，臣事君以忠也。祥，善也。居官，謂士以下。" }
      - { type: z, text: "“與君”至“忠信”。○釋曰：上文據與君言，此文則總說尊卑言語之別。雲“與君言，言使臣。與大人言，言事君”者，但君臣相對，有事即言，不必與君言恆言使臣，與臣言恆言事君。今唯言使臣、事君者，下供上命，禮法當然，故君以使臣為主，臣以事君為正，無妨更言。餘事已下，皆隨事為主可也。雲“與老者言，言使弟子”者，謂七十致仕之人，依《書》傳：大夫致仕為父師，士致仕為少師，教鄉間子弟。雷次宗雲：學生事師，雖無服，有父兄之恩，故稱弟子也。雲“與幼者言，言孝弟於父兄”者，幼既與老者相對，此幼即弟子之類，孝弟事父兄之名，是人行之本，故云言孝弟於父兄。“與眾言，言忠信慈祥”者，此文承老幼之下，亦非朝廷之臣，但是鄉閭長幼共聚之處，使之行忠信慈善之事也。雲“與居官者言，言忠信”者，此與在朝之士，言以忠信為主也。○注“博陳”至“以下”。○釋曰：雲“博陳燕見言語之儀也”者，據已上博陳與君燕見舉動言語，知此博陳也。雲“言使臣者，使臣之禮也”者，並事君以忠，並是《論語》孔子對定公之文。雲“大人，卿大夫也”者，此雲“言事君”，明非天子諸侯，又非士，是卿大夫可知。又案下文雲“凡與大人言，始視面，中視抱，卒視面”，並是臣視君之法，則大人據君也。又《禮運》雲：“大人世及以為禮。”鄭解為諸侯者，以彼上文雲“天下為家”，以據天子，明下雲大人是諸侯可知。《易·革卦》雲“君子豹變”據諸侯，則大人虎變是天子可知。又案《論語》雲“狎大人”，注為天子諸侯為政教者，彼據小人不在朝廷，故以大人為天子諸侯政教解之。鄭皆望文為義，故解大人不同。雲“居官，謂士以下”者，以上大夫雲事君，已據居官，卿大夫其居官之內，唯有二十七士並府史胥徒，故云士以下也。" }
      - { type: j, text: "凡與大人言，始視面，中視抱，卒視面，毋改。眾皆若是。始視面，謂觀其顏色可傳言未也。中視抱，容其思之，且為敬也。卒視面，察其納己言否也。毋改，謂傳言見答應之閒，當正容體以待之，毋自變動，為嫌解惰不虛心也。眾，謂諸卿大夫同在此者。皆若是，其視之儀無異也。古文毋作無，今文眾為終。" }
      - { type: z, text: "“凡與”至“若是”。○注“始視”至“為終”。○釋曰：雲“中視抱，容其思之，且為敬”者，案《曲禮》：“天子視不上於袷。”袷，交領也。“不下於帶”，上於袷則敖，下於帶則憂。視大夫得視面。此視君得視面者，彼據尋常視君法，此據與君言時，故不同也。雲“且為敬”者，此言抱即面相袷，不視袷是敬君之常禮，故云且為敬也。雲“為嫌解惰不虛心也”者，《禮記》雲“虛中以治之”，鄭注云：“虛中，言不兼念餘事。”是虛心之意也。雲“眾，謂諸卿大夫同在此”者，言於君視之高下如此，其卿大夫視君之儀與言者無異也。雲“古文毋作無”，不從者，《說文》雲毋蓋亦禁辭，故不從有無之無也。雲“今文眾為終”，不從者，以上已有卒，卒為終，故從古為眾也。" }
      - { type: j, text: "若父，則游目，毋上於面，毋下於帶。子於父，王孝不主敬，所視廣也，因觀安否何如也。今文父為甫，古文毋作無。" }
      - { type: z, text: "“若父”至“於帶”。○注“子於”至“作無”。○釋曰：案《曲禮》大夫之臣視大夫得視面不得游目，士之臣視士得旁游目。今子視父，應與視君同，不上於袷。與士大夫同者，以子於父主孝不主敬，所視廣者，因視安否何如也。" }
      - { type: j, text: "若不言，立則視足，坐則視膝。不言則伺其行起而已。" }
      - { type: z, text: "“若不”至“視膝”。○注“不言”至“而已”。○釋曰：已上皆據臣子與君父言語之時，此據不言之時，鄭言“伺其行起”者，行解經立，行由立始，故以行解立。是以《論語》雲“立不中門”，鄭雲“立行不當棖闑之中央”，是亦以行解立，一也。又以起解坐，以其起由坐始故也。" }
      - { type: j, text: "凡侍坐於君子，君子欠伸，問日之早晏，以食具告。改居，則請退可也。君子，謂卿大夫及國中賢者也。志倦則欠，體倦則伸，問日晏，近於久也。具猶辯也。改居，謂自變動也。古文伸作信，早作蚤。" }
      - { type: z, text: "“凡侍”至“可也”。○注“君子”至“作蚤”。○釋曰：此陳侍坐於君子之法。鄭雲君子卿大夫者，禮之通例，大夫得稱君子，亦得稱貴人，而士賤，不得也。知“及國中賢者”者，《鄉射禮》雲：“徵唯所欲，以告於鄉先生君子，可也。”鄭雲：“鄉先生，鄉大夫致仕者。君子，有大德行不仕者。”則《曲禮》雲“博聞強識而讓，敦善行而不怠，謂之君子”是也。雲“志倦則欠，體倦則伸”，鄭注《曲禮》亦然。雲“古文伸作信，早作蚤”者，此二字古通用，故《大宗伯》雲“侯執身圭”，為信字。《詩》雲：“四之日其蚤，獻羔祭韭。”為蚤字既通用，疊古文者，據字體非直，從今為正，亦得通用之義也。" }
      - { type: j, text: "夜侍坐，問夜，膳葷，請退可也。問夜，問其時數也。膳葷，謂食之。葷，辛物，蔥薤之屬，食之以止臥。古文葷作薰。" }
      - { type: z, text: "“夜侍”至“可也”。○注“問夜”至“作薰”。○釋曰：雲“問夜，問其時數也”者，謂若鍾鼓漏刻之數也。雲“古文葷作薰”者，《玉藻》雲“膳於君，有葷桃茢”，作此葷。鄭注《論語》作焄，義亦通。若作薰，則《春秋》“一薰一蕕”，薰，香草也，非葷辛之字，故疊古文不從也。" }
      - { type: j, text: "若君賜之食，則君祭先飯，遍嘗膳，飲而俟。君命之食，然後食。君祭先飯，食其祭食，臣先飯，示為君嘗食也。此謂君與之禮食。膳，謂進庶羞，既嘗庶羞，則飲，俟君之遍嘗也。今雲呫嘗膳。" }
      - { type: z, text: "“若君”至“後食”。○注“君祭”至“嘗膳”。○釋曰：此經及下經論臣侍君坐得賜食之法。鄭雲“先飯，示為君嘗食也”者，凡君將食，必有膳宰進食，則膳宰嘗君前之食，備火齊不得，下文是也。今此文謂膳宰不在，則侍食者自嘗自己前食，既不嘗君前食，則不正嘗食，故云示為君嘗食也。雲“此謂君與之禮食”者，謂君與臣小小禮食法，仍非正禮食，正禮食則《公食大夫》是也。彼君前無食，此君臣俱有食，故知小小禮食。此即《玉藻》雲：“若賜之食，而君客之，則命之祭，然後祭。”彼雲客之，則此注禮食亦不得祭，故一也。但此文不雲客之命之祭然後祭，文不具也。若臣嘗食，不得雲禮食，亦不得祭，故鄭注《玉藻》雲“侍食則正不祭”是也。" }
      - { type: j, text: "若有將食者，則俟君之食，然後食。將食猶進食，謂膳宰也。膳宰進食，則臣不嘗食。《周禮·膳夫》：“品嚐食，王乃食。”" }
      - { type: z, text: "“若有”至“後食”。○注“將食”至“乃食”。○釋曰：雲“膳宰進食，則臣不嘗食”者，臣為君嘗食，本為膳宰不在，今膳宰既在，明臣不嘗食也。是以《玉藻》雲：“若有嘗羞者，則俟君之食，然後食，飯飲而俟。”注云“不祭侍食，不敢備禮也。不嘗羞，膳宰存也”是也。雲“膳夫”者，天子膳夫，則諸侯之膳宰。引之者，證經將食之人是膳宰，因將膳與君品嚐食。凡君食，臣有侍食之時，唯子不侍食。是以《文王世子》雲：“命膳宰曰，末有原。應曰諾，然後退。”是大子不侍食。若卿大夫已下，則有侍食法，故《內則》雲“父沒母存，冢子御食，群子婦佐餕”是也。" }
      - { type: j, text: "若君賜之爵，則下席，再拜稽首，受爵，升席祭，卒爵而俟，君卒爵，然後授虛爵。受爵者於尊所，至於授爵，坐授人耳。必俟君卒爵者，若欲其釂然也。今文曰“若賜之爵”，無君也。" }
      - { type: z, text: "“若君”至“虛爵”。○注“受爵”至“君也”。○釋曰：雲“受爵者於尊所”者，《曲禮》亦是賜爵法，而云“酒進則起，拜受於尊所”是也。雲“至於授爵，坐授人耳”者，見《曲禮》與《玉藻》並此文，並無立授之文，故知坐授也。雲“必俟君卒爵者，若欲其釂然也”者，此經文與《玉藻》文同，皆燕而君客之賜爵法。故臣先飲以酒，是甘味，欲美君之味，故先飲。必待君卒爵而後授虛爵者，臣意若欲君盡爵然也。案《曲禮》雲：“侍飲於長者，酒進則起，拜受於尊所，長者辭，少者反席而飲。長者舉未釂，少者不敢飲。”彼是大燕飲禮，故鄭注引《燕禮》曰“公卒爵而後飲”。案《燕禮》當無筭爵，後得君賜爵，待君卒爵乃飲是也。" }
      - { type: j, text: "退，坐取屨，隱闢而後屨。君為之興，則曰：“君無為興，臣不敢辭。”君若降送之，則不敢顧辭，遂出。謂君若食之飲之而退也。隱闢，俛而逡巡。興，起也。辭君興而不敢辭其降，於已大崇，不敢當也。" }
      - { type: z, text: "“退坐”至“遂出”。○注“謂君”至“當也”。○釋曰：雲“謂君若食之飲之而退也”者，以上雲“若君賜之食”、“若君賜之爵”，下而云退者，明為此二者而退也。雲“隱闢，俛而逡巡”者，案《曲禮》雲“鄉長者而屨”，此亦當然。雲“不敢辭其降”者，謂君降送時，明有不降法，故《曲禮》雲“就屨跪而舉之，屏於側”，注云“謂獨退也”。雲“若”者，不定之辭也。" }
      - { type: j, text: "大夫則辭，退下，比及門，三辭。下亦降也。" }
      - { type: z, text: "“大夫”至“三辭”。○釋曰：雲“大夫則辭退下”者，對上不敢辭，是士，士卑不敢辭降。大夫之內兼三卿、五大夫，臣中尊者，故得辭降也。" }
      - { type: j, text: "若先生、異爵者請見之，則辭。辭不得命，則曰：“某無以見，辭不得命，將走見。”先見之。先生，致仕者也。異爵，謂卿大夫也。辭，辭其自降而來。走猶出也。先見之者，出先拜也。《曲禮》曰：“主人敬賓，則先拜賓。”" }
      - { type: z, text: "“若先”至“見之”。○注“先生”至“拜賓”。○釋曰：此先生即《鄉飲酒》雲“就先生而謀賓介”，亦一也。故彼注與此注皆雲“致仕者”也。雲“異爵，謂卿大夫也”者，此《士相見》本文是士，故以卿大夫為異爵也。訓走為出者，亦謂士見異爵，取急意而言走，其實非走，直出也。引《曲禮》者，欲見言敬，客先拜也。彼雲客，此雲賓者，對文，賓客異；散文，賓客通；故變文雲賓也。" }
      - { type: j, text: "非以君命使，則不稱寡。大夫士，則曰“寡君之老”。謂擯贊者辭也。不稱寡者，不言寡君之某，言姓名而已。大夫、卿、士，其使則皆曰寡君之某。《檀弓》曰：“士而未有祿者，君有饋焉曰獻。使焉曰寡君之老。”" }
      - { type: z, text: "“非以”至“之老”。○注“謂擯”至“之老”。○釋曰：雲“非以君命使，則不稱寡”者，此則《玉藻》雲“大夫私事使，私人擯，則稱名”。以其非聘問之禮，則為私事使，私人擯也。《聘禮》雲：“若有言，則以束帛，如享禮。”引《春秋》晉侯使韓穿來言汶陽之田歸於齊，《玉藻》注亦引之是也。鄭雲“謂擯贊者辭也”者，以《玉藻》自諸侯之於天子以下至大夫，皆雲“擯者曰”，故知不自稱，是擯贊之辭也。雲“其使則皆曰寡君之某”者，釋經“大夫士則曰寡君之老”，為公事使者也。此則《玉藻》雲“公士擯，則曰寡大夫、寡君之老。大夫有所往，必與公士為賓”，亦一也。彼注云：“謂聘也。大聘使上大夫，小聘使下大夫。”則曰寡君之某，故鄭總雲“某”也。若然，經直雲大夫，鄭兼雲士者，經本文是士，則雲非以君命使，可以兼士也。但士無特聘問，或作介，往他國亦有稱謂，而云寡君之士某也。雲“《檀弓》曰仕而未有祿”者，謂試為大夫，士直有試功之祿，未有正祿。雲“君有饋焉曰獻”者，謂有饋物於君，亦與正祿者同稱獻。雲“使焉雲寡君之老”者，於他國君邊自稱寡君之某，此文亦兼士大夫。引之者，證公事使稱寡君之某也。" }
      - { type: j, text: "凡執幣者，不趨，容彌蹙以為儀。不趨，主慎也。以進而益恭為威儀耳。今文無容。" }
      - { type: z, text: "“凡執”至“為儀”。○釋曰：案《小行人》合六幣：玉、馬、皮、圭、璧、帛，皆稱幣。下文別雲“執玉”，則此幣謂皮馬享幣及禽摯皆是。○注“不趨”至“無容”。○釋曰：凡趨有二種：有疾趨，“行而張足曰趨”是也；有徐趨，則下文“舒武舉前曳踵”是也。今此經雲“不趨”者，不為疾趨，故云“主慎也”。既不雲疾趨，又不為下文徐趨，但徐疾之閒為之，故“以進而益恭為威儀”也。" }
      - { type: j, text: "執玉者，則唯舒武，舉前曳踵。唯舒者，重玉器，尤慎也。武，跡也。舉前曳踵，備疐跲也。今文無者，古文曳作抴。" }
      - { type: z, text: "“執玉”至“曳踵”。○釋曰：此篇直見在國以禽摯相見之禮，無執玉朝聘鄰國之事。而云“執玉”者，因執摯相見，故兼見朝聘執玉之禮也。案《玉藻》記徐趨之節雲“圈豚行”，又與此不同者，文有詳略，俱是徐趨也。○注“唯舒”至“作抴”。○釋曰：雲“唯舒者，重玉器，尤慎也”者，案《玉藻》雲“執龜玉不趨”，不趨者，不為疾趨。又《曲禮》雲：“凡執主器，執輕如不克。”故為重玉器，尤慎也。雲“備疐跲也”者，疐跲，則顛倒恐損玉，故徐趨也。" }
      - { type: j, text: "凡自稱於君，士大夫則曰“下臣”。宅者在邦，則曰“市井之臣”；在野，則曰“草茅之臣”；庶人則曰“剌草之臣”。他國之人則曰“外臣”。宅者，謂致仕者也。致仕者，去官而居宅，或在國中，或在野。《周禮·載師》之職“以宅田任近郊之地”。剌猶剗除也。今宅為託，古文茅作苗。" }
      - { type: z, text: "“凡自”至“外臣”。○釋曰：雲“凡自稱於君，士大夫則曰下臣”者，此與君言之時。案《玉藻》雲“上大夫曰下臣”，與此同也。○注“宅者”至“作苗”。○釋曰：此亦自稱於君，以其致仕不在，故指宅而言，故曰“宅者，謂致仕者”也。雲“或在國中，或在野”者，案《爾雅》“郊外曰野”，則自郊至畿五百里內皆名野。又案《鄉大夫職》“國中七尺，野自六尺”，此亦云在國在野，相對其言，國外則雲野，則雲宅在野者，城外畿內皆是也。雲“《載師》之職”者，彼鄭注云：“宅田，致仕者之家所受田也”。引之，證彼言宅田據地，此言宅據所居，一也。雲“剌猶剗除也”者，案《詩》有“其鎛斯趙”，注云：“趙，剌也”，故以剌為剗除草木者也。" }
      - { type: j, text: "《儀禮註疏》" }
