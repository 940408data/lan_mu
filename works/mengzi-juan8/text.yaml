# 孟子注疏卷8（孫奭疏）：j 為經文，漢趙岐注為注，z 為疏文。
sections:
  - id: juan8
    name: 正文
    blocks:
      - { type: z, text: "离娄者，古之明日者，盖以为黄帝之时人也。黄帝亡其玄珠，使离朱索之，离朱即离娄也。能视於百步之外，见秋毫之末。然必须规矩，乃成方圆，犹《论语》“述而不作，信而好古”，故以名篇。正义曰：前章首论滕文公问以古道，故以《滕文公》为篇题，次於公孙丑问政，谓其为政莫大於反古也。然则此篇孟子首言离娄之明，故以目为篇题，次於《滕文公》问以古道，是亦反古道者莫大乎明也，遂次《滕文公》之篇，所以揭《离娄》为此篇之题。此篇凡六十章赵氏分之以为上下卷。此卷只有二十八章而已。一章言虽有巧智，犹须法度。二章言法则尧舜，鉴戒桀纣。三章言安仁在於为仁，恶弗去则患及其身。四章言行有不得於人，反求诸身，责己之道也。五章言天下国家，本正则立，本倾则踣。六章言巨室不罪，咸以为表，德之流行，可充四海。七章言遭衰逢乱，屈服强大，据国行仁，天下无敌。八章言人之安危，皆由於己。九章言水性趋下，民乐归仁。十章言旷仁舍，礼自暴弃之道也。十一章言亲亲敬长，近取诸己。十二章言事上得君，乃可临民，信友悦亲，本在於身。十三章言养老尊贤，国之上务。十四章言聚敛富民，弃於孔子，重人命之至者。十五章言知人之道。十六章言人君恭俭，率下移风，人臣恭俭，明其廉忠。十七章言权时之义，嫂溺援手。十八章言父子至亲，相责离恩，易子而教，相成以仁。十九章言上孝养志，下孝养体。二十章言小人为政，不足间非，君正国定，下不邪侈。二十一章言不虞获誉，不可为戒，求全受毁，未足惩咎。二十二章言言出於身，不惟其责，则易之矣。二十三章言人患在为师。二十四章言尊师重道。二十五章言啜沈浮，君子不与。二十六章言无後不可。二十七章言仁义之本在孝悌。二十八章言天下之富贵，不若得意於亲。其馀二十二章分在下卷，不无叙焉。○注“离娄”至“题篇”。○正义曰：《庄子·天地》篇云：“黄帝游乎赤水之北，登乎昆仑之山，南望而归。遗其元珠，使知索之，不得；使离朱索之。”盖其人也，离朱即离娄也。《论语》第七篇首云：“述而不作，信而好古，窃比於我老彭。”是其旨也。" }
      - { type: j, text: "孟子曰：“离娄之明，公输子之巧，不以规矩，不能成方员。" }
      - { type: z, text: "公输子鲁班，鲁之巧人也，或以为鲁昭公之子。虽天下至巧，亦犹须规矩也。" }
      - { type: j, text: "师旷之聪，不以六律，不能正五音。" }
      - { type: z, text: "师旷，晋平公之乐太师也，其听至聪。不用六律，不能正五音。六律，阳律，大蔟、姑洗、蕤宾、夷则、无射、黄锺也。五音，宫、商、角、徵、羽也。" }
      - { type: j, text: "尧、舜之道，不以仁政不能平治天下。" }
      - { type: z, text: "当行仁恩之政，天下乃可平也。" }
      - { type: j, text: "今有仁心仁闻，而民不被其泽，不可法於後世者，不行先王之道也。" }
      - { type: z, text: "仁心，性仁也。仁闻，仁声远闻也。虽然，犹须行先王之道，使百姓被泽，乃可为後世之法也。" }
      - { type: j, text: "故曰：徒善不足以为政，徒法不能以自行。" }
      - { type: z, text: "但有善心而不行之，不足以为政。但有善法度而不施之，法度亦不能独自行也。" }
      - { type: j, text: "《诗》云：‘不愆不忘，率由旧章。’遵先王之法而过者，未之有也。" }
      - { type: z, text: "《诗·大雅·假乐》之篇。愆，过也。所行不过差矣，不可忘者，以其循用旧故文章遵用先王之法度，未闻有过者也。" }
      - { type: j, text: "圣人既竭目力焉，继之以规矩准绳，以为方平直，不可胜用也。" }
      - { type: z, text: "尽已目力，续以其四者，方、员、平、直可得而审知，故用之不可胜极也。" }
      - { type: j, text: "既竭耳力焉，继之以六律，正五音，不可胜用也。" }
      - { type: z, text: "音须律而正也。" }
      - { type: j, text: "既竭心思焉，继之以不忍人之政，而仁覆天下矣。" }
      - { type: z, text: "尽心欲行恩，继以不忍加恶於人之政，则天下被覆衣之仁也。" }
      - { type: j, text: "故曰：为高必因丘陵，为下必因川泽，为政不因先王之道，可谓智乎？" }
      - { type: z, text: "言因自然，则用力少而成功多矣。" }
      - { type: j, text: "是以惟仁者宜在高位。不仁而在高位，是播其恶於众也。" }
      - { type: z, text: "仁者能由先王之道。不仁逆道，则自播扬其恶於众人也。" }
      - { type: j, text: "上无道揆也，下无法守也，朝不信道，工不信度，君子犯义，小人犯刑，国之所存者幸也。" }
      - { type: z, text: "言君无道术可以揆度天意，臣无法度可以守职奉命，朝廷之士不信道德，百工之作不信度量。君子触义之所禁，谓学士当行君子之道也。小人触刑，愚人罹於密网也。此亡国之政，然而国存者，侥幸耳，非其道也。" }
      - { type: j, text: "故曰：城郭不完，兵甲不多，非国之灾也；田野不辟，货财不聚，非国之害也；上无礼，下无学，贼民兴，丧无日矣。" }
      - { type: z, text: "言君不知礼，臣不学法度，无以相检制，则贼民兴，亡在朝夕，无复有期日。言国无礼义必亡。" }
      - { type: j, text: "《诗》曰：‘天之方蹶，无然泄泄。’泄泄，犹沓沓也。事君无义，进退无礼，言则非先王之道者，犹沓沓也。" }
      - { type: z, text: "《诗·大雅·板》之篇。天谓王者。蹶，动也。言天方动，汝无然沓沓，但为非义非礼、背先王之道而不相匡正也。" }
      - { type: j, text: "故曰：责难於君谓之恭，陈善闭邪谓之敬，‘吾君不能’谓之贼。”" }
      - { type: z, text: "人臣之道，当进君於善，责难为之事，使君勉之。谓行尧舜之仁，是为恭臣。陈善法以禁闭君之邪心，是为敬君。言吾君不肖，不能行善，因不谏正，此为贼其君也。故有恭敬贼三者之善。“孟子曰：离娄乏明”至“吾君不能谓之贼”。○正义曰：此章指言虽有巧智，犹须法度，国由先王，礼义为要，不仁在位，播越其恶，诬君不谏，故谓之贼。明上下相须，而道化行也。“孟子曰：离娄之明，公输子之巧，不以规矩，不能成方员”者，公输子鲁班，鲁之巧匠也。孟子谓离娄明虽足以察秋毫之末，公输子其性虽巧，然不以规矩之度，不能成其方员之器。规所以员也，言物之员者皆由规之所出也。矩所以方也，言物之方者皆由矩之所出也。“师旷之聪，不以六律，不能正五音”者，师旷，乐官名也。孟子又谓师旷其耳虽聪，善能听音，然不得六律以和之，固不能正其五音也。六律五音，大蔟、姑洗、蕤宾、夷则、无射黄钟是六律也；宫、商、角、徵、羽是五音也。“尧舜之道，不以仁政不能平治天下”者，尧、舜二帝，唐虞之盛者也，然而不以仁政而施之於天下，故不能平治天下而享无为之功矣。以其天下平治，由仁政之施也，如物之方员必自规矩之所出，五音之正由六律以和之者也。“今有仁心仁闻，而民不被其泽，不可法於後世者，不行先王之道也”者，孟子言今之人君，虽有仁人不忍之心，又有仁声而远闻四方，然而民皆不得г被其恩泽，不可为後世之所法者，以其不行古先王之道而治之也。无他，盖以先王之道，有恩泽足以被民，其法可为後世取象故也。苟不行先王之道，虽有仁心仁闻，亦若离娄之明、师旷之聪、尧舜之道，不得以规矩、六律、仁政为之，亦无如之何也已矣。“故曰：徒善不足以为政，徒法不能以自行”者，此孟子言至於此，所以复言之者也。徒善不足以为政，盖谓虽有先王之道而为之善，然而人不能用而行之，是徒善不足以为政也。徒法不能以自行，盖谓虽有规矩、六律之法，然而人不能因而用之，是徒法不能以自行也。以其规矩、六律之法不能自行之，必待人而用之，然後能成其方员、正其五音也。尧舜之道，自不足以为之政，必待人而行之，然後能平治天下而为法於後世也。“《诗》云：‘不愆不忘，率由旧章。’遵先王之道而过者，未之有也”者，孟子引《大雅·假乐》之篇文而云也，盖谓不愆违，不忘去其故旧典章皆循而用之，未有过失者也。故复言之曰：遵先王之法而过者，未之有也。典章者，即先王之法也。“圣人既竭目力焉，继之以规矩准绳，以为方员平直，不可胜用也”者，孟子又言圣人既竭己目力而视，续以规矩准绳而为方员平直，故其用之不可胜极也。盖规所以能员，矩所以能方，准所以能平，绳所以能直故也。“既竭耳力焉，继之以六律正五音，不可胜用也”者，孟子又言圣人既已尽其耳力而听之，又续以六律而正五音，故其用亦不可胜极也。盖六律所以正五音也。“既竭心思焉，继之以不忍人之政，而仁覆天下矣”者，孟子又言圣人既已能尽心之所思虑，续以施其不忍人之政，则仁恩德泽，足以覆盖於天下矣。无他，以其仁恩广大矣，故云覆天下，故曰为高。必因丘陵为下，必因川泽为政，不因先王之道，可谓智乎者？孟子言至於此，又所以复言之者也，盖譬言人之欲为高者，必因其丘陵而为之也；为下者，必因其川泽而为之耳。无他，以其丘陵之山其本高矣，川泽之地其本下矣，言为政於天下者，而不因先王之道为之，岂足谓之智者乎？言不可谓之智矣。以其先王之道是为之所本焉，故智足以有知，苟为政而不知以先王之道为本，岂谓之智乎？大抵孟子言规矩准绳六律者，皆譬为政而言也。抑亦知孟子长於譬喻者欤。“是以惟仁者宜在高位。不仁而在高位，是播其恶於众也”者，孟子於此毕其譬喻，乃曰：是以惟仁者之君宜其处高位为尊也，不仁之君而处高位，是其处高位而播扬其恶於人民之众矣。“上无道揆也，下无法守也，朝不信道，工不信度，君子犯义，卜人犯刑，国之所存者幸也”者，孟子言上之为君无道术以表率其下，下之为臣无法度以守其职，朝廷之士皆不信其道德，百工之作皆不信其度量，君子之人以之触义之所具，小人之人以之犯冒其刑宪，然而如此而国尚存而不亡者，以其侥幸得存焉。必云幸也，盖少有存者也。“故曰：城郭不完，兵甲不多，非国之灾也；田野不辟，货财不聚，非国之害也；上无礼，下无学，贼民兴，丧无日矣”者，孟子言至此，所以复言之也，故云城郭颓坏而不完，兵甲之器少，此非为国之灾害也；田野荒芜而不开辟，货财竭尽而无贮聚，此非为国之害也；然而上之为君无礼法以检制，下之为人臣不学法度以守职，贼民相杀戮以之兴起，是则国之丧亡俱在朝夕，无复有日矣。“《诗》云：天之方蹶，无然泄泄。泄泄，犹沓沓也。事君无义，进退无礼，言则非先王之道者，犹沓沓也”者，自“天之方蹶”至“泄泄犹沓沓也”，是《诗·大雅·板》之篇诗也。自“事君”至“沓沓也”，是孟子自解上云沓沓之义也。其《诗》盖言王者方动而为非，为之臣者无更沓沓，但复为非礼义以事其王者也，故曰天之方蹶，无然泄泄。泄泄犹沓沓也。蹶，动也。天谓王者也。泄泄则沓沓是也，孟子复自解之，言事君以无义之事事之，其进退无礼节，其言则非先王之道而为言者，是若沓沓者也。以其当匡正其君，不可复长君之恶耳。“故曰：责难於君谓之恭，陈善闭邪谓之敬，吾君不能谓之贼”者，孟子言至於此，所以又复言之者也。故云君之有难恶，当责之以善，能责君难恶以为之善，是为恭，臣恭其君也；陈之以善事，而闭其君之邪心，是谓敬其君者也。如不责君之难，不陈善而闭君之邪，而乃曰我君不能行善，因不谏正之者，是谓残贼其君者也。故曰：“责难於君谓之恭，陈善闭邪谓之敬，吾君不能谓之贼。”○注“公输子”至“规矩也”。正义曰：案《淮南子》云：“楚欲攻宋，墨子闻而悼之。见楚王曰：‘臣见大王之必伤义，而不得宋。’王曰：‘公输，天下之巧工，作为云梯之械，设以攻宋，曷为弗取？’墨子曰：‘令公输设攻，臣请守之。’於是公输设攻宋之械，墨子设守宋之备，九攻而墨子九之，弗能入。乃偃兵不攻。”是公输即鲁般也，或云是鲁昭公之子也。○注“师旷，晋平公之乐太师”至“羽也”。正义曰：案《吕氏春秋》云：“晋平公铸钟，使工听之，皆以为调。师旷曰：‘不调，请更铸之。’平公曰：‘工皆以为调矣。’师旷曰：‘後世有知音者，将知不调。臣窃为耻之。’至师涓，果知钟之不调。”是师旷善听，为晋平公之乐师也。云“六律，阳律，大蔟、姑洗、蕤宾、夷则、无射、黄钟”。案《律历志》云：《吕不韦春秋》言黄钟之宫，律之本也，下生林锺，林锺上生大蔟，大蔟下生南吕，南吕上生姑洗，姑洗下生应钟，应钟上生蕤宾，蕤宾下生大吕，大吕下生夷则，夷则上生夹钟，夹钟下生无射，无射上生中吕。淮南王安延致儒生博士亦为律吕，云黄钟之律九寸，而宫音调因而九之，九九八十一，故黄钟之数，立位在子。大蔟其数七十二，姑洗之数六十四，蕤宾之数五十七，夷则之数五十一，无射之数四十五。以黄钟、大蔟为商，姑洗为角，角生应钟，不比正音，故为和。应钟生蕤宾，不比正音，故为缪。日冬至，音比林钟，浸以浊日。夏至，音比黄钟，浸以清。以十二律应二十四时之变，甲子，大吕之徵也；丙子，夹钟之羽也；戊子，黄钟之宫也；庚子，无射之商也；壬子，夷则之角也。其为音，一律而生五音，十二律为六十音，因而六之，六六三十六，故三百六十五日以当一岁之日。故律之数，天地之道也。凡此则以律正五音之谓也。○注《诗·大雅·假乐》之篇。○正义曰：笺云：愆，过也。率，循也。言成王之令德不过误，不遗失，循用旧典之文章。旧典谓周公之礼法也。○注云“《诗·大雅·板》之篇”。○正义曰：笺注云：蹶，动也；泄泄犹沓沓也。笺云：天斥王也。王方欲艰难天下之民，又方更变先王之道，无沓沓然，为之制法度，达其意以成其意。" }
      - { type: j, text: "孟子曰：“规矩，方员之至也。圣人，人伦之至也。" }
      - { type: z, text: "至，极也。人事之善者，莫大取法於圣人，犹方员须规矩也。" }
      - { type: j, text: "欲为君，尽君道；欲为臣，尽臣道：二者皆法尧、舜而已矣。" }
      - { type: z, text: "尧舜之为君臣道备。" }
      - { type: j, text: "不以舜之所以事尧事君，不敬其君者也。不以尧之所以治民治民，贼其民者也。" }
      - { type: z, text: "言舜之事尧，敬之至也。尧之治民，爱之尽也。" }
      - { type: j, text: "孔子曰：‘道二，仁与不仁而已矣。’暴其民甚，则身弑国亡；不甚，则身危国削。名之曰幽、厉，虽孝子慈孙，百世不能改也。" }
      - { type: z, text: "仁则国安，不仁则国危亡。甚谓桀、纣，不甚谓幽、厉。厉王流于彘，幽王灭於戏，可谓身危国削矣。名之谓谥之也，谥以幽、厉，以章其恶，百世传之，孝子慈孙，何能改也！" }
      - { type: j, text: "《诗》云：‘殷鉴不远，在夏后之世。’此之谓也。”" }
      - { type: z, text: "《诗·大雅·荡》之篇也。殷之所鉴视，近在夏后之世矣。以前代善恶为明镜也，欲使周亦鉴于殷之所以亡也。“孟子曰规矩”至“此之谓也”。○正义曰：此章指言法则尧舜，以为规矩，鉴戒桀纣，避远危殆，名谥一定，千载而不可改也。“孟子曰：规矩，方员之至也。圣人，人伦之至也”者，孟子言规矩之度，其为方员之至者也。谓之至者，以其至矣尽矣，不可以有加矣。圣人是为人伦之至者亦然。人伦：君臣、父子、夫妇、兄弟、朋友是也。“欲为君，尽君道；欲为臣，尽臣道：二者皆法尧、舜而已矣”者，孟子言凡欲为人君者，当尽其为君之道也；凡欲为人臣者，当尽其为臣之道也：此二者在皆则法尧、舜而已矣。以尧舜所为君臣之道备矣。“不以舜之所以事尧事君，不敬其君者也。不以尧之所以治民治民，贼其民者也”者，言为人臣者，如不以舜之所以事尧者事君，是不尊敬其君者也；为人臣者，如不以尧之所以治民者治民，是残贼其民者也。舜所以事尧者，尽其义之道也。尧之所以治民者，尽其仁之道也。义所以敬其君者也，仁所以爱其民者也。“孔子曰：道二，仁与不仁而已矣。暴其民甚，则身弑国亡；不甚，则身危国削。名之曰幽、厉，虽孝子慈孙，百世不能改也”者，孟子言孔子有曰道有二，是仁与不仁为二而已。暴虐其民，以至於甚极，则身必为下之所杀，而国必丧亡矣；不至於极甚，则身必危难，而国必灭削，谥之曰幽、厉之君，既谥为幽、厉，以章恶於後世，虽有孝子慈孙所出，亦不能改此谥也。厉王但止於流彘，幽王灭於戏，是谓身危国削矣。如身弑国亡，而孟子不止归於人名者，以其被所杀戮，国已丧亡，足以章其恶，固不待为谥而彰之矣，如桀纣者也。“《诗》云：殷鉴不远，在夏后之世。此之谓也”者，盖《诗·大雅·荡》之篇文也。其诗已谓殷之世所以鉴视在近而不远者，以其即在夏后之世是也。以其前代善恶，足以为明镜而可鉴也。孟子所以云“此之谓也”者，盖欲使周之时亦鉴於殷之所以亡也。○注“尧舜之为君臣道备”。○正义曰：《书》云：“尧克明俊德，以亲九族，平章百姓，协和万邦，黎民於变时雍。”盖为君之道尽於此矣，是君道之备也。舜自“元德升闻”，以之事尧，而“慎徽五典，百揆时叙，宾于四门，四门穆穆”，其後坐常见尧於墙，食常见尧於羹。盖为臣道尽於此矣，是臣之道备也。○注“桀纣幽厉”。○正义曰：案《史记本纪》云：桀为虐政淫荒，汤伐之，於是桀败於有之墟，汤王乃改正朔，易服色，是为汤王，为殷之始王。又云：纣资辨捷，知足以拒谏，言足以饰非，好酒淫乐，醢九侯，脯鄂侯，武王东伐，至于盟津伐纣，纣兵败走，入登鹿台，衣其宝玉，赴火而死，武王遂斩纣头，悬之白旗，殷民大悦，武王於是为天子，以为周之王。又云：“厉王行暴虐，侈傲，国人谤之。於是相与畔，袭厉王。厉王出奔於彘。”韦昭曰“彘，晋地也。汉为县，属河东，今曰永安”是也。厉王终死于彘，於是太子静即位，是为宣王。宣王崩，子幽王宫涅立。幽王以褒姒不好笑，幽王欲其笑，乃为燧火、大鼓，有寇至则举燧火，诸侯悉至，至而无寇，褒姒乃大笑，幽王悦之，为数举烽燧。其後不信，诸侯益不至。幽王以虢石父为卿用事，国人皆怨。申侯怒，与缯西夷犬戎攻幽王。幽王举烽火徵兵，兵不至，遂杀幽王骊山下。《汲冢纪》年曰：汤灭夏，以至于纣，二十九王，凡四百九十六年。自武灭纣，以至幽王，凡二百五十七年。○注“《诗·大雅·荡》之篇”。○正义曰：笺云：“此言殷之明镜不远，近在夏后之世，谓汤诛桀也。後武王诛纣，今之王何以不用为之戒。”孟子於此所以引之，以戒其时之君臣也。" }
      - { type: j, text: "孟子曰：“三代之得天下也以仁，其失天下也以不仁。国之所以废兴存亡者亦然。" }
      - { type: z, text: "三代，夏、商、周。国，谓公、侯之国，存亡在仁与不仁而已。" }
      - { type: j, text: "天子不仁，不保四海；诸侯不仁，不保社稷；卿大夫不仁，不保宗庙；士庶人不仁，不保四体。今恶死亡而乐不仁，是由恶醉而强酒。”" }
      - { type: z, text: "保，安也。四体，身之四肢。强酒则必醉也，喻恶亡而乐不仁也。“孟子曰三代”至“强酒”。○正义曰：此章指言人所以安，莫若为仁，恶而弗去，患必在身，自上达下，其道一焉。“孟子曰：三代之得天下也以仁，其失天下也以不仁。国之所以废兴存亡者亦然”者，孟子言夏、商、周三代之王，其所以得天下也，以其皆以仁存心为政於天下而得之也。三代之中，其有以失天下者，以其不仁，故失之也。以至公、侯之国，所以有废而不兴，有兴而不废者，亦如三代之得天下也以仁，失天下也以不仁也。以其皆在於仁道而已。“天子不仁，不保四海；诸侯不仁，不保社稷；卿大夫不仁，不保宗庙；士庶人不仁，不保四体。今恶死亡而乐不仁，是犹恶醉而强酒”者，孟子言为天子者不为仁，则不能安其四海；诸侯不仁，则不能安其社稷；卿大夫不为仁，则不能安其宗庙；士庶人不为仁，则不能安其四体。四体，身之四肢也。天子守四海，诸侯守社稷，卿大夫守宗庙，士庶人守其身，故各因其所守而言也。今天下之人皆知疾恶其死亡，而以乐为不仁，是若恶其醉酒而以强饮其酒耳，亦《论语》孔子谓恶湿而居下之意也。" }
      - { type: j, text: "孟子曰：“爱人，不亲，反其仁。治人，不治，反其智。礼人，不答，反其敬。行有不得者，皆反求诸己，其身正而天下归之。" }
      - { type: z, text: "反其仁，己仁独未至邪？反其智，己智犹未足邪？反其敬，己敬独未恭邪？反求诸身，身已正则天下归就之，服其德也。" }
      - { type: j, text: "《诗》云：‘永言配命，自求多福。’”" }
      - { type: z, text: "此诗已见上篇，其义同。“孟子曰”至“自求多福”。○正义曰：此章指言行有不得於人，一求诸身，责已之道也，改行饬躬，福则至矣。“孟子曰：爱人，不亲，反其仁。治人，不治，反其智”至“而天下归之”者，孟子言爱人而人不亲之，必吾仁有所未至“也，故当反己责之。治其人而人不治者，必吾之智有所未尽也，故当反已而责之也。礼接於人而人不以礼报答之，必吾之敬有所未至也，故当反己而责之也。凡所行有不得於人者，皆当反求诸己而已，以其身之所有未至也，故当自反而责之。盖以身先自治而正之，则天下之人皆归之而服其德也。如颜渊克已而天下归仁焉是也。“《诗》云：永言配命，自求多福”，已说於上篇，此固不说。" }
      - { type: j, text: "孟子曰：“人有恒言，皆曰‘天下国家’。" }
      - { type: z, text: "恒，常也。人之常语也。天下谓天子之所主，国谓诸侯之国，家谓卿大夫家。" }
      - { type: j, text: "天下之本在国，国之本在家，家之本在身。”" }
      - { type: z, text: "治天下者不得良诸侯无以为本，治其国者不得良卿大夫无以为本，治其家者不得良身无以为本也。是则本正则立，本倾则踣，固在所敬慎而已。“孟子曰”至“本在身”。○正义曰：此章指言天下国家，各依其本，本正则立，本倾则踣，虽曰常言，必须敬慎也。“孟子曰：人有恒言，皆曰天下国家”者，孟子言人之所常言，皆曰天下国家也。天子有天下，公侯有国，大夫有家。“天下之本在国，国之本在家，家之本在身”者，言天下之根本，独在於公侯为之根本也；公侯之根本，又在卿大夫为之根本也；卿大夫之根本，抑又在於私身为之根本也。如《大学》有云：“欲明明德於天下，必先治其国。欲治其国，必先齐其家。欲齐其家，必先修其身。”此其意也。云“天下国家”者，天子有天下谓之天下，诸侯有国谓之国。然有国者不可以称天下，有天下者或可以称国，故诸侯谓之邦国，天子谓之王国。国家文从或，又从国，为其或之也，故国之也。至於家，则自天子达於庶人，未尝不通称之矣。孟子曰：“为政不难，不得罪於巨室。（巨室，大家也。谓贤卿大夫之家，人所则效者。言不难者，但不使巨室罪之，则善也。）巨室之所慕，一国慕之；一国之所慕，天下慕之。故沛然德教，溢乎四海。”（慕，思也。贤卿大夫，一国思随其所善恶，一国思其善政，则天下思以为君矣。沛然大治，德教可以满溢於四海之内也。）“孟子曰”至“溢乎四海”。○正义曰：此章指言天下倾心，思慕向善，巨室不罪，咸以为表，德之流行，可以充四海也。“孟子曰：为政不难，不得罪於巨室”者，巨室喻卿大夫之家也，孟子言为政於天下易而不难也，但不得罪於卿大夫之家也，以其卿大夫之家，以上则近君，而君所待以辅弼；以道则近民，而民待以视效。故君之言动，其是非可得而剌也；国之政令，其得失可得而议也。道合则从，不合则去，君民之从违而系之也，故为君不得罪於卿大夫，则为政可以行天下矣。“巨室之所慕，一国慕之。一国之所慕，天下慕之。故沛然德教溢乎四海”者，言卿大夫之所思慕也，一国亦随而思慕之，一国所思慕，则天下亦随而思慕之，故沛然大洽，其上之德教，可以充溢乎四海，如东注之水，沛然流溢乎四海也。此言四海，犹中国则谓之天下，夷狄则谓之四海耳。孟子之意，盖欲当时国君为政，直其道，正其心，使卿大夫慕之而不去，则远近虽异方莫不均慕之。此德教所以溢乎四海，亦如传云大夫者，近者视而效之，远者望而效之，盖其意也。" }
      - { type: j, text: "孟子曰：“天下有道，小德役大德，小贤役大贤。天下无道，小役大，弱役强。斯二者，天也。顺天者存，逆天者亡。" }
      - { type: z, text: "有道之世，小德、小贤乐为大德、大贤役，服於贤德也。无道之时，小国、弱国畏惧而役於大国、强国也，此二者天时所遭也，当顺从之，不当逆也。" }
      - { type: j, text: "齐景公曰：‘既不能令，又不受命，是绝物也。’涕出而女於吴。" }
      - { type: z, text: "齐景公，齐侯。景，谥也。言诸侯既不能令告邻国，使之进退，又不能事大国，往受教命，是所以自绝於物。物，事也。大国不与之通朝聘之事也，吴，蛮夷也，时为强国，故齐侯畏而耻之，泣涕而与为婚。" }
      - { type: j, text: "今也小国师大国而耻受命焉，是犹弟子而耻受命於先师也。" }
      - { type: z, text: "今小国以大国为师，学法度焉，而耻受命教，不从其进退，譬犹弟子不从师也。" }
      - { type: j, text: "如耻之，莫若师文王。师文王，大国五年，小国七年，必为政於天下矣。" }
      - { type: z, text: "文王行仁政，以移殷民之心，使皆就之。今师效文王，大国不过五年，小国七年，必得政於天下矣。文王时难，故百年乃治，今之时易；文王由百里起，今大国乃逾千里，过之十倍有馀，故五年足以为政，小国差之，故七年。" }
      - { type: j, text: "《诗》云：‘商之孙子，其丽不亿，上帝既命，侯于周服。侯服于周，天命靡常，殷士肤敏，将于京。’" }
      - { type: z, text: "《诗·大雅·文王》之篇。丽亿，数也。言殷帝之子孙，其数虽不但亿万人，天既命之，惟服於周。殷之美士，执鬯之礼，将事於京师，若微子者。肤，大。敏，达也，此天命之无常也。" }
      - { type: j, text: "孔子曰：‘仁不可为众也，夫国君好仁，天下无敌。’" }
      - { type: z, text: "孔子云：行仁者，天下之众不能当也。诸侯有好仁者，天下无敢与之为敌。" }
      - { type: j, text: "今也欲无敌於天下而不以仁，是犹执热而不以濯也。诗云：‘谁能执热，逝不以濯。’”" }
      - { type: z, text: "《诗·大雅·桑柔》之篇。谁能持热而不以水濯其手，喻其为国谁能违仁而无敌於天下也。“孟子曰：天下有道”至“逝不以濯”。正义曰：此章指言遭衰逢乱，屈伏强大，据国行仁，天下莫敌。虽有亿众，无德不亲，执热须濯，明不可违仁也。“孟子曰：天下有道，小德役大德，小贤役大贤。天下无道，小役大，弱役强。斯二者，天也，顺天者存，逆天者亡”者，孟子言天下有治道之时，小德乐为大德。小贤乐为大贤，故小德役服大德，小贤役服大贤。以其德之得於己者有多少，故有大德小德。以其贤之贤於人也有远近，故有大贤小贤。天下有道，则论德而定位，故小德役大德，小贤役大贤。天下无道而乱，则小国弱国畏惧而役於大国强国。以其力有小大，势有强弱，故有小有大，有弱有强。天下无道，则力胜德，势胜贤，故小役大，弱役强。言二者皆天使然也，顺其天者故存，逆其天者故亡。以其所遭之时然也，故当顺而不当逆。“齐景公曰：既不能令，又不受命，是绝物也。涕出而女於吴”者，孟子引齐景公谓诸侯既不能以令制邻国，又不能受命以制於邻国，是自绝於交通朝聘之事也。於是景公泣涕，以女事於吴。是时吴为强大也，故女於吴，此乃小役大，弱役强者也。“今也小国师大国而耻受命焉，是犹弟子而耻受命於先师也”者，言今也为之小国者，既以师其大国，而耻羞受大国之命焉，如此，是若为之弟子者，以羞耻受教命於先师也。“如耻之，莫若师文王。师文王，大国五年，小国七年，必为政於天下矣”者，言如耻受命於大国，莫若师法文王也。如师法文王，则大国不过五年，小国不过七年，必能为政行於天下矣。以言其时之易也。“《诗》云：商之孙子，其丽不亿，上帝既命，侯于周服。侯服于周，天命靡常。殷士肤敏，将于京”者，此盖《诗·大雅·文王》之篇文也。孟子所以引此者，盖言其天命靡常、惟德是亲之意也。其诗言商王之子孙虽相附丽，而不足以为强，虽数至亿，而不足以为众。至文王膺受上天之骏命，而商之孙子，乃为君侯於周之九服中，然为君处服于周，是天命靡常，惟德是亲也。不特商之子孙如此，其为殷之侯者，为壮美之士，亦莫不执鬯之礼，而皆助祭於周之京师也。孔子曰“：仁不可为众也，夫国君好仁，天下无敌”者，言孔子有曰为仁者，不可为众而当之也，夫国君能好仁，则天下无敢与之敌也。“今也欲无敌於天下而不以仁，是犹执热而不以濯也”者，言今也欲为无敌於天下，而不以仁为之，是若持其热物而不以濯也。濯者以水濯其手也。“《诗》云：谁能执热，逝不以濯”，盖《诗》之《大雅·桑柔》之篇文也。孟子於此所以引之，盖谓《诗》有云，言谁能持其热物往而不以水濯手也。以其执热，须濯手於水也，如欲无敌於天下，必须为仁也。○注“齐景公，齐侯。景，谥也”至“为婚”。○正义曰：云“景，谥也”者，案《史记》云：灵王十六年，齐庄公母弟杵臼立，是为景公，在位五十八年，卒，谥曰景。地近荆蛮，故注云蛮夷也。○注“《诗·大雅》”至“无当也”。正义曰：笺云：丽，数也。于，於也。言商之子孙，其数不徒亿多言之也，至天已命文王之後，乃为君於周之九服中。言众之不如德也。九服，案《周礼》九服云：“侯甸男采卫蛮夷镇蕃人也。”毛注云：“殷士，殷侯也。肤，美也。敏，疾也。，灌鬯也。将，行也。”郑云：“谓以圭瓒酌郁鬯以献尸也。瓒如大，五升，口径八寸，深二寸，其柄用圭。”是也。○注“《诗·大雅·桑柔》之篇”。○正义曰：笺云：当如手持热物之用濯，亦犹治国之道当用其贤人者也。" }
      - { type: j, text: "孟子曰：“不仁者可与言哉？安其危而利其，乐其所以亡者。不仁而可与言，则何亡国败家之有？" }
      - { type: z, text: "言不仁之人，以其所以为危者反以为安，必以恶见亡而乐行其恶，如使其能从谏从善可与言议，则天下何有亡国败家也？" }
      - { type: j, text: "有孺子歌曰：‘沧浪之水清兮，可以濯我缨。沧浪之水浊兮，可以濯我足。’孔子曰：‘小子听之，清斯濯缨，浊斯濯足矣。自取之也。’" }
      - { type: z, text: "孺子，童子也。小子，孔子弟子也。清、浊所用，尊、卑若此。自取之，喻人善、恶见尊、贱乃如此。" }
      - { type: j, text: "夫人必自侮，然後人侮之；家必自毁，而後人毁之；国必自伐，而後人伐之。" }
      - { type: z, text: "人先自为可侮慢之行，故见侮慢也；家先自为可毁坏之道，故见毁也；国先自为可诛伐之政，故见伐也。" }
      - { type: j, text: "《太甲》曰：‘天作孽，犹可违。自作孽，不可活。’此之谓也。”" }
      - { type: z, text: "以见上篇，说同。“孟子曰”至“此之谓也”。正义曰：此章指言人之安危，皆由於己，先自毁伐，人乃讨攻讨，甚于天孽，敬慎而已，如临深渊，战战恐惧也。“孟子曰：不仁可与言哉？安其危而利其，乐其所以亡者。不仁而可与言，则何亡国败家之有”者，孟子言不仁之人可与言哉？言不可与之言也。以其不仁之人，以危为之安，以为之利，乐行其所以亡者也。如不仁而可以与言议，以其能从谏从善也，如此，则何有亡国败家者哉！言不能亡国败家也。“有孺子歌曰：‘沧浪之水清兮，可以濯我。沧浪之水浊兮，可以濯我足”者，“子曰”至“自取之也”者，孟子言有孺子歌咏，曰沧浪之水清兮，则可以洗濯我之缨；沧浪之水浑浊兮，则可以洗濯我之足。以其缨在上，人之所贵，水清而濯缨，则清者人之所贵也；足在下，人之所贱，水浊而濯足，则浊者人之所贱也。孔子曰：小子当听之，清，斯濯其缨，浊，斯濯其足。贵、贱人所自取之也。孺子，童稚也。小子，则孔子称弟子也。清斯喻仁，浊斯喻不仁，言仁与不仁，见贵、贱亦如此也。“夫人必自侮，然後人侮；之家必自毁，而後人毁之；国必自伐，而後人伐之”者，孟子言夫人苟自为可侮之事，然後人从其事而侮慢之；家自为可毁ゥ之事，而後人从而毁ゥ之；国必自为可诛戮之事，而人然後从而诛戮之：斯亦自取之谓也。“《太甲》曰：天作孽，犹可违。自作孽，不可活。此之谓也”者，已说在上篇。○注云“如临深渊，战战恐惧也”。○正义曰：此盖《诗》之《小雅·小》之篇文也，注云“战战恐惧”也，赵氏放之而已。" }
      - { type: j, text: "孟子曰：“桀、纣之失天下也，失其民也。失其民者，失其心也。" }
      - { type: z, text: "失其民之心，则天下畔之，箪食壶浆以迎武王之师是也。" }
      - { type: j, text: "得天下有道，得其民，斯得天下矣。得其民有道，得其心，斯得民矣。得其心有道，所欲与之聚之，所恶勿施尔也。" }
      - { type: z, text: "欲得民心，聚其所欲而与之。尔，近也。勿施行其所恶，使民近，则民心可得矣。" }
      - { type: j, text: "民之归仁也，犹水之就下、兽之走广也。故为渊驱鱼者獭也，为丛驱爵者也。为汤、武驱民者，桀与纣也。今天下之君有好仁者，则诸侯皆为之驱矣。虽欲无王，不可得已。" }
      - { type: z, text: "民之思明君，犹水乐卑下，兽乐广野，驱之则归其所乐。獭，犭宾也。，土也。故云诸侯好为仁者，驱民若此也。汤、武行之矣，如有则之者，虽欲不王，不可得也。" }
      - { type: j, text: "今之欲王者，犹七年之病求三年之艾也。苟为不畜，终身不得。苟不志於仁，终身忧辱，以陷於死亡。" }
      - { type: z, text: "今之诸侯欲行王道，而不积其德。如至七年病，而却求三年时艾，当畜之乃可得，以三年时不畜藏之，至七年欲卒求之，何可得乎？艾可以为灸人病，乾久益善，故以为喻志仁者亦久行之，不行之，则忧辱以陷死亡，桀、纣是也。" }
      - { type: j, text: "《诗》云：‘其何能淑？载胥及溺。’此之谓也。" }
      - { type: z, text: "《诗·大雅·桑柔》之篇。淑，善也。载，辞也。胥，相也。刺时君臣何能为善乎？但相与为沉溺之道也。“孟子曰桀纣”至“此之谓也”。○正义曰：此章指言水性趋下，民乐归仁；桀纣之驱，使就其君；三年之艾，畜而可得；一时欲仁，犹将沉溺。所以明鉴戒也，是可哀伤也。“孟子曰：“桀纣之失天下也”至“心也”者，孟子言桀纣失亡天下，是失其民。失其民，乃是失其民之心也。“得天下有道”至“勿施尔也”者，言人君所以得天下有其道也，得其民，斯为得天下矣；所以得其民有道者，得其民之心，斯为得民矣；所以得其心有道，在民所欲，而与之聚之，民之所恶，而勿施於民，则近得其民心矣。“民之归仁也”至“不可得已”者，言民之归亲於仁人之君，如水之归就於下，兽之乐趋於广野矣。故为渊而驱聚其鱼而归之渊者，是獭为之驱矣。为丛木而驱聚其爵而归之丛者，是鹰为之驱也。为汤王、武王而驱聚其民而归之汤、武者，是桀与纣也。今夫天下为之君者，有能好行其仁政，则天下之诸侯皆为驱聚其民而归之，亦如獭为渊驱鱼，为丛驱爵者而归之矣。如此，虽欲不为王，不可得而不为耳。“今之欲王者，犹七年之病”至“於死亡”者，言今之国君欲为王者，如七年之病，欲卒而求讨三年之艾草也。苟为已前不积，虽终身而死，亦不得此三年之艾也。若苟不志仁於久，虽终一身忧辱，亦以陷於死亡之地矣。“诗云：‘其何能淑，载胥及溺’，此之谓也”，盖《诗》之《大雅·桑柔》之篇文也。盖言何能为之善乎，但相与及其沉溺於患难也。孟子所以言此者，欲时君在於久行其仁，不但欲为之王然後乃行之耳。○注“獭，犭宾也。，土也”。○正义曰：案《释名》云：“獭形如猫，居水，食鱼者也。”犭宾，獭之属也。，鹞之属也，能食鸟雀。○《诗·大雅·桑柔》之篇。○正义曰：此诗盖芮伯刺厉王之诗也。" }
      - { type: j, text: "孟子曰：“自暴者不可与有言也，自弃者不可与有为也。言非礼义，谓之自暴也。吾身不能居仁由义，谓之自弃也。" }
      - { type: z, text: "言人尚自暴自弃，何可与有言、有为。" }
      - { type: j, text: "仁，人之安宅也。义，人之正路也。旷安宅而弗居，舍正路而不由，哀哉！”" }
      - { type: z, text: "旷，空。舍，纵。哀，伤也。弗由居是者，是可哀伤也。“孟子曰”至“哀哉”。正义曰：此章指言旷仁舍义，自暴弃之道也。“孟子曰：自暴者不可与有言，自弃者不可与有为也”者，孟子言人之有为自暴者，不可与之言议也；有为自弃者，不可与之有所为也。“言非礼义，谓之自暴也。吾身不能居仁由义，谓之自弃也”者，此盖孟子自解自暴自弃之言也。“仁，人之安宅也”至“哀哉”者，孟子言仁道乃人之所安之宅舍也，义乃为人之正路也。今有空旷其此宅而不安居之，舍去此正路而不行之者，是可得而哀伤之者也。此孟子所以有是而言於当世也。" }
      - { type: j, text: "孟子曰：“道在迩而求诸远，事在易而求诸难。人人亲其亲，长其长，而天下平。”" }
      - { type: z, text: "迩，近也。道在近，而患人求之远也。事在易，而患人求之难也。谓不亲其亲，以事其长，故其事远而难也。正义曰：此章指言亲亲敬长，近取诸己，则迩而易者也。“孟子曰”至“天下平”者，孟子言道在近，而人乃求远，事在易，而人乃求之於难。但人人亲爱其所亲，敬长其所长，则天下即太平大治矣。亲亲即仁也，长长即义也。" }
      - { type: j, text: "孟子曰：“居下位而不获於上，民不可得而治也。获於上有道，不信於友，弗获於上矣。信於友有道，事亲弗悦，弗信於友矣。悦亲有道，反身不诚，不悦於亲矣。诚身有道，不明乎善，不诚其身矣。" }
      - { type: z, text: "言人求上之意，先从己始，本之於心，心不正而得人意者，未之有也。" }
      - { type: j, text: "是故诚者，天之道也。思诚者，人之道也。至诚而不动者，未之有也。不诚，未有能动者也。”" }
      - { type: z, text: "授人诚善之性者，天也，故曰天道。思行其诚以奉天者，人道也。至诚则动金石，不诚则鸟兽不可亲狎，故曰不诚未有能动者也。“孟子曰”至“未有能动者也”。正义曰：此章指言事上得君，乃可临民；信友悦亲，本在於身：是以曾子三省，大雅矜矜，以诚为贵也。“孟子曰：居下位而不获於上，民不可得而治也”者，孟子言居下位而为君上之臣者，而不见获於上，则民故不可得而治之也。以其上之所以得民者，乃治也。“获於上有道”至“不诚其身”者，言获於上者有其道，如不信於友，则弗获於上矣，以其君之所以愿乎臣者，忠也，如臣弗信於友，则其忠不足称矣，此所以弗获於上矣。信於友有其道，如事其亲而弗悦其亲，则亦弗信於友矣，以其友之所以资於己者仁也，如事亲弗悦，则其仁不足称矣，此所以弗信於友矣。悦亲有其道，如反己而不诚，则弗悦於亲矣，以其亲之所望於己者孝也，如反身不诚，则其孝不足称矣，此所以不悦於亲。诚身有其道，如不能明乎善，则不诚其身矣，以其所谓诚者，亦明乎在我之善而已，如不明其善，则在我之善有所未明，又安知所谓诚？故不明乎善，则不诚其身矣。由此推之，则信於友，是获於上之道也，悦亲是信於友之道也，诚身是悦亲之道也，而明乎善者是又诚身之道也。“是故诚者，天道也。思诚者，人道也。至诚而不动者，未之有也。不诚，未有能动者也”者，孟子言此故诚者是天授人诚善之性者也，是为天之道也；思行其诚以奉天，是为人之道也。然而至诚而有不感动者，必无也，故曰未之有也。不至诚而能感动之者，亦必无也。故曰未有能动者也。○注“曾子三省，大雅矜矜”。○正义曰：《论语》云：“曾子曰：吾日三省吾身，为人谋而不忠乎，与朋友交而不信乎，传不习乎？”是曾子三省之事也。大雅矜矜，此盖荀卿之言然。" }
      - { type: j, text: "孟子曰：“伯夷辟纣，居北海之滨，闻文王作兴，曰：‘盍归乎来！吾闻西伯善养老者。’" }
      - { type: z, text: "伯夷让国，遭纣之世，辟之，隐遁北海之滨，闻文王起兴王道，“盍归乎来”，归周也。" }
      - { type: j, text: "太公辟纣，居东海之滨，闻文王作兴，曰：‘盍归乎来！吾闻西伯善养老者。’" }
      - { type: z, text: "太公，吕望也，亦辟纣世，隐居东海，曰闻西伯养老。二人皆老矣，往归文王也。" }
      - { type: j, text: "二老者，天下之大老也，而归之，是天下之父归之也。天下之父归之，其子焉往？" }
      - { type: z, text: "此二老犹天下之父也，其馀皆天下之子耳。子当随父，二父往矣，子将安如？言皆归往也。" }
      - { type: j, text: "诸侯有行文王之政者，七年之内，必为政於天下矣。”" }
      - { type: z, text: "今之诸侯，如有能行文王之政者，七年之间，必足以为政矣。天以七纪，故云七年。文王时难故久，衰周时易故速也。上章言大国五年者，大国地广人众，易以行善，故五年足以治也。“孟子曰”至“必为政於天下矣”。○正义曰：此章指言养老尊贤，国之上务，文王勤之，二老远至。父来子从，天之顺道。七年为政，以勉诸侯，欲使庶几行善也。“孟子曰：伯夷辟纣”至“养老者”，孟子言伯夷辟纣之世，乃辟纣而逃遁，居於北海之畔，後闻文王作兴而起王道，乃曰：盍归乎来，归周也，我闻之西伯善养其耆老者也。“太公辟纣”至“养老者”，孟子又言太公辟纣之乱，而辟居於东海之畔，後闻文王兴起，乃曰：盍归乎来，归周也，我闻西伯善养其耆老者也。“二老者，天下之大老也”至“其子焉往”者，言伯夷、太公二老，乃天下之太老也，犹父也，而皆归之，是天下之父归之。天下之父既归之，其为天下之子又焉往，是必皆归之也。○注“伯夷让国”至“归周也”。○正义曰：案太史公云：其传曰伯夷、叔齐、孤竹君之二子也。父欲立叔齐，及父卒，叔齐让伯夷。伯夷曰：父命也。遂逃去。叔齐亦不肯立，而逃之。国人立其中子。於是伯夷、叔齐闻西伯昌善养老，盍往归焉。後因叩马谏武王。武平殷乱，二人耻食周粟，隐於首阳山，且饿死焉。孔子云“伯夷叔齐，饿於首阳山之下”是也。又云：太公望，东海之上人也，或云处士，隐海滨。周西伯招吕尚，吕尚亦曰：吾闻西伯贤，又善养老，盍往焉。○注云“天以七纪，故云七年”。○正义曰：《书》云五纪，曰岁、月、日、星，辰、历数，今云七纪者，案鲁昭公十年《左传》云：“天以七纪。”杜注云：二十八宿，四七。是其旨也。" }
      - { type: j, text: "孟子曰：“求也为季氏宰，无能改於其德，而赋粟倍他日。孔子曰：‘求非我徒也，小子鸣鼓而攻之可也。’" }
      - { type: z, text: "求，孔子弟子冉求。季氏，鲁卿季康子。宰，家臣。小子，弟子也。孔子以冉求不能改季氏使从善，为之多敛赋粟，故欲使弟子鸣鼓以声其罪，而攻伐责让之。曰“求非我徒”，疾之也。" }
      - { type: j, text: "由此观之，君不行仁政而富之，皆弃於孔子者也，况於为之强战？争地以战，杀人盈野；争城以战，杀人盈城：此所谓率土地而食人肉，罪不容於死。" }
      - { type: z, text: "孔子弃富不仁之君者，况於争城争地而杀人满之乎？此若率土地使食人肉也，言其罪大，死刑不足以容之。" }
      - { type: j, text: "故善战者服上刑，连诸侯者次之，辟草莱、任土地者次之。”" }
      - { type: z, text: "孟子言天道重生，战者杀人，故使善战者服上刑。上刑，重刑也。连诸侯，合从者也，罪次善战者。辟草莱，任土地，不务德而富国者，罪次合从连横之人也。“孟子曰求也”至“次之”。○正义曰：此章指言聚敛富君，弃於孔子，冉求行之，同闻鸣鼓。以战杀人，土食人肉，罪不容死，以为大戮，重人命之至也。“孟子曰求也为季氏宰”至“攻之可也”者，孟子言冉求为季氏之家臣，不能佐君改於其德，以为治国，而乃聚敛其粟，倍过於他日。孔子责之曰：求非我之徒弟也。乃令弟子鸣鼓，以声其罪而攻之可也。“由此观之，君不行仁政”至“罪不容於死”者，孟子言由此冉求赋敛观之以孔子所攻，则今之国君不行仁政而富之，是皆弃之於孔子者也。又况为之强战？争地以战，而杀人至於盈满其野，争城以战，而杀人至於盈满其城，此所谓率土地而食人之肉也，其罪必不容於死。以其罪大，虽死刑不足以容之也。“故善战者服上刑”至“任土地者次之”者，孟子又言故善能为陈而战者，服於上刑。上刑，重刑也。合纵连横之诸侯，罪次之，以其罪次於善战之上刑也。务广开辟草莱，而任土地，不务德者，又次之，以其又次连横合纵之诸侯者刑也。○注“求，孔子弟子”至“疾之也”。○正义曰：案《史记·弟子传》云：“冉求字子有。”郑氏曰：“鲁国人。”又案《论语》云：“季氏富於周公，而求也为之聚敛而附益之。子曰：‘非吾徒也，小子鸣鼓而攻之可也。’”孔安国云：“冉求为季氏宰，为之急赋税。”郑注云：“小子，门人也。”云“季氏，鲁卿季康子”者，案《左传》云：“季康子，鲁卿，季孙肥，谥曰康。”《谥法》曰：“安乐抚民曰康。”" }
      - { type: j, text: "孟子曰：“存乎人者，莫良於眸子。眸子不能掩其恶。" }
      - { type: z, text: "眸子，瞳子也。存人，存在人之善心也。" }
      - { type: j, text: "胸中正则眸子了焉，胸中不正则眸子毛焉。" }
      - { type: z, text: "了，明也。毛者，蒙蒙目不明之貌。" }
      - { type: j, text: "听其言也，观其眸子，人焉哉！”" }
      - { type: z, text: "，匿也。听言察目，言正视端，人情可见，安可匿之哉。“孟子曰存乎人者”至“人焉哉”。○正义曰：此章指言目为神候，精之所在，存而察之，善恶不隐，知人之道，斯为审矣。“孟子曰：存乎人者，莫良於眸子。眸子不能掩其恶”者，孟子言存在於人者，莫贵乎眸子。眸子，目瞳子也。眸子不能盖掩人之恶也。“胸中正则眸子了焉，胸中不正则眸子毛焉”者，言人胸中正而不邪，则眸子於是乎明。了，明也。胸中不正，则眸子蒙蒙而不明。毛，不明也。“听其言也，观其眸，子人焉哉”者，言知人之道，但听其言，观其眸子明与不明，则人可见，又安可匿之哉？此孟子言知人之道，但观人之眸子耳。○注“眸，瞳子。了，明。毛，不明之貌”。○正义曰：是皆蒙《释文》而言之也。" }
      - { type: j, text: "孟子曰：“恭者不侮人，俭者不夺人。侮夺人之君，惟恐不顺焉，恶得为恭俭？”" }
      - { type: z, text: "为恭敬者，不侮慢人。为廉俭者，不夺取人。有好侮夺人之君，有贪陵之性，恐人不顺从其所欲，安得为恭俭之行也？" }
      - { type: j, text: "“恭、俭岂可以声音笑貌为哉？”" }
      - { type: z, text: "恭、俭之人，俨然无欲，自取其名，岂可以和声音笑貌强为之哉。“孟子曰恭者”至“为哉”。○正义曰：此章指言人君恭俭，率下移风，人臣恭俭，明其廉忠。侮夺之恶，何由干之，而错其心。“孟子曰：恭者，不侮人”至“岂可以声音笑貌为哉”者，孟子言为之恭俭者，则不侮慢於人，亦不能僭夺於人，盖以恭敬则不侮，俭约则不奢故也。如有侮夺人之君，惟恐其民不顺己之所欲，安得为恭俭者焉，为之恭俭，又岂可以声音笑貌为之恭俭哉？言人为恭俭，在心之所存，不在於声音与其笑貌为之矣。" }
      - { type: j, text: "淳于髡曰：“男女授受不亲，礼与？”" }
      - { type: z, text: "淳于髡，齐人也。问礼男女不相亲授。" }
      - { type: j, text: "孟子曰：“礼也。”" }
      - { type: z, text: "礼不亲授。" }
      - { type: j, text: "曰：“嫂溺，则援之以手乎？”" }
      - { type: z, text: "髡曰：见嫂溺水，则当以手牵援之否邪？" }
      - { type: j, text: "曰：“嫂溺不援，是豺狼也。" }
      - { type: z, text: "孟子曰：人见嫂溺，不援出，是为豺狼之心也。" }
      - { type: j, text: "男女授受不亲，礼也。嫂溺援之以手者，权也。”" }
      - { type: z, text: "孟子告髡曰：此权也。权者，反经而善也。" }
      - { type: j, text: "曰：“今天下溺矣，夫子之不援，何也？”" }
      - { type: z, text: "髡曰：今天下之道溺矣，夫子何不援之乎？" }
      - { type: j, text: "曰：“天下溺，援之以道。嫂溺，援之以手。子欲手援天下乎？”" }
      - { type: z, text: "孟子曰：当以道援天下，而道不得行，子欲使我以手援天下乎？“淳于髡曰”至“子欲手援天下乎”。○正义曰：此章指言权时之义，嫂溺援手，君子大行，拯世以道，道之指也。“淳于髡曰：男女授受不亲，礼与”者，淳于髡，齐国之人也，问孟子曰：男女授受之际，不相亲授，是礼然与否？“孟子曰礼也”，孟子答之，以为是礼然也。“曰嫂溺则援之以手乎”者，髡又问孟子，如是则嫂之沉溺於水，当以牵援以手乎？“曰嫂溺不援，是豺狼也”，孟子言如嫂之沉溺於水，而不牵援之者，是有豺狼之心者也。以其豺狼之为兽，其心常有害物之暴，故以喻之也。“男女授受不亲，礼也。嫂溺援之以手者，权也”者，孟子又告淳于髡，以谓男女授受不亲，是礼当然也，嫂之沉溺援之以手者，是权道也。夫权之为道，所以济变事也，有时乎然，有时乎不然，反经而善，是谓权道也。故权云为量，或轻或重，随物而变者也。“曰：今天下溺矣，夫子之不援之，何也”，髡复问孟子，言今天下之道以沉溺之也，夫子之不拯援之，是如之何？“曰：天下溺，援之以道，嫂溺，援之以手。子欲手援天下乎”，孟子言天下之沉溺，当以道拯援之，嫂溺则当以手援之，今子之言，是欲使我以手援天下乎？此言不可以手援天下，当以道援之矣。斯亦明淳于髡之蔽也。" }
      - { type: j, text: "公孙丑曰：“君子之不教子，何也？”" }
      - { type: z, text: "问父子不亲教，何也？" }
      - { type: j, text: "孟子曰：“势不行也。教者必以正。以正不行，继之以怒。继之以怒，则反夷矣。夫子教我以正，夫子未出於正也，则是父子相夷也。父子相夷，则恶矣。”" }
      - { type: z, text: "父亲教子，其势不行。教以正道，而不能行，则责怒之。夷，伤也。父子相责怒，则伤义矣。一说云：父子反自相非，若夷狄也。子之心责於父，云：夫子教我以正道，而夫子之身未必自行正道也。执此意则为反夷矣，故曰恶也。" }
      - { type: j, text: "古者易子而教之，父子之闻不责善，责善则离，离则不祥莫大焉。" }
      - { type: z, text: "易子而教，不欲自相责以善也。父子主恩，离则不祥莫大焉。“公孙丑曰”至“不祥莫大焉”。○正义曰：此章指言父子至亲，相责则离。易子而教，相成以仁，教之义也。“公孙丑曰：君子之不教子，何也”，公孙丑问孟子，言君子以不自教诲其子，是如之何。“孟子曰：势不行也”至“父子相夷则恶矣”者，孟子答公孙丑，以谓君子所以不教子者，是其势之不行，所以不自教也。教之者，必以正道而教之，以正道而教之而子不行，则续之愤怒。既续之以愤怒，则反伤其为父子之恩矣。夷，伤也。父子之恩，则父慈子孝，是为父子之恩也。今继之以怒，是非父之慈也。且以子比之，夫子既教我以正道，而子之身自未能出行其正道也，如父子之间，子以是言而反父，是则父子相伤矣。父子既以相伤其恩，则父子必相疾恶也。故云则恶矣。“古者易子而教之，父子之间不责善。责善则离，离则不祥莫大焉”者，孟子又言古之时，人皆更易其子而教之者，以其父子之间不相责让其善也。如父子自相责让，则父子之恩必离之矣。父子恩离，则不祥之大者也。所谓易子而教者，如己之子与他人教，他人之子与己而教之，是易子而教也。所谓不祥之大者，则祸之大者矣。○注：夷有二说，一说则以夷训伤，一说以夷为夷狄，其义皆通矣。" }
      - { type: j, text: "孟子曰：“事孰为大？事亲为大。守孰为大？守身为大。不失其身而能事其亲者，吾闻之矣。失其身而能事其亲者，吾未之闻也。" }
      - { type: z, text: "事亲，养亲也。守身，使不陷於不义也。失不义，则何能事父母乎？" }
      - { type: j, text: "孰不为事？事亲，事之本也。孰不为守？守身，守之本也。" }
      - { type: z, text: "先本後末，事、守乃立也。" }
      - { type: j, text: "曾子养曾，必有酒肉。将彻，必请所与。问：‘有馀？’必曰：‘有。’曾死，曾元养曾子，必有酒肉。将彻，不请所与。问：‘有馀？’曰：‘亡矣。’将以复进也。此所谓养口体者也。若曾子，则可谓养志也。事亲若曾子者可也。”" }
      - { type: z, text: "将彻，请所与，问曾所欲与子孙所爱者也。必曰有，恐违亲意也，故曰养志。曾元曰“无”，欲以复进曾子也，不求亲意，故养口体也。事亲之道，当如曾子之法，乃为至孝。“孟子曰事孰为大”至“可也”。○正义曰：此章指言上孝养志，下孝养体，曾参事亲，可谓至矣。孟子言之，欲令后人则曾子也。“孟子曰：事孰为大？事亲为大。守孰为大？守身为大”至“吾未之闻也”者，孟子言人之所事者何事为大？以其事父母之亲为大者也；人之所守者何守为大？以其守己之身为大也。不失其身，而为能事其父母之亲，则我尝闻之矣；如失其身，而能事父母之亲，则我未之闻也。盖以己身尚不能守之，况能事其父母乎。“孰不为事？事亲，事之本也。孰不为守？守身，守之本也”者，言人谁不为所事，凡有所事於彼者，是皆为所事也，然而事父母之亲，是所事之本也。夫人谁不为所守，凡有所守於我者，是皆为所守也，然而守身，是所守之本也。所谓身安而国家可保，事亲孝，故忠可移於君，此之谓也，岂非事亲、守身为事为守之本者欤？“曾子养曾”至“事亲若曾子可也”者，孟子又言昔日曾子奉养其父曾，必有酒肉，将欲彻去，曾子必请所欲与者，如曾问复有馀剩，曾子必应曰有馀剩。曾已死，曾元奉养其曾子，曾元，曾子之子也，必有酒肉，将欲彻去，曾元不请所欲与者，如曾子复问有馀剩，曾元乃应之曰无矣，遂将以酒食复进曾子也，如此，是谓养其父之口体而已。必若曾子之养父，乃可谓养其父之志也。如事其亲，若曾子之事亲，则可矣。盖曾子知父欲有馀者与之所爱之子孙，故徇而请其所与，问有馀，故复应之曰有。是其遂其亲之志意，而不违者也，故曰养志也。曾元反此，盖有违逆其亲之志意，但为养口体者也，非养志者也。故孟子所以言事亲若曾子，则可以为之孝子。" }
      - { type: j, text: "孟子曰：“人不足与也，政不足与间也。惟大人为能格君心之非。" }
      - { type: z, text: "，过也。《诗》云：“室人交遍我。”，非。格，正也。时皆小人居位，不足过责也。政教不足复非讠尤，独得大人为辅臣，乃能正君之非法度也。" }
      - { type: j, text: "君仁莫不仁，君义莫不义，君正莫不正，一正君而国定矣。”" }
      - { type: z, text: "正君之身，一国定矣。欲使大人正之。“孟子曰”至“一正君而国定矣”。○正义曰：此章指言小人为政，不足间非；贤臣正君，使握道机。君正国定，下不邪侈，将何间者也？“孟子曰：人不足与也”至“为能格君心之非”者，孟子言小人在位，不能事君，不足责之也，所行政教亦不足间非也，惟大人之为臣而事其君，故能格正君心之非也。○注“《诗》云室人交遍我”。○正义曰：盖《诗·国风·北门》之篇文也，云我入自外，室人交遍谪我。笺云：“我从外入，在室之人，更迭遍来责我，使己去也。言室人亦不知己志也。”" }
      - { type: j, text: "孟子曰：“有不虞之誉，有求全之毁。”" }
      - { type: z, text: "虞，度也。言人之行，有不虞度其时有名誉而得者，若尾生本与妇人期於梁下，不度水之卒至，遂至没溺，而获守信之誉。求全之毁者，陈不瞻将赴君难，闻金鼓之声，失气而死，可谓欲求全其节，而反有怯弱之毁者也。正义曰：此章指言不虞获誉，不可为戒；求全受毁，未足惩咎：君子正行，不由斯二者也。孟子言人有不虞度其功而终获其名誉，又有欲求全其行而终反受其人之毁者。以言其君子之人，於毁、誉不容心於其间，但务为善之实而不期人之誉，务去其不善之实而不愠人之毁，是皆行义以俟命而已矣。○注尾生与陈不瞻之事。○正义曰：此皆据《史记》之文而言之也。其事烦，故不重述耳。" }
      - { type: j, text: "孟子曰：“人之易其言也，无责耳矣。”" }
      - { type: z, text: "人之轻易其言，不得失言之咎责也。一说人之轻易不肯谏正君者，以其不在言责之位者也。正义曰：此章指言言出于身，驷不及舌，不惟其责，则易之张。" }
      - { type: j, text: "孟子曰：“人之患，在好为人师。”" }
      - { type: z, text: "人之所患，患於不知己未有可师而好为人师者，乃惑也。正义曰：此章指言君子好谋而成，临事而惧，时然后言，畏失言也。故曰师哉师哉，桐子之命，不慎则有患矣。言君子之患，在好为人师也。“孟子曰：人之患，在好为人师”者，孟子言人之有患，非他，特在其好为人之师也。盖在人患在於不知己，未有可师耳，如务在好为人师，则惑也。" }
      - { type: j, text: "乐正子从於子敖之齐。乐正子见孟子。" }
      - { type: z, text: "鲁人乐正克，孟子弟子也，从於齐之右师子敖。子敖使而之鲁，乐正子随之来之齐也。孟子在齐，乐正子见之也。" }
      - { type: j, text: "孟子曰：“子亦来见我乎？”" }
      - { type: z, text: "孟子见其来见迟，故云亦来也。" }
      - { type: j, text: "曰：“先生何为出此言也？”" }
      - { type: z, text: "乐正子曰：先生何为非克而出此言也。" }
      - { type: j, text: "曰：“子来几日矣？”" }
      - { type: z, text: "孟子问子来几日乎？" }
      - { type: j, text: "曰：“昔者。”" }
      - { type: z, text: "克曰：昔者来至。昔者，往也。谓数日之间也。" }
      - { type: j, text: "曰：“昔者，则我出此言也，不亦宜乎？”" }
      - { type: z, text: "孟子曰：昔者来至，而今乃来，我出此言，亦其宜也。孟子重爱乐正子，欲亟见之，深思望重也。" }
      - { type: j, text: "曰：“舍馆未定。”" }
      - { type: z, text: "克曰：所止舍馆未定，故不即来也。馆，客舍。" }
      - { type: j, text: "曰：“子闻之也，‘舍馆定然後求见长者’乎？”" }
      - { type: z, text: "孟子曰：子闻见长者之礼当须舍馆定乃见之乎？" }
      - { type: j, text: "曰：“克有罪。”" }
      - { type: z, text: "乐正子谢过服罪也。“乐正子”至“克有罪”。○正义曰：此章指言尊师重道，敬贤事长，人之大纲。乐正子好善，故孟子讥之，责贤者备也。“乐正子从子敖之齐”，乐正子从子敖往齐，而见孟子。“孟子曰：子亦来见我乎”，孟子见乐正子来迟，故曰子亦来见我乎？”“曰先生何为出此言也”，乐正子问孟子，何为於我而出此言也。“曰子来几日矣”，孟子又问乐正子从子敖到齐以几日乎？“曰昔者”，乐正子曰：往日来至，若数日之间也。“曰昔者，则我出此言也，不亦宜乎”，孟子又言子到数日，而今乃来见我，则我出此言，是其宜也。“曰舍馆未定”，乐正子又曰：为客馆所止未定，故不能即来也。“曰子闻之也，舍馆定然後求见长者乎”，孟子又言子曾闻见长者之礼，必待舍馆定然後乃见长者乎！“曰克有罪”，乐正子於是无所答，乃对孟子曰：是克有罪也。以其待舍馆定然後见，非尊师重道者也。宜孟子以此责之。" }
      - { type: j, text: "孟子谓乐正子曰：“子之从於子敖来，徒啜也。我不意子学古之道，而以啜也。”" }
      - { type: z, text: "子敖，齐之贵人右师王者也。学而不行其道，徒食饮而已，谓之啜也。乐正子本学古圣人之道，而今随从贵人，无所匡正，故言不意子但啜也。“孟子谓乐正子曰”至“而以啜”。○正义曰：此章指言学优则仕，仕以行道，否则隐逸，啜沉浮，君子不与。是以孟子咨嗟乐正子者也。“孟子谓乐正子曰：子之从於子敖来，徒啜也。我不意子学古之道，而以啜也”者，孟子谓乐克曰：子随右师来至齐，是徒以食饮而已。我不意有如子本学古圣人之道，而且今随右师之游，而以徒为其饮食也。孟子所以言此，盖谓子敖我未尝与之学古者，而今子乃随之游，是诎道以从人之谓也。○注云“子敖，齐之贵人右师王者”。○正义曰：此盖以经文推而为解也。《公孙丑》篇云：“孟子为卿於齐，出吊於滕王。使盖大夫王为辅行，王朝暮见，反齐、滕之路，未尝与之言行事也。”下卷言：“公行有子之丧。右师往吊，入门，有进而与右师言者，有就右师之位而与右师言者。孟子不与右师言。右师不悦，曰：‘诸君子皆与言，孟子独不与言，是简也。’孟子闻之，曰：‘礼也，子敖以我为简，不亦异乎？’”是知为齐之贵人右师王者也。" }
      - { type: j, text: "孟子曰：“不孝有三，无後为大。" }
      - { type: z, text: "於礼有不孝者三事，谓阿意曲从，陷亲不义，一不孝也。家穷亲老，不为禄仕，二不孝也。不娶无子，绝先祖祀，三不孝也。三者之中，无後为大。" }
      - { type: j, text: "舜不告而娶，为无後也，君子以为犹告也。”" }
      - { type: z, text: "舜惧无後，故不告而娶。君子知舜告焉不得而娶，娶而告父母，礼也；舜不以告，权也：故曰犹告，与告同也。“孟子曰”至“君子以为犹告也”。○正义曰：此章指言量其轻重，无後不可，是以大舜受尧二女，夫三不孝，蔽者所暗，至于大圣，卓然匪疑，所以垂法也。“孟子曰：不孝有三，无後为大”者，言不孝於礼有三，惟先祖无以承，後世无以继，为不孝之大者，而阿意曲从，陷亲於不义，家贫亲老，不为禄仕，特不孝之小而已。“舜以不告而娶，为无後也，君子以为犹告也”，故孟子乃言此，以谓舜受尧之二女，所以不告父母而娶，是为其无後也，告之则不得娶故也。君子於舜不告而娶，是亦言舜犹告而娶之也。以其反礼而合义，故君子以为不告犹告也。○注“尧二女”。○正义曰：案古史云：舜有二妃，一曰娥皇，二曰女英，并尧之女。" }
      - { type: j, text: "孟子曰：“仁之实，事亲是也。义之实，从兄是也。智之实，知斯二者弗去是也。" }
      - { type: z, text: "事皆有实。事亲、从兄，仁、义之实也。知仁、义所用而不去之，则智之实也。" }
      - { type: j, text: "礼之实，节文斯二者是也。乐之实，乐斯二者。" }
      - { type: z, text: "礼义之实，节文事亲从兄，使不失其节，而文其礼敬之容，故中心乐之也。" }
      - { type: j, text: "乐则生矣，生则恶可已也。恶可已，则不知足之蹈之，手之舞之。”" }
      - { type: z, text: "乐此事亲从兄，出於中心，则乐生其中矣。乐生之至，安可已也，岂能自觉足蹈节、手舞曲哉！“孟子曰”至“足之蹈之，手之舞之也”。正义曰：此章指言仁义之本在于孝弟，孝弟之至通于神明，况于歌舞不能自知，盖有诸中、形於外也。“孟子曰：仁之实，事亲是也”至“知斯二者弗去是也”者，孟子言仁道之本实在事亲是也，义之本实在从兄是也。以其事亲，孝也；从兄，悌也。能孝、悌，是为仁、义矣。智之本实在知事亲之孝、从兄之弟而弗去之者是也。“礼之实，节文斯二者是也。乐之实，乐斯二者”，言礼之本实使事亲从兄者是也。由此言之，则事亲之孝，为仁之实，凡移之於事君者，则为仁之华也。从兄之悌，为义之实，则知凡移於从长者，是为义之华也。知义为智之实，则知前识者是为智之华也。礼之实，在仁义，则威仪为礼之华也。乐之实，在仁义，则节奏为乐之华也。凡此是皆从而可知矣。“乐则生矣，生则恶可已也。恶可已，则不知足之蹈之，手之舞之”，言由仁义之实充之，至於乐则流通而不郁，日进而不已，是其乐则生，生则乌可已。乌可已，则得之於心，而形之於四体，故不知手舞足蹈之所以者也。盖当时有夷子不知一本，告子以义为外，故孟子宜以是言之，而救当时之弊者也。" }
      - { type: j, text: "孟子曰：“天下大悦而将归己，视天下悦而归己犹草芥也，惟舜为然。" }
      - { type: z, text: "舜不以天下将归己为乐，号泣于天。" }
      - { type: j, text: "不得乎亲，不可以为人。不顺乎亲，不可以为子。舜尽事亲之道，而瞽瞍豫。瞽瞍豫，而天下化。瞽瞍底豫，而天下之为父子者定。此之谓大孝。”" }
      - { type: z, text: "舜以不顺亲意为非人子。，致也。豫，乐也。瞽瞍，顽父也。尽其孝道，而顽父致乐，使天下化之，为父子之道者定也。“孟子曰”至“此之谓大孝”。○正义曰：此章指言以天下富贵为不若得意於亲，故能怀协顽器，豫而欣，天下化之，父子加亲，故称盛德者，必百世祀，无与比崇。“孟子曰：天下大悦而将归己，视天下悦而归己犹草芥也，惟舜为然”者，孟子言天下之人皆大悦乐而将归向己，视天下悦而归己但若一草芥，不以为意者，惟大舜为能如此也。“不得乎亲，不可以为人。不顺乎亲，不可以为子”至“此之谓大孝”者，孟子又言人若不得事亲之道，则不可以为人；若得事亲之道，而不能顺事亲之志，故不可以为人之子。惟舜能尽其事父母之道，而瞽瞍顽へ，且亦致乐。瞽瞍既以致乐而先天下，而天下亦从而化之。瞽瞍致乐，故天下父子者亲亲之道定，此所以为舜之大孝矣。故曰此之谓大孝。○注“瞽瞍顽父也”。○正义曰：瞽瞍者，案孔安国《尚书》传云：“无目曰瞽。”舜父有目，不能分别好恶，故时人谓之瞽。配字曰瞍，瞍，无目之称。顽者，《左传》云：“心不则德义之经为顽。”" }
