labels:
  - page: 8
    col: 9
    role: j
    text: 孟子卷第一朱熹集注
  - page: 8
    col: 10
    role: j
    text: 梁惠王章句上
  - page: 8
    col: 11
    role: z
    text: 凡七章
  - page: 8
    col: 12
    role: j
    text: 孟子見梁惠王
  - page: 8
    col: 13
    role: j
    text: 梁惠王魏侯罃也都大梁僭稱王謚
  - page: 8
    col: 14
    role: j
    text: 曰惠王史記惠王三十五年卑禮厚幣
  - page: 8
    col: 15
    role: z
    text: 以招賢者而孟軻至梁
  - page: 8
    col: 16
    role: j
    text: 王曰叟不遠千里而來亦將有以利吾
  - page: 9
    col: 1
    role: j
    text: 國平
  - page: 9
    col: 2
    role: z
    text: 叟長老之稱王所謂利蓋冨國彊兵
  - page: 9
    col: 3
    role: z
    text: 之類
  - page: 9
    col: 4
    role: j
    text: 孟子對曰王何必曰利亦有仁義而已矣
  - page: 9
    col: 5
    role: z
    text: 仁者心之德愛之理義者心之制事
  - page: 9
    col: 6
    role: z
    text: 之冝也此二句乃一章之大指下文
  - page: 9
    col: 7
    role: z
    text: 乃詳言之後多放此
  - page: 9
    col: 8
    role: j
    text: 王曰何以利吾國大夫曰何以利吾家
  - page: 9
    col: 9
    role: j
    text: 士庶人曰何以利吾身上下交征利而
  - page: 9
    col: 10
    role: j
    text: 國危矣萬乗之國弑其君者必千乗之
  - page: 9
    col: 11
    role: j
    text: 家千乗之國弑其君者必百乗之家萬
  - page: 9
    col: 12
    role: j
    text: 取千焉千取百焉不爲不多矣苟爲後
  - page: 9
    col: 13
    role: j
    text: 義而先利不奪不饜
  - page: 9
    col: 14
    role: z
    text: 乗去聲饜於豔反○此言求利之害
  - page: 9
    col: 15
    role: z
    text: 以明上文何必曰利之意也征取也
  - page: 9
    col: 16
    role: z
    text: 上取乎下下取乎上故曰交征國危
  - page: 10
    col: 1
    role: z
    text: 謂將有弑奪之禍乘車數也萬乘之
  - page: 10
    col: 2
    role: z
    text: 國者天子畿内地方千里出車萬乘
  - page: 10
    col: 3
    role: z
    text: 千乘之家者天子之公卿采地方百
  - page: 10
    col: 4
    role: z
    text: 里出車千乘也千乘之國諸侯之國
  - page: 10
    col: 5
    role: z
    text: 百乘之家諸侯之大夫也弑下殺上
  - page: 10
    col: 6
    role: z
    text: 也饜足也言臣之於君每十分而取
  - page: 10
    col: 7
    role: z
    text: 其一分亦已多矣若又以義爲後而
  - page: 10
    col: 8
    role: z
    text: 以利爲先則不弑其君而盡奪之其
  - page: 10
    col: 9
    role: z
    text: 心未肯以爲足也
  - page: 10
    col: 10
    role: j
    text: 未有仁而遺其親者也未有義而後其
  - page: 10
    col: 11
    role: j
    text: 君者也
  - page: 10
    col: 12
    role: z
    text: 此言仁義未甞不利以明上文亦有
  - page: 10
    col: 13
    role: z
    text: 仁義而已之意也遺猶棄也後不急
  - page: 10
    col: 14
    role: z
    text: 也言仁者必愛其親義者必急其君
  - page: 10
    col: 15
    role: z
    text: 故人君躬行仁義而無求利之心則
  - page: 10
    col: 16
    role: z
    text: 其下化之自親戴於已也
  - page: 11
    col: 1
    role: j
    text: 王亦曰仁義而已矣何必曰利
  - page: 11
    col: 2
    role: z
    text: 重言之以結上文兩節之意○此章
  - page: 11
    col: 3
    role: z
    text: 言仁義根於人心之固有天理之公
  - page: 11
    col: 4
    role: z
    text: 也利心生於物我之相形人欲之私
  - page: 11
    col: 5
    role: z
    text: 也循天理則不求利而自無不利徇
  - page: 11
    col: 6
    role: z
    text: 人欲則求利未得而害已隨之所謂
  - page: 11
    col: 7
    role: z
    text: 毫釐之差千里之繆此孟子之書所
  - page: 11
    col: 8
    role: z
    text: 以造端託始之深意學者所宜精察
  - page: 11
    col: 9
    role: z
    text: 而明辨也○太史公曰余讀孟子書
  - page: 11
    col: 10
    role: z
    text: 至梁惠王問何以利吾國未甞不廢
  - page: 11
    col: 11
    role: z
    text: 書而歎也曰嗟乎利誠亂之始也夫
  - page: 11
    col: 12
    role: z
    text: 子罕言利常防其源也故曰放於利
  - page: 11
    col: 13
    role: z
    text: 而行多怨自天子以至於庶人好利
  - page: 11
    col: 14
    role: z
    text: 之弊何以異哉○程子曰君子未甞
  - page: 11
    col: 15
    role: z
    text: 不欲利但專以利爲心則有害惟仁
  - page: 11
    col: 16
    role: z
    text: 義則不求利而未甞不利也當是之
  - page: 12
    col: 1
    role: j
    text: 時天下之人惟利是求而不復知有
  - page: 12
    col: 2
    role: j
    text: 仁義故孟子言仁義而不言利所以
  - page: 12
    col: 3
    role: j
    text: 拔本塞源而救其弊此聖賢之心也
  - page: 12
    col: 4
    role: j
    text: 孟子見梁惠王王立於沼上顧鴻鴈麋
  - page: 12
    col: 5
    role: j
    text: 鹿曰賢者亦樂此乎
  - page: 12
    col: 6
    role: z
    text: 樂音洛篇内同○沼池也鴻鴈之大
  - page: 12
    col: 7
    role: z
    text: 者麋鹿之大者
  - page: 12
    col: 8
    role: j
    text: 孟子對曰賢者而後樂此不賢者雖有
  - page: 12
    col: 9
    role: j
    text: 此不樂也
  - page: 12
    col: 10
    role: z
    text: 此一章之大指
  - page: 12
    col: 11
    role: j
    text: 詩云經始靈臺經之營之庶民攻之不
  - page: 12
    col: 12
    role: j
    text: 日成之經始勿亟庶民子來王在靈囿
  - page: 12
    col: 13
    role: j
    text: 麀鹿攸伏麀鹿濯濯白鳥鶴鶴王在靈
  - page: 12
    col: 14
    role: j
    text: 沼於牣魚躍文王以民力爲臺爲沼而
  - page: 12
    col: 15
    role: j
    text: 民歡樂之謂其臺曰靈臺謂其沼曰靈
  - page: 12
    col: 16
    role: j
    text: 沼樂其有麋鹿魚鼈古之人與民偕樂
  - page: 13
    col: 1
    role: j
    text: 故能樂也
  - page: 13
    col: 2
    role: z
    text: 亟音棘麀音憂鶴詩作翯户角反於
  - page: 13
    col: 3
    role: z
    text: 音烏○此引詩而釋之以明賢者而
  - page: 13
    col: 4
    role: z
    text: 後樂此之意詩大雅靈臺之篇經量
  - page: 13
    col: 5
    role: z
    text: 度也靈臺文王臺名也營謀爲也攻
  - page: 13
    col: 6
    role: z
    text: 治也不日不終日也亟速也言文王
  - page: 13
    col: 7
    role: z
    text: 戒以勿亟也子來如子來趨父事也
  - page: 13
    col: 8
    role: z
    text: 靈囿靈沼臺下有囿囿中有沼也麀
  - page: 13
    col: 9
    role: z
    text: 牝鹿也伏安其所不驚動也濯濯肥
  - page: 13
    col: 10
    role: z
    text: 澤貌鶴鶴潔白貌於歎美辭牣滿也
  - page: 13
    col: 11
    role: z
    text: 孟子言文王雖用民力而民反歡樂
  - page: 13
    col: 12
    role: z
    text: 之旣加以美名而又樂其所有蓋由
  - page: 13
    col: 13
    role: z
    text: 文王能愛其民故民樂其樂而文王
  - page: 13
    col: 14
    role: z
    text: 亦得以享其樂也
  - page: 13
    col: 15
    role: j
    text: 湯誓曰時日害喪予及女偕亡民欲與
  - page: 13
    col: 16
    role: j
    text: 之偕云雖有臺池鳥獸豈能獨樂哉
  - page: 14
    col: 1
    role: z
    text: 害音曷喪去聲女音汝○此引書而
  - page: 14
    col: 2
    role: z
    text: 釋之以明不賢者雖有此不樂之意
  - page: 14
    col: 3
    role: z
    text: 也湯誓商書篇名時是也日指夏桀
  - page: 14
    col: 4
    role: z
    text: 害何也桀嘗自言吾有天下如天之
  - page: 14
    col: 5
    role: z
    text: 有日日云吾乃亡耳民怨其虐故因
  - page: 14
    col: 6
    role: z
    text: 其自言而目之曰此日何時亡乎若
  - page: 14
    col: 7
    role: z
    text: 亡則我寧與之俱亡蓋欲其亡之甚
  - page: 14
    col: 8
    role: z
    text: 也孟子引此以明君獨樂而不恤其
  - page: 14
    col: 9
    role: z
    text: 民則民怨之而不能保其樂也
  - page: 14
    col: 10
    role: j
    text: 梁惠王曰寡人之於國也盡心焉耳矣
  - page: 14
    col: 11
    role: j
    text: 河内凶則移其民於河東移其粟於河
  - page: 14
    col: 12
    role: j
    text: 内河東凶亦然察鄰國之政無如寡人
  - page: 14
    col: 13
    role: j
    text: 之用心者鄰國之民不加少寡人之民
  - page: 14
    col: 14
    role: j
    text: 不加多何也
  - page: 14
    col: 15
    role: z
    text: 寡人諸侯自稱言寡德之人也河内
  - page: 14
    col: 16
    role: z
    text: 河東皆魏地凶歲不熟也移民以就
  - page: 15
    col: 1
    role: z
    text: 食移粟以給其老稚之不能移者○
  - page: 15
    col: 2
    role: j
    text: 孟子對曰王好戰請以戰喻填然鼓之
  - page: 15
    col: 3
    role: j
    text: 兵刃既接棄甲曳兵而走或百步而後
  - page: 15
    col: 4
    role: j
    text: 止或五十步而後止以五十步笑百步
  - page: 15
    col: 5
    role: j
    text: 則何如曰不可直不百步耳是亦走也
  - page: 15
    col: 6
    role: j
    text: 曰王如知此則無望民之多於鄰國也
  - page: 15
    col: 7
    role: z
    text: 好去聲填音田○填鼓音也兵以鼓
  - page: 15
    col: 8
    role: z
    text: 進以金退直猶但也言此以譬鄰國
  - page: 15
    col: 9
    role: z
    text: 不卹其民惠王能行小惠然皆不能
  - page: 15
    col: 10
    role: z
    text: 行王道以養其民不可以此而笑彼
  - page: 15
    col: 11
    role: z
    text: 也楊氏曰移民移粟荒政之所不廢
  - page: 15
    col: 12
    role: z
    text: 也然不能行先王之道而徒以是為
  - page: 15
    col: 13
    role: z
    text: 盡心焉則末矣
  - page: 15
    col: 14
    role: j
    text: 不違農時穀不可勝食也數罟不入洿
  - page: 15
    col: 15
    role: j
    text: 池魚鼈不可勝食也斧斤以時入山林
  - page: 15
    col: 16
    role: j
    text: 材木不可勝用也穀與魚鼈不可勝食
  - page: 16
    col: 1
    role: j
    text: 材木不可勝用是使民養生喪死無憾
  - page: 16
    col: 2
    role: j
    text: 也養生喪死無憾王道之始也
  - page: 16
    col: 3
    role: z
    text: 勝音升數音促罟音古洿音烏○農
  - page: 16
    col: 4
    role: z
    text: 時謂春耕夏耘秋收之時凡有興作
  - page: 16
    col: 5
    role: z
    text: 不違此時至冬乃役之也不可勝食
  - page: 16
    col: 6
    role: z
    text: 言多也數宻也罟網也洿窊下之地
  - page: 16
    col: 7
    role: z
    text: 水所聚也古者網罟必用四寸之目
  - page: 16
    col: 8
    role: z
    text: 魚不滿尺市不得粥人不得食山林
  - page: 16
    col: 9
    role: z
    text: 川澤與民共之而有厲禁草木零落
  - page: 16
    col: 10
    role: z
    text: 然後斧斤入焉此皆爲治之初法制
  - page: 16
    col: 11
    role: z
    text: 未備且因天地自然之利而撙節愛
  - page: 16
    col: 12
    role: z
    text: 養之事也然飲食宫室所以養生祭
  - page: 16
    col: 13
    role: z
    text: 祀棺槨所以送死皆民所急而不可
  - page: 16
    col: 14
    role: z
    text: 無者今皆有以資之則人無所恨矣
  - page: 16
    col: 15
    role: z
    text: 王道以得民心爲本故以此爲王道
  - page: 16
    col: 16
    role: j
    text: 之始
  - page: 17
    col: 1
    role: j
    text: 五畝之宅樹之以桑五十者可以衣帛
  - page: 17
    col: 2
    role: j
    text: 矣雞豚狗彘之畜無失其時七十者可
  - page: 17
    col: 3
    role: j
    text: 以食肉矣百畝之田勿奪其時數口之
  - page: 17
    col: 4
    role: j
    text: 家可以無飢矣謹庠序之教申之以孝
  - page: 17
    col: 5
    role: j
    text: 悌之義頒白者不負戴於道路矣七十
  - page: 17
    col: 6
    role: j
    text: 者衣帛食肉黎民不飢不寒然而不王
  - page: 17
    col: 7
    role: j
    text: 者未之有也
  - page: 17
    col: 8
    role: z
    text: 衣去聲畜許六反數去聲王去聲凡
  - page: 17
    col: 9
    role: z
    text: 有天下者人稱之曰王則平聲據其
  - page: 17
    col: 10
    role: z
    text: 身臨天下而言曰王則去聲後皆放
  - page: 17
    col: 11
    role: z
    text: 此○五畝之宅一夫所受二畝半在
  - page: 17
    col: 12
    role: z
    text: 田二畝半在邑田中不得有木恐妨
  - page: 17
    col: 13
    role: z
    text: 五穀故於墻下植桑以供蠶事五十
  - page: 17
    col: 14
    role: z
    text: 始衰非帛不煖未五十者不得衣也
  - page: 17
    col: 15
    role: z
    text: 畜養也時謂孕字之時如孟春犧牲
  - page: 17
    col: 16
    role: z
    text: 母用牝之類也七十非肉不飽未七
  - page: 18
    col: 1
    role: j
    text: 十者不得食也百畝之田亦一夫所
  - page: 18
    col: 2
    role: j
    text: 受至此則經界正井地均無不受田
  - page: 18
    col: 3
    role: j
    text: 之家矣庠序皆學名也申重也丁寧
  - page: 18
    col: 4
    role: j
    text: 反覆之意善事父母爲孝善事兄長
  - page: 18
    col: 5
    role: j
    text: 爲悌頒與班同老人頭半白黑者也
  - page: 18
    col: 6
    role: j
    text: 負任在背戴任在首夫民衣食不足
  - page: 18
    col: 7
    role: j
    text: 則不暇治禮義而飽煖無教則又近
  - page: 18
    col: 8
    role: j
    text: 於禽獸故旣冨而教以孝悌則人知
  - page: 18
    col: 9
    role: j
    text: 愛親敬長而代其勞不使之負戴於
  - page: 18
    col: 10
    role: j
    text: 道路矣衣帛食肉但言七十舉重以
  - page: 18
    col: 11
    role: j
    text: 見輕也黎黑也黎民黑髮之人猶秦
  - page: 18
    col: 12
    role: j
    text: 言黔首也少壯之人雖不得衣帛食
  - page: 18
    col: 13
    role: j
    text: 肉然亦不至於飢寒也此言盡法制
  - page: 18
    col: 14
    role: j
    text: 品節之詳極財成輔相之道以左右
  - page: 18
    col: 15
    role: z
    text: 民是王道之成也
  - page: 18
    col: 16
    role: j
    text: 狗彘食人食而不知檢塗有餓莩而不
  - page: 19
    col: 1
    role: j
    text: 知發人死則曰非我也歲也是何異於
  - page: 19
    col: 2
    role: j
    text: 刺人而殺之曰非我也兵也王無罪歲
  - page: 19
    col: 3
    role: j
    text: 斯天下之民至焉
  - page: 19
    col: 4
    role: z
    text: 莘平表反刺七亦反〇檢制也莘餓
  - page: 19
    col: 5
    role: z
    text: 死人也發發倉廪以賑貸也歲謂歲
  - page: 19
    col: 6
    role: z
    text: 之豐凶也惠王不能制民之產又使
  - page: 19
    col: 7
    role: z
    text: 狗彘得以食人之食則與先王制度
  - page: 19
    col: 8
    role: z
    text: 品節之意異矣至於民飢而死猶不
  - page: 19
    col: 9
    role: z
    text: 知發則其所移特民閒之粟而已乃
  - page: 19
    col: 10
    role: z
    text: 以民不加多歸罪於歲凶是知刃之
  - page: 19
    col: 11
    role: z
    text: 殺人而不知操刃者之殺人也不罪
  - page: 19
    col: 12
    role: z
    text: 歲則必能自反而益修其政天下之
  - page: 19
    col: 13
    role: z
    text: 民至焉則不但多於鄰國而已〇程
  - page: 19
    col: 14
    role: z
    text: 子曰孟子之論王道不過如此可謂
  - page: 19
    col: 15
    role: z
    text: 實矣又曰孔子之時周室雖微天下
  - page: 19
    col: 16
    role: z
    text: 猶知尊周之為義故春秋以尊周為
  - page: 20
    col: 1
    role: z
    text: 本至孟子時七國爭雄天下不復知
  - page: 20
    col: 2
    role: z
    text: 有周而生民之塗炭巳極當是時諸
  - page: 20
    col: 3
    role: z
    text: 侯能行王道則可以王矣此孟子所
  - page: 20
    col: 4
    role: z
    text: 以勸齊梁之君也蓋王者天下之義
  - page: 20
    col: 5
    role: z
    text: 主也聖賢亦何心哉視天命之改與
  - page: 20
    col: 6
    role: z
    text: 未改耳
  - page: 20
    col: 7
    role: j
    text: 梁惠王曰寡人願安承教
  - page: 20
    col: 8
    role: z
    text: 承上章言願安意以受教
  - page: 20
    col: 9
    role: j
    text: 孟子對曰殺人以梃與刃有以異乎曰
  - page: 20
    col: 10
    role: j
    text: 無以異也
  - page: 20
    col: 11
    role: z
    text: 梃徒頂反○梃杖也
  - page: 20
    col: 12
    role: j
    text: 以刃與政有以異乎曰無以異也
  - page: 20
    col: 13
    role: z
    text: 孟子又問而王答也
  - page: 20
    col: 14
    role: j
    text: 曰庖有肥肉廄有肥馬民有飢色野有
  - page: 20
    col: 15
    role: j
    text: 餓莩此率獸而食人也
  - page: 20
    col: 16
    role: z
    text: 厚歛於民以養禽獸而使民飢以死
  - page: 21
    col: 1
    role: z
    text: 則無異於驅獸以食人矣
  - page: 21
    col: 2
    role: j
    text: 獸相食且人惡之爲民父母行政不免
  - page: 21
    col: 3
    role: j
    text: 於率獸而食人惡在其爲民父母也
  - page: 21
    col: 4
    role: z
    text: 惡之之惡去聲惡在之惡平聲○君
  - page: 21
    col: 5
    role: z
    text: 者民之父母也惡在猶言何在也
  - page: 21
    col: 6
    role: j
    text: 仲尼曰始作俑者其無後乎爲其象人
  - page: 21
    col: 7
    role: j
    text: 而用之也如之何其使斯民飢而死也
  - page: 21
    col: 8
    role: z
    text: 俑音勇爲去聲○俑從葬木偶人也
  - page: 21
    col: 9
    role: z
    text: 古之葬者束草爲人以爲從衛謂之
  - page: 21
    col: 10
    role: z
    text: 芻靈略似人形而已中古易之以俑
  - page: 21
    col: 11
    role: z
    text: 則有面目機發而太似人矣故孔子
  - page: 21
    col: 12
    role: z
    text: 惡其不仁而言其必無後也孟子言
  - page: 21
    col: 13
    role: z
    text: 此作俑者但用象人以葬孔子猶惡
  - page: 21
    col: 14
    role: z
    text: 之況實使民飢而死乎○李氏曰爲
  - page: 21
    col: 15
    role: z
    text: 人君者固未嘗有率獸食人之心然
  - page: 21
    col: 16
    role: z
    text: 殉一己之欲而不恤其民則其流必
  - page: 22
    col: 1
    role: z
    text: 至於此故以爲民父母告之夫父母
  - page: 22
    col: 2
    role: z
    text: 之於子爲之就利避害未嘗頃刻而
  - page: 22
    col: 3
    role: z
    text: 忘于懷何至視之不如犬馬乎
  - page: 22
    col: 4
    role: j
    text: 梁惠王曰晉國天下莫強焉叟之所知
  - page: 22
    col: 5
    role: j
    text: 也及寡人之身東敗於齊長子死焉西
  - page: 22
    col: 6
    role: j
    text: 喪地於秦七百里南辱於楚寡人恥之
  - page: 22
    col: 7
    role: j
    text: 願比死者一洒之如之何則可
  - page: 22
    col: 8
    role: z
    text: 長上聲喪去聲比必二反洒與洗同
  - page: 22
    col: 9
    role: z
    text: ○魏本晉大夫魏斯與韓氏趙氏共
  - page: 22
    col: 10
    role: z
    text: 分晉地號曰三晉故惠王猶自謂晉
  - page: 22
    col: 11
    role: z
    text: 國惠王三十年齊擊魏破其軍虜太
  - page: 22
    col: 12
    role: z
    text: 子申十七年秦取魏少梁後魏又數
  - page: 22
    col: 13
    role: z
    text: 獻地於秦又與楚將昭陽戰敗亡其
  - page: 22
    col: 14
    role: z
    text: 七邑比猶爲也言欲爲死者雪其恥
  - page: 22
    col: 15
    role: z
    text: 也
  - page: 22
    col: 16
    role: j
    text: 孟子對曰地方百里而可以王
  - page: 23
    col: 1
    role: z
    text: 百里小國也然能行仁政則天下之
  - page: 23
    col: 2
    role: z
    text: 民歸之矣
  - page: 23
    col: 3
    role: j
    text: 王如施仁政於民省刑罰薄稅歛深耕
  - page: 23
    col: 4
    role: j
    text: 易耨壯者以暇日修其孝悌忠信入以
  - page: 23
    col: 5
    role: j
    text: 事其父兄出以事其長上可使制梃以
  - page: 23
    col: 6
    role: j
    text: 撻秦楚之堅甲利兵矣
  - page: 23
    col: 7
    role: z
    text: 省所梗反歛易皆去聲耨奴豆反長
  - page: 23
    col: 8
    role: z
    text: 上聲○省刑罰薄稅歛此二者仁政
  - page: 23
    col: 9
    role: z
    text: 之大目也易治也耨耘也盡己之謂
  - page: 23
    col: 10
    role: z
    text: 忠以實之謂信君行仁政則民得盡
  - page: 23
    col: 11
    role: z
    text: 力於農畝而又有暇日以脩禮義是
  - page: 23
    col: 12
    role: z
    text: 以尊君親上而樂於效死也
  - page: 23
    col: 13
    role: j
    text: 彼奪其民時使不得耕耨以養其父母
  - page: 23
    col: 14
    role: j
    text: 父母凍餓兄弟妻子離散
  - page: 23
    col: 15
    role: z
    text: 養去聲○彼謂敵國也
  - page: 23
    col: 16
    role: j
    text: 彼陷溺其民王往而征之夫誰與王敵
  - page: 24
    col: 1
    role: z
    text: 夫音扶○陷陷於井溺溺於水暴虐
  - page: 24
    col: 2
    role: z
    text: 之意征正也以彼暴虐其民而率吾
  - page: 24
    col: 3
    role: z
    text: 尊君親上之民往正其罪彼民方怨
  - page: 24
    col: 4
    role: z
    text: 其上而樂歸於我則誰與我爲敵哉
  - page: 24
    col: 5
    role: j
    text: 故曰仁者無敵王請勿疑
  - page: 24
    col: 6
    role: z
    text: 仁者無敵蓋古語也百里可王以此
  - page: 24
    col: 7
    role: z
    text: 而已恐王疑其迂闊故勉使勿疑也
  - page: 24
    col: 8
    role: z
    text: ○孔氏曰惠王之志在於報怨孟子
  - page: 24
    col: 9
    role: z
    text: 之論在於救民所謂唯天吏則可以
  - page: 24
    col: 10
    role: z
    text: 伐之蓋孟子之本意
  - page: 24
    col: 11
    role: j
    text: 孟子見梁襄王
  - page: 24
    col: 12
    role: z
    text: 襄王惠王子名赫
  - page: 24
    col: 13
    role: j
    text: 出語人曰望之不似人君就之而不見
  - page: 24
    col: 14
    role: j
    text: 所畏焉卒然問曰天下惡乎定吾對曰
  - page: 24
    col: 15
    role: j
    text: 定于一
  - page: 24
    col: 16
    role: z
    text: 語去聲卒七没反惡平聲○語告也
  - page: 25
    col: 1
    role: z
    text: 不似人君不見所畏言其無威儀也
  - page: 25
    col: 2
    role: z
    text: 卒然急遽之貌蓋容貌詞氣乃德之
  - page: 25
    col: 3
    role: z
    text: 符其外如此則其中之所存者可知
  - page: 25
    col: 4
    role: z
    text: 王問列國分爭天下當何所定孟子
  - page: 25
    col: 5
    role: j
    text: 對以必合于一然後定也
  - page: 25
    col: 6
    role: j
    text: 孰能一之
  - page: 25
    col: 7
    role: z
    text: 王問也
  - page: 25
    col: 8
    role: j
    text: 對曰不嗜殺人者能一之
  - page: 25
    col: 9
    role: z
    text: 嗜甘也
  - page: 25
    col: 10
    role: j
    text: 孰能與之
  - page: 25
    col: 11
    role: z
    text: 王復問也與猶歸也
  - page: 25
    col: 12
    role: j
    text: 對曰天下莫不與也王知夫苗乎七八
  - page: 25
    col: 13
    role: j
    text: 月之間旱則苗槁矣天油然作雲沛然
  - page: 25
    col: 14
    role: j
    text: 下雨則苗浡然興之矣其如是孰能禦
  - page: 25
    col: 15
    role: j
    text: 之今夫天下之人牧未有不嗜殺人者
  - page: 25
    col: 16
    role: j
    text: 也如有不嗜殺人者則天下之民皆引
  - page: 26
    col: 1
    role: j
    text: 領而望之矣誠如是也民歸之由水之
  - page: 26
    col: 2
    role: j
    text: 就下沛然誰能禦之
  - page: 26
    col: 3
    role: z
    text: 夫音扶浡音勃由當作猶古字借用
  - page: 26
    col: 4
    role: z
    text: 後多放此○周七八月夏五六月也
  - page: 26
    col: 5
    role: z
    text: 油然雲盛貌沛然雨盛貌浡然興起
  - page: 26
    col: 6
    role: z
    text: 貌禦禁止也人牧謂牧民之君也領
  - page: 26
    col: 7
    role: z
    text: 頸也蓋好生惡死人心所同故人君
  - page: 26
    col: 8
    role: z
    text: 不嗜殺人則天下悅而歸之○蘇氏
  - page: 26
    col: 9
    role: z
    text: 曰孟子之言非苟爲大而已然不深
  - page: 26
    col: 10
    role: z
    text: 原其意而詳究其實未有不以爲迂
  - page: 26
    col: 11
    role: z
    text: 者矣予觀孟子以來自漢高祖及光
  - page: 26
    col: 12
    role: z
    text: 武及唐太宗及我○太祖皇帝能一
  - page: 26
    col: 13
    role: z
    text: 天下者四君皆以不嗜殺人致之其
  - page: 26
    col: 14
    role: z
    text: 餘殺人愈多而天下愈亂秦晉及隋
  - page: 26
    col: 15
    role: z
    text: 力能合之而好殺不已故或合而復
  - page: 26
    col: 16
    role: z
    text: 分或遂以亡國孟子之言豈偶然而
  - page: 27
    col: 1
    role: z
    text: 巳哉
  - page: 27
    col: 2
    role: j
    text: 齊宣王問曰齊桓晉文之事可得聞乎
  - page: 27
    col: 3
    role: z
    text: 齊宣王姓田氏名辟彊諸侯僭稱王
  - page: 27
    col: 4
    role: z
    text: 也齊威公晉文公皆霸諸侯者
  - page: 27
    col: 5
    role: j
    text: 孟子對曰仲尼之徒無道桓文之事者
  - page: 27
    col: 6
    role: j
    text: 是以後世無傳焉臣未之聞也無以則
  - page: 27
    col: 7
    role: j
    text: 王乎
  - page: 27
    col: 8
    role: z
    text: 道言也董子曰仲尼之門五尺童子
  - page: 27
    col: 9
    role: z
    text: 羞稱五伯爲其先詐力而後仁義也
  - page: 27
    col: 10
    role: z
    text: 亦此意也以巳通用無巳必欲言之
  - page: 27
    col: 11
    role: z
    text: 而不止也王謂王天下之道
  - page: 27
    col: 12
    role: j
    text: 曰德何如則可以王矣曰保民而王莫
  - page: 27
    col: 13
    role: j
    text: 之能禦也
  - page: 27
    col: 14
    role: z
    text: 保愛護也
  - page: 27
    col: 15
    role: j
    text: 曰若寡人者可以保民乎哉曰可曰何
  - page: 27
    col: 16
    role: j
    text: 由知吾可也曰臣聞之胡齕曰王坐於
  - page: 28
    col: 1
    role: j
    text: 堂上有牽牛而過堂下者王見之曰牛
  - page: 28
    col: 2
    role: j
    text: 何之對曰將以釁鐘王曰舍之吾不忍
  - page: 28
    col: 3
    role: j
    text: 其觳觫若無罪而就死地對曰然則廢
  - page: 28
    col: 4
    role: j
    text: 釁鐘與曰何可廢也以羊易之不識有
  - page: 28
    col: 5
    role: j
    text: 諸
  - page: 28
    col: 6
    role: z
    text: 齕音核舍上聲觳音斛觫音速與平
  - page: 28
    col: 7
    role: z
    text: 聲○胡齕齊臣也釁鐘新鑄鍾成而
  - page: 28
    col: 8
    role: z
    text: 殺牲取血以塗其釁郄也觳觫恐懼
  - page: 28
    col: 9
    role: z
    text: 貌孟子述所聞胡齕之語而問王不
  - page: 28
    col: 10
    role: z
    text: 知果有此事否
  - page: 28
    col: 11
    role: j
    text: 曰有之曰是心足以王矣百姓皆以王
  - page: 28
    col: 12
    role: j
    text: 爲愛也臣固知王之不忍也
  - page: 28
    col: 13
    role: z
    text: 王見牛之觳觫而不忍殺即所謂惻
  - page: 28
    col: 14
    role: z
    text: 隱之心仁之端也擴而充之則可以
  - page: 28
    col: 15
    role: z
    text: 保四海矣故孟子指而言之欲王察
  - page: 28
    col: 16
    role: z
    text: 識於此而擴充之也愛猶吝也
  - page: 29
    col: 1
    role: j
    text: 王曰然誠有百姓者齊國雖褊小吾何
  - page: 29
    col: 2
    role: j
    text: 愛一牛即不忍其觳觫若無罪而就死
  - page: 29
    col: 3
    role: j
    text: 地故以羊易之也
  - page: 29
    col: 4
    role: z
    text: 言以羊易牛其迹似吝實有如百姓
  - page: 29
    col: 5
    role: z
    text: 所譏者然我之心不如是也
  - page: 29
    col: 6
    role: j
    text: 曰王無異於百姓之以王爲愛也以小
  - page: 29
    col: 7
    role: j
    text: 易大彼惡知之王若隱其無罪而就死
  - page: 29
    col: 8
    role: j
    text: 地則牛羊何擇焉王笑曰是誠何心哉
  - page: 29
    col: 9
    role: j
    text: 我非愛其財而易之以羊也宜乎百姓
  - page: 29
    col: 10
    role: j
    text: 之謂我愛也
  - page: 29
    col: 11
    role: z
    text: 惡平聲○異怪也隱痛也擇猶分也
  - page: 29
    col: 12
    role: z
    text: 言牛羊皆無罪而死何所分別而以
  - page: 29
    col: 13
    role: z
    text: 羊易牛乎孟子故設此難欲王反求
  - page: 29
    col: 14
    role: z
    text: 而得其本心王不能然故卒無以自
  - page: 29
    col: 15
    role: z
    text: 解於百姓之言也
  - page: 29
    col: 16
    role: j
    text: 曰無傷也是乃仁術也見牛未見羊也
  - page: 30
    col: 1
    role: j
    text: 君子之於禽獸也見其生不忍見其死
  - page: 30
    col: 2
    role: j
    text: 聞其聲不忍食其肉是以君子遠庖廚
  - page: 30
    col: 3
    role: j
    text: 也
  - page: 30
    col: 4
    role: z
    text: 遠去聲○無傷言雖有百姓之言不
  - page: 30
    col: 5
    role: z
    text: 爲害也術謂法之巧者蓋殺牛旣所
  - page: 30
    col: 6
    role: z
    text: 不忍釁鍾又不可廢於此無以處之
  - page: 30
    col: 7
    role: z
    text: 則此心雖發而終不得施矣然見牛
  - page: 30
    col: 8
    role: z
    text: 則此心巳發而不可遏未見羊則其
  - page: 30
    col: 9
    role: z
    text: 理未形而無所妨故以羊易牛則二
  - page: 30
    col: 10
    role: z
    text: 者得以兩全而無害此所以爲仁之
  - page: 30
    col: 11
    role: z
    text: 術也聲謂將死而哀鳴也蓋人之於
  - page: 30
    col: 12
    role: z
    text: 禽獸同生而異類故用之以禮而不
  - page: 30
    col: 13
    role: z
    text: 忍之心施於見聞之所及其所以必
  - page: 30
    col: 14
    role: z
    text: 遠庖廚者亦以預養是心而廣爲仁
  - page: 30
    col: 15
    role: z
    text: 之術也
  - page: 30
    col: 16
    role: j
    text: 王說曰詩云他人有心予忖度之夫子
  - page: 31
    col: 1
    role: j
    text: 之謂也夫我乃行之反而求之不得吾
  - page: 31
    col: 2
    role: j
    text: 心夫子言之於我心有戚戚焉此心之
  - page: 31
    col: 3
    role: j
    text: 所以合於王者何也
  - page: 31
    col: 4
    role: z
    text: 說音悅忖七本反度待洛反夫我之
  - page: 31
    col: 5
    role: z
    text: 夫音扶○詩小雅巧言之篇戚戚心
  - page: 31
    col: 6
    role: z
    text: 動貌王因孟子之言而前日之心復
  - page: 31
    col: 7
    role: z
    text: 萌乃知此心不從外得然猶未知所
  - page: 31
    col: 8
    role: z
    text: 以反其本而推之也
  - page: 31
    col: 9
    role: j
    text: 曰有復於王者曰吾力足以舉百鈞而
  - page: 31
    col: 10
    role: j
    text: 不足以舉一羽明足以察秋毫之末而
  - page: 31
    col: 11
    role: j
    text: 不見輿薪則王許之乎曰否今恩足以
  - page: 31
    col: 12
    role: j
    text: 及禽獸而功不至於百姓者獨何與然
  - page: 31
    col: 13
    role: j
    text: 則一羽之不舉爲不用力焉輿薪之不
  - page: 31
    col: 14
    role: j
    text: 見爲不用明焉百姓之不見保爲不用
  - page: 31
    col: 15
    role: j
    text: 恩焉故王之不王不爲也非不能也
  - page: 31
    col: 16
    role: z
    text: 與平聲爲不之爲去聲○復白也鈞
  - page: 32
    col: 1
    role: z
    text: 三十斤百鈞至重難舉也羽鳥羽一
  - page: 32
    col: 2
    role: z
    text: 羽至輕易舉也秋毫之末毛至秋而
  - page: 32
    col: 3
    role: z
    text: 末銳小而難見也輿薪以車載薪大
  - page: 32
    col: 4
    role: z
    text: 而易見也許猶可也今恩以下又孟
  - page: 32
    col: 5
    role: z
    text: 子之言也蓋天地之性人爲貴故人
  - page: 32
    col: 6
    role: z
    text: 之與人又爲同類而相親是以惻隱
  - page: 32
    col: 7
    role: z
    text: 之發則於民切而於物緩推廣仁術
  - page: 32
    col: 8
    role: z
    text: 則仁民易而愛物難今王此心能及
  - page: 32
    col: 9
    role: z
    text: 物矣則其保民而王非不能也但自
  - page: 32
    col: 10
    role: z
    text: 不肯爲耳
  - page: 32
    col: 11
    role: j
    text: 曰不爲者與不能者之形何以異曰挾
  - page: 32
    col: 12
    role: j
    text: 太山以超北海語人曰我不能是誠不
  - page: 32
    col: 13
    role: j
    text: 能也爲長者折枝語人曰我不能是不
  - page: 32
    col: 14
    role: j
    text: 爲也非不能也故王之不王非挾太山
  - page: 32
    col: 15
    role: j
    text: 以超北海之類也王之不王是折枝之
  - page: 32
    col: 16
    role: j
    text: 類也
  - page: 33
    col: 1
    role: z
    text: 語去聲爲長之爲去聲長上聲折之
  - page: 33
    col: 2
    role: z
    text: 舌反○形狀也挾以腋持物也超躍
  - page: 33
    col: 3
    role: z
    text: 而過也爲長者折枝以長者之命折
  - page: 33
    col: 4
    role: z
    text: 草木之枝言不難也是心固有不待
  - page: 33
    col: 5
    role: z
    text: 外求擴而充之在我而已何難之有
  - page: 33
    col: 6
    role: j
    text: 老吾老以及人之老幼吾幼以及人之
  - page: 33
    col: 7
    role: j
    text: 幼天下可運於掌詩云刑于寡妻至于
  - page: 33
    col: 8
    role: j
    text: 兄弟以御于家邦言舉斯心加諸彼而
  - page: 33
    col: 9
    role: j
    text: 已故推恩足以保四海不推恩無以保
  - page: 33
    col: 10
    role: j
    text: 妻子古之人所以大過人者無他焉善
  - page: 33
    col: 11
    role: j
    text: 推其所爲而已矣今恩足以及禽獸而
  - page: 33
    col: 12
    role: j
    text: 功不至於百姓者獨何與
  - page: 33
    col: 13
    role: z
    text: 與平聲○老以老事之也吾老謂我
  - page: 33
    col: 14
    role: z
    text: 之父兄人之老謂人之父兄幼以幼
  - page: 33
    col: 15
    role: z
    text: 畜之也吾幼謂我之子弟人之幼謂
  - page: 33
    col: 16
    role: z
    text: 人之子弟運於掌言易也詩大雅思
  - page: 34
    col: 1
    role: z
    text: 齊之篇刑法也寡妻寡德之妻謙辭
  - page: 34
    col: 2
    role: z
    text: 也御治也不能推恩則衆叛親離故
  - page: 34
    col: 3
    role: z
    text: 無以保妻子蓋骨肉之親本同一氣
  - page: 34
    col: 4
    role: z
    text: 又非但若人之同類而已故古人必
  - page: 34
    col: 5
    role: z
    text: 由親親推之然後及於仁民又推其
  - page: 34
    col: 6
    role: z
    text: 餘然後及於愛物皆由近以及遠自
  - page: 34
    col: 7
    role: z
    text: 易以及難今王反之則必有故矣故
  - page: 34
    col: 8
    role: z
    text: 復推本而再問之
  - page: 34
    col: 9
    role: j
    text: 權然後知輕重度然後知長短物皆然
  - page: 34
    col: 10
    role: j
    text: 心爲甚王請度之
  - page: 34
    col: 11
    role: z
    text: 度之之度待洛反○權稱錘也度丈
  - page: 34
    col: 12
    role: z
    text: 尺也度之謂稱量之也言物之輕重
  - page: 34
    col: 13
    role: z
    text: 長短人所難齊必以權度度之而後
  - page: 34
    col: 14
    role: z
    text: 可見若心之應物則其輕重長短之
  - page: 34
    col: 15
    role: z
    text: 難齊而不可不度以本然之權度又
  - page: 34
    col: 16
    role: z
    text: 有甚於物者今王恩及禽獸而功不
  - page: 35
    col: 1
    role: j
    text: 至於百姓是其愛物之心重且長而
  - page: 35
    col: 2
    role: j
    text: 仁民之心輕且短失其當然之序而
  - page: 35
    col: 3
    role: j
    text: 不自知也故上文既發其端而於此
  - page: 35
    col: 4
    role: z
    text: 請王度之也
  - page: 35
    col: 5
    role: j
    text: 抑王興甲兵危士臣搆怨於諸侯然後
  - page: 35
    col: 6
    role: j
    text: 快於心與
  - page: 35
    col: 7
    role: z
    text: 與平聲○抑發語辭士戰士也搆結
  - page: 35
    col: 8
    role: j
    text: 也孟子以王愛民之心所以輕且短
  - page: 35
    col: 9
    role: z
    text: 者必其以是三者爲快也然三事實
  - page: 35
    col: 10
    role: z
    text: 非人心之所快有甚於殺觳觫之牛
  - page: 35
    col: 11
    role: z
    text: 者故指以問王欲其以此而度之也
  - page: 35
    col: 12
    role: j
    text: 王曰否吾何快於是將以求吾所大欲
  - page: 35
    col: 13
    role: j
    text: 也
  - page: 35
    col: 14
    role: z
    text: 不快於此者心之正也而必爲此者
  - page: 35
    col: 15
    role: z
    text: 欲誘之也欲之所誘者獨在於是是
  - page: 35
    col: 16
    role: z
    text: 以其心尚明於他而獨暗於此此其
  - page: 36
    col: 1
    role: z
    text: 愛民之心所以輕短而功不至於百
  - page: 36
    col: 2
    role: z
    text: 姓也
  - page: 36
    col: 3
    role: j
    text: 曰王之所大欲可得聞與王笑而不言
  - page: 36
    col: 4
    role: j
    text: 曰爲肥甘不足於口與輕煖不足於體
  - page: 36
    col: 5
    role: j
    text: 與抑爲采色不足視於目與聲音不足
  - page: 36
    col: 6
    role: j
    text: 聽於耳與便嬖不足使令於前與王之
  - page: 36
    col: 7
    role: j
    text: 諸臣皆足以供之而王豈爲是哉曰否
  - page: 36
    col: 8
    role: j
    text: 吾不爲是也曰然則王之所大欲可知
  - page: 36
    col: 9
    role: j
    text: 已欲辟土地朝秦楚莅中國而撫四夷
  - page: 36
    col: 10
    role: j
    text: 也以若所爲求若所欲猶緣木而求魚
  - page: 36
    col: 11
    role: j
    text: 也
  - page: 36
    col: 12
    role: z
    text: 與平聲爲肥抑爲豈爲不爲之爲皆
  - page: 36
    col: 13
    role: z
    text: 去聲便令皆平聲辟與闢同朝音潮
  - page: 36
    col: 14
    role: z
    text: ○便嬖近習嬖幸之人也已語助辭
  - page: 36
    col: 15
    role: z
    text: 辟開廣也朝致其來朝也秦楚皆大
  - page: 36
    col: 16
    role: z
    text: 國莅臨也若如此也所爲指興兵結
  - page: 37
    col: 1
    role: z
    text: 怨之事緣木求魚言必不可得
  - page: 37
    col: 2
    role: j
    text: 王曰若是其甚與曰殆有甚焉緣木求
  - page: 37
    col: 3
    role: j
    text: 魚雖不得魚無後災以若所為求若所
  - page: 37
    col: 4
    role: j
    text: 欲盡心力而為之後必有災曰可得聞
  - page: 37
    col: 5
    role: j
    text: 與曰鄒人與楚人戰則王以為孰勝曰
  - page: 37
    col: 6
    role: j
    text: 楚人勝曰然則小固不可以敵大寡固
  - page: 37
    col: 7
    role: j
    text: 不可以敵衆弱固不可以敵彊海內之
  - page: 37
    col: 8
    role: j
    text: 地方千里者九齊集有其一以一服八
  - page: 37
    col: 9
    role: j
    text: 何以異於鄒敵楚哉蓋亦反其本矣
  - page: 37
    col: 10
    role: z
    text: 甚與聞與之與平聲○殆蓋皆發語
  - page: 37
    col: 11
    role: z
    text: 辭鄒小國楚大國齊集有其一言集
  - page: 37
    col: 12
    role: j
    text: 合齊地其方千里是有天下九分之
  - page: 37
    col: 13
    role: z
    text: 一也以一服八必不能勝所謂後災
  - page: 37
    col: 14
    role: z
    text: 也反本說見下文
  - page: 37
    col: 15
    role: j
    text: 今王發政施仁使天下仕者皆欲立於
  - page: 37
    col: 16
    role: j
    text: 王之朝耕者皆欲耕於王之野商賈皆
  - page: 38
    col: 1
    role: j
    text: 欲藏於王之市行旅皆欲出於王之塗
  - page: 38
    col: 2
    role: j
    text: 天下之欲疾其君者皆欲赴愬於王其
  - page: 38
    col: 3
    role: j
    text: 若是孰能禦之
  - page: 38
    col: 4
    role: z
    text: 朝音潮賈音古愬與訴同○行貨曰
  - page: 38
    col: 5
    role: z
    text: 商居貨曰賈發政施仁所以王天下
  - page: 38
    col: 6
    role: z
    text: 之本也近者悅遠者來則大小疆弱
  - page: 38
    col: 7
    role: z
    text: 非所論矣蓋力求所欲則所欲者反
  - page: 38
    col: 8
    role: z
    text: 不可得能反其本則所欲者不求而
  - page: 38
    col: 9
    role: z
    text: 至與首章意同
  - page: 38
    col: 10
    role: j
    text: 王曰吾惛不能進於是矣願夫子輔吾
  - page: 38
    col: 11
    role: j
    text: 志明以教我我雖不敏請嘗試之
  - page: 38
    col: 12
    role: z
    text: 惛與昏同
  - page: 38
    col: 13
    role: j
    text: 曰無恒產而有恒心者惟士為能若民
  - page: 38
    col: 14
    role: j
    text: 則無恒產因無恒心苟無恒心放辟邪
  - page: 38
    col: 15
    role: j
    text: 侈無不為已及陷於罪然後從而刑之
  - page: 38
    col: 16
    role: j
    text: 是罔民也焉有仁人在位罔民而可為
  - page: 39
    col: 1
    role: j
    text: 也
  - page: 39
    col: 2
    role: j
    text: 恒胡登反辟與僻同焉於虔反○恒
  - page: 39
    col: 3
    role: j
    text: 常也產生業也常產可常生之業也
  - page: 39
    col: 4
    role: j
    text: 常心人所常有之善心也士嘗學問
  - page: 39
    col: 5
    role: j
    text: 知義理故雖無常產而有常心民則
  - page: 39
    col: 6
    role: j
    text: 不能然矣罔猶羅網欺其不見而取
  - page: 39
    col: 7
    role: z
    text: 之也
  - page: 39
    col: 8
    role: j
    text: 是故明君制民之產必使仰足以事父
  - page: 39
    col: 9
    role: j
    text: 母俯足以畜妻子樂歲終身飽凶年免
  - page: 39
    col: 10
    role: j
    text: 於死亡然後驅而之善故民之從之也
  - page: 39
    col: 11
    role: j
    text: 輕
  - page: 39
    col: 12
    role: j
    text: 畜許六反下同○輕猶易也此言民
  - page: 39
    col: 13
    role: z
    text: 有常產而有常心也
  - page: 39
    col: 14
    role: j
    text: 今也制民之產仰不足以事父母俯不
  - page: 39
    col: 15
    role: j
    text: 足以畜妻子樂歲終身苦凶年不免於
  - page: 39
    col: 16
    role: j
    text: 死亡此惟救死而恐不贍奚暇治禮義
  - page: 40
    col: 1
    role: j
    text: 哉
  - page: 40
    col: 2
    role: z
    text: 治平聲凡治字爲理物之義者平聲
  - page: 40
    col: 3
    role: z
    text: 爲已理之義者去聲後皆放此○贍
  - page: 40
    col: 4
    role: z
    text: 足也此所謂無常産而無常心者也
  - page: 40
    col: 5
    role: j
    text: 王欲行之則盍反其本矣
  - page: 40
    col: 6
    role: z
    text: 盍何不也使民有常産者又發政施
  - page: 40
    col: 7
    role: z
    text: 仁之本也說具下文
  - page: 40
    col: 8
    role: j
    text: 五畝之宅樹之以桑五十者可以衣帛
  - page: 40
    col: 9
    role: j
    text: 矣雞豚狗彘之畜無失其時七十者可
  - page: 40
    col: 10
    role: j
    text: 以食肉矣百畝之田勿奪其時八口之
  - page: 40
    col: 11
    role: j
    text: 家可以無飢矣謹庠序之教申之以孝
  - page: 40
    col: 12
    role: j
    text: 悌之義頒白者不負戴於道路矣老者
  - page: 40
    col: 13
    role: j
    text: 衣帛食肉黎民不飢不寒然而不王者
  - page: 40
    col: 14
    role: j
    text: 未之有也
  - page: 40
    col: 15
    role: z
    text: 音見前章○此言制民之産之法也
  - page: 40
    col: 16
    role: z
    text: 趙氏曰八口之家次上農夫也此王
  - page: 41
    col: 1
    role: j
    text: 政之本常生之道故孟子爲齊梁之
  - page: 41
    col: 2
    role: j
    text: 君各陳之也楊氏曰爲天下者舉斯
  - page: 41
    col: 3
    role: j
    text: 心加諸彼而已然雖有仁心仁聞而
  - page: 41
    col: 4
    role: j
    text: 民不被其澤者不行先王之道故也
  - page: 41
    col: 5
    role: j
    text: 故以制民之産告之○此章言人君
  - page: 41
    col: 6
    role: j
    text: 當黜霸功行王道而王道之要不過
  - page: 41
    col: 7
    role: j
    text: 推其不忍之心以行不忍之政而已
  - page: 41
    col: 8
    role: j
    text: 齊王非無此心而奪於功利之私不
  - page: 41
    col: 9
    role: j
    text: 能擴充以行仁政雖以孟子反覆曉
  - page: 41
    col: 10
    role: j
    text: 告精切如此而蔽固已深終不能悟
  - page: 41
    col: 11
    role: j
    text: 是可歎也
