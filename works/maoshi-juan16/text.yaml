# 毛詩正義卷16（孔穎達疏）：j 為經文＋毛亨傳、鄭玄箋，z 為疏文。
sections:
  - id: juan16
    name: 正文
    blocks:
      - { type: j, text: "《靈臺》，民始附也。文王受命，而民樂其有靈德，以及鳥獸昆蟲焉。民者，冥也。其見仁道遲，故於是乃附也。天子有靈臺者，所以觀祲象，察氣之妖祥也。文王受命，而作邑於豐，立靈臺。《春秋傳》曰：“公既視朔，遂登觀臺以望，而書雲物，為備故也。”○靈臺，杜預注《左傳》雲：“靈臺在始平鄠縣，今屬京兆府所管。”昆，古門反，鄭注《禮記》雲：“明也。”蟲，直弓反，本或作“蟲”，非。冥，亡丁反。冥冥，無知貌。《字林》雲：“幽也。”又亡定反。祲，子鴆反，陰陽氣相侵，漸成祥。觀，古亂反。下“觀臺”、“節觀”同。" }
      - { type: z, text: "“《靈臺》五章，章四句”至“昆蟲焉”。○正義曰：作《靈臺》詩者，言民始附也。文王受天之所命，而民樂有其神靈之德，以及鳥獸昆蟲焉。以文王德及昆蟲，民歸附之，故作此詩以歌其事也。經說作臺，序言始附，則是作臺之時民始附也。文王嗣為西伯，三分天下而有其二，則為民所從，事應久矣。而於作臺之時，始言民附者，三分有二，諸侯之君從文王耳，其民從君而來，其心未見靈德。至於作臺之日，民心始知，故言始附，謂心附之也。往前則貌附之耳。此言作臺而民始附，則其附在受命六年。而序追言受命者，以民心之附，事亦有漸。初受命已附，至作臺而齊心，故系之受命，見附之所由也。言民始附，首章及二章上二句是也。樂其有靈德，以及鳥獸昆蟲者，二章下二句及三章是也。臺、囿、沼皆言靈，是明文王有靈德之義。麀鹿，獸也。白鳥，鳥也。昆蟲者，《王制》注云：“昆，明也。明蟲者，得陽而生，得陰而藏。”陰陽即寒溫也，故《祭統》注云：“昆蟲，溫生寒死之蟲。”然則諸蟄蟲皆是也。此經無昆蟲之事，而三章言魚，魚亦蟲之別名，舉潛物以見陸產，故言昆蟲以總之。經先言獸，序先言鳥者，作囿主以養獸，故先言之。序則從其言便，故不同也。四章、卒章言政教得所，合樂詳之，亦是靈德之事，故序略之也。○箋“民者”至“備故”。○正義曰：“民者，冥也”，《孝經·援神契》文。以其冥冥無知，其見仁道遲，故於是始附，解其晚附之意也。又解臺之所用，天子有靈臺，所以觀祲象，察氣之妖祥故也。四方而高曰臺。以天象在上，須登臺望之，故作臺以觀天也。《春官·眡祲》“掌十煇之法，以觀妖祥，辨吉凶。一曰祲，二曰象，三曰鐫，四曰監，五曰闇，六曰瞢，七曰彌，八曰敘，九曰隮，十曰想。”注云：“妖祥，善惡之徵。鄭司農雲：‘煇，謂日光氣也。祲，陰陽氣相侵也。象者，如赤鳥也。闇，日月食也。瞢，謂日月瞢瞢無光也。敘者，雲有次敘，如山在日上也。’玄謂‘鐫謂日旁氣刺日也。監，冠珥也。彌，氣貫日也。隮，虹也。想，雜氣有似，可形想也’。”此十者，皆舉天之異啤ｘ視祲之官，當在靈臺之上視之，故箋取以為說。十煇而唯言祲、象者，舉其初二事，餘從可知也。《馮相氏》、《保章氏》亦云：“觀天下之妖祥。”則在臺觀之。獨引《視祲》之事者，以視祲為官名，則是仰觀之主，故特取之。其實馮相、保章之所觀者，亦在靈臺也。又解文王作臺之處，故言“文王受命，而作邑於豐，立靈臺”。明此靈臺在豐邑之都也。《含神務》曰：“作邑於豐，起靈臺。”《易乾鑿度》亦云：“伐崇作靈臺。”是靈臺在豐邑之都文也。所引《春秋傳》曰者，僖五年《左傳》文，引之證臺是觀氣所用。彼雲：“以望而書，禮也。凡分、至、啟、閉，必書雲物，為備故。”此略引之，故與彼小異。此靈臺所處，在國之西郊，諸儒以無正文，故其說多異。《異義》、《公羊》說“天子三，諸侯二。天子有靈臺以觀天文，有時臺以觀四時施化，有囿臺觀鳥獸魚鱉。諸侯當有時臺、囿臺。諸侯卑，不得觀天文，無靈臺。皆在國之東南二十五里，東南少陽用事，萬物著見。用二十五里者，吉行五十里，朝行暮反也”。《韓詩》說“辟雍者，天子之學，圓如璧，壅之以水，示圓，言闢，取闢有德。不言闢水，言辟雍者，取其雍和也，所以教天下春射秋饗，尊事三老五更。在南方七里之內，立明堂於中，《五經》之文所藏處，蓋以茅草，取其潔清也”。《左氏》說“天子靈臺在太廟之中，壅之靈沼，謂之辟雍。諸侯有觀臺，亦在廟中。皆以望嘉祥也”。《毛詩》說“靈臺，不足以監視。靈者，精也，神之精明稱靈，故稱臺曰靈臺，稱囿曰靈囿，稱沼曰靈沼。謹案《公羊傳》、《左氏》說皆無明文。說各有以，無以正之。玄之聞也，《禮記·王制》天子命之教然後為學。小學在公宮之左，大學在郊。天子曰辟雍，諸侯曰泮宮。天子將出徵，受命於祖，受成於學。出征執有罪，反，釋奠於學，以訊馘告”。然則太學即辟雍也。《詩·頌·泮水》雲：“既作泮宮，淮夷攸服。矯矯虎臣，在泮獻馘。淑問如皋陶，在泮獻囚。”此復與辟雍同義之證也。《大雅·靈臺》一篇之詩，有靈臺，有靈囿，有靈沼，有辟雍。其如是也，則辟雍及三靈皆同處在郊矣。囿也、沼也，同言靈。於臺下為囿為沼，可知小學在公宮之左，大學在西郊。王者相變之宜，眾家之說各不昭皙，雖然於郊差近之耳，在廟則遠矣。《王制》與《詩》，其言察察，亦足以明之矣。如鄭此說，靈臺與辟雍同處，辟雍即天子大學也。《王制》言大學在郊，乃是殷制。其周制，則太學在國。太學雖在國，而辟雍仍在郊。何則？囿、沼魚鳥所萃，終不可在國中也。辟雍與太學為一，所以得太學移而辟雍不移者，以辟雍是學之名耳。《王制》以殷之辟雍與大學為一，故因而說之，不必常以太學為辟雍小學亦可矣。周立三代之學，虞庠在國之西郊，則周以虞庠為辟雍矣。若然，魯是周之諸侯，於郊不當有學，泮宮亦應在國。而《禮器》注云：“頖宮，郊之學也，《詩》所謂泮宮也。字或為郊宮。”不在國者，以其詩言“魯侯戾止”，是行往適之，故知在郊。蓋魯以周公之故，尊之使用殷禮，故學在其郊也。鄭以靈臺、辟雍在西郊，則與明堂、宗廟皆異處矣。案《大戴禮·盛德篇》雲：“明堂者，所以明諸侯尊卑也。外水名曰辟雍。”《政穆篇》雲：“大學，明堂之東序也。”如此文，則辟雍、明堂同處矣，故諸儒多用之。盧植《禮記注》雲：“明堂即大廟也。天子太廟，上可以望氣，故謂之靈臺。中可以序昭穆，故謂之太廟。圓之以水，似闢，故謂之辟雍。古法皆同一處，近世殊異，分為三耳。”蔡邕《月令論》雲：“取其宗廟之清貌則曰清廟，取其正室之貌則曰太廟，取其堂則曰明堂，取其四門之學則曰太學，取其周水圓如璧則曰辟雍。異名而同事，其實一也。”穎子容《春秋釋例》雲：“太廟有八名，其體一也。肅然清靜謂之清廟，行禘祫、序昭穆謂之太廟，告朔行政謂之明堂，行饗射、養國老謂之辟雍，佔雲物、望氣祥謂之靈臺，其四明之學謂之太學，其中室謂之太室，總謂之宮。”賈逵、服虔注《左傳》亦云：“靈臺在太廟明堂之中。”此等諸儒，皆以廟、學、明堂、靈臺為一。鄭必知皆異處者，袁準《正論》雲：“明堂、宗廟、太學，禮之大物也，事義不同，各有所為。而世之論者，合以為一體，取《詩》、《書》放逸之文、經典相似之語而致之，不復考之人情，驗之道理，失之遠矣。夫宗廟之中，人所致敬，幽隱清靜，鬼神所居。而使眾學處焉，饗射其中，人鬼慢黷，死生交錯，囚俘截耳，瘡痍流血，以干犯鬼神，非其理矣。且夫茅茨採椽，至質之物，建日月，乘玉輅，以處其中，象箸玉杯而食於土簋，非其類也。如《禮記》先儒之言，明堂之制四面，東西八丈，南北六丈。禮，天子七廟，左昭右穆，又有祖宗不在數中。以明堂之制言之，昭穆安在？若又區別，非一體也。夫宗廟，鬼神之居，祭天而於人鬼之室，非其處也。夫明堂，法天之宮，非鬼神常處，故可以祭天，而以其祖配之。配其父於天位，可也。事天而就人鬼，則非義也。自古帝王，必立大小之學，以教天下。有虞氏謂之上庠、下庠，夏后氏謂之東序、西序，殷謂之右學、左學，周謂之東膠、虞庠，皆以養老乞言。《明堂位》曰：‘瞽宗，殷學也。’周置師保之官，居虎門之側。然則學宮非一處也。《文王世子》‘春夏學干戈，秋冬學羽籥，皆於東序’。又曰：‘秋學禮，冬學書。禮在瞽宗，書在上庠。’此周立三代之學也。可謂立其學，不可謂立其廟，然則太學非宗廟也。又曰：‘世子齒於學，國人觀之。’宗廟之中，非百姓所觀也。《王制》曰：‘周人養國老於東膠。’不曰辟雍。養國老於右學，養庶老於左學。宗廟之尊，不應與小學為左右也。辟雍之制，圓之以水。圓象天，取生長也。水潤下，取其惠澤也。水必有魚鱉，取其所以養也。是故明堂者，大朝諸侯講禮之處。宗廟，享鬼神歲覲之宮。辟雍，大射養孤之處。大學，眾學之居。靈臺，望氣之觀。清廟，訓儉之室。各有所為，非一體也。古有王居明堂之禮，《月令》則其事也。天子居其中，學士處其內，君臣同處，死生參並，非其義也。大射之禮，天子張三侯，大侯九十步，其次七十步，其次五十步，辟雍處其中。今未知辟雍廣狹之數，但二九十八加之，辟雍則徑三百步也。凡有公卿大夫諸侯之賓，百官侍從之眾，殆非宗廟中所能容也。禮，天子立五門，又非一門之間所能受也。明堂以祭鬼神，故亦謂之廟。明堂太廟者，明堂之內太室，非宗廟之太廟也。於辟雍獻捷者，謂鬼神惡之也。或謂之學者，天下之所學也。總謂之宮，大同之名也。生人不謂之廟，此其所以別也。先儒曰：‘《春秋》人君將行，告宗廟，反獻於廟。’《王制》釋奠於學，以訊馘告，則太學亦廟也。其上句曰‘小學在公宮之左，太學在郊’，明太學非廟，非所以為證也。周人養庶老於虞庠，虞庠在國之西郊。今《王制》亦小學近而太學遠，其言乖錯，非以為正也。穎氏雲：‘公既視朔，遂登觀臺。’以其言遂，故謂之同處。夫遂者，遂事之名，不必同處也。馬融雲‘明堂在南郊，就陽位’，而宗廟在國外，非孝子之情也。古文稱明堂陰陽者，所以法天道，順時政，非宗廟之謂也。融雲‘告朔行政，謂之明堂’。夫告朔行政，上下同也，未聞諸侯有明堂之稱也。順時行政，有國皆然，未聞諸侯有居明堂者也。齊宣王問孟子：‘人皆謂我毀明堂，毀諸？已乎？’孟子曰：‘夫明堂者，王者之堂也。王欲行王政，則勿毀之矣。’夫宗廟之毀，非獨王者也。若明堂即宗廟，不得曰‘夫明堂，王者之宗廟也’。且說諸侯而教毀宗廟，為人君而疑於可毀與否，雖復淺丈夫，未有是也。孟子，古之賢大夫，而皆子思弟子，去聖不遠，此其一證也。《屍子》曰：‘昔武王崩，成王少，周公踐東宮，祀明堂，假為天子。’明堂在左，故謂之東宮。王者而後有明堂，故曰祀明堂，假為天子。此又其證也。”竊以準之此論，可以申明鄭意。《大戴禮》，遺逸之書，文多假託，不立學官，世無傳者。其《盛德篇》雲明堂“外水名曰辟雍”，《政穆篇》稱“太學明堂之東序”，皆後人所增，失於事實，故先儒雖立異端，亦不據為說。然則明堂非廟，而《月令》雲“天子居明堂太廟”者，以明堂是祭神之所，故謂之明堂。太廟者，正謂明堂之太室，非宗廟之太廟也。《明堂位》雲：“太廟，天子明堂。”自謂制如明堂，非太廟名明堂也。廟與明堂不同，則靈臺又宜別處，故靈臺、辟雍皆在郊也。" }
      - { type: j, text: "經始靈臺，經之營之。庶民攻之，不日成之。神之精明者稱靈。四方而高曰臺。經，度之也。攻，作也。不日有成也。箋雲：文王應天命，度始靈臺之基趾，營表其位。眾民則築作，不設期日而成之。言說文王之德，勸其事，忘己勞也。觀臺而曰靈者，文王化行，似神之精明，故以名焉。○度，待洛反。下同。應，應對之應。說音悅。" }
      - { type: z, text: "“經始”至“成之”。○正義曰：言文王有德，民心附之。既徙於豐，乃經理而量度，初始為靈臺之基趾也。既度其處，乃經理之，營表之。其位既定，於是天下眾庶之民則競攻而築作之，不設期日而已成之。民悅其德，自勸其事，是民心附之也。○傳“神之”至“成”。○正義曰：靈是神之別名，對則有精粗之異，故辨之雲“神之精明者”。稱靈，則靈之為稱，就神中精者而名也。“四方而高曰臺”，《釋宮》文。經度之，謂經理而量度之。攻作，謂庶民築作之。不日有成，謂不設期日，已成功，言民心樂為之也。○箋“文王”至“以名焉”。○正義曰：非天子不得作靈臺，故本之雲“文王應天命，始度靈臺之基趾”也。營表其位，謂以繩度立表，以定其位處也。傳唯解靈之名，不解名臺為靈之意，故申之。此實觀氣祥之臺，而名曰靈者，以文王之化行，似神之精明，故以名焉。以此言文王之臺，故因言文王之化行耳。其實天子之臺皆名曰靈臺。服虔《左傳》注云：“天子曰靈臺，諸侯曰觀臺。”是也。若然《書傳》說“武王渡河，言觀臺亞”者，彼謂在臺仰觀之人，不得謂其人為臺，故指實言觀也。僖十五年《左傳》雲：“秦伯獲晉侯以歸，乃舍諸靈臺。”秦是諸侯，而得有靈臺者，杜預雲：“在京兆鄠縣，周之故臺也。”哀二十五年《左傳》曰：“衛侯為靈臺於藉圃。”言為，則是新造。其時僣名之也。" }
      - { type: j, text: "經始勿亟，庶民子來。箋雲：亟，急也。度始靈臺之基趾，非有急成之意。眾民各以子成父事而來攻之。○亟，居力反。" }
      - { type: j, text: "王在靈囿，麀鹿攸伏。囿，所以域養禽獸也。天子百里，諸侯四十里。靈囿，言靈道行於囿也。麀，牝也。箋雲：攸，所也。文王親至靈囿，視牝鹿所游伏之處，言愛物也。○囿音又，徐於目反。麀音憂。麀牝，牝，頻刃反。處，昌慮反。" }
      - { type: z, text: "傳“囿所以”至“於囿”。○正義曰：《春秋》成十八年築鹿囿。昭九年築郎囿。則囿者，築牆為界域而禽獸在其中，故云“囿，所以域養禽獸也”。天子百里，諸侯四十里，解正禮耳。其文王之囿，則七十里，故《孟子》雲：“齊宣王問於孟子曰：‘文王之囿方七十里，有諸？’孟子曰：‘《書傳》有之。’曰：‘若是其大乎？’‘民猶以為小也。’曰：‘寡人之囿方四十里，民猶以為大，何也？’”是宣王自以為諸侯而問，故云“諸侯四十里”。以宣王不舉天子而問及文王之七十里，則以為文王非天子之制，明天子不止七十里，故宜為百里也。又解囿稱靈意，言“靈道行於囿也”。鄭《駁異義》雲：“同言靈者，於臺下為囿、沼，則似因臺為名，其實亦因相近，靈道遍行，故皆稱靈也。”《釋獸》雲：“鹿牡麚、牝麀。”是為鹿牝也。" }
      - { type: j, text: "麀鹿濯濯，白鳥翯々。濯濯，娛游也。翯々，肥澤也。箋雲：鳥獸肥盛喜樂，言得其所。○濯，直角反。翯，戶角反，《字林》雲：“鳥白肥澤曰翯。”下沃反。樂音洛。下文“於樂”、注“喜樂”皆同。" }
      - { type: z, text: "傳“濯濯”至“肥澤”。○正義曰：娛樂游戲，亦由肥澤故也，二者互相足。" }
      - { type: j, text: "王在靈沼，於牣魚躍。沼，池也。靈沼，言靈道行於沼也。牣，滿也。箋雲：靈沼之水，魚盈滿其中，皆跳躍，亦言得其所。○沼，之邵反。牣音刃。躍，羊略反。跳，徒彫反。" }
      - { type: j, text: "虡業維樅，賁鼓維鏞。於論鼓鍾，於樂辟雍。植者曰虡，橫者曰栒。業，大版也。樅，崇牙也。賁，大鼓也。鏞，大鍾也。論，思也。水旋丘如璧曰辟雍，以節觀者。箋雲：論之言倫也。虡也、栒也，所以懸鍾鼓也。設大版於上，刻畫以為飾。文王立靈臺，而知民之歸附。作靈囿、靈沼，而知鳥獸之得其所。以為音聲之道與政通，故合樂以詳之，於得其倫理乎？鼓與鍾也。於喜樂乎？諸在辟雍中者，言感於中和之至。○虡音巨。樅，徐七兇反，又音衝，衝牙也。沈又音子容反。賁，符雲反，字亦作“鼖。鏞音容。於音烏，鄭如字。下“於樂”、“於論”皆同。論，盧門反，一雲：“鄭音倫。”下同。闢音壁。注同。植，恃職反，栒，旬尹反。縣音玄。" }
      - { type: z, text: "“虡業”至“辟雍”。○毛以為，文王既立靈臺，而知民心歸附。作沼囿，而知鳥獸得所。以為音聲之道與政通，故作樂以詳之，觀己之德行審否，故使人設植者之虡，橫者之栒，上加大版而捷業然。又有崇牙，其飾維樅然。於此虡業之上，懸賁之大鼓，及維鏞之大鍾，然後使人擊之，觀其和否。於是思念鼓鍾，使之和諧。於是作樂在此辟雍宮中。是王之靈道行於人物之驗。○鄭唯下二句別，義俱在箋。○傳“植者”至“節觀者”。○正義曰：《釋器》雲：“木謂之虡。”孫炎曰：“虡栒之植，所以懸鍾磬也。”郭璞曰：“懸鍾磬之木，植者名為虡。”然則懸鍾磬者，兩端有植木，其上有橫木，謂直立者為虡，謂橫牽者為栒。栒上加之大版，為之飾。《釋器》雲：“大版謂之業。”孫炎曰：“業所以飾栒，刻板捷業，如鋸齒也。其懸鍾磬之處，又以彩色為大牙，其狀隆然，謂之崇牙。”言崇牙之狀樅樅然。《有瞽》曰：“設業設虡，崇牙樹羽。”此樅亦文承“虡業”之下，故知樅即崇牙之貌樅樅然也。賁，大也，故謂大鼓為賁鼓。《冬官·韗人》雲：“鼓長八尺，鼓四尺，中圍加三之一，謂鼖鼓。”注亦云：“大鼓謂之鼖。”是也。《釋樂》雲：“大鍾謂之鏞。”李巡曰：“大鍾音聲大。鏞，大也。”郭璞曰：“亦名鑮也。”水旋丘如璧者，璧體圓而內有孔，此水亦圓而內有地，猶如璧然。土之高者曰丘，此水內之地未必高於水外，正謂水下而地高，故以丘言之。以水繞丘所以節約觀者，令在外而觀也。定本及《集註》“鏞大鍾”之下雲：“論，思也。”則其義不得同鄭也。○箋“論之”至“之至”。○正義曰：以倫理之字宜為倫，故曰“論之言倫傳”。唯言栒虡植橫，不言所用，故申明之，言所以懸鍾鼓也。以經有鍾鼓，故特言之。其磬鑮亦有栒虡也。又解上言臺、沼，此言作樂之意。文王知民心歸附，鳥獸得所，以為音聲之道與政通，故大合諸樂以詳之。言欲詳審己德，觀其實允人物之心以否也。此在辟雍合樂，必行養老之禮，但主言樂之得理，不美養老之事，故言不及焉。治世之音安以樂，故在辟雍之內與聞之者，莫不喜樂，是其和之至也。" }
      - { type: j, text: "於論鼓鍾，於樂辟雍。鼉鼓逢逢，矇瞍奏公。鼉，魚屬。逢逢，和也。有眸子而無見曰矇。無眸子曰瞍。公，事也。箋雲：凡聲，使瞽矇為之。○鼉，徒何反，沈又音檀。《草木疏》雲：形似蜥蜴，四足長丈餘，甲如鎧，皮堅厚，宜冒鼓。逢，薄紅反，《埤蒼》雲：“鼓聲也。”字作“韸”，徐音豐。矇音蒙。瞍，依字作“叟”，蘇口反，亦作“瞍”，《說文》雲：“無目也。”《字林》先麼反，雲：“目有眸無珠子也。”眸，莫侯反。" }
      - { type: z, text: "傳“鼉魚”至“公事”。○正義曰：《月令》：“季夏，命漁師伐蛟取鼉。”漁師，取魚之官，故知鼉是魚之類屬也。《書傳》注云：“鼉如蜥蜴，長六七尺。”陸機《疏》雲：“鼉形似水蜥蜴，四足長丈餘，生卵大如鵝卵，甲如鎧甲，今合樂鼉魚甲是也。其皮堅，可以冒鼓。”《月令》注亦云：“鼉皮可以冒鼓也。”美鼓之得理，而云逢逢，故知為和也。矇、瞍皆無目之名，就無目之中以為等級。矇者，言其矇矇然無所見，故知有眸子而無見曰矇，即今之青盲者也。矇有眸子，則瞍當無，故云“無眸子曰瞍”。其瞽亦有眸子，矇之小別也，故《春官·瞽矇》注鄭司農雲：“無目眹謂之瞽。有目眹而無見謂之矇。有目而無眸子謂之瞍。”亦與此傳同也。此則對而為名，其總則皆謂之瞽。《尚書》謂舜為瞽子，《外傳》雲“吾非瞽史”。《周頌》有《有瞽》之篇，《周禮》有瞽矇之職，是瞽為總也。《周禮》瞽矇二字已是為官名，故文不及瞍。此言瞍，不言瞽，各從文之所便。《外傳》稱“矇誦瞍賦”，亦此類也。《周禮》上瞽、中瞽、下瞽，以智之高下為等級，不以目為次第矣。“公，事”，《釋詁》文。" }
      - { type: j, text: "《靈臺》五章，章四句。" }
      - { type: j, text: "《下武》，繼文也。武王有聖德，復受天命，能昭先人之功焉。繼文者，繼文王之王業而成之。昭，明也。○復，扶又反。王業，於況反。" }
      - { type: z, text: "“《下武》六章，章四句”至“功焉”。○正義曰：經六章，皆言武王益有明智，配先人之道，成其孝思，繼嗣祖考之跡，皆是繼文能昭先人之功焉。經雲“三後在天，王配於京”，則武王所繼，自大王、王季皆是矣。而序獨雲“繼文”者，作者以周道積基，故本之於三後，言“世有哲王”，見積德之深遠，其實美武王能繼，唯在文王也。大王、王季雖脩德創業，為後世所因，而未有天命，非開基之主，不足使武王聖人繼之。又此篇在《文王》詩後，故詩言“繼文”，著其功之大，且見篇之次也。文王已受天命，故言“復受”，為亞前之辭。武王之受天命，白魚入舟是也。" }
      - { type: j, text: "下武維周，世有哲王。武，繼也。箋雲：下，猶後也。哲，知也。後人能繼先祖者，維有周家最大，世世益有明知之王，謂大王、王季、文王稍就盛也。○哲，張列反，本又作“悊”，又作“喆”，皆同。知音智。下同。" }
      - { type: z, text: "傳“武，繼”。○正義曰：《釋詁》文。○箋“下猶”至“就盛”。○正義曰：居下世，即是在後，故云“下，猶後也”。“哲，智”，《釋言》文。言後人能繼祖者，維周家最大，謂大王、王季、文王稍稍就盛者也。王季為西伯，文王又受命，是稍盛也。不通數武王者，此言哲王，即是下文“三後”、“王配”之文，別在於下，故知世有之中，不兼武王也。" }
      - { type: j, text: "三後在天，王配於京。三後，大王、王季、文王也。王，武王也。箋雲：此三後既沒登遐，精氣在天矣。武王又能配行其道於京，謂鎬京也。○假音遐，已也。本或作“遐”。" }
      - { type: z, text: "箋“此三後”至“鎬京”。○正義曰：《曲禮下》雲：“天子崩，告喪曰：‘天王登遐。’”注云：“登，上也。遐，已也。”上已者，若仙去雲耳。以三後皆號為王，故以天子之禮言之。武王居鎬，故知配行其道於京，謂鎬京也。" }
      - { type: j, text: "王配於京，世德作求。箋雲：作，為。求，終也。武王配行三後之道於鎬京者，以其世世積德，庶為終成其大功。" }
      - { type: z, text: "箋“作為”至“大功”。○正義曰：“作，為”，《釋言》文。“求，終”，《釋詁》文。世積厚德，是當王天下。文王未及誅紂，即是王事未終。武王乃終之，故云終成其大功。" }
      - { type: j, text: "永言配命，成王之孚。箋雲：永，長。言，我也。命，猶教令也。孚，信也。此為武王言也。今長我之配行三後之教令者，欲成我周家王道之信也。王德之道成於信，《論語》曰：“民無信不立。”○成王，如字，又於況反。此為如字。" }
      - { type: z, text: "箋“命猶”至“不立”。○正義曰：此承“王配於京”，是配三後，不配天，故以命為教令。此篇是武王之詩，於此獨雲“此為武王言”者，餘文是作者以已之心論武王之事，此則稱武王口自所言，故辨之也。又解欲成王道，所為多矣，獨以信為言者，由王德之道成於信，欲使民信王道，然後天下順從，必伐紂，功成然始得耳。以民無信不立，故引《論語》以證之。" }
      - { type: j, text: "成王之孚，下土之式。式，法也。箋雲：王道尚信，則天下以為法，勤行之。永言孝思，孝思維則。則其先人也。箋雲：長我孝心之所思。所思者，其維則三後之所行。子孫以順祖考為孝。" }
      - { type: j, text: "媚茲一人，應侯順德。一人，天子也。應，當。侯，維也。箋雲：媚，愛。茲，此也。可愛乎武王，能當此順德。謂能成其祖考之功也。《易》曰：“君子以順德，積小以高大。”" }
      - { type: j, text: "永言孝思，昭哉嗣服。箋雲：服，事也。明哉，武王之嗣行祖考之事。謂伐紂定天下。" }
      - { type: z, text: "“媚茲”至“嗣服”。○正義曰：既言武王能法則三後之道，故於此歎而美之。可愛乎，此一人之武王。所以可愛者，以其能當此維順之德。祖考欲定天下，武王能順而定之，是能當順德。又述武王所言而歎美之。武王自言，長我孝心之所思者，此事顯明哉。武王實能嗣行祖考之事，伐紂定天下，是能嗣祖考也。○傳“一人”至“侯維”。○正義曰：《曲禮下》雲：“天子自稱曰予一人。”言其天下之貴，唯一人而已，謂天子為一人。“應，當”，《釋詁》文。又云：“維，侯也。”是侯得為維也。○箋“可愛”至“高大”。○正義曰：序言“繼文”，此雲“順德”，故知是順其先人之心，成其祖考之德。所引《易》者，《升卦·象辭》。升卦巽下坤上，故言木生地中。木漸而順長以成樹，猶人順德以成功。彼謂一人之身，漸積以成，此則順父祖而成事，亦相類，故引以為證。定本作“慎德”。準約此詩上下及《易》，宜為順字。又《集註》亦作“順”，疑定本誤。○箋“服事”至“天下”。○正曰：“服，事”，《釋詁》文。《禮記·大傳》曰：“牧之野，武王之大事。”故知嗣行祖考之事，唯謂伐紂定天下也。上言“永言配命”、“永言孝思”，其下句雲“成王之孚”、“孝思維則”，亦是武王自言。此雲“昭哉嗣服”，是作者美武王之辭，所以亦與“孝思”相連者，上雲“永言孝思”，是武王自言，此又述武王之言，歎而美之，並此“孝思”之句，亦非武王自言，得與嗣服相連也。" }
      - { type: j, text: "昭茲來許，繩其祖武。許，進。繩，戒。武，跡也。箋雲：茲，此。來，勤也。武王能明此勤行，進於善道，戒慎其祖考所履踐之跡，美其終成之。○來，王如字，鄭音賚。下篇“來孝”同。" }
      - { type: j, text: "於萬斯年，受天之祜。箋雲：祜，福也。天下樂仰武王之德，欲其壽考之言也。○祜音戶。下同。" }
      - { type: z, text: "“昭茲”至“之祜”。○正義曰：既言武王能嗣行祖事，又美其為民所樂仰。言武王能明此勤行，進於善道，戒慎其祖考所行之跡而踐行之，猶行善不倦，故為天下樂仰，皆欲令武王得於萬年之壽，且又多受天之福祿。言武王行善之故，為民愛之如此。○傳“許進”至“武跡”。○正義曰：以禮法既許，而後得進，故以許為進。“繩，戒。武，跡”，皆《釋訓》文。○箋“茲此”至“成之”。○正義曰：“茲，此。來，勤”，皆《釋詁》文。戒慎祖考踐履之跡，謂謹慎奉行，故美其終成之。○箋“祜福”至“之言”。○正義曰：“祜，福”，《釋詁》文。以萬年受福，是祝慶之辭，故知武王為天下所樂仰，此是欲其得福之言也。" }
      - { type: j, text: "受天之祜，四方來賀。於萬斯年，不遐有佐！遠夷來佐也。箋雲：武王受此萬年之壽，不遠有佐。言其輔佐之臣，亦宜蒙其餘福也。《書》曰“公其以子萬億年”，亦君臣同福祿也。" }
      - { type: z, text: "“受天”至“有佐”。○毛以為，民欲王受福，即實言其受福之事。武王既受得天之祜福，故四方諸侯之國皆貢獻慶之。又得於此萬年之壽，豈不遠有佐助之乎！言有遠方夷狄來佐助之也。此乘上章之文，故先言所受天之祜，因則為遠近之次，故先言四方，後言遠夷。四方，謂中國諸侯也。○鄭唯以下句為異。言武王得於此萬年之壽，不遠其有輔佐之臣。言王親近其臣，與之同福。○傳“遠夷來佐”。○正義曰：言不遠有佐，是遠有佐。遠人佐天子，唯夷狄耳，故知遠夷來佐之。《書敘》言：“武王既勝殷，西旅獻獒，巢伯來朝。”《魯語》曰：“武王克商，遂通道於九夷八蠻，蕭慎來賀。”是遠夷來佐之事。“不遐有佐”為遠夷，則“四方來賀”為諸夏。《民勞》傳曰：“四方，諸夏。”是也。○箋“武王”至“福祿”。○正義曰：箋以“不遐有佐”順文自通，不當反其言，故易之。武王既有萬年之壽，不遠有輔佐之臣，共蒙其福。其封為諸侯，則與周升降；其仕於王朝，則繼世在位，是其不與遠之。引《書》曰“公其以予萬億年”者，《洛誥》文。成王告周公，言公與我身，皆得萬億之年。既引其文，乃申其意，言彼亦君臣同福祿，故知此亦武王君臣同受福矣。" }
      - { type: j, text: "《下武》六章，章四句。" }
      - { type: j, text: "《文王有聲》，繼伐也。武王能廣文王之聲，卒其伐功也。繼伐者，文王伐崇，而武王伐紂。" }
      - { type: z, text: "“《文王有聲》八章，章五句”至“伐功”。○正義曰：經八章，上四章言文王之事，下四章言武王繼之，是繼伐。首章言文王有聲，武王則道廣於文王，是能廣文王令聞之聲。二章言文王伐崇，武王則伐紂以定天下，是卒其伐功。經雖無武王廣聲、卒伐之事，於理則有，故序言亦以轉互相明也。上四章言文王有令聞之聲、成名之德，作豐邑以追孝心，同四方而正法度，所為不止於伐崇也。下四章言武王君天下，服四方，定鎬京而成卜兆，傳善謀以安後世，所為不止於伐紂。唯以繼伐言之者，以其所施之事，皆伐之功，故言繼伐以總之。此篇八章，其末俱言“烝哉”。而四章言文、武之諡，四章言王后、皇王，作者變其文，見其事有異。上四章雖同是文王之事，而首章、二章言文王令聞成民，受命伐罪，是文王事之盛者，故舉其義諡而稱文王。三章言築城大小之事，述其所徙之言：四章言作豐以王四方，施化而為法度，比之前事為不盛，故不舉其諡，而變言王后。下四章雖同是武王之事，五章、六章，言武王伐紂，作邑定居，四方歸服，於武王之事為不盛，故不舉義諡，比文王之事則益大，故變言皇王。七章言考卜而後居鎬京，伐紂以成其佔：八章言重功業以為大事，傳順謀以安孫子，除虐去殘，詒訓後世，是武王之事盛者，故文舉其義諡而言武王。文王之事，則盛者居前，不盛次之。武王之事，則不盛在先者，見武王不盛之事，盛於文王之盛者。作者比其事之大小，而為之章次也。" }
      - { type: j, text: "文王有聲，遹駿有聲。遹求遹寧，遹觀厥成。箋雲：遹，述。駿，大。求，終。觀，多也。文王有令聞之聲者，乃述行有令聞之聲之道所致也。所述者，謂大王、王季也。又述行終其安民之道，又述行多其成民之德，言周德之世益盛。○遹，尹橘反，又音述。駿音峻。觀，古亂反。注同。聞音問，本亦作“問”。" }
      - { type: j, text: "文王烝哉！烝，君也。箋雲：君哉者，言其誠得人君之道。○烝，之丞反，《韓詩》雲：“美也。”" }
      - { type: z, text: "“文王”至“烝哉”。○正義曰：此文王乃有令聞之善聲。所以有之者，以文王從後仰而述行廣大其大王、王季所有令聞之善聲。所廣大者，謂文王又述行終其大王、王季安民之道，又述行多其大王、王季成民之德，以此益盛而大有聲也。此文王之德，信得人君之道哉。○箋“遹述”至“益盛”。○正義曰：“遹，述”，《釋言》文。“駿，大。求，終。觀，多”，《釋詁》文。《孔子閒居》曰：“三代之王，必先其令聞。”言有善事可以聞於外，是為有聲矣。故為有聲，是令聞之聲。言述行者，是述先聞之辭，故知謂述大王、王季也。聲聞則長之使大，令為已有，故云“遹駿有聲”。其安民、成民，則大王、王季有此行，但其事未終未多，今文王則終之多之，皆述行其道而增廣之耳。○傳“烝，君”。○正義曰：《釋詁》文。" }
      - { type: j, text: "文王受命，有此武功。既伐於崇，作邑於豐。箋雲：武功，謂伐四國及崇之功也。作邑者，徙都於豐，以應天命。○應，應對之應" }
      - { type: j, text: "文王烝哉！" }
      - { type: z, text: "箋“武功”至“天命”。○正義曰：經別言“既伐於崇”，則“武功”之言，非獨伐崇而已。受命之後，所伐邘、耆、密須、混夷之屬皆是也，故云“武功，謂伐四國及崇之功也”。武功之中既兼伐崇，而別言“既伐於崇”者，以其功最大，其伐最後，故特言之，為作邑張本，言功成乃作都也。言應天命者，天既命為天子，當立天子之居，故言徙都於豐，以應天命。或以為於豐得命，故徙豐應之。然則武王於盟津得命，不可徙都入河，乃遷都於鎬，非得命之地矣。" }
      - { type: j, text: "築城伊淢，作豐伊匹。匪棘其欲，遹追來孝。淢，成溝也。匹，配也。箋雲：方十里曰成。淢，其溝也，廣深各八尺。棘，急。來，勤也。文王受命而猶不自足，築豐邑之城，大小適與成偶，大於諸侯，小於天子之制。此非以急成從己之欲，欲廣都邑，乃述追王季勤孝之行，進其業也。○淢，況域反。成間有淢，字又作“洫”，《韓詩》雲：“洫，深池。”亟，居力反。下“亟”同。或作“棘”。欲音欲，本亦作“欲”。廣，古曠反。深，屍鴆反。行，下孟反。" }
      - { type: j, text: "王后烝哉！後，君也。箋雲：變諡言王后者，非其盛事，不以義諡。" }
      - { type: z, text: "“築城”至“烝哉”。○正義曰：上言作邑於豐，此述作豐之制。言文王興築豐邑之城，維如一成之淢。淢內之地，其方十里。文王作此豐邑，維與相匹，言大小正與成淢相配偶，是大於諸侯，小於天子之制，所以才得伐崇。即作此邑者，非以急從己之欲而廣此都邑，乃述追王季勤孝之行，思進其業故耳。此王之為人後也，誠得人君之道哉。○傳“淢，成溝”。○正義曰：《冬官·匠人》雲：“井間有溝，成間有淢。”溝是總名，故云“淢，成溝”，謂十里成間所有溝。淢、洫，音同。○箋“方十里”至“其業”。○正義曰：申傳“淢，成溝”之義，故云“方十里曰成。淢，其溝也”。言每方十里之地，其外有此溝，謂之為淢。此淢廣八尺深八尺。《匠人》雲：“方十里為成，成間廣八尺深八尺謂之洫。”是其事也。“棘，急”，《釋言》文。《禮記》引此詩作“匪革其猶”，革亦急也。文王既已受命，當為天子，其意以紂尚在，猶不敢自足，故築此豐邑之城，大小適與賦法十里之成相匹偶，是大於諸侯，小於天子之制，不以急從己之欲，欲得廣此都邑，乃述追王季勤孝之行。以王季勤孝，欲早成周道，故己早建都邑，以進其功業。文王所述，述大王以來。此止言王季者，以大王始有王跡，勤行其道，大王以前未有王跡，不得言大王勤孝。欲成父功，故所追勤孝，唯王季也。《春官·典命》雲：“上公九命，侯伯七命，子男五命。其國家宮室，皆以命數為節。”注云：“國家之所居，謂城方也。公之城蓋方九里，侯伯之城蓋方七里，子男之城蓋方五里。”《坊記》注云：“子男之城方五里。”此二注皆以公城方九里為差，則天子之城十二里矣，故此十里為小於天子也。《異義駁》雲：“鄭伯之城方五里。”又以侯伯為五里者，鄭兩解，故《書傳》雲：“古者百里之國九里之城，七十里之國五里之城，五十里之國三里之城。”注云：“玄或疑焉。《周禮·匠人》營國方九里，謂天子之城。今大國九里，則與之同。然則大國七里之城，次國五里之城，小國三里之城為近耳。或者天子實十二里之城，諸侯大國九里，次國七里，小國五里。”是鄭兩解之事也。以《匠人》、《典命》俱是正文，故不敢執定。《典命》注每言“蓋”，《匠人》注云“立王國若邦國”者，皆為疑辭，以見二塗之意也。○傳“後，君”。○正義曰：《釋詁》文。箋以作文有體，章類宜同，今半諡半否，故知變之有義。以相比校，無諡之章，其事皆劣，故言非其盛事，不以義諡，謂不以義理而言其諡也。諡者，行之成名，總一身之美，故事盛者稱之，不盛者變名耳。" }
      - { type: j, text: "王公伊濯，維豐之垣。四方攸同，王后維翰。濯，大。翰，幹也。箋雲：公，事也。文王述行大王、王季之王業，其事益大。作邑於豐，城之既成，又垣之，立宮室，乃為天下所同心而歸之。王后為之幹者，正其政教，定其法度。○濯，直角反，《韓詩》雲：“美也。”垣音袁。翰，戶旦反，徐音寒。" }
      - { type: j, text: "王后烝哉！" }
      - { type: z, text: "“王公”至“烝哉”。○正義曰：既言築作豐城，欲又本之前世，言此王述先王之業，其事維益大矣。即言大之狀，維在豐城之內，更築而垣牆之，以立宮室而居焉，乃為天下四方之民所共同心而歸之。其王君文王，維乃為之楨幹，謂為施法度以行之。是王后誠得人君之道哉。○傳“濯，大。翰，幹”。○正義曰：皆《釋詁》文。○箋“文王”至“法度”。○正義曰：言王事伊大，則從小至大，非文王之事自為大也。上言“遹追來孝”，此承其下，故知是述大王、王季之業，其事益大。上言“築城”、“作豐”，此言“維豐之垣”，則是豐城之內別起垣也，故云“作邑於豐，城之既成，又垣之，立宮室”。謂立天子之宮室。宮室既定，萬姓知有所歸，故為天下所同心而歸之。幹者，築牆所立之木。幹與牆為法，故為之幹者，正其政教，定其法度。" }
      - { type: j, text: "豐水東注，維禹之績。四方攸同，皇王維闢。績，業。皇，大也。箋雲：績，功。闢，君也。昔堯時洪水，而豐水亦汎濫為害。禹治之，使入渭，東注於河，禹之功也。文王、武王今得作邑於其旁地，為天下所同心而歸。大王為之君，乃由禹之功，故引美之。豐邑在豐水之西，鎬京在豐水之東。○闢音壁。注及下皆同。又音婢亦反，法也。氾，芳劍反，字亦作“汎”。濫，力暫反。大王，此及下言“大”者，並如字。" }
      - { type: j, text: "皇王烝哉！箋雲：變王后言大王者，武王之事又益大。" }
      - { type: z, text: "“豐水”至“烝哉”。○正義曰：上既言文王之事，故武王繼之。今豐水之得東流，注渭入河者，是禹之功業，言禹決治之，其傍得成平地也。今文王得作邑於傍，武王既成鎬京，故為天下四方所共同心歸之，文王、武王維於是為之君而施化焉。此大王誠得人君之道哉。○傳“績，業。皇，大”。○正義曰：“績，業”，《釋詁》文。又云：“皇，君。”君亦大之義，故為大。○箋“績功”至“之東”。○正義曰：“績，功。闢，君”，亦《釋詁》文也。功、業大同耳。據其力之所成則謂之功，言其澤及於後則謂之業。昭元年《左傳》劉定公見雒汭之水曰：“美哉，禹之功也！”此亦見豐水而思禹，故易傳以績為功。《堯典》曰：“湯湯洪水。”是堯時洪水。此言豐水東注，由禹之功，故知豐水亦氾濫為害，禹治之也。氾濫，謂汎長濫決，平地有水也。《禹貢》曰：“導渭自鳥鼠同穴，東會於豐，入於河。”是豐水入渭，東注於河。此章武王之事，而並言文王作邑於其傍者，以二邑皆在豐傍，舉豐而言，可以兼及文王，欲連言之。《帝王世紀》雲：“豐、鎬皆在長安之西南。”言豐邑在豐水之西，鎬京在豐水之東，以時驗而知之。○箋“變王”至“益大”。○正義曰：此與下章俱言皇王，而下有鎬京之事，知此皇王為武王也。同不言諡，而王后與皇王異文，既人異而辭變，故知為武王之事，又益大也。此與上章皆言“四方攸同”，而言益大者，以文王亦武王，故亦以四方言之，其實同歸之者，少於武王也。" }
      - { type: j, text: "鎬京辟雍，自西自東，自南自北，無思不服。武王作邑於鎬京。箋雲：自，由也。武王於鎬京行辟雍之禮，自四方來觀者，皆感化其德，心無不歸服者。" }
      - { type: j, text: "皇王烝哉！" }
      - { type: z, text: "箋“自由”至“服者”。○正義曰：《釋詁》雲：“由，自也。”故自得為由也。既言辟雍，即雲四方皆服，明由在辟雍行禮，見其行禮，感其德化，故無不歸服也。辟雍之禮，謂養老以教孝悌也。" }
      - { type: j, text: "考卜維王，宅是鎬京。維龜正之，武王成之。箋雲：考，猶稽也。宅，居也。稽疑之法，必契灼龜而卜之。武王卜居是鎬京之地，龜則正之，謂得吉兆，武王遂居之。修三後之德，以伐紂定天下，成龜兆之佔，功莫大於此。○挈，苦計反，本又作“契”。或苦結反。" }
      - { type: j, text: "武王烝哉！" }
      - { type: z, text: "“考卜”至“烝哉”。○正義曰：言稽考其疑，灼疑龜而卜之者，維武王所疑而卜者，其宅居於是鎬京之地。維此所契之龜，則出其吉兆以正定之，言居此必吉，故得天下。武王則能成之，伐紂以定天下，成此龜兆之佔，是功之大美者，此武王誠得人君之道哉。○箋“考猶”至“於此”。○正義曰：以《洪範》有稽疑之言，故云“考，猶稽也”。“宅，居”，《釋言》文。以稽疑之法，必契灼其龜而卜之。正謂得吉兆，龜正定其吉，雲此地可居。卜兆言吉，居之而得天下，是成龜兆之佔，伐去虐紂，身即王位，功無大於此者。伐紂為成龜兆之吉，定本、《集註》皆雲“功莫大是也”，義亦得通。《禮記》引此詩，彼注云：“武王築而成之。”與此異者，引《詩》斷章，多異於本。此顧上下之文言“武王烝哉”，是武王之盛事不宜直言其築作而已，故以伐紂為成之。" }
      - { type: j, text: "豐水有芑，武王豈不仕？詒厥孫謀，以燕翼子。芑，草也。仕，事。燕，安。翼，敬也。箋雲：詒，猶傳也。孫，順也。豐水猶以其潤澤生草，武王豈不以其功業為事乎？以之為事，故傳其所以順天下之謀，以安其敬事之子孫，謂使行之也。《書》曰：“厥考翼，其肯曰：‘我有後，弗棄基？’”○芑音起。詒，以之反。孫，王申毛如字，鄭音遜。傳，直專反。下同。" }
      - { type: j, text: "武王烝哉！箋雲：上言皇王，而變言武王者，皇，大也，始大其業，至武王伐紂成之，故言武王也。" }
      - { type: z, text: "“豐水”至“烝哉”。○正義曰：言豐水之傍有芑菜，豐水是無情之物，猶以潤澤而生菜為己事，況武王豈不以功業為事乎？言實以功業為事，思得澤及後人，故遺傳其所以順天下之謀，以安敬事之子孫。言武王能傳順天下，功被來世，後人敬其事者，則得行之乃安。是武王之道，令得長世，武王誠得為人君之道哉。○傳“燕，安。翼，敬”。○正義曰：燕禮所以安賓，故燕為安也。“翼，敬”，《釋詁》文。○箋“詒猶”至“棄基”。○正義曰：詒訓遺，即流傳之義，故詒猶傳也。傳其順天下之謀者，謂聖人所謀之事，行之則必順天下之心，安其敬事之子孫。言子孫敬事，能遵用其道，則得安也。必言敬事者，若子孫不敬，則不能行之；不能行，則不得安，故安、敬並言之。引《書》曰者，《大誥》文。彼上文以堂屋耕播為喻，言父為之於前，子不循於後，其父則嫌責之。此假言其父之辭。彼注云：“其父敬職之人，其肯曰：‘我有後，子孫不廢棄我基業乎？’”引此明後人須因前基，故云傳謀以安敬後，證翼為敬。彼言父敬，此言子孫明敬事者，乃能不棄基，故引而反以相明。" }
      - { type: j, text: "《文王有聲》八章，章五句。" }
      - { type: j, text: "《文王之什》十篇，六十六章，四百一十四句。" }
