# 毛詩正義卷8（孔穎達疏）：j 為經文＋毛亨傳、鄭玄箋，z 為疏文。
sections:
  - id: juan8
    name: 正文
    blocks:
      - { type: j, text: "《破斧》，美周公也。周大夫以惡四國焉。惡四國者，惡其流言毀周公也。○惡，烏路反，注同。" }
      - { type: z, text: "“《破斧》三章，章六句”至“國焉”。○正義曰：三章上二句惡四國，下四句美周公。經、序倒者，經以由四國之惡，而周公徵之，故先言四國之惡，後言周公之德。序以此詩之作，主美周公，故先言美周公也。○箋“惡四”至“周公”。○正義曰：案《金縢》，流言者，管叔及其群弟耳。今並言惡四國流言毀周公者，《書傳》曰：“武王殺紂。繼公子祿父及管、蔡流言，奄君薄姑謂祿父曰：‘武王已死，成王幼，周公見疑矣。此百世之時也，請舉事。’然後祿父及三監叛。”管、蔡流言，商、奄即叛，是同毀周公，故並言之。《地理志》雲：“成王時，薄姑氏與四國作亂。”則薄姑非奄君之名，而云“奄君薄姑”者，彼注云：“玄疑薄姑齊地名，非奄君名。”是鄭不從也。" }
      - { type: j, text: "既破我斧，又缺我斨。隋銎曰斧。斧斨，民之用也。禮義，國家之用也。箋雲：四國流言，既破毀我周公，又損傷我成王，以此二者為大罪。○斨，七羊反，《說文》雲：“方銎斧也。”隋，徒禾反，何湯果反，孔形狹而長也。銎，曲容反。周公東征，四國是皇。四國，管、蔡、商、奄也。皇，匡也。箋雲：周公既反，攝政，東伐此四國，誅其君罪，正其民人而已。" }
      - { type: j, text: "哀我人斯，亦孔之將！將，大也。箋雲：此言周公之哀我民人，其德亦甚大也。" }
      - { type: z, text: "“既破”至“之將”。○毛以為，斧斨者，生民之所用，以喻禮義者，亦國家之所用。有人既破我家之斧，又缺我家之斨。損其斧斨，是廢其家用，其人是為大罪。以喻四國之君，廢其禮義，壞其國用，其君是為大罪，不得不誅，故周公於是東征之。周公所以東征者，是止誅其四國之君，正是四國之民。主為四國之民被誘作亂，周公不以為罪而正之。此周公哀矜於我之民人，其德亦甚大，故美之。○鄭以為，有人既破我之斧，又缺我之斨，此二者是為大罪。以興四國流言，既破毀我周公之道，又損傷我成王，此二者亦是為大罪，故周公東征之。餘同。○傳“隋銎”至“之用”。○正義曰：如傳此言，則以破缺斧斨喻四國破毀禮義，故王肅雲：“今四國乃盡破其用。”故孫毓雲：“猶《甘誓》說言毀壞其三正耳。”然則經言我斧、我斨，乃是家之斧斨，為他所破。此四國自破禮義，與他破斧斨，不類。而云我者，此禮義天子所制，此四國破天子禮義，故云我。孫毓雲：“王者立制，其諸侯受制於天子，故言我。”傳意或然也。○箋“四國”至“大罪”。○正義曰：箋以此詩美周公，惡四國，則是惡毀周公耳，不宜遠言其人破毀禮義，故易傳以為破毀周公，損傷成王。孫毓雲：“周公不失其聖，成王本為賢君，四國叛逆，安能破周公、損成王乎？”斯不然矣。當管、蔡流言之後，商、奄叛逆之初，王與周公莫之相信。於時周室迫近危亡，其為毀損，莫此之大，何謂不能毀損？若不能毀損，自可不須徵之，誅此四國，復何為也？且詩人疾其噁心，故言缺破，豈待殺害王身，然後為損傷也？○傳“四國”至“皇匡”。○正義曰：《書序》雲：“成王既黜殷命，成王既伐淮夷，遂踐奄。”皆東征時事，故四國是管、蔡、商、奄。知不數淮夷者，以淮夷是淮水之上，東方之夷耳。此言四國，謂諸夏之國，故知不數之也。《書序》皆雲成王伐之，此言周公東征者，鄭以《書序》注凡此伐諸叛國，皆周公謀之，成王臨事乃往，事畢則歸，後至時復行。然鄭意以為，伐時成王在焉，故稱成王。鄭以為，周公避居東都，成王迎而反之，攝政，然後東征。於時成王已信周公，故可每事一往。毛無避居之義，則東征之時，成王猶有疑心，不親詣周公，而《書序》言成王者，以周公攝政耳，成王則為主，君統臣功，故言成王。此則專美周公，據論實事，故言周公東征也。《釋言》雲：“皇、匡，正也。”傳以皇為匡，箋又轉為正。○箋“周公”至“而已”。○正義曰：此四國之君，據《書傳》祿父、管叔皆見殺。蔡叔以車七乘，徒七十人，止言徒之多少，不知放之何處。《書序》雲：“成王既踐奄，將遷其君於薄姑。”注云：“踐讀曰翦。翦，滅也。”奄既滅矣，其君佞人，不可復，故欲徙之於齊地，使服於大國。是奄君遷於齊也。《書傳》雲：“遂踐奄。踐之者，籍之也。籍之，謂殺其身，執其家，瀦其宮。”如此，則言奄君見殺，與序不同。《書傳》非也。" }
      - { type: j, text: "既破我斧，又缺我錡。鑿屬曰錡。○錡，巨宜反，字或作“奇”，音同，鑿屬也。《韓詩》雲：“木屬。”周公東征，四國是吪。吪，化也。○訛，五戈反，又作“吪”" }
      - { type: j, text: "哀我人斯，亦孔之嘉！箋雲：“嘉，善也。”" }
      - { type: z, text: "傳“鑿屬曰錡”。○正義曰：此與下傳雲“木屬曰銶”，皆未見其文，亦不審其狀也。○傳“吪，化”。正義曰：《釋言》文。" }
      - { type: j, text: "既破我斧，又缺我銶。木屬曰銶。○銶音求，徐又音虯，《韓詩》雲：“鑿屬也。”一解雲：“今之獨頭斧。”周公東征，四國是遒。遒，固也。箋雲：遒，斂也。○遒，在羞反，徐又在幽反。" }
      - { type: j, text: "哀我人斯，亦孔之休！休，美也。○休，虛虯反。" }
      - { type: z, text: "傳“遒，固”。○正義曰：遒訓為聚，亦堅固之義，故為固也。言使四國之民心堅固也。箋以為之不安，故易之。《釋詁》雲：“遒、斂，聚也。”彼遒作“揫”音義同，是遒得為斂。言四國之民於是斂聚不流散也。" }
      - { type: j, text: "《破斧》三章，章六句。" }
      - { type: j, text: "《伐柯》，美周公也。周大夫刺朝廷之不知也。成王既得雷雨大風之變，欲迎周公，而朝廷群臣猶惑於管、蔡之言，不知周公之聖德，疑於王迎之禮，是以刺之。○柯，古何反。朝，直遙反。注及下篇同。" }
      - { type: z, text: "“《伐柯》二章，章四句”至“不知”。○正義曰：作《伐柯》詩者，美周公也。毛以為，周公攝政，東征四國。既定，仍在東土。已作《鴟鴞》之後，未得雷風之前，群臣皆知周公有成就周道之志，而成王猶未知之，故周大夫作詩美周公，以刺朝廷之不知。即經二章皆刺成王不知周公之辭。鄭以為，周公避居東都，三年之秋，得雷風之後，啟金縢之前，王意稍悟，欲迎周公，而朝廷大夫猶有不知周公之志，故周大夫作此詩以美周公，刺彼朝廷大夫之不知也。經二章皆言王當以禮迎周公，刺彼群臣不知之也。○箋“成王”至“刺之”。○正義曰：箋知此篇之作，在得雷風之後者，若在雷風之前，則王亦未悟，若有所刺，當刺於王，何以獨刺朝廷？若啟金縢之後，則群臣盡悟，無所可刺。故知是既得雷雨大風之變，欲迎周公，而朝廷猶有疑志，所以刺之也。《論語》雲“其在朝廷”，《祭義》言“孝悌達於朝廷”，皆斥君朝謂之朝廷，則知此言朝廷亦是成王之朝，所刺必有其人，故知刺朝廷群臣之中有不知周公之聖者也。毛氏雖不注序，推《鴟鴞》之傳必無避居之事。周公初即攝政，群臣無有不知，必不得同鄭刺群臣也。群臣皆信周公，唯有成王疑耳。《狼跋序》雲：“近則王不知。”此刺朝廷不知，當亦刺成王不知。王肅雲：“朝廷斥成王。”孫毓雲：“疑周公者，成王也。明周公者，群臣也。”《書》曰：“史與百執事對曰：‘信。噫！公命我勿敢言。’”二公下至百執事皆明周公如此，復誰刺乎？且夫朝廷人君所專，未有稱群臣為朝廷者。漢魏稱人主，或雲國家，或言朝廷，古今同也。曷以不言刺成王？刺成王當在《雅》，此詩主美周公，故在《豳風》，是以略言刺朝廷。傳意或然。雖刺成王與箋意異，其所刺者亦在作《鴟鴞》之後，得雷風之前。何則？作《鴟鴞》之時，周公親自喻王，王猶不悟，大夫故應刺之。若得雷風之後，王意已漸開悟，大夫不當刺王，明所刺亦在雷風之前。王肅以為，既作《東山》，又追作此詩以刺王，不知毛意然否。" }
      - { type: j, text: "伐柯如何？匪斧不克。柯，斧柄也。禮義者，亦治國之柄。箋雲：克，能也。伐柯之道，唯斧乃能之。此以類求其類也。以喻成王欲迎周公，當使賢者先往。○柄，彼病反。" }
      - { type: j, text: "取妻如何？匪媒不得。媒，所以用禮也。治國不能用禮則不安。箋雲：媒者，能通二姓之言，定人室家之道。以喻王欲迎周公，當先使曉王與周公之意者又先往。○取，七喻反，本亦作“娶”。" }
      - { type: z, text: "“伐柯”至“不得”。○毛以為，柯者為家之器用，禮者治國之所用。言欲伐柯以為家用，當如何乎？非斧則不能。以興欲取禮以治國者，當如之何乎？非周公則不能。言斧能伐柯，得柯以為家用，喻周公能行禮，得禮以治國，能執治國之禮者，唯周公耳。又言取妻如之何？非媒則不得。以興治國如之何？非禮則不安。以媒氏能用禮，故使媒則得妻，以喻周公能用禮，故任周公則國治，刺王不知周公而不任之也。○鄭以為，伐柯之道，非斧則不能，唯斧乃能之。言以類求其類，喻王欲迎周公，非賢不可往。當使賢者先往，亦以類求其類。取妻如之何？非媒不得。以媒能通二姓之言，定人室家之道，故使媒則得之。以喻王欲迎周公，當使曉王與周公之意者先往，以其能通二人之意，故宜先使之。言王當迎周公，以刺朝廷之不知也。○傳“柯斧”至“之柄”。○正義曰：《考工記·車人》雲：“柯長三尺，博三寸，厚一寸有半。五分其長，以其一為之首。”注云：“首六寸，謂關頭斧也。柯其柄也。”是斧柄大小之度。斧喻周公，柄喻禮義。斧能伐得柯，喻周公能得禮。柯所以供家用，猶禮可以供國用，故云禮義者，治國之柄。是以柯喻禮，則知斧喻周公。雖以斧喻周公，斧不能自伐得柯，必人執之，是人與斧共喻周公也。人執斧能伐柯，既伐得柯，人又執柯以營家用，喻周公能得禮，既能得禮，周公又能執禮以治國，以此美周公也。王肅雲：能執治國家之斧柄，其唯周公乎！是喻周公能執禮也。○箋“克能”至“先往”。○正義曰：“克，能”，《釋言》文。箋以下雲“我覯之子”，謂得見周公，則二章皆勸迎周公之事，故易傳言以類求其類，喻使賢者先往也。○傳“媒所”至“不安”。○正義曰：傳以下文“籩豆有踐”，籩豆，禮器，則此亦禮事，故傳以上經與此皆喻禮也。正以媒為興者，媒所以用禮，喻周公能用禮。取妻不以媒則不能得妻，喻治國不用禮則不能安國，言周公能用禮以安，而王不知，故刺之。○箋“媒者”至“先往”。○正義曰：箋以媒者通傳二姓之言，勸迎周公而以媒為喻，故易傳言當使曉王與周公之意者先往。孫毓雲：周公之思歸，患成王之未悟耳。王出郊而天雨反風，禾則盡起，精誠感天，而況於人乎！何須賢者之先往也？周公至聖，見能未形，非如讎敵，尚相阻疑，何須用人重相曉喻乎？鄭為此說者，以為此詩之作，在雷風之後，王實未迎周公，致使朝臣尚惑，假言迎意，刺彼未知。言王以周公之聖，欲其速反，尚使賢者先行，令人傳通。其意說周公宜還，見疑者可刺耳，非謂周公有疑，須相曉喻也。" }
      - { type: j, text: "伐柯伐柯，其則不遠。以其所願乎上交乎下，以其所願乎下事乎上，不遠求也。箋雲：則，法也。伐柯者必用柯，其大小長短近取法於柯，所謂不遠求也。王欲迎周公使還，其道亦不遠，人心足以知之。" }
      - { type: j, text: "我覯之子，籩豆有踐。踐，行列貌。箋雲：覯，見也。之子，是子也，斥周公也。王欲迎周公，當以饗燕之饌行至，則歡樂以說之。○覯，古豆反。踐，賤淺反。行，戶郎反。饌，士戀反。樂音洛。說音悅。" }
      - { type: z, text: "“伐柯”至“有踐”。○毛以為，伐柯之法，其則不遠，喻治國之法，其道亦不遠。何者？執柯以伐柯，比而視之，舊柯短則如其短，舊柯長則如其長，其法不在遠也。以喻交接之法，願於上交於下，願於下事於上，其道亦不遠也。言有禮君子，恕以治國，近取諸己，不須遠求。能如是者，唯周公耳。我若得見是子周公，觀其以禮治國，則籩豆禮器有踐然行列而次序矣。禮事弘多，不可遍舉，言其籩豆有列，見禮法大行也。○鄭以為，伐柯伐柯者，其法則不遠，舊柯足以法之。以喻王欲迎周公使還，其道亦不遠，人心足以知之。言眾人之心皆知公須還也，我王欲見是子周公，當以饗燕之饌，籩豆有踐然行列以待之。言王宜厚待周公，刺彼不知者也。○傳“以其”至“遠求”。○正義曰：此伐柯之不遠求，還近取法於柯，以喻交人之道不遠求，還近取法於己。故解不遠求之義，以其所原於上接已，則以所原之事交於在已下者；以其所原於下之事已，則以所原之事事於己之上者，此皆近取諸己，所謂不遠求。詩意言此者，以有禮君子能以身恕物，言周公能為此也。王肅雲：“言有禮君子恕施而行，所以治人則不遠。”○箋“伐柯”至“知之”。○正義曰：箋以為勸迎周公之辭，故易傳言“不遠者，人心足以知之”。《中庸》引此二句，乃雲：“執柯以伐柯，睨而視之，猶以為遠。”詩言“其則不遠”，彼言“猶以為遠”者，以作者言其不遠，明有嫌遠之意，故言猶以為遠。○傳“踐，行列貌”。○正義曰：以籩豆之器必行列陳之，故以踐為行列貌。毛以為，此詩刺王不知周公，皆不言王迎之事，必不得如鄭以籩豆之饌迎周公也。上句說恕以行禮，則此當為任用有禮之人則得禮事。陳設籩豆是行禮之器，言籩豆有踐謂見其行禮也，故王肅雲：“我所見之子能以禮治國。踐，行列之貌。籩豆，行禮之物也。”傳意或然。○箋“覯見”至“說之”。○正義曰：“覯，見”，《釋詁》文。飲食之事，聖人以之為禮。今勸迎周公，而言陳列籩豆，是令王以此籩豆與周公饗燕。" }
      - { type: j, text: "《伐柯》二章，章四句。" }
      - { type: j, text: "《九罭》，美周公也。周大夫刺朝廷之不知也。○罭，本亦作“罭”，於逼反。" }
      - { type: z, text: "“《九罭》四章，首章四句，下三章，章三句”至“不知”。○正義曰：作《九罭》詩者，美周公也。周大夫以刺朝廷之不知也。此序與《伐柯》盡同，則毛亦以為刺成王也。周公既攝政而東征，至三年，罪人盡得。但成王惑於流言，不悅周公所為。周公且止東方，以待成王之召。成王未悟，不欲迎之，故周大夫作此詩以刺王。經四章，皆言周公不宜在東，是刺王之事。鄭以為，周公避居東都三年，成王既得雷雨大風之變，欲迎周公，而朝廷群臣猶有惑於管、蔡之言，不知周公之志者。及啟金縢之書，成王親迎，周公反而居攝，周大夫乃作此詩美周公，追刺往前朝廷群臣之不知也。此詩當作在歸攝政之後。首章言周公不宜居東，王當以袞衣禮迎之。所陳是未迎時事也。二章、三章陳往迎周公之時，告曉東人之辭。卒章陳東都之人欲留周公，是公反後之事。既反之後，朝廷無容不知。序雲美周公者，則四章皆是也。其言刺朝廷之不知者，唯首章耳。" }
      - { type: j, text: "九罭之魚鱒魴。興也。九罭緵罟，小魚之網也。鱒魴，大魚也。箋雲：設九罭之罟，乃後得鱒魴之魚，言取物各有器也。興者，喻玉欲迎周公之來，當有其禮。○鱒，才損反，沈又音撰。魴音房。緵，子弄反，又子公反，字又作“緫”。罟音古。今江南呼緵罟為百囊網也。" }
      - { type: j, text: "我覯之子，袞衣繡裳。所以見周公也，袞衣卷龍也。箋雲：王迎周公，當以上公之服往見之。○袞，古本反，六冕之第二者也。畫為九章，天子畫升龍於衣上，公但畫降龍。字或作“卷”，音同。卷，卷冕反。" }
      - { type: z, text: "“九罭”至“繡裳”。○毛以為，九罭之中，魚乃是鱒也、魴也。鱒、魴是大魚，處九罭之小網，非其宜，以興周公是聖人，處東方之小邑，亦非其宜，王何以不早迎之乎？我成王若見是子周公，當以袞衣繡裳往見之。刺王不知，欲使王重禮見之。鄭以為，設九罭之網，得鱒、魴之魚，言取物各有其器，以喻用尊重之大禮，迎周公之大人，是擬人各有其倫。尊重之禮，正謂上公之服。王若見是子周公，當以袞衣繡裳往迎之。○傳“九罭”至“大魚”。○正義曰：《釋器》雲：“緵罟謂之九罭。九罭，魚網也。”孫炎曰：“九罭，謂魚之所入有九囊也。”郭樸曰：“緵，今之百囊網也。”《釋魚》有“鮅”、“鱒”。樊光引此詩。郭樸曰：“鱒似鯇子赤眼者。江東人呼魴魚為鯿。”陸機《疏》雲：“鱒似鯇而鱗細於鯇，赤眼。”然則百囊之網非小網，而言得小魚之罟者，以其緵促網目能得小魚，不謂網身小也。驗今鱒、魴非是大魚，言大魚者，以其雖非九罭密網，此魚亦將不漏，故言大耳，非大於餘魚也。傳以為，大者，欲取大小為喻。王肅雲：“以興下土小國，不宜久留聖人。”傳意或然。○箋“設九”至“其禮”。○正義曰：箋解網之與魚大小，不異於傳，但不取大小為喻耳。以下句“袞衣繡裳”是禮之上服，知此句當喻以禮往迎，故易傳以取物各有其器，喻迎周公當有禮。○傳“所以”至“卷龍”。○正義曰：傳解詩言“袞衣繡裳”者，是所以見公之服也。畫龍於衣謂之袞，故云袞衣卷龍。" }
      - { type: j, text: "鴻飛遵渚，鴻不宜循渚也。箋雲：鴻，大鳥也，不宜與鳧鷖之屬飛而循渚，以喻周公今與凡人處東都之邑，失其所也。○鳧音符。鷖，烏兮反，又作“翳”。" }
      - { type: j, text: "公歸無所，於女信處。周公未得禮也。再宿曰信。箋雲：信，誠也。時東都之人欲周公留不去，故曉之雲：公西歸而無所居，則可就女誠處是東都也。今公當歸復其位，不得留也。" }
      - { type: z, text: "“鴻飛”至“信處”。○毛以鴻者大鳥，飛而循渚，非其宜，以喻周公聖人，久留東方，亦非其宜，王何以不迎之乎？又告東方之人云：我周公未得王迎之禮，歸則無其住所，故於汝東方信宿而處耳，終不久留於此。告東方之人，雲公不久留，刺王不早迎。○鄭以為，鴻者大鳥，不宜與鳧鷖之屬飛而循渚，以喻周公聖人，不宜與凡人之輩共處東都。及成王既悟，親迎周公，而東都之人欲周公即留於此，故曉之曰：公西歸若無所居，則可於汝之所誠處耳。今公歸則復位，汝不得留之。美周公所在見愛，知東人願留之。○傳“鴻不宜循渚”。○正義曰：言不宜循渚者，喻周公不宜處東。毛無避居之義，則是東征四國之後，留住於東方，不知其住所也。王肅雲：“以其周公大聖，有定命之功，不宜久處下土，而不見禮迎。”箋為喻亦同，但以為闢居處東，故云與凡人耳。○傳“周公”至“曰信”。○正義曰：言周公未得王迎之禮也。“再宿曰信”，莊三年《左傳》文。公未有所歸之時，故於汝信處，處汝下國。周公居東歷年，而曰信者，言聖人不宜失其所也。再宿於外，猶以為久，故以近辭言之也。○箋“信誠”至“得留”。○正義曰：《釋詁》雲：“誠，信也。”是信得為誠也。以卒章言無以公西歸，是東人留之辭，故知此是告曉之辭。既以告曉東人，公既西歸，不得遙信，故易傳以信為誠。言公西歸而無所居，則誠處是東都也。此章已陳告曉東人之辭，卒章始陳東人留公之辭。此詩美周公，不宜處東。既言不宜處東，因論告曉東人之事。既言告曉東人，須見東人之意，故卒章乃陳東人之辭。" }
      - { type: j, text: "鴻飛遵陸，陸非鴻所宜止。公歸不復，於女信宿！宿猶處也。" }
      - { type: z, text: "“公歸不復”。○正義曰：箋以為避居則不復，當謂不得復位。毛以此章東征，則周公攝位久矣，不得以不復位為言也。當訓復為反。王肅雲：“未得所以反之道。”傳意或然。" }
      - { type: j, text: "是以有兗衣兮，無以我公歸兮，無與公歸之道也。箋雲：是，是東都也。東都之人欲周公留之為君，故云“是以有兗衣”。謂成王所齎來兗衣，原其封周公於此。以兗衣命留之，無以公西歸。" }
      - { type: j, text: "無使我心悲兮！箋雲：周公西歸，而東都之人心悲，恩德之愛至深也。" }
      - { type: z, text: "“是以”至“心悲兮”。○毛以為，首章言王見周公，當以兗衣見之。此章言王有兗衣，而不迎周公，故大夫刺之。言王是以有此兗衣兮，但無以我公歸之道兮。王意不悟，故云無以歸道。又言王當早迎周公，無使我群臣念周公而心悲兮。○鄭以為，此是東都之人欲留周公之辭，言王是以有此兗衣兮，王令齎來，原即封周公於此，無以我公西歸兮。若以公歸，我則思之，王無使我思公而心悲兮。○傳“無與公歸之道”。○正義曰：周公在東，必待王迎乃歸。成王未肯迎之，故無與我公歸之道，謂成王不與歸也。○箋“是東”至“西歸”。○正義曰：箋以為，王欲迎周公，而群臣或有不知周公之志者，故刺之。雖臣不知，而王必迎公，不得言無與公歸之道，故易傳，以為東都之人欲留周公之辭。首章雲迎周公當以上公之服往見之，於時成王實以上公服往，故東都之人即原以此衣封周公也。○箋“周公”至“至深”。○正義曰：東都之人言已將悲，故知是心悲念公也。傳以為刺王不知，則心悲謂群臣悲，故王肅雲：“公久不歸，則我心悲，是大夫作者言已悲也。”此經直言“心悲”，本或“心”下有“西”，衍字，與《東山》相涉而誤耳。定本無“西”字。" }
      - { type: j, text: "《九罭》四章，一章四句，三章章三句。" }
      - { type: j, text: "《狼跋》，美周公也。周公攝政，遠則四國流言，近則王不知。周大夫美其不失其聖也。不失其聖者，聞流言不惑，王不知不怨，終立其志，成周之王功，致大平，復成王之位，又為之大師，終始無愆，聖德著焉。○狼跋，省郎，獸名也。跋音卜末反，又蒲末反，字或作“拔”，同。王功，於況反。大平音泰，下“大師”、“大平”同。愆，起然反。" }
      - { type: z, text: "“《狼跋》二章，章四句”至“其聖”。○正義曰：作《狼跋》詩者，美周公也。毛以為，周公攝政之時，其遠則四國流言，謗毀周公，言“將不利於孺子”；其近則成王不知其心，謂周公實欲篡奪己位。周公進退有難如此，卒誅除四國，成就周道，使天下大平，而聖著明。故周大夫作此詩，美進退有難而能不失其聖也。經二章，皆言進退有難之事。美其不失聖者，本其美周公之意耳，於經無所當也。鄭以周公將攝政時，遠則四國流言，而周公不惑，不息攝政之心；近則成王不知，而周公不怨，不生忿懟之意，卒得遂其心志，成就周道，是進有難也。及致政成王之後，欲老而自退，成王又留為大師，令輔弼左右，是退有難也。知此進退有難，而聖德著明，終無愆過，故周大夫美其不失其聖也。經二章皆雲進退有難之事。“德音不瑕”，是不失聖也。序稱“流言”與“王不知”，唯說進有難也。不言退有難者，“不失其聖”之中，可以兼之矣。○箋“不失”至“者焉”。○正義曰：序言“不失其聖”，是總美周公之言，故箋具述周公進退有難，能使聖德著明之意以充之。箋以“流言”與“王不知”是一時之事，不宜分為進退。經雲“公孫碩膚”，則是遜位之後，故以“流言”與“王不知”為進有難也。既遜而留為大師，是退有難也。以此二者，皆違周公之志，是故俱名為難。進退有難，為終始無愆，所以美其不失其聖也。毛不注序，必知異於鄭者，傳以公孫為成王，則此經所陳，無周公遜位之事，不得以留為大師當退有難也。傳言進退有難，須兩事充之，明四國流言為進有難，王不知為退有難，能誅除四國，攝政成功，正是不失聖也。" }
      - { type: j, text: "狼跋其胡，載疐其尾。興也。跋，躐。疐，跲也。老狼有胡，進則躐其胡，退則跲其尾，進退有難，然而不失其猛。箋雲：興者，喻周公進則躐其胡，猶始欲攝政，四國流言，闢之而居東都也；退則跲其尾，謂後復成王之位，而老，成王又留之，其如是，聖德無玷缺。○疐，本又作“”，丁四反，又陟值反。躐，力輒反。跲，其劫反，又居業反。難，乃旦反。玷，丁簟反。" }
      - { type: j, text: "公孫碩膚，赤舄几几。公孫，成王也，豳公之孫也。碩，大。膚，美也。赤舄，人君之盛屨也。几几，絇貌。箋雲：公，周公也。孫，讀當如“公孫於齊”之孫。孫之言孫，遁也。周公攝政，七年致大平，復成王之位，孫遁闢此，成公之大美。欲老，成王又留之，以為大師，履赤舄几几然。○孫，毛如字，鄭音遜。舄音昔。屨，俱具反。絇，其俱反。遁，徒遜反。" }
      - { type: z, text: "“狼跋”至“几几”。○毛以為，狼之老者，則頷下垂胡，狼進前則躐其胡，卻退則跲其尾，是進退有難，然猶不失其猛，能殺傷禽獸，以喻周公攝政之時，遠則四國流言，近則王不知其志，進退有難，然猶不失其聖，能成就周道。所以進退有難，而攝此政者，欲待公孫成王長大，有大美之德，能履赤舄几几然，盛服以行禮，然後授之故也。○鄭以為，老狼進則躐其胡，退則跲其尾，進退有難，不失其猛，喻周公將欲攝政，遭四國流言，歸政成王，王復留為大師，進退有難，能不失其聖。又美周公不失其聖之事，言周公既致大平，乃遜遁避此成功之大美，復留在王朝，為大師之官，履其赤舄，其舄之飾几几然。美其聖德，故說其衣服也。○傳“跋躐”至“其猛”。○正義曰：“跋，躐”，“疐，跲”，《釋言》文。李巡曰：“跋，前行，曰躐。跲，卻頓，曰疐也。”《說文》雲：“跋，蹎”，丁千反；“跲，躓”，竹二反。躓即疐也。然則跋與疐皆是顛倒之類，以跋為躐者，謂跋其胡而倒躓耳。老狼有胡，謂頷垂胡，進則躐其胡，謂躐胡而前倒也，退則跲其尾，謂卻頓而倒於尾上也。跋胡言狼，疐尾亦是狼也，文不可重，故以“載”代之。下章倒其文，明“跋”上宜有“載”，所以互相見也。序言周公遠近有難，不失聖德，故知此經說狼進退有難而不失猛。○箋“興者”至“玷缺”。○正義曰：箋下言“公孫”，則遜位之後，故以進則躐胡喻將欲攝政，退則跲尾喻成王留之耳。周公人臣，以臣攝為進，致政為退，取象為安，故易傳也。○傳“公孫”至“絇貌”。○正義曰：傳以《雅》稱“曾孫”，皆是成王，以其是豳公之孫也。“碩，大”，《釋詁》文。“膚，美”，《小雅·廣訓》文。《天官·屨人》掌王之服屨，為赤舄、黑舄”，注云：“王吉服有九，舄有三等。赤舄為上，冕服之舄。下有白舄、黑舄。”然則赤舄是舄之最上，故云“人君之盛屨也”。《屨人》注云：“服屨者，著服各有屨也。復下曰舄，單下曰屨。古之人言屨以通於復，今世言屨以通於單，俗易語反。”然則屨、舄對文有異，散則相通，故傳以屨言之。《士冠禮》雲：“玄端黑屨，青絇繶純。爵弁纁屨，黑絇繶純。純博寸。”注云：“絇之言拘，以為行戒，狀如刃衣，鼻在屨頭。繶，縫中紃也。”屨順裳色，爵弁之屨以黑為飾。爵弁尊，其屨飾以繢次。雲“几几，絇貌”，謂舄頭飾之貌。以爵弁祭服之尊，飾之如繢次，屨色纁，而絇用黑，則冕服之舄必如繢次，舄色赤，則絇赤黑也。王肅雲：“言周公所以進退有難者，以俟王之長大，有大美之德，能服盛服以行禮也。”○箋“周公”至“几几然”。○正義曰：箋以上言公歸皆謂周公，故以此公為周公。古之遜字借孫為之，《春秋》昭二十五年經言“公孫於齊”，《春秋》之例，內諱奔謂之遜，言昭公遜遁而去位。此周公亦遜遁去位，故讀如彼文。“遜，遁”，《釋言》文。孫炎曰：“遁，逃去也。”周公攝政七年，遜遁避成功之大美，《尚書·洛誥》有其事。《書序》雲：“召公為保，周公為師，相成王為左右。召公不悅，《周公》作《君奭》。”是成王留之為大師也。上公九命，得服兗冕，故屨赤舄。孫毓雲：“《詩》、《書》名例，未有稱天子為公孫者。成王之去豳公，又已遠矣。又此篇美周公，不美成王，何言成王之大美乎？公宜為周公，箋義為長。”" }
      - { type: j, text: "狼疐其尾，載跋其胡。公孫碩膚，德音不瑕？瑕，過也。箋雲：不瑕，言不可疵瑕也。○疵，才斯反。" }
      - { type: z, text: "傳“瑕，過”。○正義曰：瑕者，玉之病。玉之有瑕，猶人之有過，故以瑕為過。箋言無可疵瑕者，亦是玉病。言周公終始皆善，為無疵瑕也。" }
      - { type: j, text: "《狼跋》二章，章四句。" }
      - { type: j, text: "豳國七篇，二十七章，二百三句。" }
      - { type: j, text: "《毛詩正義》" }
