# 毛詩正義卷11（孔穎達疏）：j 為經文＋毛亨傳、鄭玄箋，z 為疏文。
sections:
  - id: juan11
    name: 正文
    blocks:
      - { type: j, text: "《我行其野》，刺宣王也。刺其不正嫁取之數而有荒政，多淫昏之俗。" }
      - { type: z, text: "《我行其野》三章，章六句。○箋“刺其”至“之俗”。○正義曰：凡嫁娶之禮，天子諸侯一娶不改。其大夫以下，其妻或死或出，容得更娶。非此亦不得更娶。此為嫁娶之數，謂禮數也。昭三年《左傳》子大叔謂梁丙、張趯說朝聘之禮。張趯曰：“善哉，吾得聞此數。”是謂禮為數也。今宣王之末，妻無犯七出之罪，無故棄之更昏，王不能禁，是不能正其嫁娶之數。《大司徒》曰：“以荒政十有二，娶萬民。十曰多昏。”注曰：“荒，凶年也。鄭司農雲：‘多昏，不備禮而娶，昏者多也。’”彼謂國家凶荒，民貧不能備禮，乃寬之，使不備禮物，而民多得昏。今宣王之時，非是凶年，亦不備禮多昏。豐年而有此俗，故刺王也。經雲“求爾新特”，言其不以禮來，不肯媵。是當時不備禮而昏也。詩所述者，一人而已。但作者總一國之事而為辭，故知此不以禮昏成風俗也。" }
      - { type: j, text: "我行其野，蔽芾其樗。昏姻之故，言就爾居。樗，惡木也。箋雲：樗之蔽芾始生，謂仲春之時，嫁取之月。婦之父，婿之父，相謂昏姻。言，我也。我乃以此二父之命，故我就女居。我豈其無禮來乎！責之也。○蔽，必制反，徐又方四反。芾，方味反。樗，敕書反。" }
      - { type: j, text: "爾不我畜，復我邦家。畜，養也。箋雲：宣王之末，男女失道，以求外昏，棄其舊姻而相怨。" }
      - { type: z, text: "“我行”至“邦家”。○毛以為，有人言，我行適於野，採可食之菜，唯得蔽芾然樗之惡木。以興婦人言，我嫁他族以求夫，唯得無行不信之惡夫。既得惡夫，遇己不善，乃責之言：我以我父之昏，爾父之姻，二父敕命之，故我就爾而居處為室家耳。我豈無禮而來乎！而惡我也！爾既不我畜養，今當復反我之邦家矣。與之自訣之辭。鄭唯上二句記時為異。餘同。○傳“樗，惡木”。○正義曰：《七月》雲“採荼薪樗”，唯取薪。薪，惡木也。毛以秋冬為昏，不得有記時之事。王肅雲：“行遇惡木，言己適人遇惡夫也。”○箋“樗之”至“責之”。○正義曰：樗是木也，言蔽芾始生。謂葉在枝條始生，非木根始生於地也。仲春草木可採，故言仲春之時，嫁娶之月矣。“婦之父，婿之父，相謂為昏姻”，《釋親》文也。此及二章，並言昏姻，故言二父之命。卒章止有姻，唯據婿之父耳，故言“汝不思汝老父之命”。" }
      - { type: j, text: "我行其野，言採其蓫。昏姻之故，言就爾宿。蓫，惡菜也。箋雲：蓫，牛蘈也，亦仲春時生，可採也。○蓫，敕六反，本又作“蓄”。“藬”，本又作“蘈”，徒雷反。" }
      - { type: j, text: "爾不我畜，言歸斯復。復，反也。" }
      - { type: z, text: "箋“蓫，牛頹”。○正義曰：此《釋草》無文。陸機《疏》雲：“今人謂之羊蹄。”定本作“牛蘈”。" }
      - { type: j, text: "我行其野，言採其葍。不思舊姻，求爾新特。葍，惡菜也。新特，外昏也。箋雲：葍，{艹富}也，亦仲春時生，可採也。婿之父曰姻。我採{艹富}之時，以禮來嫁女。女不思女老父之命而棄我，而求女新外昏特來之女。責之也，不以禮嫁，必無肯媵之。○葍音福。{艹富}音富。女並音汝。媵音孕，又繩證反。" }
      - { type: j, text: "成不以富，亦祗以異。祗，適也。箋雲：女不以禮為室家，成事不足以得富也。女亦適以此自異於人道，言可惡也。○祗音支。惡，烏路反。" }
      - { type: z, text: "“不思”至“以異”。○正義曰：取妻者受父之命，故今引以責之。言父本命汝以我為妻，汝何不思憶舊時老父之命，反棄我而求汝新外昏特來之女也？汝如是不以禮為室家，成事不以是而得富，亦適可以此異於人耳。人悉偕老，汝獨相棄，是異於人也。○傳“葍，惡菜。新特，外昏”。○正義曰：陸機《疏》雲：“葍，一名{艹富}，幽州人謂之燕{艹富}。其根正白，可著熱灰中溫敢之。饑荒之歲，可蒸以御飢。”昏姻對文，則男婚女姻，散則通，故外來之婦為外昏也。○箋“不以”至“媵之”。○正義曰：此解新特之義。特謂獨來夫家，由不以禮嫁，必無人肯媵送之，故獨來也。禮，大夫乃一妻二妾，是有侄娣為媵，士庶人則不能備矣。此詩所述，下及庶人，本自無媵。而云無肯媵者，《釋言》雲：“媵，送也。”妾送嫡而行，故謂妾為媵。媵之名不專施妾，凡送女適人者，男女皆謂之媵。僖五年《左傳》“晉人滅虞，執其大夫井伯，以媵秦穆姬”，史傳稱伊尹有莘氏之媵氏之媵臣，是送女者雖男亦名媵也。此不以禮嫁，其父母之家，男子婦女皆無肯媵之，故獨來耳。非謂當有侄娣媵也。" }
      - { type: j, text: "《我行其野》三章，章六句。" }
      - { type: j, text: "《斯干》，宣王考室也。考，成也。德行國富，人民殷眾，而皆佼好，骨肉和親，宣王於是築宮廟群寢，既成而釁之，歌《斯干》之詩以落之。此之謂成室。宗廟成，則又祭祀先祖。○佼，古卯反。釁，許斳反。落如字，始也。或作“樂”，非。" }
      - { type: z, text: "《斯干》九章，首章七句，二章、三章、四章、五章章五句，六章七句，七章五句，八章、卒章章七句。○正義曰：作《斯干》詩者，宣王考室也。考，成也。宣王既德行民富，天下和親，乃築廟寢成，而與群臣安燕而樂之。此之謂成室也。人之所居曰室，宮寢稱室，是其正也。但君子將營宮室，宗廟為先，故鄭以為亦修宗廟，室是總稱，言室足以兼之。毛傳不言廟。王肅雲：“宣王修先祖宮室，儉而得禮。”孫毓雲：“此宣王考室之詩，無作宗廟之言。”孫、王並雲述毛，則毛意此篇不言廟也。築室必先修廟，但作者言不及耳。經雖皆是考室之事，正指其文，則“乃安斯寢”是也。故箋雲：“寢既成，乃鋪席與群臣安燕為歡以樂之。”是考室之事也。宣王中興，賢君其所以作者，非欲崇飾奢侈，妨害民務，國富民豐乃造之耳。故首章言天下親富，二章乃作之，三章言作之攻堅，四章言得其形制，五章言庭室寬明，六章乃言考之也。既考之後，居而寢宿。下至九章，言其夢得吉祥，生育男女，貴為王公，慶流後裔，因考室而得然，故考室可以兼之也。○箋“考成”至“先祖”。○正義曰：“考，成”，《釋詁》文。德行者，即“秩秩斯干”是也。國富者，“幽幽南山”是也。人民殷眾，而皆佼好，次二句是也。骨肉和親，既下三句是也。宣王承亂離之後，先務富民。民富情親，乃使之築宮廟群寢。築作既成，其廟，則神將休焉，則以禮釁塗之。其寢，則王將居焉，設盛食燕群臣，歌《斯干》之詩以歡樂之。此之謂成室也。言成者，非直築成而已，通謂國富民和，樂共作力，以成其事。廟則既為釁禮，使神得安焉。室則既為歡燕，使人得處焉。人神各有攸處，然後謂之為成，故言“此之謂成室”以結之。《說文》雲：“釁，血祭也。”賈逵雲：“殺而以血塗鼓謂之釁鼓。”則釁者，以血塗之名。《雜記下》曰：“成廟則釁之。其禮，雍人拭羊，舉羊升屋，自中屋南面，刲羊血流於前，乃降。”是釁廟禮也。昭四年《左傳》叔孫為孟丙作鍾，“饗大夫以落之”。服虔雲：“釁以豭豚為落。”則又一名落，蓋謂以血澆之也。《雜記》雲：“路寢成，則考之而不釁。”注云：“設盛食以落之。”即引《檀弓》“晉獻文子成室，諸大夫發焉”。是樂之事。下箋亦云“安燕為歡以樂之”，是也。據經“乃安斯寢”，是考室之事，而於經無釁廟之雲。鄭雲“而釁之”者，鄭以似續妣祖，為築宮廟，廟成必當釁。室尚燕樂，明廟釁可知也。《雜記》之文，廟成則釁，寢成則考，此序言“考室”，箋得兼雲釁廟者，此考之名，取義甚廣，乃國富民殷，居室安樂，皆是考義，猶《無羊》雲“考牧”，非獨據一燕食而已，故知考室之言，可以通釁廟也。言歌《斯干》之詩以樂之者，歌謂作此詩也。宣王成室之時，與群臣燕樂，詩人述其事以作歌，謂作此詩。《斯干》所歌，皆是當時樂事，故云“歌《斯干》之詩以樂之”，非謂當樂之時已有《斯干》可歌也。本或作“落”，以釁又名“落”，定本、《集註》皆作“落”，未知孰是。雲“宗廟成，則又祭先祖”，敘“君子攸躋”之言。箋以躋謂升廟祭祀，故又言此以敘之。" }
      - { type: j, text: "秩秩斯干，幽幽南山。興也。秩秩，流行也。幹，澗也。幽幽，深遠也。箋雲：興者，喻宣王之德，如澗水之源，秩秩流出，無極已也。國以饒富，民取足焉，如於深山。○秩，直乙反。澗音諫。如竹苞矣，如松茂矣。苞，本也。箋雲：言時民殷眾，如竹之本生矣；其佼好，又如松柏之暢茂矣。" }
      - { type: j, text: "兄及弟矣，式相好矣，無相猶矣。猶，道也。箋雲：“猶”當作“瘉”。瘉，病也。言時人骨肉用是相愛好，無相詬病也。○好，呼報反。猶，毛如字。鄭改作“瘉”，羊主反。詬，呼豆反。" }
      - { type: z, text: "“秩秩”至“猶矣”。○毛以為，秩秩然出無極已者，此澗水之流也。以興施無有窮者，此宣王之德也。言王德之無窮，猶澗水流之不竭。幽幽然深遠，材物豐積者，南山也。以興貨殖盈足者。王，國也。王貨物豐殖，民用饒足，亦似深山之有材也。民既豐富，得以生長，故其民眾多，如竹之叢生，根本之眾矣。其長大又佼好，如松木之葉，常冬夏暢茂，無衰落矣。其兄與弟矣，用能相好樂矣，無相責以道矣。○鄭唯無相詬病為異。餘同。○傳“幹，澗”。○正義曰：《釋山》雲：“夾水曰澗。”不訓幹為澗，正以秩秩宜為流貌。斯干共秩秩連文，與南山相對，故知幹為澗也。《漸卦》鄭注云“幹，謂大水之傍，故停水處”者，彼以鴻之所居，故為舊停水處，與此異也。○箋“國以”至“深山”。○正義曰：言宣王國富民又饒足，取則有之，如於山之取材，故以喻焉。言國富者，國以民為體，正謂民間饒足，非聚財於官，民取官材也。○箋“言時民”至“茂矣”。○正義曰：以竹言苞，而松言茂，明各取一喻。以竹筍叢生而本穊，松葉隆冬而不彫，故以為喻。其實竹葉亦冬青。《禮器》曰：“如竹箭之有筠，如松柏之有心，故貫四時而不改柯易葉。”是也。○傳“猶，道”。○正義曰：《釋詁》文。○箋“猶當”至“詬病”。○正義曰：箋以“相猶”與“相好”對文，言“無相猶矣”當謂無相惡之事。若相責以道，未是傷義賊恩。雖無此事，未足多善，不當舉以為詠也。《角弓》曰：“不令兄弟，交相為瘉。”則相病是兄弟之惡事。猶、瘉聲相近，故知字誤也。言詬罵相病害也。" }
      - { type: j, text: "似續妣祖，似，嗣也。箋雲：似讀如巳午之巳。巳續妣祖者，謂巳成其宮廟也。妣，先妣姜嫄也。祖，先祖也。○似，毛如字。妣，必履反。嫄，本或作“原”，音同。築室百堵，西南其戶。西鄉戶，南鄉戶也。箋雲：此築室者，謂築燕寢也。百堵，百堵一時起也。天子之寢有左右房，西其戶者，異於一房者之室戶也。又云南其戶者，宗廟及路寢，制如明堂，每室四戶，是室一南戶爾。○鄉，本又作“向”，同許亮反。下同。" }
      - { type: j, text: "爰居爰處，爰笑爰語。箋雲：爰，於也。於是居，於是處，於是笑，於是語。言諸寢之中，皆可安樂。○樂音洛。" }
      - { type: z, text: "“似續”至“爰語”。○毛以為，言王既能使國富和親，則又嗣續先祖先妣之功，故築其居室，百堵皆起，或西其戶，或南其戶。言路寢群室皆作之也。作之既成，乃於是居，於是處，於是笑，於是語焉。先“妣”後“祖”者，取會韻也。又以下有男女安寢之事，故兼雲先妣。○鄭以為，宣王既以於國門之左，在巳之地，繼續立先妣姜嫄、先祖后稷以下之廟。然後乃宮內築燕寢之室，百堵同時起之，比一房之室為西其戶，比宗廟路寢是室為南其戶，於是燕寢之中，居處笑語焉。燕寢言築及百堵之戶，則宗廟與明堂路寢，亦築而同時有戶制可知。宗廟言所立之地，則燕寢亦有其處，各舉義韻以言耳。○箋“似讀”至“先祖”。○正義曰：箋以似、續同義，不須重文，故似讀為巳午之巳。巳與午比辰，故連言之。直讀為巳，不雲字誤，則古者似、巳字同。“於穆不巳”，師徒異讀，是字同之驗也。《周禮》左宗廟，在雉門外之左，門當午地，則廟當巳地也。謂既在巳地，而續立其妣祖之廟，然後營宮室，故云謂巳成其宮廟也。君子將營宮室，宗廟為先，故知巳成其宮廟乃築室也。知妣是先妣姜嫄者，以特牲、少牢祭祀之禮，皆以其妃配夫而食，無特立妣之廟者。《春官·大司樂職》“舞《大濩》以享先妣，舞《大武》以享先祖。”妣先於祖，用樂別祭，則周之先妣有不系於夫而特立廟矣。《閟宮》、《生民》說姜嫄生后稷以配天，為周之王業，則周之先妣特立廟者，唯姜嫄耳。此妣文亦在祖上，故知是姜嫄也。祖，先祖，不斥號諡，則后稷、文、武兼親廟亦在其中。司樂七廟同用樂，言先祖以總之，明先祖之文兼通諸廟也。○傳“西”至“鄉戶”。正義曰：傳不言此為路寢之制，則此據天子之宮，其室非一。在北者南戶，在東者西戶耳。推此有東向戶、北向戶，故孫毓雲：“猶南東其畝。”○箋“此築”至“鄉戶”。正義曰：以上為立廟，故此為居室。然“似續妣祖”之言，文中不容路寢，則“築室百堵”，路寢亦宜在焉。獨言此築室謂築燕寢者，路寢作與燕寢同時，而制與宗廟相類。此“西南其戶”，非路寢之制，故特言燕寢。其路寢，文雖不載，亦作之可知。言天子之寢有左右房者，以天子之燕寢，即諸侯之路寢。禮，諸侯之制，聘有夾室。又《士喪禮》小斂，“婦人髽於室”，而《喪大記》諸侯之禮雲：“小斂，婦人髽帶麻於房中。”以《士喪》男子括髮在房，婦人髽於室，無西房故也。《士喪禮》婦人髽於室，在男子之西，則諸侯之禮，婦人髽於房，亦在男子之西，是有西房矣。有西房自然有東房，是諸侯路寢有左右房也。天子路寢既制如明堂，自然燕寢之制當如諸侯路寢，故知天子之燕寢有左右房也。既有左右，則室當在中，故西其戶者，異於一房之室戶也。大夫以下無西房，唯有一東房，故室戶偏東，與房相近。此戶正中比之，為西其戶矣。知大夫以下止一房者，以《鄉飲酒義》雲：“尊於房戶之間，賓主共之。”由無西房，故以房與室戶之間為中也。但大夫禮直言房，不言東西，明是房無所對故也。若然，《特牲》雲“豆籩鉶在東房”者，鄭注云：“謂房中之東，當夾北，非對西戶也。”《鄉飲酒記》雲：“薦出自左房。”《鄉射記》雲“出自東房”者，以《記》人以房居東在左，因言之。《記》非經，無義例也。又解南其戶者，宗廟及路寢制如明堂，每室四戶，是燕寢之室，獨一南戶耳，故言西其戶也。知宗廟及路寢制如明堂者，《明堂位》曰：“太廟，天子明堂。”又《月令》說明堂，而季夏雲：“天子居明堂太廟。”以明堂制與廟同，故以太廟同名其中室，是宗廟制如明堂也。又宗廟象生時之居室，是似路寢矣，故路寢亦制如明堂也。又《匠人》雲：“夏后氏世室，殷人重屋，周人明堂。”注云：“世室，宗廟也。”重屋者，王宮正室，若大寢也。明堂者，明政教之堂也。此三者不同，而三代各舉其一，是欲互以相通，故鄭雲：“此三者，或舉宗廟，或舉王寢，或舉明堂，互言之，以明其同制。”是宗廟及路寢制如明堂也。彼三者並陳，此言如明堂者，以周制舉明堂為文，故以宗廟及路寢制如之也。彼文說世室曰“五室四傍兩夾窗”。注云：“窗，助戶為明也。”每室四戶八窗，以言四傍，是四方傍開。又云“兩夾窗”，是一戶兩窗夾之。以此知每室四戶也。宣王都在鎬京，此考室當是西都宮室。《顧命》說成王崩，陳器物於路寢，雲：“胤之舞衣、大貝、鼖鼓在西房。兌之戈、和之弓、垂之竹矢在東房。”若路寢制如明堂，則五室皆在四角與中央，而得左右房者，《鄭志》答趙商雲：“成王崩之時，在西都。文王遷豐，作靈臺、辟雍而已，其餘猶諸侯制度。故喪禮設衣物之處，寢有夾室與東西房也。周公攝政，致太平，制禮作樂，乃立明堂於王城。”如鄭此言，則西都宗廟路寢依先王制，不似明堂。此言如明堂者，《鄭志》答張逸雲：“周公制禮土中，《洛誥》‘王入太室祼’，是也。《顧命》成王崩於鎬京，承先王宮室耳。宣王承亂，未必如周公之制。”以此二答言之，則鄭意以文王未作明堂，其廟寢如諸侯制度。乃周公制禮，建國土中，以洛邑為正都。其明堂廟寢，天子制度，皆在王城為之。其鎬京則別都耳。先主之宮室尚新，周公不復改作，故成王之崩，有二房之位，由承先王之室故耳。及厲王之亂，宮室毀壞，先王作者，無復可因。宣王別更修造，自然依天子之法，不復作諸侯之制，故知宣王雖在西都，其宗廟路寢皆制如明堂，不復如諸侯也。若然，明堂，周公所制，武王時未有也。《樂記》說武王祀乎明堂者，彼注云“文王之廟為明堂制”。知者，以武王既伐紂為天子，文王又已稱王，武王不得以諸侯之製為父廟，故知為明堂制也。○箋“於是”至“安樂”。○正義曰：居、處義同。以寢非一，散言之耳。此文雖承燕寢之下，理亦兼有路寢。《周禮》注云：“王路寢一，小寢五。”下雲：“後六宮。”此文亦可兼之，故云“諸寢之中，皆可安樂”。" }
      - { type: j, text: "約之閣閣，椓之橐橐。約，束也。閣閣，猶歷歷也。橐橐，用力也。箋雲：約謂縮板也。椓謂土也。○閣音各。椓，陟角反。橐音托，本或作“析”。縮，所六反。，呂忱丈牛反，沈呂菊反，《說文》音敕周反，“引也。從手，留聲”。" }
      - { type: j, text: "風雨攸除，鳥鼠攸去，君子攸芋。芋，大也。箋雲：芋當作“幠”。幠，覆也。寢廟既成，其牆屋弘殺，則風雨之所除也。其堅緻，則鳥鼠之所去也。其堂堂相稱，則君子之所覆蓋。○除，直慮反，去也。芋，毛香於反，鄭火吳反，或作“籲”。殺，所界反。致，直置反，本亦作“緻”同。稱，尺證反。" }
      - { type: z, text: "“約之”至“攸芋”。○毛以為，王本作群寢之時，以繩約縮之，繩在板上歷歷然均。謂繩均板直，則牆端正也。既投土於板，以杵椓築之，皆橐橐然用力。勤力而築，則牆牢固也。至若王寢既成，其牆屋弘殺，則風雨之所除。其築作堅緻，則鳥鼠之所去。君子於是居中，所以自光大也。○鄭以為，總宮廟群寢，下句“君子之所覆蓋”為異。○箋“約謂”至“土”。○正義曰：《綿》雲“縮板以載”，是鄭所據也。縮約皆謂以繩纏束之，若今之牆衽也。此“椓之橐橐”，猶《綿》雲“築之登登”，故傳皆以為用力如椓杙之椓，正謂以杵築之也。言椓謂土者，取壤土投之板中，使平均，然後椓之也。者，以手平物之名，故字從手。○傳“芋，大”。○正義曰：孫毓雲：“宮室既成，君子處之，所以為自光大。”○箋“芋當”至“覆蓋”。○正義曰：芋作當“幠”，讀如亂。如此，幠以聲相近，故誤耳。“幠，覆也”，鄭以義言之。《爾雅》無此訓也。以下“攸躋”為君子所升，“攸寧”為君子所安，則知此為君子所覆，故云“其堂堂相稱，則君子之所覆蓋”，故反以類上，去鳥鼠，除風雨，文勢同也。" }
      - { type: j, text: "如跂斯翼，如人之跂竦翼爾。○跂音企。竦，粟勇反。如矢斯棘，如鳥斯革。棘，稜廉也。革，翼也。箋雲：棘，戟也，如人挾弓矢戟其肘，如鳥夏暑希革張其翼時。○棘，居力反，《韓詩》作“朸”。朸，隅也，旅即反。革如字，《韓詩》作“<革羽>”，雲：“翅也。”稜，力登反。挾，子沓反，又子協反，又音協。肘，張九反。" }
      - { type: j, text: "如翬斯飛，君子攸躋。躋，升也。箋雲：伊洛而南，素質，五色皆備成章，曰翬。此章四如者，皆謂廉隅之正，形貌之顯也。翬者，鳥之奇異者也，故以成之焉。此章主於宗廟，君子所升，祭祀之時。○翬者輝，雉名，《說文》雲：“大飛也。”躋，子西反。" }
      - { type: z, text: "“如跂”至“攸躋”。○毛以為，言宮室之制，如人跂足竦此臂翼然，如矢之鏃有此稜廉然，如鳥之舒此革翼然，如翬之此奮飛然。宮室如此之美，君子所以升處也。矢、鳥、翬指形言之。如跂不言人者，義取於跂，言跂則人可知也。又人手似鳥翼，以為韻。言跂翼，則如人弭手直立，以喻屋壁之上下正直也。言如矢稜廉，以喻四隅廉正也。其斯革、斯飛，言簷阿之勢似鳥飛也。翼言其體，飛象其勢，各取喻也。○鄭以此章論宗廟，“如矢斯棘”，如人挾弓矢戟其肘，亦喻之稜廉；“君子攸躋”，言升祭，為異耳。○傳“棘，稜廉”。○正義曰：言稜廉，則指矢鏃之角為棘焉。蓋古有此名。○箋“棘戟”至“翼時”。○正義曰：古語謂棘為戟，故《明堂位》曰：“越棘大弓。”隱十一年《左傳》曰：“子都拔棘。”皆戟也。言如人挾弓矢戟其肘者，謂射者左手弣弓，而右手彎之，則戟其肘，謂右手之肘，亦喻室之外廉隅也。如鳥夏暑又布革張其翼者，《堯典》曰：“仲夏，鳥獸希革。”注云：“夏時，鳥獸毛疏皮見。”則言革者，謂夏暑毛希，皮革露見。於此之時，必舒其羽翼，故不言翼而言革，解其言革之本意。○傳“躋，升”。○正義曰：《釋詁》文。孫毓雲：“君子之所升處。”○箋“伊洛”至“之時”。○正義曰：“伊洛而南，素質，五色皆備成章，曰翬”，《釋鳥》文。李巡曰：“素質，五采備具，文章鮮明。”雉白質，五色為文。鳥如此色者希，故云“鳥之奇異者，故以成之”，解比象既多，最後言翬意也。下雲“君子攸寧”，是寢息其中。此言“攸躋”，則是君子升下登上之辭。王所尊者，唯宗廟耳，故知此章主宗廟，言祭祀之時，下章主寢室，言燕息之時。" }
      - { type: j, text: "殖殖其庭，有覺其楹。殖殖，言平正也。有覺，言高大也。箋雲：覺，直也。○殖，市力反。噲噲其正，噦噦其冥，正，長也。冥，幼也。箋雲：噲噲，猶快快也。正，晝也。噦噦，猶煟煟也。冥，夜也。言居之晝日則快快然，夜則煟煟然，皆寬明之貌。○噲音快。正音政。噦，呼會反。冥，毛莫形反，鄭莫定反。長，王丁丈反，崔直良反。幼，王如字，本或作“窈”，崔音杳。煟音謂，呂忱雲：“火光貌。”" }
      - { type: j, text: "君子攸寧。箋雲：此章主於寢，君子所安，燕息之時。" }
      - { type: z, text: "“殖殖”至“攸寧”。○毛以為，殖殖然平正者，其宮寢之前庭也。有覺然高大者，其宮寢之楹柱也。言宮寢庭既平正，楹又高大，宣王之所與翔列聚集於此者，皆是讓德有禮之士。噲噲然寬博，其群臣之長者。噦噦然閒習，其群臣之幼者。長幼有禮，君子所以安也。○鄭以為，言寢室殖殖然其庭平正，有調直者其楹柱。庭平柱直，處所寬明矣。快快然其晝日居之也，煟煟然其夜冥居之也。院寬室明，晝夜俱快，君子之所安息也。○傳“有覺，言高大”。○箋“覺，直”。○正義曰：覺之為訓，為大為直，故《禮記》注云：“覺，大也，直也。”傳以屋之為美，在於高大，箋以柱之為善，貴於調直，故異訓也。○傳“正，長。冥，幼”。○正義曰：“正，長”，《釋詁》文。“冥，幼”，《釋言》文。王肅雲：“宣王之臣，長者寬博噲噲然，少者閒習噦噦然。夫其所與翔於平正之庭，列於高大之楹，皆少長讓德有禮之士，所以安也。”傳意或然。而本或作“冥，窈”者，《爾雅》亦或作窈。孫炎曰：“冥，深闇之窈也。”某氏曰：“《詩》雲：‘噦噦其冥。’”為冥窈於義實安，但於“正，長”之義不允，故據王注為毛說。冥所以得為幼者，郭璞曰“幼稚者冥昧”也。○箋“噲噲”至“之貌”。○正義曰：箋以此說宮室之形狀，庭楹之平直，不得有長幼之義，故以正為晝，冥為夜，快快、煟煟為室宮寬明之貌。" }
      - { type: j, text: "下莞上簟，乃安斯寢。箋雲：莞，小蒲之席也。竹葦曰簟。寢既成，乃鋪席與群臣安燕為歡以落之。○莞音官，徐又九完反，草叢生水中，莖圓，江南以為席，形似小蒲而實非也。鋪，普吳反，又音敷。樂音洛，本亦作“落”。乃寢乃興，乃佔我夢。言善之應人也。箋雲：興，夙興也。有善夢則佔之。○應，應對之應。" }
      - { type: j, text: "吉夢維何？維熊維羆，維虺維蛇。箋雲：熊羆之獸，虺蛇之蟲，此四者，夢之吉祥也。○熊，回弓反。羆，彼宜反。虺，許鬼反。蛇，市奢反。" }
      - { type: z, text: "“下莞”至“維蛇”。○正義曰：宣王命人下鋪莞蒲，上施簟席，乃與群臣安燕為歡樂於此寢室之中。歡樂已訖，乃於其中寢寐焉。至晨乃興起焉。於寐時有夢，乃佔我所夢之事。其吉夢維何事乎？維夢見熊羆與虺蛇耳。言乃佔我夢者，王自言已夢，命人佔之。下雲“大人佔之”，乃是他人為王占夢也。言吉夢者，當時未有吉凶，據後佔之為吉，故探言焉。此“乃安斯寢”之下無傳，毛氏為燕以否，未可明也。○箋“莞小蒲”至“落之”。○正義曰：《釋草》雲：“莞，苻蘺。”某氏曰：“《本草》雲：‘白蒲一名苻蘺，楚謂之莞蒲。’”郭璞曰：“今西方人呼蒲為莞蒲。今江東謂之苻蘺，西方亦名蒲，用為席。”言小蒲者，以莞、蒲一草之名，而司几筵有莞筵、蒲筵，則有大小，為席精粗，故得為兩種席也。知莞用小蒲者，以《司几筵》設席，皆粗者在下，美者在上。其職雲：“諸侯祭祀之席，蒲筵繢純，加莞席紛純。”以莞加蒲，明莞細而用小蒲，故知“莞，小蒲之席”也。竹葦曰簟者，以常鋪在上，宜用堅物，故知竹簟也。且《詩》每雲簟茀用為車蔽，是竹簟可知。以此考室之詩，室之初成，當有燕樂，故為寢室既成，鋪席與群臣安燕為歡以樂之也。定本作“落”。此下莞上簟，雖是與群臣燕樂之席，其室內寢臥衽席亦當然也。《士喪禮》者，士禮也，雲“下莞上簟，衽如初”，則平常皆莞簟也。其寢臥之席，自天子以下，宜莞簟同。○傳“言善之應人”。○正義曰：夢者，應人之物，善惡皆然。此據下文言吉夢，故云“善之應人”也。故《占夢》雲：“獻吉夢於王。”又曰：“乃舍萌於四方，以贈惡夢。”是夢有善惡也。○箋“熊羆”至“吉祥”。○正義曰：以熊羆四足而毛，謂之獸。虺蛇無足之物，故謂之蟲也。生男女之徵，故四者夢之吉祥。《釋獸》雲：“羆如熊，黃白文。”舍人曰：“羆如熊，色黃白也。”郭璞曰：“似熊而長頭高腳，猛憨多力，能拔樹木。關西呼曰貑羆。”《釋魚》雲：“蝮虺，博三寸，首大如擘。”舍人曰：“蝮，一名虺。江淮以南曰蝮，江淮以北曰虺。”孫炎曰：“江淮以南謂虺為蝮，廣三寸，頭如拇指，有牙，最毒。”郭璞曰：“此自一種蛇，人自名為蝮虺。今蛇細頸大頭，色如艾，綬文，文間有毛，似豬鬛。鼻上有鈄。大者長七八尺。一名反鼻，如虺類。足以明此自一種蛇。”如郭意，此蛇人自名蝮虺，非南北之異。蛇實是蟲，以有鱗，故在《釋魚》，且魚亦蟲之屬也。" }
      - { type: j, text: "大人佔之：“維熊維羆，男子之祥；維虺維蛇，女子之祥。”箋雲：大人佔之，謂以聖人占夢之法佔之也。熊羆在山，陽之祥也，故為生男。虺蛇穴處，陰之祥也，故為生女。○大音泰。後“大人”同。" }
      - { type: z, text: "箋“大人”至“生女”。○正義曰：以占夢之官，中士耳，而言大人佔之，明其法天人所為，故云“聖人占夢之法佔之”。聖人有法解則佔之，故《左傳》文公之夢，子犯佔之；簡子之夢，問諸史墨，不必要佔夢之官乃得佔也。此及《無羊》皆雲“大人佔之”，則占夢者，聖人之法。《正月》雲：“召彼故老，訊之占夢。”譏之者，以王不尚道德，專信徵祥，侮慢故老，故刺之。不謂夢不當佔也。熊羆大較是山獸，亦居澤在穴，故《韓奕》雲：“川澤訏訏，有熊有羆。”《秋官·穴氏》注云：“熊羆之屬，冬藏者也。燒其所食之物於穴外，以誘出之。”是也。" }
      - { type: j, text: "乃生男子，載寢之床，載衣之裳，載弄之璋。半珪曰璋。裳，下之飾也。璋，臣之職也。箋雲：男子生而臥於床，尊之也。裳，晝日衣也。衣以裳者，明當主於外事也。玩以璋者，欲其比德焉。正以璋者，明成之有漸。○衣，於既反。注“衣以裳”、下“衣之裼”同。璋音章。" }
      - { type: j, text: "其泣喤喤，朱芾斯皇，室家君王。箋雲：皇猶煌煌也。芾者，天子純朱，諸侯黃朱。室家，一家之內。宣王將生之子，或且為諸侯，或且為天子，皆將佩朱芾煌煌然。○喤音熿，華彭反，沈又呼彭反，聲也。芾音弗。煌音皇。" }
      - { type: z, text: "“乃生”至“君王”。○毛以為，王前夢熊羆，果有效驗，乃生男子矣。生訖，則寢臥之於床，尊之。又則衣著之以裳，玩弄之以璋也。裳明習為卑下，璋見效奉臣職。時已其泣聲太煌煌然，至其長大，皆佩朱芾。於此煌煌然，由王家室之內，或為諸侯之君，或為天子之王，故皆佩朱芾也。○鄭唯“裳為主外事”，“璋比德之有漸”。餘同。○傳“半圭”至“之職”。○正義曰：知“璋，半圭”者，《典瑞》雲：“四圭有邸以祀天。兩圭有邸以祀地。圭璧以祀日月。璋邸射以祀山川。”從上而下，遞減其半，故知“半圭曰璋”。“裳，下之飾”，《易·文言》文也。裳為下飾，以璋配裳，故知見臣之職也。宣王子孫當為君，而言臣下者，王肅雲：“言無生而貴之也。明欲為君父，當先知為臣子也。”璋而得為臣職者，王肅雲：“群臣之從王行禮者奉璋。”又《棫樸》曰：“奉璋峨峨，髦士攸宜。”是也。○箋“男子”至“有漸”。○正義曰：箋以下章與此相對。以下女子寢之地，明男子生而臥之床，尊之也。以下“載衣之裼”，裼是夜臥之衣，故云“裳，晝日衣”也。一晝一夜，明取內外為義，故知男子衣以裳，明當主外事；女子衣以裼，明當主內事也。女子弄之瓦，瓦，紡塼也，以女子之所有事；明玩以璋者，亦男子之所有事。君子於玉比德焉，故知以璋欲其比德也。玉不用圭而以璋者，明成人之有漸。璋是圭之半，故言漸也。下句乃言“其泣喤喤”，則此所陳，皆在孩幼。《禮記》鄭注云：“人始生在地，男子已寢之床。”又非始生也。蓋聖人因事記義。子之初生，暫行此禮，不知生經幾日而為之也。何則？女子不可恆寢於地竟無裳，男子亦不容無褓，且甫言其泣，則未能自弄璋，明暫時示男女之別耳。○箋“芾者”至“黃朱”。○正義曰：箋以經言“室家君王”，則有諸侯與天子而同言朱芾，故云“天子純朱，諸侯黃朱”也。芾從裳色，祭時服纁裳，故芾用朱赤。但芾所以明尊卑，雖同色而有差降。《乾鑿度》以為，天子之朝朱芾，諸侯之朝赤芾，朱深於赤，故《困封》注云“朱深雲赤”是矣。此論諸侯，則王子或封畿內，或以功德外封，皆為諸侯也。而文同朱芾，明對文則朱赤深淺有異，散之則皆謂之朱。故天子純朱，明其深也；諸侯黃朱，明其淺也。舉其大色，皆得為朱芾也。" }
      - { type: j, text: "乃生女子，載寢之地，載衣之裼，載弄之瓦。犭軍，褓也。瓦，紡塼也。箋雲：臥於地，卑之也。褓，夜衣也。明當主於內事。紡塼，習其一有所事也。○裼，他計反，《韓詩》作“褅”，音同。褓音保。齊人名小兒被為褅。紡，芳罔反。塼音專，本又作“專”。" }
      - { type: j, text: "無非無儀，唯酒食是議，無父母詒罹。婦人質無威儀也。罹，憂也。箋雲：儀，善也。婦人無所專於家事，有非非婦人也，有善亦非婦人也。婦人之事，惟議酒食爾，無遺父母之憂。○詒，本又作“貽”，以之反，遺也。罹，本又作“離”，力馳反。遺，唯季反。" }
      - { type: z, text: "“乃生女”至“詒罹”。○毛以為，前夢虺蛇，今乃生女子矣。生訖，則寢臥之於地以卑之，則又衣著之以褓衣，則玩弄之以紡塼，習其所有事也。此女子至其長大，為行謹慎，無所非法，質少文飾，又無威儀，唯酒事。於是乃謀議之，無於父母而遺之以憂也。若婦禮不謹，為夫所出，是遺父母以憂。言能恭謹，不遺父母憂也。○鄭唯以儀為善為異。餘同。○傳“裼，褓也。瓦，紡塼”。○正義曰：《書傳》說成王之幼雲：“在襁褓，褓，縛兒被也。”故箋以為夜衣。以璋是全器，則瓦非瓦礫而已，故云“瓦，紡塼”。婦人所用瓦唯紡塼而已，故知也。毛以裳為下飾，則褓不必主內事。侯苞雲：“示之方也。”明褓制方令女子方正事人之義。○傳“婦人質”無“威儀”。○正義曰：以婦人少所交接，故云“質無威儀”，謂無如丈夫折旋揖讓棣棣之多。其婦容之儀則有之矣，故《東山》曰“九十其儀”，言多儀也。○箋“儀善”至“非婦人”。○正義曰：“儀，善”，《釋詁》文也。言有非有善，皆非婦人之事者，婦人，從人者也。家事統於尊，善惡非婦人之所有耳。不謂婦人之行無善惡也。" }
      - { type: j, text: "《斯干》九章，四章章七句，五章章五句。" }
      - { type: j, text: "《無羊》，宣王考牧也。厲王之時，牧人之職廢。宣王始興而復之，至此而成，謂復先王牛羊之數。" }
      - { type: z, text: "《無羊》四章，章八句。○正義曰：作《無羊》詩者，言宣王考牧也。謂宣王之時，牧人稱職，牛羊復先王之數，牧事有成，故言考牧也。經四章，言牛羊得所，牧人善牧，又以吉夢獻王，國家將有休慶，皆考牧之事也。○箋“厲王”至“之數”。○正義曰：此美其新成，則往前嘗廢，故本厲王之時。今宣王始興而復之，選牧官得人，牛羊蕃息，至此而牧事成功，故謂之考牧。又解成者，正謂復先王牛羊之數也。言至此而成者，初立牧官，數未即復，至此作詩之時而成也。王者牛羊之數，經典無文，亦應有其大數。今言考牧，故知復之也。《周禮》有牧人下士六人，府一人，史二人，徒六十人。又有牛人、羊人、犬人、雞人，唯無豕人。鄭以為，豕屬司空，《冬官》亡，故不見。《夏官》又有牧師，主養馬。此宣王所考，則應六畜皆備。此獨言牧人者，《牧人·注》雲“牧人，養牲於野田者”。其職曰：“掌牧六牲而阜蕃其物。”則六畜皆牧人主養，其餘牛人、羊人之徒，各掌其事，以供官之所須，則取於牧人，非放牧者也。《羊人職》曰：“若牧人無牲，則受布於司馬，買牲而供之。”是取於牧人之事也。唯馬是國之大用，特立牧師、圉人，使別掌之。則蓋擬駕用者屬牧師，令生息者屬牧人，故牧人有六牲。鄭雲：“六牲，謂牛、馬、羊、豕、犬、雞。”是牧人亦養馬也。此詩主美放牧之事，經有“牧人乃夢”，故唯言牧人也。牧人六畜皆牧，此詩唯言牛羊者，經稱“爾牲則具”，主以祭祀為重，馬則祭之所用者，少豕犬雞則比牛羊為卑，故特舉牛羊，以為美也。" }
      - { type: j, text: "誰謂爾無羊？三百維群。誰謂爾無牛？九十其犉。黃牛黑唇曰犉。箋雲：爾，女也。女，宣王也。宣王復古之牧法，汲汲於其數，故歌此詩以解之也。誰謂女無羊？今乃三百頭為一群。誰謂女無牛？今乃犉者九十頭。言其多矣，足如古也。○犉，本又作“”，而純反。爾羊來思，其角濈濈。聚其角而息濈濈然。箋雲：言此者，美畜產得其所。○濈，本又作“<角咠>”，亦作“戢”，莊立反。畜，許又反。" }
      - { type: j, text: "爾牛來思，其耳溼溼。呞而動，其耳溼溼然。○溼，始立反，又屍立反，又處立反。呞，本又作“<齒司>”，亦作“齝”，醜之反，一音初之反，郭注《爾雅》雲：“食已，復出嚼之也。今江東呼齝為齥，音漏，洩也。”" }
      - { type: z, text: "傳“黃牛黑唇曰犉”。○正義曰：《釋畜》雲：“黑唇曰犉。”傳言黃牛者，以言黑唇，明不與深色同。而牛之黃者眾，故知是黃牛也。某氏亦曰：“黃牛黑唇曰犉。”○箋“女宣王”至“如古”。○正義曰：以“誰謂”是發問之辭。“三百維群”，“九十其犉”，是報答之語，故知宣王汲汲於其數。詩人歌此以解之也。羊三百頭為群，故一群有三百，不知其群之有多少也。犉者九十頭，直知犉者有九十，亦不知其不犉者之數也。以一群三百，直犉者九十，則羊多牛眾，故云足如古之法也。" }
      - { type: j, text: "或降於阿，或飲於池，或寢或訛。訛，動也。箋雲：言此者，美其無所驚畏也。○訛，五戈反，又五何反，《韓詩》作“譌”。譌，覺也。爾牧來思，何蓑何笠，或負其餱。何，揭也。蓑所以備雨，笠所以御暑。箋雲：言此者，美牧人寒暑飲食有備。○何，何可反，又音河。下及注同。蓑，素戈反，草衣也。笠音立。餱音侯。揭音竭，又其謁反。" }
      - { type: j, text: "三十維物，爾牲則具。異毛色者三十也。箋雲：牛羊之色異者三十，則女之祭祀，索則有之。○索，色白反。" }
      - { type: z, text: "傳“蓑所以”至“御暑”。○正義曰：蓑唯備雨之物，笠則元以御暑，兼可御雨，故《良耜》傳曰：“笠所以御暑雨也。”《既夕禮》亦有蓑笠，注俱以為御雨。不以笠御暑者，以彼蓑笠同瑽車所載。槁車，潦車也，為雨而設，故不同也。○傳“異毛色者三十”。○正義曰：經言“三十維物”，則每色之物皆有三十，謂青赤黃白黑，毛色別異者各三十也。祭祀之牲，當用五方之色，故箋雲：“汝之祭祀，索則有之。”" }
      - { type: j, text: "爾牧來思，以薪以蒸，以雌以雄。箋雲：此言牧人有餘力，則取薪蒸、搏禽獸以來歸也。粗曰薪，細曰蒸。○蒸，之烝反。搏音博。下同。亦作“捕”，音步。爾羊來思，矜矜兢兢，不騫不崩。矜矜兢兢，以言堅彊也。騫，虧也。崩，群疾也。○兢，其冰反。騫，起虔反。" }
      - { type: j, text: "麾之以肱，畢來既升。肱，臂也。升，升入牢也。箋雲：此言擾馴從人意也。○麾，毀皮反。肱，古弘反。馴音巡，又常遵反。" }
      - { type: z, text: "傳“騫，虧”。○正義曰：定本亦然。《集註》“虧”作“曜”。" }
      - { type: j, text: "牧人乃夢，眾維魚矣，旐維旟矣。箋雲：牧人乃夢見人眾相與捕魚，又夢見旐與旟。占夢之官得而獻之於宣王，將以佔國事也。○旐音兆。旟音餘。大人佔之：“眾維魚矣，實維豐年；陰陽和則魚眾多矣。箋雲：魚者，庶人之所以養也。今人眾相與捕魚，則是歲熟相供養之祥也。《易·中孚卦》曰：“豚魚吉。”○養，羊亮反。下同。供，九用反。" }
      - { type: j, text: "旐維旟矣，室家溱溱。”溱溱，眾也。旐旟所以聚眾也。箋雲：溱溱，子孫眾多也。○溱，側巾反。" }
      - { type: z, text: "“牧人”至“溱溱”。○正義曰：牧人所牧既服，乃復為王興夢。夢見眾人維相與捕魚矣，又夢見旐維旟矣。牧人既為此夢，以告占夢之官，占夢之官又獻之於王。王乃令以大夫占夢之法佔之。夢見眾維魚矣者，“實維豐年”，是歲熟相供養之祥。夢見旐維旟矣者，“室家溱溱”，是男女眾多之象。歲熟民滋，是國之休慶也。○箋“牧人”至“國事”。○正義曰：知者，以下雲“大人佔之”，是王使佔之，明有所由，得達於王。夢事，夢官所掌，明本牧人既作此夢，不知吉凶，以問占夢之官。占夢知其為國之祥，故獻之也。《占夢職》曰：“歲終獻吉夢於王。王拜受之。”彼所獻者，謂天下臣民有為國夢者，其官得而獻之，非占夢之官身自夢也，故知此以占夢之官得而獻之。所夢是年豐歲熟民眾之祥，故知以佔國事。○傳“陰陽”至“眾多”。○正義曰：以《魚麗》之義言之，太平而萬物盛多，故知陰陽和。經言“眾維魚矣”，乃謂捕魚者多。傳雲魚多者，言由魚多，故捕者眾，解人共捕之意。○箋“魚者”至“豚魚吉”。○正義曰：魚者，庶民之所以養者，以庶民不得殺犬豕，維捕魚以食之，是所以養也。歲穀不熟，則無以相養。會眾人相與捕魚，則是歲熟相供養之祥。引《易·中孚卦》曰“豚魚吉”者，《孟子》曰：“七十者可以食雞豚。”豚魚俱是養老之物，故引之以證魚可供養也。彼注云：“三辰在亥，亥為豕，爻失正，故變而從小，名言豚耳。四辰在醜，醜為鱉蟹。鱉蟹，魚之微者，爻得正，故變而從大，名言魚耳。三體兌，兌為澤，四、上值天淵，二、五皆坎爻，坎為水，二侵澤，則豚利五，亦以水灌淵則魚利。豚魚以喻小民也，而為明君賢臣恩意所供養，故吉。”如彼注意，以豚魚喻小民，與此乖者，以《彖》雲“豚魚吉”，信及豚魚，喻則澤及民。觀《彖》為說，此則斷章取義，故不同也。" }
      - { type: j, text: "《無羊》四章，章八句。" }
      - { type: j, text: "《鴻雁之什》十篇，三十二章，二百三十句。" }
