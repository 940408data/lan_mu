aboutHtml: |-
  <h2>關於此卷</h2>
  <p>《論語集注》為朱熹《四書章句集注》之一，此卷以宋刻本版式數字重刻，半葉八行、行十六字、注文雙行二十五字。</p>
  <p>卷之八收「衛靈公第十五」四十一章、「季氏第十六」十四章，經注全帙；底本為本地《四書章句集注》電子本，訛奪處參對校本校正，篇內章次、注文分合悉依朱子本。</p>
