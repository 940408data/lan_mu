labels:
  - page: 507
    col: 1
    role: j
    text: 孟子卷第十四朱熹集注
  - page: 507
    col: 2
    role: title
    text: 盡心章句下
  - page: 507
    col: 3
    role: z
    text: 凡三十八章
  - page: 507
    col: 4
    role: j
    text: 孟子曰不仁哉梁惠王也仁者以其所
  - page: 507
    col: 5
    role: j
    text: 愛及其所不愛不仁者以其所不愛及
  - page: 507
    col: 6
    role: j
    text: 其所愛
  - page: 507
    col: 7
    role: j
    text: 親親而仁民仁民而愛物所謂以其
  - page: 507
    col: 8
    role: j
    text: 所愛及其所不愛也
  - page: 508
    col: 1
    role: j
    text: 公孫丑曰何謂也梁惠王以土地之故
  - page: 508
    col: 2
    role: j
    text: 糜爛其民而戰之大敗將復之恐不能
  - page: 508
    col: 3
    role: j
    text: 勝故驅其所愛子弟以殉之是之謂以
  - page: 508
    col: 4
    role: j
    text: 其所不愛及其所愛也
  - page: 508
    col: 5
    role: z
    text: 梁惠王以下孟子答辭也糜爛其民
  - page: 508
    col: 6
    role: z
    text: 使之戰鬬糜爛其血肉也復之復戰
  - page: 508
    col: 7
    role: z
    text: 也子弟謂太子申也以土地之故及
  - page: 508
    col: 8
    role: z
    text: 其民以民之故及其子皆以其所不
  - page: 508
    col: 9
    role: z
    text: 愛及其所愛也○此承前篇之末三
  - page: 508
    col: 10
    role: z
    text: 章之意言仁人之恩自内及外不仁
  - page: 508
    col: 11
    role: z
    text: 之禍由䟽逮親
  - page: 508
    col: 12
    role: j
    text: 孟子曰春秋無義戰彼善於此則有之
  - page: 508
    col: 13
    role: j
    text: 矣
  - page: 508
    col: 14
    role: z
    text: 春秋每書諸侯戰伐之事必加譏貶
  - page: 508
    col: 15
    role: z
    text: 以著其擅興之罪無有以爲合於義
  - page: 508
    col: 16
    role: z
    text: 而許之者但就中彼善於此者則有
  - page: 509
    col: 1
    role: j
    text: 之如召陵之師之類是也
  - page: 509
    col: 2
    role: j
    text: 征者上伐下也敵國不相征也
  - page: 509
    col: 3
    role: j
    text: 征所以正人也諸侯有罪則天子討
  - page: 509
    col: 4
    role: j
    text: 而正之此春秋所以無義戰也
  - page: 509
    col: 5
    role: j
    text: 孟子曰盡信書則不如無書
  - page: 509
    col: 6
    role: j
    text: 程子曰載事之辭容有重稱而過其
  - page: 509
    col: 7
    role: j
    text: 實者學者當識其義而已苟執於辭
  - page: 509
    col: 8
    role: j
    text: 則時或有害於義不如無書之愈也
  - page: 509
    col: 9
    role: j
    text: 吾於武成取二三策而已矣
  - page: 509
    col: 10
    role: j
    text: 武成周書篇名武王伐紂歸而記事
  - page: 509
    col: 11
    role: j
    text: 之書也策竹簡也取其二三策之言
  - page: 509
    col: 12
    role: j
    text: 其餘不可盡信也○程子曰取其奉
  - page: 509
    col: 13
    role: z
    text: 天伐暴之意反政施仁之法而已
  - page: 509
    col: 14
    role: j
    text: 仁人無敵於天下以至仁伐至不仁而
  - page: 509
    col: 15
    role: j
    text: 何其血之流杵也
  - page: 509
    col: 16
    role: z
    text: 杵春杵也或作鹵楯也武臣言武王
  - page: 510
    col: 1
    role: z
    text: 伐紂紂之前徒倒戈攻于後以北血
  - page: 510
    col: 2
    role: z
    text: 流漂杵孟子言此則其不可信者然
  - page: 510
    col: 3
    role: z
    text: 書本意乃謂商人自相殺非謂武王
  - page: 510
    col: 4
    role: z
    text: 殺之也孟子之設是言懼後世之惑
  - page: 510
    col: 5
    role: z
    text: 且長不仁之心耳
  - page: 510
    col: 6
    role: j
    text: 孟子曰有人曰我善為陳我善為戰大
  - page: 510
    col: 7
    role: j
    text: 罪也
  - page: 510
    col: 8
    role: z
    text: 陳去聲○制行伍曰陳交兵曰戰
  - page: 510
    col: 9
    role: j
    text: 國君好仁天下無敵焉
  - page: 510
    col: 10
    role: z
    text: 好去聲
  - page: 510
    col: 11
    role: j
    text: 南面而征北狄怨東面而征西夷怨曰
  - page: 510
    col: 12
    role: j
    text: 奚為後我
  - page: 510
    col: 13
    role: z
    text: 此引湯之事以明之解見前篇
  - page: 510
    col: 14
    role: j
    text: 武王之伐殷也革車三百兩虎賁三千
  - page: 510
    col: 15
    role: j
    text: 人
  - page: 510
    col: 16
    role: z
    text: 兩去聲賁音奔○又以武王之事明
  - page: 511
    col: 1
    role: z
    text: 之也兩車數一車兩輪也千書序作
  - page: 511
    col: 2
    role: z
    text: 百
  - page: 511
    col: 3
    role: j
    text: 王曰無畏寧爾也非敵百姓也若崩厥
  - page: 511
    col: 4
    role: j
    text: 角稽首
  - page: 511
    col: 5
    role: z
    text: 書泰誓文與此小異孟子之意當云
  - page: 511
    col: 6
    role: z
    text: 王謂商人曰無畏我也我來伐紂本
  - page: 511
    col: 7
    role: z
    text: 為安寧汝非敵商之百姓也於是商
  - page: 511
    col: 8
    role: z
    text: 人稽首至地如角之崩也
  - page: 511
    col: 9
    role: j
    text: 征之為言正也各欲正已也焉用戰
  - page: 511
    col: 10
    role: z
    text: 焉於虔反○民為暴君所虐皆欲仁
  - page: 511
    col: 11
    role: z
    text: 者來正已之國也
  - page: 511
    col: 12
    role: j
    text: 孟子曰梓匠輪輿能與人規矩不能使
  - page: 511
    col: 13
    role: j
    text: 人巧
  - page: 511
    col: 14
    role: z
    text: 尹氏曰規矩法度可告者也巧則在
  - page: 511
    col: 15
    role: z
    text: 其人雖大匠亦末如之何也已蓋下
  - page: 511
    col: 16
    role: z
    text: 學可以言傳上達必由心悟莊周所
  - page: 512
    col: 1
    role: z
    text: 論斷輪之意蓋如此
  - page: 512
    col: 2
    role: j
    text: 孟子曰舜之飯糗茹草也若將終身焉
  - page: 512
    col: 3
    role: j
    text: 及其爲天子也被袗衣鼓琴二女果若
  - page: 512
    col: 4
    role: j
    text: 固有之
  - page: 512
    col: 5
    role: z
    text: 飯上聲糗去乆反茹音汝袗之忍反
  - page: 512
    col: 6
    role: z
    text: 果說文作婐烏果反○飯食也糗乾
  - page: 512
    col: 7
    role: z
    text: 糒也茹亦食也袗畫衣也二女堯二
  - page: 512
    col: 8
    role: z
    text: 女也果女侍也言聖人之心不以貧
  - page: 512
    col: 9
    role: z
    text: 賤而有慕於外不以冨貴而有動於
  - page: 512
    col: 10
    role: z
    text: 中隨遇而安無預於己所性分定故
  - page: 512
    col: 11
    role: z
    text: 也
  - page: 512
    col: 12
    role: j
    text: 孟子曰吾今而後知殺人親之重也殺
  - page: 512
    col: 13
    role: j
    text: 人之父人亦殺其父殺人之兄人亦殺
  - page: 512
    col: 14
    role: j
    text: 其兄然則非自殺之也一間耳
  - page: 512
    col: 15
    role: z
    text: 間去聲○言吾今然後知者必有所
  - page: 512
    col: 16
    role: z
    text: 爲而感發也一間者我往彼來間一
  - page: 513
    col: 1
    role: j
    text: 人耳其實與自害其親無異也○范
  - page: 513
    col: 2
    role: j
    text: 氏曰知此則愛敬人之親人亦愛敬
  - page: 513
    col: 3
    role: j
    text: 其親矣
  - page: 513
    col: 4
    role: j
    text: 孟子曰古之爲關也將以禦暴
  - page: 513
    col: 5
    role: z
    text: 譏察非常
  - page: 513
    col: 6
    role: j
    text: 今之爲關也將以爲暴
  - page: 513
    col: 7
    role: j
    text: 征稅出入○范氏曰古之耕者什一
  - page: 513
    col: 8
    role: j
    text: 後世或收太半之稅此以賦歛爲暴
  - page: 513
    col: 9
    role: j
    text: 也文王之囿與民同之齊宣王之囿
  - page: 513
    col: 10
    role: j
    text: 爲阱國中此以園囿爲暴也後世爲
  - page: 513
    col: 11
    role: j
    text: 暴不止於關若使孟子用於諸侯必
  - page: 513
    col: 12
    role: j
    text: 行文王之政凡此之類皆不終日而
  - page: 513
    col: 13
    role: z
    text: 改也
  - page: 513
    col: 14
    role: j
    text: 孟子曰身不行道不行於妻子使人不
  - page: 513
    col: 15
    role: j
    text: 以道不能行於妻子
  - page: 513
    col: 16
    role: j
    text: 身不行道者以行言之不行者道不
  - page: 514
    col: 1
    role: j
    text: 行也使人不以道者以事言之不能
  - page: 514
    col: 2
    role: j
    text: 行者令不行也
  - page: 514
    col: 3
    role: j
    text: 孟子曰周于利者凶年不能殺周于德
  - page: 514
    col: 4
    role: j
    text: 者邪世不能亂
  - page: 514
    col: 5
    role: z
    text: 周足也言積之厚則用有餘
  - page: 514
    col: 6
    role: j
    text: 孟子曰好名之人能讓千乘之國苟非
  - page: 514
    col: 7
    role: j
    text: 其人簞食豆羹見於色
  - page: 514
    col: 8
    role: z
    text: 好乘食皆去聲見音現○好名之人
  - page: 514
    col: 9
    role: j
    text: 矯情干譽是以能遜千乘之國然若
  - page: 514
    col: 10
    role: j
    text: 本非能輕富貴之人則於得失之小
  - page: 514
    col: 11
    role: j
    text: 者反不覺其真情之發見矣蓋觀人
  - page: 514
    col: 12
    role: j
    text: 不於其所勉而於其所忽然後可以
  - page: 514
    col: 13
    role: j
    text: 見其所安之實也
  - page: 514
    col: 14
    role: j
    text: 孟子曰不信仁賢則國空虛
  - page: 514
    col: 15
    role: z
    text: 空虛言若無人然
  - page: 514
    col: 16
    role: j
    text: 無禮義則上下亂
  - page: 515
    col: 1
    role: z
    text: 禮義所以辨上下定民志
  - page: 515
    col: 2
    role: z
    text: 無政事則財用不足
  - page: 515
    col: 3
    role: z
    text: 生之無道取之無度用之無節故也
  - page: 515
    col: 4
    role: z
    text: ○尹氏曰三者以仁賢為本無仁賢
  - page: 515
    col: 5
    role: z
    text: 則禮義政事處之皆不以其道矣
  - page: 515
    col: 6
    role: j
    text: 孟子曰不仁而得國者有之矣不仁而
  - page: 515
    col: 7
    role: j
    text: 得天下未之有也
  - page: 515
    col: 8
    role: z
    text: 言不仁之人騁其私智可以盜千乗
  - page: 515
    col: 9
    role: z
    text: 之國而不可以得丘民之心○鄒氏
  - page: 515
    col: 10
    role: z
    text: 曰自秦以來不仁而得天下者有矣
  - page: 515
    col: 11
    role: z
    text: 然皆一再傳而失之猶不得也所謂
  - page: 515
    col: 12
    role: z
    text: 得天下者必如三代而後可
  - page: 515
    col: 13
    role: j
    text: 孟子曰民為貴社稷次之君為輕
  - page: 515
    col: 14
    role: z
    text: 社土神稷穀神建國則立壇壝以祀
  - page: 515
    col: 15
    role: z
    text: 之蓋國以民為本社稷亦為民而立
  - page: 515
    col: 16
    role: z
    text: 而君之尊又係於二者之存亡故其
  - page: 516
    col: 1
    role: z
    text: 輕重如此
  - page: 516
    col: 2
    role: j
    text: 是故得乎丘民而為天子得乎天子為
  - page: 516
    col: 3
    role: j
    text: 諸侯得乎諸侯為大夫
  - page: 516
    col: 4
    role: j
    text: 丘民田野之民至微賤也然得其心
  - page: 516
    col: 5
    role: j
    text: 則天下歸之天子至尊貴也而得其
  - page: 516
    col: 6
    role: j
    text: 心者不過為諸侯耳是民為重也
  - page: 516
    col: 7
    role: j
    text: 諸侯危社稷則變置
  - page: 516
    col: 8
    role: z
    text: 諸侯無道將使社稷為人所滅則當
  - page: 516
    col: 9
    role: z
    text: 更立賢君是君輕於社稷也
  - page: 516
    col: 10
    role: j
    text: 犧牲既成粢盛既潔祭祀以時然而旱
  - page: 516
    col: 11
    role: j
    text: 乾水溢則變置社稷
  - page: 516
    col: 12
    role: j
    text: 盛音成○祭祀不失禮而土穀之神
  - page: 516
    col: 13
    role: j
    text: 不能為民禦災捍患則毀其壇壝而
  - page: 516
    col: 14
    role: j
    text: 更置之亦年不順成八蜡不通之意
  - page: 516
    col: 15
    role: z
    text: 是社稷雖重於君而輕於民也
  - page: 516
    col: 16
    role: j
    text: 孟子曰聖人百世之師也伯夷柳下惠
  - page: 517
    col: 1
    role: j
    text: 是也故聞伯夷之風者頑夫廉懦夫有
  - page: 517
    col: 2
    role: j
    text: 立志聞柳下惠之風者薄夫敦鄙夫寛
  - page: 517
    col: 3
    role: j
    text: 奮乎百丗之上句百丗之下聞者莫不
  - page: 517
    col: 4
    role: j
    text: 興起也非聖人而能若是乎而况於親
  - page: 517
    col: 5
    role: j
    text: 炙之者乎
  - page: 517
    col: 6
    role: z
    text: 興起感動奮發也親炙親近而熏炙
  - page: 517
    col: 7
    role: z
    text: 之也餘見前篇
  - page: 517
    col: 8
    role: j
    text: 孟子曰仁也者人也合而言之道也
  - page: 517
    col: 9
    role: j
    text: 仁者人之所以爲人之理也然仁理
  - page: 517
    col: 10
    role: j
    text: 也人物也以仁之理合於人之身而
  - page: 517
    col: 11
    role: j
    text: 言之乃所謂道者也○程子曰中庸
  - page: 517
    col: 12
    role: j
    text: 所謂率性之謂道是也○或曰外國
  - page: 517
    col: 13
    role: j
    text: 本人也之下有義也者冝也禮也者
  - page: 517
    col: 14
    role: j
    text: 履也智也者知也信也者實也凡二
  - page: 517
    col: 15
    role: j
    text: 十字今按如此則理極分明然未詳
  - page: 517
    col: 16
    role: j
    text: 其是否也
  - page: 518
    col: 1
    role: j
    text: 孟子曰孔子之去魯曰遲遲吾行也去
  - page: 518
    col: 2
    role: j
    text: 父母國之道也去齊接淅而行去他國
  - page: 518
    col: 3
    role: j
    text: 之交也
  - page: 518
    col: 4
    role: z
    text: 重出
  - page: 518
    col: 5
    role: j
    text: 孟子曰君子之戹於陳蔡之閒無上下
  - page: 518
    col: 6
    role: j
    text: 之交也
  - page: 518
    col: 7
    role: z
    text: 君子孔子也戹與厄同君臣皆惡無
  - page: 518
    col: 8
    role: z
    text: 所與交也
  - page: 518
    col: 9
    role: j
    text: 貉稽曰稽大不理於口
  - page: 518
    col: 10
    role: z
    text: 貉音陌○趙氏曰貉姓稽名爲衆口
  - page: 518
    col: 11
    role: z
    text: 所訕理賴也今按漢書無俚方言亦
  - page: 518
    col: 12
    role: z
    text: 訓賴
  - page: 518
    col: 13
    role: j
    text: 孟子曰無傷也士憎兹多口
  - page: 518
    col: 14
    role: z
    text: 趙氏曰爲士者益多爲衆口所訕按
  - page: 518
    col: 15
    role: z
    text: 此則憎當從土今本皆從心蓋傳寫
  - page: 518
    col: 16
    role: z
    text: 之誤
  - page: 519
    col: 1
    role: j
    text: 詩云憂心悄悄慍于群小孔子也肆不
  - page: 519
    col: 2
    role: j
    text: 殄厥慍亦不殞厥聞文王也
  - page: 519
    col: 3
    role: z
    text: 詩邶風柏舟及大雅緜之篇也悄悄
  - page: 519
    col: 4
    role: z
    text: 憂貌慍怒也本言衛之仁人見怒於
  - page: 519
    col: 5
    role: z
    text: 群小孟子以爲孔子之事可以當之
  - page: 519
    col: 6
    role: z
    text: 肆發語辭殞墜也問聲問也本言太
  - page: 519
    col: 7
    role: z
    text: 王事昆夷雖不能殄絶其慍怒亦不
  - page: 519
    col: 8
    role: z
    text: 自墜其聲問之美孟子以爲文王之
  - page: 519
    col: 9
    role: z
    text: 事可以當之○尹氏曰言人顧自處
  - page: 519
    col: 10
    role: z
    text: 如何盡其在我者而已
  - page: 519
    col: 11
    role: j
    text: 孟子曰賢者以其昭昭使人昭昭今以
  - page: 519
    col: 12
    role: j
    text: 其昏昏使人昭昭
  - page: 519
    col: 13
    role: z
    text: 昭昭明也昏昏闇也○尹氏曰大學
  - page: 519
    col: 14
    role: z
    text: 之道在自昭明德而施於天下國家
  - page: 519
    col: 15
    role: z
    text: 其有不順者寡矣
  - page: 519
    col: 16
    role: j
    text: 孟子謂高子曰山徑之蹊間句介然用
  - page: 520
    col: 1
    role: j
    text: 之而成路句爲閒不用則茅塞之矣今
  - page: 520
    col: 2
    role: j
    text: 茅塞子之心矣
  - page: 520
    col: 3
    role: z
    text: 介音戛○徑小路也蹊人行處也介
  - page: 520
    col: 4
    role: z
    text: 然倏然之頃也用由也路大路也爲
  - page: 520
    col: 5
    role: z
    text: 閒少頃也茅塞茅草生而塞之也言
  - page: 520
    col: 6
    role: z
    text: 理義之心不可少有閒斷也
  - page: 520
    col: 7
    role: j
    text: 高子曰禹之聲尚文王之聲
  - page: 520
    col: 8
    role: z
    text: 尚加尚也○豐氏曰言禹之樂過於
  - page: 520
    col: 9
    role: z
    text: 王之樂
  - page: 520
    col: 10
    role: j
    text: 孟子曰何以言之曰以追蠡
  - page: 520
    col: 11
    role: z
    text: 追音堆蠡音禮○豐氏曰追鐘紐也
  - page: 520
    col: 12
    role: z
    text: 周禮所謂旋蟲是也蠡者齧木蟲也
  - page: 520
    col: 13
    role: z
    text: 言禹時鐘在者鐘紐如蟲齧而欲絕
  - page: 520
    col: 14
    role: z
    text: 蓋用之者多而文王之鐘不然是以
  - page: 520
    col: 15
    role: z
    text: 知禹之樂過於文王之樂也
  - page: 520
    col: 16
    role: j
    text: 曰是奚足哉城門之軌兩馬之力與
  - page: 521
    col: 1
    role: z
    text: 與平聲○豐氏曰奚足言此何足以
  - page: 521
    col: 2
    role: z
    text: 知之也軌車轍迹也兩馬一車所駕
  - page: 521
    col: 3
    role: z
    text: 也城中之涂容九軌車可散行故其
  - page: 521
    col: 4
    role: z
    text: 轍迹淺城門惟容一車車皆由之故
  - page: 521
    col: 5
    role: z
    text: 其轍迹深蓋日乆車多所致非一車
  - page: 521
    col: 6
    role: z
    text: 兩馬之力能使之然也言禹在文王
  - page: 521
    col: 7
    role: z
    text: 前千餘年故鐘乆而細絶文王之鐘
  - page: 521
    col: 8
    role: z
    text: 則未乆而細全不可以此而議優劣
  - page: 521
    col: 9
    role: z
    text: 也○此章文義本不可曉舊說相承
  - page: 521
    col: 10
    role: z
    text: 如此而豐氏差明白故今存之亦未
  - page: 521
    col: 11
    role: z
    text: 知其是否也
  - page: 521
    col: 12
    role: j
    text: 齊饑陳臻曰國人皆以夫子將復爲發
  - page: 521
    col: 13
    role: j
    text: 棠殆不可復
  - page: 521
    col: 14
    role: z
    text: 復扶又反○先時齊國嘗饑孟子勸
  - page: 521
    col: 15
    role: z
    text: 王發棠邑之倉以振貧窮至此又饑
  - page: 521
    col: 16
    role: z
    text: 陳臻問言齊人望孟子復勸王發棠
  - page: 522
    col: 1
    role: z
    text: 而又自言恐其不可也
  - page: 522
    col: 2
    role: j
    text: 孟子曰是爲馮婦也晉人有馮婦者善
  - page: 522
    col: 3
    role: j
    text: 搏虎卒爲善士則之野有衆逐虎虎負
  - page: 522
    col: 4
    role: j
    text: 嵎莫之敢攖望見馮婦趨而迎之馮婦
  - page: 522
    col: 5
    role: j
    text: 攘臂下車衆皆悅之其爲士者笑之
  - page: 522
    col: 6
    role: z
    text: 手執曰搏卒爲善士後能改行爲善
  - page: 522
    col: 7
    role: z
    text: 也之適也負依也山曲曰嵎嬰觸也
  - page: 522
    col: 8
    role: z
    text: 笑之笑其不知止也疑此時齊王已
  - page: 522
    col: 9
    role: j
    text: 不能用孟子而孟子亦將去矣故其
  - page: 522
    col: 10
    role: j
    text: 言如此
  - page: 522
    col: 11
    role: j
    text: 孟子曰口之於味也目之於色也耳之
  - page: 522
    col: 12
    role: j
    text: 於聲也鼻之於臭也四枝之於安佚也
  - page: 522
    col: 13
    role: j
    text: 性也有命焉君子不謂性也
  - page: 522
    col: 14
    role: j
    text: 程子曰五者之欲性也然有分不能
  - page: 522
    col: 15
    role: j
    text: 皆如其願則是命也不可謂我性之
  - page: 522
    col: 16
    role: j
    text: 所有而求必得之也愚按不能皆如
  - page: 523
    col: 1
    role: z
    text: 其願不止爲貧賤蓋雖富貴之極亦
  - page: 523
    col: 2
    role: z
    text: 有品節限制則是亦有命也
  - page: 523
    col: 3
    role: j
    text: 仁之於父子也義之於君臣也禮之於
  - page: 523
    col: 4
    role: j
    text: 賔主也智之於賢者也聖人之於天道
  - page: 523
    col: 5
    role: j
    text: 也命也有性焉君子不謂命也
  - page: 523
    col: 6
    role: z
    text: 程子曰仁義禮智天道在人則賦於
  - page: 523
    col: 7
    role: z
    text: 命者所禀有厚薄清濁然而性善可
  - page: 523
    col: 8
    role: z
    text: 學而盡故不謂之命也○張子曰晏
  - page: 523
    col: 9
    role: z
    text: 嬰智矣而不知仲尼是非命耶愚按
  - page: 523
    col: 10
    role: z
    text: 所禀者厚而清則其仁之於父子也
  - page: 523
    col: 11
    role: z
    text: 至義之於君臣也盡禮之於賔主也
  - page: 523
    col: 12
    role: z
    text: 恭智之於賢否也哲聖人之於天道
  - page: 523
    col: 13
    role: z
    text: 也無不脗合而純亦不已焉薄而濁
  - page: 523
    col: 14
    role: z
    text: 則反是是皆所謂命也或曰者當作
  - page: 523
    col: 15
    role: z
    text: 否人衍字更詳之○愚聞之師曰此
  - page: 523
    col: 16
    role: z
    text: 二條者皆性之所有而命於天者
  - page: 524
    col: 1
    role: z
    text: 也然世之人以前五者爲性雖有不
  - page: 524
    col: 2
    role: z
    text: 得而必欲求之以後五者爲命一有
  - page: 524
    col: 3
    role: z
    text: 不至則不復致力故孟子各就其重
  - page: 524
    col: 4
    role: z
    text: 處言之以伸此而抑彼也張子所謂
  - page: 524
    col: 5
    role: z
    text: 養則付命於天道則責成於己其言
  - page: 524
    col: 6
    role: z
    text: 約而盡矣
  - page: 524
    col: 7
    role: j
    text: 浩生不害問曰樂正子何人也孟子曰
  - page: 524
    col: 8
    role: j
    text: 善人也信人也
  - page: 524
    col: 9
    role: z
    text: 趙氏曰浩生姓不害名齊人也
  - page: 524
    col: 10
    role: j
    text: 何謂善何謂信
  - page: 524
    col: 11
    role: z
    text: 不害問也
  - page: 524
    col: 12
    role: j
    text: 曰可欲之謂善
  - page: 524
    col: 13
    role: z
    text: 天下之理其善者必可欲其惡者必
  - page: 524
    col: 14
    role: z
    text: 可惡其爲人也可欲而不可惡則可
  - page: 524
    col: 15
    role: z
    text: 謂善人矣
  - page: 524
    col: 16
    role: j
    text: 有諸己之謂信
  - page: 525
    col: 1
    role: z
    text: 凡所謂善皆實有之如惡惡臭如好
  - page: 525
    col: 2
    role: z
    text: 好色是則可謂信人矣張子曰志
  - page: 525
    col: 3
    role: z
    text: 仁無惡之謂善誠善於身之謂信
  - page: 525
    col: 4
    role: j
    text: 充實之謂美
  - page: 525
    col: 5
    role: z
    text: 力行其善至於充滿而積實則美在
  - page: 525
    col: 6
    role: z
    text: 其中而無待於外矣
  - page: 525
    col: 7
    role: j
    text: 充實而有光輝之謂大
  - page: 525
    col: 8
    role: z
    text: 和順積中而英華發外美在其中而
  - page: 525
    col: 9
    role: z
    text: 暢於四支發於事業則德業至盛而
  - page: 525
    col: 10
    role: z
    text: 不可加矣
  - page: 525
    col: 11
    role: j
    text: 大而化之之謂聖
  - page: 525
    col: 12
    role: z
    text: 大而能化使其大者泯然無復可見
  - page: 525
    col: 13
    role: z
    text: 之迹則不思不勉從容中道而非人
  - page: 525
    col: 14
    role: z
    text: 力之所能為矣張子曰大大可為也
  - page: 525
    col: 15
    role: z
    text: 化不可為也在熟之而已矣
  - page: 525
    col: 16
    role: j
    text: 聖而不可知之之謂神
  - page: 526
    col: 1
    role: z
    text: 程子曰聖不可知謂聖之至妙人所
  - page: 526
    col: 2
    role: z
    text: 不能測非聖人之上又有一等神
  - page: 526
    col: 3
    role: z
    text: 也
  - page: 526
    col: 4
    role: j
    text: 樂正子二之中四之下也
  - page: 526
    col: 5
    role: z
    text: 蓋在善信之閒觀其從於子敖則其
  - page: 526
    col: 6
    role: z
    text: 有諸己者或未嘗見也○張子曰顏
  - page: 526
    col: 7
    role: z
    text: 淵樂正子皆知好仁矣樂正子志仁
  - page: 526
    col: 8
    role: z
    text: 無惡而不致於學所以但爲善人信
  - page: 526
    col: 9
    role: z
    text: 人而已顏子好學不倦合仁與智具
  - page: 526
    col: 10
    role: z
    text: 體聖人獨未至聖人之止耳○程子
  - page: 526
    col: 11
    role: z
    text: 曰士之所難者在有諸己而已能有
  - page: 526
    col: 12
    role: z
    text: 諸己則居之安資之深而美且大可
  - page: 526
    col: 13
    role: z
    text: 以馴致矣徒知可欲之善而若存若
  - page: 526
    col: 14
    role: z
    text: 亡而已則能不受變於俗者鮮矣○
  - page: 526
    col: 15
    role: z
    text: 尹氏曰自可欲之善至於聖而不可
  - page: 526
    col: 16
    role: z
    text: 知之神上下一理擴充之至於神則
  - page: 527
    col: 1
    role: z
    text: 可得而名矣
  - page: 527
    col: 2
    role: j
    text: 孟子曰逃墨必歸於楊逃楊必歸於儒
  - page: 527
    col: 3
    role: j
    text: 歸斯受之而已矣
  - page: 527
    col: 4
    role: z
    text: 墨氏務外而不情楊氏太簡而近實
  - page: 527
    col: 5
    role: z
    text: 故其反正之漸大略如此歸斯受之
  - page: 527
    col: 6
    role: z
    text: 者閔其陷溺之久而取其悔悟之新
  - page: 527
    col: 7
    role: z
    text: 也
  - page: 527
    col: 8
    role: j
    text: 今之與楊墨辯者如追放豚既入其笠
  - page: 527
    col: 9
    role: j
    text: 又從而招之
  - page: 527
    col: 10
    role: z
    text: 放豚放逸之豕豚也笠蘭也招罥也
  - page: 527
    col: 11
    role: z
    text: 罥其足也言彼既來歸而又追咎其
  - page: 527
    col: 12
    role: z
    text: 既往之失也○此章見聖賢之於異
  - page: 527
    col: 13
    role: z
    text: 端距之甚嚴而於其來歸待之甚恕
  - page: 527
    col: 14
    role: z
    text: 距之嚴故人知彼說之為邪待之恕
  - page: 527
    col: 15
    role: z
    text: 故人知此道之可反仁之至義之盡
  - page: 527
    col: 16
    role: z
    text: 也
  - page: 528
    col: 1
    role: j
    text: 孟子曰有布縷之征粟米之征力役之
  - page: 528
    col: 2
    role: j
    text: 征君子用其一緩其二用其二而民有
  - page: 528
    col: 3
    role: j
    text: 殍用其三而父子離
  - page: 528
    col: 4
    role: z
    text: 征賦之法歲有常數然布縷取之於
  - page: 528
    col: 5
    role: z
    text: 夏粟米取之於秋力役取之於冬當
  - page: 528
    col: 6
    role: z
    text: 各以其時若并取之則民力有所不
  - page: 528
    col: 7
    role: z
    text: 堪矣今兩稅三限之法亦此意也○
  - page: 528
    col: 8
    role: z
    text: 尹氏曰言民爲邦本取之無度則其
  - page: 528
    col: 9
    role: z
    text: 國危矣
  - page: 528
    col: 10
    role: j
    text: 孟子曰諸侯之寳三土地人民政事寳
  - page: 528
    col: 11
    role: j
    text: 珠玉者殃必及身
  - page: 528
    col: 12
    role: z
    text: 尹氏曰言寳得其寳者安寳失其寳
  - page: 528
    col: 13
    role: z
    text: 者危
  - page: 528
    col: 14
    role: j
    text: 盆成括仕於齊孟子曰死矣盆成括出
  - page: 528
    col: 15
    role: j
    text: 成括見殺門人問曰夫子何以知其將
  - page: 528
    col: 16
    role: j
    text: 見殺曰其爲人也小有才未聞君子之
  - page: 529
    col: 1
    role: j
    text: 大道也則足以殺其軀而已矣
  - page: 529
    col: 2
    role: j
    text: 盆成姓括名也恃才妄作所以取禍
  - page: 529
    col: 3
    role: j
    text: ○徐氏曰君子道其常而已括有死
  - page: 529
    col: 4
    role: j
    text: 之道焉設使幸而獲免孟子之言猶
  - page: 529
    col: 5
    role: j
    text: 信也
  - page: 529
    col: 6
    role: j
    text: 孟子之滕館於上宫有業屨於牖上館
  - page: 529
    col: 7
    role: j
    text: 人求之弗得
  - page: 529
    col: 8
    role: z
    text: 館舎也上宫別宫名業屨織之有次
  - page: 529
    col: 9
    role: z
    text: 業而未成者蓋館人所作置之牖上
  - page: 529
    col: 10
    role: z
    text: 而失之也
  - page: 529
    col: 11
    role: j
    text: 或問之曰若是乎從者之廋也曰子以
  - page: 529
    col: 12
    role: j
    text: 是爲竊屨來與曰殆非也夫子之設科
  - page: 529
    col: 13
    role: j
    text: 也往者不追來者不距苟以是心至斯
  - page: 529
    col: 14
    role: j
    text: 受之而已矣
  - page: 529
    col: 15
    role: z
    text: 從爲去聲與平聲夫子如字舊讀爲
  - page: 529
    col: 16
    role: z
    text: 扶余者非○或問之者問於孟子也
  - page: 530
    col: 1
    role: z
    text: 廢匿也言子之從者乃匿人之物如
  - page: 530
    col: 2
    role: z
    text: 此乎孟子答之而或人自悟其失因
  - page: 530
    col: 3
    role: z
    text: 言此從者固不爲竊屨而來但夫子
  - page: 530
    col: 4
    role: z
    text: 設置科條以待學者苟以向道之心
  - page: 530
    col: 5
    role: z
    text: 而來則受之耳雖夫子亦不能保其
  - page: 530
    col: 6
    role: z
    text: 往也門人取其言有合於聖賢之指
  - page: 530
    col: 7
    role: z
    text: 故記之
  - page: 530
    col: 8
    role: j
    text: 孟子曰人皆有所不忍達之於其所忍
  - page: 530
    col: 9
    role: j
    text: 仁也人皆有所不爲達之於其所爲義
  - page: 530
    col: 10
    role: j
    text: 也
  - page: 530
    col: 11
    role: z
    text: 惻隱羞惡之心人皆有之故莫不有
  - page: 530
    col: 12
    role: z
    text: 所不忍不爲此仁義之端也然以氣
  - page: 530
    col: 13
    role: z
    text: 質之偏物欲之蔽則於他事或有不
  - page: 530
    col: 14
    role: z
    text: 能者但擴所能達之於所不能則無
  - page: 530
    col: 15
    role: z
    text: 非仁義矣
  - page: 530
    col: 16
    role: j
    text: 人能充無欲害人之心而仁不可勝用
  - page: 531
    col: 1
    role: j
    text: 也人能充無穿踰之心而義不可勝用
  - page: 531
    col: 2
    role: j
    text: 也
  - page: 531
    col: 3
    role: z
    text: 勝平聲○充滿也穿穿穴踰踰墻皆
  - page: 531
    col: 4
    role: z
    text: 爲盜之事也能推所不忍以達於所
  - page: 531
    col: 5
    role: z
    text: 忍則能滿其無欲害人之心而無不
  - page: 531
    col: 6
    role: z
    text: 仁矣能推其所不爲以達於所爲則
  - page: 531
    col: 7
    role: z
    text: 能滿其無穿踰之心而無不義矣
  - page: 531
    col: 8
    role: j
    text: 人能充無受爾汝之實無所往而不爲
  - page: 531
    col: 9
    role: j
    text: 義也
  - page: 531
    col: 10
    role: z
    text: 此申說上文充無穿踰之心之意也
  - page: 531
    col: 11
    role: z
    text: 蓋爾汝人所輕賤之稱人雖或有所
  - page: 531
    col: 12
    role: z
    text: 貪昧隱忍而甘受之者然其中心必
  - page: 531
    col: 13
    role: j
    text: 有慚忿而不肯受之之實人能即此而
  - page: 531
    col: 14
    role: z
    text: 推之使其充滿無所虧缺則無適而
  - page: 531
    col: 15
    role: z
    text: 非義矣
  - page: 531
    col: 16
    role: j
    text: 士未可以言而言是以言餂之也可以
  - page: 532
    col: 1
    role: j
    text: 言而不言是以不言餂之也是皆穿踰
  - page: 532
    col: 2
    role: j
    text: 之類也
  - page: 532
    col: 3
    role: z
    text: 餂音忝○餂探取之也今人以舌取
  - page: 532
    col: 4
    role: z
    text: 物曰餂即此意也便佞隱默皆有意
  - page: 532
    col: 5
    role: z
    text: 探取於人是亦穿踰之類然其事隱
  - page: 532
    col: 6
    role: z
    text: 微人所忽易故特舉以見例明必推
  - page: 532
    col: 7
    role: z
    text: 無穿踰之心以達於此而悉去之然
  - page: 532
    col: 8
    role: z
    text: 後為能充其無穿踰之心也
  - page: 532
    col: 9
    role: j
    text: 孟子曰言近而指遠者善言也守約而
  - page: 532
    col: 10
    role: j
    text: 施博者善道也君子之言也不下帶而
  - page: 532
    col: 11
    role: j
    text: 道存焉
  - page: 532
    col: 12
    role: z
    text: 施去聲○古人視不下於帶則帶之
  - page: 532
    col: 13
    role: z
    text: 上乃目前常見至近之處也舉目前
  - page: 532
    col: 14
    role: z
    text: 之近事而至理存焉所以為言近而
  - page: 532
    col: 15
    role: z
    text: 指遠也
  - page: 532
    col: 16
    role: j
    text: 君子之守脩其身而天下平
  - page: 533
    col: 1
    role: z
    text: 此所謂守約而施博也
  - page: 533
    col: 2
    role: j
    text: 人病舍其田而芸人之田所求於人者
  - page: 533
    col: 3
    role: j
    text: 重而所以自任者輕
  - page: 533
    col: 4
    role: z
    text: 舍音捨○此言不約守而務博施之
  - page: 533
    col: 5
    role: z
    text: 病
  - page: 533
    col: 6
    role: j
    text: 孟子曰堯舜性者也湯武反之也
  - page: 533
    col: 7
    role: z
    text: 性者得全於天無所汙壞不假脩爲
  - page: 533
    col: 8
    role: z
    text: 聖之至也反之者脩爲以復其性
  - page: 533
    col: 9
    role: z
    text: 而至於聖人也○程子曰性之反之
  - page: 533
    col: 10
    role: z
    text: 古未有此語蓋自孟子發之○呂氏
  - page: 533
    col: 11
    role: z
    text: 曰無意而安行性也有意利行而至
  - page: 533
    col: 12
    role: z
    text: 於無意復性者也堯舜不失其性湯
  - page: 533
    col: 13
    role: z
    text: 武善反其性及其成功則一也
  - page: 533
    col: 14
    role: j
    text: 動容周旋中禮者盛德之至也哭死而
  - page: 533
    col: 15
    role: j
    text: 哀非爲生者也經德不回非以干祿也
  - page: 533
    col: 16
    role: j
    text: 言語必信非以正行也
  - page: 534
    col: 1
    role: z
    text: 行去聲○曲折無不中禮乃其盛德
  - page: 534
    col: 2
    role: z
    text: 之至自然而中而非有意於中也經
  - page: 534
    col: 3
    role: z
    text: 常也回曲也三者亦皆自然而然非
  - page: 534
    col: 4
    role: z
    text: 有意而爲之也皆聖人之事性之之
  - page: 534
    col: 5
    role: z
    text: 德也
  - page: 534
    col: 6
    role: j
    text: 君子行法以俟命而已矣
  - page: 534
    col: 7
    role: z
    text: 法者天理之當然者也君子行之而
  - page: 534
    col: 8
    role: z
    text: 吉凶禍福有所不計蓋雖未至於自
  - page: 534
    col: 9
    role: z
    text: 然而已非有所爲而爲矣此反之之
  - page: 534
    col: 10
    role: z
    text: 事董子所謂正其義不謀其利明其
  - page: 534
    col: 11
    role: z
    text: 道不計其功正此意也○程子曰動
  - page: 534
    col: 12
    role: z
    text: 容周旋中禮者盛德之至行法以俟
  - page: 534
    col: 13
    role: z
    text: 命者朝聞道夕死可矣之意也○吕
  - page: 534
    col: 14
    role: z
    text: 氏曰法由此立命由此出聖人也行
  - page: 534
    col: 15
    role: z
    text: 法以俟命君子也聖人性之君子所
  - page: 534
    col: 16
    role: z
    text: 以復其性
  - page: 535
    col: 1
    role: j
    text: 孟子曰說大人則藐之勿視其巍巍然
  - page: 535
    col: 2
    role: j
    text: 說音稅藐音眇○趙氏曰大人當時
  - page: 535
    col: 3
    role: j
    text: 尊貴者也藐輕之也巍巍冨貴髙顯
  - page: 535
    col: 4
    role: j
    text: 之貌藐焉而不畏之則志意舒展言
  - page: 535
    col: 5
    role: z
    text: 語得盡也
  - page: 535
    col: 6
    role: j
    text: 堂髙數仞榱題數尺我得志弗爲也食
  - page: 535
    col: 7
    role: j
    text: 前方丈侍妾數百人我得志弗爲也般
  - page: 535
    col: 8
    role: j
    text: 樂飲酒驅騁田獵後車千乗我得志弗
  - page: 535
    col: 9
    role: j
    text: 爲也在彼者皆我所不爲也在我者皆
  - page: 535
    col: 10
    role: j
    text: 古之制也吾何畏彼哉
  - page: 535
    col: 11
    role: j
    text: 榱楚危反般音盤樂音洛乗去聲○
  - page: 535
    col: 12
    role: j
    text: 榱桷也題頭也食前方丈饌食列於
  - page: 535
    col: 13
    role: j
    text: 前者方一丈也此皆其所謂巍巍然
  - page: 535
    col: 14
    role: j
    text: 者我雖得志有所不爲而所守者皆
  - page: 535
    col: 15
    role: j
    text: 古聖賢之法則彼之巍巍者何足道
  - page: 535
    col: 16
    role: j
    text: 哉○楊氏曰孟子此章以已之長方
  - page: 536
    col: 1
    role: z
    text: 人之短猶有此等氣象在孔子則無
  - page: 536
    col: 2
    role: z
    text: 此矣
  - page: 536
    col: 3
    role: j
    text: 孟子曰養心莫善於寡欲其為人也寡
  - page: 536
    col: 4
    role: j
    text: 欲雖有不存焉者寡矣其為人也多欲
  - page: 536
    col: 5
    role: j
    text: 雖有存焉者寡矣
  - page: 536
    col: 6
    role: z
    text: 欲如口鼻耳目四支之欲雖人之所
  - page: 536
    col: 7
    role: z
    text: 不能無然多而不節未有不失其本
  - page: 536
    col: 8
    role: z
    text: 心者學者所當深戒也○程子曰所
  - page: 536
    col: 9
    role: z
    text: 欲不必沉溺只有所向便是欲
  - page: 536
    col: 10
    role: j
    text: 曾皙嗜羊棗而曾子不忍食羊棗
  - page: 536
    col: 11
    role: z
    text: 羊棗實小黑而圓又謂之羊矢棗曾
  - page: 536
    col: 12
    role: z
    text: 子以父嗜之父没之後食必思親故
  - page: 536
    col: 13
    role: z
    text: 不忍食也
  - page: 536
    col: 14
    role: j
    text: 公孫丑問曰膾炙與羊棗孰美孟子曰
  - page: 536
    col: 15
    role: j
    text: 膾炙哉公孫丑曰然則曾子何為食膾
  - page: 536
    col: 16
    role: j
    text: 炙而不食羊棗曰膾炙所同也羊棗所
  - page: 537
    col: 1
    role: j
    text: 獨也諱名不諱姓姓所同也名所獨也
  - page: 537
    col: 2
    role: z
    text: 肉聶而切之爲膾炙炙肉也
  - page: 537
    col: 3
    role: j
    text: 萬章問曰孔子在陳曰盍歸乎來吾黨
  - page: 537
    col: 4
    role: j
    text: 之士狂簡進取不忘其初孔子在陳何
  - page: 537
    col: 5
    role: j
    text: 思魯之狂士
  - page: 537
    col: 6
    role: z
    text: 盍何不也狂簡謂志大而略於事進
  - page: 537
    col: 7
    role: z
    text: 取謂求望高遠不忘其初謂不能改
  - page: 537
    col: 8
    role: z
    text: 其舊也此語與論語小異
  - page: 537
    col: 9
    role: j
    text: 孟子曰孔子不得中道而與之必也狂
  - page: 537
    col: 10
    role: j
    text: 獧乎狂者進取獧者有所不爲也孔子
  - page: 537
    col: 11
    role: j
    text: 豈不欲中道哉不可必得故思其次也
  - page: 537
    col: 12
    role: z
    text: 獧音絹○不得中道至有所不爲據
  - page: 537
    col: 13
    role: z
    text: 論語亦孔子之言然則孔子字下當
  - page: 537
    col: 14
    role: z
    text: 有曰字論語道作行獧作狷有所不
  - page: 537
    col: 15
    role: z
    text: 爲者知恥自好不爲不善之人也孔
  - page: 537
    col: 16
    role: z
    text: 子豈不欲中道以下孟子言也
  - page: 538
    col: 1
    role: j
    text: 敢問何如斯可謂狂矣
  - page: 538
    col: 2
    role: z
    text: 萬章問
  - page: 538
    col: 3
    role: j
    text: 曰如琴張曾皙牧皮者孔子之所謂狂
  - page: 538
    col: 4
    role: j
    text: 矣
  - page: 538
    col: 5
    role: z
    text: 琴張名牢字子張子桑戸死琴張臨
  - page: 538
    col: 6
    role: z
    text: 其喪而歌事見莊子雖未必盡然要
  - page: 538
    col: 7
    role: z
    text: 必有近似者曾皙見前篇季武子死
  - page: 538
    col: 8
    role: z
    text: 曾皙倚其門而歌事見檀弓又言志
  - page: 538
    col: 9
    role: z
    text: 異乎三子者之撰事見論語牧皮未
  - page: 538
    col: 10
    role: z
    text: 詳
  - page: 538
    col: 11
    role: j
    text: 何以謂之狂也
  - page: 538
    col: 12
    role: z
    text: 萬章問
  - page: 538
    col: 13
    role: j
    text: 曰其志嘐嘐然曰古之人古之人夷考
  - page: 538
    col: 14
    role: j
    text: 其行而不掩焉者也
  - page: 538
    col: 15
    role: z
    text: 嘐火交反行去聲○嘐嘐志大言大
  - page: 538
    col: 16
    role: z
    text: 也重言古之人見其動輒稱之不一
  - page: 539
    col: 1
    role: j
    text: 稱而已也夷平也掩覆也言平考其
  - page: 539
    col: 2
    role: j
    text: 行則不能覆其言也○程子曰曾皙
  - page: 539
    col: 3
    role: j
    text: 言志而夫子與之蓋與聖人之志同
  - page: 539
    col: 4
    role: j
    text: 便是堯舜氣象也特行有不掩焉耳
  - page: 539
    col: 5
    role: j
    text: 此所謂狂也
  - page: 539
    col: 6
    role: j
    text: 狂者又不可得欲得不屑不潔之士而
  - page: 539
    col: 7
    role: j
    text: 與之是獧也是又其次也
  - page: 539
    col: 8
    role: j
    text: 此因上文所引遂解所以思得獧者
  - page: 539
    col: 9
    role: j
    text: 之意狂有志者也獧有守者也有志
  - page: 539
    col: 10
    role: j
    text: 者能進於道有守者不失其身屑潔
  - page: 539
    col: 11
    role: z
    text: 也
  - page: 539
    col: 12
    role: j
    text: 孔子曰過我門而不入我室我不憾焉
  - page: 539
    col: 13
    role: j
    text: 者其惟鄉原乎鄉原德之賊也曰何如
  - page: 539
    col: 14
    role: j
    text: 斯可謂之鄉原矣
  - page: 539
    col: 15
    role: j
    text: 鄉人非有識者原與愿同荀子原愨
  - page: 539
    col: 16
    role: j
    text: 字皆讀作愿謂謹愿之人也故鄉里
  - page: 540
    col: 1
    role: z
    text: 所謂愿人謂之鄉原孔子以其似德
  - page: 540
    col: 2
    role: z
    text: 而非德故以為德之賊過門不入而
  - page: 540
    col: 3
    role: z
    text: 不恨之以其不見親就為幸深惡而
  - page: 540
    col: 4
    role: z
    text: 痛絕之也萬章又引孔子之言而問
  - page: 540
    col: 5
    role: z
    text: 也
  - page: 540
    col: 6
    role: j
    text: 曰何以是嘐嘐也言不顧行行不顧言
  - page: 540
    col: 7
    role: j
    text: 則曰古之人古之人行何為踽踽涼涼
  - page: 540
    col: 8
    role: j
    text: 生斯世也為斯世也善斯可矣閹然媚
  - page: 540
    col: 9
    role: j
    text: 於世也者是鄉原也
  - page: 540
    col: 10
    role: z
    text: 行去聲踽其禹反閹音奄○踽踽獨
  - page: 540
    col: 11
    role: z
    text: 行不進之貌涼涼薄也不見親厚於
  - page: 540
    col: 12
    role: z
    text: 人也鄉原譏狂者曰何用如此嘐嘐
  - page: 540
    col: 13
    role: z
    text: 然行不掩其言而徒每事必稱古人
  - page: 540
    col: 14
    role: z
    text: 耶又譏狷者曰何必如此踽踽涼涼
  - page: 540
    col: 15
    role: z
    text: 無所親厚哉人既生於此世則當但
  - page: 540
    col: 16
    role: z
    text: 為此世之人使當世之人皆以為善
  - page: 541
    col: 1
    role: z
    text: 則可矣此鄉原之志也閹如奄人之
  - page: 541
    col: 2
    role: z
    text: 奄閉藏之意也媚求悅於人也孟子
  - page: 541
    col: 3
    role: z
    text: 言此深自閉藏以求親媚於世是鄉
  - page: 541
    col: 4
    role: z
    text: 原之行也
  - page: 541
    col: 5
    role: j
    text: 萬章曰一鄉皆稱原人焉無所往而不
  - page: 541
    col: 6
    role: j
    text: 為原人孔子以為德之賊何哉
  - page: 541
    col: 7
    role: z
    text: 愿亦謹厚之稱而孔子以為德之賊
  - page: 541
    col: 8
    role: z
    text: 故萬章疑之
  - page: 541
    col: 9
    role: j
    text: 曰非之無舉也刺之無刺也同乎流俗
  - page: 541
    col: 10
    role: j
    text: 合乎汙世居之似忠信行之似廉潔衆
  - page: 541
    col: 11
    role: j
    text: 皆悅之自以為是而不可與入堯舜之
  - page: 541
    col: 12
    role: j
    text: 道故曰德之賊也
  - page: 541
    col: 13
    role: z
    text: 吕侍講曰言此等之人欲非之則無
  - page: 541
    col: 14
    role: z
    text: 可舉欲刺之則無可刺也流俗者風
  - page: 541
    col: 15
    role: z
    text: 俗頹靡如水之下流衆莫不然也汙
  - page: 541
    col: 16
    role: z
    text: 濁也非忠信而似忠信非廉潔而似
  - page: 542
    col: 1
    role: z
    text: 廉潔
  - page: 542
    col: 2
    role: j
    text: 孔子曰惡似而非者惡莠恐其亂苗也
  - page: 542
    col: 3
    role: j
    text: 惡佞恐其亂義也惡利口恐其亂信也
  - page: 542
    col: 4
    role: j
    text: 惡鄭聲恐其亂樂也惡紫恐其亂朱也
  - page: 542
    col: 5
    role: j
    text: 惡鄉原恐其亂德也
  - page: 542
    col: 6
    role: z
    text: 惡去聲莠音有○孟子又引孔子之
  - page: 542
    col: 7
    role: z
    text: 言以明之莠似苗之草也佞才智之
  - page: 542
    col: 8
    role: z
    text: 稱其言似義而非義也利口多言而
  - page: 542
    col: 9
    role: z
    text: 不實者也鄭聲淫樂也樂正樂也紫
  - page: 542
    col: 10
    role: z
    text: 間色朱正色也鄉原不狂不獧人皆
  - page: 542
    col: 11
    role: z
    text: 以爲善有似乎中道而實非也故恐
  - page: 542
    col: 12
    role: z
    text: 其亂德
  - page: 542
    col: 13
    role: j
    text: 君子反經而已矣經正則庶民興庶民
  - page: 542
    col: 14
    role: j
    text: 興斯無邪慝矣
  - page: 542
    col: 15
    role: z
    text: 反復也經常也萬世不易之常道也
  - page: 542
    col: 16
    role: z
    text: 興興起於善也邪慝如鄉原之屬是
  - page: 543
    col: 1
    role: z
    text: 也世衰道微大經不正故人人得為
  - page: 543
    col: 2
    role: z
    text: 異說以濟其私而邪慝並起不可勝
  - page: 543
    col: 3
    role: z
    text: 正君子於此亦復其常道而已常道
  - page: 543
    col: 4
    role: z
    text: 既復則民興於善而是非明白無所
  - page: 543
    col: 5
    role: z
    text: 回互雖有邪慝不足以惑之矣○尹
  - page: 543
    col: 6
    role: z
    text: 氏曰君子取夫狂狷者蓋以狂者志
  - page: 543
    col: 7
    role: z
    text: 大而可與進道狷者有所不為而可
  - page: 543
    col: 8
    role: z
    text: 與有為也所惡於鄉原而欲痛絕之
  - page: 543
    col: 9
    role: z
    text: 者為其似是而非惑人之深也絕之
  - page: 543
    col: 10
    role: z
    text: 之術無他焉亦曰反經而已矣
  - page: 543
    col: 11
    role: j
    text: 孟子曰由堯舜至於湯五百有餘歲若
  - page: 543
    col: 12
    role: j
    text: 禹皋陶則見而知之若湯則聞而知之
  - page: 543
    col: 13
    role: z
    text: 趙氏曰五百歲而聖人出天道之常
  - page: 543
    col: 14
    role: z
    text: 然亦有遲速不能正五百年故言有
  - page: 543
    col: 15
    role: z
    text: 餘也○尹氏曰知謂知其道也
  - page: 543
    col: 16
    role: j
    text: 由湯至於文王五百有餘歲若伊尹萊
  - page: 544
    col: 1
    role: j
    text: 朱則見而知之若文王則聞而知之
  - page: 544
    col: 2
    role: z
    text: 趙氏曰萊朱湯賢臣或曰即仲虺也
  - page: 544
    col: 3
    role: z
    text: 爲湯左相
  - page: 544
    col: 4
    role: j
    text: 由文王至於孔子五百有餘歲若太公
  - page: 544
    col: 5
    role: j
    text: 王散宜生則見而知之若孔子則聞而
  - page: 544
    col: 6
    role: j
    text: 知之
  - page: 544
    col: 7
    role: z
    text: 散素亶反。散氏宜生名文王賢臣
  - page: 544
    col: 8
    role: z
    text: 也。子貢曰文武之道未墜於地在
  - page: 544
    col: 9
    role: z
    text: 人賢者識其大者不賢者識其小者
  - page: 544
    col: 10
    role: z
    text: 莫不有文武之道焉夫子焉不學此
  - page: 544
    col: 11
    role: z
    text: 所謂聞而知之也
  - page: 544
    col: 12
    role: j
    text: 由孔子而來至於今百有餘歲去聖人
  - page: 544
    col: 13
    role: j
    text: 之世若此其未遠也近聖人之居若此
  - page: 544
    col: 14
    role: j
    text: 其甚也然而無有乎爾則亦無有乎爾
  - page: 544
    col: 15
    role: z
    text: 林氏曰孟子言孔子至今時未遠鄒
  - page: 544
    col: 16
    role: z
    text: 魯相去又近然而已無有見而知之
  - page: 545
    col: 1
    role: z
    text: 者矣則五百餘歲之後又豈復有聞
  - page: 545
    col: 2
    role: z
    text: 而知之者乎愚按此言雖若不敢自
  - page: 545
    col: 3
    role: z
    text: 謂己得其傳而憂後世遂失其傳然
  - page: 545
    col: 4
    role: z
    text: 乃所以自見其有不得辭者而又以
  - page: 545
    col: 5
    role: z
    text: 見夫天理民彝不可泯滅百世之下
  - page: 545
    col: 6
    role: z
    text: 必將有神會而心得之者耳故於篇
  - page: 545
    col: 7
    role: z
    text: 終歷序羣聖之統而終之以此所以
  - page: 545
    col: 8
    role: z
    text: 明其傳之有在而又以俟後聖於無
  - page: 545
    col: 9
    role: z
    text: 窮也其指深哉○有宋元豐八年河
  - page: 545
    col: 10
    role: z
    text: 南程顥伯淳卒潞公文彥博題其墓
  - page: 545
    col: 11
    role: z
    text: 曰明道先生而其弟頤正叔序之曰
  - page: 545
    col: 12
    role: z
    text: 周公没聖人之道不行孟軻死聖人
  - page: 545
    col: 13
    role: z
    text: 之學不傳道不行百世無善治學不
  - page: 545
    col: 14
    role: z
    text: 傳千載無眞儒無善治士猶得以明
  - page: 545
    col: 15
    role: z
    text: 夫善治之道以淑諸人以傳諸後無
  - page: 545
    col: 16
    role: z
    text: 眞儒則天下貿貿焉莫知所之人欲
  - page: 546
    col: 1
    role: z
    text: 肆而天理滅矣先生生乎千四百年
  - page: 546
    col: 2
    role: z
    text: 之後得不傳之學於遺經以興起斯
  - page: 546
    col: 3
    role: z
    text: 文爲己任辨異端闢邪說使聖人之
  - page: 546
    col: 4
    role: z
    text: 道煥然復明於世蓋自孟子之後一
  - page: 546
    col: 5
    role: z
    text: 人而已然學者於道不知所向則孰
  - page: 546
    col: 6
    role: z
    text: 知斯人之爲功不知所至則孰知斯
  - page: 546
    col: 7
    role: z
    text: 名之稱情也哉
  - page: 546
    col: 8
    role: j
    text: 孟子卷第十四
