sections:
  - id: 孝文本紀
    name: 孝文本紀
    blocks:
      - type: j
        text: 孝文皇帝高祖中子也高祖十一年春巳破陳豨軍定代地立為代王都中都太后薄氏子即位十七年高后八年七月高后崩九月諸吕吕産等欲為亂以危劉氏大臣共誅之謀召立代王事在吕后語中丞相陳平太尉周勃等使人迎代王代王問左右郎中令張武等張武等議曰漢大臣皆故高帝時大將習兵多謀詐此其屬意非止此也特畏高帝吕太后威
      - type: j
        text: 呼士皆左袒為劉氏叛諸吕卒以滅之此乃天授非人力也今大臣雖欲為變百姓弗為使其黨寧能專一邪方今内有朱虚東牟之親外畏吴楚淮南琅邪齊代之彊方今高帝子獨淮南王與大王大王又長賢聖仁孝聞於天下故大臣因天下之心而欲迎立大王大王勿疑也代王報太后計之猶與未定卜之龜卦兆得大横占曰大横庚庚余為天王夏啓以光代王曰寡人固已為王矣又何王卜人曰所謂天王
      - type: j
        text: 而議之遂馳入代邸羣臣從至丞相陳平太尉周勃大將軍陳武御史大夫張蒼宗正劉郢朱虛侯劉章東牟侯劉興居典客劉揭皆再拜言曰子弘等皆非孝惠帝子不當奉宗廟臣謹請與隂安侯列侯頃王后與琅邪王宗室大臣列侯吏二千石議曰大王高帝長子宜為高帝嗣願大王即天子位代王曰奉高帝宗廟重事也寡人不佞不足以稱宗廟願請楚王計宜者寡人不敢當羣臣皆伏固請代王西鄉讓者
      - type: j
        text: 書曰聞者諸吕用事擅權謀為大逆欲以危劉氏宗廟賴将相列侯宗室大臣誅之皆伏其辜朕初即位其赦天下賜民爵一級女子百戸牛酒酺五日孝文皇帝元年十月庚戌徙立故琅邪王澤為燕王辛亥皇帝即阼謁高廟右丞相平徙為左丞相太尉勃為右丞相大将軍灌嬰為太尉諸吕所奪齊楚故地皆復與之壬子遣車騎将軍薄昭迎皇太后于代皇帝曰吕産自置為相國吕禄為上将軍擅矯遣灌
      - type: j
        text: 以禁暴而率善人也今犯法已論而使毋罪之父母妻子同産坐之及為收帑朕甚不取其議之有司皆曰民不能自治故為法以禁之相坐坐收所以累其心使重犯法所從來遠矣如故便上曰朕聞法正則民慤罪當則民從且夫牧民而導之善者吏也其既不能導又以不正之法罪之是反害於民為暴者也何以禁之朕未見其便其熟計之有司皆曰陛下加大惠德甚盛非臣等所及也請奉詔書除收帑諸相
      - type: j
        text: 臣多賢及有德義者若舉有德以陪朕之不能終是社稷之靈天下之福也今不選舉焉而曰必子人其以朕為忘賢有德者而專於子非所以憂天下也朕甚不取也有司皆固請曰古者殷周有國治安皆千餘歲古之有天下者莫不長焉用此道也立嗣必子所從來遠矣高帝親率士大夫始平天下建諸侯為帝者太祖諸侯王及列侯始受國者皆亦為其國祖子孫繼嗣世世弗絕天下之大義也故高帝設之以
      - type: j
        text: 臣之誅諸吕迎朕朕狐疑皆止朕唯中尉宋昌勸朕朕以得保奉宗廟已尊昌為衛将軍其封昌為壮武侯諸從朕六人官皆至九卿上曰列侯從高帝入蜀漢中者六十八人皆益封各三百戸故吏二千石以上從高帝潁川守尊等十人食邑六百戸淮陽守申屠嘉等十人五百戸衛尉定等十人四百戸封淮南王舅父趙兼為周陽侯齊王舅父駟鈞為清郭侯秋封故常山丞相蔡兼為樊侯人或說右丞相曰君本
      - type: j
        text: 治之人主不德布政不均則天示之以菑以誡不治乃十一月晦日有食之適見于天菑孰大焉朕獲保宗廟以微眇之身託于兆民君王之上天下治亂在朕一人唯二三執政猶吾股肱也朕下不能理育羣生上以累三光之明其不德大矣令至其悉思朕之過失及知見思之所不及白以告朕及舉賢良方正能直言極諫者以匡朕之不逮因各飭其任職務省繇費以便民朕既不能遠德故憪然念外人之有非
      - type: j
        text: 原王子揖為梁王上曰古之治天下朝有進善之旌誹謗之木所以通治道而来諫者今法有誹謗妖言之罪是使衆臣不敢盡情而上無由聞過失也将何以来遠方之賢良其除之民或祝詛上以相約結而後相謾吏以為大逆其有他言而吏又以為誹謗此細民之愚無知抵死朕甚不取自今以来有犯此者勿聽治九月初與郡國守相為銅虎符竹使符三年十月丁酉晦日有食之十一月上曰前日計遣
      - type: j
        text: 也其發邉吏騎八萬五千詣高奴遣丞相潁隂侯灌嬰擊匈奴匈奴去發中尉材官屬衛將軍軍長安辛卯帝自甘泉之高奴因幸太原見故羣臣皆賜之舉功行賞諸民里賜牛酒復晉陽中都民三留游太原十餘日濟北王興居聞帝之代欲徃擊胡乃反發兵欲襲滎陽於是詔罷丞相兵遣棘蒲侯陳武為大將軍將十萬徃擊之祁侯賀為將軍軍滎陽七月辛亥帝自太原至長安廼詔有司曰濟北王背徳反上
      - type: j
        text: 病死上憐之後十六年追尊淮南王長諡為厲王立其子三人為淮南王衡山王廬江王十三年夏上曰盖聞天道禍自怨起而福繇徳興百官之非宜由朕躬今祕祝之官移過于下以彰吾之不徳朕甚不取其除之五月齊太倉令淳于公有罪當刑詔獄逮徙繫長安太倉公無男有女五人太倉公将行會逮罵其女曰生子不生男有緩急非有益也其少女緹縈自傷泣乃随其父至長安上書曰妾
      - type: j
        text: 為善而道毋由也朕甚憐之夫刑至斷支體刻肌膚終身不息何其楚痛而不德也豈稱為民父母之意哉其除肉刑上曰農天下之本務莫大焉今勤身從事而有租稅之賦是為本末者毋以異其於勸農之道未備其除田之租稅十四年冬匈奴謀入邊為寇攻朝那塞殺北地都尉卬上乃遣三將軍軍隴西北地上郡中尉周舍為衛將軍郎中令張武為車騎將軍軍渭北車千乘騎卒
      - type: j
        text: 百姓朕甚愧之夫以朕不德而躬享獨美其福百姓不與焉是重吾不德其令祠官致敬毋有所祈是時北平侯張蒼為丞相方明律歷魯人公孫臣上書陳終始傳五德事言方今土德時土德應黃龍見當改正朔服色制度天子下其事與丞相議丞相推以為今水德始明正十月上黑事以為其言非是請罷之十五年黃龍見成紀天子乃復召魯公孫臣以為博士申明土德事於是上乃下詔曰有異物之神見于
      - type: j
        text: 後二年上曰朕既不明不能遠德是以使方外之國或不寧息夫四荒之外不安其生封畿之内勤勞不處二者之咎皆自於朕之德薄而不能遠達也間者累年匈奴並暴邉境多殺吏民邉臣兵吏又不能諭吾内志以重吾不德也夫久結難連兵中外之國将何以自寧今朕夙興夜寐勤勞天下憂苦萬民為之怛惕不安未嘗一日忘於心故遣使者冠盖相望結軼於道以諭朕意於單于今單于反古之道計社稷
      - type: j
        text: 民民得賣爵孝文帝從代來即位二十三年宮室苑囿狗馬服御無所增益有不便輒弛以利民嘗欲作露臺召匠計之直百金上曰百金中民十家之產吾奉先帝宮室常恐羞之何以臺為上常衣綈衣所幸慎夫人令衣不得曳地幃帳不得文繡以示敦朴為天下先治霸陵皆以瓦器不得以金銀銅錫為飾不治墳欲為省毋煩民南越王尉佗自立為武帝然上召貴尉佗兄弟以德報之佗遂去帝稱臣與匈奴和
      - type: j
        text: 業重服以傷生吾甚不取且朕既不德無以佐百姓今崩又使重服久臨以離寒暑之數哀人之父子傷長幼之志損其飲食絕鬼神之祭祀以重吾不德也謂天下何朕獲保宗廟以眇眇之身託于天下君王之上二十有餘年矣賴天地之靈社稷之福方內安寧靡有兵革朕既不敏常畏過行以羞先帝之遺德維年之久長懼于不終今乃幸以天年得復供養于高廟朕之不明與嘉之其奚哀悲之有其令天下吏
      - type: j
        text: 軍郎中令武為復土將軍發近縣見卒萬六千人發内史卒萬五千人藏郭穿復土屬將軍武乙巳羣臣皆頓首上尊號曰孝文皇帝太子即位于高廟丁未襲號曰皇帝孝景皇帝元年十月制詔御史盖聞古者祖有功而宗有德制禮樂各有由聞歌者所以發德也舞者所以明功也高廟酎奏武德文始五行之舞孝惠廟酎奏文始五行之舞孝文皇帝臨天下通關梁不異逺
      - type: j
        text: 嘉等言陛下永思孝道立昭德之舞以明孝文皇帝之盛德皆臣嘉等愚所不及臣謹議曰功莫大於高皇帝德莫盛於孝文皇帝高皇廟宜為帝者太祖之廟孝文皇帝廟宜為帝者太宗之廟天子宜世世獻祖宗之廟郡國諸侯宜各為孝文皇帝立太宗之廟諸侯王列侯使者侍祠天子歲獻祖宗之廟請著之竹帛宣布天下制曰可太史公曰孔子言必世然後仁善人之治國百年亦
