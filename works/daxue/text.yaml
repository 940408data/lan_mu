# 大學章句（朱熹）：j 為經傳大字，z 為章句小字。此卷錄經一章、傳首章至第十章全帙。
sections:
  - id: jing
    name: 經一章
    blocks:
      - { type: j, text: 大學章句 }
      - { type: j, text: 新安朱熹章句 }
      - { type: j, text: 大學之道，在明明德，在親民，在止於至善。 }
      - { type: z, text: 程子曰：「親，當作新。」○大學者，大人之學也。明，明之也。明德者，人之所得乎天，而虛靈不昧，以具眾理而應萬事者也。但為氣稟所拘，人欲所蔽，則有時而昏；然其本體之明，則有未嘗息者。故學者當因其所發而遂明之，以復其初也。新者，革其舊之謂也，言既自明其明德，又當推以及人，使之亦有以去其舊染之污也。止者，必至於是而不遷之意。至善，則事理當然之極也。言明明德、新民，皆當至於至善之地而不遷。蓋必其有以盡夫天理之極，而無一毫人欲之私也。此三者，大學之綱領也。 }
      - { type: j, text: 知止而后有定，定而后能靜，靜而后能安，安而后能慮，慮而后能得。 }
      - { type: z, text: 後，與後同，後放此。○止者，所當止之地，即至善之所在也。知之，則志有定向。靜，謂心不妄動。安，謂所處而安。慮，謂處事精詳。得，謂得其所止。 }
      - { type: j, text: 物有本末，事有終始，知所先後，則近道矣。 }
      - { type: z, text: 明德為本，新民為末。知止為始，能得為終。本始所先，末終所後。此結上文兩節之意。 }
      - { type: j, text: 古之欲明明德於天下者，先治其國；欲治其國者，先齊其家；欲齊其家者，先脩其身；欲脩其身者，先正其心；欲正其心者，先誠其意；欲誠其意者，先致其知；致知在格物。 }
      - { type: z, text: 治，平聲，後放此。○明明德於天下者，使天下之人皆有以明其明德也。心者，身之所主也。誠，實也。意者，心之所發也。實其心之所發，欲其一於善而無自欺也。致，推極也。知，猶識也。推極吾之知識，欲其所知無不盡也。格，至也。物，猶事也。窮至事物之理，欲其極處無不到也。此八者，大學之條目也。 }
      - { type: j, text: 物格而后知至，知至而后意誠，意誠而后心正，心正而后身脩，身脩而后家齊，家齊而后國治，國治而后天下平。 }
      - { type: z, text: 治，去聲，後放此。○物格者，物理之極處無不到也。知至者，吾心之所知無不盡也。知既盡，則意可得而實矣。意既實，則心可得而正矣。脩身以上，明明德之事也。齊家以下，新民之事也。物格知至，則知所止矣。意誠以下，皆所以得所止也。 }
      - { type: j, text: 自天子以至於庶人，壹是皆以脩身為本。 }
      - { type: z, text: 壹是，一切也。正心以上，皆所以脩身也。齊家以下，則舉此而措之耳。 }
      - { type: j, text: 其本亂而末治者否矣，其所厚者薄，而其所薄者厚，未之有也。 }
      - { type: z, text: 本，謂身也。所厚，謂家也。此兩句結上文兩節之意。 }
      - { type: z, text: 右經一章，蓋孔子之言，而曾子述之。其傳十章，則曾子之意而門人記之也。舊本頗有錯簡，今因程子所定，而更考其文，別為次序如右。 }
  - id: zhuan
    name: 傳首章至第十章
    blocks:
      - { type: j, text: 康誥曰：「克明德。」大甲曰：「顧諟天之明命。」帝典曰：「克明峻德。」皆自明也。 }
      - { type: z, text: 康誥，周書。克，能也。大甲，商書。顧，謂常目在之也。諟，猶此也，古是字。天之明命，即天之所以與我，而我之所以為德者也。常目在之，則無時不明矣。帝典，堯典。峻，大也。自明，謂自明其明德也。引此以結上文之意。○右傳之首章。釋明明德。 }
      - { type: j, text: 湯之盤銘曰：「苟日新，日日新，又日新。」康誥曰：「作新民。」詩曰：「周雖舊邦，其命維新。」是故君子無所用其極。 }
      - { type: z, text: 盤，沐浴之盤也。銘，名其器以自警之辭也。苟，誠也。湯以人之洗濯其心以去惡，如沐浴其身以去垢，故銘其盤。言誠能一日有以滌其舊染之污而自新，則當因其已新者而日日新之，又日新之，不可略有間斷也。作，鼓其興起也。詩大雅文王之篇。言周國雖舊，至於文王，能新其德以及於民，而始受天命也。自新新民，皆欲止於至善也。○右傳之二章。釋新民。 }
      - { type: j, text: 詩云：「邦畿千里，惟民所止。」詩云：「緜蠻黃鳥，止于丘隅。」子曰：「於止，知其所止，可以人而不如鳥乎！」 }
      - { type: z, text: 緜蠻，音綿蠻，鳥聲。丘隅，岑蔚之處。子曰以下，孔子說詩之辭。言人當知所當止之處也。 }
      - { type: j, text: 詩云：「穆穆文王，於緝熙敬止！」為人君，止於仁；為人臣，止於敬；為人子，止於孝；為人父，止於慈；與國人交，止於信。 }
      - { type: z, text: 穆穆，深遠之意。於，歎美辭。緝，繼續也。熙，光明也。敬止，言其無不敬而安所止也。引此而言聖人之止，無非至善。五者乃其目之大者也。學者於此，究其精微之蘊，而又推類以盡其餘，則於天下之事，皆有以知其所止而無疑矣。 }
      - { type: j, text: 詩云：「瞻彼淇澳，菉竹猗猗。有斐君子，如切如磋，如琢如磨。瑟兮僩兮，赫兮喧兮。有斐君子，終不可諠兮！」如切如磋者，道學也；如琢如磨者，自脩也；瑟兮僩兮者，恂慄也；赫兮喧兮者，威儀也；有斐君子，終不可諠兮者，道盛德至善，民之不能忘也。 }
      - { type: z, text: 澳，音奧。菉，音綠。猗，協韻音阿。斐，音匪。諠，況晚反，與宣同。○澳，隈也。猗猗，美盛貌，興也。斐，文貌。切以刀鋸，琢以椎鑿，皆裁物使成形質也。磋以鑢鐋，磨以沙石，皆治物使其滑澤也。治骨角者，既切而復磋之；治玉石者，既琢而復磨之；皆言其治之有緒，而益致其精也。瑟兮僩兮，恂慄之貌；赫兮喧兮，威儀之盛。諠，忘也。引詩而釋其義，以言明明德之止於至善，德盛而民不能忘也。○右傳之三章。釋止於至善。 }
      - { type: j, text: 子曰：「聽訟，吾猶人也，必也使無訟乎！」無情者不得盡其辭，大畏民志。此謂知本。 }
      - { type: z, text: 猶人，不異於人也。情，實也。引夫子之言，而言聖人能使夫實無其事者不敢盡其辭，則是其明有以大畏民之心志，而天下無訟矣。蓋我之明德既明，自然有以畏服民之心志，此所以為知本也。○右傳之四章。釋本末。 }
      - { type: j, text: 此謂知本。 }
      - { type: z, text: 程子曰：「衍文也。」 }
      - { type: j, text: 此謂知本，此謂知之至也。 }
      - { type: z, text: 右傳之五章，釋格物致知之義，而今亡矣。間嘗竊取程子之意以補之曰：「所謂致知在格物者，言欲致吾之知，在即物而窮其理也。蓋人心之靈莫不有知，而天下之物莫不有理，惟於理有未窮，故其知有不盡也。是以大學始教，必使學者即凡天下之物，莫不因其已知之理而益窮之，以求至乎其極。至於用力之久，而一旦豁然貫通焉，則眾物之表裏精粗無不到，而吾心之全體大用無不明矣。此謂物格，此謂知之至也。」 }
      - { type: j, text: 所謂誠其意者：毋自欺也，如惡惡臭，如好好色。此之謂自謙。故君子必慎其獨也。 }
      - { type: z, text: 惡、好上字，皆去聲。謙讀為慊，苦劫反。○誠其意者，自脩之首也。毋者，禁止之辭。自欺云者，知為善以去惡，而心之所發有未實也。謙，快也，足也。獨者，人所不知而己所獨知之地也。言欲自脩者知為善以去其惡，則當實用其力，而禁止其自欺。使其惡惡則如惡惡臭，好善則如好好色，皆務決去，而求必得之，以自快足於己，不可徒苟且以殉外而為人也。然其實與不實，蓋有他人所不及知而己獨知之者，故必謹之於此以審其幾焉。 }
      - { type: j, text: 小人閒居為不善，無所不至，見君子而后厭然，揜其不善，而著其善。人之視己，如見其肺肝然，則何益矣。此謂誠於中，形於外，故君子必慎其獨也。 }
      - { type: z, text: 閒，音閑。厭，鄭氏讀為黶。○閒居，獨處也。厭然，消沮閉藏之貌。此言小人陰為不善，而陽欲揜之，則是非不知善之當為與惡之當去也；但不能實用其力以至此耳。然欲揜其惡而卒不可揜，欲詐為善而卒不可詐，則亦何益之有哉！此君子所以重以為戒，而必謹其獨也。 }
      - { type: j, text: 曾子曰：「十目所視，十手所指，其嚴乎！」 }
      - { type: z, text: 引此以明上文之意。言雖幽獨之中，而其善惡之不可揜如此。可畏之甚也。 }
      - { type: j, text: 富潤屋，德潤身，心廣體胖，故君子必誠其意。 }
      - { type: z, text: 胖，步丹反。胖，安舒也。言富則能潤屋矣，德則能潤身矣，故心無愧怍，則廣大寬平，而體常舒泰，德之潤身者然也。蓋善之實於中而形於外者如此，故又言此以結之。 }
      - { type: z, text: 右傳之六章。釋誠意。○經曰：「欲誠其意，先致其知。」又曰：「知至而后意誠。」蓋心體之明有所未盡，則其所發必有不能實用其力，而苟焉以自欺者。然或己明而不謹乎此，則其所明又非己有，而無以為進德之基。故此章之指，必承上章而通考之，然後有以見其用力之始終，其序不可亂而功不可闕如此云。 }
      - { type: j, text: 所謂脩身在正其心者：身有所忿懥，則不得其正；有所恐懼，則不得其正；有所好樂，則不得其正；有所憂患，則不得其正。 }
      - { type: z, text: 程子曰：「身有之身當作心。」忿，弗粉反。懥，敕值反。好、樂，並去聲。○忿懥，怒也。蓋是四者，皆心之用，而人所不能無者。然一有之而不能察，則欲動情勝，而其用之所行，或不能不失其正矣。 }
      - { type: j, text: 心不在焉，視而不見，聽而不聞，食而不知其味。此謂脩身在正其心。 }
      - { type: z, text: 心有不存，則無以檢其身，是以君子必察乎此而敬以直之，然後此心常存而身無不脩也。 }
      - { type: z, text: 右傳之七章。釋正心脩身。○此亦承上章以起下章。蓋意誠則真無惡而實有善矣，所以能存是心以檢其身。然或但知誠意，而不能密察此心之存否，則又無以直內而脩身也。自此以下，並以舊文為正。 }
      - { type: j, text: 所謂齊其家在脩其身者：人之其所親愛而辟焉，之其所賤惡而辟焉，之其所畏敬而辟焉，之其所哀矜而辟焉，之其所敖惰而辟焉。故好而知其惡，惡而知其美者，天下鮮矣！ }
      - { type: z, text: 辟，讀為僻。惡而之惡、敖、好，並去聲。鮮，上聲。○人，謂眾人。之，猶於也。辟，猶偏也。五者，在人本有當然之則；然常人之情惟其所向而不加審焉，則必陷於一偏而身不脩矣。 }
      - { type: j, text: 故諺有之曰：「人莫知其子之惡，莫知其苗之碩。」 }
      - { type: z, text: 諺，音彥。碩，協韻，時若反。○諺，俗語也。溺愛者不明，貪得者無厭，是則偏之為害，而家之所以不齊也。 }
      - { type: j, text: 此謂身不脩不可以齊其家。 }
      - { type: z, text: 右傳之八章。釋脩身齊家。 }
      - { type: j, text: 所謂治國必先齊其家者，其家不可教而能教人者，無之。故君子不出家而成教於國：孝者，所以事君也；弟者，所以事長也；慈者，所以使眾也。 }
      - { type: z, text: 弟，去聲。長，上聲。○身脩，則家可教矣；孝、弟、慈，所以脩身而教於家者也；然而國之所以事君事長使眾之道不外乎此。此所以家齊於上，而教成於下也。 }
      - { type: j, text: 康誥曰：「如保赤子。」心誠求之，雖不中不遠矣，未有學養子而后嫁者也。 }
      - { type: z, text: 中，去聲。○此引書而釋之，又明立教之本不假強為，在識其端而推廣之耳。 }
      - { type: j, text: 一家仁，一國興仁；一家讓，一國興讓；一人貪戾，一國作亂，其機如此。此謂一言僨事，一人定國。 }
      - { type: z, text: 僨，音奮。○一人，謂君也。機，發動所由也。僨，覆敗也。此言教成於國之效。 }
      - { type: j, text: 堯舜帥天下以仁，而民從之；桀紂帥天下以暴，而民從之；其所令反其所好，而民不從。是故君子有諸己而后求諸人，無諸己而后非諸人。所藏乎身不恕，而能喻諸人者，未之有也。 }
      - { type: z, text: 好，去聲。○此又承上文一人定國而言。有善於己，然後可以責人之善；無惡於己，然後可以正人之惡。皆推己以及人，所謂恕也，不如是，則所令反其所好，而民不從矣。喻，曉也。 }
      - { type: j, text: 故治國在齊其家。 }
      - { type: z, text: 通結上文。 }
      - { type: j, text: 詩云：「桃之夭夭，其葉蓁蓁，之子于歸，宜其家人。」宜其家人，而后可以教國人。 }
      - { type: z, text: 夭，平聲。蓁，音臻。○詩周南桃夭之篇。夭夭，少好貌。蓁蓁，美盛貌。興也。之子，猶言是子，此指女子之嫁者而言也。婦人謂嫁曰歸。宜，猶善也。 }
      - { type: j, text: 詩云：「宜兄宜弟。」宜兄宜弟，而后可以教國人。 }
      - { type: z, text: 詩小雅蓼蕭篇。 }
      - { type: j, text: 詩云：「其儀不忒，正是四國。」其為父子兄弟足法，而后民法之也。此謂治國在齊其家。 }
      - { type: z, text: 詩曹風鳴鳩篇。忒，差也。○此三引詩，皆以詠歎上文之事，而又結之如此。其味深長，最宜潛玩。 }
      - { type: z, text: 右傳之九章。釋齊家治國。 }
      - { type: j, text: 所謂平天下在治其國者：上老老而民興孝，上長長而民興弟，上恤孤而民不倍，是以君子有絜矩之道也。 }
      - { type: z, text: 長，上聲。弟，去聲。倍，與背同。絜，胡結反。○老老，所謂老吾老也。興，謂有所感發而興起也。孤者，幼而無父之稱。絜，度也。矩，所以為方也。言此三者，上行下效，捷於影響，所謂家齊而國治也。亦可以見人心之所同，而不可使有一夫之不獲矣。是以君子必當因其所同，推以度物，使彼我之間各得分願，則上下四旁均齊方正，而天下平矣。 }
      - { type: j, text: 所惡於上，毋以使下；所惡於下，毋以事上；所惡於前，毋以先後；所惡於後，毋以從前；所惡於右，毋以交於左；所惡於左，毋以交於右：此之謂絜矩之道。 }
      - { type: z, text: 惡、先，並去聲。○此覆解上文絜矩二字之義。如不欲上之無禮於我，則必以此度下之心，而亦不敢以此無禮使之。不欲下之不忠於我，則必以此度上之心，而亦不敢以此不忠事之。至於前後左右，無不皆然，則身之所處，上下、四旁、長短、廣狹，彼此如一，而無不方矣。彼同有是心而興起焉者，又豈有一夫之不獲哉。所操者約，而所及者廣，此平天下之要道也。故章內之意，皆自此而推之。 }
      - { type: j, text: 詩云：「樂只君子，民之父母。」民之所好好之，民之所惡惡之，此之謂民之父母。 }
      - { type: z, text: 樂，音洛。只，音紙。好、惡，並去聲，下並同。○詩小雅南山有臺之篇。只，語助辭。言能絜矩而以民心為己心，則是愛民如子，而民愛之如父母矣。 }
      - { type: j, text: 詩云：「節彼南山，維石巖巖，赫赫師尹，民具爾瞻。」有國者不可以不慎，辟則為天下僇矣。 }
      - { type: z, text: 節，讀為截。辟，讀為僻。僇，與戮同。○詩小雅節南山之篇。節，截然高大貌。師尹，周太師尹氏也。具，俱也。辟，偏也。言在上者人所瞻仰，不可不謹。若不能絜矩而好惡殉於一己之偏，則身弒國亡，為天下之大戮矣。 }
      - { type: j, text: 詩云：「殷之未喪師，克配上帝；儀監于殷，峻命不易。」道得眾則得國，失眾則失國。 }
      - { type: z, text: 喪，去聲。儀，詩作宜。峻，詩作駿。易，去聲。○詩文王篇。師，眾也。配，對也。配上帝，言其為天下君，而對乎上帝也。監，視也。峻，大也。不易，言難保也。道，言也。引詩而言此，以結上文兩節之意。有天下者，能存此心而不失，則所以絜矩而與民同欲者，自不能已矣。 }
      - { type: j, text: 是故君子先慎乎德。有德此有人，有人此有土，有土此有財，有財此有用。 }
      - { type: z, text: 先慎乎德，承上文不可不慎而言。德，即所謂明德。有人，謂得眾。有土，謂得國。有國則不患無財用矣。 }
      - { type: j, text: 德者本也，財者末也。 }
      - { type: z, text: 本上文而言。 }
      - { type: j, text: 外本內末，爭民施奪。 }
      - { type: z, text: 人君以德為外，以財為內，則是爭鬥其民，而施之以劫奪之教也。蓋財者人之所同欲，不能絜矩而欲專之，則民亦起而爭奪矣。 }
      - { type: j, text: 是故財聚則民散，財散則民聚。 }
      - { type: z, text: 外本內末故財聚，爭民施奪故民散，反是則有德而有人矣。 }
      - { type: j, text: 是故言悖而出者，亦悖而入；貨悖而入者，亦悖而出。 }
      - { type: z, text: 悖，布內反。○悖，逆也。此以言之出入，明貨之出入也。自先慎乎德以下至此，又因財貨以明能絜矩與不能者之得失也。 }
      - { type: j, text: 康誥曰：「惟命不于常。」道善則得之，不善則失之矣。 }
      - { type: z, text: 道，言也。因上文引文王詩之意而申言之，其丁寧反覆之意益深切矣。 }
      - { type: j, text: 楚書曰：「楚國無以為寶，惟善以為寶。」 }
      - { type: z, text: 楚書，楚語。言不寶金玉而寶善人也。 }
      - { type: j, text: 舅犯曰：「亡人無以為寶，仁親以為寶。」 }
      - { type: z, text: 舅犯，晉文公舅狐偃，字子犯。亡人，文公時為公子，出亡在外也。仁，愛也。事見檀弓。○此兩節又明不外本而內末之意。 }
      - { type: j, text: 秦誓曰：「若有一个臣，斷斷兮無他技，其心休休焉，其如有容焉。人之有技，若己有之；人之彥聖，其心好之，不啻若自其口出，寔能容之，以能保我子孫黎民，尚亦有利哉！人之有技，媢疾以惡之；人之彥聖，而違之俾不通，寔不能容，以不能保我子孫黎民，亦曰殆哉。」 }
      - { type: z, text: 个，古賀反，書作介。斷，丁亂反。媢，音冒。○秦誓，周書。斷斷，誠一之貌。彥，美士也。聖，通明也。尚，庶幾也。媢，忌也。違，拂戾也。殆，危也。 }
      - { type: j, text: 唯仁人放流之，迸諸四夷，不與同中國。此謂唯仁人為能愛人，能惡人。 }
      - { type: z, text: 迸，讀為屏，古字通用。迸，猶逐也。○言有此媢疾之人，妨賢而病國，則仁人必深惡而痛絕之。以其至公無私，故能得好惡之正如此也。 }
      - { type: j, text: 見賢而不能舉，舉而不能先，命也；見不善而不能退，退而不能遠，過也。 }
      - { type: z, text: 命，鄭氏云：「當作慢。」程子云：「當作怠。」未詳孰是。遠，去聲。○若此者，知所愛惡矣，而未能盡愛惡之道，蓋君子而未仁者也。 }
      - { type: j, text: 好人之所惡，惡人之所好，是謂拂人之性，菑必逮夫身。 }
      - { type: z, text: 菑，古災字。夫，音扶。○拂，逆也。好善而惡惡，人之性也；至於拂人之性，則不仁之甚者也。自秦誓至此，又皆以申言好惡公私之極，以明上文所引南山有臺、節南山之意。 }
      - { type: j, text: 是故君子有大道，必忠信以得之，驕泰以失之。 }
      - { type: z, text: 君子，以位言之。道，謂居其位而修己治人之術。發己自盡為忠，循物無違謂信。驕者矜高，泰者侈肆。○此因上所引文王、康誥之意而言。章內三言得失，而語益加切，蓋至此而天理存亡之幾決矣。 }
      - { type: j, text: 生財有大道，生之者眾，食之者寡，為之者疾，用之者舒，則財恒足矣。 }
      - { type: z, text: 恒，胡登反。○呂氏曰：「國無游民，則生者眾矣；朝無幸位，則食者寡矣；不奪農時，則為之疾矣；量入為出，則用之舒矣。」愚按：此因有土有財而言，以明足國之道在乎務本而節用，非必外本內末而後財可聚也。自此以至終篇，皆一意也。 }
      - { type: j, text: 仁者以財發身，不仁者以身發財。 }
      - { type: z, text: 發，猶起也。仁者散財以得民，不仁者亡身以殖貨。 }
      - { type: j, text: 未有上好仁而下不好義者也，未有好義其事不終者也，未有府庫財非其財者也。 }
      - { type: z, text: 上好仁以愛其下，則下好義以忠其上；所以事必有終，而府庫之財無悖出之患也。 }
      - { type: j, text: 孟獻子曰：「畜馬乘不察於雞豚，伐冰之家不畜牛羊，百乘之家不畜聚斂之臣，與其有聚斂之臣，寧有盜臣。」此謂國不以利為利，以義為利也。 }
      - { type: z, text: 畜，許六反。乘、斂，並去聲。○孟獻子，魯之賢大夫仲孫蔑也。畜馬乘，士初試為大夫者也。伐冰之家，卿大夫以上，喪祭用冰者也。百乘之家，有采地者也。君子寧亡己之財，而不忍傷民之力；故寧有盜臣，而不畜聚斂之臣。此謂以下，釋獻子之言也。 }
      - { type: j, text: 長國家而務財用者，必自小人矣。彼為善之，小人之使為國家，菑害並至。雖有善者，亦無如之何矣！此謂國不以利為利，以義為利也。 }
      - { type: z, text: 長，上聲。○「彼為善之」，此句上下，疑有闕文誤字。自，由也，言由小人導之也。此一節，深明以利為利之害，而重言以結之，其丁寧之意切矣。 }
      - { type: z, text: 右傳之十章。釋治國平天下。○此章之義，務在與民同好惡而不專其利，皆推廣絜矩之意也。能如是，則親賢樂利各得其所，而天下平矣。 }
      - { type: z, text: 凡傳十章：前四章統論綱領指趣，後六章細論條目功夫。其第五章乃明善之要，第六章乃誠身之本，在初學尤為當務之急，讀者不可以其近而忽之也。 }
