  colophon: |-
    依<b>宋刻本</b>版式排比：一版兩個半葉，中縫為版心。經文大字單行，朱子章句小字雙行；一列惟純經或純注，遇章別行，遇注另起列。<br>此卷錄《大學章句》全帙：經一章、傳十章（含格物致知補傳），至「讀者不可以其近而忽之也」而止；朱子之序另成一卷。<br>句讀依宋本朱筆圈點之法，附於字之右下，圈為句、點為讀，不占字位。<br>文本以朱熹《四書章句集注》通行本為據，校錄重排，與宋本原刻容有出入。
