    role: title
    text: 萬章章句上
  - page: 316
    col: 11
    role: z
    text: 凡九章
  - page: 316
    col: 12
    role: j
    text: 萬章問曰舜往于田號泣于旻天何爲
  - page: 316
    col: 13
    role: j
    text: 其號泣也孟子曰怨慕也
  - page: 316
    col: 14
    role: z
    text: 號平聲○舜往于田耕歷山時也仁
  - page: 316
    col: 15
    role: z
    text: 覆閔下謂之旻天號泣于旻天呼天
  - page: 316
    col: 16
    role: z
    text: 而泣也事見虞書大禹謨篇怨慕怨
  - page: 317
    col: 1
    role: z
    text: 己之不得其親而思慕也
  - page: 317
    col: 2
    role: j
    text: 萬章曰父母愛之喜而不忘父母惡之
  - page: 317
    col: 3
    role: j
    text: 勞而不怨然則舜怨乎曰長息問於公
  - page: 317
    col: 4
    role: j
    text: 明高曰舜往于田則吾既得聞命矣號
  - page: 317
    col: 5
    role: j
    text: 泣于旻天于父母則吾不知也公明高
  - page: 317
    col: 6
    role: j
    text: 曰是非爾所知也夫公明高以孝子之
  - page: 317
    col: 7
    role: j
    text: 心為不若是恝我竭力耕田共為子職
  - page: 317
    col: 8
    role: j
    text: 而已矣父母之不我愛於我何哉
  - page: 317
    col: 9
    role: j
    text: 惡去聲夫音扶恝苦八反共平聲○
  - page: 317
    col: 10
    role: j
    text: 長息公明高弟子公明高曾子弟子
  - page: 317
    col: 11
    role: j
    text: 于父母亦書辭言呼父母而泣也恝
  - page: 317
    col: 12
    role: j
    text: 無愁之貌於我何哉自責不知己有
  - page: 317
    col: 13
    role: j
    text: 何罪耳非怨父母也○楊氏曰非孟
  - page: 317
    col: 14
    role: j
    text: 子深知舜之心不能為此言蓋舜惟
  - page: 317
    col: 15
    role: j
    text: 恐不順於父母未嘗自以為孝也若
  - page: 317
    col: 16
    role: j
    text: 自以為孝則非孝矣
  - page: 318
    col: 1
    role: j
    text: 帝使其子九男二女百官牛羊倉廩備
  - page: 318
    col: 2
    role: j
    text: 以事舜於畎畒之中天下之士多就之
  - page: 318
    col: 3
    role: j
    text: 者帝將胥天下而遷之焉爲不順於父
  - page: 318
    col: 4
    role: j
    text: 母如窮人無所歸
  - page: 318
    col: 5
    role: z
    text: 爲去聲○帝堯也史記云二女妻之
  - page: 318
    col: 6
    role: z
    text: 以觀其内九男事之以觀其外史記
  - page: 318
    col: 7
    role: z
    text: 言一年所居成聚二年成邑三年成
  - page: 318
    col: 8
    role: z
    text: 都是天下之士就之也胥相視也遷
  - page: 318
    col: 9
    role: z
    text: 之移以與之也如窮人之無所歸言
  - page: 318
    col: 10
    role: z
    text: 其怨慕迫切之甚也
  - page: 318
    col: 11
    role: j
    text: 天下之士悅之人之所欲也而不足以
  - page: 318
    col: 12
    role: j
    text: 解憂好色人之所欲妻帝之二女而不
  - page: 318
    col: 13
    role: j
    text: 足以解憂富人之所欲富有天下而不
  - page: 318
    col: 14
    role: j
    text: 足以解憂貴人之所欲貴爲天子而不
  - page: 318
    col: 15
    role: j
    text: 足以解憂人悅之好色富貴無足以解
  - page: 318
    col: 16
    role: j
    text: 憂者惟順於父母可以解憂
  - page: 319
    col: 1
    role: z
    text: 孟子推舜之心如此以解上文之意
  - page: 319
    col: 2
    role: z
    text: 極天下之欲不足以解憂而惟順於
  - page: 319
    col: 3
    role: z
    text: 父母可以解憂孟子眞知舜之心哉
  - page: 319
    col: 4
    role: j
    text: 人少則慕父母知好色則慕少艾有妻
  - page: 319
    col: 5
    role: j
    text: 子則慕妻子仕則慕君不得於君則熱
  - page: 319
    col: 6
    role: j
    text: 中夫孝終身慕父母五十而慕者予於
  - page: 319
    col: 7
    role: j
    text: 大舜見之矣
  - page: 319
    col: 8
    role: z
    text: 少好皆去聲○言常人之情因物有
  - page: 319
    col: 9
    role: z
    text: 遷惟聖人爲能不失其本心也艾美
  - page: 319
    col: 10
    role: z
    text: 好也楚詞戰國策所謂幼艾義與此
  - page: 319
    col: 11
    role: z
    text: 同不得失意也熱中躁急心熱也言
  - page: 319
    col: 12
    role: z
    text: 五十者舜攝政時年五十也五十而
  - page: 319
    col: 13
    role: z
    text: 慕則其終身慕可知矣○此章言舜
  - page: 319
    col: 14
    role: z
    text: 不以得衆人之所欲爲己樂而以不
  - page: 319
    col: 15
    role: z
    text: 順乎親之心爲己憂非聖人之盡性
  - page: 319
    col: 16
    role: z
    text: 其孰能之
  - page: 320
    col: 1
    role: j
    text: 萬章問曰詩云娶妻如之何必告父母
  - page: 320
    col: 2
    role: j
    text: 信斯言也宜莫如舜舜之不告而娶何
  - page: 320
    col: 3
    role: j
    text: 也孟子曰告則不得娶男女居室人之
  - page: 320
    col: 4
    role: j
    text: 大倫也如告則廢人之大倫以懟父母
  - page: 320
    col: 5
    role: j
    text: 是以不告也
  - page: 320
    col: 6
    role: z
    text: 懟直類反○詩齊國風南山之篇也
  - page: 320
    col: 7
    role: z
    text: 信誠也誠如此詩之言也懟讎怨也
  - page: 320
    col: 8
    role: z
    text: 舜父頑母嚚常欲害舜告則不聽其
  - page: 320
    col: 9
    role: z
    text: 娶是廢人之大倫以讎怨於父母也
  - page: 320
    col: 10
    role: j
    text: 萬章曰舜之不告而娶則吾既得聞命
  - page: 320
    col: 11
    role: j
    text: 矣帝之妻舜而不告何也曰帝亦知告
  - page: 320
    col: 12
    role: j
    text: 焉則不得妻也
  - page: 320
    col: 13
    role: z
    text: 妻去聲○以女為人妻曰妻○程子
  - page: 320
    col: 14
    role: z
    text: 曰堯妻舜而不告者以君治之而已
  - page: 320
    col: 15
    role: z
    text: 如今之官府治民之私者亦多
  - page: 320
    col: 16
    role: j
    text: 萬章曰父母使舜完廩捐階瞽瞍焚廩
  - page: 321
    col: 1
    role: j
    text: 使浚井出從而揜之象曰謨蓋都君咸
  - page: 321
    col: 2
    role: j
    text: 我績牛羊父母倉廩父母干戈朕琴朕
  - page: 321
    col: 3
    role: j
    text: 弤朕二嫂使治朕棲象往入舜官舜在
  - page: 321
    col: 4
    role: j
    text: 牀琴象曰鬱陶思君爾忸怩舜曰惟兹
  - page: 321
    col: 5
    role: j
    text: 臣庶汝其于予治不識舜不知象之將
  - page: 321
    col: 6
    role: j
    text: 殺己與曰奚而不知也象憂亦憂象喜
  - page: 321
    col: 7
    role: j
    text: 亦喜
  - page: 321
    col: 8
    role: z
    text: 弤都禮反忸女六反怩音尼與平聲
  - page: 321
    col: 9
    role: z
    text: ○完治也捐去也階梯也揜蓋也按
  - page: 321
    col: 10
    role: j
    text: 史記曰使舜上塗廩瞽叟從下縱火
  - page: 321
    col: 11
    role: j
    text: 焚廩舜乃以兩笠自捍而下去得不
  - page: 321
    col: 12
    role: j
    text: 死後又使舜穿井舜穿井為匿空旁
  - page: 321
    col: 13
    role: j
    text: 出舜既入深瞽叟與象共下土實井
  - page: 321
    col: 14
    role: j
    text: 舜從匿空去即其事也象舜異母
  - page: 321
    col: 15
    role: j
    text: 弟也謨謀也蓋蓋井也舜所居三年
  - page: 321
    col: 16
    role: j
    text: 成都故謂之都君咸皆也績功也舜
  - page: 322
    col: 1
    role: j
    text: 既入井象不知舜已出欲以殺舜為
  - page: 322
    col: 2
    role: j
    text: 已功也干盾也戈戟也琴舜所彈五
  - page: 322
    col: 3
    role: j
    text: 弦琴也弤琱弓也象欲以舜之牛羊
  - page: 322
    col: 4
    role: j
    text: 倉廪與父母而自取此物也二嫂堯
  - page: 322
    col: 5
    role: j
    text: 二女也棲牀也象欲使為己妻也象
  - page: 322
    col: 6
    role: j
    text: 往舜宫欲分取所有見舜生在牀彈
  - page: 322
    col: 7
    role: j
    text: 琴蓋既出即潜歸其宫也鬱陶思之
  - page: 322
    col: 8
    role: j
    text: 甚而氣不得伸也象言已思君之甚
  - page: 322
    col: 9
    role: j
    text: 故來見爾忸怩慚色也臣庶謂其百
  - page: 322
    col: 10
    role: j
    text: 官也象素憎舜不至其宫故舜見其
  - page: 322
    col: 11
    role: j
    text: 來而喜使之治其臣庶也孟子言舜
  - page: 322
    col: 12
    role: j
    text: 非不知其將殺己但見其憂則憂見
  - page: 322
    col: 13
    role: j
    text: 其喜則喜兄弟之情自有所不能已
  - page: 322
    col: 14
    role: j
    text: 耳萬章所言其有無不可知然舜之
  - page: 322
    col: 15
    role: j
    text: 心則孟子有以知之矣它亦不足辯
  - page: 322
    col: 16
    role: j
    text: 也○程子曰象憂亦憂象喜亦喜人
  - page: 323
    col: 1
    role: z
    text: 情天理於是爲至
  - page: 323
    col: 2
    role: j
    text: 曰然則舜僞喜者與曰否昔者有饋生
  - page: 323
    col: 3
    role: j
    text: 魚於鄭子產子產使校人畜之池校人
  - page: 323
    col: 4
    role: j
    text: 烹之反命曰始舍之圉圉焉少則洋洋
  - page: 323
    col: 5
    role: j
    text: 焉攸然而逝子產曰得其所哉得其所
  - page: 323
    col: 6
    role: j
    text: 哉校人出曰孰謂子產智予既烹而食
  - page: 323
    col: 7
    role: j
    text: 之曰得其所哉得其所哉故君子可欺
  - page: 323
    col: 8
    role: j
    text: 以其方難罔以非其道彼以愛兄之道
  - page: 323
    col: 9
    role: j
    text: 來故誠信而喜之奚僞焉
  - page: 323
    col: 10
    role: z
    text: 與平聲校音效又音教畜許六反○
  - page: 323
    col: 11
    role: z
    text: 校人主池沼小吏也圉圉困而未紓
  - page: 323
    col: 12
    role: z
    text: 之貌洋洋則稍縱矣攸然而逝者自
  - page: 323
    col: 13
    role: z
    text: 得而遠去也方亦道也罔蒙蔽也欺
  - page: 323
    col: 14
    role: z
    text: 以其方謂誑之以理之所有罔以非
  - page: 323
    col: 15
    role: z
    text: 其道謂昧之以理之所無象以愛兄
  - page: 323
    col: 16
    role: z
    text: 之道來所謂欺之以其方也舜本不
  - page: 324
    col: 1
    role: z
    text: 知其偽故實喜之何偽之有○此章
  - page: 324
    col: 2
    role: z
    text: 又言舜遭人倫變而不失天理之
  - page: 324
    col: 3
    role: z
    text: 常也
  - page: 324
    col: 4
    role: j
    text: 萬章問曰象日以殺舜為事立為天子
  - page: 324
    col: 5
    role: j
    text: 則放之何也孟子曰封之也或曰放焉
  - page: 324
    col: 6
    role: z
    text: 放猶置也置之於此使不得去也萬
  - page: 324
    col: 7
    role: z
    text: 章疑舜何不誅之孟子言舜實封之
  - page: 324
    col: 8
    role: z
    text: 而或者誤以為放也
  - page: 324
    col: 9
    role: j
    text: 萬章曰舜流共工于幽州放驩兜于崇
  - page: 324
    col: 10
    role: j
    text: 山殺三苗于三危殛鯀于羽山四罪而
  - page: 324
    col: 11
    role: j
    text: 天下咸服誅不仁也象至不仁封之有
  - page: 324
    col: 12
    role: j
    text: 庳有庳之人奚罪焉仁人固如是乎在
  - page: 324
    col: 13
    role: j
    text: 他人則誅之在弟則封之曰仁人之於
  - page: 324
    col: 14
    role: j
    text: 弟也不藏怒焉不宿怨焉親愛之而已
  - page: 324
    col: 15
    role: j
    text: 矣親之欲其貴也愛之欲其富也封之
  - page: 324
    col: 16
    role: j
    text: 有庳富貴之也身為天子弟為匹夫可
  - page: 325
    col: 1
    role: j
    text: 謂親愛之乎
  - page: 325
    col: 2
    role: z
    text: 庳音鼻○流徙也共工官名驩兜人
  - page: 325
    col: 3
    role: z
    text: 名二人比周相與為黨三苗國名負
  - page: 325
    col: 4
    role: z
    text: 固不服殺殺其君也殛誅也鯀禹父
  - page: 325
    col: 5
    role: z
    text: 名方命圮族治水無功皆不仁之人
  - page: 325
    col: 6
    role: z
    text: 也幽州崇山三危羽山有庳皆地名
  - page: 325
    col: 7
    role: z
    text: 也或曰今道州鼻亭即有庳之地也
  - page: 325
    col: 8
    role: z
    text: 未知是否萬章疑舜不當封象使彼
  - page: 325
    col: 9
    role: z
    text: 有庳之民無罪而遭象之虐非仁人
  - page: 325
    col: 10
    role: z
    text: 之心也藏怒謂藏匿其怒宿怨謂留
  - page: 325
    col: 11
    role: z
    text: 蓄其怨
  - page: 325
    col: 12
    role: j
    text: 敢問或曰放者何謂也曰象不得有為
  - page: 325
    col: 13
    role: j
    text: 於其國天子使吏治其國而納其貢稅
  - page: 325
    col: 14
    role: j
    text: 焉故謂之放豈得暴彼民哉雖然欲常
  - page: 325
    col: 15
    role: j
    text: 常而見之故源源而來不及貢以政接
  - page: 325
    col: 16
    role: j
    text: 于有庳此之謂也
  - page: 326
    col: 1
    role: z
    text: 孟子言象雖封爲有庳之君然不得
  - page: 326
    col: 2
    role: z
    text: 治其國天子使吏代之治而納其所
  - page: 326
    col: 3
    role: z
    text: 收之貢稅於象有似於放故或者以
  - page: 326
    col: 4
    role: z
    text: 爲放也蓋象至不仁處之如此則旣
  - page: 326
    col: 5
    role: z
    text: 不失吾親愛之心而彼亦不得虐有
  - page: 326
    col: 6
    role: z
    text: 庳之民也源源若水之相繼也來謂
  - page: 326
    col: 7
    role: z
    text: 來朝覲也不及貢以政接于有庳謂
  - page: 326
    col: 8
    role: z
    text: 不待及諸侯朝貢之期而以政事接
  - page: 326
    col: 9
    role: z
    text: 見有庳之君蓋古書之辭而孟子引
  - page: 326
    col: 10
    role: z
    text: 以證源源而來之意見其親愛之無
  - page: 326
    col: 11
    role: z
    text: 已如此也○呉氏曰言聖人不以公
  - page: 326
    col: 12
    role: z
    text: 義廢私恩亦不以私恩害公義舜之
  - page: 326
    col: 13
    role: z
    text: 於象仁之至義之盡也
  - page: 326
    col: 14
    role: j
    text: 咸丘蒙問曰語云盛德之士君不得而
  - page: 326
    col: 15
    role: j
    text: 臣父不得而子舜南靣而立堯帥諸侯
  - page: 326
    col: 16
    role: j
    text: 北靣而朝之瞽瞍亦北靣而朝之舜見
  - page: 327
    col: 1
    role: j
    text: 瞽瞍其容有蹙孔子曰於斯時也天下
  - page: 327
    col: 2
    role: j
    text: 殆哉岌岌乎不識此語誠然乎哉孟子
  - page: 327
    col: 3
    role: j
    text: 曰否此非君子之言齊東野人之語也
  - page: 327
    col: 4
    role: j
    text: 堯老而舜攝也堯典曰二十有八載放
  - page: 327
    col: 5
    role: j
    text: 勲乃徂落百姓如喪考妣三年四海遏
  - page: 327
    col: 6
    role: j
    text: 密八音孔子曰天無二日民無二王舜
  - page: 327
    col: 7
    role: j
    text: 既爲天子矣又帥天下諸侯以爲堯三
  - page: 327
    col: 8
    role: j
    text: 年喪是二天子矣
  - page: 327
    col: 9
    role: z
    text: 朝音潮岌魚及反○咸丘蒙孟子弟
  - page: 327
    col: 10
    role: z
    text: 子語者古語也蹙顰蹙不自安也岌
  - page: 327
    col: 11
    role: z
    text: 岌不安貌也言人倫乖亂天下將危
  - page: 327
    col: 12
    role: z
    text: 也齊東齊國之東鄙也孟子言堯但
  - page: 327
    col: 13
    role: z
    text: 老不治事而舜攝天子之事耳堯在
  - page: 327
    col: 14
    role: z
    text: 時舜未甞即天子位堯何由北面而
  - page: 327
    col: 15
    role: z
    text: 朝乎又引書及孔子之言以明之堯
  - page: 327
    col: 16
    role: z
    text: 典虞書篇名今此文乃見於舜典蓋
  - page: 328
    col: 1
    role: z
    text: 古書二篇或合爲一耳言舜攝位二
  - page: 328
    col: 2
    role: z
    text: 十八年而堯死也徂升也落降也人
  - page: 328
    col: 3
    role: z
    text: 死則魂升而魄降故古者謂死爲徂
  - page: 328
    col: 4
    role: z
    text: 落遏止也宻靜也八音金石絲竹匏
  - page: 328
    col: 5
    role: z
    text: 土革木樂器之音也
  - page: 328
    col: 6
    role: j
    text: 咸丘蒙曰舜之不臣堯則吾旣得聞命
  - page: 328
    col: 7
    role: j
    text: 矣詩云普天之下莫非王土率土之濱
  - page: 328
    col: 8
    role: j
    text: 莫非王臣而舜旣爲天子矣敢問瞽瞍
  - page: 328
    col: 9
    role: j
    text: 之非臣如何曰是詩也非是之謂也勞
  - page: 328
    col: 10
    role: j
    text: 於王事而不得養父母也曰此莫非王
  - page: 328
    col: 11
    role: j
    text: 事我獨賢勞也故說詩者不以文害辭
  - page: 328
    col: 12
    role: j
    text: 不以辭害志以意逆志是爲得之如以
  - page: 328
    col: 13
    role: j
    text: 辭而已矣雲漢之詩曰周餘黎民靡有
  - page: 328
    col: 14
    role: j
    text: 孑遺信斯言也是周無遺民也
  - page: 328
    col: 15
    role: z
    text: 不臣堯不以堯爲臣使北面而朝也
  - page: 328
    col: 16
    role: z
    text: 詩小雅北山之篇也普遍也率循也
  - page: 329
    col: 1
    role: z
    text: 此詩今毛氏序云役使不均已勞於
  - page: 329
    col: 2
    role: z
    text: 王事而不得養其父母焉其詩下文
  - page: 329
    col: 3
    role: z
    text: 亦云大夫不均我從事獨賢乃作詩
  - page: 329
    col: 4
    role: z
    text: 者自言天下皆王臣何爲獨使我以
  - page: 329
    col: 5
    role: z
    text: 賢才而勞苦乎非謂天子可臣其父
  - page: 329
    col: 6
    role: z
    text: 也文字也辭語也逆迎也雲漢大雅
  - page: 329
    col: 7
    role: z
    text: 篇名也孑獨立之貌遺脫也言說詩
  - page: 329
    col: 8
    role: z
    text: 之法不可以一字而害一句之義不
  - page: 329
    col: 9
    role: z
    text: 可以一句而害設辭之志當以己意
  - page: 329
    col: 10
    role: z
    text: 迎取作者之志乃可得之若但以其
  - page: 329
    col: 11
    role: z
    text: 辭而已則如雲漢所言是周之民眞
  - page: 329
    col: 12
    role: z
    text: 無遺種矣惟以意逆之則知作詩者
  - page: 329
    col: 13
    role: z
    text: 之志在於憂旱而非眞無遺民也
  - page: 329
    col: 14
    role: j
    text: 孝子之至莫大乎尊親尊親之至莫大
  - page: 329
    col: 15
    role: j
    text: 乎以天下養爲天子父尊之至也以天
  - page: 329
    col: 16
    role: j
    text: 下養養之至也詩曰永言孝思孝思維
  - page: 330
    col: 1
    role: j
    text: 則此之謂也
  - page: 330
    col: 2
    role: z
    text: 養去聲○言瞽瞍既為天子之父則
  - page: 330
    col: 3
    role: z
    text: 當享天下之養此舜之所以為尊親
  - page: 330
    col: 4
    role: z
    text: 養親之至也豈有使之北面而朝之
  - page: 330
    col: 5
    role: z
    text: 理乎詩大雅下武之篇言人能長言
  - page: 330
    col: 6
    role: z
    text: 孝思而不忘則可以為天下法則也
  - page: 330
    col: 7
    role: j
    text: 書曰祗載見瞽瞍夔夔齊栗瞽瞍亦允
  - page: 330
    col: 8
    role: j
    text: 若是為父不得而子也
  - page: 330
    col: 9
    role: z
    text: 見音現齊側皆反○書大禹謨篇也
  - page: 330
    col: 10
    role: z
    text: 祗敬也載事也夔夔齋栗敬謹恐懼
  - page: 330
    col: 11
    role: z
    text: 之貌允信也若順也言舜敬事瞽瞍
  - page: 330
    col: 12
    role: z
    text: 往而見之敬謹如此瞽瞍亦信而順
  - page: 330
    col: 13
    role: z
    text: 之也孟子引此而言瞽瞍不能以不
  - page: 330
    col: 14
    role: z
    text: 善及其子而反見化於其子則是所
  - page: 330
    col: 15
    role: z
    text: 謂父不得而子者而非如咸丘蒙之
  - page: 330
    col: 16
    role: z
    text: 說也
  - page: 331
    col: 1
    role: j
    text: 萬章曰堯以天下與舜有諸孟子曰否
  - page: 331
    col: 2
    role: j
    text: 天子不能以天下與人
  - page: 331
    col: 3
    role: z
    text: 天下者天下之天下非一人之私有
  - page: 331
    col: 4
    role: z
    text: 故也
  - page: 331
    col: 5
    role: j
    text: 然則舜有天下也孰與之曰天與之
  - page: 331
    col: 6
    role: z
    text: 萬章問而孟子答也
  - page: 331
    col: 7
    role: j
    text: 天與之者諄諄然命之乎
  - page: 331
    col: 8
    role: z
    text: 諄之淳反○萬章問也諄諄詳語之
  - page: 331
    col: 9
    role: z
    text: 貌
  - page: 331
    col: 10
    role: j
    text: 曰否天不言以行與事示之而已矣
  - page: 331
    col: 11
    role: z
    text: 行去聲下同○行之於身謂之行措
  - page: 331
    col: 12
    role: z
    text: 諸天下謂之事言但因舜之行事而
  - page: 331
    col: 13
    role: z
    text: 示以與之之意耳
  - page: 331
    col: 14
    role: j
    text: 曰以行與事示之者如之何曰天子能
  - page: 331
    col: 15
    role: j
    text: 薦人於天不能使天與之天下諸侯能
  - page: 331
    col: 16
    role: j
    text: 薦人於天子不能使天子與之諸侯大
  - page: 332
    col: 1
    role: j
    text: 夫能薦人於諸侯不能使諸侯與之大
  - page: 332
    col: 2
    role: j
    text: 夫昔者堯薦舜於天而天受之暴之於
  - page: 332
    col: 3
    role: j
    text: 民而民受之故曰天不言以行與事示
  - page: 332
    col: 4
    role: j
    text: 之而已矣
  - page: 332
    col: 5
    role: z
    text: 暴步卜反下同○暴顯也言下能薦
  - page: 332
    col: 6
    role: z
    text: 人於上不能令上必用之舜爲天人
  - page: 332
    col: 7
    role: z
    text: 所受是因舜之行與事而示之以與
  - page: 332
    col: 8
    role: z
    text: 之之意也
  - page: 332
    col: 9
    role: j
    text: 曰敢問薦之於天而天受之暴之於民
  - page: 332
    col: 10
    role: j
    text: 而民受之如何曰使之主祭而百神享
  - page: 332
    col: 11
    role: j
    text: 之是天受之使之主事而事治百姓安
  - page: 332
    col: 12
    role: j
    text: 之是民受之也天與之人與之故曰天
  - page: 332
    col: 13
    role: j
    text: 子不能以天下與人
  - page: 332
    col: 14
    role: z
    text: 治去聲
  - page: 332
    col: 15
    role: j
    text: 舜相堯二十有八載非人之所能爲也
  - page: 332
    col: 16
    role: j
    text: 天也堯崩三年之喪畢舜避堯之子於
  - page: 333
    col: 1
    role: j
    text: 南河之南天下諸侯朝覲者不之堯之
  - page: 333
    col: 2
    role: j
    text: 子而之舜訟獄者不之堯之子而之舜
  - page: 333
    col: 3
    role: j
    text: 謳歌者不謳歌堯之子而謳歌舜故曰
  - page: 333
    col: 4
    role: j
    text: 天也夫然後之中國踐天子位焉而居
  - page: 333
    col: 5
    role: j
    text: 堯之宮逼堯之子是篡也非天與也
  - page: 333
    col: 6
    role: z
    text: 相去聲朝音潮夫音扶○南河在冀
  - page: 333
    col: 7
    role: z
    text: 州之南其南即豫州也訟獄謂獄不
  - page: 333
    col: 8
    role: z
    text: 決而訟之也
  - page: 333
    col: 9
    role: j
    text: 太誓曰天視自我民視天聽自我民聽
  - page: 333
    col: 10
    role: j
    text: 此之謂也
  - page: 333
    col: 11
    role: z
    text: 自從也天無形其視聽皆從於民之
  - page: 333
    col: 12
    role: z
    text: 視聽民之歸舜如此則天與之可知
  - page: 333
    col: 13
    role: z
    text: 矣
  - page: 333
    col: 14
    role: j
    text: 萬章問曰人有言至於禹而德衰不傳
  - page: 333
    col: 15
    role: j
    text: 於賢而傳於子有諸孟子曰否不然也
  - page: 333
    col: 16
    role: j
    text: 天與賢則與賢天與子則與子昔者舜
  - page: 334
    col: 1
    role: j
    text: 薦禹於天十有七年舜崩三年之喪畢
  - page: 334
    col: 2
    role: j
    text: 禹避舜之子於陽城天下之民從之若
  - page: 334
    col: 3
    role: j
    text: 堯崩之後不從堯之子而從舜也禹薦
  - page: 334
    col: 4
    role: j
    text: 益於天七年禹崩三年之喪畢益避禹
  - page: 334
    col: 5
    role: j
    text: 之子於箕山之陰朝覲訟獄者不之益
  - page: 334
    col: 6
    role: j
    text: 而之啓曰吾君之子也謳歌者不謳歌
  - page: 334
    col: 7
    role: j
    text: 益而謳歌啓曰吾君之子也
  - page: 334
    col: 8
    role: z
    text: 朝音潮○陽城箕山之陰皆嵩山下
  - page: 334
    col: 9
    role: z
    text: 深谷中可藏處也啓禹之子也○楊
  - page: 334
    col: 10
    role: z
    text: 氏曰此語孟子必有所受然不可考
  - page: 334
    col: 11
    role: z
    text: 矣但云天與賢則與賢天與子則與
  - page: 334
    col: 12
    role: z
    text: 子可以見堯舜禹之心皆無一毫私
  - page: 334
    col: 13
    role: z
    text: 意也
  - page: 334
    col: 14
    role: j
    text: 丹朱之不肖舜之子亦不肖舜之相堯
  - page: 334
    col: 15
    role: j
    text: 禹之相舜也歷年多施澤於民久啓賢
  - page: 334
    col: 16
    role: j
    text: 能敬承繼禹之道益之相禹也歷年少
  - page: 335
    col: 1
    role: j
    text: 施澤於民未乆舜禹益相去乆遠其子
  - page: 335
    col: 2
    role: j
    text: 之賢不肖皆天也非人之所能爲也莫
  - page: 335
    col: 3
    role: j
    text: 之爲而爲者天也莫之致而至者命也
  - page: 335
    col: 4
    role: z
    text: 之相之相去聲相去之相如字○堯
  - page: 335
    col: 5
    role: z
    text: 舜之子皆不肖而舜禹之爲相乆此
  - page: 335
    col: 6
    role: z
    text: 堯舜之子所以不有天下而舜禹有
  - page: 335
    col: 7
    role: z
    text: 天下也禹之子賢而益相不乆此啓
  - page: 335
    col: 8
    role: z
    text: 所以有天下而益不有天下也然此
  - page: 335
    col: 9
    role: z
    text: 皆非人力所爲而自爲非人力所致
  - page: 335
    col: 10
    role: z
    text: 而自至者蓋以理言之謂之天自人
  - page: 335
    col: 11
    role: z
    text: 言之謂之命其實則一而已
  - page: 335
    col: 12
    role: j
    text: 匹夫而有天下者德必若舜禹而又有
  - page: 335
    col: 13
    role: j
    text: 天子薦之者故仲尼不有天下
  - page: 335
    col: 14
    role: z
    text: 孟子因禹益之事歷舉此下兩條以
  - page: 335
    col: 15
    role: z
    text: 推明之言仲尼之德雖無愧於舜禹
  - page: 335
    col: 16
    role: z
    text: 而無天子薦之者故不有天下
  - page: 336
    col: 1
    role: j
    text: 繼世以有天下天之所廢必若桀紂者
  - page: 336
    col: 2
    role: j
    text: 也故益伊尹周公不有天下
  - page: 336
    col: 3
    role: z
    text: 繼世而有天下者其先世皆有大功
  - page: 336
    col: 4
    role: z
    text: 德於民故必有大惡如桀紂則天乃
  - page: 336
    col: 5
    role: z
    text: 廢之如啓及太甲成王雖不及益伊
  - page: 336
    col: 6
    role: z
    text: 尹周公之賢聖但能嗣守先業則天
  - page: 336
    col: 7
    role: z
    text: 亦不廢之故益伊尹周公雖有舜禹
  - page: 336
    col: 8
    role: z
    text: 之德而亦不有天下
  - page: 336
    col: 9
    role: j
    text: 伊尹相湯以王於天下湯崩太丁未立
  - page: 336
    col: 10
    role: j
    text: 外丙二年仲壬四年太甲顛覆湯之典
  - page: 336
    col: 11
    role: j
    text: 刑伊尹放之於桐三年太甲悔過自怨
  - page: 336
    col: 12
    role: j
    text: 自艾於桐處仁遷義三年以聽伊尹之
  - page: 336
    col: 13
    role: j
    text: 訓己也復歸于亳
  - page: 336
    col: 14
    role: z
    text: 相王皆去聲艾音乂○此承上文言
  - page: 336
    col: 15
    role: z
    text: 伊尹不有天下之事○趙氏曰太丁
  - page: 336
    col: 16
    role: z
    text: 湯之太子未立而死外丙立二年仲
  - page: 337
    col: 1
    role: z
    text: 壬立四年皆太丁弟也太甲太丁子
  - page: 337
    col: 2
    role: z
    text: 也○程氏曰古人謂歲為年湯崩時
  - page: 337
    col: 3
    role: z
    text: 外丙方二歲仲壬方四歲惟太甲差
  - page: 337
    col: 4
    role: z
    text: 長故立之也二說未知孰是顛覆壞
  - page: 337
    col: 5
    role: z
    text: 亂也典刑常法也桐湯墓所在艾治
  - page: 337
    col: 6
    role: z
    text: 也說文云芟草也蓋斬絕自新之意
  - page: 337
    col: 7
    role: z
    text: 亳商所都也
  - page: 337
    col: 8
    role: j
    text: 周公之不有天下猶益之於夏伊尹之
  - page: 337
    col: 9
    role: j
    text: 於殷也
  - page: 337
    col: 10
    role: z
    text: 此復言周公所以不有天下之意
  - page: 337
    col: 11
    role: j
    text: 孔子曰唐虞禪夏后殷周繼其義一也
  - page: 337
    col: 12
    role: z
    text: 禪音擅○禪授也或禪或繼皆天命
  - page: 337
    col: 13
    role: z
    text: 也聖人豈有私意於其間哉○尹氏
  - page: 337
    col: 14
    role: z
    text: 曰孔子曰唐虞禪夏后商周繼其義
  - page: 337
    col: 15
    role: z
    text: 一也孟子曰天與賢則與賢天與子
  - page: 337
    col: 16
    role: z
    text: 則與子知前聖之心者無如孔子繼
  - page: 338
    col: 1
    role: z
    text: 孔子者孟子而已矣
  - page: 338
    col: 2
    role: j
    text: 萬章問曰人有言伊尹以割烹要湯有
  - page: 338
    col: 3
    role: j
    text: 諸
  - page: 338
    col: 4
    role: z
    text: 要平聲下同○要求也按史記伊尹
  - page: 338
    col: 5
    role: z
    text: 欲行道以致君而無由乃為有莘氏
  - page: 338
    col: 6
    role: z
    text: 之媵臣負鼎俎以滋味說湯致於王
  - page: 338
    col: 7
    role: z
    text: 道蓋戰國時有為此說者
  - page: 338
    col: 8
    role: j
    text: 孟子曰否不然伊尹耕於有莘之野而
  - page: 338
    col: 9
    role: j
    text: 樂堯舜之道焉非其義也非其道也祿
  - page: 338
    col: 10
    role: j
    text: 之以天下弗顧也繫馬千駟弗視也非
  - page: 338
    col: 11
    role: j
    text: 其義也非其道也一介不以與人一介
  - page: 338
    col: 12
    role: j
    text: 不以取諸人
  - page: 338
    col: 13
    role: z
    text: 樂音洛○莘國名樂堯舜之道者誦
  - page: 338
    col: 14
    role: z
    text: 其詩讀其書而欣慕愛樂之也駟四
  - page: 338
    col: 15
    role: z
    text: 匹也介與草芥之芥同言其辭受取
  - page: 338
    col: 16
    role: z
    text: 與無大無細一以道義而不苟也
  - page: 339
    col: 1
    role: j
    text: 湯使人以幣聘之囂囂然曰我何以湯
  - page: 339
    col: 2
    role: j
    text: 之聘幣爲哉我豈若處畎畝之中由是
  - page: 339
    col: 3
    role: j
    text: 以樂堯舜之道哉
  - page: 339
    col: 4
    role: j
    text: 囂五高反又戸驕反○囂囂無欲自得
  - page: 339
    col: 5
    role: z
    text: 之貌
  - page: 339
    col: 6
    role: j
    text: 湯三使往聘之旣而幡然改曰與我處
  - page: 339
    col: 7
    role: j
    text: 畎畝之中由是以樂堯舜之道吾豈若
  - page: 339
    col: 8
    role: j
    text: 使是君爲堯舜之君哉吾豈若使是民
  - page: 339
    col: 9
    role: j
    text: 爲堯舜之民哉吾豈若於吾身親見之
  - page: 339
    col: 10
    role: j
    text: 哉
  - page: 339
    col: 11
    role: z
    text: 幡然變動之貌於吾身親見之言於
  - page: 339
    col: 12
    role: z
    text: 我之身親見其道之行不徒誦說向
  - page: 339
    col: 13
    role: z
    text: 慕之而已也
  - page: 339
    col: 14
    role: j
    text: 天之生此民也使先知覺後知使先覺
  - page: 339
    col: 15
    role: j
    text: 覺後覺也予天民之先覺者也予將以
  - page: 339
    col: 16
    role: j
    text: 斯道覺斯民也非予覺之而誰也
  - page: 340
    col: 1
    role: z
    text: 此亦伊尹之言也知謂識其事之當
  - page: 340
    col: 2
    role: z
    text: 然覺謂悟其理之所以然覺後知後
  - page: 340
    col: 3
    role: z
    text: 覺如呼寐者而使之寤也言天使者
  - page: 340
    col: 4
    role: z
    text: 天理當然若使之也○程子曰予天
  - page: 340
    col: 5
    role: z
    text: 民之先覺謂我乃天生此民中盡得
  - page: 340
    col: 6
    role: z
    text: 民道而先覺者也既爲先覺之民豈
  - page: 340
    col: 7
    role: z
    text: 可不覺其未覺者及彼之覺亦非分
  - page: 340
    col: 8
    role: z
    text: 我所有以予之也皆彼自有此理我
  - page: 340
    col: 9
    role: z
    text: 但能覺之而已
  - page: 340
    col: 10
    role: j
    text: 思天下之民匹夫匹婦有不被堯舜之
  - page: 340
    col: 11
    role: j
    text: 澤者若已推而内之溝中其自任以天
  - page: 340
    col: 12
    role: j
    text: 下之重如此故就湯而說之以伐夏救
  - page: 340
    col: 13
    role: j
    text: 民
  - page: 340
    col: 14
    role: z
    text: 推吐回反内音納說音稅○書曰昔
  - page: 340
    col: 15
    role: z
    text: 先正保衡作我先王曰予弗克俾厥
  - page: 340
    col: 16
    role: z
    text: 后爲堯舜其心愧恥若撻于市一夫
  - page: 341
    col: 1
    role: j
    text: 不獲則曰時予之辜孟子之言蓋取
  - page: 341
    col: 2
    role: j
    text: 諸此是時夏桀無道暴虐其民故欲
  - page: 341
    col: 3
    role: j
    text: 使湯伐夏以救之○徐氏曰伊尹樂
  - page: 341
    col: 4
    role: j
    text: 堯舜之道堯舜揖遜而伊尹說湯以
  - page: 341
    col: 5
    role: z
    text: 伐夏者時之不同義則一也
  - page: 341
    col: 6
    role: j
    text: 吾未聞枉己而正人者也况辱己以正
  - page: 341
    col: 7
    role: j
    text: 天下者乎聖人之行不同也或逺或近
  - page: 341
    col: 8
    role: j
    text: 或去或不去歸潔其身而已矣
  - page: 341
    col: 9
    role: j
    text: 行去聲○辱己甚於枉己正天下難
  - page: 341
    col: 10
    role: j
    text: 於正人若伊尹以割烹要湯辱己甚
  - page: 341
    col: 11
    role: j
    text: 矣何以正天下乎逺謂隱遁也近謂
  - page: 341
    col: 12
    role: j
    text: 仕近君也言聖人之行雖不必同然
  - page: 341
    col: 13
    role: j
    text: 其要歸在潔其身而已伊尹豈肯以
  - page: 341
    col: 14
    role: z
    text: 割烹要湯哉
  - page: 341
    col: 15
    role: j
    text: 吾聞其以堯舜之道要湯未聞以割烹
  - page: 341
    col: 16
    role: j
    text: 也
  - page: 342
    col: 1
    role: j
    text: 林氏曰以堯舜之道要湯者非實以
  - page: 342
    col: 2
    role: j
    text: 是要之也道在此而湯之聘自來耳
  - page: 342
    col: 3
    role: j
    text: 猶子貢言夫子之求之異乎人之求
  - page: 342
    col: 4
    role: j
    text: 之也愚謂此語亦猶前章所論父不
  - page: 342
    col: 5
    role: z
    text: 得而子之意
  - page: 342
    col: 6
    role: j
    text: 伊訓曰天誅造攻自牧宫朕載自亳
  - page: 342
    col: 7
    role: j
    text: 伊訓商書篇名孟子引以證伐夏救
  - page: 342
    col: 8
    role: j
    text: 民之事也今書牧宫作鳴條造載皆
  - page: 342
    col: 9
    role: j
    text: 始也伊尹言始攻桀無道由我始其
  - page: 342
    col: 10
    role: z
    text: 事於亳也
  - page: 342
    col: 11
    role: j
    text: 萬章問曰或謂孔子於衛主癰疽於齊
  - page: 342
    col: 12
    role: j
    text: 主侍人瘠環有諸乎孟子曰否不然也
  - page: 342
    col: 13
    role: j
    text: 好事者爲之也
  - page: 342
    col: 14
    role: j
    text: 癰於容反疽七余反好去聲○主謂舎
  - page: 342
    col: 15
    role: z
    text: 於其家以之爲主人也癰疽瘍醫也
  - page: 342
    col: 16
    role: j
    text: 侍人奄人也瘠姓環名皆時君所近
  - page: 343
    col: 1
    role: j
    text: 狎之人也好事謂喜造言生事之人
  - page: 343
    col: 2
    role: j
    text: 也
  - page: 343
    col: 3
    role: j
    text: 於衛主顏讎由彌子之妻與子路之妻
  - page: 343
    col: 4
    role: j
    text: 兄弟也彌子謂子路曰孔子主我衛卿
  - page: 343
    col: 5
    role: j
    text: 可得也子路以告孔子曰有命孔子進
  - page: 343
    col: 6
    role: j
    text: 以禮退以義得之不得曰有命而主癰
  - page: 343
    col: 7
    role: j
    text: 疽與侍人瘠環是無義無命也
  - page: 343
    col: 8
    role: z
    text: 讎如字又音犨○顏讎由衛之賢大
  - page: 343
    col: 9
    role: z
    text: 夫也史記作顏濁鄒彌子衛靈公幸
  - page: 343
    col: 10
    role: j
    text: 臣彌子瑕也○徐氏曰禮主於辭遜
  - page: 343
    col: 11
    role: j
    text: 故進以禮義主於制斷故退以義難
  - page: 343
    col: 12
    role: j
    text: 進而易退者也在我者有禮義而巳
  - page: 343
    col: 13
    role: z
    text: 得之不得則有命存焉
  - page: 343
    col: 14
    role: j
    text: 孔子不恱於魯衛遭宋桓司馬將要而
  - page: 343
    col: 15
    role: j
    text: 殺之微服而過宋是時孔子當阨主司
  - page: 343
    col: 16
    role: j
    text: 城貞子爲陳侯周臣
  - page: 344
    col: 1
    role: z
    text: 要平聲○不悅不樂居其國也威司
  - page: 344
    col: 2
    role: z
    text: 馬宋大夫向魋也司城正子亦宋大
  - page: 344
    col: 3
    role: z
    text: 夫之賢者也陳侯名周按史記孔子
  - page: 344
    col: 4
    role: z
    text: 爲魯司寇齊人饋女樂以間之孔子
  - page: 344
    col: 5
    role: z
    text: 遂行適衛月餘去衛適宋司馬魋欲
  - page: 344
    col: 6
    role: z
    text: 殺孔子孔子去至陳主於司城正子
  - page: 344
    col: 7
    role: z
    text: 孟子言孔子雖當阨難然猶擇所主
  - page: 344
    col: 8
    role: z
    text: 況在齊衛無事之時豈有主癰疽侍
  - page: 344
    col: 9
    role: z
    text: 人之事乎
  - page: 344
    col: 10
    role: j
    text: 吾聞觀近臣以其所爲主觀遠臣以其
  - page: 344
    col: 11
    role: j
    text: 所主若孔子主癰疽與侍人瘠環何以
  - page: 344
    col: 12
    role: j
    text: 爲孔子
  - page: 344
    col: 13
    role: z
    text: 近臣在朝之臣遠臣遠方來仕者君
  - page: 344
    col: 14
    role: z
    text: 子小人各從其類故觀其所爲主與
  - page: 344
    col: 15
    role: z
    text: 其所主者而其人可知
  - page: 344
    col: 16
    role: j
    text: 萬章問曰或曰百里奚自鬻於秦養牲
  - page: 345
    col: 1
    role: j
    text: 者五羊之皮食牛以要秦穆公信乎孟
  - page: 345
    col: 2
    role: j
    text: 子曰否不然好事者爲之也
  - page: 345
    col: 3
    role: j
    text: 食音嗣好去聲下同○百里奚虞之
  - page: 345
    col: 4
    role: j
    text: 賢臣人言其自賣於秦養牲者之家
  - page: 345
    col: 5
    role: j
    text: 得五羊之皮而爲之食牛因以干秦
  - page: 345
    col: 6
    role: z
    text: 穆公也
  - page: 345
    col: 7
    role: j
    text: 百里奚虞人也晉人以垂棘之璧與屈
  - page: 345
    col: 8
    role: j
    text: 產之乘假道於虞以伐虢宫之奇諫百
  - page: 345
    col: 9
    role: j
    text: 里奚不諫
  - page: 345
    col: 10
    role: z
    text: 屈求勿反乘去聲○虞虢皆國名垂
  - page: 345
    col: 11
    role: z
    text: 棘之璧垂棘之地所出之璧也屈產
  - page: 345
    col: 12
    role: z
    text: 之乘屈地所生之良馬也乘四匹也
  - page: 345
    col: 13
    role: z
    text: 晉欲伐虢道經於虞故以此物借道
  - page: 345
    col: 14
    role: z
    text: 其實欲并取虞宫之奇亦虞之賢臣
  - page: 345
    col: 15
    role: z
    text: 諫虞公令勿許虞公不用遂爲晉所
  - page: 345
    col: 16
    role: z
    text: 滅百里奚知其不可諫故不諫而去
  - page: 346
    col: 1
    role: j
    text: 之秦
  - page: 346
    col: 2
    role: j
    text: 知虞公之不可諫而去之秦年已七十
  - page: 346
    col: 3
    role: j
    text: 矣曾不知以食牛干秦穆公之爲汙也
  - page: 346
    col: 4
    role: j
    text: 可謂智乎不可諫而不諫可謂不智乎
  - page: 346
    col: 5
    role: j
    text: 知虞公之將亡而先去之不可謂不智
  - page: 346
    col: 6
    role: j
    text: 也時舉於秦知穆公之可與有行也而
  - page: 346
    col: 7
    role: j
    text: 相之可謂不智乎相秦而顯其君於天
  - page: 346
    col: 8
    role: j
    text: 下可傳於後世不賢而能之乎自鬻以
  - page: 346
    col: 9
    role: j
    text: 成其君鄉黨自好者不爲而謂賢者爲
  - page: 346
    col: 10
    role: j
    text: 之乎
  - page: 346
    col: 11
    role: z
    text: 相去聲○自好自愛其身之人也孟
  - page: 346
    col: 12
    role: z
    text: 子言百里奚之智如此必知食牛以
  - page: 346
    col: 13
    role: z
    text: 千主之爲汙其賢又如此必不肯自
  - page: 346
    col: 14
    role: z
    text: 鬻以成其君也然此事當孟子時已
  - page: 346
    col: 15
    role: z
    text: 無所據孟子直以事理反覆推之而
  - page: 346
    col: 16
    role: z
    text: 知其必不然耳○范氏曰古之聖賢
  - page: 347
    col: 1
    role: j
    text: 未遇之時鄙賤之事不恥爲之如百
  - page: 347
    col: 2
    role: j
    text: 里奚爲人養牛無足怪也惟是人君
  - page: 347
    col: 3
    role: j
    text: 不致敬盡禮則不可得而見豈有先
  - page: 347
    col: 4
    role: j
    text: 自汙辱以要其君哉莊周曰百里奚
  - page: 347
    col: 5
    role: j
    text: 爵祿不入於心故飯牛而牛肥使穆
  - page: 347
    col: 6
    role: j
    text: 公忘其賤而與之政亦可謂知百里
  - page: 347
    col: 7
    role: j
    text: 奚矣伊尹百里奚之事皆聖賢出處
  - page: 347
    col: 8
    role: j
    text: 之大節故孟子不得不辯○尹氏曰
  - page: 347
    col: 9
    role: j
    text: 當時好事者之論大率類此蓋以其
  - page: 347
    col: 10
    role: j
    text: 不正之心度聖賢也
