# 孟子注疏卷12（孫奭疏）：j 為經文，漢趙岐注為注，z 為疏文。
sections:
  - id: juan12
    name: 正文
    blocks:
      - { type: z, text: "告子者，告，姓也；子，男子之通称也；名不害。兼治儒墨之道者，尝学於孟子，而不能纯彻性命之理。《论语》曰：“子罕言命。”谓性命难言也。以告子能执弟子之问，故以题篇。正义曰：此篇首论告子言性，所以次於《万章》问孝之篇者，以其为孝之道，其本在性也，故此篇首以告子之言性，遂为篇题，次於《万章》，不亦宜乎。此篇凡三十六章，赵氏分之以成上下卷。此卷凡二十章而已。一章言养性长义，顺夫自然，残木为器，变而後成。二章言人之欲善，由水好下，迫势激跃，失其素真。三章言人之性与善俱生。四章言明仁义由内，以晓告子。五章言公都告子受命，然後乃理。六章言天之生人，皆有善性，引而之，善恶异衢。其七章言人廪性俱有好憎，或为君子，或为小人，犹麦不齐，雨露使然也。八章言秉心持正，使邪不干，犹止斧斤，不伐牛山，则山木茂，人则称仁。九章言弈为小数，不精不能，一人善之，十人恶之，若竭其道，何由智哉？十章言舍生取义，义之大者也。十一章言由路求心，为得其本。十二章言舍大恶小，不知其要。十三章言莫知养身，而养其树木。十四章言养其行，治其政，俱用智力，善恶相厉，是以君子居处思义，饮食思礼。十五章言天与人性，先立其大。十六章言古人修天爵，自乐之也，今要人爵，以诱待也，得人弃天，道之忌也，或以招之，小人事也。十七章言所贵在身，人不知求。十八章言为仁不至，不反求诸己，谓水胜火，熄而後已，不仁之甚，终为亡矣。十九章言功毁几成，人在慎终，五不熟，荑稗是胜，是以为仁，必其成也。二十章言彀张规矩，以喻为仁，学不为仁，由是二教，失其法而行之者也。其馀十六章，赵氏分在下卷，各有叙焉。○注“告子者姓”至“篇题”。○正义曰：云“告子名不害”者，《尽心篇》有浩生不害，疑为告子，姓告名不害，以浩生为字。赵注又云：浩生姓，名不害。又为二人。其佗经传未详甚人。云《论语》子罕言命，盖《论语》第九篇首云也，故以题其篇。" }
      - { type: j, text: "告子曰：“性，犹杞柳也；义，犹杯卷也。以人性为仁义，犹以杞柳为杯卷。”" }
      - { type: z, text: "告子以为人性为才干，义为成器，犹以杞柳之木为杯卷也。杞柳，柜柳也。一曰杞，木名也，《诗》云：“北山有杞。”杯卷，杯素也。" }
      - { type: j, text: "孟子曰：“子能顺杞柳之性而以为杯卷乎？将戕贼杞柳而後以为杯卷也？" }
      - { type: z, text: "戕犹残也，《春秋传》曰：“戕舟发梁。”所能顺完杞柳，不伤其性，而成其杯卷乎？将斤斧残贼之，乃可以为杯卷乎？言必残贼也。" }
      - { type: j, text: "如将贼杞柳而以为杯卷，则亦将戕贼人以为仁义与？" }
      - { type: z, text: "孟子言以人身为仁义，岂可复残伤其形体乃成仁义邪？明不可此杯卷。" }
      - { type: j, text: "率天下之人而祸仁义者，必子之言夫。”" }
      - { type: z, text: "以告子转性为仁义，若转木以成器，必残贼之，故言率人以祸仁义者，必子之言。夫，盖叹辞也。“告子”至“言夫”。○正义曰：此章指言养性长义，顺夫自然，残木为器，变而後成。告子道偏，见有不纯，仁内义外，违人之端。孟子拂之，不假以言也。“告子曰”至“为杯卷”，告子言人之性譬若杞柳，义若杯卷也。以人之性为其仁义之道，若以杞柳之木为之杯卷也。杞，枸杞也。柳，少杨也。杯，素朴也。卷，器之似屈转木作也。以其杞柳可以柔而作卷也。“孟子曰：子能顺杞柳之性为杯卷乎”至“必子之言夫”，孟子乃拂之曰：子能顺杞柳之木性以为杯卷乎？以其将以斤斧残贼其杞柳然後为之杯卷也。如将斤斧残贼杞柳而以为之杯卷，是亦将残贼人之形躯然後以为仁义与。且驱天下之之人而残祸仁义之道者，是亦必子之此言也。孟子所以拂之以此，盖谓人之性仁义，固有不可比之杯卷以杞柳为之也。○注“杞柳柜柳”至“素”。正义曰：案《说文》云：“杞，枸杞。”“柳，少杨也。”“杯，<匚赣>也。”“卷，屈木盂也，所谓器似升屈木作是也。”《诗》云“北山有杞”，《南山有台》文也。" }
      - { type: j, text: "告子曰：“性犹湍水也，决诸东方则东流，决诸西方则西流。人性之无分於善不善也，犹水之无分於东西也。”" }
      - { type: z, text: "湍者圜也，谓湍水湍萦水也。告子以喻人性若是水也，善恶随物而化，无本善不善之性也。" }
      - { type: j, text: "孟子曰：“水信无分於东西，无分於上下乎？人性之善也，犹水之就下也。人无有不善，水无有不下。今夫水搏而跃之，可使过颡；激而行之，可使在山：是岂水之性哉？其势则然也。人之可使为不善，其性亦犹是也。”" }
      - { type: z, text: "孟子曰：水诚无分於东西，故决之而往也，水岂无分於上下乎？水性但欲下耳。人性生而有善，犹水之欲下也。所以知人皆有善性，似水无有不下者也。跃，跳。颡，额也。人以手跳水，可使过颡，激之可令上山，皆迫於势耳，非水之性也。人之可使为不善，非顺其性也，亦妄为利欲之势所诱迫耳，犹是水也。言其本性非不善也。“告子”至“是也”。○正义曰：此章指言人之欲善，犹水好下，迫势激跃，失其素真，是以守正性为君子，随曲折为小人者也。“告子曰性犹湍水也”至“东西也”，告子言人之性犹萦回之水也。湍，圜，萦回之势也。萦回之水，决之使流於东方则东流之，使之流西方则西流之。而人之性，无分於为善为不善也，如萦回之之水，无分於东西也。“孟子曰”至“是也”，孟子言水之性无分於东西上下乎？言有分於东西上下也。人性之善也，犹水之就下也，人无有性之不善者，水无有不就下者。今夫水之势，抟而跳之，可使过颡；激而行之，可令上山：如此，岂水性如是哉？是其势如是也。人之性所以可使为不善者，亦若此水之势也。以其人之性不善，乃利欲而诱迫之也，亦搏激其水之谓也。○注“湍者圜也”。○正义曰：《说文》云：“湍，急濑水。”又云：“濑，水流沙上也。”今谓萦回之水者，言其水流沙上，萦回之势，湍湍然也。" }
      - { type: j, text: "告子曰：“生之谓性。”" }
      - { type: z, text: "凡物生同类者皆同性。" }
      - { type: j, text: "孟子曰：“生之谓性也，犹白之谓白与？”" }
      - { type: z, text: "犹见白物皆谓之同白，无异性。" }
      - { type: j, text: "曰：“然。”" }
      - { type: z, text: "告子曰然。" }
      - { type: j, text: "“白羽之白也，犹白雪之白；白雪之白，犹白玉之白欤？”" }
      - { type: z, text: "孟子以为羽性轻，雪性消，玉性坚，虽俱白，其性不同。问告子，以三白之性同邪？" }
      - { type: j, text: "曰：“然。”" }
      - { type: z, text: "告子曰然，诚以为同也。" }
      - { type: j, text: "“然则犬之性犹牛之性，牛之性犹人之性欤？”" }
      - { type: z, text: "孟子言犬之性岂与牛同所欲，牛之性岂与人同所欲乎？“告子曰生之”至“性欤”。正义曰：此章指言物虽有性，性各殊异，惟人之性，与善俱生，赤子入井，以发其诚，告子一之，知其粗矣，孟子精之，是在其中。“告子曰生之谓性”，告子言人之生与物之生皆谓之性，以其为同也。“孟子曰生之谓性也，犹白之谓白欤”，孟子见告子以为凡物生同谓之性，故问之曰：然则生之谓性，是如凡物之白皆谓同白，无异性也。“曰然”，告子以为诚如是也。“白羽之白也，犹白雪之白；白雪之白，犹白玉之白欤”，孟子又言是则白羽毛之白，亦如白雪之白；白雪之白，亦如白玉之白欤？故以此三者问告子，然孟子以谓羽毛之白，则其性轻；白雪之白，其性易消；白玉之白，其性坚：是其性有不同其白也。“曰然”，告子不知为有异，故亦以为诚然也。言则同也。“然则犬之性犹牛之性，牛之性犹人之性欤”，孟子曰：又如是，则犬狗之性犹牛之性，牛之性亦犹人之性与？孟子所以言此者，以其犬之性，金畜也，故其性守；牛之性，土畜也，故其性顺；夫人受天地之中，万物俱备於我者也，是其廪阴与阳之气所生也，故其性能柔能刚：是为不同者。告子不知，但知其粗者也。" }
      - { type: j, text: "告子曰：“食、色，性也。仁，内也，非外也。义，外也，非内也。”" }
      - { type: z, text: "人之甘食、悦色者，人之性也。仁由内出，义在外也，不从己身出也。" }
      - { type: j, text: "孟子曰：“何以谓仁内义外也？”" }
      - { type: z, text: "孟子怪告子是言也。" }
      - { type: j, text: "曰：“彼长而我长之，非有长於我也。犹彼白而我白之，从其白於外也，故谓之外也。”" }
      - { type: z, text: "告子言见彼人年老长大，故我长敬之。长大者，非在我者也，犹白色见於外者也。" }
      - { type: j, text: "曰：“异於白马之白也，无以异於白人之白也。不识长马之长也，无以异於长人之长欤？且谓长者义乎？长之者义乎？”" }
      - { type: z, text: "孟子曰：长异於白，白马白人，同谓之白可也，不知敬老马无异於敬老人邪。且谓老者为义义乎？将谓敬老者为有义乎？且敬老者，己也，何以为外也。" }
      - { type: j, text: "曰：“吾弟则爱之，秦人之弟则不爱也，是以我为悦者也，故谓之内。长楚人之长，亦长吾之长，是以长为悦者也，故谓之外也。”" }
      - { type: z, text: "告子曰：爱从己则己心悦，故谓之内。所悦喜老者在外，故曰外也。" }
      - { type: j, text: "曰：“耆秦人之炙，无以异於耆吾炙。夫物则亦有然者也，然则耆炙亦有外欤？”" }
      - { type: z, text: "孟子曰：耆炙同等，情出於中。敬楚人之老，与敬己之老，亦同己情性敬之。虽非己炙，同美，故曰物则有然者也。如耆炙之意，岂在外邪。言楚、秦，喻远也。“告子曰食色”至“亦有外欤”。○正义曰：此章指言事者虽从外，行其事者，皆发於中。明仁、义由内，所以晓告子之惑者也。“告子曰：食、色，性也。仁，内也，非外也。义，外也，非内也”，告子言人之嗜其甘食，悦其好色，是人之性也。仁在我为内，非自外而入者也；义在彼非在我，故为外也，非内也。“孟子曰：何以谓仁内义外也”，孟子见告子以为仁内义外，故问之曰：何以为仁内义外？“曰彼长而我长之”至“故谓之外也”，告子言彼人之年老，而我从而敬长之，非有长在我也。如彼物之色白，而我从而白之，是从其白於外也，我故谓义为在外也。“曰：异於白马之白也，无以异於白人之白也。不识长马之长也，无以异於长人之长欤？且谓长者义乎，长之者义乎”，孟子又辟之曰：彼长而我长之，异於彼白而我白之也。於白马之色白，无以异於白人之色白也，是则同也，不知长老马无以异於长人之长老乎？以其是则有异也。盖白马之白，与白人之白者，彼白而我白之耳，我何容心於其间哉，固无异也；长马之长，与长人之长，则有钦不钦之心矣，此所以有异焉。以其长人之长者有钦，长马之长者无钦，是则长者在彼，长之者在我，而义自长之者生，非自长者生也。如此，告子何得谓之外乎？故问之曰：且谓长者为有义乎，长之者为有义乎？“曰吾弟则爱之”至“故谓之外也”，告子又谓我之弟则亲爱之，秦人之弟则我不爱，是爱以我为悦者也，爱主仁，故谓仁为内也；敬长楚人之长者，亦敬长吾之长者，是以长为悦者也，长主义，故谓义为外也。“曰耆秦人之炙，无以异於耆吾炙”至“亦有外欤”，孟子又以秦人之炙而排之，曰：好秦人之炙，无以异於好吾之炙，为物耳，则亦有如是也，然则好炙亦有外欤？且孟子所以排之以此者，盖谓仁、义皆内也。以其秦人之弟则不爱，吾弟则爱之，爱与不爱，是皆自我者也，告子谓之以我为悦，则是矣；吾之长者吾长之，楚人之长吾亦长之，长之亦皆自我者也，告子又谓之以长为悦，则非矣。是亦犹秦人之炙与吾之炙虽不同，而嗜之者，皆自我也。如是，则义果非生於外者也。云炙实，《周书》曰“黄帝始燔肉为炙”是也。秦、楚，所以喻外。" }
      - { type: j, text: "孟季子问公都子曰：“何以谓义内也？”" }
      - { type: z, text: "季子亦以为义外也。" }
      - { type: j, text: "曰：“行吾敬，故谓之内也。”" }
      - { type: z, text: "公都子曰：以敬在心而行之，故言内也。" }
      - { type: j, text: "“乡人长於伯兄一岁，则谁敬？”" }
      - { type: z, text: "季子曰：敬谁也？" }
      - { type: j, text: "曰：“敬兄。”" }
      - { type: z, text: "公子都曰：当敬兄也。" }
      - { type: j, text: "“酌则谁先？”" }
      - { type: z, text: "季子曰：酌酒则谁先酌？" }
      - { type: j, text: "曰：“先酌乡人。”" }
      - { type: z, text: "公都子曰：当先乡人。" }
      - { type: j, text: "“所敬在此，所长在彼，果在外非由内也。”" }
      - { type: z, text: "季子曰：所敬者兄也，所酌者乡人也。如此，义果在外不由内也。果犹竟也。" }
      - { type: j, text: "公都子不能答，以告孟子。" }
      - { type: z, text: "公都子无以答季子之问。" }
      - { type: j, text: "孟子曰：“敬叔父乎？敬弟乎？彼将曰：‘敬叔父。’曰：‘弟为尸则谁敬？’彼将曰：‘敬弟。’子曰：‘恶在其敬叔父也？’彼将曰：‘在位故也。’子亦曰：‘在位故也。’庸敬在兄，斯须之敬在乡人。”" }
      - { type: z, text: "孟子使公都子答季子如此，言弟以在尸位，故敬之；乡人以在宾位，故先酌之耳。庸，常也。常敬在兄，斯须之敬在乡人。" }
      - { type: j, text: "季子闻之，曰：“敬叔父则敬，敬弟则敬，果在外，非由内也。”" }
      - { type: z, text: "随敬所在而敬之，果在外。" }
      - { type: j, text: "公都曰：“冬日则饮汤，夏日则饮水，然则饮食亦在外也。”" }
      - { type: z, text: "汤、水虽异名，其得寒、温者中心也。虽随敬之所在，亦中心敬之，犹饮食从人所欲，岂可复谓之外也？“孟季”至“食亦在外也”。○正义曰：此章指言凡人随形，不本其原，贤者达情，知所以然。季子信之，犹若告子，公都受命，然後乃理。“孟季子问公都子曰：何以谓义内也”，孟季子犹若告子，以为义外，故问孟子弟子公都子曰：何以谓义为内也？“曰行吾敬，故谓之内也”，公都子答之，曰所敬在心而行之，故谓义为内也。“乡人长於伯兄一岁，则谁敬”，季子又问之曰：乡之人有长於己之伯兄一岁，则当敬谁。“曰敬兄”，公都子曰：当敬己之兄也。“酌则谁先”，季子又问之曰如在筵则酌酒先酌谁。“曰先酌乡人”，公都子曰：当先酌乡人也。“所敬在此，所长在彼，果在外，非由内也”，季子又言所敬在兄，是敬在此；酌在乡人，是所长在彼：是义果在外者也，非由内而出之也。“公都子不能答，以告孟子”，公都子於此遂无言以应答，而乃告知於孟子。“孟子曰”至“斯须之敬在乡人”，孟子谓公都子曰敬叔父乎？敬弟乎？彼季子将曰敬叔父；则问之曰弟为主，则谁敬？彼季子将曰敬弟；则又问之曰：如敬弟，则安在敬其叔父也？彼季子将曰弟在位，故敬之也。子亦与之曰：所以先酌乡人者，亦以在宾之位，故先酌之也。言常敬者在兄，斯须少顷之敬在乡人也。“季子闻之”至“非由内也”，季子闻孟子此言，故谓之曰：敬叔父则敬之，敬己之弟则亦敬之，是随敬所有，则敬在外，非由内也。“公都子曰：冬日则饮汤”至“亦在外也”，公都子由孟子教之，以此乃晓其理，故自又以冬夏所饮比喻而晓季子之惑也。言冬寒之日则饮汤，夏热之日则饮水，如是则饮食亦有在外者也？盖谓汤、水虽异名，然得其寒、热而饮之者，在我之中心然也，犹敬叔父、敬弟虽有异，然而能敬之者在我而已。敬在我，则敬在心而出之者也，安得谓之在外乎？季子即下卷所谓季任，为任处守者。" }
      - { type: j, text: "公都子曰：“告子曰：‘性无善无不善也。’" }
      - { type: z, text: "公都子道告子以为人性在化，无本善不善也。" }
      - { type: j, text: "或曰：‘性可以为善，可以为不善。是故文、武兴则民好善，幽、厉兴则民好暴。’" }
      - { type: z, text: "公都子曰：或人以为可教以善、不善，亦由告子之意也。故文、武圣化之起，民皆喜为善；幽、厉虐政之起，民皆好暴乱。" }
      - { type: j, text: "或曰：‘有性善，有性不善。是故以尧为君而有象，以瞽瞍为父而有舜，以纣为兄之子且以为君而有微子启、王子比干。’" }
      - { type: z, text: "公都子曰：或人者以为各有性，善恶不可化移，尧为君，象为臣，不能使之为善；瞽瞍为父，不能化舜为恶；纣为君，又与微子、比干有兄弟之亲，亦不能使其二子为不仁：是亦各有性也矣。" }
      - { type: j, text: "今曰性善，然则彼皆非欤？”" }
      - { type: z, text: "公都子曰：告子之徒，其论如此，今孟子曰人性尽善，然则彼之所言皆为非欤？" }
      - { type: j, text: "孟子曰：“乃若其情，则可以为善矣，乃所谓善也。若夫为不善，非才之罪也。" }
      - { type: z, text: "若，顺也。性与情相为表里，性善胜情，情则从之。《孝经》云“此哀戚之情”，情从性也。能顺此情，使之善者，真所谓善也。若随人而强作善者，非善者之善也。若为不善者，非所受天才之罪，物动之故也。" }
      - { type: j, text: "恻隐之心，人皆有之。羞恶之心，人皆有之。恭敬之心，人皆有之。是非之心，人皆有之。恻隐之心，仁也。羞恶之心，义也。恭敬之心，礼也。是非之心，智也。仁、义、礼、智，非由外铄我也，我固有之也，弗思耳矣。故曰求则得之，舍则失之。或相倍蓰，而无者，不能尽其才者也。" }
      - { type: z, text: "仁、义、礼、智，人皆有其端，怀之於内，非从外销铄我也。求存之，则可得而用之；舍纵之，则亡失之矣。故人之善、恶，或相倍蓰，或至於无者，不能相与计多少，言其绝远也。所以恶乃至是者，不能自尽其才性也。故使有恶人，非天独与此人恶性。其有下愚不移者也，譬若乎被疾不成之人，所谓童昏也。" }
      - { type: j, text: "《诗》曰：‘天生蒸民，有物有则。民之秉彝，好是懿德。’孔子曰：‘为此《诗》者，其知道乎！故有物必有则，民之秉彝也，故好是懿德。”" }
      - { type: z, text: "《诗·大雅·蒸民》之篇。言天生蒸民，有物则有所法则，人法天也。民之秉夷，夷，常也，常好美德，孔子谓之知道。故曰人皆有是善者也。“公都子曰”至“懿德”。○正义曰：此章指言天之生人，皆有善性，引而趋之，善恶异衢，高下自悬，贤愚舛殊，寻其本者，乃能一诸。“公都子曰”至“然则彼皆非与”者，公都子问孟子，以谓告子言人之性无有善，亦无有不善，但在人之所为如何耳。或有谓人性可以为善，又可以为不善，但在上所化如何耳，如此，故文王、武王兴起，常以善养人，则民人皆好善；至幽王、厉王兴起，常以政暴虐於民，则民亦皆好其暴乱。或有人又谓人有性善，有性不善，非在所化，廪之於天而已，如此，故以尧帝之为君，而有象之傲为臣；以瞽瞍之顽为父，而有舜之圣为子；以纣为兄之子且以为君，而有微子启、王子比干之贤为臣。今孟子乃曰性皆善，是则彼告子与或人之言者皆不是欤？故以此问孟子。“孟子曰：乃若其情，则可以为善矣”至“好是懿德”，孟子言人之乃顺其情，则皆可以为善矣，是所谓性善也。若夫人为不善者，非天之降才尔殊也，其所以为不善者，乃自汨丧之耳，故言非廪天才之罪也。且情、性、才三者，合而言之，则一物耳；分而言之，则有三名，故曰性，曰情，曰才。盖人之性，本则善之，而欲为善者，非性也，以其情然也；情之能为善者，非情然也，以其才也。是则性之动则为情，而情者未尝不好善而恶恶者也，其不欲为善者乎？而才者乃性之用也，而才者上有以达乎天，下有以达乎地，中有以贯乎人，其有不能为善者乎？此孟子所以曰：“乃若其情，则可以为善矣，乃所谓善也。若夫为不善，非才之罪也。”言“恻隐之心，人皆有之”至“智也”者，已说於前矣。盖以恻隐、羞恶、恭敬、是非之心，人皆有是心也，人能顺此而为之，是谓仁、义、礼、智也，仁、义、礼、智即善也。然而仁、义、礼、智之善，非自外销铄我而亡之也，我有生之初固有之也，但人不思而求之耳，故曰求则得而存，舍而弗求则亡之矣。然人所以有善有恶，其善恶相去之远，或相倍蓰，或至於不可计其多少，如此之绝远者，是不能自尽其性才者也。言才无有不能为善者矣，但不能尽其才而为之耳。故《诗·大雅·蒸民》之篇有曰：上天之生众民，有物则有所法，则民之秉执其常善，故好是美德而已。所谓常即善也，所谓善即美德也，谓美德者，即仁、义、礼、智是也。孔子常亦云为此诗之人，其能知道者也，故言有物必有则，民之秉彝，故好是懿德也。然所谓物者，即自人之四肢、五脏、六腑、九窍，达之於君臣、父子、夫妇、兄弟、朋友，无非物也；所谓则者，即仁之於父子，义之於君臣，礼之於夫妇、兄弟，信之於朋友也：是无非有物则有则也。由此观之，孟子所以言至此者，岂非人性皆善者邪？故有物必有则，是谓性之善也；能秉其彝，是谓才也；好是懿德，是谓情也。“有物有则，民之秉彝，好是懿德”，是能顺其情以为善而才从之者也。○注“纣与微子比干有兄弟之亲”。○正义曰：案《史记·世家》云：“微子启者，殷帝乙之首子，而纣之庶兄也。”又云：“王子比干者，亦纣之亲戚也。”是知有兄弟之亲矣。○注“《大雅·蒸民》之诗”。○正义曰：此盖尹吉甫美宣王之诗文也。" }
      - { type: j, text: "孟子曰：“富岁，子弟多赖；凶岁，子弟多暴。非天之降才尔殊也，其所以陷溺其心者然也。" }
      - { type: z, text: "富岁，丰年也。凶岁，饥馑也。子弟，凡人之子弟也。赖，善。暴，恶也。非天降下才性与之异也，以饥寒之厄陷溺其心，使为恶者也。" }
      - { type: j, text: "今夫麦，播种而之，其地同，树之时又同，氵孛然而生，至於日至之时，皆孰矣。虽有不同，则地有肥硗，雨露之养、人事之不齐也。" }
      - { type: z, text: "麦，大麦也。《诗》云：“贻我来。”言人性之同，如此麦，其不同者，人事、雨泽有不足，地之有肥、硗耳。硗，薄也。" }
      - { type: j, text: "故凡同类者举相似也，何独至於人而疑之？圣人与我同类者。" }
      - { type: z, text: "圣人亦人也，其相觉者，以心知耳。故体类与人同，故举相似也。" }
      - { type: j, text: "故龙子曰：‘不知足而为屦，我知其不为蒉也。’屦之相似，天下之足同也。" }
      - { type: z, text: "龙子，古贤人也。虽不知足小大，作屦者犹不更作蒉。蒉，草器也。以屦相似，天下之足略同故也。" }
      - { type: j, text: "口之於味有同耆也，易牙先得我口之所耆者也。如使口之於味也，其性与人殊，若犬、马之与我不同类也，则天下何耆皆从易牙之於味也。至於味，天下期於易牙，是天下之口相似也。" }
      - { type: z, text: "人口之所耆者相似，故皆以易牙为知味，言口之同也。" }
      - { type: j, text: "惟耳亦然。至於声，天下期於师旷，是天下之耳相似也。" }
      - { type: z, text: "耳亦犹口也，天下皆以师旷为知声之微妙也。" }
      - { type: j, text: "惟目亦然。至於子都，天下莫不知其姣也。不知子都之姣者，无目者也。" }
      - { type: z, text: "目亦犹耳也。子都，古之姣好者也。《诗》云：“不见子都，乃见狂且。”傥无目者，乃不知子都好耳，言目之同也。" }
      - { type: j, text: "故曰：口之於味也，有同耆焉；耳之於声也，有同听焉；目之於色也，有同美焉。至於心，独无所同然乎？" }
      - { type: z, text: "言人之心性皆同也。" }
      - { type: j, text: "心之所同然者何也？谓理也，义也。圣人先得我心之所同然耳。故理、义之悦我心，犹刍豢之悦我口。”" }
      - { type: z, text: "心所同耆者，义理也。理者，得道之理。圣人先得理义之要耳。理义之悦心，如刍豢之悦口，谁不同也。“孟子曰”至“我口”。○正义曰：此章指言人廪性俱有好憎，耳目口心，所悦者同，或为君子，或为小人，犹麦不齐，雨露使然者也。孟子言是，所以勖而进之。“孟子曰：富岁，子弟多赖”至“犹刍豢之悦我口”者，孟子言丰熟之年，凡人之子弟，多好善，赖，善也；凶荒之年，凡人之子弟，多好暴恶。然而非上天降下才性与之殊异也，而其所以由饥寒之厄陷溺，去其良心而为之恶也。无他，所谓礼义生於富足，盗贼起於贫穷是也。且譬夫今之大麦也，人播种而锄之，其地高下以同，艺殖之时又同，氵孛氵孛然而生长秀茂，至於日至可以收割之时，皆熟矣。虽有不同，为不熟者，则是地有肥薄与雨露之不均，而人事之所加有不齐也。故凡物有同其类者，皆相似也，何独至於人而疑为不然？虽圣人亦则与我同其类者也。故龙子之贤人，有曰：人不知天下人之足而为草屦者，我知其人不能为之蒉也。蒉，草器也。其所以为屦皆相似者，以其天下人之足则同也。故口之於食味，人有同耆也，然而易牙先得我口之所好者也。如使人口於味，其性之所好，与人殊异，有是若狗、马之与我不同其形类也，则天下何以耆其味皆从易牙所好之味也。至於食味，天下所以皆期指於易牙者，是天下之人口相似也。不特口之於味然也，惟耳於声亦如是也。耳於声，天下之人所以皆期指於师旷为知声之妙者，是天下之人耳相似也。又不特耳如是也，惟天下之目亦如是也。至於子都者，天下之人无有不知其姣好也，不知子都之姣好者，是无目之人也。故曰人口之於味，其有所同好者焉；耳之於声，以其有同听者焉；目之於色，以其有同美者焉。至於心，独无所同亦如是乎？言人心性亦若口、耳皆有同而无异也。然人心有所同然者何也？是谓理也，义也，惟圣人者但先得我心之所同然耳。故曰理义之有喜悦於我心者，如刍豢之味有悦於我口耳。盖理出於性命，天之所为也；义出於道德，人之所为也：而理、义又出於人心所同然也。是则天之使我有是之谓命，天命之谓性，是性命本乎天，故为天之所为也。天之所为虽妙，然而未尝不有理焉，如此，岂非其理有出於性命者乎！人能存其性命而不失之者，是所谓有其道德也，故为人之所为者也。人之所为道德虽妙，然而未尝不有义存焉，如此，则岂非其义有出於人心者乎！合而言之，则性命道德是为理义，虽是理义，出於性命道德者耳。○注“麦”至“薄也”。○正义曰：释云：麦，大麦也，又短粒麦也。“《诗》云贻我来”，此盖《周颂·思文》之篇，言后稷配天之诗也。硗，《说文》云：“硗，石地名也。”○注“易牙为知味”。正义曰：案《左传》云：易牙，齐桓公大夫也。淄、渑二水为食，易牙亦知二水之味。桓公不信，数试始验。是易牙为知味者也。○注“师旷为知声之妙”。○正义曰：案《吕氏春秋》云，已说在《离娄篇》首，《左传》杜氏注云“晋乐师子野者”是也。○注“子都”，诗云：“不见子都，乃见狂且。”○正义曰：案《诗·国风·山有扶苏》之篇文也。注云：“都，世之美好者。狂，狂人也。且，辞也。”笺云：“人之好色，不往睹子都，反往睹狂丑之人。”凡此是知子都为美好者也。○草性曰刍，养曰豢。○正义曰：《说文》云：“牛、马曰刍，犬、豕曰豢。”是其解也。" }
      - { type: j, text: "孟子曰：“牛山之木尝美矣。以其郊於大国也，斧斤伐之，可以为美乎？是其日夜之所息，雨露之所润，非无萌蘖之生焉，牛羊又从而牧之，是以若彼濯濯也。人见其濯濯也，以为未尝有材焉，此岂山之性也哉。" }
      - { type: z, text: "牛山，齐之东南山也。邑外谓之郊。息，长也。濯濯，无草木之貌。牛山未尝盛美，以在国郊，斧斤牛羊使之不得有草木耳，非山之性无草木也。" }
      - { type: j, text: "虽存乎人者，岂无仁义之心哉？其所以放其良心者，亦犹斧斤之於木也，旦旦而伐之，可以为美乎？其日夜之所息，平旦之气，其好恶与人相近也者几希。" }
      - { type: z, text: "存，在也。言虽在人之性，亦犹此山之有草木也，人岂无仁义之心邪？其日夜之思，欲息长仁义，平旦之志气，其好恶，凡人皆有与贤人相近之心。几，岂也。岂希，言不远也。" }
      - { type: j, text: "则其旦昼之所为，有梏亡之矣。梏之反覆，则其夜气不足以存。夜气不足以存，则其违禽兽不远矣。人见其禽兽也，而以为未尝有才焉者，是岂人之情也哉。" }
      - { type: z, text: "旦昼，日昼也。其所为万事有梏乱之，使亡失其日夜之所息也。梏之反覆，利害於其心，其夜气不能复存也。人见恶人禽兽之行，以为未尝存善木性，此非人之情也。" }
      - { type: j, text: "故苟得其养，无物不长；苟失其养，无物不消。孔子曰：‘操则存，舍则亡。出入无时，莫知其乡。’惟心之谓与？”" }
      - { type: z, text: "诚得其养，若雨露於草木，法度於仁义，何有不长也；诚失其养，若斧斤牛羊之消草木，利欲之消仁义，何有不尽也。孔子曰：持之则存，纵之则亡，莫知其乡。乡犹里，以喻居也。独心为若是也。“孟子曰牛山”至“之谓与”。○正义曰：此章指言秉心持正，使邪不干，犹止斧斤，不伐牛山，山则木茂，人则称仁也。“孟子曰牛山之木”至“惟心之谓与”者，孟子言牛山之木，常为秀美矣，然以其为郊国之外也，残之以斤斧之伐，可以为秀美乎？言以其斤斧常伐之，则不可为美也。虽为斤斧所伐，然以其日夜之所长息，雨露之所润泽，非无萌牙丝蘖生焉，柰何萌蘖既生，而牛羊之畜，又从而牧养於其间，是以牛山若彼。濯濯，无草木之貌也。人见其濯濯然无草木，以为牛山未尝有材木焉，是岂牛山之性无草木哉！言牛山之木常有其材木耳，其所以无之者，但斧斤牛羊从而残灭之矣。言虽存在乎人者，岂无仁义之心哉？然人之所以放去其良心而无仁义者，亦如斧斤之伐於牛山之木也。是日日而伐灭之，可为美材乎？言不可为美材也。言牛山日夜之所息长草木，与人平旦之气，其好恶与人相近者不远矣。以其牛山日夜所息长草木，莫不欲秀茂为美，而恶其斧斤、牛羊残害之为恶也。人之平旦之气，尚未有利欲汩之，则气犹静，莫不欲为之善也，而恶为之恶也。但人平旦之气，则其旦昼之所为利欲有以梏亡之矣。平旦则未至於昼，旦昼所以为日之中矣。且人於平旦之时，其气静，未有利欲事绪以动之，则未必不善矣。以其善固存於此时也，亦如牛山日夜所长草木，无以斧斤、牛羊残害之，则未必不美矣。以其萌蘖生焉，而美固己有矣，柰何斧斤、牛羊又从而残灭之，亦若旦昼所为利欲以梏亡之者焉。梏，手械也。利欲之制善，使不得为，犹梏之制手也。梏之反覆，其情绪不一，则夜於平旦之气不足以存。既不足以存，而为利欲万绪梏而亡之，则其违异於禽兽之行不远矣。以其近也。人见其为禽兽之行者，而为未尝有才性焉，是岂人之情为如是哉？言非人之情也，言人情本欲为善矣，其所以终而为者，但利欲从而梏亡之矣。故苟得其所养，无物不长；苟失其所养，无物不消。如牛山苟日夜之所息、雨露之所润，与平旦之气，是得其所养者也，是则无物不长矣。如牛山苟为牛羊从而牧之，与旦昼所为而梏亡之，是失所养者也，是则无物不消矣。孟子又引孔子云：操持之则存，纵舍之则亡，其出入徇物，而不有常时，莫知其所向之乡，惟独心为若是也。凡此孟子所以言人心性本善，但当有常操而存之者矣。○注“牛山，齐之东南山”。○正义曰：盖亦以理推之，亦自可见。故传所谓齐景游於牛山之上，是亦知之为齐之山矣。" }
      - { type: j, text: "孟子曰：“无或乎王之不智也。" }
      - { type: z, text: "王，齐王也。或，怪也。时人有怪王不智而孟子不辅之，故言此也。" }
      - { type: j, text: "虽有天下易生之物也，一日暴之，十日寒之，未有能生者也，吾见亦罕矣。吾退而寒之者至矣，吾如有萌焉？何哉？" }
      - { type: z, text: "种易生之草木五，一日暴温之，十日阴寒以杀之，物何能生？我亦希见於王，既见而退，寒之者至，谓左右佞谄顺意者多。譬诸万物，何由得有萌牙生也？" }
      - { type: j, text: "今夫弈之为数，小数也，不专心致志，则不得也。" }
      - { type: z, text: "弈，博也，或曰围棋。《论语》曰：“不有博弈者乎？”数，技也。虽小技，不专心则不得也。" }
      - { type: j, text: "弈秋，通国之善弈者也，使弈秋诲二人弈，其一人专心致志，惟弈秋之为听；一人虽听之，一心以为有鸿鹄将至，思援弓缴而射之，虽与之俱学，弗若之矣。为是其智弗若与？曰：非然也。”" }
      - { type: z, text: "有人名秋，通一国皆谓之善弈，曰弈秋。使教二人弈，其一人惟秋所善而听之，其一人志欲射鸿鹄，故不如也。为是谓其智不如也，曰：非也，以不致志也。故齐王之不智，亦若是。“孟子曰无或”至“非然也”。○正义曰：此章指言弈为小数，不精不能，一人善之，十人恶之，虽竭其道，何由智哉。《诗》云“济济多士，文王以宁”，此之谓也。“孟子曰：无或乎王之不智也”至“非然也”，孟子言时人无怪齐王之不智也，以其孟子不辅佐之，故云之此。言虽有天下易生之物，如一日温暖以暴之，乃十日寒冻以杀之，是以未有能生者也。虽有能生之者，然於我见之亦少矣。我自辅佐齐王，而退归，而奸佞谄谀齐王者至多矣，然而我尚如有心欲使王萌而为善，是如之何哉！孟子言之以此者，盖谓吾君不能者，是谓贼其君者也，所以言时人无或乎王之不智也，当辅佐君为之而已。孟子辅佐齐王，既退，而奸佞之臣又陷君於为恶，故有激而云此也。盖天下易生之物，譬齐王以为善也。一日暴之，喻孟子一人辅之齐王也。十日寒之，喻奸佞臣之众陷君於为恶也。陷君於为恶者如是之众，则齐王所以不智也。喻未有能生者也。今夫譬之弈秋，但为技数虽小技，如不专一其心，致其笃志，则亦不得精也。是故弈人名秋者，通一国皆称为善能弈者也，使秋诲其二人弈，其一人专心致志，唯弈秋之言是听，一人虽听之，其一心以为有鸿鹄之鸟将至，乃思援弓缴矢而射之，虽与皆学夫弈秋，然亦不若其专心致志者精矣。为是弗若之者，非谓其智弗若也，以其不专心致志而听弈秋之诲故也。此所以曰“为是其智弗若与？”继之曰“非然也”，言不然也。孟子所以引为比者，盖谓齐王如能专心致志，惟贤者是听，则孰不与王为善乎？奈齐王不能专心致志、惟贤是听，但为奸臣之所谀佞，所以如有鸿鹄将至、思援弓缴矢而射之者，故弗若彼之精，而遂不为善矣。然则时人亦不可谓齐王不智，特当辅之而已。然既辅之，亦当齐王能专心致志听从之，然後可矣。孟子所以既退而尚如有萌焉，奈何终辅之，而齐王奸佞谄谀之众而不能听从为善耳。此故以弈秋喻己，而以鸿鹄喻奸佞。其一以为有鸿鹄思援弓缴而射之，喻齐王虽听己之言，然不专心致志，惟在於鸿鹄耳。○注“弈博也”至“不得也”。○正义曰：按《阳货》，《论语》第十七之篇，云“不有博弈者乎”，而解弈为博也。《说文》云：“作博局戏也。六箸，十二棋也。”古者尧曾作博。围棋谓之弈。《说文》：弈从升，言速两手而执之。棋者，所执之子，围而相杀，故谓之围棋。称弈者，又取其落弈之义也。○注“有人名秋善弈”。○正义曰：按传记有云弈秋，通国之善弈也，有过者止而听之，则弈败。笙汩之也。又云疑首，天下之善算也，有鸿鹄过，弯弧拟问以三五，则不知。鸿鹄乱之也。是亦孟子之言与。" }
      - { type: j, text: "孟子曰：“鱼我所欲也，熊掌亦我所欲也，二者不可得兼，舍鱼而取熊掌者也。生亦我所欲也，义亦我所欲也，二者不可得兼，舍生而取义者也。" }
      - { type: z, text: "熊掌，熊蹯也，以喻义。鱼以喻生也。" }
      - { type: j, text: "生亦我所欲，所欲有甚於生者，故不为苟得也。死亦我所恶，所恶有甚於死者，故患有所不辟也。如使人之所欲莫甚於生，则凡可以得生者，何不用也？使人之所恶莫甚於死者，则凡可以辟患者，何不为也。" }
      - { type: z, text: "有甚於生者，谓义也，义者不可苟得。有甚於死者，谓无义也，不苟辟患也。莫甚於生，则苟利而求生矣。莫甚於死，则可辟患，不择善何不为耳。" }
      - { type: j, text: "由是则生而有不用也，由是则可以辟患而有不为也。是故所欲有甚於生者，所恶有甚於死者，非独贤者有是心也，人皆有之，贤者能勿丧耳。" }
      - { type: z, text: "有不用，不用苟生也。有不为，不为苟恶而辟患也。有甚於生，义甚於生也。有甚於死，恶甚於死也。凡人皆有是心，贤者能勿丧亡之也。" }
      - { type: j, text: "一箪食，一豆羹，得之则生，弗得则死。尔而与之，行道之人弗受；蹴尔而与之，乞人不屑也。" }
      - { type: z, text: "人之饿者，得此一器食可以生，不得则死。尔，犹呼尔咄啐之貌也。行道之人，凡人以其贱己，故不肯受也。蹴，蹋也。以足践蹋与之，乞人不洁之，亦由其小，故轻而不受也。" }
      - { type: j, text: "万锺则不辩礼义而受之，万锺於我何加焉？为宫室之美，妻妾之奉，所识穷乏者得我与。" }
      - { type: z, text: "言一箪食则贵礼，至於万锺则不复辩别有礼义与不，钟，量器也。万锺於己身何加益哉？己身不能独食万锺也，岂不为广美宫室，供奉妻妾，施与所知之人穷乏者也。" }
      - { type: j, text: "乡为身死而不受，今为宫室之美为之；乡为身死而不受，今为妻妾之奉为之；乡为身死而不受，今为所识穷乏者得我而为之：是亦不可以已乎！此之谓失其本心。”" }
      - { type: z, text: "乡者不得箪食而食则身死，尚不受也，今为此三者为之，是不亦可以止乎！所谓失其本心者也。“孟子曰鱼”至“失其本心”。正义曰：此章指言舍生取义，义之大者也，箪食、万锺，用有轻重，纵彼纳此，盖违其本，凡人皆然，君子则否，所以殊也。“孟子曰鱼我所欲也”至“失其本心”者，孟子言鱼之为味，我之所欲者也；熊蹯之味，亦我所欲者也。然而鱼与熊蹯，二者不可兼得，但舍去其鱼而取熊蹯也。以其熊蹯之味又有美於鱼也。鱼在水之物，熊蹯在山之物，欲在水，不可兼得於在山者，在山又不可兼得於在水者，故为二者不可兼得也。鱼所以喻生也，熊蹯所以喻义，故曰生亦我所欲也，义亦我所欲也，然而生与义二者亦不可兼得之，但舍生而取义也。以其义又有胜於生也。如勇士不忘丧其元，志士不忘在沟壑，有杀身以成仁，是皆以义有胜於死也，是舍生而取义也。然而生亦为我心之所欲，其以所欲有甚於生者，故不为苟得也；死亦为我心之所恶疾者，其以所恶有甚於死者，故患祸有所不逃辟也。如令人之所欲者无有甚於生，则凡可以得生者，何不用而行之也；令人之恶者无有甚於死者，则凡可以辟患者，何不择而为之也。盖可以得生，可以辟患者，皆是不义也。故不为苟得，故患有所不辟也者，是皆有义也。由此言之，则生而有不用也，是不苟生也；则可以辟患而有不为也，是不苟为恶以辟患也。如此，故所欲有甚於生，所恶者有甚於死，非独贤者有此心也，人皆有此心也，但贤人能常存之而勿丧亡之耳。盖所欲有甚於生者，是义也；所恶有甚於死者，是不义也。且以一箪所盛之食，一豆所盛之羹，得而食之者，则养其生，不得此而食者，则饿而死，然而尔叱咄而与之，虽行道涂之中凡人，且不肯受而食之也；如蹴尔践蹋而与之，虽乞丐之贱人，且以为不洁而不肯受而食也。言万锺之禄，则不贵辨礼义而受之者，虽万锺之多，然於我何足为益焉？於我何益，以其己身不能独食之也。己不能独食，则为宫室之广美，供奉妻妾，施与所知之人穷乏者而已。如是，则乡日不得箪食豆羹则身死尚不受，今乃为宫室广美、供奉妻妾与施所知之人穷乏者而受，为之如此，是亦不可以止乎！言此可以止。而不止者也，是谓失其本心者矣，是忘其义者矣。故本心即义也，所谓贤者但能勿丧亡此本心耳。○注“熊蹯”。○正义曰：按《史记·世家》云：“宰夫而熊蹯不熟，晋灵公怒而杀之。”裴る注云：“服虔曰：蹯，熊掌，其肉难熟。”○注“锺，量器也”。正义曰：齐大夫晏子云，已说在《梁惠篇》。" }
      - { type: j, text: "孟子曰：“仁，人心也。义，人路也。舍其路而弗由，放其心而不知求，哀哉！" }
      - { type: z, text: "不行仁义者，不由路，不求心者也，可哀悯哉。" }
      - { type: j, text: "人有鸡犬放，则知求之；有放心，而不知求。学问之道无他，求其放心而已矣。”" }
      - { type: z, text: "人知求鸡犬，莫知求其心者，惑也。学问所以求之矣。“孟子曰”至“而已矣”。○正义曰：此章指言由路求心，为得其本，追逐鸡狗，务其末也。学以求之详矣。“孟子曰”至“而已矣”者，孟子言仁者是人之心也，是人人皆有之者也；义者是人之路也，是人人皆得而行之者也。今有人乃舍去其路而不行，放散其心而不知求之者，可哀悯哉！且人有鸡犬放之则能求追逐之，有心放离之而不求追复。然而学问之道无他焉，但求其放心而已矣。能求放心，则仁义存矣。以其人之所以学问者，亦以精此仁义也。" }
      - { type: j, text: "孟子曰：“今有无名之指，屈而不信，非疾痛害事也。如有能信之者，则不远秦、楚之路，为指之不若人也。" }
      - { type: z, text: "无名之指，手之第四指也，盖以其馀指皆有名。无名指者，非手之用指也，虽不疾痛妨害於事，犹欲信之，不远秦、楚，为指之不若人故也。" }
      - { type: j, text: "指不若人，则知恶之。心不若人，则不知恶，此之谓不知类也。”" }
      - { type: z, text: "心不若人，可恶之大者也，而反恶指，故曰不知其类也。类，事也。“孟子曰”至“不知类也”。○正义曰：此章指言舍大恶小，不知其要，忧指忘心，不向於道。是以君子恶之者也。“孟子曰”至“此之谓不知类也”，孟子言今人有第四指，为无名之指，屈而不信，且非疾痛有妨害於为事也。如有人能信者，则不远秦、楚之路而求信之，以为恶其指之不若人也。且以无名之指为无用之指，则耻恶之不若人，其心不若人，则不知耻恶之，是之谓为不知其类者也。《荀子》云“相形不如论心”，同其意也。盖云秦、楚者，以其秦、楚相去最为远者也，故取为己言，指屈尚不远秦、楚之路而求信，况心即在於己为最近者也，尚不能求之耶。此孟子所以为不知类者也。" }
      - { type: j, text: "孟子曰：“拱把之桐、梓，人苟欲生之，皆知所以养之者。至於身，而不知所以养之者，岂爱身不若桐梓哉？弗思甚也。”" }
      - { type: z, text: "拱，合两手也。把，以一手把之也。桐、梓，皆木名也，人皆知灌溉而养之，至於养身之道，当以仁义，而不知用，岂於身不若桐、梓哉？不思之甚者也，宜孟子有是以言之欤。“孟子”至“甚也”。○正义曰：此章指言莫知养身而养其树木，失事违务，不得所急，所以诫未达者也。孟子言桐、梓之木，方於可拱把之时，人诚欲其生长，皆知所以灌溉而养之者。至於己之身，而不知以仁义之道养之者，岂人之爱保其身反不若桐、梓之为急哉？但人弗思忖之而已，故以甚者也，宜诫之以此。" }
      - { type: j, text: "孟子曰：“人之於身也，兼所爱。兼所爱，则兼所养也。无尺寸之肤不爱焉，则无尺寸之肤不养也。" }
      - { type: z, text: "人之所爱则养之，於身也，一尺一寸之肤养相及也。" }
      - { type: j, text: "所以考其善不善者，岂有他哉？於己取之而已矣。" }
      - { type: z, text: "考知其善否，皆在己之所养也。" }
      - { type: j, text: "体有贵贱，有小大，无以小害大，无以贱害贵。养其小者为小人，养其大者为大人。" }
      - { type: z, text: "养小则害大，养贱则害贵。小，口腹也。大，心志也。头颈，贵者也。指拇，贱者也，不可舍贵养贱也。务口腹者为小人，治心志者为大人。" }
      - { type: j, text: "今有场师，舍其梧、贾，养其贰、棘，则为贱场师焉。" }
      - { type: z, text: "场师，治场圃者。场以治。圃，园也。梧，桐；贾，梓：皆木名。贰枣，小枣，所谓酸枣也。言此以喻人舍大养小，故曰贱场师也。" }
      - { type: j, text: "养其一指，而失其肩背而不知也，则为狼疾人也。" }
      - { type: z, text: "谓医养人疾，治其一指，而不知其肩背之有疾，以至於害之，此为狼藉乱不知治疾之人也。" }
      - { type: j, text: "饮食之人，则人贱之矣，为其养小以失大也。饮食之人，无有失也，则口腹岂为尺寸之肤哉？”" }
      - { type: z, text: "饮食之人，人所以贱之者，为其养口腹而失道德耳。如使不失道德，存仁义以往，不嫌於养口腹也。故曰口腹岂但为肥长尺寸之肤哉？亦以怀其道德也。“孟子曰人之於身”至“肤哉”。○正义曰：此章指言养其行，治其正，俱用智力，善恶相厉，是以君子居处思义，饮食思礼者也。“孟子曰人之於身也”至“於己取之而已矣”，孟子言人之於一身也，无有所不爱也，以其兼爱之矣。兼所爱，则必兼有所养也。是则一身之中，无有一尺一寸之肌肤不爱焉，则亦无有一尺一寸之肌肤不养之也。以其兼所爱，必兼所养而已。然而所以考究其有善、其有不善者，亦岂有他为哉？但亦於一己自取之而已矣。所谓颐其大体，则为大人，从其小体，则为小人，岂非己自取之谓乎？盖孟子但云尺寸之肤者，则心在乎中，又有居待而言者也，且心为一身之君，所谓心为天君者也。《荀子》云：“心居中虚，以治五官。”此之谓也。言人既爱尺寸之肤，虽心亦在所爱焉。既养尺寸之肤，虽心亦在所养焉。所谓爱养心者，亦以仁义之道爱养之而已。人之心，由人所趋向如何耳，故曰所以考其善不善，於己取之而已矣。“体有贵贱”至“尺寸之肤哉”，孟子又言人体有贵亦有贱，有小亦有大，於人之一身，合而言之则谓之体；自体而言之，又有耳、目、口、鼻、形、心者也。以贵大，则心为一体之贵者大者，以贱小，则耳、目、口、鼻、形为一体之贱者小者，言人之於一体，不可务爱养其贱者小者，以害其贵者大者也。如养其小者，则为之小人，养其大者，则为之大人。以其耳、目、口、鼻、形五者所好，不过利欲而已；而心廪於有生之初，仁义之道俱存於其间。是以养心者为大人君子，养耳、目、口、鼻、形者以利欲为小人耳。故孟子所以有是言也。今有场师治场圃者，如舍其梧、贾之良木，而特养其贰枣，是为贱场师焉。梧，桐也，贾，山楸也。贰枣，小酸枣也。梧、贾可以为琴瑟材，是良木。小酸枣，无用之才也，是贱木也。此所以喻养体不养其贵者，而养其贱者也。又如养其一指之小，而失其肩背之大，则为狼疾藉乱而不知医治者也，此所以比喻养体不养其大者，而养其小者也。且务饮食之人，则人皆贱之者矣，无他，是为其养小而失去其大也。如饮食之人亦无有失其养大，则口腹岂但肥长尺寸之肤为哉？言是亦怀仁义之道者也。○注贾、贰枣为桐梓，酸枣。正义曰：《说文》云：“梧贾，山楸。”又云：“楸，梓也。”“贰枣，小酸枣也。”是所以案此为之云。" }
      - { type: j, text: "公都子问曰：“钧是人也，或为大人，或为小人，何也？”" }
      - { type: z, text: "钧，同也。言有大有小，何也？" }
      - { type: j, text: "孟子曰：“从其大体为大人，从其小体为小人。”" }
      - { type: z, text: "大体，心思礼义。小体，纵恣情欲。" }
      - { type: j, text: "曰：“钧是人也，或从其大体，或从其小体，何也？”" }
      - { type: z, text: "公都子言人何独有从小体也。" }
      - { type: j, text: "曰：“耳目之官，不思而蔽於物，物交物，则引之而已矣。心之官则思，思则得之，不思则不得也。此天之所与我者，先立乎其大者，则其小者不能夺也，此为大人而已矣。”" }
      - { type: z, text: "孟子曰：人有耳目之官，不思，故为物所蔽。官，精神所在也，谓人有五官六府。物，事也。利欲之事来交引其精神，心官不思善，故失其道而陷为小人也。此乃天所与人情性，先立乎其大者，谓生而有善性也。小者，情欲也。善胜恶，则恶不能夺之而已矣。“公都子”至“已矣”。○正义曰：此章指言天与人性，先立其大，心官思之，邪不乖越，故谓之大人者也。“公都子问曰：钧是人也”至“何也”者，公都子问孟子曰：世之人皆是人者也，或有名为大人，或有名为小人者，是如之何也。“孟子曰：从其大体为大人，从其小体为小人”，孟子答之曰：从事於大体，而以仁义养其心，是从其大体，故谓之大人也；从其小体，以利欲养其耳目之官，是从其小体，故谓之小人也。“曰：钧是人也，或从其大体，或从其小体，何也”，公都子未晓，故问之曰：既皆是人也，或以从养其大体，或从养其小体，是如之何？“曰耳目之官”至“此为大人而已矣”，孟子又答之曰：人有耳目之官，不以心思主之，而遂蔽於耆欲之物，既蔽於物，则己亦已失矣。己已失，则是亦为物而已。是则物交接其物，终为物引之，丧其所得矣。惟心之官则为主於思，如心之所思，则有所得而无所丧，如不思，则失其所得而有以丧之耳。是以天之所与付於我者，所以先与立其大者，则心是也。既与立其大者，则小者斯不能夺之矣，小者则耳目是也。是以为之大人而已矣。盖耳目主视听，是以为官者也。心，君，主官者也，亦谓之官者，以其亦主思，故亦为官矣。荀子云：心，君也，房中虚而治五官者也。是以心思之大者，而小者不能夺，其耳目不为利欲之所蔽，兹所以从其大体，而为大人也。彼小人者，以其不思而为利欲所蔽故也。" }
      - { type: j, text: "孟子曰：“有天爵者，有人爵者。仁义忠信，乐善不倦，此天爵也。公卿大夫，此人爵也。" }
      - { type: z, text: "天爵以德，人爵以禄。" }
      - { type: j, text: "古之人修其天爵，而人爵从之。今之人其天爵以要人爵，既得人爵而弃其天爵，则惑之甚者也。" }
      - { type: z, text: "人爵从之，人爵自至也。以要人爵，要，求也。得人爵，弃天爵，惑之甚也。" }
      - { type: j, text: "终亦必亡而已矣。”" }
      - { type: z, text: "弃善忘德，终必亡也。“孟子”至“已矣”。○正义曰：此章指言古修天爵，自乐之也；今要人爵，以诱时也；得人弃天，道之忌也；惑以招亡，小人之事也。“孟子曰有天爵者”至“终亦亡之而已矣”，孟子言有所谓天爵者，有所谓人爵者，仁义忠信四者，又乐行其善而不厌倦者，是所谓天爵也；自公卿大夫者，是所谓人爵。此孟子所以自解之也。自古之人治其天爵，而人爵自然从之，如舜耕於历山，乐取诸人以为善，而尧自然禅其禄位，是其天爵而人爵从之者也。又如伊尹之徒亦是也。今之人修其天爵，以要求人爵，既得其人爵，而又弃其天爵，则蔽惑之甚者也，如登龙断以罔利、乞番间之祭者，是其类也。此孟子所以指今之人而言也。如此者，终亦必亡其人爵而已矣。是故孟子所以有是言而劝诫之。" }
      - { type: j, text: "孟子曰：“欲贵者，人之同心也。人人有贵於己者，弗思耳矣。人之所贵者，非良贵也。赵孟之所贵，赵孟能贱之。" }
      - { type: z, text: "人皆同欲贵之心，人人自有贵者在己身，不思之耳。在己者，谓仁义广誉也。凡人之所贵富贵，故曰非良贵也。赵孟，晋卿之贵者也，能贵人，又能贱人。人之所自有也者，他人不能贱之也。" }
      - { type: j, text: "《诗》云：‘既醉以酒，既饱以德。’言饱乎仁义也，所以不愿人之膏粱之味也。令闻广誉施於身，所以不愿人之文绣也。”" }
      - { type: z, text: "《诗·大雅·既醉》之篇。言饱德者，饱仁义之於身，身之贵者也，不愿人之膏粱矣。膏粱，细粱如膏者也。文绣，绣衣服也。“孟子曰”至“文绣也”。○正义曰：此章指言所贵在身，人不知求，膏粱文绣，己之所优，赵孟所贵，何能比之。是以君子贫而乐也。“孟子曰：欲贵者，人之同心也”至“文绣也”，孟子言凡所愿欲其贵者，世人所同其心也，以其人皆欲之也。然而人人有贵，只在其己者，但不思之耳。凡人所贵者，非是良贵也。良贵者，不以爵而贵者，是谓良贵，如下文所谓仁义广誉者是也。且以赵孟，晋卿之贵，虽为所贵者，然而赵孟又能贱之，是人之所贵者，非为良贵也。此孟子所以引而喻也，以其赵孟者，即晋襄公之臣赵盾者是也，是为晋卿。然入为晋卿，出则为盟主，是谓贵矣，奈何其贤则不及赵襄，其良则不及宣子，则所贵特人爵之贵耳，如此得无贱耶？故曰赵孟之所贵，赵孟能贱之也。《诗·大雅·既醉》之篇有云：既醉之以酒，既饱之以德。是言饱乎仁义者也。是亦所谓德将于醉之意同，谓德则仁义是也。言饱乎仁义，所以不愿人之膏粱之味乎，案《礼》云公食大夫，则稻粱为嘉膳，则膏粱，味之至珍者也。然而不愿人之膏粱，则以仁义为膏粱；令闻广誉之名声既施饰於身，所以不愿人之文绣也。案《诗》以一裳为显服，则文绣为服之至美者也。然而不愿人之文绣，则以令闻广誉为文绣也。盖令闻者，以其内有仁义之德，则人将不特见而善之，又有以闻而善之者也，故云令闻。令，誉令，善也；闻，名声，而人所闻之也。广誉者，亦以内有仁义之德，则不特近者美喻之，而远者又有以美誉焉，故云广誉。广，远大也；誉，美称也。凡此孟子所以教时人之云耳。故论君子贫而乐，如颜子在陋巷，而不改其乐者，是之谓也。" }
      - { type: j, text: "孟子曰：“仁之胜不仁也，犹水之胜火。今之为仁者，犹以一杯水救一车薪之火也，不熄，则谓之水不胜火。此又与於不仁之甚者也，亦终必亡而已矣。”" }
      - { type: z, text: "水胜火，取水足以制火，一杯水何能救一车薪之火也，以此则谓水不胜火。为仁者亦若是，则与作不仁之甚者也，亡犹无也，亦终必亡仁矣。“孟子”至“已矣”。○正义曰：此章指言为仁不至，不反诸己，谓水胜火，熄而後己；不仁之甚，终必亡矣；为道不卒，无益於贤也。孟子言为仁胜强於不仁也，若水之胜火矣。今之为仁者，不知反本心而为仁，如以一杯杓水而救一车薪之火也。火不熄灭，则谓水不胜火，以为不仁胜，仁此又与於不为仁者又甚之也。以其有过於不为仁者也，是亦终必亡其仁矣。且如汤、武之至仁，然後胜桀、纣之至不仁也。今之为仁，但以转粟移民之为仁，而望民多於邻国；以羊易牛之仁，而欲朝秦、楚而抚四夷：是若一杯水而望救一车薪之火也，此所以终必亡其仁矣。此吾孟子所以有激而云。" }
      - { type: j, text: "孟子曰：“五者，种之美者也。苟为不熟，不如荑稗。夫仁亦在乎熟之而已矣。”" }
      - { type: z, text: "熟，成也。五虽美，种之不成，则不如荑稗之草甚实可食。为仁不成，犹是也。正义曰：此章指言功毁几成，人在慎终，五不熟，荑稗是胜，是以为仁以其成也。孟子言五者，是天下种之美者也，苟五不成，则不胜荑稗之所奋。夫仁者，亦天下道之美者也，苟为仁不成，则不胜不仁之所害。故云夫仁亦在乎成之而已矣。此章与前章相类，亦若齐宣有爱牛之仁，而功不至於百姓；梁惠有移民之仁，而民不加多於邻国：是为仁不成之过也。五已说於前矣。云荑稗者，即禾中之{艹巫}草也。" }
      - { type: j, text: "孟子曰：“羿之教人射，必志於彀。学者亦必志於彀。" }
      - { type: z, text: "羿，古之善射者。彀，张弩付的者，用思要时也。学者志道，犹射者之张也。" }
      - { type: j, text: "大匠诲人，必以规矩。学者亦必以规矩。”" }
      - { type: z, text: "大匠，攻木之工。规所以为圆也，矩所以为方也。诲，教也。教人必须规矩，学者以仁义为法式，亦犹大匠以规矩者也。“孟子”至“规矩”。○正义曰：此章指言事各有本，道有所隆，彀张规矩，以喻为仁；学不为仁，犹是二教，失其法而行之者也。孟子言羿为善射者，其教人射，必志在於势。势者，张弓也，张弓以其力分之所至处也。言羿虽善射，其教人亦必求之於力分之内也。大匠为攻木之工者，其教诲人为匠，必在於规矩。规所以为圆之度，矩所以为方之度，以其规矩为法度之至者也。言大匠诲人，亦必求之於法度内也。羿教人既求之於力分之内，则学之者亦必求於力分之内矣。大匠诲人，既求之於法度之内，则学之者，亦必求於法度之内矣。然必皆求於力分之内者，以其力分所不到，则射亦末如之何矣。法度者亦如是矣。此喻人以道教人，而学之者亦如此耳。如皆不求之於力分之内与法度之内，则於道终亦不得矣。○注羿古之攻射者与匠为攻木之工者。○正义曰：此已说於前矣。" }
