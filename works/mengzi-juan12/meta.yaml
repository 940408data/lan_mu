aboutHtml: |-
  <h2>關於此卷</h2>
  <p>《孟子注疏》為宋孫奭疏，以漢趙岐注為本，為十三經注疏之一。孟子七篇十四卷，記孟子遊說諸侯及與弟子問答之言，此卷以宋刻本版式數字重刻，半葉八行、行十六字、注文雙行二十五字。</p>
  <p>卷十二收告子章句上，經注疏全帙。</p>
