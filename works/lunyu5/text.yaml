# 论语集注卷五（当涂郡斋刊递修本·善本底）：j 为经传大字，z 为章句小字。版面结构先行：顶格经/退格注。
sections:
  - id: pian1
    name: 子罕第九
    blocks:
      - { type: z, text: 凡三十章 }
      - { type: j, text: 子罕言利與命與仁 }
      - { type: z, text: 罕少也○程子曰計利則害義命之理微仁之道大皆夫子所罕言也 }
      - { type: j, text: 逹巷黨人曰大哉孔子愽學而無所成名 }
      - { type: z, text: 達巷黨名其人姓名不傳慱學無所成名蓋美其學之慱而惜其不成一藝之名也 }
      - { type: j, text: 子聞之謂門弟子曰吾何執執御乎執射乎吾執御矣 }
      - { type: z, text: 執專執也射御皆一藝而御為人僕所執尤卑言欲使我何所執以成名乎然則吾將執御矣聞人譽己承之以謙也○尹氏曰聖人道全而德備不可以偏長目之也達巷黨人見孔子之大意其所學者慱而惜其不以一善得名於世蓋慕聖人而不知者也故孔子曰欲使我何所執而得為名乎然則吾將執御矣 }
      - { type: j, text: 子曰麻冕禮也今也純儉吾從眾 }
      - { type: z, text: 麻冕緇布冠也純絲也儉謂省約緇布冠以三十升布為之升八十縷則其經二千四百縷矣細密難成不如用絲之省約 }
      - { type: j, text: 拜下禮也今拜乎上泰也雖違衆吾從下 }
      - { type: z, text: 臣與君行禮當拜於堂下君辭之乃升成拜泰驕慢也○程子曰君子處世事之無害於義者從俗可也害於義則不可從也 }
      - { type: j, text: 子絕四母意母必母固母我 }
      - { type: z, text: 絕無之盡者母史記作無是也意私意也必期必也固執滯也我私己也四者相為終始起於意遂於必留於固而成於我也蓋意必常在事前固我常在事後至於我又生意則物欲牽引循環不窮矣○程子曰此母字非禁止之辭聖人絶此四者何用禁止張子曰四者有一焉則與天地不相似○楊氏曰非知足以知聖人詳視而默識之不足以記此 }
      - { type: j, text: 子畏於匡 }
      - { type: z, text: 畏者有戒心之謂康地名史記云陽虎曾暴於康夫子貌似陽虎故康人圍之 }
      - { type: j, text: 曰文王旣没文不在茲乎 }
      - { type: z, text: 道之顯者謂之文蓋禮樂制度之謂不曰道而曰文亦謙辭也茲此也孔子自謂 }
      - { type: j, text: 天之將喪斯文也後死者不得與於斯文也天之未喪斯文也匡人其如予何 }
      - { type: z, text: 喪與皆去聲○馬氏曰文王旣没故孔子自謂後死者言天若欲喪此文則必不使我得與於此文今我既得與於此文則是天未欲喪此文也天既未欲喪此文則康人其奈我何言必不能違天害己也 }
      - { type: j, text: 大宰問於子貢曰夫子聖者與何其多能也 }
      - { type: z, text: 大音泰與平聲○孔氏曰大宰官名或吳或宋未可知也與者疑辭大宰蓋以多能為聖也 }
      - { type: j, text: 子貢曰固天縱之將聖又多能也 }
      - { type: z, text: 縱猶肆也言不為限量也將殆也謙若不敢知之辭聖無不通多能乃其餘事故言又以兼之 }
      - { type: j, text: 子聞之曰大宰知我乎吾少也賤故多能鄙事君子多乎哉不多也 }
      - { type: z, text: 言由少賤故多能而所能者鄙事爾非以聖而無不通也且多能非所以率人故又言君子不必多能以曉之 }
      - { type: j, text: 牢曰子云吾不試故藝 }
      - { type: z, text: 牢孔子弟子姓琴字子開一字子張試用也言由不爲世用故得以習於藝而通之○吳氏曰弟子記夫子此言之時子牢因言昔之所聞有如此者其意相近故并記之 }
      - { type: j, text: 子曰吾有知乎哉無知也有鄙夫問於我空空如也我叩其兩端而竭焉 }
      - { type: z, text: 叩音口○孔子謙言己無知識但其告人雖於至愚不敢不盡耳叩發動也兩端猶言兩頭言終始本末上下精粗無所不盡○程子曰聖人之教人俯就之若此猶恐衆人以爲高遠而不親也聖人之道必降而自卑不如此則人不親賢之言則引而自高不如此則道不尊觀於孔子孟子則可見矣○尹氏曰聖人之言上下兼盡即其近衆人皆可與知極其至則雖聖人亦無以加焉是之謂兩端如答樊遲之問仁智兩端竭盡無餘蘊矣若夫語上而遺下語理而遺物則豈聖人之言哉 }
      - { type: j, text: 子曰鳳鳥不至河不出圖吾已矣夫 }
      - { type: z, text: 夫音扶○鳳靈鳥舜時來儀文王時鳴於岐山河圖河中龍馬負圖伏羲時出皆聖王之瑞也已止也○張子曰鳳至圖出文明之祥伏羲舜文之瑞不至則夫子之文章知其已矣 }
      - { type: j, text: 子見齊衰者冕衣裳者與瞽者見之雖少必作過之必趨齊音咨衰七雷反少去聲齊衰喪服冕冠也衣上服裳下服冕而衣裳貴者之盛服也瞽無目者作起也趨疾行也或曰少當作坐范氏曰聖人之心哀有喪尊有爵矜不成人其作與趨蓋有不期然而然者尹氏 }
      - { type: z, text: 曰此聖人之誠心內外一者也 }
      - { type: j, text: 顏淵喟然嘆曰仰之彌高鑽之彌堅瞻之在前忽焉在後 }
      - { type: z, text: 喟苦位反鑽祖官反○喟歎聲仰彌高不可及鑽彌堅不可入在前在後恍惚不可爲象此顏淵深知夫子之道無窮盡無方體而嘆之也 }
      - { type: j, text: 夫子循循然善誘人愽我以文約我以禮 }
      - { type: z, text: 循循有次序貌誘引進也愽文約禮教之序也言夫子道雖高妙而教人有序也侯氏曰愽我以文致知格物也約我以禮克己復禮也○程子曰此顔子稱聖人最切當處聖人教人唯此二事而已 }
      - { type: j, text: 欲罷不能既竭吾才如有所立卓爾雖欲從之末由也已 }
      - { type: z, text: 卓立貌末無也此顔子自言其學之所至也蓋恱之深而力之盡所見益親而又無所用其力也○呉氏曰所謂卓爾亦在乎日用行事之間非所謂窈冥昏黙者○程子曰到此地位功夫尢難直是峻絶又大叚着力不得○楊氏曰自可欲之謂善充而至於大力行之積也大而化之則非力行所及矣此顔子所以未達一間也 }
      - { type: j, text: 程子曰此顏子所以爲深知孔子而善學之者也胡氏曰無上事而喟然嘆此顏子學旣有得故述其先難之故後得之由而歸功於聖人也高堅前後語道體也仰鑽瞻忽未領其要也惟夫子循循善誘先博我以文使我知古今達事變然後約我以禮使我尊所聞行所知如行者之赴家食者之求飽是以欲罷而不能盡心盡力不少休廢然後見夫子所立之卓然雖欲從之末由也已是蓋不怠所從必欲至乎卓立之地也抑斯嘆也其在請事斯語之後三月不違之時乎子疾病子路使門人爲臣夫子時已去位無家臣子路欲以家 }
      - { type: z, text: 臣治其喪其意實尊聖人而未知所以尊也 }
      - { type: j, text: 病間曰久矣哉由之行詐也無臣而為有臣吾誰欺欺天乎 }
      - { type: z, text: 間如字○病間少差也病時不知既差乃知其事故言我之不當有家臣人皆知之不可欺也而為有臣則是欺天而已人而欺天莫大之罪引以自歸其責子路深矣 }
      - { type: j, text: 且予與其死於臣之手也無寧死於二三子之手乎且予縱不得大葬予死於道路乎 }
      - { type: z, text: 無寧寧也大葬謂君臣禮葬死於道路謂棄而不葬又曉之以不必然之故○范氏曰曾子將死起而易簀曰吾得正而斃焉斯已矣子路欲尊夫子而不知無臣之不可爲有臣是以陷於行詐罪至欺天君子之於言動雖微不可不謹夫子深懲子路所以警學者也○楊氏曰非知至而意誠則用智自私不知行其所無事往往自陷於行詐欺天而莫之知也其子路之謂乎 }
      - { type: j, text: 子貢曰有美玉於斯韞匵而藏諸求善賈而沽諸子曰沽之哉沽之哉我待賈者也 }
      - { type: z, text: 韞紆粉反匵徒木反賈音嫁○韞藏也匵匵也沽賣也子貢以孔子有道不仕故設此二端以問也孔子言固當賣之但當待賈而不當求之耳范氏曰君子未嘗不欲仕也又惡不由其道士之待禮猶玉之待賈也若伊尹之耕於野伯夷太公之居於海濱世無成湯文王則終焉而已必不枉道以從人衒玉而求售也 }
      - { type: j, text: 子欲居九夷 }
      - { type: z, text: 東方之夷有九種欲居之者亦乘桴浮海之意 }
      - { type: j, text: 或曰陋如之何子曰君子居之何陋之有 }
      - { type: z, text: 君子所居則化何陋之有 }
      - { type: j, text: 子曰吾自衛反魯然後樂正雅頌各得其所 }
      - { type: z, text: 魯哀公十一年冬孔子自衛反魯是時周禮在魯然詩樂亦頗殘缺失次孔子周流四方參互考訂以知其說晚知道終不行故歸而正之 }
      - { type: j, text: 子曰出則事公卿入則事父兄喪事不敢不勉不爲酒困何有於我哉 }
      - { type: z, text: 說見第七篇然此則其事愈卑而意愈切矣 }
      - { type: j, text: 子在川上曰逝者如斯夫不舎晝夜 }
      - { type: z, text: 夫音扶舎上聲○天地之化往者過來者續無一息之停乃道體之本然也然其可指而易見者莫如川流故於此發以示人欲學者時時省察而無毫髮之間斷也○程子曰此道體也天運而不已日往則月來寒往則暑來水流而不息物生而不窮皆與道爲體運乎晝夜未甞已也是以君子法之自強不息及其至也純亦不已焉又曰自漢以來儒者皆不識此義此見聖人之心純亦不已也純亦不已乃天德也有天德便可語王道其要只在謹獨愚按自此至篇終皆勉人進學不已之辭 }
      - { type: j, text: 子曰吾未見好德如好色者也 }
      - { type: z, text: 好去聲○謝氏曰好好色惡惡臭誠也好德如好色斯誠好德矣然民鮮能之○史記孔子居衛靈公與夫人同車使孔子為次乘招摇市過之孔子醜之故有是言 }
      - { type: j, text: 子曰譬如為山未成一簣止吾止也譬如平地雖覆一簣進吾往也 }
      - { type: z, text: 簣求位反覆芳服反○簣土籠也書曰為山九仞功虧一簣夫子之言蓋出於此言山成而但少一簣其止者吾自止耳平地而方覆一簣其進者吾自往耳蓋學者自彊不息則積少成多中道而止則前功盡棄其止其往皆在我而不在人也 }
      - { type: j, text: 子曰語之而不惰者其回也與 }
      - { type: z, text: 語去聲與平聲○惰懈怠也○范氏曰顏子聞夫子之言而心解力行造次顛沛未嘗違之如萬物得時雨之潤發榮滋長何有於惰此羣弟子所不及也 }
      - { type: j, text: 子謂顏淵曰惜乎吾見其進也未見其止也 }
      - { type: z, text: 進止二字說見上章顏子既死而孔子惜之言其方進而未已也 }
      - { type: j, text: 子曰苗而不秀者有矣夫秀而不實者有矣夫 }
      - { type: z, text: 夫音扶○穀之始生曰苗吐華曰秀成穀曰實蓋學而不至於成有如此者是以君子貴自勉也 }
      - { type: j, text: 子曰後生可畏焉知來者之不如今也四十五十而無聞焉斯亦不足畏也已 }
      - { type: z, text: 焉知之焉於虔反○孔子言後生年富力彊足以積學而有待其勢可畏安知其將來不如我之今日乎然或不能自勉至於老而無聞則不足畏矣言此以警人使及時勉學也曾子曰五十而不以善聞則不聞矣蓋述此意○尹氏曰少而不勉老而無聞則亦已矣自少而進者安知其不至於極乎是可畏也 }
      - { type: j, text: 子曰法語之言能無從乎改之為貴巽與之言能無說乎繹之為貴說而不繹從而不改吾末如之何也已矣 }
      - { type: z, text: 法語者正言之也巽言者婉而導之也繹尋其緒也法言人所敬憚故必 }
      - { type: j, text: 從然不改則面從而已巽言無所乖忤故必說然不繹則又不足以知其微意之所在也楊氏曰法言若孟子論行王政之類是也巽言若其論好貨好色之類是也語之而未達拒之而不受猶之可也其或喻焉則尚庶幾其能改繹矣從且說矣而不改繹焉則是終不改繹也已雖聖人其 }
      - { type: z, text: 如之何哉 }
      - { type: j, text: 子曰主忠信毋友不如己者過則勿憚改 }
      - { type: z, text: 重出而逸其半 }
      - { type: j, text: 子曰三軍可奪帥也匹夫不可奪志也侯氏曰三軍之勇在人匹夫之志在己故帥可奪而志不可奪如可奪則亦不足謂之志矣子曰衣敝縕袍與衣狐貉者立而不恥者其由也與 }
      - { type: z, text: 衣去聲縕紆粉反貉胡各反與平聲○敝壞也縕枲著也袍衣有著者也蓋衣之賤者狐貉以狐貉之皮爲裘衣之貴者子路之志如此則能不以貧富動其心而可以進於道矣故夫子稱之 }
      - { type: j, text: 不忮不求何用不臧 }
      - { type: z, text: 忮之豉反○忮害也求貪也臧善也言能不忮不求則何爲不善乎此衛風雄雉之篇孔子引之以美子路也 }
      - { type: j, text: 吕氏曰貧與富交彊者必忮弱者必求子路終身誦之子曰是道也何足以臧 }
      - { type: z, text: 終身誦之則自喜其能而不復求進於道矣故夫子復言此以警之○謝 }
      - { type: j, text: 氏曰恥惡衣惡食學者之大病善心不存蓋由於此子路之志如此其過人遠矣然以衆人而能此則可以爲善矣子路之賢宜不止此而終身誦之則非所以進於日新也故激而進 }
      - { type: z, text: 之 }
      - { type: j, text: 子曰歲寒然後知松栢之後彫也范氏曰小人之在治世或與君子無異惟臨利害遇事變然後君子之所守可見也謝氏曰士窮見節義世 }
      - { type: z, text: 亂識忠臣欲學者必周于德 }
      - { type: j, text: 子曰知者不惑仁者不憂勇者不懼明足以燭理故不惑理足以勝私故不憂氣足以配道義故不懼此學之 }
      - { type: z, text: 序也 }
      - { type: j, text: 子曰可與共學未可與適道可與適道未可與立可與立未可與權可與者言其可與共爲此事也程子曰可與共學知所以求之也可與適道知所往也可與立者篤志固執而不變也權稱錘也所以稱物而知輕重者也可與權謂能權輕重使合義也楊氏曰知爲己則可與共學矣學足以明善然後可與適道信道篤然後可與立知時措之宜然後可與權洪氏曰易九卦終於巽以行權權者聖人之大用未能立而言權猶人未能立而欲行鮮不仆矣程子曰漢儒以反經合道爲權故有權變權術之論皆非也權只是經也自漢以下無人識權字愚按先儒誤以此章連下文偏其反而爲一章故有 }
      - { type: z, text: 反經合道之說程子非之是矣然以孟子嫂溺援之以手之義推之則權與經亦當有辨 }
      - { type: j, text: 唐棣之華偏其反而豈不爾思室是遠而 }
      - { type: z, text: 棣大計反○唐棣郁李也偏晉書作翩然則反亦當與翻同言華之搖動也而語助也此逸詩也於六義屬興上兩句無意義但以起下兩句之辭耳其所謂爾亦不知其何所指也 }
      - { type: j, text: 子曰未之思也夫何遠之有 }
      - { type: z, text: 夫音扶○夫子借其言而反之蓋前篇仁遠乎哉之意○程子曰聖人未嘗言易以驕人之志亦未嘗言難以阻人之進但曰未之思也夫何遠之有此言極有涵蓄意思深遠 }
  - id: pian2
    name: 鄉黨第十
    blocks:
      - { type: z, text: 楊氏曰聖人之所謂道者不離乎日用之閒也故夫子之平日一動一靜門人皆審視而詳記之○尹氏曰甚矣孔門諸子之嗜學也於聖人之容色言動無不謹書而備錄之以貽後世今讀其書即其事宛然如聖人之在目也雖然聖人豈拘拘而爲之者哉蓋盛德之至動容周旋自中乎禮耳學者欲潛心於聖人宜於此求焉舊說凡一章今分爲十七節 }
      - { type: j, text: 孔子於鄉黨恂恂如也似不能言者恂相倫反恂恂信實之貌似不能 }
      - { type: z, text: 言者謙卑遜順不以賢知先人也鄉黨父兄宗族之所在故孔子居之其容貌詞氣如此 }
      - { type: j, text: 其在宗廟朝廷便便言唯謹爾 }
      - { type: z, text: 朝直遥反下同便旁連反○便便辯也宗廟禮法之所在朝廷政事之所出言不可以不明辯故必詳問而極言之但謹而不放爾○此一節記孔子在鄕黨宗廟朝廷言貌之不同 }
      - { type: j, text: 朝與下大夫言侃侃如也與上大夫言誾誾如也 }
      - { type: z, text: 侃苦旦反誾魚巾反○此君未視朝時也王制諸侯上大夫卿下大夫五人許氏說文侃侃剛直也誾誾和悅而諍也 }
      - { type: j, text: 君在踧踖如也與與如也 }
      - { type: z, text: 踧子六反踖子亦反與平聲或如字○君在視朝也踧踖恭敬不寧之貌與與威儀中適之貌○張子曰與與不忘向君也亦通○此一節記孔子在朝廷事上接下之不同也 }
      - { type: j, text: 君召使擯色勃如也足躩如也 }
      - { type: z, text: 擯必刃反躩驅若反○擯主國之君所使出接賔者勃變色貌躩盤辟貌皆敬君命故也 }
      - { type: j, text: 揖所與立左右手衣前後襜如也 }
      - { type: z, text: 襜赤占反○所與立謂同爲擯者也擯用命數之半如上公九命則用五人以次傳命揖左人則左其手揖右人則右其手襜整貌 }
      - { type: j, text: 趨進翼如也 }
      - { type: z, text: 疾趨而進張拱端好如鳥舒翼 }
      - { type: j, text: 賔退必復命曰賔不顧矣 }
      - { type: z, text: 紓君敬也○此一節記孔子爲君擯相之容 }
      - { type: j, text: 入公門鞠躬如也如不容 }
      - { type: z, text: 鞠躬曲身也公門高大而若不容敬之至也 }
      - { type: j, text: 立不中門行不履閾 }
      - { type: z, text: 闑于逼反○中門中於門也謂當棖闑之閒君出入處也闑門限也禮士大夫出入君門由闑右不踐閾○謝氏曰立中門則當尊行履閾則不恪 }
      - { type: j, text: 過位色勃如也足躩如也其言似不足者 }
      - { type: z, text: 位君之虛位謂門屏之閒人君宁立之處所謂宁也君雖不在過之必敬不敢以虛位而慢之也言似不足不敢肆也 }
      - { type: j, text: 攝齊升堂鞠躬如也屏氣似不息者 }
      - { type: z, text: 齊音咨○攝摳也齊衣下縫也禮將升堂兩手摳衣使去地尺恐躡之而傾跌失容也屏藏也息鼻息出入者 }
      - { type: j, text: 也近至尊氣容肅也出降一等逞顏色怡怡如也没堦趨翼如也復其位踧踖如也 }
      - { type: z, text: 陸氏曰趨下本無進字俗本有之誤也○等堦之級也逞放也漸遠所尊舒氣解顏怡怡和說也没堦下盡堦 }
      - { type: j, text: 也趨走就位也復位踧踖敬之餘也 }
      - { type: z, text: 此一節記孔子在朝之容 }
      - { type: j, text: 執圭鞠躬如也如不勝上如揖下如授勃如戰色足蹜蹜如有循 }
      - { type: z, text: 勝平聲蹜色六反○圭諸侯命圭聘問鄰國則使大夫執以通信如不勝執主器執輕如不克敬謹之至也上如揖下如授謂執圭平衡手與心齊高不過揖卑不過授也戰色戰而色懼也蹜蹜舉足促狹也如有循記所謂舉前曳踵言行不離地如緣物也 }
      - { type: j, text: 享禮有容色 }
      - { type: z, text: 享獻也既聘而享用圭璧有庭實有容色和也儀禮曰發氣滿容 }
      - { type: j, text: 私覿愉愉如也 }
      - { type: z, text: 私覿以私禮見也愉愉則又和矣○此一節記孔子為君聘於鄰國之禮也晁氏曰孔子定公九年仕魯至十三年適齊其間絕無朝聘往來之事疑使擯執圭兩條但孔子嘗言其禮當如此爾 }
      - { type: j, text: 君子不以紺緅飾 }
      - { type: z, text: 紺古暗反緅側由反○君子謂孔子紺深青揚赤色齊服也緅絳色三年之喪以飾練服也飾領緣也 }
      - { type: j, text: 紅紫不以爲褻服 }
      - { type: z, text: 紅紫間色不正且近於婦人女子之服也褻服私居服也言此則不以爲朝祭之服可知 }
      - { type: j, text: 當暑袗絺綌必表而出之 }
      - { type: z, text: 袗單也葛之精者曰絺麤者曰綌表而出之謂先著裏衣表絺綌而出之於外欲其不見體也詩所謂蒙彼縐絺是也 }
      - { type: j, text: 緇衣羔裘素衣麑裘黃衣狐裘 }
      - { type: z, text: 麑研奚反○緇黑色羔裘用黑羊皮麑鹿子色白狐色黃衣以裼裘欲其相稱 }
      - { type: j, text: 褻裘長短右袂 }
      - { type: z, text: 長欲其溫短右袂所以便作事 }
      - { type: j, text: 必有寢衣長一身有半 }
      - { type: z, text: 長去聲○齊主於敬不可解衣而寢又不可著明衣而寢故别有寢衣其半蓋以覆足○程子曰此錯簡當在齊必有明衣布之下愚謂如此則此條與明衣變食既得以類相從而襲裘狐貉亦得以類相從矣 }
      - { type: j, text: 狐貉之厚以居狐貉毛深温厚私居取其適體去喪無所不佩 }
      - { type: z, text: 去上聲○君子無故玉不去身觽礪之屬亦皆佩也 }
      - { type: j, text: 非帷裳必殺之 }
      - { type: z, text: 殺去聲○朝祭之服裳用正幅如帷要有襞積而旁無殺縫其餘若深衣要半下齊倍要則無襞積而有殺縫矣 }
      - { type: j, text: 羔裘玄冠不以弔喪主素吉主玄弔必變服所以哀死吉月必朝服而朝吉月月朔也孔子在魯致仕時如此此一節記孔子衣服之制蘇氏曰此孔氏遺書雜記曲禮非特孔子 }
      - { type: z, text: 事也 }
      - { type: j, text: 齊必有明衣布齊側皆反齊必沐浴浴竟即著明衣所以明潔其體也以布爲之此下脫前章寢衣一簡齊必變食居必遷坐變食謂不飲酒不茹葷遷坐易常處也此一節記孔子謹齊之事楊氏曰齊所以交神故致潔變常以盡 }
      - { type: z, text: 敬 }
      - { type: j, text: 食不厭精膾不厭細 }
      - { type: z, text: 食音嗣○食飯也精鑿也牛羊與魚之腥聶而切之爲膾食精則能養人膾麤則能害人不厭言以是爲善非謂必欲如是也 }
      - { type: j, text: 食饐而餲魚餒而肉敗不食色惡不食臭惡不食失飪不食不時不食 }
      - { type: z, text: 食饐之食音嗣饐於冀反餲烏邁反飪而甚反○饐飯傷熱濕也餲味變也魚爛曰餒肉腐曰敗色惡臭惡未敗而色臭變也飪烹調生熟之節也不時五穀不成果實未熟之類此數者皆足以傷人故不食 }
      - { type: j, text: 割不正不食不得其醬不食 }
      - { type: z, text: 割肉不方正者不食造次不離於正也漢陸續之母切肉未甞不方斷蔥以寸爲度蓋其質美與此暗合也食 }
      - { type: j, text: 肉雖多不使勝食氣惟酒無量不及亂 }
      - { type: z, text: 肉用醬各有所宜不得則不食惡其不備也此二者無害於人但不以嗜味而苟食耳食音嗣量去聲○食以穀爲主故不使肉勝食氣酒以爲人合懽故不爲量但以醉爲節而不及亂耳○程子曰不及亂者非唯不使亂志雖血氣亦不可使亂但浹洽而已可也 }
      - { type: j, text: 沽酒市脯不食 }
      - { type: z, text: 沽市皆買也恐不精潔或傷人也與不甞康子之藥同意 }
      - { type: j, text: 不撤薑食 }
      - { type: z, text: 薑通神明去穢惡故不撤 }
      - { type: j, text: 不多食 }
      - { type: z, text: 適可而止無貪心也 }
      - { type: j, text: 祭於公不宿肉祭肉不出三日出三日不食之矣 }
      - { type: z, text: 助祭於公所得胙肉歸即頒賜不俟經宿者不留神惠也家之祭肉則不過三日皆以分賜蓋過三日則肉必敗而人不食之是褻鬼神之餘也但比君所賜胙可少緩耳 }
      - { type: j, text: 食不語寢不言 }
      - { type: z, text: 答述曰語自言曰言○范氏曰聖人存心不他當食而食當寢而寢言語非其時也○楊氏曰肺爲氣主而聲出焉寢食則氣窒而不通語言恐傷之也亦通 }
      - { type: j, text: 雖疏食菜羹瓜祭必齊如也食音嗣陸氏曰魯論瓜作必古人飲食每種各出少許置之豆間之地以祭先代始爲飲食之人不忘本也齊嚴敬貌孔子雖薄物必祭其祭必敬聖人之誠也此一節記孔子飲食之節謝氏曰聖人飲食如此非極口腹之欲蓋養氣體不以傷生當如此然聖人之所不食窮口腹者 }
      - { type: z, text: 或反食之欲心勝而不暇擇也 }
      - { type: j, text: 席不正不坐謝氏曰聖人心安於正故於位之不 }
      - { type: z, text: 正者雖小不處 }
      - { type: j, text: 鄉人飲酒杖者出斯出矣杖者老人也六十杖於鄉未出不敢 }
      - { type: z, text: 先既出不敢後 }
      - { type: j, text: 鄉人儺朝服而立於阼階 }
      - { type: z, text: 儺乃多反○儺所以逐疫周禮方相氏掌之阼階東階也儺雖古禮而近於戲亦必朝服而臨之者無所不用其誠敬也或曰恐其驚先祖五祀之神欲其依己而安也○此一節記夫子居鄉之事 }
      - { type: j, text: 問人於他邦再拜而送之 }
      - { type: z, text: 拜送使者如親見之敬也 }
      - { type: j, text: 康子饋藥拜而受之曰丘未達不敢嘗 }
      - { type: z, text: 范氏曰凡賜食必嘗以拜藥未達則不敢嘗受而不飲則虛人之賜故告之如此然則可飲而飲不可飲而不飲皆在其中矣○楊氏曰大夫有賜拜而受之禮也未達不敢嘗謹疾也必告之直也○此一節記孔子與人交之誠意 }
      - { type: j, text: 廐焚子退朝曰傷人乎不問馬 }
      - { type: z, text: 非不愛馬然恐傷人之意多故未暇問蓋貴人賤畜理當如此 }
      - { type: j, text: 君賜食必正席先嘗之君賜腥必熟而薦之君賜生必畜之 }
      - { type: z, text: 食恐或餕餘故不以薦正席先嘗如對君也言先嘗則餘當以頒賜矣腥生肉熟而薦之祖考榮君賜也畜之者仁君之惠無故不敢殺也 }
      - { type: j, text: 侍食於君君祭先飯 }
      - { type: z, text: 飯扶晚反○周禮王日一舉膳夫授祭品嘗食王乃食故侍食者君祭則己不祭而先飯若為君嘗食然不敢當客禮也 }
      - { type: j, text: 疾君視之東首加朝服拖紳 }
      - { type: z, text: 首去聲拖徒我反○東首以受生氣也病卧不能著衣束帶又不可以褻服見君故加朝服於身又引大帶於上也 }
      - { type: j, text: 君命召不俟駕行矣 }
      - { type: z, text: 急趨君命行出而駕車隨之○此一節記孔子事君之禮 }
      - { type: j, text: 入太廟每事問 }
      - { type: z, text: 重出 }
      - { type: j, text: 朋友死無所歸曰於我殯 }
      - { type: z, text: 朋友以義合死無所歸不得不殯 }
      - { type: j, text: 朋友之饋雖車馬非祭肉不拜 }
      - { type: z, text: 朋友有通財之義故雖車馬之重不拜祭肉則拜者敬其祖考同於己親也○此一節記孔子交朋友之義 }
      - { type: j, text: 寢不尸居不容 }
      - { type: z, text: 尸謂偃卧似死人也居居家容容儀范氏曰寢不尸非惡其類於死也惰慢之氣不設於身體雖舒布其四體而亦未嘗肆耳居不容非惰也但不若奉祭祀見賓客而已申申夭夭是也 }
      - { type: j, text: 見齊衰者雖狎必變見冕者與瞽者雖褻必以貌 }
      - { type: z, text: 狎謂素親狎褻謂燕見貌謂禮貌餘見前篇 }
      - { type: j, text: 凶服者式之式負版者 }
      - { type: z, text: 式車前横木有所敬則俯而憑之負版持邦國圖籍者式此二者哀有喪重民數也人惟萬物之靈而王者之所天也故周禮獻民數於王王拜受之况其下者敢不敬乎 }
      - { type: j, text: 有盛饌必變色而作 }
      - { type: z, text: 敬主人之禮非以其饌也 }
      - { type: j, text: 迅雷風烈必變 }
      - { type: z, text: 迅疾也烈猛也必變者所以敬天之怒記曰若有疾風迅雷甚雨則必變雖夜必興衣服冠而坐○此一節記孔子容貌之變 }
      - { type: j, text: 升車必正立執綏 }
      - { type: z, text: 綏挽以上車之索也○范氏曰正立執綏則心體無不正而誠意肅恭矣蓋君子莊敬無所不在升車則見於此也 }
      - { type: j, text: 車中不內顧不疾言不親指 }
      - { type: z, text: 內顧回視也禮曰顧不過轂三者皆失容且惑人○此一節記孔子升車之容 }
      - { type: j, text: 色斯舉矣翔而後集 }
      - { type: z, text: 言鳥見人之顔色不善則飛去回翔審視而後下止人之幾而作審擇所處亦當如此然此上下必有闕文矣 }
      - { type: j, text: 曰山梁雌雉時哉時哉子路共之三嗅而作 }
      - { type: z, text: 共九用反又居勇反嗅許又反〇邢 }
      - { type: j, text: 氏曰梁橋也時哉言雉之飲啄得其時 }
      - { type: z, text: 子路不達以爲時物而共具之孔子不食三嗅其氣而起〇晁氏曰石經嗅作戛謂雉鳴也劉聘君云嗅當作臭古閒反張兩翅也見爾雅愚按如後兩說則共字當爲拱執之義然此必有闕文不可彊爲之說姑記所聞以俟知者 }
