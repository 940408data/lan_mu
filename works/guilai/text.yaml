# 依骈对断句、参差成行（界格由 glyphMarks 确定性生成，不写 marks）
sections:
  - id: text
    name: 辭文
    columns:
      - line: 1
        text: 歸去來兮田園將蕪胡不歸
      - line: 2
        text: 既自以心為形役奚惆悵而獨悲
      - line: 3
        text: 悟已往之不諫知來者之可追
      - line: 4
        text: 實迷途其未遠覺今是而昨非
      - line: 5
        text: 舟遙遙以輕颺風飄飄而吹衣
      - line: 6
        text: 問征夫以前路恨晨光之熹微
      - line: 7
        text: 乃瞻衡宇載欣載奔
      - line: 8
        text: 僮僕歡迎稚子候門
      - line: 9
        text: 三徑就荒松菊猶存
      - line: 10
        text: 攜幼入室有酒盈樽
      - line: 11
        text: 引壺觴以自酌眄庭柯以怡顏
      - line: 12
        text: 倚南窗以寄傲審容膝之易安
      - line: 13
        text: 園日涉以成趣門雖設而常關
      - line: 14
        text: 策扶老以流憩時矯首而遐觀
      - line: 15
        text: 雲無心以出岫鳥倦飛而知還
      - line: 16
        text: 景翳翳以將入撫孤松而盤桓
      - line: 17
        text: 歸去來兮請息交以絕遊
      - line: 18
        text: 世與我而相違復駕言兮焉求
      - line: 19
        text: 悅親戚之情話樂琴書以消憂
      - line: 20
        text: 農人告余以春及將有事於西疇
      - line: 21
        text: 或命巾車或棹孤舟
      - line: 22
        text: 既窈窕以尋壑亦崎嶇而經丘
      - line: 23
        text: 木欣欣以向榮泉涓涓而始流
      - line: 24
        text: 善萬物之得時感吾生之行休
      - line: 25
        text: 已矣乎寓形宇內復幾時
      - line: 26
        text: 曷不委心任去留
      - line: 27
        text: 胡為乎遑遑欲何之
      - line: 28
        text: 富貴非吾願帝鄉不可期
      - line: 29
        text: 懷良辰以孤往或植杖而耘耔
      - line: 30
        text: 登東皋以舒嘯臨清流而賦詩
      - line: 31
        text: 聊乘化以歸盡樂夫天命復奚疑
