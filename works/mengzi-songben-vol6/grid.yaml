labels:
  - page: 201
    col: 1
    role: j
    text: 孟子卷第六朱熹集注
  - page: 201
    col: 2
    role: title
    text: 滕文公章句下
  - page: 201
    col: 3
    role: z
    text: 凡十章
  - page: 201
    col: 4
    role: j
    text: 陳代曰不見諸侯宜若小然今一見之
  - page: 201
    col: 5
    role: z
    text: 大則以王小則以霸且志曰枉尺直
  - page: 201
    col: 6
    role: j
    text: 尋宜若可為也
  - page: 201
    col: 7
    role: z
    text: 王去聲○陳代孟子弟子也小謂小
  - page: 201
    col: 8
    role: z
    text: 節也枉屈也直伸也八尺曰尋枉尺
  - page: 202
    col: 1
    role: z
    text: 直尋猶屈己一見諸侯而可以致王
  - page: 202
    col: 2
    role: z
    text: 霸所屈者小所伸者大也
  - page: 202
    col: 3
    role: j
    text: 孟子曰昔齊景公田招虞人以旌不至
  - page: 202
    col: 4
    role: j
    text: 將殺之志士不忘在溝壑勇士不忘喪
  - page: 202
    col: 5
    role: j
    text: 其元孔子奚取焉取非其招不往也如
  - page: 202
    col: 6
    role: j
    text: 不待其招而往何哉
  - page: 202
    col: 7
    role: z
    text: 喪去聲○田獵也虞人守苑囿之吏
  - page: 202
    col: 8
    role: z
    text: 也招大夫以旌招虞人以皮冠元首
  - page: 202
    col: 9
    role: z
    text: 也志士固窮常念死無棺槨棄溝壑
  - page: 202
    col: 10
    role: z
    text: 而不恨勇士輕生常念戰鬬而死喪
  - page: 202
    col: 11
    role: z
    text: 其首而不顧也此二句乃孔子歎美
  - page: 202
    col: 12
    role: z
    text: 虞人之言夫虞人招之不以其物尚
  - page: 202
    col: 13
    role: z
    text: 守死而不往況君子豈可不待其招
  - page: 202
    col: 14
    role: z
    text: 而自往見之邪此以上告之以不可
  - page: 202
    col: 15
    role: z
    text: 往見之意
  - page: 202
    col: 16
    role: j
    text: 且夫枉尺而直尋者以利言也如以利
  - page: 203
    col: 1
    role: j
    text: 則枉尋直尺而利亦可爲與
  - page: 203
    col: 2
    role: z
    text: 夫音扶與平聲○此以下正其所稱
  - page: 203
    col: 3
    role: z
    text: 枉尺直尋之非夫所謂枉小而所伸
  - page: 203
    col: 4
    role: z
    text: 者大則爲之者計其利耳一有計利
  - page: 203
    col: 5
    role: z
    text: 之心則雖枉多伸少而有利亦將爲
  - page: 203
    col: 6
    role: z
    text: 之邪甚言其不可也
  - page: 203
    col: 7
    role: j
    text: 昔者趙簡子使王良與嬖奚乘終日而
  - page: 203
    col: 8
    role: j
    text: 不獲一禽嬖奚反命曰天下之賤工也
  - page: 203
    col: 9
    role: j
    text: 或以告王良良曰請復之彊而後可一
  - page: 203
    col: 10
    role: j
    text: 朝而獲十禽嬖奚反命曰天下之良工
  - page: 203
    col: 11
    role: j
    text: 也簡子曰我使掌與女乘謂王良良不
  - page: 203
    col: 12
    role: j
    text: 可曰吾爲之範我馳驅終日不獲一爲
  - page: 203
    col: 13
    role: j
    text: 之詭遇一朝而獲十詩云不失其馳舍
  - page: 203
    col: 14
    role: j
    text: 矢如破我不貫與小人乘請辭
  - page: 203
    col: 15
    role: z
    text: 乘去聲彊上聲女音汝爲去聲舍上
  - page: 203
    col: 16
    role: z
    text: 聲○趙簡子晉大夫趙鞅也王良善
  - page: 204
    col: 1
    role: j
    text: 御者也嬖奚簡子幸臣與之乘爲之
  - page: 204
    col: 2
    role: j
    text: 御也復之再乘也彊而後可嬖奚不
  - page: 204
    col: 3
    role: j
    text: 肯彊之而後肯也一朝自晨至食時
  - page: 204
    col: 4
    role: j
    text: 也掌專主也範法度也詭遇不正而
  - page: 204
    col: 5
    role: j
    text: 與禽遇也言奚不善射以法馳驅則
  - page: 204
    col: 6
    role: j
    text: 不獲廢法詭遇而後中也詩小雅車
  - page: 204
    col: 7
    role: j
    text: 攻之篇言御者不失其馳驅之法而
  - page: 204
    col: 8
    role: j
    text: 射者發矢皆中而力今嬖奚不能也
  - page: 204
    col: 9
    role: j
    text: 貫習也
  - page: 204
    col: 10
    role: j
    text: 御者且羞與射者比比而得禽獸雖若
  - page: 204
    col: 11
    role: j
    text: 丘陵弗爲也如枉道而從彼何也且子
  - page: 204
    col: 12
    role: j
    text: 過矣枉己者未有能直人者也
  - page: 204
    col: 13
    role: j
    text: 比必二反○比阿黨也若丘陵言多
  - page: 204
    col: 14
    role: j
    text: 也○或曰居今之世出處去就不必
  - page: 204
    col: 15
    role: j
    text: 一一中節欲其一一中節則道不得
  - page: 204
    col: 16
    role: j
    text: 行矣○楊氏曰何其不自重也枉己
  - page: 205
    col: 1
    role: j
    text: 其能直人乎古之人寧道之不行而
  - page: 205
    col: 2
    role: j
    text: 不輕其去就是以孔孟雖在春秋戰
  - page: 205
    col: 3
    role: j
    text: 國之時而進必以正以至終不得行
  - page: 205
    col: 4
    role: j
    text: 而死也使不卹其去就而可以行道
  - page: 205
    col: 5
    role: j
    text: 孔孟當先爲之矣孔孟豈不欲道之
  - page: 205
    col: 6
    role: j
    text: 行哉
  - page: 205
    col: 7
    role: j
    text: 景春曰公孫衍張儀豈不誠大丈夫哉
  - page: 205
    col: 8
    role: j
    text: 一怒而諸侯懼安居而天下熄
  - page: 205
    col: 9
    role: j
    text: 景春人姓名公孫衍張儀皆魏人怒
  - page: 205
    col: 10
    role: j
    text: 則說諸侯使相攻伐故諸侯懼也
  - page: 205
    col: 11
    role: j
    text: 孟子曰是焉得爲大丈夫乎子未學禮
  - page: 205
    col: 12
    role: j
    text: 乎丈夫之冠也父命之女子之嫁也母
  - page: 205
    col: 13
    role: j
    text: 命之往送之門戒之曰往之女家必敬
  - page: 205
    col: 14
    role: j
    text: 必戒無違夫子以順爲正者妾婦之道
  - page: 205
    col: 15
    role: j
    text: 也
  - page: 205
    col: 16
    role: j
    text: 焉於䖍反冠去聲女家之女音汝〇
  - page: 206
    col: 1
    role: z
    text: 加冠於首曰冠女家夫家也婦人内
  - page: 206
    col: 2
    role: z
    text: 夫家以嫁爲歸也夫子夫也女子從
  - page: 206
    col: 3
    role: z
    text: 人以順爲正道也蓋言二子阿諛苟
  - page: 206
    col: 4
    role: z
    text: 容竊取權勢乃妾婦順從之道耳非
  - page: 206
    col: 5
    role: z
    text: 丈夫之事也
  - page: 206
    col: 6
    role: j
    text: 居天下之廣居立天下之正位行天下
  - page: 206
    col: 7
    role: j
    text: 之大道得志與民由之不得志獨行其
  - page: 206
    col: 8
    role: j
    text: 道富貴不能淫貧賤不能移威武不能
  - page: 206
    col: 9
    role: j
    text: 屈此之謂大丈夫
  - page: 206
    col: 10
    role: z
    text: 廣居仁也正位禮也大道義也與民
  - page: 206
    col: 11
    role: z
    text: 由之推其所得於人也獨行其道守
  - page: 206
    col: 12
    role: z
    text: 其所得於己也淫蕩其心也移變其
  - page: 206
    col: 13
    role: z
    text: 節也屈挫其志也○何叔京曰戰國
  - page: 206
    col: 14
    role: z
    text: 之時聖賢道否天下不復見其德業
  - page: 206
    col: 15
    role: z
    text: 之盛但見姦巧之徒得志橫行氣焰
  - page: 206
    col: 16
    role: z
    text: 可畏遂以爲大丈夫不知由君子觀
  - page: 207
    col: 1
    role: j
    text: 之是乃妾婦之道耳何足道哉
  - page: 207
    col: 2
    role: j
    text: 周霄問曰古之君子仕乎孟子曰仕傳
  - page: 207
    col: 3
    role: j
    text: 曰孔子三月無君則皇皇如也出疆必
  - page: 207
    col: 4
    role: j
    text: 載質公明儀曰古之人三月無君則弔
  - page: 207
    col: 5
    role: z
    text: 傳直戀反質與贄同下同○周霄魏
  - page: 207
    col: 6
    role: z
    text: 人無君謂不得仕而事君也皇皇如
  - page: 207
    col: 7
    role: z
    text: 有求而弗得之意出疆謂失位而去
  - page: 207
    col: 8
    role: z
    text: 國也質所執以見人者如士則執雉
  - page: 207
    col: 9
    role: z
    text: 也出疆載之者將以見所適國之君
  - page: 207
    col: 10
    role: z
    text: 而事之也
  - page: 207
    col: 11
    role: j
    text: 三月無君則弔不以急乎
  - page: 207
    col: 12
    role: z
    text: 周霄問也以巳通太也後章放此
  - page: 207
    col: 13
    role: j
    text: 曰士之失位也猶諸侯之失國家也禮
  - page: 207
    col: 14
    role: j
    text: 曰諸侯耕助以共粢盛夫人蠶繅以爲
  - page: 207
    col: 15
    role: j
    text: 衣服犧牲不成粢盛不潔衣服不備不
  - page: 207
    col: 16
    role: j
    text: 敢以祭惟士無田則亦不祭牲殺器皿
  - page: 208
    col: 1
    role: j
    text: 衣服不備不敢以祭則不敢以宴亦不
  - page: 208
    col: 2
    role: j
    text: 足弔乎
  - page: 208
    col: 3
    role: z
    text: 盛音成繅素刀反皿武永反○禮曰
  - page: 208
    col: 4
    role: z
    text: 諸侯為藉百畝冕而青紘躬秉耒以
  - page: 208
    col: 5
    role: z
    text: 耕而庶人助以終畝收而藏之御廩
  - page: 208
    col: 6
    role: z
    text: 以供宗廟之粢盛使世婦蠶于公桑
  - page: 208
    col: 7
    role: z
    text: 蠶室奉繭以示于君遂獻于夫人夫
  - page: 208
    col: 8
    role: z
    text: 人副褘受之繅三盆手遂布于三宮
  - page: 208
    col: 9
    role: z
    text: 世婦使繅以為黼黻文章而服以祀
  - page: 208
    col: 10
    role: z
    text: 先王先公又曰士有田則祭無田則
  - page: 208
    col: 11
    role: z
    text: 薦黍稷曰粢在器曰盛牲殺牲必特
  - page: 208
    col: 12
    role: z
    text: 殺也皿所以覆器者
  - page: 208
    col: 13
    role: j
    text: 出疆必載質何也
  - page: 208
    col: 14
    role: z
    text: 周霄問也
  - page: 208
    col: 15
    role: j
    text: 曰士之仕也猶農夫之耕也農夫豈為
  - page: 208
    col: 16
    role: j
    text: 出疆舍其耒耜哉
  - page: 209
    col: 1
    role: z
    text: 爲去聲舎上聲
  - page: 209
    col: 2
    role: j
    text: 曰晉國亦仕國也未甞聞仕如此其急
  - page: 209
    col: 3
    role: j
    text: 仕如此其急也君子之難仕何也曰丈
  - page: 209
    col: 4
    role: j
    text: 夫生而願爲之有室女子生而願爲之
  - page: 209
    col: 5
    role: j
    text: 有家父母之心人皆有之不待父母之
  - page: 209
    col: 6
    role: j
    text: 命媒妁之言鑽穴隙相窺踰牆相從則
  - page: 209
    col: 7
    role: j
    text: 父母國人皆賤之古之人未甞不欲仕
  - page: 209
    col: 8
    role: j
    text: 也又惡不由其道不由其道而往者與
  - page: 209
    col: 9
    role: j
    text: 鑽穴隙之類也
  - page: 209
    col: 10
    role: z
    text: 爲去聲妁音酌隙去逆反惡去聲○
  - page: 209
    col: 11
    role: z
    text: 晉國解見首篇仕國謂君子游宦之
  - page: 209
    col: 12
    role: z
    text: 國霄意以孟子不見諸侯爲難仕故
  - page: 209
    col: 13
    role: z
    text: 先問古之君子仕否然後言此以風
  - page: 209
    col: 14
    role: z
    text: 切之也男以女爲室女以男爲家妁
  - page: 209
    col: 15
    role: z
    text: 亦媒也言爲父母者非不願其男女
  - page: 209
    col: 16
    role: z
    text: 之有室家而亦惡其不由道蓋君子
  - page: 210
    col: 1
    role: j
    text: 雖不潔身以亂倫而亦不徇利而忘
  - page: 210
    col: 2
    role: j
    text: 義也
  - page: 210
    col: 3
    role: j
    text: 彭更問曰後車數十乘從者數百人以
  - page: 210
    col: 4
    role: j
    text: 傳食於諸侯不以泰乎孟子曰非其道
  - page: 210
    col: 5
    role: j
    text: 則一簞食不可受於人如其道則舜受
  - page: 210
    col: 6
    role: j
    text: 堯之天下不以為泰子以為泰乎
  - page: 210
    col: 7
    role: j
    text: 更平聲乘從皆去聲傳直戀反簞音
  - page: 210
    col: 8
    role: j
    text: 丹食音嗣○彭更孟子弟子也泰侈
  - page: 210
    col: 9
    role: j
    text: 也
  - page: 210
    col: 10
    role: j
    text: 曰否士無事而食不可也
  - page: 210
    col: 11
    role: j
    text: 言不以舜為泰但謂今之士無功而
  - page: 210
    col: 12
    role: j
    text: 食人之食則不可也
  - page: 210
    col: 13
    role: j
    text: 曰子不通功易事以羨補不足則農有
  - page: 210
    col: 14
    role: j
    text: 餘粟女有餘布子如通之則梓匠輪輿
  - page: 210
    col: 15
    role: j
    text: 皆得食於子於此有人焉入則孝出則
  - page: 210
    col: 16
    role: j
    text: 悌守先王之道以待後之學者而不得
  - page: 211
    col: 1
    role: j
    text: 食於子子何尊梓匠輪輿而輕爲仁義
  - page: 211
    col: 2
    role: j
    text: 者哉
  - page: 211
    col: 3
    role: z
    text: 羨延面反○通功易事謂通人之功
  - page: 211
    col: 4
    role: z
    text: 而交易其事羨餘也有餘言無所貿
  - page: 211
    col: 5
    role: z
    text: 易而積於無用也梓人匠人木工也
  - page: 211
    col: 6
    role: z
    text: 輪人輿人車工也
  - page: 211
    col: 7
    role: j
    text: 曰梓匠輪輿其志將以求食也君子之
  - page: 211
    col: 8
    role: j
    text: 爲道也其志亦將以求食與曰子何以
  - page: 211
    col: 9
    role: j
    text: 其志爲哉其有功於子可食而食之矣
  - page: 211
    col: 10
    role: j
    text: 且子食志乎食功乎曰食志
  - page: 211
    col: 11
    role: j
    text: 與平聲可食而食食志食功之食皆
  - page: 211
    col: 12
    role: z
    text: 音嗣下同○孟子言自我而言固不
  - page: 211
    col: 13
    role: z
    text: 求食自彼而言凡有功者則當食之
  - page: 211
    col: 14
    role: j
    text: 曰有人於此毀瓦畫墁其志將以求食
  - page: 211
    col: 15
    role: j
    text: 也則子食之乎曰否曰然則子非食志
  - page: 211
    col: 16
    role: j
    text: 也食功也
  - page: 212
    col: 1
    role: z
    text: 墁武安反子食之食亦音嗣○墁牆
  - page: 212
    col: 2
    role: z
    text: 壁之飾也毀瓦畫墁言無功而有害
  - page: 212
    col: 3
    role: z
    text: 也既曰食功則以士為無事而食者
  - page: 212
    col: 4
    role: z
    text: 眞尊梓匠輪輿而輕為仁義者矣
  - page: 212
    col: 5
    role: j
    text: 萬章問曰宋小國也今將行王政齊楚
  - page: 212
    col: 6
    role: j
    text: 惡而伐之則如之何
  - page: 212
    col: 7
    role: z
    text: 惡去聲○萬章孟子弟子宋王偃嘗
  - page: 212
    col: 8
    role: z
    text: 滅滕伐薛敗齊楚魏之兵欲霸天下
  - page: 212
    col: 9
    role: z
    text: 疑即此時也
  - page: 212
    col: 10
    role: j
    text: 孟子曰湯居亳與葛為鄰葛伯放而不
  - page: 212
    col: 11
    role: j
    text: 祀湯使人問之曰何為不祀曰無以供
  - page: 212
    col: 12
    role: j
    text: 犧牲也湯使遺之牛羊葛伯食之又不
  - page: 212
    col: 13
    role: j
    text: 以祀湯又使人問之曰何為不祀曰無
  - page: 212
    col: 14
    role: j
    text: 以供粢盛也湯使亳眾往為之耕老弱
  - page: 212
    col: 15
    role: j
    text: 饋食葛伯率其民要其有酒食黍稻者
  - page: 212
    col: 16
    role: j
    text: 奪之不授者殺之有童子以黍肉餉殺
  - page: 213
    col: 1
    role: j
    text: 而奪之書曰葛伯仇餉此之謂也
  - page: 213
    col: 2
    role: z
    text: 遺唯季反盛音成往爲之爲去聲饋
  - page: 213
    col: 3
    role: z
    text: 食酒食之食音嗣要平聲餉式亮反
  - page: 213
    col: 4
    role: z
    text: ○葛國名伯爵也放而不祀放縱無
  - page: 213
    col: 5
    role: z
    text: 道不祀先祖也毫衆湯之民其民葛
  - page: 213
    col: 6
    role: z
    text: 民也授與也餉亦饋也書商書仲虺
  - page: 213
    col: 7
    role: z
    text: 之誥也仇餉言與餉者爲仇也
  - page: 213
    col: 8
    role: j
    text: 爲其殺是童子而征之四海之内皆曰
  - page: 213
    col: 9
    role: j
    text: 非富天下也爲匹夫匹婦復讐也
  - page: 213
    col: 10
    role: z
    text: 爲去聲○非富天下言湯之心非以
  - page: 213
    col: 11
    role: z
    text: 天下爲富而欲得之也
  - page: 213
    col: 12
    role: j
    text: 湯始征自葛載十一征而無敵於天下
  - page: 213
    col: 13
    role: j
    text: 東靣而征西夷怨南靣而征北夷怨曰
  - page: 213
    col: 14
    role: j
    text: 奚爲後我民之望之若大旱之望雨也
  - page: 213
    col: 15
    role: j
    text: 歸市者弗止芸者不變誅其君弔其民
  - page: 213
    col: 16
    role: j
    text: 如時雨降民大悅書曰徯我后后來其
  - page: 214
    col: 1
    role: j
    text: 無罰
  - page: 214
    col: 2
    role: z
    text: 載亦始也十一征所征十一國也餘
  - page: 214
    col: 3
    role: z
    text: 巳見前篇
  - page: 214
    col: 4
    role: j
    text: 有攸不惟臣東征綏厥士女匪厥玄黃
  - page: 214
    col: 5
    role: j
    text: 紹我周王見休惟臣附于大邑周其君
  - page: 214
    col: 6
    role: j
    text: 子實玄黃于匪以迎其君子其小人簞
  - page: 214
    col: 7
    role: j
    text: 食壺漿以迎其小人救民於水火之中
  - page: 214
    col: 8
    role: j
    text: 取其殘而巳矣
  - page: 214
    col: 9
    role: j
    text: 食音嗣○按周書武成篇載武王之
  - page: 214
    col: 10
    role: j
    text: 言孟子約其文如此然其辭時與今
  - page: 214
    col: 11
    role: j
    text: 書文不類今姑依此文解之有所不
  - page: 214
    col: 12
    role: j
    text: 惟臣謂助紂爲惡而不爲周臣者匪
  - page: 214
    col: 13
    role: j
    text: 與篚同玄黃幣也紹繼也猶言事也
  - page: 214
    col: 14
    role: j
    text: 言其士女以匪盛玄黃之幣迎武王
  - page: 214
    col: 15
    role: j
    text: 而事之也商人而曰我周王猶商書
  - page: 214
    col: 16
    role: j
    text: 所謂我后也休美也言武王能順天
  - page: 215
    col: 1
    role: z
    text: 休命而事之者皆見休也臣附歸服
  - page: 215
    col: 2
    role: z
    text: 也孟子又釋其意言商人聞周師之
  - page: 215
    col: 3
    role: z
    text: 來各以其類相迎者以武王能捄民
  - page: 215
    col: 4
    role: z
    text: 於水火之中取其殘民者誅之而不
  - page: 215
    col: 5
    role: z
    text: 爲暴虐耳君子謂在位之人小人謂
  - page: 215
    col: 6
    role: z
    text: 細民也
  - page: 215
    col: 7
    role: j
    text: 太誓曰我武惟揚侵于之疆則取于殘
  - page: 215
    col: 8
    role: j
    text: 殺伐用張于湯有光
  - page: 215
    col: 9
    role: z
    text: 太誓周書也今書文亦小異言武王
  - page: 215
    col: 10
    role: z
    text: 威武奮揚侵彼紂之疆界取其殘賊
  - page: 215
    col: 11
    role: z
    text: 而殺伐之功因以張大比於湯之伐
  - page: 215
    col: 12
    role: z
    text: 桀又有光焉引此以證上文取其殘
  - page: 215
    col: 13
    role: z
    text: 之義
  - page: 215
    col: 14
    role: j
    text: 不行王政云爾苟行王政四海之内皆
  - page: 215
    col: 15
    role: j
    text: 舉首而望之欲以爲君齊楚雖大何畏
  - page: 215
    col: 16
    role: j
    text: 焉
  - page: 216
    col: 1
    role: z
    text: 宋實不能行王政後果為齊所滅王
  - page: 216
    col: 2
    role: z
    text: 偃走死○尹氏曰為國者能自治而
  - page: 216
    col: 3
    role: z
    text: 得民心則天下皆將歸往之恨其征
  - page: 216
    col: 4
    role: z
    text: 伐之不早也尚何強國之足畏哉苟
  - page: 216
    col: 5
    role: z
    text: 不自治而以強弱之勢言之是可畏
  - page: 216
    col: 6
    role: z
    text: 而已矣
  - page: 216
    col: 7
    role: j
    text: 孟子謂戴不勝曰子欲子之王之善與
  - page: 216
    col: 8
    role: j
    text: 我明告子有楚大夫於此欲其子之齊
  - page: 216
    col: 9
    role: j
    text: 語也則使齊人傅諸使楚人傅諸曰使
  - page: 216
    col: 10
    role: j
    text: 齊人傅之曰一齊人傅之衆楚人咻之
  - page: 216
    col: 11
    role: j
    text: 雖日撻而求其齊也不可得矣引而置
  - page: 216
    col: 12
    role: j
    text: 之莊嶽之間數年雖日撻而求其楚亦
  - page: 216
    col: 13
    role: j
    text: 不可得矣
  - page: 216
    col: 14
    role: z
    text: 與平聲咻音休○戴不勝宋臣也齊
  - page: 216
    col: 15
    role: z
    text: 語齊人語也傅教也咻讙也齊齊語
  - page: 216
    col: 16
    role: z
    text: 也莊嶽齊街里名也楚楚語也此先
  - page: 217
    col: 1
    role: z
    text: 設譬以曉之也
  - page: 217
    col: 2
    role: j
    text: 子謂薛居州善士也使之居於王所在
  - page: 217
    col: 3
    role: j
    text: 於王所者長幼卑尊皆薛居州也王誰
  - page: 217
    col: 4
    role: j
    text: 與為不善在王所者長幼卑尊皆非薛
  - page: 217
    col: 5
    role: j
    text: 居州也王誰與為善一薛居州獨如宋
  - page: 217
    col: 6
    role: j
    text: 王何
  - page: 217
    col: 7
    role: z
    text: 長上聲○居州亦宋臣言小人衆而
  - page: 217
    col: 8
    role: z
    text: 君子獨無以成正君之功
  - page: 217
    col: 9
    role: j
    text: 公孫丑問曰不見諸侯何義孟子曰古
  - page: 217
    col: 10
    role: j
    text: 者不為臣不見
  - page: 217
    col: 11
    role: z
    text: 不為臣謂未仕於其國者也此不見
  - page: 217
    col: 12
    role: z
    text: 諸侯之義也
  - page: 217
    col: 13
    role: j
    text: 段干木踰垣而辟之泄柳閉門而不内
  - page: 217
    col: 14
    role: j
    text: 是皆已甚迫斯可以見矣
  - page: 217
    col: 15
    role: z
    text: 辟去聲内與納同○段干木魏文侯
  - page: 217
    col: 16
    role: z
    text: 時人泄柳魯繆公時人文侯繆公欲
  - page: 218
    col: 1
    role: z
    text: 見此二人而二人不肯見之蓋未爲
  - page: 218
    col: 2
    role: z
    text: 臣也已甚過甚也迫謂求見之切也
  - page: 218
    col: 3
    role: j
    text: 陽貨欲見孔子而惡無禮大夫有賜於
  - page: 218
    col: 4
    role: j
    text: 士不得受於其家則往拜其門陽貨矙
  - page: 218
    col: 5
    role: j
    text: 孔子之亡也而饋孔子蒸豚孔子亦矙
  - page: 218
    col: 6
    role: j
    text: 其亡也而往拜之當是時陽貨先豈得
  - page: 218
    col: 7
    role: j
    text: 不見
  - page: 218
    col: 8
    role: z
    text: 欲見之見音現惡去聲矙音勘○此
  - page: 218
    col: 9
    role: z
    text: 又引孔子之事以明可見之節也欲
  - page: 218
    col: 10
    role: z
    text: 見孔子欲召孔子來見己也惡無禮
  - page: 218
    col: 11
    role: z
    text: 畏人以己爲無禮也受於其家對使
  - page: 218
    col: 12
    role: z
    text: 人拜受於家也其門大夫之門也矙
  - page: 218
    col: 13
    role: z
    text: 窺也陽貨於魯爲大夫孔子爲士故
  - page: 218
    col: 14
    role: z
    text: 以此物及其不在而饋之欲其來拜
  - page: 218
    col: 15
    role: z
    text: 而見之也先謂先來加禮也
  - page: 218
    col: 16
    role: j
    text: 曽子曰脅肩謟笑病于夏畦子路曰未
  - page: 219
    col: 1
    role: j
    text: 同而言觀其色赧赧然非由之所知也
  - page: 219
    col: 2
    role: j
    text: 由是觀之則君子之所養可知已矣
  - page: 219
    col: 3
    role: z
    text: 脅虛業反赧奴簡反○脅肩竦體謟
  - page: 219
    col: 4
    role: z
    text: 笑強笑皆小人側媚之態也病勞也
  - page: 219
    col: 5
    role: z
    text: 夏畦夏月治畦之人也言爲此者其
  - page: 219
    col: 6
    role: z
    text: 勞過於夏畦之人也未同而言與人
  - page: 219
    col: 7
    role: z
    text: 未合而強與之言也赧赧慙而面赤
  - page: 219
    col: 8
    role: z
    text: 之貌由子路名言非己所知甚惡之
  - page: 219
    col: 9
    role: z
    text: 之辭也孟子言由此二言觀之則二
  - page: 219
    col: 10
    role: z
    text: 子之所養可知必不肯不俟其禮之
  - page: 219
    col: 11
    role: z
    text: 至而輙往見之也○此章言聖人禮
  - page: 219
    col: 12
    role: z
    text: 義之中正過之者傷於迫切而不洪
  - page: 219
    col: 13
    role: z
    text: 不及者淪於汙賤而可恥
  - page: 219
    col: 14
    role: j
    text: 戴盈之曰什一去關市之征今兹未能
  - page: 219
    col: 15
    role: j
    text: 請輕之以待來年然後已何如
  - page: 219
    col: 16
    role: z
    text: 去上聲○盈之亦宋大夫也什一并
  - page: 220
    col: 1
    role: z
    text: 田之法也關市之征商賈之稅也已
  - page: 220
    col: 2
    role: z
    text: 止也
  - page: 220
    col: 3
    role: j
    text: 孟子曰今有人日攘其鄰之雞者或告
  - page: 220
    col: 4
    role: j
    text: 之曰是非君子之道曰請損之月攘一
  - page: 220
    col: 5
    role: j
    text: 雞以待來年然後已
  - page: 220
    col: 6
    role: z
    text: 攘如羊反○攘物自來而取之也損
  - page: 220
    col: 7
    role: z
    text: 减也
  - page: 220
    col: 8
    role: j
    text: 如知其非義斯速已矣何待來年
  - page: 220
    col: 9
    role: z
    text: 知義理之不可而不能速改與月攘
  - page: 220
    col: 10
    role: z
    text: 一雞何以異哉
  - page: 220
    col: 11
    role: j
    text: 公都子曰外人皆稱夫子好辯敢問何
  - page: 220
    col: 12
    role: j
    text: 也孟子曰予豈好辯哉予不得已也
  - page: 220
    col: 13
    role: z
    text: 好去聲下同
  - page: 220
    col: 14
    role: j
    text: 天下之生久矣一治一亂
  - page: 220
    col: 15
    role: z
    text: 治去聲○生謂生民也一治一亂氣
  - page: 220
    col: 16
    role: z
    text: 化盛衰人事得失反覆相尋理之常
  - page: 221
    col: 1
    role: z
    text: 也
  - page: 221
    col: 2
    role: j
    text: 當堯之時水逆行氾濫於中國蛇龍居
  - page: 221
    col: 3
    role: j
    text: 之民無所定下者爲巢上者爲營窟書
  - page: 221
    col: 4
    role: j
    text: 曰洚水警余洚水者洪水也
  - page: 221
    col: 5
    role: z
    text: 洚音降又胡貢胡工二反○水逆行
  - page: 221
    col: 6
    role: z
    text: 下流壅塞故水倒流而旁溢也下下
  - page: 221
    col: 7
    role: z
    text: 地上高地也營窟穴處也書虞書大
  - page: 221
    col: 8
    role: z
    text: 禹謨也洚水洚洞無涯之水也警戒
  - page: 221
    col: 9
    role: z
    text: 也此一亂也
  - page: 221
    col: 10
    role: j
    text: 使禹治之禹掘地而注之海驅蛇龍而
  - page: 221
    col: 11
    role: j
    text: 放之菹水由地中行江淮河漢是也險
  - page: 221
    col: 12
    role: j
    text: 阻既遠鳥獸之害人者消然後人得平
  - page: 221
    col: 13
    role: j
    text: 土而居之
  - page: 221
    col: 14
    role: z
    text: 菹側魚反○掘地掘去壅塞也菹澤
  - page: 221
    col: 15
    role: z
    text: 生草者也地中兩涯之間也險阻謂
  - page: 221
    col: 16
    role: z
    text: 水之汜濫也遠去也消除也此一治
  - page: 222
    col: 1
    role: j
    text: 也
  - page: 222
    col: 2
    role: j
    text: 堯舜既沒聖人之道衰暴君代作壞宮
  - page: 222
    col: 3
    role: j
    text: 室以爲汙池民無所安息棄田以爲園
  - page: 222
    col: 4
    role: j
    text: 囿使民不得衣食邪說暴行又作園囿
  - page: 222
    col: 5
    role: j
    text: 汙池沛澤多而禽獸至及紂之身天下
  - page: 222
    col: 6
    role: j
    text: 又大亂
  - page: 222
    col: 7
    role: z
    text: 壞音怪行去聲下同沛蒲內反○暴
  - page: 222
    col: 8
    role: z
    text: 君謂夏太康孔甲履癸商武乙之類
  - page: 222
    col: 9
    role: z
    text: 也宮室民居也沛草木之所生也澤
  - page: 222
    col: 10
    role: j
    text: 水所鍾也自堯舜沒至此治亂非一
  - page: 222
    col: 11
    role: z
    text: 及紂而又一大亂也
  - page: 222
    col: 12
    role: j
    text: 周公相武王誅紂伐奄三年討其君驅
  - page: 222
    col: 13
    role: j
    text: 飛廉於海隅而戮之滅國者五十驅虎
  - page: 222
    col: 14
    role: j
    text: 豹犀象而遠之天下大悅書曰丕顯哉
  - page: 222
    col: 15
    role: j
    text: 文王謨丕承哉武王烈佑啓我後人咸
  - page: 222
    col: 16
    role: j
    text: 以正無缺
  - page: 223
    col: 1
    role: j
    text: 相去聲奄平聲○奄東方之國助紂
  - page: 223
    col: 2
    role: j
    text: 爲虐者也飛廉紂幸臣也五十國皆
  - page: 223
    col: 3
    role: j
    text: 紂黨虐民者也書周書君牙之篇丕
  - page: 223
    col: 4
    role: j
    text: 大也顯明也謨謀也承繼也烈光也
  - page: 223
    col: 5
    role: z
    text: 佑助也啓開也缺壞也此一治也
  - page: 223
    col: 6
    role: j
    text: 世衰道微邪說暴行有作臣弑其君者
  - page: 223
    col: 7
    role: j
    text: 有之子弑其父者有之
  - page: 223
    col: 8
    role: z
    text: 有作之有讀爲又古字通用○此周
  - page: 223
    col: 9
    role: z
    text: 室東遷之後又一亂也
  - page: 223
    col: 10
    role: j
    text: 孔子懼作春秋春秋天子之事也是故
  - page: 223
    col: 11
    role: j
    text: 孔子曰知我者其惟春秋乎罪我者其
  - page: 223
    col: 12
    role: j
    text: 惟春秋乎
  - page: 223
    col: 13
    role: z
    text: 胡氏曰仲尼作春秋以寓王法厚典
  - page: 223
    col: 14
    role: j
    text: 庸禮命德討罪其大要皆天子之事
  - page: 223
    col: 15
    role: j
    text: 也知孔子者謂此書之作遏人欲於
  - page: 223
    col: 16
    role: j
    text: 橫流存天理於旣滅爲後世慮至深
  - page: 224
    col: 1
    role: z
    text: 逺也罪孔子者以謂無其位而託二
  - page: 224
    col: 2
    role: z
    text: 百四十二年南面之權使亂臣賊子
  - page: 224
    col: 3
    role: z
    text: 禁其欲而不得肆則戚矣愚謂孔子
  - page: 224
    col: 4
    role: z
    text: 作春秋以討亂賊則致治之法垂於
  - page: 224
    col: 5
    role: z
    text: 萬世是亦一治也
  - page: 224
    col: 6
    role: j
    text: 聖王不作諸侯放恣處士橫議楊朱墨
  - page: 224
    col: 7
    role: j
    text: 翟之言盈天下天下之言不歸楊則歸
  - page: 224
    col: 8
    role: j
    text: 墨楊氏為我是無君也墨氏兼愛是無
  - page: 224
    col: 9
    role: j
    text: 父也無父無君是禽獸也公明儀曰庖
  - page: 224
    col: 10
    role: j
    text: 有肥肉廄有肥馬民有飢色野有餓莩
  - page: 224
    col: 11
    role: j
    text: 此率禽獸而食人也楊墨之道不息孔
  - page: 224
    col: 12
    role: j
    text: 子之道不著是邪說誣民充塞仁義也
  - page: 224
    col: 13
    role: j
    text: 仁義充塞則率獸食人人將相食
  - page: 224
    col: 14
    role: z
    text: 橫為皆去聲莩皮表反○楊朱但知
  - page: 224
    col: 15
    role: z
    text: 愛身而不復知有致身之義故無君
  - page: 224
    col: 16
    role: z
    text: 墨子愛無差等而視其至親無異衆
  - page: 225
    col: 1
    role: z
    text: 人故無父無父無君則人道滅絶是
  - page: 225
    col: 2
    role: z
    text: 亦禽獸而已公明儀之言義見首篇
  - page: 225
    col: 3
    role: z
    text: 充塞仁義謂邪說徧滿妨於仁義也
  - page: 225
    col: 4
    role: z
    text: 孟子引儀之言以明楊墨道行則人
  - page: 225
    col: 5
    role: z
    text: 皆無父無君以陷於禽獸而大亂將
  - page: 225
    col: 6
    role: z
    text: 起是亦率獸食人而人又相食也此
  - page: 225
    col: 7
    role: z
    text: 又一亂也
  - page: 225
    col: 8
    role: j
    text: 吾為此懼閑先聖之道距楊墨放淫辭
  - page: 225
    col: 9
    role: j
    text: 邪說者不得作作於其心害於其事作
  - page: 225
    col: 10
    role: j
    text: 於其事害於其政聖人復起不易吾言
  - page: 225
    col: 11
    role: j
    text: 矣
  - page: 225
    col: 12
    role: z
    text: 爲去聲復扶又反○閑衛也放驅而
  - page: 225
    col: 13
    role: z
    text: 遠之也作起也事所行政大體也孟
  - page: 225
    col: 14
    role: z
    text: 子雖不得志於時然楊墨之害自是
  - page: 225
    col: 15
    role: z
    text: 滅息而君臣父子之道頼以不墜是
  - page: 225
    col: 16
    role: z
    text: 亦一治也○程子曰楊墨之害甚於
  - page: 226
    col: 1
    role: z
    text: 申韓佛氏之害甚於楊墨蓋楊氏爲
  - page: 226
    col: 2
    role: z
    text: 我疑於義墨氏兼愛疑於仁申韓則
  - page: 226
    col: 3
    role: z
    text: 淺陋易見故孟子止闢楊墨爲其惑
  - page: 226
    col: 4
    role: z
    text: 世之甚也佛氏之言近理又非楊墨
  - page: 226
    col: 5
    role: z
    text: 之比所以爲害尤甚
  - page: 226
    col: 6
    role: j
    text: 昔者禹抑洪水而天下平周公兼夷狄
  - page: 226
    col: 7
    role: j
    text: 驅猛獸而百姓寧孔子成春秋而亂臣
  - page: 226
    col: 8
    role: j
    text: 賊子懼
  - page: 226
    col: 9
    role: z
    text: 抑止也兼并之也總結上文也
  - page: 226
    col: 10
    role: j
    text: 詩云戎狄是膺荆舒是懲則莫我敢承
  - page: 226
    col: 11
    role: j
    text: 無父無君是周公所膺也
  - page: 226
    col: 12
    role: z
    text: 說見上篇承當也
  - page: 226
    col: 13
    role: j
    text: 我亦欲正人心息邪說距詖行放淫辭
  - page: 226
    col: 14
    role: j
    text: 以承三聖者豈好辯哉予不得已也
  - page: 226
    col: 15
    role: z
    text: 行好皆去聲○詖淫解見前篇辭者
  - page: 226
    col: 16
    role: z
    text: 說之詳也承繼也三聖禹周公孔子
  - page: 227
    col: 1
    role: j
    text: 也蓋邪說橫流壞人心術甚於洪水
  - page: 227
    col: 2
    role: j
    text: 猛獸之災慘於夷狄篡弒之禍故孟
  - page: 227
    col: 3
    role: z
    text: 子深懼而力捄之再言豈好辯哉予
  - page: 227
    col: 4
    role: j
    text: 不得已也所以深致意焉然非知道
  - page: 227
    col: 5
    role: j
    text: 之君子孰能眞知其所以不得已之
  - page: 227
    col: 6
    role: z
    text: 故哉
  - page: 227
    col: 7
    role: j
    text: 能言距楊墨者聖人之徒也
  - page: 227
    col: 8
    role: z
    text: 言苟有能爲此距楊墨之說者則其
  - page: 227
    col: 9
    role: j
    text: 所趨正矣雖未必知道是亦聖人之
  - page: 227
    col: 10
    role: j
    text: 徒也孟子旣答公都子之問而意有
  - page: 227
    col: 11
    role: j
    text: 未盡故復言此蓋邪說害正人人得
  - page: 227
    col: 12
    role: j
    text: 而攻之不必聖賢如春秋之法亂臣
  - page: 227
    col: 13
    role: j
    text: 賊子人人得而討之不必士師也聖
  - page: 227
    col: 14
    role: j
    text: 人救世立法之意其切如此若以此
  - page: 227
    col: 15
    role: j
    text: 意推之則不能攻討而又唱爲不必
  - page: 227
    col: 16
    role: j
    text: 攻討之說者其爲邪詖之徒亂賊之
  - page: 228
    col: 1
    role: z
    text: 黨可知矣○尹氏曰學者於是非之
  - page: 228
    col: 2
    role: z
    text: 原毫釐有差則害流於生民禍及於
  - page: 228
    col: 3
    role: z
    text: 後世故孟子辯邪說如是之嚴而自
  - page: 228
    col: 4
    role: z
    text: 以爲承三聖之功也當是時方且以
  - page: 228
    col: 5
    role: z
    text: 好辯目之是以常人之心而度聖賢
  - page: 228
    col: 6
    role: z
    text: 之心也
  - page: 228
    col: 7
    role: j
    text: 匡章曰陳仲子豈不誠廉士哉居於陵
  - page: 228
    col: 8
    role: j
    text: 三日不食耳無聞目無見也井上有李
  - page: 228
    col: 9
    role: j
    text: 螬食實者過半矣匍匐往將食之三咽
  - page: 228
    col: 10
    role: j
    text: 然後耳有聞目有見
  - page: 228
    col: 11
    role: z
    text: 於音烏下於陵同螬音曹咽音宴○
  - page: 228
    col: 12
    role: z
    text: 匡章陳仲子皆齊人廉有分辦不苟
  - page: 228
    col: 13
    role: z
    text: 取也於陵地名螬蠐螬蟲也匍匐言
  - page: 228
    col: 14
    role: z
    text: 無力不能行也咽吞也
  - page: 228
    col: 15
    role: j
    text: 孟子曰於齊國之士吾必以仲子爲巨
  - page: 228
    col: 16
    role: j
    text: 擘焉雖然仲子惡能廉充仲子之操則
  - page: 229
    col: 1
    role: j
    text: 蚓而後可者也
  - page: 229
    col: 2
    role: z
    text: 擘薄厄反惡平聲蚓音引○巨擘大
  - page: 229
    col: 3
    role: z
    text: 指也言齊人中有仲子如衆小指中
  - page: 229
    col: 4
    role: z
    text: 有大指也充推而滿之也操所守也
  - page: 229
    col: 5
    role: z
    text: 蚓丘蚓也言仲子未得爲廉也必若
  - page: 229
    col: 6
    role: z
    text: 滿其所守之志則惟丘蚓之無求於
  - page: 229
    col: 7
    role: z
    text: 世然後可以爲廉耳
  - page: 229
    col: 8
    role: j
    text: 夫蚓上食槁壤下飲黃泉仲子所居之
  - page: 229
    col: 9
    role: j
    text: 室伯夷之所築與抑亦盜跖之所築與
  - page: 229
    col: 10
    role: j
    text: 所食之粟伯夷之所樹與抑亦盜跖之
  - page: 229
    col: 11
    role: j
    text: 所樹與是未可知也
  - page: 229
    col: 12
    role: z
    text: 夫音扶與平聲○槁壤乾土也黃泉
  - page: 229
    col: 13
    role: z
    text: 濁水也抑發語辭也言蚓無求於人
  - page: 229
    col: 14
    role: z
    text: 而自足而仲子未免居室食粟若所
  - page: 229
    col: 15
    role: z
    text: 從來或有非義則是未能如蚓之廉
  - page: 229
    col: 16
    role: z
    text: 也
  - page: 230
    col: 1
    role: j
    text: 曰是何傷哉彼身織屨妻辟纑以易之
  - page: 230
    col: 2
    role: j
    text: 也
  - page: 230
    col: 3
    role: z
    text: 辟音壁纑音盧○辟績也纑練麻也
  - page: 230
    col: 4
    role: j
    text: 曰仲子齊之世家也兄戴蓋祿萬鍾以
  - page: 230
    col: 5
    role: j
    text: 兄之祿為不義之祿而不食也以兄之
  - page: 230
    col: 6
    role: j
    text: 室為不義之室而不居也辟兄離母處
  - page: 230
    col: 7
    role: j
    text: 於於陵他日歸則有饋其兄生鵞者己
  - page: 230
    col: 8
    role: j
    text: 頻顣曰惡用是鶃鶃者為哉他日其母
  - page: 230
    col: 9
    role: j
    text: 殺是鵞也與之食之其兄自外至曰是
  - page: 230
    col: 10
    role: j
    text: 鶃鶃之肉也出而哇之
  - page: 230
    col: 11
    role: z
    text: 蓋音閤辟音避頻與顰同顣與蹙同
  - page: 230
    col: 12
    role: z
    text: 子六反惡平聲鶃魚一反哇音蛙○
  - page: 230
    col: 13
    role: z
    text: 世家世卿之家兄名戴食采於蓋其
  - page: 230
    col: 14
    role: z
    text: 入萬鍾也歸自於陵歸也已仲子也
  - page: 230
    col: 15
    role: z
    text: 鶃鶃鵞聲也頻顣而言以其兄受饋
  - page: 230
    col: 16
    role: z
    text: 為不義也哇吐之也
  - page: 231
    col: 1
    role: j
    text: 以母則不食以妻則食之以兄之室則
  - page: 231
    col: 2
    role: j
    text: 弗居以於陵則居之是尚爲能充其類
  - page: 231
    col: 3
    role: j
    text: 也乎若仲子者蚓而後充其操者也
  - page: 231
    col: 4
    role: z
    text: 言仲子以母之食兄之室爲不義而
  - page: 231
    col: 5
    role: z
    text: 不食不居其操守如此至於妻所易
  - page: 231
    col: 6
    role: z
    text: 之粟於陵所居之室既未必伯夷之
  - page: 231
    col: 7
    role: z
    text: 所爲則亦不義之類耳今仲子於此
  - page: 231
    col: 8
    role: z
    text: 則不食不居於彼則食之居之豈爲
  - page: 231
    col: 9
    role: z
    text: 能充滿其操守之類者乎必其無求
  - page: 231
    col: 10
    role: z
    text: 自足如丘蚓然乃爲能滿其志而得
  - page: 231
    col: 11
    role: z
    text: 爲廉耳然豈人之所可爲哉〇范氏
  - page: 231
    col: 12
    role: z
    text: 曰天之所生地之所養無人爲大人
  - page: 231
    col: 13
    role: z
    text: 之所以爲大者以其有人倫也仲子
  - page: 231
    col: 14
    role: z
    text: 避兄離母無親戚君臣上下是無人
  - page: 231
    col: 15
    role: z
    text: 倫也豈有無人倫而可以爲廉哉
