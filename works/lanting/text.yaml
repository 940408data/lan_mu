sections:
  - id: text
    name: 序文
    columns:
      - line: 1
        text: 永和九年歲在癸丑暮春之初
      - line: 2
        text: 會于會稽山陰之蘭亭修禊事
      - line: 3
        text: 也群賢畢至少長咸集此地有
      - line: 4
        text: 崇山峻嶺茂林修竹又有清流
      - line: 5
        text: 激湍映帶左右引以為流觴曲
      - line: 6
        text: 水列坐其次雖無絲竹管弦之
      - line: 7
        text: 盛一觴一詠亦足以暢敘幽情
      - line: 8
        text: 是日也天朗氣清惠風和暢仰
      - line: 9
        text: 觀宇宙之大俯察品類之盛所
      - line: 10
        text: 以遊目騁懷足以極視聽之娛
      - line: 11
        text: 信可樂也夫人之相與俯仰一
      - line: 12
        text: 世或取諸懷抱悟言一室之內
      - line: 13
        text: 或因寄所託放浪形骸之外雖
      - line: 14
        text: 趣舍萬殊靜躁不同當其欣於
      - line: 15
        text: 所遇暫得於己快然自足不知
      - line: 16
        text: 老之將至及其所之既倦情隨
      - line: 17
        text: 事遷感慨繫之矣向之所欣俯
      - line: 18
        text: 仰之間已為陳跡猶不能不以
      - line: 19
        text: 之興懷況修短隨化終期於盡
      - line: 20
        text: 古人云死生亦大矣豈不痛哉
      - line: 21
        text: 每覽昔人興感之由若合一契
      - line: 22
        text: 未嘗不臨文嗟悼不能喻之於
      - line: 23
        text: 懷固知一死生為虛誕齊彭殤
      - line: 24
        text: 為妄作後之視今亦猶今之視
      - line: 25
        text: 昔悲夫故列敘時人錄其所述
      - line: 26
        text: 雖世殊事異所以興懷其致一
      - line: 27
        text: 也後之覽者亦將有感於斯文
