# 序文勻整連排（摹刻行款）；句讀以斷讀段表達，跨列殘段（如「也」「水」）自成一段
# du：斷讀段字符串列表（句讀施朱），各段為經文連續前綴片段，段末鈐朱點；列尾無段不施點
sections:
  - id: text
    name: 序文
    columns:
      - line: 1
        text: 永和九年歲在癸丑暮春之初
        du: [永和九年, 歲在癸丑, 暮春之初]
      - line: 2
        text: 會于會稽山陰之蘭亭修禊事
        du: [會于會稽山陰之蘭亭]
      - line: 3
        text: 也群賢畢至少長咸集此地有
        du: [也, 群賢畢至, 少長咸集]
      - line: 4
        text: 崇山峻嶺茂林修竹又有清流
        du: [崇山峻嶺, 茂林修竹]
      - line: 5
        text: 激湍映帶左右引以為流觴曲
        du: [激湍, 映帶左右]
      - line: 6
        text: 水列坐其次雖無絲竹管弦之
        du: [水, 列坐其次]
      - line: 7
        text: 盛一觴一詠亦足以暢敘幽情
        du: [盛, 一觴一詠, 亦足以暢敘幽情]
      - line: 8
        text: 是日也天朗氣清惠風和暢仰
        du: [是日也, 天朗氣清, 惠風和暢]
      - line: 9
        text: 觀宇宙之大俯察品類之盛所
        du: [觀宇宙之大, 俯察品類之盛]
      - line: 10
        text: 以遊目騁懷足以極視聽之娛
        du: [以遊目騁懷, 足以極視聽之娛]
      - line: 11
        text: 信可樂也夫人之相與俯仰一
        du: [信可樂也, 夫人之相與]
      - line: 12
        text: 世或取諸懷抱悟言一室之內
        du: [世, 或取諸懷抱, 悟言一室之內]
      - line: 13
        text: 或因寄所託放浪形骸之外雖
        du: [或因寄所託, 放浪形骸之外]
      - line: 14
        text: 趣舍萬殊靜躁不同當其欣於
        du: [趣舍萬殊, 靜躁不同]
      - line: 15
        text: 所遇暫得於己快然自足不知
        du: [所遇, 暫得於己, 快然自足]
      - line: 16
        text: 老之將至及其所之既倦情隨
        du: [老之將至, 及其所之既倦]
      - line: 17
        text: 事遷感慨繫之矣向之所欣俯
        du: [事遷, 感慨繫之矣, 向之所欣]
      - line: 18
        text: 仰之間已為陳跡猶不能不以
        du: [仰之間, 已為陳跡]
      - line: 19
        text: 之興懷況修短隨化終期於盡
        du: [之興懷, 況修短隨化, 終期於盡]
      - line: 20
        text: 古人云死生亦大矣豈不痛哉
        du: [古人云, 死生亦大矣, 豈不痛哉]
      - line: 21
        text: 每覽昔人興感之由若合一契
        du: [每覽昔人興感之由, 若合一契]
      - line: 22
        text: 未嘗不臨文嗟悼不能喻之於
        du: [未嘗不臨文嗟悼]
      - line: 23
        text: 懷固知一死生為虛誕齊彭殤
        du: [懷, 固知一死生為虛誕]
      - line: 24
        text: 為妄作後之視今亦猶今之視
        du: [為妄作, 後之視今]
      - line: 25
        text: 昔悲夫故列敘時人錄其所述
        du: [昔, 悲夫, 故列敘時人, 錄其所述]
      - line: 26
        text: 雖世殊事異所以興懷其致一
        du: [雖世殊事異, 所以興懷]
      - line: 27
        text: 也後之覽者亦將有感於斯文
        du: [也, 後之覽者, 亦將有感於斯文]
