aboutHtml: |-
  <h2>關於這卷</h2>
    <p>《蘭亭集序》，東晉永和九年（353）三月初三，王羲之與謝安、孫綽等四十一人會於會稽山陰之蘭亭，修禊飲宴，流觴賦詩，羲之為之序。全文三百二十四字，被譽為「天下第一行書」。真跡據傳殉葬昭陵，今所傳以唐馮承素神龍摹本（故宮博物院藏，縱 24.5 厘米、橫 69.9 厘米）最為近真。</p>
    <h3>復刻取捨</h3>
    <p>本卷以蘭木手卷引擎重排：行文依維基文庫底本，取神龍本字序，整齊為<b>二十七行、行十二字</b>（原跡二十八行、行間參差，此處以勻整為尚）。字距 28、行距 46，墨色按「蘸墨—行筆—墨盡」的節奏逐字微調濃淡。無夾注。</p>
    <p>點綴取魏晋意度：卷首折枝一支、拖尾補蘭一叢，卷中兩處自天頭地腳淡淡探入一葉，不作全株；引首鈐「蘭亭雅集」與「永和」二印，拖尾鈐「曲水流觴」一印。皆極淡，遠觀若無，近察方見。</p>
    <h3>三體</h3>
    <p><b>宋體</b>近刊本，字口清勁；<b>寫經體</b>取楷法，如唐人寫經；<b>行楷</b>筆勢流走，最接近蘭亭體勢。三體共用同一版心格律，行數字數不變。若你的系統未裝相應中文字體，會自動退回可用的最近字體。</p>
