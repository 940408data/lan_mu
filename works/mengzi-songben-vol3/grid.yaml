labels:
  - page: 86
    col: 1
    role: j
    text: 孟子卷第三朱熹集注
  - page: 86
    col: 2
    role: title
    text: 公孫丑章句上
  - page: 86
    col: 3
    role: z
    text: 凡九章
  - page: 86
    col: 4
    role: j
    text: 公孫丑問曰夫子當路於齊管仲晏子
  - page: 86
    col: 5
    role: j
    text: 之功可復許乎
  - page: 86
    col: 6
    role: j
    text: 復扶又反○公孫丑孟子弟子齊人
  - page: 86
    col: 7
    role: j
    text: 也當路居要地也管仲齊大夫名夷
  - page: 86
    col: 8
    role: j
    text: 吾相威公霸諸侯許猶期也孟子未
  - page: 87
    col: 1
    role: z
    text: 嘗得政丑蓋設辭以問也
  - page: 87
    col: 2
    role: j
    text: 孟子曰子誠齊人也知管仲晏子而已矣
  - page: 87
    col: 3
    role: z
    text: 齊人但知其國有二子而已不復知
  - page: 87
    col: 4
    role: z
    text: 有聖賢之事
  - page: 87
    col: 5
    role: j
    text: 或問乎曾西曰吾子與子路孰賢曾西
  - page: 87
    col: 6
    role: j
    text: 蹵然曰吾先子之所畏也曰然則吾子
  - page: 87
    col: 7
    role: j
    text: 與管仲孰賢曾西艴然不悅曰爾何曾
  - page: 87
    col: 8
    role: j
    text: 比予於管仲管仲得君如彼其專也行
  - page: 87
    col: 9
    role: j
    text: 乎國政如彼其久也功烈如彼其卑也
  - page: 87
    col: 10
    role: j
    text: 爾何曾比予於是
  - page: 87
    col: 11
    role: z
    text: 蹵子六反艴音拂又音勃曾並音增
  - page: 87
    col: 12
    role: z
    text: ○孟子引曾西與或人問答如此曾
  - page: 87
    col: 13
    role: z
    text: 西曾子之孫蹵不安貌先子曾子也
  - page: 87
    col: 14
    role: z
    text: 艴怒色也曾之言則也烈猶光也威
  - page: 87
    col: 15
    role: z
    text: 公獨任管仲四十餘年是專且久也
  - page: 87
    col: 16
    role: z
    text: 管仲不知王道而行霸術故言功烈
  - page: 88
    col: 1
    role: j
    text: 之卑也○楊氏曰孔子言子路之才曰
  - page: 88
    col: 2
    role: z
    text: 千乘之國可使治其賦也使其見於
  - page: 88
    col: 3
    role: z
    text: 施爲如是而已其於九合諸侯一正
  - page: 88
    col: 4
    role: z
    text: 天下固有所不逮也然則曾西推尊
  - page: 88
    col: 5
    role: z
    text: 子路如此而羞比管仲者何哉譬之
  - page: 88
    col: 6
    role: z
    text: 御者子路則範我馳驅而不獲者也
  - page: 88
    col: 7
    role: z
    text: 管仲之功詭遇而獲禽耳曾西仲尼
  - page: 88
    col: 8
    role: z
    text: 之徒也故不道管仲之事
  - page: 88
    col: 9
    role: j
    text: 曰管仲曾西之所不爲也而子爲我願
  - page: 88
    col: 10
    role: j
    text: 之乎
  - page: 88
    col: 11
    role: z
    text: 子爲之爲去聲○曰孟子言也願望
  - page: 88
    col: 12
    role: z
    text: 也
  - page: 88
    col: 13
    role: j
    text: 曰管仲以其君霸晏子以其君顯管仲
  - page: 88
    col: 14
    role: j
    text: 晏子猶不足爲與
  - page: 88
    col: 15
    role: z
    text: 與平聲○顯顯名也
  - page: 88
    col: 16
    role: j
    text: 曰以齊王由反手也
  - page: 89
    col: 1
    role: z
    text: 王去聲由猶通○反手言易也
  - page: 89
    col: 2
    role: j
    text: 曰若是則弟子之惑滋甚且以文王之
  - page: 89
    col: 3
    role: j
    text: 德百年而後崩猶未洽於天下武王周
  - page: 89
    col: 4
    role: j
    text: 公繼之然後大行今言王若易然則文
  - page: 89
    col: 5
    role: j
    text: 王不足法與
  - page: 89
    col: 6
    role: z
    text: 易去聲下同與平聲○滋益也文王
  - page: 89
    col: 7
    role: z
    text: 九十七而崩言百年舉成數也文王
  - page: 89
    col: 8
    role: z
    text: 三分天下才有其二武王克商乃有
  - page: 89
    col: 9
    role: z
    text: 天下周公相成王制禮作樂然後教
  - page: 89
    col: 10
    role: z
    text: 化大行
  - page: 89
    col: 11
    role: j
    text: 曰文王何可當也由湯至於武丁賢聖
  - page: 89
    col: 12
    role: j
    text: 之君六七作天下歸殷乆矣乆則難變
  - page: 89
    col: 13
    role: j
    text: 也武丁朝諸侯有天下猶運之掌也紂
  - page: 89
    col: 14
    role: j
    text: 之去武丁未乆也其故家遺俗流風善
  - page: 89
    col: 15
    role: j
    text: 政猶有存者又有微子微仲王子比干
  - page: 89
    col: 16
    role: j
    text: 箕子膠鬲皆賢人也相與輔相之故乆
  - page: 90
    col: 1
    role: j
    text: 而後失之也尺地莫非其有也一民莫
  - page: 90
    col: 2
    role: j
    text: 非其臣也然而文王猶方百里起是以
  - page: 90
    col: 3
    role: j
    text: 難也
  - page: 90
    col: 4
    role: z
    text: 朝音潮鬲音隔又音歷輔相之相去
  - page: 90
    col: 5
    role: z
    text: 聲猶方之猶與由通○當猶敵也商
  - page: 90
    col: 6
    role: z
    text: 自成湯至於武丁中間太甲太戊祖
  - page: 90
    col: 7
    role: z
    text: 乙盤庚皆賢聖之君作起也自武丁
  - page: 90
    col: 8
    role: z
    text: 至紂凡九世故家舊臣之家也
  - page: 90
    col: 9
    role: j
    text: 齊人有言曰雖有智慧不如乘勢雖有
  - page: 90
    col: 10
    role: j
    text: 鎡基不如待時今時則易然也
  - page: 90
    col: 11
    role: z
    text: 鎡音兹○鎡基田器也時謂耕種之
  - page: 90
    col: 12
    role: z
    text: 時
  - page: 90
    col: 13
    role: j
    text: 夏后殷周之盛地未有過千里者也而
  - page: 90
    col: 14
    role: j
    text: 齊有其地矣雞鳴狗吠相聞而達乎四
  - page: 90
    col: 15
    role: j
    text: 境而齊有其民矣地不改辟矣民不改
  - page: 90
    col: 16
    role: j
    text: 聚矣行仁政而王莫之能禦也
  - page: 91
    col: 1
    role: z
    text: 辟與闢同○此言其勢之易也三代
  - page: 91
    col: 2
    role: z
    text: 盛時王畿不過千里今齊已有之異
  - page: 91
    col: 3
    role: z
    text: 於文王之百里又雞犬之聲相聞自
  - page: 91
    col: 4
    role: z
    text: 國都以至于四境言民居稠密也
  - page: 91
    col: 5
    role: j
    text: 且王者之不作未有疏於此時者也民
  - page: 91
    col: 6
    role: j
    text: 之憔悴於虐政未有甚於此時者也飢
  - page: 91
    col: 7
    role: j
    text: 者易爲食渴者易爲飲
  - page: 91
    col: 8
    role: z
    text: 此言其時之易也自文武至此七百
  - page: 91
    col: 9
    role: z
    text: 餘年異於商之賢聖繼作民苦虐政
  - page: 91
    col: 10
    role: z
    text: 之甚異於紂之猶有善政易爲飲食
  - page: 91
    col: 11
    role: z
    text: 言飢渴之甚不待甘美也
  - page: 91
    col: 12
    role: j
    text: 孔子曰德之流行速於置郵而傳命
  - page: 91
    col: 13
    role: z
    text: 郵音尤○置驛也郵馹也所以傳命
  - page: 91
    col: 14
    role: z
    text: 也孟子引孔子之言如此
  - page: 91
    col: 15
    role: j
    text: 當今之時萬乘之國行仁政民之悅之
  - page: 91
    col: 16
    role: j
    text: 猶解倒懸也故事半古之人功必倍之
  - page: 92
    col: 1
    role: j
    text: 惟此時為然
  - page: 92
    col: 2
    role: z
    text: 乘去聲○倒懸諭困苦也所施之事
  - page: 92
    col: 3
    role: z
    text: 半於古人而功倍於古人由時勢易
  - page: 92
    col: 4
    role: z
    text: 而德行速也
  - page: 92
    col: 5
    role: j
    text: 公孫丑問曰夫子加齊之卿相得行道
  - page: 92
    col: 6
    role: j
    text: 焉雖由此霸王不異矣如此則動心否
  - page: 92
    col: 7
    role: j
    text: 乎孟子曰否我四十不動心
  - page: 92
    col: 8
    role: z
    text: 相去聲○此承上章又設問孟子若
  - page: 92
    col: 9
    role: z
    text: 得位而行道則雖由此而成霸王之
  - page: 92
    col: 10
    role: z
    text: 業亦不足怪任大責重如此亦有所
  - page: 92
    col: 11
    role: z
    text: 恐懼疑惑而動其心乎四十彊仕君
  - page: 92
    col: 12
    role: z
    text: 子道明德立之時孔子四十而不惑
  - page: 92
    col: 13
    role: z
    text: 亦不動心之謂
  - page: 92
    col: 14
    role: j
    text: 曰若是則夫子過孟賁遠矣曰是不難
  - page: 92
    col: 15
    role: j
    text: 告子先我不動心
  - page: 92
    col: 16
    role: z
    text: 賁音奔○孟賁勇士告子名不害孟
  - page: 93
    col: 1
    role: z
    text: 賁血氣之勇丑蓋借之以贊孟子不
  - page: 93
    col: 2
    role: z
    text: 動心之難孟子言告子未爲知道乃
  - page: 93
    col: 3
    role: z
    text: 能先我不動心則此亦未足爲難也
  - page: 93
    col: 4
    role: j
    text: 曰不動心有道乎曰有
  - page: 93
    col: 5
    role: z
    text: 程子曰心有主則能不動矣
  - page: 93
    col: 6
    role: j
    text: 北宫黝之養勇也不膚撓不目逃思以
  - page: 93
    col: 7
    role: j
    text: 一豪挫於人若撻之於市朝不受於褐
  - page: 93
    col: 8
    role: j
    text: 寬博亦不受於萬乘之君視刺萬乘之
  - page: 93
    col: 9
    role: j
    text: 君若刺褐夫無嚴諸侯惡聲至必反之
  - page: 93
    col: 10
    role: z
    text: 黝伊糾反撓奴效反朝音潮乘去聲
  - page: 93
    col: 11
    role: z
    text: ○北宫姓黝名膚撓肌膚被刺而撓
  - page: 93
    col: 12
    role: z
    text: 屈也目逃目被刺而轉睛逃避也挫
  - page: 93
    col: 13
    role: z
    text: 猶辱也褐毛布寬愽寬大之衣賤者
  - page: 93
    col: 14
    role: z
    text: 之服也不受者不受其挫也刺殺也
  - page: 93
    col: 15
    role: z
    text: 嚴畏憚也言無可畏憚之諸侯也黝
  - page: 93
    col: 16
    role: z
    text: 蓋刺客之流以必勝爲主而不動心
  - page: 94
    col: 1
    role: j
    text: 者也
  - page: 94
    col: 2
    role: j
    text: 孟施舍之所養勇也曰視不勝猶勝也
  - page: 94
    col: 3
    role: j
    text: 量敵而後進慮勝而後會是畏三軍者
  - page: 94
    col: 4
    role: j
    text: 也舍豈能爲必勝哉能無懼而已矣
  - page: 94
    col: 5
    role: z
    text: 舍去聲下同○孟姓施發語聲舍名
  - page: 94
    col: 6
    role: z
    text: 也會合戰也舍自言其戰雖不勝亦
  - page: 94
    col: 7
    role: z
    text: 無所懼若量敵慮勝而後進戰則是
  - page: 94
    col: 8
    role: z
    text: 無勇而畏三軍矣舍蓋力戰之士以
  - page: 94
    col: 9
    role: z
    text: 無懼爲主而不動心者也
  - page: 94
    col: 10
    role: j
    text: 孟施舍似曾子北宫黝似子夏夫二子
  - page: 94
    col: 11
    role: j
    text: 之勇未知其孰賢然而孟施舍守約也
  - page: 94
    col: 12
    role: z
    text: 夫音扶○黝務敵人舍專守己子夏
  - page: 94
    col: 13
    role: z
    text: 篤信聖人曾子反求諸己故二子之
  - page: 94
    col: 14
    role: z
    text: 與曾子子夏雖非等倫然論其氣象
  - page: 94
    col: 15
    role: z
    text: 則各有所似賢猶勝也約要也言論
  - page: 94
    col: 16
    role: z
    text: 二子之勇則未知誰勝論其所守則
  - page: 95
    col: 1
    role: j
    text: 舍比於黝爲得其要也
  - page: 95
    col: 2
    role: j
    text: 昔者曾子謂子襄曰子好勇乎吾嘗聞
  - page: 95
    col: 3
    role: j
    text: 大勇於夫子矣自反而不縮雖褐寬博
  - page: 95
    col: 4
    role: j
    text: 吾不惴焉自反而縮雖千萬人吾往矣
  - page: 95
    col: 5
    role: z
    text: 好去聲惴之瑞反○此言曾子之勇
  - page: 95
    col: 6
    role: z
    text: 也子襄曾子弟子也夫子孔子也縮
  - page: 95
    col: 7
    role: z
    text: 直也檀弓曰古者冠縮縫今也衡縫
  - page: 95
    col: 8
    role: z
    text: 又曰棺束縮二衡三惴恐懼之也往
  - page: 95
    col: 9
    role: z
    text: 往而敵之也
  - page: 95
    col: 10
    role: j
    text: 孟施舍之守氣又不如曾子之守約也
  - page: 95
    col: 11
    role: z
    text: 言孟施舍雖似曾子然其所守乃一
  - page: 95
    col: 12
    role: z
    text: 身之氣又不如曾子之反身循理所
  - page: 95
    col: 13
    role: z
    text: 守尤得其要也孟子之不動心其原
  - page: 95
    col: 14
    role: z
    text: 蓋出於此下文詳之
  - page: 95
    col: 15
    role: j
    text: 曰敢問夫子之不動心與告子之不動
  - page: 95
    col: 16
    role: j
    text: 心可得聞與告子曰不得於言勿求於
  - page: 96
    col: 1
    role: j
    text: 心不得於心勿求於氣不得於心勿求
  - page: 96
    col: 2
    role: j
    text: 於氣可不得於言勿求於心不可夫志
  - page: 96
    col: 3
    role: j
    text: 氣之帥也氣體之充也夫志至焉氣次
  - page: 96
    col: 4
    role: j
    text: 焉故曰持其志無暴其氣
  - page: 96
    col: 5
    role: z
    text: 聞與之與平聲夫志之夫音扶○此
  - page: 96
    col: 6
    role: z
    text: 一節公孫丑之問孟子誦告子之言
  - page: 96
    col: 7
    role: z
    text: 又斷以己意而告之也告子謂於言
  - page: 96
    col: 8
    role: z
    text: 有所不達則當捨置其言而不必反
  - page: 96
    col: 9
    role: z
    text: 求其理於心於心有所不安則當力
  - page: 96
    col: 10
    role: z
    text: 制其心而不必更求其助於氣此所
  - page: 96
    col: 11
    role: z
    text: 以固守其心而不動之速也孟子既
  - page: 96
    col: 12
    role: z
    text: 誦其言而斷之曰彼謂不得於心而
  - page: 96
    col: 13
    role: z
    text: 勿求諸氣者急於本而緩其末猶之
  - page: 96
    col: 14
    role: z
    text: 可也謂不得於言而不求諸心則既
  - page: 96
    col: 15
    role: z
    text: 失於外而遂遺其內其不可也必矣
  - page: 96
    col: 16
    role: z
    text: 然凡曰可者亦僅可而有所未盡之
  - page: 97
    col: 1
    role: z
    text: 詞耳若論其極則志固心之所之而
  - page: 97
    col: 2
    role: z
    text: 爲氣之將帥然氣亦人之所以充滿
  - page: 97
    col: 3
    role: z
    text: 於身而爲志之卒徒者也故志固爲
  - page: 97
    col: 4
    role: z
    text: 至極而氣即次之人固當敬守其志
  - page: 97
    col: 5
    role: z
    text: 然亦不可不致養其氣蓋其內外本
  - page: 97
    col: 6
    role: z
    text: 末交相培養此則孟子之心所以未
  - page: 97
    col: 7
    role: z
    text: 甞必其不動而自然不動之大略也
  - page: 97
    col: 8
    role: j
    text: 旣曰志至焉氣次焉又曰持其志無暴
  - page: 97
    col: 9
    role: j
    text: 其氣者何也曰志壹則動氣氣壹則動
  - page: 97
    col: 10
    role: j
    text: 志也今夫蹶者趨者是氣也而反動其
  - page: 97
    col: 11
    role: j
    text: 心
  - page: 97
    col: 12
    role: z
    text: 夫音扶○公孫丑見孟子言志至而
  - page: 97
    col: 13
    role: z
    text: 氣次故問如此則專持其志可矣又
  - page: 97
    col: 14
    role: z
    text: 言無暴其氣何也壹專一也蹶顚躓
  - page: 97
    col: 15
    role: z
    text: 也趨走也孟子言志之所向專一則
  - page: 97
    col: 16
    role: z
    text: 氣固從之然氣之所在專一則志亦
  - page: 98
    col: 1
    role: z
    text: 反爲之動如人顚躓趨走則氣專在
  - page: 98
    col: 2
    role: z
    text: 是而反動其心焉所以旣持其志而
  - page: 98
    col: 3
    role: z
    text: 又必無暴其氣也○程子曰志動氣
  - page: 98
    col: 4
    role: z
    text: 者什九氣動志者什一
  - page: 98
    col: 5
    role: j
    text: 敢問夫子惡乎長曰我知言我善養吾
  - page: 98
    col: 6
    role: j
    text: 浩然之氣
  - page: 98
    col: 7
    role: z
    text: 惡平聲○公孫丑復問孟子之不動
  - page: 98
    col: 8
    role: z
    text: 心所以異於告子如此者有何所長
  - page: 98
    col: 9
    role: z
    text: 而能然而孟子又詳告之以其故也
  - page: 98
    col: 10
    role: z
    text: 知言者盡心知性於凡天下之言無
  - page: 98
    col: 11
    role: z
    text: 不有以究極其理而識其是非得失
  - page: 98
    col: 12
    role: z
    text: 之所以然也浩然盛大流行之貌氣
  - page: 98
    col: 13
    role: z
    text: 即所謂體之充者本自浩然失養故
  - page: 98
    col: 14
    role: z
    text: 餒惟孟子爲善養之以復其初也蓋
  - page: 98
    col: 15
    role: z
    text: 惟知言則有以明夫道義而於天下
  - page: 98
    col: 16
    role: z
    text: 之事無所疑養氣則有以配夫道義
  - page: 99
    col: 1
    role: z
    text: 而於天下之事無所懼此其所以當
  - page: 99
    col: 2
    role: z
    text: 大任而不動心也告子之學與此正
  - page: 99
    col: 3
    role: z
    text: 相反其不動心殆亦冥然無覺悍然
  - page: 99
    col: 4
    role: z
    text: 不顧而已爾
  - page: 99
    col: 5
    role: j
    text: 敢問何謂浩然之氣曰難言也
  - page: 99
    col: 6
    role: z
    text: 孟子先言知言而丑先問氣者承上
  - page: 99
    col: 7
    role: z
    text: 文方論志氣而言也難言者蓋其心
  - page: 99
    col: 8
    role: z
    text: 所獨得而無形聲之驗有未易以言
  - page: 99
    col: 9
    role: z
    text: 語形容者故○程子曰觀此一言則
  - page: 99
    col: 10
    role: z
    text: 孟子之實有是氣可知矣
  - page: 99
    col: 11
    role: j
    text: 其爲氣也至大至剛以直養而無害則
  - page: 99
    col: 12
    role: j
    text: 塞于天地之閒
  - page: 99
    col: 13
    role: z
    text: 至大初無限量至剛不可屈撓蓋天
  - page: 99
    col: 14
    role: z
    text: 地之正氣而人得以生者其體段本
  - page: 99
    col: 15
    role: z
    text: 如是也惟其自反而縮則得其所養
  - page: 99
    col: 16
    role: z
    text: 而又無所作爲以害之則其本體不
  - page: 100
    col: 1
    role: z
    text: 虧而充塞無間矣○程子曰天人一
  - page: 100
    col: 2
    role: z
    text: 也更不分别浩然之氣乃吾氣也養
  - page: 100
    col: 3
    role: z
    text: 而無害則塞乎天地一爲私意所蔽
  - page: 100
    col: 4
    role: z
    text: 則欿然而餒知其小也○謝氏曰浩
  - page: 100
    col: 5
    role: z
    text: 然之氣湏於心得其正時識取又曰
  - page: 100
    col: 6
    role: z
    text: 浩然是無虧欠時
  - page: 100
    col: 7
    role: j
    text: 其爲氣也配義與道無是餒也
  - page: 100
    col: 8
    role: z
    text: 餒奴罪反○配者合而有助之意義
  - page: 100
    col: 9
    role: z
    text: 者人心之裁制道者天理之自然餒
  - page: 100
    col: 10
    role: z
    text: 飢乏而氣不充體也言人能養成此
  - page: 100
    col: 11
    role: z
    text: 氣則其氣合乎義道而爲之助使其
  - page: 100
    col: 12
    role: z
    text: 行之勇决無所疑憚若無此氣則其
  - page: 100
    col: 13
    role: z
    text: 一時所爲雖未必不出於道義然其
  - page: 100
    col: 14
    role: z
    text: 體有所不充則亦不免於疑懼而不
  - page: 100
    col: 15
    role: z
    text: 足以有爲矣
  - page: 100
    col: 16
    role: j
    text: 是集義所生者非義襲而取之也行有
  - page: 101
    col: 1
    role: j
    text: 不慊於心則餒矣我故曰告子未嘗知
  - page: 101
    col: 2
    role: j
    text: 義以其外之也
  - page: 101
    col: 3
    role: z
    text: 慊口簟反又口劫反○集義猶言積
  - page: 101
    col: 4
    role: z
    text: 善蓋欲事事皆合於義也襲掩取也
  - page: 101
    col: 5
    role: z
    text: 如齊侯襲莒之襲言氣雖可以配乎
  - page: 101
    col: 6
    role: z
    text: 道義而其養之之始乃由事皆合義
  - page: 101
    col: 7
    role: z
    text: 自反常直是以無所愧怍而此氣自
  - page: 101
    col: 8
    role: z
    text: 然發生於中非由只行一事偶合於
  - page: 101
    col: 9
    role: z
    text: 義便可掩襲於外而得之也慊快也
  - page: 101
    col: 10
    role: z
    text: 足也言所行一有不合於義而自反
  - page: 101
    col: 11
    role: z
    text: 不直則不足於心而其體有所不充
  - page: 101
    col: 12
    role: z
    text: 矣然則義豈在外哉告子不知此理
  - page: 101
    col: 13
    role: z
    text: 乃曰仁内義外而不復以義爲事則
  - page: 101
    col: 14
    role: z
    text: 必不能集義以生浩然之氣矣上文
  - page: 101
    col: 15
    role: z
    text: 不得於言勿求於心即外義之意詳
  - page: 101
    col: 16
    role: z
    text: 見告子上篇
  - page: 102
    col: 1
    role: j
    text: 必有事焉而勿正心勿忘勿助長也無
  - page: 102
    col: 2
    role: j
    text: 若宋人然宋人有閔其苗之不長而揠
  - page: 102
    col: 3
    role: j
    text: 之者芒芒然歸謂其人曰今日病矣予
  - page: 102
    col: 4
    role: j
    text: 助苗長矣其子趨而往視之苗則槁矣
  - page: 102
    col: 5
    role: j
    text: 天下之不助苗長者寡矣以爲無益而
  - page: 102
    col: 6
    role: j
    text: 舎之者不耘苗者也助之長者揠苗者
  - page: 102
    col: 7
    role: j
    text: 也非徒無益而又害之
  - page: 102
    col: 8
    role: z
    text: 長上聲揠烏八反舎上聲○必有事
  - page: 102
    col: 9
    role: z
    text: 焉而勿正趙氏程子以七字爲句近
  - page: 102
    col: 10
    role: z
    text: 世或并下文心字讀之者亦通必有
  - page: 102
    col: 11
    role: z
    text: 事焉有所事也如有事於顓臾之有
  - page: 102
    col: 12
    role: z
    text: 事正預期也春秋傳曰戰不正勝是
  - page: 102
    col: 13
    role: z
    text: 也如作正心義亦同此與大學之所
  - page: 102
    col: 14
    role: z
    text: 謂正心者語意自不同也此言養氣
  - page: 102
    col: 15
    role: z
    text: 者必以集義爲事而勿預期其效其
  - page: 102
    col: 16
    role: z
    text: 或未充則但當勿忘其所有事而不
  - page: 103
    col: 1
    role: z
    text: 可作爲以助其長乃集義養氣之節
  - page: 103
    col: 2
    role: z
    text: 度也閔憂也揠拔也芒芒無知之貌
  - page: 103
    col: 3
    role: z
    text: 其人家人也病疲倦也舍之不耘者
  - page: 103
    col: 4
    role: z
    text: 忘其所有事揠而助之長者正之不
  - page: 103
    col: 5
    role: z
    text: 得而妄有作爲者也然不耘則失養
  - page: 103
    col: 6
    role: z
    text: 而已揠則反以害之無是二者則氣
  - page: 103
    col: 7
    role: z
    text: 得其養而無所害矣如告子不能集
  - page: 103
    col: 8
    role: z
    text: 義而欲彊制其心則必不能免於正
  - page: 103
    col: 9
    role: z
    text: 助之病其於所謂浩然者蓋不惟不
  - page: 103
    col: 10
    role: z
    text: 善養而又反害之矣
  - page: 103
    col: 11
    role: j
    text: 何謂知言曰詖辭知其所蔽淫辭知其
  - page: 103
    col: 12
    role: j
    text: 所陷邪辭知其所離遁辭知其所窮生
  - page: 103
    col: 13
    role: j
    text: 於其心害於其政發於其政害於其事
  - page: 103
    col: 14
    role: j
    text: 聖人復起必從吾言矣
  - page: 103
    col: 15
    role: z
    text: 詖彼寄反復扶又反○此公孫丑復
  - page: 103
    col: 16
    role: z
    text: 問而孟子答之也詖偏陂也淫放蕩
  - page: 104
    col: 1
    role: j
    text: 也邪邪僻也遁逃避也四者相因言
  - page: 104
    col: 2
    role: j
    text: 之病也蔽遮隔也陷沉溺也離叛去
  - page: 104
    col: 3
    role: j
    text: 也窮困屈也四者亦相因則心之失
  - page: 104
    col: 4
    role: j
    text: 也人之有言皆本於心其心明乎正
  - page: 104
    col: 5
    role: j
    text: 理而無蔽然後其言平正通達而無
  - page: 104
    col: 6
    role: j
    text: 病苟為不然則必有是四者之病矣
  - page: 104
    col: 7
    role: j
    text: 即其言之病而知其心之失又知其
  - page: 104
    col: 8
    role: j
    text: 害於政事之決然而不可易者如此
  - page: 104
    col: 9
    role: j
    text: 非心通於道而無疑於天下之理其
  - page: 104
    col: 10
    role: j
    text: 孰能之彼告子者不得於言而不肯
  - page: 104
    col: 11
    role: j
    text: 求之於心至為義外之說則自不免
  - page: 104
    col: 12
    role: j
    text: 於四者之病其何以知天下之言而
  - page: 104
    col: 13
    role: j
    text: 無所疑哉○程子曰心通乎道然後
  - page: 104
    col: 14
    role: j
    text: 能辨是非如持權衡以較輕重孟子
  - page: 104
    col: 15
    role: j
    text: 所謂知言是也又曰孟子知言正如
  - page: 104
    col: 16
    role: j
    text: 人在堂上方能辨堂下人曲直若猶
  - page: 105
    col: 1
    role: z
    text: 未免雜於堂下衆人之中則不能辨
  - page: 105
    col: 2
    role: z
    text: 決矣
  - page: 105
    col: 3
    role: j
    text: 宰我子貢善爲說辭冉牛閔子顏淵善
  - page: 105
    col: 4
    role: j
    text: 言德行孔子兼之曰我於辭命則不能
  - page: 105
    col: 5
    role: j
    text: 也然則夫子旣聖矣乎
  - page: 105
    col: 6
    role: z
    text: 行去聲○此一節林氏以爲皆公孫
  - page: 105
    col: 7
    role: z
    text: 丑之問是也說辭言語也德行得於
  - page: 105
    col: 8
    role: z
    text: 心而見於行事者也三子善言德行
  - page: 105
    col: 9
    role: z
    text: 者身有之故言之親切而有味也公
  - page: 105
    col: 10
    role: z
    text: 孫丑言數子各有所長而孔子兼之
  - page: 105
    col: 11
    role: z
    text: 然猶自謂不能於辭命今孟子乃自
  - page: 105
    col: 12
    role: z
    text: 謂我能知言又善養氣則是兼言語
  - page: 105
    col: 13
    role: z
    text: 德行而有之然則豈不旣聖矣乎此
  - page: 105
    col: 14
    role: z
    text: 夫子指孟子也○程子曰孔子自謂
  - page: 105
    col: 15
    role: z
    text: 不能於辭命者欲使學者務本而已
  - page: 105
    col: 16
    role: j
    text: 曰惡是何言也昔者子貢問於孔子曰
  - page: 106
    col: 1
    role: j
    text: 夫子聖矣乎孔子曰聖則吾不能我學
  - page: 106
    col: 2
    role: j
    text: 不厭而教不倦也子貢曰學不厭智也
  - page: 106
    col: 3
    role: j
    text: 教不倦仁也仁且智夫子既聖矣夫聖
  - page: 106
    col: 4
    role: j
    text: 孔子不居是何言也
  - page: 106
    col: 5
    role: z
    text: 惡平聲夫聖之夫音扶○惡驚歎辭
  - page: 106
    col: 6
    role: z
    text: 也昔者以下孟子不敢當丑之言而
  - page: 106
    col: 7
    role: z
    text: 引孔子子貢問答之辭以告之也此
  - page: 106
    col: 8
    role: z
    text: 夫子指孔子也學不厭者智之所以
  - page: 106
    col: 9
    role: z
    text: 自明教不倦者仁之所以及物再言
  - page: 106
    col: 10
    role: z
    text: 是何言也以深拒之
  - page: 106
    col: 11
    role: j
    text: 昔者竊聞之子夏子游子張皆有聖人
  - page: 106
    col: 12
    role: j
    text: 之一體冉牛閔子顏淵則具體而微敢
  - page: 106
    col: 13
    role: j
    text: 問所安
  - page: 106
    col: 14
    role: z
    text: 此一節林氏亦以爲皆公孫丑之問
  - page: 106
    col: 15
    role: z
    text: 是也一體猶一肢也具體而微謂有
  - page: 106
    col: 16
    role: z
    text: 其全體但未廣大耳安處也公孫丑
  - page: 107
    col: 1
    role: z
    text: 復問孟子旣不敢比子則於此數
  - page: 107
    col: 2
    role: z
    text: 子欲何所處也
  - page: 107
    col: 3
    role: j
    text: 曰姑舎是
  - page: 107
    col: 4
    role: z
    text: 舎上聲○孟子言且置是者不欲以
  - page: 107
    col: 5
    role: z
    text: 數子所至者自處也
  - page: 107
    col: 6
    role: j
    text: 曰伯夷伊尹何如曰不同道非其君不
  - page: 107
    col: 7
    role: j
    text: 事非其民不使治則進亂則退伯夷也
  - page: 107
    col: 8
    role: j
    text: 何事非君何使非民治亦進亂亦進伊
  - page: 107
    col: 9
    role: j
    text: 尹也可以仕則仕可以止則止可以乆
  - page: 107
    col: 10
    role: j
    text: 則乆可以速則速孔子也皆古聖人也
  - page: 107
    col: 11
    role: j
    text: 吾未能有行焉乃所願則學孔子也
  - page: 107
    col: 12
    role: j
    text: 治去聲○伯夷孤竹君之長子兄弟
  - page: 107
    col: 13
    role: z
    text: 遜國避紂隱居聞文王之德而歸之
  - page: 107
    col: 14
    role: z
    text: 及武王伐紂去而餓死伊尹有莘之
  - page: 107
    col: 15
    role: z
    text: 處士湯聘而用之使之就桀桀不能
  - page: 107
    col: 16
    role: z
    text: 用復歸於湯如是者五乃相湯而伐
  - page: 108
    col: 1
    role: z
    text: 桀也三聖人事詳見此篇之末及萬
  - page: 108
    col: 2
    role: z
    text: 章下篇
  - page: 108
    col: 3
    role: j
    text: 伯夷伊尹於孔子若是班乎曰否自有
  - page: 108
    col: 4
    role: j
    text: 生民以來未有孔子也
  - page: 108
    col: 5
    role: z
    text: 班齊等之貌公孫丑問而孟子答之
  - page: 108
    col: 6
    role: z
    text: 以不同也
  - page: 108
    col: 7
    role: j
    text: 曰然則有同與曰有得百里之地而君
  - page: 108
    col: 8
    role: j
    text: 之皆能以朝諸侯有天下行一不義殺
  - page: 108
    col: 9
    role: z
    text: 一不辜而得天下皆不爲也是則同
  - page: 108
    col: 10
    role: z
    text: 與平聲朝音潮○有言有同也以百
  - page: 108
    col: 11
    role: z
    text: 里而王天下德之盛也行一不義殺
  - page: 108
    col: 12
    role: z
    text: 一不辜而得天下有所不爲心之正
  - page: 108
    col: 13
    role: z
    text: 也聖人之所以爲聖人其本根節目
  - page: 108
    col: 14
    role: z
    text: 之大者惟在於此於此不同則亦不
  - page: 108
    col: 15
    role: z
    text: 足以爲聖人矣
  - page: 108
    col: 16
    role: j
    text: 曰敢問其所以異曰宰我子貢有若智
  - page: 109
    col: 1
    role: j
    text: 足以知聖人汗不至阿其所好
  - page: 109
    col: 2
    role: z
    text: 汗音蛙好去聲○汗下也三子智足
  - page: 109
    col: 3
    role: z
    text: 以知夫子之道假使汗下必不阿私
  - page: 109
    col: 4
    role: z
    text: 所好而空譽之明其言之可信也
  - page: 109
    col: 5
    role: j
    text: 宰我曰以予觀於夫子賢於堯舜遠矣
  - page: 109
    col: 6
    role: z
    text: 程子曰語聖則不異事功則有異夫
  - page: 109
    col: 7
    role: z
    text: 子賢於堯舜語事功也蓋堯舜治天
  - page: 109
    col: 8
    role: z
    text: 下夫子又推其道以垂教萬世堯舜
  - page: 109
    col: 9
    role: z
    text: 之道非得孔子則後世亦何所據哉
  - page: 109
    col: 10
    role: j
    text: 子貢曰見其禮而知其政聞其樂而知
  - page: 109
    col: 11
    role: j
    text: 其德由百世之後等百世之王莫之能
  - page: 109
    col: 12
    role: j
    text: 違也自生民以來未有夫子也
  - page: 109
    col: 13
    role: z
    text: 言大凡見人之禮則可以知其政聞
  - page: 109
    col: 14
    role: z
    text: 人之樂則可以知其德是以我從百
  - page: 109
    col: 15
    role: z
    text: 世之後差等百世之王無有能遁其
  - page: 109
    col: 16
    role: z
    text: 情者而見其皆莫若夫子之盛也
  - page: 110
    col: 1
    role: j
    text: 有若曰豈惟民哉麒麟之於走獸鳳凰
  - page: 110
    col: 2
    role: j
    text: 之飛鳥太山之於丘垤河海之於行
  - page: 110
    col: 3
    role: j
    text: 潦類也聖人之於民亦類也出於其類
  - page: 110
    col: 4
    role: j
    text: 拔乎其萃自生民以來未有盛於孔子
  - page: 110
    col: 5
    role: j
    text: 也
  - page: 110
    col: 6
    role: z
    text: 垤大結反潦音老○麒麟毛蟲之長
  - page: 110
    col: 7
    role: z
    text: 鳳凰羽蟲之長垤蟻封也行潦道上
  - page: 110
    col: 8
    role: z
    text: 無源之水也出高出也拔特起也萃
  - page: 110
    col: 9
    role: z
    text: 聚也言自古聖人固皆異於衆人然
  - page: 110
    col: 10
    role: z
    text: 未有如孔子之尤盛者也○程子曰
  - page: 110
    col: 11
    role: z
    text: 孟子此章擴前聖所未發學者所宜
  - page: 110
    col: 12
    role: z
    text: 潛心而玩索也
  - page: 110
    col: 13
    role: j
    text: 孟子曰以力假仁者霸霸必有大國以
  - page: 110
    col: 14
    role: j
    text: 德行仁者王王不待大湯以七十里文
  - page: 110
    col: 15
    role: j
    text: 王以百里
  - page: 110
    col: 16
    role: z
    text: 力謂土地甲兵之力假仁者本無是
  - page: 111
    col: 1
    role: z
    text: 心而借其事以為功者也霸若齊威
  - page: 111
    col: 2
    role: z
    text: 晉文是也以德行仁則自吾之得於
  - page: 111
    col: 3
    role: z
    text: 心者推之無適而非仁也
  - page: 111
    col: 4
    role: j
    text: 以力服人者非心服也力不贍也以德
  - page: 111
    col: 5
    role: j
    text: 服人者中心悅而誠服也如七十子之
  - page: 111
    col: 6
    role: j
    text: 服孔子也詩云自西自東自南自北無
  - page: 111
    col: 7
    role: j
    text: 思不服此之謂也
  - page: 111
    col: 8
    role: z
    text: 贍足也詩大雅文王有聲之篇王霸
  - page: 111
    col: 9
    role: z
    text: 之心誠偽不同故人所以應之者其
  - page: 111
    col: 10
    role: z
    text: 不同亦如此○鄒氏曰以力服人者
  - page: 111
    col: 11
    role: z
    text: 有意於服人而人不敢不服以德服
  - page: 111
    col: 12
    role: z
    text: 人者無意於服人而人不能不服從
  - page: 111
    col: 13
    role: z
    text: 古以來論王霸者多矣未有若此章
  - page: 111
    col: 14
    role: z
    text: 之深切而著明也
  - page: 111
    col: 15
    role: j
    text: 孟子曰仁則榮不仁則辱今惡辱而居
  - page: 111
    col: 16
    role: j
    text: 不仁是猶惡濕而居下也
  - page: 112
    col: 1
    role: z
    text: 惡去聲下同○好榮惡辱人之常情
  - page: 112
    col: 2
    role: z
    text: 然徒惡之而不去其得之之道不能
  - page: 112
    col: 3
    role: z
    text: 免也
  - page: 112
    col: 4
    role: j
    text: 如惡之莫如貴德而尊士賢者在位能
  - page: 112
    col: 5
    role: j
    text: 者在職國家間暇及是時明其政刑雖
  - page: 112
    col: 6
    role: j
    text: 大國必畏之矣
  - page: 112
    col: 7
    role: z
    text: 間音閑○此因其惡辱之情而進之
  - page: 112
    col: 8
    role: z
    text: 以彊仁之事也貴德猶尚德也士則
  - page: 112
    col: 9
    role: z
    text: 指其人而言之賢有德者使之在位
  - page: 112
    col: 10
    role: z
    text: 則足以正君而善俗能有才者使之
  - page: 112
    col: 11
    role: z
    text: 在職則足以修政而立事國家間暇
  - page: 112
    col: 12
    role: z
    text: 可以有爲之時也詳味及字則惟日
  - page: 112
    col: 13
    role: z
    text: 不足之意可見矣
  - page: 112
    col: 14
    role: j
    text: 詩云迨天之未隂雨徹彼桑土綢繆牖
  - page: 112
    col: 15
    role: j
    text: 户今此下民或敢侮予孔子曰爲此詩
  - page: 112
    col: 16
    role: j
    text: 者其知道乎能治其國家誰敢侮之
  - page: 113
    col: 1
    role: j
    text: 徹直列反土音杜綢音稠繆武彪反
  - page: 113
    col: 2
    role: z
    text: ○詩豳風鴟鴞之篇周公之所作也
  - page: 113
    col: 3
    role: z
    text: 迨及也徹取也桑土桑根之皮也綢
  - page: 113
    col: 4
    role: z
    text: 繆纏綿補葺也牖户巢之通氣出入
  - page: 113
    col: 5
    role: z
    text: 處也予鳥自謂也言我之備患詳密
  - page: 113
    col: 6
    role: z
    text: 如此今此在下之人或敢有侮予者
  - page: 113
    col: 7
    role: z
    text: 乎周公以鳥之爲巢如此比君之爲
  - page: 113
    col: 8
    role: z
    text: 國亦當思患而預防之孔子讀而贊
  - page: 113
    col: 9
    role: z
    text: 之以爲知道也
  - page: 113
    col: 10
    role: j
    text: 今國家閒暇及是時般樂怠敖是自求
  - page: 113
    col: 11
    role: j
    text: 禍也
  - page: 113
    col: 12
    role: z
    text: 般音盤樂音洛敖音傲○言其縱欲
  - page: 113
    col: 13
    role: z
    text: 偷安亦惟日不足也
  - page: 113
    col: 14
    role: j
    text: 禍福無不自己求之者
  - page: 113
    col: 15
    role: z
    text: 結上文之意
  - page: 113
    col: 16
    role: j
    text: 詩云永言配命自求多福太甲曰天作
  - page: 114
    col: 1
    role: j
    text: 孽猶可違自作孽不可活此之謂也
  - page: 114
    col: 2
    role: z
    text: 孽魚列反○詩大雅文王之篇永長
  - page: 114
    col: 3
    role: z
    text: 也言猶念也配合也命天命也此言
  - page: 114
    col: 4
    role: z
    text: 福之自己求者太甲商書篇名孽禍
  - page: 114
    col: 5
    role: z
    text: 也違避也活生也書作逭逭猶緩也
  - page: 114
    col: 6
    role: z
    text: 此言禍之自己求者
  - page: 114
    col: 7
    role: j
    text: 孟子曰尊賢使能俊傑在位則天下之
  - page: 114
    col: 8
    role: j
    text: 士皆悅而願立於其朝矣
  - page: 114
    col: 9
    role: z
    text: 朝音潮○俊傑才德之異於衆者
  - page: 114
    col: 10
    role: j
    text: 市廛而不征法而不廛則天下之商皆
  - page: 114
    col: 11
    role: j
    text: 悅而願藏於其市矣
  - page: 114
    col: 12
    role: z
    text: 廛市宅也張子曰或賦其市地之廛
  - page: 114
    col: 13
    role: z
    text: 而不征其貨或治之以市官之法而
  - page: 114
    col: 14
    role: z
    text: 不賦其廛蓋逐末者多則廛以抑之
  - page: 114
    col: 15
    role: z
    text: 少則不必廛也
  - page: 114
    col: 16
    role: j
    text: 關譏而不征則天下之旅皆悅而願出
  - page: 115
    col: 1
    role: j
    text: 於其路矣
  - page: 115
    col: 2
    role: z
    text: 解見前篇
  - page: 115
    col: 3
    role: j
    text: 耕者助而不稅則天下之農皆悅而願
  - page: 115
    col: 4
    role: j
    text: 耕於其野矣
  - page: 115
    col: 5
    role: z
    text: 但使出力以助耕公田而不稅其私
  - page: 115
    col: 6
    role: z
    text: 田也
  - page: 115
    col: 7
    role: j
    text: 廛無夫里之布則天下之民皆悅而願
  - page: 115
    col: 8
    role: j
    text: 為之氓矣
  - page: 115
    col: 9
    role: z
    text: 氓音盲○周禮宅不毛者有里布民
  - page: 115
    col: 10
    role: z
    text: 無職事者出夫家之征鄭氏謂宅不
  - page: 115
    col: 11
    role: z
    text: 種桑麻者罰之使出一里二十五家
  - page: 115
    col: 12
    role: z
    text: 之布民無常業者罰之使出一夫百
  - page: 115
    col: 13
    role: z
    text: 畝之稅一家力役之征也今戰國時
  - page: 115
    col: 14
    role: z
    text: 一切取之市宅之民已賦其廛又令
  - page: 115
    col: 15
    role: z
    text: 出此夫里之布非先王之法也氓民
  - page: 115
    col: 16
    role: z
    text: 也
  - page: 116
    col: 1
    role: j
    text: 信能行此五者則鄰國之民仰之若父
  - page: 116
    col: 2
    role: j
    text: 母矣率其子弟攻其父母自生民以來
  - page: 116
    col: 3
    role: j
    text: 未有能濟者也如此則無敵於天下無
  - page: 116
    col: 4
    role: j
    text: 敵於天下者天吏也然而不王者未之
  - page: 116
    col: 5
    role: j
    text: 有也
  - page: 116
    col: 6
    role: z
    text: 吕氏曰奉行天命謂之天吏廢興存
  - page: 116
    col: 7
    role: z
    text: 亡惟天所命不敢不從若湯武是也
  - page: 116
    col: 8
    role: z
    text: ○此章言能行王政則冦戎爲父子
  - page: 116
    col: 9
    role: z
    text: 不行王政則赤子爲仇讎
  - page: 116
    col: 10
    role: j
    text: 孟子曰人皆有不忍人之心
  - page: 116
    col: 11
    role: z
    text: 天地以生物爲心而所生之物因各
  - page: 116
    col: 12
    role: z
    text: 得夫天地生物之心以爲心所以人
  - page: 116
    col: 13
    role: z
    text: 皆有不忍人之心也
  - page: 116
    col: 14
    role: j
    text: 先王有不忍人之心斯有不忍人之政
  - page: 116
    col: 15
    role: j
    text: 矣以不忍人之心行不忍人之政治天
  - page: 116
    col: 16
    role: j
    text: 下可運之掌上
  - page: 117
    col: 1
    role: z
    text: 言衆人雖有不忍人之心然物欲害
  - page: 117
    col: 2
    role: z
    text: 之存焉者寡故不能察識而推之政
  - page: 117
    col: 3
    role: z
    text: 事之間惟聖人全體此心隨感而應
  - page: 117
    col: 4
    role: z
    text: 故其所行無非不忍人之政也
  - page: 117
    col: 5
    role: j
    text: 所以謂人皆有不忍人之心者今人乍
  - page: 117
    col: 6
    role: j
    text: 見孺子將入於井皆有怵惕惻隱之心
  - page: 117
    col: 7
    role: j
    text: 非所以內交於孺子之父母也非所以
  - page: 117
    col: 8
    role: j
    text: 要譽於鄉黨朋友也非惡其聲而然也
  - page: 117
    col: 9
    role: z
    text: 怵音黜內讀爲納要平聲惡去聲下
  - page: 117
    col: 10
    role: z
    text: 同○乍猶忽也怵惕驚動貌惻傷之
  - page: 117
    col: 11
    role: z
    text: 切也隱痛之深也此即所謂不忍人
  - page: 117
    col: 12
    role: z
    text: 之心也內結要求聲名也言乍見之
  - page: 117
    col: 13
    role: z
    text: 時便有此心隨見而發非由此三者
  - page: 117
    col: 14
    role: z
    text: 而然也○程子曰滿腔子是惻隱之
  - page: 117
    col: 15
    role: j
    text: 心○謝氏曰反須是識其眞心方乍見
  - page: 117
    col: 16
    role: z
    text: 孺子入井之時其心怵惕乃眞心也
  - page: 118
    col: 1
    role: z
    text: 非思而得非勉而中天理之自然也
  - page: 118
    col: 2
    role: z
    text: 内交要譽惡其聲而然即人欲之私
  - page: 118
    col: 3
    role: z
    text: 矣
  - page: 118
    col: 4
    role: j
    text: 由是觀之無惻隱之心非人也無羞惡
  - page: 118
    col: 5
    role: j
    text: 之心非人也無辭讓之心非人也無是
  - page: 118
    col: 6
    role: j
    text: 非之心非人也
  - page: 118
    col: 7
    role: z
    text: 惡去聲下同○羞恥己之不善也惡
  - page: 118
    col: 8
    role: z
    text: 憎人之不善也辭解使去己也讓推
  - page: 118
    col: 9
    role: z
    text: 以與人也是知其善而以爲是也非
  - page: 118
    col: 10
    role: z
    text: 知其惡而以爲非也人之所以爲心
  - page: 118
    col: 11
    role: z
    text: 不外乎是四者故因論惻隱而悉數
  - page: 118
    col: 12
    role: z
    text: 之言人若無此則不得謂之人所以
  - page: 118
    col: 13
    role: z
    text: 明其必有也
  - page: 118
    col: 14
    role: j
    text: 惻隱之心仁之端也羞惡之心義之端
  - page: 118
    col: 15
    role: j
    text: 也辭讓之心禮之端也是非之心智之
  - page: 118
    col: 16
    role: j
    text: 端也
  - page: 119
    col: 1
    role: z
    text: 惻隱羞惡辭讓是非情也仁義禮智
  - page: 119
    col: 2
    role: z
    text: 性也心統性情者也端緒也因其情
  - page: 119
    col: 3
    role: z
    text: 之發而性之本然可得而見猶有物
  - page: 119
    col: 4
    role: z
    text: 在中而緒見於外也
  - page: 119
    col: 5
    role: j
    text: 人之有是四端也猶其有四體也有是
  - page: 119
    col: 6
    role: j
    text: 四端而自謂不能者自賊者也謂其君
  - page: 119
    col: 7
    role: j
    text: 不能者賊其君者也
  - page: 119
    col: 8
    role: z
    text: 四體四支人之所必有者也自謂不
  - page: 119
    col: 9
    role: z
    text: 能者物欲蔽之耳
  - page: 119
    col: 10
    role: j
    text: 凡有四端於我者知皆擴而充之矣若
  - page: 119
    col: 11
    role: j
    text: 火之始然泉之始達苟能充之足以保
  - page: 119
    col: 12
    role: j
    text: 四海苟不充之不足以事父母
  - page: 119
    col: 13
    role: z
    text: 擴音廓○擴推廣之意充滿也四端
  - page: 119
    col: 14
    role: z
    text: 在我隨處發見知皆即此推廣而充
  - page: 119
    col: 15
    role: z
    text: 滿其本然之量則其日新又新將有
  - page: 119
    col: 16
    role: z
    text: 不能自已者矣能由此而遂充之則
  - page: 120
    col: 1
    role: z
    text: 四海雖遠亦吾度内無難保者不能
  - page: 120
    col: 2
    role: z
    text: 充之則雖事之至近而不能矣丶此
  - page: 120
    col: 3
    role: z
    text: 章所論人之性情心之體用本然全
  - page: 120
    col: 4
    role: z
    text: 具而各有條理如此學者於此反求
  - page: 120
    col: 5
    role: z
    text: 默識而擴充之則天之所以與我者
  - page: 120
    col: 6
    role: z
    text: 可以無不盡矣○程子曰人皆有是
  - page: 120
    col: 7
    role: z
    text: 心惟君子爲能擴而充之不能然者
  - page: 120
    col: 8
    role: z
    text: 皆自棄也然其充與不充亦在我而
  - page: 120
    col: 9
    role: z
    text: 已矣又曰四端不言信者旣有誠心
  - page: 120
    col: 10
    role: z
    text: 爲四端則信在其中矣愚按四端之
  - page: 120
    col: 11
    role: z
    text: 信猶五行之土無定位無成名無專
  - page: 120
    col: 12
    role: z
    text: 氣而水火金木無不待是以生者故
  - page: 120
    col: 13
    role: z
    text: 土於四行無不在於四時則寄王焉
  - page: 120
    col: 14
    role: z
    text: 其理亦猶是也
  - page: 120
    col: 15
    role: j
    text: 孟子曰矢人豈不仁於函人哉矢人唯
  - page: 120
    col: 16
    role: j
    text: 恐不傷人函人唯恐傷人巫匠亦然故
  - page: 121
    col: 1
    role: j
    text: 術不可不愼也
  - page: 121
    col: 2
    role: z
    text: 函音含○函甲也惻隱之心人皆有
  - page: 121
    col: 3
    role: z
    text: 之是矢人之心本非不如函人之仁
  - page: 121
    col: 4
    role: z
    text: 也巫者為人祈祝利人之生匠者作
  - page: 121
    col: 5
    role: z
    text: 為棺槨利人之死
  - page: 121
    col: 6
    role: j
    text: 孔子曰里仁為美擇不處仁焉得智夫
  - page: 121
    col: 7
    role: j
    text: 仁天之尊爵也人之安宅也莫之禦而
  - page: 121
    col: 8
    role: j
    text: 不仁是不智也
  - page: 121
    col: 9
    role: z
    text: 焉於虔反夫音扶○里有仁厚之俗
  - page: 121
    col: 10
    role: z
    text: 者猶以為美人擇所以自處而不於
  - page: 121
    col: 11
    role: z
    text: 仁安得為智乎此孔子之言也仁義
  - page: 121
    col: 12
    role: z
    text: 禮智皆天所與之良貴而仁者天地
  - page: 121
    col: 13
    role: z
    text: 生物之心得之最先而兼統四者所
  - page: 121
    col: 14
    role: z
    text: 謂元者善之長也故曰尊爵在人則
  - page: 121
    col: 15
    role: z
    text: 為本心全體之德有天理自然之安
  - page: 121
    col: 16
    role: z
    text: 無人欲陷溺之危人當常在其中而
  - page: 122
    col: 1
    role: z
    text: 不可須臾離者也故曰安宅此又孟
  - page: 122
    col: 2
    role: z
    text: 子釋孔子之意以為仁道之大如此
  - page: 122
    col: 3
    role: z
    text: 而自不為之豈非不智之甚乎
  - page: 122
    col: 4
    role: j
    text: 不仁不智無禮無義人役也人役而恥
  - page: 122
    col: 5
    role: j
    text: 為役由弓人而恥為弓矢人而恥為矢
  - page: 122
    col: 6
    role: j
    text: 也
  - page: 122
    col: 7
    role: z
    text: 由與猶通○以不仁故不智不智故
  - page: 122
    col: 8
    role: z
    text: 不知禮義之所在
  - page: 122
    col: 9
    role: j
    text: 如恥之莫如為仁
  - page: 122
    col: 10
    role: z
    text: 此亦因人愧恥之心而引之使志於
  - page: 122
    col: 11
    role: z
    text: 仁也不言智禮義者仁該全體能為
  - page: 122
    col: 12
    role: z
    text: 仁則三者在其中矣
  - page: 122
    col: 13
    role: j
    text: 仁者如射射者正己而後發發而不中
  - page: 122
    col: 14
    role: j
    text: 不怨勝己者反求諸己而已矣
  - page: 122
    col: 15
    role: z
    text: 中去聲○為仁由己而由人乎哉
  - page: 122
    col: 16
    role: j
    text: 孟子曰子路人告之以有過則喜
  - page: 123
    col: 1
    role: z
    text: 喜其得聞而改之其勇於自修如此
  - page: 123
    col: 2
    role: z
    text: 周子曰仲由喜聞過令名無窮焉今
  - page: 123
    col: 3
    role: z
    text: 人有過不喜人規如諱疾而忌醫寧
  - page: 123
    col: 4
    role: z
    text: 滅其身而無悟也噫○程子曰子路
  - page: 123
    col: 5
    role: z
    text: 人告之以有過則喜亦可謂百世之
  - page: 123
    col: 6
    role: z
    text: 師矣
  - page: 123
    col: 7
    role: z
    text: 禹聞善言則拜
  - page: 123
    col: 8
    role: z
    text: 書曰禹拜昌言蓋不待有過而能屈
  - page: 123
    col: 9
    role: z
    text: 己以受天下之善也
  - page: 123
    col: 10
    role: j
    text: 大舜有大焉善與人同舍己從人樂取
  - page: 123
    col: 11
    role: z
    text: 於人以爲善
  - page: 123
    col: 12
    role: j
    text: 舍上聲樂音洛○言舜之所爲又有
  - page: 123
    col: 13
    role: j
    text: 大於禹與子路者善與人同公天下
  - page: 123
    col: 14
    role: j
    text: 之善而不爲私也己未善則無所係
  - page: 123
    col: 15
    role: j
    text: 吝而舍以從人人有善則不待勉彊
  - page: 123
    col: 16
    role: z
    text: 而取之於己此善與人同之目也
  - page: 124
    col: 1
    role: j
    text: 自耕稼陶漁以至爲帝無非取於人者
  - page: 124
    col: 2
    role: j
    text: 舜之側微耕于歷山陶于河濱漁于
  - page: 124
    col: 3
    role: j
    text: 雷澤
  - page: 124
    col: 4
    role: j
    text: 取諸人以爲善是與人爲善者也故君
  - page: 124
    col: 5
    role: j
    text: 子莫大乎與人爲善
  - page: 124
    col: 6
    role: z
    text: 與猶許也助也取彼之善而爲之於
  - page: 124
    col: 7
    role: z
    text: 我則彼益勸於爲善矣是我助其爲
  - page: 124
    col: 8
    role: z
    text: 善也能使天下之人皆勸於爲善君
  - page: 124
    col: 9
    role: z
    text: 子之善孰大於此○此章言聖賢樂
  - page: 124
    col: 10
    role: z
    text: 善之誠初無彼此之間故其在人者
  - page: 124
    col: 11
    role: z
    text: 有以裕於己在己者有以及於人
  - page: 124
    col: 12
    role: j
    text: 孟子曰伯夷非其君不事非其友不友
  - page: 124
    col: 13
    role: j
    text: 不立於惡人之朝不與惡人言立於惡
  - page: 124
    col: 14
    role: j
    text: 人之朝與惡人言如以朝衣朝冠坐於
  - page: 124
    col: 15
    role: j
    text: 塗炭推惡惡之心思與鄉人立其冠不
  - page: 124
    col: 16
    role: j
    text: 正望望然去之若將浼焉是故諸侯雖
  - page: 125
    col: 1
    role: j
    text: 有善其辭命而至者不受也不受也者
  - page: 125
    col: 2
    role: j
    text: 是亦不屑就巳
  - page: 125
    col: 3
    role: j
    text: 朝音潮惡惡上去聲下如字浼莫罪
  - page: 125
    col: 4
    role: j
    text: 反○塗泥也鄉人鄉里之常人也望
  - page: 125
    col: 5
    role: j
    text: 望去而不顧之貌浼汙也○屑趙氏曰
  - page: 125
    col: 6
    role: j
    text: 潔也說文曰動作切切也不屑就言
  - page: 125
    col: 7
    role: j
    text: 不以就之爲潔而切切於是也巳語
  - page: 125
    col: 8
    role: j
    text: 助辭
  - page: 125
    col: 9
    role: j
    text: 柳下惠不羞汙君不卑小官進不隱賢
  - page: 125
    col: 10
    role: j
    text: 必以其道遺佚而不怨阨窮而不憫故
  - page: 125
    col: 11
    role: j
    text: 曰爾爲爾我爲我雖袒裼裸裎於我側
  - page: 125
    col: 12
    role: j
    text: 爾焉能浼我哉故由由然與之偕而不
  - page: 125
    col: 13
    role: j
    text: 自失焉援而止之而止援而止之而止
  - page: 125
    col: 14
    role: j
    text: 者是亦不屑去巳
  - page: 125
    col: 15
    role: z
    text: 佚音逸袒音但裼音錫裸魯果反裎
  - page: 125
    col: 16
    role: z
    text: 音程焉能之焉於䖍反○柳下惠魯
  - page: 126
    col: 1
    role: j
    text: 大夫展禽居柳下而謚惠也不隱賢
  - page: 126
    col: 2
    role: j
    text: 不枉道也遺佚放棄也阨困也憫憂
  - page: 126
    col: 3
    role: j
    text: 也爾爲爾至焉能浼我哉惠之言也
  - page: 126
    col: 4
    role: j
    text: 袒裼露臂也裸裎露身也由由自得
  - page: 126
    col: 5
    role: z
    text: 之貌偕並處也不自失不失其正也
  - page: 126
    col: 6
    role: z
    text: 援而止之而止者言欲去而可留也
  - page: 126
    col: 7
    role: j
    text: 孟子曰伯夷隘柳下惠不恭隘與不恭
  - page: 126
    col: 8
    role: j
    text: 君子不由也
  - page: 126
    col: 9
    role: z
    text: 隘狹窄也不恭簡慢也夷惠之行固
  - page: 126
    col: 10
    role: z
    text: 皆造乎至極之地然旣有所偏則不
  - page: 126
    col: 11
    role: z
    text: 能無弊故不可由也
  - page: 126
    col: 14
    role: j
    text: 孟子卷第三
