aboutHtml: |-
  <h2>關於此卷</h2>
  <p>《春秋公羊傳注疏》為唐徐彥疏，以漢何休解詁為本，為十三經注疏之一。公羊傳明經之大義，此卷以宋刻本版式數字重刻，半葉八行、行十六字、注文雙行二十五字。</p>
  <p>卷二十收襄公，經注疏全帙。</p>
