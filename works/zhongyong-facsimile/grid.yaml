  - page: 30
    col: 12
    role: z
    text: 事
  - page: 30
    col: 13
    role: j
    text: 使天下之人齊明盛服以承祭祀洋洋
  - page: 30
    col: 14
    role: j
    text: 乎如在其上如在其左右
  - page: 30
    col: 15
    role: j
    text: 齊側皆反○齊之爲言齊也所以齊
  - page: 30
    col: 16
    role: j
    text: 不齊而致其齊也明猶潔也洋洋流
  - page: 31
    col: 1
    role: z
    text: 動充滿之意能使人畏敬奉承而發
  - page: 31
    col: 2
    role: z
    text: 見昭著如此乃其體物而不可遺之
  - page: 31
    col: 3
    role: z
    text: 驗也孔子曰其氣發揚于上爲昭明
  - page: 31
    col: 4
    role: z
    text: 焄蒿悽愴此百物之精也神之著也
  - page: 31
    col: 5
    role: z
    text: 正謂此爾
  - page: 31
    col: 6
    role: j
    text: 詩曰神之格思不可度思矧可射思
  - page: 31
    col: 7
    role: z
    text: 度待洛反射音亦詩作斁○詩大雅
  - page: 31
    col: 8
    role: z
    text: 抑之篇格來也矧況也射厭也言厭
  - page: 31
    col: 9
    role: z
    text: 怠而不敬也思語辭
  - page: 31
    col: 10
    role: j
    text: 夫微之顯誠之不可揜如此夫
  - page: 31
    col: 11
    role: title
    text: 夫音扶○誠者眞實無妄之謂隂陽
  - page: 31
    col: 12
    role: z
    text: 合散無非實者故其發見之不可揜
  - page: 31
    col: 13
    role: z
    text: 如此
  - page: 31
    col: 14
    role: z
    text: 右第十六章
  - page: 31
    col: 15
    role: z
    text: 不見不聞隱也體物如在則亦
  - page: 31
    col: 16
    role: z
    text: 費矣此前三章以其費之小者
  - page: 32
    col: 1
    role: z
    text: 而言此後三章以其費之大者
  - page: 32
    col: 2
    role: z
    text: 而言此一章兼費隱包大小而
  - page: 32
    col: 3
    role: z
    text: 言
  - page: 32
    col: 4
    role: j
    text: 子曰舜其大孝也與德爲聖人尊爲天
  - page: 32
    col: 5
    role: j
    text: 子冨有四海之内宗廟饗之子孫保之
  - page: 32
