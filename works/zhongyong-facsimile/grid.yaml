  - page: 33
    col: 7
    role: z
    text: 則爲體微矣後二章亦此意
  - page: 33
    col: 8
    role: j
    text: 子曰無憂者其惟文王乎以王季爲父
  - page: 33
    col: 9
    role: j
    text: 以武王爲子父作之子述之
  - page: 33
    col: 10
    role: z
    text: 此言文王之事書言王季其勤王家
  - page: 33
    col: 11
    role: z
    text: 蓋其所作亦積功累仁之事也
  - page: 33
    col: 12
    role: j
    text: 武王纘大王王季文王之緒壹戎衣而
  - page: 33
    col: 13
    role: j
    text: 有天下身不失天下之顯名尊爲天子
  - page: 33
    col: 14
    role: j
    text: 冨有四海之内宗廟饗之子孫保之
  - page: 33
    col: 15
    role: z
