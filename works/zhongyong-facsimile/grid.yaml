  - page: 28
    col: 15
    role: z
    text: 右第十四章
  - page: 28
    col: 16
    role: z
    text: 子思之言也凡章首無子曰字
  - page: 29
    col: 1
    role: z
    text: 者放此
  - page: 29
    col: 2
    role: j
    text: 君子之道辟如行遠必自邇辟如登高
  - page: 29
    col: 3
    role: j
