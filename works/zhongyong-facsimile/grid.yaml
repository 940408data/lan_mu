  - page: 29
    col: 4
    role: z
    text: 辟譬同
  - page: 29
    col: 5
    role: j
    text: 詩曰妻子好合如鼓瑟琴兄弟既翕和
  - page: 29
    col: 6
    role: j
    text: 樂且耽宜爾室家樂爾妻帑
  - page: 29
