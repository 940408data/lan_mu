  - page: 35
    col: 16
    role: j
    text: 其時食
  - page: 36
    col: 1
    role: z
    text: 祖廟天子七諸侯五大夫三適士二
  - page: 36
    col: 2
    role: z
    text: 官師一宗器先世所藏之重器若周
  - page: 36
    col: 3
    role: z
    text: 之赤刀大訓天球河圖之屬也裳衣
  - page: 36
    col: 4
    role: z
    text: 先祖之遺衣服祭則設之以授尸也
  - page: 36
    col: 5
    role: z
    text: 時食四時之食各有其物如春行羔
  - page: 36
    col: 6
    role: z
    text: 豚膳膏香之類是也
  - page: 36
    col: 7
    role: j
