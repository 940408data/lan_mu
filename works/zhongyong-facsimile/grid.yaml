  - page: 33
    col: 16
    role: z
    text: 也大王王季之父也書云大王肇基
  - page: 34
    col: 1
    role: z
    text: 王迹詩云至于大王實始翦商緒業
  - page: 34
    col: 2
    role: z
    text: 也戎衣甲胄之屬壹戎衣武成文言
  - page: 34
    col: 3
    role: z
    text: 一著戎衣以伐紂也
  - page: 34
    col: 4
    role: j
    text: 武王末受命周公成文武之德追王大
  - page: 34
    col: 5
    role: j
    text: 王王季上祀先公以天子之禮斯禮也
  - page: 34
    col: 6
    role: j
    text: 達乎諸侯大夫及士庶人父爲大夫子
  - page: 34
    col: 7
    role: j
    text: 爲士葬以大夫祭以士父爲士子爲大
  - page: 34
    col: 8
    role: j
    text: 夫葬以士祭以大夫期之喪達乎大夫
  - page: 34
    col: 9
    role: j
    text: 三年之喪達乎天子父母之喪無貴賤
  - page: 34
    col: 10
    role: j
    text: 一也
  - page: 34
    col: 11
    role: z
    text: 追王之王去聲○此言周公之事末
  - page: 34
    col: 12
    role: z
    text: 猶老也追王蓋推文武之意以及乎
  - page: 34
    col: 13
    role: z
    text: 王迹之所起也先公組紺以上至后
  - page: 34
    col: 14
    role: z
    text: 稷也上祀先公以天子之禮又推大
  - page: 34
    col: 15
    role: z
    text: 王王季之意以及於無窮也制爲禮
  - page: 34
    col: 16
    role: z
    text: 法以及天下使葬用死者之爵祭用
  - page: 35
    col: 1
    role: z
    text: 生者之禄喪服自期以下諸侯絶大
  - page: 35
    col: 2
    role: title
    text: 夫降而父母之喪上下同之推己以
  - page: 35
    col: 3
    role: z
