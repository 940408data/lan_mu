  - page: 38
    col: 4
    role: z
    text: 有詳略耳
  - page: 38
    col: 5
    role: z
    text: 右第十九章
  - page: 38
    col: 6
    role: j
    text: 哀公問政
  - page: 38
    col: 7
    role: z
    text: 哀公魯君名蔣
  - page: 38
    col: 8
    role: j
    text: 子曰文武之政布在方策其人存則其
  - page: 38
    col: 9
    role: j
    text: 政舉其人亡則其政息
  - page: 38
    col: 10
    role: z
    text: 方版也策簡也息猶滅也有是君有
  - page: 38
    col: 11
    role: z
    text: 是臣則有是政矣
  - page: 38
    col: 12
    role: j
    text: 人道敏政地道敏樹夫政也者蒲盧也
  - page: 38
    col: 13
    role: z
    text: 夫音扶○敏速也蒲盧沈括以為蒲
  - page: 38
    col: 14
    role: z
    text: 葦是也以人立政猶以地種樹其成
  - page: 38
    col: 15
    role: z
    text: 速矣而蒲葦又易生之物其成尤速
  - page: 38
    col: 16
    role: z
    text: 也言人存政舉其易如此
  - page: 39
    col: 1
    role: j
    text: 故爲政在人取人以身脩身以道脩道
  - page: 39
    col: 2
    role: j
    text: 以仁
  - page: 39
    col: 3
    role: z
    text: 此承上文人道敏政而言也爲政在
  - page: 39
    col: 4
    role: z
    text: 人家語作爲政在於得人語意尤備
  - page: 39
    col: 5
    role: z
    text: 人謂賢臣身指君身道者天下之達
  - page: 39
    col: 6
    role: z
    text: 道仁者天地生物之心而人得以生
  - page: 39
    col: 7
    role: z
    text: 者所謂元者善之長也言人君爲政
  - page: 39
    col: 8
    role: z
    text: 在於得人而取人之則又在脩身能
  - page: 39
    col: 9
    role: z
    text: 仁其身則有君有臣而政無不舉矣
  - page: 39
    col: 10
    role: j
    text: 仁者人也親親爲大義者宜也尊賢爲
  - page: 39
    col: 11
    role: j
    text: 大親親之殺尊賢之等禮所生也、
  - page: 39
    col: 12
    role: z
    text: 殺去聲○人指人身而言具此生理
  - page: 39
    col: 13
    role: z
    text: 自然便有惻怛慈愛之意深體味之
  - page: 39
    col: 14
    role: z
    text: 可見宜者分別事理各有所宜也禮
  - page: 39
    col: 15
    role: z
    text: 則節文斯二者而已
  - page: 39
    col: 16
    role: j
    text: 在下位不獲乎上民不可得而治矣
  - page: 40
    col: 1
    role: z
    text: 鄭氏曰此句在下誤重在此
  - page: 40
    col: 2
    role: j
    text: 故君子不可以不脩身思脩身不可以
  - page: 40
    col: 3
    role: j
    text: 不事親思事親不可以不知人思知人
  - page: 40
    col: 4
    role: j
    text: 不可以不知天
  - page: 40
    col: 5
    role: z
    text: 爲政在人取人以身故不可以不脩
  - page: 40
    col: 6
    role: z
    text: 身脩身以道脩道以仁故思脩身不
  - page: 40
    col: 7
    role: z
    text: 可以不事親欲盡親親之仁必由尊
  - page: 40
    col: 8
    role: z
    text: 賢之義故又當知人親親之殺尊賢
  - page: 40
    col: 9
    role: z
    text: 之等皆天理也故又當知天
  - page: 40
    col: 10
    role: j
    text: 天下之達道五所以行之者三曰君臣
  - page: 40
    col: 11
    role: j
    text: 也父子也夫婦也昆弟也朋友之交也
  - page: 40
    col: 12
    role: j
    text: 五者天下之達道也知仁勇三者天下
  - page: 40
    col: 13
    role: j
    text: 之達德也所以行之者一也
  - page: 40
    col: 14
    role: z
    text: 知去聲○達道者天下古今所共由
  - page: 40
    col: 15
    role: z
    text: 之路即書所謂五典孟子所謂父子
  - page: 40
    col: 16
    role: z
    text: 有親君臣有義夫婦有别長幼有序
  - page: 41
    col: 1
    role: z
    text: 朋友有信是也知所以知此也仁所
  - page: 41
    col: 2
    role: z
    text: 以體此也勇所以強此也謂之達德
  - page: 41
    col: 3
    role: z
    text: 者天下古今所同得之理也一則誠
  - page: 41
    col: 4
    role: z
    text: 而已矣達道雖人所共由然無是三
  - page: 41
    col: 5
    role: z
    text: 德則無以行之達德雖人所同得然
  - page: 41
    col: 6
    role: z
    text: 一有不誠則人欲閒之而德非其德
  - page: 41
    col: 7
    role: z
    text: 矣程子曰所謂誠者止是誠實此三
  - page: 41
    col: 8
    role: z
    text: 者三者之外更別無誠
  - page: 41
    col: 9
    role: j
    text: 或生而知之或學而知之或困而知之
  - page: 41
    col: 10
    role: j
    text: 及其知之一也或安而行之或利而行
  - page: 41
    col: 11
    role: j
    text: 之或勉強而行之及其成功一也
  - page: 41
    col: 12
    role: z
    text: 強上聲○知之者之所知行之者之
  - page: 41
    col: 13
    role: z
    text: 所行謂達道也以其分而言則所以
  - page: 41
    col: 14
    role: z
    text: 知者知也所以行者仁也所以至於
  - page: 41
    col: 15
    role: z
    text: 知之成功而一者勇也以其等而言
  - page: 41
    col: 16
    role: z
    text: 則生知安行者知也學知利行者仁
  - page: 42
    col: 1
    role: z
    text: 也困知勉行者勇也蓋人性雖無不
  - page: 42
    col: 2
    role: z
    text: 善而氣稟有不同者故聞道有蚤莫
  - page: 42
    col: 3
    role: z
    text: 行道有難易然能自強不息則其至
  - page: 42
    col: 4
    role: z
    text: 一也吕氏曰所入之塗雖異而所至
  - page: 42
    col: 5
    role: z
    text: 之域則同此所以爲中庸若乃企生
  - page: 42
    col: 6
    role: z
    text: 知安行之資爲不可幾及輕困知勉
  - page: 42
    col: 7
    role: z
    text: 行謂不能有成此道之所以不明不
  - page: 42
    col: 8
    role: z
    text: 行也
  - page: 42
    col: 9
    role: j
    text: 子曰好學近乎知力行近乎仁知恥近
  - page: 42
    col: 10
    role: j
    text: 乎勇
  - page: 42
    col: 11
    role: z
    text: 子曰二字衍文好近乎知之知並去
  - page: 42
    col: 12
    role: z
    text: 聲○此言未及乎達德而求以入德
  - page: 42
    col: 13
    role: z
    text: 之事通上文三知爲知三行爲仁則
  - page: 42
    col: 14
    role: z
    text: 此三近者勇之次也吕氏曰愚者自
  - page: 42
    col: 15
    role: z
    text: 是而不求自私者徇人欲而忘反懦
  - page: 42
    col: 16
    role: z
    text: 者甘爲人下而不辭故好學非知然
  - page: 43
    col: 1
    role: z
    text: 足以破愚力行非仁然足以忘私知
  - page: 43
    col: 2
    role: z
    text: 恥非勇然足以起懦
  - page: 43
    col: 3
    role: j
    text: 知斯三者則知所以脩身知所以脩身
  - page: 43
    col: 4
    role: j
    text: 則知所以治人知所以治人則知所以
  - page: 43
    col: 5
    role: j
    text: 治天下國家矣
  - page: 43
    col: 6
    role: z
    text: 斯三者指三近而言人者對己之稱
  - page: 43
    col: 7
    role: z
    text: 天下國家則盡乎人矣言此以結上
  - page: 43
    col: 8
    role: z
    text: 文脩身之意起下文九經之端也
  - page: 43
    col: 9
    role: j
    text: 凡爲天下國家有九經曰脩身也尊賢
  - page: 43
    col: 10
    role: j
    text: 也親親也敬大臣也體羣臣也子庶民
  - page: 43
    col: 11
    role: j
    text: 也來百工也柔遠人也懷諸侯也
  - page: 43
    col: 12
    role: z
    text: 經常也體謂設以身處其地而察其
  - page: 43
    col: 13
    role: z
    text: 心也子如父母之愛其子也柔遠人
  - page: 43
    col: 14
    role: z
    text: 所謂無忘賔旅者也此列九經之目
  - page: 43
    col: 15
    role: z
    text: 也吕氏曰天下國家之本在身故脩
  - page: 43
    col: 16
    role: z
    text: 身爲九經之本然必親師友然後脩
  - page: 44
    col: 1
    role: j
    text: 身之道進故尊賢次之道之所進莫
  - page: 44
    col: 2
    role: j
    text: 先其家故親親次之由家以及朝廷
  - page: 44
    col: 3
    role: j
    text: 故敬大臣體羣臣次之由朝廷以及
  - page: 44
    col: 4
    role: j
    text: 其國故子庶民來百工次之由其國
  - page: 44
    col: 5
    role: j
    text: 以及天下故柔遠人懷諸侯次之此
  - page: 44
    col: 6
    role: j
    text: 九經之序也視羣臣猶吾四體視百
  - page: 44
    col: 7
    role: z
    text: 姓猶吾子此視臣視民之別也
  - page: 44
    col: 8
    role: j
    text: 脩身則道立尊賢則不惑親親則諸父
  - page: 44
    col: 9
    role: j
    text: 昆弟不怨敬大臣則不眩體羣臣則士
  - page: 44
    col: 10
    role: j
    text: 之報禮重子庶民則百姓勸來百工則
  - page: 44
    col: 11
    role: j
    text: 財用足柔遠人則四方歸之懷諸侯則
  - page: 44
    col: 12
    role: j
    text: 天下畏之
  - page: 44
    col: 13
    role: z
    text: 此言九經之效也道立謂道成於己
  - page: 44
    col: 14
    role: z
    text: 而可爲民表所謂建其有極是也不
  - page: 44
    col: 15
    role: z
    text: 惑謂不疑於理不眩謂不迷於事敬
  - page: 44
    col: 16
    role: z
    text: 大臣則信任專而小臣不得以閒之
  - page: 45
    col: 1
    role: j
    text: 故臨事而不眩也來百工則通功易
  - page: 45
    col: 2
    role: j
    text: 事農末相資故財用足柔遠人則天
  - page: 45
    col: 3
    role: j
    text: 下之旅皆悅而願出於其塗故四方
  - page: 45
    col: 4
    role: z
    text: 歸懷諸侯則德之所施者博而威之
  - page: 45
    col: 5
    role: z
    text: 所制者廣矣故曰天下畏之
  - page: 45
    col: 6
    role: j
    text: 齊明盛服非禮不動所以脩身也去讒
  - page: 45
    col: 7
    role: j
    text: 遠色賤貨而貴德所以勸賢也尊其位
  - page: 45
    col: 8
    role: j
    text: 重其祿同其好惡所以勸親親也官盛
  - page: 45
    col: 9
    role: j
    text: 任使所以勸大臣也忠信重祿所以勸
  - page: 45
    col: 10
    role: j
    text: 士也時使薄歛所以勸百姓也日省月
  - page: 45
    col: 11
    role: j
    text: 試既稟稱事所以勸百工也送往迎來
  - page: 45
    col: 12
    role: j
    text: 嘉善而矜不能所以柔遠人也繼絕世
  - page: 45
    col: 13
    role: j
    text: 舉廢國治亂持危朝聘以時厚往而薄
  - page: 45
    col: 14
    role: j
    text: 來所以懷諸侯也
  - page: 45
    col: 15
    role: z
    text: 齊側皆反去上聲遠好惡歛並去聲
  - page: 45
    col: 16
    role: z
    text: 既許氣反稟彼錦力錦二反稱去聲
  - page: 46
    col: 1
    role: z
    text: 朝音潮○此言九經之事也官盛任
  - page: 46
    col: 2
    role: z
    text: 使謂官屬衆盛足任使令也蓋大臣
  - page: 46
    col: 3
    role: z
    text: 不當親細事故所以優之者如此忠
  - page: 46
    col: 4
    role: z
    text: 信重禄謂待之誠而養之厚蓋以身
  - page: 46
    col: 5
    role: z
    text: 體之而知其所頼乎上者如此也旣
  - page: 46
    col: 6
    role: z
    text: 讀曰餼餼稟稍食也稱事如周禮槀
  - page: 46
    col: 7
    role: z
    text: 人職曰考其弓弩以上下其食是也
  - page: 46
    col: 8
    role: z
    text: 往則爲之授節以送之來則豐其委
  - page: 46
    col: 9
    role: z
    text: 積以迎之朝謂諸侯見於天子聘謂
  - page: 46
    col: 10
    role: z
    text: 諸侯使大夫來獻王制比年一小聘
  - page: 46
    col: 11
    role: z
    text: 三年一大聘五年一朝厚往薄來謂
  - page: 46
    col: 12
    role: z
    text: 燕賜厚而納貢薄
  - page: 46
    col: 13
    role: j
    text: 凡爲天下國家有九經所以行之者一
  - page: 46
    col: 14
    role: j
    text: 也
  - page: 46
    col: 15
    role: z
    text: 一者誠也一有不誠則是九者皆爲
  - page: 46
    col: 16
    role: z
    text: 虚文矣此九經之實也
  - page: 47
    col: 1
    role: j
    text: 凡事豫則立不豫則廢言前定則不跲
  - page: 47
    col: 2
    role: j
    text: 事前定則不困行前定則不疚道前定
  - page: 47
    col: 3
    role: j
    text: 則不窮
  - page: 47
    col: 4
    role: z
    text: 跲其刼反行去聲○凡事指達道達
  - page: 47
    col: 5
    role: z
    text: 德九經之屬豫素定也跲躓也疚病
  - page: 47
    col: 6
    role: z
    text: 也此承上文言凡事皆欲先立乎誠
  - page: 47
    col: 7
    role: z
    text: 如下文所推是也
  - page: 47
    col: 8
    role: j
    text: 在下位不獲乎上民不可得而治矣獲
  - page: 47
    col: 9
    role: j
    text: 乎上有道不信乎朋友不獲乎上矣信
  - page: 47
    col: 10
    role: j
    text: 乎朋友有道不順乎親不信乎朋友矣
  - page: 47
    col: 11
    role: j
    text: 順乎親有道反諸身不誠不順乎親矣
  - page: 47
    col: 12
    role: j
    text: 誠身有道不明乎善不誠乎身矣
  - page: 47
    col: 13
    role: z
    text: 此又以在下位者推言素定之意反
  - page: 47
    col: 14
    role: z
    text: 諸身不誠謂反求諸身而所存所發
  - page: 47
    col: 15
    role: z
    text: 未能眞實而無妄也不明乎善謂未
  - page: 47
    col: 16
    role: z
    text: 能察於人心天命之本然而眞知至
  - page: 48
    col: 1
    role: z
    text: 善之所在也
  - page: 48
    col: 2
    role: j
    text: 誠者天之道也誠之者人之道也誠者
  - page: 48
    col: 3
    role: j
    text: 不勉而中不思而得從容中道聖人也
  - page: 48
    col: 4
    role: j
    text: 誠之者擇善而固執之者也
  - page: 48
    col: 5
    role: z
    text: 中並去聲從七容反○此承上文誠
  - page: 48
    col: 6
    role: z
    text: 身而言誠者眞實無妄之謂天理之
  - page: 48
    col: 7
    role: z
    text: 本然也誠之者未能眞實無妄而欲
  - page: 48
    col: 8
    role: z
    text: 其眞實無妄之謂人事之當然也聖
  - page: 48
    col: 9
    role: z
    text: 人之德渾然天理眞實無妄不待思
  - page: 48
    col: 10
    role: z
    text: 勉而從容中道則亦天之道也未至
  - page: 48
    col: 11
    role: z
    text: 於聖則不能無人欲之私而其爲德
  - page: 48
    col: 12
    role: z
    text: 不能皆實故未能不思而得則必擇
  - page: 48
    col: 13
    role: z
    text: 善然後可以明善未能不勉而中則
  - page: 48
    col: 14
    role: z
    text: 必固執然後可以誠身此則所謂人
  - page: 48
    col: 15
    role: z
    text: 之道也不思而得生知也不勉而中
  - page: 48
    col: 16
    role: z
    text: 安行也擇善學知以下之事固執利
  - page: 49
    col: 1
    role: z
    text: 行以下之事也
  - page: 49
    col: 2
    role: j
    text: 博學之審問之愼思之明辨之篤行之
  - page: 49
    col: 3
    role: z
    text: 此誠之之目也學問思辨所以擇善
  - page: 49
    col: 4
    role: z
    text: 而爲知學而知也篤行所以固執而
  - page: 49
    col: 5
    role: z
    text: 爲仁利而行也程子曰五者廢其一
  - page: 49
    col: 6
    role: z
    text: 非學也
  - page: 49
    col: 7
    role: j
    text: 有弗學學之弗能弗措也有弗問問之
  - page: 49
    col: 8
    role: j
    text: 弗知弗措也有弗思思之弗得弗措也
  - page: 49
    col: 9
    role: j
    text: 有弗辨辨之弗明弗措也有弗行行之
  - page: 49
    col: 10
    role: j
    text: 弗篤弗措也人一能之己百之人十能
  - page: 49
    col: 11
    role: j
    text: 之己千之
  - page: 49
    col: 12
    role: z
    text: 君子之學不爲則已爲則必要其成
  - page: 49
    col: 13
    role: z
    text: 故常百倍其功此困而知勉而行者
  - page: 49
    col: 14
    role: z
    text: 也勇之事也
  - page: 49
    col: 15
    role: j
    text: 果能此道矣雖愚必明雖柔必強
  - page: 49
    col: 16
    role: z
    text: 明者擇善之功強者固執之效吕氏
  - page: 50
    col: 1
    role: j
    text: 曰君子所以學者為能變化氣質而
  - page: 50
    col: 2
    role: j
    text: 巳德勝氣質則愚者可進於明柔者
  - page: 50
    col: 3
    role: j
    text: 可進於強不能勝之則雖有志於學
  - page: 50
    col: 4
    role: j
    text: 亦愚不能明柔不能立而巳矣蓋均
  - page: 50
    col: 5
    role: j
    text: 善而無惡者性也人所同也昬明強
  - page: 50
    col: 6
    role: j
    text: 弱之稟不齊者才也人所異也誠之
  - page: 50
    col: 7
    role: j
    text: 者所以反其同而變其異也夫以不
  - page: 50
    col: 8
    role: j
    text: 美之質求變而美非百倍其功不足
  - page: 50
    col: 9
    role: title
    text: 以致之今以鹵莽滅裂之學或作或
  - page: 50
    col: 10
    role: title
    text: 輟以變其不美之質及不能變則曰
  - page: 50
    col: 11
    role: j
    text: 天質不美非學所能變是果於自棄
  - page: 50
    col: 12
    role: j
    text: 其為不仁甚矣
  - page: 50
    col: 13
    role: z
    text: 右第二十章
  - page: 50
    col: 14
    role: z
    text: 此引孔子之言以繼大舜文武
  - page: 50
    col: 15
    role: z
    text: 周公之緒明其所傳之一致舉
  - page: 50
    col: 16
    role: z
    text: 而措之亦猶是耳蓋包費隱兼
  - page: 51
    col: 1
    role: z
    text: 小大以終十二章之意章内語
  - page: 51
    col: 2
    role: z
    text: 誠始詳而所謂誠者實此篇之
  - page: 51
    col: 3
    role: z
    text: 樞紐也又按孔子家語亦載此
  - page: 51
    col: 4
    role: z
    text: 章而其文尤詳成功一也之下
  - page: 51
    col: 5
    role: z
    text: 有公曰子之言美矣至矣寡人
  - page: 51
    col: 6
    role: z
    text: 實固不足以成之也故其下復
  - page: 51
    col: 7
    role: z
    text: 猶有子曰二字蓋子思刪其繁
  - page: 51
    col: 8
    role: z
    text: 猶有子曰二字蓋子思刪其繁
  - page: 51
    col: 9
    role: z
    text: 文以附于篇而所刪有不盡者
  - page: 51
    col: 10
    role: z
    text: 今當爲衍文也博學之以下家語
  - page: 51
    col: 11
    role: z
    text: 無之意彼有闕文抑此或子思
  - page: 51
    col: 12
    role: z
    text: 所補也歟
  - page: 51
    col: 13
    role: j
    text: 自誠明謂之性自明誠謂之教誠則明
  - page: 51
    col: 14
    role: j
    text: 矣明則誠矣
  - page: 51
    col: 15
    role: z
    text: 自由也德無不實而明無不照者聖
  - page: 51
    col: 16
    role: z
    text: 人之德所性而有者也天道也先明
  - page: 52
    col: 1
    role: title
    text: 乎善而後能實其善者賢人之學由
  - page: 52
    col: 2
    role: z
    text: 教而入者也人道也誠則無不明矣
  - page: 52
    col: 3
    role: z
    text: 明則可以至於誠矣
  - page: 52
    col: 4
    role: z
    text: 右第二十一章子思承上章夫子
  - page: 52
    col: 5
    role: z
    text: 天道人道之意而立言也自此以
  - page: 52
    col: 6
    role: z
    text: 下十二章皆子思之言以反覆推
  - page: 52
    col: 7
    role: z
    text: 明此章之意
  - page: 52
    col: 8
    role: j
    text: 唯天下至誠爲能盡其性能盡其性則
  - page: 52
    col: 9
    role: j
    text: 能盡人之性能盡人之性則能盡物之
  - page: 52
    col: 10
    role: j
    text: 性能盡物之性則可以贊天地之化育
  - page: 52
    col: 11
    role: j
    text: 可以贊天地之化育則可以與天地參
  - page: 52
    col: 12
    role: j
    text: 矣
  - page: 52
    col: 13
    role: z
    text: 天下至誠謂聖人之德之實天下莫
  - page: 52
    col: 14
    role: z
    text: 能加也盡其性者德無不實故無人
  - page: 52
    col: 15
    role: z
    text: 欲之私而天命之在我者察之由之
  - page: 52
    col: 16
    role: z
    text: 巨細精粗無毫髮之不盡也人物之
  - page: 53
    col: 1
    role: z
    text: 性亦我之性但以所賦形氣不同而
  - page: 53
    col: 2
    role: title
    text: 有異耳能盡之者謂知之無不明而
  - page: 53
    col: 3
    role: title
    text: 處之無不當也賛猶助也與天地參
  - page: 53
    col: 4
    role: z
    text: 謂與天地並立爲三也此自誠而明
  - page: 53
    col: 5
    role: z
    text: 者之事也
  - page: 53
    col: 6
    role: z
    text: 右第二十二章
  - page: 53
    col: 7
    role: z
    text: 言天道也
  - page: 53
    col: 8
    role: j
    text: 其次致曲曲能有誠誠則形形則著著
  - page: 53
    col: 9
    role: j
    text: 則明明則動動則變變則化唯天下至
  - page: 53
    col: 10
    role: j
    text: 誠爲能化
  - page: 53
    col: 11
    role: z
    text: 其次通大賢以下凡誠有未至者而
  - page: 53
    col: 12
    role: z
    text: 言也致推致也曲一偏也形者積中
  - page: 53
    col: 13
    role: z
    text: 而發外著則又加顯矣明則又有光
  - page: 53
    col: 14
    role: z
    text: 輝發越之盛也動者誠能動物變者
  - page: 53
    col: 15
    role: z
    text: 物從而變化則有不知其所以然者
  - page: 53
    col: 16
    role: z
    text: 蓋人之性無不同而氣則有異故惟
  - page: 54
    col: 1
    role: j
    text: 聖人能舉其性之全體而盡之其次
  - page: 54
    col: 2
    role: j
    text: 則必自其善端發見之偏而悉推致
  - page: 54
    col: 3
    role: title
    text: 之以各造其極也曲無不致則德無
  - page: 54
    col: 4
    role: title
    text: 不實而形著動變之功自不能已積
  - page: 54
    col: 5
    role: j
    text: 而至於能化則其至誠之妙亦不異
  - page: 54
    col: 6
    role: j
    text: 於聖人矣
  - page: 54
    col: 7
    role: z
    text: 右第二十三章
  - page: 54
    col: 8
    role: z
    text: 言人道也
  - page: 54
    col: 9
    role: j
    text: 至誠之道可以前知國家將興必有禎
  - page: 54
    col: 10
    role: j
    text: 祥國家將亡必有妖孽見乎蓍龜動乎
  - page: 54
    col: 11
    role: j
    text: 四體禍福將至善必先知之不善必先
  - page: 54
    col: 12
    role: j
    text: 知之故至誠如神
  - page: 54
    col: 13
    role: j
    text: 見音現○禎祥者福之兆妖孽者禍
  - page: 54
    col: 14
    role: j
    text: 之萌蓍所以筮龜所以卜四體謂動
  - page: 54
    col: 15
    role: j
    text: 作威儀之閒如執玉高卑其容俯仰
  - page: 54
    col: 16
    role: title
    text: 之類凡此皆理之先見者也然唯誠
  - page: 55
    col: 1
    role: z
    text: 之至極而無一毫私僞留於心目之
  - page: 55
    col: 2
    role: z
    text: 閒者乃能有以察其幾焉神謂鬼神
  - page: 55
    col: 3
    role: z
    text: 右第二十四章
  - page: 55
    col: 4
    role: z
    text: 言天道也
  - page: 55
    col: 5
    role: j
    text: 誠者自成也而道自道也
  - page: 55
    col: 6
    role: z
    text: 道也之道音導○言誠者物之所以
  - page: 55
    col: 7
    role: z
    text: 自成而道者人之所當自行也誠以
  - page: 55
    col: 8
    role: z
    text: 心言本也道以理言用也
  - page: 55
    col: 9
    role: j
    text: 誠者物之終始不誠無物是故君子誠
  - page: 55
    col: 10
    role: j
    text: 之爲貴
  - page: 55
    col: 11
    role: z
    text: 天下之物皆實理之所爲故必得是
  - page: 55
    col: 12
    role: z
    text: 理然後有是物所得之理旣盡則是
  - page: 55
    col: 13
    role: z
    text: 物亦盡而無有矣故人之心一有不
  - page: 55
    col: 14
    role: z
    text: 實則雖有所爲亦如無有而君子必
  - page: 55
    col: 15
    role: z
    text: 以誠爲貴也蓋人之心能無不實乃
  - page: 55
    col: 16
    role: z
    text: 爲有以自成而道之在我者亦無不
  - page: 56
    col: 1
    role: j
    text: 行矣
  - page: 56
    col: 2
    role: j
    text: 誠者非自成己而已也所以成物也成
  - page: 56
    col: 3
    role: j
    text: 己仁也成物知也性之德也合外內之
  - page: 56
    col: 4
    role: j
    text: 道也故時措之宜也
  - page: 56
    col: 5
    role: z
    text: 知去聲○誠雖所以成己然既有以
  - page: 56
    col: 6
    role: j
    text: 自成則自然及物而道亦行於彼矣
  - page: 56
    col: 7
    role: title
    text: 仁者體之存智者用之發是皆吾性
  - page: 56
    col: 8
    role: j
    text: 之固有而無內外之殊既得於己則
  - page: 56
    col: 9
    role: j
    text: 見於事者以時措之而皆得其宜也
  - page: 56
    col: 10
    role: z
    text: 右第二十五章
  - page: 56
    col: 11
    role: z
    text: 言人道也
  - page: 56
    col: 12
    role: j
    text: 故至誠無息
  - page: 56
    col: 13
    role: z
    text: 既無虛假自無閒斷
  - page: 56
    col: 14
    role: j
    text: 不息則久久則徵
  - page: 56
    col: 15
    role: z
    text: 久常於中也徵驗於外也
  - page: 56
    col: 16
    role: j
    text: 徵則悠遠悠遠則博厚博厚則高明
  - page: 57
    col: 1
    role: z
    text: 此皆以其驗於外者言之鄭氏所謂
  - page: 57
    col: 2
    role: z
    text: 至誠之德著於四方者是也存諸中
  - page: 57
    col: 3
    role: z
    text: 者既久則驗於外者益悠遠而無窮
  - page: 57
    col: 4
    role: z
    text: 矣悠遠故其積也廣博而深厚博厚
  - page: 57
    col: 5
    role: z
    text: 故其發也高大而光明
  - page: 57
    col: 6
    role: j
    text: 博厚所以載物也高明所以覆物也悠
  - page: 57
    col: 7
    role: j
    text: 久所以成物也
  - page: 57
    col: 8
    role: z
    text: 悠遠即悠遠兼內外而言之也本以
  - page: 57
    col: 9
    role: z
    text: 悠遠致高厚而高厚又悠久也此言
  - page: 57
    col: 10
    role: z
    text: 聖人與天地同用
  - page: 57
    col: 11
    role: j
    text: 博厚配地高明配天悠久無疆
  - page: 57
    col: 12
    role: z
    text: 此言聖人與天地同體
  - page: 57
    col: 13
    role: j
    text: 如此者不見而章不動而變無為而成
  - page: 57
    col: 14
    role: z
    text: 見音現○見猶示也不見而章以配
  - page: 57
    col: 15
    role: z
    text: 地而言也不動而變以配天而言也
  - page: 57
    col: 16
    role: z
    text: 無為而成以無疆而言也
  - page: 58
    col: 1
    role: j
    text: 天地之道可一言而盡也其爲物不貳
  - page: 58
    col: 2
    role: j
    text: 則其生物不測
  - page: 58
    col: 3
    role: z
    text: 此以下復以天地明至誠無息之功
  - page: 58
    col: 4
    role: z
    text: 用天地之道可一言而盡不過曰誠
  - page: 58
    col: 5
    role: z
    text: 而巳不貳所以誠也誠故不息而生
  - page: 58
    col: 6
    role: z
    text: 物之多有莫知其所以然者
  - page: 58
    col: 7
    role: j
    text: 天地之道愽也厚也髙也明也悠也乆
  - page: 58
    col: 8
    role: j
    text: 也
  - page: 58
    col: 9
    role: z
    text: 言天地之道誠一不貳故能各極其
  - page: 58
    col: 10
    role: z
    text: 盛而有下文生物之功
  - page: 58
    col: 11
    role: j
    text: 今夫天斯昭昭之多及其無窮也日月
  - page: 58
    col: 12
    role: j
    text: 星辰繫焉萬物覆焉今夫地一撮土之
  - page: 58
    col: 13
    role: j
    text: 多及其廣厚載華嶽而不重振河海而
  - page: 58
    col: 14
    role: j
    text: 不洩萬物載焉今夫山一卷石之多及
  - page: 58
    col: 15
    role: j
    text: 其廣大草木生之禽獸居之寶藏興焉
  - page: 58
    col: 16
    role: j
    text: 今夫水一勺之多及其不測黿鼉鮫龍
  - page: 59
    col: 1
    role: j
    text: 魚鼈生焉貸財殖焉
  - page: 59
    col: 2
    role: j
    text: 夫音扶華藏並去聲卷平聲勺市若
  - page: 59
    col: 3
    role: j
    text: 反○昭昭猶耿耿小明也此指其一
  - page: 59
    col: 4
    role: j
    text: 處而言之及其無窮猶十二章及其
  - page: 59
    col: 5
    role: j
    text: 至也之意蓋舉全體而言也振收也
  - page: 59
    col: 6
    role: j
    text: 卷區也此四條皆以發明由其不貳
  - page: 59
    col: 7
    role: j
    text: 不息以致盛大而能生物之意然天
  - page: 59
    col: 8
    role: j
    text: 地山川實非由積累而後大讀者不
  - page: 59
    col: 9
    role: z
    text: 以辭害意可也
  - page: 59
    col: 10
    role: j
    text: 詩云維天之命於穆不已蓋曰天之所
  - page: 59
    col: 11
    role: j
    text: 以爲天也於乎不顯文王之德之純蓋
  - page: 59
    col: 12
    role: j
    text: 曰文王之所以爲文也純亦不已
  - page: 59
    col: 13
    role: j
    text: 於音烏乎音呼○詩周頌維天之命
  - page: 59
    col: 14
    role: j
    text: 篇於歎辭穆深遠也不顯猶言豈不
  - page: 59
    col: 15
    role: title
    text: 顯也純純一不雜也引此以明至誠
  - page: 59
    col: 16
    role: j
    text: 無息之意程子曰天道不已文王純
  - page: 60
    col: 1
    role: z
    text: 於天道亦不已純則無二無雜不已
  - page: 60
    col: 2
    role: z
    text: 則無閒斷先後
  - page: 60
    col: 3
    role: z
    text: 右第二十六章
  - page: 60
    col: 4
    role: z
    text: 言天道也
  - page: 60
    col: 5
    role: j
    text: 大哉聖人之道
  - page: 60
    col: 6
    role: z
    text: 包下文兩節而言
  - page: 60
    col: 7
    role: j
    text: 洋洋乎發育萬物峻極于天
  - page: 60
    col: 8
    role: z
    text: 峻高大也此言道之極於至大而無
  - page: 60
    col: 9
    role: z
    text: 外也
  - page: 60
    col: 10
    role: j
    text: 優優大哉禮儀三百威儀三千
  - page: 60
    col: 11
    role: z
    text: 優優充足有餘之意禮儀經禮也威
  - page: 60
    col: 12
    role: z
    text: 儀曲禮也此言道之入於至小而無
  - page: 60
    col: 13
    role: z
    text: 閒也
  - page: 60
    col: 14
    role: j
    text: 待其人而後行
  - page: 60
    col: 15
    role: z
    text: 總結上兩節
  - page: 60
    col: 16
    role: j
    text: 故曰苟不至德至道不凝焉
  - page: 61
    col: 1
    role: j
    text: 至德謂其人至道指上兩節而言也
  - page: 61
    col: 2
    role: z
    text: 凝聚也成也
  - page: 61
    col: 3
    role: j
    text: 故君子尊德性而道問學致廣大而盡
  - page: 61
    col: 4
    role: j
    text: 精微極高明而道中庸温故而知新敦
  - page: 61
    col: 5
    role: j
    text: 厚以崇禮
  - page: 61
    col: 6
    role: z
    text: 尊者恭敬奉持之意德性者吾所受
  - page: 61
    col: 7
    role: z
    text: 於天之正理道由也温猶燖温之温
  - page: 61
    col: 8
    role: z
    text: 謂故學之矣復時習之也敦加厚也
  - page: 61
    col: 9
    role: z
    text: 尊德性所以存心而極乎道體之大
  - page: 61
    col: 10
    role: z
    text: 也道問學所以致知而盡乎道體之
  - page: 61
    col: 11
    role: z
    text: 細也二者脩德凝道之大端也不以
  - page: 61
    col: 12
    role: z
    text: 一毫私意自蔽不以一毫私欲自累
  - page: 61
    col: 13
    role: z
    text: 涵泳乎其所已知敦篤乎其所已能
  - page: 61
    col: 14
    role: z
    text: 此皆存心之屬也析理則不使有毫
  - page: 61
    col: 15
    role: z
    text: 氂之差處事則不使有過不及之謬
  - page: 61
    col: 16
    role: z
    text: 理義則日知其所未知節文則日謹
  - page: 62
    col: 1
    role: z
    text: 其所未謹此皆致知之屬也蓋非存
  - page: 62
    col: 2
    role: z
    text: 心無以致知而存心者又不可以不
  - page: 62
    col: 3
    role: z
    text: 致知故此五句大小相資首尾相應
  - page: 62
    col: 4
    role: z
    text: 聖賢所示入德之方莫詳於此學者
  - page: 62
    col: 5
    role: z
    text: 宜盡心焉
  - page: 62
    col: 6
    role: j
    text: 是故居上不驕爲下不倍國有道其言
  - page: 62
    col: 7
    role: title
    text: 足以興國無道其黙足以容詩曰旣明
  - page: 62
    col: 8
    role: j
    text: 且哲以保其身其此之謂與
  - page: 62
    col: 9
    role: z
    text: 倍與背同與平聲○興謂興起在位
  - page: 62
    col: 10
    role: z
    text: 也詩大雅烝民之篇
  - page: 62
    col: 11
    role: z
    text: 右第二十七章
  - page: 62
    col: 12
    role: z
    text: 言人道也
  - page: 62
    col: 13
    role: j
    text: 子曰愚而好自用賤而好自專生乎今
  - page: 62
    col: 14
    role: j
    text: 之世反古之道如此者烖及其身者也
  - page: 62
    col: 15
    role: z
    text: 好去聲烖古灾字○以上孔子之言
  - page: 62
    col: 16
    role: z
    text: 子思引之反復也
  - page: 63
    col: 1
    role: j
    text: 非天子不議禮不制度不考文
  - page: 63
    col: 2
    role: z
    text: 此以下子思之言禮親疏貴賤相接
  - page: 63
    col: 3
    role: z
    text: 之體也度品制文書名
  - page: 63
    col: 4
    role: j
    text: 今天下車同軌書同文行同倫
  - page: 63
    col: 5
    role: z
    text: 行去聲○今子思自謂當時也軌轍
  - page: 63
    col: 6
    role: z
    text: 迹之度倫次序之體三者皆同言天
  - page: 63
    col: 7
    role: z
    text: 下一統也
  - page: 63
    col: 8
    role: j
    text: 雖有其位苟無其德不敢作禮樂焉雖
  - page: 63
    col: 9
    role: j
    text: 有其德苟無其位亦不敢作禮樂焉
  - page: 63
    col: 10
    role: z
    text: 鄭氏曰言作禮樂者必聖人在天子
  - page: 63
    col: 11
    role: z
    text: 之位
  - page: 63
    col: 12
    role: j
    text: 子曰吾說夏禮杞不足徵也吾學殷禮
  - page: 63
    col: 13
    role: j
    text: 有宋存焉吾學周禮今用之吾從周
  - page: 63
    col: 14
    role: z
    text: 此又引孔子之言杞夏之後徵證也
  - page: 63
    col: 15
    role: z
    text: 宋殷之後三代之禮孔子皆嘗學之
  - page: 63
    col: 16
    role: title
    text: 而能言其意但夏禮旣不可考證殷
  - page: 64
    col: 1
    role: j
    text: 禮雖存又非當世之法惟周禮乃時
  - page: 64
    col: 2
    role: j
    text: 王之制今日所用孔子旣不得位則
  - page: 64
    col: 3
    role: j
    text: 從周而已
  - page: 64
    col: 4
    role: z
    text: 右第二十八章
  - page: 64
    col: 5
    role: z
    text: 承上章爲下不倍而言亦人道
  - page: 64
    col: 6
    role: z
    text: 也
  - page: 64
    col: 7
    role: j
    text: 王天下有三重焉其寡過矣乎
  - page: 64
    col: 8
    role: j
    text: 王去聲○吕氏曰三重謂議禮制度
  - page: 64
    col: 9
    role: z
    text: 考文惟天子得以行之則國不異政
  - page: 64
    col: 10
    role: z
    text: 家不殊俗而人得寡過矣
  - page: 64
    col: 11
    role: j
    text: 上焉者雖善無徵無徵不信不信民弗
  - page: 64
    col: 12
    role: j
    text: 從下焉者雖善不尊不尊不信不信民
  - page: 64
    col: 13
    role: j
    text: 弗從
  - page: 64
    col: 14
    role: z
    text: 上焉者謂時王以前如夏商之禮雖
  - page: 64
    col: 15
    role: z
    text: 善而皆不可考下焉者謂聖人在下
  - page: 64
    col: 16
    role: z
    text: 如孔子雖善於禮而不在尊位也
  - page: 65
    col: 1
    role: j
    text: 故君子之道本諸身徵諸庶民考諸三
  - page: 65
    col: 2
    role: j
    text: 王而不繆建諸天地而不悖質諸鬼神
  - page: 65
    col: 3
    role: j
    text: 而無疑百世以俟聖人而不惑
  - page: 65
    col: 4
    role: z
    text: 此君子指王天下者而言其道即議
  - page: 65
    col: 5
    role: z
    text: 禮制度考文之事也本諸身有其德
  - page: 65
    col: 6
    role: z
    text: 也徵諸庶民驗其所信從也建立也
  - page: 65
    col: 7
    role: z
    text: 立於此而參於彼也天地者道也鬼
  - page: 65
    col: 8
    role: z
    text: 神者造化之迹也百世以俟聖人而
  - page: 65
    col: 9
    role: z
    text: 不惑所謂聖人復起不易吾言者也
  - page: 65
    col: 10
    role: j
    text: 質諸鬼神而無疑知天也百世以俟聖
  - page: 65
    col: 11
    role: j
    text: 人而不惑知人也
  - page: 65
    col: 12
    role: z
    text: 知天知人知其理也
  - page: 65
    col: 13
    role: j
    text: 是故君子動而世為天下道行而世為
  - page: 65
    col: 14
    role: j
    text: 天下法言而世為天下則遠之則有望
  - page: 65
    col: 15
    role: j
    text: 近之則不厭
  - page: 65
    col: 16
    role: z
    text: 動兼言行而言道兼法則而言法法
  - page: 66
    col: 1
    role: z
    text: 度也則準則也
  - page: 66
    col: 2
    role: j
    text: 詩曰在彼無惡在此無射庶幾夙夜以
  - page: 66
    col: 3
    role: title
    text: 永終譽君子未有不如此而蚤有譽於
  - page: 66
    col: 4
    role: j
    text: 天下者也
  - page: 66
    col: 5
    role: z
    text: 惡去聲射音妬詩作斁○詩周頌振
  - page: 66
    col: 6
    role: z
    text: 鷺之篇射厭也所謂此者指本諸身
  - page: 66
    col: 7
    role: z
    text: 以下六事而言
  - page: 66
    col: 8
    role: z
    text: 右第二十九章
  - page: 66
    col: 9
    role: z
    text: 承上章居上不驕而言亦人道
  - page: 66
    col: 10
    role: z
    text: 也
  - page: 66
    col: 11
    role: j
    text: 仲尼祖述堯舜憲章文武上律天時下
  - page: 66
    col: 12
    role: j
    text: 襲水土
  - page: 66
    col: 13
    role: z
    text: 祖述者遠宗其道憲章者近守其法
  - page: 66
    col: 14
    role: z
    text: 律天時者法其自然之運襲水土者
  - page: 66
    col: 15
    role: z
    text: 因其一定之理皆兼内外該本末而
  - page: 66
    col: 16
    role: z
    text: 言也
  - page: 67
    col: 1
    role: j
    text: 辟如天地之無不持載無不覆幬辟如
  - page: 67
    col: 2
    role: j
    text: 四時之錯行如日月之代明
  - page: 67
    col: 3
    role: z
    text: 辟音譬幬徒報反○錯猶迭也此言
  - page: 67
    col: 4
    role: z
    text: 聖人之德
  - page: 67
    col: 5
    role: j
    text: 萬物並育而不相害道並行而不相悖
  - page: 67
    col: 6
    role: j
    text: 小德川流大德敦化此天地之所以爲
  - page: 67
    col: 7
    role: j
    text: 大也
  - page: 67
    col: 8
    role: z
    text: 悖猶背也天覆地載萬物並育於其
  - page: 67
    col: 9
    role: z
    text: 閒而不相害四時日月錯行代明而
  - page: 67
    col: 10
    role: z
    text: 不相悖所以不害不悖者小德之川
  - page: 67
    col: 11
    role: z
    text: 流所以並育並行者大德之敦化小
  - page: 67
    col: 12
    role: title
    text: 德者全體之分大德者萬殊之本川
  - page: 67
    col: 13
    role: title
    text: 流者如川之流脈絡分明而往不息
  - page: 67
    col: 14
    role: z
    text: 也敦化者敦厚其化根本盛大而出
  - page: 67
    col: 15
    role: z
    text: 無窮也此言天地之道以見上文取
  - page: 67
    col: 16
    role: z
    text: 辟之意也
  - page: 68
    col: 1
    role: z
    text: 右第三十章
  - page: 68
    col: 2
    role: z
    text: 言天道也
  - page: 68
    col: 3
    role: j
    text: 唯天下至聖爲能聰明睿知足以有臨
  - page: 68
    col: 4
    role: j
    text: 也寬裕溫柔足以有容也發強剛毅足
  - page: 68
    col: 5
    role: j
    text: 以有執也齊莊中正足以有敬也文理
  - page: 68
    col: 6
    role: j
    text: 密察足以有別也
  - page: 68
    col: 7
    role: z
    text: 知去聲齊側皆反別彼列反○聰明
  - page: 68
    col: 8
    role: z
    text: 睿知生知之質臨謂居上而臨下也
  - page: 68
    col: 9
    role: j
    text: 其下四者乃仁義禮知之德文文章
  - page: 68
    col: 10
    role: z
    text: 也理條理也密詳細也察明辨也
  - page: 68
    col: 11
    role: j
    text: 溥溥淵泉而時出之
  - page: 68
    col: 12
    role: z
    text: 溥溥周徧而廣闊也淵泉靜深而有
  - page: 68
    col: 13
    role: z
    text: 本也出發見也言五者之德充積於
  - page: 68
    col: 14
    role: z
    text: 中而以時發見於外也
  - page: 68
    col: 15
    role: j
    text: 溥溥如天淵泉如淵見而民莫不敬言
  - page: 68
    col: 16
    role: j
    text: 而民莫不信行而民莫不說
  - page: 69
    col: 1
    role: z
    text: 見音現說音悅。言其充積極其盛
  - page: 69
    col: 2
    role: z
    text: 而發見當其可也
  - page: 69
    col: 3
    role: j
    text: 是以聲名洋溢乎中國施及蠻貊舟車
  - page: 69
    col: 4
    role: title
    text: 所至人力所通天之所覆地之所載日
  - page: 69
    col: 5
    role: title
    text: 月所照霜露所隊凡有血氣者莫不尊
  - page: 69
    col: 6
    role: j
    text: 親故曰配天
  - page: 69
    col: 7
    role: z
    text: 施去聲隊音墜。舟車所至以下蓋
  - page: 69
    col: 8
    role: z
    text: 極言之配天言其德之所及廣大如
  - page: 69
    col: 9
    role: z
    text: 天也
  - page: 69
    col: 10
    role: z
    text: 右第三十一章
  - page: 69
    col: 11
    role: z
    text: 承上章而言小德之川流亦天
  - page: 69
    col: 12
    role: z
    text: 道也
  - page: 69
    col: 13
    role: j
    text: 唯天下至誠爲能經綸天下之大經立
  - page: 69
    col: 14
    role: j
    text: 天下之大本知天地之化育夫焉有所
  - page: 69
    col: 15
    role: j
    text: 倚
  - page: 69
    col: 16
    role: z
    text: 夫音扶焉於虔反。經綸皆治絲之
  - page: 70
    col: 1
    role: z
    text: 事經者理其緒而分之綸者比其類
  - page: 70
    col: 2
    role: z
    text: 而合之也經常也大經者五品之人
  - page: 70
    col: 3
    role: z
    text: 倫大本者所性之全體也惟聖人之
  - page: 70
    col: 4
    role: z
    text: 德極誠無妄故於人倫各盡其當然
  - page: 70
    col: 5
    role: z
    text: 之實而皆可以爲天下後世法所謂
  - page: 70
    col: 6
    role: z
    text: 經綸之也其於所性之全體無一毫
  - page: 70
    col: 7
    role: z
    text: 人欲之僞以雜之而天下之道千變
  - page: 70
    col: 8
    role: z
    text: 萬化皆由此出所謂立之也其於天
  - page: 70
    col: 9
    role: z
    text: 地之化育則亦其極誠無妄者有默
  - page: 70
    col: 10
    role: z
    text: 契焉非但聞見之知而已此皆至誠
  - page: 70
    col: 11
    role: z
    text: 無妄自然之功用夫豈有所倚著於
  - page: 70
    col: 12
    role: z
    text: 物而後能哉
  - page: 70
    col: 13
    role: j
    text: 肫肫其仁淵淵其淵浩浩其天
  - page: 70
    col: 14
    role: z
    text: 肫之純反○肫肫懇至貌以經綸而
  - page: 70
    col: 15
    role: z
    text: 言也淵淵靜深貌以立本而言也浩
  - page: 70
    col: 16
    role: title
    text: 浩廣大貌以知化而言也其淵其天
  - page: 71
    col: 1
    role: z
    text: 則非特如之而已
  - page: 71
    col: 2
    role: j
    text: 苟不固聰明聖知達天德者其孰能知
  - page: 71
    col: 3
    role: j
    text: 之
  - page: 71
    col: 4
    role: z
    text: 聖知之知去聲○固猶實也鄭氏曰
  - page: 71
    col: 5
    role: z
    text: 唯聖人能知聖人也
  - page: 71
    col: 6
    role: z
    text: 右第三十二章
  - page: 71
    col: 7
    role: z
    text: 承上章而言大德之敦化亦天
  - page: 71
    col: 8
    role: z
    text: 道也前章言至聖之德此章言
  - page: 71
    col: 9
    role: z
    text: 至誠之道然至誠之道非至聖
  - page: 71
    col: 10
    role: z
    text: 不能知至聖之德非至誠不能
  - page: 71
    col: 11
    role: z
    text: 爲則亦非二物矣此篇言聖人
  - page: 71
    col: 12
    role: z
    text: 天道之極致至此而無以加矣
  - page: 71
    col: 13
    role: j
    text: 詩曰衣錦尚絅惡其文之著也故君子
  - page: 71
    col: 14
    role: j
    text: 之道闇然而日章小人之道的然而日
  - page: 71
    col: 15
    role: j
    text: 亡君子之道淡而不厭簡而文溫而理
  - page: 71
    col: 16
    role: j
    text: 知遠之近知風之自知微之顯可與入
  - page: 72
    col: 1
    role: j
    text: 德矣
  - page: 72
    col: 2
    role: j
    text: 衣去聲絅口迥反惡去聲闇於感反
  - page: 72
    col: 3
    role: j
    text: ○前章言聖人之德極其盛矣此復
  - page: 72
    col: 4
    role: j
    text: 自下學立心之始言之而下文又推
  - page: 72
    col: 5
    role: j
    text: 之以至其極也詩國風衛碩人鄭之
  - page: 72
    col: 6
    role: j
    text: 丰皆作衣錦褧衣褧絅同禪衣也尚
  - page: 72
    col: 7
    role: j
    text: 加也古之學者爲己故其立心如此
  - page: 72
    col: 8
    role: j
    text: 尚絅故闇然衣錦故有日章之實淡
  - page: 72
    col: 9
    role: j
    text: 簡温絅之襲於外也不厭而文且理
  - page: 72
    col: 10
    role: j
    text: 焉錦之美在中也小人反是則暴於
  - page: 72
    col: 11
    role: j
    text: 外而無實以繼之是以的然而日亡
  - page: 72
    col: 12
    role: j
    text: 也遠之近見於彼者由於此也風之
  - page: 72
    col: 13
    role: j
    text: 自著乎外者本乎內也微之顯有諸
  - page: 72
    col: 14
    role: j
    text: 內者形諸外也有爲己之心而又知
  - page: 72
    col: 15
    role: j
    text: 此三者則知所謹而可入德矣故下
  - page: 72
    col: 16
    role: j
    text: 文引詩言謹獨之事
  - page: 73
    col: 1
    role: j
    text: 詩云潛雖伏矣亦孔之昭故君子内省
  - page: 73
    col: 2
    role: j
    text: 不疚無惡於志君子之所不可及者其
  - page: 73
    col: 3
    role: j
    text: 唯人之所不見乎
  - page: 73
    col: 4
    role: j
    text: 惡去聲○詩小雅正月之篇承上文
  - page: 73
    col: 5
    role: j
    text: 言莫見乎隱莫顯乎微也疚病也無
  - page: 73
    col: 6
    role: j
    text: 惡於志猶言無愧於心此君子謹獨
  - page: 73
    col: 7
    role: z
    text: 之事也
  - page: 73
    col: 8
    role: j
    text: 詩云相在爾室尚不愧于屋漏故君子
  - page: 73
    col: 9
    role: j
    text: 不動而敬不言而信
  - page: 73
    col: 10
    role: j
    text: 相去聲○詩大雅抑之篇相視也屋
  - page: 73
    col: 11
    role: j
    text: 漏室西北隅也承上文又言君子之
  - page: 73
    col: 12
    role: j
    text: 戒謹恐懼無時不然不待言動而後
  - page: 73
    col: 13
    role: j
    text: 敬信則其爲己之功益加宻矣故下
  - page: 73
    col: 14
    role: z
    text: 文引詩并言其效
  - page: 73
    col: 15
    role: j
    text: 詩曰奏假無言時靡有爭是故君子不
  - page: 73
    col: 16
    role: j
    text: 賞而民勸不怒而民威於鈇鉞
  - page: 74
    col: 1
    role: z
    text: 假格同鈇音夫。詩商頌烈祖之篇
  - page: 74
    col: 2
    role: z
    text: 奏進也承上文而遂及其效言進而
  - page: 74
    col: 3
    role: z
    text: 感格於神明之際極其誠敬無有言
  - page: 74
    col: 4
    role: z
    text: 說而人自化之也威畏也鈇莝斫刀
  - page: 74
    col: 5
    role: z
    text: 也鉞斧也
  - page: 74
    col: 6
    role: j
    text: 詩曰不顯惟德百辟其刑之是故君子
  - page: 74
    col: 7
    role: j
    text: 篤恭而天下平
  - page: 74
    col: 8
    role: z
    text: 詩周頌烈文之篇不顯說見二十六
  - page: 74
    col: 9
    role: z
    text: 章此借引以爲幽深玄遠之意承上
  - page: 74
    col: 10
    role: z
    text: 文言天子有不顯之德而諸侯法之
  - page: 74
    col: 11
    role: z
    text: 則其德愈深而效愈遠矣篤厚也篤
  - page: 74
    col: 12
    role: z
    text: 恭言不顯其敬也篤恭而天下平乃
  - page: 74
    col: 13
    role: z
    text: 聖人至德淵微自然之應中庸之極
  - page: 74
    col: 14
    role: z
    text: 功也
  - page: 74
    col: 15
    role: j
    text: 詩云予懷明德不大聲以色子曰聲色
  - page: 74
    col: 16
    role: j
    text: 之於以化民末也詩曰德輶如毛毛猶
  - page: 75
    col: 1
    role: j
    text: 有倫上天之載無聲無臭至矣
  - page: 75
    col: 2
    role: z
    text: 輶由酉二音○詩大雅皇矣之篇引
  - page: 75
    col: 3
    role: z
    text: 之以明上文所謂不顯之德者正以
  - page: 75
    col: 4
    role: z
    text: 其不大聲與色也又引孔子之言以
  - page: 75
    col: 5
    role: z
    text: 爲聲色乃化民之末務今但言不大
  - page: 75
    col: 6
    role: z
    text: 之而已則猶有聲色者存是未足以
  - page: 75
    col: 7
    role: z
    text: 形容不顯之妙不若烝民之詩所言
  - page: 75
    col: 8
    role: z
    text: 德輶如毛則庶乎可以形容矣而又
  - page: 75
    col: 9
    role: z
    text: 自以爲謂之毛則猶有可比者是亦
  - page: 75
    col: 10
    role: z
    text: 未盡其妙不若文王之詩所言上天
  - page: 75
    col: 11
    role: title
    text: 之事無聲無臭然後乃爲不顯之至
  - page: 75
    col: 12
    role: z
    text: 耳蓋聲臭有氣無形在物最爲微妙
  - page: 75
    col: 13
    role: z
    text: 而猶曰無之故唯此可以形容不顯
  - page: 75
    col: 14
    role: z
    text: 篤恭之妙非此德之外又別有是三
  - page: 75
    col: 15
    role: z
    text: 等然後爲至也
  - page: 75
    col: 16
    role: z
    text: 右第三十三章子思因前章極致
  - page: 76
    col: 1
    role: z
    text: 之言反求其本復自下學爲己謹
  - page: 76
    col: 2
    role: z
    text: 獨之事推而言之以馴致乎篤恭
  - page: 76
    col: 3
    role: z
    text: 而天下平之盛又賛其妙至於無
  - page: 76
    col: 4
    role: z
    text: 聲無臭而後已焉蓋舉一篇之要
  - page: 76
    col: 5
    role: z
    text: 而約言之其反復丁寧示人之意
  - page: 76
    col: 6
    role: z
    text: 至深切矣學者其可不盡心乎
  - page: 76
    col: 8
    role: j
    text: 中庸章句畢
  - page: 76
    col: 9
    role: j
    text: 補音釋
  - page: 76
    col: 10
    role: z
    text: 第十三章
  - page: 76
    col: 11
    role: z
    text: 言顧行行顧言
  - page: 76
    col: 12
    role: z
    text: 釋文行皆下孟反或讀如字
  - page: 76
    col: 13
    role: z
    text: 第二十章
  - page: 76
    col: 14
    role: z
    text: 注文跆躓也
  - page: 76
    col: 15
    role: z
    text: 躓音致與疐通礙不行也
  - page: 76
    col: 16
    role: z
    text: 第二十七章
