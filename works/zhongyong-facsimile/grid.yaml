labels:
  - page: 2
    col: 1
    role: j
    text: 中庸章句序
  - page: 2
    col: 2
    role: j
    text: 中庸何爲而作也子思憂道學之失
  - page: 2
    col: 3
    role: j
    text: 其傳而作也蓋自上古聖神繼天立極
  - page: 2
    col: 4
    role: j
    text: 而道統之傳有自來矣其見於經則允
  - page: 2
    col: 5
    role: j
    text: 執厥中者堯之所以授舜也人心惟危
  - page: 2
    col: 6
    role: j
    text: 道心惟微惟精惟一允執厥中者舜之
  - page: 2
    col: 7
    role: j
    text: 所以授禹也堯之一言至矣盡矣而舜
  - page: 2
    col: 8
    role: j
    text: 復益之以三言者則所以明夫堯之一
  - page: 3
    col: 1
    role: j
    text: 言必如是而后可庶幾也蓋嘗論之心
  - page: 3
    col: 2
    role: j
    text: 之虛靈知覺一而已矣而以為有人心
  - page: 3
    col: 3
    role: j
    text: 道心之異者則以其或生於形氣之私
  - page: 3
    col: 4
    role: j
    text: 或原於性命之正而所以為知覺者不
  - page: 3
    col: 5
    role: j
    text: 同是以或危殆而不安或微妙而難見
  - page: 3
    col: 6
    role: j
    text: 耳然人莫不有是形故雖上智不能無
  - page: 3
    col: 7
    role: j
    text: 人心亦莫不有是性故雖下愚不能無
  - page: 3
    col: 8
    role: j
    text: 道心二者雜於方寸之間而不知所以
  - page: 3
    col: 9
    role: j
    text: 治之則危者愈危微者愈微而天理之
  - page: 3
    col: 10
    role: j
    text: 公卒無以勝夫人欲之私矣精則察夫
  - page: 3
    col: 11
    role: j
    text: 二者之閒而不雜也一則守其本心之
  - page: 3
    col: 12
    role: j
    text: 正而不離也從事於斯無少閒斷必使
  - page: 3
    col: 13
    role: j
    text: 道心常為一身之主而人心每聽命焉
  - page: 3
    col: 14
    role: j
    text: 則危者安微者著而動靜云為自無過
  - page: 3
    col: 15
    role: j
    text: 不及之差矣夫堯舜禹天下之大聖也
  - page: 3
    col: 16
    role: j
    text: 以天下相傳天下之大事也以天下之
  - page: 4
    col: 1
    role: j
    text: 大聖行天下之大事而其授受之際丁
  - page: 4
    col: 2
    role: j
    text: 寧告戒不過如此則天下之理豈有以
  - page: 4
    col: 3
    role: j
    text: 加於此哉自是以來聖聖相承若成湯
  - page: 4
    col: 4
    role: j
    text: 文武之爲君臯陶伊傅周召之爲臣旣
  - page: 4
    col: 5
    role: j
    text: 皆以此而接夫道統之傳若吾夫子則
  - page: 4
    col: 6
    role: j
    text: 雖不得其位而所以繼徃聖開來學其
  - page: 4
    col: 7
    role: j
    text: 功反有賢於堯舜者然當是時見而知
  - page: 4
    col: 8
    role: j
    text: 之者惟顔氏曽氏之傳得其宗及曽氏
  - page: 4
    col: 9
    role: j
    text: 之再傳而復得夫子之孫子思則去聖
  - page: 4
    col: 10
    role: j
    text: 逺而異端起矣子思懼夫愈乆而愈失
  - page: 4
    col: 11
    role: j
    text: 其眞也於是推本堯舜以來相傳之意
  - page: 4
    col: 12
    role: j
    text: 質以平日所聞父師之言更互演繹作
  - page: 4
    col: 13
    role: j
    text: 爲此書以詔後之學者蓋其憂之也深
  - page: 4
    col: 14
    role: j
    text: 故其言之也切其慮之也逺故其說之
  - page: 4
    col: 15
    role: j
    text: 也詳其曰天命率性則道心之謂也其
  - page: 4
    col: 16
    role: j
    text: 曰擇善固執則精一之謂也其曰君子
  - page: 5
    col: 1
    role: j
    text: 時中則執中之謂也世之相後千有餘
  - page: 5
    col: 2
    role: j
    text: 年而其言之不異如合符節歷選前聖
  - page: 5
    col: 3
    role: j
    text: 之書所以提挈綱維開示緼奧未有若
  - page: 5
    col: 4
    role: j
    text: 是其明且盡者也自是而又再傳以得
  - page: 5
    col: 5
    role: j
    text: 孟氏爲能推明是書以承先聖之統及
  - page: 5
    col: 6
    role: j
    text: 其没而遂失其傳焉則吾道之所寄不
  - page: 5
    col: 7
    role: j
    text: 越乎言語文字之間而異端之說日新
  - page: 5
    col: 8
    role: j
    text: 月盛以至於老佛之徒出則彌近理而
  - page: 5
    col: 9
    role: j
    text: 大亂眞矣然而尚幸此書之不泯故程
  - page: 5
    col: 10
    role: j
    text: 夫子兄弟者出得有所考以續夫千載
  - page: 5
    col: 11
    role: j
    text: 不傳之緒得有所據以斥夫二家似是
  - page: 5
    col: 12
    role: j
    text: 之非蓋子思之功於是爲大而微程夫
  - page: 5
    col: 13
    role: j
    text: 子則亦莫能因其語而得其心也惜乎
  - page: 5
    col: 14
    role: j
    text: 其所以爲說者不傳而凡石氏之所輯
  - page: 5
    col: 15
    role: j
    text: 録僅出於其門人之所記是以大義雖
  - page: 5
    col: 16
    role: j
    text: 明而微言未析至其門人所自爲說則
  - page: 6
    col: 1
    role: j
    text: 雖頗詳盡而多所發明然倍其師說而
  - page: 6
    col: 2
    role: j
    text: 淫於老佛者亦有之矣熹自蚤歲即嘗
  - page: 6
    col: 3
    role: j
    text: 受讀而竊疑之沉潜反復蓋亦有年一
  - page: 6
    col: 4
    role: j
    text: 旦恍然似有以得其要領者然後乃敢
  - page: 6
    col: 5
    role: j
    text: 會衆說而折其中旣爲定著章句一篇
  - page: 6
    col: 6
    role: j
    text: 以竢後之君子而一二同志復取石氏
  - page: 6
    col: 7
    role: j
    text: 書刪其繁亂名以輯略且記所嘗論辯
  - page: 6
    col: 8
    role: j
    text: 取舎之意別爲或問以附其後然後此
  - page: 6
    col: 9
    role: j
    text: 書之旨支分節解脉絡貫通詳略相因
  - page: 6
    col: 10
    role: j
    text: 巨細畢舉而凡諸說之同異得失亦得
  - page: 6
    col: 11
    role: j
    text: 以曲暢旁通而各極其趣雖於道統之
  - page: 6
    col: 12
    role: j
    text: 傳不敢妄議然初學之士或有取焉則
  - page: 6
    col: 13
    role: j
    text: 亦庶乎行逺升髙之一助云爾淳熙己
  - page: 6
    col: 14
    role: j
    text: 酉春三月戊申新安朱熹序
  - page: 7
    col: 9
    role: j
    text: 中庸朱熹章句
  - page: 7
    col: 10
    role: z
    text: 中者不偏不倚無過不及之名庸
  - page: 7
    col: 11
    role: z
    text: 平常也
  - page: 7
    col: 12
    role: z
    text: 子程子曰不偏之謂中不易之謂庸
  - page: 7
    col: 13
    role: z
    text: 中者天下之正道庸者天下之定理
  - page: 7
    col: 14
    role: z
    text: 此篇乃孔門傳授心法子思恐其乆
  - page: 7
    col: 15
    role: z
    text: 而差也故筆之於書以授孟子其書
  - page: 7
    col: 16
    role: z
    text: 始言一理中散爲萬事末復合爲一
  - page: 8
    col: 1
    role: z
    text: 理放之則彌六合卷之則退藏於密
  - page: 8
    col: 2
    role: z
    text: 其味無窮皆實學也善讀者玩索而
  - page: 8
    col: 3
    role: z
    text: 有得焉則終身用之有不能盡者矣
  - page: 8
    col: 4
    role: j
    text: 天命之謂性率性之謂道脩道之謂教
  - page: 8
    col: 5
    role: z
    text: 命猶令也性即理也天以隂陽五行
  - page: 8
    col: 6
    role: z
    text: 化生萬物氣以成形而理亦賦焉猶
  - page: 8
    col: 7
    role: z
    text: 命令也於是人物之生因各得其所
  - page: 8
    col: 8
    role: z
    text: 賦之理以爲健順五常之德所謂性
  - page: 8
    col: 9
    role: z
    text: 也率循也道猶路也人物各循其性
  - page: 8
    col: 10
    role: z
    text: 之自然則其日用事物之閒莫不各
  - page: 8
    col: 11
    role: z
    text: 有當行之路是則所謂道也脩品節
  - page: 8
    col: 12
    role: z
    text: 之也性道雖同而氣禀或異故不能
  - page: 8
    col: 13
    role: z
    text: 無過不及之差聖人因人物之所當
  - page: 8
    col: 14
    role: z
    text: 行者而品節之以爲法於天下則謂
  - page: 8
    col: 15
    role: z
    text: 之教若禮樂刑政之屬是也蓋人之
  - page: 8
    col: 16
    role: z
    text: 所以爲人道之所以爲道聖人之所
  - page: 9
    col: 1
    role: z
    text: 以爲教原其所自無一不本於天而
  - page: 9
    col: 2
    role: z
    text: 備於我學者知之則其於學知所用
  - page: 9
    col: 3
    role: z
    text: 力而自不能已矣故子思於此首發
  - page: 9
    col: 4
    role: z
    text: 明之讀者所冝深體而黙識也
  - page: 9
    col: 5
    role: j
    text: 道也者不可須臾離也可離非道也是
  - page: 9
    col: 6
    role: j
    text: 故君子戒愼乎其所不睹恐懼乎其所
  - page: 9
    col: 7
    role: j
    text: 不聞
  - page: 9
    col: 8
    role: z
    text: 離去聲○道者日用事物當行之理
  - page: 9
    col: 9
    role: z
    text: 皆性之德而具於心無物不有無時
  - page: 9
    col: 10
    role: z
    text: 不然所以不可須臾離也若其可離
  - page: 9
    col: 11
    role: z
    text: 則爲外物而非道矣是以君子之心
  - page: 9
    col: 12
    role: z
    text: 常存敬畏雖不見聞亦不敢忽所以
  - page: 9
    col: 13
    role: z
    text: 存天理之本然而不使離於須臾之
  - page: 9
    col: 14
    role: z
    text: 頃也
  - page: 9
    col: 15
    role: j
    text: 莫見乎隱莫顯乎微故君子愼其獨也
  - page: 9
    col: 16
    role: z
    text: 見音現○隱暗處也微細事也獨者
  - page: 10
    col: 1
    role: z
    text: 人所不知而己所獨知之地也言幽
  - page: 10
    col: 2
    role: z
    text: 暗之中細微之事跡雖未形而幾則
  - page: 10
    col: 3
    role: z
    text: 已動人雖不知而己獨知之則是天
  - page: 10
    col: 4
    role: z
    text: 下之事無有著見明顯而過於此者
  - page: 10
    col: 5
    role: z
    text: 是以君子既常戒懼而於此尤加謹
  - page: 10
    col: 6
    role: z
    text: 焉所以遏人欲於將萌而不使其滋
  - page: 10
    col: 7
    role: z
    text: 長於隱微之中以至離道之遠也
  - page: 10
    col: 8
    role: j
    text: 喜怒哀樂之未發謂之中發而皆中節
  - page: 10
    col: 9
    role: j
    text: 謂之和中也者天下之大本也和也者
  - page: 10
    col: 10
    role: j
    text: 天下之達道也
  - page: 10
    col: 11
    role: z
    text: 樂音洛中節之中去聲○喜怒哀樂
  - page: 10
    col: 12
    role: z
    text: 情也其未發則性也無所偏倚故謂
  - page: 10
    col: 13
    role: z
    text: 之中發皆中節情之正也無所乖戾
  - page: 10
    col: 14
    role: z
    text: 故謂之和大本者天命之性天下之
  - page: 10
    col: 15
    role: z
    text: 理皆由此出道之體也達道者循性
  - page: 10
    col: 16
    role: z
    text: 之謂天下古今之所共由道之用也
  - page: 11
    col: 1
    role: z
    text: 此言性情之德以明道不可離之意
  - page: 11
    col: 2
    role: j
    text: 致中和天地位焉萬物育焉
  - page: 11
    col: 3
    role: z
    text: 致推而極之也位者安其所也育者
  - page: 11
    col: 4
    role: z
    text: 遂其生也自戒懼而約之以至於至
  - page: 11
    col: 5
    role: z
    text: 靜之中無少偏倚而其守不失則極
  - page: 11
    col: 6
    role: z
    text: 其中而天地位矣自謹獨而精之以
  - page: 11
    col: 7
    role: z
    text: 至於應物之處無少差謬而無適不
  - page: 11
    col: 8
    role: z
    text: 然則極其和而萬物育矣蓋天地萬
  - page: 11
    col: 9
    role: z
    text: 物本吾一體吾之心正則天地之心
  - page: 11
    col: 10
    role: z
    text: 亦正矣吾之氣順則天地之氣亦順
  - page: 11
    col: 11
    role: z
    text: 矣故其效驗至於如此此學問之極
  - page: 11
    col: 12
    role: z
    text: 功聖人之能事初非有待於外而脩
  - page: 11
    col: 13
    role: z
    text: 道之教亦在其中矣是其一體一用
  - page: 11
    col: 14
    role: z
    text: 雖有動靜之殊然必其體立而後用
  - page: 11
    col: 15
    role: z
    text: 有以行則其實亦非有兩事也故於
  - page: 11
    col: 16
    role: title
    text: 此合而言之以結上文之意
  - page: 12
    col: 1
    role: title
    text: 右第一章子思述所傳之意以立
  - page: 12
    col: 2
    role: z
    text: 言首明道之本原出於天而不可
  - page: 12
    col: 3
    role: z
    text: 易其實體備於己而不可離次言
  - page: 12
    col: 4
    role: z
    text: 存養省察之要終言聖神功化之
  - page: 12
    col: 5
    role: z
    text: 極蓋欲學者於此反求諸身而自
  - page: 12
    col: 6
    role: z
    text: 得之以去夫外誘之私而充其本
  - page: 12
    col: 7
    role: z
    text: 然之善楊氏所謂一篇之體要是
  - page: 12
    col: 8
    role: z
    text: 也其下十章蓋子思引夫子之言
  - page: 12
    col: 9
    role: z
    text: 以終此章之義
  - page: 12
    col: 10
    role: j
    text: 仲尼曰君子中庸小人反中庸
  - page: 12
    col: 11
    role: z
    text: 中庸者不偏不倚無過不及而平常
  - page: 12
    col: 12
    role: z
    text: 之理乃天命所當然精微之極致也
  - page: 12
    col: 13
    role: z
    text: 唯君子為能體之小人反是
  - page: 12
    col: 14
    role: j
    text: 君子之中庸也君子而時中小人之中
  - page: 12
    col: 15
    role: j
    text: 庸也小人而無忌憚也
  - page: 12
    col: 16
    role: z
    text: 王肅本作小人之反中庸也程子亦
  - page: 13
    col: 1
    role: j
    text: 以為然今從之○君子之所以為中
  - page: 13
    col: 2
    role: j
    text: 庸者以其有君子之德而又能隨時
  - page: 13
    col: 3
    role: j
    text: 以處中也小人之所以反中庸者以
  - page: 13
    col: 4
    role: j
    text: 其有小人之心而又無所忌憚也蓋
  - page: 13
    col: 5
    role: j
    text: 中無定體隨時而在是乃平常之理
  - page: 13
    col: 6
    role: j
    text: 也君子知其在我故能戒謹不睹恐
  - page: 13
    col: 7
    role: j
    text: 懼不聞而無時不中小人不知有此
  - page: 13
    col: 8
    role: title
    text: 則肆欲妄行而無所忌憚矣
  - page: 13
    col: 9
    role: z
    text: 右第二章
  - page: 13
    col: 10
    role: z
    text: 此下十章皆論中庸以釋首章
  - page: 13
    col: 11
    role: z
    text: 之義文雖不屬而意實相承也
  - page: 13
    col: 12
    role: z
    text: 變和言庸者游氏曰以性情言
  - page: 13
    col: 13
    role: z
    text: 之則曰中和以德行言之則曰
  - page: 13
    col: 14
    role: z
    text: 中庸是也然中庸之中實兼中
  - page: 13
    col: 15
    role: z
    text: 和之義
  - page: 13
    col: 16
    role: j
    text: 子曰中庸其至矣乎民鮮能久矣
  - page: 14
    col: 1
    role: z
    text: 鮮上聲下同○過則失中不及則未
  - page: 14
    col: 2
    role: z
    text: 至故惟中庸之德爲至然亦人所同
  - page: 14
    col: 3
    role: z
    text: 得初無難事但世教衰民不興行故
  - page: 14
    col: 4
    role: title
    text: 鮮能之今已允耳論語無能字
  - page: 14
    col: 5
    role: z
    text: 右第三章
  - page: 14
    col: 6
    role: j
    text: 子曰道之不行也我知之矣知者過之
  - page: 14
    col: 7
    role: j
    text: 愚者不及也道之不明也我知之矣賢
  - page: 14
    col: 8
    role: j
    text: 者過之不肖者不及也
  - page: 14
    col: 9
    role: z
    text: 知者之知去聲○道者天理之當然
  - page: 14
    col: 10
    role: z
    text: 中而已矣知愚賢不肖之過不及則
  - page: 14
    col: 11
    role: z
    text: 生禀之異而失其中也知者知之過
  - page: 14
    col: 12
    role: z
    text: 既以道爲不足行愚者不及知又不
  - page: 14
    col: 13
    role: z
    text: 知所以行此道之所以常不行也賢
  - page: 14
    col: 14
    role: z
    text: 者行之過既以道爲不足知不肖者
  - page: 14
    col: 15
    role: z
    text: 不及行又不求所以知此道之所以
  - page: 14
    col: 16
    role: z
    text: 常不明也
  - page: 15
    col: 1
    role: j
    text: 人莫不飲食也鮮能知味也
  - page: 15
    col: 2
    role: title
    text: 道不可離人自不察是以有過不及
  - page: 15
    col: 3
    role: z
    text: 之弊
  - page: 15
    col: 4
    role: z
    text: 右第四章
  - page: 15
    col: 5
    role: j
    text: 子曰道其不行矣夫
  - page: 15
    col: 6
    role: title
    text: 夫音扶○由不明故不行
  - page: 15
    col: 7
    role: z
    text: 右第五章
  - page: 15
    col: 8
    role: z
    text: 此章承上章而舉其不行之端
  - page: 15
    col: 9
    role: z
    text: 以起下章之意
  - page: 15
    col: 10
    role: j
    text: 子曰舜其大知也與舜好問而好察邇
  - page: 15
    col: 11
    role: j
    text: 言隱惡而揚善執其兩端用其中於民
  - page: 15
    col: 12
    role: j
    text: 其斯以爲舜乎
  - page: 15
    col: 13
    role: z
    text: 知去聲與平聲好去聲○舜之所以
  - page: 15
    col: 14
    role: z
    text: 爲大知者以其不自用而取諸人也
  - page: 15
    col: 15
    role: z
    text: 邇言者淺近之言猶必察焉其無遺
  - page: 15
    col: 16
    role: z
    text: 善可知然於其言之未善者則隱而
  - page: 16
    col: 1
    role: z
    text: 不宣其善者則播不匿其廣大光
  - page: 16
    col: 2
    role: z
    text: 明又如此則人孰不樂告以善哉两
  - page: 16
    col: 3
    role: z
    text: 端謂衆論不同之極致蓋凡物皆有
  - page: 16
    col: 4
    role: z
    text: 两端如小大厚薄之類於善之中又
  - page: 16
    col: 5
    role: z
    text: 執其两端而量度以取中然後用之
  - page: 16
    col: 6
    role: z
    text: 則其擇之審而行之至矣然非在我
  - page: 16
    col: 7
    role: z
    text: 之權度精切不差何以與此此知之
  - page: 16
    col: 8
    role: title
    text: 所以無過不及而道之所以行也
  - page: 16
    col: 9
    role: z
    text: 右第六章
  - page: 16
    col: 10
    role: j
    text: 子曰人皆曰予知驅而納諸罟擭陷阱
  - page: 16
    col: 11
    role: j
    text: 之中而莫之知辟也人皆曰予知擇乎
  - page: 16
    col: 12
    role: j
    text: 中庸而不能期月守也
  - page: 16
    col: 13
    role: z
    text: 予知之知去聲罟音古擭胡化反阱
  - page: 16
    col: 14
    role: z
    text: 才性反辟避同期居之反○罟網也
  - page: 16
    col: 15
    role: z
    text: 擭機檻也陷阱坑坎也皆所以揜取
  - page: 16
    col: 16
    role: z
    text: 禽獸者也擇乎中庸辨別衆理以求
  - page: 17
    col: 1
    role: j
    text: 所謂中庸即上章好問用中之事也
  - page: 17
    col: 2
    role: z
    text: 期月匝一月也言知禍而不知辟以
  - page: 17
    col: 3
    role: title
    text: 況能擇而不能守皆不得爲知也
  - page: 17
    col: 4
    role: z
    text: 右第七章
  - page: 17
    col: 5
    role: z
    text: 承上章大知而言又舉不明之
  - page: 17
    col: 6
    role: z
    text: 端以起下章也
  - page: 17
    col: 7
    role: j
    text: 子曰回之爲人也擇乎中庸得一善則
  - page: 17
    col: 8
    role: j
    text: 拳拳服膺而弗失之矣
  - page: 17
    col: 9
    role: z
    text: 回孔子弟子顔淵名拳拳奉持之貌
  - page: 17
    col: 10
    role: z
    text: 服猶著也膺胷也奉持而著之心胷
  - page: 17
    col: 11
    role: z
    text: 之閒言能守也顔子蓋眞知之故能
  - page: 17
    col: 12
    role: title
    text: 擇能守如此此行之所以無過不及
  - page: 17
    col: 13
    role: title
    text: 而道之所以明也
  - page: 17
    col: 14
    role: z
    text: 右第八章
  - page: 17
    col: 15
    role: j
    text: 子曰天下國家可均也爵祿可辭也白
  - page: 17
    col: 16
    role: j
    text: 刃可蹈也中庸不可能也
  - page: 18
    col: 1
    role: j
    text: 均平治也三者亦知仁勇之事天下
  - page: 18
    col: 2
    role: j
    text: 之至難也然不必其合於中庸則質
  - page: 18
    col: 3
    role: j
    text: 之近似者皆能以力為之若中庸則
  - page: 18
    col: 4
    role: j
    text: 雖不必皆如三者之難然非義精仁
  - page: 18
    col: 5
    role: j
    text: 熟而無一毫人欲之私者不能及也
  - page: 18
    col: 6
    role: title
    text: 三者難而中庸易而難此民之所
  - page: 18
    col: 7
    role: z
    text: 以鮮能也
  - page: 18
    col: 8
    role: z
    text: 右第九章
  - page: 18
    col: 9
    role: z
    text: 亦承上章以起下章
  - page: 18
    col: 10
    role: j
    text: 子路問強
  - page: 18
    col: 11
    role: j
    text: 子路孔子弟子仲由也子路好勇故
  - page: 18
    col: 12
    role: z
    text: 問強
  - page: 18
    col: 13
    role: j
    text: 子曰南方之強與北方之強與抑而強
  - page: 18
    col: 14
    role: j
    text: 與
  - page: 18
    col: 15
    role: z
    text: 與平聲○抑語辭而汝也
  - page: 18
    col: 16
    role: j
    text: 寬柔以教不報無道南方之強也君子
  - page: 19
    col: 1
    role: j
    text: 居之
  - page: 19
    col: 2
    role: z
    text: 寛柔以教謂含容巽順以誨人之不
  - page: 19
    col: 3
    role: z
    text: 及也不報無道謂橫逆之來直受之
  - page: 19
    col: 4
    role: z
    text: 而不報也南方風氣柔弱故以含忍
  - page: 19
    col: 5
    role: z
    text: 之力勝人爲強君子之道也
  - page: 19
    col: 6
    role: j
    text: 衽金革死而不厭北方之強也而強者
  - page: 19
    col: 7
    role: j
    text: 居之
  - page: 19
    col: 8
    role: z
    text: 衽席也金戈兵之屬革甲胄之屬北
  - page: 19
    col: 9
    role: z
    text: 方風氣剛勁故以果敢之力勝人爲
  - page: 19
    col: 10
    role: z
    text: 強強者之事也
  - page: 19
    col: 11
    role: j
    text: 故君子和而不流強哉矯中立而不倚
  - page: 19
    col: 12
    role: j
    text: 強哉矯國有道不變塞焉強哉矯國無
  - page: 19
    col: 13
    role: j
    text: 道至死不變強哉矯
  - page: 19
    col: 14
    role: z
    text: 此四者汝之所當強也矯強貌詩曰
  - page: 19
    col: 15
    role: z
    text: 矯矯虎臣是也倚偏著也塞未達也
  - page: 19
    col: 16
    role: z
    text: 國有道不變未達之所守國無道不
  - page: 20
    col: 1
    role: z
    text: 變平生之所守也此則所謂中庸之
  - page: 20
    col: 2
    role: z
    text: 不可能者非有以自勝其人欲之私
  - page: 20
    col: 3
    role: z
    text: 不能擇而守也君子之強孰大於是
  - page: 20
    col: 4
    role: z
    text: 夫子以是告子路者所以抑其血氣
  - page: 20
    col: 5
    role: title
    text: 之剛而進之以德義之勇也
  - page: 20
    col: 6
    role: z
    text: 右第十章
  - page: 20
    col: 7
    role: j
    text: 子曰素隱行恠後世有述焉吾弗為之
  - page: 20
    col: 8
    role: j
    text: 矣
  - page: 20
    col: 9
    role: z
    text: 素按漢書當作索蓋字之誤也索隱
  - page: 20
    col: 10
    role: z
    text: 行恠言深求隱僻之理而過為詭異
  - page: 20
    col: 11
    role: z
    text: 之行也然以其足以欺世而盜名故
  - page: 20
    col: 12
    role: z
    text: 後世或有稱述之者此知之過而不
  - page: 20
    col: 13
    role: z
    text: 擇乎善行之過而不用其中不當強
  - page: 20
    col: 14
    role: z
    text: 而強者也聖人豈為之哉
  - page: 20
    col: 15
    role: j
    text: 君子遵道而行半塗而廢吾弗能已矣
  - page: 20
    col: 16
    role: z
    text: 遵道而行則能擇乎善矣半塗而廢
  - page: 21
    col: 1
    role: z
    text: 則力之不足也此其知雖足以及之
  - page: 21
    col: 2
    role: z
    text: 而行有不逮當強而不強者也已止
  - page: 21
    col: 3
    role: z
    text: 也聖人於此非勉焉而不敢廢蓋至
  - page: 21
    col: 4
    role: j
    text: 誠無息自有所不能止也
  - page: 21
    col: 5
    role: j
    text: 君子依乎中庸遯世不見知而不悔唯
  - page: 21
    col: 6
    role: j
    text: 聖者能之
  - page: 21
    col: 7
    role: z
    text: 不爲索隱行恠則依乎中庸而已不
  - page: 21
    col: 8
    role: z
    text: 能半塗而廢是以遯世不見知而不
  - page: 21
    col: 9
    role: z
    text: 悔也此中庸之成德知之盡仁之至
  - page: 21
    col: 10
    role: z
    text: 不頼勇而裕如者正吾夫子之事而
  - page: 21
    col: 11
    role: title
    text: 猶不自居也故曰唯聖者能之而已
  - page: 21
    col: 12
    role: z
    text: 右第十一章
  - page: 21
    col: 13
    role: z
    text: 子思所引夫子之言以明首章
  - page: 21
    col: 14
    role: z
    text: 之義者止此蓋此篇大旨以知
  - page: 21
    col: 15
    role: z
    text: 仁勇三逹德爲入道之門故於
  - page: 21
    col: 16
    role: z
    text: 篇首即以大舜顏淵子路之事
  - page: 22
    col: 1
    role: z
    text: 明之舜知也顔淵仁也子路勇
  - page: 22
    col: 2
    role: z
    text: 也三者廢其一則無以造道而
  - page: 22
    col: 3
    role: z
    text: 成德矣餘見第二十章
  - page: 22
    col: 4
    role: j
    text: 君子之道費而隱
  - page: 22
    col: 5
    role: z
    text: 費符味反○費用之廣也隱體之微
  - page: 22
    col: 6
    role: z
    text: 也
  - page: 22
    col: 7
    role: j
    text: 夫婦之愚可以與知焉及其至也雖聖
  - page: 22
    col: 8
    role: j
    text: 人亦有所不知焉夫婦之不肖可以能
  - page: 22
    col: 9
    role: j
    text: 行焉及其至也雖聖人亦有所不能焉
  - page: 22
    col: 10
    role: j
    text: 天地之大也人猶有所憾故君子語大
  - page: 22
    col: 11
    role: j
    text: 天下莫能載焉語小天下莫能破焉
  - page: 22
    col: 12
    role: z
    text: 與去聲○君子之道近自夫婦居室
  - page: 22
    col: 13
    role: z
    text: 之閒遠而至於聖人天地之所不能
  - page: 22
    col: 14
    role: z
    text: 盡其大無外其小無內可謂費矣然
  - page: 22
    col: 15
    role: z
    text: 其理之所以然則隱而莫之見也蓋
  - page: 22
    col: 16
    role: z
    text: 可知可能者道中之一事及其至而
  - page: 23
    col: 1
    role: j
    text: 聖人不知不能則舉全體而言聖人
  - page: 23
    col: 2
    role: j
    text: 固有所不能盡也侯氏曰聖人所不
  - page: 23
    col: 3
    role: j
    text: 知如孔子問禮問官之類所不能如
  - page: 23
    col: 4
    role: j
    text: 孔子不得位堯舜病博施之類愚謂
  - page: 23
    col: 5
    role: z
    text: 人所憾於天地如覆載生成之偏及
  - page: 23
    col: 6
    role: z
    text: 寒暑灾祥之不得其正者
  - page: 23
    col: 7
    role: j
    text: 詩云鳶飛戾天魚躍于淵言其上下察
  - page: 23
    col: 8
    role: j
    text: 也
  - page: 23
    col: 9
    role: z
    text: 鳶余專反○詩大雅旱麓之篇鳶鴟
  - page: 23
    col: 10
    role: z
    text: 類戾至也察著也子思引此詩以明
  - page: 23
    col: 11
    role: z
    text: 化育流行上下昭著莫非此理之用
  - page: 23
    col: 12
    role: z
    text: 所謂費也然其所以然者則非見聞
  - page: 23
    col: 13
    role: z
    text: 所及所謂隱也故程子曰此一節子
  - page: 23
    col: 14
    role: z
    text: 思喫緊爲人處活潑潑地讀者其致
  - page: 23
    col: 15
    role: z
    text: 思焉
  - page: 23
    col: 16
    role: title
    text: 君子之道造端乎夫婦及其至也察乎
  - page: 24
    col: 1
    role: j
    text: 天地
  - page: 24
    col: 2
    role: z
    text: 結上文
  - page: 24
    col: 3
    role: z
    text: 右第十二章子思之言蓋以申明
  - page: 24
    col: 4
    role: z
    text: 首章道不可離之意也其下八章
  - page: 24
    col: 5
    role: z
    text: 雜引孔子之言以明之
  - page: 24
    col: 6
    role: j
    text: 子曰道不遠人人之為道而遠人不可
  - page: 24
    col: 7
    role: j
    text: 以為道
  - page: 24
    col: 8
    role: z
    text: 道者率性而已固衆人之所能知能
  - page: 24
    col: 9
    role: z
    text: 行者也故常不遠於人若為道者厭
  - page: 24
    col: 10
    role: z
    text: 其卑近以為不足為而反務為高遠
  - page: 24
    col: 11
    role: z
    text: 難行之事則非所以為道矣
  - page: 24
    col: 12
    role: j
    text: 詩云伐柯伐柯其則不遠執柯以伐柯
  - page: 24
    col: 13
    role: j
    text: 睨而視之猶以為遠故君子以人治人
  - page: 24
    col: 14
    role: j
    text: 改而止
  - page: 24
    col: 15
    role: z
    text: 睨研計反○詩豳風伐柯之篇柯斧
  - page: 24
    col: 16
    role: z
    text: 柄則法也睨邪視也言人執柯伐木
  - page: 25
    col: 1
    role: z
    text: 以爲柯者彼柯長短之法在此柯耳
  - page: 25
    col: 2
    role: z
    text: 然猶有彼此之別故伐者視之猶以
  - page: 25
    col: 3
    role: z
    text: 爲遠也若以人治人則所以爲人之
  - page: 25
    col: 4
    role: z
    text: 道各在當人之身初無彼此之別故
  - page: 25
    col: 5
    role: z
    text: 君子之治人也即以其人之道還治
  - page: 25
    col: 6
    role: z
    text: 其人之身其人能改即止不治蓋責
  - page: 25
    col: 7
    role: z
    text: 之以其所能知能行非欲其遠人以
  - page: 25
    col: 8
    role: z
    text: 爲道也張子所謂以衆人望人則易
  - page: 25
    col: 9
    role: z
    text: 從是也
  - page: 25
    col: 10
    role: j
    text: 忠恕違道不遠施諸己而不願亦勿施
  - page: 25
    col: 11
    role: j
    text: 於人
  - page: 25
    col: 12
    role: z
    text: 盡己之心爲忠推己及人爲恕違去
  - page: 25
    col: 13
    role: z
    text: 也如春秋傳齊師違穀七里之違言
  - page: 25
    col: 14
    role: z
    text: 自此至彼相去不遠非背而去之之
  - page: 25
    col: 15
    role: z
    text: 謂也道即其不遠人者是也施諸己
  - page: 25
    col: 16
    role: z
    text: 而不願亦勿施於人忠恕之事也以
  - page: 26
    col: 1
    role: z
    text: 己之心度人之心未嘗不同則道之
  - page: 26
    col: 2
    role: z
    text: 不遠於人者可見故己之所不欲則
  - page: 26
    col: 3
    role: z
    text: 勿以施之於人亦不遠人以爲道之
  - page: 26
    col: 4
    role: z
    text: 事張子所謂以愛己之心愛人則盡
  - page: 26
    col: 5
    role: z
    text: 仁是也
  - page: 26
    col: 6
    role: j
    text: 君子之道四丘未能一焉所求乎子以
  - page: 26
    col: 7
    role: j
    text: 事父未能也所求乎臣以事君未能也
  - page: 26
    col: 8
    role: j
    text: 所求乎弟以事兄未能也所求乎朋友
  - page: 26
    col: 9
    role: j
    text: 先施之未能也庸德之行庸言之謹有
  - page: 26
    col: 10
    role: j
    text: 所不足不敢不勉有餘不敢盡言顧行
  - page: 26
    col: 11
    role: j
    text: 行顧言君子胡不慥慥爾
  - page: 26
    col: 12
    role: z
    text: 子臣弟友四字絶句○求猶責也道
  - page: 26
    col: 13
    role: z
    text: 不遠人凡己之所以責人者皆道之
  - page: 26
    col: 14
    role: z
    text: 所當然也故反之以自責而自脩焉
  - page: 26
    col: 15
    role: z
    text: 庸平常也行者踐其實謹者擇其可
  - page: 26
    col: 16
    role: z
    text: 德不足而勉則行益力言有餘而訒
  - page: 27
    col: 1
    role: z
    text: 則謹益至謹之至則言顧行矣行之
  - page: 27
    col: 2
    role: z
    text: 力則行顧言矣慥慥篤實貌言君子
  - page: 27
    col: 3
    role: z
    text: 之言行如此豈不慥慥乎贊美之也
  - page: 27
    col: 4
    role: title
    text: 凡此皆不遠人以爲道之事張子所
  - page: 27
    col: 5
    role: title
    text: 謂以責人之心責己則盡道是也
  - page: 27
    col: 6
    role: z
    text: 右第十三章
  - page: 27
    col: 7
    role: z
    text: 道不遠人者夫婦所能丘未能
  - page: 27
    col: 8
    role: z
    text: 一者聖人所不能皆費也而其
  - page: 27
    col: 9
    role: z
    text: 所以然者則至隱存焉下章放
  - page: 27
    col: 10
    role: z
    text: 此
  - page: 27
    col: 11
    role: j
    text: 君子素其位而行不願乎其外
  - page: 27
    col: 12
    role: z
    text: 素猶見在也言君子但因見在所居
  - page: 27
    col: 13
    role: z
    text: 之位而爲其所當爲無慕乎其外之
  - page: 27
    col: 14
    role: z
    text: 心也
  - page: 27
    col: 15
    role: j
    text: 素富貴行乎富貴素貧賤行乎貧賤素
  - page: 27
    col: 16
    role: j
    text: 夷狄行乎夷狄素患難行乎患難君子
  - page: 28
    col: 1
    role: j
    text: 無入而不自得焉
  - page: 28
    col: 2
    role: z
    text: 難去聲○此言素其位而行也
  - page: 28
    col: 3
    role: j
    text: 在上位不陵下在下位不援上正己而
  - page: 28
    col: 4
    role: j
    text: 不求於人則無怨上不怨天下不尤人
  - page: 28
    col: 5
    role: z
    text: 援平聲○此言不願乎其外也
  - page: 28
    col: 6
    role: j
    text: 故君子居易以俟命小人行險以徼幸
  - page: 28
    col: 7
    role: z
    text: 易去聲○易平地也居易素位而行
  - page: 28
    col: 8
    role: z
    text: 也俟命不願乎外也徼求也幸謂所
  - page: 28
    col: 9
    role: z
    text: 不當得而得者
  - page: 28
    col: 10
    role: j
    text: 子曰射有似乎君子失諸正鵠反求諸
  - page: 28
    col: 11
    role: j
    text: 其身
  - page: 28
    col: 12
    role: z
