  - page: 29
    col: 13
    role: title
    text: 矣子思引詩及此語以明行遠自邇
  - page: 29
    col: 14
    role: z
    text: 登高自卑之意
  - page: 29
    col: 15
    role: z
    text: 右第十五章
  - page: 29
    col: 16
    role: j
    text: 子曰鬼神之爲德其盛矣乎
  - page: 30
    col: 1
    role: j
    text: 程子曰鬼神天地之功用而造化之
  - page: 30
    col: 2
    role: j
    text: 迹也張子曰鬼神者二氣之良能也
  - page: 30
    col: 3
    role: j
    text: 愚謂以二氣言則鬼者陰之靈也神
  - page: 30
    col: 4
    role: j
    text: 者陽之靈也以一氣言則至而伸者
  - page: 30
    col: 5
    role: j
    text: 爲神反而歸者爲鬼其實一物而巳
  - page: 30
    col: 6
    role: z
    text: 爲德猶言性情功效
  - page: 30
    col: 7
    role: j
    text: 視之而弗見聽之而弗聞體物而不可
  - page: 30
    col: 8
    role: j
    text: 遺
  - page: 30
    col: 9
    role: j
    text: 鬼神無形與聲然物之終始莫非陰
  - page: 30
    col: 10
    role: j
    text: 陽合散之所爲是其爲物之體而物
  - page: 30
    col: 11
    role: j
