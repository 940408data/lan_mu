aboutHtml: |-
  <h2>關於這卷</h2>
    <p>《般若波羅蜜多心經》，唐貞觀二十三年（649）玄奘三藏譯於終南山翠微宮，全文二百六十字，為般若部之心髓，漢地傳誦最廣之佛經。</p>
    <h3>復刻取捨</h3>
    <p>本卷以蘭木手卷引擎重排：經題一列居首，經文依文意斷句、參差成行，凡二十七列，短者四字（不增不減、真實不虛）、長者十四字，行氣隨經義起伏。字距 28、行距 46，墨色按「蘸墨—行筆—墨盡」的節奏逐字微調濃淡。無夾注。</p>
    <p>點綴取蘭木意度：卷首折枝一支、拖尾補蘭一叢，卷中兩處自天頭地腳淡淡探入一葉；引首鈐「觀自在」朱文印，拖尾鈐「心無罣礙」朱文印與「般若」白文印。皆極淡，遠觀若無，近察方見。</p>
    <h3>三體</h3>
    <p><b>宋體</b>近刊本，字口清勁；<b>寫經體</b>取楷法，如唐人寫經，最合此卷本色；<b>行楷</b>筆勢流走。三體共用同一版心格律，行數字數不變。若你的系統未裝相應中文字體，會自動退回可用的最近字體。</p>
