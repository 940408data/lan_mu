# 經題居首，經文依文意斷句、參差成行（界格由 glyphMarks 確定性生成，不寫 marks）
sections:
  - id: title
    name: 經題
    columns:
      - line: 1
        class: title
        text: 般若波羅蜜多心經
  - id: text
    name: 經文
    columns:
      - line: 2
        text: 觀自在菩薩行深般若波羅蜜多時
      - line: 3
        text: 照見五蘊皆空度一切苦厄
      - line: 4
        text: 舍利子色不異空空不異色
      - line: 5
        text: 色即是空空即是色
      - line: 6
        text: 受想行識亦復如是
      - line: 7
        text: 舍利子是諸法空相
      - line: 8
        text: 不生不滅不垢不淨
      - line: 9
        text: 不增不減
      - line: 10
        text: 是故空中無色無受想行識
      - line: 11
        text: 無眼耳鼻舌身意無色聲香味觸法
      - line: 12
        text: 無眼界乃至無意識界
      - line: 13
        text: 無無明亦無無明盡
      - line: 14
        text: 乃至無老死亦無老死盡
      - line: 15
        text: 無苦集滅道無智亦無得
      - line: 16
        text: 以無所得故菩提薩埵
      - line: 17
        text: 依般若波羅蜜多故心無罣礙
      - line: 18
        text: 無罣礙故無有恐怖
      - line: 19
        text: 遠離顛倒夢想究竟涅槃
      - line: 20
        text: 三世諸佛依般若波羅蜜多故
      - line: 21
        text: 得阿耨多羅三藐三菩提
      - line: 22
        text: 故知般若波羅蜜多是大神咒
      - line: 23
        text: 是大明咒是無上咒
      - line: 24
        text: 是無等等咒能除一切苦
      - line: 25
        text: 真實不虛
      - line: 26
        text: 故說般若波羅蜜多咒即說咒曰
      - line: 27
        text: 揭諦揭諦波羅揭諦
      - line: 28
        text: 波羅僧揭諦菩提薩婆訶
