# 遵生八箋 卷十四 燕閒清賞箋：點校中導覽（teaser）
# 原文據識典古籍四庫全書本，標點自施；導語/解讀為 AI 原創
sections:
  - id: yanxian
    name: 燕閒清賞箋
    blocks:
      - type: j
        text: 燕閒清賞箋
      - type: z
        text: 導：此箋論清賞之趣：稽古好古，鐘鼎劍舄、琴書畫帖，皆所以養性悅心。薦語：心無馳獵之勞、好古敏求。
      - type: j
        text: 高子曰：心無馳獵之勞，身無牽臂之役，避俗逃名，順時安處，世稱曰閒。而閒者，匪徒尸居肉食，無所事事之謂。
      - type: z
        text: 讀：先破「閒」之誤解：閒非無所事事；使閒而博奕樗，又豈君子所貴。
      - type: j
        text: 余嗜閒，雅好古。稽古之學，唐虞之訓；好古敏求，宣尼之教也。
      - type: z
        text: 讀：「嗜閒」「好古」四字，是一箋綱領：古器清賞之學，皆自此心出。
