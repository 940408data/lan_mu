# 禮記正義卷13（孔穎達疏）：j 為經文＋鄭玄注，z 為疏文。
sections:
  - id: juan13
    name: 正文
    blocks:
      - { type: j, text: "司徒脩六禮以節民性，明七教以興民德，齊八政以防淫，一道德以同俗，養耆老以致孝，恤孤獨以逮不足，上賢以崇德，簡不肖以絀惡。司徒，地官卿，掌邦教者。逮，及也。簡，差擇也。○防，本又作坊，音同。恤，辛律反。逮音代，又大計反。肖音笑。絀，敕律反。命鄉簡不帥教者以告。帥，循也。不循教，謂敖很不孝弟者，司徒使鄉簡擇以告者，鄉屬司徒。○帥音率。循音巡。敖，本又作傲，同五報反。很，胡墾反。弟，大計反，本又作悌。耆老皆朝於庠，元日習射上功，習鄉上齒。大司徒帥國之俊士與執事焉。將習禮以化之，使之觀焉。耆老，致仕及鄉中老賢者。朝猶會也。此庠，謂鄉學也。鄉，謂飲酒也。鄉禮，春秋射，國蠟，而飲酒養老。○朝，直遙反。庠音祥。與音預。蠟，仕詐反。不變，命國之右鄉，簡不帥教者移之左。命國之左鄉，簡不帥教者移之右，如初禮。中年考校，而又不變，使轉徙其居，覬其見新人，有所化也。亦複習禮於鄉學，使之觀焉。○覬音冀。復，扶又反，下“又復”、“復移”、“復與”同。不變，移之郊，如初禮。郊，鄉界之外者也。稍出遠之，後中年又為之習禮於郊學。○為，於偽反，下“又為”、“親為”、“為其大”、“亦為”皆同。不變，移之遂，如初禮。遠郊之外曰遂，遂大夫掌之。又中年復移之使居遂，又為習禮於遂之學。不變，屏之遠方，終身不齒。遠方，九州之外。齒猶錄也。命鄉論秀士，升之司徒，曰選士。移居於司徒也。秀士，鄉大夫所考，有德行道藝者。○選，宣戀反，下皆同。行，下孟反。司徒論選士之秀者而升之學，曰俊士。可使習禮者。學，大學。升於司徒者不徵於鄉，升於學者不徵於司徒，曰造士。不徵，不給其繇役。造，成也。能習禮，則為成士。○給音急。徭，本又作繇，音遙。樂正崇四術，立四教。樂正，樂官之長，掌國子之教。《虞書》曰：“夔，命汝典樂，教胄子。”崇，高也。高尚其術，以作教也。幼者教之於小學，長者教之於大學。《尚書傳》曰：“年十五始入小學，十八入大學。”○樂音嶽。長，丁丈反，下同。夔，求龜反。命女音汝。順先王《詩》、《書》、《禮》、《樂》以造士。順此四術，而教以成是士也。春秋教以《禮》、《樂》，冬夏教以《詩》、《書》。春夏，陽也。《詩》、《樂》者聲，聲亦陽也。秋冬，陰也。《書》、《禮》者，事事亦陰也。互言之者，皆以其術相成。○夏，戶嫁反，注及下注“夏官”同。王大子、王子、群后之大子，卿大夫、元士之適子，國之俊選，皆造焉。皆以四術成之。王子，王之庶子也。群后，公及諸侯。○適，丁歷反，下注同。造，才早反，徐七到反。凡入學以齒。皆以長幼受學，不用尊卑。將出學，小胥、大胥、小樂正簡不帥教者，以告於大樂正，大樂正以告於王。此所簡者，謂王大子、王子、群后之大子，卿大夫、元士之適子。大胥、小胥，皆樂官屬也。出學，謂九年大成學止也。○胥，息餘反，又息呂反，下同。王命三公、九卿、大夫、元士皆入學。不變，王親視學。亦謂使習禮以化之。不變，王又親為之臨視，重棄賢者子孫。此習禮皆於大學也。不變，王三日不舉。去食樂，重棄人。○去，丘呂反。屏之遠方，西方曰棘，東方曰寄，終身不齒。棘當為僰。僰之言逼，使之逼寄於夷戎。不屏於南北，為其大遠。○屏，必郢反。棘，依注音僰，又作{棘火}，蒲北反，偪也。偪，彼力反。大音太，舊他佐反。大樂正論造士之秀者，以告於王，而升諸司馬，曰進士。移名於司馬。司馬，夏官卿，掌邦政者。進士，可進受爵祿也。" }
      - { type: z, text: "“司徒”至“進士”。○正義曰：此一節論司徒脩禮明教，上賢絀惡，教學升進之事，各隨文解之。○“脩六禮以節民性”者，六禮謂冠一、昏二、喪三、祭四、鄉五、相見六。性，稟性自然，剛柔輕重遲速之屬，恐其失中，故以六禮而節其性也。○“明七教以興民德”者，七教即父子一、兄弟二、夫婦三、君臣四、長幼五、朋友六、賓客七也。德者，得也。恐人不得其所，故以七教以興舉其民，使之皆得其所也。此六禮七教，並是殷禮，周則五禮十二教也。“齊八政以防淫”者，八政一曰飲食，二曰衣服，三曰事為，四曰異別，五曰度，六曰量，七曰數，八曰制。淫謂過奢侈，故以八政禁令之事以防淫。淫過之失，貴賤同有，故不雲民淫。○“一道德以同俗”者，道，履蹈而行，謂齊一所行之道，以同國之風俗。敬養耆老，所以致恭孝之心；哀恤孤獨，所以逮及不足，謂以恩惠遂及之，不足，則孤獨者也。尊上賢人，所以崇獎有德；簡去不肖，所以絀退惡人。從“司徒”以下至“升諸司馬，曰進士”，皆是司徒所掌教之事，既雲上賢崇德，簡不肖絀惡，總之於此。從命鄉簡不帥教者，至終身不齒，論絀惡之事，謂鄉人入學，不帥師教，屏退絀除也。自“命鄉論”至“曰造士”，論崇德之事，謂鄉人入學，德業有成，升名進於司徒。又鄉人所學，須有經術。自“樂正崇四術”至“《詩》、《書》”，明所習業之事。非惟鄉人所教如此，王子公卿之子亦當須教，其不肖者亦當退之。自“王大子”以下至“終身不齒”，論教王子等屏退之事。但鄉人既卑，節級升之，故為選士、俊士，至於造士。若王子與公卿之子，本位既尊，不須積漸，學業既成，即為造士。於是大樂正之官，總論鄉人造士，及王子等造士，以告於王，升諸司馬，故云“大樂正論造士之秀者，以告於王，而升諸司馬，曰進士”，是總包鄉人及王子及公卿之子學業成者。○注“帥循”至“司徒”。○正義曰：“帥，循也”，《爾雅·釋詁》文。雲“鄉屬司徒”者，六鄉大夫，皆司徒統領，《周禮》鄉皆屬地官，是鄉屬司徒也。○“耆老”至“事焉”。○司徒命此鄉學，簡擇不帥教者，以告司徒，司徒乃命鄉內耆老皆聚會於鄉學之庠，乃擇善日於鄉學內，為此不帥教之人，習其射禮，中者在上，故云上功。又於鄉學習此鄉飲酒之禮，令老者居上，故云上齒。欲使不帥教之人觀其上功，自勵為功；觀其上齒，則知尊敬長老。大司徒帥領國之英俊之士，與在鄉射飲酒執行事焉。使俊士與之以為榮，惡者慕之而自勵。此言國之俊士，則非惟鄉內之人。○注“耆老”至“養老”。○正義曰：總言耆老，其數則眾，故知致仕及鄉中老賢致仕，則《書傳略說》雲“大夫為父師，士為少師”是也。鄉中老賢，謂鄉人不仕，年老有德行者，故《鄉飲酒》雲：“以告於先生君子可也。”注云：“先生，鄉中致仕者。君子，國中有盛德者。”雲“朝猶會也”者，恐有朝王之嫌，故云“朝猶會也”。雲“此庠謂鄉學也”者，以習射上功，在州學；習鄉上齒，在黨學，恐此是州黨之學，故云“庠，鄉學也”。謂初時耆老聚會於庠學，乃擇元日，就州學習射，就黨學上齒，習射習鄉，各在一處，則不得同日也。雲“鄉謂飲酒也”者，言經中習鄉謂飲酒者，此鄉既有上齒之文，故知謂鄉飲酒也。雲“鄉禮春秋射”者，按《州長職》雲“春秋而射於州序”。然則射在州序，而云鄉射禮者，州屬於鄉，雖在州序，亦得謂之鄉。或可鄉居此州，更不立州學。若州之有事，則就鄉學，是鄉學得為射也。雲“鄉禮春秋射”者，解習射之處也。雲“國蠟，而飲酒養老”者，周之十二月，國家蜡祭之時，黨正鄉飲酒而養老。按《黨正》雲：“國索鬼神而祭祀，則以禮屬民，而飲酒於序，以正齒位。”知此經習鄉，非正月鄉學飲酒者，以鄉學飲酒無正齒位之事。此雲上齒，按《黨正職》雲：“壹命齒於鄉里，再命齒於父族，三命而不齒。”又《禮記·鄉飲酒義》雲：“六十者坐，五十者立侍。”故解此鄉為黨正飲酒。謂之鄉者，黨，鄉之屬，故云鄉也。或鄉之所居之黨，不別立黨學，黨之正齒位，就鄉學為之，亦謂之飲酒。○注“中年”至“觀焉”。○正義曰：按《學記》“一年視離經辨志，三年視敬業樂群，五年視博習親師，七年視論學取友，謂之小成。九年知類通達”。上雲命鄉簡不帥教者，謂初入學一年之終，簡不帥教敖很之人，為之習射習鄉。此注云“中年考校，而又不變”，中猶間也，謂間一年而考校之。時不變者，右鄉者移左，左鄉者移右。下雲“不變，移之郊”者，謂五年之時，更簡不帥教者，故注云“中年又為之習禮”，間四年之下一年也。下雲“不變，移之遂”者，謂七年之時，故注云“又中年移之遂”，間六年之下一年也。下雲“不變，屏之遠方”者，謂九年之時。鄭注不雲間年者，以九年限極，不須雲間年也。雲“亦複習禮於鄉學”者，習禮謂習射上功，習鄉上齒，故經雲“如初”。○注“郊鄉”至“郊學”。○正義曰：此郊謂近郊也。以遠郊之內，六鄉居之。若鄉民近國城，及國內之人，其學在國中，或在公宮之右。或在公宮之左，故前雲右鄉。若鄉人遠國城，在近郊之外者，則學在近郊，其習禮亦鄉大夫臨之。○注“遠郊”至“之學”。○正義曰：按《司馬法》曰：“百里郊，二百里野。”《遂人》雲：“掌邦之野。”既二百里為野，遂之所居，故知遠郊之外。雲“遂大夫掌之”者，謂遂大夫掌所職二百里中也。且此不帥教者，移之在遂，不應鄉大夫臨之，故亦遂大夫掌之。遂大夫亦帥國之俊選，於遂學而行禮也。但六鄉州學主射，黨學主正齒位，遂則縣與州同，鄙與黨同。未知縣正主射、鄙師主正齒位以否，亦應與鄉不異，但《周禮》不備耳。但縣鄙皆屬於遂，雖各立學，總曰遂學。或遂之所居縣鄙，不立縣鄙之學，有事則在遂學與鄉同。○注“遠方”至“錄也”。○正義曰：九州之外，於周，則夷鎮蕃也。蓋隨罪之輕重，而為遠近之差。若王子公卿之子，雖屏夷狄，但居夷狄之內畔，故下注雲“不屏於南北，為其大遠”，明鄉人則屏於南北也。“齒猶錄也”者，按《文王世子》雲“古者謂年齡，齒亦齡也”，以年相次，是錄其長幼，故云“齒猶錄也“。○注“移名”至“藝者”。○正義曰：大司徒之官，命鄉大夫論量考校此鄉學之人，有秀異之士者，升於司徒，先名惟在鄉，今移名於司徒，謂錄名進在司徒，其身猶在鄉學。雲“秀士，鄉大夫所考，有德行道藝者”，謂鄉大夫考此鄉學之人有德行道藝者。德行謂孝友之徒，道藝謂多才藝。此惟升名司徒，未即貢舉入官也。按《鄉大夫》雲“三年則大比，考其德行道藝，而興賢者能者”，謂鄉人有能有賢者，以鄉飲酒之禮興之，獻賢能之書於王，名則升於天府，身則任以官爵，則下文雲“大樂正論造士之秀者，以告於王，而升諸司馬，曰進士”。彼據鄉人，故三年一舉，此據學者，故中年考試，殷、周同也。熊氏以為此中年舉者為殷禮，鄉大夫三年舉者周法，其義非也。○注“可使”至“大學”。○正義曰：按《內則》雲：“二十而冠，始學禮。”此升於大學曰俊士之人，年以二十，故可使習禮。雲“學大學”者，按《尚書》周傳雲：“王子公卿大夫元士之適子，十三入小學，二十入大學。”又《書傳略說》：“餘子十五入小學，十八入大學。”其鄉人當與餘子同，故知二十習禮之時在大學也。此升於學者，謂身升於大學，非惟升名而巳。○注“不徵”至“成士”。○正義曰：徵謂力役，故云“不給繇役”。此繇役者，供學及司徒細碎之繇役也。上文“命鄉論秀士，升之司徒，曰選士”者，雖升名司徒，猶給鄉之繇役，以藝業未成。次雲“司徒論選士之秀者而升之學，曰俊士”者，身雖升學，亦以學未成，猶給司徒繇役。若其學業既成，免其繇役。定本雲“升之學”，無“大”字，升諸司徒，則不徵於鄉，升之於學，則不徵於司徒，皆免其繇役者，是為造成之士。雲“能習禮則為成士”者，以二十習禮，禮以立身，故為成士。然習禮必年二十，按《書傳》適子二十入大學，餘子十八入大學。然則升名司徒，未入大學，已能習禮。為造士者，二十習禮，舉其大網。若其性識聰明，則亦早能習之。○注“樂正”至“大學”。○正義曰：樂正掌國子之教者，按《周禮·大司樂》“掌成均之法，以教國子”。引《虞書》“命汝典樂，教胄子”者，證以樂官教胄子之義。孔注《尚書》雲：“胄，長也。”謂王子公卿大夫元士之子。雲“高尚其術，以作教也”者，謂樂正之官，當光揚尊崇此四術以為教，謂敷暢義理，贊明旨趣，使學者知之。引“《尚書傳》曰”以下，《書傳略說》文。“順先王《詩》、《書》、《禮》、《樂》以造士”，樂正之官，依順此古昔先王之道，則《詩》、《書》、《禮》、《樂》”之等，教之造成此士術者，是道路之名。《詩》、《書》、《禮》、《樂》，是先王之道路謂之術。○注“春夏”至“相成”。○正義曰：鄭以經雲“春秋教以《禮》、《樂》”，則秋教《禮》，春教《樂》。“冬夏教以《詩》、《書》”，則冬教《書》，夏教《詩》，故云“春夏，陽也。《詩》、《樂》者聲，聲亦陽也”。所以《詩》得為聲者，《詩》是樂章，《詩》之文義，以樂聲播之，故為聲。若以聲對舞，則聲為安靜，舞為鼓動，舞為陽，聲為陰，故《大胥》雲“春，釋採合舞；秋，頒學合聲”是也。就舞之中，奮動甚者屬陽，奮動靜者屬陰，故《文王世子》雲“春夏學干戈，秋冬學羽籥”是也。雲“秋冬，陰也。《書》、《禮》者事，事亦陰也”者，《書》者言事之經，《禮》者行事之法，事為安靜，故云“《書》、《禮》者事，事亦陰也”。《文王世子》雲：“秋學《禮》，冬讀《書》。”與此同也。雲“互言之者，皆以其術相成”者，若不互言，當雲春夏教以《樂》、《詩》，秋冬教以《禮》、《書》，則是春夏但教以《樂》、《詩》，不教《禮》、《書》；秋冬但教以《禮》、《書》，不教以《樂》、《詩》。言其四術不可暫時而闕，今交互言之，雲春教《樂》，明兼有《禮》；秋教《禮》，兼有《樂》。夏教《詩》，兼有《書》；冬教《書》，兼有《詩》，故云“皆以其術相成”，但遂其陰陽以為偏主耳。○注“皆以”至“諸侯”。正義曰：“皆以四術成之”，解經“皆造焉”，謂王太子公卿大夫元士之子、國之俊選，皆以四術造焉。雲“王子，王之庶子也”者，以經雲“王太子”，乃雲王子，故知是庶子也。雲“群后，公及諸侯”者，以經“群后”之下，即雲卿大夫士，無諸侯之文，故知群后之中，是三公及諸侯也。○注“皆以長幼受學”。○正義曰：“長幼受學，雖王大子亦然，故《文王世子》雲：“將君我，而與我齒讓，何也？”是其事也。○注“此所”至“上也”。○正義曰：“此所簡者，謂王大子以下”者，承上鄉之學下，恐所簡兼有鄉人，故明之也。雲“大胥、小胥皆樂官屬也”者，按《周禮》“大司樂中大夫二人”，“大胥中士四人，小胥下士八人”，皆屬大司樂，故云“樂官屬也”。雲“出學，謂九年大成學止也”者，以上文鄉人中年考校，恐此亦中年，故明之也。知九年者，以下即雲“王親視學，不變，王三日不舉”，無移左鄉右鄉及移郊遂之事，故知是九年學止也。○注“習禮皆於大學也”。○正義曰：若殷人習禮在於大學，即《明堂位》雲：“瞽宗殷學。”《文王世子》雲：“禮在瞽宗，殷之大學也。”若周則大學曰東膠，瞽宗不得為周之大學也。故鄭注《儀禮·鄉射》雲：“周立四代之學於國，而又以有虞氏之庠為鄉學。”則周之尋常習禮於殷學之中，至九年為王子不變，其習禮當於東膠大學。然則餘子十八入太學，嫡子二十入太學者，皆是殷法也。若周法立當代大學在公宮左，太學即東膠也。又立小學於西郊，小學即有虞氏之庠，其習《書》於虞氏之學，習《禮》、《樂》於殷之學，習舞於夏后氏之學，故《文王世子》雲“春夏學干戈，秋冬學羽籥，皆於東序”，“春誦夏弦，大師詔之瞽宗”。又云“《禮》在瞽宗，《書》在上庠”，《詩》則無文，鄭注云“弦謂以絲播《詩》”，則習《詩》亦在瞽宗。然《詩》與《禮》、《樂》雖各在其學習之，至二十入大學之時，仍於大學之中兼習四術，故此注云“習禮皆於大學”，是周之大學亦習禮也。禮既在瞽宗，又在大學，則其餘亦可知也。○注“棘當”至“太遠”。○正義曰：“僰之言偪”者，按《漢書》雲西南有僰，夷知非彼夷而讀為偪者，以與寄文相對。寄非東方夷名，是寄旅之意，則僰亦非西方夷名，故以為逼迫於夷狄也。雲“不屏於南北，為其大遠”者，按《漢書·地理志》雲“南北萬三千里，東西九千里”，又《帝王世紀》“南北萬三千三百六十八里，東西九千三百二里”。漢地既然，則古亦應爾，皆南北長，東西短，故鄭此注云“不屏於南北，為其大遠”。○“大樂”至“進士”。○此大樂正之官論造士之中最秀異者，以告於王而升名於司馬論之，曰進士，言進受爵祿也，此文承王子公卿大夫之子，下似專據王子等，其實鄉人入學為造士者，亦同於此。其鄉人不在學者及邦國所貢之士，所貢於王，亦當升諸司馬，以司馬掌爵祿。故有司士屬焉。其職雲“以德詔爵，以功詔祿”，即知凡入仕者，皆司馬主之。下文更不見鄉人及邦國所貢之士，故知此中兼之，但文不具耳。" }
      - { type: j, text: "司馬辨論官材，辨其論，官其材，觀其所長。○其論如字，舊力困反。論進士之賢者，以告於王，而定其論。各署其所長。論定，然後官之。使之試守。任官，然後爵之。命之。○任，而金反，下注同。位定，然後祿之。大夫廢其事，終身不仕，死以士禮葬之。以不任大夫也。有發，則命大司徒教士以車甲。乘兵車衣甲之儀。有發，謂有軍師發卒。○衣，於既反。卒，子忽反。凡執技論力，適四方，臝股肱，決射御。謂擐衣出其臂脛，使之射御，決勝負，見勇力。○技，其綺反，本或伎，後同。臝，本又作臝，力果反。肱，古弘反。擐，舊音患，今讀宜，音宣；依字作扌爵，《字林》雲“扌爵，扌爵臂也，先全反。”脛，胡定反。見，賢遍反。凡執技以事上者，祝、史、射、御、醫、卜及百工。言技謂此七者。凡執技以事上者，不貳事，不移官，欲專其事，亦為不德。出鄉不與士齒。賤也。於其鄉中則齒，親親也。仕於家者，出鄉不與士齒。亦賤。" }
      - { type: z, text: "“司馬”至“士齒”。○正義曰：此一節主論司馬之官用其人，及發兵論射御，及居官黜退之事。司馬辨論官材，大樂正論造士之秀者，以告於王，王必以樂正所論之狀，授與司馬，司馬得此所論之狀，乃更論辨之，觀其材能高下，知其堪任何官，是準擬其官以其材，故云“官材也”。○“論進士之賢者”，謂司馬辨論之後，不堪者屏退，論量進士賢者以告於王，告王之時，而正定其論，各署其所長。若長於禮者，署擬於禮官。長於樂者，署擬於樂官。論定然後官之者，謂既論擬定，然後試之以所能之官。○“任官然後爵之”者，謂堪任此官，然後爵命之。○“位定然後祿之”者，謂既受爵命，使有職位，然後與之以祿。○注“以不任大夫也”。○正義曰：以經雲“大夫廢其事”，故知不堪任大夫也。致仕而退，死得以大夫禮葬，故《論語注》雲“大夫退，死，葬以士禮。致仕，以大夫禮葬”是也。○“有發”至“車甲”，有發謂國有軍旅，以發士卒，是司馬之事，王則命大司徒教此士卒以車甲之事，謂教以乘兵車及衣甲之儀容。必司徒者，以司徒主眾，又主教，故與司馬相參也。○注“有發”至“發卒”。○正義曰：知發是發卒者，以經雲“教士以車甲”，故知發謂軍師發卒也。○“凡執”至“士齒”。○執技之事，凡有三條：上條論課試武夫技藝之事；中條論執技之人，並射御之外祝史醫卜之等；下條論執技之人，不得更為二事，以其賤，故出鄉不與士齒。○“凡執技論力，適四方，臝股肱，決射御”者，言此既無道藝，惟論力以事上，故適往四方境界之外，則使之擐露臂脛，角材力，決射御勝負，見勇武。○注“言技謂此七者”。正義曰：七者謂祝一、史二、射三、御四、醫五、卜六、百工七。射御前經以顯，此重雲者，上論所試之時，此論與祝、史、醫、卜並列見其色目。○注“欲專其事，亦為不德”。○正義曰：“所以不貳事，不移官”者，欲使專一其所有之事，非但欲使專事，亦為技藝賤薄，不是道德之事，故不許之。" }
      - { type: j, text: "司寇正刑明闢，以聽獄訟。司寇，秋官卿，掌刑者。闢，罪也。○闢，婢亦反，注同。必三刺，以求民情，斷其獄訟之中：一曰訊群臣，二曰訊群吏，三曰訊萬民。○制，七智反，殺也。斷，丁亂反，下“制斷”、“斷計”同。中如字，又丁仲反。有旨無簡，不聽。簡，誠也。有其意，無其誠者，不論以為罪。。附從輕，附，施刑也。求出之使從輕。赦從重。雖是罪可重，猶赦之。凡制五刑，必即天論，制，斷也。即，就也。必即天論，言與天意合。閔子曰：“古之道不即人心。”即或為則，論或為倫。○論音倫，理也，注同。郵罰麗於事。郵，過也。麗，附也。過人、罰人，當各附於其事，不可假他以喜怒。○郵音尢，俗作郵。麗，郎計反。當，丁郎反。假，古雅反。凡聽五刑之訟，必原父子之親，立君臣之義，以權之。權，平也。意論輕重之序，慎測淺深之量，以別之。意，思念也。淺深，謂俱有罪，本心有善惡。○量，徐音亮，後皆同。別，彼列反。悉其聰明，致其忠愛，以盡之。盡其情。疑獄，汜與眾共之。眾疑，赦之。必察小大之比以成之。小大猶輕重，巳行故事曰比。○汜，本又作汎，孚劍反。比，必利反，注同，例也。成獄辭，史以獄成告於正，正聽之。史，司寇吏也。正，於周鄉師之屬，今漢有平正丞，秦所置。○平，彼命反。正以獄成告於大司寇，大司寇聽之棘木之下。《周禮》鄉師之屬，“辨其獄訟，異其死刑之罪而要之，職聽於朝。司寇聽之”。朝，王之外朝也。左九棘，孤卿大夫位焉。右九棘，公、侯、伯、子、男位焉。面三槐，三公位焉。○棘，紀力反。要之，於妙反，謂要最，舊一遙反。槐，回、懷二音。大司寇以獄之成告於王，王命三公參聽之。王使三公復與司寇及正共平之，重刑也。《周禮》：王欲免之，乃命公會其期。三公以獄之成告於王，王三又，然後制刑。又當作宥。宥，寬也。一宥曰不識，再宥曰過失，三宥曰遺忘。○又，義作宥。忘音妄。凡作刑罰，輕無赦。法雖輕，不赦之，為人易犯。○為，於偽反。易，以豉反，後“易犯”同。刑者侀也，侀者成也。一成而不可變，故君子盡心焉。變，更也。侀音刑。析言破律，亂名改作，執左道以亂政，殺。析言破律，巧賣法令者也。亂名改作，謂變易官與物之名，更造法度。左道，若巫蠱及俗禁。○析，思歷反。亂名如字，王肅作循名。巧，起教反，又如字。蠱音古。作淫聲、異服、奇技、奇器以疑眾，殺。淫聲，鄭、衛之屬也。異服，若聚鷸冠、瓊弁也。奇技、奇器，若公輪般請以機窆。○鷸，伊必反，徐音述。弁，皮戀反。般，百間反。行偽而堅，言偽而辯，學非而博，順非而澤以疑眾，殺。皆謂虛華捷給無誠者也。○行，下孟反。華，戶瓜反，又如字。假於鬼神、時日、卜筮以疑眾，殺。今時持喪葬、築蓋、嫁取、卜數文書，使民倍禮違制。○日，入一反。此四誅者，不以聽。為其為害大，而辭不可明。凡執禁以齊眾，不赦過。亦為人將易犯。有圭璧金璋，不粥於市。命服命車，不粥於市。宗廟之器，不粥於市。犧牲，不粥於市。戎器，不粥於市。尊物，非民所宜有。戎器，軍器也。粥，賣也。○璋，之羊反。用器不中度，不粥於市。兵車不中度，不粥於市。布帛精粗不中數，幅廣狹不中量，不粥於市。奸色亂正色，不粥於市。凡以其不可用也。用器，弓矢、耒耜、飲食器也。度，丈尺也。數，升縷多少。中，丁仲反，下皆同。幅，方服反。耒耜，上力對反；下音似。錦文珠玉成器，不粥於市。衣服飲食，不粥於市。不示民以奢與貪也。成猶善也。五穀不時，果實未孰，不粥於市。物未成，不利人。木不中伐，不粥於市。伐之非時，不中用。《周禮》：“仲冬斬陽木，仲夏斬陰木。”○夏，戶嫁反，下“春夏”同。禽獸魚鱉不中殺，不粥於市。殺之非時，不中用。《月令》：“季冬始漁。”《周禮》：“春獻鱉蜃。”○蜃，常忍反，雉化為之。關執禁以譏，禁異服，識異言。關，竟上門。譏，呵察。○竟者境。苛音何，又呼河反，本亦成呵。" }
      - { type: z, text: "“司寇”至“異言”。○正義曰：此一節總明論司寇聽訟刑罰禁止之事，各隨文解之。從此至“赦從重”，論司寇正刑明闢之法。○“正刑明闢”者，謂司寇當正定刑書，明斷罪法，使刑不差二，法不傾邪，以聽天下獄訟。○“必三刺”者，言正刑明闢聽訟之時，刑法宜慎，不可專制，故必須三刺以求民情。“有旨無簡，不聽”，求民情，既得其所犯之罪，雖有旨意，無誠實之狀，則不聽之，不論以為罪也。○“附從輕”者，附謂施刑，施刑之時，此人所犯之罪在輕重之間；可輕可重，則當求可輕之刑而附之，則罪疑惟輕是也。○“赦從重”者，謂所犯之罪，本非意故為，而入重罪。今放赦之時，從重罪之上而赦之，其意輕故也。即《尚書》雲“眚災肆赦”是也。○注“一曰”至“萬民”。○正義曰：按《周禮·司刺》雲：“壹刺曰訊群臣，再刺曰訊群吏，三刺曰訊萬民。”刺，殺也。謂欲殺犯罪之人，其一問可殺與否於群臣，群臣謂公卿大夫士；其二問可殺與否於群吏，群吏謂庶人在官者，其三問可殺與否於庶人，庶人謂萬姓眾來觀者。此三刺雖以殺為本，其被刑不殺者，亦當問之。○注“簡誠”至“為罪”。○正義曰：旨，意也。簡，誠也。言犯罪者，雖有其意而無誠實者，則不論之以為罪也。○注“雖是罪可重，猶赦之”。○正義曰：此赦從重，與上附從輕，皆是從重入輕。所以再見其文者，附從輕，謂施刑從輕；赦從重，謂放赦從重，所以異也。○“凡制”至“於事”。○此一條論造制五刑，須合天意輕重；施於刑罰，必附本情。○“必即天論”者，即，就也。論謂論議。言制五刑之時，必就上天之意論議輕重。天意好生，又有時以生，有時以殺，言論議刑時，亦當好生，又就天道，使生殺得中。論或為倫，倫，理也，謂就天之倫理，即是好生及好殺得中之理，故鄭雲“言與天意合”。○“郵罰麗於事”者，郵，過也，謂斷人所過。罰謂責罰其身。麗，附也。言斷其罪過，及責罰其身，皆依附於所犯之事，不可離其本事，假他別事而為喜怒也。○注“制斷”至“為倫”。○正義曰：經雲“制五刑”，必論古人造制五刑。下雲“必即天論”及“郵罰麗於事”，皆論斷罪之法，故以製為斷，非言初制五刑。制是裁製，故為斷也。引閔子曰“古之道不即人心”者，證經即為即就之義。按宣元年《公羊傳》雲：“古者臣有大喪，則君三年不呼其門。已練可以弁冕，服金革之事，君使之，非也。臣行之，禮也。閔子要絰而服事，既而曰：若此乎？古之道不即人心。退而致仕。孔子蓋善之也。”閔子性孝，以為在喪從戎，不即人情為制此禮，是古之所制，故閔子嫌之。言論或為倫者，諸本或有作倫者，故云“或為倫”也。○“凡聽”至“成之”。○原，本也。權，平也。凡犯罪之人，或子為父隱，臣為國諱。雖觸刑禁，而非其本惡，故聽訟者，本其宿情，立其恩義，為平量之恕而免放。“意論輕重之序”者，意謂思念也。聽訟者，以盡意思念，論量罪之輕重次序，不有越濫也。○“慎測淺深之量以別之”者，謂謹慎測度罪人意之善惡淺深之量以別之，謂分別善惡，使不相亂。○“悉其聰明，致其忠愛，以盡之”者，謂聽獄之人，盡悉已之聰明，尋其事之根本，又致其忠恕仁愛，不使嚴酷枉濫，以盡犯罪人情，不有抑屈。○“疑獄，汜與眾共之”者，疑獄，謂事可疑難斷者也。氾，廣也。巳若疑彼罪，而不能斷決當廣與眾庶共論決之也。“眾疑，赦之”者，若眾人疑惑，則當放赦之，故《書》雲：“與其殺不辜，寧失不經。”○“必察小大之比以成之”者，小大猶輕重也。比，例也。巳行故事曰比。此言雖疑而赦之，不可直爾而放，當必察按舊法輕重之例，以成於事。○“成獄”至“制刑”。○“成獄辭”者，謂獄吏初責核罪人之辭，已成定也。“史以獄成告於正”者，史，司寇吏也。正，獄之正也。吏以成辭告於正也。○“正聽之”者，正得吏告罪成之辭，而又聽察也。○“正以獄成告於大司寇”者，正聽已竟，又列獄成之辭，告於大司寇也。○“大司寇聽之棘木之下”者，大司寇得正之告，而又聽察於棘木之下，謂王之外朝也。○“大司寇聽獄之成告於王”者，大司寇與公卿在朝槐棘之下，聽獄訟成，以告於王也。○“王命三公參聽之”，王既得司寇之告成辭，而刑辟不可米犖，故王又命三公與司寇及正更共參準聽之也。○“三公以獄之成告於王”者，三公參聽得其情實，以獄成辭以告於王也。○“王三又”者，三，三事也。又當為宥。宥，寬也。王得三公之告，則以三軍命寬之也。○注“正所”至“所置”。○正義曰：按《周禮》鄉師屬地官，不掌獄訟。而云“鄉師”者，鄉謂鄉士也，師謂士師也。雲“之屬”者，謂遂士、縣士、方士之等。雲“今漢有正平丞，秦所置”者，按《漢書·百官公卿表》“廷尉，秦官，掌刑辟，有正左右監。宣帝地節三年，初置左右平”。鄭見古有正，連言平耳。此《王制》多是殷法，秦則放殷置之。○注“周禮”至“位焉”。○正義曰：“《周禮》鄉師之屬”至“職聽於朝”，是鄉士及遂士、縣士職文。雲“異其死刑之罪”者，鄭雲“異謂殊其文書”，謂殊異其應死刑之罪，別為簿書而要之，鄭雲“要之，為其罪法之要辭，如今劾矣”，即是囚之狀辯為要狀。雲“司寇聽之。朝，王之外朝也”者，按朝士職掌外朝之法，雲“左嘉石，平罷民焉。右肺石，達窮民焉”。罷民則是犯罪之人，故知聽於外朝也。雲“左九棘”至“三公位焉”，皆《朝士職》文。故其職雲“左九棘，孤卿大夫位焉，群士在其後。右九棘，公、侯、伯、子、男位焉，群吏在其後。面三槐，三公位焉，州長眾庶在其後”。鄭雲“棘取赤心而外刺”，“槐之言懷也，懷來人於此”。鄭康成以為此外朝，位在皋門內，庫門之外。○注“王使”至“其期”。○正義曰：經直雲“王命三公參聽之”，得知三公復與司寇及正共平之者，以參聽之，是三公之外，共人相參而聽之。上既有正與司寇，故知司寇及正在焉。雲“《周禮》王欲免之，乃命三公會其期”者，按《周禮》鄉士掌六鄉之獄，“若欲免之，則王會其朝”。遂士掌六遂之獄，“若欲免之，則王令三公會其期”。縣士掌野獄，“若欲免之，則王命六卿會其期”。此《遂士職》文也，獨舉遂士公會其期者，以經雲“王命三公”，故舉遂士言之。舉中以見上下，則六鄉王自會之。縣野之獄，王命六卿會之，六卿以獄告於王也。○注“一宥”至“遺忘”。○正義曰：此“一宥”以下，是《周禮·司刺》文。鄭康成雲：“識，審也。不審，若仇讎當報甲，見乙，誠以為甲而殺之者。過失，若舉刃欲斫伐，而軼中人者。遺忘，若間帷薄，忘有在焉，而以兵矢投射之。”王恐有此三事致罪，故令以三事宥之。若不當三事，故造罪者，然後制刑。○“凡作刑罰，輕無赦”，此文起例，故云“凡作刑罰”也。此非疑獄，故雖輕不赦也。若輕者輒赦，則犯者眾也。故《書》雲“刑故無小”，雖輕不赦之，為人易犯也。○“刑者”至“心焉”。○此說刑之不可變改，故云“刑者侀也”。上刑是刑罰之刑，下侀是侀體之侀。訓此刑罰之刑以為侀，體之侀言刑罰之刑加人侀體。又云“侀者成也”，言侀體之侀，是人之成就容貌，容貌一成之後，若以刀鋸鑿之，斷者不可續，死者不可生，故云“不可變”，故君子盡心以聽刑焉，則上悉其聰明，致其忠愛是也。○注“左道”至“俗禁”。○正義曰：盧雲：“左道謂邪道，地道尊右，右為貴。”故《漢書》雲“右賢左愚，右貴左賤”，故正道為右，不正道為左。若巫蠱及俗禁者，按《漢書》武帝時，江充埋桐人於大子宮是也。初江充曾犯大子，后王將老，欲立太子。太子立必誅充，充遂謀大子，為桐人六枚，埋在大子宮中，乃讒大子於帝曰：“臣觀大子宮有巫氣。”王遂令江充檢之，果掘得桐人六枚，盡以針刺之。太子以自無此事，意不服，遂殺充。武帝故怒，遂遣丞相劉屈釐將兵伐大子，大子急竄於湖縣民家而藏。後事發，大子遂自殺而死於其處。壺關老人訟大子無罪，帝乃悔之，因立園陵於湖縣，故思子望子歸來。蠱者，損壞之名，故《左傳》雲“皿蟲為蠱”，是蟲食器皿，巫行邪術，損壞於人。俗禁者，若前漢張竦行闢反支。《後漢書·郭躬傳》有陳伯子者，出闢往亡，入闢歸忌是也。○注“淫聲”至“機窆”。○正義曰：“淫聲，鄭衛之屬”者，以鄭衛多淫風，故鄭衛為淫聲。雲“之屬”者，則桑間濮上之音，故《樂記》雲“鄭衛之音，亂世之音。桑間濮上之音，亡國之音”是也。雲“異服若聚鷸冠瓊弁”者，按僖二十四年《左傳》雲鄭子臧“好聚鷸冠，鄭伯聞而惡之”使盜“殺之於陳宋之間。”瓊弁者，僖二十八年《左傳》雲：“初，楚子玉自為瓊弁玉纓。”服虔注云：“謂馬飾。”雲“若公輸般請以機窆”者，指其人巧，謂之奇技。指其機窆，謂之奇器。故奇技奇器，總謂般也。○“行偽”至“眾殺”。“行偽而堅”者，行此詐偽而守之堅固，不肯變改；“言偽而辯”者，謂言談偽事，辭理明辯，不可屈止；“學非而博”者，謂習學非違之書，而又廣博；“順非而澤”者，謂順從非違之事，而能光澤文飾，以疑於眾：如此者殺。按《史記》孔子為魯司寇，七日而誅少正卯之類是也。○注“皆謂”至“者也”。○正義曰：習偽習非是虛華，辨博而澤是捷給，不可依用，是無誠也。○“假於”至“眾殺”。○妄陳邪術，恐懼於人，假託吉凶，以求財利。“假於鬼神時日卜筮”者，謂假託鬼神，假託時日，假託卜筮，以疑於眾。鬼神時日卜筮，共有假文。○注“今時”至“違制”。○正義曰：謂今時之人，持執此喪葬築蓋嫁娶卜數之文書，以惑於眾，妄陳禍福，浪說妖祥。築謂垣牆，蓋謂舍宇。○注“尊物”至“賣也”。○正義曰：言圭璧金璋及犧牲戎器，皆是尊貴所合蓄之物，非民所宜有，防民之僣偽也。軍器，防民之賊亂也。○注“凡以”至“多少”。○正義曰：此經之物，若其合法度則得粥之，其不合法度者，則不得粥也。○“布帛精粗”者，若朝服之布十五升，斬衰三升，齊衰四升之類是也。○“廣狹”者，布廣二尺二寸，帛則未聞。鄭注《周禮》引《逸巡守禮》幅廣四尺，八寸為尺。鄭注四當為三，則帛廣三尺四寸。“用器，弓矢、耒耜、飲食器”者，《既夕禮》文。既夕敦杅之屬，即飲食器也。○注“不示”至“貪也”。○正義曰：錦文珠王成器衣服等不粥者，不示民以奢。飲食不粥者，不示民以貪。此衣服飲食與珠玉連文，據華美者，不得粥之，恐民貪。若尋常飲食，則得粥之，不得群聚耳，故《周禮·司虣》雲“禁屬游飲食於市”者是也。前經“圭璧金璋”之等，是貴者之器，故注云“非民所宜有”，謂全不合有，以其名位卑故也。此“錦文珠王”等是華麗之物，富人合有，但不得聚之過多，故云“不粥於市”，不示民以奢也。前文“圭璧金璋”，各是一物，即《考工記》“金飾璋”也。皇氏以為用金為印。璋，按定本“璋”字從玉，圭璧之類也。且周時稱印曰璽，未有稱璋，皇氏之義非也。○注“周禮”至“陰木”。○正義曰：此《周禮·山虞》文。鄭注云“陽木生山南者，陰木生山北者，冬斬陽，夏斬陰，堅濡調”。○“關執禁以譏，禁異服，識異言”，司關之官，執此戒禁之書，以譏察出入之人，故云“執禁以譏”。禁此身著異服之人，又記識口為異言之人，防奸偽，察非違。" }
      - { type: j, text: "大史典禮，執簡記，奉諱惡。簡記，策書也。諱，先王名。惡，忌日，若子卯。○惡，烏路反，注同。策書，側八反。" }
      - { type: z, text: "“大史”至“諱惡”。○正義曰：此一經論大史之官典掌禮事，國之得失，是其所掌，執此簡記策書，奉其諱惡之事。奉謂進也。諱謂先王之名。惡謂子卯忌日。謂奉進於王以所諱所惡。○注“諱，先王名”。○正義曰：下文雲“天子齊戒受諫”，傳雲“名終將諱之”，故以諱為先王之名。其實餘諱亦大史奉之，故《禮運》雲“天子適諸侯，必舍其祖廟，不以禮籍入，是謂天子壞法亂紀”，鄭注云“以禮籍入，謂大史典禮執簡記，奉諱惡”，是亦諱諸侯之祖父也。雲“惡，忌日，若子卯”者，忌日，謂先王之亡日及子卯，故云“若子卯”。紂以甲子日死，桀以乙卯日亡，巳具下《檀弓》疏。此惡亦兼餘事，故《誦訓》雲“掌道方慝，以詔闢忌”，鄭注云“方慝，四方言語所惡”是也。" }
      - { type: j, text: "天子齊戒受諫。歲終，群臣奏歲事，諫王當所改為也。○齊，側皆反，本亦齊，下皆同。司會以歲之成，質於天子。司會，冢宰之屬，掌計要者。成，計要也。質，平也，平其計要。○會，古外反，注同。冢宰齊戒受質。質王受之。大樂正、大司寇、市三官以其成，從質於天子。大樂正，於周宗伯之屬。市，司市也，於周司徒之屬。從從於司會也。大司徒、大司馬、大司空齊戒受質。百官各以其成，質於三官。大司徒、大司馬、大司空以百官之成，質於天子。百官，此三官之屬。百官齊戒受質，受平報也。然後休老勞農，饗養之。○勞，力報反。成歲事，斷計要也。制國用。" }
      - { type: z, text: "“天子”至“國有”。○正義曰：此下至“制國用”，論歲終天子受質，及百官質於天子，休老勞農，制國用之事也。○“齊戒受諫”者，以其歲終，舊來所施之事，或有不便，須有改為，百官以此上諫於王，天子以其事重，故先齊戒而後受於諫也。“司會以歲之成，質於天子”者，司會總主群官治要，故以一歲治要之成質於天子。質，平也。謂奏上文簿，聽天子平量之。○“冢宰齊戒受質”者，冢宰是貳王治事，故亦齊戒贊王，受群官所平之事，謂共王論定也。大樂正、大司寇、市三官以其成從質於天子者，謂此三官各以其當司成要，隨從司會平於天子。以周法言之，司會總主群官簿書，則司徒、司馬、司空簿書亦司會掌之，質於天子。所以下文司徒、司馬、司空各質於天子，不由司會，惟大樂正、大司寇、市三官從司會質於天子者，司會總主治要，先質於王。若今時先申帳目，樂正、司寇、司市當司事少，即徑從司會，以質於王。其司徒、司馬、司空總主萬民，其事既大，雖司會進其治要，仍須各受質屬官，親自質於天子。百官齊戒受質，以司徒、司馬、司空質於天子。天子平斷畢，當須報於下，故在下百官齊戒受天子所平之要。○“然後休老勞農”者，即十月蜡祭之時，飲酒勞農也。○“成歲事”者，斷定計要一歲事成，乃制來歲之國用，故云“制國用”也。○注“歲終”至“為也”。○正義曰：知齊戒受諫是歲終者，以下雲“休老勞農”，文相連接，故知是歲終也。以其歲終受質，故知諫王當所改為，謂改其舊事，更為新事，故用歲終。襄十四年《左傳》師曠雲：“正月孟春，於是乎有之。諫失常也。”彼諫王過惡，故用正月，與此別也。○注“司會”至“計要”。○正義曰：按《天官》“司會中大夫二人”，屬冢宰，故云冢宰之屬。雲“成，計要也”者，按《周禮》注：“歲計曰會，月計曰要，日計曰成。”彼對文耳。此則總而言之，故云“成計要”也。謂一歲薄書，總要成就。○注“大樂”至“會也”。○正義曰：按上文司會直雲“冢宰之屬”，不雲“於周”，此大樂正及市皆雲“於周者”，以此文司會與《周禮》兆墁，故不須雲於周，此大樂正於周是大司樂，此市亦於周為司市，與《周禮》不同，故以《周禮》明之。雲“從，從於司會也”者，以文承上司會質於天子，故知從質者，從司會也。然此大樂正、大司寇及市亦當受屬官之質，以其事少，文不見耳。○注“百官，此三官之屬”。○正義曰：司徒、司馬、司空受百官質，故云“三官之屬”。若以殷法言之，按《曲禮》雲司徒、司馬、司空、司寇、司士。若以夏法言之，按《夏傳》司徒、司馬、司空三官分主九卿，則兼群官焉。但大樂正、大司寇、司市特自質於天子也。" }
      - { type: j, text: "凡養老，有虞氏以燕禮，夏后氏以饗禮，殷人以食禮，周人脩而兼用之。兼用之，備陰陽也。凡飲養陽氣，凡食養陰氣。陽用春夏，陰用秋冬。○食音嗣，注及下注並下文“食之”並同。養如字，徐以上反，下同。五十養於鄉，六十養於國，七十養於學，達於諸侯。天子諸侯養老同也。國，國中小學，在王宮之左。學，大學也，在郊。小學在國中，大學在郊，此殷制明矣。" }
      - { type: z, text: "“凡養”至“諸侯”。○正義曰：此一節論虞夏殷周養老不同之事，各依文解之。○“凡養老”者，皇氏雲：“人君養老有四種：一是養三老五更；二是子孫為國難而死，王養死者父祖；三是養致仕之老；四是引戶校年，養庶人之老。”熊氏雲：“天子視學之年，養老一歲有七。”謂四時皆養老。故鄭此注“凡飲養陽氣，凡食養陰氣，陽用春夏，陰用秋冬”，是四時凡四也。按《文王世子》雲：“凡大合樂，必遂養老。”注云：“大合樂，謂春入學，舍菜合舞。秋，頒學合聲。”通前為六。又季春大合樂，天子視學亦養老，《世子》雲凡視學，必遂養老，是總為七也。○“有虞氏以燕饋癟者，虞氏雲：“燕禮，脫屨升堂。”崔氏雲：“燕者，殽烝於俎，行一獻之禮，坐而飲酒，以至於醉。以虞氏帝道弘大，故養老以燕禮。”○“夏后氏以饗禮”者，崔氏雲：“饗則體薦而不食，爵盈而不飲，依尊卑而為獻，取數畢而已。夏既受禪於虞，是茸荃之首，貴尚於禮，故養老以饗禮，相養敬也。”○“殷人以食禮”者，崔氏雲：“不飲酒，享大牢，以禮食之，殷人質素，威儀簡少，故養老以養禮。”○“周人脩而兼用之”者，謂周人脩三代之禮，而兼用之以養老。春夏養老之時，用虞氏燕禮、夏后氏饗禮之法。若秋冬養老之時，用殷人食禮之法。以周極文，故兼用三代之法也。皇氏雲享有四種：一是諸侯來朝，天子饗之，則《周禮·大行人職》雲“上公之禮，其享禮九獻”是也。其牲則體薦，體薦則房烝。故《春秋》宣十六年《左傳》雲：“享有體薦。”又《國語》雲：“王公立飫，則有房烝。”其所云飫，即謂饗也。立而成禮，謂之為飫也。其禮亦有飯食，故《舂人》雲：“凡饗食，共其食米。”鄭雲“享有食米，則饗禮兼燕與食”是也。二是王親戚及諸侯之臣來聘，王饗之，禮亦有飯食及酒者，親戚及賤臣不須禮隆，但示慈惠，故並得飲食之也。其酌數亦當依命，其牲折俎，亦曰殽烝也。故《國語》雲“親戚宴饗，則有餚烝”，謂以燕禮而饗則有之也。又《左傳》宣十六年雲：“享有體薦，宴有折俎，公當享，卿當宴，王室之禮也。”時定王享士會而用折俎，以《國語》及《左傳》，故知王親戚及諸侯之大夫來聘皆折俎饗也。其饗朝廷之臣，亦當然也。三是戎狄之君使來，王享之，其禮則委饗也。其來聘賤，故王不親饗之，但以牲全體委與之也。故《國語》雲“戎翟貪而不讓，坐諸門外而體委與之”是也。此謂戎狄使臣賤之，故委饗。若夷狄君來則當與中國子男同，故《小行人職》掌小賓小客，所陳牲牢，當不異也。四是享宿衛及耆老孤子，則以醉為度，故《酒正》雲：“凡饗士庶子，享耆老孤子，皆共其酒，無酌數。”鄭雲：“要以醉為度。”“食禮”者，有飯有殽，雖設酒而不飲，其禮以飯為主，故曰食也。其禮有二種，一是禮食，故《大行人》雲諸公三食之禮有九舉，及公食大夫禮之屬是也。二是燕食者，謂臣下自與賓客旦夕共食是也。按鄭注《曲禮》“酒漿處右”雲：“此大夫士與賓客燕食之禮。”“燕禮”者，凡正享食在廟，燕則於寢，燕以示慈惠，故在於寢也。燕禮則折俎，有酒而無飯也，其牲用狗。謂為燕者，《詩毛傳》雲：“燕，安也。”其禮最輕，升堂行一獻禮，畢，而說屨升堂，坐飲以至醉也。《儀禮》猶有諸侯《燕禮》一篇也。然凡燕禮亦有二種，一是燕同姓，二是燕異姓。若燕同姓，夜則飲之；其於異姓，讓之而止。故《詩·湛露》“天子燕諸侯”篇，鄭箋雲：“夜飲之禮，同姓則成之，其庶姓讓之則止。”其此燕饗食致仕之老，皇氏雲：“則當用正饗、正食、正燕之禮，以其有賢德者，不可以褻禮待之。”其饗死事之老，不必有德，又是老人不宜久立，當用折俎之饗，燕食之食，老人不合夜飲，當用異姓之燕禮。○注“兼用”至“秋冬”。○正義曰：“兼用之，備陰陽”者，以燕之與饗是飲酒之禮，是陽，陽而無陰。食是飯，飯是陰，陰而無陽。周兼用之，故云備陰陽也。雲“凡飲養陽氣，凡食養陰氣”者，《郊特牲》文。所以飲養陽者，飲是清虛陽氣之象，食是形質陰體之義。雲“陽用春夏，陰用秋冬”者，按《郊特牲》雲“饗禘有樂而食嘗無樂”，是故春禘而秋嘗，享與禘連文，故知饗在春。食與嘗連文，故知食在秋。彼不雲冬夏者，彼是殷禮，此言冬夏者據周法也。或鄭因春而言夏，因秋而見冬。雖周，冬夏不養老也。就如熊義，去冬夏則一年有五養老也。又春合舞，秋合聲，即是春秋養老之事，冬夏更無養老，通季春大合樂有三養老也。熊氏以為春秋各再養老，故為一年七養老也。去冬夏猶為五，義實可疑。皇氏雲：“春夏雖以飲為主，亦有食，先行饗，次燕，次食。秋冬以食為主，亦有饗，先行食，次燕，次享，一日之中，三事行畢。”義或然也。○“五十”至“諸侯”。○此謂子孫為國死難，而王養其父祖也。五十始衰，故養於鄉學。○“六十養於國”者，六十漸衰，養禮彌厚，故養之於小學，小學在國中也。○“七十養於學”者，七十大衰，養禮轉重，故養於大學。○“達於諸侯”者，言此養老之事，非惟天子之法，乃通達於諸侯。盧、王等以為養於鄉，雲不為力政養於國，雲不與服戎，皆謂養庶人之老也。非鄭義，故鄭注云“國中小學”也。○注“國國”至“明矣”。○正義曰：養於國與養於學文相對，故知國亦是學也。六十少於七十者，六十者宜養於小學，七十者宜養於大學，故云“國，國中小學”。雲“在王宮之左”者，據上文而知。雲“小學在國中，大學在郊，此殷制明矣”者，以上文雲“小學在公宮南之左，大學在郊”，下文雲“殷人養國老於右學，養庶老於左學”，貴右而賤左。小學在國中，左也；大學在郊，右也，與殷同也，故云“此殷制明矣”。以此篇從上以來，雖解為殷制，無正據可馮，因此小學大學是殷制不疑，故云“明矣”。" }
      - { type: j, text: "八十拜君命，一坐再至，瞽亦如之。九十使人受。命，謂君不親饗食，必以其禮致之。○瞽音古。五十異粻，六十宿肉，七十貳膳，八十常珍，九十飲食不離寢，膳飲從於游可也。粻，糧也。貳，副也。游謂出入止觀。○粻，涉良反。離，力智反。觀，古亂反。六十歲制，七十時制，八十月制，九十日脩。唯絞、紟、衾、冒，死而後制。絞、紟、衾、冒，一日二日而可為者。○絞，戶交反。紟，其鴆反。冒，亡報反。五十始衰，六十非肉不飽，七十非帛不暖，八十非人不暖，九十雖得人不暖矣。暖，溫。○暖，乃管反，下同。五十杖於家，六十杖於鄉，七十杖於國，八十杖於朝，九十者，天子欲有問焉，則就其室，以珍從。尊養之。○從，才用反，又如字。七十不俟朝，大夫士之老者，揖君則退。八十月告存，每月致膳。九十日有秩。秩，常也。有常膳。五十不從力政，六十不與服戎，七十不與賓客之事，八十齊喪之事弗及也。力稍衰也。力政，城道之役也。與，及也。八十不齊，則不祭也。子代之祭，是謂宗子不孤。○與音預，下及注同。五十而爵，賢者命為大夫。六十不親學，不能備弟子禮。七十致政，唯衰麻為喪。致政，還君事。" }
      - { type: z, text: "“八十”至“為喪”。○正義曰：此一節論老人力衰，與少不同之事，各隨文解之。○七十養於大學，至於八十年漸衰弱，不堪來學受養，君以饗食之禮，使人就家致之。其受君命之時，理須再拜，不堪為勞，一坐於地，而首再至於地。瞽人無目，恐其傾倒，拜君命之時，亦當如此，故云“亦如之”。○“五十”至“可也”。○自此以下雜記卿大夫士及庶人年老節制在家自養之法，隨年為品也。○“五十異粻”者，粻，糧也。五十始衰，糧宜自異，不可與少壯者同也。○“六十宿肉”者，轉老，故恆宿肉在帳下，不使求而不得也。○“七十貳膳”者，貳，副也。膳，善食也。恆令善食有儲副，不使有闕也。○“八十常珍”者，珍謂常食之皆珍奇美食，尋常使有。○“九十飲食不離寢”者，謂老人飲食無時，或急求須得，故不離於寢。○“膳飲從於游可也”者，謂美善之膳，水漿之飲，從於老人所游之處，其理可也。○“六十”至“後製”。○“六十歲制”者，明老而預為送終之具也。年既衰老，故逆辨之也。歲制，謂棺也。不易可成，故歲制。然此謂大夫以下耳，人君即位為椑，不待六十也。其槨則死後為之，以其葬尚賒，故《檀弓》雲“旬而布材”是也。○“七十時制”者，時制，謂一時可辨，是衣物之難得者。是年轉老，所須辨轉切也。○“八十月制”者，月制，謂一月可辨，衣物易得者也。漸老彌切也。○“九十日脩”者，至九十棺衣皆畢，但日日脩理之，為近於終故也。“惟絞紟衾冒，死而後制”者，此四物易成，故生不逆為，須亡乃制也。故《檀弓》雲：“一日二日而可為也者，君子弗為也。”○“七十”至“有秩”。○此謂大夫士老年而聽致仕者，則七十杖於國，朝君之時，入門至朝位，君出，揖之即退，不待朝事畢也。若不聽致仕，則《祭義》雲：“七十杖於朝，八十不俟朝。”○“八十月告存”者，告謂問也。君每月使人致膳告問存否。○“九十日有秩”者，以至年老方極。秩，常也。君則日使人以常膳致之，故云“日有秩”。○注“大夫”至“則退”。○正義曰：按《儀禮·大射》“卿大夫皆入門右，北面”，“公降立於阼階之東南，南鄉”，“揖大夫，大夫皆少進”，彼鄭注云“變爾言揖”。使近北者爾揖，君則退，謂就位，君揖之時，七十老者則退，故《祭義》注云：“君揖之即退，不待朝事畢。”其少壯者，則待朝事之終也。○注“每月致膳”。○正義曰：經直雲“月告存”，知非直遣人告問存否。必知致膳者，以下雲“九十日有秩”，上文雲“天子欲有問焉，則就其室，以珍從”，明八十每月告存之時，必當致膳也。○注“力稍”至“不孤”。○正義曰：以上文歲制及杖於家之屬，兼含大夫士及庶人之老。此五十不從力政，及不與服戎，惟據庶人之事，故云“力政，城道之役也”，謂築城垣治道也。其大夫士六十未致仕，若為軍將，當與服戎，故知此據庶人也。按《異義》：“《禮》戴說《王制》雲：‘五十不從力政，六十不與服戎。’《易孟氏》、《韓詩》說‘年二十行役，三十受兵，六十還兵’。《古周禮》說‘國中自七尺以及六十，野自六尺以及六十有五，皆徵之’。許慎謹按雲：《五經》說皆不同，是無明文所據。漢承百王而制二十三而役，五十六而免。六十五已老，而周復徵之，非用民意。”是許以《周禮》為非。鄭駮之雲：“《周禮》是周公之制，《王制》是孔子之後大賢所記先王之事，《周禮》所謂皆徵之者，使為胥徒給公家之事，如今之正衛耳。六十而不與服戎，胥徒事暇，坐息之間，多其五歲，又何太違之？”雲“徒給公家之事”，雲“非用民意”，取《王制》所云“力政挽引築作之事”；所謂服戎，謂從軍為士卒也：二者皆勞於胥徒，故早舍之。如鄭此言，力政田役為重，故云“五十免之”，故此五十不從力政，《祭義》雲“五十不為甸徒”也。戎事差輕，六十不與服戎，及《孟氏》說“六十選兵”是也。胥徒又輕，故野外六十五猶徵之。若四郊之內，以其多役，其胥徒之事，六十則免。初受役之時，始年二十也。其野王城之外，力役又少，胥徒之事，十五則徵之，至六十五。其力政之事，皆二十受之；兵革之事，則三十受之，故《易孟氏》、《詩韓氏》皆雲“二十行役，三十受兵”也。雲“是謂宗子不孤”者，以父是宗子，年已八十，子則代之而祭。若父不為宗子，則不主祭祀，無祭可代。今已是父嫡子代父而祭之，是有父之宗子。按《喪服》雲：“宗子孤為殤。”以無父則稱孤，明有父則不孤，故云“是謂宗子不孤”也。○注“賢者命為大夫”。○正義曰：經文雲“五十而爵”，鄭知非命為士而云大夫者，以《王制》殷法，殷則士無爵。此經雲而爵，故知是大夫也。此謂凡常之人有賢德，故五十始為大夫。若其有德，不必五十，則《喪服》“小功”章雲“大夫為昆弟之長殤”，是幼為大夫，為兄之長殤。" }
      - { type: j, text: "有虞氏養國老於上庠，養庶老於下庠。夏后氏養國老於東序，養庶老於西序。殷人養國老於右學，養庶老於左學。周人養國老於東膠，養庶老於虞庠，虞庠在國之西郊。皆學名也。異者，四代相變耳，或上西，或上東，或貴在國，或貴在郊。上庠、右學，大學也，在西郊；下庠、左學，小學也，在國中王宮之東；東序、東膠，亦大學，在國中王宮之東；西序、虞庠亦小學也，西序在西郊，周立小學於西郊。膠之言糾也，庠之言養也。周之小學為有虞氏之庠制，是以名庠。雲其立鄉學亦如之。膠，或作練。○糾，居黝反，徐居酉反。絿音求，又音虯。有虞氏皇而祭，深衣而養老。夏后氏收而祭，燕衣而養老。殷人哻而祭，縞衣而養老。周人冕而祭，玄衣而養老。玄，冕屬也，畫羽飾焉。凡冕屬，其服皆玄上纁下。有虞氏十二章，周九章，夏、殷未聞。凡養老之服，皆其時與群臣燕之服。有虞氏質，深衣而巳。夏而改之，尚黑而黑衣裳。殷尚白而縞衣裳。周則兼用之，玄衣素裳。其冠則弁追，章甫，委貌也。諸侯以天子之燕服為朝服，《燕禮》曰：“燕，朝服。”服是服也。王者之後，亦以燕服為之。魯季康子朝服以縞，僣宋之禮也。天子皮弁，以日視朝也。○{羽王}<禾音>皇，本又作皇。哻，況甫反。縞，古老反，又古報反。纁，許雲反。牟，亡侯反。追，丁雷反。凡茸荃養老，皆引年。已而引戶校年，當行復除也。老人眾多，非賢者不可皆養。○復除，上音福；下如字，又直慮反。八十者，一子不從政。九十者，其家不從政。廢疾非人不養者，一人不從政。廢，廢於人事。○養如字，又以尚反。父母之喪，三年不從政。齊衰大功之喪，三月不從政。將徙於諸侯，三月不從政。自諸侯來徙家，期不從政。自，從也。○期音基。" }
      - { type: z, text: "“有虞”至“從政”。○正義曰：此一節明養致仕老及庶人老給賜之事，各依文解之。○注“皆學”至“如之”。○正義曰：此四代養老之處，雖其名不同，以殷人云右學、左學，虞氏雲上庠、下庠，《學記》雲“黨有庠”，《文王世子》雲“學干戈羽籥於東序”，以此約之，故知“皆學名也”。“養老必在學”者，以學教孝悌之處，故於中養老。熊氏雲：“國老謂卿大夫致仕者，庶老謂士也。”皇氏雲：“庶老兼庶人在官者。”其致仕之老，大夫以上當養從國老之法，士養從庶老之法，故《外饔》雲“邦饗耆老，掌其割享”，鄭注引此“周人養國老於東膠，養庶老於虞庠”是也。虞、殷尚質，貴取物成，故大學在西，小學在東。夏、周貴文，取積漸長養，故大學在東，小學在西。故云“上庠、右學，大學也，在西郊；下庠、左學，小學也，在國中王宮之東”，以虞殷質，俱貴於西，故並言之；夏、周為文，皆上東，故亦並言之，雲“東序、東膠，亦大學，在國中王宮之東；西序、虞序亦小學也，西序在西郊，周立小學於西郊”是也。雲“周之小學為有虞氏之庠制”者，庠則後有室，前有堂。若夏后氏之序，及周之學所在序者，皆與庠制同。其州黨之序，則歇前而已。序則豫也。故《鄉射》雲：“豫則鉤楹內，堂則由楹外。”彼鄭注“豫讀如成周宣謝災之謝”是也。雲“其立鄉學亦如之”者，言鄉學亦為庠制，故上文雲“耆老皆朝於庠”是也。周大學在國之西郊，鄭《駮異義》雲“三靈一雍在郊”者，熊氏雲“文王之時猶從殷禮，故辟廱大學在郊”。劉氏以為周之小學為辟廱在郊。○注“皇冕”至“朝也”。○正義曰：以皇與下冕相對，故為冕屬。按《周禮》有“設皇邸”，又云“有皇舞”，皆為“鳳皇”之字，鳳羽五采，故云畫羽飾之。按上注云“虞夏之制，天子服有日月星辰”，此雲“夏殷未聞”者，以《皋陶謨》謂之虞夏書，因彼之成文，故云“虞夏之制”，其實惟謂虞也。雲“凡養老之服，皆其時與群臣燕之服”，鄭知然者，以經雲夏后氏燕衣而養老，周人玄衣而養老。周人燕用玄衣，故知養老燕群臣之服也。雲“有虞氏質，深衣而巳”者，深衣謂白布衣，以質，用白布而已，其冠未聞。皇氏雲以為養老，首還服皇冠。崔氏雲以為與夏周同，未知然否。按《郊特牲》雲：“大古冠布，齊則緇之。”大古，則虞氏或用白布冠也。雲“夏而改之，尚黑而黑衣裳”者，以殷人尚白用縞衣，夏既尚黑，燕衣黑衣也。雲“殷尚白而縞衣裳”者，縞，白色生絹，亦名為素。此縞衣謂白，白布深衣也。雲“周則兼用之，玄衣素裳”者，以經雲“玄衣而養老”，若衣裳俱玄，則與夏不異。又《儀禮》朝服緇布衣素裳，緇則玄，故為玄衣素裳。上養老雲周人脩而兼用之，故養老之衣，亦脩而兼用之。雲“其冠則牟追、章甫，委貌也”者，按《儀禮》朝服首著玄冠，玄冠即委貌。以此推之，則殷之朝服，則皆著章甫之冠，夏之朝服著牟追。雲“諸侯以天子之燕服為朝服”者，以《燕禮》諸侯燕臣子用朝服，明天子之燕亦朝服也。引《燕禮》曰“燕，朝服”者，證朝、燕同。雲“服是服也”者，言燕時服是玄衣素裳之服。崔氏雲：“天子燕畿內諸侯以緇衣，燕畿外諸侯以玄冠。諸侯各以為朝服，事無明文，不可依也。”雲“王者之後，亦以燕服為之”者，《玉藻》雲：“魯季康子朝服以縞。”若當時無朝服以縞，康子不應服之，明是宋人所著，故康子僣效之。宋既朝服以縞，杞當朝服以玄。雲“天子皮弁，以日視朝也”者，《玉藻》文。引之者，證天子以諸侯朝服之別，按《詩·頍弁》注云：“禮，天子諸侯朝服以燕，天子之朝服以皮弁。”服以皮弁服，燕不用玄衣者，《詩》所謂燕同姓諸公及異姓甥舅等，故用皮弁，尚質故也。若燕其諸侯，則用玄衣，明諸侯則朝服以日視朝，服則玄冕素裳也。《冠禮記》雲：“周弁、殷哻、夏收。”鄭雲：“弁名出於幠，幠，大也，言所以自光大也。哻名出於幠，幠，覆也，所以自覆飾也。收，言所以收斂發也。其制之異，亦未聞。”《冠禮記》又云：“委貌，周道也。章甫，殷道也。母追，夏后氏之道也。”鄭注云“委猶安也，言所以安正容貌。章，明也，殷質，言以表明丈夫也”，“母，發聲也。追猶堆也。夏后氏質，以其形名之”，“其制之異同未聞”。○“將徙”至“從政”。○此謂大夫采地之民，徙於諸侯為民，以其新徙，當須復除。但諸侯地寬役少，為人所欲，故惟三月不從政。○“自諸侯來徙於家”者，謂諸侯之民，來徙於大夫之邑，以大伕役多地狹，欲令人貪之，故期不從政。按《旅師》雲：“新甿之治皆聽之，使無徵役。”鄭注引此文以證之，是據民之遷徙。王肅及庾氏等以為據仕者從大夫家出仕諸侯，從諸侯退仕大夫，非鄭義也。" }
      - { type: j, text: "少而無父者謂之孤，老而無子者謂之獨，老而無妻者謂之矜，老而無夫者謂之寡。此四者，天民之窮而無告者也，皆有常餼。餼，廩也。○少，詩照反，下注“少者”同。矜，本又作鰥，同古頑反。廩，兵品反。" }
      - { type: z, text: "“少而”至“常餼”。正義曰：此一節論矜恤鰥寡孤獨之事。無妻無夫謂之矜寡者，按《孝經》雲“男子六十無妻曰鰥，婦人五十無夫曰寡”。舜年三十而《尚書》謂之鰥者，以其父頑母嚚，無為娶之端，故雖三十而亦稱鰥。《詩》雲：“何草不黃，何人不矜。”據久役在外，嫁娶失時，亦謂之為矜。矜與鰥同，其男子無妻，亦謂之寡。《左傳》雲：“崔杼生成及疆而寡。”按劉熙《釋名》雲：“無妻曰鰥，愁悒不能寐，目恆鰥鰥然，其字從魚，魚目恆不閉。無夫曰寡，寡，倮也，倮然，單獨也。無父曰孤，孤，顧也，顧望無所瞻見也。無子曰獨，獨，鹿也，鹿鹿無所依也。”" }
      - { type: j, text: "瘖、聾、跛躃、斷者、侏儒，百工各以其器食之。斷謂支節絕也。侏儒，短人也。器，能也。○瘖，於金反，啞也。聾，力東反。跛，彼我反；躄，必亦反，兩足不能行也。侏音朱。" }
      - { type: z, text: "“瘖聾”至“食之”。○正義曰：此一節論矜恤疾民之事。瘖謂口不能言，聾謂耳不聞聲，跛躃謂足不能行，斷者謂支節解絕，侏儒謂容貌短小。百工謂有雜技藝，此等既非老無告，不可特與常餼。既有疾病，不可不養，以其病尚輕，不可虛費官物，故各以其器食之。器，能也。因其各有所能，供官役，使以廩餼食之。按《晉語》雲文公問八疾，胥臣對雲“戚施權鎛”，注云“使擊鍾”；“蘧除蒙璆”，注云“璆是玉磬，使擊之”；“侏儒扶廬”，注云“扶，持也，廬，戟柄也；“矇瞍循聲”，注云“歌詠琴瑟”；“聾瞶司火”，注云“使主然火”。其“童昏、嚚瘖、憔僥，官師所不材，宜於掌土”，是各以器食之。《外傳》不雲“跛”，此不雲“蘧蒢戚施”，設文不具。《外傳》瘖與憔僥置於掌土，此瘖與侏儒其器食之者，今古法異也。" }
      - { type: j, text: "道路，男子由右，婦人由左，車從中央。道中茸芫，遠別也。○別，彼別反，下文並注同。父之齒隨行，兄之齒雁行，朋友不相逾。廣敬也。謂於塗中。○行如字，一音戶剛反，下“雁行”同。輕任並，重任分，班白不提挈。皆謂以與少者。雜色曰班。○並，必性反，本又作並。提音啼。挈，本亦作挈，苦結反。" }
      - { type: z, text: "“輕任並，重任分”。○正義曰：父齒，老也。任謂有擔負者，俱應擔負，老少並輕，則並與少者擔之也。○“重任分”者，老少並重，不可並與少者一人，則分為輕重，重與少者，輕與老者。" }
      - { type: j, text: "君子耆老不徒行，庶人耆老不徒食。徒猶空也。○大夫祭器不假。祭器未成，不造燕器。造，為也。" }
      - { type: z, text: "“大夫祭器不假”。○正義曰：皇氏雲：“此謂有地大夫，故祭器不假。若無地大夫，則當假之，故《禮運》雲‘大夫祭器不假，聲樂皆具，非禮也’，謂無地大夫也。”" }
      - { type: j, text: "方一里者，為田九百畝。一里方三百步。方十里者，為方一里者百，為田九萬畝。方百里者，為方十里者百，為田九十億畝。億，今十萬。○億，於力反。方千里者，為方百里者百，為田九萬億畝。萬億，今萬萬也。" }
      - { type: z, text: "“方一”至“億萬”。○正義曰：此一節論開方之法，總計天子畿外內諸侯之地大小，各依文解之。○“方一里者，為田九百畝”，按《論語》雲“步百為畝”，是長一百步，闊一步；“畝百為夫”，是一頃也，長闊一百步；“夫三為屋”，是三頃也，闊三百步長；“屋三為井”，是九百畝也，長闊一里。○注“億，今十萬”。○正義曰：方十里為田九萬畝。方百里者為方十里者百，一個十里之方，既為田九萬畝，則十個十里之方，為田九十萬畝；一百個十里之方，為田九百萬畝。今雲九十億畝，是一億有十萬，十億有一百萬，九十億為九百萬畝，故云“億，今十萬”。《尹文子》雲“百姓千品，萬官億醜，皆以數相十”，此謂小億也，此鄭氏所用。《毛詩傳》雲“首茯至萬曰億”，是大億也，非鄭義。○注“萬億，今萬萬也”。○正義曰：計千里之方，為方百里者百。一個百里之方既為九十億畝，則十個百里方為九百億畝，百個百里方為九千億畝。今乃雲九萬億畝，與數不同者，若以億言之，當雲九千億畝；若以萬言之，當雲九萬萬畝，但書經戰國及秦之世，經藉錯亂，此經上下，或億或萬，字相交涉，遂誤為萬億。鄭未注之前，書本既爾，鄭更不顯言其錯，因此錯本萬億之言，即雲此經萬億者，即今之萬萬，皇氏以為億數不定，或以十萬為億，或以萬萬為億，或以一萬為億。此雲萬億者，秪是萬萬也。六國時或將萬為億，故云萬億。但古事難委，未知孰是，故備存焉。" }
      - { type: j, text: "自恆山至於南河，千里而近。冀州域。自南河至於江，千里而近。豫州域。自江至於衡山，千里而遙。荊州域。自東河至於東海，千里而遙。徐州域。自東河至於西河，千里而近。亦冀州域。自西河至於流沙，千里而遙。雍州域。○雍，於而反。西不盡流沙，南不盡衡山，東不近東海，北不盡恆山。凡四海之內，斷長補短，方三千里，為田八十萬億一萬億畝。九州之大計，斷，音短。方百里者，為田九十億畝。山陵、林麓、川澤、溝瀆，城郭、宮室、塗巷三分去一，其餘六十億畝。以一大國為率，其餘所以授民也。山足曰麓。○去，羌呂反。率音律，又音想。" }
      - { type: z, text: "“自恆”至“億畝”。○正義曰：此一節論四海之內地遠近裏數也。言“千里而近”者，皇氏雲“此恆山至南河以千里言之，其地稍近，言不滿千里。下雲自江至於衡山千里而遙，謂以千里言之，其地稍遠，言不啻千里”。熊氏以為“近者，謂過千里，遙者，謂不滿千里”，其義似非也。其餘遙近皆放此也。○“為田八十萬億一萬億畝”，以一州方千里，九州方三千里，三三如九，為方千里者有九。一個千里有九萬億畝，九個千里九九八十一，故有八十一萬億畝，但記文詳具於八十整數之下，雲萬億是八十個萬億，又云一萬億，言是詳也。以前文誤為萬億，此則因前文之誤，更以萬億言之。" }
      - { type: j, text: "古者以周尺八尺為步，今以周尺六尺四寸為步。古者百畝，當今東田百四十六畝三十步。古者百里，當今百二十一里六十步四尺二寸二分。周尺之數，未詳聞也。按禮制，周猶以十寸為尺，蓋六國時多變亂法度，或言周尺八寸，則步更為八八六十四寸。以此計之，古者百畝，當今百五十六畝二十五步。古者百里，當今百二十五里。" }
      - { type: z, text: "“古者”至“二分”。○正義曰：古者八寸為尺，今以周尺八尺為步，則一步有六尺四寸。今以周尺六尺四寸為步，則一步有五十二寸，是今步比古步每步剩出一十二寸。以此計之，則古者百畝，當今東田百五十二畝七十一步者，餘，與此“百四十六畝三十步”不相應也。又今步每步剩古步十二寸，以此計之，則古之百里，當今百二十三里一百一十五步二十寸，與此經“百二十一里六十步四尺二寸二分”又不相應，故鄭雲“六國時多變亂法度”。經雲錯亂，不可用也。○注“按禮”至“五里”。○正義曰：《王人職》雲：“鎮圭尺有二寸。”又云：“桓圭九寸。”是周猶以十寸為尺也。今經雲“以周尺六尺四寸為步”，乃是六十四寸，則謂周八寸為尺也，故云“蓋六國時多變亂法度”。或言周尺八寸也，鄭即以古周尺十寸為尺，八尺為步，則步八十寸。鄭又以今周尺八寸為尺，八尺為步，則今步皆少於古步一十六寸也，是今步別剩十六寸。雲“以此計之”者，謂以古步。又以今周尺八寸八尺為步，外剩十六寸而計之，則古之四步剩出今之一步，古之四十步為今之五十步，古之八十步為今之一百步，計古之一畝之田長百步，得為今田一百二十五步，是今田每一畝之上剩出二十五步，則方百畝之田，從北鄉南，每畝剩二十五步，總為二千五百步；從東鄉西，每畝二十五步，亦總為二千五百步，相併為五千步，是總為五十畝。又西南一角，南北長二十五步，應南畔所剩之度，東西亦長二十五步，應西畔所剩之度，計方二十五步，開方乘之，總積得六百二十五步，六百步則為六畝，餘有二十五步，故云“古者百畝，當今百五十六畝二十五步”也。又古四步，剩今一步，則古者四里，剩今一里為五里，則古者四十里，剩今十里為五十里，則古者八十里，剩今二十里總為百里，是古者八十里為今百里，今之百里之外，猶有古之二十里，四里剩一里，其古二十里，為今之二十五里，故云“古者百里，當今百二十五里”。" }
      - { type: j, text: "方千里者，為方百里者百，封方百里者三十國，其餘方百里者七十。又封方七十里者六十，為方百里者二十九，方十里者四十，其餘方百里者四十，方十里者六十。又封方五十里者百二十，為方百里者三十，其餘方百里者十，方十里者六十。名山大澤不以封，其餘以為附庸間田。諸侯之有功者，取於閒田以祿之。其有削地者，歸之間田。" }
      - { type: z, text: "“方千”至“間田”。○正義曰：此一經論畿外九州建國之法。九州州別方千里，凡千里之方，以開方計之，為方百里者凡有一百，故云“為方百里者百，封方百里者三十國”者，前文雲立大國三十，故此雲“封方百里者三十國”，謂公也。以百中去三十，故“其餘方百里者有七十”。“又封方七十里者六十，為方百里者二十九，方十里者四十”，謂侯國也。凡百里之方開方計之，為十里之方百，其七十里之國一，用十里之方四十九，七十里之國二，則用十里之方九十八，則一個百里，為七十里之國二，剩十里之方二。然則二十個七十里之國，用百里之方十，剩十里方有二十。七十里之國六十，用百里之方三十，剩十里之方六十。今就百里之方三十里之中，抽去十里之方六十，是用百里之方二十九，方十里者四十，故“其餘方百里者四十，方十里者六十”。“又封方五十里者百二十”者，上雲小國百二十，謂伯國也。凡百里之方一，封五十里之國四，則十個百里之方，封五十里之裏四十。今小國百二十，故用百里之方三十，則其餘方百里者十，方十里者六十，以為附庸間田。" }
      - { type: j, text: "天子之縣內，方千里者，為方百里者百，封方百里者九，其餘方百里者九十一。又封方七十里者二十一，為方百里者十，方十里者二十九，其餘方百里者八十，方十里者七十一。又封方五十里者六十三，為方百里者十五，方十里者七十五，其餘方百里者六十四，方十里者九十六。" }
      - { type: z, text: "“天子”至“十六”。○正義曰：天子縣內地方千里，為方百里者百，既用九個擬封百里之國，故“其餘方百里者九十一”也。○“又封方七十者二十一”者，凡百里之方十，為七十里之國二十，剩十里之方二十。今以十里之方二十，又更取其外十里之方二十九，添前二十為四十九，為七十里之國一，是次國二十一也。總用百里之方十，十里之方二十九，是“其餘方百里者八十，方十里者七十一”。“又封方五十里者六十三”者，謂小國也。凡百里之方一，為五十里之國四，則百里之方十，為五十里之國四十，又百里之方五，為五十里之國二十，總為五十里之國六十，更有五十里之國三。凡一個五十里之國，用十里之方二十五，則三個五十里國，總用十里之方七十五，是用地“方百里者一十五，方十里者七十五”，是“其餘方百里者六十四，方十里者九十六”。然畿外千里，封國之外，所餘地少；其畿內千里，所餘地多者，以畿外之土，本擬封建諸侯，故國數多，餘地少。畿內本供天子，又有郊、關、鄉，遂準擬公卿王子弟采邑，故建國數少，餘地多。" }
      - { type: j, text: "諸侯之下士，祿食九人，中士食十八人，上士食三十六人，下大夫食七十二人，卿食二百八十八人，君食二千八百八十人。次國之卿，食二百一十六人，君食二千一百六十人。小國之卿，食百四十四人，君食千四百四十人。次國之卿，命於其君者，如小國之卿。天子之大夫為三監，監於諸侯之國者，其祿視諸侯之卿，其爵視次國之君，其祿取之於方伯之地。方伯為朝天子，皆有湯沐之邑於天子之縣內，視元士。給齊戒自絜清之用。浴用湯，沐用潘。○間田音閒，下同。祿食音嗣，又如字。下皆同。為朝，於偽反。清如字，徐才性反。潘，芳袁反，米汁也。諸侯世子世國。象賢也。大夫不世爵，使以德，爵以功。謂縣內及列國諸侯為天子大夫者。不世爵而世祿，闢賢也。○闢音避。未賜爵，視天子之元士，以君其國。列國及縣內之國也。諸侯之大夫，不世爵祿。○六禮：冠、昏、喪、祭、鄉、相見。鄉，鄉飲酒，鄉射。○冠，古亂反。七教：父子、兄弟、夫婦、君臣、長幼、朋友、賓客。八政：飲食、衣服、事為、異別、度、量、數、制。飲食為上，衣服次之。事為，謂百工技藝也。異別，五方用器不同也。度，丈尺也。量，鬥斛也。數，百十也。制，布帛幅廣狹也。○長，丁丈反。斛，洪谷反。福，芳服反。狹，戶甲反。" }
      - { type: z, text: "“諸侯”至“數制”。○正義曰：此一節論士大夫及諸侯等食祿之數，兼明臣之世與不世之事，今各隨文解之。○前以有“諸侯之下士”以上及大夫卿君，故此依前而釋也。諸侯之士既明，則天子士同之可知，故此文發畿外之卿也。前雲“諸侯下士視上農夫”，故有九人也。前雲“上士倍中士”，故三十六也。前雲“下大夫倍上士”，則食七十二人。前雲“卿四大夫祿”，則二百八十八人。○“君食二千”至“之卿”。○君謂大國之君也。前雲“君十卿祿”，故二千八百八十人。“次國之卿，食二百一十六人”者，謂夏伯殷侯，周則侯伯國也。此大夫以下，亦如大國大夫，而卿惟得三大夫祿耳，故特言卿也。○“君食二千一百六十人”者，君亦十卿祿也。○“小國之卿，食百四十四人”者，小國謂夏周子男，殷之伯國也。大夫以下，亦如大國大夫，而卿則二大夫祿耳。○“君食千四百四十人”者，君亦食卿祿也。○“次國之卿，命於其君”。○大國三卿，皆命於天子，則其祿各食二百八十八人。若次國三卿，二卿命於天子，祿各食二百一十六人，而一卿命於其君為賤，則祿不可等命天子者，故視小國卿，小國卿食一百四十四人也。其若子男一卿命於天子，二卿命於其君，則祿猶如此。其命天子卿無以異也，其國小，故不復差降也，或雲視大夫也。其天子之士卿大夫無文，宜準大國之卿大夫士也。○注“給齊”至“用潘”。○正義曰：以方伯朝天子，故給以湯沐之邑。按前文雲“不能五十里曰附庸”，又云“天子元士視附庸”，以湯沐之邑視元士，亦五十里以下。《異義》：“《公羊》說諸侯朝天子，天子之郊，皆有朝宿之邑；從泰山之下，皆有湯沐之邑。《左氏》說諸侯有功德於王室，京師有朝宿之邑，泰山有湯沐之邑。魯，周公之後。鄭，宣王母弟。此皆有湯沐邑，其餘則否。許慎謹按：京師之地皆有朝宿邑，周千八百諸侯，盡京師地，不能容之，不合事理之宜。”是許慎不從《公羊》之說。鄭無駁，當從許說。○注“謂縣”至“賢也”。○正義曰：知此大夫是天子大夫者，以下雲“諸侯之大夫，不世爵祿”，此直雲“大夫不世爵”，與諸侯大夫文異，故知是天子大夫也。知是縣內及列國諸侯入為天子大夫者，按《禮運》雲“天子有田以處其子孫”，則周召畢原之等，是縣內諸侯也。《詩》衛武公入相於周，又《尚書·顧命》齊侯為虎賁，衛侯為司寇，是列國諸侯也，併入為天子大夫。按《司裘》“諸侯，則共熊侯豹侯”，是畿內亦曰諸侯。此不雲諸侯而云大夫者，闢上諸侯世子之文，故云大夫。然畿內諸侯有為三公，則周召是也。列國諸侯入為六卿，則鄭武公是也。今總云為“天子大夫”者，若言公卿大夫，於文為煩，故總言大夫以包之。詩云“三事大夫”，謂三公也。春秋諸侯殺大夫，謂卿也。是大夫為總號。○“未賜爵，視天子之元士，以君其國”。○“未賜爵”，謂列國諸侯及縣內諸侯，其身既死，其子未得爵賜，其衣服禮制，視天子元士。若畿外者君其本國，畿內者亦君畿內之國，故鄭注云“列國及縣內之國”。鄭必知兼畿外列國者，以《詩·小雅》“靺鞈有奭”，謂諸侯世子未遇爵命，服士服而來。此雲“視天子之元士，以君其國”，故知兼列國也。其畿內諸侯有大功德，元子出封畿外，則王命次子守其采邑。若其賢才，則世為公卿，則春秋周公召伯之屬是也。○“諸侯之大夫不世爵祿”者，諸侯降於天子，故大夫不世爵祿。若有大功德，亦得世之，故隱八年“官有世功，則有官族，邑亦如之”，是據諸侯卿大夫也。" }
      - { type: j, text: "《禮記正義》" }
