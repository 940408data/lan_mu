# 爾雅注疏卷15（邢昺疏）：j 為經文＋晉郭璞注，z 為疏文。
sections:
  - id: juan15
    name: 正文
    blocks:
      - { type: z, text: "\"释水第十二\"。○释曰：《说文解字》云：\"水，准也。北方之行，象众水并流、中有微阳之气也。\"《白虎通》云：\"水之为言淮也。\"是平均法则之称。此篇释诸水之名，故曰释水。" }
      - { type: j, text: "泉一见一否为瀸。（瀸，才有貌。见，现。否，卑美反。瀸，纤）" }
      - { type: z, text: "\"泉一见一否为瀸\"。○释曰：《说文》云：\"泉，水原也。\"言此泉其水有时出见、有时不出而竭涸者名瀸。谓瀸微也。故注云：\"才有貌。\"" }
      - { type: j, text: "井一有水一无水为瀱汋。（《山海经》曰：\"天井夏有水冬无水。\"即此类也。○瀱，计。汋，仁捉切）" }
      - { type: z, text: "\"井一有水一无水为瀱汋\"。○释曰：《说文》云：井，凿地取水也。《释名》云：\"井，清也，泉之清潔者也。《世本》云伯益作，亦云黄帝始穿。此言井或一时有水、一时无水者名瀱汋也。○注\"山海\"至\"类也\"。○释曰：案《中山经》云：帝囷山\"东南五十里，曰视山，其上多韭。有井焉，名天井，夏有水，冬竭\"者是也。《孙子兵法》云：\"地陷曰天井。\"然则非人为之者曰天井。云\"即此类也\"者，以此经但言井，《山海经》言天井，非正相当，故云\"类也\"。" }
      - { type: j, text: "滥泉正出。正出，涌出也。（《公羊传》曰\"直出\"，直犹正也）" }
      - { type: z, text: "\"滥泉正出。正出，涌出也\"。○释曰：《诗•大雅•瞻卬》云：\"觱沸槛泉。\"故此释之也。《诗》言\"槛泉\"者，正直上出之泉也。其水涌出，故更云\"正出，涌出也\"。李巡曰：\"水泉从下上出曰涌泉。\"滥、槛音义同。○注\"《公羊》\"至\"正也\"。○释曰：案，昭五年传云：\"叔弓帅师败莒师于濆泉。濆泉者何？直泉也。直泉者，涌泉也。\"是其事也。郭云\"直出\"者，盖以义言之。彼言直，此言正，其意一也。故云\"直犹正也\"。" }
      - { type: j, text: "沃泉县出。县出，下出也。（从上溜下。○县，音玄）" }
      - { type: z, text: "\"沃泉县出\"至注\"从上溜下\"。○释曰：李巡亦云水泉从上溜下。然则相传为然也。《曹风》云：\"洌彼下泉。\"则此沃泉也。" }
      - { type: j, text: "氿泉穴出。穴出，仄出也。（从旁出也。○氿，轨。仄，侧）" }
      - { type: z, text: "\"氿泉穴出\"至注\"从旁出也\"。○释曰：李巡曰：\"水泉从旁出名曰氿。氿，仄出。\"是侧出曰氿泉也。《大东》云\"有洌氿泉\"是也。" }
      - { type: j, text: "湀辟，流川。（通流。○湀，揆）" }
      - { type: z, text: "\"湀辟，流川\"。注\"通流\"。○释曰：《说文解字》云：\"川，贯穿通流水也。《虞书》曰'浚畎浍距川'，言深畎浍之水会为川也。\"《释名》云：\"川，穿也。穿地而流也。\"然则湀辟者，则通流大川之别名也。" }
      - { type: j, text: "过辨，回川。（旋流。○过，古禾切。辨，片）" }
      - { type: z, text: "\"过辨，回川\"。注\"旋流\"。○释曰：回，旋也。言川水之中有回旋而流者，名过辨。" }
      - { type: j, text: "灉，反入。（即河水决出，复还入者。河之有灉，犹江之有沱。○灉，於用切）" }
      - { type: z, text: "\"灉，反入\"。○释曰：反，复也。谓河水决出而复入河者名灉。即下云\"水自河出为灉\"是也。" }
      - { type: j, text: "沾，沙出（今江东呼水中沙堆为沾，音但）" }
      - { type: z, text: "\"沾，沙出\"。○释曰：言沾者是沙堆於水中之名也。故曰沙出。" }
      - { type: j, text: "汧，出不流。（水流潜出，便自停成污池。○汧，音牵）" }
      - { type: z, text: "\"汧，出不流\"。○释曰：谓水泉潜出停成污池者名汧。《地理志》云：扶风汧县，\"雍州弦蒲薮。汧出西北，入渭\"。以其初出不流，停成弦蒲泽薮，故曰\"汧，出不流\"也。其终则入渭也。" }
      - { type: j, text: "归异出同流，肥。（《毛诗》传曰：\"所出同，所归异为肥。\"）" }
      - { type: z, text: "\"归异出同流，肥\"。○释曰：谓小水支分归入大水则异、其泉源初出则同流者，名肥。即《诗•邶风•泉水》云：\"我思肥泉，兹之永叹。\"毛传云：\"所出同，所归异为肥泉。\"是也。" }
      - { type: j, text: "瀵，大出尾下。（今河东汾阴县有水口如车轮许，濆沸涌出，其深无限，名之为瀵。冯翊郃阳县复有瀵，亦如之。相去数里而夹河，河中陼上又有一瀵，瀵源皆潜相通。在汾阴者，人壅其流以为陂，种稻，呼其本所出处为瀵魁，此是也。尾犹厎也。○瀵，音粪）" }
      - { type: z, text: "\"瀵，大出尾下\"。○释曰：尾犹厎也。言源深大出於厎下者名瀵。瀵犹洒散也。○注\"今河\"至\"厎也\"。○释曰：河东、冯翊者皆郡名也。云\"河中陼上\"者，陼谓水中可居之小者。云\"人壅其流以为陂种稻\"者，泽障曰陂，谓人畜壅此水以为陂泽，而溉稻田也。云\"瀵魁\"者，魁，帅也，首也。以其水源，故谓之魁也。" }
      - { type: j, text: "水醮曰厬。（谓水醮尽。○厬，音轨）" }
      - { type: z, text: "\"水醮曰厬\"。○释曰：醮，尽也。凡水之尽皆曰厬。厬，则竭涸之一名也。" }
      - { type: j, text: "水自河出为灉，（《书》曰：\"灉沮会同。\"）济为濋，汶为灛，洛为波，汉为潜，（《书》曰：\"沱潜既道。\"○濋，楚。汶，问。灛，阐。沱，陀）淮为浒，江为沱，（《书》曰：\"岷山导江，东别为沱。\"）濄为洵，颍为沙，汝为濆。（《诗》曰：\"遵彼汝坟。\"皆大水溢出，别为小水之名。○过，乌禾反。颍，馀顷反。濆，坟）" }
      - { type: z, text: "\"水自\"至\"汝为濆\"。○释曰：此十者皆大水分出，别为小水之名也。○注\"《书》曰：'灉沮会同。'\"○释曰：《禹贡》兖州云：\"雷夏既泽，灉沮会同。\"孔安国云：\"雷夏，泽名。灉、沮二水，会同此泽。\"引之证水自河出别名为灉也。○注\"《书》曰：'沱潜既道。'\"○释曰：《禹贡》梁州云：\"岷、嶓既艺，沱、潜既道。\"孔安国云：\"岷山、嶓冢，皆山名。沱、潜，发源此州，入荆州。\"案《地理志》云：蜀郡有湔道，\"岷山在西徼外，江水所出也\"。陇西郡西县，\"嶓冢山，西汉水所出\"。是二者皆山名也。沱出於江，潜出於汉，二水发源此州，而入荆州。故荆州亦云\"沱潜既道\"。案，郭氏《音义》云：\"沱水自蜀郡都水县扌前山与江别而更流。\"又云：\"有水从汉中、沔阳南流至梓潼、汉寿，入大穴中通峒山下西南潜出，一名沔水。旧俗云即《禹贡》潜也。\"郭氏此言，并解梁州沱潜也。然则此注言\"《书》曰\"者，亦指梁州者也。所以荆州亦有沱潜者，盖以水从江、汉出者，皆曰沱潜。所以荆梁二州皆有也。○注\"《书》曰：'岷山导江，东别为沱。'\"○释曰：亦《禹贡》文也。孔安国云：\"江东南流，沱东行。\"引之证江水溢出名沱也。○注\"《诗》曰：'遵彼汝坟。'\"○释曰：此《周南•汝坟》篇文也。毛传云：\"汝，水名也。坟，大防也。\"毛意以为伐薪宜於厓岸之上，故以大防解之。郭意以为汝濆所分之处有美地，因谓之濆。且毛传坟从土，此濆从水，所以异也。" }
      - { type: j, text: "水决之泽为汧。（水决入泽中者亦名为汧）" }
      - { type: z, text: "\"水决之泽为汧\"。○释曰：凡水为人所决陂障为泽者，亦与上\"出不流\"者同名汧也。" }
      - { type: j, text: "决复入为汜。（水出去复还）" }
      - { type: z, text: "\"决复入为汜\"。○释曰：凡水决之岐流复还本水者名汜。《诗•召南》云\"江有汜\"是也。" }
      - { type: j, text: "\"河水清且澜漪\"，大波为澜，（言涣澜。○澜，兰。漪，衣）小波为沦，（言蕴沦）直波为径。（言径侹）" }
      - { type: z, text: "\"河水\"至\"为径\"。○释曰：案《诗•魏风•伐檀》篇云：\"河水清且涟漪。\"又曰：\"河水清且直漪。\"又曰：\"河水清且沦漪。\"故此释之。毛传云：\"风行水成文曰涟。\"\"直，直波也。\"\"小风，水成文转如轮也。\"李巡云：\"分别水大小曲直之名。\"郭氏云：澜\"言涣澜\"，沦\"言蕴沦\"，径\"言径侹\"。然则澜、直、沦，论水波之异。漪，皆辞也。案《诗》涟、沦皆言波。名直波，不言径而言直，又在沦漪前者，取韵故也。澜、涟虽异而义同。\"澜漪\"先举《诗》文然後释之，直、沦不举者，省文，从可知也。" }
      - { type: j, text: "江有沱，河有灉，汝有濆。（此故上水别出耳，所作者重见）浒，水厓。（水边地）" }
      - { type: z, text: "\"浒，水厓\"。○注\"水边地\"。○释曰：谓水边厓岸之地别名浒。李巡曰：\"浒，水边地名，厓也。\"《诗•大雅•江汉》云\"江汉之浒\"是也。" }
      - { type: j, text: "水草交为湄。（《诗》曰：\"居河之湄。\"○湄，音眉）" }
      - { type: z, text: "○注\"《诗》曰：'居河之湄。'\"○释曰：此《小雅•巧言》之篇文也。以《诗》有此言，故释之。云\"水草交为湄\"，李巡曰：\"水中有草木交会曰湄。\"今《诗》作麋，音义同。" }
      - { type: j, text: "\"济有深涉，（谓济渡之处。○济，子细切）深则厉，浅则揭\"。揭者，揭衣也。（谓褰裳也。○揭，上二字音憩，下丘竭切）以衣涉水为厉。（衣谓禅）繇膝以下为揭，繇膝以上为涉，繇带以上为厉。（繇，自也。○繇音由。上，时掌反）" }
      - { type: z, text: "\"济有\"至\"为厉\"。○释曰：案《诗•邶风•匏有苦叶》：\"济有深涉，深则厉，浅则揭。\"故此先引《诗》文，然後释之。云\"揭者，揭衣也\"。谓度处水浅，惟褰裳可涉者名揭。注云\"谓褰裳也\"者，对文言之，则在上曰衣，在下曰裳；散而言之则通。是以此经言\"揭衣\"，注言\"褰裳\"。《曲礼》云：\"两手抠衣去齐尺。\"衣亦谓裳也。云\"以衣涉水为厉\"者，此衣谓裈也。言水深至於裈以上者而涉渡者，名厉。云\"繇膝以下为揭\"者，此更释揭、涉及厉之名。繇与由同，繇，由也。言水浅自膝以下为揭，水差深自膝以上者为涉，水若深至衣带以上者为厉。注云：\"繇，自也\"，释诂文。" }
      - { type: j, text: "潜行为泳。（水厎行也。《晏子春秋》曰：\"潜行，逆流百步，顺流七里。\"）" }
      - { type: z, text: "\"潜行为泳\"。○释曰：谓人潜隐水厎而行者，名为泳。《诗•周南•汉广》云：\"汉之广矣，不可泳思。\"是矣。○注\"《晏子》\"至\"七里\"。○释曰：晏子者，名婴，谥平仲，相齐景公，孔子称善与人交者也。著书谓之《晏子春秋》。云：景公蓄勇士。公孙接、田开疆、古治子事景公，以勇力搏於虎问。晏子而趋，三子者不起，晏子见公，请去之。公乃使人餽之二桃，令三子计功而食。公孙接曰：\"接一搏特猏，再搏乳虎，若接之功，可以食桃，而毋与人同矣。\"援桃而起。田开疆曰：\"吾杖兵却三军者再，若开疆之功，可以食桃，而毋与人同矣。\"援桃而起。古冶子曰：\"吾尝从君济於河，鼋衔左骖以入砥柱之中流。当是时也，治少不能游，潜行，逆流百步，顺流九里，得鼋而杀之，左操马尾，右挈鼋头，鹤跃而出。津人皆曰：'河伯也！'治之视之，则大鼋之首也。若冶之功，可以食桃，而毋与人同矣。\"二子耻功不逮而自杀，古冶子亦自杀。是其所引之文也。以证潜行为泳之事也。但彼作九里，此作七里，盖传写误或所见本异也。" }
      - { type: j, text: "\"汎汎杨舟，绋缡维之。\"绋，𦆽也。（𦆽，索。○绋，弗。缡，离。𦆽，律）缡，緌也。（緌，系。○緌，加谁切）" }
      - { type: z, text: "\"汎汎\"至\"緌也\"。○释曰：\"汎汎杨舟，绋缡维之。\"此《诗•小雅•采菽》篇文也。云\"绋，𦆽也。缡，緌也\"，此释《诗》绋、缡之义也。李巡云：\"𦆽，竹为索，所以维持舟者。\"郭云：\"緌，系。\"孙炎云：\"舟止系之於树木，戾竹为大索。\"然则绋训为𦆽，𦆽是絙。缡训为緌，緌又为系。正谓舟之止息以絙系而维持之也。" }
      - { type: j, text: "天子造舟，（比船为桥。○造，七到切）诸侯维舟，（维连四船）大夫方舟，（并两船）土特舟，（单船）庶人乘泭。（并木以渡。泭，音桴）" }
      - { type: z, text: "\"天子\"至\"乘泭\"。○释曰：此释尊卑桥船之异制也。云\"天子造舟\"者，《诗•大雅•大明》云\"造舟为梁\"是也。言\"造舟\"者，比船於水，加版於上，即今之浮桥。故杜预云：\"造舟为梁，则河桥之谓也。\"\"维舟\"以下，则水上浮而行，但船有多少为差等耳。云\"庶人乘泭\"者，《诗•汉广》云：\"江之永矣，不可方思。\"毛传云：\"方，泭也。\"《释言》云：\"舫，泭。\"郭注云：\"水中篺筏。\"《论语》曰：\"乘桴浮於海。\"注云：\"桴，编竹木，大曰筏，小曰桴。\"是也。桴、泭音义同。" }
      - { type: j, text: "水注川曰谿，注谿曰谷，注谷曰沟，注沟曰浍，注浍曰渎。（此皆道水转相灌注所入之处名。○浍，古外切）" }
      - { type: z, text: "\"水注\"至\"曰渎\"。注\"此皆道水转相灌注所入之处名\"也。○释曰：郭云：\"转相灌注\"者，盖以川渎皆水之大者也。《虞书》云：\"浚畎浍距川。\"下云\"江、河、淮、济为四渎\"是也。今若言\"水注川曰谿\"，谓水之注入川者名谿，则注入沟者名浍，沟小如浍岂能容乎？若言\"注沟曰浍\"，谓注沟水入之名浍，则注川水入之者名谿，杜预云：\"谿，亦涧也\"，岂能容受川水乎？然则\"水注川曰谿\"，是涧、谿之水注入於川也。故李巡云：\"水出於山入於川曰谿。\"\"注谿曰谷\"，谓山谷中水注入涧谿也。\"注谷曰沟\"，此以下与上不类，谓山谷中水无涧谿者，注入平地之沟。沟广深四尺。注云：浍\"广二寻，深二仞\"。\"注沟曰浍\"，谓注沟水入之者名浍。注浍水入之者名渎。故注云\"转相灌注\"也。" }
      - { type: j, text: "逆流而上曰溯洄，顺流而下曰溯游。（皆见《诗》。○溯，音素）" }
      - { type: z, text: "\"逆流\"至\"溯游\"。注\"皆见《诗》\"。○释曰：案《诗•秦风•蒹葭》云：\"溯洄从之，道阻且长；溯游从之，宛在水中央。\"是也。孙炎曰：\"逆渡者，逆流也。顺渡者，顺流也。\"然则逆流顺流，皆谓渡水有逆顺也。" }
      - { type: j, text: "正绝流曰乱。（直横渡也。《书》曰：\"乱于河。\"）" }
      - { type: z, text: "\"正绝流曰乱\"。○释曰：正，直也。谓横绝其流而直渡，名曰乱。○注\"《书》曰：'乱于河。'\"○释曰：案《禹贡》梁州云：\"入于渭，乱于河。\"孔安国云：\"越沔而北入渭，浮东渡河而还帝都曰所治。\"以帝都在河之东，故直横渡河，陆行而还帝都也。彼孔氏引此文，故以为证也。" }
      - { type: j, text: "江、河、淮、济为四渎。四渎者，发源注海者也。" }
      - { type: z, text: "\"江河\"至\"者也\"。○释曰：案《白虎通》云：\"渎者何？谓渎。中国恬浊，发源而注海，其功著大，称渎也。\"案《禹贡》云：\"导河积石，至于龙门；南至于华阴，东至于底柱；又东至于孟津，东过洛汭，至于大伾；北过降水，至于大陆；又北，播为九河，同为逆河，入于海。\"\"岷山导江，东别为沱；又东至于澧，过九江，至于东陵；东迤北，会于汇；东为中江，入于海。导沇水，东流为济，入于河，溢为荣；东出于陶丘北，又东至于菏；又东北，会于汶；又东北，入于海。导淮自桐柏，东会于泗、沂，东入于海。\"是发源注海者也。" }
      - { type: j, text: "水泉。" }
      - { type: z, text: "\"水泉\"。○释曰：题上事也。下皆仿此。" }
      - { type: j, text: "水中可居者曰洲，小洲曰陼，小陼曰沚，小沚曰坻，人所为为潏。（人力所作。○陼，渚。坻，池。潏，述）水中。" }
      - { type: z, text: "\"水中\"至\"为潏\"。○释曰：此一段释水中之地名也。故下题云\"水中\"。案，李巡云：\"四方皆有水，中央独可居，但大小异其名耳。若人所作者则名潏。\"《周南》云：\"在河之洲。\"《召南》云：\"江有渚。\"《采蘩》云：\"于沼于沚。\"《秦风•蒹葭》云：\"宛在水中坻。\"是其所出之文也。" }
      - { type: j, text: "河出昆仑虚，色白。（《山海经》曰：\"河出昆仑西北隅。\"虚，山下基也）所渠并千七百，一川色黄。（潜流地中，汨潄沙壤，所受渠多，众水溷淆，宜其浊黄）百里一小曲，千里一曲一直。（《公羊传》曰：河曲流，河千里一曲一直）河曲。" }
      - { type: z, text: "\"河出\"至\"一直\"。○释曰：此一段释河源所自及远近曲直之势也。故下题云\"河曲\"。云\"河出昆仑虚，色白\"者，昆仑，山名。虚，山下基也。言河源出於昆仑山下之基，其初纤微，源高激凑，故水色白也。云\"所渠并千七百\"者，谓所受之渠，并计凡有一千七百也。云\"一川色黄\"者，以其所受渠多，沙壤溷淆，故为一川而水色黄也。云\"百里一小曲，千里一曲一直\"者，此河自然之势也。故谓之\"河曲\"。○注\"山海\"至\"北隅\"。○释曰：案《海内西经》云：\"帝之下都，昆仑之虚，方八百里，高万仞。\"\"河水出东北隅，以行其北，西南又入渤海，又出海外，即西北而北，入禹所导积石山。\"又《北山经》云：\"敦梦山，敦梦水出焉，西注泑泽。出乎昆仑东北隅，实为河源。\"郭注云：即\"河出昆仑虚\"也。今注云\"西北\"者，盖所见本异或传写误。○注\"潜流\"至\"浊黄\"。○释曰：云\"潜流地中\"者，案《汉书•西域传》云：\"河有两源：一出葱岭，一出于阗。于阗在南山下，其河北流与葱岭河合，东注蒲昌海。蒲昌海一名盐泽者，去玉门阳关三百馀里，广袤三四百里，其水停居，冬夏不增减，皆以为潜行地下，南出于积石，为中国河。\"又《山海经》云：\"不周山，东望泑泽，河水之所潜也，其源浑浑泡泡。\"郭注云：\"河出昆仑，潜行地下至葱岭山、于阗国复分流岐出，合而东流注泑泽。又复潜行，南出于积石而为中国河。\"泑泽，一名蒲昌海。潜行，浑浑泡泡，水濆涌之貌，是潜流地中也。《说文》云：汨，水流也。溷，浊也。淆，杂乱也。言水流潄其沙壤，所受之渠又多，众水溷浊杂乱，所以宜其水浊且黄也。○注\"《公羊》\"至\"一直\"。○释曰：此文十二年传文也。案，彼经云：\"晋人、秦人战于河曲。\"传云：\"曷为以水地？河曲疏矣，河千里而一曲也。\"言其河曲之地疏阔，故可战也。引之证河必千里一曲一直之义。然此注以\"疏\"为\"流\"，又加\"一直\"字，误也。" }
      - { type: j, text: "徒骇、（今在成平县，义所未闻。骇，谐秸切）太史、（今所在未详）马颊、（河势上广下狭，状如马颊）覆鬴、（水中可居，往往而有，状如覆釜。○覆，扶服切。鬴，父）胡苏、（东莞县今有胡苏亭，其义未详）简、（水道简易）絜、（水多约絜）钩盘、（水曲如钩流盘桓也）鬲津。（水多阨狭，可隔以为津而横渡。○鬲，革）九河。（从《释地》已下至九河，皆禹所名也）" }
      - { type: z, text: "\"徒骇\"至\"鬲津\"。○释曰：案《禹贡》云：\"九河既导。\"故此释其名，下即题云\"九河\"也。李巡曰：\"徒骇者，禹疏九河以徒众起，故曰徒骇。大史，禹大使徒众，通其水道，故曰大史。马颊，河势上广下狭，状如马颊也。覆釜，水中多渚，往往而处，形如覆釜。胡苏，其水下流，故曰胡苏。胡，下也。苏，流也。简，大也。河水深而大也。絜，言河水多山石，治之苦絜。絜，苦也。钩盘，言河水曲如钩，屈折如盘也。鬲津，河水狭小，可隔以为津也。\"孙炎曰：\"徒骇，禹疏九河用功虽广，众惧不成，故曰徒骇。胡苏，水流多散胡苏然。\"其馀同李巡。郭云：\"徒骇，今在成平。\"\"东光县今有胡苏亭。\"马颊、覆鬴、鬲津之名同李巡。絜，云水多约絜。钩盘，水曲如钩流盘桓也。馀名皆云其义未详。计禹疏九河，云复其故道，则名应先有，不宜徒骇、太史因禹立名，此郭氏所以未详也。或九河虽旧有名，至禹治水更别立名，即此所云是也。《汉书•沟洫志》：成帝时，河堤都尉许商上书曰：\"古记九河之名，有徒骇、胡苏、鬲津，今见在成平、东光、鬲县界中。自鬲津以北至徒骇，其间相去二百馀里。\"是知九河所在，徒骇最北，鬲津最南。盖徒骇是河之本道，东出分为八枝也。许商上言三河，下言三县，则徒骇在成平，胡苏在东光，鬲津在鬲县，其馀不复知也。此九河之次，从北而南，既知三河之处，则其馀六者：太史、马颊、覆釜，在东光之北，成平之南；简、絜、钩盘，在东光之南，鬲县之北也。其河填塞时有故道。郑玄云：\"周时齐桓公塞之同为一河。\"今河间弓高以东至平原鬲津，往往有其遗处。《春秋纬宝乾图》云：\"移河为界，在齐吕填阏八流以自广。\"郑玄盖据此文为桓公塞之也。言阏八流拓境，则塞其东流八枝，并使归於徒骇也。此九河之名义也。案，胡苏在东光，定本注作东筦，\"筦\"当作\"光\"，字之误也。○\"从《释地》已下至九河，皆禹所名也。○释曰：谓《释地》已下凡四篇，其中五岳、四渎及诸山川、丘陵之名皆禹所制也。然山川等名其来尚矣。治水之後，更复改新。言此名是禹所制，非禹始为名也。" }
