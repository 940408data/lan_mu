# 遵生八箋 卷三 四時調攝箋：點校中導覽（teaser）
# 原文據識典古籍四庫全書本，標點自施；導語/解讀為 AI 原創
sections:
  - id: sishi
    name: 四時調攝箋
    blocks:
      - type: j
        text: 四時調攝箋
      - type: z
        text: 導：此箋錄四時陰陽運用之機，配五臟寒溫順逆，因時系以方藥導引。薦語：與四時合其序。
      - type: j
        text: 高子曰：時之義大矣，天下之事未有外時以成者也。故聖人與四時合其序，而月令一書，尤養生家之不可少者。
      - type: z
        text: 讀：以「時」字開宗，養生之序繫於四時——聖人猶與之合序，況常人乎。
      - type: j
        text: 不務博而信怪誕不經之條，此類悉刪去而不存。不尚簡而棄禦災防患之術，此並增入而不置。
      - type: z
        text: 讀：所刪所增，見作者之識：不信怪、不棄用。讀此箋宜先知此去取之義。
