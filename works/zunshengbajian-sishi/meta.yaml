  colophon: 依<b>刻本</b>版式排比：一版兩個半葉，中縫為版心。大字單行，一列遇節別行。<br>版心上下留白口，上鐫單黑魚尾，次書名卷次、葉次，末署刻工姓名。<br>《遵生八箋》明高濂撰，分八目：清修妙論、四時調攝、起居安樂、延年卻病、飲饌服食、燕閒清賞、靈秘丹藥、塵外遐舉；此帙擬收卷一「清修妙論箋上」。<br>本卷正在點校，正文俟點校藏事而後公開。
