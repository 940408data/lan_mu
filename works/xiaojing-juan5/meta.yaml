aboutHtml: |-
  <h2>關於此卷</h2>
  <p>《孝經注疏》為宋邢昺疏，以唐玄宗注為本，為十三經注疏之一。孝經十八章，言孝之始終，此卷以宋刻本版式數字重刻，半葉八行、行十六字、注文雙行二十五字。</p>
  <p>卷五收聖治章第九，經注疏全帙。</p>
