# 论语集注卷八（当涂郡斋刊递修本·善本底）：j 为经传大字，z 为章句小字。版面结构先行：顶格经/退格注。
sections:
  - id: pian1
    name: 衛靈公第十五
    blocks:
      - { type: z, text: 凡四十一章 }
      - { type: j, text: 衛靈公問陳於孔子孔子對曰俎豆之事則嘗聞之矣軍旅之事未之學也明日遂行陳去聲陳謂軍師行伍之列俎豆禮器尹氏曰衛靈公無道之君也復有志於戰伐之事故答以未學而去 }
      - { type: z, text: 之 }
      - { type: j, text: 在陳絕糧從者病莫能興 }
      - { type: z, text: 從去聲○孔子去衛適陳興起也 }
      - { type: j, text: 子路慍見曰君子亦有窮乎子曰君子固窮小人窮斯濫矣 }
      - { type: z, text: 見賢遍反○何氏曰濫溢也言君子固有窮時不若小人窮則放溢為非程子曰固窮者固守其窮亦通○愚謂聖人當行而行無所顧慮處困而亨無所怨悔於此可見學者宜深味之 }
      - { type: j, text: 子曰賜也女以予為多學而識之者與 }
      - { type: z, text: 女音汝識音志與平聲下同○子貢之學多而能識矣夫子欲其知所本也故問以發之 }
      - { type: j, text: 對曰然非與 }
      - { type: z, text: 方信而忽疑蓋其積學功至而亦將有得也 }
      - { type: j, text: 曰非也予一以貫之 }
      - { type: z, text: 說見第四篇然彼以行言而此以知言也○謝氏曰聖人之道大矣人不能徧觀而盡識宜其以爲多學而識之也然聖人豈務博者哉如天之於衆形匪物物刻而雕之也故曰予一以貫之德輶如毛毛猶有倫上天之載無聲無臭至矣尹氏曰孔子之於曾子不待其問而直告之以此曾子復深喻之曰唯若子貢則先發其疑而後告之而子貢終亦不能如曾子之唯也二子所學之淺深於此可見愚按夫子之於子貢婁有以發之而他人不與焉則顏曾以下諸子所學之淺深又可見矣 }
      - { type: j, text: 子曰由知德者鮮矣 }
      - { type: z, text: 鮮上聲○由呼子路之名而告之也德謂義理之得於己者非己有之不能知其意味之實也○自第一章至此疑皆一時之言此章蓋為慍見發也 }
      - { type: j, text: 子曰無為而治者其舜也與夫何為哉恭己正南靣而已矣 }
      - { type: z, text: 與平聲夫音扶○無為而治者聖人德盛而民化不待其有所作為也獨稱舜者紹堯之後而又得人以任眾職故尤不見其有為之迹也恭己者聖人敬德之容既無所為則人之所見如此而已 }
      - { type: j, text: 子張問行 }
      - { type: z, text: 猶問達之意也 }
      - { type: j, text: 子曰言忠信行篤敬雖蠻貊之邦行矣言不忠信行不篤敬雖州里行乎哉 }
      - { type: z, text: 行篤行不之行去聲貊亡百反○子張意在得行於外故夫子反於身而言之猶答干祿問達之意也篤厚也蠻南蠻貊北狄二千五百家爲州 }
      - { type: j, text: 立則見其參於前也在輿則見其倚於衡也夫然後行 }
      - { type: z, text: 參七南反夫音扶○其者指忠信篤敬而言參讀如母往參焉之參言與我相參也衡軛也言其於忠信篤敬念念不忘隨其所在常若有見雖欲頃刻離之而不可得然後一言一行自然不離於忠信篤敬而蠻貊可行 }
      - { type: j, text: 也子張書諸紳 }
      - { type: z, text: 紳大帶之垂者書之欲其不忘也○程子曰學要鞭辟近裏著己而已博學而篤志切問而近思言忠信行篤敬立則見其參於前在輿則見其倚於衡只此是學質美者明得盡查滓便渾化却與天地同體其次惟莊敬以持養之及其至則一也 }
      - { type: j, text: 子曰直哉史魚邦有道如矢邦無道如矢 }
      - { type: z, text: 史官名魚衛大夫名鰌如矢言直也史魚自以不能進賢退不肖既死猶以尸諫故夫子稱其直事見家語 }
      - { type: j, text: 君子哉蘧伯玉邦有道則仕邦無道則可卷而懷之 }
      - { type: z, text: 伯玉出處合於聖人之道故曰君子卷收也懷藏也如於孫林父甯殖放弑之謀不對而出亦其事也○楊氏曰史魚之直未盡君子之道若蘧伯玉然後可免於亂世若史魚之如矢則雖欲卷而懷之有不可得也 }
      - { type: j, text: 子曰可與言而不與之言失人不可與言而與之言失言知者不失人亦不失言 }
      - { type: z, text: 知去聲 }
      - { type: j, text: 子曰志士仁人無求生以害仁有殺身以成仁 }
      - { type: z, text: 志士有志之士仁人則成德之人也理當死而求生則於其心有不安矣是害其心之德也當死而死則心安而德全矣○程子曰實理得之於心 }
      - { type: j, text: 自別實理者實見得是實見得非也古人有捐軀隕命者若不實見得惡能如此須是實見得生不重於義生不安於死也故有殺身以成仁者只 }
      - { type: z, text: 是成就一箇是而已 }
      - { type: j, text: 子貢問為仁子曰工欲善其事必先利其器居是邦也事其大夫之賢者友其士之仁者 }
      - { type: z, text: 賢以事言仁以德言夫子甞謂子貢悅不若己者故以是告之欲其有所嚴憚切磋以成其德也○程子曰子貢問為仁非問仁也故孔子告之以為仁之資而已 }
      - { type: j, text: 顏淵問為邦 }
      - { type: z, text: 顏子王佐之才故問治天下之道曰為邦者謙辭 }
      - { type: j, text: 子曰行夏之時夏時謂以斗柄初昏建寅之月為歲首也天開於子地闢於丑人生於寅故斗 }
      - { type: z, text: 柄建此三辰之月皆可以為歲首而三代迭用之夏以寅為人正商以丑為地正周以子為天正也然時以作事則歲月自當以人為紀故孔子嘗曰吾得夏時焉而說者以為謂夏小正之屬蓋取其時之正與其令之善而於此又以告顏子也 }
      - { type: j, text: 乘殷之輅 }
      - { type: z, text: 輅音路亦作路○商輅木輅也輅者大車之名古者以木為車而已至商而有輅之名蓋始異其制也周人飾以金玉則過侈而易敗不若商輅之朴素渾堅而等威已辨為質而得其中也 }
      - { type: j, text: 服周之冕 }
      - { type: z, text: 周冕有五祭服之冠也冠上有覆前後有旒黃帝以來蓋已有之而制度儀等至周始備然其為物小而加於衆體之上故雖華而不為靡雖費而不及奢夫子取之蓋亦以為文而得其中也 }
      - { type: j, text: 樂則韶舞 }
      - { type: z, text: 取其盡善盡美 }
      - { type: j, text: 放鄭聲遠佞人鄭聲淫佞人殆 }
      - { type: z, text: 遠去聲○放謂禁絕之鄭聲鄭國之音佞人卑諂辨給之人殆危也○程子曰問政多矣惟顏淵告之以此蓋三代之制皆因時損益及其久也不能無弊周衰聖人不作故孔子斟酌先王之禮立萬世常行之道發此以爲之兆爾由是求之則餘皆可考也張子曰禮樂治之法也放鄭聲遠佞人法外意也一曰不謹則法壞矣虞夏君臣更相飭戒意蓋如此又曰法立而能守則德可乆業可大鄭聲佞人能使人喪其所守故放遠之尹氏曰此所謂百王不易之大法孔子之作春秋蓋此意也孔顔雖不得行之於時然其爲治之法可得而見矣 }
      - { type: j, text: 子曰人無遠慮必有近憂 }
      - { type: z, text: 蘇氏曰人之所履者容足之外皆爲無用之地而不可廢也故慮不在千里之外則患在几席之下矣 }
      - { type: j, text: 子曰已矣乎吾未見好德如好色者也 }
      - { type: z, text: 好去聲○已矣乎歎其終不得而見也 }
      - { type: j, text: 子曰臧文仲其竊位者與知柳下惠之賢而不與立也 }
      - { type: z, text: 者與之與平聲○竊位言不稱其位而有愧於心如盜得而隂據之也柳下惠魯大夫展獲字禽食邑柳下謚曰惠與立謂與之並立於朝范氏曰臧文仲爲政於魯若不知賢是不明也知而不舉是蔽賢也不明之罪小蔽賢之罪大故孔子以爲不仁又以爲竊位 }
      - { type: j, text: 子曰躬自厚而薄責於人則遠怨矣 }
      - { type: z, text: 遠去聲○責己厚故身益脩責人薄故人易從所以人不得而怨之 }
      - { type: j, text: 子曰不曰如之何如之何者吾末如之何也已矣 }
      - { type: z, text: 如之何如之何者熟思而審處之辭也不如是而妄行雖聖人亦無如之何矣 }
      - { type: j, text: 子曰羣居終日言不及義好行小慧難矣哉 }
      - { type: z, text: 好去聲○小慧私智也言不及義則放辟邪侈之心滋好行小慧則行險僥倖之機熟難矣哉者言其無以入德而將有患害也 }
      - { type: j, text: 子曰君子義以爲質禮以行之孫以出之信以成之君子哉 }
      - { type: z, text: 孫去聲○義者制事之本故以爲質榦而行之必有節文出之必以退遜成之必在誠實乃君子之道也○程子曰義以爲質如質榦然禮行此孫出此信成此此四句只是一事以義為本又曰敬以直内則義以方外義以為質則禮以行之孫以出之信以成之 }
      - { type: j, text: 子曰君子病無能焉不病人之不己知也子曰君子疾没世而名不稱焉 }
      - { type: z, text: 范氏曰君子學以為己不求人知然没世而名不稱焉則無為善之實可知矣 }
      - { type: j, text: 子曰君子求諸己小人求諸人 }
      - { type: z, text: 謝氏曰君子無不反求諸己小人反是此君子小人所以分也○楊氏曰君子雖不病人之不己知然亦疾没世而名不稱也雖疾没世而名不稱然所以求者亦反諸己而已小人求諸人故違道干譽無所不至三者文不相蒙而義實相足亦記言者之意 }
      - { type: j, text: 子曰君子矜而不爭羣而不黨 }
      - { type: z, text: 莊以持己曰矜然無乖戾之心故不爭和以處衆曰羣然無阿比之意故不黨 }
      - { type: j, text: 子曰君子不以言舉人不以人廢言子貢問曰有一言而可以終身行之者乎子曰其恕乎己所不欲勿施於人 }
      - { type: z, text: 推己及物其施不窮故可以終身行之○尹氏曰學貴於知要子貢之問可謂知要矣孔子告以求仁之方也推而極之雖聖人之無我不出乎此終身行之不亦宜乎 }
      - { type: j, text: 子曰吾之於人也誰毀誰譽如有所譽者其有所試矣 }
      - { type: z, text: 譽平聲○毀者稱人之惡而損其實譽者揚人之善而過其實夫子無是也然或有所譽者則必嘗有以試之而知其將然矣聖人善善之速而無所苟如此若其惡惡則已緩矣是以雖有以前知其惡而終無所毀也 }
      - { type: j, text: 斯民也三代之所以直道而行也 }
      - { type: z, text: 斯民者今此之人也三代夏商周也直道無私曲也言吾之所以無所毀譽者蓋以此民即三代之時所以善其善惡其惡而無所私曲之民故我今亦不得而枉其是非之實也○尹氏曰孔子之於人也豈有意於毀譽之哉其所以譽之者蓋試而知其美 }
      - { type: j, text: 故也斯民也三代之所以直道而行豈 }
      - { type: z, text: 得容私於其間哉 }
      - { type: j, text: 子曰吾猶及史之闕文也有馬者借人秉之今亡已夫 }
      - { type: z, text: 夫音扶○楊氏曰史闕文馬借人此 }
      - { type: j, text: 二事孔子猶及見之今亡已夫悼時之益偷也愚謂此必有為而言蓋雖細故而時變之大者可知矣胡氏曰 }
      - { type: z, text: 此章義疑不可強解 }
      - { type: j, text: 子曰巧言亂德小不忍則亂大謀 }
      - { type: z, text: 巧言變亂是非聽之使人喪其所守小不忍如婦人之仁匹夫之勇皆是 }
      - { type: j, text: 子曰衆惡之必察焉衆好之必察焉 }
      - { type: z, text: 好惡並去聲○楊氏曰惟仁者能好惡人衆好惡之而不察則或蔽於私矣 }
      - { type: j, text: 子曰人能弘道非道弘人 }
      - { type: z, text: 弘廓而大之也人外無道道外無人然人心有覺而道體無爲故人能大其道道不能大其人也○張子曰心能盡性人能洪道也性不知檢其心非道洪人也 }
      - { type: j, text: 子曰過而不改是謂過矣 }
      - { type: z, text: 過而能改則復於無過唯不改則其過遂成而將不及改矣 }
      - { type: j, text: 子曰吾嘗終日不食終夜不寢以思句無益句不如學也 }
      - { type: z, text: 此爲思而不學者言之蓋勞心以必求不如遜志而自得也○李氏曰夫子非思而不學者特垂語以教人爾 }
      - { type: j, text: 子曰君子謀道不謀食耕也餒在其中矣學也祿在其中矣君子憂道不憂貧 }
      - { type: z, text: 餒奴罪反○耕所以謀食而未必得食學所以謀道而祿在其中然其學也憂不得乎道而已非爲憂貧之故而欲為是以得祿也○尹氏曰君子治其本而不卹其末豈以在外者為憂樂哉 }
      - { type: j, text: 子曰知及之仁不能守之雖得之必失之 }
      - { type: z, text: 知去聲○知足以知此理而私欲間之則無以有之於身矣 }
      - { type: j, text: 知及之仁能守之不莊以涖之則民不敬 }
      - { type: z, text: 涖臨也謂臨民也知此理而無私欲以閒之則所知者在我而不失矣然猶有不莊者蓋氣習之偏或有厚於內而不嚴於外者是以民不見其可畏而慢易之下句放此 }
      - { type: j, text: 知及之仁能守之莊以涖之動之不以禮未善也 }
      - { type: z, text: 動之動民也猶曰鼓舞而作興之云爾禮謂義理之節文○愚謂學至於仁則善有諸己而大本立矣涖之不莊動之不以禮乃其氣禀學問之小疵然亦非盡善之道也故夫子歷言之使知德愈全則責愈備不可以爲小節而忽之也 }
      - { type: j, text: 子曰君子不可小知而可大受也小人不可大受而可小知也 }
      - { type: z, text: 此言觀人之法知我知之也受彼所受也蓋君子於細事未必可觀而材德足以任重小人雖器量淺狹而未必無一長可取 }
      - { type: j, text: 子曰民之於仁也甚於水火水火吾見蹈而死者矣未見蹈仁而死者也 }
      - { type: z, text: 民之於水火所頼以生不可一日無 }
      - { type: j, text: 其於仁也亦然但水火外物而仁在已無水火不過害人之身而不仁則失其心是仁有甚於水火而尤不可以一日無也况水火或有時而殺人仁則未甞殺人亦何憚而不爲哉 }
      - { type: z, text: 李氏曰此夫子勉人爲仁之語下章放此 }
      - { type: j, text: 子曰當仁不讓於師 }
      - { type: z, text: 復於善而不當復論其類之惡矣 }
      - { type: j, text: 子曰道不同不相爲謀 }
      - { type: z, text: 爲去聲○不同如善惡邪正之異 }
      - { type: j, text: 子曰辭達而已矣 }
      - { type: z, text: 詞取達意而止不以冨麗爲工 }
      - { type: j, text: 師冕見及階子曰階也及席子曰席也皆坐子告之曰某在斯某在斯 }
      - { type: z, text: 見賢遍反○師樂師瞽者冕名再言某在斯歷舉在坐之人以詔之 }
      - { type: j, text: 師冕出子張問曰與師言之道與 }
      - { type: z, text: 與平聲○聖門學者於夫子之一言一動無不存心省察如此 }
      - { type: j, text: 子曰然固相師之道也 }
      - { type: z, text: 相去聲○相助也古者瞽必有相其道如此蓋聖人於此非作意而爲之但盡其道而已○尹氏曰聖人處己當仁以仁爲己任也雖師亦無所遜言當勇往而必爲也蓋仁者人所自有而自爲之非有爭也何遜之有○程子曰爲仁在己無所與遜若善名在外則不可不遜 }
      - { type: j, text: 子曰君子貞而不諒 }
      - { type: z, text: 貞正而固也諒則不擇是非而必於信 }
      - { type: j, text: 子曰事君敬其事而後其食後與後獲之後同食祿也君子之仕 }
      - { type: z, text: 也有官守者修其職有言責者盡其忠皆以敬吾之事而已不可先有求祿之心也 }
      - { type: j, text: 子曰有教無類 }
      - { type: z, text: 人性皆善而其類有善惡之殊者氣習之染也故君子有教則人皆可以為人其心一致無不盡其誠故也有志於學者求聖人之心於斯亦可見矣○范氏曰聖人不侮鰥寡不虐無告可見於此推之天下無一物不得其所矣 }
  - id: pian2
    name: 季氏第十六
    blocks:
      - { type: z, text: 洪氏曰此篇或以為齊論凡十四章 }
      - { type: j, text: 季氏將伐顓臾顓音專臾音俞顓臾國名魯附庸 }
      - { type: z, text: 也 }
      - { type: j, text: 冉有季路見於孔子曰季氏將有事於顓臾見賢遍反按左傳史記二子仕季氏不同時此云爾者疑子路嘗從孔子自衛反魯再仕季氏不乆而復之 }
      - { type: z, text: 衛也 }
      - { type: j, text: 孔子曰求無乃爾是過與與平聲冉求爲季氏聚歛尤用事 }
      - { type: z, text: 故夫子獨責之 }
      - { type: j, text: 夫顓臾昔者先王以爲東蒙主且在邦域之中矣是社稷之臣也何以伐爲 }
      - { type: z, text: 夫音扶○東蒙山名先王封顓臾於此山之下使主其祭在魯地七百里之中社稷猶云公家是時四分魯國季氏取其二孟孫叔孫各有其一獨附庸之國尚爲公臣季氏又欲取以自益故孔子言顓臾乃先王封國則不可伐在邦域之中則不必伐是社稷之臣則非季氏所當伐也此事理之至當不易之定體而一言盡其曲折如此非聖人不能也 }
      - { type: j, text: 冉有曰夫子欲之吾二臣者皆不欲也 }
      - { type: z, text: 夫子指季孫冉有實與謀以孔子非之故歸咎於季氏 }
      - { type: j, text: 孔子曰求周任有言曰陳力就列不能者止危而不持顛而不扶則將焉用彼相矣 }
      - { type: z, text: 任平聲焉於虔反相去聲下同○周任古之良史陳布也列位也相瞽者之相也言二子不欲則當諫諫而不聽則當去也 }
      - { type: j, text: 且爾言過矣虎兕出於柙龜玉毀於櫝中是誰之過與 }
      - { type: z, text: 兕徐履反柙户甲反櫝音獨與平聲兕野牛也柙檻也櫝匱也言在柙而逸在櫝而毀典守者不得辭其過明二子居其位而不去則季氏之惡已不得不任其責也 }
      - { type: j, text: 冉有曰今夫顓臾固而近於費今不取後世必爲子孫憂 }
      - { type: z, text: 夫音扶○固謂城郭完固費季氏之私邑此則冉求之飾辭然亦可見其實與季氏之謀矣 }
      - { type: j, text: 孔子曰求君子疾夫舍曰欲之而必爲之辭 }
      - { type: z, text: 夫音扶舎上聲○欲之謂貪其利 }
      - { type: j, text: 丘也聞有國有家者不患寡而患不均不患貧而患不安蓋均無貧和無寡安無傾 }
      - { type: z, text: 寡謂民少貧謂財乏均謂各得其分安謂上下相安季氏之欲取顓臾患寡與貧耳然是時季氏據國而魯公無民則不均矣君弱臣強互生嫌隙則不安矣均則不患於貧而和和則不患於寡而安安則不相疑忌而無傾覆之患 }
      - { type: j, text: 夫如是故遠人不服則脩文德以來之既來之則安之 }
      - { type: z, text: 夫音扶○内治脩然後遠人服有不服則脩德以來之亦不當勤兵於遠 }
      - { type: j, text: 今由與求也相夫子遠人不服而不能來也邦分崩離析而不能守也 }
      - { type: z, text: 子路雖不與謀而素不能輔之以義亦不得爲無罪故并責之遠人謂顓臾分崩離析謂四分公室家臣屢叛 }
      - { type: j, text: 而謀動干戈於邦内吾恐季孫之憂不在顓臾而在蕭墻之内也 }
      - { type: z, text: 干楯也戈戟也蕭墻屏也言不均不和内變將作其後哀公果欲以越伐魯而去季氏○謝氏曰當是時三家強公室弱冉求又欲伐顓臾以附益之夫子所以深罪之爲其瘠魯以肥三家也○洪氏曰二子仕於季氏凡季氏所欲爲必以告於夫子則因夫子之言而救止者宜亦多矣伐顓臾之事不見於經傳其以夫子之言而止也與 }
      - { type: j, text: 孔子曰天下有道則禮樂征伐自天子出天下無道則禮樂征伐自諸侯出自諸侯出蓋十世希不失矣自大夫出五世希不失矣陪臣執國命三世希不失矣 }
      - { type: z, text: 先王之制諸侯不得變禮樂專征伐陪臣家臣也逆理愈甚則其失之愈速大約世數不過如此 }
      - { type: j, text: 天下有道則政不在大夫 }
      - { type: z, text: 言不得專政 }
      - { type: j, text: 天下有道則庶人不議 }
      - { type: z, text: 上無失政則下無私議非箝其口使不敢言也○此章通論天下之勢 }
      - { type: j, text: 孔子曰祿之去公室五世矣政逮於大夫四世矣故夫三桓之子孫微矣 }
      - { type: z, text: 夫音扶○魯自文公薨公子遂殺子赤立宣公而君失其政歷成襄昭定凡五公逮及也自季武子始專國政歷悼平桓子凡四世而爲家臣陽虎所執三桓三家皆桓公之後此以前章之說推之而知其當然○此章專論魯事疑與前章皆定公時語○蘇氏曰禮樂征伐自諸侯出宜諸侯之強也而魯以失政政逮於大夫宜大夫之強也而三桓以微何也強生於安安生於上下之分定今諸侯大夫皆陵其上則無以令其下矣故皆不久而失之也 }
      - { type: j, text: 孔子曰益者三友損者三友友直友諒友多聞益矣友便辟友善柔友便佞損矣 }
      - { type: z, text: 便平聲辟婢亦反○友直則聞其過友諒則進於誠友多聞則進於明便習熟也便辟謂習於威儀而不直善柔謂工於媚說而不諒便佞謂習於口語而無聞見之實三者損益正相反也○尹氏曰自天子以至於庶人未有不須友以成者而其損益有如是者可不謹哉 }
      - { type: j, text: 孔子曰益者三樂損者三樂樂節禮樂樂道人之善樂多賢友益矣樂驕樂樂佚遊樂宴樂損矣 }
      - { type: z, text: 樂五敎反禮樂之樂音岳驕樂宴樂之樂音洛○節謂辨其制度聲容之節驕樂則侈肆而不知節佚遊則惰慢而惡聞善宴樂則淫溺而狎小人三者損益亦相反也○尹氏曰君子之於好樂可不謹哉 }
      - { type: j, text: 孔子曰侍於君子有三愆言未及之而言謂之躁言及之而不言謂之隱未見顏色而言謂之瞽 }
      - { type: z, text: 君子有德位之通稱愆過也瞽無目不能察言觀色○尹氏曰時然後言則無三者之過矣 }
      - { type: j, text: 孔子曰君子有三戒少之時血氣未定戒之在色及其壯也血氣方剛戒之在鬭及其老也血氣既衰戒之在得 }
      - { type: z, text: 血氣形之所待以生者血陰而氣陽也得貪得也隨時知戒以理勝之則不爲血氣所使也○范氏曰聖人同於人者血氣也異於人者志氣也血氣有時而衰志氣則無時而衰也少未定壯而剛老而衰者血氣也戒於色戒於鬭戒於得者志氣也君子養其志氣故不爲血氣所動是以年彌髙而德彌邵也 }
      - { type: j, text: 孔子曰君子有三畏畏天命畏大人畏聖人之言 }
      - { type: z, text: 畏者嚴憚之意也天命者天所賦之正理也知其可畏則其戒謹恐懼自有不能已者而付畀之重可以不失矣大人聖言皆天命所當畏知畏天命則不得不畏之矣 }
      - { type: j, text: 小人不知天命而不畏也狎大人侮聖人之言 }
      - { type: z, text: 侮戲玩也不知天命故不識義理而無所忌憚如此○尹氏曰三畏者脩己之所當然也小人不務脩身誠己則何畏之有 }
      - { type: j, text: 孔子曰生而知之者上也學而知之者次也困而學之又其次也困而不學民斯爲下矣 }
      - { type: z, text: 困謂有所不通言人之氣質不同大約有此四等○楊氏曰生知學知以至困學雖其質不同然及其知之一也故君子唯學之爲貴困而不學然後爲下 }
      - { type: j, text: 孔子曰君子有九思視思明聽思聰色思温貌思恭言思忠事思敬疑思問忿思難見得思義 }
      - { type: z, text: 難去聲○視無所蔽則明無不見聽無所壅則聰無不聞色見於面者貌舉身而言思問則疑不蓄思難則忿必懲思義則得不苟○程子曰九思各專其一○謝氏曰未至於從容中道無時而不自省察也雖有不存焉者寡矣此之謂思誠 }
      - { type: j, text: 孔子曰見善如不及見不善如探湯吾見其人矣吾聞其語矣 }
      - { type: z, text: 探吐南反○眞知善惡而誠好惡之顏曾閔冉之徒蓋能之矣語蓋古語也 }
      - { type: j, text: 隱居以求其志行義以達其道吾聞其語矣未見其人也 }
      - { type: z, text: 求其志守其所達之道也達其道行其所求之志也蓋惟伊尹太公之流可以當之當時若顏子亦庶乎此然隱而未見又不幸而蚤死故夫子言然 }
      - { type: j, text: 齊景公有馬千駟死之日民無德而稱焉伯夷叔齊餓于首陽之下民到于今稱之 }
      - { type: z, text: 駟四馬也首陽山名 }
      - { type: j, text: 其斯之謂與 }
      - { type: z, text: 與平聲○胡氏曰程子以爲第十二篇錯簡誠不以富亦祗以異當在此章之首今詳文勢似當在此句之上言人之所稱不在於富而在於異也愚謂此說近是而章首當有孔子曰字蓋闕文耳大抵此書後十篇多闕誤 }
      - { type: j, text: 陳亢問於伯魚曰子亦有異聞乎 }
      - { type: z, text: 亢音剛○亢以私意窺聖人疑必陰厚其子 }
      - { type: j, text: 對曰未也嘗獨立鯉趨而過庭曰學詩乎對曰未也不學詩無以言鯉退而學詩 }
      - { type: z, text: 事理通達而心氣和平故能言 }
      - { type: j, text: 他日又獨立鯉趨而過庭曰學禮乎對曰未也不學禮無以立鯉退而學禮 }
      - { type: z, text: 品節詳明而德性堅定故能立 }
      - { type: j, text: 聞斯二者 }
      - { type: z, text: 當獨立之時所聞不過如此其無異 }
      - { type: j, text: 聞可知陳亢退而喜曰問一得三聞詩聞禮又聞君子之遠其子也 }
      - { type: z, text: 遠去聲○尹氏曰孔子之敎其子無 }
      - { type: j, text: 異於門人故陳亢以爲遠其子邦君之妻君稱之曰夫人夫人自稱曰小童邦人稱之曰君夫人稱諸異邦曰寡小君異邦人稱之亦曰君夫人 }
      - { type: z, text: 寡寡德謙辭○吳氏曰凡語中所載 }
      - { type: j, text: 如此類者不知何謂或古有之或夫子嘗言之不可攷也 }
