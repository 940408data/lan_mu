    text: 日遂行
  - page: 346
    col: 8
    role: j
    text: 陳去聲○陳謂軍師行伍之列俎豆
  - page: 346
    col: 9
    role: j
    text: 禮器尹氏曰衛靈公無道之君也復
  - page: 347
    col: 1
    role: j
    text: ○有志於戰伐之事故答以未學而去
  - page: 347
    col: 2
    role: z
    text: 之
  - page: 347
    col: 3
    role: j
    text: 在陳絕糧從者病莫能興
  - page: 347
    col: 4
    role: z
    text: 從去聲○孔子去衛適陳興起也
  - page: 347
    col: 5
    role: j
    text: 子路慍見曰君子亦有窮乎子曰君子
  - page: 347
    col: 6
    role: j
    text: 固窮小人窮斯濫矣
  - page: 347
    col: 7
    role: z
    text: 見賢遍反○何氏曰濫溢也言君子
  - page: 347
    col: 8
    role: z
    text: 固有窮時不若小人窮則放溢為非
  - page: 347
    col: 9
    role: z
    text: 程子曰固窮者固守其窮亦通○愚
  - page: 347
    col: 10
    role: z
    text: 謂聖人當行而行無所顧慮處困而
  - page: 347
    col: 11
    role: z
    text: 亨無所怨悔於此可見學者宜深味
  - page: 347
    col: 12
    role: z
    text: 之
  - page: 347
    col: 13
    role: j
    text: 子曰賜也女以予為多學而識之者與
  - page: 347
    col: 14
    role: z
    text: 女音汝識音志與平聲下同○子貢
  - page: 347
    col: 15
    role: z
    text: 之學多而能識矣夫子欲其知所本
  - page: 347
    col: 16
    role: z
    text: 也故問以發之
  - page: 348
    col: 1
    role: j
    text: 對曰然非與
  - page: 348
    col: 2
    role: z
    text: 方信而忽疑蓋其積學功至而亦將
  - page: 348
    col: 3
    role: z
    text: 有得也
  - page: 348
    col: 4
    role: j
    text: 曰非也予一以貫之
  - page: 348
    col: 5
    role: z
    text: 說見第四篇然彼以行言而此以知
  - page: 348
    col: 6
    role: z
    text: 言也○謝氏曰聖人之道大矣人不
  - page: 348
    col: 7
    role: z
    text: 能徧觀而盡識宜其以爲多學而識
  - page: 348
    col: 8
    role: z
    text: 之也然聖人豈務博者哉如天之於
  - page: 348
    col: 9
    role: z
    text: 衆形匪物物刻而雕之也故曰予一
  - page: 348
    col: 10
    role: z
    text: 以貫之德輶如毛毛猶有倫上天之
  - page: 348
    col: 11
    role: z
    text: 載無聲無臭至矣尹氏曰孔子之於
  - page: 348
    col: 12
    role: z
    text: 曾子不待其問而直告之以此曾子
  - page: 348
    col: 13
    role: z
    text: 復深喻之曰唯若子貢則先發其疑
  - page: 348
    col: 14
    role: z
    text: 而後告之而子貢終亦不能如曾子
  - page: 348
    col: 15
    role: z
    text: 之唯也二子所學之淺深於此可見
  - page: 348
    col: 16
    role: z
    text: 愚按夫子之於子貢婁有以發之而
  - page: 349
    col: 1
    role: z
    text: 他人不與焉則顏曾以下諸子所學
  - page: 349
    col: 2
    role: z
    text: 之淺深又可見矣
  - page: 349
    col: 3
    role: j
    text: 子曰由知德者鮮矣
  - page: 349
    col: 4
    role: z
    text: 鮮上聲○由呼子路之名而告之也
  - page: 349
    col: 5
    role: z
    text: 德謂義理之得於己者非己有之不
  - page: 349
    col: 6
    role: z
    text: 能知其意味之實也○自第一章至
  - page: 349
    col: 7
    role: z
    text: 此疑皆一時之言此章蓋為慍見發
  - page: 349
    col: 8
    role: z
    text: 也
  - page: 349
    col: 9
    role: j
    text: 子曰無為而治者其舜也與夫何為哉
  - page: 349
    col: 10
    role: j
    text: 恭己正南靣而已矣
  - page: 349
    col: 11
    role: z
    text: 與平聲夫音扶○無為而治者聖人
  - page: 349
    col: 12
    role: z
    text: 德盛而民化不待其有所作為也獨
  - page: 349
    col: 13
    role: z
    text: 稱舜者紹堯之後而又得人以任眾
  - page: 349
    col: 14
    role: z
    text: 職故尤不見其有為之迹也恭己者
  - page: 349
    col: 15
    role: z
    text: 聖人敬德之容既無所為則人之所
  - page: 349
    col: 16
    role: z
    text: 見如此而已
  - page: 350
    col: 1
    role: j
    text: 子張問行
  - page: 350
    col: 2
    role: z
    text: 猶問達之意也
  - page: 350
    col: 3
    role: j
    text: 子曰言忠信行篤敬雖蠻貊之邦行矣
  - page: 350
    col: 4
    role: j
    text: 言不忠信行不篤敬雖州里行乎哉
  - page: 350
    col: 5
    role: z
    text: 行篤行不之行去聲貊亡百反○子
  - page: 350
    col: 6
    role: z
    text: 張意在得行於外故夫子反於身而
  - page: 350
    col: 7
    role: z
    text: 言之猶答干祿問達之意也篤厚也
  - page: 350
    col: 8
    role: z
    text: 蠻南蠻貊北狄二千五百家爲州
  - page: 350
    col: 9
    role: j
    text: 立則見其參於前也在輿則見其倚於
  - page: 350
    col: 10
    role: j
    text: 衡也夫然後行
  - page: 350
    col: 11
    role: z
    text: 參七南反夫音扶○其者指忠信篤
  - page: 350
    col: 12
    role: z
    text: 敬而言參讀如母往參焉之參言與
  - page: 350
    col: 13
    role: z
    text: 我相參也衡軛也言其於忠信篤敬
  - page: 350
    col: 14
    role: z
    text: 念念不忘隨其所在常若有見雖欲
  - page: 350
    col: 15
    role: z
    text: 頃刻離之而不可得然後一言一行
  - page: 350
    col: 16
    role: z
    text: 自然不離於忠信篤敬而蠻貊可行
  - page: 351
    col: 1
    role: j
    text: 也
  - page: 351
    col: 2
    role: j
    text: 子張書諸紳
  - page: 351
    col: 3
    role: z
    text: 紳大帶之垂者書之欲其不忘也○
  - page: 351
    col: 4
    role: z
    text: 程子曰學要鞭辟近裏著己而已博
  - page: 351
    col: 5
    role: z
    text: 學而篤志切問而近思言忠信行篤
  - page: 351
    col: 6
    role: z
    text: 敬立則見其參於前在輿則見其倚
  - page: 351
    col: 7
    role: z
    text: 於衡只此是學質美者明得盡查滓
  - page: 351
    col: 8
    role: z
    text: 便渾化却與天地同體其次惟莊敬
  - page: 351
    col: 9
    role: z
    text: 以持養之及其至則一也
  - page: 351
    col: 10
    role: j
    text: 子曰直哉史魚邦有道如矢邦無道如
  - page: 351
    col: 11
    role: j
    text: 矢
  - page: 351
    col: 12
    role: z
    text: 史官名魚衛大夫名鰌如矢言直也
  - page: 351
    col: 13
    role: z
    text: 史魚自以不能進賢退不肖既死猶
  - page: 351
    col: 14
    role: z
    text: 以尸諫故夫子稱其直事見家語
  - page: 351
    col: 15
    role: j
    text: 君子哉蘧伯玉邦有道則仕邦無道則
  - page: 351
    col: 16
    role: j
    text: 可卷而懷之
  - page: 352
    col: 1
    role: z
    text: 伯玉出處合於聖人之道故曰君子
  - page: 352
    col: 2
    role: z
    text: 卷收也懷藏也如於孫林父寗殖放
  - page: 352
    col: 3
    role: z
    text: 弑之謀不對而出亦其事也○楊氏
  - page: 352
    col: 4
    role: z
    text: 曰史魚之直未盡君子之道若蘧伯
  - page: 352
    col: 5
    role: z
    text: 玉然後可免於亂世若史魚之如矢
  - page: 352
    col: 6
    role: z
    text: 則雖欲卷而懷之有不可得也
  - page: 352
    col: 7
    role: j
    text: 子曰可與言而不與之言失人不可與
  - page: 352
    col: 8
    role: j
    text: 言而與之言失言知者不失人亦不失
  - page: 352
    col: 9
    role: j
    text: 言
  - page: 352
    col: 10
    role: z
    text: 知去聲
  - page: 352
    col: 11
    role: j
    text: 子曰志士仁人無求生以害仁有殺身
  - page: 352
    col: 12
    role: j
    text: 以成仁
  - page: 352
    col: 13
    role: z
    text: 志士有志之士仁人則成德之人也
  - page: 352
    col: 14
    role: z
    text: 理當死而求生則於其心有不安矣
  - page: 352
    col: 15
    role: z
    text: 是害其心之德也當死而死則心安
  - page: 352
    col: 16
    role: z
    text: 而德全矣○程子曰實理得之於心
  - page: 353
    col: 1
    role: j
    text: 自別實理者實見得是實見得非也
  - page: 353
    col: 2
    role: j
    text: 古人有捐軀隕命者若不實見得惡
  - page: 353
    col: 3
    role: j
    text: 能如此須是實見得生不重於義生
  - page: 353
    col: 4
    role: j
    text: 不安於死也故有殺身以成仁者只
  - page: 353
    col: 5
    role: z
    text: 是成就一箇是而已
  - page: 353
    col: 6
    role: j
    text: 子貢問為仁子曰工欲善其事必先利
  - page: 353
    col: 7
    role: j
    text: 其器居是邦也事其大夫之賢者友其
  - page: 353
    col: 8
    role: j
    text: 士之仁者
  - page: 353
    col: 9
    role: z
    text: 賢以事言仁以德言夫子甞謂子貢
  - page: 353
    col: 10
    role: z
    text: 悅不若己者故以是告之欲其有所
  - page: 353
    col: 11
    role: z
    text: 嚴憚切磋以成其德也○程子曰子
  - page: 353
    col: 12
    role: z
    text: 貢問為仁非問仁也故孔子告之以
  - page: 353
    col: 13
    role: z
    text: 為仁之資而已
  - page: 353
    col: 14
    role: j
    text: 顏淵問為邦
  - page: 353
    col: 15
    role: z
    text: 顏子王佐之才故問治天下之道曰
  - page: 353
    col: 16
    role: z
    text: 為邦者謙辭
  - page: 354
    col: 1
    role: j
    text: 子曰行夏之時
  - page: 354
    col: 2
    role: j
    text: 夏時謂以斗柄初昏建寅之月為歲首
  - page: 354
    col: 3
    role: j
    text: 也天開於子地闢於丑人生於寅故斗
  - page: 354
    col: 4
    role: z
    text: 柄建此三辰之月皆可以為歲首而
  - page: 354
    col: 5
    role: z
    text: 三代迭用之夏以寅為人正商以丑
  - page: 354
    col: 6
    role: z
    text: 為地正周以子為天正也然時以作
  - page: 354
    col: 7
    role: z
    text: 事則歲月自當以人為紀故孔子嘗
  - page: 354
    col: 8
    role: z
    text: 曰吾得夏時焉而說者以為謂夏小
  - page: 354
    col: 9
    role: z
    text: 正之屬蓋取其時之正與其令之善
  - page: 354
    col: 10
    role: z
    text: 而於此又以告顏子也
  - page: 354
    col: 11
    role: j
    text: 乘殷之輅
  - page: 354
    col: 12
    role: z
    text: 輅音路亦作路○商輅木輅也輅者
  - page: 354
    col: 13
    role: z
    text: 大車之名古者以木為車而已至商
  - page: 354
    col: 14
    role: z
    text: 而有輅之名蓋始異其制也周人飾
  - page: 354
    col: 15
    role: z
    text: 以金玉則過侈而易敗不若商輅之
  - page: 354
    col: 16
    role: z
    text: 朴素渾堅而等威已辨為質而得其
  - page: 355
    col: 1
    role: z
    text: 中也
  - page: 355
    col: 2
    role: j
    text: 服周之冕
  - page: 355
    col: 3
    role: z
    text: 周冕有五祭服之冠也冠上有覆前
  - page: 355
    col: 4
    role: z
    text: 後有旒黃帝以來蓋已有之而制度
  - page: 355
    col: 5
    role: z
    text: 儀等至周始備然其為物小而加於
  - page: 355
    col: 6
    role: z
    text: 衆體之上故雖華而不為靡雖費而
  - page: 355
    col: 7
    role: z
    text: 不及奢夫子取之蓋亦以為文而得
  - page: 355
    col: 8
    role: z
    text: 其中也
  - page: 355
    col: 9
    role: j
    text: 樂則韶舞
  - page: 355
    col: 10
    role: z
    text: 取其盡善盡美
  - page: 355
    col: 11
    role: j
    text: 放鄭聲遠佞人鄭聲淫佞人殆
  - page: 355
    col: 12
    role: z
    text: 遠去聲○放謂禁絕之鄭聲鄭國之
  - page: 355
    col: 13
    role: z
    text: 音佞人卑諂辨給之人殆危也○程
  - page: 355
    col: 14
    role: z
    text: 子曰問政多矣惟顏淵告之以此蓋
  - page: 355
    col: 15
    role: z
    text: 三代之制皆因時損益及其久也不
  - page: 355
    col: 16
    role: z
    text: 能無弊周衰聖人不作故孔子斟酌
  - page: 356
    col: 1
    role: z
    text: 先王之禮立萬世常行之道發此以
  - page: 356
    col: 2
    role: z
    text: 爲之兆爾由是求之則餘皆可考也
  - page: 356
    col: 3
    role: z
    text: 張子曰禮樂治之法也放鄭聲遠佞
  - page: 356
    col: 4
    role: z
    text: 人法外意也一日不謹則法壞矣虞
  - page: 356
    col: 5
    role: z
    text: 夏君臣更相飭戒意蓋如此又曰法
  - page: 356
    col: 6
    role: z
    text: 立而能守則德可乆業可大鄭聲佞
  - page: 356
    col: 7
    role: z
    text: 人能使人喪其所守故放遠之尹氏
  - page: 356
    col: 8
    role: z
    text: 曰此所謂百王不易之大法孔子之
  - page: 356
    col: 9
    role: z
    text: 作春秋蓋此意也孔顔雖不得行之
  - page: 356
    col: 10
    role: z
    text: 於時然其爲治之法可得而見矣
  - page: 356
    col: 11
    role: j
    text: 子曰人無遠慮必有近憂
  - page: 356
    col: 12
    role: z
    text: 蘇氏曰人之所履者容足之外皆爲
  - page: 356
    col: 13
    role: z
    text: 無用之地而不可廢也故慮不在千
  - page: 356
    col: 14
    role: z
    text: 里之外則患在几席之下矣
  - page: 356
    col: 15
    role: j
    text: 子曰已矣乎吾未見好德如好色者也
  - page: 356
    col: 16
    role: z
    text: 好去聲○已矣乎歎其終不得而見
  - page: 357
    col: 1
    role: z
    text: 也
  - page: 357
    col: 2
    role: j
    text: 子曰臧文仲其竊位者與知柳下惠之
  - page: 357
    col: 3
    role: j
    text: 賢而不與立也
  - page: 357
    col: 4
    role: z
    text: 者與之與平聲○竊位言不稱其位
  - page: 357
    col: 5
    role: z
    text: 而有愧於心如盜得而隂據之也柳
  - page: 357
    col: 6
    role: z
    text: 下惠魯大夫展獲字禽食邑柳下謚
  - page: 357
    col: 7
    role: z
    text: 曰惠與立謂與之並立於朝范氏曰
  - page: 357
    col: 8
    role: z
    text: 臧文仲爲政於魯若不知賢是不明
  - page: 357
    col: 9
    role: z
    text: 也知而不舉是蔽賢也不明之罪小
  - page: 357
    col: 10
    role: z
    text: 蔽賢之罪大故孔子以爲不仁又以
  - page: 357
    col: 11
    role: z
    text: 爲竊位
  - page: 357
    col: 12
    role: j
    text: 子曰躬自厚而薄責於人則遠怨矣
  - page: 357
    col: 13
    role: z
    text: 遠去聲○責己厚故身益脩責人薄
  - page: 357
    col: 14
    role: z
    text: 故人易從所以人不得而怨之
  - page: 357
    col: 15
    role: j
    text: 子曰不曰如之何如之何者吾末如之
  - page: 357
    col: 16
    role: j
    text: 何也已矣
  - page: 358
    col: 1
    role: z
    text: 如之何如之何者熟思而審處之辭
  - page: 358
    col: 2
    role: z
    text: 也不如是而妄行雖聖人亦無如之
  - page: 358
    col: 3
    role: z
    text: 何矣
  - page: 358
    col: 4
    role: j
    text: 子曰羣居終日言不及義好行小慧難
  - page: 358
    col: 5
    role: j
    text: 矣哉
  - page: 358
    col: 6
    role: z
    text: 好去聲○小慧私智也言不及義則
  - page: 358
    col: 7
    role: z
    text: 放辟邪侈之心滋好行小慧則行險
  - page: 358
    col: 8
    role: z
    text: 僥倖之機熟難矣哉者言其無以入
  - page: 358
    col: 9
    role: z
    text: 德而將有患害也
  - page: 358
    col: 10
    role: j
    text: 子曰君子義以爲質禮以行之孫以出
  - page: 358
    col: 11
    role: j
    text: 之信以成之君子哉
  - page: 358
    col: 12
    role: z
    text: 孫去聲○義者制事之本故以爲質
  - page: 358
    col: 13
    role: z
    text: 榦而行之必有節文出之必以退遜
  - page: 358
    col: 14
    role: z
    text: 成之必在誠實乃君子之道也○程
  - page: 358
    col: 15
    role: z
    text: 子曰義以爲質如質榦然禮行此孫
  - page: 358
    col: 16
    role: z
    text: 出此信成此此四句只是一事以義
  - page: 359
    col: 1
    role: z
    text: 為本又曰敬以直内則義以方外義
  - page: 359
    col: 2
    role: z
    text: 以為質則禮以行之孫以出之信以
  - page: 359
    col: 3
    role: z
    text: 成之
  - page: 359
    col: 4
    role: j
    text: 子曰君子病無能焉不病人之不己知
  - page: 359
    col: 5
    role: j
    text: 也○子曰君子疾没世而名不稱焉
  - page: 359
    col: 6
    role: z
    text: 范氏曰君子學以為己不求人知然
  - page: 359
    col: 7
    role: z
    text: 没世而名不稱焉則無為善之實可
  - page: 359
    col: 8
    role: z
    text: 知矣
  - page: 359
    col: 9
    role: j
    text: 子曰君子求諸己小人求諸人
  - page: 359
    col: 10
    role: z
    text: 謝氏曰君子無不反求諸己小人
  - page: 359
    col: 11
    role: z
    text: 反是此君子小人所以分也○楊氏
  - page: 359
    col: 12
    role: z
    text: 曰君子雖不病人之不己知然亦疾
  - page: 359
    col: 13
    role: z
    text: 没世而名不稱也雖疾没世而名不
  - page: 359
    col: 14
    role: z
    text: 稱然所以求者亦反諸己而已小人
  - page: 359
    col: 15
    role: z
    text: 求諸人故違道干譽無所不至三者
  - page: 359
    col: 16
    role: z
    text: 文不相蒙而義實相足亦記言者之
  - page: 360
    col: 1
    role: z
    text: 意
  - page: 360
    col: 2
    role: j
    text: 子曰君子矜而不爭羣而不黨
  - page: 360
    col: 3
    role: z
    text: 莊以持己曰矜然無乖戾之心故不
  - page: 360
    col: 4
    role: z
    text: 爭和以處衆曰羣然無阿比之意故
  - page: 360
    col: 5
    role: z
    text: 不黨
  - page: 360
    col: 6
    role: j
    text: 子曰君子不以言舉人不以人廢言○
  - page: 360
    col: 7
    role: j
    text: 子貢問曰有一言而可以終身行之者
  - page: 360
    col: 8
    role: j
    text: 乎子曰其恕乎己所不欲勿施於人
  - page: 360
    col: 9
    role: z
    text: 推己及物其施不窮故可以終身行
  - page: 360
    col: 10
    role: z
    text: 之○尹氏曰學貴於知要子貢之問
  - page: 360
    col: 11
    role: z
    text: 可謂知要矣孔子告以求仁之方也
  - page: 360
    col: 12
    role: z
    text: 推而極之雖聖人之無我不出乎此
  - page: 360
    col: 13
    role: z
    text: 終身行之不亦宜乎
  - page: 360
    col: 14
    role: j
    text: 子曰吾之於人也誰毀誰譽如有所譽
  - page: 360
    col: 15
    role: j
    text: 者其有所試矣
  - page: 360
    col: 16
    role: z
    text: 譽平聲○毀者稱人之惡而損其實
  - page: 361
    col: 1
    role: z
    text: 譽者揚人之善而過其實夫子無是
  - page: 361
    col: 2
    role: z
    text: 也然或有所譽者則必嘗有以試之
  - page: 361
    col: 3
    role: z
    text: 而知其將然矣聖人善善之速而無
  - page: 361
    col: 4
    role: z
    text: 所苟如此若其惡惡則已緩矣是以
  - page: 361
    col: 5
    role: z
    text: 雖有以前知其惡而終無所毀也
  - page: 361
    col: 6
    role: j
    text: 斯民也三代之所以直道而行也
  - page: 361
    col: 7
    role: z
    text: 斯民者今此之人也三代夏商周也
  - page: 361
    col: 8
    role: z
    text: 直道無私曲也言吾之所以無所毀
  - page: 361
    col: 9
    role: z
    text: 譽者蓋以此民即三代之時所以善
  - page: 361
    col: 10
    role: z
    text: 其善惡其惡而無所私曲之民故我
  - page: 361
    col: 11
    role: z
    text: 今亦不得而枉其是非之實也○尹
  - page: 361
    col: 12
    role: z
    text: 氏曰孔子之於人也豈有意於毀譽
  - page: 361
    col: 13
    role: z
    text: 之哉其所以譽之者蓋試而知其美
  - page: 361
    col: 14
    role: j
    text: 故也斯民也三代之所以直道而行豈
  - page: 361
    col: 15
    role: z
    text: 得容私於其間哉
  - page: 361
    col: 16
    role: j
    text: 子曰吾猶及史之闕文也有馬者借人
  - page: 362
    col: 1
    role: j
    text: 秉之今云已夫
  - page: 362
    col: 2
    role: z
    text: 夫音扶○楊氏曰史闕文馬借人此
  - page: 362
    col: 3
    role: j
    text: 二事孔子猶及見之今云已夫悼時
  - page: 362
    col: 4
    role: j
    text: 之益偷也愚謂此必有為而言蓋雖
  - page: 362
    col: 5
    role: j
    text: 細故而時變之大者可知矣○胡氏曰
  - page: 362
    col: 6
    role: z
    text: 此章義疑不可強解
  - page: 362
    col: 7
    role: j
    text: 子曰巧言亂德小不忍則亂大謀
  - page: 362
    col: 8
    role: z
    text: 巧言變亂是非聽之使人喪其所守
  - page: 362
    col: 9
    role: z
    text: 小不忍如婦人之仁匹夫之勇皆是
  - page: 362
    col: 10
    role: j
    text: 子曰衆惡之必察焉衆好之必察焉
  - page: 362
    col: 11
    role: z
    text: 好惡並去聲○楊氏曰惟仁者能好
  - page: 362
    col: 12
    role: z
    text: 惡人衆好惡之而不察則或蔽於私
  - page: 362
    col: 13
    role: z
    text: 矣
  - page: 362
    col: 14
    role: j
    text: 子曰人能弘道非道弘人
  - page: 362
    col: 15
    role: z
    text: 弘廓而大之也人外無道道外無人
  - page: 362
    col: 16
    role: z
    text: 然人心有覺而道體無爲故人能大
  - page: 363
    col: 1
    role: z
    text: 其道道不能大其人也○張子曰心
  - page: 363
    col: 2
    role: z
    text: 能盡性人能洪道也性不知檢其心
  - page: 363
    col: 3
    role: z
    text: 非道洪人也
  - page: 363
    col: 4
    role: j
    text: 子曰過而不改是謂過矣
  - page: 363
    col: 5
    role: z
    text: 過而能改則復於無過唯不改則其
  - page: 363
    col: 6
    role: z
    text: 過遂成而將不及改矣
  - page: 363
    col: 7
    role: j
    text: 子曰吾嘗終日不食終夜不寢以思句
  - page: 363
    col: 8
    role: j
    text: 無益句不如學也
  - page: 363
    col: 9
    role: z
    text: 此爲思而不學者言之蓋勞心以必
  - page: 363
    col: 10
    role: z
    text: 求不如遜志而自得也○李氏曰夫
  - page: 363
    col: 11
    role: z
    text: 子非思而不學者特垂語以教人爾
  - page: 363
    col: 12
    role: j
    text: 子曰君子謀道不謀食耕也餒在其中
  - page: 363
    col: 13
    role: j
    text: 矣學也祿在其中矣君子憂道不憂貧
  - page: 363
    col: 14
    role: z
    text: 餒奴罪反○耕所以謀食而未必得
  - page: 363
    col: 15
    role: z
    text: 食學所以謀道而祿在其中然其學
  - page: 363
    col: 16
    role: z
    text: 也憂不得乎道而已非爲憂貧之故
  - page: 364
    col: 1
    role: z
    text: 而欲為是以得祿也○尹氏曰君子
  - page: 364
    col: 2
    role: z
    text: 治其本而不卹其末豈以在外者為
  - page: 364
    col: 3
    role: z
    text: 憂樂哉
  - page: 364
    col: 4
    role: j
    text: 子曰知及之仁不能守之雖得之必失
  - page: 364
    col: 5
    role: j
    text: 之
  - page: 364
    col: 6
    role: z
    text: 知去聲○知足以知此理而私欲間
  - page: 364
    col: 7
    role: z
    text: 之則無以有之於身矣
  - page: 364
    col: 8
    role: j
    text: 知及之仁能守之不莊以涖之則民不
  - page: 364
    col: 9
    role: j
    text: 敬
  - page: 364
    col: 10
    role: z
    text: 涖臨也謂臨民也知此理而無私欲
  - page: 364
    col: 11
    role: z
    text: 以閒之則所知者在我而不失矣然
  - page: 364
    col: 12
    role: z
    text: 猶有不莊者蓋氣習之偏或有厚於
  - page: 364
    col: 13
    role: z
    text: 內而不嚴於外者是以民不見其可
  - page: 364
    col: 14
    role: z
    text: 畏而慢易之下句放此
  - page: 364
    col: 15
    role: j
    text: 知及之仁能守之莊以涖之動之不以
  - page: 364
    col: 16
    role: j
    text: 禮未善也
  - page: 365
    col: 1
    role: z
    text: 動之動民也猶曰鼓舞而作興之云
  - page: 365
    col: 2
    role: z
    text: 爾禮謂義理之節文○愚謂學至於
  - page: 365
    col: 3
    role: z
    text: 仁則善有諸己而大本立矣涖之不
  - page: 365
    col: 4
    role: z
    text: 莊動之不以禮乃其氣禀學問之小
  - page: 365
    col: 5
    role: z
    text: 疵然亦非盡善之道也故夫子歷言
  - page: 365
    col: 6
    role: z
    text: 之使知德愈全則責愈備不可以爲
  - page: 365
    col: 7
    role: z
    text: 小節而忽之也
  - page: 365
    col: 8
    role: j
    text: 子曰君子不可小知而可大受也小人
  - page: 365
    col: 9
    role: j
    text: 不可大受而可小知也
  - page: 365
    col: 10
    role: z
    text: 此言觀人之法知我知之也受彼所
  - page: 365
    col: 11
    role: z
    text: 受也蓋君子於細事未必可觀而材
  - page: 365
    col: 12
    role: z
    text: 德足以任重小人雖器量淺狹而未
  - page: 365
    col: 13
    role: z
    text: 必無一長可取
  - page: 365
    col: 14
    role: j
    text: 子曰民之於仁也甚於水火水火吾見
  - page: 365
    col: 15
    role: j
    text: 蹈而死者矣未見蹈仁而死者也
  - page: 365
    col: 16
    role: z
    text: 民之於水火所頼以生不可一日無
  - page: 366
    col: 1
    role: j
    text: 其於仁也亦然但水火外物而仁在
  - page: 366
    col: 2
    role: j
    text: 已無水火不過害人之身而不仁則
  - page: 366
    col: 3
    role: j
    text: 失其心是仁有甚於水火而尤不可
  - page: 366
    col: 4
    role: j
    text: 以一日無也况水火或有時而殺人
  - page: 366
    col: 5
    role: j
    text: 仁則未甞殺人亦何憚而不爲哉○
  - page: 366
    col: 6
    role: z
    text: 李氏曰此夫子勉人爲仁之語下章
  - page: 366
    col: 7
    role: z
    text: 放此
  - page: 366
    col: 8
    role: j
    text: 子曰當仁不讓於師
  - page: 366
    col: 9
    role: z
    text: 復於善而不當復論其類之惡矣
  - page: 366
    col: 10
    role: j
    text: 子曰道不同不相爲謀
  - page: 366
    col: 11
    role: z
    text: 爲去聲○不同如善惡邪正之異
  - page: 366
    col: 12
    role: j
    text: 子曰辭達而已矣
  - page: 366
    col: 13
    role: z
    text: 詞取達意而止不以冨麗爲工
  - page: 366
    col: 14
    role: j
    text: 師冕見及階子曰階也及席子曰席也
  - page: 366
    col: 15
    role: j
    text: 皆坐子告之曰某在斯某在斯
  - page: 366
    col: 16
    role: z
    text: 見賢遍反○師樂師瞽者冕名再言
  - page: 367
    col: 1
    role: z
    text: 某在斯歷舉在坐之人以詔之
  - page: 367
    col: 2
    role: j
    text: 師冕出子張問曰與師言之道與
  - page: 367
    col: 3
    role: z
    text: 與平聲○聖門學者於夫子之一言
  - page: 367
    col: 4
    role: z
    text: 一動無不存心省察如此
  - page: 367
    col: 5
    role: j
    text: 子曰然固相師之道也
  - page: 367
    col: 6
    role: z
    text: 相去聲○相助也古者瞽必有相其
  - page: 367
    col: 7
    role: z
    text: 道如此蓋聖人於此非作意而爲之
  - page: 367
    col: 8
    role: z
    text: 但盡其道而已○尹氏曰聖人處己
  - page: 367
    col: 9
    role: z
    text: 當仁以仁爲己任也雖師亦無所遜
  - page: 367
    col: 10
    role: z
    text: 言當勇往而必爲也蓋仁者人所自
  - page: 367
    col: 11
    role: z
    text: 有而自爲之非有爭也何遜之有○
  - page: 367
    col: 12
    role: z
    text: 程子曰爲仁在己無所與遜若善名
  - page: 367
    col: 13
    role: z
    text: 在外則不可不遜
  - page: 367
    col: 14
    role: j
    text: 子曰君子貞而不諒
  - page: 367
    col: 15
    role: z
    text: 貞正而固也諒則不擇是非而必於
  - page: 367
    col: 16
    role: z
    text: 信
  - page: 368
    col: 1
    role: j
    text: 子曰事君敬其事而後其食
  - page: 368
    col: 2
    role: j
    text: 後與後獲之後同○食祿也君子之仕
  - page: 368
    col: 3
    role: z
    text: 也有官守者修其職有言責者盡其
  - page: 368
    col: 4
    role: z
    text: 忠皆以敬吾之事而已不可先有求
  - page: 368
    col: 5
    role: z
    text: 祿之心也
  - page: 368
    col: 6
    role: j
    text: 子曰有教無類
  - page: 368
    col: 7
    role: z
    text: 人性皆善而其類有善惡之殊者氣
  - page: 368
    col: 8
    role: z
    text: 習之染也故君子有教則人皆可以
  - page: 368
    col: 9
    role: z
    text: 為人其心一致無不盡其誠故也有
  - page: 368
    col: 10
    role: z
    text: 志於學者求聖人之心於斯亦可見
  - page: 368
    col: 11
    role: z
    text: 矣○范氏曰聖人不侮鰥寡不虐無
  - page: 368
    col: 12
    role: z
    text: 告可見於此推之天下無一物不得
  - page: 368
    col: 13
    role: z
    text: 其所矣
  - page: 368
    col: 14
    role: title
    text: 季氏第十六
  - page: 368
    col: 15
    role: z
    text: 洪氏曰此篇或以為齊論凡十四
  - page: 368
    col: 16
    role: z
    text: 章
  - page: 369
    col: 1
    role: j
    text: 季氏將伐顓臾
  - page: 369
    col: 2
    role: j
    text: 顓音專臾音俞○顓臾國名魯附庸
  - page: 369
    col: 3
    role: z
    text: 也
  - page: 369
    col: 4
    role: j
    text: 冉有季路見於孔子曰季氏將有事於
  - page: 369
    col: 5
    role: j
    text: 顓臾
  - page: 369
    col: 6
    role: j
    text: 見賢遍反○按左傳史記二子仕季
  - page: 369
    col: 7
    role: j
    text: 氏不同時此云爾者疑子路嘗從孔
  - page: 369
    col: 8
    role: j
    text: 子自衛反魯再仕季氏不乆而復之
  - page: 369
    col: 9
    role: z
    text: 衛也
  - page: 369
    col: 10
    role: j
    text: 孔子曰求無乃爾是過與
  - page: 369
    col: 11
    role: j
    text: 與平聲○冉求爲季氏聚歛尤用事
  - page: 369
    col: 12
    role: z
    text: 故夫子獨責之
  - page: 369
    col: 13
    role: j
    text: 夫顓臾昔者先王以爲東蒙主且在邦
  - page: 369
    col: 14
    role: j
    text: 域之中矣是社稷之臣也何以伐爲
  - page: 369
    col: 15
    role: z
    text: 夫音扶○東蒙山名先王封顓臾於
  - page: 369
    col: 16
    role: z
    text: 此山之下使主其祭在魯地七百里
  - page: 370
    col: 1
    role: z
    text: 之中社稷猶云公家是時四分魯國
  - page: 370
    col: 2
    role: z
    text: 季氏取其二孟孫叔孫各有其一獨
  - page: 370
    col: 3
    role: z
    text: 附庸之國尚爲公臣季氏又欲取以
  - page: 370
    col: 4
    role: z
    text: 自益故孔子言顓臾乃先王封國則
  - page: 370
    col: 5
    role: z
    text: 不可伐在邦域之中則不必伐是社
  - page: 370
    col: 6
    role: z
    text: 稷之臣則非季氏所當伐也此事理
  - page: 370
    col: 7
    role: z
    text: 之至當不易之定體而一言盡其曲
  - page: 370
    col: 8
    role: z
    text: 折如此非聖人不能也
  - page: 370
    col: 9
    role: j
    text: 冉有曰夫子欲之吾二臣者皆不欲也
  - page: 370
    col: 10
    role: z
    text: 夫子指季孫冉有實與謀以孔子非
  - page: 370
    col: 11
    role: z
    text: 之故歸咎於季氏
  - page: 370
    col: 12
    role: j
    text: 孔子曰求周任有言曰陳力就列不能
  - page: 370
    col: 13
    role: j
    text: 者止危而不持顛而不扶則將焉用彼
  - page: 370
    col: 14
    role: j
    text: 相矣
  - page: 370
    col: 15
    role: z
    text: 任平聲焉於虔反相去聲下同○周
  - page: 370
    col: 16
    role: z
    text: 任古之良史陳布也列位也相瞽者
  - page: 371
    col: 1
    role: z
    text: 之相也言二子不欲則當諫諫而不
  - page: 371
    col: 2
    role: z
    text: 聽則當去也
  - page: 371
    col: 3
    role: j
    text: 且爾言過矣虎兕出於柙龜玉毀於櫝
  - page: 371
    col: 4
    role: j
    text: 中是誰之過與
  - page: 371
    col: 5
    role: z
    text: 兕徐履反柙户甲反櫝音獨與平聲
  - page: 371
    col: 6
    role: z
    text: 兕野牛也柙檻也櫝匱也言在柙而
  - page: 371
    col: 7
    role: z
    text: 逸在櫝而毀典守者不得辭其過明
  - page: 371
    col: 8
    role: z
    text: 二子居其位而不去則季氏之惡已
  - page: 371
    col: 9
    role: z
    text: 不得不任其責也
  - page: 371
    col: 10
    role: j
    text: 冉有曰今夫顓臾固而近於費今不取
  - page: 371
    col: 11
    role: j
    text: 後世必爲子孫憂
  - page: 371
    col: 12
    role: z
    text: 夫音扶○固謂城郭完固費季氏之
  - page: 371
    col: 13
    role: z
    text: 私邑此則冉求之飾辭然亦可見其
  - page: 371
    col: 14
    role: z
    text: 實與季氏之謀矣
  - page: 371
    col: 15
    role: j
    text: 孔子曰求君子疾夫舍曰欲之而必爲
  - page: 371
    col: 16
    role: j
    text: 之辭
  - page: 372
    col: 1
    role: z
    text: 夫音扶舎上聲○欲之謂貪其利
  - page: 372
    col: 2
    role: j
    text: 丘也聞有國有家者不患寡而患不均
  - page: 372
    col: 3
    role: j
    text: 不患貧而患不安蓋均無貧和無寡安
  - page: 372
    col: 4
    role: j
    text: 無傾
  - page: 372
    col: 5
    role: z
    text: 寡謂民少貧謂財乏均謂各得其分
  - page: 372
    col: 6
    role: z
    text: 安謂上下相安季氏之欲取顓臾患
  - page: 372
    col: 7
    role: z
    text: 寡與貧耳然是時季氏據國而魯公
  - page: 372
    col: 8
    role: z
    text: 無民則不均矣君弱臣強互生嫌隙
  - page: 372
    col: 9
    role: z
    text: 則不安矣均則不患於貧而和和則
  - page: 372
    col: 10
    role: z
    text: 不患於寡而安安則不相疑忌而無
  - page: 372
    col: 11
    role: z
    text: 傾覆之患
  - page: 372
    col: 12
    role: j
    text: 夫如是故遠人不服則脩文德以來之
  - page: 372
    col: 13
    role: j
    text: 既來之則安之
  - page: 372
    col: 14
    role: z
    text: 夫音扶○内治脩然後遠人服有不
  - page: 372
    col: 15
    role: z
    text: 服則脩德以來之亦不當勤兵於遠
  - page: 372
    col: 16
    role: j
    text: 今由與求也相夫子遠人不服而不能
  - page: 373
    col: 1
    role: j
    text: 來也邦分崩離析而不能守也
  - page: 373
    col: 2
    role: z
    text: 子路雖不與謀而素不能輔之以義
  - page: 373
    col: 3
    role: z
    text: 亦不得爲無罪故并責之遠人謂顓
  - page: 373
    col: 4
    role: z
    text: 臾分崩離析謂四分公室家臣屢叛
  - page: 373
    col: 5
    role: j
    text: 而謀動干戈於邦内吾恐季孫之憂不
  - page: 373
    col: 6
    role: j
    text: 在顓臾而在蕭墻之内也
  - page: 373
    col: 7
    role: z
    text: 干楯也戈戟也蕭墻屏也言不均不
  - page: 373
    col: 8
    role: z
    text: 和内變將作其後哀公果欲以越伐
  - page: 373
    col: 9
    role: z
    text: 魯而去季氏○謝氏曰當是時三家
  - page: 373
    col: 10
    role: z
    text: 強公室弱冉求又欲伐顓臾以附益
  - page: 373
    col: 11
    role: z
    text: 之夫子所以深罪之爲其瘠魯以肥
  - page: 373
    col: 12
    role: z
    text: 三家也○洪氏曰二子仕於季氏凡
  - page: 373
    col: 13
    role: z
    text: 季氏所欲爲必以告於夫子則因夫
  - page: 373
    col: 14
    role: z
    text: 子之言而救止者宜亦多矣伐顓臾
  - page: 373
    col: 15
    role: z
    text: 之事不見於經傳其以夫子之言而
  - page: 373
    col: 16
    role: z
    text: 止也與
  - page: 374
    col: 1
    role: j
    text: 孔子曰天下有道則禮樂征伐自天子
  - page: 374
    col: 2
    role: j
    text: 出天下無道則禮樂征伐自諸侯出自
  - page: 374
    col: 3
    role: j
    text: 諸侯出蓋十世希不失矣自大夫出五
  - page: 374
    col: 4
    role: j
    text: 世希不失矣陪臣執國命三世希不失
  - page: 374
    col: 5
    role: j
    text: 矣
  - page: 374
    col: 6
    role: z
    text: 先王之制諸侯不得變禮樂專征伐
  - page: 374
    col: 7
    role: z
    text: 陪臣家臣也逆理愈甚則其失之愈
  - page: 374
    col: 8
    role: z
    text: 速大約世數不過如此
  - page: 374
    col: 9
    role: j
    text: 天下有道則政不在大夫
  - page: 374
    col: 10
    role: z
    text: 言不得專政
  - page: 374
    col: 11
    role: j
    text: 天下有道則庶人不議
  - page: 374
    col: 12
    role: z
    text: 上無失政則下無私議非籍其口使
  - page: 374
    col: 13
    role: z
    text: 不敢言也○此章通論天下之勢
  - page: 374
    col: 14
    role: j
    text: 孔子曰祿之去公室五世矣政逮於大
  - page: 374
    col: 15
    role: j
    text: 夫四世矣故夫三桓之子孫微矣
  - page: 374
    col: 16
    role: z
    text: 夫音扶○魯自文公薨公子遂殺子
  - page: 375
    col: 1
    role: z
    text: 赤立宣公而君失其政歷成襄昭定
  - page: 375
    col: 2
    role: z
    text: 凡五公逮及也自季武子始專國政
  - page: 375
    col: 3
    role: z
    text: 歷悼平桓子凡四世而爲家臣陽虎
  - page: 375
    col: 4
    role: z
    text: 所執三桓三家皆桓公之後此以前
  - page: 375
    col: 5
    role: z
    text: 章之說推之而知其當然○此章專
  - page: 375
    col: 6
    role: z
    text: 論魯事疑與前章皆定公時語○蘇
  - page: 375
    col: 7
    role: z
    text: 氏曰禮樂征伐自諸侯出宜諸侯之
  - page: 375
    col: 8
    role: z
    text: 強也而魯以失政政逮於大夫宜大
  - page: 375
    col: 9
    role: z
    text: 夫之強也而三桓以微何也強
  - page: 375
    col: 10
    role: z
    text: 生於安安生於上下之分定今
  - page: 375
    col: 11
    role: z
    text: 諸侯大夫皆陵其上則無以令
  - page: 375
    col: 12
    role: z
    text: 其下矣故皆不久而失之也
  - page: 375
    col: 13
    role: j
    text: 孔子曰益者三友損者三友友直
  - page: 375
    col: 14
    role: j
    text: 友諒友多聞益矣友便辟友善柔
  - page: 375
    col: 15
    role: j
    text: 友便佞損矣
  - page: 375
    col: 16
    role: z
    text: 便平聲辟婢亦反○友直則聞其過
  - page: 376
    col: 1
    role: z
    text: 友諒則進於誠友多聞則進於明便
  - page: 376
    col: 2
    role: z
    text: 習熟也便辟謂習於威儀而不直善
  - page: 376
    col: 3
    role: z
    text: 柔謂工於媚說而不諒便佞謂習於
  - page: 376
    col: 4
    role: z
    text: 口語而無聞見之實三者損益正相
  - page: 376
    col: 5
    role: z
    text: 反也○尹氏曰自天子以至於庶人
  - page: 376
    col: 6
    role: z
    text: 未有不須友以成者而其損益有如
  - page: 376
    col: 7
    role: z
    text: 是者可不謹哉
  - page: 376
    col: 8
    role: j
    text: 孔子曰益者三樂損者三樂樂節禮樂
  - page: 376
    col: 9
    role: j
    text: 樂道人之善樂多賢友益矣樂驕樂樂
  - page: 376
    col: 10
    role: j
    text: 佚遊樂宴樂損矣
  - page: 376
    col: 11
    role: z
    text: 樂五敎反禮樂之樂音岳驕樂宴樂
  - page: 376
    col: 12
    role: z
    text: 之樂音洛○節謂辨其制度聲容之
  - page: 376
    col: 13
    role: z
    text: 節驕樂則侈肆而不知節佚遊則惰
  - page: 376
    col: 14
    role: z
    text: 慢而惡聞善宴樂則淫溺而狎小人
  - page: 376
    col: 15
    role: z
    text: 三者損益亦相反也○尹氏曰君子
  - page: 376
    col: 16
    role: z
    text: 之於好樂可不謹哉
  - page: 377
    col: 1
    role: j
    text: 孔子曰侍於君子有三愆言未及之而
  - page: 377
    col: 2
    role: j
    text: 言謂之躁言及之而不言謂之隱未見
  - page: 377
    col: 3
    role: j
    text: 顏色而言謂之瞽
  - page: 377
    col: 4
    role: z
    text: 君子有德位之通稱愆過也瞽無目
  - page: 377
    col: 5
    role: z
    text: 不能察言觀色○尹氏曰時然後言
  - page: 377
    col: 6
    role: z
    text: 則無三者之過矣
  - page: 377
    col: 7
    role: j
    text: 孔子曰君子有三戒少之時血氣未定
  - page: 377
    col: 8
    role: j
    text: 戒之在色及其壯也血氣方剛戒之在
  - page: 377
    col: 9
    role: j
    text: 鬭及其老也血氣既衰戒之在得
  - page: 377
    col: 10
    role: z
    text: 血氣形之所待以生者血陰而氣陽
  - page: 377
    col: 11
    role: z
    text: 也得貪得也隨時知戒以理勝之則
  - page: 377
    col: 12
    role: z
    text: 不爲血氣所使也○范氏曰聖人同
  - page: 377
    col: 13
    role: z
    text: 於人者血氣也異於人者志氣也血
  - page: 377
    col: 14
    role: z
    text: 氣有時而衰志氣則無時而衰也少
  - page: 377
    col: 15
    role: z
    text: 未定壯而剛老而衰者血氣也戒於
  - page: 377
    col: 16
    role: z
    text: 色戒於鬭戒於得者志氣也君子養
  - page: 378
    col: 1
    role: z
    text: 其志氣故不爲血氣所動是以年彌
  - page: 378
    col: 2
    role: z
    text: 髙而德彌邵也
  - page: 378
    col: 3
    role: j
    text: 孔子曰君子有三畏畏天命畏大人畏
  - page: 378
    col: 4
    role: j
    text: 聖人之言
  - page: 378
    col: 5
    role: z
    text: 畏者嚴憚之意也天命者天所賦之
  - page: 378
    col: 6
    role: z
    text: 正理也知其可畏則其戒謹恐懼自
  - page: 378
    col: 7
    role: z
    text: 有不能已者而付畀之重可以不失
  - page: 378
    col: 8
    role: z
    text: 矣大人聖言皆天命所當畏知畏天
  - page: 378
    col: 9
    role: z
    text: 命則不得不畏之矣
  - page: 378
    col: 10
    role: j
    text: 小人不知天命而不畏也狎大人侮聖
  - page: 378
    col: 11
    role: j
    text: 人之言
  - page: 378
    col: 12
    role: z
    text: 侮戲玩也不知天命故不識義理而
  - page: 378
    col: 13
    role: z
    text: 無所忌憚如此○尹氏曰三畏者脩
  - page: 378
    col: 14
    role: z
    text: 己之所當然也小人不務脩身誠己
  - page: 378
    col: 15
    role: z
    text: 則何畏之有
  - page: 378
    col: 16
    role: j
    text: 孔子曰生而知之者上也學而知之者
  - page: 379
    col: 1
    role: j
    text: 次也困而學之又其次也困而不學民
  - page: 379
    col: 2
    role: j
    text: 斯爲下矣
  - page: 379
    col: 3
    role: z
    text: 困謂有所不通言人之氣質不同大
  - page: 379
    col: 4
    role: z
    text: 約有此四等○楊氏曰生知學知以
  - page: 379
    col: 5
    role: z
    text: 至困學雖其質不同然及其知之一
  - page: 379
    col: 6
    role: z
    text: 也故君子唯學之爲貴困而不學然
  - page: 379
    col: 7
    role: z
    text: 後爲下
  - page: 379
    col: 8
    role: j
    text: 孔子曰君子有九思視思明聽思聰色
  - page: 379
    col: 9
    role: j
    text: 思温貌思恭言思忠事思敬疑思問忿
  - page: 379
    col: 10
    role: j
    text: 思難見得思義
  - page: 379
    col: 11
    role: z
    text: 難去聲○視無所蔽則明無不見聽
  - page: 379
    col: 12
    role: z
    text: 無所壅則聰無不聞色見於面者貌
  - page: 379
    col: 13
    role: z
    text: 舉身而言思問則疑不蓄思難則忿
  - page: 379
    col: 14
    role: z
    text: 必懲思義則得不苟○程子曰九思
  - page: 379
    col: 15
    role: z
    text: 各專其一○謝氏曰未至於從容中
  - page: 379
    col: 16
    role: z
    text: 道無時而不自省察也雖有不存焉
  - page: 380
    col: 1
    role: z
    text: 者寡矣此之謂思誠
  - page: 380
    col: 2
    role: j
    text: 孔子曰見善如不及見不善如探湯吾
  - page: 380
    col: 3
    role: j
    text: 見其人矣吾聞其語矣
  - page: 380
    col: 4
    role: z
    text: 探吐南反○眞知善惡而誠好惡之
  - page: 380
    col: 5
    role: z
    text: 顏曾閔冉之徒蓋能之矣語蓋古語
  - page: 380
    col: 6
    role: z
    text: 也
  - page: 380
    col: 7
    role: j
    text: 隱居以求其志行義以達其道吾聞其
  - page: 380
    col: 8
    role: j
    text: 語矣未見其人也
  - page: 380
    col: 9
    role: z
    text: 求其志守其所達之道也達其道行
  - page: 380
    col: 10
    role: z
    text: 其所求之志也蓋惟伊尹太公之流
  - page: 380
    col: 11
    role: z
    text: 可以當之當時若顏子亦庶乎此然
  - page: 380
    col: 12
    role: z
    text: 隱而未見又不幸而蚤死故夫子言
  - page: 380
    col: 13
    role: z
    text: 然
  - page: 380
    col: 14
    role: j
    text: 齊景公有馬千駟死之日民無德而稱
  - page: 380
    col: 15
    role: j
    text: 焉伯夷叔齊餓于首陽之下民到于今
  - page: 380
    col: 16
    role: j
    text: 稱之
  - page: 381
    col: 1
    role: z
    text: 駟四馬也首陽山名
  - page: 381
    col: 2
    role: j
    text: 其斯之謂與
  - page: 381
    col: 3
    role: z
    text: 與平聲○胡氏曰程子以爲第十二
  - page: 381
    col: 4
    role: z
    text: 篇錯簡誠不以富亦祗以異當在此
  - page: 381
    col: 5
    role: z
    text: 章之首今詳文勢似當在此句之上
  - page: 381
    col: 6
    role: z
    text: 言人之所稱不在於富而在於異也
  - page: 381
    col: 7
    role: z
    text: 愚謂此說近是而章首當有孔子曰
  - page: 381
    col: 8
    role: z
    text: 字蓋闕文耳大抵此書後十篇多闕
  - page: 381
    col: 9
    role: z
    text: 誤
  - page: 381
    col: 10
    role: j
    text: 陳亢問於伯魚曰子亦有異聞乎
  - page: 381
    col: 11
    role: z
    text: 亢音剛○亢以私意窺聖人疑必陰
  - page: 381
    col: 12
    role: z
    text: 厚其子
  - page: 381
    col: 13
    role: j
    text: 對曰未也嘗獨立鯉趨而過庭曰學詩
  - page: 381
    col: 14
    role: j
    text: 乎對曰未也不學詩無以言鯉退而學
  - page: 381
    col: 15
    role: j
    text: 詩
  - page: 381
    col: 16
    role: z
    text: 事理通達而心氣和平故能言
  - page: 382
    col: 1
    role: j
    text: 他日又獨立鯉趨而過庭曰學禮乎對
  - page: 382
    col: 2
    role: j
    text: 曰未也不學禮無以立鯉退而學禮
  - page: 382
    col: 3
    role: z
    text: 品節詳明而德性堅定故能立
  - page: 382
    col: 4
    role: j
    text: 聞斯二者
  - page: 382
    col: 5
    role: z
    text: 當獨立之時所聞不過如此其無異
  - page: 382
    col: 6
    role: j
    text: 聞可知
  - page: 382
    col: 7
    role: j
    text: 陳亢退而喜曰問一得三聞詩聞禮又
  - page: 382
    col: 8
    role: j
    text: 聞君子之遠其子也
  - page: 382
    col: 9
    role: z
    text: 遠去聲○尹氏曰孔子之敎其子無
  - page: 382
    col: 10
    role: j
    text: 異於門人故陳亢以爲遠其子
  - page: 382
    col: 11
    role: j
    text: 邦君之妻君稱之曰夫人夫人自稱曰
  - page: 382
    col: 12
    role: j
    text: 小童邦人稱之曰君夫人稱諸異邦曰
  - page: 382
    col: 13
    role: j
    text: 寡小君異邦人稱之亦曰君夫人
  - page: 382
    col: 14
    role: z
    text: 寡寡德謙辭○吳氏曰凡語中所載
  - page: 382
    col: 15
    role: j
    text: 如此類者不知何謂或古有之或夫
  - page: 382
    col: 16
    role: j
    text: 子嘗言之不可攷也
