aboutHtml: |-
  <h2>關於此卷</h2>
  <p>《史記》傳姜立綱抄本，明人台閣體楷書精抄，現藏新加坡國立大學。此卷以數字化書影為據，復刻卷首三葉（五帝本紀開卷），無界格、行疏字密、朱筆句讀之寫本神韻，並程序化重現紙張紋理與書葉疊壓之感。</p>
