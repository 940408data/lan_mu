# 史記卷一·五帝本紀（傳姜立綱寫本）：j 為經文大字單行；行款依書影（半葉八行行二十字）。
sections:
  - id: wudi
    name: 五帝本紀
    blocks:
      - { type: title, text: "五帝本紀" }
      - { type: j, text: "黃帝者少典之子姓公孫名曰軒轅生而神靈弱而能言幼而徇齊長而敦敏成而聰明軒轅之時神農氏世衰諸侯相侵伐暴虐百姓而神農氏弗能征於是軒轅乃習用干戈以征不享諸侯咸來賓從而蚩尤最為暴莫能伐炎帝欲侵陵諸侯諸侯咸歸軒轅軒轅乃修德振兵治五氣藝五種撫萬民度四方教熊羆貔貅貙虎以與炎帝戰於阪泉之野三戰然後得其志蚩尤作亂不用帝命於是黃帝乃徵師諸侯與蚩尤戰於涿鹿之野遂禽殺蚩尤而諸侯咸尊軒轅為天子代神農氏是為黃帝天下有不順者黃帝從而征之平者去之披山通道未嘗寧居東至于海登丸山及岱宗西至于空桐登雞頭南至于江登熊湘北逐葷粥合符釜山而邑于涿鹿之阿遷徙往來無常處以師兵為營衛官名皆以雲命為雲師置左右大監監于萬國萬國和而鬼神山川封禪與為多焉獲寶鼎迎日推筴舉風后力牧常先大鴻以治民順天地之紀幽明之占死生之說存亡之難時播百穀草木淳化鳥獸蟲蛾旁羅日月星辰水波土石金玉勞勤心力耳目節用水火材物有土德之瑞故號黃帝黃帝二十五子其得姓者十四人黃帝居軒轅之丘而娶於西陵之女是為嫘祖嫘祖為黃帝正妃生二子其後皆有天下其一曰玄囂是為青陽青陽降居江水其二曰昌意降居若水昌意娶蜀山氏女曰昌僕生高陽高陽有聖德焉黃帝崩葬橋山其孫昌意之子高陽立是為帝顓頊也" }
      - { type: j, text: "帝顓頊高陽者黃帝之孫而昌意之子也靜淵以有謀疏通知知事養材以任地載時以象天依鬼神以制義治氣以教化潔誠以祭祀北至于幽陵南至于交趾西至于流沙東至于蟠木動靜之物小大之神日月所照莫不砥屬帝顓頊生子曰窮蟬顓頊崩而玄囂之孫高辛立是為帝嚳" }
      - { type: j, text: "帝嚳高辛者黃帝之曾孫也高辛父曰蟜極蟜極父曰玄囂玄囂父曰黃帝自玄囂與蟜極皆不得在位至高辛即帝位高辛於顓頊為族子高辛生而神靈自言其名普施利物不於其身聰以知遠明以察微順天之義知民之急仁而威惠而信修身而天下服取地之財而節用之撫教萬民而利誨之曆日月而迎送之明鬼神而敬事之其色郁郁其德嶷嶷其動也時其服也士帝嚳溉執中而徧天下日月所照風" }
