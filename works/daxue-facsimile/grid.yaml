labels:
  - page: 2
    col: 1
    role: j
    text: 大學章句序
  - page: 2
    col: 2
    role: j
    text: 大學之書古之大學所以教人之法也
  - page: 2
    col: 3
    role: j
    text: 蓋自天降生民則旣莫不與之以仁義
  - page: 2
    col: 4
    role: j
    text: 禮智之性然其氣質之稟或不能齊是
  - page: 2
    col: 5
    role: j
    text: 以不能皆有以知其性之所有而全之
  - page: 2
    col: 6
    role: j
    text: 也一有聰明睿智能盡其性者出於其
  - page: 2
    col: 7
    role: j
    text: 閒則天必命之以爲億兆之君師使之
  - page: 2
    col: 8
    role: j
    text: 治而教之以復其性此伏羲神農黃帝
  - page: 3
    col: 1
    role: j
    text: 堯舜所以繼天立極而司徒之職典樂
  - page: 3
    col: 2
    role: j
    text: 之官所由設也三代之隆其法寖備然
  - page: 3
    col: 3
    role: j
    text: 後王宮國都以及閭巷莫不有學人生
  - page: 3
    col: 4
    role: j
    text: 八歲則自王公以下至於庶人之子弟
  - page: 3
    col: 5
    role: j
    text: 皆入小學而教之以洒埽應對進退之
  - page: 3
    col: 6
    role: j
    text: 節禮樂射御書數之文及其十有五年
  - page: 3
    col: 7
    role: j
    text: 則自天子之元子衆子以至公卿大夫
  - page: 3
    col: 8
    role: j
    text: 元士之適子與凡民之俊秀皆入大學
  - page: 3
    col: 9
    role: j
    text: 而教之以窮理正心修己治人之道此
  - page: 3
    col: 10
    role: j
    text: 又學校之教大小之節所以分也夫以
  - page: 3
    col: 11
    role: j
    text: 學校之設其廣如此教之之術其次第
  - page: 3
    col: 12
    role: j
    text: 節目之詳又如此而其所以爲教則又
  - page: 3
    col: 13
    role: j
    text: 皆本之人君躬行心得之餘不待求之
  - page: 3
    col: 14
    role: j
    text: 民生日用彝倫之外是以當世之人無
  - page: 3
    col: 15
    role: j
    text: 不學其學焉者無不有以知其性分之
  - page: 3
    col: 16
    role: j
    text: 所固有職分之所當爲而各俛焉以盡
  - page: 4
    col: 1
    role: j
    text: 其力此古昔盛時所以治隆於上俗美
  - page: 4
    col: 2
    role: j
    text: 於下而非後世之所能及也及周之衰
  - page: 4
    col: 3
    role: j
    text: 賢聖之君不作學校之政不修教化陵
  - page: 4
    col: 4
    role: j
    text: 夷風俗頹敗時則有若孔子之聖而不
  - page: 4
    col: 5
    role: j
    text: 得君師之位以行其政教於是獨取先
  - page: 4
    col: 6
    role: j
    text: 王之法誦而傳之以詔後世若曲禮少
  - page: 4
    col: 7
    role: j
    text: 儀內則弟子職諸篇固小學之支流餘
  - page: 4
    col: 8
    role: j
    text: 裔而此篇者則因小學之成功以著大
  - page: 4
    col: 9
    role: j
    text: 學之明法外有以極其規模之大而內
  - page: 4
    col: 10
    role: j
    text: 有以盡其節目之詳者也三千之徒蓋
  - page: 4
    col: 11
    role: j
    text: 莫不聞其說而曾氏之傳獨得其宗於
  - page: 4
    col: 12
    role: j
    text: 是作爲傳義以發其意及孟子没而其
  - page: 4
    col: 13
    role: j
    text: 傳泯焉則其書雖存而知者鮮矣自是
  - page: 4
    col: 14
    role: j
    text: 以來俗儒記誦詞章之習其功倍於小
  - page: 4
    col: 15
    role: j
    text: 學而無用異端虛無寂滅之教其高過
  - page: 4
    col: 16
    role: j
    text: 於大學而無實其他權謀術數一切以
  - page: 5
    col: 1
    role: j
    text: 就功名之說與夫百家衆技之流所以
  - page: 5
    col: 2
    role: j
    text: 惑世誣民充塞仁義者又紛然雜出乎
  - page: 5
    col: 3
    role: j
    text: 其聞使其君子不幸而不得聞大道之
  - page: 5
    col: 4
    role: j
    text: 要其小人不幸而不得蒙至治之澤晦
  - page: 5
    col: 5
    role: j
    text: 盲否塞反覆沈痼以及五季之衰而壞
  - page: 5
    col: 6
    role: j
    text: 亂極矣天運循環無往不復
  - page: 5
    col: 7
    role: j
    text: 宋德隆盛治教休明於是河南程氏兩
  - page: 5
    col: 8
    role: j
    text: 夫子出而有以接乎孟氏之傳實始尊
  - page: 5
    col: 9
    role: j
    text: 信此篇而表章之旣又爲之次其簡編
  - page: 5
    col: 10
    role: j
    text: 發其歸趣然後古者大學教人之法聖
  - page: 5
    col: 11
    role: j
    text: 經賢傳之指粲然復明於世雖以熹之
  - page: 5
    col: 12
    role: j
    text: 不敏亦幸私淑而與有聞焉顧其爲書
  - page: 5
    col: 13
    role: j
    text: 猶頗放失是以忘其固陋采而輯之閒
  - page: 5
    col: 14
    role: j
    text: 亦竊附己意補其闕略以俟後之君子
  - page: 5
    col: 15
    role: j
    text: 極知僣踰無所逃罪然於
  - page: 5
    col: 16
    role: j
    text: 國家化民成俗之意學者修己治人之
  - page: 6
    col: 1
    role: j
    text: 方則未必無小補云淳熙己酉二月甲
  - page: 6
    col: 2
    role: j
    text: 子新安朱熹序
  - page: 6
    col: 9
    role: j
    text: 大學朱熹章句
  - page: 6
    col: 10
    role: z
    text: 大舊音泰今讀如字
  - page: 6
    col: 11
    role: j
    text: 子程子曰大學孔氏之遺書而初學
  - page: 6
    col: 12
    role: j
    text: 入德之門也於今可見古人為學次
  - page: 6
    col: 13
    role: j
    text: 第者獨賴此篇之存而論孟次之學
  - page: 6
    col: 14
    role: j
    text: 者必由是而學焉則庶乎其不差矣
  - page: 6
    col: 15
    role: j
    text: 大學之道在明明德在親民在止於至
  - page: 6
    col: 16
    role: j
    text: 善
  - page: 7
    col: 1
    role: z
    text: 程子曰親當作新○大學者大人之
  - page: 7
    col: 2
    role: z
    text: 學也明明之也明德者人之所得乎
  - page: 7
    col: 3
    role: z
    text: 天而虛靈不昧以具衆理而應萬事
  - page: 7
    col: 4
    role: z
    text: 者也但爲氣稟所拘人欲所蔽則有
  - page: 7
    col: 5
    role: z
    text: 時而昏然其本體之明則有未嘗息
  - page: 7
    col: 6
    role: z
    text: 者故學者當因其所發而遂明之以
  - page: 7
    col: 7
    role: z
    text: 復其初也新者革其舊之謂也言旣
  - page: 7
    col: 8
    role: z
    text: 自明其明德又當推以及人使之亦
  - page: 7
    col: 9
    role: z
    text: 有以去其舊染之汙也止者必至於
  - page: 7
    col: 10
    role: z
    text: 是而不遷之意至善則事理當然之
  - page: 7
    col: 11
    role: z
    text: 極也言明明德新民皆當至於至善
  - page: 7
    col: 12
    role: z
    text: 之地而不遷蓋必其有以盡夫天理
  - page: 7
    col: 13
    role: z
    text: 之極而無一毫人欲之私也此三者
  - page: 7
    col: 14
    role: z
    text: 大學之綱領也
  - page: 7
    col: 15
    role: j
    text: 知止而后有定定而后能靜靜而后能
  - page: 7
    col: 16
    role: j
    text: 安安而后能慮慮而后能得
  - page: 8
    col: 1
    role: z
    text: 后與後同後放此○止者所當止之
  - page: 8
    col: 2
    role: z
    text: 地即至善之所在也知之則志有定
  - page: 8
    col: 3
    role: z
    text: 向靜謂心不妄動安謂所處而安慮
  - page: 8
    col: 4
    role: z
    text: 謂處事精詳得謂得其所止
  - page: 8
    col: 5
    role: j
    text: 物有本末事有終始知所先後則近道
  - page: 8
    col: 6
    role: j
    text: 矣
  - page: 8
    col: 7
    role: z
    text: 明德為本新民為末知止為始能得
  - page: 8
    col: 8
    role: z
    text: 為終本始所先末終所後此結上文
  - page: 8
    col: 9
    role: z
    text: 兩節之意
  - page: 8
    col: 10
    role: j
    text: 古之欲明明德於天下者先治其國欲
  - page: 8
    col: 11
    role: j
    text: 治其國者先齊其家欲齊其家者先脩
  - page: 8
    col: 12
    role: j
    text: 其身欲脩其身者先正其心欲正其心
  - page: 8
    col: 13
    role: j
    text: 者先誠其意欲誠其意者先致其知致
  - page: 8
    col: 14
    role: j
    text: 知在格物
  - page: 8
    col: 15
    role: z
    text: 治平聲後放此○明明德於天下者
  - page: 8
    col: 16
    role: z
    text: 使天下之人皆有以明其明德也心
  - page: 9
    col: 1
    role: z
    text: 者身之所主也誠實也意者心之所
  - page: 9
    col: 2
    role: z
    text: 發也實其心之所發欲其一於善而
  - page: 9
    col: 3
    role: z
    text: 無自欺也致推極也知猶識也推極
  - page: 9
    col: 4
    role: z
    text: 吾之知識欲其所知無不盡也格至
  - page: 9
    col: 5
    role: z
    text: 也物猶事也窮至事物之理欲其極
  - page: 9
    col: 6
    role: z
    text: 處無不到也此八者大學之條目也
  - page: 9
    col: 7
    role: j
    text: 物格而后知至知至而后意誠意誠而
  - page: 9
    col: 8
    role: j
    text: 后心正心正而后身脩身脩而后家齊
  - page: 9
    col: 9
    role: j
    text: 家齊而后國治國治而后天下平
  - page: 9
    col: 10
    role: z
    text: 治去聲後放此○物格者物理之極
  - page: 9
    col: 11
    role: z
    text: 處無不到也知至者吾心之所知無
  - page: 9
    col: 12
    role: z
    text: 不盡也知既盡則意可得而實矣意
  - page: 9
    col: 13
    role: z
    text: 既實則心可得而正矣脩身以上明
  - page: 9
    col: 14
    role: z
    text: 明德之事也齊家以下新民之事也
  - page: 9
    col: 15
    role: z
    text: 物格知至則知所止矣意誠以下則
  - page: 9
    col: 16
    role: z
    text: 皆得所止之序也
  - page: 10
    col: 1
    role: j
    text: 自天子以至於庶人壹是皆以脩身爲
  - page: 10
    col: 2
    role: j
    text: 本
  - page: 10
    col: 3
    role: z
    text: 壹是一切也正心以上皆所以脩身
  - page: 10
    col: 4
    role: z
    text: 也齊家以下則舉此而錯之耳
  - page: 10
    col: 5
    role: j
    text: 其本亂而末治者否矣其所厚者薄而
  - page: 10
    col: 6
    role: j
    text: 其所薄者厚未之有也
  - page: 10
    col: 7
    role: z
    text: 本謂身也所厚謂家也此兩節結上
  - page: 10
    col: 8
    role: z
    text: 文兩節之意
  - page: 10
    col: 9
    role: title
    text: 右經一章蓋孔子之言而曾子述
  - page: 10
    col: 10
    role: j
    text: 之凡二百五字其傳十章則曾子之意
  - page: 10
    col: 11
    role: z
    text: 而門人記之也舊本頗有錯簡今
  - page: 10
    col: 12
    role: z
    text: 因程子所定而更考經文别爲序
  - page: 10
    col: 13
    role: z
    text: 次如左凡千五百四十六字
  - page: 10
    col: 14
    role: z
    text: 凡傳文雜引經傳若無統紀然
  - page: 10
    col: 15
    role: z
    text: 文理接續血脉貫通深淺始終
  - page: 10
    col: 16
    role: z
    text: 至爲精宻熟讀詳味乆當見之
  - page: 11
    col: 1
    role: z
    text: 今不盡釋也
  - page: 11
    col: 2
    role: j
    text: 康誥曰克明德
  - page: 11
    col: 3
    role: z
    text: 康誥周書克能也
  - page: 11
    col: 4
    role: j
    text: 大甲曰顧諟天之明命
  - page: 11
    col: 5
    role: z
    text: 大讀作泰諟古是字○大甲商書顧
  - page: 11
    col: 6
    role: z
    text: 謂常目在之也諟猶此也或曰審也
  - page: 11
    col: 7
    role: z
    text: 天之明命即天之所以與我而我之
  - page: 11
    col: 8
    role: z
    text: 所以爲德者也常目在之則無時不
  - page: 11
    col: 9
    role: z
    text: 明矣
  - page: 11
    col: 10
    role: j
    text: 帝典曰克明峻德
  - page: 11
    col: 11
    role: z
    text: 峻書作俊○帝典堯典虞書峻大也
  - page: 11
    col: 12
    role: j
    text: 皆自明也
  - page: 11
    col: 13
    role: z
    text: 結所引書皆言自明己德之意
  - page: 11
    col: 14
    role: title
    text: 右傳之首章釋明明德
  - page: 11
    col: 15
    role: z
    text: 此通下三章至止於信舊本誤
  - page: 11
    col: 16
    role: z
    text: 在沒世不忘之下
  - page: 12
    col: 1
    role: j
    text: 湯之盤銘曰苟日新日日新又日新
  - page: 12
    col: 2
    role: z
    text: 盤沐浴之盤也銘名其器以自警之
  - page: 12
    col: 3
    role: z
    text: 辭也苟誠也湯以人之洗濯其心以
  - page: 12
    col: 4
    role: z
    text: 去惡如沐浴其身以去垢故銘其盤
  - page: 12
    col: 5
    role: z
    text: 言誠能一日有以滌其舊染之汙而
  - page: 12
    col: 6
    role: z
    text: 自新則當因其已新者而日日新之
  - page: 12
    col: 7
    role: z
    text: 又曰新之不可略有閒斷也
  - page: 12
    col: 8
    role: j
    text: 康誥曰作新民
  - page: 12
    col: 9
    role: z
    text: 鼓之舞之之謂作言振起其自新之
  - page: 12
    col: 10
    role: z
    text: 民也
  - page: 12
    col: 11
    role: j
    text: 詩曰周雖舊邦其命惟新
  - page: 12
    col: 12
    role: z
    text: 詩大雅文王之篇言周國雖舊至於
  - page: 12
    col: 13
    role: z
    text: 文王能新其德以及於民而始受天
  - page: 12
    col: 14
    role: z
    text: 命也
  - page: 12
    col: 15
    role: j
    text: 是故君子無所不用其極
  - page: 12
    col: 16
    role: z
    text: 自新新民皆欲止於至善也
  - page: 13
    col: 1
    role: title
    text: 右傳之二章釋新民
  - page: 13
    col: 2
    role: j
    text: 詩云邦畿千里惟民所止
  - page: 13
    col: 3
    role: z
    text: 詩商頌玄鳥之篇邦畿王者之都也
  - page: 13
    col: 4
    role: z
    text: 止居也言物各有所當止之處也
  - page: 13
    col: 5
    role: j
    text: 詩云緡蠻黃鳥止于丘隅子曰於止知
  - page: 13
    col: 6
    role: j
    text: 其所止可以人而不如鳥乎
  - page: 13
    col: 7
    role: z
    text: 緡詩作綿○詩小雅綿蠻之篇緡蠻
  - page: 13
    col: 8
    role: z
    text: 鳥聲丘隅岑蔚之處子曰以下孔子
  - page: 13
    col: 9
    role: z
    text: 說詩之辭言人當知所當止之處也
  - page: 13
    col: 10
    role: j
    text: 詩云穆穆文王於緝熙敬止為人君止
  - page: 13
    col: 11
    role: j
    text: 於仁為人臣止於敬為人子止於孝為
  - page: 13
    col: 12
    role: j
    text: 人父止於慈與國人交止於信
  - page: 13
    col: 13
    role: z
    text: 於緝之於音烏○詩文王之篇穆穆
  - page: 13
    col: 14
    role: z
    text: 深遠之意於歎美辭緝繼續也熙光
  - page: 13
    col: 15
    role: z
    text: 明也敬止言其無不敬而安所止也
  - page: 13
    col: 16
    role: z
    text: 引此而言聖人之止無非至善五者
  - page: 14
    col: 1
    role: z
    text: 乃其目之大者也學者於此究其精
  - page: 14
    col: 2
    role: z
    text: 微之蘊而又推類以盡其餘則於天
  - page: 14
    col: 3
    role: z
    text: 下之事皆有以知其所止而無疑矣
  - page: 14
    col: 4
    role: j
    text: 詩云瞻彼淇澳菉竹猗猗有斐君子如
  - page: 14
    col: 5
    role: j
    text: 切如磋如琢如磨瑟兮僩兮赫兮喧兮
  - page: 14
    col: 6
    role: j
    text: 有斐君子終不可諠兮如切如磋者道
  - page: 14
    col: 7
    role: j
    text: 學也如琢如磨者自脩也瑟兮僩兮者
  - page: 14
    col: 8
    role: j
    text: 恂慄也赫兮喧兮者威儀也有斐君子
  - page: 14
    col: 9
    role: j
    text: 終不可諠兮者道盛德至善民之不能
  - page: 14
    col: 10
    role: j
    text: 忘也
  - page: 14
    col: 11
    role: z
    text: 澳於六反菉詩作綠猗叶韻音阿僩
  - page: 14
    col: 12
    role: z
    text: 下版反喧詩作咺諠詩作諼並況晚
  - page: 14
    col: 13
    role: z
    text: 反恂鄭氏讀作峻○詩衛風淇澳之
  - page: 14
    col: 14
    role: z
    text: 篇淇水名澳隈也猗猗美盛貌興也
  - page: 14
    col: 15
    role: z
    text: 斐文貌切以刀鋸琢以椎鑿皆裁物
  - page: 14
    col: 16
    role: z
    text: 使成形質也磋以鑢鐋磨以沙石皆
  - page: 15
    col: 1
    role: z
    text: 治物使其滑澤也治骨角者既切而
  - page: 15
    col: 2
    role: z
    text: 復磋之治玉石者既琢而復磨之皆
  - page: 15
    col: 3
    role: z
    text: 言其治之有緒而益致其精也瑟嚴
  - page: 15
    col: 4
    role: z
    text: 密之貌僩武毅之貌赫喧宣著盛大
  - page: 15
    col: 5
    role: z
    text: 之貌諠忘也道言也學謂講習討論
  - page: 15
    col: 6
    role: z
    text: 之事自脩者省察克治之功恂慄戰
  - page: 15
    col: 7
    role: z
    text: 懼也威可畏也儀可象也引詩而釋
  - page: 15
    col: 8
    role: z
    text: 之以明明明德者之止於至善道學
  - page: 15
    col: 9
    role: z
    text: 自脩言其所以得之之由恂慄威儀
  - page: 15
    col: 10
    role: z
    text: 言其德容表裏之盛卒乃指其實而
  - page: 15
    col: 11
    role: z
    text: 歎美之也
  - page: 15
    col: 12
    role: j
    text: 詩云於戲前王不忘君子賢其賢而親
  - page: 15
    col: 13
    role: j
    text: 其親小人樂其樂而利其利此以沒世
  - page: 15
    col: 14
    role: j
    text: 不忘也
  - page: 15
    col: 15
    role: z
    text: 於戲音嗚呼樂音洛○詩周頌烈文
  - page: 15
    col: 16
    role: z
    text: 之篇於戲嘆辭前王謂文武也君子
  - page: 16
    col: 1
    role: z
    text: 謂其後賢後王小人謂後民也此言
  - page: 16
    col: 2
    role: z
    text: 前王所以新民者止於至善能使天
  - page: 16
    col: 3
    role: z
    text: 下後世無一物不得其所所以旣没
  - page: 16
    col: 4
    role: z
    text: 世而人思慕之愈乆而不忘也此兩
  - page: 16
    col: 5
    role: z
    text: 節咏嘆淫泆其味深長當熟玩之
  - page: 16
    col: 6
    role: title
    text: 右傳之三章釋止於至善
  - page: 16
    col: 7
    role: z
    text: 此章内自引淇澳詩以下舊本
  - page: 16
    col: 8
    role: z
    text: 誤在誠意章下
  - page: 16
    col: 9
    role: j
    text: 子曰聽訟吾猶人也必也使無訟乎無
  - page: 16
    col: 10
    role: j
    text: 情者不得盡其辭大畏民志此謂知本
  - page: 16
    col: 11
    role: j
    text: 猶人不異於人也情實也引夫子之
  - page: 16
    col: 12
    role: j
    text: 言而言聖人能使無實之人不敢盡
  - page: 16
    col: 13
    role: j
    text: 其虛誕之辭蓋我之明德旣明自然
  - page: 16
    col: 14
    role: j
    text: 有以畏服民之心志故訟不待聽而
  - page: 16
    col: 15
    role: j
    text: 自無也觀於此言可以知本末之先
  - page: 16
    col: 16
    role: j
    text: 後矣
  - page: 17
    col: 1
    role: title
    text: 右傳之四章釋本末
  - page: 17
    col: 2
    role: z
    text: 此章舊本誤在止於信下
  - page: 17
    col: 3
    role: j
    text: 此謂知本
  - page: 17
    col: 4
    role: z
    text: 程子曰衍文也
  - page: 17
    col: 5
    role: j
    text: 此謂知之至也
  - page: 17
    col: 6
    role: z
    text: 此句之上別有闕文此特其結語耳
  - page: 17
    col: 7
    role: title
    text: 右傳之五章蓋釋格物致知之義
  - page: 17
    col: 8
    role: z
    text: 而今云矣
  - page: 17
    col: 9
    role: z
    text: 此章舊本通下章誤在經文之
  - page: 17
    col: 10
    role: z
    text: 下
  - page: 17
    col: 11
    role: z
    text: 閒嘗竊取程子之意以補之曰所
  - page: 17
    col: 12
    role: z
    text: 謂致知在格物者言欲致吾之知
  - page: 17
    col: 13
    role: z
    text: 在即物而窮其理也蓋人心之靈
  - page: 17
    col: 14
    role: z
    text: 莫不有知而天下之物莫不有理
  - page: 17
    col: 15
    role: z
    text: 惟於理有未窮故其知有不盡也
  - page: 17
    col: 16
    role: z
    text: 是以大學始教必使學者即凡天
  - page: 18
    col: 1
    role: z
    text: 下之物莫不因巳知之理而益
  - page: 18
    col: 2
    role: z
    text: 窮之以求至乎其極至於用力之
  - page: 18
    col: 3
    role: z
    text: 乆而一旦豁然貫通焉則衆物之
  - page: 18
    col: 4
    role: z
    text: 表裏精粗無不到而吾心之全體
  - page: 18
    col: 5
    role: z
    text: 大用無不明矣此謂物格此謂知
  - page: 18
    col: 6
    role: z
    text: 之至也
  - page: 18
    col: 7
    role: j
    text: 所謂誠其意者毋自欺也如惡惡臭如
  - page: 18
    col: 8
    role: j
    text: 好好色此之謂自謙故君子必愼其獨
  - page: 18
    col: 9
    role: j
    text: 也
  - page: 18
    col: 10
    role: z
    text: 惡好上字皆去聲謙讀爲慊苦刼反
  - page: 18
    col: 11
    role: z
    text: ○誠其意者自脩之首也毋者禁止
  - page: 18
    col: 12
    role: z
    text: 之辭自欺云者知爲善以去惡而心
  - page: 18
    col: 13
    role: z
    text: 之所發有未實也慊快也足也獨者
  - page: 18
    col: 14
    role: z
    text: 人所不知而巳所獨知之地也言欲
  - page: 18
    col: 15
    role: z
    text: 自脩者知爲善以去其惡則當實用
  - page: 18
    col: 16
    role: z
    text: 其力而禁止其自欺使其惡惡則如
  - page: 19
    col: 1
    role: z
    text: 惡惡臭好善則如好好色皆務决去
  - page: 19
    col: 2
    role: z
    text: 而求必得之以自快足於己不可徒
  - page: 19
    col: 3
    role: z
    text: 苟且以徇外而爲人也然其實與不
  - page: 19
    col: 4
    role: z
    text: 實蓋有他人所不及知而己獨知之
  - page: 19
    col: 5
    role: z
    text: 者故必謹之於此以審其幾焉
  - page: 19
    col: 6
    role: j
    text: 小人閒居爲不善無所不至見君子而
  - page: 19
    col: 7
    role: j
    text: 后厭然揜其不善而著其善人之視己
  - page: 19
    col: 8
    role: j
    text: 如見其肺肝然則何益矣此謂誠於中
  - page: 19
    col: 9
    role: j
    text: 形於外故君子必慎其獨也
  - page: 19
    col: 10
    role: z
    text: 閒音閑厭鄭氏讀爲黶○閒居獨處
  - page: 19
    col: 11
    role: z
    text: 也厭然銷沮閉藏之貌此言小人陰
  - page: 19
    col: 12
    role: z
    text: 爲不善而陽欲揜之則是非不知善
  - page: 19
    col: 13
    role: z
    text: 之當爲與惡之當去也但不能實用
  - page: 19
    col: 14
    role: z
    text: 其力以至此耳然欲揜其惡而卒不
  - page: 19
    col: 15
    role: z
    text: 可揜欲詐爲善而卒不可詐則亦何
  - page: 19
    col: 16
    role: z
    text: 益之有哉此君子所以重以爲戒而
  - page: 20
    col: 1
    role: z
    text: 必謹其獨也
  - page: 20
    col: 2
    role: j
    text: 曾子曰十目所視十手所指其嚴乎
  - page: 20
    col: 3
    role: z
    text: 引此以明上文之意言雖幽獨之中
  - page: 20
    col: 4
    role: z
    text: 而其善惡之不可揜如此可畏之甚
  - page: 20
    col: 5
    role: z
    text: 也
  - page: 20
    col: 6
    role: j
    text: 富潤屋德潤身心廣體胖故君子必誠
  - page: 20
    col: 7
    role: j
    text: 其意
  - page: 20
    col: 8
    role: z
    text: 胖步丹反○胖安舒也言富則能潤
  - page: 20
    col: 9
    role: z
    text: 屋矣德則能潤身矣故心無愧怍則
  - page: 20
    col: 10
    role: z
    text: 廣大寬平而體常舒泰德之潤身者
  - page: 20
    col: 11
    role: z
    text: 然也蓋善之實於中而形於外者如
  - page: 20
    col: 12
    role: z
    text: 此故又言此以結之
  - page: 20
    col: 13
    role: title
    text: 右傳之六章釋誠意
  - page: 20
    col: 14
    role: z
    text: 經曰欲誠其意先致其知又曰
  - page: 20
    col: 15
    role: z
    text: 知至而后意誠蓋心體之明有
  - page: 20
    col: 16
    role: z
    text: 所未盡則其所發必有不能實
  - page: 21
    col: 1
    role: z
    text: 用其力而苟焉以自欺者然或
  - page: 21
    col: 2
    role: z
    text: 已明而不謹乎此則其所明又
  - page: 21
    col: 3
    role: z
    text: 非已有而無以爲進德之基故
  - page: 21
    col: 4
    role: z
    text: 此章之指必承上章而通考之
  - page: 21
    col: 5
    role: z
    text: 然後有以見其用力之始終其
  - page: 21
    col: 6
    role: z
    text: 序不可亂而功不可闕如此云
  - page: 21
    col: 7
    role: j
    text: 所謂脩身在正其心者身有所忿懥則
  - page: 21
    col: 8
    role: j
    text: 不得其正有所恐懼則不得其正有所
  - page: 21
    col: 9
    role: j
    text: 好樂則不得其正有所憂患則不得其
  - page: 21
    col: 10
    role: j
    text: 正
  - page: 21
    col: 11
    role: z
    text: 程子曰身有之身當作心忿弗粉反
  - page: 21
    col: 12
    role: z
    text: 懥敕值反好樂並去聲○忿懥怒也
  - page: 21
    col: 13
    role: z
    text: 蓋是四者皆心之用而人所不能無
  - page: 21
    col: 14
    role: z
    text: 者然一有之而不能察則欲動情勝
  - page: 21
    col: 15
    role: z
    text: 而其用之所行或不能不失其正矣
  - page: 21
    col: 16
    role: j
    text: 心不在焉視而不見聽而不聞食而不
  - page: 22
    col: 1
    role: j
    text: 知其味
  - page: 22
    col: 2
    role: z
    text: 心有不存則無以檢其身是以君子
  - page: 22
    col: 3
    role: z
    text: 必察乎此而敬以直之然後此心常
  - page: 22
    col: 4
    role: z
    text: 存而身無不脩也
  - page: 22
    col: 5
    role: j
    text: 此謂脩身在正其心
  - page: 22
    col: 6
    role: title
    text: 右傳之七章釋正心脩身
  - page: 22
    col: 7
    role: z
    text: 此亦承上章以起下章蓋意誠
  - page: 22
    col: 8
    role: z
    text: 則眞無惡而實有善矣所以能
  - page: 22
    col: 9
    role: z
    text: 存是心以檢其身然或但知誠
  - page: 22
    col: 10
    role: z
    text: 意而不能密察此心之存否則
  - page: 22
    col: 11
    role: z
    text: 又無以直内而脩身也○自此
  - page: 22
    col: 12
    role: z
    text: 以下並以舊文爲正
  - page: 22
    col: 13
    role: j
    text: 所謂齊其家在脩其身者人之其所親
  - page: 22
    col: 14
    role: j
    text: 愛而辟焉之其所賤惡而辟焉之其所
  - page: 22
    col: 15
    role: j
    text: 畏敬而辟焉之其所哀矜而辟焉之其
  - page: 22
    col: 16
    role: j
    text: 所敖惰而辟焉故好而知其惡惡而知
  - page: 23
    col: 1
    role: j
    text: 其美者天下鮮矣
  - page: 23
    col: 2
    role: z
    text: 辟讀爲僻惡而之惡敖好並去聲鮮
  - page: 23
    col: 3
    role: z
    text: 上聲○人謂衆人之猶於也辟猶偏
  - page: 23
    col: 4
    role: z
    text: 也五者在人本有當然之則然常人
  - page: 23
    col: 5
    role: z
    text: 之情惟其所向而不加審焉則必陷
  - page: 23
    col: 6
    role: z
    text: 於一偏而身不脩矣
  - page: 23
    col: 7
    role: j
    text: 故諺有之曰人莫知其子之惡莫知其
  - page: 23
    col: 8
    role: j
    text: 苗之碩
  - page: 23
    col: 9
    role: z
    text: 諺音彦碩叶韻時若反○諺俗語也
  - page: 23
    col: 10
    role: z
    text: 溺愛者不明貪得者無厭是則偏之
  - page: 23
    col: 11
    role: z
    text: 爲害而家之所以不齊也
  - page: 23
    col: 12
    role: j
    text: 此謂身不脩不可以齊其家
  - page: 23
    col: 13
    role: title
    text: 右傳之八章釋脩身齊家
  - page: 23
    col: 14
    role: j
    text: 所謂治國必先齊其家者其家不可教
  - page: 23
    col: 15
    role: j
    text: 而能教人者無之故君子不出家而成
  - page: 23
    col: 16
    role: j
    text: 教於國孝者所以事君也弟者所以事
  - page: 24
    col: 1
    role: j
    text: 長也慈者所以使衆也
  - page: 24
    col: 2
    role: z
    text: 弟去聲長上聲○身脩則家可教矣
  - page: 24
    col: 3
    role: z
    text: 孝弟慈所以脩身而教於家者也然
  - page: 24
    col: 4
    role: z
    text: 而國之所以事君事長使衆之道不
  - page: 24
    col: 5
    role: z
    text: 外乎此此所以家齊於上而教成於
  - page: 24
    col: 6
    role: z
    text: 下也
  - page: 24
    col: 7
    role: j
    text: 康誥曰如保赤子心誠求之雖不中不
  - page: 24
    col: 8
    role: j
    text: 遠矣未有學養子而后嫁者也
  - page: 24
    col: 9
    role: z
    text: 中去聲○此引書而釋之又明立教
  - page: 24
    col: 10
    role: z
    text: 之本不假強爲在識其端而推廣之
  - page: 24
    col: 11
    role: z
    text: 耳
  - page: 24
    col: 12
    role: j
    text: 一家仁一國興仁一家讓一國興讓一
  - page: 24
    col: 13
    role: j
    text: 人貪戾一國作亂其機如此此謂一言
  - page: 24
    col: 14
    role: j
    text: 僨事一人定國
  - page: 24
    col: 15
    role: z
    text: 僨音奮○一人謂君也機發動所由
  - page: 24
    col: 16
    role: z
    text: 也僨覆敗也此言教成於國之效
  - page: 25
    col: 1
    role: j
    text: 堯舜帥天下以仁而民從之桀紂帥天
  - page: 25
    col: 2
    role: j
    text: 下以暴而民從之其所令反其所好而
  - page: 25
    col: 3
    role: j
    text: 民不從是故君子有諸己而后求諸人
  - page: 25
    col: 4
    role: j
    text: 所藏乎身不恕而能喻諸人者未之有
  - page: 25
    col: 5
    role: j
    text: 也
  - page: 25
    col: 6
    role: z
    text: 好去聲○此又承上文一人定國而
  - page: 25
    col: 7
    role: z
    text: 言有善於己然後可以責人之善無
  - page: 25
    col: 8
    role: z
    text: 惡於己然後可以正人之惡皆推己
  - page: 25
    col: 9
    role: z
    text: 以及人所謂恕也不如是則所令反
  - page: 25
    col: 10
    role: z
    text: 其所好而民不從矣喻曉也
  - page: 25
    col: 11
    role: j
    text: 故治國在齊其家
  - page: 25
    col: 12
    role: z
    text: 通結上文
  - page: 25
    col: 13
    role: j
    text: 詩云桃之夭夭其葉蓁蓁之子于歸宜
  - page: 25
    col: 14
    role: j
    text: 其家人宜其家人而后可以教國人
  - page: 25
    col: 15
    role: z
    text: 夭平聲蓁音臻○詩周南桃夭之篇
  - page: 25
    col: 16
    role: z
    text: 夭夭少好貌蓁蓁美盛貌興也之子
  - page: 26
    col: 1
    role: j
    text: 猶言是子此指女子之嫁者而言也
  - page: 26
    col: 2
    role: z
    text: 婦人謂嫁曰歸宜猶善也
  - page: 26
    col: 3
    role: j
    text: 詩云宜兄宜弟宜兄宜弟而后可以教
  - page: 26
    col: 4
    role: j
    text: 國人
  - page: 26
    col: 5
    role: z
    text: 詩小雅蓼蕭篇
  - page: 26
    col: 6
    role: j
    text: 詩云其儀不忒正是四國其爲父子兄
  - page: 26
    col: 7
    role: j
    text: 弟足法而后民法之也
  - page: 26
    col: 8
    role: z
    text: 詩曹風鳴鳩篇忒差也
  - page: 26
    col: 9
    role: j
    text: 此謂治國在齊其家
  - page: 26
    col: 10
    role: z
    text: 此三引詩皆以咏歎上文之事而又
  - page: 26
    col: 11
    role: z
    text: 結之如此其味深長最宜潜玩
  - page: 26
    col: 12
    role: title
    text: 右傳之九章釋齊家治國
  - page: 26
    col: 13
    role: j
    text: 所謂平天下在治其國者上老老而民
  - page: 26
    col: 14
    role: j
    text: 興孝上長長而民興弟上恤孤而民不
  - page: 26
    col: 15
    role: j
    text: 倍是以君子有絜矩之道也
  - page: 26
    col: 16
    role: z
    text: 長上聲弟去聲倍與背同絜胡結反
  - page: 27
    col: 1
    role: z
    text: ○老老所謂老吾老也興謂有所感
  - page: 27
    col: 2
    role: z
    text: 發而興起也孤者幼而無父之稱絜
  - page: 27
    col: 3
    role: z
    text: 度也矩所以爲方也言此三者上行
  - page: 27
    col: 4
    role: z
    text: 下效捷於影響所謂家齊而國治也
  - page: 27
    col: 5
    role: z
    text: 亦可以見人心之所同而不可使有
  - page: 27
    col: 6
    role: z
    text: 一夫之不獲矣是以君子必當因其
  - page: 27
    col: 7
    role: z
    text: 所同推以度物使彼我之閒各得分
  - page: 27
    col: 8
    role: z
    text: 願則上下四旁均齊方正而天下平
  - page: 27
    col: 9
    role: z
    text: 矣
  - page: 27
    col: 10
    role: j
    text: 所惡於上毋以使下所惡於下毋以事
  - page: 27
    col: 11
    role: j
    text: 上所惡於前毋以先後所惡於後毋以
  - page: 27
    col: 12
    role: j
    text: 從前所惡於右毋以交於左所惡於左
  - page: 27
    col: 13
    role: j
    text: 毋以交於右此之謂絜矩之道
  - page: 27
    col: 14
    role: z
    text: 惡先並去聲○此覆解上文絜矩二
  - page: 27
    col: 15
    role: z
    text: 字之義如不欲上之無禮於我則必
  - page: 27
    col: 16
    role: z
    text: 以此度下之心而亦不敢以此無禮
  - page: 28
    col: 1
    role: z
    text: 使之不欲下之不忠於我則必以此
  - page: 28
    col: 2
    role: z
    text: 度上之心而亦不敢以此不忠事之
  - page: 28
    col: 3
    role: z
    text: 至於前後左右無不皆然則身之所
  - page: 28
    col: 4
    role: z
    text: 處上下四旁長短廣狹彼此如一而
  - page: 28
    col: 5
    role: z
    text: 無不方矣彼同有是心而興起焉者
  - page: 28
    col: 6
    role: z
    text: 又豈有一夫之不獲哉所操者約而
  - page: 28
    col: 7
    role: z
    text: 所及者廣此平天下之要道也故章
  - page: 28
    col: 8
    role: z
    text: 內之意皆自此而推之
  - page: 28
    col: 9
    role: j
    text: 詩云樂只君子民之父母民之所好好
  - page: 28
    col: 10
    role: j
    text: 之民之所惡惡之此之謂民之父母
  - page: 28
    col: 11
    role: z
    text: 樂音洛只音紙好惡並去聲下並同
  - page: 28
    col: 12
    role: z
    text: ○詩小雅南山有臺之篇只語助辭
  - page: 28
    col: 13
    role: z
    text: 言能絜矩而以民心爲己心則是愛
  - page: 28
    col: 14
    role: z
    text: 民如子而民愛之如父母矣
  - page: 28
    col: 15
    role: j
    text: 詩云節彼南山維石巖巖赫赫師尹民
  - page: 28
    col: 16
    role: j
    text: 具爾瞻有國者不可以不愼辟則爲天
  - page: 29
    col: 1
    role: j
    text: 下僇矣
  - page: 29
    col: 2
    role: z
    text: 節讀爲截辟讀爲僻僇與戮同○詩
  - page: 29
    col: 3
    role: z
    text: 小雅節南山之篇節截然髙大貌師
  - page: 29
    col: 4
    role: z
    text: 尹周太師尹氏也具俱也辟偏也言
  - page: 29
    col: 5
    role: z
    text: 在上者人所瞻仰不可不謹若不能
  - page: 29
    col: 6
    role: z
    text: 絜矩而好惡徇於一己之偏則身弑
  - page: 29
    col: 7
    role: z
    text: 國亡爲天下之大戮矣
  - page: 29
    col: 8
    role: j
    text: 詩云殷之未喪師克配上帝儀監于殷
  - page: 29
    col: 9
    role: j
    text: 峻命不易道得衆則得國失衆則失國
  - page: 29
    col: 10
    role: z
    text: 喪去聲儀詩作宜峻詩作駿易去聲
  - page: 29
    col: 11
    role: z
    text: ○詩文王篇師衆也配對也配上帝
  - page: 29
    col: 12
    role: z
    text: 言其爲天下君而對乎上帝也監視
  - page: 29
    col: 13
    role: z
    text: 也峻大也不易言難保也道言也引
  - page: 29
    col: 14
    role: z
    text: 詩而言此以結上文兩節之意有天
  - page: 29
    col: 15
    role: z
    text: 下者能存此心而不失則所以絜矩
  - page: 29
    col: 16
    role: z
    text: 而與民同欲者自不能已矣
  - page: 30
    col: 1
    role: j
    text: 是故君子先愼乎德有德此有人
  - page: 30
    col: 2
    role: j
    text: 此有土有土此有財有財此有用
  - page: 30
    col: 3
    role: z
    text: 先謹乎德承上文不可不謹而言德
  - page: 30
    col: 4
    role: z
    text: 即所謂明德有人謂得衆有土謂得
  - page: 30
    col: 5
    role: z
    text: 國有國則不患無財用矣
  - page: 30
    col: 6
    role: j
    text: 德者本也財者末也
  - page: 30
    col: 7
    role: z
    text: 本上文而言
  - page: 30
    col: 8
    role: j
    text: 外本内末爭民施奪
  - page: 30
    col: 9
    role: z
    text: 人君以德爲外以財爲内則是爭闘
  - page: 30
    col: 10
    role: z
    text: 其民而施之以刼奪之教也蓋財者
  - page: 30
    col: 11
    role: z
    text: 人之所同欲不能絜矩而欲專之則
  - page: 30
    col: 12
    role: z
    text: 民亦起而爭奪矣
  - page: 30
    col: 13
    role: j
    text: 是故財聚則民散財散則民聚
  - page: 30
    col: 14
    role: z
    text: 外本内末故財聚爭民施奪故民散
  - page: 30
    col: 15
    role: z
    text: 反是則有德而有人矣
  - page: 30
    col: 16
    role: j
    text: 是故言悖而岀者亦悖而入貨悖而入
  - page: 31
    col: 1
    role: j
    text: 者亦悖而出
  - page: 31
    col: 2
    role: z
    text: 悖布内反○悖逆也此以言之出入
  - page: 31
    col: 3
    role: z
    text: 明貨之出入也自先謹乎德以下至
  - page: 31
    col: 4
    role: z
    text: 此又因財貨以明能絜矩與不能者
  - page: 31
    col: 5
    role: z
    text: 之得失也
  - page: 31
    col: 6
    role: j
    text: 康誥曰惟命不于常道善則得之不善
  - page: 31
    col: 7
    role: j
    text: 則失之矣
  - page: 31
    col: 8
    role: z
    text: 道言也因上文引文王詩之意而申
  - page: 31
    col: 9
    role: z
    text: 言之其丁寧反覆之意益深切矣
  - page: 31
    col: 10
    role: j
    text: 楚書曰楚國無以為寶惟善以為寶
  - page: 31
    col: 11
    role: z
    text: 楚書楚語言不寶金玉而寶善人也
  - page: 31
    col: 12
    role: j
    text: 舅犯曰亡人無以為寶仁親以為寶
  - page: 31
    col: 13
    role: z
    text: 舅犯晉文公舅狐偃字子犯亡人文
  - page: 31
    col: 14
    role: z
    text: 公時為公子出亡在外也仁愛也事
  - page: 31
    col: 15
    role: z
    text: 見檀弓此兩節又明不外本而内末
  - page: 31
    col: 16
    role: z
    text: 之意
  - page: 32
    col: 1
    role: j
    text: 秦誓曰若有一个臣斷斷兮無他技其
  - page: 32
    col: 2
    role: j
    text: 心休休焉其如有容焉人之有技若己
  - page: 32
    col: 3
    role: j
    text: 有之人之彦聖其心好之不啻若自其
  - page: 32
    col: 4
    role: j
    text: 口出寔能容之以能保我子孫黎民尚
  - page: 32
    col: 5
    role: j
    text: 亦有利哉人之有技媢疾以惡人之之
  - page: 32
    col: 6
    role: j
    text: 彦聖而違之俾不通寔不能容以不能
  - page: 32
    col: 7
    role: j
    text: 保我子孫黎民亦曰殆哉
  - page: 32
    col: 8
    role: z
    text: 个古賀反書作介斷丁亂反媢音冒
  - page: 32
    col: 9
    role: z
    text: ○秦誓周書斷斷誠一之貌彦美士
  - page: 32
    col: 10
    role: z
    text: 也聖通明也尚庶幾也媢忌也違拂
  - page: 32
    col: 11
    role: z
    text: 戾也殆危也
  - page: 32
    col: 12
    role: j
    text: 唯仁人放流之迸諸四夷不與同中國
  - page: 32
    col: 13
    role: j
    text: 此謂唯仁人為能愛人能惡人
  - page: 32
    col: 14
    role: z
    text: 迸讀為屏古字通用○迸猶逐也言
  - page: 32
    col: 15
    role: z
    text: 有此媢疾之人妨賢而病國則仁人
  - page: 32
    col: 16
    role: z
    text: 必深惡而痛絕之以其至公無私故
  - page: 33
    col: 1
    role: z
    text: 能得好惡之正如此也
  - page: 33
    col: 2
    role: j
    text: 見賢而不能舉舉而不能先命也見不
  - page: 33
    col: 3
    role: j
    text: 善而不能退退而不能遠過也
  - page: 33
    col: 4
    role: j
    text: 命鄭氏云當作慢程子云當作怠未
  - page: 33
    col: 5
    role: j
    text: 詳孰是遠去聲○若此者知所愛惡
  - page: 33
    col: 6
    role: j
    text: 矣而未能盡愛惡之道蓋君子而未
  - page: 33
    col: 7
    role: z
    text: 仁者也
  - page: 33
    col: 8
    role: j
    text: 好人之所惡惡人之所好是謂拂人之
  - page: 33
    col: 9
    role: j
    text: 性菑必逮夫身
  - page: 33
    col: 10
    role: z
    text: 菑古灾字夫音扶○拂逆也好善而
  - page: 33
    col: 11
    role: j
    text: 惡惡人之性也至於拂人之性則不
  - page: 33
    col: 12
    role: j
    text: 仁之甚者也自秦誓至此又皆以申
  - page: 33
    col: 13
    role: j
    text: 言好惡公私之極以明上文所引南
  - page: 33
    col: 14
    role: z
    text: 山有臺節南山之意
  - page: 33
    col: 15
    role: j
    text: 是故君子有大道必忠信以得之驕泰
  - page: 33
    col: 16
    role: j
    text: 以失之
  - page: 34
    col: 1
    role: j
    text: 君子以位言之道謂居其位而脩己
  - page: 34
    col: 2
    role: z
    text: 治人之術發己自盡爲忠循物無違
  - page: 34
    col: 3
    role: z
    text: 謂信驕者矜高泰者侈肆此因上所
  - page: 34
    col: 4
    role: z
    text: 引文王康誥之意而言章内三言得
  - page: 34
    col: 5
    role: z
    text: 失而語益加切蓋至此而天理存亡
  - page: 34
    col: 6
    role: z
    text: 之幾決矣
  - page: 34
    col: 7
    role: j
    text: 生財有大道生之者衆食之者寡爲之
  - page: 34
    col: 8
    role: j
    text: 者疾用之者舒則財恒足矣
  - page: 34
    col: 9
    role: z
    text: 恒胡登反○吕氏曰國無遊民則生
  - page: 34
    col: 10
    role: z
    text: 者衆矣朝無幸位則食者寡矣不奪
  - page: 34
    col: 11
    role: z
    text: 農時則爲之疾矣量入爲出則用之
  - page: 34
    col: 12
    role: z
    text: 舒矣愚按此因有土有財而言以明
  - page: 34
    col: 13
    role: z
    text: 足國之道在乎務本而節用非必外
  - page: 34
    col: 14
    role: z
    text: 本内末而後財可聚也自此以至終
  - page: 34
    col: 15
    role: z
    text: 篇皆一意也
  - page: 34
    col: 16
    role: j
    text: 仁者以財發身不仁者以身發財
  - page: 35
    col: 1
    role: z
    text: 發猶起也仁者散財以得民不仁者
  - page: 35
    col: 2
    role: z
    text: 亡身以殖貨
  - page: 35
    col: 3
    role: j
    text: 未有上好仁而下不好義者也未有好
  - page: 35
    col: 4
    role: j
    text: 義其事不終者也未有府庫財非其財
  - page: 35
    col: 5
    role: j
    text: 者也
  - page: 35
    col: 6
    role: z
    text: 上好仁以愛其下則下好義以忠其
  - page: 35
    col: 7
    role: z
    text: 上所以事必有終而府庫之財無悖
  - page: 35
    col: 8
    role: z
    text: 出之患也
  - page: 35
    col: 9
    role: j
    text: 孟獻子曰畜馬乘不察於雞豚伐冰之
  - page: 35
    col: 10
    role: j
    text: 家不畜牛羊百乘之家不畜聚斂之臣
  - page: 35
    col: 11
    role: j
    text: 與其有聚斂之臣寧有盗臣此謂國不
  - page: 35
    col: 12
    role: j
    text: 以利爲利以義爲利也
  - page: 35
    col: 13
    role: z
    text: 畜許六反乘斂並去聲○孟獻子魯
  - page: 35
    col: 14
    role: z
    text: 之賢大夫仲孫蔑也畜馬乘士初試
  - page: 35
    col: 15
    role: z
    text: 爲大夫者也伐冰之家卿大夫以上
  - page: 35
    col: 16
    role: z
    text: 喪祭用冰者也百乘之家有采地者
  - page: 36
    col: 1
    role: j
    text: 也君子寧亡己之財而不忍傷民之
  - page: 36
    col: 2
    role: j
    text: 力故寧有盜臣而不畜聚斂之臣此
  - page: 36
    col: 3
    role: j
    text: 謂以下釋獻子之言也
  - page: 36
    col: 4
    role: j
    text: 長國家而務財用者必自小人矣彼爲
  - page: 36
    col: 5
    role: j
    text: 善之小人之使爲國家菑害並至雖有
  - page: 36
    col: 6
    role: j
    text: 善者亦無如之何矣此謂國不以利爲
  - page: 36
    col: 7
    role: j
    text: 利以義爲利也
  - page: 36
    col: 8
    role: z
    text: 長上聲彼爲善之此句上下疑有闕
  - page: 36
    col: 9
    role: z
    text: 文誤字○自由也言由小人導之也
  - page: 36
    col: 10
    role: z
    text: 此一節深明以利爲利之害而重言
  - page: 36
    col: 11
    role: z
    text: 以結之其丁寧之意切矣
  - page: 36
    col: 12
    role: title
    text: 右傳之十章釋治國平天下
  - page: 36
    col: 13
    role: z
    text: 此章之義務在與民同好惡而
  - page: 36
    col: 14
    role: z
    text: 不專其利皆推廣絜矩之意也
  - page: 36
    col: 15
    role: z
    text: 能如是則親賢樂利各得其所
  - page: 36
    col: 16
    role: z
    text: 而天下平矣
