      - c: 8
        chars: 好人之所惡惡人之所好是謂拂人之
        role: j
        start: 顶格
      - c: 9
        chars: 性菑必逮夫身　　　　　　　　　
        role: j
        start: 顶格
      - c: 10
        chars: 　菑古灾字夫音扶○拂逆也好善而
        role: z
        start: 退一格
      - c: 11
        chars: 惡惡人之性也至於拂人之性則不　
        role: j
        start: 顶格
      - c: 12
        chars: 仁之甚者也自秦誓至此又皆以申　
        role: j
        start: 顶格
      - c: 13
        chars: 言好惡公私之極以明上文所引南　
        role: j
        start: 顶格
      - c: 14
        chars: 　山有臺節南山之意　　　　　　
        role: z
        start: 退一格
      - c: 15
        chars: 是故君子有大道必忠信以得之驕泰
        role: j
        start: 顶格
      - c: 16
        chars: 以失之　　　　　　　　　　　　
        role: j
        start: 顶格
  - n: 34
    cols:
      - c: 1
        chars: 君子以位言之道謂居其位而脩己　
        role: j
        start: 顶格
      - c: 2
        chars: 　治人之術發己自盡爲忠循物無違
        role: z
        start: 退一格
      - c: 3
        chars: 　謂信驕者矜高泰者侈肆此因上所
        role: z
        start: 退一格
      - c: 4
        chars: 　引文王康誥之意而言章内三言得
        role: z
        start: 退一格
      - c: 5
        chars: 　失而語益加切蓋至此而天理存亡
        role: z
        start: 退一格
      - c: 6
        chars: 　之幾決矣　　　　　　　　　　
        role: z
        start: 退一格
      - c: 7
        chars: 生財有大道生之者衆食之者寡爲之
        role: j
        start: 顶格
      - c: 8
        chars: 者疾用之者舒則財恒足矣　　　　
        role: j
        start: 顶格
      - c: 9
        chars: 　恒胡登反○吕氏曰國無遊民則生
        role: z
        start: 退一格
      - c: 10
        chars: 　者衆矣朝無幸位則食者寡矣不奪
        role: z
        start: 退一格
      - c: 11
        chars: 　農時則爲之疾矣量入爲出則用之
        role: z
        start: 退一格
      - c: 12
        chars: 　舒矣愚按此因有土有財而言以明
        role: z
        start: 退一格
      - c: 13
        chars: 　足國之道在乎務本而節用非必外
        role: z
        start: 退一格
      - c: 14
        chars: 　本内末而後財可聚也自此以至終
        role: z
        start: 退一格
      - c: 15
        chars: 　篇皆一意也　　　　　　　　　
        role: z
        start: 退一格
      - c: 16
        chars: 仁者以財發身不仁者以身發財　　
        role: j
        start: 顶格
  - n: 35
    cols:
      - c: 1
        chars: 　發猶起也仁者散財以得民不仁者
        role: z
        start: 退一格
      - c: 2
        chars: 　亡身以殖貨　　　　　　　　　
        role: z
        start: 退一格
      - c: 3
        chars: 未有上好仁而下不好義者也未有好
        role: j
        start: 顶格
      - c: 4
        chars: 義其事不終者也未有府庫財非其財
        role: j
        start: 顶格
      - c: 5
        chars: 者也　　　　　　　　　　　　　
        role: j
        start: 顶格
      - c: 6
        chars: 　上好仁以愛其下則下好義以忠其
        role: z
        start: 退一格
      - c: 7
        chars: 　上所以事必有終而府庫之財無悖
        role: z
        start: 退一格
      - c: 8
        chars: 　出之患也　　　　　　　　　　
        role: z
        start: 退一格
      - c: 9
        chars: 孟獻子曰畜馬乘不察於雞豚伐冰之
        role: j
        start: 顶格
      - c: 10
        chars: 家不畜牛羊百乘之家不畜聚斂之臣
        role: j
        start: 顶格
      - c: 11
        chars: 與其有聚斂之臣寧有盗臣此謂國不
        role: j
        start: 顶格
      - c: 12
        chars: 以利爲利以義爲利也　　　　　　
        role: j
        start: 顶格
      - c: 13
        chars: 　畜許六反乘斂並去聲○孟獻子魯
        role: z
        start: 退一格
      - c: 14
        chars: 　之賢大夫仲孫蔑也畜馬乘士初試
        role: z
        start: 退一格
      - c: 15
        chars: 　爲大夫者也伐冰之家卿大夫以上
        role: z
        start: 退一格
      - c: 16
        chars: 　喪祭用冰者也百乘之家有采地者
        role: z
        start: 退一格
  - n: 36
    cols:
      - c: 1
        chars: 也君子寧亡己之財而不忍傷民之　
        role: j
        start: 顶格
      - c: 2
        chars: 力故寧有盜臣而不畜聚斂之臣此　
        role: j
        start: 顶格
      - c: 3
        chars: 謂以下釋獻子之言也　　　　　　
        role: j
        start: 顶格
      - c: 4
        chars: 長國家而務財用者必自小人矣彼爲
        role: j
        start: 顶格
      - c: 5
        chars: 善之小人之使爲國家菑害並至雖有
        role: j
        start: 顶格
      - c: 6
        chars: 善者亦無如之何矣此謂國不以利爲
        role: j
        start: 顶格
      - c: 7
        chars: 利以義爲利也　　　　　　　　　
        role: j
        start: 顶格
      - c: 8
        chars: 　長上聲彼爲善之此句上下疑有闕
        role: z
        start: 退一格
      - c: 9
        chars: 　文誤字○自由也言由小人導之也
        role: z
        start: 退一格
      - c: 10
        chars: 　此一節深明以利爲利之害而重言
        role: z
        start: 退一格
      - c: 11
        chars: 　以結之其丁寧之意切矣　　　　
        role: z
        start: 退一格
      - c: 12
        chars: 　　右傳之十章釋治國平天下　　
        role: title
        start: 退两格
      - c: 13
        chars: 　　此章之義務在與民同好惡而　
        role: z
        start: 退两格
      - c: 14
        chars: 　　不專其利皆推廣絜矩之意也　
        role: z
        start: 退两格
      - c: 15
        chars: 　　能如是則親賢樂利各得其所　
        role: z
        start: 退两格
      - c: 16
        chars: 　　而天下平矣　　　　　　　　
        role: z
        start: 退两格
