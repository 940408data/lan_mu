# 周易正義卷四（孔穎達疏）：j 為經文＋王弼注，z 為正義疏文。
sections:
  - id: juan四
    name: 卷四
    blocks:
      - { type: j, text: "艮下兌上。鹹：亨，利貞，取女吉。" }
      - { type: z, text: "“咸亨”至“取女吉”。○正義曰：先儒以《易》之舊題，分自此以上三十卦為《上經》，已下三十四卦為《下經》，《序卦》至此又別起端首。先儒皆以《上經》明天道，《下經》明人事，然韓康伯注《序卦》破此義云：“夫《易》，六畫成卦，三才必備，錯綜天人，以效變化，豈有天道、人事偏於上下哉！”案：《上經》之內，明飲食必有訟，訟必有眾起，是兼於人事，不專天道。既不專天道，則《下經》不專人事，理則然矣。但孔子《序卦》不以鹹系離。《系辭》云“二篇之策”，則是六十四卦舊分上下，乾、坤象天地，鹹、恆明夫婦。乾坤乃造化之本，夫婦實人倫之原，因而擬之，何為不可？天地各卦，夫婦共卦者，周氏云：“尊天地之道，略於人事，猶如三才，天地為二，人止為一也。”此必不然。竊謂乾、坤明天地初闢，至屯乃剛柔始交。故以純陽象天，純陰象地，則鹹以明人事。人物既生，共相感應。若二氣不交，則不成於相感，自然天地各一，夫婦共卦。此不言可悉，豈宜妄為異端！“咸亨利貞取女吉”者，“鹹”感也。此卦明人倫之始，夫婦之義，必須男女共相感應，方成夫婦。既相感應，乃得亨通。若以邪道相通，則兇害斯及，故利在貞正。既感通以正，即是婚媾之善，故云“咸亨利貞取女吉”也。" }
      - { type: j, text: "《彖》曰：鹹，感也。柔上而剛下，二氣感應以相與。是以亨也。" }
      - { type: z, text: "正義曰：“柔上而剛下，二氣感應以相與”者，此因上下二體，釋“咸亨”之義也。艮剛而兌柔，若剛自在上，柔自在下，則不相交感，無由得通。今兌柔在上而艮剛在下，是二氣感應以相授與，所以為“咸亨”也。" }
      - { type: j, text: "止而說，故“利貞”也。" }
      - { type: z, text: "正義曰：此因二卦之義釋“利貞”也。艮止而兌，說也。能自靜止則不隨動欲，以上行說，則不為邪諂。不失其正，所以“利貞”也。" }
      - { type: j, text: "男下女，“取女吉”也。" }
      - { type: z, text: "正義曰：此因二卦之象釋“取女吉”之義。艮為少男而居於下，兌為少女而處於上，是男下於女也。婚姻之義，男先求女，親迎之禮，御輪三週，皆男先下於女，然後女應於男，所以取女得吉者也。" }
      - { type: j, text: "是以“亨，利貞”，“取女吉”也。天地感而萬物化生，二氣相與，乃“化生”也。" }
      - { type: z, text: "“是以”至“化生”。○正義曰：“是以亨利貞取女吉”者，次第釋訖，總舉《繇》辭以結之。“天地感而萬物化生”者，以下廣明感之義也。天地二氣，若不感應相與，則萬物無由得應化而生。" }
      - { type: j, text: "聖人感人心而天下和平。觀其所感，而天地萬物之情可見矣。天地萬物之情，見於所感也。凡感之為道，不能感非類者也，故引取女以明同類之義也。同類而不相感應，以其各亢所處也，故女雖應男之物，必下之而後取女乃吉也。" }
      - { type: z, text: "“聖人”至“可見矣”。○正義曰：“聖人感人心而天下和平”者，聖人設教，感動人心，使變惡從善，然後天下和平。“觀其所感而天地萬物之情可見矣”者，結歎鹹道之廣，大則包天地，小則該萬物。感物而動，謂之情也。天地萬物皆以氣類共相感應，故“觀其所感，而天地萬物之情可見矣”。" }
      - { type: j, text: "《象》曰：山上有澤，鹹。君子以虛受人。以虛受人，物乃感應。" }
      - { type: z, text: "“《象》曰”至“虛受人”。○正義曰：“山上有澤，鹹”，澤性下流，能潤於下；山體上承，能受其潤。以山感澤，所以為“鹹”。“君子以虛受人”者，君子法此鹹卦，下山上澤，故能空虛其懷，不自有實，受納於物，無所棄遺，以此感人，莫不皆應。" }
      - { type: j, text: "初六：鹹其拇。處鹹之初，為感之始，所感在末，故有志而已。如其本實，未至傷靜。" }
      - { type: z, text: "“初六鹹其拇”。○正義曰：“鹹其拇”者，拇是足大指也，體之最末。初應在四，俱處卦始，為感淺末，取譬一身，在於足指而已，故曰“鹹其拇”也。○注“處鹹”至“傷靜”。○正義曰：六二《鹹》道轉進，所感在腓。腓體動躁，則成往而行。今初六所感淺末，則譬如拇指，指雖小動，未移其足，以喻人心初感，始有其志。志雖小動，未甚躁求。凡吉凶悔吝，生乎動者也。以其本實未傷於靜，故無吉凶悔吝之辭。" }
      - { type: j, text: "《象》曰：“鹹其拇”，志在外也。四屬外也。" }
      - { type: z, text: "正義曰：“志在外”者，外謂四也。與四相應，所感在外，處於感初，有志而已，故云“志在外也”。" }
      - { type: j, text: "六二：鹹其腓，兇。居吉。鹹道轉進，離拇升腓，腓體動躁者也。感物以躁，兇之道也。由躁故兇，居則吉矣。處不乘剛，故可以居而獲吉。" }
      - { type: z, text: "“六二”至“居吉”。○正義曰：腓，足之腓腸也。六二應在九五，鹹道轉進，離拇升腓，腓體動躁，躁以相感，兇之道也。由躁故兇，靜居則吉，故曰“鹹其腓兇居吉”。以不乘剛，故可以居而獲吉。○注“腓體動躁”。○正義曰：王廙云：動於腓腸，斯則行矣。故言“腓體動躁”也。" }
      - { type: j, text: "《象》曰：雖兇居吉，順不害也。陰而為居，順之道也。不躁而居，順不害也。" }
      - { type: z, text: "正義曰：“雖”者，與奪之辭。若既兇矣，何由得居而獲吉？良由陰性本靜。今能不躁而居，順其本性，則不有災害，免兇而獲吉也。" }
      - { type: j, text: "九三：鹹其股，執其隨，往吝。股之為物，隨足者也。進不能制動，退不能靜處，所感在股，“志在隨人”者也。“志在隨人”，所執亦以賤矣。用斯以往，吝其宜也。《象》曰：“鹹其股”，亦不處也。志在隨人，所執下也。" }
      - { type: z, text: "正義曰：“鹹其股亦不處也”者，非但進不能制動，退亦不能靜處也。“所執下”者，既“志在隨人”，是其志意所執下賤也。" }
      - { type: j, text: "九四：貞吉，悔亡。憧憧往來，朋從爾思。處上卦之初，應下卦之始，居體之中，在股之上，二體始相交感，以通其志，心神始感者也。凡物始感而不以之於正，則至於害，故必貞然後乃吉，吉然後乃得亡其悔也。始在於感，未盡感極，不能至於無思以得其黨，故有“憧憧往來”，然後“朋從其思”也。" }
      - { type: z, text: "正義曰：“貞吉悔亡”者，九四居“上卦之初，應下卦之始，居體之中，在股之上，二體始相交感，以通其志，心神始感者也。凡物始感而不以之於正”，則害之將及矣。“故必貞然後乃吉，吉然後乃得亡其悔也”。故曰“貞吉悔亡”也。“憧憧往來，朋從爾思”者，“始在於感，未盡感極”，惟欲思運動以求相應，未能忘懷息照，任夫自然，故有“憧憧往來”，然後朋從爾之所思也。" }
      - { type: j, text: "《象》曰：“貞吉，悔亡”，未感害也。未感於害，故可正之，得“悔亡”也。" }
      - { type: z, text: "正義曰：“未感害”者，心神始感，未至於害，故不可不正，正而故得“悔亡”也。" }
      - { type: j, text: "“憧憧往來”，未光大也。" }
      - { type: z, text: "正義曰：“未光大”者，非感之極，不能無思無欲，故未光大也。" }
      - { type: j, text: "九五：鹹其脢，無悔。“脢”者，心之上，口之下，進不能大感，退亦不為無志，其志淺末，故“無悔”而已。" }
      - { type: z, text: "“九五”至“無悔”。○正義曰：“鹹其脢無悔”者，“脢”者心之上，口之下也。四已居體之中，為心神所感，五進在於四上，故所感在脢，脢已過心，故“進不能大感”，由在心上，“退亦不能無志”，志在淺末，故“無悔”而已，故曰：“鹹其脢無悔”也。○注“脢者心之上口之下”。○正義曰：“脢者心之上口之下”者，子夏《易傳》曰：“在脊曰脢。”馬融云：“脢，背也。”鄭玄云：“脢，脊肉也”。王肅云：“脢在背而夾脊。”《說文》云：“脢，背肉也。”雖諸說不同，大體皆在心上。輔嗣以四為心神，上為輔頰，五在上四之間，故直云“心之上口之下”也。明其淺於心神，厚於言語。" }
      - { type: j, text: "《象》曰：“鹹其脢”，志末也。" }
      - { type: z, text: "正義曰：“志末也”者，末猶淺也，感以心為深，過心則謂之淺末矣。" }
      - { type: j, text: "上六：鹹其輔、頰、舌。鹹道轉末，故在口舌言語而已。" }
      - { type: z, text: "正義曰：“鹹其輔頰舌”者，馬融云：“輔，上頷也。”“輔、頰、舌”者，言語之具。鹹道轉末，在於口舌言語而已，故云“鹹其輔頰舌”也。" }
      - { type: j, text: "《象》曰：“鹹其輔、頰、舌”，滕口說也。“輔、頰、舌”者，所以為語之具也。“鹹其輔頰舌”，則“滕口說”也。“憧憧往來”，猶未光大，況在滕口，薄可知也。" }
      - { type: z, text: "正義曰：“滕口說也”者，舊說字作“滕”，徒登反。滕，競與也。所競者口，無復心實，故云“滕口說”也。鄭玄又作“媵”。媵，送也。《鹹》道極薄，徒送口舌言語相感而已，不復有志於其閒。王《注》義得兩通，未知誰同其旨也。" }
      - { type: j, text: "巽下震上。恆：亨，無咎，利貞。恆而亨，以濟三事也。恆之為道，亨乃“無咎”也。恆通無咎，乃利正也。" }
      - { type: z, text: "“恆亨”至“利貞”。○正義曰：恆，久也。恆久之道，所貴變通。必須變通隨時，方可長久。能久能通，乃“無咎”也。恆通無咎，然後利以行正，故曰“恆亨無咎利貞”也。○注“三事”。○正義曰：褚氏云：“三事，謂無咎、利貞、利有攸往。”莊氏云：“三事者，無咎一也，利二也，貞三也。”周氏云：“三事者，一亨也，二無咎也，三利貞也。”《注》不明數，故先儒各以意說。竊謂《注》云“恆而亨以濟三事”者，明用此恆亨，濟彼三事，無疑“亨”字在三事之外，而此《注》云“恆字為道，亨乃無咎。恆通無咎，乃利正也”。又注《彖》曰：“道得所久，則常通無咎而利正也”。此解皆以利正相將為一事，分以為二，恐非《注》旨。驗此《注》云“恆之為道，亨乃無咎”，此以“恆亨”濟“無咎”也。又云：“恆通無咎，乃利正也。”此以“恆亨”濟“利貞”也。下注“利有攸往”云：“各得所恆，修其常道，終則有始，往而無違，故‘利有攸往’。”此以“恆亨”濟“利有攸往”也。觀文驗《注》，褚氏為長。" }
      - { type: j, text: "利有攸往。各得所恆，修其常道，終則有始，往而無違，故“利有攸往”也。" }
      - { type: z, text: "正義曰：得其常道，何往不利，故曰“利有攸往”也。" }
      - { type: j, text: "《彖》曰：恆，久也。剛上而柔下，剛尊柔卑，得其序也。" }
      - { type: z, text: "“《彖》曰”至“柔下”。○正義曰：“恆久也”者，釋訓卦名也。恆之為名，以長久為義。“剛上而柔下”者，既訓“恆”為久，因名此卦得其《恆》名，所以釋可久之意。此就二體以釋恆也。震剛而巽柔，震則剛尊在上，巽則柔卑在下，得其順序，所以為恆也。○注“剛尊柔卑得其序也”。○正義曰：鹹明感應，故柔上而剛下，取二氣相交也。恆明長久，故剛上而柔下，取尊卑得序也。" }
      - { type: j, text: "雷風相與，長陽長陰，能相成也。" }
      - { type: z, text: "“雷風相與”。○正義曰：此就二象釋恆也。雷之與風，陰陽交感，二氣相與，更互而相成，故得恆久也。○注“長陽長陰能相成也”。○正義曰：震為長男，故曰“長陽”。巽為長女，故曰“長陰”。《彖》曰：“雷風相與”，雷之與風，共相助成之義。故褚氏云“雷資風而益遠，風假雷而增威”是也。今言“長陽長陰，能相成”者，因震為長男，巽為長女，遂以“長陽長陰”而名之，作文之體也。又此卦明夫婦可久之道，故以二長相成，如雷風之義也。" }
      - { type: j, text: "巽而動。動無違也。" }
      - { type: z, text: "正義曰：此就二卦之義，因釋恆名。震動而巽順，無有違逆，所以可恆也。" }
      - { type: j, text: "剛柔皆應，不孤媲也。" }
      - { type: z, text: "“剛柔皆應”。○正義曰：此就六爻釋《恆》。此卦六爻剛柔皆相應和，無孤媲者，故可長久也。○注“不孤媲也”。○正義曰：媲，配也。" }
      - { type: j, text: "恆。皆可久之道。" }
      - { type: z, text: "正義曰：歷就四義釋恆名訖，故更舉卦名以結之也。明上四事“皆可久之道”，故名此卦為“恆”。" }
      - { type: j, text: "恆“亨，無咎，利貞”，久於其道也。道德所久，則常通無咎而利正也。" }
      - { type: z, text: "正義曰：此就名釋卦之德，言所以得“亨無咎利貞”者，更無別義，正以得其恆久之道，故言“久於其道也”。" }
      - { type: j, text: "天地之道，恆久而不巳也。得其所久，故不巳也。" }
      - { type: z, text: "正義曰：將釋“利有攸往”，先舉天地以為證喻，言天地得其恆久之道，故久而不己也。" }
      - { type: j, text: "“利有攸往”，終則有始也。得其常道，故終則復始，往無窮極。" }
      - { type: z, text: "正義曰：舉《經》以結成也。人用恆久之道，會於變通，故終則復始，往無窮極，同於天地之不已，所以為利也。" }
      - { type: j, text: "日月得天而能久照，四時變化而能久成，聖人久於其道而天下化成。言各得其“所恆”，故皆能長久。" }
      - { type: z, text: "“日月得天而能久照”至“天下化成”。○正義曰：“日月得天而能久照”者，以下廣明恆義。上言天地之道，恆久而不巳也，故日月得天，所以亦能久照。“四時變化而能久成”者，四時更代，寒暑相變，所以能久主成萬物。“聖人久於其道而天下化成”者，聖人應變隨時，得其長久之道，所以能“光宅天下”，使萬物從化而成也。" }
      - { type: j, text: "觀其所恆，而天地萬物之情可見矣。天地萬物之情，見於“所恆”也。" }
      - { type: z, text: "正義曰：總結恆義也。" }
      - { type: j, text: "《象》曰：雷風，恆。長陽長陰，合而相與，可久之道也。" }
      - { type: z, text: "正義曰：雷風相與為“恆”，巳如彖釋。" }
      - { type: j, text: "君子以立不易方。得其所久，故“不易”也。" }
      - { type: z, text: "正義曰：君子立身得其恆久之道，故不改易其方。方猶道也。" }
      - { type: j, text: "初六：浚恆，貞兇，無攸利。處恆之初，最處卦底，始求深者也。求深窮底，令物無餘縕，漸以至此，物猶不堪，而況始求深者乎？以此為恆，兇正害德，無施而利也。" }
      - { type: z, text: "“初六，浚恆，貞兇。無攸利”。○正義曰：浚，深也。最處卦底，故曰“深”也。深恆者，以深為恆是也。施之於仁義，即不厭深，施之於正，即求物之情過深，是兇正害德，無施而利，故曰“浚恆貞兇，無攸利”也。○注“此恆之初”至“害德無施而利也”。○正義曰：處卦之初，故言始也。最在於下，故言深也。所以致兇，謂在於始而求深者也。" }
      - { type: j, text: "《象》曰：“浚恆”之兇，始求深也。" }
      - { type: j, text: "九二：悔亡。雖失其位，恆位於中，可以消悔也。" }
      - { type: z, text: "正義曰：失位故稱“悔”，居中故“悔亡”也。" }
      - { type: j, text: "《象》曰：九二“悔亡”，能久中也。" }
      - { type: z, text: "正義曰：“能久中”者，處恆故能久，位在於中，所以消侮也。" }
      - { type: j, text: "九三：不恆其德，或承之羞，貞吝。處三陽之中，居下體之上，處上體之下，上不至尊，下不至卑，中不在體，體在乎恆，而分無所定，無恆者也。德行無恆，自相違錯，不可致詰，故“或承之羞”也。施德於斯，物莫之納，鄙賤甚矣，故曰“貞吝”也。" }
      - { type: z, text: "“九三，不恆其德，或承之羞，貞吝”。○正義曰：“不恆其德，或承之羞，貞吝”者，九三居下體之上，處上體之下，雖處三陽之中，又在不中之位，上不全尊，下不全卑，執心不定，德行無恆，故曰“不恆其德”。德既無恆，自相違錯，則為羞辱承之，所羞非一，故曰“或承之羞”也。處久如斯，正之所賤，故曰“貞吝”也。○注“處三陽之中”至“故曰貞吝也”。○正義曰：雖在三陽之中，非一體之中也。“不可致詰”者，詰，問也。違錯處多，不足問其事理，所以明其羞辱之深，如《論語》云“於予與何誅”。" }
      - { type: j, text: "《象》曰：“不恆其德”，無所容也。" }
      - { type: z, text: "正義曰：“無所容”者，謂不恆之人，所往之處，皆不納之，故“無所容”也。" }
      - { type: j, text: "九四：田，無禽。恆於非位，雖勞無獲也。" }
      - { type: z, text: "正義曰：田者，田獵也，以譬有事也。“無禽”者，田獵不獲，以喻有事無功也。“恆於非位”，故勞而無功也。" }
      - { type: j, text: "《象》曰：久非其位，安得禽也？" }
      - { type: z, text: "正義曰：有恆而失位，是“久非其位”。田獵而無所獲，是“安得禽也”。" }
      - { type: j, text: "六五：恆其德，貞。婦人吉，夫子兇。居得尊位，為恆之主，不能“制義”，而系應在二，用心專貞，從唱而已。婦人之吉，夫子之兇也。" }
      - { type: z, text: "正義曰：“恆其德貞”者，六五系應在二，不能傍及他人，是恆常貞一其德，故曰“恆其德貞”也。“婦人吉”者，用心專貞，從唱而巳，是婦人之吉也。“夫子兇”者，夫子須制斷事宜，不可專貞從唱，故曰“夫子兇”也。" }
      - { type: j, text: "《象》曰：婦人貞吉，從一而終也。夫子制義，從婦兇也。" }
      - { type: z, text: "正義曰：“從一而終”者，謂用心貞一，從其貞一而自終也。“從婦兇”者，五與二相應，五居尊位，在震為夫，二處下體，在《巽》為婦。五系於二，故曰“從婦兇”也。" }
      - { type: j, text: "上六：振恆，兇。夫靜為躁君，安為動主。故安者上之所處也，靜者可久之道也。處卦之上，居動之極，以此為恆，無施而得也。" }
      - { type: z, text: "正義曰：“振恆兇”者，振，動也。凡處於上者，當守靜以制動。今上六居恆之上，處動之極，以振為恆，所以“兇”也。" }
      - { type: j, text: "《象》曰：“振恆”在上，大無功也。正義曰：“大無功”者，居上而以振動為恆，無施而得，故曰“大無功也”。" }
      - { type: j, text: "艮下乾上。遯：亨，小利貞。" }
      - { type: z, text: "正義曰：“遯”亨者，遯者，隱退逃避之名。陰長之卦，小人方用，君子日消。君子當此之時，若不隱遯避世，即受其害。須遯而後得通，故曰“遯亨”。“小利貞”者，陰道初始浸長，正道亦未全滅，故曰“小利貞”。" }
      - { type: j, text: "《彖》曰：“遯亨”，遯而亨也。遯之為義，遯乃通也。" }
      - { type: z, text: "正義曰：“遯而亨”者，此釋遯之所以得亨通之義。小人之道方長，君子非遯不通，故曰：“遯而亨也”。" }
      - { type: j, text: "剛當位而應，與時行也。謂五也。“剛當位而應”，非否亢也。遯不否亢，能“與時行也”。" }
      - { type: z, text: "正義曰：舉九五之爻，釋所以能遯而致亨之由，良由九五以剛而當其位，有應於二，非為否亢。遯不否亢，即是相時而動，所以遯而得亨，故云“剛當位而應，與時行也”。" }
      - { type: j, text: "“小利貞”，浸而長也。陰道欲浸而長，正道亦未全滅，故“小利貞”也。" }
      - { type: z, text: "正義曰：釋“小利貞”之義。浸者漸進之名。若陰德暴進，即消正道。良由二陰漸長而正道亦未即全滅，故云“小利貞”也。" }
      - { type: j, text: "遯之時義大矣哉！" }
      - { type: z, text: "正義曰：歎美遯德。相時度宜，避世而遯，自非大人照幾不能如此，其義甚大，故云“大矣哉”。" }
      - { type: j, text: "《象》曰：天下有山，遯。天下有山，陰長之象。" }
      - { type: z, text: "“《象》曰：天下有山，遯”。○正義曰：“天下有山，遯”者，山者陰類，進在天下，即是山勢欲上逼於天，天性高遠，不受於逼，是遯避之象，故曰“天下有山，遯”。○注“天下有山”至“之象”。○正義曰：積陽為天，積陰為地。山者，地之高峻，今上逼於天，是陰長之象。" }
      - { type: j, text: "君子以遠小人，不惡而嚴。" }
      - { type: z, text: "正義曰：君子當此遯避之時，小人進長，理須遠避，力不能討，故不可為惡，復不可與之褻瀆，故曰“不惡而嚴”。" }
      - { type: j, text: "初六：遯尾，厲，勿用有攸往。“遯”之為義，闢內而之外者也。“尾”之為物，最在體後者也。處遯之時，不往何災，而為“遯尾”，禍所及也。危至而後行，難可免乎？厲則“勿用有攸往”也。" }
      - { type: z, text: "正義曰：“遯尾厲”者，為遯之尾，最在後遯者也。小人長於內，應出外以避之，而最在卦內，是遯之為後也。逃遯之世，宜速遠而居先，而為“遯尾”，禍所及也，故曰“遯尾厲”也。“勿用有攸往”者，危厲既至，則當“固窮”，“危行言遜”，勿用更有所往，故曰“勿用有攸往”。" }
      - { type: j, text: "《象》曰：“遯尾”之厲，不往何災也。" }
      - { type: z, text: "正義曰：“不往何災”者，《象》釋當遯之時，宜須出避。而“勿用有攸往”者，既為“遯尾”，出必見執，不如不往，不往即無災害。“何災”者，猶言無災也。與何傷、何咎之義同也。" }
      - { type: j, text: "六二：執之用黃牛之革，莫之勝說。居內處中，為遯之主，物皆遯巳，何以固之？若能執乎理中厚順之道以固之也，則莫之勝解。" }
      - { type: z, text: "正義曰：“執之用黃牛之革莫之勝說”者，逃遯之世，避內出外，二既處中居內，即非遯之人也。既非遯之人，便為所遯之主，物皆棄巳而遯，何以執固留之？惟有中和厚順之道可以固而安之也。能用此道，則不能勝巳解脫而去也。黃中之色，以譬中和。牛性順從，皮體堅厚，牛革以譬厚順也。六三居中得位，亦是能用中和厚順之道，故曰“執之用黃牛之革莫之勝說”也。" }
      - { type: j, text: "《象》曰：執用黃牛，固志也。" }
      - { type: z, text: "正義曰：“固志”者，堅固遯者之志，使不去已也。" }
      - { type: j, text: "九三：系遯，有疾厲，畜臣妾，吉。在內近二，以陽附陰，宜遯而系，故曰“系遯”。“遯”之為義，宜遠小人，以陽附陰，系於所在，不能遠害，亦巳憊矣，宜其屈辱而危厲也。系於所在，“畜臣妾”可也。施於大事，兇之道也。" }
      - { type: z, text: "正義曰：“系遯”者，九三無應於上，與二相比，以陽附陰，系意在二，處遯之世，而意有所系，故曰“系遯”。“有疾厲”者，“遯”之為義，宜遠小人。既系於陰，即是“有疾憊”而致危厲，故曰“有疾厲”也。“畜臣妾吉”者，親於所近，系在於下，施之於人，畜養臣妾則可矣，大事則兇，故曰：“畜臣妾吉。”" }
      - { type: j, text: "《象》曰：“系遯”之厲，有疾憊也。“畜臣妾，吉”，不可大事也。" }
      - { type: z, text: "正義曰：“不可大事”者，釋此“系遯”之人，以“畜臣妾吉”，明其不可為大事也。" }
      - { type: j, text: "九四：好遯，君子吉，小人否。處於外而有應於內，君子“好遯”，故能捨之，小人系戀，是以“否”也。" }
      - { type: z, text: "正義曰：九四處在於外，而有應於內。處外即意欲遠遯，應內則未能棄捨。若好遯君子，超然不顧，所以得吉。小人有所系戀，即不能遯，故曰“小人否”也。" }
      - { type: j, text: "《象》曰：君子“好遯”，“小人否”也。音臧否之否。" }
      - { type: z, text: "正義曰：嫌讀為“圯”，故音之也。" }
      - { type: j, text: "九五：嘉遯，貞吉。遯而得正，反制於內。小人應命，率正其志，“不惡而嚴”，得正之吉，遯之嘉也。" }
      - { type: z, text: "正義曰：“嘉遯貞吉”者，嘉，美也。五居於外，得位居中，是“遯而得正”。二為已應，不敢違拒，從五之命，率正其志，“遯而得正，反制於內”，“不惡而嚴，得正之吉”，為遯之美，故曰“嘉遯貞吉”也。" }
      - { type: j, text: "《象》曰：“嘉遯，貞吉”，以正志也。" }
      - { type: z, text: "正義曰：“以正志”者，小人應命，不敢為邪，是五能正二之志，故成遯之美也。" }
      - { type: j, text: "上九：肥遯，無不利。最處外極，無應於內，超然絕志，心無疑顧，憂患不能累，矰繳不能及，是以“肥遯無不利”也。" }
      - { type: z, text: "“上九，肥遯無不利”。○正義曰：《子夏傳》曰：“肥，饒裕也。”四、五雖在於外，皆在內有應，猶有反顧之心。惟上九最在外極，無應於內，心無疑顧，是遯之最優，故曰“肥遯”。遯而得肥，無所不利，故云“無不利”也。注“最處外極”至“無不利也”。○正義曰：矰，矢名也。鄭注《周禮》“”結繳於矢謂之矰。”繳，《字林》及《說文》云：“繳，生絲縷也。”" }
      - { type: j, text: "《象》曰：“肥遯，無不利”，無所疑也。" }
      - { type: j, text: "乾下震上。大壯：利貞。" }
      - { type: z, text: "正義曰：大壯，卦名也。壯者，強盛之名。以陽稱大，陽長既多，是大者盛壯，故曰“大壯”。“利貞”者，卦德也。群陽盛大，小道將滅，大者獲正，故曰“利貞”也。" }
      - { type: j, text: "《彖》曰：“大壯”，大者壯也。大者謂陽爻，小道將滅，大者獲正，故“利貞”也。" }
      - { type: z, text: "“《彖》曰”至“壯也”。○正義曰：“大者壯也”者，就爻釋卦名。陽爻浸長，巳至於四，是大者盛壯，故曰“大者壯也”。○注“大者謂陽爻”至“利貞也”。○正義曰：釋名之下，剩解利貞，成“大者”之義也。" }
      - { type: j, text: "剛以動，故壯。“《大壯》，利貞”，大者正也，正大而天地之情可見矣。天地之情，正大而巳矣。弘正極大，則天地之情可見矣。" }
      - { type: z, text: "正義曰：“剛以動故壯”者，就二體釋卦名。乾剛而震動，柔弱而動，即有退弱；剛強以動，所以成壯。“大壯利貞大者正也”者，就爻釋卦德。大者獲正，故得“利貞”。“正大而天地之情可見矣”者，因大獲正，遂廣美正人之義。天地之道，弘正極大，故正大則見天地之情。不言萬物者，壯大之名，義歸天極，故不與鹹、恆同也。" }
      - { type: j, text: "《象》曰：雷在天上，大壯。剛以動也。" }
      - { type: z, text: "正義曰：震雷為威動，乾天主剛健，雷在天上，是“剛以動”，所以為“大壯”。" }
      - { type: j, text: "君子以非禮弗履。壯而違禮則兇，兇則失壯也。故君子以“大壯”而順體也。" }
      - { type: z, text: "正義曰：盛極之時，好生驕溢，故於“大壯”誠以非禮勿履也。" }
      - { type: j, text: "初九：壯於趾，徵兇有孚。夫得“大壯”者，必能自終成也。未有陵犯於物而得終其壯者。在下而壯，故曰“壯於趾”也。居下而用剛壯，以斯而進，窮兇可必也，故曰“徵兇有孚”。" }
      - { type: z, text: "正義曰：“壯於趾徵兇有孚”者，趾，足也。初在體下，有如趾足之象，故曰“壯於趾”也。施之於人，即是在下而用壯也。在下用壯，陵犯於物，以斯而行，兇其信矣。故曰“徵兇有孚”。" }
      - { type: j, text: "《象》曰：“壯於趾”，其孚窮也。言其信窮。" }
      - { type: z, text: "正義曰：“其孚窮”者，釋“壯於趾”者，其人信其窮兇也。" }
      - { type: j, text: "九二：貞吉。居得中位，以陽居陰，履謙不亢，是以“貞吉”。《象》曰：“九二貞吉”，以中也。" }
      - { type: z, text: "正義曰：以其居中履謙，行不違禮，故得正而吉也。" }
      - { type: j, text: "九三：小人用壯，君子用罔，貞厲。羝羊觸藩，羸其角。處健之極，以陽處陽，用其壯者也。故小人用之以為壯，君子用之以為羅己者也。貞厲以壯，雖復羝羊，以之觸藩，能無羸乎？" }
      - { type: z, text: "“九三小人用”至“羸其角”。○正義曰：罔，羅罔也。羝羊，羖羊也。藩，藩籬也。羸，拘累纏繞也。九三處《乾》之上，是“健之極”也。又“以陽居陽”，是健而不謙也。健而不謙，必用其壯也。小人當此，不知恐懼，即用以為壯盛，故曰“小人用壯”。君子當此即慮危難，用之以為羅罔於巳，故曰“君子用罔”。以壯為正，其正必危，故云“貞厲”也。以此為正，狀似“羝羊觸藩”也。必拘羸其角矣。" }
      - { type: j, text: "《象》曰：“小人用壯”，君子罔也。" }
      - { type: z, text: "正義曰：言小人用以為壯者，即是君子所以為羅罔也。" }
      - { type: j, text: "九四：貞吉，悔亡。藩決不羸。壯於大輿之輹。下剛而進，將有憂虞。而以陽處陰，行不違謙，不失其壯，故得“貞吉”而“悔亡”也。巳得其壯，而上陰不罔巳路，故“藩決不決”也。“壯於大輿之輹”，無有能說其輹者，可以“往”也。" }
      - { type: z, text: "正義曰：“大輿”者，大車也。“下剛而進，將有憂虞”。而九四“以陽處陰，行不違謙”，居謙即“不失其壯”，故得正吉，而“悔亡”也。故云“貞吉悔亡”。九三以壯健不謙，即被“羸其角”。九四以謙而進，謂之上行。陰爻“不罔巳路，故藩決不羸也”。“壯於大輿之輹”者，言四乘車而進，其輹壯大無有能脫之者，故曰“藩決不羸，壯於大輿之輹”也。" }
      - { type: j, text: "《象》曰：“藩決不羸”，尚往也。" }
      - { type: z, text: "正義曰：“尚往”者，尚，庶幾也。言已不失其壯，庶幾可以往也。" }
      - { type: j, text: "六五：喪羊於易，無悔。居於大壯，以陽處陽，猶不免咎，而況以陰處陽，以柔乘剛者乎？羊，壯也。必喪其羊，失其所居也。能喪壯於易，不於險難，故得“無悔”。二履貞吉，能幹其任，而已委焉，則得“無悔”。委之則難不至，居之則敵寇來，故曰“喪羊於易”。" }
      - { type: z, text: "“六五，喪羊於易，無悔”。○正義曰：“喪羊於易無悔”者，羊，壯也。居大壯之時，“以陽處陽，猶不免咎，而況以陰處陽，以柔乘剛者乎”？違謙越禮，必喪其壯。群陽方進，勢不可止。若於平易之時，逆舍其壯，委身任二，不為違拒，亦剛所不害，不害即無悔矣，故曰“喪羊於易無悔”也。○注“居於大壯”至“喪羊於易”。○正義曰：羊，剛狠之物，故以譬壯。云“必喪其羊失其所居”者，言違謙越禮，理勢必然。云“能喪壯於易不於險難”者，二雖應已，剛長則侵，陰為已寇難，必喪其壯，當在於平易寇難未來之時，勿於險難敵寇既來之日。良由居之有必喪之理，故戒其預防。而莊氏云：“《經》止一言喪羊，而《注》為兩處分用。初云‘必喪其羊，失其所居’，是自然應失。後云‘能喪壯於易，不於險難’，故得無咎。自能喪其羊，二理自為矛盾。”竊謂莊氏此言，全不識《注》意。" }
      - { type: j, text: "《象》曰：“喪羊於易”，位不當也。" }
      - { type: z, text: "正義曰：“位不當”者，正由處不當位，故須舍其壯也。" }
      - { type: j, text: "上六：羝羊觸藩，不能退，不能遂。無攸利，艱則吉。有應於三，故“不能退”。懼於剛長，故“不能遂”。持疑猶豫，志無所定，以斯決事，未見所利。雖處剛長，剛不害正。苟定其分，固志在一，以斯自處，則憂患消亡，故曰“艱則吉”也。" }
      - { type: z, text: "“上六羝羊觸藩”至“艱則吉”。○正義曰：“退”謂退避。“遂”謂進往。有應於三，疑之不巳，故不能退避。然懼於剛長，故不能遂往，故云“羝羊觸藩不能退不能遂”也。“無攸利”者，持疑猶豫，不能自決，以此處事，未見其利，故曰“無攸利”也。“艱則吉”者，雖處剛長，剛不害正。但艱固其志，不捨於三，即得吉，故曰“艱則吉”也。" }
      - { type: j, text: "《象》曰：“不能退，不能遂”，不詳也。“艱則吉”，咎不長也。" }
      - { type: z, text: "正義曰：“不詳也”者，祥者善也。進退不定，非為善也，故云“不祥也”。“咎不長也”者，能艱固其志，即憂患消亡，其咎不長，釋所以得吉也。" }
      - { type: j, text: "坤下離上。晉：康侯用錫馬蕃庶，晝日三接。" }
      - { type: z, text: "正義曰：“晉”者，卦名也。“晉”之為義，進長之名。此卦明臣之昇進，故謂之“晉”。“康”者，美之名也。“侯”謂昇進之臣也。臣既柔進，天子美之，賜以車馬，蕃多而眾庶，故曰“康侯用錫馬蕃庶”也。“晝日三接”者，言非惟蒙賜蕃多，又被親寵頻數，一晝之間，三度接見也。" }
      - { type: j, text: "《彖》曰：晉，進也。明出地上，順而麗乎大明，柔進而上行。凡言“上行”者，所以在貴也。" }
      - { type: z, text: "“《彖》曰晉進也”至“進而上行”。○正義曰：“晉，進也”者，以今釋古，古之“晉”字，即以進長為義，恐後世不曉，故以“進”釋之。“明出地上”者，此就二體釋得“晉”名。離上坤下，故言“明出地上”。明既出地，漸就進長，所以為“晉”。“順而麗乎大明柔進而上行”者，此就二體之義及六五之爻，釋“康侯用錫馬”巳下也。“坤”，順也；“離”，麗也。又為明坤能順從而麗著於大明，六五以柔而進，上行貴位，順而著明臣之美道也。“柔進而上行”，君上所與也，故得厚賜而被親寵也。" }
      - { type: j, text: "是以“康侯用錫馬蕃庶，晝日三接”也。康，美之名也。順以著明，臣之道也。“柔進而上行”，物所與也。故得錫馬而蕃庶。以“訟受服”，則“終朝三褫”。柔進受寵，則“一晝三接”也。" }
      - { type: z, text: "“是以康侯”至“三接也”。○正義曰：釋訖舉《經》以結君寵之意也。○注“康美之名也”至“一晝三接也”。○正義曰：舉此對釋者，蓋訟言終朝，晉言一晝，俱不盡一日，明黜陟之速，所以示懲勸也。" }
      - { type: j, text: "《象》曰：“明出地上”，晉。君子以自昭明德。以順著明，自顯之道。" }
      - { type: z, text: "“《象》曰”至“以昭明德”。○正義曰：“自昭明德”者，昭亦明也，謂自顯明其德也。周氏等為“照”以為自照己身。《老子》曰：“自知者明。”用明以自照為明德。案：王《注》此云：“以順著明自顯之道。”又此卦與明夷正反。《明夷·象》云：“君子以蒞眾用晦而明。”王注彼云：“蒞眾顯明，蔽偽百姓。”“藏明於內，乃得明也。”准此二注，明王之《注》意以此為自顯明德。昭字宜為昭，之遙反。周氏等為照，之召反，非《注》旨也。" }
      - { type: j, text: "初六：晉如、摧如，貞吉。罔孚，裕，無咎。處順之初，應明之始，明順之德，於斯將隆。進明退順，不失其正，故曰“晉如、摧如、貞吉”也。處卦之始，功業未著，物未之信，故曰“罔孚”。方踐卦始，未至履位，以此為足，自喪其長者也。故必“裕”之，然後“無咎”。" }
      - { type: z, text: "“初六晉如摧如”至“無咎”。○正義曰：“晉如摧如貞吉”者，何氏云：“摧，退也。裕，寬也。如，辭也。”初六處順之初，“應明之始，明順之德，於斯將隆”，進則之明，退則居順，進之與退，不失其正，故曰“晉如摧如貞吉”也。“罔孚”者，處卦之始，功業未著，未為人所信服，故曰“罔孚”。“裕無咎”者，裕，寬也。“方踐卦始，未至履位”，不可自以為足也，若以此為足，是“自喪其長”也。故必宜寬裕其德，使功業弘廣，然後“無咎”，故曰“裕無咎”也。" }
      - { type: j, text: "《象》曰：“晉如摧如”，獨行正也。“裕無咎”，未受命也。未得履位，“未受命也”。" }
      - { type: z, text: "“《象》曰“至”未受命也”。○正義曰：“獨行正”者，獨猶專也，言進與退，專行其正也。“裕無咎未受命也”者，進之初，未得履位，未受錫命，故宜寬裕進德，乃得“無咎”。" }
      - { type: j, text: "六二：晉如，愁如，貞吉。受茲介福，於其王母。進而無應，其德不昭，故曰“晉如愁如”。居中得位，履順而正，不以無應而回其志，處晦能致其誠者也。脩德以斯，聞乎幽昧，得正之吉也，故曰“貞吉”。“母”者，處內而成德者也。“鳴鶴在陰”，則“其子和”，之立誠於闇，闇亦應之，故其初“愁如”。履貞不回，則乃受茲大福於其王母也。" }
      - { type: z, text: "“六二晉如愁如”至“於其王母”。○正義曰：“晉如愁如”者，六二進而無應於上，其德不見昭明，故曰“進如愁如”，憂其不昭也。“貞吉”者，然履順居於中正，不以無應而不脩其德，正而獲吉，故曰“貞吉”也。“受茲介福於其王母”者，介者，大也。母者，處內而成德者也。初雖“愁如”，但守正不改，終能受此大福於其所脩，故曰“受茲介福於其王母”。○注“進而無應”至“於其王母也”。○正義曰：“鳴鶴在陰”，則“其子和之”者，此王用《中孚》九二爻辭也。" }
      - { type: j, text: "《象》曰：“受茲介福”，以中正也。" }
      - { type: j, text: "六三：眾允，悔亡。處非其位，悔也。志在上行，與眾同信，順而麗明，故得“悔亡”也。" }
      - { type: z, text: "正義曰：六三處非其位，有悔也。“志在上行，與眾同信，順而麗明，故得其悔亡”。" }
      - { type: j, text: "《象》曰：“眾允”之，志上行也。" }
      - { type: z, text: "正義曰：居晉之時，眾皆欲進，巳應於上，志在上行，故能與眾同信也。" }
      - { type: j, text: "九四：晉如鼫鼠，貞厲。履非其位，上承於五，下據三陰，履非其位。又負且乘，無業可安，志無所據，以斯為進，正之危也。進如鼫鼠，無所守也。" }
      - { type: z, text: "“九四晉如鼫鼠，貞厲”。○正義曰：“晉如鼫鼠”者，鼫鼠有五能而不成伎之蟲也。九四履非其位，上承於五，下據三陰，上不許其承，下不許其據，以斯為進，無業可安，無據可守，事同鼫鼠，無所成功也。以斯為進，正之危也，故曰“晉如鼫鼠，貞厲”也。○注“履非其位”至“無所守也”。○正義曰：“晉如鼫鼠無所守也”者，蔡邕《勸學篇》云：“鼫鼠五能不成一伎術。”《注》曰：“能飛不能過屋，能綠不能窮木，能游不能度谷，能穴不能掩身，能走不能先人。”《本草經》云：“螻蛄一名鼫鼠”，謂此也。鄭引《詩》云：“碩鼠碩鼠，無食我黍。”謂大鼠也。陸機以為“雀鼠”。案：王以為“無所守”，蓋五伎者當之。" }
      - { type: j, text: "《象》曰：“鼫鼠貞厲”，位不當也。" }
      - { type: j, text: "六五：悔亡。失得勿恤，往，吉，無不利。柔得尊位，陰為明主，能不用察，不代下任也。故雖不當位，能消其悔。“失得勿恤”，各有其司，術斯以往，“無不利”也。" }
      - { type: z, text: "“《象》曰鼫鼠”至“無不利”。○正義曰：“悔亡失得勿恤往吉無不利”者，居不當位，悔也。“柔得尊位，陰為明主”，能不自用其明，以事委任於下，故得“悔亡”。既以事任下，委物責成，失之與得，不須憂恤，故曰“失得勿恤”也。能用此道，所往皆吉而無不利，故曰“往吉無不利”也。" }
      - { type: j, text: "《象》曰“失得勿恤”，往有慶也。" }
      - { type: z, text: "正義曰：“有慶”者，委任得人，非惟自得無憂，亦將人所慶說，故曰“有慶”也。" }
      - { type: j, text: "上九：晉其角，維用伐邑。厲吉無咎，貞吝。處進之極，過明之中，明將夷焉，巳在乎角，在猶進之，非亢如何？失夫道化無為之事，必須攻伐，然後服邑，危乃得吉，吉乃無咎。用斯為正，亦以賤矣。" }
      - { type: z, text: "“上九，晉其角”至“貞吝”。○正義曰：“晉其角”者，西南隅也。上九處晉之極，過明之中，其猶日過於中，巳在於角而猶進之，故曰“進其角”也。“維用伐邑”者，在角猶進，過亢不巳，不能端拱無為，使物自服，必須攻伐其邑，然後服之，故云“維用伐邑”也。“厲吉無咎貞吝”者，兵者兇器，伐而服之，是危乃得吉，吉乃無咎，故曰“厲吉無咎”。以此為正，亦以賤矣，故曰“貞吝”也。" }
      - { type: j, text: "《象》曰：“維用伐邑”，道未光也。" }
      - { type: z, text: "正義曰：“道未光也”者，用伐乃服，雖得之，其道未光大也。" }
      - { type: j, text: "離下坤上。明夷：利艱貞。" }
      - { type: z, text: "正義曰：“明夷”，卦名。夷者，傷也。此卦日入地中，明夷之象。施之於人事，闇主在上，明臣在下，不敢顯其明智，亦明夷之義也。時雖至闇，不可隨世傾邪，故宜艱難堅固，守其貞正之德。故明夷之世，利在艱貞。" }
      - { type: j, text: "《彖》曰：明入地中，明夷。內文明而外柔順，以蒙大難，文王以之，“利艱貞”，晦其明也。內難而能正其志，箕子以之。" }
      - { type: z, text: "“《彖》曰明入地中”至“箕子以之”。正義曰：“明入地中明夷”者，此就二象以釋卦名，故此及《晉卦》皆《彖》、《象》同辭也。“內文明而外柔順，以蒙大難，文王以之”者，既釋明夷之義，又須出能用“明夷”之人，內懷文明之德，撫教六州，外執柔順之能，三分事紂，以此蒙犯大難，身得保全，惟文王能用之，故云“文王以之”。“利艱貞晦其明也”者，此又就二體釋卦之德。明在地中，是”晦其明“也。既處“明夷”之世，外晦其明，恐陷於邪道，故利在艱固其貞，不失其正，言所以“利艱貞”者，用“晦其明”也。“內難而能正其志箕子以之”者，既“釋艱貞”之義，又須出能用艱貞之人，內有險難，殷祚將傾，而能自正其志，不為而邪幹，惟箕子能用之，故云：“箕子以之”。" }
      - { type: j, text: "《象》曰：“明入地中，明夷”，君子以蒞眾，蒞眾顯明，蔽偽百姓者也。故以蒙養正，以“明夷”蒞眾。" }
      - { type: z, text: "“《象》曰”至“君子以蒞眾”。正義曰：“蒞眾顯明，蔽偽百姓者也。所以君子能用此“明夷”之道，以臨於眾，冕旒垂目，黈纊塞耳，無為清靜，民化不欺。若運其聰明，顯其智慧，民即逃其密網，奸詐愈生，豈非藏明用晦，反得其明也？故曰“君子以蒞眾，用晦而明”也。" }
      - { type: j, text: "用晦而明。藏明於內，乃得明也。顯明於外，巧所闢也。" }
      - { type: j, text: "初九：明夷于飛，垂其翼。君子子行，三日不食。有攸往，主人有言。明夷之主，在於上六。上六為至闇者也。初處卦之始，最遠於難也。遠難過甚，“明夷”遠遯，絕跡匿形，不由軌路，故曰“明夷于飛”。懷懼而行，行不敢顯，故曰“垂其翼”也。尚義而行，故曰“君子於行”也。志急於行，飢不遑食，故曰“三日不食”也。殊類過甚，以斯適人，人心疑之，故曰“有攸往，主人有言”。" }
      - { type: z, text: "“初九明夷于飛”至“主人有言”。○正義曰：“明夷于飛”者，明夷是至闇之卦。上六既居上極，為明夷之主。云“飛”者，借飛鳥為喻，如鳥飛翔也。初九處於卦始，去上六最遠，是最遠於難。“遠難過甚，明夷遠遯，絕跡匿形，不由軌路”，高飛而去，故曰“明夷于飛”也。“垂其翼”者，飛不敢顯，故曰“垂其翼”也。“君子於行三日不食”者，“尚義而行”，故云“君子於行”。“志急於行，飢不遑食”，故曰“三日不食”。“有攸往，主人有言”者，“殊類過甚，以此適人”，人必疑怪而有言，故曰“有攸往，主人有言”。" }
      - { type: j, text: "《象》曰：“君子於行”，義不食也。" }
      - { type: z, text: "正義曰：“義不食也”者，君子逃難惟速，故義不求食也。" }
      - { type: j, text: "六二：明夷，夷於左股，用拯馬壯，吉。“夷於左股”，是行不能壯也。以柔居中，用夷其明，進不殊類，退不近難，不見疑憚，“順以則”也，故可用拯馬而壯吉也。不垂其翼，然後乃免也。" }
      - { type: z, text: "正義曰：“明夷夷於左股”者，左股被傷，行不能壯。六二“以柔居中，用夷其明”，不行剛壯之事者也，故曰“明夷夷於左股”。莊氏云：“言左者，取其傷小。”則比夷右未為切也。“夷於左股”，明避難不壯，不為闇主所疑，猶得處位，不至懷懼而行，然後徐徐用馬，以自拯濟而獲其壯吉也，故曰“用拯馬壯吉”也。" }
      - { type: j, text: "《象》曰：六二之“吉”，順以則也。順之以則，故不見疑。" }
      - { type: z, text: "正義曰：“順以則也”者，言順闇主之則，不同初九，殊類過甚，故不為闇主所疑，故得拯馬之吉也。" }
      - { type: j, text: "九三：明夷於南狩，得其大首，不可疾貞。處下體之上，居文明之極，上為至晦，入地之物也。故夷其明，以獲南狩，得大首也。“南狩”者，發其明也。既誅其主，將正其民。民之迷也，其日固巳久矣。化宜以漸，不可速正，故曰“不可疾貞”。" }
      - { type: z, text: "“九三明夷於南狩”至“不可疾貞”。○正義曰：南方，文明之所。狩者，征伐之類。“大首”謂闇君。“明夷於南狩得其大首”者，初藏明而往，託狩而行，至南方而發其明也。九三應於上六，是明夷之臣發明以徵闇君，而得其“大首”，故曰“明夷於南狩得其大首”也。“不可疾貞”者，既誅其主，將正其民，民迷日久，不可卒正，宜化之以漸，故曰“不可疾貞”。" }
      - { type: j, text: "《象》曰：“南狩”之志，乃得大也。去闇主也。" }
      - { type: z, text: "正義曰：志欲除闇，乃得“大首”，是其志大得也。" }
      - { type: j, text: "六四：入於左腹，獲明夷之心，於出門庭。左者，取其順也。入於左腹，得其心意，故雖近不危。隨時闢難，門庭而巳，能不逆忤也。" }
      - { type: z, text: "正義曰：“入於左腹獲明夷之心”者，凡右為用事也。從其左不從其右，是卑順不逆也。“腹”者，事情之地。六四體柔處坤，與上六相近，是能執卑順“入於左腹”，獲明夷之心意也。“於出門庭”者，既得其意，雖近不危，隨時避難，門庭而巳，故曰“於出門庭”。" }
      - { type: j, text: "《象》曰：“入於左腹”，獲心意也。" }
      - { type: z, text: "正義曰：“獲心意”者，心有所存，既不逆忤，能順其正，故曰“獲心意”也。" }
      - { type: j, text: "六五：箕子之明夷，利貞。最近於晦，與難為比，險莫如茲。而在斯中，猶闇不能沒，明不可息，正不憂危，故“利貞”也。" }
      - { type: z, text: "正義曰：“箕子之明夷”者，六五最比闇君，似箕子之近殷紂，故曰“箕子之明夷”也。“利貞”者，箕子執志不回，“闇不能沒，明不可息，正不憂危”，故曰“利貞”。" }
      - { type: j, text: "《象》曰：箕子之貞，明不可息也。" }
      - { type: z, text: "正義曰：“明不可息也”者，息，滅也。《象》稱“明不可滅”者，明箕子能保其貞，卒以全身，為武王師也。" }
      - { type: j, text: "上六：不明晦，初登於天，後入於地。處明夷之極，是至晦者也。本其初也，在乎光照，轉至於晦，遂入於地。" }
      - { type: z, text: "正義曰：“不明晦”者，上六居明夷之極，是至闇之主，故曰“不明而晦”，“本其初也”。其意在於光照四國，其後由乎無不明，“遂入於地”，謂見誅滅也。" }
      - { type: j, text: "《象》曰：“初登於天”，照四國也。後入於地，失則也。" }
      - { type: z, text: "正義曰：“失則”者，由失法則，故誅滅也。" }
      - { type: j, text: "離下巽上。家人：利女貞。家人之義，各自脩一家之道，不能知家外他人之事也。統而論之，非元亨利君子之貞，故“利女貞”。其正在家內而巳。" }
      - { type: z, text: "正義曰：“家人”者，卦名也。明家內之道，正一家之人，故謂之“家人”。“利女貞”者，既修家內之道，不能知家外他人之事。統而論之，非君子丈夫之正，故但言“利女貞”。" }
      - { type: j, text: "《彖》曰：家人，女正位乎內，謂二也。男正位乎外。謂五也。家人之義，以內為本，故先說女也。" }
      - { type: z, text: "“《彖》曰”至“男正位乎外”。○正義曰：此因二、五得正以釋“家人”之義，並明女貞之旨。家人之道，必須女主於內，男主於外，然後家道乃立。今此卦六二柔而得位，是女正位乎內也。九五剛而得位，是男正位乎外也。家人“以內為本，故先說女也”。" }
      - { type: j, text: "男女正，天地之大義也。家人有嚴君焉。父母之謂也。父父、子子、兄兄、弟弟、夫夫、婦婦而家道正，正家而天下定矣。" }
      - { type: z, text: "“男女正”至“天下定矣”。○正義曰：“男女正天地之大義也”者，因正位之言，廣明家人之義乃道均二儀，故曰“天地之大義也”。“家人有嚴君焉父母之謂”者，上明義均天地，此又言道齊邦國。父母一家之主，家人尊事，同於國有嚴君，故曰“家人有嚴君焉父母之謂”也。“父父、子子、兄兄、弟弟、夫夫、婦婦而家道正，正家而天下定矣”者，此歎美正家之功，可以定於天下，申成道齊邦國。既家有嚴君，即父不失父道，乃至婦不失婦道，尊卑有序，上下不失，而後為家道之正。各正其家，無家不正，即天下之治定矣。" }
      - { type: j, text: "《象》曰：風自火出，家人。由內以相成熾也。" }
      - { type: z, text: "正義曰：巽在離外，是風從火出。火出之初，因風方熾。火既炎盛，還復生風。內外相成，有似家人之義。故曰“風自火出家人”也。" }
      - { type: j, text: "君子以言有物而行有恆。家人之道，脩於近小而不妄也。故君子以言必有物而口無擇言，行必有恆而身無擇行。" }
      - { type: z, text: "正義曰：物，事也。言必有事，即口無擇言。行必有常，即身無擇行。正家之義，修於近小。言之與行，君子樞機。出身加人，發邇化遠，故舉言行以為之誡。言既稱物，而行稱“恆”者，發言立行，皆須合於可常之事，互而相足也。" }
      - { type: j, text: "初九：閒有家，悔亡。凡教在初而法在始，家瀆而後嚴之，志變而後治之，則“悔”矣。處家人之初，為家人之始，故宜必以“閒有家”，然後“悔亡”也。" }
      - { type: z, text: "正義曰：治家之道，在初即須嚴正，立法防閒。若黷亂之後，方始治之，即有悔矣。初九處家人之初，能防閒有家，乃得“悔亡”，故曰“閒有家，悔亡”也。" }
      - { type: j, text: "《象》曰：“閒有家”，志未變也。" }
      - { type: z, text: "正義曰：“志未變也”者，釋在初防閒之義。所以在初防閒其家者，家人志未變黷也。" }
      - { type: j, text: "六二：無攸遂，在中饋，貞吉。居內處中，履得其位，以陰應陽，盡婦人之正，義無所必，遂職乎“中饋”，巽順而巳，是以“貞吉”也。" }
      - { type: z, text: "正義曰：六二履中居位，以陰應陽，盡婦人之義也。婦人之道，巽順為常，無所必遂。其所職主，在於家中饋食供祭而已，得婦人之正吉，故曰“無攸遂在中饋貞吉”也。" }
      - { type: j, text: "《象》曰：六二之“吉”，順以巽也。" }
      - { type: z, text: "正義曰：舉爻位也。言“吉”者，明其以柔居中而得正位，故能順以巽而獲吉也。" }
      - { type: j, text: "九三：家人嗃嗃，悔厲，吉。婦子嘻嘻，終吝。以陽處陽，剛嚴者也。處下體之極，為一家之長者也。行與其慢，寧過乎恭；家與其瀆，寧過乎嚴。是以家人雖“嗃嗃悔厲”，猶得其道。“婦子嘻嘻”，乃失其節也。" }
      - { type: z, text: "正義曰：“嗃嗃”，嚴酷之意也。“嘻嘻”，喜笑之貌也。九三處下體之上，為一家之主，以陽處陽，行剛嚴之政，故“家人嗃嗃”。雖復嗃嗃傷猛，悔其酷厲，猶保其吉，故曰“悔厲吉”。若縱其婦子慢黷嘻嘻，喜笑而無節，則終有恨辱，故曰“婦子嘻嘻終吝”也。" }
      - { type: j, text: "《象》曰：“家人嗃嗃”，未失也。“婦子嘻嘻”，失家節也。" }
      - { type: z, text: "正義曰：“未失也”者，初雖悔厲，似失於猛，終無慢黷，故曰：“未失也”。“失家節”者，若縱其嘻嘻，初雖歡樂，終失家節也。" }
      - { type: j, text: "六四：富家，大吉。能以其富順而處位，故“大吉”也。若但能富其家，何足為大吉無體柔居巽，履得其位，明於家道，以近至尊，能富其家也。" }
      - { type: z, text: "正義曰：富謂祿位昌盛也。六四體柔處巽，得位承五，能富其家者也。由其體巽承尊，長保祿位，吉之大者也，故曰“富家大吉”。" }
      - { type: j, text: "《象》曰：“富家，大吉”，順在位也。" }
      - { type: z, text: "正義曰：“順在位”者，所以致大吉，由順承於君而在臣位，故不見黜奪也。" }
      - { type: j, text: "九五：王假有家，勿恤，吉。假，至也。履正而應，處尊體巽，王至斯道，以有其家者也。居於尊位，而明於家道，則下莫不化矣。父父、子子、兄兄、弟弟、夫夫、婦婦，六親和睦交相愛樂而家道正，“正家而天下定矣”。故“王假有家”，則勿恤而吉。" }
      - { type: z, text: "正義曰：“王假有家”者，假，至也。九五履正而應，處尊體巽，是能以尊貴巽接於物，王至此道，以有其家，故曰“王假有家”也。“勿恤吉”者，居於尊位而明於家道，則在下莫不化之矣，不須憂恤而得吉也，故曰“勿恤吉”也。" }
      - { type: j, text: "《象》曰：“王假有家”，交相愛也。" }
      - { type: z, text: "正義曰：“交相愛也”者，王既明於家道，天下化之，“六親和睦，交相愛樂”也。" }
      - { type: j, text: "上九：有孚，威如，終吉。處家人之終，居家道之成，“刑于寡妻”，以著於外者也，故曰“有孚”。凡物以猛為本者則患在寡恩，以愛為本者則患在寡威，故家人之道尚威嚴也。家道可終，唯信與威。身得威敬，人亦如之。反之於身，則知施於人也。" }
      - { type: z, text: "正義曰：上九處家人之終，家道大成，“刑于寡妻”，以著於外，信行天下，故曰“有孚”也。威被海內，故曰“威如”。威、信並立，上得終於家道，而吉從之，故曰“有孚威如終吉”也。" }
      - { type: j, text: "《象》曰：“威如”之吉，反身之謂也。" }
      - { type: z, text: "正義曰：“反身之謂”者，身得人敬則敬於人，明知身敬於人人亦敬已，反之於身則知施之於人，故曰“反身之謂”也。" }
      - { type: j, text: "兌下離上。睽：小事吉，" }
      - { type: z, text: "正義曰：“睽”者，乖異之名，物情乖異，不可大事。大事謂與役動眾，必須大同之世，方可為之。小事謂飲食衣服，不待眾力，雖乖而可，故曰“小事吉”也。" }
      - { type: j, text: "《彖》曰：睽，火動而上，澤動而下。二女同居，其志不同行。說而麗乎明，柔進而上行，得中而應乎剛，是以“小事吉”。事皆相違，害之道也，何由得小事吉？以有此三德也。" }
      - { type: z, text: "“《彖》曰睽動而上”至“小事吉”。○正義曰：“睽，火動而上，澤動而下，二女同居，其志不同行”者，此就二體釋卦名為“睽”之義，同而異者也。水火二物，共成烹飪，理應相濟。今火在上而炎上，澤居下而潤下，無相成之道，所以為乖。中少二女共居一家，理應同志，各自出適，志不同行，所以為異也。“說而麗乎明，柔進而上行，得中而應乎剛，是以小事吉”者，此就二體及六五有應，釋所以小事得吉。“說而麗乎明”，不為邪僻。“柔進而上行”，所之在貴。“得中而應乎剛”，非為全弱。雖在乖違之時，卦爻有此三德，故可以行小事而獲吉也。" }
      - { type: j, text: "天地睽而其事同也，男女睽而其志通也，萬物睽而其事類也。睽之時用大矣哉！睽離之時，非小人之所能用也。" }
      - { type: z, text: "“天地睽而其事同也”至“時用大矣哉！”○正義曰：“天地睽而其事同”，此以下歷就天地男女萬物，廣明睽義體乖而用合也。天高地卑，其體懸隔，是“天地睽”也。而生成品物，其事則同也。“男女睽而其志通”者，男外女內，分位有別，是男女睽也。而成家理事，其志則通也。萬物殊形，各自為象，是“萬物睽”也。而均於生長，其事即類，故曰“天地睽而其事同也。”男女睽而其志通也，萬物睽而其事類也。睽之時用大矣哉！”既明睽理合同之大，又歎能用睽之人，其德不小，睽離之時，能建其用使合其通理，非大德之人，則不可也，故曰“睽之時用大矣哉”也。" }
      - { type: j, text: "《象》曰：上火下澤，睽。君子以同而異。同於通理，異於職事。" }
      - { type: z, text: "正義曰：“上火下澤睽”者，動而相背，所以為“睽”也。“君子以同而異”者，佐王治民，其意則同；各有司存，職掌則異，故曰“君子以同而異”也。" }
      - { type: j, text: "初九：悔亡。喪馬，勿逐，自復。見惡人，無咎。處睽之初，居下體之下，無應獨立，悔也。與四合志，故得“悔亡”。馬者，必顯之物。處物之始，乖而喪其馬，物莫能同，其私必相顯也，故“勿逐”而“自復”也。時方乖離，而位乎窮下，上無應可援，下無權可恃，顯德自異，為惡所害，故“見惡人”乃得免咎也。" }
      - { type: z, text: "“初九，悔亡，喪馬勿逐自復，見惡人無咎”。○正義曰：“悔亡”者，初九處睽離之初，“居下體之下，無應獨立”，所以悔也。四亦處下，無應獨立，不乖於己，與己合志，故得“悔亡”。“喪馬勿逐自復”者，時方睽離，觸目乖阻。馬之為物，難可隱藏，時或失之，不相容隱，不須尋求，勢必“自復”，故曰“喪馬勿逐自復”也。“見惡人無咎”者，處於窮下，上無其應，無應則無以為援，窮下則無權可恃。若標顯自異，不能和光同塵，則必為惡人所害，故曰“見惡人無咎”。“見”，謂遜接之也。" }
      - { type: j, text: "《象》曰：“見惡人”，以闢咎也。" }
      - { type: z, text: "“《象》曰見惡人以闢咎也”。○正義曰：“以闢咎也”者，惡人不應與之相見，而遜接之者，以“闢咎”也。" }
      - { type: j, text: "九二：遇主於巷，無咎。處睽失位，將無所安。然五亦失位，俱求其黨，出門同趣，不期而遇，故曰“遇主於巷”也。處睽得援，雖失其位，未失道也。" }
      - { type: z, text: "“九二，遇主於巷，無咎”。○正義曰：九二處睽之時而失其位，將無所安。五亦失位，與己同黨，同趣相求，不假遠涉而自相遇，適在於巷。言遇之不遠，故曰：“遇主於巷”。“主”謂五也。處睽得援，咎悔可亡，故“無咎”也。" }
      - { type: j, text: "《象》曰：“遇主於巷”，未失道也。" }
      - { type: z, text: "正義曰：“未失道”者，既遇其主，雖失其位，亦“未失道也”。" }
      - { type: j, text: "六三：見輿曳，其牛掣。其人天且劓，無初有終。凡物近而不相得，則兇。處睽之時，履非其位，以陰居陽，以柔乘剛，志在於上，而不和於四，二應於五，則近而不相比，故“見輿曳”。“輿曳”者，履非其位，失所載也。“其牛掣”者，滯隔所在，不獲進也。“其人天且劓”者，四從上取，二從下取，而應在上九，執志不回。初雖受困，終獲剛助。" }
      - { type: z, text: "“六三見輿曳其牛”至“無初有終”。○正義曰：“見輿曳其牛掣”者，處睽之時，履非其位，以陰居陽，以柔乘剛，志在上九，不與四合。二自應五，又與巳乖。欲載，其輿被曳，失巳所載也。欲進，其牛被牽，滯隔所在，不能得進也。故曰“見輿曳其牛掣”也。“其人天且劓，無初有終”者，黥額為天，截鼻為劓。既處二四之間，皆不相得，其為人也，四從上刑之，故黥其額，二從下刑之，又截其鼻，故曰“其人天且劓，“而應在上九，執志不回，初雖受困，終獲剛助”，故曰“無初有終”。" }
      - { type: j, text: "《象》曰：“見輿曳”，位不當也。“無初有終”，遇剛也。" }
      - { type: z, text: "“《象》曰”至“有終遇剛也”。○正義曰：“位不當”者，由位不當，故輿被曳。“遇剛”者，由遇上九之剛，所以“有終”也。" }
      - { type: j, text: "九四：睽孤，遇元夫。交孚，厲，無咎。無應獨處，五自應二，三與己睽，故曰“睽孤”也。初亦無應特立。處睽之時，俱在獨立，同處體下，同志者也。而巳失位，比於三五，皆與巳乖，處無所安，故求其疇類而自託焉，故曰“遇元夫”也。同志相得而無疑焉，故曰“交孚”也。雖在乖隔，志故得行，故雖危無咎。" }
      - { type: z, text: "“九四”至“交孚厲無咎”。○正義曰：“元夫”謂初九也。處於卦始，故云“元”也。初、四俱陽而言“夫”者，蓋是丈夫之夫，非夫婦之夫也。" }
      - { type: j, text: "《象》曰：“交孚”、“無咎”，志行也。" }
      - { type: j, text: "六五：悔亡。厥宗噬膚，往，何咎？非位，悔也，有應故悔亡。“厥宗”，謂二也。“噬膚”者，齧柔也。三雖比二，二之所噬，非妨巳應者也。以斯而往，何咎之有？往必合也。" }
      - { type: z, text: "“六五悔亡”至“往何咎”。○正義曰：“悔亡”者，失位，悔也，“有應故悔亡”也。“厥宗噬膚，往何咎”者，宗，主也，謂二也。“噬膚”謂噬三也。三雖隔二，二之所噬，故曰“厥宗噬膚”也。三是陰爻，故以“膚”為譬，言柔脆也。二既噬三即五，可以往而“無咎”矣，故曰“往無咎”。" }
      - { type: j, text: "《象》曰“厥宗噬膚”，往有慶也。" }
      - { type: z, text: "“《象》曰”至“往有慶也”。○正義曰：“往有慶也”者，有慶之言，善功被物，為物所賴也。五雖居尊而不當位，與二合德，乃為物所賴，故曰“往有慶也”。" }
      - { type: j, text: "上九：睽孤。見豕負塗，載鬼一車，先張之弧，後說之弧。匪寇婚媾，往，遇雨則吉。處睽之極，睽道未通，故曰“睽孤”。巳居炎極，三處澤盛，睽之極也。以文明之極，而觀至穢之物，“睽”之甚也。豕失負塗，穢莫過焉。至“睽”將合，至殊將通，恢詭譎怪，道將為一。未至於洽，先見殊怪，故“見豕負塗”，甚可穢也。見鬼盈車，籲可怪也。“先張之弧”，將攻害也。“後說之弧”，睽怪通也。四剠其應，故為寇也。“睽”志將通，“匪寇婚媾”，往不失時，睽疑亡也。貴於遇雨，和陰陽也。陰陽既和，“群疑亡”也。" }
      - { type: z, text: "“上九睽孤見豕”至“遇雨則吉”。正義曰：“睽孤”者，處睽之極，“睽”道未通，故曰“睽孤”也。“見豕負塗”者，火動而上，澤動而下，“已居炎極，三處澤盛，睽之極也”。離為文明，澤是卑穢，以文明之極而觀至穢之物，事同豕而負塗泥，穢莫斯甚矣，故曰“見豕負塗”。“載鬼一車，先張之弧，後說之弧”者，鬼魅盈車，怪異之甚也。至“睽”將合，至殊將通，未至於治，先見殊怪，故又見“載鬼一車”。載鬼不言“見”者，為豕上有“見”字也。見怪若斯，懼來害己，故“先張之弧”，將攻害也。物極則反，“睽”極則通，故“後說之弧”，不復攻也。“匪寇婚媾”者，“四剠其應”，故謂四為寇。“睽”志既通，匪能為寇，乃得與二為婚媾矣，故曰“匪寇婚媾”也。“往遇雨則吉”者，雨者，陰陽交和之道也。眾異並消，無復疑阻，往得和合，則吉從之，故曰“往遇雨則吉”。○注“處睽之極”至“群疑亡也”。○正義曰：“恢詭譎怪道將為一”者，《莊子內篇·齊物論》曰：“無物不然，無物不可。故為舉筳與楹，厲與西施，恢詭譎怪，道通為一。”郭象注云：“夫筳橫而楹縱，厲醜而西施好，所謂齊者，豈必齊形狀，同規矩哉！舉縱橫好醜，恢詭譎怪，各然其所然，各可其所可，即形雖萬殊，而性本得同，故曰‘道通為一’也。”莊子所言以明齊物，故舉恢詭譎怪至異之物，道通為一，得性則同。王輔嗣用此文而改“通”為“將”字者，明物極則反，睽極則通，有似引詩斷章，不必與本義同也。" }
      - { type: j, text: "《象》曰：“遇雨”之吉，群疑亡也。" }
      - { type: z, text: "正義曰：“群疑亡也”者，往與三合，如雨之和。向之見豕、見鬼、張弧之疑並消釋矣，故曰“群疑亡也”。" }
      - { type: j, text: "艮下坎上。蹇：利西南，不利東北。西南，地也，東北，山也。以難之平則難解，以難之山則道窮。" }
      - { type: z, text: "正義曰：“蹇”，難也。有險在前，畏而不進，故稱為“蹇”。西南險位，平易之方。東北險位，阻礙之所。世道多難，率物以適平易，則蹇難可解。若入於險阻，則彌加擁塞。去就之宜，理須如此，故曰“蹇，利西南不利東北”也。" }
      - { type: j, text: "利見大人。往則濟也。" }
      - { type: z, text: "正義曰：能濟眾難，惟有大德之人，故曰“利見大人”，" }
      - { type: j, text: "貞吉。爻皆當位，各履其正，居難履正，正邦之道也。正道未否，難由正濟，故“貞吉”也。遇難失正，吉可得乎？" }
      - { type: z, text: "正義曰：居難之時，若不守正而行其邪道，雖見大人，亦不得吉，故曰“貞吉”也。" }
      - { type: j, text: "《彖》曰：蹇，難也，險在前也。見險而能止，知矣哉！蹇“利西南”，往得中也。“不利東北”，其道窮也。“利見大人”，往有功也。當位“貞吉”，以正邦也。《蹇》之時用大矣哉！蹇難之時，非小人之所能用也。" }
      - { type: z, text: "“《彖》曰”至“大矣哉”。○正義曰：“蹇，難也，險在前也。見險而能止，知矣哉”者，釋卦名也。蹇者，有難而不進，能止而不犯，故就二體，有險有止，以釋蹇名。坎在其外，是“險在前也”。有險在前，所以為難。若冒險而行，或罹其害。艮居其內，止而不往，相時而動，非知不能，故曰“見險而能止，知矣哉”也。“蹇利西南往得中也”者，之於平易，救難之理，故云“往得中”也。“不利東北其道窮”者，之於險阻，更益其難，其道彌窮，故曰“其道窮”也。“利見大人往有功也”者，往見大人必能除難，故曰“往有功”也。“當位貞吉，以正邦也”者，二、三、四、五爻皆當位，所以得正而吉，故曰“當位貞吉”也。“以正邦也”者，居難守正，正邦之道，故曰“以正邦”也。“蹇之時用大矣哉”者，能於蹇難之時建立其功，用以濟世者，非小人之所能，故曰“蹇之時用大矣哉”也。" }
      - { type: j, text: "《象》曰：山上有水，蹇。山上有水，蹇難之象。" }
      - { type: z, text: "正義曰：山者是巖險，水是阻難。水積山上，彌益危難，故曰“山上有水蹇”。" }
      - { type: j, text: "君子以反身修德。除難莫若反身脩德。" }
      - { type: z, text: "正義曰：蹇難之時，未可以進，惟宜反求諸身，自脩其德，道成德立，方能濟險，故曰“君子以反身修德”也。陸績曰：“水在山上，失流通之性，故曰蹇。”通水流下，今在山上，不得下流，蹇之象。陸績又曰：“水本應山下，今在山上，終應反下，故曰反身。”處難之世，不可以行，只可反省察，脩已德用乃除難。君子通達道暢之時，並濟天下，處窮之時則獨善其身也。" }
      - { type: j, text: "初六：往蹇，來譽。處難之始，居止之初，獨見前識，睹險而止，以待其時，知矣哉！故往則遇蹇，來則得譽。" }
      - { type: z, text: "正義曰：初六處蹇之初，往則遇難，來則得譽。初居艮始，是能見險而止。見險不往，則是來而得譽，故曰“往蹇來譽”。" }
      - { type: j, text: "《象》曰：“往蹇來譽”，宜待也。" }
      - { type: z, text: "正義曰：“宜待”者，既“往則遇蹇”，宜止以待時也。" }
      - { type: j, text: "六二：王臣蹇蹇，匪躬之故。處難之時，履當其位，居不失中，以應於五。不以五在難中，私身遠害，執心不回，志匡王室者也。故曰：“王臣蹇蹇，匪躬之故”。履中行義，以存其上，處蹇以比，未見其尢也。" }
      - { type: z, text: "正義曰：“王”謂五也。“臣”謂二也。九五居於王位而在難中，六二是五之臣，往應於五，履正居中，志匡王室，能涉蹇難，而往濟蹇，故曰“王臣蹇蹇”也。盡忠於君，匪以私身之故而不往濟君，故曰“匪躬之故”。" }
      - { type: j, text: "《象》曰：“王臣蹇蹇”，終無尢也。" }
      - { type: z, text: "正義曰：“終無尤”者，處難以斯，豈有過尤也？" }
      - { type: j, text: "九三：往蹇，來反。進則入險，來則得位，故曰“往蹇來反”。為下卦之主，是內之所恃也。" }
      - { type: z, text: "正義曰：九三與《坎》為鄰，進則入險，故曰“往蹇”。來則得位，故曰“來反”。" }
      - { type: j, text: "《象》曰：“往蹇來反”，內喜之也。" }
      - { type: z, text: "正義曰：“內喜之”者，內卦三爻，惟九三一陽居二陰之上，是內之所恃，故云“內喜之”也。" }
      - { type: j, text: "六四：往蹇，來連。往則無應，來則乘剛，往來皆難，故曰“往蹇來連”。得位履正，當其本實，雖遇於難，非妄所招也。" }
      - { type: z, text: "正義曰：馬云“連亦難”也。鄭云“遲久之意”。六四往則無應，來則乘剛，往來皆難，故曰“往蹇來連”也。" }
      - { type: j, text: "《象》曰：“往蹇來連”，當位實也。" }
      - { type: z, text: "正義曰：“當位實”者，明六四當位履正，當其本實。而往來遇難者，乃數之所招，非邪妄之所致也，故曰“當位實”也。" }
      - { type: j, text: "九五：大蹇，朋來。處難之時，獨在險中，難之大者也，故曰“大蹇”。然居不失正，履不失中，執德之長，不改其節，如此則同志者集而至矣，故曰“朋來”也。" }
      - { type: z, text: "“九五，大蹇朋來”。○正義曰：九五處難之時，獨在險中，難之大者也，故曰“大蹇”。然得位履正，不改其節，如此則同志者自遠而來，故曰“朋來”。○注“處難之時”至“朋來也”。○正義曰：“同志者集而至矣”者，此以“同志”釋“朋來”之義。鄭注《論語》云：“同門曰朋，同志曰友。”此對友也。通而言之，同志亦是朋黨也。" }
      - { type: j, text: "《象》曰：“大蹇朋來”，以中節也。" }
      - { type: z, text: "正義曰：“以中節”者，得位居中，不易其節，故致“朋來”，故云“以中節”也。" }
      - { type: j, text: "上六：往蹇來碩，吉。利見大人。往則長難，來則難終，難終則眾難皆濟，志大得矣，故曰“往蹇來碩吉”。險夷難解，大道可興，故曰“利見大人”也。" }
      - { type: z, text: "正義曰：碩，大也。上六難終之地，不宜更有所往，往則長難，故曰“往蹇”也。“來則難終，難終則眾難皆濟，志大得矣”，故曰“碩吉”也。險夷難解，大道可興，宜見大人以弘道化，故曰“利見大人”也。" }
      - { type: j, text: "《象》曰：“往蹇來碩”，志在內也。有應在內，往則失之。來則志獲，“志在內也”。" }
      - { type: z, text: "正義曰：“志在內也”者，有應在三，是“志在內也”。應既在內，往則失之，來則得之，所以往則有蹇，來則碩吉也。" }
      - { type: j, text: "“利見大人”，以從貴也。" }
      - { type: z, text: "正義曰：貴謂陽也。以從陽，故云“以從貴”也。" }
      - { type: j, text: "坎下震上。解：利西南。西南，眾也。解難濟險，利施於眾。遇難不困於東北，故不言不利東北也。" }
      - { type: z, text: "正義曰：“解”者，卦名也。然解有兩音，一音古買反，一音胡買反，“解”謂解難之初，“解”謂既解之後。《彖》稱“動而免乎險”，明解眾難之時，故先儒皆讀為“解”。《序卦》云：“物不可以終難，故受之以解。解者，緩也。”然則“解”者，險難解，釋物情舒緩，故為“解”也。“解利西南”者，西南坤位，坤是眾也。施解於眾，則所濟者弘，故曰“解利西南”也。" }
      - { type: j, text: "無所往，其來復，吉。有攸往，夙吉。未有善於解難而迷於處安也。解之為義，解難而濟厄者也。無難可往，以解來復則不失中。有難而往，則以速為吉者，無難則能復其中，有難則能濟其厄也。" }
      - { type: z, text: "正義曰：“無所往”者，上言“解難濟險，利施於眾”。此下明救難之時，誡其可否。若無難可往，則以來復為吉。若有難可往，則以速赴為善，故云“無所往，其來復吉，有攸往夙吉”。設此誡者，褚氏云：“世有無事求功，故誡以無難宜靜，亦有待敗乃救，故誡以有難須速也。”" }
      - { type: j, text: "《彖》曰：解，險以動，動而免乎險，解。動乎險外，故謂之“免”。免險則解，故謂之“解”。" }
      - { type: z, text: "正義曰：此就二體以釋卦名。遇險不動，無由解難。動在險中，亦未能免咎。今動於險外，即見免脫於險，所以為“解”也。" }
      - { type: j, text: "“解，利西南”，往得眾也，“其來復吉”，乃得中也。“有攸往，夙吉”，往有功也。天地解而雷雨作，雷雨作而百果草木皆甲圻。天地否結則雷雨不作，交通感散，雷雨乃作也。雷雨之作，則險厄者亨，否結者散，故“百果草木皆甲圻”也。" }
      - { type: z, text: "“解利西南”至“百果草木皆甲坼”。○正義曰：“解利西南往得眾”者，“解”之為義，兼濟為美。往之西南得施解於眾，所以為利也。“其來復吉乃得中也”者，無難可解，退守靜默，得理之中，故云“乃得中”也。“有攸往，夙吉，往有功也”者，解難能速，則不失其幾，故“往有功也”。“天地解而雷雨作雷雨作，而百果草木皆甲圻”者，此因震、坎有雷雨之象，以廣明“解”義。天地解緩，雷雨乃作。雷雨既作，百果草木皆孚甲開坼，莫不解散也。" }
      - { type: j, text: "解之時大矣哉！無圻而不釋也。難解之時，非治難時，故不言用。體盡於解之名，無有幽隱，故不曰義。" }
      - { type: z, text: "正義曰：結歎解之大也。自天地至於草木，無不有“解”，豈非大哉！" }
      - { type: j, text: "《象》曰：雷雨作，解。君子以赦過宥罪。" }
      - { type: z, text: "正義曰：赦謂放免，過謂誤失，宥謂寬宥，罪謂故犯，過輕則赦，罪重則宥，皆解緩之義也。" }
      - { type: j, text: "初六：無咎“解”者，解也。屯難盤結，於是乎解也。處蹇難始解之初，在剛柔始散之際，將赦罪厄，以夷其險。處此之時，不煩於位而“無咎”也。" }
      - { type: z, text: "正義曰：夫險難未夷，則賤弱者受害，然則蹇難未解之時，柔弱者不能無咎，否結既釋之後，剛強者不復陵暴。初六，“處蹇難始解之初，在剛柔始散之際”，雖以柔弱處無位之地，逢此之時，不慮有咎，故曰“初六無咎”也。" }
      - { type: j, text: "《象》曰：剛柔之際，義無咎也。或有過咎，非其理也。“義”猶理也。" }
      - { type: z, text: "正義曰：“義無咎”者，“義”猶理也，剛柔既散，理必無咎，或有過咎，非理之當也，故曰“義無咎”也。○注“有過咎”至“義猶理也”。○正義曰：“或有過咎，非其理也”者，或本無此八字。" }
      - { type: j, text: "九二：田獲三狐，得黃矢，貞吉。狐者，隱伏之物也。剛中而應，為五所任，處於險中，知險之情，以斯解物，能獲隱伏也，故曰：“田獲三狐”也。黃，理中之稱也。矢，直也。田而獲三狐，得乎理中之道，不失枉直之實，能全其正者也，故曰“田獲三狐，得黃矢，貞吉”也。" }
      - { type: z, text: "正義曰：“田獲三狐”者，狐是隱伏之物，三為成數，舉三言之，搜獲歡盡。九二以剛居中而應於五，為五所任，處於險中，知險之情，以斯解險，無險不濟，能獲隱伏，如似田獵而獲窟中之狐，故曰“田獲三狐”。“得黃矢，貞吉”者，黃，中之稱。矢，直也。田而獲三狐，得乎無理中之道，不失枉直之實，能全其正者也，故曰“得黃矢貞吉”也。" }
      - { type: j, text: "《象》曰：九二，“貞吉”，得中道也。" }
      - { type: z, text: "正義曰：“得中道也”者，明九二位既不當，所以得“貞吉”者，由處於中，得乎理中之道故也。" }
      - { type: j, text: "六三：負且乘，致寇至，貞吝。處非其位，履非其正，以附於四，用夫柔邪以自媚者也。乘二負四，以容其身。寇之來也，自已所致，雖幸而免，正之所賤也。" }
      - { type: z, text: "正義曰：“負且乘致寇至”者，六三，矢正無應，下乘於二，上附於四，即是用夫邪佞以自說媚者也。乘者，君子之器也。負者，小人之事也。施之於人，即在車騎之上，而負於物也。故寇盜知其非巳所有，於是競欲奪之，故曰“負且乘致寇至”也。“貞吝”者，負乘之人，正其所鄙，故曰“貞吝”也。" }
      - { type: j, text: "《象》曰：負且乘，亦可醜也。自我致戎，又誰咎也？" }
      - { type: z, text: "正義曰：“亦可醜也”者，天下之醜多矣，此是其一，故曰“亦可醜也”。“自我致戎，又誰咎也”者，言此寇雖由已之招，非是他人致此過咎，故曰“又誰咎也”。" }
      - { type: j, text: "九四：解而拇，朋至斯孚。失位不正，而比於三，故三得附之為其拇也。三為之拇，則失初之應，故“解其拇”，然後朋至而信矣。" }
      - { type: z, text: "正義曰：而，汝也。拇，足大指也。履於不正，與三相比，三從下來附之，如指之附足，四有應在初。若三為之拇，則失初之應，故必“解其拇”，然後朋至而信，故曰“解而拇，朋至斯孚”。" }
      - { type: j, text: "《象》曰：“解而拇”，未當位也。" }
      - { type: z, text: "正義曰：“未當位”者，四若當位履正，即三為邪媚之身，不得附之也。既三不得附四，則無所解。今須解拇，由不當位也。" }
      - { type: j, text: "六五：君子維有解，吉。有孚於小人。居尊履中而應乎剛，可以有解而獲吉矣。以君子之道解難釋險，小人雖間，猶知服之而無怨矣。故曰“有孚於小人”也。" }
      - { type: z, text: "正義曰：“君子維有解吉”者，六五，居尊履中而應於剛，是有君子之德。君子當此之時，可以解於險難。維，辭也。有解於難，所以獲吉，故曰“君子維有解吉”也。“有孚於小人”者，以君子之道解難，則小人皆信服之，故曰“有孚於小人”也。" }
      - { type: j, text: "《象》曰：君子有解，小人退也。" }
      - { type: z, text: "正義曰：小人謂作難者，信君子之德，故退而畏服之。" }
      - { type: j, text: "上六：公用射隼於高墉之上，獲之，無不利。初為四應，二為五應，三不應上，失位負乘，處下體之上，故曰“高墉”。墉非隼之所處，高非三之所履，上六居動之上，為解之極，將解荒悖而除穢亂者也。故用射之，極則後動，成而後舉，故必“獲之”，而“無不利”也。" }
      - { type: z, text: "“上六”至“無不利”。○正義曰：隼者，貪殘之鳥，鸇鷂之屬。墉，牆也。六三失位負乘，不應於上，即是罪釁之人，故以譬於集。此借飛鳥為喻，而居下體之上，其猶隼處高墉。隼之為鳥，宜在山林，集於人家“高墉”，必為人所繳射，以譬六三處於高位，必當被人所誅討。上六居動之上，為解之極，將解之荒悖而除穢亂，故用射之也。“極而後動，成而後舉，故必獲之，而無不利”，故曰“公用射隼於高墉之上，獲之無不利”也。公宅臣之極。上六以陰居上，故謂之“公”也。" }
      - { type: j, text: "《象》曰：“公用射隼”，以解悖也。" }
      - { type: z, text: "正義曰：“解悖也”者，悖，逆也。六三失位負乘，不應於上，是悖逆之人也。上六居動之上，能除解六三之荒悖，故云“以解悖也”。" }
      - { type: j, text: "兌下艮上。損：有孚，元吉，無咎可貞，利有攸往。曷之用？二簋可用享。" }
      - { type: z, text: "“損有孚”至“可用享”。○正義曰：“損”者，減損之名，此卦明損下益上，故謂之“損”。“損”之為義，“損下益上”，損剛益柔。損下益上，非補不足者也。損剛益柔，非長君子之道者也。若不以誠信，則涉諂諛而有過咎，故必“有孚”，然後大吉，無咎可正，而“利有攸往”矣，故曰“損有孚，元吉，無咎可貞，利有攸往”也。先儒皆以無咎、可貞，各自為義，言既吉而無咎，則可以為正。準下王注《彖》辭云：“損下而不為邪，益上而不為諂，則何咎而可正。”然則王意以無咎、可貞共成一義，故莊氏云：“若行損有咎，則須補過以正其失。”今行損用信，則是無咎可正，故云“無咎可貞”。竊謂莊氏之言得正旨矣。“曷之用，二簋可用享”者，明行損之禮，貴夫誠信，不在於豐。既行損以信，何用豐為？二簋至約，可用享祭矣，故曰“曷之用，二簋可用享”也。" }
      - { type: j, text: "《彖》曰：損，損下益上，其道上行。艮為陽，兌為陰。凡陰順於陽者也。陽止於上，陰說而順，損下益上，上行之義也。" }
      - { type: z, text: "正義曰：此就二體釋卦名之義，艮，陽卦，為止。兌，陰卦，為說。陽止於上，陰說而順之，是下自減損以奉於上，“上行”之謂也。" }
      - { type: j, text: "損而有孚，元吉，無咎可貞，利有攸往。損之為道，“損下益上”，損剛益柔也。損下益上，非補不足也。損剛益柔，非長君子之道也。為損而可以獲吉，其唯有孚乎？“損而有孚”，則“元吉”，“無咎”而可正，“利有攸往”矣。“損剛益柔”，不以消剛。“損柔益上”，不以盈上，損剛而不為邪，益上而不為諂，則何咎而可正？雖不能拯濟大難，以斯有往，物無距也。" }
      - { type: z, text: "正義曰：卦有“元吉”已下等事，由於“有孚”，故加一“而”字，則其義可見矣。" }
      - { type: j, text: "“曷之用”？曷，辭也。“曷之用”，言何以豐為也。“二簋可用享。”二簋，質薄之器也。行損以信，雖二簋而可用享。" }
      - { type: z, text: "正義曰：“曷之用二簋可用享”者，舉《經》明之，皆為損而有孚，故得如此。" }
      - { type: j, text: "二簋應有時，至約之道，不可常也。" }
      - { type: z, text: "正義曰：申明二簋之禮，不可為常。二簋至約，惟在損時應時行之，非時不可也。" }
      - { type: j, text: "損剛益柔有時。下不敢剛，貴於上行，“損剛益柔”之謂也。剛為德長，損之不可以為常也。" }
      - { type: z, text: "正義曰：明“損下益上”之道，亦不可為常。損之所以能“損下益上”者，以下不敢剛亢，貴於奉上，則是損於剛亢而益柔順也。“損剛”者，謂損兌之陽爻也。“益柔”者，謂益艮之陰爻也。人之為德，須備剛柔，就剛柔之中，剛為德長。既為德長，不可恆減，故損之“有時”。" }
      - { type: j, text: "損益盈虛，與時偕行。自然之質，各定其分，短者不為不足，長者不為有餘，損益將何加焉？非道之常，故必“與時偕行”也。" }
      - { type: z, text: "正義曰：“盈虛”者，鳧足短而任性，鶴脛長而自然。此又云“與時偕行”者，上既言“損剛益柔”，不可常用，此又汎明損益之事，體非恆理，自然之質，各定其分。鳧足非短，鶴脛非長，何須損我以益人。虛此以盈彼，但有時宜用，故應時而行，故曰“損益盈虛，與時偕行”也。" }
      - { type: j, text: "《象》曰：山下有澤，損。山下有澤，損之象也。" }
      - { type: z, text: "正義曰：澤在山下，澤卑山高，似澤之自損，以崇山之象也。" }
      - { type: j, text: "君子以懲忿窒欲。可損之善，莫善忿欲也。" }
      - { type: z, text: "正義曰：君子以法此損道，以懲止忿怒，窒塞情欲。夫人之情也，感物而動，境有順逆，故情有忿欲。懲者息其既往，窒者閉其將來。忿欲皆有往來，懲窒互文而相足也。" }
      - { type: j, text: "初九：巳事遄往，無咎，酌損之。損之為道，“損下益上”，損剛益柔，以應其時者也。居於下極，損剛奉柔，則不可以逸。處損之始，則不可以盈，事已則往，不敢宴安，乃獲“無咎”也。剛以奉柔，雖免乎無咎，猶未親也。故既獲無咎，復自“酌損”，乃得“合志”也。遄，速也。" }
      - { type: z, text: "正義曰：“巳事遄往無咎”者，巳，竟也。遄，速也。損之為道，“損下益上”，如人臣欲自損己奉上。然各有所掌，若廢事而往，咎莫大焉。若事已不往，則為傲慢。竟事速往，乃得無咎，故曰“巳事遄往無咎也”。“酌損之”者，剛勝則柔危，以剛奉柔，初未見親也。故須酌而減損之，乃得“合志”，故曰“酌損之”。" }
      - { type: j, text: "《象》曰：“巳事遄往”，尚合志也。尚合於志，欲速往也。" }
      - { type: z, text: "正義曰：“尚合志”者，尚，庶幾也。所以竟事速往，庶幾與上合志也。" }
      - { type: j, text: "九二：利貞，徵兇。弗損，益之。柔下可全益，剛不可全削，下不可以無正。初九巳損剛以順柔，九二履中，而復損已以益柔，則剝道成焉，故不可遄往而“利貞”也。進之於柔，則兇矣，故曰“徵兇”也。故九二不損而務益，以中為志也。" }
      - { type: z, text: "正義曰：柔不可以全益，剛不可以全削，下不可以無正。初九已損剛以益柔，為順六四為初六，九二復損已以益六五為六二，則成剝卦矣。故九二利以居而守正，進之於柔則兇，故曰“利貞，徵兇”也。既徵兇，故九二不損已而務益，故曰“不損益之”也。" }
      - { type: j, text: "《象》曰：“九二利貞”，中以為志也。" }
      - { type: z, text: "正義曰：“中以為志”者，言九二所以能居而守貞，不損益之，良由居中，以中為志，故損益得其節適也。" }
      - { type: j, text: "六三：三人行則損一人，一人行則得其友。損之為道，“損下益上，其道上行”。三人，謂自六三巳上三陰也。三陰並行，以承於上，則上失其友，內無其主，名之曰“益”，其實乃“損”。故天地相應，乃得化醇；男女匹配，乃得化生。陰陽不對，生可得乎？故六三獨行，乃得其友。二陰俱行，則必疑矣。" }
      - { type: z, text: "“六三”至“得其友”。○正義曰：六三處損之時，居於下體。損之為義，“其道上行”。“三人，謂自六三巳上三陰”。上一人，謂上九也。下一人，謂六三也。夫陰陽相應，萬物化醇，男女匹配故能生育，六三應於上九，上有二陰，六四、六五也。損道上行，有相從之義。若與二陰並己俱行，雖欲益上九一人，更使上九懷疑，疑則失其適匹之義也。名之曰“益”，即不是減損，其實損之也，故曰“三人行則損一人”。若六三一人獨行，則上九納己無疑，則得其友矣，故曰：“一人行則得其友”也。" }
      - { type: j, text: "《象》曰：“一人行”，三則疑也。" }
      - { type: z, text: "正義曰：“三則疑”者，言一人則可，三人疑加疑惑也。" }
      - { type: j, text: "六四：損其疾，使遄有喜，無咎。履得其位，以柔納剛，能損其疾也。疾何可久？故速乃有喜。損疾以離其咎，有喜乃免，故使速乃有喜，有喜乃“無咎”也。" }
      - { type: z, text: "“六四”至“無咎”。○正義曰：“疾”者相思之疾也。初九自損巳遄往，已以正道速納，陰陽相會，同志斯來，無復企子之疾，故曰“損其疾”。疾何可久，速乃有喜，有喜乃無咎，故曰“使遄有喜，無咎”。○注“履得其位”至“有喜乃無咎也”。○正義曰：“速乃有喜，有喜乃無咎”者，相感而久不相會，則有勤望之憂，故“速乃有喜”。初九自損以益四，四不速納，則有失益之咎也，故曰“有喜乃無咎”也。" }
      - { type: j, text: "《象》曰：“損其疾”，亦可喜也。" }
      - { type: z, text: "正義曰：“亦可喜”者，《詩》曰：“亦既見止”，“我心則降”。不亦有喜乎？" }
      - { type: j, text: "六五：或益之，十朋之龜，弗克違，元吉。以柔居尊而為損道，江海處下，百穀歸之，履尊以損，則或益之矣。朋，黨也。龜者，決疑之物也。陰非先唱，柔非自任，尊以自居，損以守之。故人用其力，事順其功。智者慮能，明者慮策，弗能違也，則眾才之用事矣，獲益而得“十朋之龜”，足以盡天人之助也。" }
      - { type: z, text: "“六五”至“元吉”。○正義曰：六五居尊以柔而在乎損，而能自抑損者也。居尊而能自抑損，則天下莫不歸而益之，故曰“或益之”也。或者，言有也，言其不自益之，有人來益之也。朋者，黨也。龜者，決疑之物也。陰不先唱，柔不自任，“尊以自居，損以守之”，則人用其力，事竭其功，“智者慮能，明者慮策”，而不能違也。朋至不違，則群才之用盡矣，故曰“十朋之龜，弗克違”也。群才畢用，自尊委人，天人並助，故曰“元吉”。○注“以柔居尊”至“天人之助也”。○正義曰：“朋，黨也”者，馬、鄭皆案《爾雅》云：“十朋之龜者，一曰神龜，二曰靈龜，三曰攝龜，四曰寶龜，五曰文龜，六曰筮龜，七曰山龜，八曰澤龜，九曰水龜，十曰火龜。”" }
      - { type: j, text: "《象》曰：六五，“元吉”，自上祐也。" }
      - { type: z, text: "正義曰：“自上祐”者，上謂天也，故與“自天祐之，吉無不利”義同也。" }
      - { type: j, text: "上九：弗損，益之，無咎，貞吉，利有攸往。得臣無家。處損之終，上無所奉，損終反益。剛德不損，乃反益之，而不憂於咎。用正而吉，不制於柔，剛德遂長，故曰“弗損，益之，無咎，貞吉，利有攸往”也。居上乘柔，處損之極，尚夫剛德，為物所歸，故曰“得臣”。得臣則天下為一，故“無家”也。" }
      - { type: z, text: "“上九”至“得臣無家”。○正義曰：“弗損益之，無咎，貞吉”者，損之為義，“損下益上”。上九處損之極，上無所奉，損終反益，故曰“弗損益之”也。既“剛德不損，乃反益之”，則不憂於咎，“用正而吉”，故曰“無咎，貞吉”也。“利有攸往”者，不利於柔，不使三陰俱進，不疑其志，“剛德遂長”，故曰“利有攸往”也。又能自守剛陽，不為柔之所制，豈惟“無咎、貞吉”而已，所往亦無不利，故曰“利有攸往”，義兩存也。“得臣無家”者，居上乘柔，處損之極尊。夫剛德“為物所歸”，故曰“得臣”。“得臣則以天下為一”，故曰“無家”。“無家”者，光宅天下，無適一家也。" }
      - { type: j, text: "《象》曰：“弗損益之”，大得志也。" }
      - { type: z, text: "正義曰：“大得志”者，剛德不損，“為物所歸”，故“大得志也”。" }
      - { type: j, text: "震下巽上。益：利有攸往，利涉大川。" }
      - { type: z, text: "正義曰：“益”者，增足之名，損上益下，故謂之益。下巳有矣，而上更益之，明聖人利物之無巳也。損卦則損下益上，益卦則損上益下，得名皆就下而不據上者，向秀云：“明王之道，志在惠下，故取下謂之損，與下謂之益。”既上行惠下之道，利益萬物，動而無違，何往不利，故曰“利有攸往”。以益涉難，理絕險阻，故曰“利涉大川”。" }
      - { type: j, text: "《彖》曰：益，損上益下，民說無疆。震，陽也。巽，陰也。巽非違震者也。處上而巽，不違於下，“損上益下”之謂也。" }
      - { type: z, text: "正義曰：此就二體釋卦名之義。柔損在上，剛動在下，上巽不違於下，“損上益下”之義也。既居上者能自損以益下，則下民歡說，無復疆限。益卦所以名益者，正以“損上益下，民說無疆”者也。" }
      - { type: j, text: "自上下下，其道大光。“利有攸往”，中正有慶。五處中正，“自上下下”，故“有慶”也。以中正有慶之德，有攸往也，何適而不利哉！" }
      - { type: z, text: "正義曰：此就九五之爻，釋“利有攸往，中正有慶”也。五處中正，能“自上下下”，則其道光大，為天下之所慶順也。“以中正有慶之德”，故所往無不利焉。益之所以“利有攸往”者，正謂中正有慶故也。" }
      - { type: j, text: "利涉大川，木道乃行。木者，以涉大川為常而不溺者也。以益涉難，同乎“木”也。" }
      - { type: z, text: "正義曰：此取譬以釋“利涉大川”也。木體輕浮，以涉大川為常而不溺也。以益涉難，如木道之涉川。涉川無害，方見益之為利，故云“利涉大川，木道乃行”也。" }
      - { type: j, text: "益動而巽，日進無疆。天施地生，其益無方。損下益下。" }
      - { type: z, text: "正義曰：“益動而巽，日進無疆”者，自此已下，廣明益義。前則就二體明損上益下以釋卦名，以下有動求，上能巽接，是“損上益下”之義。今執二體更明得益之方也。若動而驕盈，則彼損無已。若動而卑巽，則進益無疆，故曰“益動而巽，日進無疆”。“天施地生，其益無方”者，此就天地廣明益之大義也。天施氣於地，地受氣而化生，亦是“損上益下”義也。其施化之益，無有方所，故曰“天施地生，其益無方”。" }
      - { type: j, text: "凡益之道，與時偕行。益之為用，施未足也。滿而益之，害之道也。故“凡益之道，與時偕行”也。" }
      - { type: z, text: "正義曰：雖施益無方，不可恆用，當應時行之，故舉“凡益”總結之，故曰“凡益之道，與時偕行也”。" }
      - { type: j, text: "《象》曰：風雷，益。君子以見善則遷，有過則改。遷善改過，益莫大焉。" }
      - { type: z, text: "正義曰：《子夏傳》云：“雷以動之，風以散之，萬物皆盈。”孟僖亦與此同其意。言必須雷動於前，風散於後，然後萬物皆益。如二月啟蟄之後，風以長物八月收聲之後，風以殘物。風之為益，其在雷後，故曰“風雷，益”也。遷謂遷徙慕尚，改謂改更懲止，遷善改過，益莫大焉，故君子求益，以“見善則遷，有過則改”也。六子之中，並有益物，猶取雷風者，何晏云：“取其最長可久之義也。”" }
      - { type: j, text: "初九：利用為大作，元吉，無咎。處益之初，居動之始。體夫剛德，以蒞其事而之乎巽，以斯大作，必獲大功。夫居下非“厚事”之地，在卑非任重之處，大作非小功所濟，故“元吉”，乃得“無咎”也。" }
      - { type: z, text: "正義曰：“大作”謂興作大事也。初九處益之初，居動之始，有興作大事之端，又體剛能幹，應巽不違，有堪建大功之德，故曰“利用為大作”也。然有其才而無其位，得其時而無其處，雖有殊功，人不與也。時人不與，則咎過生焉。故必“元吉”，乃得“無咎”，故曰“元吉，無咎”。" }
      - { type: j, text: "《象》曰：“元吉，無咎”，下不厚事也。時可以大作，而下不可以厚事，得其時而無其處，故“元吉”，乃得“無咎”也。" }
      - { type: z, text: "正義曰：“下不厚事”者，厚事猶大事也。" }
      - { type: j, text: "六二：或益之十朋之龜，弗克違，永貞吉。王用享於帝，吉。以柔居中，而得其位。處內履中，居益以衝。益自外來，不召自至，不先不違，則朋龜獻策，同於損卦六五之位，位不當尊故吉在“永貞”也。帝者，生物之主，興益之宗，出震而齊巽者也。六二居益之中，體柔當位，而應於巽，享帝之美，在此時也。" }
      - { type: z, text: "“六二”至“王用享於帝吉”。○正義曰：六二體柔居中，當位應巽，是居益而能用謙沖者也。居益用謙，則物“自外來”，朋龜獻策，弗能違也。同於損卦六五之位，故曰“或益之十朋之龜，弗克違”也。然位不當尊，故永貞乃吉，故曰“永貞吉”。帝，天也。王用此時，以享祭於帝，明靈降福，故曰“王用享於帝吉”也。" }
      - { type: j, text: "《象》曰：“或益之”，自外來也。" }
      - { type: z, text: "正義曰：“自外來”者，明益之者從外自來，不召而至也。" }
      - { type: j, text: "六三：益之，用凶事，無咎。有孚中行，告公用圭。以陰居陽，求益者也。故曰“益之”。益不外來，己自為之，物所不與，故在謙則戮，救兇則免。以陰居陽，處下卦之上，壯之甚也。用救衰危，物所恃也，故“用凶事”，乃得“無咎”也。若能益不為私，志在救難，壯不至亢，不失中行，以此告公，國主所任也；用圭之禮，備此道矣，故曰“有孚，中行，告公用圭”也。公者，臣之極也。凡事足以施天下，則稱王，次天下之大者，則稱公。六三之才，不足以告王，足以告公，而得用圭也。故曰“中行告公用圭”也。" }
      - { type: z, text: "“六三”至“告公用圭”。○正義曰：六三以陰居陽，不能謙退，是求益者也，故曰“益之”。“益不外來，已自為之，物所不與”。若以謙道責之，則理合誅戮。若以救兇原之，則情在可恕。然此六三，“以陰居陽，處下卦之上，壯之甚也”。用此以救衰危，則物之所恃，所以“用凶事”而得免咎，故曰“益之，用凶事，無咎”。若能求益不為私己，志在救難，為壯不至亢極，能適於時，是有信實而得中行，故曰“有孚中行”也。用此“有孚中行”之德，執圭以告於公，公必任之以救衰危之事，故曰“告公用圭”。○注“以陰居陽”至“告公用圭也”。○正義曰：告王者宜以文德燮理，使天下人寧，不當恆以救兇，用志褊狹也。" }
      - { type: j, text: "《象》曰：益“用凶事”，固有之也。用施凶事，乃得固有之也。" }
      - { type: z, text: "正義曰：“固有之”者，明其為救兇，則不可求益；施之凶事，乃得固有其功也。" }
      - { type: j, text: "六四：中行，告公從，利用為依遷國。居益之時，處巽之始，體柔當位，在上應下。卑不窮下，高不處亢，位雖不中，用“中行”者也。以斯告公，何有不從？以斯“依遷”，誰有不納也？" }
      - { type: z, text: "正義曰：六四：居益之時，處巽之始，體柔當位，在上應下，卑不窮下，高不處亢，位雖不中，用中行者也”，故曰“中行”也。以此中行之德，有事以告於公，公必從之，故曰“告公從”也。用此道以依人而遷國者，人無不納，故曰“利用為依遷國”也。遷國，國之大事，明以中行，雖有大事，而無不利，如“周之東遷晉鄭焉依”之義也。" }
      - { type: j, text: "《象》曰：“告公從”，以益志也。志得益也。" }
      - { type: z, text: "正義曰：“以益志”者，既為公所從，其志得益也。" }
      - { type: j, text: "九五：有孚惠心，勿問元吉。有孚，惠我德。得位履尊，為益之主者也。為益之大，莫大於信。為惠之大，莫大於心。因民所利而利之焉，惠而不費，惠心者也。信以惠心，盡物之願，固不待問而“元吉有孚惠我德”也。以誠惠物，物亦應之，故曰“有孚惠我德”也。" }
      - { type: z, text: "正義曰：九五得位處尊，為益之主，兼張德義，以益物者也。“為益之大，莫大於信，為惠之大，莫大於心。因民所利而利之焉，惠而不費，惠心者也”。有惠有信，盡物之願，必獲元吉，不待疑問，故曰“有孚惠心，勿問元吉”。我既以信，惠被於物，物亦以信，惠歸於我，故曰“有孚，惠我德”也。" }
      - { type: j, text: "《象》曰：“有孚惠心”，勿問之矣。“惠我德”，大得志也。" }
      - { type: z, text: "正義曰：“大得志”者，天下皆以信惠歸我，則可以得志於天下，故曰“大得志”也。" }
      - { type: j, text: "上九：莫益之，或擊之，立心勿恆，兇。處益之極，過盈者也。求益無巳，心無恆者也。無厭之求，人弗與也。獨唱莫和，是“偏辭也”。人道惡盈，怨者非一，故曰“或擊之”也。" }
      - { type: z, text: "正義曰：上九處益之極，益之過甚者也。求益無厭，怨者非一，故曰“莫益之，或擊之”也。勿猶無也，求益無己，是“立心無恆”者也。無恆之人，必兇咎之所集，故曰“立心勿恆，兇”。" }
      - { type: j, text: "《象》曰：“莫益之”，偏辭也。“或擊之”，自外來也。" }
      - { type: z, text: "正義曰：“偏辭”者，此有求而彼不應，是“偏辭也”。“自外來”者，怨者非一，不待召也，故曰“自外來也”。" }
      - { type: j, text: "上一頁 目錄頁 下一頁" }
