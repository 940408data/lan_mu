aboutHtml: |-
  <h2>關於此卷</h2>
  <p>《周易正義》為唐孔穎達等奉敕撰，以魏王弼、韓康伯注為本，兼採漢魏諸家之說，為十三經注疏之一。此卷以宋刻本版式數字重刻，半葉八行、行十六字、注文雙行二十五字。</p>
  <p>卷四收下經咸傳：咸、恆、遯、大壯、晉、明夷、家人、睽、蹇、解、損、益、夬、姤、萃、升、困、井、革、鼎二十卦，含卦辭、爻辭、彖傳、象傳，經注疏全帙。</p>
