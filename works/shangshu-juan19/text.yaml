# 尚書正義卷十九（孔穎達疏）：j 為經文＋孔安國注，z 為正義疏文。
sections:
  - id: juan19
    name: 卷十九
    blocks:
      - { type: j, text: "呂命，呂侯見命為天子司寇。穆王訓夏贖刑，呂侯以穆王命作書，訓暢夏禹贖刑之法，更從輕以佈告天下。○贖音蜀，注及下同。作《呂刑》。" }
      - { type: j, text: "呂刑後為甫侯，故或稱《甫刑》。" }
      - { type: z, text: "“呂命”至“呂刑”○正義曰：呂侯得穆王之命為天子司寇之卿，穆王於是用呂侯之言，訓暢夏禹贖刑之法。呂侯稱王之命而佈告天下。史錄其事，作《呂刑》。○傳“呂侯”至“司寇”○正義曰：呂侯得王命，必命為王官。《周禮》司寇掌刑，知呂侯見命為天子司寇。鄭玄雲：“呂侯受王命，入為三公。”引《書說》雲：“周穆王以呂侯為相。”《書說》謂《書緯·刑得放》之篇有此言也。以其言“相”，知為三公。即如鄭言，當以三公領司寇，不然，何以得專王刑也。○傳“呂侯”至“天下”○正義曰：名篇謂之《呂刑》，其經皆言“王曰”，知“呂侯以穆王命作書”也。經言陳罰贖之事，不言何代之禮，故序言“訓夏”，以明經是夏法。王者代相革易，刑罰世輕世重，殷以變夏，周又改殷。夏法行於前代，廢已久矣。今複訓暢夏禹贖刑之法，以周法傷重，更從輕以佈告天下。以其事合於當時，故孔子錄之以為法。經多說治獄之事，是訓釋申暢之也。金作贖刑，唐虞之法。《周禮》職金“掌受士之金罰、貨罰，入於司兵”，則周亦有贖刑。而遠訓夏之贖刑者，《周禮》惟言“士之金罰”，人似不得贖罪。縱使亦得贖罪，贖必異於夏法。以夏刑為輕，故祖而用之。罪實則刑之，罪疑則贖之，故當並言贖刑，非是惟訓贖罰也。《周禮》“司刑掌五刑之法，以麗萬民之罪。墨罪五百，劓罪五百，宮罪五百，刖罪五百，殺罪五百”。五刑惟有二千五百。此經“五刑之屬三千”，案刑數乃多於《周禮》，而言變從輕者，《周禮》五刑皆有五百，此則輕刑少而重刑多；此經墨、劓皆千，刖刑五百，宮刑三百，大辟二百，輕刑多而重刑少，變周用夏，是改重從輕也。然則周公聖人，相時製法而使刑罰太重，令穆王改易之者，穆王遠取夏法，殷刑必重於夏。夏承堯舜之後，民淳易治，故制刑近輕。輕則民慢，故殷刑稍重。自湯已後，世漸苛酷，紂作炮烙之刑，明知刑罰益重。周承暴虐之後，不可頓使太輕。雖減之輕，猶重於夏法。成康之間，刑措不用，下及穆王，民猶易治。故呂侯度時制宜，勸王改從夏法。聖人之法非不善也，而不以經遠。呂侯之智非能高也，而法可以適時。苟適於時，事即可為善，亦不言呂侯才高於周公，法勝於前代。所謂觀民設教，遭時制宜，刑罰所以世輕世重，為此故也。○傳“後為”至“甫刑”○正義曰：《禮記》書傳引此篇之言多稱為“《甫刑》曰”，故傳解之“後為甫侯，故或稱《甫刑》”。知“後為甫侯”者，以《詩·大雅·崧高》之篇宣王之詩，雲“生甫及申”；《揚之水》為平王之詩，雲“不與我戍甫”，明子孫改封為甫侯。不知因呂國改作甫名？不知別封餘國而為甫號？然子孫封甫，穆王時未有甫名而稱為《甫刑》者，後人以子孫之國號名之也。猶若叔虞初封於唐，子孫封晉，而《史記》稱《晉世家》。然宣王以後，改呂為甫，《鄭語》史伯之言幽王之時也，乃雲“申呂雖衰，齊許猶在”，仍得有呂者，以彼史伯論四嶽治水，其齊、許、申、呂是其後也。因上“申呂”之文而云“申呂雖衰”，呂即甫也。" }
      - { type: j, text: "惟呂命，王享國百年，耄荒，言呂侯見命為卿，時穆王以享國百年，耄亂荒忽。穆王即位過四十矣，言百年，大其雖老而能用賢以揚名。○耄，本亦作{蒿毛}，毛報反，《切韻》莫報反。度作刑以詰四方。度時世所宜，訓作贖刑，以治天下四方之民。○度，待洛反。注同，馬如字，雲：“法度也。”詰，起一反。" }
      - { type: z, text: "“惟呂”至“四方”○正義曰：惟呂侯見命為卿，於時穆王享有周國已積百年，王精神耄亂而荒忽矣。王雖老耄，猶能用賢，取呂侯之言，度時世所宜，作夏贖刑以治天下四方之民也。○傳“言呂”至“揚名”○正義曰：史述呂侯見命而記王年，知其得命之時王已享國百年也。《曲禮》雲：“八十九十曰耄。”是“耄荒”為年老精神耄亂荒忽也。穆王即位之時，已年過四十矣，比至命呂侯之年，未必已有百年。言“百年”者，美大其事，雖則年老而能用賢以揚名，故記其百年之耄荒也。《周本紀》雲：“甫侯言於王，作脩刑辟。”是脩刑法者皆呂侯之意，美王能用之。穆王即位過四十者，不知出何書也。《周本紀》雲：“穆王即位，春秋已五十矣”，“立五十五年崩”。司馬遷若在孔後，或當各有所據。《無逸》篇言殷之三王及文王享國若干年者，皆謂在位之年。此言“享國百年”，乃從生年而數，意在美王年老能用賢，而言其長壽，故舉從生之年，以“耄荒”接之，美其老之意也。文不害意，不與彼同。" }
      - { type: j, text: "王曰：“若古有訓，蚩尢惟始作亂，延及於平民，順古有遺訓，言蚩尤造始作亂，惡化相易，延及於平善之人。九黎之君號曰蚩尢。○蚩，尺之反；尤，有牛反；馬雲：“少昊之末九黎君名。”罔不寇賊鴟義，奸宄奪攘矯虔。平民化之，無不相寇賊，為鴟梟之義。以相奪攘，矯稱上命，若固有之。亂之甚。○鴟，尺之反；鴟梟，惡鳥；馬雲：“鴟，輕也。”義，本亦作誼。宄音軌。攘，如羊反。矯，居表反。虔，其然反。苗民弗用靈，制以刑，惟作五虐之刑曰法。三苗之君習蚩尢之惡，不用善化民，而制以重刑。惟為五虐之刑，自謂得法。蚩尢黃帝所滅，三苗帝堯所誅，言異世而同惡。殺戮無辜，爰始淫為劓、刵、椓、黥。三苗之主，頑兇若民，敢行虐刑，以殺戮無罪，於是始大為截人耳鼻，椓陰，黥面，以加無辜，故曰“五虐”。○劓，魚器反。刵，徐如志反。椓，丁角反。黥，其京反。越茲麗刑並制，罔差有辭。苗民於此施刑，並制無罪，無差有直辭者。言淫濫。○麗，力馳反。並，必政反。民興胥漸，泯泯棼棼，罔中於信，以覆詛盟。三苗之民瀆於亂政，起相漸化，泯泯為亂，棼棼同惡，皆無中於信義，以反背詛盟之約。○泯，面忍反，徐音民。棼，芳雲反，徐扶雲反。覆，芳服反，徐敷目反。詛，側助反。背音佩。約如字，又於妙反。虐威庶戮，方告無辜於上。上帝監民，罔有馨香，德刑發聞惟腥。三苗虐政作威，眾被戮者方方各告無罪於天，天視苗民無有馨香之行，其所以為德刑，發聞惟乃腥臭。○聞音問，又如字，注同。腥音星。行，下孟反。皇帝哀矜庶戮之不辜，報虐以威，遏絕苗民，無世在下。皇帝，帝堯也。哀矜眾被戮者之不辜，乃報為虐者以威，誅遏絕苗民，使無世位在下國也。○君帝，君宜作皇字，帝堯也。遏，於葛反。" }
      - { type: z, text: "“王曰”至“在下”正義曰：呂侯進言於王，使用輕刑。又稱王之言以告天下，說重刑害民之義。王曰：“順古道有遺餘典訓，記法古人之事。昔炎帝之末，有九黎之國君號蚩尢者，惟造始作亂，惡化遞相染易，延及末平善之民。平民化之，亦變為惡，無有不相寇盜，相賊害，為鴟梟之義。鈔掠良善，外奸內宄，劫奪人物，攘竊人財，矯稱上命，以取人財，若己固自有之。然蚩尢之惡已如此矣，至於高辛氏之末，又有三苗之國君，習蚩尢之惡，不肯用善化民，而更制重法。惟作五虐之刑，乃言曰此得法也。殺戮無罪之人，於是始大為四種之刑。刵，截人耳。劓，截人鼻。劅，椓人陰。黥，割人面。苗民於此施刑之時，並制無罪之人。對獄有罪者無辭，無罪者有辭，苗民斷獄，並皆罪之，無差簡有直辭者。言濫及無罪者也。三苗之民，慣瀆亂政，起相漸染，皆化為惡。泯泯為亂，棼棼同惡，小大為惡。民皆巧詐，無有中於信義。以此無中於信，反背詛盟之約，雖有要約，皆違背之。三苗虐政作威，眾被戮者方方各告無罪於上天。上天下視苗民，無有馨香之行。其所以為德刑者，發聞於外，惟乃皆腥臭，無馨香也。君帝帝堯哀矜眾被殺戮者，不以其罪，乃報為暴虐者以威，止絕苗民，使無世位在於下國。”言以刑虐，故滅之也。○傳“順古”至“蚩尢”○正義曰：古有遺訓，順而言之，故為“順古有遺訓”也。“蚩尢造始作亂”，其事往前未有，蚩尢今始造之，必是亂民之事，不知造何事也。下說三苗之主習蚩尢之惡，作五虐之刑，此章主說虐刑之事，蚩尢所作，必亦造虐刑也。以峻法治民，民不堪命，故惡化轉相染易，延及於平善之民，亦化為惡也。“九黎之君號曰蚩尢”，當有舊說云然，不知出何書也。《史記·五帝本紀》雲：“神農氏世衰，諸侯相侵伐，蚩尢最為暴虐，莫能伐之。黃帝乃徵師諸侯，與蚩尢戰於涿鹿之野，遂擒殺蚩尢，而諸侯鹹尊軒轅為天子。”如《本紀》之言，蚩尢是炎帝之末諸侯名也。應劭雲：“蚩尢，古天子。”鄭雲：“蚩尢霸天下，黃帝所伐者。”《漢書音義》有臣瓚者，引《孔子三朝記》雲：“蚩尢，庶人之貪者。”諸說不同，未知蚩尢是何人也。《楚語》曰：“少昊氏之衰也，九黎亂德，顓頊受之，使復舊常。”則九黎在少昊之末，非蚩尢也。韋昭雲：“九黎氏九人，蚩尢之徒也。”韋昭雖以九黎為蚩尢，要《史記》蚩尢在炎帝之末，《國語》九黎在少昊之末，二者不得同也。“九黎”之文惟出楚語，孔以蚩尢為九黎。下傳又云：“蚩尢黃帝所滅”，言“黃帝所滅”，則與《史記》同矣。孔非不見《楚語》，而為此說，蓋以蚩尢是九黎之君，黃帝雖滅蚩尢，猶有種類尚在，故下至少昊之末，更復作亂。若其不然，孔意不可知也。鄭玄雲：“學蚩尢為亂者，九黎之君，在少昊之代也。”其意以蚩尢當炎帝之末，九黎當少昊之末，九黎學蚩尢，九黎非蚩尢也。○傳“平民”至“之甚”○正義曰：蚩尢作亂，當是作重刑以亂民。以峻法酷刑，民無所措手足，困於苛虐所酷，人皆苛且，故平民化之，無有不相寇賊。群行攻劫曰“寇”，殺人曰“賊”，言攻殺人以求財也。“鴟梟”，貪殘之鳥。《詩》雲：“為梟為鴟。”梟是鴟類。鄭玄雲：“盜賊狀如鴟梟，鈔掠良善，劫奪人物。”傳言“鴟梟之義”，如鄭說也。《釋詁》雲：“虔，固也”。“若固有之”，言取得人物，如己自有也。○傳“三苗”至“同惡”○正義曰：上說蚩尢之惡，即以“苗民”繼之，知經意言“三苗之君習蚩尢之惡”。“靈”，善也。不用善化民，而制以重刑。學蚩尢制之，用五刑而虐為之，故為“五虐之刑”，不必皋陶五刑之外，別有五也。“曰法”者，述苗民之語，自謂所作得法，欲民行而畏之。如《史記》之文，蚩尢黃帝所滅，下句所說“三苗帝堯所誅”，《楚語》雲“三苗復九黎之惡”，是“異世而同惡”也。鄭玄以為“苗民即九黎之後。顓頊誅九黎，至其子孫為三國。高辛之衰，又復九黎之惡。堯興，又誅之。堯末，又在朝，舜臣堯又竄之。後禹攝位，又在洞庭逆命，禹又誅之。穆王深惡此族三生凶德，故著其惡而謂之民”。孔惟言“異世同惡”，不言三苗是蚩尢之子孫。韋昭雲：“三苗，炎帝之後諸侯共工也。”○傳“三苗”至“五虐”○正義曰：三苗之主，實國君也。頑兇若民，故謂之“苗民”。不於上經為傳者，就此惡行解之，以其頑兇，敢行虐刑，以殺戮無罪。《釋詁》雲：“淫，大也。”“於是大為截人耳鼻，椓陰，黥面”，苗民為此刑也。“椓陰”即宮刑也。“黥面”即墨刑也。《康誥》周公戒康叔雲“無或劓刵人”，即周世有劓刵之刑，非苗民別造此刑也。以加無辜，故曰“五虐”。鄭玄雲：“刵，斷耳。劓，截鼻。椓謂椓破陰，黥為羈黥人面。苗民大為此四刑者，言其特深刻，異於皋陶之為。”鄭意蓋謂截耳截鼻多截之，椓陰苦於去勢，黥面甚於墨頟，孔意或亦然也。○傳“三苗”至“之約”○正義曰：“三苗之民”，謂三苗國內之民也。“瀆”謂慣瀆，苗君久行虐刑，民慣見亂政，習以為常，起相漸化。“泯泯”，相似之意。“棼棼”，擾攘之狀。“泯泯為亂”，習為亂也。“棼棼同惡”，共為惡也。“中”猶當也，“皆無中於信義”，言為行無與信義合者。《詩》雲：“君子屢盟，亂是用長。”亂世之民，多相盟詛，既無信義，必皆違之，以此無中於信，反背詛盟之約也。○傳“三苗”至“腥臭”○正義曰：“方方各告無罪於上天”，言其處處告也。天矜於下，俯視苗民，無有馨香之行。“馨香”以喻善也。“其所以為德刑”，苗民自謂是德刑者，發聞於外，惟乃皆是腥臭。“腥臭”喻惡也。○傳“君帝”至“下國”○正義曰：《釋詁》雲：“皇，君也。”此言“遏絕苗民”，下句即雲“乃命重黎”，重黎是帝堯之事，知此滅苗民亦帝堯也。此滅苗民在堯之初興，使無世位在於下國，而堯之末年，又有竄三苗者，禮天子不滅國，擇立其次賢者。此為五虐之君，自無世位在下，其改立者復得在朝。但此族數生凶德，故歷代每被誅耳。" }
      - { type: j, text: "乃命重黎，絕地天通，罔有降格。重即羲，黎即和。堯命義和世掌天地四時之官，使人神不擾，各得其序，是謂絕地天通。言天神無有降地，地民不至於天，明不相干。○重，直龍反。黎，力兮反。群后之逮在下，明明棐常，鰥寡無蓋。群后諸侯之逮在下國，皆以明明大道輔行常法，故使鰥寡得所，無有掩蓋。○棐音匪，又芳鬼反。鰥，居頑反。皇帝清問下民，鰥寡有辭於苗。帝堯詳問民患，皆有辭怨於苗民。○清問，馬雲：“清，訊。”德威惟畏，德明惟明。言堯監苗民之見怨，則又增修其德，行威則民畏服，明賢則德明人，所以無能名焉。" }
      - { type: z, text: "“乃命”至“推明”○正義曰：三苗亂德，民神雜擾。帝堯既誅苗民，乃命重黎二氏，使絕天地相通，令民神不雜。於是天神無有下至地，地民無有上至天，言天神地民不相雜也。群后諸侯相與在下國，群臣皆以明明大道輔行常法，鰥寡皆得其所，無有掩蓋之者。君帝帝堯清審詳問下民所患，鰥寡皆有辭怨於苗民。言誅之合民意。堯視苗民見怨，則又增修其德。以德行威，則民畏之，不敢為非。以德明人，人皆勉力自修，使德明。言堯所行賞罰得其所也。○傳“重即”至“相干”○正義曰：《楚語》雲：“宅王問於觀射父曰：‘《周書》所謂重黎實使天地不通者，何也？若無然，民將能登天乎？’對曰：‘非此之謂也。古者民神不雜。少昊氏之衰也，九黎亂德，家為巫史，民神同位，禍災荐臻。顓頊受之，乃命南正重司天以屬神，命火正黎司地以屬民，使復舊常，無相侵瀆，是謂絕地天通。其後三苗復九黎之德，堯復育重黎之後，不忘舊者，使復典之。’”彼言主說此事，而《堯典》雲“乃命羲和，欽若昊天”，即所謂育重黎之後，使典之也。以此知“重即羲”也，“黎即和”也。言羲是重之子孫，和是黎之子孫，能不忘祖之舊業，故以“重黎”言之。傳言“堯乃命羲和掌天地四時之官”，《堯典》文也。“民神不擾，是謂絕地天通”，《楚語》文也。孔惟加“各得其序”一句耳。《楚語》又云，司天屬神，司地屬民。令神與天在上，民與地在下，定上下之分，使民神不雜，則祭享有度，災厲不生。經言民神分別之意，故言“罔有降格”。言天神無有降至於地者，謂神不幹民。孔因互文雲地民不有上至於天者，言民不幹神也。乃總之雲“明不相干”，即是民神不雜也。“地民”或作“地祇”。學者多聞神祇，又“民”字似“祇”，因妄改使謬耳。如《楚語》雲“乃命重黎”，是顓頊命之。鄭玄以“‘皇帝哀矜庶戮之不辜’至‘罔有降格’，皆說顓頊之事。乃命重黎即是命重黎之身，非羲和也。‘皇帝清問’以下乃說堯事。顓頊與堯再誅苗民，故上言‘遏絕苗民’，下雲‘有辭於苗’，異代別時，非一事也”。案《楚語》雲“少昊氏之衰也，九黎亂德”，又云“其後三苗復九黎之德”，則“九黎”、“三苗”非一物也。顓頊誅九黎謂之“遏絕苗民”，於鄭義為不愜。《楚語》言顓頊命重黎，解為帝堯命羲和，於孔說又未允，不知二者誰得經意也。○傳“言堯”至“名焉”○正義曰：此經二句說帝堯之德事也，而其言不順。文在“苗民”之下，故傳以為“堯監苗民之見怨，則又增修其德”，敦德以臨之，以德行其威罰，則民畏之而不敢為非。“明賢則德明人”者，若凡人雖欲以德明賢者，不能照察。今堯德明賢者，則能以德明識賢人，故皆勸慕為善。明與上句相互，則“德威”者，凡人雖欲以德行威，不能威肅。今堯行威罰，則能以德威罰罪人，故人皆畏威服德也。" }
      - { type: j, text: "乃命三後，恤功於民。伯夷降典，折民惟刑。禹平水土，主名山川。稷降播種，農殖嘉穀。伯夷下典禮教民而斷以法。禹治洪水，山川無名者主名之。后稷下教民播種，農畝生善穀。所謂堯命三君，憂功於民。○折，之設反，下同；馬、鄭、王皆音悊，馬雲：“智也。”種音章用反。殖，承力反。斷，丁亂反，下同。三後成功，惟殷於民。各成其功，惟所以殷盛於民。言禮教備，衣食足。士制百姓於刑之中，以教祇德。言伯夷道民典禮，斷之以法。皋陶作士，制百官於刑之中，助成道化，以教民為敬德。○祇，止而反。" }
      - { type: z, text: "“乃命”至“祇德”○正義曰：堯既誅苗民，乃命三君伯、夷、禹、稷憂施功於民。使伯夷下禮典教民，折斷下民，惟以典法。伯禹身平治水土，主名天下山川，其無名者皆與作名。后稷下教民布種，在於農畝種殖嘉。穀三君者各成其功，惟以殷盛於民，使民衣食充足。乃使士官制御百官之姓於刑之中正，以教民為敬德。言先以禮法化民，民既富而後教之，非苟欲刑殺也。○傳“伯夷”至“於民”○正義曰：伯夷與稷言“降”，禹不言“降”，“降”可知降下也，從上而下於民也。《舜典》伯夷主禮典，“教民而斷以法”，即《論語》所謂“齊之以禮”也。山川與天地並生，民應先與作名。但禹治水，萬事改新，古老既死，其名或滅。故當時無名者，禹皆主名之。言此者，以見禹治山川，為民於此耕稼故也。此三事者皆是為民，故傳既解三事，乃結上句，此即“所謂堯命三君，憂功於民”，憂欲與民施功也。此三事之次，當禹功在先。先治水土，乃得種穀。民得穀食，乃能行禮。《管子》雲：“衣食足，知榮辱。倉稟實，知禮節。”是言足食足衣然後行禮也。此經先言“伯夷”者，以民為國之本，禮是民之所急，將言制刑，先言用禮，刑禮相須，重禮，故先言之也。○傳“言伯”至“敬德”○正義曰：此經大意，言禹、稷教民，使衣食充足。伯夷道民，使知禮節，有不從教者，乃以刑威之。故先言三君之功，乃說用刑之事。言禹、稷教民稼穡，衣食既已充足。伯夷道民典禮，又能折之以法。禮法既行，乃使皋陶作士，制百官於刑之中。令百官用刑，皆得中正，使不僣不濫，不輕不重，助成道化，以教民為敬德。言從伯夷之法，敬德行禮也。" }
      - { type: j, text: "穆穆在上，明明在下，灼於四方，罔不惟德之勤。堯躬行敬敬在上，三後之徒秉明德明君道於下，灼然彰著四方，故天下之士無不惟德之勤。故乃明於刑之中，率乂於民棐彝。天下皆勤立德，故乃能明於用刑之中正，循道以治於民，輔成常教。○治，直吏反。" }
      - { type: z, text: "“穆穆”至“棐彝”○正義曰：言堯躬行敬敬之道在於上位，三後之徒躬秉明德明君道在於下，君臣敬明與德，灼然著於四方，故天下之事無不惟德之勤，悉皆勤行德矣。天下之士皆勤立德，故乃能明於用刑之中正，循大道以治於民，輔成常教。美堯君臣明德，能用刑得中以輔禮教。○傳“堯躬”至“之勤”○正義曰：《釋訓》雲：“穆穆，敬也。”“明明”重明，則“穆穆”重敬，當敬天敬民，在於上位也。“明明在下”，則是臣事，知是“三後之徒秉明德明君道於下”也。彰著於四方，四方皆法效之，故天下之士無不惟德之勤。○傳“天下”至“常教”○正義曰：刑者所以助教而不可專用，非是身有明德，則不能用刑。以天下之大，萬方之眾，必當盡能用刑，天下乃治。此美堯能使“天下皆勤立德，故乃能明於用刑之中正”，言天下皆能用刑，盡得中正，循治民之道以治於民，輔成常教。伯夷所典之禮，是常行之教也。" }
      - { type: j, text: "典獄，非訖於威，惟訖於富。言堯時主獄，有威有德有恕，非絕於威，惟絕於富。世治，貨賂不行。○賂，來故反。敬忌，罔有擇言在身。堯時典獄皆能敬其職，忌其過，故無有可擇之言在其身。惟克天德，自作元命，配享在下。”凡明於刑之中，無擇言在身，必是惟能天德，自為大命，配享天意，在於天下。" }
      - { type: z, text: "“典獄”至“在下”○正義曰：堯時典獄之官，非能止絕於威，有犯必當行威，威刑不可止也。惟能止絕於富，受貨然後得富，無貨富自絕矣。言於時世治，貨賂不行。堯時典獄之官皆能敬其職事，忌其過失，無有可釋之言在於其身。天德平均，惟能為天之德。志性平均，自為長久大命。配當天意，在於天下。言堯德化之深，於時典獄之官皆能賢也。○傳“言堯”至“不行”○正義曰：堯時主獄之官，有威嚴，有德行，有恕心。有犯罪必罪之，是“有威”也。無罪則赦之，是“有德”也。有威有德有恕心，行之不受貨賂，是恕心也。“訖”是盡也，故傳以“訖”為絕。不可能使民不犯，非絕於威。能使不受貨賂，惟絕於富。言以恕心行之，世治則貨賂不行，故獄官無得富者。○得凡明”至“天下”○正義曰：“惟克天德”，言能效天為德，當謂天德平均，獄官效天為平均。凡能明於刑之中正矣，又能使無可擇之言在身者，此人必是惟能為天平均之德，斷獄必平矣。“皇天無親，惟德是輔”，若能斷獄平均者，必壽長久大命。大命由己而來，是“自為大命”。“享”訓當也，是此人能配當天命，在於天之下。鄭雲：“大命謂延期長久也。”" }
      - { type: j, text: "王曰：“嗟！四方司政典獄，非爾惟作天牧？主政典獄，謂諸侯也。非汝惟為天牧民乎？言任重是汝。○為，於偽反。任，而鴆反。重，輕重之重。今爾何監，非時伯夷播刑之迪？言當視是伯夷布刑之道而法之。其今爾何懲？惟時苗民匪察於獄之麗。其今汝何懲戒乎？所懲戒惟是苗民非察於獄之施刑，以取滅亡。○麗，力馳反。罔擇吉人，觀於五刑之中，惟時庶威奪貨，言苗民無肯選擇善人，使觀視五刑之中正，惟是眾為威虐者任之，以奪取人貨，所以為亂。斷制五刑，以亂無辜。上帝不蠲，降咎於苗。苗民任奪貨奸人，斷制五刑，以亂加無罪。天不潔其所為，故下咎罪。謂誅之。○蠲，吉緣反。咎，其九反。苗民無辭於罰，乃絕厥世。”言罪重，無以辭於天罰，故堯絕其世。申言之為至戒。" }
      - { type: z, text: "“王曰”至“厥世”○正義曰：王呼諸侯戒之曰：“諮嗟！汝四方主政事典獄訟者諸侯之君等，非汝惟為天牧養民乎？”言汝等皆為天養民，言任重也。“受任既重，當觀古成敗，今汝何所監視乎？其所視者，非是伯夷布刑之道也”。言當效伯夷善布刑法，受令名也。“其今汝何所懲創乎？其所創者惟是苗民非察於獄之施刑乎？”言當創苗民施刑不當取滅亡也。“彼苗民之為政也，無肯選擇善人，使觀視於五刑之中正，惟是眾為威虐者任之，以奪取人之貨賂，任用此人，使斷制五刑，以亂加無罪之人。上天不絜其所為，故下咎惡於苗民。苗民無以辭於天罰，堯乃絕滅其世。汝等安得不懲創乎！”○傳“言當”至“法之”○正義曰：伯夷典禮，皋陶主刑，刑禮相成以為治。不使視皋陶而令視伯夷者，欲其先禮而後刑。道之以禮，禮不從乃刑之，則刑亦伯夷之所布，故令視伯夷布刑之道而法之。王肅雲：“伯夷道之以禮，齊之以刑。”○傳“其今”至“滅亡”○正義曰：上言“非時”，此言“惟時”，文異者，“非時”者言豈非是事也，“惟時”者言惟當是事也，雖文異而意同。“惟是苗民非察於獄之施刑以取滅亡”也，言其正謂察於獄之施刑不當於罪以取滅亡。○傳“苗民”至“誅之”○正義曰：“以亂加無罪”者，正謂以罪加無罪，是亂也。“蠲”訓絜也。“天不絜其所為”者，鄭玄雲：“天以苗民所行腥臊不絜，故下禍誅之。”" }
      - { type: j, text: "王曰：“嗚呼！念之哉！念以伯夷為法，苗民為戒。伯父、伯兄、仲叔、季弟、幼子、童孫，皆聽朕言，庶有格命。皆石同姓，有父兄弟子孫。列者伯仲叔季，順少長也。舉同姓包異姓，言不殊也。聽從我言，庶幾有至命。○聽如字，又他經反。少，詩照反。長，丁丈反。今爾罔不由慰日勤，爾罔或戒不勤。今汝無不用安自居，日當勤之。汝無有徒念戒而不勤。○日，人實反，一音曰。天齊於民，俾我一日，非終惟終在人。天整齊於下民，使我為之，一日所行，非為天所終，惟為天所終，在人所行。○天齊於民，絕句。馬雲：“齊，中也。”俾我，絕句。俾，必爾反，馬本作矜；矜，哀也。爾尚敬逆天命，以奉我一人。雖畏勿畏，雖休勿休，汝當庶幾敬逆天命，以奉我一人之戒。行事雖見畏，勿自謂可敬畏。雖見美，勿自謂有德美。惟敬五刑，以成三德。一人有慶，兆民賴之，其寧惟永。”先戒以勞謙之德，次教以惟敬五刑，所以成剛柔正直之三德也。天子有善，則兆民賴之，其乃安寧長久之道。" }
      - { type: z, text: "“王曰”至“惟永”○正義曰：王言而歎曰：“嗚呼！汝等諸侯其當念之哉！”念以伯夷為法，苗民為戒。既令念此法戒，又呼同姓諸侯曰：“伯父、伯兄、仲叔、季弟、幼子、童孫等，汝皆聽從我言，依行用之，庶幾有至善之命，命必長壽也。今汝等諸侯無不用安道以自居，曰我當勤之哉。汝已許自勤，即當必勤，汝無有徒念我戒，許欲自勤而身竟不勤。”戒使必自勤也。“上天欲整齊於下民，使我為之令，我為天子整齊下民也。我一日所行失其道，非為天所終。一日所行得其理，惟為天所終。此事皆在人所行”。言已當慎行以順天也。“我已冀欲順天，汝等當庶幾敬逆天命，以奉用我一人之戒。汝所行事，雖見畏，勿自謂可敬畏。雖見美，勿自謂有德美”。欲令其謙而勿自取也。“汝等惟當敬慎用此五刑，以成剛柔正直之三德，以輔我天子。我天子一人有善事，則億兆之民蒙賴之。若能如此，其乃安寧，惟久長之道也”。○傳“皆王”至“至命”○正義曰：此總告諸侯，不獨告同姓，知“舉同姓包異姓”也。“格”訓至也，言庶幾有至命。“至命”當謂至善之命，不知是何命也。鄭玄雲：“格，登也。登命謂壽考者。”傳雲“至命”亦謂壽考。○傳“今汝”至“不勤”○正義曰：“由”，用也。“慰”，安也。人之行事多有始無終，從而不改。王既殷勤教誨，恐其知而不行，或當曰欲勤行而中道倦怠，故以此言戒之。今汝等諸侯無不用安道以自居，言曰我當勤之。“安道”者，謂勤其職，是安之道。若不勤其職，是危之道也。○傳“天整”至“所行”○正義曰：“天整齊於下民”者，欲使之順道依理，以性命自終也。以民不能自治，故使我為之，使我為天子。我既受天委付，務欲稱天之心。墜失天命，是不為天所終。保全祿位，是為天所終。我一日所行善之與惡，非為天所終，惟為天所終，皆在人所行。王言已冀欲使為行稱天意也。○傳“汝當”至“德美”○正義曰：“逆”，迎也。上天授人為主，是下天命也。諸侯上輔天子，是逆天命也，言與天意相迎逆也。“汝當庶幾敬逆天命，以奉我一人之戒”，欲使之順天意而用己命。凡人被人畏，必當自謂己有可畏敬；被人譽，必自謂已實有德美。故戒之，汝等所行事，雖見畏，勿自謂可敬畏；雖見美，勿自謂有德美。教之令謙而不自恃也。○傳“先戒”至“之道”○正義曰：上句“雖畏勿畏，雖休勿休”，是“先戒以勞謙之德”也。“勞謙”，《易·謙卦》九三爻辭。謙則心勞，故云“勞謙”。天子有善，以善事教天下，則兆民蒙賴之。" }
      - { type: j, text: "王曰：“籲！來，有邦有土，告爾祥刑。籲，歎也。有國土諸侯，告汝以善用刑之道。○籲，況於反，馬作於；於，於也。在今爾安百姓，何擇非人？何敬非刑？何度非及？在今爾安百姓兆民之道，當何所擇？非惟吉人乎？當何所敬？非惟五刑乎？當何所度？非惟及世輕重所宜乎？○度，待洛反，注同，馬雲：“造謀也。”兩造具備，師聽五辭。兩謂囚、證。造，至也。兩至具備，則眾獄官共聽其入五刑之辭。○造，七報反，注同。五辭簡孚，正於五刑。五辭簡核，信有罪驗，則正之於五刑。○核，幸革反。五刑不簡，正於五罰。不簡核，謂不應五刑。當正五罰，出金贖罪。○應，應對之應，下同。五罰不服，正於五過。不服，不應罰也。正於五過，從赦免。五過之疵：惟官，惟反，惟內，惟貨，惟來。五過之所病，或嘗同官位，或詐反囚辭，或內親用事，或行貨枉法，或舊相往來，皆病所在。○疵，才斯反。來，馬本作求，雲：“有求，請賕也。”其罪惟均，其審克之。以病所在，出入人罪，使在五過，罪與犯法者同。其當清察，能使之不行。五刑之疑有赦，五罰之疑有赦，其審克之。刑疑赦從罰，罰疑赦從免。其當清察，能得其理。簡孚有眾，惟貌有稽。簡核誠信，有合眾心。惟察其貌，有所考合，重刑之至。無簡不聽，具嚴天威。無簡核誠信，不聽理具獄，皆當嚴敬天威，無輕用刑。墨闢疑赦，其罰百釒爰，閱實其罪。刻其顙而之曰墨刑，疑則赦從罰。六兩曰釒爰。釒爰，黃鐵也。閱實其罪，使與罰名相當。○闢，婢亦反。釒爰，徐戶關反，六兩也。鄭及《爾雅》同。《說文》雲：“六鋝也。”“鋝，十一銖二十五分述之十三也。”馬同，又云：“賈逵說俗儒以鋝重六兩，《周官》劍重九鋝，俗儒近是。”閱音悅。顙，素黨反。，乃結反。劓闢疑赦，其罰惟倍，閱實其罪。截鼻曰劓。刑倍百為二百釒爰。剕闢疑赦，其罰倍差，閱實其罪。刖足曰剕。倍差謂倍之又半，為五百釒爰。宮闢疑赦，其罰六百釒爰，閱實其罪。宮，淫刑也。男子割勢，婦人幽閉，次死之刑。序五刑，先輕轉至重者，事之宜。大辟疑赦，其罰千釒爰，閱實其罪。死刑也。五刑疑各入罰，不降相因，古之制也。墨罰之屬千，劓罰之屬千，剕罰之屬五百，宮罰之屬三百，大辟之罰其屬二百。五刑之屬三千。別言罰屬，合言刑屬，明刑罰同屬，互見其義以相備。○見，賢遍反。" }
      - { type: z, text: "“王曰”至“天威”○正義曰：凡與人言，必呼使來前。“籲”，歎聲也。王歎而呼諸侯曰：“籲！來，有邦國、有土地諸侯國君等，告汝以善用刑之道。在於今日，汝安百姓兆民之道，何所選擇？非惟選擇善人乎？何所敬慎？非惟敬慎五刑乎？何所謀度？非惟度及世之用刑輕重所宜乎”即教諸侯以斷獄之法。“凡斷獄者，必令囚之與證兩皆來至。囚證具備，取其言語，乃與眾獄官共聽其入五刑之辭。其五刑之辭簡核，信實有罪，則正之於五刑，以五刑之罪罪其身也。五刑之辭不如眾所簡核，不合入五刑，則正之於五罰。罰謂其取贖也。於五罰論之，又有辭不服，則正之於五過，過失可宥，則教宥之。從刑入罰，從罰入過。此五過之所病者，惟嘗同官位，惟詐反囚辭，惟內親用事，惟行貨枉法，惟舊相往來。以此五病出入人罪，其罪與犯法者均。其當清證審察，能使五者不行，乃為能耳。五刑之疑有赦，赦從罰也。五罰之疑有赦，赦從過也，過則赦之矣。其當清證審察使能之，勿使妄入人罪，妄得赦免。既得囚辭，簡核誠信，有合眾心。或記可刑，或皆可放，雖雲合罪，惟更審察其貌，有所考合”。謂貌又當罪，乃決斷之。“無簡不聽”者，謂雖似罪狀，無可簡核誠信合罪者，則不聽理其獄，當放赦之。皆當嚴敬天威，勿輕聽用刑也。○傳“在今”至“宜乎”○正義曰：“何度非及”，其言不明。以論刑事，而言度所及，知所度者，度及世之用刑輕重所宜。王肅雲：“度，謀也。非當與主獄者謀慮刑事，度世輕重所宜也。”○傳“兩謂”至“之辭”○正義曰：“兩”謂兩人，謂囚與證也。凡競獄必有兩人為敵，各言有辭理。或時兩皆須證，則囚之與證非徒兩人而已。兩人謂囚與證，不為兩敵至者，將斷其罪，必須得證，兩敵同時在官，不須待至；且兩人競理，或並皆為囚，各自須證，故以“兩”為囚與證也。兩至具備，謂囚證具足。各得其辭，乃據辭定罪。與眾獄官共聽其辭，觀其犯狀，斟酌入罪，或入墨劓，或入宮剕，故云“聽其入五刑之辭”也。○傳“五辭”至“五刑”○正義曰：既得囚證將入五刑之辭，更復簡練核實，知其信有罪狀，與刑書正同，則依刑書斷之，應墨者墨之，應殺者殺之。○傳“不簡”至“贖罪”○正義曰：“不簡核”者謂覆審囚證之辭，不如簡核之狀。既囚與證辭不相符合，則是犯狀不定，謂“不應五刑”。不與五刑書同，獄官疑不能決，則當正之於五罰，令其出金贖罪。依準五刑，疑則從罰，故為“五罰”，即下文是也。今律：“疑罪各依所犯以贖。”論虛實之證，等是非之理，均或事涉疑似，旁無證見，或雖有證見，事非疑似，如此者皆為疑罪。○傳“不服”至“赦免”○正義曰：“不服，不應罰”者，欲令贖罪，而其人不服，獄官重加簡核，無復疑似之狀，本情非罪，不可強遣出金，如是者則正之於五過。雖事涉疑似有罪，乃是過失，過則可原，故從赦免。下文惟有“五刑”、“五罰”而無“五過”，亦稱“五”者，緣五罰為過，故謂之“五過”。五者之過，皆可原也。○傳“五過”至“所在”○正義曰：《釋詁》雲：“疵，病也。”此五過之所病，皆謂獄吏故出入人罪，應刑不刑，應罰不罰，致之五過而赦免之，故指言“五過之疵”。於五刑五罰，不赦其罪，未有此病，故不言“五刑之疵”、“五罰之疵”。應刑而罰，亦是其病，於赦免言病，則赦刑從罰亦是病可知。損害王道，於政為病，故謂之“病”。“惟官”謂嘗同官位，與吏舊同僚也。“或詐反囚辭”，拒諱實情，不承服也。“或內親用事”，囚有親戒在官吏，或望其意而曲筆也。或行貨於吏，吏受財枉法也。或囚與吏舊相往來。此五事皆是病之所在。五事皆是枉法，但枉法多是為貨，故於“貨”言“枉”，餘皆枉可知。○傳“以病”至“不行”○正義曰：以五病所在，出入人罪，不罰不刑使得在於五過，妄赦免之，此獄吏之罪與犯法者同。諸侯國君清證審察，能使之不行，乃為善也。此以病所在，惟出人罪耳，而傳並言“入”者，有罪而妄出與無罪而妄入，獄吏之罪等，故以“出入”言之。今律：“故出入者與同罪。”而此是也。○傳“刑疑”至“其理”○正義曰：刑疑有赦，赦從罰也。罰疑有赦，赦從免也。上雲“五罰不服，正於五過”，即是免之也。不言五過之疑有赦者，知過則赦之，不得疑也。“其當清察，能得其理”，不使應刑妄得罰，應罰妄得免也。《舜典》雲“眚災肆赦”，《大禹謨》雲“宥過無大”，《易·解卦》象雲“君子以赦過宥罪”，《論語》雲“赦小過”，是過失之罪，皆當赦放，故知過即是赦之。鄭玄雲：“不言五過之疑有赦者，過不赦也。《禮記》雲：‘凡執禁以齊眾者，不赦過。’”如鄭此言，五罰不服正於五過者，五過皆當罪之也。五刑之疑赦刑取贖，五罰疑者反使服刑，是刑疑而輸贖，罰疑而受刑，不疑而更輕，可疑而益重，事之顛倒一至此乎？謂之“祥刑”，豈當若是？然則“不赦過”者，復何所謂“執禁以齊眾”非謂之平常之過失也。人君故設禁約，將以齊整大眾，小事易犯，人必輕之，過犯悉皆赦之，眾人不可復禁，是故不赦小過，所以齊整眾人，令其不敢犯也。今律：“和合御藥誤不如本方，御幸舟舡誤不牢固，罪皆死。乏軍興者斬。”故失等皆是不赦過也。○傳“簡核”至“之”至“”○正義曰：“簡核誠信，有合眾心”，或皆以為可刑，或可以為赦，未得即斷之，惟當察其囚貌，更有所考合，考合復同，乃從眾議斷之，重刑之至也。“察其貌”者，即《周禮》五聽，辭聽、色聽、氣聽、耳聽、目聽也。鄭玄以為辭聽“觀其出言，不直則煩”；色聽“觀其顏色，不直則赧然”；氣聽“觀其氣息，不直則喘”；耳聽“觀其聽聆，不直則惑”；目聽“觀其眸子，視不直則眊然”。是“察其貌，有所考合”也。○傳“無簡”至“用刑”○正義曰：“無簡核誠信”者，謂簡核之，於罪無誠信效驗可簡核，即是無罪之人，當赦之。○傳“刻其”至“相當”○正義曰：五刑之名，見於經傳，唐虞已來皆有之矣，未知上古起在何時也。漢文帝始除肉刑，其刻顙、截鼻、刖足、割勢皆法傳於先代，孔君親見之。《說文》雲：“顙，頟也。”“墨”一名黥。鄭玄《周禮》注云：“墨，黥也。先刻其面，以墨窒之。”言刻頟為瘡，以墨塞瘡孔，令變色也。“六兩曰釒爰”，蓋古語，存於當時，未必有明文也。《考工記》雲，戈矛重三鋝。馬融雲：“鋝，量名。當與《呂刑》釒爰同。俗儒雲鋝六兩為一川，不知所出耳。”鄭玄雲：“釒爰，稱輕重之名。今代、東萊稱，或以太半兩為鈞，十鈞為釒爰，釒爰重六兩太半兩。釒爰、鋝似同也。或有存行之者，十鈞為釒爰，二釒爰四鈞而當一斤，然則釒爰重六兩三分兩之二。《周禮》謂釒爰為鋝。”如鄭玄之言，一釒爰之重六兩，多於孔、王所說，惟校十六銖爾。《舜典》雲：“金作贖刑。”傳以金為黃金，此言“黃鐵”者，古者金銀銅鐵總號為“金”，今別之以為四名，此傳言“黃鐵”，《舜典》傳言“黃金”，皆是今之銅也。古人贖罪悉皆用銅，而傳或稱“黃金”，或言“黃鐵”，謂銅為金為鐵爾。“閱實其罪”，撿閱核實其所犯之罪，使與罰名相當，然後收取其贖。此既罪疑而取贖，疑罪不定，恐受贖參差，故五罰之下皆言“閱實其罪”，慮其不相當故也。○傳“刖足”至“百釒爰”○正義曰：《釋詁》雲：“剕，刖也。”李巡雲：“斷足曰刖。”《說文》雲：“刖，絕也。”是“刖”者斷絕之名，故“刖足曰剕”。贖劓倍墨，剕應倍劓，而云“倍差”，倍之又有差，則不啻一倍也。下句贖宮六百釒爰，知倍之又半之為五百釒爰也。截鼻重於黥頟，相校猶少。刖足重於截鼻，所校則多。刖足之罪，近於宮刑，故使贖剕不啻倍劓，而多少近於贖宮也。○傳“宮淫”至“之宜”○正義曰：伏生《書傳》雲：“男女不以義交者，其刑宮。”是宮刑為淫刑也。男子之陰名為勢，割去其勢，與椓去其陰，事亦同也。“婦人幽閉”，閉於宮使不得出也。本制宮刑，主為淫者，後人被此罪者，未必盡皆為淫。昭五年《左傳》楚子“以羊舌肸為司宮”，非坐淫也。漢除肉刑，除墨、劓、剕耳，宮刑猶在。近代反逆緣坐，男子十五已下不應死者皆宮之。大隋開皇之初，始除男子宮刑，婦人猶閉於宮。宮是次死之刑，宮於四刑為最重也。人犯輕刑者多，犯重刑者少，又以釒爰數以倍相加，序五刑先輕後重，取事之宜。○傳“死刑”至“制也”○正義曰：《釋詁》雲：“闢，罪也。”死是罪之大者，故謂死刑為“大辟”。經歷陳罰之釒爰數，五刑之疑各自入罰。“不降相因”，不合死疑入宮，宮疑入剕者，是古之制也。所以然者，以其所犯疑不能決，故使贖之。次刑非其所犯，故不得降相因。○傳“別言”至“相備”○正義曰：此經歷言“二百”、“三百”、“五百”者，各是刑之條也。每於其條有犯者，實則刑之，疑則罰之，刑屬罰屬其數同也。別言罰屬，五者各言其數，合言刑屬，但總雲“三千”，明刑罰同其屬數，互見其義以相備也。經雲“大辟之罰，其屬二百”，文異於上四罰者，以“大辟”二字不可雲“大辟罰之屬”，故分為二句，以其二字足使成文。" }
      - { type: j, text: "上下比罪，無僣亂辭，勿用不行，上下比方其罪，無聽僣亂之辭以自疑，勿用折獄，不可行。○僣，子念反。惟察惟法，其審克之。惟當清察罪人之辭，附以法理，其當詳審能之。上刑適輕，下服。重刑有可以虧減則之輕，服下罪。下刑適重，上服。輕重諸罰有權。一人有二罪，則之重而輕並數。輕重諸刑罰各有權宜。○並，必政反。數，色住反。刑罰世輕世重，惟齊非齊，有倫有要。言刑罰隨世輕重也。刑新國用輕典，刑亂國用重典，刑平國用中典。凡刑所以齊非齊，各有倫理，有要善。" }
      - { type: z, text: "“上下”至“有要”○正義曰：此又述斷獄之法。將斷獄訟，當上下比方其罪之輕重，乃與獄官眾議斷之。其囚有僣亂之虛辭者，無得聽之，勿用此辭斷獄，此僣亂之辭，言不可行也。惟當清察罪人之辭，惟當附以法理，其當詳審使能之，勿使僣失為不能也。“上刑適輕”者，謂一人雖犯一罪，狀當輕重兩條，據重條之上有可以虧減者，則之輕條，服下罪也。“下刑適重”者，謂一人之身輕重二罪俱發，則以重罪而從上服，令之服上罪。或輕或重，諸所罪罰，皆有權宜，當臨時斟酌其狀，不得雷同加罪。刑罰有世輕世重，當視世所宜，權而行之。行罰者所以齊非齊者，有倫理，有要善。戒令審量之。○傳“上下”至“可行”○正義曰：罪條雖有多數，犯者未必當條，當取故事並之，上下比方其罪之輕重。上比重罪，下比輕罪，觀其所犯當與誰同。獄官不可盡賢，其間或有阿曲，宜預防之。“僣”，不信也。獄官與囚等或作不信之辭，以惑亂在上，人君無得聽此僣亂之辭以自疑惑，勿即用此僣亂之辭以之斷獄，此僣亂之言不可行用也。○傳“一人”至“權宜”○正義曰：“一人有二罪，則之重而輕並數”者，謂若一人有二罪，則應兩罪俱治，今惟斷獄以重條，而輕者不更別數，與重並數為一。劉君以為“上刑適輕、下刑適重皆以為一人有二罪。上刑適輕者，若今律重罪應贖，輕罪應居作官當者，以居作官當為重，是為上刑適輕。下刑適重者，謂若二者俱是贓罪，罪從重科，輕贓亦備，是為而輕並數也”。知不然者，案經既言“下刑適重，上服”，則是重上服而已，何得為輕贓亦備？又今律雲“重罪應贖，輕重應居作官當者，以居作官當為重”者，此即是下刑適重之條，而以為上刑適輕之例，實為未允。且孔傳下經始雲“一人有二罪”，則上經所云非一人有二罪者也。劉君妄為其說，故今不從。○傳“言刑”至“要善”○正義曰：“刑罰隨世輕重”，言觀世而制刑也。“刑新國用輕典，刑亂國用重典，刑平國用中典”，《周禮·大司寇》文也。鄭玄雲：“新國者，新闢地立君之國。用輕法者，為其民未習於教也。平國，承平守成之國。用中典者，常行之法也。亂國，篡弒叛逆之國。用重典者，以其化惡，伐滅之也。”" }
      - { type: j, text: "罰懲非死，人極於病。刑罰所以懲過，非殺人，欲使惡人極於病苦，莫敢犯者。非佞折獄，惟良折獄，罔非在中。非口才可以斷獄，惟平良可以斷獄，無不在中正。察辭於差，非從惟從。察囚辭其難在於差錯，非從其偽辭，惟從其本情。哀敬折獄，明啟刑書，胥佔，鹹庶中正。當憐下人之犯法，敬斷獄之害人，明開刑書，相與佔之，使刑當其罪，皆庶幾必得中正之道。○當，丁浪反。其刑其罰，其審克之。其所刑，其所罰，其當詳審能之，無失中正。獄成而孚，輸而孚。斷獄成辭而信，當輸汝信於王。謂上其鞫劾文辭。○上，時掌反，下注同。鞫，九六反。劾，亥代反，《玉篇》胡得反。其刑上備，有並兩刑。”其斷刑文書上王府皆當備具，有並兩刑，亦具上之。" }
      - { type: z, text: "“罰懲”至“兩刑”○正義曰：言聖人之制刑罰，所以懲創罪過，非要使人死也，欲使惡人極於病苦，莫敢犯之而已。非口才辯佞之人可以斷獄，惟良善之人乃可以斷獄。言斷獄無非在其中正，佞人即不能然也。察囚之辭其難在於言辭差錯，斷獄者非從其偽辭，惟從其本情。斷獄之時，當哀憐之下民之犯法，敬慎斷獄之害人，勿得輕耳斷之，必令典獄諸官明開刑書，相與佔之，皆無幾得中正之道，其所刑罰，其當詳審能之，勿使失中。其斷獄成辭，得其信實，又當輸汝信實之狀而告於王。其斷刑文書上於王府，皆使備具，勿有疏漏。其囚若犯二事，罪雖從重，有並兩刑上之者，言有兩刑，亦具上之。恐獄官有所隱沒，故戒之。○傳“當憐”至“之道”○正義曰：《論語》雲，陽膚為士師，曾子戒之雲：“如得其情，則哀矜而勿喜。”是斷獄者於斷之時，當憐下民之犯法也。死者不可復生，斷者不可復續，當須敬慎斷獄之害人，勿得輕耳即決之。五刑之屬三千，皆著在刑書，使斷獄者依案用之，宜令斷獄諸官明開刑書，相與佔之，使刑書當其罪。令人之所犯，不必當條，須探測刑書之意，比附以斷其罪，若卜筮之佔然，故稱“佔”也。“皆庶幾必得中正之道”，令獄官同心思使中也。此言“明啟刑書”，而《左傳》雲“昔先王議事以制，不為刑辟”者，彼鑄刑書以宣示百姓，故云臨事制宜，不預明刑辟。人有犯罪，原其情之善惡，斷定其輕重，乃於刑書比附而罪之。故彼此各據其一，義不相違也。○傳“斷獄”至“文辭”○正義曰：“孚”，信也。“輸”，寫也。下“而”為汝也。斷獄成辭而得信實，當輸寫汝之信實以告於王，勿藏隱其情不告王也。曲必隱情，直則無隱，令其不隱情者，欲使之無阿曲也。漢世問罪謂之“鞫”，斷獄謂之“劾”，謂上其鞫劾文辭也。○傳“其斷”至“上之”○正義曰：“其斷刑文書上王府皆當備具”，若今曹司寫案申尚書省也。“有並兩刑”，謂人犯兩事，刑有上下，雖罪從重斷，有兩刑者，亦並具上之，使王知其事。王或時以下刑為重，改下為上，故並亦上之。" }
      - { type: j, text: "王曰：“嗚呼！敬之哉！官伯、族姓，朕言多懼。敬之哉，告使敬刑。官長，諸侯。族，同族。姓，異姓也。我言多可戒懼，以儆之。○儆音景。朕敬於刑，有德惟刑。我敬於刑，當使有德者惟典刑。今天相民，作配在下，明清於單辭。今天治民，人君為配天在下，當承天意，聽訟當清審單辭。單辭特難聽，故言之。○相如字，馬息亮反，助也。民之亂，罔不中聽獄之兩辭，民之所以治，由典獄之無不以中正聽獄之兩辭，兩辭棄虛從實，刑獄清則民治。○治，直吏反。無或私家於獄之兩辭。典獄無敢有受貨聽詐，成私家於獄之兩辭。獄貨非寶，惟府辜功，報以庶尤。受獄貨非家寶也，惟聚罪之事，其報則以眾人見罪。永畏惟罰，非天不中，惟人在命。當長畏懼惟為天所罰，非天道不中，惟人在教命使不中，不中則天罰之。天罰不極，庶民罔有令政在於天下。”天道罰不中，令眾民無有善政在於天下，由人主不中，將亦罰之。○令，力呈反。" }
      - { type: z, text: "“王曰”至“天下”○正義曰：王歎而呼諸侯曰：“嗚呼！刑罰事重，汝當敬之哉！謂諸侯官之長，此同族異姓等，我言多可戒懼。我敬於刑，當刑命有德者惟典刑事。今上天治民，命人君為天子，配天在於下，承天之意，為事甚重。其聽獄訟，當明白清審於獄之單辭。民之所以治者，由獄官無有不用中正聽訟之兩辭。由以中正之故，下民得治。汝獄官無有敢受貨賂，成私家於獄之兩辭。勿於獄之兩家受貨致富，治獄受貨非家寶也，惟是聚罪之事。”言汝身多違則不達，虛言戒行急惡，疏非虛論矣。“多聚罪則天報汝，以眾人見被尤怨而罰責之。汝當長畏惟天所罰，天罰汝者非是天道不中，惟人在於自作教命，使不中爾。教命不中，則天罰汝。天道罰不中也，若令眾民無有善政在於天下，則是人主不中，天亦將罰人主”。諸侯為民之主，故以天罰懼之。○傳“敬之”至“儆之”○正義曰：此篇主多戒諸侯百官之長，故知“官長”即諸侯也。襄十二年《左傳》哭諸侯之例雲：“異姓臨於外，同族於禰廟。”是相對則“族”為同姓，“姓”為異姓也。告之以“我言多可戒懼”者，以儆戒之也。下言民無善政，則天罰人主，是儆戒諸侯也。○傳“我敬”至“典刑”○正義曰：“當使有德者惟典刑”，言將選有德之人使為刑官，刑官不用無德之人也。○傳“今天”至“言之”○正義曰：傳以“相”為治，“今天治民”者，天有意治民，而天不自治，使人治之。人君為配天在下，當承天意治民，治之當使稱天心也。欲稱天心，聽獄當清審單辭。“單辭”謂一人獨言，未有與對之人。訟者多直已以曲彼，構辭以誣人，單辭特難聽，故言之也。孔子美子路雲：“片言可以折獄者，其由也與。”“片言”即“單辭”也。子路行直聞於天下，不肯自道已長，妄稱彼短，得其單辭即可以斷獄者，惟子路爾。凡人少能然，故難聽也。○傳“民之”至“民治”○正義曰：“獄之兩辭”，謂兩人競理，一虛一實，實者枉屈，虛者得理，則此民之所以不得治也。民之所以得治者，由典獄之官其無不以有中正之心聽獄之兩辭，棄虛從實，實者得理，虛者受刑，虛者不敢更訟，則刑獄清而民治矣。孔子稱“必也使無訟乎”，謂此也。○傳“典獄”至“兩辭”○正義曰：典獄知其虛，受其貨，而聽其詐。詐者虛而得理，獄官致富成私家，此民之所以亂也。故戒諸侯無使獄官成私家於獄之兩辭。○傳“受獄”至“見罪”○正義曰：“府”，聚也。“功”，事也。受獄貨非是家之寶也，惟最聚近罪之事爾。罪多必有惡報，其報則以眾人見罪也。眾人見罪者多，天必報以禍罰，故下句戒令畏天罰也。○傳“當長”至“罰之”○正義曰：眾人見罪者多，天必報以禍罰，汝諸侯等當長畏懼為天所罰。天之罰人，非天道不得其中，惟人在其教命自使不申，教命不中，則天罰之。諸侯一，施教命於民者也，故戒以施教命中否也。○傳“天道”至“罰之”○正義曰：天道下罰，罰不中者，令使眾民無有善政在於天下，由人主不中。為人主不中，故無善政，天將亦罰人主。“人主”謂諸侯，此言戒諸侯也。" }
      - { type: j, text: "王曰：“嗚呼！嗣孫，今往何監？非德於民之中？尚明聽之哉！嗣孫，諸侯嗣世子孫，非一世。自今已往，當何監視？非當立德於民，為之中正乎？庶幾明聽我言而行之哉！哲人惟刑，無疆之辭，屬於五極，鹹中有慶。言智人惟用刑，乃有無窮之善，辭名聞於後世。以其折獄屬五常之中正，皆中有善，所以然也。○屬音燭。受王嘉師，監於茲祥刑。”有邦有土受王之善眾而治之者，視於此善刑。欲其勤而法之，為無疆之辭。" }
      - { type: z, text: "“王曰”至“祥刑”○正義曰：戒之既終，王又言而歎曰：“嗚呼！汝諸侯嗣世子孫等，從自今已往，當何所監視？非當視立德於民而為之中正乎？”言諸侯並嗣世惟當視此立德於民為之中正之事。“汝必視此，庶幾明聽我言而行之哉！有智之人惟能用刑，乃有無疆境之善辭。得有無疆善辭者，以其折獄能屬於五常之中正，皆中其理而法有善政故也。汝有邦有土之君，受王之善眾而治之，當視於此善刑。”從上已來舉善刑以告之，欲其勤而法之，使有無窮之美譽。○傳“言智”至“然也”○正義曰：“屬”謂屬著也。“極”，中也。“慶”，善也。“五常”謂仁義禮智信，人所常行之道也。言得有善辭，名聞於後世者，以其斷獄能屬著於五常之中正，皆得其理而法之有善，所以得然也。知“五”是五常者，以人所常行惟有五事，知是五常也。" }
