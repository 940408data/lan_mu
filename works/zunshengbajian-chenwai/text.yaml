sections:
  - id: chenwai
    name: 塵外遐舉箋
    blocks:
      - type: j
        text: 塵外遐舉箋
      - type: z
        text: 導：此箋錄人外高隱凡百人，以全形保年、邁德弘道為志。薦語：不事王侯，高尚其事。
      - type: j
        text: 高子曰：易云：不事王侯，高尚其事。詩云：皎皎白駒，在彼空谷。此指遁世無悶而獨善其身者也。
      - type: z
        text: 讀：引易、詩開篇，標塵外之高舉：此箋錄高隱百人，存其峻德高風。
      - type: j
        text: 士君子不得志於兼濟，當堅貞以全吾形，保其餘年，而林皋自足，邁德弘道，而不受塵鞅以樂其志。
      - type: z
        text: 讀：「不受塵鞅以樂其志」——隱非逃世，乃自全其道。讀百人傳，可見此心。
