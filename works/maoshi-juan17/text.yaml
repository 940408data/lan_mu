# 毛詩正義卷17（孔穎達疏）：j 為經文＋毛亨傳、鄭玄箋，z 為疏文。
sections:
  - id: juan17
    name: 正文
    blocks:
      - { type: j, text: "《卷阿》，召康公戒成王也。言求賢用吉士也。吉，猶善也。○卷音權，曲也。篇內同。阿，大陵曰阿。" }
      - { type: z, text: "“《卷阿》十章，上六章章五句，下四章章六句”至“吉士”。○正義曰：《說文》雲：“賢，堅也。”以其人能堅正，然後可以為人臣，故字從臣。吉者，善也。吉士亦是賢人，但序者別其文以足句，亦因經有“吉士”之文故也。經十章，皆言求賢用吉士之事。" }
      - { type: j, text: "有卷者阿，飄風自南。興也。卷，曲也。飄風，迴風也。惡人被德化而消，猶飄風之入曲阿也。箋雲：大陵曰阿。有大陵卷然而曲，迴風從長養之方來入之。興者，喻王當屈體以待賢者，賢者則猥來就之，如飄風之入曲阿然。其來也，為長養民。○票，避遙反，本亦作“飄”。被，皮寄反。長，張丈反。下同。猥，烏罪反。為，於偽反。" }
      - { type: j, text: "豈弟君子，來游來歌，以矢其音。矢，陳也。箋雲：王能待賢者如是，則樂易之君子來就王游，而歌以陳出其聲。音言其將以樂王也，感王之善心也。○樂易，音洛。下“樂王”同。易音以豉反，後“樂易”皆放此。" }
      - { type: z, text: "“有卷”至“其音”。○毛以為，有卷然而曲者，是大陵之阿也。此阿以曲之故，使迴旋之飄風從南而入之，無不消散。以興有美者是大德之化，此化以美之，故使兇悖之惡人，隨政而順之，皆得其息止也。惡人既消，則賢者樂進，故此樂易之君子，於是來而就王游，來而就王歌，以陳出其音聲。言其將以樂王，感王之善。○鄭以為，有卷然而曲者之阿，則飄風從南長養之方來入之。以興王有降屈之意，則賢者懷其撫養之德來就之。阿以岸曲而來風，猶王以體屈而致賢也。下三句與毛同。○傳“捲曲”至“曲阿”。○正義曰：《檀弓》稱《原壤歌》曰：“執女手之卷然。”則卷是曲貌也。《釋天》雲：“迴風為飄。”李巡曰：“迴風，旋風也。”風必有道，然後得去。阿之曲者，風無去路，故入阿則消。善政消惡，亦復如此。○箋“大陵”至“養民”。○正義曰：“大陵曰阿”，《釋地》文。以此詩勸王求賢，求之必當降意。下言君子之來，此當言王待之狀。且舜舉皋陶，不仁者遠矣。是得賢然後消惡，非惡消然後賢來，故易傳以曲阿喻王之體屈也。屈體者，謂降尊就卑，接以恩意，使賢者感恩而樂來也。以飄者風之狀，故言猥來以對之。猥者，多而疾來之意。飄風之來，非有定所，而以自南言之，明其取南為義，故知以南，是長養之方，喻賢者有長養之德，故云其來為長養民也。《檜風》雲：“匪風飄兮。”《何人斯》篇雲：“其為飄風。”彼皆不言自南，故以為惡。此言從長養之方，故為喻善。興取一象，不得皆同。此言賢人疾來，故以疾風為喻。○傳“矢，陳”。○正義曰：《釋詁》文。○箋“王能”至“善心”。○正義曰：以言歌，復言音，則音為歌之音聲，故云“陳出其聲音。言其將以樂王也。”王能為賢者所樂，是感王之善心也。以此知上經喻王之屈體矣。若其不然，止致賢人之來，何能使之歌樂乎？" }
      - { type: j, text: "伴奐爾游矣，優游爾休矣。伴奐，廣大有文章也。箋雲：伴奐，自縱弛之意也。賢者既來，王以才官秩之，各任其職。女則得伴奐而優自休息也。孔子曰：“無為而治者，其舜也與！恭己正南面而已。”言任賢故逸也。○伴音判，徐音畔。奐音喚，徐音換。施，本又作“弛”，同書氏反。任音壬，或如鴆反。治，直吏反。下“為治”同。與音餘。共音恭，本亦作“恭”。" }
      - { type: j, text: "豈弟君子，俾爾彌爾性，似先公酋矣。彌，終也。似，嗣也。酋，終也。箋雲：俾，使也。樂易之君子來在位，乃使女終女之性命，無困病之憂，嗣先君之功而終成之。○酋，在由反，又子由反，又在幽反。" }
      - { type: z, text: "“伴奐”至“酋矣”。○毛以為，言王若能用周道，伴然而德廣大，奐然而有文章，可使賢者於汝王所來游矣，則此賢人皆來就王，優游然於汝王所休息矣。王欲廣大有文章以來致賢人，又言賢人益王之意。此樂易之君子者，若得來在爵位，以輔佐王，則使汝王得終汝王之性命，無困病之憂，又嗣其先君之功，汝王能終之矣。言得賢人，則可以保全已之性命，又終成先君之功。戒王不可不求之也。○鄭以上二句言勸王求賢之意，若得賢為官，任之以事，則伴奐然汝王得自游縱矣，又優游矣，汝王得休息矣。是任賢則逸，不可不求。餘同。○傳“伴奐，廣大有文章”。○正義曰：傳以伴奐為廣大文章，則是勸王使為此也。來游者，謂王能如此，則賢人來游，故王肅雲：“周道廣大而有文章，故君子得以樂易而來游，優游而休息。”傳之此言，以二字分而為義，蓋伴為廣大，奐為文章，故孔晁引孔子曰：“奐乎其有文章，伴乎其無涯際。”是分之也。則毛當讀為伴奐，不得如徐音。徐音自為鄭讀也。○箋“伴奐”至“故逸”。○正義曰：伴奐之言，與優游相類，故為自縱弛之意。人情莫不惡勞而好逸，迫於不得已耳。任賢可以優游，故以此辭勸之。求逸在於能官，能官在於任職，則君得優游，故云“賢者既來，王以才官秩之，各任其職。汝則伴奐而優游自休息也。”才官秩之，謂論才然後官之，居官然後秩之也。引孔子之言，又解其意，言任賢故逸，以明召公言此之意，亦勸王欲使如舜也。王肅《奏》雲：“周公著書，名曰《無逸》。而云自縱弛也，不亦違理哉！”孫毓雲：“忠臣戒君，而發章令自縱弛，非直方之義。”斯皆未達勸戒之要旨也。何則？周公之言無逸者，心也。召公之言優游者，事也。心常戰兢，無時可逸。事若無為，自然逸矣。“子之燕居，申申如也”，是縱弛之狀。“無為而治，其舜也與”，是自逸之事。《書傳》稱成、康之間，刑措不用，雖欲不逸，何所為乎！召公教其求逸，勸使任賢，此則達者之格言，萬世所不易，何以為違理之談，非直方之義也？周公之戒成王雲“君子所其無逸”，即雲“知稼穡之艱難乃逸”，亦是教王使求自逸。其為勸戒，與此正同。孔晁又云：“一人戒無逸，一人勸使縱弛，事相反戾，乃天之與地，何其疏實而妄爭訟也？”○傳“彌，終。似，嗣。酋，終”。○正義曰：“彌，終”，《釋言》文。似先公，是繼嗣先君，故似為嗣。“遒，終”，《釋詁》文。彼遒作酋，音義同也。○箋“樂易”至“成之”。○正義曰：《禮運》雲：“政也者，君之所以藏身之固也。”然則賢人在位，即行善政，可以保全性命，無他患禍，故云“使汝終汝之性命，無困病之憂也”。若使臣無可任，每事勞心，則是傷年夭命，不得終矣。成主之所繼嗣者，先王也，而云先公，公是君之別名，故云“嗣先君之功而終成之”，謂守其王位，成就先君之功也。" }
      - { type: j, text: "爾土宇昄章，亦孔之厚矣。昄，大也。箋雲：土宇，謂居民以土地屋宅也。孔，甚也。女得賢者，與之為治，使居宅民大得其法則，王恩惠亦甚厚矣。勸之使然。○昄，徐符版反，孫炎、郭璞方滿反，《字林》方但反，又方旦反。" }
      - { type: j, text: "豈弟君子，俾爾彌爾性，百神爾主矣。箋雲：使女為百神主，謂群神受饗而佐之。" }
      - { type: z, text: "“爾土”至“主矣”。○正義曰：勸王若得賢者，與之為治，使之教民，則汝之土地居宅之民大得其禮法文章矣。下民蒙其德澤，皆荷王者之恩，則為王之恩惠亦甚之厚矣。王何以不求之乎？此樂易之君子既來在王位，以德助汝，使汝得終汝之性命，百神皆以汝為主矣。言其愛而饗祐之。○傳“昄，大”。○正義曰：《釋詁》文。○箋“土宇”至“使然”。○正義曰：賢者所以養民，故“土宇，謂居民土地屋宅也”。以教之，故民有所法則，而下得其恩，故云“王恩惠亦甚厚”。言甚者，王恩已厚，臣又益之。○箋“使女”至“佐之”。○正義曰：《祭法》雲：“有天下者祭百神。”則為天子者，固自為百神主矣。今言“百神爾主”，謂神意以之為主，不欲使他人主之，故謂之群神受饗而祐助之。" }
      - { type: j, text: "爾受命長矣，茀祿爾康矣。茀，小也。箋雲：茀，福。康，安也。女得賢者，與之承順天地，則受久長之命，福祿又安女。○茀，沈雲“毛音弗”，徐雲“鄭音廢”，一雲“毛方味反，鄭芳沸反”。" }
      - { type: j, text: "豈弟君子，俾爾彌爾性，純嘏爾常矣。嘏，大也。箋雲：純，大也。予福曰嘏。使女大受神之福以為常。" }
      - { type: z, text: "“爾受”至“常矣”。○毛以為，王得賢者，與之承順天地，則所受天之性命得久長矣，非徒大福佑助王身，其細小之福祿亦於汝而安之矣。此樂易之君子既來在王位，以德助汝，終汝之性命德大天之福，於汝為常矣。言能任賢者，則福常助之。○鄭唯以茀為福、嘏為嘏辭為異。餘同。○傳“茀，小”。○正義曰：福之大者，莫過末年，命長已是大福，則茀福宜為小福，故以茀為小。言小尚安之，則大者可知。○箋“茀福”至“安女”。○正義曰：茀之為福為小，皆無正訓，以其與祿共文，宜為福爾。上言百神為主，命則天地所授，天無悔怒，壽命則長，故云“得賢者，與之承順天地，則受久長之命”。既得長命，又為福祿所安，謂使之四方無虞，常主天下也。○傳“嘏，大”。○正義曰：《釋詁》文。○箋“純大”至“為常”。○正義曰：“純，大”，《釋詁》文。《詩》之有嘏字者，皆是祭祀之事。《少牢》、《特牲》之禮，屍嘏主人皆予之以福，故云“予福曰嘏”。受福以為常，言其終常得之，未嘗闕失也。" }
      - { type: j, text: "有馮有翼，有孝有德，以引以翼。有馮有翼，道可馮依，以為輔翼也。引，長。翼，敬也。箋雲：馮，馮幾也。翼，助也。有孝，斥成王也。有德，謂群臣也。王之祭祀，擇賢者以為屍，尊之。豫撰幾，擇佐食。廟中有孝子，有群臣。屍之入也，使祝讚道之，扶翼之。屍至，設幾佐令入助之。屍者，神象，故事之如祖考。○馮，符冰反，注同，本又作“憑”。饌，士戀反，又士轉反，具也，本亦作“撰”。道，徒報反，本亦作導。" }
      - { type: j, text: "豈弟君子，四方為則。箋雲：則，法也。王之臣，有是樂易之君子，則天下莫不放效以為法。○放，方往反。" }
      - { type: z, text: "“有馮”至“為則”。○毛以為，上章勸王求賢以自益，此則指賢人之行以戒王。言有善行可以為憑依者，有藝能可以為輔翼者，有至孝可以為感化者，有大德可以為軌訓者，王當以此長尊之，以此恆敬之。若王得此四等，是樂易之君子，若來在王位，可與四方為法則矣。以此故不可不求之。○鄭以為，王所得為百神之主，受大嘏之福者，由敬神所致，故祭祀則宜擇賢為屍而尊事之，當有豫設所憑之幾，有豫擇佐食之人，而宿戒之也。其在廟中，當有孝子之主人，有德行之群臣，共行祭祀。及屍之來至，而以禮使祝導引之，以禮使祝扶翼之。既至神坐，共尊而事之，以致神福，故不可不求賢也。餘同。○傳“有馮”至“翼敬”。○正義曰：傳以此求賢，不言祭，故皆以為賢人之德，憑翼是施用之名，孝德是成行之稱，總而為名，皆是道也。以憑翼義隱，故特釋之。言道可依憑，以為輔翼，則孝之與德，亦為道也。憑者可以委杖，翼者可以輔助，憑重於翼，故先憑後翼。孝者，德之本，故亦先孝後德，俱是賢人之行，分之異名耳。“引，長；翼，敬”，皆《釋詁》文。○箋“馮馮幾”至“祖考”。○正義曰：《顧命》雲：“成王憑玉幾。”又曰：“皇后憑玉幾，道揚末命。”是憑施於幾，故以憑為憑几。《皋陶謨》曰：“庶明勵翼。”又曰：“予欲左右有民汝翼。”是翼謂佐助，故以翼為助。《曲禮下》曰：“內事曰孝王某。”主人稱孝，故知“有孝斥成王”。有孝既是主人，則有德宜謂助祭，故以有德謂群臣。不解以引以翼，從《行葦》而略之。上言“百神爾主”，“純嘏爾常”，皆言神福主人。神福由祭祀而來，此詩為求賢而作，故知此章說王之祭祀，擇賢者以為屍，以尊之，故豫撰幾擇佐食。撰幾解有憑，擇佐食解有翼。以下句乃言“以引以翼”，謂來至，導引之，則“有憑有翼”，未是屍之來至，故為豫也。撰謂供置之，與擇相類，但幾則取而置之，故言撰。佐食則眾中簡之，故言擇耳。此本或雲“豫饌食”者，誤耳。孫毓載箋唯言“撰幾，擇佐食”，是也。定本亦作“譔”字，非也。《少牢》屍未入之前雲：“司宮筵於奧，祝設幾於筵上。”《特牲》屍未入之前雲：“祝筵几於室中東面。”是豫撰幾也。《少牢》雲：“佐食升牢，佐食遷昕俎。”《特牲》雲：“宗人遣佐食盥出。”皆其下始言迎屍，是擇佐食亦在屍未至之前，故俱言豫也。知翼為佐食者，以翼者助也。祭禮之有助名者，唯佐食耳。《特牲》注云：“佐食，賓佐屍食者。佐，助也。”故知翼為佐食。言廟中有孝子，有群臣，謂祭時也。然則幾與佐食亦在廟中用之。別言廟中有孝子者，幾與佐食，祭時自在廟中，其撰擇之時，則在廟外。以孝子不迎屍，故以廟中為主。設孝德之文於引翼之上，見屍未入之前，已有祭事故也。言屍之入，使祝讚導之，扶翼之者，《行葦》箋雲：“在前曰引，在傍曰翼。”此與彼同，故以引為贊導也。《少牢》雲：“祝出迎屍於廟門之外，主人降立於阼階東西面。祝先入門右，屍入門左。”是祝在前導之也。導謂在前，則贊謂在後。《少牢》又云：“祝筵屍，屍升自西階入，祝從。”注云：“由後詔相之曰延。延，進也。”《特牲》亦云：“至於階，祝筵屍，屍升入，祝先，主人從。”是在後贊之也，故此兼言贊焉。《特牲》、《少牢》亦無在屍傍之時，而言扶翼之者，已有在其前後，亦當或在其傍。《特牲》注引《禮器》“詔侑無方”，是前後左右無常也。又言“屍至，設幾，佐食助之”，明上豫設，至此用之。又解所以令王尊屍如此者，屍，神象，故當事之如祖考。" }
      - { type: j, text: "顒顒卬卬，如圭如璋，令聞令望。顒顒，溫貌。卬卬，盛貌。箋雲：令，善也。王有賢臣，與之以禮義相切瑳，體貌則顒顒然敬順，志氣則卬卬然高朗，如玉之圭璋也。人聞之則有善聲譽，人望之則有善威儀，德行相副。○顒，魚恭反。卬，五剛反。聞音問，本亦作“問”。望如字，叶韻音亡。磋，七何反，或作“瑳”。論，魯困反。行，下孟反。" }
      - { type: j, text: "豈弟君子，四方為綱。箋雲：綱者能張眾目。" }
      - { type: z, text: "“顒顒”至“為綱”。○正義曰：上既勸王敬賢，又言敬賢之盡意。言王者若得賢人，與之以禮義相切瑳，則能令王體貌顒顒然溫和而敬順，其志氣卬卬然充滿而高朗。以玉之成器，如圭然，如璋然，有善聲譽為人所聞知，有善威儀為人所觀望，非徒有益於王。此樂易之君子，能與天下四方為綱紀，王何得不求之乎？○傳“顒顒”至“盛貌”。○正義曰：傳亦以顒顒為體貌，故為溫。卬卬為志氣，故為盛。其意與箋同。○箋“令善”至“相副”。○正義曰：“令，善”，《釋詁》文。以圭璋是玉之成器，切瑳是治玉之名，故云“王有賢臣，與之以禮義相切瑳”也。顒顒是睹其形狀，故以為體貌敬順。敬順即溫和也。卬卬是見其遒逸，故以為志氣高朗。高朗即盛壯也。既體貌敬順，志氣高朗，則可以比玉，故如玉之圭璋。高朗則行聞於遠，故有善聲譽。敬順則貌無惰容，故有善威儀。貌善名彰，是德行相副也。《釋詁》雲：“顒顒、卬卬，君之德也。”孫炎曰：“顒顒，體貌溫順也。卬卬，志氣高遠也。”取此箋、傳為說。" }
      - { type: j, text: "鳳皇于飛，翽翽其羽，亦集爰止。鳳皇靈鳥仁瑞也。雄曰鳳，雌曰皇。翽翽，眾多也。箋雲：翽翽，羽聲也。亦，亦眾鳥也。爰，於也。鳳皇往飛，翽翽然，亦與眾鳥集於所止。眾鳥慕鳳皇而來，喻賢者所在，群士皆慕而往仕也。因時鳳皇至，故以喻焉。○翽，呼會反，《說文》雲：“羽聲也。”《字林》雲：“飛聲也。”口外反。瑞，垂偽反。" }
      - { type: j, text: "藹藹王多吉士，維君子使，媚於天子。藹藹，猶濟濟也。箋雲：媚，愛也。王之朝多善士藹藹然，君子在上位者率化之，使之親愛天子，奉職盡力。○藹，於害反，《爾雅》雲：“臣盡力也。”《說文》作“藹藹”，雲：“臣盡力之美也。”朝，直遙反。" }
      - { type: z, text: "“鳳皇”至“天子”。○毛以為，成王之時，有鳳皇之瑞。召公以為用賢所致，故陳之以戒王。言鳳皇之往飛翽翽然者，是其羽翼之聲，亦集止於其所宜止之處。今所以致此瑞者，以其藹藹然王朝之上多善士也。此善士等，維君子大賢之所命，使率化之，使媚愛於天子矣，令皆奉職盡力。○鄭以為，鳳皇往飛之時，翽翽其羽為聲，亦與眾鳥集於所止。鳳皇所在，眾鳥慕而從之，故鳳皇亦與之同止，興賢者來仕之時，亦與眾群士集於君朝。賢者所在，群士慕而就之，故賢者亦與之同朝。得大賢而致群士，猶鳳皇飛而來眾鳥，王安得不求之乎？其餘同毛。○傳“鳳皇”至“眾多”。○正義曰：《禮運》雲：“麟、鳳、龜、龍謂之四靈。”皇亦鳳類，故俱雲靈鳥，言此鳥有神靈也。言仁瑞者，《五行傳》及《左氏》說皆雲“貌恭體仁”，則鳳皇翔，言行仁德而致此瑞。毛此意用臣之仁，以致南方鳳。昭二十九年《左傳》雲：“水官廢矣，故龍不生得。”彼言臣修水職致東方龍，則毛意與左丘氏說同。以用臣所致者，皆修母致子應也。《釋鳥》雲：“鶠，鳳。其雌皇。”是雄曰鳳，雌曰皇也。《說文》雲：“鳳，神鳥也。天老曰：鳳象麟前、鹿後、蛇頸、魚尾、龍文、龜背、燕頷，雞喙，五色備舉，出於東方君子之國，翱翔四海之外，過崑崙，飲砥柱，濯羽弱水，暮宿風穴，見則天下大安寧。字從鳥，凡聲。鳳飛，則群鳥從以萬數，故鳳古作朋字。”《山海經》曰：“丹穴之山有鳥焉，其狀如鶴，五采而文，名曰鳳。首文曰德，翼文曰順，背文曰義，膺文曰仁，腹文曰信。是鳥也飲食自然，自歌自舞。見則天下大安寧。”京房《易傳》曰：“鳳皇高丈二，漢時鳳皇數至。”《漢書》雲：“高五六尺。”郭璞雲：“小之形未詳。”翽翽與其羽連文，則是羽聲也。言眾多者，以鳳鳥多，故羽聲大。《皋陶謨》雲：“鳳皇來儀。”注云：“儀，匹。”言其相乘匹。《中候·握河紀》雲：“鳳皇巢阿閣讙樹。”言讙讙在樹。是鳳必群飛。《白虎通》雲：“黃帝之時，鳳皇蔽日而至。”是來必眾多也。毛意不言眾鳥，則唯是鳳事，而言亦者，以鳳事自相亦也，故王肅雲：“鳳皇雖亦高飛傅天，而亦集於所宜止，故集止以亦傅天，傅天以亦集止。今能致靈鳥之瑞者，以多士也。欲其常以求賢用吉士為務也。”○箋“翽翽”至“喻焉”。○正義曰：以傳言眾多解為聲之意，故又明之雲：“翽翽，羽聲也。”以此興求賢。求賢當此鳳而言。亦集，則意取於亦，故云“亦，亦眾鳥也”。鳳與眾鳥俱集所止，猶賢與群士俱在王朝。眾鳥慕鳳似群士慕賢，故以為喻。明王之朝，無人不賢，而云慕者，以賢有等級，言小善之慕大善耳。《君奭》雲：“耇造德不降我，則鳴鳥不聞。”又太平必致四靈，故知因時鳳皇至，故以喻焉。○傳“藹藹，猶濟濟”。○正義曰：《釋訓》雲：“藹藹、濟濟，止也。”俱為容止，故猶之。《釋訓》又云：“藹藹、萋萋，臣盡力也。”則此為美容，又盡力矣。○箋“王之”至“盡力”。○正義曰：以《左傳》言“維命者，皆謂受其節度，聽其進止”，此經既雲“王多吉士”，即雲“維君子使”，則吉士受此君子之命使也。“媚於天子”，文承其下，明是君子使此吉士愛天子矣，故云“君子在上位者率化之”，謂若公卿之率化大夫士也。臣之愛君，唯當盡心力，奉職事，故云“奉職盡力”，意取《爾雅》為說也。" }
      - { type: j, text: "鳳皇于飛，翽翽其羽，亦傅於天。箋雲：傅，猶戾也。○傅音附。" }
      - { type: j, text: "藹藹王多吉人，維君子命，媚於庶人。箋雲：命，猶使也。善士親愛庶人，謂撫擾之，令不失職。○令，力呈反。下“欲令”同。" }
      - { type: z, text: "箋“親愛”至“失職”。○正義曰：撫擾皆安養之義。耕墾原隰，以種禾黍，治其絲麻，以為布帛，皆民之職也。愛庶人者，清靜為政，不亂在下，安養之，使不失此職耳。" }
      - { type: j, text: "鳳皇鳴矣，於彼高岡。梧桐生矣，於彼朝陽。梧桐，柔木也。山東曰朝陽。梧桐不生山岡，太平而後生朝陽。箋雲：鳳皇鳴于山脊之上者，居高視下，觀可集止。喻賢者待禮乃行，翔而後集。梧桐生者，猶明君出也。生於朝陽者，被溫仁之氣亦君德也。鳳皇之性，非梧桐不棲，非竹實不食。○梧音吾。被，皮寄反。棲音西。" }
      - { type: j, text: "菶々萋萋，雝雝喈喈。梧桐盛也，鳳皇鳴也。臣竭其力，則地極其化，天下和洽，則鳳皇樂德。箋雲：菶々萋萋，喻君德盛也。雍雍喈喈，喻民臣和協。○菶，布孔反，又薄孔反，又薄公反。萋，七西反。喈音皆，鳳皇鳴也。" }
      - { type: z, text: "“鳳皇”至“喈喈”。○毛以為，上既言鳳皇由吉人所致，此又總而結之，以告戒於王。言今鳳皇鳴矣，於彼高岡之上，又梧桐生矣，於彼朝陽之地。其梧桐之生，則菶々萋萋而茂盛；其鳳皇之鳴，則雍雍喈喈而和協，是太平之實驗矣。○鄭以為，鳳皇之將出，則先鳴矣，於高山之脊，居高視下，觀可集止。見其梧桐生矣，於彼山東之朝陽，乃往集之。以興賢者之將仕也，則相時待禮，擇可歸就。見其明君出矣，於彼仁聖之治世，乃往仕之。梧桐之生，則菶々萋萋而茂盛，以興明君亦德盛也。鳳皇之鳴也，則雍雍喈喈然音聲和協，以興民臣亦和協也。○傳“梧桐”至“朝陽”。○正義曰：梧桐可以為琴瑟，是柔韌之木，故曰柔木。《釋木》雲：“櫬，梧。”郭璞曰：“今梧桐又曰榮桐木。”郭璞雲：“則梧桐也。”然則梧桐一木耳。“山東曰朝陽”，《釋山》文。孫炎曰：“朝先見日也。”言梧桐不生山岡，太平而後生朝陽者，山岡與朝陽一也。以經有岡，故以山言之。但梧桐柔脆之木，若時未太平，地不極化，則不生山岡朝陽之地。若太平，則生山岡之朝陽。山頂之東，皆早朝見日。但是山東之岡脊，總曰朝陽。不雲鳳鳴處所者，以時不太平，鳳全不見，故不須言鳴之處所。○箋“鳳皇”至“不食”。○正義曰：箋以上二章興求賢人，故此亦以鳳皇興賢者。梧桐自是鳳之所棲，不必太平乃有，不得為太平之事。因鳳所集，故以興明君焉。以鳳鳴而言在岡，故知居高視下，觀可集止。言賢者待禮者，明君能以禮召人，故以喻焉。梧桐可使鳳皇集之，則大樹非始生矣。而言梧桐生者，喻明君出也。既以梧桐比君，不言生於他處，而云生於朝陽者，以其早見日陽，被溫仁之氣。溫仁者，亦君之德也，故以朝陽之梧桐喻之。“非梧桐不棲，非竹實不食”，《莊子》文也。然《莊子》所說，乃言鵷雛，鵷雛亦鳳皇之別。《白虎通》雲：“黃帝之時，鳳皇蔽日而至，止於東園，食常竹實，棲常梧桐，終身不去。”且諸《書傳》之論鳳事，皆雲食竹棲梧。箋言此者，解經既言鳳皇，即言梧桐之意也。○傳“梧桐”至“樂德”。○正義曰：言梧桐盛，解菶々萋萋。鳳皇鳴，解雍雍喈喈。臣竭其力以下，更覆解此鳳鳴木盛之意。由臣能竭其力以助於君，故使地亦極盡其化生之德，生此梧桐，使之菶々萋萋也。由臣竭其力，故使天下和洽，故使鳳皇樂德而來，其鳴雍雍喈喈也。知臣竭其力為二事之總者，以此言太平由臣之力，明天下和洽亦臣竭力矣。萬物草木，天之所生，言地極其化者，以梧桐生在地，是地能化之。《釋訓》雲：“藹藹、萋萋，臣盡力也。”舍人曰：“藹藹，賢士之貌。萋萋，梧桐之貌。”孫炎曰：“言眾臣竭力則地極其化，梧桐盛也。”是用此傳為說。《釋訓》又云：“噰噰喈喈，民協服也。”不為鳳皇鳴。此傳與《爾雅》異者。毛意以為，由萬民協服，故鳳聲雍和，亦得合《爾雅》也。○箋“菶々”至“和協”。○正義曰：菶々萋萋，梧桐之貌也。箋於上經以梧桐喻明君，故以梧桐盛喻君德。《爾雅》言臣盡力，與此箋不同者，以君有盛德，則能使臣盡其心力，亦與《爾雅》合也。雍雍喈喈，鳳皇之聲，上以鳳皇比賢者，其鳴似賢者之政教，故以鳳皇聲聞於人，人聞之而知其雍和，以喻政教加被於民，民應之而相與和協。《爾雅》言民協服者，彼言所喻之意也。" }
      - { type: j, text: "君子之車，既庶且多。君子之馬，既閒且馳。上能錫以車馬，行中節，馳中法也。箋雲：庶，眾。閒，習也。今賢者在位，王錫其車眾多矣，其馬又閒習於威儀能馳矣。大夫有乘馬，有貳車。○中，丁仲反。下同。乘，承證反。" }
      - { type: j, text: "矢詩不多，維以遂歌。不多，多也。明王使公卿獻詩以陳其志，遂為工師之歌焉。箋雲：矢，陳也。我陳作此詩，不復多也。欲令遂為樂歌，王日聽之，則不損今之成功也。○復，扶又反。" }
      - { type: z, text: "“君子”至“遂歌”。○毛以為，成王實能用吉士，已致大平，但召公欲令守其成功，故自言作詩之意。言今君子賢者來在王位，王賜之車馬。其所賜君子之車既眾，且又能多矣，所賜君子之馬既閒習於威儀，且又能馳矣，是王能用賢，不須規戒。今我陳作此詩，豈不多乎？言其實煩多也。正以中心不已，恐王惰慢，故作此詩，遂為樂人之歌，冀常求賢士，永為鑑戒，不損今日成功也。○鄭唯以不多為作此詩不復多為異。餘同。○傳“上能”至“中法”。○正義曰：言上能賜以車馬，謂成王於時已能賜之。行中節，解既閒也。馳中法，解且馳也。言閒馳者，美其中節度，合禮法。○箋“庶眾”至“貳車”。○正義曰：以經言既是王賜之，故云今賢者在此位，王賜其車眾多矣。庶、多一也，丁寧以足句耳。馳者，是馬走之名。馬既能走，今言且馳，明是馳合於法，故云“其馬又閒習於威儀，能馳矣”。車不獨賜駕，必以馬、車言眾多，則馬亦多矣。但馬有御之威儀，故別言閒馳以美之。馬既別文，故眾多者，唯言車耳。言大夫有乘馬，有貳車者，解其言多之意。以車則人有副貳，所賜又非一人，故言多也。言大夫者，自大夫以上皆有此，不必專指大夫也。禮，士無貳車，又止得兩馬。本或有“士者”，衍字。定本雲“大夫士有乘車、貳車”，非也。○傳“不多”至“歌焉”。○正義曰：傳反其言，以不多為多者，王既能用賢，不復須戒，故以作詩為煩多也。又解召公獻詩及言遂歌之意，以明王使公卿獻詩，以陳其所作之人志意，遂為工師之歌故也。《國語》亦云：“使公卿至於列士獻詩”，與此同也。《春秋·瞽矇職》“掌九德六詩之歌”。工者，樂師之總名，即大師是也。○箋“矢陳”至“成功”。○正義曰：箋以忠臣諫王，其言雖多，猶恨心之不盡，不當自謂己言已為多也。且順文自通，不宜反之，故易傳以為作此詩不復多言，其意猶以為少也。樂人之歌，常在君側，故云“王日聽之，則不損今之成功”。" }
      - { type: j, text: "《卷阿》十章，六章章五句，四章章六句。" }
      - { type: j, text: "《民勞》，召穆公刺厲王也。厲王，成王七世孫也。時賦斂重數，繇役煩多，人民勞苦，輕為奸宄，彊陵弱，眾暴寡，作寇害，故穆公以刺之。○民勞，如字。從此至《桑柔》五篇，是厲王變大雅。斂，力豔反。數音朔。繇，本亦作“傜”，音遙。宄音軌，本亦作“軌”。" }
      - { type: z, text: "《民勞》五章，章十句。○正義曰：經五章，上四句言民勞之須安，次四句言寇虐之當止，下二句言王當行善政以安民，皆是刺王之事。○箋“厲王”至“刺之”。○正義曰：《世本》及《周本紀》皆雲成王生康王，康王生昭王，昭王生穆王，穆王生恭王，恭王生懿王及孝王，孝王生夷王，夷王生厲王。凡九王。從成王言之，不數成王，又不數孝王，故七世也。《左傳》服虔注云：“穆公，召康公十六世孫。”然康公與成王同時，穆王與厲王並世。而世數不同者，生子有早晚，壽命有長短故也。注述詳略，不必有例。而《商頌·列祖》箋雲：“中宗，殷王大戊也，湯之玄孫。”《玄鳥》箋雲：“高宗，殷王武丁也，中宗玄孫之孫。”是則以詩相繼，因而明之。此以厲王之詩承成王詩後，故本之於成王也。其文、武、成及厲、宣、幽，若《王風》之平、桓、莊，皆父子相繼，中間無隔，故不假言之。《小雅》之序無成王之文，故《六月》不以宣王繼成王，《十月之交》推之，而知是厲王耳。而序文不為厲字，故就此以明世數也。《郊特牲》雲：“天子失禮，自夷王以下。”注云：“夷王，周康王玄孫之子。”系之康王者，以記文事雜，上無所據。文、武、成、康俱為明王，失禮是初衰之始，故系於明王之最末者言之。此以天子事，皆因有所隔，而詳其世數。《國風》雖有隔絕，皆不明言。詳天子而略諸侯，亦尊卑之義也。序略言刺王，箋明其刺意。賦斂重數，傜役煩多，使民勞苦，即五章皆上四句是也。輕為奸宄，以強陵弱，以眾暴寡，作為寇害，五章皆次四句是也。故穆王以此刺之也。五章下二句，皆教王為善政，以安止之，非勞虐之實事，故箋略之。" }
      - { type: j, text: "民亦勞止，汔可小康。惠此中國，以綏四方。汔，危也。中國，京師也。四方，諸夏也。箋雲：汔，幾也。康、綏皆安也。惠，愛也。今周民罷勞矣，王幾可以小安之乎？愛京師之人以安天下，京師者，諸夏之根本。○汔，許一反，《說文》巨乞反。夏，戶雅反。下同。幾音祈。下同。罷音皮。無縱詭隨，以謹無良。式遏寇虐，憯不畏明。詭隨，詭人之善、隨人之惡者。以謹無良，慎小以懲大也。憯，曾也。箋雲：謹，猶慎也。良，善。式，用。遏，止也。王為政無聽於詭人之善不肯行而隨人之惡者，以此敕慎無善之人，又用此止為寇虐、曾不畏敬明白之刑罪者，疾時有之。○詭，俱毀反。遏，於葛反。慘，七感反，本亦作“憯”。" }
      - { type: j, text: "柔遠能邇，以定我王。柔，安也。箋雲：能，猶侞也，邇，近也。安遠方之國，順侞其近者，當以此定我周家為王之功。言我者，同姓親也。○揉音柔，本亦作“柔”。能，徐雲：“毛如字，鄭奴代反。”侞，檢字書未見所出，《廣雅》雲：“如，若也，均也。”義音相似而字則異。舊音如庶反，義亡難見。鄭注《尚書》雲：“能，恣也。”與此不同。" }
      - { type: z, text: "“民亦”至“我王”。○毛以為，穆王諫王，言今周民亦皆疲勞止，而又危耳，近於喪亡。王可以小省賦役而安息之，愛此中畿之國、京師之人，以安天下四方諸夏之國。若安此勞民，當糾察有罪，無得聽縱其詭人之善、隨人之惡者，以此無阿縱之法，故以敕慎其為無善之人。亦用此法以止其為寇虐之行，曾不畏敬明白之刑罰者，當用正法刑罰而禁止之，令民得無勞也。所以令王先愛京師以及四方者，以王之政，欲安遠方之國，當先順侞其近。王當行之，以此定我周家為王之功。恐其不能安定而喪失之。○鄭唯以汔為幾，雲此民亦皆已勞止，王幾可以小安之為異。餘同。○傳“汔危”至“諸夏”。○正義曰：以“汔”之下，即雲“小康”，明是由危須安，故以汔為危也。“中國”之文，與“四方”相對，故知中國謂京師，四方謂諸夏。若以中國對四夷，則諸夏亦為中國。言各有對，故不同也。○箋“汔幾”至“根本”。○正義曰：以傳汔之為危，既無正訓，又小康者，安此勞民。直以勞民須安，不當更雲危也。《釋詁》雲：“凱，汔也。”孫炎曰：“汔，近也。”郭璞曰：“謂相摩近。”反覆相訓，是汔得為幾也。昭二十年《左傳》引此詩，杜預雲：“汔，期也。”然則期字雖別，皆是近義。言其近當如此。《史記》稱漢高祖欲廢太子，周昌曰：“臣口不能言，然臣期知其不可。陛下雖欲廢太子，臣期不奉詔。”言期者，意亦與此同也。“康、綏皆安。惠，愛”，皆《釋詁》文。又云愛京師得安四方之意，由京師者，諸夏之根本，根本既安，枝葉亦安。京師，王之所專，王若安之，則四方諸侯亦皆效王安之。○傳“詭隨”至“憯曾”。○正義曰：詭戾人之善，隨從人之惡，以其故為此惡，情不可原，是故不得聽縱之也。此詭隨、無良、寇虐俱是惡行，但惡有大小。詭隨小惡，無良其次，寇虐則大惡也。詭隨未為人害，故直雲不得縱之。無良則為小惡已著，故謹敕之。寇虐則害加於民，故遏止之。然則三者各自為罪，而云無縱詭隨，以謹無良，以為相須之意，故傳解之雲：“謹慎其小，以懲創其大。”以無良之惡，大於詭隨。詭隨者尚無所縱，則無良者謹慎矣。至於寇虐，則不可以謹，故別雲“式遏”，謂加之大罪也。“慘，曾”，《釋言》文。《爾雅》本或作“憯，曾”，音義同。○箋“謹猶”至“有之”。○正義曰：謹慎俱是敕戒之言，故言謹猶慎。以傳言“慎小”，故申足之。“式，用”，《釋言》文。“遏，止”，《釋詁》文。此“無縱”之文，為下總目。無良、寇虐蒙之，故云“又用此止為寇虐、曾不畏敬明白之刑罰者”，言又用者，亦用此無縱之事、不畏明白之刑，即以與寇虐為一，故長讀之。穆公諫王無縱，明實有其人，故云“疾時有之”。○傳“柔，安”。○正義曰：《釋詁》文。○箋“能猶”至“姓親”。○正義曰：《尚書·舜典》雲：“柔遠能邇。”注以能為恣，則此雲侞者與恣同，謂順適其意也。“邇，近”，《釋詁》文。安遠方之國，當先順侞其近者，即《論語》所謂悅近來遠是也。此與上文相成，能邇謂惠中國，柔遠即綏四方也。厲王身為王矣，而云“以定我王”，故知以定我周家為之功。若廣論天下之事，雖則異姓，可以稱我。今指王身而文稱我，是共王有周家之辭，故云“我者，同姓親也”。" }
      - { type: j, text: "民亦勞止，汔可小休。惠此中國，以為民逑。休，定也。逑，合也。箋雲：休，止息也。合，聚也。○逑音求。無縱詭隨，以謹惽怓。式遏寇虐，無俾民憂。惽怓，大亂也。箋雲：惽怓，猶讙譁也，謂好爭訟者也。俾，使也。○惽音昏，《說文》作“怋”，雲：“怓也。”又云：“惽，不憭也。”怓，女交反，鄭雲：“猶讙譊也。”《說文》雲：“怓，亂也。”讙音歡，又許元反。譊，女交反，本又作“譁”，音花。好，呼報反。爭，爭鬥之爭。" }
      - { type: j, text: "無棄爾勞，以為王休。休，美也。箋雲：勞，猶功也。無廢女始時勤政事之功，以為女王之美。述其始時者，誘掖之也。○休，許虯反。掖音亦。" }
      - { type: z, text: "“民亦”至“王休”。○毛以為，今周民亦皆疲勞止而又危耳，近於死亡，王可以小安定止息矣。當愛此中畿之國，以為諸夏之民，使得會聚。王若施善政，當糾察有罪，無得縱此詭人之善、隨人之惡者，以此敕慎其讙譁為大惡者，又用此無縱之事，止其寇虐之害，無使有遭此寇虐之憂。又誘王，言其始時有善，勸今終之，無棄爾王始時之政事之功，以為王政之美。○鄭唯汔幾為異。餘同。○傳“休，定。逑，合”。○正義曰：《釋詁》雲：“休，息也。定，止也。”息亦定之義，故以休為定。“逑，合”，《釋詁》文。箋雲休之為定，於義雖通而未是正訓，故以休為止息，合為合聚，所以申足毛義。○傳“惽怓，大亂”。○正義曰：惽怓者，其人好鄙爭，惽惽怓怓然，故箋以為“猶讙譁，謂好爭訟者”，是其言語為大聒亂人，故云大亂，非是為大禍亂也。○傳“休，美”。○正義曰：《釋詁》文。○箋“勞猶”至“掖之”。○正義曰：勞力然後有功，故云“勞，猶功也”。知汝勞為汝始時勤政事之功者，以雲“無棄”，明其先有而不棄也。厲王暴虐，初則然矣，而述其始有功者，誘掖之耳。誘掖之言，出《衡門》之序，謂誘導而扶掖之。以小人貪功，聞己先有善，或將勉力，故誘之。" }
      - { type: j, text: "民亦勞止，汔可小息。惠此京師，以綏四國。息，止也。無縱詭隨，以謹罔極。式遏寇虐，無俾作慝。慝，惡也。箋雲：罔，無。極，中也。無中，所行不得中正。○慝，吐得反。敬慎威儀，以近有德。求近德也。○近，附近之近。注同。" }
      - { type: j, text: "民亦勞止，汔可小愒。惠此中國，俾民憂洩。愒，息。洩，去也。箋雲：洩，猶出也，發也。○愒，起例反，徐丘麗反。洩，以世反，又息列反。無縱詭隨，以謹醜厲。式遏寇虐，無俾正敗。醜，眾。厲，危也。箋雲：厲，惡也。《春秋傳》曰：“其父為厲。”敗，壞也。無使先王之正道壞。”" }
      - { type: j, text: "戎雖小子，而式弘大。戎，大也。箋雲：戎，猶女也。式，用也。弘，猶廣也。今王女雖小子自遇，而女用事於天下甚廣大也。《易》曰：“君子出其言善，則千里之外應之。況其邇者乎？出其言不善，則千里之外違之，況其邇者乎？”是以此戒之。○應，應對之應。" }
      - { type: z, text: "“民亦”至“弘大”。○毛以為，民亦疲勞止，又危耳，可以止息之。先愛此中國之京師，便諸夏之民，其憂寫洩而去。又當無縱詭隨之人，以此敕慎眾為危殆之行者，又用此止其寇虐之害，無使王之正道敗壞也。所以須然者，在王之大位者雖小子，而用事甚大，大不可不慎，故須息勞民而止寇虐也。○鄭以汔為幾，厲為惡，戎、汝，弘、廣為異。餘同。○傳“愒，息。洩，去”。○正義曰：“愒，息”，《釋詁》文。雲：“洩，漏也。”然則洩者，閉物漏去之名，故以為去。箋以為，憂洩者，是憂氣在腹而發出，故云“出也，發也”。其意亦與毛同。《月令》“是謂洩天地之氣”，是發出之義也。○傳“醜，眾。厲，危”。○正義曰：“醜，眾”，《釋詁》文。《易》之言厲者，皆危之義。《乾》“九三，夕惕若厲”之類，皆是危也，故以為危。醜厲，謂眾為惡行以為人者也。○箋“厲惡”至“道壞”。○正義曰：箋以言人之惡，當指其惡狀。危非惡之名，故以厲為惡。《秋官·司厲》注云：“犯政為惡曰厲。”是也。所引《春秋傳》曰，襄十七年《左傳》雲：“衛孫蒯田幹曹隧，飲馬於重丘，毀其瓶。重丘人閉門而詢之，曰：‘親逐而君，爾父為厲。是之不憂，而何以田為？’”以厲為罵辭，明是惡矣，故引之以證厲為惡。《釋詁》雲：“壞，毀也。”敗亦毀損之名，故以為壞。言正敗，是正者敗，故云“無使先王之正道壞”。言寇虐之人能壞先王正道也。○傳“戎，大”。○正義曰：《釋詁》文。王肅雲：“在王者之大位，雖小子，其用事甚大也。”○箋“戎猶”至“戎之”。○正義曰：以下已有大，故訓戎為汝。弘復為大，則大文太重，故弘猶廣，廣亦大之義耳。小子，無知之稱，故《抑》曰：“於乎小子，未知臧否。”言雖小子，故知自遇，如小子居天子之位，故用事廣大。引“《易》曰”盡“邇者乎”，皆《上系辭》也。出言善否，千里之外違之應之，是其用事廣大。出言不易，是以穆公以此言戒之。必易傳以戎為汝者，孫毓雲：“戎之為汝，詩人通訓。言大雖小子，於文不便，箋義為長。”" }
      - { type: j, text: "民亦勞止，汔可小安。惠此中國，國無有殘。賊義曰殘。箋雲：王愛此京師之人，則天下邦國之君不為殘酷。無縱詭隨，以謹繾綣。式遏寇虐，無俾正反。繾綣，反覆也。○繾綣，上音遣，下起阮反，字或作“卷”。覆，芳服反。" }
      - { type: j, text: "王欲玉女，是用大諫。箋雲：玉者，君子比德焉。王乎！我欲令女如玉然，故作是詩，用大諫正女。此穆公至忠之言。○令，力呈反。" }
      - { type: z, text: "傳“賊義曰殘”。○正義曰：《孟子》雲：“賊仁曰賊，賊義曰殘。”言是賊敗仁義之事。○傳“繾綣，反覆”。○正義曰：昭二十五年《左傳》：“繾綣從公，無通外內。”則繾綣者，牢固相著之意，非善惡之辭，但施於善則善，施於惡則惡耳。此雲“以謹繾綣”，是人行反覆為惡，固著不捨，常為惡行也。" }
      - { type: j, text: "《民勞》五章，章十句。" }
      - { type: j, text: "《板》，凡伯刺厲王也。凡伯，周同姓，周公之胤也。入為王卿士。○板音版。" }
      - { type: z, text: "《板》八章，章八句。○箋“凡伯”至“卿士”。○正義曰：僖二十四年《左傳》曰：“凡、蔣、邢、茅、胙、祭，周公之胤也。”知為王卿士者，以經雲：“我雖異事，及爾同寮。”是為王官也。以其伯爵，故宜為卿士。《瞻仰》，凡伯之刺幽王。《春秋》隱七年，“天王使凡伯來聘”。世在王朝，蓋畿內之國。杜預雲：“汲郡共縣東南有凡城。”共縣於漢屬河內郡，蓋在周東都之畿內也。" }
      - { type: j, text: "上帝闆闆，下民卒癉。出話不然，為猶不遠。闆闆，反也。上帝，以稱王者也。癉，病也。話，善言也。猶，道也。箋雲：猶，謀也。王為政反先王與天之道，天下之民盡病，其出善言而不行之也。此為謀不能遠圖，不知禍之將至。○卒，子恤反。僤，本又作“癉”，當但反，沈本作“<疒亶>”。出如字，徐尺遂反。話，戶快反，《說文》雲：“會合善言也。”靡聖管管，不實於亶。管管，無所依也。亶，誠也。箋雲：王無聖人之法度，管管然以心自恣，不能用實於誠信之言，言行相違也。○亶，丁旦反。行，下孟反。" }
      - { type: j, text: "猶之未遠，是用大諫。猶，圖也。箋雲：王之謀不能圖遠，用是故我大諫王也。" }
      - { type: z, text: "“上帝”至“大諫”。○毛以為，尊比上帝之王者，其為政教反又反也。既反於先王，又反於天道。以此之故，天下之民蒙其惡政，盡皆困病矣。假使王出嘉善話言，則不肯是而用行之，如此則王之所為之道不能長遠，唯趨於淺近，不知禍之將至也。又王之所為惡，無重聖人之法，管管然以心自恣，無所依據，不能用實於誠信之言。既不依聖人之法，不實誠信之言，以此圖事，不能至遠。我以王所圖之事未能及遠，恐王將有禍難，以是之故，用大諫正王。○鄭唯以“猶”皆為“謀”為異。餘同。○傳“闆闆”至“猶道”。○正義曰：《釋訓》雲：“闆闆，僻也。”邪僻即反戾之義，故為反也。上帝以稱王者，謂假上帝之尊稱之以比王者。若實指上天，則天無所反，故知以斥王也。“癉，病。話，善言。猶，道”，皆《釋詁》文。彼“猶”作“繇”，義同也。○箋“猶謀”至“將至”。○正義曰：“猶，謀”，《釋詁》文。以言不遠，則為不能深知遠事，故易傳以猶為謀。以重言反反，則反有二事，故云“王為政反先王與天道”。王者為政，當遵用先王，上承天意，故知所反有二事，反先王與天也。以其先違舊章，乃失天意，故後言天也。其出善言不行之，謂王自出而不行也。小人之言雖不盡善，亦知愛其善時復言之，但言之易，行之難，不能行之耳。知非他人，為王說善言、王不能行者，他人之言則是諫諍，經不得言出也。不用他言，則是不從，箋不得言不行也。以此知是王自出言不能行之。人必深謀遠慮，乃能預防患禍。王之為謀，不能遠圖，是不知禍之將至也。○傳“管管”至“亶誠”。○王義曰：以“管管”與“靡聖”同文，既無聖法，故知無所依系。“亶，誠”，《釋詁》文。○箋“王無”至“相違”。○正義曰：以無聖而言管管，是違法任情，故知以心自恣。不能用實於誠信之言，謂意欲為善，終不能行，是於言為虛，故云“不能用實於誠信之言”。有言不行，是言行相違也。此不實於亶，還是上出話不然也。下言猶之未遠，還是上為猶不遠也。作者反覆重言耳。○傳“猶，圖”。○正義曰：《釋言》文。圖即謀也。箋言王之謀者，申傳意耳。言大諫，謂其諫之深。自此以下，是大諫也。" }
      - { type: j, text: "天之方難，無然憲憲。天之方蹶，無然洩洩。憲憲，猶欣欣也。蹶，動也。洩洩，猶沓沓也。箋雲：天斥王也。王方欲艱難天下之民，又方變更先王之道。臣乎，女無憲憲然，無沓沓然為之製法度，達其意，以成其惡。○憲，許建反。蹶，俱衛反。洩，徐以世反。《爾雅》雲：“憲憲、洩洩，製法則也。”《說文》作“呭”，雲：“多言也。”為，於偽反。" }
      - { type: j, text: "辭之輯矣，民之洽矣。辭之懌矣，民之莫矣。輯，和。洽，合。懌，說。莫，定也。箋雲：辭，辭氣，謂政教也。王者政教和說順於民，則民心合定。此戒語時之大臣。○輯音集，又七入反。繹音亦，本亦作“懌”。說音悅。下同。語，魚庶反。" }
      - { type: z, text: "“天之”至“莫矣”。○正義曰：王之為惡，侵亂下民，則有諂佞之臣助為惡政。此又責以王之尊比於上天，故謂王為天。言王之方行暴虐之政，以艱難天下之民，汝臣等無得如是欣欣然喜樂而勸之。王之方欲動變先王之道，而行邪僻之政，汝臣等無得如是沓沓然隨從而助之。戒之使無得為王制作法度，以通達其意，使王成惡。故又言己之意，所以不欲令臣製作法度者，以國之安危在於出令。王者若出教令，其辭氣之和順矣，則下民之心相與合聚矣。其辭氣之悅美矣，則下民之心皆得安定矣。言民合定在於王教，故汝臣等不得為王制虐政以亂下民也。○傳“憲憲”至“沓沓”。○正義曰：《釋訓》雲：“憲憲、洩洩，製法則也。”李巡曰：“皆惡黨為製法則也。”孫炎曰：“厲王方虐，諂臣併為製作法令。”此直解詩人言此之意，而不解其狀，故傳解憲憲、洩洩之義。憲憲猶欣欣，喜樂貌也，謂見王將為惡政而喜樂之。洩洩猶沓沓，競進之意也，謂見王將為惡政競隨從而為之製法也。“蹶，動”，《釋詁》文。○箋“天斥”至“其惡”。○正義曰：戒臣不令助之，故天斥王，非斥上天也。方者，未至之辭，故言方欲，謂將為教令之時也。難是困苦之事，故知艱難天下之民。動為變改之事，故知變更先王之道。以下雲“及爾同寮”，故知是責臣之辭。達其意者，謂君意始發，往通達其心，與之合和，為作法以成其惡也。定本、《集註》皆作“達其意”，俗為“逢”者，誤也。○傳“輯和”至“莫定”。○正義曰：“輯，和。洽，合。莫，定”，《釋詁》文。又云：“懌，悅樂也。”俱訓為樂，故以懌為悅。○箋“辭辭”至“大臣”。○正義曰：《論語》雲：“出辭氣。”故以此辭為辭氣也。此辭加於下民，故知謂政教也。知此大臣者，以凡伯卿士而云“與己同寮”，且非大臣不得與王制法，故知是戒語時之大臣也。" }
      - { type: j, text: "我雖異事，及爾同寮。我即爾謀，聽我囂囂。寮，官也。囂囂，猶謷謷也。箋雲：及，與。即，就也。我雖與爾職事異者，乃與女同官，俱為卿士。我就女而謀，欲忠告以善道。女反聽我言，謷謷然不肯受。○僚，字又作“寮”，力彫反。囂，五刀反。謷，五報反。道音導。下“牖道”、“道民”皆同。" }
      - { type: j, text: "我言維服，勿以為笑。先民有言：“詢於芻蕘。”芻蕘，薪採者。箋雲：服，事也。我所言，乃今之急事，女無笑之。古之賢者有言，有疑事當與薪採者謀之。匹夫匹婦或知及之，況於我乎！○芻，初俱反。蕘，如謠反，《說文》雲：“蕘，草薪也。”知音智，又如字。" }
      - { type: z, text: "“我雖”至“芻蕘”。○正義曰：上言戒語大臣，而大臣不受。此又責之，言我雖與汝異其所職之事，要乃與汝同其官寮。以同官之類，當相用其言語。我今就汝謀慮，告此以善道，而汝聽我言，反囂囂然不肯受用。何也？我之所言，維是當今急事，汝勿以為非而笑之。先世上古之民，賢者有善言，雲我有疑事，當詢謀於芻蕘薪採者。以樵採之賤者，猶當與之謀，況我與汝之同寮，不得棄其言也？○傳“寮官”至“謷謷”。○正義曰：“寮，官”，《釋詁》文。言同寮者，謂同為王官。文七年《左傳》荀林父謂先蔑曰：“同官為寮。吾嘗同寮，敢不盡心乎！”是寮為同官也。囂囂者，是不聽之狀。《釋訓》雲：“囂囂，傲也。”謂傲慢其言而不聽之，故言猶謷謷。○箋“及與”至“肯受”。○正義曰：“及，與”，《釋詁》文。我即爾謀，謂往與之謀，故知即為就。《周禮》六官，各有所掌，故異職而同官也。《論語》說朋友之交雲：“忠告而善道之。”故知就與之謀，是其忠誠之心。告之以善道，即上章所云“勿為王制法度”，是也。○傳“芻蕘，薪採者”。○正義曰：言詢於芻蕘，謂謀於取芻取蕘之人，非謀於草木，故云“芻蕘，薪採者”，是賤人也。《說文》雲：“薪，蕘也”。蕘即薪也。然則芻者飼馬牛之草，蕘者供燃火之草，蕘是薪耳。以薪者亦是採取，故連言之。○箋“服事”至“我乎”。○正義曰：“服，事”，《釋詁》文。知所言是急事者，凡伯責其不聽，明是事之急切。以其惡急，故責汝無笑之。先民者，是古昔之民耳，但以其言傳於後世，為人所效習，故知是古之賢者。親取薪採，則是賤者，故云“匹夫匹婦或知及之，況於我乎”。《中庸》雲：“夫婦之愚，可以與知焉。”彼言夫婦，即此箋所謂“匹夫匹婦”也。庶人無妾媵，唯夫婦相匹，故稱匹也。" }
      - { type: j, text: "天之方虐，無然謔謔。老夫灌灌，小子蹻々。謔謔然，喜樂。灌灌，猶款款也。蹻々，驕貌。箋雲：今王方為酷虐之政，女無謔謔然以讒慝助之。老夫諫女款款然，自謂也。女反蹻々然如小子，不聽我言。○謔，虛虐反。灌，古亂反。蹻，其略反。樂音洛。" }
      - { type: j, text: "匪我言耄，爾用憂謔。多將熇々，不可救藥。八十曰耄。熇々然，熾盛也。箋雲：將，行也。今我言非老耄有失誤，乃告女用可憂之事，而女反如戲謔，多行熇々慘毒之惡，誰能止其禍？○耄，莫報反。熇，徐許酷反，沈又許各反，《說文》雲：“火熱也。”" }
      - { type: z, text: "“天之”至“救藥”。○正義曰：又責大臣，言比天之王者，方為酷虐之政，將害於民。汝等大臣，無得如是謔謔然喜其所為，而以讒慝助之。我老夫教諫汝，其意乃款款然情至意盡，何為汝等而未知！幼弱之小子，反蹻蹻然自驕恣而不聽用我之言乎！汝不用我言，豈不以我為老也？非我之言為老耄有所失誤，乃告汝可憂之事，汝何為反用可憂之事以為戲謔而慢我？汝既不用我言，反助王為惡，多行慘毒之惡，熇熇然使惡加於民，不可救止而藥治之。言王之為惡，皆大臣之由，故責之。○傳“謔謔”至“驕貌”。○正義曰：此言謔謔，猶上憲憲。見王為惡如喜樂之，故為喜樂也。《釋訓》雲：“灌灌，憂無告也。”解其言灌灌之意耳，非解灌灌之義，故云：“猶款款”。言己至誠款實而告之，但彼不受用，即是無所告耳。《釋訓》又云：“蹻蹻，驕也。”孫炎曰：“謂驕慢之貌。”○箋“今王”至“我言”。○正義曰：謔謔直是喜樂之貌，而云以讒慝助之者，《釋訓》雲：“謔謔、謞謞，崇讒慝也。”舍人曰：“謔謔、謞謞，皆盛烈貌。”孫炎曰：“厲王暴虐，大臣謔謔然喜，謞謞然盛，以興讒惡也。”是以讒惡助之事也。下雲“匪我言耄”，則凡伯老矣，故云“老夫諫汝款款然”者，是凡伯“自謂也”。小子是幼弱無知之稱，以其不可教誨，故謂之小子，言“汝反蹻蹻然如小子，不聽我言”也。○傳“八十”至“熾盛”。○正義曰：“八十曰耄”，《曲禮》文。熇熇是氣熱之氣，故為熾盛也。○箋“今我”至“其禍”。○正義曰：老耄，老人言多惽忘，故云非我言耄有其失誤。此“爾用憂”三字皆“言耄”之下，與“謔”字共文，則是凡伯自言。我告汝可憂之事，而汝反用此可憂之事而好為戲謔，故箋分之以見此意。熇熇是熾盛之貌，而言不可救止，故知是多行慘酷毒害之惡，誰能止其禍。如人病甚，不可救以藥。" }
      - { type: j, text: "天之方懠，無為夸毗。威儀卒迷，善人載屍。懠，怒也。夸毗，體柔人也。箋雲：王方行酷虐之威怒，女無夸毗以形體順從之，君臣之威儀盡迷亂。賢人君子則如屍矣，不復言語。時厲王虐而弭謗。○懠，才細反。疾，怒也。誇，苦花反。復，扶又反。弭，彌耳反，止也。" }
      - { type: j, text: "民之方殿屎，則莫我敢葵。喪亂蔑資，曾莫惠我師。殿屎，呻吟也。蔑，無。資，財也。箋雲：葵，揆也。民方愁苦而呻吟，則忽然無有揆度知其然者。其遭喪禍，又素以賦斂空虛，無財貨以共其事。窮困如此，又曾不肯惠施以周贍眾民，言無恩也。○殿，都練反，郭音坫，《說文》作“唸”。屎，許伊反，郭音香惟反，《說文》作“吚”。呻音申。吟如字，本又作“唫”，同。度，待洛反。斂，力豔反。共音恭，本亦作“恭”。施，式豉反。周音周。贍，市豔反。" }
      - { type: z, text: "“天之”至“我師”。○正義曰：此又責群臣。言比天之王者，方欲威怒行酷虐之害，汝等無得為此夸毗，足恭前卻，以體從之。君既為惡，臣又從之，則上下威儀盡迷亂矣。其善人君子則如屍然，不復言語矣。故今天下之民方欲愁苦而呻吟矣，汝君臣忽然則莫有察我民敢能揆度知其情者。此民又遭虐政之喪禍、重斂之危亂，其室空虛，無有資財，而汝等君臣亦曾莫有肯惠施我之眾人欲周贍之者。言愁貧並至，民困之甚，而上無恩恤，故以刺之。○傳“懠怒”至“柔人”。○正義曰：“懠，怒”，《釋言》文。舍人曰：“懠，怒聲也。”《釋訓》雲：“夸毗，體柔也。”李巡曰：“屈己卑身，求得於人，曰體柔。”然則夸毗者，便僻其足，前卻為恭，以形體順從於人，故云以體柔人。○箋“君臣”至“弭謗”。○正義曰：屍謂祭時之屍，以為神象，故終祭而不言。賢人君子則如屍，不復言語，畏政故也。時厲王虐而弭謗，事見《周語》。弭，止也。止人之謗己者。○傳“殿屎，呻吟”。○正義曰：《釋訓》文。孫炎曰：“人愁苦呻吟之聲也。”○箋“葵揆”至“無息”。○正義曰：“葵，揆”，《釋言》文。民愁苦而呻吟，是無所告訴也。無有揆度知其然，謂君臣並不察民也。君行既惡，則致天災，故民有遭喪禍者。政亂則稅民無藝，故又責以賦斂也。內供喪費，外充稅斂，故空虛無資財以供其事用也。定本、《集註》“責以賦斂”，“責”字皆作“素”。俗本為“責”，誤矣。素者，先也，謂先重賦斂，故困窮也。" }
      - { type: j, text: "天之牖民，如壎如篪，如璋如圭，如取如攜。牖，道也。如壎如篪，言相和也。如璋如圭，言相合也。如取如攜，言必從也。箋雲：王之道民以禮義，則民和合而從之如此。○壎，許元反。篪音池。攜，下圭反。和，如字，又胡臥反。" }
      - { type: j, text: "攜無曰益，牖民孔易，民之多闢，無自立闢。闢，法也。箋雲：易，易也。女攜掣民東與西與，民皆從女所為，無曰是何益為。道民在己，甚易也。民之行多為邪辟者，乃女君臣之過，無自謂所建為法也。○孔易，鄭音亦，注“易，易也”，上字同，又以豉反。多闢，匹亦反，邪也。注同。立闢，婢亦反。注同。易也，以豉反。下同。<疒挈>，本又作“掣”，尺制反。與並音餘。行，下孟反。邪，似嗟反。" }
      - { type: z, text: "“天之”至“立闢”。○正義曰：自此以上，言政惡民困。此言可反之使善。言天王之導民也，如壎然，如篪然，言民必應君命，如壎篪之相和也。如璋如圭然，言民必同君心，如圭璋之相合也。又如往取物，如手攜物，言其必從君化，如攜取之隨人君也。若然，民之從己，如手攜之。汝王無曰是何益與，勿謂如手攜無益。王者之導民甚易，言上為善政，民必為善，是甚易也。汝當行善以化之。令民之所行皆多邪僻，乃汝君臣之過，汝無自謂所建立者為法，當更改行以化民，無得行此惡政也。○傳“牖道”至“必從”。○正義曰：牖與誘，古字通用，故以為導也。壎篪俱是樂器，其聲相和，以喻民之應君，故云“相和”也。半圭為璋，合二璋則成圭，以喻民合君心，故云“言相合”也。取謂物在他處，行往取之。攜謂物在地上，手舉攜之。人所攜取，必從手而來，故云“言必從”也。壎、篪，圭、璋，相類之物，故言“相也”。取、攜，謂人攜取物，而物名不見，與上不類，故變言“必從”，而不言相也。○傳“闢，法”。○正義曰：《釋詁》文。○箋“易易”至“為法”。○正義曰：以韻當為改易之易，故轉之為難易之易也。上有六“如”，獨言攜者，以攜文最處末，故乘而反之，以比攜民之東西。" }
      - { type: j, text: "價人維藩，大師維垣，大邦維屏，大宗維翰。價，善也。藩，屏也。垣，牆也。王者天下之大宗。翰，幹也。箋雲：價，甲也。被甲之人，謂卿士掌軍事者。大師，三公也。大邦，成國諸侯也。大宗，王之同姓之適子也。王當用公卿諸侯及宗室之貴者為藩屏垣幹，為輔弼，無疏遠之。○價音界，《說文》同，鄭作“介”。藩，方元反。大師，音泰，注“大師”同。垣音袁。翰，胡旦反，徐音寒。被，皮寄反。適，丁歷反。下同。遠，於萬反。" }
      - { type: j, text: "懷德維寧，宗子維城。無俾城壞，無獨斯畏。懷，和也。箋雲：斯，離也。和女德，無行酷虐之政，以安女國，以是為宗子之城，使免於難。遂行酷虐，則禍及宗子，是謂城壞。城壞則乖離，而女獨居而畏矣。宗子，謂王之適子。○難，乃旦反。" }
      - { type: z, text: "“價人”至“斯畏”。○毛以為，上既令王施法，此言立法之事。言王當用善人為官，維以為藩鄣。又用大師之大臣，維以為垣牆。又用大邦諸侯，維以為屏蔽。王又身為大宗，維當施政，為之楨幹。又和安汝德，以施於民，無行酷虐之政，維安汝之國矣。不但安汝之國，亦與汝之宗子，維以為城。言其可以蔽身，又得蔽子。王必常行此德，無使宗子之城壞，又無得疏遠藩屏之人，令王獨居，此則王有所畏矣。○鄭以為，當用此被甲卿士之人，維為其藩鄣；太師三公之大臣，維為垣牆；大邦成國之諸侯，維為藩蔽；大宗同姓之宗適，維為楨幹，皆近而任之，令為王用，無得疏遠之。下四句同，唯訓“斯”為“離”。○傳“價善”至“翰幹”。○正義曰：“價，善”，《釋詁》文。藩者，園圃之籬，可以屏蔽行者，故以藩為屏也。垣者，小牆之名，故云垣牆，亦是屏蔽之義也。以太師是三公之官，大邦是諸侯之國，大宗文在其下，則是天子之身，故云“王者，天下之大宗”。以禮有大宗、小宗，為其族人所尊，故稱宗子。天子則天下所尊，故謂之大宗也。傳以藩、垣、屏皆防衛之名，幹是施法之稱，言以善人及三公、諸侯鄣蔽寇難，天子居內設法而撫安之。“價人”總言用善，則百官皆是，故文在“大師”之上。諸侯非王朝之人，故退“大邦”之文於下。“翰，幹”，《釋詁》文。○箋“價甲”至“遠之”。○正義曰：箋以詩戒王，使親其官人，不勸王擇人為官，故不從以價為善也。價者，甲之別名，故以價為甲。以其身被甲，故稱甲人，君言宗人、宰人也。被甲之人謂卿士掌軍事者，於《周禮》，司馬之卿也。以兵甲之事，國之所重，且舉司馬，以明六卿，猶言太師以顯三公也。《尚書·周官》曰：“立太師、太傅、太保，茲惟三公。”是太師為三公也。以言大邦，則不兼小國，故知為成國諸侯也。《大宗伯》雲：“五命賜則。”注云：“則，未成國之名。”又云：“七命賜國。”則伯以上為成國也。襄十四年《左傳》成國不過半天子之軍。周為六軍，諸侯之大者，三軍可也。《明堂位》注“成國之賦千乘”，則侯地四百里以上始為成國，其伯未成國也。此言大邦成國，當亦侯以上也。以天子諸侯皆絕其宗名，且以上文類之，不得為王之身。大者眾多之辭，宗者與王同族，故知大宗，王之同姓世適子也。此價人、大師、大邦、大宗，皆王宜親愛，故總之雲“王當用公卿諸侯及宗室之貴者為藩屏垣幹，為輔弼，無疏遠之”也。文次如此者，卿雖卑於公，而親掌職事，又兵甲事重，故先公言之。大邦非在王朝，太宗未為官職，尊卑次之也。箋以公親於卿，故便文而先言公耳。○傳“懷，和”。○正義曰：懷之為訓，思也，來也，止也。思、止亦和之義，故為和也。○箋“斯離”至“適子”。○正義曰：“斯，離”，《釋言》文。以上章剌王酷虐，故知“懷德維寧”謂和汝德，無行酷虐之政，以安汝國也。“懷德”之下，即言“宗子維城”，明以此懷德為宗子之城。宗子，王之適子也，有天下者皆欲福及長世，恐子孫之不安，故言以德為城，使免於患難。城可以禦寇難，故以城喻焉。又解城懷之意，若其不和汝德，遂行酷虐之政，則民不堪命，禍及宗子，是謂城壞。宗子之城既壞，則群臣乖離，而汝王獨居，而有所畏懼矣。以是欲王之親輔弼之臣，使不乖離，固宗子之城，使不傾壞，則令己無獨畏之憂也。以上言大宗謂同姓之適。此言宗子，嫌與上同，故辨之雲：“宗子，謂王之適子也。”《周語》曰：“彘之亂，宣王在召公之宮。國人圍之，召公以其子代宣王。”是禍及宗子也。《雨無正》曰：“正大夫離居，莫知我勩。”是君臣乖離也。昭二十六年《左傳》曰：“至於厲王，王心戾虐，萬民弗忍，居王於彘。”是獨居而畏也。是賢人之言，皆有徵矣。" }
      - { type: j, text: "敬天之怒，無敢戲豫。敬天之渝，無敢馳驅。戲豫，逸豫也。馳驅，自恣也。箋雲：渝，變也。○渝，用朱反。" }
      - { type: j, text: "昊天曰明，及爾出王。昊天曰旦，及爾游衍。王，往。旦，明。游，行。衍，溢也。箋雲：及，與也。昊天在上，人仰之皆謂之明，常與女出入往來，游溢相從，視女所行善惡，可不慎乎！○昊，胡老反。曰音越。下同。羨，餘戰反，溢也，一音延善反，本或作“衍”。" }
      - { type: z, text: "“敬天”至“游衍”。○正義曰：上既勸王和德以安國，故又言當畏敬上天，當敬天之威怒，以自肅戒，無敢忽慢之而戲謔逸豫。又當敬天之災變，以常戰慄，無敢忽之而馳驅自恣也。天之變怒，所以須敬者，以此昊天在上，人仰之皆謂之明，常與汝出入往來，游溢相從，終常相隨，見人善惡。既曰若此，不可不敬慎也。○傳“戲豫”至“自恣”。○正義曰：戲豫，謂戲而逸豫；馳驅，謂馳騁自恣，皆謂非禮而動。反道違天如此者，則上天罰之，故戒王使敬天也。“孔子迅雷風烈必變”，注云：“敬天之怒。”則天之怒者，謂暴風疾雷也。《周禮》大怪異災則去樂徹膳，則天之變者，謂大怪異災也。言上天之道，有此變怒之時，故常須敬戒，非謂當此變怒之時，獨禁逸豫自恣也。○箋“渝，變”。○正義曰：《釋言》文。○傳“王相”至“衍溢”。○正義曰：以“王”與“出”共文，故為往也。既有出往，則亦有入來，故箋言出入往來。此出王游衍，還是上戲豫馳驅之事，故云游行衍溢，亦自恣之意也。" }
      - { type: j, text: "《板》八章，章八句。" }
      - { type: j, text: "《生民之什》十篇，六十五章，四百三十三句。" }
