labels:
  - page: 351
    col: 9
    role: j
    text: 孟子卷第十朱熹集注
  - page: 351
    col: 10
    role: title
    text: 萬章章句下
  - page: 351
    col: 11
    role: z
    text: 凡九章
  - page: 351
    col: 12
    role: j
    text: 孟子曰伯夷目不視惡色耳不聽惡聲
  - page: 351
    col: 13
    role: j
    text: 非其君不事非其民不使治則進亂則
  - page: 351
    col: 14
    role: j
    text: 退橫政之所出橫民之所止不忍居也
  - page: 351
    col: 15
    role: j
    text: 思與鄉人處如以朝衣朝冠坐於塗炭
  - page: 351
    col: 16
    role: j
    text: 也當紂之時居北海之濱以待天下之
  - page: 352
    col: 1
    role: j
    text: 清也故聞伯夷之風者頑夫廉懦夫有
  - page: 352
    col: 2
    role: j
    text: 立志
  - page: 352
    col: 3
    role: z
    text: 治去聲下同橫去聲朝音潮○橫謂
  - page: 352
    col: 4
    role: z
    text: 不循法度頑者無知覺廉者有分辨
  - page: 352
    col: 5
    role: z
    text: 懦柔弱也餘並見前篇
  - page: 352
    col: 6
    role: j
    text: 伊尹曰何事非君何使非民治亦進亂
  - page: 352
    col: 7
    role: j
    text: 亦進曰天之生斯民也使先知覺後知
  - page: 352
    col: 8
    role: j
    text: 使先覺覺後覺予天民之先覺者也予
  - page: 352
    col: 9
    role: j
    text: 將以此道覺此民也思天下之民匹夫
  - page: 352
    col: 10
    role: j
    text: 匹婦有不與被堯舜之澤者若己推而
  - page: 352
    col: 11
    role: j
    text: 內之溝中其自任以天下之重也
  - page: 352
    col: 12
    role: z
    text: 與音預○何事非君言所事即君何
  - page: 352
    col: 13
    role: z
    text: 使非民言所使即民無不可事之君
  - page: 352
    col: 14
    role: z
    text: 無不可使之民也餘見前篇
  - page: 352
    col: 15
    role: j
    text: 柳下惠不羞汙君不辭小官進不隱賢
  - page: 352
    col: 16
    role: j
    text: 必以其道遺佚而不怨阨窮而不憫輿
  - page: 353
    col: 1
    role: j
    text: 鄉人處由由然不忍去也爾爲爾我爲
  - page: 353
    col: 2
    role: j
    text: 我雖袒裼裸裎於我側爾焉能浼我哉
  - page: 353
    col: 3
    role: j
    text: 故聞柳下惠之風者鄙夫寬薄夫敦
  - page: 353
    col: 4
    role: z
    text: 鄙狹陋也敦厚也餘見前篇
  - page: 353
    col: 5
    role: j
    text: 孔子之去齊接淅而行去魯曰遲遲吾
  - page: 353
    col: 6
    role: j
    text: 行也去父母國之道也可以速而速可
  - page: 353
    col: 7
    role: j
    text: 以久而久可以處而處可以仕而仕孔
  - page: 353
    col: 8
    role: j
    text: 子也
  - page: 353
    col: 9
    role: z
    text: 淅先歷反○接猶承也淅漬米水也
  - page: 353
    col: 10
    role: z
    text: 漬米將炊而欲去之速故以手承水
  - page: 353
    col: 11
    role: z
    text: 取米而行不及炊也舉此一端以見
  - page: 353
    col: 12
    role: z
    text: 其久速仕止各當其可也或曰孔子
  - page: 353
    col: 13
    role: z
    text: 去魯不稅冕而行豈得爲遲○楊氏
  - page: 353
    col: 14
    role: z
    text: 曰孔子欲去之意久矣不欲苟去故
  - page: 353
    col: 15
    role: z
    text: 遲遲其行也膰肉不至則得以微罪
  - page: 353
    col: 16
    role: z
    text: 行矣故不稅冕而行非速也
  - page: 354
    col: 1
    role: j
    text: 孟子曰伯夷聖人之清者也伊尹聖之
  - page: 354
    col: 2
    role: j
    text: 任者也柳下惠聖之和者也孔子聖之
  - page: 354
    col: 3
    role: j
    text: 時者也
  - page: 354
    col: 4
    role: z
    text: 張子曰無所雜者清之極無所異者
  - page: 354
    col: 5
    role: z
    text: 者和之極勉而清非聖人之清勉而
  - page: 354
    col: 6
    role: z
    text: 和非聖人之和所謂聖者不勉不思
  - page: 354
    col: 7
    role: z
    text: 而至焉者也○孔氏曰任者以天下
  - page: 354
    col: 8
    role: z
    text: 爲己責也愚謂孔子仕止乆速各當
  - page: 354
    col: 9
    role: z
    text: 其可蓋兼三子之所以聖者而時出
  - page: 354
    col: 10
    role: z
    text: 之非如三子之可以一德名也或疑
  - page: 354
    col: 11
    role: z
    text: 伊尹出處合乎孔子而不得爲聖之
  - page: 354
    col: 12
    role: z
    text: 時何也○程子曰終是任底意思在
  - page: 354
    col: 13
    role: j
    text: 孔子之謂集大成集大成也者金聲而
  - page: 354
    col: 14
    role: j
    text: 玉振之也金聲也者始條理也玉振之
  - page: 354
    col: 15
    role: j
    text: 也者終條理也始條理者智之事也終
  - page: 354
    col: 16
    role: j
    text: 條理者聖之事也
  - page: 355
    col: 1
    role: z
    text: 此言孔子集三聖之事而爲一大聖
  - page: 355
    col: 2
    role: z
    text: 之事猶作樂者集衆音之小成而爲
  - page: 355
    col: 3
    role: z
    text: 於一也八音之中金石爲重故特
  - page: 355
    col: 4
    role: j
    text: 韶九成是也金鐘屬聲宣也如聲罪致
  - page: 355
    col: 5
    role: z
    text: 討之聲玉磬也振収也如振河海而
  - page: 355
    col: 6
    role: z
    text: 不洩之振始始之也終終之也條理
  - page: 355
    col: 7
    role: z
    text: 猶言脉絡指衆音而言也智者知之
  - page: 355
    col: 8
    role: z
    text: 所及聖者德之所就也蓋樂有八音
  - page: 355
    col: 9
    role: z
    text: 金石絲竹匏土革木若獨奏一音則
  - page: 355
    col: 10
    role: z
    text: 其一音自爲始終而爲一小成猶三
  - page: 355
    col: 11
    role: z
    text: 子之所知偏於一而其所就亦偏於
  - page: 355
    col: 12
    role: z
    text: 一也八音之中金石爲重故特爲衆
  - page: 355
    col: 13
    role: z
    text: 音之綱紀又金始震而玉終詘然也
  - page: 355
    col: 14
    role: z
    text: 故並奏八音則於其未作而先擊鎛
  - page: 355
    col: 15
    role: z
    text: 鍾以宣其聲俟其旣闋而後擊特磬
  - page: 355
    col: 16
    role: z
    text: 以収其韻宣以始之収以終之二
  - page: 356
    col: 1
    role: z
    text: 者之間脈絡通貫無所不備則合衆
  - page: 356
    col: 2
    role: z
    text: 小成而爲一大成猶孔子之知無不
  - page: 356
    col: 3
    role: z
    text: 盡而德無不全也金聲玉振始終條
  - page: 356
    col: 4
    role: z
    text: 理疑古樂經之言故倪寬云惟天子
  - page: 356
    col: 5
    role: z
    text: 建中和之極兼總條貫金聲而玉振
  - page: 356
    col: 6
    role: z
    text: 之亦此意也
  - page: 356
    col: 7
    role: j
    text: 智譬則巧也聖譬則力也由射於百步
  - page: 356
    col: 8
    role: j
    text: 之外也其至爾力也其中非爾力也
  - page: 356
    col: 9
    role: z
    text: 中去聲○此復以射之巧力發明智
  - page: 356
    col: 10
    role: z
    text: 聖二字之義見孔子巧力俱全而聖
  - page: 356
    col: 11
    role: z
    text: 智兼備三子則力有餘而巧不足是
  - page: 356
    col: 12
    role: z
    text: 以一節雖至於聖而知不足以及乎
  - page: 356
    col: 13
    role: z
    text: 時中也○此章言三子之行各極其
  - page: 356
    col: 14
    role: z
    text: 一偏孔子之道兼全於衆理所以偏
  - page: 356
    col: 15
    role: z
    text: 者由其蔽於始是以缺於終所以全
  - page: 356
    col: 16
    role: z
    text: 者由其知之至是以行之盡三子猶
  - page: 357
    col: 1
    role: j
    text: 春夏秋冬之各一其時孔子則太和
  - page: 357
    col: 2
    role: z
    text: 元氣之流行於四時也
  - page: 357
    col: 3
    role: j
    text: 北宮錡問曰周室班爵祿也如之何
  - page: 357
    col: 4
    role: z
    text: 錡魚綺反○北宮姓錡名衛人班列
  - page: 357
    col: 5
    role: j
    text: 也
  - page: 357
    col: 6
    role: j
    text: 孟子曰其詳不可得聞也諸侯惡其害
  - page: 357
    col: 7
    role: j
    text: 己也而皆去其籍然而軻也嘗聞其略
  - page: 357
    col: 8
    role: j
    text: 也
  - page: 357
    col: 9
    role: z
    text: 惡去聲去上聲○當時諸侯兼并僭
  - page: 357
    col: 10
    role: j
    text: 竊故惡周制妨害己之所為也
  - page: 357
    col: 11
    role: j
    text: 天子一位公一位侯一位伯一位子男
  - page: 357
    col: 12
    role: j
    text: 同一位凡五等也君一位卿一位大夫
  - page: 357
    col: 13
    role: j
    text: 一位上士一位中士一位下士一位凡
  - page: 357
    col: 14
    role: j
    text: 六等
  - page: 357
    col: 15
    role: z
    text: 此班爵之制也五等通於天下六等
  - page: 357
    col: 16
    role: j
    text: 施於國中
  - page: 358
    col: 1
    role: j
    text: 天子之制地方千里公侯皆方百里伯
  - page: 358
    col: 2
    role: j
    text: 七十里子男五十里凡四等不能五十
  - page: 358
    col: 3
    role: j
    text: 里不達於天子附於諸侯曰附庸
  - page: 358
    col: 4
    role: j
    text: 此以下班祿之制也不能猶不足也
  - page: 358
    col: 5
    role: j
    text: 小國之地不足五十里者不能自達
  - page: 358
    col: 6
    role: j
    text: 於天子因大國以姓名通謂之附庸
  - page: 358
    col: 7
    role: z
    text: 若春秋邾儀父之類是也
  - page: 358
    col: 8
    role: j
    text: 天子之卿受地視侯大夫受地視伯元
  - page: 358
    col: 9
    role: j
    text: 士受地視子男
  - page: 358
    col: 10
    role: z
    text: 視比也○徐氏曰王畿之內亦制都
  - page: 358
    col: 11
    role: z
    text: 鄙受地也元士上士也
  - page: 358
    col: 12
    role: j
    text: 大國地方百里君十卿祿卿祿四大夫
  - page: 358
    col: 13
    role: j
    text: 大夫倍上士上士倍中士中士倍下士
  - page: 358
    col: 14
    role: j
    text: 下士與庶人在官者同祿祿足以代其
  - page: 358
    col: 15
    role: j
    text: 耕也
  - page: 358
    col: 16
    role: z
    text: 十十倍之也四四倍之也倍加一倍
  - page: 359
    col: 1
    role: z
    text: 也○徐氏曰大國君田三萬二千畝
  - page: 359
    col: 2
    role: z
    text: 其入可食二千八百八十人卿田三
  - page: 359
    col: 3
    role: z
    text: 千二百畝可食二百八十人大夫
  - page: 359
    col: 4
    role: z
    text: 田八百畝可食七十二人上士田四
  - page: 359
    col: 5
    role: z
    text: 百畝可食三十六人中士田二百畝
  - page: 359
    col: 6
    role: z
    text: 可食十八人下士與庶人在官者田
  - page: 359
    col: 7
    role: z
    text: 百畝可食九人至五人庶人在官府
  - page: 359
    col: 8
    role: z
    text: 史胥徒也愚按君以下所食之祿皆
  - page: 359
    col: 9
    role: z
    text: 助法之公田藉農夫之力以耕而收
  - page: 359
    col: 10
    role: z
    text: 其租士之無田與庶人在官者則但
  - page: 359
    col: 11
    role: z
    text: 受祿於官如田之入而已
  - page: 359
    col: 12
    role: j
    text: 次國地方七十里君十卿祿卿祿三大
  - page: 359
    col: 13
    role: j
    text: 夫大夫倍上士上士倍中士中士倍下
  - page: 359
    col: 14
    role: j
    text: 士下士與庶人在官者同祿祿足以代
  - page: 359
    col: 15
    role: j
    text: 其耕也
  - page: 359
    col: 16
    role: z
    text: 三謂三倍之也○徐氏曰次國君田
  - page: 360
    col: 1
    role: z
    text: 二萬四千畝可食二千一百六十人
  - page: 360
    col: 2
    role: z
    text: 卿田二千四百畝可食二百十六人
  - page: 360
    col: 3
    role: j
    text: 小國地方五十里君十卿禄卿禄二大
  - page: 360
    col: 4
    role: j
    text: 夫大夫倍上士上士倍中士中士倍下
  - page: 360
    col: 5
    role: j
    text: 士下士與庶人在官者同禄禄足以代
  - page: 360
    col: 6
    role: j
    text: 其耕也
  - page: 360
    col: 7
    role: z
    text: 二即倍也○徐氏曰小國君田一萬
  - page: 360
    col: 8
    role: z
    text: 六千畝可食千四百四十人卿田一
  - page: 360
    col: 9
    role: z
    text: 千六百畝可食百四十四人
  - page: 360
    col: 10
    role: j
    text: 耕者之所獲一夫百畝百畝之糞上農
  - page: 360
    col: 11
    role: j
    text: 夫食九人上次食八人中食七人中次
  - page: 360
    col: 12
    role: j
    text: 食六人下食五人庶人在官者其禄以
  - page: 360
    col: 13
    role: j
    text: 是爲差
  - page: 360
    col: 14
    role: z
    text: 食音嗣○獲得也一夫一婦佃田百
  - page: 360
    col: 15
    role: z
    text: 畝加之以糞糞多而力勤者爲上農
  - page: 360
    col: 16
    role: z
    text: 其所収可供九人其次用力不齊故
  - page: 361
    col: 1
    role: z
    text: 有此五等庶人在官者其受祿不同
  - page: 361
    col: 2
    role: j
    text: 亦有此五等也○愚按此章之說與周
  - page: 361
    col: 3
    role: z
    text: 禮王制不同蓋不可考闕之可也○
  - page: 361
    col: 4
    role: z
    text: 程子曰孟子之時去先王未遠載籍
  - page: 361
    col: 5
    role: z
    text: 未經秦火然而班爵祿之制已不聞
  - page: 361
    col: 6
    role: z
    text: 其詳今之禮書皆掇拾於煨燼之餘
  - page: 361
    col: 7
    role: z
    text: 而多出於漢儒一時之傅會柰何欲
  - page: 361
    col: 8
    role: z
    text: 盡信而句爲之解乎然則其事固不
  - page: 361
    col: 9
    role: z
    text: 可一二追復矣
  - page: 361
    col: 10
    role: j
    text: 萬章問曰敢問友孟子曰不挾長不挾
  - page: 361
    col: 11
    role: j
    text: 貴不挾兄弟而友友也者友其德也不
  - page: 361
    col: 12
    role: j
    text: 可以有挾也
  - page: 361
    col: 13
    role: z
    text: 挾者兼有而恃之之稱
  - page: 361
    col: 14
    role: j
    text: 孟獻子百乘之家也有友五人焉樂正
  - page: 361
    col: 15
    role: j
    text: 裘牧仲其三人則予忘之矣獻子之與
  - page: 361
    col: 16
    role: j
    text: 此五人者友也無獻子之家者也此五
  - page: 362
    col: 1
    role: j
    text: 人者亦有獻子之家則不與之友矣
  - page: 362
    col: 2
    role: z
    text: 乘去聲下同○孟獻子魯之賢大夫
  - page: 362
    col: 3
    role: z
    text: 仲孫蔑也○張子曰獻子忘其勢
  - page: 362
    col: 4
    role: z
    text: 五人者忘人之勢不資其勢而利其
  - page: 362
    col: 5
    role: z
    text: 有然後能忘人之勢若五人者有獻
  - page: 362
    col: 6
    role: z
    text: 子之家則反爲獻子之所賤矣
  - page: 362
    col: 7
    role: j
    text: 非惟百乘之家爲然也雖小國之君亦
  - page: 362
    col: 8
    role: j
    text: 有之費惠公曰吾於子思則師之矣吾
  - page: 362
    col: 9
    role: j
    text: 於顔般則友之矣王順長息則事我者
  - page: 362
    col: 10
    role: j
    text: 也
  - page: 362
    col: 11
    role: z
    text: 費音祕般音班○惠公費邑之君也
  - page: 362
    col: 12
    role: z
    text: 師所尊也友所敬也事我者所使也
  - page: 362
    col: 13
    role: j
    text: 非惟小國之君爲然也雖大國之君亦
  - page: 362
    col: 14
    role: j
    text: 有之晉平公之於亥唐也入云則入坐
  - page: 362
    col: 15
    role: j
    text: 云則坐食云則食雖疏食菜羹未嘗不
  - page: 362
    col: 16
    role: j
    text: 飽蓋不敢不飽也然終於此而已矣弗
  - page: 363
    col: 1
    role: j
    text: 與共天位也弗與治天職也弗與食天
  - page: 363
    col: 2
    role: j
    text: 禄也士之尊賢者也非王公之尊賢也
  - page: 363
    col: 3
    role: z
    text: 疏食之食音嗣平公王公下諸本多
  - page: 363
    col: 4
    role: z
    text: 無之字疑闕文也○亥唐晉賢人也
  - page: 363
    col: 5
    role: z
    text: 平公造之唐言入公乃入言坐乃坐
  - page: 363
    col: 6
    role: z
    text: 言食乃食也疏食糲飯也不敢不飽
  - page: 363
    col: 7
    role: z
    text: 敬賢者之命也○范氏曰位曰天位
  - page: 363
    col: 8
    role: z
    text: 職曰天職禄曰天禄言天所以待賢
  - page: 363
    col: 9
    role: z
    text: 人使治天民非人君所得專者也
  - page: 363
    col: 10
    role: j
    text: 舜尚見帝帝館甥于貳室亦饗舜迭爲
  - page: 363
    col: 11
    role: j
    text: 賔主是天子而友匹夫也
  - page: 363
    col: 12
    role: z
    text: 尚上也舜上而見於帝堯也館舎也
  - page: 363
    col: 13
    role: z
    text: 禮妻父曰外舅謂我舅者吾謂之甥
  - page: 363
    col: 14
    role: z
    text: 堯以女妻舜故謂之甥貳室副宫也
  - page: 363
    col: 15
    role: z
    text: 堯舎舜於副宫而就饗其食
  - page: 363
    col: 16
    role: j
    text: 用下敬上謂之貴貴用上敬下謂之尊
  - page: 364
    col: 1
    role: j
    text: 賢貴貴尊賢其義一也
  - page: 364
    col: 2
    role: j
    text: 貴貴尊賢皆事之宜者然當時但知
  - page: 364
    col: 3
    role: j
    text: 貴貴而不知尊賢故孟子曰其義
  - page: 364
    col: 4
    role: j
    text: 一也○此言朋友人倫之一所以輔
  - page: 364
    col: 5
    role: j
    text: 仁故以天子友匹夫而不爲詘以匹
  - page: 364
    col: 6
    role: j
    text: 夫友天子而不爲僭此堯舜所以爲
  - page: 364
    col: 7
    role: z
    text: 人倫之至而孟子言必稱之也
  - page: 364
    col: 8
    role: j
    text: 萬章問曰敢問交際何心也孟子曰恭
  - page: 364
    col: 9
    role: j
    text: 也
  - page: 364
    col: 10
    role: z
    text: 際接也交際謂人以禮儀幣帛相交
  - page: 364
    col: 11
    role: z
    text: 接也
  - page: 364
    col: 12
    role: j
    text: 曰卻之卻之爲不恭何哉曰尊者賜之
  - page: 364
    col: 13
    role: j
    text: 曰其所取之者義乎不義乎而後受之
  - page: 364
    col: 14
    role: j
    text: 以是爲不恭故弗卻也
  - page: 364
    col: 15
    role: j
    text: 卻不受而還之也再言之未詳萬章
  - page: 364
    col: 16
    role: j
    text: 疑交際之間有所卻者人便以爲不
  - page: 365
    col: 1
    role: j
    text: 恭何哉孟子言尊者之賜而心竊計
  - page: 365
    col: 2
    role: j
    text: 其所以得此物者未知合義與否必
  - page: 365
    col: 3
    role: j
    text: 其合義然後可受不然則卻之矣所
  - page: 365
    col: 4
    role: z
    text: 以卻之爲不恭也
  - page: 365
    col: 5
    role: j
    text: 曰請無以辭卻之以心卻之曰其取諸
  - page: 365
    col: 6
    role: j
    text: 民之不義也而以他辭無受不可乎曰
  - page: 365
    col: 7
    role: j
    text: 其交也以道其接也以禮斯孔子受之
  - page: 365
    col: 8
    role: j
    text: 矣
  - page: 365
    col: 9
    role: j
    text: 萬章以爲彼旣得之不義則其餽不
  - page: 365
    col: 10
    role: j
    text: 可受但無以言語問而卻之直以心
  - page: 365
    col: 11
    role: j
    text: 度其不義而託於他辭以卻之如此
  - page: 365
    col: 12
    role: j
    text: 可否耶交以道如餽贐聞戒周其飢
  - page: 365
    col: 13
    role: j
    text: 餓之類接以禮謂辭命恭敬之節孔
  - page: 365
    col: 14
    role: z
    text: 子受之如受陽貨烝豚之類也
  - page: 365
    col: 15
    role: j
    text: 萬章曰今有禦人於國門之外者其交
  - page: 365
    col: 16
    role: j
    text: 也以道其餽也以禮斯可受禦與曰不
  - page: 366
    col: 1
    role: j
    text: 可康誥曰殺越人于貨閔不畏死凡民
  - page: 366
    col: 2
    role: j
    text: 罔不譈是不待教而誅者也殷受夏周
  - page: 366
    col: 3
    role: j
    text: 受殷所不辭也於今爲烈如之何其受
  - page: 366
    col: 4
    role: j
    text: 之
  - page: 366
    col: 5
    role: z
    text: 與平聲譈書作憝徒對反○禦止也
  - page: 366
    col: 6
    role: z
    text: 止人而殺之且奪其貨也國門之外
  - page: 366
    col: 7
    role: z
    text: 無人之處也萬章以爲苟不問其物
  - page: 366
    col: 8
    role: z
    text: 之所從來而但觀其交接之禮則設
  - page: 366
    col: 9
    role: z
    text: 有禦人者用其禦得之貨以禮餽我
  - page: 366
    col: 10
    role: z
    text: 則可受之乎康誥周書篇名越顚越
  - page: 366
    col: 11
    role: z
    text: 也今書閔作愍無凡民二字譈怨也
  - page: 366
    col: 12
    role: z
    text: 言殺人而顚越之因取其貨閔然不
  - page: 366
    col: 13
    role: z
    text: 知畏死凡民無不怨之孟子言此乃
  - page: 366
    col: 14
    role: z
    text: 不待教戒而當即誅者也如何而可
  - page: 366
    col: 15
    role: z
    text: 受之乎商受至爲烈十四字語意不
  - page: 366
    col: 16
    role: z
    text: 倫李氏以爲此必有斷簡或闕文者
  - page: 367
    col: 1
    role: j
    text: 近之而愚意其直為衍字耳然不可
  - page: 367
    col: 2
    role: z
    text: 考姑闕之可也
  - page: 367
    col: 3
    role: j
    text: 曰今之諸侯取之於民也猶禦也苟善
  - page: 367
    col: 4
    role: j
    text: 其禮際矣斯君子受之敢問何說也曰
  - page: 367
    col: 5
    role: j
    text: 子以為有王者作將比今之諸侯而誅
  - page: 367
    col: 6
    role: j
    text: 之乎其教之不改而後誅之乎夫謂非
  - page: 367
    col: 7
    role: j
    text: 其有而取之者盜也充類至義之盡也
  - page: 367
    col: 8
    role: j
    text: 孔子之仕於魯也魯人獵較孔子亦獵
  - page: 367
    col: 9
    role: j
    text: 較獵較猶可而況受其賜乎
  - page: 367
    col: 10
    role: z
    text: 比去聲夫音扶較音角○比連也言
  - page: 367
    col: 11
    role: z
    text: 今諸侯之取於民固多不義然有王
  - page: 367
    col: 12
    role: z
    text: 者起必不連合而盡誅之必教之不
  - page: 367
    col: 13
    role: z
    text: 改而後誅之則其與禦人之盜不待
  - page: 367
    col: 14
    role: z
    text: 教而誅者不同矣夫禦人於國門之
  - page: 367
    col: 15
    role: z
    text: 外與非其有而取之二者固皆不義
  - page: 367
    col: 16
    role: z
    text: 之類然必禦人乃為真盜其謂非有
  - page: 368
    col: 1
    role: z
    text: 而取爲盜者乃推其類至於義之至
  - page: 368
    col: 2
    role: z
    text: 精至密之處而極言之耳非便以爲
  - page: 368
    col: 3
    role: z
    text: 眞盜也然則今之諸侯雖曰取非其
  - page: 368
    col: 4
    role: z
    text: 有而豈可遽以同於禦人之盜也哉
  - page: 368
    col: 5
    role: z
    text: 又引孔子之事以明世俗所尚猶或
  - page: 368
    col: 6
    role: z
    text: 可從況受其賜何爲不可乎獵較未
  - page: 368
    col: 7
    role: z
    text: 詳趙氏以爲田獵相較奪禽獸以祭
  - page: 368
    col: 8
    role: z
    text: 孔子不違所以小同於俗也張氏以
  - page: 368
    col: 9
    role: z
    text: 爲獵而較所獲之多少也二說未知
  - page: 368
    col: 10
    role: z
    text: 孰是
  - page: 368
    col: 11
    role: j
    text: 曰然則孔子之仕也非事道與曰事道
  - page: 368
    col: 12
    role: j
    text: 也事道奚獵較也曰孔子先簿正祭器
  - page: 368
    col: 13
    role: j
    text: 不以四方之食供簿正曰奚不去也曰
  - page: 368
    col: 14
    role: j
    text: 爲之兆也兆足以行矣而不行而後去
  - page: 368
    col: 15
    role: j
    text: 是以未嘗有所終三年淹也
  - page: 368
    col: 16
    role: z
    text: 與平聲○此因孔子事而反覆辯論
  - page: 369
    col: 1
    role: z
    text: 也事道者以行道爲事也事道奚獵
  - page: 369
    col: 2
    role: z
    text: 較也萬章問也先簿正祭器未詳○
  - page: 369
    col: 3
    role: z
    text: 徐氏曰先以簿書正其祭器使有定
  - page: 369
    col: 4
    role: z
    text: 數不以四方難繼之物實之夫器有
  - page: 369
    col: 5
    role: z
    text: 常數實有常品則其本正矣彼獵較
  - page: 369
    col: 6
    role: z
    text: 者將久而自廢矣未知是否也兆猶
  - page: 369
    col: 7
    role: z
    text: 卜之兆蓋事之端也孔子所以不去
  - page: 369
    col: 8
    role: z
    text: 者亦欲小試行道之端以示於人使
  - page: 369
    col: 9
    role: z
    text: 知吾道之果可行也若其端旣可行
  - page: 369
    col: 10
    role: z
    text: 而人不能遂行之然後不得已而必
  - page: 369
    col: 11
    role: z
    text: 去之蓋其去雖不輕而亦未嘗不决
  - page: 369
    col: 12
    role: z
    text: 是以未嘗終三年留於一國也
  - page: 369
    col: 13
    role: j
    text: 孔子有見行可之仕有際可之仕有公
  - page: 369
    col: 14
    role: j
    text: 養之仕於季桓子見行可之仕也於衛
  - page: 369
    col: 15
    role: j
    text: 靈公際可之仕也於衛孝公公養之仕
  - page: 369
    col: 16
    role: j
    text: 也
  - page: 370
    col: 1
    role: z
    text: 見行可見其道之可行也際可接遇
  - page: 370
    col: 2
    role: z
    text: 以禮也公養國君養賢之禮也季桓
  - page: 370
    col: 3
    role: z
    text: 子魯卿季孫斯也衛靈公衛侯元也
  - page: 370
    col: 4
    role: z
    text: 孝公春秋史記皆無之疑出公輒也
  - page: 370
    col: 5
    role: z
    text: 因孔子仕魯而言其仕有此三者故
  - page: 370
    col: 6
    role: z
    text: 於魯則兆足以行矣而不行然後去
  - page: 370
    col: 7
    role: z
    text: 而於衛之事則又受其交際問饋而
  - page: 370
    col: 8
    role: z
    text: 不卻之一驗也○尹氏曰不聞孟子
  - page: 370
    col: 9
    role: z
    text: 之義則自好者為於陵仲子而已聖
  - page: 370
    col: 10
    role: z
    text: 賢辭受進退惟義所在愚按此章文
  - page: 370
    col: 11
    role: z
    text: 義多不可曉不必強為之說
  - page: 370
    col: 12
    role: j
    text: 孟子曰仕非為貧也而有時乎為貧娶
  - page: 370
    col: 13
    role: j
    text: 妻非為養也而有時乎為養
  - page: 370
    col: 14
    role: z
    text: 為養並去聲下同○仕本為行道而
  - page: 370
    col: 15
    role: z
    text: 亦有家貧親老或道與時違而但為
  - page: 370
    col: 16
    role: z
    text: 祿仕者如娶妻本為繼嗣而亦有為
  - page: 371
    col: 1
    role: z
    text: 不能親操井臼而欲資其餽養者
  - page: 371
    col: 2
    role: j
    text: 爲貧者辭尊居卑辭冨居貧
  - page: 371
    col: 3
    role: z
    text: 貧冨謂禄之厚薄蓋仕不爲道巳非
  - page: 371
    col: 4
    role: z
    text: 出處之正故其所處但當如此
  - page: 371
    col: 5
    role: j
    text: 辭尊居卑辭冨居貧惡乎宜乎抱關擊
  - page: 371
    col: 6
    role: j
    text: 柝
  - page: 371
    col: 7
    role: z
    text: 惡平聲柝音托○柝行夜所擊木也
  - page: 371
    col: 8
    role: z
    text: 蓋爲貧者雖不主於行道而亦不可
  - page: 371
    col: 9
    role: z
    text: 以苟禄故惟抱關擊柝之吏位卑禄
  - page: 371
    col: 10
    role: z
    text: 薄其職易稱爲所冝居也○李氏曰
  - page: 371
    col: 11
    role: z
    text: 道不行矣爲貧而仕者此其律令也
  - page: 371
    col: 12
    role: z
    text: 若不能然則是貪位慕禄而巳矣
  - page: 371
    col: 13
    role: j
    text: 孔子嘗爲委吏矣曰會計當而巳矣嘗
  - page: 371
    col: 14
    role: j
    text: 爲乘田矣曰牛羊茁壯長而巳矣
  - page: 371
    col: 15
    role: z
    text: 委烏僞反會工外反當丁浪反乘去
  - page: 371
    col: 16
    role: z
    text: 聲茁阻刮反長上聲○此孔子之爲
  - page: 372
    col: 1
    role: z
    text: 貧而仕者也委吏主委積之吏也乗
  - page: 372
    col: 2
    role: z
    text: 田主苑囿芻牧之吏也茁肥貌言以
  - page: 372
    col: 3
    role: z
    text: 孔子大聖而嘗爲賤官不以爲辱者
  - page: 372
    col: 4
    role: z
    text: 所謂爲貧而仕官卑禄薄而職易稱
  - page: 372
    col: 5
    role: z
    text: 也
  - page: 372
    col: 6
    role: j
    text: 位卑而言高罪也立乎人之本朝而道
  - page: 372
    col: 7
    role: j
    text: 不行恥也
  - page: 372
    col: 8
    role: z
    text: 朝音潮○以出位爲罪則無行道之
  - page: 372
    col: 9
    role: z
    text: 責以廢道爲恥則非竊禄之官此爲
  - page: 372
    col: 10
    role: z
    text: 貧者之所以必辭尊冨而寧處貧賤
  - page: 372
    col: 11
    role: z
    text: 也○尹氏曰言爲貧者不可以居尊
  - page: 372
    col: 12
    role: z
    text: 居尊者必欲以行道
  - page: 372
    col: 13
    role: j
    text: 萬章曰士之不託諸侯何也孟子曰不
  - page: 372
    col: 14
    role: j
    text: 敢也諸侯失國而後託於諸侯禮也士
  - page: 372
    col: 15
    role: j
    text: 之託於諸侯非禮也
  - page: 372
    col: 16
    role: z
    text: 託寄也謂不仕而食其禄也古者諸
  - page: 373
    col: 1
    role: z
    text: 侯出奔他國食其廩餼謂之寄公士
  - page: 373
    col: 2
    role: z
    text: 無爵土不得比諸侯不仕而食祿則
  - page: 373
    col: 3
    role: z
    text: 非禮也
  - page: 373
    col: 4
    role: j
    text: 萬章曰君餽之粟則受之乎曰受之受
  - page: 373
    col: 5
    role: j
    text: 之何義也曰君之於氓也固周之
  - page: 373
    col: 6
    role: z
    text: 周救也視其空乏則周卹之無常數
  - page: 373
    col: 7
    role: z
    text: 君待民之禮也
  - page: 373
    col: 8
    role: j
    text: 曰周之則受賜之則不受何也曰不敢
  - page: 373
    col: 9
    role: j
    text: 也曰敢問其不敢何也曰抱關擊柝者
  - page: 373
    col: 10
    role: j
    text: 皆有常職以食於上無常職而賜於上
  - page: 373
    col: 11
    role: j
    text: 者以爲不恭也
  - page: 373
    col: 12
    role: z
    text: 賜謂予之祿有常數君所以待臣之
  - page: 373
    col: 13
    role: z
    text: 禮也
  - page: 373
    col: 14
    role: j
    text: 曰君餽之則受之不識可常繼乎曰繆
  - page: 373
    col: 15
    role: j
    text: 公之於子思也亟問亟餽鼎肉子思不
  - page: 373
    col: 16
    role: j
    text: 悅於卒也摽使者出諸大門之外北靣
  - page: 374
    col: 1
    role: j
    text: 稽首再拜而不受曰今而後知君之犬
  - page: 374
    col: 2
    role: j
    text: 馬畜伋蓋自是臺無餽也悅賢不能舉
  - page: 374
    col: 3
    role: j
    text: 又不能養也可謂悅賢乎
  - page: 374
    col: 4
    role: z
    text: 亟去聲下同摽音杓使去聲○亟數
  - page: 374
    col: 5
    role: z
    text: 也鼎肉熟肉也卒末也摽麾也數以
  - page: 374
    col: 6
    role: z
    text: 君命來餽當拜受之非養賢之禮故
  - page: 374
    col: 7
    role: z
    text: 不悅而於其末後復來餽時麾使者
  - page: 374
    col: 8
    role: z
    text: 出拜而辭之犬馬畜伋言不以人禮
  - page: 374
    col: 9
    role: z
    text: 待己也臺賤官主使令者蓋繆公愧
  - page: 374
    col: 10
    role: z
    text: 悟自此不復令臺來致餽也舉用也
  - page: 374
    col: 11
    role: z
    text: 能養者未必能用也况又不能養乎
  - page: 374
    col: 12
    role: j
    text: 曰敢問國君欲養君子如何斯可謂養
  - page: 374
    col: 13
    role: j
    text: 矣曰以君命將之再拜稽首而受其後
  - page: 374
    col: 14
    role: j
    text: 廩人繼粟庖人繼肉不以君命將之子
  - page: 374
    col: 15
    role: j
    text: 思以為鼎肉使己僕僕爾亟拜也非養
  - page: 374
    col: 16
    role: j
    text: 君子之道也
  - page: 375
    col: 1
    role: j
    text: 初以君命來餽則當拜受其後有司
  - page: 375
    col: 2
    role: j
    text: 各以其職繼續所無不以君命來餽
  - page: 375
    col: 3
    role: j
    text: 不使賢者有亟拜之勞也僕僕煩猥
  - page: 375
    col: 4
    role: z
    text: 貌
  - page: 375
    col: 5
    role: j
    text: 堯之於舜也使其子九男事之二女女
  - page: 375
    col: 6
    role: j
    text: 焉百官牛羊倉廩備以養舜於畎畝之
  - page: 375
    col: 7
    role: j
    text: 中後舉而加諸上位故曰王公之尊賢
  - page: 375
    col: 8
    role: j
    text: 者也
  - page: 375
    col: 9
    role: j
    text: 女下字去聲○能養能舉悅賢之至
  - page: 375
    col: 10
    role: j
    text: 也唯堯舜爲能盡之而後世之所當
  - page: 375
    col: 11
    role: z
    text: 法也
  - page: 375
    col: 12
    role: j
    text: 萬章曰敢問不見諸侯何義也孟子曰
  - page: 375
    col: 13
    role: j
    text: 在國曰市井之臣在野曰草莽之臣皆
  - page: 375
    col: 14
    role: j
    text: 謂庶人庶人不傳質爲臣不敢見於諸
  - page: 375
    col: 15
    role: j
    text: 侯禮也
  - page: 375
    col: 16
    role: j
    text: 質與贄同○傳通也質者士執雉庶
  - page: 376
    col: 1
    role: j
    text: 人執贄相見以自通者也國內莫非
  - page: 376
    col: 2
    role: j
    text: 君臣但未仕者與執贄在位之臣不
  - page: 376
    col: 3
    role: j
    text: 同故不敢見也
  - page: 376
    col: 4
    role: j
    text: 萬章曰庶人召之役則往役君欲見之
  - page: 376
    col: 5
    role: j
    text: 召之則不往見之何也曰往役義也往
  - page: 376
    col: 6
    role: j
    text: 見不義也
  - page: 376
    col: 7
    role: z
    text: 往役者庶人之職不往見者士之禮
  - page: 376
    col: 8
    role: j
    text: 且君之欲見之也何爲也哉曰爲其多
  - page: 376
    col: 9
    role: j
    text: 聞也爲其賢也曰爲其多聞也則天子
  - page: 376
    col: 10
    role: j
    text: 不召師而況諸侯乎爲其賢也則吾未
  - page: 376
    col: 11
    role: j
    text: 聞欲見賢而召之也
  - page: 376
    col: 12
    role: z
    text: 爲並去聲
  - page: 376
    col: 13
    role: j
    text: 繆公亟見於子思曰古千乘之國以友
  - page: 376
    col: 14
    role: j
    text: 士何如子思不悅曰古之人有言曰事
  - page: 376
    col: 15
    role: j
    text: 之云乎豈曰友之云乎子思之不悅也
  - page: 376
    col: 16
    role: j
    text: 豈不曰以位則子君也我臣也何敢與
  - page: 377
    col: 1
    role: j
    text: 君友也以德則子事我者也奚可以與
  - page: 377
    col: 2
    role: j
    text: 我友千乘之君求與之友而不可得也
  - page: 377
    col: 3
    role: j
    text: 而况可召與
  - page: 377
    col: 4
    role: z
    text: 亟乗皆去聲召與之與平聲○孟子
  - page: 377
    col: 5
    role: z
    text: 引子思之言而釋之以明不可召之
  - page: 377
    col: 6
    role: z
    text: 意
  - page: 377
    col: 7
    role: j
    text: 齊景公田招虞人以旌不至將殺之志
  - page: 377
    col: 8
    role: j
    text: 士不忘在溝壑勇士不忘喪其元孔子
  - page: 377
    col: 9
    role: j
    text: 奚取焉取非其招不往也
  - page: 377
    col: 10
    role: z
    text: 喪息浪反○說見前篇
  - page: 377
    col: 11
    role: j
    text: 曰敢問招虞人何以曰以皮冠庶人以
  - page: 377
    col: 12
    role: j
    text: 旃士以旂大夫以旌
  - page: 377
    col: 13
    role: z
    text: 皮冠田獵之冠也事見春秋傳然則
  - page: 377
    col: 14
    role: z
    text: 皮冠者虞人之所有事也故以是招
  - page: 377
    col: 15
    role: z
    text: 之庶人未仕之臣通帛曰旃士謂已
  - page: 377
    col: 16
    role: z
    text: 仕者交龍爲旂析羽而注於旂干之
  - page: 378
    col: 1
    role: z
    text: 首曰旌
  - page: 378
    col: 2
    role: j
    text: 以大夫之招招虞人虞人死不敢往以
  - page: 378
    col: 3
    role: j
    text: 士之招招庶人庶人豈敢往哉况乎以
  - page: 378
    col: 4
    role: j
    text: 不賢人之招招賢人乎
  - page: 378
    col: 5
    role: z
    text: 欲見而召之是不賢人之招也以士
  - page: 378
    col: 6
    role: z
    text: 之招招庶人則不敢往以不賢人之
  - page: 378
    col: 7
    role: z
    text: 招招賢人則不可往矣
  - page: 378
    col: 8
    role: j
    text: 欲見賢人而不以其道猶欲其入而閉
  - page: 378
    col: 9
    role: j
    text: 之門也夫義路也禮門也惟君子能由
  - page: 378
    col: 10
    role: j
    text: 是路出入是門也詩云周道如底其直
  - page: 378
    col: 11
    role: j
    text: 如矢君子所履小人所視
  - page: 378
    col: 12
    role: z
    text: 夫音扶底詩作砥之履反○詩小雅
  - page: 378
    col: 13
    role: z
    text: 大東之篇底與砥同礪石也言其平
  - page: 378
    col: 14
    role: z
    text: 也矢言其直也視視以爲法也引此
  - page: 378
    col: 15
    role: z
    text: 以證上文能由是路之義
  - page: 378
    col: 16
    role: j
    text: 萬章曰孔子君命召不俟駕而行然則
  - page: 379
    col: 1
    role: j
    text: 孔子非與曰孔子當仕有官職而以其
  - page: 379
    col: 2
    role: j
    text: 官召之也
  - page: 379
    col: 3
    role: z
    text: 與平聲○孔子方仕而任職君以其
  - page: 379
    col: 4
    role: z
    text: 官名召之故不俟駕而行○徐氏曰
  - page: 379
    col: 5
    role: z
    text: 孔子孟子易地則皆然○此章言不
  - page: 379
    col: 6
    role: z
    text: 見諸侯之義最爲詳悉更合陳代公
  - page: 379
    col: 7
    role: z
    text: 孫丑所問者而觀之其說乃盡
  - page: 379
    col: 8
    role: j
    text: 孟子謂萬章曰一鄉之善士斯友一鄉
  - page: 379
    col: 9
    role: j
    text: 之善士一國之善士斯友一國之善士
  - page: 379
    col: 10
    role: j
    text: 天下之善士斯友天下之善士
  - page: 379
    col: 11
    role: z
    text: 言己之善蓋於一鄉然後能盡友一
  - page: 379
    col: 12
    role: z
    text: 鄉之善士推而至於一國天下皆然
  - page: 379
    col: 13
    role: z
    text: 隨其高下以爲廣狹也
  - page: 379
    col: 14
    role: j
    text: 以友天下之善士爲未足又尚論古之
  - page: 379
    col: 15
    role: j
    text: 人頌其詩讀其書不知其人可乎是以
  - page: 379
    col: 16
    role: j
    text: 論其世也是尚友也
  - page: 380
    col: 1
    role: z
    text: 尚上同言進而上也頌誦通論其世
  - page: 380
    col: 2
    role: z
    text: 論其當世行事之迹也言旣觀其言
  - page: 380
    col: 3
    role: z
    text: 則不可以不知其爲人之實是以又
  - page: 380
    col: 4
    role: z
    text: 考其行也夫能友天下之善士其所
  - page: 380
    col: 5
    role: z
    text: 友衆矣猶以爲未足又進而取於古
  - page: 380
    col: 6
    role: z
    text: 人是能進其取友之道而非止爲一
  - page: 380
    col: 7
    role: z
    text: 世之士矣
  - page: 380
    col: 8
    role: j
    text: 齊宣王問卿孟子曰王何卿之問也王
  - page: 380
    col: 9
    role: j
    text: 曰卿不同乎曰不同有貴戚之卿有異
  - page: 380
    col: 10
    role: j
    text: 姓之卿王曰請問貴戚之卿曰君有大
  - page: 380
    col: 11
    role: j
    text: 過則諫反覆之而不聽則易位
  - page: 380
    col: 12
    role: z
    text: 大過謂足以亡其國者易位易君之
  - page: 380
    col: 13
    role: z
    text: 位更立親戚之賢者蓋與君有親親
  - page: 380
    col: 14
    role: z
    text: 之恩無可去之義以宗廟爲重不忍
  - page: 380
    col: 15
    role: z
    text: 坐視其亡故不得已而至於此也
  - page: 380
    col: 16
    role: j
    text: 王勃然變乎色
  - page: 381
    col: 1
    role: z
    text: 勃然變色貌
  - page: 381
    col: 2
    role: j
    text: 曰王勿異也王問臣臣不敢不以正對
  - page: 381
    col: 3
    role: z
    text: 孟子言也
  - page: 381
    col: 4
    role: j
    text: 王色定然後請問異姓之卿曰君有過
  - page: 381
    col: 5
    role: j
    text: 則諫反覆之而不聽則去
  - page: 381
    col: 6
    role: z
    text: 君臣義合不合則去○此章言大臣
  - page: 381
    col: 7
    role: z
    text: 之義親踈不同守經行權各有其分
  - page: 381
    col: 8
    role: z
    text: 貴戚之卿小過非不諫也但必大過
  - page: 381
    col: 9
    role: z
    text: 而不聽乃可易位異姓之卿大過非
  - page: 381
    col: 10
    role: z
    text: 不諫也雖小過而不聽巳可去矣然
  - page: 381
    col: 11
    role: z
    text: 三仁貴戚不能行之於紂而霍光異
  - page: 381
    col: 12
    role: z
    text: 姓乃能行之於昌邑此又委任權力
  - page: 381
    col: 13
    role: z
    text: 之不同不可以執一論也
