# 尚書正義卷十七（孔穎達疏）：j 為經文＋孔安國注，z 為正義疏文。
sections:
  - id: juan17
    name: 卷十七
    blocks:
      - { type: j, text: "周公作《立政》。周公既致政成王，恐其怠忽，故以君臣立政為戒。" }
      - { type: j, text: "立政言用臣當共立政，故以名篇。" }
      - { type: j, text: "周公若曰：“拜手稽首，告嗣天子王矣。”順古道盡禮致敬，告成王，言：“嗣天子，今已為王矣，不可不慎。”用鹹戒於王曰：“王左右常伯、常任、準人、綴衣、虎賁。”周公用王所立政之事皆戒於王曰，常所長事、常所委任，謂三公六卿；準人平法，謂士官；綴衣掌衣服，虎賁以武力事王，皆左右近臣，宜得其人。○任，而鴆反。準，之允反。綴，徐丁衛反，又丁劣反。賁音奔。長，丁丈反，除篇末文注“以長”直良反，餘並同。周公曰：“嗚呼！休茲，知恤鮮哉！。歎此五者立政之本，知憂得其人者少。○鮮，息淺反。" }
      - { type: z, text: "“周公”至“鮮哉”○正義曰：王之大事在於任賢使能，成王初始即政，猶尚幼少，周公恐其怠忽政事，任非其人，故告以用臣之法。周公順古道而告王曰：“我敢拜手稽首，告嗣世天子成王，今已為王矣。王者當立善政，其事不可不慎。”周公既為此言，乃用王所立政之事皆戒於王曰，王之親近左右，常所長事，謂三公也；常所委任，謂六卿也；平法之人，謂獄官也；綴衣之人，謂掌衣服者也；虎賁，以武力事王者；此等皆近王左右，最須得人。周公既歷言此官，復言而歎曰：“嗚呼，美哉！此五等之官，立政之本也。知憂此官宜得賢人者少也。”○傳“順古”至“不慎”○正義曰：周公既拜手稽首，而後發言。還自言“拜手稽首”，示己重其事，欲令受其言，故盡禮致敬以告王也。《召誥》雲：“拜手稽首，旅王若公。”亦是召公自言已拜手稽首，與此同也。成王嗣世而立，故呼成王為“嗣天子”。周公攝政之時，成王未親王事，此時既已歸政於成王，故言“今已為王矣，不可不慎”也。王肅以為於時周公會群臣共戒成王，其言曰“拜手稽首”者，是周公贊群臣之辭。○傳“周公”至“其人”○正義曰：此以“立政”名篇，知“用鹹戒”者是“周公用王所立政之事皆戒於王”也。三公，臣之尊者，知常所長事謂三公也。六卿分掌國事，王之所任，知常所委任謂六卿也。“準”訓平也，平法之人謂士官也。士，察也，察獄之官用法必當均平，故謂獄官為準人。《周禮》司寇之長在常任之內，此士官當謂士師也。衣服必連綴著之，此歷言官人，知“綴衣”是掌衣服者。此言親近大臣，必非造衣裳者。《周禮》：“大僕，下大夫。掌正王之服位，出入王之大命。”此掌衣服者，當是大僕之官也。《周禮》：“虎賁氏，下大夫。”言其若虎賁獸，是以武力事王者。此皆左右近臣，宜得其人，言其急於餘官。得其人者，文官得其文人，武官得其武人，違才易務，皆為非其人也。○傳“歎此”至“者少”○正義曰：此五官皆親近王，故歎此五者立政之本也。“休”，美也。王肅雲“此五官美哉”，是“休茲”為美此五官也。歎其官之美，美官不可不委賢人用之，故歎之。“知憂得其人者少”，下句惟言禹、湯、文、武官得其人，是知憂得人者少也。" }
      - { type: j, text: "古之人迪惟有夏，乃有室大競，籥俊尊上帝，古之人道惟有夏禹之時，乃有卿大夫室家大強，猶乃招呼賢俊，與共尊事上天。○籥音預。迪知忱恂於九德之行。禹之臣蹈知誠信於九德之行，謂賢智大臣。九德，皋陶所謀。○忱，市林反。恂音荀。行如字，徐下孟反。乃敢告教厥後曰：‘拜手稽首，後矣！’曰，宅乃事，宅乃牧，宅乃準，茲惟後矣。知九德之臣乃敢告教其君以立政。君矣，亦猶王矣。宅，居也，居汝事，六卿掌事者。牧，牧民，九州之伯。居內外之官及平法者皆得其人，則此惟君矣。謀面，用丕訓德，則乃宅人，茲乃三宅無義民。謀所面見之事，無疑則能用大順德，乃能居賢人於眾官。若此則乃能一居無義民。大罪宥之四裔，次九州之外，次中國之外。桀德惟乃弗作往任，是惟暴德，罔後。桀之為德，惟乃不為其先王之法、往所委任，是惟暴德之人，故絕世無後。" }
      - { type: z, text: "“古之人”至“罔後”○正義曰：既言知憂得人者少，乃遠述上世之事，此言禹與桀也。古之人能用此求賢之道者，惟有夏禹之時。乃有群臣卿大夫皆是賢人，室家大強，猶尚招呼賢俊之人，與共立於朝，尊事上天。禹之臣蹈知誠信於九德之行者，乃敢告教其君曰：“我敢拜手稽首，君今已為君矣，不可不慎也。”戒其君即告曰，居汝掌事之六卿，居汝牧民之州伯，居汝平法之獄官，使此三者皆得其人，則此惟為君矣。言不得賢人，不成為君也。禹能謀所面見之事，無所疑惑，用大明順之德，則乃能居賢人於官。賢人在官，職事修理，乃能三處居無義之民。善人在朝，惡人黜遠，其國乃為治矣。及其末年，桀乃為天子。桀之為德，惟乃不為其先王之法、往所委任，是暴德之人。以此故，絕世無後。得賢人則興，任小人則滅，是須官賢人以立政也。○傳“古之”至“上天”○正義曰：經言“古之人迪”，傳言“古之人道”，當說古之求賢人之道也。王肅雲：“古之人道，惟有夏之大禹為天子也。”其意言古人之道說有此事，孔意似不然也。孔以“大夫”稱家室，猶家也。“籥”訓呼也，招呼者乃是臣下之事，故以為夏禹之時，乃有卿大夫室家大強，猶乃招呼在外賢俊，與之共立於朝，尊事上天也。言君既求賢臣之助，言天子事天，臣成君事，故言“共尊事上天”。○傳“禹之”至“所謀”○正義曰：九德之行，非一人能備，言禹之臣蹈知九德之行，極言其賢智大臣也。禹時伯益之輩，乃可以當此。經典之文，更無九德之事，惟有皋陶謀九德，故言九德。皋陶所謀者，即“寬而栗，柔而立，愿而恭，亂而敬，擾而毅，直而溫，簡而廉，剛而塞，強而義”是也。○傳“知九”至“君矣”○正義曰：進言戒君非大賢不可，故“知九德之臣乃敢告教其君以立政”也。“君矣”亦猶言“王矣”，言已為君矣，不可不慎也。“君”、“王”一也，變文以相避爾。“宅”訓居也，居汝事，須得賢人，六卿各掌其事者也。居汝牧，九州之伯主養民，亦須得賢人養其民也。居汝準，士官主理刑法，亦須賢人平其獄也。六卿掌內，州牧掌外，內外之官及平法三事皆得其人，則此惟為君矣。言群官失職，則不成為君也。上句周公戒王，歷言五官，其內無州牧。此惟言三官，加州牧者，俱是逐急言之，其有詳略爾。《曲禮》雲：“九州之長曰牧。”《王制》雲：“千里之外設方伯，八州八伯。”然則“牧”、“伯”一也。“伯”者言一州之長，“牧”者言牧養下民，“牧”、“伯”俱得言之，故孔以“伯”解“牧”。鄭玄雲：“殷之州牧曰伯，虞夏及周曰牧。”與孔不同。○傳“謀所”至“之外”○正義曰：凡人為主，皆欲臣賢，但大佞以忠，賢不可別。欲知其遠，先驗於近，但禹能謀所面見之事。官賢人，既得其官，分別善惡，無所疑惑。仁賢必用，邪佞必退，然後舉直錯諸枉，則為能用大順德，如是乃能居賢人於眾官。賢人既得居官，則能分別善惡，無義之民必獲大罪。量其輕重，斥之遠地，乃能三處居此無義罪人。三居者，“大罪宥之四裔，次九州之外，次中國之外。”“四裔”者，四海之表最遠者也。“次九州之外者”，四海之內，要服之外。“次中國之外”者，謂罪人所居之國外也，猶若衛人居於晉，去本國千里。故孔注《舜典》雲：“次千里之外是也。”鄭雲：“三處者，自九州之外至於四海，三分其地，遠近若周之夷、鎮、蕃也。”與孔不同。" }
      - { type: j, text: "亦越成湯陟，丕釐上帝之耿命，桀之昏亂，亦於成湯之道得升，大賜上天之光命，王天下。○釐，力之反。耿，工迥反，徐工穎反，又工永反，下同。王，往況反。乃用三有宅，克即宅，曰三有俊，克即俊。湯乃用三有居惡人之法，能使就其居。言服罪。又曰，能用剛柔正直三德之俊，能就其悛事。言明德。嚴惟丕式，克用三宅三俊。言湯所以能嚴威，惟可大法象者，以能用三居三德之法。其在商邑，用協於厥邑，其在四方，用丕式見德。湯在商邑，用三宅三俊之道和其邑。其在四方，用是大法見其聖德。言遠近化。" }
      - { type: z, text: "“亦越”至“見德”○正義曰：不有所廢，則無以興。桀之滅亡，夏家乃以開道湯德。此言湯之能用人也。桀之昏亂，亦於成湯之道得升聞於天，大賜受上天之光命，得王有天下。湯既為王，乃用三有居惡人之法，能使各就其居處。言皆服其罪也。又曰用三德之俊人，能使各就其俊事。言皆明其德也。湯所以能嚴威，惟可大法象者，以其能用三居三俊之法故也。成湯其在商邑，用此三居三俊之道，和於其邑。其在四方，用是斷罪任賢之大法，見其聖德於民。言遠近皆從化也。○傳“桀之”至“天下”○正義曰：“成湯之道得升”，謂從下而升於天，故天賜之以光命，使之得王天下為天子也。“釐，賜”、“耿，光”皆《釋詁》文。○傳“湯乃”至“明德”○正義曰：《皋陶謨》“九德”即《洪範》之“三德”，細分以為九爾。以此知“三俊”即是《洪範》所言“剛克、柔克、正直”三德之俊也。“能就其俊事。言明德”者，用以俊乂居官，顯明其有德也。上句言“則乃宅人，茲乃三宅無義民”，先言用賢，後言去惡。此經先言“三有宅”，後言“曰三有俊”者，用賢去惡，俱是立政之本。上句先說夏禹，言得賢然後去惡，見其須賢之切。及說成湯、文、武，先言去惡，後言用賢，又見惡宜速去。或先或後，所以互相見爾。" }
      - { type: j, text: "嗚呼！其在受德暋，惟羞刑暴德之人，同於厥邦。受德，紂字。帝乙愛焉，為作善字，而反大惡自強，惟進用刑，與暴德之人同於其國，併為威虐。○受德，紂字，馬雲：“受所為德也。”暋，眉謹反，徐亡巾反，一音閔。為，於為反，下“為之”同。強，其丈反。乃惟庶習逸德之人，同於厥政。乃惟眾習為過德之人，同於其政。言不任賢。帝欽罰之，乃伻我有夏，式商受命，奄甸萬姓。天以紂惡，故敬罰之。乃使我周家王有華夏，得用商所受天命，同治萬姓。言皇天無親，佑有德。○伻，普耕反，徐敷耕反，又甫耕反。" }
      - { type: z, text: "“嗚呼”至“萬姓”○正義曰：既言湯以用賢而興，又說紂之失人而滅。周公又歎曰：“嗚呼！其在殷王受德，本性大惡自強，惟進用刑罰，與暴德之人同治其國，併為威虐。乃惟眾習為過德之人，與之同共於其政。由其任同惡之人，故上天敬誅罰之，乃使我周家王有華夏，用商所受天命，同治天下萬姓。”言周能用賢，天親有德，故得為天子。○傳“受德”至“威虐”○正義曰：《泰誓》三篇，惟單言“受”，而此雲“受德”者，則“德”本配“受”，共為一人，故知“受德”是紂字也。既“受”之與“德”共為紂字，而經或言“受”，或言“受德”者，呼之有單復爾。其人實為大惡，“德”字乃為善名，非是時人呼有德。知是帝乙愛焉，為作善字，望其為善，而反為大惡，以其行反其字，明非時人呼也。《釋詁》雲：“暋，強也。”“暋”即昏也，故訓為強，言紂自強為惡，惟進用刑罰。身既進用刑罰，則愛好暴虐之人，故為與之同於其國，言併為威虐。○傳“乃惟”至“任賢”○正義曰：“暴德”言以暴虐為德，“逸德”言以過惡為德。習效為之眾者，言其所任多也。紂任眾為過德之人，與之同於其政，言其不任賢也。與暴德同於其國，與惡德同於其政，其事一也，異言之爾。《牧誓》所云“四方之多罪逋逃，是信是使，是以為大夫卿士。俾暴虐於百姓，以奸究於商邑”，是其事也。○傳“天以”至“有德”○正義曰：言天知其惡，熟詳審下罰，故言“敬罰”也。商本受天命，周亦受天命，故言“用商所受天命，同治萬姓”。《釋言》雲：“弇，同也。”同為天於治萬姓，與商同也。此經之意，言周家有德，皇天親有德也。王肅雲：“敬罰者，謂須暇五年。”" }
      - { type: j, text: "“亦越文王、武王，克知三有宅心，灼見三有俊心，紂之不善，亦於文武之道大行，以能知三有居惡人之心，灼然見三有賢俊之心。以敬事上帝，立民長伯。言文武知三宅三俊，故能以敬事上天，立民正長。謂郊祀天，建諸侯。" }
      - { type: z, text: "“亦越”至“長伯”○正義曰：既言上天去惡與善，滅殷興周，即說文王、武王能用求賢審官之事。桀惡所以興成湯，紂惡所以開文武，言紂之不善，亦於文王、武王使得其道大行。能知居三有惡人之心，居之皆得其所，言服其罪也。灼然見三有賢俊之心，用之皆得其人，言明其德也。文武知此三宅三俊，故能敬事上天，稱天心也。立民正長，合民心也。○傳“紂之”至“之心”○正義曰：桀之昏亂開成湯，紂之不善開文武，其事同也。於成湯言能受上天之命，於文武雲能敬事上帝，前聖後聖為行必同，交錯為文，所以互相見爾。文王受命，武王伐紂，二聖共成王道，故文武總言之。猶《詩序》雲“文武以《天保》已上治內，《采薇》已下治外”，文武並言，與此同也。文王之時，未定天下，所立之官，亦未具足。下經所言“立政任人”已下，“三亳阪尹”已上，其所舉官屬，多是文武時事，以見二聖同道，父作之，子述之，言其相成爾。故以“能知三有居惡人之心，灼然見三有賢俊之心”，言文王之聖心能揆度知惡人真惡，須屏黜之；知賢人實賢，須舉用之；故去惡進賢，皆得其所。賢人難識，故特言“灼然”，言其知之審也。○傳“言文”至“諸侯”○正義曰：上天之道，與善去惡，三宅三俊，行合天心。言文武知三宅三俊，故能敬事上帝。“伯”亦長也，故言“立民正長”。天子祭天，知“敬事上帝”，謂“郊祀天”也。天子建國，知“立民長伯”，謂“建諸侯”也。以下句“立政任人”已下，歷言朝廷之臣與蠻夷眾君，知此“立民長伯”主謂諸侯。《詩·周頌·維清》述文王之德言“肇禋”，《大雅·皇矣》美文王之伐言“是類”，“類”、“禋”皆是祭天之名，是文王已祀天矣。文王未得封建諸侯，其建諸侯，維武王時爾。" }
      - { type: j, text: "立政，任人、準夫、牧，作三事，文武亦法禹湯以立政，常任、準人及牧，治為天地人之三事。虎賁、綴衣、趣馬小尹，趣馬，掌馬之官。言此三者雖小官長，必慎擇其人。○趣，七口反。左右攜僕、百司庶府，雖左右攜持器物之僕，及百官有司主券契藏吏，亦皆擇人。○券音勸。契，苦計反。藏，才浪反。大都小伯、藝人表臣、百司，小臣猶皆慎擇其人，況大都邑之小長，以道藝為表幹之臣及百官有司之職，可以非其任乎？太史、尹伯、庶常吉士，太史，下大夫，掌邦六典之貳；尹伯，長官大夫；及旅掌常事之善士，皆得其人。司徒、司馬、司空、亞旅，此有三卿及次卿眾大夫，則是文武未伐紂時。舉文武之初以為法則。夷微、盧烝、三亳、阪尹。蠻夷微、盧之眾帥，及亳人之歸文王者，三所為之立監，及阪地之尹長，皆用賢。○阪音反。" }
      - { type: z, text: "“立政”至“阪尹”○正義曰：言文武亦法禹湯，審官以立美政。“任人”謂六卿。“準夫”者，平法之人，謂理獄官也。“牧”者，九州之牧。治為天地人之三事。自“虎賁”已下，歷舉官名，言此官皆須得其人。不以官之尊卑為次，蓋以從近而至遠。虎賁、綴衣、趣馬，三者官雖小，須慎擇其人。乃至左右攜持器物之僕，及百官有司之下至眾府藏之吏，亦須擇其人。既言近王小官，及遠官大者。小官猶須擇人，況乎大都邑之小長，與有道藝之人為表幹之臣，及百官有司之職，可以非其任乎？以近臣況遠臣，以小官況大官。既以近小況遠大，又舉官之次而掌事要者。若太史下大夫、長官大夫及眾掌常事之善士，皆須得其人。更舉官之大者，司徒、司馬、司空之卿，及次卿之眾大夫，皆須得其人。既略言內外之官，又更遠及夷狄蠻夷微、盧之眾帥，與三處亳民之監，及阪地之尹長，皆須用賢人。言文武於此諸官，皆求賢人為之也。○傳“文武”至“三事”○正義曰：前聖後聖，其道皆同，未必相放法也。後人法前，自是常事，因其上說禹湯立政，故言“文武亦法禹湯以立政”也。“任人”則前經所云“常任”六卿也，“準夫”則“準人”也，“牧”者前雲“宅乃牧”也。前文有“常伯”、“綴衣”、“虎賁”，不言“牧”，此不言“常伯”、“綴衣”、“虎賁”而言“牧”者，以前文先舉朝臣，故不言“牧”，前已備文，故此不言“常伯”。其“綴衣”、“虎賁”而言“牧”者，以下文自詳，故此惟舉內外要官者言之，故內官舉“任人”、“準夫”，外官舉“牧”。故下雲：“繼自今，我立政。立事、準人、牧夫，我其克灼知厥若。”又云：“自古商人，亦越我周文王立政、立事、牧夫、準人，則克宅之，克由繹之，茲乃俾乂。”皆據內外要重官以言之。“夫”即人也，立官所以事天地，治人民，為此三事而已，故以“三事”謂天地人也。王肅雲：“文王所以立政，任人，常任也；準夫，準人也；牧者，諸侯之長也。”與孔意同。○傳“趣馬”至“其人”○正義曰：《周禮》趣馬為校人屬官，馬一十二匹，立趣馬一人，“掌贊正良馬，而齊其飲食”，是掌馬之小官也。綴衣是大僕也，虎賁、大僕皆下大夫也。此三公六卿，亦為小尹之官。雖文止三官，亦包通在下之屬官。三官之下小官多矣，趣馬即下士，其馬一匹，有圉師一人，是趣馬之下猶有小官也。○傳“雖左”至“擇人”○正義曰：諸官有所務從業，從王左右攜持器物之僕，謂寺人、內小臣等也。“百司庶府”，謂百官有司之下，主券契府藏之吏，謂其下賤人，非百官有司之身也。言此等亦皆擇人。○傳“小臣”至“任乎”○正義曰：“小臣猶皆擇人，況大都邑之小長”，謂公卿，都邑之內大夫士及邑宰之屬，以身有道藝、為民之表的楨幹之臣。其都邑之內屬官，謂之“小長”。《周禮·太宰職》雲：“乃施則于都鄙，而建其長，立其兩，設其伍，陳其殷。”“兩”謂兩卿，“長”謂公卿，“伍”謂大夫，“殷”謂眾士是也。○傳“太史”至“其人”○正義曰：《周禮》“太史，下大夫二人”，“掌建邦之六典”。又《太宰職》亦云“掌建邦之六典”。太史副貳，太宰掌其正，太史掌其貳。“六典”謂治典、教典、禮典、政典、刑典、事典，六卿所掌者也。“掌邦六典之貳”，其所掌事重，故特言之。“尹伯”，長官大夫。《周禮》每官各有長，若太史為史官之長，大司樂為樂官之長，如此類皆是也。“及眾掌常事之善士”，謂士為長官者。其大夫及士不為長官者，則前雲“百司”也。居官必須善人，此是總舉眾官，故特言“吉士”。○傳“此有”至“法則”○正義曰：周公攝政之時，制禮作樂，其作《立政》之篇，必在制禮之後。《周禮》六卿，而“此有三卿及次卿眾大夫”，則是副卿之大夫，有若《周禮》小宰之類是也。此文武未伐紂之時也，遠舉文武之初以為法則爾。《泰誓》下篇雲“王乃大巡六師”，“六師”則六軍也，軍將皆命卿，即伐紂之時已立六卿矣。《牧誓》亦云“司徒、司馬、司空”，舉之三卿者，彼傳已解之雲“指誓戰者”也。○傳“蠻夷”至“用賢”○正義曰：《牧誓》所云，有“微、盧、彭、濮人”，此舉“夷微、盧”以見彭、濮之等諸夷也。“烝”訓眾也。此篇所言，皆立官之事，此經惟“阪”下言“尹”，則“夷、微”已下以一“尹”總之，故傳言“蠻夷微、盧之眾帥，及亳民之歸文王者，三所為之立監，及阪地之尹長”。故言“帥”，言“監”，亦是言為之立長，義出經文“尹”也。“亳”是湯之舊都，此言“三亳”，必是亳民分為三處。此篇說立官之意，明是分為三亳，必是三所各為立監也。“亳民之歸文王”，經傳未有其事，文王既未伐紂，亳民不應歸之。鄭、王所說皆與孔同。言亳民歸文王者，蓋以此章雜陳文王、武王時事，其言以文王為主，故先儒因言亳民歸文王爾。即如此意，三亳為已歸周，必是武王時也。“及阪地之尹長”，傳言其山阪之地立長爾，不知其指斥何處也。鄭玄以“三亳阪尹”者共為一事，雲：“湯舊都之民服文王者，分為三邑，其長居險，故言阪尹。蓋東成皋，南轘轅，西降谷也。”皇甫謐以為“三亳，三處之地，皆名為亳。蒙為北亳，穀熟為南亳，偃師為西亳”。古書亡滅，既無要證，未知誰得旨矣。" }
      - { type: j, text: "文王惟克厥宅心，乃克立茲常事司牧人，以克俊有德。文王惟其能居心遠惡舉善，乃能立此常事司牧人，用能俊有德者。○遠，於萬反。文王罔攸兼於庶言，庶獄庶慎，惟有司之牧夫。文王無所兼知於譭譽眾言，及眾刑獄，眾當所慎之事，惟慎擇有司牧夫而已。勞於求才，逸於任賢。○譽音餘，又如字。是訓用違，庶獄庶慎，文王罔敢知於茲。是萬民順法，用違法，眾獄眾慎之事，文王一無敢自知於此，委任賢能而已。" }
      - { type: z, text: "“文王”至“於茲”○正義曰：上既總言文武，此又分而說之。文王惟能其居心遠惡舉善，乃能立此常事其主養人之官，用能俊有德者。既任用俊人，每事委之，文王無所兼知於眾人之言，或毀或譽，文王皆不知也。眾獄斷罪得失，文王亦不得知也。眾所當慎之事，文王亦不得知也。惟慎擇在朝有司，在外牧養民之夫。是時萬民或順於法，或用違法，眾刑獄，眾所慎之事，文王一皆無敢自知於此，惟委任賢能而已。○傳“文王”至“德者”○正義曰：上言文王能知三宅三俊，知此言“能居心”者，以遠惡舉善居其心也。既遠惡舉善，乃能立此常事，用賢養民，是人君之常事也。○傳“文王”至“任賢”○正義曰：下雲“是訓用違”，即是在上“庶言”也。“是訓”則稱譽之事，“用違”則毀損之事，但分析言之爾。" }
      - { type: j, text: "亦越武王，率惟敉功，不敢替厥義德，亦於武王循惟文王無安天下之功，不敢廢其義德，奉遵父道。○敉，亡婢反。率惟謀從容德，以並受此丕丕基。武王循惟謀從文王寬容之德，故君臣並受此大大之基業，傳之子孫。○傳，直專反。" }
      - { type: z, text: "“亦越”至“丕基”○正義曰：亦於武王遵循父道，所循惟文王撫安天下之功，不敢廢其文王義德。言奉行遵父道也。又言武王遵循者，惟謀從文王寬容之德，故武王君臣能並受此大大之基業。謂受命為天子，傳之子孫。○傳“武王”至“子孫”○正義曰：以言“並受”，則非獨王身，故以為“君臣並受此大大之基業”。謀從寬容之德，是與臣謀，及基業成就，則君臣共有，故言“並受”。且王為天子，臣為諸侯，皆受基業，各傳子孫，是亦為“並受”也。" }
      - { type: j, text: "“嗚呼！孺子王矣。歎稚子今以為王矣，不可不勤法祖考之德。繼自今，我其立政、立事、準人、牧夫，我其克灼知厥若，丕乃俾亂。繼用今已往，我其立政大臣、立事小臣、及準人、牧夫，我其能灼然知其順者，則大乃使治之。言知臣下之勤勞，然後莫不盡其力。○俾，必爾反，下同。治，直吏反，下同。相我受民，和我庶獄庶慎，時則勿有間之。能治我所受天民，和平我眾獄眾慎之事，如是則勿有以代之。言不可復變。○相如字，馬息亮反，下“勱相”同。間，間廁之間。復，扶又反。自一話一言，我則末惟成德之彥，以乂我受民。言政當用一善，善在一言而已。欲其口無擇言。如此我則終惟有成德之美，以治我所受之民。○話，戶怪反。" }
      - { type: z, text: "“嗚呼孺子”至“受民”○正義曰：周公既歷說禹湯文武，乃復指戒成王，“嗚呼”而歎，孺子今已為王矣。既正位為王，事不可不慎。繼續從今已往，我王其與立政，謂大臣也，其與立事，謂小臣也，平法之人及養民之夫，此等諸臣，我王其能察之灼然，知其順於事者，則大乃使之治理。言知其能有勤勞，各盡心力。然後用此賢臣治我所受天民，和平我眾獄訟，及眾當所慎之事，必能如是，則勿復有以代之。言其法不可復變也。政從君出，為人主用是一善之言，善在一言而已，勿以惡言亂之。王能如是，我王則終惟有成德之美，以治我所受天民矣。○傳“繼用”至“心力”○正義曰：自此已下四言“繼自今”者，凡人靡不有初，鮮克有終，恐王不能終之，戒成王使繼續，從今已往常用賢也。“自”訓為從，亦訓為用，此傳言“用今已往”，下傳言“從今已往”，其意同也。“政”、“事”相對，則“政”大“事”小，故以“立政”為大臣，“立事”為小臣。及“準人”、“牧夫”，略舉四者以總諸臣，戒王任此人也。其能灼然知其能順於事者，則大乃使治。顧氏雲：“君能知臣下順於事，則臣感君恩，大乃治理，各盡心力也。”○傳“能治”至“復變”○正義曰：“相”訓助也，助君所以治民事，故“相”為治。天命王者，使之治民，則天與王者此民，故言“能治我所受天民”也。能治下民，理眾獄眾慎之事，使得其所，則為政之大要，能如此，則勿有以代之。言此法盡善，不可復變易也。或據臣身既能如此，不可以餘人代之也。○傳“言政”至“之民”○正義曰：《釋詁》雲：“自，用也。話，言也。”舍人曰：“話，政之善言也。”孫炎曰：“話善之言也。”然則“話”之與“言”是一物也。“自一話”者，言人君為政，當用純一善言。又云“一言”者，純一善言，在於一言而已。謂發號施令，當須純一，不得差貳，欲令其口無可擇之言也。顧氏雲：“人君為政之道，當須用一善而已，為善之法，惟在一言也。‘末’訓為終，‘彥’訓為美，王能出言皆善，口無可擇，如此我王則終惟有成德之美，以治我所受天民矣。”《釋訓》雲：“美士為彥。”故“彥”為美。" }
      - { type: j, text: "嗚呼！予旦已受人之徽言，鹹告孺子王矣。歎所受賢聖說禹湯之美言，皆以告稚子王矣。○稚，直吏反，本亦作。繼自今，文子文孫，其勿誤於庶獄庶慎，惟正是乂之。文子文孫，文王之子孫。從今已往，惟以正是之道治眾獄眾慎，其勿誤。自古商人，亦越我周文王立政、立事、牧夫、準人，則克宅之，克由繹之，茲乃俾乂。言用古商湯，亦於我周文王立政立事，用賢人之法，能居之於心，能用陳之，此乃使天下治。○繹音亦。" }
      - { type: z, text: "“嗚呼”至“俾乂”○正義曰：“旦”者，周公名也。周公又歎曰：“嗚呼！我旦已受賢聖人說禹湯之美言，皆以告孺子王矣，王宜依行之。繼續從今以往，文王之子孫，其勿得過誤於眾獄訟眾所慎之事，惟當用是正是之道治之。用古商人成湯，亦於我周家文王其立政、立事、牧夫、準人此等諸官，皆用賢人之法，則能居之於心，能用陳之於位，明識賢人，用之為官，此乃使天下大治。”戒成王使法之。○傳“言用”至“下治”○正義曰：上陳禹湯文武，此覆上文，惟言湯與文王者，言有詳略，無別意也。“能居之於心”，謂心知其賢也。“能用陳之”，謂陳列於位，用之以為官也。王肅曰：“則能居之在位，能用陳其才力，如此故能使天下治也。”" }
      - { type: j, text: "國則罔有立政用憸人，不訓於德，是罔顯在厥世。商周賢聖之國，則無有立政用憸利之人者。憸人不訓於德，是使其君無顯名在其世。○憸，息廉反，徐七漸反，本又作，馬雲：“憸利，佞人也。”繼自今立政，其勿以憸人，其惟吉士，用勱相我國家。立政之臣，惟其吉士，用勉治我國家。○勱音邁。" }
      - { type: z, text: "“國則”至“國家”○正義曰：既言湯與文王用賢大治，又言其不宜用小人。商周聖賢之國，無有立政用憸利之人者。此憸利之人不順於德，若其用之，是使其君無顯名在其世也。王當繼續從今已往立其善政，其勿用憸利之人，其惟任用善士，使勉力治我國家。教王使用善士，勿使小人也。" }
      - { type: j, text: "今文子文孫，孺子王矣。告文王之子孫，言稚子已即政為王矣，所以厚戒。其勿誤於庶獄，惟有司之牧夫。獨言眾獄、有司，欲其重刑，慎官人。其克詰爾戎兵，以陟禹之跡，其當能治汝戎服兵器，威懷並設，以升禹治水之舊跡。○詰，起一反，馬雲：“賓也。”方行天下，至於海表，罔有不服，方，四方。海表，蠻夷戎狄，無不服化者。以覲文王之耿光，以揚武王之大烈。能使四夷賓服，所以見祖之光明，揚父之大業。嗚呼！繼自今，后王立政，其惟克用常人。”其惟能用賢才為常人，不可以天官有所私。" }
      - { type: z, text: "“今文”至“常人”○正義曰：今告汝文王之子，文王之孫，孺子今已即政為王矣，我所以須厚戒之。王其勿誤於眾治獄之官，當須慎刑也。惟有司之牧夫，有司主養民者，宜得賢也。治獄之吏，養民之官，若任得其人，使其能治汝戎服兵器，以此升行禹之舊跡，四方而行，至於天下，至於四海之表，無有不服王之化者，以顯見文王之光明，以播揚武王之大業。言任得賢臣，則光揚父祖。周公又歎曰：“嗚呼！繼續從今已往，後世之王，立行善政，其惟能用常人，必使常得賢人，不可任非其才，此雖有戒成王，乃是國之常法，因以戒后王，言此法可常行也。○傳“獨言”至“官人”○正義曰：上有“庶慎”、“立政”、“立事”、“牧夫”、“準人”，此獨言“庶獄”與“有司之牧夫”者，言“庶獄”欲其重刑，言“有司牧夫”欲其慎官人也。○傳“其當”至“舊跡”○正義曰：立官所以牧養下民，戒備不虞，故以“詰爾戎兵”為言也。“戎”亦“兵”也，以其並言“戎兵”，故傳以為“戎服兵器，威懷並設，以升禹治水之舊跡”。遠行必登山，故以“陟”言之。如舜之“陟方”，意亦然。○傳“方四”至“化者”○正義曰：“方行天下”，言無所不至，故以“方”為四方。《釋地》雲：“九夷、八狄、七戎、六蠻謂之四海。”知“海表”謂“夷狄戎蠻，無有不服化者”。即《詩·小雅》雲“《蓼蕭》，澤及四海”是也。○傳“其惟”至“所私”○正義曰：官須常得賢人，故惟賢是用。用賢是常，常則非賢不可。人主或知其不賢，以私受用之，代天為官，故言“不可以天官有所私”。" }
      - { type: j, text: "周公若曰：“太史，順其事並告太史。司寇蘇公，式敬爾由獄，以長我王國。忿生為武王司寇，封蘇國，能用法。敬汝所用之獄，以長施行於我王國。言主獄當求蘇公之比。○比，必二反，又如字。茲式有慎，以列用中罰。”此法有所慎行，必以其列用中罰，不輕不重，蘇公所行。太史掌六典，有廢置官人之制，故告之。○行如字。" }
      - { type: z, text: "“周公”至“中罰”○正義曰：周公順其事而言曰：“太史。”以其太史掌廢置官人，故呼而告之：“昔日司寇蘇公既能用法，汝太史當敬汝所用之獄，以長施行於我王國。”欲使太史選主獄之官，當求蘇公之比也。“此刑獄之法，有所慎行，必以其體式，列用中常之罰，不輕不重，當如蘇公所行也”。○傳“忿生”至“之比”○正義曰：成十一年《左傳》雲：“昔周克商，使諸侯撫封，蘇忿生以溫為司寇。”是“忿生為武王司寇，封蘇國”也。“蘇”是國名，所都之地其邑名“溫”，故傳言“以溫”也。特舉蘇公治獄官以告太史，知其言主獄之官當求蘇公之比類也。○傳“此法”至“告之”○正義曰：治獄必有定法，此定法有所慎行。《周禮·大司寇》雲：“刑新國用輕典，刑平國用中典，刑亂國用重典。”輕重各有體式行列，周公言然之時，是法為平國，故必以其列用中罰，使不輕不重。美蘇公治獄，使列用中罰，明中罰不輕不重，是蘇公所行也。《周禮》太宰“以八柄詔王，馭群臣”，有爵、祿、廢、置、生、殺、與、奪之法。太史亦掌邦之六典，以副貳太宰，是太史有廢置官人之制，故特呼而告之也。" }
      - { type: j, text: "《尚書正義》" }
