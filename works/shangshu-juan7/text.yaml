# 尚書正義卷七（孔穎達疏）：j 為經文＋孔安國注，z 為正義疏文。
sections:
  - id: juan7
    name: 卷七
    blocks:
      - { type: j, text: "羲和湎淫，廢時亂日，羲氏、和氏，世掌天地四時之官，自唐虞至三代，世職不絕。承太康之後，沈湎於酒，過差非度，廢天時，亂甲乙。○湎，徐音緬，面善反。差，初賣反，又初佳反。胤往徵之，作《胤徵》。胤國之君受王命往徵之。○胤，國名。" }
      - { type: j, text: "胤徵奉辭罰罪曰徵。" }
      - { type: z, text: "“羲和”至“胤徵”○正義曰：羲氏、和氏，世掌天地四時之官，今乃沈湎於酒，過差非度，廢天時，亂甲乙，不以所掌為意，胤國之侯受王命往徵之。史敘其事，作《胤徵》。○傳“羲氏”至“甲乙”○正義曰：“羲氏、和氏世掌天地四時之官”，《堯典》所言是其事也。羲和是重黎之後，《楚語》稱堯育重黎之後，使典天地，以至於夏商，是“自唐虞至三代，世職不絕”，故此時羲和仍掌時日。以太康逸豫，臣亦縱弛。此承太康之後，於今仍亦懈惰，沈湎於酒，過差非度，廢天時，亂甲乙，是其罪也。經雲“酒荒於厥邑”，惟言荒酒，不言好色，故訓“淫”為過，言耽酒為過差也。聖人作歷數以紀天時，不存歷數，是“廢天時”也。日以甲乙為紀，不知日食，是“亂甲乙”也。○傳“奉辭罰罪”○正義曰：奉責讓之辭，伐不恭之罪，名之曰“徵”。徵者，正也。伐之以正其罪。" }
      - { type: j, text: "惟仲康肇位四海，羿廢太康，而立其弟仲康為天子。○肇音兆。胤侯命掌六師。仲康命胤侯掌王六師，為大司馬。羲和廢厥職，酒荒於厥邑，舍其職官，還其私邑，以酒迷亂，不修其業。○舍音捨。胤後承王命徂徵。徂，往也，就其私邑往討之。" }
      - { type: z, text: "“惟仲康”至“徂徵”○正義曰：惟仲康始即王位，臨四海，胤國之侯受王命為大司馬，掌六師。於是有羲氏、和氏廢其所掌之職，縱酒荒迷，亂於私邑，胤國之君承王命往徵之。○傳“羿廢”至“天子”○正義曰：以羿距太康於河，於時必廢之也。《夏本紀》雲：“太康崩，弟仲康立。”襄四年《左傳》雲：“羿因夏民以伐夏政。”則羿於其後篡天子之位，仲康不能殺羿，必是羿握其權，知仲康之立，是羿立之矣，故云“羿廢太康，而立其弟仲康為天子”。計《五子之歌》，仲康當是其一，仲康必賢於太康，但形勢既衰，政由羿耳。羿在夏世為一代大賊，《左傳》稱羿既篡位，寒浞殺之。羿滅夏後相，相子少康始滅浞復夏政。計羿、浞相承，向有百載，為夏亂甚矣。而《夏本紀》雲：“太康崩，其弟仲康立。仲康崩，子相立。相崩，子少康立。”都不言羿、浞之事，是馬遷之說疏矣。" }
      - { type: j, text: "告於眾曰：“嗟予有眾，誓敕之。聖有謨訓，明徵定保。徵，證。保，安也。聖人所謀之教訓，為世明證，所以定國安家。先王克謹天戒，臣人克有常憲，言君能慎戒，臣能奉有常法。百官修輔，厥後惟明明。修職輔君，君臣俱明。每歲孟春，遒人以木鐸徇於路，遒人，宣令之官。木鐸，金鈴木舌，所以振文教。○遒，在由反。鐸，待洛反。鈴音令。官師相規，工執藝事以諫。官眾，從官。更相規闕，百工各執其所治技藝以諫，諫失常。○藝，本又作埶。更音庚。技，其綺反。其或不恭，邦有常刑。言百官廢職，服大刑。" }
      - { type: z, text: "“告於”至“常刑”○正義曰：胤侯將徵羲和，告於所部之眾曰：“嗟乎！我所有之眾人，聖人有謨之訓，所以為世之明證，可以定國安家。其所謀者，言先王能謹慎敬畏天戒，臣人者能奉先王常法，百官修常職輔其君，君臣相與如是，則君臣俱明，惟為明君明臣。”言君當謹慎以畏天，臣當守職以輔君也。“先王恐其不然，大開諫爭之路。每歲孟春，遒人之官以木鐸徇於道路，以號令臣下，使在官之眾更相規闕；百工雖賤，令執其藝能之事以諫上之失常。其有違諫不恭謹者，國家則有常刑”。○傳“徵證”至“安家”○正義曰：成八年《左傳》稱晉殺趙括，欒、郤為徵。“徵”是證驗之義，故為證也。能自保守是安定之義，故為安也。聖人將為教訓，必謀而後行，故言“所謀之教訓”。聖人之言，必有其驗，故為“世之明證”。用聖人之謨訓，必有成功，故“所以定國安家”。○傳“言君”至“常法”○正義曰：王者代天理官，故稱“天戒”。臣人奉主法令，故言“常憲”。君當奉天，臣當奉君，言君能戒慎天戒也，臣能奉有常法，奉行君法也。此謂大臣，下雲“百官修輔”，謂眾臣。○傳“遒人”至“文教”○正義曰：以執木鐸徇於路，是宣令之事，故言“宣令之官”。《周禮》無此官，惟《小宰》雲：“正歲，帥理官之屬而觀治象之法，徇以木鐸曰：‘不用法者，國有常刑。’”宣令之事，略與此同。此似別置其官，非如周之小宰。名曰“遒人”，不知其意，蓋訓“遒”為聚，聚人而令之，故以為名也。《禮》有“金鐸”、“木鐸”，“鐸”是鈴也，其體以金為之，明舌有金木之異，知木鐸是木舌也。《周禮》教鼓人“以金鐸通鼓”，大司馬“教振旅，兩司馬執鐸”，《明堂位》雲“振木鐸於朝”，是武事振金鐸，文事振木鐸。今雲“木鐸”，故云“所以振文教”也。○傳“官眾”至“失常”○正義曰：“相規”，相平等之辭，故“官眾”謂“眾官”，“相規”謂“更相規闕”。平等有闕，已尚相規，見上之過，諫之必矣。“百工各執其所治技藝以諫”，謂被遣作器，工有奢儉，若《月令》雲“無作淫巧，以蕩上心”，見其淫巧不正，當執之以諫，諫失常也。百工之賤，猶令進諫，則百工以上，不得不諫矣。○傳“言百”至“大刑”○正義曰：“百官廢職，服大刑”，《明堂位》文也。顧氏雲：“百官群臣其有廢職懈怠不恭謹者，國家當有常刑。”" }
      - { type: j, text: "“惟時羲和，顛覆厥德，顛覆言反倒。將陳羲和所犯，故先舉孟春之令，犯令之誅。○覆，芳服反。倒，丁老反。沈亂於酒，畔宮離次，沈謂醉冥。失次位也。○離如字，又力智反。冥，莫定反，又亡丁反。俶擾天紀，遐棄厥司。俶，始。擾，亂。遐，遠也。紀謂時日。司，所主也。○俶，本又作亻，亦作叔，同尺六反。擾，而小反。乃季秋月朔，辰弗集於房，辰，日月所會。房，所舍之次。集，合也。不合即日食可知。瞽奏鼓、嗇夫馳，庶人走。凡日食，天子伐鼓於社，責上公。瞽，樂官，樂官進鼓則伐之。嗇夫，主幣之官，馳取幣禮天神。眾人走，供救日食之百役也。○嗇音色。馳，車馬曰馳。走，步曰走。供音恭。羲和屍厥官，罔聞知，主其官而無聞知於日食之變異，所以罪重。昏迷於天象，以幹先王之誅。暗錯天象，言昏亂之甚。幹，犯也。政典曰：‘先時者殺無赦，政典，夏後為政之典籍。若《周官》六卿之治典。先時，謂曆象之法，四時節氣，弦望晦朔。先天時則罪死無赦。○先，悉薦反，又如字，注“先時”、“先天”同。赦亦作亦攵。治，直吏反。不及時者殺無赦。’不及謂曆象後天時。雖治其官，苟有先後之差，則無赦，況廢官乎！○後，胡豆反。" }
      - { type: z, text: "“惟時”至“無赦”○正義曰：言不諫尚有刑，廢職懈怠，是為大罪。惟是羲和，顛倒其奉上之德，而沈沒昏亂於酒，違叛其所掌之官，離其所居位次，始亂天之紀綱，遠棄所主之事。乃季秋九月之朔，日月當合於辰。其日之辰，日月不合於舍；不得合辰，謂日被月食，日有食之。《禮》有救日之法，於是瞽人樂官進鼓而擊之，嗇夫馳騁而取幣以禮天神，庶人奔走供救日食之百役。此為災異之大，群官促遽若此，羲和主其官而不聞知日食，是大罪也。此羲和昏暗迷錯於天象，以犯先王之誅，此罪不可赦也。故先王為政之典曰：“主歷之官，為歷之法，節氣先天時者殺無赦，不及時者殺無赦。”失前失後尚猶合殺，況乎不知日食；其罪不可赦也，況彼罪之大。言已所以徵也。○傳“顛覆”至“之誅”○正義曰：“顛覆言反倒”，謂人反倒也。人當豎立，今乃反倒，猶臣當事君，今乃廢職，似人之反倒然。言臣以事君為德，故言“顛覆厥德”。胤侯將陳羲和之罪，故先舉孟春之令，犯令之誅，舉輕以見重，小事犯令猶有常刑，況叛官離次為大罪乎！○傳“沈謂”至“次位”○正義曰：沒水謂之沈，大醉冥然，無所復知，猶瀋水然，故謂醉為“沈”。○傳“俶始”至“所主”○正義曰：“俶，始”、“遐，遠”皆《釋詁》文。“擾”謂煩亂，故為亂也。《洪範》五紀，“五曰歷數”，歷數所以紀天時。此言“天紀”，謂時日。此時日之事是羲和所司，言棄其所主。○傳“辰日”至“可知”○正義曰：昭七年《左傳》曰，晉侯問於士文伯曰：“何謂辰？”對曰：“日月之會是謂辰。”是“辰”為日月之會。日月俱右行於天，日行遲，月行疾，日每日行一度，月日行十三度十九分度之七，計二十九日過半，月已行天一週，又逐及日而與日聚會，謂此聚會為“辰”。一歲十二會，故為十二辰，即子、醜、寅、卯之屬是也。“房”謂室之房也，故為“所舍之次”。計九月之朔，日月當會於大火之次。《釋言》雲：“集，會也。”會即是合，故為“合”也。日月當聚會共舍，今言日月不合於舍，則是日食可知也。日食者，月掩之也，月體掩日，日被月映，即不成共處，故以不集言日食也。或以為“房”謂房星，九月日月會於大火之次。房、心共為大火，言辰在房星，事有似矣。知不然者，以集是止舍之處，言其不集於舍，故得以表日食；若言不集於房星，似太遲太疾，惟可見歷錯，不得以表日食也。且日之所在，星宿不見，正可推算以知之，非能舉目見之。君子慎疑，寧當以日在之宿為文，以此知其必非房星也。○傳“凡日”至“百役”○正義曰：文十五年《左傳》雲：“日有食之，天子不舉，伐鼓於社。諸侯用幣於社，伐鼓於朝。”杜預以為“伐鼓於社”，“責群陰”也。此傳言“責上公”者，《郊特牲》雲：“社祭土而主陰氣也，君南向北墉下，答陰之義也。”是言社主陰也。日食陰侵陽，故杜預以為“責群陰”也。昭二十九年《左傳》雲：“封為上公，祀為貴神。社稷五祀，是尊是奉。”是社祭句龍為上公之神也。日食臣侵君之象，故傳以為“責上公”，亦當群陰上公並責之也。《周禮》瞽矇之官掌作樂，瞽為樂官。樂官用無目之人，以其無目，於音聲審也。《詩》雲“奏鼓簡簡”，謂伐鼓為奏鼓，知“樂官進鼓則伐之”。《周禮·太僕》：“軍旅、田役，贊王鼓。救日月，亦如之。”鄭玄雲：“王通鼓，佐聲其餘面。”則救日之時，王或親鼓。莊二十五年《穀梁傳》曰：“天子救日，置五麾，陳五兵、五鼓。”陳既多，皆樂人伐之。《周禮》無嗇夫之官，《禮》雲：“嗇夫承命，告於天子。”鄭玄雲：“嗇夫蓋司空之屬也。”嗇夫主幣，《禮》無其文，此雲“嗇夫馳”，必馳走有所取也。《左傳》雲：“諸侯用幣。”則天子亦當有用幣之處，嗇夫必是主幣之官，馳取幣也。社神尊於諸侯，故諸侯用幣於社以請救。天子伐鼓於社，必不用，知嗇夫“馳取幣禮天神”。“庶人走”，蓋是庶人在官者，謂諸侯胥徒也。其走必有事，知為“供救日食之百役”也。《曾子問》雲：“諸侯從天子救日食，各以方色與其兵。”《周禮·庭氏》雲：“救日之弓矢。”是救日必有多役，庶人走供之。鄭注《庭氏》雲，以救日為太陽之弓，救月為太陰之弓，救日以枉矢，救月以恆矢。其鼓則蓋用祭天之雷鼓也。昭十七年“夏六月甲戌朔，日有食之”。《左傳》雲：“季平子曰：‘惟正月朔，慝未作，日有食之，於是乎有伐鼓用幣，禮也，其餘則否。’太史曰：‘在此月也，當夏四月，是謂孟夏。’”如彼傳文，惟夏四月有伐鼓用幣禮，餘月則不然，此以九月日食亦奏鼓用幣者，顧氏雲：“夏禮異於周禮也。”○傳“政典”至“無赦”○正義曰：胤侯，夏之卿士，引政典而不言古典，則當時之書，知是“夏後為政之典籍”也。《周禮》：“太宰掌建邦之六典，以佐王治邦國。一曰治典，二曰教典，三曰禮典，四曰政典，五曰刑典，六曰事典。”若周官六卿之治典，謂此也。“先時”、“不及”者，謂此曆象之法，四時節氣，弦望晦朔，不得先天時，不得後天時。四時時各九十日有餘，分為八節，節各四十五日有餘也。節氣者，周天三百六十五日四分日之一，四時分之，均分為十二月，則月各得三十日十六分日之七，以初為節氣，半為中氣，故一歲有二十四氣也。計十二月，每月二十九日強半也。以月初為朔，月盡為晦，當月之中，日月相望，故以月半為望。望去晦、朔，皆不滿十五日也。又半此望去晦、朔之數，名之曰弦。弦者，言其月光正半如弓弦也。晦者，月盡無月，言其暗也。朔者，蘇也，言月死而更蘇也。先天時者，所名之日，在天時之先。假令天之正時，當以甲子為朔，今歷乃以癸亥為朔，是造歷先天時也；若以乙丑為朔，是造歷後天時也。後即是“不及時”也。其氣、望等皆亦如此。" }
      - { type: j, text: "“今予以爾有眾，奉將天罰。將，行也。奉王命行王誅，謂殺湎淫之身，立其賢子弟。爾眾士同力王室，尚弼予欽承天子威命。以天子威命督其士眾，使用命。火炎崐岡，玉石俱焚。山脊曰岡。崐山出玉，言火逸而害玉。○崐音昆。天吏逸德，烈於猛火。逸，過也。天王之吏為過惡之德，其傷害天下，甚於火之害玉。猛火烈矣，又烈於火。殲厥渠魁，脅從罔治。殲，滅。渠，大。魁，帥也。指謂羲和罪人之身，其脅從距王師者，皆無治。○殲，子廉反。魁，苦回反。脅，虛業反。帥，色類反。舊染汙俗，鹹與惟新。言其餘人久染汙俗，本無噁心，皆與更新，一無所問。○汙，烏故反，汙辱之汙；又音烏，涴泥著物也，一音烏臥反。嗚呼！威克厥愛，允濟。歎能以威勝所愛，則必有成功。愛克厥威，允罔功。以愛勝威，無以濟眾，信無功。其爾眾士，懋戒哉！”言當勉以用命，戒以闢戮。○懋音茂。闢音避。" }
      - { type: z, text: "“今予”至“戒哉”○正義曰：“羲和所犯如上，故今我用汝所有之眾，奉王命，行天罰。汝等眾士，當同心盡力於王室，庶幾輔我敬承天子之命，使我伐必克之。”又恐兵威所及，濫殺無辜，故假喻以戒之：“火炎崐山之岡，玉石俱被焚燒。天王之吏為過惡之德，則酷烈甚於猛火。宜誅惡存善，不得濫殺。滅其為惡大帥，罪止羲和之身，其被迫脅而從距王師者，皆無治責其罪。久染汙穢之俗，本無噁心，皆與惟德更新，一無所問。”又言將軍之法，必有殺戮。“嗚呼！”重其事，故歎而言之。“將軍威嚴能勝其愛心，有罪者雖愛必誅，信有成功。若愛心勝其威嚴，親愛者有罪不殺，信無功矣”。言我雖愛汝，有罪必殺。其汝眾士宜勉力以戒慎哉！勿違我命以取殺也。○傳“將行”至“子弟”○正義曰：“將”之為行，常訓也。天欲加罪，王者順天之罰，則王誅也。“奉王命行王誅，謂殺淫湎之身”，羲和之罪，不及其嗣，故知殺其身，立其賢子弟。《楚語》雲，重黎之後，世掌天地四時之官，至於夏商。則此不滅其族，故傳言此也。○傳“山脊”至“害玉”○正義曰：《釋山》雲：“山脊，岡。”孫炎曰：“長山之脊也。”以崐山出玉，言火逸害玉，喻誅惡害善也。○傳“逸過”至“於火”○正義曰：“逸”即佚也，佚是淫縱之名，故為過也。“天王之吏”，言位貴而威高，乘貴勢而逞毒心，或睚眥而害良善，故為“過惡之德，其傷害天下，甚於火之害玉”。猛火為烈甚矣，又復烈之於火，言其害之深也。○傳“殲滅”至“無治”○正義曰：“殲，盡也”，《釋詁》文。舍人曰：“殲，眾之盡也。”眾皆死盡為殲也。“渠，大”、“魁，帥”，無正訓。以上“殲厥渠魁”謂滅其元首，故以“渠”為大，“魁”為帥。史傳因此謂賊之首領為“渠帥”，本原出於此。" }
      - { type: j, text: "自契至於成湯，八遷。十四世，凡八徙國都。○契，息列反，殷之始祖。八遷之書，史唯見四。湯始居亳，從先王居，契父帝嚳都亳，湯自商丘遷焉，故曰“從先王居”。○亳，旁各反，徐扶各反。嚳，苦毒反。作《帝告》、《釐沃》。告來居，治沃土，二篇皆亡。○告，工毒反。釐，力之反。沃，徐烏酷反。此五亡篇，舊解是《夏書》，馬、鄭之徒以為《商書》，兩義並通。" }
      - { type: z, text: "“自契”至“釐沃”○正義曰：自此已下皆《商書》也。序本別卷，與經不連，孔以經序宜相附近，引之各冠其篇首。此篇經亡序存，文無所託，不可以無經之序為卷之首，本書在此，故附此卷之末。契是商之始祖，故遠本之。自契至於成湯，凡八遷都。至湯始往居亳，從其先王帝嚳舊居。當時湯有言告，史序其事，作《帝告》、《釐沃》二篇。○傳“十四”至“國都”○正義曰：《周語》曰：“玄王勤商，十四世而興。”“玄王”謂契也，勤殖功業十四世，至湯而興，為天子也。《殷本紀》雲，契生昭明。“昭明卒，子相土立。相土卒，子昌若立。昌若卒，子曹圉立。曹圉卒，子冥立。冥卒，子振立。振卒，子微立。微卒，子報丁立。報丁卒，子報乙立。報乙卒，子報丙立。報丙卒，子主壬立。主壬卒，子主癸立。主癸卒，子天乙立。天乙是為成湯”是也。契至成湯十四世，凡八遷國都者，《商頌》雲“帝立子生商”，是契居商也。《世本》雲：“昭明居砥石。”《左傳》稱相土居商丘，及今湯居亳，事見經傳者有此四遷，其餘四遷未詳聞也。鄭玄雲：“契本封商，國在太華之陽。”皇甫謐雲：“今上洛商是也。”襄九年《左傳》雲：“陶唐氏之火正閼伯居商丘，相土因之。”杜預雲：“今梁國睢陽宋都是也。”其“砥石”先儒無言，不知所在。自契至湯，諸侯之國而得數遷都者，蓋以時王命之使遷。至湯乃以商為天下號，則都雖數遷，商名不改。今湯遷亳，乃作此篇，若是諸侯遷都，則不得史錄其事以為《商書》之首。文在“湯徵諸侯”、“伊尹去亳”之上，是湯將欲為王時事。史以商有天下，乃追錄初興，並《湯徵》與《汝鳩》、《汝方》，皆是伐桀前事，後追錄之也。○傳“契父”至“王居”○正義曰：“先王”，天子也。自契已下，皆是諸侯，且文稱契至湯，今雲“從先王居”者，必從契之先世天子所居也。《世本》、《本紀》皆雲契是帝嚳子，知先王是契父帝嚳。帝嚳本居亳，今湯往從之。嚳實帝也，言“先王”者，對文論優劣，則有皇與帝及王之別，散文則雖皇與帝皆得言王也。故《禮運》雲：“昔者先王未有宮室。”乃謂上皇為王，是其類也。孔言“湯自商丘遷焉”，以相土之居商丘，其文見於《左傳》，因之言自商丘徙耳。此言不必然也，何則？相土，契之孫也，自契至湯凡八遷，若相土至湯都遂不改，豈契至相土三世而七遷也？相土至湯必更遷都，但不知湯從何地而遷亳耳，必不從商丘遷也。鄭玄雲：“亳，今河南偃師縣有湯亭。”《漢書音義》臣瓚者雲：“湯居亳，今濟陰亳縣是也，今亳有湯冢。己氏有伊尹冢。”杜預雲：“梁國蒙縣北有亳城，城中有成湯冢，其西又有伊尹冢。”皇甫謐雲：“《孟子》稱湯居亳，與葛為鄰，葛伯不祀，湯使亳眾為之耕。葛即今梁國寧陵之葛鄉也。若湯居偃師，去寧陵八百餘裏，豈當使民為之耕乎？亳今梁國穀熟縣是也。”諸說不同，未知孰是。○傳“告來”至“皆亡”○正義曰：經文既亡，其義難明，孔以意言耳。所言“帝告”，不知告誰，序言“從先王居”，或當告帝嚳也。" }
      - { type: j, text: "湯徵諸侯，為夏方伯，得專征伐。葛伯不祀，湯始徵之，葛，國。伯，爵也。廢其土地山川及宗廟神祗，皆不祀，湯始伐之。伐始於葛。○祗，巨支反。" }
      - { type: z, text: "傳“葛國”至“於葛”○正義曰：序言“湯徵諸侯”，知其人是葛國之君，伯爵。直雲“不祀”，文無指斥。《王制》雲：“山川神祗有不舉者為不敬，不敬者君削以地。宗廟有不順者為不孝，不孝者君黜以爵。”是言不祀必廢其土地山川之神祗及宗廟，皆不祀，故湯始徵之。湯伐諸侯，伐始於葛，《仲虺之誥》雲“初征自葛”是也。《孟子》雲：“湯居亳，與葛為鄰。葛伯不祀，湯使人問之曰：‘何為不祀？’曰：‘無以供犧牲也。’湯使遺之牛羊。葛伯食之，又不祀。湯又使人問之曰：‘何為不祀？’曰：‘無以供粢盛也。’湯使亳往為之耕，老弱饋食。葛伯率其人，要其酒食黍稻者，劫而奪之，不授者殺之。有童子以黍肉餉，殺而奪之。《書》曰：‘葛伯仇餉。’此之謂也。”是說伐始於葛之事也。" }
      - { type: j, text: "作《湯徵》。述始徵之義也，亡。" }
      - { type: j, text: "伊尹去亳適夏，伊尹，字剩湯進於桀。" }
      - { type: z, text: "傳“伊尹”至“於桀”○正義曰：伊，氏；尹，字，故云“字氏”，倒文以曉人也。伊尹不得叛湯，知湯貢之於桀。必貢之者，湯欲以誠輔桀，冀其用賢以治；不可匡輔，乃始伐之，此時未有伐桀之意，故貢伊尹使輔之。《孫武兵書·反間篇》曰：“商之興也，伊尹在夏。周之興也，呂牙在殷。”言使之為反間也，與此說殊。" }
      - { type: j, text: "既醜有夏，復歸於亳。醜惡其政。不能用賢，故退還。○復，扶又反。入自北門，乃遇汝鳩、汝方，鳩、方，二人湯之賢臣。不期而會曰遇。" }
      - { type: z, text: "傳“鳩方”至“曰遇”○正義曰：伊尹與之言，知是賢臣也。“不期而會曰遇”，隱八年《穀梁傳》文也。" }
      - { type: j, text: "作《汝鳩》、《汝方》。言所以醜夏而還之意，二篇皆亡。" }
      - { type: j, text: "《尚書正義》" }
