# 長物志序：點校中導覽（teaser）
sections:
  - id: xu
    name: 序
    blocks:
      - type: j
        text: 長物志卷一
      - type: j
        text: 明文震亨撰
      - type: j
        text: 長物志序
      - type: j
        text: 明沈春澤
      - type: j
        text: 夫標榜林壑，品題酒茗，收藏位置圖史、杯鐺之屬，於世為閒事，於身為長物。而品人者，於此觀韻焉、才與情焉。何也？挹古今清華美妙之氣於耳目之前，供我呼吸；羅天地瑣雜碎細之物於几席之上，聽我指揮；挾日用寒不可衣、飢不可食之器，尊逾拱璧，享輕千金，以寄我之慷慨不平。非有真韻、真才與真情以勝之，其調弗同也。
      - type: j
        text: 近來富貴家兒與一二庸奴、鈍漢，沾沾以好事自命，每經賞鑒，出口便俗，入手便粗，縱極其摩挲護持之情狀，其污辱彌甚，遂使真韻、真才、真情之士，相戒不談風雅。嘻，亦過矣！司馬相如攜卓文君，賣車騎，買酒舍，文君當壚滌器，映帶犢鼻褌邊；陶淵明方宅十餘畝，草屋八九間，叢菊孤松，有酒便飲，境地兩截，要歸一致；右丞茶鐺藥臼，經案繩床；香山名姬駿馬，攫石洞庭，結堂廬阜；長公聲伎酣適於西湖，煙舫翩乎赤壁，禪人酒伴，休息夫雪堂。豐儉不同，總不礙道，其韻致才情，政自不可掩耳！
      - type: j
        text: 予向持此論告人，獨余友啟美氏絕頷之。春來將出其所纂《長物志》十二卷，公之藝林，且屬余序。予觀啟美是編，室廬有制，貴其爽而倩、古而潔也；花木、水石、禽魚有經，貴其秀而遠、宜而趣也；書畫有目，貴其奇而逸、雋而永也；几榻有度，器具有式，位置有定，貴其精而便、簡而裁、巧而自然也；衣飾有王謝之風，舟車有武陵蜀道之想，蔬果有仙家瓜棗之味，香茗有荀令、玉川之癖，貴其幽而閒、淡而可思也。法律指歸，大都遊戲點綴中一往刪繁去奢之意存焉。豈唯庸奴、鈍漢不能窺其崖略，即世有真韻致、真才情之士，角異獵奇，自不得不降心以奉啟美為金湯。誠宇內一快書，而吾黨一快事矣！
      - type: j
        text: 余因語啟美：「君家先嚴徵仲太史，以醇古風流，冠冕吳趨者，幾滿百歲，遞傳而家聲香遠，詩中之畫，畫中之詩，窮吳人巧心妙手，總不出君家譜牒。即余日者過子，盤礴累日，嬋娟為堂，玉局為齋，令人不勝描畫，則斯編常在子衣履襟帶間，弄筆費紙，又無乃多事耶？」啟美曰：「不然。吾正懼吳人心手日變，如子所云，小小閒事長物，將來有濫觴而不可知者，聊以是編堤防之。」有是哉！刪繁去奢之一言，足以序是編也。予遂述前語相諗，不徒占啟美之韻之才之情，可以知其用意深矣。
      - type: j
        text: 沈春澤謹序。
