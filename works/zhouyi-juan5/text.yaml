# 周易正義卷五（孔穎達疏）：j 為經文＋王弼注，z 為正義疏文。
sections:
  - id: juan5
    name: 卷五
    blocks:
      - { type: j, text: "乾下兌上。夬：揚於王庭，孚號有厲。告自邑，不利即戎。利有攸往。夬與剝反者也。剝以柔變剛，至於剛幾盡。夬以剛決柔，如剝之消剛。剛隕則君子道消，柔消則小人道隕。君子道消，則剛正之德不可得直道而用，刑罰之威不可得坦然而行。“揚於王庭”，其道公也。" }
      - { type: z, text: "“夬揚於王庭”至“利有攸往”。○正義曰：夬，決也。此陰消陽息之卦也。陽長至五，五陽共決一陰，故名為“夬”也。“揚於王庭”者，明行決斷之法，夬以剛決柔，施之於人，則是君子決小人也。王庭是百官所在之處，以君子決小人，故可以顯然發揚決斷之事於王者之庭，示公正而無私隱也，故曰“揚於王庭”也。“孚號有厲”者，號，號令也。行決之法，先須號令。夬以剛決柔，則是用明信之法而宣其號令，如此即柔邪者危，故曰“孚號有厲”也。以剛制斷，行令於邑可也。若用剛即戎，尚力取勝，為物所疾，以此用師，必有不利，故曰“告自邑，不利即戎”。雖“不利即戎”，然剛德不長，則柔邪不消。故陽爻宜有所往，夬道乃成，故曰“利有攸往”也。" }
      - { type: j, text: "《彖》曰：夬，決也，剛決柔也。健而說，決而和。“健而說”，則“決而和”矣。" }
      - { type: z, text: "“《彖》曰”至“決而和”。○正義曰：夬，決也。“剛決柔”者，此就爻釋卦名也。“健而說，決而和”者，此就二體之義，明決而能和，乾健而兌說，健則能決，說則能和，故曰“決而和”也。" }
      - { type: j, text: "“揚於王庭”，柔乘五剛也。剛德齊長，一柔為逆，眾所同誅，而無忌者也。故可“揚於王庭”。" }
      - { type: z, text: "正義曰：此因一陰而居五陽之上，釋行決之法。以剛德齊長，一柔為逆，無所同誅，誅而無忌也，故曰“揚於王庭”。言所以得顯然“揚於王庭”者，只謂柔乘五剛也。" }
      - { type: j, text: "“孚號有厲”，其危乃光也。剛正明信以宣其令，則柔邪者危，故曰“其危乃光也”。" }
      - { type: z, text: "正義曰：以明信而宣號令，即柔邪者危厲，危厲之理，分明可見，故曰“其危乃光也”。" }
      - { type: j, text: "“告自邑，不利即戎”，所尚乃窮也。以剛斷制，告令可也。“告自邑”，謂行令於邑也。用剛即戎，尚力取勝也。尚力取勝，物所同疾也。" }
      - { type: z, text: "正義曰：剛克之道，不可常行。若專用威猛，以此即戎，則便為尚力取勝，即是決而不和，其道窮矣。行決所以惟“告自邑，不利即戎”者，只謂所尚乃窮故也。" }
      - { type: j, text: "“利有攸往”，剛長乃終也。剛德愈長，柔邪愈消，故“利有攸往”，道乃成也。" }
      - { type: z, text: "正義曰：終成也，剛長柔消，夬道乃成也。" }
      - { type: j, text: "《象》曰：澤上於天，夬。君子以施祿及下，居德則忌。“澤上於天”，夬之象也。“澤上於天”，必來下潤，“施祿及下”之義也。《夬》者，明法而決斷之象也。忌止也。法明斷嚴，不以慢，故“居德”以明禁也。施而能嚴，嚴而能施，健而能說，決而能和，美之道也。" }
      - { type: z, text: "“《象》曰”至“居德則忌”。○正義曰：“澤上於天，夬”者，澤性潤下，雖復“澤上於天”，決來下潤，此事必然，故是“夬”之象也。“君子以施祿及下，居德則忌”者，忌，禁也。“決”有二義，《象》則澤來潤下，《彖》則明法決斷，所以君子法此夬義。威惠兼施，雖復施祿及下，其在身居德，復須明其禁令，合於健而能說，決而能和，故曰“君子以施祿及下，居德則忌”也。" }
      - { type: j, text: "初九：壯於前趾，往不勝，為咎。居健之初，為決之始，宜審其策，以行其事。壯其前趾，往而不勝，宜其咎也。" }
      - { type: z, text: "正義曰：初九居夬之初，當須審其籌策，然後乃往。而體健處下，徒欲果決壯健，前進其趾，以此而往，必不克勝，非決之謀，所以“為咎”，故曰“初九，壯於前趾，往不勝，為咎”也。" }
      - { type: j, text: "《象》曰：不勝而往，咎也。不勝之理，在往前也。" }
      - { type: z, text: "正義曰：《經》稱“往不勝。為咎”，象云“不勝而往，咎”翻其文者，蓋暴虎馮河，孔子所忌，謬於用壯，必無勝理。孰知不勝，果決而往，所以致於咎過。故注云“不勝之理，在往前”也。" }
      - { type: j, text: "九二：惕號，莫夜有戎，勿恤。居健履中，以斯決事，能審已度而不疑者也。故雖有惕懼號呼，莫夜有戎，不憂不惑，故“勿恤”也。" }
      - { type: z, text: "正義曰：九二體健居中，能決其事，而無疑惑者也。雖復有人惕懼號呼，語之云莫夜必有戎卒來害已，能番已度，不惑不憂，故“勿恤”也。" }
      - { type: j, text: "《象》曰：“有戎勿恤”，得中道也。" }
      - { type: z, text: "正義曰：“得中道”者，決事而得中道，故不以有戎為憂，故云“得中道”也。" }
      - { type: j, text: "九三：壯於頄，有兇。君子夬夬，獨行，遇雨若濡。而慍，無咎。頄，面權也，謂上六也。最處體上，故曰“權”也。剝之六三，以應陽為善。夫剛長則君子道興，陰盛則小人道長。然則處陰長而助陽則善，處剛長而助柔則兇矣。夬為剛長，而三獨應上六，助於小人，是以兇也。君子處之，必能棄夫情累，決之不疑，故曰“夬夬”也。若不與眾陽為群，而獨行殊志，應於小人，則受其困焉。“遇雨若濡”，有恨而無所咎也。" }
      - { type: z, text: "“九三壯於頄”至“無咎”。○正義曰：“壯於頄，有兇”者，頄，面權也，謂上六也。言九三處夬之時，獨應上六，助於小人，是以兇也。若剝之六三，處陰長之時而應上，是助陽為善。今九三處剛長之時，獨助陰為兇也。“君子夬夬”者，君子之人，若於此時，能棄其情累，不受於應，在於決斷而無滯，是“夬夬”也。“獨行，遇雨若濡，有慍無咎”者，若不能決斷，殊於眾陽，應於小人，則受濡溼其衣，自為怨恨，無咎責於人，故曰“有慍無咎”也。" }
      - { type: j, text: "《象》曰：“君子夬夬”，終無咎也。" }
      - { type: z, text: "正義曰：眾陽決陰，獨與上六相應，是有咎也。若能“夬夬”，決之不疑，則“終無咎”矣。然則象云“無咎”，自釋“君子夬夬”，非經之“無咎”也。" }
      - { type: j, text: "九四：臀無膚，其行次且。牽羊悔亡，聞言不信。不剛而進，非已所據，必見侵傷，失其所安，故“臀無膚，其行次且”也。羊者，抵狠難移之物，謂五也。五為夬主，非下所侵。若牽於五，則可得“悔亡”而已。剛亢不能納言，自任所處，聞言不信以斯而行，兇可知矣。" }
      - { type: z, text: "“九四臀無膚”至“聞言不信”。○正義曰：“臀無膚，其行次且”者，九四據下三陽，位又不正，下剛而進，必見侵傷侵傷，則居不得安，若“臀無膚”矣。次且行不前進也。臀之無膚，居既失安，行亦不進，故曰“臀無膚，其行次且”也。“牽羊悔亡，聞言不信”者，羊者，抵狠難移之物，謂五也。居尊當位，為夬之主，下不敢侵。若牽於五，則可得悔亡，故曰“牽羊悔亡”。然四亦是剛陽，各亢所處，雖復聞牽羊之言，不肯信服事於五，故曰“聞言不信也”。" }
      - { type: j, text: "《象》曰：“其行次且”，位不當也。“聞言不信”，聰不明也。同於噬嗑滅耳之“兇”。" }
      - { type: z, text: "“無不明也”。○正義曰：“聰不明”者，聰，聽也。良由聽之不明，故聞言不信也。○注“同於噬嗑滅耳之兇”。○正義曰：四既聞言不信，不肯牽系於五，則必被侵克致兇。而《經》無兇文，《象》稱“聰不明”者，與《噬嗑》上九辭同，彼以不明釋兇，知此亦為兇也。" }
      - { type: j, text: "九五：莧陸夬夬，中行無咎。莧陸，草之柔脆者也。決之至易，故曰“夬夬”也。夬之為義，以剛決柔，以君子除小人者也。而五處尊位，最比小人，躬自決者也。以至尊而敵至賤，雖其克勝，未足多也。處中而行，足以免咎而已，未足光也。" }
      - { type: z, text: "“九五”至“無咎”。○正義曰：“莧陸，草之柔脆者也。夬之為義，以剛決柔，以君子除小人者也。”五處尊位，為夬之主，親決上六，決之至易也，如決莧草然，故曰“莧陸夬夬”也。但以至尊而敵於至賤，雖其克勝，不足貴也。特以中行之故，才得無咎，故曰“中行無咎”。○注“莧陸，草之柔脆者”。○正義曰：“莧陸，草之柔脆”者，子夏《傳》云：“莧陸，木根，草莖，剛下柔上也。”馬融、鄭玄、王肅皆云“莧陸，一名商陸”，皆以莧陸為一。黃遇云：“莧，人莧也。陸，商陸也。”以莧陸為二。案：《注》直云“草之柔脆”者，亦以為一同於子夏等也。" }
      - { type: j, text: "《象》曰：“中行無咎”，中未光也。" }
      - { type: z, text: "正義曰：“中未光”者，雖復居中而行，以其親決上六，以尊敵卑，未足以為光大也。" }
      - { type: j, text: "上六：無號，終有兇。處夬之極，小人在上，君子道長，無所共棄，故非號咷所能延也。" }
      - { type: z, text: "正義曰：上六，居夬之極，以小人而居群陽之上，眾共棄也。君子道長，小人必兇。非號咷所免，故禁其號咷，曰“無號終有兇”也。" }
      - { type: j, text: "《象》曰：“無號”之“兇”，終不可長也。" }
      - { type: z, text: "正義曰：“終不可長”者，長，延也。兇危若此，非號咷所能延，故曰“終不可長也”。" }
      - { type: j, text: "巽下乾上。姤：女壯，勿用取女。" }
      - { type: z, text: "正義曰：“姤，遇也。”此卦一柔而遇五剛，故名為“姤”。施之於人，則是一女而遇五男，為壯至甚，故戒之曰“此女壯甚，勿用取此女”也。" }
      - { type: j, text: "《彖》曰：姤，遇也。柔遇剛也。施之於人，即女遇男也。一女而遇五男，為壯至甚，故不可取也。" }
      - { type: z, text: "正義曰：此就爻釋卦名，以初六一柔而上遇五剛，所以名“遇”，而用釋卦辭“女壯，勿用取女”之義也。" }
      - { type: j, text: "“勿用取女”，不可與長也。天地相遇，品物鹹章也。正乃功成也。" }
      - { type: z, text: "“勿用取女”至“品物鹹章也”。○正義曰：“勿用取女，不可與長”者，女之為體，婉娩貞順，方可期之偕老。淫壯若此，不可與之長久，故“勿用取女”。“天地相遇，品物鹹章”者，已下廣明遇義。卦得遇名，本由一柔與五剛相遇，故遇辭非美，就卦而取，遂言遇不可用，是“勿用取女”也。故孔子更就天地歎美“遇”之為義不可廢也。天地若各亢所處，不相交遇，則萬品庶物，無由彰顯，必須二氣相遇，乃得化生，故曰：“天地相遇，品物鹹章”。" }
      - { type: j, text: "剛遇中正，天下大行也。化乃大行也。" }
      - { type: z, text: "正義曰：莊氏云：“一女而遇五男，既不可取，天地匹配，則能成品物。”由是言之，若剛遇中正之柔，男得幽貞之女，則天下人倫之化，乃得大行也。" }
      - { type: j, text: "《姤》之時義大矣哉！凡言義者，不盡於所見，中有意謂者也。" }
      - { type: z, text: "“姤之時義大矣哉”！正義曰：上既博美，此又結歎，欲就卦而取義。但是一女而遇五男，不足稱美，博論“天地相遇”，乃致“品物鹹章”，然後“姤之時義大矣哉”！。○注“凡言義者”至“有意謂者也”。○正義曰：《注》總為稱義發例，故曰“凡言”也。就卦以驗名義，只是女遇於男，博尋遇之深旨，乃至道該天地，故云“不盡於所見，中有意謂”者也。" }
      - { type: j, text: "《象》曰：天下有風，姤。後以施命誥四方。" }
      - { type: z, text: "正義曰：風行天下，則無物不遇，故為遇象。“後以施命誥四方”者，風行草偃，天之威令，故人君法此，以施教命，誥於四方也。" }
      - { type: j, text: "初六：系於金柅，貞吉。有攸往，見兇。羸豕孚蹢躅。金者，堅剛之物。尼者，制動之主，謂九四也。初六處遇之始，以一柔而承五剛，體夫躁質，得遇而通，散而無主，自縱者也。柔之為物，不可以不牽。臣妾之道，不可以不貞，故必系於正應，乃得“貞吉”也。若不牽於一，而有攸往行，則唯兇是見矣。羸豕，謂牝豕也。群豕之中，豭強而牝弱，故謂之“羸豕”也。孚，猶務躁也。夫陰質而躁恣者，羸豕特甚焉，言以不貞之陰，失其所牽，其為淫醜，若羸豕之孚務蹢躅也。" }
      - { type: z, text: "“初六系於金柅”至“羸豕孚蹢躅”。○正義曰：系於金柅，貞吉”者，金者，堅剛之物。柅者，制動之主，謂九四也。初六陰質，若系於正，應以從於四，則貞而吉矣，故曰“系於金柅，貞吉”也。“有攸往，見兇”者，若不牽於一，而有所行往，則惟兇是見矣，故曰“有攸往，見兇”。“羸豕孚蹢躅”者，初六處遇之初，以一柔而承五剛，是不系金柅，有所往者也。不系而往，則如羸豕之務躁而蹢躅然也，故曰：“羸豕孚蹢躅”。羸豕謂牝豕也。群豕之中，豭強而牝弱也，故謂牝豕為羸豕。陰質而淫躁，牝豕特甚焉，故取以為喻。○注“柅者，制動之主”。○正義曰：“柅者，制動之主”。柅之為物，眾說不同。王肅之徒皆為織績之器，婦人所用。惟馬云：“柅者，在車之下，所以止輪令不動者也。”王注云：“柅，制動之主。”蓋與馬同。" }
      - { type: j, text: "《象》曰：“系於金柅”，柔道牽也。" }
      - { type: z, text: "正義曰：“柔道牽”者，陰柔之道，必須有所牽系也。" }
      - { type: j, text: "九二：包有魚，無咎，不利賓。初陰而窮下，故稱“魚”。不正之陰，處遇之始，不能逆近者也。初自樂來應已之廚，非為犯奪，故“無咎”也。擅人之物，以為已惠，義所不為，故“不利賓”也。" }
      - { type: z, text: "正義曰：“庖有魚、無咎”者，初六以陰而處下，故稱魚也。以不正之陰，處遇之始，不能逆於所近，故舍九四之正應，樂充九二之庖廚，故曰“九二、庖有魚”。初自樂來，為已之廚，非為犯奪，故得“無咎”也。“不利賓者”，夫擅人之物，以為己惠，義所不為，故“不利賓”也。" }
      - { type: j, text: "《象》曰：“包有魚”，義不及賓也。" }
      - { type: z, text: "正義曰：“義不及賓”者，言有他人之物，於義不可及賓也。" }
      - { type: j, text: "九三：臀無膚，其行次且，厲，無大咎。處下體之極，而二據於初，不為已乘，居不獲安，行為其應，不能牽據，以固所處，故曰“臀無膚，其行次且”也。然履得其位，非為妄處，不遇其時，故使危厲。災非已招，是以“無大咎”也。" }
      - { type: z, text: "正義曰：陽之所據者，陰也。九三處下體之上，為內卦之主，以乘於二，無陰可據，居不獲安，上又無應，不能牽據以固所處，同於夬卦九四之失據，故曰“臀無膚，其行次且”也。然復得其位，非為妄處，特以不遇其時，故致此危厲，災非已招，故無大咎，故曰“厲無大咎”。" }
      - { type: j, text: "《象》曰：“其行次且”，行未牽也。" }
      - { type: z, text: "正義曰：“行未牽”者，未能牽據，故“其行次且”，是“行未牽也”。" }
      - { type: j, text: "九四：包無魚，起兇。二有其魚，故失之也。無民而動，失應而作，是以“兇”也。" }
      - { type: z, text: "正義曰：“庖無魚”者，二擅其應，故曰“庖無魚”也。庖之無魚，則是無民之義也。“起兇”者，起，動也。“無民而動，失應而作，是以兇也。”" }
      - { type: j, text: "《象》曰：“無魚”之兇，遠民也。" }
      - { type: z, text: "正義曰：“遠民”者，陰為陽之民，為二所據，故曰“遠民”也。" }
      - { type: j, text: "九五：以杞包瓜，含章，有隕自天。杞之為物，生於肥地者也。包瓜為物，系而不食者也。九五履得尊位，而不遇其應，得地而不食，含章而未發，不遇其應，命未流行。然處得其所，體剛居中，志不捨命，不可傾隕，故曰“有隕自天”也。" }
      - { type: z, text: "“九五以杞包瓜”至“有隕自天”。○正義曰：“以杞匏瓜”者，杞之為物，生於肥地；匏瓜為物，系而不食，九五處得尊位而不遇，其應是得地而不食，故曰“以杞匏瓜”也。“含章，有隕自天”者，不遇其應，命未流行，無物發起其美，故曰“含章”。然體剛居中，雖復當位，命未流行，而不能改其操，無能傾隕之者，故曰：“有隕自天”，蓋言惟天能隕之耳。○注“杞之為物，生於肥地者也”。○正義曰：“杞之為物，生於肥地者也”，先儒說杞，亦有不同。馬云：“杞，大木也。”《左傳》云：“杞梓皮革自楚注，則為杞梓之杞。”子夏《傳》曰：“作杞匏瓜。”薛虞《記》云：“杞，杞柳也。杞性柔刃，宜屈橈，似匏瓜。”又為杞柳之杞。案：王氏云“生於肥地”，蓋以杞為今之枸杞也。" }
      - { type: j, text: "《象》曰：九五“含章”，中正也。“有隕自天”，志不捨命也。" }
      - { type: z, text: "正義曰：“中正”者，中正故有美，無應故“含章”，而不發。若非九五中正，則無美可含，故舉爻位而言“中正”也。“志不捨命”者，雖命未流行，而居尊當位，“志不捨命”，故曰“不可傾隕”也。" }
      - { type: j, text: "上九：姤其角，吝，無咎。進之於極，無所復遇，遇角而已，故曰“姤其角”也。進而無遇，獨恨而已，不與物爭，其道不害，故無兇咎也。" }
      - { type: z, text: "正義曰：“姤其角”者，角者，最處體上，上九進之於極，無所復遇，遇角而已，故曰“姤其角”也。“吝無咎”者，角非所安，與無遇等，故獨恨而鄙吝也。然不與物爭，其道不害，故無兇咎，故曰“無咎”也。" }
      - { type: j, text: "《象》曰：“姤其角”，上窮吝也。" }
      - { type: z, text: "正義曰：“上窮吝”者，處於上窮，所以遇角而吝也。" }
      - { type: j, text: "坤下兌上。萃：亨。聚乃通也。" }
      - { type: z, text: "正義曰：“萃”，卦名也，又萃聚也，聚集之義也。能招民聚物，使物歸而聚已，故名為“萃”也。亨者，通也。擁隔不通，無由得聚，聚之為事，其道必通，故云“萃亨”。" }
      - { type: j, text: "王假有廟。假，至也，王以聚至有廟也。" }
      - { type: z, text: "正義曰：假，至也。天下崩離，則民怨神怒，雖復享祀，與無廟同。王至大聚之時，孝德乃昭，始可謂之“有廟”矣，故曰“王假有廟”。" }
      - { type: j, text: "利見大人，亨，利貞。聚得大人，乃得通而利正也。" }
      - { type: z, text: "正義曰：聚而無主，不散則亂。惟有大德之人，能弘正道，乃得常通而利正，故曰“利見大人，亨，利貞”也。" }
      - { type: j, text: "用大牲，吉。全乎聚道，“用大牲乃吉”也。聚道不全，而用大牲，神不福也。" }
      - { type: z, text: "正義曰：大人為王，聚道乃全，以此而用大牲，神明降福。故曰“用大牲，吉也”。" }
      - { type: j, text: "利有攸往。" }
      - { type: z, text: "正義曰：人聚神祐，何往不利？故曰“利有攸往”也。" }
      - { type: j, text: "《彖》曰：萃，聚也。順以說，剛中而應，故“聚”也。但“順而說”，則邪佞之道也。剛而違於中應，則強亢之德也。何由得聚？順說而以剛為主，主剛而履中，履中以應，故得聚也。" }
      - { type: z, text: "“《彖》曰”至“故聚也”。○正義曰：萃，聚者，訓，“萃”名也。“順以說，剛中而應，故聚”者，此就二體及九五之爻釋所以能聚也。若全用順說，則邪佞之道興；全用剛陽，而違於中應，則強亢之德著，何由得聚？今“順以說”，而剛為主，則非邪佞也。應不失中，則非偏亢也。如此方能聚物，故曰“順以說，剛中而應，故聚也”。" }
      - { type: j, text: "“王假有廟”，致孝享也。全聚乃得致孝之享也。" }
      - { type: z, text: "正義曰：享，獻也。聚道既全，可以至於“有廟”，設祭祀而“致孝享”也。" }
      - { type: j, text: "“利見大人，亨”，聚以正也。大人，體中正者也。通眾以正，聚乃得全也。" }
      - { type: z, text: "正義曰：釋聚所以利見大人，乃得通而利正者，良由大人有中正之德，能以正道通而化之，然後聚道得全，故曰“聚以正也”。" }
      - { type: j, text: "用大牲，吉，利有攸往，順天命也。“順以說”而不損剛，“順天命”者也。天德剛而不違中，順天則說，而以剛為主也。" }
      - { type: z, text: "正義曰：天之為德，剛不違中，今“順以說”，而以剛為主，是“順天命”也。動順天命，可以享於神明，無往不利，所以得用大牲，吉。“利有攸往”者，只為“順天命”也。" }
      - { type: j, text: "觀其所聚，而天地萬物之情可見矣。“方以類聚，物以群分”，情同而後乃聚，氣合而後乃群。" }
      - { type: z, text: "正義曰：此廣明萃義而歎美之也。凡物所以得聚者，由情同也。情志若乖，無由得聚，故“觀其所聚，則天地萬物之情可見矣”。" }
      - { type: j, text: "《象》曰：澤上於地，萃。君子以除戎器，戒不虞。聚而無防，則眾心生，" }
      - { type: z, text: "正義曰：澤上於地，則水潦聚，故曰“澤上於地，萃”也。除者，治也。人既聚會，不可無防備。故君子於此之時，脩治戎器以戒備不虞也。" }
      - { type: j, text: "初六：有孚不終，乃亂乃萃。若號，一握為笑，勿恤，往無咎。有應在四而三承之，心懷嫌疑，故“有孚不終”也。不能守道，以結至好，迷務競爭，故“乃亂乃萃”也。一握者，小之貌也。為笑者，懦劣之貌也。已為正配，三以近寵，若安夫卑退，謙以自牧，則“勿恤”而“往無咎”也。" }
      - { type: z, text: "“初六有孚”至“往無咎”。○正義曰：“有孚不終，乃亂乃萃”者，初六有應在四，而三承之，萃聚之時，貴於近合，見三承四，疑四與三，始以中應相信，末以他意相阻，故曰“有孚不終”也。既心懷嫌疑，則情意迷亂，奔馳而行，萃不以禮，故曰“乃亂乃萃”。一握者，小之貌也，自比一握之問，言至小也。為笑者，非嚴毅之容，言懦劣也。已為正配，三以近寵。若自號比為一握之小，執其謙退之容，不與物爭，則不憂於三，往必得合而“無咎”矣，故曰“若號一握為笑，勿恤，往無咎”也。" }
      - { type: j, text: "《象》曰：“乃亂乃萃”，其志亂也。" }
      - { type: z, text: "正義曰：“其志亂”者，只為疑四與三，故志意迷亂也。" }
      - { type: j, text: "六二：引吉無咎，孚乃利用禴。居萃之時，體柔當位，處坤之中，己獨處正，與眾相殊，異操而聚，民之多僻，獨正者危。未能變體以遠於害，故必見引，然後乃“吉”而“無咎”也。禴，殷者祭名也，四時祭之省者也。居聚之時，處於中正，而行以忠信致之。以省薄薦於鬼神也。" }
      - { type: z, text: "“六二”至“利用禴”。○正義曰：“引吉無咎”者，萃之為體，貴相從就，聚道乃成。今六二以陰居陰，復在坤體，志於靜退，則是守中未變，不欲相從者也。乖眾違時則致危害，故須牽引乃得“吉”而“無咎”也，故曰“引吉無咎”。“孚乃利用禴”者，禴，殷春祭之名也。四時之祭最薄者也。雖乖於眾，志須牽引。然居中得正，忠信而行，故可以省薄祭於鬼神也，故曰“孚乃利用禴”。" }
      - { type: j, text: "《象》曰：“引吉無咎”，中未變也。" }
      - { type: z, text: "正義曰：“中未變也”者，釋其所以須引乃吉，良由居中未變。" }
      - { type: j, text: "六三：萃如，嗟如，無攸利。往無咎，小吝。履非其位，以比於四，四亦失位。不正相聚，相聚不正，患所生也。幹人之應，害所起也，故“萃如嗟如，無攸利”也。上六亦無應而獨立，處極而憂危，思援而求朋，巽以待物者也。與其萃於不正，不若之於同志，故可以往而無咎也。二陰相合，猶不若一陰一陽之應，故有“小吝”也。" }
      - { type: z, text: "“六三萃如嗟如”至“小吝”。○正義曰：居萃之時，“履非其位，以比於四，四亦失位。不正相聚，相聚不正，患所生也。幹人之應，害所起也”，故曰“萃如，嗟如，無攸利”也。“往無咎，小吝”者，“上六亦無應而獨立，處極而憂危，思援而求朋，巽以待物者也。與其萃於不正，不若之於同志，故可往而無咎”。但以上六是陰，已又是陰，以“二陰相合，猶不若一陰一陽之應，故有小吝也”。" }
      - { type: j, text: "《象》曰：“往無咎”，上巽也。" }
      - { type: z, text: "正義曰：以上體柔巽，以求其朋，故三可以往而無咎也。" }
      - { type: j, text: "九四：大吉，無咎。履非其位而下據三陰，得其所據，失其所處。處聚之時，不正而據，故必“大吉”，立夫大功，然後“無咎”也。" }
      - { type: z, text: "正義曰：以陽處陰，明履非其位，又不據三陰，得其所據，失其所處。處聚之時，不正而據，是其兇也。若以萃之時，立夫大功，獲其大吉乃得無咎，故曰“大吉，無咎”。" }
      - { type: j, text: "《象》曰：“大吉無咎”，位不當也。" }
      - { type: z, text: "正義曰：“位不當”者，謂以陽居陰也。" }
      - { type: j, text: "九五：萃有位，無咎，匪孚。元永貞，悔亡。處聚之時，最得盛位，故曰“萃有位”也。四專而據，己德不行，自守而己，故曰“無咎匪孚”。夫脩仁守正，久必悔消，故曰“元永貞，悔亡”。" }
      - { type: z, text: "“九五”至“悔亡”。○正義曰：九五處聚之時，最得盛位，故曰“萃有位”也。既得盛位，所以“無咎”。“匪孚”者，良由四專而據，已德化不行，信不孚物，自守而已，故曰“無咎，匪孚”。若能修夫大德，久行其正，則其悔可消，故曰“元永貞，悔亡”。" }
      - { type: j, text: "《象》曰：“萃有位”，志未光也。" }
      - { type: z, text: "正義曰：“志未光也”者，雖有盛位，然德未行，久乃悔亡。今時志意未光大也。" }
      - { type: j, text: "上六：齎諮涕洟，無咎。處聚之時，居於上極，五非所乘，內無應援。處上獨立，近遠無助，危莫甚焉。齎諮，嗟歎之辭也。若能知危之至，懼禍之深，憂病之甚，至於涕洟，不敢自安，亦無所不害，故得“無咎”也。" }
      - { type: z, text: "正義曰：“齎諮”者，居萃之時，最處上極，五非所乘，內又無應，處上獨立，無其援助，危亡之甚，居不獲安，故“齎諮”而嗟歎也。若能知有危亡，懼害之深，憂危之甚，至於涕洟滂沱，如此居不獲安，方得無所不害，故“無咎”矣。自目出曰涕，自鼻出曰洟。" }
      - { type: j, text: "《象》曰：“齎諮涕洟”，未安上也。" }
      - { type: z, text: "正義曰：“未安上”者，未敢安居其上所乘也。" }
      - { type: j, text: "巽下坤上。升：元亨，用見大人，勿恤。巽順可以升，陽爻不當尊位，無嚴剛之正，則未免於憂，故用見大人，乃“勿恤”也。" }
      - { type: z, text: "正義曰“升，元亨”者，“升”，卦名也。升者，登上之義，升而得大通，故曰“升，元亨”也。“用見大人，勿恤”者，升者，登也。陽爻不當尊位，無剛嚴之正，則未免於憂，故用見大德之人，然後乃得無憂恤，故曰“用見大人，勿恤”。" }
      - { type: j, text: "南征吉。以柔之南，則麗乎大明也。" }
      - { type: z, text: "正義曰：非直須見大德之人，復宜適明陽之地。若以陰之陰，彌足其闇也。南是明陽之方，故云“南征吉”也。" }
      - { type: j, text: "《彖》曰：柔以時升。柔以其時，乃得升也。" }
      - { type: z, text: "正義曰：“升”之為義，自下升高，故就六五居尊，以釋名“升”之意。六五以陰柔乏質，起升貴位，若不得時，則不能升耳，故曰“柔以時升”也。" }
      - { type: j, text: "巽而順，剛中而應，是以大亨。純柔則不能自升，剛亢則物不從。既以時升，又“巽而順，剛中而應”，以此而升，故得“大亨”。" }
      - { type: z, text: "正義曰：此就二體及九二之爻，釋“元亨”之德也。“純柔則不能自升，剛亢則物所不從”。卦體既巽且順，爻又剛中而應於五，有此眾德，故得“元亨”。" }
      - { type: j, text: "“用見大人，勿恤”，有慶也。“南征吉”，志行也。巽順以升，至於大明，“志行”之謂也。" }
      - { type: z, text: "正義曰：“用見大人，勿恤有慶”者，以大通之德，“用見大人”，不憂否塞，必致慶善，故曰“有慶也”。“南征吉，志行”者，之於闇昧，則非其本志。今以柔順而升大明，其志得行也。" }
      - { type: j, text: "《象》曰：地中生木，升。君子以順德，積小以高大。" }
      - { type: z, text: "正義曰：“地中生木，升”者，“地中生木”，始於細微，以至高大，故為升象也。“君子以順德，積小以高大”者，地中生木，始於毫末，終至合抱。君子象之，以順行其德，積其小善，以成大名，故《系辭》云：“善不積不足以成名”，是也。" }
      - { type: j, text: "初六：允升，大吉。允，當也。巽卦三爻，皆升者也。雖無其應，處《升》之初，與九二、九三合志俱升。當升之時，升必大得，是以“大吉”也。" }
      - { type: z, text: "正義曰：允，當也。巽卦三爻，皆應升上，而二、三有應於五、六升之不疑。惟初無應於上，恐不得升。當二、三升時，與之俱升，必大得矣，故曰“允升，大吉”也。" }
      - { type: j, text: "《象》曰：“允升大吉”，上合志也。" }
      - { type: z, text: "正義曰：上謂二、三也，與之合志俱升，乃得“大吉”也。" }
      - { type: j, text: "九二：孚乃利用禴，無咎。與五為應，往必見任。體夫剛德，進不求寵，閒邪存誠，志在大業，故乃利用納約於神明矣。" }
      - { type: z, text: "正義曰：九二與五為應，往升於五，必見信任，故曰“孚”。二體剛德，而履乎中，進不求寵，志在大業，用心如此，乃可薦其省約於神明而無咎也，故曰“孚乃利用禴，無咎”。" }
      - { type: j, text: "《象》曰：九二之孚，有喜也。" }
      - { type: z, text: "正義曰：“有喜也”者，上升則為君所任，薦約則為神所享。斯之為喜，不亦宜乎？" }
      - { type: j, text: "九三：升虛邑。履得其位，以陽升陰，以斯而舉，莫之違距，故若“升虛邑”也。" }
      - { type: z, text: "正義曰：九三履得其位，升於上六，上六體是陰柔，不距於己，若升空虛之邑也。" }
      - { type: j, text: "《象》曰：“升虛邑”，無所疑也。往必得邑。" }
      - { type: z, text: "正義曰：“無所疑”者，往必得邑，何所疑乎？" }
      - { type: j, text: "六四：王用亨於岐山，吉，無咎。處升之際，下升而進，可納而不可距也。距下之進，攘來自專，則殃咎至焉。若能不距而納，順物之情，以通庶志，則得“吉”而“無咎”矣。岐山之會，順事之情，無不納也。" }
      - { type: z, text: "正義曰：“王用亨於岐山”者，六四處升之際，下體二爻，皆來上升，可納而不可距，事同文王岐山之會，故曰“王用亨於岐山也”。“吉無咎”者，若能納而不距，順物之情，則得吉而無咎，故曰“吉無咎也”。" }
      - { type: j, text: "《象》曰：“王用亨於岐山”，順事也。" }
      - { type: z, text: "正義曰：“順事”者，順物之情，而立功立事，故曰“順事”也。" }
      - { type: j, text: "六五：貞吉，升階。升得尊位，體柔而應，納而不距，任而不專，故得“貞吉，升階”而尊也。" }
      - { type: z, text: "正義曰：“貞吉，升階”者，六五以柔居尊位，納於九二，不自專權，故得“貞吉，升階”。保是尊貴而踐阼矣，故曰“貞吉，升階”也。" }
      - { type: j, text: "《象》曰：“貞吉，升階”，大得志也。" }
      - { type: z, text: "正義曰：“大得志”者，居中而得其“貞吉”，處尊而保其“升階”，志大得矣，故曰“大得志”也。" }
      - { type: j, text: "上六：冥升，利於不息之貞。處貞之極，進而不息者也。進而不息，故雖冥猶升也。故施於不息之正則可，用於為物之主則喪矣。終於不息，消之道也。" }
      - { type: z, text: "正義曰：“冥升”者，冥猶暗也。處升之上，進而不已，則是雖冥猶升也，故曰“冥升”。“利於不息之貞”者，若宴升在上，陵物為主，則喪亡斯及；若潔已脩身，施於為政，則以不息為美，故曰“利於不息之貞”。" }
      - { type: j, text: "《象》曰：“冥升”在上，消不富也。勞不可久也。" }
      - { type: z, text: "正義曰：“消不富”者，雖為政不息，交免危咎，然勞不可久，終致消衰，故曰“消不富”也。" }
      - { type: j, text: "坎下兌上。困：亨。困必通也。處窮而不能自通者，小人也。" }
      - { type: z, text: "正義曰：“困”者，窮厄委頓之名，道窮力竭，不能自濟，故名為“困”。亨者，卦德也。小人遭困，則“窮斯濫矣”。君子遇之，則不改其操。君子處困而不失，其自通之道，故曰“困，亨”也。" }
      - { type: j, text: "貞，大人吉，無咎。處困而得“無咎”，吉乃免也。" }
      - { type: z, text: "正義曰：處困而能自通，必是履正體大之人，能濟於困，然後得吉而“無咎”，故曰：“貞，大人吉，無咎”也。" }
      - { type: j, text: "有言不信。" }
      - { type: z, text: "正義曰：處困求濟，在於正身脩德。若巧言能辭，人所不信，則其道彌窮，故誡之以“有言不信”也。" }
      - { type: j, text: "《彖》曰：困，剛揜也。剛則揜於柔也。" }
      - { type: z, text: "正義曰：此就二體以釋卦名，兌陰卦為柔，坎陽卦為剛，坎在兌下，是“剛見揜於柔也”。剛應升進，今被柔揜，施之於人，其猶君子為小人所蔽以為困窮矣。" }
      - { type: j, text: "險以說，困而不失其所亨。處險而不改其說，“困而不失其所亨”也。" }
      - { type: z, text: "正義曰：此又就二體名訓以釋亨德也。坎險而兌說，所以困而能亨者，良由君子遇困，安其所遇，雖居險困之世，不失暢說之心，故曰“險以說，困而不失其所亨”也。" }
      - { type: j, text: "其唯君子乎？貞，大人吉，以剛中也。處困而用剛，不失其中，履正而能體大者也。能正而不能大博，未能說困者也，故曰“貞，大人吉”也。" }
      - { type: z, text: "正義曰：“其唯君子乎”者，結歎處困能通，非小人之事，唯君子能然也。“貞，大人吉，以剛中”者，此就二五之爻，釋“貞，大人”之義。剛則正直，所以為貞，中而不偏，所以能大。若正而不大，未能濟困，處困能濟，濟乃得吉而無咎也，故曰“貞，大人吉，以剛中”也。" }
      - { type: j, text: "有言不信，尚口乃窮也。處困而言，不見信之時也。非行言之時，而欲用言以免，必窮宅也。其吉在於“貞、大人”，口何為乎？" }
      - { type: z, text: "正義曰：處困求通，在於修德非用言以免困。徒尚口說，更致困窮，故曰“尚口乃窮”也。" }
      - { type: j, text: "《象》曰：澤無水，困。君子以致命遂志。澤無水，則水在澤下，水在澤下，困之象也。處困而屈其志者，小人也。“君子固窮”，道可忘乎？" }
      - { type: z, text: "正義曰：“澤無水，困”者，謂水在澤下，則澤上枯槁，萬物皆困，故曰“澤無水困”也。“君子以致命遂志”者，君子之人，守道而死，雖遭困厄之世，期於致命喪身，必當遂其高志，不屈撓而移改也，故曰“致命遂志”也。" }
      - { type: j, text: "初六：臀困於株木，入於幽谷，三歲不覿。最處底下，沈滯卑困，居無所安，故曰“臀困於株木”也。欲之其應，二隔其路，居則困於株木，進不獲拯，必隱遯者也，故曰：“入於幽谷”也。困之為道，不過數歲者也。以困而藏，困解乃出，故曰“三歲不覿”也。" }
      - { type: z, text: "“初六臀困於株”至“三歲不覿”。○正義曰：“臀困於株木”者，初六處困之時，以陰爻最居窮下，沈滯卑困，居不獲安，若臀之困於株木，故曰“臀困於株木”也。“入於幽谷”者，有應在四，而二隔之，居則困株，進不獲拯，勢必隱遯者也，故曰“入於幽谷也”。“三歲不覿”者，困之為道，不過數歲，困窮乃出，故曰“三歲不覿”也。" }
      - { type: j, text: "《象》曰：“入於幽谷”，幽不明也。言幽者，不明之辭也。入於不明，以自藏也。" }
      - { type: z, text: "正義曰：“幽不明”者，《象》辭惟釋幽字，言幽者，正是不明之辭，所以入不明，以自藏而避困也。釋株者，初不謂之株也。" }
      - { type: j, text: "九二：困於酒食，朱紱方來，利用享祀。徵兇，無咎。以陽居陰，尚謙者也。居困之時，處得其中。體夫剛質，而用中履謙，應不在一，心無所私，盛莫先焉。夫謙以待物，物之所歸；剛以處險，難之所濟。履中則不失其宜，無應則心無私恃，以斯處困，物莫不至，不勝豐衍，故曰“困於酒食”，美之至矣。坎，北方之卦也。朱紱，南方之物也。處困以斯，能招異方者也，故曰“朱紱方來”也。豐衍盈盛，故“利用享祀”。盈而又進，傾之道也。以此而徵，兇誰咎乎？故曰“徵兇無咎”。" }
      - { type: z, text: "“九二困於酒食”至“無咎”。○正義曰：“困於酒食”者，九二體剛居陰，處中無應。體剛則健，能濟險也。居陰則謙，物所歸也。處中則不失其宜，無應則心無私黨。處困以斯，物莫不至，不勝豐衍，故曰“困於酒食”也。“朱紱方來，利用享祀”者，紱，祭服也。坎，北方之卦也。紱，南方之物。處困用謙，能招異方者也。故曰“朱紱方來”也。舉異方者，明物無不至，酒食豐盈，異方歸向，祭則受福，故曰“利用享祀”。“徵兇無咎”者，盈而又進，傾敗之道，以徵必兇，故曰“徵兇”。自進致兇，無所怨咎，故曰“無咎”也。" }
      - { type: j, text: "《象》曰：“困於酒食”，中有慶也。" }
      - { type: z, text: "正義曰：“中有慶”者，言二以中德被物，物之所賴，故曰“有慶”也。" }
      - { type: j, text: "六三：困於石，據於蒺藜，入於其宮，不見其妻，兇。石之為物，堅而不納者也，謂四也。三以陰居陽，志武者也。四自納初，不受已者。二非所據，剛非所乘。上比困石，下據蒺藜，無應而入，焉得配偶？在困處斯，兇其宜也。" }
      - { type: z, text: "“六三困於石”至“不見其妻兇”。○正義曰：“困於石，據於蒺藜”者，石之為物，堅剛而不可入也。蒺藜之草，有剌而不可踐也。六三以陰居陽，志懷剛武，己又無應，欲上附於四，四自納於初，不受己者也，故曰“困於石”也。下欲比二，二又剛陽，非己所據，故曰“據於蒺藜”也。“入於其宮，不見其妻兇”者，無應而入，難得配偶，譬於入宮，不見其妻，處困以斯，兇其宜也，故曰“入於其宮，不見其妻，兇”也。" }
      - { type: j, text: "《象》曰：“據於蒺藜”，乘剛也。“入於其宮，不見其妻”，不祥也。" }
      - { type: z, text: "正義曰：“乘剛”者，明二為蒺藜也。“不祥也”者，祥，善也、吉也。不吉，必有兇也。" }
      - { type: j, text: "九四：來徐徐，困於金車。吝，有終。“金車”，謂二也。二剛以載者也，故謂之金車。“徐徐”者，疑懼之辭也。志在於初而隔於二，履不當位，威令不行。棄之則不能，欲往則畏二，故曰“來徐徐，困於金車”也。有應而不能濟之，故曰“吝”也。然以陽居陰，履謙之道，量力而處，不與二爭，雖不當位，物終與之，故曰“有終”也。" }
      - { type: z, text: "“九四來徐徐”至“有終”。○正義曰：何氏云：“九二以剛德勝，故曰‘金車’也。”“徐徐”者，疑懼之辭。九四有應於初而礙於九二，故曰“困於金車”。欲棄之，惜其配偶疑懼，而行不敢疾速，故“來徐徐”也。有應而不敢往，可恥可恨，故曰“吝”也。以陽居陰，不失謙道，為物之所與，故曰“有終”也。" }
      - { type: j, text: "《象》曰：“來徐徐”，志在下也。下謂初也。雖不當位，有與也。" }
      - { type: z, text: "正義曰“有與”者，位雖不當，執謙之故，物所與也。" }
      - { type: j, text: "九五：劓刖，困於赤紱，乃徐有說，利用祭祀。以陽居陽，任其壯者也。不能以謙致物，物則不附。忿物不附而用其壯猛，行其威刑，異方愈乖，遐邇愈叛。刑之欲以得，乃益所以失也，故曰“劓刖，困於赤紱”也。二以謙得之，五以剛失之，體在中直，能不遂迷困而徐能用其道者也。致物之功，不在於暴，故曰“徐”也。困而後乃徐，徐則有說矣，故曰“困於赤紱，乃徐有說”也。祭祀，所以受福也。履夫尊位，困而能改，不遂其迷以斯祭，祀必得福焉，故曰“利用祭祀”也。" }
      - { type: z, text: "“九五”至“利用祭祀”。○正義曰：九五以陽居陽，用其剛壯，物不歸已。見物不歸，而用威刑，行其“劓刖”之事。既行其威刑，則“異方愈乖，遐邇愈叛”。兌為西方之卦，赤紱南方之物，故曰“劓刖，困於赤紱”也。此卦九二為以陽居陰，用其謙退，能招異方之物也。此言九五剛猛，不能感異方之物也。若但用其中正之德，招致於物，不在速暴而徐徐，則物歸之而有說矣，故曰“乃徐有說”也。居得尊位，困而能反，不執其迷，用其祭祀，則受福也。" }
      - { type: j, text: "象曰：“劓刖”，志未得也。“乃徐有說”，以中直也。“利用祭祀”，受福也。" }
      - { type: z, text: "正義曰：“志未得也”者，由物不附己，己德未得，故曰“志未得”也。“乃徐有說，以中直也”者，居中得直，不貪不暴，終得其應，乃寬緩修其道德，則得喜說，故云“乃徐有說，以中直也”。“利用祭祀，受福”者，若能不遂迷志，用其中正，則異方所歸，祭則受福，故曰“利用祭祀，受福”也。" }
      - { type: j, text: "上六：困於葛藟，於臲卼，曰動悔、有悔，徵吉。居困之極，而乘於剛，下無其應，行則愈繞者也。行則纏繞，居不獲安，故曰“困於葛藟於臲卼”也。下句無困，因於上也。處困之極，行無通路，居無所安，困之至也。凡物窮則思變，困則謀通，處至困之地，用謀之時也。“曰”者，思謀之辭也。謀之所行，有隙則獲，言將何以通至困乎？“曰動悔”，令生有悔，以徵則濟矣，故曰“動悔有悔，徵吉”也。" }
      - { type: z, text: "“上六困於葛藟”至“徵吉”。○正義曰：葛藟，引蔓纏繞之草，臲卼，動搖不安之辭。上六處困之極，極困者也。而乘於剛，下又無應，行則纏繞，居不得安，故院“困於葛藟於臲卼”也。應亦言“困於臲卼”，“困”因於上，省文也。“凡物窮則思變，困則謀通，處至困之地”，是用謀策之時也。“曰”者，思謀之辭也。謀之所行，有隙則獲，言將何以通至困乎？為之謀曰：必須發動其可悔之事，令其有悔可知，然後處困求通，可以行而獲吉，故曰“動悔，有悔，徵吉”。" }
      - { type: j, text: "《象》曰：“困於葛藟”，未當也。所處未當，故致此困也。" }
      - { type: z, text: "正義曰：“未當也”者，處於困極，而又乘剛，所處不當，故致此困也。" }
      - { type: j, text: "“動悔，有悔”，吉行也。" }
      - { type: z, text: "正義曰：“吉行”者，知悔而徵，行必獲吉也。" }
      - { type: j, text: "巽下坎上。井：改邑不改井，井，以不變為德者也。" }
      - { type: z, text: "正義曰：“井”者，物象之名也。古者穿地取水，以瓶引汲，謂之為井。此卦明君子脩德養民，有常不變，終始無改，養物不窮，莫過乎井，故以修德之卦取譬名之“井”焉。“改邑不改井”者，以下明“井”有常德，此明“井”體有常，邑雖遷移而“井體”無改，故云“改邑不改井”也。" }
      - { type: j, text: "無喪無得，德有常也。" }
      - { type: z, text: "正義曰：此明井用有常德，終日引汲，未嘗言損；終日泉注，未嘗言益，故曰“無喪無得”也。" }
      - { type: j, text: "往來井井。不渝變也。" }
      - { type: z, text: "正義曰：此明性常。“井井”，絜靜之貌也。往者來者，皆使潔靜，不以人有往來，改其洗濯之性，故曰“往來井井”也。" }
      - { type: j, text: "汔至亦未繘井，巳來至而未出井也。羸其瓶，兇。井道以巳出為功也。幾至而覆，與未汲同也。" }
      - { type: z, text: "正義曰：此下明井誡，言井功難成也。汔，幾也。幾，近也。繘，綆也。雖汲水以至井上，然綆出猶未離井口，而鉤羸其瓶而覆之也。棄其方成之功，雖有出井之勞，而與未汲不異，喻今人行常德，須善始令終。若有初無終，則必致兇咎，故曰“汔至亦未繘井，羸其瓶，兇”。言“亦”者，不必之辭，言不必有如此不克終者。計獲一瓶之水，何足言兇？以喻人之修德不成，又云但取喻人之德行不恆，不能慎終如始，故就人言兇也。" }
      - { type: j, text: "《彖》曰：巽乎水而上水，井。音舉上之上。" }
      - { type: z, text: "“《彖》曰”至“水井”。○正義曰：此就二體釋“井”之名義。此卦坎為水在上，巽為木在下，又巽為入，以木入於水而又上水，井之象也。○注“音舉上之上”。○正義曰：嫌讀為去聲，故音之也。" }
      - { type: j, text: "井養而不窮也，“改邑不改井”，乃以剛中也。以剛處中，故能定居其所而不變也。" }
      - { type: z, text: "正義曰：“井養而不窮”者，歎美井德，愈汲愈生，給養於人，無有窮巳也。“改邑不改井，乃以剛中也”者，此釋井體有常，由於二五也。二五以剛居中，故能定居其所而不改變也。不釋“往來”二德者，無喪無得，“往來井井”，皆由此剛居中，更無他義，故不具舉《經》文也。" }
      - { type: j, text: "“汔至亦未繘井”，未有功也。井以巳成為功。" }
      - { type: z, text: "正義曰：水未及用，則井功未成，其猶人德事被物，亦是功德未就也。" }
      - { type: j, text: "“羸其瓶”，是以兇也。" }
      - { type: z, text: "正義曰：汲水未出而覆，喻脩德未成而止，所以致兇也。" }
      - { type: j, text: "《象》曰：木上有水，井，君子以勞民勸相。“木上有水”，井之象也。上水以養，養而不窮者也。相猶助也。可以勞民勸助，莫若養而不窮也。" }
      - { type: z, text: "正義曰：“木上有水”，則是上水之象，所以為井。“君子以勞民勸相”者，勞謂勞賚，相猶助也。井之為義，汲養而不窮，君子以勞來之恩，勤恤民隱，勸助百姓，使有成功，則此養而不窮也。" }
      - { type: j, text: "初六：井泥不食，舊井無禽。最在井底，上又無應，沈滯滓穢，故曰“井泥不食”也。井泥而不可食，則是久井不見渫治者也。久井不見渫治，禽所不向，而況人乎？一時所共棄捨也。井者不變之物，居德之地，恆德至賤，物無取也。" }
      - { type: z, text: "“初六並泥”至“無禽”。○正義曰：初六“最處井底，上又無應，沈滯滓穢”，即是井之下泥汙，不堪食也，故曰“井泥不食”也。井泥而不可食，即是“久井不見渫治，禽所不向，而況人乎？故曰“舊井無禽”也。○注“井者不變之物”。○正義曰：“井者不變之物，居德之地”者，《繇》辭稱“改邑不改井”，故曰“井者，不變之物，居德”者，《系辭》又云：“井，德之地”，故曰“居德之地”也。《注》言此者，明井既有不變，即是有恆，既居德地，即是用德也。今居窮下，即是恆德至賤，故物無取也，禽之與人，皆共棄捨也。" }
      - { type: j, text: "《象》曰：“井泥不食”，下也。“舊井無禽”，時舍也。" }
      - { type: z, text: "正義曰：“下也”者，以其最在井下，故為井泥也。“時舍也”者，以既非食，禽又不向，即是一時共棄捨也。" }
      - { type: j, text: "九二：井谷射鮒，甕敝漏。谿谷出水，從上注下，水常射焉。井之為道，以下給上者也。而無應於上，反下與初，故曰“井谷射鮒”。鮒，謂初也。失井之道，水不上出，而反下注，故曰“甕敝漏”也。夫處上宜下，處下宜上，井巳下矣，而復下注，其道不交，則莫之與也。" }
      - { type: z, text: "正義曰：“井谷射鮒”者，井之為德，以下汲上。九二上無其應，反下比初，施之於事，正似谷中之水，下注敝鮒，井而似谷，故曰“井谷射鮒”也。鮒謂初也。子夏《傳》云：“井中蝦<蟲麻>，呼為鮒魚也。”“甕敝漏”者，井而下注，失井之道，有似甕敝漏水，水漏下流，故曰“甕敝漏”也。" }
      - { type: j, text: "《象》曰：“井谷射鮒”，無與也。" }
      - { type: z, text: "正義曰：“無與也”者，井既處下，宜應汲上。今反養下，則不與上交，物莫之與，故曰“無與也”。" }
      - { type: j, text: "九三：井渫不食，為我心惻，可用汲。王明，並受其福。渫，不停汙之謂也。處下卦之上，復得其位，而應於上，得井之義也。當井之義而不見食，脩巳全潔而不見用，故“為我心惻”也。為，猶使也。不下注而應上，故“可用汲”也。王明則見照明，既嘉其行，又欽其用，故曰“王明，並受其福”也。" }
      - { type: z, text: "“九三井渫不食”至“王明並受其福”。○正義曰：“井渫不食”者，渫，治去穢汙之名也。井被渫治，則清潔可食。九三處下卦之上，異初六“井泥”之時，得位而有應於上，非“射鮒”之象。但井以上出為用，猶在下體，未有成功。功既未成，井雖渫治，未食也。故曰“井渫不食”也。“為我心惻”者，為，猶使也。井渫而不見食，猶人脩巳全潔而不見用，使我心中惻愴，故曰“為我心惻”也。“可用汲，王明，並受其福”者，不同九二下注而不可汲也，有應於上，是可汲也。井之可汲，猶人可用。若不遇明王，則滯其才用。若遭遇賢主，則申其行能賢主既嘉其行，又欽其用，故曰“可用汲，王明，並受其福”也。" }
      - { type: j, text: "《象》曰：“井渫不食”，行惻也。行感於誠，故曰“惻也”。求“王明”，受福也。" }
      - { type: j, text: "六四：井甃，無咎。得位而無應，白守而不能給上，可以修井之壞，補過而巳。" }
      - { type: z, text: "正義曰：“六四，井甃無咎”者，案：子夏《傳》曰：“甃亦治也，以磚壘井，脩井之壞，謂之為甃。”六四得位而無應，自守而巳，不能給上，可以脩井崩壞。施之於人，可以脩德補過，故曰“井甃無咎”也。" }
      - { type: j, text: "《象》曰：“井甃無咎”，脩井也。" }
      - { type: z, text: "正義曰：“脩井”者，但可脩井之壞，未可上給養人也。" }
      - { type: j, text: "九五：井洌寒泉，食。洌，絜也。居中得正，體剛不撓，不食不義，中正高絜，故“井洌寒泉”，然後乃“食”也。" }
      - { type: z, text: "正義曰：餘爻不當貴位，但脩德以待用。九五為卦之主，擇人而用之。洌，絜也。九五居中得正，而體剛直。既體剛直，則不食汙穢，必須井絜而寒泉，然後乃食。以言剛正之主，不納非賢，必須行絜才高，而後乃用，故曰“井洌寒泉，食”也。" }
      - { type: j, text: "《象》曰：“寒泉”之食，中正也。" }
      - { type: z, text: "正義曰：以“中正”者，若非居中得正，則任用非賢，不能要待寒泉，然後乃食也。必言“寒泉”者，清而冷者，水之本性，遇物然後濁而溫，故言寒泉以表絜也。" }
      - { type: j, text: "上九：井收。勿幕有孚，元吉。處井上極，水巳出井，井功大成，在此爻矣，故曰“井收”也。群下仰之以濟，淵泉由之以通者也。幕猶覆也。不擅其有，不私其利，則物歸之，往無窮矣，故曰“勿幕有孚，元吉”也。" }
      - { type: z, text: "正義曰：收，式胄反。凡物可收成者，則謂之收，如五穀之有收也。上六，處井之極，“水巳出井，井功大成”者也，故曰“井收”也。“勿幕有孚，元吉”者，幕，覆也。井功巳成，若能不擅其美，不專其利，不自掩覆，與眾共之，則為物所歸，信能致其大功，而獲元吉，故曰“勿幕有孚，元吉”也。" }
      - { type: j, text: "《象》曰：“元吉”在上，大成也。" }
      - { type: z, text: "正義曰：上六所以能獲“元吉”者，只為居“井”之上，並功大成者也。" }
      - { type: j, text: "離下兌上。革：巳日乃孚，元亨利貞，悔亡。夫民可與習常，難與適變；可與樂成，難與慮始。故革之為道，即日不孚，“巳日乃孚”也。孚，然後乃得“元亨利貞，悔亡”也。巳日而不孚，革不當也。悔吝之所生，生乎變動者也。革而當，其悔乃亡也。" }
      - { type: z, text: "正義曰：“革”者，改變之名也。此卦明改制革命，故名“革”也。“巳日乃孚”者，夫民情“可與習常，難與適變，可與樂成，難與慮始”。故革命之初，人未信服，所以“即日不孚，巳日乃孚”也。“元亨利貞悔亡”者，為革而民信之，然後乃得大通而利正也。悔吝之所生，生乎變動，革之為義，變動者也。革若不當，則悔吝交及，如能大通利貞，則革道當矣。為革而當，乃得亡其悔吝，故曰“元亨，利貞，悔亡”。" }
      - { type: j, text: "《彖》曰：革，水火相息，二女同居，其志不相得，曰“革”。凡不合，然後乃變生，變之所生，生於不合者也。故取不合之象以為“革”也。“息”者，生變之謂也，火欲上而澤欲下，水火相戰，而後生變者也。“二女同居”，而有水火之性，近而不相得也。" }
      - { type: z, text: "“《彖》曰”至“其志不相得曰革”。○正義曰：此就二體釋卦名也。水火相息，先就二象明《革》．息。生也。火本乾燥。澤本潤溼。燥溼殊性。不可共處。若其共處，必相侵克。既相侵克，其變乃生，變生則本性改矣。水熱而成湯，火滅而氣冷，是謂“革”也。“二女同居”者，此就人事明“革”也。中、少二女而成一卦，此雖形同而志革也。一男一女，乃相感應，二女雖復同居，其志終不相得。志不相得，則變必生矣，所以為“革”。" }
      - { type: j, text: "“巳曰乃孚”，革而信之。文明以說，大亨以正，革而當，其悔乃亡。夫所以得革而信者，“文明以說”也。“文明以說”，履正而行，以斯為革，應天順民，大亨以正者也。革而大亨以正，非當如何？" }
      - { type: z, text: "“巳日乃孚”至“其悔乃亡”。○正義曰：“巳日乃孚，革而信”者，釋“革”之為義，革初未孚，巳日乃信也。“文明以說”者，此舉二體上釋“革而信”，下釋四德也。能思文明之德以說於人，所以革命而為民所信也。“大亨以正”者，民既說文明之德而從之，所以大通而利正也。“革而當，其悔乃亡”者，為革若合於大通而利正，可謂當矣。革而當理，其悔乃亡消也。" }
      - { type: j, text: "天地革而四時成，湯武革命，順乎天而應乎人，革之時大矣哉！" }
      - { type: z, text: "“天地革而四時成”至“大矣哉”。○正義曰：“天地革而四時成”者，以下廣明《革》義，此先明“天地革”者，天地之道，陰陽升降，溫暑涼寒，迭相變革，然後四時之序皆有成也。“湯武革命，順乎天而應乎人”者，以明人革也。夏桀、殷紂，兇狂無度，天既震怒，人亦叛亡。殷湯、周武，聰明睿智，上順天命，下應人心，放桀鳴條，誅紂牧野，革其王命，改其惡俗，故曰“湯武革命，順乎天而應乎”。人計王者相承，改正易服，皆有變革，而獨舉湯、武者，蓋舜、禹禪讓，猶或因循，湯、武干戈，極其損益，故取相變甚者，以明人革也。“革之時大矣哉”者，備論革道之廣訖，總結歎其大，故曰“大矣哉”也。" }
      - { type: j, text: "《象》曰：澤中有火，革。君子以治明時。歷數時會，存乎變也。" }
      - { type: z, text: "正義曰：“澤中有火，革”者，火在澤中，二性相違，必相改變，故為革象也。“君子以治歷明時”者，天時變改，故須歷數，所以君子觀茲革象，脩治歷數，以明天時也。" }
      - { type: j, text: "初九：鞏用黃牛之革。在革之始，革道未成，固夫常中，未能應變者也。此可以守成，不可以有為也。鞏，固也。黃，中也。牛之革，堅仞不可變也。固之所用常中，堅仞不肯變也。" }
      - { type: z, text: "正義曰：鞏，固也。黃，中也。牛革，牛皮也。“革”之為義，變改之名，而名皮為革者，以禽獸之皮，皆可“從革”，故以喻焉。皮雖從革之物，然牛皮堅仞難變。初九在革之始，革道未成，守夫常中，未能應變，施之於事，有似用牛皮以自固，未肯造次以從變者也，故曰“鞏用黃牛之革”也。" }
      - { type: j, text: "《象》曰：“鞏用黃牛”，不可以有為也。" }
      - { type: z, text: "正義曰：“不可以有為”者，“有為”謂適時之變，有所云為也。既堅忍自固，可以守常，“不可以有為也”。" }
      - { type: j, text: "六二：巳日乃革之，徵吉，無咎。陰之為物，不能先唱，順從者也。不能自革，革巳乃能從之，故曰“巳日乃革之”也。二與五雖有水火殊體之異，同處厥中，陰陽相應，往必合志不憂咎也，是以徵吉而無咎。" }
      - { type: z, text: "“六二巳日”至“無咎”。○正義曰：“巳日乃革之”者，陰道柔弱，每事順從，不能自革，革巳日乃能從之，故曰“巳日乃革之”。“徵吉，無咎”者，與五相應，“同處厥中，陰陽相應，往必合志，不憂咎也”，故曰“徵吉，無咎”。二五雖是相應，而水火殊體，嫌有相剋之過。故曰“無咎”。" }
      - { type: j, text: "《象》曰：“巳日革之”，行有嘉也。" }
      - { type: z, text: "正義曰：“行有嘉”者，往應見納，故行有嘉慶也。" }
      - { type: j, text: "九三：徵兇，貞厲。革言三就，有孚。巳處火極，上卦三爻，雖體水性，皆“從革”者也。自四至上，從命而變，不敢自違，故曰“革言三就”。其言實誠，故曰“有孚”。“革言三就有孚”而猶徵之，兇其宜也。" }
      - { type: z, text: "正義曰：九三陽爻剛壯，又居火極，火性炎上，處革之時，欲徵之使革。徵之非道，則正之危也，故曰“徵兇，貞厲”。所以徵兇致危者，正以水火相息之物，既處於火極上之三爻，水在火上，皆“從革”者也。“自四至上，從命而變”，不敢有違，則“從革”之言三爻併成就不虛，故曰“革言三就”，其言實誠，故曰“有孚”也。既“革言三就有孚”，“從革”巳矣，而猶徵之，則兇，所以“徵兇”而“厲貞”。" }
      - { type: j, text: "《象》曰：“革言三就”，又何之矣。" }
      - { type: z, text: "正義曰：“又何之矣”者，徵之本為不從，既“革言三就”，更又何往征伐矣。" }
      - { type: j, text: "九四：悔亡，有孚改命，吉。初九處下卦之下，九四處上卦之下，故能變也。無應，悔也。與水火相比，能變者也，是以“悔亡”。處水火之際，居會變之始，能不固吝，不疑於下，信志改命，不失時願，是以“吉”也。有孚則見信矣。見信以改命，則物安而無違，故曰“悔亡，有孚改命，吉”也。處上體之下，始宣命也。" }
      - { type: z, text: "正義曰：九四與初，同處卦下。初九處下卦之下，革道未成，故未能變。九四處上卦之下，所以能變也。無應，悔也，能變，故“悔亡”也。處水火之際，“居會變之始，能不固吝，不疑於下”，信彼改命之志，而能從之，合於時願，所以得吉，故曰“有孚改命，吉”也。" }
      - { type: j, text: "《象》曰：“改命”之吉，信志也。“信志”而行。" }
      - { type: z, text: "正義曰：“信志”者，信下之志而行其命也。" }
      - { type: j, text: "九五：大人虎變，未佔有孚。“未佔而孚”，合時心也。" }
      - { type: z, text: "正義曰：九五居中處尊，以大人之德為革之主，損益前王，創制立法，有文章之美，煥然可觀，有似“虎變”，其文彪炳。則是湯、武革命，廣大應人，不勞佔決，信德自著，故曰“大人虎變，未佔有孚”也。" }
      - { type: j, text: "《象》曰：“大人虎變”，其文炳也。" }
      - { type: z, text: "正義曰：“其文炳”者，義取文章炳著也。" }
      - { type: j, text: "上六：君子豹變，小人革面。居變之終，變道巳成，君子處之，能成其文。小人樂成，則變面以順上也。" }
      - { type: z, text: "正義曰：上六居革之終，變道巳成，君子處之，雖不能同九五革命創制，如虎文之彪炳，然亦潤色鴻業，如豹文之蔚縟，故曰“君子豹變”也。“小人革面”者，小人處之，但能變其顏面，容色順上而巳，故曰“小人革面”也。" }
      - { type: j, text: "徵兇，居貞吉。改命創制，變道巳成，功成則事損，事損則無為。故居則得正而吉，徵則躁擾而兇也。" }
      - { type: z, text: "正義曰：革道巳成，宜安靜守正，更有所徵則兇，居而守正則吉，故曰“徵兇，居貞吉”也。" }
      - { type: j, text: "《象》曰：“君子豹變”，其文蔚也。“小人革面”，順以從君也。" }
      - { type: z, text: "正義曰：“其文蔚”者，明其不能大變，故文炳而相映蔚也。“順以從君”者，明其不能潤色立制，但順而從君也。" }
      - { type: j, text: "巽下離上。鼎：元吉，亨。革去故而鼎取新，取新而當其人，易故而法制齊明，吉然後乃亨，故先“元吉”而後“亨”也。鼎者，成變之卦也。革既變矣，則制器立法以成之焉。變而無制，亂可待也。法制應時，然後乃吉；賢愚有別，尊卑有序，然後乃亨，故先“元吉”而後乃“亨”。" }
      - { type: z, text: "正義曰：鼎者，器之名也。自火化之後鑄金，而為此器以供烹飪之用，謂之為鼎。亨飪成新，能成新法。然則鼎之為器，且有二義：一有亨飪之用，二有物象之法，故《彖》曰“鼎，象也，明其有法象也”。《雜卦》曰“革去故”而“鼎取新”，明其亨飪有成新之用。此卦明聖人革命，示物法象，惟新其制，有“鼎”之義，“以木巽火”，有“鼎”之象，故名為《鼎》焉。變故成新，必須當理，故先元吉而後乃亨，故曰“鼎，元吉，亨”也。" }
      - { type: j, text: "《彖》曰：鼎，象也。法象也。" }
      - { type: z, text: "正義曰：明鼎有亨飪成新之法象也。" }
      - { type: j, text: "以木巽火，亨飪也。“亨飪”，鼎之用也。" }
      - { type: z, text: "正義曰：此明上下二象有亨飪之用，此就用釋卦名也。" }
      - { type: j, text: "聖人亨，以享上帝，而大亨以養聖賢。亨者，鼎之所為也。“革去故”而鼎成新，故為亨飪調和之器也。去故取新，聖賢不可失也。飪，孰也。天下莫不用之，而聖人用之，乃上以享上帝，而下以“大亨”養聖賢也。" }
      - { type: z, text: "正義曰：此明鼎用之美。亨飪所須，不出二種，一供祭祀，二當賓客。若祭祀則天神為大，賓客則聖賢為重，故舉其重大，則輕小可知。享帝直言“亨”，養人則言“大亨”者，享帝尚質，特性而已，故直言“亨”。聖賢既多，養須飽飫，故“亨”上加“大”字也。" }
      - { type: j, text: "巽而耳目聰明。聖賢獲養，則巳不為而成矣，故“巽而耳目聰明”也。" }
      - { type: z, text: "正義曰：此明鼎用之益。言聖人既能謙巽大養聖賢，聖賢獲養，則憂其事而助於巳，明目達聰，不勞己之聰明，則“不為而成矣”。" }
      - { type: j, text: "柔進而上行，得中而應乎剛，是以元亨。謂五也。有斯二德，故能成新，而獲“大亨”也。" }
      - { type: z, text: "正義曰：此就六五釋“元吉亨”，以柔進上行，體巳獲通，得中應剛，所通者大，故能製法成新，而獲“大亨”也。" }
      - { type: j, text: "《象》曰木上有火，鼎。君子以正位凝命。凝者，嚴整之貌也。鼎者，取新成變者也。“革去故”而鼎成新。“正位”者，明尊卑之序也。“凝命”者，以成教命之嚴也。" }
      - { type: z, text: "正義曰：“木上有火”，即是“以木巽火”，有亨飪之象，所以為鼎也。“君子以正位凝命”者，凝者，嚴整之貌也。鼎既成新，即須製法。製法之美，莫若上下有序，正尊卑之位，輕而難犯，布嚴凝之命，故君子象此以“正位凝命”也。" }
      - { type: j, text: "初六：鼎顛趾，利出否，得妾以其子，無咎。凡陽為實而陰為虛，鼎之為物，下實而上虛。而今陰在下，則是為覆鼎也，鼎覆則趾倒矣。否謂不善之物也。取妾以為室主，亦“顛趾”之義也。處鼎之初，將在納新，施顛以出穢，得妾以為子，故“無咎”也。" }
      - { type: z, text: "正義曰：“鼎顛趾”，趾，足也。凡陽為實而陰為虛，鼎之為物，下實而上虛。初六居鼎之始，以陰處下，則是下虛上實，而鼎足倒矣，故曰“鼎顛趾”也。“利出否”者，否者不善之物，鼎之倒趾，失其所利，鼎覆而不失其利，在於寫出否穢之物也，故曰“利出否也”。“得妾以其子，無咎”者，妾者側媵，非正室也。施之於人，正室雖亡，妾猶不得為室主。妾為室主，亦猶鼎之顛趾，而有咎過。妾若有賢子，則母以子貴，以之繼室，則得“無咎”，故曰“得妾以其子，無咎”也。" }
      - { type: j, text: "《象》曰：“鼎顛趾”，未悖也。倒以寫否，故未悖也。" }
      - { type: z, text: "正義曰：“未悖也”者，倒趾以出否，未為悖逆也。" }
      - { type: j, text: "“利出否”，以從貴也。棄穢以納新也。" }
      - { type: z, text: "正義曰：“以從貴”者，舊，穢也。新，貴也。棄穢納新，所以“從貴”也。然是去妾之賤名而為室主，亦從子貴也。" }
      - { type: j, text: "九二：鼎有實，我仇有疾，不我能即，吉。以陽之質，處鼎之中，有實者也。有實之物，不可復加，益之則溢，反傷其實。“我仇”，謂五也。困於乘剛之疾不能就我，則我不溢，得全其吉也。" }
      - { type: z, text: "正義曰：實謂陽也。仇是匹也。即，就也。九二以陽之質，居鼎之中，“有實”者也，故曰“鼎有實”也。有實之物，不可復加也。加之則溢，而傷其實矣。六五我之仇匹，欲來應我，“困於乘剛之疾不能就我，則我不溢”而“全其吉”也，故曰“我仇有疾，不我能即，吉”。" }
      - { type: j, text: "《象》曰：“鼎有實”，慎所之也。有實之鼎，不可復有所取。才任巳極，不可復有所加。" }
      - { type: z, text: "正義曰：“慎所之”者，之，往也。自此巳往，所宜慎之也。" }
      - { type: j, text: "“我仇有疾”，終無尤也。" }
      - { type: z, text: "正義曰：“終無尤也”者，五既有乘剛之疾，不能加我，則我“終無尤也”。" }
      - { type: j, text: "九三：鼎耳革，其行塞，雉膏不食。方雨虧悔，終吉。“鼎”之為義，虛中以待物者也。而三處下體之上，以陽居陽，守實無應，無所納受。耳宜空以待鉉，而反全其實塞，故曰“鼎耳革，其行塞”，雖有雉膏，而終不能食也。雨者，陰陽交和，不偏亢者也，雖體陽爻，而統屬陰卦。若不全任剛亢，務在和通，“方雨”則悔虧，終則吉也。" }
      - { type: z, text: "“九三鼎耳革”至“終吉”。○正義曰：“鼎耳革其行塞”者，“鼎”之為義，下實上虛，是空以待物者也。“鼎耳”之用，亦宜空以待鉉。今九三處下體之上，當此鼎之耳，宜居空之地，而以陽居陽，是以實處實者也。既實而不虛，則變革鼎耳之常義也。常所納物受鉉之處，今則塞矣，故曰“鼎耳革，其行塞”也。“雉膏不食”者，非有體實不受，又上九不應於己，亦無所納，雖有其器，而無所用，雖有雉膏，而不能見食也，故曰：“雉膏不食。”“方雨虧悔，終吉”者，“雨者，陰陽交和，不偏亢者也。雖體陽爻，而統屬陰卦。若不全任剛亢，務在和通”，方欲為此和通，則悔虧而終獲吉，故曰“方雨虧悔，終吉”也。" }
      - { type: j, text: "《象》曰：“鼎耳革”，失其義也。" }
      - { type: z, text: "正義曰：“失其義也”者，失其虛中納受之義也。" }
      - { type: j, text: "九四：鼎折足，覆公餗，其形渥，兇。處上體之下而又應初，既承且施，非巳所堪，故曰“鼎折足”也。初已“出否”，至四所盛，則巳絜矣，故曰“覆公餗”也。渥，沾濡之貌也。既“覆公餗”，體為渥沾，知小謀大，不堪其任，受其至辱，災及其身，故曰“其形渥，兇”也。" }
      - { type: z, text: "“九四鼎折足”至“其形渥兇“。○正義曰：“鼎折足，覆公餗”者，餗，糝也。八珍之膳，鼎之實也。初以“出否”，至四所盛，故當馨絜矣，故以“餗”言之。初處下體之下，九四處上體之下，上有所承而又應初，下有所施，既承且施，非己所堪，故曰“鼎折足”。鼎足既折，則“覆公餗”也。“渥，沾濡之貌也。既覆公餗”，體則渥霑也。施之於人，知小而謀大，力薄而任重，如此必受其至辱，災及其身也，故曰“其形渥，兇”。" }
      - { type: j, text: "《象》曰：“覆公餗”，信如何也。不量其力，果致兇災，信之如何？" }
      - { type: z, text: "正義曰：“信如何也”者，言不能治之於未亂，既敗之後，乃責之云：不量其力，果致兇災，災既及矣，信如之何也？言信有此不可如何之事也。" }
      - { type: j, text: "六五：鼎黃耳金鉉，利貞。居中以柔，能以通理，納乎剛正，故曰“黃耳金鉉，利貞”也。耳黃，則能納剛正以自舉也。" }
      - { type: z, text: "正義曰：黃，中也。金，剛也。鉉所以貫鼎而舉之也。五為中位，故曰“黃耳”。應在九二，以柔納剛，故曰“金鉉”。所納剛正，故曰“利貞”也。" }
      - { type: j, text: "《象》曰：“鼎黃耳”，中以為實也。以中為實，所受不妄也。" }
      - { type: z, text: "正義曰：“中為實也”者，言六五“以中為實，所受不妄也”。" }
      - { type: j, text: "上九：鼎玉鉉，大吉，無不利。處鼎之終，鼎道之成也。居鼎之成，體剛履柔，用勁施鉉，以斯處上，高不誡亢，得夫剛柔之節，能舉其任者也。應不在一，則應所不舉，故曰“大吉，無不利”也。" }
      - { type: z, text: "正義曰：“鼎玉鉉”者，玉者，堅剛而有潤者也。上九居鼎之終，鼎道之成，體剛處柔，則是用玉鉉以自舉者也，故曰“鼎玉鉉”也。“大吉，無不利”者，應不在一，即靡所不舉，故得“大吉”而“無不利”。" }
      - { type: j, text: "《象》曰：玉鉉在上，剛柔節也。" }
      - { type: z, text: "正義曰“剛柔節”者，以剛履柔，雖復在上，不為《乾》之“亢龍”，故曰“剛柔節”也。" }
      - { type: j, text: "震下震上。震：亨。懼以成，則是以亨。" }
      - { type: z, text: "正義曰：震，動也。此，由懼而獲通，所以震有亨德，故曰“震亨”也。" }
      - { type: j, text: "震來虩虩，笑言啞啞。震之為義，威至而後乃懼也，故曰“震來虩虩”，恐懼之貌也。震者，驚駭怠惰以肅解慢者也，故“震來虩虩，恐致福也。笑言啞啞，後有則也”。" }
      - { type: z, text: "正義曰：“虩虩”，恐懼之貌也。“啞啞”，笑語之聲也。“震”之為用，天之威怒，所以肅整怠慢，故迅雷風烈，君子為之變容，施之於人事，則是威嚴之教行於天下也。故震之來也，莫不恐懼，故曰“震來虩虩”也。物既恐懼，不敢為非，保安其福，遂至笑語之盛，故曰“笑言啞啞”也。" }
      - { type: j, text: "震驚百里，不喪匕鬯。威震驚乎百里，則是可以不喪七鬯矣。匕，所以載鼎實；鬯，香酒，奉宗廟之盛也。" }
      - { type: z, text: "“震驚百里，不喪七鬯”。○正義曰：匕，所以載鼎實；鬯，香酒也。奉宗廟之盛者也。震卦施之於人，又為長子，長子則正體於上，將所傳重，出則撫軍，守則監國，威震驚於百里，可以奉承宗廟，彝器粢盛，守而不失也，故曰“震驚百里，不喪七鬯”。○注“威震驚乎百里”至“宗廟之盛也”。○正義曰：先儒皆云：雷之發聲，聞乎百里。故古帝王制國，公侯地方百里，故以象焉。竊謂天之震雷，不應止聞百里，蓋以古之啟土，百里為極。文王作《繇》在殷時，明長子威震於一國，故以“百里”言之也。“匕所以載鼎實，鬯香酒”者，陸績云：“匕者棘匕，橈鼎之器。”先儒皆云：匕形似畢，但不兩岐耳。以棘木為之，長三尺，刊柄與末。《詩》云“有捄棘匕”是也。用棘者，取其赤心之義。祭祀之禮，先烹牢於鑊，既納諸鼎而加冪焉。將薦乃舉冪，而以匕出之，升於俎上，故曰“匕所以載鼎實”也。鬯者，鄭玄之義，則為秬黍之酒，其氣調暢，故謂之“鬯”。《詩傳》則為鬯是香草。案：王度《記》云：“天子鬯，諸侯薰，大夫蘭。”以例而言之，則鬯是草明矣。今特言“匕鬯”者，鄭玄云：“人君於祭祀之禮，尚牲薦鬯而巳，其餘不足觀也。”" }
      - { type: j, text: "《彖》曰：“《震》，亨。”“震來虩虩”，恐致福也。“笑言啞啞”，後有則也。“震驚百里”，驚遠而懼邇也。威靈驚乎百里，則惰者懼於近也。" }
      - { type: z, text: "“《彖》曰震亨”至“懼邇也”。○正義曰：“震亨”者，卦之名德。但舉《經》而不釋名德所由者，正明由懼得通，故曰“震亨”，更無他義。或本無此二字。“震來虩虩，恐致福也”者，威震之來，初雖恐懼，能因懼自修，所以致福也。”笑言啞啞，後有則也”者，因前恐懼自修，未敢寬逸，致福之後，方有“笑言”。以曾經戒懼，不敢失則，必時然後言，樂然後笑，故曰“笑言啞啞，後有則也”。“震驚百里，驚遠而懼邇”者，言威震驚於百里之遠，則惰者恐懼於近也。" }
      - { type: j, text: "出，可以守宗廟社稷，以為祭主也。明所以堪長子之義也。“不喪匕鬯”，則巳“出可以守宗廟”。" }
      - { type: z, text: "“出可以守宗廟”至“為祭主也”。○正義曰：釋“不喪匕鬯”之義也。出，謂君出巡狩等事也。君出，則長子留守宗廟社稷，攝祭主之禮事也。○注“巳出”。○正義曰：“巳出”謂君也。" }
      - { type: j, text: "《象》曰：洊雷，震。君子以恐懼脩省。" }
      - { type: z, text: "正義曰：洊者，重也，因仍也。雷相因仍，乃為威震也。此是重震之卦，故曰“洊雷震”也。“君子以恐懼修省”者，君子恆自戰戰兢兢，不敢懈惰，今見天之怒，畏雷之威，彌自脩身省察己過，故曰“君子以恐懼脩省”也。" }
      - { type: j, text: "初九：“震來虩虩”，後“笑言啞啞”，吉。體夫剛德，為卦之先，能以恐懼脩其德也。" }
      - { type: z, text: "正義曰：初九剛陽之德，為一卦之先，剛則不闇於幾，先則能有前識。故處震驚之始，能以恐懼自脩，而獲其吉，故曰“震來虩虩，後笑言啞啞，吉”。此爻辭兩句，既與卦同，《象》辭釋之，又與《彖》不異者，蓋卦主威震之功，令物恐懼致福，爻論遇震而懼、脩省致福之人，卦則自震言人，爻則據人威震，所說雖殊，其事一也。所以爻卦二辭，本未俱等，其猶《屯卦》初九，與卦俱稱“利建侯”。然卦則凡舉屯時，宜其有所封建，爻則“以貴下賤”，則是堪建之人，此《震》之初九，亦其類也。" }
      - { type: j, text: "《象》曰：“震來虩虩，恐致福也。笑言啞啞，後有則也。”" }
      - { type: j, text: "六二：震來厲，億喪貝。躋於九陵，勿逐，七日得。“震”之為義，威駭怠懈，肅整惰慢者也。初幹其任而二乘之，“震來”則危，喪其資貨，亡其所處矣，故曰“震來厲，億喪貝”。億，辭也。貝，資貨、糧用之屬也。犯逆受戮，無應而行，行無所舍。威嚴大行，物莫之納，無糧而走。雖復超越陵險，必困於窮匱，不過七日，故曰“勿逐，七日得”也。" }
      - { type: z, text: "“六二震來厲億”至“勿逐七日得”。○正義曰：“震來厲，億喪貝”者，“億，辭也。貝，資貨糧用之屬”。震之為用，本威惰慢者也。初九以剛處下，聞震而懼，恐而致福，即是有德之人。六二以陰賤之體，不能敬於剛陽，尊其有得，而反乘之，是傲尊陵貴，為天所誅。震來則有危亡，喪其資貨，故曰“震來厲，億喪貝”也。“躋於九陵，勿逐，七日得”者，躋，升也。“犯逆受戮，無應而行，行無所舍。威嚴大行，物莫之納”。既喪資貨，“無糧而走，雖復超越陵險，必困於窮匱，不過七日”，為有司所獲矣，故曰“躋於九陵，勿逐，七日得”。" }
      - { type: j, text: "《象》曰：“震來厲”，乘剛也。" }
      - { type: z, text: "正義曰：“乘剛也”者，只為乘於剛陽，所以犯逆受戮也。" }
      - { type: j, text: "六三：震蘇蘇，震行無眚。不當其位，位非所處，故懼“蘇蘇”也。而無乘剛之逆，故可以懼行而“無眚”也。" }
      - { type: z, text: "“六三震蘇蘇，震行無眚”。○正義曰：蘇蘇，畏懼不安之貌。六三居不當位，故震懼而“蘇蘇”然也。雖不當位，而無乘剛之逆，故可以懼行而無災眚也。故曰“震蘇蘇，震行無眚”也。○注“故懼”。○正義曰：驗《注》以訓震為懼，蓋懼不自為懼，由震故懼也。自下爻辭，皆以震言懼也。" }
      - { type: j, text: "《象》曰：“震蘇蘇”，位不當也。" }
      - { type: z, text: "正義曰：“位不當”者，其猶竊位者，遇威嚴之世，不能自安也。" }
      - { type: j, text: "九四：震遂泥。處四陰之中，居恐懼之時，為眾陰之主，宜勇其身，以安於眾。若其震也。遂困難矣。履夫不正不能除恐，使物安已，德未光也。" }
      - { type: z, text: "正義曰：九四處四陰之中，“為眾陰之主”，當恐懼之時，“宜勇其身，以安於眾”。若其自懷震懼，則遂滯溺而困難矣，故曰“震遂泥”也。然四失位違中，則是有罪自懼，遂沈泥者也。" }
      - { type: j, text: "《象》曰：“震遂泥”未光也。" }
      - { type: z, text: "正義曰：“未光也”者，身既不正，不能除恐，使物安己，是道德未能光大也。" }
      - { type: j, text: "六五：震往來厲，意無喪，有事。往則無應，來則乘剛，恐而往來，不免於危。夫處震之時，而得尊位，斯乃有事之機也。而懼往來，將喪其事，故曰“億無喪，有事也”。" }
      - { type: z, text: "正義曰：“震往來厲”者，六五“往則無應，來則乘剛，恐而往來，不免於咎”，故曰“震往來厲”也。“億無喪有事”者，“夫處震之時，而得尊位，斯乃有事之機”，而懼以往來，“將喪其事”，故戒之曰“億無喪，有事”也。" }
      - { type: j, text: "《象》曰：“震往來厲”，危行也。其事在中，大無喪也。大則無喪，往來乃危也。" }
      - { type: z, text: "正義曰：“危行也”者，懷懼往來，是致危之行。“其事在中，大無喪也”者，六五居尊，當有其事，在於中位，得建大功。若守中建大，則“無喪有事”。若恐懼往來，則致危無功也。" }
      - { type: j, text: "上六：震索索，視矍矍，徵兇。震不於其躬，於其鄰，無咎。婚媾有言。處震之極，極震者也。居震之極，求中未得，故懼而“索索”，視而“矍矍”，無所安親也。已處動極而復徵焉，兇其宜也。若恐非已造，彼動故懼，懼鄰而戒，合於備預，故“無咎”也。極懼相疑，故雖“婚媾”而“有言”也。" }
      - { type: z, text: "“上六震索索”至“婚媾有言”。○正義曰：“震索索，視矍矍”者，索索，心不安之貌，矍矍，視不專之容。上六處震之極，極震者也。既居震位，欲求中理以自安而未能得，“故懼而索索，視而矍矍，無所安親”。“徵兇”者，夫“處動懼之極而復徵焉，兇其宜也”，故曰“徵兇”也。“震不於其躬，於其鄰，無咎”者，若恐非己造，彼動故懼，懼鄰而戒，合於備豫，則得無咎，故曰“震不於其躬，於其鄰，無咎”也。“婚媾有言”者，居極懼之地，雖復婚媾相結，亦不能無相疑之言，故曰“婚媾有言”也。" }
      - { type: j, text: "《象》曰：“震索索”中未得也。雖兇無咎，畏鄰戒也。" }
      - { type: z, text: "正義曰：“中未得也”者，猶言未得中也。“畏鄰戒也”者，畏鄰之動，懼而自戒，乃得“無咎”。" }
      - { type: j, text: "艮下艮上。艮：其背，目無患也。" }
      - { type: z, text: "正義曰：目者，能見之物，施止於面，則抑割所見，強隔其欲，是目見之所患。今施止於背，則“目無患也”。" }
      - { type: j, text: "不獲其身，所止在後，故不得其身也。行其庭，不見其人，相背故也。無咎。凡物對面而不相通，“否”之道也。艮者，止而不相交通之卦也。各止而不相與，何得無咎？唯不相見乃可也。施止於背，不隔物欲，得其所止也。背者，無見之物也。無見則自然靜止，靜止而無見，則“不獲其身”矣。“相背”者，雖近而不相見，故“行其庭，不見其人”也。夫施止不於無見，令物自然而止，而強止之，則奸邪並興，近而不相得則兇。其得“無咎”，“艮其背，不獲其身，行其庭，不見其人”故也。" }
      - { type: z, text: "“艮其背不獲其身”至“無咎”。○正義曰：“艮其背，不獲其身，行其庭，不見其人，無咎”者，“艮，止也”，靜止之義，此是象山之卦，其以“艮”為名。施之於人，則是止物之情，防其動欲，故謂之止。“艮其背”者，此明施止之所也。施止得所，則其道易成，施止不得其所，則其功難成，故《老子》曰：“不見可欲，使心不亂也。”“背者，無見之物也。”夫“無見則自然靜止”。夫欲防止之法，宜防其未兆。既兆而止，則傷物情，故施止於無見之所，則不隔物欲，得其所止也。若“施止於面”，則“對面而不相通”，強止其情，則“奸邪並興”，而有兇咎。止而無見，則所止在後，不與而相對。言有物對面而來，則情欲有私於己。既止在後，則是施止無見。所止無見，何見其身，故“不獲其身”。既“不獲其身”，則相背矣。相背者，雖近而不相見，故“行其庭，不見其人”。如此乃得“無咎”，故曰“艮其背，不獲其身，行其庭，不見其人，無咎”也。又若能止於未兆，則是治之於未萌，若對面不相交通，則是“否”之道也。但止其背，可得“無咎”也。" }
      - { type: j, text: "《彖》曰：艮，止也。時止則止，時行則行，動靜不失其時，其道光明。正道不可常用，必施於不可以行。適於其時，道乃光明也。" }
      - { type: z, text: "“《彖》曰艮止也”至“其道光明”。○正義曰：“艮，止也”者，訓其名也。“時止則止，時行則行，動靜不失其時，其道光明”者，將釋施止有所光明，施止有時，凡物之動息，自各有時運。用止之法，不可為常，必須應時行止，然後其道乃得光明也。" }
      - { type: j, text: "艮其止，止其所也。易背曰止，以明背即止也。施止不可於面，施背乃可也。施止於止，不施止於行，得其所矣，故曰“艮其止，止其所”也。" }
      - { type: z, text: "正義曰：此釋施止之所也。“艮其止”者，疊《經》文“艮其背”也。“易背曰止，以明背”者，無見之物，即是可止之所也。既時止即宜止，時行則行，所以施止須是所。“艮”既訓止，今言“艮其止”，是止其所止也，故曰“艮其止，止其所”也。" }
      - { type: j, text: "上下敵應，不相與也。是以不獲其身。“行其庭，不見其人，無咎”也。" }
      - { type: z, text: "正義曰：“上下敵應，不相與也”者，此就六爻皆不相應，釋艮卦之名，又釋“不獲其身”以下之義。凡應者，一陰一陽，二體不敵。今上下之位，雖復相當，而爻皆峙敵，不相交與，故曰“上下敵應，不相與”也。然八純之卦皆六爻不應，何獨於此言之者，謂此卦既止而不加交，又峙而不應，與“止”義相協，故兼此以明之也。是以“不獲其身，行其庭，不見其人，無咎也”者，此舉《經》文以結之，明相與而止之，則“無咎”也。" }
      - { type: j, text: "《象》曰：兼山，艮，君子以思，不出其位。各止其所，不侵官也。" }
      - { type: z, text: "正義曰：“兼山艮”者，兩山義重，謂之“兼山”也，直置一山，巳能鎮止。今兩山重疊，止義彌大，故曰“兼山艮”也。“君子以思，不出其位”者，止之為義，各止其所。故君子於此之時，思慮所及，不出其已位也。" }
      - { type: j, text: "初六：艮其趾，無咎，利永貞。處止之初，行無所之，故止其趾，乃得“無咎”；至靜而定，故利永貞。" }
      - { type: z, text: "正義曰：“艮其趾，無咎”者，趾，足也，初處體下，故謂之足。居止之初，行無所適，止其足而不行，乃得無咎。故曰“艮其趾，無咎”也。“利永貞”者，靜止之初，不可以躁動，故利在“永貞”也。" }
      - { type: j, text: "《象》曰：“艮其趾”，未失正也。" }
      - { type: z, text: "正義曰：“未失正也”者，行則有咎，止則不失其正，釋所以“利永貞”。" }
      - { type: j, text: "六二：艮其腓，不拯其隨，其心不快。隨謂趾也。止其腓，故其趾不拯也。腓體躁而處止，而不得拯其隨，又不能退聽安靜，故“其心不快”也。" }
      - { type: z, text: "正義曰：“艮其腓，不拯其隨”者，腓，腸也。在足之上。腓體或屈或伸，躁動之物，腓動則足隨之，故謂足為隨。拯，舉也，今既施止於腓，腓不得動，則足無拯舉，故曰“艮其腓，不拯其隨”也。“其心不快”者，腓是躁動之物，而強心之，貪進而不得動，則情與質乖也，故曰“其心不快”。此爻明施止不得其所也。" }
      - { type: j, text: "《象》曰：“不拯其隨”，未退聽也。" }
      - { type: z, text: "正義曰：“未退聽也”者，聽，從也，既不能拯動，又不能靜退聽從其見止之命，所以“其心不快”矣。" }
      - { type: j, text: "九三：艮其限，列其夤，厲薰心。限，身之中也。三當兩象之中，故曰“艮其限”。夤，當中脊之肉也。止加其身，中體而分，故“列其夤”而憂危薰心也。“艮”之為義，各止於其所，上下不相與，至中則列矣。列加其夤，危莫甚焉。危亡之憂，乃薰灼其心也。施止體中，其體分焉。體分兩主，大器喪矣。" }
      - { type: z, text: "“九三艮其限”至“厲薰心”。○正義曰：限，身之中，人帶之處，言三當兩象之中，故謂之限。施止於限，故曰“艮其限”也。夤，當中脊之肉也。薰，燒灼也。既止加其身之中，則上下不通之義也，是分列其夤。夤既分列，身將喪亡，故憂危之切，薰灼其心矣。然則君臣共治，大體若身，大體不通，則君臣不接，君臣不接，則上下離心，列夤則身亡，離心則國喪，故曰“列其夤，厲薰心”。○注“體分兩主，大器喪矣”。○正義曰：“體分兩主大器喪矣”者，大器謂國與身也。此爻亦明施止不得其所也。" }
      - { type: j, text: "《象》曰：“艮其限”，危薰心也。" }
      - { type: j, text: "六四：艮其身，無咎。中上稱身，履得其位，止求諸身，得其所處，故不陷於咎也。" }
      - { type: z, text: "“六四，艮其身，無咎”。○正義曰：“艮其身，無咎”者，“中上稱身”。六四居止之時，已入上體，履得其位，止求諸身，不陷於咎，故曰“艮其身，無咎”也。求，責也。諸，之也。" }
      - { type: j, text: "《象》曰：“艮其身”，止諸躬也。自止其躬不分全體" }
      - { type: z, text: "“《象》曰”至“止諸躬也”。○正義曰：“止諸躬也”者，躬猶身也，明能靜止其身，不為躁動也。○注“自止其躬不分全體”。○正義曰：艮卦總其兩體以為二身，兩體不分，乃謂之全，全乃謂之身。以九三居兩體之際，在於身中，未入上體，則是止於下體，不與上交，所以體分夤列。六四巳入上體，則非上下不接，故能總止其身不分全體。然則身是總名，而言“中上稱身”者何也？蓋至中則體分而身喪，入上體則不分而身全。九三施止於分體，故謂之“限”，六四施止於全體，故謂之“身”。非中上獨是其身，而中下非身也。" }
      - { type: j, text: "六五：艮其輔，言有序，悔亡。施止於輔，以處於中，故口無擇言，能亡其悔也。" }
      - { type: z, text: "正義曰：輔，頰車也，能止於輔頰也。以處其中，故“口無擇言”也。言有倫序，能亡其悔，故曰“艮其輔，言有序，悔亡”。" }
      - { type: j, text: "《象》曰：“艮其輔”，以中正也。能用中正，故“言有序”也。" }
      - { type: z, text: "正義曰：“以中正”者，位雖不正，以居得其中，故不失其正，故“言有序”也。" }
      - { type: j, text: "上九：敦艮，吉。居止之極，極止者也。敦重在上，不陷非妄，宜其“吉”也。" }
      - { type: z, text: "正義曰：敦，厚也。上九居艮之極，極止者也。在上能用敦厚以自止，不陷非妄，宜其吉也，故曰“敦艮吉”也。" }
      - { type: j, text: "《象》曰：“敦艮”之吉，以厚終也。" }
      - { type: z, text: "正義曰：“以厚終”者，言上九能以敦厚自終，所以獲“吉”也。" }
      - { type: j, text: "艮下巽上。漸：女歸吉，利貞。漸者，漸進之卦也。“止而巽”，以斯適進，漸進者也。以止巽為進，故“女歸吉”也。進而用正，故“利貞”也。" }
      - { type: z, text: "正義曰：“漸”者，不速之名也。凡物有變移，徐而不速，謂之漸也。“女歸吉”者，歸嫁也。女人生有外成之義，以夫為家，故謂嫁曰“歸”也。婦人之嫁，備禮乃動，故漸之所施，吉在女嫁，故曰“女歸吉”也。“利貞”者，女歸有漸，得禮之正，故曰“利貞”也。" }
      - { type: j, text: "《彖》曰：漸，之進也。之於進也。" }
      - { type: z, text: "正義曰：釋卦名也。漸是徐動之名，不當進退，但卦所名“漸”，是“之於進”也。" }
      - { type: j, text: "“女歸吉”也。進得位，往有功也。進以正，可以正邦也。其位，剛得中也。以漸進得位也。" }
      - { type: z, text: "“女歸吉也”至“得中也”。○正義曰：“女歸吉也”者，漸漸而進之，施於人事，是女歸之吉也。“進得位，往有功也，進以正，可以正邦也”者，此就九五得位剛中釋“利貞”也。言進而得於貴位，是“往而有功”也。以六二適九五，是進而以正。身既得正，“可以正邦”也。“其位剛得中”者，此卦爻皆得位，上言進得位，嫌是兼二、三、四等，故特言“剛得中”，以明得位言，言唯是九五也。" }
      - { type: j, text: "止而巽，動不窮也。" }
      - { type: z, text: "正義曰：此就二體廣明漸進之美也。止不為暴，巽能用謙，以斯適進，物無違拒，故能漸而動，進不有困窮也。" }
      - { type: j, text: "《象》曰：山上有木，漸，君子以居賢德善俗。賢德以止巽則居，風俗以止巽乃善。" }
      - { type: z, text: "正義曰：“山上有木，漸”者，木生山上，因山而高，非是從下忽高，故是漸義也。“君子以居賢德善俗”者，夫止而巽者，漸之美也。君子求賢得使居位，化風俗使清善，皆須文德謙下，漸以進之。若以卒暴威刑，物不從矣。" }
      - { type: j, text: "初六：鴻漸於幹，小子厲，有言，無咎。鴻，水鳥也。適進之義，始於下而升者也，故以鴻為喻之。又皆以進而履之為義焉，始進而位乎窮下，又無其應。若履於幹，危不可以安也。始進而未得其位，則困於小子，窮於謗言，故曰“小子厲有言”也。困於小子讒諛之言，未傷君子之義，故曰“無咎”也。" }
      - { type: z, text: "“初六鴻漸”至“無咎”。正義曰：“鴻漸於幹”者，鴻，水鳥也。幹，水涯也。漸進之道，自下升高，故取譬。鴻飛，自下而上也。初之始進，未得祿位，上無應援，體又窮下，若鴻之進於河之幹，不得安寧也，故曰“鴻漸於幹”也。“小子厲有言，無咎”者，始進末得顯位，易致陵辱，則是危於小子，而被毀於謗言，故曰“小子厲有言”。小人之言，“未傷君子之義”，故曰“無咎”也。" }
      - { type: j, text: "《象》曰：“小子”之厲，義無咎也。" }
      - { type: z, text: "正義曰：“義無咎”者，備如《經》釋。" }
      - { type: j, text: "六二：鴻漸於磐，飲食衎衎，吉。磐，山石之安者少。進而得位，居中而應，本無祿養，進而得之，其為歡樂，願莫先焉。" }
      - { type: z, text: "“六二鴻漸”至“衎衎吉”。○正義曰：磐，山石之安者也。衎衎，樂也。六二“進而得位，居中而應”，得河安之地，故曰“鴻漸於磐”。既得可安之地，所以“飲食衎衎”然，樂而獲吉福也，故曰“鴻漸於磐，飲食衎衎吉”也。○注“磐，山石之安者也”。○正義曰：馬季良云：“山中石磐紆，故稱磐也”。鴻是水鳥，非是集於山石陵陸之禽，而爻辭以此言“鴻漸”者，蓋漸之為義，漸漸之於高，故取山石陵陸，以應漸高之義，不復系水鳥也。" }
      - { type: j, text: "《象》曰：“飲食衎衎”，不素飽也。" }
      - { type: z, text: "正義曰：“不素飽”者，素，故也，故無祿養，今日得之，故“願莫先焉”。" }
      - { type: j, text: "九三：鴻漸於陸。夫徵不復，婦孕不育，兇。利御寇。陸，高之頂也。進而之陸，與四相得，不能復反者也。“夫徵不復”，樂於邪配，則婦亦不能執貞矣。非夫而孕故不育也。三本艮體而棄乎？？醜，與四相得遂乃不反至使婦孕不育見利忘義貪進忘舊，兇之道也。異體合好，順而相保，物莫能間，故“利御寇”也。" }
      - { type: z, text: "“九三鴻漸於陸”至“利御寇”。○正義曰：“鴻漸於陸，夫徵不復，婦孕不育，兇”者，陸，高之頂也。九三居下體之上，是進而得高之象，故曰“鴻漸於陸”也。進而之陸，無應於上，與四相比，四亦無應，近而相得。三本是艮體，與初二相同一家，棄其群類，而與四合，好即是夫徵而不反覆也。夫既樂於邪配，妻亦不能保其貞。非夫而孕，故“不育”也。“見利忘義，貪進忘舊，兇之道也”，故曰“夫徵不復，婦孕不育，兇”也。“利御寇”者，異體合好，恐有寇難離間之者，然和比相順，其相保安，物莫能間，故曰“利用御寇”也。○注“陸，高之頂也”。○正義曰：“陸，高之頂也”者，《爾雅》云“高平曰陸”，故曰“高之頂”也。" }
      - { type: j, text: "《象》曰：“夫徵不復”，離群醜也。“婦孕不育”，失其道也。“利用御寇”，順相保也。" }
      - { type: z, text: "正義曰：“離群醜”者，醜，類也。言三與初二，雖有陰陽之殊，同體《艮卦》，故謂之“群醜”也。“失其道也”者，非夫而孕，孕而不育，失道故也。“順相保也”者，謂四以陰乘陽，嫌其非順，然好合相得，和比相安，故曰“順相保也”。" }
      - { type: j, text: "六四：鴻漸於木。或得其桷，無咎。鳥而之木，得其宜也。“或得其桷”，遇安棲也。雖乘於剛，志相得也。" }
      - { type: z, text: "正義曰：“鴻漸於木”者，“鳥而之木，得其宜也”。六四進而得位，故曰“鴻漸於木”也。“或得其桷無咎”者，桷，榱也。之木而遇堪為桷之枝，取其易直可安也。六四與二相得，順而相保，故曰“或得其桷”。既與相得，無乘剛之咎，故曰“無咎”。" }
      - { type: j, text: "《象》曰：“或得其桷”，順以巽也。" }
      - { type: z, text: "正義曰：“順以巽也”者，言四雖乘三體，巽而附下，三雖被乘，上順而相保，所以六四得其安棲，猶“順以巽也”。" }
      - { type: j, text: "九五：鴻漸於陵。婦三歲不孕，終莫之勝，吉。陵，次陸者也。進得中位，而膈乎三四，不得與其應合，故“婦三歲不孕”也。各履正而居中，三四不能久塞其塗者也。不過三歲，必得所願矣。進以正邦，三年有成，成則道濟，故不過三歲也。" }
      - { type: z, text: "“九五鴻漸於陵”至“終莫之勝吉”。○正義曰：“鴻漸於陵”者，陵，次陸者也。九五進於中位，處於尊高，故曰“鴻漸於陵”。“婦三歲不孕”者，有應在二而隔乎三、四，不得與其應合，是二、五情意，徒相感說，而隔礙不交，故曰“婦三歲不孕”也。“終莫之勝，吉”者，然二與五合，各履正而居中，三、四不能久塞其路，終得遂其所懷，故曰“終莫之勝，吉”也。○注“進以正邦”至“不過三歲”。○正義曰：“進以正邦，三年有成”者，九五居尊得位，故曰“進以正邦”也。三年有成，則三、四不敢塞其路，故曰“不過三歲”也。" }
      - { type: j, text: "《象》曰：“終莫之勝，吉”，得所願也。" }
      - { type: z, text: "正義曰：“得所願也”者，所願在於與三合好，既各履中正，無能勝之，故終得其所願也。" }
      - { type: j, text: "上九：鴻漸於陸。其羽可用為儀，吉。進處高絜，不累於位，無物可以屈其心而亂其志。峨峨清遠，儀可貴也，故曰“其羽可用為儀，吉”。" }
      - { type: z, text: "正義曰：“鴻漸於陸”者，上九與三皆處卦上，故並稱“陸”。上九最居上極，是“進處高潔”，故曰“鴻漸於陸”也。“其羽可用為儀，吉”者，然居無位之地，是“不累於位”者也。處高而能不以位自累，則其羽可用為物之儀表，可貴可法也，故曰“其羽可用為儀，吉也”。必言“羽”者，既以鴻明漸，故用羽表儀也。" }
      - { type: j, text: "《象》曰：“其羽可用為儀，吉”，不可亂也。" }
      - { type: z, text: "正義曰：“不可亂也”者，“進處高潔，不累於位”，無物可以亂其志也。" }
      - { type: j, text: "兌下震上。歸妹：徵兇，無攸利。妹者，少女之稱也。兌為少陰，震為長陽，少陰而乘長陽，說以動，嫁妹之象也。" }
      - { type: z, text: "正義曰：歸妹者，卦名也。婦人謂嫁曰歸，“歸妹”猶言嫁妹也。然《易》論歸妹得名不同，《泰卦》六五云：“帝乙歸妹。”彼據兄嫁妹謂之“歸妹”。此卦名歸妹，以妹從娣而嫁，謂之“歸妹”。故初九爻辭云“歸妹以娣是”也。上鹹卦明二少相感，恆卦明二長相承，今此卦以少承長，非是匹敵，明是妹從娣嫁，故謂之歸妹焉。古者諸侯一取九女，嫡夫人及左右媵皆以侄娣從，故以此卦當之矣。不言歸侄者，女娣是兄弟之行，亦舉尊以包之也。“徵兇，無攸利”者，歸妹之戒也。徵謂進有所往也。妹從娣嫁，本非正匹，唯須自守卑退以事元妃。若妾進求寵，則有並後兇咎之敗，故曰“徵兇，無攸利”。" }
      - { type: j, text: "《彖》曰：歸妹，天地之大義也。天地不交，而萬物不興。歸妹，人之終始也。陰陽既合，長少又交，“天地之大義”，人倫之終始。" }
      - { type: z, text: "正義曰：“歸妹，天地之大義也。天地不交，而萬物不興”者，此舉天地交合，然後萬物蕃興，證美歸妹之義。所以未及釋卦名，先引證者，以歸妹之義，非人情所欲，且違於匹對之理。蓋以聖人制禮，令侄娣從其姑娣而充妾媵者，所以廣其繼嗣，以象天地以少陰少陽、長陰長陽之氣共相交接，所以蕃興萬物也。“歸妹，人之終始也”者，上既引天地交合為證，此又舉人事“歸妹”結合其義也。天地以陰陽相合而得生物不已，人倫以長少相交而得繼嗣不絕，歸妹豈非“天地之大義，人倫之終始”也？" }
      - { type: j, text: "說以動，所歸妹也。少女而與長男交，少女所不樂也。而今“說以動”，所歸必妹也。雖與長男交，嫁而系娣，是以“說”也。" }
      - { type: z, text: "正義曰：此就二體釋歸妹之義。少女而與長男交，少女所不樂也。而今“說以動”所歸必妹也，雖與長男交，嫁而系於娣，是以說也。系娣所以說者，既系娣為媵，不得別適，若其不以備數，更有動望之憂，故系娣而行合禮，“說以動”也。" }
      - { type: j, text: "“徵兇”，位不當也。履於，皆不當位，釋“徵兇”之義。位既不當，明非正嫡，因說動而更求進，妖邪之道也，所戒其“徵兇”也。" }
      - { type: j, text: "“無攸利”，柔乘剛也。以徵則有不正之兇，以處則有乘剛之逆。" }
      - { type: z, text: "“無攸利，柔乘剛也”。○正義曰：此因六三、六五乘剛，釋“無攸利”之義。夫陽貴而陰賤，以妾媵之賤，進求殊寵，即是以賤陵貴，故無施而利也。○注“以徵則”至“有乘剛之逆也”。○正義曰：《彖》以失位釋“徵兇”，乘剛釋“無攸利”，而《注》連引言之者，《略例》云：“去初、上而論位分，則三、五各在一卦之上，何得不謂之陽？三、四各在一卦之下，何得不謂之陰？然則二、四陰位也，三、五陽位也。”陽應在上，陰應在下，今二、三、四、五，並皆失位，其勢自然柔皆乘剛，其猶妾媵求寵，其勢自然以賤陵貴，以明柔之乘剛，緣於失正而進也。" }
      - { type: j, text: "《象》曰：澤上有雷，歸妹。君子以求終知敝。歸妹，相終始之道也，故以“永終知敝”。" }
      - { type: z, text: "正義曰：“澤上有雷”，“說以動”也。故曰“歸妹君子以永終知敝”者，“歸妹相終始之道也”，故君子象此以永長其終，知應有不終之敝故也。" }
      - { type: j, text: "初九：歸妹以娣，跛能履，徵吉。少女而與長男為耦，非敵之謂，是娣從之義也。妹，少女之稱也。少女之行，善莫若娣。夫承嗣以君之子，雖幼而不妄行，少女以娣，雖“跛能履”，斯乃恆久之義，吉而相承之道也。以斯而進，吉其宜也。" }
      - { type: z, text: "“初九”至“貞吉”。○正義曰：“歸妹以娣”者，少女謂之妹，從娣而行謂之歸。初九以兌適震，非夫婦匹敵，是從娣之義也，故曰“歸妹以娣”也。“跛能履”者，妹而繼姊為娣，雖非正配，不失常道，譬猶跛人之足然。雖不正，不廢能履，故曰“跛能履”也。“徵吉”者，少長非偶，為妻而行則兇焉，為娣而行則吉，故曰“徵吉”也。○注“夫承嗣以君之子”至“吉其宜也”。○正義曰：“夫承嗣以君之子，雖幼而不妄行”者，此為少女作此例也。言君之子宜為嗣承，以類妃之妹應為娣也。立嗣宜取長，然君之子雖幼而立之，不為妄也。以言行嫁宜匹敵。然妃之妹雖至少，而為娣則可行也。" }
      - { type: j, text: "《象》曰：“歸妹以娣”，以恆也。“跛能履”，吉相承也。" }
      - { type: z, text: "正義曰：“以恆也”者，妹而為娣，恆久之道也。“吉相承也”者，行得其宜，是相承之道也。" }
      - { type: j, text: "九二：眇能視，利幽人之貞。雖失其位，而居內處中，眇猶能視，足以保常也。在內履中，而能守其常，故”利幽人之貞“也。" }
      - { type: z, text: "正義曰：九二不云歸妹者，既在歸妹之卦，歸妹可知，故無不言也。然九二雖失其位，不廢居內處中。以言歸妹，雖非正配，不失交合之道，猶如眇目之人，視雖不正，不廢能視耳，故曰“眇能視”也。“利幽人之貞”者，居內處中，能守其常，施之於人，是處幽而不失其貞正也。故曰“利幽人之貞也”。" }
      - { type: j, text: "《象》曰“利幽人之貞”，未變常也。" }
      - { type: z, text: "正義曰：“未變常也”者，貞正者人之常也，九三失位，嫌其變常不貞也，能以履中不偏，故云“未變常”也。" }
      - { type: j, text: "六三：歸妹以須，反歸以娣。室主猶存，而求進焉。進未值時，故有須也。不可以進，故“反歸”待時，“以娣”乃行也。" }
      - { type: z, text: "正義曰：“歸妹以須”者，六三在“歸妹”之時，處下體之上，有欲求為室主之象，而居不當位，則是室主獨存，室主既存，而欲求進，為末值其時也。未當其時，則宜有待，故曰“歸妹以須也”。“反歸以娣”者，既而有須，不可以進，宜反歸待時，以娣乃行，故曰“反歸以娣”。" }
      - { type: j, text: "《象》曰：“歸妹以須”，未當也。" }
      - { type: z, text: "正義曰：“未當也”者，未當其時，故宜有待也。" }
      - { type: j, text: "九四：歸妹愆期，遲歸有時。夫以不正無應而適人也，必須彼道窮盡，無所與交，然後乃可以往，故“愆期遲歸”，以待時也。" }
      - { type: z, text: "正義曰：九四居下得位，又無其應，以斯適人，“必待彼道窮盡，無所與交，然後乃可以往”，故曰“愆期遲歸有時”也。" }
      - { type: j, text: "《象》曰：“愆期”之志，有待而行也。" }
      - { type: z, text: "正義曰：嫁宜及時。今乃過期而遲歸者，此嫁者之志，正欲有所待而後乃行也。" }
      - { type: j, text: "六五：帝乙歸妹，其君之袂，不如其娣之袂良。月幾望，吉。歸妹之中，獨處貴位，故謂之“帝乙歸妹”也。袂，衣袖，所以為禮容者也。“其君之袂”，為帝乙所寵也，即五也。為帝乙所崇飾，故謂之“其君之袂”也。配在九二，兌少震長，以長從少，不若以少從長之為美也，故曰“不若其娣之袂良”也。位在乎中，以貴而行，極陰之盛，以斯適配，雖不若少，往亦必合，故曰“月幾望，吉”也。" }
      - { type: z, text: "“六五帝乙”至“幾望吉”。○正義曰：“帝乙歸妹”者，六五居歸妹之中，“獨處貴位”，是帝王之所嫁妹也，故曰“帝乙歸妹”。“其君之袂，不如其娣之袂良”者，六五雖處貴位，卦是長陽之卦，若以爻為人，即是婦人之道，故為帝乙之妹。既居長卦，乃是長女之象，其君即五也。袂，衣袖也，所舉斂以為禮容，帝王嫁妹，為之崇飾，故曰“其君之袂”也。“配在九二，兌少震長，以長從少”者，可以從少，雖有其君崇飾之袂，猶不若以少從長之為美，故曰“不如其娣之袂良”也。“月幾望吉”者，陰而貴盛，如月之近望，以斯適配，雖不如以少從長，然以貴而行，往必合志，故得吉也，故曰“月幾望，吉”也。" }
      - { type: j, text: "《象》曰：“帝乙歸妹，不如其娣之袂良”也。其位在中，以貴行也。" }
      - { type: z, text: "“象曰”至“以貴行也”。○正義曰：“帝乙歸妹，不如其娣之袂良”者，釋其六五雖所居貴位，言長不如少也，言不必少女，而從於長男也。“其位在中，以貴行也”者，釋“月幾望，吉”也。既以長適少，非歸妹之美而得吉者，其位在五之中，以貴盛而行，所往必得合，而獲吉也。" }
      - { type: j, text: "上六：女承筐，無實，士刲羊，無血，無攸利。羊謂三也。處卦之窮，仰無所承，下又無應，為女而承命，則筐虛而莫之與。為士而下命，則“刲羊”而“無血”。“刲血”而“無血”，不應所命也。進退莫與，故曰“無攸利”也。" }
      - { type: z, text: "“上六”至“無攸利”。○正義曰：女之為行，以上有承順為美；士之為功，以下有應命為貴，上六處卦之窮，仰則無所承受，故為女承筐，則虛而無實。又下無其應，下命則無應之者，故為“士刲羊”則乾而“無和”，故曰“女承筐，無實，士刲羊無血。”則進退莫與，故無所利。" }
      - { type: j, text: "《象》曰：上六“無實”，承虛筐也。" }
      - { type: z, text: "正義曰：“承虛筐”者，筐本盛幣，以幣為實。今之“無實”，正是承捧虛筐，空無所有也。" }
      - { type: j, text: "上一頁 目錄頁 下一頁" }
