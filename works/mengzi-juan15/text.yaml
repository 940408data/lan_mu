# 孟子注疏卷15（孫奭疏）：j 為經文，漢趙岐注為注，z 為疏文。
sections:
  - id: juan15
    name: 正文
    blocks:
      - { type: z, text: "正义曰：此卷即赵注分上卷为之者也，此卷凡三十八章。一章言发政施仁，一国被恩，好战轻民，灾及所亲。二章言《春秋》拨乱，时多战争。三章言文之过实，圣人不改，录其意也。四章言民思明君，若旱望雨，以仁伐暴，谁不欣喜。五章言规矩之法，喻若典礼。六章言厄穷不悯，贵而思降。七章言恕以行仁，远祸之端，暴以残民，招咎之患。八章言修理关梁，讥而不征。九章言率人之道，躬行为首。十章言务利蹈奸，务德蹈仁。十一章言廉贪相殊，名亦卓异。十二章言亲贤正礼，明其五教。十三章言王者当天，然後处之。十四章言得民为君，得君为臣，重民敬祀，治之所先。十五章言伯夷、柳下惠变贪厉薄。十六章言仁恩及人，人能弘道。十七章言孔子周流，不遇则去。十八章言君子固穷，穷不变道。上下无交，无贤援也。十九章言正己信心，不患众口。二十章言以明照暗，暗者以开，以暗责明，暗者愈迷。二十一章言圣人之道，学而时习，仁义在身，当常被服，舍而不修，犹茅是塞。二十二章言前圣後圣，所向者同，三王一体，何得相逾。二十三章言可为则从，不可则止，非时逆指，犹若冯妇暴虎，无己必有害也。二十四章言尊德乐道，治性勤礼。二十五章言神圣以下，优劣异羞，乐正好善，犹下二科。二十六章言驱邪反正，正斯可矣；来者不追，追其前罪，君子甚之，以为过。二十七章言养民轻敛，君子道也。二十八章言宝此三者，以为国珍。二十九章言小知自私，藏怨之府，《大雅》先人，福之所聚。三十章言教诲之道，受之如海，百川移流，不得有拒。三十一章言善恕仁义，充其大美，无受尔汝，何施不可。三十二章言道之善以心为原。三十三章言君子之行，动合中礼，汤武之隆，不是过。三十四章言富贵而骄，自遗咎也；茅茨采椽，圣尧表也；以贱说贵，惧有荡心。三十五章言清净寡欲，行之高者；畜聚积实，秽行之下；廉者招福，浊者速祸。三十六章言曾参至孝，思亲异心，羊枣之感，终身不尝。三十七章言士行有科，人有等级，中道为上，狂狷不合，似是而非，色厉而内荏，乡愿之恶，圣人所甚戒。三十八章言三皇已来，人伦攸叙，圣人不出，名世承间，虽有斯限，盖有遇不遇焉。是以仲尼止於获麟，孟子终於无有乎尔。凡此三十八章，合前四十五章，是尽心篇有八十三章矣。" }
      - { type: j, text: "孟子曰：“不仁哉！梁惠王也。仁者以其所爱，及其所不爱。不仁者以其所不爱，及其所爱。”" }
      - { type: z, text: "梁，魏都也。以，用也。仁者用恩於所爱之臣民，王政不偏普施德教，所不亲爱者并蒙其恩泽也。用不仁之政加於所不亲爱，则有灾伤，所亲爱之臣民亦并被其害。惠王好战杀人，故孟子曰不仁哉。" }
      - { type: j, text: "公孙丑问曰：“何谓也？”" }
      - { type: z, text: "丑问及所爱之状何谓也。" }
      - { type: j, text: "“梁惠王以土地之故，糜烂其民而战之，大败。将复之，恐不能胜，故驱其所爱子弟以殉之，是之谓以其所不爱及其所爱也。”" }
      - { type: z, text: "孟子言惠王贪利邻国之土地而战，其民死亡於野，骨肉糜烂而不收兵，大败而欲复战，恐士卒少不能用胜，故复驱其所爱近臣及子弟而以殉之。殉，从也。所爱从其所不爱而往趋死亡，故曰及其所爱也。东败於齐，长子死焉。“孟子曰”至“爱也”。○正义曰：此章指言发政施仁，一国被恩；好战轻民，灾及所亲。著此魏王，以戒人君者也。“孟子曰：不仁哉梁惠王也”至“及其所爱也”，孟子言世称不仁之人是梁惠王也，仁者之君以其用恩於所爱亲幸者，以加及於所不亲幸者，是自近及远之谓也。不仁之君以其用不仁之政加於所不亲爱幸者，则有灾伤及其所亲爱幸者也。公孙丑问曰：“何谓也”，公孙丑未晓其旨，乃问孟子曰：“及所爱之状，是何所谓也？”“梁惠王以土地之故”至“及其所爱也”，孟子解其旨，以晓公孙丑之问也。言梁惠王贪利邻国之土地而战斗，其民战死於野，糜烂其骨肉，及兵大败，将欲复战之，恐惧其不能战胜，以其士卒之少，故驱率其所爱幸之亲臣及亲爱之子弟以从之，而往趋於战死，是谓以其所不爱及其所爱者也。此所以见梁惠王不仁之甚也。《左传》云：“未阵而薄之曰败某师，大崩曰败绩。”今梁王之败，独谓之大败者，以其败某师与败绩不足言，故称为大败。抑又言梁王不以义战，以见梁王不仁之甚也。○注“梁，魏都”至“东败於齐，长子死焉”。正义曰：此盖首篇说矣。" }
      - { type: j, text: "孟子曰：“《春秋》无义战，彼善於此，则有之矣。征者，上伐下也，敌国不相征也。”" }
      - { type: z, text: "《春秋》所载战伐之事，无应王义者也。彼此相觉有善恶耳，孔子举毫毛之善，贬纤芥之恶，故皆录之於《春秋》也。上伐下谓之征，诸侯敌国不相征。五霸之世，诸侯相征，於三王之法，皆不得其正者也。正义曰：此章指言春秋拨乱，时多争战，事实违礼，以文反正。诛讨征伐，不自王命，故曰无义战者也。“孟子曰”至“敌国不相征也”，孟子言春秋之世，凡兵之所起，皆小役大，弱役强。或因怒兴师，或弃礼贪利，未尝有禁暴救乱之义也，是以春秋无义战。然而春秋虽谓无义战，其彼国之战有善於此国，未尝无也。是以彼善於此，则有之矣。夫征者以上伐下，无有敌於我师，所以正彼之罪也。如抗敌之国，则相为强弱以结祸乱，非上之所以伐下、罔有敌于我师者也，其势皆足以相抗，皆出於交恶者也，故曰敌国不相征也。○注“孔子举毫毛”至“春秋也”。○正义曰：此盖言春秋无义战之谓也，如有之，则孔子必书，故有是之言也。" }
      - { type: j, text: "孟子曰：“尽信《书》，则不如无《书》。吾於《武成》，取二三策而已矣。仁人无敌於天下，以至仁伐至不仁，而何其血之流杵也？”" }
      - { type: z, text: "《书》，《尚书》。经有所美，言争或过，若《康诰》曰“冒闻于上帝”，《甫刑》曰“帝清问下民”，《梓材》曰“欲至于万年”，又曰“子子孙孙，永保民”。人不能闻天，天不能问於民，万年永保，皆不可得为书，岂可案文而皆信之哉。《武成》，逸《书》之篇名，言武王诛纣，战斗杀人，血流舂杵。孟子言武王以至仁伐至不仁，殷人箪食壶浆而迎其师，何乃至於血流漂杵乎？故吾取《武成》两三简策可用者耳，其过辞则不取之也。正义曰：此章指言文之有美过实，圣人不改，录其意也，非独《书》云，《诗》亦有言“崧高极天，则百斯男”，是故取於《武成》二三策而已。孟子言《尚书》之文不可尽信之也，如尽信其书之文，则不若无《书》而已。以其辞之有过，所以疑惑於人也。故孟子言我於《书》之《武成》篇特取二三策而为不尽信之而已，盖《尚书》之过辞多矣，所以不暇具言之，故於《武成》但取二三策而言耳。曰：仁人用兵，故前徒倒戈，无有敌於我师也，是以至仁之人而诛伐其至不仁之人，而何其武王诛纣，战斗杀人乃至於血流舂杵也？此孟子於《武成》，所以执此而言《书》之不可尽信矣。○注“《书》，《尚书》”至“不取也”。○正义曰：《康诰》曰“冒闻于上帝”者，盖成王伐管叔、蔡叔，以殷馀民封康叔，作此《康诰》也，云“我西土，惟时怙冒闻于上帝，帝休”，孔安国云：“我西土岐周，惟是怙恃文王之道，故其政教冒被四表，上闻于天也。”云“《甫刑》曰：皇帝清问於下民”者，盖吕侯见命为天子司寇，後为甫侯，故或称《甫刑》，此篇盖以穆王命作夏禹赎刑之法，以布告天下也。“皇帝清问下民”者，孔安国云：“尧帝详问民患也。”云“《梓材》曰欲至于万年”，又曰“子子孙孙，永保民“者，盖康叔为政之道，亦如梓人治材，故曰《梓材》。言欲至于万年，惟王子子孙孙永保民。孔注云：“我周家惟欲使至於万年，承奉王室，又欲令子孙累世长居国以安民也。”馀已前说。" }
      - { type: j, text: "孟子曰：“有人曰：‘我善为陈，我善为战。’大罪也。国君好仁，天下无敌焉。南面而征，北夷怨；东面而征，西夷怨。曰：‘奚为後我？’" }
      - { type: z, text: "此人欲劝诸侯以攻战也，故谓之有罪。好仁无敌，四夷怨望迟，愿见征，何为後我。已说於上篇矣。" }
      - { type: j, text: "武王之伐殷也，革车三百两，虎贲三千人。王曰：‘无畏，宁尔也，非敌百姓也。’若崩厥角，稽首。征之为言正也，各欲正己也，焉用战？”" }
      - { type: z, text: "革车，兵车也。虎贲，武士为小臣者也。《书》云：“虎贲赘衣，趣马小尹。”三百两，三百乘也。武王令殷人曰：无惊畏，我来安止尔也。百姓归周，若崩厥角，额角犀厥地。稽首拜命，亦以首至地也。欲令武王来征己之国，安用善战陈者！“孟子曰”至“焉用战”。○正义曰：此章指言民思明君，若旱望雨，以仁伐暴，谁不欣喜。是以殷民厥角，周师歌舞，焉用善战，故云罪也。“孟子曰：有人曰我善为陈，我善为战”至“焉用战”者，孟子言有人谓我善为行陈，我善为战斗，以其是欲劝诸侯以攻战者也，是为大罪之人也。且国君好行仁政以及民人，凡有所征，天下无敢有敌者也，故南面而征则北夷怨，东面而征则西夷怨，曰“奚为後我”。说已在上篇矣。武王之诛伐商纣，有兵车三百乘，虎贲之勇士有三千人。武王令告於商之人，曰：无惊畏，我来安止尔也。故不敢抗敌之，百姓皆崩摧其角，若无所容头，乃稽首拜命。故征之所以言正彼之罪也。百姓各欲武王来征己之国焉，用为善战者乎？此孟子所以有是而戒时君好仁以为无敌之道而已，是又戒时之臣无以战事言於时君耳。○注“革车”至“战陈者”。○正义曰：革车者，以皮为饰者也。《牧誓》言武王戎车三百两，虎贲三千人。孔安国云：“兵车，百夫长所载车，称两，一车步卒七十二人，凡二万一千人，举全数。虎贲，勇士称也，若虎贲兽，言其猛也，皆百夫长也。”又案《太誓》篇云：“百姓懔懔，若崩厥角。”孔安国言民畏纣之虐，危惧不啻；若崩厥角，角无所容头者也。" }
      - { type: j, text: "孟子曰：“梓匠轮舆，能与人规矩，不能使人巧。”" }
      - { type: z, text: "梓匠轮舆之功，能以规矩与人。人之巧在心，拙者虽得规矩，亦不能成器也。盖喻人不志仁，虽诵典宪，不能以善。正义曰：此章指言规矩之法，喻若典礼，人不志仁，虽诵典宪，不能以善。善人修道，公输守绳，政成器美，惟度是应，得其理也。孟子言梓匠轮舆之工，能与人规矩法度，而不能使人之巧。以其人之巧在心，如心拙，虽得规矩法度，亦不能成美器也。喻当时之君，如心不在仁，虽诵宪籍，亦不能成美政也。“梓匠轮舆”，已说於上篇矣。" }
      - { type: j, text: "孟子曰：“舜之饭糗茹草也，若将终身焉。及其为天子也，被衤衣，鼓琴，二女果，若固有之。" }
      - { type: z, text: "糗，饭乾Я也。衤，画也。果，侍也。舜耕、陶之时，饭糗茹草，若将终身如是。及为天子，被画衣黼黻绣也；鼓琴以协音律也；以尧二女自侍，亦不佚豫，如固自当有之也。正义曰：此章指言厄穷不悯，贵而思降，凡人所难，虞舜独降圣德，所以殊者也。孟言舜初於耕历山、陶河滨之时，以糗而饭，以草而茹，若终身如是焉。及尧禅位，为之天子，所被以画衣黼黻绣，鼓五弦之琴，以尧帝二女事之实，若固自当有之也。○注“糗，乾Я也”至“黼黻绣也”。○正义曰：云糗，Я也，按《释名》云：“糗，乾饭屑也。”云“衤，画也”，《说文》云“衤，玄衣也”，《孔传》云：“黼若斧形。黼为两已相背。葛之精曰，五色备曰绣。”云“果，侍也”，按许慎谓女侍曰倮，今释果为侍，谓二女之侍舜，是以有惑於许慎之说而遂误欤。盖木实曰果，云果者，取其实而言也。" }
      - { type: j, text: "孟子曰：“吾今而後知杀人亲之重也。杀人之父，人亦杀其父。杀人之兄，人亦杀其兄。然则非自杀之也，一间耳。”" }
      - { type: z, text: "父仇不同天，兄仇不同国，以恶加人，人必加之，知其重也。一间者，我往彼来间一人耳，与自杀其亲何异哉！正义曰：此章指言恕以行仁，远祸之端，暴以残民，招咎之患。是以君子好生恶杀，反诸身也。孟子言我於今然後知杀人之亲之为最重者也，杀彼人之父，彼人亦杀己父而报之；杀彼人之兄，彼人亦杀己兄而报之：如是，则非己之杀，但一间耳，以其与自杀之无异也。○注“父仇不同天，兄仇不同国”。○正义曰：案《礼》云：父之雠弗与共戴天，交游之雠不同国，兄弟之雠不反兵。盖所以避之也。《周官》云：“父之雠，避诸四海之外。”所谓不与共其国，盖非《周礼》欤。又《周官》谓人凡杀人而义者勿令勿雠，则杀之而不义。在邦法不可杀者，必避之而已。" }
      - { type: j, text: "孟子曰：“古之为关也，将以御暴。今之为关也，将以为暴。" }
      - { type: z, text: "古之为关，将以御暴乱，讥闭非常也。今之为关，反以征税出入之人，将以为暴虐之道也。正义曰：此章指言修理关梁，讥而不征，如以税敛，非其程式，惧将为暴，故讥之也。孟子言古之为关，讥而不税，将以御暴乱、非常之人而已。今之为关，乃征税而不讥，将以为暴乱之道也。按《周礼·司关》云：“凡四方之宾客叩关，则为之告，有内外之送，则以节传出纳之。”是以为关将以御暴也。孟子之时，司关征取其税，所以为暴。此孟子所以有是言欤。" }
      - { type: j, text: "孟子曰：“身不行道，不行於妻子；使人不以道，不能行於妻子。”" }
      - { type: z, text: "身不自履行道德，而欲使人行道德，虽妻子不肯行之，言无所则效。使人不顺其道理，不能使妻子顺之，而况他人乎？正义曰：此章指言率人之道，躬行为首。《论语》曰：“其身不正，虽令不从。”孟子言人身自不履行其道德，虽妻子之间且有所不行，以其无所效法者也。使人如不以道理，虽妻子且有不顺，况能行於民乎？荀况云：“有分义，则合天下而治，无分义，则一妻一妾而乱。”亦与同意。《论语》曰：“其身正，不令而行。其身不正，虽令不从。”亦其意也。" }
      - { type: j, text: "孟子曰：“周于利者，凶年不能杀。周于德者，邪世不能乱。”" }
      - { type: z, text: "周达於利，营苟得之利而趋生，虽凶年不能杀之。周达於德，身欲行之，虽遭邪世，不能乱其志也。正义曰：此章指言务利蹈奸，务德蹈仁，舍生取义，其道不均者也。孟子言人积备其利物，以为周于利者，则所养常厚，故凶荒之年且不能杀死。喻人之能尽其性，以为周于德者，则所守弥笃，故奸邪之世不能乱其志。盖以战国之时，无富而教之之术，此孟子所以救之以此。" }
      - { type: j, text: "孟子曰：“好名之人能让千乘之国。苟非其人，箪食豆羹见於色。”" }
      - { type: z, text: "好不朽之名者，轻让千乘，伯夷、季札之类是也。诚非好名者，争箪食豆羹变色，讼之致祸，郑公子染指元羹之类是也。正义曰：此章指言廉贪相殊，名亦卓异，故闻伯夷之风，懦夫有立志也。孟子言好不朽之名者，则重名轻利，故云能让千乘之国而且不受。苟非好名之人，则重利而轻名，而箪食豆羹之小节，且见争夺而变见於颜色。○注“伯夷季札与郑公子之类”。○正义曰：案《史记·列传》云：伯夷、叔齐，孤竹君之二子，父欲立叔齐。及父卒，叔齐让伯夷，伯夷曰：“父命也。”遂逃去。叔齐亦不肯立，而逃之。案《春秋·少阳篇》：“伯夷姓墨名允，字公信。伯，长也。夷，谥也。叔齐名智，字公达，伯夷之弟，齐亦谥也。”《世家》云：王馀昧，卒欲授弟季札，季札让逃去，於是吴人曰：先王有命，兄卒弟代立，必致季子。今逃位，则王馀昧後立，今卒，其子当代。乃立王馀昧之子僚为王。凡此是伯夷、季札之让千乘之国也。云“郑公子染指元羹”者，案鲁宣公四年《左传》云：“楚人献鼋於郑灵公。公子宋与子家将见，子公之食指动，以示子家曰：’他日我如此，必尝异味。’及入，宰夫将解鼋，相视而笑。公问之，子家以告。及食大夫鼋，召子公而弗与。子公怒，染指於鼎，尝之而出。公怒，欲杀子公。子公与子家谋先，子家曰：‘畜老犹惮杀之，而况君乎？’反谮子家，子家惧而从之。夏，弑灵公。故经书曰：‘郑子公嘉弑其君夷。’”是也。" }
      - { type: j, text: "孟子曰：“不信仁贤，则国空虚。无礼义，则上下乱。无政事，则财用不足。”" }
      - { type: z, text: "不亲信仁贤，仁贤去之，国无贤人，则曰空虚也。无礼义以正尊卑，则上下之叙泯乱。无善政以教人农时，贡赋则不入，故财用有所不足故也。正义曰：此章指言亲贤正礼，明其五教，为政之源，圣人以三者为急也。孟子言人君不亲信仁贤，则仁贤去之，仁贤去则国无贤人，是为空虚之国也。无礼义以正尊卑，则上下之序泯乱。无政事以理财，则财用乏而不足。盖礼义由贤者出，政事由贤者出，不信仁贤则礼义不兴，礼义不兴则政事不行，而国之财用於是乎不足。此孟子言之，亦其叙之然。" }
      - { type: j, text: "孟子曰：“不仁而得国者有之矣。不仁而得天下者，未之有也。”" }
      - { type: z, text: "不仁得国者，谓象封於有庳，叔鲜、叔度封於管、蔡，以亲亲之恩而得国也。虽有诛亡，其世有土。丹朱、商均，天下元子，以其不仁，天下不与，故不得有天下焉。正义曰：此章指言王者当天，然後处之。桀、纣、幽、厉，虽得犹失，不以善终，不能世祀，为得也。孟子曰不仁而得国有之矣，不仁而得天下未之有也者。孟子言世有不仁之人，而得其国而为臣者有之矣。不仁之人而得天下而为王者，故未之有也。是以桀、纣、幽、厉，虽得而终亦失之，亦且不为者也。○注“象封有庳，叔鲜、叔度封於管、蔡”与“丹朱商均”者。○正义曰：云象封有庳，孟子於《万章篇》言之详矣。云“叔鲜、叔度”者，案《世家史记》云：管叔鲜、蔡叔度，周文王子而武王之弟也。武王克殷纣，平天下，封功臣、昆弟，於是封鲜叔於管，封叔度於蔡。”杜预云：管在荥阳京县东北。《世本》曰居上蔡。丹朱、商均者，丹朱，尧之子也；商均，舜之子也。又言於上篇已详矣。" }
      - { type: j, text: "孟子曰：“民为贵，社稷次之，君为轻。是故得乎丘民而为天子。" }
      - { type: z, text: "君轻於社稷，社稷轻於民。丘，十六井也。天下丘民皆乐其政，则为天子，殷汤、周文是也。" }
      - { type: j, text: "得乎天子为诸侯。" }
      - { type: z, text: "得天子之心，封以为诸侯。" }
      - { type: j, text: "得乎诸侯为大夫。" }
      - { type: z, text: "得诸侯之心，诸侯能以为大夫。" }
      - { type: j, text: "诸侯危社稷，则变置，（诸侯为危社稷之行，则变更立贤诸侯也。）牺牲既成，粢盛既，祭祀以时，然而旱乾水溢，则变置社稷。”" }
      - { type: z, text: "牺牲已成肥盾，粱稻巳成精，祭祀社稷常以春秋之时，然而其国有旱乾水溢之灾，则得毁社稷而更置之。“孟子”至“社稷”。○正义曰：此章指言得民为君，得君为臣，民为贵也。行黜诸侯，后毁社稷，君为轻也。重民敬祀，治之所先，故列次而言之。“孟子曰”至“则变置社稷”者，孟子言民之为贵，不可贱之者也，社稷次之於民，而君比於民，犹以为轻者。如此者也，如此故得乎四邑之民以乐其政，则为天子，以有天下；得乎天子之心，则为诸侯，以有其国；得乎诸侯之心，以为大夫，有其家。如诸侯不能保安其社稷而以危之，则变更立置其贤君，是社稷有重於君也；牺牲既成以肥盾，粢盛既成以精，祭祀又及春秋祈报之时，然而其国尚有旱乾水溢之灾，则社稷无功以及民，亦在所更立有功於民者为之也，是民又有贵於社稷也。此孟子所以自解民为贵，社稷次之，君为轻之叙也。云社稷者，盖先王立五土之神，祀以为社；立五之神，祀以为稷。以古推之，自颛帝以来，用句龙为社，柱为稷。及汤之旱，以弃易其柱。是亦知社稷之变置，又有见於汤之时然也。○注“君轻於社稷”至“於殷汤、周文也”。○正义曰：此云“丘，十六井也”者，案《司马法》云：“六尺为步，步百为亩，亩百为夫，夫三为屋，屋三为井，井十为通，通十为成。”是一丘为十六井，而一井为九夫之地也。今云十六井，盖有一万四千四百亩，为一百四十四夫所受者也。云“殷汤、周文”者，盖引此二王皆自百里而起为天下王，是得乎民心者也。" }
      - { type: j, text: "孟子曰：“圣人，百世之师也，伯夷、柳下惠是也。" }
      - { type: z, text: "伯夷之清，柳下惠之和，圣人之一概也。" }
      - { type: j, text: "故闻伯夷之风者，顽夫廉，懦夫有立志。闻柳下惠之风者，薄夫敦，鄙夫宽。奋乎百世之上，百世之下闻者莫不兴起也。非圣人而能若是乎？而况於亲炙之者乎？”" }
      - { type: z, text: "顽，贪。懦，弱。鄙，狭也。百世，言其远也。兴起，志意兴起也。非圣人之行，何能感人若是！喻闻尚然，况於亲见而薰炙之者乎？“孟子”至“者乎”。○正义曰：此章指言伯夷、柳下惠，变贪厉薄，千载闻之，犹有感激，谓之圣人，美其德也。“孟子曰”至“而况於亲炙之者乎”者，此言伯夷、下惠之为圣人也。言圣人之道无穷，为百世之师法者也，伯夷、柳下惠二人是也，故千载之下，闻伯夷之清风者，顽贪之夫化而为廉俭，懦弱之夫化而有立毅之志。闻下惠之和风者，鄙薄之夫化而为敦厚宽大。是则二人清和之风，奋发乎百世之上，而使百世之下，闻其风者，无有不感激，而志意兴起而化之也。然而非圣人，其能若是，使百世之下，莫不兴起者也。闻而化者尚如此，况当时有亲见薰炙之者乎！○注“顽贪”至“美其德”，此盖於上篇言之详矣。" }
      - { type: j, text: "孟子曰：“仁也者，人也。合而言之道也。”" }
      - { type: z, text: "能行仁恩者，人也。人与仁合而言之，可以谓之有道也。正义曰：此章指言仁恩须人，人能弘道也。孟子言为仁者，所以尽人道也，此仁者所以为人也。盖人非仁不立，仁非人不行。合仁与人而言之，则人道尽矣。《杨子》云：“仁以人同。”" }
      - { type: j, text: "孟子曰：“孔子之去鲁，曰‘迟迟吾行也’，去父母国之道也。去齐，接淅而行，去他国之道也。”" }
      - { type: z, text: "迟迟，接淅，说已见上篇言矣，此不复说焉。“此章盖言孔子周流不遇，则之他国远逝。惟鲁斯恋，笃于父母之国也。" }
      - { type: j, text: "孟子曰：“君子之厄於陈、蔡之间，无上下之交也。”" }
      - { type: z, text: "君子，孔子也。《论语》曰：“君子之道三，我无能焉。”孔子乃尚谦，不敢当君子之道，故可谓孔子为君子也。孔子所以厄於陈、蔡之间者，其国君臣皆恶，上下无所交接，故厄也。正义曰：此章指言君子固穷，穷不变道。上下无交，无贤援也。“孟子言孔子见厄於陈、蔡二国之间，几不免死，以无上下之交而已，以其上无所事，虽死不为谄，下无所可与，虽死不为渎。是为无交接也。《论语·卫灵公》之篇云：“孔子在陈，绝粮，从者病，莫能兴。子路愠见曰：‘君子亦有穷乎。’子曰：‘君子固穷，小人穷斯滥矣。’”岂非穷不变道者能如是乎！○注“君子道者三，我无能焉”，所谓乎仁者不忧，智者不惑，勇者不惧，是三者也。" }
      - { type: j, text: "貉稽曰：“稽大不理於口。”" }
      - { type: z, text: "貉，姓；稽，名。仕者也。为众口所讪。理，赖也。谓孟子曰：稽大不赖人之口，如之何也。" }
      - { type: j, text: "孟子曰：“无伤也，士憎兹多口。" }
      - { type: z, text: "审己之德，口无伤也。离於凡人而仕者，亦益多口。" }
      - { type: j, text: "《诗》云：‘忧心悄悄，愠于群小。’孔子也。‘肆不殄厥愠，亦不殒厥问。’文王也。”" }
      - { type: z, text: "《诗·邶风·柏舟》之篇，曰“忧心悄悄”，忧在心也，“愠于群小”，怨小人聚而非议贤者也。孔子论此诗，孔子亦有武叔之口，故曰孔子之所苦也。《大雅·绵》之篇曰“肆不殄厥愠”，殄，绝；愠，怒也。“亦不殒厥问”，殒，失也。言文王不殒绝畎夷之愠怒，亦不能殒失文王之善声问也。“貉稽”至“文王也”。○正义曰：此章指言正己信心，不患众口。众口喧哗，大圣所有，况於凡品之所能御？故答貉稽曰无伤也。“貉稽曰：稽大不理於口”，貉，姓；稽，名，亦当世之士也。貉稽自称名，问於孟子曰：稽大不能治人之口，使不讪其己者，如之何？“孟子曰无伤也”至“文王也”者，孟子答之，以为审己之德已修，虽人之口讪，亦不能伤害其己之德也。以其为士者益此多口，不能免人之讪也。故《邶风·柏舟》之诗有云“忧心悄悄，愠于群小”，言忧悄悄常在心，见怒于群小众小人也。以其孔子删此诗，亦不能免武叔之毁，故曰孔子尚如是憎多口也。《大雅·绵》之诗有云“肆不殄厥愠，亦不殒厥问”，言不能殄绝畎夷之愠怒，然亦不能殒失文王之善声，故曰文王尚如此，亦憎多口也。此所以答貉稽大不理於口，以为无伤也。○注“《邶风·柏舟》之篇”至“声闻也”。○正义曰：此篇盖言仁人不遇也。注云：“愠，怒也。悄悄，忧貌。”《论语》云：“叔孙、武叔毁仲尼。子贡曰：‘仲尼不可毁也。仲尼，日月也。人虽欲自绝，其何伤於日月乎？’”多见其不知量也。云“《大雅·绵》之篇”者，盖此篇言文王之兴，本由大王也。注：肆，故今也。愠，恚。殒，坠也。畎夷，狄国也。" }
      - { type: j, text: "孟子曰：“贤者以其昭昭，使人昭昭。今以其昏昏，使人昭昭。”" }
      - { type: z, text: "贤者治国，法度昭明。明於道德，是躬行之道可也。今之治国，法度昏昏，乱溃之政也，身不能治，而欲使人昭明，不可得也。正义曰：此章指言以明昭暗，暗者以开，以暗责明，暗者愈迷，贤者可遵，讥今之非也。“孟子曰”至“昭昭”者，孟子言有诸己然後求诸人之道也。贤者之君治国，以其昭昭，明己之道德，然後使人昭昭。今之治国者，乃以昏昏，不能自明己之道德，而欲使他人昭明，微不可得也。是亦所谓曲其表而求影之正，浊其源而求流之请，同其旨。" }
      - { type: j, text: "孟子谓高子曰：“山径之蹊间介然用之而成路，为间不用，则茅塞之矣。今茅塞子之心矣。”" }
      - { type: z, text: "高子，齐人也，尝学于孟子，乡道而未明，则学于他术。孟子谓之曰：山径，山之岭有微蹊介然，人遂用之不止，则蹊成为路；为间，有间也，谓废而不用，则茅草生而塞之，不复为路。以喻高子学于仁义之道，当遂行之而反中止，正若山路。故曰：“茅塞子之心也。”正义曰：此章指言圣人之道，学而时习，仁义在身常本常被服，舍而弗修，犹茅是塞，明为善之不可倦也。孟子谓于高子曰：山岭有微蹊，其间之微小介然而已，如用而行之，则蹊成大路。不用而行之，茅草生塞之，不能成其路也。喻高子之为善，止于中道，而其心为利欲之所充塞，亦若茅塞其路矣。故曰今茅塞子之心矣。盖高子尝于为诗，而不通乎意，是塞其心之一端也。" }
      - { type: j, text: "高子曰：“禹之声尚文王之声。”孟子曰：“何以言之？”" }
      - { type: z, text: "高子以为禹之尚声乐过于文王。孟子难之，曰何以言之。" }
      - { type: j, text: "曰：“以追蠡。”" }
      - { type: z, text: "高子曰：禹时钟在者，追蠡也。追，钟钮也，钮磨处深矣。蠡，欲绝之貌也。文王之钟不然。以禹为尚乐也。" }
      - { type: j, text: "曰：“是奚足哉？城门之轨，两马之力与？”" }
      - { type: z, text: "孟子曰：是何足以为禹尚乐乎？先代之乐器，後王皆用之，禹在文王之前千有馀岁，用钟日久，故追欲绝耳。譬若城门之轨啮，其限切深者，用之多耳，岂两马之力使之然乎？两马者，《春秋外传》曰：“国马足以行关，公马足以称赋。”是两马也。“高子”至“力与”。○正义曰：此章指言前圣後圣，所尚者同，三王一体，何得相逾。欲以追蠡，未达一隅。孟子言之，将以启其蒙。“高子曰：禹之声尚文王之声”者，高子言於孟子，曰禹王之尚声乐过於文王之声乐也。“孟子曰何以言之”者，孟子见高子蔽惑，故难之曰：何以言禹之声尚文王之声也？“曰以追蠡”，高子曰：以其追蠡钟钮之锐欲绝，故云然也。“孟子曰：是奚足哉，城门之轨，两马之力与”，孟子又以此解高子之蔽也，言此追蠡何足为禹之声尚乐过於文王乎？且譬之城门之轨啮，其限之深处，岂以两马之力能使之然。亦以积渐之久故使然也，非特两马之力即如是之深也。言禹王至文王，其钟用之亦以日久，故能磨锐至於欲绝也。此又见高子之蔽不独於诗也。所谓太山之溜，久而穿石；单极之绠，久而断：其来非一日也。两马即如注所谓《春秋外传》云“国马、公马”是也。" }
      - { type: j, text: "齐饥。陈臻曰：“国人皆以夫子将复为发棠，殆不可复。”" }
      - { type: z, text: "棠，齐邑也。孟子尝劝齐王发棠邑之仓，以振贫穷，时人赖之。今齐人复饥，陈臻言一国之人皆以为夫子将复若发棠时劝王也，殆不可复言之也。" }
      - { type: j, text: "孟子曰：“是为冯妇也。晋人有冯妇者，善搏虎，卒为善士。则之野，有众逐虎，虎负，莫之敢撄。望见冯妇，趋而迎之。冯妇攘臂下车，众皆悦之。其为士者笑之。”" }
      - { type: z, text: "冯，姓；妇，名也。勇而有力，能搏虎。卒，後也。善士者，以善搏虎有勇名也，故进以为士。之於野外，复见逐虎者，撄，迫也。虎依陬而怒，无敢迫近者也。冯妇耻不如前，见虎走而迎之，攘臂下车，欲复搏之，众人悦其勇猛。其士之党笑其不知止也。故孟子谓陈臻今欲复使我如发棠时言之於君，是则我为冯妇也，必为知者所笑也。“齐饥”至“笑之”。○正义曰：此章指言可为则从，不可则凶，言善见用，得其时也。非时逆指，犹若冯妇，搏虎无已，必有害也。“齐饥，陈臻曰”至“殆不可复”者，盖齐国之人时皆被饥，孟子尝劝齐王发粟以赈之，今者复饥，而孟子不复发棠邑之粟以赈。陈臻为孟子之弟子，乃问孟子，言齐国之人皆以为夫子将复发棠邑之粟以赈救之，今夫子不复发棠，殆为齐王不可复劝，是如之何？故以此问孟子。“孟子曰”至“其为士者皆笑之”者，孟子乃以此冯妇之喻而比言於陈臻也。言如将复发棠，是为冯妇者也。冯妇能暴虎也，言晋国有冯妇之人，善能搏虎，後为之善士，则之於野外，见有众人逐其虎，虎倚山而怒，众人皆莫敢撄而搏之者。望见冯妇来，乃皆趋进而迎之，冯妇乃下车，攘臂欲复搏之。众人皆悦其勇猛，其为士之党者，知道则笑其不知止也。言今齐王恃威虐以敛民，亦若虎之负，以难合之说，述於暴人之前，又若迎而搏虎也。是以孟子将复为发棠，非不足以悦众，自君子观之，亦若为士者之笑冯妇也，以其不知止矣。○注“棠，齐邑也”。○正义曰：案《齐世家》，《史记》云：“棠公娄好。”裴る云：“贾逵曰：棠公，齐邑大夫也。”是棠之为齐邑明矣。" }
      - { type: j, text: "孟子曰：“口之於味也，目之於色也，耳之於声也，鼻之於臭也，四肢之於安佚也，性也。有命焉，君子不谓性也。”" }
      - { type: z, text: "口之甘美味，目之好美色，耳之乐五音，鼻之喜芬香。臭，香也，《易》曰：“其臭如兰。”四体谓之四肢，四肢懈倦，则思安佚不劳苦。此皆人性之所欲也，得居此乐者，有命禄，人不能皆如其愿也。凡人则有情从欲而求可身，君子之道，则以仁义为先，礼节为制，不以性欲而苟求之也，故君子不谓之性也。" }
      - { type: j, text: "仁之於父子也，义之於君臣也，礼之於宾主也，知之於贤者也，圣人之於天道也，命也。有性焉，君子不谓命也。" }
      - { type: z, text: "仁者得以恩爱施於父子，义者得以义理施於君臣，好礼者得以礼敬施於宾主，知者得以明知知贤达善，圣人得以天道王於天下，此皆命禄，遭遇乃得居而行之，不遇者不得施行。然亦才性有之，故可用也。凡人则归之命禄，在天而已，不复治性。以君子之道，则修仁行义，修礼学知，庶几圣人不倦，不但坐而听命，故曰君子不谓命也。“孟子曰”至“命也”。○正义曰：此章指言尊德乐道，不任佚性，治性勤礼，不专委命。君子所能，小人所病。究言其事，以劝戒也。“孟子曰”至“君子不谓性也”者，孟子言人口之於美味，目之於好色，耳之於五声，鼻之於芬芳，四肢之於安佚无事以劳之，凡此五者，皆人性所欲也。然而得居於此乐者，以其有命存焉。君子以为有命，在所不求，而不可以幸得也，是所以不谓之性也。“仁之於父子也”至“君子不谓命也”者，孟子又言仁以恩爱施之於父子，义以义理施之於君臣，礼以礼敬施之於宾主，知以明智施之於贤者，而具四端，圣人兼统四体而与於天道以王天下者也，凡此五者，皆归之於命也。然而有是五者，皆禀乎天性也，以其有性存焉。君子以为有性，在所可求，而不可不勉也，是所以不谓之命也。孟子言之，所以分别凡人、君子，以劝戒时人。" }
      - { type: j, text: "浩生不害问曰：“乐正子何人也？”" }
      - { type: z, text: "浩生，姓；不害，名。齐人也。见孟子闻乐正子为政於鲁而喜，故问乐政子何等人也。" }
      - { type: j, text: "孟子曰：“善人也，信人也。”" }
      - { type: z, text: "乐正子为人有善有信也。" }
      - { type: j, text: "“何谓善？何谓信？”" }
      - { type: z, text: "不害为善、信之行谓何？" }
      - { type: j, text: "曰：“可欲之谓善，有诸己之谓信，充实之谓美，充实而有光辉之谓大，大而化之之谓圣，圣而不可知之之谓。神乐正子二之中，四之下也。”" }
      - { type: z, text: "己之可欲，乃使人欲之，是为善人。己所不欲，勿施於人也。有之於己，乃谓人有之，是为信人。不意不信也。充实善信，使之不虚，是为美人。美德之人也。充实善信而宣扬之，使有光辉，是为大人。大行其道，使天下化之，是为圣人。有圣知之明，其道不可得知，是为神人。人有是六等，乐正子能善能信，在二者之中，四者之下也。“浩生”至“下也”。正义曰：此章指言神圣以下，优劣异差，乐正好善，应下二科，是以孟子为之喜者也。“浩生不害问曰：乐正何人也”者，浩生不害问孟子，曰乐正子何等人也，以其见孟子闻乐正子为政於鲁而喜，故有此问之也。“孟子曰：善人也，信人也”，孟子答之，以为乐正子是善人、信人者也，以其有善有信故也。“何谓善、何谓信”，不害又问之，曰何以谓之善，何以谓之信也。“曰可欲之谓善，有诸己之谓信”至“四之下也”者，孟子又答而详为之解之，曰己之可欲，使人欲之，是为善；有是善於己，谓人亦有之，是谓之信。所谓善即仁义礼智也，是为可欲之善矣。充实其善，使之不虚，是为美人，故谓之美；充实其善，而宣扬之，使有光辉于外，是为大人，故谓之大人；具此善，不特充实於己，而推之以化人，自近以及远，自内以及外，是为圣人，故谓之圣；以此之善，又至经以万方，使人莫知其故，是为神人，故谓之神。凡是六善，而乐正子能善能信，是在二之中，而在美、大、圣、神四者之下也，但不能充实而至神也。○注“孟子闻乐正子为政於鲁”。○正义曰：此盖经文，说见上。" }
      - { type: j, text: "孟子曰：“逃墨必归於杨，逃杨必归於儒。归，斯受之而已矣。”" }
      - { type: z, text: "墨翟之道，兼爱无亲疏之别，最为违礼。杨朱之道，为己爱身，虽违礼，尚得不敢毁伤之义。逃者去也，去邪归正，故曰归。去墨归杨，去杨归儒，则当受而安之也。" }
      - { type: j, text: "今之与杨、墨辩者，如追放豚，既入其{艹立}，又从而招之。" }
      - { type: z, text: "{艹立}，栏也。招，也。今之与杨、墨辩争道者，譬如追放逸之豕豚，追而还之入栏则可，又复从而之，太甚。以言去杨、墨归儒则可，又复从而非之，亦云太甚。“孟子”至“招之”。○正义曰：此章指言驱邪反正，正斯可矣，来者不绥，追其前罪，君子甚之，以为过也。“孟子曰：逃墨必归於杨”至“归斯受之而已矣”者，墨翟无亲疏之别，杨朱尚得父母生身不敢毁伤之义。儒者之道，幼学所以为己，壮而行之所以为人，故能兼爱。无亲疏之道，必归於杨朱为己，逃去杨朱为己之道，必归儒者之道也。然而归之儒道，则当斯受而安之矣。“今之与杨、墨”，“又从而招之”者，孟子又言今之人有与杨、墨辩争其道者，如追放逸之豕豚，既还入其栏，又从而之者也。以其逃墨而归儒，则可受之而已，而乃又从而罪之，无以异於追放逸之豕豚，既入其栏，又从而之也。以其为亦太甚矣，此孟子所以比之。" }
      - { type: j, text: "孟子曰：“有布缕之征，粟米之征，力役之征。" }
      - { type: z, text: "征，赋也。国有军旅之事，则横兴此三赋也。布，军卒以为衣也，缕，纟失铠甲之缕也。粟米，军粮也。力役，民负荷厮养之役也。" }
      - { type: j, text: "君子用其一，缓其二。用其二而民有殍，用其三而父子离。”" }
      - { type: z, text: "君子为政，虽遭军旅，量其民力，不并此三役，更发异时。急一缓二，民不苦之。若并用二，则路有饿殍。若并用三，则分崩不振，父子离析，忘礼义矣。“孟子曰”至“父子离”。○正义曰：此章指言原心量力，政之善者；繇役并兴，以致离殍；养民轻敛，君之道也。“孟子曰有布缕之征”至“用其三而父子离”者，此所以薄税敛之言，而有以救时之弊者矣。孟子言有布缕之征，有粟米之征，有力役之征，布所以为衣，缕所以纟失铠甲，粟米所以为粮，力征所以荷负厮养之役。然而君子为政，其於此三者之赋未尝并行也，用其一则缓其二，今夫三者之赋，皆取民以类也，如用其二，则有伤财而民至於饿死，用其三则有害民而至於父子离散，是岂君子之为政然欤！盖征之者义也，缓之者仁也，惟君子以仁是守，以义是行，然而充类之至而义之尽者，君子所不为也。此孟子不得不权时而救时之弊也。" }
      - { type: j, text: "孟子曰：“诸侯之宝三：土地、人民、政事。宝珠玉者，殃必及身。”" }
      - { type: z, text: "诸侯正其封疆，不侵邻国，邻国不犯，宝土地也；使民以时，居不离散，宝人民也；修其德教，布其惠政，宝政事也。若宝珠玉，求索和氏之璧、隋氏之珠，与强国争之，强国加害，殃及身也。正义曰：此章指言宝此三者，以为国珍；宝於珍玩，以殃其身。诸侯如兹，永无患也。孟子言诸侯之所宝者有三，曰土地，曰人民，曰政事。使邻国无侵犯其封疆，是宝其土地也；抚恤鳏寡茕独，使民以时，民不离散，是宝人民也；修德布惠，是宝政事也。若不以此三者为宝，而宝珠玉者，殃祸必及身矣。此孟子见当时之君争城杀人，横赋重敛，不以土地、人民、政事为宝，所以有是言而救之耳。○注“和氏之璧、隋侯之珠”。○正义曰：案《韩诗》云：“楚人和氏得玉璞於楚山中，献武王。武王使人相之，曰非也。王怒，刖其左足。後成王即位，和抱玉璞泣於楚山下。成王使人琢之，果得宝，名曰和氏之璧。”又隋侯姓祝，字元畅，往齐国，见一蛇在沙中，头上血出，隋侯以杖挑於水中而去，後回还到蛇处，乃见此蛇衔珠来隋侯前，隋侯意不怿。是夜梦脚踏一蛇，惊起，乃得双珠。後人称为隋侯珠矣。" }
      - { type: j, text: "盆成括仕於齐。孟子曰：“死矣，盆成括！”" }
      - { type: z, text: "盆成，姓；括，名也。尝欲学於孟子，问道未达而去，後仕於齐。孟子闻而嗟叹，曰：死矣盆成括。知其必死。" }
      - { type: j, text: "盆成括见杀，门人问曰：“夫子何以知其将见杀？”" }
      - { type: z, text: "门人问孟子，何以知之也。" }
      - { type: j, text: "曰：“其为人也小有才，未闻君子之大道也，则足以杀其躯而已矣。”" }
      - { type: z, text: "孟子答门人，言括之为人，小有才慧，而未知君子仁义谦顺之道，足以害其身也。“盆成括”至“而已矣”。○正义曰：此章指言小智自私，藏怨之府。大雅先人，福之所聚。劳谦终吉，君子道也。“盆成括仕於齐，孟子曰：死矣，盆成括”者，盆成括尝学於孟子，未达其道而去之，後仕於齐国，孟子闻之，乃曰死矣，盆成括。以其盆成括之必见死也。“盆成括见杀，门人问曰：夫子何以知其将见杀”者，言盆成括果见杀死，门人乃问孟子曰：夫子何以知其盆成括将见杀死？“曰其为人也小有才，未闻君子之大道也，则足以杀其躯而已矣”者，孟子答之，曰盆成括之为人，小有才慧，而未知闻君子仁义谦顺之大道，是则足以知其将见杀其身。" }
      - { type: j, text: "孟子之滕，馆於上宫。" }
      - { type: z, text: "馆，舍也。上宫，楼也。孟子舍止宾客所馆之楼上也。" }
      - { type: j, text: "有业屦於牖上，馆人求之弗得。或问之曰：“若是乎从者之也？”" }
      - { type: z, text: "屦，屦也。业，织之有次，业而未成也。置之窗牖之上，客到之後，求之不得。有来问孟子者曰：是客从者之？，匿也。孟子与门徒相随，从车数十，故曰侍从者所窃匿也。" }
      - { type: j, text: "曰：“子以是为窃屦来与？”" }
      - { type: z, text: "孟子谓馆人曰：子以是众人来随事我，本为欲窃屦故来邪。" }
      - { type: j, text: "曰：“殆非也。”" }
      - { type: z, text: "馆人曰：殆非为是来事夫子也。自知问之过也。" }
      - { type: j, text: "“夫予之设科也，往者不追，来者不拒。苟以是心至，斯受之而已矣。”" }
      - { type: z, text: "孟子曰：夫我设教授之科，教人以道德也，其去者亦不追呼，来者亦不拒逆，诚以是学道之心来至我，则斯受之，亦不知其取之与否？君子不保其异心也。见馆人殆非为是来，亦云不能保知，谦以益之而已。“孟子”至“而已矣”。○正义曰：此章指言教诲之道，受之如海，百川移流，不得有拒。虽独窃屦，非己所绝。顺答小人，小人自咎，所谓造次必于是也。“孟子之滕，馆於上宫”者，孟子往至滕国，乃舍止於宾客所馆之楼上。“有业屦於牖上，馆人求之弗得。或问之曰：若是乎从者之也”者，言业织之有次，业而未成之屦，置之於窗牖之上，自客到之後，馆主之人求之不得，或问於孟子曰：若此屦之不见，为从者之匿也？“曰子以是为窃屦来与”者，孟子见馆主乃问己，以为从者之匿其屦，乃谓之曰：子以是从者来随事我，本为欲窃子之屦故来与？“曰：殆非也”，馆主自知责己问之过也，乃曰殆非为是来事夫子也。“夫子之设科也”至“斯受之而已矣”者，孟子又曰：夫我之设科以教人，往去之者则不追呼而还，来者则不拒逆，诚以是学道之心来至我，则斯容受之而教诲，亦且不保其异心也。然则不拒从者之匿屦，亦何累之有？《论语》云：“不保其往，有教无类。”其斯之谓与。" }
      - { type: j, text: "孟子曰：“人皆有所不忍，达之於其所忍，仁也。" }
      - { type: z, text: "人皆有所爱，不忍加恶，推之以通於所不爱，皆令被德，此仁人也。" }
      - { type: j, text: "人皆有所不为，达之於其所为，义也。" }
      - { type: z, text: "人皆有不喜为，谓贫贱也，通之於其所喜为，谓富贵也。抑情止欲，使若所不喜为此者，义人也。" }
      - { type: j, text: "人能充无欲害人之心，而仁不可胜用也。" }
      - { type: z, text: "人皆有不害人之心，能充大之以为仁，仁不可胜用也。" }
      - { type: j, text: "人能充无穿窬之心，而义不可胜用也。" }
      - { type: z, text: "穿墙逾屋，奸利之心也。人既无此心，能充大之以为义，义不可胜用也。" }
      - { type: j, text: "人能充无受尔汝之实，无所往而不为义也。" }
      - { type: z, text: "尔汝之实，德行可轻贱，人所尔汝者也。既不见轻贱，不为人所尔汝，能充大而以自行，所至皆可以为义也。" }
      - { type: j, text: "士未可以言而言，是以言饣舌之也。可以言而不言，是以不言饣舌之也。是皆穿逾之类也。”" }
      - { type: z, text: "饣舌，取也。人之为士者，见尊贵者未可与言而强与之言，欲以言取之也，是失言也。见可与言者而不与之言，不知贤人可与之言，而反欲以不言取之，是失人也。是皆趋利入邪无知之人，故曰穿逾之类也。“孟子曰”至“类也”。○正义曰：此章指言善恕行义，充大其美，无受尔汝，何施不可。取人不知，失其臧否，比之穿逾，善亦远矣。“孟子曰：人皆不忍”至“是皆穿逾之类也”者，孟子言人皆有所恻隐而不忍，如能推之所不忍於其所忍者，仁人也，以其所爱及其所不爱，仁之为道如是也；人皆有所不喜为，谓贫贱也，如能推之所不喜为，而达之於所喜为，谓富贵也，是为有义之人也。人能充大不欲害人之心而为仁，则仁道於是乎备，故不可胜用也；人能充大其无穿逾奸利之心以为义，则义於是乎尽，故义不可胜用也。人能充大其不受人尔汝之实，是不为人所轻贱，故无所行而不为义者也，言所为皆可以为义矣。盖恻隐有不忍者，仁之端也；羞恶有不为者，义也：但能充而大之，则为仁、义矣。人之为士，於尊贵者未可与言而与之言，是以言取之也，是失言也，以其失之谄也；可以与之言而不与之言，是以不言取之也，是失人也，以其失之敖也：如此者，是皆为穿墙逾屋趋奸利之类也。" }
      - { type: j, text: "孟子曰：“言近而指远者，善言也。守约而施博者，善道也。君子之言也，不下带而道存焉。" }
      - { type: z, text: "言近指远，近言正心，远可以事天也；守约施博，约守仁义，大可以施德於天下也：二者可谓善言善道也。正心守仁，皆在臆，吐口而言之，四体不与焉。故曰不下带而道存焉。" }
      - { type: j, text: "君子之守，其身而天下平。" }
      - { type: z, text: "身正物正，天下平矣。" }
      - { type: j, text: "人病舍其田而芸人之田，所求於人者重，而所以自任者轻。”" }
      - { type: z, text: "芸，治也。田以喻身，舍身不治，而欲责人治，是求人太重，自任太轻也。“孟子曰”至“自任者轻。”正义曰：此章指言道之善，以心为原，当求诸己。而责於人，君子尤之，况以妄芸。言失务也。“孟子曰：言近而指远者”至“所以自任者轻”，孟子言辞之近而指意巳远者，乃为善言者也；所守简约，而所施博大者，乃为善道。○“君子之言也，不下带而道存焉”，是所谓言近而指远也，是孟子自解其旨也。以其君子於其言也，皆在臆，以其不远於心而道存焉。盖带者所以服之，近於人身也，故取而喻之，曰不下带而道存，抑又见君子之言非特腾口说而已。“君子之守，其身而天下平”，是所谓守约而施博也，是孟子又自解其旨也。以其君子之所守，特在身，而天下由是平矣，是所谓正己而物正者也。且人病在舍其己之田，而耕芸他人之田也，是所求於人者为重，而所以自任其在己者太轻耳。芸，治也。田所以喻人之身也，言人病在舍其己身，而治他人之身也，故为是云。" }
      - { type: j, text: "孟子曰：“尧、舜，性者也。汤、武，反之也。" }
      - { type: z, text: "尧、舜之体性自善者也。殷汤、周武，反之於身，身安乃以施人，谓加善於民也。" }
      - { type: j, text: "动容周旋中礼者，盛德之至也。" }
      - { type: z, text: "人动作容仪周旋中礼者，盛德之至。" }
      - { type: j, text: "哭死而哀，非为生者也。" }
      - { type: z, text: "死者有德，哭者哀也。" }
      - { type: j, text: "经德不回，非以干禄也。言语必信，非以正行也。" }
      - { type: z, text: "经，行也。体德之人，行其节操自不回邪，非以求禄位也。庸言必信，非必欲以正行为名也，性不忍欺人也。" }
      - { type: j, text: "君子行法以俟命而已矣。”" }
      - { type: z, text: "君子顺性蹈德，行其法度，夭寿在天，行命以待之而已矣。“孟子”至“而已矣”。○正义曰：此章指言君子之行，动合礼中，不惑祸福，身俟终。尧、舜之盛，汤、武之隆，不是过也。“孟子曰”至於“君子行法以俟命而已矣”者，孟子言尧、舜之体性自然善也；汤王、武王反之於身，身安乃以施人，谓加善於人而反之者也。一则体性之自然，一则反之於身、身安乃以施人，无非是礼也，故动容周旋中礼者，是为盛之至也。至者，以其盛德至矣尽矣，不可以有加矣。盖“哭死而哀，非为生者也”，是为动容中礼也，是孟子自解之旨也，言哭其死而哀之者，非为其生者也，以其动容中礼，德性然也。“经德不回，非以干禄也。言语必信，非以正义也”，是谓周旋中礼者也，是孟子自解之旨也，言经德不回邪，非欲干求爵禄而然也，以其周旋中礼，德行然也；言语必以正，非欲以正行为名故然也，亦以周旋中礼，德言如是也。君子者，顺性蹈德，行其礼法，身以俟命而已。然则尧、舜、禹、汤为盛德之至，亦不是过也。" }
      - { type: j, text: "孟子曰：“说大人则藐之，勿视其巍巍然。" }
      - { type: z, text: "大人，谓当时之尊贵者也。孟子言说大人之法，心当有以轻藐之，勿敢视之巍巍富贵若此，而不畏之，则心舒意展，言语得尽而已。" }
      - { type: j, text: "堂高数仞，榱题数尺，我得志弗为也。" }
      - { type: z, text: "仞，八尺也。榱题，屋ニ也。堂高数仞，榱题数尺，奢太之室，使我得志，不居此堂也。大屋无尺丈之限，故言数仞也。" }
      - { type: j, text: "食前方丈，侍妾数百人，我得志弗为也。" }
      - { type: z, text: "极五味之馔食，列於前方一丈，侍妾众多至数百人也。" }
      - { type: j, text: "般乐饮酒，驱骋田猎，後车千乘，我得志弗为也。" }
      - { type: z, text: "般，大也。大作乐而饮酒，驱骋田猎，後车千乘，般于游田也。" }
      - { type: j, text: "在彼者皆我所不为也，在我者皆古之制也，吾何畏彼哉！”" }
      - { type: z, text: "在彼贵者骄佚之事，我所耻为也。在我所行，皆古圣人所制之法，谓恭俭也。我心何为当畏彼人乎哉！“孟子”至“彼哉”。○正义曰：此章指言富贵而骄，自遗咎也，茅茨采椽，圣尧表也。以贱说贵，惧有荡心，心谓彼陋，以宁我神，故以所不为为之宝玩也。“孟子曰：说大人则藐之”至“吾何畏彼哉”者，孟子言说当时之尊贵为之大人者，当轻藐之，勿视其巍巍然尊贵而畏之也，以其如是，则心意舒展，得尽其言也。又言堂高数仞，仞，八尺也，至ニ高数尺，是为奢汰之室也，如我之得志於行道，不为此室也；食之前有方丈之广，以极五味之馔而列之，又有所侍之妾至数百人之众，如我得志於行道，亦不为之也；大作乐而饮酒，驱骋田猎，有後车千乘之多，如我得志於行道，亦不为之也。以其在彼骄贵之事者，皆於我所耻而不为之也；在我所行之事，又皆是古圣王之制度者也，是皆恭俭而有礼也：如是，则於我何有畏於彼之富贵乎哉！是以“说大人则藐之，而勿视其巍巍然也”。" }
      - { type: j, text: "孟子曰：“养心莫善於寡欲。其为人也寡欲，虽有不存焉者，寡矣。" }
      - { type: z, text: "养，治也。寡，少也。欲，利欲也。虽有少欲而亡者，谓遭横暴，若单豹卧深山而遇饥虎之类也，然亦寡矣。" }
      - { type: j, text: "其为人也多欲，虽有存焉者，寡矣。”" }
      - { type: z, text: "谓贪而不亡，蒙先人德业，若晋国栾之类也，然亦少矣，不存者众。“孟子”至“寡矣”。○正义曰：此章指言清净寡欲，德之高者，畜聚积实，秽行之下。廉者招福，浊者速祸，虽有不然，盖非常道，是以正路不可不由也。“孟子曰”至“虽有存焉者，寡矣”者，孟子言此以教时人养心之术也。言人之治其心，莫善於少欲也，其为人也少欲，则不为外物之汩丧，虽有遭横暴而亡者，盖亦百无二三也。然而未必全无也，以其少也，是如单豹为人少欲，独隐处於深山而卧，乃遭遇於饥虎而亡之，是也。其为人也多欲，则常於外物之所汩丧，虽间有不亡其德业於身者，盖亦百无二三也。然而未必多有者焉，以其亦少也，是如栾为人多贪，乃为卿而晋国者，是也。《荀子》云：“养心莫善於诚。”盖亦与此孟子同其旨也。" }
      - { type: j, text: "曾嗜羊枣，而曾子不忍食羊枣。公孙丑问曰：“脍炙与羊枣孰美？”" }
      - { type: z, text: "羊枣，枣名也。曾子以父嗜羊枣，父没之後，唯念其亲不复食羊枣，故身不忍食也。公孙丑怪之，故问羊枣与脍炙孰美也。" }
      - { type: j, text: "孟子曰：“脍炙哉。”" }
      - { type: z, text: "言脍炙固美也，何比於羊枣。" }
      - { type: j, text: "公孙丑曰：“然则曾子何为食脍炙而不食羊枣？”曰：“脍炙所同也，羊枣所独也。讳名不讳姓，姓所同也，名所独也。”" }
      - { type: z, text: "孟子言脍炙虽美，人所同嗜。独曾子父嗜羊枣耳，故曾子不忍食也。譬如讳君父之名，不讳其姓。姓与族同之，名所独也，故讳之也。“曾”至“所独也”。○正义曰：此章指言情礼相扶，以礼制情；人所同然，礼则不禁。曾参至孝，思亲异心，羊枣之感，终身不尝。孟子嘉焉，故上章称曰：岂有非义而曾子言之者也。“曾嗜羊枣，而曾子不忍食羊枣。公孙丑问曰：脍炙与羊枣孰美”者，曾，曾子父也，曾为人专好羊枣。羊枣，枣名也。曾既没，而曾子常思念其亲，而不忍食羊枣，公孙丑怪之，乃问孟子，以谓脍炙与羊枣此二味孰为美。“孟子曰：脍炙哉”，言脍炙固美於羊枣也，而羊枣何可比於脍炙哉！“公孙丑曰：然则曾子何为食脍炙而不食羊枣”，公孙丑又问孟子，曰如是则曾子何为独食於脍炙而不忍食羊枣。“曰：脍炙所同也，羊枣所独也。讳名不讳姓，姓所同也，名所独也”，孟子又答之。曰脍炙虽美，人所同好者也，羊枣独曾子好之，故曾子所以思念之而不忍食也。譬如君父之名，不讳其姓者，以其姓为族之所同，名为君父之所独，故讳之也。○注“羊枣，枣名也”。正义曰：盖贰与枣一物也，然而有二名，是贰小而枣大，贰酸而枣甘耳。云羊枣，则羊枣之为大枣甘者也，其类则贰枣之属也。曾者，曾子父也。案《史记·弟子传》曰“曾╀音点，字”是也。孔传云：“曾参父名点。”○注“上章称曰：岂有非义而曾子言之”者。○正义曰：此谓公孙丑疑曾子为非义，而乃不知脍炙所同、羊枣之所独，而曾子之心言之是或一於孝道，故云然也。" }
      - { type: j, text: "万章问曰：“孔子在陈，曰：‘盍归乎来？吾党之小子狂简进取，不忘其初。’孔子在陈，何思鲁之狂士？”" }
      - { type: z, text: "孔子厄陈，不遇贤人，上下无所交，盖叹息思归，欲见其乡党之士也。简，大也。狂者，进取大道而不得其正者也。不忘其初，孔子思故旧也。《周礼》“五党为州，五州为乡”，故曰吾党之士也。万章怪孔子何为思鲁之狂士者也。" }
      - { type: j, text: "孟子曰：“孔子‘不得中道而与之，必也狂狷乎？狂者进取，犭者有所不为也’。孔子岂不欲中道哉？不可必得，故思其次也。”" }
      - { type: z, text: "中道，中正之大道也。狂者能进取，犭者能不为不善。时无中道之人，以狂、犭次善者，故思之也。" }
      - { type: j, text: "“敢问何如斯可谓狂矣？”" }
      - { type: z, text: "万章曰：人行何如斯则可谓之狂也。" }
      - { type: j, text: "曰：“如琴张、曾、牧皮者，孔子之所谓狂矣。”" }
      - { type: z, text: "孟子言人行如此三人者，孔子谓之狂也。琴张，子张也。子张之为人，甚踔谲诡，《论语》曰“师也僻”，故不能纯善而称狂也，又善鼓琴，号曰琴张。曾，曾参父也。牧皮，行与二人同皆，事孔子学者也。" }
      - { type: j, text: "“何以谓之狂也？”" }
      - { type: z, text: "万章问何以谓此人为狂。" }
      - { type: j, text: "曰：“其志然，曰古之人，古之人。夷考其行，而不掩焉者也。" }
      - { type: z, text: "，志大言大者也。重言古之人，欲慕之也。夷，平也。考察其行，不能掩覆其言，是其狂也。" }
      - { type: j, text: "狂者又不可得，欲得不屑不之士而与之，是犭也，是又其次也。" }
      - { type: z, text: "屑，也。不，污秽也。既不能得狂者，欲得有介之人，能耻贱恶行不者，则可与言矣。是犭人次於狂者也。" }
      - { type: j, text: "孔子曰：‘过我门而不入我室，我不憾焉者，其惟乡原乎！乡原，德之贼也。’”" }
      - { type: z, text: "憾，恨也。人过孔子之门不入，则孔子恨之，独乡原不入者无恨心耳。以其乡原贼德故也。" }
      - { type: j, text: "曰：“何如斯可谓之乡原矣？”" }
      - { type: z, text: "万章问乡愿之恶如何。" }
      - { type: j, text: "曰：“何以是也？言不顾行，行不顾言，则曰‘古之人，古之人。行何为踽踽凉凉？生斯世也，为斯世也，善斯可矣’。阉然媚於世也者，是乡原也。”" }
      - { type: z, text: "孟子言乡原之人言何以，若有大志也，其言行不顾，则亦称曰古之人、古之人。行何为踽踽凉凉，有威仪如无所施之貌也。乡原者，外欲慕古之人，而其心曰古之人何为空自踽踽凉凉，而生於今之世无所用之乎。以为生斯世，但当取为人所善善人则可矣。其实但为合众之行。媚，爱也。故阉然大见爱於世也，若是者谓之乡原也。" }
      - { type: j, text: "万子曰：“一乡皆称原人焉，无所往而不为原人，孔子以为德之贼，何哉？”" }
      - { type: z, text: "万子即万章也，孟子录之，以其不解於圣人之意，故谓之万子。子，男子之通称也。美之者，欲以责之也。万子言人皆以为原善，所至亦谓之善人。若是，孔子以为贼德，何为也？" }
      - { type: j, text: "曰：“非之无举也，刺之无刺也。同乎流俗，合乎污世。居之似忠信，行之似廉，众皆悦之，自以为是，而不可与入尧、舜之道，故曰德之贼也。" }
      - { type: z, text: "孟子言乡原之人能匿蔽其恶，非之无可举者，刺之无可刺者，志同於流俗之人，行合於污乱之世。为人谋，居其身若似忠信，行其身若似廉，为行矣众皆悦美之，其人自以所行为是，而无仁义之实，故不可与入尧、舜之道也。无德而人以为有德，故曰德之贼也。" }
      - { type: j, text: "孔子曰：‘恶似而非者，恶莠，恐其乱苗也；恶佞，恐其乱义也；恶利口，恐其乱信也；恶郑声，恐其乱乐也；恶紫，恐其乱朱也；恶乡原，恐其乱德也。’" }
      - { type: z, text: "似真而非真者，孔子之所恶也。莠之茎叶似苗；佞人诈饰，似有义者；利口辩辞，似若有信；郑声淫，人之听似若美乐；紫色似朱，朱，赤也；乡原惑众，似有德者：此六似者，孔子之所恶也。" }
      - { type: j, text: "君子反经而已矣。经正则庶民兴，庶民兴，斯无邪慝矣。”" }
      - { type: z, text: "经，常也。反，归也。君子治国家归於常经，谓以仁、义、礼、智道化之，则众民兴起而家给人足矣。仓廪实而知礼节，安有为邪恶之行也！“万章曰”至“斯无邪慝矣”。○正义曰：此章指言士行有科，人有等级，中道为上，狂、犭不合。似是而非，色厉内荏，乡原之恶，圣人所甚。反经身行，民化於己，子率而正，孰敢不正也。“万章问曰：孔子在陈”至“何思鲁之狂士”者，万章问曰：孔子在陈国有厄，不遇贤人，上下无有交者，乃叹曰：盍归乎来，言我党之为士，进取於大道而不得其中道者也，亦以不忘其初而思故旧也，故问之孟子，谓孔子在陈国何为而思鲁国之狂士者也。“孟子曰：孔子不得中道而与之”至“故思其次也”，孟子答之，曰孔子不得中正之道者而取与之，必也思其狂、狷者乎？狂者以其但进取於大道而不知退宿於中道，狷者有所不敢为，但守节无所为而应进退者也。孔子岂不欲中道者而与之哉！不可以必得中道之人，故思念其次於中道者为狂、狷者也。“敢问何如斯可谓狂矣”，万章又问孟子曰：人行当何如，则斯可谓之狂矣。“曰琴张、曾、牧皮者，孔子之所谓狂矣”，孟子又答之，曰如琴张、曾、牧皮三者，孔子谓为狂者也。盖《论语》尝谓古之狂也肆，今之狂也荡。琴张、曾、牧皮三者，皆学於孔子，进取於道而躐等者也，是谓古之狂者也。琴张曰君子不为利疚我，曾风乎舞雩、咏而归，是皆有志於学，亦志於仕以为进取者也。牧皮，经传并无所见，大抵皆学孔子，而行有同於曾、琴张二人耳。此孟子所以皆谓之狂士。“何以谓之狂也”，万章又问，何以谓此三人为之狂士也。“曰其志然，曰古之人，古之人”至“乡原，德之贼也”者，孟子又答之，曰其志然大言，乃曰古之人，古之人，及考验其所行之行，而未始掩覆其言焉，是言过於行，为之狂者也。孔子思与狂者，又不可而必得之，欲得有介之人，能耻贱污行不者而与之，是为狷者也，是又次於狂者也。孔子有曰过我门而不入我室、我不以恨之者，其唯独於乡原之徒也，乡原者，以其为贼害於德者也。然则孔子如以自非乡原而过其门而不入室者，是则恨之矣。此亦见孔子自非乡原之徒者，无不与之也，所以思於中道而不可得，则思其狂、狷。“曰：何如斯可谓之乡原矣”，万章又问何如则谓之乡原者矣。“曰何以是也。”至“是乡原也”，孟子又答之，曰乡原之人其言何以是然若有大也？以其言不顾於行，行又不顾於言，则亦称之曰古之人，古之人，所行之行何为踽踽凉凉，有威仪如无所施之貌也。是言乡原之人外欲慕古之人，而其心乃曰：古之人何为空自踽踽凉凉，而生於今之世无所用之乎？以为生斯世也，但当取为人所善则可矣。故阉然大见媚爱之於世也者，是则谓之乡原者矣。“万子曰：一乡皆称原人焉”至“何哉”者，万章不解孟子之意，故问之曰：如一乡皆称为原善之人，是无所往而不为善人矣，孔子乃以为有贼害於德，是为德之贼者，何为者哉？“曰非之无举也”至“斯无邪慝”者，孟子又答之曰，言乡原之人能掩蔽其恶，使人欲非谤之，则无可而非者；使人欲讥刺之，则无可为讥刺者；其志则有同乎流俗之人，所行又合於污乱之世；居其身，则若有忠信，而实非忠信也；行其身，若有廉，而实非廉也；众人皆悦美之，而自以为是，而无其实：故不与入尧、舜之正道者也，是无德而为有德，故谓之为德之贼者也。孔子有曰：恶有似真而非真者，恶莠之茎叶秀茂者，以其似苗，恐有乱其苗种者也；恶佞诈饰者，以其似义，恐有乱其义者也；恶利口辩辞，以其似信，恐其有乱於信者也；恶郑声之淫哇，以其似美乐，恐其有乱於雅乐也；恶紫之间色，以其似朱，恐其有乱於朱者也；恶乡原之惑众，以其似有德，恐其有乱於德者也。凡此六者，孔子所以恶之，以其似是而非者也。君子者，乃归其常经而已矣。云经者，则义、信、德是也。如佞口乡原者，是不经也。唯君子则反经而已矣，君子去其不经以反复乎经，则其经斯於正而不他，故义以立而不为佞乱，信以立而不为利口乱，德以立而不为乡原乱，此庶民所以兴行，又不为两疑之惑矣。庶民既以兴行，斯无邪慝之行也。○注“《周礼》五党为州，五州为乡，故曰吾党之士也”。○正义曰：案《论语》云：“子在陈，曰：‘归与归与，吾党之小子狂简，斐然成章，不知所以裁之。’”今云《周礼》五党而解其文，盖亦不案此《论语》而有误也。诚如《周礼》五党言之，则《论语》何以云吾党盖，不当引此为证，所谓党者，盖五百家为之党，是其旨也。○注“孟子言”至“学者也”。○正义曰：子张之为人，甚踔谲诈。《论语》曰：“师也辟。”故不能纯善者。案《家语》有卫人琴牢字张，则此与《左传》所谓琴张者，琴牢而已，非所谓子张善鼓琴也。赵注引为颛孙师，亦未审何据。而琴张曰师张。曰“曾，曾参之父”，盖言於前矣。牧皮者，未详。○注“似美而非”至“孔子所恶也”。○正义曰：案《论语》云：“恶紫之夺朱，恶郑声之乱雅乐，恶利口之覆邦家。”其序与此不同者，盖孟子以乱义不及乱信，乱信不及乱德，其所主三者而已，苗莠、朱紫、声乐，所托以为喻者也，是所以为异者也。○注“色厉内荏”至“子帅以正，孰敢不正”者。○正义曰：此盖本《论语》之文而云。" }
      - { type: j, text: "孟子曰：“由尧、舜至於汤，五百有馀岁。若禹、皋陶则见而知之，若汤则闻而知之。" }
      - { type: z, text: "言五百岁圣人一出，天道之常也。亦有迟速，不能正五百岁，故言有馀岁也。见而知之，谓辅佐也。通於大贤次圣者，亦得与在其间。亲见圣人之道而佐行之，言易也。闻而知之者，圣人相去卓远，数百岁之间变故众多，逾闻前圣所行，追而遵之，以致其道，言难也。" }
      - { type: j, text: "由汤至於文王，五百有馀岁。若伊尹、莱朱则见而知之，若文王则闻而知之。" }
      - { type: z, text: "伊尹，挚也。莱朱，亦汤贤臣也，一曰仲虺是也。《春秋传》曰：“仲虺居薛，为汤左相。”是则伊尹为右相，故二人等德也。" }
      - { type: j, text: "由文王至於孔子，五百有馀岁。若太公望、散宜生，则见而知之，若孔子则闻而知之。" }
      - { type: z, text: "太公望，吕尚也，号曰师尚父。散宜生，文王四臣之一也。吕尚有勇谋而为将，散宜生有文德而为相，故以相配而言之也。" }
      - { type: j, text: "由孔子而来，至於今，百有馀岁，去圣人之世，若此其未远也；近圣人之居，若此其甚也。然而无有乎尔，则亦无有乎尔。”" }
      - { type: z, text: "至今者，至今之世，当孟子时也。圣人之间，必有大贤名世者，百有馀年，可以出未为远而无有也。邹、鲁相近，《传》曰：“鲁击柝闻於邾。”近之甚也。言己足以识孔子之道，能奉而行之，既不遭值圣人，若伊尹、吕望之为辅佐，犹可应备名世，如傅说之中出於殷高宗也。然而世谓之无有，此乃天不欲使我行道也。故重言之，知天意之审也。言“则亦”者，非实无有也，则亦当使为无有也。“乎尔”者，叹而不怨之辞也。“孟子曰”至“无有乎尔”。○正义曰：此章指言天地剖判，开元建始，三皇以来，人伦攸叙，宏析道德，班垂文采，莫贵圣人。圣人不出，名世承间，虽有此限，盖有遇不遇焉。是以仲尼至“获麟”而止笔，孟子亦有“乎尔”终其篇章，斯亦一契之趣也。“孟子曰由尧舜至於汤”至“由汤至於文王”，又至“由文王至於孔子”，又至“由孔子而至於今”，止“无有乎尔”者，此孟子欲归道於己，故历言其世代也。言自尧、舜二帝至於商汤，其年数有五百馀载矣，如禹、皋陶为尧、舜之臣，则亲见而知尧、舜圣人之大道而佐行之也，如汤王之去尧、舜之世，则相去有数百岁之远，则但闻其二帝所行之道，遵而行之者也。又自商汤逮至文王周时，又有五百馀岁，如伊尹、莱朱，二者俱为汤之贤臣，则亲见而知汤所行之道而辅佐之者也，如文王之去汤世，则相去有数百岁之远，则但闻其汤所行之道而遵之者也。以自文王之世至於孔子之时，又有五百馀载，如太公望、散宜生，二者为文王之臣，则亲见而知文王所行之道而辅佐之者也，如孔子之去文王世，则相去亦有数百岁之远，则但闻其文王之道而遵之者也。故自孔子以来逮至於今，但百有馀岁，以其去孔子之世如此之未远，自邹国至于鲁国其地相去如此之甚近，然而犹可应备名世，如傅说之中出於高宗也。然而世之以谓无有此名世而出於间者，乃天不欲使我行道也，故曰“然而无有乎尔，则亦无有乎尔”矣，此所以欲归於己而历举世代而言之也。○注“伊尹”至于“等德也”。○正义曰：《史记》云：“伊尹名挚，号为阿衡也，为汤之相。莱朱，亦汤贤臣，一曰仲虺。”是也。“《春秋传》曰：仲虺居薛，为汤左相”者，盖鲁定公元年左丘明之文也。杜预云：“仲虺，奚仲之後也。”○注“太公望、散宜生”。○正义曰：太公望，於前详言之矣。散宜生，案《论语》云：“武王曰：‘予有乱臣十人。’”马融云：“十人而散宜生在焉。散，姓；宜生，名也。”○注“至今者”至“而无有也”。○正义曰：云“鲁击析闻於邾”者，按鲁哀公七年公伐邾之文也，亦於叙言之详矣。云“傅说出殷高宗”者，亦言於前篇矣。然而仲尼作《春秋》，必至获麟而止者也，孟子亦必止於“无有乎尔”而终其篇者，盖亦见孟子拟仲尼而作者也。故哀公十四年春，西狩获麟。杜氏云：“麟，仁兽也，圣王之嘉瑞。时无明王出，而遇获仲尼，伤周道不兴，感嘉瑞之无应，故《春秋》中兴之教，绝笔於获麟之一句，所感而作，固所以为终也。”《孟子》之书，终於是言者，盖亦悯圣道不明于世，历三皇已来，推以世代，虽有岁限，然亦有遇不遇焉，故述仲尼之意而作此七篇，遂以“无有乎尔”终於篇章之末，盖亦深叹而不怨之云尔。" }
      - { type: j, text: "此七篇，遂以“无有乎尔”终於篇章之末，盖亦深叹而不怨之云尔。" }
