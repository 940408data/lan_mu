aboutHtml: |-
  <h2>關於此卷</h2>
  <p>《論語集注》為朱熹《四書章句集注》之一，此卷以宋刻本版式數字重刻，半葉八行、行十六字、注文雙行二十五字。</p>
  <p>卷之一收「學而第一」十六章、「為政第二」二十四章，經注全帙；篇內章次、注文分合悉依通行本。</p>
