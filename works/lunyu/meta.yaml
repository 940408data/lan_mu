  colophon: |-
    依<b>宋刻本</b>版式排比：一版兩個半葉，中縫為版心。經文大字單行，朱子集注小字雙行；遇章別行；注隨經而下，與純注列網格對齊，本列不敷乃另起列；雙行並進，長短相差不過一字。<br>版心上下留白口，上鐫單黑魚尾，次書名卷次、葉次，末署刻工姓名。<br>注文之制，備疏朗、雅正、宋槧三版，可於欄內遞轉；疏朗字大易誦，宋槧嚴守舊觀。<br>句讀以朱筆點之，附於字之右下，不占字位，點之斜正輕重因字而變，以仿手批氣韻；<br>可於經注並朱、惟經施朱、惟注施朱、白文無點四式間遞轉。<br>文本錄自朱熹《論語集注》卷之一：「學而第一」凡十六章、「為政第二」凡二十四章。
