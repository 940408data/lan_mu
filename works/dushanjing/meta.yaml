  <h2>關於這卷</h2>
    <p>《讀山海經》十三首，東晉陶潛（陶淵明）隱居柴桑時所作組詩。此其一，以「孟夏草木長」起興，寫初夏田園之樂：繞屋扶疏、眾鳥有托、耕種既畢、時還讀書、窮巷隔轍、故人罕至、酌酒摘蔬、微雨好風，末乃泛覽《周王傳》、流觀《山海圖》，俯仰宇宙，快然自足。全詩十六句五言，共八十字�?/p>
    <h3>復刻取捨</h3>
    <p>本卷以蘭木手卷引擎重排：行文依維基文庫底本。依骈對斷句、一聯一列，凡八行，每行十字（上句五、下句五），行氣整齊而意脈聯貫。字�?28、行�?46，墨色按蘸墨—行筆—墨盡的節奏逐字微調濃淡（種子確定性生成，無手�?marks）。無夾注�?/p>
    <p>點綴：引首鈐閒章「幽居」朱文印一枚、卷末鈐作者名章「陶潛」白文印一枚，極淡，遠觀若無，近察方見�?/p>
