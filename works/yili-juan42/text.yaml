# 儀禮注疏卷42（賈公彥疏）：j 為經文＋鄭玄注，z 為疏文。
sections:
  - id: juan42
    name: 正文
    blocks:
      - { type: z, text: "《士虞禮》第十四。○鄭《目錄》雲：“虞，安也。士既葬父母，迎精而反，日中祭之於殯宮以安之。虞於五禮屬兇。《大戴》第六，《小戴》第八，《別錄》第十四。”○釋曰：案此經雲“側亨於廟門外之右”，又記雲“陳牲於廟門外”，皆雲廟，《目錄》雲“祭之殯宮”者，廟則殯宮也。故鄭注《士喪禮》“凡宮有鬼神曰廟”，以其虞，卒哭在寢，祔乃在廟，是以鄭注《喪服小記》雲“虞於寢，祔於祖廟”是也。" }
      - { type: j, text: "士虞禮。特豕饋食。饋猶歸也。" }
      - { type: z, text: "“士虞禮特豕饋食”。○注“饋猶歸也”。○釋曰：自此盡“南順”，論陳鼎鑊祭器几筵等之事。案《左氏傳》雲：“卜日曰牲。”是以《特牲》雲牲，大夫已上稱牲，亦稱牢，故云少牢。此虞為喪祭，又葬日虞，因其吉日，故略無卜牲之禮，故指豕體而言，不雲牲，大夫以上亦當然。《雜記》雲“大夫之虞也，犆牲”，又此下記雲“陳牲於廟門外”，《檀弓》雲“與有司視虞牲”，皆言牲者，記人之言，不依常例故也。然《少牢》雲：“司馬刲羊，士擊豕。”不言牲者，據殺特須指事而言，亦非常例也。雲“饋猶歸”者，謂以物與神及人皆言饋，是以此虞及《特牲》、《少牢》皆言饋。《坊記》雲：“父母在，饋獻不及車馬。”是生死皆言饋。又案《周禮·玉府》雲掌“凡王之獻金玉、兵器”，注：“謂百工為王所作，可以獻遺諸侯。古者致物於人，尊之則曰獻，通行曰饋。”以此而言，獻雖主於尊，其《春秋》齊侯來獻魯戎捷，尊魯也。其雲饋者，上下通稱，故祭祀於神而言饋。陽貨饋孔子豚而言饋，《鄉黨》雲“朋友之饋”，是上下通言饋。《膳夫》雲“凡王之饋食用六穀”，注云：“進物於尊曰饋。此饋之盛者，王舉之饌也。”彼鄭據當文是進於王，故云進物於尊，其實通也。" }
      - { type: j, text: "側亨於廟門外之右，東面。側亨，亨一胖也。亨於爨用鑊，不於門東，未可以吉也。是日也，以虞易奠，祔而以吉祭易喪祭。鬼神所在則曰廟，尊言之。" }
      - { type: z, text: "“側亨”至“東面”。○注“側亨”至“言之”。○釋曰：雲“側亨，亨一胖”也，知者，案吉禮皆全，左右胖皆亨，不雲“側”。此雲“側亨”，明亨一胖而已。必亨一胖者，以其虞不致爵，自獻賓已後，則無主人、主婦及賓已下之俎，故唯亨一胖也。若然，《特牲》亦云側殺者，彼雖亨左右胖，少牢二，特牲一，故以一牲為側，各有所對故也。雲“亨於爨用鑊”者，亦案《少牢》有羊鑊，故亨在鑊。雲“不於門東，未可以吉也”者，以虞為喪祭，不於門東，對《特牲》吉禮，鼎鑊皆在門東，此雲“門外之右”，是門之西，未可以吉也。雲“是日也”至“喪祭”，皆《檀弓》文。雲“是日”，謂葬日，日中而虞，易去奠，以死事之，故立屍而祭之。雲“祔而以吉祭易喪祭”者，案下記雲：“三虞、卒哭、他，用剛日，亦如初，曰：哀薦成事。”鄭注引《檀弓》文，“葬日中而虞，不忍一日離也，是日也，以虞易奠，卒哭曰成事，是日也，以吉祭易喪祭”。如是，則卒哭即是吉祭。而鄭此注云祔為吉祭者，卒哭對虞為吉祭，卒哭比祔為喪祭，故下記雲“卒哭，祭乃餞”，雲“尊兩甒於廟門外之右，少南，洗在尊東南，水在洗東，篚在西”，注云：“在門之左，又少南。”則鼎鑊亦在門左。又云“明日，以其班祔，沐浴”，又云“其他如饋食”，是祔乃與《特牲》吉祭同，以祔為吉祭，是以雲祔而以吉祭易喪祭也。雲“鬼神所在則曰廟，尊言之”者，對時廟與寢別，今雖葬，既以其迎魂而反，神還在寢，故以寢為廟，虞於中祭之也。" }
      - { type: j, text: "魚、臘爨亞之，北上。爨，灶。" }
      - { type: z, text: "“魚臘”至“北上”。○注“爨灶”。○釋曰：上豕爨在門右，東面。此魚臘各別鑊，言“北上”，則次在豕鼎之北，而云“爨，灶”者，周公經為爨，至孔子時為灶，故王孫賈問孔子曰：“與其媚於奧，寧媚於灶。”是前後異名，故鄭舉後決前也。" }
      - { type: j, text: "饎爨在東壁，西面。炊黍稷曰饎。饎北上，上齊於屋宇。於虞有亨饎之爨，彌吉。" }
      - { type: z, text: "“饎爨”至“西面”。○注“炊黍”至“彌吉”。○釋曰：以三鑊在西方反吉。案《特牲》雲：“主婦視饎，爨於西堂下。”宗婦主之在西方，今在東，亦反吉也。《少牢》廩爨在饔爨之北，在門外者，是大夫主之，廩人掌男子之事，故與牲爨同在門外東方也。知“炊黍稷曰饎”者，案《周禮·饎人》雲：“掌凡祭祀共盛。”齊盛即黍稷，故知也。雲“北上，上齊於屋宇”者，此案《特牲》記雲“饎爨在西壁”，鄭注云：“西壁，堂之西牆下。舊說雲南北直屋，梠稷在南。”彼此東西皆言壁。彼雲屋梠，此雲屋宇，故知此亦齊屋也。雲“於虞有亨饎之爨，彌吉”者，以其小斂、大斂未有黍稷，朔月薦新之等，始有黍稷。向吉，仍未有爨，至此始有亨饎之爨，故云彌吉。" }
      - { type: j, text: "設洗於西階西南，水在洗西，篚在東。反吉也。亦當西榮，南北以堂深。" }
      - { type: z, text: "“設洗”至“在東”。○注“反吉”至“堂深”。○釋曰：如其上文設爨反吉，此亦反吉。又上下篇吉時設洗，皆當東榮，南北以堂深，今在西階西南，亦當西榮，南北以堂深可知也。" }
      - { type: j, text: "尊於室中北墉下，當戶，兩甒醴、酒，酒在東，無禁，冪用絺布，加勺，南枋。酒在東，上醴也。絺布，葛屬。" }
      - { type: z, text: "“尊於”至“南枋”。○注“酒在”至“葛屬”。○釋曰：雲“酒在東，上醴也”者，醴法，上古酒是人所常飲，故在東，吉禮玄酒在酒上。今以喪祭禮無玄酒，則醴代玄酒，在上，故云上醴也。雲“絺布，葛屬”者，絺綌以葛為之，布則以麻為之。今絺布並言，則此麻葛雜，故有兩號，是以鄭雲葛屬也。" }
      - { type: j, text: "素幾、葦蓆，在西序下。有幾，始鬼神也。" }
      - { type: z, text: "“素幾”至“席下”。○注“有幾始鬼神也”。○釋曰：經几席具有，注唯雲幾者，以其大斂奠時已有席，至此虞祭乃有幾故也。然案《檀弓》雲：“虞而立屍，有几筵。”筵則席，虞祭始有者，以几筵相將，故連言筵，其虞有幾。若天子諸侯始死，則几席具，故《周禮·司几筵》雲“每燾一幾”，據始殯及葬時，是始死即几席具也。" }
      - { type: j, text: "苴刌茅，長五寸，束之，實於篚，饌於西坫上。苴猶藉也。" }
      - { type: z, text: "“苴刌”至“坫上”。○注“苴猶藉也”。○釋曰：此苴而云藉祭，故《易》雲：“藉用白茅，無咎。”" }
      - { type: j, text: "饌兩豆菹、醢於西楹之東，醢在西，一鉶亞之。醢在西，南面取之，得左取菹，右取醢，便其設之。" }
      - { type: z, text: "“饌兩”至“亞之”。○注“醢在”至“設之”。○釋曰：此饌繼西楹言之，則以西楹為主，向東陳之。雲“一鉶亞之”者，菹以東也。雲“醢在西，南面取之，得左取菹，右取醢，便其設之”者，以其屍在奧東面設者，西面設於屍前，菹在南，醢在北。今於西楹東饌之，菹在東，醢在西，是南面取之，得左取菹，右取醢。至屍前西面，又左菹右醢，故云便也。" }
      - { type: j, text: "從獻豆兩，亞之，四籩亞之，北上。豆從主人獻祝，籩從主婦獻尸祝，北上，菹與棗。不東陳，別於正。" }
      - { type: z, text: "“從獻”至“北上”。○注“豆從”至“於正”。○釋曰：此從獻豆籩，雖文承一鉶之下，而云“亞之”。下別雲“北上”，是不從鉶東為次，宜於鉶東北，以北為上，向南陳之。若然，文承一鉶下而云亞之者，以其次在鉶以東，去楹漸遠，故云亞，不謂亞鉶以東也。據此陳之次，然則東北菹為首，次南醢，醢東栗，栗北棗，棗東棗，棗南栗。此以東面取之，而入北面，設之祝前，得右菹左醢，其籩亦然，先陳者先設，後陳者後設，棗在左，亦得其設，故鄭雲“北上，菹與棗”也。雲“豆從主人獻祝”者，以其屍前正豆已設訖，以為陰厭不名為從，此二豆主人先獻，祝酒後乃薦豆，故言從。雲“籩從主婦獻尸祝”者，以其四籩：二籩從主婦獻屍，二籩從主婦獻祝，亦是從也。雲“不東陳，別於正”者，以二豆與鉶，在屍為獻，前為正，此皆在獻後，為非正，故東北別也。" }
      - { type: j, text: "饌黍稷二敦於階閒，西上，藉用葦蓆。藉猶薦也。古文藉為席。" }
      - { type: z, text: "“饌黍”至“葦蓆”。○注“藉猶”至“為席”。○釋曰：雲“藉猶薦也”者，謂先陳席，乃陳黍稷於上，是所陳席藉薦黍稷也。" }
      - { type: j, text: "匜水錯於槃中，南流，在西階之南，簞巾在其東。流，匜吐水口也。陳三鼎於門外之右，北面，北上，設扃鼏。門外之右，門西也。今文扃為鉉。" }
      - { type: z, text: "“陳三”至“扃鼏”。○注“門外”至“為鉉”。○釋曰：此扃雖先雲“設”，其設扃在後，知者，案《士喪禮》小斂雲：“右人左執匕，抽扃予左手兼執之，取鼏委於鼎北，加扃。”則扃在鼏上，故先抽扃，後去鼏，則鼏先設可知。扃鼏雖在三鼎之下，總言其實，陳一鼎訖，即設之，知者，案下記雲“皆設扃鼏”，注云“嫌既陳，乃設扃鼏”是也。" }
      - { type: j, text: "匕俎在西塾之西。不饌於塾上，統於鼎也。塾有西者，是室南鄉。" }
      - { type: z, text: "“匕俎在西塾之西”。○注“不饌”至“南鄉”。○釋曰：雲“不饌於塾上，統於鼎也”者，決下文“羞燔俎在內西塾上”，而在塾上。又云“賓降，反俎於西塾”，至於主婦亞獻訖，直雲賓“燔從如初”，明屍受燔訖，賓亦反俎於西塾上，是互見義也。" }
      - { type: j, text: "羞燔俎在內西塾上，南順。南順，於南面取縮執之便也。肝俎在燔東。" }
      - { type: j, text: "主人及兄弟如葬服，賓執事者如吊服，皆即位於門外，如朝夕臨位。婦人及內兄弟，服即位於堂，亦如之。葬服者，《既夕》曰“丈夫髽，散帶垂”也。賓執事者，賓客來執事也。" }
      - { type: z, text: "“主人”至“如之”。○注“葬服”至“事也”。○釋曰：自此盡“北面”，論將虞祭於位及衣服之事。雲“葬服者，《既夕》曰丈夫髽散帶垂也”者，此唯謂葬日反日中而虞，及三虞時，其後卒哭，即服其故服，是以《既夕》記注云自卒至殯，自啟至葬，主人之禮，其變同。則始虞與葬服同，三虞皆同。至卒哭卒，去無時之哭則依其喪服，乃變麻服葛也。雲“賓執事者，賓客來執事也”者，以其虞為喪祭，主人未執事，故云賓客來執事也。案下注雲“士之屬官為其長吊服加麻”，即此經“賓執事者吊服”是也。若然，此士屬官中有命於其君者，是以《特牲》記賓中“有公有司”，鄭注云：“公有司亦士之屬，命於其君者也。”案《曾子問》：“士則朋友奠，不足取於大功以下。”又云：“士祭不足，則取於兄弟大功以下者。”鄭雲：“祭謂虞卒哭時。”以此而言，彼朋友則公有司與此執事一物，以僚友言之，雖屬官，亦為朋友也。" }
      - { type: j, text: "祝免，澡葛絰帶，布席於室中，東面，右幾，降，出，及宗人即位於門西，東面南上。祝亦執事。免者，祭祝之禮，祝所親也。澡，治也，治葛以為首絰及帶，接神宜變也。然則士之屬官為其長，吊服加麻矣。至於既卒哭，主人變服則除。右幾，於席近南也。" }
      - { type: z, text: "“祝免”至“南上”。○注“祝亦”至“南也”。○釋曰：雲“祝亦執事”者，謂亦上執事也。雲“免者，祭祀之禮，祝所親也”者，案《禮記·喪服小記》雲：“緦麻小功，虞卒哭則免。”注云：卒哭，緦麻以上至斬衰皆免。今祝是執事屬吏之等，皆無免法，今與緦以上同著免，嫌其大重，故云祭祀之禮祝所親，而可以受服也。" }
      - { type: j, text: "宗人告有司具，遂請拜賓，如臨。入門哭，婦人哭。臨，朝夕哭。" }
      - { type: z, text: "“宗人”至“人哭”。○注“臨朝夕哭”。○釋曰：朝夕哭，祭時門外送賓訖，入門男子、婦人共哭也。" }
      - { type: j, text: "主人即位於堂，眾主人及兄弟、賓即位於西方，如反哭位。《既夕》曰：“乃反哭，入門，升自西階東面，眾主人堂下東面，北上。”此則異於朝夕。" }
      - { type: z, text: "“主人”至“哭位”。○注“既夕”至“朝夕”。○釋曰：此明賓將與祭，主人及兄弟等即位之事。雲“如反哭位”，鄭引《既夕》者，證主人等面位之事也。" }
      - { type: j, text: "祝入門左，北面。不與執事同位，接神尊也。" }
      - { type: z, text: "“祝入門左北面”。○注“不與”至“尊也”。○釋曰：雲“不與執事同位，接神尊也”者，執事即上兄弟賓即位於西方，如反哭位，皆是執事，故《曾子問》“喪祭不足，則取兄弟”，故云不與執事同位接神尊也。" }
      - { type: j, text: "宗人西階前北面。當詔主人及賓之事。" }
      - { type: z, text: "“宗人”至“北面”。○注“當詔”至“之事”。○釋曰：此宗人在堂下，是主人在堂時。若主人在室，宗人即升堂，是以下記雲：“主人在室，則宗人升戶外北面。”注云“當詔主人室事”是也。" }
      - { type: j, text: "祝盥，升，取苴降，洗之，升，入設於幾東席上，東縮，降，洗觶，升，止哭。縮，從也。古文縮為蹙。" }
      - { type: z, text: "“祝盥”至“止哭”。○注“縮從也”。○釋曰：自此盡“哭出復位”，論設饌於神，杖不入於門之事也。案此文陰厭時，“主人倚杖，入，祝從，在左，西面”，下記雲“屍入祝從屍”，注云：“祝在主人前也。嫌如初時，主人倚杖入，祝從之。初時，主人之心尚若親存，宜自親之。今既接神，祝當詔侑屍也。”主人前自西入，向東，在階下未得倚杖於序，今主人在西階，將入室，故倚杖於西序。" }
      - { type: j, text: "主人倚杖，入，祝從，在左，西面。主人北旋，倚杖西序乃入。《喪服小記》曰：“虞杖不入於室，祔杖不升於堂。”然則練杖不入於門，明矣。贊薦菹醢，醢在北。主婦不薦，衰斬之服不執事也。《曾子問》曰：“士祭不足，則取於兄弟大功以下者。”" }
      - { type: z, text: "“贊薦”至“在北”。○注“主婦”至“下者”。○釋曰：案《特牲》主婦盥於房中，薦兩豆，此主婦不薦，故決之。既引《曾子問》士祭不足則取於兄弟大功以下者，彼文承奠下，故引之。下卒哭既取大功以下，則齊衰不執事可知。此齊衰不執事，唯為今時，至於屍入之後，亦執事。兩籩棗、栗，設於會南，至於祔祭，雖陰厭亦主婦薦，主人自執事也。知者，下記雲“其他如饋食”，案《特牲》雲“主人在右，及佐食舉牲鼎”是也。若大夫已上尊，不執事，故《少牢》雲“主人出迎鼎”，注云：“道之也。”是不執事也。" }
      - { type: j, text: "佐食及執事盥，出舉，長在左。舉，舉鼎也。長在左，西方位也。凡事宗人詔之。鼎入，設於西階前，東面北上，匕俎從設。左人抽扃、鼏，匕，佐食及右人載。載，載於俎。佐食載，則亦在右矣。今文扃為鉉。古文鼏為密。卒，朼者逆退復位。復賓位也。俎入，設於豆東，魚亞之，臘特。亞，次也。今文無之。" }
      - { type: j, text: "贊設二敦於俎南，黍，其東稷。簋實尊黍也。" }
      - { type: z, text: "“贊設”至“東稷”。○注“簋實尊黍也”。○釋曰：雲“簋實尊黍也”者，以經西黍東稷西上，故云尊黍也。經雲“敦”，注言“簋”者，案《特牲》雲“佐食分簋鉶”，注云：“分簋者，分敦黍於會，為有對也。敦，有虞氏之器也。周制，士用之，變敦言簋，容同姓之士，得從周制耳。”然則此注變敦言簋者，亦謂同姓之士得用簋故也。" }
      - { type: j, text: "設一鉶於豆南。鉶，菜羹也。" }
      - { type: z, text: "注“鉶菜羹也”。○釋曰：此對泰是湆羹。" }
      - { type: j, text: "佐食出，立於戶西。饌已也。今文無“於戶西”。" }
      - { type: z, text: "“佐食”至“戶西”。○注“饌已”至“戶西”。○釋曰：“佐食出”者，以無事不可以空立，故出立於戶西。不從今文無“於戶西”三字者，若無，此文不知立之所在，故不從也。" }
      - { type: j, text: "贊者徹鼎。反於門外。祝酌醴，命佐食啟會。佐食許諾，啟會，卻於敦南，復位。會，合也，謂敦蓋也。復位，出立於戶西。今文啟為開。" }
      - { type: z, text: "“祝酌”至“復位”。○注“會合”至“為開”。○釋曰：《特牲》、《少牢》直言酌奠，不言酌醴者，以彼直有酒，故不言酒，是酒可知。此酒、醴兩有，今所奠者醴，故須言醴也。若然，彼單酒，此兩有者，以其同小斂、大斂、朔月遷祖、祖奠、大遣奠等皆酒醴並有，故此虞之喪祭亦兩有，異於吉祭也。" }
      - { type: j, text: "祝奠觶於鉶南，復位。主人再拜稽首。復位，復主人之左。" }
      - { type: z, text: "“祝奠”至“稽首”。○注“復位”至“之左”。○釋曰：雲“復主人之左”者，上主人倚杖入，祝從在左，不見祝更有位，故復主人左也。" }
      - { type: j, text: "祝饗，命佐食祭。饗，告神饗。此祭，祭於苴也。饗神辭，記所謂“哀子某，哀顯相，夙興夜處不寧”，下至“適爾皇祖某甫尚饗”是也。" }
      - { type: z, text: "“祝饗命佐食祭”。○注“饗告”至“是也”。○釋曰：下雲“祝祝卒”，注云：“祝祝者，釋孝子祭辭。”又下文迎屍後，屍墮祭，雲“祝祝，主人拜如初”，此等三者皆有辭。此文饗神引記者，是陰厭饗神辭，下文迎屍上釋孝子辭者，經記無文，案《少牢》迎尸祝孝子辭雲：“孝孫某，敢用柔毛剛鬛，嘉薦，普淖，用薦歲事於皇祖伯某，以某妃配某氏，尚饗。”此是釋孝子辭。此迎屍上釋孝子辭，宜與彼同。但稱哀為異，其迎屍後祝辭者，即下記饗辭，雲“哀子某，圭為而哀薦之，饗”，鄭注云：“饗辭，勸強屍之辭也。”凡吉祭饗屍曰“孝子”。是以《特牲》迎屍後雲“祝饗”，注云：“饗，勸強之也。”其辭取於《士虞記》，則宜云“孝孫某圭為孝薦之饗”是也。下二虞卒哭，記皆有辭，至彼別釋。" }
      - { type: j, text: "佐食許諾，鉤袒，取黍稷，祭於苴三，取膚祭，祭如初。祝取奠觶祭，亦如之，不盡，益，反奠之。主人再拜稽首。鉤袒，如今擐衣也。苴，所以藉祭也。孝子始將納屍以事其親，為神疑於其位，設苴以定之耳。或曰：苴，主道也。則《特牲》、《少牢》當有主象而無，何乎？" }
      - { type: z, text: "“佐食”至“稽首”。○注“鉤袒”至“何乎”。○釋曰：雲“鉤袒，如今擐衣也”者，經雲鉤袒，若漢時人擐衣以露臂，故云如今擐衣也。雲“孝子始將納屍以事其親，為神疑於其位，設苴以定之耳”者，案上文祝取苴，降洗，設於幾東者，至此乃祭於苴。下文乃延屍，是孝子迎屍之前用苴，以將納屍，以事其親，為神疑於其位，故設苴以定之，解預設苴之意也。雲“或曰，苴主道也，則《特牲》、《少牢》當有主象而無，何乎”者，解舊有人云苴主道，似重為主道然，故鄭破之，雲若是苴為主道，《特牲》、《少牢》吉祭亦當有主象，亦宜設苴，今而無苴何乎？是鄭以苴為藉祭，非主道也。若然，此據文有屍而言，將納屍有苴，案下記文無屍者，亦有苴，又《特牲》、《少牢》吉祭無苴，案《司巫》“祭祀則供匰主及蒩館”，常祀亦有苴者，以天子諸侯尊者禮備，故吉祭亦有苴，兇祭有苴可知。" }
      - { type: j, text: "祝祝。卒，主人拜如初，哭，出，復位。祝祝者，釋孝子祭辭。" }
      - { type: j, text: "祝迎屍。一人衰絰奉篚，哭從屍。屍，主也。孝子之祭，不見親之形象，心無所系，立屍而主意焉。一人，主人兄弟。《檀弓》曰：“既封，主人贈而祝宿虞屍。”" }
      - { type: z, text: "“祝迎”至“從屍”。○注“屍主”至“虞屍”。○釋曰：自此盡“如初設”，論迎屍入九飯之事。鄭知“一人衰絰”是“主人兄弟”者，以主人哭出復位，無從屍之理，又云衰絰，且非疏遠，故知一人衰絰是主人兄弟也。引《檀弓》者，證祝隨主人葬，先反，宿虞屍，故得有祝迎屍之事。雲“既封”者，封當為窆，窆下棺也。" }
      - { type: j, text: "屍入門，丈夫踴，婦人踴。踴不同文者，有先後也。屍入，主人不降者，喪事主哀不主敬。" }
      - { type: z, text: "“屍入”至“人踴”。○注“踴不”至“主敬”。○釋曰：雲“踴不同文者，有先後也”者，主人在西序東面，眾兄弟西階下亦東面，婦人堂上當東序，西面，故主人與兄弟見屍先踴，婦人後見屍，故後踴，是有先後。雲“屍入，主人不降者，喪事主哀不主敬”者，決《特牲》、《少牢》屍入，主人皆降立於阼階東，敬屍，故此不降為主哀。" }
      - { type: j, text: "淳屍盥，宗人授巾。淳，沃也。沃屍盥者，賓執事者也。" }
      - { type: z, text: "“淳屍”至“授巾”。○注“淳沃”至“者也”。○釋曰：此直言盥，不言面位，案《特牲》雲：“屍入門左，北面盥，宗人授巾。”上陳器時，匜水之等在西階之東，合在門左，則以器就，《特牲》注云：“侍盥者執其器就之。”若然，《特牲》設屍盥“在門內之右”，注云：“屍尊不就洗，門內之右，象洗在東。”此虞禮反吉祭，故在西階東。少牢禮異於士禮，故屍盥在西階東，與此虞禮同也。雲“沃屍盥者，賓執事者”也，案上文賓與主人皆在執事之中，既宗人授巾，明沃盥亦賓執事也。" }
      - { type: j, text: "屍及階，祝延屍。延，進也，告之以升。" }
      - { type: z, text: "“屍及階祝延屍”。○注“延進”至“以升”。○釋曰：案《特牲》雲“祝延屍”，注云：“延，進也，在後詔侑曰延。”又案《少牢》注云“由後詔相之曰延”，然則延者，皆在後也。若然，記雲“屍稷祝前鄉屍”，又曰“降階還及門，如出戶”，注云：“降階如升時。”以此言之，降在屍前。雲如升者，直取與屍升同，不取後同，故《禮器》“詔侑無方”是也。" }
      - { type: j, text: "屍升，宗人詔踴如初。言詔踴如初，則凡踴，宗人詔之。" }
      - { type: z, text: "“屍升”至“如初”。○注“言詔”至“詔之”。○釋曰：雲“言詔踴如初，則凡踴，宗人詔之”者，以其上無宗人詔踴之事，以此宗人詔踴，雲如初，明前踴並明下文踴，皆宗人詔之，故鄭雲“凡”也。" }
      - { type: j, text: "屍入戶，踴如初，哭止。哭止，尊屍。婦人入於房。闢執事者。" }
      - { type: z, text: "“婦人入於房”。○注“闢執事者”。○釋曰：以其婦人在堂上，執事者由堂東，故闢之入房也。" }
      - { type: j, text: "主人及祝拜妥屍。屍拜，遂坐。妥，安坐也。" }
      - { type: z, text: "“主人”至“遂坐”。○釋曰：案《郊特牲》注云：“屍即至尊之，坐或時不自安，則以拜安之。”此亦然。“妥，安坐也”，《爾雅》文。" }
      - { type: j, text: "從者錯篚於屍左席上，立於其北。北，席北也。" }
      - { type: z, text: "“從者”至“其北”。○注“北席北也”。○釋曰：此虞禮篚象《特牲》肵俎，肵俎置於席北，明此篚亦在席北，以擬盛屍之饌也。" }
      - { type: j, text: "屍取奠，左執之。取菹，擩於醢，祭於豆閒。祝命佐食墮祭。下祭曰墮，墮之猶言墮下也。《周禮》曰：“既祭，則藏其墮。”謂此也。今文墮為綏。《特牲》、《少牢》或為羞，失古正矣。齊、魯之閒，謂祭為墮。" }
      - { type: z, text: "“屍取”至“墮祭”。○注“下祭”至“為墮”。○釋曰：雲“屍取奠，左執之”者，以右手將墮故也。雲“下祭曰墮”者，以其凡祭皆手舉之，向下祭之，故云下祭曰墮。雲“墮之猶言墮下”者，案《左傳》雲子路“將墮三都”，以三都大高，故墮下之。取墮為下祭之義，故讀從之。引《周禮·守祧職》雲“既祭藏其墮，謂此也”者，謂此墮、祭一也。引之者，證《守祧》同之耳。雲“今文墮為綏”，又云“《特牲》、《少牢》或為羞，失古正矣”者，此二字皆非墮下之義，故云失古正也。雲“齊魯之閒謂祭為墮”者，齊南魯北謂祭為墮者，由墮下而祭，因即謂祭為墮，是鄭從墮不從綏與羞之意也。案《特牲》雲“祝命挼祭”，注云：“《士虞禮》古文曰：祝命佐食墮祭。《周禮》曰：既祭則藏其墮。墮與挼讀同耳。今文改挼皆為綏，古文此皆為擩祭也。”又《少牢》屍將酢主人時，“上佐食以綏祭”，鄭注云：“綏讀為墮。”此三處經中墮皆不同者，此五字或為墮，或為挼，或為羞，或為綏，或為擩，此五者鄭既以挼、綏及羞三者已從墮，復雲古文作擩，以其《特牲》及此《士虞》皆有擩祭，故亦兼擩解。" }
      - { type: j, text: "佐食取黍稷肺祭授屍，屍祭之。祭奠，祝祝。主人拜如初。屍嘗醴，奠之。如初，亦祝祝卒，乃再拜稽首。" }
      - { type: z, text: "“佐食”至“奠之”。○注“如初”至“稽首”。○釋曰：雲“如初，亦祝祝卒，乃再拜稽首”者，亦如上文，迎屍前祝祝卒也。" }
      - { type: j, text: "佐食舉肺脊授屍。屍受，振祭，嚌之，左手執之。右手將有事也。屍食之時，亦奠肺脊於豆。" }
      - { type: z, text: "“佐食”至“執之”。○注“右手”至“於豆”。○釋曰：案《特牲》“祝命爾敦，佐食爾黍稷於席上”，“舉肺脊以授屍，屍受，振祭嚌之”，彼舉肺脊在爾敦後，此舉肺脊在爾敦前者，彼吉祭，吉凶相變故也。雲“右手將有事也”者，為下文祭鉶、嘗鉶是也。雲“屍食之時，亦奠肺脊於豆”者，解經無奠文。知不執以食卒者，案下文雲“屍卒食，佐食受肺脊實於篚”，在屍手當雲受肺脊，又知在豆者，《特牲》雲“屍實舉於菹豆”是也。案《特牲》屍“乃食食舉”，注云：“舉言食者，明凡解體皆連肉。”《少牢》雲“食舉”，注云：“舉，牢肺正脊也，先飯啖之，以為道也。”此喪祭不言食舉，亦食舉可知。是以《特牲》注云“肺，氣之主也”，脊正體之貴者，先食啖之，所以道食通氣也。案下文注云“屍不受魚臘，以喪不備味”，則亦不食庶羞矣。" }
      - { type: j, text: "祝命佐食邇敦。佐食舉黍，錯於席上。邇，近也。屍祭鉶、嘗鉶。右手也。《少牢》曰：“以柶祭羊鉶，遂以祭豕鉶，嘗羊鉶。”" }
      - { type: z, text: "“屍祭鉶嘗鉶”。○注“右手”至“羊鉶”。○釋曰：知以右手者，上經雲“佐食舉肺脊授屍，屍受，振祭，嚌之，左手執之”，鄭雲“右手將有事”，指此嘗鉶用右手也。引《少牢》者，證此經嘗祭之時亦用柶。案下記雲：“鉶芼用苦，若薇有滑，夏用葵，冬用荁，有柶。”是用柶祭之義。" }
      - { type: j, text: "泰羹湆自門入，設於鉶南，胾四豆，設於左。博異味也。湆，肉汁也。胾，切肉也。" }
      - { type: z, text: "“泰羹”至“於左”。○注“博異”至“肉也”。○釋曰：雲“設於鉶南”者，以泰羹湆未設，故繼鉶而言之，其實觶北留空處，以待泰羹。雲“胾四豆，設於左”者，案《特牲》“四豆設於左，南上”，雲左者，正豆之左。又《少牢》雲：“上佐食羞胾，兩瓦豆，有醢，設於薦豆之北。”注云：“設於薦豆之北，以其加也。”言北亦是左也。雲“博異味”者，以其有湆有胾故也。" }
      - { type: j, text: "屍飯，播餘於篚。不反餘也。古者飯用手，吉時播餘於會。古文播為半。" }
      - { type: z, text: "“屍飯播餘於篚”。○注“不反”至“為半”。○釋曰：雲“古者飯用手”者，案《曲禮》雲“無摶飯”，又云“無放飯”，“飯黍毋以箸”，故知古者飯用手。言此者，證播飯去手為放飯。雲“吉時播餘於會”者可知，故決之。" }
      - { type: j, text: "三飯，佐食舉幹，屍受，振祭，嚌之，實於篚。飯門啖肉，安食氣。" }
      - { type: z, text: "“三飯”至“於篚”。○注“飯閒”至“食氣”。○釋曰：雲“飯閒啖肉安食氣”者，以其胳脅骨體連肉，又在三飯之閒，故云飯閒啖肉安食氣。" }
      - { type: j, text: "又三飯，舉胳，祭如初。佐食舉魚、臘，實於篚。屍不受魚臘，以喪不備味。" }
      - { type: z, text: "“又三”至“於篚”。○注“屍不”至“備味”。○釋曰：雲“屍不受魚臘”者，案經“佐食舉魚臘”，不雲屍受嚌之，明屍不受魚臘可知。雲“以喪不備味”者，案《特牲》三舉魚臘，屍皆振祭嚌之，此佐食舉魚臘，實於篚，屍不嚌，故云喪不備味。" }
      - { type: j, text: "又三飯，舉肩，祭如初。後舉肩者，貴要成也。" }
      - { type: z, text: "“又三”至“如初”。○注“後舉”至“成也”。○釋曰：雲“後舉肩者，貴要成也”者，案《禮記·祭統》雲“周人貴肩”，故云貴者要成也。要成者，據後食即飽也。" }
      - { type: j, text: "舉魚、臘俎、俎釋三個。釋猶遺也。遺之者，君子不盡人之歡，不竭人之忠。個猶枚也。今俗或名枚曰個，音相近。此臘亦七體，如其牲也。" }
      - { type: z, text: "“舉魚”至“三個”。○注“釋猶”至“牲也”。○釋曰：此經直舉魚臘俎盛於篚，俎釋三個，不言盛牲體者，案下記雲“羹飪升左肩、臂、臑、肫、胳、脊、脅”七體，此上經佐食，初舉脊，次舉幹，又舉胳，終舉肩，總舉四體，唯有臂、臑、肫三者，佐食即當俎釋三個，不復盛牲體，故直舉魚臘而已。雲“遺之者，君子不盡人之歡，不竭人之忠”，此《上曲禮》文，案彼注“歡謂飲食，竭謂衣服”。於此引之並據飲食者，彼注對文，此注散文，則歡與忠通，故總證牲體也。又案《特牲》“釋三個”注云：“謂改饌於西北隅遺之。”與此注不同者，此注亦有改饌之義，又兼有此不盡歡忠之禮。雲“今俗或名枚曰個，音相近”者，經中個人下豎牽俗語，名枚曰個者，人傍著固，字雖不同，音聲相近，同是一個之義。雲“此臘亦七體，如其牲也”者，案下記牲有七體，此臘亦不過特牲體，故云如其牲，言此以對彼。案彼特牲吉祭十一體，是以《特牲》記雲“臘如牲骨”，乃有十一體，與此不同，吉禮異故也。" }
      - { type: j, text: "屍卒食，佐食受肺脊，實於篚，反黍，如初設。九飯而已，士禮也。篚猶吉祭之有肵俎。" }
      - { type: z, text: "“屍卒”至“初設”。○注“九飯”至“肵俎”。○釋曰：雲“反黍如初設”者，案上設黍稷在俎南，西黍東稷，次上文佐食舉黍，錯於席上，此屍卒食，故反黍於本處，如初設。雲“九飯而已，士禮也”者，少牢十一飯，諸侯十三飯，天子十五飯，故云九飯士禮也。雲“篚猶吉祭之有肵俎”者，案《特牲》、《少牢》屍舉牲體振祭嚌之，皆加於肵俎，此屍舉牲體振祭嚌之，皆實於篚，故云篚猶吉祭之有肵俎。" }
      - { type: j, text: "主人洗廢爵，酌酒酳屍。屍拜受爵，主人北面答拜。屍祭酒，嘗之。爵無足曰廢爵。酳，安食也。主人北面以酳酢，變吉也。凡異者皆變吉。古文酳作酌。" }
      - { type: z, text: "“主人”至“嘗之”。○注“爵無”至“作酌”。○釋曰：自此盡“升堂復位”，論主人初獻屍並獻祝及獻佐食之事。雲“爵無足曰廢爵”者，案下文“主婦洗足爵”，鄭雲：“爵有足，輕者飾也。”則主人喪重，爵無足可知。凡諸言廢者，皆是無足廢敦之類是也。雲“主人北面以酳酢，變吉也”者，案《特牲》、《少牢》屍拜受，主人西面拜送，與此面相反，故云變吉也。案《特牲》直有主人送拜，雖不見主人面位，約與《少牢》同，皆西面也。雲“凡異者皆變吉”者，案《特牲》雲“主人拜送”，此雲主人答拜；《特牲》雲：“屍卒角，祝受屍角，曰送爵。”此不雲送爵；《特牲》濟肝訖，加於菹豆，此嚌肝訖，加於俎，皆是異於吉時，故云凡異者皆變吉。" }
      - { type: j, text: "賓長以肝從，實於俎，縮，右鹽。縮，從也。從，實肝炙於俎也。喪祭進柢。右鹽於俎近北，便屍取之也。縮執俎，言右鹽，則肝鹽並也。" }
      - { type: z, text: "“賓長”至“右鹽”。○注“縮從”至“並也”。○釋曰：雲“縮，從也。從，實肝炙於俎也。喪祭進柢”者，案下記雲“載猶進柢”，柢，本也，謂肝之本，頭進之向屍。雲“右鹽於俎近北，便屍取之也”者，從執俎一頭向屍，據執俎之人左畔有肝，右畔有鹽，西面向屍，屍東面，以右手取肝於俎右畔，擩鹽於左畔，是以鹽於俎之近北，便屍取之。雲“縮執俎，言右鹽，則肝鹽並也”者，謂俎既縮，執則狹肝，鹽不容相遠，是執俎人右畔有鹽，左畔有肝，故云“並”也。" }
      - { type: j, text: "屍左執爵，右取肝，擩鹽，振祭，嚌之，加於俎。賓降，反俎於西塾，復位。取肝，右手也。加於俎，從其牲體也。以喪不志於味。" }
      - { type: z, text: "“屍左”至“復位”。○注“取肝”至“於味”。○釋曰：復位者，謂賓長也，屍既振肝訖，復西階前眾兄弟之南，東面位。雲“以喪不志於味”者，決《特牲》、《少牢》屍嚌肝訖，加菹豆以近身。此虞禮，屍嚌肝訖，不加於菹豆，而遠加於俎，以同牲體者，以喪志不在於味，故遠身加俎也。若然，《特牲》、《少牢》祝不敢與屍同加於菹豆，嚌肝訖，加於俎，與此屍同者，祝無不在位之嫌，禮窮則同故也。" }
      - { type: j, text: "屍卒爵，祝受，不相爵。主人拜，屍答拜。不相爵，喪祭於禮略。相爵者，《特牲》曰：“送爵，皇屍卒爵。”祝酌授屍，屍以醋主人，主人拜受爵，屍答拜。醋，報。" }
      - { type: j, text: "主人坐祭，卒爵，拜，屍答拜。筵祝，南面。祝接神，尊也。筵用萑席。" }
      - { type: z, text: "“筵祝南面”。○注“祝接”至“萑席”。○釋曰：上文屍用葦蓆，其祝席經記雖不言，以屍用在喪，故不用萑，今祝宜與平常同，故用萑也。雲“祝接神，尊也”者，解先得獻之事。" }
      - { type: j, text: "主人獻祝，祝拜，坐受爵，主人答拜。獻祝，因反西面位。" }
      - { type: z, text: "“主人”至“答拜”。○注“獻祝”至“面位”。○釋曰：雲“獻祝，因反西面位”者，以《少牢》雲主人受酢時，“主人拜受爵，屍答拜，主人西面奠爵”。《特牲》雲“主人拜受角”，雖不言西面，彼注云：“退者，進受爵反位。”則西面也，是吉祭時主人西面，故上注云“北面以酳酢變吉也”，今至酳酢及獻祝訖，明因反西面位可知也。" }
      - { type: j, text: "薦菹醢，設俎。祝左執爵，祭薦，奠爵，興，取肺，坐祭，嚌之，興，加於俎，祭酒，嘗之，肝從。祝取肝擩鹽，振祭，嚌之，加於俎，卒爵，拜。主人答拜。今文無擩鹽。" }
      - { type: z, text: "“薦菹”至“答拜”。○釋曰：此直言“薦菹醢設俎”者，不見薦徹之人，案下文雲“祝薦席徹入於房”，注云：“徹薦席者，執事者。”則此設者亦執事可知。" }
      - { type: j, text: "祝坐受主人。主人酌獻佐食，佐食北面拜，坐受爵，主人答拜。佐食祭酒，卒爵，拜。主人答拜，受爵，出，實於篚，升堂，復位。篚在庭，不復入，事已也。亦因取杖，乃東面立。" }
      - { type: z, text: "注“篚在”至“面立”。○釋曰：雲“篚在庭”者，此雖無文，約同薦車設遷奠之等也。雲“不復入，事已也，亦因取杖，乃東西面立”者，上文哭時，主人升堂，西序東面，又上文雲“主人倚杖入”，今升堂復位，不復入室，以其事已，因得取杖復東面位也。" }
      - { type: j, text: "主婦洗足爵於房中，酌，亞獻屍，如主人儀。爵有足，輕者飾也。《昏禮》曰：“內洗在北堂，直室東隅。”" }
      - { type: z, text: "“主婦”至“人儀”。○注“爵有”至“東隅”。○釋曰：自此盡“入於房”，論主婦獻屍並獻祝及佐食之事。雲“如主人儀”者，即上主人酳屍，屍拜受爵，主人北面答拜之等。今主婦亞獻亦然，故云如主人儀也。雲“爵有足，輕者飾也”者，主婦，主人之婦，為舅姑齊衰，是輕於主人，故爵有足為飾也。引《昏禮》者，證經洗爵於房中，不言設洗處，宜與《昏禮》同也。" }
      - { type: j, text: "自反兩籩，棗、栗，設於會南，棗在西。尚棗，棗美。" }
      - { type: z, text: "“自反”至“在西”。○注“尚棗棗美”。○釋曰：案《特牲》：“宗婦執兩籩，主婦受，設於敦南。”此主婦自反兩籩，不使宗婦者，以喪尚縱，縱，反吉故。然上主人獻，使贊薦菹醢，注云：齊斬之服不執事者。彼為主人獻，故不使主婦薦，此亞獻，己所有事，故自薦可知。" }
      - { type: j, text: "屍祭籩、祭酒如初。賓以燔從，如初。屍祭燔、卒爵如初。酌獻祝，籩、燔從，獻佐食，皆如初。以虛爵入於房。初，主人儀。" }
      - { type: z, text: "“屍祭”至“於房”。○注“初主人儀”。○釋曰：此“屍祭籩”已下，至“籩燔從獻佐食”，皆舉主人獻屍，賓長以肝從，至佐食祭酒，卒爵拜，主人答拜，受爵出，實於篚，並如主人儀，故皆雲“如初”也。" }
      - { type: j, text: "賓長洗繶爵，三獻，燔從，如初儀。繶爵，口足之閒有篆文，又彌飾。" }
      - { type: z, text: "“賓長”至“初儀”。○注“繶爵”至“彌飾”。○釋曰：此一節論賓長終三獻之事。雲“繶爵，口足之閒有篆又彌飾”者，案《屨人》繶是屨之牙底之閒，縫中之飾，則此爵雲繶者，亦是爵口足之閒有飾可知。雲“又彌飾”，以其主婦有足已是有飾，今口足之閒又加飾也。" }
      - { type: j, text: "婦人復位。復堂上西面位，事已，屍將出，當哭踴。" }
      - { type: z, text: "“婦人復位”。○注“復堂”至“哭踴”。○釋曰：自此盡“拜稽顙”，論祭訖送屍，及改饌為陽厭之事。雲“復堂上西面位”者，上雲主人即位於門外，如朝夕臨位，婦人及內兄弟服，即位於堂亦如之，以下更不見別有婦人位，明覆位者還此位可知。又案《士喪禮》凡臨位，婦人即位於堂南上即面位也。雲“屍將出，當哭踴”者，以哭送，此喪祭故踴，《特牲》吉祭不哭踴，故亦無此復位之事也。" }
      - { type: j, text: "祝出戶，西面告利成。主人哭，西面告，告主人也。利猶養也。成，畢也。言養禮畢也。不言養禮畢，於屍閒嫌。" }
      - { type: z, text: "“祝出”至“人哭”。○注“西面”至“閒嫌”。○釋曰：雲“西面告，告主人也”者，以處主人東面，故祝西面對而告之。雲“不言養禮畢，於屍閒嫌”者，若言養禮畢，即於屍中閒有嫌諷去之。或本閒作閒音，以養屍事畢，而屍空閒，嫌諷去之。" }
      - { type: j, text: "皆哭。丈夫婦人於主人哭，斯哭矣。" }
      - { type: z, text: "“皆哭”。○注“丈夫”至“哭矣”。○釋曰：言上雲主人哭，則主人之外，緦麻以上，在位者皆哭。故鄭總“丈夫、婦人於主人哭斯哭矣”。" }
      - { type: j, text: "祝入，屍謖。謖，起也。祝入而無事，屍則知起矣。不告屍者，無遣尊者之道也。古文謖或為休。" }
      - { type: z, text: "“祝入屍謖”。○注“謖起”至“為休”。○釋曰：雲“祝入而無事，屍則知起矣”者，雖不告屍無事，屍亦知無事，禮畢而起矣。雲“不告屍者，無遣尊者之道也”者，謂不告屍以禮畢者，屍尊，若告之，則如發遣尊者，故云不告屍者無遣尊者之道也。" }
      - { type: j, text: "從者奉篚哭，如初。初，哭從屍。祝前屍，出戶，踴如初，降堂，踴如初，出門，亦如之。前，道也。如初者，出如入，降如升，三者之節悲哀同。" }
      - { type: z, text: "“祝前”至“如之”。○注“前道”至“哀同”。○釋曰：案上文屍入門，丈夫踴，婦人踴。屍及階，祝延屍，屍升，宗人詔踴如初。屍入戶，踴如初，故此鄭雲“出如入，降如升，三者之節悲哀同”，是以如之，得有三者也。" }
      - { type: j, text: "祝反，入徹，設於西北隅，如其設也。幾在南，厞用席。改設饌者，不知鬼神之節，改設之。庶幾歆饗，所以為厭飫也。幾在南變古文，明東面。不南面，漸也。厞，隱也，於厞隱之處，從其幽闇。" }
      - { type: z, text: "“祝反”至“用席”。○注“改設”至“幽闇”。○釋曰：祝反入，謂送屍出門，而反入徹神前之饌，故設於西北隅也。雲“如其設也”者，謂設於西北隅，次第一如奧中東面設。雲“幾在南，變古文”者，上文陰厭時，設几席於室中東面，右幾，今雲幾在南，明其同。必變文者，案《少牢》大夫禮陽厭時南，亦幾在右，此言右幾，嫌與大夫同南面而右幾，故變文雲幾在南，與前在奧同，故云“明東面”也。又以《特牲》雲：“祝筵几於室中，東面。”至於改饌雲：“佐食徹屍薦俎，敦設於西北隅，幾在南。”是與此同也。雲“不南面，漸也”者，以《特牲》東面右幾，今虞為喪祭，是向吉有漸，故設幾與吉祭同。“厞，隱也。於厞隱之處，從其幽闇”者，謂以席為障，使之隱，故云厞隱從其幽闇也。" }
      - { type: j, text: "祝薦席，徹入於房。祝自執其俎出。徹薦席者，執事者。祝薦席，則初自房來。" }
      - { type: z, text: "“祝薦”至“俎出”。○注“徹薦”至“房來”。○釋曰：雲“徹薦席者，執事者”，但祝之薦席，設與徹不言其人，知使執事者，以其主人之士不言官者皆為之故也。雲“祝薦席，則初自房來”者，以其上文神席在西序下，此祝經記俱不言，今知自房來者，見《公食大夫》記雲“筵出自房”。《昏禮》與《士冠》席皆亦在於房，故比祝席亦自房來，今還於房可知也。" }
      - { type: j, text: "贊闔牖戶。鬼神尚居幽闇，或者遠人乎？贊，佐食者。" }
      - { type: z, text: "“贊闔牖戶”。○注“鬼神”至“食者”。○釋曰：雲“或者遠人者乎”，《禮記·郊特牲》文。此鄭玄之義，非直取鬼神居幽闇，或取遠人之意故也，知是生人之意。雲“贊佐食”者，自上以來行事，唯有祝與佐食，以其雲“祝自執其俎出”，故知闔牖戶者是佐食也。" }
      - { type: j, text: "主人降，賓出。宗人詔主人。降，賓則出廟門。主人出門，哭止，皆復位。門外未入位。" }
      - { type: z, text: "注“門外未入位”。○釋曰：知是門外位者，以經雲“出門”，乃更雲“皆復位”，明“門外未入位”可知。" }
      - { type: j, text: "宗人告事畢，賓出，主人送，拜稽顙。送拜者，明於大門外也。賓執事者皆去，即徹室中之饌者，兄弟也。" }
      - { type: z, text: "“宗人”至“稽顙”。○注“送拜”至“弟也”。○釋曰：雲“送拜者，明於大門外也”者，以其上文雲復位，是殯門外，未出大門，此雲“送拜”，是大門外送拜可知。知“徹室中之饌者兄弟也”者，賓即執事，而云“賓出”，則室中無執事之人，唯有兄弟，故徹室中之饌者兄弟可知也。" }
      - { type: j, text: "記。虞，沐浴，不櫛。沐浴者，將祭，自絜清。不櫛，未在於飾也。唯三年之喪不櫛，期以下櫛可也。今文曰沐浴。" }
      - { type: z, text: "“記虞沐浴不櫛”。○注“沐浴”至“沐浴”。○釋曰：雲“唯三年之喪不櫛，期以下櫛可也”者，經雲不據三年為主，案下文“班祔”，而明期以下，虞而沐浴、櫛可也。" }
      - { type: j, text: "陳牲於廟門外，北首，西上，寢右。言牲，臘在其中。西上，變吉。寢右者，當升左胖也。臘用棜。《檀弓》曰：“既反哭，主人與有司視虞牲。”" }
      - { type: z, text: "“陳牲”至“寢右”。○注“言牲”至“虞牲”。○釋曰：知臘在牲中者，《士虞》唯有一豕，而云“西上”，明知兼免臘得雲西上也。雲“西上，變吉”者，案《少牢》二牲東上，是吉祭東上，今此西上，是變吉也。雲“寢右者，當升左胖也”者，若然，《特牲》臘在東，置於棜東首，牲在西，尚右，今虞禮反吉，故寢右升左胖。知“臘用棜”者，案《特牲》陳鼎於門外北面，北上，棜在南，南順，實獸於其上，東首是也。引《檀弓》者，證虞時有牲之事。" }
      - { type: j, text: "日中而行事。朝葬，日中而虞，君子舉事必用辰正也。再虞、三虞皆質明。" }
      - { type: z, text: "“日中而行事”。○注“朝葬”至“質明”。○釋曰：雲“辰正”者，謂朝夕日中也，以朝有葬事，故至日中而行虞事也。雲“再虞三虞皆質明”者，以朝無葬事，故皆質明而行虞事，是用朝之辰正也。" }
      - { type: j, text: "殺於廟門西，主人不視。豚解。主人視牲不視殺，凡為喪事略也。豚解，解前後脛脊脅而已，孰乃體解，升於鼎也。今文無廟。" }
      - { type: z, text: "“殺於”至“豚解”。○注“主人”至“無廟”。○釋曰：雲“主人視牲不視殺，凡為喪事略也”者，案《特牲饋食禮》宗人“告濯具，賓出，主人出，皆復外位”，鄭雲：“為視牲也。”又曰：“告事畢，賓出，主人拜送，夙興，主人服如初，立於門外東方，南面，視側殺。”然則特牲吉祭，故主人視牲又視殺。今虞為喪事，故主人視牲不視殺，是其略也。“凡”者，眾辭，但此經與《特牲饋食》不同者，皆為喪事略，故云凡以廣之。“豚解，解前後脛脊脅而已，孰乃體解，升於鼎也”者，體解下文七體是也。" }
      - { type: j, text: "羹飪，升左肩、臂、臑、肫、骼、脊、脅、離肺，膚祭三，取諸左膉上，肺祭一，實於上鼎。肉謂之羹。飪，孰也。脊脅，正脊、正脅也。喪祭略，七體耳。離肺，舉肺也。《少牢饋食禮》曰：“舉肺一，長終肺。祭肺三，皆刌。”膉，脰肉也。古文曰左股上。此字從肉殳，殳矛之殳聲。" }
      - { type: z, text: "“羹飪”至“上鼎”。○注“肉謂”至“殳聲”。○釋曰：肉謂之羹，《爾雅·釋器》文。飪孰，《釋言》文。雲“脊脅，正脊、正脅也”者，案《特牲》注云：“不貶正脊，不奪正也。”然則此為喪祭，體數雖略，亦不奪正，故知脊脅正脊正脅也。雲“喪祭略，七體耳”者，案《特牲》“屍俎，右肩、臂、臑、肫、胳，正脊二骨，橫脊、長脅二骨，短脅”，注云：“士之正祭禮九體，貶於大夫，有併骨二，亦得十一之名。合《少牢》之體數，此所謂放而不致者。”然則此所升唯七體，故云喪祭略七體耳。雲“離肺，舉肺也”者，案《特牲》注云“離猶扌奎也。小而長，午割之，亦不提心，謂之舉肺”是也。引《少牢饋食禮》者，證離肺舉肺之異也。雲“膉，脰肉也”者，案《少牢》雲：“雍人倫膚九，實於一鼎。”注云：“倫，擇也。膚，脅革肉擇之取美者。”案下注“今以脰肉貶於純吉”，則此用膉為貶於純吉之事也。雲“古文曰左股上，此字從肉殳，殳矛之殳聲”者，鄭注《儀禮》疊古文從經今文，又說古文解之者，鄭欲兩從故也。但字從肉義可知，而以殳與股不是形人之類，其理未審。" }
      - { type: j, text: "升魚：鱄鮒九，實於中鼎。差減之。" }
      - { type: z, text: "“升魚”至“中鼎”。○注“差減之”。○釋曰：“差減之”者，案《特牲》魚十有五，今為喪祭略而用九，故云差減之也。" }
      - { type: j, text: "升臘左胖，髀不升，實於下鼎。臘七亦體，牲之類。" }
      - { type: z, text: "“升臘”至“下鼎”。○注“臘七亦體牲之類”。○釋曰：雲“臘亦七體牲之類”者，牲，上文升左肩、臂、臑、肫、胳、脊、脅，是牲之七體。今升臘左胖亦然，《特牲》記雲“臘如牲骨”是也。" }
      - { type: j, text: "皆設扃鼏，陳之。嫌既陳乃設局鼏也。今文扃作鉉，古文鼏作密。" }
      - { type: z, text: "“皆設扃鼏陳之”。○注“嫌既”至“作密”。○釋曰：雲“嫌既陳乃設扃鼏也”者，經雲陳三鼎，後言設扃鼏，有嫌，故記人辨之，皆先扃鼏後陳之也。" }
      - { type: j, text: "載猶進柢，魚進鬐。猶，猶《士喪》、《既夕》，言未可以吉也。柢，本也。鬐，脊也。今文柢為胝，古文鬐為耆。" }
      - { type: z, text: "“載猶”至“進鬐”。○注“猶猶”至“為耆”。○釋曰：鬐、柢二者，皆變於吉，是以《少牢》雲：“下利升豕，其載如羊，皆進下。”注云：“變於食生也。”又曰“臘一純而俎亦進下”，又曰“魚用鮒十有五而俎，縮載，右首，進腴”，注云：“亦變於食生也。”是皆與此反矣，是變於吉也。雲“猶，猶《士喪》、《既夕》，言未可以吉也”者，雲與吉反，則明與生人同。《士喪禮》小斂雲“皆覆進柢”，注云：“柢，本也。進本者，未異於生也。”至大斂“載魚左首，進鬐，臘進柢”，鄭注云：“亦未異於生也。”又葬奠雲如初，皆未異於生，故記人以猶之。是以《鄉飲酒》、《鄉射》記皆雲“右體進腠”是也。" }
      - { type: j, text: "祝俎，髀、脰、脊、脅、離肺，陳於階閒，敦東。不升於鼎，賤也。統於敦，明神惠也。祭以離肺，下屍。" }
      - { type: z, text: "“祝俎”至“敦東”。○注“不升”至“下屍”。○釋曰：雲“不升於鼎，賤也”者，祝對上屍俎羹飪升於鼎為貴者也。雲“統於敦，明神惠也”者，案上文饌黍稷二敦於階閒，西上，是神之黍稷，今陳祝饌於神饌之東，統於神物，明惠由神也。雲“祭以離肺，下屍”者，以共屍祭用刲肺，祝不用刲肺，用離肺，故云下屍也。" }
      - { type: j, text: "淳屍盥，執槃，西面。執匜，東面。執巾在其北，東面。宗人授巾，南面。槃以盛棄水，為淺汙人也。執巾不授，巾卑也。" }
      - { type: z, text: "“淳屍”至“南面”。○注“槃以”至“卑也”。○釋曰：上經直雲“淳屍盥，宗人授巾”，不雲執槃與執匜、執巾及宗人授巾等面位，故記人明之。" }
      - { type: j, text: "主人在室，則宗人升，戶外北面。當詔主人室事。" }
      - { type: z, text: "“主人”至“北面”。○注“當詔主人室事”。○釋曰：上經唯言宗人告有司具及詔主人踴，皆堂下之事，今主人入室，宗人當升戶外詔主人，室中之事，故升堂也。" }
      - { type: j, text: "佐食無事，則出戶，負依南面。室中尊，不空立。戶牖之閒謂之依。" }
      - { type: z, text: "“佐食”至“南面”。○注“至中”至“之依”。○釋曰：雲“戶牖之閒謂之扆”，此《爾雅》文，謂戶西南面也。" }
      - { type: j, text: "鉶芼，用苦，若薇，有滑。夏用葵，冬用荁，有柶。苦，苦荼也。荁，堇類也。乾則滑。夏秋用生葵，冬春用乾荁。古文苦為枯，今文或作芐。" }
      - { type: z, text: "“鉶芼”至“有柶”。○注“苦苦”至“作芐”。○釋曰：案《公食》記三牲具，則牛藿、羊苦、豕薇，各用其一。若一牲者，容兼用其二，是以及特牲一豕，皆雲鉶芼，苦薇，是科用其一也。知“荁，堇類”者，《內則》雲“堇荁枌榆”，同為滑物，故知荁堇類也。雲“乾則滑”者，以其冬用之，故知乾則滑於堇也。雲“夏秋用生葵，冬春用乾荁”者，以其秋與夏同有生葵，春初未生者，故春約與冬同，是以經直雲冬，明舉夏以兼秋，舉冬以兼春也。" }
      - { type: j, text: "豆實，葵菹，菹以西蠃醢。籩，棗烝，栗擇。棗烝栗擇，則菹刌也。棗烝栗擇，則豆不揭，籩有籘也。" }
      - { type: z, text: "“豆實”至“栗擇”。○注“棗烝”至“籘也”。○釋曰：雲“棗烝栗擇，則菹刌也。棗烝栗擇，則豆不揭，籩有籘也”者，此雖無正文，案《士喪禮》大斂雲：“毼豆兩，其實葵菹芋蠃醢，兩籩，無籘，布巾，其實栗，不擇，脯四脡。”自大斂後皆雲如初，則葬奠四豆，脾、析、葵、菹，亦長矣，四籩，棗、糗、栗、脯亦不擇也。至此乃雲棗烝栗擇，則菹亦切矣，豆籩有飾可知。" }
      - { type: j, text: "屍入，祝從屍。祝在主人前也。嫌如初時，主人倚杖入，祝從之。初時，主人之心尚若親存，宜自親之。今既接神，祝當詔侑屍也。" }
      - { type: z, text: "“屍入祝從屍”。○注“祝在”至“屍也”。○釋曰：上經陰厭時，主人先祝入戶，至此迎尸祝在主人前，先後有異，故記人明之，是以鄭雲“祝在主人前也，嫌如初時，主人倚杖入，祝從之”也。雲“今既接神，祝當詔侑屍也”者，屍，神象，是以雲既接神祝當詔侑屍。即上祝命佐食爾敦舉黍稷，及祝酌授屍，及祝出告利成，祝入屍謖之等是也。" }
      - { type: j, text: "屍坐不說屨。侍神，不敢燕惰也。今文說為稅。" }
      - { type: z, text: "“屍坐不說屨”。○注“侍神”至“為稅”。○釋曰：案《鄉飲酒》、《燕禮》之等，凡坐降，說屨乃升坐，今屍雖坐，不說屨者，為“侍神，不敢燕惰”故也。" }
      - { type: j, text: "《儀禮註疏》" }
