# 儀禮注疏卷40（賈公彥疏）：j 為經文＋鄭玄注，z 為疏文。
sections:
  - id: juan40
    name: 正文
    blocks:
      - { type: j, text: "至於壙，陳器於道東西，北上。統於壙。" }
      - { type: z, text: "“至於”至“北上”。○注“統於壙”。○釋曰：自此盡“拜送”，論至壙陳器及下棺訖送賓之事。雲“統於壙”者，對廟中南上，此則北上，故云統於壙也。" }
      - { type: j, text: "茵先入。當藉柩也。元士則葬用輁軸，加茵焉。" }
      - { type: z, text: "“茵先入”。○注“當藉”至“茵焉”。○釋曰：雲“當藉柩也”者，解茵先入之意，以其茵入，乃後屬引下棺於其上，以須藉柩，故茵先入。雲“元士則葬用輁軸加茵焉”者，元士謂天子之士，葬時，先以輁軸由羨道入，乃加茵於其上，乃下棺於中。知元士葬用輁軸者，《檀弓》雲：“孺子<享黃>之喪，哀公欲設撥。”注云：“撥可撥引輴車，所謂紼。”“問於有若，有若曰：其可也，君之三臣猶設之。顏柳曰：天子龍輴而槨幬，諸侯輴而設幬，為榆沈，故設撥。三臣者廢輴而設撥，竊禮之不中者也。”以此言之，天子諸侯殯葬，皆用輴，朝廟用輴，可知大夫雖殯葬，不用輴，朝廟亦用輴，以其士殯葬不用輁軸，朝廟得用之，明大夫朝廟得用輴。故上注云：“大夫諸侯以上，有四周謂之輴。”以其大夫諸侯以上，有四周謂之輴，以其大夫朝廟得用輴，故言之也。諸侯之大夫有三命、再命、一命，殯葬不得用輴，天子之元士亦三命、再命、一命，葬得用輁軸者，《春秋》之義，王人雖微，猶在諸侯之上。明天子之士尊，謂之為元。元者，善之長，故得用輁軸，不與諸侯大夫同也。" }
      - { type: j, text: "屬引。於是說載除飾，更屬引於緘耳。古文屬為燭。" }
      - { type: z, text: "“屬引”。○注“於是”至“為燭”。○釋曰：雲“於是說載”者，謂柩車至壙，解說去載與披及引之等。“除飾”者，解去帷荒池組之等，然後下棺。雲“更屬引於緘耳”者，案《喪大記》雲：“君窆以衡，大夫士以鹹。”鄭注云：“衡，平也。人君之喪，又以木橫貫緘耳，居旁，持而平之。”今齊人謂棺束為緘，以此而言，則棺束君三衽三束，大夫士二衽二束，束有前後，於束末皆為緘耳。以紼貫結之而下棺，人君又於橫木之上以屬紼也。" }
      - { type: j, text: "主人袒，眾主人西面，北上。婦人東面。皆不哭。俠羨道為位。" }
      - { type: z, text: "“主人”至“不哭”。○注“俠羨道為位”。○釋曰：主人袒者，為下棺變。婦人不言北上，亦如男子北上可知。“不哭”者，為下棺宜靜。雲“俠羨道為位”者，羨道謂入壙道，上無負土為羨道。天子曰隧，塗上有負上為隧，僖二十五年，晉文公請隧弗許是也。" }
      - { type: j, text: "乃窆。主人哭，踴無筭。窆。下棺也。今文窆為封。" }
      - { type: z, text: "“乃窆”至“無筭”。○注“窆下棺也”。○釋曰：主人哭踴，不言處，還於壙東西面也。雲“窆，下棺”者，《春秋》謂之塴，皆是下棺之名也。" }
      - { type: j, text: "襲，贈用制幣玄纁束。拜稽顙，踴如初。丈八尺曰制。二制合之。束，十制五合。" }
      - { type: z, text: "“襲贈”至“如初”。○注“丈八”至“五合”。○釋曰：雲“丈八尺曰制”者，朝貢禮及巡狩禮皆有此文，以丈八尺名為制。《昏禮》幣用二丈，取成數。凡禮幣，皆用制者，取以儉為節。《聘禮》雲：“釋幣制玄纁束。”注云：“凡物，十曰束。玄纁之率，玄居三，纁居二。”此注云“二制合之，束，十制五合”者，則每一端丈八尺，二端為一匹，五匹合為十制也。" }
      - { type: j, text: "卒，袒，拜賓，主婦亦拜賓。即位，拾踴三，襲。主婦拜賓，拜女賓也。即位，反位。" }
      - { type: z, text: "“卒袒”至“三襲”。○注“主婦”至“反位”。○釋曰：“卒”謂贈卒，更袒拜賓。雲“反位”者，各反羨道東西位，其男賓在眾主人之南，女賓在眾婦之南。" }
      - { type: j, text: "賓出，則拜送。相問之賓也。凡吊賓有五，去皆拜之，此舉中焉。" }
      - { type: z, text: "“賓出則拜送”。○注“相問”至“中焉”。○釋曰：鄭知賓是“相問之賓也。凡吊賓有五，此舉中”者，案《雜記》雲：“相趨也，出宮而退；相揖也，哀次而退；相問也，既封而退；相見也，反哭而退；朋友，虞祔而退。”注云：“此吊者恩薄厚去遲速之節也。相趨，謂相聞姓名，來會喪事也。相揖，嘗會於他也。相問，嘗相惠遺也。相見，嘗執贄相見也。”以此而言，此經既葬而退，是相見問遺之賓，舉中以見上下五者，去即皆拜送可知。" }
      - { type: j, text: "藏器於旁，加見。器，用器、役器也。見，棺飾也。更謂之見者，加此則棺柩不復見矣。先言藏器，乃雲加見者，器在見內也。內之者，明君子之於事，終不自逸也。《檀弓》曰：有虞氏之瓦棺，夏后氏堲，周、殷人棺槨，周人牆置翣。" }
      - { type: z, text: "“藏器於旁加見”。○注“器用”至“置翣”。○釋曰：雲“器，用器、役器也”者，用器，即上弓矢、耒耜之等；役器，即上甲冑、幹笮之屬。此器中亦有樂器，不言者，省文。知有用器役器者，以下別雲“包筲”之等，則所藏者是此器也。雲“見，棺飾也”者，飾則帷荒，以其與棺為飾，是以《喪大記》雲：“飾棺，君龍帷，黼荒；大夫畫帷，畫荒；士布帷，布荒。”注云：“飾棺者，以華道路及壙中，不欲眾惡其心也。”此柩入壙，還以帷荒加於柩，故鄭注云“及壙中”也。雲“更謂之見者，加此則棺柩不復見矣”者，以其唯見此帷荒，故名帷荒為見，是棺柩不復見也。雲“先言藏器，乃雲加見者，器在見內也。內之者，明君子之於事，終不自逸也”者，以用器、役器近身陳之，是不自逸也。引《檀弓》者，見帷荒在柩外，周人名為牆，若牆屋，然其外又置翣為飾也。" }
      - { type: j, text: "藏苞筲於旁。於旁者，在見外也。不言甕甒，饌相次可知。四者兩兩而居。《喪大記》曰：“棺槨之閒，君容祝，大夫容壺，士容甒。”" }
      - { type: z, text: "“藏包筲於旁”。○注“於旁”至“容甒”。○釋曰：雲“於旁者，在見外也”者，以其加見，乃雲“藏包筲”，故知見外也。雲“不言甕甒，饌相次可知”者，以其陳器之法，後陳者先用，甕甒後用包筲，包筲藏，明甕甒先藏可知，故云相次可知。雲“四者兩兩而居”者，謂包筲居一旁，甕甒居一旁，故云兩兩而居也。引《喪大記》者，欲見槨內棺外，所容寬狹，得容器物之意也。" }
      - { type: j, text: "加折，卻之。加抗席，覆之。加抗木。宜次也。" }
      - { type: z, text: "“加折”至“抗木”。○注“宜次也”。○釋曰：雲“宜次也”者，宜謂折上陳之，美面鄉上，今用即美面鄉下，抗席又覆之，又折宜承席，席宜承木，皆是其宜也。次者，木則先陳後用，席則後陳先用，是其次也。" }
      - { type: j, text: "實土三，主人拜鄉人。謝其勤勞。" }
      - { type: z, text: "“實土”至“鄉人”。○注“謝其勤勞”。○釋曰：案《雜記》雲：“鄉人五十者從反哭，四十者待盈坎。”注云：“非鄉人則少長皆反。”以此而言，於時主人未反哭，鄉人並在，故今至實土三遍，主人拜謝之，謝其勤勞。勤勞者，謂在道助執紼，在壙助下棺，及實土也。" }
      - { type: j, text: "即位，踴，襲，如初。哀親之在斯。" }
      - { type: z, text: "“即位踴襲如初”。○注“哀親之在斯”。○釋曰：謂既拜鄉人，乃於羨道東即位，踴無筭，如初也。雲“哀親之在斯”者，以親之在斯，故哀號甚，踴無筭。" }
      - { type: j, text: "乃反哭，入，升自西階，東面。眾主人堂下，東面，北上。西階東面，反諸其所作也。反哭者，於其祖廟，不於阼階西面。西方，神位。" }
      - { type: z, text: "“乃反”至“北上”。○注“西階”至“神位”。○釋曰：自此盡“門外拜稽顙”，論主人反哭賓吊之事。反哭者，拜鄉人訖，反還家哭，於廟入升西階東面哭。雲“西階東面，反諸其所作也”者，案《檀弓》雲：“反哭升堂，反諸其所作也。”注云“親所行禮之處”是也。雲“反哭者，於其祖廟”者，謂下士祖禰共廟，故下經賓出，主人送於門外，遂適於殯宮。適士二廟者，自殯宮先朝禰，後朝祖。今反哭，則先於祖，後幹禰，遂適殯宮也。案《春秋》僖八年經書“用致夫人”，《左氏》雲凡夫人“不殯於廟”者，春秋之世，多行殷法，不與禮合也。雲“不於阼階西面。西方，神位”者，以《特牲》、《少牢》主人行事升降，皆由阼階，今不於阼階，故決之以西方神位。知者，《特牲》、《少牢》皆布席於奧，殯又在西階，是西方神位，主人非行事，直哭而已，故就神位。" }
      - { type: j, text: "婦人入，大夫踴，升自阼階。闢主人也。" }
      - { type: z, text: "“婦人”至“阼階”。○注“闢主人也”。○釋曰：反哭之禮，主人、男子等先入，主婦、婦人等後入，故婦人入，丈夫在位者皆踴。婦人不升西階者，由主人在西階，故鄭雲“闢主人”。" }
      - { type: j, text: "主婦入於室，踴，出即位，及丈夫拾踴三。入於室，反諸其所養也。出即位，堂上西面也。拾，更也。" }
      - { type: z, text: "“主婦”至“踴三”。○注“入於”至“更也”。○釋曰：案《檀弓》雲：“主婦入於室，反諸其所養也。”鄭注云：“親所饋食之處。”但主人既在西階親所行禮之處，以婦人無外事，故於饋食之處哭也。雲“出即位堂上西面也”者，自小斂奉屍夷於堂已後，主婦等位皆在阼階上，西面，是以知出即位者，阼階上西面也。雲“拾，更也”者，凡成踴而拾，皆主人踴，主婦人踴，賓乃踴，故云更也。" }
      - { type: j, text: "賓吊者升自西階，曰：“如之何！”主人拜稽顙。賓吊者，眾賓之長也。反而亡焉，失之矣，於是為甚，故吊之。吊者北面，主人拜於位，不北面拜賓東者，以其亦主人位也。今文無曰。" }
      - { type: z, text: "“賓吊”至“稽顙”。○注“賓吊”至“無曰”。○釋曰：知賓吊是“眾賓之長”者，以其吊賓皆在堂下，今升堂釋詞，故知賓中為首者，賓之長也。雲“反而亡焉，失之矣，於是為甚”者，亦《檀弓》文，引之證周人反哭，而吊哀之甚也。雲“吊者北面”者，以經雲“賓吊者升自西階”，即雲曰“如之何”，不見吊者改面之文，明升堂北面可知。雲“主人拜於位”者，拜於西階上東面位，知者，以其上經主人升自西階東面，故知仍東面位也。雲“不北面拜賓東者，以其亦主人位也”者，《鄉飲酒》、《鄉射》主人酬賓，皆於賓東主人位，《特牲》、《少牢》助祭之賓，主人皆拜送於西階東面，故於東面不移，以其亦主人位故也。" }
      - { type: j, text: "賓降，出，主人送於門外，拜稽顙。" }
      - { type: z, text: "“賓降”至“稽顙”。○釋曰：此於《雜記》五賓當相見之賓，故鄭上注云“舉中焉”，明五賓皆依節而吊也。" }
      - { type: j, text: "遂適殯宮，皆如啟位，拾踴三。啟位，婦人入升堂，丈夫即中庭之位。" }
      - { type: z, text: "“遂適”至“踴三”。○注“啟位”至“即位”。○釋曰：案上《喪禮》朝夕哭位，雲婦人即位於堂，南上，主人堂下，直東序西面，啟殯時，雲主人位如初，又云主人入即位，則此主啟位，婦人亦即位於堂東面，主人即位於堂下，直東序西面。直東序西面，即中庭位也。" }
      - { type: j, text: "兄弟出，主人拜送。兄弟，小功以下也。異門大功，亦可以歸。" }
      - { type: z, text: "“兄弟”至“拜送”。○注“兄弟”至“以歸”。○釋曰：丈夫婦人在殯宮，拾踴既訖，兄弟入門者，出主人拜而送之。知“兄弟，小功以下也”者，此兄弟等，始死之時，皆來臨喪，殯訖，各歸其家，朝夕哭則就殯所，至葬開殯而來喪所，至此反哭，亦各歸其家，至虞卒祭，還來預焉，故《喪服小記》雲“緦小功，虞卒哭則皆免”是也。雲“異門大功，亦可以歸”者，大功以上，有同財之義，為異門則恩輕，故可歸也。" }
      - { type: j, text: "眾主人出門，哭止。闔門。主人揖眾主人，乃就次。次，倚廬也。" }
      - { type: z, text: "“眾主”至“就次”。○注“次倚廬也”。○釋曰：雲“眾主人出門”者，則主人拜送兄弟因在門外。雲“闔門”者，鬼神尚幽闇。雲“次，倚廬也”者，以未虞以前，仍依於初東壁下，倚木為廬，齊衰居堊室，大功張幃。《喪服傳》雲“既虞，柱楣，前屏”，此直雲倚廬，據主人斬衰者而言。" }
      - { type: j, text: "猶朝夕哭，不奠。是日也，以虞易奠。" }
      - { type: z, text: "“猶朝夕哭不奠”。○注“是日”至“易奠”。○釋曰：自啟殯已來常奠，今反哭，至殯宮猶朝夕哭，如前不奠耳。《檀弓》雲：“葬日虞，弗忍一日離也。是日也，以虞易奠。”故不奠也。" }
      - { type: j, text: "三虞。虞，喪祭名。虞，安也。骨肉歸於土，精氣無所不之，孝子為其彷徨，三祭以安之。朝葬，日中而虞，不忍一日離。" }
      - { type: z, text: "“三虞”。○注“虞喪”至“日離”。○釋曰：雲“虞，喪祭名、日中而虞，不忍一日離”，皆《檀弓》文。案彼雲：“葬日虞，弗忍一日離也。”又云：“卒哭曰成事，是日也，以吉祭易喪祭。”喪祭則三虞也。雲“虞，安也”者，主人孝子葬之時，送形而往，迎魂而返，恐魂神不安，故設三虞以安之。雲“骨肉歸於土，精氣無所不之”者，案《檀弓》雲：延陵季子葬其長子於嬴博之閒，既窆，左袒，右還其封，雲“骨肉歸復於土，命也。若魂氣則無不之”。是其骨肉歸於土，精氣無所不之之事。言此者，欲見迎魂而返，以虞祭安之，是以鄭雲“孝子為其彷徨，三祭以安之”。雲“朝葬，日中而虞”，即《檀弓》所云：“葬日虞，弗忍一日離。”又下《士虞記》亦云“日中而行事”是也。" }
      - { type: j, text: "卒哭。卒哭，三虞之後祭名。始朝夕之閒，哀至則哭。至此祭，止也。朝夕哭而已。" }
      - { type: z, text: "“卒哭”。○注“卒哭”至“而已”。○釋曰：雲“卒哭，三虞之後祭名”者，三虞者，再虞用柔日，後虞改用剛日，又隔柔日，卒哭用剛日，故云卒哭三虞之後祭名也。雲“始朝夕之閒，哀至則哭。至此祭，止也”者，始死，主人哭不絕聲；小斂之後，以親代哭，亦不絕聲；至殯後，主人在廬，廬中思憶則哭，又有朝夕於阼階下哭；至此為卒哭，祭唯有朝夕哭而已，言其哀殺也。然則喪有三無時哭者，始死至殯，哭不絕聲，一無時；既殯廬中，思憶則哭，二無時；卒哭祭後，唯有朝夕哭，為有時，至練祭之後，又止朝夕哭，唯有堊室之中，或十日，或五日一哭，通前為三無時之哭也。是以《檀弓》雲：“哭無時，使必知其反也。”是據練後哭無時也。" }
      - { type: j, text: "明日，以其班祔。班，次也。祔，卒哭之明日祭名。祔猶屬也。祭昭穆之次而屬之。今文班為胖。" }
      - { type: z, text: "“明日以其班祔”。○注“班次”至“為胖”。○釋曰：雲“班，次也”者，謂昭穆之次第。雲“祔，卒哭之明日祭名”者，以卒哭用剛日，祔用柔日，是以下《士虞記》雲“卒哭祭”，即雲“明日以其班祔”，故云卒哭之明日祭名。雲“祔猶屬也，祭昭穆之次而屬之”者，以其孫祔於祖，孫與祖昭穆同，故以孫連屬於祖，而就祖而祭之也。" }
      - { type: j, text: "記。" }
      - { type: z, text: "“記”。○釋曰：凡記者，皆是經不具，記之使充經，文理備足也。" }
      - { type: j, text: "士處適寢，寢東首於北墉下。將有疾，乃寢於適室。今文處為居，於為於。" }
      - { type: z, text: "“士處”至“墉下”。○注“將有”至“為於”。○釋曰：雲“將有疾，乃寢於適室”者，以《士喪》篇首雲士“死於適室”，此記雲適寢者，適室一也，故互見其文。若不疾，則在燕寢。將有疾，乃寢臥於適室，故變室為寢也。雲“東首”者，鄉生氣之所。雲“墉下”者，墉謂之牆，《喪大記》謂之北牖下，必在北墉下，亦取十一月一陽生於北，生氣之始故也。《士喪禮》論其死事，故不雲疾。此記人記其不備，凡人死皆因疾，故記其疾之所在也。" }
      - { type: j, text: "有疾，疾者齊。正情性也。適寢者，不齊不居其室。" }
      - { type: z, text: "“有疾疾者齊”。○注“正情”至“其室”。○釋曰：雲“有疾”者，既有疾，當齊戒正情性故也。雲“適寢者，不齊不居其室”者，案《鄉黨》孔子齊居必遷坐，又《祭義》雲“致齊於內，散齊於外”，皆在適寢。但散齊得鄉外，故云於外耳，是其齊居適寢也。" }
      - { type: j, text: "養者皆齊。憂也。" }
      - { type: z, text: "“養者皆齊”。○注“憂也”。○釋曰：案《曲禮》雲：“父母有疾，冠者不櫛，行不翔，笑不至矧，怒不至詈，不飲酒食肉，疾止復。”故男女養疾，皆齊戒正情性也。" }
      - { type: j, text: "徹琴瑟。去樂。" }
      - { type: z, text: "“徹琴瑟”。○注“去樂”。○釋曰：君子無大故，琴瑟不離其側。今以父母有疾，憂不在於樂，故去之。案《喪大記》雲：“疾病，內外皆掃，君大夫徹縣，士去琴瑟。”注云：“凡樂器，天子宮縣，諸侯軒縣，大夫判縣，士特縣。去琴瑟者，不命之士。”亦謂子男之士不命者也。" }
      - { type: j, text: "疾病，外內皆掃。為有賓客來問也。疾甚曰病。" }
      - { type: z, text: "“疾病外內皆掃”。○注“為有”至“曰病”。○釋曰：雲“疾甚曰病”者，則外內皆掃，為賓客來問疾，自絜清也。" }
      - { type: j, text: "徹褻衣，加新衣。故衣垢汙，為來人穢惡之。" }
      - { type: z, text: "“徹褻衣加新衣”。○注“故衣”至“惡之”。○釋曰：此文承疾病者及養病者，則徹褻衣據死者而言，則生者亦去故衣服新衣矣。“徹褻衣”，謂故玄端已有垢汙，故來人穢惡，是以徹去之。“加新衣”者，謂更加新朝服。《喪大記》亦云：“徹褻衣，加新衣。”鄭注云：“徹褻衣，則所加者新朝服矣，互言之也。加朝服者，明其終於正也。”互者，褻衣是玄端，新衣是朝服。朝服言新，則褻衣是故，玄端言褻，朝服是絜，不褻矣。各舉一邊而言，明皆有兼也。必知褻衣是玄端，新衣是朝服者，案《司服》士之齊戒服玄端，則疾者與養疾者皆齊，明服玄端矣。《檀弓》雲：“始死，羔裘玄冠者，易之而已。”羔裘玄冠，即朝服。故知臨死所著新衣，則朝服也，故鄭雲終於正也。" }
      - { type: j, text: "御者四人，皆坐持體。為不能自轉側。御者，今時侍從之人。" }
      - { type: z, text: "“御者”至“持體”。○注“為不”至“之人”。○釋曰：案《喪大記》雲“體一人”，注云：“為其不能自伸屈也。”若然，四體各一人，亦為不能自轉側。《詩》雲“輾轉反側”，據身，雲不能自屈伸，據手足，二文相兼乃具。雲“御者，今時侍從之人”者，士雖無臣，亦有侍御僕從之人，終於其手也。" }
      - { type: j, text: "屬纊，以俟絕氣。有其氣微難節也。纊，新絮。" }
      - { type: z, text: "“屬纊以俟絕氣”。○注“有其”至“新絮”。○釋曰：案《喪大記》注云：“纊，今之新綿，易動搖，置口鼻之上以為候。”亦二注相兼乃具。雲“纊，新絮”，即新綿。《禹貢》豫州貢纖、纊，明纊新綿也。" }
      - { type: j, text: "男子不絕於婦人之手，婦人不絕於男子之手。備褻。" }
      - { type: z, text: "“男子”至“之手”。○注“備褻”。○釋曰：案《喪大記》注云：“君子重終，為其相褻。”若然，疾時使御者持體，並死於其手。若婦人則內御者，持體還死於其手。故《喪大記》雲：“其母之喪，則內御者抗衾而浴。”僖三十三年冬，公薨於小寢，《左氏傳》曰“即安”，服注云：“小寢，夫人寢也。”禮，男子不絕於婦人之手，今僖公薨於小寢，譏其近女室，是男子不絕於婦人之手，備褻也。" }
      - { type: j, text: "乃行禱於五祀。盡孝子之情。五祀，博言之。士二祀，曰門，曰行。" }
      - { type: z, text: "“乃行禱於五祀”。○注“盡孝”至“曰行”。○釋曰：雲“盡孝子之情”者，死期已至，必不可求生，但盡孝子之情，故乃行禱五祀，望祐助病者，使之不死也。雲“五祀，博言之。士二祀，曰門曰行”者，《祭法》文。今禱五祀，是廣博言之，望助之者眾，其言五祀，則與諸侯五祀同，則《祭法》雲“諸侯五祀”是也。" }
      - { type: j, text: "乃卒。卒，終也。" }
      - { type: z, text: "“乃卒”。○注“卒終也”。○釋曰：自此盡“遷屍”，論上篇始死遷屍於南牖之事。《曲禮》與《爾雅》皆雲“大夫曰卒，士曰不祿”，今士不言不祿，而云“卒”者，義取君子曰終，小人曰死，故鄭雲“卒，終也”，美言之，使與大夫同稱也。" }
      - { type: j, text: "主人啼，兄弟哭。哀有甚有否，於是始去笄纚，服深衣。《檀弓》曰：“始死，羔裘玄冠者易之。”" }
      - { type: z, text: "“主人啼兄弟哭”。○注“哀有”至“易之”。○釋曰：雲“哀有甚有否”者，啼即泣也。《檀弓》雲高柴“泣血三年”，注云：“言泣，無聲，如血出。”則啼是哀之甚，發聲則氣竭，而息之聲不委曲，若往而不反。對齊衰以下，直哭無啼，是其否也。知“於是始去笄纚，服深衣”者，《禮記·問喪》雲：“親始死，雞斯徒跣，扱上衽。”注云：“雞斯，當為笄纚。”上衽深衣之裳，前是其親始死，笄纚服深衣也。引《檀弓》者，證服深衣，易去朝服之事也。" }
      - { type: j, text: "設床笫，當牖。衽，下莞上簞。設枕。病卒之閒廢床，至是設之，事相變。衽，臥席，古文策為茨。" }
      - { type: z, text: "“設床”至“設枕”。○注“病卒”至“為茨”。○釋曰：經直雲士“死於適室，幠用斂衾”，不雲此等之事，故記人言之也。雲“病卒之閒廢床，至是設之”者，《喪大記》雲：“疾病，寢東首於北牖下，廢床。”是其始死，亦因在地無床，復而不蘇，乃設床於南牖下，有枕蓆，是病卒之閒廢床，於是設之。雲“事相變”者，謂疾病時去床，既死設床，是生死事相變也。“衽，臥席”者，《曲禮》雲：“請席何鄉，請衽何趾。”鄭雲：“坐問鄉，臥問趾，因於陰陽。”是衽為臥席。《昏禮》注云：“衽，臥席也。”" }
      - { type: j, text: "遷屍。徙於牖下也，於是幠用斂衾。" }
      - { type: z, text: "“遷屍”。○注“徙於”至“斂衾”。○釋曰：雲“徙於牖下”者，即上文“床笫當牖”者也。於是幠用斂衾者，釋《士喪禮》“幠用斂衾”之時節也。" }
      - { type: j, text: "復者朝服，左執領，右執要，招而左。衣朝服，服未可以變。" }
      - { type: z, text: "“復者”至“而左”。○注“衣朝”至“以變”。○釋曰：雲“招而左”者，以左手執領，還以左手以領招之。必用左者，招魂所以求生，左陽，陽主生，故用左也。“復者”，士之有司，著朝服。“左執領”，謂爵弁服也。雲“衣朝服，服未可以變”者，謂始死，未可以變之服凶服，以其復所以求生故也。《喪大記》“小臣復，復者朝服”，彼言小臣，據君，則上下尊卑復者，皆朝服也。" }
      - { type: j, text: "楔，貌如軛，上兩末。事便也。今文軛作厄。" }
      - { type: z, text: "“楔貌”至“兩末”。○注“事便”至“作厄”。○釋曰：雲“如軛”者，軛謂馬鞅，軛馬領亦上兩末，令以屈處入口，取出時易，故鄭雲“事便也”。此用柶，異於吉時所用也。" }
      - { type: j, text: "綴足用燕几，校在南，御者坐持之。校，脛也。屍南首，凡脛在南以拘足，則不得闢戾矣。古文校為枝。" }
      - { type: z, text: "“綴足”至“持之”。○注“校脛”至“為枝”。○釋曰：雲“幾脛在南以拘足，則不得闢戾矣”者，古者凡兩頭各施兩足，今以夾則豎用之，屍南首，足鄉北，故以幾腳鄉南以夾足。恐幾欹側，故使生存侍御者一人坐持夾之，使足不闢戾，可以著屨也。" }
      - { type: j, text: "即床而奠，當腢，用吉器。若醴，若酒，無巾、柶。腢，肩頭也。用吉器，器未變也。或卒無醴，用新酒。" }
      - { type: z, text: "“即床”至“巾柶”。○注“腢肩”至“新酒”。○釋曰：即，就也，謂就屍床而設之。屍南首則在床東，當屍肩頭也。此即《檀弓》雲：“始死之奠，其餘閣也與？”雲“用吉器，器未變也”者，謂未忍異於生，故未變。至小斂奠，則變毼豆之等，為變矣。雲“或卒無醴，用新酒”者，釋經“若醴若酒”，科有其一，不得並有之事。以其始死，卒未有醴，則用新酒。若然，醴酒俱有，容有醴則用之，不更用酒，以其始死不備故也。若小斂以後，則酒醴具設，甒二，醴、酒是也。" }
      - { type: j, text: "赴曰：“君之臣某死。”赴母、妻、長子則曰：“君之臣某之某死。”赴，走告也。今文赴作訃。" }
      - { type: z, text: "“赴曰”至“某死”。○注“赴走”至“作訃”。○釋曰：雲“母妻長子則曰君之臣某之某死”者，上某是士名，下某是母妻長子。假令長子，則雲長子某甲，母、妻則婦人不以名行，直雲母與妻也。雲“赴，走告也”者，言赴，取急疾之意，故云赴走告也。雲“今文赴作訃”者，《雜記》作訃者，義取以言語相通，亦一塗也。" }
      - { type: j, text: "室中，唯主人、主婦坐。兄弟有命夫、命婦在焉，亦坐。別尊卑也。" }
      - { type: z, text: "“室中”至“亦坐”。○注“別尊卑也”。○釋曰：雲“兄弟有命夫命婦在焉，亦坐”者，若無命夫、命婦，則皆立可知。此《士喪禮》，故鄭雲“別尊卑也”，尊謂命夫、命婦。案《大記》君之喪，主人、主婦坐，以外皆立；若大夫喪，主人、主婦、命夫、命婦皆坐，以外皆立也；士之喪，主人父、兄、主婦姑姊妹皆坐，鄭雲：“士賤，同宗尊卑皆坐。”此命夫、命婦之外立而不坐者，此謂有命夫、命婦來，兄弟為士者則立，若命夫、命婦，則同宗皆坐也。" }
      - { type: j, text: "屍在室，有君命，眾主人不出。不二主。" }
      - { type: z, text: "“屍在”至“不出”。○注“不二主”。○釋曰：經直雲“主人唯君命出”，不言眾主人，故記人辨之。雲“眾主人不出”，在屍東耳。雲“不二主”者，《曾子問》雲“喪有二孤，廟有二主”為非禮。不雲“不二孤”，而云“不二主”者，彼廟主與喪孤相對，此孤不對廟主，孤亦是喪主，故以主言之也。" }
      - { type: j, text: "襚者委衣於床，不坐。床高由便。" }
      - { type: z, text: "“襚者”至“不坐”。○注“床高由便”。○釋曰：雲“床高由便”者，《曲禮》雲：“授立不跪，授坐不立。”此委衣於床者，不坐，委之以床高，亦如授立不坐之義，故云由便也。" }
      - { type: j, text: "其襚於室，戶西北面致命。始死時也。" }
      - { type: z, text: "“其襚”至“致命”。○注“始死時也”。○釋曰：雲“始死時”者，謂未小斂之前，屍在室中戶西，故北面致命。若小斂之後，奉屍夷於堂，則中庭北面致命。" }
      - { type: j, text: "夏祝淅米，差盛之。差，擇之。" }
      - { type: z, text: "“夏祝”至“盛之”。○注“差擇之”。○釋曰：經直雲“祝淅米於堂南面，用盆”，不言夏與盛之，故記人言之。" }
      - { type: j, text: "御者四人，抗衾而浴，襢笫。抗衾，為其倮裎蔽之也。襢，袒也。袒簀，去席，盝水便。其母之喪，則內御者浴，鬠無笄。內御，女御也。無笄，猶丈夫之不冠也。" }
      - { type: z, text: "注“內御”至“冠也”。○釋曰：雲“內御，女御”者，以婦人稱內，故以女御為內御。婦人不死男子之手，故知內御女御也。天子八十一御妻亦曰女御，與此別也。雲“無笄猶丈夫之不冠也”者，《喪服小記》雲：“男子冠而婦人笄。”《士喪禮》：“男子免不冠。”此雲婦人不笄，與男子不冠同，故云猶丈夫不冠也。" }
      - { type: j, text: "設明衣，婦人則設中帶。中帶，若今之襌襂。" }
      - { type: z, text: "“設明”至“中帶”。○注“中帶”至“襌襂”。○釋曰：經直雲“設明衣”，不辨男子與婦人，故此記人云設明衣者男子，其婦人則設中帶。鄭雲“中帶若今襌襂”者，鄭舉目驗而言，但男子明衣之狀，鄭不明言，亦當與中帶相類，有不同之處，故別。雖名中帶，亦號明衣，取其圭絜也。" }
      - { type: j, text: "卒洗，貝反於笲，實貝，柱右齻、左齻。象齒堅。" }
      - { type: z, text: "“卒洗”至“左齻”。○注“象齒堅”。○釋曰：經直雲“實貝於屍左右及中”，不言遠近，故記人辨之。雲“右齻左齻”，謂牙兩畔最長者，象生時齒堅也。" }
      - { type: j, text: "夏祝徹餘飯。徹去鬻。" }
      - { type: z, text: "“夏祝徹餘飯”。○釋曰：經不言“夏祝徹”，故記人記之。" }
      - { type: j, text: "瑱塞耳。塞，充窒。" }
      - { type: z, text: "“瑱塞耳”。○釋曰：經直雲“瑱用白纊用掩之”，不雲“塞耳”，恐同生人縣於耳旁，故記人言之也。" }
      - { type: j, text: "掘坎，南順，廣尺，輪二尺，深三尺，南其壤。南順，統於堂。輪，從也。今文掘為坅也。" }
      - { type: z, text: "“掘坎”至“其壤”。○釋曰：經直雲“甸人掘坎於階閒”，不辨大小，故記人明之。" }
      - { type: j, text: "垼用塊。塊，堛也。古文垼為役。" }
      - { type: z, text: "注“塊堛也”。○釋曰：雲“塊，堛”者，《爾雅·釋言》文。孫氏雲：堛，土塊也。" }
      - { type: j, text: "明衣裳用幕布，袂屬幅，長下膝。幕布，帷幕之布，升數未聞也。屬幅，不削幅也。長下膝，又有裳，於蔽下體深也。" }
      - { type: z, text: "“明衣”至“下膝”。○注“幕布”至“深也”。○釋曰：雲“明衣裳用幕布”，則衣裳同用幕布。雲“袂屬幅，長下膝”者，唯據衣而言，以其下別雲裳故也。雲“幕布，帷幕之布”者，《周禮·幕人》雲“掌帷幕幄帟綬”，鄭雲：“帷幕皆以布為之，幄帟皆以繒為之。”以其帷幕所以張之於外，恐不相勝舉，故須用布。鄭亦取此文用幕布為義也，故此雲帷幕之布。雲“升數未聞”者，以其不雲疏布，直雲幕布，故云未聞也。雲“屬幅，不削幅”者，布幅二尺二寸，凡用布，皆削去邊幅旁一寸，為二寸計之，則此不削幅，謂繚使相著，還以袂二尺二寸。雲“長下膝”者，謂為此衣長至膝下。雲“又有裳，於蔽下體深”者，凡平為衣，以其有裳，故不至膝下，此又有裳，而言膝下，故云於蔽下體深也。蔽下體，解此經衣至膝下也。" }
      - { type: j, text: "有前後裳，不闢，長及觳。不闢，質也。觳，足跗也。凡他服，短無見膚，長無被土。" }
      - { type: z, text: "“有前”至“及觳”。○注“不闢”至“被土”。○釋曰：雲“不闢，質也”者，以其凡男子，裳不連衣，故皆前三幅，後四幅。闢積其要閒，示文。今此亦前三後四，不闢積者，以其一服不動，不假上狹下寬也。雲“凡他服，短無見膚，長無被土”者，他服謂深衣，《深衣》雲：“短毋見膚。”注云：“衣取蔽形。”又云：“長無被土。”注云“為汙辱”是也。此裳及觳，至足跗亦是不被土，故引為證也。" }
      - { type: j, text: "縓綼緆。一染謂之縓，今紅也。飾裳在幅曰綼，在下曰緆。" }
      - { type: z, text: "“縓綼緆”。○注“一染”至“曰緆”。○釋曰：雲“一染謂之縓”者，《爾雅》文。謂一入赤汁染之，即漢時紅，故舉以為況也。雲“飾裳在幅曰綼”者，案《深衣》雲：“純袂，緣純邊。”注云：“純謂緣之也。緣邊，衣裳之側。廣各寸半，則表裏共三寸矣。”此在幅亦衣裳之側，緣法如彼也。" }
      - { type: j, text: "緇純。七入為緇。緇，黑也。飾衣曰純，謂領與袂，衣以緇，裳以縓，象天地也。設握，裏親膚，系鉤中指，結於。，掌後節中也。手無決者，以握系一端繞，還從上自貫，反與其一端結之。" }
      - { type: z, text: "“設握”至“於”。○注“掌”至“結之”。○釋曰：手無決者，以其經已雲設握麗於與決運結，據右手有決者，不言左手無決者，故記之雲“以握系一端繞，還從上自貫，反與其一端結之”者，案上文握手用玄，纁裏，長尺二寸，今裏親膚，據從手內置之，長尺二寸，十掩之手才相對也。兩端各有系，先以一端繞一匝，還從上自貫，又以一端鄉上鉤中指，反與繞者結於掌後節中。" }
      - { type: j, text: "甸人築坅坎。築，實土其中，堅之。穿坎之名，一曰坅。" }
      - { type: z, text: "“甸人築坅坎”。○注“築實”至“曰坅”。○釋曰：經直雲“甸人掘坎”，不雲還使甸人築，故記人明之，還使甸人築之也。" }
      - { type: j, text: "隸人廁。隸人，罪人也。今之徒役作者也。，塞也，為人復往褻之，又亦鬼神不用。" }
      - { type: z, text: "“隸人廁”。○注“隸人”至“不用”。○釋曰：知“隸人，罪人”者，案《周禮·司厲職》雲：“其奴，男子入於罪隸。”則中國罪人對夷隸蠻隸、貉隸之等，是徵四夷所得也，故鄭舉漢法，今之徒役作者也。雲“為人復往褻之，又亦鬼神不用”者，若然，古者非直不共逼浴，亦不共廁，故得雲死者不用也。" }
      - { type: j, text: "既襲，宵為燎於中庭。宵，夜。" }
      - { type: z, text: "“既襲”至“中庭”。○釋曰：士之喪，死日而襲，經不雲中庭設燎，故記明之也。" }
      - { type: j, text: "厥明，滅燎，陳衣。記節。" }
      - { type: z, text: "“厥明滅燎陳衣”。○注“記節”。○釋曰：雲“記節”者，為小斂陳衣，當襲之，明旦滅燎之時，故記節。正經不雲，故記人以明之也。" }
      - { type: j, text: "凡絞紟用布，倫如朝服。凡，凡小斂大斂也。倫，比也。今文無紟，古文倫為輪。" }
      - { type: z, text: "“凡絞”至“朝服”。○注“凡凡”至“為輪”。○釋曰：言“凡”，非一之言，以其唯小斂至大斂有絞，大斂又有紟，故知凡中有大、小斂也。言類如朝服者，《雜記》雲“朝服十五升”是也。" }
      - { type: j, text: "《儀禮註疏》" }
