# 毛詩正義卷20（孔穎達疏）：j 為經文＋毛亨傳、鄭玄箋，z 為疏文。
sections:
  - id: juan20
    name: 正文
    blocks:
      - { type: j, text: "《長髮》，大禘也。大禘，郊祭天也。《禮記》曰“王者禘其祖之所自出，以其祖配之”是謂也。○長如字。禘，大計反。王雲：“殷祭也。”王者，於況反，又如字。" }
      - { type: z, text: "“《長髮》七章，首章八句，次四章章七句，一章九句，卒章六句”。○正義曰：《長髮》詩者，大禘之樂歌也。禘者，祭天之名，謂殷王高宗之時，以正歲之正月，祭其所感之帝於南郊。詩人因其祭也。而歌此詩焉。經陳洪水之時，已有將王之兆。玄王政教大行，相土威服海外。至於成湯，受天明命，誅除元惡，王有天下，又得賢臣為之輔佐。此皆天之所祐，故歌詠天德，因此大禘而為頌，故言大禘以總之。經無高宗之事，而為高宗之頌者，以高宗禘祭得禮，因美之而為此頌，故為高宗之詩。但作者主言天德，止述商有天下之由，故其言不及高宗，此則鄭之意耳。王肅以大禘為殷祭，謂禘祭宗廟，非祭天也。毛氏既無明訓，未知意與誰同。○箋“大禘”至“是謂”。○正義曰：《祭法》雲：“殷人禘嚳而郊冥。”注云：“禘，謂冬至祭天於圓丘。”則圓丘之祭名為禘也。又《王制》及《祭統》言四時祭名，“春礿，夏禘，秋嘗，冬烝”。注云：“蓋夏殷制。”則殷之夏祭宗廟亦名禘也。又鄭《駁異義》雲：“三年一祫，五年一禘，百王通義。”以為《禮讖》雲“殷之五年殷祭”亦名禘也。然則祭之名禘者多矣，而知此大禘為郊祭天者，以冬至為祭，乃是天皇大帝，神之最尊者也，為萬物之所宗，人神之所主，非於別代異姓曲有感助。經稱“帝立子生商”，謂感生之帝，非天皇大帝也。且《周頌》所詠，靡神不舉，皆無圓丘之祭。殷人何獨舍其感生之帝，而遠述昊天上帝乎？以此知非圓丘之禘也。時祭所及，親廟與太祖而已，而此經歷言玄王相土，非時祭所及，又非宗廟夏禘也。五年殷禘，鄭於《禘祫志》推之，以為禘祭各就其廟。今此篇上述商國所興之由，歷陳前世有功之祖，非是各就其廟之言。以此又知非五年殷祭之禘也。彼諸禘者，皆非此篇之義，故知此雲大禘，唯是郊祭天耳。祭天南郊，亦名為禘，故引《禮記》以證之。所引者，《喪服小記》及《大傳》皆有此文。《大傳》注云：“凡大祭曰禘。自，由也。祭其先祖所由生，謂郊祀天也。王者之先祖，皆感太微五帝之精以生，蒼則靈威仰，赤則赤熛怒，黃則含樞紐，白則白招拒，黑則汁光紀。皆用正歲之正月郊祭之，蓋特尊焉。《孝經》曰‘郊祀后稷以配天’，配靈威仰也；‘宗祀文王於明堂以配上帝’謂汎配五帝也。”如彼注，則殷人之祖出於汁光紀，故以正歲正月於郊禘而祭之，故此序謂之大禘也。《易緯》稱“三王之郊，一用夏正”，故知郊天皆用正歲正月也。《鄭志》趙商問：“此雲案《祭法》‘殷人禘嚳而郊冥’，又《喪服小記》及《大傳》皆雲‘王者禘其祖之所自出，以其祖配之’，注皆以為祭天皇大帝，以嚳配之。然則此詩之禘，亦宜以為圜丘之祭，不審雲郊何？”答曰：“郊祀后稷以配天，則以祖配，其祖從出之明文也。雲注皆以為祭天皇大帝，詩之大禘宜為圓丘之祭，探意大過，得無誣乎？禘者，祭名，天人共雲。”是鄭解此禘為郊天之事也。《小記》、《大傳》言禘祖之所自出者，注皆以為郊所感之帝，而商雲祭天皇大帝，故云得無誣乎。《祭法》稱殷人禘嚳而郊冥，此若郊天，當以冥配。而不言冥者，此因祭天，歌詠天德，言其能降靈氣，祐殷興耳。其意不述祭時之事，不美所配之人。《昊天有成命》“郊祀天地”，亦是南郊之祭，而辭不及稷，何怪此篇不言冥也？馬昭雲：“《長髮》，大禘者，宋為殷後，郊祭天以契配。不郊冥者，異於先王，故其詩詠契之德。宋無圓丘之禮，唯以郊為大祭，且欲別之於夏禘，故云大禘。”此說非也。何則？名曰《商頌》，是商世之頌，非宋人之詩，安得雲“宋郊，契配”也？《譜》稱“三王有受命中興之功，時有作詩頌之”者，則是殷時作之，理在不惑。而云宋人郊天，虛妄何甚！而馬昭雖出鄭門，其言非鄭意也。若然，《商》非宋詩，而《樂記》雲：“溫良而能斷者宜歌《商》。”注云：“‘《商》，宋詩’者，以宋承商後，得歌《商頌》，非謂宋人作之也。”" }
      - { type: j, text: "濬哲維商，長髮其祥。洪水芒芒，禹敷下土方。外大國是疆，幅隕既長。濬，深。洪，大也。諸夏為外幅廣也。隕，均也。箋雲：長，猶久也。隕當作“圓”。圓，謂周也。深知乎維商家之德也，久發見其禎祥矣。乃用洪水，禹敷下土，正四方，定諸夏，廣大其竟界之時，始有王天下之萌兆，歷虞、夏之世，故為久也。○濬音峻。悊音哲，字或作“哲”。芒音亡，依韻音忙。疆，居良反。竟，界也。幅，方目反。隕音圓，徐於貧反。夏，戶雅反。下皆同。圜音還，又音圓。知音智。見，賢遍反。禎音貞，祥也。竟音境。王天下，於況反。下“湯王”、“言王之”、“王德”皆同。" }
      - { type: j, text: "有娀方將，帝立子生商。有娀，契母也。將，大也。契生商也。箋雲：帝，黑帝也。禹敷下土之時，有娀氏之國亦始廣大。有女簡狄，吞鳦卵而生契，堯封之於商，後湯王因以為天下號，故云“帝立子生商”。" }
      - { type: z, text: "“濬哲”至“生商”。○毛以為，有深智者維我商家之德也。昔在前世，久發見其禎祥矣。其祥之見在何時乎？往者唐堯之末，有大水芒芒然，有大禹者敷廣下土，以正四方，京師之外，大國於是畫其疆境，令使中國廣大均平，既已長遠矣。於是時，契已佐禹，是其禎祥久見也。又說商興之由。有娀氏之女，方欲長大之時，天為之生立其子，而使之生商。謂上天祐契，使賢而生有商國也。○鄭以隕為圓，言中國廣大而圓周也。有娀方將，謂有娀之國方始廣大。黑帝憑依簡狄，使之有子，立其子使生商國。其文義略同。○傳“濬深”至“隕均”。○正義曰：“濬，深”，《釋言》文。“洪，大”，《釋詁》文。諸夏為外，對京師為內也。幅，如布帛之幅，故為廣也。王肅雲：“外諸夏大國也。京師為內，諸夏為外。言禹外畫九州境界，內平治水土，中國既廣，已平均且長也。”○箋“隕當”至“為久”。○正義曰：箋雲“深智乎維商家之德”者，總歎商家深智，不指斥一人也。禹敷下土，廣大其境界之時，正謂水害既除，輔成五服之時也。始有王天下之萌兆，謂契能佐禹治水，敬敷五教，功被當世，故後嗣克昌，是其王之萌兆也。爾時已有萌兆，即是久見其祥。比至成湯之興，歷虞、夏之世，故為久也。○傳“有娀”至“生商”。○正義曰：有娀，契母之姓，婦人以姓為字，故云“有娀，契母也”。“將，大”，《釋詁》文。謂契母方成大之時，天為生立其子商者。成湯，王天下一代之大號。此商之有天下，其本由契而來，故言契生商也。詩言商興所由，止須言契而已。上句乃述禹敷下土者，以契、禹俱事帝堯，皆有大功，故將欲論契，先言洪水也。○箋“帝黑”至“廣大”。○正義曰：禘者，郊天之名，郊祭所感之帝。商是水德黑帝之精，故云“黑帝”，謂汁光紀也。且以下雲“玄王”，故以黑帝言之。以有娀是簡狄國名，非簡狄之身，言“有娀方將”，不得為簡狄長大，故以為禹敷下土之時，有娀氏之國亦始廣大也。有娀氏國之大小，非復商家之事，而言及之者，君子言人之美，務欲加之，因其國實廣大，見簡狄為大國之女，猶《大明》之篇言摯莘也。" }
      - { type: j, text: "玄王桓撥，受小國是達，受大國是達。率履不越，遂視既發。玄王，契也。桓，大。撥，治。履，禮也。箋雲：承黑帝而立子，故謂契為玄王。遂猶徧也。發，行也。玄王廣大其政治，始堯封之商，為小國，舜之末年，乃益其土地為大國，皆能達其教令。使其民循禮，不得逾越，乃徧省視之，教令則盡行也。○撥，本末反，《韓詩》作“發”。發，明也。徧音遍。下同。治，直吏反。" }
      - { type: z, text: "傳“玄王”至“履禮”。○正義曰：上言有娀生子，此句即言玄王，故知玄王即契也。且《國語》雲：“玄王勤商，十四世而興。”玄王為契明矣。“履，禮”，《釋言》文。《公羊傳》雲：“撥亂世。”謂治亂世，故以撥為治也。○箋“承黑”至“盡行”。○正義曰：箋以契不為王，玄又非諡，解其稱玄王之意。玄，黑色之別。以其承黑帝立子，故謂契為玄王也。以湯有天下而稱王，契即湯之始祖，亦以王言之。《尚書·武成》雲：“昔先王后稷。”《國語》亦云：“昔我先王后稷。”又曰：“我先王不窋。”韋昭雲：“周之禘祫文、武，不先不窋，故通謂之王。《商頌》亦以契為玄王，是其為王之祖，故呼為王，非追號為王也。玄王廣大其政治，正謂達其教令。”是也。知堯封為小國，舜益為大國者，《中候握河紀》說堯雲：“斯封稷、契、皋陶，賜姓號。”是堯封之也。《考河命》說舜之事雲：“褒賜群臣，賞爵有功，稷、契、皋陶益土地。”是舜益地為大國也。自殷以上，大國百里。《握河紀》注云：“稷、契，公也。”公即周禮三公八命，其出封加一等。然則堯之封契，已應百里，便是土地之極。而舜又益之者，以其身有大功，特加褒賜，如周之賜魯、衛之屬，越禮特賜。既賜之後，不必止於百里而已。“率履不越”，文承“是達”之下，明民從政化，非契身率禮，故云“使其民循禮，不得逾越，徧省視之，教令則盡行”，即是達之驗也。" }
      - { type: j, text: "相土烈烈，海外有截。相土，契孫也。烈烈，威也。箋雲：截，整齊也。相土居夏後之世，承契之業，入為王官之伯，出長諸侯，其威武之盛烈烈然，四海之外率服截爾整齊。○相，息亮反。注“相土”皆同。截，才結反。長，張丈反。" }
      - { type: z, text: "箋“截整”至“整齊”。○正義曰：截者，斬斷之義，故為整齊也。相土是昭明之子，契之孫也，故云“居夏後之世，承契之業”。契封商國，相土嗣之，止為一國之君而已，不得威行海外。今雲“海外有截”，故知“入為王官之伯，出長諸侯”也。僖四年《左傳》管仲說太公為王官之伯雲：“五侯九伯，汝實徵之，以夾輔周室。”是王官之伯，分主東西，得徵其所職之方，故得雲“威武烈烈然，而四海之外截爾整齊”。分主東西，則威加一面而已，而云四海者，不知所主何方，故總舉四海言之。截然整齊，謂守其所職，不敢內侵外畔也。王肅雲：“相土能繼契，四海之外截然整齊而治，言有烈烈之威。則相土在夏為司馬之職，掌征伐也。說《春秋》者亦以太公為司馬之官，故得徵五侯九伯。”與鄭異也。" }
      - { type: j, text: "帝命不違，至於湯齊。至湯與天心齊。箋雲：帝命不違者，天之所以命契之事，世世行之，其德浸大，至於湯而當天心。○湯、齊如字。浸，子鴆反。" }
      - { type: j, text: "湯降不遲，聖敬日躋。昭假遲遲，上帝是祗。帝命式於九圍。不遲，言疾也。躋，升也。九圍，九州也。箋雲：降，下。假，暇。祗，敬。式，用也。湯之下士尊賢甚疾，其聖敬之德日進。然而以其德聰明寬暇天下之人遲遲然。言急於已而緩於人，天用是故愛敬之也。天於是又命之，使用事於天下。言王之也。○日躋，子兮反，鄭注《禮記》讀上為湯躋，讀此為日齋。齋，莊也。假，古雅反，鄭雲：“暇也。”徐雲：“毛音格，鄭音暇。”案王肅訓假為至，格是王音也。沈雲：“鄭箋雲寬暇，以此義訓，非改字也。”祗，諸時反。下士，遐嫁反。" }
      - { type: z, text: "“帝命”至“九圍”。○正義曰：上陳玄王相土，論商興所由。此下皆述成湯，指言興事。言天之所以命契之事，自契之後，世世行而不違失，天心雖已漸大，未能行同於天。至於成湯，而動合天意，然後與天心齊也。因說成湯之行。湯之下士尊賢，甚疾而不遲也。其聖明恭敬之德，日升而不退也。以其聰明寬暇天下之人，遲遲然而舒緩也。上天以是之故，常愛敬之，故天命之，使用事於九州，為天下王也。○傳“至湯與天心齊”。○正義曰：言至湯者，謂從契而至湯也。自契以後，雖則不違天命，未能齊於天心。至湯而與之齊，以為漸大之意也。上言帝命，即雲湯齊，故知湯所與齊，唯天心耳。《易》稱“聖人與天地合其德”，此之謂也。傳以此為湯齊，甚分明矣。而《孔子閒居》注云：“《詩》讀湯齊為湯躋者，言三家《詩》有讀為躋者也。”○箋“帝命”至“天心”。○正義曰：契無受命之事矣，而云天命契者，正謂授以上智之性，使之佐舜有功，建國於商，德垂後裔，是天所以命契之事也。湯以孤聖，獨興父祖，未有王跡，而云其德浸大者，以言至於湯齊，又為漸高之勢，故述其意，言浸大耳。定本作“浸”字。其實相土至湯，有令聞者，唯其冥勤其官而水死耳，其餘不能漸大也。○傳“躋升”至“九州”。○正義曰：“躋，升”，《釋詁》文。謂九州為九圍者，蓋以九分天下，各為九處規圍然，故謂之九圍也。○箋“降下”至“於人”。○正義曰：“降，下。式，用”，《釋言》文。“祗，敬”，《釋詁》文。假者，假借之義，故為暇也。湯為天子，而云湯降，故知下者是下士尊賢也。《晉語》宋公孫固說公子重耳之德，引此詩乃雲：“降，有禮之謂也。”是亦以此為下賢也。寬暇天下之人，謂不責人所不能，馭之舒緩也。待士則疾，馭下則舒，言其急於已而緩於人也。" }
      - { type: j, text: "受小球大球，為下國綴旒，何天之休。球，玉。綴，表。旒，章也。箋雲：綴，猶結也。旒，旌旗之垂者也。休，美也。湯既為天所命，則受小玉，謂尺二寸圭也。受大玉，謂珽也，長三尺。執圭搢珽，以與諸侯會同，結定其心，如旌旗之旒縿著焉。擔負天之美譽，為眾所歸鄉。○球音求，美玉也。下同。綴，陟劣反，徐又張衛反，毛雲“表也”，鄭雲“結也”。下同。休，虛虯反。珽，吐頂反。天子玉笏長三尺，杼上終葵首。長，直亮反。縿，所御反。著，直略反。鄉，本亦作“鄉”，許亮反。下篇同。" }
      - { type: j, text: "不競不絿，不剛不柔，敷政優優，百祿是遒。絿，急也。優優，和也。遒，聚也。箋雲：競，逐也。不逐，不與人爭前後。○絿音求，徐音虯。遒，子由反，又在由反。" }
      - { type: z, text: "“受小球”至“是遒”。○毛以為，上言用事九圍，此言用事之實。湯之用事也，受小球玉，謂尺二寸之鎮圭也，大球玉，謂三尺之珽也。受此二玉，以作天子，為下國諸侯之表章，能荷負天之美譽也。又述湯之行，能致美譽之由。湯之性行，不爭競，不急躁，不大剛猛，不大柔弱，舉事具得其中，敷陳政教則優優而和美，以此之故，百眾之祿於是聚而歸之。福祿聚歸，能荷之也。鄭唯下國綴旒為異。言湯受二玉，與諸侯而會同。諸侯心系天子，如旌旗之旒綴著於縿。餘同。○傳“球玉”至“旒章”。○正義曰：《禹貢》“雍州厥貢球琳琅玕”，是球為玉之名也。綴之為表，其訓未聞。冕之所垂，及旌旗之飾，皆謂之旒。旒者，所以章，明貴賤，故為章也。○箋“綴猶”至“著焉”。○正義曰：《內則》雲：“衣裳綻裂，紉箴請補綴。”是綴為連結之義也。又襄十六年《公羊》雲：“君若贅旒然。”言諸侯反系屬於大夫也。此言綴旒，文與彼同，明以旌旗為喻，故易傳以綴猶結也，旒為旌旗之垂也。《秋官·大行人》及《考工記》說旌旗之事，皆雲九旒、七旒。《爾雅》說旌旗雲“練旒九”。是旌旗垂者名為旒也。言受小玉、大玉者，此小玉、大玉是天子之器，非為天子不得執用。湯既為天所命，則得用之，是受之於天，故言受也。知小玉，謂尺二寸圭，大玉，謂珽長三尺者，《考工記·玉人》雲，“大圭長三尺，杼上終葵首，天子服之。鎮圭尺有二寸，天子守之”，所服所守，唯此二玉，故知也。《春官·典瑞》雲：“王搢大圭，執鎮圭，藻五采五就，以朝日。”《覲禮》雲：“天子乘龍，載大旂，象日月，升龍降龍。出拜日於東門之外，反祀方明。”注云：“此謂會同以春者也。”引《朝事儀》曰：“天子冕而執鎮圭尺有二寸，乘大輅，率諸侯朝日於東郊，所以教尊尊也。退而見諸侯。”由此而言，知朝日與諸侯會同，俱是執圭搢珽。今言受小玉、大玉，即云為下國綴旒，故知執圭搢珽與諸侯會同，結定其心，如旌旗之旒縿結著焉也。定本雲“如旌旗之縿旒著焉”此言執圭搢珽，而《玉人》雲“天子執冒四寸，以朝諸侯”者，此謂國外會同，彼謂在國受朝也，故《玉人》注云：“名玉曰冒者，言其德能覆冒天下也。四寸者，方以尊接卑，以小為貴。”是為在國受朝，下諸侯，故執冒也。" }
      - { type: j, text: "受小共大共，為下國駿厖，何天之龍。共，法。駿，大。厖，厚。龍，和也。箋雲：共，執也。小共、大共，猶所執搢小球、大球也。駿之言俊也。龍當作“寵”。寵，榮名之謂。○小共、大共，毛音恭，鄭音拱，執也。一雲“毛亦音拱”。駿音峻，鄭“俊也”。又一雲“毛亦作俊讀”。厖，莫邦反，徐雲“鄭音武講反”，是葉拱及寵韻也。龍，毛如字，鄭作“寵”。" }
      - { type: j, text: "敷奏其勇，不震不動，不戁不竦，百祿是緫。戁，恐。竦，懼也。箋雲：不震不動，不可驚憚也。○傅音孚，本亦作“敷”。戁，奴版反。竦，小勇反。緫，子孔反，本又作“鬷”，音宗。恐，曲勇反。憚，末丹反。" }
      - { type: z, text: "“受小”至“是緫”。○毛以為，此又言成湯之用事也。受小玉之法，受大玉之法，施之諸侯，成諸侯之性行，為下國之大純厚，能荷負天之和道也。又述成湯之行，能荷天之和道所由。湯之陳進其勇，不可震，不可動，不戁恐，不竦懼。所徵無敵，克平天下，百眾之祿於是總聚而歸之，故能荷天之和道也。○鄭以為，此又覆述上章，言湯受小玉而執之，受大玉而執之，執此二玉，與諸侯會同，為下國作英俊厚德之君，能荷負天之榮寵。餘同。○傳“共法”至“寵和”。○正義曰：傳讀共為恭敬之恭，故為法也。“駿，大。厖，厚”，《釋詁》文。龍之為和，其訓未聞。言小法、大法，正謂執圭搢珽，與諸侯為法也。言為下國大厚，謂成其志性，使大純厚也。王肅雲：“言湯為之立法，成下國之性，使之大厚，乃荷任天之和道也。”○箋“共執”至“之謂”。○正義曰：“拱，執”，《釋詁》文。以此章文類於上，玉必以手執之，故易傳以為小拱、大拱，猶所執搢小球、大球也。大球實搢之，而言執者，將搢亦執，故同言拱也。又以上言綴旒為諸侯之所系屬，則知此言駿厖亦是諸侯之言天子，故讀駿為俊，言成湯與諸侯作英俊厚德之君也。又荷天之龍，與上荷天之休，其文相值。休為美譽，則此宜為榮名，且韻宜為寵，故易之也。" }
      - { type: j, text: "武王載旆，有虔秉鉞，如火烈烈，則莫我敢曷。武王，湯也。旆，旗也。虔，固。曷，害也。箋雲：有之言又也。上既美其剛柔得中，勇毅不懼，於是有武功，有王德。及建旆興師出伐，又固持其鉞，志在誅有罪也。其威勢如猛火之炎熾，誰敢御害我。○旆，蒲具反。鉞音越。中，張仲反。苞有三櫱，莫遂莫達。九有有截，苞，本。櫱，餘也。箋雲：苞，豐也。天豐大先三正之後，世謂居以大國，行天子之禮樂，然而無有能以德自遂達於天者，故天下歸鄉湯，九州齊一截然。○櫱，五葛反，《韓詩》雲：“色也。”" }
      - { type: j, text: "韋顧既伐，昆吾夏桀。有韋國者，有顧國者，有昆吾國者。箋雲：韋，豕韋，彭姓也。顧、昆吾，皆己姓也。三國黨於桀惡。湯先伐韋、顧，克之。昆吾、夏桀則同時誅也。○韋、顧，二國名也。《漢書·古今人表》作“韋、鼓”。已音紀，又音杞。" }
      - { type: z, text: "“武王”至“夏桀”。○毛以為，上言成湯進勇，此述為勇之事。有有武功、有王德之成湯，載其旌旗，以出征伐，又能固執其鉞，志在誅殺有罪，其威勢嚴猛，如火之炎熾烈烈然，曾無於我成湯敢害之者。又述成湯得眾之由。克代既滅，封其支子為王者之後，猶樹木，既斬其根本，更有櫱生之條。言夏桀與二王之後，根本之上有三種櫱餘，承藉雖重，必無德行，莫有能以行申遂天意者，莫能以德自達於天者。天下諸國無所歸依，故九州諸侯截然齊整一而歸湯也。九州諸國既盡歸湯，唯有韋、顧、昆吾黨桀為惡，成湯於是恭行天罰。韋、顧二國既已伐之，又伐昆吾之與夏桀。群惡既盡，天下廓清，成湯於是乃即真為天子。○鄭唯以苞為豐，言天豐有三正之餘，使為大國而不能遂達，故九州歸湯。餘同。○傳“苞，本。櫱，餘”。○正義曰：《易》稱“系於苞桑”，謂桑本，故以苞為本。《盤庚》雲“若顛木之有由櫱”，謂本根已顛，更生枝餘，故云櫱餘也。言本有三餘，謂上世受命創基之君為之本，當時二王之後及今夏桀是其餘也。其意與箋言“三正之後”亦同。○箋“苞豐”至“截然”。○正義曰：“苞，豐”，《釋詁》文。以此詩之旨，言國之大者，不得天意，故使諸國一時歸湯。而云豐有三櫱，櫱者，樹木於根本之上更生枝餘之名，則知三櫱皆諸帝王之後也。《郊特牲》稱王者存二代之後，猶尊賢也。尊賢不過二代，則是先代有二，與今王為三也，故云“天豐大先三正之後，世謂居以大國，行天子之禮樂”也。三正者，謂夏與唐、虞也。正朔三而改，夏以建寅為正，則舜當以建子，堯當以建醜，是之謂三正也。桀為天子，與二王之後尊卑不類，但三者俱得行其正朔，故與桀同稱三也。以三者承藉餘緒，國大禮盛，宜為天下所歸，而不能以德自達，故天下歸湯，美湯以小國而得天意也。莫達，謂不能以德自達，則莫遂謂不能以行申遂天意也。○箋“韋豕”至“時誅”。○正義曰：《鄭語》雲：“祝融其後八姓，下歷數之，已姓昆吾、顧、溫，彭姓豕韋，則商滅之矣。”故知韋即豕韋，彭姓也。顧與昆吾皆己姓也。《鄭語》又云：“豕韋為商伯。”此已滅之，又得為商伯者，成湯伐之，不滅其國，故子孫得更興為伯也。為湯所伐，明與桀同心，故知三國黨於桀惡。昆吾、夏桀共文，在既伐之下，故知先伐韋、顧，克之。昆吾、夏桀則同時誅。昆吾與桀，亦是成湯伐之，而不言伐者，以上句言“既伐”，足明下句亦是伐。作文之體，句有所施，以其足相發明，不須更言伐也。《禮器》雲：“湯放桀，武王伐紂，時也。”則桀放而不誅。而云同時誅者，對則誅、放有異，散文則放之遠方，亦為誅也。昭十八年《左傳》雲：“二月乙卯，周毛得殺毛伯過。萇弘曰：‘毛得必亡。是昆吾稔之日也，侈故之以。’”言昆吾以乙卯日亡也。昆吾與桀同日誅，則桀亦以乙卯日亡也，故《檀弓》注云：“桀以乙卯亡。”則亡日必是乙卯，未知何月也。" }
      - { type: j, text: "昔在中葉，有震且業。允也天子，降予卿士。葉，世也。業，危也。箋雲：中世，謂相土也。震，猶威也。相土始有徵伐之威，以為子孫討惡之業。湯遵而興之。信也，天命而子之，下予之卿士。謂生賢佐也。《春秋傳》曰：“畏君之震，師徒橈敗。”○中如字，又張仲反。橈，女教反，一音女卯反，亂也。" }
      - { type: j, text: "實維阿衡，實左右商王。阿衡，伊尹也。左右，助也。箋雲：阿，倚。衡，平也。伊尹，湯所依倚而取平，故以為官名。商王，湯也。○左音佐。注同。右音又。注同。倚，於綺反。下同。" }
      - { type: z, text: "“昔在”至“商王”。○毛以為，既言成湯伐桀，又上本未興之時，及得臣之助。雲昔在中間之世，謂成湯之前，商為諸侯之國，有震懼而且危怖矣。至於成湯，乃有聖德。信也，上天子而愛之，下大賢之人予之，使為卿士。此卿士者，實為阿衡之官，實佐助我成湯，故能克桀而有天下。此皆上天之力，高宗祭又得禮，故因大禘之祭，述而歌也。○鄭以為，昔在中世，謂相土之時，有徵伐之威，且為子孫討惡之業，故成湯亦遵用其道。皇天子而愛之。餘同。○箋“中世”至“橈敗”。○正義曰：傳以業為危，則湯未興之前，國弱而危懼也。箋易之者，以此篇上述玄王相土，言至湯而齊於天心，則是自契以來，作漸盛之勢，不應於此方言上世衰弱，故易傳也。以上言相土烈烈威服海外，是相土有徵伐之威，為子孫討惡之業也。所引《春秋傳》者，成二年《左傳》文。引之者，證震得為威之義。○傳“阿衡”至“右助”。○正義曰：以言左右商王，則是功最大者。成湯佐命之臣，唯伊尹耳，故知阿衡是伊尹也。伊是其氏。尹，正也。言其能正天下，故謂之伊尹。阿衡則其官名也。《君奭》曰：“在昔成湯，既受命，時則有若伊尹，格於皇天。在太甲，時則有若保衡，格於上帝。”注云：“伊尹名摯，湯以為阿衡。至太甲改曰保衡。阿衡、保衡皆公官。”然則伊尹、摯、阿衡、保衡一人也。彼注阿衡為公官，此言卿士者，三公兼卿士也。" }
      - { type: j, text: "《長髮》七章，一章八句，四章章七句，一章九句，一章六句。" }
      - { type: j, text: "《殷武》，祀高宗也。" }
      - { type: z, text: "“《殷武》六章，首章六句，二章七句，三章五句，四章、五章章六句，卒章七句”至“高宗”。○正義曰：《殷武》詩者，祀高宗之樂歌也。高宗前世，殷道中衰，宮室不修，荊楚背叛。高宗有德，中興殷道，伐荊楚，修宮室。既崩之後，子孫美之。詩人追述其功而歌此詩也。經六章，首章言伐楚之功，二章言責楚之義，三章、四章、五章述其告曉荊楚，卒章言其修治寢廟，皆是高宗生存所行，故於祀而言之，以美高宗也。" }
      - { type: j, text: "撻彼殷武，奮伐荊楚。{罒米}入其阻，裒荊之旅，撻，疾意也。殷武，殷王武丁也。荊楚，荊州之楚國也。{罒米}，深。裒，聚也。箋雲：有鍾鼓曰伐。{罒米}，冒也。殷道衰而楚人叛，高宗撻然奮揚威武，出兵伐之，冒入其險阻，謂逾方城之隘，克其軍率，而俘虜其士眾。○撻，他達反，《韓詩》雲：“達也。”{罒米}，面規反，《說文》作“冞”，從內、米，雲：“冒也。”阻，莊呂反，險也。裒，蒲侯反。冒，莫報反。下同。隘，於懈反，窄也。俘音孚，囚也。" }
      - { type: j, text: "有截其所，湯孫之緒。箋雲：緒，業也。所，猶處也。高宗所伐之處，國邑皆服其罪，更自敕整截然齊壹，是乃湯孫大甲之等功業。○處，昌慮反。下同。" }
      - { type: z, text: "“撻彼”至“之緒”。○毛以為，撻然而疾者，彼殷王之武丁也。又言其疾之意。乃能奮揚其威武，往伐荊楚之國，深入其險阻之內，聚荊國之人眾，俘虜而以歸也。既伐楚克之，則無往不服。有截然而齊整者，其高宗往伐之處所，是高宗之功，乃湯之為人子孫之業也。美高宗之伐與湯同也。鄭以{罒米}為冒，又以湯孫之緒為太甲之等功業，高宗之功與太甲之等同也。餘同。○傳“撻疾”至“裒聚”。○正義曰：撻，疾，是速疾之意。言伐楚之疾也。述高宗而言殷武，故知是殷王武丁也。定本直雲“殷武，武丁也”。荊是州名，楚是國名，故云荊州之楚也。周有天下，始封熊繹為楚子。於武丁之世，不知楚君何人也。{罒米}者，深入之意，故為深也。“裒，聚”，《釋詁》文。○箋“有鍾”至“士眾”。○正義曰：“有鍾鼓曰伐”，莊二十九年《左傳》文。以其遠入險阻，宜為冒突之義，故易傳為冒也。僖四年《左傳》稱，楚大夫屈完對齊桓公曰：“楚國方城以為城，漢水以為池，雖君之眾，無所用之。”服虔雲：“方城，山也。漢，水名。皆楚之隘塞耳。”今言冒入其阻，故知逾方城之隘。戰勝必當俘虜，言聚荊之旅，故知俘虜其士眾也。○箋“緒業”至“功業”。○正義曰：《釋詁》雲：“業，緒也。”反覆相訓，緒得為業。是乃湯孫太甲之等功業，言高宗此功，同於太甲之等殷之諸賢王之功也。太甲以下，皆是湯孫，故言“之等”以包之。傳於《那》篇言“湯孫者，湯為人子孫”，則此亦當然，故王肅雲：“於所伐截然大治，是湯為人子孫之業，大武丁之伐與湯同。”" }
      - { type: j, text: "維女荊楚，居國南鄉。昔有成湯，自彼氐羌，莫敢不來享，莫敢不來王，曰商是常。鄉，所也。箋雲：氐羌，夷狄國在西方者也。享，獻也。世見曰王。維女楚國，近在荊州之域，居中國之南方，而背叛乎？成湯之時，乃氐羌遠夷之國來獻來見，曰“商王是吾常君也”。此所用責楚之義，女乃遠夷之不如。○氐，都啼反。世見，賢遍反。而背音佩。" }
      - { type: z, text: "箋“氐羌”至“不如”。○正義曰：氐羌之種，漢世仍存，其居在秦隴之西，故知在西方者也。“享，獻”，《釋詁》文。氐羌遠夷，一世而一見於王。以經言來，故解之雲“世見曰來王”。《秋官·大行人》雲：“九州之外，謂之藩國，世一見。”謂其國父死子繼，及嗣王即位，乃來朝，是之謂世見也。言維汝荊楚，則是以言告楚，故知此所用責楚之義，謂未伐之前，先以此言告之。但此詩主美伐功，故上章先言伐事，此章盡五章以來，更本其告責之禮耳。" }
      - { type: j, text: "天命多闢，設都於禹之績。歲事來闢，勿予禍適，稼穡匪解。闢，君。適，過也。箋雲：多，眾也。來闢，猶來王也。天命乃令天下眾君諸侯立都於禹所治之功，以歲時來朝覲於我殷王者，勿罪過與之禍適，徒敕以勸民稼穡，非可解倦。時楚不脩諸侯之職，此所用告曉楚之義也。禹平水土，弼成五服，而諸侯之國定，是以云然。○多闢音壁，下同，注放此。王音闢，邪也。適，直革反，徐張革反，注同；《韓詩》雲：“數也。”解音懈。注同。朝，直遙反。" }
      - { type: z, text: "“天命”至“匪解”。○正義曰：此亦責楚之辭。言上天之命，乃令天下眾君諸侯，建設都邑於禹所治功處。謂布在九州也。常以歲時行朝覲之事，來見君王。我殷王勿予之患禍，不責其罪過，唯告之以勸民稼穡之事，非得有解惰而已。王者之待諸侯，其義如此。而汝何得不脩諸侯之職，不來朝見王也？○箋“禹平”至“云然”。○正義曰：箋以諸侯之立，其來久矣，非由禹治洪水始建都邑，而云“設都於禹之績”，故作此言以解之。《皋陶謨》雲：“禹曰：‘予惟荒度土功，弼成五服，至於五千。’”注云：“荒，奄也。奄大九州四海之土。敷土既畢，廣輔五服而成之，至於面各五千裏，四面相距為萬里。堯制五服，服各五百里，要服之內四千裏曰九州，其外荒服曰四海。禹所弼五服之殘數，亦每服者合五百里，故有萬里之界焉。”又《禹貢》雲“五百里甸服”。每言五百里一服者，是堯舊服；每服之外，更言三百里、二百里者，是禹所弼之殘數也。堯之五服，服五百里耳。禹平水土之後，每服更以五百里輔之，是五服服別千里，故一面而為差至於五千也。賈逵、馬融之說《尚書》雲：“甸服之外，每百里為差。所納總銍秸粟米者，是甸服之外特為此數。其侯服之外，每言三百、二百里者，還就其服之內別為名耳，非是服外更有其地也。”《史記》司馬遷說，以為諸小數者，皆是五百里服之別名，大界與堯不殊，四面相距為五千里耳。王肅注《尚書》，總諸義而論之雲：“賈、馬既失其實，鄭玄尤不然矣。禹之功在於平治山川，不在於拓境廣土。土地之廣，三倍於堯，而《書傳》無稱焉。則鄭之創造，難可據信。漢之孝武，疲弊中國，甘心夷狄，天下戶口至減太半，然後僅開緣邊之郡而已。禹方憂洪水，三過其門而不入，未暇以征伐為事。且其所以為服之名，輕重顛倒，遠近失所，難得而通。先王規方千里以為甸服，其餘均平分之，公、侯、伯、子、男使各有寰宇，而使甸服之外諸侯皆入禾藁，非其義也。史遷之旨，蓋得之矣。”如肅之難，非無理也。鄭不然者，何哉？將以山川帶地，土境不移，前聖後聖，義終一揆。禹之所導山川也，西被流沙，東漸滄海，南距衡山之陽，北臨碣石之北。經塗所亙，萬有餘裏。若其所弼五服，唯極五千，而遠游夷狄之表，勞功荒服之外，復何為哉！又周公制禮，作為九服，蠻畿之內尚至七千。舜禹之功，不應劣於周世，何由土境蹙促，三倍狹於周世？又《外傳》稱“禹會諸侯於塗山，執玉帛者萬國”。執玉帛者，唯中國耳。若要服之內唯止四千，率以下等計之，正容六千餘國，況諸侯之大，地方百里，三等分土，才至數千，安得有萬國之言乎？唐堯之初，協和萬國，於時境界蓋應廣矣。至於洪水滔天，烝民不粒，土地既削，國數亦減，故五服之界，才至五千。洎乎禹治洪水，地平天成，災害既除，大制疆域，固當復其故地，而至五千，何雲不在於拓境廣土也？若雲大禹之功，不在拓境廣土，則武王、周公之功，豈專以境界為事，而能使要服之內有七千裏乎？且經稱“弼成五服，至於五千”，若五服之廣，猶是堯之舊制，何弼成之有乎，而稱之以為功也？凡言至於者，皆從此到彼之辭，明是自京師而至於四境為五千耳。若其四面相距為五千，則設文從何而往？而言至於哉？漢之孝武，德非聖人，乘其六世之資，而與夷狄角力，及開緣邊之郡，境界逾於萬里，何由舜、禹之境才至五千？此乃所以為證，非所以為難也。肅意將謂大禹之德不逮於漢武乎？何其取譬之非類也？先王作法，遭時制宜。甸服之外，去京未遠，使入禾藁，復何傷乎？而云非其義也？鄭以《尚書》之文，上下相校，禹稱“弼成五服”，至於《禹貢》歷數服名，正合五千之數。參之以周、漢之域，驗之於山川之圖，則廣萬里為得其實，故不從賈、馬，別為此說。" }
      - { type: j, text: "天命降監，下民有嚴。不僣不濫，不敢怠遑。命於下國，封建厥福。嚴，敬也。不僣不濫，賞不僣，刑不濫也。封，大也。箋雲：降，下。遑，暇也。天命乃下視下民，有嚴明之君，能明德慎罰，不敢怠惰，自暇於政事者，則命之於小國，以為天子。大立其福，謂命湯使由七十里王天下也。時楚僣號王位，此又所用告曉楚之義。○僣，子念反。王天下，於況反。" }
      - { type: z, text: "傳“嚴敬”至“封大”。○正義曰：“嚴，敬”，《釋詁》文。襄二十六年《左傳》曰：“善為國者，賞不僣，刑不濫。賞僣懼及淫人，刑濫懼及善人。”彼文又引此詩，故知“不僣不濫”，謂賞不僣差，刑不濫溢也。定四年《左傳》曰：“吳為封豕長蛇。”是封為大之義。○箋“降下”至“之義”。○正義曰：“降，下。遑，暇”，《釋言》文。“明德慎罰”，《康誥》文。《中候契握》曰“曰若稽古王湯，既受命，興由七十里起”。《孟子》所云“湯以七十里，文王以百里”。案契為上公受封，舜之末年，又益以土地，則當為大國，過百里矣。而成湯之起，止由七十里，蓋湯之前世，有君衰弱，土地減削，故至於湯時止有七十里耳。以此經責楚之辭，而說成湯有明德而王天下矣。明是於時楚僣慢王位，故告曉之。" }
      - { type: j, text: "商邑翼翼，四方之極。赫赫厥聲，濯濯厥靈。壽考且寧，以保我後生。商邑，京師也。箋雲：極，中也。商邑之禮俗翼翼然可則效，乃四方之中正也。赫赫乎其出政教也，濯濯乎其見尊敬也，王乃壽考且安，以此全守我子孫。此又用商德重告曉楚之義。○重，直用反。" }
      - { type: z, text: "“商邑”至“後生”。○正義曰：此又責楚之辭。言商王之都邑翼翼然皆能禮讓恭敬，誠可法則，乃為四方之中正也。赫赫乎顯盛者，其出政教之美聲也。濯濯乎光明者，其見尊敬如神靈也。故商王得壽考，且又安寧，以保守我後嗣所生子。以我商家之德盛明如此，汝何故敢背叛不從我化乎？以楚不識商之明德，故告曉之。" }
      - { type: j, text: "陟彼景山，松柏丸丸。是斷是遷，方斫是虔。松桷有梴，旅楹有閒。寢成孔安。丸丸，易直也。遷，徙。虔，敬也。梴，長貌。旅，陳也。寢，路寢也。箋雲：椹謂之虔。升景山，揄材木，取松柏易直者，斷而遷之，正斫於椹上，以為桷與眾楹。路寢既成，王居之甚安。謂施政教得其所也。高宗之前王，有廢政教不脩寢廟者，高宗復成湯之道，故新路寢焉。○斷音短。注同。斫，陟角反，《說文》雲：“斫也。”虔，其連反，《爾雅》作“榩”。桷音角。梴，醜連反，又力鱣反，柔梴物同耳，字音亶，俗作埏。易，以豉反。下同。椹，陟金反。掄，魯門反，擇也。沈音倫，理也。" }
      - { type: z, text: "“陟彼”至“孔安”。○毛以為，高宗前王，有廢於政教，不修寢廟者。高宗既伐荊楚，四方無事，乃使人升彼大山之上，觀松柏之木丸丸然易直者，於是斬斷之，於是遷徙之，又方正而斫之。於是之時，工匠皆敬其事，不惰慢也。以松為屋之榱桷，有梴然而長；陳列其楹，有閒然而大。及寢室既成，王居之而甚安矣。美其能脩治寢廟，復故法也。○鄭以榩又為椹，言正斫於椹上。又以旅為眾。唯此為異。餘同。○傳“丸丸”至“路寢”。○正義曰：易直者，言其滑易而調直也。徙，謂徙之來歸也。“虔，敬。旅，陳”，《釋詁》文。桷者，椽也。椽以長為善，故梴為長貌。王之所居路寢，是寢之尊者，故知謂路寢也。箋亦不解閒義。梴為桷之長貌，則閒為楹之大貌。王肅雲：“桷楹以松柏為之，言無彫鏤也。陳列其楹。有閒，大貌。”○箋“椹謂”至“寢焉”。○正義曰：“椹謂之榩”，《釋宮》文。孫炎曰：“椹，斫材質也。”以其方論斫※斫楹桷，不宜言敬，故易傳也。《地官·山虞》雲：“凡邦工入山掄材不禁。”注云：“掄，猶擇也。”此經丸丸之文在斫遷之上，是謂擇取易直者，故言“升景山，掄材木也”。言為桷與眾楹，則訓旅為眾也。以其方始斫之，未宜已為陳列，故易傳也。居寢所以行政，政不得所，王者不安，故知居之甚安，謂施政教得其所也。今美高宗之能修寢廟，明是前王有廢政教、不修寢廟者也。案《殷本紀》“盤庚崩，弟小辛立。崩，弟小乙立。崩，子武丁立”。盤庚始遷於殷，明即為寢廟。其不修者，蓋小辛、小乙耳。未知誰世，故不斥言。經止有寢耳。箋並言廟者，君子將營宮室，宗廟為先，明亦修廟，故連言之。經無廟者，詩人之意主美寢也。" }
      - { type: j, text: "《殷武》六章，三章章六句，二章章七句，一章五句。" }
      - { type: j, text: "《那》五篇，十六章，百五十四句。" }
