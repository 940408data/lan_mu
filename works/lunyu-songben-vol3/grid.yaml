labels:
  - page: 92
    col: 9
    role: j
    text: 論語卷第三朱熹集注
  - page: 92
    col: 10
    role: title
    text: 公冶長第五
  - page: 92
    col: 11
    role: j
    text: 此篇皆論古今人物賢否得失蓋格
  - page: 92
    col: 12
    role: j
    text: 物窮理之一端也凡二十七章胡氏
  - page: 92
    col: 13
    role: z
    text: 以為疑多子貢之徒所記云
  - page: 92
    col: 14
    role: j
    text: 子謂公冶長可妻也雖在縲絏之中非
  - page: 92
    col: 15
    role: j
    text: 其罪也以其子妻之
  - page: 92
    col: 16
    role: z
    text: 妻去聲下同縲力追反絏息列反○
  - page: 93
    col: 1
    role: z
    text: 公冶長孔子弟子妻為之妻也縲黑
  - page: 93
    col: 2
    role: z
    text: 索也絏攣也古者獄中以黑索拘攣
  - page: 93
    col: 3
    role: z
    text: 罪人長之為人無所考而夫子稱其
  - page: 93
    col: 4
    role: z
    text: 可妻其必有以取之矣又言其人雖
  - page: 93
    col: 5
    role: z
    text: 甞陷於縲絏之中而非其罪則固無
  - page: 93
    col: 6
    role: z
    text: 害於可妻也夫有罪無罪在我而已
  - page: 93
    col: 7
    role: z
    text: 豈以自外至者為榮辱哉
  - page: 93
    col: 8
    role: j
    text: 子謂南容邦有道不廢邦無道免於刑
  - page: 93
    col: 9
    role: j
    text: 戮以其兄之子妻之
  - page: 93
    col: 10
    role: j
    text: 南容孔子弟子居南宮名縚又名括字
  - page: 93
    col: 11
    role: z
    text: 子容謚敬叔孟懿子之兄也不廢言
  - page: 93
    col: 12
    role: z
    text: 必見用也以其謹於言行故能見用
  - page: 93
    col: 13
    role: z
    text: 於治朝免禍於亂世也事又見第十
  - page: 93
    col: 14
    role: z
    text: 一篇○或曰公冶長之賢不及南容
  - page: 93
    col: 15
    role: z
    text: 故聖人以其子妻長而以兄子妻容
  - page: 93
    col: 16
    role: z
    text: 蓋厚於兄而薄於己也○程子曰此
  - page: 94
    col: 1
    role: z
    text: 以己之私心窺聖人也凡人避嫌者
  - page: 94
    col: 2
    role: z
    text: 皆内不足也聖人自至公何避嫌之
  - page: 94
    col: 3
    role: z
    text: 有况嫁女必量其才而求配尤不當
  - page: 94
    col: 4
    role: z
    text: 有所避也若孔子之事則其年之長
  - page: 94
    col: 5
    role: z
    text: 幼時之先後皆不可知唯以爲避嫌
  - page: 94
    col: 6
    role: z
    text: 則大不可避嫌之事賢者且不爲况
  - page: 94
    col: 7
    role: z
    text: 聖人乎
  - page: 94
    col: 8
    role: j
    text: 子謂子賤君子哉若人魯無君子者斯
  - page: 94
    col: 9
    role: j
    text: 焉取斯
  - page: 94
    col: 10
    role: z
    text: 焉於虔反○子賤孔子弟子姓宓名
  - page: 94
    col: 11
    role: z
    text: 不齊上斯斯此人下斯斯此德子賤
  - page: 94
    col: 12
    role: z
    text: 蓋能尊賢取友以成其德者故夫子
  - page: 94
    col: 13
    role: z
    text: 旣嘆其賢而又言若魯無君子則此
  - page: 94
    col: 14
    role: z
    text: 人何所取以成此德乎因以見魯之
  - page: 94
    col: 15
    role: z
    text: 多賢也○蘇氏曰稱人之善必本其
  - page: 94
    col: 16
    role: z
    text: 父兄師友厚之至也
  - page: 95
    col: 1
    role: j
    text: 子貢問曰賜也何如子曰女器也曰何
  - page: 95
    col: 2
    role: j
    text: 器也曰瑚璉也
  - page: 95
    col: 3
    role: j
    text: 女音汝瑚音胡璉力展反○器者有
  - page: 95
    col: 4
    role: j
    text: 用之成材夏曰瑚商曰璉周曰簠簋
  - page: 95
    col: 5
    role: j
    text: 皆宗廟盛黍稷之器而飾以玉器之
  - page: 95
    col: 6
    role: j
    text: 貴重而華美者也子貢見孔子以君
  - page: 95
    col: 7
    role: j
    text: 子許子賤故以己爲問而孔子告之
  - page: 95
    col: 8
    role: j
    text: 以此然則子貢雖未至於不器其亦
  - page: 95
    col: 9
    role: z
    text: 器之貴者歟
  - page: 95
    col: 10
    role: j
    text: 或曰雍也仁而不佞
  - page: 95
    col: 11
    role: j
    text: 雍孔子弟子姓冉字仲弓佞口才也
  - page: 95
    col: 12
    role: j
    text: 仲弓爲人重厚簡默而時人以佞爲
  - page: 95
    col: 13
    role: j
    text: 賢故美其優於德而病其短於才也
  - page: 95
    col: 14
    role: j
    text: 子曰焉用佞禦人以口給屢憎於人不
  - page: 95
    col: 15
    role: j
    text: 知其仁焉用佞
  - page: 95
    col: 16
    role: j
    text: 焉於虔反○禦當也猶應答也給辦
  - page: 96
    col: 1
    role: z
    text: 也憎惡也言何用佞乎佞人所以應
  - page: 96
    col: 2
    role: z
    text: 答人者但以口取辦而無情實徒多
  - page: 96
    col: 3
    role: z
    text: 爲人所憎惡爾我雖未知仲弓之仁
  - page: 96
    col: 4
    role: z
    text: 然其不佞乃所以爲賢不足以爲病
  - page: 96
    col: 5
    role: z
    text: 也再言焉用佞所以深曉之○或疑
  - page: 96
    col: 6
    role: z
    text: 仲弓之賢而夫子不許其仁何也曰
  - page: 96
    col: 7
    role: z
    text: 仁道至大非全體而不息者不足以
  - page: 96
    col: 8
    role: z
    text: 當之如顏子亞聖猶不能無違於三
  - page: 96
    col: 9
    role: z
    text: 月之後況仲弓雖賢未及顏子聖人
  - page: 96
    col: 10
    role: z
    text: 固不得而輕許之也
  - page: 96
    col: 11
    role: j
    text: 子使漆雕開仕對曰吾斯之未能信子
  - page: 96
    col: 12
    role: j
    text: 說
  - page: 96
    col: 13
    role: z
    text: 說音悅○漆雕開孔子弟子字子若
  - page: 96
    col: 14
    role: z
    text: 斯指此理而言信謂眞知其如此而
  - page: 96
    col: 15
    role: z
    text: 無豪髮之疑也開自言未能如此未
  - page: 96
    col: 16
    role: z
    text: 可以治人故夫子悅其篤志○程子
  - page: 97
    col: 1
    role: z
    text: 曰漆雕開已見大意故夫子說之又
  - page: 97
    col: 2
    role: z
    text: 曰古人見道分明故其言如此○謝
  - page: 97
    col: 3
    role: z
    text: 氏曰開之學無可考然聖人使之仕
  - page: 97
    col: 4
    role: z
    text: 必其材可以仕矣至於心術之微則
  - page: 97
    col: 5
    role: z
    text: 一毫不自得不害其爲未信此聖人
  - page: 97
    col: 6
    role: z
    text: 所不能知而開自知之其材可以仕
  - page: 97
    col: 7
    role: z
    text: 而其器不安於小成他日所就其可
  - page: 97
    col: 8
    role: z
    text: 量乎夫子所以說之也
  - page: 97
    col: 9
    role: j
    text: 子曰道不行乘桴浮于海從我者其由
  - page: 97
    col: 10
    role: j
    text: 與子路聞之喜子曰由也好勇過我無
  - page: 97
    col: 11
    role: j
    text: 所取材
  - page: 97
    col: 12
    role: z
    text: 桴音孚從好並去聲與平聲材與裁
  - page: 97
    col: 13
    role: z
    text: 同古字借用○桴筏也○程子曰浮
  - page: 97
    col: 14
    role: z
    text: 海之嘆傷天下之無賢君也子路勇
  - page: 97
    col: 15
    role: z
    text: 於義故謂其能從己皆假設之言耳
  - page: 97
    col: 16
    role: z
    text: 子路以爲實然而喜夫子之與己故
  - page: 98
    col: 1
    role: z
    text: 夫子美其勇而譏其不能裁度事理
  - page: 98
    col: 2
    role: z
    text: 以適於義也
  - page: 98
    col: 3
    role: j
    text: 孟武伯問子路仁乎子曰不知也
  - page: 98
    col: 4
    role: z
    text: 子路之於仁蓋日月至焉者或在或
  - page: 98
    col: 5
    role: z
    text: 亡不能必其有無故以不知告之
  - page: 98
    col: 6
    role: j
    text: 又問子曰由也千乘之國可使治其賦
  - page: 98
    col: 7
    role: j
    text: 也不知其仁也
  - page: 98
    col: 8
    role: z
    text: 乘去聲○賦兵也古者以田賦出兵
  - page: 98
    col: 9
    role: z
    text: 故謂兵為賦春秋傳所謂悉索敝賦
  - page: 98
    col: 10
    role: z
    text: 是也言子路之才可見者如此仁則
  - page: 98
    col: 11
    role: z
    text: 不能知也
  - page: 98
    col: 12
    role: j
    text: 求也何如子曰求也千室之邑百乘之
  - page: 98
    col: 13
    role: j
    text: 家可使為之宰也不知其仁也
  - page: 98
    col: 14
    role: z
    text: 千室大邑百乘卿大夫之家宰邑長
  - page: 98
    col: 15
    role: z
    text: 家臣之通號
  - page: 98
    col: 16
    role: j
    text: 赤也何如子曰赤也束帶立於朝可使
  - page: 99
    col: 1
    role: j
    text: 與賔客言也不知其仁也
  - page: 99
    col: 2
    role: z
    text: 朝音潮○赤孔子弟子姓公西字子
  - page: 99
    col: 3
    role: z
    text: 華
  - page: 99
    col: 4
    role: j
    text: 子謂子貢曰女與回也孰愈
  - page: 99
    col: 5
    role: z
    text: 女音汝下同○愈勝也
  - page: 99
    col: 6
    role: j
    text: 對曰賜也何敢望回回也聞一以知十
  - page: 99
    col: 7
    role: j
    text: 賜也聞一以知二
  - page: 99
    col: 8
    role: z
    text: 一數之始十數之終二者一之對也
  - page: 99
    col: 9
    role: z
    text: 顔子明睿所照即始而見終子貢推
  - page: 99
    col: 10
    role: z
    text: 測而知因此而識彼無所不悅告往
  - page: 99
    col: 11
    role: z
    text: 知來是其驗矣
  - page: 99
    col: 12
    role: j
    text: 子曰弗如也吾與女弗如也
  - page: 99
    col: 13
    role: z
    text: 與許也○胡氏曰子貢方人夫子既
  - page: 99
    col: 14
    role: z
    text: 語以不暇又問其與回孰愈以觀其
  - page: 99
    col: 15
    role: z
    text: 自知之如何聞一知十上知之資生
  - page: 99
    col: 16
    role: z
    text: 知之亞也聞一知二中人以上之資
  - page: 100
    col: 1
    role: z
    text: 學而知之之才也子貢平日以己方
  - page: 100
    col: 2
    role: z
    text: 回見其不可企及故喻之如此夫子
  - page: 100
    col: 3
    role: z
    text: 以其自知之明而又不難於自屈故
  - page: 100
    col: 4
    role: z
    text: 既然之又重許之此其所以終聞性
  - page: 100
    col: 5
    role: z
    text: 與天道不特聞一知二而已也
  - page: 100
    col: 6
    role: j
    text: 宰予晝寢子曰朽木不可雕也糞土之
  - page: 100
    col: 7
    role: j
    text: 牆不可杇也於予與何誅
  - page: 100
    col: 8
    role: z
    text: 朽許乆反杇音汗與平聲下同○晝
  - page: 100
    col: 9
    role: z
    text: 寢謂當晝而寐朽腐也雕刻畫也杇
  - page: 100
    col: 10
    role: z
    text: 鏝也言其志氣昏惰教無所施也與
  - page: 100
    col: 11
    role: z
    text: 語辭誅責也言不足責乃所以深責
  - page: 100
    col: 12
    role: z
    text: 之
  - page: 100
    col: 13
    role: j
    text: 子曰始吾於人也聽其言而信其行今
  - page: 100
    col: 14
    role: j
    text: 吾於人也聽其言而觀其行於予與改
  - page: 100
    col: 15
    role: j
    text: 是
  - page: 100
    col: 16
    role: z
    text: 行去聲○宰予能言而行不逮故孔
  - page: 101
    col: 1
    role: z
    text: 子自言於予之事而改此失亦以重
  - page: 101
    col: 2
    role: z
    text: 警之也胡氏曰子曰疑衍文不然則
  - page: 101
    col: 3
    role: z
    text: 非一日之言也○范氏曰君子之於
  - page: 101
    col: 4
    role: z
    text: 學惟日孜孜斃而後已惟恐其不及
  - page: 101
    col: 5
    role: z
    text: 也宰予晝寢自棄孰甚焉故夫子責
  - page: 101
    col: 6
    role: j
    text: 之○胡氏曰宰予不能以志帥氣居然
  - page: 101
    col: 7
    role: z
    text: 而倦是宴安之氣勝儆戒之志惰也
  - page: 101
    col: 8
    role: z
    text: 古之聖賢未甞不以懈惰荒寧爲懼
  - page: 101
    col: 9
    role: z
    text: 勤勵不息自強此孔子所以深責宰
  - page: 101
    col: 10
    role: z
    text: 予也聽言觀行聖人不待是而後能
  - page: 101
    col: 11
    role: z
    text: 亦非縁此而盡疑學者特因此立教
  - page: 101
    col: 12
    role: z
    text: 以警羣弟子使謹於言而敏於行耳
  - page: 101
    col: 13
    role: j
    text: 子曰吾未見剛者或對曰申棖子曰棖
  - page: 101
    col: 14
    role: j
    text: 也慾焉得剛
  - page: 101
    col: 15
    role: z
    text: 焉於䖍反○剛堅強不屈之意最人
  - page: 101
    col: 16
    role: z
    text: 所難能者故夫子歎其未見申棖弟
  - page: 102
    col: 1
    role: z
    text: 子姓名慾多嗜慾也多嗜慾則不得
  - page: 102
    col: 2
    role: z
    text: 為剛矣○程子曰人有慾則無剛剛
  - page: 102
    col: 3
    role: z
    text: 則不屈於慾謝氏曰剛與慾正相反
  - page: 102
    col: 4
    role: z
    text: 能勝物之謂剛故常伸於萬物之上
  - page: 102
    col: 5
    role: z
    text: 為物揜之謂慾故常屈於萬物之下
  - page: 102
    col: 6
    role: z
    text: 自古有志者少無志者多宜夫子之
  - page: 102
    col: 7
    role: z
    text: 未見也棖之慾不可知其為人得非
  - page: 102
    col: 8
    role: z
    text: 悻悻自好者乎故或者疑以為剛然
  - page: 102
    col: 9
    role: z
    text: 不知此其所以為慾爾
  - page: 102
    col: 10
    role: j
    text: 子貢曰我不欲人之加諸我也吾亦欲
  - page: 102
    col: 11
    role: j
    text: 無加諸人子曰賜也非爾所及也
  - page: 102
    col: 12
    role: z
    text: 子貢言我所不欲人加於我之事我
  - page: 102
    col: 13
    role: z
    text: 亦不欲以此加之於人此仁者之事
  - page: 102
    col: 14
    role: j
    text: 不待勉強故夫子以為非子貢所及○
  - page: 102
    col: 15
    role: z
    text: 程子曰我不欲人之加諸我吾亦欲
  - page: 102
    col: 16
    role: z
    text: 無加諸人仁也施諸己而不願亦勿
  - page: 103
    col: 1
    role: z
    text: 施於人恕也恕則子貢或能勉之仁
  - page: 103
    col: 2
    role: z
    text: 則非所及矣愚謂無者自然而然勿
  - page: 103
    col: 3
    role: z
    text: 者禁止之謂此所以爲仁恕之别
  - page: 103
    col: 4
    role: j
    text: 子貢曰夫子之文章可得而聞也夫子
  - page: 103
    col: 5
    role: j
    text: 之言性與天道不可得而聞也
  - page: 103
    col: 6
    role: z
    text: 文章德之見乎外者威儀文辭皆是
  - page: 103
    col: 7
    role: z
    text: 也性者人所受之天理天道者天理
  - page: 103
    col: 8
    role: z
    text: 自然之本體其實一理也言夫子之
  - page: 103
    col: 9
    role: z
    text: 文章日見乎外固學者所共聞至於
  - page: 103
    col: 10
    role: z
    text: 性與天道則夫子罕言之而學者有
  - page: 103
    col: 11
    role: z
    text: 不得聞者蓋聖門教不躐等子貢至
  - page: 103
    col: 12
    role: z
    text: 是始得聞之而嘆其美也○程子曰
  - page: 103
    col: 13
    role: z
    text: 此子貢聞夫子之至論而嘆美之言
  - page: 103
    col: 14
    role: z
    text: 也
  - page: 103
    col: 15
    role: j
    text: 子路有聞未之能行唯恐有聞
  - page: 103
    col: 16
    role: z
    text: 前所聞者既未及行故恐復有所聞
  - page: 104
    col: 1
    role: z
    text: 而行之不給也○范氏曰子路聞善
  - page: 104
    col: 2
    role: z
    text: 勇於必行門人自以爲弗及也故著
  - page: 104
    col: 3
    role: z
    text: 之若子路可謂能用其勇矣
  - page: 104
    col: 4
    role: j
    text: 子貢問曰孔文子何以謂之文也子曰
  - page: 104
    col: 5
    role: j
    text: 敏而好學不恥下問是以謂之文也
  - page: 104
    col: 6
    role: z
    text: 好去聲○孔文子衛大夫名圉凡人
  - page: 104
    col: 7
    role: z
    text: 性敏者多不好學位高者多恥下問
  - page: 104
    col: 8
    role: z
    text: 故謚法有以勤學好問爲文者蓋亦
  - page: 104
    col: 9
    role: j
    text: 人所難也孔圉得謚爲文以此而已○
  - page: 104
    col: 10
    role: z
    text: 蘇氏曰孔文子使太叔疾出其妻而
  - page: 104
    col: 11
    role: z
    text: 妻之疾通於初妻之娣文子怒將攻
  - page: 104
    col: 12
    role: z
    text: 之訪於仲尼仲尼不對命駕而行疾
  - page: 104
    col: 13
    role: z
    text: 奔宋文子使疾弟遺室孔姞其爲人
  - page: 104
    col: 14
    role: z
    text: 如此而謚曰文此子貢之所以疑而
  - page: 104
    col: 15
    role: z
    text: 問也孔子不没其善言能如此亦足
  - page: 104
    col: 16
    role: z
    text: 以爲文矣非經天緯地之文也
  - page: 105
    col: 1
    role: j
    text: 子謂子産有君子之道四焉其行己也
  - page: 105
    col: 2
    role: j
    text: 恭其事上也敬其養民也惠其使民也
  - page: 105
    col: 3
    role: j
    text: 義
  - page: 105
    col: 4
    role: z
    text: 子産鄭大夫公孫僑恭謙遜也敬謹
  - page: 105
    col: 5
    role: z
    text: 恪也惠愛利也使民義如都鄙有章
  - page: 105
    col: 6
    role: j
    text: 上下有服田有封洫廬井有伍之類○
  - page: 105
    col: 7
    role: z
    text: 吳氏曰數其事而責之者其所善者
  - page: 105
    col: 8
    role: z
    text: 多也臧文仲不仁者三不知者三是
  - page: 105
    col: 9
    role: z
    text: 也數其事而稱之者猶有所未至也
  - page: 105
    col: 10
    role: j
    text: 子産有君子之道四焉是也今或以
  - page: 105
    col: 11
    role: z
    text: 一言蓋一人一事蓋一時皆非也
  - page: 105
    col: 12
    role: j
    text: 子曰晏平仲善與人交久而敬之
  - page: 105
    col: 13
    role: z
    text: 晏平仲齊大夫名嬰○程子曰人交
  - page: 105
    col: 14
    role: z
    text: 久則敬衰久而能敬所以爲善
  - page: 105
    col: 15
    role: j
    text: 子曰臧文仲居蔡山節藻梲何如其知
  - page: 105
    col: 16
    role: j
    text: 也
  - page: 106
    col: 1
    role: z
    text: 棁章恱反知去聲○臧文仲魯大夫
  - page: 106
    col: 2
    role: z
    text: 臧孫氏名辰居猶藏也蔡大龜也節
  - page: 106
    col: 3
    role: z
    text: 柱頭斗拱也藻水草名棁梁上短柱
  - page: 106
    col: 4
    role: z
    text: 也蓋爲藏龜之室而刻山於節畫藻
  - page: 106
    col: 5
    role: z
    text: 於棁也當時以文仲爲知孔子言其
  - page: 106
    col: 6
    role: z
    text: 不務民義而謟瀆鬼神如此安得爲
  - page: 106
    col: 7
    role: z
    text: 知春秋傳所謂作虛器即此事也○
  - page: 106
    col: 8
    role: z
    text: 張子曰山節藻棁爲藏龜之室祀爰
  - page: 106
    col: 9
    role: z
    text: 居之義同歸於不知宜矣
  - page: 106
    col: 10
    role: j
    text: 子張問曰令尹子文三仕爲令尹無喜
  - page: 106
    col: 11
    role: j
    text: 色三已之無慍色舊令尹之政必以告
  - page: 106
    col: 12
    role: j
    text: 新令尹何如子曰忠矣曰仁矣乎曰未
  - page: 106
    col: 13
    role: j
    text: 知焉得仁
  - page: 106
    col: 14
    role: z
    text: 知如字焉於虔反○令尹官名楚上
  - page: 106
    col: 15
    role: z
    text: 卿執政者也子文姓鬪名穀於菟其
  - page: 106
    col: 16
    role: z
    text: 爲人也喜怒不形物我無間知有其
  - page: 107
    col: 1
    role: z
    text: 國而不知有其身其忠盛矣故子張
  - page: 107
    col: 2
    role: z
    text: 疑其仁然其所以三仕三已而告新
  - page: 107
    col: 3
    role: z
    text: 令尹者未知其皆出於天理而無人
  - page: 107
    col: 4
    role: z
    text: 欲之私也是以夫子但許其忠而未
  - page: 107
    col: 5
    role: z
    text: 許其仁也
  - page: 107
    col: 6
    role: j
    text: 崔子弒齊君陳文子有馬十乘棄而違
  - page: 107
    col: 7
    role: j
    text: 之至於他邦則曰猶吾大夫崔子也違
  - page: 107
    col: 8
    role: j
    text: 之之一邦則又曰猶吾大夫崔子也違
  - page: 107
    col: 9
    role: j
    text: 之何如子曰清矣曰仁矣乎曰未知焉
  - page: 107
    col: 10
    role: j
    text: 得仁
  - page: 107
    col: 11
    role: z
    text: 乘去聲○崔子齊大夫名杼齊君莊
  - page: 107
    col: 12
    role: z
    text: 公名光陳文子亦齊大夫名須無十
  - page: 107
    col: 13
    role: z
    text: 乘四十匹也違去也文子絜身去亂
  - page: 107
    col: 14
    role: z
    text: 可謂清矣然未知其心果見義理之
  - page: 107
    col: 15
    role: z
    text: 當然而能脫然無所累乎抑不得已
  - page: 107
    col: 16
    role: z
    text: 於利害之私而猶未免於怨悔也故
  - page: 108
    col: 1
    role: j
    text: 孔子特許其清而不許其仁○愚聞
  - page: 108
    col: 2
    role: j
    text: 之師曰當理而無私心則仁矣今以
  - page: 108
    col: 3
    role: j
    text: 是而觀二子之事雖其制行之髙若
  - page: 108
    col: 4
    role: j
    text: 不可及然皆未有以見其必當於理
  - page: 108
    col: 5
    role: j
    text: 而眞無私心也子張未識仁體而悅
  - page: 108
    col: 6
    role: j
    text: 於苟難遂以小者信其大者夫子之
  - page: 108
    col: 7
    role: j
    text: 不許也冝哉讀者於此更以上章不
  - page: 108
    col: 8
    role: j
    text: 知其仁後篇仁則吾不知之語并與
  - page: 108
    col: 9
    role: j
    text: 三仁夷齊之事觀之則彼此交盡而
  - page: 108
    col: 10
    role: j
    text: 仁之爲義可識矣今以它書考之子
  - page: 108
    col: 11
    role: j
    text: 文之相楚所謀者無非僭王猾夏之
  - page: 108
    col: 12
    role: j
    text: 事文子之仕齊旣失正君討賊之義
  - page: 108
    col: 13
    role: j
    text: 又不數歲而復反於齊焉則其不仁
  - page: 108
    col: 14
    role: z
    text: 亦可見矣
  - page: 108
    col: 15
    role: j
    text: 季文子三思而後行子聞之曰再斯可
  - page: 108
    col: 16
    role: j
    text: 矣
  - page: 109
    col: 1
    role: z
    text: 三去聲○季文子魯大夫名行父每
  - page: 109
    col: 2
    role: z
    text: 事必三思而後行若使晉而求遭喪
  - page: 109
    col: 3
    role: z
    text: 之禮以行亦其一事也斯語詞○程
  - page: 109
    col: 4
    role: z
    text: 子曰為惡之人未嘗知有思有思則
  - page: 109
    col: 5
    role: z
    text: 為善矣然至於再則已審三則私意
  - page: 109
    col: 6
    role: z
    text: 起而反惑矣故夫子譏之○愚按季
  - page: 109
    col: 7
    role: z
    text: 文子慮事如此可謂詳審而宜無過
  - page: 109
    col: 8
    role: z
    text: 舉矣而宣公篡立文子乃不能討反
  - page: 109
    col: 9
    role: z
    text: 為之使齊而納賂焉豈非程子所謂
  - page: 109
    col: 10
    role: z
    text: 私意起而反惑之驗與是以君子務
  - page: 109
    col: 11
    role: z
    text: 窮理而貴果斷不徒多思之為尚
  - page: 109
    col: 12
    role: j
    text: 子曰甯武子邦有道則知邦無道則愚
  - page: 109
    col: 13
    role: j
    text: 其知可及也其愚不可及也
  - page: 109
    col: 14
    role: z
    text: 知去聲○甯武子衛大夫名俞按春
  - page: 109
    col: 15
    role: z
    text: 秋傳武子仕衛當文公成公之時文
  - page: 109
    col: 16
    role: z
    text: 公有道而武子無事可見此其知之
  - page: 110
    col: 1
    role: z
    text: 可及也成公無道至於失國而武子
  - page: 110
    col: 2
    role: z
    text: 周旋其間盡心竭力不避艱險凡其
  - page: 110
    col: 3
    role: z
    text: 所處皆智巧之士所深避而不肯爲
  - page: 110
    col: 4
    role: z
    text: 者而能卒保其身以濟其君此其愚
  - page: 110
    col: 5
    role: z
    text: 之不可及也○程子曰邦無道能沈
  - page: 110
    col: 6
    role: z
    text: 晦以免患故曰不可及也亦有不當
  - page: 110
    col: 7
    role: z
    text: 愚者比干是也
  - page: 110
    col: 8
    role: j
    text: 子在陳曰歸與歸與吾黨之小子狂簡
  - page: 110
    col: 9
    role: j
    text: 斐然成章不知所以裁之
  - page: 110
    col: 10
    role: z
    text: 與平聲斐音匪○此孔子周流四方
  - page: 110
    col: 11
    role: z
    text: 道不行而思歸之歎也吾黨小子指
  - page: 110
    col: 12
    role: z
    text: 門人之在魯者狂簡志大而略於事
  - page: 110
    col: 13
    role: z
    text: 也斐文貌成章言其文理成就有可
  - page: 110
    col: 14
    role: z
    text: 觀者裁割正也夫子初心欲行其道
  - page: 110
    col: 15
    role: z
    text: 於天下至是而知其終不用也於是
  - page: 110
    col: 16
    role: z
    text: 始欲成就後學以傳道於來世又不
  - page: 111
    col: 1
    role: z
    text: 得中行之士而思其次以為狂士志
  - page: 111
    col: 2
    role: z
    text: 意高遠猶或可與進於道也但恐其
  - page: 111
    col: 3
    role: z
    text: 過中失正而或陷於異端耳故欲歸
  - page: 111
    col: 4
    role: z
    text: 而裁之也
  - page: 111
    col: 5
    role: j
    text: 子曰伯夷叔齊不念舊惡怨是用希
  - page: 111
    col: 6
    role: z
    text: 伯夷叔齊孤竹君之二子孟子稱其
  - page: 111
    col: 7
    role: z
    text: 不立於惡人之朝不與惡人言與鄉
  - page: 111
    col: 8
    role: z
    text: 人立其冠不正望望然去之若將浼
  - page: 111
    col: 9
    role: z
    text: 焉其介如此宜若無所容矣然其所
  - page: 111
    col: 10
    role: z
    text: 惡之人能改即止故人亦不甚怨之
  - page: 111
    col: 11
    role: z
    text: 也○程子曰不念舊惡此清者之量
  - page: 111
    col: 12
    role: z
    text: 又曰二子之心非夫子孰能知之
  - page: 111
    col: 13
    role: j
    text: 子曰孰謂微生高直或乞醯焉乞諸其
  - page: 111
    col: 14
    role: j
    text: 鄰而與之
  - page: 111
    col: 15
    role: z
    text: 醯呼西反○微生姓高名魯人素有
  - page: 111
    col: 16
    role: z
    text: 直名者醯醋也人來乞時其家無有
  - page: 112
    col: 1
    role: z
    text: 故乞諸鄰家以與之夫子言譏其
  - page: 112
    col: 2
    role: z
    text: 曲意徇物掠美市恩不得爲直也○
  - page: 112
    col: 3
    role: j
    text: 程子曰微生高所枉雖小害直爲大○
  - page: 112
    col: 4
    role: z
    text: 范氏曰是曰是非曰非有謂有無謂
  - page: 112
    col: 5
    role: z
    text: 無曰直聖人觀人於其一介之取予
  - page: 112
    col: 6
    role: z
    text: 而千駟萬鍾從可知焉故以微事斷
  - page: 112
    col: 7
    role: z
    text: 之所以教人不可不謹也
  - page: 112
    col: 8
    role: j
    text: 子曰巧言令色足恭左丘明恥之丘亦
  - page: 112
    col: 9
    role: j
    text: 恥之匿怨而友其人左丘明恥之丘亦
  - page: 112
    col: 10
    role: j
    text: 恥之
  - page: 112
    col: 11
    role: z
    text: 足將樹反○足過也○程子曰左丘
  - page: 112
    col: 12
    role: z
    text: 明古之聞人也○謝氏曰二者之可
  - page: 112
    col: 13
    role: z
    text: 恥有甚於穿窬也左丘明恥之其所
  - page: 112
    col: 14
    role: z
    text: 養可知矣夫子自言丘亦恥之蓋竊
  - page: 112
    col: 15
    role: z
    text: 比老彭之意又以深戒學者使察乎
  - page: 112
    col: 16
    role: z
    text: 此而立心以直也
  - page: 113
    col: 1
    role: j
    text: 顏淵季路侍子曰盍各言爾志
  - page: 113
    col: 2
    role: z
    text: 盍音合○盍何不也
  - page: 113
    col: 3
    role: j
    text: 子路曰願車馬衣輕裘與朋友共敝之
  - page: 113
    col: 4
    role: j
    text: 而無憾
  - page: 113
    col: 5
    role: z
    text: 衣去聲○衣服之也裘皮服敝壞也
  - page: 113
    col: 6
    role: z
    text: 憾恨也
  - page: 113
    col: 7
    role: j
    text: 顏淵曰願無伐善無施勞
  - page: 113
    col: 8
    role: z
    text: 伐誇也善謂有能施亦張大之意勞
  - page: 113
    col: 9
    role: z
    text: 謂有功易曰勞而不伐是也或曰勞
  - page: 113
    col: 10
    role: z
    text: 勞事也勞事非己所欲故亦不欲施
  - page: 113
    col: 11
    role: z
    text: 之於人亦通
  - page: 113
    col: 12
    role: j
    text: 子路曰願聞子之志子曰老者安之朋
  - page: 113
    col: 13
    role: j
    text: 友信之少者懷之
  - page: 113
    col: 14
    role: z
    text: 老者養之以安朋友與之以信少者
  - page: 113
    col: 15
    role: z
    text: 懷之以恩一說安之安我也信之信
  - page: 113
    col: 16
    role: z
    text: 我也懷之懷我也亦通○程子曰夫
  - page: 114
    col: 1
    role: j
    text: 子安仁顏淵不違仁子路求仁又曰
  - page: 114
    col: 2
    role: j
    text: 子路顏淵孔子之志皆與物共者也
  - page: 114
    col: 3
    role: j
    text: 但有小大之差爾又曰子路勇於義
  - page: 114
    col: 4
    role: j
    text: 者觀其志豈可以勢利拘之哉亞於
  - page: 114
    col: 5
    role: j
    text: 浴沂者也顏子不自私己故無伐善
  - page: 114
    col: 6
    role: j
    text: 知同於人故無施勞其志可謂大矣
  - page: 114
    col: 7
    role: j
    text: 然未免出於有意也至於夫子則如
  - page: 114
    col: 8
    role: j
    text: 天地之化工付與萬物而己不勞焉
  - page: 114
    col: 9
    role: z
    text: 此聖人之所爲也今夫羈靮以御馬
  - page: 114
    col: 10
    role: z
    text: 而不以制牛人皆知羈靮之作在乎
  - page: 114
    col: 11
    role: z
    text: 人而不知羈靮之生由於馬聖人之
  - page: 114
    col: 12
    role: z
    text: 化亦猶是也先觀二子之言後觀聖
  - page: 114
    col: 13
    role: z
    text: 人之言分明天地氣象凡看論語非
  - page: 114
    col: 14
    role: z
    text: 但欲理會文字須要識得聖賢氣象
  - page: 114
    col: 15
    role: j
    text: 子曰已矣乎吾未見能見其過而内自
  - page: 114
    col: 16
    role: j
    text: 訟者也
  - page: 115
    col: 1
    role: z
    text: 已矣乎者恐其終不得見而嘆之也
  - page: 115
    col: 2
    role: z
    text: 內自訟者口不言而心自咎也人有
  - page: 115
    col: 3
    role: z
    text: 過而能自知者鮮矣知過而能內自
  - page: 115
    col: 4
    role: z
    text: 訟者為尤鮮能內自訟則其悔悟深
  - page: 115
    col: 5
    role: z
    text: 切而能改必矣夫子自恐終不得見
  - page: 115
    col: 6
    role: z
    text: 而嘆之其警學者深矣
  - page: 115
    col: 7
    role: j
    text: 子曰十室之邑必有忠信如丘者焉不
  - page: 115
    col: 8
    role: j
    text: 如丘之好學也
  - page: 115
    col: 9
    role: z
    text: 焉如字屬上句好去聲○十室小邑
  - page: 115
    col: 10
    role: z
    text: 也忠信如聖人生質之美者也夫子
  - page: 115
    col: 11
    role: z
    text: 生知而未嘗不好學故言此以勉人
  - page: 115
    col: 12
    role: z
    text: 言美質易得至道難聞學之至則可
  - page: 115
    col: 13
    role: z
    text: 以為聖人不學則不免為鄉人而已
  - page: 115
    col: 14
    role: z
    text: 可不勉哉
  - page: 115
    col: 15
    role: title
    text: 雍也第六
  - page: 115
    col: 16
    role: z
    text: 凡二十八章篇內第十四章以前大
  - page: 116
    col: 1
    role: z
    text: 意與前篇同
  - page: 116
    col: 2
    role: j
    text: 子曰雍也可使南面
  - page: 116
    col: 3
    role: z
    text: 南面者人君聽治之位言仲弓寬洪
  - page: 116
    col: 4
    role: z
    text: 簡重有人君之度也
  - page: 116
    col: 5
    role: j
    text: 仲弓問子桑伯子子曰可也簡
  - page: 116
    col: 6
    role: z
    text: 子桑伯子魯人胡氏以為疑即莊周
  - page: 116
    col: 7
    role: z
    text: 所稱子桑户者是也仲弓以夫子許
  - page: 116
    col: 8
    role: z
    text: 已南面故問伯子如何可者僅可而
  - page: 116
    col: 9
    role: z
    text: 有所未盡之辭簡者不煩之謂
  - page: 116
    col: 10
    role: j
    text: 仲弓曰居敬而行簡以臨其民不亦可
  - page: 116
    col: 11
    role: j
    text: 乎居簡而行簡無乃大簡乎
  - page: 116
    col: 12
    role: z
    text: 大音泰○言自處以敬則中有主而
  - page: 116
    col: 13
    role: z
    text: 自治嚴如是而行簡以臨民則事不
  - page: 116
    col: 14
    role: z
    text: 煩而民不擾所以為可若先自處以
  - page: 116
    col: 15
    role: z
    text: 簡則中無主而自治踈矣而所行又
  - page: 116
    col: 16
    role: z
    text: 簡豈不失之太簡而無法度之可守
  - page: 117
    col: 1
    role: z
    text: 乎家語記伯子不衣冠而處夫子譏
  - page: 117
    col: 2
    role: z
    text: 其欲同人道於牛馬然則伯子蓋大
  - page: 117
    col: 3
    role: z
    text: 簡者而仲弓疑夫子之過許與
  - page: 117
    col: 4
    role: j
    text: 子曰雍之言然
  - page: 117
    col: 5
    role: z
    text: 仲弓蓋未喻夫子可字之意而其所
  - page: 117
    col: 6
    role: z
    text: 言之理有默契焉者故夫子然之○
  - page: 117
    col: 7
    role: z
    text: 程子曰子桑伯子之簡雖可取而未
  - page: 117
    col: 8
    role: z
    text: 盡善故夫子云可也仲弓因言内主
  - page: 117
    col: 9
    role: z
    text: 於敬而簡則爲要直内存乎簡而簡
  - page: 117
    col: 10
    role: z
    text: 則爲疎略可謂得其旨矣又曰居敬
  - page: 117
    col: 11
    role: z
    text: 則心中無物故所行自簡居簡則先
  - page: 117
    col: 12
    role: z
    text: 有心於簡而多一簡字矣故曰大簡
  - page: 117
    col: 13
    role: j
    text: 哀公問弟子孰爲好學孔子對曰有顔
  - page: 117
    col: 14
    role: j
    text: 回者好學不遷怒不貳過不幸短命死
  - page: 117
    col: 15
    role: j
    text: 矣今也則亡未聞好學者也
  - page: 117
    col: 16
    role: z
    text: 好去聲亡與無同○遷移也貳復也
  - page: 118
    col: 1
    role: j
    text: 怒於甲者不移於乙過於前者不復
  - page: 118
    col: 2
    role: j
    text: 於後顏子克己之功至於如此可謂
  - page: 118
    col: 3
    role: j
    text: 眞好學矣短命者顏子三十二而卒
  - page: 118
    col: 4
    role: j
    text: 也旣云今也則亡又言未聞好學者
  - page: 118
    col: 5
    role: j
    text: 蓋深惜之又以見眞好學者之難得
  - page: 118
    col: 6
    role: j
    text: 也○程子曰顏子之怒在物不在己
  - page: 118
    col: 7
    role: j
    text: 故不遷有不善未嘗不知知之未嘗
  - page: 118
    col: 8
    role: j
    text: 復行不貳過也又曰喜怒在事則理
  - page: 118
    col: 9
    role: j
    text: 之當喜怒者也不在血氣則不遷若
  - page: 118
    col: 10
    role: j
    text: 舜之誅四凶也可怒在彼己何與焉
  - page: 118
    col: 11
    role: j
    text: 如鑑之照物妍媸在彼隨物應之而
  - page: 118
    col: 12
    role: j
    text: 已何遷之有又曰如顏子地位豈有
  - page: 118
    col: 13
    role: j
    text: 不善所謂不善只是微有差失才差
  - page: 118
    col: 14
    role: j
    text: 失便能知之才知之便更不萌作○張
  - page: 118
    col: 15
    role: j
    text: 子曰慊於己者不使萌於再或曰詩
  - page: 118
    col: 16
    role: j
    text: 書六藝七十子非不習而通也而夫
  - page: 119
    col: 1
    role: j
    text: 子獨稱顏子為好學顏子之所好果
  - page: 119
    col: 2
    role: j
    text: 何學歟○程子曰學以至乎聖人之
  - page: 119
    col: 3
    role: j
    text: 道也學之道奈何曰天地儲精得五
  - page: 119
    col: 4
    role: j
    text: 行之秀者為人其本也眞而靜其未
  - page: 119
    col: 5
    role: j
    text: 發也五性具焉曰仁義禮智信形旣
  - page: 119
    col: 6
    role: j
    text: 生矣外物觸其形而動於中矣其中
  - page: 119
    col: 7
    role: j
    text: 動而七情出焉曰喜怒哀懼愛惡欲
  - page: 119
    col: 8
    role: j
    text: 情旣熾而益蕩其性鑿矣故覺者約
  - page: 119
    col: 9
    role: j
    text: 其情使合於中正其心養其性而已
  - page: 119
    col: 10
    role: j
    text: 然必先明諸心知所徃然後力行以
  - page: 119
    col: 11
    role: j
    text: 求至焉若顏子之非禮勿視聽言動
  - page: 119
    col: 12
    role: j
    text: 不遷怒貳過者則其好之篤而學之
  - page: 119
    col: 13
    role: j
    text: 得其道也然其未至於聖人者守之
  - page: 119
    col: 14
    role: j
    text: 也非化之也假之以年則不日而化
  - page: 119
    col: 15
    role: j
    text: 矣今人乃謂聖本生知非學可至而
  - page: 119
    col: 16
    role: j
    text: 所以為學者不過記誦文辭之間其
  - page: 120
    col: 1
    role: z
    text: 亦異乎顔子之學矣
  - page: 120
    col: 2
    role: j
    text: 子華使於齊冉子爲其母請粟子曰與
  - page: 120
    col: 3
    role: j
    text: 之釜請益曰與之庾冉子與之粟五秉
  - page: 120
    col: 4
    role: z
    text: 使爲並去聲○子華公西赤也使爲
  - page: 120
    col: 5
    role: z
    text: 孔子使也釜六斗四升庾十六斗秉
  - page: 120
    col: 6
    role: z
    text: 十六斛
  - page: 120
    col: 7
    role: j
    text: 子曰赤之適齊也乘肥馬衣輕裘吾聞
  - page: 120
    col: 8
    role: j
    text: 之也君子周急不繼富
  - page: 120
    col: 9
    role: z
    text: 衣去聲○乘肥馬衣輕裘言其富也
  - page: 120
    col: 10
    role: z
    text: 急窮迫也周者補不足繼者續有餘
  - page: 120
    col: 11
    role: j
    text: 原思爲之宰與之粟九百辭
  - page: 120
    col: 12
    role: z
    text: 原思孔子弟子名憲孔子爲魯司冦
  - page: 120
    col: 13
    role: z
    text: 時以思爲宰粟宰之禄也九百不言
  - page: 120
    col: 14
    role: z
    text: 其量不可考
  - page: 120
    col: 15
    role: j
    text: 子曰毋以與爾鄰里鄉黨乎
  - page: 120
    col: 16
    role: z
    text: 毋禁止辭五家爲鄰二十五家爲里
  - page: 121
    col: 1
    role: z
    text: 萬二千五百家爲鄉五百家爲黨言
  - page: 121
    col: 2
    role: z
    text: 常祿不當辭有餘自可推之以周貧
  - page: 121
    col: 3
    role: z
    text: 乏蓋鄰里鄉黨有相周之義○程子
  - page: 121
    col: 4
    role: z
    text: 曰夫子之使子華子華之爲夫子使
  - page: 121
    col: 5
    role: z
    text: 義也而冉子乃爲之請聖人寬容不
  - page: 121
    col: 6
    role: z
    text: 欲直拒人故與之少所以示不當與
  - page: 121
    col: 7
    role: z
    text: 也請益而與之亦少所以示不當益
  - page: 121
    col: 8
    role: z
    text: 也求未達而自與之多則已過矣故
  - page: 121
    col: 9
    role: z
    text: 夫子非之蓋赤苟至乏則夫子必自
  - page: 121
    col: 10
    role: z
    text: 周之不待請矣原思爲宰則有常祿
  - page: 121
    col: 11
    role: z
    text: 思辭其多故又教以分諸鄰里之貧
  - page: 121
    col: 12
    role: z
    text: 者蓋亦莫非義也○張子曰於斯二
  - page: 121
    col: 13
    role: z
    text: 者可見聖人之用財矣
  - page: 121
    col: 14
    role: j
    text: 子謂仲弓曰犂牛之子騂且角雖欲勿
  - page: 121
    col: 15
    role: j
    text: 用山川其舍諸
  - page: 121
    col: 16
    role: z
    text: 犂利之反騂息營反舍上聲○犂雜
  - page: 122
    col: 1
    role: z
    text: 文騂赤色周人尚赤牲用騂角角周
  - page: 122
    col: 2
    role: z
    text: 正中犧牲也用用以祭也山川山川
  - page: 122
    col: 3
    role: z
    text: 之神也言人雖不用神必不舎也仲
  - page: 122
    col: 4
    role: z
    text: 弓父賤而行惡故夫子以此譬之言
  - page: 122
    col: 5
    role: z
    text: 父之惡不能廢其子之善如仲弓之
  - page: 122
    col: 6
    role: z
    text: 賢自當見用於丗也然此論仲弓云
  - page: 122
    col: 7
    role: z
    text: 爾非與仲弓言也○范氏曰以瞽叟
  - page: 122
    col: 8
    role: z
    text: 爲父而有舜以鯀爲父而有禹古之
  - page: 122
    col: 9
    role: z
    text: 聖賢不係於丗類尚矣子能改父之
  - page: 122
    col: 10
    role: z
    text: 過變惡以爲美則可謂孝矣
  - page: 122
    col: 11
    role: j
    text: 子曰回也其心三月不違仁其餘則日
  - page: 122
    col: 12
    role: j
    text: 月至焉而已矣
  - page: 122
    col: 13
    role: z
    text: 三月言其乆仁者心之德心不違仁
  - page: 122
    col: 14
    role: z
    text: 者無私欲而有其德也日月至焉者
  - page: 122
    col: 15
    role: z
    text: 或日一至焉或月一至焉能造其域
  - page: 122
    col: 16
    role: z
    text: 而不能乆也○程子曰三月天道小
  - page: 123
    col: 1
    role: z
    text: 變之節言其乆也過此則聖人矣不
  - page: 123
    col: 2
    role: z
    text: 違仁只是無纖毫私欲少有私欲便
  - page: 123
    col: 3
    role: j
    text: 是不仁○尹氏曰此顔子於聖人未達
  - page: 123
    col: 4
    role: z
    text: 一間者也若聖人則渾然無間斷矣
  - page: 123
    col: 5
    role: z
    text: 張子曰始學之要當知三月不違與
  - page: 123
    col: 6
    role: z
    text: 日月至焉内外賔主之辨使心意勉
  - page: 123
    col: 7
    role: z
    text: 勉循循而不能已過此幾非在我者
  - page: 123
    col: 8
    role: j
    text: 季康子問仲由可使從政也與子曰由
  - page: 123
    col: 9
    role: j
    text: 也果於從政乎何有曰賜也可使從政
  - page: 123
    col: 10
    role: j
    text: 也與曰賜也達於從政乎何有曰求也
  - page: 123
    col: 11
    role: j
    text: 可使從政也與曰求也藝於從政乎何
  - page: 123
    col: 12
    role: j
    text: 有
  - page: 123
    col: 13
    role: z
    text: 與平聲○從政謂為大夫果有決斷
  - page: 123
    col: 14
    role: j
    text: 達通事理藝多才能○程子曰季康子
  - page: 123
    col: 15
    role: z
    text: 問三子之才可以從政乎夫子答以
  - page: 123
    col: 16
    role: z
    text: 各有所長非惟三子人各有所長能
  - page: 124
    col: 1
    role: j
    text: 取其長皆可用也
  - page: 124
    col: 2
    role: j
    text: 季氏使閔子騫爲費宰閔子騫曰善爲
  - page: 124
    col: 3
    role: j
    text: 我辭焉如有復我者則吾必在汶上矣
  - page: 124
    col: 4
    role: z
    text: 費音秘爲去聲汶音問○閔子騫孔
  - page: 124
    col: 5
    role: z
    text: 子弟子名損費季氏邑汶水名在齊
  - page: 124
    col: 6
    role: z
    text: 者善爲己辭言若再來召我則當去
  - page: 124
    col: 7
    role: z
    text: 之齊○程子曰仲尼之門能不仕大
  - page: 124
    col: 9
    role: z
    text: 夫之家者閔子曾子數人而已○謝
  - page: 124
    col: 10
    role: z
    text: 氏曰學者能少知內外之分皆可以
  - page: 124
    col: 11
    role: z
    text: 樂道而忘人之勢況閔子得聖人爲
  - page: 124
    col: 12
    role: z
    text: 之依歸彼其視季氏不義之富貴不
  - page: 124
    col: 13
    role: z
    text: 啻犬彘又從而臣之豈其心哉在聖
  - page: 124
    col: 14
    role: z
    text: 人則有不然者蓋居亂邦見惡人在
  - page: 124
    col: 15
    role: z
    text: 聖人則可自聖人以下剛則必取禍
  - page: 124
    col: 16
    role: z
    text: 柔則必取辱閔子豈不能早見而豫
  - page: 125
    col: 1
    role: j
    text: 待之乎如由也不得其死求也為季
  - page: 125
    col: 2
    role: j
    text: 氏附益夫豈其本心哉蓋既無先見
  - page: 125
    col: 3
    role: j
    text: 之知又無克亂之才故也然則閔子
  - page: 125
    col: 4
    role: z
    text: 其賢乎
  - page: 125
    col: 5
    role: j
    text: 伯牛有疾子問之自牖執其手曰亡之
  - page: 125
    col: 6
    role: j
    text: 命矣夫斯人也而有斯疾也斯人也而
  - page: 125
    col: 7
    role: j
    text: 有斯疾也
  - page: 125
    col: 8
    role: z
    text: 夫音扶○伯牛孔子弟子姓冉名耕
  - page: 125
    col: 9
    role: j
    text: 有疾先儒以為癩也牖南牖也禮病
  - page: 125
    col: 10
    role: j
    text: 者居北牖下君視之則遷於南牖下
  - page: 125
    col: 11
    role: j
    text: 使君得以南面視己時伯牛家以此
  - page: 125
    col: 12
    role: j
    text: 禮尊孔子孔子不敢當故不入其室
  - page: 125
    col: 13
    role: j
    text: 而自牖執其手蓋與之永訣也命謂
  - page: 125
    col: 14
    role: j
    text: 天命言此人不應有此疾而今乃有
  - page: 125
    col: 15
    role: j
    text: 之是乃天之所命也然則非其不能
  - page: 125
    col: 16
    role: j
    text: 謹疾而有以致之亦可見矣○侯氏
  - page: 126
    col: 1
    role: z
    text: 曰伯牛以德行稱亞於顏閔故其將
  - page: 126
    col: 2
    role: z
    text: 死也孔子尤痛惜之
  - page: 126
    col: 3
    role: j
    text: 子曰賢哉回也一簞食一瓢飲在陋巷
  - page: 126
    col: 4
    role: j
    text: 人不堪其憂回也不改其樂賢哉回也
  - page: 126
    col: 5
    role: z
    text: 食音嗣樂音洛○簞竹器食飯也瓢
  - page: 126
    col: 6
    role: z
    text: 瓠也顏子之貧如此而處之泰然不
  - page: 126
    col: 7
    role: z
    text: 以害其樂故夫子再言賢哉回也以
  - page: 126
    col: 8
    role: z
    text: 深歎美之○程子曰顏子之樂非樂
  - page: 126
    col: 9
    role: z
    text: 簞瓢陋巷也不以貧窶累其心而改
  - page: 126
    col: 10
    role: z
    text: 其所樂也故夫子稱其賢又曰簞瓢
  - page: 126
    col: 11
    role: z
    text: 陋巷非可樂蓋自有其樂爾其字當
  - page: 126
    col: 12
    role: z
    text: 玩味自有深意又曰昔受學於周茂
  - page: 126
    col: 13
    role: z
    text: 叔每令尋仲尼顏子樂處所樂何事
  - page: 126
    col: 14
    role: z
    text: 愚按程子之言引而不發蓋欲學者
  - page: 126
    col: 15
    role: z
    text: 深思而自得之今亦不敢妄爲之說
  - page: 126
    col: 16
    role: z
    text: 學者但當從事於博文約禮之誨以
  - page: 127
    col: 1
    role: z
    text: 至於欲罷不能而竭其才則庶乎有
  - page: 127
    col: 2
    role: z
    text: 以得之矣
  - page: 127
    col: 3
    role: j
    text: 冉求曰非不說子之道力不足也子曰
  - page: 127
    col: 4
    role: j
    text: 力不足者中道而廢今女畫
  - page: 127
    col: 5
    role: z
    text: 說音悅女音汝○力不足者欲進而
  - page: 127
    col: 6
    role: z
    text: 不能畫者能進而不欲謂之畫者如
  - page: 127
    col: 7
    role: z
    text: 畫地以自限也○胡氏曰夫子稱顏
  - page: 127
    col: 8
    role: z
    text: 回不改其樂冉求聞之故有是言然
  - page: 127
    col: 9
    role: z
    text: 使求悅夫子之道誠如口之說芻豢
  - page: 127
    col: 10
    role: z
    text: 則必將盡力以求之何患力之不足
  - page: 127
    col: 11
    role: z
    text: 哉畫而不進則日退而已矣此冉求
  - page: 127
    col: 12
    role: z
    text: 之所以局於藝也
  - page: 127
    col: 13
    role: j
    text: 子謂子夏曰女為君子儒無為小人儒
  - page: 127
    col: 14
    role: z
    text: 儒學者之稱○程子曰君子儒為己
  - page: 127
    col: 15
    role: z
    text: 小人儒為人○謝氏曰君子小人之
  - page: 127
    col: 16
    role: z
    text: 分義與利之間而已然所謂利者豈
  - page: 128
    col: 1
    role: z
    text: 必殖貨財之謂以私滅公適己自便
  - page: 128
    col: 2
    role: z
    text: 凡可以害天理者皆利也子夏文學
  - page: 128
    col: 3
    role: z
    text: 雖有餘然意其遠者大者或昧焉故
  - page: 128
    col: 4
    role: z
    text: 夫子語之以此
  - page: 128
    col: 5
    role: j
    text: 子游爲武城宰子曰女得人焉爾乎曰
  - page: 128
    col: 6
    role: j
    text: 有澹臺滅明者行不由徑非公事未嘗
  - page: 128
    col: 7
    role: j
    text: 至於偃之室也
  - page: 128
    col: 8
    role: z
    text: 女音汝澹徒甘反○武城魯下邑澹
  - page: 128
    col: 9
    role: z
    text: 臺姓滅明名字子羽徑路之小而捷
  - page: 128
    col: 10
    role: z
    text: 者公事如飲射讀法之類不由徑則
  - page: 128
    col: 11
    role: z
    text: 動必以正而無見小欲速之意可知
  - page: 128
    col: 12
    role: z
    text: 非公事不見邑宰則其有以自守而
  - page: 128
    col: 13
    role: z
    text: 無枉己徇人之私可見矣○楊氏曰
  - page: 128
    col: 14
    role: z
    text: 爲政以人才爲先故孔子以得人爲
  - page: 128
    col: 15
    role: z
    text: 問如滅明者觀其二事之小而其正
  - page: 128
    col: 16
    role: z
    text: 大之情可見矣後世有不由徑者人
  - page: 129
    col: 1
    role: z
    text: 必以為迂不至其室人必以為簡非
  - page: 129
    col: 2
    role: z
    text: 孔氏之徒其孰能知而取之愚謂持
  - page: 129
    col: 3
    role: z
    text: 身以滅明為法則無苟賤之羞取人
  - page: 129
    col: 4
    role: z
    text: 以子游為法則無邪媚之惑
  - page: 129
    col: 5
    role: j
    text: 子曰孟之反不伐奔而殿將入門策其
  - page: 129
    col: 6
    role: j
    text: 馬曰非敢後也馬不進也
  - page: 129
    col: 7
    role: j
    text: 殿去聲○孟之反魯大夫名側○胡氏
  - page: 129
    col: 8
    role: z
    text: 曰反即莊周所稱孟子反者是也伐
  - page: 129
    col: 9
    role: z
    text: 誇功也奔敗走也軍後曰殿策鞭也
  - page: 129
    col: 10
    role: z
    text: 戰敗而還以後為功反奔而殿故以
  - page: 129
    col: 11
    role: z
    text: 此言自揜其功也事在哀公十一年
  - page: 129
    col: 12
    role: z
    text: ○謝氏曰人能操無欲上人之心則
  - page: 129
    col: 13
    role: z
    text: 人欲日消天理日明而凡可以矜己
  - page: 129
    col: 14
    role: z
    text: 誇人者皆無足道矣然不知學者欲
  - page: 129
    col: 15
    role: z
    text: 上人之心無時而忘也若孟之反可
  - page: 129
    col: 16
    role: z
    text: 以為法矣
  - page: 130
    col: 1
    role: j
    text: 子曰不有祝鮀之佞而有宋朝之美難
  - page: 130
    col: 2
    role: j
    text: 乎免於今之世矣
  - page: 130
    col: 3
    role: z
    text: 鮀徒河反○祝宗廟之官鮀衛大夫
  - page: 130
    col: 4
    role: z
    text: 字子魚有口才朝宋公子有美色言
  - page: 130
    col: 5
    role: z
    text: 衰世好諛悅色非此難免蓋傷之也
  - page: 130
    col: 6
    role: j
    text: 子曰誰能出不由户何莫由斯道也
  - page: 130
    col: 7
    role: z
    text: 言人不能出不由户何故乃不由此
  - page: 130
    col: 8
    role: z
    text: 道耶怪而歎之之辭○洪氏曰人知
  - page: 130
    col: 9
    role: z
    text: 出必由户而不知行必由道非道遠
  - page: 130
    col: 10
    role: z
    text: 人人自遠爾
  - page: 130
    col: 11
    role: j
    text: 子曰質勝文則野文勝質則史文質彬
  - page: 130
    col: 12
    role: j
    text: 彬然後君子
  - page: 130
    col: 13
    role: z
    text: 野野人言鄙略也史掌文書多聞習
  - page: 130
    col: 14
    role: z
    text: 事而誠或不足也彬彬猶班班物相
  - page: 130
    col: 15
    role: z
    text: 雜而適均之貌言學者當損有餘補
  - page: 130
    col: 16
    role: z
    text: 不足至於成德則不期然而然矣○
  - page: 131
    col: 1
    role: z
    text: 楊氏曰文質不可以相勝然質之勝
  - page: 131
    col: 2
    role: z
    text: 文猶之甘可以受和白可以受采也
  - page: 131
    col: 3
    role: z
    text: 文勝而至於滅質則其本亡矣雖有
  - page: 131
    col: 4
    role: z
    text: 文將安施乎然則與其史也寧野
  - page: 131
    col: 5
    role: j
    text: 子曰人之生也直罔之生也幸而免
  - page: 131
    col: 6
    role: z
    text: 程子曰生理本直罔不直也而亦生
  - page: 131
    col: 7
    role: z
    text: 者幸而免爾
  - page: 131
    col: 8
    role: j
    text: 子曰知之者不如好之者好之者不如
  - page: 131
    col: 9
    role: j
    text: 樂之者
  - page: 131
    col: 10
    role: z
    text: 好去聲樂音洛○尹氏曰知之者知
  - page: 131
    col: 11
    role: z
    text: 有此道也好之者好而未得也樂之
  - page: 131
    col: 12
    role: z
    text: 者有所得而樂之也○張敬夫曰譬
  - page: 131
    col: 13
    role: z
    text: 之五穀知者知其可食者也好者食
  - page: 131
    col: 14
    role: z
    text: 而嗜之者也樂者嗜之而飽者也知
  - page: 131
    col: 15
    role: z
    text: 而不能好則是知之未至也好之而
  - page: 131
    col: 16
    role: z
    text: 未及於樂則是好之未至也此古之
  - page: 132
    col: 1
    role: z
    text: 學者所以自強而不息者與
  - page: 132
    col: 2
    role: j
    text: 子曰中人以上可以語上也中人以下
  - page: 132
    col: 3
    role: j
    text: 不可以語上也
  - page: 132
    col: 4
    role: z
    text: 以上之上上聲語去聲○語告也言
  - page: 132
    col: 5
    role: z
    text: 教人者當隨其髙下而告語之則其
  - page: 132
    col: 6
    role: z
    text: 言易入而無躐等之弊也○張敬夫
  - page: 132
    col: 7
    role: z
    text: 曰聖人之道精粗雖無二致但其施
  - page: 132
    col: 8
    role: z
    text: 教則必因其材而篤焉蓋中人以下
  - page: 132
    col: 9
    role: z
    text: 之質驟而語之太髙非惟不能以入
  - page: 132
    col: 10
    role: z
    text: 且將妄意躐等而有不切於身之弊
  - page: 132
    col: 11
    role: z
    text: 亦終於下而已矣故就其所及而語
  - page: 132
    col: 12
    role: z
    text: 之是乃所以使之切問近思而漸進
  - page: 132
    col: 13
    role: z
    text: 於髙遠也
  - page: 132
    col: 14
    role: j
    text: 樊遲問知子曰務民之義敬鬼神而遠
  - page: 132
    col: 15
    role: j
    text: 之可謂知矣問仁曰仁者先難而後獲
  - page: 132
    col: 16
    role: j
    text: 可謂仁矣
  - page: 133
    col: 1
    role: z
    text: 知遠皆去聲○民亦人也獲謂得也
  - page: 133
    col: 2
    role: z
    text: 專用力於人道之宜而不惑於鬼
  - page: 133
    col: 3
    role: z
    text: 神之不可知知者之事也先其事之
  - page: 133
    col: 4
    role: z
    text: 所難而後其効之所得仁者之心也
  - page: 133
    col: 5
    role: z
    text: 此必因樊遲之失而告之○程子曰
  - page: 133
    col: 6
    role: z
    text: 人多信鬼神惑也而不信者又不能
  - page: 133
    col: 7
    role: z
    text: 敬能敬能遠可謂知矣又曰先難克
  - page: 133
    col: 8
    role: z
    text: 己也以所難爲先而不計所獲仁也
  - page: 133
    col: 9
    role: z
    text: 吕氏曰當務爲急不求所難知力行
  - page: 133
    col: 10
    role: z
    text: 所知不憚所難爲
  - page: 133
    col: 11
    role: j
    text: 子曰知者樂水仁者樂山知者動仁者
  - page: 133
    col: 12
    role: j
    text: 靜知者樂仁者壽
  - page: 133
    col: 13
    role: z
    text: 知去聲樂上二字並五教反下一字
  - page: 133
    col: 14
    role: z
    text: 音洛○樂喜好也知者達於事理而
  - page: 133
    col: 15
    role: z
    text: 周流無滯有似於水故樂水仁者安
  - page: 133
    col: 16
    role: z
    text: 於義理而厚重不遷有似於山故樂
  - page: 134
    col: 1
    role: z
    text: 山動靜以體言樂壽以効言也動而
  - page: 134
    col: 2
    role: z
    text: 不括故樂靜而有常故壽○程子曰
  - page: 134
    col: 3
    role: z
    text: 非體仁智之深者不能如此形容之
  - page: 134
    col: 4
    role: j
    text: 子曰齊一變至於魯魯一變至於道
  - page: 134
    col: 5
    role: z
    text: 孔子之時齊俗急功利喜夸詐乃霸
  - page: 134
    col: 6
    role: z
    text: 政之餘習魯則重禮教崇信義猶有
  - page: 134
    col: 7
    role: z
    text: 先王之遺風焉但人亡政息不能無
  - page: 134
    col: 8
    role: z
    text: 廢墜爾道則先王之道也言二國之
  - page: 134
    col: 9
    role: z
    text: 政俗有美惡故其變而之道有難易
  - page: 134
    col: 10
    role: z
    text: ○程子曰夫子之時齊彊魯弱孰不
  - page: 134
    col: 11
    role: z
    text: 以為齊勝魯也然魯猶存周公之法
  - page: 134
    col: 12
    role: z
    text: 制齊由威公之霸為從簡尚功之治
  - page: 134
    col: 13
    role: z
    text: 太公之遺法變易盡矣故一變乃能
  - page: 134
    col: 14
    role: z
    text: 至魯魯則修舉廢墜而已一變則至
  - page: 134
    col: 15
    role: z
    text: 於先王之道也愚謂二國之俗唯夫
  - page: 134
    col: 16
    role: z
    text: 子為能變之而不得試然因其言以
  - page: 135
    col: 1
    role: z
    text: 考之則其施為緩急之序亦略可見
  - page: 135
    col: 2
    role: z
    text: 矣
  - page: 135
    col: 3
    role: j
    text: 子曰觚不觚觚哉觚哉
  - page: 135
    col: 4
    role: z
    text: 觚音孤○觚稜也或曰酒器或曰木
  - page: 135
    col: 5
    role: z
    text: 簡皆器之有稜者也不觚者蓋當時
  - page: 135
    col: 6
    role: z
    text: 失其制而不為稜也觚哉觚哉言不
  - page: 135
    col: 7
    role: z
    text: 得為觚也○程子曰觚而失其形制
  - page: 135
    col: 8
    role: z
    text: 則非觚也舉一器而天下之物莫不
  - page: 135
    col: 9
    role: z
    text: 皆然故君而失其君之道則為不君
  - page: 135
    col: 10
    role: j
    text: 臣而失其臣之職則為虛位○范氏曰
  - page: 135
    col: 11
    role: z
    text: 人而不仁則非人國而不治則不國
  - page: 135
    col: 12
    role: z
    text: 矣
  - page: 135
    col: 13
    role: j
    text: 宰我問曰仁者雖告之曰井有仁焉其
  - page: 135
    col: 14
    role: j
    text: 從之也子曰何為其然也君子可逝也
  - page: 135
    col: 15
    role: j
    text: 不可陷也可欺也不可罔也
  - page: 135
    col: 16
    role: z
    text: 劉聘君曰有仁之仁當作人今從之
  - page: 136
    col: 1
    role: z
    text: 從謂隨之於井而救之也宰我信道
  - page: 136
    col: 2
    role: z
    text: 不篤而憂爲仁之蹈害故有此問逝
  - page: 136
    col: 3
    role: z
    text: 謂使之徃救陷謂陷之於井欺謂誑
  - page: 136
    col: 4
    role: z
    text: 之以理之所有罔謂昧之以理之所
  - page: 136
    col: 5
    role: z
    text: 無蓋身在井上乃可以救井中之人
  - page: 136
    col: 6
    role: z
    text: 若從之於井則不復能救之矣此理
  - page: 136
    col: 7
    role: z
    text: 甚明人所易曉仁者雖切於救人而
  - page: 136
    col: 8
    role: z
    text: 不私其身然不應如此之愚也
  - page: 136
    col: 9
    role: j
    text: 子曰君子愽學於文約之以禮亦可以
  - page: 136
    col: 10
    role: j
    text: 弗畔矣夫
  - page: 136
    col: 11
    role: z
    text: 夫音扶○約要也畔背也君子學欲
  - page: 136
    col: 12
    role: z
    text: 其愽故於文無不考守欲其要故其
  - page: 136
    col: 13
    role: z
    text: 動必以禮如此則可以不背於道矣
  - page: 136
    col: 14
    role: z
    text: ○程子曰愽學於文而不約之以禮
  - page: 136
    col: 15
    role: z
    text: 必至於汗漫愽學矣又能守禮而由
  - page: 136
    col: 16
    role: z
    text: 於規矩則亦可以不畔道矣
  - page: 137
    col: 1
    role: j
    text: 子見南子子路不說夫子矢之曰予所
  - page: 137
    col: 2
    role: j
    text: 否者天厭之天厭之
  - page: 137
    col: 3
    role: j
    text: 說音悅否方九反○南子衛靈公之
  - page: 137
    col: 4
    role: j
    text: 夫人有淫行孔子至衛南子請見孔
  - page: 137
    col: 5
    role: j
    text: 子辭謝不得已而見之蓋古者仕於
  - page: 137
    col: 6
    role: j
    text: 其國有見其小君之禮而子路以夫
  - page: 137
    col: 7
    role: j
    text: 子見此淫亂之人爲辱故不悅矢誓也
  - page: 137
    col: 8
    role: j
    text: 也所誓辭也如云所不與崔慶者之
  - page: 137
    col: 9
    role: z
    text: 類否謂不合於禮不由其道也厭棄
  - page: 137
    col: 10
    role: z
    text: 絕也聖人道大德全無可不可其見
  - page: 137
    col: 11
    role: z
    text: 惡人固謂在我有可見之禮則彼之
  - page: 137
    col: 12
    role: z
    text: 不善我何與焉然此豈子路所能測
  - page: 137
    col: 13
    role: z
    text: 哉故重言以誓之欲其姑信此而深
  - page: 137
    col: 14
    role: z
    text: 思以得之也
  - page: 137
    col: 15
    role: j
    text: 子曰中庸之爲德也其至矣乎民鮮乆
  - page: 137
    col: 16
    role: j
    text: 矣
  - page: 138
    col: 1
    role: z
    text: 鮮上聲○中者無過無不及之名庸
  - page: 138
    col: 2
    role: z
    text: 平常也至極也鮮少也言民少此德
  - page: 138
    col: 3
    role: z
    text: 今已乆矣○程子曰不偏之謂中不
  - page: 138
    col: 4
    role: z
    text: 易之謂庸中者天下之正道庸者天
  - page: 138
    col: 5
    role: z
    text: 下之定理自世教衰民不興於行少
  - page: 138
    col: 6
    role: z
    text: 有此德乆矣
  - page: 138
    col: 7
    role: j
    text: 子貢曰如有博施於民而能濟衆何如
  - page: 138
    col: 8
    role: j
    text: 可謂仁乎子曰何事於仁必也聖乎堯
  - page: 138
    col: 9
    role: j
    text: 舜其猶病諸
  - page: 138
    col: 10
    role: z
    text: 施去聲○博廣也仁以理言通乎上
  - page: 138
    col: 11
    role: z
    text: 下聖以地言則造其極之名也乎者
  - page: 138
    col: 12
    role: z
    text: 疑而未定之辭病心有所不足也言
  - page: 138
    col: 13
    role: z
    text: 此何止於仁必也聖人能之乎則雖
  - page: 138
    col: 14
    role: z
    text: 堯舜之聖其心猶有所不足於此也
  - page: 138
    col: 15
    role: z
    text: 以是求仁愈難而愈逺矣
  - page: 138
    col: 16
    role: j
    text: 夫仁者己欲立而立人己欲達而達人
  - page: 139
    col: 1
    role: z
    text: 夫音扶。以己及人仁者之心也於
  - page: 139
    col: 2
    role: z
    text: 此觀之可以見天理之周流而無間
  - page: 139
    col: 3
    role: z
    text: 矣狀仁之體莫切於此
  - page: 139
    col: 4
    role: j
    text: 能近取譬可謂仁之方也已
  - page: 139
    col: 5
    role: z
    text: 譬喻也方術也近取諸身以己所欲
  - page: 139
    col: 6
    role: z
    text: 譬之他人知其所欲亦猶是也然後
  - page: 139
    col: 7
    role: z
    text: 推其所欲以及於人則恕之事而仁
  - page: 139
    col: 8
    role: z
    text: 之術也於此勉焉則有以勝其人欲
  - page: 139
    col: 9
    role: z
    text: 之私而全其天理之公矣。程子曰
  - page: 139
    col: 10
    role: z
    text: 醫書以手足痿痺為不仁此言最善
  - page: 139
    col: 11
    role: z
    text: 名狀仁者以天地萬物為一體莫非
  - page: 139
    col: 12
    role: z
    text: 己也認得為己何所不至若不屬己
  - page: 139
    col: 13
    role: z
    text: 自與己不相干如手足之不仁氣已
  - page: 139
    col: 14
    role: z
    text: 不貫皆不屬己故博施濟衆乃聖人
  - page: 139
    col: 15
    role: z
    text: 之功用仁至難言故止曰己欲立而
  - page: 139
    col: 16
    role: z
    text: 立人己欲達而達人能近取譬可謂
  - page: 140
    col: 1
    role: j
    text: 仁之方也已欲令如是觀仁可以得
  - page: 140
    col: 2
    role: j
    text: 仁之體又曰論語言堯舜其猶病諸
  - page: 140
    col: 3
    role: j
    text: 者二夫博施者豈非聖人之所欲然
  - page: 140
    col: 4
    role: j
    text: 必五十乃衣帛七十乃食肉聖人之
  - page: 140
    col: 5
    role: j
    text: 心非不欲少者亦衣帛食肉也顧其
  - page: 140
    col: 6
    role: j
    text: 養有所不贍爾此病其施之不博也
  - page: 140
    col: 7
    role: j
    text: 濟衆者豈非聖人之所欲然治不過
  - page: 140
    col: 8
    role: j
    text: 九州聖人非不欲四海之外亦兼濟
  - page: 140
    col: 9
    role: j
    text: 也顧其治有所不及爾此病其濟之
  - page: 140
    col: 10
    role: j
    text: 不衆也推此以求修己以安百姓則
  - page: 140
    col: 11
    role: j
    text: 爲病可知苟以吾治已足則便不是
  - page: 140
    col: 12
    role: j
    text: 聖人○吕氏曰子貢有志於仁徒事
  - page: 140
    col: 13
    role: j
    text: 高遠未知其方孔子教以於己取之
  - page: 140
    col: 14
    role: j
    text: 庶近而可入是乃爲仁之方雖博施
  - page: 140
    col: 15
    role: j
    text: 濟衆亦由此進
