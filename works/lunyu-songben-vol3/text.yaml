# 论语集注卷三（当涂郡斋刊递修本·善本底）：j 为经传大字，z 为章句小字。版面结构先行：顶格经/退格注。
sections:
  - id: pian1
    name: 公冶長第五
    blocks:
      - { type: j, text: 此篇皆論古今人物賢否得失蓋格物窮理之一端也凡二十七章胡氏 }
      - { type: z, text: 以為疑多子貢之徒所記云 }
      - { type: j, text: 子謂公冶長可妻也雖在縲絏之中非其罪也以其子妻之 }
      - { type: z, text: 妻去聲下同縲力追反絏息列反○公冶長孔子弟子妻為之妻也縲黑索也絏攣也古者獄中以黑索拘攣罪人長之為人無所考而夫子稱其可妻其必有以取之矣又言其人雖甞陷於縲絏之中而非其罪則固無害於可妻也夫有罪無罪在我而已豈以自外至者為榮辱哉 }
      - { type: j, text: 子謂南容邦有道不廢邦無道免於刑戮以其兄之子妻之南容孔子弟子居南宮名縚又名括字 }
      - { type: z, text: 子容謚敬叔孟懿子之兄也不廢言必見用也以其謹於言行故能見用於治朝免禍於亂世也事又見第十一篇○或曰公冶長之賢不及南容故聖人以其子妻長而以兄子妻容蓋厚於兄而薄於己也○程子曰此以己之私心窺聖人也凡人避嫌者皆内不足也聖人自至公何避嫌之有况嫁女必量其才而求配尤不當有所避也若孔子之事則其年之長幼時之先後皆不可知唯以爲避嫌則大不可避嫌之事賢者且不爲况聖人乎 }
      - { type: j, text: 子謂子賤君子哉若人魯無君子者斯焉取斯 }
      - { type: z, text: 焉於虔反○子賤孔子弟子姓宓名不齊上斯斯此人下斯斯此德子賤蓋能尊賢取友以成其德者故夫子旣嘆其賢而又言若魯無君子則此人何所取以成此德乎因以見魯之多賢也○蘇氏曰稱人之善必本其父兄師友厚之至也 }
      - { type: j, text: 子貢問曰賜也何如子曰女器也曰何器也曰瑚璉也女音汝瑚音胡璉力展反器者有用之成材夏曰瑚商曰璉周曰簠簋皆宗廟盛黍稷之器而飾以玉器之貴重而華美者也子貢見孔子以君子許子賤故以己爲問而孔子告之以此然則子貢雖未至於不器其亦 }
      - { type: z, text: 器之貴者歟 }
      - { type: j, text: 或曰雍也仁而不佞雍孔子弟子姓冉字仲弓佞口才也仲弓爲人重厚簡默而時人以佞爲賢故美其優於德而病其短於才也子曰焉用佞禦人以口給屢憎於人不知其仁焉用佞焉於虔反禦當也猶應答也給辦 }
      - { type: z, text: 也憎惡也言何用佞乎佞人所以應答人者但以口取辦而無情實徒多爲人所憎惡爾我雖未知仲弓之仁然其不佞乃所以爲賢不足以爲病也再言焉用佞所以深曉之○或疑仲弓之賢而夫子不許其仁何也曰仁道至大非全體而不息者不足以當之如顏子亞聖猶不能無違於三月之後況仲弓雖賢未及顏子聖人固不得而輕許之也 }
      - { type: j, text: 子使漆雕開仕對曰吾斯之未能信子說 }
      - { type: z, text: 說音悅○漆雕開孔子弟子字子若斯指此理而言信謂眞知其如此而無豪髮之疑也開自言未能如此未可以治人故夫子悅其篤志○程子曰漆雕開已見大意故夫子說之又曰古人見道分明故其言如此○謝氏曰開之學無可考然聖人使之仕必其材可以仕矣至於心術之微則一毫不自得不害其爲未信此聖人所不能知而開自知之其材可以仕而其器不安於小成他日所就其可量乎夫子所以說之也 }
      - { type: j, text: 子曰道不行乘桴浮于海從我者其由與子路聞之喜子曰由也好勇過我無所取材 }
      - { type: z, text: 桴音孚從好並去聲與平聲材與裁同古字借用○桴筏也○程子曰浮海之嘆傷天下之無賢君也子路勇於義故謂其能從己皆假設之言耳子路以爲實然而喜夫子之與己故夫子美其勇而譏其不能裁度事理以適於義也 }
      - { type: j, text: 孟武伯問子路仁乎子曰不知也 }
      - { type: z, text: 子路之於仁蓋日月至焉者或在或亡不能必其有無故以不知告之 }
      - { type: j, text: 又問子曰由也千乘之國可使治其賦也不知其仁也 }
      - { type: z, text: 乘去聲○賦兵也古者以田賦出兵故謂兵為賦春秋傳所謂悉索敝賦是也言子路之才可見者如此仁則不能知也 }
      - { type: j, text: 求也何如子曰求也千室之邑百乘之家可使為之宰也不知其仁也 }
      - { type: z, text: 千室大邑百乘卿大夫之家宰邑長家臣之通號 }
      - { type: j, text: 赤也何如子曰赤也束帶立於朝可使與賔客言也不知其仁也 }
      - { type: z, text: 朝音潮○赤孔子弟子姓公西字子華 }
      - { type: j, text: 子謂子貢曰女與回也孰愈 }
      - { type: z, text: 女音汝下同○愈勝也 }
      - { type: j, text: 對曰賜也何敢望回回也聞一以知十賜也聞一以知二 }
      - { type: z, text: 一數之始十數之終二者一之對也顔子明睿所照即始而見終子貢推測而知因此而識彼無所不悅告往知來是其驗矣 }
      - { type: j, text: 子曰弗如也吾與女弗如也 }
      - { type: z, text: 與許也○胡氏曰子貢方人夫子既語以不暇又問其與回孰愈以觀其自知之如何聞一知十上知之資生知之亞也聞一知二中人以上之資學而知之之才也子貢平日以己方回見其不可企及故喻之如此夫子以其自知之明而又不難於自屈故既然之又重許之此其所以終聞性與天道不特聞一知二而已也 }
      - { type: j, text: 宰予晝寢子曰朽木不可雕也糞土之牆不可杇也於予與何誅 }
      - { type: z, text: 朽許乆反杇音汗與平聲下同○晝寢謂當晝而寐朽腐也雕刻畫也杇鏝也言其志氣昏惰教無所施也與語辭誅責也言不足責乃所以深責之 }
      - { type: j, text: 子曰始吾於人也聽其言而信其行今吾於人也聽其言而觀其行於予與改是 }
      - { type: z, text: 行去聲○宰予能言而行不逮故孔子自言於予之事而改此失亦以重警之也胡氏曰子曰疑衍文不然則非一日之言也○范氏曰君子之於學惟日孜孜斃而後已惟恐其不及也宰予晝寢自棄孰甚焉故夫子責 }
      - { type: j, text: 之胡氏曰宰予不能以志帥氣居然 }
      - { type: z, text: 而倦是宴安之氣勝儆戒之志惰也古之聖賢未甞不以懈惰荒寧爲懼勤勵不息自強此孔子所以深責宰予也聽言觀行聖人不待是而後能亦非縁此而盡疑學者特因此立教以警羣弟子使謹於言而敏於行耳 }
      - { type: j, text: 子曰吾未見剛者或對曰申棖子曰棖也慾焉得剛 }
      - { type: z, text: 焉於䖍反○剛堅強不屈之意最人所難能者故夫子歎其未見申棖弟子姓名慾多嗜慾也多嗜慾則不得為剛矣○程子曰人有慾則無剛剛則不屈於慾謝氏曰剛與慾正相反能勝物之謂剛故常伸於萬物之上為物揜之謂慾故常屈於萬物之下自古有志者少無志者多宜夫子之未見也棖之慾不可知其為人得非悻悻自好者乎故或者疑以為剛然不知此其所以為慾爾 }
      - { type: j, text: 子貢曰我不欲人之加諸我也吾亦欲無加諸人子曰賜也非爾所及也 }
      - { type: z, text: 子貢言我所不欲人加於我之事我亦不欲以此加之於人此仁者之事 }
      - { type: j, text: 不待勉強故夫子以為非子貢所及 }
      - { type: z, text: 程子曰我不欲人之加諸我吾亦欲無加諸人仁也施諸己而不願亦勿施於人恕也恕則子貢或能勉之仁則非所及矣愚謂無者自然而然勿者禁止之謂此所以爲仁恕之别 }
      - { type: j, text: 子貢曰夫子之文章可得而聞也夫子之言性與天道不可得而聞也 }
      - { type: z, text: 文章德之見乎外者威儀文辭皆是也性者人所受之天理天道者天理自然之本體其實一理也言夫子之文章日見乎外固學者所共聞至於性與天道則夫子罕言之而學者有不得聞者蓋聖門教不躐等子貢至是始得聞之而嘆其美也○程子曰此子貢聞夫子之至論而嘆美之言也 }
      - { type: j, text: 子路有聞未之能行唯恐有聞 }
      - { type: z, text: 前所聞者既未及行故恐復有所聞而行之不給也○范氏曰子路聞善勇於必行門人自以爲弗及也故著之若子路可謂能用其勇矣 }
      - { type: j, text: 子貢問曰孔文子何以謂之文也子曰敏而好學不恥下問是以謂之文也 }
      - { type: z, text: 好去聲○孔文子衛大夫名圉凡人性敏者多不好學位高者多恥下問故謚法有以勤學好問爲文者蓋亦 }
      - { type: j, text: 人所難也孔圉得謚爲文以此而已 }
      - { type: z, text: 蘇氏曰孔文子使太叔疾出其妻而妻之疾通於初妻之娣文子怒將攻之訪於仲尼仲尼不對命駕而行疾奔宋文子使疾弟遺室孔姞其爲人如此而謚曰文此子貢之所以疑而問也孔子不没其善言能如此亦足以爲文矣非經天緯地之文也 }
      - { type: j, text: 子謂子産有君子之道四焉其行己也恭其事上也敬其養民也惠其使民也義 }
      - { type: z, text: 子産鄭大夫公孫僑恭謙遜也敬謹恪也惠愛利也使民義如都鄙有章 }
      - { type: j, text: 上下有服田有封洫廬井有伍之類 }
      - { type: z, text: 吳氏曰數其事而責之者其所善者多也臧文仲不仁者三不知者三是也數其事而稱之者猶有所未至也 }
      - { type: j, text: 子産有君子之道四焉是也今或以 }
      - { type: z, text: 一言蓋一人一事蓋一時皆非也 }
      - { type: j, text: 子曰晏平仲善與人交久而敬之 }
      - { type: z, text: 晏平仲齊大夫名嬰○程子曰人交久則敬衰久而能敬所以爲善 }
      - { type: j, text: 子曰臧文仲居蔡山節藻梲何如其知也 }
      - { type: z, text: 棁章恱反知去聲○臧文仲魯大夫臧孫氏名辰居猶藏也蔡大龜也節柱頭斗拱也藻水草名棁梁上短柱也蓋爲藏龜之室而刻山於節畫藻於棁也當時以文仲爲知孔子言其不務民義而謟瀆鬼神如此安得爲知春秋傳所謂作虛器即此事也○張子曰山節藻棁爲藏龜之室祀爰居之義同歸於不知宜矣 }
      - { type: j, text: 子張問曰令尹子文三仕爲令尹無喜色三已之無慍色舊令尹之政必以告新令尹何如子曰忠矣曰仁矣乎曰未知焉得仁 }
      - { type: z, text: 知如字焉於虔反○令尹官名楚上卿執政者也子文姓鬪名穀於菟其爲人也喜怒不形物我無間知有其國而不知有其身其忠盛矣故子張疑其仁然其所以三仕三已而告新令尹者未知其皆出於天理而無人欲之私也是以夫子但許其忠而未許其仁也 }
      - { type: j, text: 崔子弒齊君陳文子有馬十乘棄而違之至於他邦則曰猶吾大夫崔子也違之之一邦則又曰猶吾大夫崔子也違之何如子曰清矣曰仁矣乎曰未知焉得仁 }
      - { type: z, text: 乘去聲○崔子齊大夫名杼齊君莊公名光陳文子亦齊大夫名須無十乘四十匹也違去也文子絜身去亂可謂清矣然未知其心果見義理之當然而能脫然無所累乎抑不得已於利害之私而猶未免於怨悔也故 }
      - { type: j, text: 孔子特許其清而不許其仁愚聞之師曰當理而無私心則仁矣今以是而觀二子之事雖其制行之髙若不可及然皆未有以見其必當於理而眞無私心也子張未識仁體而悅於苟難遂以小者信其大者夫子之不許也冝哉讀者於此更以上章不知其仁後篇仁則吾不知之語并與三仁夷齊之事觀之則彼此交盡而仁之爲義可識矣今以它書考之子文之相楚所謀者無非僭王猾夏之事文子之仕齊旣失正君討賊之義又不數歲而復反於齊焉則其不仁 }
      - { type: z, text: 亦可見矣 }
      - { type: j, text: 季文子三思而後行子聞之曰再斯可矣 }
      - { type: z, text: 三去聲○季文子魯大夫名行父每事必三思而後行若使晉而求遭喪之禮以行亦其一事也斯語詞○程子曰為惡之人未嘗知有思有思則為善矣然至於再則已審三則私意起而反惑矣故夫子譏之○愚按季文子慮事如此可謂詳審而宜無過舉矣而宣公篡立文子乃不能討反為之使齊而納賂焉豈非程子所謂私意起而反惑之驗與是以君子務窮理而貴果斷不徒多思之為尚 }
      - { type: j, text: 子曰甯武子邦有道則知邦無道則愚其知可及也其愚不可及也 }
      - { type: z, text: 知去聲○甯武子衛大夫名俞按春秋傳武子仕衛當文公成公之時文公有道而武子無事可見此其知之可及也成公無道至於失國而武子周旋其間盡心竭力不避艱險凡其所處皆智巧之士所深避而不肯爲者而能卒保其身以濟其君此其愚之不可及也○程子曰邦無道能沈晦以免患故曰不可及也亦有不當愚者比干是也 }
      - { type: j, text: 子在陳曰歸與歸與吾黨之小子狂簡斐然成章不知所以裁之 }
      - { type: z, text: 與平聲斐音匪○此孔子周流四方道不行而思歸之歎也吾黨小子指門人之在魯者狂簡志大而略於事也斐文貌成章言其文理成就有可觀者裁割正也夫子初心欲行其道於天下至是而知其終不用也於是始欲成就後學以傳道於來世又不得中行之士而思其次以為狂士志意高遠猶或可與進於道也但恐其過中失正而或陷於異端耳故欲歸而裁之也 }
      - { type: j, text: 子曰伯夷叔齊不念舊惡怨是用希 }
      - { type: z, text: 伯夷叔齊孤竹君之二子孟子稱其不立於惡人之朝不與惡人言與鄉人立其冠不正望望然去之若將浼焉其介如此宜若無所容矣然其所惡之人能改即止故人亦不甚怨之也○程子曰不念舊惡此清者之量又曰二子之心非夫子孰能知之 }
      - { type: j, text: 子曰孰謂微生高直或乞醯焉乞諸其鄰而與之 }
      - { type: z, text: 醯呼西反○微生姓高名魯人素有直名者醯醋也人來乞時其家無有故乞諸鄰家以與之夫子言譏其曲意徇物掠美市恩不得爲直也○ }
      - { type: j, text: 程子曰微生高所枉雖小害直爲大 }
      - { type: z, text: 范氏曰是曰是非曰非有謂有無謂無曰直聖人觀人於其一介之取予而千駟萬鍾從可知焉故以微事斷之所以教人不可不謹也 }
      - { type: j, text: 子曰巧言令色足恭左丘明恥之丘亦恥之匿怨而友其人左丘明恥之丘亦恥之 }
      - { type: z, text: 足將樹反○足過也○程子曰左丘明古之聞人也○謝氏曰二者之可恥有甚於穿窬也左丘明恥之其所養可知矣夫子自言丘亦恥之蓋竊比老彭之意又以深戒學者使察乎此而立心以直也 }
      - { type: j, text: 顏淵季路侍子曰盍各言爾志 }
      - { type: z, text: 盍音合○盍何不也 }
      - { type: j, text: 子路曰願車馬衣輕裘與朋友共敝之而無憾 }
      - { type: z, text: 衣去聲○衣服之也裘皮服敝壞也憾恨也 }
      - { type: j, text: 顏淵曰願無伐善無施勞 }
      - { type: z, text: 伐誇也善謂有能施亦張大之意勞謂有功易曰勞而不伐是也或曰勞勞事也勞事非己所欲故亦不欲施之於人亦通 }
      - { type: j, text: 子路曰願聞子之志子曰老者安之朋友信之少者懷之 }
      - { type: z, text: 老者養之以安朋友與之以信少者懷之以恩一說安之安我也信之信我也懷之懷我也亦通○程子曰夫 }
      - { type: j, text: 子安仁顏淵不違仁子路求仁又曰子路顏淵孔子之志皆與物共者也但有小大之差爾又曰子路勇於義者觀其志豈可以勢利拘之哉亞於浴沂者也顏子不自私己故無伐善知同於人故無施勞其志可謂大矣然未免出於有意也至於夫子則如天地之化工付與萬物而己不勞焉 }
      - { type: z, text: 此聖人之所爲也今夫羈靮以御馬而不以制牛人皆知羈靮之作在乎人而不知羈靮之生由於馬聖人之化亦猶是也先觀二子之言後觀聖人之言分明天地氣象凡看論語非但欲理會文字須要識得聖賢氣象 }
      - { type: j, text: 子曰已矣乎吾未見能見其過而内自訟者也 }
      - { type: z, text: 已矣乎者恐其終不得見而嘆之也內自訟者口不言而心自咎也人有過而能自知者鮮矣知過而能內自訟者為尤鮮能內自訟則其悔悟深切而能改必矣夫子自恐終不得見而嘆之其警學者深矣 }
      - { type: j, text: 子曰十室之邑必有忠信如丘者焉不如丘之好學也 }
      - { type: z, text: 焉如字屬上句好去聲○十室小邑也忠信如聖人生質之美者也夫子生知而未嘗不好學故言此以勉人言美質易得至道難聞學之至則可以為聖人不學則不免為鄉人而已可不勉哉 }
  - id: pian2
    name: 雍也第六
    blocks:
      - { type: z, text: 凡二十八章篇內第十四章以前大意與前篇同 }
      - { type: j, text: 子曰雍也可使南面 }
      - { type: z, text: 南面者人君聽治之位言仲弓寬洪簡重有人君之度也 }
      - { type: j, text: 仲弓問子桑伯子子曰可也簡 }
      - { type: z, text: 子桑伯子魯人胡氏以為疑即莊周所稱子桑户者是也仲弓以夫子許已南面故問伯子如何可者僅可而有所未盡之辭簡者不煩之謂 }
      - { type: j, text: 仲弓曰居敬而行簡以臨其民不亦可乎居簡而行簡無乃大簡乎 }
      - { type: z, text: 大音泰○言自處以敬則中有主而自治嚴如是而行簡以臨民則事不煩而民不擾所以為可若先自處以簡則中無主而自治踈矣而所行又簡豈不失之太簡而無法度之可守乎家語記伯子不衣冠而處夫子譏其欲同人道於牛馬然則伯子蓋大簡者而仲弓疑夫子之過許與 }
      - { type: j, text: 子曰雍之言然 }
      - { type: z, text: 仲弓蓋未喻夫子可字之意而其所言之理有默契焉者故夫子然之○程子曰子桑伯子之簡雖可取而未盡善故夫子云可也仲弓因言内主於敬而簡則爲要直内存乎簡而簡則爲疎略可謂得其旨矣又曰居敬則心中無物故所行自簡居簡則先有心於簡而多一簡字矣故曰大簡 }
      - { type: j, text: 哀公問弟子孰爲好學孔子對曰有顔回者好學不遷怒不貳過不幸短命死矣今也則亡未聞好學者也 }
      - { type: z, text: 好去聲亡與無同○遷移也貳復也 }
      - { type: j, text: 怒於甲者不移於乙過於前者不復於後顏子克己之功至於如此可謂眞好學矣短命者顏子三十二而卒也旣云今也則亡又言未聞好學者蓋深惜之又以見眞好學者之難得也程子曰顏子之怒在物不在己故不遷有不善未嘗不知知之未嘗復行不貳過也又曰喜怒在事則理之當喜怒者也不在血氣則不遷若舜之誅四凶也可怒在彼己何與焉如鑑之照物妍媸在彼隨物應之而已何遷之有又曰如顏子地位豈有不善所謂不善只是微有差失才差失便能知之才知之便更不萌作張子曰慊於己者不使萌於再或曰詩書六藝七十子非不習而通也而夫子獨稱顏子為好學顏子之所好果何學歟程子曰學以至乎聖人之道也學之道奈何曰天地儲精得五行之秀者為人其本也眞而靜其未發也五性具焉曰仁義禮智信形旣生矣外物觸其形而動於中矣其中動而七情出焉曰喜怒哀懼愛惡欲情旣熾而益蕩其性鑿矣故覺者約其情使合於中正其心養其性而已然必先明諸心知所徃然後力行以求至焉若顏子之非禮勿視聽言動不遷怒貳過者則其好之篤而學之得其道也然其未至於聖人者守之也非化之也假之以年則不日而化矣今人乃謂聖本生知非學可至而所以為學者不過記誦文辭之間其 }
      - { type: z, text: 亦異乎顔子之學矣 }
      - { type: j, text: 子華使於齊冉子爲其母請粟子曰與之釜請益曰與之庾冉子與之粟五秉 }
      - { type: z, text: 使爲並去聲○子華公西赤也使爲孔子使也釜六斗四升庾十六斗秉十六斛 }
      - { type: j, text: 子曰赤之適齊也乘肥馬衣輕裘吾聞之也君子周急不繼富 }
      - { type: z, text: 衣去聲○乘肥馬衣輕裘言其富也急窮迫也周者補不足繼者續有餘 }
      - { type: j, text: 原思爲之宰與之粟九百辭 }
      - { type: z, text: 原思孔子弟子名憲孔子爲魯司冦時以思爲宰粟宰之禄也九百不言其量不可考 }
      - { type: j, text: 子曰毋以與爾鄰里鄉黨乎 }
      - { type: z, text: 毋禁止辭五家爲鄰二十五家爲里萬二千五百家爲鄉五百家爲黨言常祿不當辭有餘自可推之以周貧乏蓋鄰里鄉黨有相周之義○程子曰夫子之使子華子華之爲夫子使義也而冉子乃爲之請聖人寬容不欲直拒人故與之少所以示不當與也請益而與之亦少所以示不當益也求未達而自與之多則已過矣故夫子非之蓋赤苟至乏則夫子必自周之不待請矣原思爲宰則有常祿思辭其多故又教以分諸鄰里之貧者蓋亦莫非義也○張子曰於斯二者可見聖人之用財矣 }
      - { type: j, text: 子謂仲弓曰犂牛之子騂且角雖欲勿用山川其舍諸 }
      - { type: z, text: 犂利之反騂息營反舍上聲○犂雜文騂赤色周人尚赤牲用騂角角周正中犧牲也用用以祭也山川山川之神也言人雖不用神必不舎也仲弓父賤而行惡故夫子以此譬之言父之惡不能廢其子之善如仲弓之賢自當見用於丗也然此論仲弓云爾非與仲弓言也○范氏曰以瞽叟爲父而有舜以鯀爲父而有禹古之聖賢不係於丗類尚矣子能改父之過變惡以爲美則可謂孝矣 }
      - { type: j, text: 子曰回也其心三月不違仁其餘則日月至焉而已矣 }
      - { type: z, text: 三月言其乆仁者心之德心不違仁者無私欲而有其德也日月至焉者或日一至焉或月一至焉能造其域而不能乆也○程子曰三月天道小變之節言其乆也過此則聖人矣不違仁只是無纖毫私欲少有私欲便 }
      - { type: j, text: 是不仁尹氏曰此顔子於聖人未達 }
      - { type: z, text: 一間者也若聖人則渾然無間斷矣張子曰始學之要當知三月不違與日月至焉内外賔主之辨使心意勉勉循循而不能已過此幾非在我者 }
      - { type: j, text: 季康子問仲由可使從政也與子曰由也果於從政乎何有曰賜也可使從政也與曰賜也達於從政乎何有曰求也可使從政也與曰求也藝於從政乎何有 }
      - { type: z, text: 與平聲○從政謂為大夫果有決斷 }
      - { type: j, text: 達通事理藝多才能程子曰季康子 }
      - { type: z, text: 問三子之才可以從政乎夫子答以各有所長非惟三子人各有所長能 }
      - { type: j, text: 取其長皆可用也季氏使閔子騫爲費宰閔子騫曰善爲我辭焉如有復我者則吾必在汶上矣 }
      - { type: z, text: 費音秘爲去聲汶音問○閔子騫孔子弟子名損費季氏邑汶水名在齊者善爲己辭言若再來召我則當去之齊○程子曰仲尼之門能不仕大夫之家者閔子曾子數人而已○謝氏曰學者能少知內外之分皆可以樂道而忘人之勢況閔子得聖人爲之依歸彼其視季氏不義之富貴不啻犬彘又從而臣之豈其心哉在聖人則有不然者蓋居亂邦見惡人在聖人則可自聖人以下剛則必取禍柔則必取辱閔子豈不能早見而豫 }
      - { type: j, text: 待之乎如由也不得其死求也為季氏附益夫豈其本心哉蓋既無先見之知又無克亂之才故也然則閔子 }
      - { type: z, text: 其賢乎 }
      - { type: j, text: 伯牛有疾子問之自牖執其手曰亡之命矣夫斯人也而有斯疾也斯人也而有斯疾也 }
      - { type: z, text: 夫音扶○伯牛孔子弟子姓冉名耕 }
      - { type: j, text: 有疾先儒以為癩也牖南牖也禮病者居北牖下君視之則遷於南牖下使君得以南面視己時伯牛家以此禮尊孔子孔子不敢當故不入其室而自牖執其手蓋與之永訣也命謂天命言此人不應有此疾而今乃有之是乃天之所命也然則非其不能謹疾而有以致之亦可見矣侯氏 }
      - { type: z, text: 曰伯牛以德行稱亞於顏閔故其將死也孔子尤痛惜之 }
      - { type: j, text: 子曰賢哉回也一簞食一瓢飲在陋巷人不堪其憂回也不改其樂賢哉回也 }
      - { type: z, text: 食音嗣樂音洛○簞竹器食飯也瓢瓠也顏子之貧如此而處之泰然不以害其樂故夫子再言賢哉回也以深歎美之○程子曰顏子之樂非樂簞瓢陋巷也不以貧窶累其心而改其所樂也故夫子稱其賢又曰簞瓢陋巷非可樂蓋自有其樂爾其字當玩味自有深意又曰昔受學於周茂叔每令尋仲尼顏子樂處所樂何事愚按程子之言引而不發蓋欲學者深思而自得之今亦不敢妄爲之說學者但當從事於博文約禮之誨以至於欲罷不能而竭其才則庶乎有以得之矣 }
      - { type: j, text: 冉求曰非不說子之道力不足也子曰力不足者中道而廢今女畫 }
      - { type: z, text: 說音悅女音汝○力不足者欲進而不能畫者能進而不欲謂之畫者如畫地以自限也○胡氏曰夫子稱顏回不改其樂冉求聞之故有是言然使求悅夫子之道誠如口之說芻豢則必將盡力以求之何患力之不足哉畫而不進則日退而已矣此冉求之所以局於藝也 }
      - { type: j, text: 子謂子夏曰女為君子儒無為小人儒 }
      - { type: z, text: 儒學者之稱○程子曰君子儒為己小人儒為人○謝氏曰君子小人之分義與利之間而已然所謂利者豈必殖貨財之謂以私滅公適己自便凡可以害天理者皆利也子夏文學雖有餘然意其遠者大者或昧焉故夫子語之以此 }
      - { type: j, text: 子游爲武城宰子曰女得人焉爾乎曰有澹臺滅明者行不由徑非公事未嘗至於偃之室也 }
      - { type: z, text: 女音汝澹徒甘反○武城魯下邑澹臺姓滅明名字子羽徑路之小而捷者公事如飲射讀法之類不由徑則動必以正而無見小欲速之意可知非公事不見邑宰則其有以自守而無枉己徇人之私可見矣○楊氏曰爲政以人才爲先故孔子以得人爲問如滅明者觀其二事之小而其正大之情可見矣後世有不由徑者人必以為迂不至其室人必以為簡非孔氏之徒其孰能知而取之愚謂持身以滅明為法則無苟賤之羞取人以子游為法則無邪媚之惑 }
      - { type: j, text: 子曰孟之反不伐奔而殿將入門策其馬曰非敢後也馬不進也殿去聲孟之反魯大夫名側胡氏 }
      - { type: z, text: 曰反即莊周所稱孟子反者是也伐誇功也奔敗走也軍後曰殿策鞭也戰敗而還以後為功反奔而殿故以此言自揜其功也事在哀公十一年○謝氏曰人能操無欲上人之心則人欲日消天理日明而凡可以矜己誇人者皆無足道矣然不知學者欲上人之心無時而忘也若孟之反可以為法矣 }
      - { type: j, text: 子曰不有祝鮀之佞而有宋朝之美難乎免於今之世矣 }
      - { type: z, text: 鮀徒河反○祝宗廟之官鮀衛大夫字子魚有口才朝宋公子有美色言衰世好諛悅色非此難免蓋傷之也 }
      - { type: j, text: 子曰誰能出不由户何莫由斯道也 }
      - { type: z, text: 言人不能出不由户何故乃不由此道耶怪而歎之之辭○洪氏曰人知出必由户而不知行必由道非道遠人人自遠爾 }
      - { type: j, text: 子曰質勝文則野文勝質則史文質彬彬然後君子 }
      - { type: z, text: 野野人言鄙略也史掌文書多聞習事而誠或不足也彬彬猶班班物相雜而適均之貌言學者當損有餘補不足至於成德則不期然而然矣○楊氏曰文質不可以相勝然質之勝文猶之甘可以受和白可以受采也文勝而至於滅質則其本亡矣雖有文將安施乎然則與其史也寧野 }
      - { type: j, text: 子曰人之生也直罔之生也幸而免 }
      - { type: z, text: 程子曰生理本直罔不直也而亦生者幸而免爾 }
      - { type: j, text: 子曰知之者不如好之者好之者不如樂之者 }
      - { type: z, text: 好去聲樂音洛○尹氏曰知之者知有此道也好之者好而未得也樂之者有所得而樂之也○張敬夫曰譬之五穀知者知其可食者也好者食而嗜之者也樂者嗜之而飽者也知而不能好則是知之未至也好之而未及於樂則是好之未至也此古之學者所以自強而不息者與 }
      - { type: j, text: 子曰中人以上可以語上也中人以下不可以語上也 }
      - { type: z, text: 以上之上上聲語去聲○語告也言教人者當隨其髙下而告語之則其言易入而無躐等之弊也○張敬夫曰聖人之道精粗雖無二致但其施教則必因其材而篤焉蓋中人以下之質驟而語之太髙非惟不能以入且將妄意躐等而有不切於身之弊亦終於下而已矣故就其所及而語之是乃所以使之切問近思而漸進於髙遠也 }
      - { type: j, text: 樊遲問知子曰務民之義敬鬼神而遠之可謂知矣問仁曰仁者先難而後獲可謂仁矣 }
      - { type: z, text: 知遠皆去聲○民亦人也獲謂得也專用力於人道之宜而不惑於鬼神之不可知知者之事也先其事之所難而後其効之所得仁者之心也此必因樊遲之失而告之○程子曰人多信鬼神惑也而不信者又不能敬能敬能遠可謂知矣又曰先難克己也以所難爲先而不計所獲仁也吕氏曰當務爲急不求所難知力行所知不憚所難爲 }
      - { type: j, text: 子曰知者樂水仁者樂山知者動仁者靜知者樂仁者壽 }
      - { type: z, text: 知去聲樂上二字並五教反下一字音洛○樂喜好也知者達於事理而周流無滯有似於水故樂水仁者安於義理而厚重不遷有似於山故樂山動靜以體言樂壽以効言也動而不括故樂靜而有常故壽○程子曰非體仁智之深者不能如此形容之 }
      - { type: j, text: 子曰齊一變至於魯魯一變至於道 }
      - { type: z, text: 孔子之時齊俗急功利喜夸詐乃霸政之餘習魯則重禮教崇信義猶有先王之遺風焉但人亡政息不能無廢墜爾道則先王之道也言二國之政俗有美惡故其變而之道有難易○程子曰夫子之時齊彊魯弱孰不以為齊勝魯也然魯猶存周公之法制齊由威公之霸為從簡尚功之治太公之遺法變易盡矣故一變乃能至魯魯則修舉廢墜而已一變則至於先王之道也愚謂二國之俗唯夫子為能變之而不得試然因其言以考之則其施為緩急之序亦略可見矣 }
      - { type: j, text: 子曰觚不觚觚哉觚哉 }
      - { type: z, text: 觚音孤○觚稜也或曰酒器或曰木簡皆器之有稜者也不觚者蓋當時失其制而不為稜也觚哉觚哉言不得為觚也○程子曰觚而失其形制則非觚也舉一器而天下之物莫不皆然故君而失其君之道則為不君 }
      - { type: j, text: 臣而失其臣之職則為虛位范氏曰 }
      - { type: z, text: 人而不仁則非人國而不治則不國矣 }
      - { type: j, text: 宰我問曰仁者雖告之曰井有仁焉其從之也子曰何為其然也君子可逝也不可陷也可欺也不可罔也 }
      - { type: z, text: 劉聘君曰有仁之仁當作人今從之從謂隨之於井而救之也宰我信道不篤而憂爲仁之蹈害故有此問逝謂使之徃救陷謂陷之於井欺謂誑之以理之所有罔謂昧之以理之所無蓋身在井上乃可以救井中之人若從之於井則不復能救之矣此理甚明人所易曉仁者雖切於救人而不私其身然不應如此之愚也 }
      - { type: j, text: 子曰君子愽學於文約之以禮亦可以弗畔矣夫 }
      - { type: z, text: 夫音扶○約要也畔背也君子學欲其愽故於文無不考守欲其要故其動必以禮如此則可以不背於道矣○程子曰愽學於文而不約之以禮必至於汗漫愽學矣又能守禮而由於規矩則亦可以不畔道矣 }
      - { type: j, text: 子見南子子路不說夫子矢之曰予所否者天厭之天厭之說音悅否方九反南子衛靈公之夫人有淫行孔子至衛南子請見孔子辭謝不得已而見之蓋古者仕於其國有見其小君之禮而子路以夫子見此淫亂之人爲辱故不悅矢誓也也所誓辭也如云所不與崔慶者之 }
      - { type: z, text: 類否謂不合於禮不由其道也厭棄絕也聖人道大德全無可不可其見惡人固謂在我有可見之禮則彼之不善我何與焉然此豈子路所能測哉故重言以誓之欲其姑信此而深思以得之也 }
      - { type: j, text: 子曰中庸之爲德也其至矣乎民鮮乆矣 }
      - { type: z, text: 鮮上聲○中者無過無不及之名庸平常也至極也鮮少也言民少此德今已乆矣○程子曰不偏之謂中不易之謂庸中者天下之正道庸者天下之定理自世教衰民不興於行少有此德乆矣 }
      - { type: j, text: 子貢曰如有博施於民而能濟衆何如可謂仁乎子曰何事於仁必也聖乎堯舜其猶病諸 }
      - { type: z, text: 施去聲○博廣也仁以理言通乎上下聖以地言則造其極之名也乎者疑而未定之辭病心有所不足也言此何止於仁必也聖人能之乎則雖堯舜之聖其心猶有所不足於此也以是求仁愈難而愈逺矣 }
      - { type: j, text: 夫仁者己欲立而立人己欲達而達人 }
      - { type: z, text: 夫音扶。以己及人仁者之心也於此觀之可以見天理之周流而無間矣狀仁之體莫切於此 }
      - { type: j, text: 能近取譬可謂仁之方也已 }
      - { type: z, text: 譬喻也方術也近取諸身以己所欲譬之他人知其所欲亦猶是也然後推其所欲以及於人則恕之事而仁之術也於此勉焉則有以勝其人欲之私而全其天理之公矣。程子曰醫書以手足痿痺為不仁此言最善名狀仁者以天地萬物為一體莫非己也認得為己何所不至若不屬己自與己不相干如手足之不仁氣已不貫皆不屬己故博施濟衆乃聖人之功用仁至難言故止曰己欲立而立人己欲達而達人能近取譬可謂 }
      - { type: j, text: 仁之方也已欲令如是觀仁可以得仁之體又曰論語言堯舜其猶病諸者二夫博施者豈非聖人之所欲然必五十乃衣帛七十乃食肉聖人之心非不欲少者亦衣帛食肉也顧其養有所不贍爾此病其施之不博也濟衆者豈非聖人之所欲然治不過九州聖人非不欲四海之外亦兼濟也顧其治有所不及爾此病其濟之不衆也推此以求修己以安百姓則爲病可知苟以吾治已足則便不是聖人吕氏曰子貢有志於仁徒事高遠未知其方孔子教以於己取之庶近而可入是乃爲仁之方雖博施濟衆亦由此進 }
