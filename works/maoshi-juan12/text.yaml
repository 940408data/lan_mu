# 毛詩正義卷12（孔穎達疏）：j 為經文＋毛亨傳、鄭玄箋，z 為疏文。
sections:
  - id: juan12
    name: 正文
    blocks:
      - { type: j, text: "《小宛》，大夫刺宣王也。亦當為刺厲王。○宛，於阮反。" }
      - { type: z, text: "《小宛》六章，章六句。○正義曰：毛以作《小宛》詩者，大夫刺幽王也。政教為小，故曰“小宛”。宛是小貌，刺宣王政教狹小宛然。經雲“宛彼鳴鳩”，不言名曰“小宛”者，王才智卑小似小鳥然。傳曰“小鳥”，是也。○鄭“刺厲王”為異。" }
      - { type: j, text: "宛彼鳴鳩，翰飛戾天。興也。宛，小貌。鳴鳩，鶻雕。翰，高。戾，至也。行小人之道，責高明之功，終不可得。○翰，胡旦反。鶻音骨。雕，陟交反，何音彫，《字林》作“鵃”，雲：“骨鵃，小種鳩也。”《草木疏》雲：“鳴鳩，班鳩也。”我心憂傷，念昔先人。先人，文、武也。" }
      - { type: j, text: "明發不寐，有懷二人。明發，發夕至明。" }
      - { type: z, text: "“宛彼”至“二人”。○毛以為，言宛然翅小者，是彼鳴鳩之鳥也。而欲使之高飛至天，必不可得也。興才智小者，幽王身也。而欲使之行化致治，亦不可得也。王既才智褊小，將顛覆祖業，故我心為之憂傷，追念在昔之先人文王、武王也。以文、武創業垂統，有此天下。今將亡滅，故憂之也。又言憂念之狀，我從夕至明開發以來，不能寢寐。有所思者，唯此文、武二人。將喪其業，故思念之甚。○鄭唯“刺厲王”為異。○傳“宛小”至“可得”。○正義曰：以鳩是小鳥，又篇名《小宛》，故知宛為小。定本及《集本》皆雲“鳴鳩，鶻雕也”。○傳“先人，文、武”。○正義曰：知者，以王無德，而念其先人。又云“有懷二人”，則所念二人而已。周之先世，二人有聖德定天位者，唯文、武為然。明以文、武有天下，今慮其亡滅，故念之也。○傳“明發，發夕至明”。○正義曰：夜地而暗，至旦而明，明地開發，故謂之明發也。人之道，夜則當寐。言明發以來不寐，以此故知從夕至旦常不寐也。" }
      - { type: j, text: "人之齊聖，飲酒溫克。齊，正。克，勝也。箋雲：中正通知之人，飲酒雖醉，猶能溫藉自持以勝。○溫，王如字，柔也。鄭於運反，蘊藉也。藉，在夜反，又慈夜反。彼昏不知，壹醉日富。醉日而富矣。箋雲：童昏無知之人，飲酒一醉，自謂日益富，誇淫自恣，以財驕人。" }
      - { type: j, text: "各敬爾儀，天命不又。又，復也。箋雲：今女君臣，各敬慎威儀，天命所去，不復來也。○復，扶又反，下同。" }
      - { type: z, text: "箋“中正”至“以勝”。○正義曰：中正謂齊，通智謂聖。聖者，通也。《大司徒》注云：“聖通而先識。”是也。此經與下相對，齊為中正，則童昏者邪僻而不正。以聖對不知，是聖者通智也。“蘊藉”者，定本及箋作“溫”字。舒瑗雲：“苞裹曰蘊。”謂蘊藉自持含容之義。經中作“溫”者，蓋古字通用。《內則》說子事父母雲：“柔色以溫之”，鄭亦以溫為藉義。" }
      - { type: j, text: "中原有菽，庶民採之。中原，原中也。菽，藿也，力採者則得之。箋雲：藿生原中，非有主也，以喻王位無常家也，勤於德者則得之。○菽音叔。藿，火郭反。螟蛉有子，蜾蠃負之。螟蛉，桑蟲也。蜾蠃，蒲盧也。負，持也。箋雲：蒲盧取桑蟲之子，負持而去，煦嫗養之，以成其子。喻有萬民不能治，則能治者將得之。○螟，亡丁反。蛉音零，俗謂之桑蟃，一名戎女。蟃音萬。蜾音果。蠃，力果反，即細腰蜂，俗呼蠮螉，是也。蠮，於髻反。螉音翁。煦，況甫反，又況具反。嫗，紆甫反，又紆具反。鄭注《禮記》雲：“以氣曰煦。以體曰嫗。”" }
      - { type: j, text: "教誨爾子，式穀似之。箋雲：式，用。穀，善也。今有教誨女之萬民用善道者，亦似蒲盧言將得而子也。" }
      - { type: z, text: "“中原”至“似之”。○毛以為，既言天命將去，故告幽王以王位無常。言原田之中有菽藿，眾民能力採之者則得食之。以興域中之有王位，有德能勤治之者則得處之。藿生原中，非有主；位在域中，非有常也。所以為無常者，桑蟲自有子，而蒲盧負而養之，以成己子。若有聖德者，能教誨爾之萬民用善道則似之矣。言此蒲盧養取桑蟲之子以為己子，似有德者教取王民以為己民，是王位無常也。王何不修德以固位乎？實教誨萬民，而言子者，王肅雲：王者作民父母，故以民為子。○鄭唯“刺厲王”為異。○傅“菽，藿”。○正義曰：菽者大豆，故《禮記》稱“啜菽飲水”。菽葉謂之藿。《公食禮》雲“鉶羹牛用藿”，是也。此經言有菽，箋、傳皆以為藿者，以言“採之”，明採取其葉，故言藿也。○箋“王位無常家”。○正義曰：《集註》、定本皆作“家”。俗本作“處”，誤。○傅“螟蛉”至“蒲盧”。○正義曰：皆《釋蟲》文。郭璞曰：“蒲盧即細腰蜂也。俗呼為蠮螉。桑蟲俗謂之桑蟃，亦呼為戎女。鄭《中庸》注以蒲盧為土蜂。”陸機雲：“螟蛉者，桑上小青蟲也，似步屈，其色青而細小。或在草萊上。蜾蠃，土蜂也，似蜂而小腰，取桑蟲負之於木空中，七日而化為其子。”○箋“蒲盧”至“其子”。○正義曰：《中庸》雲：“政也者，蒲盧。”即此是也。《樂記》注云：“以體曰嫗。以氣曰姁。謂負而以體，暖之以氣，煦之而令變為己子也。”此螟蛉非不能養子，而喻王有萬民不能治者，喻取一邊耳。" }
      - { type: j, text: "題彼脊令，載飛載鳴。題，視也。脊令不能自舍，君子有取節爾。箋雲：題之為言視睇也。載之言則也。則飛則鳴，翼也口也，不有止息。○題，大計反。令音零，本亦作“鴒”。注同。舍音舍。睇，大計反。我日斯邁，而月斯徵。箋雲：我，我王也。邁、徵皆行也。王日此行，謂日視朝也。而月此行，謂月視朝也。先王制此禮，使君與群臣議政事，日有所決，月有所行，亦無時止息。○日，而乙反。下同。朝，直遙反。" }
      - { type: j, text: "夙興夜寐，毋忝爾所生！忝，辱也。○母忝，上音無，下他簟反，《字林》他念反。" }
      - { type: z, text: "“題彼”至“所生”。○毛以為，既王位無常，須自勤於政，故告幽王。言視彼脊令之鳥，尚則飛則鳴，既飛以翼，又鳴以口，翼也口也，無有止息之時。況人之處世，其可自舍！視此脊令，以為喻節，故我王當日此行，行視朝之禮；又而月此行，行視朔之政，與群臣議政事，日有所決，月有所行，亦如脊令無肯止息時也。故當早起夜臥行之，無辱汝所生之父祖已。○鄭唯“刺厲王”為異。○箋“題之”至“止息”。○正義曰：傳已訓題為視，此又言視睇者，以取之為節，當取傍視為義。《曲禮》注：“淫視，睇盼也。”《說文》雲：“睇，小邪視也。”鳥皆飛鳴，而此及《常棣》獨雲“雍渠”者，此鳥自有不能止舍之性，故取為喻也。正以飛鳴無止息為興者，亦欲取飛以喻其行事，鳴以喻其議也，故云口也翼也，無肯止息時也。○箋“我我”至“止息”。○正義曰：以此上承不能自舍，而云日月此行，故為我王。王於政事所行，唯有日視朝，月視朔耳。又解令王視朝及視朔意，以先王制此禮，欲使言與群臣行之，以議政事，日有所決斷，月有所施行，亦無止息時。先王制禮意如此，所以今欲令我王有所成決也。" }
      - { type: j, text: "交交桑扈，率場啄粟。交交，小貌。桑扈，竊脂也。言上為亂政，而求下之治，終不可得也。箋雲：竊脂肉食，今無肉而循場啄粟，失其天性，不能以自活。○扈音戶。場，大良反。啄，陟角反。竊音切。治，直吏反。哀我填寡，宜岸宜獄。握粟出卜，自何能穀？填，盡。岸，訟也。箋雲：仍得曰宜。自，從。穀，生也。可哀哉！我窮盡寡財之人，仍有獄訟之事，無可以自救，但持粟行卜，求其勝負，從何能得生？○填，徒典反，《韓詩》作“疹”。疹，苦也。岸如字，韋昭注《漢書》同。《韓詩》作“犴”，音同，雲：“鄉亭之系曰犴，朝廷曰獄。”握，於角反。" }
      - { type: z, text: "“交交”至“能穀”。○毛以為，交交然小者，是桑扈之鳥也。鳥自求生活，當應肉食。今既無肉，循場啄粟而食之，失其天性。以此求活，將必不能。以興王者欲求治國，當行善教。今無善教施布，亂政以治之，失其常法。以此求治，終不可得。政既亂，可哀哉，我窮盡寡財之人，濫被系禁。在上謂之宜有此訟，宜有此獄。在位不矜愍，在身無以自救，但手握其粟，出卜其勝負。貧困如此，竟從何而能生活乎？是尤可哀也。○鄭唯“刺厲王”為異。○傳“桑扈”至“可得”。○正義曰：“桑扈，竊脂”，《釋鳥》文。郭璞曰：“俗呼青雀，觜曲，食肉，喜盜脂膏食之，因以名雲。”陸機雲：“青雀也。”好竊人脯肉脂及膏，故曰竊脂也。桑扈食肉之鳥，而啄粟，求活不可得。以喻上為亂政，而求下治，亦不可得也。○箋“仍得”至“得生”。○正義曰：時政苛虐，民多枉濫。此人數遭之，在上以為此實有罪，宜其當然。由其仍得，故曰宜也。箋以寡財者，以衰亂之世，政以賄成。《史記》曰：“百金之子，不死於市。”是貧者無財自救，但持粟以求卜者，問得勝負。世必無從得活，故可哀也。" }
      - { type: j, text: "溫溫恭人，溫溫，和柔貌。如集於木。恐隊也。惴惴小心，如臨於谷。恐隕也。○惴，之瑞反。恐隕，上丘勇反，下於敏反。戰戰兢兢，如履薄冰。箋雲：衰亂之世，賢人君子雖無罪猶恐懼。" }
      - { type: j, text: "《小宛》六章，章六句。" }
      - { type: j, text: "《小弁》，刺幽王也。大子之傅作焉。" }
      - { type: z, text: "“《小弁》八章，章八句”至“作焉”。○正義曰：太子，謂宜咎也。幽王信褒姒之讒，放逐宜咎。其傅親訓太子，知其無罪，閔其見逐，故作此詩以刺王。經八章，皆所刺之事。諸序皆篇名之下言作人，此獨末言大子之傅作焉者，以此述太子之言，太子不可作詩以刺父，自傅意述而刺之，故變文以雲義也。經言“弁彼鸒斯”，不言小鳥。曰“小弁”者，弁，樂也。鸒斯卑居小鳥而樂，故曰“小弁”。" }
      - { type: j, text: "弁彼鸒斯，歸飛提提。興也。弁，樂也。鸒，卑居。卑居，雅烏也。提提，群貌。箋雲：樂乎！彼雅烏出食在野甚飽，群飛而歸提提然。興者，喻凡人之父子兄弟，出入宮庭，相與飲食，亦提提然樂。傷今大子獨不。○鸒斯，音豫。《爾雅》雲：“小而腹下白，不反哺者謂之雅烏。”《說文》雲：“雅，楚烏也，一名鸒，一名鵯居，秦謂之雅。”一雲：“斯，語辭。”提，是移反。樂音洛。下同。卑，本亦作“鵯”，同音匹，又必移反。民莫不穀，我獨於罹。幽王取申女，生大子宜咎。又說褒姒生子伯服，立以為後，而放宜咎，將殺之。箋雲：穀，養。於，曰。罹，憂也。天下之人，無不父子相養者。我大子獨不，曰以憂也。○罹，力知反。取，七住反。大音泰。說音悅。何辜於天？我罪伊何？舜之怨慕，日號泣於旻天、於父母。○日號，上而乙反，下戶刀反。旻，亡巾反。" }
      - { type: j, text: "心之憂矣，雲如之何！" }
      - { type: z, text: "“弁彼”至“之何”。○正義曰：言樂乎，彼鸒斯之鳥。鸒斯之鳥，出食於野，飽而則歸，同飛提提然，聚居歡樂也。以興樂者，彼天下之民。此民父子出入宮庭，相與飲食，亦提提然聚居歡樂也。今天下民莫不父子相養，我太子獨被放而不得其然，是比民、鳥之不如。太子言曰：“我憂之也。”太子言曰：“我憂之也。”太子既放棄而憂，故號泣而訴雲：“我有何罪乎？上天致此冤枉。”問天雲：“我罪維如何乎？”欲天辯其罪之所由。太子既憂如此，其傅言：“我心為之憂矣，知王如之何乎？”○傳“鸒卑居”至“群貌”。○正義曰：“鸒，卑居”，《釋鳥》文也。卑居又名雅烏。郭璞曰：“雅烏小而多群，腹下白，江東呼為鵯鳥是也。”此鳥名鸒，而云斯者，語辭。猶“蓼彼蕭斯”，“菀彼柳斯”。傳或有“斯”者，衍字。定本無“斯”字。以劉孝標之博學，而《類菀·鳥部》立鸒斯之目，是不精也。此鳥性好群聚，故云“提提，群貌”。“群”下或有“飛”，亦衍字。定本、《集本》並無“飛”字。○箋“彼雅”至“獨不”。○正義曰：以經言“歸飛”，是有出時，故言出食在野。以喻人父子出入宮庭也。以鸒求食，喻人相與飲食也。以鳥喻凡人，當文為興，言傷今太子獨失所。知者，以下雲“我獨”，故探之以明興意。《集本》、定本皆無“然”字。俗本“不”下有“然”，衍字。○傳“幽王”至“殺之”。○正義曰：《史記·周本紀》曰：“幽王三年，嬖愛褒姒，生子伯服。太子之母，申侯女，為後。欲廢后，並去太子，用褒姒為後，以其子伯服為太子。”又《鄭語》曰：“王欲殺太子，以成伯服，必求之申。申人弗畀，必伐之。”是放而欲殺之事也。○傳“舜之”至“父母”。○正義曰：毛意嫌子不當怨父以訴天，故引舜事以明之。言舜之怨慕父母之時，日往于田，號泣訴於旻天、於我之父母也。言為我父母而不愛我，故怨之。《孟子》雲：“萬章問曰：‘舜往于田，號泣於旻天，何為其號泣也？’孟子曰：‘怨慕也。’長息問於公明高曰：‘舜往于田，則吾既得聞命矣。號泣於旻天，於父母，則吾不知之矣。’公明高曰：‘非爾知也。’我竭力耕田，供為子職而已，父母不我愛，於我何哉？……大孝終身慕父母。五十而慕者，予於大舜見之矣。”引此者，言大舜尚怨，故太子亦可然也。" }
      - { type: j, text: "踧踧周道，鞫為茂草。踧踧，平易也。周道，周室之通道。鞫，窮也。箋雲：此喻幽王信褒姒之讒，亂其德政，使不通於四方。○踧，徒歷反。鞫，九六反。易，夷豉反。" }
      - { type: j, text: "我心憂傷，惄焉如搗。假寐永歎，維憂用老。心之憂矣，疢如疾首。惄，思也。搗，心疾也。箋雲：不脫冠衣而寐曰假寐。疢猶病也。○惄，乃歷反。搗，丁老反，本或作“<疒壽>”，同。《韓詩》作“疛”，除又反，義同。疢，敕覲反，又作“疹”，同。脫，本又作“稅”，吐活反，一音始銳反。" }
      - { type: z, text: "“踧踧”至“疾首”。○正義曰：太子放逐，由王信讒所致。言踧踧然平易者，周室之通道也，今曰窮盡為茂草矣。茂草生於道則荒。道路以喻通達者，天子之德政也，今曰王政窮盡為褒姒矣。褒姒幹王政則敗王德。今王盡信褒姒之讒，太子所以放逐。王行如此，故我心為之憂傷，惄焉悲悶，如有物之搗心也。又假寐之中，長歎此事，維是憂而用致於老矣。其我心之憂矣，以成疢病，如人之疾首者。疾首，謂頭痛也。○箋“此喻”至“四方”。○正義曰：此舉周道有茂草之荒，鄣礙行路，使行者不達於四方，以喻幽王信褒姒之讒，敗亂德政，不通於四方。時王雖無道，非路絕行人，實生茂草，且取茂草之穢道路，猶褒姒之亂王政，假以為喻耳。○傳“惄，思。搗，心疾”。○正義曰：“惄，思”，《釋詁》文。搗，心疾。所思在心，復雲如搗，則似物搗心，故云心疾也。《說文》雲：“搗，手椎。一曰築也。”○箋“不脫”至“假寐”。○正義曰：宣二年《左傳》說“趙盾盛服將朝，尚早，坐而假寐”，是也。" }
      - { type: j, text: "維桑與梓，必恭敬止。父之所樹，已尚不敢不恭敬。○梓音子，木名。靡瞻匪父，靡依匪母。不屬於毛，不罹於裏。毛在外陽，以言父。裏在內陰，以言母。箋雲：此言人無不瞻仰其父取法則者，無不依恃其母以長大者。今我獨不得父皮膚之氣乎？獨不處母之胞胎乎？何曾無恩於我？○屬音燭，徐音蜀。裏音裏。長，丁丈反。胞音包。胎，他來反。" }
      - { type: j, text: "天之生我，我辰安在？辰，時也。箋雲：此言我生所值之辰，安所在乎？謂六物之吉凶。" }
      - { type: z, text: "“維桑”至“安在”。○毛以為，言凡人父之所樹者，維桑與梓，見之必加恭敬之止。況父身乎，固當恭敬之矣。既恭孝如此，以至不容，故言人無不瞻仰其父取法則者，無不依怙其母以長大者。今我獨不連屬於父乎？不離歷於母乎？何由如此不得父母之恩也？若此，則本天之生我，我所遇值之時安所在乎？豈皆值兇時而生，使我獨遭此也？毛，指謂父也。裏，指謂母也。○鄭唯毛、裏為異。餘同。○傳“父之所樹”。○正義曰：此假之於凡人，非謂幽王所樹桑梓。○傳“毛在”至“言母”。○正義曰：人體皆毛生於表，而裏在其內。毛在外陽，裏在內陰，以父陽母陰，故假表裏言父母也。屬者，父子天性相連屬。離者，謂所離歷，言稟父之氣歷母而生也？傳於屬離之義當然，其言小與鄭異，其意則大同也。孫毓謂傳為長，而云：“母斥褒姒。褒姒乃是太子之讎，寧復望其依恃之恩？又太子豈離歷褒姒而生也？而言不離哉！”毓之所言，非傳旨也。○箋“不處母之胞胎乎”。○正義曰：此太子為父所放耳，非母放之。而並言母也，以人皆得父母之恩，故連言之，其意不怨申後也。○箋“此言”至“吉凶”。○正義曰：言我生所值之辰，安所在乎，則本初生之辰有所值，故知謂六物也。昭七年《左傳》：“晉侯謂伯瑕曰：‘何謂六物？’對曰：‘歲、時、日、月、星、辰，是謂也。’”服虔以為；歲，星之神也，左行於地，十二歲而一週。時，四時也。日，十日也。月，十二月也。星，二十八宿也。辰，十二辰也。是為六物也。" }
      - { type: j, text: "菀彼柳斯，鳴蜩嘒嘒。有漼者淵，萑葦淠淠。蜩，蟬也。嘒嘒，聲也。漼，深貌。淠淠，眾也。箋雲：柳木茂盛則多蟬，淵深而旁生萑葦。言大者之旁，無所不容。○菀音鬱。蜩音條。嘒，呼惠反。淠，徐孚計反，又匹計反。譬彼舟流，不知所屆。箋雲：屆，至也。言今大子不為王及後所容，而見放逐，狀如舟之流行，無制之者，不知終所至也。○譬，本亦作“闢”，匹致反。下同。屆音戒。" }
      - { type: j, text: "心之憂矣，不遑假寐。箋雲：遑，暇也。" }
      - { type: z, text: "“菀彼”至“假寐”。○正義曰：言有菀然而茂者，彼柳木也。此柳由茂，故上有鳴蟬，其聲嘒嘒然。有漼然而深者，彼淵水也。此淵由深，故傍萑葦其眾淠淠然。柳木茂而多蟬，淵水深而生葦，是大者之傍，無所不容。猶王總四海之富，據天下之廣，宜容太子，而不能容之，至使放逐。譬彼舟之流行，而無維制之者，不知終當所至，以此故我心之憂矣，不得閒暇而假寐，言憂之深也。○箋“大者”至“不容”。○正義曰：定本無“旁所”二字。○箋“言今”至“所至”。○正義曰：於時申後廢黜，非復能容太子。言不為王及後所容者，因上瞻父依母之文連言之耳。太子奔申，則是有所至矣。言無所至者，棄儲君之重而逃竄舅，家非太子所當至故也。" }
      - { type: j, text: "鹿斯之奔，維足伎伎。雉之朝雊，尚求其雌。伎伎，舒貌。謂鹿之奔走，其足伎伎然舒也。箋雲：雊，雉鳴也。尚，猶也。鹿之奔走，其勢宜疾，而足伎伎然舒，留其群也。雉之鳴，猶知求其雌，今大子之放棄，其妃匹不得與之去，又鳥獸之不如。○伎，本亦作“跂”，其宜反。雊，古豆反。妃音配。譬彼壞木，疾用無枝。壞，瘣也，謂傷病也。箋雲：大子放逐而不得生子，猶內傷病之。木內有疾，故無枝也。○壞，胡罪反，又如字，《說文》作“瘣”，雲：“病也。一曰腫旁出也。”又音回。瘣，胡罪反，木瘤腫也。《爾雅》：“瘣木，符婁。”郭雲：“虺亻區癭腫，無枝條也。”" }
      - { type: j, text: "心之憂矣，寧莫之知！箋雲：寧猶曾也。" }
      - { type: z, text: "“鹿斯”至“之知”。○正義曰：此鹿斯與鸒斯、柳斯，斯皆辭也。言鹿之奔走，其勢宜疾，今乃維足伎伎然，安舒而稽留，以待其牝鹿而俱走也。雄雉之於朝旦雊然而鳴，猶為求其雌雉而並飛也。鹿、雉猶得偶以俱游，今太子之見放逐，棄其妃匹，不得俱去，是鳥獸之不如。譬彼內傷病之木，以內疾之故，是用無枝也。猶太子無匹之故，不得生子，故我心之憂矣，曾無知之者。○箋“雊雉”至“不如”。○正義曰：《高宗彤日》：“雉升鼎耳而雊。”《說文》雲：“雊，雄雉鳴也。雉鳴而句其頸，故字從隹句。”此雉言雌，鹿不言牝。鹿言足遲，為待之之勢。獸走，故以遲相待；鳥飛疾，故以鳴相呼，皆互見也。言又鳥獸之不如者，前不如蟬、葦，今不如鳥、獸，故言又也。○傳“壞，瘣，謂傷病”。○正義曰：《釋木》雲：“瘣木，符婁。”某氏曰：“《詩》雲：‘譬彼瘣木，疾用無枝。’符婁尫亻區，內疾瘣磊，故疾用無枝。”郭璞曰：“謂木病尫亻區癭腫，無枝條者。”《舍人》曰：“符婁屬下句，獨為異也。”" }
      - { type: j, text: "相彼投兔，尚或先之。行有死人，尚或墐之。墐，路冢也。箋雲：相，視。投，掩。行，道也。視彼人將掩兔，尚有先驅走之者。道中有死人，尚有覆掩之成其墐者。言此所不知，其心不忍。○相，息亮反。兔，他故反。先，蘇薦反。墐音覲，《說文》作“殣”，雲：“道中死人，人所覆也。”驅，起俱反，又作“驅”，同。君子秉心，維其忍之。箋雲：君子，斥幽王也。秉，執也。言王之執心，不如彼二人。" }
      - { type: j, text: "心之憂矣，涕既隕之！隕，隊也。○涕音替。隕音蘊。隊，直類反。" }
      - { type: z, text: "傳“墐路冢”至“箋不忍”。○正義曰：墐者，理藏之名耳。此言行有死人，是於路傍，故曰路冢。《左傳》曰：“道墐相望。”是也。言此不知者，謂不與走獸死人有相知，其心不忍耳。" }
      - { type: j, text: "君子信讒，如或醻之。箋雲：醻，旅醻也。如醻之者，謂受而行之。○醻，市由反。君子不惠，不舒究之。箋雲：惠，愛。究，謀也。王不愛太子，故聞讒言則放之，不舒謀也。伐木掎矣，析薪扡矣。伐木者掎其巔，析薪者隨其理。箋雲：掎其巔者，不欲妄踣之。扡。謂覲其理也。必隨其理者，不欲妄挫析之。以言今王之遇大子，不如伐木析薪也。○掎，寄彼反。扡，敕氏反，又宅買反，徐又直是反。踣，蒲北反。挫，子臥反。" }
      - { type: j, text: "舍彼有罪，予之佗矣！佗，加也。箋雲：予，我也。舍褒姒讒言之罪，而妄加我大子。○舍音捨。注同。又音赦。佗，吐賀反。注同。" }
      - { type: z, text: "“君子”至“佗矣”。○正義曰：言君子幽王信褒姒之讒，曾不思審，得即用之。如有人以酒相醻，得即飲之。此王所以然者，君子幽王心不愛太子之故，由此聞讒即逐，不肯安舒而謀慮之。伐木尚掎其木之巔矣，不欲妄踣之。析薪尚杝其薪之理矣，不欲妄析之。彼人尚不欲妄損析薪木，今王非理而害太子，其意乃不如彼伐木析薪之人。舍彼有罪之褒姒，於我太子之加罪矣。言太子無罪，王妄加之。○箋“醻，旅醻”。○正義曰：酬酢皆作酬。此作醻者，古字得通用也。酬有二等：既酢而酬賓者，賓奠之不舉，謂之奠酬；至三爵之後，乃舉曏者所奠之爵，以行之於後，交錯相酬，名曰旅酬，謂眾相酬也。此喻得讒即受而行之，故知是旅酬，非奠酬也。○傳“伐木”至“其理”。○正義曰：伐木而言掎，是畏木倒而掎之，明掎其巔矣。掎者，倚也，謂以物倚其巔峰也。析薪而言扡，明隨其理。扡者，施也，言觀其裂而漸相施及，故箋雲“觀其理”，是也。○傳“佗，加”。○正義曰：此佗謂佗人也。言舍有罪，而以罪與佗人，是從此而往加也，故曰“佗，加也”。" }
      - { type: j, text: "莫高匪山，莫浚匪泉。浚，深也。箋雲：山高矣，人登其巔。泉深矣，人入其淵。以言人無所不至，雖逃避之，猶有默存者焉。○浚，蘇俊反。默，本亦作“嘿”，亡北反。君子無易由言，耳屬幹垣。箋雲：由，用也。王無輕用讒人之言，人將有屬耳於壁而聽之者，知王有所受之，知王心不正也。○易，夷豉反。屬音燭。注同。垣音袁。無逝我梁，無發我笱。箋雲：逝，之也。之人梁，發人笱，此必有盜魚之罪。以言褒姒淫色來嬖於王，盜我大子母子之寵。○笱音苟。" }
      - { type: j, text: "我躬不閱，遑恤我後。念父，孝也。高子曰：“《小弁》，小人之詩也。”孟子曰：“何以言之？”曰：“怨乎。”孟子曰：“固哉夫，高叟之為詩也！有越人此，關弓而射我，我則談笑而道之，無他，疏之也。兄弟關弓而射我，我則垂涕泣而道之，無他，戚之也。然則《小弁》之怨，親親也。親親，仁也。固哉夫，高叟之為詩！”曰：“《凱風》何以不怨？”曰：“《凱風》，親之過小者也；《小弁》，親之過大者也。親之過大而不怨，是愈疏也；親之過小而怨，是不可磯也。愈疏，不孝也；不可磯，亦不孝也。孔子曰：‘舜其至孝矣，五十而慕。’”箋雲：念父，孝也。大子念王將受讒言不止，我死之後，懼復有被讒者，無如之何。故自決雲：“我身尚不能自容，何暇乃憂我死之後也？”○閱音悅，容也。叟，素口反。關，烏環反。下同。本亦作“彎”。射，食亦反。下同。夫音符。磯，居依反，又古愛反。一音祈。復，扶又反。" }
      - { type: z, text: "“莫高”至“我後”。○正義曰：王既信讒，而加罪於大子，仍有殺太子之心，謂人不知，故告之。言莫有極高者，非是山也。言山最極高。莫有極深者，非是泉也。言泉最極深。然山雖高矣，人能登其巔；泉雖深矣，人能入其淵，是亦無所不至也。人既無所不至，難以匿其情矣。王今實有殺太子之心，而謂人不覺。人猶有然而存於心，知王之欲殺太子也。如此，則君子幽王無輕易用讒人之言，將有耳屬而聽之於垣壁者，知王受人之讒言也。王之所愛，褒姒也，故禁之。言人無得逝之我魚梁，無得發開我魚笱。若之我梁，發我笱，是欲盜我所捕之魚，此必有盜魚之罪。以言褒姒亦無得輒之我王宮，無得求取我王愛。若之王宮，取王愛，為盜我母子之寵，必有盜寵之愆也。褒姒既盜寵行讒，太子於先念已既已被讒，恐死之後，懼更有被讒者，無如之何，旋即自決雲：“我身尚不能自容，何暇憂我死之以後乎？”○箋“山高”至“者焉”。○正義曰：箋顧下雲“無易由言”，是禁王受讒畏人知之辭，故為窮高極深，人所升人，無所不至，以喻知王之隱情也。王雖避逃受讒之名，猶有默心存念，知王之情，但不言耳。然天高於山，海深於泉，而不言者，據人所可履踐之處而言也。○傅“念父”至“而慕”。○正義曰：言無暇憂恤，是先有其志，今因而不暇耳。先有志者，即念父也。念者，恐其將受讒。今無如之何，故自決也。“高子曰”以下，皆《孟子》文也。而怨父危疑之理，先達已有是非之論，以此篇終，故引之以明義也。按彼公孫丑稱高子之言以問孟子，非高子自與孟子對言也。趙岐曰：“高子，齊人也。”怨者，怨親之過，故謂之小人也。“固哉”，言其固陋也。高子年老於孟子，故謂之“高叟”。重言“固哉”，高叟之為詩，傷其不達詩意之甚也。《凱風》，親之過小者，以言莫慰母心，母心不悅，故親之過小也。《小弁》則王欲殺太子，是親之過大也。愈，益也。而過大矣，而孝子不怨，以越人遇其親，是益疏也，故曰不孝。磯，激也。過小耳，而孝子感激，輒怨其親，亦不孝也。孔子以舜年五十而思慕其親不殆，稱曰孝之至。孝之不可以已也。孔子之善舜，如高子譏《小弁》為不達詩之意也。皆孟子與其弟子公孫丑相答問，不言公孫丑者，取其意而略之也。" }
      - { type: j, text: "《小弁》八章，章八句。" }
      - { type: j, text: "《巧言》，刺幽王也。大夫傷於讒，故作是詩也。" }
      - { type: j, text: "悠悠昊天，曰父母且。無罪無辜，亂如此幠。幠，大也。箋雲：悠悠，思也。幠，敖也。我憂思乎昊天，愬王也。始者言其且為民之父母，今乃刑殺無罪無辜之人，為亂如此，甚敖慢無法度也。○且，徐七餘反，協句應爾。觀箋意，宜七也反。幠，火吳反。下同。思，息嗣反。下同。傲，五報反。下同。本又作“敖”。愬音素。" }
      - { type: j, text: "昊天已威，予慎無罪。昊天大幠，予慎無辜。威，畏。慎，誠也。箋雲：已、泰皆言甚也。昊天乎，王甚可畏。王甚敖慢，我誠無罪而罪我。○大音泰，本或作“泰”，徐敕佐反。" }
      - { type: z, text: "“悠悠”至“無辜”。○毛以為，大夫傷讒而本之，故言悠悠然我心憂，思乎昊天，訴之也。王之始者言曰：“我當且為民之父母也。”自許欲行善政。今乃刑殺其無罪無辜者之眾人，王政之亂，如此甚大也。昊天乎，王甚可畏！我誠無罪而罪我，是可畏也。昊天乎，王甚虐大！我誠無辜而辜我，是虐大也。○鄭唯言“王為亂如此，甚傲慢無法度”，乃“昊天乎，王甚傲慢”為異耳，皆以且為辭。○傳“幠，大”。○正義曰：《釋詁》文。禮，肉臠亦謂之幠。○箋“幠敖”至“法度”。○正義曰：“幠，敖”，《釋言》文。易傳者，以下言“已威”為甚可畏，而泰幠言甚大，非類，故為“傲慢”。下既為傲，此亦為傲也。幽王之惡，始終一也。始者言其身且為民之父母者，無道之君，皆自謂所為者是道，非知其不可而為之也。放其初即位皆詐為善，但行不副言，故詩人述其初辭以責之。" }
      - { type: j, text: "亂之初生，僣始既涵。僣，數。涵，容也。箋雲：僣，不信也。既，盡。涵，同也。王之初生亂萌，群臣之言，不信與信，盡同之不別也。○僣，毛側蔭反，鄭子念反。涵，毛音含，鄭音鹹，《韓詩》作“減”。減，少也。數音朔。下同。不別，彼列反。亂之又生，君子信讒。箋雲：君子，斥在位者也。在位者信讒人之言，是復亂之所生。君子如怒，亂庶遄沮。遄，疾。沮，止也。箋雲：君子見讒人如怒責之，則此亂庶幾可疾止也。○遄，市專反。沮，辭呂反。" }
      - { type: j, text: "君子如祉，亂庶遄已。祉，福也。箋雲：福者，福賢者，謂爵祿之也。如此，則亂亦庶幾可疾止也。○祉音恥。已音以。" }
      - { type: z, text: "“亂之”至“遄已”。○毛以為，上既言王之亂，又本亂之所由。言亂之初所以生者，讒人數緣事始自入，盡得容受其言，知王不察真偽，遂以漸進讒也。亂之又復所生益大者，在位朝臣君子信讒言也。王既不察，故讒言得自容入；臣又信之，故讒言遂興，所以枉殺無辜，致此大亂也。又言政令雖亂，可反覆。君子在位之人，見讒人之言，如怒責之，則此亂庶幾可疾止。君子在位之人，見有德賢者，如福祿之，則此亂亦庶幾可疾止。居子何不怒讒而福賢，以止亂乎？○鄭唯以僣為不信，涵為同，言信與不信，同之不別，故讒言遂生。餘同。○傳“僣，數。涵，容”。○正義曰：王肅雲：“言亂之初生，讒人數緣事始自入，盡得容。其讒言有漸也。”○箋“僣不信”至“不別”。○正義曰：此亂之初生，是本其所由，故言初生亂萌。以人之行讒，當有所因，君能明察是非，則偽辭不入，讒言無由進也。正由明不燭下，於群臣之言，信與不信，盡同之不別。讒人得，自是生心以進讒害賢，遂使王殺戮無辜，是生亂也。以信與不信混同不別，於致讒為宜，故易傳也。○箋“君子”至“所生”。○正義曰：何知君子非幽王，而以為在位者，以上言“初生”，已本王矣。君子若還斥王，不宜言“又”，以此知非王也。讒人之能害善，乃是王者信之。而責在位信讒者，以讒人能使王刑殺無罪，必朝有黨援。若在位骨鯁之臣固執不信，則讒者之言亦不行矣。王之罪人，必詢諸朝廷。王既容之，在位又信之，所以成此亂。在位，謂大臣也。下文言令怒讒言，福賢人，令其行立威福，明是臣之貴者。《洪範》稱臣不得作福作威，言令怒讒福賢者，欲令之告王行之，不令其專制。" }
      - { type: j, text: "君子屢盟，亂是用長。凡國有疑，會同則用盟而相要也。箋雲：屢，數也。盟之所以數者，由世衰亂多相背違。時見曰會，殷見曰同，非此時而盟謂之數。○屢，本又作“婁”，力住反。長，丁丈反，又直良反。要，於遙反。數音朔。背音佩。見，賢遍反。下同。君子信盜，亂是用暴。盜，逃也。箋雲：盜，謂小人也。《春秋傳》曰：“賤者窮諸盜。”盜言孔甘，亂是用餤。餤，進也。○餤，沈旋音談，徐音鹽。" }
      - { type: j, text: "匪其止共，維王之邛。箋雲：邛，病也。小人好為讒佞，既不共其職事，又為王作病。○共音恭，本又作“恭”。邛，其恭反。好，呼報反。共音恭，本亦作“供”。又為，於偽反。" }
      - { type: z, text: "“君子”至“之邛”。○正義曰：上既言亂之生，此又言亂之長。言在位君子之人，數數相與要盟，其亂是用之故而滋長也。在位君子之人，又信是兇盜讒人之言，其亂是用之故而暴甚也。所以益甚者，此險盜之人，其言甚甘，使人信之而不已，其亂用是之故而日益進也。此小人好為讒佞者，非於其職廢此供奉而已，又維與王之為病害也。食之甘者，使人嗜之而不厭；言之美者，使人聽之而不倦，故以美言為甘也。○傳“凡國”至“相要”。○正義曰：言此者，解屢意。非此時而盟，即為屢也。言凡國有疑，謂於諸侯群臣有疑，不相協，則在會同之上用盟禮，告盟而相要束。《司盟職》曰：“凡邦國有疑會同，則掌其盟約之載，及其禮儀，北面詔明神。”是也。定本及《集本》皆雲“用盟而不相要，謂若會同則用盟。若無疑事，則不會同而不相要。”用盟屬上為句，義亦通也。○傳“盜，逃”。○正義曰：文十八年《左傳》曰：“竊賄為盜。”則盜者竊物之名。毛解名曰盜意也。《風俗通》亦云：“盜，逃也。言其晝伏夜奔，逃避人也。”○箋“盜謂”至“諸盜”。○正義曰：箋以詩刺讒，非刺盜賊，解其言盜之意。以為盜竊者，必小人；讒者，亦小人，因以盜名之，故云“盜，謂小人”。引《春秋傳》以證之。所引者，《公羊傳》文：“弒君者，曷為或稱名氏，或不稱名氏？大夫弒君稱名氏，賤者窮諸人。”何休曰：“賤謂士也。士正自當稱人。”又曰：“大夫自相殺稱人，賤者窮諸盜。”何休曰：“降大夫稱人，降士使稱盜者，所以別死刑輕重也。”傳言窮者，盡也，弒君則盡於稱人，殺大夫則盡於稱盜。言盡此以下，更無稱也。小人賤者盡於盜，知盜是惡名，故引以證盜為小人也。《公羊傳》立等級者，言其正例耳。其餘文異者，皆有褒貶，事具於傳也。" }
      - { type: j, text: "奕奕寢廟，君子作之。秩秩大猷，聖人莫之。他人有心，予忖度之。躍躍毚兔，遇犬獲之。奕奕，大貌。秩秩，進知也。莫，謀也。毚兔，狡兔也。箋雲：此四事者，言各有所能也。因己能忖度讒人之心，故列道之爾。猷，道也。大道，治國之禮法。遇犬，犬之馴者，謂田犬也。○奕音亦。秩音帙。莫如字，又作“漠”，同。一本作“謨”。按《爾雅》漠、漠同訓謀。莫協韻為勝。忖，本又作“寸”，同七損反。度，待洛反。注皆同。躍，他歷反。毚，士鹹反。遇犬，如字，世讀作愚，非也。知音智。狡，古卯反。馴音旬，又音唇。" }
      - { type: z, text: "“奕奕”至“獲之”。○正義曰：讒人為讒，自謂深密。此言己能知之。言奕奕然高大之寢廟，君子之人所能製作之。秩秩然者進智之大道，聖德之人能謀立之。彼他人而有讒佞之心，我能忖度而知之。躍躍然者跳疾之狡兔，遇值犬則能獲得之。○傳“毚兔，狡兔”。○正義曰：《蒼頡解詁》雲：“毚，大兔也。大兔必狡猾，又謂之狡兔。”《戰國策》曰“東郭逡者，海內之狡兔”，是也。○箋“此四事”至“田犬”。○正義曰：此四事以尊卑為先後，大猷雖是常法，不如宗廟為尊，故寢廟在大猷之先。兔乃走獸，故在他人之後。連言寢廟者，《周禮》注云“前曰廟，後曰寢”，則廟寢一物。先寢後廟，便文耳。此自工匠所造而言。君子者，《閟宮》曰：“新廟奕奕，奚斯所作。”彼“奚斯”，君子也。以教護課程，必君子監之，乃得依法制也。大道，治國禮法，聖人謀之，若周公之制禮樂也。遇犬者，言兔逢遇犬，則彼獲耳。遇非犬名，故王肅雲“言其雖騰躍逃隱其跡，或適與犬遇而見獲”，是也。以能獲兔，知是犬之馴擾者，謂田犬也。犬有守犬、田犬，故辨之。" }
      - { type: j, text: "荏染柔木，君子樹之。往來行言，心焉數之。荏染，柔意也。柔木，椅、桐、梓、漆也。箋雲：此言君子樹善木，如人心思數善言而出之。善言者，往亦可行，來亦可行，於彼亦可，於己亦可，是之謂行也。○荏，而甚反。染音冉。數，所主反。注同。椅，於宜反。梓漆，上音子，下音七。蛇蛇碩言，出自口矣。蛇蛇，淺意也。箋雲：碩，大也。大言者，言不顧其行，徒從口出，非由心也。○蛇，以支反。行，下孟反。" }
      - { type: j, text: "巧言如簧，顏之厚矣。箋雲：顏之厚者，出言虛偽而不知慚於人。○簧音黃。" }
      - { type: z, text: "“荏染”至“厚矣”。○正義曰：言荏染柔忍之木，君子之人所樹之也。言君子樹木，必身簡擇，取善木然後樹之。喻往來可行之言，亦君子口所出之也。言君子出言，必心焉思數，知善而後出之。小人則不然，蛇蛇然淺意之大言，徒出自口矣，都不由於心。得言即言，必不思數也。巧為言語，結構虛辭，速相待合，如笙中之簧，聲相應和，見人不知慚愧，其顏面之容甚厚矣。君子樹之，不言擇木；心焉數之，不言出口，雖相對而文互也。○傳“柔木，椅、桐、梓、漆”。○正義曰：《定之方中》雲“樹之榛、栗、椅、桐、梓、漆”，言文公所樹。是君子樹之，故引彼文以解柔木也。不言榛栗，從可知。" }
      - { type: j, text: "彼何人斯，居河之麋。水草交謂之麋。箋雲：何人者，斥讒人也。賤而惡之，故曰“何人”。○麋，本又作“湄”，音眉。惡，烏路反。無拳無勇，職為亂階。拳，力也。箋雲：言無力勇者，謂易誅除也。職，主也。此人主為亂作階，言亂由之來也。○拳音權，徐已袁反。易，夷豉反。既微且尰，爾勇伊何？骭瘍為微。腫足為尰。箋雲：此人居下溼之地，故生微腫之疾。人憎惡之，故言女勇伊何，何所能也。○尰，市勇反。骭，戶諫反，腳脛也。瘍音羊，本亦作“傷”，音同，創也。腫，諸勇反。" }
      - { type: j, text: "為猶將多，爾居徒幾何？箋雲：猶，謀。將，太也。女作讒佞之謀大多，女所與居之眾幾何人，素能然乎？○幾，居豈反。注同。大音泰，又如字。傃音素。" }
      - { type: z, text: "“彼何人”至“幾何”。○正義曰：疾讒佞之人謂之何人，言彼何人斯，居在於河之麋際，既無拳力，又無勁勇，亦易誅除耳，而敢主為此亂之階梯也？此人既腳骭有微之疾，而足跗且有尰之疾。爾假有勇，伊何能為？況復無之！而汝敢為此惡，汝作為讒佞之謀大多，汝所與聚居之徒眾幾何許人，而能為此？怪其言多且巧，疑其眾教之也。○傳“水草交謂之麋”。○正義曰：《釋水》文。○箋“何人”至“曰何人”。○正義曰：言何人者，不識而問之辭。此既讒己，不是不識，而曰何人者，賤而惡之，作不識之辭，故曰何人。下篇疾暴公之侶謂之何人，斥其姓名為大切，亦作不識之辭以疾之。○傳“骭瘍”至“為尰”。○正義曰：皆《釋訓》文也。彼引此“既微且尰”，然後為此辭以釋之。孫炎曰：“皆水溼之疾也。”郭璞曰：“骭，腳脛也。瘍，瘡也。”然則膝脛之下有瘡腫，是涉水所為，故箋亦云此人居下溼之地，故生微尰之疾。“居河之麋”，是居下溼也。" }
      - { type: j, text: "《巧言》六章，章八句。" }
      - { type: j, text: "《何人斯》，蘇公刺暴公也。暴公為卿士而譖蘇公焉，故蘇公作是詩以絕之。暴也、蘇也，皆畿內國名。" }
      - { type: z, text: "“《何人斯》八章，章六句”至“絕之”。○正義曰：《何人斯》者，蘇公所作以刺暴公也。暴公為王卿士，而於王所讒譖蘇公，令使獲譴焉，故蘇公作是《何人斯》之詩以絕之。言暴公不復與交也。按此經無絕暴公之事，唯首章下二句雲“伊誰雲從，誰暴之雲”，亦非絕之言，但解何人之意，言己以為暴公之所言，是暴公譖己，事彰無所致疑。此句是絕之辭也。經八章，皆言暴公之侶疑其讒己而未察，故作詩以窮之，不欲與之相絕。疑者未絕，則不疑者絕可知。疑暴公之侶窮極其情，欲與之絕，明暴公絕矣，故序專雲刺暴公而絕之也。刺暴公而得為王詩者，以王信暴公之讒而罪己，刺暴公亦所以刺王也。○箋“暴也”至“國名”。○正義曰：蘇忿生之後。成十一年《左傳》曰“昔周克商，使諸侯撫封，蘇忿生以溫為司寇”，則蘇國在溫。杜預曰：“今河內溫縣。”是蘇在東都之畿內也。春秋之世，為公者多是畿內諸侯。遍檢《書傳》，未聞畿外有暴國。今暴公為卿士，明畿內，故曰皆畿內國名。春秋時，蘇稱子。此雲公者，子蓋子爵，而為三公也。暴公為卿士，而亦稱公，當卿士兼公官也。又暴公為卿士而譖蘇公，則蘇公為卿士以否，未可知。但何人為暴公之侶，雲“二人從行”，則亦卿士也，故王肅雲：“二人俱為王卿相，隨而行。”下雲“及爾如貫”，鄭雲“俱為王臣”，蘇公亦為卿士矣。" }
      - { type: j, text: "彼何人斯？其心孔艱。胡逝我梁，不入我門？箋雲：孔，甚。艱，難。逝，之也。梁，魚梁也，在蘇國之門外。彼何人乎？謂與暴公俱見於王者也。其持心甚難知，言其性堅固，似不妄也。暴公譖己之時，女與之乎？今過我國，何故近之我梁，而不入見我乎？疑其與之而未察，斥其姓名為大切，故言何人。○女與，音豫。下“疑其與之”、“女與於譖”皆同。大音泰。" }
      - { type: j, text: "伊誰雲從？維暴之雲。雲，言也。箋雲：譖我者，是言從誰生乎？乃暴公之所言也。由己情而本之，以解何人意。○己音紀。" }
      - { type: z, text: "“彼何人”至“之雲”。○正義曰：言彼何人乎？與暴公俱見王之人。此其持心甚難知也。跡同譖己，貌似不妄，故難知也。又言巳疑之狀。暴公譖我之時，汝應與之。汝若不與，今過我國，何故之我梁而不入我門以見我乎？得不由譖我意慚而不得來也？猶冀其不然，欲與和好。乃開解之曰：“令譖我者，維誰之所云從而出乎？維乃暴公之所云耳。”言爾應不與，當與我和親也。“伊”字毛皆為“維”，鄭皆為“是”，則此亦當以此為異。○箋“梁魚”至“不妄”。○正義曰：以之梁而不入門，故知其梁近在國門之外也。下雲“維暴之雲”，則何人非暴公矣。刺暴公而責何人，謂與暴公俱見王者也。若不與暴公俱見王，蘇公不當疑之也。疑之而云其心難知，故著其心性堅固，似非虛妄之人。若非此人性自虛妄，貌又可疑，則譖己必矣，非難知也。○箋“由已情”至“何人意”。○正義曰：心疑何人譖己，猶尚冀其不然，故既設疑言，復開解之。初疑何人與暴同譖，旋即復言維暴獨雲，一疑一舍，非他人教示，皆出己之情耳。故云“由已情而本之，開解何人之意”。若何人實不共譖，欲使不復猜，己還與和親。" }
      - { type: j, text: "二人從行，誰為此禍？胡逝我梁，不入唁我？箋雲：二人者，謂暴公與其侶也。女相隨而行見王，誰作我是禍乎？時蘇公以得譴讓也。女即不為，何故近之我梁，而不入吊唁我乎？○唁音彥。見，賢遍反。譴，遣戰反。女音汝。下注同。" }
      - { type: j, text: "始者不如今，雲不我可！箋雲：女始者於我甚厚，不如今日也。今日雲我所行，有何不可者乎？何更於已薄也？○日，而乙反。己音紀，" }
      - { type: z, text: "“二人”至“我可”。○正義曰：言暴公與其侶二人相從而行以見王，誰作我此禍，而令王譴讓我乎？汝從暴公行者，若不與暴公譖我，何故近之我魚梁，而不入門吊唁我也？汝始者，能於我甚厚，不如今日。汝今云何不以我為可，言我有何行不可於汝，而更於我薄而不吊唁乎？知己被譴而不唁，疑其讒已而內慚。○箋“二人”至“唁我乎”。○正義曰：以上言“維暴之雲”，則暴是其一。明二之者，謂暴與其侶，侶即何人也。疑其與蘇同情，故並而誰之以見意耳。禮，吊生曰唁。既言為禍，而責人不唁，知蘇公已得譴讓也，謂以咎譴而責讓之也。今蘇公被罪之後，而在國見何人之其梁陳，是不奪其國，明是譴責而已，未加刑殺也。言唁者，雖不奪國，以被罪當吊之。吊生曰唁，不必失國也。" }
      - { type: j, text: "彼何人斯？胡逝我陳？我聞其聲，不見其身。陳，堂塗也。箋雲：堂塗者，公館之堂塗也。女即不為，何故近之我館庭，使我得聞女之音聲，不得睹女之身乎？○睹，丁古反，本又作“覩”。" }
      - { type: j, text: "不愧於人？不畏於天？箋雲：女今不入唁我，何所愧畏乎？皆疑之，未察之辭。○媿，九位反，或作愧。" }
      - { type: z, text: "“彼何”至“於天”。○正義曰：又研窮何人。言彼何人乎？汝若不譖我，何故近之我館舍之庭，使我得聞其音聲，不得睹見其身乎？得不譖我乎，意慚而不來見我也。汝不來見我，而不吊唁我，是不慚愧於人，又不畏懼於天也。天有尊卑之道，人有往來之節，使吉有賀慶，兇有吊唁，所以敬天道，示慚愧，故不相吊唁，為不愧人、不畏天也。○傳“陳，堂塗”。○正義曰：《釋宮》雲：“堂塗謂之陳。”孫炎曰：“堂下至門之徑。”○箋“堂塗者，公館之堂塗”。○正義曰：禮有公館、私館。公館者，公家築為別館以舍客也。上雲不入我門，則不得入所居之宮，故知逝陳者，至公館之塗也。以館者所以舍客，故雖不見主，得至其陳。" }
      - { type: j, text: "彼何人斯？其為飄風。胡不自北？胡不自南？胡逝我梁，祇攪我心？飄風，暴起之風。攪，亂也。箋雲：祇，適也。何人乎，女行來而去疾如飄風，不欲入見我？何不乃從我國之南，不則乃從我國之北？何近之我梁，適亂我之心，使我疑女？○飄，避遙反，疾風也。沈又方消反。祇音支。攪，交卯反。" }
      - { type: z, text: "“疾如飄風”。○正義曰：以其徑來而徑去，知為疾也。非在道急速，故下章言其安行。" }
      - { type: j, text: "爾之安行，亦不遑舍。爾之亟行，遑脂爾車。壹者之來，云何其盱？箋雲：遑，暇。亟，疾。盱，病也。女可安行乎？則何不暇舍息乎？女當疾行乎？則又何暇脂女車乎？極其情，求其意，終不得一者之來見我，於女亦何病乎？○亟，紀力反。脂音支。盱，況於反。" }
      - { type: z, text: "“爾之”至“其盱”。○毛於下章以“祇”為“病”。言使我病，是使蘇公之病。則此盱亦為蘇公之病也。既數過其國而不入，故又極其情以疑之。我止欲言汝安舒而行乎？亦不見汝閒暇而舍息止。欲言汝之急疾而行乎？汝又閒暇而脂汝之車。汝往而不入見我，所以疑也。且若不譖我，則一者之來見王以後，云何使我有罪譴之病乎？亦以我得病，在汝見王之後，所以尤疑也。毛以此“云何其盱”與下“俾我祇也”互文，皆言云何而使我有罪病也。○鄭以盱為何人病為異。餘同。○箋“一者”至“何病”。○正義曰：箋以上章責其不來見己，下章言入與不入，則一者之來，當為來見蘇公，不得為見王也。且蘇公之所疑者，以不見何人，故言一者之來見我，於汝亦何病也。是欲見以解疑之辭。此本之於何人為不病，下反之已為得安，是章次相成也。" }
      - { type: j, text: "爾還而入，我心易也。還而不入，否難知也。壹者之來，俾我祇也。易，說。祇，病也。箋雲：還，行反也。否，不通也。祇，安也。女行反入見我，我則解說也。反又不入見我，則我與女情不通，女與於譖我與不，復難知也。一者之來見我，我則知之，是使我心安也。○易，夷豉反。注同。《韓詩》作“施”，施，善也。否，方九反，一雲：“鄭符鄙反。”俾，必爾反。祇，祈支反，一雲：“鄭止支反。”說音悅。下同。解音蟹。與音豫。復，扶又反。下章同。" }
      - { type: j, text: "伯氏吹壎，仲氏吹篪。土曰壎，竹曰篪。箋雲：伯仲喻兄弟也。我與女恩如兄弟，其相應和如壎篪。以言俱為王臣，宜相親愛。○壎，況袁反。篪音池。應，應對之應。和，胡臥反。及爾如貫，諒不我知！出此三物，以詛爾斯！三物，豕、犬、雞也。民不相信則盟詛之。君以豕，臣以犬，民以雞。箋雲：及，與。諒，信也。我與女俱為王臣，其相比次，如物之在繩索之貫也。今女心誠信，而我不知，且共出此三物，以詛女之此事。為其情之難知，已又不欲長怨，故設之以此言。○貫，古亂反。諒音亮。詛，側助反，以禍福之言相要曰詛。比，毗志反。索，素洛反。為其，於偽反。長如字，又張丈反。" }
      - { type: z, text: "“伯氏”至“爾斯”。○正義曰：既窮之而不得其情，己不欲長怨，欲與之詛而和諧，故言有伯氏之兄吹壎，又仲氏之弟吹篪以和之，其情相親，其聲相應和矣。言我與汝何人，其恩亦當如伯仲之為兄弟，其情志亦當如壎篪之相應和，不當有怨惡也。何者？我與汝俱為王臣，其相比次，如物之在繩索之貫，宜應和相親，何由汝之誠信而不使我知，而令我疑也？若實不譖者，則當共出豕、犬、雞之三物以詛盟爾之此事，使讒否有決，令我不疑，當還與汝相親，不欲長怨故也。○傳“土曰壎，竹曰篪”。○正義曰：土曰壎，《漢書·律曆志》文也。《周禮·小師職》作“壎”，古今字異耳。注云：“壎，燒土為之，大如雁卵。”鄭司農雲：“壎六孔。”《釋樂》雲：“大壎謂之嘂。”音叫。孫炎曰：“音大如叫呼也。”郭璞曰：“壎，燒土為之，大如鵝子，銳上平底，形似稱錘，六孔。小者如雞子。”《釋樂》又云：“大篪謂之沂。”李巡曰：“大篪，其聲非一也。”郭璞曰：“篪以竹為之，長尺四寸，圍三寸。一孔上出，徑三分，橫吹之。小者尺二寸。”即引《廣雅》雲：“八孔。”《小師》注，鄭司農雲：“篪七孔。”蓋不數其上出者，故七也。《世本》雲：“暴辛公作壎。蘇成公作篪。”譙周《古史考》雲：“古有壎篪，尚矣。周幽王時，暴辛公善壎，蘇成公善篪，記者因以為作，謬矣。”《世本》之謬，信如周言。其雲蘇公、暴公所善，亦未知所出。蘇、暴並公卿，不當自言於樂之小器以相親也。又此窮極何人，何人非暴公也，故鄭以為喻。王肅亦云：“我與汝同寮，長幼之官如篪壎之相和。”與鄭同也。○傳“三物”至“以雞”。○正義曰：隱十一年《左傳》曰：“鄭伯使卒出豭，行出犬、雞，以詛射穎考叔者。”豭即豕也，並言詛而俱用三，故知此三物豕、犬、雞也。又解所以有詛者，民不相信則盟詛之，言古者有此禮，故欲與之詛也。《司盟》曰：“盟萬民之犯命者，詛其不信者。”是不相信，有盟詛之法也。彼不信，自在詛下，而兼言盟者，以詛是盟之細，故連言之也。定本“民不相信則詛之”，無“盟”字。犯命者盟之，不信者詛之，是盟大而詛小也。盟、詛雖大小為異，皆殺牲歃血，告誓明神。後若背違，令神加其禍，使民畏而不敢犯，故民不相信，為此禮以信之。此傳言民者，據《周禮》之文耳。其實人君亦有詛法。襄十一年《左傳》言：“季武子將作三軍，盟諸僖閎，詛諸五父之衢。”定六年，既逐，陽虎“及三桓盟於周社，盟國人於亳社，詛諸五父之衢”。是人君與群臣有詛法也。此何人與蘇公同為王臣，蘇公與之詛，則諸相疑亦應有詛法，但春秋之世無其事耳。詛之所用，一牲而已，非三物並用。而言出此三物，以三物皆是詛之所用，總而言之，故傳辨其等級，雲“君以豕，臣以犬，民以雞”。則鄭伯使卒出豭，行出犬、雞，所得三物並用者，時考叔為子都所射，鄭伯不誅子都，而使諸軍詛之。百人為卒，出一豭詛之。二十五人為行，或出犬，或出雞以詛之。每處亦止用一牲，非一處而用三物也。如此傳，君乃得用豕。彼百人即得用豭者，於時鄭伯使之詛，故得用君牲也。以行之人數少於卒，自為等級耳。此豕、犬、雞，詛所用也。若盟，皆用牛。哀十五年《左傳》說衛太子蒯聵與伯姬輿豭以盟孔悝者，時太子未立，不敢從人君之禮。故鄭《異義駁》雲：《詩》說及鄭伯使卒及行所出，皆謂詛耳，小於盟也。《周禮·戎右職》雲：“若盟，則以玉敦闢盟，遂役乏，贊牛耳，桃茢。”哀十七年《左傳》曰：“孟武伯問於高柴曰：‘諸侯盟，誰執牛耳？’”然盟者，人君用牛。伯姬盟孔悝以豭，下人君牲，是盟用牛也。此謂大事正禮所當用者耳。若臨時假用其禮者，不必有牲，故《左傳》孟任割臂以盟，莊公華元入楚師，登子反之床，子反懼而與之盟，皆無牲也。" }
      - { type: j, text: "為鬼為蜮，則不可得。有靦面目，視人罔極。蜮，短狐也。靦，姡也。箋雲：使女為鬼為蜮也，則女誠不可得見也。姡然有面目，女乃人也。人相視無有極時，終必與女相見。○蜮音或，沈又音域，狀如鱉，三足。一名射工，俗呼之水弩。在水中含沙射人。一雲射人影。○靦，土典反。姡，戶刮反，面醜也。" }
      - { type: j, text: "作此好歌，以極反側。反側，不正直也。箋雲：好猶善也。反側，輾轉也。作八章之歌，求女之情。女之情反側極於是也。○音以，古以字本作以。" }
      - { type: z, text: "“為鬼”至“反側”。○正義曰：研窮而不得其情，於是怒而責之。言汝若為鬼也為蜮也，則誠不可得而見，不須與我為詛。今汝有靦面目，乃是人也。瞻視於人，無有極已之時，我必將與汝相見。汝寧不披寫汝情，不與我盟詛乎？以疑爾譖我之故，我作此八章之善歌，窮極爾反側之情，冀得其實也。○傳“蜮，短狐。靦，姡”。○正義曰：《洪範》五行傳雲：“蜮如鱉，三足，生於南越。南越婦人多淫，故其地多蜮，淫女或亂之氣所生也。”陸機《疏》雲：“一名射影，江淮水皆有之。人在岸上，影見水中，投人影則殺之，故曰射影。南人將入水，先以瓦石投水中，令水濁，然後入。或曰含沙射人皮肌，其瘡如疥。”是也。“靦，姡”，《釋言》文。孫炎曰：“靦人面姡然。”《說文》雲：“靦，面見人。”“姡，面靦也。”然則靦與姡皆面見人之貌也。○傳“反側，不正直”。○正義曰：《洪範》雲：“無反無側，王道正直。”則知側是不正直也。反側者，翻覆之義，故箋以為輾轉，申傳不正直之義，其意與傳同。" }
      - { type: j, text: "《何人斯》八章，章六句。" }
      - { type: j, text: "《巷伯》，刺幽王也。寺人傷於讒，故作是詩也。巷伯，奄官。寺人，內小臣也。奄官上士四人，掌王后之命，於宮中為近，故謂之巷伯，與寺人之官相近。讒人譖寺人，寺人又傷其將及巷伯，故以名篇。○巷伯，官名也。寺如字，又音侍。奄，於檢反。官，本或將此注為序文者。近，附近之近，下“近嫌”同。" }
      - { type: z, text: "“《巷伯》七章，上四章章四句，次章五句，次章八句，卒章六句”至“奄官”。○正義曰：此經無巷伯之字，而名篇曰《巷伯》，故序解之雲：“巷伯，奄官。”言奄人為此官也。官下有“兮”，衍字。定本無“巷伯奄官”四字，於理是也。以俗本多有，故解之。○箋“巷伯”至“名篇”。○正義曰：巷伯，是內官也。其官用奄上士四人為之，其職掌王后之命。《天官·序官》雲：“內小臣奄上士四人。”注云：“奄稱士，異其賢。”其職雲“掌王后之命”，是也。又解內小臣而謂之巷伯者，以其此官於宮中為近，故謂之巷伯也。《釋宮》雲：“宮中巷謂之壼。”孫炎曰：“巷，舍間道也。”王肅曰：“今後宮稱永巷，是宮內道名也。”伯，長也，主宮內道官之長。人主於群臣，貴者親近，賤者疏遠，主宮內者皆奄人，奄人之中，此官最近人主，故謂之巷伯也。巷伯是內小臣者，以《周禮》無巷伯之官，奄雖小臣，為長主巷之伯唯內小臣耳，故知是也。蓋其官名內小臣，時人以其職號之稱為巷伯也。與寺人官相近者，寺人亦奄人，其職曰：“掌王之內人及女宮之戒令。”同掌宮內，是相近也。寺人自傷讒作詩，輒名篇為《巷伯》，以其官與巷伯相近，讒人譖寺人，寺人又傷其將及巷伯，故以“巷伯”名篇。以所掌既同，故恐相連及也。" }
      - { type: j, text: "萋兮斐兮，成是貝錦。興也。萋、斐、文章相錯也。貝錦，錦文也。箋雲：錦文者，文如餘泉、餘蚳之貝文也。興者，喻讒人集作己過，以成於罪，猶女工之集采色，以成錦文。○萋，七西反。斐，孚匪反，本或作“菲”。餘蚳，直基反。貝黃白文曰餘蚳。" }
      - { type: j, text: "彼譖人者，亦已大甚！箋雲：大甚者，謂使己得重罪也。○大音泰。注同。徐敕佐反。" }
      - { type: z, text: "“萋兮”至“大甚”。○正義曰：女工集彼眾採而織之，使萋然兮，斐然兮，令文章相錯，以成是貝文，以為其錦也。以興讒人集己諸過而構之，令過惡相積，故成是愆狀以為己罪也。實無罪，而讒之使得重刑，故傷之。雲彼讒譖人者，亦已復為大甚。言非徒譴讓小辜，乃至極刑重罪，是為太甚。○傳“萋斐”至“錦文”。○正義曰：《論語》雲：“斐然成章。”是斐為文章之貌。萋與斐同類，而云成錦，故為文章相錯也。錦而連貝，故知為貝之文。○箋“錦文”至“貝文”。○正義曰：解錦文稱貝者，其文如餘泉、餘蚳之貝文也。《釋魚》說貝文狀雲：“餘蚳，黃白文。餘泉，白黃文。”舍人曰：“水中蟲也。”李巡曰：“餘蚳貝甲黃為質，白為文彩。餘泉貝甲以白為質，黃為文彩。”陸機《疏》雲：“貝，水介蟲也，龜鱉之屬。其文彩之異，大小之殊，甚眾。古者，貨貝是也。餘蚳黃為質，以白為文。餘泉白為質，黃為文。又有柴貝，其白質如玉，紫點為文，皆可列相當。其貝大者，常有徑至一尺六七寸者。今九真、交趾以為杯盤寶物也。”" }
      - { type: j, text: "哆兮侈兮，成是南箕。哆，大貌。南箕，箕星也。侈之言是必有因也，斯人自謂闢嫌之不審也。昔者，顏叔子獨處於室，鄰之釐婦又獨處於室。夜，暴風雨至而室壞。婦人趨而至，顏叔子納之而使執燭。放乎旦而蒸盡，縮屋而繼之。自以為闢嫌之不審矣。若其審者，宜若魯人然。魯人有男子獨處於室，鄰之釐婦又獨處於室。夜，暴風雨至而室壞。婦人趨而託之。男子閉戶而不納。婦人自牖與之言曰：“子何為不納我乎？”男子曰：“吾聞之也，男子不六十不間居。今子幼，吾亦幼，不可以納子。”婦人曰：“子何不若柳下惠然，嫗不逮門之女，國人不稱其亂。”男子曰：“柳下惠固可，吾固不可。吾將以吾不可，學柳下惠之可。孔子曰：‘欲學柳下惠者，未有似於是也。’”箋雲：箕星哆然，踵狹而舌廣。今讒人之因寺人之近嫌而成言其罪，猶因箕星之哆而侈大之。○哆，昌者反，《說文》雲：“張口也。”《玉篇》尺紙反，又昌可反。侈，尺是反，又式是反。闢音避。下同。釐，力之反，寡婦也，依字作“嫠”。放，甫往反。蒸，之升反。縮，所六反，又作“宿”，同。間，間廁之間，又音閒。嫗，紆甫反，又紆具反，本或作“煦”，況甫反。踵，章勇反，足根也。狹音洽。" }
      - { type: j, text: "彼譖人者，誰適與謀？箋雲：適，往也。誰往就女謀乎？怪其言多且巧。○適如字，王、徐皆都歷反。下同。" }
      - { type: z, text: "“哆兮”至“與謀”。○正義曰：既言讒人集成己罪，又言罪有所因。言有星初本相去哆然寬大為踵兮，其又侈之更益而大為舌兮，乃成是南箕之星。言箕之所成，以由踵已哆、又侈之而為舌故也。以興讒人因寺人初有小嫌疑為始兮，其又構之更增而其為終兮，乃成其刑罪之禍。言禍之所以成者，亦因始有嫌，又構之而為終故也。言己避嫌不審，使人因之，亦己之所以悔也。因有小嫌，陷己如此，彼讒譖人者，誰往與謀乎？何多而能巧也？○傳“哆大”至“於是”。○正義曰：哆者言其寬大哆哆然，故為大貌。二十八宿有箕星，無南箕，故云“南箕即箕星也”。箕四星，二為踵，二為舌。若使踵本太狹，言雖小寬，不足以為箕。由踵之二星已哆然而大，舌又益大，故所以成為箕也。箕言踵狹而舌廣者，踵對舌為狹耳，其實踵之二星已寬大，故為哆兮也。侈者，因物而大之名。禮於衣袂半而益一謂之侈袂，是因物益大而名之為侈也。侈之言必有因者，由踵已大，故舌得侈之而為箕。斯作詩之人自謂避嫌之不審，由事有嫌疑，故讒者得因之而為罪也。言顏叔子及魯人避嫌審與不審之事，以比之顏叔子納鄰之釐婦，雖執燭繼薪，人不可以家到戶說，奸否難明，是不審也。放乎旦，猶至於旦也。蒸是薪之細者。摍謂抽也。言燭又言薪，則初執燭，次然薪，薪盡乃抽取屋草以繼之也。先言放乎旦，已之為總目，言其然火以至旦，乃更覆說薪盡抽屋之事。其實蒸盡、摍屋是未旦時也。吾聞男女不六十不間居者，謂禮男女年不滿六十，則男子在堂，女子在房，不得間雜在一處而居。若六十，則間居也。此六十，據婦人言耳。男子則七十。《內則》“唯及七十，同藏無間”，是也。必男子七十、女六十同居者，以陰陽道衰，故無嫌也。言今子幼吾亦幼者，止謂未老耳，非稚也。柳下惠固可者，言柳下惠貞絜之名素已彰著，固當如是可。於吾身為此則不可也。汝婦人之意，將以吾之不可，使學柳下惠可者，言己不得學也。孔子曰：“欲學柳下惠可者，未有能似於是”者，言魯人如此為行取高，與柳下惠相似。此言當有成文，不知所出。《家語》略有其事，其言與此小異，又無顏叔子之事，非所引也。傳言此者，證避嫌之事耳。此寺人，奄者也，非能身有姦淫。其所嫌者，不必即是男女是非之事。○箋“踵狹”而“舌廣”。○正義曰：定本“蹱”作“踵”，其義俱通。" }
      - { type: j, text: "緝緝翩翩，謀欲譖人。緝緝，口舌聲。翩翩，往來貌。○緝，七立反，《說文》作“咠”，雲：“鬲語也。”又子立反。翩音篇，字又作“扁”。" }
      - { type: j, text: "慎爾言也，謂爾不信。箋雲：慎，誠也。女誠心而後言，王將謂女不信而不受。欲其誠者，惡其不誠也。○惡，烏路反。" }
      - { type: z, text: "“緝緝”至“不信”。○正義曰：上言謀多而巧，此言為謀之狀。言口舌緝緝然、往來翩翩然相與謀，欲為讒譖之言以害人。自相計議，唯恐不成，相教當誠汝之心而後言也。若言不誠實，則所言不巧，王將謂汝言為不信而不受也。故須誠實言之。" }
      - { type: j, text: "捷捷幡幡，謀欲譖言。捷捷，猶緝緝也。幡幡，猶翩翩也。○捷如字，又音妾。幡，芳煩反。" }
      - { type: j, text: "豈不爾受，既其女遷。遷，去也。箋雲：遷之言訕也。王倉卒豈將不受女言乎？已則亦將復誹誹女。○訕，所諫反，又所奸反。卒，寸忽反。誹，方味反。" }
      - { type: z, text: "“捷捷”至“汝遷”。○毛以為，讒人相戒言，汝若不誠汝之心而言之，王於倉卒之間，豈不為汝受之？但已受之後，知汝言不誠實，王心或將舍汝而更遷去也。○鄭以遷為訕，言王將訕謗汝以遷去，為理不安，故易之。" }
      - { type: j, text: "驕人好好，勞人草草。好好，喜也。草草，勞心也。箋雲：好好者，喜讒言之人也。草草者，憂將妄得罪也。" }
      - { type: j, text: "蒼天蒼天！視彼驕人，矜此勞人！" }
      - { type: z, text: "“驕人”至“勞人”。○正義曰：言讒人謀能功密，為王信用，彼戎則驕逸也。我得罪則憂勞。彼驕人好好然而喜，我勞人草草然而憂，故仰告蒼天，蒼天何不視察彼人之虛妄，而矜哀此勞人。" }
      - { type: j, text: "彼譖人者，誰適與謀？取彼譖人，投畀豺虎。投，棄也。○畀，必二反。下同。豺，士皆反，字或作“犲”。豺虎不食，投畀有北。北方寒涼而不毛。" }
      - { type: j, text: "有北不受，投畀有昊。昊，昊天也。箋雲：付與昊天制其罪也。" }
      - { type: z, text: "“彼譖”至“有昊”。○正義曰：豺虎若不肯食，當擲予有北太陰之鄉，使凍殺之。若有北不肯受，則當擲予昊天，自制其罪。以物皆天之所生，天無推避之理，故止於昊天也。豺虎之食人，寒鄉之凍物，非有所擇。言不食、不受者，惡之甚也。故《禮記·緇衣》曰“惡惡如《巷伯》”，言欲其死亡之甚。○傳“北方”至“不毛”。○正義曰：以北方太陰之氣寒涼而無土毛，不生草木，寒凍不可居處，故棄於彼，欲凍殺之。昭七年《左傳》曰：“食土之毛。”《地官·載師》曰：“宅不毛。”皆謂草木也。" }
      - { type: j, text: "楊園之道，猗於畝丘。楊園，園名。猗，加也。畝丘，丘名。箋雲：欲之楊園之道，當先歷畝丘，以言此讒人欲譖大臣，故從近小者始。○猗，於綺反，徐於宜反。" }
      - { type: j, text: "寺人孟子，作為此詩。凡百君子，敬而聽之。寺人而曰孟子者，罪已定矣，而將踐刑，作此詩也。箋雲：寺人，王之正內五人。作，起也。孟子起而為此詩，欲使眾在位者慎而知之。既言寺人，復自著孟子者，自傷將去此官也。○“作為此詩”，一本雲“作為作詩”。" }
      - { type: z, text: "“楊園”至“聽之”。○正義曰：寺人以身既得罪，恐更濫及善人，故戒時在位，令使自慎。言人欲往之楊園之道，當先加歷於畝丘，而乃後於楊園也。以興讒人欲行譖大臣之法，亦當毀害於小臣而訖，乃後至於大臣也。讒人立意如此，故我寺人之中字曰孟子者，起發為小人之更讒，而作《巷伯》之詩，使凡百汝眾在位之君子者，當敬慎而聽察之，知我之無罪而被讒，讒人不已而敬慎也。此言凡百，則恐遍及在位，而獨以《巷伯》名篇者，以職與巷伯相近，巷伯是其官長，故特憂之。當雲“作詩”，定本雲“作為此詩”，又定本箋有“作，起也”，“作，為也”二訓，自與經相乖，非也。○傳“楊園”至“丘名”。○正義曰：《釋丘》雲：“如畝，畝丘。”李巡曰：“謂丘如田畝曰畝丘也。”孫炎曰：“方百步也。”以“畝丘，丘名”，故知楊園亦園名也。於時王都之側蓋有此園、丘，詩人見之而為辭也。○傳“寺人”至“此詩”。○正義曰：毛解言已定之意也。知罪已定者，若不定則不應疾讒人如此之甚也。以罪定，故知將踐刑也。由踐刑而作此詩，知自言孟子，以殊於餘寺人不被讒者也。○箋“寺人”至“此官”。○正義曰：寺人，王之正內五人。《天官·序官》文也。彼注云：“寺人之言侍也。正內，路寢也。”則五人當在路寢侍王之側也。箋言此者，明寺人非一也。毛解自雲孟子之意，箋又解自言寺人之意。由自傷將去此官，故舉官言之。" }
      - { type: j, text: "《巷伯》七章，四章章四句，一章五句，一章八句，一章六句。" }
      - { type: j, text: "《毛詩正義》" }
