# 周易正義卷九（孔穎達疏）：j 為經文＋王弼注，z 為正義疏文。
sections:
  - id: juan9
    name: 卷九
    blocks:
      - { type: z, text: "正義曰：《說卦》者，陳說八卦之德業變化及法象所為也。孔子以伏犧畫八卦，後重為六十四卦，八卦為六十四卦之本。前《系辭》中略明八卦小成，引而伸之，觸類而長之，天下之能事畢矣。又曰：“八卦成列，象在其中矣。因而重之，爻在其中矣。”又云：“古者包犧氏之王天下也，仰則觀象於天，俯則觀法於地，觀鳥獸之文與地之宜，近取諸身，遠取諸物，於是始作八卦，以通神明之德，以類萬物之情。”然引而伸之，重三成六之意，猶自未明；仰觀俯察，近身遠物之象，亦為未見。故孔子於此，更備說重卦之由，及八卦所為之象，故謂之《說卦》焉。先儒以孔子《十翼》之次，乾坤《文言》在二《系》之後，《說卦》之前。以《彖》、《象》附上下二《經》為六卷，則上《系》第七，下《系》第八，《文言》第九，《說卦》第十。輔嗣之《文言》分咐《乾》、《坤》二卦，故《說卦》為第九。" }
      - { type: z, text: "正義曰：“昔者聖人”至“以至於命”，此一節將明聖人引伸因重之意，故先敘聖人本制蓍數卦爻，備明天道人事妙極之理。" }
      - { type: j, text: "昔者聖人之作《易》也，幽贊於神明而生蓍，幽，深也。贊，明也。蓍受命如向，不知所以然而然也。" }
      - { type: z, text: "“昔者”至“生蓍”。○正義曰：據今而稱上世，謂之昔者也。聰明叡知，謂之聖人。此聖人即伏犧也，不言伏犧而云聖人者，明以聖知而製作也。且下《系》巳云“包犧氏之王天下也，於是始作八卦”，今言“作《易》”，言是伏犧，非文王等。凡言“作”者，皆本其事之所由，故云“昔者聖人之作《易》也”。聖人作《易》，其作如何以此聖知深明神明之道，而生用蓍求卦之法，故曰“幽贊於神明而生蓍也”。○注“幽深也”至“然也”。○正義曰：幽者，隱而難見，故訓為深也。贊者，佐而助成，而令微者得著，故訓為明也。“蓍受命如向，不知所以然而然”者，釋聖人所以深明神明之道，便能生用蓍之意，以神道與用蓍相協之故也。神之為道，陰陽不測，妙而無方，生成變化，不知所以然而然者也。蓍則受人命令，告人吉凶，應人如向，亦不知所以然，而然與神道為一，故《系辭》云“蓍之德員而神”，其受命如向，亦《系辭》文也。" }
      - { type: j, text: "參天兩地而倚數，參，奇也。兩，耦也。七、九陽數，六、八陰數。" }
      - { type: z, text: "“參天”至“倚數”。○正義曰：倚，立也。既用蓍求卦，其揲蓍所得，取奇數於天，取耦數於地，而立七、八、九、六之數，故曰“參天兩地而倚數也”。○注“七九陽數”。○正義曰：先儒馬融、王肅等解此，皆依《系辭》云：“天數五，地數五，五位相得而各有合”，以為五位相合，以陰從陽。天得三合，謂一、三與五也；地得兩合，謂二與四也。鄭玄亦云天地之數備於十，乃三之以天，兩之以地，而倚託大演之數五十也。必三之以天，兩之以地者，天三覆，地二載，欲極於數，庶得吉凶之審也。其意皆以《系辭》所云“大演之數五十，其用四十有九”，明用蓍之數。下云天數五，地數五，五位相得而各有合，天地之數五十有五，以為大演即天地之數。又此上言“幽贊於神明而生蓍”，便云“參天兩地而倚數”，驗文準義，故知如此。韓康伯注《系辭》云“大演之數五十”，用王輔嗣意。云《易》之所賴者五十，其用四十有九，則其一不用也。不用而用以之通，非數而數以之成。用與不用，本末合數，故五十也。以大衍五十，非即天地之數，故不用馬融、鄭玄等說。然此倚數生數，在生蓍之後，立卦之前，明用蓍得數而布以為卦，故以七、八、九、六當之。七、九為奇，天數也；六、八為耦，地數也，故取奇於天，取耦於地，而立七、八、九、六之數也。何以參兩為目奇耦者？蓋古之奇耦，亦以三兩言之。且以兩是耦數之始，三是奇數之初故也。不以一目奇者，張氏云以三中含兩，有一以包兩之義，明天有包地之德，陽有包陰之道，故天舉其多，地言其少也。" }
      - { type: j, text: "觀變於陰陽而立卦。卦，象也。蓍，數也。卦則雷風相薄，山澤通氣，擬象陰陽變化之體；蓍則錯綜天地參兩之數，蓍極數以定象，卦備象以盡數，故蓍曰“參天兩地而倚數”，卦曰“觀變於陰陽”也。" }
      - { type: z, text: "“觀變”至“立卦”。○正義曰：言其作《易》聖人，本觀察變化之道，象於天地陰陽而立乾坤等卦，故曰“觀變於陰陽而立卦”也。○注“卦則雷風”。○正義曰：“卦則雷風相薄，山澤通氣，擬象陰陽變化之體”者，此言六十四卦，非小成之八卦也。伏犧初畫八卦，以震象雷，以巽象風，以艮象山，以兌象澤。八卦未重，則雷風各異，山澤不通，於陰陽變化之理，未為周備，故此下云“八卦相錯，數往者順，知來者逆”，注云“八卦相錯，變化理備，於往則順而知之，於來則逆而數之”是也。知非八卦者，先儒皆以《系辭》論用蓍之法，云：“四營而成易，十有八變而成卦”者，謂用蓍三扐而布一爻，則十有八變為六爻也。然則用蓍在六爻之後，非三畫之時。蓋伏犧之初，直仰觀俯察，用陰陽兩爻而畫八卦，後因而重之為六十四卦，然後天地變化，人事吉凶，莫不周備，縕在爻卦之中矣。文王又於爻卦之下，系之以辭，明其爻卦之中吉凶之義。蓍是數也，《傳》稱物生而後有象，象而後有滋，滋而後有數，然則數從象生，故可用數求象，於是幽贊於神明而生蓍，用蓍之法求取卦爻以定吉凶，《系辭》曰“天生神物，聖人則之，無有遠近幽深，遂知來物”是也。《系辭》言伏犧作《易》之初，不假用蓍成卦，故直言仰觀俯察，此則論其既重之後，端策布爻，故先言生蓍，後言立卦。非是聖人幽贊元在觀變之前。" }
      - { type: j, text: "發揮於剛柔而生爻，剛柔發散，變動相和。" }
      - { type: z, text: "正義曰：既觀象立卦，又就卦發動揮散，於剛柔兩畫而生變動之爻，故曰“發揮於剛柔而生爻”也。" }
      - { type: j, text: "和順於道德而理於義，窮理盡性，以至於命。命者，生之極，窮理則盡其極也。" }
      - { type: z, text: "“和順”至“性命”。○正義曰：蓍數既生，爻卦又立，《易》道周備，無理不盡。聖人用之，上以和協順成聖人之道德，下以治理斷人倫之正義。又能窮極萬物深妙之理，究盡生靈所稟之性，物理既窮，生性又盡，至於一期所賦之命，莫不窮其短長，定其吉凶，故曰“和順於道德而理於義，窮理盡性以至於命”也。○注“命者”至“極也”。○正義曰：命者，人所稟受，有其定分，從生至終，有長短之極，故曰“命者，生之極”也。此所賦命乃自然之至理，故“窮理則盡其極”也。" }
      - { type: z, text: "正義曰：“昔者”至“成章”，此節就爻位明重卦之意。" }
      - { type: j, text: "昔者聖人之作《易》也，將以順性命之理，是以立天之道曰陰與陽，立地之道曰“柔與剛，在天成象，在地成形。陰陽者，言其氣；剛柔者，言其形，變化始於氣象而後成形。萬物資始乎天，成形乎地，故天曰陰陽，地曰柔剛也。或有在形而言陰陽者，本其始也；在氣而言柔剛者，要其終也。" }
      - { type: z, text: "“昔者”至“柔與剛”。○正義曰：八卦小成，但有三畫。於三才之道，陰陽未備，所以重三為六，然後周盡，故云“昔者聖人之畫卦作《易》也”。“將以順性命之理”者，本意將此易卦，以順從天地生成萬物性命之理也。其天地生成萬物之理，須在陰陽必備。是以造化闢設之時，其立天之道，有二種之氣，曰成物之陰與施生之陽也。其立地之道，有二種之形，曰順承之柔與特載之剛也。○注“在形而言陰陽者”。○正義曰：“在形而言陰陽”者，即《坤·象》辭云“履霜堅冰，陰始凝”是也。“在氣而言柔剛”者，即《尚書》云“高明柔克”及《左傳》云“天為剛德”是也。" }
      - { type: j, text: "立人之道曰仁與義。兼三才而兩之，故易六畫而成卦。分陰分陽，迭用柔剛，故易六位而成章，設六爻以效三才之動，故六畫而成卦也。六位，爻所處之位也。二、四為陰，三、五為陽，故曰“分陰分陽”；六爻升降，或柔或剛，故曰“迭用柔剛”也。" }
      - { type: z, text: "“立人之道”至“成章”。○正義曰：天地既立，人生其間。立人之道，有二種之性，曰愛惠之仁；與斷刮之義也。既備三才之道，而皆兩之，作《易》本順此道理，須六畫成卦，故作《易》者，因而重之，使六畫而成卦也。六畫所處，有其六位，分二、四為陰位，三、五為陽位，迭用六、八之柔爻、七、九之剛爻而來居之，故作《易》者分佈六位而成爻卦之文章也。○注“二四”至“為陽者”。○正義曰：“二、四為陰，三、五為陽”者，王輔嗣以為初、上無陰陽定位，此注用王之說也。" }
      - { type: j, text: "天地定位，山澤通氣，雷風相薄，水火不相射，八卦相錯，數往者順，知來者逆，易八卦相錯變化，理備於往則順而知之，於來則逆而數之。是故易逆數也。作《易》以逆睹來事，以前民用。" }
      - { type: z, text: "“天地定位”至“數也”。○正義曰：此一節就卦象明重卦之意，易以乾、坤象天地，艮、兌象山澤，震、巽象雷風，坎、離象水火。若使天地不交，水火異處，則庶類無生成之用，品物無變化之理，所以因而重之，今八卦相錯，則天地人事莫不備矣。故云天地定位而合德，山澤異體而通氣，雷風各動而相薄，水火不相入而相資。既八卦之用變化如此，故聖人重卦，令八卦相錯，乾、坤、震、巽、坎、離、艮、兌，莫不交互而相重，以象天地雷風水火山澤莫不交錯，則易之爻卦，與天地等，成性命之理、吉凶之數，既往之事，將來之幾，備在爻卦之中矣。故易之為用，人欲數知既往之事者，易則順後而知之；人欲數知將來之事者，易則逆前而數之，是故聖人用此易道，以逆數知來事也。○注“作《易》”至“民用”。○正義曰：易雖備知來往之事，莫不假象知之，故聖人作《易》以逆睹來事也。“以前民用”者，易佔事在其民用之前，此《系辭》文，引之以證逆數來事也。" }
      - { type: j, text: "雷以動之，風以散之。雨以潤之，日以烜之。艮以止之，兌以說之。乾以君之，坤以藏之。" }
      - { type: z, text: "正義曰：此一節總明八卦養物之功。烜，乾也。上四舉象，下四舉卦者，王肅云：“互相備也。明雷風與震巽同用，乾坤與天地通功也。”" }
      - { type: j, text: "帝出乎震，齊乎巽，相見乎離，致役乎坤，說言乎兌，戰乎乾，勞乎坎，成言乎艮。" }
      - { type: z, text: "正義曰：“帝出乎震”至“故曰成言乎艮”者，康伯於此無注，然《益》卦六二“王用亨於帝，吉”，王輔嗣注云：“帝者，生物之主，興益之宗，出震而齊巽者也。”王之注意，正引此文，則輔嗣之意，以此帝為天帝也。帝若出萬物，則在乎震；絜齊萬物，則在乎巽；令萬物相見，則在乎離；致役以養萬物，則在乎坤；說萬物而可言者，則在乎兌；陰陽相戰，則在乎乾；受納萬物勤勞，則在乎坎；能成萬物而可定，則在乎艮也。" }
      - { type: j, text: "萬物出乎震，震，東方也。齊乎巽，巽，東南也。齊也者，言萬物之絜齊也。離也者，明也。萬物皆相見，南方之卦也。聖人南面而聽天下，嚮明而治，蓋取諸此也。" }
      - { type: z, text: "正義曰：“萬物出乎震，震，東方”者。解上帝出乎震，以震是東方之卦，斗柄指東為春，春時萬物出生也。“齊乎巽，巽，東南也。齊也者，言萬物之絜齊也”者，解上“齊乎巽”，以巽是東南之卦，斗柄指東南之時，萬物皆絜齊也。“離也者，明也。萬物皆相見，南方之卦也。聖人南面而聽天下，鄉明而治，蓋取諸此也”者，解上“相見乎離”，因明聖人法離之事。以離為象日之卦，故為明也。日出而萬物皆相見也，又位在南方，故聖人法南面而聽天下，鄉明而治也。故云“蓋取諸此也”。" }
      - { type: j, text: "坤也者，地也，萬物皆致養焉，故曰致役乎坤。兌，正秋也，萬物之所說也，故曰說言乎兌。戰乎乾。乾，西北之卦也，言陰陽相薄也。坎者，水也，正北方之卦也，勞卦也，萬物之所歸也，故曰勞乎坎。艮，東北之卦也，萬物之所成終而所成始也，故曰成言乎艮。" }
      - { type: z, text: "“坤也者”至“乎艮”。○正義曰：“坤也者，地也萬物皆致養焉，故曰致役乎坤”者，解上“致役乎坤”。以坤是象地之卦，地能生養萬物，是有其勞役，故云“致役乎坤”。鄭云：“坤不言方者，所言地之養物不專一也。”“兌，正秋也，萬物之所說也，故曰說言乎兌”者，解上“說言乎兌”。以兌是象澤之卦，說萬物者，莫說乎澤，又位是西方之卦，斗柄指西，是正秋八月也。立秋而萬物皆說成也。“戰乎乾，乾，西北之卦也，言陰陽相薄也”者，解上”戰乎乾”。以乾是西北方之卦，西北是陰地，乾是純陽而居之，是陰陽相薄之象也。故曰“戰乎乾”。“坎者，水也，正北方之卦也，勞卦也，萬物之所歸也，故曰勞乎坎”者，解上“勞乎坎”。以坎是象水之卦，水行不捨晝夜，所以為勞卦。又是正北方之卦，斗柄指北，於時為冬，冬時萬物閉藏，納受為勞，是坎為勞卦也。“艮，東北之卦也，萬物之所成終而所成始也，故曰成言乎艮”者，解上“成言乎艮”也。以艮是東北方之卦也。東北在寅醜之間，醜為前歲之末，寅為後歲之初，則是萬物之所成終而所成始也。" }
      - { type: j, text: "神也者，妙萬物而為言者也。於此言神者，明八卦運動、變化、推移，莫有使之然者，神則無物妙萬物而為言者。明雷疾風行，火炎水潤，莫不自然相與為變化，故能萬物既成也。" }
      - { type: z, text: "正義曰：“神也者”至“成萬物也”。此一節別明八卦生成之用。八卦運動，萬物變化，應時不失，無所不成，莫有使之然者，而求其真宰，無有遠近，了無晦跡，不知所以然而然，況之曰神也。然則神也者，非物妙萬物而為言者，神既範圍天地，故此之下不復別言乾坤，直舉六子以明神之功用。" }
      - { type: j, text: "動萬物者，莫疾乎雷。橈萬物者，莫疾乎風。燥萬物者，莫乎火。說萬物者，莫說乎澤。潤萬物者，莫潤乎水。終萬物始萬物者，莫盛乎艮。故水火相逮，雷風不相悖，山澤通氣，然後能變化，既成萬物也。" }
      - { type: z, text: "正義曰：鼓動萬物者，莫疾乎震，震象雷也。橈散萬物者，莫疾乎巽，巽象風也。乾燥萬物者，莫乎離，離象火也。光說萬物者，莫說乎兌，兌象澤也。潤溼萬物者，莫潤乎坎，坎象水也。終萬物始萬物者，莫盛乎艮，艮東北方之卦也。故水火雖不相入而相逮，及雷風雖相薄而不相悖逆，山澤雖相懸而能通氣，然後能行變化而盡成萬物也。艮不言山，獨舉卦名者，動橈燥潤之功，是雷風水火，至於終始萬物，於山義為微，故言艮而不言山也。上章言“水火不相入”，此言“水火相逮”者，既不相入，又不相及，則無成物之功，明性雖不相入而氣相逮及也。上言“雷風相薄”，此言“不相悖”者，二象俱動，動若相薄，而相悖逆則相傷害，亦無成物之功，明雖相薄而不相逆也。" }
      - { type: j, text: "乾，健也。坤，順也。震，動也。巽，入也。坎，陷也。離，麗也。艮，止也。兌，說也。" }
      - { type: z, text: "正義曰：此一節說八卦名訓。乾象天，體運轉不息，故為健也。“坤，順也”，坤象地，地順承於天，故為順也。“震，動也”，震象雷，雷奮動萬物，故為動也。“巽，入也”，巽象風，風行無所不入，故為入也。“坎，陷也”，坎象水，水處險陷，故為陷也。“離，麗也”，離象火，火必著於物，故為麗也。“艮，止也”，艮象山，山體靜止，故為止也。“兌，說也”，兌象澤，澤潤萬物，故為說也。" }
      - { type: j, text: "乾為馬，坤為牛，震為龍，巽為雞，坎為豕，離為雉，艮為狗，兌為羊。" }
      - { type: z, text: "正義曰：此一節說八卦畜獸之象，略明遠取諸物也。乾象天，天行健，故為馬也。“坤為牛”，坤象地，任重而順，故為牛也。“震為龍”，震，動象，龍，動物，故為龍也。“巽為雞”，巽主號令，雞能知時，故為雞也。“坎為豕”，坎主水瀆，豕處汙溼，故為豕也。“離為雉”，離為文明，雉有文章，故為雉也。“艮為狗”，艮為靜止，狗能善守，禁止外人，故為狗也。“兌為羊”，兌，說也。王廙云：羊者，順之畜，故為羊也。" }
      - { type: j, text: "乾為首，坤為腹，震為足，巽為股，坎為耳，離為目，艮為手，兌為口。" }
      - { type: z, text: "正義曰：此一節說八卦人身之象，略明近取諸身也。乾尊而在上，故為首也。“坤為腹”，坤能包藏含容，故為腹也。“震為足”，足能動用，故為足也。“巽為股”，股隨於足，則巽順之謂，故為股也。“坎為耳”，坎北方之卦，主聽，故為耳也。“離為目”，南方之卦，主視，故為目也。“艮為手”，艮既為止，手亦能止持其物，故為手也。“兌為口”，兌，西方之卦，主言語，故為口也。" }
      - { type: j, text: "乾，天也，故稱乎父。坤，地也，故稱乎母。震一索而得男，故謂之長男。巽一索而得女，故謂之長女。坎再索而得男，故謂之中男。離再索而得女，故謂之中女。艮三索而得男，故謂之少男。兌三索而得女，故謂之少女。" }
      - { type: z, text: "正義曰：此一節說乾坤六子，明父子之道。王氏云：“索，求也。以乾坤為父母而求其子也”。得父氣者為男，得母氣者為女。坤初求得乾氣為震，故曰長男。坤二求得乾氣為坎，故曰中男。坤三求得乾氣為艮，故曰少男。乾初求得坤氣為巽，故曰長女。乾二求得坤氣為離，故曰中女。乾三求得坤氣為兌，故曰少女。" }
      - { type: j, text: "乾為天，為圜，為君，為父，為玉，為金，為寒，為冰，為大赤，為良馬，為老馬，為瘠馬，為駁馬，為木果。" }
      - { type: z, text: "正義曰：此下歷就八卦廣明卦象者也。此一節廣明乾象。乾既為天，天動運轉，故為圜也。為君為父，取其尊道而為萬物之始也。為玉為金，取其剛之清明也。為寒為冰，取其西北寒冰之地也。為大赤，取其盛陽之色也。為良馬，取其行健之善也。為老馬，取其行健之久也。為瘠馬，取其行健之甚。瘠馬，骨多也。為駁馬，言此馬有牙如倨，能食虎豹。《爾雅》云：“倨牙，食虎豹。”此之謂也。王廙云：“駁馬能食虎豹，取其至健也。”為木果，取其果實著木，有似星之著天也。" }
      - { type: j, text: "坤為地，為母，為布，為釜，為吝嗇，為均，為子，母牛，為大輿，為文，為眾，為柄。其於地也為黑。" }
      - { type: z, text: "正義曰：此一節廣明坤象。坤既為地，地受任生育，故謂之為母也。為布，取其地廣載也。為釜，取其化生成熟也。為吝嗇，取其地生物不轉移也。為均，取其地道平均也。為子、母牛，取其多蕃育而順之也。為大輿，取其能載萬物也。為文，取其萬物之色雜也。為眾，取其地載物非一也。為柄，取其生物之本也。其於地也為黑，取其極陰之色也。" }
      - { type: j, text: "震為雷，為龍，為玄黃，為旉，為大塗，為長子，為決躁，為蒼筤竹，為萑葦。其於馬也為善鳴，為馵足，為作足，為的顙。其於稼也為反生。其究為健，為蕃鮮。" }
      - { type: z, text: "正義曰：此一節廣明震象。為玄黃，取其相雜而成蒼色也。為旉，取其春時氣至，草木皆吐，旉布而生也。為大塗，取其萬物之所生也。為長子，如上文釋，震為長子也。為決躁，取其剛動也。為蒼筤竹，竹初生之時色蒼筤，取其春生之美也。為萑葦，萑葦，竹之類也。其於馬也為善鳴，取其象雷聲之遠聞也。為馵足，馬後足白為馵，取其動而見也。為作足，取其動而行健也。為的顙，白額為的顙，亦取動而見也。其於稼也為反生，取其始生戴甲而出也。其究為健，究，極也。極於震動，則為健也。為蕃鮮，鮮，明也。取其春時草木蕃育而鮮明。" }
      - { type: j, text: "巽為木，為風，為長女，為繩直，為工，為白，為長，為高，為進退，為不果，為臭。其於人也為寡發，為廣顙，為多白眼，為近利市三倍，其究為躁卦。" }
      - { type: z, text: "正義曰：此一節廣明巽象。巽為木，木可以輮曲直，即巽順之謂也。為風，取其陽在上搖木也。為長女，如上釋，巽為長女也。為繩直，取其號令齊物，如繩之直木也。為工，亦正取繩直之類，為白，取其風吹去塵，故絜白也。為長，取其風行之遠也。為高，取其風性高遠，又木生而上也。為進退，取其風之性前卻，其物進退之義也。為不果，取其風性前卻，不能果敢決斷，亦皆進退之義也。為臭，王肅作“為香臭”也。取其風所發也，又取下風之遠聞。其於人也為寡發，寡，少也。風落樹之華葉，則在樹者稀疏，如人之少發，亦類於此，故為寡發也。為廣顙，額闊為廣顙，發寡少之義，故為廣顙也。為多白眼，取躁人之眼，其色多白也。為近利，取其躁人之情，多近於利也。市三倍，取其木生蕃盛，於市則三倍之宜利也。其究為躁卦，究，極也。取其風之近極於躁急也。" }
      - { type: j, text: "坎為水，為溝瀆，為隱伏，為矯輮，為弓輪。其於人也，為加憂，為心病，為耳痛，為血卦，為赤。其於馬也，為美脊，為亟心，為下首，為薄蹄，為曳。其於輿也，為多眚，為通，為月，為盜。其於木也，為堅多心。" }
      - { type: z, text: "正義曰：此一節廣明坎象。坎為水，取其北方之行也。為溝瀆，取其水行，無所不通也。為隱伏，取其水藏地中也。為矯輮，取其使曲者直為矯，使直者曲為輮。水流曲直，故為矯輮也。為弓輪，弓者，激矢。取如水激射也。輪者，運行如水行也。其於人也為加憂，取其憂險難也。為心病，憂其險難。故心病也。為耳痛，坎為勞卦也，又北方主聽，聽勞則耳痛也。為血卦，取其人之有血，尤地有水也。為赤，亦取血之色。其於馬也為美脊，取其陽在中也。為亟心，亟，急也。取其中堅內動也。為下首，取其水流向下也。為薄蹄，取其水流迫地而行也。為曳，取其水磨地而行也。其於輿也為多眚，取其表裏有陰，力弱不能重載，常憂災眚也。為通，取其行有孔穴也。為月，取其月是水之精也。為盜，取水行潛竊如盜賊也。其於木也為堅多心，取剛在內也。" }
      - { type: j, text: "離為火，為日，為電，為中女，為甲胃，為戈兵。其於人也，為大腹。為乾卦，為鱉，為蟹，為蠃，為蚌，為龜，其於木也，為科上槁。" }
      - { type: z, text: "正義曰：此一節廣明離象。離為火，取南方之行也。為日，取其日是火精也。為電，取其有明似火之類也。為中女，如上釋，離為中女也。為甲胃，取其剛在外也。為戈兵，取其剛在於外，以剛自捍也。其於人也為大腹，取其懷陰氣也。為乾卦，取其日所烜也。為鱉，為蟹，為蠃，為蚌，為龜，皆取剛在外也。其於木也為科上槁，科，空也。陰在內為空，木既空中者，上必枯槁也。" }
      - { type: j, text: "艮為山，為徑路，為小石，為門闕，為果蓏，為閽寺，為指，為狗，為鼠，為黔喙之屬。其於木也，為堅多節。" }
      - { type: z, text: "正義曰：此一節廣明艮象。艮為山，取陰在下為止，陽在於上為高，故艮象山也。為徑路，取其山雖高有澗道也。為小石，取其艮為山，又為陽卦之小者，故為小石也。為門闕，取其有徑路，又崇高也。為果蓏，木實為果，草實為蓏，取其出於山谷之中也。為閽寺，取其禁止人也。為指，取其執止物也。為狗為鼠，取其皆止人家也。為黔喙之屬，取其山居之獸也。其於木也為堅多節，取其山之所生，其堅勁故多節也。" }
      - { type: j, text: "兌為澤，為少女，為巫，為口舌，為毀折，為附決。其於地也為剛滷，為妾，為羊。" }
      - { type: z, text: "正義曰：此一節廣明兌象。兌為澤，取其陰卦之小，地類卑也。為少女，如上釋，兌為少女也。為巫，取其口舌之官也。為口舌，取西方於五事為言，取口舌為言語之具也。為毀折，為附決。兌西方之卦，又兌主秋也。取秋物成熟，槁稈旱之屬則毀折也，果蓏之屬則附決也。其於地也為剛滷，取水澤所停，則鹹鹵也。為妾，取少女從姊為娣也。為羊，如上釋，取其羊性順也。" }
      - { type: j, text: "上一頁 目錄頁 下一頁" }
