# 禮記正義卷4（孔穎達疏）：j 為經文＋鄭玄注，z 為疏文。
sections:
  - id: juan4
    name: 正文
    blocks:
      - { type: z, text: "正義曰：案鄭《目錄》雲：“義與前篇同，簡策重多，分為上下。”" }
      - { type: j, text: "凡奉者當心，提者當帶。高下之節。○奉，本亦作捧，同，芳勇反。提，徒兮反。" }
      - { type: z, text: "“凡奉”至“當帶”。○正義曰：此一節論臣所奉持及俛仰裼襲之節，各依文解之。○“凡奉者當心，提者當帶”，物有宜奉持之者，有宜提挈之者，各因其宜。奉之者，謂仰手當心，奉持其物。提之者，謂屈臂當帶，而提挈其物。帶有二處，朝服之屬，其帶則高於心，深衣之類，其帶則下於脅。何以知然？《玉藻》說大帶雲：“三分帶下，紳居二焉。”紳長三尺，而居帶之下三分之二，則帶之下去地四尺五寸矣。人長八尺為限，若帶下四尺五寸，則帶上所餘正三尺五寸，故知朝服等帶則高也。而《深衣》雲：“帶下母厭髀，上母厭脅，當無骨者。”故知深衣之帶則下也。今雲“提者當帶”，謂深衣之帶。且古人恆著深衣，此明平常提奉，故益可知也。" }
      - { type: j, text: "執天子之器則上衡，謂高於心，彌敬也。此衡謂與心平。○上，時掌反。國君則平衡，大夫則綏之，士則提之。綏讀曰妥，妥之，謂下於心。○綏，依注音妥，湯果反，又他回反。" }
      - { type: z, text: "“執天”至“提之”。○正義曰：嚮明常法，此以下明臣各為其君上提奉之禮也。執，持也。上猶高也。衡，平也。平謂人之拱手正當心平，故謂心為衡。天子至尊，器不宜下，故臣為擎奉皆高於心，彌敬也。此衡謂與心平也。凡言衡有二處，若大夫衡視，則面為衡；此為天子執器，則上衡，謂高心也。既有二處不同，故鄭雲此衡與心平，明他衡者不與心平也。○“國君則平衡”者，國君，諸侯也。降於天子，故其臣為奉持器與心齊平也。○“大夫則綏之”者，綏，下也。又降於諸侯，故其臣為奉器下於心也。○“士則提之”者，上雲大夫綏之，已下於心，今為士提之，又在綏之下，即上“提者當帶”。然凡常提物，尚得當帶，今為士提物，更在帶下者，士臣為士，卑遠於君，故厭降在下。故《禮》雲“大夫之臣，不稽首，以闢君”其義同也。" }
      - { type: j, text: "凡執主器，執輕如不克重慎之也。主，君也。克，勝也。○勝音升。" }
      - { type: z, text: "“凡執”至“不克”。○正義曰：嚮明持奉高下之節，此辨持奉之容儀也。主亦君也。禮，大夫稱主，今此言“主”，上通天子諸侯，下含大夫為君者，故並曰“主”，士則不然。克，勝也。尊者之器，不論輕重，其臣執之，唯宜重慎，器雖輕小，而執之恆如實重，如不勝之容也。故《論語》雲：“孔子執圭，鞠躬如也，如不勝。”《聘禮》曰：“上介執玉如重。”是也。" }
      - { type: j, text: "執主器，操幣、圭璧，則尚左手。行不舉足，車輪曳踵。重慎也。尚左手，尊左也。車輪，謂行不絕也。○操，七刀反。曳，以制反。踵，支勇反。" }
      - { type: z, text: "“執主”至“曳踵”。○正義曰：又明提奉用手足之儀也。圭璧，瑞玉也。尚，上也。謂執持君器及幣玉也。若擎奉此物，則右手在下，左手在上。左尊，故云“尚左手”。○“行不舉足，車輪曳踵”者，曳，拽也。踵，腳後也。若執器行時，則不得舉足，但起前拽後，使踵如車輪曳地而行，故云“車輪曳踵”。" }
      - { type: j, text: "立則磬折垂佩。主佩倚則臣佩垂，主佩垂則臣佩委。君臣俛仰之節。倚，謂附於身。小俛則垂，大俛則委於地。○折，之列反，一音逝。佩，步內反，本或作珮，非。倚，範於綺反，徐其綺反。執玉，其有藉者則裼，無藉者則襲。藉，藻也。裼，襲，文質相變耳。有藻為文，裼見美亦文。無藻為質，襲充美亦質。圭璋特而襲，璧琮加束帛而裼，亦是也。○藉，在夜反，下同。裼，星曆反。藻音早，本又作繅。琮，才冬反。" }
      - { type: z, text: "“立則”至“則襲”。○正義曰：嚮明奉持及手足之儀，此明授受時禮也。立，倚也。佩謂玉佩也，帶佩於兩邊。臣則身宜僂折，如磬之背，故云“磬折”也。身既僂折，則所著之佩從兩邊，出縣垂於前也。○“主佩倚”者，主謂君也。倚猶附也。君宜直立，則佩直附倚身，而縣垂不出前。○“則臣佩垂”者，君若直立，佩倚於身，則臣宜曲折，曲折則佩不得倚身，故縣垂於前也。○“主佩垂，則臣佩委”者，主，君也。言君若重慎折身而佩垂，則臣彌曲，故佩歷委於地。然臣不發初太曲，必待君僂而後方曲者，亦授立不跪之義也。○“執玉，其有藉者則裼，無藉者則襲”。○凡執玉之時，必有其藻，以承於玉。若盡飾見美之時，必垂藻於兩端，令垂向於下，謂之“有藉”。當時所執之人，則去體上外服，以見在內裼衣，故云“有藉者則裼”也。其事質充美之時，承玉之藻，不使下垂，屈而在手，謂之“無藉”。當時所執之人，則掩其上服，襲蓋裼衣，謂之“無藉者則襲”。此謂執玉之人，朝聘行禮，或有裼時，或有襲時。○注“圭璋”至“是也”。○正義曰：鄭雲此者，以經雲裼襲者，人之裼襲，欲明玉亦有裼襲。雲“圭璋特而襲”者，上公享王圭以馬，享後璋以皮，皮馬既不上於堂，其上唯特有圭璋。圭璋既是寶物，不可露見，必以物覆襲之，故云“圭璋特而襲”也。雲“璧琮加束帛而裼”者，謂侯伯子男享天子璧以帛，享後琮以錦，既有帛錦承玉，上唯用輕細之物蒙覆以裼之，故云“璧琮加束帛而裼”也。雲“亦是”者，非但人有裼襲，其玉亦有裼襲之義，此皇氏之說。熊氏以為上明賓、介二人為裼襲。“圭璋特”以下又明賓、主各自為裼襲，謂朝時用圭璋特，賓、主俱襲行，享時用璧琮加束帛，賓、主俱裼，亦是也。凡執玉，“天子執冒四寸，以朝諸侯”。注云：“德能覆蓋天下，四寸者方，以尊接卑，以小為貴。又孔安國注《顧命》雲，“方四寸，邪刻之”，用之以冒諸侯之圭，以為瑞信。子男執璧，蓋亦刻驗覆之，但無以言焉。又執鎮圭以朝日及祭天地宗廟，知者，《典瑞》雲，王執鎮圭以朝日；又《鄭志》雲“祭天地宗廟亦執之，”是朝日既執鎮圭，則夕月亦當然也。《大宗伯》雲：“王執鎮圭。”注：“以四鎮之山為瑑飾，圭長尺有二寸，故《玉人》雲‘鎮圭尺有二寸，天子守之’”是也。其五等諸侯，《大宗伯》又云“公執桓圭”，注云：“雙植謂之桓。桓，宮室之象，所以安其上也。圭長九寸。”故《玉人》雲“命圭九寸，公守之”是也。《宗伯》又云：“侯執信圭，伯執躬圭。”注云：“蓋皆象以人形為瑑飾，文有粗縟耳，欲其慎行以保身。圭皆長七寸。”故《玉人》雲：“命圭七寸，謂之信圭，侯守之。命圭七寸，謂之躬圭，伯守之。”江南儒者解雲，直者為信，其文縟細；曲者為躬，其文粗略。義或然也。《宗伯》又云：“子執穀璧，男執蒲璧。”注云：“穀所以養人，蒲為席所以安人。不執圭者，未成國也。”蓋瑑以為穀稼及蒲葦之文，蓋皆徑五寸。故《大行人》雲，子執穀璧，男執蒲璧，五寸是也。凡圭廣三寸，厚半寸，剡上左右各寸半，知者，是《聘禮記》文。其璧則內有孔，外有玉，其孔謂之好，故《爾雅·釋器》雲：“肉倍好謂之璧，好倍肉謂之瑗，肉好若一謂之環。”此謂諸侯所執圭璧，皆朝於王及相朝所用也。故《典瑞》前既陳玉，則雲“朝、覲、宗、遇、會、同於王，諸侯相見亦如之”是也。其公侯伯朝後皆用璋，知者，以《聘禮》聘君用圭，聘夫人以璋，則知於天子及後亦然也。其子男既朝王用璧，朝後宜用琮，以璧、琮相對故也。鄭注《小行人》雲，其上公及二王之後，享天子圭以馬，享後璋以皮，其侯伯子男享天子璧以帛，享後琮以錦，其玉小大，各如其命數。知者，《玉人》雲“璧琮九寸，諸侯以享天子”是也。其諸侯相朝所執之玉，與朝天子同。其享玉皆以璧享君，以琮享夫人。知者，《聘禮》璧以享君，琮以享夫人，明相朝禮亦當然。子男相享則降用琥以繡，璜以黼。故鄭注《小行人》雲：“其於諸侯亦用璧琮耳。子男於諸侯則享用琥璜，下其瑞是也。”其諸侯之臣聘天子及聘諸侯，其聘玉及享玉，降其君瑞一等，故《玉人》雲“瑑圭璋八寸，璧琮八寸，以覜聘”是也。其藉玉之藻，鄭注《覲禮》雲：“繅所以藉玉，以韋衣木，廣袤各如其玉之大小。”天子則以五采畫之，諸侯則三採，子男二採，其卿大夫亦二採。故《典瑞》雲，王五采五就，公侯伯三採三就，子男二採二就。又云“瑑圭、璋、璧、琮，繅皆二採一就”是也。熊氏雲：“五采五就者，採別二行為一就，故五就也。三採三就者，亦採別二行為一就，故三就也。二採二就者，亦採別二行為一就，故再就也。二採一就者，以卿大夫卑。二採，採則別唯一行共為一就。”知然者，《雜記》及《聘禮記》三採六等，則知天子諸侯採別為二等也。此是周法，其殷以上，則《禮說·含文嘉》雲：“天子、三公、諸侯，皆以三帛以薦玉。”宋均注云：“其殷禮三帛謂朱白倉，象三正。其五帝之禮，薦玉用一色之帛。”故鄭注《虞書》“三帛”，“高陽氏之後用赤繒，高辛氏之後用黑繒，其餘用白繒”。“其餘”謂堯舜之諸侯。既以采色畫韋衣於板上，前後垂之，又有五采組繩以為系，其組上以玄為天，下以黃為地，長尺，無事則以系玉，有事則垂為飾。故《聘禮記》“皆玄纁，系長尺，絢組”，注云“採成文曰絢系，無事則以系玉，因以為飾，皆用五采組。上以玄，下以絳為地”是也。其裼襲之義者，藻藉有二種，一者以韋衣木畫之也，二者絢組垂之。若板之藻藉，則當有，今言無者，據垂之也。其垂藻之時則須裼，屈藻之時則須襲。案《聘禮》賓至主人廟門之外，“賈人東面坐，啟櫝，取圭垂繅，不起而授上介”。注云：“不言裼襲者，賤不裼。”以賈賤，故不言裼，明貴者垂藻當裼也。又云：“上介不襲，執圭屈繅授賓。”注：“上介不襲者，以盛禮不在於己。”明屈藻合襲也。又云：“賓襲，執圭。”又云：“公襲，受玉。”於時圭皆屈藻，故賓與公執玉皆襲。是屈藻之時皆襲，則所謂“無藉者襲”是也。《聘禮》又云：“賓出，公授宰玉，裼降立。”是授玉之後乃裼也。又云：“賓裼，奉束帛加璧享。”是有藉者裼。凡朝之與聘，賓與主，君行禮皆屈而襲，至於行享之時皆裼也。知者，以《聘禮》行聘則襲，受享則裼。凡享時其玉皆無藉藻，故崔靈恩雲：“初享圭璋特，故有藻，其餘則束帛加璧。既有束帛，不須藻。”凡諸侯朝天子，皆行三享之禮，故《大行人》雲公侯伯子男，並雲：“廟中將幣，三享。”《覲禮》雲“四享”者，鄭注云：“四當為三，初享或用虎豹之皮，其次享三牲、魚臘、龜、金、丹、漆，唯國所有，分為三享，皆以璧帛致之。”若其臣出聘，唯行一享，故《聘禮》致夫人聘享唯一享也。裼所以異於襲者，凡衣近體有袍襗之屬，其外有裘，夏月則衣葛，其上有裼衣，裼衣上有襲衣，襲衣之上有常著之服，則皮弁之屬也。掩而不開則謂之為襲。若開此皮弁及中衣，左袒出其裼衣，謂之為裼。故鄭注《聘禮》雲：“裼者，左袒也。”一玉之上，若垂藻之時，其人則裼，屈藻之時，其人則襲，則裼襲不相因。《表記》雲“裼襲不相因”者，彼謂各執其物，執龜玉者則襲，受享者則裼，與此同也。" }
      - { type: j, text: "國君不名卿老世婦，大夫不名世臣侄娣，士不名家相長妾。雖貴，於其國家猶有所尊也。卿老，上卿也。世臣，父時老臣。○侄，大節反，《字林》丈一反。娣，六計反。相，息亮反。長，丁丈反，下注“長老”同" }
      - { type: z, text: "“國君”至“長妾”。○正義曰：此一節總明稱謂之事，各依文解之。○“國君不名卿老世婦”者，人君雖有國家之貴，猶宜有所敬，不得呼其名者也。“卿老”謂上卿，上卿貴，故曰“卿老”。“世婦”者，謂兩媵也，次於夫人，而貴於諸妾也。言諸侯雖貴，不得呼其名也。○“大夫不名世臣侄娣”者，世臣，父在時老臣也。侄是妻之兄女，娣是妻之妹，從妻來為妾也。大夫不得呼世臣及貴妾名也。然《王制》雲：“大夫不世爵。”此有世臣者，子賢，謂襲父爵者也。○“士不名家相長妾”者，家相謂助知家事者也。長妾，妾之有子者也。士不得呼此二等人名也。不名長妾者，熊氏雲：“士有一妻二妾，言長妾者，當謂娣也。故鄭注《昏禮》雲：‘娣尊侄卑。’”義或然也。" }
      - { type: j, text: "君大夫之子不敢自稱曰“餘小子”。闢天子之子未除喪之名。君大夫，天子大夫有土地者。○闢音避，本又作避，下同。大夫士之子不敢自稱曰“嗣子某”。亦闢其君之子未除喪之名。不敢與世子同名。闢僣傚也，其先之生，則亦不改。世或為大。○僣，作念反。傚，胡孝反。" }
      - { type: z, text: "“君大”至“同名”。○：此以下明孝子在喪，擯者接對賓客之辭也。君大夫，謂天子大夫有地者，大夫有地者則亦稱曰君，故云“君大夫”也。天子未除喪，自稱曰“餘小子”。今大夫有地，雖同曰君，而其子在喪，不敢同天子稱餘小子也。○“大夫士之子不敢自稱曰嗣子某”者，此諸侯稱大夫士之子也。諸侯在喪之嗣子某，臣之子避之也。○“不敢與世子同名”者，世子謂諸侯之適子也。諸侯之臣為其子作名，不得與君適子名同也。《白虎通》雲：“生在稱世子何？系於君也。”○注“闢僣”至“為大”。○正義曰：若名子與君世子同，則嫌其名自比擬於君，故云“避僣傚也”。世子貴不得同，則與庶子同不嫌。又若其子生在君之世子前，已為名，而君來同之，此是君來同己，不須易也。故《穀梁·昭七年傳》雲：“何為君臣同名？君子不奪人親之所名，重其所由來也。”是臣先名，君後名，同之，臣不改也。又案《雜記》雲：“與君之諱同則稱字。”若先生與世子同名，亦當然也。諸侯之子不可同天子之子，故宜不也。《異義》：“《公羊》說臣子先死，君父猶名之。孔子云‘鯉也死’，是已死而稱名。《左氏》說既沒，稱字而不名，桓二年宋督弒其君與夷及其大夫孔父，先君死，故稱其字。《穀梁》同《左氏》說。許慎謹案：同《左氏》、《穀梁》說，以為《論語》稱‘鯉也死’，時實未死，假言死耳。”鄭康成亦同《左氏》、《穀梁》之義，以《論語》雲“鯉也死，有棺而無槨”是實死未葬已前也。故鄭駁許慎雲：“設言死，凡人於恩猶不然，況賢聖乎？然鯉也死，未滿五十。鯉死稱伯魚者，案《冠禮》二十已稱伯某甫，未必要五十也。但五十直稱伯耳。”焦氏問：“案《春秋》君在稱世子，君薨稱子某既葬稱子，無言嗣子某者也，又大夫之子當何稱？”張逸答曰：“此避子某耳，大夫之子稱未聞。案稱嗣子某，或殷禮也。”" }
      - { type: j, text: "君使士射，不能，則辭以疾。言曰：“某有負薪之憂。”射者所以觀德，唯有疾，可以辭也。使士射，謂以備耦也。憂或為疾。○使音史。射，市夜反。則辭以疾，如字；本又作“有疾”、“為疾”，如字；本又作疚，音救。" }
      - { type: z, text: "“君使”至“之憂”。正義曰：射法，每兩人相對，以決勝負，名之曰耦。耦，貴賤必對，故卿與卿耦，大夫與大夫耦，或奇餘不足，則使士備耦。案《大射》君與賓耦，卿大夫自相耦，又有士御於大夫。又司射誓耦，“卑者與尊者為耦，不異侯”，是言士得備預為耦，故此有“使士射”之禮也。○“不能，則辭以疾”者，士若不能，不得雲不能，但當自稱有疾也。所以然者，夫射以表德，士既升朝，必宜有德；若不能，則是素餐之辱，兼辱君不知人，誤用己也。○“言曰：某有負薪之憂”者，此稱疾之辭也。某，士名也。負，簷也。薪，樵也，大樵曰薪。《詩》雲：“析薪如之何？匪斧不克。”是大故用斧也。憂，勞也。言已有簷樵之餘勞，不堪射也。不直雲“疾”而云“負薪”者，若直雲“疾”，則似傲慢，故陳疾之所由，明非假也。然士祿代耕，且後問庶人子云能負薪，而今雲士負薪者，亦謙辭也。兼言昔未為士時經簷樵，今猶發動昔日之勞也。《白虎通》雲：“天子病曰不豫，言不復豫政也。諸侯曰負子。子，民也，言憂民不復子之也。”桓十六年“衛侯朔出奔齊”，《公羊》雲有疾曰“負茲”。諸侯之疾，所以名不同者，蓋“子”、“茲”聲相近，其字相亂，未知孰是。《音義隱》雲：“天子曰不豫，諸侯曰不茲，大夫曰犬馬，士曰負薪。”○注“使士射，謂以備耦也。憂或為疾”。○正義曰：知非士自射，而云“備耦者”，熊氏雲：“若其自射，不須雲使，又不應辭，以其言使言辭，故云備耦。”" }
      - { type: j, text: "侍於君子，不顧望而對，非禮也。禮尚謙也。不顧望，若子路帥爾而對。" }
      - { type: z, text: "“侍於”至“禮也”。○正義曰：謂多人侍而君子有問，若指問一人，則一人直對。若問多人，則侍者當先顧望坐中，或有勝已者宜前，而己不得率爾先對，先對非禮也。○注“禮尚”至“而對”。○正義曰：此證問多人而不顧望對者。《論語》雲，子路、曾晳、冉有、公西華侍於孔子，孔子問四人：“各言其志。”而子路率爾先對雲：“原治千乘之國。”而孔子哂之雲：“為國以禮，其言不讓，是故哂之。”" }
      - { type: j, text: "君子行禮，不求變俗。求猶務也。不務變其故俗，重本也。謂去先祖之國，居他國。祭祀之禮，居喪之服，哭泣之位，皆如其國之故，謹修其法而審行之。其法，謂其先祖之制度，若夏、殷。" }
      - { type: z, text: "“君子”至“行之”。○正義曰：此一節論臣去本國行禮之事，各依文解之。○“君子行禮”者，謂去先祖之國，居他國者也。求猶務也。俗者，本國禮法所行也。明雖居他國，猶宜重本，行故國法，不務變之從新也。如杞、宋之臣入於齊、魯，齊、魯之臣入於杞、宋，各宜行已本國禮法也。此雲不變俗，謂大夫出在他國，不變己本國之俗。案鄭答趙商，以為衛武公居殷墟，故用殷禮，即引此雲：“君子行禮，不求變俗。”如鄭之意，不變所往之國舊時風俗，與此不同者，熊氏雲：“若人臣出居他國，亦不忘本，故云不變本國風俗，人君務在化民，因其舊俗，往之新國，不須改也。”然則“不求變俗”，其文雖一，但人君、人臣兩義不同。熊氏雲：“必知人君不易舊俗者。《王制》雲：‘修其教，不易其俗。’又《左傳》定四年，封魯公，因商奄之人，封康叔於殷虛，啟以商政，封唐叔於夏虛，啟以夏政。皆因其舊俗也。”案有列於朝，有詔於國，三代之內，喪服為舊。“君齊衰三月”，傳曰：“三諫不從，待放未絕者，爵祿尚有列於朝，出入尚有詔於國。”如《喪服》所云，大夫待放之時，名為有列有詔。不至三世者，熊氏雲：“彼據為舊君著服，故以未去之時，名為有列有詔。此據去國之後，但有列有詔，仍行舊國之禮，斷章取證，故彼此不同。”○“祭祀之禮”者，此陳不變之事，若祭祀之禮不變，即夏立屍，殷坐屍，周旅酬六屍，及先求陰陽、犧牲、騂黑之屬也。“居喪之服”者，殷雖尊貴，猶服傍親，周則以尊降服。○“哭泣之位”者，殷不重適，以班高處上。周世貴正，嗣孫居其首。○“皆如其國之故”者，謂故俗也。凡上諸事，悉不改革，行之如本國俗也。然上既舉三條，餘冠、昏之屬從可知也。○“謹修其法而審行之”者，並結前事，各令分明謹脩本國之法，審慎以行之。其法，謂其先祖之制度，若夏、殷子孫在周者，悉行其先世之禮，是不變俗也。" }
      - { type: j, text: "去國三世，爵祿有列於朝，出入有詔於國，三世，自祖至孫。逾久可以忘故俗，而猶不變者，爵祿有列於朝，謂君不絕其祖祀，復立其族，若臧紇奔邾，立臧為矣。詔，告也，謂與卿大夫吉凶往來相赴告。○三世，盧、王雲：“世，歲也。萬物以歲為世。”朝，直遙反，下皆同。復，扶又反，下“復還”同。紇，恨發反，徐胡切反，沈胡謁反。若兄弟宗族猶存，則反告於宗後。謂無列無詔者。反告亦謂吉凶也。宗後，宗子也。" }
      - { type: z, text: "“去國”至“宗後”。正義曰：此以下明在他國而得變俗者也。將明得變改，上先明未得者也。○“去國三世”，謂三諫不從，及他事礙被黜，出入新國已經三世者，則鄭注云“三世，自祖至孫”也。○“爵祿有列於朝”者，謂本國君不絕其祖祀，復立族為後有朝者也。○“出入有詔於國”者，出入猶吉凶之事，更相往來也。詔，告也。去已三世，而本國之君猶為立後不絕，則若有吉凶之事，當與本國卿大夫往來出入，共相赴告，故云“出入有詔於國”。○注“若臧”至“為矣”。○正義曰：引之者，證有列位也。臧紇，武仲也，時為季氏家廢長立少，故與孟氏相惡，遂出奔邾。魯人以臧紇有功，復立其異母兄臧為，以守先祀，是有列也。故魯襄二十三年《左傳》雲，臧紇奔邾，“使告臧賈，且致大蔡焉。曰：‘紇不佞，失守宗祧，敢告不吊。紇之罪不及不祀，子以大蔡納請，其可’賈曰：‘是家之禍，非子之過。賈聞命矣。’再拜受龜，使為以納請，遂自為也。乃立臧為，紇致防而奔齊”，是其事也。○“若兄弟”至“宗後”。○此是出已三世而爵祿無列於朝、吉凶不相詔告、而不仕新國者。宗族兄弟，謂本國之親。宗後，大宗之後也。已本國不列不告，若宗族猶存，兄弟尚在，已有吉凶，當反還告宗適，不忘本故也。前告國者，亦告兄弟耳。然既未仕新國，猶用本國禮也。《音義隱》雲：“雖無列於朝，有吉凶，猶反告於宗後。其都無親在故國，不復來往也。”" }
      - { type: j, text: "去國三世，爵祿無列於朝，出入無詔於國，唯興之日，從新國之法。以故國與已無恩。興謂起為卿大夫。" }
      - { type: z, text: "“去國三世，爵祿無列於朝，出入無詔”至“之法”。○正義曰：此猶是論無列無詔而反告宗後者，今得仕新國者也。但仕新國有異，故重言“三世”也。○“唯興之日，從新國之法”者，唯興謂已始仕也。雖有宗族相告，已仕新國，而本國無列無詔，故所行禮俗，悉改從新也。然推此而言，若本國猶有列詔者，雖仕新國，猶行故俗。何以知然？既雲無列而從新，明有列，理不從也。又若無詔而不仕新者，不得從新。何以知然？既雲“唯興”，明不興則不從。無列無詔，唯興之日三世，即從新國之制。孔子去宋既久，父為大夫，尚冠章甫之冠，送葬皆從殷制者，熊氏雲：“案《鉤命決》雲：‘丘為製法之主，黑綠不伐蒼黃，聖人特為製法，不與常禮同也。’”○注“興謂起為卿大夫”。○正義曰：鄭注云“起為卿大夫”者，則若為士猶卑，不得變本也。" }
      - { type: j, text: "君子已孤不更名，亦重本。已孤暴貴，不為父作諡。子事父，無貴賤。○為，於偽反。諡音示。" }
      - { type: z, text: "“君子”至“作諡”。○正義曰：此一節論父沒不可輒改為名諡之事。“已孤不更名”者，不復改易，更作新名。所以然者，名是父之所作，父今已死，若其更名，似遺棄其父，故鄭注云“亦重本”也。言“亦”者，亦上行本國之俗，上是重本，故云“亦”也。“已孤暴貴，不為父作諡”者，此孤不辨老少，唯無父則是也。暴貴，本為士庶，今起為諸侯，非一等之位，故云“暴貴”也。諡者，列平生德行，而為作美號。若父昔賤，本無諡，而己今暴貴，升為諸侯，乃得制諡，而不得為父作諡。所以爾者，父賤無諡，子今雖貴，而忽為造之，如似鄙薄父賤，不宜為貴人之父也。或舉武王為難，鄭答趙商曰：“周道之基，隆於二王，功德由之，王跡興焉。凡為人父，豈能賢乎？若夏禹、殷湯，則不然矣。”○注“子事父，無貴賤”。○正義曰：子不得言已昔賤今貴，父賤不宜為貴人之父也。" }
      - { type: j, text: "居喪，未葬，讀喪禮。既葬，讀祭禮。喪復常，讀樂章。為禮各於其時。居喪不言樂，祭事不言兇，公庭不言婦女。非其時也。" }
      - { type: z, text: "“居喪”至“婦女”。○正義曰：此一節明行禮各有時之事，各隨文解之。○“居喪”者，居父母之喪也。喪禮謂朝夕奠下室、朔望奠殯宮及葬等禮也。此禮皆未葬以前。○“既葬，讀祭禮”者，祭禮，虞、卒哭、祔、小祥、大祥之禮也。○“喪復常，讀樂章”者，復常，謂大祥除服之後也。樂章，謂樂書之篇；章謂《詩》也。禫而後吉祭，故知禫後宜讀之。此上三節，事須預習，故皆許讀之。" }
      - { type: j, text: "振書、端書於君前有誅，倒筴、側龜於君前有誅。臣不豫事，不敬也。振，去塵也。端，正也。倒，顛倒也。側，反側也。皆謂甫省視之。○倒，多老反。去，羌呂反，下“徹猶去”、“去琴瑟”同。顛，丁田反。" }
      - { type: z, text: "“振書”至“有誅”。○正義曰：此一節總明臣當預事，並明臣入公門當謹敬之禮也，各依文解之。○“振書”者，拂去塵也。書，簿領也。端，正也。誅，責也。臣不豫慎，若將文書簿領於君前，臨時乃拂整，則宜誅責也。○“倒筴、側龜於君前有誅”者，倒，顛倒也。側，反側也。龜筴，君之卜筮所須也。不預周正，而來在君前方顛倒反側齊正，則有責罰也。○注“臣不”至“視之”。○正義曰：甫者，始也，謂不豫整理，今於君前始正之。" }
      - { type: j, text: "龜筴、几杖、席蓋、重素、袗絺綌，不入公門。龜筴，嫌問國家吉凶。几杖，嫌自長老。席蓋，載喪車也。《雜記》曰：“士輤，葦蓆以為屋，蒲席以為裳帷。”重素，衣裳皆素，喪服也。袗，單也。孔子曰：“當暑，袗絺綌，必表而出之。”為其形褻。○重素，直龍反，注同；重素，衣裳皆素。袗，之忍反。輤，於見反。葦，於鬼反。為其，於偽反，苞屨、扱衽、厭冠，不入公門。此皆凶服也。苞，藨也，齊衰藨蒯之菲也。《問喪》曰：“親始死，扱上衽。”厭猶伏也，喪冠厭伏。苞或為菲。○苞，白表反，草也。扱，初洽反。衽，而審反。厭，於涉反。藨，白表反，一音扶苗反。齊衰，本又作齋，音諮，下七雷反，下文同。蒯，苦怪反。菲，扶味反，屨也。書方、衰、兇器，不以告，不入公門。此謂喪在內，不得不入，當先告君耳。方，板也。《士喪禮》下篇曰：“書賵於方，若九、若七、若五。”兇器，明器也。○板，字又作版，音同。賵，芳仲反，車馬曰賵。公事不私議。嫌若奸也。" }
      - { type: z, text: "“龜筴”至“公門”。○正義曰：此以下明臣物不得入君門者也。○“龜筴”者，謂臣之龜筴也。將入，嫌問國家吉凶。○“几杖”者，臣之几杖也。若將入，謂欲驕矜，嫌自長老。○“席蓋”者，喪車蓋也。臣有死於公宮，可許將柩出門，不得將喪車兇物入也。車比棺為緩，宜停外也。○“重素”者，衣裳皆以素，謂遭喪之服也，亦不宜著入也。○“袗絺綌”者，袗，單也。絺綌，葛也。上無衣表，則肉露見，為不敬，故不著入也。○“不入公門”者，並結上諸條事，皆不得入也。若屍乘以幾至廟門，及八十杖於朝，則幾、杖得入公門也。○注“龜筴”至“形褻”。○正義曰：引《雜記》，證席蓋是喪車也。輤，喪車邊牆也。在上曰屋，在邊曰裳帷。士喪車用葦蓆為上屋，蒲席以為邊牆也。然天子諸侯染布為蒨色，大夫但布而不染。士用席，而亦言輤者，因天子輤通名也。今言席蓋，謂士耳。舉士為例，卿大夫喪車亦不得入。雲“重素，衣裳皆素，喪服也”者，若臣之待放，衣裳皆素。既是待放，本無得入公門之理。此雲重素不入公門者，謂私服。又《文王世子》，公族有死罪，公親素服。唯君得素服入，臣則不可。引《論語》，證入公門不單也。形褻，謂肉露見也。○“苞屨”至“公門”。○苞屨，謂藨蒯之草為齊衰喪屨。○“扱衽”者，親始死，孝子徒跣扱上衽也。○“厭冠”者，喪冠也。厭帖無者強，為五服喪所著也。○“不入公門”者，此並五服之內，喪服差次，不合入，不得著入公門也。苞謂杖齊衰之屨，故《喪服》杖齊衰章雲：“疏屨者，藨蒯之菲也。”此雲苞屨、扱衽不入公門，《服問》雲：“唯公門有稅齊。”注云：“不杖齊衰也，於公門有免齊衰，則大功有免絰也。”如鄭之言，五服入公門與否，各有差降。熊氏雲：“父之喪唯扱上衽不入公門，冠絰衰屨皆得入也。杖齊衰，則屨不得入，不杖齊衰，衰又不得入，其大功絰又不得入，其小功以下，冠又不得入。此厭冠者，謂小功以下之冠，故云不入公門。凡喪冠皆厭，大功以上，厭冠宜得入公門也”。凡喪屨，案《喪服》斬衰用菅屨，杖齊衰用苞，不杖齊衰用麻，大功用繩。故《小記》雲：“齊衰三月，與大功同者繩屨。”其小功以下，鄭引舊說雲：“小功以下，吉屨無絇。”○“書方”者，此謂臣有死於公宮，應須兇具，此下諸物，並宜告而後入者也。書謂條錄送死者物件數目多少，如今死人移書也。方，板也。百字以上用方板書之，故云“書方”也。○“衰”者，孝子喪服也。○“兇器”者，棺材及棺中服器也。○“不以告，不入公門”者，臣在公宮而死，營兇器所須，而不得輒將入公門，故須告也。然衰之屬，今厭冠苞屨尚不入，雲衰告乃入者，熊氏雲：“上不入，謂公宮庫、雉、路之門，今此不入公門者，國城之門，謂卿大夫之喪從外，來書、方、衰、兇器，須告乃入。”今謂既同稱公門，又國城之內，百姓民眾所居，方、衰、兇器，須告乃入，事恐非也。蓋公門非一，或是公之外門，及百官治事之處。君許其在內殯，及將葬之禮，故有明器書方，須告乃入。○注“士喪”至“器也”。○正義曰：證喪禮書方也。送死者，車馬曰賵，衣服曰襚，亦通曰賵。“若九、若七”等，謂書送物於板行列之數多少，物多則九行，少則七行五行也。" }
      - { type: j, text: "君子將營宮室，宗廟為先，廄庫為次，居室為後。重先祖及國之用。○廄，九又反。○凡家造，祭器為先，犧賦為次，養器為後。大夫稱家，謂家始造事。犧賦，以稅出牲。○凡家造，才早反，一本作“凡家造器”，“器”，衍字。犧，許宜反。養，羊尚反，一如字。無田祿者不設祭器，有田祿者先為祭服。祭器可假，祭服宜自有。君子雖貧，不粥祭器。雖寒，不衣祭服。為宮室，不斬於丘木。廣敬鬼神也。粥，賣也。丘，壟也。○粥音育。衣，於既反。" }
      - { type: z, text: "“凡家”至“丘木”。○正義曰：此一節總論大夫所造祭器衣服，並明祭器所寄之事，各依文解之。○“凡家造”，謂大夫始造家事也。大夫為家。○“祭器為先”者，崇敬祖禰，故在先。“犧賦為次”者，諸侯、大夫少牢。此言犧，謂牛。即是天子之大夫祭祀，賦斂邑民，供出牲牢，故曰“犧賦”。○“養器為後”者，養器，供養人之飲食器也。自贍為私，宜後造。然諸侯言“宗廟”，大夫言“祭器”，諸侯言“廄庫”、“居室”，大夫言“犧賦”、“養器”者，互言也。此據有地大夫，故得造祭器。若無田祿者，但為祭服耳。其有地大夫祭器、祭服俱造，則先造祭服，乃造祭器。此言“祭器為先”者，對犧賦、養器為先，其實在祭服之後。○“無田”至“祭服”。○鄉明得造祭器，此明不得造者，下民也。若大夫及士有田祿者乃得造器，猶不具，唯天子大夫四命以上者得備具。若諸侯大夫非四命，無田祿，則不得造，故《禮運》雲：“大夫磬樂皆具，祭器不假，非禮也。”據諸侯大夫言之也。熊氏以《禮運》據天子大夫得造，不得具，非也。○“有田祿者先為祭服”者，若有田祿，雖得造器，而先為祭服，後為祭器耳。所以然者，緣人形參差，衣服有大小，不可假借，故宜先造；而祭器之品量同官可可以共有，以其制同，既可暫假，故營之在後。" }
      - { type: j, text: "大夫士去國，祭器不逾竟。此用君祿所作，取以出竟，恐辱親也。○去國祭器不逾竟，音境，注及下同；一本作“大夫士去國”，下“去國逾竟”亦然。大夫寓祭器於大夫，士寓祭器於士。寓，寄也。與得用者言寄，覬己後還。○寓，魚具反。覬音冀。" }
      - { type: z, text: "“大夫”至“於士”。○正義曰：此以下明人臣三諫不從，去國之禮。○“祭器不逾竟”者，既明出禮，先從重物為始也。逾，越也。此祭器是君祿所造，今既放出，故不得自隨越竟也。注云“此用”至“親也”。無德而出，若猶濫用其器，是辱親也。《隱義》雲：“嫌見奪，故云恐辱親也。”“大夫寓祭器於大夫，士寓祭器於士”者，寓猶寄也。既不將去，故留寄其同僚。必寄之者，冀其復還得用也。魯季友奔陳，國人復之，傳曰“季子來歸”是也。○注“寓寄”至“後還”。○正義曰：此解言“寄”之義也。夫物不被用，則生蟲蠹，故寄於同官，令彼得用，不使毀敗，冀還複用，大夫士義皆然也。" }
      - { type: j, text: "大夫士去國逾竟，為壇位鄉國而哭。素衣、素裳、素冠，徹緣、鞮屨、素冪，乘髦馬，不蚤鬋，不祭食，不說人以無罪，婦人不當御，三月而復服。言以喪禮自處也。臣無君，猶無天也。壇位，除地為位也。徹猶去也。鞮屨，無絇之菲也。冪，覆笭也。髦馬，不鬄落也。蚤讀為爪。鬋，鬋鬢也。不自說於人以無罪，嫌惡其君也。御，接見也。三月一時，天氣變，可以遂去也。冪或為幕。○壇，徐音善，注同。鄉，許亮反。緣，悅絹反。鞮，都兮反，又徒兮反；鞮屨，屨無絇。冪，本又作幭，莫歷反，注同，白狗皮覆笭。髦音毛。蚤，依注音爪，謂除爪也。鬋，子淺反。絇，求俱反。笭，力丁反，車闌。鬄，吐歷反，又他計反。說，亦劣反，又如字。惡，烏路反。見，賢遍反，下文“見國君”、注“謂見”同。幕，莫歷反，又音莫。" }
      - { type: z, text: "“大夫”至“復服”。○正義曰：此大夫士三諫而不從，出在竟上。大夫則待放，三年聽於君命。若與環則還，與玦便去。《隱義》雲：“去國當待於也。若士不待放，臨去皆行此禮也。”○“為壇位鄉國而哭”者，壇者，除地不為壇。臣之無君，猶人無天也。嫌去父母之邦，有桑梓之變，故為壇鄉國而哭，以喪禮自變處也。所以待放必三年者，三年一閏，天道一變，因天道變，望君自改也。然在竟未去。聽君環玦，不謂待歸，而謂待放者，既已在竟，不敢必放，言唯待君見放乃去也。○“素衣、素裳、素冠”者，今既離君，故其衣裳冠皆素，為兇飾也。○“徹緣”者，緣，中衣緣也。素服裏亦有中衣，若吉時中衣用採緣，此既兇喪，故徹緣而純素。○“鞮屨”者，謂無絇繶屨也。屨以絇為飾，兇故無絇也。《士冠禮》雲：“玄端黑屨，青絇博寸。”鄭雲：“絇之言拘也。以為行戒，狀如刀衣鼻，在屨頭。”故解者雲：古屨以物系之為行戒，故用繒一寸，屈之為絇，絇為絇著屨頭，以容受系穿貫也。其屈之形，似漢時刀衣鼻也，其色或青或黑不同。而《冠禮》屨夏用葛，冬用皮，又各隨裳色。今素裳，則屨白色也。○“素”者，素，白狗皮也。冪，車覆蘭也。禮，人君羔幦虎犆，大夫鹿幦豹犆。今此喪禮，故用白狗皮也。《既夕禮》雲“主人乘惡車，白狗幦”是也。然吉凶覆笭，不必用皮者，象始服牛馬，初當用皮為覆。○“乘髦馬”者，吉則翦剔馬毛為飾，兇則無飾，不翦而乘之也。○“不蚤鬋”者，以治手足爪也。鬋剔治鬚髮也。吉則治翦為飾，兇故不翦也。《士虞禮》曰“蚤翦”，謂爪翦須也。○“不祭食”者，祭，祭先也。夫食盛饌則祭食之先，喪兇，故不祭也。○“不說人以無罪”者，善則稱君，過則稱己。今雖放逐，猶不得鄉人自說道已無罪而君惡，故見放退也。○“婦人不當御”者，御，接見也。吉時婦人以次侍御寢宿，今喪禮自貶，故不也。○“三月而復服”者，自貶三月，然後事事反還如吉禮，而遂去也。所以三月者，為一時天氣一變，故三月人情亦宜易也。○注“鞮屨，無絇之菲也”。○正義曰：知鞮是無絇之屨者，案《周禮·屨人》屨舄皆有絇繶純。案《鞮屨氏》無絇繶之文，故知是無絇之菲也。雲“髦馬，不鬄落也”者，以其稱髦馬，與童子垂髦同，故知不鬄落鬃鬛。案《大戴禮·王度記》雲：“大夫俟放於郊，三年，得環乃還，得玦乃去。”此逾國三月乃行，不同者，得玦之後，從郊至竟，三月之內而行此禮也。" }
      - { type: j, text: "大夫士見於國君，君若勞之，則還辟，再拜稽首。謂見君，既拜矣，而後見勞也。《聘禮》曰，君勞使者及介，君皆答拜。○勞，力報反，注及下“君勞”同。闢，婢亦反，下同。還辟，逡巡也。使，色吏反。君若迎拜，則還辟，不敢答拜。嫌與君亢賓主之禮。迎拜，謂君迎而先拜之。《聘禮》曰，大夫入門再拜，君拜其辱。" }
      - { type: z, text: "“大夫”至“答拜”。○正義曰：此一節論君臣男女相答拜之法，各依文解之。○“大夫士見於國君”者，謂大夫士出聘他國君之禮。“君若勞之，則還辟，再拜稽首”者，勞，慰勞也。還辟，逡巡也。初至行聘享私覿禮畢，而主君又別慰勞已在道路之勤，故已逡巡而退者，闢君之答己之意也。○案《聘禮》行聘享及私覿訖，賓出，主君送至大門內，主君問聘君、問大夫竟，乃雲“公勞賓，賓再拜稽首，公答拜。公勞介，介再拜稽首，公答拜”，即此大夫出聘他國、君勞之是也。《聘禮》無“還辟”之文者，文不備也。○注“謂見”至“答拜”。○正義曰：案《聘禮》勞賓之前，不見賓先拜，此雲賓“既拜矣”，謂賓初行私覿之時，已拜主君矣。在後始主君勞，故曰“既拜矣，而後見勞”。引《聘禮》者，證君勞賓再拜之事。熊氏以為唯雲“大夫士”，謂小聘大夫為賓、士為介故也。今謂大聘小聘皆然，故鄭引《聘禮》以證之，此大夫之中則含卿也。知者，以此經皆總雲大夫，不別言卿，故知大夫含卿也。“君若迎拜，則還辟，不敢答拜”者，君若迎，先拜賓，賓是使臣，不敢當禮，則還辟逡巡，不敢答主君之拜。○注“嫌與”至“其辱”。○正義曰：此主君迎拜者，謂聘賓初至主國大門外，主君迎而拜之，故《聘禮》雲，賓入門左，公再拜，賓闢不答拜，是也。故鄭引《聘禮》，大夫入門再拜，君拜其辱者，初入門，主君再拜其辱也。" }
      - { type: j, text: "大夫士相見，雖貴賤不敵，主人敬客，則先拜客，客敬主人，則先拜主人。尊賢。" }
      - { type: z, text: "“大夫士相見”至“則先拜主人”。○正義曰：此謂使臣行禮受勞已竟，次見彼國卿大夫也。唯賢是敬，不計賓主貴賤，雖為大夫而德劣，亦先拜有德之士也。謂異國則爾，同國則否。又《士相見禮》若先生異爵者，謂士則先拜之，此則不必同國也。" }
      - { type: j, text: "凡非吊喪，非見國君，無不答拜者。禮尚往來。喪，賓不答拜，不自賓客也。國君見士，不答其拜，士賤。○非見，賢遍反，下“大夫見”、“士見”、下注“拜見”同。" }
      - { type: z, text: "“凡非”至“拜者”。○正義曰：此明禮尚往來也。己雖賢德，而必皆相答拜也。凡拜而不答拜者，唯有吊喪與士見已君此二條耳。吊所以賓不答拜者，己本來為助執於喪事，非行賓主之禮，故主人雖拜己，己不答也。故《士喪禮》有賓則拜之、賓不答拜是也。君不答士者，謂士見已君，君尊不答也。○注“國君”至“拜士賤”。○正義曰：案《聘禮》士介四人，君皆答拜者，以其他國之士故也。" }
      - { type: j, text: "大夫見於國君，國君拜其辱。士見於大夫，大夫拜其辱。同國始相見，主人拜其辱。自外來而拜，拜見也。自內來而拜，拜辱也。君於士，不答拜也，非其臣則答拜之。不臣人之臣。大夫於其臣，雖賤，必答拜之。闢正君。○闢音避。男女相答拜也。嫌遠別不相答拜以明之。○相答拜，一本作“不相答拜”；皇雲：“後人加‘不’字耳。”別，彼列反。" }
      - { type: z, text: "“大夫”至“相答拜也”。○正義曰：“辱“謂見他國君也，故《聘禮》雲公在門左拜，是拜其辱也。○“士見於大夫，大夫拜其辱”者，謂平常相答拜，非加敬也。故《聘禮》賓朝服問卿，卿迎於廟門外，再拜，是主人必拜辱也。《士相見禮》士見大夫，於其入也，主人一拜，賓退，送，又再拜。熊氏以為同國大夫見已君，君拜其辱者，以初為大夫，敬之故也，若尋常則不拜也。○“同國始相見，主人拜其辱”者，前是異國，此明同國。同國則主人必先拜辱，不論有德也。○“君於士，不答拜也，非其臣，則答拜之者，君於己士，以其賤，故不答拜。然《聘禮》雲聘使還，士介四人，君旅答拜者，敬其奉使而還。《士相見禮》士見國君，君答拜者，以其初為士，敬之故也。○“非其臣則答拜之”者，以其他國之士，非已尊所加，故答之也。○“大夫於其臣，雖賤，必答拜之”者，大夫為君，宜闢正君，故不辨己臣貴賤，皆答拜也。○“男女相答拜也”者，男女宜別，或嫌其不相答，故明雖別，必宜答也。俗本雲：“男女不相答拜。”禮，男女拜，悉相答拜，則有“不”梁為非，故鄭雲：“嫌遠別不相答拜以明之。”" }
      - { type: j, text: "國君春田不圍澤，大夫不掩群，士不取麛卵。生乳之時，重傷其類。○麛音迷。卵，力管反。乳，如注反。" }
      - { type: z, text: "“國君”至“麛卵”。○正義曰：此明貴賤田獵不同。國君，諸侯也。春時萬物產孕，不欲多傷殺，故不合圍繞取也，夏亦當然。○“大夫不掩群”者，群謂禽獸共聚也。群聚則多，不可掩取之。○“士不取麛卵”者，麛乃是鹿子之稱，而凡獸子亦得通名也。卵，鳥卵也。春方乳長，故不得取也。然國君春田不圍也，則天子春圍。大夫春不掩，則國君春掩也。士春不取麛卵，則大夫春取也。而《王制》雲“天子不合圍，諸侯不掩群”，則與此異者，彼上雲：“天子諸侯無事，則歲三田。”鄭雲：“三田者，謂夏不田，謂夏時也。”案《周禮》四時田，而云“三田”者，下因雲“不合圍”，則知彼亦夏禮也。又《史記》湯立三面網，而天下歸仁，亦是不合圍也。此間所明周制矣。" }
      - { type: j, text: "歲凶，年穀不登。登，成也。君膳不祭肺，馬不食穀，馳道不除，祭事不縣大夫不食梁，士飲酒不樂。皆自為貶損憂民也。《禮》：食殺牲則祭先，有虞氏以首，夏后氏以心，殷人以肝，周人以肺。不祭肺，則不殺也。天子食，日少牢，朔月大牢。諸侯食，日特牲，朔月少牢。除，治也。不治道，為妨民取蔬食也。縣，樂器鍾磬之屬也。粱，加食也。不樂，去琴瑟。○肺音芳廢。縣音玄，下同。為如字，舊音於偽反，下“為妨”音於偽反。" }
      - { type: z, text: "“歲凶”至“飲酒不樂”。○正義曰：此下明凶荒人君憂民自貶退禮也。○“歲凶”者，謂水早災害也。“年穀不登”者，歲既凶荒，而年中穀稼不登。登，成也。然年、歲雖通，其亦有異。鄭注《太史職》：“中數曰歲，朔數曰年。”釋者雲，年是據有氣之初，歲是舉年中之稱，故云朔數曰年，中數曰歲也。○“君膳不祭肺”者，膳，美食名。禮，天子食，日少牢，朔月太牢。諸侯食，日特牲，朔月少牢。夫盛食必祭，周人重肺，故食先祭肺。歲既兇飢，故不祭肺，則不殺牲也。○“馬不食穀”者，年豐則馬食穀，今凶年，故不食也。○“馳道不除”者，馳道，正道，如今御路也。是君馳走車馬之處，故曰“馳道”也。除，治也。不治謂不除於草萊也。所以不除者，凶年人各應採蔬食，今若使人治路，則廢取蔬食，故不除也。“祭事不縣”者，樂有縣鍾磬，因曰“縣”也。凶年雖祭，而不作樂也。自貶損，故先言膳，後言祭。○“大夫不食梁”者，大夫食黍稷，以梁為加，故凶年去之也。○“士飲酒不樂”者，士平常飲酒奏樂，今凶年，猶許飲酒，但不奏樂也。○“君膳不祭肺”以下，及“士飲酒不樂”，各舉一邊而言，其實互而相通，但君尊，故舉不殺牲及不縣之等大者而言，大夫士卑，直舉飲酒之小者言耳。○注“有虞”至“琴瑟”。○正義曰：此《明堂位》文，引之者，證不祭肺。“天子食，日少牢，朔月大牢。諸侯食，日特牲，朔月少牢”，此《玉藻》文。引之者，證天子諸侯非凶年常食殺牲之事。案《周禮·膳夫》雲，王日一舉太牢。不引《膳夫》而引《玉藻》者，以《膳夫》秪有王禮，《玉藻》兼載天子諸侯。此經雲“君膳不祭肺”，又連言大夫士，是其文既廣，故引《玉藻》天子諸侯為證也。《玉藻》所以異《膳夫》者，《膳夫》是周之正禮，《玉藻》是衰世之法，故《鄭志》雲：“作《記》之時，或諸侯同天子，或天子與諸侯同，作《記》者亂之耳。”雲“粱，加食也”者，以其《公食大夫禮》設正饌之後，乃設稻粱，以其是加也。此“歲凶”者，案襄二十四年冬大飢，《穀梁傳》曰：“五穀不升為大飢。一穀不升謂之嗛，二穀不升謂之飢，三穀不升謂之饉，四穀不升謂之康，五穀不升謂之大侵。。大侵之禮，君食不兼味，臺榭不塗，弛侯，廷道不除，百官布而不制，鬼神禱而不祀。”此雲“歲凶”，與彼“大侵”同也。此“膳而不祭肺”，則“食不兼味”也。此“祭事不縣”，謂祈禱之祭，則與大侵“禱而不祀”一也。《白虎通》雲：“一穀不升徹鶉遲，二穀不升徹鳧雁，三穀不升徹雉兔，四穀不升損囿獸，五穀不升不備三牲。”其“不備三牲”，與此“君膳不祭肺”同也。" }
      - { type: j, text: "君無故玉不去身，大夫無故不徹縣，士無故不徹琴瑟。憂樂不相干也。“故”謂災患喪病。○樂音洛。" }
      - { type: z, text: "“君無”至“琴瑟”。○正義曰：此明無災者也。君，諸侯也。玉謂佩也。君子於玉比德，故恆佩玉，明身恆有德也。且以玉為容飾，無故則有容飾，故佩玉也。○“大夫無故不徹縣”者，徹亦去也，無災變則不去樂也。○“士無故不徹琴瑟”者，此無災則亦不去也。故鄭前注士“不樂，去琴瑟”，取此文“琴瑟”，此是不命之士爾，若其命士，則特縣也。自士以上，皆有玉佩。上雲君無故不去玉，則知下通於士也。下言士不去琴瑟，亦上通於君也。但比德為重，故君上明之也。又大夫言縣，士言琴瑟，亦互言耳。但縣勝，故大夫言之也。○注“憂樂”至“喪病”。○正義曰：災，水火也。熊氏雲：“案《春秋說題辭》：‘樂無大夫士制。’鄭玄《箴膏肓》從《題辭》之義。大夫士無樂，《小胥》‘大夫判縣，士特縣’者，《小胥》所云娛身之樂及治人之樂則有之也。故《鄉飲酒》有工歌之樂是也。縣，《題辭》雲無樂者，謂無祭祀之樂，故特牲、少牢無樂。若然，此雲大夫不徹縣，士不徹琴瑟者，謂娛身及治民之樂也。”" }
      - { type: j, text: "士有獻於國君，他日，君問之曰：“安取彼？”再拜稽首而後對。起敬也。" }
      - { type: z, text: "“士有”至“後對”。○正義曰：此一節論大夫士饋獻之事，各依文解之。○“士有獻”者，謂士有物奉貢於君也。○“他日，君問之曰，安取彼”者，“他日”謂別日也，非是獻物之日。“安取彼”，猶何處取彼物。別日君問士雲：“何處得前所獻之物？”所以須問者，士卑德薄，嫌其無有也。不即問而待他日者，士有貢獻，當日乃自致於外，而不敢容易見，恐君答已拜，故別日乃見君，君得問之也。○“再拜稽首而後對”者，士聞君問，故先拜稽首，而後起對得物所由。" }
      - { type: j, text: "大夫私行，出疆必請，反必有獻。士私行，出疆必請，反必告。臣不敢自專也。私行，謂以已事也。士言告者，不必有其獻也，告反而已。○疆，居良反，下同。君勞之，則拜。問其行，拜而後對。亦起敬也。問行，謂道中無恙及所經過。○恙音羊尚反。" }
      - { type: z, text: "“大夫私行”至“拜而後對”。○正義曰：“私行”謂非為君行也。“疆”，界也。既非公事，故宜必請也。然大夫無外交，而此有私行出界，或是新來大夫，姻婭猶在本國，故有私行往來，但不得執交於外耳。○“反必有獻”者，大夫有德，必能招人餉遺，故還必有獻。有獻由德，亦示君知賢無異志。○“士私行出疆，必請”者，出與大夫同也。○“反必告”者，還與大夫異也。士德劣，故不必有獻，但必知還而已。○“君勞之，則拜”者，大夫士通如此，謂行還，而君若慰勞己之勞苦，則己拜之也。或有本雲“士有獻”字，非也。○“問其行，拜而後對”者，君若問其行道中無恙及游涉所至，則又拜拜竟而起對也。先拜後答，急謝見問之恩也。" }
      - { type: j, text: "國君去其國，止之曰：“奈何去社稷也？”大夫，曰：“奈何去宗廟也？”士，曰：“奈何去墳墓也？”皆民臣殷勤之言。國君死社稷，死其所受於天子也，謂見侵伐也。《春秋傳》曰：“國滅，君死之，正也。”大夫死眾，士死制。死其所受於君。眾謂君師。制謂君教令所使為之。" }
      - { type: z, text: "“國君”至“死制”。○正義曰：此一節論國君以下去國，臣民止留之辭，及死其所守之事，各依文解之。○“國君去其國”者，謂諸侯去國，而其臣民止留殷勤之辭也。奈何，猶言如何也。國主社稷，君去，故云“去社稷”。《異義》：“《公羊》說，‘國滅，君死，正也’。故《禮運》雲‘君死社稷’，無去國之義。《左傳》說，昔大王居豳，狄人攻之，乃逾梁山，邑於岐由，故知有去國之義也。許慎謹案：《易》曰：‘系遁，有疾厲，畜臣妾，吉。’知諸侯無去國之義也。”鄭不駁之，明從許君用《公羊》義也。然則《公羊》之說正禮，《左氏》之說權法，義皆通也。○“大夫，曰，奈何去宗廟也”者，大夫去國，謂三諫不從，或以罪見黜者，亦臣民止留之辭也。大夫無社稷，故云“宗廟”也。故《孝經》雲，諸侯保其社稷，大夫守其宗廟也。○“士，曰，奈何去墳墓也”，士亦謂三諫不從，及或以罪見黜，雖無臣民，而屬吏止之也。士亦有廟，闢大夫，言“墳墓”，亦與大夫互也。然《孝經》雲，士“保其祿位而守其祭祀”。今不雲“祭祀”者，明雖去此之彼，而猶得祭祀，但墳墓不隨耳。○“國君”至“死制”。○國君體國，國以社稷為主，若有寇難，則以死衛之，故不可去也。注云：“死其所受於天子也，謂見侵伐也。”鄭又引《公羊》襄六年傳雲“國滅，君死之，正也”。以證之，是也。○“大夫死眾”者，大夫職主領眾將軍，若四郊多壘，則為己辱，故有寇難，當保國，必率眾御之，以死為度。“士死制”者，制謂君教命所使也。雖不得率師，若君命使之，則唯致死。熊氏雲：“上雲國君‘去社稷’，此雲‘死社稷’，上雲大夫‘去宗廟’，士‘去墳墓’，此不雲大夫‘死宗廟’，士‘死墳墓’，而云‘死眾’、‘死制’者，以宗廟、墳墓已私有之，大夫士為臣事君，不可為私事而死，秪得死君之師眾及君政令。然君言“死社稷”，則宗廟、墳墓亦死可知也。但社稷受於天子，故特舉言焉。" }
      - { type: j, text: "君天下曰“天子”，朝諸侯、分職、授政、任功，曰“予一人”。皆擯者辭也。天子，謂外及四海也。今漢於蠻夷稱天子，於王侯稱皇帝。《覲禮》曰：“伯父實來，餘一人嘉之。”餘、予古今字。○分，方雲反，徐扶問反。擯，必刃反。予一人，依字音羊汝反，鄭雲“餘、予古今字”，則同音餘。" }
      - { type: z, text: "“君天”至“一人”。○正義曰：此一節論天子稱謂之事，各依文解之。○“君天下”者，“天下”謂七千裏外也。天子若接七千裏外四海之諸侯，則擯者稱天子以對之也。所以然者，四海難伏，宜尊名以威臨之也。不言王者，以父天母地，是上天之子，又為天所命，子養下民，此尊名也。崔靈恩雲：“夷狄不識王化，無有歸往之義，故不稱王臨之也。”不雲皇者，戎狄不識尊極之理，皇號，尊大也，夷狄唯知畏天，故舉天子威之也。○“朝諸侯”者，此謂接七千裏以內諸侯也。○“授政”者，謂所縣象魏之法，授於諸侯也。○“任功”者，謂使人專掌委任之功，若“五侯九伯，汝實徵之”也。○“曰予一人”者，予，我也。自“朝諸侯”以下，皆是內事，故不假以威稱，但自謂“予一人”者，言我是人中之一人，與物不殊，故自謙損。《白虎通》雲：“王自謂一人者，謙也，欲言己才能當一人耳，故《論語》雲：‘百姓有過，在予一人。’臣下謂之‘一人’者，所以尊王者也。以天下之大，四海之內，所共尊者一人耳。”○注“皆擯”至“天子”。○正義曰：知擯者之辭者，以《覲禮》雲，擯者曰：“伯父實來，予一人嘉之。”此經亦稱“予一人”，故知“擯者辭”。引漢禮於夷狄稱天子者，證此經“君天下”謂夷狄之內也。《異義》：“天子有爵不？《易》孟京說，《易》有周人五號：帝，天稱，一也；王，美稱，二也；天子，爵號，三也；大君者，興盛行異，四也；大人者，聖人德備，五也。是天子有爵。《古周禮》說天子無爵，同號於天，何爵之有？許慎謹案：《春秋左氏》雲施於夷狄稱天子，施於諸夏稱天王，施於京師稱王。知天子非爵稱，同古《周禮》義。”鄭駮雲：“案《士冠禮》雲：‘古者生無爵，死無諡。’自周及漢，天子有諡。此有爵甚明，雲無爵，失之矣。”若杜預之義，天子，王者之通稱，故成公八年，“天子使召伯來賜公命”，魯非夷狄，稱“天子”；莊元年冬，“王使榮叔來錫桓公命”，魯非京師，而單稱“王”：是無義例。其許慎、服虔等依京師曰“王”、夷狄曰“天子”，與此不同，具有別說。" }
      - { type: j, text: "踐阼，臨祭祀，內事曰“孝王某”，外事曰“嗣王某”。皆祝辭也。唯宗廟稱孝，天地社稷祭之郊內，而曰嗣王，不敢同外內。○“皆祝辭”，本或作“皆祝祝辭也”，下祝字之又反，又之六反。" }
      - { type: z, text: "“踐阼”至“王某”。○正義曰：踐，履也。阼，主人階也。天子祭祀升阼階。天子吉凶之稱，凡自稱及擯者之辭曰“予一人”，故《玉藻》雲“凡自稱，天子曰予一人”是也；在喪未葬，自稱曰“小童”，故僖九年在喪未葬“王曰小童”是也；若既葬之後，未逾年，則稱名稱子，故昭二十二年六月“葬景王”，冬十月“王子猛卒”是也；若逾年之後，三年之內稱“予小子”，故下文雲“天子未除喪，曰‘予小子’是也；若三年除喪，稱王，故《公羊》雲九年傳雲“天子三年，然後稱王”是也；或稱“予”，或稱“我”，故《泰誓》雲“予克受”，又曰“我友邦冢君”是也；或稱“朕”，故《湯誥》雲“朕躬有罪”是也。其祝告神之辭，則下文雲：“內事曰孝王某，外事又嗣王某”，曰曰“天王某甫”是也。其史書策辭，下文雲“天王崩”。其招魂之辭，其下文雲“天子復矣”是也。其謙虛卑退，或稱“小子”，《湯誓》雲“非臺小子”是也。或曰“不穀”，僖二十四年《左傳》雲“不穀不德，得罪於母弟之寵子帶”是也。或曰“寡人”，故《中候洛予命》湯東觀於洛，雲“寡人慎機”是也。“逾年則稱王”者，據臣子稱也。若王自稱，必待三年。《顧命》成王殯，未能逾年，稱“予一人”者，熊氏雲：“天下不可一日無王故也。今謂‘予一人’者，以麻冕黼裳，即位受顧命，從吉，故暫稱‘一人’也。”履主階行事，故云“踐阼”也。○“臨祭祀”者，謂天子臨郊廟之祭祀也。○“內事曰孝王某”者，內事，宗廟，是事親。事親宜言孝，故升阼階，祭廟則祝辭雲“孝王某某”，為天子名也。“外事曰嗣王某”者，外事，郊社也。天地尊遠，不敢同親雲孝，故云“嗣王某”，言此王繼嗣前王而立也。○注“皆祝”至“內外”。○正義曰：天子以四郊為外，圓丘方澤，明堂社稷，皆在郊內，應稱孝而猶同外辭曰“嗣王”者，尊天地，雖祭之郊內，猶從外辭。崔靈恩雲：“天地社稷是外神，而祭之郊內，不敢外之。”今案鄭注云：“而曰嗣王，不敢同外內。”則是唯於嗣王之稱有外內，不關祭祀之處。崔所云天地祭之在內，不敢外，恐非鄭義。謂不敢外內者，若宗廟之祭從內事之例，而祭辭稱孝，若凡常山川並嶽瀆之神祭之在外之例，而辭稱嗣，是在內從內辭，在外從外辭。今天地社稷既尊，不敢同外內之例。雖祭之在內而用外辭，天地是尊，不敢同外內之常例也。" }
      - { type: j, text: "臨諸侯，畛於鬼神，曰“有天王某甫”。畛，致也。祝告致於鬼神辭也。曰“有天王某甫”，某甫，且字也。不名者，不親往也。《周禮》大會同，過山川，則大祝用事焉。鬼神謂百辟卿士也。畛或為祗。○畛，之忍反。父音甫，注同。大祝音泰，下文、注除“太宗”皆同。闢，必亦反。" }
      - { type: z, text: "“臨諸”至“某甫”。○正義曰：此謂天子巡守，祝告神辭也。巡守遍於方岳，臨視諸侯，故曰“臨諸侯”也。鄭雲：“以尊適卑曰臨。”○“畛於鬼神”者，畛，致也。王往方岳，凡所過山川，悉使祝往致辭，告於山川鬼神也。○“曰有天王某甫”者，既不自往，故祝辭不稱名，而云“某甫”者，鄭雲“且字”也。解“且字”者，雲某是天子之字，甫是男子美稱也。祝稱天子字，而下雲甫，是尼父之類也。故《穀梁傳》雲：“父猶傅也，男子美稱也。”《士冠禮》注曰：“甫，丈夫美稱。”而《雜記》：“附於殤，稱陽童某甫。”鄭注云：“尊神不名，為之造字。”以此而言，“某”者是字，“甫”者，丈夫美稱。而鄭所以謂為“且字”者，舊說雲，未斥其人，且以美稱配成其字。《音義隱》雲：“且，假借此字也。”○注“畛致”至“事”。○正義曰：致鬼神，謂天子所行過諸侯之國，則止於諸侯之廟，而使太祝告鬼神，雲“有天王某甫”。“鬼神謂百辟卿士”者，謂昔為諸侯卿士者，若過山川，亦使太祝用事往告曰有某甫，故引《太祝職》以證之。" }
      - { type: j, text: "崩，曰：“天王崩。”史書策辭。復，曰：“天子復矣。”始死時呼魄辭也。不呼名，臣不名君也。諸侯呼字。" }
      - { type: z, text: "“崩曰”至“復矣”。○正義曰：此謂告王者升假，而史書載於方策之辭。“崩”者，自上而墜下曰崩，王者死如從天墜下，故曰“崩”也。然崩通於壞敗之稱，則防墓崩，及《春秋》“沙鹿崩”是也。“復，曰，天子復矣”者，復，招魂復魄也。夫精氣為魂，身形為魄。人若命至終畢，必是精氣離形，而臣子罔極之至，猶望應生，故使人升屋，北面招呼死者之魂，令還復身中，故曰復也。若漫招呼，則無指的，故男子呼名，婦人呼字，令魂識知其名字而還。王者不呼名字者，一則臣子不可名君，二則普天率土，王者一人而已，故呼“天子復”，而王者必知呼已而返也。以例而言之，則王后死亦呼“王后復”也。崔靈恩雲：“復所以呼天子者，凡王者皆感五精之帝而生，是天之子，今天王崩，是其精氣還復於上，呼稱天子，望更生之義。”" }
      - { type: j, text: "告喪，曰：“天王登假。”告，赴也。登，上也。假，已也。上已者，若仙去雲耳。○假音遐，注同。登上，時掌反，下同。仙音仙。措之廟，立之主曰“帝“。同之天神，《春秋傳》曰：“凡君，卒哭而祔，祔而作主。”○措，七故反，置也。祔音附。天子未除喪，曰“予小子”。謙，未敢稱一人。《春秋傳》曰：“以諸侯之逾年即位，亦知天子之逾年即位。以天子三年然後稱王，亦知諸侯於其封內三年稱子。”生名之，死亦名之。生名之曰小子王，死亦曰小子王也。晉有小子侯，是僣取於天子號也。" }
      - { type: z, text: "“告喪”至“名之”。○正義曰：此謂天王崩而遣使告天下萬國之辭也。登，上也。假，已也。言天子上升已矣，若仙去然也。而史策書雲“天王崩”，復曰“天子復”，赴雲“天王登假”，三稱不同者，為義然也。王是歸往，而策及赴告是有存亡往來之義，故崩、赴並言之也。○“措之廟，立之主”者，措，置也。王葬後，卒哭竟而祔，置於廟，立主，使神依之也。《白虎通》雲：“所以有主者，神無依據，孝子以繼心也。主用木，木有始終，又與人相似也。”蓋記之為題，欲令後可知也。方尺，或曰尺二寸，鄭雲：“周以栗。”《漢書》：“前方後圓。”《五經異義》雲：“主狀正方，穿中央，達四方。天子長尺二寸，諸侯長一尺。”○“曰帝”者，天神曰帝，今號此主，同於天神，故題稱帝，雲文帝武帝之類也。崔靈恩雲：“古者帝王生死同稱，生稱帝者，死亦稱帝。生稱王者，死亦稱王。今雲‘措之廟，立之主曰帝’者，蓋是為記時有主入廟稱帝之義，記者錄以為法也。”○注“同之”至“作主”。○正義曰：此是《左傳》僖三十三年之言也。天子七月而葬，九月而卒哭。諸侯五月而葬，七月而卒哭。大夫三月而葬，五月而卒哭。士三月而葬，是月而卒哭。卒哭者，是葬竟虞數畢後之祭名也。孝子親始死，哭晝夜無時，葬後虞竟，乃行神事，故卒其無時之哭，猶朝夕各一哭，故謂其祭為卒哭。卒哭明日而立主，祔於廟，隨其昭穆，從祖父食。卒哭，主暫時祖廟，畢，更還殯宮，至小祥作栗主入廟，乃埋桑主於祖廟門左埋重處。故鄭雲：“虞而作主，至祔，奉以祔祖廟，既事畢，反之殯宮。”然大夫士亦卒哭而祔，而《左傳》唯據人君有主者言之，故云“凡君”。鄭注《祭法》，雲大夫士無主也。此言“凡君”，明不關大夫士也。崔靈恩雲：“大夫士無主，以幣帛祔、祔竟，並還殯宮，至小祥而入廟也。”又《檀弓》雲：“重，主道也。”鄭注引《公羊傳》雲“虞主用桑，練主用栗”，則似虞己有主。而《左傳》雲：“祔而作主。”二傳不同者，案說《公羊》者，朝葬，日中則作虞主。若鄭君以二傳之文雖異，其意則同，皆是虞祭總了，然後作主。以作主去虞實近，故《公羊》上系之於虞，作主謂之“虞主”。又作主為祔所須，故知《左氏》據祔而言，故云：“祔而作主。”故《異義》雲：“《古春秋左氏》說，既葬，反虞。天子九虞，九虞者以柔日，九虞十六日也。諸侯七虞，十二日也。大夫五虞，八日也。士三虞，四日也。既虞，然後祔死者於先死者，祔而作主，謂桑主也。期年然後作栗主。許慎謹案：《左氏》說與《禮記》同。”鄭君不駁，明同許意。故注《檀弓》雲：“重既虞而埋之，乃後作主。”是總行虞祭竟，乃埋重作主耳。下《檀弓》雲：“虞而立屍，有几筵，卒哭而諱，生事畢，而鬼事始已。既卒哭，宰夫執木鐸以命於宮中曰：‘舍故而諱新。’鄭雲：“故謂高祖之父當遷者。”據《檀弓》文句相連，鄭以為人君之禮，明虞唯立屍，未作主也。○“天子未除喪，曰予小子”者，夫適嗣於初喪，但人子當未忍即受天王之稱，故不曰“予一人”，而稱“予小子”者，言我德狹小也。○注“《春秋》”至“稱子”。○正義曰：鄭所引者，文九年《公羊傳》文。案《公羊傳》說文八年八月，“天王崩”，九年，“毛伯來求金”。《公羊》雲：“逾年矣，何以不言王使？未稱君也。以諸侯逾年即位，亦知天子之逾年即位也。以天子三年然後稱王，亦知諸侯於其封內三年稱子也。”若然，天子逾年即位無文。約魯十二公，諸侯三年內稱子亦無文，約天子逾年不稱使也，是天子諸侯互相明也。引之者，證天子三年之內稱“予小子”也。又準《左傳》之義，諸侯薨而嗣子即位，凡有三時，一是始喪，即適子之位：二是逾年正月，即一國正君臣之位；三是除喪而見於天子，天子命之，嗣列為諸侯之位。今此《公羊》逾年即位，是遭喪明年，為元年正月即位。《白虎通》雲：“父沒稱子某，屈於屍柩也。既葬稱子者，即尊之漸也。逾年稱公者，緣民臣之心不可一日無君。終始之義，不可一年二君，故逾年即位，保民臣之心也。三年後受爵者，緣孝子之思，未忍安吉。”故僖三十二年十二月乙巳，公薨於小寢。文公元年正月，公即位，四月丁巳葬。《韓詩內傳》曰：“諸侯世子三年喪畢，上受爵命於天子。”乃歸即位何？明爵天子有也，臣無自爵之義是也。童子亦當受爵命，使大夫就其國命之，不與童子為禮也。○“生名之，死亦名之”者，嗣王既呼為小子，若於喪中而死，亦諡為小子王，喪質，故不變稱也。○注“生名”至“號也”。○正義曰：以晉為證也。晉有小子侯，哀侯之子也。魯桓公七年《左傳》“曲沃伯誘晉小子侯殺之”，是在喪而死，猶呼為小子侯也。其應稱嗣子某，不得同天子稱小子，是僣取之耳。" }
      - { type: j, text: "天子有後，有夫人，有世婦，有嬪，有妻，有妾。妻，八十一御妻，《周禮》謂之“女御”，以其御序於王之燕寢。妾，賤者。○嬪音頻。" }
      - { type: z, text: "“天子”至“有妾”。○正義曰：此一節總論立男官女官之事，各隨文解之。○“天子有後”者，天子立官，則先從后妃為始。所以然者，為治之法，刑於寡妻，始於家邦，終於四海，故刪《詩》則以後妃為首。若論氣先陰後陽，故此言“天子有後”也。謂之為後者，後，後也，言其後於天子，亦以廣後胤也。○“有夫人”者，夫，扶也，言扶持於王也。○“有世婦”者，婦，服也，言其進以服事君子也。以其猶貴，故加以“世”言之，亦廣世胤也。○“有嬪”者，嬪，婦人之美稱，可賓敬也。○“有妻”者，鄭注《內則》雲：“妻之言齊也。以禮見問，得與夫敵體也。”案彼是判合齊體者，今此言齊者，以進御於王之時，暫有齊同之義。○“有妾”者，鄭注《內則》雲：“妾之言接也，聞彼有禮，走而往焉，以得接見於君子也。”《周禮》則嬪在世婦上，又無妾之文也。今此所陳與《周禮》雜而不次者，記者之言，不可一依《周禮》，或可雜夏、殷而言之。鄭注《檀弓》雲：“舜不告而娶。不立正配，但三夫人。夏則因而廣之，增九女，則十二人，所增九女者，則九嬪也。”故鄭雲：“《春秋》說雲，天子娶十二人，夏制。”鄭又云：“殷增三九二十七人，總三十九人，所增二十七世婦也。周又三二十七人，因為八十一人，則女御也。”○注“《周禮》”至“賤者”。○正義曰：解周名為“女御”之義，以其御於王之燕寢。御法，案《周禮》王有六寢，一是正寢，餘五寢在後，通名燕寢。其一在東北，王春居之。一在西北，王冬居之。一在西南，王秋居之。一在東南，王夏居之。一在中央，六月居之。凡后妃以下更以次序而上御王於五寢之中也。故鄭注《周禮·九嬪》雲：“凡御見之法，月與后妃共象也。卑者宜先，尊者宜後。女御八十一人當九夕，世婦二十七人當三夕，九嬪九人當一夕，三夫人當一夕，後當一夕，亦十五日而遍。雲自望後反之。孔子云：‘日者天之明，月者地之理，陰契制，故月上屬為天，使婦從夫放月紀。”月紀是星也。而婦人上御，必有女史彤管，以差次之。《毛詩傳》“貽我彤管”雲：“古者後夫人必有女史彤管之法，史不記過，其罪殺之。后妃妾以禮御於君所，女史書其日月，授之環以進退之。生子月辰則以金環退之。當御者以銀環進之，著左手。既御，著於右手。事無小大，記以成法。" }
      - { type: j, text: "天子建天官。先六大，曰大宰、大宗、大史、大祝、大士、大卜，典司六典。典，法也。此蓋殷時制也，周則大宰為天官，大宗曰宗伯，宗伯為春官，大史以下屬焉，大士以神仕者。天子之五官，曰司徒、司馬、司空、司士、司寇，典司五眾。眾，謂眾臣也。此亦殷時制也，周則司士屬司馬，大宰、司徒、宗伯、司馬、司寇、司空為六官。天子之六府，曰司土、司木、司水、司草、司器、司貨，典司六職。府，主藏六物之稅者。此亦殷時制也，周則皆屬司徒。司士，土均也。司木，山虞也。司水，川衡也。司草，稻人也。司器，角人也。司貨，卝人也。○卝，革猛反，又音虢猛反，徐故孟反，卝人掌金玉錫石未成器者。天子之六工，曰土工、金工、石工、木工、獸工、草工，典制六材。此亦殷時制也，周則皆屬司空。土工，陶、也。金工，築、冶、鳧、栗、鍛、桃也。石工，玉人、馨人也。木工，輪、輿、弓、廬、匠、車、梓也。獸工，函、鮑、韗、韋、裘也。唯草工職亡，蓋謂作萑葦之器。○陶音桃，陶人為瓦器也。，方往反，人為簠簋之屬。築音竹，築氏為書刀。冶音也，冶氏為箭鏃。鳧音符，鳧氏為鍾也。段，本又作鍛，多亂反，段氏為錢鎛。函音含，函人為甲鎧。韗，況萬反，一音運，一音況運反，韗人為鼓。萑音丸。五官致貢曰享。貢，功也。享，獻也。致其歲終之功於王謂之獻也。《周禮·大宰》：“歲終，則令百官府各正其治，受其會，聽其致事，而詔王廢置。”○享，許兩反，舊許亮反，後皆放此，不復重出。治音直吏反。會古外反。" }
      - { type: z, text: "“天子建天官”至“致貢曰享”。○正義曰：此以下是殷禮，所明異於周法。案《甘誓》雲：“六事之人。”鄭雲：“《周禮》六軍皆命卿，則三代同矣。”案《甘誓》及鄭注，則茸荃同有六卿。又鄭注《大傳》：“《夏書》雲，所謂六卿者，后稷、司徒、秩宗、司馬、作士、共工也。”而不說殷家六卿之名，今比《記》所言，上非夏法，下異周典，鄭唯指為殷禮也。然天官以下，殷家六卿，何者？大宰、司徒、司馬、司空、司士、司寇是也。但周立六卿，放天地四時，而殷六卿所法，則有異也。殷以大宰為一卿，以象天時，司徒以下五卿法於地事，故《鄭志》崇精問焦氏雲：“鄭雲茸荃同六卿，殷應六卿，此雲‘五官’何也？”焦氏答曰：“殷立天官，與五行其取象異耳。是司徒以下法五行，並此大宰，即為六官也。但大宰既尊，故先列大宰，並顯大宰之下隸屬大宰之官。既法於天，故同受大名，故云‘先六大’，大宰一、大宗二、大史三、大祝四、大士五、大卜六也。”“典司六典”者，結上也。上“典”是守典，下典是典則之典。言立此六官，以守主於六事之法。○注“此蓋”至“仕者”。○正義曰：知殷制者，以其上與夏官不同，下與《周禮》有異，故疑殷制也。知“大士”非司士及士師、卿士之等者，以其下別有“司士”、“司寇”，故知非士師、卿士也。與“大祝”、“大卜”相連，皆主神之士，故知神仕也。○“天子之五官”者，向立六官，以法天之六氣，此又置五官，以象地之五行也。天地五行踐立，故復雲“天子”，不雲“建”，從“天官”也。又天官尊、陽，故一卿以攝眾，地官卑、陰，故五卿俱陳也。不雲“地”者，與前互也。天尊故沒其數，地卑故明言其五也。司徒一、司馬二、司空三、司士四、司寇五也。○“典司五眾”者，結上也。言用此上五官，使各守其所掌上之群眾也。然此五官，亦各有所領群眾，如大宰領大宗以下也，而不條出其人者，略也。天言“六典”，地言“五眾”者，互言也。但天尊，故云“典”，地卑，故云“眾”也。○注“眾謂”至“六官”。正義曰：知此非是天下眾人，而為“群臣也”者，以經雲“五眾”，明官各有所眾，如週六官之屬也。《周禮》大宰總主六官之職。司徒主教，教其徒眾。宗伯者，伯，長也；宗，尊也；以主鬼神，故以尊為名。司馬主征伐，馬是征伐所用。司寇主除賊寇。司空主士居民。司士主公卿以下版藉爵祿之等。特以“司士”為名者，士是官之總首，故《詩》雲“濟濟多士”是也。諸官皆雲“司”，而大宰、宗伯不雲“司”者，司，主也，大宰總主六官，不偏有所司，故不言“司”也。宗伯之官不言“司”者，以上天地鬼神之事，天地鬼神既尊，非人所司，故不雲“司”也。○“天子”至“六職”。○殷六卿外，復別立此六官也。府者，藏物之處也。既法天地立官，天地應生萬物，故為萬物立府也。○“曰司土”，一也，於周為土均也。均平地稅之政令也。土生萬物，故為均也。○“司木”，二也，於周則為山虞也。虞，度也。主量度山之大小所生之物。○“司水”，三也，於周則為川衡。衡，平也。掌巡行川澤，平其禁令。○“司草”，四也，於周為稻人也。掌稼種下地及除草菜。○“司器”，五也，於周為卝人也。掌以時徵齒角於山澤之農，供為器用也。○“司貨”，六也，於周為丱人，言礦器未成者也。掌金玉錫石之地，而為之守禁，以時取之，以供器物。金玉曰貨，故稱貨人。“典司六職”者，結上立此六官，使各主其所掌職也。○注“府主”至“人也”。○正義曰：此皆與周不同，故云亦殷制也。司土，土均也。案《周禮》“土均，上士二人”。司木，山虞，“每大山中士四人，中山下士六人，小山下士二人”。不言林衡者，略舉山虞耳。司水於周為川衡，“川衡，每大川下士十有二人，中川下士六人，小川下士二”。人不言澤虞者，亦略舉川衡耳。“司草，稻人”者，“上士二人”。《周禮》亦有草人。今以司草為稻人者，二官俱主殺草，鄭舉稻人，欲見司草兼有二官也。“司器，角人”者，“下士二人”。“司貨，丱人”者，“中士二人”。○“天子”至“六材”。○工，能也，言能作器物者也。前既有六府之物，宜立六工以作之為器物，故為次也。亦有六者，依府以用事也。○“曰土工、金工、木工、石工、獸工、草工”者，此六官於《周禮》並屬司空，而《司空職》散亡，漢購千金不得，今唯有《考工記》以代之。○“典制六材”者，“材”謂材物，結上立此六工，使典制六府之材物。○注“土工”至“之器”。○正義曰：《考工記》“陶人為甗，實二鬴”，又“甑實二鬴，七穿”。《人職》雲：“人為簋。”是放法，陶是陶冶，互文耳。但簋是祭器，故取放法之名也。雲“金工”，謂築氏，掌為削。削，書刀也。“冶”謂煎金石者，冶鑄為之，冶氏掌為戈戟，故因呼煎金為冶。鳧氏世能為鍾以供樂器，故因呼作鍾為鳧氏也。氏為量器，為豆、區、鬴、鍾之屬也，氏世能為之。段氏主作錢鑄田器。桃氏為刃，刃謂刀劍之屬。雲“石工，玉人、磬人”者，玉人謂作圭璧者，磬人作磬也。玉及磬同出於石，故謂“石工”也。雲“木工，輪、輿、弓、廬、匠、車、梓也”者，此七物並用木，故曰“木工”也。輪，車輪也。輿，車床也。車難，不能一人獨成，各有所善，故輪、輿不同也。弓，能作弓者，也。廬，能作戈戟柲者也。匠，能作宮室之屬者。車謂能作大車及羊車也。梓謂杯勺為筍虡之屬也。“獸工，函、鮑、韗、韋、裘”者，此物並用獸皮，故曰“獸工”。函謂能作甲鎧者。鮑謂能治皮供作甲者。韗謂《考工記》“韗人為皋陶鼓木”，謂能以皮冒鼓者。韋，熟皮為衣及韎韐者。裘謂帶毛狐裘之屬者。《考工記》韋、裘二職存，唯草工職亡，《考工》無。“蓋謂作萑葦之器”，盛食之器及葦蓆之屬也。或言“氏”，或言“人”者，鄭注《考工記》雲：“其曰某人者，以其事名官也。其曰某氏者，官有世功，若族有世業者也。”幹寶雲：“凡言司者，總其領也。凡言師者，訓其徒也。凡言職者，主其業也。凡言衡者，平其政也。凡言掌者，主其事也。凡言氏者，世其官也。凡言人者，終其身也。不氏不人，權其材也。通權其才者，既雲不世，又不終身，隨其材而權暫用也。”然案《周禮》建官列職，有“司會”之屬，是言“司”者也。有“甸師”之屬，是言“師”者也。有“職內”之屬，是言“職”者也。有“川衡”之屬，是言“衡”者也。有“掌舍”之屬，是言掌者也。有“師氏”之屬，是言“師”者也。有“庖人”之屬，是言“人”者也。有“宮正”、“膳夫”、“外饔”、“內饔”之屬，皆不“氏”不“人”者也。○“五官致貢曰享”者，“五官”即前自後以下之五官，後一，天官二，地官三，六府四，六工五。貢，功也。享，獻也。歲終則此五官各考其屬一年之功，以獻於天子，故云“致貢曰享”也。王后之屬致蠶織之功，天官以下各獻其職之功。○注“貢功”至“廢置”。○正義曰：引《周禮》，證歲終百官各獻其功，以禮詔告也。周則冢宰至歲終受於百官之簿書所會之最，而考一年之功多少，以告天子也。若功少則廢黜其人，功多則遷置其職也。今謂“五官”，則上天子五官司徒以下，故下雲“五官之長曰伯”，與此五官一也。但太宰總攝群職，總受五官之貢，故不入其數也。若以五官為後以下，則下雲“五官之長”、豈有長於後乎？熊氏以為五等諸侯。亦非也。" }
      - { type: j, text: "《禮記正義》" }
