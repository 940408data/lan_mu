# 毛詩正義卷5（孔穎達疏）：j 為經文＋毛亨傳、鄭玄箋，z 為疏文。
sections:
  - id: juan5
    name: 正文
    blocks:
      - { type: j, text: "◎魏葛屨詁訓傳第九" }
      - { type: j, text: "陸曰：案《魏世家》及《左氏傳》雲：“姬姓國也。”《詩譜》雲：“周以封同姓，其地虞舜、夏禹所都之域，地在古冀州雷首之北，析城之西，南枕河曲，北涉汾水。”" }
      - { type: j, text: "魏譜魏者，虞舜、夏禹所都之地，○正義曰：《地理志》雲：“河東郡有河北縣，《詩》魏國也，晉獻公滅之，封大夫畢萬。”皇甫謐雲：“舜所營都”，或雲“蒲坂即河東縣”，是也。禹受禪，都平陽或安邑，皆屬河東。《五子之歌》怨太康失邦，其歌雲：“惟彼陶唐，有此冀方。今失厥道，乃厎滅亡。”《左傳》引其文，服虔雲：“堯居冀州，虞、夏因之，不遷居，不易民。其陶唐、虞、夏之都大率相近，不出河東之界，故《書》責太康亡失。”然則魏都河北蒲坂，故安邑皆逼近之，故云“魏者，舜、禹所都之地”，謂境內有其都耳，魏不居其墟也。○在《禹貢》冀州雷首之北，析城之西，○正義曰：《禹貢》雲：“壺口、雷首，至於太嶽；厎柱、析城，至於王屋。”《地理志》雲：“雷首在蒲坂南。析城在濩澤西南。”皆在河東界內，是其屬冀州也。○周以封同姓焉。○正義曰：襄二十九年《左傳》曰：“虞、虢、焦、滑、霍、楊、韓、魏，皆姬姓。”是與周同姓也。《魏世家》絕不知所封為誰，故言“周以封同姓”雲。其封域南枕河曲，北涉汾水。○正義曰：《地理志》雲：“魏國，姬姓也，在晉之南河曲，故其《詩》曰‘彼汾一曲’，‘寘諸河之幹兮’。”是南枕河曲也。《汾沮洳》曰：“彼汾沮洳，言採其莫。”刺君採其菜於汾，明其垶逾汾矣，故知北涉汾水。" }
      - { type: j, text: "昔舜耕於歷山，陶於河濱。○正義曰：《尚書傳》文也。彼注云：“歷山在河東。”是舜耕之處在魏境也。言“陶於河濱”，則在河北之濱，綯以歷山相近，同為魏地，故連言之。皇甫謐雲：“言陶於河濱，即《禹貢》所謂陶丘，今濟陰定陶之西南陶丘亭是也。”言河濱，明近河，不宜在濟陰，謐之言謬耳。○禹菲飲食而致孝乎鬼神，惡衣服而致美乎黻冕，卑宮室而盡力乎溝洫。此一帝一王，儉約之化，於時猶存。及今魏君，嗇且褊急，不務廣修德於民，教以義方。○正義曰：“教以義方”，隱三年《左傳》石碏辭也。感舜、禹之化，則應皆儉約，而《碩鼠》、《伐檀》又以刺君貪鄙者，雖遺風尚在，人性不同，不能使貪者皆儉。因《葛屨》等刺儉者多，又其詩在先，故言儉約之化耳。晉有唐之遺風，詩稱唐國。此有舜、禹舊化，其詩不稱虞、夏者，晉初，唐叔封為唐侯，又能憂深思遠，有堯之遺風，故謂之唐。魏初無虞、夏之名，虞、夏又非諸侯之國，徒感儉約之化，嗇且褊急，故《譜》本於舜、禹耳，無義，言虞，夏也。堯、舜道同，而感有深淺者，時君政異故也。○其與秦、晉鄰國，日見侵削，國人憂之。○正義曰：魏國西接於秦，北鄰於晉。桓四年《左傳》曰：“秦師圍魏。”是秦數伐之。終為晉所滅，明晉亦侵之。○當週平、桓之世，魏之變風始作。○正義曰：周自幽王以上，諸侯未敢專征。平、桓之後，以強凌弱。今雲“日見侵削”，明是諸侯專恣，故以為平、桓之時，變風始作。○至春秋魯閔公元年，晉獻公竟滅之，以其地賜大夫畢萬。自爾而後，晉有魏氏。○正義曰：鄭言此者，見閔公已前，魏國尚存，故平、桓之世得作詩也。魏無世家，而鄭於左方中雲：“《葛屨》至《十畝之間》為一君，《伐檀》、《碩鼠》為一君。”知者，以上五篇刺儉，下二篇刺貪，其事相反，故分為異君。或父祖，或子孫，不可知也。案襄二十九年《左傳》，魯為季札歌《魏》，曰：“美哉！大而婉，儉而易行，以德輔此，則為明主。”但此詩並刺君，而季札美之者，美其有儉約之餘風，而無德以將之，失於太儉，故詩人刺之。" }
      - { type: j, text: "《葛屨》，刺褊也。魏地陿隘，其民機巧趨利，其君儉嗇褊急，而無德以將之。險嗇而無德，是其所以見侵削。○屨，俱具反。褊，必淺反。陿音洽，本或作“狹”，依字應作“陝”。隘，於懈反。巧如字，徐苦孝反。趨，七須反，徐七喻反。嗇音色。" }
      - { type: z, text: "“《葛屨》二章，上章六句，下章五句”至“將之”。○正義曰：作《葛屨》詩者，刺褊也。所以刺之者，魏之土地既以狹隘，故其民機心巧偽以趨於利，其君又儉嗇且福急，而無德教以將撫之，令魏俗彌趨於利，故刺之也。言魏地狹隘者，若地廣民稀，則情不趨利；地狹民稠，耕稼無所，衣食不給。機巧易生。人君不知其非，反覆儉嗇褊急，德教不加於民，所以日見侵削，故舉其民俗君情以刺之。機巧趨利，首章上四句是也。儉嗇，言愛物；褊急，言性躁，二者大同，故直雲刺褊，卒章下二句是也。上章下二句，下章上三句，皆申說未三月之婦不可縫裳，亦是趨利之事也。○箋“儉嗇”至“侵削”。○正義曰：以下《園有桃》及《陟岵》序皆雲“國小而迫，日以侵削”，故箋採下章而言其刺之意。" }
      - { type: j, text: "糾糾葛屨，可以屨霜？糾糾，猶繚繚也。夏葛屨，冬皮屨。葛屨非所以屨霜。箋雲：葛屨賤，皮屨貴，魏俗至冬猶謂葛屨可以屨霜，利其賤也。○糾，吉黝反，沈居酉反。繚音了，沈音遼。摻摻女手，可以縫裳？摻摻，猶纖纖也。婦人三月廟見，然後執婦功。箋雲：言女手者，未三月未成為婦。裳，男子之下服，賤，又未可使縫。魏俗使未三月婦縫裳者，利其事也。○摻，所銜反，又所感反，徐又息廉反，《說文》作“攕”，山廉反，雲：“好手貌。”纖，息廉反。見，賢遍反。要之襋之，好人服之。要，衤要也。襋，領也。好人，好女手之人。箋雲：服，整也。衤要也領也在上，好人尚可使整治之。謂屬著之。○要，於遙反。襋，紀力反。屬音燭。著，直略反。" }
      - { type: z, text: "“糾糾”至“服之”。○正義曰：魏俗趨利，言糾糾然夏日所服之葛屨，魏俗利其賤，至冬日猶謂之可以屨寒霜；摻摻然未成婦之女手，魏俗利其士，新來嫁猶謂之可以縫衣裳。又深譏魏俗，言衤要之也，領之也，在上之衣尊，好人可使整治之。裳乃服之褻者，亦使女手縫之，是其趨利之甚。○傳“糾糾”至“屨霜”。○正義曰：糾糾為葛屨之狀，當為稀疏之貌，故云猶繚繚也。《士冠禮》雲：“屨，夏用葛，冬皮屨可也。”《士喪禮》雲：“夏葛屨，冬白屨。”注云：“冬皮屨，變言白者，明夏時用葛亦白也。”是衣服之宜，當夏葛屨，冬皮屨也。《月令》“季秋霜始降”，則屨霜自秋始。言冬者，以屨霜為寒，而言冬為寒甚，故傳據《儀禮》而舉冬以言之也。凡屨，冬皮夏葛，則無用絲之時。而《少儀》雲“國家靡幣，君子不履絲屨”者，謂皮屨以絲為飾也。《天官·屨人》說屨舄之飾有絇、繶、純，是屨用絲為飾。夏日之有葛屨，猶絺綌所以當暑，特為便於時耳，非行禮之服。若行禮之服，雖夏猶當用皮。鄭於《周禮》注及《志》言“朝祭屨舄，各從其裳之色”，明其不用葛也。○傳“摻摻”至“婦功”。○正義曰：摻摻為女手之狀，則為纖細之貌，故云“猶纖纖”。《說文》雲：“纖，好手。”《古詩》雲“纖纖出素手”，是也。下雲“宛然左闢”，是已人夫家。既入夫家，仍雲“女手”，明是未成婦也。《曾子問》雲：“三月而廟見，稱來婦。”又云：“女未廟見而死，歸葬於女氏之黨，示未成婦也。”則知既廟見者為成婦矣。既成為婦，則當家士盡為。此譏使之縫裳，明是未可縫裳，故云“三月廟見，然後執婦功”。三月廟見，謂無舅姑者。婦入三月，乃見於舅姑之廟。若有舅姑，則《士婚禮》所云“質明，贊見婦於舅姑”，不待三月也。雖於昏之明旦即見舅姑也，亦三月乃助祭行，故《易·歸妹》注及鄭《箴膏盲》皆引《士昏禮》雲：“婦入三月，而後祭行。”然則雖見舅姑，猶未祭行，亦未成婦也。成婦雖待三月，其婚則當夕成矣。《士昏禮》雲：“其夕，衽席於奧，良席在東，皆有枕，北趾。主人人，親脫婦纓，燭出。”注云：“婚禮畢，將臥息。”又《駮異義》雲：“昏禮之暮，枕蓆相連。”是其當夕成昏也。○箋“言女”至“其事”。○正義曰：以婦人之服不殊裳，故知所言裳者，指男子之下服也。《曲禮》曰：“諸母不漱裳。”唯舉裳不漱，則衣可漱。明裳為賤。○傳“要衤要”至“之人”。○正義曰：《士喪禮》雲：“襚者，左執領，右執要。”又曰：“襚者，以褶必有裳，執衣如初。”注云：“帛為褶，無絮。雖復與襌同，有裳乃成稱。”然則襚服有衣有裳，而左右執之，則左執衣領，右執裳要。此要謂裳，要字宜從衣，故云“要，衤要也”。要是裳衤要，則衤親為衣領。《說文》亦云：“襋，衣領也。”二者於衣於裳各在其上，且又功少，故好人可使整治屬著之。上雲“女手”，此雲“好人”，故云“好人，女手之人”。今定本雲“好人，好女手之人”者，義亦通。" }
      - { type: j, text: "好人提提，宛然左闢，佩其象揥。提提，安諦也。宛，闢貌。婦至門，夫揖而入，不敢當尊，宛然而左闢。象揥，所以為飾。箋雲：婦新至，慎於威儀。如是使之，非禮。○提，徒兮反。宛，於阮反。闢音避，注同，一音婢亦反。揥，敕帝反。諦音帝。維是褊心，是以為刺。箋雲：魏俗所以然者，是君心褊急無德教使之耳，我是以刺之。" }
      - { type: z, text: "“好人”至“為刺”。○正義曰：言好人初至，容貌安詳，審諦提提然。至門之時，其夫揖之，不敢當夫之揖，宛然而左闢之，又佩其象骨之揥以為飾。敬慎威儀如是，何故使之縫裳？魏俗所以然者，維是魏君褊心無德教使然，我是以為此刺也。○傳“提提”至“為飾”。○正義曰：《釋訓》雲：“提提，安也。”孫炎曰：“提提，行步之安也。”言安諦，謂行步安舒而審諦也。《士昏禮》雲：“婦至，主人揖婦以入。及寢門，揖入。”是婦至門，夫揖而入也。此好人不敢當夫之尊，故宛然而左還辟之。不敢當主，故就客位。○箋“魏俗”至“刺之”。○正義曰：如此箋，則魏俗之趨利由君也。序雲“魏地狹隘，其民機巧趨利”，則似魏俗先然與？此反者，魏俗趨利，實由地狹使然。人君當知其不可，而以政反之。今君乃儉嗇且褊急，而無德教，至使民俗益復趨利，故刺之。" }
      - { type: j, text: "《葛屨》二章，一章六句，一章五句。" }
      - { type: j, text: "《汾沮洳》，剌儉也。其君儉以能勤，剌不得禮也。○汾沮洳，汾音扶雲反，沮音子預反，洳音如預反。“其君子”，一本無“子”字。" }
      - { type: z, text: "“《汾沮洳》三章，章六句”至“得禮”。○正義曰：作《汾沮洳》詩者，刺儉也。其君好儉而能勤，躬自採菜，刺其不得禮也。" }
      - { type: j, text: "彼汾沮洳，言採其莫。汾，水也。沮洳，其漸洳者。莫，菜也。箋雲：言，我也。於彼汾水漸洳之中，我採其莫以為菜，是儉以能勤。○莫音暮。漸如字，又接廉反。彼其之子，美無度。箋雲：之子，是子也。是子之德，美無有度，言不可尺寸。美無度，殊異乎公路。路，車也。箋雲：是子之德，美信無度矣。雖然，其採莫之事，則非公路之禮也。公路，主君之軞車，庶子為之，晉趙盾為軞車之族是也。○軞，本作“旄”，音毛。盾，徒本反。" }
      - { type: z, text: "“彼汾”至“公路”。○正義曰：由魏君儉以能勤，於彼汾水漸洳之中，我魏君親往採其莫以為菜，是儉而能勤也。彼其採莫之子，能勤儉如是，其美信無限度矣，非尺寸可量也。美雖無度，其採莫之士殊異於公路，賤官尚不為之，君何故親採莫乎？刺其不得禮也。○傳“汾水”至“莫菜”。○正義曰：汾是水名。沮洳，潤澤之處，故為漸洳。“莫，菜”者，陸機《疏》雲：“莫，莖大如箸，赤節，節一葉，似柳，葉厚而長，有毛刺。今人繅以取繭緒。其味酢而滑，始生可以為羹，又可生食。五方通謂之酸迷，冀州人謂之乾絳，河、汾之間謂之莫。”案王肅、孫毓皆以為大夫採菜，其《集註序》雲：“君子儉以能勤。”案今定本及諸本序直雲“其君”，義亦得通。○箋“之子”至“尺寸”。○正義曰：“之子，是子”，《釋訓》文。《宛丘》雲：“游蕩無度。”《賓之初筵》雲：“飲酒無度。”皆謂無節度也。此不得為美無節度，故為無復度限，言不可以尺寸量也。○箋“是子”至“是也”。○正義曰：公路與公行一也。以其主君路車謂之公路，主兵車之行列者則謂之公行，正是一官也。宣二年《左傳》雲：“晉成公立，乃宦卿之適，以為公族。又宦其餘子，亦為餘子，其庶子為公行。趙盾請以括為公族，公許之。冬，趙盾為軞車之族。”是其事也。趙盾自以為庶子，讓公族而為公行，言為軞車之族，明公行掌軞車。服虔雲：“軞車，戎車之倅。”杜預雲“公行之官”，是也。其公族則適子為之，掌君宗族。成十八年《左傳》曰：“晉荀會、欒黶、韓無忌為公族大夫，使訓卿之子弟恭儉孝悌。”是公族主君之同姓，故下箋雲“公族，主君同姓昭穆”，是也。傳有公族、餘子、公行，此有公路、公行、公族，知公路非餘子者，餘子自掌餘子之政，不掌公車，不得謂之公路，明公路即公行，變文以韻句耳。此公族、公行，諸侯之官，故魏、晉有之。天子則巾車掌王之五路，車僕掌戎車之倅。《周禮》六官，皆無公族、公行之官，是天子諸侯異禮也。" }
      - { type: j, text: "彼汾一方，言採其桑。箋雲：採桑，親蠶事也。彼其之子，美如英。萬人為英。美如英，殊異乎公行。公行，從公之行也。箋雲：從公之行者，主君兵車之行列。○行，戶郎反，注同。" }
      - { type: z, text: "傳“萬人為英”。○正義曰：《禮運》注云：“英，俊選之尤者。”則英是賢才絕異之稱。此傳及《尹文子》皆“萬人為英”。《大戴禮·辨名記》雲：“千人為英。”異人之說殊也。" }
      - { type: j, text: "彼汾一曲，言採其藚。藚，水舄也。○藚音續，一名牛唇，《說文》音其或反。舄音昔。" }
      - { type: z, text: "傳“藚，水舄”。○正義曰：《釋草》雲：“藚，牛唇。”李巡曰：“別二名。”郭璞引《毛詩傳》曰：“水蕮也。如續斷寸寸有節，拔之可復。”陸機《疏》雲：“今澤蕮也。其葉如車前草大，其味亦相似，徐州廣陵人食之。”彼其之子，美如玉。美如玉，殊異乎公族。公族，公屬。箋雲：“公族，主君同姓昭穆也。”○昭，紹遙反，《說文》作“佋”。" }
      - { type: j, text: "《汾沮洳》三章，章六句。" }
      - { type: j, text: "《園有桃》，刺時也。大夫憂其君國小而迫，而儉以嗇，不能用其民，而無德教，日以侵削，故作是詩也。" }
      - { type: z, text: "“《園有桃》二章，章十二句”至“是詩”。○正義曰：儉嗇不用其民，章首二句是也。大夫憂之，下十句是也。由無德教，數被攻伐，故連言國小而迫，口以侵削，於經無所當也。" }
      - { type: j, text: "園有桃，其實之殽。興也。園有桃，其實之食。國有民，得其力。○箋雲：魏君薄公稅，省國用，不取於民，食園桃而已。不施德教民，無以戰，其侵削之由，由是也。○殽，本又作“餚”，音爻。省，色領反。心之憂矣，我歌且謠。曲合樂曰歌，徒歌曰謠。○箋雲：我心憂君之行如此，故歌謠以寫我憂矣。○謠音遙。行，下孟反，下文“行國”同。不我知者，謂我士也驕。箋雲：士，事也。不知我所為歌謠之意者，反謂我於君事驕逸故。○所為，於偽反，下“所為”皆同。彼人是哉，子曰何其！夫人謂我欲何為乎？○箋雲：彼人，謂君也。曰，於也。不知我所為憂者，既非責我，又曰：君儉而嗇，所行是其道哉。子於此憂之，何乎？○何其，音基，下章同。夫人，音符。何為，如字。心之憂矣，其誰知之？箋雲：如是則眾臣無知我憂所為也。其誰知之，蓋亦勿思！箋雲：無知我憂所為者，則宜無復思念之以自止也。眾不信我，或時謂我謗君，使我得罪也。○" }
      - { type: z, text: "“園有”至“勿思”。○毛以為，園有桃，得其實為之殽，以興國有民，得其力為君用。今魏君不用民力，又不施德教，使國日以侵削，故大夫憂之，言己心之憂矣，我遂歌而且謠，以寫中心之憂。不知我者，見我無故歌謠，謂我於君事也驕逸然，故彼人又言云：“君之行是哉！子之歌謠，欲何其為乎？”彼人既不知我而責我矣，而我心之憂矣，其誰能知之？既無知我者，或謗我使我得罪，其有誰能知之？我蓋欲亦自止，勿復思念之。彼人正謂不知我者。曰、其併為辭。○鄭以為，園有桃，魏君取其實為之殽。不興為異。又以彼人為君，曰為於言不知我者，謂我於君事驕逸。又言彼君之行儉而嗇，是其道哉！子於此憂之何？餘同。○箋“魏君”至“由是”。○正義曰：魏君薄於公稅，乃是人君美事，而刺之者，公家稅民有常，不得過度，故《孟子》曰：“欲輕之於堯、舜，大貉小貉；欲重之於堯、舜，大桀小桀。”十一而稅，下富上尊，是稅三不得薄也。《鄭志》答張逸亦云：“稅法有常，不得薄。”今魏君不取於民，唯食閩桃而已，非徒薄於一，故刺之。《中庸》雲：“時使薄斂。”《左傳》稱晉悼公薄賦斂，所以復霸，皆薄為美。以當時莫不厚稅，故美其薄賦斂耳。魯哀公曰：“二，吾猶不足。”是當時皆重斂也。易傳者以雲其實之殽，明食桃為殽，即是儉嗇之事。○傳“曲合”至“曰謠”。○正義曰：《釋樂》雲：“徒歌謂之謠。”孫炎曰：“聲消搖也。”此文歌謠相對，謠既徒歌，則歌不徒矣，故云“曲合樂曰歌”。樂即琴瑟。《行葦》傳曰：“歌者，合於琴瑟也。”歌謠對文如此。散則歌為總名。《論語》雲“子與人歌”，《檀弓》稱“孔子歌曰：‘泰山其頹乎’”之類，未必合樂也。○傳“夫人謂我欲何為乎”。○正義曰：夫人即經之彼人也。今定本雲“彼人”，不雲“夫人”，義亦通也。“何為”即經之“何其”也。彼人謂我何為者，言彼不知我者之人，謂我歌謠無所為也。箋以上已雲“不知我者”，此無為更斥彼人，故以為彼人斥君也。“曰，於”，《釋詁》文。" }
      - { type: j, text: "園有棘，其實之食。棘，棗也。○棘，紀力反，從兩束，俗作“栜”同。心之憂矣，聊以行國。箋雲：“聊，且，略之辭也。聊出行於國中，觀民事以寫憂。不我知者，謂我士也罔極。極，中也。箋雲：見我聊出行於國中，謂我於君事無中正。彼人是哉，子曰何其！心之憂矣，其誰知之？其誰知之，蓋亦勿思！" }
      - { type: j, text: "《園有桃》二章，章十二句。" }
      - { type: j, text: "《陟岵》，孝子行役，思念父母也。國迫而數侵削，役乎大國，父母兄弟離散，而作是詩也。役乎大國者，為大國所徵發。○岵，音戶。此傳及解“屺”共《爾雅》不同。王肅依《爾雅》。數音朔。“侵削”，本或作“國小而迫，數見侵削”者，誤。" }
      - { type: z, text: "“《陟岵》三章，章六句”至“是詩”。○正義曰：首章望父，二章望母，卒章望兄。敘言其思念之由，經陳思念之事。經無弟，而序言之者，經以父母與兄，己所尊敬，故思其戒。其實弟亦離散，故序言之以協句。今定本雲“國迫而數侵削”，義亦通也。○箋雲“役乎”至“徵發”。○正義曰：箋以文承數見侵削，嫌為從役以拒大國，故辨之雲“為大國所徵發”也。知者，以言“役乎大國”，則為大國所役，猶《司寇》雲“役諸司空”，則為司空所役，明是大國徵發之。" }
      - { type: j, text: "陟彼岵兮，瞻望父兮。山無草木曰岵。箋雲：孝子行役，思其父之戒，乃登彼岵山，以遙瞻望其父所在之處。○處，昌慮反。父曰：“嗟，予子！行役夙夜無已。箋雲：予，我。夙，早。夜，莫也。無已，無解倦。○莫音暮。解音介。上慎旃哉！猶來無止。旃，之。猶，可也。父尚義。箋雲：上者，謂在軍事作部列時。○旃，之然反。" }
      - { type: z, text: "“陟彼”至“無止”。○正義曰：孝子在役之時，以親戚離散而思念之。言己登彼岵山之上兮，瞻望我父所在之處兮。我本欲行之時，而父教戒我曰：“嗟汝我子也，汝從軍行役在道之時，當早起夜寐，無得已止。”又言：“若至軍中，在部列之上，當慎之哉，可來乃來，無止軍事而來。若止軍事，當有刑誅。”故深戒之。○傳“山無草木曰岵”。○正義曰：《釋山》雲：“多草木岵，無草木屺。”傳言“無草木曰岵”，下雲“有草木曰屺”，與《爾雅》正反，當是轉寫誤也。定本亦然。○傳“旃之”至“尚義”。○正義曰：此旃與《采苓》“舍旃”，旃皆為足句，故訓為“之”。“猶，可”，《釋言》文。父尚義者，解孝子所以稱父戒己之意，由父之於子尚義，故戒之。二章傳曰“母尚恩”，卒章傳曰“兄尚親”，皆於章末言之，俱明見戒之意，以其恩義親故也。文十八年《左傳》曰：“舜舉八元，使布五教於四方，父義母慈兄友弟恭子孝。”恩即慈也，親則友也。○箋“上者”至“列時”。○正義曰：上言行役，是在道之辭也。此變言上，又云可來乃來，明在軍上為部分行列時也。《曲禮》曰：“左右有局，各司其局。”注云：“局，部分也。”謂軍中各有所部為行列之分，與此一也。" }
      - { type: j, text: "陟彼屺兮，瞻望母兮。山有草木曰屺。箋雲：此又思母之戒，而登屺山而望之也。○屺音起。母曰：“嗟，予季！行役夙夜無寐。季，少子也。無寐，無耆寐也。○少，詩照反。耆，常志反。上慎旃哉！猶來無棄。”母，尚恩也。" }
      - { type: j, text: "陟彼岡兮，瞻望兄兮。兄曰：“嗟，予弟！行役夙夜必偕。偕，俱也。上慎旃哉！猶來無死。”兄尚親也。" }
      - { type: j, text: "《陟岵》三章，章六句。" }
      - { type: j, text: "《十畝之間》，刺時也。言其國削小，民無所居焉。○畝，莫後反，古作“晦”，俗作“畝”，皆同。" }
      - { type: z, text: "“《十畝之間》二章，章三句”至“居焉”。○正義曰：經二章，皆言十畝一夫之分，不能百畝，是為削小。無所居，謂土田狹隘，不足耕墾以居生，非謂無居宅也。" }
      - { type: j, text: "十畝之間兮，桑者閒閒兮，閒閒然，男女無別，往來之貌。箋雲：古者一夫百畝，今十畝之間，往來者閒閒然，削小之甚。○間間音閒，本亦作“閒”。別，彼列反。行與子還兮！或行來者，或來還者。○還，本亦作“旋”。" }
      - { type: z, text: "“十畝”至“還兮”。○正義曰：魏地狹隘，一夫不能百畝，今才在十畝之間，採桑者閒閒然，或男或女，共在其間，往來無別也。又敘其往者之辭，乃相謂曰：行與子俱回還兮。雖則異家，得往來俱行，是其削小之甚也。○傳“閒閒”至“之貌”。○正義曰：此言“之間”，則一家之人共採桑於其間，地狹隘無所相避，故言男女無別。閒閒然，為往來之貌。此章既言“之間”，故下章言“之外”。地傍徑路，行非一家，故言“洩洩”為“多人之貌”。○箋“古者”至“之甚”。○正義曰：《王制》雲“制農田百畝”，《地官·遂人》雲“夫一廛田百畝”，《司馬法》曰“畝百為夫”，是一夫百畝也。此言其正法耳。《周禮》：“上地，家百畝；中地，家二百畝，下地，家三百畝。”又云遂上地“有菜五十畝”，其廢易相通，皆二百畝也。《孟子》曰“五畝之宅，樹之以桑”，則野田不樹桑。《漢書·食貨志》雲：“田中不得有樹，用妨五穀。”此十畝之中言有桑者，《孟子》及《漢志》言其大法耳。民之所便，雖田亦樹桑，故上雲“彼汾一方，言採其桑”。古者侵其地而虜其民，此得地狹民稠者，以民有畏寇而內入，故地狹也。一夫百畝，今此十畝，相率十倍，魏雖削小，未必即然，舉十畝以喻其狹隘耳。○傳“或行來者，或來還者”。○正義曰：雲“還兮”，相呼而共歸。下雲“逝兮”，相呼而共往。傳探下章之意，故云“或行來者，或來還者”。見往來相須，故總解之。" }
      - { type: j, text: "十畝之外兮，桑者洩洩兮，洩洩，多人之貌。○洩，以世反。行與子逝兮！箋雲：逝，逮也。○逮，徒賚反，又徒帝反。" }
      - { type: j, text: "《十畝之間》二章，章三句。" }
      - { type: j, text: "《伐檀》，刺貪也。在位貪鄙，無功而受祿，君子不得進仕爾。○檀，徒丹反，木名。" }
      - { type: z, text: "“《伐檀》三章，章九句”至“仕爾”。○正義曰：在位貪鄙者，經三章皆次四句是也。君子不得進仕者，首章三句是也。經、序倒者，序見由在位貪鄙，令君子不得仕，如其次以述之；經先言君子不仕，乃責在位之貪鄙，故章卒二句皆言君子不素飧，以責小人之貪，是終始相結也。此言在位，則刺臣。明是君貪而臣效之，雖責臣，亦所以刺君也。" }
      - { type: j, text: "坎坎伐檀兮，寘之河之幹兮，河水清且漣猗。坎坎，伐檀聲。寘，置也。幹，厓也。風行水成文曰漣。伐檀以俟世用，若俟河水清且漣。箋雲：是謂君子之人不得進仕也。○坎，苦感反。寘，之豉反。漣，力纏反。猗，於宜反，本亦作“漪”，同。不稼不穡，胡取禾三百廛兮？不狩不獵，胡瞻爾庭有縣貆兮？種之曰稼。斂之曰穡。一夫之居曰廛。貆，獸名。箋雲：是謂在位貪鄙，無功而受祿也。冬獵曰狩。宵田曰獵。胡，何也。貉子曰貆。○廛，本亦作“<土釐>”，又作“釐”，直連反。古者一夫田百畝，別受都邑五畝之地居之，故《孟子》雲“五畝之宅”，宅是也。縣音玄，下皆同。貆，本亦作“狟”，音桓，徐、郭音暄，貉子也。宵音消，夜也。貉，戶各反，依字作“貈”。彼君子兮，不素餐兮！素，空也。箋雲：彼君子者，斥伐檀之人，仕有功乃肯受祿。○餐，七丹反，《說文》作“餐”，雲：“或從水。”《字林》雲：“吞食也。”沈音孫。" }
      - { type: z, text: "“坎坎”至“餐兮”。○正義曰：言君子之人不得進仕，坎坎然身自斬伐檀木，置之於河之厓，欲以為輪輻之用。此伐檀之人既不見用，必待明君乃仕，若待河水澄清，且有波漣猗然也。君子不進，由在位貪鄙，故責在位之人云：汝不親稼種，不親斂穡，何為取禾三百夫之田穀兮？不自冬狩，不自夜獵，何為視汝之庭則有所懸者是貆獸兮？汝何為無功而妄受此也？彼伐檀之君子，終不肯而空餐兮，汝何為無功而受祿，使賢者不進也？○傳“坎坎”至“且漣”。○正義曰：以下雲漘、側，則是厓畔之處，故云“幹，厓也”。《易·漸卦》“鴻漸於幹”，注云：“幹謂大水之傍，故停水處。”與此同也。風行吹水而成文章者曰漣。此雲“漣猗”，下雲“直猗”、“淪猗”。漣、直、淪論水波之異，猗皆辭也。《釋水》雲：“河水清且瀾猗。大波為瀾。小波為淪。直波為徑。”李巡雲：“分別水大小曲直之名。”郭璞曰：“瀾言渙瀾也。淪言蘊淪也。徑言徑侹也。”漣、瀾雖異而義同。此詩漣、淪舉波名直，波不言徑而言直者，取韻故也。下二章言“伐輻”、“伐輪”，則此伐檀為車之輪、輻，非待河水之清方始用之。而經於“河干”之下即言“河水清”，故解其意。此人不得進仕，伐檀隱居，以待可仕之世，若待河水清且漣猗然也。河水性濁，清則難待，猶似闇主常多，明君稀出。既雲置檀河厓，因即以河為喻。襄八年《左傳》雲：“俟河之清，人壽幾何？”《易緯》雲：“王者太平嘉瑞之將出，則河水先清。”是河水稀清，故以喻明君稀出也。○傳“種之”至“獸名”。○正義曰：以稼穡相對，皆先稼後穡，故知種之曰稼，斂之曰穡。若散則相通。《大田》雲“曾孫之稼”，非唯種之也。《湯誓》曰“舍我穡事”，非唯斂之也。一夫之居曰廛，謂一夫之田百畝也。《地官·遂人》雲：“夫一廛，田百畝。”司農雲：“廛，居也。”揚子云“有田一廛”，謂百畝之居，與此傳同也。《地官·載師》雲：“巿廛之徵。”鄭司農雲：“廛，巿中空地，未有肆；城中空地，未有宅者也。”玄謂：“廛者，若今雲邑、居、裏矣。廛，民居之區域也。裏，居也。”以廛、裏任國中。而《遂人》授民田，“夫一廛，田百畝”，是廛不謂民之邑居在都城者與？則鄭謂廛為民之邑居，不為一夫之田者，以廛者民居之名。夫田與居宅同名為廛，但《周禮》言“夫一廛”，復言“田百畝”，百畝既是夫田，故以廛為居宅，即《孟子》雲“五畝之宅”是也。以《載師》連巿言之，故準《遂人》以廛為邑居。此言“胡取禾三百廛”，取禾宜於田中，故從傳“一夫之居”，不易之。《釋獸》雲：“貈子，貆。”郭璞曰：“其雌者名。，乃刀反。今江東通呼貉為<豸央><豸吏>。”○箋“是謂”至“曰貆”。○正義曰：《釋天》雲：“冬獵為狩，宵田為獠。”李巡曰：“冬圍守而取禽。”故郭璞曰：“獠，猶燎也，今之夜獵載爐照者也。江東亦呼獵為獠。”《管子》曰：“獠獵畢弋。”是獠為獵之別名。經雲“不狩不獵”，則狩與獵別，故以獵為宵田。此對文耳。散即獵通於晝夜，狩兼於四時，若《周禮》雲“大田獵”，《王制》雲“佐車止則百姓田獵”，不必皆宵田也。《中候》雲“秦伯出狩”，《駟驖》雲“從公於狩”，未必皆冬獵也。《釋天》又云：“火田為狩。”孫炎曰：“放火燒草，守其下風。”是狩非獨冬獵之名也。" }
      - { type: j, text: "坎坎伐輻兮，寘之河之側兮，河水清且直猗。輻，檀輻也。側猶厓也。直，直波也。○輻音福。" }
      - { type: j, text: "不稼不穡，胡取禾三百億兮？不狩不獵，胡瞻爾庭有縣特兮？萬萬曰億。獸三歲曰特。箋雲：十萬曰億。三百億，禾秉之數。彼君子兮，不素食兮！" }
      - { type: z, text: "傳“萬萬”至“曰特”。○正義曰：萬萬曰億，今數然也。傳以時事言之，故今《九章算術》皆以萬萬為億。獸三歲曰特，毛氏當有所據，不知出何書。○箋“十萬”至“之數”。○正義曰：箋以《詩》、《書》古人之言，故合古數言之。知古億十萬者，以田方百里，於今數為九百萬畝，而《王制》雲“方百里，為田九十億畝”，是億為十萬也，故彼注云：“億，今十萬。”是以今曉古也。《楚語》雲：“百姓千品萬官億醜。”皆以數相十，是億十萬也。詩內諸言億者，毛、鄭各從其家，故《楚茨》箋、傳與此同。三百億與三百廛、三百囷相類。若為釜斛之數，則大多不類，故為禾秉之數。秉，把也，謂刈禾之把數。《聘禮》注云“秉謂刈禾盈把”，是也。" }
      - { type: j, text: "坎坎伐輪兮，寘之河之漘兮，河水清且淪猗。檀可以為輪。漘，厓也。小風水成文轉如輪也。○輪音淪，漘，順倫反，本亦作“<辰月>”。淪音倫，《韓詩》雲：“順流而風曰淪。淪，文貌。”不稼不穡，胡取禾三百囷兮？不狩不獵，胡瞻爾庭有縣鶉兮？圓者為囷。鶉，鳥也。○囷，丘淪反，圓倉。鶉音純。" }
      - { type: z, text: "傳“圓者為囷。鶉，鳥”。○正義曰：《月令》“修囷倉”，方者為倉，故圓者為囷。《考工記·匠人》注云“囷，圓倉”，是也。《釋鳥》雲：“鷯，鶉。其雄鶛，牝庳。”李巡曰：“別雄雌異方之言。鶉一名鷯。”郭璞曰：“鶉，鵪之屬也。”" }
      - { type: j, text: "彼君子兮，不素飧兮！熟食曰飧。箋雲：飧讀如魚飧之飧。○飧，素門反，《字林》雲：“水澆飯也。”" }
      - { type: z, text: "傳“熟食曰飧”。○正義曰：傳意以飧為飧饔之飧，客始至之大禮，其食熟致之，故云“熟食曰飧”。《秋官·掌客》雲：“公飧五牢，侯伯飧四牢，子男飧三牢，卿飧二牢，大夫飧一牢，士飧少牢。”注云“公侯伯子男飧皆飪一牢”，則卿大夫亦有飪，故曰為熟食也。○箋“飧讀如魚飧之飧”。○正義曰：宣六年《公羊傳》曰：“晉靈公使勇士將殺趙盾，入其門則無人焉，上其堂則無人焉，俯而窺之，方食魚飧。”是其事也。鄭以為魚飧之飧，則非傳所云熟食也。《說文》雲：“飧，水澆飯也。從夕、食。”言人旦則食飯，飯不可停，故夕則食飧，是飧為飯之別名。易傳者，《鄭志》答張逸雲：“禮，飧饔大多非可素，不得與‘不素餐’相配，故易之也。”" }
      - { type: j, text: "《伐檀》三章，章九句。" }
      - { type: j, text: "《碩鼠》，刺重斂也。國人刺其君重斂，蠶食於民，不修其政，貪而畏人，若大鼠也。○碩音石。斂，呂驗反，下同。" }
      - { type: z, text: "“《碩鼠》三章，章八句”至“大鼠”。○正義曰：蠶食者，蠶之食桑，漸漸以食，使桑盡也。猶君重斂，漸漸以稅，使民囷也。言貪而畏人，若大鼠然，解本以碩鼠為喻之意，取其貪且畏人，故序因倒述其事。經三章，皆上二句言重斂，次二句言不修其政。由君重斂，不修其政，故下四句言將棄君而去也。" }
      - { type: j, text: "碩鼠碩鼠，無食我黍！三歲貫女，莫我肯顧。貫，事也。箋雲：碩，大也。大鼠大鼠者，斥其君也。女無復食我黍，疾其稅斂之多也。我事女三歲矣，曾無教令恩德來眷顧我，又疾其不修政也。古者三年大比，民或於是徙。○貫，古亂反，徐音官。復，扶又反。稅，始銳反。比，毗志反。逝將去女，適彼樂土。箋雲：逝，往也。往矣將去女，與之訣別之辭。樂土，有德之國。○樂音洛，注下同。土如字，他古反，沈徒古反。訣，古穴反。" }
      - { type: j, text: "樂土樂土，爰得我所！箋雲：爰，曰也。" }
      - { type: z, text: "“碩鼠”至“得我所”。○正義曰：國人疾其君重斂畏人，比之碩鼠。言碩鼠碩鼠，無食我黍，猶言國君國君，無重斂我財。君非直重斂於我，又不修其政。我三歲以來事汝矣，曾無於我之處肯以教令恩德眷顧我也。君既如是，與之訣別，言往矣將去汝之彼樂土有德之國。我所以之彼樂土者，以此樂土，若往則曰得我所宜故也。言往將去汝者，謂我往之他國，將去汝國也。○傳“貫，事”。○正義曰：《釋詁》文。○箋“碩大”至“是徙”。○正義曰：“碩，大”，《釋詁》文。《釋獸》於鼠屬有鼫鼠，孫炎曰：“五技鼠。”郭璞曰：“大鼠，頭似兔，尾有毛青黃色，好在田中食粟豆，關西呼鼩音瞿鼠。”舍人、樊光同引此詩，以碩鼠為彼五技之鼠也。許慎雲：“碩鼠五技，能飛不能上屋，能游不能渡谷，能綠不能窮木，能走不能先人，能穴不能覆身，此之謂五技。”陸機《疏》雲：“今河東有大鼠，能人立，交前兩腳於頸上跳舞，善鳴，食人禾苗。人逐則走入樹空中。亦有五技，或謂之雀鼠，其形大，故序雲‘大鼠也’。魏國，今河北縣是也。言其方物，宜謂此鼠非鼫鼠也。”按此經作“碩鼠”，訓之為大，不作“鼫鼠”之字，其義或如陸言也。序雲“貪而畏人，若大鼠然”，故知大鼠為斥君，亦是興喻之義也。箋又以此民居魏，蓋應久矣。正言“三歲貫汝”者，以古者三歲大比，民或於是遷徙，故以三歲言之。《地官·小司徒》及《鄉大夫職》皆雲三年則大比。言比者，謂大校，比其民之數而定其版籍，明於此時民或得徙。《地官·比長職》曰：“徙於國中及郊，則從而授之。”注云：徙謂不便其居也。或國中之民出徙郊，或郊民入徙國中，皆從而付所處之吏。是大比之際，民得徙矣。" }
      - { type: j, text: "碩鼠碩鼠，無食我麥！三歲貫女，莫我肯德。箋雲：不肯施德於我逝將去女，適彼樂國。樂國樂國，爰得我直！直，得其直道。箋雲：直猶正也。" }
      - { type: j, text: "碩鼠碩鼠，無食我苗！苗，嘉穀也。" }
      - { type: z, text: "傳“苗，嘉穀”。○正義曰：黍麥指穀實言之，是鼠之所食。苗之莖葉，以非鼠能食之，故云“嘉穀”，謂穀實也。穀生於苗，故言苗以韻句。三歲貫女，莫我肯勞。箋雲：不肯勞來我。○勞，如字，又力報反，注同。徠，本亦作“來”，同力代反。逝將去女，適彼樂郊。箋雲：郭外曰郊。" }
      - { type: j, text: "樂郊樂郊，誰之永號！號，呼也。箋雲：之，往也。永，歌也。樂郊之地，誰獨當往而歌號者。言皆喜說無憂苦。○詠，本亦作“永”，同音詠。號，戶毛反，注同。呼，火故反。說音悅。" }
      - { type: z, text: "“誰之永號”。○正義曰：言彼有德之樂郊，誰往而獨長歌號呼？言往釋皆歌號，喜樂得所，故我欲往也。箋“之，往。永，歌”。○正義曰：“之，往”，《釋詁》文。永是長之訓也，以永號共文，傳雲“號，呼”，是歌之呼，《樂記》及《關雎》皆雲“永歌之”，《舜典》雲“聲依永”，故以永為歌，歌必長言必故也。" }
      - { type: j, text: "《碩鼠》三章，章八句。" }
      - { type: j, text: "魏國七篇，十八章，百二十八句。" }
      - { type: j, text: "《毛詩正義》" }
