# 周易正義卷二（孔穎達疏）：j 為經文＋王弼注，z 為正義疏文。
sections:
  - id: juan二
    name: 卷二
    blocks:
      - { type: j, text: "乾下坎上。需：有孚，光亨貞吉，利涉大川。" }
      - { type: z, text: "正義曰：“此需卦系辭也。“需”者，待也。物初蒙稚，待養而成，無信即不立，所待唯信也，故云“需有孚”，言《需》之為體，唯有信也。“光亨貞吉”者，若能有信，即需道光明物得亨通，於正則吉，故云“光亨貞吉”也。“利涉大川”者，以剛健而進，即不患於險，乾德乃亨，故云“利涉大川”。" }
      - { type: j, text: "《彖》曰：需，須也，險在前也。剛健而不陷，其義不困窮矣。“需有孚，光亨貞吉”，位乎天位，以正中也。謂五也，位乎天位，用其中正，以此待物，需道畢矣，故“光亨貞吉”。" }
      - { type: z, text: "“彖曰需須也”至“以正中也”。○正義曰：此釋需卦系辭。需，須也。“險在前”者，釋需卦之名也，是需待之義，故云“需，須也”。“險在前”，釋所以需待由險難在前，故有待乃進也。“剛健而不陷，其義不困窮矣”者，解需道所以得亨，由乾之剛健，前雖遇險而不被陷滯，是其需待之義，不有困窮矣，故得“光亨貞吉”，由乾之德也。“需有孚，光亨貞吉，位乎天位以正中”者，此疊出需卦系辭，然後釋之也。言此需體非但得乾之剛彊而不陷，又由中正之力也。以九五居乎天子之位，又以陽居陽，正而得中，故能有信，光明亨通而貞吉也。剛健而不陷，只由二象之德，位乎天位以正中，是九五之德也。凡卦之為體，或直取象而為卦德者，或直取爻而為卦德者，或以兼象兼爻而為卦德者，此卦之例是也。○注“謂五也”至”光亨貞吉“。○正義曰：“需道畢矣”者，凡需待之義先須於信，後乃光明亨通於物而貞吉，能備此事，是須道終畢。五即居於天位，以陽居尊，中則不偏，正則無邪。以此待物，則所為皆成，故“需道畢矣”。" }
      - { type: j, text: "利涉大川，往有功也。乾德獲進，往輒亨也。" }
      - { type: z, text: "“利涉大川往有功也”。○正義曰：釋“利涉大川”之義，以乾剛健，故行險有功也。○注“乾德”至“亨也”。○正義曰：前云“剛健而不陷”，此云“往有功”，剛健即“乾”也。故“乾”德獲進，往而有功，即是往輒亨通也。此雖釋“利涉大川”，兼釋上“光亨”之義，由是“光亨”乃得“利涉大川”，故於利涉大川乃明亨也。" }
      - { type: j, text: "《象》曰：云上於天，需，君子以飲食宴樂。童蒙已發，盛德光亨，飲食宴樂，其在茲乎！" }
      - { type: z, text: "“《象》曰”至“飲食宴樂”。○正義曰：坎既為險，又為雨，今不言險雨者，此象不取險難之義也。故不云“險”也。雨是巳下之物，不是須待之義，故不云“雨”也。不言天上有云，而言“云上於天”者，若是天上有云，無以見欲雨之義，故云“云上於天”。若言“云上於天”，是天之欲雨，待時而落，所以明“需”大惠將施而盛德又亨，故君子於此之時“以飲食宴樂”。" }
      - { type: j, text: "初九：需於郊，利用恆，無咎。居需之時，最遠於難，能抑其進以遠險待時，雖不應幾，可以保常也。" }
      - { type: z, text: "正義曰：但難在於坎，初九去難既遠，故待時在於郊。郊者是境上之地，亦去水遠也。“利用恆，無咎”者，恆，常也，遠難待時以避其害，故宜利保守其常，所以無咎，猶不能見幾速進，但得無咎而已。" }
      - { type: j, text: "《象》曰：“需於郊”，不犯難行也。“利用恆無咎”，未失常也。" }
      - { type: z, text: "正義曰：“不犯難行”者，去難既遠，故不犯難而行，“未失常”者，不敢速進，遠難待時，是未失常也。" }
      - { type: j, text: "九二：需於沙，小有言，終吉。將近於難，故曰“需於沙”也。不至致寇，故曰“小有言”也。近不逼難，遠不後時，履健居中，以待其會，雖“小有言”，以吉終也。" }
      - { type: z, text: "正義曰：沙是水傍之地，去水漸近，待時於沙，故難稍近。雖未致寇，而“小有言”以相責讓。“近不逼難，遠不後時”，但“履健居中，以待要會”，雖小有責讓之言，而終得其吉也。" }
      - { type: j, text: "《象》曰：“需於沙”，衍在中也。雖“小有言”，以終吉也。" }
      - { type: z, text: "正義曰：“需於沙衍在中”者，衍謂寬衍，去難雖近，猶未逼於難，而寬衍在其中也，故“雖小有言，以吉終也”。" }
      - { type: j, text: "九三：需於泥，致寇至。以剛逼難，欲進其道，所以招寇而致敵也。猶有須焉，不陷其剛。寇之來也，自我所招，敬慎防備，可以不敗。" }
      - { type: z, text: "正義曰：泥者，水傍之地，泥溺之處，逼近於難，欲進其道，難必害已。故致寇至，猶且遲疑而需待時，雖即有寇至，亦未為禍敗也。" }
      - { type: j, text: "《象》曰：“需於泥”，災在外也。白我致寇，敬慎不敗也。" }
      - { type: z, text: "正義曰：“災在外”者，釋“需於泥”之義，言為“需”雖復在泥，泥猶居水之外，即災在身外之義，未陷其剛之義，故可用“需”以免。“自我致寇，敬慎不敗”者，自，由也，由我欲進而致寇來，已若敬慎，則不有禍敗也。" }
      - { type: j, text: "六四：需於血，出自穴。凡稱血者，陰陽相傷者也。陰陽相近而不相得，陽欲進而陰塞之，則相害也。穴者，陰之路也，處坎之始，居穴者也。九三剛進，四不能距，見侵則闢，順以聽命者也，故曰“需於血，出自穴”也。" }
      - { type: z, text: "“六四需於血出自穴”。○正義曰：“需於血”者，謂陰陽相傷，故有血也。九三之陽而欲上進，此六四之陰而塞其路，兩相妨害，故稱“血”。言待時於血，猶待時於難中也。“出自穴”者，穴即陰之路也，而處坎之始，是居穴者也。三來逼己，四不能距，故出此所居之穴以避之，但順以聽命而得免咎也，故《象》云“需於血，順以聽命”也。○注“凡稱血者”至“出自穴也”。○正義曰：“凡稱血”者，陰陽相傷者也，即坤之上六“其血玄黃”是也。“穴者陰之路也”者，凡孔穴穿道，皆是幽隱，故云“陰之路也”。“處坎之始，居穴”者，坎是坎險，若處坎之上，即是出穴者也，處坎之始，是居穴者也。但易含萬象，此六四一爻，若以戰鬥言之，其出則為血也；若以居處言之，其處則為穴也。穴之與血，各隨事義也。" }
      - { type: j, text: "《象》曰：“需於血”，順以聽也。" }
      - { type: j, text: "九五：需於酒食，貞吉。“需”之所須，以待達也。已得天位，暢其中正，無所復須，故酒食而已獲“貞吉”也。" }
      - { type: z, text: "正義曰：“需於酒食貞吉”者，五既為需之主，已得天位，無所復需，但以需待酒食以遞相宴樂而得貞吉。" }
      - { type: j, text: "《象》曰：“酒食貞吉”，以中正也。" }
      - { type: z, text: "正義曰：釋“酒食貞吉”之義，言九五居中得正，“需”道亨通，上下無事也。" }
      - { type: j, text: "上六：入於穴，有不速之客三人來，敬之，終吉。六四所以“出自穴”者，以不與三相得而塞其路，不闢則害，故不得不“出自穴”而闢之也。至於上六，處卦之終，非塞路者也。與三為應，三來之已，乃為己援，故無畏害之闢，而乃有入穴之固也。三陽所以不敢進者，須難之終也。難終則至，不待召也。己居難終，故自來也。處無位之地，以一陰而為三陽之主，故必敬之而後終吉。" }
      - { type: z, text: "“上六”至“敬之終吉”。○正義曰：“上六入於穴”者，上六陰爻，故亦稱“穴”也。上六與三相應，三來之已，不為禍害，乃得為已援助，故上六無所畏忌，乃“入於穴”而居也。“有不速之客三人來”者，速，召也，不須召喚之客有三人自來。三人謂“初九”、“九二”、“九三”。此三陽務欲前進，但畏於險難，不能前進。其難既通，三陽務欲上升，不須召喚而自來，故云“有不速之客三人來”也。“敬之終吉”者，上六居無位之地，以一陰而為三陽之主，不可怠慢，故須恭敬此三陽，乃得終吉。" }
      - { type: j, text: "《象》曰：不速之客來，“敬之終吉”，雖不當位，未大失也。處無位之地，不當位者也。敬之則得終吉，故雖不當位，未大失也。" }
      - { type: z, text: "正義曰：“雖不當位未大失”者，釋“敬之終吉”之義。言已雖不當位，而以一陰為三陽之主，若不敬之，則有兇害。今由己能敬之，雖不當位，亦未有大失，言初時雖有小失，終久乃獲吉，故云“未大失”也。且《需》之一卦，須待難通，其於六爻，皆假他物之象以明人事，待通而亨，須待之義。且凡人萬事，或有去難遠近，須出須處，法此六爻，即萬事盡矣，不可皆以人事曲細比之。《易》之諸爻之例，並皆放此。" }
      - { type: j, text: "坎下乾上。訟：有孚，窒惕，中吉，窒謂窒塞也。皆惕，然後可以獲中吉。" }
      - { type: z, text: "正義曰：窒，塞也。惕，懼也。凡訟者，物有不和，情相乖爭而致其訟。凡訟之體，不可妄興，必有信實，被物止塞，而能惕懼，中道而止，乃得吉也。" }
      - { type: j, text: "終兇。利見大人，不利涉大川。" }
      - { type: z, text: "正義曰：“終兇”者，訟不可長，若終竟訟事，雖復窒惕，亦有兇也。“利見大人”者，物既有訟，須大人決之，故“利見大人”也。“不利涉大川”者，以訟不可長，若以訟而往涉危難，必有禍患，故“不利涉大川”。" }
      - { type: j, text: "《彖》曰：訟，上剛下險，險而健，訟。“訟有孚，窒惕中吉”，剛來而得中也。“終兇”，訟不可成也。“利見大人”，尚中正也。“不利涉大川”，入於淵也。凡不和而訟，無施而可，涉難特甚焉。唯有信而見塞懼者，乃可以得吉也。猶復不可終，中乃吉也。不閉其源使訟不至，雖每不枉而訟至終竟，此亦兇矣。故雖復有信，而見塞懼猶，不可以為終也。故曰“訟有孚，窒惕中吉，終兇”也。無善聽者，雖有其實，何由得明？而令有信塞懼者得其“中吉”，必有善聽之主焉，其在二乎？以剛而來正夫群小，斷不失中，應斯任也。" }
      - { type: z, text: "“《彖》曰訟上剛下險”至“入於淵也”。正義曰：此釋繇辭之義。“訟，上剛下險，險而健，訟”者，上剛即乾也，下險即坎也，猶人意懷險惡，性又剛健，所以訟也。此二句因卦之象以顯有訟之所由。案：上“需”，須也，以釋卦之名。此《訟卦》不釋“訟”名者，“訟”義可知，故不釋也。諸卦其名難者則釋之，其名易者則不釋之，他皆仿此。“訟有孚，窒惕中吉，剛來而得中”者，先疊出訟之繇辭，以“剛來而得中”者，釋所以訟得其“有孚，窒惕中吉”者，言中九二之剛，來向下體而處下卦之中，為訟之主，而聽斷獄訟，故訟者得其“有孚，窒惕中吉”也。“終兇，訟不可成”者，釋“終兇”之義，以爭訟之事，不可使成，故“終兇”也。“利見大人，尚中正”者，釋“利見大人”之義。所以於訟之時，利見此大人者，以時方鬥爭，貴尚居中得正之主而聽斷之。“不利涉大川，入於淵”者，釋“不利涉大川”之義。若以訟事往涉於川，即必墜於深淵而陷於難也。○注“凡不和而訟”至“應斯任也”。○正義曰：“無施而可”者，言若性好不和，又與人鬥訟，即無處施設而可也。言所往之處皆不可也。“涉難特甚焉”者，言好訟之人，習常施為，己且不可，若更以訟涉難，其不可特甚焉，故云“涉難特甚焉”。“中乃吉”者，謂此訟事以中途而止，乃得吉也。前注云“可以獲中吉”。謂獲中止之吉。“不閉其源，使訟不至”者，若能謙虛退讓，與物不競，即此是閉塞訟之根源，使訟不至也。今不能如此，是不閉塞訟源，使訟得至也。“雖每不枉而訟至終竟”者，謂雖每訴訟陳其道理，不有枉曲，而訟至終竟，此亦兇矣。" }
      - { type: j, text: "《象》曰：天與水違行，訟。君子以作事謀始。“聽訟，吾猶人也。必也使無訟乎？”無訟在於謀始，謀始在於作制。契之不明，訟之所以生也。物有其分，職不相濫，爭何由興？訟之所以起，契之過也。故有德司契而不責於人。" }
      - { type: z, text: "“天與水違行訟”至“作事謀始”。○正義曰：天道西轉，水流東注，是天與水相違而行，相違而行，象人彼此兩相乖戾，故致訟也。不云“水與天違行”者，凡訟之所起，必剛健在先，以為訟始，故云“天與水違行”也。“君子以作事謀始”者，物既有訟，言君子當防此訟源。凡欲興作其事，先須謀慮其始。若初始分職分明，不相干涉，即終無所訟也。○注“聽訟”至“不責於人”。○正義曰：“訟之所以起，契之過”者，凡鬥訟之起，只由初時契要之過，謂作契要不分明。“有德司契”者，言上之有德司主契要，而能使分明以斷於下，亦不須責在下之人有爭訟也。“有德司契”之文，出《老子》經也。" }
      - { type: j, text: "初六：不永所事，小有言，終吉。處訟之始，訟不可終，故“不永所事”，然後乃吉。凡陽唱而陰和，陰非先唱者也。四召而應，見犯乃訟。處訟之始，不為訟先，雖不能不訟，而了訟必辯明矣。" }
      - { type: z, text: "“初六”至“小有言終吉”。○正義曰：“不永所事”者，永，長也，不可長久為鬥訟之事，以“訟不可終”也。“小有言，終吉”者，言“終吉”者，言初六應於九四。然九四剛陽，先來非理犯己，初六陰柔，見犯乃訟，雖不能不訟，是不獲己而訟也，故“小有言”；以處訟之始，不為訟先，故“終吉”。○注“處訟之始”至“必辯明也”。○正義曰：“處訟之始”者，始入訟境，言訟事尚微，故云“處訟之始”也。“不為訟先”者，言己是陰柔，待唱乃和，故云“不為訟先也”。" }
      - { type: j, text: "《象》曰：“不永所事”，訟不可長也。雖“小有言”，其辯明也。" }
      - { type: z, text: "正義曰：“訟不可長”者，釋“不永所事”，以訟不可長，故不長此鬥爭之事。“其辯明”者，釋“小有言”，以訟必辯析分明。四雖初時犯己，己能辯訟，道理分明，故初時“小有言”也。" }
      - { type: j, text: "九二：不克訟，歸而逋其邑。人三百戶，無眚。以剛處訟，不能下物，自下訟上，宜其不克。若能以懼歸竄其邑，乃可以免災。邑過三百，非為竄也。竄而據強，災未免也。" }
      - { type: z, text: "“九二”至“三百戶無眚”。○正義曰：“不克訟”者，克，勝也；以剛處訟，不能下物，自下訟上，與五相敵，不勝其訟，言訟不得勝也。“歸而逋其邑”者，訟既不勝，怖懼還歸，逋竄其邑。若其邑強大，則大都偶國，非逋竄之道。“人三百戶，無眚”者，若其邑狹少，唯三百戶乃可也。“三百戶”者，鄭注《禮記》云：“小國下大夫之制。”又鄭注《周禮·小司徒》云：方十里為成，九百夫之地，溝渠、城郭、道路三分去其一，餘六百夫。又以田有不易，有一易，有再易，定受田三百家。即此“三百戶”者，一成之地也。鄭注云：不易之田，歲種之；一易之田，休一歲乃種；再易之地，休二歲乃種。言至薄也。苟自藏隱，不敢與五相敵，則無眚災。○注“以剛處訟”至“災未免也”。○正義曰：“若能以懼歸竄其邑，乃可免災”者，如此注意，則經稱“其邑”二字連上為句，“人三百戶”合下為句。" }
      - { type: j, text: "《象》曰：“不克訟”，歸逋竄也。自下訟上，患至掇也。" }
      - { type: z, text: "正義曰：“歸逋竄”者，釋歸而逋邑，以訟之不勝，故退歸逋竄也。“患至掇”者，掇猶拾掇也。自下訟上，悖逆之道，故禍患來至，若手自拾掇其物，言患必來也。故王肅云：“若手拾掇物然。”" }
      - { type: j, text: "六三：食舊德，貞厲，終吉。或從王事無成。體夫柔弱以順於上，不為九二自下訟上，不見侵奪，保全其有，故得食其舊德而不失也。居爭訟之時，處兩剛之閒，而皆近不相得，故曰“貞厲”。柔體不爭，系應在上，眾莫能傾，故曰“終吉”。上壯爭勝，難可忤也，故或從王事，不敢成也。" }
      - { type: z, text: "“六三，食舊德”至“王事無成”。正義曰：“食舊德”者，六三以陰柔順從上九，不為上九侵奪，故保全己之所有，故食其舊日之德祿位。“貞厲”者，貞，正也；厲，危也。居爭訟之時，處兩剛之閒，故須貞正自危厲，故曰“貞厲”。然六三柔體不爭，系應在上，眾莫能傾，故“終吉”也。“或從王事無成”者，三應於上，上則壯而又勝，故六三或從上九之王事，不敢觸忤，無敢先成，故云“無成”。" }
      - { type: j, text: "《象》曰：“食舊德”，從上吉也。" }
      - { type: z, text: "正義曰：“從上吉”者，釋所以食舊德以順從上九，故得其吉食舊德也。" }
      - { type: j, text: "九四：不克訟。初辯明也。" }
      - { type: z, text: "正義曰：九四既非理陵犯於初，初能分辯道理，故九四訟不勝也。" }
      - { type: j, text: "復即命渝，安貞吉。處上訟下，可以改變者也，故其咎不大。若能反從本理，變前之命，安貞不犯，不失其道，“為仁猶已”，故吉從之。" }
      - { type: z, text: "“復即命渝安貞吉”。○正義曰：“復即命渝”者，復，反也；即，就也。九四訟既不勝，若能反就本理，變前與初爭訟之命，能自渝變休息，不與初訟，故云“復即命渝”。“安貞吉”者，既能反從本理，渝變往前爭訟之命，即得安居貞吉。○注“處上訟下”至“故吉從之”。○正義曰：“若能反從本理”者，釋“復即”之義。復，反也；即，從也。本理謂原本不與初訟之理。當反從此原本不爭之理，故云“反從本理”。“變前之命”者，解“命渝”也。渝，變也。但倒經“渝”字在“命”上，故云“變前之命”。“前命”者，謂往前共初相訟之命也，今乃變之也。“安貞不犯”者，謂四安居貞正，不復犯初，故云“安貞不犯”。“為仁由己，故吉從之”者，“為仁由己”，《論語》文。初不犯己，己莫陵於初，是為仁義之道，自由於己，故云“為仁由己”。" }
      - { type: j, text: "《象》曰：“復即命渝”，安貞不失也。" }
      - { type: z, text: "正義曰：“安貞不失”者，釋“復即命渝”之義，以其反理變命，故得安貞之吉，不失其道。" }
      - { type: j, text: "九五：訟元吉。處得尊位，為訟之主，用其中正以斷枉直，中則不過，正則不邪，剛無所溺，公無所偏，故訟“元吉”。" }
      - { type: z, text: "“九五訟元吉”。○正義曰：處得尊位，中而且正，以斷獄訟，故得“元吉”也。○注“處得尊位”至“故訟元吉”。○正義曰：“處得尊位為訟之主”者，居九五之位，當爭訟之時，是主斷獄訟者也。然此卦之內，斷獄訟之人，凡有二主。案上注云“善聽之主，其在二乎”？是二為主也。此注又云“為訟之主，用其中正以斷枉直”，是五又為主也。一卦兩主者，凡諸卦之內，如此者多矣。五是其卦尊位之主，餘爻是其卦為義之主，猶若復卦初九是復卦之主，“復”義在於初九也。六五亦居復之尊位，為復卦尊位之主，如此之例，非一卦也。所以然者，五居尊位，猶若天子總統萬機，與萬物為主，故諸卦皆五居尊位。諸爻則偏主一事，猶若六卿春官主禮，秋官主刑之類偏主一事，則其餘諸爻各主一事也。即六卿總歸於天子，諸卦之爻，皆以九五為尊位也。若卦由五位，五又居尊，正為一主也，若比之九五之類是也。今此訟卦二既為主，五又為主，皆有斷獄之德，其五與二爻，其義同然也，故俱以為主也。案：上《彖》辭“剛來而得中”，今九五《象》辭云“訟元吉，以中正”也，知《彖》辭“剛來得中”，非據九五也。輔嗣必以為九二者，凡上下二象在於下象者，則稱“來”。故《賁卦》云“柔來而文剛”，是離下艮上而稱“柔來”。今此云“剛來而得中”，故知九二也。且凡云“來”者，皆據異類而來。九二在二陰之中故稱“來”；九五在外卦，又三爻俱陽，不得稱“來”。若於爻辭之中，亦有從下卦向上卦稱“來”也。故需上六“有不速之客三人來”，謂下卦三陽來。然需上六陰爻，陽來詣之，亦是往非類而稱“來”也。“以斷枉直”者，枉，曲也。凡二人來訟，必一曲一直，此九五聽訟能斷定曲直者，故云“以斷枉直”。" }
      - { type: j, text: "《象》曰：“訟元吉”，以中正也。" }
      - { type: z, text: "正義曰：“以中正也”者，釋“元吉”之義。所以訟得大吉者，以九五處中而得正位，中則不有過差，正則不有邪曲，中正為德，故“元吉”。" }
      - { type: j, text: "上九：或錫之鞶帶，終朝三褫之。處訟之極，以剛居上，訟而得勝者也。以訟受錫，榮何可保？故終朝之閒，褫帶者三也。" }
      - { type: z, text: "正義曰：“或錫之鞶帶”者，上九以剛居上，是訟而得勝者也。若以謙讓蒙錫，則可長保有。若因訟而得勝，雖或錫與鞶帶，不可長久，終一朝之閒三被褫脫，故云“終朝三褫之”。" }
      - { type: j, text: "《象》曰：以訟受服，亦不足敬也。" }
      - { type: z, text: "正義曰：“釋終朝三褫”之義。以其因訟得勝，受此錫服，非德而受，亦不足可敬，故終朝之間，三被褫脫也。凡言“或”者，或之言“有”也。言或有如此，故言“或”。則上云“或從王事無成”，及《坤》之六三“或從王事無成”之類是也。鞶帶謂大帶也。故杜元凱桓二年《傳》“鞶厲旒纓”注云：“盤，大帶也。”此訟一卦及爻辭並以人事明之，唯“不利涉大川”，假外物之象以喻人事。" }
      - { type: j, text: "坎下坤上。師：貞，丈人吉，無咎。丈人，嚴莊之稱也。為師之正，丈人乃吉也。興役動眾無功，罪也，故吉乃無咎也。" }
      - { type: z, text: "“師：貞，丈人吉，無咎”。○正義曰：“師”，眾也。貞，正也。丈人謂嚴莊尊重之人，言為師之正，唯得嚴莊丈人監臨主領，乃得“吉無咎”。若不得丈人監臨之，無不畏懼，不能齊眾，必有咎害。○注“丈人嚴戒之稱也”至“乃無咎也”。○正義曰：“興役動眾無功，罪”者，監臨師旅，當以威嚴，則有功勞，乃得無咎；若其不以威嚴，師必無功而獲其罪，故云“興役動眾無功，罪”也。" }
      - { type: j, text: "《彖》曰：師，眾也。貞，正也。能以眾正，可以王矣。剛中而應，行險而順，以此毒天下而民從之，吉又何咎矣？毒猶役也。" }
      - { type: z, text: "“彖曰”至“又何咎矣”。○正義曰：“師，眾也。貞，正也。能以眾正，可以王矣”者，此釋師卦之名，並明用師有功之義。但師訓既多，或訓為法，或訓為長，恐此師名取法之與長，故特明之師訓為眾也。貞為正也。貞之為正，其義已見於此，復云““貞，正”者，欲見齊眾必須以正，故訓貞為正也。與下文為首引之勢，故云“能以眾正，可以王矣”。“剛中而應”者，“剛中”謂九二，而“應”謂六五。“行險而順”者，“行險”謂下體坎也，而“順”謂上體坤也。若剛中而無應，或有應而不剛中，或行險而不柔順，皆不可行師得吉也。“以此毒天下而民從之，吉又何咎矣”者，毒猶役也，若用此諸德使役天下之眾，人必從之以得其吉，又何無功而咎責乎？自“剛中”以下釋“丈人吉，無咎”也，言丈人能備此諸德也。" }
      - { type: j, text: "《象》曰：地中有水，師。君子以容民畜眾。" }
      - { type: z, text: "正義曰：“君子以容民畜眾”者，言君子法此師卦，容納其民，畜養其眾。若為人除害，使眾得寧，此則“容民畜眾”也。又為師之，主雖尚威嚴，當赦其小過，不可純用威猛於軍師之中，亦是容民畜眾之義。所以《象》稱“地中有水”，欲見地能包水，水又眾大，是容民畜眾之象。若其不然，或當云“地在水上”，或云“上地下水”，或云“水上有地”。今云“地中有水”，蓋取容、畜之義也。" }
      - { type: j, text: "初六：師出以律，否臧兇。為師之始，齊師者也。齊眾以律，失律則散。故師出以律，律不可失。失律而臧，何異於否？失令有功，法所不赦。故師出不以律，否臧皆兇。" }
      - { type: z, text: "“初六師出”至“否臧兇”。○正義曰：“初六師出以律”者，律，法也。初六為師之始，是整齊師眾者也。既齊整師眾，使師出之時，當須以其法制整齊之，故云“師出以律”也。“否臧兇”者，若其失律行師，無問否之與臧，皆為兇也。“否”謂破敗，“臧”謂有功。然“否”為破敗，即是兇也。何須更云“否臧兇”者，本意所明，雖臧亦兇。“臧”文既單，故以“否”配之，欲盛言臧兇，不可單言，故云否之與臧，皆為兇也。○注“為師之始”至“否臧皆兇”。○正義曰：“為師之始，齊師者也”者，以師之初爻，故云“為師之始”。在師之首，先唱發始，是齊整師眾者也。“失律而臧，何異於否”者，若棄失法律，不奉法而行，雖有功而臧，何異於否也？“失令有功，法所不赦”者，解“何異於否”之義。令則法律也。若失此法令，雖有功勞，軍法所不容赦，故云“何異於否”。然閫外之事，將軍所載，臨事制宜，不必皆依君命，何得有功“法所不赦”者：凡為師之體，理非一端，量事制宜，隨時進退，此則將軍所制，隨時施行。若苟順私情，故違君命，犯律觸法，則事不可赦耳。" }
      - { type: j, text: "《象》曰：“師出以律”，失律兇也。" }
      - { type: z, text: "正義曰“失律兇”者，釋“師出以律”之義。言所以必須以律者，以其失律則兇。反經之文，以明經義。" }
      - { type: j, text: "九二：在師中，吉，無咎，王三錫命。以剛居中，而應於上，在師而得其中者也。承上之寵，為師之主，任大役重，無功則兇，故吉乃無咎也。行師得吉，莫善懷邦，邦懷眾服，錫莫重焉，故乃得成命。" }
      - { type: z, text: "“九二”至“王三錫命”。○正義曰：“在師中吉”者，以剛居中而應於五，是“在師中吉”也。“無咎”者，承上之寵，為師之主，任大役重，無功則兇，故吉乃無咎。“王三錫命”者，以其有功，故王三加錫命。○注“以剛居中”至“故乃得成命”。○正義曰：“在師而得中”者，觀注之意，以“在師中”為句，其“吉”字屬下；觀《象》之文，“在師中吉，承天寵”者，則似“吉”字屬上。此“吉”之一字上下兼該，故註文屬下，《象》文屬上，但《象》略其“無咎”之字，故“吉”屬“師中”也。“故乃得成命”者，案《曲禮》云：“三賜不及車馬。”一命受爵，再命受服，三命受車馬。三賜三命，而尊之得成，故“乃得成命”也。" }
      - { type: j, text: "《象》曰：“在師中吉”，承天寵也。“王三錫命”，懷萬邦也。" }
      - { type: z, text: "正義曰：“承天寵”者，釋“在師中吉”之義也。正謂承受五之恩寵，故“中吉”也。“懷萬邦也”者，以其有功，能招懷萬邦，故被“王三錫命”也。" }
      - { type: j, text: "六三：師或輿尸，兇。以陰處陽，以柔乘剛，進則無應，退無所守，以此用師，宜獲“輿尸”之兇。" }
      - { type: z, text: "“六三師或輿尸兇”。○正義曰：以陰處陽，以柔乘剛，進無所應，退無所守，以此用師，或有輿尸之兇。○注“以陰處陽”至“輿尸之兇”。○正義曰：“退無所守”者，倒退而下，乘二之剛，已又以陰居陽，是“退無所守”。" }
      - { type: j, text: "《象》曰：“師或輿尸”，大無功也。" }
      - { type: z, text: "正義曰：“大無功也”者，釋“輿尸”之義，以其輿尸，則大無功也。" }
      - { type: j, text: "六四：師左次，無咎。得位而無應，無應不可以行，得位則可以處，故左次之，而無咎也。行師之法，欲右背高，故左次之。" }
      - { type: z, text: "“六四，師左次，無咎”。○正義曰：六四得位而無應，無應不可以行，得位則可以處，故云“師左次，無咎”。故師在高險之左，以次止則無兇咎也。○注“行師之法”至“故左次之”。○正義曰：“行師之法，欲右背高”者，此兵法也。故《漢書》韓信云：“兵法欲右背山陵，前左水澤。”" }
      - { type: j, text: "《象》曰：“左次無咎”，未失常也。雖不能有獲，足以不失其常也。" }
      - { type: z, text: "正義曰：“未失常”者，釋“無咎”之義，以其雖未有功，未失常道。" }
      - { type: j, text: "六五：田有禽，利執言，無咎。長子帥師，弟子輿尸，貞兇。處師之時，柔得尊位，陰不先唱，柔不犯物，犯而後應，往必得直，故“田有禽”也。物先犯己，故可以執言而無咎也。柔非軍帥，陰非剛武，故不躬行，必以授也。授不得王，則眾不從，故“長子帥師”可也。弟子之兇，故其宜也。" }
      - { type: z, text: "“六五田有禽”至“輿尸貞兇”。○正義曰：“田有禽，利執言”者，柔得尊位，陰不先唱，柔不犯物，犯而後應，往必得直，故往即有功。猶如田中有禽而來犯苗，若往獵之，則無咎過也。人之修田，非禽之所犯。王者守國，非叛者所亂。禽之犯苗，則可獵取。叛人亂國，則可誅之。此假他象以喻人事，故“利執言，無咎”，已不直則有咎。己今得直，故可以執此言往問之而無咎也。“長子帥師，弟子輿尸，貞兇”者，以已是柔，不可為軍帥。已又是陰，身非剛武，不可以親行，故須役任長子、弟子之等。若任役長子，則可以帥師。若任用弟子，則軍必破敗而輿尸，是為正之兇。莊氏云：“‘長子’謂九二，德長於人。‘弟子’謂六三，德劣於物。”今案：《象》辭云“長子帥師，以中行也”，是九二居中也。“弟子輿尸，使不當也”，謂六三失位也。○注至“往必得直”。○正義曰：“往必得直”者，見犯乃得欲往徵之，則於理正直，故云“往必得直”。" }
      - { type: j, text: "《象》曰：“長子帥師”，以中行也。“弟子輿尸”，使不當也。" }
      - { type: j, text: "上六：大君有命，開國承家，小人勿用。處師之極，師之終也。大君之命，不失功也。開國承家，以寧邦也。小人勿用，非其道也。" }
      - { type: z, text: "“上六大君有命”至“小人勿用”。○正義曰：“大君有命”者，上六處師之極，是師之終竟也。“大君”謂天子也，言天子爵命此上六，若其功大，使之開國為諸侯；若其功小，使之承家為卿大夫。“小人勿用”者，言開國承家，須用君子，勿用小人也。" }
      - { type: j, text: "《象》曰：“大君有命”，以正功也。“小人勿用”，必亂邦也。" }
      - { type: z, text: "正義曰：“大君有命，以正功也”者，正此上六之功也。“小人勿用，必亂邦也”者，若用小人，必亂邦國，故不得用小人也。" }
      - { type: j, text: "坤下坎上。比：吉，原筮，元永貞，無咎。不寧方來，後夫兇。" }
      - { type: z, text: "正義曰：“比吉”者，謂能相親比而得具吉。“原筮，元永貞，無咎”者，欲相親比，必能原窮其情，筮決其意，唯有元大永長貞正，乃得無咎。“元永貞”者，謂兩相親比，皆須“永貞”。“不寧方來”者，此是寧樂之時，若能與人親比，則不寧之方，皆悉歸來。“後夫兇”者，夫，語辭也。親比貴速，若及早而來，人皆親已故在先者吉。若在後而至者，人或疏己，親比不成，故“後夫兇”。或以“夫”為丈夫，謂後來之人也。" }
      - { type: j, text: "《彖》曰：比，吉也。比，輔也，下順從也。“原筮，元永貞，無咎”，以剛中也。處比之時，將原筮以求無咎，其唯元永貞乎？夫群黨相比，而不以“元永貞”，則兇邪之道也。若不遇其主，則雖永貞而猶未足免於咎也。使永貞而無咎者，其唯九五乎？" }
      - { type: z, text: "“彖曰”至“以剛中也”。○正義曰：“比，吉也”者，釋親比為善，言相親比而得吉也。“比，輔也”者，釋“比”所以得吉，由“比”者人來相輔助也，“下順從”者，在下之人，順從於上，是相輔助也，謂眾陰順從九五也。自此以上，釋比名為吉之義。“原筮，元永貞，無咎，以剛中”者，釋“原筮，元永貞，無咎”之義，所以得如此者，以九五剛而處中，故使“比”者皆得“原筮，元永貞，無咎”也。○注“處比之時”至“其唯九五乎”？○正義曰：“將原筮以求無咎，其唯元永貞乎”者，原謂原窮比者根本，筮謂筮決求比之情，以求久長無咎。“其唯元永貞乎”，元，大也；永，長也。為已有大長貞正，乃能原筮相親比之情，得久長而無咎，謂彼此相親比也。“若不遇其主，則雖永貞而猶未足免於咎”者，若不逢遇明主，則彼此相求，“比”者雖各懷永貞，而猶未足免離於咎。雖有永貞，而無明主照察，不被上知，相親涉於明黨，故不免咎也。“使永貞而無咎者，其唯九五乎”者，使“比”者得免咎，保永貞，久而無咎，其唯九五乎？以九五為比之主，剛而處中，能識“比”者之情意，故使“比”者得保永貞，無內咎也。" }
      - { type: j, text: "“不寧方來”，上下應也。上下無陽以分其民，五獨處尊，莫不歸之，上下應之，既親且安，安則不安者託焉，故不寧方所以來，“上下應”故也。夫無者求有，有者不求所與，危者求安，安者不求所保。火有其炎，寒者附之。故已苟安焉，則不寧方來矣。" }
      - { type: z, text: "正義曰：釋“不寧方來”之義，以九五處中，故上下群陰皆來應之。於此之時，陰往比陽，群陰未得其所，皆未寧也。" }
      - { type: j, text: "“後夫兇”，其道窮也。將合和親而獨在後，親成則誅，是以兇也。" }
      - { type: z, text: "“後夫兇，其道窮也”。○正義曰：釋“後夫兇”。他悉親比，己獨後來，比道窮困，無人與親，故其兇也。此謂上六也。○注“將合和親”至“是以兇也”。○正義曰：“親成則誅”者，彼此相比，皆速來為親；親道已成，已獨在後而來，眾則嫌其離貳，所以被誅而兇也。" }
      - { type: j, text: "《象》曰：地上有水，比。先王以建萬國，親諸侯。萬國以“比”建，諸侯以“比”親。" }
      - { type: z, text: "正義曰：“建萬國親諸侯”，非諸侯以下之所為，故特云“先王”也。“建萬國”謂割土而封建之。“親諸侯”謂爵賞恩澤而親友之。萬國據其境域，故曰“建”也。“諸侯”謂其君身，故云“親”也。地上有水，猶域中有萬國，使之各相親比，猶地上有水，流通相潤及物，故云“地上有水，比”也。" }
      - { type: j, text: "初六：有孚比之，無咎。有孚盈缶，終來有它吉。處比之始，為比之首者也。夫以不信為比之首，則禍莫大焉，故必“有孚盈缶”，然後乃得免比之咎，故曰“有孚比之，無咎”也。處比之首，應不在一，心無私吝，則莫不比之。著信立誠，盈溢乎質素之器，則物終來無衰竭也。親乎天下，著信盈缶，應者豈一道而來？故必“有他吉”也。" }
      - { type: z, text: "“初六有孚”至“有他吉”。○正義曰：“有孚比之無咎”者，處比之始，為比之首，若無誠信，禍莫大焉。必有誠信而相親比，終始如一，為之誠信，乃得無咎。“有孚盈缶，終來有他吉”者，身處比之首，應不在一，心無私吝，莫不比之。有此孚信盈溢質素之缶，以此待物，物皆歸向，從始至終，尋常恆來，非唯一人而已，更有他人並來而得吉，故云“終來有他吉”也。此假外象喻人事也。○注“應不在一，心無私吝”。○正義曰：“應不在一”者，初六無應，是“應不在一”，故“心無私吝”也。若心有偏應，即私有愛吝也，以“應不在一”，故“心無私吝”也。" }
      - { type: j, text: "《象》曰：比之初六，“有它吉”也。" }
      - { type: j, text: "六二：比之自內，貞吉。處比之時，居中得位，而系應在五，不能來它，故得其自內貞吉而已。" }
      - { type: z, text: "正義曰：“比之自內，貞吉”者，居中得位，系應在五，不能使它悉來，唯親比之道，自在其內，獨與五應，但“貞吉”而已，不如初六“有它吉”也。" }
      - { type: j, text: "《象》曰：“比之自內”，不自失也。" }
      - { type: z, text: "正義曰：“不自失”者，釋“比之自內”之義，不自失其所應之偶，故云“比之自內，不自失”也。" }
      - { type: j, text: "六三：比之匪人。四自外比，二為五貞，近不相得，遠則無應，所與比者，皆非巳親，故曰“比之匪人”。《象》曰：“比之匪人”，不亦傷乎！" }
      - { type: z, text: "正義曰：“比之匪人不亦傷乎”者，言六三所比，皆非己親之人。四自外比，二為五貞，近不相得，遠又無應，是所欲親比，皆非其親，是以悲傷也。" }
      - { type: j, text: "六四：外比之，貞吉。外比於五，復得其位，比不失賢，處不失位，故“貞吉”也。" }
      - { type: z, text: "正義曰：六四上比於五，欲外比也。居得其位，比不失賢，所以貞吉。凡下體為內，上體為外，六四比五，故云“外比”也。" }
      - { type: j, text: "《象》曰：外比於賢，以從上也。" }
      - { type: z, text: "正義曰：九五，居中得位，故稱“賢”也。五在四上，四往比之，是“以從上”也。" }
      - { type: j, text: "九五：顯比。王用三驅，失前禽。邑人不誡，吉。為比之主而有應在二，“顯比”者也。比而顯之，則所親者狹矣。夫無私於物，唯賢是與，則去之與來，皆無失也。夫三驅之禮，禽逆來趣已則舍之，背已而走則射之，愛於來而惡於去也，故其所施，常“失前禽”也。以“顯比”而居王位，用三驅之道者也，故曰“王用三驅，失前禽也”。用其中正，征討有常，伐不加邑，動必討叛，邑人無虞，故“不誡”也，雖不得乎大人之吉，是“顯比”之吉也。此可以為上之使，非為上道也。" }
      - { type: z, text: "“九五顯比”至“邑人不誡吉”。○正義曰：五應於二，顯明比道，不能普遍相親，是比道狹也。“王用三驅失前禽”者，此假田獵之道，以喻“顯比”之事。凡三驅之禮，禽向已者則舍之，背已者則射之，是失於“前禽”也。“顯比”之道，與己相應者則親之，與己不相應者則疏之，與三驅田獵，愛來惡去相似，故云“王用三驅，失前禽”也。言“顯比”之道，似於此也。“邑人不誡吉”者，雖不能廣普親比於自己相親之處，不妄加討罰，所以己邑之人，不須防誡而有吉也。至於“邑人不誡”而“為吉”，非是大人弘闊之道，不可為大人之道，但可為大人之使。○注“為比之主”至“非為上之道”。○正義曰：“去之與來皆無失”者，若“比”道弘闊，不偏私於物，唯賢是親，則背己去者與來向己者，皆悉親附無所失也；言去亦不失，來亦不失。夫三驅之禮者，先儒皆云“三度驅禽而射之也”。三度則已，今亦從之，去則射之。褚氏諸儒皆以“為三面著人驅禽”，必知“三面”者，禽唯有背己、向己、趣己，故左右及於後皆有驅之。“愛於來而惡於去”者，來則舍之，是愛於來也；去則射之，是惡於去也。“故其所施常失前禽”者，言獨“比”所應，則所比為失。如三驅所施，愛來憎去，則失在前禽也。“用其中正，征討有常，伐不加邑，動必討叛”者，此九五居中得正，故云“用其中正”也。心既中正，不妄喜怒，故征伐有常也。所伐之事，不加親己之邑；興師動眾，必欲討其叛逆。五以其“顯比”，親者伐所不加也，叛者，必欲征伐也。云“雖不得乎大人之吉，是顯比之吉”者，以《象》云“顯比之吉”，其比狹也。若“大人之吉”，則“比”道弘通也。“可以為上之使，非為上之道”者，九五居上之位，若為行如此，身雖為王，止可為上使之人，非是為王之道，故云“非為上之道”。" }
      - { type: j, text: "《象》曰：“顯比”之吉，位正中也。舍逆取順，“失前禽”也。“邑人不誡”，上使中也。" }
      - { type: z, text: "“顯比之吉”至“上使中也”。○正義曰：“顯比之吉，位正中”者，所以“顯比”得吉者，以所居之位正而且中，故云“顯比之吉”。“舍逆取順失前禽也”者，禽逆來向己者，則舍之而不害，禽順去背己而走者，則射而取之，是“失前禽”也。“邑人不誡上使中也”者，釋“邑人不誡”之義，所以己邑之人，不須防誡，止由在上九五之使得其中正之人，伐不加邑，動必討叛，不橫加無罪，止由在上使中也。“中”謂九五也。此九五雖不得為王者之身，堪為王者之使，以居中位，故云“上使中”也。" }
      - { type: j, text: "上六：比之無首，兇。無首，後已，處卦之終，是後夫也。親道已成，無所與終，為時所棄，宜其兇也。" }
      - { type: z, text: "正義曰：“無首兇”者，謂無能為頭首。它人皆“比”，己獨在後，是親比於人，無能為頭首也。它人皆“比”，親道已成，己獨在後，眾人所棄，宜其兇也。" }
      - { type: j, text: "《象》曰：“比之無首”，無所終也。" }
      - { type: z, text: "正義曰：“無所終”者，釋“比之無首”，既不能為比之初首，被人所棄，故無能與之共終也。" }
      - { type: j, text: "乾下巽上。小畜：亨。不能畜大，止健剛志，故行是以亨。" }
      - { type: z, text: "正義曰：但小有所畜，唯“畜”九三而已。初九、九二，猶剛健得行，是以剛志上得亨通，故云“小畜亨”也。若大畜、乾在於下，艮在於上，艮是陽卦，又能止物，能止此乾之剛健，所畜者大，故稱“大畜”。此卦則巽在於上，乾在於下，巽是陰，柔性，又和順，不能止畜在下之乾，唯能畜止九三，所畜狹小，故名“小畜”。" }
      - { type: j, text: "密云不雨，自我西郊。" }
      - { type: z, text: "正義曰：“密云不雨”者，若陽之上升，陰能畜止，兩氣相薄則為雨也。今唯能畜止九三，其氣被畜，但為密云，初九、九二，猶自上通，所以不能為雨也。“自我西郊”者，所聚密云，由在我之西郊，去我既遠，潤澤不能行也，但聚在西郊而已。" }
      - { type: j, text: "《彖。曰：小畜，柔得位而上下應之，曰“小畜”。謂六四也，成卦之義，在此爻也。體無二陰，以分其應故上下應之也。既得其位，而上下應之，三不能陵，小畜之義。" }
      - { type: z, text: "正義曰：“柔得位”，謂六四也。以陰居陰，故稱得位。此卦唯有一陰，上下諸陽皆來應之，故曰“小畜”。此釋小畜卦名也。言此卦之畜，六四唯畜其下九三，初九、九二猶不能擁畜，而云“上下應之”者，若細別而言，小畜之義，唯當畜止在下。三陽猶不能畜盡，但畜九三而已。若大判而言之，上下五陽總應六四，故云“上下應之”。其四雖應何妨，總不能畜止剛健也。" }
      - { type: j, text: "健而巽，剛中而志行，乃亨。“密云不雨”，尚往也；“自我西郊”，施未行也。小畜之勢，足作密云，乃“自我西郊”，未足以為雨也。何由知未能為雨？夫能為雨者，陽上薄陰，陰能固之，然後烝而為雨。今不能制初九之“複道”，固九二之“牽復”，九三更以不能復為劣也。下方尚往，施豈得行？故密云而不能為雨，尚往故也。何以明之？去陰能固之，然後乃雨乎。上九獨能固九三之路，故九三不可以進而“輿說輻”也。能固其路而安於上，故得“既雨既處”。若四、五皆能若上九之善畜，則能雨明矣。故舉一卦而論之，能為小畜密云而已。陰苟不足以固陽，則雖復至盛，密云自我西郊，故不能雨也。雨之未下，即施之未行也。《彖》至論一卦之體，故曰“密云不雨”。《象》各言一爻之德，故曰“既雨既處”也。" }
      - { type: z, text: "“健而巽”至“施未行也”。○正義曰：“健而巽，剛中而志行，乃亨”者，內既剛健而外逢柔順，剛發於外，不被摧抑，而志意得行。以此言之，故剛健之志，乃得亨通，此釋“亨”也。“密云不雨，尚往”者，所以密云不雨者，不能畜止諸陽，初九、九二，猶得上進，陰陽氣通，所以不雨，釋“密云不雨”也。“自我西郊施未行”者，釋“自我西郊”之義。所以密云不雨，從我西郊而積聚者，猶所施潤澤，未得流行周遍，故不覆國都，但遠聚西郊也。然云在國都而不雨，亦是施未行也。必云在西郊者，若在國都，雨雖未落，猶有覆蔭之施，不得云“施未行”，今言在西郊，去施遠也。○注“小畜之勢”至“既雨既處也”。○正義曰：“九三更以不能復為劣”者，初九既得“複道”，九二可“牽”以獲“復”，皆得剛健上通，則是陰不能固陽，而九三劣弱，又不能自復，則是陽不薄陰，是以皆不雨也。且小畜之義，貴於上往，而九三不能自復，更為劣弱，故言“九三更不能復為劣”也。“能固其路而安於上”者，謂上九能閉固九三之道路，不被九三所陵，得安於上，所以“既雨既處”也，故舉一卦而論之。“能為小畜密云而已”者，此明卦之與爻，其義別也。但卦總二象，明上體不能閉固下體，所以密云不能為雨。爻則止明一爻之事，上九能固九三，所以上九而有雨也。所以卦與爻其義異也。諸卦多然。若《比卦》云“比吉”，上六則云“比之無首兇”也；《復卦》云“復亨”，上六云“迷復兇”也。此皆卦之與爻，義相違反，它皆仿此。" }
      - { type: j, text: "《象》曰：風行天上，小畜。君子以懿文德。未能行其施者，故可以懿文德而已。" }
      - { type: z, text: "正義曰：“君子以懿文德”者，懿，美也。以於其時施末得行，喻君子之人但修美文德，待時而發。風為號令，若“風行天下”，則施附於物，不得云“施未行”也。今風在天上，去物既遠，無所施及，故曰“風行天上”。凡大象，君子所取之義，或取二卦之象而法之者，若“地中有水，師，君子以容民畜眾”，取卦象包容之義；若《履卦·象》云“上天下澤，履，君子以辯上下”，取上下尊卑之義。如此之類，皆取二象，君子法以為行也。或直取卦名，因其卦義所有，君子法之，須合卦義行事者。若《訟卦》云“君子以作事謀始”，防其所訟之源，不取“天與水違行”之象；若《小畜》“君子以懿文德”，不取“風行天上”之象。餘皆仿此。" }
      - { type: j, text: "初九：復自道，何其咎？吉。處乾之始，以升巽初，四為已應，不距已者也。以陽升陰，復自其道，順而無違，何所犯咎，得義之吉。" }
      - { type: z, text: "正義曰：處乾之始以升巽，初四為已應，以陽升陰，反覆於上，自用已道，四則順而無違，於已無咎，故云“復自道，何其咎？吉”。" }
      - { type: j, text: "《象》曰：“復自道”，其義吉也。" }
      - { type: z, text: "正義曰：“其義吉”者，以陽升陰，以剛應柔，其義於理吉也。" }
      - { type: j, text: "九二：牽復吉。處乾之中，以升巽五，五非畜極，非固已者也。雖不能若陰之不違，可牽以獲復，是以吉也。" }
      - { type: z, text: "正義曰：“牽”謂牽連，“復”謂反覆，二欲往五，五非止畜之極，不閉固於已，可自牽連反覆於上而得吉也。" }
      - { type: j, text: "《象》曰：“牽復”在中，亦不自失也。" }
      - { type: z, text: "正義曰：既彊牽連，而復在下卦之中，以其得中，不被閉固，亦於已不自有失，解“牽復吉”也。" }
      - { type: j, text: "九三：輿說輻。夫妻反目。上為畜盛，不可牽徵，以斯而進，故必“說輻”也。已為陽極，上為陰長，畜於陰長，不能自復，方之“夫妻反目”之義也。" }
      - { type: z, text: "正義曰：九三欲復而進，上九固而止之，不可以行，故車輿說其輻。“夫妻反目”者，上九體巽為長女之陰，今九三之陽，被長女閉固，不能自復，夫妻乖戾，故反目相視。" }
      - { type: j, text: "《象》曰：“夫妻反目”，不能正室也。" }
      - { type: z, text: "正義曰：“不能正室”者，釋“夫妻反目”之義。以九三之夫不能正上九之室，故“反目”也。此假象以喻人事也。" }
      - { type: j, text: "六四：有孚，血去惕出，無咎。夫言“血”者，陽犯陰也。四乘於三，近不相得，三務於進，而已隔之，將懼侵克者也。上亦惡三而能制焉，志與上合，共同斯誠，三雖逼己，而不能犯，故得血去懼除，保無咎也。" }
      - { type: z, text: "“六四”至“無咎”。○正義曰：六四居九三之上，乘陵於三，三既務進，而已固之，懼三害己，故有“血”也。畏三侵陵，故惕懼也。但上九亦憎惡九三，六四與上九同志，共惡於三三不害己，己故得其血去除，其惕出散，信能血去懼除，乃得無咎。○注“夫言血者”至“無咎也”。○正義曰：“夫言血者陽犯陰也”者，謂此卦言“血”，陽犯陰也。“夫”者，發語之端，非是總凡之辭。故《需》六四云“需於血”，《注》云：“凡稱血者，陰陽相傷也”。則稱血者，非唯陽犯陰也。" }
      - { type: j, text: "《象》曰：有孚惕出，上合志也。" }
      - { type: z, text: "正義曰：釋“惕出”之意。所以“惕出”者，由己與上九同合其志，共惡於三也。" }
      - { type: j, text: "九五：有孚攣如，富以其鄰。處得尊位，不疑於二，來而不距。二牽已攣，不為專固，“有孚攣如”之謂也。以陽居陽，處實者也。居盛處實而不專固，富以其鄰者也。" }
      - { type: z, text: "正義曰：“有孚攣如”者，五居尊位，不疑於二，來而不距。二既牽挽而來，已又攀攣而迎接，志意合同，不有專固相逼，是有信而相牽攣也。“如”，語辭，非義類。“富以其鄰”者，五是陽爻，即必富實。心不專固，故能用富以與其鄰。“鄰”謂二也。" }
      - { type: j, text: "《象》曰：“有孚攣如”，不獨富也。" }
      - { type: z, text: "正義曰：“不獨富也”者，釋“攣如”之義。所以攀攣於二者，以其不獨自專固於富，欲分與二也。" }
      - { type: j, text: "上九：既雨既處，尚德載，婦貞厲，月幾望，君子徵兇。處小畜之極，能畜者也。陽不獲亨，故“既雨”也。剛不能侵，故“既處”也。體《巽》處上，剛不敢犯，“尚德”者也。為陰之長，能畜剛健，德積載者也。婦制其夫，臣制其君，雖貞近危，故曰“婦貞厲”也。陰之盈盛莫盛於此，故曰“月幾望”也。滿而又進，必失其道，陰疑於陽，必見戰伐，雖復君子，以徵必兇，故曰“君子徵兇”。" }
      - { type: z, text: "“上九，既雨既處”至“君子徵兇”。○正義曰：“既雨既處”者，九三欲進，已能固之，陰陽不通，故已得其雨也。“既處”者，三不能侵，不憂危害，故已得其處也。“尚德載”者，體《巽》處上，剛不敢犯，為陰之長，能畜正剛健，慕尚此德之積聚而運載也，故云“尚德載”也。言慕尚此道德之積載也。“婦貞厲”者，上九制九三，是婦制其夫，臣制其君，雖復貞正，而近危厲也。“月幾望”者，婦人之制夫，猶如月在望時盛極以敵日也。“幾”，辭也，已從上釋，故於此不復言也。“君子徵兇”者，陰疑於陽，必見戰伐，雖復君子之行而亦兇也。○注“處小畜之極”至“君子徵兇”。○正義曰：“處小畜之極，能畜者也”者。已處小畜盛極，是閉畜者也。“陽不獲亨，故既雨也”者，陽若亨通則不雨也。所以卦系辭云：“小畜，亨，密云不雨。”今九三之陽，被上九所固，不獲亨通，故“既雨”也。" }
      - { type: j, text: "《象》曰：“既雨既處”，德積載也。“君子徵兇”，有所疑也。夫處下可以徵而無咎者，唯泰也則然。坤本體下，又順而弱，不能敵剛，故可以全其類，徵而吉也。自此以往，則其進各有難矣。夫巽雖不能若艮之善畜，猶不肯為坤之順從也，故可得少進，不可盡陵也。是以初九、九二，其復則可，至於九三，則“輿說輻”也。夫大畜者，畜之極也。畜而不已，畜極則通，是以其畜之盛在於四、五，至於上九，道乃大行。小畜積極而後乃能畜，是以四、五可以進，而上九說徵之輻。" }
      - { type: z, text: "“《象》曰既雨既處”至“有所疑也”。○正義曰：“既雨既處，德積載”者，釋“既雨既處”之義。言所以得“既雨既處”者，以上九道德積聚，可以運載，使人慕尚，故云“既雨既處”也。“君子徵兇有所疑”者，釋“君子徵兇”之義，言所以“徵兇”者，陰氣盛滿，被陽有所疑忌，必見戰伐，故“徵兇”也。○注“夫處下”至“說徵之輻”。○正義曰：“夫巽雖不能若艮之善畜”者，謂雖不能如大畜艮卦在上，善畜下之乾也。“巽雖不能如艮之善畜”，故其畜小也。“猶不肯為坤之順從”者，謂猶不肯如泰卦、坤在於上順從乾也。“故可得少進”者，謂初九、九二得前進也。“不可盡陵”者，九三欲陵上九，被上九所固，是不可得“盡陵”也。“畜而不已，畜極則通，是以其畜之盛在於四五，至於上九，道乃大行”者，此論大畜義也。大畜畜而不已，謂之“大畜”。四爻、五爻是畜之盛極，而不休已，畜極則通。四、五畜道既極，至於上九，無可所畜，故上九道乃大行，無所畜也。“小畜積極而後乃能畜”者，小畜之道既微，積其終極，至於上九，乃能畜也，謂“畜”九三也。“是以四、五可以進”者，四雖畜初，五雖畜二，畜道既弱，故九二可以進。“上九說徵之輻”者，上九畜之“積極”，故能說此九三徵行之輻。案：九三但有“說輻”，無“徵”之文。而王氏言上九“說徵之輻”者，輿之有輻，可以徵行。九三爻有“徵”義，今輿輻既說，則是說徵之輻，因上九“徵兇”之文，徵則行也。文雖不言，於義必有言“輻”者，鄭《注》云“謂輿下縛木，與軸相連，鉤心之木”是也。《子夏傳》云：“輻，車劇也。”" }
      - { type: j, text: "兌下乾上。履：虎尾，不咥人，亨。" }
      - { type: z, text: "正義曰：《履卦》之義，以六三為主。六三以陰柔履踐九二之剛，履危者也，猶如履虎尾，為危之甚。“不咥人亨”者，以六三在兌體，兌為和說，而應乾剛，雖履其危，而不見害，故得亨通，猶若履虎尾不見咥齧於人。此假物之象以喻人事。" }
      - { type: j, text: "《彖》曰：履，柔履剛也。說而應乎乾，是以“履虎尾，不咥人亨”。凡“彖”者，言乎一卦之所以為主也，成卦之體在六三也。“履虎尾”者，言其危也。三為履主，以柔履剛，履危者也。“履虎尾”，有“不見咥”者，以其說而應乎乾也。乾，剛正之德者也。不以說行夫佞邪，而以說應乎《乾》，宜其“履虎尾”，不見咥而亨。" }
      - { type: z, text: "“《彖》曰履柔履剛也”至“不咥人亨”。○正義曰：“履，柔履剛”者，言履卦之義，是柔之履剛。六三陰爻，在九二陽爻之上，故云“柔履剛”也。“履”謂履踐也。此釋履卦之義。“說而應乎乾，是以履虎尾，不咥人亨”者，釋“不咥人亨”之義。六三在兌體，兌為和說，應於上九，上九在乾體。兌自和說，應乎乾剛，以說應剛，無所見害。是以履踐虎尾，不咥害於人，而得亨通也。若以和說之行，而應於陰柔，則是邪佞之道，由以說應於剛，故得吉也。" }
      - { type: j, text: "剛中正，履帝位而不疚，光明也。言五之德。" }
      - { type: z, text: "正義曰：“剛中正履帝位”者，謂九五也。以剛處中，得其正位，居九五之尊，是“剛中正履帝位”也。“而不疚光明”者，能以剛中而居帝位，不有疚病，由德之光明故也。此一句贊明履卦德養之美，於經無所釋也。" }
      - { type: j, text: "《象》曰：上天下澤，履。君子以辯上下、定民志。" }
      - { type: z, text: "正義曰：天尊在上，澤卑處下，君子法此履卦之象，以分辯上下尊卑，以定正民之志意，使尊卑有序也。但此履卦名合二義，若以爻言之，則在上履踐於下，六三“履”九二也。若以二卦上下之象言之，則“履”，禮也，在下以禮承事於上。此象之所言，取上下二卦卑承尊之義，故云“上天下澤，履”。但易合萬象，反覆取義，不可定為一體故也。" }
      - { type: j, text: "初九：素履往，無咎。處履之初，為履之始，履道惡華，故素乃無咎。處履以素，何往不從？必獨行其願，物無犯也。" }
      - { type: z, text: "正義曰：處履之始，而用質素，故往而無咎。若不以質素，則有咎也。" }
      - { type: j, text: "《象》曰：素履之往，獨行原也。" }
      - { type: z, text: "正義曰：“獨行願”者，釋“素履”之往，它人尚華，己獨質素，則何咎也？故獨行所願，則物無犯也。" }
      - { type: j, text: "九二：履道坦坦，幽人貞吉。履道尚謙，不喜處盈，務在致誠，惡夫外飾者。也而二以陽處陰，履於謙也。居內履中，隱顯同也。履道之美，於斯為盛。故“履道坦坦”，無險厄也。在幽而貞，宜其吉。" }
      - { type: z, text: "“九二”至“幽人貞吉”。○正義曰：“履道坦坦”者，坦坦，平易之貌。九二以陽處陰，履於謙退，已能謙退，故“履道坦坦”者，易無險難也。“幽人貞吉”者，既無險難，故在幽隱之人，守正得吉。○注“履道尚謙”至“宜其吉”。○正義曰：“履道尚謙”者，言履踐之道，貴尚謙退，然後乃能踐物。“履”又為禮，故“尚謙”也。“居內履中，隱顯同”者，“履道尚謙”，不喜處盈，然以陽處陰，尚於謙德。“居內履中”，以信為道，不以居外為榮，處內為屈。若居在外，亦能履中謙退，隱之與顯，在心齊等，故曰“隱顯同”也。“在幽而貞，宜其吉”者，以其在內卦之中，故云“在幽”也。謙而得中，是貞正也。“在幽”能行此正，故曰“宜其吉”。" }
      - { type: j, text: "《象》曰：“幽人貞吉”，中不自亂也。" }
      - { type: z, text: "正義曰：“中不自亂”者，釋“幽人貞吉”，以其居中，不以危險而自亂也。既能謙退幽居，何有危險自亂之事？" }
      - { type: j, text: "六三：眇能視，跛能履。履虎尾，咥人兇。武人為於大君。居“履”之時，以陽處陽，猶曰不謙，而況以陰居陽，以柔乘剛者乎？故以此為明眇目者也，以此為行跛足者也，以此履危見咥者也。志在剛健，不修所履，欲以陵武於人，“為於大君”，行未能免於兇，而志存於五，頑之甚也。" }
      - { type: z, text: "“六三眇能視”至“武人為於大君”。○正義曰：“眇能視，跛能履”者，居“履”之時，當須謙退。今六三以陰居陽，而又失其位，以此視物，猶如眇目自為能視，不足為明也；以此履踐，猶如跛足自為能履，不足與之行也。“履虎尾咥人兇”者，以此履虎尾，咥齧於人，所以兇也。“武人為於大君”者，行此威武加陵於人，欲自“為於大君”，以六三之微，欲行九五之志，頑愚之甚。" }
      - { type: j, text: "《象》曰：“眇能視”，不足以有明也。“跛能履”，不足以與行也。咥人之兇，位不當也。“武人為於大君”，志剛也。" }
      - { type: z, text: "“《象》曰眇能視”至“武人為於大君志剛也”。○正義曰：“不足以有明”者，釋“眇能視物”。目既隆眇，假使能視，無多明也。“不足以與行”者，解“跛能履”。足既蹇跛，假使能履，行不能遠，故云“不足以與行”也。“位不當”者，釋“咥人之兇”。所以被咥見兇者，緣居位不當，為以陰處陽也。“志剛”者，釋“武人為於大君”。所以陵武加人，欲為大君，以其志意剛猛，以陰而處陽，是志意剛也。" }
      - { type: j, text: "九四：履虎尾，愬愬，終吉。逼近至尊，以陽承陽，處多懼之地，故曰：“履虎尾，愬愬”也。然以陽居陰，以謙為本，雖處危懼，終獲其志，故“終吉”也。" }
      - { type: z, text: "正義曰：“履虎尾愬愬”者，逼近五之尊位，是“履虎尾”近其危也。以陽承陽，處嫌隙之地，故“愬愬”危懼也。“終吉”者，以陽居陰，意能謙退，故終得其吉也。" }
      - { type: j, text: "《象》曰：“愬愬終吉”，志行也。" }
      - { type: z, text: "正義曰：“志行”者，釋“愬愬終吉”。初雖“愬愬”，終得其吉，以謙志得行，故“終吉”也。" }
      - { type: j, text: "九五：夬履，貞厲。得位處尊，以剛決正，故曰“夬履貞厲”也。履道惡盈而五處尊，是以危。" }
      - { type: z, text: "正義曰：“夬履”者，夬者，決也。得位處尊，以剛決正，履道行正，故夬履也。“貞厲”者，厲，危也。履道惡盈，而五以陽居尊，故危厲也。" }
      - { type: j, text: "《象》曰：“夬履，貞厲”，位正當也。" }
      - { type: z, text: "正義曰：“位正當”者，釋“夬履貞厲”之義。所以“夬履貞厲”者，以其位正，當處在九五之位，不得不決斷其理，不得不有其貞厲，以位居此地故也。" }
      - { type: j, text: "上九：視履考祥，其旋元吉。禍福之祥，生乎無所履，處履之極，履道成矣，故可“視履”而“考祥”也。居極應說，高而不危，是其旋也。履道大成，故“元吉”也。" }
      - { type: z, text: "正義曰：“視履考祥”者，祥謂徵祥。上九處履之極，履道已成，故視其所履之行；善惡得失，考其禍福之徵祥。“其旋元吉”者，旋謂旋反也。上九處履之極，下應兌說，高而不危，是其不墜於“履”，而能旋反行之，履道大成，故“元吉”也。" }
      - { type: j, text: "《象》曰：“元吉”，在上大有慶也。" }
      - { type: z, text: "正義曰：“大有慶”者，解“元吉”在上之義。既以“元吉”而在上九，是大有福慶也，以有福慶，故在上元吉也。" }
      - { type: j, text: "乾下坤上。泰：小往大來，吉亨。" }
      - { type: z, text: "正義曰：陰去故“小往”，陽長故“大來”，以此吉而亨通。此卦亨通之極，而四德不具者，物既太通，多失其節，故不得以為元始而利貞也。所以《象》云“財成”、“輔相”，故四德不具。" }
      - { type: j, text: "《彖》曰：“泰，小往大來，吉亨”，則是天地交而萬物通也，上下交而其志同也。內陽而外陰，內健而外順，內君子而外小人。君子道長，小人道消也。" }
      - { type: z, text: "“《彖》曰泰小往大來”至“小人道消也”。○正義曰：“泰，小往大來，吉亨，則是天地交而萬物通”者，釋此卦“小往大來吉亨”名為“泰”也。所以得名為“泰”者，止由天地氣交而生養萬物，物得大通，故云“泰”也。“上下交而其志同”者，此以人事象天地之交。上謂君也。下謂臣也，君臣交好，故志意和同。“內陽而外陰，內健而外順”，內健則內陽，外順則外陰。內陽外陰據其象，內健外順明其性，此說泰卦之德也。陰陽言爻，健順言卦。此就卦爻釋“小往大來吉亨”也。“內君子而外小人，君子道長，小人道消”者，更就人事之中，釋“小往大來吉亨”也。" }
      - { type: j, text: "《象》曰：天地交，泰。後以財成天地之道，輔相天地之宜，以左右民。泰者，物大通之時也。上下大通，則物失其節，故財成而輔相，以左右民也。" }
      - { type: z, text: "“《象》曰天地交泰”至“以左右民”。○正義曰：“後以財成天地之道”者，由物皆通泰，則上下失節。後，君也。於此之時，君當翦財，成就天地之道。“輔相天地之宜”者，相，助也。當輔助天地所生之宜。“以左右民”者，左右，助也，以助養其人也。“天地之道”者，謂四時也，冬寒、夏暑、春生、秋殺之道。若氣相交通，則物失其節。物失其節，則冬溫、夏寒、秋生、春殺。君當財節成就，使寒暑得其常，生殺依其節，此天地自然之氣，故云“天地之道”也。“天地之宜”者，謂天地所生之物各有其宜。若《大司徒》云“其動物植物”，及《職方》云楊州其貢宜稻麥，雍州其貢宜黍稷。若天氣大同，則所宜相反。故人君輔助天地所宜之物，各安其性，得其宜，據物言之，故稱“宜”也。此卦言“後”者，以不兼公卿大夫，故不云君子也。兼通諸侯，故不得直言先王，欲見天子諸侯，俱是南面之君，故特言“後”也。" }
      - { type: j, text: "初九：拔茅茹，以其匯，徵吉。茅之為物，拔其根而相牽引者也。“茹”，相牽引之貌也。三陽同志，俱志在外，初為類首，已舉則從，若“茅茹”也。上順而應，不為違距，進皆得志，故以其類“徵吉”。" }
      - { type: z, text: "正義曰：“拔茅茹”者，初九欲往於上，九二、九三，皆欲上行，已去則從，而似拔茅舉其根相牽茹也。“以其匯”者，匯，類也，以類相從。“徵吉”者，徵，行也。上坤而順下，應於乾，己去則納，故徵行而吉。" }
      - { type: j, text: "《象》曰：“拔茅”、“徵吉”，志在外也。" }
      - { type: z, text: "正義曰：“志在外”者，釋“拔茅徵吉”之義。以其三陽志意皆在於外，己行則從，而似“拔茅徵行”而得吉。此假外物以明義也。" }
      - { type: j, text: "九二：包荒，用馮河，不遐遺，朋亡。得尚於中行。體健居中而用乎“泰”，能包含荒穢，受納“馮河”者也。用心弘大，無所遐棄，故曰“不遐遺”也。無私無偏，存乎光大，故曰“朋亡”也。如此乃可以“得尚於中行”。尚，尤配也。“中行”，謂五。" }
      - { type: z, text: "正義曰：“包荒用馮河”者，體健居中，而用乎“泰”，能包含荒穢之物，故云“包荒”也。“用馮河”者，無舟渡水，馮陵於河，是頑愚之人，此九二能包含容受，故曰“用馮河”也。“不遐遺”者，遐，遠也。遺，棄也。用心弘大，無所疏遠棄遺於物。“朋亡”者，得中無偏，所在皆納，無私於朋黨之事，“亡，無也”，故云“朋亡”也。“得尚於中行”者，“中行”謂六五也，處中而行，以九二所為如此。尚，配也，得配六五之中也。" }
      - { type: j, text: "《象》曰：“包荒”，“得尚於中行”，以光大也。" }
      - { type: z, text: "正義曰：釋“得尚中行”之義。所以包荒、得配此六五之中者，以無私無偏，存乎光大之道，故此包荒。皆假外物以明義也。" }
      - { type: j, text: "九三：無平不陂，無往不復。艱貞無咎。勿恤其孚，於食有福。乾本上也，坤本下也，而得泰者，降與升也。而三處天地之際，將復其所處。復其所處，則上守其尊，下守其卑，是故無往而不復也，無平而不陂也。處天地之將閉，平路之將陂，時將大變，世將大革，而居不失其正，動不失其應，艱而能貞，不失其義，故“無咎”也。信義誠著，故不恤其孚而自明也，故曰“勿恤其孚，於食有福”也。" }
      - { type: z, text: "“九三無平不陂”至“於食有福”。○正義曰：“無平不陂”者，九三處天地相交之際，將各分復其所處。乾體初雖在下，今將復歸於上，坤體初雖在上，今欲復歸於下，是初始平者，必將有險陂也。初始往者，必將有反覆也。無有平而不陂，無有往而不復者，猶若元在下者而不在上，元在下者而不歸下也。“艱貞無咎”者，已居變革之世，應有危殆，只為己居得其正，動有其應，艱難貞正，乃得“無咎”。“勿恤其孚，於食有福”者，恤，憂也；孚，信也。信義先以誠著，故不須憂其孚信也。信義自明，故於食祿之道，自有福慶也。○注“將復其所處”至“於食有福也”。○正義曰：“將復其所處”者，以泰卦“乾體”在下，此九三將棄三而向四，是將復其乾之上體所處也。泰卦“坤體”在上，此六四今將去四而歸向初，復其“坤體”所處也。“處天地之將閉，平路之將陂”者，天將處上，地將處下，閉而不通，是“天地之將閉”也。所以往前通泰，路無險難，自今巳後，時既否閉，路有傾危，是“平路之將陂”也。此因三之向四，是下欲上也。則上六將歸於下，是上欲下也，故云“復其所處”也。“信義誠著”者，以九三居不失正，動不失應，是信義誠著也。“故不恤其孚而自明”者，解“於食有福”，以信義自明，故飲食有福。" }
      - { type: j, text: "《象》曰：“無往不復”，天地際也。天地將各分復之際。" }
      - { type: z, text: "正義曰：“天地際”者，釋“無往不復”之義。而三處天地交際之處，天體將上，地體將下，故往者將復，平者將陂。" }
      - { type: j, text: "六四：翩翩，不富以其鄰。不戒以孚。乾樂上覆，坤樂下復，四處坤首，不固所居，見命則退，故曰“翩翩”也。坤爻皆樂下，已退則從，故不待富而用其鄰也。莫不與已同其志願，故不待戒而自孚也。" }
      - { type: z, text: "正義曰：“六四翩翩”者，四主坤首，而欲下復，見命則退，故翩翩而下也。“不富以其鄰”者，以，用也。“鄰”謂五與上也。今己下復，眾陰悉皆從之，故不待財富而用其鄰。“不戒以孚”者，鄰皆從己，共同志願，不待戒告而自孚信以從已也。" }
      - { type: j, text: "《象》曰：“翩翩不富”，皆失實也。“不戒以孚”，中心願也。" }
      - { type: z, text: "正義曰：“皆失實”者，解“翩翩不富”之義，猶眾陰皆失其本實所居之處，今既見命，翩翩樂動，不待財富，並悉從之，故云“皆失實”也。“不戒以孚中心願”者，解“不戒以孚”之義，所以不待六四之戒告，而六五、上六，皆以孚信者，由中心皆願下復，故不待戒而自孚也。" }
      - { type: j, text: "六五：帝乙歸妹，以祉元吉。婦人謂嫁曰“歸”。“泰”者，陰陽交通之時也。女處尊位，履中居順，降身應二，感以相與，用中行願，不失其禮。“帝乙歸妹”，誠合斯義。履順居中，行原以祉，盡夫陰陽交配之宜，故“元吉”也。" }
      - { type: z, text: "“六五”至“以祉元吉”。○正義曰：“帝乙歸妹”者，女處尊位，履中居順，降身應二，感以相與，用其中情，行其志願，不失於禮。爻備斯義者，唯帝乙歸嫁於妹而能然也。故作《易》者，引此“帝乙歸妹”以明之也。“以祉元吉”者，履順居中，得行志願，以獲祉福，盡夫陰陽交配之道，故大吉也。○注“婦人謂嫁曰歸”。○正義曰：“婦人謂嫁曰歸”，隱二年《公羊傳》文也。" }
      - { type: j, text: "《象》曰：“以祉元吉”，中以行願也。" }
      - { type: z, text: "正義曰：“中以行願”者，釋“以祉元吉”之義，正由中順，行其志願，故得福而元吉也。" }
      - { type: j, text: "上六：城復於隍，勿用師。自邑告命，貞吝。居泰上極，各反所應，泰道將滅，上下不交，卑不上承，尊不下施，是故“城復子隍”，卑道崩也。“勿用師”，不煩攻也。“自邑告命，貞吝”，否道已成，命不行也。" }
      - { type: z, text: "“上六城復於隍”至“自邑告命貞吝”。○正義曰：“城復於隍”者，居泰上極，各反所應，泰道將滅，上下不交，卑不上承，尊不下施，猶若“城復於隍”也。《子夏傳》云：“隍是城下池也”。城之為體，由基土陪扶，乃得為城。今下不陪扶，城則隕壞，以此崩倒，反覆於隍，猶君之為體，由臣之輔翼。今上下不交，臣不扶君。君道傾危，故云“城復於隍”。此假外象以喻人事。“勿用師”者，謂君道已傾，不煩用師也。“自邑告命貞吝”者，否道己成，物不順從，唯於自已之邑而施告命，下既不從，故“貞吝”。○注“卑道崩也”。○正義曰：“卑道崩也”者，卑道向下，不與上交，故卑之道崩壞，不承事於上也。" }
      - { type: j, text: "《象》曰：“城復於隍”，其命亂也。" }
      - { type: z, text: "正義曰：“其命亂”者，釋“城復於隍”之義。若教命不亂，臣當輔君，猶土當扶城。由其命錯亂，下不奉上，猶上不陪城，使復於隍，故云“其命亂”也。" }
      - { type: j, text: "坤下乾上。否之匪人，不利君子貞。大往小來。" }
      - { type: z, text: "正義曰：“否之匪人”者，言否閉之世，非是人道交通之時，故云“匪人”。“不利君子貞”者，由小人道長，君子道消，故不利君子為正也。陽氣往而陰氣來，故云“大往小來”。陽主生息，故稱“大”；陰主消耗，故稱“小”。" }
      - { type: j, text: "《彖》曰：“否之匪人，不利君子貞，大往小來”，則是天地不交，而萬物不通也；上下不交，而天下無邦也。內陰而外陽，內柔而外剛，內小人而外君子，小人道長，君子道消也。" }
      - { type: z, text: "正義曰：“上下不交而天下無邦”者，與泰卦反也。《泰卦》云“上下交而其志同”，此應云“上下不交則其志不同”也。非但其志不同，上下乖隔，則邦國滅亡，故變云“天下無邦”也。“內柔而外剛”者，欲取否塞之義，故內至柔弱，外御剛彊，所以否閉。若欲取“通泰”之義，則云“內健”“外順”。各隨義為文，故此云“剛柔”，不云：“健順”。" }
      - { type: j, text: "《象》曰：天地不交，否。君子以儉德闢難，不可榮以祿。" }
      - { type: z, text: "正義曰：“君子以儉德闢難”者，言君子於此否塞之時，以節儉為德，闢其危難，不可榮華其身，以居祿位。此若據諸侯公卿言之，闢其群小之難，不可重受官賞；若據王者言之，謂節儉為德，闢其陰陽已運之難，不可重自榮華而驕逸也。" }
      - { type: j, text: "初六：拔茅茹，以其匯，貞，吉亨。居否之初，處順之始，為類之首者也。順非健也，何可以徵？居否之時，動則入邪，三陰同道，皆不可進。故“茅茹”以類，貞而不諂，則“吉亨”。" }
      - { type: z, text: "正義曰：“拔茅茹”者，以居否之初，處順之始，未可以動，動則入邪，不敢前進。三陰皆然，猶若拔茅牽連其根相茹也。己若不進，餘皆從之，故云“拔茅茹”也。“以其匯”者，以其同類，共皆如此。“貞吉亨”者，守正而居志在於君，乃得吉而亨通。" }
      - { type: j, text: "《象》曰：拔茅貞吉，志在君也。志在於君，故不苟進。" }
      - { type: z, text: "正義曰：“志在君”者，釋“拔茅貞吉”之義。所以居而守正者，以其志意在君，不敢懷諂苟進，故得“吉亨”也。此假外物以明人事。" }
      - { type: j, text: "六二：包承，小人吉，大人否，亨。居“否”之世，而得其位，用其至順，包承於上，小人路通，內柔外剛，大人“否”之，其道乃“亨”。" }
      - { type: z, text: "正義曰：“包承”者，居“否”之世而得其位，用其志順，包承於上。“小人吉”者，否閉之時，小人路通，故於小人為吉也。“大人否亨”者，若大人用此“包承”之德，能否閉小人之“吉”，其道乃亨。" }
      - { type: j, text: "《象》曰：“大人否亨”，不亂群也。" }
      - { type: z, text: "正義曰：此釋所以大人“否亨”之意，良由否閉小人，防之以得其道，小人雖盛，不敢亂群，故言“不亂群”也。" }
      - { type: j, text: "六三：包羞。俱用小道以承其上，而但不當，所以“包羞”也。《象》曰：“包羞”，位不當也。" }
      - { type: z, text: "正義曰：“包羞”者，言群陰俱用小人之道包承於上，以失位不當，所包承之事，唯羞辱己。" }
      - { type: j, text: "九四：有命無咎。疇離祉。夫處“否”而不可以有命者，以所應者小人也。有命於小人，則消君子之道者也。今初志在君，處乎窮下，故可以有命無咎而疇麗福也。疇謂初也。" }
      - { type: z, text: "正義曰：“有命無咎”者，九四處否之時，其陰爻皆是小人。若有命於小人，則君子道消也。今初六志在於君，守正不進，處於窮下。今九四有命命之，故“無咎”。“疇離祉”者，疇謂疇匹，謂初六也。離，麗也。麗謂附著也。言九四命初，身既無咎，初既被命，附依祉福，言初六得福也。" }
      - { type: j, text: "《象》曰：“有命無咎”，志行也。" }
      - { type: z, text: "正義曰：釋“有命無咎”之義，所以九四有命，得無咎者，由初六志意得行，守正而應於上，故九四之命得無咎。" }
      - { type: j, text: "九五：休否，大人吉。其亡其亡，系於苞桑。居尊得位，能休否道者也。施否於小人，否之休也。唯大人而後能然，故曰“大人吉”也。處君子道消之時，已居尊位，何可以安？故心存將危，乃得固也。" }
      - { type: z, text: "“九五休否”至“系於苞桑”。○正義曰：“休否”者，休，美也。謂能行休美之事於否塞之時，能施此否閉之道，遏絕小人，則是“否”之休美者也，故云“休否”。“大人吉”者，唯大人乃能如此而得吉也，若其凡人，則不能。“其亡其亡，系於苞桑”者，在道消之世，居於尊位而遏小人，必近危難，須恆自戒慎其意，常懼其危亡，言丁寧戒慎如此也。“系於苞桑”者，苞，本也。凡物系於桑之苞本則牢固也。若能“其亡其亡”，以自戒慎，則有“系於苞桑”之固，無傾危也。○注“心存將危”。○正義曰：“心存將危”，解“其亡其亡”之義。身雖安靜，心意常存將有危難，但念“其亡其亡”，乃得固者，即“系於苞桑”也。必云“苞桑”者；取會韻之義。又桑之為物，其根眾也。眾，則牢固之義。" }
      - { type: j, text: "《象》曰：大人之吉，位正當也。" }
      - { type: z, text: "正義曰：釋“大人吉”之義，言九五居尊得位，正所以當遏絕小人得其吉。" }
      - { type: j, text: "上九：傾否，先否後喜。先傾後通，故“後喜”也。始以傾為“否”，後得通乃喜。" }
      - { type: z, text: "正義曰：處否之極，否道已終，此上九能傾毀其否，故曰“傾否”也。“先否後喜”者，否道未傾之時，是“先否”之道；否道巳傾之後，其事得通，故曰“後有喜”也。" }
      - { type: j, text: "《象》曰：否終則傾，何可長也？" }
      - { type: z, text: "正義曰：釋“傾否”之義。否道巳終，通道將至。故“否”之終極，則傾損其否，何得長久？故云“何可長也”。" }
      - { type: j, text: "離下乾上。同人於野，亨，利涉大川，利君子貞。" }
      - { type: z, text: "正義曰：“同人”，謂和同於人。“於野，亨”者，野是廣遠之處，借其野名，喻其廣遠，言和同於人，必須寬廣，無所不同。用心無私，處非近狹，遠至於野，乃得亨進，故云“同人於野亨”。與人同心，足以涉難，故曰“利涉大川”也。與人和同，義涉邪僻，故“利君子貞”也。此“利涉大川”，假物象以明人事。" }
      - { type: j, text: "《彖》曰：同人，柔得位得中而應乎乾，曰“同人”。二為同人之主。" }
      - { type: z, text: "正義曰：此釋所以能同於人之義。“柔得位得中”者，謂六二也，上應九五，是“應於乾”也。" }
      - { type: j, text: "《同人》曰：“同人於野，亨，利涉大川。”乾，行也。所以乃能“同人於野，亨，利涉大川”，非二之所能也，是乾之所行，故特曰“同人曰”。" }
      - { type: z, text: "“同人曰”至“乾行也”。○正義曰：釋“同人於野，亨，利涉大川”之義。所以能如此者，由乾之所行也。言乾能行此德，非六二之所能也，故特云“同人曰”，乃云“同人於野，亨”，與諸卦別也。○注“故特曰同人曰”。○正義曰：“故特曰同人曰”者，謂卦之《彖》辭，發首即疊卦名，以釋其義，則以例言之，此發首應云“同人於野亨”，今此“同人於野亨”之上別云“同人曰”者，是其義有異。此同人卦名，以六二為主，故同人卦名系屬六二，故稱“同人曰”，猶言“同人卦曰”也。“同人於野，亨，利涉大川”，雖是《同人》卦下之辭，不關六二之義，故更疊“同人於野亨”之文，乃是乾之所行也。" }
      - { type: j, text: "文明以健，中正而應，君子正也。行健不以武，而以文明用之，相應不以邪，而以中正應之，君子正也，故曰“利君子貞”。" }
      - { type: z, text: "正義曰：此釋“君子貞”也。此以二象明之，故云“文明以健”。“中正而應”，謂六二、九五，皆居中得正，而又相應，是君子之正道也，故云“君子正”也。若以威武而為健，邪僻而相應，則非君子之正也。" }
      - { type: j, text: "唯君子為能通天下之志。君子以文明為德。" }
      - { type: z, text: "“唯君子為能通天下之志”。○正義曰：此更贊明君子貞正之義。唯君子之人於“同人”之時，能以正道通達天下之志，故利君子之貞。○注“君子以文明為德”。○正義曰：若非君子，則用威武。今卦之下體為離，故《彖》云“文明”，又云“唯君子能通天下之志”，是君子用文明為德也。謂文理通明也。" }
      - { type: j, text: "《象》曰：天與火，同人。天體在上，而火炎上，同人之義也。" }
      - { type: z, text: "正義曰：天體在上，火又炎上，取其性同，故云“天與火，同人”。" }
      - { type: j, text: "君子以類族辨物。君子小人，各得所同。" }
      - { type: z, text: "正義曰：族，聚也。言君子法此同人，以類而聚也。“辨物”謂分辨事物，各同其黨，使自相同，不間雜也。" }
      - { type: j, text: "初九：同人於門，無咎。居同人之始，為同人之首者也。無應於上，心無系吝，通夫大同，出門皆同。故曰“同人於門”也。出門同人，誰與為咎？" }
      - { type: z, text: "正義曰：“同人於門”者，居同人之首，無應於上，心無系吝，含弘光大，和同於人，在於門外，出門皆同，故云“無咎”也。" }
      - { type: j, text: "《象》曰：出門同人，又誰咎也？" }
      - { type: z, text: "正義曰：“又誰咎”者，釋“出門同人無咎”之義。言既心無系吝，出門逢人皆同，則誰與為過咎？" }
      - { type: j, text: "六二：同人於宗，吝。應在乎五，唯同於主，過主則否。用心扁狹，鄙吝之道。" }
      - { type: z, text: "正義曰：系應在五，而和同於人在於宗族，不能弘闊，是鄙吝之道，故《象》云“吝道”也。" }
      - { type: j, text: "《象》曰：“同人於宗”，吝道也。" }
      - { type: j, text: "九三：伏戎於莽，升其高陵，三歲不興。居同人之際，履下卦之極，不能包弘上下，通夫大同；物黨相分，欲乖其道，貧於所比，據上之應；其敵剛健，非力所當，故“伏戎於莽”，不敢顯亢也。“升其高陵”，望不敢進，量斯勢也，三歲不能興者也。三歲不能興，則五道亦以成矣，安所行焉？" }
      - { type: z, text: "“九三伏戎於莽”至“三歲不興”。○正義曰：“伏戎於莽”者，九三處下卦之極，不能包弘上下，通夫大同，欲下據六二，上與九五相爭也。但九五剛健，九三力不能敵，故伏潛兵戎於草莽之中，升其高陵。“三歲不興”者，唯升高陵以望前敵，量斯勢也，縱令更經三歲，亦不能興起也。○注“不能包弘上下”至“安所行焉”。○正義曰：“不能包弘上下，通夫大同”者，初九出門皆同，無所系著，是包弘上下，通夫大同。今九三欲下據六二，奪上之應，是不能包弘也。“物黨相分”者，謂同人之時，物各有黨類而相分別也；二則與五相親，與三相分別也。“欲乖其道，貪於所比，據上之應”者，言此九三欲乖其同人之道，不以類相從，不知二之從五，直以苟貪，與二之比近而欲取之，據上九五之應也。" }
      - { type: j, text: "《象》曰：“伏戎於莽”，敵剛也。“三歲不興”，安行也。安，辭也。" }
      - { type: z, text: "正義曰：“伏戎於莽敵剛”者，釋“伏戎於莽”之義。以其當□九五之剛，不敢顯亢，故“伏戎於莽”，“三歲不興”，“安行”者，釋“三歲不興”之義，雖經三歲，猶不能興起也。安，語辭也，猶言何也。既三歲不興，五道亦已成矣，何可行也？故云“安行也”。此假外物以明人事。" }
      - { type: j, text: "九四：乘其墉，弗克攻，吉。處上攻下，力能乘墉者也。履非其位，以與人爭，二自五應，三非犯己，攻三求二，尢而效之，違義傷理，無所不與，故雖乘墉而不克也。不克則反，反則得吉也。不克乃反，其所以得吉，“困而反則”者也。" }
      - { type: z, text: "正義曰：“乘其墉”者，履非其位，與人鬥爭，與三爭二，欲攻於三。既是上體，力能顯亢，故乘上高墉，欲攻三也。“弗克攻吉”者，三欲求二，其事已非。四又效之，以求其二，違義傷理，無所不與，雖復乘墉，不能攻三也。“吉”者，既不能攻三，能反自思愆，以從法則，故得吉也。此爻亦假物象也。" }
      - { type: j, text: "《象》曰：“乘其墉”，義弗克也。其吉，則困而反則也。" }
      - { type: z, text: "正義曰：“乘其墉義弗克也”者，釋不克之義。所以乘墉攻三不能克者，以其違義，眾所不從，故云“義不克”也。“其吉則困而反則”者，釋“其吉”之義。所以得“其吉”者，九四則以不克，困苦而反歸其法則，故得吉也。" }
      - { type: j, text: "九五：同人先號咷，而後笑，大師克相遇。《彖》曰：“柔得位得中，而應乎乾，曰同人。”然則體柔居中，眾之所與；執剛用直，無所未從，故近隔乎二剛，未獲厥志，是以“先號咷”也。居中處尊，戰必克勝，故“後笑”也。不能使物自歸而用其強直，故必須大師克之，然後相遇也。" }
      - { type: z, text: "正義曰：“同人先號咷”者，五與二應，用其剛直，無所未從，故九五共二，欲相和同，九三、九四，與之競二也。五未得二，故志未和同於二，故“先號咷”也。“而後笑”者，處得尊位，戰必克勝，故“後笑”也。“大師克相遇”者，不能使物自歸己，用其剛直，必以大師與三、四戰克，乃得與二相遇。此爻假物象以明人事。" }
      - { type: j, text: "《象》曰：同人之先，以中直也。大師相遇，言相剋也。" }
      - { type: z, text: "正義曰：“同人之先以中直”者，解“先號咷”之意，以其用中正剛直之道，物所未從，故“先號咷”也。但《象》略“號咷”之字，故直云“同人之先以中直”也。“大師相遇言相剋”者，釋“相遇”之義，所以必用大師，乃能相遇也。以其用大師與三四相伐而得克勝，乃與二相遇，故言“相剋”也。" }
      - { type: j, text: "上九：同人於郊，無悔。郊者，外之極也。處“同人”之時，最在於外，不獲同志，而遠於內爭，故雖無悔吝，亦未得其志。" }
      - { type: z, text: "“上九同人於郊無悔”。○正義曰：“同人於郊”者，處同人之極，最在於外，雖欲“同人”，人必疏己，不獲所同，其志未得。然雖陽在於外，遠於內之爭訟，故無悔吝也。○注“不獲同志”至“未得其志”。○正義曰：“不獲同志”者，若彼此在內相同，則獲其同志意也。若已為郊境之人，而與相同，人未親己，是“不獲同志”也。“遠於內爭”者，以外而同，不於室家之內，是遠於內爭也。以遠內爭，故無悔吝。以在外郊，故未得志也。" }
      - { type: j, text: "《象》曰：“同人於郊”，志未得也。凡處同人而不泰焉，則必用師矣。不能大通，則各私其黨而求利焉。楚人亡弓，不能亡楚。愛國愈甚，益為它災。是以同人不弘剛健之爻，皆至用師也。" }
      - { type: z, text: "“《象》曰同人於郊志未得也”。正義曰：釋“同人於郊”之義。同人在郊境遠處，與人疏遠，和同之志，猶未得也。○注“凡處同人”至“用師也”。○正義曰：“凡處同人而不泰焉則必用師矣”者，王氏注意非止上九一爻，乃總論同人一卦之義。去初上而言，二有同宗之吝，三有“伏戎”之禍，四有不克之困，五有“大師”之患，是處“同人”之世，無大通之志，則必用師矣。“楚人亡弓，不能亡楚。愛國愈甚，益為它災”者，案《孔子家語·弟子好生篇》云：“楚昭王出游，亡烏號之弓，左右請求之。王曰：‘楚人亡弓，楚得之，又何求焉。’孔子聞之曰：‘惜乎！其志不大也。不曰人亡弓，人得之，何必楚也。’”昭王名軫，哀六年，吳伐陳，楚救陳，在城父卒。此愛國而致它災也。引此者，證同人不弘皆至用師矣。" }
      - { type: j, text: "乾下離上。大有：元亨。不大通，何由得“大有”乎？“大有”則必元亨矣。" }
      - { type: z, text: "正義曰：柔處尊位，陽並應，大能所有，故稱“大有”。既能“大有”，則其物大得亨通，故云“大有元亨”。" }
      - { type: j, text: "《彖》曰：大有，柔得尊位大中，而上下應之，曰“大有”。處尊以柔，居中以大，體無二陰以分其應，上下應之，靡所不納，大有之義也。" }
      - { type: z, text: "正義曰：釋此卦稱“大有”之義。“大中”者，謂六五處大以中，柔處尊位，是其大也。居上卦之內，是其中也。" }
      - { type: j, text: "其德剛健而文明，應乎天而時行，是以“元亨”。德應於天，則行不失時矣。剛健不滯，文明不犯，應天則大，時行無違，是以“元亨”。" }
      - { type: z, text: "“其德剛健”至“是以元亨”。○正義曰：釋“元亨”之義。“剛健”謂乾也。“文明”謂離也。“應乎天而時行”者，褚氏、莊氏云：“六五應《乾》九二。”亦與五為體，故云“應乎天”也。德應於天，則行不失時，與時無違，雖萬物皆得亨通，故云“是以元亨”。注“剛健不滯”至“是以元亨”。○正義曰：“剛健不滯”者，剛健則物不擁滯也。“文明不犯”者，文則明粲而不犯於物也。“應天則大”者，能應於天則盛大也。“時行無違”者，以時而行，物無違也。以有此諸事，故大通而“元亨”也。" }
      - { type: j, text: "《象》曰：火在天上，“大有”。君子以遏惡揚善，順天休命。《大有》，包容之象也。故遏惡揚善，成物之性，順天休命，順物之命。" }
      - { type: z, text: "正義曰：“君子以遏惡揚善”者，“大有”包容之義，故君子象之，亦當包含遏匿其惡，褒揚其善，順奉天德，休美物之性命，巽順含容之義也。不云天在火下而云“火在天上”者，天體高明，火性炎上，是照耀之物而在於天上，是光明之甚，無所不照，亦是包含之義，又為揚善之理也。" }
      - { type: j, text: "初九：無交害。匪咎，艱則無咎。以夫剛健為大有之始，不能履中，滿而不溢，術斯以往，後害必至。其欲匪咎，“艱則無咎也”。" }
      - { type: z, text: "“初九”至“艱則無咎”。○正義曰：以夫剛健為大有之始，不能履中謙退，雖無交切之害，久必有兇。其欲“匪咎”，能自艱難其志，則得“無咎”，故云“無交害，匪咎，艱則無咎”也。○注“不能履中”至“無咎也”。○正義曰：“不能履中，滿而不溢”者，初不在二位，是不能履中。在大有之初，是盈滿，身行剛健，是溢也，故云“不能履中滿而不溢”也。" }
      - { type: j, text: "《象》曰：大有初九，無交害也。" }
      - { type: j, text: "九二：大車以載，任重而不危。" }
      - { type: z, text: "“九二大車以載”。○正義曰：“大車以載”者，體是剛健，而又居中，身被委任，其任重也。能堪受其任，不有傾危，猶若大車以載物也。此假外象以喻人事。○注“任重而不危”。○正義曰：釋“大車以載”之意。大車謂牛車也。載物既多，故云“任重”。車材彊壯，故不有傾危也。" }
      - { type: j, text: "有攸往，無咎。健不違中，為五所任，任重不危，致遠不泥，故可以往而“無咎”也。" }
      - { type: z, text: "正義曰：堪當重任，故有所往無咎者，以居失其位，嫌有兇咎，故云“無咎”也。" }
      - { type: j, text: "《象》曰：“大車以載”，積中不敗也。" }
      - { type: z, text: "正義曰：“積中不敗”者，釋“大車以載”之義。物既積聚，身有中和，堪受所積之聚在身上，上不至於敗也。" }
      - { type: j, text: "九三：公用亨於天子，小人弗克。處“大有”之時，居下體之極，乘剛健之上，而履得其位，與五同功，威權之盛，莫此過焉。公用斯位，乃得通乎天子之道也。小人不克，害可待也。" }
      - { type: z, text: "“九三”至“小人弗克”。○正義曰：“公用亨於天子”者，九三處“大有”之時，居下體之極，乘剛健之上，履得其位，與五同功。五為王位，三既與之同功，則威權之盛，莫盛於此，乃得通乎天子之道，故云“公用亨於天子”。“小人弗克”者，小人德劣，不能勝其位，必致禍害，故云“小人不克”也。。○注“與五同功”至“莫此過焉”。○正義曰：“與五同功”者，《系辭》云：“三與五同功”。此云“與五同功”，謂五為王位，三既能與五之同功，則威權與五相似，故云“威權之盛，莫此過焉”。" }
      - { type: j, text: "《象》曰：“公用亨於天子”，小人害也。" }
      - { type: j, text: "九四：匪其彭，無咎。既失其位，而上近至尊之威，下比分權之臣，其為懼也，可謂危矣。唯夫有聖知者，乃能免斯咎也。三雖至盛，五不可舍，能辯斯數，專心承五，常匪其旁，則“無咎”矣。旁謂三也。" }
      - { type: z, text: "“九四匪其彭無咎”。○正義曰：“匪其彭無咎”者，匪，非也。彭，旁也。謂九三在九四之旁，九四若能專心承五，非取其旁，言不用三也。如此乃得“無咎”也。既失其位，上近至尊之威，下比分權之臣，可謂危矣。能棄三歸五，得“無咎”也。" }
      - { type: j, text: "《象》曰：“匪其彭，無咎”，明辯晢也。明猶才也。" }
      - { type: z, text: "正義曰：“明辯晢也”者，釋“匪其彭無咎”之義。明猶才也。九四所以能去其旁之九三者，由九四才性辯而晢知，能斟酌事宜，故云“明辯晢”也。" }
      - { type: j, text: "六五：厥孚交如，威如，吉。君尊以柔，處大以中，無私於物，上下應之，信以發志，故其孚交如也。夫不私於物，物亦公焉。不疑於物，物亦誠焉。既公且信，何難何備？不言而教行，何為而不威如？為“大有”之主，而不以此道，吉可得乎？" }
      - { type: z, text: "正義曰：“六五，厥孚交如”者，“厥”，其也。“孚”，信也。“交”謂交接也。“如”，語辭也。六五居尊以柔，處大以中，無私於物，上下應之，故其誠信，物來交接，故云“厥孚交如”也。“威如吉”者，威，畏也。既誠且信，不言而教行，所為之處，人皆畏敬，故云“威如”。以用此道，故得吉也。" }
      - { type: j, text: "《象》曰：“厥孚交如”，信以發志也。“威如”之吉，易而無備也。" }
      - { type: z, text: "正義曰：“信以發志”者，釋“厥孚交如”之義。由巳誠信，發起其志，故上下應之，與之交接也。“威如之吉，易而無備”者，釋“威如之吉”之義。所以威如得吉者，以已不私於物，唯行簡易，無所防備，物自畏之，故云“易而無備”也。" }
      - { type: j, text: "上九：自天祐之，吉無不利。“大有”，豐富之世也。處“大有”之上而不累於位，志尚乎賢者也。餘爻皆乘剛，而巳獨乘柔順也。五為信德，而巳履焉，履信之謂也。雖不能體柔，而以剛乘柔，思順之義也。居豐有之世，而不以物累其心，高尚其志，尚賢者也。爻有三德，盡夫助道，故《系辭》具焉。" }
      - { type: z, text: "“上九”至“無不利”。○正義曰：釋所以“大有”。上九而得吉者，以有三德，從天巳下，悉皆祐之，故云“自天祐之”。○注“不累於位”至“盡夫助道”。○正義曰：“不累於位，志尚乎賢”者，既居豐富之時，應須以富有為累也。既居無位之地，不以富有縈心，是不系累於位。既能清靜高絜，是慕尚賢人行也。“爻有三德”者，“五為信德，而巳履焉，履信之謂”，是一也。“以剛乘柔，思順之義”，是二也。“不以物累於心，高尚其志，尚賢者”，是三也。“爻有三德，盡夫助道”者，天尚祐之，則無物不祐，故云“盡夫助道”也。" }
      - { type: j, text: "《象》曰：大有上吉，自天祐也。" }
      - { type: j, text: "艮下坤上。謙：亨。君子有終。" }
      - { type: z, text: "正義曰：“謙”者，屈躬下物，先人後己，以此待物，則所在皆通，故曰“亨”也。小人行謙則不能長久，唯“君子有終”也。然案謙卦之象，“謙”為諸行之善，是善之最極，而不言元與利貞及吉者，元是物首也，利、貞是幹正也。於人既為謙退，何可為之首也？以謙下人，何以幹正於物？故不云元與利、貞也。謙必獲吉，其吉可知，故不言之。況《易經》之體有吉理可知而不言吉者，即此《謙卦》之繇及《乾》之九五“利見大人”，是吉理分明，故不云“吉”也。諸卦言“吉”者，其義有嫌者，爻兼善惡也。若行事有善，則吉乃隨之。若行事有惡，則不得其吉。諸稱“吉”者，嫌其不言，故稱“吉”也。若坤之六五，及泰之六五，並以陰居尊位，若不行此事，則無吉，若行此事，則得其吉，故並稱“元吉”。其餘皆言吉，事亦仿此。亦有大人為吉，於小人為兇，若《否》之九五云：休否，大人吉”是也。或有於小人為吉，大人為兇，若屯之九五“小貞吉，大貞兇”，及《否》之六三“包承，小人吉”之類是也。亦有其吉灼然而稱“吉”者，若《大有》上九“自天祐之，吉無不利”之類是也。但《易》之為體，不可以一為例。今各隨文解之，義具諸卦之下。今《謙卦》之繇，其吉可知也。既不云“吉”，何故初六、六二及九三並云“吉”者？《謙卦》是總諸六爻，其善既大，故不須云“吉”也。六爻各明其義，其義有優劣，其德既不嫌其不吉，故須“吉”以明之也。" }
      - { type: j, text: "《彖》曰：謙，亨，天道下濟而光明，地道卑而上行。天道虧盈而益謙，地道變盈而流謙，鬼神害盈而福謙，人道惡盈而好謙。謙尊而光，卑而不可逾，君子之終也。" }
      - { type: z, text: "“彖曰”至“君子之終也”。○正義曰：“謙亨，天道下濟而光明，地道卑而上行”者，釋“亨”義也。欲明天地上下交通，坤體在上，故言“地道卑而上行”也。其地道既上行，天地相對，則“天道下濟”也。且艮為陽卦，又為山。天之高明，今在下體，亦是天道下濟之義也。“下濟”者，謂降下濟生萬物也。而“光明”者，謂三光垂耀而顯明也。“地道卑而上行”者，地體卑柔而氣上行，交通於天以生萬物也。“天道虧盈而益謙”者，從此巳下，廣說謙德之美，以結君子能終之義也。“虧”謂減損，減損盈滿而增益謙退。若日中則昃，月盈則食，是虧減其盈。盈者虧減，則謙者受益也。“地道變盈而流謙”者，丘陵川穀之屬，高者漸下，下者益高，是改變“盈”者，流佈“謙”者也。“鬼神害盈而福謙”者，驕盈者被害，謙退者受福，是“害盈而福謙”也。“人道惡盈而好謙”者，盈溢驕慢，皆以惡之；謙退恭巽，悉皆好之。“謙尊而光，卑而不可逾”者，尊者有謙而更光明盛大，卑謙而不可逾越，是君子之所終也。言君子能終其謙之善事，又獲謙之終福，故云“君子之終”也。" }
      - { type: j, text: "《象》曰：地中有山，謙。君子以裒多益寡，稱物平施。多者用謙以為裒，少者用謙以為益，隨物而與，施不失平也。" }
      - { type: z, text: "“《象》曰”至“稱物平施”。正義曰：“裒多”者，君子若能用此謙道，則裒益其多，言多者得謙，物更裒聚，彌益多也。故云“裒多”，即謙尊而光也，是尊者得謙而光大也。“益寡”者，謂寡者得謙而更進益，即卑而不可逾也。是卑者得謙而更增益，不可逾越也。“稱物平施”者，稱此物之多少，均平而施，物之先多者而得其施也，物之先寡者，而亦得其施也。故云：“稱物平施也。此謙卦之象以山為主是於山為謙於地為不謙，應言“山在地中”。今乃云“地中有山”者，意取多之與少皆得其益，似“地中有山”，以包取其物以與於人，故變其文也。○注“多者用謙”至“不失平也”。正義曰：“多者用謙以為裒”者，《爾雅·釋詁》云：“裒，聚也”。於先多者，其物雖多，未得積聚，以謙故益其物更多而積聚，故云“多者用謙以為裒”也。“少者用謙以為益”者，其物先少，今既用謙而更增益，故云“用謙以為益”也。“隨物而與”者，多少俱與，隨多隨少，而皆與也。“施不失平”者，多者亦得施恩，少者亦得施恩，是“施不失平”也。言君子於下若有謙者，官之先高，則增之榮秩，位之先卑，亦加以爵祿，隨其官之高下，考其謙之多少，皆因其多少而施與之也。" }
      - { type: j, text: "初六：謙謙君子，用涉大川，吉。處謙之下，謙之謙者也。能體“謙謙”，其唯君子。用涉大難，物無害也。" }
      - { type: z, text: "正義曰：“謙謙君子”者，能體謙謙，唯君子者能之。以此涉難，其吉宜也。“用涉大川”，假象言也。" }
      - { type: j, text: "《象》曰：“謙謙君子”，卑以自牧也。牧，養也。" }
      - { type: z, text: "正義曰：“卑以自牧”者，牧，養也，解“謙謙君子”之義，恆以謙卑自養其德也。" }
      - { type: j, text: "六二：鳴謙，貞吉。鳴者，聲名聞之謂也。得位居中，謙而正焉。" }
      - { type: z, text: "正義曰：“鳴謙”者，謂聲名也。處正得中，行謙廣遠，故曰“鳴謙”，正而得吉也。" }
      - { type: j, text: "《象》曰：“鳴謙貞吉”，中心得也。" }
      - { type: z, text: "正義曰：“中心得”者，鳴聲中吉，以中和為心，而得其所，鳴謙得中吉也。" }
      - { type: j, text: "九三：勞謙，君子有終吉。處下體之極，履得其位，上下無陽以分其民，眾陰所宗，尊莫先焉。居謙之世，何可安尊？上承下接，勞謙匪解，是以吉也。" }
      - { type: z, text: "正義曰：“勞謙君子”者，處下體之極，履得其位，上下無陽以分其民，上承下接，勞倦於謙也。唯君子能終而得吉也。" }
      - { type: j, text: "《象》曰：“勞謙君子”，萬民服也。" }
      - { type: z, text: "正義曰：“萬民服”者，釋所以勞謙之義。以上下群陰，象萬民皆來歸服，事須引接，故疲勞也。" }
      - { type: j, text: "六四：無不利，捴謙。處三之上，而用謙焉，則是自上下下之義也。承五而用謙順，則是上行之道也。盡乎奉上下下之道，故“無不利”。“指捴”皆謙，不違則也。" }
      - { type: z, text: "正義曰：“無不利”者，處三之上而用謙焉，則是自上下下之義。承五而用謙順，則是上行之道。盡乎奉上下下之道，故無所不利也。" }
      - { type: j, text: "《象》曰：“無不利，捴謙”，不違則也。" }
      - { type: z, text: "正義曰：“指捴皆謙不違則”者，釋“無不利捴謙”之義。所以“指捴皆謙”者，以不違法則，動合於理，故無所不利也。" }
      - { type: j, text: "六五：不富以其鄰，利用侵伐，無不利。居於尊位，用謙與順，故能不富而用其鄰也。以謙順而侵伐，所伐皆驕逆也。" }
      - { type: z, text: "正義曰：“不富以其鄰”者，以，用也。凡人必將財物周贍鄰里，乃能用之。六五居於尊位，用謙與順，鄰自歸之，故不待豐富能用其鄰也。“利用侵伐無不利”者，居謙履順，必不濫罰無罪。若有驕逆不服，則須伐之，以謙得眾，故“利用侵伐，無不利”者也。" }
      - { type: j, text: "《象》曰：“利用侵伐”，徵不服也。" }
      - { type: j, text: "上六：鳴謙。利用行師徵邑國。最處於外，不與內政，故有名而巳，志功未得也。處外而履謙順，可以邑一國而巳。" }
      - { type: z, text: "正義曰：“鳴謙”者，上六最處於外，不與內政，不能於實事而謙，但有虛名聲聞之謙，故云“鳴謙”。志欲立功，未能遂事，其志未得。既在外而行謙順，唯利用行師征伐外旁國邑而巳，不能立功在內也。" }
      - { type: j, text: "《象》曰：“鳴謙”，志未得也。可用行師，“徵邑國”也。夫吉凶悔吝，生乎動者也。動之所起，興於利者也。故飲食必有訟，訟必有眾起，末有居眾人之所惡而為動者所害，處不競之地而為爭者所奪，是以六爻雖有失位，無應乘剛，而皆無兇咎悔吝者，以謙為主也。“謙尊而光，卑而不可逾”，信矣哉！" }
      - { type: z, text: "“《象》曰鳴謙”至“徵邑國也”。○正義曰：“志未得”者，釋“鳴謙”之義也。所以但有聲鳴之謙，不能實爭立功者，以其居在於外，其內立功之志，猶未得也。“可用行師徵邑國”者，釋“行師徵邑國”之意。《經》言“利用”，《象》改“利”為“可”者，言內志雖未得，猶可在外興行軍師徵邑國也。○注“動之所起興於利者也”。○正義曰：“動之所起興於利”者，凡人若不見利，則心無所動。今動之所以起者，見利乃動，故云“興於利”也。“飲食必有訟，訟必有眾起”者，欲明為利乃有動，動而致訟，訟則起兵。故《序卦》“需”為飲食，飲食必有訟，故需卦之後次訟卦也。爭訟必興兵，故訟卦之後次師卦也。" }
      - { type: j, text: "坤下震上。豫：利建侯行師。" }
      - { type: z, text: "正義曰：謂之豫者，取逸豫之義，以和順而動，動不違眾，眾皆說豫，故謂之豫也。動而眾說，故可利建侯也。以順而動，不加無罪，故可以行師也。無四德者，以逸豫之事不可以常行，時有所為也。縱恣寬暇之事不可長行以經邦訓俗，故無元亨也。逸豫非幹正之道，故不云“利貞”也。莊氏云：“建侯，即元亨也。行師，即利貞也。”案：《屯卦》“元亨利貞”之後，別云“利建侯”，則“建侯”非“元亨”也。恐莊氏說非也。" }
      - { type: j, text: "《彖》曰：豫，剛應而志行，順以動，豫。豫順以動，故天地如之，而況“建侯行師”乎？天地以順動，故日月不過，而四時不忒，聖人以順動，則刑罰清而民服。豫之時義大矣哉！" }
      - { type: z, text: "“《彖》曰豫剛應而志行”至“大矣哉”。○正義曰：“豫，剛應而志行，順以動，豫”者，“剛”謂九四也；“應”謂初六也。既陰陽相應，故“志行”也。此就爻明豫義。順以動，坤在下，是順也。震在上，是動也。以順而動，故豫也。此以上下二象明豫義也。自此巳上，釋豫卦之理也。“豫順以動，故天地如之，而況建侯行師乎？”者，此釋“利建侯行師”也。若聖人和順而動，合天地之德，故天地亦如聖人而為之也。天地尊大而遠，神之難者猶尚如之，況於封建諸侯、行師征伐乎？難者既從，易者可知。若“建侯”能順動，則人從之。“行師”能順動，則眾從之。天地以順動，故日月不過而四時不忒。自此以下，廣明天地聖人順動之功也。若天地以順而動，則日月不有過差，依其晷度，四時不有忒變，寒暑以時。“聖人以順動，則刑罰清而民服”者，聖人能以理順而動，則不赦有罪，不濫無辜，故“刑罰清”也。刑罰當理，故人服也。“豫之時義大矣哉”者，歎美為豫之善，言於逸豫之時，其義大矣。此歎卦也。凡言不盡意者，不可煩文其說，且歎之以示情，使後生思其餘蘊，得意而忘言也。然歎卦有三體：一直歎時，如“大過之時大矣哉”之例是也；二歎時並用，如“險之時用大矣哉”之例是也；三歎時並義，“豫之時義大矣哉”之例是也。夫立卦之體，各象其時，時有屯夷，事非一揆，故爻來適時，有兇有吉。人之生世，亦復如斯，或逢治世，或遇亂時，出處存身，此道豈小？故曰“大矣哉”也。然時運雖多，大體不出四種者：一者治時，“頤養”之世是也；二者亂時，“大過”之世是也；三者離散之時，“解緩”之世是也；四者改易之時，“革變”之世是也。故舉此四卦之時為歎，餘皆可知。言“用”者，謂適時之用也。雖知居時之難，此事不小，而未知以何而用之耳。故坎、睽、蹇之時宜用君子，小人勿用。用險取濟，不可為常，斟酌得宜，是用時之大略。舉險難等三卦，餘從可知矣。又言“義”者，《姤卦》注云：“凡言義者，不盡於所見，中有意謂”者也。是其時皆有義也。略明佚樂之世，相隨相遇之日，隱遯羈旅之時，凡五卦，其義不小，則餘卦亦可知也。今所歎者十二卦，足以發明大義，恢弘妙理者也。凡於《彖》之末歎云“大哉”者，凡一十二卦。若《豫》、《旅》、《遯》、《姤》凡四卦，皆云“時義”。案：《姤卦》注云：“凡言義者，不盡於所見，中有意謂。”以此言之，則四卦卦各未盡其理，其中更有餘意，不可盡申，故總云“義”也。《隨》之一卦亦言“義”，但與四卦其文稍別。四卦皆云“時義”，《隨卦》則“隨時之義”者，非但其中別有義意，又取隨逐其時，故變云“隨時之義大矣哉！《睽》、《蹇》、《坎》此三卦皆云“時用”。案：《睽卦》注云：“睽離之時，非小人之所能用。”《蹇卦》亦云“非小人之所能用”。此二卦言“大矣哉”者，則是大人能用，故云：“大矣哉”！其中更無餘義，唯大人能用，故云“用”不云“義”也。《坎卦》“時用”，則與《睽》、《蹇》稍別，故注云“非用之常，用有時也”。謂《坎》險之事，時之須用，利益乃大，與《睽》、《蹇》“時用”文同而義異也。《解》之“時”，《革》之“時”，《頤》之“時”，《大過》之“時”，此四卦直云“時”，不云“義”與“用”也。案：《解卦》注難解之時，非治難時，故不言“用”。體盡於《解》之名，無有幽隱，故不曰“義”，以此注言之，直云“時”者，尋卦之名則其意具盡，中間更無餘義，故不言“義”，其卦名之事，事巳行了，不須別有所用，故《解》、《革》及《頤》事巳行了，不須言“用”。唯《大過》稱“時”，注云：“君子有為之時。”與《解》、《革》、《頤》其理稍別。《大過》是有用之時，亦直稱“時”者，取“大過”之名，其意即盡，更無餘意，故直稱“時”，不云“義”，又略不云“用”也。" }
      - { type: j, text: "《象》曰：雷出地奮，豫。先王以作樂崇德。殷薦之上帝，以配祖考。" }
      - { type: z, text: "正義曰：案諸卦之象，或云“云上於天”，或云“風行天上”，以類言之，今此應云“雷出地上”，乃云“雷出地奮豫”者，雷是陽氣之聲，奮是震動之狀。雷既出地，震動萬物，被陽氣而生，各皆逸豫，故曰“雷出地奮，豫”也。“先王以作樂崇德”者，雷是鼓動，故先王法此鼓動而作樂，崇盛德業，樂以發揚盛德故也。“殷薦之上帝”者，用此殷盛之樂，薦祭上帝也，象雷出地而向天也。“以配祖考”者，謂以祖考配上帝。用祖用考，若周夏正郊天配靈威仰，以祖后稷配也；配祀明堂五方之帝，以考文王也，故云：“以配祖考”也。" }
      - { type: j, text: "初六：鳴豫，兇。處豫之初，而特得志於上，樂過則淫，志窮則兇，豫何可鳴？" }
      - { type: z, text: "正義曰：“鳴豫”者，處豫之初，而獨得應於四，逸豫之甚，是聲鳴於豫。但逸樂之極，過則淫荒。獨得於樂，所以“兇”也。" }
      - { type: j, text: "《象》曰：“初六鳴豫”，志窮兇也。" }
      - { type: z, text: "正義曰：釋“鳴豫”之義。而初時鳴豫，後則樂志窮盡，故為“兇”也。" }
      - { type: j, text: "六二：介於石，不終日，貞吉。處豫之時，得位履中，安夫貞正，不求苟“豫”者也。順不苟從，豫不違中，是以上交不諂，下交不瀆。明禍福之所生，故不苟說；辯必然之理，故不改其操介如石焉。“不終日”明矣。" }
      - { type: z, text: "正義曰：“介於石”者，得位履中，安夫貞正，不苟求逸豫，上交不諂，下交不瀆，知幾事之初始，明禍福之所生，不苟求逸豫，守志耿介似於石。然見幾之速，不待終竟一日，去惡修善，相守正得吉也。" }
      - { type: j, text: "《象》曰：“不終日貞吉”，以中正也。" }
      - { type: z, text: "正義曰：釋“貞吉”之義，所以見其惡事，即能離去，不待終日守正吉者，以比六二居中守正，順不苟從，豫不違中，故不須待其一日終守貞吉也。" }
      - { type: j, text: "六三：盱豫悔，遲有悔。居下體之極，處兩卦之際，履非其位，承“動豫”之主。若其睢盱而豫，悔亦生焉。遲而不從，豫之所疾，位非所據，而以從豫進退，離悔宜其然矣。" }
      - { type: z, text: "正義曰“盱豫悔”者，六三履非其位，上承“動豫”之主。“盱”謂睢盱。睢盱者，喜說之貌。若睢盱之求豫，則悔吝也。“遲有悔”者，居豫之時，若遲停不求於豫，亦有悔也。" }
      - { type: j, text: "《象》曰：盱豫有悔，位不當也。" }
      - { type: z, text: "正義曰：解其“盱豫有悔”之義，以六三居不當位，進退不得其所，故“盱豫有悔”。但《象》載經文，多從省略。經有“盱豫有悔”、“遲有悔”，兩文具載，《象》唯云“盱豫有悔”，不言“遲”者，略其文也。故直云“盱豫”。舉其欲進，略云“有悔”，舉其遲也。" }
      - { type: j, text: "九四：由豫，大有得。勿疑，朋盍簪。處豫之時，居動之始，獨體陽爻，眾陰所從，莫不由之以得其豫，故曰“由豫，大有得”也。夫不信於物，物亦疑焉，故勿疑則朋合疾也。盍，合也。簪，疾也。" }
      - { type: z, text: "正義曰：“由豫大有得”者，處豫之時，居動之始，獨體陽爻，為眾陰之所從，莫不由之以得其豫，故云“由豫”也。“大有得”者，眾陰皆歸，是大有所得。“勿疑朋盍簪”者，盍，合也。簪，疾也。若能不疑於物，以信待之，則眾陰群朋合聚而疾來也。" }
      - { type: j, text: "《象》曰：“由豫，大有得”，志大行也。" }
      - { type: z, text: "正義曰：“釋由豫大有”之意。眾陰既由之而豫，大有所得，是志意大同也。" }
      - { type: j, text: "六五：貞疾，恆不死。四以剛動為豫之主，專權執制，非巳所乘，故不敢與四爭權，而又居中處尊，未可得亡，是以必常至於“貞疾，恆不死”而巳。" }
      - { type: z, text: "正義曰：四以剛動為豫之主，專權執制，非已所乘，故不敢與四專權。而又居中處尊，未可得亡滅之，是以必常至於貞疾，恆得不死而巳。" }
      - { type: j, text: "《象》曰：六五，“貞疾”，乘剛也。“恆不死”，中未亡也。" }
      - { type: z, text: "正義曰：“六五貞疾乘剛”者，解“貞疾”之義。以乘九四之剛，故正得其疾，恆不死也。“中未亡”者，以其居中處尊，未可亡滅之也。" }
      - { type: j, text: "上六，冥豫成，有渝無咎。處“動豫”之極，極豫盡樂，故至於“冥豫成”也。過豫不巳，何可長乎？故必渝變然後無咎。" }
      - { type: z, text: "正義曰：“處動豫之極，極豫盡樂”，乃至於冥昧之豫而成就也。如俾晝作夜，不能休巳，滅亡在近。“有渝無咎”者，渝，變也。若能自思改變，不為“冥豫”，乃得“無咎”也。" }
      - { type: j, text: "《象》曰：“冥豫”在上，何可長也？" }
      - { type: j, text: "上一頁 目錄頁 下一頁" }
