# 爾雅注疏卷4（邢昺疏）：j 為經文＋晉郭璞注，z 為疏文。
sections:
  - id: juan4
    name: 正文
    blocks:
      - { type: j, text: "卬、吾、台、予、朕、身、甫、余、言，我也。（卬犹姎也，语之转耳。《书》曰：\"非台小子。\"古者贵贱皆自称朕。《礼记》曰：\"授政任功，曰'予一人'\"，\"畛於鬼神，曰'有某甫'。\"言，见《诗》。○卬，五刚切。台音怡。下同）" }
      - { type: z, text: "\"卬吾\"至\"我也\"。○释曰：我者，施身自谓也。此皆我之别称也。卬者，郭云：\"卬犹姎也。语之转耳。\"《说文》云：\"女人称我曰姎。\"由其语转，故曰卬。《邶风•匏有苦叶》云：\"人涉卬否。\"吾者，孔子曰：\"吾自卫反鲁。\"身者，我之躬也。余者，《邶•谷风》云：\"伊余来塈。\"馀皆见注。○注\"书曰\"至\"见《诗》\"。○释曰：云\"《书》曰：非台小子\"者，《汤誓》文。云：\"古者贵贱皆自称朕\"者，《大禹谟》云：帝曰：\"朕宅帝位。\"禹曰：\"朕德罔克。\"屈原亦云：\"朕皇考曰伯庸。\"是贵贱皆自称朕。《史记》秦始皇二十六年定为至尊之称。汉因不改，以迄於今。云\"《礼记》云：授政任功曰予一人。畛於鬼神曰有某甫\"者，皆下《曲礼》文。云\"言见《诗》者，《周南•葛覃》云：\"言告师氏，言告言归。\"是也。" }
      - { type: j, text: "朕、余、躬，身也。（今人亦自呼为身）" }
      - { type: z, text: "\"朕、余、躬，身也\"。○释曰：身即我也。郭云：\"今人亦自呼为身。\"舍人曰：\"余，谦卑之身也。\"孙炎曰：\"余，舒迟之身也。\"僖九年《左传》云：齐侯曰：小白余。杜注云：\"小白，齐侯名；余，身也。\"《邶•谷风》云：\"我躬不阅。\"" }
      - { type: j, text: "台、朕、赉、畀、卜、阳，予也。（赉、卜、畀，皆赐与也。与犹予也，因通其名耳。《鲁诗》曰：\"阳如之何。\"今巴濮之人自呼阿阳。○畀，必二切。阳音晹。予音与）" }
      - { type: z, text: "\"台朕\"至\"予也\"。○释曰：予即与也。皆谓赐与。台者，遗与也，读与贻同。朕者，我与之也。赉、畀、卜皆赐与也。《说命》云：\"梦帝赉予良弼。\"《鄘风•干旄》云：\"何以畀之。\"《小雅•天保》云：\"君曰卜尔，万寿无疆。\"○注\"与犹\"至\"阿阳\"。○释曰：云\"与犹予也，因通其名耳\"者，《说文》云：\"与，党与也。\"\"予，推予前人也。象两手相与之形。\"今经典多以\"与\"为\"推予\"，故云因通其名耳。云\"《鲁诗》云：阳如之何\"者，《汉书•艺文志》云：鲁申公为诗训故，是为《鲁诗》。其经云\"阳如之何\"，申公以阳为予，故引之。云\"今巴濮之人自呼阿阳\"者，以时验而言也。" }
      - { type: j, text: "肃、延、诱、荐、餤、晋、寅、荩，进也。（《礼记》曰：\"主人肃客。\"《诗》曰：\"乱是用餤\"，\"王之荩臣\"。《易》曰：\"晋，进也。\"寅，未详。○餤音淡。荩音烬）" }
      - { type: z, text: "\"肃延\"至\"进也\"。○释曰：皆谓进道。延者，引而进之。《射义》云：\"子路出延射。\"诱者，道而进之也。《召南•野有死麕》云：\"吉士诱之。\"荐者，进献也。《月令》云：\"先荐寝庙。\"馀皆见注。○注\"礼记\"至\"进也\"。○释曰：云\"礼记曰：主人肃客\"者，上《曲礼》文也。郑注云：\"进客谓道之。\"云\"《诗》曰：乱是用餤\"者，《小雅•巧言》文。云\"王之荩臣\"者，《大雅•文王》文。云\"《易》曰：晋，进也\"者，《晋卦》彖辞也。" }
      - { type: j, text: "羞、饯、迪、烝，进也。（皆见《诗》、《礼》）" }
      - { type: z, text: "\"羞饯\"至\"进也\"。○释曰：谓进与也。羞者，《曲礼》云：\"闻子有客使某羞。\"饯者，进饮食之名也。迪者，以道而进也。烝者，《周颂•丰年》云：\"烝畀祖妣。\"" }
      - { type: j, text: "诏、亮、左、右、相，导也。（皆谓教导之）诏、相、导、左、右、助，勴也。（谓赞勉）亮、介、尚，右也。（绍介、劝尚，皆相佑助）左、右，亮也。（反覆相训，以尽其义。○相，息亮切。勴音虑）" }
      - { type: z, text: "\"诏亮\"至\"亮也\"。○释曰：诏者，《大宗伯》云：\"诏相王之大礼。\"亮者，《大雅•大明》云：\"凉彼武王。\"左、右者，《周南•关睢》云：\"左右流之。\"相者，《乡饮酒》云：\"相者二人。\"此皆谓教导之也。教导即赞勉也，故又为勴。《说文》云：\"勴，助也。\"不以力助，以心助也。郭云：\"绍介、劝尚，皆相佑助。\"孙炎曰：\"介者，相助之义。如人之左右手，故以介为左右也。\"《大雅•生民》云：\"攸介攸止。\"故转为右。左、右即亮也，亦皆谓佐助。反覆相训，以尽其义。亮、凉音义同。" }
      - { type: j, text: "缉、熙、烈、显、昭、晧、颎，光也。（诗曰：\"学有缉熙于光明。\"又曰：\"休有烈光。\"○颎，古迥切）" }
      - { type: z, text: "\"缉熙\"至\"光也\"。○释曰：显者，光明也。《大雅•假乐》云：\"显显令德。\"说文云：\"昭，日明也。\"《大雅•云汉》云：\"昭回于天。\"皓者，亦日光也。颎，火光也。《小雅•无将大车》云：\"不出于颎。\"○注\"《诗》曰\"至\"烈光\"。○释曰：云\"学有缉熙于光明\"者，《周颂•敬之》文。又曰\"休有烈光\"，《周颂•载见》文。" }
      - { type: j, text: "劼、巩、坚、笃、掔、虔、胶，固也。（劼、虔皆见《诗》、《书》。《易》曰：\"巩用黄牛之革，固志也。\"掔然亦牢固之意。○劼，苦黠切。掔音牵）" }
      - { type: z, text: "\"劼巩\"至\"固也\"。○释曰：皆牢固也。劼者，确固也。巩者，《说文》云：\"以革有所束也。\"坚者，刚強之固也。《论语》云：\"不曰坚乎，磨而不磷。\"笃者，厚也。物厚者牢固。掔者，掔亦牢固之意。虔者，恭之固也。胶者，所以固物。《小雅•隰桑》云：\"德音孔胶。\"○注\"劼虔\"至\"志也\"。○释曰：云\"劼、虔皆见《诗》、《书》\"者，《酒诰》云：\"劼毖殷献臣。\"《大雅•韩弈》云：\"虔共尔位。\"云\"《易》曰：巩用黄牛之革，固志也\"者，案《革卦》云：\"初九：巩用黄牛之革。\"《遯卦•六二•象》曰：\"执用黄牛，固志也。\"文与此异。然则郭云\"固志\"者，所以释《革卦》之\"巩\"，非谓《遯》之\"固志\"。" }
      - { type: j, text: "畴、孰，谁也。（《易》曰：\"畴离祉。\"○畴，直留切）" }
      - { type: z, text: "\"畴、孰，谁也\"。○释曰：皆谓语辞，不为义也。又犹言谁人也。《论语》云：\"君孰与不足。\"《陈风•墓门》云：\"谁昔然矣。\"○注\"《易》曰：畴离祉\"。○释曰：《否卦•九四》爻辞也。" }
      - { type: j, text: "暀暀、皇皇、藐藐、穆穆、休、嘉、珍、褘、懿、铄，美也。（自\"穆穆\"已上皆美盛之貌。其馀常语。○暀音旺。藐音邈。褘音衣）" }
      - { type: z, text: "\"暀暀\"至\"美也\"。○释曰：皆谓美盛也。少仪云：\"祭祀之美，齐齐皇皇。\"郑玄云：\"皇皇读如归往之往。\"彼言皇皇，则此暀暀也。《少仪》又云：\"言语之美，穆穆皇皇。\"《曲礼》云：\"天子穆穆，诸侯皇皇。\"郑注皆云：\"行容止之貌\"。然则皇皇、穆穆者，皆言语容止之美盛也。《大雅•崧高》云：\"既成藐藐。\"毛传云：\"藐藐，美貌。\"休者，《大禹谟》云：\"戒之用休。\"又曰：\"嘉乃丕绩。\"《儒行》云：\"席上之珍以待聘。\"褘者，叹美也。懿者，《周颂•时迈》云：\"我求懿德。\"铄者，《周颂•酌》篇：\"於铄王师。\"是皆谓美之常语尔。" }
      - { type: j, text: "谐、辑、协，和也。（《书》曰：\"八音克谐。\"《左传》曰：\"百姓辑睦。\"）关关、噰噰，音声和也。（皆鸟鸣相和）勰、燮，和也。（《书》曰：\"燮友柔克。\"○辑，集。噰，於恭反。勰音协）" }
      - { type: z, text: "\"谐辑\"至\"和也\"。○释曰：皆谓和同。协者，《说文》云：\"众之同和也。\"关关、噰噰者，皆鸟鸣音声相和也。《周南•关雎》云：\"关关雎鸠。\"《邶风•匏有苦叶》云：\"噰噰鸣雁。\"勰即古文协字。○注\"《书》曰\"至\"柔克\"。○释曰：云\"《书》曰：八音克谐\"，《虞书•舜典》文。云\"《左传》曰：百姓辑睦\"者，案僖十五年及成十六年皆云：\"群臣辑睦。\"其是乎！云\"《书》曰：燮友柔克\"者，《周书•洪范》文" }
      - { type: j, text: "从、申、神、加、弼、崇，重也。（随从、弼辅、增崇，皆所以为重叠。神所未详。○重，直龙切）" }
      - { type: z, text: "\"从申\"至\"重也\"。○释曰：随从、申重、加弼、弼辅、崇充，皆所以为重叠也。《大雅•凫鷖》云：\"福禄来崇。\"" }
      - { type: j, text: "觳、悉、卒、泯、忽、灭、罄、空、毕、罄、歼、拔、殄，尽也。（觳，今直语耳。忽然，尽貌。今江东呼厌极为罄。馀皆见《诗》。○觳音学。罄，苦计切。歼音尖）" }
      - { type: z, text: "\"觳今\"至\"见《诗》\"。○释曰：此皆谓终尽。觳，今直语耳。忽然，尽貌。《左传》曰：\"皋陶庭坚不祀忽诸。\"云\"今江东呼厌极为罄\"者，以时验而言也。《说文》云：\"器中尽也。\"云\"馀皆见《诗》\"者，悉者，《说文》云：\"详尽也。\"卒者，终尽也。《卫风•日月》云：\"畜我不卒。\"泯者，灭尽也。《大雅•桑柔》云：\"靡国不泯。\"灭，绝尽也。《小雅•正月》云：\"宁或灭之。\"罄者，《说文》云：\"器中空也。\"《小雅•蓼莪》云：\"瓶之罄矣。\"空者，《小雅•大东》云：\"杼柚其空。\"毕者，《小雅•无羊》云：\"毕来既升。\"歼者，舍人曰：\"众之尽也。\"《秦风•黄鸟》云：\"歼我良人。\"拔者，搴除使尽也。殄者，《诗》云：\"邦国殄瘁。\"" }
      - { type: j, text: "苞、芜、茂，丰也。（苞丛、繁芜，皆丰盛）" }
      - { type: z, text: "\"苞、芜、茂，丰也\"。○释曰：皆丰盛也。苞者，草木丛生也。《禹贡》云：\"草木渐苞。\"芜者，繁芜也。《洪范》云：\"庶草蕃庑。\"芜、庑音义同。茂者，茂盛也。《小雅•天保》云：\"如松柏之茂。\"" }
      - { type: j, text: "揫、敛、屈、收、戢、蒐、裒、鸠、楼，聚也。（《礼记》曰：\"秋之言揫，揫，敛也。\"春猎为蒐，蒐者，以其聚人众也。《诗》曰：\"屈此群丑\"，\"原隰裒矣\"。《左传》曰：\"以鸠其民。\"楼犹今言拘楼，聚也。○揫，子由切。蒐音搜）" }
      - { type: z, text: "\"揫敛\"至\"聚也\"。○释曰：皆会聚也。敛者，率聚也。《礼记•大学》曰：\"百乘之家，不畜聚敛之臣。\"收者，《周颂•维天之命》云：\"我其收之。\"戢者，藏聚也。《周颂•时迈》云：\"载戢干戈。\"馀皆见注。○注\"《礼记》\"至\"聚也\"。○释曰：云\"礼记曰：秋之言揫，揫，敛也\"者，《乡饮酒义》文。云\"春猎为蒐，蒐者，以其聚人众也\"，\"春猎为蒐\"，《释天》文也。云\"《诗》曰：屈此群丑\"者，《鲁颂•泮水》文。云\"原隰裒矣\"者，《小雅•常棣》文。云\"《左传》曰：以鸠其民\"者，隐八年文。云\"楼犹今言拘楼，聚也\"者，以时验而言也。" }
      - { type: j, text: "肃、齐、遄、速、亟、屡、数、迅，疾也。（《诗》曰：\"仲山甫徂齐。\"○遄音船。亟，欺冀切。数音朔）" }
      - { type: z, text: "\"肃齐\"至\"疾也\"。○释曰：皆谓急疾也。肃者，《召南•小星》云：\"肃肃宵征。\"毛传云：\"肃肃，疾貌。\"齐者，壮疾也。遄者，《邶风•泉水》云：\"遄臻于卫。\"速者，《论语》云：\"无欲速。\"亟者（欺冀切），《论语》曰：\"好从事而亟失时。\"一云亟（居力切）。《大雅•灵台》云：\"匪亟其欲。\"屡者，《小雅•巧言》云：\"君子屡盟。\"数者，《祭义》云：\"祭不欲数。\"迅者，疾走也。《论语》云：\"迅雷风烈必变。\"○注\"《诗》曰：仲山甫徂齐\"。○释曰：《大雅•烝民》文。" }
      - { type: j, text: "寁、骏、肃、亟、遄，速也。（《诗》曰：\"不寁故也。\"骏犹迅速，亦疾也。○寁音昝。亟，居力切）" }
      - { type: z, text: "\"寁骏\"至\"速也\"。○释曰：速亦疾也。肃、亟、遄，转相训耳。骏者，犹迅也。《礼记•大传》云：\"逡奔走。\"骏、逡音义同。郑注云：\"疾奔走，言劝事也。\"○注\"诗曰：不寁故也\"。○释曰：《郑风•遵大路》文。" }
      - { type: j, text: "壑、阬阬、滕、徵、隍、漮，虚也。（壑，谿壑也。阬阬，谓阬堑也。隍，城池无水者。《方言》云：\"漮之言空也。\"皆谓丘墟耳。滕，徵未详。○阬音坑。漮音康）" }
      - { type: z, text: "\"壑阬\"至\"虚也\"。○释曰：皆谓空虚也。壑者，谿壑也。《大雅•韩弈》云：\"实墉实壑。\"阬阬者，坎陷之虚也。但重言耳。隍者，城池无水者。《易》曰：\"城复于隍。\"漮者，注引《方言》云：\"康之言空也。\"彼注云：\"漮窘，空貌。\"亦丘墟之空无。《小雅•宾之初筵》云：\"酌彼康爵。\"郑笺云：\"康，虚也。\"漮、康音义同。" }
      - { type: j, text: "黎、庶、烝、多、丑、师、旅，众也。（皆见《诗》）" }
      - { type: z, text: "\"黎庶\"至\"众也\"。○释曰：皆谓众夥也。注云\"皆见《诗》\"者，《大雅•云汉》云：\"周馀黎民\"、《灵台》云\"庶民子来\"、《烝民》云\"天生烝民\"、《周颂•载见》云\"思皇多祜\"、《大雅•绵》篇云\"戎丑攸行\"、《棫朴》云\"六师及之\"、《小雅•采芑》云\"振旅阗阗\"之类是也。" }
      - { type: j, text: "洋、观、裒、众、那，多也。（《诗》曰：\"薄言观者。\"又曰：\"受福不那。\"洋，溢，亦多貌）" }
      - { type: z, text: "\"洋观\"至\"多也\"。○释曰：皆谓重多也。洋者，洋溢，亦多貌。《鲁颂•閟宫》云：\"万舞洋洋。\"裒者，聚之多也。《易》曰：\"君子以裒多益寡。\"众者，《周颂•臣工》云：\"命我众人。\"○注\"诗曰\"至\"不那\"。○释曰\"《诗》曰：薄言观者\"，《小雅•采绿》文。\"又曰：受福不那\"者，《桑扈》文。" }
      - { type: j, text: "流、差、柬，择也。（皆选择。见《诗》。○差音乂。柬音简）" }
      - { type: z, text: "\"流、差、柬，择也\"。○释曰：皆选择也。《周南•关雎》云：\"左右流之。\"《小雅•吉日》云：\"既差我马。\"《邶风》云：\"简兮简兮。\"皆是也。简、柬音义同。" }
      - { type: j, text: "战、慄、震、惊、戁、竦、恐、慴，惧也。（《诗》曰：\"不戁不竦。\"慴即慑也。○慄音栗。戁，女板切。恐，丘勇切。慴，之涉切）" }
      - { type: z, text: "\"战慄\"至\"惧也\"。○释曰：皆惶怖也。《论语》曰：\"使民战栗。\"《诗•秦风•黄鸟》云：\"惴惴其慄。\"《易》曰：\"震来虩虩。\"又曰：\"惊远而惧迩也。\"《诗》云：\"不戁不竦。\"《月令》曰：\"国时有恐。\"《乐记》曰：\"柔气不慑。\"是皆惧也。慴即慑也。○注\"《诗》曰：不戁不竦\"。○释曰：《商颂•长发》文也。" }
      - { type: j, text: "痡、瘏、虺颓、玄黄、劬劳、咎、顇、瘽、瘉、鳏、戮、癙、瘸、□、痒、疷、疵、闵、逐、疚、痗、瘥、痱、□、瘵、瘼、癠，病也。（虺颓、玄黄，皆人病之通名。而说者便谓之马疾，失其义也。《诗》曰：\"生我劬劳。\"《书》曰：\"智藏鳏在。\"相戮辱，亦可耻病也。今江东呼病曰瘵，东齐曰瘼。《礼记》曰：\"亲，色容不盛。\"戮逐未详，皆见《诗》。○痡，普胡切。瘏音徒。虺音灰。顇音悴。瘽音勤。瘉音俞。癙音鼠。瘸，力专反。□音里。痒音羊。瘥，徂何切。痱音肥。□音亶。瘵音债。癠，徂细切）" }
      - { type: z, text: "\"痡瘏\"至\"病也\"。○释曰：疾甚曰病。此皆病之通名耳。孙炎曰：\"痡，人疲不能行之病。\"瘏，马疲不能进之病。虺颓，马罢不能升高之病。玄黄，马更黄色之病。\"然则虺颓者病之状，玄黄者病之变色。郭云：\"皆人病之通名。\"而说者便谓之马病，失其义也。\"盖指孙炎不能弘通，故云失其义也。咎者，罪病也。顇者，《小雅•雨无正》云：\"维躬是瘁。\"顇、瘁音义同。瘽者，劳苦之病也。瘉者，《小雅•角弓》云：\"交相为瘉。\"戮者相戮辱，亦可耻病也。癙及痒者，《小雅•正月》云：\"癙忧以痒。\"《舍人》云：\"癙、瘸、□、痒皆心忧惫之病也。\"孙炎云：\"癙者，畏之病也。\"者，《小雅•正月》云：\"悠悠我里。\" □、里音义同。疷者，孙炎云：\"滞之病也。\"《小雅•白华》云：\"俾我疷兮。\"疵者，瑕衅小病也。闵者，《豳风•鸱鸮》云：\"鬻子之闵斯。\"逐者，《卫风•考槃》云：\"硕人之轴。\"郑笺云：\"轴，病也。\"轴与逐盖今古字。郭氏未详。疚者，《小雅•采薇》云：\"忧心孔疚。\"痗者，《小雅•十月》云：\"亦孔之痗。\"瘥者，《节南山》云：\"天方荐瘥。\"痱者，《四月》云：\"百卉具腓。\"痱、腓音义同。者，《大雅•板》篇云：\"下民卒。\"瘵者，《大雅•瞻卬》云：\"士民其瘵。\"瘼者，《大雅•桑柔》云：\"瘼此下民。\"馀皆见注。○注\"《诗》曰\"至\"见《诗》\"。○释曰：云\"生我劬劳\"者，《小雅•蓼莪》文。云\"《书》曰：智藏鳏在\"者，《周书•召诰》文。云\"今江东呼病曰瘵\"者，以时验而言。云\"东齐曰瘼\"者，《方言》文。云\"《礼记》曰：亲，色容不盛\"者，《玉藻》文。" }
      - { type: j, text: "恙、写、悝、盱、繇、惨、恤、罹，忧也。（今人云无恙谓无忧也。写，有忧者，思散写也。《诗》曰：\"悠悠我悝\"，\"云何盱矣\"。繇役亦为忧愁也。○悝音里。盱音吁。繇音遥）" }
      - { type: z, text: "\"恙写\"至\"忧也\"。○释曰：皆言忧愁也。恙者，《聘礼》云：\"公问君，宾对公再拜。\"郑注云：\"拜其无恙。\"郭云：\"今人云无恙谓无忧也。写者有忧者，思散写也。\"《小雅•车荦》云：\"我心写兮。\"繇者，繇役亦为忧愁。惨者，心忧也。恤者，《小雅•祈父》云：\"胡转予于恤。\"罹者，《王风•兔爰》云：\"逢此百罹。\"○注\"诗曰\"至\"盱矣\"。○释曰：云\"《诗》曰：悠悠我悝\"者，《小雅•十月》文。\"云何盱矣\"者，《卷耳》及《都人士》文也。" }
      - { type: j, text: "伦、勩、邛、敕、勤、愉、庸、瘅，劳也。（《诗》曰：\"莫知我勩。\"维王之邛\"，\"哀我瘅人\"。《国语》曰：\"无功庸者。\"伦理事务以相约敕亦为劳。劳苦者多惰。愉今字或作窳，同。○勩，与世切。劳，力报切）" }
      - { type: z, text: "\"伦勩\"至\"劳也\"。○释曰：皆谓劳苦也。伦者，理也，理治事务者必劳。勩者，《广雅》云：\"苦也。\"孙炎曰：\"习事之劳也。\"敕者，相约敕也，亦为劳苦。勤者，劳力也。《梓材》云：\"既勤垣墉。\"愉者，懒也。郭云：\"劳苦者多惰。\"愉今字或作窳，同。庸者，民功曰庸。瘅者，《说文》云：\"劳病也。\"○注\"《诗》曰\"至\"庸者\"。○释曰：云\"《诗》曰：莫知我勩\"者，《小雅•雨无正》文。云\"维王之邛\"者，《巧言》文。云\"哀我惮人\"者，《大东》文。云\"《国语》曰：无功庸\"者，案《晋语》：\"韩献子老，使公族穆子受事於朝，辞曰：'厉公之乱，无忌备公族不能使。臣闻之曰：无功庸者，不敢居高位。今无忌智不能匡居，使至於难，仁不能救，勇不能死，敢辱君朝以忝韩宗？请退也。'固辞不立。悼公闻之，曰：'难，虽不能死，而能让，不可不赏。'使掌公族大夫。\"是其事也。" }
      - { type: j, text: "劳、来、强、事、谓、翦、篲，勤也。（《诗》曰：\"职劳不来。\"自勉强者，亦勤力者。由事事，故为勤也。《诗》曰：\"迨其谓之。\"翦、篲未详。○来音赉。强，其丈切）" }
      - { type: z, text: "\"劳来\"至\"勤也\"。○释曰：皆谓勤劳也。劳、来者，以其有勤劳也。自勉强者，亦为勤。由能事事有功者，亦为勤。○注\"诗曰\"至\"谓之\"。○释曰：云\"职劳不来\"者，《小雅•大东》文。人以不被劳来者为不见勤，故《采薇》叙曰：\"秋大杜以勤之。\"即是劳来也。云\"迨其谓之\"者，《召南•摽有梅》文也。" }
      - { type: j, text: "悠、伤、忧，思也。（皆感思也。○思，司嗣切）" }
      - { type: z, text: "\"悠、伤、忧，思也\"。○释曰：皆感思也。悠者，《秦风•渭阳》云：\"悠悠我思。\"伤者，《周南•卷耳》云：\"维以不永伤。\"忧者，愁思也。" }
      - { type: j, text: "怀、惟、虑、原、念、惄，思也。（《诗》曰：\"惄如调饥。\"○惄音溺）" }
      - { type: z, text: "\"怀惟\"至\"思也\"。○释曰：皆思念也。《方言》云：\"郁悠、怀、惄、惟、虑、原、念、靖、慎，思也。晋宋卫鲁之间谓之郁悠。惟，凡思也。虑，谋思也。原，欲思也。念，常思也。东齐海岱之间曰靖，秦晋或曰慎。凡思之貌亦曰慎，或曰惄。\"舍人曰：\"惄，志而不得之思也。\"○注\"《诗》曰：惄如调饥\"。○释曰：《周南•汝坟》文。" }
      - { type: j, text: "禄、祉、履、戬、祓、禧、禠、祜，福也。（《诗》曰：\"福履绥之\"，\"俾尔戬榖\"，\"祓禄康矣\"。禠、禧，《书传》不见，其义未详。○戬，子浅切。祓音废。禠音斯）" }
      - { type: z, text: "\"禄祉\"至\"福也\"。○释曰：皆福枯也。福禄对文则小异，散则禄亦福也。《商颂•玄鸟》云：\"百禄是何。\"郑笺谓当担负天之多福。祉者，繁多之福也。《周颂•烈文》云：\"锡尔祉福。\"祜者，《小雅•信南山》云：\"受天之祜。\"○注\"诗曰\"至\"康矣\"。○释曰：云\"《诗》曰：福履绥之\"者，《周南•樛木》文云\"俾尔戬榖\"者，《小雅•天保》文。云\"祓禄康矣\"者，《大雅•卷阿》文。" }
      - { type: j, text: "禋、祀、祠、蒸、尝、禴，祭也。（《书》曰：\"禋于六宗。\"馀者皆以为四时祭名也。○禴音药）" }
      - { type: z, text: "\"禋祀\"至\"祭也\"。○释曰：皆祭之别名。祭，际也，人神交际。《说文》云：\"从示、从又、从肉。又，手也。以手持肉。示，神所以祭也。\"禋者，《说文》云：\"絜祀也。\"祀者，《说文》云：\"祭无已也。\"馀者四时祭名，疏具《释天》。○注\"《书》曰：禋于六宗\"。○释曰：《虞书•舜典》文。孔安国云：\"精意以享谓之禋。\"宗，尊也。所尊祭者，其祀有六，谓四时也，寒暑也，日也，月也，星也，水旱也。" }
      - { type: j, text: "俨、恪、祗、翼、諲、恭、钦、寅、熯，敬也。（俨然，敬貌。《书》曰：\"夙夜惟寅。\"《诗》曰：\"我孔熯矣。\"諲未详。○恪，虚各切。諲音因。熯，而善切）" }
      - { type: z, text: "\"俨恪\"至\"敬也\"。○释曰：皆谓谨敬也。俨者，郭云：\"俨然，敬貌。\"《论语》云：\"俨然人望而畏之。\"恪者，心敬也。《周书•微子之命》云：\"恪慎克孝。\"祗者，《虞书•大禹谟》云：\"祗承于帝。\"翼者，小心之敬也。云恭者，敬貌也。《大雅•桑柔》云：\"温温恭人。\"钦者，《尧典》云：\"钦若昊天。\"○注\"书曰\"至\"熯矣\"。○释曰：云\"《书》曰：夙夜惟寅\"者，《虞书•舜典》文。云\"《诗》曰：我孔熯矣\"者，《小雅•楚茨》文。" }
      - { type: j, text: "朝、旦、夙、晨、晙，早也。（晙亦明也。○晙音俊）" }
      - { type: z, text: "\"朝旦\"至\"早也\"。○释曰：早者，《说文》云：\"晨也。从日在甲上，十，古文甲字。\"今即以不晚为早。朝者，《鄘风•蝃蝀》云：\"崇朝其雨。\"毛传云：\"崇，终也。从旦至食时为终朝。\"旦者，《说文》云：\"明也。从日在一上，一，地也。\"《陈风•东门之枌》云：\"榖旦于差。\"夙者，《齐风•东方未明》云：\"不夙则莫。\"晨者，《说文》云：\"晨，昧爽也。\"《东方未明》云：\"不能晨夜。\"晙亦明之早也。" }
      - { type: j, text: "𩓣、竢、替、戾、厎、止、徯，待也。（《书》曰：\"徯我后。\"今河北人语亦然。替、戾、厎者，皆止也。止亦相待。○𩓣音须。竢音士。厎音止。徯，胡礼切）" }
      - { type: z, text: "\"𩓣竢\"至\"待也\"。○释曰：皆相待也。𩓣者，《邶风•匏有苦叶》云：\"卬须我友。\"竢者，《齐风•著》篇云：\"俟我于著乎而。\" 𩓣、须、竢、俟音义同。替、戾、厎者，郭云：\"皆止也。止亦相待。\"○注\"《书》曰：徯我后\"。○释曰：《商书•太甲》文。" }
      - { type: j, text: "噊、幾、烖、殆，危也。（幾犹殆也。噊、烖未详。○噊音聿。烖音哉）" }
      - { type: z, text: "\"噊幾\"至\"危也\"。○释曰：皆危险也。《说文》云：\"危，在高而惧。\"幾者，幾犹殆也。《周书•顾命》云：\"无以钊冒贡于非幾。\"殆者，《小雅•节南山》云：\"无小人殆。\"" }
      - { type: j, text: "凱，汽也。（谓相摩近。○凱音祈。汽音盖）" }
      - { type: z, text: "\"凱，汽也\"。○释曰：《说文》云：剀，摩也。郭读凯为剀，云：\"谓相摩近。\"孙炎云：\"汽，近也。\"《大雅•民劳》云：\"汽可小康。\"郑笺云：\"汽，幾也。\"反覆相训，故汽得为幾也。昭二十年《左传》亦引此《诗》。杜预云：\"汽，期也。\"然则期字虽别，皆是近义，言其近当如此。《史记》称汉高祖欲废大子，周昌曰：\"臣口不能言，然臣期知其不可。陛下虽废大子，臣期不奉诏。\"言期者，意亦与此同也。" }
      - { type: j, text: "治、肆、古，故也。（治未详。肆、古见《诗》、《书》）" }
      - { type: z, text: "\"治、肆、古，故也\"。○释曰：肆之为故，语更端辞也。《商书•汤诰》曰：\"肆台小子。\"古之为故，谓旧故也。《周颂•良耜》云：\"续古之人。\"" }
      - { type: j, text: "肆、故，今也。（肆既为故，又为今。今亦为故，故亦为今。此义相反而兼通者，事例在下，而皆见《诗》）" }
      - { type: z, text: "\"肆、故，今也\"。○释曰：《诗•大雅•绵》篇云：\"肆不殄厥愠。\"毛传云：\"肆，故今也。\"即以肆之一字为故今，因上起下之语。郭氏字别为义，云：\"肆既为故，又为今。今亦为故，故亦为今。此义相反而兼通者，事例在下。\"在下者，谓在下文\"徂、在，存也\"注。" }
      - { type: j, text: "惇、亶、祜、笃、掔、仍、肶、埤、竺、腹，厚也。（频仍、埤益、肶辅，皆重厚。掔然，厚貌。馀皆见《诗》、《书》。○肶音毗。埤音椑。竺音笃）" }
      - { type: z, text: "\"惇亶\"至\"厚也\"。○释曰：皆重厚也。惇者，《周书•武成》云：\"惇信明义。\"亶者，诚之厚也。《大雅•桑柔》云：\"逢天僤怒。\"《小雅•天保》云：\"俾尔单厚。\"《周颂•昊天有成命》云：\"单厥心。\"皆训厚也。亶、僤、单音义同。祜者，福厚也。笃者，《周颂•维天之命》云：\"曾孙笃之。\"掔然，厚貌。频仍、埤益、肶辅，皆重厚。《释天》云：\"仍饥为荐。\"《邶风北门》云：\"政事一埤益我。\"《小雅•节南山》云：\"天子是毗。\"又《采菽》云：\"福禄蓖之。\"肶、毗、蓖音义同。腹者，《小雅•蓼莪》云：\"出入腹我。\"《月令》云：\"水泽腹坚。\"" }
      - { type: j, text: "载、谟、食、诈，伪也。（载者，言而不信。谟者，谋而不忠。《书》曰：\"朕不食言。\"）" }
      - { type: z, text: "\"载谟\"至\"伪也\"。○释曰：皆虚伪也。郭云\"载者，言而不信。谟者，谋而不忠\"者，以载诂为言，谟为谋，今又为伪，故以为言而不信，谋而不忠，不信不忠，则是伪也。食者，孙炎曰：\"食言之伪也。\"哀二十五年《左传》云：\"孟武伯恶郭重曰：'何肥也？'公曰：'是食言多矣。能无肥乎？'\"然则言而不行，如食之消尽後终不行，前言则伪，故通谓伪言为食言。故此训食为伪也。诈者，《方言》云：\"胶、谲，诈也。凉州西南之间曰胶，自关而东西或曰谲，或曰胶。诈，通语也。○注\"书曰：朕不食言\"。○释曰：《商书•汤诰》文。" }
      - { type: j, text: "话、猷、载、行、讹，言也。（《诗》曰：\"慎尔出话。\"猷者，道，道亦言也。《周礼》曰：\"作盟诅之载。\"今江东通谓语为行。世以妖言为讹）" }
      - { type: z, text: "\"话猷\"至\"言也\"。○释曰：皆谓言辞也。话者，善言也。孙炎曰：\"善人之言也。\"猷者，道也，道亦言也。载者，载於简策之言也。郭云：\"今江东通谓语为行世。以妖言为讹。\"○注\"《诗》曰\"至\"之载\"。○释曰：云\"《诗》曰：慎尔出话\"者，《大雅•抑》篇文。云\"《周礼》曰：作盟诅之载\"者，《春官•诅祝职》文也。" }
      - { type: j, text: "遘、逢，遇也。（谓相遭遇）遘、逢、遇，逆也。（转复为相触逆）遘、逢、遇、逆，见也。（行而相值，即见。○遘音构。逆音悟）" }
      - { type: z, text: "\"遘逢\"至\"见也\"。○释曰：皆谓相遭遇、触逆而相见也。《召南•草虫》云：\"亦既遘止。\"《周书•洪范》云：\"子孙其逢吉。\"《郑风•野有蔓草》云：\"邂逅相遇。\"转复相训三者又为相触逆。遘、逢、遇、逆四者，皆行而相值之名。行而相值即见也，故又为见。" }
      - { type: j, text: "显、昭、觐、钊、觌，见也。（显、昭，明见也。《逸书》曰：\"钊我周王。\"○钊，之遥切）" }
      - { type: z, text: "\"显昭\"至\"见也\"。○释曰：显、昭，明见也。《周颂•敬之》云：\"天维显思。\"又《时迈》云：\"昭明有周。\"觐、钊、觌也，皆下见上者。《曲礼》云：\"天子当依而立，诸侯北面而见天子曰觐。\"《郊特牲》云：\"不敢私觌。\"○注\"《逸书》曰：钊我周王\"。○释曰：不在今《尚书》之内，故曰逸。" }
      - { type: j, text: "监、瞻、临、涖、覜、相，视也。（皆谓察视也。○监音鉴。涖音利，覜音跳）" }
      - { type: z, text: "\"监瞻\"至\"视也\"。○释曰：皆谓察视也。《小雅•节南山》云：\"何用不监。\"又曰：\"民具尔瞻。\"《大雅•大明》云：\"上帝临女。\"《文王•世子》云：\"成王幼不能涖阼。\"覜者，《考工记》云：\"瑑圭璋八寸，璧琮八寸，以覜聘。\"郑注云：\"覜，视也。聘，问也。众来曰覜，特来曰聘。\"相者，《小雅•小弁》云：\"相彼投兔。\"" }
      - { type: j, text: "鞠、讻、溢，盈也。（《诗》曰：\"降此鞠讻\"）" }
      - { type: z, text: "\"鞠、讻、溢，盈也\"。○释曰：皆谓盈多。讻讼、满溢，皆盈多也。○注\"《诗》曰：降此鞠讻\"。○释曰：《小雅•节南山》文。毛传云：\"鞠，盈。讻，讼也。\"郑笺云：\"盈犹多也。\"以盈者必多，故郑转云盈犹多也。" }
      - { type: j, text: "孔、魄、哉、延、虚、无、之、言，间也。（孔穴、延、魄、虚、无皆有间隙。馀未详）" }
      - { type: z, text: "\"孔魄\"至\"间也\"。○释曰：间谓间隙也。孔者，孔穴。《小雅•角弓》云：\"如酌孔取。\"魄者，形也，谓月之无光之处名魄也。《康诰》云：\"惟三月哉生魄。\"延者，今墓道也。虚、无者，空无所有也。是皆有间隙也。" }
      - { type: j, text: "瘗、幽、隐、匿、蔽、窜，微也。（微谓逃藏也。《左传》曰：\"其徒微之。\"是也。○瘗，於计切。匿，女力切）" }
      - { type: z, text: "\"瘗幽\"至\"微也\"。○释曰：微谓逃藏也。瘗者，埋藏之微也。幽者，深微也。隐者，潜隐而微也。匿者，舍人曰：\"藏之微也。\"蔽者，覆障使微也。窜者，行之微也。是皆微昧不显扬也。○注\"《左传》\"至\"是也\"。○释曰：案昭十七年传云：楚白公胜作乱，杀子西、子期，叶公子高至，\"遇箴尹因帅其属将与白公，子高曰：'微二子者，楚不国矣。弃德从贼，其可保乎？'乃从叶公。使与国人以攻白公。白公奔山而缢，其徒微之。\"是也。" }
      - { type: j, text: "讫、徽、妥、怀、安、按、替、戾、底、废、尼、定、曷、遏，止也。（妥者，坐也。怀者，至也。按，抑，按也。替、废皆止住也。戾、底义见《诗》。《国语》曰：\"戾久将底。\"《孟子》曰：\"行或尼之。\"今以逆相止为遏。徽未详。○妥，他果切。遏，乌曷切）" }
      - { type: z, text: "\"讫徽\"至\"止也\"。○释曰：皆谓止住也。讫者，终止也。妥者，坐止也。怀，至止也。安，休止也。按、抑、替、废、皆止住也。《大雅》云：\"以按徂旅。\"《小雅》云：\"勿替引之。\"定者，静止也。曷者，俗以抑止为曷。今以逆相止为遏。馀皆见注。○注\"戾底\"至\"尼之\"。○释曰：云\"戾、底义见《诗》\"者，《小雅•采菽》云：\"亦是戾矣。\"底者，在物之下，是亦止也。凡注言见《诗》，今《毛诗》无者，盖在齐、鲁、韩《诗》也。云\"《国语》曰：戾久将底\"也，案《晋语》云：\"文公在翟十二年，狐偃曰：\"日吾来此也，非以翟为荣，可以成事也。吾曰奔而易达，困而有资，休以择利，可以戾也。今戾久矣，戾久将底，底著滞淫，谁能兴之？盍速行乎！\"是其事也。云\"《孟子》曰：行或尼之\"者，案《孟子》：\"鲁平公将见孟子，嬖人臧仓止之。乐正子见孟子，曰：'克告於君，君为来见也，嬖人有臧仓沮君，君是以不来也。'曰：'行或使之，止或尼之，行止非人所能也。吾之不遇鲁侯，天也。臧氏之子焉能使予不遇哉？'\"是其事也。此云\"行或尼之\"者，所见本异，或传写误。" }
      - { type: j, text: "豫、射，厌也。（《诗》曰：\"服之无斁。\"豫未详。○射音亦）" }
      - { type: z, text: "\"豫、射，厌也\"。○释曰：谓厌倦也云。○注\"《诗》曰：服之无斁\"。○释曰：\"诗曰\"者，《周南•葛覃》文也。" }
      - { type: j, text: "烈、绩，业也。（谓功业也）" }
      - { type: z, text: "\"烈、绩，业也\"。○释曰：谓功业也。烈者，《周颂•执竞》云：\"无竞维烈。\"绩者，《大雅•文王有声》云：\"维禹之绩。\"" }
      - { type: j, text: "绩、勋，功也。（谓功劳也）" }
      - { type: z, text: "\"绩、勋，功也\"。○释曰：谓功劳也。绩者，《虞书•大禹谟》云：\"嘉乃丕绩。\"勋者，案《周礼•司勋职》云：\"王功曰勋。\"郑注云：\"辅成王业若周公。\"" }
      - { type: j, text: "功、绩、质、登、平、明、考、就，成也。（功绩皆有成。《诗》曰：\"质尔民人。\"《礼记》曰：\"年谷不登。\"《榖梁传》曰：\"平者成也。\"事有分明，亦成济也）" }
      - { type: z, text: "\"功绩\"至\"成也\"。○释曰：皆谓成济也。勋、功、绩、业皆有成也。事有分明亦成济也。《舜典》云：\"三载考绩。\"《周颂•敬之》云：\"日就月将。\"皆言成功也。○注\"《诗》曰\"至\"成也\"。○释曰：云\"《诗》曰：质尔民人\"者，《大雅•抑》篇文。云\"《礼记》曰：年谷不登\"者，下《曲礼》文。云\"《榖梁传》曰：平者成也\"者，宣十五年文也。" }
      - { type: j, text: "梏、梗、较、颋、庭、道，直也。（梏、梗、较、頲、皆正直也。《诗》曰：\"既庭且硕。\"颋道无所屈。○梏音谷。较音角。颋，他顶切）" }
      - { type: z, text: "\"梏梗\"至\"直也\"。○释曰：梏、梗、较、颋皆正直也。庭，条直也。道者，颋道无所屈。○注\"诗曰：既庭且硕\"。○释曰：《小雅•大田》文。" }
      - { type: j, text: "密、康，静也。（皆安静也）" }
      - { type: z, text: "\"密、康，静也\"。○释曰：皆安静也。《周颂•昊天有成命》：\"夙夜基命宥密。\"《大雅•生民》云：\"不康禋祀。\"" }
      - { type: j, text: "豫、宁、绥、康、柔，安也。（皆见《诗》、《书》）" }
      - { type: z, text: "\"豫宁\"至\"安也\"。○释曰：皆安乐也。《大雅•板田》云：\"不敢戏豫。\"《虞书•大禹谟》云：\"万邦咸宁。\"《商书•大甲》云：\"抚绥万邦。\"《大雅•民劳》云：\"汔可小康。\"《虞书•舜典》云：\"柔远能迩。\"" }
      - { type: j, text: "平、均、夷、弟，易也。（皆谓易直）" }
      - { type: z, text: "\"平均\"至\"易也\"。○释曰：易者不难也。和平、均一皆易直也。《周颂•天作》云：\"岐有夷之行。\"《大雅•泂酌》云：\"岂弟君子。\"" }
      - { type: j, text: "矢，弛也。（弛，放）弛，易也。（相延易。○矢、弛并音尸纸切）" }
      - { type: z, text: "\"矢弛\"至\"易也\"。○释曰：郭云：\"弛，放也。\"以弓释弦曰弛，故云\"弛，放\"。《礼记•杂记》云：\"一张一弛。\"弛又为易，为相延易也。" }
      - { type: j, text: "希、寡、鲜，罕也。（罕亦希也）鲜，寡也。（谓少。○鲜。息浅切）" }
      - { type: z, text: "\"希寡\"至\"寡也\"。○释曰：皆简少之称也。《论语》云：\"希不失矣。\"《易•说卦》云：\"巽为寡发。\"《大雅•篇》云：\"鲜不为则。\"郭云：\"罕亦希也。\"《郑风•大叔于田》云：\"叔发罕忌。\"鲜又为寡。转互相训，皆谓希少尔。" }
      - { type: j, text: "酬、酢、侑，报也。（此通谓相报答，不主于饮酒。○酢音昨）" }
      - { type: z, text: "\"酬、酢、侑，报也\"。○释曰：皆相报答也。郭云\"此通谓相报答，不主于饮酒\"者，以饮酒之礼，主人酌酒于宾曰献；宾既卒爵，洗而酌主人曰酢；主人既卒酢爵，又酌自饮，卒爵，复酌进宾曰酬。故说者以酬、酢主谓饮酒相报答。郭以《易•系辞》云\"可与酬酢\"，谓应对万物也。《小雅•楚茨》云：\"万寿攸酢。\"是神报主人也。故云\"不主於饮酒\"。侑者，案《公食大夫礼》宾三饭之後，云\"公受宰夫束帛以侑\"。注云：\"束帛，十端帛也。侑犹劝也。主国君以为食宾殷勤之意，未至，复发币以劝之，欲其深安宾也。\"是侑者，主人所以报宾也。" }
      - { type: j, text: "毗刘，暴乐也。（谓树木叶缺落，荫疏爆乐，见《诗》。○暴音剥。乐音洛）" }
      - { type: z, text: "\"毗刘，暴乐也\"。○释曰：舍人曰：\"毗刘，爆乐之意也。木枝叶稀疏不均，为爆乐。\"郭云\"谓树叶缺落，荫疏爆乐，见《诗》\"者，《大雅•桑柔》云：\"捋采其刘。\"毛传云：\"刘，爆烁而希也。\"是矣。" }
      - { type: j, text: "覭髳，茀离也。（谓草木之丛茸翳薈也。茀离即弥离，弥离犹蒙茏耳。孙叔然字别为义，失矣。○覭音陌。髳音蒙）" }
      - { type: z, text: "\"覭髳，茀离也\"。○释曰：郭云：\"谓草木之丛茸翳薈也。茀离即弥离，弥离犹蒙茏耳。孙叔然字别为义，失矣。\"郭以时验而为此解。孙氏每字各别为义，故云失矣。" }
      - { type: j, text: "蛊、謟、贰，疑也。（蛊惑有贰心者，皆疑也。《左传》曰：\"天命不謟。○謟音縚）" }
      - { type: z, text: "\"蛊、謟、贰，疑也\"。○释曰：皆谓疑惑也。○注\"蛊惑\"至\"不謟\"。○释曰：云\"蛊惑有贰心者皆疑也\"者，案昭元年《左传》：晋赵孟问於医和曰：\"何谓蛊？\"对曰：\"淫溺惑乱之所生也。於文，皿虫为蛊，榖之飞亦为蛊。在《周易》，女惑男、风落山谓之蛊。\"是蛊惑也。贰者，心疑不一也。《大雅•大明》云：\"无贰尔心。\"毛传云：\"无敢怀贰心也。\"云\"《左传》曰：天命不謟\"者，哀十七年叶公子高辞也。" }
      - { type: j, text: "桢、翰、仪，榦也。（《诗》曰：\"维周之翰。\"仪表亦体榦也）" }
      - { type: z, text: "\"桢、翰、仪，榦也\"。○释曰：舍人曰：\"桢，正也，筑墙所立两木也。\"翰所以当墙两边障土者也。《大雅•生民》云：\"维周之桢。\"又《崧高》云：\"维周之翰。\"仪表亦体榦也。" }
      - { type: j, text: "弼、棐、辅、比，俌也。（《书》曰：\"天威棐忱。\"《易》曰：\"比，辅也。\"俌犹辅也。○棐音匪。比，毗志切。俌音甫）" }
      - { type: z, text: "\"弼、棐、辅、比，俌也\"。○释曰：俌犹辅也。弼者，《商书•说命》云：\"梦帝赉子良弼。\"棐者，《周书•康诰》云：\"天威棐忱。\"辅者，《商书•汤誓》云：\"尔尚辅予一人。\"比者，《易•比卦•彖》云：\"比，辅也。\"" }
      - { type: j, text: "疆、界、边、卫、圉，垂也。（疆埸、竟界、边旁、营卫、守圉，皆在外垂也。《左传》曰：\"聊以固吾圉也。\"○圉音语）" }
      - { type: z, text: "\"疆界\"至\"垂也\"。○释曰：谓四垂也。郭云：\"疆埸、竟界、边旁、营卫、守圉皆在外垂也。舍人曰：\"圉，拒边垂也。\"孙炎曰：\"圉，国之四垂也。\"○注\"《左传》曰：聊以固吾圉也\"。○释曰：隐十一年郑伯辞也。" }
      - { type: j, text: "昌、敌、彊、应、丁，当也。（书曰：\"禹拜昌言。\"彊者，好与物相当值）" }
      - { type: z, text: "\"昌敌\"至\"当也\"。○释曰：皆相当也。昌者，言当也。敌者，仇匹相当也。文六年《左传》曰：\"敌惠敌怨。\"彊者，好与物相当值。应者，对当也。《大雅•下武》云：\"应侯顺德。\"丁者，《云汉》云：\"宁丁我躬。\"○注\"《书》曰：禹拜昌言\"。○释曰：《虞书•大禹谟》文。" }
      - { type: j, text: "浡、肩、摇、动、蠢、迪、俶、厉，作也。（浡然，兴作貌。蠢，动作。《公羊传》曰：\"俶甚也。\"《榖梁传》曰：\"始厉乐矣。\"肩见《书》。迪未详）" }
      - { type: z, text: "\"浡肩\"至\"作也\"。○释曰：皆兴作也。浡然，兴作貌。庄公十一年《左传》云：\"禹汤罪已，其兴也浡然。\"肩者，胜任之作也。摇者，《考工记•矢人》云：\"夹而摇之，以视其丰杀之节\"也。动者，《商书•咸有一德》云：\"德惟一，动罔不吉。\"蠢者，《乡饮酒义》云：\"春之为言蠢也。\"俶者，始作也。厉者，《方言》云：\"厉、卬，为也。瓯越曰卬，吴曰厉。\"为亦作也。○注\"《公羊》\"至\"乐矣\"。○释曰：云\"《公羊传》曰：俶甚也\"者，隐九年云：三月\"庚辰，大雨雪。何以书？记异也。何异尔？俶甚也\"。云\"《榖梁传》曰：矢厉乐矣\"者，隐五年云：\"九月，考仲子之宫。．．．．．．初献六羽，始僭乐矣。尸子曰：\"舞《夏》，自天子至诸侯皆用八佾。初献六羽，始厉乐矣。\"" }
      - { type: j, text: "兹、斯、咨、呰、已，此也。（呰、已皆方俗异语。○呰音紫）" }
      - { type: z, text: "\"兹斯\"至\"此也\"。○释曰：此者对彼之称，言近在是也。兹者，《虞书•大禹谟》云：\"念兹在兹。\"斯者，《召南•殷其雷》云：\"何斯违斯。\"咨与兹同。呰、已与此皆音相近，故得为此也。郭云：\"呰、已皆方俗异语。\"" }
      - { type: j, text: "嗟、咨，也。（今河北人云叹。音兔置。○音嗟）" }
      - { type: z, text: "\"嗟、咨，也\"。○释曰：皆叹也。《周南•卷耳》云：\"嗟我怀人。\"《尧典》云：\"畴咨，若时登庸。\"郭云：\"今河北人云叹。\"" }
      - { type: j, text: "闲、狎、串、贯，习也。（串，厌串；贯，贯忕也，今俗语皆然。○串，五患切。贯音惯）" }
      - { type: z, text: "\"闲狎\"至\"习也\"。○释曰：皆便习也。庄二十二年《左传》曰：\"赦其不闲於教训。\"《曲礼》曰：\"贤者狎而敬之。\"《大雅•皇矣》云：\"串夷载路。\"《齐风•猗嗟》云：\"射则贯兮。\"皆是习也。郭云\"串，厌串；贯，贯忕也，今俗语皆然\"者，当时晋时有此厌串、贯忕之语，故以为证也。" }
      - { type: j, text: "曩、尘、伫、淹、留，久也。（尘垢、伫企、淹滞皆稽久）" }
      - { type: z, text: "\"曩尘\"至\"久也\"。○释曰：曩曏、尘垢、伫企、淹滞、留止皆稽久也。通见《诗》、《书》。" }
      - { type: j, text: "逮、及、暨，与也。（《公羊传》曰：\"会及暨皆与也。\"逮亦及也）" }
      - { type: z, text: "\"逮、及、暨，与也\"。○释曰：皆相亲与也。○注\"《公羊》\"至\"及也\"。○释曰：云\"《公羊传》曰：会及暨皆与也\"者，隐元年文也。云\"逮亦及也\"者，《方言》文。" }
      - { type: j, text: "骘、假、格、陟、跻、登，升也。（《方言》曰：鲁卫之间曰骘，梁益曰格。《礼记》曰：\"天王登遐。\"《公羊传》曰：\"跻者何？升也。\"○骘音质。假音遐）" }
      - { type: z, text: "\"骘假\"至\"升也\"。○释曰：皆谓升上。陟者，《周南•卷耳》云：\"陟彼高冈。\"馀见注。○注\"《方言》\"至\"升也\"。○释曰：\"《方言》曰\"者，案彼云：\"蹑、郅（音质）、跂（音企）、、跻、踚（音跃），登也。自关而西，秦晋之间曰蹑，东齐海岱之间谓之跻，鲁卫曰郅，梁益之间曰，或曰跂。\"骘、郅，格、，音义同。云\"《礼记》曰：天王登遐\"者，下《曲礼》文。云\"《公羊传》曰：跻者何？升也\"者，文公二年文也。" }
      - { type: j, text: "挥、盝、歇、涸，竭也。（《月令》曰：\"无漉陂池。\"《国语》曰：\"水涸而成梁。\"挥振去水亦为竭。歇，通语。○涸音鹤）" }
      - { type: z, text: "\"挥盝\"至\"竭也\"。○释曰：皆谓竭尽也。挥者，郭云：\"挥振去水亦为竭。\"《曲礼》曰：\"执玉器者弗挥。\"是也。盝即漉也。郭云\"歇，通语\"，谓歇即歇之通语也。涸，水竭也。○注\"《月令》\"至\"成梁\"。○释曰：云\"《月令》云：无漉陂池\"者，按《月令》：\"仲春之月：是月也，无竭川泽，无漉陂池，无焚山林。\"郑注云：\"顺阳养物也。畜水曰陂，穿地通水曰池。\"云\"《国语》曰：水涸而成梁\"者，案《周语》：定王使单襄公聘於宋，遂假道於陈以聘楚。单子归，告王曰：\"陈侯不有大咎，国必亡。\"王曰：\"何故？\"对曰：\"夫辰角见而雨毕，天根见而水涸，本见而草木节解，驷见而陨霜，火见而清风戒寒，故先王之教曰：'雨毕而除道，水涸而成梁，草木节解而备藏，陨霜而冬裘具，清风至而修城郭宫室。'今陈国火朝觌矣，而道路若塞，野场若弃，泽不陂障，川无舟梁，是废先王之教也。\"引之者，证涸为水竭。" }
      - { type: j, text: "挋、拭、刷，清也。（振讯、抆拭、扫刷，皆所以为絜清。挋音振。刷，所劣切）" }
      - { type: z, text: "\"挋、拭、刷，清也\"。○释曰：郭云：\"振讯、抆拭、扫刷，皆所以为絜清。\"《礼记•丧大记》云：\"挋用巾。\"哀十四年《公羊传》云：\"反袂拭面。\"《周礼•凌人职》云：\"夏，颁冰掌事，秋，刷。\"後郑云：\"秋凉冰不用，可以清除其室。\"" }
      - { type: j, text: "鸿、昏、於、显、间，代也。（鸿雁知运代。昏主代明，明亦代昏，显即明也。间错亦相代。於义未详。○於音乌。间音涧）" }
      - { type: z, text: "\"鸿昏\"至\"代也\"。○释曰：皆谓更代也。云\"鸿雁知运代\"者，鸿雁之属，九月而南，正月而北，是知其时运而更代南北也。云\"昏主代明\"者，释经昏字也。日入後二刻半为昏，昏来则明往，故云\"昏主代明\"。云\"明亦代昏\"者，释经显也，显即明也。云\"间错亦相代\"者，谓间厕交错亦相更代也。《仪礼•乡饮酒》云：\"乃间歌《鱼丽》。\"郑注云：\"间，代也。谓一歌则一吹。\"是也。又《周颂•桓》篇云：\"皇以间之。\"" }
      - { type: j, text: "饁、饟，馈也。（《国语》曰：\"其妻饁之。\"○饁音叶。饟音饷。馈音柜）" }
      - { type: z, text: "\"饁、饟，馈也\"。○释曰：饁者以食遗与也。野食曰饁。舍人曰：\"饟，自家之野也。\"○注\"《国语》曰：其妻饁之\"。○释曰：《晋语》云：臼季使，舍於冀野。冀缺耨，其妻饁之，敬，相待如宾。从而问之，冀芮之子，与之归。既复命，而进之曰：\"臣得贤人，敢以告。\"是也。" }
      - { type: j, text: "迁、运，徙也。（今江东通言迁徙）" }
      - { type: z, text: "\"迁、运，徙也\"。○释曰：皆谓移徙也。《大雅•皇矣》云：\"帝迁明德。\"《易》曰：\"日月运行。\"郭云\"今江东通言迁徙\"者，时验而言也。" }
      - { type: j, text: "秉、拱，执也。（两手持为拱）" }
      - { type: z, text: "\"秉、拱，执也\"。○释曰：皆谓持执也。《周书•金縢》云：\"植璧秉珪。\"郭云\"两手持为拱。\"《老子》云：\"虽有拱璧。\"" }
      - { type: j, text: "廞、熙，兴也。（《书》曰：\"庶绩咸熙。\"廞见《周官》。○廞，许金切）" }
      - { type: z, text: "\"廞、熙，兴也\"。○释曰：皆谓兴作。郭云\"《书》曰：庶绩咸熙\"者，《虞书•舜典》文。云\"廞见《周官》\"者，《周官》即《周礼》也。《笙师职》云：\"大丧，廞其乐器。\"郑注：\"廞，兴也。\"兴谓作之。" }
      - { type: j, text: "卫、蹶、假，嘉也。（《诗》曰：\"《假乐》，嘉成王也。\"馀未详。○蹶，居卫切。假音暇）" }
      - { type: z, text: "\"卫、蹶、假，嘉也\"。○释曰：谓嘉美也。郭云\"《诗》曰：《假乐》嘉成王也\"者，《大雅•假乐》篇叙也。" }
      - { type: j, text: "废、税、赦，舍也。（《诗》曰：\"召伯所税。\"舍，放置。○舍音舍）" }
      - { type: z, text: "\"废、税、赦，舍也\"。○释曰：皆舍置也。废者，宣八年《公羊传》云：\"废其无声者。\"赦者，放置也。《虞书•舜典》云：\"眚灾肆赦。\"郭云\"《诗》曰：召伯所税\"者，《召南•甘棠》文也。" }
      - { type: j, text: "栖迟、憩、休、苦、㕟、齂、呬，息也。（栖迟、游息也。苦劳者，宜止息。憩见《诗》。㕟、齂、呬皆气息貌。今东齐呼息为呬也。○憩，去例切。㕟，苦怪切。齂，词戒切。呬，许四切）" }
      - { type: z, text: "\"栖迟\"至\"息也\"。○释曰：皆止息也。舍人曰：栖迟，行步之息。郭云：\"栖迟，游息也。\"《陈风•衡门》云：\"衡门之下，可以栖迟。\"憩者，《召南•甘棠》云：\"召伯所憩。\"休者，止而息也。《周南•汉广》云：\"不可休息。\"苦者，郭云：\"苦劳者，宜止息。\" 㕟、齂、呬者，郭云：\"皆气息貌。\"案《方言》云：\"（消息）、喙、呬，息也。周郑宋沛之间曰，自关而西、秦晋之间或曰喙，或曰，东齐曰呬。\"故郭云\"今东齐呼息为呬也\"。" }
      - { type: j, text: "供、峙、共，具也。（皆谓备具。○峙，直纪切。供音恭）" }
      - { type: z, text: "\"供、峙、共，具也\"。○释曰：皆谓备具也。供者，《论语》云：\"子路共之。\"供、共音义同。峙者，《周书•费誓》云：\"峙乃糗粮。\"《周颂•臣工》云：\"庤乃钱鏄。\"峙、庤音义同。共者，《小雅•小旻》云：\"靖共尔位。\"" }
      - { type: z, text: "\"□、怜、惠，爱也\"。○释曰：爱谓宠惜也。《方言》云：\"怃（亡辅切）、（音掩）、怜、牟，爱也。韩郑曰怃，晋卫曰，汝颍之间曰怜，宋鲁之间曰牟，秦或曰怜。怜，通语也。\"故郭云：\"，韩郑语，今江东通呼为怜。\"、怃音义同。惠者，仁爱也。《邶•北风》云：\"惠而好我。\"" }
      - { type: j, text: "娠、蠢、震、戁、妯、骚、感、讹、蹶，动也。（娠犹震也。《诗》曰：\"忧心且妯\"，\"无感我帨兮\"，\"或寝或讹\"。蠢、戁、骚、蹶皆摇动貌。○娠音振。妯音抽）" }
      - { type: z, text: "\"娠蠢\"至\"动也\"。○释曰：皆谓动作。娠者，《说文》云：\"妊、娠，动也。\"郭云\"娠犹震也\"者，以《大雅•生民》云：\"载震载夙。\"昭元年《左传》曰：\"邑姜方震大叔。\"哀元年《左传》曰：\"后缗方震。\"皆谓有身为震，故云\"娠犹震也\"。蠢者，郭云：\"蠢、戁、骚、蹶皆摇动貌。\"《小雅•采芑》云：\"蠢尔蛮荆。\"震者，《大雅•常武》云：\"震惊徐方。\"戁者，恐动也。《商颂•长发》云：\"不戁不竦。\"骚者，《大雅•常武》云：\"徐方绎骚。\"蹶者，《大雅•绵》篇云：\"文王蹶厥生。\"○注\"《诗》曰\"至\"或讹\"。○释曰：云\"《诗》曰：忧心且妯\"者，《小雅•鼓锺》文。云\"无感我帨兮\"者，《周南•野有死麕》文。云\"或寝或讹\"者，《小雅•无羊》文。" }
      - { type: j, text: "覆、察、副，审也。（覆校、察视、副长皆所为审谛）" }
      - { type: z, text: "\"覆、察、副，审也\"。○释曰：郭云：\"覆校、察视、副长皆所为审谛。\"覆者，《月令•季春》云：\"命舟牧覆舟，五覆五反。\"察者，《周书•吕刑》云：\"惟察惟法。\"副者，次长之称。" }
      - { type: j, text: "契、灭、殄，绝也。（今江东呼刻断物为契断。○契，苦结反）" }
      - { type: z, text: "\"契、灭、殄，绝也\"。○释曰：皆谓断绝。契者，郭云：\"今江东呼刻断为契断。\"定九年《左传》曰：\"尽借邑人之车，契其轴。\"杜注云：\"契，刻也。\"灭者，《小雅•正月》云：\"宁或灭之。\"殄者，《大雅•桑柔》云：\"不殄心忧。\"" }
      - { type: j, text: "郡、臻、仍、乃、侯，乃也。（乃即乃。馀未详）" }
      - { type: z, text: "\"郡臻\"至\"乃也\"。○释曰：乃语辞也。乃、乃音义同。《大雅•绵》篇云：\"乃慰乃止。\"是也。" }
      - { type: j, text: "迪、繇、训，道也。（义皆见《诗》、《书》。○繇音由）" }
      - { type: z, text: "\"迪、繇、训，道也\"。○释曰：《虞书•大禹谟》曰：\"惠迪吉。\"《小雅•巧言》云：\"秩秩大猷。\"猷、繇音义同。《周书•顾命》云：\"命汝嗣训。\"" }
      - { type: j, text: "佥、咸、胥，皆也。（东齐曰胥，见《方言》。○佥，七廉切）" }
      - { type: z, text: "\"佥、咸、胥，皆也\"。○释曰：谓众皆也。《舜典》云：\"佥曰：'伯禹作司空。'\"《商书》云：\"咸有一德。\"郭云\"东齐曰胥，见《方言》\"者，案《方言》云：\"佥、胥，皆也。自山而东、五国之郊曰佥，东鲁曰胥。\"是也。" }
      - { type: j, text: "育、孟、耆、艾、正、伯，长也。（育、养亦为长，正、伯皆官长。○长，丁丈反）" }
      - { type: z, text: "\"育孟\"至\"长也\"。○释曰：皆谓长上也。郭云：\"育、养亦为长。\"《邶•谷风》云：\"既生既育。\"郑笺云：\"育谓长老也。\"孟，庶长也。又《周书•康诰》云：\"王若曰孟侯。\"孔安国云：\"孟，长也，五侯之长。\"耆、艾皆老长也。《曲礼》曰：\"五十曰艾，服官政。六十曰耆，指使。\"正、伯皆官长。《大雅•云汉》云：\"以戾庶正。\"《盘庚》云：\"邦伯师长。\"" }
      - { type: j, text: "艾，历也。（长者多更历）" }
      - { type: z, text: "\"艾，历也\"。○释曰：艾又为历。郭云：\"长者多更历。\"" }
      - { type: j, text: "厤、秭、算，数也。（厤，厤数也。今以十亿为秭。《论语》云：\"何足算也。\"○秭音姊。算音筭）" }
      - { type: z, text: "\"厤、秭、算，数也\"。○释曰：皆筭数也。郭云：\"厤，厤数也。\"推律所生之数。《虞书•大禹谟》云：\"天之数在汝躬。\"秭者，《周颂丰年》云：\"万亿及秭。\"毛传云：\"数亿至万曰亿。数亿至亿曰秭。\"郭云\"今以十亿为秭\"者，以时验而言也。○注\"《论语》\"至\"筭也\"。○释曰：案《论语》：\"子贡问曰：'今之从政者何如？'子曰：'噫！斗筲之人，何足算也。'\"郑曰：\"算，数也。\"" }
      - { type: j, text: "历，傅也。（傅近。○历音厤）" }
      - { type: z, text: "\"历，傅也\"。○释曰：谓近傅也。隐十一年《左传》云：\"庚辰，傅於许。\"" }
      - { type: j, text: "艾、历、覛、胥，相也。（覛谓相视也。《公羊传》曰：\"胥盟者何？相盟也。\"艾、历未详。○覛音脉）" }
      - { type: z, text: "\"艾历\"至\"相也\"。○释曰：皆谓相共也。者，郭云：\"覛谓相视也。\"《说文》云：\"覛，邪视也。\"郭云\"《公羊传》曰：胥盟者何？相盟也\"者，桓三年文。" }
      - { type: j, text: "乂、乱、靖、神、弗、淈，治也。（《论语》曰：\"予有乱臣十人。\"淈，《书》叙作汨，音同耳。神，未详。馀见《诗》、《书》。○淈音骨）" }
      - { type: z, text: "\"乂乱\"至\"治也\"。○注\"《论语》\"至\"《诗》、《书》\"。○释曰：皆治理也。舍人曰：\"乱，义之治也。\"孙炎曰：\"乱，治之理也。\"云\"《论语》曰：予有乱臣十人\"者，《泰伯》篇文也。\"淈，《书》叙作汨，音同耳\"者，《虞书》叙云：\"帝釐下土，方设居方，别生分类，作《汨作》。\"孔传云：\"汨，治。作，兴也。言其治民之功兴，故为《汨作》之篇，亡。\"云\"馀并见《诗》、《书》\"者，《舜典》云：\"有能俾乂？\"《小雅•菀柳》云：\"俾予靖之。\"《大雅•生民》云：\"茀厥丰草。\"弗、茀音义同。" }
      - { type: j, text: "颐、艾、育，养也。（汝颍梁宋之间曰艾，《方言》云）" }
      - { type: z, text: "\"颐、艾、育，养也\"。○释曰：颐者，《易》曰：\"颐贞吉。\"育者，《易•无妄》：\"象曰：先王以茂对时育万物。\"郭云\"汝颍梁宋之间曰艾，《方言》云\"者，案《方言》云：\"台、胎、陶、鞠，养也。晋卫燕赵曰台（音颐），陈楚韩郑之间曰鞠，秦或曰陶，汝颍梁宋之间曰胎，或曰艾。\"是也。" }
      - { type: j, text: "汱、浑、陨，坠也。（汱、浑皆水落貌。○汱，姑犬切。浑，故本切）" }
      - { type: z, text: "\"汱、浑、陨，坠也\"。○释曰：皆坠落也。郭云：\"汱、浑皆水落貌。\"《春秋》僖公十六年经云：\"星陨如雨。\"" }
      - { type: j, text: "际、接、翜，捷也。（捷谓相接续也。○翜，所甲切）" }
      - { type: z, text: "\"际、接、翜，捷也\"。○释曰：郭云：\"捷谓相接续也。\"际者相会之捷也。\"《左传》曰：\"尔未际也。\"《小雅•菀柳》云：\"无自瘵焉。\"郑笺云：\"瘵，接也。\"接者，《曾子问》云：\"接祭而巳。\"谓捷速而祭也。翜者未详。" }
      - { type: j, text: "毖、神、溢，慎也。（神未详。馀见《诗》、《书》。○毖音袐）" }
      - { type: z, text: "\"毖、神、溢，慎也\"。○释曰：谓谨慎也。毖者，《周官•洛诰》云：\"夙夜毖祀。\"溢者，舍人曰：\"溢，行之慎。\"《周颂•维天之命》云：\"假以溢我。\"故注云\"见《诗》、《书》。\"" }
      - { type: j, text: "郁陶、繇，喜也。（《孟子》曰：\"郁陶思君。\"《礼记》曰：\"人喜则斯陶，陶斯咏，咏斯犹。\"犹即繇也。古今字耳。○繇音由）" }
      - { type: z, text: "\"郁陶、繇，喜也\"。○释曰：皆谓欢悦。郁陶者，心初悦而未畅之意也。○注\"《孟子》\"至\"字耳\"。○释曰：云\"《孟子》曰：郁陶思君\"者，案《孟子》云：\"象往入舜官，舜在床琴。曰：'郁陶思君尔。'忸怩。\"赵氏注云：\"象见舜生在床鼓琴，愕然，反辞曰：'我郁陶思君，故来。'尔，辞也。忸怩而惭，是其情也。\"云\"《礼记》曰：人喜则斯陶，陶斯咏，咏斯犹\"者，下《檀弓》文。郑注云：\"陶，郁陶也。咏，呕也。犹当为摇声之误也。摇谓身动摇也。秦人犹、摇声相近。\"云\"犹即繇也，古今字耳\"者，言《礼记》\"犹\"即此经\"繇\"也，古今字异耳。" }
      - { type: j, text: "馘、穧，获也。（今以获贼耳为馘，获禾为穧。并见《诗》。○馘，古获切。穧，才细切）" }
      - { type: z, text: "\"馘、穧，获也\"。○释曰：皆谓克获也。郭云\"今以获贼耳为馘\"者，《大雅•皇矣》云：\"攸馘安安。\"毛传云：\"不服者杀而献其左耳曰馘。\"《鲁颂•泮水》云：\"在泮献馘。\"郑笺云：\"馘，所格者之左耳，皆谓临陈格杀之，而取其耳也。\"云\"获禾为穧\"者，《小雅•大田》云：\"此有不敛穧。\"穧者，禾之铺而未束，故云\"获禾为穧\"。是并见《诗》也。" }
      - { type: j, text: "阻、艰，难也。（皆险难。○难，乃旦切）" }
      - { type: z, text: "\"阻、艰，难也\"。○释曰：皆险难也。《秦风•蒹葭》云：\"道阻且长。\"《商书•说命》云：\"非知之艰。\"" }
      - { type: j, text: "剡、㗉，利也。（诗曰：\"以我剡耜。\"○剡，羊冉切。㗉音略）" }
      - { type: z, text: "\"剡、㗉，利也\"。○释曰：皆耜之利也。《小雅•大田》云：\"以我覃耜。\"剡、覃音义同。《周颂•载芟》云：\"有略其耜。\" 㗉、略音义同。" }
      - { type: j, text: "允、任、壬，佞也。（《书》曰：\"而难任人。\"允信者，佞人似信。壬犹任也。○任，壬林切）" }
      - { type: z, text: "\"允、任、壬，佞也\"。○释曰：皆谓谄佞也。允，信也。佞人似信。任者，孙炎云：\"似可任之佞也。\"《虞书•舜典》云：\"而难任人。\"壬犹任也。《皋陶谟》云：\"何畏乎巧言、令色、孔壬？\"" }
      - { type: j, text: "俾、拼、抨，使也。（皆谓使令。见《诗》）俾、拼、抨、使，从也。（四者又为随从。○拼，北萌切。抨，烹）" }
      - { type: z, text: "\"俾、拼、抨，使也\"至\"从也\"。○释曰：皆谓使令、随从也。郭云\"见《诗》\"者，《鲁颂•閟宫》云：\"俾尔炽而昌。\"《大雅•桑柔》云：\"荓云不逮。\"拼、荓音义同，抨义亦同。此皆为使令也。俾、拼、抨、使四者又为随从。" }
      - { type: j, text: "儴、仍，因也。（皆谓因缘。○儴音穰）" }
      - { type: z, text: "\"儴、仍，因也\"。○释曰：皆因缘也。《费誓》曰：\"无敢寇攘。\"郑注云：\"因其亡失曰攘。\"儴、攘音义同。施博士读曰襄。《周书•君奭》云：\"襄我二人。\"郭无明说，义得两通。《论语》云：\"仍旧贯。\"" }
      - { type: j, text: "董、督，正也。（皆谓御正）" }
      - { type: z, text: "\"董、督，正也\"。○释曰：皆谓御正也。《虞书•大禹谟》云：\"董之用威。\"《春秋》僖公十二年《左传》云：\"谓督不忘。\"" }
      - { type: j, text: "享，孝也。（享祀，孝道）" }
      - { type: z, text: "\"享，孝也\"。○释曰：享祀，孝道也。《小雅•南山》云：\"享於祖考。\"" }
      - { type: j, text: "珍、享，献也。（珍物宜献。《榖梁传》曰：\"诸侯不享觐。\"）" }
      - { type: z, text: "\"珍、享，献也\"。○释曰：致物於尊者曰献。珍者，珍物宜献也。享者，《周礼•大行人》云：\"庙中将币三享。\"郑司农云：\"三享，三献也。\"郭云\"《榖梁传》曰：诸侯不享觐\"者，隐五年文。" }
      - { type: j, text: "纵、缩，乱也。（纵放、掣缩，皆乱法也）" }
      - { type: z, text: "\"纵、缩，乱也\"。○释曰：放纵、掣缩，皆乱法也。《大雅•民劳》云：\"无纵诡随。\"" }
      - { type: j, text: "探、篡、俘，取也。（《书》曰：\"俘厥宝玉。\"篡者，夺取也。探者，摸取也。○探音贪。篡，初患切。俘音孚）" }
      - { type: z, text: "\"探、篡、俘，取也\"。○释曰：郭云：\"探者，摸取也。篡者，夺取也。\"李巡曰：\"囚敌曰俘。伐执之曰取。\"○注\"书曰\"至\"取也\"。○云\"书曰：俘厥宝玉\"者，《商书》叙云：\"夏师败绩，汤遂从之，遂伐三朡，俘厥宝玉。\"孔氏云：\"俘，取也。\"" }
      - { type: j, text: "徂、在，存也。（以徂为存，犹以乱为治，以曩为曏，以故为今。此皆诂训义有反覆旁通，美恶不嫌同名）" }
      - { type: z, text: "\"徂、在，存也\"。○释曰：《郑风•出其东门》：\"匪我思且。\"郑笺云：\"非我思存也。\"徂、且音义同。在训存者，常语也。上云：\"徂，往也。\"往则非存，故郭氏引类以晓人也。云\"美恶不嫌同名\"者，案隐七年《公羊传》云：\"贵贱不嫌同号，美恶不嫌同辞。\"何休云：\"若继体君亦称即位，继弑君亦称即位，皆有起文美恶不嫌同辞。\"是也。若此篇往也、死也，亦称徂，是恶也；存也，亦称徂，是美也。各有其义，故称\"美恶不嫌同名\"。" }
      - { type: j, text: "在、存、省、士，察也。（《书》曰：\"在璇玑玉衡。\"士，理官，亦主听察。存即在）" }
      - { type: z, text: "\"在存\"至\"察也\"。○释曰：谓审察也。《虞书•舜典》云：\"在璇玑玉衡，以齐七政。\"存即在也。省谓视察。《论语》云：\"吾日三省吾身。\"士者，理狱之官，亦主听察。《虞书•舜典》：\"舜命皋陶云：汝作士。\"" }
      - { type: j, text: "烈、枿，馀也。（晋卫之间曰蘖，陈郑之间曰烈。○枿，五割反）" }
      - { type: z, text: "\"烈、枿，馀也\"。○释曰：谓遗馀也。《诗•大雅•云汉》叙云：\"宣王承厉王之烈。\"李巡曰：\"枿，槁木之遗也。\"《商书•盘庚》云：\"若颠木之有由蘖。\"枿、蘖音义同。郭云\"晋卫之间曰蘖，陈卫之间曰烈\"者，《方言》文。" }
      - { type: j, text: "迓，迎也。（《公羊传》曰：\"跛者迓跛者。\"）" }
      - { type: z, text: "\"迓，迎也\"。○释曰：谓相逢迎也。○注\"《公羊》\"至\"跛者\"。○释曰：云\"《公羊传》曰：跛者迓跛者\"，此成二年传文。案彼云：\"晋郤克与臧孙许同时而聘于齐。萧同侄子者，齐君之母也；踊于棓而窥客，则客或跛或眇。於是使跛者迓跛者，眇者迓眇者。\"是也。引之以证迓为迎也。宣三年《左传》曰：\"狂狡辂郑人。\"杜注云：\"辂，迎也。\"《周礼•秋官》有讶士，及《聘礼》云：\"厥明，讶于馆。\"郑注皆云：\"讶，迎也。\"《召南•鹊巢》云：\"百两御之。\"郑注云：\"御，迎也。\"字形虽别，音义实同。盖以作非一人，致兹异也。当以迓为正字，馀皆假借。" }
      - { type: j, text: "元、良，首也。（《左传》曰：\"狄人归先轸之元。\"良，未闻）" }
      - { type: z, text: "\"元、良，首也\"。○释曰：谓头首也。郭云\"《左传》曰：狄人归先轸之元\"者，僖三十三年，\"狄伐晋，及箕。八月戊午，晋侯败狄于箕。郤缺获白狄子。先轸曰：'匹夫逞志於君而无讨，敢不自讨乎？'免胄入狄师，死焉。狄人归其元，面如生。\"是也。又证元为首。良，未详。" }
      - { type: j, text: "荐、挚，臻也。（荐，进也。挚，至也。故皆为臻至也。○荐，曹练切）" }
      - { type: z, text: "\"荐、挚，臻也\"。○释曰：臻，至也。荐进、执挚皆所以表至也。" }
      - { type: j, text: "赓、扬，续也。（《书》曰：\"乃赓载歌。\"扬，未详。○赓，古孟切）" }
      - { type: z, text: "\"赓、扬，续也\"。○释曰：谓相继续也。郭云\"《书》曰：乃赓载歌\"者，《虞书•益稷》文。" }
      - { type: j, text: "祔、祪，祖也。（祔，付也。付新死者於祖庙。祪，毁庙主。○祪音鬼）" }
      - { type: z, text: "\"祔、祪，祖也\"。○释曰：谓先祖也。说文云：\"祔，後死者合食於先祖也。\"郭云：\"祔，付也，付新死者於祖庙。\"《士虞记》云：\"明日於其班祔。\"毁庙之主名祪。" }
      - { type: j, text: "即，尼也。（即犹今也。尼者近也。《尸子》曰：\"悦尼而来远。\"○尼，女乙切）" }
      - { type: z, text: "\"即，尼也\"。○释曰：尼，近也。言即今相近也。" }
      - { type: j, text: "尼，定也。（尼者止也，止亦定）" }
      - { type: z, text: "\"尼，定也\"。○释曰：尼诂为止，止即定。舍人曰：尼者私之定也。" }
      - { type: j, text: "迩、几、暱，近也。（暱，亲近也。○几音机。暱，女乙切）" }
      - { type: z, text: "\"迩、几、暱，近也\"。○释曰：皆谓殆近也。迩者，《郑风•东门之墠》云：\"其室则迩。\"几者，《聘义》曰：\"日几中而后礼成。\"暱者，郭云：\"亲近也。\"《小雅•菀柳》云：\"无自暱焉。\"" }
      - { type: j, text: "妥、安，坐也。（《礼记》曰：\"妥而後传命。\"○妥，他可切）" }
      - { type: z, text: "\"妥、安，坐也\"。○释曰：妥定之坐也。○注\"《礼记》\"至\"传命\"。○释曰：云：\"《礼记》曰：妥而後传命\"者，案《士相见礼》云：\"凡言非对也，妥而後传言。\"郑注云：\"凡言，谓巳为君言事也。妥，安坐也。传言，犹出言也。\"此言\"《礼记》曰：妥而后传命\"者，传写误也。或所见本异。" }
      - { type: j, text: "貉、缩，纶也。（纶者绳也，谓牵缚缩貉之。今俗语亦然。○貉音陌）" }
      - { type: z, text: "\"貉、缩，纶也\"。○释曰：郭云：\"缩者绳也，谓牵缚缩貉之。\"今俗语亦然。\"据时验而言也。《大雅•绵》篇云：\"其绳则直，缩板以载。\"" }
      - { type: j, text: "貉、嗼、安，定也。（皆静定。见《诗》。○嗼音莫）" }
      - { type: z, text: "\"貉、嗼、安，定也\"。○释曰：皆静定也。《大雅•皇矣》云：\"貊其德音。\"毛传云：\"貉，静也。\"郑笺云：\"德应和曰貉。\"嗼者，《皇矣》又云：\"求民之莫。\"郑笺云：\"求民之定。\"谓所归就也。貉貊、嗼莫音义同。安者，《小雅•斯干》云：\"乃安斯寝。\"" }
      - { type: j, text: "伊，维也。（发语辞）伊、维，侯也。（《诗》曰：\"侯谁在矣。\"互相训）" }
      - { type: z, text: "\"伊维也\"至\"侯也\"。○释曰：皆发语辞。转互相训。《邶•谷风》云：\"伊余来塈。\"《大雅•大明》云：\"维此文王。\"《小雅•六月》云：\"侯谁在矣。\"" }
      - { type: j, text: "时、寔，是也。（《公羊传》曰：\"寔来者何？是来也。\"○寔音石）" }
      - { type: z, text: "\"时、寔，是也\"。○释曰：是，此也。《秦风•驷驖》云：\"奉时辰牡。\"郭云\"《公羊传》曰：寔来者何？是来也\"者，案《春秋》桓五年\"冬，州公如曹\"。六年\"春，正月，寔来\"。《公羊传》曰：\"'寔来'者何？犹曰'是人来'也。\"引之证寔为是也。" }
      - { type: j, text: "卒、猷、假、辍，已也。（猷、假未详。○卒，子恤切。辍，丁劣切）" }
      - { type: z, text: "\"卒猷\"至\"已也\"。○释曰：皆谓终已也。卒者，终尽之巳也。辍，止巳也。《论语》曰：\"耰而不辍。\"" }
      - { type: j, text: "求、酋、在、卒、就，终也。（《诗》曰：\"嗣先公尔酋矣。\"成就亦终也。其馀未详。○酋，在由切）" }
      - { type: z, text: "\"求酋\"至\"终也\"。○释曰：皆谓终尽也。求者，《大雅•下武》云：\"世德作求。\"郭云\"《诗》曰：嗣先公尔酋矣\"者，《大雅•卷阿》文。卒者，《邶风•日月》云：\"畜我不卒。\"就者，凡事物成就亦终也。" }
      - { type: j, text: "崩、薨、无禄、卒、徂落、殪，死也。（古者死亡，尊卑同称耳，故《尚书》尧曰\"徂落\"，舜曰\"陟方乃死\"。○薨，呼弘切。殪，於计切）" }
      - { type: z, text: "\"崩薨\"至\"死也\"。○释曰：此皆死之别称也。《曲礼》曰：\"天子死曰崩，诸侯曰薨，大夫曰卒，士曰不禄，庶人曰死。\"郑注云：\"异死名也。为人亵其无知若犹不同然也。自上颠坏曰崩。薨，颠坏之声。卒，终也。不禄，不终其禄。其之言澌也，精神澌尽也。又曰：\"寿考曰卒，短折曰不禄。\"郑注云：\"禄谓有德行，任为大夫、士而不为者，老而死，从大夫之称；少而死，从士之称。\"此云\"无禄\"者，即彼之\"不禄\"也。但落者，李巡曰：\"徂落，尧死之称。\"郭云：\"古者死亡，尊卑同称耳，故《尚书》尧曰徂落，舜曰陟方乃死\"者，皆《虞书•舜典》文也。谓之徂落者，盖徂为往也，言人命尽而往落者，若草木叶落也。殪者，案隐九年《左传》云：\"衷戎师，前後击之，尽殪。\"杜注云：\"殪，死也。" }
