# 毛詩正義卷14（孔穎達疏）：j 為經文＋毛亨傳、鄭玄箋，z 為疏文。
sections:
  - id: juan14
    name: 正文
    blocks:
      - { type: j, text: "《青蠅》，大夫刺幽王也。蠅，餘仍反。" }
      - { type: j, text: "營營青蠅，止於樊。興也。營營，往來貌。樊，藩也。箋雲：興者，蠅之為蟲，汙白使黑，汙黑使白，喻佞人變亂善惡也。言止於藩，欲外之，令遠物也。○營，如字，《說文》作“營”，雲：“小聲也。”樊音煩。藩，方元反，一本甫煩反。汙，汙辱之汙，烏路反。令，力成反。遠，於萬反。" }
      - { type: j, text: "豈弟君子，無信讒言。箋雲：豈弟，樂易也。○愷，開在反。悌音弟。樂音洛。易，以豉反。" }
      - { type: z, text: "“營營”至“讒言”。○正義曰：言彼營營然往來者，青蠅之蟲也。此蟲汙白使黑，汙黑使白，乃變亂白黑，不可近之，當去止於藩籬之上，無令在宮室之內也。以興彼往來者，讒佞之人也。讒人喻善使惡，喻惡使善，以變亂善惡，不可親之，當棄於荒野之外，無令在朝廷之上也。讒人為害如此，故樂易之君子，謂當今之王者，無得信受此讒人之言也。○傳“樊，藩”。○正義曰：《釋言》文也。孫炎曰：“樊圃之藩。”然則園圃藩籬是遠人之物，欲令蠅止之，故箋雲“外之，令遠物”，令使遠於近人之物。又藩以細木為之，下章棘、榛即是為藩之物，故下傳曰：“榛，所以為藩。”明棘亦然也。此章言藩，下章言所用之木，互相足也。" }
      - { type: j, text: "營營青蠅，止於棘。讒人罔極，交亂四國。箋雲：極，猶已也。" }
      - { type: j, text: "營營青蠅，止於榛。榛，所為藩也。○榛，士中反，又側巾反。讒人罔極，構我二人。箋雲：構，合也。合，猶交亂也。" }
      - { type: z, text: "箋“構，合。合，猶交亂”。○正義曰：構者，構合兩端，令二人彼此相嫌，交更惑亂，與上章義同，故云“猶交亂也”。上言“四國”，此雲“二人”者，二人謂人君與見讒之人也。讒者，每人讒之，常構二人，構之不已，至交亂四國。先多而後少，故先四國也。" }
      - { type: j, text: "《青蠅》三章，章四句。" }
      - { type: j, text: "《賓之初筵》，衛武公刺時也。幽王荒廢，媟近小人，飲酒無度。天下化之，君臣上下沈湎淫液。武公既入，而作是詩也。淫液者，飲酒時情態也。武公入者，入為王卿士。○筵音延。媟，息列反。近，附近之近。沈，如字，直林反。字或作“耽”，都南反。湎，莫衍反，飲酒齊其色曰湎，徐又莫顯反。液音亦。態，他代反。" }
      - { type: z, text: "“《賓之初筵》五章，章十四句”至“是詩”。○正義曰：《賓之初筵》詩者，衛武公所作，以刺時也。以幽王政教荒亂而惰廢，乃媟慢親近小人，與之飲酒，無有節度。令使天下化而效之，致天下諸侯君臣上下亦效而行之，沈酗於酒，湎齊顏色，淫液不止，遂成風俗。衛武公既入為王之卿士，見其如此，而作是詩以刺之也。定本、《集註》並雲“飲酒無度”，俗本作“飲食”，誤也。刺時者，即幽王之時也。以幽王之文見於下，故言刺時以目之。案《著》雲：“刺時也，時不親迎。”鄭以為，直刺君身。則言時者，目其時之君，由可以兼見於當時矣。此“君臣上下”，文在“天下化之”之下，則是天下諸國之君臣也。“沈湎淫液”，即飲酒無度之事。舉化者尚沈湎淫液，則王朝亦沈湎淫液可知矣。言武公既入者，言作詩之早晚耳。《雅》者，言天下之事，形於四方之風，譚大夫尚得作詩以刺王，則在國亦得作，不要待入王朝也。沈湎者，《尚書·微子》曰：“用沈酗於酒，亂敗厥德於下。”《蕩》曰：“天不湎爾以酒。”箋雲：“天不同爾顏色以酒。”《酒誥》注云：“齊色曰湎。”然則沈湎者，飲酒過久，若沈沒然，使湎然俱醉，顏色齊同也。此經五章，毛以上二章陳古燕射之禮，次二章言今王燕之失。鄭以上二章陳古大射行祭之事，次二章言今王祭末之燕。俱以上二章陳古以駁今，次二章刺當時之荒廢。卒章乃言天下化之。三章、四章言賓“屢舞”、“號、呶”，是媟近小人，飲酒無度也。卒章言“凡此飲酒”，為天下之辭，是天下化也。卒章無君臣淫泆之事者，此天下化之，效上所為。效者尚然，君臣可知，故經舉天下之民，以明其君臣也。“不醉反恥”，是使齊醉也。其設戒童羖之言，出與不出之語，併為沈湎之事也。或以為，君臣上下沈湎淫泆倒本幽王之君臣，則天下化之，宜居於下，非文之勢，理在不然。○箋“淫泆”至“情態”。○正義曰：《樂記》說樂之遲雲：“詠歎之，淫泆之。”則淫液，遲久之意也。小人未醉，身有惡態，強自收掩。及其醉酒，則舊時情態皆出。《莊子》說察人之法曰：“醉之以酒，以觀其態。”是久飲酒則情態出也。下箋雲：“至於旅酬，小人之態出。”亦謂久飲態出，故舞不知止也。定本、《集註》“態”下皆無“出”字。毛於首章傳曰：“有燕射之禮。”二章傳曰：“主人請射於賓。”則毛以上二章皆陳古者先行燕禮，後為燕射，無祭祀之事也。《燕禮》於旅酬之後，雲：“若射，則大射正為司射，如鄉射之禮。”是燕射之法，先行燕禮，而後射也。首章“舉酬逸逸”以上八句，皆說燕事。舉酬即旅酬也。《燕禮》旅後乃射，故“舉酬”之下說“大侯既抗”以下六句為射事也。燕必有樂，故二章又重說燕事。“籥舞笙鼓”，是燕時之樂。若燕樂之義，得先祖之神悅，故因論樂事，遂引而致之。言樂既和而奏之，可以進樂先祖。每事得禮，則神降之福。至“子孫其湛”以來六句，說燕樂得宜，可使明神降福之意。燕樂得所，則神明福之，是不可不以禮燕射，故下四句復說射事。言賓主相耦入，次取弓矢而又射也。此兩章皆初論燕，後論射，而首章言籩豆，二章言笙鼓者，燕以飲食為主，作樂助其勸耳，故先言酒殽，而後言聲樂。三章、四章言今王燕飲，初雖重慎，後則失儀，至於音聲號呶，舞不休息。卒章言下民化之，亦荒於酒，皆刺當時沈湎之事。鄭以將祭而射謂之大射。大射之初，先行燕禮。首章上八句言射初飲燕之事，下六句言大射之事。二章言作樂以祭，盡章皆說祭時之事。三章、四章，言今王祭末，與族人私燕，小人為賓，威儀昏亂。唯卒章與毛同耳。" }
      - { type: j, text: "賓之初筵，左右秩秩。秩秩然肅敬也。箋雲：筵，席也。左右，謂折旋揖讓也。秩秩，知也。先王將祭，必射以擇士。大射之禮，賓初入門，登堂即席，其趨翔威儀甚審知，言不失禮也。射禮有三：有大射，有賓射，有燕射。○秩，直乙反，鄭“智也”。折，之舌反。知音智。下同。籩豆有楚，殽核維旅。楚，列貌。殽，豆實也。核，加籩也。旅，陳也。箋雲：豆實，菹醢也。籩實，有桃梅之屬。凡非穀而食之曰殽。○餚核，上戶交反，下戶革反。菹，側俱反。酒既和旨，飲酒孔偕。箋雲：和旨，酒調美也。孔，甚也。王之酒已調美，眾賓之飲酒又威儀齊一，言主人敬其事，而眾賓肅慎。○偕音皆。鍾鼓既設，舉醻逸逸。逸逸，往來次序也。箋雲：鍾鼓於是言既設者，將射故縣也。○醻，市由反。縣音玄。大侯既抗，弓矢斯張。大侯，君侯也。抗，舉也。有燕射之禮。箋雲：舉者，舉鵠而棲之於侯也。《周禮·梓人》“張皮侯而棲鵠”。天子諸侯之射皆張三侯，故君侯謂之大侯。大侯張，而弓矢亦張節也。將祭而射，謂之大射。下章言“烝衎烈祖”，其非祭與？○抗，若浪反。斯張，如字。鵠，戶沃反，鵠鴿也，《說文》雲“即鵲也”，小而難中。又云：“鵠者，覺也，直也，射者直己志。”棲音西，著也。梓音子。衎，苦旦反。祭與，音餘，本作“乎”，又作“也”，並非。射夫既同，獻爾發功。箋雲：射夫，眾射者也。獻，猶奏也。既比眾耦，乃誘射，射者乃登射，各奏其發矢中的之功。○發如字，徐音廢。比，毗志反。中，丁仲反。" }
      - { type: j, text: "發彼有的，以祈爾爵。的，質也。祈，求也。箋雲：發，發矢也。射者與其耦拾發。發矢之時，各心競雲：“我以此求爵女。”爵，射爵也。射之禮，勝者飲不勝，所以養病也，故《論語》曰：“下而飲，其爭也君子。”○勺音的，本亦作“的”，同。祈音其。拾，其劫反，更也。飲，於鴆反。下同。爭，爭鬥之爭。" }
      - { type: z, text: "“賓之”至“爾爵”。○毛以為，古之將行燕射，先為燕禮。燕禮之時，其賓之初入門，以至於升筵，其折旋揖讓隨其左右，趨翔威儀甚肅敬而秩秩然，而不失禮也。其升筵之時，則王之籩豆有楚然而陳列之矣，又菹醢之殽與有核桃梅維旅而陳之於籩豆之上矣，其王之酒既又和調旨美。時眾賓之飲酒者，威儀甚偕，言其齊一而順禮也。及其將射，鍾鼓既巳改設，舉相酬之爵，逸逸然往來而有次序也。既旅之後，止飲而行射事。君之所射大侯既舉而張之，其眾射之弓矢，於斯舉侯之時，又亦張之矣。弓矢既張，眾射之夫既同登於堂而在射位，遂各呈奏爾之射者發矢中的之功。此射者發矢射，彼有射。與其耦拾發之時，則各心競雲：“我發必使中，以求不飲汝養病之爵。”今不能然，故舉以刺之。○鄭唯行燕至安賓之後而行大射為異，其文義則同。○傳“秩秩然肅敬”。○正義曰：箋依《釋訓》雲：“秩秩，智也。”傳言肅敬者，以序刺媟慢，由有智而能肅敬，理亦通也。○箋“筵席”至“燕射”。○正義曰：《春官·司几筵》注云：“筵亦席也。鋪陳曰筵，藉之曰席。”然其言之筵、席通也。左右，謂折旋揖讓者，以賓與主人為禮，隨其左右之宜，其行或方折，或迴旋，相揖而辭讓也。今《大射禮》諸侯與其臣行禮，使宰夫為主人。案其經“擯者納賓，及庭，公降一等揖之。公外席，賓列自西階，主人從之。賓右北面，再拜，賓答拜。主人降洗。賓降，主人辭降。主人取觚洗，賓辭，洗。主人卒洗，賓揖升。筵前獻賓，賓拜受爵於筵前。然後賓升筵”。是賓初入門至即筵以來，每折旋揖讓之事也。折旋揖讓，則或左或右，故知左右謂折旋揖讓也。《射義》曰：“古者諸侯之射也，必先行燕禮。”故此言升筵薦酒，行燕禮也。《射義》又曰：“天子將祭，必先習射於澤宮。澤者，所以擇士也。已射於澤宮，然後於射宮。射中者得與於祭，不中者不得與於祭。”是先王將祭，必射以擇士也。先於澤宮，後於射宮，是將祭再為射禮。澤宮言習射，則未是正射。正射於射宮乃行。《大射》雲：“公入騖。”注云：“此公出，而言入者，大射於郊。”《鄉射記》曰：“於郊，則閭中。”注云：“於郊，謂大射於學。”則射宮者，西郊之學也。澤宮之所在則無明文。言賓之初筵，左右秩秩，則從為賓。以至於即筵，皆秩秩也。以其言廣，故云：“大射之禮，賓初入門，登堂即席，其趍翔威儀甚審智，言其不失禮也。”審智，言其安審而有智，與毛肅敬同也。毛以此篇為燕射，鄭則為大射，因辨禮射之數，言已不同之意也，故云“射禮有三：有大射，有賓射，有燕射”。大射者，將祭擇士於射官。賓射者，謂諸侯來朝，與之射於朝。燕射者，因燕賓客，即與射於寢。此三者，其處不同，其侯亦別。《冬官·梓人》雲：“張皮侯而棲鵠，則春以功。張五采之侯，則遠國屬。張獸侯，則王以息燕。”三者別文，皮侯即大射也；五采之侯，賓射也；獸侯，燕射也。不言鄉射者，鄉射是州長與其民射於州序之禮，天子諸侯無之，故不言也。○傳“楚列”至“旅陳”。○正義曰：此言籩豆之設，故知楚為陳列貌也。此經二句自相充配，殽、核即籩豆所盛，殽則實之於豆，核則加之於籩，故言“殽，豆實。核，加籩也”。先殽後核，不依籩豆次者，便其文耳。祭禮有加豆籩，傳言加籩，知非加豆籩者，以此非祭，無取加豆之義。而又《天官·籩人》“加籩之實，菱、茨、栗、脯”，非核物，且以“殽，豆實”類之，知加之於籩，非為籩加之也。“旅，陳”，《釋詁》文。楚是陳列之貌，旅又為陳者，謂陳殽核於籩豆之上也。○箋“豆實”至“曰殽”。○正義曰：《天官·醢人》“掌四豆之實”，韭菹醓醢之等皆實之於豆，故云豆實謂菹醢。《籩人》雲：“饋食之籩，其實棗、栗、桃、乾{艹療}”。注云：“{艹療}，乾梅也。”《內則》有桃諸、梅諸，是其乾者也。桃梅有核之物，申傳說加籩之義，故云“籩實，有桃梅之屬”，故稱核也。言“之屬”者，以燕之物多，非止桃梅，故稱屬也。既以豆實為菹醢，恐殽名唯施於此，故云“凡非穀實而食之曰殽”，明殽是總名。以此文殽核與籩豆相對，故分之耳。其實核亦為殽。《魏風》曰：“園有桃，其實之殽。”是在籩之物亦為殽也。《醢人》雲：“羞豆之實，酏食、糝食。”酏、糝皆以稻米為之，則豆實之殽亦有穀實矣。言非穀實者，穀實謂為飯食者也。今變為雜用，不同穀實之限。○箋“主人”至“肅慎”。○正義曰：偕者，俱也。言其俱相類，故言眾賓之飲酒，又威儀齊一也。言主人敬其事，而眾賓肅慎，明賓主皆得其宜，所以為美也。○傳“逸逸，往來次序”。○正義曰：《燕禮》旅酬之後乃雲“若射”，此將射而言舉酬行旅也，旅者，以長幼次序之言，故知“逸逸，往來有次序也”。《燕禮》初則雲“樂人宿懸”，注云：“懸鐘磬也。”國君無故不徹懸，言懸者，為燕新之，然則於此言“鐘鼓既設”者，亦為將射改懸也。以天子宮懸階間，妨射位，故改懸以避射也。《鄉射禮》將射乃雲：“樂正命弟子贊工遷樂於下。”注云：“當避射位。”彼琴瑟之樂尚遷之，明鐘鼓之懸改之矣。○箋“鐘鼓”至“改懸”。○正義曰：《大射》諸侯之禮雲：“樂人宿懸，厥明乃射。”明天子亦然。今至於舉酬，始言“鐘鼓既設”，故知將射改懸也。大射不言改懸者，國君與臣行禮略三面而已，不具軒懸。東西懸在兩階之外，兩階之間有二建鼓耳。東近東階，西近西階，又無鐘鼓，不足以妨射，不須改也。《大射》注云：“國君於其群臣，備三面耳，無鐘磬，有鼓而已。其為諸侯則軒懸。”是由階間無懸，故不改也。鄭言諸侯為諸侯則軒懸，明天子於其臣備宮懸，將射而改之，故於此言“既設”也。○傳“大侯”至“之禮”。○正義曰：傳唯言“大侯，君侯”，不言侯之所用。《梓人》雲：“張獸侯則王以息燕。”是燕射射獸侯，則毛意亦當然矣。燕射之禮，自天子至士皆一侯，上下共射之，無三侯、二侯，故《鄉射記》雲：“天子熊侯白質。諸侯麋侯赤質。大夫布侯，畫以虎豹。士布侯，畫以鹿豕。”注云：“此所謂獸侯也。燕射則張之，鄉射及賓射當張採侯二正。而記此者，天子諸侯之燕射，各以其鄉射之禮而張此侯，是以雲焉。白質、赤質者，皆謂採其地。不採者，曰布也。熊麋虎豹鹿豕，皆正面畫其頭象於正鵠之處。君畫一，臣畫二，陽奇陰耦之數也。燕射射熊虎豹，不忘上下相犯。射麋鹿豕，志在君臣相養也。其畫之者，皆毛物也。”又曰：“凡畫者，丹質。”注云：“賓射之侯，燕射之侯，皆畫雲氣於側以為飾。必先以丹採其地，丹淺於赤。”又曰：“鄉侯，中十尺，侯道五十弓，弓二寸以侯中。”如此則天子燕射唯射一侯耳。侯身一丈，其中三分居一以白地畫熊於外，則丹地畫以雲氣。唯此一侯，君臣共射。而云“大侯，君侯”者，以君所射，故謂之大。傳解言大之意，故以“君侯”釋之，非謂與君臣別侯也。《大射禮》雲：“大侯九十弓。”彼張三侯，其九十弓者最高大，故云名大侯，亦以君之所射故也。言有燕射之禮者，以上文謂燕，此下說射，故言禮有燕射之禮，故此詩得言之。若然，燕禮言“若射”，如鄉射之禮。案鄉射初則張侯，此“舉酬”之下始言“大侯既抗”者，鄉射之初，雖言張侯，而以事未至，經雲：“不系左下綱，中掩束之。”至於將射，以司正為司馬，乃雲：“司馬命張侯，弟子脫束，遂系左下綱。”是將射始張之，故於此言“既抗”也。○箋“舉者”至“祭與”。○正義曰：案《大射》“前射三日，司馬命量人巾車張三侯”。《夏官·射人》雲：“若王大射，則以貍步張三侯。”則天子亦前射三日，其侯，射人張之矣。此將射而言大侯，既抗明非始張侯體，言舉鵠而棲之於侯中也。知者，鄭既雲“《周禮·梓人》：‘張皮侯而棲鵠’”，是鵠在侯，復別棲之，棲即舉也。彼注云：“皮侯，以皮所飾之侯也。”其上文雲“梓人為侯，廣與崇方，三分其廣，而鵠居一焉”。注云：“高廣等謂侯中。天子射禮，以九為節。侯道九十弓。弓二寸，以為侯中，高廣等。則天子侯中一丈八尺，諸侯於其國亦然。鵠，所射也，以皮為之，各如其侯也。居侯中三分之一，則此鵠方六尺。唯大射以皮飾侯。故言“張皮侯而棲鵠也”。《天官·司裘》注亦云：“以虎熊豹麋之皮飾其側，又方制之為質，謂之鵠，著於侯中，所謂皮侯也。”又解名曰大侯之意，“天子諸侯之射皆張三侯，故云君侯謂之大侯”。鄭以此為大射，故云“張三侯”。若燕射，則張一侯而已，無三侯也。《射人》雲：“王大射，張三侯。”《司裘》：“王大射，供虎侯、熊侯、豹侯，設鵠。天子之射，張三侯也。”《大射》：“巾車張三侯。”是諸侯之射張三侯也。《司裘》又曰：“諸侯供熊侯、豹侯。”不三侯者，注云：“諸侯謂三公及王子弟封於畿內者。”是畿內諸侯屈於天子，故二侯也。謂之侯與鵠者，《司裘》注云：“謂之侯者，天子中之，則能服諸侯。諸侯以下中之，則得為諸侯。謂之鵠者，取名瑦鵠也。瑦鵠，小鳥而難中，是以中之為俊也。亦取名鵠之言較，較者，直也，射所以直己志也。”《大射》注云：“或曰鵠，鳥名也。《淮南子》曰：‘瑦鵠知來。’然則所云正者，正也亦鳥名也，齊、魯之間名題肩為正。正、鵠皆鳥之捷點者也。”此因大射之鵠，而又解賓射之正，故言然也。《射人》注云：“正之言正也。射者內志正則能中焉。”是取鳥為名，又取正為義，亦猶鵠也。既已棲鵠，便即射之，故云“侯張，而弓矢亦張節也”。解抗侯之下言張弓之意。弓可言張，而並言矢者，矢配弓之物，連言之耳。既言大射之禮，而毛以此為燕射，故破之雲：“將祭而射，謂之大射。下章言‘烝衎烈祖’，其非祭乎？”既“烝衎烈祖”，是為祭事，則此時祭為大射，明矣，故難之也。鄭異於毛多矣。唯《採蘋》及此難之者，出於當時之意耳。王肅述毛雲：“幽王飲酒無度，故言燕禮之義。其奏雲：言燕樂之義得，則能進樂其先祖，猶《孝經》說大夫士之行曰：‘然後能守其宗廟而保其祭祀。’非唯祭之日然後能保而行之。以此，故言烝衎非實祭也。”孫毓以為，燕禮輕，祭事重。幽王無度，無不慢也。舉重可以明輕，輕不足以明重。又“錫爾純嘏，子孫其湛”，非燕飲之文所得及也。一篇之旨，箋義為長。○箋“射夫”至“之功”。○正義曰：大射所以擇士，當助祭者莫不在焉。“既同”，非一之辭，故知“射夫”，眾射者也。獻奏皆奉上之言，以發矢能中，是呈奏己功，故以獻為奏也。大射禮選群臣為三耦，若大夫不足，以士充之。三耦之外，其餘眾士與射者，各自取匹，謂之眾耦。《射人》說賓射之禮雲：“王以六耦。”則天子大射亦六耦也，故《周禮·夏官·大司馬職》雲：“若大射，則合諸侯之六耦。”此其義也。《射人》雲“諸侯四耦”，大射唯三耦者，賓射對鄰國之君，尊，故四耦。大射與己之臣子，卑，故降之。天子尊無與敵，其與射者皆是諸侯來朝，及在朝公卿，無所差降，明矣。大射、賓射但六耦之外，亦當有眾耦矣。言既比眾耦，乃誘射者，眾耦，正謂王之六耦，非謂六耦之外眾耦也。何者？《大射》於司射誓射之下雲：“遂比三耦。司射命三耦取弓於次，司射升堂誘射。既誘射，然後三耦登堂而射。三耦既射，乃雲遂比眾耦。”是比眾耦在誘射之後。今此箋雲“既比眾耦，乃誘射，射者乃登堂而射，各奏其發矢中的之功”。言“比眾耦”文在“誘射”之上，誘射之下始雲登堂而射，故知眾耦非如大射之眾耦也。必知然者，射以正耦為主，故禮定其尊卑之數。其餘眾耦才廁末而已，鄭何當舍其正耦而言及眾乎？正以六耦非一，故稱眾也。言誘射者，《大射》注云：“誘，教也。夫子循循然善誘人。”○傳“的，質”。○正義曰：毛氏於射侯之事，正、鵠不明，唯《猗嗟》傳雲：“二尺曰正。”亦不言正之所施。《周禮》鄭眾、馬融注皆雲“十尺曰侯，四尺曰鵠，二尺曰正，四寸曰質”，則以為侯皆一丈，鵠及正、質於一侯之中為此等級，則亦以此質為四寸也。王肅亦云“二尺曰正，四寸曰質”，又引《爾雅》雲：“‘射張皮謂之侯。侯中者謂之鵠。鵠中者謂之正。正方二尺也。正中謂之槷，方六寸也。槷則質也。’舊雲方四寸，今雲方六寸，《爾雅》說之明，宜從之。”此肅意唯改質為六寸，其餘同鄭、馬也。賈逵《周禮》注云：“四尺曰正。正五重，鵠居其內。而方二尺以為正，正大於鵠，鵠在正內，雖內外不同，亦共在一侯。”鄭於《周禮》上下檢之，以為大射之侯，其中制皮為鵠；賓射之侯，其中採畫為正。正大如鵠，皆居侯中三分之一。其燕射則射獸侯，侯中畫為獸形，即《鄉射記》所謂熊侯白質之類矣。三射之侯皆不同也。《射人》注說畫正之法雲：“其外之廣，居侯中三分之一，中言二尺。”與毛傳“二尺曰正”同也。《射義》雲：“孔子曰：‘循聲而發，發而不失正鵠者，其唯賢者乎？’《詩》雲：‘發彼有的，以祈爾爵。’”既言正、鵠，即引此的，則詩人之意以的為正、鵠之謂也。《司裘》注說皮侯之狀雲：“以虎熊豹麋之皮飾其側，又方制之以為質，謂之鵠。”是鄭意以侯中所射之處為質也。此傳唯言“的，質也”，不言質之大小，不必同於諸儒四寸、六寸也。且的者，明白之言，若廣才四寸，不足以為明矣。蓋亦為所射處與鄭同也。毛以此為燕射，則的者謂熊侯白質者也。○箋“發發矢”至“君子”。○正義曰：言射事，故知發為發矢。《大射禮》曰：“上射既發，挾矢而後下射射，拾發以將乘矢。”是射者與其耦拾發也。彼注云：“拾，更也。將，行也。”然則四矢謂之乘，言射者更代發以行此四矢，使四矢遍射也。上言“獻爾發功”，謂其行射時，此又本其發時之心，故云：“發矢之時，各心競雲：‘我以此求汝爵。’”謂求不飲也。《射義》引此詩，即雲：“祈，求也。求中以辭爵也。酒者，所以養老，所以養病，求中以辭養也。”注云：“欲求中之者，以求不飲汝爵是矣。”故此雲“射之禮，勝者飲不勝者，所以養病”，是辭養也。《大射禮》曰：“司射命設豐，司宮士奉豐，由西階升坐，設於西楹西。勝者之弟子，洗觶升酌散，南面坐奠於豐上。司射命三耦及眾射者，勝者皆袒決遂，執張弓，不勝者皆襲，脫決拾，卻左手，右加弛弓於其上，遂執弣。勝者先升堂。不勝者進北面坐，取豐上之觶，興，少退，立卒觶，坐奠於豐下。三耦卒飲。眾皆繼飲射爵，如三耦。”是飲射爵之禮。故《論語》曰：“下而飲，其爭也君子。”引此者，明“祈爾爵”為心中之爭也。此飲於西階上，言“下而飲”者，謂飲射爵時，揖讓而升下，意取而飲與爭，故引彼文不盡耳。《射義》又曰：“射者，仁之道也。射者，求正諸己，己正而後發。發而不中，則不怨勝己者，反求諸己而己矣。”是各心爭之事也。" }
      - { type: j, text: "籥舞笙鼓，樂既和奏。烝衎烈祖，以洽百禮。秉籥而舞，與笙鼓相應。箋雲：籥，管也。殷人先求諸陽，故祭祀先奏樂，滌盪其聲也。烝，進。衎，樂。烈，美。洽，合也。奏樂和，必進樂其先祖，於是又合見天下諸侯所獻之禮。○籥，餘若反。衎，若旦反。洽，戶夾反。應，應對之應。滌，徒歷反。樂音洛。下“樂其”、“湛樂”、“喜樂”，下文“曰樂”，並同。百禮既至，有壬有林。壬，大。林，君也。箋雲：壬，任也，謂卿大夫也。諸侯所獻之禮既陳於庭，有卿大夫，又有國君，言天下徧至，得萬國之歡心。○徧音遍。錫爾純嘏，子孫其湛。嘏，大也。箋雲：純，大也。嘏，謂屍與主人以福也。湛，樂也。王受神之福於屍，則王之子孫皆喜樂也。○錫音析。嘏，古雅反。湛，答南反。其湛曰樂，各奏爾能。賓載手仇，室人入又。手，取也。室人，主人也。主人請射於賓，賓許諾，自取其匹而射。主人亦入於次，又射以耦賓也。箋雲：子孫各奏爾能者，謂既湛之後，各酌獻屍，屍酢而卒爵也。士之祭禮，上嗣舉奠，因而酌屍。天子則有子孫獻屍之禮。《文王世子》曰：“其登餕獻受爵則以上嗣。”是也。仇讀曰奭阝。室人，有室中之事者，謂佐食也。又，復也。賓手挹酒，室人復酌為加爵。○能如字，徐奴代反，又奴來反。仇，毛音求，匹也，鄭讀為奭阝，音俱，謂挹取酒。餕，子峻反。復，扶又反。下皆同。挹，一入反。" }
      - { type: j, text: "酌彼康爵，以奏爾時。酒所以安體也。時，中者也。箋雲：康，虛也。時，謂心所尊者也。加爵之間，賓與兄弟交錯相酬。卒爵者，酌之以其所尊，亦交錯而已，又無次也。○中，張仲反。“人無次也”，一本“人”作“又”。" }
      - { type: z, text: "“籥舞”至“爾時”。○毛以為，古之行燕禮也，作樂以助歡心，使人秉籥而舞，與吹笙擊鼓音節相應。樂既和，奏之音聲甚得其所。既賓主有禮，八音和樂，如是則德當神明，可以進樂其先有功烈之祖，以合其酒食百眾之禮以獻之也。祭有酒食，聲樂可歆神，因言合獻眾禮。以是俱是事神之物，即乘而言之。此酒食百眾之禮既獻而至於祖時，則有祭祀之大禮，有孝子之人君，可以當於神明，為神所歆祐，賜汝孝子以大大之福，令子孫其皆耽樂而歡喜也。燕樂之和，可使神明降福，子孫耽樂。其此耽者，乃曰由燕飲之樂，是燕之不可以已也。故燕末將射，賓則自取其匹耦以共發，而居室之主人亦入於次，故取弓矢又射，以耦賓也。賓主射畢，而有勝否，乃酌彼安體之養爵，以奏進於汝之射中者，令以飲其不中而行罰也。此皆燕射之正禮，疾今不行。○鄭以為，既大射擇士與祭，故於此言其祭事。為祭之初，先秉籥而舞，吹笙擊鼓，聲音滌盪，節度相應。其樂既和而俱奏，詔告天地之間，進樂功烈之祖，以合百國所獻之禮，而薦之宗廟。百國所獻之禮，既至陳於庭，又有卿大夫矣，有諸侯君矣，是天下之徧至，得萬國之歡心，所以事其先祖也。先祖於是饗而祐之，錫爾王大嘏之福，令得保其家邦，則王之子孫蒙神之福，其皆耽而喜樂矣。子孫所以其耽者，曰由喜樂於神之福。是子孫亦當敬事神明，於嘏之後，乃各奏見爾子孫奉進之能，酌酒而獻屍，以事神也。子孫既獻，於是賓則手自奭阝挹其酒，室中佐食之人又入而酌為加爵，以獻屍也。既加爵之後，欲使神惠徧行，而賓之弟子及已弟子，酌彼空虛之爵，以進汝之此時心中所尊敬者。此皆先王祭祀之禮，疾今幽王不能然，至於洗湎而無度，故舉以刺之。○傳“秉籥”至“相應”。○正義曰：《簡兮》雲：“左手執籥，右手秉翟。”是執籥以舞也。舞在笙鼓之上，明其與之相應。樂器多矣，燕之所用，不止於此，作者舉鼓舞而言耳，此皆燕時樂也。或以此為節射之樂。案射禮主於射，略於樂。《大射》雲：“司射命曰：‘不鼓不釋。’”言射不與鼓節相應，不釋筭也。樂正命大師曰：“請奏《貍首》，間若一。”言調其疏數，以節射也。然則射之樂者，擊鼓作歌，與射者為節而已，不必大作諸樂。此雲鼓舞相應，非射樂矣。且傳意以此樂和奏，可以進樂先祖，安得舍燕初之盛作，而指節射之略者乎？以此知不然矣。○箋“殷人”至“之禮”。○正義曰：“殷人先求諸陽”，《郊特牲》文以。以人死體魄則降，智氣在上。《祭義》曰：“氣也者，神之盛也。魄也者，鬼之盛也。合鬼與神，教之至也。眾生必死，死必歸土，此之謂鬼。其氣發揚於上，神之著也。”又曰：“二端既立，報以二禮。”注云：“二端既立，謂氣也，魄也。”由人死有二者，故作樂揚其聲音之號，使詔告天地之間，令魂氣聞而以降。此求諸陽之義，陽謂魂氣分散者也。又臭鬱合鬯以灌，令體聞而以出，是求諸陰之義，陰謂體魄存在者也。祭者皆為此二者，但行之有先後耳。故《郊特牲》曰：“殷人尚聲，臭味未成，滌盪其聲，樂三闋然後出迎牲。聲音之號，所以詔告於天地之間。周人尚臭，灌用鬯臭。鬱合鬯臭，陰達於淵泉。灌以圭璋，用玉氣也。既灌然後迎牲，致陰氣也。凡祭，慎諸此魂氣歸於天，形魄歸於地，故祭求諸陰陽之義也。殷人先求諸陽，周人先求諸陰。”注云：“此其所以先後異也。”由此言之，殷、周先後雖異，皆行二禮。殷人之臭味未成，滌盪其聲，則成臭味而作樂。臭味成而行裸，其相去亦幾也。宗廟當九闋，殷於樂闋迎牲，周既灌迎牲，則殷之為灌不可在迎牲之後，當亦三闋之前矣。以氣魄不甚相遠，求之亦先後耳，故知作樂與灌不得相懸也。昭七年《左傳》稱“人生始化曰魄，既生魄，陽曰魂”，則魂魄小異耳。《禮記》注云：“復招魂復魄。”是魂魄相將之物也。然人死精氣有遺而留者，有發而升者，相對故留者為魄，發者為魂。聖人制作二禮，以求之此詩，說祭祀之禮，不言酒食，唯言樂，故解之：由殷人先求諸陽，故祭祀之禮先奏樂，滌盪其聲。以是之故，此詩主言鼓舞而已。此武公，周之子孫，而言殷禮者，《鄭志》答趙商雲：“衛，殷之畿內。君子行禮，不求變俗，祭祀之禮，居喪之服，哭泣之位，皆如其國之法，故衛稱殷禮。”是解武公言殷禮之事也。鄭之此答，皆《下曲禮》文。案彼注云：“重本也。”謂去先祖之國居他國，則是不變本國之俗。而答志以為，不變民之俗者，以《禮記》說大夫士去國之去，故知不變父祖之俗。至於人君，則與民為政，故順民之俗，以不變事同，故取《禮記》為言耳。必知人君當不變民俗者，以秦襄公居周之故地，故《蒹葭》刺襄公未能用周禮，將無以固其國。定四年《左傳》命伯禽以商奄之民，命康叔封諸殷墟，皆啟以商政，皆言因其故也，行其舊俗。故知武公行殷之禮，故舉殷法而言也。此因詩文唯言奏樂，故解武公之意也。其實詩人之作，出於本情，不必殷人皆言樂，周人皆言祼也。《烈祖》言“既載清酤”，《玄鳥》雲“大饎”，是殷人之作，言酒食也。《執競》說武王之祭，言鼓鍾管磬是周人之作，言聲樂也。以此知作者各言其志，立文不常。箋知以洽百禮合見天下諸侯所獻之禮者，以下經雲“百禮既至”，是自外而至，故知諸侯所獻之禮也。○傳“壬，大。林，君”。○正義曰：《釋詁》文。毛不解百禮之義。《載芟》文與此同，傳曰：“百禮言多。”則是君所進祭祀之禮多，非諸國之所獻。百禮宜為所薦之酒食殽羞之百種也。毛以此詩正論燕樂之和，其言遂及先祖，皆非實祭之事，則“百禮既至”不得為諸侯，非百國之禮自外至也。然則“有壬有林”皆異於鄭，當謂有祭祀之大禮，有孝子之人君耳。○箋“壬任”至“歡心”。○△正義曰：鄭以此為實祭。“既至”，外來之辭，則君為諸侯之君。君為國君，則任是君所任者，故為卿大夫也。以“百禮既至”，則禮從外來，故云“所獻之禮既陳於庭”，謂九州諸侯採其美物以當邦賦，各獻國之所有而陳之王庭也。《禮器》曰：“大饗其王事與！三牲、魚臘，四海九州之美味也。籩豆之薦，四時之和氣也。”注云：“此饌諸侯所獻。”則王者之祭，致遠物以助之，故知天下諸侯獻之禮陳於庭。其禮物之外，又有卿大夫，又有國君也。國君之來，臣必從焉。亦有君不來朝，使臣聘者，故任、林並言。先任後林，便其文耳。必陳此物及卿大夫與國君者，見天下徧至，得萬國之歡心。《孝經》曰：“故得萬國之歡心，以事其先王。”是其事也。經言“百禮”，而箋雲“萬國”者，皆舉大數，箋因成文耳。○箋“嘏謂”至“喜樂也”。○正義曰：嘏言既與《少牢》、《特牲》受嘏文同，《少牢》之嘏有辭，是皆屍假神意與主人，故言“屍與主人以福。王受神之福於屍也。”以王之受嘏，其辭有勿替引之，是福及子孫，故喜樂也。○傳“手取”至“耦賓”。○正義曰：毛以此為行燕射之禮，故以手為取。言室人以對賓，故云“室人，主人”。以主自居於室，故謂之室人也。《大射》雲：“司射請於公。”《鄉射》雲：“司射請於賓。”則射法立司射以請之，非主人自請。此雲“主人請射於賓，賓許諾”者，以詩之所陳，略舉大綱，非如記注《禮》、《儀》曲言節數。此總陳賓主之黨，不獨陳主與正賓二人也。禮從主人而起，故主人請而賓許諾也。又射禮耦者，有司所比，不是賓自取之。雲“賓自取匹”者，雖配之由於有司，其技藝敵與不敵，亦強弱素定，自相牽引而為耦也。《大射》司射及三耦等皆雲“取弓矢於次”，此雲“主人亦入於次”，謂取弓矢也。言“又射以耦賓”者，賓為上射，主為下射，故言“又射以耦賓也”。次者，《大射》注云：“次，若今更衣帳，張席為之。”○箋“子孫”至“加爵”。○正義曰：以此論祭事，而云“子孫各奏爾能”，故知謂既耽之後，各酌獻屍也。屍，尊神之象，子孫敢獻之，是其能也。禮，獻必有酢，故知屍酢而卒爵也。以天子祭禮亡約，士之祭禮有嗣子舉奠，因酌屍，天子則有子孫獻屍之禮。《特牲禮》雲：“上嗣舉奠入，北面再拜稽首。”注云：“上嗣，主人將為後者。舉猶飲也。使嗣子飲奠者，將傳重累之也。”又曰：“屍執奠進受復位，祭酒啐酒。屍舉肝，進受肝，復位，坐食肝，卒觶。”是士之祭禮，嗣子舉奠也。又曰：“舉奠洗爵入，屍拜受，舉奠拜屍祭酒啐酒，奠之，舉奠出，復位。”是因酌屍也。言奠者，謂迎屍之前，親酌奠於鉶南。嗣子於此，乃舉而飲之，故言舉奠。自是以後，因號嗣子為舉奠也。不引《少牢禮》者，少牢無嗣子舉奠之事。《特牲》注云：“大夫之嗣子無舉首奠，避諸侯。”然則士卑故不嫌也。《特牲》酌屍不卒爵，又無酢，直啐而奠之，與此不同。引之者，以有“洗酌入”事，其節相當，故引之。又引《文王世子》者，與此相當，故云“其登餕獻受爵則以上嗣”。彼據世子之禮正當此事，故言“是也”。不直引《文王世子》，而先引士之禮者，以《文王世子》記文無行事之次，約士禮準之而後明，故並引之。彼注云：“上嗣，君之適長子。”以《特牲饋食禮》言之，受爵謂嗣子舉奠也。獻謂舉奠洗爵入也。餕謂宗人遣舉奠盥祝命之餕也。言登以三者，皆登堂行之。文逆者，便文，且令受爵文承上嗣，明受之者，嗣子也。鄭以《特牲禮》文有次，故順而解之，與經反也。天子有奠斝，諸侯有奠角，在於饋獻之前。至祭末，世子乃舉奠也。《郊特牲》雲：“舉斝角，詔妥屍。”彼謂陰厭之時，設饌於奧，奠斝鉶南，迎屍主而入，即席東面。屍舉所奠之斝祭之。至九獻之後，嗣子舉所奠之斝飲而卒爵，所謂受爵也。既稱為獻，固當有酢而卒爵，所以為異，故此雲“天子則有子孫獻屍之禮”，以明士禮無也。以祭無取於匹，故曰“仇讀曰<奭鬥>”，謂<奭鬥>挹取酒也。室人有室中之事，謂佐食者，《特牲》注云：“佐食，賓佐屍食者也。”謂於賓客之中取人，令佐主人為屍設饌食之人，其名之曰佐食。《特牲》佐食一人，《少牢》佐食二人，未知天子諸侯當幾人也。《特牲》三獻之後，“長兄弟洗觚為加爵”。又曰：“眾賓長為加爵。”注云：“大夫士三獻而禮成。多之者為加。”是賓手挹酒，室人復酌為加爵也。《特牲》止有賓長為加爵，不及佐食。此言賓與室人俱為加爵者，天子之禮大，故佐食亦為加也。案《特牲》加爵在嗣子舉奠前，此賓與室人文在“各奏爾能”之下者，此因子孫其耽，先言子孫之事，令與上連，故賓與室人在其後耳，不以酌獻先後為次也。○傳“酒”至“中”。○正義曰：言酒所以安體者，《射義》曰：“酒所以養病，所以養老。”是由安體，故可以養也。上章言“以祈汝爵”，慮其耦與已爵也。言以奏爾中，謂勝者之黨，酌以進中者，令以飲彼不中者也。各從其所而言之，故王肅雲：“奏中者，以飲不中者。”是也。《大射禮》雲：“勝者之弟子洗觶升酌，散南面坐奠於豐上。”是豐上之觶，勝者所酌。又言養是自勝者往養不勝者之辭，故知以奏爾中，欲令飲不中者。或以《投壼》雲“正爵既行，請為勝者立馬。三馬既立，請慶多馬”，謂此以奏爾中為慶勝之爵。知不然者，《大射》、《鄉射》皆射訖即行飲酒之禮，以至於終，無慶勝之事故也。○箋“康”至“次”。○正義曰：“康，虛”，《釋詁》文。時者，謂時而存在乎意，故云“心所尊者”。箋又解酌虛爵，奏所尊之節，故云“加爵之間，賓與兄弟交錯相酬”。卒爵，言自此以前爵未虛也。《特牲禮》加爵之前，賓酬長兄弟。加爵之後，長兄弟酬賓。是加爵之間，賓與兄弟交錯其酬也。酬賓之下雲卒爵者，實觶於篚，是卒爵也。於是以後，爵乃虛矣。又曰：“賓弟子及兄弟弟子各酌於其樽，中庭北面，舉觶於其長。”是奏所尊之事也，故云“酌以獻其所尊，交錯而已，無次序”。以旅末，故知無次序也。言交錯而已者，謂弟子舉觶之交錯，非上交錯其酬也。《特牲》注云：“弟子，後生者也。”" }
      - { type: j, text: "賓之初筵，溫溫其恭。箋雲：此復言初筵者，既祭，王與族人燕之筵也。王與族人燕，以異姓為賓。溫溫，柔和也。其未醉止，威儀反反。曰既醉止，威儀幡幡。舍其坐遷，屢舞仙仙。反反，言重慎也。幡幡，失威儀也。遷，徙。屢，數也。仙仙然。箋雲：此言賓初即筵之時，能自敕戒以禮。至於旅酬，而小人之態出。言王既不得君子以為賓，又不得有恆之人，所以敗亂天下率如此也。○反，如字，《韓詩》作“昄”。昄，音蒲板反，善貌。曰既，音越。下是“曰”皆同。下章放此。幡，孚袁反。舍音捨。坐，如字，徐才臥反。屢，力具反。注及下同。本作“婁”。仙，音仙。屢數，音朔。態，他代反。率音類，又所律反。" }
      - { type: j, text: "其未醉止，威儀抑抑。曰既醉止，威儀怭怭。是曰既醉，不知其秩。抑抑，慎密也。怭怭，媟嫚也。秩，常也。○抑，於力反。怭，毗必反，又符筆反，《說文》作“佖”，媟嫚也。媟嫚，息列反，下音慢。" }
      - { type: z, text: "“賓之”至“其秩”。○毛以為，幽王既不能如古之禮，故陳其燕之失禮。言幽王所與燕賓失禮之事。其賓之初入門及登堂升筵矣，於時尚溫溫然，其貌和柔而恭敬也。至飲酒旅前，其未醉止之時，威儀猶能反反然重慎也。至於旅酬之後，“曰既醉止”之時，威儀幡幡然失其所矣。又舍其本坐，遷鄉他處，數數起舞，仙仙然失所也。此賓為王所敬，其失如此，故武公疾之，又重言之雲：此本旅前，“其未醉止”，尚守威儀抑抑然慎密。至旅後，“曰已醉止”，乃威儀怭怭然而媟嫚。至於旅末，“是曰既醉”，不自知其常禮。言其昏亂，禮無次也。由此，故民皆化之，敗亂天下，可疾之甚。○鄭唯王祭末與族人燕為異，其文義則同。○箋“此復”至“和柔”。○正義曰：此與上章雖古今不同，而相承為首尾，再言賓之初筵，故解之雲：“此復言初筵者，既祭，王與族人燕之筵也。”即《楚茨》所謂“諸父兄弟備言燕私”是也。以文王世子云，若公與族人燕，則異姓為賓，明王亦然，彼注云：“同宗無相賓客之道。”以是賓必異姓。○傳“反反”至“仙仙然”。○正義曰：此言自重而謹慎，與下抑抑慎密一也。謂慎禮而密靜，即為美之義，故《假樂》傳曰：“抑抑，美也。”幡幡，失威儀，亦由媟慢，故下傳曰：“怭怭，媟慢也。仙仙，舞貌也。”傳直雲“仙仙”者，是貌狀之辭。下僛僛、傞傞，俱是貌狀，亦宜然矣。○箋“此言”至“如此”。○正義曰：鄭以章句相接，故因上經言初即筵之時，能自敕戒以禮。未醉之前，謂獻酢酬之時也。既醉，謂至於旅酬而小人態出，故失威儀也。下章無筭爵時，故音聲號呶，又甚於舍坐，是為文次也。《論語》雲：“聖人，吾不得而見之。得見君子者，斯可矣。”又曰：“善人，吾不得而見之。得見有恆者，斯可矣。”故言王既不得君子以為賓，又不得有恆之人。卒章雲：凡此飲酒為天下所化，是由此賓之失而然，故言所以敗亂天下率如此。言率者，非一之辭。" }
      - { type: j, text: "賓既醉止，載號載呶。亂我籩豆，屢舞僛僛。是曰既醉，不知其郵。側弁之俄，屢舞傞傞。號、呶，號呼，讙呶也。僛僛，舞不能自正也。傞傞，不止也。箋雲：郵，過。側，傾也。俄，傾貌。此更言賓既醉而異章者，著為無筭爵以後也。○號，胡毛反。注同。呶，女交反。僛，起其反。《集註》本“正”或作“止”。按下傞傞是舞不止，此宜為“正”。《說文》雲：“醉舞也。”郵音尤。俄，五何反。《廣雅》雲：“哀傞，素多反。”一音倉柯反。呼，火故反。讙，呼端反。" }
      - { type: j, text: "既醉而出，並受其福。醉而不出，是謂伐德。飲酒孔嘉，維其令儀。箋雲：出，猶去也。孔，甚。令，善也。賓醉則出，與主人俱有美譽。醉至若此，是誅伐其德也。飲酒而誠得嘉賓，則於禮有善威儀。武公見王之失禮，故以此言箴之。○箴，之林反。" }
      - { type: z, text: "“賓既”至“令儀”。○正義曰：前章言燕初及旅酬之事，此述無筭爵之後。言爵行無筭，賓既醉於酒止，於是則號呼，則讙呶而唱叫也。錯亂我籩豆之行列，數起舞僛僛然不能自正也。又疾而重言之。是此言賓曰既已醉，則不自知其過失，傾傾其弁，使之俄然。數起舞傞傞然，又不能止。以此荒醉，敗亂天下，故武公為言，陳作賓之禮。若既醉而出，則賓與主人並受其得禮之福。賓則身為知禮，主則用得其人，是並受其福也。若至於醉而不出，是謂誅伐其德。醉前無失為有德，既醉為愆以喪之，是伐其德也。戒王若飲酒，而誠能得嘉善人之賓與之燕，則維其於禮有善儀也。王何不擇而賓之乎？上言曰“既醉止”，與此“是曰既醉”，曰者，斷絕更生事之辭，言醉而復益醉也。上言仙仙，是舞之形貌，猶能自正；僛僛則不能自正；傞傞則非徒不正，又不能止為差降也。" }
      - { type: j, text: "凡此飲酒，或醉或否。既立之監，或佐之史。彼醉不臧，不醉反恥。立酒之監，佐酒之史。箋雲：“凡此”者，凡此時天下之人也。飲酒於有醉者，有不醉者，則立監使視之，又助以史，使督酒，欲令皆醉也。彼醉則已不善，人所非惡，反覆取未醉者，恥罰之。言此者，疾之也。○令，力呈反。惡，烏路反。式勿從謂，無俾大怠。匪言勿言，匪由勿語。箋雲：式讀曰慝。勿，猶無也。俾，使。由，從也。武公見時人多說醉者之狀，或以取怨致讎，故為設禁。醉者有過惡，女無就而謂之也，當防護之，無使顛仆至於怠慢也。其所陳說，非所當說，無為人說之也，亦無從而行之也，亦無以語人也，皆為其聞之將恚怒也。○式，徐雲：“毛如字。”又云：“用也。”鄭讀作慝，他得反，惡也。大音泰，徐敕佐反。語，魚據反，又如字。故為，於偽反。下同。顛，都田反，本作“傎僕”，何音赴，一音蒲北反。《說文》雲：“頓也。”語，魚據反。恚，一瑞反，怒也。由醉之言，俾出童羖。羖，羊不童也。箋雲：女從行醉者之言，使女出無角之羖羊，脅以無然之物，使戒深也。羖羊之性，牝牡有角。○出如字，徐尺遂反。羖音古。脅，許業反。" }
      - { type: j, text: "三爵不識，矧敢多又。箋雲：矧，況。又，復也。當言我於此醉者，飲三爵之不知，況能知其多復飲乎？三爵者，獻也，酬也，酢也。○矧，失忍反。" }
      - { type: z, text: "“凡此”至“多又”。○毛以為，言王燕失所，故天下化之。凡此天下之人，聚共飲酒，初時或有醉者，或有不醉者。復設法以逼之，既立酒之監，或復佐之為史，令催不醉之人亦使醉也。彼醉者則已不善，為人所非惡。不醉者，此監與史反恥而罰之。是使小大盡醉，舉坐皆猶狂也。俗既然矣，武公無如之何，故禁戒時人，無令相說。言用此醉時，勿得從而謂之，以言其醉狀，又當防護醉者，無使顛仆，大至怠慢。汝之所陳說者，非所當言，勿為人言，而又當自善。非得見彼皆然，遂從而行之。亦勿以彼惡行而語他人，以人姓諱短，聞將恚怒，故教之。言教之猶恐不從，故又脅以重禁。汝若從醉者之後，言其過失，我則使汝出童首無角之羖羊，脅其無然之物，欲使息也。既禁其勿言，恐人問之不已，又教之雲：人若問汝彼醉之狀，汝當雲：“我於此醉者三爵之時，已自不識知，況敢能知其多而復飲乎？”但以此答，彼問自息，將慎其已然而為之立大法也。○鄭唯以式為慝，謂見醉者之過惡，無就而謂之。餘同。○傳“立酒之監，佐酒之史”。○正義曰：毛以經直雲立監佐史，不知是何監何史，贊其不足，故言酒也。立監是眾所推舉，佐史是彼自佐之，故立文不同。此剌其立酒之監。《燕禮》、《鄉射》並立司正。《鄉射》注云：“解倦失禮者，立司正以監之，察儀法也。”即引《詩》雲：“既立之監，或佐之史。”則禮法自當立監。此刺者，彼則監其失禮，此乃督之使醉，名同而實異。以其俱是監察，故鄭於《鄉射》引此耳。○箋“式讀曰慝”。○正義曰：以上文未有醉惡之事，而云勿從謂之，故以式為慝，訓之為惡。毛不為傳，但毛無改字之理，必不與鄭同。王肅雲：“用其醉時勿從而謂之。”傳意當然也。○箋“當言”至“酢酬”。○正義曰：何知非已自飲之，而云彼醉者飲三爵者，以問彼之狀，宜以彼飲答之，且言“矧敢多又”，是不敢知他之辭，故知三爵者亦他飲也。禮有獻酢與旅酬及無筭爵，旅與無筭，不止三爵而已，故知三爵是獻也、酢也、酬也。若然，禮主人獻賓，賓飲而又酢主人，主人飲而又酌以酬賓，賓則奠之而不舉，則賓主皆不飲三爵矣。而指獻、酢、酬為三爵者，言於飲三爵禮之時，非謂人飲三爵也。" }
