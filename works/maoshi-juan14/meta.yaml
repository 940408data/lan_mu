aboutHtml: |-
  <h2>關於此卷</h2>
  <p>《毛詩正義》為唐孔穎達等奉敕撰，以毛傳、鄭箋為本，為十三經注疏之一。詩三百篇，風雅頌並具，此卷以宋刻本版式數字重刻，半葉八行、行十六字、注文雙行二十五字。</p>
  <p>卷十四收十四之三，經注疏全帙。</p>
