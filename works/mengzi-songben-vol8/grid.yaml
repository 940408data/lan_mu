labels:
  - page: 277
    col: 9
    role: j
    text: 孟子卷第八朱熹集注
  - page: 277
    col: 10
    role: title
    text: 離婁章句下
  - page: 277
    col: 11
    role: z
    text: 凡三十三章
  - page: 277
    col: 12
    role: j
    text: 孟子曰舜生於諸馮遷於負夏卒於鳴
  - page: 277
    col: 13
    role: j
    text: 條東夷之人也
  - page: 277
    col: 14
    role: z
    text: 諸馮負夏鳴條皆地名在東方夷服
  - page: 277
    col: 15
    role: z
    text: 之地
  - page: 277
    col: 16
    role: j
    text: 文王生於岐周卒於畢郢西夷之人也
  - page: 278
    col: 1
    role: z
    text: 岐周岐山下周舊邑近畎夷畢郢近
  - page: 278
    col: 2
    role: z
    text: 豐鎬今有文王墓
  - page: 278
    col: 3
    role: j
    text: 地之相去也千有餘里世之相後也千
  - page: 278
    col: 4
    role: j
    text: 有餘歲得志行乎中國若合符節
  - page: 278
    col: 5
    role: z
    text: 得志行乎中國謂舜爲天子文王爲
  - page: 278
    col: 6
    role: z
    text: 方伯得行其道於天下也符節以玉
  - page: 278
    col: 7
    role: z
    text: 爲之篆刻文字而中分之彼此各藏
  - page: 278
    col: 8
    role: z
    text: 其半有故則左右相合以爲信也若
  - page: 278
    col: 9
    role: z
    text: 合符節言其同也
  - page: 278
    col: 10
    role: j
    text: 先聖後聖其揆一也
  - page: 278
    col: 11
    role: z
    text: 揆度也其揆一者言度之而其道無
  - page: 278
    col: 12
    role: z
    text: 不同也○范氏曰言聖人之生雖有
  - page: 278
    col: 13
    role: z
    text: 先後遠近之不同然其道則一也
  - page: 278
    col: 14
    role: j
    text: 子產聽鄭國之政以其乘輿濟人於溱
  - page: 278
    col: 15
    role: j
    text: 洧
  - page: 278
    col: 16
    role: z
    text: 乘去聲溱音臻洧榮美反○子產鄭
  - page: 279
    col: 1
    role: z
    text: 大夫公孫僑也溱洧二水名也子産
  - page: 279
    col: 2
    role: z
    text: 見人有徒渉此水者以其所乗之車
  - page: 279
    col: 3
    role: z
    text: 載而度之
  - page: 279
    col: 4
    role: j
    text: 孟子曰惠而不知爲政
  - page: 279
    col: 5
    role: z
    text: 惠謂私恩小利政則有公平正大之
  - page: 279
    col: 6
    role: z
    text: 體綱紀法度之施焉
  - page: 279
    col: 7
    role: j
    text: 歳十一月徒杠成十二月輿梁成民未
  - page: 279
    col: 8
    role: j
    text: 病渉也
  - page: 279
    col: 9
    role: z
    text: 杠音江○杠方橋也徒杠可通徒行
  - page: 279
    col: 10
    role: z
    text: 者梁亦橋也輿梁可通車輿者周十
  - page: 279
    col: 11
    role: z
    text: 一月夏九月也周十二月夏十月也
  - page: 279
    col: 12
    role: z
    text: 夏令曰十月成梁蓋農功已畢可用
  - page: 279
    col: 13
    role: z
    text: 民力又時將寒沍水有橋梁則民不
  - page: 279
    col: 14
    role: z
    text: 患於徒渉亦王政之一事也
  - page: 279
    col: 15
    role: j
    text: 君子平其政行辟人可也焉得人人而
  - page: 279
    col: 16
    role: j
    text: 濟之
  - page: 280
    col: 1
    role: z
    text: 辟與闢同焉於虔反○辟辟除也如
  - page: 280
    col: 2
    role: z
    text: 周禮閽人為之辟之辟言能平其政
  - page: 280
    col: 3
    role: z
    text: 則出行之際辟除行人使之避己亦
  - page: 280
    col: 4
    role: z
    text: 不為過况國中之水當涉者衆豈能
  - page: 280
    col: 5
    role: z
    text: 悉以乘輿濟之哉
  - page: 280
    col: 6
    role: j
    text: 故為政者每人而恱之日亦不足矣
  - page: 280
    col: 7
    role: z
    text: 言每人皆欲致私恩以恱其意則人
  - page: 280
    col: 8
    role: z
    text: 多日少亦不足於用矣諸葛武侯嘗
  - page: 280
    col: 9
    role: z
    text: 言治世以大德不以小惠得孟子之
  - page: 280
    col: 10
    role: z
    text: 意矣
  - page: 280
    col: 11
    role: j
    text: 孟子告齊宣王曰君之視臣如手足則
  - page: 280
    col: 12
    role: j
    text: 臣視君如腹心君之視臣如犬馬則臣
  - page: 280
    col: 13
    role: j
    text: 視君如國人君之視臣如土芥則臣視
  - page: 280
    col: 14
    role: j
    text: 君如宼讎
  - page: 280
    col: 15
    role: z
    text: 孔氏曰宣王之遇臣下恩禮衰薄至
  - page: 280
    col: 16
    role: z
    text: 於昔者所進今日不知其亡則其於
  - page: 281
    col: 1
    role: z
    text: 羣臣可謂邈然無敬矣故孟子告之
  - page: 281
    col: 2
    role: z
    text: 以此手足腹心相待一體恩義之至
  - page: 281
    col: 3
    role: z
    text: 也如犬馬則輕賤之然猶有豢養之
  - page: 281
    col: 4
    role: z
    text: 恩焉國人猶言路人言無怨無德也
  - page: 281
    col: 5
    role: z
    text: 土芥則踐踏之而已矣斬艾之而已
  - page: 281
    col: 6
    role: z
    text: 矣其賤惡之又甚矣寇讎之報不亦
  - page: 281
    col: 7
    role: z
    text: 宜乎
  - page: 281
    col: 8
    role: j
    text: 王曰禮為舊君有服何如斯可為服矣
  - page: 281
    col: 9
    role: z
    text: 為去聲下為之同○儀禮曰以道去
  - page: 281
    col: 10
    role: z
    text: 君而未絕者服齊衰三月王疑孟子
  - page: 281
    col: 11
    role: z
    text: 之言太甚故以此禮為問
  - page: 281
    col: 12
    role: j
    text: 曰諫行言聽膏澤下於民有故而去則
  - page: 281
    col: 13
    role: j
    text: 君使人導之出疆又先於其所往去三
  - page: 281
    col: 14
    role: j
    text: 年不反然後收其田里此之謂三有禮
  - page: 281
    col: 15
    role: j
    text: 焉如此則為之服矣
  - page: 281
    col: 16
    role: z
    text: 導之出疆防剽掠也先於其所往稱
  - page: 282
    col: 1
    role: z
    text: 道其賢欲其收用之也三年而後收
  - page: 282
    col: 2
    role: z
    text: 其田祿里居前此猶望其歸也
  - page: 282
    col: 3
    role: j
    text: 今也爲臣諫則不行言則不聽膏澤不
  - page: 282
    col: 4
    role: j
    text: 下於民有故而去則君搏執之又極之
  - page: 282
    col: 5
    role: j
    text: 於其所往去之日遂收其田里此之謂
  - page: 282
    col: 6
    role: j
    text: 冦讎冦讎何服之有
  - page: 282
    col: 7
    role: z
    text: 極窮也窮之於其所往之國如晉錮
  - page: 282
    col: 8
    role: z
    text: 欒盈也○潘興嗣曰孟子告齊王之
  - page: 282
    col: 9
    role: z
    text: 言猶孔子對定公之意也而其言有
  - page: 282
    col: 10
    role: z
    text: 迹不若孔子之渾然也蓋聖賢之别
  - page: 282
    col: 11
    role: z
    text: 如此○楊氏曰君臣以義合者也故
  - page: 282
    col: 12
    role: z
    text: 孟子爲齊王深言報施之道使知爲
  - page: 282
    col: 13
    role: z
    text: 君者不可不以禮遇其臣耳若君子
  - page: 282
    col: 14
    role: j
    text: 之自處則豈處其薄乎○孟子曰王庶
  - page: 282
    col: 15
    role: z
    text: 幾改之予日望之君子之言蓋如此
  - page: 282
    col: 16
    role: j
    text: 孟子曰無罪而殺士則大夫可以去無
  - page: 283
    col: 1
    role: j
    text: 罪而戮民則士可以徙
  - page: 283
    col: 2
    role: z
    text: 言君子當見幾而作禍已迫則不能
  - page: 283
    col: 3
    role: z
    text: 去矣
  - page: 283
    col: 4
    role: j
    text: 孟子曰君仁莫不仁君義莫不義
  - page: 283
    col: 5
    role: z
    text: 張氏曰此章重出然上篇主言人臣
  - page: 283
    col: 6
    role: z
    text: 當以正君爲急此章直戒人君義亦
  - page: 283
    col: 7
    role: z
    text: 小異耳
  - page: 283
    col: 8
    role: j
    text: 孟子曰非禮之禮非義之義大人弗爲
  - page: 283
    col: 9
    role: z
    text: 察理不精故有二者之蔽大人則隨
  - page: 283
    col: 10
    role: z
    text: 事而順理因時而處宜豈爲是哉
  - page: 283
    col: 11
    role: j
    text: 孟子曰中也養不中才也養不才故人
  - page: 283
    col: 12
    role: j
    text: 樂有賢父兄也如中也棄不中才也棄
  - page: 283
    col: 13
    role: j
    text: 不才則賢不肖之相去其間不能以寸
  - page: 283
    col: 14
    role: z
    text: 樂音洛○無過不及之謂中足以有
  - page: 283
    col: 15
    role: z
    text: 爲之謂才養謂涵育薰陶俟其自化
  - page: 283
    col: 16
    role: z
    text: 也賢謂中而才者也樂有賢父兄者
  - page: 284
    col: 1
    role: z
    text: 樂其終能成己也爲父兄者若以子
  - page: 284
    col: 2
    role: z
    text: 弟之不賢遂遽絕之而不能教則吾
  - page: 284
    col: 3
    role: z
    text: 亦過中而不才矣其相去之間能幾
  - page: 284
    col: 4
    role: z
    text: 何哉
  - page: 284
    col: 5
    role: j
    text: 孟子曰人有不爲也而後可以有爲
  - page: 284
    col: 6
    role: z
    text: 程子曰有不爲知所擇也惟能有不
  - page: 284
    col: 7
    role: z
    text: 爲是以可以有爲無所不爲者安能
  - page: 284
    col: 8
    role: z
    text: 有所爲邪
  - page: 284
    col: 9
    role: j
    text: 孟子曰言人之不善當如後患何
  - page: 284
    col: 10
    role: z
    text: 此亦有爲而言
  - page: 284
    col: 11
    role: j
    text: 孟子曰仲尼不爲巳甚者
  - page: 284
    col: 12
    role: z
    text: 巳猶太也○楊氏曰言聖人所爲本
  - page: 284
    col: 13
    role: z
    text: 分之外不加毫末非孟子眞知孔子
  - page: 284
    col: 14
    role: z
    text: 不能以是稱之
  - page: 284
    col: 15
    role: j
    text: 孟子曰大人者言不必信行不必果惟
  - page: 284
    col: 16
    role: j
    text: 義所在
  - page: 285
    col: 1
    role: z
    text: 行去聲○必猶期也大人言行不先
  - page: 285
    col: 2
    role: z
    text: 期於信果但義之所在則必從之卒
  - page: 285
    col: 3
    role: z
    text: 亦未嘗不信果也○尹氏曰主於義
  - page: 285
    col: 4
    role: j
    text: 則信果在其中矣主於信果則未必合
  - page: 285
    col: 5
    role: z
    text: 義王勉曰若不合於義而不信不果
  - page: 285
    col: 6
    role: z
    text: 果則妄人爾
  - page: 285
    col: 7
    role: j
    text: 孟子曰大人者不失其赤子之心者也
  - page: 285
    col: 8
    role: z
    text: 大人之心通達萬變赤子之心則純
  - page: 285
    col: 9
    role: z
    text: 一無僞而已然大人之所以爲大人
  - page: 285
    col: 10
    role: z
    text: 正以其不爲物誘而有以全其純一
  - page: 285
    col: 11
    role: z
    text: 無僞之本然是以擴而充之則無所
  - page: 285
    col: 12
    role: z
    text: 不知無所不能而極其大也
  - page: 285
    col: 13
    role: j
    text: 孟子曰養生者不足以當大事惟送死
  - page: 285
    col: 14
    role: j
    text: 可以當大事
  - page: 285
    col: 15
    role: z
    text: 養去聲○事生固當愛敬然亦人道
  - page: 285
    col: 16
    role: z
    text: 之常耳至於送死則人道之大變孝
  - page: 286
    col: 1
    role: j
    text: 子之事親舎是無以用其力矣故尤
  - page: 286
    col: 2
    role: j
    text: 以爲大事而必誠必信不使少有後
  - page: 286
    col: 3
    role: z
    text: 日之悔也
  - page: 286
    col: 4
    role: j
    text: 孟子曰君子深造之以道欲其自得之
  - page: 286
    col: 5
    role: j
    text: 也自得之則居之安居之安則資之深
  - page: 286
    col: 6
    role: j
    text: 資之深則取之左右逢其原故君子欲
  - page: 286
    col: 7
    role: j
    text: 其自得之也
  - page: 286
    col: 8
    role: z
    text: 造七到反。造詣也深造之者進而
  - page: 286
    col: 9
    role: j
    text: 不巳之意道則其進爲之方也資猶
  - page: 286
    col: 10
    role: j
    text: 藉也左右身之兩旁言至近而非一
  - page: 286
    col: 11
    role: j
    text: 處也逢猶值也原本也水之來處也
  - page: 286
    col: 12
    role: j
    text: 言君子務於深造而必以其道者欲
  - page: 286
    col: 13
    role: j
    text: 其有所持循以俟夫黙識心通自然
  - page: 286
    col: 14
    role: j
    text: 而得之於己也自得於己則所以處
  - page: 286
    col: 15
    role: j
    text: 之者安固而不揺處之安固則所藉
  - page: 286
    col: 16
    role: j
    text: 者深逺而無盡所藉者深則日用之
  - page: 287
    col: 1
    role: z
    text: 間取之至近無所往而不值其所資
  - page: 287
    col: 2
    role: z
    text: 之本也○程子曰學不言而自得者
  - page: 287
    col: 3
    role: z
    text: 乃自得也有安排布置者皆非自得
  - page: 287
    col: 4
    role: z
    text: 也然必潛心積慮優游厭飫於其閒
  - page: 287
    col: 5
    role: z
    text: 然後可以有得若急迫求之則是私
  - page: 287
    col: 6
    role: z
    text: 己而已終不足以得之也
  - page: 287
    col: 7
    role: j
    text: 孟子曰博學而詳說之將以反說約也
  - page: 287
    col: 8
    role: z
    text: 言所以博學於文而詳說其理者非
  - page: 287
    col: 9
    role: z
    text: 欲以誇多而闘靡也欲其融會貫通
  - page: 287
    col: 10
    role: z
    text: 有以反而說到至約之地耳蓋承上
  - page: 287
    col: 11
    role: z
    text: 章之意而言學非欲其徒愽而亦不
  - page: 287
    col: 12
    role: z
    text: 可以徑約也
  - page: 287
    col: 13
    role: j
    text: 孟子曰以善服人者未有能服人者也
  - page: 287
    col: 14
    role: j
    text: 以善養人然後能服天下天下不心服
  - page: 287
    col: 15
    role: j
    text: 而王者未之有也
  - page: 287
    col: 16
    role: z
    text: 王去聲○服人者欲以取勝於人養
  - page: 288
    col: 1
    role: z
    text: 人者欲其同歸於善蓋心之公私小
  - page: 288
    col: 2
    role: z
    text: 異而人之嚮背頓殊學者於此不可
  - page: 288
    col: 3
    role: z
    text: 以不審也
  - page: 288
    col: 4
    role: j
    text: 孟子曰言無實不祥不祥之實蔽賢者
  - page: 288
    col: 5
    role: j
    text: 當之
  - page: 288
    col: 6
    role: z
    text: 或曰天下之言無有實不祥者惟蔽
  - page: 288
    col: 7
    role: z
    text: 賢爲不祥之實或曰言而無實者不
  - page: 288
    col: 8
    role: z
    text: 祥故蔽賢爲不祥之實二說不同未
  - page: 288
    col: 9
    role: z
    text: 知孰是疑或有闕文焉
  - page: 288
    col: 10
    role: j
    text: 徐子曰仲尼亟稱於水曰水哉水哉何
  - page: 288
    col: 11
    role: j
    text: 取於水也
  - page: 288
    col: 12
    role: z
    text: 亟去吏反○亟數也水哉水哉歎美
  - page: 288
    col: 13
    role: z
    text: 之辭
  - page: 288
    col: 14
    role: j
    text: 孟子曰原泉混混不舎晝夜盈科而後
  - page: 288
    col: 15
    role: j
    text: 進放乎四海有本者如是是之取爾
  - page: 288
    col: 16
    role: z
    text: 舎放皆上聲○原泉有原之水也混
  - page: 289
    col: 1
    role: j
    text: 混湧出之貌不舍晝夜言常出不竭
  - page: 289
    col: 2
    role: j
    text: 也盈滿也科坎也言其進以漸也放
  - page: 289
    col: 3
    role: j
    text: 至也言水有原本不已而漸進以至
  - page: 289
    col: 4
    role: j
    text: 于海如人有實行則亦不已而漸進
  - page: 289
    col: 5
    role: z
    text: 以至于極也
  - page: 289
    col: 6
    role: j
    text: 苟爲無本七八月之間雨集溝澮皆盈
  - page: 289
    col: 7
    role: j
    text: 其涸也可立而待也故聲聞過情君子
  - page: 289
    col: 8
    role: j
    text: 恥之
  - page: 289
    col: 9
    role: j
    text: 澮古外反涸下各反聞去聲○集聚
  - page: 289
    col: 10
    role: j
    text: 也澮田間水道也涸乾也如人無實
  - page: 289
    col: 11
    role: j
    text: 行而暴得虛譽不能長乆也聲聞名
  - page: 289
    col: 12
    role: j
    text: 譽也情實也恥其無實而將不
  - page: 289
    col: 13
    role: j
    text: 繼也○林氏曰徐子之爲人必有躐
  - page: 289
    col: 14
    role: j
    text: 等干譽之病故孟子以是答之○鄒
  - page: 289
    col: 15
    role: j
    text: 氏曰孔子之稱水其旨微矣孟子獨
  - page: 289
    col: 16
    role: j
    text: 取此者自徐子之所急者言之也孔
  - page: 290
    col: 1
    role: z
    text: 子嘗以聞達告子張矣達者有本之
  - page: 290
    col: 2
    role: z
    text: 謂也聞則無本之謂也然則學者其
  - page: 290
    col: 3
    role: z
    text: 可以不務本乎
  - page: 290
    col: 4
    role: j
    text: 孟子曰人之所以異於禽獸者幾希庶
  - page: 290
    col: 5
    role: j
    text: 民去之君子存之
  - page: 290
    col: 6
    role: z
    text: 幾希少也庶衆也人物之生同得天
  - page: 290
    col: 7
    role: z
    text: 地之理以爲性同得天地之氣以爲
  - page: 290
    col: 8
    role: z
    text: 形其不同者獨人於其間得形氣之
  - page: 290
    col: 9
    role: z
    text: 正而能有以全其性爲少異耳雖曰
  - page: 290
    col: 10
    role: z
    text: 少異然人物之所以分實在於此衆
  - page: 290
    col: 11
    role: z
    text: 人不知此而去之則名雖爲人而實
  - page: 290
    col: 12
    role: z
    text: 無以異於禽獸君子知此而存之是
  - page: 290
    col: 13
    role: z
    text: 以戰兢惕勵而卒能有以全其所受
  - page: 290
    col: 14
    role: z
    text: 之理也
  - page: 290
    col: 15
    role: j
    text: 舜明於庶物察於人倫由仁義行非行
  - page: 290
    col: 16
    role: j
    text: 仁義也
  - page: 291
    col: 1
    role: j
    text: 物事物也明則有以識其理也人倫
  - page: 291
    col: 2
    role: j
    text: 說見前篇察則有以盡其理之詳也
  - page: 291
    col: 3
    role: j
    text: 物理固非度外而人倫尤切於身故
  - page: 291
    col: 4
    role: j
    text: 其知之有詳略之異在舜則皆生而
  - page: 291
    col: 5
    role: j
    text: 知之也由仁義行非行仁義則仁義
  - page: 291
    col: 6
    role: j
    text: 已根於心而所行皆從此出非以仁
  - page: 291
    col: 7
    role: j
    text: 義爲美而後勉強行之所謂安而行
  - page: 291
    col: 8
    role: j
    text: 之也此則聖人之事不待存之而無
  - page: 291
    col: 9
    role: j
    text: 不存矣○尹氏曰存之者君子也存
  - page: 291
    col: 10
    role: j
    text: 者聖人也君子所存存天理也由仁
  - page: 291
    col: 11
    role: j
    text: 義行存者能之
  - page: 291
    col: 12
    role: j
    text: 孟子曰禹惡旨酒而好善言
  - page: 291
    col: 13
    role: j
    text: 惡好皆去聲○戰國策曰儀狄作酒
  - page: 291
    col: 14
    role: j
    text: 禹飲而甘之曰後世必有以酒亡其
  - page: 291
    col: 15
    role: j
    text: 國者遂疏儀狄而絕旨酒書曰禹拜
  - page: 291
    col: 16
    role: z
    text: 昌言
  - page: 292
    col: 1
    role: j
    text: 湯執中立賢無方
  - page: 292
    col: 2
    role: z
    text: 執謂守而不失中者無過不及之名
  - page: 292
    col: 3
    role: z
    text: 方猶類也立賢無方惟賢則立之於
  - page: 292
    col: 4
    role: z
    text: 位不問其類也
  - page: 292
    col: 5
    role: j
    text: 文王視民如傷望道而未之見
  - page: 292
    col: 6
    role: z
    text: 而讀爲如古字通用○民已安矣而
  - page: 292
    col: 7
    role: z
    text: 視之猶若有傷道已至矣而望之猶
  - page: 292
    col: 8
    role: z
    text: 若未見聖人之愛民深而求道切如
  - page: 292
    col: 9
    role: z
    text: 此不自滿足終日乾乾之心也
  - page: 292
    col: 10
    role: j
    text: 武王不泄邇不忘遠
  - page: 292
    col: 11
    role: z
    text: 泄狎也邇者人所易狎而不泄遠者
  - page: 292
    col: 12
    role: z
    text: 人所易忘而不忘德之盛仁之至也
  - page: 292
    col: 13
    role: j
    text: 周公思兼三王以施四事其有不合者
  - page: 292
    col: 14
    role: j
    text: 仰而思之夜以繼日幸而得之坐以待
  - page: 292
    col: 15
    role: j
    text: 旦
  - page: 292
    col: 16
    role: z
    text: 三王禹也湯也文武也四事上四條
  - page: 293
    col: 1
    role: z
    text: 之事也時異勢殊故其事或有所不
  - page: 293
    col: 2
    role: z
    text: 合思而得之則其理初不異矣坐以
  - page: 293
    col: 3
    role: z
    text: 待旦急於行也○此承上章言舜因
  - page: 293
    col: 4
    role: z
    text: 歷叙羣聖以繼之而各舉其一事以
  - page: 293
    col: 5
    role: z
    text: 見其憂勤惕厲之意蓋天理之所以
  - page: 293
    col: 6
    role: z
    text: 常存而人心之所以不死也○程子
  - page: 293
    col: 7
    role: z
    text: 曰孟子所稱各因其一事而言非謂
  - page: 293
    col: 8
    role: z
    text: 武王不能執中立賢湯却泄邇忘遠
  - page: 293
    col: 9
    role: z
    text: 也人謂各舉其盛亦非也聖人亦無
  - page: 293
    col: 10
    role: z
    text: 不盛
  - page: 293
    col: 11
    role: j
    text: 孟子曰王者之迹熄而詩亡詩亡然後
  - page: 293
    col: 12
    role: j
    text: 春秋作
  - page: 293
    col: 13
    role: z
    text: 王者之迹熄謂平王東遷而政教號
  - page: 293
    col: 14
    role: z
    text: 令不及於天下也詩云謂黍離降爲
  - page: 293
    col: 15
    role: z
    text: 國風而雅亡也春秋魯史記之名孔
  - page: 293
    col: 16
    role: z
    text: 子因而筆削之始於魯隱公之元年
  - page: 294
    col: 1
    role: z
    text: 實平王之四十九年也
  - page: 294
    col: 2
    role: j
    text: 晉之乘楚之檮杌魯之春秋一也
  - page: 294
    col: 3
    role: z
    text: 乘去聲檮音逃杌音兀○乘義未詳
  - page: 294
    col: 4
    role: z
    text: 趙氏以爲輿於田賦乘馬之事或曰
  - page: 294
    col: 5
    role: z
    text: 取記載當時行事而名之也檮杌惡
  - page: 294
    col: 6
    role: z
    text: 獸名古者因以爲凶人之號取記惡
  - page: 294
    col: 7
    role: z
    text: 垂戒之義也春秋者記事者必表年
  - page: 294
    col: 8
    role: z
    text: 以首事年有四時故錯舉以爲所記
  - page: 294
    col: 9
    role: z
    text: 之名也古者列國皆有史官掌記時
  - page: 294
    col: 10
    role: z
    text: 事此三者皆其所記冊書之名也
  - page: 294
    col: 11
    role: j
    text: 其事則齊桓晉文其文則史孔子曰其
  - page: 294
    col: 12
    role: j
    text: 義則丘竊取之矣
  - page: 294
    col: 13
    role: z
    text: 春秋之時五霸迭興而威文爲盛史
  - page: 294
    col: 14
    role: z
    text: 史官也竊取者謙辭也公羊傳作其
  - page: 294
    col: 15
    role: z
    text: 辭則丘有罪焉爾意亦如此蓋言斷
  - page: 294
    col: 16
    role: z
    text: 之在己所謂筆則筆削則削游夏不
  - page: 295
    col: 1
    role: z
    text: 能賛一辭者也○尹氏曰言孔子作
  - page: 295
    col: 2
    role: z
    text: 春秋亦以史之文載當時之事也而
  - page: 295
    col: 3
    role: z
    text: 其義則定天下之邪正爲百王之大
  - page: 295
    col: 4
    role: z
    text: 法○此又承上章歷叙羣聖因以孔
  - page: 295
    col: 5
    role: z
    text: 子之事繼之而孔子之事莫大於春
  - page: 295
    col: 6
    role: z
    text: 秋故特言之
  - page: 295
    col: 7
    role: j
    text: 孟子曰君子之澤五世而斬小人之澤
  - page: 295
    col: 8
    role: j
    text: 五世而斬
  - page: 295
    col: 9
    role: z
    text: 澤猶言流風餘韻也父子相繼爲一
  - page: 295
    col: 10
    role: z
    text: 世三十年亦爲一世斬絶也大約君
  - page: 295
    col: 11
    role: z
    text: 子小人之澤五世而絶也○楊氏曰
  - page: 295
    col: 12
    role: z
    text: 四世而緦服之窮也五世袒免殺同
  - page: 295
    col: 13
    role: z
    text: 姓也六世親屬竭矣服窮則遺澤寖
  - page: 295
    col: 14
    role: z
    text: 微故五世而斬
  - page: 295
    col: 15
    role: j
    text: 予未得爲孔子徒也予私淑諸人也
  - page: 295
    col: 16
    role: z
    text: 私猶竊也淑善也李氏以爲方言是
  - page: 296
    col: 1
    role: z
    text: 也人謂子思之徒也自孔子卒至孟
  - page: 296
    col: 2
    role: z
    text: 子游梁時方百四十餘年而孟子已
  - page: 296
    col: 3
    role: z
    text: 老然則孟子之生去孔子未百年也
  - page: 296
    col: 4
    role: z
    text: 故孟子言予雖未得親受業於孔子
  - page: 296
    col: 5
    role: z
    text: 之門然聖人之澤尚存猶有能傳其
  - page: 296
    col: 6
    role: z
    text: 學者故我得聞孔子之道於人而私
  - page: 296
    col: 7
    role: z
    text: 竊以善其身蓋推尊孔子而自謙之
  - page: 296
    col: 8
    role: z
    text: 辭也○此又承上三章歷叙舜禹至
  - page: 296
    col: 9
    role: z
    text: 於周孔而以是終之其詞雖謙然其
  - page: 296
    col: 10
    role: z
    text: 所以自任之重亦有不得而辭者矣
  - page: 296
    col: 11
    role: j
    text: 孟子曰可以取可以無取取傷廉可以
  - page: 296
    col: 12
    role: j
    text: 與可以無與與傷惠可以死可以無死
  - page: 296
    col: 13
    role: j
    text: 死傷勇
  - page: 296
    col: 14
    role: z
    text: 先言可以者略見而自許之辭也後
  - page: 296
    col: 15
    role: z
    text: 言可以無者深察而自疑之辭也過
  - page: 296
    col: 16
    role: z
    text: 取固害於廉然過與亦反害其惠過
  - page: 297
    col: 1
    role: z
    text: 死亦反害其勇蓋過猶不及之意也
  - page: 297
    col: 2
    role: z
    text: ○林氏曰公西華受五秉之粟是傷
  - page: 297
    col: 3
    role: z
    text: 廉也冉子與之是傷惠也子路之死
  - page: 297
    col: 4
    role: z
    text: 於衛是傷勇也
  - page: 297
    col: 5
    role: j
    text: 逢蒙學射於羿盡羿之道思天下惟羿
  - page: 297
    col: 6
    role: j
    text: 爲愈已於是殺羿孟子曰是亦羿有罪
  - page: 297
    col: 7
    role: j
    text: 焉公明儀曰宜若無罪焉曰薄乎云爾
  - page: 297
    col: 8
    role: j
    text: 惡得無罪
  - page: 297
    col: 9
    role: z
    text: 逢薄江反惡平聲○羿有窮后羿也
  - page: 297
    col: 10
    role: z
    text: 逢蒙羿之家衆也羿善射篡夏自立
  - page: 297
    col: 11
    role: z
    text: 後爲家衆所殺愈猶勝也薄言其罪
  - page: 297
    col: 12
    role: z
    text: 差薄耳
  - page: 297
    col: 13
    role: j
    text: 鄭人使子濯孺子侵衛衛使庾公之斯
  - page: 297
    col: 14
    role: j
    text: 追之子濯孺子曰今日我疾作不可以
  - page: 297
    col: 15
    role: j
    text: 執弓吾死矣夫問其僕曰追我者誰也
  - page: 297
    col: 16
    role: j
    text: 其僕曰庾公之斯也曰吾生矣其僕曰
  - page: 298
    col: 1
    role: j
    text: 庾公之斯衛之善射者也夫子曰吾生
  - page: 298
    col: 2
    role: j
    text: 何謂也曰庾公之斯學射於尹公之他
  - page: 298
    col: 3
    role: j
    text: 尹公之他學射於我夫尹公之他端人
  - page: 298
    col: 4
    role: j
    text: 也其取友必端矣庾公之斯至曰夫子
  - page: 298
    col: 5
    role: j
    text: 何爲不執弓曰今日我疾作不可以執
  - page: 298
    col: 6
    role: j
    text: 弓曰小人學射於尹公之他尹公之他
  - page: 298
    col: 7
    role: j
    text: 學射於夫子我不忍以夫子之道反害
  - page: 298
    col: 8
    role: j
    text: 夫子雖然今日之事君事也我不敢廢
  - page: 298
    col: 9
    role: j
    text: 抽矢扣輪去其金發乘矢而後反
  - page: 298
    col: 10
    role: z
    text: 他徒河反矣夫夫尹之夫並音扶去
  - page: 298
    col: 11
    role: z
    text: 上聲乘去聲○之語助也僕御也尹
  - page: 298
    col: 12
    role: z
    text: 公他亦衛人也端正也孺子以尹公
  - page: 298
    col: 13
    role: z
    text: 正人知其取友必正故度庾公必不
  - page: 298
    col: 14
    role: z
    text: 害己小人庾公自稱也金鏃也叩輪
  - page: 298
    col: 15
    role: z
    text: 出鏃令不害人乃以射也乘矢四矢
  - page: 298
    col: 16
    role: z
    text: 也孟子言使羿如子濯孺子得尹公
  - page: 299
    col: 1
    role: z
    text: 他而教之則必無逄蒙之禍然夷羿
  - page: 299
    col: 2
    role: z
    text: 篡弒之賊蒙乃逆儔庾斯雖全私恩
  - page: 299
    col: 3
    role: z
    text: 亦廢公義其事皆無足論者孟子蓋
  - page: 299
    col: 4
    role: z
    text: 特以取友而言耳
  - page: 299
    col: 5
    role: j
    text: 孟子曰西子蒙不潔則人皆掩鼻而過
  - page: 299
    col: 6
    role: j
    text: 之
  - page: 299
    col: 7
    role: z
    text: 西子美婦人蒙猶冒也不潔污穢之
  - page: 299
    col: 8
    role: z
    text: 物也掩鼻惡其臭也
  - page: 299
    col: 9
    role: j
    text: 雖有惡人齊戒沐浴則可以祀上帝
  - page: 299
    col: 10
    role: z
    text: 齊側皆反○惡人醜貌者也○尹氏
  - page: 299
    col: 11
    role: z
    text: 曰此章戒人之喪善而勉人以自新
  - page: 299
    col: 12
    role: z
    text: 也
  - page: 299
    col: 13
    role: j
    text: 孟子曰天下之言性也則故而已矣故
  - page: 299
    col: 14
    role: j
    text: 者以利為本
  - page: 299
    col: 15
    role: z
    text: 性者人物所得以生之理也故者其
  - page: 299
    col: 16
    role: z
    text: 已然之跡若所謂天下之故者也利
  - page: 300
    col: 1
    role: z
    text: 猶順也語其自然之勢也言事物之
  - page: 300
    col: 2
    role: z
    text: 理雖若無形而難知然其發見之已
  - page: 300
    col: 3
    role: z
    text: 然則必有迹而易見故天下之言性
  - page: 300
    col: 4
    role: z
    text: 者但言其故而理自明猶所謂善言
  - page: 300
    col: 5
    role: z
    text: 天者必有驗於人也然其所謂故者
  - page: 300
    col: 6
    role: z
    text: 又必本其自然之勢如人之善水之
  - page: 300
    col: 7
    role: z
    text: 下非有所矯揉造作而然者也若人
  - page: 300
    col: 8
    role: z
    text: 之爲惡水之在山則非自然之故矣
  - page: 300
    col: 9
    role: j
    text: 所惡於智者爲其鑿也如智者若禹之
  - page: 300
    col: 10
    role: j
    text: 行水也則無惡於智矣禹之行水也行
  - page: 300
    col: 11
    role: j
    text: 其所無事也如智者亦行其所無事則
  - page: 300
    col: 12
    role: j
    text: 智亦大矣
  - page: 300
    col: 13
    role: z
    text: 惡爲皆去聲○天下之理本皆順利
  - page: 300
    col: 14
    role: z
    text: 小智之人務爲穿鑿所以失之禹之
  - page: 300
    col: 15
    role: z
    text: 行水則因其自然之勢而導之未甞
  - page: 300
    col: 16
    role: z
    text: 以私智穿鑿而有所事是以水得其
  - page: 301
    col: 1
    role: z
    text: 潤下之性而不爲害也
  - page: 301
    col: 2
    role: j
    text: 天之高也星辰之遠也苟求其故千歲
  - page: 301
    col: 3
    role: j
    text: 之日至可坐而致也
  - page: 301
    col: 4
    role: z
    text: 天雖高星辰雖遠然求其已然之跡
  - page: 301
    col: 5
    role: z
    text: 則其運有常雖千歲之久其日至之
  - page: 301
    col: 6
    role: z
    text: 度可坐而得况於事物之近若因其
  - page: 301
    col: 7
    role: z
    text: 故而求之豈有不得其理者而何以
  - page: 301
    col: 8
    role: z
    text: 穿鑿爲哉必言日至者造歷者以上
  - page: 301
    col: 9
    role: z
    text: 古十一月甲子朔夜半冬至爲歷元
  - page: 301
    col: 10
    role: z
    text: 也○程子曰此章專爲智而發愚謂
  - page: 301
    col: 11
    role: z
    text: 事物之理莫非自然順而循之則爲
  - page: 301
    col: 12
    role: z
    text: 大智若用小智而鑿以自私則害於
  - page: 301
    col: 13
    role: z
    text: 性而反爲不智程子之言可謂深得
  - page: 301
    col: 14
    role: z
    text: 此章之旨矣
  - page: 301
    col: 15
    role: j
    text: 公行子有子之喪右師往弔入門有進
  - page: 301
    col: 16
    role: j
    text: 而與右師言者有就右師之位而與右
  - page: 302
    col: 1
    role: j
    text: 師言者
  - page: 302
    col: 2
    role: z
    text: 公行子齊大夫右師王驩也
  - page: 302
    col: 3
    role: j
    text: 孟子不與右師言右師不悅曰諸君子
  - page: 302
    col: 4
    role: j
    text: 皆與驩言孟子獨不與驩言是簡驩也
  - page: 302
    col: 5
    role: z
    text: 簡略也
  - page: 302
    col: 6
    role: j
    text: 孟子聞之曰禮朝廷不歷位而相與言
  - page: 302
    col: 7
    role: j
    text: 不踰階而相揖也我欲行禮子敖以我
  - page: 302
    col: 8
    role: j
    text: 爲簡不亦異乎
  - page: 302
    col: 9
    role: j
    text: 朝音潮○是時齊卿大夫以君命弔
  - page: 302
    col: 10
    role: j
    text: 各有位次若周禮凡有爵者之喪禮
  - page: 302
    col: 11
    role: j
    text: 則職喪涖其禁令序其事故云朝廷
  - page: 302
    col: 12
    role: j
    text: 也歷更涉也位他人之位也右師未
  - page: 302
    col: 13
    role: j
    text: 就位而進與之言則右師歷己之位
  - page: 302
    col: 14
    role: j
    text: 矣右師巳就位而就與之言則己歷
  - page: 302
    col: 15
    role: j
    text: 右師之位矣孟子右師之位又不同
  - page: 302
    col: 16
    role: j
    text: 階孟子不敢失此禮故不與右師言
  - page: 303
    col: 1
    role: j
    text: 也
  - page: 303
    col: 2
    role: j
    text: 孟子曰君子所以異於人者以其存心
  - page: 303
    col: 3
    role: j
    text: 也君子以仁存心以禮存心
  - page: 303
    col: 4
    role: z
    text: 以仁禮存心言以是存於心而不忘
  - page: 303
    col: 5
    role: j
    text: 也
  - page: 303
    col: 6
    role: j
    text: 仁者愛人有禮者敬人
  - page: 303
    col: 7
    role: z
    text: 此仁禮之施
  - page: 303
    col: 8
    role: j
    text: 愛人者人恒愛之敬人者人恒敬之
  - page: 303
    col: 9
    role: z
    text: 恒胡登反○此仁禮之驗
  - page: 303
    col: 10
    role: j
    text: 有人於此其待我以横逆則君子必自
  - page: 303
    col: 11
    role: j
    text: 反也我必不仁也必無禮也此物奚宜
  - page: 303
    col: 12
    role: j
    text: 至哉
  - page: 303
    col: 13
    role: z
    text: 横去聲下同○横逆謂強暴不順理
  - page: 303
    col: 14
    role: j
    text: 也物事也
  - page: 303
    col: 15
    role: j
    text: 其自反而仁矣自反而有禮矣其横逆
  - page: 303
    col: 16
    role: j
    text: 由是也君子必自反也我必不忠
  - page: 304
    col: 1
    role: z
    text: 由與猶同下放此○忠者盡己之謂
  - page: 304
    col: 2
    role: z
    text: 我必不忠恐所以愛敬人者有所不
  - page: 304
    col: 3
    role: z
    text: 盡其心也
  - page: 304
    col: 4
    role: j
    text: 自反而忠矣其横逆由是也君子曰此
  - page: 304
    col: 5
    role: j
    text: 亦妄人也已矣如此則與禽獸奚擇哉
  - page: 304
    col: 6
    role: j
    text: 於禽獸又何難焉
  - page: 304
    col: 7
    role: z
    text: 難去聲○奚擇何異也又何難焉言
  - page: 304
    col: 8
    role: z
    text: 不足與之校也
  - page: 304
    col: 9
    role: j
    text: 是故君子有終身之憂無一朝之患也
  - page: 304
    col: 10
    role: j
    text: 乃若所憂則有之舜人也我亦人也舜
  - page: 304
    col: 11
    role: j
    text: 爲法於天下可傳於後世我由未免爲
  - page: 304
    col: 12
    role: j
    text: 鄉人也是則可憂也憂之如何如舜而
  - page: 304
    col: 13
    role: j
    text: 巳矣若夫君子所患則亡矣非仁無爲
  - page: 304
    col: 14
    role: j
    text: 也非禮無行也如有一朝之患則君子
  - page: 304
    col: 15
    role: j
    text: 不患矣
  - page: 304
    col: 16
    role: z
    text: 夫音扶○郷人郷里之常人也君子
  - page: 305
    col: 1
    role: z
    text: 存心不苟故無後憂
  - page: 305
    col: 2
    role: j
    text: 禹稷當平世三過其門而不入孔子賢
  - page: 305
    col: 3
    role: j
    text: 之
  - page: 305
    col: 4
    role: z
    text: 事見前篇
  - page: 305
    col: 5
    role: j
    text: 顏子當亂世居於陋巷一簞食一瓢飲
  - page: 305
    col: 6
    role: j
    text: 人不堪其憂顏子不改其樂孔子賢之
  - page: 305
    col: 7
    role: z
    text: 食音嗣樂音洛
  - page: 305
    col: 8
    role: j
    text: 孟子曰禹稷顏回同道
  - page: 305
    col: 9
    role: z
    text: 聖賢之道進則救民退則脩己其心
  - page: 305
    col: 10
    role: z
    text: 一而已矣
  - page: 305
    col: 11
    role: j
    text: 禹思天下有溺者由己溺之稷思天下
  - page: 305
    col: 12
    role: j
    text: 有飢者由己飢之也是以如是其急也
  - page: 305
    col: 13
    role: z
    text: 由與猶同○禹稷身任其職故以為
  - page: 305
    col: 14
    role: z
    text: 己責而救之急也
  - page: 305
    col: 15
    role: j
    text: 禹稷顏子易地則皆然
  - page: 305
    col: 16
    role: z
    text: 聖賢之心無所偏倚隨感而應各盡
  - page: 306
    col: 1
    role: z
    text: 其道故使禹稷居顏子之地則亦能
  - page: 306
    col: 2
    role: z
    text: 樂顏子之樂使顏子居禹稷之任亦
  - page: 306
    col: 3
    role: z
    text: 能憂禹稷之憂也
  - page: 306
    col: 4
    role: j
    text: 今有同室之人鬬者救之雖被髮纓冠
  - page: 306
    col: 5
    role: j
    text: 而救之可也
  - page: 306
    col: 6
    role: z
    text: 不暇束髮而結纓往救言急也以喻
  - page: 306
    col: 7
    role: z
    text: 禹稷
  - page: 306
    col: 8
    role: j
    text: 鄉鄰有鬬者被髮纓冠而往救之則惑
  - page: 306
    col: 9
    role: j
    text: 也雖閉戶可也
  - page: 306
    col: 10
    role: z
    text: 喻顏子也○此章言聖賢心無不同
  - page: 306
    col: 11
    role: z
    text: 事則所遭或異然處之各當其理是
  - page: 306
    col: 12
    role: z
    text: 乃所以爲同也○尹氏曰當其可之
  - page: 306
    col: 13
    role: z
    text: 謂時前聖後聖其心一也故所遇皆
  - page: 306
    col: 14
    role: z
    text: 盡善
  - page: 306
    col: 15
    role: j
    text: 公都子曰匡章通國皆稱不孝焉夫子
  - page: 306
    col: 16
    role: j
    text: 與之遊又從而禮貌之敢問何也
  - page: 307
    col: 1
    role: z
    text: 匡章齊人通國盡一國之人也禮貌
  - page: 307
    col: 2
    role: z
    text: 敬之也
  - page: 307
    col: 3
    role: j
    text: 孟子曰世俗所謂不孝者五惰其四支
  - page: 307
    col: 4
    role: j
    text: 不顧父母之養一不孝也博弈好飲酒
  - page: 307
    col: 5
    role: j
    text: 不顧父母之養二不孝也好貨財私妻
  - page: 307
    col: 6
    role: j
    text: 子不顧父母之養三不孝也從耳目之
  - page: 307
    col: 7
    role: j
    text: 欲以為父母戮四不孝也好勇鬥很以
  - page: 307
    col: 8
    role: j
    text: 危父母五不孝也章子有一於是乎
  - page: 307
    col: 9
    role: z
    text: 好養從皆去聲很胡懇反○戮羞辱
  - page: 307
    col: 10
    role: z
    text: 也很忿戾也
  - page: 307
    col: 11
    role: j
    text: 夫章子子父責善而不相遇也
  - page: 307
    col: 12
    role: z
    text: 夫音扶○遇合也相責以善而不相
  - page: 307
    col: 13
    role: z
    text: 合故為父所逐也
  - page: 307
    col: 14
    role: j
    text: 責善朋友之道也父子責善賊恩之大
  - page: 307
    col: 15
    role: j
    text: 者
  - page: 307
    col: 16
    role: z
    text: 賊害也朋友當相責以善父子行之
  - page: 308
    col: 1
    role: z
    text: 則害天性之恩也
  - page: 308
    col: 2
    role: j
    text: 夫章子豈不欲有夫妻子母之屬哉為
  - page: 308
    col: 3
    role: j
    text: 得罪於父不得近出妻屏子終身不養
  - page: 308
    col: 4
    role: j
    text: 焉其設心以為不若是是則罪之大者
  - page: 308
    col: 5
    role: j
    text: 是則章子已矣
  - page: 308
    col: 6
    role: z
    text: 夫章之夫音扶為去聲屏必井反養
  - page: 308
    col: 7
    role: z
    text: 去聲○言章子非不欲身有夫妻之
  - page: 308
    col: 8
    role: z
    text: 配子有子母之屬但為身不得近於
  - page: 308
    col: 9
    role: z
    text: 父故不敢受妻子之養以自責罰其
  - page: 308
    col: 10
    role: z
    text: 心以為不如此則其罪益大也○此
  - page: 308
    col: 11
    role: z
    text: 章之旨於衆所惡而必察焉可以見
  - page: 308
    col: 12
    role: z
    text: 聖賢至公至仁之心矣○楊氏曰章
  - page: 308
    col: 13
    role: z
    text: 子之行孟子非取之也特哀其志而
  - page: 308
    col: 14
    role: z
    text: 不與之絕耳
  - page: 308
    col: 15
    role: j
    text: 曾子居武城有越冦或曰冦至盍去諸
  - page: 308
    col: 16
    role: j
    text: 曰無寓人於我室毀傷其薪木冦退則
  - page: 309
    col: 1
    role: j
    text: 曰修我牆屋我將反寇退曾子反左右
  - page: 309
    col: 2
    role: j
    text: 曰待先生如此其忠且敬也寇至則先
  - page: 309
    col: 3
    role: j
    text: 去以為民望寇退則反殆於不可沈猶
  - page: 309
    col: 4
    role: j
    text: 行曰是非汝所知也昔沈猶有負芻之
  - page: 309
    col: 5
    role: j
    text: 禍從先生者七十人未有與焉
  - page: 309
    col: 6
    role: z
    text: 與去聲○武城魯邑名盍何不也左
  - page: 309
    col: 7
    role: z
    text: 右曾子之門人也忠敬言武城之大
  - page: 309
    col: 8
    role: z
    text: 夫事曾子忠誠恭敬也為民望言使
  - page: 309
    col: 9
    role: z
    text: 民望而效之沈猶行弟子姓名也言
  - page: 309
    col: 10
    role: z
    text: 曾子嘗舍於沈猶氏時有負芻者作
  - page: 309
    col: 11
    role: z
    text: 亂來攻沈猶氏曾子率其弟子去之
  - page: 309
    col: 12
    role: z
    text: 不與其難言師賓不與臣同
  - page: 309
    col: 13
    role: j
    text: 子思居於衛有齊寇或曰寇至盍去諸
  - page: 309
    col: 14
    role: j
    text: 子思曰如伋去君誰與守
  - page: 309
    col: 15
    role: z
    text: 言所以不去之意如此
  - page: 309
    col: 16
    role: j
    text: 孟子曰曾子子思同道曾子師也父兄
  - page: 310
    col: 1
    role: j
    text: 也子思臣也微也曾子子思易地則皆
  - page: 310
    col: 2
    role: j
    text: 然
  - page: 310
    col: 3
    role: z
    text: 微猶賤也○尹氏曰或遠害或死難
  - page: 310
    col: 4
    role: z
    text: 其事不同者所處之地不同也君子
  - page: 310
    col: 5
    role: z
    text: 之心不繫於利害惟其是而已故易
  - page: 310
    col: 6
    role: z
    text: 地則皆能爲之○孔氏曰古之聖賢
  - page: 310
    col: 7
    role: z
    text: 言行不同事業亦異而其道未始不
  - page: 310
    col: 8
    role: z
    text: 同也學者知此則因所遇而應之若
  - page: 310
    col: 9
    role: z
    text: 權衡之稱物低昂屢變而不害其爲
  - page: 310
    col: 10
    role: z
    text: 同也
  - page: 310
    col: 11
    role: j
    text: 儲子曰王使人瞷夫子果有以異於人
  - page: 310
    col: 12
    role: j
    text: 乎孟子曰何以異於人哉堯舜與人同
  - page: 310
    col: 13
    role: j
    text: 耳
  - page: 310
    col: 14
    role: z
    text: 瞷古莧反○儲子齊人也瞷竊視也
  - page: 310
    col: 15
    role: z
    text: 聖人亦人耳豈有異於人哉
  - page: 310
    col: 16
    role: j
    text: 齊人有一妻一妾而處室者其良人出
  - page: 311
    col: 1
    role: j
    text: 則必饜酒肉而後反其妻問所與飲食
  - page: 311
    col: 2
    role: j
    text: 者則盡富貴也其妻告其妾曰良人出
  - page: 311
    col: 3
    role: j
    text: 則必饜酒肉而後反問其與飲食者盡
  - page: 311
    col: 4
    role: j
    text: 富貴也而未甞有顯者來吾將瞷良人
  - page: 311
    col: 5
    role: j
    text: 之所之也蚤起施從良人之所之徧國
  - page: 311
    col: 6
    role: j
    text: 中無與立談者卒之東郭墦間之祭者
  - page: 311
    col: 7
    role: j
    text: 乞其餘不足又顧而之他此其爲饜足
  - page: 311
    col: 8
    role: j
    text: 之道也其妻歸告其妾曰良人者所仰
  - page: 311
    col: 9
    role: j
    text: 望而終身也今若此與其妾訕其良人
  - page: 311
    col: 10
    role: j
    text: 而相泣於中庭而良人未之知也施施
  - page: 311
    col: 11
    role: j
    text: 從外來驕其妻妾
  - page: 311
    col: 12
    role: j
    text: 施音迤又音易墦音燔施施如字○
  - page: 311
    col: 13
    role: z
    text: 章首當有孟子曰字闕文也良人夫
  - page: 311
    col: 14
    role: z
    text: 也饜飽也顯者富貴人也施邪施而
  - page: 311
    col: 15
    role: z
    text: 行不使良人知也墦冢也顧望也訕
  - page: 311
    col: 16
    role: z
    text: 怨詈也施施喜悅自得之貌
  - page: 312
    col: 1
    role: j
    text: 由君子觀之則人之所以求冨貴利
  - page: 312
    col: 2
    role: j
    text: 達者其妻妾不羞也而不相泣者幾
  - page: 312
    col: 3
    role: j
    text: 希矣
  - page: 312
    col: 4
    role: z
    text: 孟子言自君子而觀今之求冨貴者
  - page: 312
    col: 5
    role: z
    text: 皆若此人耳使其妻妾見之不羞而
  - page: 312
    col: 6
    role: z
    text: 泣者少矣言可羞之甚也○趙氏曰
  - page: 312
    col: 7
    role: z
    text: 言今之求冨貴者皆以枉曲之道昬
  - page: 312
    col: 8
    role: z
    text: 夜乞哀以求之而以驕人於白日與
  - page: 312
    col: 9
    role: z
    text: 斯人何以異哉
  - page: 312
    col: 14
    role: j
    text: 孟子卷第八
