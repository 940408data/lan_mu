# 孟子注疏卷5（孫奭疏）：j 為經文，漢趙岐注為注，z 為疏文。
sections:
  - id: juan5
    name: 正文
    blocks:
      - { type: z, text: "正义曰：此卷赵氏分上篇为此卷也。此卷凡十四章一章言民和为贵。二章言人君以尊德乐义为贤，君子以守道不回为志。三章言取与之道，必得其礼，於其可，虽少不辞；义之无处，兼金不顾。四章言人臣以道事君，否则奉身以退。五章言执职者劣，藉道者优。六章言道不合者，不相与言。七章言孝必尽心，匪礼之逾。八章言诛不义者，必须圣贤。九章言圣人亲亲，不文其过；小人顺非，以谄其上。十章言君子立身行道，道之不行，命也，不为利回。十一章言惟贤能安贤，智能知微。十二章言大德洋洋，介士察察，贤者志其大者，不贤者志其小者。十三章言圣贤兴作，与天消息，天非人不因，人非天不成。十四章言禄以食功，志以率事，无事而食其禄，君子不由也。此十四章合上篇卷，是《公孙丑》有二十三章矣。" }
      - { type: j, text: "孟子曰：“天时不如地利，地利不如人和。三里之城，七里之郭，环而攻之而不胜。夫环而攻之，必有得天时者矣，然而不胜者，是天时不如地利也。" }
      - { type: z, text: "天时谓时日、支干、五行、旺相、孤虚之属也。地利、险阻、城池之固也。人和，得民心之所和乐也。环城围之，必有得天时之善处者，然而城有不下，是不如地利。" }
      - { type: j, text: "城非不高也，池非不深也，兵革非不坚利也，米粟非不多也，委而去之，是地利不如人和也。" }
      - { type: z, text: "有坚强如此，而破之走者，不得民心，民不为守。卫懿公之民曰：“君其使鹤战，余焉能战？”是也。" }
      - { type: j, text: "故曰域民不以封疆之界，固国不以山之险，威天下不以兵革之利。" }
      - { type: z, text: "域民，居民也。不以封疆之界禁之，使民怀德也。不依险阻之固，恃仁惠也。不为兵革之威，仗道德也。" }
      - { type: j, text: "得道者多助，失道者寡助。寡助之至，亲戚畔之。多助之至，天下顺之。以天下之所顺，攻亲戚之所畔，故君子有不战，战必胜矣。”" }
      - { type: z, text: "得道之君，何向不平。君子之道，贵不战耳。如其当战，战则胜矣。“孟子曰天时”至“战必胜矣”。○正义曰：此章言民和为贵，贵于天地，故曰得乎丘民为天子也。“孟子曰：天时不如地利，地利不如人和”至“是地利不如人和也”者，孟子言其用兵之要也，谓古之用兵者，莫不布策挟龟，迎日计月，望云占风，观星候气，以察吉凶，以明利害，必有得天时者矣。然而内有三里之城，外有七里之郭，以为之御，虽环转而攻之，则莫能胜焉。是天时不如地利也。凿池深之使其不可逾，筑城高之使其不可攻，又以甲兵之坚利、米粟之多积，是地利亦有得矣，然而上下异政，君民异心，不能效死以守，至皆委却而去之，是地利又不如人和也。孟子於前言天时不如地利，地利不如人和，乃设此文於後，而解其言也，故曰“三里之城，七里之郭，环而攻之而不胜。夫环而攻之，必有得天时者矣，然而不胜者，是天时不如地利也”至“是地利不如人和”而已矣。“故曰域民不以封疆之界”至“战必胜矣”者，此又孟子复言而详说之也，故曰所居之民，不在以封疆之为界；欲牢固其国，又不在以山之为险；威震天下，又不在以兵甲之为坚利：以其得道之君，则人多助之，失道之君，则人寡助之而已。孟子所以言此者，盖谓但在得其道，不在於封疆山兵甲之为矣，故复言人有寡助之至极者，则亲戚离畔之。亲戚离畔者，战必不胜而败绩。有多助之至者，则天下皆顺从之。以天下之所顺从而攻伐其亲戚所离畔者，故君子在有不战而已，如战则必胜。○注“天时谓时日、支干、五行、旺相、孤虚之属”。正义曰：时日支干者，子、丑、寅、卯、辰、巳、午、未、申、酉、戌、亥是为支。甲、乙、丙、丁、戊、己、庚、辛、壬、癸是为干。干支所以配时日而用之也。云“五行、旺相、孤虚之属”者，五行：金、木、水、火、土是也。金旺在巳午未申酉，木旺在亥子丑寅卯，水旺在申酉戌亥子，火旺在寅卯辰巳午，土旺在申酉戌亥。孤虚者，盖孤虚之法，以一画为孤，无画为虚，二画为实，以六十甲子日定东西南北四方，然後占其孤虚实，而向背之，即知吉凶矣。又如周武王犯岁星以伐商，魏太祖以甲子日破慕容。凡用师之道，有太史以抱天时、太师之执同律之类是也。○注“卫懿公之民曰：君其使鹤战”。○正义曰：案《左传》鲁闵公二年云：“狄人伐卫，卫懿公好鹤，鹤有乘轩者。将战，国人受甲者皆曰：‘使鹤，鹤实有禄位，余焉能战？’”是其文也。○注“得乎丘民而为天子”。○正义曰：此盖经之文。" }
      - { type: j, text: "孟子将朝王，王使人来曰：“寡人如就见者也，有寒疾，不可以风，朝将视朝，不识可使寡人得见乎？”" }
      - { type: z, text: "孟子虽仕齐，处师宾之位，以道见敬，或称以病，未尝趋朝而拜也。王欲见之，先朝使人往谓孟子云：寡人如就见者，若言就孟子之馆相见也，有恶寒之疾，不可见风，傥可来朝，欲力疾临视朝，因得见孟子也，不知可使寡人得相见否。" }
      - { type: j, text: "对曰：“不幸而有疾，不能造朝。”" }
      - { type: z, text: "孟子不悦王之欲使朝，故称其有疾而拒之也。" }
      - { type: j, text: "明日，出吊於东郭氏。公孙丑曰：“昔者辞以病，今日吊，或者不可乎？”" }
      - { type: z, text: "东郭氏，齐大夫家也。昔者，昨日也。丑以为不可。" }
      - { type: j, text: "曰：“昔者疾，今日愈，如之何不吊？”" }
      - { type: z, text: "孟子言我昨日病，今日愈，我何为不可以吊。" }
      - { type: j, text: "王使人问疾，医来。" }
      - { type: z, text: "王以孟子实病，遣人将医来，且问疾也。" }
      - { type: j, text: "孟仲子对曰：“昔者有王命，有采薪之忧，不能造朝。今病小愈，趋造於朝，我不识能至否乎？”" }
      - { type: z, text: "孟仲子，孟子之从昆弟，从学於孟子者也。权辞以对如此。忧，病也。《曲礼》云：“有负薪之忧。”" }
      - { type: j, text: "使数人要於路曰：“请必无归而造於朝。”" }
      - { type: z, text: "仲子使数人要告孟子，君命宜敬，当必造朝也。" }
      - { type: j, text: "不得已而之景丑氏宿焉。" }
      - { type: z, text: "孟子迫於仲子之言，不得已，而心不欲至朝，因之其所知齐大夫景丑之家而宿焉。具以语景丑氏耳。" }
      - { type: j, text: "景子曰：“内则父子，外则君臣，人之大伦也。父子主恩，君臣主敬。丑见王之敬子也，未见所以敬王也。”" }
      - { type: z, text: "景丑责孟子不敬，何义也。" }
      - { type: j, text: "曰：“恶！是何言也！齐人无以仁义与王言者，岂以仁义为不美也？其心曰：‘是何足与言仁义也！’云尔，则不敬莫大乎是。" }
      - { type: z, text: "曰恶者，深嗟叹。云景子之责我何言乎？今人皆谓王无知，不足与言仁义。云尔，绝语之辞也。人之不敬，无大於是者也。" }
      - { type: j, text: "我非尧舜之道不敢以陈於王前，故齐人莫如我敬王也。”" }
      - { type: z, text: "孟子言我每见王，常陈尧舜之道以劝勉王。齐人无有如我敬王者也。" }
      - { type: j, text: "景子曰：“否，非此之谓也。《礼》曰：‘父召，无诺。’‘君命召，不俟驾。’固将朝也，闻王命而遂不果，宜与夫《礼》若不相似然。”" }
      - { type: z, text: "景子曰：非谓不陈尧舜之道，谓为臣固自当朝也。今有王命而不果行。果，能也。《礼》：父召，无诺，无诺而不至也。君命召，辇车就牧，不坐待驾。而夫子若是，事宜与夫《礼》若不相似然乎？愚窃惑焉。" }
      - { type: j, text: "曰：“岂谓是与？曾子曰：‘晋楚之富，不可及也。彼以其富，我以吾仁；彼以其爵，我以吾义。吾何慊乎哉？’夫岂不义而曾子言之？是或一道也。" }
      - { type: z, text: "孟子答景丑云：我岂谓是君臣召呼之间乎。谓王不礼贤下士，故道曾子之言，自以不慊晋楚之君。慊，少也。曾子岂尝言不义之事邪？是或者自得道之一义，欲以喻王犹晋楚，我犹曾子，我岂轻於王乎？" }
      - { type: j, text: "天下有达尊三：爵一，齿一，德一。朝廷莫如爵，乡党莫如齿，辅世长民莫如德。恶得有其一以慢其二哉？" }
      - { type: z, text: "三者，天下之所通尊也。孟子谓贤者、长者，有德有齿，人君无德但有爵耳，故云何得以一慢二乎？" }
      - { type: j, text: "故将大有为之君，必有所不召之臣，欲有谋焉，则就之，其尊德乐道，不如是不足以有为也。" }
      - { type: z, text: "言古之大圣大贤有所兴为之君，必就大贤臣而谋事，不敢召也。王者师臣，霸者友臣也。" }
      - { type: j, text: "故汤之於伊尹，学焉而後臣之，故不劳而王。桓公之於管仲，学焉而後臣之，故不劳而霸。" }
      - { type: z, text: "言师臣者王。桓公能师臣，而管仲不勉之於王，故孟子於上章陈其义，讥其功烈之卑也。" }
      - { type: j, text: "今天下地丑德齐，莫能相尚，无他，好臣其所教，而不好臣其所受教。" }
      - { type: z, text: "丑，类也。言今天下之人君，土地相类，德教齐等，不能相绝者，无它，但好臣其所教敕役使之才，可骄者耳。不能好臣大贤可从而受教者也。" }
      - { type: j, text: "汤之於伊尹，桓公之於管仲，则不敢召。管仲且犹不可召，而况不为管仲者乎？”" }
      - { type: z, text: "孟子自谓不为管仲，故非齐王之召已也，是以不往而朝见於齐王也。“孟子将朝王”至“而况不为管仲者乎”。○正义曰：此章指言人君以尊德乐义为贤，君子以守道不回为志者也。“孟子将朝王，王使人来曰：寡人如就见者也”至“得见乎”者，言孟子自将欲朝见王，未及行而齐王欲见之，乃先使人来曰：寡人如往而就孟子所馆处相见，以其有恶寒之疾，不可见风，傥可以来朝见，而我将视其来朝，不知可使寡人因此而得见孟子否乎？此皆齐王使人而言也。“对曰：不幸而有疾，不能造朝”者，王之使人既已见孟子而导王之言，孟子乃答王之使人，亦曰：我之不幸而有其疾，不能趋造而朝见王。以其孟子不喜王欲使来朝，故云有疾，以拒之也。“明日出吊於东郭氏，公孙丑曰：昔者辞以病，今日吊，或者不可乎”者，言孟子自辞王以为疾，不能造朝之，明日乃出吊问於齐大夫东郭氏之家，其弟子公孙丑问孟子曰：昨日辞王之使以为疾不能造朝，而今日以出吊问於东郭氏，或者以为不可出吊。“曰昔者疾，今日愈，如之何不吊”者，孟子答公孙丑，以为昨日有疾，今日已差愈，如之何为不可吊。孟子於是往吊之。“王使人问疾，医来”者，王见使人回报，以谓孟子有疾，乃谓实有疾，遂遣人问疾，医者来问其疾。“孟仲子对曰：昔者有王命，有采薪之忧，不能造朝。今疾小愈，趋造於朝，我不识能至否乎”者，孟仲子，孟子从昆弟，学於孟子者也。孟仲子时见王使人问疾，医来至，而孟子已往吊於东郭氏，乃权其言而答问疾医者，曰：昨日有王命来使孟子朝，孟子辞之，以其有采薪之忧，小疾，不能趋造而朝王。今日病以小愈，已趋造於王朝，我不知于今能至於王朝否乎，以为未曾至乎？“使数人要於路曰：请必无归而造於朝”者，孟仲子恐孟子归，以为失言，乃使数人而来告孟子於路曰：请必无归，而趋造於王朝。“不得已而之景丑氏宿焉”者，孟子见孟仲子使数人要於路，乃见迫於仲子之言，遂不得已而往齐大夫景丑氏之家宿焉。以其心不欲朝王，故往景丑氏家宿而已。“景子曰：内则父子，外则君臣，人之大伦也。父子主恩，君臣主敬，丑见王之敬子也，未见所以敬王也”者，景丑见孟子不造朝，而乃止其家宿焉，於是曰：在闺门之内，则有父子之亲，出而邦国之外，则有君臣之义，此人之大伦，而不可汩也。父子则存乎慈孝之恩，君臣则存乎恭敬之义。今丑每见王之敬重其子也，而未尝见子之所以能尊敬於王也。“曰：恶，是何言也”至“莫大乎是”者，孟子答景丑言，乃叹惜言是何言，而责我也。齐人皆无以仁义之道与王言者，岂以仁义之道为不嘉美也，其齐人心已谓是王何足与言仁义之道也！言尔之不尊敬於王，莫大乎此者也。“我非尧舜之道，不敢以陈於王前，故齐人莫如我敬王也”者，孟子言我非是尧舜二帝之道，则不敢铺陈於王之前，故齐人未有如我如此之敬王也。所谓尧舜之道，即仁义之道也。“景子曰：否，非此之谓也，《礼》曰：父召无诺”至“若不相似然”者，景丑言否，我不谓不陈尧舜之道也，以其《礼》云父召而子无诺而不至，君有命召，不坐待驾。今子固将欲自朝於王，而闻王命以遂不果行，是宜与夫《礼》若不相似然。以其有逆此《礼》也。“曰：岂谓是欤？曾子曰：晋、楚之富”至“是或一道也”者，孟子又言於景丑曰：我岂谓是君臣呼召之问乎？以其曾子言，晋、楚二君之富，人不可及也，然彼既以其富，我但有吾之仁，；彼既有其爵，而我但存吾之义：我何慊不足於彼乎哉！夫晋、楚之富，岂为不义？然於曾子言，是止於一道而言之也。一於道而言之，则曾子所以但言吾仁吾义，而不慊於晋、楚之富与其爵也。盖谓晋、楚於富者，以其不过有所施而已，然我之仁固足以有施矣；晋楚贵於爵者，以其足以有制而已，然我之义固足以有制矣，然则富之与爵，而仁义得以并而有焉耳。此曾子所以一於仁义之道，而晋、楚富贵不足为富贵也。孟子所以执此而语景子者，意欲以比齐王之有富贵，亦晋楚之富贵不足为富贵也，而我犹曾子，但以仁义敌之，何有不足於齐王哉？此所以不欲朝王之意也。“天下有达尊三”至“恶得有其一而慢其二哉”者，达，通也，孟子又言天下有达尊者有三，爵一、齿一、德一是也。自朝廷之间莫如以爵为之尊，自乡党之间莫如以齿为之尊，自辅治其世、长养其民莫如以德为之尊。以其朝廷贵贵在爵，故以爵为朝廷之所尊；乡党长长在齿，故以齿为乡党之所尊；贤者有德，故以之辅世而佐佑之，则天下待之而後治，以之长民，则天下之民待之而後安，故以德为辅世长民之所尊。今齐王但有其爵，而安可止以一而慢去其齿、德二者哉？此孟子所以言齐王不能尊有德之士，故於景子而云然也。“故将大有为之君”至“而况不为管仲者乎”者，孟子又言故将有大兴为之君，必有所不可命召之臣，凡欲有所谋计，则就而谋，以其不敢召也。其尊德乐道，不如此有谋则就而不召，是不足有大兴为也。故汤王之於伊尹，乃就而师之，然後方敢得而为臣，故汤王自七十里而为天下，但不待劳而为之王者。齐桓公之於管仲，乃就而师之，然後方敢得而为臣，故桓公亦不劳而为诸侯之霸者。今天下於齐国，其地亦有类於汤、桓，其德又与汤、桓齐等，其未能有相加尚者，无他事焉，但汤、桓好受臣其所教，而齐王不好臣其所受教也。夫以汤王之於伊尹，齐桓之於管仲，则不敢召而见之。管仲，霸者之佐，且犹尚不可召见之，而况我不为管仲者乎？此孟子所以见齐王之召己，是以不往而见也。○注云“东郭氏，齐大夫家也”。○正义曰：东郭者，齐国之东地，号为东郭也。经云“卒之东郭番间之祭”者，则东郭是齐国之东地也。氏者，未详其人。注云“齐大夫家也”，以理测之，孟子之所以吊问者，必齐之贤大夫也。如非大夫之等，孟子亦何由而吊之。○注“孟仲子，孟子之从昆弟，而学於孟子者也”。○正义曰：未详，以理推之，则与孟子同姓，必孟子从昆弟而学於孟子者也。○注“景丑氏，齐大夫”，亦未详其人也。" }
      - { type: j, text: "陈臻问曰：“前日於齐，王馈兼金一百而不受，於宋，馈七十镒而受，於薛，馈五十镒而受。前日之不受是，则今日之受非也。今日之受是，则前日之不受非也。夫子必居一於此矣。”" }
      - { type: z, text: "陈臻，孟子弟子。兼金，好金也，其价兼倍於常者，故谓之兼金。一百，百镒也。古者以一镒为一金，镒是为二十四两。" }
      - { type: j, text: "孟子曰：“皆是也。当在宋也，予将有远行，行者必以赆，辞曰‘馈赆’，予何为不受？" }
      - { type: z, text: "赆，送。行者赠贿之礼也，时人谓之赆。" }
      - { type: j, text: "当在薛也，予有戒心，辞曰‘闻戒’，故为兵馈之，予何为不受？" }
      - { type: z, text: "戒，有戒备不虞之心也。时有恶人欲害孟子，孟子戒备。薛君曰闻有戒，此金可鬻以作兵备，故馈之。我何为不受也？" }
      - { type: j, text: "若於齐，则未有处也。无处而馈之，是货之也。焉有君子而可以货取乎？”" }
      - { type: z, text: "我在齐时无事，於义未有所处也。义无所处而馈之，是以货财取我，欲使我怀惠也。安有君子而可以货财见取之乎？是其礼当其可也。“陈臻问曰”至“可以货取乎”。○正义曰：此章指言取与之道，必得其礼，於其可也，虽少不辞，义之无处，兼金不顾也。“陈臻问曰：前日於齐王馈兼金一百而不受”至“必居一於此矣”者，陈臻，孟子弟子也。问孟子，前日於齐王之所而齐王馈赐兼金百镒而不受，於宋国但馈以七十镒而受之，於薛国馈以五十镒而受之，如为前日在齐不受百镒是，则今日之受宋七十镒为非也。如今日之受宋七十镒为是则前日在齐不受一百镒为非也。夫子於此三者之间，必居一於此矣。“孟子曰皆是也”至“而可以货取乎”者，孟子答弟子陈臻，以为此三者之间，受与不受之所皆是也，无有非也。言我在宋之时，以其我将有远行，行者必以有赆，故馈之者乃为之辞曰馈赆，我何为不受？是所以受之也。而不为非也。赆。送行者之贿也。我当在薛之时，我有戒不虞之心，以其时人欲害孟子也，馈之者乃为之辞曰：闻孟子有戒，欲以此金馈之，可为兵备之用也。如此，我何为不受？是所以受之也。若於齐之时，其以无事於我，未有所处於我，未有所处而馈我以金，是以货财见取於我也，安有君子而可以货取之乎？是所以於齐不受百镒亦为是也。云有处、未有处者，如宋以远行乃以赆为馈，於薛有戒乃以兵为馈，是皆若有处以馈之也。於齐亦无远行，亦无戒备，馈之者亦无以辞处之而馈，於我亦无有辞处而受之故也。○注云“陈臻孟子弟子”至“二十四两”。○正义曰：云弟子者，盖时有所问於孟子者，即知为弟子也。如非弟子，又安得有问於孟子。云二十四两为镒，案《国语》有云：“二十四两为镒，又郑注之文亦然。" }
      - { type: j, text: "孟子之平陆，谓其大夫曰：“子之持戟之士，一日而三失伍，则去之否乎？”" }
      - { type: z, text: "平陆，齐之邑也。大夫，居邑大夫也。持戟，战士也。一日三失其行伍，则去之否乎？去之，杀之也。戎昭果毅。" }
      - { type: j, text: "曰：“不待三。”" }
      - { type: z, text: "大夫曰：一失之则行罚，不及待三失伍也。" }
      - { type: j, text: "“然则子之失伍也亦多矣。凶年饥岁，子之民老羸转於沟壑、壮者散而之四方者几千人矣。”" }
      - { type: z, text: "转，转尸於沟壑也。此则子之失伍也。" }
      - { type: j, text: "曰：“此非距心之所得为也。”" }
      - { type: z, text: "距心，大夫名。曰：此乃齐王之大政，不肯赈穷，非我所得专为也。" }
      - { type: j, text: "曰：“今有受人之牛羊而为之牧之者，则必为之求牧与刍矣。求牧与刍而不得，则反诸其人乎？抑亦立而视其死与？”" }
      - { type: z, text: "牧，牧地。以此喻距心不得自专，何不致为臣而去乎？何为立视民之死也？" }
      - { type: j, text: "曰：“此则距心之罪也。”" }
      - { type: z, text: "距心自知以不去位为罪者也。" }
      - { type: j, text: "他日，见於王曰：“王之为都者，臣知五人焉。知其罪者惟孔距心。”为王诵之。王曰：“此则寡人之罪也。”" }
      - { type: z, text: "孔，姓也。为都，治都也。邑有先君之宗庙曰都。诵，言也。为王言所与孔距心语者也。王知本之在己，故受其罪也。“孟子之平陆”至“寡人之罪也”。正义曰：此章指言人臣以道事君，否则奉身以退。《诗》云“彼君子兮，不素餐兮”，言不尸其禄也。“孟子之平陆，谓其大夫曰：子之持戟之士，一日而三失伍，则去之否乎”者，孟子往齐平陆之邑，谓其邑之大夫曰：子之持戟之战士，一日三次失其行伍，则杀之否乎？“曰：不待三”者，邑大夫答孟子，以为不待三次失行伍也。言一次失行伍则杀之也。“然则子之失伍也亦多矣，凶年饥岁，子之民老羸转於沟壑、壮者散而之四方者几千人矣”者，凶年饥岁，子之邑民老羸弱者皆转乎沟壑，壮健者皆散而奔往於四方者，几近於一千人矣。此孟子首以持戟之士失伍比之，欲终以此讽之故也。盖军法以五人为伍，而以下士一人为之长，则持戟之士，伍长之士也，所以保卫其伍者也，不能保卫其伍，故一日三失伍，此不称其职也。如齐之平陆大夫，所以保卫其邑之民，不能保卫其邑之民，故老弱转沟壑，壮者散四方，其亦不称职也。孟子故以此喻而终归讽之。“曰：此非距心之所得为也”者，距心，齐大夫之名也。距心言是其齐王行政，故不肯发仓廪而赈救其民，非我所得而专为者也。“曰：今有受人之牛羊而为之牧之者，则必为之求牧与刍矣，求牧与刍而不得，则反诸其人乎，抑亦立而视其死与”者，孟子又以此比喻而归讽之也，言今有受人之牛羊而为牧养者，则必於牛羊之主求其牧养之刍草矣。求牧养与刍草而不得，则归反还於其主乎？抑亦但立视牛羊之死，而不为求牧与刍草欤？故以比喻而讽问之。“曰此则距心之罪也”者，距心因孟子以此比喻，乃自知以不去位为罪也。“他日，见於王曰：王之为都臣者，臣知五人焉”至“此则寡人之罪也”者，言他日距心自见於王曰：王之治都之臣者，臣知五人焉，然於此五人之中，能知其有罪者，惟孔距心。故为王言诵之。孔，距心之姓也。王亦自知治都之臣有其罪者，以其本皆自於己，故云此则寡人之罪也。○注“邑有先君之宗庙曰都”至“不素餐兮”。○正义曰：《周礼》云：“都鄙。”郑注云：“都之所居曰鄙。”都鄙，公卿大夫之采邑，王弟子所食邑，周、召、毛、冉、毕、原之属，在畿内者，祭祀其先君社稷者也。云“彼君子兮，不素餐兮”者，《诗·国风·伐檀》之篇文也。笺云：“彼君子者，斥伐檀之人，仕有功者，乃肯受禄。”毛氏云：“孰食曰餐。”笺云：“如鱼餐之餐。”" }
      - { type: j, text: "孟子谓氐蛙曰：“子之辞灵丘而请士师，似也，为其可以言也。今既数月矣，未可以言与？”" }
      - { type: z, text: "氐蛙，齐大夫。灵丘，齐下邑。士师，治狱官也。《周礼·士师》曰：“以五戒先後刑罚，无使罪丽於民。”孟子见氐蛙辞外邑大夫，请为士师，知其欲近王，以谏正刑罚之不中者。数月而不言，故曰未可以言欤？以感责之也。" }
      - { type: j, text: "氐蛙谏於王而不用，致为臣而去。" }
      - { type: z, text: "三谏不用，致仕而去。" }
      - { type: j, text: "齐人曰：“所以为氐蛙则善矣，所以自为则吾不知也。”" }
      - { type: z, text: "齐人论者讥孟子为氐蛙谋，使之谏不用而去，则善矣。不知自谏不用而不去，故曰我不见其自为谋者。" }
      - { type: j, text: "公都子以告。" }
      - { type: z, text: "公都子，孟子弟子也。以齐人语告孟子也。" }
      - { type: j, text: "曰：“吾闻之也，有官守者，不得其职则去，有言责者，不得其言则去。我无官守，我无言责也，则吾进退岂不绰绰然有馀裕哉！”" }
      - { type: z, text: "官守，居官守职者。言责，献言之责，谏诤之官也。孟子言人臣居官不得守其职，谏正君不见纳者，皆当致仕而去。今我居师宾之位，进退自由，岂不绰绰然舒缓有馀裕乎！绰、裕，皆宽也。“孟子谓氐蛙曰”至“绰绰然有馀裕哉”。○正义曰：此章指言执职者劣，藉道者优，是以臧武仲雨行而不息，段干木偃寝而式闾。“孟子谓氐蛙曰：子之辞灵丘而请士师，似也”至“未可以言欤”者，孟子谓齐大夫氐蛙曰：子之辞去其灵丘之邑，而请为王治狱之官，似近王，得谏其刑罚不中者。今既以数月矣而不言，是其未可以言欤否？故以此责而感之也。“氐蛙谏於王而不用，致为臣而去”者，於是氐蛙谏於王，而王不用其谏，乃致其臣而去之。“齐人曰：所以为氐蛙则善矣，所以自为则吾不知也”者，齐国之人见孟子谓氐蛙，乃言曰：孟子所以为氐蛙，使之谏不纳用而去之，则善矣美矣，其所以自为，其已之谏不见纳用而不去，则我不知也。以言其为氐蛙谋，使之去，而不知自去之故也。“公都子以告”者，公都子，孟子弟子也。公都子见齐国之人有此言，乃以此言告於孟子。“曰：吾闻之也，有官守者，不得其职则去，有言责者，不得其言则去。我无官守，我无言责，则吾进退岂不绰绰然有馀裕哉”者，孟子答公都子，以为我尝闻之，有居官守职者，不得其职而守之，则去之而致仕；有言责谏诤之任，不得其言而谏正其君，则亦去而致仕。今我无官职之所守，又无言责而谏诤，则我进退自由，岂不绰绰然舒缓有馀裕哉！绰、裕，皆宽裕也。○注“氐蛙，齐大夫，灵丘，齐下邑”至“罪丽於民”。○正义曰：氐蛙，於他经传未详其人。灵丘者，案《地理志》曰“代郡，有灵丘县”是也。云“《周礼·士师》曰：以五戒先後刑罚，毋使罪丽於民”者，今案其文，云：“一曰誓，用之于军旅；二曰诰，用之于会同；三曰禁，用诸田役；四曰纠，用诸国中；五曰宪，用诸都鄙。”郑注云：“先後犹左右也，誓诰於《书》，则《甘誓》、《大诰》之属，禁则军礼曰‘无干车’、‘无自後射’此其类也。纠、宪，未有闻焉。”○注“臧武仲段干木”。○正义曰：案鲁襄公二十二年《左传》云：“臧武仲如晋，雨，过御叔。御叔在其邑，将饮酒曰：‘焉用圣人，我将饮酒，而已雨行，何以圣为？’穆叔闻之曰：‘不可使也。”杜预云：“御叔，鲁御邑大夫。又武仲多知，时人谓之圣。”云“段干木偃寝而轼闾”。案《史记·魏世家》云：“魏文侯受子贡经艺，客段干木，过其闾，未尝不轼也。”是矣。" }
      - { type: j, text: "孟子为卿於齐，出吊於滕，王使盖大夫王为辅行。王朝暮见，反齐、滕之路，未尝与之言行事也。" }
      - { type: z, text: "孟子尝为齐卿，出吊於滕君，盖齐下邑也。王以治盖之大夫王为辅行。辅，副使也。王，齐之谄人，有宠於王，後为右师。孟子不悦其为人，虽与同使而行，未尝与之言行事，不愿与之相比也。" }
      - { type: j, text: "公孙丑曰：“齐卿之位，不为小矣。齐、滕之路，不为近矣。反之而未尝与言行事，何也？”" }
      - { type: z, text: "丑怪孟子不与议行事也。" }
      - { type: j, text: "曰：“夫既或治之，予何言哉！”" }
      - { type: z, text: "既，已也。或，有也。孟子曰：夫人既自谓有治行事，我将复何言哉。言其专知自善，不知谘於人也。盖言道不合者，故不相与言，所以有是而言之也已。“孟子为卿於齐”至“予何言哉”。○正义曰：此章指言道不合者不相与言。王之操与孟子殊，君子处时，危言逊行，故不尤之，但不与言。至于公行之丧，以礼为解也。“孟子为卿於齐，出吊於滕”至“未尝与言行事也”者，言孟子尝为卿相於齐，时自齐国出吊於滕国之君，齐王使齐之下邑大夫名曰王者为之辅行。辅行，言其为副使也。王旦夕见孟子，及反归，自齐、滕之道路，而孟子未尝与之言行事也。“公孙丑问曰：齐卿之位不为小矣，齐、滕之路不为近矣，反之而未尝与言行事，何也”者，公孙丑问孟子，言齐王卿相之位不为卑小矣，自齐至滕，其相去之路又不为近矣，然而自滕反归齐，其於道路之中，未尝与王言行治之事，是如之何也？以其公孙丑有怪孟子不与王言，故问之以此耳。“曰：夫既或治之，予何言哉”者，孟子答公孙丑，以谓夫王既以尝自谓有治行事，我将复何言哉！以其王自专为善，不谘访人，故孟子所以未尝与之言也。○注“王後为右师”。○正义曰：此盖推经於《离娄》篇有云孟子不与右师言，右师不悦，是知王後为右师也。王姓王名，字子敖。又云“至於公行之丧，以其礼解之”者，盖亦经之文也。" }
      - { type: j, text: "孟子自齐葬於鲁，反於齐，止於嬴。充虞请曰：“前日不知虞之不肖，使虞敦匠，事严，虞不敢请。今原窃有请也：木若以美然。”" }
      - { type: z, text: "孟子仕於齐，丧母，而归葬於鲁也。嬴，齐南邑。充虞，孟子弟子。敦匠，厚作棺也。事严，丧事急。木若以泰美然也。" }
      - { type: j, text: "曰：“古者棺椁无度。中古，棺七寸，椁称之。自天子达於庶人，非直为观美也，然後尽於人心。" }
      - { type: z, text: "孟子言古者棺椁厚薄无尺寸之度。中古，谓周公制礼以来，棺椁七寸，椁薄於棺，厚薄相称相得也。从天子至於庶人，厚薄皆然，但重累之数，墙た之饰有异，非直为人观视之美好也。厚者难腐朽，然後尽於人心所不忍也。谓一世之後，孝子更去辟世，是为人尽心也。过是以往，变化自其理也。" }
      - { type: j, text: "不得不可，以为悦，无财不可以为悦，得之为有财，古之人皆用，吾何为独不然？" }
      - { type: z, text: "悦者，孝子之欲厚送亲，得之则悦也。王制所禁，不得用之，不可以悦心也。无财以供，则度而用之。礼：丧事不外求，不可称贷而为悦也。礼得用之，财足备之，古人皆用之，我何为独不然。不然者，言其不如是也。" }
      - { type: j, text: "且比化者，无使土亲肤，於人心独无忄交乎？" }
      - { type: z, text: "忄交，快也。棺椁敦厚，比亲体之变化，且无令土亲肤，於人子之心，独不快然无所恨也。" }
      - { type: j, text: "吾闻之，君子不以天下俭其亲。”" }
      - { type: z, text: "我闻君子之道，不以天下人所得用之物俭约於其亲，言事亲竭其力者也。“孟子自齐葬於鲁”至“不以天下俭其亲”。正义曰：此章指言孝必尽心，匪礼之逾。《论语》曰：“生事之以礼，死丧之以礼，可谓孝矣。”“孟子自齐葬於鲁，反於齐，止於嬴”者，言孟子仕於齐国，丧其母，乃归葬於鲁国。既葬，又反於齐下嬴邑而止焉。“充虞请曰：前日不知虞之不肖，使虞敦匠事严，虞不敢请。今原窃有请也：木若以美然”者，充虞，孟子弟子也，言孟子止於嬴邑，弟子充虞请见於孟子曰：前日孟子丧母之时，孟子不知虞之不肖，乃使虞敦匠厚作其棺，以其是时丧事严急，故虞不敢请问孟子。今孟子既葬而反，原窃得而请问也。木若以美然？此充虞请问以此也。其问孟子为棺椁之木若以泰美然也。“曰：古者棺椁无度，中古棺七寸，椁称之。自天子达於庶人，非直为观美也，然後尽於人心”至“吾闻之君子，不以天下俭其亲”者，此皆孟子答充虞而言也。言上古之人，棺椁薄厚无尺寸之度。自中古以来，棺厚七寸，以椁相称之，自天子通於庶人皆然，非谓直为人观美好也，然後乃为尽於人心也。以其不得其厚用之，则不可以为悦於心也。既得以此厚用之，而财物无以供赡其度，亦不可以为悦於心。如得之以此厚用，又有财物以供其度，古之人皆用之以厚葬其亲也，我何为而独不如是也。且棺椁敦厚，比亲体之变化，无使其土壤亲其肌肤，於人子之心独无快乎！忄交，快也。以其人子之心如此得厚葬其亲，乃快然而弗恨也。我闻之，君子者，不以天下所得用者而俭薄其亲也。○注“嬴，齐南邑”。○正义曰：案鲁桓公三年《左传》杜预注云“嬴，齐邑，今泰山嬴县”是也。○注“重累之数墙た之饰”。○正义曰：案《礼记·檀弓》云：“周人墙置た。”郑注云：“墙，柳衣也。凡此皆後王之制。”又案《阮氏图》云：“柳，柳车也。四轮一辕，车长丈二尺，高五尺。”案《丧大记》云：“君饰棺，黼た二，黻た二，画た二，龙た二。”《礼器》云：“天子八た，大夫四た。”又郑注《丧大记》引《汉礼》：“た以木为筐，广三尺，高二尺四寸，方两角，高以白布画著紫云气，其馀各如其象。柄长五尺，车行，使人持之而从，以障既窆，树於圹中障板也。○注“《论语》曰：生事之以礼，死葬之以礼”。○正义曰：经於《滕文》之篇亦引为曾子言也，已说在前。" }
      - { type: j, text: "沈同以其私问曰：“燕可伐与？”孟子曰：“可。子会不得与人燕，子之不得受燕於子哙。" }
      - { type: z, text: "沈同，齐大臣。自以私情问，非王命也，故曰私。子哙，燕王也。子之，燕相也。孟子曰可者，以子哙不以天子之命而擅以国与子之，子之亦不受天子之命而私受国於子哙，故曰其罪可伐。" }
      - { type: j, text: "有仕於此，而子悦之，不告於王而私与之吾子之禄爵，夫士也亦无王命而私受之於子，则可乎？何以异於是！”" }
      - { type: z, text: "子谓沈同也。孟子设此，以譬燕王之罪。" }
      - { type: j, text: "齐人伐燕。" }
      - { type: z, text: "沈同以孟子言可，因归劝其王伐燕。" }
      - { type: j, text: "或问曰：“劝齐伐燕，有诸？”" }
      - { type: z, text: "有人问孟子劝齐王伐燕，有之？" }
      - { type: j, text: "曰：“未也。沈同问燕可伐与？吾应之曰可。彼然而伐之也。" }
      - { type: z, text: "孟子曰：我未劝王也，同问可伐乎？吾曰可，彼然而伐之也。" }
      - { type: j, text: "彼如曰：孰可以伐之？则将应之曰：为天吏，则可以伐之。" }
      - { type: z, text: "彼如将问我曰：谁可以伐之？我将曰：为天吏则可以伐之。天吏，天所使，谓王者得天意者。彼不复问孰可，便自往伐之矣。" }
      - { type: j, text: "今有杀人者，或问之曰：人可杀与？则将应之曰：可。彼如曰：孰可以杀之？则将应之曰：为士师则可以杀之。今以燕伐燕，何为劝之哉？”" }
      - { type: z, text: "今有杀人者，问此人可杀否？将应之曰：可，为士官主狱则可以杀之矣。言燕虽有罪，犹当王者诛之耳。譬如杀人者虽当死，士师乃得杀之耳。今齐国之政犹燕政也，不能相逾，又非天吏也，我何为劝齐国伐燕国乎？“沈同以其私问曰”至“何为劝之哉”。○正义曰：此章指言诛不义者必须圣贤，礼乐征伐自天子出，王道之正者也。沈同，齐之大臣。“沈同以其私问曰：燕可伐欤？孟子曰：可，子哙不得与人燕，子之不得受燕於子哙”者，子哙，燕王名也；子之，燕相之名也。言沈同非王命，以其私情自问孟子曰：燕王可伐之欤？孟子答之，以为可伐之也，盖以燕王不得天子之命而擅与其国於子之，子之亦不得天子之命而私受燕国於子哙，故其专擅如此，可以伐之也。“有仕於此，而子悦之，不告於王而私与之吾子之禄爵，夫士也亦无王命有私受之於子，则可乎？何以异於是”者，此皆孟子设此譬喻王之罪而可伐者也。吾子谓沈同也，言今有为之仕於此齐国，而子喜悦之为人，乃不告於王而私自与之吾子之禄爵，夫为之士者又无王之所命，而私自受禄爵於子，则可矣否乎？今燕王所以为可伐之罪，何以有异於此？“齐人伐燕”者，以其沈同问於孟子之言为燕可伐，於是归劝齐王而伐之。“或问：劝齐伐燕，有诸”者，言有人或问於孟子，以为孟子劝齐伐燕，是有劝之之言否？“曰：未也，沈同问燕可伐与？吾应之曰可，彼然而伐之也”者，孟子答或人，以为我未尝劝王也，以其沈同问我，谓燕可伐之欤？我应之曰可，彼以为是而伐之也。“彼如曰：孰可以伐之？则将应之曰：为天吏则可以伐之”者，孟子又答之或人，言彼如问我曰谁可以伐之，我将应之曰：为天吏，天所使者，则可以伐之矣。“今有杀人者，或问之曰：人可杀欤”至“何为劝之哉”者，孟子又以此言而比喻齐之伐燕也，言今有杀人者，或问我曰：人可以杀之欤？我将应之曰：可以杀之。彼如复问谁可以杀之，我则将应之曰：为士师主狱之官则可以杀之矣。今以齐国之政亦若燕之政，是皆有燕之罪，以燕伐燕，我何为劝齐王以伐燕乎？以其燕之虽有其罪，亦当王者则可以诛之耳。○注“子哙，燕王也，子之，燕相也”。○正义曰：案《史记·世家》云：“易王立十二年，子燕哙立。哙立，齐人杀苏秦。苏秦之在燕，与其相子之为婚。燕哙三年，与楚、三晋攻秦，不胜而还。子之相燕，贵重主断，苏代为齐使於燕，燕王问曰：‘齐王奚如？’对曰：‘必不霸。’燕王曰：‘何也？’对曰：‘不信其臣。’於是燕王大信子之子。之遗苏代百金，乃谓燕王不如以国让子之。子之以谓尧贤者，让天下於许由，由不受，有让天下之名而实不失天下。今王以燕国让子之，子之亦必不敢受，是王与尧同行也。燕王因属国於子之，子之大重，於是南面行王事，而哙老不听政，国事皆决於子之。三年，国大乱，百姓悯恐。孟轲谓齐王曰：‘今伐燕，此文、武之时，不可失也。’齐王因令章子将五都之兵以伐燕，燕哙死，齐大胜。燕子之亡。”凡此是其事也。○注云“礼乐征伐自天子出”。○正义曰：此盖《论语·季氏》孔子之言也。言王宅功成制礼，治定作乐，立司马之官，掌九伐之法，诸侯不得制礼作乐，赐弓矢，然後专征伐。是礼乐征伐自天子出也。" }
      - { type: j, text: "燕人畔，王曰：“吾甚惭於孟子。”" }
      - { type: z, text: "燕人畔，不肯归齐。齐王闻孟子与沈同言为未劝王，今竟不能有燕，故惭之。" }
      - { type: j, text: "陈贾曰：“王无患焉。王目以为与周公孰仁且智？”王曰：“恶是何言也？”" }
      - { type: z, text: "陈贾，齐大夫也。问王曰：自视何如周公仁智乎？欲为王解孟子意，故曰王无患焉。王叹曰：是何言，言周公何可及也！" }
      - { type: j, text: "曰：“周公使管叔监殷，管叔以殷畔。知而使之，是不仁也；不知而使之，是不智也。仁、智，周公未之尽也，而况於王乎？贾请见而解之。”" }
      - { type: z, text: "贾欲以此说孟子也。" }
      - { type: j, text: "见孟子，问曰：“周公何人也？”" }
      - { type: z, text: "贾问之也。" }
      - { type: j, text: "曰：“古圣人也。”" }
      - { type: z, text: "孟子曰：周公，古之圣人也。" }
      - { type: j, text: "曰：“使管叔监殷，管叔以殷畔也，有诸？”" }
      - { type: z, text: "贾问有之否乎？" }
      - { type: j, text: "曰：“然。”" }
      - { type: z, text: "孟子曰：如是也。" }
      - { type: j, text: "曰：“周公知其将畔而使之与？”" }
      - { type: z, text: "贾问之也。" }
      - { type: j, text: "曰：“不知也。”" }
      - { type: z, text: "孟子曰：周公不知其将畔也。" }
      - { type: j, text: "“然则圣人且有过与？”" }
      - { type: z, text: "过，谬也。贾曰：圣人且犹有谬误。" }
      - { type: j, text: "曰：“周公弟也，管叔兄也，周公之过，不亦宜乎。" }
      - { type: z, text: "孟子以为周公虽知管叔不贤，亦必不知其将畔，周公惟管叔弟也，故爱之；管叔念周公兄也，故望之：亲亲之恩也，周公之此过谬，不亦宜乎！" }
      - { type: j, text: "且古之君子，过则改之；今之君子，过则顺之。古之君子，其过也如日月之食，民皆见之，及其更也，民皆仰之；今之君子，岂徒顺之，又从为之辞。”" }
      - { type: z, text: "古之所谓君子，真圣人、贤人、君子也。周公虽有此过，乃诛三监，作《大诰》，明敕庶国，是周公改之也。今之所谓君子，非真君子也，顺过饰非，或为之辞。孟子言此，以讥贾不能匡君，而欲以辞解之。“燕人畔”至“又从为之辞”。○正义曰：此章指言圣人亲亲，不文其过；小人顺非，以谄其上者也。“燕人畔，王曰：吾甚惭於孟子”者，言燕人皆离畔，不肯归齐王，齐王闻孟子与沈同言未尝劝王伐燕，今果不能得燕，乃曰：我甚惭耻而见於孟子。“陈贾曰：王无患焉，王自以为与周公孰仁且智”者，陈贾，齐国之大夫也，言於齐王，以为无用忧患、惭於孟子也。且王自以为与周公孰仁且智乎？贾欲以此解王，故问之以此。“王曰：恶是何言也”者，齐王乃叹曰：此是何言也？周公大圣人，安可得而及之。“曰：周公使管叔监殷，管叔以殷畔，知而使之，是不仁也；不知而使之，是不智也。仁、智，周公未之尽也，而况於王乎？贾请见而解之”者，言陈贾谓周公使管叔为三监於殷，管叔乃背畔於殷。周公知管叔有背畔之心，而复使为监，是周公不仁也；周公不知管叔将有背畔之心，而使之为监，是周公之不智也。仁与智，而周公大圣人也，尚未之能尽，而况於齐王乎？贾今请以此见孟子，为王解之。“见孟子，问曰：周公何人也”，贾遂见孟子，果以此说问於孟子，以谓周公是何等人也？“曰：古之大圣人也”，孟子答之，以为周公是古之大圣人也。“曰：使管叔监殷，管叔以殷畔也，有诸”，贾又问孟子，以谓周公使管叔为监於殷，管叔以殷而背畔之，有之否乎？“曰然”孟子答之，以是有之也。“曰：周公知其将畔而使之与”，贾又问之，以谓周公知管叔将欲背畔，故使之为监与？“曰：不知也”，孟子答之，以为周公不知管叔将背畔。“然则圣人且有过与”，贾又问之，如是则周公为古之大圣人，尚且有过失乎？“曰：周公弟也，管叔兄也，周公之过，不亦宜乎”孟子以为周公虽知管叔不贤，亦不能知其将有畔之心，周公惟管叔弟也，故爱之而使为监；管叔念是周公兄也，故亦望之：是则周公有是之过谬，不亦宜之也。以亲亲之故，不得不然耳。“且古之君子，过则改之”至“今之君子，又从为之辞”者，孟子又言古之君子，如周公虽有此过，然而乃能诛三监，作《大诰》，以明敕庶国，则周公故能改之也；今之君子，非真君子，有过则顺而不改。古之君子，其有过也，如日月之蚀焉，民皆得知而见之，及其更也，民皆得而仰望之；今之君子，岂徒顺其过而不改，又且从其有过，复作言辞以文饰其过耳：孟子所以言此者，以其欲讥陈贾不能匡正齐王之过，又从为此周公管叔之辞，顺其王之过而文之也。○注“燕人畔，王闻孟子与沈同言”。正义曰：此盖前段案《史记·世家》言之详矣。○注“诛三监，作《大诰》，明敕庶国”。○正义曰：案《尚书·大诰》篇云：武王崩，三监及淮夷叛，周公相成王，将黜殷，作《大诰》。孔安国云：“三监：管、蔡、商是也。言作《大诰》，以诰天下。”又案《史记》云：“周公奉成王命，兴师东伐，作《大诰》，遂诛管叔，杀武庚，放蔡叔，收殷馀民。”" }
      - { type: j, text: "孟子致为臣而归。" }
      - { type: z, text: "辞齐卿而归其室也。" }
      - { type: j, text: "王就见孟子曰：“前日愿见而不可得，（谓未来仕齐也。遥闻孟子之贤，而不能得见之。）得侍同朝，甚喜。" }
      - { type: z, text: "来就为卿，君臣同朝，得相见，故喜之也。" }
      - { type: j, text: "今又弃寡人而归，（今致为臣，弃寡人而归。）不识可以继此而得见乎？”" }
      - { type: z, text: "不知可以续今日之後，遂使寡人得相见否乎？" }
      - { type: j, text: "对曰：“不敢请耳，固所愿也。”" }
      - { type: z, text: "孟子对王，言不敢自请耳，固心之所愿也。孟子意欲使王继今当自来谋也。" }
      - { type: j, text: "他日，王谓时子曰：“我欲中国而授孟子室，养弟子以万锺，使诸大夫国人皆有所矜式，子盍为我言之？”" }
      - { type: z, text: "时子，齐臣也。王欲於国中而为孟子筑室，使教养一国君臣之子弟，与之万锺之禄。中国者，使学者远近均也。矜，敬也。式，法也。欲使诸大夫国人皆敬法其道。盍，何不也，谓时子何不为我言之於孟子，知肯就之否？" }
      - { type: j, text: "时子因陈子而以告孟子。" }
      - { type: z, text: "陈子，孟子弟子陈臻也。" }
      - { type: j, text: "陈子以时子之言告孟子，孟子曰：“然。夫时子恶知其不可也？如使予欲富，辞十万而受万，是为欲富乎？”" }
      - { type: z, text: "孟子曰：如是，夫时子安能知其不可乎？时子以我为欲富，故以禄诱我，我往者飨十万锺之禄，以大道不行，故去耳。今更当受万锺，是为欲富乎？距时子之言，所以有是云也。" }
      - { type: j, text: "季孙曰：“异哉！子叔疑。”" }
      - { type: z, text: "二子，孟子弟子也。季孙知孟子意不欲，而心欲使孟子就之，故曰：异哉，弟子之所闻也，子叔心疑惑之。亦以为可就之矣。" }
      - { type: j, text: "“使己为政，不用，则亦已矣。又使其子弟为卿。人亦孰不欲富贵？而独於富贵之中，有私龙断焉。" }
      - { type: z, text: "孟子解二子之异意疑心。曰：齐王使我为政，不用，则亦自止矣。今又欲以其子弟故，使我为卿，而与我万锺之禄。人亦谁不欲富贵乎？是犹独於富贵之中，有此私登龙断之类也，我则耻之。" }
      - { type: j, text: "古之为也，以其所有易其所无者，有司者治之耳。有贱丈夫焉，必求龙断而登之，以左右望而罔利，人皆以为贱，故从而征之。征商自此贱丈夫始矣。”" }
      - { type: z, text: "古者置有司，但治其争讼，不征税也。贱丈夫，贪人可贱者也。入则求龙断而登之，龙断，谓果断而高者也。左右占视望，见中有利，罔罗而取之，人皆贱其贪者也，故就征取其利。後世缘此，遂征商人。孟子言我苟贪万锺，不耻屈道，亦与此贱丈夫何异也。古者，谓周公以前，《周礼》有关市之征也。“孟子致为臣而归”至“自此贱丈夫始矣”。○正义曰：此章指言君子正身行道，道之不行，命也。不为利回，创业可继，是以君子以龙断之人为恶戒也。“孟子致为臣而归”，是孟子辞齐卿而归处於室也。“王就见孟子曰：前日愿见而不可得”至“不识可以继此而得见乎”，是齐王见孟子辞齐卿而归於室，乃就孟子之室而见孟子曰：前日未仕齐时，闻孟子之贤，愿见之，而不能得见，後得侍於我而为之卿，遂得同朝相见，故甚喜之。今乃又弃去寡人而归处於室，我不知可以继今日之後，而使寡人得相见否？故以此问孟子。孟子对曰“不敢请耳，固所愿也”，孟子意欲使王继今日之後，当自来就见，故云不请见，固我心之所愿也。“他日，王谓时子曰：我欲中国而授孟子室”至“盍为我言之”，时子，齐王之臣也，言自见孟子已往，他日齐王又谓其臣时子曰：我今欲以中国授孟子，为筑其室，教养一国之子弟，故赐予以万锺之禄，使其诸大夫与一国之人皆有所敬法，时子何不为我以此言说之。“时子因陈子而以告孟子”，陈子，陈臻也，是孟子弟子也。时子於是因陈臻而以齐王之言使陈臻告於孟子也。“陈子以时子之言告孟子”至“是为欲富乎”，是陈子乃以时子所告齐王之言而告於孟子，孟子乃答之曰：然如是也，夫时子又安知其有不可也？如使我欲富其禄，我以辞去十万之禄而受其万，是以为我欲其富乎？云“乎”者，是不为欲富也。孟子欲以此言距时子也。“季孙曰：异哉，子叔疑”，季孙、子叔二子皆孟子弟子也，季孙知孟子意不欲遂时子之言，而心尚欲孟子就之，故但言异哉，弟子之所闻也，子叔疑之，亦以为可就。“使己为政，不用，则亦已矣，又使其子弟为卿”至“有私龙断焉”者，孟子又言齐王使己为政之道，既以不得用，则我亦以辞之而止於其室矣；又欲以子弟之教，而使我为卿，以与我万锺之禄。人亦谁不欲其富贵乎？然以此者，是亦犹独於富贵之中，私登龙断之类也。以其耻之，所以言然。“古之为市也，以其所有易其所无者”至“自此贱丈夫始矣”者，孟子又言古之所以为市者，以其有无相贸易耳，有司者但治其争讼而不征税也，有贱丈夫，则必求丘龙果断之高者而登之，以左右占望，见市中有利，罔罗而取之，人皆以为贱丈夫焉，故後世亦从而征取其市中之税。以其所以征商之税於後世者，亦自此贱丈夫登龙断而罔市利为之始矣，故曰“故从而征之，征商自此贱丈夫始矣”。《周礼》有司关、司市，是有司者也。○注云“古者，谓周公前，《周礼》有关市之征”。正义曰：此盖前篇说之详矣，此不复说。" }
      - { type: j, text: "孟子去齐，宿於昼。有欲为王留行者，（昼，齐西南近邑也。孟子去齐欲归邹，至昼地而宿也。齐人之知孟子者，追送见之，欲为王留孟子行。）坐而言，不应，隐几而卧。" }
      - { type: z, text: "客危坐而言留孟子之言也，孟子不应答，因隐倚其几而卧也。" }
      - { type: j, text: "客不悦，曰：“弟子齐宿而後敢言，夫子卧而不听，请勿复敢见矣。”" }
      - { type: z, text: "齐，敬。宿，素也。弟子素持敬心来言，夫子慢我，不受我言。言而遂起，退欲去，请绝也。" }
      - { type: j, text: "曰：“坐！我明语子：（孟子止客曰：且坐，我明告语子。）昔者鲁缪公无人乎子思之侧，则不能安子思；泄柳、申详无人乎缪公之侧，则不能安其身。" }
      - { type: z, text: "往者鲁缪公尊礼子思，子思以道不行则欲去。缪公常使贤人往留之，说以方且听子为政，然则子思复留。泄柳、申详亦贤者也，缪公尊之不如子思，二子常有贤者在缪公之侧劝以复之，其身乃安矣。" }
      - { type: j, text: "子为长者虑，而不及子思。子绝长者乎？长者绝子乎？”" }
      - { type: z, text: "长者，老者也。孟子年老，故自称长者。言子为我虑，不如子思时贤人也，不劝王使我得行道，而但劝我留，留者何为哉？此为子绝我乎？又我绝子乎？何为而愠恨也。“孟子去齐”至“绝子乎”。○正义曰：此章指言惟贤能安贤，智能知微，以愚喻智，道之所以乖也。“孟子去齐，宿於昼，有欲为王留行”者，昼，齐之近邑也，言孟子去齐欲归邹，至昼而宿，齐人见之，有欲为王留行者也。“坐而言，不应，隐几而卧”，言为王留行者，危坐而说留孟子之行，言孟子乃隐倚其几，但卧而不应答也。“客不悦，曰：弟子齐宿而後敢言，夫子卧而不听，请勿复敢见矣”，客，为王留行者也。齐，敬也。宿，素也。言客见孟子不应答其言，但隐几而卧焉，遂欲退，乃曰：弟子素齐敬其心而後方敢言留夫子之行，夫子今乃卧而不听其言，自今请绝，於此後勿复更敢见夫子矣。“曰：坐，我明语子”，孟子遂止客且坐，言我分明言告於子。云自昔缪公至“长者绝子乎”，是皆明告之言也。言往日鲁国缪公无人於子思之侧以导达其意，则不能安子思；泄柳、申详无人於鲁缪公之侧以称誉其贤，则泄柳、申详不能安其身。以其子思之於缪公，师道也，非求容者也，故缪公无人於子思之侧，则不能安子思；泄柳、申详之於缪公，臣道也，则求容者也，故无人於缪公之侧，则不能安其身。今孟子所以言此者，是谓齐之士不能为王谋安於孟子未去之前，逮至出昼，然後方为留行，此所以隐几卧而不答也。齐之留行之士不知以此，但以为孟子不应，遂不悦，而请勿复见。如此，是留行之士不以安子思而谋安孟子，但请勿复见为言，以其自绝於孟子矣。故孟子所以言：子为长者虑，而不及於子思，是子绝其长者乎，是长者绝子矣。以其不以安子思而谋安孟子於未去之前，是为孟子虑者，不及子思，特欲为泄柳、申详之所为耳。故孟子所以有是言之，以晓其所以隐几而卧不应之意也。长者，孟子以年已之溃自称为长者也。○注“昼，齐西南近邑”。○正义曰：盖以邹在鲁，而鲁又在齐之西南上，孟子去齐归邹，至昼而宿，是知昼之地为齐之西南近邑者也，故云近邑。" }
      - { type: j, text: "孟子去齐，尹士语人曰：“不识王之不可以为汤、武，则是不明也。识其不可，然且至，则是干泽也。千里而见王，不遇故去，三宿而後出昼，是何濡滞也！士则兹不悦。”" }
      - { type: z, text: "尹士，齐人也。干，求也。泽，禄也。尹士与论者言之，云孟子不知，则为求禄。濡滞，淹久也。既去，近留於昼三日，怪其淹久，故云士於此事则不悦也。" }
      - { type: j, text: "高子以告。" }
      - { type: z, text: "高子亦齐人，孟子弟子，以尹士之言告孟子也。" }
      - { type: j, text: "曰：“夫尹士恶知予哉？千里而见王，是子所欲也。不遇故去，岂予所欲哉！予不得已也。" }
      - { type: z, text: "孟子曰，夫尹士安能知我哉？我不得已而去耳，何汲汲而驱驰乎！" }
      - { type: j, text: "予三宿而出昼，於予心犹以为速，王庶几改之。王如改诸，则必反予。" }
      - { type: z, text: "我自谓行速疾矣，冀王庶几能反覆招还我矣。" }
      - { type: j, text: "夫出昼而王不予追也，予然後浩然有归志。" }
      - { type: z, text: "浩然，心浩浩有远志也。" }
      - { type: j, text: "予虽然，岂舍王哉？王由足用为善，王如用予，则岂徒齐民安？天下之民举安。王庶几改之，予日望之。" }
      - { type: z, text: "孟子以齐大国，知其可以行善政，故恋恋望王之改而反之，是以安行也。岂徒齐民安？言君子达则兼善天下也。" }
      - { type: j, text: "予岂若是小丈夫然哉！谏於其君而不受，则怒，悻悻然见於其面，去则穷日之力而後宿哉！”" }
      - { type: z, text: "我岂若狷狷急小丈夫，恚怒其君而去，极日力而宿，惧其不远者哉。《论》曰：“悻悻然小人哉。”言已志大，在於济一世之民，不为小节也。" }
      - { type: j, text: "尹士闻之曰：“士诚小人也！”" }
      - { type: z, text: "尹士闻义则服。“孟子去齐”至“士诚小人也”。○正义曰：此章指言大德洋洋，介士察察，贤者志其大者，不贤者志其小者也，此之谓也。“孟子去齐”者，言孟子去齐而归邹也。“尹士语人曰”至“士则兹不悦”，尹士，齐人也，尹士见孟子去齐而宿於昼，乃语人曰：不知齐王不可以为汤、武之王，则是孟子蒙昧而不明鉴也；知齐王不可为汤、武之王，然且自邹至齐而为仕，则是孟子干求其禄也。今自千里之远而见齐王，不遇不行其道，故复去而归。然而三宿而後方出昼而行，是何其濡滞淹久也。我则以此不悦之也，“高子以告”，高子亦齐人，为孟子弟子也。高子以此尹士语人之言而告於孟子。“曰：夫尹士恶知予哉”至“而後宿哉”，孟子答高子，以为夫尹士者，安知我之志哉！我千里而见王，是我欲行道也。不遇於齐王，不得行其道，故去，岂我心之所欲哉！我不得已而去之矣，我三宿而後出昼邑而行，於我心尚以为急速也。齐王如能改之，使我得行其道，则必反留我回耳。夫出昼邑，至三宿而齐不我追而还齐国，我然後浩浩然有归志也，我虽然有浩然归之之志，然而岂肯舍去王哉？王犹可足用为之善政，王如用我，则岂徒使齐国之民安泰，天下之民亦皆安泰矣。王庶几能改而反我，我日常望之於王矣。我岂若狷狷急小丈夫，恚怒其君而去，为其谏於君而不受，则悻悻然心有所怒而见於面容，去则极日力而後方止宿哉！孟子如此，所以云然也。“尹士闻之曰：士诚小人也”，尹士闻孟子言之以此，故服其义，而言於孟子曰：士实小人也。以其不能知孟子之意，有如此矣。" }
      - { type: j, text: "孟子去齐，充虞路问曰：“夫子若不豫色然。前日虞闻诸夫子曰：‘君子不怨天，不尤人。’”" }
      - { type: z, text: "路，道也。於路中问也。充虞谓孟子去齐有恨心，颜色故不悦也。" }
      - { type: j, text: "曰：“彼一时，此一时也。五百年必有王者兴，其间必有名世者。由周而来，七百有馀岁矣，以其数则过矣，以其时考之，则可矣。”" }
      - { type: z, text: "彼时前圣贤之出，是其时也，今此时亦是其一时也。五百年王者兴，有兴王道者也。名世，次圣之才，物来能名，正於一世者，生於圣人之间也。七百有馀岁，谓周家王迹始兴，大王、文王以来，考验其时，则可有也。" }
      - { type: j, text: "夫天未欲平治天下也，如欲平治天下，当今之世，舍我其谁也？吾何为不豫哉。”" }
      - { type: z, text: "孟子自谓能当名世之士，时又值之，而不得施。此乃天自未欲平治天下耳，非我之愆，我固不怨天，何为不悦豫乎？是故知命者不忧不惧，与天消息而已矣。“孟子去齐，充虞路问曰”至“吾何为不豫哉”。○正义曰：此章指言圣贤兴作，与天消息，天非人不因，人非天不成，是故知命者不忧不惧也。“孟子去齐，充虞路问曰”至“不尤人”，言孟子归邹，弟子充虞於路中问孟子曰：夫子若有不悦豫之颜色，然前日虞闻夫子有言，君子之人，凡於事不怨恨於天，不见过於人也。“曰：彼一时，此一时也”至“吾何为不豫哉”，孟子答充虞，以谓彼时圣贤之所出，是其时也，此时今时，亦是其一时也。五百年之後，必有王者兴，为於其间亦必名世大贤者，今自周兴，大王、文王以来，已有七百有馀岁矣，以其年数推之，则过於五百年矣，以其时考之，而其时亦可有也。今天自未欲平治天下也，如天欲使平治天下，则当今之世，舍我其谁哉？此孟子所以归於天命，道行与不行，皆未尝有不悦之色也，故曰“吾何为不豫哉”。盖孟子所以言此者，以其自谓能当名世之士，而时又值不得施尔。" }
      - { type: j, text: "孟子去齐，居休。公孙丑问曰：“仕而不受禄，古之道乎？”" }
      - { type: z, text: "休，地名。丑问古人之道，仕而不受禄邪？怪孟子於齐不受其禄也。" }
      - { type: j, text: "曰：“非也。於崇，吾得见王。退而有去志，不欲变，故不受也。" }
      - { type: z, text: "崇，地名。孟子言不受禄，非古之道。於崇，吾始见齐王，知其不能纳善。退出，志欲去矣。不欲即去，若为变诡，见非太甚，故且宿留。心欲去，故不复受其禄也。" }
      - { type: j, text: "继而有师命，不可以请；久於齐，非我志也。”" }
      - { type: z, text: "言我本志欲速去，继见之後，有师旅之命，不得请去，故使我久而不受禄耳。久，非我本志也。“孟子去齐”至“非我志也”。○正义曰：此章指言禄以食功，志以率事，无其事而食其禄，君子不由也。“孟子去齐，居休”，休乃地名也，言孟子去齐，乃居於休之地，盖齐邑下之地也。“公孙丑问曰：仕而不受禄，古之道乎”，公孙丑问孟子曰：夫为仕而不受爵禄，古之道诚然乎？丑以其怪孟子於齐不受禄，故以此问之。“曰：非也。於崇吾得见王”至“非我志也”者，孟子答之曰：我非不受禄也，亦非古之道如此也。然我於崇之地，我始得见於齐王，知王不能纳善，故退而有去之心。又其不欲遽变为苟去，故於禄有所不受也。无他，以其道不行，不敢无功而受禄也。已既去，而齐王续以宾师之命而礼貌之，故由足为善，遂不敢请去，是以久留於齐，非我之志也，但不得已而已矣。" }
