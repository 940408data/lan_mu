# 周易正義卷六（孔穎達疏）：j 為經文＋王弼注，z 為正義疏文。
sections:
  - id: juan6
    name: 卷六
    blocks:
      - { type: j, text: "離下震上。豐：亨，王假之。大而亨者，王之所至。" }
      - { type: z, text: "正義曰：“豐，亨”者，“豐”，卦名也，《彖》及《序卦。皆以“大”訓“豐”也，然則豐者，多大之名，盈足之義，財多德大，故謂之為豐。德大則無所不容，財多則無所不齊。無所擁礙謂之為“亨”，故曰“豐，亨”。“王假之”者，假，至也，豐亨之道，王之所尚，非有王者之德，不能至之，故曰“王假之”也。" }
      - { type: j, text: "勿憂，宜日中。豐之為義，闡弘微細，通夫隱滯者也，為天下之主，而令微隱者不亨，憂未巳也，故至“豐亨”，乃得勿憂也。用夫豐亨不憂之德，宜處天中，以偏照者也，故曰“宜日中”也。" }
      - { type: z, text: "正義曰：勿，無也。王能至於豐亨，乃得無復憂慮，故曰“勿憂也”。用夫豐亨無憂之德，然後可以君臨萬國，遍照四方，如日中之時，遍照天下，故曰“宜日中”也。" }
      - { type: j, text: "《彖》曰：豐，大也。音闡大之大也。" }
      - { type: z, text: "“彖曰：豐，大也”。○正義曰：“豐，大也”者，釋卦名，正是弘大之義也。○注“音闡大之大也”。○正義曰：闡者，弘廣之言，凡物之大，其有二種，一者自然之大，一者由人之闡弘使大。“豐”之為義，既闡弘微細，則豐之稱大，乃闡大之大，非自然之大，故音之也。" }
      - { type: j, text: "明以動，故豐。王假之，尚大也。大者王之所尚，故至之也。" }
      - { type: z, text: "正義曰：“動故豐”者，此就二體，釋卦得名，為豐之意，動而不明，未能光大資明以動，乃能致豐，故曰“明以動故豐”也。“王假之，尚大也”者，豐大之道，王所崇尚，所以王能至之，以能尚大故也。" }
      - { type: j, text: "“勿憂，宜日中”，宜照天下也。以勿憂之德，故宜照天下也。" }
      - { type: z, text: "正義曰：日中之時，遍照天下，王無憂慮，德乃光被，同於日中之盈，故曰“勿憂，宜日中，宜照天下也”。" }
      - { type: j, text: "日中則昃，月盈則食，天地盈虛，與時消息，而況於人乎？況於鬼神乎？豐之為用，困於昃食者也。施於未足則尚豐，施於巳盈則方溢，不可以為常，故具陳消息之道者也。" }
      - { type: z, text: "正義曰：此孔子因豐設戒，以上言王者以豐大之德，照臨天下，同於日中。然盛必有衰，自然常理。日中至盛，過中則昃；月滿則盈，過盈則食。天之寒暑往來，地之陵谷遷貿，盈則與時而息，虛則與時而消。天地日月，尚不能久，況於人與鬼神，而能長保其盈盛乎？勉令及時脩德，仍戒居存慮亡也。此辭先陳天地，後言人、鬼、神者，欲以輕譬重，亦先尊後卑也。而日月先天地者，承上“宜日中”之下，遂言其昃食，因舉日月以對之，然後並陳天地，作文之體也。" }
      - { type: j, text: "《象》曰：雷電皆至，豐。君子以折獄致刑。文明以動，不失情理也。" }
      - { type: z, text: "正義曰：“雷電皆至，豐”者，雷者，天之威動，電者，天之光耀。雷電俱至，則威明備，足以為豐也。“君子以折獄致刑”者，君子法象天威而用刑罰，亦當文明以動，折獄斷決也。斷決獄訟，須得虛實之情；致用刑罰，必得輕重之中。若動而不明，則淫濫斯及，故君子象於此卦而折獄致刑。" }
      - { type: j, text: "初九：遇其配主，雖旬無咎，往有尚。處豐之初，其配在四，以陽適陽，以明之動，能相光大者也。旬，均也。雖均無咎，往有尚也。初、四俱陽爻，故曰“均”也。" }
      - { type: z, text: "正義曰：“遇其配主”者，豐者，文明必動，尚乎光大者也。初配在四，俱是陽爻以陽適陽以明之動能相光大者，也。故曰：“遇其配主也。雖旬無咎往有尚者，旬均也，俱是陽爻，謂之為均，非是陰陽相應，嫌其有咎，以其能相光大，故雖均，可以無咎，而往有嘉尚也，故曰“雖均無咎，往有尚”也。" }
      - { type: j, text: "《象》曰：“雖旬無咎”，過旬災也。過均則爭，交斯叛也。" }
      - { type: z, text: "“象曰”至“災也”。○正義曰：“過旬災光”者，言勢若不均，則相傾奪。既相傾奪，則爭競乃興，而相違背，災咎至焉，故曰“過旬災也”。○注“過均”至“叛也”。○正義曰：初，四應配，謂之為交，勢若不均，則初、四之相交，於斯乖叛矣。" }
      - { type: j, text: "六二：豐其蔀，日中見鬥。往得疑疾，有孚發若，吉。蔀，覆曖，鄣光明之物也。處明動之時，不能自豐以光大之德，既處乎內，而又以陰居陰，所豐在蔀，幽而無睹者也，故曰“豐其蔀，日中見鬥”也。日中者，明之盛也；鬥見者，闇之極也。處盛明而豐其蔀，故曰“日中見鬥”。不能自發，故往得疑疾。然履中當位，處闇不邪，有孚者也。若，辭也。有孚可以發其志，不困於闇，故獲吉也。" }
      - { type: z, text: "“六二豐其蔀”至“有孚發若吉”。○正義曰：“豐其蔀”者，二以陰居遙又處於內，幽闇無所睹見，所豐在於覆蔽，故曰“豐其蔀”也。蔀者，覆曖，障光明之物也。“日中見鬥”者，二居離卦之中，如日正中，則至極盛者也。處日中盛明之時，而鬥星顯見，是二之至闇，使鬥星見明者也。處光大之世，而為極闇之行，譬日中而鬥星見，故曰“日中見鬥”也。二、五俱陰，二巳見鬥之闇，不能自發，以自求於五，往則得見疑之疾，故曰“往得疑疾”也。然居中履正，處闇不邪，是有信者也。有信以自發其志，不困於闇，故獲吉也。故曰“有孚發若，吉”也。" }
      - { type: j, text: "《象》曰：“有孚發若”，信以發志也。" }
      - { type: z, text: "正義曰：信以發志者，雖處幽闇而不為邪，是有信以發其豐大之志，故得吉也。" }
      - { type: j, text: "九三：豐其沛，日中見沬。折其右肱，無咎。沛，幡幔，所以御盛光也。沬，微昧之明也。應在上六，志在乎陰，雖愈乎以陰處陰，亦未足以免於闇也。所豐在沛，日中則見沬之謂也。施明，則見沬而巳，施用，則折其右肱，故可以自守而巳，未足用也。" }
      - { type: z, text: "正義曰：“豐其沛，日中見沬”者，沛，幡幔，所以御盛光也。沬，微昧之明也，以九三應在上六，志在乎陰，雖愈於六二以陰處陰，亦未見免於闇也，是所以“豐在沛，日中見沬”。夫處光大之時，而豐沛見沬，雖愈於豐蔀見鬥，然施於大事，終不可用。假如折其右肱，自守而巳，乃得無咎，故曰“折其右肱，無咎”。" }
      - { type: j, text: "《象》曰：豐其沛，不可大事也。明不足也。" }
      - { type: z, text: "正義曰：“不可大事”者，當光大之時，可為大事，明不足，故不可為大事也。" }
      - { type: j, text: "折其右肱，終不可用也。雖有左在，不足用也。" }
      - { type: z, text: "正義曰：“終不可用”者，凡用事在右肱，右肱既折，雖有左在，終不可用也。" }
      - { type: j, text: "九四：豐其蔀，日中見鬥。遇其夷主，吉。以陽居陰，豐其蔀也。得初以發，夷主吉也。" }
      - { type: z, text: "正義曰：“豐其蔀”者，九四以陽居陰，闇同於六二，故曰“豐其蔀”也。“日中見鬥，遇其夷主，吉”者，夷，平也。四應在初，而同是陽爻，能相顯發，而得其吉，故曰“遇其夷主，吉”也。言四之與初交相為主者，若賓主之義也。若據初適四，則以四為主，故曰“遇其配主”。自四之初，則以初為主，故曰“遇其夷主”也。二陽體敵，兩主均平，故初謂四為“旬”，而四謂初為“夷”也。" }
      - { type: j, text: "《象》曰：“豐其蔀”，位不當也。“日中見鬥”，幽不明也。“遇其夷主”，吉行也。" }
      - { type: z, text: "正義曰：“位不當”者，止謂以陽居陰，而位不當，所以豐蔀而闇者也。“幽不明也”者，日中盛則反而見鬥，以譬當光大而居陰，是應明而幽闇不明也。“吉行也”者，處於陰位，為闇巳甚，更應於陰，無由獲吉，猶與陽相遇，故得吉行也。" }
      - { type: j, text: "六五：來章有慶譽，吉。以陰之質，來適尊陽之位，能自光大，章顯其德，獲慶譽也。" }
      - { type: z, text: "正義曰：六五處豐大之世，以陰柔之質，來適尊陽之位，能自光大，章顯其德，而獲慶善也。故曰“來章有慶譽，吉”也。" }
      - { type: j, text: "《象》曰：六五之吉，有慶也。" }
      - { type: z, text: "正義曰：“有慶也”者，言六五以柔處尊，履得其中，故致慶譽也。" }
      - { type: j, text: "上六：豐其屋，蔀其家，闚其戶，闃其無人。三歲不覿，兇。屋，藏蔭之物，以陰處極而最在外，不履於位，深自幽隱，絕跡深藏者也。既豐其屋，又蔀其家，屋厚家覆，闇之甚也。雖闚其戶，闃其無人，棄其所處，而自深藏也。處於明動尚大之，時而深自幽隱，以高其行；大道既濟，而猶不見，隱不為賢，更為反道，兇其宜也。三年，豐道之成。治道未濟，隱猶可也；既濟而隱，是以治為亂者也。" }
      - { type: z, text: "“上六豐其屋”至“不覿”。○正義曰：屋者，藏蔭隱蔽之物也。上六，以陰處陰，極以處外，不履於位，是深自幽隱，絕跡深藏也。事同豐厚於屋者也。既豐厚其屋，而又覆鄣其家，屋厚家闇，蔽鄣之甚也。雖闚視其戶，而闃寂無人，棄其所處，而自深藏也。處於豐大之世，隱不為賢。治道未濟，隱猶可也；三年豐道巳成，而猶不見，所以為兇，故曰“豐其屋，蔀其家，闚其戶，闃其無人，三歲不覿，兇”。" }
      - { type: j, text: "《象》曰：“豐其屋”，天際翔也。翳光最甚者也。" }
      - { type: z, text: "正義曰：“天祭翔也”者，如鳥之飛翔於天際，言隱翳之深也。" }
      - { type: j, text: "“闚其戶，闃其無人”，自藏也。可以出而不出，自藏之謂也，非有為而藏。不出戶庭，失時致兇，況自藏乎？兇其宜也。" }
      - { type: z, text: "正義曰：“自藏也”者，言非有為而當自藏，可以出而不出，無事自為隱藏也。" }
      - { type: j, text: "艮下離上。旅：小亨，旅貞吉。不足全夫貞吉之道，唯足以為旅之貞吉，故特重曰“旅，貞吉”也。" }
      - { type: z, text: "正義曰：旅者，客寄之名，羈旅之稱，失其本居，而寄他方，謂之為旅。既為羈旅，苟求僅存，雖得自通，非甚光大，故《旅》之為義，小亨而巳，故曰“旅，小亨”。羈旅而獲小亨，是旅之正吉，故曰“旅，貞吉”也。" }
      - { type: j, text: "《彖》曰：“旅，小亨”，柔得中乎外，而順乎剛，止而麗乎明，是以“小亨，旅貞吉”也。夫物失其主則散，柔乘於剛則乖。既乖且散，物皆羈旅，何由得小亨而吉乎？夫陽為物長，而陰皆順陽。唯六五乘剛，而復得中乎外，以承於上，陰兇順陽，不為乖逆。止而麗明，動不履妄，雖不及剛得尊位，恢弘大通，是以小亨。令附旅者，不失其正，得其所安也。" }
      - { type: z, text: "“《彖》曰”至“貞吉也”。○正義曰：“旅，小亨”者，舉《經》文也。柔得中乎外而順乎剛，止而麗乎明，是以“小亨”。“旅貞吉”者，此就六五及二體，釋旅得亨貞之義，柔處於外，弱而為客之象，若所託不得其主，得主而不能順從，則乖逆而離散，何由得自通而貞吉乎？今柔雖處外而得中順陽，則是得其所託，而順從於主。又止而麗明，動不履妄，故能於寄旅之時，得通而正，不失所安也。" }
      - { type: j, text: "旅之時義大矣哉！旅者大散，物皆失其所居之時也。鹹失其居，物願所附，豈非知者有為之時？" }
      - { type: z, text: "正義曰：此歎美寄旅之時，物皆失其所居。若能與物為附，使旅者獲安，非小才可濟，惟大智能然。故曰“旅之時義大矣哉”。" }
      - { type: j, text: "《象》曰：山上有火，旅。君子以明，慎用刑而不留獄。止以明之，刑戮詳也。" }
      - { type: z, text: "正義曰：火在山上，逐草而行，勢不久留，故為旅象。又上下二體，艮止離明，故君子象此，以靜止明察，審慎用刑，而不稽留獄訟。" }
      - { type: j, text: "初六：旅瑣瑣，斯其所取災。最處下極，寄旅不得所安，而為斯賤之役，所取致災，志窮且困。" }
      - { type: z, text: "正義曰：“旅瑣瑣，斯其所取災”者，瑣瑣者，細小卑賤之貌也。初六當旅之時，最處下極，是寄旅不得所安，而為斯卑賤之役。然則為斯卑賤勞役，由其處於窮下，故致此災，故曰“旅瑣瑣斯其所取災”也。" }
      - { type: j, text: "《象》曰：“旅瑣瑣”，志窮災也。" }
      - { type: z, text: "正義曰：“志窮災”，志意窮困，自取此災也。" }
      - { type: j, text: "六二：旅即次，懷其資，得童僕貞。次者，可以安行旅之地也。懷，來也。得位居中，體柔奉上，以此寄旅，必獲次舍。懷來資貨，得童僕之所正也。旅不可以處盛，故其美盡於童僕之正也。過斯以往，則見害矣。童僕之正，義足而巳。" }
      - { type: z, text: "正義曰：“旅即次，懷其資，得童僕貞”者，得位居中，體柔承上，以此而為寄旅，必為主君所安，旅得次舍，懷來資貨，又得童僕之正，不同初六賤役，故曰“旅即次，懷其資，得童僕貞”。" }
      - { type: j, text: "《象》曰：“得童僕貞”，終無尤也。" }
      - { type: z, text: "正義曰：“終無尤”者，旅不可以處盛，盛則為物所害。今惟正於童僕，則終保無咎也。" }
      - { type: j, text: "九三：旅焚其次，喪其童僕，貞厲。居下體之上，與二相得，以寄旅之身而為施下之道，與萌侵權，主之所疑也，故次焚僕喪，而身危也。" }
      - { type: z, text: "“九三旅焚其次”至“貞厲”。○正義曰：“旅焚其次，喪其童僕，貞厲”者，九三居下體之上，下據於二，上無其應，與二相得，是欲自尊而惠施於下也。以羈旅之身而為惠下之道，是與萌侵權，為主君之所疑也。為君主所疑，則被黜而見害，故焚其次舍，喪其童僕之正而身危也。○注“與萌”至“所疑也”。正義曰：“與萌侵權”者，言與得政事之萌，漸侵奪主君之權勢，若齊之田氏，故為主所疑也。" }
      - { type: j, text: "《象》曰：“旅焚其次”，亦以傷矣。以旅與下，其義喪也。" }
      - { type: z, text: "正義曰：“亦以傷矣”者，言失其所安，亦可悲傷也。“其義喪”者，言以旅與下，理是喪亡也。" }
      - { type: j, text: "九四：旅於處，得其資斧，我心不快。斧所以斫除荊棘，以安其舍者也。雖處上體之下，不先於物，然而不得其位，不獲平坦之地，客於所處，不得其次，而得其資斧之地，故其心不快也。" }
      - { type: z, text: "正義曰：“旅於處，得其資斧，我心不快”者，九四處上體之下，不同九三之自尊，然不得其位，猶寄旅之人，求其次舍，不獲平坦之所，而得用斧之地。言用斧除荊棘，然後乃處，故曰“旅於處，得其資斧”也。求安處而得資斧之地，所以其心不快也。" }
      - { type: j, text: "《象》曰：“旅於處”，未得位也。“得其資斧”，心未快也。" }
      - { type: j, text: "六五：射雉一矢，亡。終以譽命。射雉以一矢，而復亡之，明雖有雉，終不可得矣。寄旅而進，雖處於文明之中，居於貴位，此位終不可有也。以其能知禍福之萌，不安其處以乘其下，而上承於上，故終以譽而見命也。" }
      - { type: z, text: "“六五射雉”至“以譽命”。○正義曰：“射雉一矢亡，終以譽命”者，羈旅不可以處盛位，六五以羈旅之身，進居貴位，其位終不可保，譬之射雉，惟有一矢，射之而復亡失其矢，其雉終不可得，故曰“射雉一矢亡”也。然處文明之內，能照禍福之幾，不乘下以侵權，而承上以自保，故得終以美譽而見爵命，故曰“終以譽命”也。" }
      - { type: j, text: "《象》曰：“終以譽命”，上逮也。" }
      - { type: z, text: "正義曰：“上逮”者，逮，及也，以能承及於上，故得“終以譽命”也。" }
      - { type: j, text: "上九：鳥焚其巢，旅人先笑後號咷。喪牛於易，兇。居高危而以為宅，巢之謂也。客旅得上位，故先笑也。以旅而處於上極，眾之所嫉也。以不親之身而當被害之地，必兇之道也，故曰“後號咷”。牛者，稼穡之資。以旅處上，無所同嫉，故“喪牛於易”，不在於難。物莫之與，危而不扶，喪牛於易，終莫之聞。莫之聞，則傷之者至矣。" }
      - { type: z, text: "正義曰：“鳥焚其巢，旅人先笑後號咷，喪牛於易，兇”者，最居於上，如鳥之巢，以旅處上，必見傾奪，如鳥巢之被焚，故曰“鳥焚其巢”也。客得上位，所以“先笑”。兇害必至，故“後號咷”。無所同嫉，喪其稼穡之資，理在不難，故曰“喪牛於易”。物莫之與，則傷之者至矣，故曰“兇”也。" }
      - { type: j, text: "《象》曰：以旅在上，其義焚也。“喪牛於易”，終莫之聞也。" }
      - { type: z, text: "正義曰：“終莫之聞也”者，眾所同疾，危而不扶，至於喪牛於易，終無以一言告之，使聞而悟也。" }
      - { type: j, text: "巽下巽上。巽：小亨。全以巽為德，是以小亨也。上下皆巽，不違其令，命乃行也。故申命行事之時，上下不可以不巽也。" }
      - { type: z, text: "正義曰“巽者卑順之名。《說卦》云：“巽，入也。”蓋以巽是象風之卦，風行無所不入，故以“入”為訓。若施之於人事，能自卑巽者，亦無所不容。然巽之為義，以卑順為體，以容入為用，故受“巽”名矣。上下皆巽，不為違逆，君唱臣和，教令乃行，故於重巽之卦，以明申命之理。雖上下皆巽，命令可行，然全用卑巽，則所通非大，故曰“小亨”。" }
      - { type: j, text: "利有攸往。巽悌以行，物無距也。" }
      - { type: z, text: "正義曰：巽悌以行，物無違距，故曰“利有攸往”。" }
      - { type: j, text: "利見大人。大人用之，道愈隆。" }
      - { type: z, text: "正義曰：但能用巽者，皆無往不利，然大人用巽，其道愈隆，故曰“利見大人”，明上下皆須用巽也。" }
      - { type: j, text: "《彖》曰：重巽以申命。命乃行也。未有不巽而命行也。" }
      - { type: z, text: "正義曰：此卦以卑巽為名，以申命為義。故就二體上下皆巽，以明可以申命也。上巽能接於下，下巽能奉於上，上下皆巽，命乃得行，故曰“重巽以申命也”。" }
      - { type: j, text: "剛巽乎中正而志行。以剛而能用巽，處乎中正，物所與也。" }
      - { type: z, text: "正義曰：“剛巽乎中正而志行”者，雖上下皆巽，若命不可從，則物所不與也。故又因二五之爻，剛而能巽，不失其中，所以志意得行，申其命令也。" }
      - { type: j, text: "柔皆順乎剛。明無違逆，故得小亨。" }
      - { type: z, text: "“柔皆順乎剛”。○正義曰：“柔皆順乎剛”者，剛雖巽為中正，柔若不順乎剛，何所申其命乎？故又就初、九各處卦下，柔皆順剛，無有違逆，所以教命得申，成小亨以下之義也。○注“明無違”至“得小亨”。○正義曰：案《彖》並舉“小亨，利有攸往，利見大人”以結之，則柔皆順剛之意，不事釋“小亨”二字，而《注》獨言“明無違逆，故得小亨”者，褚氏云：“夫獻可替否，其道乃弘：柔皆順剛，非大通之道，所以文王系‘小亨’之辭，孔子致‘皆順’之釋。”案：王註上下卦之體，皆以巽言之，柔不違剛，正是巽義，故知“皆順”之言，通釋諸辭也。" }
      - { type: j, text: "是以“小亨，利有攸往，利見大人”。" }
      - { type: z, text: "正義曰：“是以小亨”以下，釋《經》結也。" }
      - { type: j, text: "《象》曰：隨風，巽。君子以申命行事。" }
      - { type: z, text: "正義曰：“隨風，巽”者，兩風相隨，故曰“隨風”，風既相隨，物無不順，故曰“隨風，巽”。“君子以申命行事”者，風之隨至，非是令初，故君子訓之以申命行事也。" }
      - { type: j, text: "初六：進退，利武人之貞。處令之初，未能服令者也。故進退也。成命齊邪，莫善武人，故“利武人之貞”以整之。" }
      - { type: z, text: "正義曰：初六，處令之初，法未宣，著體於柔巽，不能自決，心懷進退，未能從令者也。成命齊邪，莫善威武，既未能從令，則宜用武人之正，以整齊之，故曰“進退，利武人之貞”也。" }
      - { type: j, text: "《象》曰：“進退”，志疑也。巽順之志，進退疑懼。" }
      - { type: z, text: "正義曰：“志疑”者，欲從之，則未明其令；欲不從，則懼罪及巳，志意懷疑，所以進退也。" }
      - { type: j, text: "“利武人之貞”，志治也。" }
      - { type: z, text: "正義曰：“志治也”者，武非行令所宜，而言利武人者，志在使人從治，故曰：“利武人”。其猶《蒙卦》初六《象》曰“利用刑人，以正法也”。" }
      - { type: j, text: "九二：巽在床下，用史巫紛若，吉，無咎。處巽之中，既在下位，而復以陽居陰，卑巽之甚，故曰：“巽在床下”也。卑甚失正，則入於咎過矣。能以居中而施至卑於神祗，而不用之於威勢，則乃至於紛若之吉，而亡其過矣。故曰“用史巫紛若，吉，無咎”也。" }
      - { type: z, text: "正義曰：“巽在床下”者，九二處巽下體，而復以陽居陰，卑巽之甚，故曰“巽在床下”。“用史巫紛若，吉，無咎”者，史謂祝史，巫謂巫覡，並是接事鬼神之人也。紛若者，盛多之貌。卑甚失正，則入於過咎。人有威勢，易為行恭；神道無形，多生怠慢。若能用居中之德，行至卑之道，用之於神祗，不行之於威勢，則能致之於盛多之吉，而無咎過，故曰“用史巫紛若，吉，無咎”也。" }
      - { type: j, text: "《象》曰：“紛若”之“吉”，得中也。" }
      - { type: z, text: "正義曰：“得中”者，用卑巽於神祗，是行得其中，故能致紛若之吉也。" }
      - { type: j, text: "九三：頻巽，吝。頻，頻蹙，不樂而窮，不得巳之謂也。以其剛正而為四所乘，志窮而巽，是以吝也。" }
      - { type: z, text: "正義曰：“頻巽，吝”者，頻者，頻蹙憂戚之容也，九三體剛居正，為四所乘，是志意窮屈，不得申遂也。既處巽時，只得受其屈辱也，頻蹙而巽，鄙吝之道，故曰“頻巽，吝”也。" }
      - { type: j, text: "《象》曰：“頻巽”之“吝”，志窮也。" }
      - { type: z, text: "正義曰：“志窮”者，志意窮屈，所以為吝也。" }
      - { type: j, text: "六四：悔亡，田獲三品。乘剛，悔也，然得位承五，卑得所奉。雖以柔乘剛，而依尊履正，以斯行命，必能獲強暴，遠不仁者也。獲而有益，莫善三品，故曰“悔亡，田獲三品”。一曰乾豆，二曰賓客，三曰充君之庖。" }
      - { type: z, text: "正義曰：“悔亡，田獲三品”者，六四有乘剛之悔，然得位承尊，得其所奉，雖以柔乘剛，而依尊履正，以斯行命，必能有功，取譬田獵，能獲而有益，莫善三品，所以得悔亡。故曰“悔亡，田獲三品”也。三品者，一曰乾豆，二曰賓客，三曰充君之庖廚也。" }
      - { type: j, text: "《象》曰：田獲三品，有功也。" }
      - { type: z, text: "正義曰：“有功”者，田獵有獲，以喻行命有功也。" }
      - { type: j, text: "九五：貞吉，悔亡，無不利。無初有終。先庚三日，後庚三日，吉。以陽居陽，損於謙巽。然秉乎中正以宣其令，物莫之違，故曰“貞吉，悔亡，無不利”也。化不以漸，卒以剛直用加於物，故初皆不說也。終於中正，邪道以消，故有終也。申命令謂之庚。夫以正齊物，不可卒也；民迷固久，直不可肆也，故先申三日，令著之後，復申三日，然後誅而無咎怨矣。甲、庚，皆申命之謂也。" }
      - { type: z, text: "正義曰：九五以陽居陽，違於謙巽，是悔也。然執乎中正，以宣其令，物莫之違，是由貞正獲吉，故得悔亡而無不利，故曰“貞吉，悔亡，無不利”也。“無初有終”者，若卒用剛直，化不以漸，物皆不說，故曰“無初”也。終於中正，物服其化，故曰“有終”也。“先庚三日，後庚三日，吉”者，申命令謂之庚，民迷固久，申不可卒，故先申之三日，令著之後，復申之三日，然後誅之，民服其罪，無怨而獲吉矣，故曰“先庚三日，後庚三日，吉”也。" }
      - { type: j, text: "《象》曰：“九五”之“吉”，位正中也。" }
      - { type: z, text: "正義曰：“位正中”者，若不以九居五位，則不能以中正齊物，物之不齊，無由致吉，致吉是由九居五位，故舉爻位言之。" }
      - { type: j, text: "上九：巽在床下，喪其資斧，貞兇。處巽之極，極巽過甚，故曰：“巽在床下”也。斧所以斷者也，過巽失正，喪所以斷，故曰“喪其資斧，貞兇”也。" }
      - { type: z, text: "正義曰：“巽在床下”者，上九處巽之極，巽之過甚，故曰“巽在床下”。“喪其資斧”者，斧能斬決，以喻威斷也，巽過則不能行威命。命之不行，是喪其所用之斧，故曰“喪其資斧”也。“貞兇”者，失其威斷，是正之兇，故曰“貞兇”也。" }
      - { type: j, text: "《象》曰“巽在床下”，上窮也。“喪其資斧”，正乎兇也。" }
      - { type: z, text: "正義曰：“上窮”者，處上窮巽，故過在床下也。“正乎兇”者，正理須當威斷，而喪之，是“正乎兇”也。" }
      - { type: j, text: "兌下兌上。兌：亨，利貞。" }
      - { type: z, text: "正義曰：兌，說也。《說卦》曰：“說萬物者莫說乎澤。”以兌是象澤之卦，故以“兌”為名。澤以潤生萬物，所以萬物皆說：施於人事，猶人君以恩惠養民，民無不說也。惠施民說，所以為亨。以說說物，恐陷諂邪，其利在於貞正。故曰“兌，亨利貞”。" }
      - { type: j, text: "《彖》曰：兌，說也。剛中而柔外，說以利貞，說而違剛則諂，剛而違說則暴。剛中而柔外，所以說以利貞也。剛中，故利貞，柔外，故說亨。" }
      - { type: z, text: "正義曰：“兌，說也”者，訓卦名也。“剛中而柔外，說以利貞”者，此就二、五以剛居中，上六、六三以柔處外，釋“兌亨利貞”之義也。外雖柔說，而內德剛正，則不畏邪諂。內雖剛正，而外跡柔說，則不憂侵暴。只為剛中而柔外，中外相濟，故得說亨而利貞也。" }
      - { type: j, text: "是以順乎天而應乎人。天剛而不失說者也。" }
      - { type: z, text: "正義曰：廣明說義，合於天人。天為剛德而有柔克，是剛而不失其說也。今說以利貞，是上順乎天也。人心說於惠澤，能以惠澤說人，是下應乎人也。" }
      - { type: j, text: "說以先民，民忘其勞；說以犯難，民忘其死。說之大，民勸矣哉！" }
      - { type: z, text: "正義曰：“說以先民，民忘其勞”，以下歎美說之所致，亦申明應人之法，先以說豫撫民，然後使之從事，則民皆竭力忘其從事之勞，故曰“說以先民，民忘其勞”也。“說以犯難，民忘其死”者，先以說豫勞民，然後使之犯難，則民皆授命，忘其犯難之死，故曰“說以犯難，民忘其死”也。施說於人，所致如此，豈非說義之大，能使民勸勉矣哉！故曰“說之大，民勸矣哉”。" }
      - { type: j, text: "《象》曰：麗澤，兌。君子以朋友講習。麗，猶連也。施說之盛，莫盛於此。" }
      - { type: z, text: "正義曰：“麗澤兌”者，麗，猶連也，兩澤相連，潤說之盛，故曰“麗澤，兌”也。“君子以朋友講習”者，同門曰朋，同志曰友，朋友聚居，講習道義，相說之盛，莫過於此也。故君子象之以朋友講習也。" }
      - { type: j, text: "初九：和兌，吉。居兌之初，應不在一，無所黨系，和兌之謂也。說不在諂，履斯而行，未見有疑之者，吉其宜矣。。" }
      - { type: z, text: "正義曰：初九居兌之初，應不在一，無所私說，說之和也，說物以和，何往不吉，故曰“和兌，吉”也。" }
      - { type: j, text: "《象》曰：“和兌”之“吉”，行未疑也。" }
      - { type: z, text: "正義曰：“行未疑”者，說不為諂，履斯而行，未見疑之者也，所以得吉也。" }
      - { type: j, text: "九二：孚兌，吉，悔亡。說不失中，有孚者也。失位而說，孚吉，乃悔亡也。" }
      - { type: z, text: "正義曰：九二說不失中，有信者也。說而有信，則吉從之，故曰“孚兌，吉”也。然履失其位，有信而吉，乃得亡悔，故曰“孚兌，吉，悔亡”也。" }
      - { type: j, text: "《象》曰：“孚兌”之“吉”，信志也。其志信也。" }
      - { type: z, text: "正義曰：“信志也”者，失位而得吉，是其志信也。" }
      - { type: j, text: "六三：來兌，兇。以陰柔之質，履非其位，來求說者也。非正而求說，邪佞者也。" }
      - { type: z, text: "正義曰：三為陽位，陰來居之，是進來求說，故言“來兌”；而以不正來說，佞邪之道，故曰：“來兌，兇”也。" }
      - { type: j, text: "《象》曰：“來兌”之“兇”，位不當也。" }
      - { type: z, text: "正義曰：“位不當”者，由位不當，所以致兇也。" }
      - { type: j, text: "九四：商兌未寧，介疾有喜。商，商量裁製之謂也。介，隔也。三為佞說，將近至尊。故四以剛德，裁而隔之，匡內製外，是以未寧也。處於幾近，閒邪介疾，宜其有喜也。" }
      - { type: z, text: "正義曰：“商兌未寧”者，商，商量裁製之謂也。夫佞邪之人，國之疾也。三為佞說，將近至尊。故四以剛德，裁而隔之，使三不得進，匡內製外，未遑寧處，故曰“商兌未寧”。居近至尊，防邪隔疾，宜其有喜，故曰“介疾有喜”。" }
      - { type: j, text: "《象》曰：“九四”之“喜”，有慶也。" }
      - { type: z, text: "正義曰：“有慶”者，四能匡內製外，介疾除邪，此之為喜，乃為至尊所善，天下蒙賴，故言“有慶”也。" }
      - { type: j, text: "九五：孚於剝，有厲。比於上六，而與相得，處尊正之位，不說信乎陽，而說信乎陰，“孚於剝”之義也。“剝”之為義，小人道長之謂。" }
      - { type: z, text: "正義曰：“剝”者，小人道長，消君子之正，故謂小人為剝也。九五，處尊正之位，下無其應，比於上六，與之相得，是說信於小人，故曰“孚於剝”。信而成剝，危之道也，故曰“有厲”。" }
      - { type: j, text: "《象》曰：“孚於剝”，位正當也。以正當之位，信於小人而疏君子，故曰“位正當”也。" }
      - { type: z, text: "正義曰：“位正當”者，以正當之位，宜在君子，而信小人，故以當位責之也。" }
      - { type: j, text: "上六：引兌。以夫陰質，最處說後，靜退者也。故必見引，然後乃說也。" }
      - { type: z, text: "正義曰：上六以陰柔之質，最在兌後，是自靜退，不同六三自進求說，必須他人見引，然後乃說，故曰“引兌”也。" }
      - { type: j, text: "《象》曰：“上六，引兌”，未光也。" }
      - { type: z, text: "正義曰：“未光也”者，雖免躁求之兇，亦有後時之失，所以《經》無“吉”文，以其道未光故也。" }
      - { type: j, text: "坎下巽上。渙：亨。王假有廟，利涉大川，利貞。" }
      - { type: z, text: "正義曰：“渙，亨”者，“渙”，卦名也。《序卦》曰：“說而後散之，故受之以渙。”然則“渙”者，散釋之名。《雜卦》曰：“渙，離也。”此又“渙”是離散之號也。蓋“渙”之為義，小人遭難，離散奔迸而逃避也。大德之人，能於此時建功立德，散難釋險，故謂之為渙；能釋險難，所以為亨：故曰“渙，亨”。“王假有廟”者，王能渙難而亨，可以至於建立宗廟，故曰“王假有廟”也。“利涉大川”者，德洽神人，可濟大難，故曰“利涉大川”。“利貞”者，大難既散，宜以正道而柔集之，故曰“利貞”。" }
      - { type: j, text: "《彖》曰：“渙，亨”，剛來而不窮，柔得位乎外而上同。二以剛來居內，而不窮於險。四以柔得位乎外，而與上同。內剛而無險困之難，外順而無違逆之乖，是以亨，利涉大川，利貞也。凡剛得暢而無忌回之累，柔履正而同志乎剛，則皆亨，利涉大川，利貞也。" }
      - { type: z, text: "“《彖》曰渙亨”至“上同”。○正義曰：“渙，亨”者，疊《經》文，略舉名德也。“剛來而不窮，柔得位乎外而上同”者，此就九二剛德居險，六四得位從上，釋所以能散釋險難而致亨通，乃至“利涉大川、利貞”等也。二以剛德來居險中，而不窮於險，四以柔順得位於外，而上與五同。內剛無險困之難，外柔無違逆之乖，所以得散釋險難而通亨，建立宗廟而祭亨，利涉大川而克濟，利以正道而鳩民也。○注“凡剛得暢”至“利貞也”。○正義曰：“凡剛得暢而無忌回之累”者，此還言九二居險不窮，是剛得暢遂，剛既得暢，無復畏忌回邪之累也。“柔履正而同志乎剛”者，此還言六四得位履正，同志乎五也。剛德不暢，柔不同剛，何由得亨通而濟難，利貞而不邪乎？故言“則皆亨，利涉大川，利貞”也。注於此言“皆”者，凡有二意，一則《彖》雖疊“渙亨”二字，即以“剛來而不窮，柔得位乎外而上同”釋之，下別言“王假有廟，王乃在中，利涉大川，乘木有功”，恐剛來之言，惟釋亨德，不通在下；二則先儒有以剛來不窮釋亨德，柔得位乎外釋利貞，故言“皆”以通之。明剛柔皆釋“亨”以下至於“利貞”也。" }
      - { type: j, text: "“王假有廟”，王乃在中也。王乃在乎渙然之中，故至有廟也。" }
      - { type: z, text: "正義曰：此重明渙時；可以有廟之義。險難未夷，方勞經略；今在渙然之中，故至於有廟也。" }
      - { type: j, text: "“利涉大川”，乘木有功也。乘木即涉難也。木者專所以涉川也。涉難而常用渙道，必有功也。" }
      - { type: z, text: "“利涉”至“有功也”。○正義曰：重明用渙可以濟難之事。乘木涉川，必不沈溺；以渙濟難，必有成功，故曰“乘木有功”也。○注“乘木”至“有功也”。○正義曰：先儒皆以此卦坎下巽上，以為乘木水上，涉川之象，故言乘木有功，王不用象，直取況喻之義，故言此以序之也。" }
      - { type: j, text: "《象》曰：風行水上，“渙”，先王以享於帝，立廟。" }
      - { type: z, text: "正義曰：“風行水上，渙”者，風行水上，激動波濤，散釋之象，故曰“風行水上，渙”。“先王以享於帝立廟”者，先王以渙然無難之時，享於上帝，以告太平，建立宗廟，以祭祖考，故曰“先王以享於帝，立廟”也。" }
      - { type: j, text: "初六：用拯馬壯，吉。渙，散也。處散之初，乖散未甚，故可以游行，得其志而違於難也，不在危劇而後乃逃竄，故曰“用拯馬壯，吉”。" }
      - { type: z, text: "正義曰：初六處散之初，乖散未甚，可用馬以自拯拔，而得壯吉也，故曰“用拯馬壯，吉”。" }
      - { type: j, text: "《象》曰：“初六”之“吉”，順也。觀難而行，不與險爭，故曰“順也”。" }
      - { type: z, text: "正義曰：觀難而行，不與險爭，故曰“順也”。" }
      - { type: j, text: "九二：渙奔其機，悔亡。機，承物者也，謂初也。二俱無應，與初相得，而初得散道，離散而奔，得其所安，故“悔亡”也。" }
      - { type: z, text: "正義曰：“渙奔其機”者，機，承物者也，初承於二，謂初為機，二俱無應，與初相得，而初得遠難之道，今二散奔歸初，故曰“渙奔其機”也。“悔亡”者，初得散道而二往歸之，得其所安，故悔亡也。" }
      - { type: j, text: "《象》曰：“渙奔其機”，得願也。" }
      - { type: z, text: "正義曰：“得願”者，違難奔散，願得所安；奔初獲安，是得其願也。" }
      - { type: j, text: "六三：渙其躬，無悔。渙之為義，內險而外安者也。散躬志外，不固所守，與剛合志，故得無悔也。" }
      - { type: z, text: "正義曰：“渙其躬，無悔”者，渙之為義，內險外安，六三內不比二，而外應上九，是不固所守，能散其躬，故得無悔。故曰“渙其躬，無悔”。" }
      - { type: j, text: "《象》曰：“渙其躬”，志在外也。" }
      - { type: z, text: "正義曰：“志在外”者，釋六三所以能渙其躬者，正為身在於內，而應在上九，是志意在外也。" }
      - { type: j, text: "六四：渙其群，元吉。渙有丘，匪夷所思。逾乎險難，得位體巽，與五合志，內掌機密，外宣化命者也，故能散群之險，以光其道。然處於卑順，不可自專，而為散之任，猶有丘虛匪夷之慮，雖得元吉，所思不可忘也。" }
      - { type: z, text: "正義曰：“渙其群”者，六四出在坎上，巳逾於險，得位體巽，與五合志，內掌機密，外宣化命者也。能為群物散其險害，故曰“渙其群”也。“元吉，渙有丘，匪夷所思者，能散群險，則有大功，故曰“元吉”。然處上體之下，不可自專，而得位承尊，憂責復重，雖獲元吉，猶宜於散難之中，有丘墟未平之慮，為其所思，故曰“渙有丘，匪夷所思”也。" }
      - { type: j, text: "《象》曰：“渙其群，元吉”，光大也。" }
      - { type: z, text: "正義曰：“光大也”者，能散群險而獲元吉，是其道光大也。" }
      - { type: j, text: "九五：渙汗其大號。渙，王居無咎。處尊履正，居巽之中，散汗大號，以蕩險阨者也。為渙之主，唯王居之，乃得無咎也。" }
      - { type: z, text: "正義曰：“渙汗其大號”者，人遇險阨，驚怖而勞，則汗從體出，故以汗喻險阨也；九五處尊履正，在號令之中，能行號令，以散險阨者也，故曰“渙汗其大號”也。“渙，王居無咎”者，為渙之主，名位不可假人，惟王居之，乃得無咎，故曰“渙，王居無咎”。" }
      - { type: j, text: "《象》曰：“王居無咎”，正位也。正位不可以假人。" }
      - { type: z, text: "正義曰：“正位”者，釋“王居無咎”之義，以九五是王之正位，若非王居之，則有咎矣。" }
      - { type: j, text: "上九：渙其血，去逖出，無咎。逖，遠也。最遠於害，不近侵害，散其憂傷，遠出者也。散患於遠害之地，誰將咎之哉！" }
      - { type: z, text: "正義曰：“渙其血，去逖出”者，血，傷也。逖，遠也。上九處於卦上，最遠於險，不近侵害，是能散其憂傷，去而逖出者也。故曰“渙其血，去逖出”也。“無咎”者，散患於遠害之地，誰將咎之矣，故曰“無咎”。" }
      - { type: j, text: "《象》曰：“渙其血”，遠害也。" }
      - { type: z, text: "正義曰：“遠害”者，釋“渙其血”也。是居遠害之地故也。" }
      - { type: j, text: "兌下坎上。節：亨，苦節不可貞。" }
      - { type: z, text: "正義曰：“節”，卦名也。《彖》曰：“節以制度。”《雜卦》云：“節，止也。”然則節者制度之名。節，止之義，制事有節，其道乃亨，故曰“節，亨”。節須得中，為節過苦，傷於刻薄，物所不堪，不可復正，故曰“苦節不可貞”也。" }
      - { type: j, text: "《彖》曰：“節，亨”，剛柔分而剛得中。坎陽而兌陰也。陽上而陰下，剛柔分也。剛柔分而不亂，剛得中而為制主，節之義也。節之大者，莫若剛柔分，男女別也。" }
      - { type: z, text: "正義曰：此就上下二體居二、五剛中，釋所以為節得亨之義也。坎剛居上，兌柔處下，是剛柔分也。剛柔分，男女別，節之大義也。二、五以剛居中，為制之主，所以得節，節不違中，所以得亨，故曰“節，亨，剛柔分而剛得中”也。" }
      - { type: j, text: "“苦節不可貞”，其道窮也。為節過苦，則物所不能堪也。物不能堪，則不可復正也。" }
      - { type: z, text: "正義曰：為節過苦，不可為正。若以苦節為正，則其道困窮，故曰“苦節不可貞，其道窮”也。" }
      - { type: j, text: "說以行險，當位以節，中正以通。然後及亨也。無說而行險，過中而為節，則道窮也。" }
      - { type: z, text: "正義曰：上言“苦節不可貞，其道窮”者，正由為節不中，則物所不說，不可復正，其道困窮，故更就二體及四、五當位，重釋行節得亨之義，以明苦節之窮也。“行險以說”，則為節得中。“當位以節”，則可以為正。良由中而能正，所以得通，故曰：“中正以通”，此其所以為亨也。" }
      - { type: j, text: "天地節而四時成，節以制度，不傷財，不害民。" }
      - { type: z, text: "正義曰：“天地節而四時成”者，此下就天地與人廣明節義。天地以氣序為節，使寒暑往來，各以其序，則四時功成之也。王者以制度為節，使用之有道，役之有時，則不傷財，不害民也。" }
      - { type: j, text: "《象》曰：澤上有水，節。君子以制數度，議德行。" }
      - { type: z, text: "正義曰：“澤上有水，節”者，水在澤中，乃得其節，故曰“澤上有水，節”也。“君子以制數度，議德行”者，數度，謂尊卑禮命之多少。德行，謂人才堪任之優劣。君子象節以制其禮數等差，皆使有度，議人之德行任用，皆使得宜。" }
      - { type: j, text: "初九：不出戶庭，無咎。為節之初，將整離散而立制度者也，故明於通塞，慮於險為，不出戶庭，慎密不失，然後事濟而無咎也。" }
      - { type: z, text: "“初九”至“無咎”。○正義曰：初九處節之初，將立制度，宜其慎密，不出戶庭，若不慎而洩，則民情奸險，應之以偽，故慎密不失，然後事濟而無咎，故曰“不出戶庭，無咎”。○注“將整離散而立制度者也”。○正義曰：《序卦》云：“物不可以終離，故受之以節。”此卦承《渙》之後，初九居節之初，故曰“將整離散而立法度”也。" }
      - { type: j, text: "《象》曰：“不出戶庭”，知通塞也。" }
      - { type: z, text: "正義曰：“知通塞”者，識時通塞，所以不出也。" }
      - { type: j, text: "九二：不出門庭，兇。初已造之，至二宜宣其制矣，而故匿之，失時之極，則遂廢矣。故不出門庭，則兇也。" }
      - { type: z, text: "正義曰：初巳製法，至二宜宣。若猶匿之，則失時之極，可施之事，則遂廢矣。不出門庭，所以致兇，故曰“不出門庭，兇”。" }
      - { type: j, text: "《象》曰：“不出門庭，兇”，失時極也。" }
      - { type: z, text: "正義曰：“失時極”者，極，中也。應出不出，失時之中，所以為兇。" }
      - { type: j, text: "六三：不節若，則嗟若，無咎。若，辭也。以陰處陽，以柔乘剛，違節之道，以至哀嗟。自巳所致，無所怨咎，故曰“無咎”也。" }
      - { type: z, text: "正義曰：節者，制度之卦，處節之時，位不可失，六三以陰處陽，以柔乘剛，失位驕逆，違節之道，禍將及己，以至哀嗟，故曰“不節苦，則嗟若”也。禍自已致，無所怨咎，故曰“無咎”。" }
      - { type: j, text: "《象》曰：“不節”之“嗟”，又誰“咎”也。" }
      - { type: z, text: "正義曰：“又誰咎”者，由己不節，自致禍災，又欲怨咎誰乎？" }
      - { type: j, text: "六四：安節，亨。得位而順，不改其節，而能亨者也。承上以斯，得其道也。" }
      - { type: z, text: "正義曰：六四得位，而上順於五，是得節之道。但能安行此節而不改變，則何往不通，故曰“安節亨”，明六三以失位乘剛，則失節而招咎，六四以得位承陽，故安節而致亨。" }
      - { type: j, text: "《象》曰：“安節”之“亨”，承上道也。" }
      - { type: z, text: "正義曰：承上道者，以能承於上，故不失其道也。" }
      - { type: j, text: "九五：甘節，吉。往有尚。當位居中，為節之主不失其中，不傷財，不害民之謂也。為節之不苦，非甘而何？術斯以往，往有尚也。" }
      - { type: z, text: "正義曰：“甘”者，不苦之名也。九五居於尊位，得正履中，能以中正為節之主，則當《彖》曰：“節以制度，不傷財，不害民”之謂也。為節而無傷害，則是不苦而甘，所以得吉，故曰“甘節，吉”。以此而行，所往皆有嘉尚，故曰“往有尚”也。" }
      - { type: j, text: "象曰：“甘節”之“吉”，居位中也。" }
      - { type: z, text: "正義曰：“居位中”者，以居尊位而得中，故致甘節之吉也。" }
      - { type: j, text: "上六：苦節，貞兇，悔亡。過節之中，以致亢極，苦節者也。以斯施人，物所不堪，正之兇也。以斯脩身，行在無妄，故得悔亡。" }
      - { type: z, text: "正義曰：上六處節之極，過節之中，節不能甘，以至於苦，故曰“苦節”也。為節過苦，物所不堪，不可復正，正之兇也，故曰“貞兇”。若以苦節施人，則是正道之兇。若以苦節脩身，則儉約無妄，可得亡悔，故曰“悔亡”也。" }
      - { type: j, text: "《象》曰：“苦節，貞兇”，其道窮也。" }
      - { type: j, text: "兌下巽上。中孚：豚魚吉。利涉大川，利貞。" }
      - { type: z, text: "正義曰：“中孚，豚魚吉”者，“中孚”，卦名也。信發於中，謂之中孚。魚者，蟲之幽隱。豚者，獸之微賤。人主內有誠信，則雖微隱之物，信皆及矣。莫不得所而獲吉，故曰“豚魚吉”也。“利涉大川，利貞”者，微隱獲吉，顯者可知。既有誠信，光被萬物，萬物得宜，以斯涉難，何往不通？故曰“利涉大川”。信而不正，兇邪之道，故利在貞也。" }
      - { type: j, text: "《彖》曰：中孚，柔在內而剛得中，說而巽，孚，有上四德，然後乃孚。" }
      - { type: z, text: "正義曰：此就三、四陰柔並在兩體之內，二、五剛德各處一卦之中，及上下二體說而以巽，釋此卦名為“中孚”之義也。柔內剛中，各當其所，說而以巽，乖爭不作，所以信發於內，謂之“中孚”，故曰“柔在內而剛得中，說而巽，孚”也。" }
      - { type: j, text: "乃化邦也。信立而後邦乃化也。柔在內而剛得中，各當其所也。剛得中，則直而正；柔在內，則靜而順；說而以巽，則乖爭不作。如此，則物無巧競，敦實之行著，而篤信發乎其中矣。" }
      - { type: z, text: "正義曰：誠信發於內，則邦國化於外，故曰“乃化邦也”。" }
      - { type: j, text: "“豚魚吉”，信及豚魚也。魚者，蟲之隱者也。豚者，獸之微賤者也。爭競之道不興，中信之德淳著，則雖微隱之物，信皆及之。" }
      - { type: z, text: "正義曰：釋所以得吉，由信及豚魚故也。" }
      - { type: j, text: "“利涉大川”，乘木舟虛也。乘木於川舟之虛，則終已無溺也。用中孚以涉難，若乘木舟虛也。" }
      - { type: z, text: "正義曰：釋此涉川所以得利，以中信而濟難，若乘虛舟以涉川也。" }
      - { type: j, text: "中孚以“利貞”，乃應乎天也。盛之至也。" }
      - { type: z, text: "正義曰：釋中孚所以利貞者，天德剛正而氣序不差，是正而信也。今信不失正，乃得應於天，是中孚之盛故須濟以利貞也。" }
      - { type: j, text: "《象》曰：澤上有風，中孚。君子以議獄緩死。信發於中，雖過可亮。" }
      - { type: z, text: "正義曰：“澤上有風，中孚”者，風行澤上，無所不周，其猶信之被物，無所不至，故曰“澤上有風，中孚”。“君子以議獄緩死”者，中信之世，必非故犯過失為辜，情在可恕，故君子以議其過失之獄，緩舍當死之刑也。" }
      - { type: j, text: "初九：虞吉，有它不燕。虞猶專也。為信之始，而應在四，得乎專吉者也，志未能變，系心於一，故“有它不燕”也。" }
      - { type: z, text: "正義曰：虞猶專也。燕，安也。初為信始，應在於四，得其專一之吉，故曰“虞吉”。既系心於一，故更有他求，不能與之共相燕安也，故曰“有它不燕”也。" }
      - { type: j, text: "《象》曰：“初九，虞吉”，志未變也。" }
      - { type: z, text: "正義曰：“志未變”者，所以得專一之吉，以志未改變，不更親於他也。" }
      - { type: j, text: "九二：鶴鳴在陰，其子和之。我有好爵，吾與爾靡之。處內而居重陰之下，而履不失中，不徇於外，任其真者也。立誠篤至，雖在闇昧，物亦應焉，故曰“鳴鶴在陰，其子和之”也。不私權利，唯德是與，誠之至也，故曰我有好爵，與物散之。" }
      - { type: z, text: "正義曰：“鳴鶴在陰，其子和之”者，九二體剛，處於卦內，又在三四重陰之下，而履不失中，是不徇於外，自任其真者也。處於幽昧，而行不失信，則聲聞於外，為同類之所應焉。如鶴之鳴於幽遠，則為其子所和，故曰“鳴鶴在陰，其子和之”也。“我有好爵，吾與爾靡之”者，靡，散也，又無偏應，是不私權利，惟德是與。若我有好爵，吾原與爾賢者分散而共之，故曰“我有好爵，吾與爾靡之。”" }
      - { type: j, text: "《象》曰：“其子和之”，中心願也。" }
      - { type: z, text: "正義曰：“中心願”者，誠信之人，願與同類相應，得誠信而應之，是中心願也。" }
      - { type: j, text: "六三：得敵，或鼓或罷，或泣或歌。三居少陰之上，四居長陰之下，對而不相比，敵之謂也。以陰居陽，欲進者也。欲進而閡敵，故或鼓也。四履正而承五，非己所克，故或罷也。不勝而退，懼見侵陵，故或泣而憂悲也。四履於順。不與物校，退而不見害，故或歌也。不量其力，進退無恆，憊可知也。" }
      - { type: z, text: "正義曰：六三與四，俱是陰爻，相與為類。然三居少陰之桑四居長陰之下，各自有應對，而不相比，敵之謂也。故曰“得敵欲進”。礙四，恐其害己，故或鼓而攻之，而四履正承尊，非己所勝，故或罷而退敗也。不勝而退，懼見侵陵，故或泣而憂悲也。四履於順，不與物校，退不見害，故或歌而歡樂也，故曰“或鼓或罷，或泣或歌”也。" }
      - { type: j, text: "《象》曰：“或鼓或罷”，位不當也。" }
      - { type: z, text: "正義曰：“位不當”者，所以或鼓或罷，進退無恆者，止為不當其位，妄進故也。" }
      - { type: j, text: "六四：月幾望，馬匹亡，無咎。居中孚之時，處巽之始，應說之初，居正履順，以承於五，內毗無首，外宣德化者也。充乎陰德之盛，故曰：“月幾望”。“馬匹亡”者，棄群類也。若夫居盛德之位，而與物校其競爭，則失其所盛矣，故曰絕類而上，履正承尊，不與三爭，乃得無咎也。" }
      - { type: z, text: "正義曰：“月幾望”者，六四居中孚之時，處巽應說，得位履順，上承於五，內毗元首，外宣德化，充乎陰德之盛，如月之近望，故曰“月幾望”也。“馬匹亡，無咎”者，三與己敵，進來攻己，己若與三校戰，則失其所盛，故棄三之類，如馬之亡匹；上承其五，不與三爭，乃得無咎，故曰“馬匹亡，無咎”也。" }
      - { type: j, text: "《象》曰：“馬匹亡”，絕類上也。類謂三，俱陰爻，故曰“類”也。" }
      - { type: z, text: "正義曰：“絕類上”者，絕三之類，不與二爭，而上承於五也。" }
      - { type: j, text: "九五：有孚攣如，無咎。“攣如”者，系其信之辭也。處中誠以相交之時，居尊位以為群物之主，信何可舍？故“有孚攣如”，乃得“無咎”也。" }
      - { type: z, text: "正義曰：“有孚攣如，無咎”者，攣如者，相牽系不絕之名也。五在信時，處於尊位，為群物之主，恆須以中誠交物，孚信何可暫舍，故曰“有孚攣如”。系信不絕，乃得無咎，故曰“有孚攣如，無咎”也。" }
      - { type: j, text: "《象》曰：“有孚攣如”，位正當也。" }
      - { type: z, text: "正義曰：“位正當”者，以其正當尊位，故戒以系信，乃得無咎。若真以陽得正位，而無有系信，則招有咎之嫌也。" }
      - { type: j, text: "上九：翰音登於天，貞兇。翰，高飛也。飛音者，音飛而實不從之謂也。居卦之上，處信之終，信終則衰，忠篤內喪，華美外揚，故曰“翰音登於天”也。翰音登天，正亦滅矣。" }
      - { type: z, text: "正義曰：翰，高飛也。飛音者，音飛而實不從之謂也。上九處信之終信終則衰也。信衰則詐起，而忠篤內喪，華美外揚，若鳥於翰音登於天，虛聲遠聞也，故曰“翰音登於天”。虛聲無實，正之兇也，故曰“貞兇”。" }
      - { type: j, text: "《象》曰：“翰音登於天”，何可長也。" }
      - { type: z, text: "正義曰：“何可長也”者，虛聲無實，何可久長。" }
      - { type: j, text: "艮下震上。小過：亨，利貞。可小事，不可大事。飛鳥遺之音，不宜上，宜下，大吉。飛鳥遺其音聲，哀以求處，上愈無所適，下則得安。愈上則愈窮，莫若飛鳥也。" }
      - { type: z, text: "“小過亨”至“大吉”。○正義曰：“小過，亨”者，“小過”，卦名也。王於《大過》卦下注云：“音相過之過”。恐人作罪過之義，故以音之。然則“小過”之義，亦與彼同也。過之小事，謂之小過，即“行過乎恭，喪過乎哀”之謂是也。褚氏云：“謂小人之行，小有過差，君子為過厚之行以矯之也，如晏子狐裘之比也。”此因小人有過差，故君子為過厚之行，非即以過差釋卦名。《彖》曰“小過，小者過而亨”，言因過得亨，明非罪過，故王於大過音之，明雖義兼罪過得名，上在君子為過行也。而周氏等不悟此理，兼以罪過釋卦名，失之遠矣。過為小事，道乃可通，故曰“小過，亨”也。“利貞”者，矯世勵俗，利在歸正，故曰“利貞”也。“可小事，不可大事”者，時也。小有過差，惟可矯以小事，不可正以大事，故曰“可小事，不可大事”也。“飛鳥遺之音，不宜上，宜下，大吉”者，借喻以明過厚之行，有吉有兇。飛鳥遺其音聲，哀以求處。過上則愈無所適，過下則不失其安，以譬君子處過差之時，為過厚之行，順而立之則吉，逆而忤鱗則兇，故曰：“飛鳥遺之音，不宜上，宜下，大吉”。順則執卑守下，逆則犯君陵上，故以臣之逆順，類鳥之上下也。○注“飛鳥”至“求處”。○正義曰：“飛鳥遺其音聲，哀以求處”者，遺，失也。鳥之失聲，必是窮迫，未得安處。《論語》曰：“鳥之將死，其鳴也哀。”故知遺音即哀聲也。" }
      - { type: j, text: "《彖》曰：小過，小者過而亨也。小者謂凡諸小事也，過於小事而通者也。" }
      - { type: z, text: "正義曰：此釋小過之名也。並明小過有亨德之義，過行小事謂之小過，順時矯俗，雖過而通，故曰“小者過而亨”也。" }
      - { type: j, text: "過以“利貞”，與時行也。過而得以利貞，應時宜也。施過於恭儉，利貞者也。" }
      - { type: z, text: "正義曰：此釋利貞之德，由為過行而得利貞。然矯枉過正，應時所宜，不可常也，故曰“與時行”也。" }
      - { type: j, text: "柔得中，是以“小事”吉也；剛失位而不中，是以“不可大事”也。成大事者，必在剛也。柔而浸大，剝之道也。" }
      - { type: z, text: "正義曰：此就六二、六五以柔居中，九四失位不中，九三得位不中，釋“可小事，不可大事”之義。柔順之人，惟能行小事，柔而得中，是行小中時，故曰“小事吉”也。剛健之人，乃能行大事，失位不中，是行大不中時，故曰“不可大事”也。" }
      - { type: j, text: "有“飛鳥”之象焉。不宜上，宜下，即飛鳥之象。" }
      - { type: z, text: "正義曰：釋不取餘物為況，惟取“飛鳥”者，以不宜上，宜下，有飛鳥之象故也。" }
      - { type: j, text: "“飛鳥遺之音，不宜上，宜下，大吉”，上逆而下順也。上則乘剛，逆也；下則承陽，順也。施過於不順，兇莫大焉；施過於順，過更變而為吉也。" }
      - { type: z, text: "正義曰：此就六五乘九四之剛，六二承九三之陽，釋所以“不宜上，宜下，大吉”之義也。上則乘剛而逆，下則承陽而順，故曰“不宜上，宜下，大吉”，以上逆而下順也。" }
      - { type: j, text: "《象》曰：山上有雷，小過。君子以行過乎恭，喪過乎哀，用過乎儉。" }
      - { type: z, text: "正義曰：雷之所出，不出於地。今出山上，過其本所，故曰“小過”。小人過差，失在慢易奢侈，故君子矯之，以行過乎恭，喪過乎哀，用過平儉也。" }
      - { type: j, text: "初六：飛鳥以兇。小過，上逆下順，而應在上卦，進而之逆，無所錯足，飛鳥之兇也。" }
      - { type: z, text: "正義曰：小過之義，上逆下順，而初應在上卦，進而之逆，同於飛鳥，無所錯足，故曰“飛鳥以兇”也。" }
      - { type: j, text: "《象》曰：“飛鳥以兇”，不可如何也？" }
      - { type: z, text: "正義曰：“不可如何也”者，進而之逆，孰知不可自取兇咎，欲如何乎？" }
      - { type: j, text: "六二：過其祖，遇其妣，不及其君。遇其臣，無咎。過而得之謂之遇，在小過而當位，過而得之之謂也。祖，始也，謂初也。妣者，居內履中而正者也。過初而履二位，故曰“過其祖”而“遇其妣”，過而不至於僣，盡於臣位而已，故曰“不及其君，遇其臣，無咎”。" }
      - { type: z, text: "正義曰：過而得之謂之遇，六二在小過而當位，是過而得之也。祖，始也，謂初也。妣者，母之稱。六二居內，履中而正，固謂之妣。巳過於初，故曰“過其祖”也。履得中正，故曰“遇其妣”也。過不至於僣，盡於臣位而已，故曰“不及其君，遇其臣，無咎”。" }
      - { type: j, text: "《象》曰：“不及其君”，臣不可過也。" }
      - { type: z, text: "正義曰：“臣不可過”者，臣不可自過其位也。" }
      - { type: j, text: "九三：弗過防之，從或戕之，兇。小過之世，大者不立，故令小者得過也。居下體之上，以陽當位，而不能先過防之，至令小者或過，而復應而從焉。其從之也，則戕之兇至矣。故曰“弗過防之，從或戕之，兇”也。" }
      - { type: z, text: "正義曰：“弗過防之”者，小過之世，大者不能立德，故令小者得過，九三居下體之上，以陽當位，不能先過為防，至令小者或過。上六小人最居高顯，而復應而從焉。其從之也，則有殘害之兇至矣，故曰“弗過防之”。“從或戕之，兇”者，《春秋傳》曰：“在內曰弒，在外曰戕。”然則戕者皆殺害之謂也。言“或”者，不必之辭也。謂為此行者，有幸而免也。" }
      - { type: j, text: "《象》曰：“從或戕之”，“兇”如何也？" }
      - { type: z, text: "正義曰：“兇如何”者，從於小人，果致兇禍，將如何乎？言不可如何也。" }
      - { type: j, text: "九四：無咎，弗過遇之，往厲必戒，勿用永貞。雖體陽爻，而不居其位，不為責主，故得無咎也。失位在下不能過者也。以其不能過，故得合於免咎之宜，故曰“弗過遇之”。夫宴安酖毒，不可懷也，處於小過不寧之時，而以陽居陰，不能有所為者也。以此自守，免咎可也；以斯攸往，危之道也。不交於物，物亦弗與，無援之助，故危則必戒而已，無所告救也。沈沒怯弱，自守而已，以斯而處於群小之中，未足任者也，故曰“勿用永貞”，言不足用之於永貞。" }
      - { type: z, text: "“九四無咎”至“永貞”。○正義曰：居小過之世，小人有過差之行，須大德之人，防使無過。今九四雖體陽爻而不居其位，不防之責，責不在己，故得無咎。所以無其咎者，以其失位在下，不能為過厚之行，故得遇於無咎之宜，故曰“無咎，弗過遇之”也。既能無為自守，則無咎，有往則危厲，故曰“往厲”。不交於物，物亦不與，無援之助，故危則必自戒慎而已，無所告救，故曰“必戒”。以斯而處於群小之中，未足委任，不可用之以長行其正也，故曰“勿用永貞”也。○注“夫宴安”至“懷也”。○正義曰：“夫宴安酖毒，不可懷也”者，此《春秋》狄伐邢，管仲勸齊侯救邢，為此辭，言宴安不救邢，即酖鳥之毒，不可懷而安之也。" }
      - { type: j, text: "《象》曰：“弗過遇之”，位不當也。“往厲必戒”，終不可長也。" }
      - { type: z, text: "正義曰：“位不當”者，釋所以弗過而遇，得免於咎者，以其位不當故也。“終不可長”者，自身有危，無所告救，豈可任之長，以為正也。" }
      - { type: j, text: "六五：密云不雨，自我西郊，公弋取彼在穴。小過，小者過於大也。六得五位，陰之盛也。故密云不雨，至於西郊也。夫雨者，陰在於上，而陽薄之而不得通，則烝而為雨。今艮止於下而不交焉，故不雨也。是故小畜尚往而亨，則不雨也；小過陽不上交，亦不雨也。雖陰盛於上，未能行其施也。公者，臣之極也，五極陰盛，故稱公也。弋，射也。在穴者，隱伏之物也。“小過”者，過小而難未大作，猶在隱伏者也。以陰質治小過，能獲小過者也，故曰“公弋取彼在穴”也。除過之道，不在取之，是乃密云未能雨也。" }
      - { type: z, text: "“六五密云”至“在穴”。○正義曰：“密云不雨，自我西郊”者，小過者，小者過於大也。六得五位，是小過於大，陰之盛也。陰盛於上，而艮止之，九三陽止於下，是陰陽不交，雖復至盛，密云至於西郊，而不能為雨也。施之於人，是柔得過而處尊，未能行其恩施，廣其風化也，故曰“密云不雨，自我西郊”也。“公弋取彼在穴”者，公者臣之極，五極陰盛，故稱公也。小過之時，為過猶小，而難未大作，猶在隱伏。以小過之才，治小過之失，能獲小過在隱伏者，有如公之弋獵，取得在穴隱伏之獸也。故曰“公弋取彼在穴”也。○注“除過”至“能雨也”。○正義曰：“除過”至“能雨也”者，雨者，以喻德之惠化也。除過差之道，在於文德，懷之，使其自服，弋而取之，是尚威武，尚威武即“密云不雨”之義也。" }
      - { type: j, text: "《象》曰：“密云不雨”，已上也。陽巳上，故止也。" }
      - { type: z, text: "正義曰：“巳上”者，釋所以“密云不雨”也。以艮之陽爻，巳上於一卦之上而成止，故不上交而為雨也。" }
      - { type: j, text: "上六：弗遇過之，飛鳥離之，兇，是謂災眚。小人之過，遂至上極，過而不知限，至於亢也。過至於亢，將何所遇？飛而不已，將何所託？災自己致，復何言哉！" }
      - { type: z, text: "正義曰：上六處小過之極，是小人之過，遂至上極，過而不知限，至於亢者也。過至於亢，無所復遇，故曰“弗遇過之”也。以小人之身，過而弗遇，必遭羅網，其猶飛鳥，飛而無託，必離矰繳，故曰“飛鳥離之，兇”也。過亢離兇，是謂自災而致眚，復何言哉！故曰“是謂災眚”也。" }
      - { type: j, text: "《象》曰：“弗遇過之”，已亢也。" }
      - { type: z, text: "正義曰：“已亢”者，釋所以“弗遇過之”，以其已在亢極之地故也。" }
      - { type: j, text: "離下坎上。既濟：亨小，利貞，初吉終亂。" }
      - { type: z, text: "正義曰：“既濟，亨小，利貞，初吉終亂”者，濟者，濟渡之名，既者，皆盡之稱，萬事皆濟，故以“既濟”為名。既萬事皆濟，若小者不通，則有所未濟，故曰“既濟，亨小”也。小者尚亨，何況於大？則大小剛柔，各當其位，皆得其所。當此之時，非正不利，故曰“利貞”也。但人皆不能居安思危，慎終如始，故戒以今日。既濟之初，雖皆獲吉，若不進德脩業至於終極，則危亂及之，故曰“初吉終亂”也。" }
      - { type: j, text: "《彖》曰：“既濟，亨”，小者亨也。既濟者，以皆濟為義者也。小者不遺，乃為皆濟，故舉小者，以明既濟也。" }
      - { type: z, text: "正義曰：此釋卦名德，既濟之亨，必小者皆亨也，但舉小者，則大者可知，所以為既濟也。具足為文，當更有一“小”字，但既疊《經》文，略足以見，故從省也。" }
      - { type: j, text: "“利貞”，剛柔正而位當也。剛柔正而位當，則邪不可以行矣，故唯正乃利貞也。" }
      - { type: z, text: "正義曰：此就二、三、四、五並皆得正，以釋“利貞”也。剛柔皆正，則邪不可行，故惟正乃利貞也。" }
      - { type: j, text: "“初吉”，柔得中也。“終”止則“亂”，其道窮也。柔得中，則小者亨也。柔不得中，則小者未亨。小者未亨，雖剛得正，則為未既濟也。故既濟之要，在柔得中也。以既濟為安者，道極無進，終唯有亂，故曰：“初吉終亂。”終亂不為自亂，由止故亂，故曰“終止則亂”也。" }
      - { type: z, text: "正義曰：“初吉，柔得中”者，此就六二以柔居中，釋“初吉”也。以柔小尚得其中，則剛大之理，皆獲其濟。物無不濟，所以為吉，故曰“初吉”也。終止則亂，其道窮者，此正釋戒。若能進脩不止，則既濟無終。既濟終亂，由止故亂。終止而亂，則既濟之道窮矣，故曰“終止則亂，其道窮”也。" }
      - { type: j, text: "《象》曰：水在火上，既濟。君子以思患而豫防之。存不忘亡，既濟不忘未濟也。" }
      - { type: z, text: "正義曰：水在火上，炊爨之象，飲食以之而成，性命以之而濟，故曰“水在火上，既濟”也。但既濟之道，初吉終亂，故君子思其後患，而豫防之。" }
      - { type: j, text: "初九：曳其輪，濡其尾，無咎。最處既濟之初，始濟者也。始濟未涉於燥，故輪曳而尾濡也。雖未造易，心無顧戀，志棄難者也。其為義也，無所咎也。" }
      - { type: z, text: "正義曰：初九處既濟之初，體剛居中，是始欲濟渡也。始濟未涉於燥，故輪曳而尾濡，故云“曳其輪，濡其尾”也。但志在棄難，雖復曳輪濡尾，其義不有咎，故云“無咎”。" }
      - { type: j, text: "《象》曰：“曳其輪”，義無咎也。" }
      - { type: j, text: "六二：婦喪其茀，勿逐，七日得。居中履正，處文明之盛，而應乎五，陰之光盛者也。然居初、三之間，而近不相得，上不承三，下不比初。夫以光盛之陰，處於二陽之間，近而不相得，能無見侵乎？故曰“喪其茀”也。稱“婦”者，以明自有夫，而它人侵之也。茀，首飾也。夫以中道執乎貞正，而見侵者，眾之所助也。處既濟之時，不容邪道者也。時既明峻，眾又助之，竊之者逃竄而莫之歸矣。量斯勢也，不過七日，不須已逐，而自得也。" }
      - { type: z, text: "“六二”至“七日得”。○正義曰：“婦喪其茀，勿逐，七日得”者，茀者，婦人之首飾也。六二居中履正，處文明之盛，而應乎五，陰之光盛者也，然居初、三之間，而近不相得。夫以光盛之陰，處於二陽之間，近而不相得，能無見侵乎？故曰“婦喪其茀”。稱“婦”者，以明自有夫，而他人侵之也。夫以中道執乎貞正，而見侵者，物之所助也。處既濟之時，不容邪道者也。時既明峻，眾又助之，竊之者逃竄而莫之歸矣。量斯勢也，不過七日，不須已逐而自得，故曰：“勿逐，七日得”。" }
      - { type: j, text: "《象》曰：“七日得”，以中道也。" }
      - { type: z, text: "正義曰：“以中道”者，釋不須追逐而自得者，以執守中道故也。" }
      - { type: j, text: "九三：高宗伐鬼方，三年克之，小人勿用。處既濟之時，居文明之終，履得其位，是居衰末而能濟者，“高宗伐鬼方，三年乃克”也。君子處之，故能興也，小人居之，遂喪邦也。" }
      - { type: z, text: "正義曰：“高宗伐鬼方，三年克之”者，高宗者，殷王武丁之號也，九三處既濟之時，居文明之終，履得其位，是居衰末，而能濟者也。高宗伐鬼方，以中興殷道，事同此爻，故取譬焉。高宗德實文明，而勢甚衰憊，不能即勝，三年乃克，故曰“高宗伐鬼方，三年克之”也。“小人勿用”者，勢既衰弱，君子處之，能建功立德，故興而復之，小人居之，日就危亂，必喪邦也，故曰“小人勿用”。" }
      - { type: j, text: "《象》曰：“三年克之”，憊也。" }
      - { type: z, text: "正義曰：“憊也”者，以衰憊之故，故三年乃克之。" }
      - { type: j, text: "六四：繻有衣袽，終日戒。繻宜曰濡，衣袽，所以塞舟漏也。履得其正，而近不與三、五相得。夫有隙之棄舟，而得濟者，有衣袽也。鄰於不親，而得全者，終日戒也。" }
      - { type: z, text: "正義曰：“繻有衣袽，終日戒”者，王注云“繻，宜曰濡，衣袽，所以塞舟漏”者也。六四處既濟之時，履得其位，而近不與三五相得，如在舟而漏矣。而舟漏則濡溼，所以得濟者，有衣袽也。鄰於不親，而得全者，終日戒也，故曰“繻有衣袽，終日戒”也。" }
      - { type: j, text: "《象》曰：“終日戒”，有所疑也。" }
      - { type: z, text: "正義曰：“有所疑”者，釋所以“終日戒”，以不與三、五相得，懼其侵克，有所疑故也。" }
      - { type: j, text: "九五：東鄰殺牛，不如西鄰之禴祭，實受其福。牛，祭之盛者也。禴，祭之薄者也。居既濟之時，而處尊位，物皆盛矣，將何為焉？其所務者，祭祀而已。祭祀之盛，莫盛脩德，故沼沚之毛，蘋蘩之菜，可羞於鬼神，故“黍稷非馨，明德惟馨”，是以“東鄰殺牛，不如西鄰之禴祭，實受其福”也。" }
      - { type: z, text: "“九五東鄰”至“受其福”。○正義曰：牛，祭之盛者也。禴，殷春祭之名，祭之薄者也。九五居既濟之時，而處尊位，物既濟矣，將何為焉？其所務者，祭祀而已。祭祀之盛，莫盛脩德。九五履正居中，動不為妄，脩德者也。苟能脩德，雖薄可饗。假有東鄰不能脩德，雖復殺牛至盛，不為鬼神歆饗；不如我西鄰禴祭雖薄，能脩其德，故神明降福，故曰“東鄰殺牛，不如西鄰之禴祭，實受其福”也。○注“沼沚之毛”至“鬼神”。○正義曰：“沼沚之毛，蘋蘩之菜，可羞於鬼神”者，並略《左傳》之文也。" }
      - { type: j, text: "《象》曰：東鄰殺牛，不如西鄰之時也。在於合時，不在於豐也。" }
      - { type: z, text: "正義曰：“不如西鄰之時”者，神明饗德，能脩德致敬，合於祭祀之時雖薄降福，故曰時也。○注“在於合時”。○正義曰：“在於合時”者，《詩》云：“威儀孔時”。言周王廟中，群臣助祭，並皆威儀肅敬，甚得其時。此合時之義，亦當如彼也。" }
      - { type: j, text: "“實受其福”，吉大來也。" }
      - { type: z, text: "正義曰：“吉大來”者，非惟當身，福流後世。" }
      - { type: j, text: "上六：濡其首，厲。處既濟之極，既濟道窮，則之於未濟，之於未濟，則首先犯焉。過惟不巳，則遇於難，故濡其首也。將沒不久，危莫先焉。" }
      - { type: z, text: "正義曰：上六處既濟之極，則反於未濟。若反於未濟，則首先犯焉。若進而不已，必遇於難，故濡其首也。既被濡首，將沒不久，危莫先焉，故曰：“濡其首，厲”也。" }
      - { type: j, text: "《象》曰：“濡其首，厲”，何可久也？" }
      - { type: z, text: "正義曰：“何可久”者，首既被濡，身將陷沒，何可久長者也。" }
      - { type: j, text: "坎下離上。未濟：亨，小狐汔濟，濡其尾，無攸利。" }
      - { type: z, text: "正義曰：“未濟，亨”者，“未濟”者，未能濟渡之名也。未濟之時，小才居位，不能建功立德，拔難濟險。若能執柔用中，委任賢哲，則未濟有可濟之理，所以得通，故曰“未濟，亨”。“小狐汔濟，濡其尾，無攸利”者，汔者，將盡之名。小才不能濟難，事同小狐雖難渡水，而無餘力，必須水汔，方可涉川。未及登岸，而濡其尾，濟不免濡，豈有所利？故曰“小狐汔濟，濡其尾，無攸利”也。" }
      - { type: j, text: "《彖》曰：“未濟，亨”，柔得中也。以柔處中，不違剛也。能納剛健，故得亨也。" }
      - { type: z, text: "正義曰：此就六五以柔居中，下應九二，釋“未濟”所以得“亨”，柔而得中，不違剛也。與二相應，納剛自輔，故於未濟之世，終得亨通也。" }
      - { type: j, text: "“小狐汔濟”，未出中也。小狐不能涉大川，須汔然後乃能濟。處未濟之時，必剛健拔難，然後乃能濟，汔乃能濟，未能出險之中。" }
      - { type: z, text: "正義曰：“小狐汔濟，未出中也”者，釋小狐涉川，所以必須水汔乃濟，以其力薄，未能出險之中故也。" }
      - { type: j, text: "“濡其尾，無攸利”，不續終也。小狐雖能渡而無餘力。將濟而濡其尾，力竭於斯，不能續終。險難猶未足以濟也。濟未濟者，必有餘力也。" }
      - { type: z, text: "正義曰：濡尾力竭，不能相續而終，至於登岸，所以無攸利也。" }
      - { type: j, text: "雖不當位，剛柔應也。位不當，故未濟。剛柔應，故可濟。" }
      - { type: z, text: "正義曰：“雖不當位，剛柔應”者，重釋未濟之義，凡言未者，今日雖未濟，復有可濟之理。以其不當其位，故即時未濟；剛柔皆應，是得相拯，是有可濟之理。故稱“未濟”，不言“不濟”也。" }
      - { type: j, text: "《象》曰：火在水上，未濟。君子以慎辨物居方。辨物居方，令物各當其所也。" }
      - { type: z, text: "正義曰：“火在水上未濟”者，火在水上，不成烹飪，未能濟物。故曰“火在水上，未濟”。“君子以慎辨物居方”者，君子見未濟之時，剛柔失正，故用慎為德，辨別眾物，各居其方，使皆得安其所，所以濟也。" }
      - { type: j, text: "初六：濡其尾，吝。處未濟之初，最居險下，不可以濟者也。而欲之其應，進則溺身。未濟之始，始於既濟之上六也。濡其首猶不反，至於濡其尾，不知紀極者也。然以陰處下，非為進亢，遂其志者也。困則能反，故不曰兇。事在已量，而必困乃反，頑亦甚矣，故曰“吝”也。" }
      - { type: z, text: "“初六”至“吝”。○正義曰：初六處未濟之初，最居險下，而欲上之其應，進則溺身，如小狐之渡川，濡其尾也。未濟之始，始於既濟之上六也。既濟上六，但云“濡其首”，言始入於難，未沒其身。此言“濡其尾”者，進不知極，巳沒其身也。然以陰處下，非為進亢，遂其志者也。困則能反，故不曰兇。不能豫昭事之幾萌，困而後反，頑亦甚矣，故曰“吝”也。○注“不知紀極”。○正義曰：“不知紀極”者，《春秋傳》曰“聚斂積實，不知紀極，謂之饕餮”，言無休已也。" }
      - { type: j, text: "《象》曰：“濡其尾”，亦不知極也。" }
      - { type: z, text: "正義曰：“亦不知極”者，未濟之初，始於既濟之上六，濡首而不知，遂濡其尾，故曰“不知極”也。" }
      - { type: j, text: "九二：曳其輪，貞吉。體剛履中，而應於五，五體陰柔，應與而不自任者也。居未濟之時，處險難之中，體剛中之質，而見任與，拯救危難，經綸屯蹇者也。用健拯難，靖難在正，而不違中，故“曳其輪，貞吉”也。" }
      - { type: z, text: "正義曰：“曳其輪，貞吉”者，九二居未濟之時，處險難之內，體剛中之質，以應於五。五體陰柔，委任於二，令其濟難者也。經綸屯蹇，任重憂深，故曰“曳其輪”。“曳其輪”者，言其勞也。靖難在正，然後得吉，故曰“曳其輪，貞吉”也。" }
      - { type: j, text: "《象》曰：“九二”“貞吉”，中以行正也。位雖不正，中以行正也。" }
      - { type: z, text: "正義曰：“中以行正”者，釋九二失位而稱貞吉者，位雖不正，以其居中，故能行正也。" }
      - { type: j, text: "六三：未濟，徵兇。利涉大川。以陰之質，失位居險，不能自濟者也。以不正之身，力不能自濟，而求進焉，喪其身也。故曰“徵兇”也。二能拯難，而已比之，棄已委二，載二而行，溺可得乎？何憂未濟，故曰“利涉大川”。" }
      - { type: z, text: "正義曰：“未濟徵兇”者，六三以陰柔之質，失位居險，不能自濟者也。身既不能自濟，而欲自進求濟，必喪其身。故曰“未濟，徵兇”也。“利涉大川”者，二能拯難，而已比之，若能棄已委二，則沒溺可免，故曰“利涉大川”。" }
      - { type: j, text: "《象》曰：“未濟，徵兇”，位不當也。" }
      - { type: z, text: "正義曰：“位不當”者，以不當其位故有徵則兇。" }
      - { type: j, text: "九四：貞吉，悔亡。震用伐鬼方，三年有賞於大國。處未濟之時，而出險難之上，居文明之初，體乎剛質，以近至尊。雖履非其位，志在乎正，則吉而悔亡矣。其志得行，靡禁其威，故曰“震用伐鬼方”也。“伐鬼方”者，興衰之徵也。故每至興衰而取義焉。處文明之初，始出於難，其德未盛，故曰“三年”也。五居尊以柔，體乎文明之盛，不奪物功者也，故以大國賞之也。" }
      - { type: z, text: "正義曰：居未濟之時，履失其位，所以為悔。但出險難之外，居文明之初，以剛健之質，接近至尊，志行其正，正則貞吉而悔亡，故曰貞吉、悔亡。正志既行，靡禁其威，故震發威怒，用伐鬼方也。然處文明之初，始出於險，其德未盛，不能即勝，故曰“三年”也。五以順柔文明而居尊位，不奪物功。九四既克而還，必得百里大國之賞，故曰“有賞於大國”也。" }
      - { type: j, text: "《象》曰：“貞吉，悔亡”，志行也。" }
      - { type: z, text: "正義曰：“志行”者，釋九四失位而得“貞吉悔亡”者也。以其正志得行，而終吉故也。" }
      - { type: j, text: "六五：貞吉，無悔。君子之光，有孚，吉。以柔居尊，處文明之盛，為未濟之主，故必正然後乃吉，吉乃得無悔也。夫以柔順文明之質，居於尊位，付與於能，而不自役，使武以文，御剛以柔，斯誠君子之光也。付物以能，而不疑也，物則竭力，功斯克矣，故曰：“有孚，吉。”" }
      - { type: z, text: "正義曰：“貞吉，無悔”者，六五以柔居尊，處文明之盛，為未濟之主，故必正然後乃吉，吉乃得無悔，故曰“貞吉，無悔”也。“君子之光”者，以柔順文明之質，居於尊位，有應於二，是能付物以能，而不自役，有君子之光華矣，故曰“君子之光”也。“有孚，吉”者，付物以能而無疑焉，則物竭其誠，功斯克矣，故曰“有孚，吉”也。" }
      - { type: j, text: "《象》曰：“君子之光”，其暉吉也。" }
      - { type: z, text: "正義曰：“其暉吉”者，言君子之德，光暉著見，然後乃得吉也。" }
      - { type: j, text: "上九：有孚於飲酒，無咎。濡其首，有孚，失是。未濟之極，則反於既濟。既濟之道，所任者當也。所任者當，則可信之無疑，而已逸焉。故曰“有孚於飲酒，無咎”也。以其能信於物，故得逸豫而不憂於事之廢。苟不憂於事之廢，而耽於樂之甚，則至於失節矣。由於有孚，失於是矣，故曰“濡其首，有孚，失是”也。" }
      - { type: z, text: "正義曰：“有孚於飲酒，無咎”者，上九居未濟之極，則反於既濟。既濟之道，則所任者當也。所任者當，則信之無疑，故得自逸飲酒而已，故曰“有孚於飲酒，無咎”。“濡其首”者，既得自逸飲酒，而不知其節，則濡首之難，還復及之，故曰“濡其首”也。“有孚，失是”者，言所以濡首之難及之者，良由信任得人，不憂事廢，故失於是矣。故曰“有孚，失是”也。" }
      - { type: j, text: "《象》曰：“飲酒”“濡首”，亦不知節也。" }
      - { type: z, text: "正義曰：“亦不知節”者，釋飲酒所以致濡首之難，以其不知止節故也。" }
      - { type: j, text: "上一頁 目錄頁 下一頁" }
