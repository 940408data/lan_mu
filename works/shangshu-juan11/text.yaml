# 尚書正義卷十一（孔穎達疏）：j 為經文＋孔安國注，z 為正義疏文。
sections:
  - id: juan11
    name: 卷十一
    blocks:
      - { type: j, text: "武王伐殷，往伐歸獸，往誅紂克定，偃武修文，歸馬牛於華山桃林之牧地。○獸，徐始售反；本或作獸，許救反。識其政事，記識殷家政教善事以為法。作《武成》。武功成，文事修。" }
      - { type: z, text: "“武王”至“武成”○正義曰：武王之伐殷也，往則陳兵伐紂，歸放牛馬為獸，記識殷家美政善事而行用之。史敘其事，作《武成》。○傳“往誅”至“牧地”○正義曰：此序於經“於徵伐商”，是“往伐”也。“歸馬”、“放牛”是“歸獸”也。故傳引經以解之，《爾雅》有《釋獸》、《釋畜》，畜、獸形相類也，在野自生為獸，人家養之為畜。歸馬放牛，不復乘用，使之自生自死，若野獸然，故謂之“獸”。獸以野澤為家，故言“歸”也。○傳“記識”至“為法”○正義曰：紂以昏亂而滅，前世政有善者，故訪問殷家政教，記識善事以為治國之法，經雲“列爵惟五，分士惟三”是也。" }
      - { type: j, text: "武成文王受命，有此武功，成於克商。" }
      - { type: z, text: "“武成”○正義曰：此篇敘事多而王言少，惟辭又首尾不結，體裁異於餘篇。自“惟一月”至“受命於周”，史敘伐殷往反及諸侯大集，為王言發端也。自“王若曰”至“大統未集”，述祖父以來開建王業之事也。自“予小子”至“名山大川”，言己承父祖之意，告神陳紂之罪也。自“曰惟有道”至“無作神羞”，王自陳告神之辭也。“既戊午”已下，又是史敘往伐殺紂，入殷都佈政之事。“無作神羞”以下，惟告神，其辭不結，文義不成，非述作之體。案《左傳》荀偃禱河雲：“無作神羞，具官臣偃，無敢復濟，惟爾有神裁之。”蒯聵禱祖雲：“無作三祖羞，大命不敢請，佩玉不敢愛。”彼二者於“神羞”之下皆更申己意，此經“無作神羞”下更無語，直是與神之言猶尚未訖。且冢君百工初受周命，王當有以戒之，如《湯誥》之類。宜應說其除害與民更始，創以為惡之禍，勸以行道之福，不得大聚百官，惟誦禱辭而已。欲徵則殷勤誓眾，既克則空話禱神，聖人有作，理必不爾。竊謂“神羞”之下，更合有言，簡編斷絕，經失其本，所以辭不次耳。或初藏之日，已失其本；或壞壁得之，始有脫漏；故孔稱五十八篇以外，錯亂磨滅，不可復知。明是見在諸篇亦容脫錯，但孔此篇首尾具足，既取其文為之作傳，恥雲有所失落，不復言其事耳。○傳“文王”至“克商”○正義曰：“文王受命，有此武功”，《詩》之文也。彼言“武功”，謂始伐崇耳。殷紂尚在，其功未成，成功在於克商，今武始成矣，故以“武成”名篇，以《泰誓》繼文王之年，故本之於文王。鄭雲：“著武道至此而成。”" }
      - { type: j, text: "惟一月壬辰，旁死魄。此本說始伐紂時。一月，周之正月。旁，近也。月二日，近死魄。○旁，步光反。魄，普白反，《說文》作霸，匹革反，雲：“月始生魄然貌。”近，附近之近。越翼日癸巳，王朝步自周，於徵伐商。翼，明。步，行也。武王以正月三日行自周，往征伐商，二十八日渡孟津。厥四月，哉生明，王來自商，至於豐。其四月。哉，始也。始生明，月三日，與死魄互言。○哉，徐音載。豐，芳弓反，文王所都也。乃偃武修文，倒載干戈，包以虎皮，示不用。行禮射，設庠序，修文教。歸馬於華山之陽，放牛於桃林之野，示天下弗服。山南曰陽。桃林在華山東。皆非長養牛馬之地，欲使自生自死，示天下不復乘用。○華，胡化、胡瓜二反；華山在恆農。長，丁丈反。復，扶又反。丁未，祀於周廟，邦甸、侯、衛，駿奔走，執豆籩。四月丁未，祭告后稷以下、文考文王以上七世之祖。駿，大也。邦國甸侯、衛服諸侯皆大奔走於廟執事。○駿，荀俊反。豆，本又作梪。籩，音邊。上，時掌反。越三日庚戌，柴望，大告武成。燔柴郊天，望祀山川，先祖後郊，自近始。" }
      - { type: z, text: "“惟一”至“武成”○正義曰：此歷敘伐紂往反祖廟告天時日，說武功成之事也。“一月壬辰，旁死魄”，謂伐紂之年周正月辛卯朔，其二日是壬辰也。“翼日癸巳，王朝步自周，於徵伐商”，謂正月三日發鎬京始東行也。其月二十八日戊午渡河。《泰誓》序雲“一月戊午，師渡孟津”，《泰誓》中篇雲“惟戊午，王次於河朔”是也。二月辛酉朔，甲子殺紂，《牧誓》雲“時甲子昧爽，乃誓”是也。其年閏二月庚寅朔，三月庚申朔，四月己丑朔。“厥四月，哉生明，王來自商，至於豐”，謂四月三日，月始生明，其日當是辛卯也。“丁未，祀於周廟”，四月十九日也。“越三日庚戌，柴望”，二十二日也。正月始往伐，四月告成功，史敘其事，見其功成之次也。《漢書·律曆志》引《武成》篇雲：“惟一月壬辰，旁死魄。若翼日癸巳，武王乃朝步自周，於徵伐紂。越若來二月既死魄，越五日甲子，鹹劉商王紂。惟四月既旁生魄，越六日庚戌，武王燎於周廟。翼日辛亥，祀於天位。越五日乙卯，乃以庶國祀於周廟。”與此經不同。彼是焚書之後，有人偽為之。漢世謂之“逸書”，其後又亡其篇。鄭玄雲：“《武成》逸書，建武之際亡。”謂彼偽《武成》也。○傳“此本”至“死魄”○正義曰：將言武成，遠本其始。”此本說始伐紂時。一月，周之正月”，是建子之月，殷十二月也。此月辛卯朔，朔是死魄，故“月二日，近死魄”。“魄”者，形也，謂月之輪郭無光之處名“魄”也。朔後明生而魄死，望後明死而魄生。《律曆志》雲：“死魄，朔也。生魄，望也。”《顧命》雲：“惟四月哉生魄。”傳雲：“始生魄，月十六日也。”月十六日為始生魄，是一日為始死魄，二日近死魄也。顧氏解“死魄”與小劉同。大劉以三日為始死魄，二日為旁死魄。旁死魄無事而記之者，與下日為發端，猶今之將言日，必先言朔也。○傳“翼明”至“孟津”○正義曰：“翼，明”，《釋言》文。《釋宮》雲：“堂上謂之行，堂下謂之步。”彼相對為名耳。散則可以通，故“步”為行也。周去孟津千里，以正月三日行自周，二十八日渡孟津，凡二十五日，每日四十許裏，時之宜也。《詩》雲：“於三十里。”《毛傳》雲：“師行三十里。”蓋言其大法耳。○傳“其四”至“互言”○正義曰：“其四月”，此伐商之四月也。“哉，始”，《釋詁》文。《顧命》傳以“哉生魄”為十六日，則“哉生明”為月初矣。以三日月光見，故傳言“始生明，月三日”也。此經無日，未必非二日也。“生明”、“死魄”俱是月初，上雲“死魄”，此雲“生明”，而魄死明生互言耳。○傳“倒載”至“文教”○正義曰：《樂記》雲，武王克殷，“濟河而西。車甲釁而藏之府庫，倒載干戈，包之以虎皮，天下知武王之不復用兵也。散軍而郊射。左射，《貍首》。右射，《騶虞》。而貫革之射息也”。是“偃武修文”之事，故傳引之。郊射是禮射也。《王制》論四代學名雲：“虞謂之庠，夏謂之序。”故言“設庠序，修文教”也。○傳“山南”至“乘用”○正義曰：《釋山》雲：“山西曰夕陽，山東曰朝陽。”李巡曰：“山西暮乃見日，故曰夕陽。山東朝乃見日，故云朝陽。”“陽”以見日為名，故知“山南曰陽”。杜預雲：“桃林之塞，今宏農華陰縣潼關是也。”是在“華山東”也。指其所往謂之“歸”，據我釋之則雲“放”，“放牛”、“歸馬”互言之耳。華山之旁尤乏水草，非長養牛馬之地，欲使自生自死。此是戰時牛馬，故放之，示天下不復乘用。《易·系辭》雲：“服牛乘馬。”“服”、“乘”俱是用義，故以“服”總牛馬。○傳“四月”至“執事”○正義曰：以“四月”之字，隔文已多，故言“四月丁未”。此以成功設祭，明其遍告群祖，知告“后稷以下”。后稷則始祖以下，容毀廟也。天子七廟，故云“文考文王以上七世之祖”。見是周廟皆祭之，故經總雲“周廟”也。“駿，大”，《釋詁》文。《周禮》六服侯、甸、男、採、衛、要，此略舉邦國在諸侯服，故云“甸、侯、衛”，其言不次。《詩·頌》雲“駿奔走在廟。”故云：“皆大奔走於廟執事”也。○“越三日庚戌”○正義曰：《召誥》雲“越三日”者，皆從前至今為三日，此從丁未數之，則為四日，蓋史官不同，立文自異。或此“三”當為“四”，由字積與誤。" }
      - { type: j, text: "既生魄，庶邦冢君暨百工，受命於周。魄生明死，十五日之後，諸侯與百官受政命於周。明一統。○暨，其器反。" }
      - { type: z, text: "傳“魄生”至“一統”○正義曰：月以望虧，望是月半，望在十六日為多，通率在十六日者，四分居三，其一在十五日耳。此言“既生魄”，故言“魄生明死，十五日之後”也。“丁未，祀於周廟”，已是此月十九日矣，此“受命於周”，繼生魄言之，則受命在祀廟之前，故祀廟之時諸侯已奔走執事，豈得未受周命，已助周祭？明其受命在祀廟前矣。史官探其時日，先言告武成既訖，然後卻說受命，故文在下耳。諸侯與百官，舊有未屬周者，今皆受政命於周，於此時始天下一統也。顧氏以既生魄謂庚戌已後，雖十六日始生魄，從十六日至晦皆為生魄，但不知庚戌之後幾日耳。" }
      - { type: j, text: "王若曰：“嗚呼！群后，順其祖業歎美之，以告諸侯。惟先王建邦啟土，謂后稷也。尊祖，故稱先王。" }
      - { type: z, text: "傳“謂後”至“先王”○正義曰：此“先王”文在“公劉”之前，知“謂后稷也”。后稷非王，尊其祖，故稱先王。《周語》雲“昔我先王后稷”，又曰“我先王不窋”，韋昭雲：“王之先祖，故稱王。”《商頌》亦以契為“玄王”。文武之功，起於后稷，后稷始封於邰，故言“建邦啟土”。" }
      - { type: j, text: "公劉克篤前烈，后稷曾孫。公，爵。劉，名。能厚先人之業。" }
      - { type: z, text: "傳“后稷”至“之業”○正義曰：《周本紀》雲：“后稷卒，子不窋立。卒，子鞠陶立。卒，子公劉立。”是公劉為后稷曾孫也。《本紀》雲，公劉之後有公非、公祖之類，知“公”是爵。殷時未諱，故稱劉名。先公多矣，獨三人稱“公”，當時之意耳。《本紀》雲：“公劉復修后稷之業，百姓懷之，多徙而歸保焉。”周道之興，自此之後，是“能厚先人之業”也。" }
      - { type: j, text: "至於大王，肇基王跡，王季其勤王家。大王修德以翦齊商人，始王業之肇跡王季纘統其業，乃勤立王業。○大音太。肇音兆。王跡，於況反，又如字，注“王業”、“王功”同。" }
      - { type: z, text: "傳“大王”至“王家”○正義曰：《詩》雲：“后稷之孫，實惟大王。居岐之陽，實始翦商。”是大王翦齊商人，始王業之兆跡也。《周本紀》雲：“王季修古公之道，諸侯順之。”是能纘統大王之業，勤立王家之基本也。" }
      - { type: j, text: "我文考文王，克成厥勳，誕膺天命，以撫方夏。言我文德之父，能成其王功，大當天命，以撫綏四方中夏。大邦畏其力，小邦懷其德。言天下諸侯，大者畏威，小者懷德，是文王威德之大。" }
      - { type: z, text: "“大邦”至“其德”○正義曰：大邦力足拒敵，故言“畏其力”，小邦必畏矣。小邦或被棄遺，故言“懷其德”，大邦亦懷德矣。量事為文也。" }
      - { type: j, text: "惟九年，大統未集。言諸侯歸之，九年而卒，故大業未就。" }
      - { type: z, text: "傳“言諸”至“未就”○正義曰：文王斷虞芮之訟，諸侯歸之，改稱元年。至九年而卒，故云“大業未就”也。文王既未稱王，而得輒改元年者，諸侯自於其國各稱元年，是己之所稱，容或中年得改矣。《汲冢竹書》魏惠王有後元年，漢初文帝二元，景帝三元，此必有因於古也。伏生、司馬遷、韓嬰之徒不見此書，以為文王受命七年而崩，故鄭玄等皆依用之。" }
      - { type: j, text: "予小子其承厥志，言承文王本意。厎商之罪，告於皇天后土、所過名山大川，致商之罪，謂伐紂之時。后土，社也。名山，華嶽。大川，河。○厎，之履反。" }
      - { type: z, text: "傳“致商”至“川河”○正義曰：“致商之罪，謂伐紂之時”，欲將伐紂，告天乃發，故文在“所過”之上。《禮》天子出征，必類帝宜社。此告皇天后土，即《泰誓》上篇“類於上帝，宜於冢土”，故云“后土，社也。”昭二十九年《左傳》稱“句龍為后土”，后土為社是也。僖十五年《左傳》雲，戴皇天而履後上。彼晉大夫要秦伯，故以地神后土而言之，與此異也。自周適商，路過河華，故知所過名山華嶽、大川河也。山川大乃有名，“名”、“大”互言之耳。《周禮·大祝》雲：“王過大山川，則用事焉。”鄭雲：“用事，用祭事告行也。”" }
      - { type: j, text: "曰：‘惟有道曾孫周王發，將有大正於商。告天地山川之辭。大正，以兵徵之也。" }
      - { type: z, text: "“曰惟有道曾孫周王發”○正義曰：自稱“有道”者，聖人至公，為民除害，以紂無道，言己有道，所以告神求助，不得飾以謙辭也。稱“曾孫”者，《曲禮》說諸侯自稱之辭雲：“臨祭祀，內事曰孝子某侯某，外事曰曾孫某侯某。”哀二年《左傳》蒯聵禱祖亦自稱曾孫，皆是言己承藉上祖奠享之意。" }
      - { type: j, text: "今商王受無道，無道德。暴殄天物，害虐烝民，暴絕天物，言逆天也。逆天害民，所以為無道。○烝，之承反。" }
      - { type: z, text: "“暴殄”至“烝民”○正義曰：“天物”語闊，人在其間，以人為貴，故別言害民。則“天物”之言，除人外，普謂天下百物、鳥獸草木皆暴絕之。" }
      - { type: j, text: "為天下逋逃主，萃淵藪。逋，亡也。天下罪人逃亡者，而紂為魁主，窟聚淵府藪澤。言大奸。○萃，在醉反。藪，素口反。魁，苦回反。窟，口忽反。" }
      - { type: z, text: "傳“逋亡”至“大奸”○正義曰：“逋”亦逃也，故以為亡。罪人逃亡，而紂為魁主。“魁”，首也，言受用逃亡者，與之為魁首，為主人。“萃”訓聚也，言若蟲獸入窟，故云“窟聚”。水深謂之“淵”，藏物謂之“府”。史游《急就篇》雲：“司農少府國之淵。”“淵”、“府”類，故言“淵府”。水鍾謂之“澤”，無水則名“藪”。“藪”、“澤”大同，故言“藪澤”。“萃淵藪”三者各為物室，言紂與亡人為主，亡人歸之若蟲之窟聚，魚歸淵府，獸集藪澤，言紂為大奸也。據傳意，“主”字下讀為便。昭七年《左傳》引此文，杜預雲：“萃，集也。天下逋逃悉以紂為淵藪，集而歸之。”與孔異也。" }
      - { type: j, text: "予小子既獲仁人，敢祇承上帝，以遏亂略。仁人，謂大公、周、召之徒。略，路也。言誅紂敬承天意以絕亂路。○遏，烏末反。召，上照反，本又作邵。華夏蠻貊，罔不率俾。恭天成命，冕服採章曰華，大國曰夏，及四夷皆相率而使奉天成命。○貊，亡白反。俾，必爾反。" }
      - { type: z, text: "傳“冕服”至“成命”○正義曰：“冕服採章”對被髮左衽，則為有光華也。《釋詁》雲：“夏，大也。”故大國曰“夏華”。“夏”謂中國也。言“蠻貊”則戎夷可知也。言華夏及四夷皆相率而充己，使奉天成命，欲其共伐紂也。" }
      - { type: j, text: "肆予東征，綏厥士女。此謂十一年會孟津還時。惟其士女，篚厥玄黃，昭我周王。言東國士女筐篚盛其絲帛，奉迎道次。明我周王為之除害。○篚音匪。為，於偽反。天休震動，用附我大邑周。天之美應，震動民心，故用依附我。○應，應對之應。惟爾有神，尚克相予，以濟兆民，無作神羞。’”神庶幾助我渡民危害，無為神羞辱。○相，息亮反。" }
      - { type: j, text: "既戊午，師逾孟津。癸亥，陳於商郊，俟天休命。自河至朝歌，出四百里，五日而至。赴敵宜速，待天休命，謂夜雨止畢陳。○逾，亦作踰。陳，直刃反，計同，徐音塵。甲子昧爽，受率其旅若林，會於牧野。旅，眾也。如林，言盛多。會，逆距戰。罔有敵於我師，前徒倒戈，攻於後以北，血流漂杵。紂眾服周仁政，無有戰心，前徒倒戈，自攻於後以北走，血流漂舂杵。甚之言。○倒，丁老反。漂，四妙反，徐敷妙反，又四消反。杵，昌呂反。" }
      - { type: z, text: "“既戊午”至“我師”○正義曰：自此以下皆史辭也，其上闕絕，失其本絕，故文無次第。必是王言既終，史乃更敘戰事。於文次當承“自周，於徵伐商”之下，此句次之，故云“既戊午”也。史官敘事，得言“罔有敵於我師”，稱“我”者，猶如自漢至今，文章之士，雖民論國事，莫不稱“我”，皆雲“我大隨”，以心體國，故稱“我”耳，非要王言乃稱“我”也。○傳“自河”至“畢陳”○正義曰：“出四百里”，驗地為然。戊午明日猶誓於河朔，癸亥已陳於商郊，凡經五日，日行八十里，所以疾者，“赴敵宜速”也。《帝王世紀》雲：“王軍至鮪水，紂使膠鬲候周師，見王問曰：‘西伯將焉之？’王曰：‘將攻薛也。’膠鬲曰：‘然，原西伯無我欺。’王曰：‘不子欺也，將之殷。’膠鬲曰：‘何日至？’王曰：‘以甲子日，以是報矣。’膠鬲去而報命於紂。而雨甚，軍卒皆諫王曰：‘卒病，請休之。’王曰：‘吾已令膠鬲以甲子報其主矣。吾雨而行，所以救膠鬲之死也。’遂行，甲子至於商郊。”然則本期甲子，故遠行也。《周語》雲：“王以二月癸亥夜陳，未畢而雨。”是“雨止畢陳”也。“待天休命”，雨是天之美命也。韋昭雲：“雨者，天地神人和同之應也。”天地氣和乃有雨降，是雨為和同之應也。○傳“旅眾”至“距戰”○正義曰：“旅，眾”，《釋詁》文。《詩》亦云：“其會如林。”言盛多也。《本紀》雲：“紂發兵七十萬人以距武王。”紂兵雖則眾多，不得有七十萬人，是史官美其能破強敵，虛言之耳。○傳“紂眾”至“之言”○正義曰：“罔有敵於我師”，言紂眾雖多，皆無有敵我之心，故“自攻於後以北走”。自攻其後，必殺人不多，“血流漂舂杵，甚之言”也。《孟子》雲：“信《書》不如無《書》，吾於《武成》取二三策而已。仁者無敵於天下，以至仁伐不仁，如何其血流漂杵也？”是言不實也。《易·系辭》雲：“斷木為杵，掘地為臼。”是“杵”為臼器也。" }
      - { type: j, text: "一戎衣，天下大定。衣，服也。一著戎服而滅紂，言與眾同心，動有成功。乃反商政，政由舊。反紂惡政，用商先王善政。釋箕子囚，封比干墓，式商容閭。皆武王反紂政。囚，奴，徒隸。封，益其土。商容，賢人，紂所貶退，式其閭巷以禮賢。" }
      - { type: z, text: "傳“皆武”至“禮賢”○正義曰：紂囚其人而放釋之，紂殺其身而增封其墓，紂退其人而式其門閭，皆是“武王反紂政”也。下句散其財粟，亦是反紂，於此須有所解，因言之耳。上篇雲“囚奴正士”，《論語》雲：“箕子為之奴”，是紂囚之，又為奴役之。《周禮·司厲職》雲：“其奴男子入於罪隸。”鄭玄雲：“為之奴者，系於罪隸之官。”是“囚”為奴，以徒隸役之也。“商容”，賢人之姓名，紂所貶退，處於私室。“式”者，車上之橫木，男子立乘，有所敬則俯而憑式，遂以“式”為敬名。《說文》雲：“閭，族居里門也。”武王過其閭而式之，言此內有賢人，式之禮賢也。《帝王世紀》雲：“商容及殷民觀周軍之入，見畢公至，殷民曰：‘是吾新君也。’容曰：‘非也，視其為人嚴乎將有急色，故君子臨事而懼。’見太公至，民曰：‘是吾新君也。’容曰：‘非也，視其為人虎據而鷹趾，當敵將眾，威怒自倍，見利即前，不顧其後，故君子臨眾，果於進退。’見周公至，民曰：‘是吾新君也。’容曰：‘非也，視其為人忻忻休休，志在除賊，是非天子，則周之相國也，故聖人臨眾知之。’見武王至，民曰：‘是吾新君也。’容曰：‘然，聖人為海內討惡，見惡不怒，見善不喜，顏色相副，是以知之。’”是說商容之事也。" }
      - { type: j, text: "散鹿臺之財，發鉅橋之粟，紂所積之府倉，皆散發以賑貧民。○散，西旦反。" }
      - { type: z, text: "傳“紂所”至“貧民”○正義曰：藏財為府，藏粟為倉，故言“紂所積之府倉”也。名曰“鹿臺”，“巨橋”則其義未聞。“散”者言其分佈，“發”者言其開出，互相見也。《周本紀》雲：“命召公釋箕子之囚，命畢公釋百姓之囚，表商容之閭，命閎夭封比干之墓，命南宮括散鹿臺之錢，發鉅橋之粟以賑貧弱也。”然則武王親式商容之閭又表之也。《新序》雲“鹿臺其大三里，其高千尺”，則容物多矣。此言“鹿臺之財”，則非一物也。《史記》作“錢”，後世追論，以錢為主耳。《周禮》有泉府之官，《周語》稱景王鑄大錢，是周時已名泉為錢也。" }
      - { type: j, text: "大賚於四海，而萬姓悅服。施捨已債，救乏周無，所謂周有大賚，天下皆悅仁服德。○賚，力代反，徐音來。已音以。債，側界反。周音周，本亦作周。" }
      - { type: z, text: "傳“施捨”至“服德”○正義曰：《左傳》成十八年，晉悼公初立，“施捨，已責”。成二年楚將起師，“已責，救乏”。定五年“歸粟於蔡，以周急，矜無資也”。杜預以為“施恩惠，舍勞役”也，已責，“止逋責”也。皆是恤民之事，故傳引之以證“大賚”。“所謂周有大賚”，《論語》文。孔安國解《堯曰》之篇，有二帝三王之事，“周有大賚”正指此事，故言“所謂”也。“悅”是歡喜，“服”謂聽從，感恩則悅，見義則服，故“天下皆悅仁服德”也。《帝王世紀》雲：“王命封墓釋囚，又歸施鹿臺之珠玉及傾宮之女於諸侯，殷民鹹喜曰：‘王之於仁人也，死者猶封其墓，況生者乎？王之於賢人也，亡者猶表其閭，況存者乎？王之於財也，聚者猶散之，況其復籍之乎？王之於色也，見在者猶歸其父母，況其復徵之乎？’”是悅服之事也。" }
      - { type: j, text: "列爵惟五，即所識政事而法之。爵五等，公侯伯子男。分土惟三。列地封國，公侯方百里，伯七十里，子男五十里，為三品。" }
      - { type: z, text: "傳“列地”至“三品”○正義曰：爵五等，地三品，武王於此既從殷法，未知周公制禮亦然以否。《孟子》曰：“北宮錡問於孟子曰：‘周之班爵祿如何？’孟子曰：‘其詳不可得聞矣，嘗聞其略。天子之制，地方千里，公侯方百里，伯七十里，子男五十里。’”《漢書·地理志》亦云：“周爵五等，其土三等也，公侯百里，伯七十里，子男五十里。”漢世儒者多以為然，包鹹注《論語》雲：“千乘之國，百里之國也，謂大國惟百里耳。”《周禮·大司徒》雲：“諸公之地，封疆方五百里。侯四百里，伯三百里，子二百里，男一百里。”蓋是周室既衰，諸侯相併，自以國土寬大，皆違禮文，乃除去本經，妄為說耳。鄭玄之徒以為武王時大國百里，周公制禮大國五百里，《王制》之注具矣。" }
      - { type: j, text: "建官惟賢，立官以官賢才。位事惟能。居位理事，必任能事。重民五教，所重在民及五常之教。" }
      - { type: z, text: "“重民五教”○正義曰：以“重”總下五事，民與五教，“食喪祭”也。“五教”所以教民，故與“民”同句。下句“食”與“喪”、“祭”三者各為一事，相類而別，故以“惟”目之，言此皆聖王所重也。《論語》雲：“所重民食喪祭。”以《論語》即是此事，而彼無五教，錄《論語》者自略之耳。" }
      - { type: j, text: "惟食喪祭。民以食為命，喪禮篤親愛，祭祀崇孝養，皆聖王所重。○養，羊亮反。惇信明義，使天下厚行信，顯忠義。崇德報功，有德尊以爵，有功報以祿。垂拱而天下治。言武王所修皆是，所任得人，故垂拱而天下治。○任，而鴆反。治，直吏反。" }
      - { type: z, text: "“垂拱而天下治”○正義曰：《說文》雲：“拱，斂手也。”“垂拱而天下治”，謂所任得人，人皆稱職，手無所營，下垂其拱，故美其“垂拱而天下治”也。" }
      - { type: j, text: "《尚書正義》" }
