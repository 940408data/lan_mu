# 遵生八箋 卷十七 靈秘丹藥箋：點校中導覽（teaser）
# 原文據識典古籍四庫全書本，標點自施；導語/解讀為 AI 原創
sections:
  - id: lingshi
    name: 靈秘丹藥箋
    blocks:
      - type: j
        text: 靈秘丹藥箋
      - type: z
        text: 導：此箋輯奇方秘藥，溯醫道於羲皇華扁，以好生之德為本。薦語：好生之德、稽首傾囊。
      - type: j
        text: 高子曰：食藥者可以長年，仙經論之矣。故羲皇嚅藥製醫，治人百疾。自華、扁諸家，復遺方書，以利天下後世，好生之德，何無量哉！
      - type: z
        text: 讀：溯醫於羲皇、讚華扁——方書之纂，本是「好生」之舉，此箋立心端正。
      - type: j
        text: 余幼病羸，復苦瞆眼，僻喜談醫。自家居客游，路逢方士，靡不稽首傾囊，以索奇方秘藥，計今篇篇焉盈卷秩矣。
      - type: z
        text: 讀：「僻喜談醫」「稽首傾囊」，作者之痴可見；箋中諸方，皆一生求索所聚。
