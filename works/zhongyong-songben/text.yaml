# 中庸章句（当涂郡斋刊递修本·善本底）：j 为经传大字，z 为章句小字。版面结构先行：顶格经/退格注。
sections:
  - id: jing
    name: 首章
    blocks:
      - { type: z, text: 中庸朱熹章句中者不偏不倚無過不及之名庸平常也子程子曰不偏之謂中不易之謂庸中者天下之正道庸者天下之定理 }
      - { type: j, text: 此篇乃孔門傳授心法子思恐其乆而差也故筆之於書以授孟子其書始言一理中散爲萬事末復合爲一理放之則彌六合卷之則退藏於密其味無窮皆實學也善讀者玩索而 }
      - { type: z, text: 有得焉則終身用之有不能盡者矣命猶令也性即理也天以陰陽五行天命之謂性率性之謂道脩道之謂教化生萬物氣以成形而理亦賦焉猶命令也於是人物之生因各得其所賦之理以為健順五常之德所謂性也率循也道猶路也人物各循其性之自然則其日用事物之閒莫不各有當行之路是則所謂道也脩品節之也性道雖同而氣稟或異故不能無過不及之差聖人因人物之所當行者而品節之以為法於天下則謂之教若禮樂刑政之屬是也蓋人之所以為人道之所以為道聖人之所以為教原其所自無一不本於天而備於我學者知之則其於學知所用力而自不能已矣故子思於此首發明之讀者所宜深體而默識也 }
      - { type: j, text: 道也者不可須臾離也可離非道也是故君子戒慎乎其所不睹恐懼乎其所不聞 }
      - { type: z, text: 離去聲○道者日用事物當行之理皆性之德而具於心無物不有無時不然所以不可須臾離也若其可離則為外物而非道矣是以君子之心常存敬畏雖不見聞亦不敢忽所以存天理之本然而不使離於須臾之頃也 }
      - { type: j, text: 莫見乎隱莫顯乎微故君子慎其獨也 }
      - { type: z, text: 見音現○隱暗處也微細事也獨者人所不知而己所獨知之地也言幽暗之中細微之事跡雖未形而幾則已動人雖不知而己獨知之則是天 }
      - { type: j, text: 下之事無有著見明顯而過於此者 }
      - { type: z, text: 是以君子既常戒懼而於此尤加謹焉所以遏人欲於將萌而不使其滋長於隱微之中以至離道之遠也 }
      - { type: j, text: 喜怒哀樂之未發謂之中發而皆中節謂之和中也者天下之大本也和也者天下之達道也 }
      - { type: z, text: 樂音洛中節之中去聲○喜怒哀樂情也其未發則性也無所偏倚故謂之中發皆中節情之正也無所乖戾故謂之和大本者天命之性天下之理皆由此出道之體也達道者循性之謂天下古今之所共由道之用也此言性情之德以明道不可離之意致中和天地位焉萬物育焉致推而極之也位者安其所也育者遂其生也自戒懼而約之以至於至靜之中無少偏倚而其守不失則極其中而天地位矣自謹獨而精之以至於應物之處無少差謬而無適不然則極其和而萬物育矣蓋天地萬物本吾一體吾之心正則天地之心亦正矣吾之氣順則天地之氣亦順矣故其效驗至於如此此學問之極功聖人之能事初非有待於外而脩道之教亦在其中矣是其一體一用雖有動靜之殊然必其體立而後用有以行則其實亦非有兩事也故於此合而言之以結上文之意 }
      - { type: j, text: 右第一章子思述所傳之意以立 }
  - id: zhang2
    name: 第一章
    blocks:
      - { type: z, text: 言首明道之本原出於天而不可 }
      - { type: j, text: 易其實體備於已而不可離次言存養省察之要終言聖神功化之 }
      - { type: z, text: 極蓋欲學者於此反求諸身而自 }
      - { type: j, text: 得之以去夫外誘之私而充其本然之善楊氏所謂一篇之體要是 }
      - { type: z, text: 也其下十章蓋子思引夫子之言以終此章之義 }
      - { type: j, text: 仲尼曰君子中庸小人反中庸 }
      - { type: z, text: 中庸者不偏不倚無過不及而平常之理乃天命所當然精微之極致也唯君子爲能體之小人反是 }
      - { type: j, text: 君子之中庸也君子而時中小人之中庸也小人而無忌憚也 }
      - { type: z, text: 王肅本作小人之反中庸也程子亦 }
      - { type: j, text: 以為然今從之君子之所以為中 }
      - { type: z, text: 庸者以其有君子之德而又能隨時以處中也小人之所以反中庸者以其有小人之心而又無所忌憚也蓋中無定體隨時而在是乃平常之理也君子知其在我故能戒謹不睹恐懼不聞而無時不中小人不知有此則肆欲妄行而無所忌憚矣 }
      - { type: j, text: 右第二章 }
  - id: zhang3
    name: 第二章
    blocks:
      - { type: z, text: 此下十章皆論中庸以釋首章之義文雖不屬而意實相承也變和言庸者游氏曰以性情言之則曰中和以德行言之則曰中庸是也然中庸之中實兼中和之義 }
      - { type: j, text: 子曰中庸其至矣乎民鮮能乆矣 }
      - { type: z, text: 鮮上聲下同○過則失中不及則未至故惟中庸之德為至然亦人所同得初無難事但世教衰民不興行故鮮能之今已允耳論語無能字 }
      - { type: j, text: 右第三章子曰道之不行也我知之矣知者過之愚者不及也道之不明也我知之矣賢者過之不肖者不及也 }
  - id: zhang4
    name: 第三章
    blocks:
      - { type: z, text: 知者之知去聲○道者天理之當然中而已矣知愚賢不肖之過不及則生稟之異而失其中也知者知之過既以道為不足行愚者不及知又不知所以行此道之所以常不行也賢者行之過既以道為不足知不肖者不及行又不求所以知此道之所以常不明也人莫不飲食也鮮能知味也道不可離人自不察是以有過不及之弊 }
      - { type: j, text: 右第四章子曰道其不行矣夫 }
  - id: zhang5
    name: 第四章
    blocks:
      - { type: z, text: 夫音扶○由不明故不行 }
      - { type: j, text: 右第五章 }
  - id: zhang6
    name: 第五章
    blocks:
      - { type: z, text: 此章承上章而舉其不行之端以起下章之意 }
      - { type: j, text: 子曰舜其大知也與舜好問而好察邇言隱惡而揚善執其兩端用其中於民其斯以為舜乎 }
      - { type: z, text: 知去聲與平聲好去聲○舜之所以為大知者以其不自用而取諸人也邇言者淺近之言猶必察焉其無遺善可知然於其言之未善者則隱而不宣其善者則播而不匿其廣大光明又如此則人孰不樂告以善哉兩端謂衆論不同之極致蓋凡物皆有兩端如小大厚薄之類於善之中又執其兩端而量度以取中然後用之則其擇之審而行之至矣然非在我之權度精切不差何以與此此知之所以無過不及而道之所以行也 }
      - { type: j, text: 右第六章子曰人皆曰予知驅而納諸罟擭陷阱之中而莫之知辟也人皆曰予知擇乎中庸而不能期月守也 }
  - id: zhang7
    name: 第六章
    blocks:
      - { type: z, text: 予知之知去聲罟音古胡化反阱才性反辟避同期居之反○罟網也擭機檻也陷阱坑坎也皆所以揜取禽獸者也擇乎中庸辨别衆理以求所謂中庸即上章好問用中之事也期月匝一月也言知禍而不知辟以況能擇而不能守皆不得爲知也 }
      - { type: j, text: 右第七章 }
  - id: zhang8
    name: 第七章
    blocks:
      - { type: z, text: 承上章大知而言又舉不明之端以起下章也 }
      - { type: j, text: 子曰回之爲人也擇乎中庸得一善則拳拳服膺而弗失之矣 }
      - { type: z, text: 回孔子弟子顔淵名拳拳奉持之貌服猶著也膺胷也奉持而著之心胷之閒言能守也顔子蓋眞知之故能擇能守如此此行之所以無過不及而道之所以明也 }
      - { type: j, text: 右第八章子曰天下國家可均也爵禄可辭也白刃可蹈也中庸不可能也 }
  - id: zhang9
    name: 第八章
    blocks:
      - { type: z, text: 均平治也三者亦知仁勇之事天下之至難也然不必其合於中庸則質之近似者皆能以力爲之若中庸則雖不必皆如三者之難然非義精仁熟而無一毫人欲之私者不能及也三者難而易中庸易而難此民之所以鮮能也 }
      - { type: j, text: 右第九章 }
  - id: zhang10
    name: 第九章
    blocks:
      - { type: z, text: 亦承上章以起下章 }
      - { type: j, text: 子路問強 }
      - { type: z, text: 子路孔子弟子仲由也子路好勇故問強 }
      - { type: j, text: 子曰南方之強與北方之強與抑而強與 }
      - { type: z, text: 與平聲○抑語辭而汝也 }
      - { type: j, text: 寬柔以教不報無道南方之強也君子居之 }
      - { type: z, text: 寬柔以教謂含容巽順以誨人之不及也不報無道謂橫逆之來直受之而不報也南方風氣柔弱故以含忍之力勝人為強君子之道也 }
      - { type: j, text: 衽金革死而不厭北方之強也而強者居之 }
      - { type: z, text: 衽席也金戈兵之屬革甲冑之屬北方風氣剛勁故以果敢之力勝人為 }
      - { type: j, text: 強強者之事也故君子和而不流強哉矯中立而不倚強哉矯國有道不變塞焉強哉矯國無道至死不變強哉矯 }
      - { type: z, text: 此四者汝之所當強也矯強貌詩曰矯矯虎臣是也倚偏著也塞未達也國有道不變未達之所守國無道不變平生之所守也此則所謂中庸之不可能者非有以自勝其人欲之私不能擇而守也君子之強孰大於是夫子以是告子路者所以抑其血氣之剛而進之以德義之勇也 }
      - { type: j, text: 右第十章子曰素隱行怪後世有述焉吾弗爲之矣 }
  - id: zhang11
    name: 第十章
    blocks:
      - { type: z, text: 素按漢書當作索蓋字之誤也索隱行怪言深求隱僻之理而過爲詭異之行也然以其足以欺世而盜名故後世或有稱述之者此知之過而不擇乎善行之過而不用其中不當強而強者也聖人豈爲之哉 }
      - { type: j, text: 君子遵道而行半塗而廢吾弗能已矣 }
      - { type: z, text: 遵道而行則能擇乎善矣半塗而廢則力之不足也此其知雖足以及之而行有不逮當強而不強者也已止也聖人於此非勉焉而不敢廢蓋至誠無息自有所不能止也 }
      - { type: j, text: 君子依乎中庸遯世不見知而不悔唯聖者能之 }
      - { type: z, text: 不為索隱行恠則依乎中庸而已不能半塗而廢是以遯世不見知而不悔也此中庸之成德知之盡仁之至不賴勇而裕如者正吾夫子之事而 }
      - { type: j, text: 猶不自居也故曰唯聖者能之而已右第十一章 }
  - id: zhang12
    name: 第十一章
    blocks:
      - { type: z, text: 子思所引夫子之言以明首章之義者止此蓋此篇大旨以知仁勇三達德為入道之門故於篇首即以大舜顏淵子路之事明之舜知也颜渊仁也子路勇也三者废其一则无以造道而成德矣余见第二十章 }
      - { type: j, text: 君子之道费而隐 }
      - { type: z, text: 费符味反○费用之广也隐体之微也 }
      - { type: j, text: 夫妇之愚可以与知焉及其至也虽圣人亦有所不知焉夫妇之不肖可以能行焉及其至也虽圣人亦有所不能焉天地之大也人犹有所憾故君子语大天下莫能载焉语小天下莫能破焉 }
      - { type: z, text: 与去声○君子之道近自夫妇居室 }
      - { type: j, text: 之闲远而至於圣人天地之所不能尽其大无外其小无内可谓费矣然其理之所以然则隐而莫之见也盖可知可能者道中之一事及其至而 }
      - { type: z, text: 聖人不知不能則舉全體而言聖人固有所不能盡也侯氏曰聖人所不知如孔子問禮問官之類所不能如孔子不得位堯舜病博施之類愚謂人所憾於天地如覆載生成之偏及寒暑灾祥之不得其正者 }
      - { type: j, text: 詩云鳶飛戾天魚躍于淵言其上下察也 }
      - { type: z, text: 鳶余專反○詩大雅旱麓之篇鳶鴟類戾至也察著也子思引此詩以明化育流行上下昭著莫非此理之用所謂費也然其所以然者則非見聞所及所謂隱也故程子曰此一節子思喫緊為人處活潑潑地讀者其致思焉 }
      - { type: j, text: 君子之道造端乎夫婦及其至也察乎天地 }
      - { type: z, text: 結上文 }
      - { type: j, text: 右第十二章子思之言蓋以申明首章道不可離之意也其下八章 }
  - id: zhang13
    name: 第十二章
    blocks:
      - { type: z, text: 雜引孔子之言以明之 }
      - { type: j, text: 子曰道不遠人人之為道而遠人不可以為道 }
      - { type: z, text: 道者率性而已固衆人之所能知能行者也故常不遠於人若為道者厭其卑近以為不足為而反務為高遠難行之事則非所以為道矣 }
      - { type: j, text: 詩云伐柯伐柯其則不遠執柯以伐柯睨而視之猶以為遠故君子以人治人改而止 }
      - { type: z, text: 睨研計反○詩豳風伐柯之篇柯斧柄則法也睨邪視也言人執柯伐木以爲柯者彼柯長短之法在此柯耳然猶有彼此之別故伐者視之猶以爲遠也若以人治人則所以爲人之道各在當人之身初無彼此之別故君子之治人也即以其人之道還治其人之身其人能改即止不治蓋責之以其所能知能行非欲其遠人以爲道也張子所謂以衆人望人則易從是也 }
      - { type: j, text: 忠恕違道不遠施諸己而不願亦勿施於人 }
      - { type: z, text: 盡己之心爲忠推己及人爲恕違去也如春秋傳齊師違穀七里之違言自此至彼相去不遠非背而去之之謂也道即其不遠人者是也施諸己而不願亦勿施於人忠恕之事也以己之心度人之心未嘗不同則道之不遠於人者可見故己之所不欲則勿以施之於人亦不遠人以爲道之事張子所謂以愛己之心愛人則盡仁是也 }
      - { type: j, text: 君子之道四丘未能一焉所求乎子以事父未能也所求乎臣以事君未能也所求乎弟以事兄未能也所求乎朋友先施之未能也庸德之行庸言之謹有所不足不敢不勉有餘不敢盡言顧行行顧言君子胡不慥慥爾 }
      - { type: z, text: 子臣弟友四字絶句○求猶責也道不遠人凡己之所以責人者皆道之所當然也故反之以自責而自脩焉庸平常也行者踐其實謹者擇其可德不足而勉則行益力言有餘而訒則謹益至謹之至則言顧行矣行之力則行顧言矣慥慥篤實貌言君子之言行如此豈不慥慥乎賛美之也凡此皆不逺人以爲道之事張子所謂以責人之心責己則盡道是也 }
      - { type: j, text: 右第十三章 }
  - id: zhang14
    name: 第十三章
    blocks:
      - { type: z, text: 道不逺人者夫婦所能丘未能一者聖人所不能皆費也而其所以然者則至隱存焉下章放此 }
      - { type: j, text: 君子素其位而行不願乎其外 }
      - { type: z, text: 素猶見在也言君子但因見在所居之位而爲其所當爲無慕乎其外之心也 }
      - { type: j, text: 素富貴行乎富貴素貧賤行乎貧賤素夷狄行乎夷狄素患難行乎患難君子無入而不自得焉 }
      - { type: z, text: 難去聲○此言素其位而行也 }
      - { type: j, text: 在上位不陵下在下位不援上正己而不求於人則無怨上不怨天下不尤人 }
      - { type: z, text: 援平聲○此言不願乎其外也 }
      - { type: j, text: 故君子居易以俟命小人行險以徼幸 }
      - { type: z, text: 易去聲○易平地也居易素位而行也俟命不願乎外也徼求也幸謂所不當得而得者 }
      - { type: j, text: 子曰射有似乎君子失諸正鵠反求諸其身 }
      - { type: z, text: 正音征鵠工毒反○畫布曰正棲皮曰鵠皆侯之中射之的也子思引此孔子之言以結上文之意 }
      - { type: j, text: 右第十四章 }
  - id: zhang15
    name: 第十四章
    blocks:
      - { type: z, text: 子思之言也凡章首無子曰字者放此 }
      - { type: j, text: 君子之道辟如行遠必自邇辟如登高必自卑 }
      - { type: z, text: 辟譬同 }
      - { type: j, text: 詩曰妻子好合如鼓瑟琴兄弟既翕和樂且耽宜爾室家樂爾妻帑 }
      - { type: z, text: 好去聲耽詩作湛亦音耽樂音洛○詩小雅常棣之篇鼓瑟琴和也翕亦合也耽亦樂也帑子孫也 }
      - { type: j, text: 子曰父母其順矣乎 }
      - { type: z, text: 夫子誦此詩而賛之曰人能和於妻子宜於兄弟如此則父母其安樂之矣子思引詩及此語以明行遠自邇登高自卑之意 }
      - { type: j, text: 右第十五章子曰鬼神之爲德其盛矣乎 }
  - id: zhang16
    name: 第十五章
    blocks:
      - { type: z, text: 程子曰鬼神天地之功用而造化之迹也張子曰鬼神者二氣之良能也愚謂以二氣言則鬼者陰之靈也神者陽之靈也以一氣言則至而伸者為神反而歸者為鬼其實一物而已為德猶言性情功效 }
      - { type: j, text: 視之而弗見聽之而弗聞體物而不可遺 }
      - { type: z, text: 鬼神無形與聲然物之終始莫非陰陽合散之所為是其為物之體而物所不能遺也其言體物猶易所謂幹事 }
      - { type: j, text: 使天下之人齊明盛服以承祭祀洋洋乎如在其上如在其左右 }
      - { type: z, text: 齊側皆反○齊之為言齊也所以齊不齊而致其齊也明猶潔也洋洋流動充滿之意能使人畏敬奉承而發見昭著如此乃其體物而不可遺之驗也孔子曰其氣發揚于上為昭明焄蒿悽愴此百物之精也神之著也 }
      - { type: j, text: 正謂此爾詩曰神之格思不可度思矧可射思 }
      - { type: z, text: 度待洛反射音亦詩作斁○詩大雅抑之篇格來也矧況也射厭也言厭怠而不敬也思語辭 }
      - { type: j, text: 夫微之顯誠之不可揜如此夫 }
      - { type: z, text: 夫音扶○誠者真實無妄之謂陰陽合散無非實者故其發見之不可揜 }
      - { type: j, text: 如此右第十六章 }
  - id: zhang17
    name: 第十六章
    blocks:
      - { type: z, text: 不見不聞隱也體物如在則亦費矣此前三章以其費之小者而言此後三章以其費之大者而言此一章兼費隱包大小而言 }
      - { type: j, text: 子曰舜其大孝也與德為聖人尊為天子富有四海之内宗廟饗之子孫保之 }
      - { type: z, text: 與平聲○子孫謂虞思陳胡公之屬 }
      - { type: j, text: 故大德必得其位必得其禄必得其名必得其壽 }
      - { type: z, text: 舜年百有十歲 }
      - { type: j, text: 故天之生物必因其材而篤焉故栽者培之傾者覆之 }
      - { type: z, text: 材質也篤厚也栽植也氣至而滋息為培氣反而遊散則覆 }
      - { type: j, text: 詩曰嘉樂君子憲憲令德宜民宜人受禄于天保佑命之自天申之 }
      - { type: z, text: 詩大雅假樂之篇假當依此作嘉憲當依詩作顯申重也故大德者必受命受命者受天命為天子也 }
      - { type: j, text: 右第十七章 }
  - id: zhang18
    name: 第十七章
    blocks:
      - { type: z, text: 此由庸行之常推之以極其至見道之用廣也而其所以然者則為體微矣後二章亦此意 }
      - { type: j, text: 子曰無憂者其惟文王乎以王季為父以武王為子父作之子述之 }
      - { type: z, text: 此言文王之事書言王季其勤王家蓋其所作亦積功累仁之事也 }
      - { type: j, text: 武王纘大王王季文王之緒壹戎衣而有天下身不失天下之顯名尊為天子富有四海之內宗廟饗之子孫保之 }
      - { type: z, text: 大音泰下同○此言武王之事纘繼也大王王季之父也書云大王肇基王迹詩云至于大王實始翦商緒業也戎衣甲冑之屬壹戎衣武成文言一著戎衣以伐紂也 }
      - { type: j, text: 武王末受命周公成文武之德追王大王王季上祀先公以天子之禮斯禮也達乎諸侯大夫及士庶人父爲大夫子爲士葬以大夫祭以士父爲士子爲大夫葬以士祭以大夫期之喪達乎大夫三年之喪達乎天子父母之喪無貴賤一也 }
      - { type: z, text: 追王之王去聲○此言周公之事末猶老也追王蓋推文武之意以及乎王迹之所起也先公組紺以上至后也上祀先公以天子之禮又推大王王季之意以及於無窮也制爲禮法以及天下使葬用死者之爵祭用生者之禄喪服自期以下諸侯絶大夫降而父母之喪上下同之推己以及人也 }
      - { type: j, text: 右第十八章子曰武王周公其達孝矣乎 }
  - id: zhang19
    name: 第十八章
    blocks:
      - { type: z, text: 達通也承上章而言武王周公之孝乃天下之人通謂之孝猶孟子之言達尊也 }
      - { type: j, text: 夫孝者善繼人之志善述人之事者也 }
      - { type: z, text: 上章言武王纘大王王季文王之緒以有天下而周公成文武之德以追崇其先祖此繼志述事之大者也下文又以其所制祭祀之禮通于上下者言之 }
      - { type: j, text: 春秋脩其祖廟陳其宗器設其裳衣薦其時食 }
      - { type: z, text: 祖廟天子七諸侯五大夫三適士二官師一宗器先世所藏之重器若周之赤刀大訓天球河圖之屬也裳衣先祖之遺衣服祭則設之以授尸也時食四時之食各有其物如春行羔豚膳膏香之類是也 }
      - { type: j, text: 宗廟之禮所以序昭穆也序爵所以辨貴賤也序事所以辨賢也旅酬下爲上所以逮也燕毛所以序齒也 }
      - { type: z, text: 昭如字爲去聲○宗廟之次左爲昭右爲穆而子孫亦以爲序有事於大廟則子姓兄弟羣昭穆咸在而不失其倫焉爵公侯卿大夫也事宗祝有司之職事也旅衆也酬導飲也旅酬之禮賓弟子兄弟之子各舉觶於其長而衆相酬蓋宗廟之中以有事為榮故逮及賤者使亦得以申其敬也燕毛祭畢而燕則以毛髮之色別長幼為坐次也齒年數也 }
      - { type: j, text: 踐其位行其禮奏其樂敬其所尊愛其所親事死如事生事亡如事存孝之至也 }
      - { type: z, text: 踐猶履也其指先王也所尊所親先王之祖考子孫臣庶也始死謂之死既葬則曰反而亡焉皆指先王也此結上文兩節皆繼志述事之意也 }
      - { type: j, text: 郊社之禮所以事上帝也宗廟之禮所以祀乎其先也明乎郊社之禮禘嘗之義治國其如示諸掌乎 }
      - { type: z, text: 郊祀天社祭地不言后土者省文也禘天子宗廟之大祭追祭太祖之所自出於太廟而以太祖配之也嘗秋祭也四時皆祭舉其一耳禮必有義對舉之互文也示與視同視諸掌言易見也此與論語文意大同小異記有詳略耳 }
      - { type: j, text: 右第十九章 }
  - id: zhang20
    name: 第十九章
    blocks:
      - { type: z, text: 哀公問政哀公魯君名蔣 }
      - { type: j, text: 子曰文武之政布在方策其人存則其政舉其人亡則其政息 }
      - { type: z, text: 方版也策簡也息猶滅也有是君有是臣則有是政矣 }
      - { type: j, text: 人道敏政地道敏樹夫政也者蒲盧也 }
      - { type: z, text: 夫音扶○敏速也蒲盧沈括以爲蒲葦是也以人立政猶以地種樹其成速矣而蒲葦又易生之物其成尤速也言人存政舉其易如此 }
      - { type: j, text: 故為政在人取人以身身以道脩道以仁 }
      - { type: z, text: 此承上文人道敏政而言也為政在人家語作為政在於得人語意尤備人謂賢臣身指君身道者天下之達道仁者天地生物之心而人得以生者所謂元者善之長也言人君為政在於得人而取人之則又在脩身能仁其身則有君有臣而政無不舉矣 }
      - { type: j, text: 仁者人也親親為大義者宜也尊賢為大親親之殺尊賢之等禮所生也 }
      - { type: z, text: 殺去聲○人指人身而言具此生理自然便有惻怛慈愛之意深體味之可見宜者分別事理各有所宜也禮則節文斯二者而已 }
      - { type: j, text: 在下位不獲乎上民不可得而治矣 }
      - { type: z, text: 鄭氏曰此句在下誤重在此 }
      - { type: j, text: 故君子不可以不脩身思脩身不可以不事親思事親不可以不知人思知人不可以不知天為政在人取人以身故不可以不脩身脩身以道脩道以仁故思脩身不 }
      - { type: z, text: 可以不事親欲盡親親之仁必由尊賢之義故又當知人親親之殺尊賢之等皆天理也故又當知天 }
      - { type: j, text: 天下之達道五所以行之者三曰君臣也父子也夫婦也昆弟也朋友之交也五者天下之達道也知仁勇三者天下之達德也所以行之者一也 }
      - { type: z, text: 知去聲○達道者天下古今所共由之路即書所謂五典孟子所謂父子有親君臣有義夫婦有别長幼有序 }
      - { type: j, text: 朋友有信是也知所以知此也仁所以體此也勇所以強此也謂之達德 }
      - { type: z, text: 者天下古今所同得之理也一則誠而已矣達道雖人所共由然無是三德則無以行之達德雖人所同得然一有不誠則人欲閒之而德非其德矣程子曰所謂誠者止是誠實此三者三者之外更别無誠 }
      - { type: j, text: 或生而知之或學而知之或困而知之及其知之一也或安而行之或利而行之或勉強而行之及其成功一也 }
      - { type: z, text: 強上聲○知之者之所知行之者之所行謂達道也以其分而言則所以 }
      - { type: j, text: 知者知也所以行者仁也所以至於 }
      - { type: z, text: 知之成功而一者勇也以其等而言則生知安行者知也學知利行者仁也困知勉行者勇也蓋人性雖無不善而氣稟有不同者故聞道有蚤莫行道有難易然能自強不息則其至一也吕氏曰所入之塗雖異而所至之域則同此所以爲中庸若乃企生知安行之資爲不可幾及輕困知勉行謂不能有成此道之所以不明不 }
      - { type: j, text: 行也子曰好學近乎知力行近乎仁知恥近乎勇 }
      - { type: z, text: 子曰二字衍文好近乎知之知並去聲此言未及乎達德而求以入德之事通上文三知爲知三行爲仁則此三近者勇之次也吕氏曰愚者自是而不求自私者徇人欲而忘反懦者甘爲人下而不辭故好學非知然足以破愚力行非仁然足以忘私知恥非勇然足以起懦 }
      - { type: j, text: 知斯三者則知所以脩身知所以脩身則知所以治人知所以治人則知所以治天下國家矣 }
      - { type: z, text: 斯三者指三近而言人者對己之稱天下國家則盡乎人矣言此以結上文脩身之意起下文九經之端也 }
      - { type: j, text: 凡為天下國家有九經曰脩身也尊賢也親親也敬大臣也體羣臣也子庶民也來百工也柔遠人也懷諸侯也 }
      - { type: z, text: 經常也體謂設以身處其地而察其心也子如父母之愛其子也柔遠人所謂無忘賓旅者也此列九經之目也呂氏曰天下國家之本在身故脩身為九經之本然必親師友然後脩身之道進故尊賢次之道之所進莫先其家故親親次之由家以及朝廷故敬大臣體羣臣次之由朝廷以及其國故子庶民來百工次之由其國 }
      - { type: j, text: 以及天下故柔遠人懷諸侯次之此 }
      - { type: z, text: 九經之序也視羣臣猶吾四體視百姓猶吾子此視臣視民之別也 }
      - { type: j, text: 脩身則道立尊賢則不惑親親則諸父昆弟不怨敬大臣則不眩體臣則士之報禮重子庶民則百姓勸來百工則財用足柔遠人則四方歸之懷諸侯則天下畏之 }
      - { type: z, text: 此言九經之效也道立謂道成於己而可為民表所謂建其有極是也不惑謂不疑於理不眩謂不迷於事敬大臣則信任專而小臣不得以閒之故臨事而不眩也來百工則通功易事農末相資故財用足柔遠人則天下之旅皆悅而願出於其塗故四方歸懷諸侯則德之所施者博而威之所制者廣矣故曰天下畏之 }
      - { type: j, text: 齊明盛服非禮不動所以脩身也去讒遠色賤貨而貴德所以勸賢也尊其位重其禄同其好惡所以勸親親也官盛任使所以勸大臣也忠信重禄所以勸士也時使薄歛所以勸百姓也日省月試既稟稱事所以勸百工也送往迎來嘉善而矜不能所以柔遠人也繼絕世舉廢國治亂持危朝聘以時厚往而薄來所以懷諸侯也 }
      - { type: z, text: 齊側皆反去上聲遠好惡歛並去聲既許氣反稟彼錦力錦二反稱去聲朝音潮○此言九經之事也官盛任使謂官屬衆盛足任使令也蓋大臣不當親細事故所以優之者如此忠信重禄謂待之誠而養之厚蓋以身體之而知其所賴乎上者如此也旣讀曰餼餼稟稍食也稱事如周禮槀人職曰考其弓弩以上下其食是也往則爲之授節以送之來則豐其委積以迎之朝謂諸侯見於天子聘謂諸侯使大夫來獻王制比年一小聘三年一大聘五年一朝厚往薄來謂燕賜厚而納貢薄 }
      - { type: j, text: 凡爲天下國家有九經所以行之者一也 }
      - { type: z, text: 一者誠也一有不誠則是九者皆爲虛文矣此九經之實也 }
      - { type: j, text: 凡事豫則立不豫則廢言前定則不跲事前定則不困行前定則不疚道前定則不窮 }
      - { type: z, text: 其劫反行去聲○凡事指達道達德九經之屬豫素定也跲躓也疚病也此承上文言凡事皆欲先立乎誠如下文所推是也 }
      - { type: j, text: 在下位不獲乎上民不可得而治矣獲乎上有道不信乎朋友不獲乎上矣信乎朋友有道不順乎親不信乎朋友矣順乎親有道反諸身不誠不順乎親矣誠身有道不明乎善不誠乎身矣 }
      - { type: z, text: 此又以在下位者推言素定之意反諸身不誠謂反求諸身而所存所發未能真實而無妄也不明乎善謂未能察於人心天命之本然而真知至 }
      - { type: j, text: 善之所在也誠者天之道也誠之者人之道也誠者不勉而中不思而得從容中道聖人也誠之者擇善而固執之者也 }
      - { type: z, text: 中並去聲從七容反○此承上文誠身而言誠者真實無妄之謂天理之本然也誠之者未能真實無妄而欲其真實無妄之謂人事之當然也聖人之德然天理真實無妄不待思 }
      - { type: j, text: 勉而從容中道則亦天之道也未至 }
      - { type: z, text: 於聖則不能無人欲之私而其為德不能皆實故未能不思而得則必擇善然後可以明善未能不勉而中則必固執然後可以誠身此則所謂人 }
      - { type: j, text: 之道也不思而得生知也不勉而中 }
      - { type: z, text: 安行也擇善學知以下之事固執利 }
      - { type: j, text: 行以下之事也博學之審問之慎思之明辨之篤行之 }
      - { type: z, text: 此誠之之目也學問思辨所以擇善而為知學而知也篤行所以固執而為仁利而行也程子曰五者廢其一非學也 }
      - { type: j, text: 有弗學學之弗能弗措也有弗問問之弗知弗措也有弗思思之弗得弗措也有弗辨辨之弗明弗措也有弗行行之弗篤弗措也人一能之己百之人十能之己千之 }
      - { type: z, text: 君子之學不為則已為則必要其成故常百倍其功此困而知勉而行者也勇之事也 }
      - { type: j, text: 果能此道矣雖愚必明雖柔必強 }
      - { type: z, text: 明者擇善之功強者固執之效呂氏曰君子所以學者為能變化氣質而已德勝氣質則愚者可進於明柔者可進於強不能勝之則雖有志於學亦愚不能明柔不能立而已矣蓋均善而無惡者性也人所同也昏明強弱之稟不齊者才也人所異也誠之者所以反其同而變其異也夫以不美之質求變而美非百倍其功不足以致之今以鹵莽滅裂之學或作或輟以變其不美之質及不能變則曰天質不美非學所能變是果於自棄其為不仁甚矣 }
      - { type: j, text: 右第二十章 }
  - id: zhang21
    name: 第二十章
    blocks:
      - { type: z, text: 此引孔子之言以繼大舜文武周公之緒明其所傳之一致舉而措之亦猶是耳蓋包費隱兼小大以終十二章之意章內語誠始詳而所謂誠者實此篇之樞紐也又按孔子家語亦載此章而其文尤詳成功一也之下有公曰子之言美矣至矣寡人實固不足以成之也故其下復以子曰起答辭今無此問詞而猶有子曰二字蓋子思刪其繁文以附于篇而所刪有不盡者今當為衍文也博學之以下家語無之意彼有闕文抑此或子思所補也歟 }
      - { type: j, text: 自誠明謂之性自明誠謂之教誠則明矣明則誠矣 }
      - { type: z, text: 自由也德無不實而明無不照者聖人之德所性而有者也天道也先明乎善而後能實其善者賢人之學由 }
      - { type: j, text: 教而入者也人道也誠則無不明矣明則可以至於誠矣右第二十一章子思承上章夫子天道人道之意而立言也自此以下十二章皆子思之言以反覆推 }
  - id: zhang22
    name: 第二十一章
    blocks:
      - { type: z, text: 明此章之意 }
      - { type: j, text: 唯天下至誠為能盡其性能盡其性則能盡人之性能盡人之性則能盡物之性能盡物之性則可以贊天地之化育可以贊天地之化育則可以與天地參 }
      - { type: z, text: 矣天下至誠謂聖人之德之實天下莫能加也盡其性者德無不實故無人欲之私而天命之在我者察之由之巨細精粗無毫髮之不盡也人物之性亦我之性但以所賦形氣不同而有異耳能盡之者謂知之無不明而處之無不當也贊猶助也與天地參 }
      - { type: j, text: 謂與天地並立為三也此自誠而明者之事也右第二十二章 }
  - id: zhang23
    name: 第二十二章
    blocks:
      - { type: z, text: 言天道也 }
      - { type: j, text: 其次致曲曲能有誠誠則形形則著著則明明則動動則變變則化唯天下至誠為能化 }
      - { type: z, text: 其次通大賢以下凡誠有未至者而言也致推致也曲一偏也形者積中而發外著則又加顯矣明則又有光輝發越之盛也動者誠能動物變者物從而變化則有不知其所以然者蓋人之性無不同而氣則有異故惟聖人能舉其性之全體而盡之其次則必自其善端發見之偏而悉推致之以各造其極也曲無不致則德無不實而形著動變之功自不能已積而至於能化則其至誠之妙亦不異 }
      - { type: j, text: 於聖人矣右第二十三章 }
  - id: zhang24
    name: 第二十三章
    blocks:
      - { type: z, text: 言人道也 }
      - { type: j, text: 至誠之道可以前知國家將興必有禎祥國家將亡必有妖孽見乎蓍龜動乎四體禍福將至善必先知之不善必先知之故至誠如神 }
      - { type: z, text: 見音現禎祥者福之兆妖孽者禍之萌所以筮龜所以卜四體謂動作威儀之閒如執玉高卑其容俯仰之類凡此皆理之先見者也然唯誠之至極而無一毫私留於心目之閒者乃能有以察其幾焉神謂鬼神 }
      - { type: j, text: 右第二十四章 }
  - id: zhang25
    name: 第二十四章
    blocks:
      - { type: z, text: 言天道也 }
      - { type: j, text: 誠者自成也而道自道也 }
      - { type: z, text: 道也之道音導○言誠者物之所以自成而道者人之所當自行也誠以心言本也道以理言用也 }
      - { type: j, text: 誠者物之終始不誠無物是故君子誠之爲貴 }
      - { type: z, text: 天下之物皆實理之所爲故必得是理然後有是物所得之理旣盡則是物亦盡而無有矣故人之心一有不 }
      - { type: j, text: 實則雖有所爲亦如無有而君子必 }
      - { type: z, text: 以誠爲貴也蓋人之心能無不實乃爲有以自成而道之在我者亦無不 }
      - { type: j, text: 行矣誠者非自成己而已也所以成物也成己仁也成物知也性之德也合外内之道也故時措之宜也 }
      - { type: z, text: 知去聲○誠雖所以成己然既有以自成則自然及物而道亦行於彼矣仁者體之存智者用之發是皆吾性之固有而無内外之殊既得於己則見於事者以時措之而皆得其宜也 }
      - { type: j, text: 右第二十五章 }
  - id: zhang26
    name: 第二十五章
    blocks:
      - { type: z, text: 言人道也 }
      - { type: j, text: 故至誠無息 }
      - { type: z, text: 既無虚假自無間斷 }
      - { type: j, text: 不息則久久則徵 }
      - { type: z, text: 久常於中也徵驗於外也 }
      - { type: j, text: 徵則悠遠悠遠則博厚博厚則高明 }
      - { type: z, text: 此皆以其驗於外者言之鄭氏所謂至誠之德著於四方者是也存諸中者既久則驗於外者益悠遠而無窮矣悠遠故其積也廣博而深厚博厚故其發也高大而光明 }
      - { type: j, text: 博厚所以載物也高明所以覆物也悠久所以成物也 }
      - { type: z, text: 悠久即悠遠兼內外而言之也本以悠遠致高厚而高厚又悠久也此言 }
      - { type: j, text: 聖人與天地同用博厚配地高明配天悠久無疆 }
      - { type: z, text: 此言聖人與天地同體 }
      - { type: j, text: 如此者不見而章不動而變無為而成 }
      - { type: z, text: 見音現○見猶示也不見而章以配 }
      - { type: j, text: 地而言也不動而變以配天而言也無為而成以無疆而言也天地之道可一言而盡也其為物不貳則其生物不測 }
      - { type: z, text: 此以下復以天地明至誠無息之功 }
      - { type: j, text: 用天地之道可一言而盡不過曰誠 }
      - { type: z, text: 而巳不貳所以誠也誠故不息而生物之多有莫知其所以然者 }
      - { type: j, text: 天地之道博也厚也高也明也悠也乆也 }
      - { type: z, text: 言天地之道誠一不貳故能各極其盛而有下文生物之功 }
      - { type: j, text: 今夫天斯昭昭之多及其無窮也日月星辰繫焉萬物覆焉今夫地一撮土之多及其廣厚載華嶽而不重振河海而不洩萬物載焉今夫山一卷石之多及其廣大草木生之禽獸居之寶藏興焉今夫水一勺之多及其不測黿鼉鮫龍魚鼈生焉貨財殖焉 }
      - { type: z, text: 夫音扶華藏並去聲卷平聲勺市若反昭昭猶耿耿小明也此指其一處而言之及其無窮猶十二章及其至也之意蓋舉全體而言也振收也卷區也此四條皆以發明由其不貳不息以致盛大而能生物之意然天地山川實非由積累而後大讀者不以辭害意可也 }
      - { type: j, text: 詩云維天之命於穆不已蓋曰天之所以為天也於乎不顯文王之德之純蓋曰文王之所以為文也純亦不已 }
      - { type: z, text: 於音烏乎音呼詩周維天之命篇於歎辭穆深遠也不顯猶言豈不顯也純純一不雜也引此以明至誠無息之意程子曰天道不已文王純於天道亦不已純則無二無雜不已則無閒斷先後 }
      - { type: j, text: 右第二十六章 }
  - id: zhang27
    name: 第二十六章
    blocks:
      - { type: z, text: 言天道也 }
      - { type: j, text: 大哉聖人之道 }
      - { type: z, text: 包下文兩節而言 }
      - { type: j, text: 洋洋乎發育萬物峻極于天 }
      - { type: z, text: 峻高大也此言道之極於至大而無外也 }
      - { type: j, text: 優優大哉禮儀三百威儀三千 }
      - { type: z, text: 優優充足有餘之意禮儀經禮也威儀曲禮也此言道之入於至小而無閒也 }
      - { type: j, text: 待其人而後行 }
      - { type: z, text: 總結上兩節 }
      - { type: j, text: 故曰苟不至德至道不凝焉 }
      - { type: z, text: 至德謂其人至道指上兩節而言也凝聚也成也 }
      - { type: j, text: 故君子尊德性而道問學致廣大而盡精微極髙明而道中庸温故而知新敦厚以崇禮 }
      - { type: z, text: 尊者恭敬奉持之意德性者吾所受於天之正理道由也温猶燖温之温謂故學之矣復時習之也敦加厚也尊德性所以存心而極乎道體之大也道問學所以致知而盡乎道體之細也二者脩德凝道之大端也不以一毫私意自蔽不以一毫私欲自累涵泳乎其所已知敦篤乎其所已能此皆存心之屬也析理則不使有毫釐之差處事則不使有過不及之謬理義則日知其所未知節文則日謹其所未謹此皆致知之屬也蓋非存心無以致知而存心者又不可以不致知故此五句大小相資首尾相應聖賢所示入德之方莫詳於此學者宜盡心焉 }
      - { type: j, text: 是故居上不驕為下不倍國有道其言足以興國無道其默足以容詩曰既明且哲以保其身其此之謂與 }
      - { type: z, text: 倍與背同與平聲○興謂興起在位也詩大雅烝民之篇 }
      - { type: j, text: 右第二十七章 }
  - id: zhang28
    name: 第二十七章
    blocks:
      - { type: z, text: 言人道也 }
      - { type: j, text: 子曰愚而好自用賤而好自專生乎今之世反古之道如此者烖及其身者也 }
      - { type: z, text: 好去聲烖古灾字○以上孔子之言子思引之反復也 }
      - { type: j, text: 非天子不議禮不制度不考文 }
      - { type: z, text: 此以下子思之言禮親疏貴賤相接之體也度品制文書名 }
      - { type: j, text: 今天下車同軌書同文行同倫 }
      - { type: z, text: 行去聲○今子思自謂當時也軌轍迹之度倫次序之體三者皆同言天下一統也 }
      - { type: j, text: 雖有其位苟無其德不敢作禮樂焉雖有其德苟無其位亦不敢作禮樂焉 }
      - { type: z, text: 鄭氏曰言作禮樂者必聖人在天子之位 }
      - { type: j, text: 子曰吾說夏禮杞不足徵也吾學殷禮有宋存焉吾學周禮今用之吾從周 }
      - { type: z, text: 此又引孔子之言杞夏之後徵證也宋殷之後三代之禮孔子皆嘗學之而能言其意但夏禮既不可考證殷禮雖存又非當世之法惟周禮乃時王之制今日所用孔子既不得位則 }
      - { type: j, text: 從周而已右第二十八章 }
  - id: zhang29
    name: 第二十八章
    blocks:
      - { type: z, text: 承上章為下不倍而言亦人道也 }
      - { type: j, text: 王天下有三重焉其寡過矣乎 }
      - { type: z, text: 王去聲○吕氏曰三重謂議禮制度考文惟天子得以行之則國不異政家不殊俗而人得寡過矣 }
      - { type: j, text: 上焉者雖善無徵無徵不信不信民弗從下焉者雖善不尊不尊不信不信民弗從 }
      - { type: z, text: 上焉者謂時王以前如夏商之禮雖善而皆不可考下焉者謂聖人在下如孔子雖善於禮而不在尊位也 }
      - { type: j, text: 故君子之道本諸身徵諸庶民考諸三王而不繆建諸天地而不悖質諸鬼神而無疑百世以俟聖人而不惑 }
      - { type: z, text: 此君子指王天下者而言其道即議禮制度考文之事也本諸身有其德也徵諸庶民驗其所信從也建立也立於此而參於彼也天地者道也鬼神者造化之迹也百世以俟聖人而不惑所謂聖人復起不易吾言者也質諸鬼神而無疑知天也百世以俟聖人而不惑知人也知天知人知其理也 }
      - { type: j, text: 是故君子動而世為天下道行而世為天下法言而世為天下則遠之則有望 }
      - { type: z, text: 近之則不厭動兼言行而言道兼法則而言法法度也則準則也 }
      - { type: j, text: 詩曰在彼無惡在此無射庶幾夙夜以永終譽君子未有不如此而蚤有譽於天下者也 }
      - { type: z, text: 惡去聲射音妬詩作斁○詩周頌振之篇射厭也所謂此者指本諸身 }
      - { type: j, text: 以下六事而言右第二十九章 }
  - id: zhang30
    name: 第二十九章
    blocks:
      - { type: z, text: 承上章居上不驕而言亦人道也 }
      - { type: j, text: 仲尼祖述堯舜憲章文武上律天時下襲水土 }
      - { type: z, text: 祖述者遠宗其道憲章者近守其法律天時者法其自然之運襲水土者因其一定之理皆兼內外該本末而 }
      - { type: j, text: 言也辟如天地之無不持載無不覆幬辟如四時之錯行如日月之代明 }
      - { type: z, text: 辟音譬幬徒報反○錯猶迭也此言聖人之德 }
      - { type: j, text: 萬物並育而不相害道並行而不相悖小德川流大德敦化此天地之所以爲大也 }
      - { type: z, text: 悖猶背也天覆地載萬物並育於其閒而不相害四時日月錯行代明而不相悖所以不害不悖者小德之川流所以並育並行者大德之敦化小德者全體之分大德者萬殊之本川流者如川之流脉絡分明而往不息也敦化者敦厚其化根本盛大而出 }
      - { type: j, text: 無窮也此言天地之道以見上文取辟之意也右第三十章 }
  - id: zhang31
    name: 第三十章
    blocks:
      - { type: z, text: 言天道也 }
      - { type: j, text: 唯天下至聖為能聰明睿知足以有臨也寬裕溫柔足以有容也發強剛毅足以有執也齊莊中正足以有敬也文理 }
      - { type: z, text: 密察足以有別也知去聲齊側皆反別彼列反○聰明睿知生知之質臨謂居上而臨下也其下四者乃仁義禮知之德文文章也理條理也密詳細也察明辨也溥博淵泉而時出之博周徧而廣闊也淵泉靜深而有本也出發見也言五者之德充積於中而以時發見於外也 }
      - { type: j, text: 溥博如天淵泉如淵見而民莫不敬言而民莫不信行而民莫不說 }
      - { type: z, text: 見音現說音悅○言其充積極其盛而發見當其可也 }
      - { type: j, text: 是以聲名洋溢乎中國施及蠻貊舟車所至人力所通天之所覆地之所載日月所照霜露所隊凡有血氣者莫不尊親故曰配天 }
      - { type: z, text: 施去聲隊音墜○舟車所至以下蓋極言之配天言其德之所及廣大如 }
      - { type: j, text: 天也右第三十一章 }
  - id: zhang32
    name: 第三十一章
    blocks:
      - { type: z, text: 承上章而言小德之川流亦天道也 }
      - { type: j, text: 唯天下至誠為能經綸天下之大經立天下之大本知天地之化育夫焉有所倚 }
      - { type: z, text: 夫音扶焉於虔反○經綸皆治絲之事經者理其緒而分之綸者比其類而合之也經常也大經者五品之人倫大本者所性之全體也惟聖人之德極誠無妄故於人倫各盡其當然之實而皆可以為天下後世法所謂經綸之也其於所性之全體無一毫人欲之偽以雜之而天下之道千變萬化皆由此出所謂立之也其於天地之化育則亦其極誠無妄者有默契焉非但聞見之知而已此皆至誠無妄自然之功用夫豈有所倚著於物而後能哉 }
      - { type: j, text: 肫肫其仁淵淵其淵浩浩其天 }
      - { type: z, text: 肫之純反○肫肫懇至貌以經綸而言也淵淵靜深貌以立本而言也浩浩廣大貌以知化而言也其淵其天則非特如之而已 }
      - { type: j, text: 苟不固聰明聖知達天德者其孰能知 }
      - { type: z, text: 之聖知之知去聲○固猶實也鄭氏曰 }
      - { type: j, text: 唯聖人能知聖人也右第三十二章承上章而言大德之敦化亦天道也前章言至聖之德此章言 }
  - id: zhang33
    name: 第三十二章
    blocks:
      - { type: z, text: 至誠之道然至誠之道非至聖 }
      - { type: j, text: 不能知至聖之德非至誠不能 }
      - { type: z, text: 為則亦非二物矣此篇言聖人天道之極致至此而無以加矣 }
      - { type: j, text: 詩曰衣錦尚絅惡其文之著也故君子之道闇然而日章小人之道的然而日云君子之道淡而不厭簡而文溫而理知遠之近知風之自知微之顯可與入德矣 }
      - { type: z, text: 衣去聲絅口迥反惡去聲闇於感反前章言聖人之德極其盛矣此復自下學立心之始言之而下文又推之以至其極也詩國風衛碩人鄭之丰皆作衣錦衣褧絅同禪衣也尚加也古之學者為己故其立心如此尚故闇然衣錦故有日章之實淡簡温絅之襲於外也不厭而文且理焉錦之美在中也小人反是則暴於外而無實以繼之是以的然而日亡也遠之近見於彼者由於此也風之自著乎外者本乎内也微之顯有諸内者形諸外也有為己之心而又知此三者則知所謹而可入德矣故下文引詩言謹獨之事 }
      - { type: j, text: 詩云潛雖伏矣亦孔之昭故君子內省不疚無惡於志君子之所不可及者其唯人之所不見乎 }
      - { type: z, text: 惡去聲○詩小雅正月之篇承上文言莫見乎隱莫顯乎微也疚病也無惡於志猶言無愧於心此君子謹獨 }
      - { type: j, text: 之事也詩云相在爾室尚不愧于屋漏故君子 }
      - { type: z, text: 不動而敬不言而信相去聲○詩大雅抑之篇相視也屋漏室西北隅也承上文又言君子之戒謹恐懼無時不然不待言動而後敬信則其為己之功益加密矣故下文引詩并言其效 }
      - { type: j, text: 詩曰奏假無言時靡有爭是故君子不賞而民勸不怒而民威於鈇鉞 }
      - { type: z, text: 假格同缺音夫。詩商頌烈祖之篇奏進也承上文而遂及其效言進而感格於神明之際極其誠敬無有言說而人自化之也威畏也缺莝斫刀也鉞斧也 }
      - { type: j, text: 詩曰不顯惟德百辟其刑之是故君子篤恭而天下平 }
      - { type: z, text: 詩周頌烈文之篇不顯說見二十六章此借引以爲幽深玄遠之意承上文言天子有不顯之德而諸侯法之則其德愈深而效愈遠矣篤厚也篤恭言不顯其敬也篤恭而天下平乃聖人至德淵微自然之應中庸之極功也 }
      - { type: j, text: 詩云予懷明德不大聲以色子曰聲色之於以化民末也詩曰德輶如毛毛猶有倫上天之載無聲無臭至矣 }
      - { type: z, text: 輶由酉二音○詩大雅皇矣之篇引 }
      - { type: j, text: 之以明上文所謂不顯之德者正以 }
      - { type: z, text: 其不大聲與色也又引孔子之言以為聲色乃化民之末務今但言不大之而已則猶有聲色者存是未足以形容不顯之妙不若烝民之詩所言德輶如毛則庶乎可以形容矣而又自以為謂之毛則猶有可比者是亦未盡其妙不若文王之詩所言上天之事無聲無臭然後乃為不顯之至耳蓋聲臭有氣無形在物最為微妙而猶曰無之故唯此可以形容不顯篤恭之妙非此德之外又別有是三等然後為至也 }
      - { type: j, text: 右第三十三章子思因前章極致之言反求其本復自下學為己謹獨之事推而言之以馴致乎篤恭而天下平之盛又贊其妙至於無聲無臭而後已焉蓋舉一篇之要而約言之其反復丁寧示人之意至深切矣學者其可不盡心乎 }
  - id: zhang34
    name: 第三十三章
    blocks:
