# 毛詩正義卷4（孔穎達疏）：j 為經文＋毛亨傳、鄭玄箋，z 為疏文。
sections:
  - id: juan4
    name: 正文
    blocks:
      - { type: j, text: "《豐》，刺亂也。婚姻之道缺，陽倡而陰不和，男行而女不隨。婚姻之道，謂嫁取之禮。○豐，芳兇反，面貌豐滿也，《方言》作“妦”。缺，丘悅反。倡，昌亮反。和，胡臥反。" }
      - { type: z, text: "“《豐》四章，二章章三句，二章章四句”至“不隨”。○正義曰：陽倡陰和，男行女隨，一事耳。以夫婦之道，是陰陽之義，故相配言之。經陳女悔之辭。上二章悔已前不送男，下二章欲其更來迎己，皆是男行女不隨之事也。○箋“婚姻”至“之禮”。○正義曰：男以昏時迎女，女因男而來。嫁，謂女適夫家。娶，謂男往娶女。論其男女之身，謂之嫁娶；指其好合之際，謂之婚姻。嫁娶婚姻，其事是一，故云“婚姻之道，謂嫁娶之禮”也。若指男女之身，則男以昏時取婦，婦因男而來。婚姻之名，本生於此。若以婦黨婿黨相對為稱，則《釋親》所云“婿之父為姻，婦之父為婚。婦之黨為婚兄弟，婿之黨為姻兄弟”，是婦黨稱婚，婿黨稱姻也。對文則有異，散則可以通。《我行其野》箋雲：“新特，謂外婚。”謂婦為婚也。隱元年《左傳》說葬之月數雲：“士逾月，外姻至。”非獨謂婿家也。" }
      - { type: j, text: "子之丰兮，俟我乎巷兮，豐，豐滿也。巷，門外也。箋雲：子，謂親迎者。我，我將嫁者。有親迎我者，面貌豐豐然豐滿，善人也，出門而待我於巷中。○迎，魚敬反，下“親迎”同。悔予不送兮！時有違而不至者。箋雲：悔乎我不送是子而去也。時不送，則為異人之色，後不得耦而思之。○為，於偽反。" }
      - { type: z, text: "“子之”至“送兮”。○正義曰：鄭國衰亂，婚姻禮廢。有男親迎而女不從，後乃追悔。此陳其辭也。言往日有男子之顏色豐然豐滿，是善人兮，來迎我出門，而待我於巷中兮。予當時別為他人，不肯共去，今日悔恨，我本不送是子兮。所為留者，亦不得為耦，由此故悔也。○傳“豐豐”至“門外”。○正義曰：豐者，面色豐然，故為豐滿也。《叔于田》傳雲：“巷，裏塗。”此言門外者，以迎婦自門而出，故系門言之，其實巷是門外之道，與裏塗一也。" }
      - { type: j, text: "子之昌兮，俟我乎堂兮，昌，盛壯貌。箋雲：“堂”當為“棖”。棖，門梱上本近邊者。○堂並如字，門堂也。鄭改作“棖”，直庚反。梱本作“閫”，苦本反。近，附如之近。悔予不將兮！將，行也。箋雲：將亦送也。" }
      - { type: z, text: "“子之”至“將兮”。○毛以為，女悔前事，言有男子之容貌昌然盛壯兮，來就迎我，待我於堂上兮，我別為他人，不肯共去，今日悔我本不共是子行去兮？○鄭以堂為棖，將為送為異，餘同。○傳“昌，盛壯貌”。○正義曰：此傳不解堂之義。王肅雲：“升於堂以俟。”孫毓雲：“禮，門側之堂謂之塾。謂出俟於塾前。詩人此句故言堂耳。毛無易字之理，必知其不與鄭同。”案此篇所陳庶人之事，人君之禮尊，故於門設塾，庶人不必有塾，不得待之於門堂也。《著》雲“俟我於堂”，文與《著》“庭”為類，是待之堂室，非門之堂也。《士昏禮》“主人揖賓，入於廟。主人升堂西面，賓升堂北面，奠雁，再拜稽首，降，出。婦從，降自西階”。是則士禮受女於廟堂。庶人雖無廟，亦當受女於寢堂，故以王為毛說。○箋“堂當”至“邊者”。○正義曰：箋以《著》篇言“堂”文在《著》“庭”之下，可得為廟之堂。此篇上言於巷，此言於堂，巷之與堂，相去懸遠，非為文次，故轉堂為棖。棖是門梱上豎木，近門之兩邊者也。《釋宮》雲：“柣謂之閾。棖謂之楔。”孫炎曰：“柣，門限也。”李巡曰：“棖，謂梱上兩傍木。”上言待於門外，此言待之於門，事之次，故易為棖也。" }
      - { type: j, text: "衣錦褧衣，裳錦褧裳。衣錦、褧裳，嫁者之服。箋雲：褧，襌也，蓋以襌縠為之中衣。裳用錦，而上加襌縠焉，為其文之大著也。庶人之妻嫁服也。士妻糹才衣纁袡。○衣錦如字，或一音於記反，下章放此。褧衣，苦迥反，下如字。襌音丹。縠，戶木反。為其，於偽反。大音泰，舊敕賀反。糹才，側基反，本或作“純”，又作“緇”，並同“纁”，許雲反。袡，如鹽反。叔兮伯兮，駕予與行！叔伯，迎己者。箋雲：言此者，以前之悔。今則叔也伯也，來迎己者，從之，志又易也。○易，以豉反。" }
      - { type: z, text: "“衣錦”至“與行”。○正義曰：此女失其配耦，悔前不行，自說衣服之備，望夫更來迎己。言己衣則用錦為之，其上覆有襌衣矣。裳亦用錦為之，其上覆有襌裳矣。言己衣裳備足，可以行嫁，乃呼彼迎者之字雲：叔兮伯兮，若復駕車而來，我則與之行矣。悔前不送，故來則從之。○傳“衣錦”至“之服”。○正義曰：知者，以此詩是婦人追悔，原得從男，陳行嫁之事，雲己有此服，故知是嫁者之服也。而人之服不殊裳，而經衣裳異文者，以其衣裳別名，詩須韻句，故別言之耳。其實婦人之服，衣裳連，俱用錦，皆有褧。下章倒其文，故傳衣錦褧裳互言之。○箋“褧襌”至“纁袡”。○正義曰：《玉藻》雲：“襌為絅。”絅與褧音義同。是褧為襌，衣裳所用，《書傳》無文。而婦人之服尚輕細，且欲露錦文，必不用厚繒矣，故云“蓋以襌縠為之”。襌衣在外，而錦衣在中，故言“中衣”。裳用錦，而上加襌縠焉。《中庸》引此詩，乃雲“為其文之大著也”，故箋依用之。傳直言嫁者之服，故又申之雲，“庶人之妻嫁服”，若士妻，則“糹才衣纁袡。”《士昏禮》雲：“女次糹才衣纁袡，立於房中南面。”注云：“次，首飾也。糹才衣、絲衣。女從者畢袗玄，則此亦玄矣。袡亦緣也。袡之言任也。以纁緣其衣，象陰氣上任也。凡婦人之服不常施袡之衣盛，昏禮為此服耳。”是士妻嫁時服糹才衣纁袡也。○傳“叔伯，迎己者”。○正義曰：欲其駕車而來，故斥迎己者也。迎己者一人而已，叔伯並言之者，此作者設為女悔之辭，非知此女之夫實字叔伯，託而言之耳。箋言“志又易”者，以不得配耦，志又變易於前，故叔伯來則從之也。" }
      - { type: j, text: "裳錦褧裳，衣錦褧衣。兮叔伯兮，駕予與歸。" }
      - { type: j, text: "《豐》四章，二章章三句，二章章四句。" }
      - { type: j, text: "《東門之墠》，刺亂也。男女有不待禮而相奔者也。○墠音善，依字當作“墠”。此序舊無注，而崔《集註》本有。鄭注云：“時亂，故不得待禮而行。”" }
      - { type: z, text: "“《東門之墠》二章，章四句”至“奔者也”。○正義曰：經二章皆女奔男之事也。上篇以禮親迎，女尚違而不至，此復得有不待禮而相奔者，私自姦通，則越禮相就；志留他色，則依禮不行，二者俱是淫風，故各自為刺也。" }
      - { type: j, text: "東門之墠，茹藘在阪。東門，城東門也。墠，除地町町者。茹藘，芧蒐也。男女之際，近則如東門之墠，遠而難則茹藘在阪。箋雲：城東門之外有墠，墠邊有阪，芧蒐生焉。茅蒐之為難淺矣，易越而出。此女欲奔男之辭。○茹音如，後篇同。藘，力於反。茹藘，茅蒐，蒨草也。後篇阪音反，反又符板反。町，吐鼎反，又徒冷反。茅，貌交反。其室則邇，其人甚遠！邇，近也。得禮則近，不得禮則遠。箋雲：其室則近，謂所欲奔男之家。望其來迎己而不來，則為遠。" }
      - { type: z, text: "“東門”至“甚遠”。○毛以為，東門之壇，除地町町，其踐履則易。茹藘在阪，則為礙阻，其登陟則難。言人之行者，踐東門之壇則易，登茹藘在阪則難越，以興為婚姻者，得禮則易，不得禮則難。婚姻之際，非禮不可。若得禮，其室則近，人得相從易，可為婚姻。若不得禮，則室雖相近，其人甚遠，不可為婚矣。是男女之交，不可無禮。今鄭國之女，有不待禮而奔男者，故舉之以剌當時之淫亂也。○鄭以為，女欲奔男之辭。東門之外有壇，壇之邊有阪，茹藘之草生於阪上。女言東門之外有壇，茹藘在於阪上，其為禁難淺矣，言其易越而出，興己是未嫁之女，父兄之禁難亦淺矣，言其易可以奔男。止，自男不來迎己耳。又言己所欲奔之男，其室去此則近，為不來迎己，雖近難見，其人甚遠，不可得從也。欲使此男迎己，己則從之，是不待禮而相奔，故剌之。○傳“東門”至“在阪”。○正義曰：“出其東門，有女如雲”，是國門之外見女也。“東門之池，可以漚麻”，是國門之外有池也。則知諸言東門，皆為城門，故云“東門，城東門也”。襄二十八年《左傳》雲：“子產相鄭伯以如楚。舍不為壇。外僕言曰：‘昔先大夫相先君適四國，未嘗不為壇。今子草舍，無乃不可乎？’”上言“舍不為壇”，下言“今子草舍”，明知壇者除地去草矣，故云“壇，除地町町者”也。遍檢諸本，字皆作“壇”，《左傳》亦作“壇”。其《禮記》、《尚書》言壇、墠者，皆封土者謂之壇，除地者謂之墠。壇、墠字異，而作此“壇”字，讀音曰墠，蓋古字得通用也。今定本作“墠”。“茹藘，茅蒐”，《釋草》文。李巡曰：“茅蒐，一名茜，可以染絳。”陸機《疏》雲：“一名地血，齊人謂之茜，徐州人謂之牛蔓。”然則今之蒨草是也。男女之際者，謂婚姻之禮，是男女交際之事。《禮記·大傳》雲“異姓主名治際會”，亦謂婚禮交際之會也。以壇阪者各自為喻，壇是平地，又除治，阪是高阜，又草生焉，人欲踐之，則有難易，以喻婚姻之道，有禮、無禮之難易，故云“男女之際，近而易則如東門之壇，遠而難則如茹藘在阪”也。阪雲遠而難，則壇當雲近而易，不言“而易”，可知而省文也，壇阪可以喻難耳。無遠近之象而云近遠者，以壇系東門言之，則在東門外，阪不言所在，則遠於東門矣。且下句言“則邇”、“甚遠”，故傳顧下經，以遠近解之。下傳雲：“得禮則近，不得禮則遠”，還與此傳文相成為始終之說。○箋“城東”至“之辭”。○正義曰：箋以下章“栗”與“有踐家室”連文，以此章“壇”與“茹藘在阪”連文，則是同在一處，不宜分之為二，故易傳以為壇邊有阪，栗在室內，得作一興，共為女辭。阪是難登之物，茅蒐延蔓之草，生於阪上，行者之所以小難，但為難淺矣，易越而出，以自喻己家禁難亦淺矣，易以奔男。是女欲奔男，令迎己之辭也。若然，阪有茹藘，可為小難，壇乃除地，非為阻難，而亦言之者，物以高下相形，欲見阪之難登，故先言壇之易踐，以形見阪為難耳，不取易為義也。○傳“邇近”至“則遠”。○正義曰：“邇，近”，《釋詁》文。室與人相對，則室謂宅，人居室內，而云室近人遠。此剌女不待禮，故知以禮為送近。" }
      - { type: j, text: "東門之栗，有踐家室。栗，行上栗也。踐，淺也。箋雲：栗而在淺家室之內，言易竊取。栗，人所啗食而甘耆，故女以自喻也。○行上並如字。行，道也。《左傳》雲：“斬行栗。”啗，徒覽反，本又作“啖”，亦作“噉”，並同。耆，常志反。豈不爾思？子不我即！即，就也。箋雲：我豈不思望女乎，女不就迎我而俱去耳。" }
      - { type: z, text: "“東門”至“我即”。○毛以為，東門之外，有栗樹生於路上，無人守護，其欲取之則為易。有物在淺室家之內，雖在淺室，有主守之，其欲取之則難。以興為婚者得禮則易，不得禮則難。婚姻之際，不可無禮，故貞女謂男子云：我豈不於汝思為室家乎，但子不以禮就我，我無由從子。貞女之行，非禮不動。今鄭國之女，何以不待禮而奔乎？故刺之。○鄭以為，女乎男迎己之辭。言東門之外栗樹，有淺陋家室之內生之。栗在淺家，易可竊取，喻己在父母之家，亦易竊取，正以栗為興者。栗有美味，人所啗食而甘之，言己有美色，亦男所親愛而悅之，故女以自喻。女又謂男曰：我豈可不於汝思望之乎？誠思汝矣。但子不於我來就迎之，故我無由得往耳。女當待禮從男，今欲男就迎即去，故刺之。○傳“栗行”至“踐淺”。○正義曰：傳以栗在東門之外，不處園圃之間，則是表道樹也。故云“栗，行上栗”。行謂道也。襄九年《左傳》雲：“趙武、魏絳斬行栗。”杜預雲：“行栗，表道樹。”“踐，淺”，《釋言》文。此經、傳無明解，準上章亦宜以難易為喻，故同上為說也。" }
      - { type: j, text: "《東門之墠》二章，章四句。" }
      - { type: j, text: "《風雨》，思君子也。亂世則思君子，不改其度焉。" }
      - { type: j, text: "風雨悽悽，雞鳴喈喈。興也。風且雨，悽悽然，雞猶守時而鳴，喈喈然。箋雲：興者，喻君子雖居亂世，不變改其節度。○悽，七西反。喈音皆。既見君子，雲胡不夷？胡，何。夷，說也。箋雲：思而見之，云何而心不說？○說音悅，下同。" }
      - { type: z, text: "“風雨”至“不夷”。○正義曰：言風雨且雨，寒涼悽悽然。雞以守時而鳴，音聲喈喈然。此雞雖逢風雨，不變其鳴，喻君子雖居亂世，不改其節。今日時世無復有此人。若既得見此不改其度之君子，云何而得不悅？言其必大悅也。○傳“風且”至“喈喈然”。○正義曰：《四月》雲“秋日悽悽”，寒涼之意，言雨氣寒也。二章“瀟瀟”，謂雨下急疾瀟瀟然，與悽悽意異，故下傳雲：“瀟瀟，暴疾。”喈喈、膠膠則俱是鳴辭，故云“猶喈喈也”。○傳“胡，何。夷，說”。○正義曰：胡之為何，《書傳》通訓。“夷，悅”，《釋言》文。定本無“胡何”二字。" }
      - { type: j, text: "風雨瀟瀟，雞鳴膠膠。瀟瀟，暴疾也。膠膠，猶喈喈也。○瀟音蕭。膠音交。既見君子，雲胡不瘳？瘳，愈也。○瘳，敕留反。" }
      - { type: j, text: "風雨如晦，雞鳴不已。晦，昏也。箋雲：已，止也。雞不為如晦而止不鳴。○不為，於偽反。既見君子，雲胡不喜？" }
      - { type: j, text: "《風雨》三章，章四句。" }
      - { type: j, text: "《子矜》，刺學校廢也。亂世則學校不脩焉。鄭國謂學為校，言可以校正道藝。○衿音金，本亦作“襟”，徐音琴。“世亂”，本或以世字在下者，誤。校，力孝反，注及下注同。注傳雲“鄭人游於鄉校”是也。公孫弘雲：“夏曰校。”沈音教。" }
      - { type: z, text: "“《子衿》三章，章四句”至“不脩焉”。○正義曰：鄭國衰亂，不脩學校，學者分散，或去或留，故陳其留者恨責去者之辭，以刺學校之廢也。經三章，皆陳留者責去者之辭也。定本雲“刺學廢也”，無“校”字。○箋“鄭國”至“道藝”。○正義曰：襄三十一年《左傳》雲：“鄭人游於鄉校。”然明謂子產毀鄉校，是鄭國謂學為校，校是學之別名，故序連言之。又稱其名校之意，言於其中可以校正道藝，故曰校也。此序非鄭人言之，箋見《左傳》有鄭人稱校之言，故引以為證耳，非謂鄭國獨稱校也。《漢書》公孫弘奏雲：“三代之道，鄉里有教，夏曰校，殷曰庠，周曰序。”是古亦名學為校也。禮：“人君立大學小學。”言學校廢者，謂鄭國之人廢於學問耳，非謂廢毀學宮也。" }
      - { type: j, text: "青青子衿，悠悠我心。青衿，青領也，學子之所服。箋雲：學子而俱在學校之中，己留彼去，故隨而思之耳。禮：“父母在，衣純以青”。○青如字。學子以青為衣領緣衿也，或作菁，音非純、章允反，又之閏反。縱我不往，子寧不嗣音？嗣，習也。古者教以詩樂，誦之歌之，弦之舞之。箋雲：嗣，續也。女曾不傳聲問我，以恩責其忘己。○嗣如字，《韓詩》作“詒”。詒，寄也，曾不寄問也。傳聲，直專反。" }
      - { type: z, text: "“青青”至“嗣音”。○毛以為，鄭國學校不修，學人散去，其留者思之言：青青之色者，是彼學子之衣衿也。此青衿之子，棄學而去，悠悠乎我心思而不見，又從而責之。縱使我不往彼見子，子寧得不來學習音樂乎？責其廢業去學也。○鄭唯下句為異。言汝何曾不嗣續音聲，傳問於我。責其遺忘己也。○傳“青衿，青領”。○正義曰：《釋器》雲：“衣皆謂之襟。”李巡曰：“衣皆，衣領之襟。”孫炎曰：“襟，交領也。”衿與襟音義同。衿是領之別名，故云“青衿，青領也”。衿、領一物。色雖一青，而重言青青者，古人之復言也。下言“青青子佩”，正謂青組綬耳。《都人士》“狐裘黃黃”，謂裘色黃耳，非有二事而重文也。箋雲“父母在，衣純以青”，是由所思之人父母在，故言青衿。若無父母，則素衿。《深衣》雲：“具父母衣純以青，孤子衣純以素。”是無父母者用素。○傳“嗣習”至“舞之”。○正義曰：所以責其不習者，古者教學子以詩樂，誦之謂背文闇誦之，歌之謂引聲長詠之，弦之謂以琴瑟播之，舞之謂以手足舞之。學樂學詩，皆是音聲之事，故責其不來習音。《王制》雲：“樂正崇四術，立四教。春秋教以禮樂，冬夏教以詩書。”《文王世子》雲：“春誦夏弦，太師詔之。”注云：“誦，謂歌樂也。弦，謂以絲播詩。”是學詩學樂，皆弦誦歌舞之。○箋“嗣續”至“忘己”。○正義曰：箋以下章雲“子寧不來”，責其不來見己，不言來者有所學。則此雲“不嗣音”，不宜為習樂，故易傳言留者責去者，子曾不傳續音聲存問我，以恩責其忘己。言與彼有恩，故責其斷絕。" }
      - { type: j, text: "青青子佩，悠悠我思。佩，佩玉也。士佩瓀珉而青組綬。○鶗，本又作“瓀”，如兗反。珉，亡巾反。組音祖。綬音受。縱我不往，子寧不來？不來者，言不一來也。" }
      - { type: z, text: "傳“佩，佩玉”至“組綬”。○正義曰：《玉藻》雲：“古之君子必佩玉，君子於玉比德焉。”故知子佩為佩玉也。禮不佩青玉，而云“青青子佩”者，佩玉以組綬帶之。士佩瓀珉而青組綬，故云青青謂組綬也。案《玉藻》“士佩瓀玟而縕組綬”，此雲青組綬者，蓋毛讀《禮記》作青字，其本與鄭異也。學子非士，而傳以士言之，以學子得依士禮故也。○傳“不來者，言不一來”。○正義曰：準上傳，則毛意以為責其不一來習業。鄭雖無箋，當謂不來見己耳。" }
      - { type: j, text: "挑兮達兮，在城闕兮。挑達，往來相見貌。乘城而見闕。箋雲：國亂，人廢學業，但好登高見於城闕，以候望為樂。○挑，他羔反，又敕彫反，《說文》作“叟”。達，他末反，《說文》雲：“達，不相遇也。”好，呼報反。樂音洛。一日不見，如三月兮！言禮樂不可一日而廢。箋雲：君子之學，以文會友，以友輔仁。獨學而無友，則孤陋而寡聞，故思之甚。" }
      - { type: z, text: "“挑兮”至“月兮”。○毛以為，學人廢業，候望為樂，故留者責之雲：汝何故棄學而去？挑兮達兮，乍往乍來，在於城之闕兮。禮樂之道，不學則廢。一日不見此禮樂，則如三月不見兮，何為廢學而游觀？○鄭以下二句為異。言一日不與汝相見，如三月不見兮。言己思之甚也。○傳“挑達”至“見闕”。○正義曰：城闕雖非居止之處，明其乍往乍來，故知挑達為往來貌。《釋宮》雲：“觀謂之闕。”孫炎曰：宮門雙闕，舊章懸焉，使民觀之，因謂之觀。如《爾雅》之文，則闕是人君宮門，非城之所有，且宮門觀闕不宜乘之候望。此言在城闕兮，謂城之上別有高闕，非宮闕也。乘城見於闕者，乘猶登也，故箋申之，登高見於城闕，以候望為樂。○箋“君子”至“之甚”。○正義曰：“君子以文會友，以友輔仁”，《論語》文。“獨學而無友，則孤陋而寡聞”，《學記》文。由其須友以如此，故思之甚。" }
      - { type: j, text: "《子衿》三章，章四句。" }
      - { type: j, text: "《揚之水》，閔無臣也。君子閔忽之無忠臣良士，終以死亡，而作是詩也。" }
      - { type: z, text: "“《揚之水》二章，章六句”至“是詩”。○正義曰：經二章，皆閔忽無臣之辭。忠臣、良士，一也。言其事君則為忠臣，指其德行則為良士，所從言之異耳。“終以死亡”，謂忽為其臣高渠彌所弒也。作詩之時，忽實未死，序以由無忠臣，意以此死，故閔之。《有女同車》序雲：“卒以無大國之助，至於見逐。”意亦與此同。" }
      - { type: j, text: "揚之水，不流束楚。揚，激揚也。激揚之水，可謂不能流漂束楚乎？箋雲：激揚之水，喻忽政教亂促。不流朿楚，言其政不行於臣下。○漂，匹妙反。終鮮兄弟，維予與女。箋雲：鮮，寡也。忽兄弟爭國，親戚相疑，後竟寡於兄弟之恩，獨我與女有耳。作此詩者，同姓臣也。○鮮，息淺反，注下同。無信人之言，人實迋女。迋，誑也。○迋，求往反，徐又居望反。誑，九況反。" }
      - { type: z, text: "“揚之水”至“迋女”。○毛以為，激揚之水，可謂不能流漂一束之楚乎？言能流漂之，以興忠臣良士，豈不能誅除逆亂之臣乎？言能誅除之。今忽既不能誅除逆亂，又復兄弟爭國，親戚相疑，終竟寡於兄弟之恩，唯我與汝二人而已。忽既無賢臣，多被欺誑，故又誡之，汝無信他人之言。被他人之言，實欺誑於汝。臣皆誑之，將至亡滅，故閔之。鄭唯上二句別，義具箋。○箋“激揚”至“臣下”。○正義曰：箋言激揚之水，是水之迅；疾言不流束楚，實不能流，故以喻忽政教亂促，不行臣下。由政令不行於臣下，故無忠臣良士與之同心，與下勢相連接，同為閔無臣之事。毛興雖不明，以《王》及《唐·揚之水》皆興，故為此解。" }
      - { type: j, text: "揚之水，不流束薪。終鮮兄弟，維予二人。二人同心也。箋雲：二人者，我身與女忽。無信人之言，人實不信。" }
      - { type: j, text: "《揚之水》二章，章六句。" }
      - { type: j, text: "《出其東門》，閔亂也。公子五爭，兵革不息，男女相棄，民人思保其室家焉。“公子五爭”者，謂突再也，忽子、亹子、儀各一也。○爭，爭鬥之爭，注同。亹，亡匪反，又音尾，莊公子。" }
      - { type: z, text: "“《出其東門》二章，章六句”至“室家焉”。○正義曰：作《出其東門》詩者，閔亂也。以忽立之後，公子五度爭國，兵革不得休息，下民窮困，男女相棄，民人迫於兵革，室家相離，思得保其室家也。兵謂弓矢干戈之屬。革謂甲胃之屬，以皮革為之。保者，安守之義。男以女為室，女以男為家，若散則通。民人分散乖離，故思得保有室家，正謂保有其妻，以妻為室家。經二章皆陳男思保妻之辭，是思保室家也。其公子五爭，兵革不息，敘其相棄之由，於經無所當也。俗本雲“五公子爭”，誤也。○箋“公子”至“各一”。○正義曰：桓十一年《左傳》雲：“祭仲為公娶鄧曼，生昭公，故祭仲立之。宋雍氏女於鄭莊公，生厲公。故宋人誘祭仲而執之，曰：‘不立突，將死。’祭仲與宋人盟，以厲公歸而立之。秋，九月，昭公奔衛。己亥，厲公立。”是一爭也。十五年傳曰：“祭仲專，鄭伯患之，使其婿雍糾殺之。雍姬知之，以告祭仲。祭仲殺雍糾。厲公出奔蔡。六月，乙亥，鄭世子忽復歸於鄭。”是二爭也。十七年傳曰：“初，鄭伯將以高渠彌為卿，昭公惡之，固諫，不聽。昭公立，懼其殺己也，弒昭公而立公子亹。”是三爭也。十八年傳曰：“齊侯師於首止，子亹會之，高渠彌相。七月，齊人殺子亹，而轘高渠彌。祭仲逆鄭子於陳而立之。”服虔雲：“鄭子，昭公弟子儀也。”是四爭也。莊十四年傳曰：“鄭厲公自櫟侵鄭，及大陵，獲傅瑕。傅瑕曰：‘苟舍我，吾請納君。’與之盟而舍之。六月，傅瑕殺鄭子而納厲公。”是五爭也。忽亦再為鄭君，前以太子嗣立，不為爭篡，故唯數後為五爭也。" }
      - { type: j, text: "出其東門，有女如雲。如雲，眾多也。箋雲：有女，謂諸見棄者也。如雲者，如雲從風東西南北，心無有定。雖則如雲，匪我思存。思不存乎相救急。箋雲：匪，非也。此如雲者，皆非我思所存也。○思如字，注及下皆同；沈息嗣反，毛音如字，鄭息嗣反。縞衣綦巾，聊樂我員。縞衣，白色，男服也。綦巾，蒼艾色，女服也。原室家得相樂也。箋雲：縞衣綦巾，己所為作者之妻服也，時亦棄之，兵革之難，不能相畜。心不忍絕，故言且留樂我員。此思保其室家。窮困不得有其妻，而以衣巾言之，恩不忍斥之。綦，綦文也。○縞，古老反，又古報反。綦，巨基反。樂音洛，注並同，一音嶽。或雲：“箋留樂，又音嶽。”員音雲，本亦作雲，《韓詩》作“魂”。魂，神也。為，幹偽反。難，乃旦反。" }
      - { type: z, text: "“出其”至“我員”。○毛以為，鄭國民人不能保其室家，男女相棄，故詩人閔之。言我出其鄭城東門之外，有女被棄者眾多如雲。然女既被棄，莫不困苦。詩人閔之，無可奈何，言雖則眾多如雲，非我思慮所能存救。以其眾多，不可救拯，唯原使昔日夫妻更自相得，故言彼服縞衣之男子，服綦巾之女人，是舊時夫妻，原其還自配合，則可以樂我心雲耳。詩人閔其相棄，故原其相得則樂。雲、員古今字，助句辭也。○鄭以為，國人於兵革，男女相棄，心不忍絕，眷戀不已。詩人述其意而陳其辭也。言鄭國之人，有棄其妻者，自言出其東門之外，見有女被棄者，如雲之從風，東西無定。此女被棄，心亦無定如雲。然此女雖則如雲，非我思慮之所存在，以其非己之妻，故心不存焉。彼被棄眾女之中，有著縞素之衣、綦色之巾者，是我之妻，今亦絕去，且得少時留住，則以喜樂我雲。民人思保室家，情又若此。迫於兵革，不能相畜，故所以閔之。○傳“思不存乎相救急”。○正義曰：言其見棄既多，困急者眾，非己一人所以救恤，故其思不得存乎相救急。○傳“縞衣”至“相樂”。○正義曰：《廣雅》雲：“縞，細繪也。”《戰國策》雲：“強弩之餘，不能穿魯縞。”然則縞是薄繪，不染，故色白也。《顧命》雲：“四人綦弁。”注云：“青黑曰綦。”《說文》雲：“綦，蒼艾色也。”然則綦者，青色之小別。《顧命》為弁，色故以為青黑。此為衣巾，故為蒼艾色。蒼即青也。艾謂青而微白，為艾草之色也。知縞衣男服、綦巾女服者，以作者既言非我思存，故原其自相配合，故知一衣一巾，有男有女，先男後女，文之次也。傳以“聊”為“願”，故云“願室家得相樂”。室家即縞衣綦巾之男女也。○箋“縞衣”至“綦文”。○正義曰：箋以序稱民人思保其室家，言夫思保妻也。經稱“有女如雲”，是男言有女也。經、序皆據男為文，則縞衣綦巾是男之所言，不得分為男女二服。衣巾既共為女服，則此章所言，皆是夫自言妻，非他人言之，故首尾皆易傳。則詩人為詩，雖舉一國之事，但其辭有為而發，故言縞衣綦巾所為作者之妻服也。己謂詩人自己，既相棄，又原且留，是心不忍絕也。訓“聊”為“且”，故言且留可以樂我雲也。箋亦以綦為青色，但綦是文章之色，非染繒之色，故云“綦，綦文”，謂巾上為此蒼文，非全用蒼色為巾也。" }
      - { type: j, text: "出其闉瘏，有女如荼。闉，曲城也。瘏，城臺也。荼，英荼也。言皆喪服也。箋雲：瘏讀當如“彼都人士”之“都”，謂國外曲城之中市裏也。荼，茅秀，物之輕者，飛行無常。○闉音因。瘏，鄭、郭音都。孫炎雲：“積土如水渚，所以望氣祥也。”徐止奢反，又音蛇。荼音徒。秀，本或作“莠”，音同。劉昌宗《周禮音》莠音酉。雖則如荼，匪我思且。箋雲：“匪我思且”，猶“非我思存”也。○且音徂，《爾雅》雲：“存也。”舊子徐反。縞衣茹藘，聊可與娛。茹藘，茅蒐之染女服也。娛，樂也。箋雲：茅蒐，染巾也。“聊可與娛”，且可留與我為樂。心欲留之言也。○娛，本亦作“虞”。" }
      - { type: z, text: "“出其”至“與娛”。○毛以為，詩人言我出其鄭國曲城門臺之外，見有女被棄者眾多，皆著喪服，色白如荼。然雖則眾多如荼，非我思所存救，以其眾多，不可救恤，惟原昔日夫妻更自相得。彼服縞衣之男子，服茹藘之女人，是其舊夫妻也，願其還得配合，可令相與娛樂。閔其相棄，故願其相樂。○鄭以為，國人有棄其妻者，自言出其曲城都邑市裏之外，見有女被棄者如荼，飛揚無所常定。此女被棄，心亦無定如荼。然此女雖則如荼，非是我之所思。以非己妻，故不思之。其中有著縞素之衣、茹藘染巾者，是我之妻，今亦絕去，且得少時留住，可與之娛樂也。情深如此，而不能相畜，故閔之。○傳“闉曲”至“喪服”。○正義曰：上言“出其東門”，此文亦言“出其闉闍”，字皆從門，則知亦是人所從出之處。《釋宮》雲：“闍謂之臺。”是闍為臺也。出謂出城，則闍是城上之臺，謂當門臺也。闍既是城之門臺，則知闉是門外之城，即今之門外曲城是也，故云“闉，曲城”，“闍，城臺”。《說文》雲：闉闍，城曲重門。謂闉為曲城。《釋草》有“荼，苦菜”，又有“荼，委葉”。《邶風》“誰謂荼苦”，即苦菜也。《周頌》“以薅荼蓼”，即委菜也。鄭於《地官·掌荼》注及《既夕》注與此箋皆雲“荼，茅秀”，然則此言“如荼”，乃是茅草秀出之穗，非彼二種荼草也。言“荼，英荼”者，《六月》雲：“白旆英英”，是白貌。茅之秀者，其穗色白，言女皆喪服，色如荼然。《吳語》說“吳王夫差於黃池之會，陳兵以脅晉，萬人為方陳，皆白常、白旗、素甲、白羽之矰，望之如荼”。韋昭雲：“荼，茅秀。”亦以白色為如荼，與此傳意同。女見棄，所以喪服者，王肅雲：“見棄，又遭兵革之禍，故皆喪服也。”○箋“闍讀”至“無常”。○正義曰：以《爾雅》謂臺為瘏，不在城門之上。此言“出其”，不得為出臺之中，故轉為“彼都人士”之“都”。都者，人所聚會之處，故知謂國外曲城中之市裏也。以詩說女服，言綦巾茹藘，則非盡喪服，不得為“其色如荼”，故易傳以荼飛行無常，與上章相類為義也。" }
      - { type: j, text: "《出其東門》二章，章六句。" }
      - { type: j, text: "《野有蔓草》，思遇時也。君之澤不下流，民窮於兵革，男女失時，思不期而會焉。“不期而會”，謂不相與期而自俱會。○蔓音萬。" }
      - { type: z, text: "“《野有蔓草》二章，章六句”至“會焉”。○正義曰：作《野有蔓草》詩者，言思得逢遇男女合會之時，由君之恩德潤澤不流及於下，又征伐不休，國內之民皆窮困於兵革之事，男女失其時節，不得早相配耦，思得不與期約而相會遇焉。是下民窮困之至，故述其事以刺時也。“男女失時”，謂失年盛之時，非謂婚之時月也。毛以為，君之潤澤不下流，二章首二句是也。“思不期而會”，下四句是也。鄭以經皆是思不期而會之辭，言君之潤澤不流下，敘男女失時之意，於經無所當也。" }
      - { type: j, text: "野有蔓草，零露漙兮。興也。野，四中之外。蔓，延也。漙，漙然盛多也。箋雲：零，落也。蔓草而有露，謂仲春之時，草始生，霜為露也。《周禮》“仲春之月，令會男女之無夫家者”。○漙，本亦作“團”，徒端反。有美一人，清揚婉兮。邂逅相遇，適我原兮。清揚，眉目之間婉然美也。邂逅，不期而會，適其時原。○婉，於阮反。邂，戶懈反。遘，本亦作“逅”，胡豆反。" }
      - { type: z, text: "“野有”至“原兮”。○毛以為，郊外野中有蔓延之草，草之所以能延蔓者，由天有隕落之露，漙漙然露潤之兮，以興民所以得蕃息者，由君有恩澤之化養育之兮。今君之恩澤不流於下，男女失時，不得婚娶，故於時之民，乃思得有美好之一人，其清揚眉目之間婉然而美兮，不設期約，邂逅得與相遇，適我心之所願兮。由不得早婚，故思相逢遇。是君政使然，故陳以刺君。○鄭以蔓草零露記時為異，餘同。○傳“野四”至“盛多”。○正義曰：《釋地》雲：“郊外謂之牧，牧外謂之野。”是野在四郊之外。此唯解文，不言興意。王肅雲：“草之所以能延蔓，被盛露也。民之所以能蕃息，蒙君澤也。”○箋“零落”至“夫家”。○正義曰：靈作零字，故為落也。仲春、仲秋俱是晝夜等溫涼中。九月霜始降，仲秋仍有露，則知正月猶有霜，二月始有露，故云蔓草生而有露，謂仲春時也。所引《周禮·地官·媒氏》有其事，取其意，不全取文，與彼小異。鄭以仲春為媒月，故引以證此為記時。言民思此時而會者，為此時是婚月故也。" }
      - { type: j, text: "野有蔓草，零露瀼瀼。瀼瀼，盛貌。○瀼，如羊反，徐又乃剛反。有美一人，婉如清揚。邂逅相遇，與子皆臧。臧，善也。" }
      - { type: j, text: "《野有蔓草》二章，章六句。" }
      - { type: j, text: "《溱洧》，刺亂也。兵革不息，男女相棄，淫風大行，莫之能救焉。救，猶止也。亂者，士與女合會溱、洧之上。○溱洧，側巾反，下於軌反。《說文》“溱”作“潧”，雲：“潧水出鄭，溱水出桂陽也。”" }
      - { type: j, text: "溱與洧，方渙渙兮。溱、洧，鄭兩水名。渙渙，春水盛也。箋雲：仲春之時，冰以釋，水則渙渙然。○渙，呼亂反，《韓詩》作“洹”。洹音丸，《說文》作“汎”。汎音父弓反。士與女，方秉蕳兮。蕳，蘭也。箋雲：男女相棄，各無匹偶，感春氣並出，託採芬香之草，而為淫泆之行。○蕳，古顏反，字從草，《韓詩》雲：“蓮也。”若作竹下是簡策之字耳。泆音逸。行，下孟反。女曰：“觀乎？”士曰：“既且。”箋雲：“女曰觀乎”，欲與士觀於寬閒之處，既，已也。士曰已觀矣，未從之也。○且音徂，往也，徐子胥反，下章放此。閒音閒。處，昌慮反。“且往觀乎！洧之外，洵訏且樂。”訏，大也。箋雲：洵，信也。女情急，故勸男使往觀於洧之外，言其土地信寬大又樂也。於是男則往也。○洵，息旬反，《韓詩》作“恂”。訏，況於反，《韓詩》作“盱”，雲：“恂盱，樂貌也。”樂音洛，注下同。維士與女，伊其相謔，贈之以勺藥。勺藥，香草。箋雲：伊，因也。士與女往觀，因相與戲謔，行夫婦之事。其別，則送女以勺藥，結恩情也。" }
      - { type: z, text: "“溱與洧”至“勺藥”。○正義曰：鄭國淫風大行，述其為淫之事。言溱水與洧水，春冰既泮，方欲渙渙然流盛兮。於此之時，有士與女方適野田，執芳香之蘭草兮。既感春氣，託採香草，期於田野，共為淫泆。士既與女相見，女謂士曰：“觀於寬閒之處乎？”意原與男俱行。士曰：“已觀矣。”止其欲觀之事，未從女言。女情急，又勸男雲：“且復更往觀乎？我聞洧水之外，信寬大而且樂，可相與觀之。”士於是從之。維士與女，因即其相與戲謔，行夫婦之事。及其別也，士愛此女，贈送之以勺藥之草，結其恩情，以為信約。男女當以禮相配，今淫泆如是，故陳之以刺亂。○傳“蕳，蘭”。○正義曰：陸機《疏》雲：“蕳即蘭，香草也。《春秋》傳曰‘刈蘭而卒’，《楚辭》雲‘紉秋蘭’，孔子曰‘蘭當為王者香草’，皆是也。其莖葉似藥草澤蘭，廣而長節，節中赤，高四五尺。漢諸池苑及許昌宮中皆種之。可著粉中，藏衣著書中，闢白魚。”○傳“訏，大”。○正義曰：《釋詁》文。○箋“洵信”至“則往”。○正義曰：“洵，信”，《釋詁》文。以“士曰既且”，是男答女也。“且往觀乎”，與上“女曰觀乎”文勢相副，故以女勸男辭。言其寬且樂，於是男則往也。下句是男往之事。○傳“勺藥，香草”。○正義曰：陸機《疏》雲：“今藥草勺藥無香氣，非是也。未審今何草。”○箋“伊，因”。○正義曰：因觀寬閒，遂為戲謔，故以伊為因也。" }
      - { type: j, text: "溱與洧，瀏其清矣。瀏，深貌。○瀏音留，《說文》“流清也”，力尤反。士與女，殷其盈矣。殷，眾也。女曰：“觀乎？”士曰：“既且。”“且往觀乎！洧之外，洵訏且樂。”維士與女，伊其將謔，贈之以勺藥。箋雲：將，大也。" }
      - { type: j, text: "《溱洧》二章，章十二句。" }
      - { type: j, text: "鄭國二十一篇，五十三章，二百八十三句。" }
      - { type: j, text: "《毛詩正義》" }
