# 儀禮注疏卷26（賈公彥疏）：j 為經文＋鄭玄注，z 為疏文。
sections:
  - id: juan26
    name: 正文
    blocks:
      - { type: j, text: "明日，賓朝服拜賜於朝。拜食與侑幣，皆再拜稽首。朝，謂大門外。" }
      - { type: z, text: "“明日”至“稽首”。○注“朝謂大門外”。○釋曰：自此盡“訝聽之”，論賓拜謝主君之事。雲“朝，謂大門外”者，以其經雲拜賜於朝，無賓入之文，又《聘禮》以柩造朝，亦無喪入之，故皆言朝雲雲，朝謂大門外也。若然，案閔三年《左氏傳》雲：“季友將生，使卜楚丘之父卜之曰：男也。其名曰友，在公之右，閒於兩社，為公室輔。”注：兩社，“周社、亳社之間，朝廷執政所在”。但諸侯左宗廟，右社稷，在大門之內。則諸侯外朝不在大門內者，但外朝在大門外兩社之閒，遙系外朝而言執政所在。又此《食禮》拜侑幣，《聘禮》歸饔餼，直言拜饔與餼，不拜束帛者，彼使人致之，故不拜。此食禮，君親賜，不拜之。" }
      - { type: j, text: "訝聽之。受其言，入告出報也。此下大夫有士訝。" }
      - { type: z, text: "“訝聽之”。○注“受其”至“士訝”。○釋曰：雲“此下大夫有士訝”者，此篇是子男使下大夫小聘，又案《周禮·掌訝》“大夫有士訝”，故云此下大夫有士訝也。" }
      - { type: j, text: "上大夫八豆、八簋、六鉶、九俎，魚臘皆二俎。記公食上大夫，異於下大夫之數。豆加葵、菹、蝸、醢，四四為列，俎加鮮魚、鮮臘，三三為列，無特。" }
      - { type: z, text: "“上大夫”至“二俎”。○注“記公”至“無特”。○釋曰：雲“豆加葵、菹、蝸、醢”者，案《周禮·醢人》朝事之豆，雲韭菹、醓醢、昌本、麋臡、菁菹、鹿臡、茆菹、麇臡。案上文下大夫六豆用鹿臡，以下仍有茆菹、麇臡在。今上大夫八豆，不取茆菹、麇臡，而取饋食之豆葵菹、蝸醢者，鄭以《特牲》、《少牢》參之，彼二篇俱以饋食為始，皆用《周禮》饋食之豆。《特牲》兩豆用饋食葵菹、蝸醢。《少牢》四豆，二豆與《特牲》同，兩豆用朝事之豆，韭菹、醓醢。注云：“韭菹、醓醢，朝事之豆也。”而饋食用之豐大夫禮，以此觀之，故此《公食大夫》兼用饋食之豆，亦是豐大夫禮也。雲“俎加鮮魚、鮮臘”者，上文下大夫七俎，牛、羊、豕、魚、臘、腸胃與膚，此雲“九俎”，明加鮮魚、鮮臘。雲“無特”者，陳饌要方，上七俎者，東西兩行為六俎，一俎在特，於俎東。此九俎為三行，故無特，雖無特，膚亦為下。" }
      - { type: j, text: "魚、腸胃、倫膚，若九若十有一，下大夫則若七若九。此以命數為差也。九謂再命者也，十一謂三命者也，七謂一命者也，九或上或下者，再命謂小國之卿，次國之大夫也。卿則曰上，大夫則曰下。大國之孤視子男。" }
      - { type: z, text: "“魚腸”至“若九”。○注“此以”至“子男”。○釋曰：雲“此以命數為差也”者，案《周禮·典命》公侯伯之卿三命，大夫再命，士一命；子男之卿再命，大夫一命，士不命。則諸侯之臣分為三等：三命，再命，一命。不命與一命同。此經魚、腸胃、倫膚亦分為三等，有十一，有九，有七。則十一當三命，九當再命，七當一命。若然，唯有上下二文者，以公侯伯之大夫與子男之卿同再命，卿爵尊為上，大夫爵卑為下。則上言若九者，子男之卿也，下言若九者，公侯伯大夫也，故鄭雲“卿則曰上，大夫則曰下”。雲“大國之孤視子男”者，欲見此經唯見三命以下，案《周禮·典命》大國之孤四命。又《大行人》雲大國之孤，執皮帛以繼子男，又云“其他皆視小國之君”。若然，孤與子男同十三，侯伯十五，上公十七，差次可知。" }
      - { type: j, text: "庶羞，西東毋過四列。謂上下大夫也。古文毋為無。" }
      - { type: z, text: "“庶羞”至“四列”。○注“謂上”至“為無”。○釋曰：上文雲“庶羞旁四列”，此上大夫饌內言“庶羞西東毌過四列”，則東西橫行，上下大夫皆四以為行，下大夫四四十六，東西四行，南北亦四行；上大夫東西四行，南北五行矣。" }
      - { type: j, text: "上大夫庶羞二十，加於下大夫以雉、兔、鶉、鴽。鴽，無母。" }
      - { type: z, text: "“上大”至“鶉鴽”。○注“鴽無母”。○釋曰：雲“鴽，無母”者，案《爾雅·釋鳥》雲“鴽，鴾母”，郭氏曰：“鵪也，青州人呼曰鴾母。”《莊子》曰：“田鼠化為鶉。”《淮南子》雲：“蝦<蟲麻>所化也。”《月令》曰：“田鼠化為鴽。”然則鴽、鶉，一物也。" }
      - { type: j, text: "若不親食，謂主國君有疾病，若它故。" }
      - { type: z, text: "“若不親食”。○注“謂主”至“它故”。○釋曰：自此盡“聽命”，論主君不親食，使大夫致禮於賓館之事。疾病之外，別雲“他故”者，君有死喪之事，故《聘禮》雲“主人畢歸禮，賓唯饔餼之受”，謂畢致饗食，但賓不受之。" }
      - { type: j, text: "使大夫各以其爵、朝服以侑幣致之。執幣以將命。豆實，實於甕，陳於楹外，二以並，北陳。簋實，實於筐，陳於楹內、兩楹閒，二以並，南陳。陳甕筐於楹閒者，象授受於堂中也。南北相當，以食饌同列耳。甕北陳者，變於食。甕數如豆，醢芥醬從焉。筐米四。今文並作亻並。" }
      - { type: z, text: "“豆實”至“南陳”。○注“陳甕”至“作亻並”。○釋曰：雲“南北相當，以食饌同列耳”者，案上文正食之時，黍稷亦南陳，今於楹閒陳，筐米亦南陳，是正食及此饌陳是同列也。雲“甕北陳者，變於食”者，上文正食之時，“宰夫自東房，薦豆六，設於醬東，西上”陳之，今於楹閒二以並，北陳，故云變於食也。雲“甕數如豆”者，以菹醢各異物，不可同甕，故甕數如豆。上大夫八豆則八甕，下大夫六豆則六甕。雲“醢芥醬從焉”者，以其三牲不殺，生列於門內，醢經百日乃成，不由不殺，故有醢。庶羞之醢同是醬類，故使之相從。但庶羞之醢，更無別種，宜同一甕，芥醬宜亦一甕。知有芥醬者，以其有生魚，故知有也。雲“筐米四”者，上文上大夫八簋，今乃生致之，黍稷宜各一筐，稻粱又二筐，故云筐米四。" }
      - { type: j, text: "庶羞陳於碑內。生魚也。魚臘從焉。上大夫加鮮魚、鮮臘、雉兔鶉鴐，不陳於堂，闢正饌。" }
      - { type: z, text: "“庶羞陳於碑內”。○注“生魚”至“正饌”。○釋曰：雲“生魚”者，上文魚膾是魚之中膾者，皆是生魚也。案鄭注《周禮》雲“燕人膾魚方寸，切其腴以啗所貴”是也。此則全生不膾，何者？十膾在豆，與胾炙俱設，今胾炙在牲未殺，膾全不破可知。若然，庶羞之內，眾羞俱有，鄭獨雲生魚者，以其胾炙在牲不殺，於此無矣。雖有乾臘、雉兔之等，以生魚為主，故云生魚也。雲“魚臘從焉”者，雖無三牲之肉，有乾魚臘可知。雲“上大夫加鮮魚、鮮臘、雉兔鶉鴽”者，以其下大夫七鼎，無鮮魚、鮮臘，上大夫九鼎，加鮮魚、鮮臘可知，雉兔鶉鴽亦生致之矣。雲“不陳於堂，闢正饌”者，以其庶羞本在堂上，正饌之西，今在碑內，故云闢正饌也。若然，不陳於碑南者，以其本合在堂，今宜近堂，故在碑北。" }
      - { type: j, text: "庭實陳於碑外。執乘皮者也，不參分庭一在南者，以言歸，宜近內。" }
      - { type: z, text: "“庭實陳於碑外”。○注“執乘”至“近內”。○釋曰：“執乘皮者，不參分庭一在南者，以言歸，宜近內”者，庭實正法，皆參分庭一在南而陳之，故《昏禮》記雲：納徵，執皮者，“參分庭一在南”。今雲“碑外”，繼碑而言近北矣，彼參分庭一在南陳之者，謂在主人之庭，參分庭陳之，擬與賓向外，故近南。此陳於客館，擬與賓入內，故鄭雲以言歸故在內也。" }
      - { type: j, text: "牛、羊、豕陳於門內西方，東上。為其踐汙館庭，使近外。" }
      - { type: z, text: "“牛羊”至“東上”。○注“為其”至“近外”。○釋曰：案上庶羞與庭實在碑之內，近內陳之；此牛羊豕陳於門內，繼門言之，雲“為其踐汙館庭，使近外”也。若然，致饔餼，牛、羊、豕亦在此，此雲使近外者，以饔餼有腥有熟，故略。其生者近門，是其常。此既不殺，牛、羊、豕宜近內，故決之也。" }
      - { type: j, text: "賓朝服以受，如受饔禮。朝服，食禮輕也。" }
      - { type: z, text: "“賓朝”至“饔禮”。○注“朝服食禮輕也”。○釋曰：雲“朝服，食禮輕”者，以其歸饔餼時，卿韋弁，賓皮弁。受此食禮，賓朝服，受不皮弁，故云食禮輕。" }
      - { type: j, text: "無擯。以己本宜往。" }
      - { type: z, text: "“無擯”。○注“以己本宜往”。○釋曰：雲“以己本宜往”者，明主君無故，速賓在廟行食禮，而有侑幣賓，無儐法。主君有故，致食禮並有侑幣，亦不合有儐，故云以己本宜往。" }
      - { type: j, text: "明日，賓朝服以拜賜於朝。訝聽命。賜亦謂食，侑幣。" }
      - { type: z, text: "注“賜亦謂食侑幣”。○釋曰：雲“亦”者，亦上速賓食時，拜食與侑幣，今亦然，故云亦。" }
      - { type: j, text: "大夫相食，親戒速。記異於君者也。速，召也。先就告之，歸具，既具，復自召之。" }
      - { type: z, text: "“大夫”至“戒速”。○注“記異”至“召之”。○釋曰：自此盡“大夫之禮”，論主國大夫食賓之禮別於主君之事。雲“記異於君”者，案下文“其他皆如公食大夫之禮”，故知自此已下，皆記異於君法。是以此經大夫親戒速，決君不親戒速，此則異於君也。以其下諸文皆異，故云記異於君者也。雲“先就告之，歸具，既具，復自召之”者，以其戒具兩有，皆親為之，故為此解，與《鄉飲酒》、《鄉射》同，故彼二文皆雲戒賓既歸，布筵設尊，乃親速賓是也。" }
      - { type: j, text: "迎賓於門外，拜至，皆如饗拜。饗，大夫相饗之禮也，今亡。古文饗或作鄉。降盥，受醬、湆、侑幣、束錦也，皆自阼階降堂受，授者升一等。皆者，謂受醬、受湆、受幣也。侑用束錦，大夫文也。降堂，謂止階上。今文無束。賓止也。主人三降，賓不從。" }
      - { type: z, text: "“賓止也”。○注“主人三降賓不從”。○釋曰：雲“主人三降”者，案上文鄭注“皆”者，謂受醬、受湆、受幣，皆自阼階降。此鄭雲“主人三降”，即上三者。不數主人降盥者，案《鄉飲酒》所言降盥者，皆為洗爵，故賓從降。此降盥不為洗爵，故鄭不數之。案《聘禮》致饔餼，“賓降堂，受老束錦，大夫止”。注云：“止不降，使之餘尊。”此賓不降者，雖賓主敵，以主人降堂，不至地，故賓止不降也。" }
      - { type: j, text: "賓執粱與湆，之西序端。不敢食於尊處。" }
      - { type: z, text: "“賓執”至“序端”。○注“不敢食於尊處”。○釋曰：此兩大夫敵，故之西序端。上公食大夫，大夫降階下，臣卑故也。" }
      - { type: j, text: "主人辭，賓反之。卷加席，主人辭，賓反之。辭幣，降一等，主人從。從辭賓降。受侑幣，再拜稽首。主人送幣，亦然。敵也。" }
      - { type: z, text: "“受侑”至“亦然”。○注“敵也”。○釋曰：案《郊特牲》雲：“大夫之臣不稽首，非尊家臣，以闢君也。”又案“左氏傳”哀十七年：“公會齊侯盟於蒙，孟武伯相。齊侯稽首，公拜。齊人怒。武伯曰：非天子，寡君無所稽首。”若然，臣於君乃稽首，平敵相於當頓首。今言敵而“稽首”者，以食禮相尊敬，雖敵亦稽首，與臣拜君同故也。" }
      - { type: j, text: "辭於主人，降一等，主人從。辭，謂辭其臨己食。卒食，徹於西序端。亦親徹。東面再拜，降出。拜，亦拜卒食。其他皆如公食大夫之禮。" }
      - { type: z, text: "“其他”至“之禮”。○釋曰：雲“其他”謂豆數、俎體、陳設皆不異上陳，但禮異者，謂親戒速，君則不親迎賓，公不出。此大夫出大門，公受醬湆幣，不降，此大夫則降也。公食大夫，大夫降食於階下，此言“西序端”。上公食卷加席，公不辭，此則辭之，皆是異也。" }
      - { type: j, text: "若不親食，則公作大夫，朝服以侑幣致之。作，使也。大夫有故，君必使其同爵者為之致禮。列國之賓來，榮辱之事君臣同。賓受於堂。無擯。與受君禮同。" }
      - { type: z, text: "“賓受於堂無擯”。○注“與受君禮同”。○釋曰：雲“與受君禮同”者，《聘禮》賓受致饔幣，雲“堂中西，北面”，注：“趨主君之命也。堂中西，中央之西。”此雖無儐，受幣亦與之同也。" }
      - { type: j, text: "記。不宿戒。食禮輕也。此所以不宿戒者，謂前期三日之戒，申戒為宿，謂前期一日。" }
      - { type: z, text: "“記不宿戒”。○注“食禮”至“一日”。○釋曰：祭祀，散齊七日為戒，致齊三日為宿，此則與祭祀異。此“不宿戒”者，謂不為三日之戒，又不為一日之宿，故鄭雲“此所以不宿戒者，謂前期三日之戒，申戒為宿，謂前期一日”者。若然，必知三日之戒，一日之宿者，《大射》前期三日，宰夫戒宰及司馬，又《少牢》闢人君，有前期一日之宿。此雖人君禮，以食禮輕，故知有三日之戒，一日之宿。既無前日之事，宜與《鄉飲酒》、《鄉射禮》同當日為之，故皆不言日數。故下注雲“食賓之朝，宿興戒之，賓則從戒而來，不復召”是也。" }
      - { type: j, text: "戒，不速。食賓之朝，夙興戒之，賓則從戒者而來，不復召。不授幾。異於醴也。" }
      - { type: z, text: "“不授幾”。○注“異於醴也”。○釋曰：決禮賓時，公親授幾也。" }
      - { type: j, text: "無阼席。公不坐。" }
      - { type: j, text: "亨於門外東方。必於門外者，大夫之事也。東方者，主陽。" }
      - { type: z, text: "“亨於門外東方”。○注“必於”至“主陽”。○釋曰：案上經甸人、亨人之等，亨人是士官，不得言大夫之事，言大夫之事者，解亨在門外之禮也。《燕禮》注云：“亨於門外，臣所掌也。”言臣亦是大夫事。《少牢》廩爨、饔爨皆在門外，亦大夫事。《特牲》雲“主婦視饎，爨於西堂下”者，以其無廩人主之，故在內。若然，《鄉飲酒》雖是大夫之事，以其取祖陽氣之始，故亦於門內。" }
      - { type: j, text: "司宮具幾，與蒲筵常，緇布純，加萑席尋，玄帛純，皆卷自末。司宮，大宰之屬，掌宮廟者也。丈六尺曰常，半常曰尋。純，緣也。萑，細葦也。末，經所終，有以識之。必長筵者，以有左右饌也。今文萑皆為莞。" }
      - { type: z, text: "“司宮”至“自末”。○注“司宮”至“為莞”。○釋曰：雲“司宮，大宰之屬，掌宮廟者”，案《燕禮》雲：“司宮尊於東楹之西。”注：“司宮，天子曰小宰，聽酒人之成要者也。”注雖不同，其義一也。但《燕禮》司宮雲設尊，故以小宰解之，此司宮設几席，故以大宰之屬解之。案大宰之下有宮人，掌宮中除汙穢之事，即此司宮。彼不言設几席者，以天子具官，別有司几筵，又有小宰。諸侯兼官，故司宮兼司几筵及小宰也。雲“丈六尺曰常，半常曰尋”者，此皆無正文。案《周禮·考工記》雲車有六等之數，雲：“軫崇四尺，謂之一等；又云戈長六尺六寸，既建而迆之，崇於軫四尺，謂之二等；人長八尺，崇於戈四尺，謂之三等；殳長尋有四尺，崇於人四尺，謂之四等；車戟常，崇於殳四尺，謂之五等；酋矛常有四尺，崇於戟四尺，謂之六等。”自軫至矛，皆以四尺為差。以是約之，即知常是丈六尺，尋是八尺也。雲“萑，細葦”者，以類言之，其實全別。是以《詩》雲“葭菼”，注云：“葭，蘆菼。”則葦一名蘆，一名，一名萑，一名菼。此萑又與莞席之莞不同，彼莞謂蒲也。雲“有以識之”者，席無異物為記，但織之自有首尾可為記識耳。雲“必以長筵者，以有左右饌”者，賓在戶牖之閒，南面，上陳饌之時，正饌在左，庶羞在右，陳饌雖不在席上，皆陳於席前，當席左右，其閒容人，故謂長筵也。" }
      - { type: j, text: "宰夫筵，出自東房。筵本在房，宰夫敷之也。天子諸侯左右房。" }
      - { type: z, text: "“宰夫”至“東房”。○注“筵本”至“右房”。○釋曰：上雲司宮具几筵，具之在房，宰夫敷之而已。“天子諸侯左右房”，以其言東房，對西房。若大夫士直有東房而已，故直雲“在房”也。" }
      - { type: j, text: "賓之乘車在大門外西方，北面立。賓車不入門，廣敬也。凡賓即朝，中道而往，將至，下行，而後車還立於西方。賓及位而止，北面。卿大夫之位當車前。凡朝位，賓主之閒，各以命數為遠近之節也。" }
      - { type: z, text: "“賓之”至“面立”。○注“賓車”至“節也”。○釋曰：雲“賓車不入門，廣敬也”者，《曲禮》雲“客車不入大門”，與此同。《覲禮》雲“偏駕不入王門”，偏駕，謂同姓金路之等。乘墨車以朝，墨車亦云不入大門，與此亦同。雲“凡賓即朝，中道而往”者，《內則》雲：“男子由右，女子由左，車從中央。”故賓乘車中道。雲“而後車還立於西方”者，案《少儀》雲：“僕於君子，始乘則式，君子下行，然後還立。”注云：“還車而立，以俟其去。”是還立於西方鄉外。雲“賓及位而止，北面”者，案《玉藻》雲“賓立不當門”，彼亦謂聘使也。雲“卿大夫之位當車前”者，案《大行人》雲上公立當軹，侯伯立當前疾，子男立當衡，又云大國之孤“朝位當車前”者，則卿大夫立亦與孤同一節。兼雲大夫者，小聘曰問，使下大夫，立與孤卿同當車前，故連言也。雲“凡朝位，賓主之閒，各以命數為遠近之節”者，案《大行人》雲上公朝位，賓主之閒九十步，侯伯七十步，子男五十步，注云：“朝位，謂大門外賓下車，及王車出迎所立處。”又云“凡諸侯之卿，其禮各下其君二等，以下及大夫士皆如之”。若然，如諸侯則依命數，臣下其君二等，則不得依命數矣。而云依命數者，依命數據君而言，其臣依君命數而降之，故鄭總以命數言之也。" }
      - { type: j, text: "鉶芼，牛霍、羊苦、豕薇，皆有滑。藿，豆葉也。苦，苦荼也。滑，堇荁之屬。今文苦為芐。" }
      - { type: z, text: "“鉶芼”至“有滑”。○注“藿豆”至“為芐”。○釋曰：雲“滑，堇荁之屬”者，案《士虞記》雲：“鉶芼，用苦若薇，有滑。夏用葵，冬用荁。”鄭注云：“荁，堇類也。乾則滑。夏秋用生葵，冬春用乾荁。”此經雲“皆有滑”，不言所用之物，故取《士虞記》解之。雲“之屬”者，其中兼有葵也。" }
      - { type: j, text: "贊者盥，從俎升。俎，其所有事。" }
      - { type: z, text: "“贊者盥從俎升”。○注“俎其所有事”。○釋曰：直言此者，豆亦從下升。不言從豆升者，贊者不佐祭豆，直佐祭俎，故云“俎，其所有事”。是以上經雲：“三特之肺不離，贊者辯取之，壹以授賓。”若然，黍稷亦贊祭，不彼黍稷升者，黍稷設之在後故也。黍稷雖後升，先祭者，以其先食黍稷，後食肉故也。" }
      - { type: j, text: "簠有蓋冪。稻粱將食乃設，去會於房，蓋以冪。冪，巾也。今文或作幕。" }
      - { type: z, text: "“簠有蓋冪”。○注“稻粱”至“作幕”。○釋曰：簠簋相將，簋既有會，明簠亦有會可知。但黍稷先設，故卻會於敦南，簠盛稻粱，將食乃設，故鄭雲“去會於房，蓋以冪。冪，巾也”。至於陳設，冪亦去之，經雲“有蓋冪”者，據出房未設而言。" }
      - { type: j, text: "凡炙無醬。已有咸和。" }
      - { type: z, text: "“凡炙無醬”。○注“已有咸和”。○釋曰：雲“凡”者，欲解《儀禮》一部之內，牛、羊、豕炙，皆無醬配之。雲“已有咸和”者，若今人食炙然。" }
      - { type: j, text: "上大夫蒲筵，加萑席。其純，皆如下大夫純。謂三命大夫也。孤為賓，則莞筵紛純，加繅席畫純也。" }
      - { type: z, text: "“上大”至“夫純”。○注“謂三”至“純也”。○釋曰：經雲上大夫不辨命數，則子男之卿再命，其席亦同下大夫。鄭言“謂三命大夫”者，欲見公侯伯之卿三命，亦與子男下大夫同。公之孤四命，其席則異，鄭據三命而言。雲“孤為賓，則莞筵紛純，加繅席畫純”者，案《周禮·司几筵》雲筵國賓於牖前，“莞筵紛純，加繅席畫純”，雲“左彤幾”，與此記三命已下席不同，故知彼國賓謂筵孤也，無正文，故云“則”也。" }
      - { type: j, text: "卿擯由下。不升堂也。" }
      - { type: z, text: "“卿擯由下”。○注“不升堂也”。○釋曰：此謂上擯擯詔賓主升降周還之事，故云“不升堂”。" }
      - { type: j, text: "上贊，下大夫也。上，謂堂上。擯，贊者，事相近，以佐上下為名。" }
      - { type: z, text: "“上贊下大夫也”。○注“上謂”至“為名”。○釋曰：案上經雲贊者告具於公而贊賓食，故云上贊使下大夫為之。" }
      - { type: j, text: "上大夫庶羞。酒飲漿飲，庶羞可也。於食庶羞，宰夫又設酒漿，以之食庶羞可也。以優賓。" }
      - { type: z, text: "“上大夫”至“可也”。○注“於食”至“優賓”。○釋曰：案上經雲“上大夫庶羞二十豆”，此記人復記之者，欲見上大夫食加飯之時，得兼食庶羞。又食會飯及庶羞之時，宰夫更設酒飲、漿飲，故鄭雲“於食庶羞，宰夫又設酒漿，所以食庶羞可也”。所以然者，優賓故也。" }
      - { type: j, text: "拜食與侑幣，皆再拜稽首。嫌上大夫不稽首。" }
      - { type: j, text: "《儀禮註疏》" }
      - { type: z, text: "《覲禮》第十。○鄭《目錄》雲：“覲，見也，諸侯秋見天子之禮。春見曰朝，夏見曰宗，秋見曰覲，冬見曰遇。朝宗禮備，覲遇禮省，是以享獻不見焉。三時禮亡，唯此存。爾覲禮於五禮屬賓。《大戴》第十六，《小戴》十七，《別錄》第十。”○釋曰：鄭雲“春見曰朝”等，《大宗伯》文。雲“朝宗禮備，覲遇禮省”者，按《曲禮下》雲：“天子當扆而立，諸侯北面而見天子曰覲。天子當寧而立，諸公東面，諸侯西面曰朝。”鄭注：“諸侯春見曰朝，受摯於朝，受享於廟，生氣，文也。秋見曰覲，一受之於廟，殺氣，質也。朝者，位於內朝而序進；覲者，位於廟門外而序入。王南面立於扆，寧而受焉。夏宗依春，冬遇依秋，春秋時齊侯唁魯昭公，以遇禮相見，取易略也。覲禮今存，朝、宗、遇禮今亡。”據此彼而言，是朝宗禮備，覲遇禮省可知。鄭又云“是以享獻不見焉”者，享謂朝覲而行三享，獻謂二享後行私覿，私覿後即有私獻，獻其珍異之物。故《聘禮記》雲：“既覿，賓若私獻，奉獻將命。”注云：“時有珍異之物，或賓奉之，所以自序尊敬也。猶以君命致之。”臣聘猶有私獻，況諸侯朝覲，有私獻可知。是以《周禮·大宰職》雲：“大朝覲會同，贊玉幣、玉獻。”注云：“幣，諸侯享幣。玉獻，獻國珍異，亦執玉以致之。”大朝覲會同既有私獻者，四時常朝有私獻可知。案下文有享，亦當有獻，而云享，獻不見者，案《周禮·大行人》雲：上公冕服九章，介九人，賓主之閒九十步，廟中將幣三享。侯伯子男亦云。鄭雲：“朝先享不言朝者，朝正禮，不嫌有等。”彼據春夏朝宗而言，不見秋冬者，以四時相對，朝宗禮備，故見之。覲遇禮省，故略而不言。此下文見享者，不對春夏，故言之。鄭雲是以享獻不見者，據《周禮·大行人》而說也。必知鄭據《大行人》者，以其引《周禮》四時朝見，即雲“是以享獻不見”，明鄭據《周禮·大行人》而言也。有人解享字上讀，以獻不見為義者，苟就此文有享無獻，不辭之甚也。" }
      - { type: j, text: "覲禮。至於郊，王使人皮弁用璧勞。侯氏亦皮弁迎於帷門之外，再拜。郊，謂近郊，去王城五十里。《小行人職》曰：“凡諸侯入王，則逆勞於畿。”則郊勞者，大行人也。皮弁者，天子之朝朝服也。璧無束帛者，天子之玉尊也。不言諸侯，言侯氏者，明國殊舍異，禮不凡之也。郊舍狹寡，為帷宮以受勞。《掌舍職》曰：“為帷宮，設旌門。”" }
      - { type: z, text: "“覲禮”至“再拜”。○注“郊謂”至“旌門”。○釋曰：自此盡“乃出”，論侯氏至近郊，天子使使者勞侯氏之事。雲“郊，謂近郊”者，案《聘禮》雲至於近郊，君使卿勞。故知此郊者亦近郊也。知“近郊去王城五十里”者，成周與王城相去五十里，而《君陳序》雲“分正東郊成周”，鄭雲：“今河南洛陽相去則然，是近郊五十里也。”引《小行人職》者，約近郊勞是大行人，以其尊者宜逸，小行人既勞於畿，明近郊使大行人也。案《大行人》上公三勞，侯伯再勞，子男一勞。此雖不辨勞數，案《小行人》雲“凡諸侯入王，則逆勞於畿”，不辨尊卑，則五等同有畿勞。其子男唯有此一勞而已，侯伯又加遠郊勞，上公又加近郊勞，則此雲近郊，據上公而言。若然，《聘禮》使臣聘，而云近郊勞者，臣禮異於君禮。君禮宜先遠，臣禮宜先近故也。若然，《書傳略說》雲“天子之子十八曰孟侯”者，於四方諸侯來朝，迎於郊。《孝經》注亦云天子使世子郊迎者，皆異代法，非周禮也。案《玉人職》雲：“案十有二寸，棗栗十有二列，諸侯純九，大夫純五，夫人以勞諸侯。”注云：夫人謂王后。勞諸侯皆九勞，大夫皆五。此文不見者，以其《聘禮》於聘客，主國夫人尚有勞，以二竹簋方，明後亦有。略言王勞，不言後，文不具也。雲“皮弁者，天子之朝朝服”者，《司服》雲“視朝則皮弁”，故知在朝服皮弁，至入廟乃裨冕也。雲“璧無束帛者，天子之玉尊”者，此對諸侯玉卑，故《聘禮》雲“束帛加璧”，是諸侯臣所執。《小行人》合六幣雲“璧以帛，琮以錦，琥以繡，璜以黼”，是諸侯所執。以致享皆有束帛配之，諸侯玉卑故也。此乃行勞所用，以享禮況之耳。雲“不言諸侯，言侯氏者，明國殊舍異，禮不凡之也”者，言諸侯則凡之總稱，言侯氏則指一身，不凡之也。而所勞之處，或非一國，舍處不同，故不總言諸侯而云侯氏也。雲“郊舍狹寡，為帷宮以受勞”者，《周禮》十里有廬，三十里有宿，五十里有市，市有館，郊關之所各自有舍。或來者多，館舍狹寡，故不在館舍，以帷為宮，以受勞禮也。雲“《掌舍職》曰：為帷宮，設旌門”者，謂為帷宮，則設旌旗以表四門。彼天子所舍，平地之事，引之者，證諸侯行亦有帷宮，設旌為門之事也。案《聘禮》使卿勞，賓受於門內。司儀，諸侯之臣相為國客，亦是受勞於館，不為帷宮者，彼臣禮，卿行旅從徒眾少，故在館。此諸侯禮，君行師從徒眾多，故於帷宮。襄二十八年《左氏傳》雲：“子產相鄭伯以如楚，舍不為壇。”注云：“至敵國郊，除地封土為壇，以受郊勞。”又：“外僕言曰：先大夫相先君適四國，未嘗不為壇，今子草舍，無乃不可乎？子產曰：大適小，則為壇，小適大，苟舍而已，焉用壇。”彼亦是諸侯相朝，當為壇，以帷為宮受勞之事也。" }
      - { type: j, text: "使者不答拜，遂執玉，三揖。至於階，使者不讓，先升。侯氏升聽命，降，再拜稽首，遂升受玉。不答拜者，為人使不當其禮也。不讓先升，奉王命尊也。升者，升壇。使者東面致命，侯氏東階上西面聽之。" }
      - { type: z, text: "“使者”至“受玉”。○注“不答”至“聽之”。○釋曰：雲“升者，外壇”者，以帷宮無堂可升，故知升者升壇也。雲“使者東面致命，侯氏東階上西面聽之”者，知面位如此者，並約下文就館賜侯氏車服而知也。" }
      - { type: j, text: "使者左還而立，侯氏還璧，使者受。侯氏降，再拜稽首，使者乃出。左還，還南面，示將去也。立者，見侯氏將有事於己，俟之也。還玉，重禮。" }
      - { type: z, text: "“使者”至“乃出”。○注“左還”至“重禮”。○釋曰：直雲“使者左還”，不雲拜送玉者，凡奉命使，皆不拜送。若卿歸饔餼，不拜送幣，亦斯類也。若身自致者，乃拜送，下文儐使者及聘禮私覿、私面皆拜送幣是也。雲“左還，還南面，示將去也”者，以其東面致命而左還，明左還者，南面也，未降而南面，示將去故也。雲“立者，見侯氏將有事於己，俟之”者，經雲“而立”，即雲“侯氏還璧”，故知立者見侯氏將有還玉之事，於已故俟之不降。雲“還玉，重禮”者，案《聘義》圭璋還之，璧琮加束帛報之，所以輕財重禮。彼以璧琮不還，則為輕財者，以其璧琮加束帛，故為輕財不還。此以天子之璧不加束帛，尊之，與圭璋同，故亦還之，為重禮也。" }
      - { type: j, text: "侯氏乃止使者，使者乃入。侯氏與之讓升。侯氏先升，授幾。侯氏拜送幾，使者設幾，答拜。侯氏先升，賓禮統焉。幾者，安賓，所以崇優厚也。上介出止使者，則己布席也。" }
      - { type: z, text: "“侯氏”至“答拜”。○注“侯氏”至“席也”。○釋曰：自此盡“遂從之”，論侯氏儐使者遂從入朝之事。雲“侯氏先升，賓禮統焉”者，行賓禮是賓客之禮，是以賓在館為主人，主人先升，使者為賓，賓後升，故云禮統焉，謂賓統有此堂也。雲“幾者，安賓，所以崇優厚”者，按《大宰》雲“贊玉幾”，注云：“立而設幾，優尊也。”此使者亦不坐而設幾，故云所以優厚也。《聘禮》卿勞受儐不設幾者，諸侯之卿卑，故不與此同也。雲“上介出止使者，則己布席”者，經不雲上介出止使者，鄭雲上介出止使者，案至館皆不敢當，皆使上介出請事。又見此經雲“使者乃入”，始雲“侯氏與之讓升”，是侯氏不出，故知使上介止使者也。雲“則己布席”者，以其素不雲布席，而云設幾，幾不可設於地，明有席，席之所設，唯在此時。案《聘禮》受聘雲“几筵既設”，是几筵相將，故云上介出止使者，則己布席也。" }
      - { type: j, text: "侯氏用束帛、乘馬儐使者，使者再拜受。侯氏再拜送幣。儐使者，所以致尊敬也。拜者各於其階。" }
      - { type: z, text: "“侯氏”至“送幣”。○注“儐使”至“其階”。○釋曰：雲“儐使者，所以致尊敬也”者，案《聘禮》使卿用束帛勞賓，賓不還束帛，賓儐卿以束錦。此使者以玉勞侯氏，侯氏還玉，仍亦儐使者，是致尊敬天子之使故也。知“拜各於其階”者，此賓與使行敵禮，若《鄉飲酒》、《鄉射》賓主拜各於其階也。" }
      - { type: j, text: "使者降，以左驂出。侯氏送於門外，再拜。侯氏遂從之。騑馬曰驂。左驂，設在西者。其餘三馬，侯氏之士遂以出授使者之從者於外。從之者，遂隨使者以至朝。" }
      - { type: z, text: "“使者”至“從之”。○注“騑馬”至“至朝”。○釋曰：知“左驂，設在西”者，陳四馬與人，以西為上，案《聘禮》禮賓時，賓執左馬以出，此亦以左驂出，故知左驂設在西也。又知“其餘三馬，侯氏之士遂以出授使者之從者於外”者，亦案《聘禮》禮賓執左馬以出，記雲：“主人之庭實，則主人遂以出，賓之士訝受之。”此侯氏在館如主人，明三馬亦侯氏之士以出授使者從者可知。雲“從之者遂隨使者以至朝”者，亦如《聘禮》雲下大夫勞賓使者，“遂以賓入，至於朝”，其義同，故知義然也。" }
      - { type: j, text: "天子賜舍。以其新至，道路勞苦，未受其禮，且使即安也。賜舍猶致館也，所使者司空與？小行人為承擯。今文賜皆作錫。" }
      - { type: z, text: "“天子賜舍”。○注“以其”至“作錫”。○釋曰：自此盡“乘馬”，論賜侯氏舍館，侯氏儐使之事。雲“賜舍，猶致館”者，猶《聘禮》賓至於朝，君使卿致館，此不言致館，言賜舍者，天子尊極，故言賜舍也。雲“所使者司空與”者，《聘禮》使卿致館，此亦宜使卿。知是司空，非卿者，《周禮》以天、地、春、夏、秋、冬六卿，無致館之事。司空主營城郭宮室，館亦宮室之事，故知所使者，司空也。但司空亡，無正文，故云“與”以疑之。知“小行人為承儐”者，案《聘禮》致館，賓主人各擯介，故知此亦陳擯介。必知使小行人為承擯者，案《小行人》雲：“及郊勞，視館，將幣，為承而擯。”是其義也。" }
      - { type: j, text: "曰：“伯父，女順命於王所，賜伯父舍。”此使者致館辭。" }
      - { type: z, text: "“曰伯”至“父舍”。○注“此使者致館辭”。○釋曰：此及下經皆雲“伯父”者，案下文謂同姓大國，舉同姓大國，則同姓小國及異姓之國禮不殊也。" }
      - { type: j, text: "侯氏再拜稽首，受館。儐之束帛、乘馬。王使人以命致館，無禮，猶儐之者，尊王使也。侯氏受館於外，既則儐使者於內。" }
      - { type: z, text: "“儐之束帛乘馬”。○注“王使”至“於內”。○釋曰：雲“王使人以命致館，無禮，猶儐之者，尊王使也”者，決《聘禮》卿無禮致館，賓無束帛儐卿，此王使亦無禮致館，其賓猶儐使者，用束帛、乘馬，故云尊王使也。雲“侯氏受館於外”者，案《聘禮》“大夫帥至館，卿致館”，而云賓迎再拜，卿退，賓送再拜，則《聘禮》致館不在外。此不見大夫帥至館，即雲天子賜舍，是侯氏受舍於外可知，與《聘禮》異也。知“既則儐使者於內”者，以其既受館，則為己所有，明儐使者在內可知也。" }
      - { type: j, text: "天子使大夫戒，曰：“某日，伯父帥乃初事。”大夫者，卿為訝者也。《掌訝職》曰：“凡訝者，賓客至而往，詔相其事。”戒猶告也。其為告，使順循其事也。初猶故也。古文帥作率。" }
      - { type: z, text: "“天子”至“初事”。○注“大夫”至“作率”。○釋曰：自此盡“再拜稽首”，論天子使大夫戒侯氏期日使行覲禮之事。知大夫是卿為訝者，以其《周禮·秋官·掌訝職》雲“諸侯有卿訝”，故知大夫即卿為訝者。雲“其為告，使順循其事也。初猶故”者，以其四時朝覲，自是尋常，故使恆循故事之常也。" }
      - { type: j, text: "侯氏再拜稽首。受覲日也。" }
      - { type: j, text: "諸侯前朝，皆受舍於朝。同姓西面北上，異姓東面北上。言諸侯者，明來朝者眾矣。顧其入覲，不得並耳。受舍於朝，受次於文王廟門之外。《聘禮記》曰：“宗人授次，次以帷，少退於君之次。”則是次也。言舍者，尊舍也，天子使掌次為之。諸侯上介先朝受焉此覲也，言朝者，覲、遇之禮雖簡，其來之心，猶若朝也。分別同姓異姓受之，將有先後也。《春秋傳》曰：“寡人若朝於薛，不敢與諸任齒。”則周禮先同姓。" }
      - { type: z, text: "“諸侯”至“北上”。○注“言諸”至“同姓”。○釋曰：此一經論前朝一日，諸侯各遣上介受次於朝之事。雲“言諸侯者，明來朝者眾矣”者，上注云“言侯氏者，明國殊舍異，禮不凡之”；於此言諸侯凡之者，以其諸國同時遣上介，故言來朝者眾矣。若其行禮，自有前後，故鄭雲“顧其入覲不得並耳”。雲“受舍於朝，受次於文王廟門之外”者，以其春夏受贄於朝，無迎法，受享於廟，有迎禮。秋冬受贄、受享皆在廟，並無迎法。是以大門外無位，既受覲於廟，故在大門外受次。知在文王廟門外者，案《聘禮》雲：“不腆先君之祧，既拚以俟。”則諸侯待朝聘之賓，皆在大祖之廟。以其諸侯者無二祧，遷主所藏，皆在始祖之廟，故以始祖為祧。案天子待覲、遇亦當在祧，《祭法》雲天子七廟有二祧，又案《周禮·守祧職》雲：“掌守先王先公之廟祧。”鄭注：“遷主所藏曰祧。”穆之遷主藏於文王廟，昭之遷主藏於武王廟。今不在武王廟而在文王廟者，父尊而子卑，故知在文王廟也。若然，先公木主藏於后稷廟，受覲、遇不在後稷廟者，后稷生非王，故不宜在焉。雲“言舍者，尊舍也”者，此賓以帷為次，非屋舍，尊天子之次，故以屋舍言之，是尊舍也。若天子春夏受享，諸侯相朝聘迎賓客者，皆有外次，即《聘禮記》“宗人授次”是也。有外次於大門外者，則無廟門外之內次。天子覲、遇在廟者，有廟門外之內次，無大門外之外次，此文是也。雲“天子使掌次為之”者，案《周禮·掌次》雲“掌王次舍之法，以待張事”，故知使掌次為之。諸侯兼官，無掌次，使館人為之，故《聘禮》雲：“館人布幕於寢門外。”鄭注云“館人掌次舍帷幕者”是也。雲“諸侯上介先朝受焉”者，知使上介者，案下文諸侯覲於天子，為官方三百步，上介皆奉其君之旂置於宮，明知此亦使上介也。雲“其來之心，猶若朝也”者，案《周禮·大宗伯》雲春曰朝，秋曰覲，鄭注云：“朝之言朝也，欲其來之早。覲之言勤，欲其勤王事。”各舉一邊而言，其實早來、勤王通有也。故鄭雲“其來之心猶若朝，故變覲言朝也”。雲“分別同姓異姓受之，將有先後”者，案此經同姓西面，異姓東面，案下《曲禮》雲：“天子當依而立，諸侯北面而見天子曰覲。”彼此皆是覲禮，彼諸侯皆北面，不辨同姓異姓，與此不同者，此謂廟門外為位時，彼謂入見天子時，故鄭注云覲者位於廟門外而序人，入謂北面見天子時。引《春秋》者，案隱十一年《經》書：“滕侯、薛侯來朝。”《左傳》曰“爭長。薛侯曰：我先封。滕侯曰：我周之卜正也，薛，庶姓也，我不可以後之。公使羽父請於薛侯曰：君與滕君辱在寡人，周諺有之曰：山有木，工則度之；賓有禮，主則擇之。周之宗盟，異姓為後，寡人若朝於薛，不敢與諸任齒。君若辱貺寡人，則原以滕君為請。薛侯許之，乃長滕侯”也。若然，彼服注云：“爭長，先登授玉。”此位在門外，引之者，以其在先即先登，外內同，故引以為證。" }
      - { type: j, text: "侯氏裨冕，釋幣於禰。將覲，質明時也。裨冕者，衣裨衣而冠冕也。裨之為言埤也。天子六服，大裘為上，其餘為裨，以事尊卑服之，而諸侯亦服焉。上公袞無升龍，侯伯鷩，子男毳，孤絺，卿大夫玄。此差，司服所掌也。禰，謂行主遷主矣而云禰，親之也。釋幣者，告將覲也。其釋幣，如聘大夫將受命釋幣於禰之禮。既則祝藏其幣，歸乃埋之於祧西階之東。今文冕皆作絻。" }
      - { type: z, text: "“侯氏”至“於禰”。○注“將覲”至“為絻”。○釋曰：此經明諸侯之在館內，將覲於王，先釋幣告於行主之禮。知“將覲質明時”者，案《聘禮》賓厥明釋幣於禰，故知此亦質明時也。雲“裨之言埤”者，讀從《詩》“政事一埤益我”，取裨陪之義。雲“天子六服，大裘為上，其餘為埤”者，天子吉服有九，而言六服者，據六冕而言，以大裘為上，無埤義，袞冕以下，皆為裨，故云其餘為裨。雲“以事尊卑服之”者，即《司服》所云王“祀昊天上帝，則大裘而冕，祀五帝亦如之，祀先王則袞冕”以下，至“群小祀則玄冕”，舉天子而言，故云以事尊卑服之。雲“而諸侯亦服焉”者，亦據《司服》而言，諸侯唯不得有大裘，上公則袞冕以下，故鄭雲“此差司服所掌也”。雲“上公袞無升龍”者，案《白虎通》引《禮記》曰，天子乘龍，載大旂，象日月升龍。傳曰：天子升龍，諸侯降龍。以此言之，上得兼下，下不得僣上，則天子升降俱有，諸侯直有降龍而已。若然，彼升龍文承大旗之下，知不施於旌旗而據衣服者，案《司常》雲“交龍為旂”，又云“諸侯建旂”，注云：“諸侯畫交龍，一象其升朝，一象其下復。”則旌旗升降俱有。而《白虎通》雲“諸侯降龍”者，據衣服而言。案《玉藻》諸侯玄冕以祭，不得服袞冕以下，是以鄭注《司服》雲“諸侯自於其家則降”。若然，諸侯自家祭降，魯與二王之後，皆不得用袞冕、鷩冕、毳冕，則此及孤卿大夫絺冕、玄冕者，是入君廟及入天子之廟，故服也。今雲諸侯告禰用裨冕者，將入天子之廟，故服以告禰，謂若《曾子問》雲“諸侯裨冕以朝”，鄭注云為“將廟受”，亦斯之類也。雲“禰，謂行主遷主矣”者，案《禮記·曾子問》雲：“師行必以遷廟主行乎？孔子曰，天子巡守，以遷廟主行，載於齊車，言必有尊也。”彼雖據天子，其諸侯行亦然，以其皆有遷廟木主。若然，大夫無木主，《聘禮》賓釋幣於禰者，大夫雖無木主，以幣帛主其神，亦為行主也。而云“禰，親之”者，以其在外，唯有遷主可事，故不言遷主，而云禰也。雲“其釋幣，如聘大夫將受命釋幣於禰之禮”者，案《聘禮》將行，釋幣於禰，此禰無文，故約與之同。乃受命，即出行，故云將受命釋幣於禰，皆是告將行，無祭祀。知“既則祝藏其幣歸乃埋之於祧西階之東”者，此無正文，案《聘禮》祝告，祝“又入取幣，降，卷幣，實於笲，埋於西階東”，此亦與彼同。雲祧者，諸侯遷主藏於始祖之廟，諸侯既以始祖之廟為祧，遷主歸還入祧廟，故知此幣埋於祧西階之東也。" }
      - { type: j, text: "乘墨車，載龍旂、弧韣，乃朝以瑞玉，有繅。墨車，大夫制也。乘之者，入天子之國，車服不可盡同也。交龍為旂，諸侯之所建。弧，所以張縿之弓也，弓衣曰韣。瑞玉，謂公桓圭、侯信圭、伯躬圭、子穀璧、男蒲璧。繅，所以藉玉，以韋衣木，廣袤各如其玉之大小，以朱白蒼為六色。今文玉為圭，繅或為璪。" }
      - { type: z, text: "“乘墨”至“有繅”。○注“墨車”至“為璪”。○釋曰：自此盡“乃出”，論諸侯發館至天子廟門之外，以次行覲禮之事。雲“墨車，大夫制也”者，案《周禮·巾車職》雲：“孤墨夏篆，卿乘夏縵，大夫乘墨車，士乘棧車，庶人乘役車。”故知乘車大夫制也。必言墨車大夫制者，對玉路、金路、象路之等，天子諸侯之制也。雲“乘之者，入天子之國，車服不可盡同”者，《巾車》雲同姓金路，異姓象路，四衛革路。並得與天子同，據在本國所乘，下記雲“偏駕不入王門”，偏駕金路、象路等是也。既不入王門，舍於客館，乘此墨車以朝也。雲“交龍為旂諸侯之所建”者，《司常職》文也。雲“弧，所以張縿之弓也”者，《爾雅》說旌旗正幅為縿，故以此弧弓張縿之兩幅，故云張縿之弓也。雲“弓衣曰韣”者，案《月令》雲：“后妃帥九嬪御，乃禮天子所御，帶以弓韣，授以弓矢，於高禖之前。”言帶以弓韣，韣是弓衣可知。雲“瑞玉，謂公桓圭”之等，皆《大宗伯》、《典瑞職》文。雲“繅，所以藉玉”，至為六色，其義疏已見於《聘禮》記。" }
      - { type: j, text: "天子設斧依於戶牖之閒，左右幾。依，如今綈素屏風也。有繡斧文，所以示威也。斧謂之黼。幾，玉幾也。左右者，優至尊也。其席莞席紛純，加繅席畫純，加次席黼純。" }
      - { type: z, text: "“天子”至“右幾”。○注“依如”至“黼純”。○釋曰：雲“依，如今綈素屏風也”者，案《爾雅》“牖戶之閒謂之扆”，以屏風為斧文，置於依地。孔安國《顧命傳》雲“扆，屏風，畫為斧文，置戶牖閒”是也。言綈素者，綈，赤也，素，白也。漢時屏風以綈素為之，象古者白黑斧文，故鄭以漢法為況。雲“有繡斧文，所以示威也”者，案《周禮·繢人》雲：“青與赤謂之文，赤與白謂之章，白與黑謂之黼，黑與青謂之黻，五采備謂之繡。”此白黑斧以比方繡次為之，故云有繡斧文，所以示威也。雲“斧謂之黼”者，據繡次言之，白與黑謂之黼，即為此黼字也。據文體形質言之，刃白而銎黑，則為此斧字，故二字不同也。雲“幾，玉幾也”者，案《周禮·司几筵》雲“左右玉幾”，故知此幾是玉幾也。注：“左右有幾，優至尊也。”亦與此同。又案《大宰》雲“贊玉幾”，鄭注云：“玉幾，王所依也。立而設幾，優尊者。”但幾唯須其一，又幾坐時所以馮依，今左右及立而設之，皆是優至尊也。兩注相兼乃具。雲“其席莞席”以下，亦《司几筵》文。案彼雲“大朝覲，大饗射。凡封國命諸侯，王位設黼依，依前南鄉設莞席紛純”等，鄭注云紛純者，“紛如綬，有文而狹。繅席者，削蒲弱展之，編以五采，若今合歡矣。畫純者，謂畫雲氣。次席者，桃枝蓆有次列成文”，此次席即《顧命》所謂“篾席”也。篾謂竹青，據竹而言。次謂次列，據文體而說。是以《顧命》雲：“牖閒南向，敷重篾席。”孔傳雲：“桃枝竹。”義與鄭同。" }
      - { type: j, text: "天子袞冕，負斧依。袞衣者，裨之上也。繢之，繡之為九章。其龍，天子有升龍，有降龍。衣此衣而冠冕，南鄉而立，以俟諸侯見。" }
      - { type: z, text: "“天子袞冕負斧依”。○注“袞衣”至“侯見”。○釋曰：雲“負斧依”者，負謂背之南面也。雲“袞衣者，裨之上也”者，但裨衣者，自袞冕至玄冕，五者皆裨衣，故云裨之上也。上文雲裨衣者，總五等諸侯，指其衣有三等，不得定其衣號，故言總裨衣。此據天子一身，故指其衣體言袞冕。雲“繢之，繡之為九章”者，衣繢而裳繡，衣在上為陽，陽主輕浮，故對方為繢次。裳在下為陰，陰主沈深，故刺之為繡次。是以《尚書》衣言作繢，裳言紩繡，為九章首，鄭注《司服》雲：冕服九章，登龍於山，登火於宗，彝尊其神明也。九章：初一曰龍，次二曰山，次三曰華蟲，次四曰火，次五曰宗彝，皆畫以為繢；次六曰藻，次七曰粉米，次八曰黼，次九曰黻，皆絺以為繡。則袞之衣五章，裳四章，凡九也。雲“南鄉而立”者，此文及《司几筵》雖不雲立，案下《曲禮》雲“天子當寧而立”，又云“當扆而立”，在朝、在廟皆雲立，故知此南面而立，以俟諸侯之見也。" }
      - { type: j, text: "嗇夫承命，告於天子。嗇夫，蓋司空之屬也。為末擯，承命於侯氏。下介傳而上，上擯以告於天子。天子見公，擯者五人；見侯伯，擯者四人；見子男，擯者三人。皆宗伯為上擯。《春秋傳》曰：“嗇夫馳。”" }
      - { type: z, text: "“嗇夫”至“天子”。○注“嗇夫”至“夫馳”。○釋曰：雲“嗇夫，蓋司空之屬也”者，無正文，知司空屬者，案五官之內，無嗇夫之名，故知是司空之屬。但《司空職》亡，故言“蓋”以疑之。雲“末擯，承命於侯氏。下介傳而上，上擯以告於天子”者，案《周禮·司儀職》兩諸侯相朝，皆為交擯。則此諸侯見天子，交擯可知。此所陳擯介，當在廟之外，門東陳擯，從北鄉南；門西陳介，從南鄉北，各自為上下，此經先雲“嗇夫承命，告於天子”，則命先從侯氏出。下文天子得命，呼之而入命，又從天子下至侯氏即令入，故下注雲：“君乃許入。”若然，此覲遇之禮略，唯有此一辭而已，無三辭之事。《司儀》雲“交擯三辭”者，據諸侯自相見於大門外法，其天子春夏受享於廟，見於大門外，亦可交擯三辭矣。雲“天子見公，擯者五人”以下，並《大行人》文。雲“皆宗伯為上擯”者，案《大宗伯職》雲“朝覲會同，則為上相”，鄭注云：“相詔王禮也。出接賓曰擯，入詔禮曰相。”若四時常朝，則小行人為承擯，故《小行人職》雲：“將幣，為承而擯。”此文嗇夫為末擯，若子男三擯，此則足矣。若侯伯四擯，別增一士。若上公五擯，更別增二士。若時會殷同，則肆師為承擯。故《肆師職》雲“大朝覲佐擯”，鄭注云：“為承擯。”是其義也。引《春秋傳》者，案《左氏傳》昭十七年，“夏六月朔，日有食之”，叔孫昭子救日食，引《夏書》雲：“辰不集於房，瞽奏鼓，嗇夫馳，庶人走。”鄭引者，欲見嗇夫是卑官，得為末擯之意也。" }
      - { type: j, text: "天子曰：“非他，伯父實來，予一人嘉之。伯父其入，予一人將受之。”言非他者，親之辭。嘉之者，美之辭也。上擯又傳此而下至嗇夫，侯氏之下介受之，傳而上，上介以告其君，君乃許入。今文實作寔，嘉作賀。" }
      - { type: z, text: "“天子”至“受之”。○注“言非”至“作賀”。○釋曰：此經直雲“伯父其入”，不雲迎之，《禮記·郊特牲》雲“覲禮天子不下堂而見諸侯”，故無迎法。若然，案《夏官·齊僕》雲“掌馭金路以賓，朝、覲、宗、遇、饗食皆乘金路，其法儀各以其等為車送逆之節”者，覲遇雖無迎法，至於饗，即與春夏同，故連言之。" }
      - { type: j, text: "侯氏入門右，坐奠圭，再拜稽首。入門而右，執臣道不敢由賓客位也。卑者見尊，奠摯而不授。" }
      - { type: z, text: "“侯氏”至“稽首”。○注“入門”至“不授”。○釋曰：雲“卑者見尊，奠摯而不授”者，案《士昏禮》雲婿執雁，升奠雁，又云“若不親迎，則婦入三月然後婿見”，主人出門，婿入門，“奠摯再拜出”，鄭注云：“奠摯者，婿有子道，不敢授也。”又《士相見》凡臣見於君，奠摯再拜，與此奠圭皆是卑者不敢授而奠之。" }
      - { type: j, text: "擯者謁。謁猶告也。上擯告以天子前辭，欲親受之，如賓客也。其辭所易者，曰“伯父其升”。" }
      - { type: z, text: "“擯者謁”。○注“謁猶”至“其升”。○釋曰：雲“其辭所易者，曰伯父其升”者，此又不見謁告之辭。鄭注云“上擯告以天子前辭”者，謂擯者謁以上辭雲：“天子曰：非他，伯父實來，予一人嘉之，伯父其入，予一人將受之。”是擯者於門外傳王辭，告之使入。此擯者謁告，還用彼辭，所改易者，唯改入字為升，故云伯父其升也。以其喚使升堂，親受之也。" }
      - { type: j, text: "侯氏坐取圭，升致命。王受之玉。侯氏降，階東北面再拜稽首。擯者延之曰：“升。”升成拜，乃出。擯者請之。侯氏坐取圭，則遂左，降拜稽首送玉也。從後詔禮曰延。延，進也。" }
      - { type: z, text: "“侯氏”至“乃出”。○注“擯者”至“進也”。○釋曰：雲“侯氏坐取圭，則遂左，降”者，以經侯氏得擯者之告，坐取圭即言升致命，無出門之文，明知遂向門左，從左堂塗升自西階致命也。雲“從後詔禮曰延。延，進也”者，以其賓升堂，擯者不升，若《特牲》、《少牢》祝延屍，使升，屍升，祝從升。與此文同，皆是從後詔禮之事。" }
      - { type: j, text: "《儀禮註疏》" }
