# 尚書正義卷九（孔穎達疏）：j 為經文＋孔安國注，z 為正義疏文。
sections:
  - id: juan9
    name: 卷九
    blocks:
      - { type: j, text: "盤庚既遷，奠厥攸居，乃正厥位，定其所居，正郊廟朝社之位。○奠，田薦反。朝，直遙反。綏爰有眾，曰：“無戲怠，懋建大命。安於有眾，戒無戲怠，勉立大教。今予其敷心腹腎腸，歷告爾百姓於朕志。布心腹，言輸誠於百官以告志。○腎，時忍反。腸，徐待良反。罔罪爾眾，爾無共怒，協比讒言予一人。群臣前有此過，故禁其後。今我不罪汝，汝勿共怒我，合比兇人而妄言。○比，毗志反。讒，仕鹹反。" }
      - { type: z, text: "“盤庚”至“一人”○正義曰：盤庚既遷至殷地，定其國都處所，乃正其郊廟朝社之位。又屬民而聚之，安慰於其所有之眾，曰：“汝等自今以後，無得游戲怠惰，勉力立行教命。今我其布心腹腎腸，輸寫誠信，歷遍告汝百姓於我心志者。”欲遷之日，民臣共怒盤庚盤庚，恐其怖懼，故開解之。“今我無復罪汝眾人。我既不罪汝，汝無得如前共為忿怒，協比讒言毀惡我一人”。恕其前愆，與之更始也。○傳“定其”至“之位”○正義曰：訓“攸”為所，“定其所居”，總謂都城之內官府萬民之居處也。鄭玄雲：“徙主於民，故先定其裏宅所處，次乃正宗廟朝廷之位。”如鄭之意，“奠厥攸居”者，止謂定民之居，豈先令民居使足，待其餘剩之處，然後建王宮乎？若留地以擬王宮，即是先定王居，不得為先定民矣。孔惟言“定其所居”，知是官民之居並定之也。《禮》郊在國外，左祖右社，面朝後市，“正厥位”謂正此郊廟朝社之位也。○傳“安於”至“大教”○正義曰：鄭玄雲：“勉立我大命，使心識教令，常行之。”王肅雲：“勉立大教，建性命，致之五福。”又案下句爾然共怒予一人，是恐其不從已命，此句宜言我有教命，汝當勉力立之。鄭說如孔旨也。○傳“布心”至“告志”○正義曰：此論心所欲言，腹內之事耳。以心為五臟之主，腹為六腑之總，腸在腹內，腎在心下，舉“腎腸”以配“腹心”，《詩》曰：“公侯腹心。”宣十二年《左傳》雲：“敢布腹心。”是“腹心”足以表內，“腎腸”配言之也。" }
      - { type: j, text: "古我先王，將多於前功，言以遷徙多大前人之功美。適于山，用降我凶德，嘉績於朕邦。徙必依山之險，無城郭之勞。下去兇惡之德，立善功於我國。○降，工巷反。去，羌呂反。今我民用蕩析離居，罔有定極。水泉沉溺，故蕩析離居，無安定之極，徙以為之極。" }
      - { type: z, text: "“古我”至“定極”○正義曰：言古者我之先王，將欲多大於前人之功，是故徙都而適于山險之處，用下去我兇惡之德，立善功於我新國。但徙來已久，水泉沉溺，今我在此之民，用播蕩分析，離其居宅，無有安定之極，我今徙而使之得其中也。說其遷都之意，亦欲多大前人之功，定民極也。○傳“言以”至“功美”○正義曰：“古我先王”，謂遷都者。“前人”謂未遷者。前人久居舊邑，民不能相匡以生，則是居無功矣。盤庚言先王以此遷，徙故多大前人之功美，故我今遷，亦欲多前功矣。○傳“徙必”至“我國”○正義曰：先王至此五邦，不能盡知其地，所都皆近山，故總稱“適于山”也。《易·坎卦》彖雲：“王公設險以守其國。”徙必依山之險，欲使下民無城郭之勞。雖則近山，不可全無城郭，言其防守易耳。徙必近山，則舊處新居皆有山矣。而云“適于山”者，言其徙必依山，不適平地，不謂舊處無山，故徙就山也。水泉鹹鹵，民居墊隘，時君不為之徙，即是兇惡之德。其徙者是下去兇惡之德，立善功於我新遷之國也。言“下”者，凶德在身，下而墜去之。○傳“水泉”至“之極”○正義曰：民居積世，穿掘處多，則水泉盈溢，令人沈深而陷溺。其處不可安居，播蕩分析，離其居宅，無安定之極。“極”訓中也。《詩》雲：“立我烝民，莫匪爾極。”言民賴后稷之功，莫不得其中。今為民失中，故徙以為之中也。" }
      - { type: j, text: "爾謂朕：‘曷震動萬民以遷？’言皆不明己本心。肆上帝將復我高祖之德，亂越我家。以徙故，天將復湯德，治理於我家。○治，直吏反。朕及篤敬，恭承民命，用永地於新邑。言我當與厚敬之臣，奉承民命，用長居新邑。肆予沖人，非廢厥謀，吊由靈。衝，童。童人，謙也。吊，至。靈，善也。非廢，謂動謀於眾，至用其善。○吊音的，或如字。各非敢違卜，用宏茲賁。宏、賁皆大也。君臣用謀，不敢違卜，用大此遷都大業。○賁，扶雲反。" }
      - { type: z, text: "“爾謂”至“茲賁”○正義曰：言我徙以為民立中，汝等不明我心，乃謂我何故震動萬民以為此遷。我以此遷之故，上天將復我高祖成湯之德，治理於我家。我當與厚敬之臣，奉承民命，用是長居於此新邑。以此須遷之故，我童蒙之人，非敢廢其詢謀。謀於眾人，眾謀不同，至用其善者。言善謀者，皆欲遷都也。又決之於龜卜而得吉，我與汝群臣各非敢違卜，用是必遷，光大此遷都之大業。我徙本意如此耳。○傳“以徙”至“我家”○正義曰：民害不徙，違失湯德。以徙之故，天必祐我，將使復奉湯德，令得治理於我家。言由徙故天福之也。○傳“衝童”至“其善”○正義曰：“衝”、“童”聲相近，皆是幼小之名。自稱“童人”，言己幼小無知，故為“謙也”。“吊，至”、“靈，善”皆《釋詁》文。《禮》將有大事，必謀於眾。謀眾乃是常理，故言“非廢，謂動謀於眾”，言己不自專也。眾謀必有異見，故至極用其善者。○傳“宏賁”至“大業”○正義曰：“宏、賁皆大也”，《釋詁》文。樊光曰：“《周禮》雲‘其聲大而宏’，《詩》雲‘有賁其首’，是宏、賁皆為大之義也。”“各”者非一之辭，故為“君臣用謀，不敢違卜”。《洪範》雲：“汝則有大疑，謀及卿士，謀及卜筮。”言“非敢違卜”，是既謀及於眾，又決於蓍龜也。“用大此遷都”，“大”謂立嘉績以大之也。" }
      - { type: j, text: "“嗚呼！邦伯師長，百執事之人，尚皆隱哉！國伯，二伯及州牧也。眾長，公卿也。言當庶幾相隱括共為善政。○長，丁丈反，注同。予其懋簡相爾，念敬我眾。簡，大。相，助也。勉大助汝，念敬我眾民。○相，息亮反。朕不肩好貨，敢恭生生。鞠人謀人之保居，敘欽。肩，任也。我不任貪貨之人，敢奉用進進於善者。人之窮困能謀安其居者，則我式序而敬之。○好，呼報反。任，而林反。" }
      - { type: z, text: "“嗚呼”至“敘欽”○正義曰：言遷事已訖，故歎而敕之：“嗚呼！國之長伯，及眾官之長與百執事之人，庶幾皆相與隱括共為善政哉！我其勉力大助汝等為善，汝當思念愛敬我之眾民。我不任用好貨之人，有人果敢奉用進進於善，見窮困之人能謀此窮困之人安居者，我乃次序而敬用之。”○傳“國伯”至“善政”○正義曰：“邦伯”，邦國之伯，諸侯師長，故為東西二伯及九州之牧也。鄭玄注《禮記》雲：“殷之州長曰伯，虞夏及周皆曰牧。”此殷時而言“牧”者，此乃鄭之所約，孔意不然，故總稱“牧”也。“師”訓為眾，“眾長”，眾官之長，故為三公六卿也。其“百執事”，謂大夫以下，諸有職事之官皆是也。此部敕眾臣，故二伯已下及執事之人皆戒之也。《釋言》雲：“庶幾，尚也。”反覆相訓，故“尚”為庶幾。“庶”，幸也。“幾”，冀也。“隱”謂隱審也。幸冀相與隱審檢括，共為善政，欲其同心共為善也。“隱括”必是舊語，不知本出何書。何休《公羊序》雲：“隱括使就繩墨焉。”○傳“簡大”至“眾民”○正義曰：“簡，大”，《釋詁》文。又云：“相、助，慮也。”俱訓為“慮”，是“相”得為助也。盤庚欲使群臣同心為善，欲勉力大佐助之，使皆念敬我眾民也。○傳“肩任”至“敬之”○正義曰：《釋詁》雲：“肩，勝也。”舍人曰：“肩，強之勝也。”強能勝重，是堪任之義，故為任也。我今不委任貪貨之人。以“恭”為奉。人有向善而心不決志，故美其人能果敢奉用進進於善者，言其人好善不倦也。“鞠”訓為窮，“鞠人”謂窮困之人。“謀人之保居”，謂謀此窮人之安居，若見人之窮困，能謀安其居。愛人而樂安存之者，則我式序而敬之。《詩》雲：“式序在位。”言其用次序在官位也。鄭、王皆以“鞠”為養，言“能謀養人安其居者，我則次序而敬之”，與孔不同。" }
      - { type: j, text: "今我既羞告爾於朕志，若否，罔有弗欽。已進告汝之後，順於汝心與否，當以情告我，無敢有不敬。○告，故報反。無總於貨寶，生生自庸。無總貨寶以求位，當進進皆自用功德。式敷民德，永肩一心。”用布示民，必以德義，長任一心以事君。" }
      - { type: z, text: "“今我”至“一心”○正義曰：今我既進而告汝於我心志矣，其我所告，順合於汝心以否，當以情告我，無得有不敬者。汝等無得總於貨寶以求官位，當進進自用功德，不當用富也。用此布示於民，必以德義，長任一心以事君，不得懷二意。以遷都既定，故殷勤以戒之。" }
      - { type: j, text: "《尚書正義》" }
