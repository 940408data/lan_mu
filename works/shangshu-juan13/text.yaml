# 尚書正義卷十三（孔穎達疏）：j 為經文＋孔安國注，z 為正義疏文。
sections:
  - id: juan13
    name: 卷十三
    blocks:
      - { type: j, text: "成王既黜殷命，殺武庚，一名祿父。命微子啟代殷後，啟知紂必亡而奔周，命為宋公，為湯後。作《微子之命》。封命之書。" }
      - { type: z, text: "“成王”至“之命”○正義曰：成王既黜殷君之命，殺武庚，乃命微子啟代武庚為殷後，為書命之。史敘其事，作《微子之命》。“黜殷命”，謂絕其爵也。“殺武庚”，謂誅其身也。○傳“啟知”至“湯後”○正義曰：啟知紂必亡，告父師少師而遁於荒野，“微子作誥”是其事也。武王既克紂，微子乃歸之，非去紂即奔周也。傳言得封之由，故言其“奔周”耳。僖六年《左傳》雲，許僖公見楚子，“面縛銜璧，大夫衰絰，士輿櫬。楚子問諸逢伯，對曰：‘昔武王克殷，微子啟如是。武王親釋其縛，受其璧而祓之。焚其櫬，禮而命之，使復其所。’”《史記·宋世家》雲：“武王克殷，微子啟乃持其祭器造於軍門，肉袒面縛，左牽羊，右把茅，膝行而前以告。武王乃釋微子，復其位如故。”是言微子克殷始歸周也。馬遷之書，辭多錯謬，“面縛”縛手於後，故口銜其璧，又安得“左牽羊，右把茅”也？要言歸周之事是其實耳。《樂記》雲，武王克殷，既下車，投殷之後於宋。則傳言復其位者，以其自縛為囚，釋之使從本爵，復其卿大夫之位。及下車即封於宋，以其終為殷後，故《樂記》雲“投殷之後”，爾時未為殷之後也。微子初封於宋，不知何爵，此時因舊宋命之為公，令為湯後，使祀湯耳，不繼紂也。" }
      - { type: j, text: "微子之命稱其本爵以名篇。" }
      - { type: z, text: "“微子之命”○正義曰：令寫命書之辭以為此篇，《君陳》、《君牙》、《冏命》皆此類也。" }
      - { type: j, text: "王若曰：“猷！殷王元子，微子，帝乙元子，故順道本而稱之。惟稽古，崇德象賢。惟考古典，有尊德象賢之義。言今法之。統承先王，修其禮物，言二王之後，各修其典禮，正朔服色，與時王並通三統。○正音政。作賓於王家，與國鹹休，永世無窮。為時王賓客，與時皆美，長世無竟。嗚呼！乃祖成湯，克齊聖廣淵，言汝祖成湯能齊德聖達廣大深遠，澤流後世。皇天眷佑，誕受厥命。大天眷顧湯，佑助之，大受其命。謂天命。撫民以寬，除其邪虐，撫民以寬政，放桀邪虐。湯之德。功加於時，德垂後裔。言湯立功加於當時，德澤垂及後世。裔，末也。爾惟踐修厥猷，舊有令聞，汝微子，言能踐湯德，久有善譽，昭聞遠近。○令聞，如字，又音問。恪慎克孝，肅恭神人。予嘉乃德，曰篤不忘。言微子敬慎能孝，嚴恭神人，故我善汝德，謂厚不可忘。○篤，本又作竺，東谷反。" }
      - { type: z, text: "“王若曰猷殷王元子”○正義曰：王順道而言曰：“今以大道告汝殷王首子。”告之以下辭也。“曰猷”，如《大誥》，言以道誥之。○傳“微子”至“稱之”○正義曰：《呂氏春秋·仲冬紀》雲：“紂之母生微子啟與仲衍，尚為妾，已而為妻後生紂。紂父欲立啟為太子，太史據法而爭之曰：‘有妻之子，又不可立妾之子。’故紂為後。”鄭雲：“微子啟，紂同母庶兄也。若，順也。猷，道也。以其本是元子，故順道本而稱之。”《釋詁》雲：“元、首，始也。”《易》曰：“元者，善之長也。”○傳“言二”至“三統”○正義曰：《郊特牲》雲：“天子存二代之後，猶尊賢也。尊賢不過二代。”《書傳》雲：“王者存二王之後，與己為三，所以通三統，立三正。周人以日至為正，殷人以日至後三十日為正，夏人以日至後六十日為正。天有三統，土有三王，三王者，所以統天下也。”《禮運》雲：“杞之郊也，禹也。宋之郊也，契也。”是二王后為郊祭天，以其祖配之。鄭雲：“所存二王后者，命使郊天，以天子禮祭其始祖受命之王，自行其正朔服色，此謂通天三統，是立二王后之義也。”此命首言“稽古”，則立先代之後，自古而有此法，不知從何代然也。孔意自夏以上不必改正，縱使正朔不改，典禮服色自當異也。○“曰篤不忘”○正義曰：僖十二年《左傳》王命管仲之辭曰“謂督不忘”，則“曰”亦謂義。孔訓“篤”為厚，故傳雲“謂厚不可忘”。杜預以“督”為正，可謂正而不可忘也。" }
      - { type: j, text: "上帝時歆，下民祗協，庸建爾於上公，尹茲東夏。孝恭之人，祭祀則神歆享，施令則人敬和，用是封立汝於上公之位，正此東方華夏之國。宋在京師東。○歆，許今反。欽哉！往敷乃訓，慎乃服命，率由典常，以蕃王室。敬哉，敬其為君之德。往臨人布汝教訓，慎汝祖服命數，循用舊典，無失其常，以蕃屏周室。戒之。" }
      - { type: z, text: "“慎乃服命”○正義曰：傳言“慎汝祖服命數”，謂祭湯廟得用天子之禮，服其殷之本服，命則上公九命，當慎之，無使乖禮制也。" }
      - { type: j, text: "弘乃烈祖，律乃有民，永綏厥位，毗予一人。大汝烈祖成湯之道，以法度齊汝所有之人，則長安其位，以輔我一人。言上下同榮慶。○毗，房脂反。世世享德，萬邦作式，言微子累世享德，不忝厥祖，雖同公侯，而特為萬國法式。俾我有周無斁。汝世世享德，則使我有周好汝無厭。○俾，必爾反。斁音亦。好，呼報反。厭，於豔反。嗚呼！往哉惟休，無替朕命。”歎其德，遣往之國。言當惟為美政，無廢我命。" }
      - { type: j, text: "唐叔得禾，異畝同穎，唐叔，成王母弟。食邑內得異禾也。畝，壟。穎，穗也。禾各生一壟而合為一穗。○穎，役領反。穗，似醉反，本亦作遂。獻諸天子。拔而貢之。王命唐叔歸周公於東，異畝同穎，天下和同之象，周公之德所致。周公東征未還，故命唐叔以禾歸周公。唐叔後封晉。作《歸禾》。亡。" }
      - { type: z, text: "“唐叔”至“歸禾”○正義曰：成王母弟唐叔，於其食邑之內得禾，下異畝壟，上同穎穗，以其有異，拔而貢於天子，以為周公德所感致。於時周公東征未反，王命唐叔歸周公於東，命有言辭。史敘其事，作《歸禾》之篇。○傳“唐叔”至“一德”○正義曰：昭十五年《左傳》雲：“叔父唐叔，成王之母弟。”指言“唐叔得禾”，知其“所食邑內得異禾”也。唐叔食邑，書傳無文。《詩》述后稷種禾，於“實秀”之下乃言“實穎”，《毛傳》雲“穎垂”，言穗重而垂，是“穎”為穗也。“禾各生一壟而合為一穗”，言其異也。《書傳》雲：“成王之時，有三苗貫桑葉而生，同為一穗，其大盈車，長几充箱，民得而上諸成王。”下傳雲“拔而貢之”，若是盈車之穗，不可手拔而貢，孔不用《書傳》為說也。○傳“異畝”至“封晉”○正義曰：禾者，和也，異畝同穎，是天下和同之象，成王以為周公德所感致。於時周公東征未還，故命唐叔以禾歸周公於東也。歸禾年月，史傳無文，不知在啟金縢之先後也。王啟金縢，正當禾熟之月。若是前年得之，於時王疑未解，必不肯歸周公。當是啟金縢之後，喜得東土和平而有此應，故以歸周公也。唐叔後封於晉，經史多矣，傳言此者，欲見此時未封，知在邑內得之。昭元年《左傳》稱“成王滅唐，而封太叔焉”，所滅之唐即晉國是也。然則得禾之時，未封於唐，從後稱之為“唐叔”耳。" }
      - { type: j, text: "周公既得命禾，旅天子之命，已得唐叔之禾，遂陳成王歸禾之命，而推美成王。善則稱君。作《嘉禾》。天下和同，政之善者，故周公作書以“嘉禾”名篇告天下。亡。" }
      - { type: z, text: "“周公”至“嘉禾”○正義曰：周公既得王所命禾，乃陳天子歸禾之命為文辭，稱此禾之善，推美於成王。史敘其事，作《嘉禾》之篇。○傳“已得”至“稱君”○正義曰：鄭雲“受王歸已禾之命與其禾”，以為既得命，“禾”謂復得禾，義當然矣。成王歸禾之命必歸美周公，周公陳歸禾之命又推美成王，是“善則稱君”之義也。“善則稱君”，《坊記》文也。○傳“天下”至“下亡”○正義曰：“嘉”訓善也，言此禾之善，故以善禾名篇。陳天子之命，故當佈告天下，此以善禾為書之篇名，後世同穎之禾遂名為“嘉禾”，由此也。二篇東征未還時事，微子受命應在此篇後。篇在前者，蓋先封微子，後布此書故也。" }
      - { type: j, text: "《尚書正義》" }
