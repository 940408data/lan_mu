# 孟子注疏卷4（孫奭疏）：j 為經文＋漢趙岐注，z 為疏文。
sections:
  - id: juan4
    name: 正文
    blocks:
      - { type: j, text: "（公孙丑者，公孙，姓；丑，名。孟子弟子也。丑有政事之才，问管晏之功，犹《论语》子路问政，故以题篇。）" }
      - { type: z, text: "正义曰：前篇章首论梁惠王问以利国，孟子答以仁义之事，故目梁惠王为篇题，盖谓君国当以仁义为首也。既以仁义为首，然後其政可得行之。是以此篇公孙丑有政事之才，而问管晏之功，如《论语》子路问政，遂以目为篇题，不亦宜乎，故次《梁惠王》之篇，所以揭公孙丑为此篇之题也。此篇凡二十有三章目，赵氏分之，遂为上下卷。据此上卷有九章而已：一章言德流速於置邮，君子得时，大行其道，管、晏为曾西之所羞。二章言义以行勇，则不动心，养气顺道，无效揠苗，圣人量时，贤者道偏，孟子究言情理而归学孔子。三章言王者任德，霸者兼力。四章言国必修政，君必行仁，祸福由己，不专在天，当防患於未乱。五章言修古之道，邻国之民，以为父母，命曰天吏。六章言人之行，当内求诸已，以演大四端，充扩其道，上以正君，下以荣身。七章言各治其术，术有善恶，祸福之来，随行而作，耻为人役，不若居仁，治术之忌，勿为矢人。八章言大圣之君，由取善於人。九章言伯夷、柳下惠，古之大贤，犹有所阙。其馀十四章赵氏分在下卷，各有分说。○注“公孙，姓；丑，名。孟子弟子也”至“题篇”。○正义曰：自鲁桓公之子庆父之後，有孟孙氏、叔孙氏、季孙氏同出三桓子孙；国有王孙贾出自周顷王之後，王孙贾之子自以去王室久，改为贾孙氏：故孙氏多焉，又非特止於一族也。自封公後，其子孙皆以公孙为氏。《春秋》隐公八年：“无骇卒，羽父请谥与族，公问族於众仲，众仲对曰：‘天子建德，因生以赐姓。’公命以字为展氏。”杜预曰：“诸侯之子称公子，公子之子称公孙，公孙之子以王父字为氏。”然则公孙氏皆自公子之後为氏也。今公孙丑，其氏有自来矣。案《史记·孟子列传》云：“孟子退而与万章、公孙丑之徒著述，作七篇。”则公孙丑为孟子弟子明矣，经曰“弟子之惑滋甚”是也。《论语》第十三篇“子路问政，子曰先之劳之，请益曰无倦”，集《论语》者因其问政，故以题篇。若此公孙丑有政事之才，而问管晏之功，亦以因其人而题其篇，而次之《梁惠王》也。" }
      - { type: j, text: "公孙丑问曰：“夫子当路於齐，管仲、晏子之功，可复许乎？”（夫子，谓孟子。许，犹兴也。如使夫子得当仕路於齐，而可以行道，管夷吾晏婴之功，宁可复兴乎？）孟子曰：“子诚齐人也，知管仲、晏子而已矣。（诚，实也。子实齐人也，但知二子而已，岂复知王者之佐乎？）或问乎曾西曰：‘吾子与子路孰贤？’曾西蹴然曰：‘吾先子之所畏也。’（曾西，曾子之孙。蹴然，犹蹴也。先子，曾子也。子路在四友，故曾子畏敬之，曾西不敢比。）曰：‘然则吾子与管仲孰贤？’曾西艴然不悦曰：‘尔何曾比予於管仲！（艴然，愠怒色也。何曾，犹何乃也。）管仲得君如彼其专也，行乎国政如彼其久也，功烈如彼其卑也，尔何曾比予於是！’（曾西答或人，言管仲得遇桓公，使之专国政如彼，行政於国其久如彼，功烈卑陋如彼，谓不率齐桓公行王道而行霸道，故言卑也。重言何曾比我，耻见比之甚也。）曰：管仲，曾西之所不为也，而子为我原之乎？”（孟子心狭曾西，曾西尚不欲为管仲，而子为我愿之乎？非丑之言小也。）曰：“管仲以其君霸，晏子以其君显。管仲、晏子犹不足为与？”（丑曰：管仲辅桓公以霸道，晏子相景公以显名，二子如此，尚不可以为邪。）曰：“以齐王，由反手也。”（孟子言以齐国之大而行王道，其易若反手耳，故讥管、晏不勉其君以王业也。）曰：“若是则弟子之惑滋甚。且以文王之德，百年而後崩，犹未洽於天下。武王、周公继之，然後大行。今言王若易然，则文王不足法与？”（丑曰：如是言，则弟子惑益甚也，文王尚不能及身而王，何谓若易然也？若是，则文王不足以为法邪？）曰：“文王何可当也！由汤至於武丁，贤圣之君六七作，天下归殷久矣，久则难变也。武丁朝诸侯，有天下，犹运之掌也。（武丁，高宗也。孟子言文王之时难为功，故言何可当也。从汤以下，圣贤之君六七兴，谓太甲、太戊、盘庚等也。运之掌，言其易也。）纣之去武丁未久也，其故家遗俗，流风善政，犹有存者。又有微子、微仲、王子比干、箕子、胶鬲、皆贤人也，相与辅相之，故久而後失之也。尺地莫非其有也，一民莫非其臣也，然而文王犹方百里起，是以难也。（纣得高宗馀化，又多良臣，故久乃亡也。微仲、胶鬲皆良臣也，但不在三仁中耳。文王当此时，故难也。）齐人有言曰：‘虽有智慧，不如乘势。虽有基，不如待时。’今时则易然也。（齐人谚言也。乘势，居富贵之势。基，田器，耒耜之属。待时，三农时也。今时易以行王化者也。）夏后殷周之盛，地未有过千里者也，而齐有其地矣。鸡鸣狗吠相闻，而达乎四境，而齐有其民矣。地不改辟矣，民不改聚矣，行仁政而王，莫之能御也。（三代之盛，封畿千里耳。今齐地士民以足矣，不更辟土聚民也。鸡鸣狗吠相闻，言民室屋相望而众多也。以此行仁而王，谁能止之也。）且王者之不作，未有疏於此时者也；民之憔悴於虐政，未有甚於此时者也。饥者易为食，渴者易为饮，孔子曰：‘德之流行，速於置邮而传命。’（言王政不兴久矣，民患虐政甚矣。若饥者食易为美，渴者饮易为甘。德之流行，疾於置邮传书命也。）当今之时，万乘之国行仁政，民之悦之，犹解倒悬也，故事半古之人，功必倍之，惟此时为然。”（倒悬，喻困苦也。当今所施恩惠之事，半於古人，而功倍之矣。言今行之易也。）" }
      - { type: z, text: "“公孙丑问曰”至“惟此时为然”。正义曰：此章言德流之速，过於置邮，君子得时，大行其道，是以吕望睹文王而陈王图，管、晏虽勤，犹为曾西所羞也。“公孙丑问曰：夫子当路於齐，管仲、晏子之功，可复许乎”者，公孙丑问孟子，言夫子得当仕路於齐国，则管仲、晏子佐桓、景二霸之功，宁可复兴之乎？管仲，管夷吾也。晏子，晏婴也。夷吾佐桓公者也，晏婴佐景公者也。“孟子曰：子诚齐人也，知管仲、晏子而已矣”者，孟子答公孙丑，以谓子实齐国之人也，然但能知此二子而止矣。孟子答之以此者，其意谓丑岂能复知有王者之佐乎？“或问乎曾西曰：吾子与子路孰贤？曾西蹴然曰：吾先子之所畏也”至“尔何曾比予於是”者，孟子又谓尝有或人问乎曾西，曾西，曾子之孙也，而曰吾子与子路孰贤？曾西乃蹙而言曰：我先子曾子所敬畏者也。“曰：然则吾子与管仲孰贤？曾西艴然不悦曰：尔何曾比予於管仲”者，言或人又曰，如是则吾子与管仲孰为贤？曾西乃艴然愠怒而不悦，曰：尔何如乃比我於管仲为也。“管仲得君如彼其专也，行乎国政如彼其久也，功烈如彼其卑也，尔何曾比予於是”者，曾西言管仲得齐桓立为仲父，贵戚不敢为之妒，与高国之位，大臣不敢为之恶，内外政皆尽委之断焉，言如此其专也；自立位相职至终四十馀年，执齐国之政，言其行政又如此其久也；其终也不过致君为霸者而已，而其功烈只如此之卑也，尔故何如乃比我於是之甚焉？功烈者，盖致力以为功，成业以为烈，言管仲以力致齐桓，则止於为霸功，以业成就齐桓，则亦止为霸烈，故曰功烈如彼之卑也。孟子所以引此或人与曾西之言者，意在於王佐为贵也，不以霸者之佐为贵也。故曰“管仲，曾西之所不为也，而子为我愿之乎”者，孟子言：管仲，曾西之所不愿为也，而子以为我愿比之乎？云“子”者，指孙丑而云也。“曰：管仲以其君霸，晏子以其君显，管仲、晏子犹不足为与？曰：以齐王，犹反手也”者，孟子言管仲以佐其君为霸，晏子以佐其君而显名，管仲、晏子犹若不足为耳，言我能佐齐国之大而行王道，为王其易则若反覆手掌也，故曰“以齐王，由反手也”。孟子言此，盖讥管、晏二子不能致君行王道耳。“曰：若是则弟子之惑滋甚”者，公孙丑不晓孟子意在讥管、晏二子但为霸者之佐，故於孟子曰：如此之言，则弟子之蔽惑益甚也。弟子者，盖公孙丑自称为孟子弟子也。“且以文王之德，百年而後崩，犹未洽於天下。武王、周公继之，然後大行。今言王若易然，则文王不足法与”者，公孙丑言今且以文王之德化观之，起自百里之微，加之百年之久而後崩丧，其尚不能及身而王，天下浃洽其德，及武王、周公继续之，然後德化大行，为王於天下。今言以齐王若反手之易，是则文王不足以为之法与？“曰：文王何可当也，由汤至於武丁，贤圣之君六七作，天下归殷久矣，久则难变也。武丁朝诸侯，有天下，犹运之掌也”至“是以难也”者，孟子又言文王安可当也，言自汤至於武丁，其间贤圣之君六七作，故天下德化被民也久，恩泽渐人也深，而天下之民归心於殷，固以久而难变也，是以武丁朝诸侯而有天下，若反运手掌之易也。武丁，高宗也。云六七作，若太甲、太戊、祖乙、盘庚等是也。“纣之去武丁未久也，其故家遗俗，流风善政，犹有存者”至“是以难也”者，孟子又言自殷纣去武丁之时尚未久，故其世嗣续之，故家其民习尚之遗俗，上之化下，其流风之所被，善政之所行，尚有存者。不特此也，又有微子、微仲、王子比干、箕子、胶鬲数者，皆是贤人，相与同辅相其纣，故纣之失亡亦至久而後失也。虽一尺之地，莫非纣之所有，一民莫非为纣之臣，然而如此，尚能自百里之地而兴起为王，是以难，而不若武丁之易也。“齐人有言曰：虽有智慧，不如乘势，虽有基，不如待时”者，孟子又言齐国之人有言，云人虽有智慧之才，亦不如乘其富贵之势；虽有田器，如耒耜之属，亦不如乘三时农务之际也。盖大而知之之谓智，小而察之之谓慧。基，田器之利也。言人虽有智慧之才，然非乘富贵之势，则智慧之才有所不运。比之齐国，则今时易以行王道者也。故曰今时则易然也。“夏后殷周之盛，地未有过千里者也，而齐有其地矣”至“莫之能御也”者，孟子言自夏后殷周三代之盛，治其封畿，皆方千里，未有过千里之地者也，而齐国今有其地亦得其千里，鸡鸣狗吠相闻而广达乎四境，是其齐国不特有千里之地而已，其间鸡犬相闻而又有其民相望而众多也。如此，土地亦以足矣，故不待更广辟其土地矣；民人亦以足矣，又不待聚集其民人矣：即行仁为政而王之，人莫能御止之也。“且王者不作，未有疏於此时者也。饥者易为食，渴者易为饮，孔子曰：德之流行，速於置邮而传命”者，孟子又言且王者之不兴作，未有如疏於此时者也，而民人憔悴，困苦於暴虐之政，又未有如极甚於此时者也。以若饥饿者食易为美，渴者饮易为甘矣，故孔子有云：其德化之流行，其速疾又过於置邮而传书命也。邮，驿名，云境土舍也，又云官名，督邮，主诸县罚负。《说文》曰：境上行书舍也。“当今之时，万乘之国行仁政，民之悦之，犹解倒悬也”者，孟子又言当今齐国之时，为万乘之国，行仁政而及民，则民皆喜悦之，如得解其倒悬之索也。云“倒悬”者，喻其困苦之如此也。“故事半古之人，功必倍之，惟此时为然”者，孟子又言故於当此之时，其施恩惠之事，但半於古人，其成治功，亦必倍过於古人矣。故曰惟此当今齐国之时为能如是也。○“管夷吾晏婴”。○正义曰：管仲，齐之相也。案《左传》：“鲁庄公八年，桓公杀公子纠，召忽死之，管仲不死，请因。鲍叔受之，及堂阜而税之，归而以告曰：管夷吾治於高，使相之可也。”杜注云：“堂阜，齐地，西北有夷吾亭。或曰：鲍叔解夷吾缚於此。”又云：“高，齐卿，高敬仲也。”言管仲治理政事，才多於高敬仲，遂使相之。晏婴姓晏名婴，齐大夫也。《语》云：“晏平仲善与人交。”周注云：“谥为平。”《谥法》曰：“法治而清省曰平。”案《左传》文知之，是晏桓子之子也，相齐景公。○注“曾西曾子之孙及子路”。正义曰：曾西为曾子之孙者，经云：“曾西曰：吾先子之所畏也。”先子是曾子也，以祖称之也，即知曾西乃曾子之孙也。其他经传未详。子路，孔子弟子，姓仲名由，字子路，卞国人也。案《史记·弟子传》云：“少孔子九岁，性鄙好勇力，抗直，冠雄鸡，佩豚，陵暴孔子。孔子设礼诱子路，子路後儒服委质，因门人请为弟子。”云“蹙然，犹蹙”者，《语》云：“如也。”马注云：“，恭敬之貌。”○注“艴然，愠怒色”。○正义曰：释云“艴，不悦也，字从弗色”，是知即愠怒之色也。○注“武丁高宗也”至“易也”。○正义曰：孔安国《传》云：“盘庚弟，小乙子，名武丁。德高可尊，始号为高宗。”云“从汤以下，贤圣之君六七作，谓太甲、太戊、盘庚等是也”者，案《史记·世表》云：“自汤之後，汤太子早卒，故立次弟外丙。外丙即位二年卒，立外丙弟仲壬。仲壬即位四年卒，伊尹乃立太丁子太甲。太甲，成汤长孙也。太甲立三年，不明，伊尹放之桐。三年悔过自责，反善，伊尹乃迎帝太甲，授之政。太甲修德，诸侯咸归，百姓以宁，称为太宗。太宗崩，子沃丁立。丁崩，弟太庚立。庚崩，子小甲立。甲崩，弟雍已立。殷道衰，诸侯或不至。已崩，弟太戊立，殷道复兴，诸侯归之，故称中宗。中宗崩，子仲丁立，丁迁于嚣。丁崩，弟外壬立。壬崩，弟河甲立，殷道复衰。甲崩，子帝祖乙立。乙立，殷道复兴。乙崩，子祖辛立。辛崩，弟沃甲立。甲崩，兄祖辛之子祖丁立。丁崩，弟沃甲之子南庚立。庚崩，祖丁之子阳甲立。殷道复衰。甲崩，弟盘庚立。殷道复兴，诸侯来朝。庚崩，弟小辛立。殷道复衰。辛崩，弟小乙立。乙崩，子武丁立。殷道复兴，故号为高宗。”是也。○注云“基，田器，耒耜之属”。○正义曰：《释名》云：“基，大锄也。”云“农时”者，《左传》庄公二十九年云“凡土功，龙见而毕务”，注云：“今九月，周十一月，龙星角亢，晨见东方，三务始毕。”“火见而致用”，注云：“大火心星，次角亢，见者致筑作之物。”“水昏正而栽”，注云：“谓今十月定星昏而中，於是树板而兴作。”“日至而毕”，注云：“日南至，微阳始动，故土功毕。”若其门户道桥城郭墙堑有所损衰，则随时修之，僖公二十年云“凡启塞从时”是也。又案《七月》之诗，云：“三之日于耜，四之日举趾，同我妇子，饣盍彼南亩。”注云：“三之日，夏之正月也。四之日，周之四月。民无不举足耕矣。”" }
      - { type: j, text: "公孙丑问曰：“夫子加齐之卿相，得行道焉，虽由此霸王，不异矣。如此，则动心否乎？”（加，犹居也。丑问孟子，如使夫子得居齐卿相之位，行其道德，虽用此臣位，辅君行之，亦不异於古霸王之君矣。如是，宁动心畏难、自恐不能行否耶？丑以此为大道不易，人当畏惧之，不敢欲行也。）孟子曰：“否！我四十不动心。”（孟子言：礼，四十强而仕，我志气已定，不妄动心有所畏也。）曰：“若是，则夫子过孟贲远矣。”（丑曰：若此，夫子志意坚勇过孟贲。贲，勇士也。孟子勇於德。）曰：“是不难，告子先我不动心。”（孟子言是不难也，告子之勇，未四十而不动心矣。）曰：“不动心有道乎？”（丑问：不动心之道云何。）曰：“有。（孟子欲为言之。）北宫黝之养勇也，不肤桡，不目逃，思以一豪挫於人，若挞之於市朝，不受於褐宽博，亦不受於万乘之君；视剌万乘之君，若剌褐夫，无严诸侯，恶声至，必反之。（北宫，姓。黝，名也。人剌其饥肤，不为桡却，剌其目，目不转睛逃避之矣。人拔一毛，若见捶挞於市朝之中矣。褐宽博，独夫被褐者。严，尊也。无有尊严诸侯可敬者也，以恶声加己，己必恶声报之。言所养育勇气如是也。）孟施舍之所养勇也，曰：‘视不胜，犹胜也。量敌而後进，虑胜而後会，是畏三军者也。舍岂能为必胜哉？能无惧而已矣。’（孟，姓。舍，名。施，发音也。施舍自言其名，则但曰舍。舍岂能为必胜哉？要不恐惧而已也。以为量敌少而进，虑胜者足胜乃会。若此，畏三军之众者耳，非勇者也。）孟施舍似曾子，北宫黝似子夏。夫二子之勇，未知其孰贤，然而孟施舍守约也。（孟子以为曾子长於孝。孝，百行之本。子夏知道虽众，不如曾子孝之大也。故以舍譬曾子，黝譬子夏，以施舍要之以不惧为约要也。）昔者曾子谓子襄曰：‘子好勇乎？吾尝闻大勇於夫子矣。自反而不缩，虽褐宽博，吾不惴焉；自反而缩，虽千万人，吾往矣。’孟施舍之守气，又不如曾子之守约也。”（子襄，曾子弟子也。夫子，谓孔子也。缩，义也。惴，惧也。《诗》云：“惴惴其栗。”曾子谓子襄，言孔子告我大勇之道，人加恶於己，己内自省，有不义不直之心，虽敌人被褐宽博一夫，不当轻，惊惧之也。自省有义，虽敌家千万人，我直往突之，言义之强也。施舍虽守勇气，不如曾子守义之为约也。）曰：“敢问夫子之不动心，与告子之不动心，可得闻与？”（丑曰：不动心之勇，其意岂可得闻与？）“告子曰：‘不得於言，勿求於心；不得於心，勿求於气。’不得於心，勿求於气，可。不得於言，勿求於心，不可。（不得者，不得人之善心善言也。求者，取也。告子为人，勇而无虑，不原其情，人有不善之言加於己，不复取其心有善也，直怒之矣。孟子以为不可也。告子知人之有恶心，虽以善辞气来加己，亦直怒之矣，孟子以为是则可，言人当以心为正也。告子非纯贤，其不动心之事，一可用，一不可用也。）夫志，气之帅也。气，体之充也。（志，心所念虑也。气，所以充满形体，为喜怒也。志帅气而行之，度其可否也。）夫志至焉，气次焉。（志为至要之本，气为其次焉。）故曰持其志，无暴其气。”（暴，乱也。言志所向，气随之当正。持其志，无乱其气，妄以喜怒加人也。）“既曰志至焉气次焉，又曰持其志，无暴其气者，何也？”（丑问暴乱其气云何。）曰：“志壹则动气，气壹则动志也。今夫蹶者趋者，是气也，而反动其心。”（孟子言壹者，志气闭而为壹也。志闭塞则气不行，气闭塞则志不通。蹶者相动，今夫行而蹶者，气闭不能自持，故志气颠倒。颠倒之间，无不动心而恐矣，则志气之相动也。）“敢问夫子恶乎长？”（丑问孟子才志所长何等？）曰：“我知言，我善养吾浩然之气。”（孟子云：我闻人言，能知其情所趋，我能自养育我之所有浩然之大气也。）“敢问何谓浩然之气？”（丑问浩然之气状如何？）曰：“难言也。其为气也，至大至刚，以直养而无害，则塞于天地之间。（言此至大至刚，正直之气也。然而贯洞纤微，治於神明，故言之难也。养之以义，不以邪事干害之，则可使滋蔓，塞满天地之间，布旅德教，无穷极也。）其为气也，配义与道。无是，馁也。（重说是气。言此气与道义相配偶俱行。义谓仁义，可以立德之本也。道谓阴阳，大道无形而生有形，舒之弥六合，卷之不盈握，包络天地，禀授群生者也。言能养道气而行义理，常以充满五脏。若其无此，则腹肠饥虚，若人之馁饿也。）是集义所生者，非义袭而取之也。（集，杂也。密声取敌曰袭。言此浩然之气，与义杂生，从内而出。人生受气所自有者。）行有不慊於心，则馁矣。（慊，快也。自省所行，仁义不备，干害浩气，则心腹饥馁矣。）我故曰：告子未尝知义，以其外之也。（孟子曰：仁义皆出於内，而告子尝以为仁内义外，故言其未尝知义也。）必有事焉而勿正，心勿忘，勿助长也。（言人行仁义之事，必有福在其中，而勿正，但以为福。故为义也，但心勿忘其为福，而亦勿汲汲助长其福也。汲汲则似宋人也。）无若宋人然。宋人有闵其苗之不长而揠之者，芒芒然归，谓其人曰：‘今日病矣！予助苗长矣。’其子趋而往视之，苗则槁矣。（揠，挺拔之，欲亟长也。病，罢也。芒芒然，罢倦之貌。其人，家人也。其子，揠苗者之子也。趋，走也。槁，乾枯也。以喻人之情，邀福者必有害。若欲急长苗，而反使之枯死也。）天下之不助苗长者寡矣。以为无益而舍之者，不耘苗者也；助之长者，揠苗者也，非徒无益，而又害之。”（天下人行善者，皆欲速得其福，恬然者少也。以为福禄在天，求之无益，舍置仁义，不求为善，是由农夫任天，不复耘治其苗也。其迟福欲急得之者，由此揠苗人也，非徒无益於苗，乃反害之。言告子外义，常恐其行义欲急得其福，故为丑言人之行，当内治善，不当急求其福，亦若此揠苗者矣。）“何谓知言？”（丑问知言之意何谓？）曰：“讠皮辞知其所蔽，淫辞知其所陷，邪辞知其所离，遁辞知其所穷。（孟子曰：人有险讠皮之言，引事以褒人，若宾孟言雄鸡自断其尾之事，能知其欲以誉子朝蔽子猛也。有淫美不信之辞，若骊姬劝晋献公与申生之事，能知欲以陷害之也。有邪辟不正之辞，若竖牛观仲壬赐环之事，能知其欲行谮毁，以离之於叔孙也。有隐遁之辞，若秦客之辞於朝，能知其欲以穷晋诸大夫也。若此四者之类，我闻能知其所趋也。）生於其心，害於其政；发於其政，害於其事。圣人复起，必从吾言矣。（生於其心，譬若人君有好残贼严酷心，必妨害仁政不得行之也。发於其政者，若出令欲以非时田猎、筑作宫室，必妨害民之农事，使百姓有饥寒之患也。吾见其端，欲防而止之。如使圣人复兴，必从我言也。）宰我、子贡善为说辞，冉牛、闵子、颜渊善言德行，孔子兼之，曰：‘我於辞命，则不能也。’”（言人各有能，我於辞言教命，则不能如二子。）“然则夫子既圣矣乎？”（丑见孟子但言不能辞命，不言不能德行，谓孟子欲自比孔子，故曰夫子既已圣矣乎？）曰：“恶，是何言也！昔者子贡问於孔子曰：‘夫子圣矣乎！’孔子曰：‘圣则吾不能，我学不厌而教不倦也。’子贡曰：‘学不厌，智也。教不倦，仁也。仁且智，夫子既圣矣。’夫圣，孔子不居，是何言也！（恶者，不安事之叹辞也。孟子答丑，言往者子贡、孔子相答如此，孔子尚不敢安居於圣，我何敢自谓为圣，故再言“是何言也”。）昔者窃闻之：子夏、子游、子张，皆有圣人之一体，冉牛、闵子、颜渊则具体而微。”（体者，四肢股肱也。孟子言昔日窃闻师言也，丑方问欲知孟子之德，故谦辞言窃闻也。一体者，得一肢也。具体者，四肢皆具。微，小也，比圣人之体微小耳。体以喻德也。）“敢问所安？”（丑问孟子所安比也。）曰：“姑舍是。”（姑，且也。孟子曰：且置是，我不原比也。）曰：“伯夷何如？”（丑曰伯夷之行何如，孟子心可愿比伯夷否？）曰：“不同道。（言伯夷之行，不与孔子、伊尹同道也。）非其君不事，非其民不使，治则进，乱则退，伯夷也。（非其君，非己所好之君也。非其民，不以正道而得民，伯夷不愿使之，故谓之非其民也。）何事非君，何使非民，治亦进，乱亦进，伊尹也。（伊尹曰：事非其君者，何伤也？使非其民者，何伤也？要欲为天理物，冀得行道而已矣。）可以仕则仕，可以止则止，可以久则久，可以速则速，孔子也。（止，处也。久，留也。速，疾去也。）皆古圣人也，吾未能有行焉。乃所原，则学孔子也。（此皆古之圣人，我未能有所行。若此乃言我心之所庶几，则原欲学孔子，所履进退无常，量时为宜也。）“伯夷、伊尹於孔子，若是班乎？”（班，齐等之貌也。丑嫌伯夷、伊尹与孔子相比，问此三人之德班然而等乎？）曰：“否！自有生民以来，未有孔子也。”（孟子曰：不等也。从有生民以来，非纯圣人，则未有与孔子齐德也。）“然则有同与？”（丑曰：然则此三人有同者邪？）曰：“有，得百里之地而君之，皆能以朝诸侯、有天下；行一不义、杀一不辜而得天下，皆不为也：是则同。”（孟子曰：此三人君国，皆能使邻国诸侯尊敬其德而朝之，不以其义得之，皆不为也，是则孔子同之矣。）曰：敢问其所以异？”（丑问孔子与二人异谓何？）曰：“宰我、子贡、有若，智足以知圣人，不至阿其所好。（孟子曰：宰我等三人之智，足以识圣人。污，下也。言三人虽小污不平，亦不至阿其所好以非其事，阿私所爱而空誉之，其言有可用者。欲为丑陈三子之道孔子也。）宰我曰：‘以予观於夫子，贤於尧舜远矣。’（予，宰我名也。以为孔子贤於尧舜，以孔子但为圣、不王天下，而能制作素王之道，故美之。如使当尧舜之世，贤之远矣。）子贡曰：‘见其礼而知其政，闻其乐而知其德，由百世之後，等百世之王，莫之能违也。自生民以来，未有夫子也。’（见其制作之礼，知其政之可以致太平也。听闻其《雅》、《颂》之乐，而知其德之可与文、武同也。《春秋外传》曰“五声昭德”，言五音之乐声可以明德也。从孔子後百世，上推等其德於前百世之圣王，无能违离孔子道者。自从生民以来，未有能备若孔子也。）有若曰：‘岂惟民哉！麒麟之於走兽，凤凰之於飞鸟，泰山之於丘垤，河海之於行潦，类也。圣人之於民，亦类也。出於其类，拔乎其萃，自生民以来，未有盛於孔子也。’”（垤，蚁封也。行潦，道傍流潦也。萃，聚也。有若以为万类之中，各有殊异。至於人类卓绝，未有盛美过於孔子者也。若三子之言孔子，所以以异於伯夷、伊尹也。夫圣之道，同符合契，前圣後圣，其揆一也，不得相逾。云生民以来无有者，此三人皆孔子弟子，缘孔子圣德高美，而盛称之也。孟子知其言大过，故贬谓之污下，但不以无为有耳。因事则褒，辞在其中矣，亦以明师徒之义得相褒扬也。）" }
      - { type: z, text: "“公孙丑问曰：夫子加齐之卿相”至“未有盛於孔子也”。○正义曰：此章指言义以行勇，则不动心，养气顺道，无效宋人，圣人量时，贤者道偏。是了孟子究言情理归学於孔子也。“公孙丑问曰：夫子加齐之卿相，得行道焉，虽由此霸王，不异矣。如此，则动心否乎”者，是公孙丑问孟子，言以夫子之才，加之以齐国卿相之位，以得行其道，虽曰用此卿相之位而辅相其君而行之，亦不异於古之霸王矣。如此则夫子宁动心畏惧其不能行乎否？不动心畏惧其不能行乎？“孟子曰：否，我四十不动心”者，孟子答公孙丑，以谓我年至四十之时，内有所定，故未尝动心、有所畏惧也。“曰：若是则夫子过孟贲远矣”者，公孙丑见孟子以谓四十之时已不动心，言如此，则夫子是有勇过於孟贲之勇士也。“曰：是不难，告子先我不动心”者，孟子言我之有勇，过於孟贲，此不难也。孟子之意，盖谓已之勇勇於德，孟贲之勇但勇於力，必能过之也，所以谓不难也，以言其易过之也。言告子之勇已先我於未四十之时而不动心矣。“曰：不动心有道乎”者，丑问孟子，谓不动心宁有道乎？“曰有”，孟子欲为公孙丑言其不动心之道，故答之曰有也。“北宫黝之养勇也，不肤挠，不目逃”至“孟施舍之养勇也，曰：视不胜，犹胜也”，以至又“不如曾子之守约也”者，此皆孟子答公孙丑而言养勇者也。北宫黝：北宫，姓；黝，名。孟施舍：孟，姓；名舍；施，发言之音也。曾子姓曾，名参，字子舆。子夏姓卜，名商，字子夏。并为孔门之徒弟也。言北宫黝之养勇，人刺其肌肤，不为挠却；人剌其目，不以目转睛而逃避；思以一毫之毛而拔於人，若见捶挞於朝之中矣；不受物於被褐者之独夫，亦不受赐於万乘之君；视剌万乘之君，但若剌被褐者之独夫；无严畏诸侯，有恶声加己，己亦以恶声反报之：此北宫黝养勇之如是也。孟施舍之养勇，尝谓视敌之不胜犹胜之也，若以量度其敌可以敌，然後进而敌之；谋虑其必能胜敌，然後方会其兵：此是畏三军之士也，非勇者也，故自称名曰舍，岂能为必胜其敌哉！但能无所畏惧而已矣。此孟施舍养勇之如是也。孟施舍养勇，其迹近似於曾子，北宫黝养勇，其迹近似於子夏。以其孟施舍养勇，见於言而要约，如曾子以孝弟事亲喻为守身之本，闻夫子之道则喻为一贯之要，故以此比之也。北宫黝养勇，见於行而多方，如子夏况在於纷华为己，有杂於小人之儒，教人以事於洒扫之末，故以此比之也。虽然，以二子之实，固不足比於曾子、子夏，但以粗迹比之耳。是二子之养勇，皆止於一偏，未如君子所养，得其大全而已。孟子所以言夫二子黝与舍之养勇，又未知谁以为犹贤，然而能无惧而已者，近能知其本也，故曰孟施舍守约也。“昔者曾子谓子襄曰：子好勇乎？吾尝闻大勇於夫子矣”至“守约也”。孟子言往者曾子谓子襄曰：子能好勇乎，言我尝闻夫子有大勇之义告於我，以谓自反已之勇为非义，则在人者有可陵之辱，故虽一褐宽博之独夫，我且不以小恐惴之，而且亦大恐焉；自反己之勇为义，则在人无可惮之威，故虽千万人之众，我且直往其中，而不惧矣。如此，则孟施舍养勇在於守其气勇，又不如曾子以义为守而要也。言此，则黝不如子夏可知矣。以其养勇有本末之异，则言北宫黝之多方，不若孟施舍之守约；以其守约有气义之别，则又言孟施舍之守其气勇，不如曾子以义为守而要也。然论其不动心则同根，其德则大不相侔矣。“曰：敢问夫子之不动心与告子之不动心可得闻与”者，公孙丑又问孟子之不动心与告子之不动心，其道可得而闻知之与？“告子曰：不得於言，勿求於心，不得於心，勿求於气”至“勿求於心，不可”者，孟子答孙丑，以谓告子言人有不善之言者，是其不得於言者也，故不复求其有善心。告子意以谓人既言之不善，则心中亦必不善也，故云不得於言，勿求於心。人有不善之心者，是其不得於心者也，故不复求其有善辞气。告子意以谓人心既恶，则所出辞气亦必不善也，故云不得於心，勿求於气。孟子言之，以谓人有不善之心，故勿复求其有善辞气，则如告子之言可也；如人但有不善之言，便更不复求其心之有善，则告子之言，以为不可也。无他，盖以人之言虽有不善，而其心未必不善也；其心之不善，则所出辞气必不善故也。以其告子非得其大全之道，故其言此一可行，一不可行也。“夫志，气之帅也，气，体之充也”者，孟子言人之志，心之所之之谓志，所以帅气而行之者也，气但能充满形体者也，故曰“志，气之帅也，气，体之充也”。以其人之辞气有不善者，皆心志所帅而行之矣，气者但惟志是从也，所以又言“志至焉，气次焉”。盖以气由志之所发，志得气而运之也，然则气为所善恶之路，岂非志至焉、气次焉之意乎？至，言无以过之，以其足以制於气，不为气之所制；次，言有以先之，以其从於志，而又有以持於志也。故曰“持其志，无暴其气”者，孟子言气惟志之是从，但持揭其志，则无暴乱其气矣。“既曰志至焉气次焉，又曰持其志，无暴其气者，何也”者，孙丑未晓孟子之言志、气，故问之曰：夫子既以言志至焉，气次焉，而又再言持其志，无暴其气，是如之何也？“曰：志壹则动气，气壹则动志也。今夫蹶者趋者，是气也，而反动其心”者，孟子答孙丑，言志郁壹而不通矣，是谓志壹则动气，气郁壹而不通矣，是谓气壹则动志也。今夫志、气皆郁壹而不通，以之颠倒趋蹶者，是乃反动其心焉，故曰：“今夫蹶者趋者，是气也，而反动其心。”盖志则将帅譬也，气则众卒譬也，心则君譬也。君任将帅，将帅御众，然则志壹则动气，如将帅悖则动众卒矣；气壹则动志，如众卒悖则动将帅，其上又有以动其君矣。由此论之，则既持其志，又不可不知无暴其气矣。“敢问夫子恶乎长”者，公孙丑问孟子，曰：夫子之才志所长以何等，敢请问之。“曰：我知言，我善养吾浩然之气”者，孟子答孙丑之问，以谓我之所长，是我能知人之言而识其人情之所向，我又善养我所有浩然之气也。“敢问何谓浩然之大气”者，公孙丑之言，敢问如何谓之浩然大气。“曰：难言也，其为气也，至大至刚，以直养而无害，则塞于天地之间”者，孟子答公孙丑，以为浩然之大气，难以言形也，盖其为气至大而无所不在，至刚而无所不胜，养之在以直道，不以邪道干害之，则充塞于天地之间，无有穷极也。“其为气也，配义与道。无是，馁也”者，孟子又重言为气也与道义相配偶，常以充满於人之五脏，若无此气与道义配偶，则馁矣，若人之饥饿也。能合道义以养其气，即至大至刚之气也。盖裁制度宜之谓义，故义之用则刚；万物莫不由之谓道，故道之用则大。气至充塞盈满乎天地之间，是其刚足以配义，大足以配道矣。此浩然大气之意也。“是集义所生者，非义袭而取之也”者，孟子又言是气也，是与义杂生所自有者也，从内而出矣，非义之所密取，而在外入者也。“行有不慊於心，则馁矣”者，孟子又言人之所行，如有道义不足於心者，则饥饿者矣，以其有邪干害其浩然之气者为，孟子所以云：“我故曰：告子未尝知义，以其外之也。”盖以告子以仁内义外为言，此孟子乃曰：“告子未尝知义，是又不知是集义所生者、非义袭而取之之意也。“必有事焉而勿正，心勿忘，勿助长也”者，孟子又言人之所行仁义之事，必有福在其中矣，而不可但正心於为福，然後乃行仁义也，止在其不忘於为福，不汲汲於助长其福矣。以其人生之初，盖性固有，不但为之然後有也，惟在常存行之耳，斯亦集义所生、非义袭而取之之意也。故曰“必有事焉而勿正，心勿忘，勿助长也。”又一说云：言人之所行，不可必待有事而後乃正其心而应之也，惟在其常存而不忘，又不在汲汲求助益之而已。斯则先事而虑谓之豫，豫则事优成，後事而虑谓之犹，犹则不立之意也。以其在常存正心於事未然之前耳矣，故曰必有事焉而勿正心，其言勿忘、勿助长则同意。“无若宋人然。宋人有闵其苗之不长而揠之者”至“而又害之”者，此孟子引宋人揠苗而比喻之，以解其助长之意也。言人苟欲速得其福而助长之者，则宋人揠苗者也，故言“无若宋人然”。宋人，宋国之人也。宋国之人，有怜闵苗之不长茂而以揠拔欲亟其长者，芒芒然罢倦而回归，谓其家中之人曰，今日我罢倦成病矣，我其为助长其苗矣。其宋人之子见父云助苗长而罢倦成病，乃趋走而往视其苗还助得其长否？及往至田，所视之，其苗则皆枯槁而死矣。孟子又言今天下之人，不若助苗长者少矣，言当时人皆欲速其福而助长之者也。以其为善无所益，而舍去之者，是忘其善也，是若不耘其苗者也；助长者，是若揠苗者也，非特无益其善，而又所以残害其善也。善者即仁义是也，仁义即善也。苗是种之义者，以譬则人之美质也，固非可以增减之耳。孟子之意，盖欲人之所行当内治，不当急欲求其福也。此亦其天爵，而人爵从之之意也。孟子所以云“我善养吾浩然之气”。“何谓知言”者，公孙丑既得孟子言浩然之气，又问孟子知言之意谓何？“曰：讠皮辞知其所蔽，淫辞知其所陷，邪辞知其所离，遁辞知其所穷”者，此孟子又答孙丑问知言之意也。讠皮辞，其言有偏讠皮不平也。孟子言人有偏讠皮不平之言，我则知其蔽於一曲而已，若告子言仁内义外是也。赵云若宾孟言雄鸡自断其尾之事也。淫辞，言过而不中也。孟子言人有过而不中之言，我则知其所陷而陷又无所不蔽而已，如人坠於陷阱之陷，以其无所不蔽也，若杨墨无父无君之言是也。赵云若骊姬劝晋献公与申生之事也。邪辞，悖正道者也。孟子言人有悖正道之言，我则知其言易以离畔矣，若陈贾谓周公未尽仁智、而况於齐王之言是也。赵云若竖牛观仲壬赐环之事也。遁辞，屈其理也。孟子言人有屈理之言，我则知其言易以穷也，若夷子与孟子相胜以辩、卒以受教是也。赵云若秦客之辞也。“生於其心，害於其政，发於其政，害於其事”者，孟子又言此上四事，皆非出於其心者，即皆出於异端之学者也。人君苟生此四者於心中，必妨害其仁政；既妨害其仁政，则又妨害其事政。则本，上之所施而正人者也；事，则下之所行以治职者也。故事为政之末，政为事之本，如孔子问冉子之退朝何晏也，则谓之事，故不谓之政，是知政、事有别矣。“圣人复起，必从吾言矣”者，孟子言後之圣人有能复兴起者，必从事吾此言而行之矣。“宰我、子贡善为说辞，冉牛、闵子、颜渊善言德行，孔子兼之，曰：我於辞命则不能也”者，孟子既言其讠皮、淫、邪、遁之辞为非，故於此言其善为说辞、善言德行为是者也。盖言宰我、子贡二者，皆善能为说辞。说辞者，以辞说人者也。宰我、子贡皆得圣人所以言者也，故云善为说辞。《论语》四科，二人所以列於言语之科也。冉牛、闵子、颜渊三者皆善言德行。善言德行者，言之必可行，是善言也；行之必可言，是德行也。冉牛、闵子、颜渊皆得圣人所以行者也，故云善言德行。《论语》四科，三者所以列於德行科也。孔子兼之者，孔子天纵之将圣，故多能鄙事，则於说辞德行，兼而能焉。而曰我於辞命，则不能也，孟子盖以儒道游於诸侯，而诸侯宾之，不敢臣，又为国人所矜式，故於辞命又安用之哉！此所以曰我於辞命则不能也。然孟子於辞命，非诚不能也，但不为之耳。以辞命人者，故谓之辞命，以其末也，非本也。故不言不能德行，以其本也，非末也。孟子之意，盖欲当时之人务本不务末耳。“然则夫子既圣矣乎”者，公孙丑见孟子但言不能辞命之末，不言不能德行之本，故谓孟子如是则夫子既已为圣矣。以其宰我、子贡虽善为说辞，然尚未得圣人所以言，冉牛、闵子、颜渊虽善言德行，然尚未得圣人所以行，故数子者，但为孔子之高弟，惟颜渊三子於圣，但具体而微者，而亦未得其为圣矣。公孙丑见孟子言之辞命则不能者，以知孟子之意盖有在於此矣，所以於辞命则言不能也，故问之曰：然则夫子既圣矣乎？“曰：恶是何言也”者，孟子答公孙丑，为不敢安居其圣，故曰恶是何言也。恶，叹也，以其不敢居圣，故叹而言之也。又言“昔者子贡问於孔子曰：夫子圣矣乎”至“是何言也”者，孟子言昔日子贡尝问於孔子，而谓夫子圣矣乎？孔子答之曰：於圣则我不能为也，我但学不厌饱，教人不倦怠也。子贡曰：夫学道能不厌饱，是有智也，以其智足以有知，故能学道不厌也；教人能不倦怠，是有仁也，以其仁足以及物，故能教人不倦也。仁而且智，是夫子既以圣矣。孟子遂言夫圣於孔子尚不敢居，而今丑言我既圣矣，是何所言也，故再言“是何言也”。“昔者闻之子夏、子游、子张，皆有圣人之一体。冉牛、闵子、颜渊，则具体而微”者，孟子常自谦，故言我往日窃闻之，有子夏、子游、子张三人，皆有圣人之一体，亦未得其全才；冉牛、闵子、颜渊则具体，但而微小者也。孟子言此是宜孙丑於前有夫子既圣矣乎而问之也。“敢问所安”者，丑见孟子又言此子夏、子游、子张、冉牛、闵子、颜渊数者，意欲知孟子於此数者之中，何者为比也。“曰姑舍是”者，孟子言且置去，非我之原比者也。“曰伯夷、伊尹何如”者，丑见孟子不比数者，又问之以伯夷、伊尹二者可比之何如。“曰不同道”者，孟子答之，以为伯夷之行，不与伊尹、孔子同道也。“非其君不事，非其民不使，治则进，乱则退，伯夷也”者，孟子言非其所好之君则不奉事之，非以正道得民者不命使之，天下有治道之时则进而仕之，天下无道则退藏其身，是伯夷之所行也。“何事非君，何使非民。治亦进，乱亦进，伊尹也”者，孟子言伊尹曰何所事之君为非君，盖所事者，即皆君也；何所使之民为非民，盖以所使皆是民也；天下治亦进而行道，天下乱亦进而行其道：是伊尹之如是也。“可以仕则仕，可以止则止，可以久则久，可以速则速，孔子也”者，孟子言可以进而进而为仕则进而仕之，可以止而不仕则止之而不仕，可以久则久，虽终身不仕，亦不为之久，可以速则速，虽接淅而行亦不为速，是孔子所行如是也。“皆古圣人也，吾未能有行焉，乃所愿，则学孔子也”，孟子言此数者皆是古之圣人也，我俱未有所行若此而已，乃言我之所愿学，则孔子是学也。孟子之意，盖谓孔子所行，於伯夷、伊尹二子皆兼而有之也。故可仕则仕，而不为伯夷之必於退，可止则止，而不为伊尹之必於进，无可无不可矣。故於终所必归之，但愿学孔子也。“伯夷、伊尹於孔子，若是班乎”者，公孙丑见孟子言之伯夷、伊尹，又言之以孔子，乃曰皆古圣人也，故问之，以伯夷、伊尹、孔子如是，则齐等之乎？班，齐等也。“曰：否，自生民以来，未有孔子也”者，孟子答之以为否，不齐等也，自其有生民以来，至今未有与孔子齐其等者也。“然则有同与”者，公孙丑又问孟子，以谓如是则伯夷、伊尹、孔子三人有同者邪？“曰：有，得百里之地而君之”至“是则同”者，孟子答之，以谓此三人有所同也，盖得百里之土地而为君，三人皆能以朝诸侯有天下也；然行一事之不义杀、一人之无罪而得天下，则三人亦皆不为之：如是则同。若其他事则所行又有不同焉，故曰是则同。“曰敢问其所以异”者，公孙丑又问孟子曰：丑敢请问三人其所以有异者。“曰：宰我、子贡，有若，智足以知圣人，污不至阿其所好”至“未有盛於孔子也”者，此皆孟子为丑言此三人其所以异者也。言宰我与子贡、有若三者，其有智皆足以知其圣人，然虽有小卑不平处，盖亦不至於阿私所好而空誉之，其言皆有可用者也。遂引宰我知圣人之事为公孙丑言之，故言宰我有曰：以予观於孔子，其贤过於尧舜远矣。予，宰我名也。宰我之意，盖谓尧舜有位之圣人，故其行道易，孔子无位之圣人，故其行道难，故以难易为言也。又谓尧舜治天下，但见效於当时，即一时之功也，孔子著述五经，载道於万世，以其有万世之功，故以功为言也。孟子又引子贡有曰：见其孔子制作之礼，而知孔子有政可以致天下之太平，闻孔子雅、颂之乐音，而知孔子有德与文、武同也，从孔子之後，推而等之百世之圣王者，无有能违逆其孔子之道者，是其自生民而来至于今，未有如夫子者也。凡此是子贡之知圣人有如此也。孟子又引有若有曰：岂独其民有类乎哉？言麒麟之於走兽，凤凰之於飞鸟，太山之於丘垤，河海之於行潦，亦类也，圣人之於民亦类也；然而走兽之中以麒麟为之长，飞鸟之中以凤凰为之王，丘垤之中以太山为之尊，行潦之间以河海为之大，人民之间以圣人为人伦之至也；圣人之於民，类也，物亦类也，以其出乎民人之类，而超拔乎众萃之中，自生民以来，至于今，未有盛美过於孔子者也。然则孔子於此三子言之，是所以异於伯夷、伊尹者也。故孟子所以愿学，则学孔子也。○注“四十强而仕”。○正义曰：《曲礼》云：“人生十年曰幼学，二十曰弱冠，三十曰壮而有室，四十曰强而仕，五十曰艾服官政，六十曰耆指使，七十曰老而传，八十、九十曰耄。”凡此是其礼文也。○注“孟贲，勇士也”。○正义曰：案《帝王世纪》云：秦武王好多力之人，齐孟贲之徒并归焉，孟贲生拔牛角。是为之勇士也。○注云：北宫黝，北宫，姓，黝，名也。又云：褐宽博独夫被褐者，释云：褐，编袜也，一曰短衣。北宫黝，其人未详，於他经传亦未之闻焉。孟施舍，亦未详。云“缩，义也。惴，惧也”。闻记云：“古之冠也缩缝，今之冠也衡缝。则缩者理之直也，是知缩训义也。《诗》云：“惴惴其栗。”注云：“恐也”。《传》曰“小恐惴惴，大恐缦缦”是也。○注“密声取敌曰袭”。○正义曰：《左传》云：“凡有钟鼓曰伐，无钟鼓曰袭。”杜预注云：“密声取敌曰袭。”是其文也。○注云“宾孟言雄鸡自断其尾”至“诸大夫也”。○正义曰：案鲁昭公二十二年《左传》云：“王子朝、宾起有宠於景王，王与宾孟说之，欲立。刘献公之庶子伯{分虫}事单穆公，恶宾孟。”“郊，见雄鸡自断其尾。问之，侍者，曰：‘自惮其牺也。’遽归告王，且曰：‘鸡其惮为人用乎，人异於是，牺者实用人，人牺实难，已牺何害？’王弗应。”凡此是也。云“骊姬劝晋献公与申生”者，案鲁庄公二十八年云：“晋献公娶于贾，无子，於齐姜，生秦穆夫人及太子申生。又娶二女於戎，大戎狐姬生重耳，小戎子生夷吾。晋伐骊戎，骊戎男女以骊姬，归，生奚齐，其娣生卓子。骊姬欲立其子，赂外嬖梁五与东关嬖五，使言於公曰：‘曲沃，君之宗也，蒲与二屈，君之疆也，不可以无主。宗邑无主，则民不威；疆埸无主，则启戎心。若使太子主曲沃，而重耳主蒲，夷吾主屈，则可以威民而惧戎，且旌君伐。’使俱曰：‘狄之广莫，於晋为都。晋之启土，不亦宜乎？’晋侯悦之。夏，使太子申生主曲沃，重耳居蒲，夷吾居屈。惟二姬之子在绛。二五卒与骊姬谮群公子而立奚齐，晋人谓之二五耦。”凡此是也。云“竖牛观仲壬赐环之事”，案《左传》昭公四年云：“初，穆子去叔孙氏，及庚宗，齐，娶於国氏，生孟丙、仲壬。梦天压己，弗胜，顾而见人，黑而上偻，深目而喙，号之曰：牛，助余。乃胜之耳。旦，召其徒，无之。”及後，妇人献雉。妇人是穆子，及庚宗之地，常遇而宿者也，因问其有子，曰：“余子长矣，能奉雉而从我矣。”召而见之，则所梦也。问其名，曰“牛”。遂使为竖臣，有宠，长，使为政。竖牛欲乱，後仲壬与公御莱书观於公，公与之环，使牛入示之。入，不示，出，命佩之。牛谓叔孙：“见仲壬而何？”叔孙曰：“何为？”曰：“不见。既自见矣，公与之环而佩之矣。”遂逐之。奔齐，叔孙疾急命召仲，牛许而不召。有进食则止之而弗进。叔孙不食，乃卒，立其子而相之。昭公五年又曰：“昭子即位，朝其家众，曰：‘竖牛祸叔孙氏，使乱大从，杀立庶，又披其邑，将以赦罪，罪莫大焉，必速杀之。’竖牛惧，奔齐。孟、仲之子杀诸塞外，投其首於宁风之棘上。”凡此是也。云“秦客辞”者，案《国语》：“晋文公时，范文子暮退於朝，武子曰：‘何暮也？’对曰：‘有秦客辞於朝，大夫莫之能对，吾知一二焉。’武子怒曰：‘大夫非不能也，让父兄也。尔童子而三掩人於朝，吾不在，晋国无日矣。’击之，以杖折委笄。”凡此者是也。大抵“辞”云者，如今呼笔为管城子，纸为楮先生，钱为白水真人，又为阿堵物之类是也。○注“予，宰我名也”。○正义曰：案《史记·弟子传》云：“宰予字子我。”郑玄曰：“鲁人也。”○注“垤，蚁封。行潦，道傍流潦也。萃，聚也”。○正义曰：释云：垤，蚁冢也。潦，雨水盛也。经云行潦，是为道傍流潦也，萃亦云集也。" }
      - { type: j, text: "孟子曰：“以力假仁者，霸霸必有大国。以德行仁者王，王不待大。汤以七十里，文王以百里。（言霸者以大国之力，假仁义之道，然後能霸，若齐桓、晋文等是也。以己之德，行仁政於民，小国则可以致王，若汤、文王是也。）以力服人者，非心服也，力不赡也。以德服人者，中心悦而诚服也，如七十子之服孔子也。（赡，足也。以已力不足而往服就於人，非心服者也。以已德不如彼而往服从之，诚心服者也。如颜渊、子贡等之服於仲尼，心服者也。）《诗》云：‘自西自东，自南自北，无思不服。”此之谓也。（《诗·大雅·文王有声》之篇。言从四方来者，无思不服武王之德，此亦心服之谓也。）" }
      - { type: z, text: "“孟子曰”至“此之谓也”。○正义曰：此章指言王者任德，霸者兼力，力服心服，优劣不同，故曰远人不服，修文德以怀之。“孟子曰：以力假仁者霸”至“文王百里”者，孟子言以大国之力，而假以仁义之道行之者，乃能为霸，以把握诸侯之权也，故必有其大国。以德泽而行仁政者，乃能为之王，使天下皆归往者也，故不待有大国而为之也。汤但以七十里起而为商之汤王，文王但以百里而天下归，是其以德泽行仁政於天下，故不待有大国而为之王，此汤、文二者是也。“以力服人者”至“服孔子也”者，孟子言但以力而服人，人虽面从而服之，然亦非是心服之也。以德服人，人则中心悦乐而诚心服也，如七十子之服仲尼者也，是其以诚心服之也，非面从而服之者也。“《诗》云：自西自东，自南自北，无思不服，此之谓也”者，此盖《诗·大雅·文王有声》之篇文也。盖孟子引此而证其诚服之意，故援之，曰自南而自北，自西而自东，而四方皆归之，无有所思而不服，是亦此之谓与。○注“《大雅·文王有声》之诗”。○正义曰：此篇盖言文王继伐，武王能广文王之声，卒其伐功也。笺云：自，由也，言武王於镐京行辟雍之礼，自四方来观者，皆感化其德，而心无不服者。" }
      - { type: j, text: "孟子曰：“仁则荣，不仁则辱。今恶辱而居不仁，是犹恶湿而居下也。（行仁政则国昌而民安，得其荣乐。行不仁则国破民残，蒙其耻辱。恶辱而不行仁，譬犹恶湿而居卑下近水泉之地也。）如恶之，莫如贵德而尊士，贤者在位，能者在职，（诸侯如恶辱之来，则当贵德以治身，尊士以敬人，使贤者居位，官得其人，能者居职，人任其事也。）国家闲暇，及是时明其政刑，虽大国必畏之矣。（及无邻国之虞，以是闲暇之时，明修其政教，审其刑罚，虽天下大国，必来畏服。）《诗》云：‘迨天之未阴雨，彻彼桑土，绸缪牖户。今此下民，或敢侮予。’孔子曰：‘为此诗者，其知道乎？能治其国家，谁敢侮之。’（《诗》国《鸱》之篇。迨，及。彻，取也。桑土，桑根也。言此鸱小鸟，犹尚知反天未阴雨而取桑根之皮，以缠绵牖户。人君能治国家，谁敢侮之。剌君曾不如此鸟。孔子善之，故谓此诗知道也。）今国家闲暇，及是时，般乐怠敖，是自求祸也。祸福无不自已求之者。（般，大也。孟子伤今时之君，国家有闲暇，且以大作乐，怠惰敖游，不政刑，是以见侵而不能距，皆自求祸者也。）《诗》云：永言配命，自求多福。‘（《诗·大雅·文王》之篇。永，长；言，我也。长我周家之命，配当善道，皆内自求责，故有多福也。）《太甲》曰：‘天作孽，犹可违。自作孽，不可活。’此之谓也。（殷王太甲，言天之妖孽，尚可违避，譬若高宗ず雉，宋景守心之变，皆可以德消去也。自已作孽者，若帝乙慢神震死，是为不可活也。）" }
      - { type: z, text: "“孟子曰”至“此之谓也”。○正义曰：此章指言国必修政，君必行仁，祸福由己，不专在天，当防患於未乱也。“孟子曰：仁则荣，不仁则辱。今恶辱而居不仁，是犹恶湿而居下也”者，孟子言国君行仁，则国昌民安，享其荣乐。行不仁，则国破民残，故己蒙其耻辱。今之国君，既能疾恶其有耻辱於己，而以居处於不仁之道，是若疾恶其湿污，而以居其卑下近水泉之地也。“如恶之，莫如贵德而尊士，贤者在位，能者在职”者，言今之国君，如能疾恶其耻辱，莫若尚其有德之贤，而尊敬其有道之士也。既能贵德尊士，则贤者居其官位，能者任其官职也。所贵德者，为其有德也，所以尊士者，为其事道也。能为人所不能为，贤长於德行者也；能为人之所能为能，长於道艺者也。得贤能在位在职，则国无不治也。所以谓仁则荣之意也。“今国家暇，及是时明其政刑，虽大国必畏之矣”者，言今国家闲暇无事，以及此时，若能修明政教刑罚，虽强大之国，亦必畏服矣。“《诗》云：迨天之未阴雨，彻彼桑土”至“谁敢侮之”者，自“迨天”至“或敢侮予”，盖《诗》国《鸱》之篇文也。言此鸱小鸟，尚知天未阴雨之前，取彼桑根之皮土，以缠绵牖户，喻人君能於闲暇之时，治其国家，以明其刑政，则今此下民，谁敢侮慢我也。诗人盖以天之未阴雨，国家闲暇之譬也。彻彼桑土，绸缪牖户，明其政刑之譬也。今此下民，或敢侮予，大国必畏之譬也。鸱所以彻彼桑土於天未阴雨之前，以缠绵牖户，则风雨莫得以漂摇，人君所以明政刑於暇之时，以维持国家，则邻国莫得以侵侮。此孔子所以曰作为此诗者，是能知其治道者也。以其能治其国家，则谁敢侮之矣。是宜孔子善之，以谓为此诗者，其知道乎？“今国家闲暇，及是时，般乐怠敖，是自求祸也。祸福无不自已求”者，孟子伤今之人君，於国家闲暇以及於此时乃大作乐，怠惰敖游，而不修明刑政，是自求其祸也。以其祸福无有不自於己求之矣，如所谓夫人必自畏然後人畏之，夫人必自侮然後人侮之，是其祸福无不自已求之意也。“诗云：永言配命，自求多福”者，盖《诗·大雅·文王》之篇文也。永，长也。言，我也。盖谓我长配天命而行，以自求多福也。“《太甲》曰：天作孽，犹可违。自作孽，不可活。此之谓也”者，太甲，殷王之名也，言大甲尝谓上天作其灾孽，尚可违避。如已自作其灾孽，不可得而生活也。如高宗、宋景二者，修德以消去者，是天作孽犹可违也。帝乙慢神震死，是自作孽，不可活也。凡此孟子所以引之者，是亦证其祸福无不自已求之之意也。○注“诗国之篇”。○正义曰：《鸱》之诗，盖言周公救乱也。成王未知周公之志，公乃为诗以遗王，名之曰《鸱》焉。毛云：“鸱，宁也。迨，及也。彻，剥也。桑土，桑根也。绸缪犹缠绵也。”笺云：“鸱自说作巢至苦矣，如是以喻诸臣之先臣，亦及文武未定天下，积日累功，以固定此官位与土地。今女我巢下之民，宁有敢侮慢欲毁之者乎？意欲恚怒之，以喻诸臣之先臣固定此官位土地，亦不欲见其绝夺矣。”○注“《诗·大雅·文王》之篇”。○正义曰：此诗盖言文王受命作周之诗也。笺云：“长犹常也，王既述修祖德，常言当配天命而行，则福禄自求也。”○注“殷王太甲”至“不可活也”。○正义曰：案《本纪》云：“太甲，成汤长孙也，太丁之子也。太甲既立三年，不明暴虐，不遵汤法，乱德。於是伊尹放之於桐宫。三年悔过自责，反善，伊尹乃迎太甲而授之政。太甲修德，诸侯咸归，百姓以宁。伊尹嘉之，作《太甲训》，以褒太甲，号称太宗。”云“高宗ず雉“者，案《史记》云武丁也，“武丁祭成汤，明日有飞雉登鼎耳而ず。武丁惧，祖乙曰：王勿忧，先修政事。武丁乃修政行德，天下咸欢。武丁崩，祖乙嘉武丁之以祥雉为德，立其庙，为高宗，遂作《高宗肜日》及《训》”是也。云“宋景守心之变”者，案《史记》云“头曼立二十七年，荧惑守心。心，宋之分野也。景公忧之，司星子韦曰：‘可移於相。’景公曰：‘相，吾之股肱。’曰：‘可移於民。’景公曰：‘君者待民。’曰：‘可移於岁。’景公曰：‘岁饥民困，吾谁为君？’子韦曰：‘天高听卑，君有君人之言，三荧惑宜有动。’於是候之，果徙三度。六十四年，景公卒”是也。云“帝乙慢神震死”者，案《史记》云“庚丁之子也武乙立为帝，无道，为偶人，谓之天神，与之抟，令人为行。天神不胜，乃﹃辱之，为革囊盛血，仰而射之，命曰射天。武乙猎於河渭之间，暴雷，武乙震死”是也。" }
      - { type: j, text: "孟子曰：“尊贤使能，俊杰在位，则天下之士皆悦，而原立於其朝矣。（俊，美才出众者也。万人者称杰。）市廛而不征，法而不廛，则天下之商皆悦而原藏於其市矣。（廛，市宅也。古者无征，衰世征之。《王制》曰：“市廛而不税。”《周礼·载师》曰：“国宅无征。”法而不廛者，当以什一之法征其地耳，不当征其廛宅也。）关讥而不征，则天下之旅皆悦而原出於其路矣。（言古之设关，但讥禁异言、识异服耳，不征税出入者也，故《王制》曰“古者关讥而不征”。《周礼·太宰》曰“九赋，七曰关市之赋”，《司关》曰“国凶扎，则无关门之征，犹讥”。《王制》谓文王以前也，文治岐，关讥而不征。《周礼》有征者，谓周公以来。孟子欲令复古之征，使天下行旅悦之也。）耕者助而不税，则天下之农皆悦而原耕於其野矣。（助者，井田什一，助佐公家治公田，不横税赋，若履亩之类。）廛无夫里之布，则天下之民皆悦而原为之氓矣。（里，居也。布，钱也。夫，一夫也。《周礼·载师》曰：“宅不毛者有里布，田不耕者有屋粟。凡民无职事者，出夫家之征。”孟子欲使宽独夫去里布，则人皆乐为之氓矣。氓者谓其民也。）信能行此五者，则邻国之民，仰之若父母矣。率其子弟，攻其父母，自生民以来，未有能济者也。（今诸侯诚能行此五事，四邻之民，仰望而爱之如父母矣。邻国之君，欲将其民来伐之，譬若率勉人子弟，使自攻其父母。自生民以来，何能以此济成其欲也。）如此，则无敌於天下。无敌於天下者，天吏也，然而不王者，未之有也。（言诸侯所行能如此者，何敌之有。是为天吏，天吏者，天使也。为政当为天所使，诛伐无道，故谓之天吏也。）" }
      - { type: z, text: "“孟子曰”至“未之有也”。○正义曰：此章指言修古之道，邻国之民以为父母。行今之政，自己之民不得而子。是故众夫扰扰，非所常有，命曰天吏，明天所使也。“孟子曰：尊贤使能，俊杰在位，则天下之士，皆悦而原立於其朝矣”者，孟子言今之国君，能尊敬贤者，任使能者，俊杰大才在官位，则天下为之士者皆悦乐，原立其朝廷矣。“市廛而不征，法而不廛，则天下之商皆悦而原藏於其市矣”者，言市廛宅而不征，取其税以什一之法，征其地而不征其廛宅，则天下为商贾者，皆喜悦而原藏贮於其市矣。“关讥而不征，则天下之旅皆悦而原出其路矣”者，言关门之所，但讥察其异言、异服之人，而不税出入者，则天下行旅之众，皆悦乐而原出於其道路矣。“耕者助而不税，则天下之农皆悦而原耕於其野矣”者，言耕田者但以井田制之，使助佐公田而治，不以横税取之，则天下为之农者，皆悦而原耕作其郊野矣。“廛无夫里之布，则天下之民皆悦而愿为之氓矣”者，言一夫所受之宅，而不出夫家之征，一廛所居之地，而不取其里布，则天下之民，皆悦乐而原为之氓矣。信能行此五者於天下，则邻国之民仰之若父母矣。“率其子弟，攻其父母，自有生民以来，未有能济者也”者，言今之国君，诚能信行此上五者之事，则四邻之国民，仰望之如父母而亲之矣。邻国虽欲勉率其民，如子弟攻其父母，言自有生民以来而至於今，未有能济成其欲者也。言其民皆仰望之，而亲敬之，不肯为其所恶，而贼其所好也。“如此，则无敌於天下，无敌於天下者，天吏也。然而不王者，未之有也”者，言国君行此五者之事，而民仰望之，如此则是无敌於天下也。言天下之人，无与敢为敌者也。既无敌於天下者，是名为天吏者也。天所使者，是谓天吏也。然而为天吏而不王者，必无也。故曰未之有也。廛者一夫所受之宅也，里者一廛所居之地也。野者氓者，案《周官》制地之法，六乡以教为主，其主民有郊於内，故其地为郊而民则谓之民，以其近主而有知者也；六遂以耕为主，而其民有遂於外，故其地为野而民故谓之氓，以其远主而无知者也：此孟子云野云氓之意也。盖孟子或云贵德而尊士，贤者在位，能者在职，或曰尊贤使能，俊杰在位者，以其贵士之有德，尊士之有道者，为其贤也，为其能也。即其贤而授之位，所以尊其贤。即其能而授之职，所以使其能。若夫俊杰则行而敏速，立而绝众，贤之豪者，非可使以职也，故曰在位而已。○注“廛市宅”至“廛宅也”。○正义曰：《王制》云“市廛而不税”者，案郑注云：“廛，市物邸舍，税其舍，不税其物也。”注云“《周礼·载师》云宅无征”者，载师者，掌任土之法，以物地事授地职而待其政令者也。宅无征，所以言宅无税也。○注“言古之设关”至“旅税之也”。○正义曰：云“《王制》曰古者关讥而不征”，《礼记》有《王制》之篇，中有云此。案郑注云：讥异服，识异言也。云“《周礼·太宰》曰九赋，七曰关市之赋”。“一曰邦中之赋，二曰四郊之赋，三曰郊甸之赋，四曰家削之赋，五曰邦县之赋，六曰邦都之赋，七曰关市之赋，八曰山泽之赋，九曰币馀之赋，郑司农云：“币馀，百工之馀。”《司关》曰：“国凶扎，则无关门之征，犹讥。”郑司农云：“凶谓凶年饥荒也，札谓疾疫死亡也。越人谓死为札。”《春秋传》曰：“札瘥夭昏，无关门之征者，出入关门，无租税，犹苛察不得令奸人出入也。”注《周礼·载师》曰：宅不毛者有里布，田不耕者有屋粟。凡民无职事者，出夫家之征”。郑司农云：“宅不毛者，谓不树桑麻也。里布者，布参印书，广二寸，长二尺，以为币贸易物。”《诗》云“抱布贸丝”，此布也，或曰布，泉也。《春秋传》曰“贸之百两一布”又《廛人职》“掌敛市之次布、亻布、质布、罚布、廛布”。不知言“布参印书”者何见旧时说也。郑玄谓宅不毛者罚以一里二十五家之泉，空田者罚以三家之税粟，以共吉凶二服及丧器也。民虽有，无职事者，犹出夫税、家税也。夫税者，百亩之税。家税者，出士徒车辇给徭役。" }
      - { type: j, text: "孟子曰：“人皆有不忍人之心，（言人人皆有不忍加恶於人之心也。）先王有不忍人之心，斯有不忍人之政矣。以不忍人之心，行不忍人之政，治天下可运之掌上。（先圣王推不忍害人之心，以行不忍伤民之政，以是治天下，易於转丸於掌上也。）所以谓人皆有不忍人之心者，今人乍见孺子将入於井，皆有怵惕恻隐之心，非所以内交於孺子之父母也，非所以要誉於乡党朋友也，非恶其声而然也。（乍，暂也。孺子，未有知之小子。所以言人皆有是心，凡人暂见小孺子将入井，贤愚皆有惊骇之情，情发於中，非为人也，非恶有不仁之声名，故怵惕也。）由是观之，无恻隐之心，非人也；无羞恶之心，非人也；无辞让之心，非人也；无是非之心，非人也。（言无此四者，当若禽兽，非人心耳。为人则有之矣。凡人但不能演用为行耳。）恻隐之心，仁之端也；羞恶之心，义之端也；辞让之心，礼之端也；是非之心，智之端也。（端者，首也。人皆有仁义礼智之首，可引用之。）人之有是四端也，犹其有四体也。有是四端，而自谓不能者，自贼者也。（自谓不能为善，自贼害其性，使不为善也。）谓其君不能者，贼其君者也。（谓君不能为善而不匡正者，贼其君使陷恶也。）凡有四端於我者，知皆扩而充之矣。若火之始然，泉之始达。苟能充之，足以保四海；苟不充之，不足以事父母。”（扩，廓也。凡有四端在於我者，知皆廓而充大之，若火、泉之始微小，广大之则无所不至。以喻人之四端也，人诚能充大之，可保安四海之民，诚不充大之，内不足以事父母，言无仁义礼智，何以事父母也。）" }
      - { type: z, text: "“孟子曰”至“不足以事父母”。○正义曰：此章指言人之行当内求诸己，以演大四端，充广其道，上以匡君，下以荣身也。“孟子曰人皆有不忍人之心”者，孟子言人之为人，皆有不忍加恶於人之心也。“先王有不忍人之心，斯有不忍人之政”至“掌上”者，又言古先圣王有不忍加恶於人之心，斯有不忍伤民之政。既以不忍加恶於人之心，以行其不忍伤民之政，其治天下之易，但若转运走丸於掌上之易者也。“所以谓人皆有不忍人之心者，今人乍见孺子将入井”至“然也”者，孟子又言所以谓人之为人皆有不忍加恶於人之心者，且以今人乍见孺子言之。孺子，无知之小子也。今人乍见无知之小子，相将匍匐，欲坠於井，但见之者皆有怵惕恐惧恻隐痛忍之心，所以然者，非是内尝结交於孺子之父母然後如此也，又非是所以欲要求美誉於乡党朋友也，又非所以恶有不仁之声而然也。“由是观之，无恻隐之心，非人也”至“无是非之心，非人也”者，孟子言由此见孺子将入於井、人皆有怵惕恻隐之心观察之，是无恻隐、羞恶、辞让、是非四者之心，皆非是人也，乃若禽兽之类也。禽兽所以无恻隐不忍之心，又无羞恶惭耻之心，又无辞让揖逊之心，又无是非好恶之心者也。言苟无此四者，所以皆谓之非人也，乃禽兽之类也。“恻隐之心”至“智之端也”者，孟子言人有恻隐之心，是仁之端，本起於此也。有羞恶之心者，是义之端，本起於此也。有辞让、是非之心者，是礼、智之端，本起於此者也。以其仁者不过有不忍恻隐也，此孟子所以言恻隐羞恶辞让是非四者，是为仁义礼智四者之端本也。“人之有是四端也，犹其有四体也”至“贼其君者也”者，孟子又言人有是恻隐、羞恶、辞让、是非为仁义礼智之四端，若其人之有四肢也。既有此四端，而自谓已之不能为善者，是自贼害其善，而不为善也。以之事君，如谓其君不能为善、不匡正之者，是亦贼害其君，使陷於恶也。无他，以其人之为人，皆有此四端也，但不推用而行之耳。如能推此四端行之，是为仁义礼智者矣，所谓仁义礼智者即善也。然则人人皆有善矣，故孟子所以言之以此。“凡有四端於我者，知皆扩而充之”至“不足以事父母”者，孟子又言凡人所以有四端在於我己者，能皆廓而充大之，是若火之初燃，泉之始达，而终极乎燎原之炽，襄陵之荡也。苟能充大之，虽四海之大，亦足保安之也。苟不能充大之，虽己之父母，亦不足以奉事之。故曰：苟能充之，足以保四海，苟不充之，不足以事父母。是亦推恩足以保四海，不推恩无以保妻子之意也。" }
      - { type: j, text: "孟子曰：“矢人岂不仁於函人哉！矢人惟恐不伤人，函人惟恐伤人。巫匠亦然，故术不可不慎也。（矢，箭也。函，甲也。《周礼》曰：“函人为甲。”作箭之人，其性非独不仁於作甲之人也，术使之然。巫欲祝活人。匠，梓匠，作棺欲其蚤售，利在於人死也。故治术当慎，修其善者也。）孔子曰：‘里仁为美，择不处仁，焉得智？’（里，居也。仁，最其美者也。夫简择不处仁，为不智。）夫仁，天之尊爵也，人之安宅也，莫之御而不仁，是不智也。（为仁则可以长天下，故曰天所以假人尊爵也。居之则安，无止之者，而人不能知入是仁道者，又安得为之智乎。）不仁不智，无礼无义，人役也。（若此，为人所役者也。）人役而耻为役，由弓人而耻为弓，矢人而耻为矢也。（治其事而耻其业者，惑也。）如耻之，莫如为仁。（如其耻为人役而为仁，仁则不为役也。）仁者如射，射者正己而後发，发而不中，不怨胜己者，反求诸己而已矣。”（以射喻人为仁，不得其报，当反责己之仁恩有所未至也，不怨胜己者。）" }
      - { type: z, text: "“孟子曰”至“反求诸已而已矣”。○正义曰：此章指言各治其术，术有善恶，祸福之来，随行而作。耻为人役，不若居仁，治术之忌，勿为矢人也。“孟子曰矢人岂不仁於函人哉”至“故术不可不慎也”者，孟子言作矢之人，其性岂不仁过於函人哉？其所以不仁於函人者，以其术使之然也。作矢之人，其心於所作箭之时，惟恐不利、不能伤害人也。作函之人，其心於作函之时，惟恐不坚厚而有伤害於人也。不特此二者如此，虽作巫祝、梓匠之人亦如是也。以其巫人祝，在於活人。梓匠作棺，欲其速售，利在於人死也。此孟子所以故云其治术人亦不可不慎择也。矢，箭也。函，铠也。甲是也。“孔子曰：里仁为美，择不处仁，焉得智”者，孟子言孔子有曰所居以仁，最为美也。然而人所拣择，不处於仁里，又安得谓之智也？以其智足以有知故也，不知择处於仁，岂谓之智哉！“夫仁，天之尊爵也，人之安宅也，莫之御而不仁，是不智也”者，言夫仁之为道，是天之尊爵也，人之安宅也。谓之尊爵者，盖受之於人而彼得以贱之者，非尊爵也。仁则得之於天，而万物莫能使之贱，是尊爵也。安宅者，盖营於外而彼得以危之者，非安宅也。仁则立之自内，而万物莫能使之危，是安宅也。今夫天下之事有形格势禁而不得有为者，为其有以御之也。仁之为道，乃天之尊爵，而得之自天者。人之安宅，而立之自我者，但欲仁则仁矣，谁其御之而不为哉。今仁之为道，人莫御之使不为，而自不为仁者，是亦不智者也。“不仁不智，无礼无义，人役也”至“莫如为仁”者，言人之不仁不智者，是无礼无义，为人所役者也。既为人所役，而耻辱为人所役，是若非弓矢之人，不知择术而耻为弓矢也。如耻为人所役，莫若择术而为仁也。以其为仁，则礼义随而有之矣，虽欲役之，不可得已。然则仁则荣，不仁则辱，亦此之谓也。“仁者如射”至“反求诸己而已矣”者，孟子比之於仁者如射也，以其射者，必待先正其身，已然後而发矢射之也。既发矢而射之，不中其的，则又不怨恨其射胜於己者，但反责求诸己而已矣。盖君子以仁存心，其爱人则人常爱之，犹之正己而後发也。有人於此待我以横逆，犹之发而不中也，自反而不以责诸人，犹之不怨胜己者、反求诸己而已矣。此孟子所以比仁者如射，发而不中，不怨胜己者，反求诸己而已矣。" }
      - { type: j, text: "孟子曰：“子路，人告之以有过则喜，禹闻善言则拜。（子路乐闻其过，过而能改也。《尚书》曰：“禹拜谠言。”）大舜有大焉，善与人同，舍己从人，乐取於人以为善，（大舜，虞舜也。孔子称曰“巍巍”，故言大舜有大焉，能舍己从人，故为大也，於子路与禹同者也。）自耕稼陶渔以至为帝，无非取於人者。取诸人以为善，是与人为善者也。故君子莫大乎与人为善。”（舜从耕於历山及其陶渔，皆取人之善谋而从之，故曰莫大乎与人为善。）" }
      - { type: z, text: "“孟子曰”至“与人为善”。○正义曰：此章指言大圣之君，犹采善於人。故曰“计及下者无遗策，举及众者无废功”也。“孟子曰：子路，人告之以有过则喜，禹闻善言则拜”者，孟子言子路之为人，人有告之以过事则喜，乐从人之言而改其过。大禹之为人，闻有善言则拜而受之也。“大舜有大焉，善与人同，舍己从人，乐取於人以为善”者，孟子又言大舜之为帝，有大巍巍之功焉，无它，以其善能与人同之也。己之善，亦犹人之善，人之善，亦犹己之善，是与人同善也。所以能如此者，亦以能舍己之所见，而从人之见，又乐取诸人以为善也。自“耕稼”至“与人为善”者，此孟子自引舜之事迹，而自解舜取人以为善之言也。言舜自耕稼於历山、陶於河滨、渔於雷泽之时以至为帝，无非取人之善谋而从之也，取诸人以为善，是亦与人为其善者也。所谓“舜耕历山，历山之人皆让畔。渔雷泽，雷泽之人皆让居。陶河滨，河滨器皆不苦窳”，是亦与人为善之事也。“故君子莫大乎与人为善”者，此孟子所以复言凡为善之君子，莫大乎与人为善也。○注“大舜虞帝”至“同者也”。正义曰：虞，舜之国号也。云“孔子称曰巍巍”者，案《论语》有云：“巍巍乎其有成功。”孔注云：“功成化隆，高大巍也”。○注“舜从历山及其陶渔”者。○正义曰：此皆案《史纪·帝记》有云然也。" }
      - { type: j, text: "孟子曰：“伯夷，非其君不事，非其友不友，不立於恶人之朝，不与恶人言。立於恶人之朝，与恶人言，如以朝衣朝冠坐於涂炭。推恶恶之心，思与乡人立，其冠不正，望望然去之，若将浼焉。（伯夷，孤竹君之长子，让国而隐居者也。涂，泥。炭，墨也。浼，污也。思，念也。与乡人立，见其冠不正。望望然，惭愧之貌也。去之，恐其污己也。）是故诸侯虽有善其辞命而至者，不受也。不受也者，是亦不屑就已。（屑，洁也。《诗》云：“不我屑已。”伯夷不洁诸侯之行，故不忍就见也。殷之末世，诸侯多不义，故不就之，後乃归於西伯也。）柳下惠，不羞污君，不卑小官，进不隐贤，必以其道。遗佚而不怨，厄穷而不悯。故曰：‘尔为尔，我为我，虽袒裼裸裎於我侧，尔焉能浼我哉？’（柳下惠，鲁公族大夫也。姓展，名禽，字季，柳下是其号也。进不隐己之贤才，必欲行其道也。悯，懑也。云善己而已，恶人何能污於我邪。）故由由然与之偕而不自失焉，援而止之而止。援而止之而止者，是亦不屑去已。”（由由，浩浩之貌。不惮与恶人同朝并立。偕，俱也。与之俪行於朝何伤？但不失己之正心而已耳。援而止之，谓三黜不惭去也。是柳下惠不以去为洁也。）孟子曰：“伯夷隘，柳下惠不恭。隘与不恭，君子不由也。”（伯夷隘，惧人之污来及己，故无所含容，言其大隘狭也。柳下惠轻忽时人，禽兽畜之，无欲弹正之心，言其大不恭敬也。圣人之道，不取於此，故曰君子不由也。先言二人之行，孟子乃评之耳。）" }
      - { type: z, text: "“孟子曰伯夷”至“君子不由也”。○正义曰：此章指言伯夷、柳下惠，古之大贤，犹有所阙。介者必偏，中和为贵，纯圣能然，君子所由，尧舜是尊也。“孟子曰：伯夷非其君不事”至“是亦不屑就已”者，孟子言伯夷非已所好之君则不奉事之，非与己同志之友则不与为交友。不立於恶人之朝，是不事非其君也；不与恶人言，是不友非其友也。谓立於恶人之朝，与恶人言语，如以服其朝衣朝冠而坐於涂泥炭墨之中矣，以其有污於己也。推已恶恶之心，乃至於与乡人立，其冠有不正，且望望然惭耻而远去之，若相将有污於己也。如此，故诸侯虽有善辞命而至者，亦不受也。以其不受之者，是亦不洁而不忍就见也。故以不就为洁也。屑，洁也。“柳下惠不羞污君，不卑小官”至“是亦不屑去已”者，孟子又言柳下惠不羞耻事其污君。污君，滥恶之君也。虽居小官之位，而不卑辱，进而仕，则不隐己之贤才，必以欲行其道。虽遗佚於野，而不怨恨，虽厄之使穷困，而不哀悯，故曰尔为之尔，我为之我，虽袒裼裸裎，袭其身体於我身侧，尔又安能浼渎於我哉。以其不殊於俗，一於和而已。如此，故由由然浩浩与人偕俪而行，但不失己之正心焉。牵援而止之而则止之，以其援而止之而止，是亦不洁而去已，故以不去为洁也。“孟子曰：伯夷隘，柳下惠不恭。隘与不恭，君子不由也”者，此孟子所以复言伯夷之行失之太清而不能含容，故为狭隘；柳下惠失之太和而轻忽时人，故为不恭敬。然狭隘与不恭敬，是非先王所行之道，故君子不由用而行之也。○注“伯夷，孤竹君之长子，让国而隐居者也”。○正义曰：案《春秋·少阳篇》云：“伯夷姓墨名允，字公信，谥为夷。”太史公云：“伯夷、叔齐，孤竹君之二子。父欲立叔齐，及父卒，叔齐让伯夷。伯夷曰：‘父命也。’遂逃去。叔齐不肯立，亦逃之。国人立其中子。於是伯夷叔齐闻西伯昌善养老，盍往归焉。及西伯卒，武王东伐纣。伯夷、叔齐叩马而谏曰：‘父死不葬，爰及干戈，可谓孝乎？以臣弑君，可谓仁乎？’左右欲兵之。太公曰：‘此义人也。’扶而去之。武王平殷，天下宗周。伯夷、叔齐耻之，义不食周粟，隐於首阳山，采薇而食之。及饿死”者是矣。孤竹，北方之远国也，号为孤竹。案《地理志》云：“辽西有孤竹城。”应劭曰“故伯夷国”是也。○注“柳下惠，鲁公族大夫，姓展，名禽，字季，柳下是其号”者。○正义曰：案《史记》传云：“柳下惠姓展，名禽，鲁人也，为鲁典狱之官，任以直道。故孔子云：‘柳下惠为士师，三黜。人曰：子未可去乎？曰直道而事人，焉往而不三黜，枉道而事人，何必去父母之邦？”孔注云：“士师，典狱之官。”郑玄亦云然。" }
