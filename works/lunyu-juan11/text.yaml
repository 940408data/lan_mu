# 論語注疏卷11（邢昺疏）：j 為經文＋魏何晏集解，z 為疏文。
sections:
  - id: juan11
    name: 正文
    blocks:
      - { type: z, text: "正义曰：前篇论夫子在乡党，圣人之行也。○此篇论弟子，贤人之行，" }
      - { type: j, text: "圣贤相次，亦其宜也。" }
      - { type: j, text: "子曰：“先进於礼乐，野人也。後进於礼乐，君子也。（孔曰：“先进、後" }
      - { type: j, text: "进，谓仕先後辈也。礼乐因世损益，後进与礼乐，俱得时之中，斯君子矣；先进" }
      - { type: j, text: "有古风，斯野人也。”）如用之，则吾从先进。”（将移风易俗，归之淳素。先" }
      - { type: j, text: "进犹近古风，故从之。）" }
      - { type: z, text: "“子曰”至“吾从先进”。○正义曰：此章孔子评其弟子之中仕进先後" }
      - { type: j, text: "之辈也。“先进於礼乐野人也”者，先进，谓先辈仕进之人，准於礼乐，不能因" }
      - { type: j, text: "世损益，而有古风，故曰朴野之人也。“後进於礼乐，君子也”者，後进，谓後" }
      - { type: j, text: "辈仕进之人也，准於礼乐，能因时损益，与礼乐俱得时之中，故曰君子之人也。" }
      - { type: j, text: "“如用之，则吾从先进”者，言如其用之以为治，则吾从先辈朴野之人。夫子之" }
      - { type: j, text: "意，将移风易俗，归之淳素。先进犹近古风，故从之也。○注“孔曰”至“人也”。" }
      - { type: j, text: "○正义曰：云“先进、後进，谓仕先後辈也”者，下章云“从我於陈、蔡者，皆" }
      - { type: j, text: "不及门也”，谓不及仕进之门，则此谓不从於陈、蔡得仕进者也。盖先进者，当" }
      - { type: j, text: "襄、昭之世。後进者，当定、哀之世。云“礼乐因世损益”者，《为政篇》云：" }
      - { type: j, text: "“殷因於夏礼，所损益可知也。周因於殷礼，所损益可知也。”又周初则礼乐盛，" }
      - { type: j, text: "周衰则礼乐衰，是礼乐因世损益也。云“後进与礼乐，俱得时之中，斯君子矣”" }
      - { type: j, text: "者，言礼乐随世盛衰，後进与时消息，皆中当於时，故为君子也。云“先进有古" }
      - { type: j, text: "风，斯野人也”者，言先辈仕进之人，比今则犹尚淳素，故云“斯野人也”。" }
      - { type: j, text: "子曰：“从我於陈、蔡者，皆不及门也。”（郑曰：“言弟子从我而厄於陈、" }
      - { type: j, text: "蔡者，皆不及仕进之门，而失其所。”）" }
      - { type: z, text: "“子曰：从我於陈、蔡者，皆不及门也”。○正义曰：此章孔子闵弟子" }
      - { type: j, text: "之失所。言弟子从我而厄於陈、蔡者，皆不及仕进之门，而失其所也。" }
      - { type: j, text: "德行：颜渊，闵子骞，冉伯牛，仲弓。言语：宰我，子贡。政事：冉有，季" }
      - { type: j, text: "路。文学：子游，子夏。" }
      - { type: z, text: "“德行：颜渊，闵子骞，冉伯牛，仲弓。言语：宰我，子贡。政事：冉" }
      - { type: j, text: "有，季路。文学：子游，子夏”。○正义曰：此章因前章言弟子失所，不及仕进，" }
      - { type: j, text: "遂举弟子之中，才德尢高可仕进之人。郑氏以合前章，皇氏别为一章。言若任用" }
      - { type: j, text: "德行，则有颜渊、闵子骞、冉伯牛、仲弓四人。若用其言语辨说，以为行人，使" }
      - { type: j, text: "四方，则有宰我、子贡二人。若治理政事，决断不疑，则有冉有、季路二人。" }
      - { type: j, text: "若文章博学，则有子游、子夏二人也。然夫子门徒三千，达者七十有二，而此四" }
      - { type: j, text: "科唯举十人者，但言其翘楚者耳。或时在陈言之，唯举从者。其不从者，虽有才" }
      - { type: j, text: "德，亦言不及也。" }
      - { type: j, text: "子曰：“回也，非助我者也，於吾言无所不说。”（孔曰：“助，益也。言" }
      - { type: j, text: "回闻言即解，无发起增益於已。”）" }
      - { type: z, text: "“子曰：回也，非助我者也，於吾言无所不说”。○正义曰：此章称颜" }
      - { type: j, text: "回之贤也。助，益也。说，解也。凡师资问答，以相发起。若与子夏论《诗》，" }
      - { type: j, text: "子曰：“起予者，商也。”如此是有益於已也。今回也，非增益於已者也，以其" }
      - { type: j, text: "於吾之所言，皆默而识之，无所不解。言回闻言即解，无所发起增益於已也。" }
      - { type: j, text: "子曰：“孝哉，闵子骞！人不间於其父母昆弟之言。”（陈曰：“言子骞上" }
      - { type: j, text: "事父母，下顺兄弟，动静尽善，故人不得有非间之言。”）" }
      - { type: z, text: "“子曰：孝哉，闵子骞！人不间於其父母昆弟之言。”正义曰：此章叹" }
      - { type: j, text: "美闵子骞之孝行也。昆，兄也。间，谓非毁间厕。言子骞上事父母，下顺兄弟，" }
      - { type: j, text: "动静尽善，故人不得有非间之言。”" }
      - { type: j, text: "南容三复白圭，（孔曰：“《诗》云：‘白圭之玷，尚可磨也。斯言之玷，" }
      - { type: j, text: "不可为也。’南容读《诗》至此，三反覆之，是其心慎言也。”）孔子以其兄之" }
      - { type: j, text: "子妻之。" }
      - { type: z, text: "“南容三复白圭，孔子以其兄之子妻之”。○正义曰：此章美南容慎言" }
      - { type: j, text: "也。复，覆也。《诗》云：“白圭之玷，尚可磨也。斯言之玷，不可为也。”南" }
      - { type: j, text: "容读《诗》至此，三反覆之，是其心慎言也。孔子知其贤，故以其兄之女子妻之。" }
      - { type: j, text: "此即“邦有道，不废；邦无道，免於刑戮者”也。弟子各记所闻，故又载之。○" }
      - { type: j, text: "注“《诗》云：白圭之玷，尚可磨也。斯言之玷，不可为也”。○正义曰：此" }
      - { type: j, text: "《大雅·抑篇》刺厉王之诗也。《毛传》云：“玷，缺也。”笺云：“斯，此也。" }
      - { type: j, text: "玉之缺，尚可磨钅虑而平，人君政教一失，谁能反覆之？”意言教令尢须谨慎。" }
      - { type: j, text: "白玉为圭，圭有损缺，犹尚可更磨钅虑而平，若此政教言语之有缺失，则遂往而" }
      - { type: j, text: "不可改。为王者，安危在於出令，故特宜慎之。是诗人戒其慎言。南容之心，亦" }
      - { type: j, text: "欲慎言，故三覆读此也。" }
      - { type: j, text: "季康子问：“弟子孰为好学？”孔子对曰：“有颜回者好学，不幸短命死矣。" }
      - { type: j, text: "今也则亡。”" }
      - { type: z, text: "“季康子问：弟子孰为好学？孔子对曰：有颜回者好学，不幸短命死矣。" }
      - { type: j, text: "今也则亡”。○正义曰：此章称颜回之好学也。季康子，鲁执政大夫，故言氏称" }
      - { type: j, text: "对。此与哀公问同而答异者，以哀公迁怒贰过，故因答以谏之。康子无之，故不" }
      - { type: j, text: "云也。" }
      - { type: j, text: "颜渊死，颜路请子之车以为之椁。（孔曰：“路，渊父也。家贫，欲请孔子" }
      - { type: j, text: "之车，卖以作椁。”）子曰：“才不才，亦各言其子也。鲤也死，有棺而无椁。" }
      - { type: j, text: "吾不徒行以为之椁。以吾从大夫之後，不可徒行也。”（孔曰：“鲤，孔子之子，" }
      - { type: j, text: "伯鱼也。孔子时为大夫，言从大夫之後，不可以徒行，谦辞也。”）" }
      - { type: z, text: "“颜渊死”至“徒行也”。○正义曰：此并三章记颜回死时孔子之语也。" }
      - { type: j, text: "“颜渊死，颜路请子之车以为之椁”者，路，颜渊父也。家贫，欲请孔子之车，" }
      - { type: j, text: "卖以作椁也。“子曰：才不才，亦各言其子也。鲤也死，有棺而无椁。吾不徒行" }
      - { type: j, text: "以为之椁”者，此举亲喻疏也。言渊才、鲤不才虽异，亦各言其子则同。我子鲤" }
      - { type: j, text: "也死时，但有棺，以家贫而无椁，吾不卖车以作椁。今女子死，安得卖我车以作" }
      - { type: j, text: "椁乎？“以吾从大夫之後，不可徒行也”者，此言不可卖车作椁之由。徒行，步" }
      - { type: j, text: "行也。以吾为大夫，不可徒行故也。孔子时为大夫，言从大夫之後者，谦辞也。" }
      - { type: j, text: "○注“孔曰”至“辞也”。○正义曰：云“鲤，孔子之子，伯鱼也”者，《世家》" }
      - { type: j, text: "文也。云“孔子时为大夫，言从大夫之後，不可以徒行，谦辞也”者，案《孔子" }
      - { type: j, text: "世家》：“定公十四年，孔子年五十六，由大司寇摄行相事。”鲁受齐女乐，不" }
      - { type: j, text: "听政三日，孔子遂卫。历至宋、郑、陈、蔡、晋、楚，去鲁凡十四岁而反乎鲁，" }
      - { type: j, text: "然鲁终不能用。孔子亦不求仕，以哀公十六年卒，年七十三。今案颜回少孔子三" }
      - { type: j, text: "十岁，三十二而卒，则颜回卒时，孔子年六十一，方在陈、蔡矣；伯鱼年五十，" }
      - { type: j, text: "先孔子死，则鲤也死时，孔子盖年七十左右，皆非在大夫位时。而此注云“时为" }
      - { type: j, text: "大夫”，未知有何所据也。杜预曰：“尝为大夫而去，故言後也。”据其年，则" }
      - { type: j, text: "颜回先伯鱼卒，而此云颜回死，颜路请子之车以为之椁，子曰“鲤也死，有棺而" }
      - { type: j, text: "无椁”，又似伯鱼先死者。王肃《家语》注云：“此书久远，年数错误，未可详" }
      - { type: j, text: "也。”或以为假设之辞也。徒犹空也，谓无车空行也，是步行谓之徒行，故《左" }
      - { type: j, text: "传》襄元年“败郑徒兵於洧上”，杜注云：“徒兵，步兵也。”" }
      - { type: j, text: "颜渊死。子曰：“噫！（包曰：“噫，痛伤之声。”）天丧予！天丧予！”" }
      - { type: j, text: "（天丧予者，若丧已也。再言之者，痛惜之甚。）" }
      - { type: z, text: "“颜渊死，子曰：噫！天丧予！天丧予！”○正义曰：噫，痛伤之声。" }
      - { type: j, text: "“天丧予”者，孔子痛惜颜渊死，言若天丧已也。再言之者，痛惜之甚。" }
      - { type: j, text: "颜渊死，子哭之恸。（马曰：“恸，哀过也。”）从者曰：“子恸矣！”曰：" }
      - { type: j, text: "“有恸乎？（孔曰：“不自知已之悲哀过。”）非夫人之为恸而谁为？”" }
      - { type: z, text: "“颜渊死”至“谁为”。○正义曰：“子哭之恸”者，恸，过哀也。言" }
      - { type: j, text: "夫子哭颜渊，其悲哀过甚。“从者曰：子恸矣”者，从者，众弟子。见夫子哀过，" }
      - { type: j, text: "故告曰：“子恸矣。”“曰：有恸乎”者，时夫子不自知已之悲哀过，故答曰：" }
      - { type: j, text: "有恸乎邪。“非夫人之为恸而谁为”者，因弟子言已悲哀过甚，遂说已之过哀亦" }
      - { type: j, text: "当於理，非失也。夫人，谓颜渊。言不於颜渊哭之为恸，而更於谁人为恸乎？" }
      - { type: j, text: "颜渊死，门人欲厚葬之。子曰：“不可。”（礼，贫富有宜。颜渊贫，而门" }
      - { type: j, text: "人欲厚葬之，故不听。）门人厚葬之。子曰：“回也视予犹父也，予不得视犹子" }
      - { type: j, text: "也。非我也，夫二三子也。”（马曰：“言回自有父，父意欲听门人厚葬，我不" }
      - { type: j, text: "得割止，非其厚葬，故云耳。”）" }
      - { type: z, text: "“颜渊”至“三子也”。○正义曰：“颜渊死，门人欲厚葬之”者，门" }
      - { type: j, text: "人，颜渊之弟子，以其师有贤行，故欲丰厚其礼以葬之也。“子曰：不可”者，" }
      - { type: j, text: "礼，贫富有宜。颜渊贫，而门人欲厚葬，故不听之，曰不可也。“门人厚葬之”" }
      - { type: j, text: "者，初咨孔子，孔子不听，门人故违孔子，而卒厚葬之也。“子曰：回也视予犹" }
      - { type: j, text: "父也”者，此下孔子非其厚葬之语也。言回也师事於已，视已犹如其父也。“予" }
      - { type: j, text: "不得视犹子也”者，言回自有父存，父意欲听门人厚葬，我不得割止之，故曰" }
      - { type: j, text: "“予不得视犹子也”。“非我也，夫二三子也”者，言厚葬之事，非我所为，夫" }
      - { type: j, text: "门人二三子为之也。非其厚葬，故云耳。" }
      - { type: j, text: "季路问事鬼神。子曰：“未能事人，焉能事鬼？”曰：“敢问死。”曰：" }
      - { type: j, text: "“未知生，焉知死？”（陈曰：“鬼神及死事难明，语之无益，故不答。”）" }
      - { type: z, text: "“季路”至“知死”。○正义曰：此章明孔子不道无益之语也。子路问" }
      - { type: j, text: "事鬼神者，对则天曰神，人曰鬼，散则虽人亦曰神，故下文独以鬼答之。子路问" }
      - { type: j, text: "承事神其理何如，“子曰未能事人，焉能事鬼”者，言生人尚未能事之，况死者" }
      - { type: j, text: "之鬼神，安能事之乎？“曰：敢问死”者，子路又曰：“敢问人之若死，其事何" }
      - { type: j, text: "如。”“曰：未知生，焉知死”者，孔子言女尚未知生时之事，则安知死後乎？" }
      - { type: j, text: "皆所以抑止子路也。以鬼神及死事难明，又语之无益，故不答也。" }
      - { type: j, text: "闵子侍侧，りり如也；子路，行行如也；冉有、子贡，侃侃如也。子乐。" }
      - { type: j, text: "（郑曰：“乐各尽其性。行行，刚强之貌。”）“若由也，不得其死然”。（孔" }
      - { type: j, text: "曰：“不得以寿终。”）" }
      - { type: z, text: "“闵子”至“死然”。○正义曰：此章孔子喜四弟子任其直性也。“闵" }
      - { type: j, text: "子侍侧，りり如也”者，卑在尊侧曰侍。りり，中正之貌。如也者，言其貌如此" }
      - { type: j, text: "也。“子路，行行如也”者，行行，刚强之貌。“冉有、子贡，侃侃如也”者，" }
      - { type: j, text: "侃侃，和乐之貌。“子乐”者，以四子各尽其自然之性，故喜乐也。“若由也，" }
      - { type: j, text: "不得其死然”者，然犹焉也。言子路以刚，必不得其以寿终焉。" }
      - { type: j, text: "鲁人为长府。闵子骞曰：“仍旧贯，如之何？何必改作？”（郑曰：“长府，" }
      - { type: j, text: "藏名也，藏财货曰府。仍，因也。贯，事也。因旧事则可也，何乃复更改作。”）" }
      - { type: j, text: "子曰：“夫人不言，言必有中。”（王曰：“言必有中者，善其不欲劳民改作。”）" }
      - { type: z, text: "“鲁人”至“有中”。○正义曰：此章重於劳民也。“鲁人为长府”者，" }
      - { type: j, text: "藏财货曰府。长，其藏名也。为，作也。言鲁人新改作之也。“闵子骞曰：仍旧" }
      - { type: j, text: "贯，如之何？何必改作”者，子骞见鲁人劳民改作长府，而为此辞。仍，因也。" }
      - { type: j, text: "贯，事也。言因旧事则亦可矣，何必乃复更改作也。“子曰：夫人不言，言必有" }
      - { type: j, text: "中”者，孔子闻子骞之言而善之也。夫人，谓子骞。言夫此人，其唯不言则已，" }
      - { type: j, text: "若其发言，必有中於理。此言何必改作，是中理之言也。善其不欲劳民，故以为" }
      - { type: j, text: "中。○注“郑曰”至“改作”。○正义曰：云“长府，藏名”者，言鲁藏财货之" }
      - { type: j, text: "府名长府也。云“藏财货曰府”者，布帛曰财，金玉曰货。《周礼·天官》有大" }
      - { type: j, text: "府为王治藏之长，玉府掌王之金玉玩好，内府主良货贿藏在内者，外府主泉藏在" }
      - { type: j, text: "外者，是藏财货曰府。府犹聚也，言财货之所聚也。“仍，因；贯，事”，皆" }
      - { type: j, text: "《释诂》文。" }
      - { type: j, text: "子曰：“由之瑟，奚为於丘之门？”（马曰：“子路鼓瑟，不合《雅》、" }
      - { type: j, text: "《颂》。”）门人不敬子路。子曰：“由也升堂矣，未入於室也。”（马曰：" }
      - { type: j, text: "“升我堂矣，未入於室耳。门人不解，谓孔子言为贱子路，故复解之。”）" }
      - { type: z, text: "“子曰”至“室也”。○正义曰：苏拢言子路之才学分限也。“子曰：" }
      - { type: j, text: "由之瑟，奚为於丘之门”者，由，子路名。奚，何也。子路性刚，鼓瑟不合《雅》、" }
      - { type: j, text: "《颂》，故孔子非之云：“由之鼓瑟，何为於丘之门乎？”所以抑其刚也。“门" }
      - { type: j, text: "人不敬子路”者，门人不解孔子之意，谓孔子言为贱子路，故不敬之也。“子曰：" }
      - { type: j, text: "由也升堂矣，未入於室也”者，以门人不解，故孔子复解之，言子路之学识深浅，" }
      - { type: j, text: "譬如自外入内，得其门者。入室为深，颜渊是也。升堂次之，子路是也。今子路" }
      - { type: j, text: "既升我堂矣，但未入於室耳，岂可不敬也？" }
      - { type: j, text: "子贡问：“师与商也孰贤？”子曰：“师也过，商也不及。”（孔曰：“言" }
      - { type: j, text: "俱不得中。”）曰：“然则师愈与？”子曰：“过犹不及。”（愈犹胜也。）" }
      - { type: z, text: "“子贡”至“犹不及”。○正义曰：此章明子张、子夏才性优劣。“子" }
      - { type: j, text: "贡问：师与商也孰贤”者，师，子张名。商，子夏名。孰，谁也。子贡问孔子曰：" }
      - { type: j, text: "“子张与子夏二人谁为贤才？”“子曰：师也过，商也不及”者，孔子答言：" }
      - { type: j, text: "“子张所为过当而不已，子夏则不及而止。”言俱不得中也。“曰：然则师愈与”" }
      - { type: j, text: "者，愈犹胜也。子贡未明夫子之旨，以为师也过则是贤才，过於子夏，故复问曰：" }
      - { type: j, text: "“然则子张胜於子夏与？”与为疑辞。“子曰：过犹不及”者，子贡不解，故复" }
      - { type: j, text: "解之，曰：“过当犹如不及。”俱不中理也。" }
      - { type: j, text: "季氏富於周公，（孔曰：“周公，天子之宰、卿士。”）而求也为之聚敛而" }
      - { type: j, text: "附益之。（孔曰：“冉求为季氏宰，为之急赋税。”）子曰：“非吾徒也。小子" }
      - { type: j, text: "鸣鼓而攻之，可也。”（郑曰：“小子，门人也。鸣鼓声其罪以责之。”）" }
      - { type: z, text: "“季氏”至“可也”。○正义曰：此章夫子责冉求重赋税也。“季氏富" }
      - { type: j, text: "於周公”者，季氏，鲁臣，诸侯之卿也。周公，天子之宰、卿士，鲁其後也。孔" }
      - { type: j, text: "子之时，季氏专执鲁政，尽征其民。其君蚕食深宫，赋税皆非已有，故季氏富於" }
      - { type: j, text: "周公也。“而求也为之聚敛而附益之”者，时冉求为季氏家宰，又为之急赋税，" }
      - { type: j, text: "聚敛财物而陪附助益季氏也。“子曰：非吾徒也，小子鸣鼓而攻之可也”者，小" }
      - { type: j, text: "子，门人也。冉求亦夫子门徒，当尚仁义。今为季氏聚敛，害於仁义，故夫子责" }
      - { type: j, text: "之曰：非我门徒也。使其门人鸣鼓以声其罪而攻责之，可也。○注“孔曰：周公，" }
      - { type: j, text: "天子之宰卿士”。○正义曰：何休云：“宰犹治也，三公之职号尊名也。”杜预" }
      - { type: j, text: "注《左传》曰：“卿士，王之执政者也。”" }
      - { type: j, text: "柴也愚，（弟子高柴，字子羔。愚，愚直之愚。）参也鲁，（孔曰：“鲁，" }
      - { type: j, text: "钝也。曾子性迟钝。”）师也辟，（马曰：“子张才过人，失在邪辟文过。”）" }
      - { type: j, text: "由也彦。（郑曰：“子路之行，失於畔彦。”）子曰：“回也，其庶乎！屡" }
      - { type: j, text: "空。赐不受命，而货殖焉，亿则屡中。”（言回庶几圣道，虽数空匮，而乐在其" }
      - { type: j, text: "中。赐不受教命，唯财货是殖，亿度是非。盖美回，所以励赐也。一曰：“屡犹" }
      - { type: j, text: "每也。空犹虚中也。以圣人之善道，教数子之庶几，犹不至於知道者，各内有此" }
      - { type: j, text: "害。其於庶几每能虚中者，唯回。怀道深远，不虚心，不能知道，子贡虽无数子" }
      - { type: j, text: "之病，然亦不知道者，虽不穷理而幸中，虽非天命而偶富，亦所以不虚心也。）" }
      - { type: z, text: "“柴也愚”至“屡中”。○正义曰：此章孔子历评六弟子之德行中失也。" }
      - { type: j, text: "“柴也愚”者，高柴性愚直也。“参也鲁”者，曾参性迟钝也。“师也辟”者，" }
      - { type: j, text: "子张才过人，失在邪辟文过也。“由也彦”者，子路之行失於畔彦也。“子" }
      - { type: j, text: "曰：回也，其庶乎！屡空。赐不受命，而货殖焉，亿则屡中”者，此盖孔子美颜" }
      - { type: j, text: "回，所以励赐也。其说有二：一曰：“屡，数也。空，匮也。亿，度也。言回庶" }
      - { type: j, text: "几圣道，虽数空匮贫窭，而乐在其中。是美回也。赐不受命，唯货财是殖，若亿" }
      - { type: j, text: "度是非则数中。言此所以勉励赐也”。一曰“屡犹每也。空犹虚中也。言孔子以" }
      - { type: j, text: "圣人之善道，教数子之庶几，犹不至於知道者，各内有此害故也。其於庶几每能" }
      - { type: j, text: "虚中者，唯有颜回怀道深远。若不虚心，不能知道也。子贡虽无数子之病，然亦" }
      - { type: j, text: "不知道者，虽不穷理而幸中，虽非天命而偶富，有此二累，亦所以不虚心也。○" }
      - { type: j, text: "注“弟子高柴，字子羔”。○正义曰：《史记·弟子传》云：“高柴，字子羔。”" }
      - { type: j, text: "郑玄曰：“卫人。”“少孔子三十岁”。《左传》亦作子羔，《家语》作子高，" }
      - { type: j, text: "《礼记》作子皋，三字不同，其实一也。○注“郑曰子路之行，失於畔彦”。" }
      - { type: j, text: "○正义曰：旧注作“反彦”，字书“反彦，失容也”。言子路性行刚强，" }
      - { type: j, text: "常反彦失於礼容也。今本反作畔。王弼云：“刚猛也。”○注“言回”至" }
      - { type: j, text: "“心也”。○正义曰：云“言回庶几圣道”者，《易·下系辞》云：“颜氏之子" }
      - { type: j, text: "其殆庶几乎？”是回庶慕几微之圣道。云“虽数空匮，而乐在其中”者，即“箪" }
      - { type: j, text: "食瓢饮，不改其乐”是也。云“赐不受教命”者，言不受夫子礼教之命。云“惟" }
      - { type: j, text: "财货是殖”者，言唯务使货财生殖蕃息也。云“亿度是非”者，言又用心亿度人" }
      - { type: j, text: "事之是非也。云“盖美回，所以励赐也”者，言孔子之意，美颜回贫而乐道，所" }
      - { type: j, text: "以劝励子贡，言汝既富矣，又能亿则屡中，何得不受教命乎？云“一曰”以下者，" }
      - { type: j, text: "何晏又为一说也。云“以圣人之善道，教数子之庶几”者，言孔子以圣人庶几之" }
      - { type: j, text: "善道，并教六子也。云“犹不至於知道者，各内有此害”者，言圣人不倦，并教" }
      - { type: j, text: "诲之，而犹尚不能至於知几微善道者，以其各自内有愚、鲁、辟、彦之病害故" }
      - { type: j, text: "也。云“其於庶几每能虚中，唯回”者，言唯颜回每能虚其中心，知於庶几之道" }
      - { type: j, text: "也。云“怀道深远，不虚心，不能知道”者，此解虚中之由，由其至道深远，若" }
      - { type: j, text: "不虚其中心，则不能知道也。云“子贡虽无数子之病”者，谓无愚、鲁、辟、" }
      - { type: j, text: "彦之病也。“然亦不知道”者，谓亦如四子不知圣道也。云“虽不穷理而幸中，" }
      - { type: j, text: "虽非天命而偶富，亦所以不虚心也”者，此解子贡不知道，由於有此二累也。虽" }
      - { type: j, text: "不穷理而幸中，释经“亿则屡中”，言虽不穷理尽性，但亿度之，幸中其言也。" }
      - { type: j, text: "《左传》“定十五年春，邾隐公来朝。子贡观焉。邾子执玉高，其容仰；公受玉" }
      - { type: j, text: "卑，其容俯。子贡曰：‘以礼观之，二君者皆有死亡焉。’夏五月壬申，公薨。" }
      - { type: j, text: "仲尼曰：‘赐不幸言而中。’”哀七年，“以邾子益来”，是其屡中也。“虽非" }
      - { type: j, text: "天命而偶富”，释经“不受命而货殖”也。言致富之道，当由天命与之爵禄，今" }
      - { type: j, text: "子贡不因天命爵禄，而能自致富，故曰“偶富”。言有亿度之劳，富有经营之累，" }
      - { type: j, text: "以此二事，何暇虚心以知道？故云“亦所以不虚心也”。" }
      - { type: j, text: "子张问善人之道。子曰：“不践迹，亦不入於室。”（孔曰：“践，循也。" }
      - { type: j, text: "言善人不但循追旧迹而已，亦少能创业，然亦不入於圣人之奥室。”）子曰：" }
      - { type: j, text: "“论笃是与，君子者乎？色庄者乎？（论笃者，谓口无择言。君子者，谓身无鄙" }
      - { type: j, text: "行。色庄者，不恶而严，以远小人。言此三者，皆可以为善人。）" }
      - { type: z, text: "“子张”至“者乎”。○正义曰：此章论善人所行之道也，“子张问善" }
      - { type: j, text: "人之道”者，问行何道可谓善人。“子曰：不践迹，亦不入於室”者，孔子答其" }
      - { type: j, text: "善人之道也。践，循也。迹，已行旧事之言。善人不但循追旧迹而已，当自立功" }
      - { type: j, text: "立事也，而善人好谦，亦少能创业，故亦不能入於圣人之奥室也。“子曰：论笃" }
      - { type: j, text: "是与，君子者乎？色庄者乎”者，此亦善人之道也，故同为一章，当是异时之语，" }
      - { type: j, text: "故别言“子曰”也。“论笃是与”者，笃，厚也。谓口无择言，所论说皆重厚，" }
      - { type: j, text: "是善人与。“君子者乎”者，言身无鄙行之君子，亦是善人乎？“色庄者乎”者，" }
      - { type: j, text: "言能颜色庄严，使小人畏威者，亦是善人乎？孔子谦，不正言，故云“与”、" }
      - { type: j, text: "“乎”以疑之也。○注“论笃”至“善人”。○正义曰：云“口无择言”，《孝" }
      - { type: j, text: "经》文也。所言皆善，故无可择也。云“身无鄙行”者，所以并美，无鄙恶也。" }
      - { type: j, text: "“以远小人，不恶而严”者，《周易·Т卦·象辞》也。" }
      - { type: j, text: "子路问：“闻斯行诸？”（包曰：“赈穷救乏之事。”）子曰：“有父兄在，" }
      - { type: j, text: "如之何其闻斯行之？”（孔曰：“当白父兄，不得自专。”）冉有问：“闻斯行" }
      - { type: j, text: "诸？”子曰：“闻斯行之。”公西华曰：“由也问闻斯行诸，子曰‘有父兄在’。" }
      - { type: j, text: "求也问闻斯行诸，子曰‘闻斯行之’。赤也惑，敢问。”（孔曰：“惑其问同而" }
      - { type: j, text: "答异。”）子曰：“求也退，故进之。由也兼人，故退之。”（郑曰：“言冉有" }
      - { type: j, text: "性谦退，子路务在胜尚人，各因其人之失而正之。”）" }
      - { type: z, text: "“子路”至“退之”。○正义曰：此章论施予之礼，并孔子问同答异之" }
      - { type: j, text: "意也。“子路问：闻斯行诸”者，诸，之也。子路问於孔子曰：“若闻人穷乏当" }
      - { type: j, text: "赈救之事於斯，即得行之乎？”“子曰：有父兄在，如之何其闻斯行之也”者，" }
      - { type: j, text: "言当先白父兄，不得自专也。“冉有问：闻斯行诸？子曰：闻斯行之”者，此问" }
      - { type: j, text: "与子路同，而所答异也。“公西华曰：由也问闻斯行诸，子曰有父兄在。求也问" }
      - { type: j, text: "闻斯行诸，子曰闻斯行之。赤也惑，敢问”者，赤，公西华名也。见其问同而答" }
      - { type: j, text: "异，故疑惑而问於孔子也。“子曰：求也退，故进之。由也兼人，故退之”者，" }
      - { type: j, text: "此孔子言其答异之意也。冉有性谦退，子路务在胜尚人，各因其人失而正之，故" }
      - { type: j, text: "答异也。" }
      - { type: j, text: "子畏於匡，颜渊後。（孔曰：“言与孔子相失，故在後。”）子曰：“吾以" }
      - { type: j, text: "女为死矣。”曰：“子在，回何敢死？”（包曰：“言夫子在，已无所敢死。”）" }
      - { type: z, text: "“子畏”至“敢死”。○正义曰：此章言仁者必有勇也。“子畏於匡，" }
      - { type: j, text: "颜渊後”者，言孔子畏於匡时，与颜回相失。既免，而回在後，方至也。“子曰：" }
      - { type: j, text: "吾以女为死矣”者，孔子谓颜渊曰：“吾以女为致死与匡人斗也。”“子在，回" }
      - { type: j, text: "何敢死”者，言夫子若陷於危难，则回必致死。今夫子在，已则无所敢死。言不" }
      - { type: j, text: "敢致死也。" }
      - { type: j, text: "季子然问：“仲由、冉求可谓大臣与？”（孔曰：“子然，季氏子弟。自多" }
      - { type: j, text: "得臣此二子，故问之。”）子曰：“吾以子为异之问，曾由与求之问。（孔曰：" }
      - { type: j, text: "“谓子问异事耳。则此二人之问，安足大乎？”）所谓大臣者，以道事君，不可" }
      - { type: j, text: "则止。今由与求也，可谓具臣矣。”（孔曰：“言备臣数而已。”）曰：“然则" }
      - { type: j, text: "从之者与？”（孔曰：“问为臣皆当从君所欲邪？”）子曰：“弑父与君，亦不" }
      - { type: j, text: "从也。”（孔曰：“言二子虽从其主，亦不与为大逆。”）" }
      - { type: z, text: "“季子”至“从也”。○正义曰：此章明为臣事君之道。“季子然问：" }
      - { type: j, text: "仲由、冉求可谓大臣与”者，季子然，季氏之子弟也。自多得臣此二子，故问於" }
      - { type: j, text: "夫子曰：“仲由、冉求才能为政，可以谓之大臣与？”疑而未定，故云“与”也。" }
      - { type: j, text: "“子曰：吾以子为异之问，曾由与求之问”者，此孔子抑其自多也。曾，则也。" }
      - { type: j, text: "吾以子为问异事耳，则此二人之问，安足多大乎？言所问小也。“所谓大臣者，" }
      - { type: j, text: "以道事君，不可则止”者，此孔子更为子然陈说大臣之体也。言所可谓之大臣者，" }
      - { type: j, text: "以正道事君，君若不用已道，则当退止也。“今由与求也，可谓具臣矣”者，既" }
      - { type: j, text: "陈大臣之体，乃言二子非大臣也。具，备也。今二子臣於季氏，季氏不道而不能" }
      - { type: j, text: "匡救，又不退止，唯可谓备臣数而已，不可谓之大臣也。“曰：然则从之者与”" }
      - { type: j, text: "者，子然既闻孔子言二子非大臣，故又问曰：然则二子为臣，皆当从君所欲邪？" }
      - { type: j, text: "“子曰：弑父与君，亦不从也”者，孔子更为说二子之行，言二子虽从其主，若" }
      - { type: j, text: "其主弑父与君，为此大逆，亦不与也。" }
      - { type: j, text: "子路使子羔为费宰。子曰：“贼夫人之子。”（包曰：“子羔学未熟习，而" }
      - { type: j, text: "使为政，所以为贼害。”）子路曰：“有民人焉，有社稷焉，何必读书，然後为" }
      - { type: j, text: "学？”（孔曰：“言治民事神，於是而习之，亦学也。”）子曰：“是故恶夫佞" }
      - { type: j, text: "者。”（孔曰：“疾其以口给应，遂已非而不知穷。”）" }
      - { type: z, text: "“子路”至“佞者”。○正义曰：此章勉人学也。“子路使子羔为费宰”" }
      - { type: j, text: "者，子路臣季氏，故任举子羔，使为季氏费邑宰也。“子曰：贼夫人之子”者，" }
      - { type: j, text: "贼，害也。夫人之子，指子羔也。孔子之意以为，子羔学未熟习，而使为政，必" }
      - { type: j, text: "累其身，所以为贼害也。“子路曰：有民人焉，有社稷焉，何必读书，然後为学”" }
      - { type: j, text: "者，子路辩答孔子，言费邑有人民焉而治之，有社稷之神焉而事之，治民事神，" }
      - { type: j, text: "於是而习之，是亦学也。何必须读书然後乃谓为学也。“子曰：是故恶夫佞”者，" }
      - { type: j, text: "言人所以憎恶夫佞者，为口才捷给，文过饰非故也。今子路以口给应，遂已非" }
      - { type: j, text: "而不知穷已，是故致人恶夫佞者也。" }
      - { type: j, text: "子路、曾皙、（孔曰：“皙，曾参父，名点。”）冉有、公西华侍坐。子曰：" }
      - { type: j, text: "“以吾一日长乎尔，毋吾以也。（孔曰：“言我问女，女无以我长故难对。”）" }
      - { type: j, text: "居则曰：‘不吾知也。’（孔曰：“女常居云人不知己。”）如或知尔，则何以" }
      - { type: j, text: "哉？”（孔曰：“如有用女者，则何以为治。”）子路率尔而对，（率尔，先三" }
      - { type: j, text: "人对。）曰：“千乘之国，摄乎大国之间，加之以师旅，因之以饥馑，（包曰：" }
      - { type: j, text: "“摄，迫也。迫於大国之间。”）由也为之，比及三年，可使有勇，且知方也。”" }
      - { type: j, text: "（方，义方。）夫子哂之。（马曰：“哂，笑。”）“求，尔何如？”对曰：" }
      - { type: j, text: "“方六七十，如五六十，（求性谦退，言欲得方六七十、如五六十里小国治之而" }
      - { type: j, text: "已。）求也为之，比及三年，可使足民。如其礼乐，以俟君子。”（孔曰：“求" }
      - { type: j, text: "自云能足民而已。谓衣食足也。若礼乐之化，当以待君子。谦也。”）“赤，尔" }
      - { type: j, text: "何如？”对曰：“非曰能之，原学焉。宗庙之事，如会同，端章甫，原为小相焉。”" }
      - { type: j, text: "（郑曰：“我非自言能，原学为之。宗庙之事，谓祭祀也。诸侯时见曰会。殷ぽ" }
      - { type: j, text: "曰同。端，玄端也。衣玄端，冠章甫，诸侯日视朝之服。小相，谓相君之礼。”）" }
      - { type: j, text: "“点，尔何如？”鼓瑟希，（孔曰：“思所以对，故音希。”）铿尔，舍瑟而作，" }
      - { type: j, text: "对曰：“异乎三子者之撰。”（孔曰：“置瑟起对。撰，具也，为政之具。铿者，" }
      - { type: j, text: "投瑟之声。”）子曰：“何伤乎？亦各言其志也。”（孔曰：“各言己志，於义" }
      - { type: j, text: "无伤。”）曰：“莫春者，春服既成，冠者五六人，童子六七人，浴乎沂，风乎" }
      - { type: j, text: "舞雩，咏而归。”（包曰：“莫春者，季春三月也。春服既成，衣单袷之时。我" }
      - { type: j, text: "欲得冠者五六人，童子六七人，浴乎沂水之上，风凉於舞雩之下，歌咏先王之道，" }
      - { type: j, text: "而归夫子之门。”）夫子喟然叹曰：“吾与点也！”（周曰：“善点独知时。”）" }
      - { type: j, text: "三子者出，曾皙後。曾皙曰：“夫三子者之言何如？”子曰：“亦各言其志也已" }
      - { type: j, text: "矣。”曰：“夫子何哂由也？”曰：“为国以礼，其言不让，是故哂之。”（包" }
      - { type: j, text: "曰：“为国以礼，礼贵让，子路言不让，故笑之。”）“唯求则非邦也与？”" }
      - { type: j, text: "“安见方六七十如五六十而非邦也者？”“唯赤则非邦也与？”“宗庙会同，非" }
      - { type: j, text: "诸侯而何？（孔曰：“明皆诸侯之事，与子路同，徒笑子路不让。”）赤也为之" }
      - { type: j, text: "小，孰能为之大？”（孔曰：“赤谦言小相耳，谁能为大相？”）" }
      - { type: z, text: "“子路”至篇末。○正义曰：此章孔子乘间四弟子侍坐，因使各言其志，" }
      - { type: j, text: "以观其器能也。“子路、曾皙、冉有、公西华侍坐”者，时孔子坐，四子侍侧，" }
      - { type: j, text: "亦皆坐也。“子曰：以吾一日长乎尔，毋吾以也”者，孔子将发问，先以此言诱" }
      - { type: j, text: "掖之也。言女等侍吾，以吾年长於女，谦而少言，故云一日。今我问女，女等毋" }
      - { type: j, text: "以吾长而惮难其对也。“居则曰：不吾知也。如或知尔，则何以哉”者，此问辞" }
      - { type: j, text: "也。言女常居则云已有才能，人不我知。设如有人知女，将欲用之，则女将何以" }
      - { type: j, text: "为治？“子路率尔而对”者，子路性刚，故率尔先三人而对也。“千乘之国，摄" }
      - { type: j, text: "乎大国之间，加之以师旅，因之以饥馑，由也为之，比及三年，可使有勇，且知" }
      - { type: j, text: "方也”者，此子路所志也。千乘之国，公侯之六国也。摄，迫也。不熟为饥，" }
      - { type: j, text: "蔬不熟为馑。方，义方也。言若有公侯之国，迫於大国之间，又加之以师旅侵伐，" }
      - { type: j, text: "复因之以饥馑民困，而由也治之，比至三年以来，可使其民有勇敢且知义方也。" }
      - { type: j, text: "“夫子哂之”者，哂，笑也。夫子笑之也。“求，尔何如”者，子路既对，三子" }
      - { type: j, text: "无言，故孔子复历问之。冉求，尔志何如？“对曰：方六七十，如五六十，求也" }
      - { type: j, text: "为之，比及三年，可使足民。如其礼乐，以俟君子”者，此冉求之志也。俟，待" }
      - { type: j, text: "也。求性谦退，言欲得方六七十如五十里小国治之而已。求也治此小国，比及三" }
      - { type: j, text: "年以来，使足民衣食。若礼乐之化，当以待君子。此谦辞也。“赤，尔何如”者，" }
      - { type: j, text: "又问公西华也。“对曰，非曰能之，原学焉。宗庙之事，如会同，端章甫，原为" }
      - { type: j, text: "小相焉”者，此赤也之志也。曰，言也。我非自言能之，原学为焉。宗庙祭祀之" }
      - { type: j, text: "事，如有诸侯会同，及诸侯衣玄端，冠章甫，日视朝之时，已原为其小相君之礼" }
      - { type: j, text: "焉。“点，尔何如”者，又问曾皙也。“鼓瑟希”者，时曾皙方鼓瑟，承师之问，" }
      - { type: j, text: "思所以对，故音希也。“铿尔，舍瑟而作”者，作，起也。舍，置也。铿，投瑟" }
      - { type: j, text: "声也。思得其对，故置瑟起对，投置其瑟而声铿然也。“对曰：异乎三子者之撰”" }
      - { type: j, text: "者，撰，具也。未敢言其志，先对此辞，言已之所志，异乎三子者所陈为政之具" }
      - { type: j, text: "也。“子曰：何伤乎？亦各言其志也”者，孔子见曾皙持谦，难其对，故以此言" }
      - { type: j, text: "诱之曰，於义何伤乎？亦各言其志也。欲令任其所志而言也。“曰：莫春者，春" }
      - { type: j, text: "服既成，冠者五六人，童子六七人，浴乎沂，风乎舞雩，咏而归”者，此曾点所" }
      - { type: j, text: "志也。莫春，季春也。春服既成，衣单袷之时也。我欲得与二十以上冠者五六人，" }
      - { type: j, text: "十九以下童子六七人，浴乎沂水之上，风凉於舞雩之下，歌咏先王之道，而归夫" }
      - { type: j, text: "子之门也。“夫子喟然叹曰：吾与点也”者，喟然，叹之貌。夫子闻其乐道，故" }
      - { type: j, text: "喟然而叹曰：吾与点之志。善其独知时，而不求为政也。“三子者出，曾皙後”" }
      - { type: j, text: "者，子路、冉有、公西华三子先出，曾皙後，犹侍坐於夫子也。“曾皙曰：夫三" }
      - { type: j, text: "子者之言何如”者，曾皙在後，问於夫子曰：“夫三子者各言其志，其言是非" }
      - { type: j, text: "何如也？”“子曰：亦各言其志也已矣”者，言三子亦各言其所志而已，无他别" }
      - { type: j, text: "是非也。“曰：夫子何哂由也”者，曾皙又问夫子曰：既三子各言其志，何独笑" }
      - { type: j, text: "仲由也？“曰：为国以礼，其言不让，是故哂之”者，此夫子为说哂之意，言为" }
      - { type: j, text: "国以礼，礼贵谦让，子路言不让，故笑之也。“唯求也则非邦也与？安见方六七" }
      - { type: j, text: "十如五六十而非邦也者，唯赤则非邦也与？宗庙会同，非诸侯而何”者，此夫子" }
      - { type: j, text: "又言不哂其子路欲为诸侯之事，故举三子所言，明皆诸侯之事，与子路同，其言" }
      - { type: j, text: "让，故不笑之，徒笑其子路不让耳。“赤也为之小，孰能为之大”者，此夫子又" }
      - { type: j, text: "言，公西华之才堪为大相，今赤谦言小相耳。若赤也为之小相，更谁能为大相？" }
      - { type: j, text: "○注“孔曰：皙，曾参父，名点”。○正义曰：《史记·弟子传》曰：“曾╀" }
      - { type: j, text: "（音点），字皙”是也。○注“方，义方”。○正义曰：义，宜也。方，道也。" }
      - { type: j, text: "言能教之使知合宜之道也。《左传》曰：“爱子教之以义方。”○注“郑曰”至" }
      - { type: j, text: "“之礼”。○正义曰：云“宗庙之事，谓祭祀也”者，谓礻龠、祠、、尝及追" }
      - { type: j, text: "享、朝享、、之类皆是也。云“诸侯时见曰会。殷ぽ曰同”者，《周礼·春" }
      - { type: j, text: "官·大宗伯职》文，但彼作殷见，此作殷ぽ，ぽ则见也。郑玄注云：“此礼以诸" }
      - { type: j, text: "侯见王为文。”时见者，言无常期。诸侯有不顺服者，王将有征讨之事。则既朝" }
      - { type: j, text: "觐，王为坛於国外，合诸侯南命事焉。《春秋传》曰“有事而会，不协而盟”是" }
      - { type: j, text: "也。殷犹众也。十二岁，王始不巡守，则六服尽朝。朝礼既毕，王亦为坛，合诸" }
      - { type: j, text: "侯以命政焉。所命之政，如王巡守殷见，四方四时分来，终岁则遍，是也。云" }
      - { type: j, text: "“端，玄端也。衣玄端，冠章甫，诸侯日视朝之服”者，其衣正幅染之玄色，故" }
      - { type: j, text: "曰玄端。案《王制》云：“周人玄衣而养老。”注云：“玄衣，素裳。”天子之" }
      - { type: j, text: "燕服，为诸侯朝服。彼云玄衣，则此玄端也。若以素为裳，即是朝服。此朝服素" }
      - { type: j, text: "裳皆得谓之玄端，故此注云“端，玄端”，诸侯朝服。若上士以玄为裳，中士以" }
      - { type: j, text: "黄为裳，下士以杂色为裳，天子、诸侯以朱为裳，则皆谓之玄端，不得名为朝服" }
      - { type: j, text: "也。云“小相，谓相君之礼”者，案《周礼·秋官·司仪职》云：“掌九仪之宾" }
      - { type: j, text: "客摈相之礼，以诏仪容辞令揖让之节。”注云：“出接宾曰摈，入礼曰相。”" }
      - { type: j, text: "又曰：“凡诸公相为宾。及将币交摈，三辞，车逆拜辱，宾车进答拜，三揖三让，" }
      - { type: j, text: "每门止一相。”注曰：“相为主君摈者及宾之介也。谓之相者，於外传辞耳，入" }
      - { type: j, text: "门当以礼诏侑也。介绍而传命者，君子於其所尊不敢质，敬之至也。每门上一相，" }
      - { type: j, text: "弥相亲也。”是相谓相君之礼也。《聘礼》云：“卿为上摈，大夫为承摈，士为" }
      - { type: j, text: "绍摈。”《玉藻》曰：“君入门，介拂，大夫中枨与之间，上介拂枨。”则" }
      - { type: j, text: "卿为上介，大夫为次介，士为末介也。此云原为小相者，谦，不敢为上摈上介之" }
      - { type: j, text: "卿，原为承摈绍摈次介末介之大夫士耳。○注“包曰”至“之门”。○正义曰：" }
      - { type: j, text: "云“我欲得冠者五六人，童子六七人”者，意在取其朋友十馀人耳。云：“浴于" }
      - { type: j, text: "沂水之上，风凉於舞雩之下”者，杜预云“鲁城南自有沂水”，此是也。夫沂水" }
      - { type: j, text: "出盖县，南至下邳入泗。雩者，祈雨之祭名。《左传》曰“龙见而雩”是也。郑" }
      - { type: j, text: "玄曰：“雩者，吁也，吁嗟而请雨也。”杜预曰：“雩之言远也，远为百祈膏" }
      - { type: j, text: "雨也。使童男女舞之。”《春官·女巫职》曰：“旱则舞雩。”因谓其处为" }
      - { type: j, text: "舞雩。舞雩之处有坛单树木，可以休息，故云“风凉於舞雩之下”也。○注" }
      - { type: j, text: "“周曰：善点独知时”。○正义曰：仲尼祖述尧、舜，宪章文武，生值乱时而君" }
      - { type: j, text: "不用。三子不能相时，志在为政。唯曾皙独能知时，志在澡身浴德，咏怀乐道，" }
      - { type: j, text: "故夫子与之也。" }
