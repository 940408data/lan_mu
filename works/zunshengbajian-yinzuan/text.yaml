sections:
  - id: yinzuan
    name: 飲饌服食箋
    blocks:
      - type: j
        text: 飲饌服食箋
      - type: z
        text: 導：此箋論飲食服食之方，以淡薄為尚，勿令生我者害我。薦語：飲食活人之本、務尚淡薄。
      - type: j
        text: 高子曰：飲食，活人之本也。是以一身之中，陰陽運行，五行相生，莫不由於飲食。
      - type: z
        text: 讀：以飲食為活人之本，陰陽五行皆繫於日用三餐——養生之學不離人倫日用。
      - type: j
        text: 人於日用養生，務尚淡薄，勿令生我者害我，俾五味得為五內賊，是得養生之道矣。
      - type: z
        text: 讀：「勿令生我者害我」是警鐘：五味養人，過則為賊。務尚淡薄，乃此箋之正道。
