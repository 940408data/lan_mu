# 論語注疏卷7（邢昺疏）：j 為經文＋魏何晏集解，z 為疏文。
sections:
  - id: juan7
    name: 正文
    blocks:
      - { type: z, text: "正义曰：此篇皆明孔子之志行也，以前篇论贤人君子及仁者之德行，成" }
      - { type: j, text: "德有渐，故以圣人次之。" }
      - { type: j, text: "子曰：“述而不作，信而好古，窃比於我老彭。”（包曰：“老彭，殷贤大" }
      - { type: j, text: "夫，好述古事。我若老彭，但述之耳。”）" }
      - { type: z, text: "“子曰：述而不作，信而好古，窃比於我老彭。”○正义曰：此章记仲" }
      - { type: j, text: "尼著述之谦也。作者之谓圣，述者之谓明。老彭，殷贤大夫也。老彭於时，但述" }
      - { type: j, text: "先王之道而不自制作，笃信而好古事。孔子言，今我亦尔，故云比老彭。犹不" }
      - { type: j, text: "敢显言，故云窃。○注“包曰”至“之耳”。○正义曰：云，“老彭，殷贤大夫”" }
      - { type: j, text: "者，老彭即《庄子》所谓彭祖也。李云：“名铿，尧臣，封於彭城。历虞、夏至" }
      - { type: j, text: "商，年七百岁，故以久寿见闻。”《世本》云：“姓{饯}名铿，在商为守藏史，" }
      - { type: j, text: "在周为柱下史，年八百岁。{饯}音翦。一云即老子也。”崔云：“尧臣，仕殷" }
      - { type: j, text: "世。其人甫寿七百年。”王弼云：“老是老聃，彭是彭祖。老子者，楚苦县厉乡" }
      - { type: j, text: "曲仁里人也，姓李氏，名耳，字伯阳，谥曰聃，周守藏室之史也。”云“好述古" }
      - { type: j, text: "事。我若老彭，但述之耳”者，言老彭不自制作，好述古事。仲尼言，我亦若老" }
      - { type: j, text: "彭，但述之耳。" }
      - { type: j, text: "子曰：“默而识之，学而不厌，诲人不倦，何有於我哉。”（郑曰：“无是" }
      - { type: j, text: "行。於我，我独有之。”）" }
      - { type: z, text: "“子曰：默而识之，学而不厌，诲人不倦，何有於我哉？”○正义曰：" }
      - { type: j, text: "此章仲尼言已不言而记识之，学古而心不厌，教诲於人不有倦息。他人无是行。" }
      - { type: j, text: "於我，我独有之。故曰“何有於我哉”。" }
      - { type: j, text: "子曰：“德之不，学之不讲，闻义不能徙，不善不能改，是吾忧也。”" }
      - { type: j, text: "（孔曰：“夫子常以此四者为忧。”）" }
      - { type: z, text: "“子曰：德之不，学之不讲，闻义不能徙，不善不能改，是吾忧也”。" }
      - { type: j, text: "○正义曰：此章言孔子忧在身也。德在行，学须讲习，闻义事当徙意从之，" }
      - { type: j, text: "有不善当追悔改之。夫子常以此四者为忧，忧已恐有不、不讲、不徙、不改之" }
      - { type: j, text: "事。故云“是吾忧也”。" }
      - { type: j, text: "子之燕居，申申如也，夭夭如也。（马曰：“申申、夭夭，和舒之貌。”）" }
      - { type: z, text: "“子之燕居，申申如也，夭夭如也”。○正义曰：此章言孔子燕居之时" }
      - { type: j, text: "体貌也。申申、夭夭，和舒之貌。如者，如此义也，谓体貌和舒，如似申申、夭" }
      - { type: j, text: "夭也。故《玉藻》云：“受一爵而色洒如也。”及《乡党》每云“如也”者，皆" }
      - { type: j, text: "谓容色如此。" }
      - { type: j, text: "子曰：“甚矣，吾衰也！久矣，吾不复梦见周公。”（孔曰：“孔子衰老，" }
      - { type: j, text: "不复梦见周公。明盛时梦见周公，欲行其道也。”）" }
      - { type: z, text: "“子曰：甚矣，吾衰也久矣！吾不复梦见周公。”○正义曰：此章孔子" }
      - { type: j, text: "叹其衰老，言我盛时尝梦见周公，欲行其道，今则久多时矣，吾更不复梦见周公，" }
      - { type: j, text: "知是吾衰老甚矣。" }
      - { type: j, text: "子曰：“志於道，（志，慕也。道不可体，故志之而已。）据於德，（据，" }
      - { type: j, text: "杖也。德有成形，故可据。）依於仁，（依，倚也。仁者功施於人，故可倚。）" }
      - { type: j, text: "游於艺。”（艺，六艺也，不足据依，故曰游。）" }
      - { type: z, text: "“子曰：志於道，据於德，依於仁，游於艺。”○正义曰：此章孔子言" }
      - { type: j, text: "已志慕、据杖、依倚、游习者，道德仁艺也。○注“志，慕也。道不可体，故志" }
      - { type: j, text: "之而已”。○正义曰：道者，虚通无拥，自然之谓也。王弼曰：“道者，无之称" }
      - { type: j, text: "也，无不通也，无不由也。况之曰，道寂然无体，不可为象。”是道不可体，故" }
      - { type: j, text: "但志慕而已。○注“据，杖也。德有成形故可据”。○正义曰：德者，得也。物" }
      - { type: j, text: "得其所谓之德，寂然至无则谓之道，离无入有而成形器是谓德业。《少仪》云：" }
      - { type: j, text: "“士依於德，游於艺。”文与此类。郑注云：“德，三德也，一曰至德，二曰敏" }
      - { type: j, text: "德，三曰孝德。”《周礼·师氏》：“掌以三德教国子，一曰至德，以道为本；" }
      - { type: j, text: "二曰敏德，以行为本；三曰孝德，以知逆恶。”注云：“德行，内外之称，在心" }
      - { type: j, text: "为德，施之为行。至德，中和之德，覆帱持载，含容者也。孔子曰：‘中庸之" }
      - { type: j, text: "为德也，其至矣乎！’敏德，仁义顺时者也。《说命》曰：“敬孙务时敏，厥修" }
      - { type: j, text: "乃来。’孝德，尊祖爱亲，守其所以生者也。孔子曰：‘武王、周公，其达孝矣" }
      - { type: j, text: "乎！’夫孝者，善继人之志，善述人之事者也。”是德有成形者也。夫立身行道，" }
      - { type: j, text: "唯杖於德，故可据也。○注“依，倚也。仁者功施於人，故可倚”。○正义曰：" }
      - { type: j, text: "博施於民而能济众，乃谓之仁。恩被於物，物亦应之，故可倚赖。○注“艺，六" }
      - { type: j, text: "艺也，不足据依，故曰游”。○正义曰：六艺谓礼、乐、射、驭、书、数也。" }
      - { type: j, text: "《周礼·保氏》云：“掌养国子，教之六艺，一曰五礼，二曰六乐，三曰五射，" }
      - { type: j, text: "四曰五驭，五曰六书，六曰九数。”注云：“五礼：吉、凶、军、宾、嘉也。六" }
      - { type: j, text: "乐：《云门》、《大咸》、《大韶》、《大夏》、《大》、《大武》也。五射：" }
      - { type: j, text: "白矢、参连、剡注、襄尺、井仪也。五驭：鸣和鸾、逐水曲、过君表、舞交衢、" }
      - { type: j, text: "逐禽左也。六书：象形、会意、转注、指事、假借、谐声也。九数：方田、粟米、" }
      - { type: j, text: "差分、少广、商功、均轮、方程、赢不足、旁要也。”此六者，所以饰身耳，劣" }
      - { type: j, text: "於道德与仁，故不足依据，故但曰游。" }
      - { type: j, text: "子曰：“自行束以上，吾未尝无诲焉。”（孔曰：“言人能奉礼，自行束" }
      - { type: j, text: "以上，则皆教诲之。”）" }
      - { type: z, text: "“子曰：自行束以上，吾未尝无诲焉”。○正义曰：此章言已诲人不" }
      - { type: j, text: "倦也。束，礼之薄者。言人能奉礼，自行束以上而来学者，则吾未曾不诲焉，" }
      - { type: j, text: "皆教诲之也。○注“孔曰”至“诲之”。○正义曰：云“言人能奉礼，自行束" }
      - { type: j, text: "以上”者，案书传言束者多矣，皆谓十廷脯也。《檀弓》曰：“古之大夫束" }
      - { type: j, text: "之问不出竟。”《少仪》曰：“其以乘壶酒束一犬赐人。”《梁传》曰：" }
      - { type: j, text: "“束之问不行竟中。”是知古者持束以为礼。然此是礼之薄者，其厚则有玉" }
      - { type: j, text: "帛之属，故云“以上”以包之也。" }
      - { type: j, text: "子曰：“不愤不启，不悱不发，举一隅不以三隅反，则不复也。”（郑曰：" }
      - { type: j, text: "“孔子与人言，必待其人心愤愤，口悱悱，乃後启发为说之，如此则识思之深也。" }
      - { type: j, text: "说则举一隅以语之，其人不思其类，则不复重教之。”）" }
      - { type: z, text: "“子曰：不愤不启，不悱不发，举一隅不以三隅反，则不复也”。○正" }
      - { type: j, text: "义曰：此章言诲人之法。启，开也。言人若不心愤愤，则孔子不为开说；若不口" }
      - { type: j, text: "悱悱，则孔子不为发明。必待其人心愤愤，口悱悱，乃後启发为说之，如此则识" }
      - { type: j, text: "思之深也。其说之也，略举一隅以语之。凡物有四隅者，举一则三隅从可知，学" }
      - { type: j, text: "者当以三隅反类一隅以思之。而其人若不以三隅反思其类，则不复重教之矣。" }
      - { type: j, text: "子食於有丧者之侧，未尝饱也。（丧者哀，饱食於其侧，是无恻隐之心。）" }
      - { type: z, text: "“子食於有丧者之侧，未尝饱也”。○正义曰：此章言孔子助丧家执事" }
      - { type: j, text: "时，故得有食。饥而废事，非礼也。饱而忘哀，亦非礼。故食而不饱，以丧者哀" }
      - { type: j, text: "戚，若饱食於其侧，是无恻怆隐痛之心也。" }
      - { type: j, text: "子於是日哭，则不歌。（一日之中，或哭或歌，是亵於礼容。）" }
      - { type: z, text: "“子於是日哭，则不歌”。○正义曰：此章言孔子於是日闻丧或吊人而" }
      - { type: j, text: "哭，则终是日不歌也。若一日之中，或哭或歌，是亵渎於礼容，故不为也。《檀" }
      - { type: j, text: "弓》曰：“吊於人，是日不乐。”注引此文是也。" }
      - { type: j, text: "子谓颜渊曰：“用之则行，舍之则藏，唯我与尔有是夫！”（孔曰：“言可" }
      - { type: j, text: "行则行，可止则止，唯我与颜渊同。”）子路曰：“子行三军则谁与？”（孔曰：" }
      - { type: j, text: "“大国三军。子路见孔子独美颜渊，以为已勇，至於夫子为三军将，亦当谁与已" }
      - { type: j, text: "同，故发此问。”）子曰：“暴虎冯河，死而无悔者，吾不与也。（孔曰：“暴" }
      - { type: j, text: "虎，徒搏。冯河，徒涉。”）必也，临事而惧，好谋而成者也。" }
      - { type: z, text: "“子谓”至“者也”。○正义曰：此章孔子言已行藏与颜回同也。“子" }
      - { type: j, text: "谓颜渊曰：用之则行，舍之则藏，唯我与尔有是夫”者，言时用之则行，舍之则" }
      - { type: j, text: "藏，用舍随时，行藏不忤於物，唯我与汝同有是行夫。“子路曰：子行三军则谁" }
      - { type: j, text: "与”者，大国三军，子路见孔子独美颜渊，以已有勇，故发此问曰：“若子行三" }
      - { type: j, text: "军之事，为三军之将，则当谁与同？”子路意其与已也。“子曰：暴虎冯河，死" }
      - { type: j, text: "而无悔者，吾不与也”者，空手搏虎为暴虎，无舟渡河为冯河，言人若暴虎冯河，" }
      - { type: j, text: "轻死而不追悔者，吾不与之同也。子路之勇若此，故孔子抑之也。“必也临事而" }
      - { type: j, text: "惧，好谋而成者也”者，此又言行三军所与之人，必须临事而能戒惧，好谋而有" }
      - { type: j, text: "成功者，吾则与之行三军之事也，所以诱子路使慎其勇也。○注“孔曰：大国三" }
      - { type: j, text: "军”。○正义曰：此《司马·序官》文也。○注“孔曰：暴虎，徒搏。冯河，徒" }
      - { type: j, text: "涉”。○正义曰：《释训》文也。舍人曰：“无兵空手搏之。”郭璞曰：“空手" }
      - { type: j, text: "执也。”李巡曰：“无舟而渡水曰徒涉。”郭璞曰：“无舟楫。”《诗传》云：" }
      - { type: j, text: "“冯，陵也。”然则空涉水陵波而渡，故训冯为陵也。" }
      - { type: j, text: "子曰：“富而可求也，虽执鞭之士，吾亦为之。（郑曰：“富贵不可求而得" }
      - { type: j, text: "之，当修德以得之。若於道可求者，虽执鞭之贱职，我亦为之。”）如不可求，" }
      - { type: j, text: "从吾所好。”（孔曰：“所好者，古人之道。”）" }
      - { type: z, text: "“子曰：富而可求也，虽执鞭之士，吾亦为之。如不可求，从吾所好。”" }
      - { type: j, text: "○正义曰：此章孔子言已德好道，不谄求富贵也。言富贵不可求而得之，当" }
      - { type: j, text: "德以得之。若富贵而於道可求者，虽执鞭贱职，我亦为之。如不可求，则当从吾" }
      - { type: j, text: "所好者，古人之道也。○注“虽执鞭贱职”。○正义曰：案《周礼·秋官》“条" }
      - { type: j, text: "狼氏掌执鞭以趋辟，王出入，则八人夹道。公则六人，侯伯则四人，子男则二人”。" }
      - { type: j, text: "注云：“趋辟，趋而辟行人，若今卒辟车之为也。”《序官》云“条狼氏下士”，" }
      - { type: j, text: "故云执鞭贱职也。" }
      - { type: j, text: "子之所慎：斋，战，疾。（孔曰：“此三者，人所不能慎，而夫子独能慎之。”）" }
      - { type: z, text: "“子之所慎：斋，战，疾。○正义曰：此一章记孔子所慎之行也。将祭，" }
      - { type: j, text: "散斋七日，致斋三日。斋之为言齐也，所以齐不齐也，故戒慎之。《左传》曰：" }
      - { type: j, text: "“皆陈曰战。”夫兵凶战危，不必其胜，重其民命，固当慎之。君子敬身安体，" }
      - { type: j, text: "若偶婴疾病，则慎其药齐以治之。此三者，凡人所不能慎，而夫子能慎之也。" }
      - { type: j, text: "子在齐闻《韶》，三月不知肉味，（周曰：“孔子在齐，闻习《韶》乐之盛" }
      - { type: j, text: "美，故忽忘於肉味。”）曰：“不图为乐之至於斯也。”（王曰：“为，作也。" }
      - { type: j, text: "不图作《韶》乐至於此。此，齐。”）" }
      - { type: z, text: "“子在”至“斯也”。○正义曰：此章孔子美《韶》乐也。“子在齐闻" }
      - { type: j, text: "《韶》，三月不知肉味”者，《韶》，舜乐名。孔子在齐，闻习《韶》乐之盛美，" }
      - { type: j, text: "故三月忽忘於肉味而不知也。“曰：不图为乐之至於斯也”者，图，谋度也；为，" }
      - { type: j, text: "作也；斯，此也，谓此齐也。言我不意度作《韶》乐乃至於此齐也。○注：王曰：" }
      - { type: j, text: "至：於此齐”。○正义曰：云“为，作也”者，《释言》云：“作、造，为也。”" }
      - { type: j, text: "互相训，故云“为，作也”。云“不图作《韶》乐至於此。此，齐”者，言不意" }
      - { type: j, text: "作此《韶》乐至於齐也。《韶》是舜乐，而齐得作之者，案《礼乐志》云：“夫" }
      - { type: j, text: "乐本情性，浃肌肤而藏骨髓。虽经乎千载，其遗风馀烈尚犹不绝。至春秋时，陈" }
      - { type: j, text: "公子完齐。陈，舜之後，《韶》乐存焉，故孔子齐闻《韶》，三月不知肉味，" }
      - { type: j, text: "曰：‘不图为乐之至於斯。’美之甚也。”" }
      - { type: j, text: "冉有曰：“夫子为卫君乎？（郑曰：“为犹助也。卫君者，谓辄也。卫灵公" }
      - { type: j, text: "逐太子蒯，公薨而立孙辄。後晋赵鞅纳蒯於戚，卫石曼姑帅师围之，故问其" }
      - { type: j, text: "意助辄不乎。”）子贡曰：“诺，吾将问之。”入，曰：“伯夷、叔齐何人也？”" }
      - { type: j, text: "曰：“古之贤人也。”曰：“怨乎？”曰：“求仁而得仁，又何怨？”（孔曰：" }
      - { type: j, text: "“夷齐让国远去，终於饿死，故问怨邪。以让为仁，岂有怨乎？”）出，曰：" }
      - { type: j, text: "“夫子不为也。”（郑曰：“父子争国，恶行。孔子以伯夷、叔齐为贤且仁，故" }
      - { type: j, text: "知不助卫君明矣。”）" }
      - { type: z, text: "“冉有”至“为也”。○正义曰：此章记孔子崇仁让也。“冉有曰：夫" }
      - { type: j, text: "子为卫君乎”者，为，犹助也。卫君谓出公辄也。卫灵公逐太子蒯，公薨而" }
      - { type: j, text: "立孙辄，辄即蒯之子也。後晋赵鞅纳蒯於戚城，卫石曼姑帅师围之。子而拒" }
      - { type: j, text: "父，恶行之甚。时孔子在卫，为辄所宾礼，人疑孔子助辄，故冉有言问其友曰：" }
      - { type: j, text: "“夫子之意助辄不乎？”“子贡曰：诺，吾将问之”者，子贡承冉有之问，其" }
      - { type: j, text: "意亦未决，故诺其言，我将入问夫子，庶知其助不也。“入曰：伯夷、叔齐何" }
      - { type: j, text: "人也”者，此子贡问孔子辞也。伯夷、叔齐，孤竹君之二子，兄弟让国远去，终" }
      - { type: j, text: "於饿死。今卫乃父子争国，争、让，正反。所以举夷、齐为问者，子贡意言夫子" }
      - { type: j, text: "若不助卫君，应言夷、齐为是；夫子若助卫君，应言夷、齐为非，故入问曰：" }
      - { type: j, text: "“伯夷、叔齐何人也？”“曰：古之贤人也”者，孔子答言，是古之让国之贤人" }
      - { type: j, text: "也。“曰：怨乎”者，此子贡复问曰：“夷、齐初虽有让国之贤，而终於饿死，" }
      - { type: j, text: "得无怨恨邪？”所以复问此者，子贡意言，若夫子不助卫君，应言不怨；若助卫" }
      - { type: j, text: "君，则应言有怨也。“曰：求仁而得仁，又何怨”者，此孔子答言不怨也。初心" }
      - { type: j, text: "让国，求为仁也。君子杀身以成仁，夷、齐虽终於饿死，得成於仁，岂有怨乎！" }
      - { type: j, text: "故曰“又何怨”。“出，曰：夫子不为也”者，子贡既问而出，见冉有而告之曰：" }
      - { type: j, text: "“夫子不助卫君也。”知其父子争国，恶行也。孔子以伯夷、叔齐为贤且仁，故" }
      - { type: j, text: "知不助卫君明矣。○注“郑曰”至“不乎”。○正义曰：“云卫灵公逐太子蒯" }
      - { type: j, text: "”者，案《左传》定十四年，蒯谋杀灵公夫人南子，不能，而出奔宋，" }
      - { type: j, text: "是也。云“公薨而立孙辄”者，哀二年《左传》曰：“夏，卫灵公卒。夫人曰：" }
      - { type: j, text: "‘命公子郢为太子，君命也。’对曰：‘郢异於他子，且君没於吾手，若有之，" }
      - { type: j, text: "郢必闻之。且亡人之子辄在。’乃立辄。”是也。云“後晋赵鞅纳蒯聩於戚城”" }
      - { type: j, text: "者，亦哀二年《春秋》文也。云“卫石曼姑帅师围之”者，《春秋》“哀三年春，" }
      - { type: j, text: "齐国夏、卫石曼姑帅师围戚”是也。" }
      - { type: j, text: "子曰：“饭疏食饮水，曲肱而枕之，乐亦在其中矣。（孔曰：“疏食，菜食。" }
      - { type: j, text: "肱，臂也。孔子以此为乐。”）不义而富且贵，於我如浮云。”（郑曰：“富贵" }
      - { type: j, text: "而不以义者，於我如浮云，非已之有。”）" }
      - { type: z, text: "“子曰”至“浮云”。○正义曰：此章记孔子乐道而贱不义也。“子曰：" }
      - { type: j, text: "饭疏食饮水，曲肱而枕之，乐亦在其中矣”者，疏食，菜食也。肱，臂也。言已" }
      - { type: j, text: "饭菜食饮水，寝则曲肱而枕之，以此为乐。“不义而富且贵，於我如浮云”者，" }
      - { type: j, text: "富与贵虽人之所欲，若富贵而以不义者，於我如浮云，言非已之有也。" }
      - { type: j, text: "子曰：“加我数年，五十以学《易》，可以无大过矣。”（《易》“穷理尽" }
      - { type: j, text: "性以至於命”。年五十而知天命，以知命之年读至命之书，故可以无大过。）" }
      - { type: z, text: "“子曰：加我数年，五十以学《易》，可以无大过矣”。○正义曰：此" }
      - { type: j, text: "章孔子言其学《易》年也。加我数年，方至五十，谓四十七时也。《易》之为书，" }
      - { type: j, text: "穷理尽性以至於命，吉凶悔吝豫以告人，使人从吉，不从凶，故孔子言己四十七" }
      - { type: j, text: "学《易》可以无过咎矣。○注“《易》穷”至“大过”。○正义曰：云“穷理尽" }
      - { type: j, text: "性以至於命”者，《说卦》文也。命者生之极，穷理则尽其极也。云“五十而知" }
      - { type: j, text: "天命”者，《为政篇》文。云“以知命之年读至命之书，故可以无大过矣”者，" }
      - { type: j, text: "《汉书·儒林传》云孔子“盖晚而好《易》，读之韦编三绝，而为之传”，是孔" }
      - { type: j, text: "子读《易》之事也。言孔子以知天命终始之年，读穷理尽性以至於命之书，则能" }
      - { type: j, text: "避凶之吉而无过咎。谦不敢自言尽无其过，故但言“可以无大过矣”。" }
      - { type: j, text: "子所雅言，（孔曰：“雅言，正言也。”）《诗》，《书》，执《礼》，皆" }
      - { type: j, text: "雅言也。（郑曰：“读先王典法，必正言其音，然後义全，故不可有所讳。礼不" }
      - { type: j, text: "诵，故言执。”）" }
      - { type: z, text: "“子所雅言，《诗》、《书》、执礼，皆雅言也”。○正义曰：此章记" }
      - { type: j, text: "孔子正言其音，无所讳避之事。雅，正也。子所正言者，《诗》、《书》、《礼》" }
      - { type: j, text: "也。此三者，先王典法，临文教学，读之必正言其音，然後义全，故不可有所讳。" }
      - { type: j, text: "礼不背文诵，但记其揖让周旋，执而行之，故言执也。举此三者，则六艺可知。" }
      - { type: j, text: "叶公问孔子於子路，子路不对。（孔曰：“叶公名诸梁，楚大夫，食菜於叶，" }
      - { type: j, text: "僭称公。不对者，未知所以答。”）子曰：“女奚不曰，其为人也，发愤忘食，" }
      - { type: j, text: "乐以忘忧，不知老之将至云尔。”" }
      - { type: z, text: "“叶公”至“云尔”。○正义曰：此章记孔子之为人也。“叶公问孔子" }
      - { type: j, text: "於子路，子路不对”者，叶公名诸梁，楚大夫，食菜於叶，僭称公。问孔子为人" }
      - { type: j, text: "志行於子路，子路未知所以答，故不对。“子曰：女奚不曰，其为人也。发愤忘" }
      - { type: j, text: "食，乐以忘忧，不知老之将至云尔”者，孔子闻子路不能答，故教之。奚，何也。" }
      - { type: j, text: "言女何不曰，其孔子之为人也，发愤嗜学而忘食，乐道以忘忧，不觉老之将至云" }
      - { type: j, text: "尔乎。○注“孔曰”至“以答”。○正义曰：云“叶公名诸梁，楚大夫，食菜於" }
      - { type: j, text: "叶，僭称公”者，据《左传》、《世本》文也。名诸梁，字子高，为叶县尹。楚" }
      - { type: j, text: "子僭称王，故县尹皆僭称公也。" }
      - { type: j, text: "子曰：“我非生而知之者，好古，敏以求之者也。”（郑曰：“言此者，劝" }
      - { type: j, text: "人学。”）" }
      - { type: z, text: "“子曰：我非生而知之者，好古，敏以求之者也”。○正义曰：此章劝" }
      - { type: j, text: "人学也。恐人以己为生知而不可学，故告之曰：我非生而知之者，但爱好古道，" }
      - { type: j, text: "敏疾求学而知之也。" }
      - { type: j, text: "子不语怪、力、乱、神。（王曰：“怪，怪异也。力，谓若荡舟、乌获举" }
      - { type: j, text: "千钧之属。乱，谓臣弑君、子弑父。神，谓鬼神之事。或无益於教化，或所不忍" }
      - { type: j, text: "言。”）" }
      - { type: z, text: "“子不语怪、力、乱、神”。○正义曰：此章记夫子为教，不道无益之" }
      - { type: j, text: "事。怪，怪异也。力，谓若荡舟、乌获举千钧之属也。乱，谓臣弑君、子弑父" }
      - { type: j, text: "也。神，谓鬼神之事。或无益於教化，或所不忍言也。李充曰：“力不由理，斯" }
      - { type: j, text: "怪力也。神不由正，斯乱神也。怪力乱神，有与於邪，无益於教，故不言也。”" }
      - { type: j, text: "○注“乌获举千钧”。○正义曰：乌获，古之有力人。三十斤为钧，言能举三万" }
      - { type: j, text: "斤之重也。" }
      - { type: j, text: "子曰：“三人行，必有我师焉，择其善者而从之，其不善者而改之。”（言" }
      - { type: j, text: "我三人行，本无贤愚，择善从之，不善改之，故无常师。）" }
      - { type: z, text: "“子曰：三人行，必有我师焉，择其善者而从之，其不善者而改之”。" }
      - { type: j, text: "○正义曰：此章言学无常师也。言我三人行，本无贤愚相悬，但敌体耳，然彼二" }
      - { type: j, text: "人言行，必有一人善，一人不善，我则择其善者而从之，不善者而改之。有善可" }
      - { type: j, text: "从，是为师矣，故无常师也。" }
      - { type: j, text: "子曰：“天生德於予，桓其如予何！”（包曰：“桓，宋司马。天生德" }
      - { type: j, text: "者，谓授我以圣性，德合天地，吉无不利，故曰其如予何。”）" }
      - { type: z, text: "“子曰：天生德於予，桓其如予何？”正义曰：此章言孔子无忧惧也。" }
      - { type: j, text: "案《世家》：“孔子宋，与弟子习礼大树下。宋司马桓欲杀孔子，拔其树。" }
      - { type: j, text: "孔子去。弟子曰：‘可速矣’。”故孔子发此语。言“天生德於予”者，谓天授" }
      - { type: j, text: "我以圣性，德合天地，吉无不利，桓必不能害我，故曰“其如予何”。" }
      - { type: j, text: "子曰：“二三子以我为隐乎？吾无隐乎尔。（包曰：“二三子谓诸弟子。圣" }
      - { type: j, text: "人知广道深，弟子学之不能及，以为有所隐匿，故解之。”）吾无行而不与二三" }
      - { type: j, text: "子者，是丘也。”（包曰：“我所为，无不与尔共之者，是丘之心。”）" }
      - { type: z, text: "“子曰”至“丘也”。○正义曰：此章言孔子教人无所隐惜也。“子曰：" }
      - { type: j, text: "二三子以我为隐乎？吾无隐乎尔”者，二三子谓诸弟子也。圣人知广道深，弟子" }
      - { type: j, text: "学之不能及，常以为夫子有所隐匿，故以此言解之。言女以我为隐，我实无隐也。" }
      - { type: j, text: "“吾无行而不与二三子者，是丘也”者，言我所行所为，无不与尔等共之者，是" }
      - { type: j, text: "丘之心也。言心者，使信其言也。" }
      - { type: j, text: "子以四教：文，行，忠，信。（四者有形质，可举以教。）" }
      - { type: z, text: "“子以四教：文，行，忠，信”。○正义曰：此章记孔子行教以此四事" }
      - { type: j, text: "为先也。文谓先王之遗文。行谓德行，在心为德，施之为行。中心无隐谓之忠。" }
      - { type: j, text: "人言不欺谓之信。此四者有形质，故可举以教也。" }
      - { type: j, text: "子曰：“圣人，吾不得而见之矣。得见君子者，斯可矣。”（疾世无明君。）" }
      - { type: j, text: "子曰：“善人，吾不得而见之矣。得见有恒者，斯可矣。亡而为有，虚而为盈，" }
      - { type: j, text: "约而为泰，难乎有恒矣。”（孔曰：“难可名之为有常。”）" }
      - { type: z, text: "“子曰圣人”至“恒矣”。○正义曰：此章疾世无明君也。“子曰：圣" }
      - { type: j, text: "人，吾不得而见之矣。得见君子者，斯可矣”者，圣人谓上圣之人，若尧、舜、" }
      - { type: j, text: "禹、汤也。君子谓行善无怠之君也。言当时非但无圣人，亦无君子也。“子曰：" }
      - { type: j, text: "善人，吾不得而见之矣。得见有恒者，斯可矣”者，善人即君子也。恒，常也。" }
      - { type: j, text: "又言善人之君，吾不得而见之矣。得见有常德之君，斯亦可矣。“亡而为有，虚" }
      - { type: j, text: "而为盈，约而为泰，难乎有恒矣”者，此明时无常德也。亡，无也。时既浇薄，" }
      - { type: j, text: "率皆虚矫，以无为有，将虚作盈，内实穷约，而外为奢泰。行既如此，难可名之" }
      - { type: j, text: "为有常也。" }
      - { type: j, text: "子钓而不纲，弋不射宿。（孔曰：“钓者，一竿钓。纲者，为大网以横绝流。" }
      - { type: j, text: "以缴系钓，罗属著纲。弋，缴射也。宿，宿鸟。”）" }
      - { type: z, text: "“子钓而不纲，弋不射宿”。○正义曰：此章言孔子仁心也。钓者，以" }
      - { type: j, text: "缴系一竿而钓取鱼也。纲者，为大网，罗属著纲，以横绝流而取鱼也。钓则得鱼" }
      - { type: j, text: "少，网则得鱼多。孔子但钓而不纲，是其仁也。弋，缴射也。宿，宿鸟也。夫子" }
      - { type: j, text: "虽为弋射，但昼日为之，不夜射栖鸟也，为其欺暗必中，且惊众也。○注“孔曰”" }
      - { type: j, text: "至“宿鸟”。○正义曰：云“钓者，一竿钓。纲者，为大网以横绝流，以缴系钓，" }
      - { type: j, text: "罗属著纲”者，此注文句交互，故少难解耳若。其次序应云：钓者，一竿钓，以" }
      - { type: j, text: "缴系钓。纲者，为大纲以横绝流，罗属著纲也。缴即线也。钓谓钩也，谓以一竹" }
      - { type: j, text: "竿用线系钩而取鱼也。罗，细网也，谓以绳为大纲，用网以属著此纲，施之水中，" }
      - { type: j, text: "横绝流以取鱼。举网则提其纲也。云“弋，缴射也”者，《夏官·司弓矢》云：" }
      - { type: j, text: "“矢、矢用诸弋射。”注云：“结缴於矢谓之。，高也。矢象焉，" }
      - { type: j, text: "之言弗刂也。二者皆可以弋飞鸟。弗刂，罗之也。”然则缴射谓以绳系矢而射也。" }
      - { type: j, text: "《说文》云：“缴，谓生丝为绳也。”" }
      - { type: j, text: "子曰：“盖有不知而作之者，我无是也。（包曰：“时人有穿凿妄作篇籍者，" }
      - { type: j, text: "故云然。”）多闻，择其善者而从之；多见而识之，知之次也。”（孔曰：“如" }
      - { type: j, text: "此者，次於天生知之。”）" }
      - { type: z, text: "“子曰”至“次也”。○正义曰：此章言无穿凿也。“子曰：盖有不知" }
      - { type: j, text: "而作之者，我无是也”者，言时人盖有不知理道，穿凿妄作篇籍者，我即无此事" }
      - { type: j, text: "也。“多闻，择其善者而从之；多见而识之，知之次也”者，言人若多闻，择善" }
      - { type: j, text: "而从之；多见，择善而志之，能如此者，比天生知之可以为次也。言此者，所以" }
      - { type: j, text: "戒人不为穿凿。" }
      - { type: j, text: "互乡难与言，童子见，门人惑。（郑曰：“互乡，乡名也。其乡人言语自专，" }
      - { type: j, text: "不达时宜，而有童子来见孔子，门人怪孔子见之。”）子曰：“与其进也，不与" }
      - { type: j, text: "其退也，唯何甚？（孔曰：“教诲之道，与其进，不与其退。怪我见此童子，恶" }
      - { type: j, text: "恶一何甚。”）人已以进，与其也，不保其往也。”（郑曰：“往犹去也。" }
      - { type: j, text: "人虚已自而来，当与之进，亦何能保其去後之行。”）" }
      - { type: z, text: "“互乡”至“往也”。○正义曰：此章言教诲之道也。“互乡难与言，" }
      - { type: j, text: "童子见，门人惑”者，互乡，乡名也。其乡人言语自专，不达时宜，而有童子来" }
      - { type: j, text: "见孔子，门人怪孔子见之。琳公云：“此‘互乡难与言童子见’八字通为一句，" }
      - { type: j, text: "言此乡有一童子难与言，非是一乡皆难与言也。”“子曰：与其进也，不与其退" }
      - { type: j, text: "也，唯何甚”者，孔子以门人怪已，故以言语之，言教诲之道，与其进，不与其" }
      - { type: j, text: "退也，怪我见此童子，恶恶一何甚乎。“人已以进，与其也，不保其往也”" }
      - { type: j, text: "者，往犹去也。言人若虚已自而来，当与之进，亦何能保其去後之行。去後之" }
      - { type: j, text: "行者，谓往前之行，今已过去。顾欢云：“往谓前日之行。夫人之为行，未必可" }
      - { type: j, text: "一，或有始无终，先迷後得。教诲之道，则与之，往日之行，非我所保也。”" }
      - { type: j, text: "子曰：“仁远乎哉？我欲仁，斯仁至矣。”（包曰：“仁道不远，行之即是。”）" }
      - { type: z, text: "“子曰：仁远乎哉？我欲仁，斯仁至矣”。○正义曰：此章言仁道不远，" }
      - { type: j, text: "行之即是，故曰仁道岂远乎哉，我欲行仁，即斯仁至矣，是不远也。" }
      - { type: j, text: "陈司败问：“昭公知礼乎？”（孔曰：“司败，官名，陈大夫。昭公，鲁昭" }
      - { type: j, text: "公。”）孔子曰：“知礼。”孔子退，揖巫马期而进之，曰：“吾闻君子不党，" }
      - { type: j, text: "君子亦党乎？君取於吴，为同姓，谓之吴孟子。君而知礼，孰不知礼？”（孔曰：" }
      - { type: j, text: "“巫马期，弟子，名施。相助匿非曰党。鲁，吴俱姬姓，礼同姓不昏，而君取之；" }
      - { type: j, text: "当称吴姬，讳曰孟子。”）巫马期以告。子曰：“丘也幸，苟有过，人必知之。”" }
      - { type: j, text: "（孔曰：“以司败之言告也。讳国恶，礼也。圣人道弘，故受以为过。”）" }
      - { type: z, text: "“陈司”至“知之”。○正义曰：此章记孔子讳国恶之礼也。“陈司败" }
      - { type: j, text: "问：昭公知礼乎”者，陈大夫为司寇之官，旧闻鲁昭公有违礼之事，故问孔子，" }
      - { type: j, text: "昭公知礼乎。“孔子曰：知礼”者，答言昭公知礼也。“孔子退，揖巫马期而进" }
      - { type: j, text: "之，曰：吾闻君子不党，君子亦党乎”者，相助匿非曰党。孔子既答司败而退去，" }
      - { type: j, text: "司败复揖弟子巫马期而进之，问曰：“我闻君子不阿党，今孔子言昭公知礼，乃" }
      - { type: j, text: "是君子亦有党乎？“君取於吴，为同姓，谓之吴孟子。君而知礼，孰不知礼”者，" }
      - { type: j, text: "孰，谁也。鲁、吴俱姬姓。礼同姓不昏，而君取之，当称吴姬。为是同姓，讳之，" }
      - { type: j, text: "故谓之吴孟子。若以鲁君昭公而为知礼，又谁不知礼也？“巫马期以告，子曰：" }
      - { type: j, text: "丘也幸，苟有过，人必知之”者，巫马期以司败之言告孔子也。孔子初言昭公知" }
      - { type: j, text: "礼，是讳国恶也。讳国恶，礼也。但圣人道弘，故受以为过，言丘也幸，苟有过，" }
      - { type: j, text: "人必知之也。○注“司败，官名，陈大夫”。正义曰：文十一年《左传》云：楚" }
      - { type: j, text: "子西曰：“臣归死於司败也。”杜注云“陈、楚名司寇为司败”也。《传》言归" }
      - { type: j, text: "死於司败，知司败主刑之官，司寇是也。此云陈司败，楚子西亦云司败，知陈、" }
      - { type: j, text: "楚同此名也。○注“孔曰”至“孟子”。正义曰：云“巫马期弟子，名施”者，" }
      - { type: j, text: "《史记·弟子传》云：“巫马施字子旗，少孔子三十岁。”郑玄云：“鲁人也。”" }
      - { type: j, text: "云“鲁、吴俱姬姓”者，鲁，周公之後；吴，泰伯之後，故云俱姬姓也。云“礼" }
      - { type: j, text: "同姓不昏”者，《曲礼》云：“取妻不取同姓，故买妾不知其姓则卜之。”又" }
      - { type: j, text: "《大传》曰：“系之以姓而弗别，缀之以食而弗殊，虽百世而昏姻不通者，周道" }
      - { type: j, text: "然也。”云“而君取之，当称吴姬，而讳曰孟子”者，案《春秋》哀十二年：" }
      - { type: j, text: "“夏，五月，甲辰，孟子卒。”《左氏传》曰：“昭公娶於吴，故不书姓。”此" }
      - { type: j, text: "云“君娶於吴，为同姓，谓之吴孟子”，是鲁人常言称孟子也。《坊记》云：" }
      - { type: j, text: "“《鲁春秋》去夫人之姓曰吴，其死曰孟子卒。”是旧史书为“孟子卒”，及仲" }
      - { type: j, text: "尼《春秋》，以鲁人已知其非，讳而不称姬氏。讳国恶，礼也，因而不改，所" }
      - { type: j, text: "以顺时世也。《鲁春秋》去夫人之姓曰吴，《春秋》无此文。《坊记》云然者，" }
      - { type: j, text: "礼：夫人初至必书於册。若娶齐女，则云：“夫人姜氏至自齐。”此孟子初至之" }
      - { type: j, text: "时，亦当书曰：“夫人姬氏至自吴。”同姓不得称姬，旧史所书，盖直云夫人至" }
      - { type: j, text: "自吴。是去夫人之姓，直书曰吴而已。仲尼《春秋》，以犯礼明著，全去其文，" }
      - { type: j, text: "故经无其事也。○注“孔曰”至“为过”。正义曰：云“讳国恶，礼也”者，僖" }
      - { type: j, text: "元年《左传》文也。案《坊记》云：“善则称君，过则称已，则民作忠。”“善" }
      - { type: j, text: "则称亲，过则称已，则民作孝。”是君亲之恶，务於欲掩之，是故圣贤作法，通" }
      - { type: j, text: "有讳例。杜预曰：“有时而听之则可也，正以为後法则不经，故不夺其所讳，亦" }
      - { type: j, text: "不为之定制。”言若正为後法，每事皆讳，则为恶者无复忌惮，居上者不知所惩，" }
      - { type: j, text: "不可尽令讳也。人之所极，唯君与亲，才有小恶，即发其短，非复臣子之心，全" }
      - { type: j, text: "无爱敬之义。是故不抑不劝，有时听之，以为讳恶者礼也，无隐者直也，二者俱" }
      - { type: j, text: "通以为世教也。云“圣人道弘，故受以为过”者，孔子所言，虽是讳国恶之礼，" }
      - { type: j, text: "圣人之道弘大，故受以为过也。孔子得巫马期之言，称已名云：是已幸受以为过。" }
      - { type: j, text: "故云：苟有过，人必知之。所以然者，昭公不知礼，我答云知礼。若使司败不讥" }
      - { type: j, text: "我，则千载之後，遂永信我言，用昭公所行为知礼，则乱礼之事，从我而始。今" }
      - { type: j, text: "得司败见非而受以为过，则後人不谬，故我所以为幸也。缪协云：“讳则非讳。" }
      - { type: j, text: "若受而为过，则所讳者又以明矣，亦非讳也。司败之问，则诡言以为讳，今苟" }
      - { type: j, text: "将明其义，故之言为合礼也。苟曰合礼，则不为党矣。若不受过，则何礼之有" }
      - { type: j, text: "乎？”" }
      - { type: j, text: "子与人歌而善，必使反之，而後和之。（乐其善，故使重歌而自和之。）" }
      - { type: z, text: "“子与人歌而善，必使反之，而後和之”。○正义曰：此章明孔子重於" }
      - { type: j, text: "正音也。反，犹重也。孔子共人歌，彼人歌善，合於雅颂者，乐其善，故使重歌" }
      - { type: j, text: "之，审其歌意，然後自和而答之。" }
      - { type: j, text: "子曰：“文莫，吾犹人也。（莫，无也。文无者，犹俗言文不也。文不吾犹" }
      - { type: j, text: "人者，凡言文皆不胜於人。）躬行君子，则吾未之有得。”（孔曰：“身为君子，" }
      - { type: j, text: "已未能也。”）" }
      - { type: z, text: "“子曰：文莫，吾犹人也。躬行君子，则吾未之有得”。○正义曰：此" }
      - { type: j, text: "章记夫子之谦德也。莫，无也。文无者，犹俗言文不也。文不吾犹人者，言凡文" }
      - { type: j, text: "皆不胜於人，但犹如常人也。躬，身也。言身为君子，已未能也。" }
      - { type: j, text: "子曰：“若圣与仁，则吾岂敢？（孔曰：“孔子谦，不敢自名仁圣。”）抑" }
      - { type: j, text: "为之不厌，诲人不倦，则可谓云尔已矣。”公西华曰：“正唯弟子不能学也。”" }
      - { type: j, text: "（马曰：“正如所言，弟子犹不能学，况仁圣乎！”）" }
      - { type: z, text: "“子曰”至“学也”。正义曰：此章亦记孔子之谦德也。“子曰：若圣" }
      - { type: j, text: "与仁，则吾岂敢”者，唯圣与仁，人行之大者也。孔子谦，不敢自名仁圣也。" }
      - { type: j, text: "“抑为之不厌，诲人不倦，则可谓云尔已矣”者，抑，语辞。为，犹学也。孔子" }
      - { type: j, text: "言已学先王之道不厌，教诲於人不倦，但可谓如此而已矣。“公西华曰：正唯弟" }
      - { type: j, text: "子不能学也”者，公西华闻孔子云学之不厌，诲人不倦，故答於孔子曰：“正如" }
      - { type: j, text: "所言不厌、不倦之二事，弟子犹不能学，况仁圣乎！”" }
      - { type: j, text: "子疾病，子路请祷。（包曰：“祷，祷请於鬼神。”）子曰：“有诸？”" }
      - { type: j, text: "（周曰：“言有此祷请於鬼神之事。”）子路对曰：“有之。《诔》曰：‘祷尔" }
      - { type: j, text: "于上下神祗。’”（孔曰：“子路失旨。《诔》，祷篇名。”）子曰：“丘之祷" }
      - { type: j, text: "久矣。”（孔曰：“孔子素行合於神明，故曰‘丘之祷久矣’。”）" }
      - { type: z, text: "“子疾”至“久矣”。○正义曰：此章记孔子不谄求於鬼神也。“子疾" }
      - { type: j, text: "病，子路请祷”者，孔子疾病，子路告请祷求鬼神，冀其疾愈也。“子曰：有诸”" }
      - { type: j, text: "者，诸，之也。孔子以死生有命，不欲祷祈，故反问子路曰：“有此祷请於鬼神" }
      - { type: j, text: "之事乎？”“子路对曰：有之。《诔》曰：“祷尔于上下神祗”者，《诔》，祷" }
      - { type: j, text: "篇名。诔，累也。累功德以求福。子路失孔子之指，故曰有之。又引祷篇之文以" }
      - { type: j, text: "对也。“子曰：丘之祷久矣”者，孔子不许子路，故以此言拒之。若人之履行违" }
      - { type: j, text: "忤神明，罹其咎殃则可祷请。孔子素行合於神明，故曰“丘之祷久矣”也。" }
      - { type: j, text: "子曰：“奢则不孙，俭则固。与其不孙也，宁固。”（孔曰：“俱失之。奢" }
      - { type: j, text: "不如俭，奢则僭上，俭不及礼。固，陋也。”）" }
      - { type: z, text: "“子曰：奢则不孙，俭则固。与其不孙也，宁固”。○正义曰：此章戒" }
      - { type: j, text: "人奢僭也。孙，顺也。固，陋也。言奢则僭上而不顺，俭则逼下而窭陋，二者俱" }
      - { type: j, text: "失之。与其不顺也，宁为窭陋，是奢不如俭也。以其奢则僭上，俭但不及礼耳。" }
      - { type: j, text: "子曰：“君子坦荡荡，小人长戚戚。”（郑曰：“坦荡荡，宽广貌。长戚戚，" }
      - { type: j, text: "多忧惧。”）" }
      - { type: z, text: "“子曰：君子坦荡荡，小人长戚戚”。○正义曰：此章言君子小人心貌" }
      - { type: j, text: "不同也。坦荡荡，宽广貌。长戚戚，多忧惧也。君子内省不疚，故心貌坦荡荡然" }
      - { type: j, text: "宽广也。小人好为咎过，故多忧惧。" }
      - { type: j, text: "子温而厉，威而不猛，恭而安。" }
      - { type: z, text: "“子温而厉，威而不猛，恭而安”。○正义曰：此章说孔子体貌也。言" }
      - { type: j, text: "孔子体貌温和而能严正，俨然人望而畏之而无刚暴，虽为恭孙而能安泰，此皆与" }
      - { type: j, text: "常度相反。若《皋陶谟》之九德也。他人不能，唯孔子能然，故记之也。" }
