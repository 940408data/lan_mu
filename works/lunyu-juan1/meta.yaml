aboutHtml: |-
  <h2>關於此卷</h2>
  <p>《論語注疏》為宋邢昺疏，以魏何晏《論語集解》為本，為十三經注疏之一。論語二十篇，記孔子及門人言行，此卷以宋刻本版式數字重刻，半葉八行、行十六字、注文雙行二十五字。</p>
  <p>卷一收學而第一，經注疏全帙。</p>
