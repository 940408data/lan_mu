# 禮記正義卷3（孔穎達疏）：j 為經文＋鄭玄注，z 為疏文。
sections:
  - id: juan3
    name: 正文
    blocks:
      - { type: j, text: "凡為君使者，已受命，君言不宿於家。急君使也。言謂有故所問也。《聘禮》曰：“君有言，則以束帛如饗禮。”○為，於偽反，下注“為哀樂”、“為其廢喪事”並同。君言至，則主人出拜君言之辱。使者歸，則必拜送於門外。敬君命也。此謂國君問事於其臣。若使人於君所，則必朝服而命之。使者反，則必下堂而受命。此臣有所告請於其君。○朝，直遙反。" }
      - { type: z, text: "“凡為”至“受命”。○正義曰：此一節論相聘問及君臣使人相告之事，今各依文解之。○“受命”謂受得君命為聘使也。“君言”謂受君言宜急去，不得停留宿於家也。故《聘禮》既受命，“遂行，舍於郊”是也。○注“言謂”至“享禮”。○正義曰：解“君言”也。君之所言謂有事，故所問也，或問其臣，或問他人。鄭注《聘禮記》：“有故，謂災患及時事相告也。”雲“《聘禮》曰：若有言，則以束帛如享禮”者，又證有言必有物將之也。此謂行享禮畢，而又有此言，而又加束帛也。鄭注彼雲：“有言，有所告請，若有所問也。《記》曰有故則束帛加書以將命。《春秋》臧孫辰告糴於齊，公子遂如楚乞師，晉侯使韓穿來言汶陽之田，是其類也。”○“君言至，則主人出拜君言之辱”。○正義曰：此謂君使人問其臣，臣對使禮也。出，出門也。君使初至，則主人出門拜迎君命也。辱者，言屈辱尊者之命來也。“使者歸，則必拜送於門外”者，君之使去，而又出拜送門外也。去既送出門，則知初至迎亦出門也。此謂國君問事於其臣也。若臣遣人往君所及問他人，則送迎亦然。○“若使人於君所，則必朝服而命之”者，此謂臣有故而遣使告君法也。亦有物以將之，敬君，故朝服命使也。然命使者言朝服，則君言至亦朝服受之，互言也。“使者反，則必下堂而受命”者，謂己使者從君處反還至也。去不下送，反而下迎者，尊君命也。不出門者，已使卑於君使也。亦當拜之，不言，從上可知也。" }
      - { type: j, text: "博聞強識而讓，敦善行而不怠，謂之君子。敦，厚。○識如字，又式異反。行，下孟反，皇如字。怠音代。君子不盡人之歡，不竭人之忠，以全交也。歡謂飲食，忠謂衣服之物。" }
      - { type: z, text: "“君子”至“交也”。○正義曰：此明君子所行之事也。○鄭雲：“歡謂飲食，忠謂衣服。飲食是會樂之具。承歡為易。衣服比飲食為難，必關忠誠籌度，故名忠，各有所以也。明與人交者，不宜事事悉受。若使彼罄盡，則交結之道不全，若不竭盡，交乃全也。”" }
      - { type: j, text: "《禮》曰：“君子抱孫不抱子。”此言孫可以為王父屍，子不可以為父屍。以孫與祖昭穆同。○昭，時招反。為君屍者，大夫士見之則下之。君知所以為屍者，則自下之。尊屍也。下，下車也。國君或時幼少，不能盡識群臣，有以告者，乃下之。○少，式召反。屍必式，禮之。乘必以幾。尊者慎也。○乘，繩證反，下注二處“乘車”同。齊者不樂不吊。為哀樂則失正，散其思也。○齊，側皆反。樂音洛，下“無容樂”、“非樂所”同。思，絲嗣反，又如字。" }
      - { type: z, text: "“禮曰”至“不吊”。○正義曰：此一節論立屍用人相尊敬之法，各依文解之。○“抱孫不抱子”者，此以明昭穆之例。凡稱“禮曰”者，皆舊禮語也。為下事難明，故引舊禮為證。案此篇之首，作記之人引舊禮而言“《曲禮》曰”，此直言“禮曰”，不言“曲者”，從略可知也。“抱孫不抱子”者，謂祭祀之禮必須屍，屍必以孫。今子孫行並皆幼弱，則必抱孫為屍，不得抱子為屍。所以然者，作記者既引其禮，又自解雲，“此言孫可以為王父屍，子不可以為父屍”故也。《曾子問》雲：“祭成喪者必有屍，屍必以孫，孫幼則使人抱之，無孫則取於同姓可也。”是有抱孫之法也。言“無孫取於同姓可”者，謂無服內之孫，取服外同姓也。天子至士皆有屍，《特牲》是士禮，《少牢》是大夫禮，並皆有屍。又《祭統》雲：“君執圭瓚祼屍。”是諸侯有屍也。又《守祧職》雲：“若將祭祀，則各以其服授屍。”是天子有屍也。天子以下，宗廟之祭，皆用同姓之嫡，故《祭統》雲：“祭之道，孫為王父屍。所使為屍者，於祭者為子行，父北面而事之。”法雲：“子行猶子列也。祭祖則用孫列，皆取於同姓之適孫也。天子諸侯之祭，朝事延屍於戶外，是以有北面事屍之禮也。”雖取孫列，用卿大夫為之，故《既醉》注云：“天子以卿。”鄭箋雲：“諸侯入為天子卿大夫，故云公屍。”天子既然，明諸侯亦爾，故大夫士亦用同姓嫡者。《曾子問》雲：“無孫取於同姓可也。”又鄭注《特牲禮》“大夫士以孫之倫為屍”是也。言“倫”，明非己孫，皇侃用崔靈恩義，以大夫用已孫為屍，恐非也。天子祭天地、社稷、山川、四方百物及七祀之屬，皆有屍也。故《鳧鷖》並雲“公屍”。推此而言，諸侯祭社稷竟內山川，及大夫有菜地祭五祀，皆有屍也。外神之屬，不問同姓異姓，但卜吉則可為屍。案《曾子問》祭成人必有屍，則祭殤無屍。若新喪虞祭之時，男女各立屍，故《士虞禮》雲：“男，男屍。女，女屍。”至祔祭之後，正用男之一屍，以其祔祭漸吉故也。凡吉祭祗用一屍，故《祭統》雲：“設同幾”是也。若祭勝國之社稷，則士師為屍。知者，《士師職》文，用士師者略之。故《異義》：“《公羊》說祭天無屍。《左氏》說晉祀夏郊，以董伯為屍。《虞夏傳》雲：‘舜入唐郊，以丹朱為屍。’是祭天有屍也。許慎引《魯郊禮》曰：‘祝延帝屍。’從《左氏》之說也。”○“為君屍者，大夫士見之則下之”。○正義曰：此臣為君作屍者，己被卜吉，君許用者也。下謂下車也。古者致齊各於其家，散齊亦猶出在路，及至祭日之旦，俱來入廟，故群臣得於路見君之屍，皆下車而敬之。○“君知所以為屍者則自下之”者，此亦謂散齊之時。君若在路見屍，亦自下車敬之。不直雲“君見屍”，而云“君知”者，言“知”則初有不知，不知謂君年或幼少，不能並識群臣，故於路或不識，而臣告君，君乃知之，所以下也。所以知是散齊者，君致齊不復出行，若祭日君先入廟，後乃屍至也。○“屍必式”者，廟門之外，屍尊未伸，不敢亢禮，不可下車，故式為敬以答君也。式謂俯下頭也。古者車箱長四尺四寸而三分，前一後二，橫一木，下去車床三尺三寸，謂之為式。又於式上二尺二寸橫一木，謂之為較，較去車床凡五尺五寸。於時立乘，若平常則馮較，故《詩》雲“倚重較兮”是也。又若應為敬，則落手隱下式，而頭得俯俛。故後雲“式視馬尾”是也。鄭注《考工記》雲：“兵車之式高三尺三寸。”“較，兩輢上出式者也。兵車自較而下，凡五尺五寸。”然屍在廟中尊伸，尚答主人之拜，今在路，其尊猶屈，君下而已式者，以其在路，尊未伸，故未敢亢禮，至於廟中，禮伸則亢，故答之。○“乘必以幾”者，几案在式之上，尊者有所敬事，以手據之。几上有冪，君以羔皮，以虎緣之也。" }
      - { type: j, text: "居喪之禮，毀瘠不形，視聽不衰，為其廢喪事。形謂骨見。○瘠音在昔反，瘦也。見，賢遍反。升降不由阼階，出入不當門隧。常若親存，隧，道也。阼，才故反。遂音遂。居喪之禮，頭有創則沐，身有瘍則浴，有疾則飲酒食肉，疾止復初。不勝喪，乃比於不慈不孝。勝，任也。○創，初良反，又初亮反。瘍音恙，本或作癢。勝音升。任，而金反。五十不致毀，六十不毀，七十唯衰麻在身，飲酒食肉，處於內。所以養衰老。人五十始衰也。○衰，七雷反。" }
      - { type: z, text: "“居喪”至“於內”。○正義曰：此一節明孝子居喪，此先明居喪平常之法也。“毀瘠不形”者，毀瘠，羸瘦也。形，骨露也。骨為人形之主，故謂骨為形也。居喪乃許羸瘦，不許骨露見也。○“升降不由阼階”者，阼階，主人之階也。孝子事死如事生，故在喪思慕，猶若父在，不忍從父阼階上下也。若祔祭以後，即得升阼階。知者，案《士虞禮》雲，卒哭以後稱哀子，祔祭稱孝子。祔祭如饋食之禮，既同於吉，則孝子得升阼階也。然《雜記》雲：“吊者入，主人升堂西面。”下雲：“既葬，蒲席。”則升堂西面，未葬也，既言西面，則是升自阼階。此未葬得升阼階者，敬異國之賓也。○“不勝喪，乃比於不慈不孝”者，結所以沐浴酒肉之義也。“不勝喪”，謂疾不食酒肉，創瘍不沐浴，毀而滅性者也。不留身繼世，是不慈也。滅性又是違親生時之意，故云不孝。不雲“同”而云“比”者，此滅性本心實非為不孝，故言“比”也。○“五十不致毀”者，致，極也。五十始衰，居喪乃許有毀，而不得極羸瘦。○“六十不毀”者，轉更衰甚，都不許毀也。魯襄公三十一年《經》書：“九月癸巳，子野卒。”《傳》雲“毀也”是也。○" }
      - { type: j, text: "生與來日，死與往日。與，猶數也。生數來日，謂成服杖以死明日數也。死首薺日，謂殯斂以死日數也。此士禮，貶於大夫者，大夫以上皆以來日數。《士喪禮》曰“死日而襲，厥明而小斂，又厥明大斂而殯”，則死三日。而更言三日成服杖，似異日矣。《喪大記》曰：“士之喪，二日而殯，三日之朝，主人杖。”二者相推，其然明矣。與，或為“予”。○數，所主反，下皆同。殯，必刃反，下同。斂，力驗反，下同。貶，彼檢反，《字林》方犯反。" }
      - { type: z, text: "“生與”至“往日”。○正義曰：“生與來日”者，此謂士禮。與，數也。謂生人成服杖，數來日為三日。“死首薺日”者，謂死者殯斂，數死日為三日。○注“與數”至“為予”。○正義曰：貶猶屈也。士卑屈，故降，不如大夫所以厭其殯日。然士惟屈殯日，不屈成服杖日者，成服必在殯後故也。雲“大夫以上皆以來日數”者，大夫尊，則成服及殯皆不數死日也。大夫雲三日殯，不數死日，則天子諸侯亦悉不數死日也。故鄭雲：“大夫以上。”雲“《士喪禮》曰死日而襲”者，注引《士喪禮》者，證殯與成服不同日，以其未審，故云“似異日”。又引《喪大記》者，更證明士殯與成服不同日，故云“二者相推，其然明矣”。謂以《士喪禮》、《喪大記》二者相推校。然猶是也。殯與成服是異日，明矣，無所復疑。言“與，或為予”者，謂諸本《禮記》有作“予”字者，故云“與，或為予”。" }
      - { type: j, text: "知生者吊，知死者傷。知生而不知死，吊而不傷。知死而不知生，傷而不吊。人恩各施於所知也。吊、傷，皆謂致命辭也。《雜記》曰，諸侯使人吊，辭曰：“寡君聞君之喪，寡君使某，如何不淑！”此施於生者，傷辭未聞也。說者有吊辭雲：“皇天降災，子遭罹之。如何不淑！”此施於死者，蓋本傷辭。辭畢，退，皆哭。○傷如字，下同，舊式亮反。" }
      - { type: z, text: "“知生”至“不吊”。○正義曰：此一節論吊傷之法，若存之與亡並識，則遣設吊辭傷辭兼行。若但識生而不識亡，則唯遣設吊辭而無傷辭。○“知死而不知生，傷而不吊”者，若但識亡，唯施傷辭，而無吊辭也。然生吊死傷，其文可悉。但記者丁寧言之，故其文詳也。○注“吊傷”至“皆哭”。○正義曰：皆不自往，而遣使致已之命也。“《雜記》曰，諸侯使人吊，辭曰：寡君聞君之喪，寡君使某，如何不淑”，此施於生者也。引《雜記》者，證諸侯有鄰國之喪，不得自往，遣使往吊，致命吊辭之法也，然吊辭唯使者口傳之於主國孤而已。雲“傷辭未聞”者，經典散亡，故未聞也。“說者有吊辭雲：皇天降災，子遭罹之，如何不淑”者，既未聞傷辭，有舊說者雲有吊辭如此也。施於死者，蓋本傷辭也。鄭此雲舊說，疑其非吊辭，正是傷辭耳。所以然者，一則不與《雜記》吊辭同，二則既言“皇天降災，子遭罹之”，明是傷於亡者自身，非關吊於孝子也。雲“辭畢，退，皆哭”者，然吊辭乃使口致命，若傷辭當書之於板，使者讀之而奠致殯前也。知辭畢皆退而哭者，案《雜記》行吊之後，致含襚賵畢乃臨，若不致含隧賵，則吊訖乃臨也。故鄭雲吊傷辭畢皆哭。" }
      - { type: j, text: "吊喪弗能賻，不問其所費。問疾弗能遺，不問其所欲。見人弗能館，不問其所舍。賜人者不曰來取，與人者不問其所欲。皆為傷恩也。見人，見行人。館，舍也。與人不問其所欲，己物或時非其所欲，將不與也。○賻音附，《公羊傳》曰：“錢財曰賻。”《穀梁傳》曰：“歸生者曰賻。”不問其所費，芳味反，一本作“有所費”，下句放此。遺，於季反，與也。皆為，於偽反，下“為啤變皆同。" }
      - { type: j, text: "適墓不登壟，為其不敬。壟，冢也。墓，塋域。○壟，力勇反。塋音營。助葬必執紼。葬，喪之大事。紼，引車索。○紼音弗。引棺，本亦作引車。索，悉各反。臨喪不笑，臨喪宜有哀色。揖人必違其位，禮以變為敬。望柩不歌，入臨不翔。哀傷之無容樂。○柩，求又反。臨如字，舊力鳩反。當食不歎。食或以樂，非歎所。鄰有喪，舂不相。裏有殯，不巷歌。助哀也。相，謂送杵聲。○舂，束容反。相，息亮反，注同。杵，昌呂反。適墓不歌，非樂所。哭日不歌。哀未忘也。送喪不由徑，送葬不闢塗潦。所哀在此。○徑，經定反，邪路也。闢音避，本亦作避，下注同。臨喪則必有哀色，執紼不笑，臨樂不歎，介冑則有不可犯之色。貌與事宜相配。介，甲也。故君子戒慎，不失色於人。色厲而內荏，貌恭心很，非情者也。○荏，而審反，柔弱貌。很，胡懇反。國君撫式，大夫下之。大夫撫式，士下之。撫猶據也。據式小俛，崇敬也。乘車必正立。○俛音免。禮不下庶人，為其遽於事，且不能備物。○下，遐嫁反，又如字。遽，其庶反，沈及其於反。刑不上大夫。不與賢者犯法，其犯法則在八議輕重，不在刑書。○上，時掌反。與音預。刑人不在君側。為怨恨為害也。《春秋傳》曰：“近刑人，則輕死之道。”" }
      - { type: z, text: "“助葬”至“君側”。○正義曰：此一節記人雜記吉凶舉動威儀之事，各依文解之。○“助葬必執紼”者，助葬本非為客，正是助事耳，故宜必執紼也。○注“葬喪”至“車索”。○正義曰：“葬，喪之大事”，解所以必執紼之義。雲“紼，引車索”者，繩屬棺曰紼，屬車曰引，引、紼亦通名，故鄭雲：“紼，引車索也。”○“揖人必違其位”者，位謂己之位也。於位而見前人，己所宜敬者，當離己位而鄉彼遙揖。禮以變為敬，是以《燕禮》君降階，爾卿大夫。鄭注云：“爾，近也。”揖而移近之，明雖君臣，皆須違位而揖也。○“入臨不翔”者，謂入臨人之喪，不得趍翔為容。不翔，故不歌，歌則猶翔也。○“當食不歎”者，吉食奏樂，既樂，故不宜歎也。又若助喪事而食，使充飢，不令廢事，亦不宜歎，歎則不飽也。○注“食或以樂，非歎所”。○正義曰：人君吉食則有樂，賤者則無，故云“或”也。○“哭日不歌”者，“哭日”謂吊人日也。哭、歌不可共日也。○注“哀未忘也”。○正義曰：《論語》雲：“子於是日哭，則不歌。”而鄭此雲：“哀未忘也。”則吊日之朝，亦得歌樂。但吊以還，其日晚，不歌耳。亦得會是日哭則不歌，是先哭後乃不歌也。○“送葬不闢塗潦”者，前文“送喪”，此雲“送葬”，上下文勢皆據他人，知者，以上“適墓不登壟”，“入臨不翔”，及“哭日不歌”，以文類之，故知此等皆據他人也。而本亦有云“送喪不闢塗潦”者，義亦通也。○“介冑則有不可犯之色”者，亦內外宜相稱也。戎容暨暨，若身被甲，首冠冑，則使形勢高岸，有不可干犯之色，以稱其服也。○“故君子戒慎，不失色於人”者，並結前義也。故，承上起下之辭。上既言內外宜稱，故君子接人，凡所行用，並使心色如一，不得色違於心，故云“不失色於人”也。○注“色厲而內荏，貌恭心很，非情者也”。○正義曰：此舉失色之事也。小人顏色嚴厲而心內荏弱為佞，又外乃象恭而心實敖很，此並情不副色也。故《論語》雲：“色厲而內荏，譬諸小人，其猶穿窬之盜也與。”又云：“巧言令色足恭。”《書》雲：“象恭滔天。”○“國君撫式，大夫下之”者，撫謂手據之，謂君臣俱行，君式宗廟，則臣宜下車。此獨雲大夫，則士可知也。“大夫撫式，士下之”者，士為大夫之臣，亦如大夫於君也。○注“乘車必正立”。○正義曰：證所式義也。乘車，駟馬之車也。既並立乘，故為敬時，則俯俛據式。○“禮不下庶人”者，謂庶人貧，無物為禮，又分地是務，不服燕飲，故此禮不下與庶人行也。《白虎通》雲：“禮為有知制，刑為無知設。”禮謂酬酢之禮，不及庶人，勉民使至於士也。故《士相見禮》雲“庶人見於君，不為容進退走”是也。張逸雲：“非是都不行禮也。但以其遽務不能備之，故不著於經文三百、威儀三千耳。其有事，則假士禮行之。”○“刑不上大夫”者，制五刑三千之科條，不設大夫犯罪之目也。所以然者，大夫必用有德。若逆設其刑，則是君不知賢也。張逸雲：“謂所犯之罪，不在夏三千、週二千五百之科。不使賢者犯法也，非謂都不刑其身也。其有罪則以八議議其輕重耳。”○注“不與”至“刑書”。○正義曰：與猶許也。不許賢者犯法，若許之，則非進賢之道也。大夫無刑科，而《周禮》有犯罪致殺放者，鄭恐人疑，故出其事，雖不制刑書，“不與賢者犯法，其犯法則在八議輕重，不在刑書”。若脫或犯法，則在八議，議有八條，事在《周禮》。一曰議親之闢，謂是王宗室有罪也。二曰議故之闢，謂與王故舊也。三曰議賢之闢，謂有德行者也。四曰議能之闢，謂有道藝者也。五曰議功之闢，謂有大勳立功者也。六曰議貴之闢，謂貴者犯罪，即大夫以上也。鄭司農雲：“若今之吏墨綬有罪先請者。”案漢時墨綬者是貴人也。七曰議勤之闢，謂憔悴憂國也。八曰議賓之闢，謂所不臣者，三恪二代之後也。《異義》：“《禮戴》說‘刑不上大夫’。《古周禮》說士屍肆諸市，大夫屍肆諸朝。是大夫有刑。許慎謹案：《易》曰：‘鼎折足，覆公餗，其刑渥，兇。’無刑不上大夫之事，從《周禮》之說。”鄭康成駮之雲：“凡有爵者，與王同族。大夫以上適甸師氏，令人不見，是以雲刑不上大夫。”如鄭之言，則於《戴禮》及《周禮》二說俱合，但大夫罪未定之前，則皆在八議，此經注是也。若罪已定，將刑殺，則適甸師氏是也。凡王朝大夫以上及王之同姓，皆刑之於甸師氏，故《掌戮》雲，凡有爵者及王之同族有罪，則死刑焉，是也。若王之庶姓之士，及諸侯大夫，則戮於朝。故襄二十二年，楚殺令尹子南，屍諸朝，是大夫於朝也。列國大夫入天子之國曰某士，明天子之士亦在朝也。諸侯大夫既在朝，則諸侯之士在市，故《檀弓》雲：“君之臣不免於罪，則將肆諸市朝。”鄭雲，大夫於朝，士於市，是也。○“刑人不在君側”者，彼刑殘者，不得令近君，為其怨恨也。《白虎通》雲：“古者刑殘之人，公家不畜，大夫不養，士遇之路不與語，放諸墝埆不毛之地，與禽獸為伍。”○注《春秋傳》曰：近刑人則輕死之道”。○正義曰：此引《公羊傳》證刑人在君側之失者也。《春秋》魯襄公二十九年，“閽弒吳子餘祭。”《公羊》雲：“閽者何？刑人也。○君子不近刑人，近刑人則輕死之道也。”又《左傳》雲：“吳伐越，獲俘焉，以為閽，使守舟。吳子餘祭觀舟，閽以刀弒之。”" }
      - { type: j, text: "兵車不式，尚威武，不崇敬。武車綏旌，盡飾也。綏謂垂舒之也。武車亦兵車。○綏，耳隹反。德車結旌。不盡飾也。結謂收斂之也。德車，乘車。" }
      - { type: z, text: "“兵車”至“結旌”。○正義曰：此一節明德車兵車旌旗之異。○“兵車”，革路也。兵車尚武猛，宜無推讓，故不為式敬也。○“武車綏旌”者，武車亦革路也。取其建戈刃，即雲兵車。取其威猛，即雲武車也。綏謂舒垂散之也。旌謂車上旗幡也。尚威武，故舒散旗幡垂綏然。何胤雲：“垂放旌旗之旒，以見於美也。”○“德車結旌”者，德車謂玉路、金路、象路、木路，四路不用兵，故曰德車。德美在內，不尚赫奕，故結纏其旒，著於竿也。何胤雲：“以德為美，故略於飾。此坐乘之車也。”鄭前雲“乘車必正立”，此雲是乘車，則非坐乘也。" }
      - { type: j, text: "史載筆，士載言。謂從於會同，各持其職以待事也。筆謂書具之屬，言謂會同盟要之辭。前有水，則載青旌。前有塵埃，則載鳴鳶。前有車騎，則載飛鴻。前有士師，則載虎皮。前有摯獸，則載貔貅。載謂舉於旌首以警眾也。禮，君行師從，卿行旅從。前驅舉此，則士眾知所有，所舉各以其類象。青，青雀，水鳥。鳶鳴則將風。鴻，取飛有行列也。士師謂兵眾。虎，取其有威勇也。貔貅亦摯獸也。《書》曰：“如虎如貔。”士或為仕。○載音戴，本亦作戴，下及注同。埃，烏來反。鳶，悅專反，鴟也。騎，其寄反。摯音至。貔，婢支反，徐扶夷反。孔安國雲：“貔，執夷反，虎屬，皆猛健。”貅，本亦作<豸木>，許求反，又虛虯反。貔貅，摯獸。警音景。從，才用反，下同。行，戶剛反。行，前朱鳥而後玄武，左青龍而右白虎，招搖在上，急繕其怒。以此四獸為軍陳，象天也。急猶堅也。繕讀曰勁。又畫招搖星於旌旗上，以起居堅勁，軍之威怒，象天帝也。招搖星在北斗杓端，主指者。○招搖，並如字，北斗第七星。繕，依注音勁，吉政反，陳直覲反。杓，敷招反，徐必遙反。進退有度，度謂伐與步數。左右有局，各司其局。局，部分也。○分，扶問反。" }
      - { type: z, text: "“史載”至“其局”。○正義曰：此一節明君以軍行之禮，各隨文解之。○“史”謂國史，書錄王事者。王若舉動，史必書之。王若行往，則史載書具而從之也。不言簡牘而云筆者，筆是書之主，則餘載可知。《爾雅》雲：“不律謂之筆。”郭雲：“書筆名，四方之異言也。”○“士載言”者，士謂司盟之士，言謂盟會之辭，舊事也。崔靈恩雲：“必載盟會之辭者，或尋舊盟，或用舊會之禮，應須知之，故載自隨也。”○“前有水，則載青旌”者，王行宜警衛，惡善必先知之，故備設軍陳行止之法也。軍陳卒伍行，則並銜枚，無喧聲。若有非常，不能傳道，且人眾廣遠，難可週遍，故前有變異，則舉類示之，故宣十二年《左傳》雲“前茅慮無”是也。青旌者，青雀旌，謂旌旗。軍行若前值水，則畫為青雀旌旗幡上，舉示之。所以然者，青雀是水鳥，軍士望見，則鹹知前必值水而各防也。○“前有塵埃，則載鳴鳶”者，鳶，今時鴟也。鴟鳴則風生，風生則塵埃起。前有塵埃起，則畫鴟於旌首而載之，眾見鹹知，以為備也。不直言鳶而云鳴者，鳶不鳴則風不生，故畫作開口，如鳴時也。不言旌，從可知也。○“前有車騎，則載飛鴻”者，車騎，彼人之車騎也。鴻，鴻雁也。雁飛有行列，與車騎相似，若軍前忽遙見彼人有多車騎，則畫鴻於旌首而載之，使眾見而為防也。然古人不騎馬，故但經記正典，無言騎者。今言騎者，當是週末時禮。○“前有士師，則載虎皮”者，士師，兵眾也。虎是威猛，亦兵眾之象。若見前有兵眾，則舉虎皮於竿首，使兵眾見以為防也。○“前有摯獸，則載貔貅”者，摯獸，猛而能擊，謂虎狼之屬也。貔貅是一獸，亦有威猛也。若前有猛獸，則舉此貔貅，使眾知為備也。但不知為載其皮，為畫其形耳。通有二家，一雲與虎皮並畫作皮於旌也，一雲並載其皮。○注“載謂”至“如貔”。○正義曰：“載謂舉於旌首以警眾也”，文併為載，而鄭今雲“舉於旌首”，是明諸物並在旌旗首也。雲“禮，君行師從，卿行旅從”，此是定四年祝佗之辭，此嘉好之事，若為其出軍征伐，則隨軍多少，與此不同。雲“《書》曰：如虎如貔”者，此《尚書·牧誓》，引證虎、貔同是猛獸也。此武王伐紂時，於牧野作誓，誡士卒為戰之辭也，令士眾皆如虎貔然也。鄭注《尚書》雲：“其威當如獸之將攫搏也。”貔一名曰豹，虎類也。《爾雅》雲：“貔，白狐也。”“行，前朱鳥而後玄武，左青龍而右白虎”者，前明軍行逢值之禮也，此明軍行象天文而作陳法也。前南後北，左東右西。朱鳥、玄武、青龍、白虎，四方宿名也。軍前宜捷，故用鳥。軍後須殿捍，故用玄武。玄武，龜也，龜有甲，能禦侮用也。左為陽，陽能發生，象其龍變生也。右為陰，陰沈能殺，虎，沈殺也。軍之左右生殺，變應威猛如龍虎也。何胤雲：“如鳥之翔，如蛇之毒，龍騰虎奮，無能敵此四物。”鄭注四獸為軍陳，則是軍陳之法也，但不知何以為之耳，今之軍行，畫此四獸於旌旗，以標左右前後之軍陳。○“招搖在上”者，招搖，北斗七星也。北斗居四方宿之中，以鬥末從十二月建而指之，則四方宿不差。今軍行法之，亦作此北斗星在軍中，舉之於上，以指正四方，使四方之陳不差，故云“招搖在上”也。然並作七星，而獨雲“招搖”者，舉指者為主，餘從可知也。○“急繕其怒”者，嚮明軍陳之法，此舉士卒之用也。急，堅也。勁，利也。其怒，士卒之怒也。軍行既張四宿於四方，標招搖於中，上象天之行，故軍旅士卒起居舉動，堅勁奮勇，如天帝之威怒也。然若類前而論四宿之陳，畫旌為勝；且鄭雲“又畫招搖於旌上”，則知四物是畫，故星約言云“又畫”也。崔靈恩雲：“此謂軍行所置旌旗於四方以法天。此旌之旒數皆放其星，龍旗則九旒，雀則七旒，虎則六旒，龜蛇則四旒，皆放星數以法天也，皆畫招搖於此四旗之上。”案崔並畫四旗，皆為北斗星，於義不安。何者？天唯一斗以指四方，何用四鬥乎？○注“以此”至“指者”。○正義曰：此朱雀是禽，而總言“獸”者，通言耳。言“為君陳”者，則四獸各有軍陳之法，故昭二十一年宋人與華亥戰，雲：“鄭翩原為鸛，其御願為鵝。”又《兵書》雲：“善用兵者似率然。”率然者，常山蛇，擊其首則尾至，擊其尾則首至，擊其中則首尾俱至，是其各有陳法也。知“招搖在北斗杓端”者，《春秋運鬥樞》雲：“北斗七星，第一天樞，第二旋，第三機，第四權，第五衡，第六開陽，第七搖光。第一至第四為魁，第五至第七為標。”案此搖光則招搖也。在下雲端者，明魁以上為首，標則以下為端也。○注“度謂伐與步數”。○正義曰：《牧誓》武王誓眾雲：“今日之事，不愆於六步七步，乃止齊焉。”“四伐五伐，乃止齊焉。”一擊一剌為一伐。鄭注《尚書》雲：“伐謂擊剌也。”始前既敵，六步七步當止，齊正行列，及兵相接，少者四伐，多者五伐，又當止。齊正行列也。○“左右有局”者，局，部分也。軍之在左右，各有部分，不相濫也。○“各司其局”者，軍行須監領，故主帥部分，各有所司部分也。《爾雅》雲：“局，分也。”郭雲：“謂分部也。”" }
      - { type: j, text: "父之仇弗與共戴天，父者子之天，殺己之天，與共戴天，非孝子也。行求殺之，乃止。○仇，常由反。兄弟之仇不反兵，恆執殺之備。交游之仇不同國。仇不吾闢，則殺之。交游，或為“朋友”。" }
      - { type: z, text: "“父之”至“同國”。○正義曰：此一節論親疏復仇之法，今各依文解之。○“父之仇弗與共戴天”者，父是子之天。彼殺己父，是殺己之天，故必報殺之，不可與共處於天下也。天在上，故曰戴。又《檀弓》雲，父母之仇，“寢苫枕幹，不仕，弗與共天下也。遇諸市朝，不反兵而鬥”，並是不共天下也。而《調人》雲，父之仇闢諸海外，則得與共戴天。此不共戴天者，謂孝子之心，不許共仇人戴天，必殺之乃止。《調人》謂逢遇赦宥王法，闢諸海外，孝子雖欲往殺，力所不能，故鄭答趙商雲：“仇若在九夷之東，八蠻之南，六戎之西，五狄之北，雖有至孝之心，能往討之乎？”是也。○“兄弟之仇不反兵”者，兄弟謂親兄弟也。有兄弟之仇，乃得仕而報之，“不反兵”者，謂帶兵自隨也。若行逢仇，身不帶兵，方反家取之，比來則仇已逃闢，終不可得，故恆帶兵，見即殺之也。《檀弓》雲，父母之仇“不反兵”，兄弟之仇“仕弗與共國”，而此雲兄弟不反兵者，父母不反兵於普天之下也；兄弟不共國，謂不同中國也，而亦不反兵者，父母仇讎則不仕，不闢市朝，兄弟仇讎，則猶仕而闢市朝也，而亦同不反兵，則同體重之也。而《調人》雲：“兄弟之仇，闢諸千里之外。”二文不同者，《調人》亦謂會遇恩赦之法，闢諸千里之外。《檀弓》又云：“銜君命而使，雖遇之不鬥。”雖同不反兵，與父母仇異也。○“交游之仇不同國”者，交游，朋友也，為朋友亦報仇也。故前雲“父母存，不許友以死”。則知父母沒，得為朋友報也。此雲“不同國”者，謂不共五等一國之中也。而《調人》雲：“從父母兄弟之仇不同國。”與此同。又《調人》雲：“主友之仇，視從父兄弟。”是主友亦同。此與《調人》皆謂會赦，故不同國。雖不同國，國外百里二百里則可。其兄弟仕不與共國者，必須相去千里之外，故《調人》雲：“兄弟之仇，闢諸千里之外”是也。但從父兄弟及交游、主友報仇之時，不自為首，故《檀弓》雲從父兄弟之仇“不為魁，主人能，則執兵而陪其後”也。其君之仇，《調人》雲“視父，師長之仇視兄弟”，則姑姊妹伯叔，皆視兄弟。《異義》：“《公羊》說復百世之仇，《古周禮》說復仇之義不過五世。許慎謹案：魯桓公為齊襄公所殺，其子莊公與齊桓公會，《春秋》不譏；又定公是魯桓公九世孫，孔子相定公，與齊會於夾谷：是不復百世之仇也。從《周禮》說。”鄭康成不駁，即與許慎同。“凡君非理殺臣，《公羊》說，子可復仇，故子胥伐楚，《春秋》賢之。《左氏》說，君命，天也，是不可復仇”。鄭《駁異義》稱：“子思雲：‘今之君子退人，若將隊諸淵，無為戎首，不亦善乎？’子胥父兄之誅，隊淵不足喻，伐楚使吳首兵，合於子思之言也。”是鄭善子胥，同《公羊》之義也。" }
      - { type: j, text: "四郊多壘，此卿大夫之辱也。辱其謀人之國，不能安也。壘，軍壁也，數見侵伐則多壘。○壘，徐力軌反，又力水反。闢本又作壁，布狄反。數，色角反。地廣大，荒而不治，此亦士之辱也。辱其親民不能安。荒，穢也。" }
      - { type: z, text: "“四郊”至“辱也”。○正義曰：此明食祿所宜任其事也。四郊者，王城四面並有郊，近郊五十里，遠郊百里；諸侯亦各有四面之郊，裏數隨地廣狹，故云“四郊”也。壘，軍壁也。言卿大夫尊高，任當軍帥，若有威德，則無敢見侵。若尸祿素餐，則寇戎充斥，數戰郊坰，故多軍壘。罪各有所歸，故為卿大夫之恥辱也。○“地廣大，荒而不治，此亦士之辱也”者，地，采地也。荒，廢穢也。士，邑宰也。士為君邑宰，必宜地民相得，若使土地廣大而荒廢，民散而流移，亦邑宰之恥辱也。而云“亦”者，今謂非但大夫之辱，亦是士之辱。言四郊多壘，獨為大夫之辱。士則職卑位下，為君邑宰，勸課耕稼，故地荒為士之辱也。" }
      - { type: j, text: "臨祭不惰。為無神也。○為，於偽反，下“為不”、“為其”、“為有”皆同。祭服敝則焚之，祭器敝則埋之，龜筴敝則埋之，牲死則埋之。此皆不欲人褻之也。焚之，必已不用；埋之，不知鬼神之所為。○埋，徐武乖反。褻，息列反，慢也。凡祭於公者，必自徹其俎。臣不敢煩君使也。大夫以下，或使人歸之。祭於公，助祭於君也。○使，色吏反。" }
      - { type: z, text: "“臨祭”至“其俎”。○正義曰：此一節明接神及歸俎之禮。○“臨祭不惰”者，祭如在，故臨祭須敬，不得怠惰，故鄭注云：“為無神也。”鬼神享德，祭若怠惰，則神不歆，是無神也。既謂其不敬，亦是無神之心也。○注“此皆不欲人褻之“。○正義曰：若不焚埋，人或用之，為褻慢鬼神之物。所以“焚之”、“埋之”異者，服是身著之物，故焚之；牲器之類，併為鬼神之用，雖敗，不知鬼神用與不用，故埋之猶在，焚之則消，故焚、埋異也。○注“臣不”至“君也”。○正義曰：此謂士助君祭也。若大夫以上，則君使人歸之於俎。而《禮》本並雲“大夫以下，或人歸之”，是鄭因君以明臣，言大夫以下，自祭其廟，則使人歸賓俎。故《曾子問》雲“攝主不歸俎”，明正主則歸也。" }
      - { type: j, text: "卒哭乃諱。敬鬼神之名也。諱，闢也。生者不相闢名。衛侯名惡，大夫有名惡，君臣同名，《春秋》不非。○闢音避，下皆同。禮，不諱嫌名，二名不偏諱。為其難闢也。嫌名，謂音聲相近，若禹與雨、丘與區也。偏，謂二名不一一諱也。孔子之母名徵在，言在不稱徵，言徵不稱在。○禹與雨，並於矩反，一讀雨音於許反。丘與區，並去求反，一讀區音羌虯反，又丘於反。案漢和帝名肇，不改京兆郡；魏武帝名操，陳思王詩云“修阪造雲日”；是不諱嫌名。逮事父母，則諱王父母。不逮事父母，則不諱王父母。逮，及也。謂幼孤不及識父母，恩不至於祖名。孝子聞名心瞿，諱之由心，此謂庶人。適士以上，廟事祖，雖不逮事父母，猶諱祖。○逮音代，一音大計反。瞿，本又作懼，同，俱附反。邑，丁歷反。君所無私諱，謂臣言於君前，不闢家諱，尊無二。大夫之所有公諱。闢君諱也。《詩》、《書》不諱，臨文不諱。為其失事正。廟中不諱。為有事於高祖，則不諱曾祖以下，尊無二也。於下則諱上。夫人之諱，雖質君之前，臣不諱也。臣於夫人之家，恩遠也。質猶對也。婦諱不出門，婦親遠，於宮中言闢之。大功、小功不諱。入竟而問禁，入國而問俗，入門而問諱。皆為敬主人也。禁謂政教，俗謂常所行與所惡也。國，城中也。○竟音境。惡，烏路反。" }
      - { type: z, text: "“卒哭”至“問諱”。○正義曰：此一節論諱與不諱之事，各依文解之。○古人生不諱，故卒哭前，猶以生事之，則未諱。至卒哭後，服已受變，神靈遷廟，乃神事之，敬鬼神之名，故諱之。諱，避也。生不相避名，名以名質，故言之不諱。死則質藏，言之則感動孝子，故諱之也。○注“衛侯”至“不非”。○正義曰：證生不相諱也。時君臣同名，《春秋》不譏。案魯襄公二十八年，“衛石惡出奔晉”；二十九年，“衛侯衎卒”，衛侯惡乃即位；與石惡不相干，熊氏雲：“石字誤，當雲大夫有名惡。知者，昭七年‘衛侯惡卒’，《穀梁傳》雲：‘昭元年有衛齊惡，今衛侯惡，何謂君臣同名也？’君子不奪人親所名也。是衛齊惡不得為石惡也。”○“禮，不諱嫌名”，注“若禹與雨、丘與區”。○正義曰：今謂禹與雨音同而義異，丘與區音異而義同，此二者各有嫌疑，禹與雨有同音嫌疑，丘與區有同義嫌疑，如此者不諱。若其音異義異，全是無嫌，不涉諱限，必其音同義同，乃始諱也。○“二名不遍諱”，注“孔子之母名徵在，言在不稱徵，言徵不稱在”。○正義曰：“不遍諱”者，謂兩字作名，不一一諱之也。孔子言徵不言在，言在不言徵者，案《論語》雲“足則吾能徵之矣”。是言徵也；又云“某在斯”，是言在也。案《異義》：“《公羊》說譏二名，謂二字作名，若魏曼多也。《左氏》說二名者，楚公子棄疾弒其君，即位之後，改為熊居，是為二名。許慎謹案：雲文武賢臣有散宜生、蘇忿生，則《公羊》之說非也，從《左氏》義也。”“逮事王父母”者，逮，及也。“王父母”謂祖父母也，若及事父母，則諱祖也。何以然？孝子聞名心瞿，祖是父之所諱，則子不敢言。既已終不言，若父母已亡，而己言便心瞿憶父母，故諱之也。○“不逮事父母，則不諱王父母”者，孝子若幼少孤，不及識父母，便得言之，故不諱祖父母。庾雲：“諱王父母之恩，正應由父。所以連言母者，婦事舅姑，同事父母，且配夫為體，諱敬不殊，故幼無父而識母者，則可以諱王父母也。”○注“此謂”至“諱祖”。正義曰：“適士已上，廟事祖”者，《祭法》雲適士二廟，祖之與禰各一廟，其中士下士亦廟事祖，但祖、禰共廟，則《既夕禮》一廟是也。熊氏雲：“此適士者，包中下士，對庶人府史亦稱適也。”○“大夫之所有公諱”者，今謂人於大夫之所，止得避公家之諱，不得避大夫諱，所以然者，尊君諱也。若兼為大夫諱，則君諱不尊也。不言士之所諱者，士卑，人不為之諱故也。或可大夫所有公諱者，君及大夫諱耳，亦無己之私諱。《玉藻》雲：“於大夫所有公諱，無私諱。”但此文上承“君所有私諱”之下，唯雲“大夫之所有公諱”，故略之，不雲無私諱耳。○“《詩》、《書》不諱”，何胤雲：“《詩》、《書》謂教學時也。臨文謂禮執文行事時也。”案《論語》雲“《詩》、《書》執禮”，是教學惟《詩》、《書》有誦，禮則不誦。惟臨文行事，若有所諱，則並失事正，故不諱也。○“廟中不諱”者，謂有事於高祖廟，祝嘏辭說，不為曾祖已下諱也。為尊無二上也，於下則諱上也。若有事於禰，則諱祖已上也。○“夫人之諱，雖質君之前，臣不諱也”者，夫人，君之妻。質，對也。夫人本家所諱，臣雖對君前，而言語不為諱也。臣於夫人之家恩遠，故不諱也。○“婦諱不出門”者，門謂婦宮門。婦家之諱，但於婦宮中不言耳。若於宮外，則不諱也。故臣對君不諱也。○注“婦親遠，於宮中言闢之”。陳鏗問雲：“《雜記》：‘母之諱，宮中諱。妻之諱，不舉諸其側也。’此則與母諱同，何也？”田瓊答曰：“《雜記》方分尊卑，故詳言之。《曲禮》據‘不出門’，大略言之耳。母諱遠，妻諱近，則亦宜言也，但所闢者狹耳。”○“大功小功不諱”者，古者期親則為諱。陳鏗問曰：“亦為父乎？自已親乎？”田瓊答曰：“《雜記》雲：‘卒哭而諱。王父母、兄弟、世父、叔父、姑、姊妹，子與父同諱。’父諱齊衰親也，然則大功小功不諱矣。”熊氏雲：“大功亦諱，小功不諱。若小功與父同諱，則亦諱之。知者，《雜記》雲：‘王父母、兄弟、世父、叔父、姑、姊妹、子與父同諱。’是父之世叔父及姑姊妹以下，皆為之小功，父為諱，故己從父為之諱。”○“入境而問禁”者，此以下併為敬主人也。竟，界首也。禁謂國中政教所忌。凡至竟界，當先訪問主國何所禁也。“入國而問俗”者，○國，城中。城中如今國門內也。俗謂常所行也。入主人之城內，亦先問風俗常行也。○“入門而問諱”者，門，主人之門也。諱，主人祖先君名，宜先知之，欲為避之也。問諱而以門為限者，主人出至大門外迎客，客入門，方應交接，故於門為限也。故注云：“皆為敬主人也。”" }
      - { type: j, text: "外事以剛日，順其出為陽也。出郊為外事。《春秋傳》曰：“甲午祠兵”。內事以柔日。順其居內為陰。凡卜筮日，旬之外曰“遠某日”，旬之內曰“近某日”。旬，十日也。○筮，市制反。喪事先遠日，吉事先近日。孝子之心。喪事，葬與練祥也。吉事，祭祀冠取之屬也。○冠，古亂反。曰：“為日，假爾泰龜有常，假爾泰筮有常。”命龜筮辭。龜筮於吉凶有常，大事卜，小事筮。○假，古雅反，下同。卜筮不過三，求吉不過三。魯四卜郊，《春秋》譏之。卜筮不相襲。卜不吉則又筮，筮不吉則又卜，是瀆龜策也。晉獻公卜取驪姬不吉，公曰“筮之”是也。○瀆，徒木反。驪，力知反。" }
      - { type: z, text: "“外事”至“相襲”。○正義曰：此一節明卜筮及用日之法，各依文解之。○“外事以剛日”者，外事，郊外之事也。剛，奇日也。十日有五奇、五偶，甲、丙、戊、庚、壬五奇為剛也。外事剛義，故用剛日也。○注“順其”至“祠兵”。○正義曰：以出在郊外，故順用剛日也。《公羊》莊公八年“正月，師次於郎，以俟陳人、蔡人。甲午祠兵”。傳雲：“祠兵者何？出曰祠兵。”何休雲：“禮，兵不徒使，故將出兵，必祠於近郊。”此鄭所引，直取甲午證用剛日事耳，其“祠兵”之文，鄭所不用。故《異義》“《公羊》說以為甲午祠兵，《左氏》說甲午治兵”，鄭駁之雲：《公羊》字誤也，以治為祠，因為作說。引《周禮》四時田獵、治兵振旅之法，是從《左氏》之說，不用《公羊》也。○“內事以柔日”者，內事，郊內之事也。乙、丁、己、辛、癸五偶為柔也。然則郊天是國外之事，應用剛日，而《郊特牲》雲“郊之用辛”，非剛也。又社稷是郊內，應用柔日，而《郊特牲》雲祀社“日用甲”，非柔也。所以然者，郊社尊，不敢同外內之義故也。此言外剛內柔，自謂郊社之外，他禮則皆隨外內而用之。崔靈恩雲：“外事指用兵之事，內事指宗廟之祭者。以郊用辛，社用甲，非順其居外內剛柔故也。祭社用甲，所以召誥用戊者，召誥是告祭，非常禮也。郊之用辛者，唯夏正郊天及雩大享明堂耳。若圜丘自用冬至日，五時迎氣，各用其初朔之日，不皆用辛。”○“凡卜筮日”者，凡先聖王之所以立卜筮者，下雲“所以使民信時日，敬鬼神，決嫌疑，定猶與”也。卜筮必用龜蓍者，案劉向雲：“蓍之言耆，龜之言久。龜千歲而靈，蓍百年而神，以其長久，故能辯吉凶也。”《說文》雲：“蓍，蒿屬也。生千歲，三百莖，《易》以為數。天子九尺；諸侯七尺，大夫五尺，士三尺。”陸機《草木疏》雲：“似藾蕭，青色，科生。”《洪範五行傳》曰：“蓍生百年，一本生百莖。”《論衡》雲：“七十年生一莖，七百年十莖，神靈之物，故生遲也。”《史記》曰：“滿百莖者，其下必有神龜守之，其上常有云氣覆之。”《淮南子》雲：“上有叢蓍，下有伏龜。卜筮實問於神，龜筮能傳神命以告人。故《金縢》告大王、王季、文王雲‘爾之許我’，乃卜三龜，一襲吉。是能傳神命也。”又鄭注《天府》雲：“卜筮實問於鬼神，龜筮能出其卦兆之佔耳。”案《白虎通》稱：“《禮三正記》天子龜一尺二寸，諸侯一尺，大夫八寸，士六寸。龜，陰也，故其數偶。”筮者，案《少牢》“大夫立筮”鄭雲：“大夫蓍長五尺。”推此而言，天子九尺，諸侯七尺，士三尺。蓍，陽也，故其數奇。所以謂之“卜筮”者，師說雲：卜，覆也，以覆審吉凶；筮，決也，以決定其惑。劉氏以為卜，赴也，赴來者之心；筮，問也，問筮者之事。赴、問互言之。案《易·系辭》雲：“定天下之吉凶，成天下之亹亹者，莫大乎蓍龜。”又云：“蓍之德圓而神，卦之德方以知，神以知來，知以藏往。”又《說卦》雲：“昔者聖人幽贊於神明而生蓍。”據此諸文，蓍龜知靈相似，無長短也。所以僖四年《左傳》雲，“筮短龜長，不如從長者”，時晉獻公卜娶驪姬，不吉，更欲筮之，故太史史蘇欲止公之意，託雲筮短龜長耳，實無優劣也。若杜預、鄭玄因筮短龜長之言，以為實有長短，故杜預注傳雲“物生而後有象，象而後有滋，滋而後有數，龜象筮數，故象長數短”是也。象所以長者，以物初生則有象，去初既近，且包羅萬形，故為長。數短者，數是終末，去初既遠，推尋事數，始能求象，故以為短也。又鄭康成注《占人》雲：“占人亦占筮，言掌佔龜者。筮短龜長，主於長者。”是鄭及杜預皆以為龜長筮短。凡卜筮，天子諸侯若大事則卜筮並用，皆先筮後卜，故《筮人》雲：“凡國之大事，先筮而後卜。”即事之漸。大事者，則《大卜》雲“國大貞，卜立君，卜大封，大祭祀，凡出軍旅喪事”，及“龜之八命，一曰徵，二曰象，三曰與，四曰謀，五曰果，六曰至，七曰雨，八曰瘳”，此等皆為大事。故鄭注《占人》雲“將卜八事，皆先以筮筮之”是也。若次事則唯卜不筮也。故《表記》雲：“天子無筮。”鄭注云：“謂征伐出師若巡守，天子至尊，大事皆用卜也。”是天子出行，唯卜無筮是也。小事無卜唯筮。《筮人》掌九筮之名，一曰筮更，謂遷都邑也。二曰筮鹹，鹹猶僉也，謂筮眾心歡不也。三曰筮式，謂製作法式也。四曰筮日，謂事眾，筮其要所當也。五曰筮易，謂民眾不說，筮所改易也。六曰筮比，謂與民和比也。七曰筮祠，謂筮牲與日也。八曰筮參，謂筮御與右也。九曰筮環，謂筮可致師不。鄭注《占人》“不卜而徒筮者，則用九筮”是也。天子既爾，諸侯亦然，故《春秋》僖二十五年，晉卜納襄王，得黃帝戰於阪泉之兆，又筮之，得大有之睽；哀九年晉卜伐宋，亦卜而後筮：是大事卜筮並用也。但《春秋》亂世，皆先卜後筮，不能如禮。其禮既先筮後卜，《尚書》先雲“龜從”者，以尊卑言之，故先言龜也。鄭注《周禮》雲：“筮兇則止，不卜。”所以《洪範》有“筮逆”、“龜從”者，崔靈恩雲：“凡卜筮，天子皆用三代蓍龜，若三筮並兇，則止而不卜。”鄭雲：“若一吉一兇，雖筮逆猶得卜之也。”則《洪範》所云者是也。其大夫則大事卜，小事筮。大事則葬地及葬日，為事之大則卜，故《雜記》雲“大夫卜宅與葬日”是也。其小事用筮，則《少牢》“常祀筮日”是也。士亦大事卜，小事筮，故《士喪禮》“卜葬日”，以喪葬為重，須定吉凶，故用卜也；其尋常吉祭，比葬為輕，故筮日也。葬既卜日得吉，餘事皆吉可知，故唯筮葬地不復用卜也。○“旬之外曰遠某日”者，案《少牢》大夫禮，今月下旬筮來月上旬，是旬之外日也。主人告筮者雲，欲用遠某日，故《少牢》雲“日用丁巳，筮旬有一日”，吉乃官戒。既雲“旬有一日”，是旬外一日。此謂大夫禮。○“旬之內曰近某日”者，案《特牲士禮》雲：“不諏日。”注云：“士賤職褻，時至事暇，可以祭，則筮其日。不如少牢大夫，先與有司於廟門諏丁巳之日。”是士於旬初即筮旬內之日，是旬之內日也。主人告筮者雲，用近某日。此據大夫士，故有旬內、旬外之日也。若天子諸侯，其有雜祭，或用旬內，或用旬外，其辭皆與此同。案《少牢》、《特牲》，其辭皆雲“來日丁亥”，不雲“遠某日”、“近某日”者，彼文不具也。○“喪事先遠日”者，喪事謂葬與二祥，是奪哀之義也。非孝子之所欲，但制不獲已，故卜先從遠日而起，示不宜急，微伸孝心也。故宣八年《左傳》雲：“禮，卜葬先遠日，闢不懷。”杜雲：“懷，思也。”闢不思親也。此尊卑俱然，雖士亦應今月下旬先卜來月下旬。不吉，卜中旬。不吉，卜上旬。○“吉事先近日”者，吉事，謂祭祀、冠婚之屬，故《少牢》雲：“若不吉，則及遠日，又筮日如初。”是“先近日”也。○“曰為”至“有常”者，曰，命龜筮辭也。卜擇吉日，故云“曰為日”。○“假爾泰龜有常，假爾泰筮有常”者，假，因也。爾，汝也。爾謂指蓍龜也。泰，大中之大也。欲褒美此龜筮，故謂為泰龜泰筮也。“有常”者，言汝泰龜泰筮決判吉凶，分明有常也。故云“假爾泰龜”、“泰筮有常”。凡卜筮，大夫以上命龜有三，命筮有二。其一為事命龜，蒞卜之官，以主人卜事命卜史，是一也。二，卜史既得所卜之命，更序述蒞卜所陳之辭，名曰述命，二也。卜人即席，西而命龜雲“假爾泰龜有常”，三也。命筮二者，一為事命筮，則主人以所為之事命筮史，是一也。二則筮史得主人之命，遂述之，為述命，是二也。士則命龜有二，命筮有一。知士命筮有一者，《士喪禮》雲：“命筮人，哀子某，為其父筮宅。”“筮人許諾，不述命。”注云：“不述者，士禮略。”是士命筮一也。知士命龜二者，《士喪禮》：“蒞卜，命曰：‘哀子某，卜葬其父，無有近悔。’許諾，不述命。”乃雲“即席，西面坐，命龜”。既雲“不述命”，是士命龜二也。知大夫命筮二者，以士雲命筮不述命，則知大夫以上述命也。故《少牢》雲：“主人曰：‘孝孫某，來日丁亥，用薦歲事於皇祖伯某。’”又云：“史遂述命，曰：‘假爾泰筮有常，孝孫某，來日丁亥’”云云。是大夫命筮二，但冠即席所命於述命之上也。知大夫命龜三者，以《士喪禮》蒞卜為事命龜，又有即席西面命龜，雲“不述命”，明大夫有述命，故知大夫命龜三也。○注“大事卜，小事筮”。○正義曰：此大事者，謂小事之中為大事，非《周禮》大貞、大封及八事之等，故得用卜而已。或雲“大事卜”者，總兼大貞、大封及八事等，雖卜筮並用，總皆用卜，故云“大事卜”。但大事則先筮後卜，卜筮俱有，若小事筮，徒有筮而無卜也。○“卜筮不過三”者，王肅雲：禮以三為成也。上旬、中旬、下旬，三卜筮不吉，則不舉也。鄭意“不過三”者，謂一卜不吉而兇，又卜，以至於三，三若不吉則止，若筮亦然也。故魯有四卜之譏。崔靈恩雲：“謂不過三用。若大事龜筮並用者，先用茸荃筮，次用茸荃龜，始是一也。三如是乃為三也。若初始之時，三筮三龜皆兇，則止。或逆多從少，或從多逆少，如此者皆至於三也。單卜單筮，其法惟一用而已，不吉則擇遠日，不至於三也。前以用茸荃之龜筮者，有逆有從，故至三也。此唯用一，故不至三也。”案崔解亦有茸荃龜筮也。○注“魯四卜郊，《春秋》譏之”。○正義曰：卜郊之事，或三或四或五。襄七年夏四月，“三卜郊，不從，乃免牲”。僖三十一年及襄十一年夏四月，“四卜郊，不從”。成十年夏四月，“五卜郊，不從”。三傳之說，參差不同。若《左氏》之說，魯郊常祀，不須卜可郊與否，俱卜牲與日，唯周之三月為之，不可在四月，雖三卜亦為非禮，故僖三十一年《左傳》雲：“禮不卜常祀。”是常祀不卜也。襄七年《左傳》雲：“啟蟄而郊，郊而後耕。今既耕而卜郊，宜其不從也。”是用周之三月，不可至四月也。若《公羊》之義，所云卜者，皆為卜日，故僖三十一年《公羊傳》雲：“三卜，禮也。四卜，非禮也。”又成十七年《公羊傳》雲：“郊用正月上辛。”何休雲：“魯郊搏卜三正，茸荃之郊，一用夏正。”又定十五年：“禮，三卜之運也。”何休雲：“運，轉也。已卜春三正，不吉，復轉卜夏三月，週五月，得二吉，故五月郊。”如休之意，魯郊轉卜三正，假令春正月卜不吉，又卜殷正，殷正不吉，則用夏正郊天。若此三正之內，有兇不從，則得卜夏三月，但滿三吉日，則得為郊。此《公羊》及何休之意也。《穀梁》之說，《春秋》卜者皆卜日也。哀元年《穀梁傳》雲：“郊自正月至三月，郊之時也。”或以十二月下辛卜正月上辛。卜如不從，則以正月下辛，卜二月上辛。如不從，則以二月下辛卜三月上辛。如不從，則不郊。如是《穀梁》三正正月卜吉，則為四月，五月則不可，與《公羊》之說同，與何休意異休以四月五月卜滿三吉，則可郊也。若鄭玄意，禮不當卜常祀，與《左氏》同，故鄭《箴膏肓》雲：“當卜祀日月爾，不當卜可祀與否。”鄭又云：“以魯之郊天，惟用周正建子之月，牲數有災不吉，改卜後月，故或用周之二月三月，故有啟蟄而郊，四月則不可。”故《駁異義》引《明堂》雲：“孟春正月，乘大路，祀帝於郊。”又云：“魯用孟春建子之月，則與天子不同明矣。魯數失禮，牲數有災不吉，則改卜後月。”如鄭之言，則與《公羊》、《穀梁傳》卜三正不同也。此雲“魯四卜郊，《春秋》譏之”，用《公羊》、《穀梁傳》三卜正、四卜非正也。是四卜為譏，三卜得正，與《左氏》意違。《左氏》三卜亦非故也。○“卜筮不相襲”者，襲，因也。前卜不吉則止，不得因更筮。若前筮不吉則止，不得因更卜，是“不相襲”也。若相因不止，是瀆龜筮，則神不告也。王雲：“三筮及三卜不相襲，三者初各專其心也。”○注“卜不”至“是也”。○正義曰：晉獻公初卜不吉，故公雲“更筮之”，是因襲也。《表記》雲：“卜筮不相襲。”鄭雲：“襲，因也。大事則卜，小事則筮。”然與此注不同者，明襲有二義，故兩注各舉其一。一則大事小事，各有所施，不得因龜卜小事，因蓍筮大事也。二則筮不吉，不可復卜，卜不吉，不可復筮也。" }
      - { type: j, text: "龜為卜，筴為筮。卜筮者，先聖王之所以使民信時日，敬鬼神，畏法令也。所以使民決嫌疑，定猶與也。故曰：“疑而筮之，則弗非也。日而行事，則必踐之。”弗非，無非之者。日，所卜筮之吉日也。踐讀曰善，聲之誤也。策或為蓍。○與音預，本亦作豫。踐，依注音善，王如字，雲：“履也。”蓍音屍。" }
      - { type: z, text: "“龜為”至“踐之”。○正義曰：解卜筮所用也。龜處筮後，龜覆於筮。策為筮者，筮在龜前為決也。謂蓍為策者，策以謀筴為義，言用此物以謀於前事也。○“卜筮者，先聖王之所以使民信時日”者，解所以須卜筮之義也。“先聖王”，伏羲以來聖人為天子者。不直雲先王，又加聖字者，夫王未必聖，古來非一，聖不必王，孔子是也。明造制卜筮，必須聖位兼併。時者，四時及一日十二時也。日者，甲乙之屬。聖王制此卜筮，使民擇慎而信時日與吉凶也。○“敬鬼神”者，乃擇吉而祭祀，是“敬鬼神”也。“畏法令”者，法，典則也。令，教訓也。君行法令，若依卜筮而為之，則民敬而畏之也。○“所以使民決嫌疑”者，事既異，故更雲所以有嫌疑，而卜筮決斷之也。○“定猶與也”者，《說文》雲：“猶，獸名。玃屬。”與亦是獸名，象屬。此二獸皆進退多疑，人多疑惑者似之，故謂之“猶與”。○“故曰疑而筮之，則弗非也”者，引舊語以結之。卜筮所以定是非也。若有疑而筮之，則人無非之也。不言卜者，從何知也。○“日而行事，則必踐之”者，踐，善也。言卜得吉而行事，必善也。王雲：“卜得可行之日，必履而行之。踐，履也。弗非，無非之者也。”" }
      - { type: j, text: "君車將駕，則僕執策立於馬前。監駕，且為馬行。○監，古銜反。為，於偽反。已駕，僕展軨。展軨具視。○軨，歷丁反，一音領，盧雲：“車轄頭靻也。”舊雲車闌也。效駕，白已駕。奮衣由右上，取貳綏。奮，振去塵也。貳，副也。○上，時掌反，下“犬馬不上”、下注“而上車”同。去，羌呂反。跪乘，未敢立，敬也。○乘，繩證反，下“除乘”、“君不乘奇車”、“乘路馬”皆同。執策分轡，驅之五步而立。調試之。○轡，悲位反，四馬八轡，故云分。君出就車，則僕並轡授綏，車上僕所主。○並，必政反。左右攘闢。謂群臣陪位侍駕者。攘，卻也；或者攘，古讓字。○攘，如羊反，卻也，又音讓。闢音避，徐扶亦反，本或作避字，非也。車驅而騶，至於大門，君撫僕之手，而顧命車右就車，門閭、溝渠必步。車右，勇力之士，備制非常者。君行則陪乘，君式則下步行。○驅，起俱反，徐起遇反。騶，仕救反，又七須反，徐仕遘反。凡僕人之禮，必授人綏。若僕者降等，則受，不然則否。若僕者降等，則撫僕之手，不然則自下拘之。撫，小止之，謙也。自下拘之，由僕手下取之也。僕與己同爵則不受。○拘，古侯反，又音俱。客車不入大門，謙也。婦人不立乘，異於男子。犬馬不上於堂。非摯幣也。○贄，本亦作摯，音至。" }
      - { type: z, text: "“君車”至“於堂”。○正義曰：此以下總明乘車顧式僕御謹敬之事，各依文解之。○“君車將駕”者，為君僕御之禮。“君車”，君所乘之車也。“將駕”，謂始欲駕行時也。○“則僕執策立於馬前”者，僕即御車者也。古者僕用好人為之，故孔子曰：“吾執御矣。又云“子適衛，冉有僕”。及《周禮》諸僕皆用大夫士也。策，馬杖也。別有人牽馬駕車，而此僕既知車事，故監駕也。又恐馬奔走，故自執馬杖，立當馬前也。執策是監駕。立馬前，恐馬行也。○“已駕，僕展軨”者，已駕，駕竟。展，視也。舊解雲：“軨，車欄也。”駕竟，僕則從車軨左右四面看視之，上至於欄也。盧氏雲：“軨，轄頭靻也。”皇氏謂軨是轄頭。盧言是也。一則車行由轄，二則欄之。“苓”字不作“車”邊為之。鄭雲：“展軨具視，謂遍視之。”○“效駕”者，效，白也。僕監視駕竟，而入白君，道駕畢，故鄭雲“白已駕”也。○“奮衣由右上”者，奮，振也。由，從也。從右邊上升也。僕入白駕竟，先出就車，於車後自振其衣去塵，從右邊升上。必從右者，君位在左，故闢君空位。○“取貳綏”者，二，副也。綏，登車索。綏有二，一是正綏，擬君之升，一是副綏，擬僕右之升。故僕振衣畢，取副二綏而升也。《詩》雲：“淑旂綏章。”箋雲：“綏，所引登車也。”○“跪乘”者，謂僕先試車時，君既未出，未敢依常而立，所以跪而乘之為敬也。然此是暫試，空左不嫌也。○“執策分轡”者，策，馬杖也。轡，御馬索也。車有一轅而四馬駕之，中央兩馬夾轅者，名服馬，兩邊名騑馬，亦曰驂馬。故《詩》雲：“兩服上驤，兩驂雁行。”鄭雲：“兩服，中央夾轅者也。雁行者，言與中服相次序是也。”然每一馬有兩轡，四馬八轡，以驂馬內轡系於軾前，其驂馬外轡，並夾轅兩服馬各二轡，六轡在手，分置兩手，是各得三轡，故《詩》雲“六轡在手”是也。今言“執策分轡”，謂一手執杖，又六轡以三置空手中，以三置杖手中，故云“執策分轡”也。○“驅之”者，分轡既竟，而試驅行之也。○“五步而立”者，僕向跪而驅，令馬行之，得五步止，而僕倚立待君出也。何胤雲：“跪以見敬，則立調試之也。”○“君出就車”者，謂君始出上車時也。○“則僕並轡授綏”者，君初來欲上，而僕並六轡及策置一手中，所餘一空手取正綏授與君，令登車也。當右手並轡，左手授綏，轉身向後，引君上也。○“左右攘闢”者，左右謂侍駕陪位諸臣也。攘，卻也。闢，遠也。君已上車，車欲進行，故左右侍者悉遷卻以闢車，使不妨車行也。○“車驅而騶”者，左右已闢，故驅車而進，則左右從者，疾趨從車行也。○“至於大門”者，君至外門，謂車行至外門時也。○“君撫僕之手”者，撫，按止也。僕手執轡，車行由僕，君欲令駐車，故君抑止僕手也。○“而顧命車右就車”者，顧，回頭也。鄭箋《詩》雲：“回首曰顧也。”車右，勇力之士也。就車，謂君命勇力士，令上車也。車行則有三人，君在左，僕人中央，勇士在右也。初在門內，未顧勇士，勇士故從趍在車後。今車行既至大門，方出履險阻，恐有非常，故回頭命車右上車也。○“門閭、溝渠必步”者，是車右勇士之禮也。門閭，謂凡所過門閭處也。溝，廣深四尺者，渠亦溝也。步謂下車也。勇士雖即上車，車若至門閭、溝渠，而勇士必下車。所以然者，一則君子不誣十室，過門閭必式，君式則臣當下也。二則溝渠是險阻，恐有傾覆，故勇士亦須下扶持之也。而僕不下者，車行由僕，僕下則車無御，故不下也。“凡僕人之禮，必授人綏”者，“凡僕人”，謂為一切僕，非但為君僕時也。車上既僕為主，故為人僕，必授綏與所升之人也。○“若僕者降等，則受”者，謂士與大夫，大夫與卿御也。若御者卑降，則主人不須謙，故受取綏也。“不然則否”者，“不然”謂僕者敵體，雖御，其主人宜謙不受其綏也。○“若僕者降等，則撫僕之手”者，僕者雖卑，而受其綏不謙，猶當撫止僕手，若不聽自授，然後乃受也。○“不然則自下而拘之”者，“不然”，不降等者，既敵不受，而僕者必授，則主人當卻手從僕手下自拘取之。○注“撫小”至“不受”。○正義曰：由，從也。此時主人初欲上，而僕在車上，轉身向主人以授綏，主人不就僕手外取之，而以手從僕手下進，拘取僕手裏上邊，示不用僕授也。僕與已同爵則不受，謂不降等者。○“客車不入大門”者，案《公食大夫禮》雲：“賓之乘車在大門外西方。”注云：“賓車不入門，廣敬也。”與此同。《覲禮》雲：“偏駕不入王門。”謂同姓金路，異姓象路之等，舍之於賓館，謂不得入王門。又云“墨車龍旂以朝”，墨車得入大門，但不得入廟門耳。○“婦人不立乘”者，立，倚也。婦人質弱不倚乘，異男子也。男子倚乘，婦人坐乘，所以異也。○“犬馬不上於堂”者，賓主相見之禮也。犬馬將為禮而賤，不牽上堂也。犬則執紲，馬則執勒，以呈之耳，非贄幣故也。贄謂羔雁錦玉之屬，乃上堂也。犬馬用充庭實而已，非物聘之贄幣，故不上堂也。" }
      - { type: j, text: "故君子式黃髮，敬老也。發句言“故”，明此眾篇雜辭也。下卿位，尊賢也。卿位，卿之朝位也。君出過之而上車，入未至而下車。○朝，直遙反，下同。入國不馳，愛人也。馳，善藺人也。○藺，力刃反。入裏必式。不誣十室。君命召，雖賤人，大夫士必自御之。御當為訝。訝，迎也。君雖使賤人來，必自出迎之，尊君命也。《春秋傳》曰，跛者御跛者，眇者御眇者，皆訝也，世人亂之。御，依注音訝，五嫁反。跛，波我反。眇，名小反。介者不拜，為其拜而蓌拜。蓌則失容節，蓌猶詐也。○為其，於偽反，下注“為惑”、“為掩”同。蓌，子臥反，又側嫁反，挫也，沈租稼反，又子猥反，慮本作蹲。祥車曠左。空神位也。祥車，葬之乘車。乘君之乘車，不敢曠左，左必式。君存，惡空其位。○惡，烏路反。僕御婦人則進左手，後右手。遠嫌。○遠，於萬反。○御國君則進右手，後左手而俯。敬也。國君不乘奇車。出入必正也。奇車，獵衣之屬。○奇車，居宜反，奇邪不正之車，何雲：“不如法之車。”車上不廣咳，為若自矜。廣猶弘也。○咳，開代反。不妄指。為惑眾。立視五巂，立，平視也。巂猶規也，謂輪轉之度。巂或為。○巂，本又作雋，惠圭反，車輪轉一週為巂，一週丈九尺八寸也。，本又作蕊。如捶反，徐而愧反。式視馬尾，小俯。顧不過轂。為掩在後。國中以策彗血阝勿驅，塵不出軌。入國不馳，彗，竹帚。血阝勿，搔摩也。○彗音遂，徐雖醉反，又囚歲反。血阝，蘇役反，注同。勿音沒，注同。驅如字，又羌遇反。搔，素刀反。摩，莫何反。國君下齊牛，式宗廟。大夫士下公門，式路馬。乘路馬，必朝服。載鞭策，不敢授綏，左必式。步路馬，必中道。以足蹙路馬芻有誅，齒路馬有誅。皆廣敬也。路馬，君之馬。載鞭策，不敢執也。齒，欲年也。誅，罰也。○齊，側皆反。鞭，必綿反。蹙，本又作蹴，徐採六反，又子六反。芻，初俱反。" }
      - { type: z, text: "“故君”至“有誅”。○正義曰“此以下明雜敬禮也。君子謂人君也。黃髮，太老人也。人初老則發白，太老則發黃，發黃彌老，宜敬之，故人君見而式敬也。人君尚爾，則大夫士可知也。若與咀墁行，君式則臣下。若異行，則式而己。《詩》雲：“黃髮兒齒。”皆謂老人也。○注“發句言故，明此眾篇雜辭也”。○正義曰：謂他篇上舊禮雜辭，連上至下，所以有故，今作《曲禮記》者，引此他篇雜辭而來，為此篇發首有“故”也。○“下卿位”者，卿位，路門之內，門東北面位，故《論語·鄉黨》雲：“入公門。”又云：“過位，色勃如也。”注：“過位謂入門右北面君揖之位。”故《燕禮》、《大射》卿大夫門右，北面，公降阼階，南向，爾卿是也。今謂尋常出入，故出則過卿位而上車，入則未到卿位而下車。若迎賓客，則案《樂師》注云：“登車於大寢西階之前，反降於阼階之前。”或可“下卿位”是諸侯禮，《樂師》據天子禮。○“入國不馳”者，國中人多，若馳車則害人，故不馳。注云：“愛人也。馳，善藺人也。”善猶好也。藺，雷剌也。若車馳則好行剌人也。何胤雲：“藺，躐也。”○“入裏必式”者，二十五家為裏，里巷首有門，十室不誣，故入裏則必式而禮之為敬也。裏必式，則門閭亦式，故門閭必步，不誣十室也。《論語》雲：“十室之邑，必有忠信如丘者焉。”是“不誣十室”也。○“君命召”者，謂有君命呼召臣也。○“雖賤人”者，君之使者，假令是賤人為之來。○“大夫士必自御之”者，御，迎也。使者雖賤，而君命可尊，故雖大夫士貴，亦自出迎之也。○注“御當”至“亂之”。○正義曰：鄭引《春秋》證御者迓也。成二年，“季孫行父、臧孫許會晉郤克、衛孫良夫、曹公子首，及齊侯戰於鞍。”《公羊傳》雲：“前此者，晉郤克與臧孫許同時而聘於齊。蕭同侄子者，齊君之母也。窺客或跛或眇，於是使跛者迓跛者，眇者迓眇者。二大夫歸，相與率師為鞍之戰。”《穀梁傳》雲：“曹公子手僂，同時聘齊。齊頃公使跛者御跛者，眇者御眇者，禿者，御禿者，僂者御僂者。齊頃公母蕭同侄子處臺上而笑之也。”鄭言彼既以為訝，此御故宜是訝，而世人亂之，讀雲“御”耳。○“介者不拜”者，介，甲鎧也。著鎧者不為式敬，故宜無所拜之也。“為其拜而蓌拜”者，解所以不拜。蓌，挫也。戎容暨暨，著甲而屈拜，則坐損其戎威之容也。一雲蓌，詐也。言著鎧而拜，形儀不足，似詐也。虛作矯蓌，則失容節，是蓌猶詐也。○“祥車曠左”者，此以下又明僕御之禮。祥猶吉也，吉車為平生時所乘也。死葬時因為魂車，鬼神尚吉，故葬魂乘吉車也。曠，空也。車上貴左，故僕在右，空左以擬神也。○注“空神”至“乘車”。○知“葬之乘車”者，以其大小二祥，生人所乘之車，無空左之法，言空左，唯據葬時魂車，故知也。○“乘君之乘車，不敢曠左”者，乘車，謂君之次路也。王者五路，玉、象、木、金、革各一路。王自乘一，所餘四路，皆從行。臣若乘此車，不敢空左。故《典路》雲：“凡會同、軍旅、吊於四方，以路從。”鄭雲：“王出，於事無常。王乘一路，典路以其餘路從行，亦以華國。”又《戎右職》雲：“會同充革車。”鄭雲：“會同，王雖乘金路，猶以革路行。充之者，謂居左也。《曲禮》曰：‘乘君之乘車，不敢曠左。’”若曠左則似祥車，近於兇時，故乘者自居左也。○“左必式”者，雖處左而不敢自安，故恆馮式。雲“乘車”，則君皆在左。若兵、戎、革、路，則君在中央，御者居左。故成二年韓厥代御居中，杜雲：“自非元帥，御者皆在中，將在左。”以此而言，則元帥及君宜在中也。又《詩》雲：“左旋右抽。”鄭箋雲：“左，左人，謂御者。右，車右也。中軍謂將也。兵車之法，將居鼓下，故御者在左。“君存，惡空其位也。《太僕》雲：“王出入，則自左馭而前驅。”注云：“前驅，如今道引也。道而居左自馭，不參乘，闢王也，亦有車右焉。○“僕御婦人則進左手”者，僕在中央，婦人在左，僕御之時，進左手持轡，所以爾者，形微相背也。○“後右手”者，若進右手，則近相向，相向則生嫌，故後右手，遠嫌也。○“御國君則進右手，後左手”者，禮以相向為敬，故進右手。非男女，無所嫌也。“而俯”者，既御不得恆式，故但俯俛而為敬也，並兩御也。○“國君不乘奇車”者，國君出入宜正，不可乘奇邪不正之車。盧氏雲：“不如御者之車也”。○注“出入”至“之屬”。○正義曰：《隱義》曰：“獵車之形，今之鉤車是也。衣車如鱉而長也。漢桓帝之時，禁臣下乘之。”○“車上不廣咳”者，廣，弘大也。咳，聲咳也。車已高，若在上而聲大咳，似自驕矜，又驚眾也。○“不妄指”者，妄，虛也。在車上高，若無事，忽虛以手指麾於四方，併為惑眾也。○“立視五巂”，車上依禮。巂，規也。車輪一週為一規。乘車之輪，高六尺六寸，徑一圍三，三六十八得一丈八尺，又六寸為一尺八寸，總一規為一丈九尺八寸。三規為九十九尺，六尺為步，總為十六步半，在車上所視，則前十六步半地。○注“巂猶規也”。○正義曰：知巂為規者，以巂、規聲相近，故為規。規是圓，故讀從規。言“或為”，他本《禮記》有作字者。○“式視馬尾”者，馬引車，其尾近在車欄前，故車上馮式下頭時，不得遠矚，而令瞻視馬尾。○“顧不過轂”者，車轂也。若轉頭不得過轂，過轂則掩後人私也。《論語》雲“車中不內顧”是也。○“國中以策彗血阝勿驅”者，前雲“入國不馳”，此為不馳，故為遲行法也。策，馬杖。慧，竹帚也。○注“血阝勿，搔摩也”。入國不馳，故不用鞭策，但取竹帚帶葉者為杖，形如掃帚，故云策彗。雲“血阝勿”者，以策微近馬體，不欲令疾也，但僕搔摩之時，其形狀血阝勿然。○“塵不出軌”者，軌，車轍也。車行遲，故塵埃不起，不飛揚出轍外也。○“國君下齊牛，式宗廟“者，案《齊右職》雲：“凡有牲事，則前馬。”注云“王見牲，則拱而式”。又引《曲禮》曰：“國君下宗朝，式齊牛。”鄭注《周官》與此文異者，熊氏雲：“此文誤，當以《周禮》注為正。宜云‘下宗朝，式齊牛’。”○“大夫士下公門，式路馬”者，公門謂君之門也。路馬，君之馬也。敬君，至門下車，重君物，故見君馬而式之也。馬比門輕，故有下、式之異。○“乘路馬必朝服”者，謂臣行儀習禮獨行時也。路馬，君之車馬，臣雖得乘之，猶不可慢，故必朝服而自御乘之也。○“載鞭策”者，又不敢執杖杖馬，故但載杖以行也。○“不敢授綏”者，君在則僕人授綏。今習儀者，身既居左，自馭而乘，雖有車右，而不敢授綏與已也。○“左必式”者，既不空左，故亦居左，式而敬之，此言“不敢授綏”，與前“不敢曠左”文互也。○“步路馬，必中道”者，此謂單牽君馬行時。步，獨行也。若牽行君之馬，必在中道正路，為敬也。○“以足蹙路馬芻有誅”。○芻，食馬草也。誅，罰也。此草擬為供馬所食，若以足蹴踏之者，則有責罰也。○“齒路馬有誅”者，齒，年也。若論量君馬歲數，亦為不敬，亦被責罰，皆廣敬也。" }
