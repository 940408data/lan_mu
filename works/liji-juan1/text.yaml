# 禮記正義卷1（孔穎達疏）：j 為經文＋鄭玄注，z 為疏文。
sections:
  - id: juan1
    name: 正文
    blocks:
      - { type: j, text: "禮記○陸德明《音義》曰：“此記二禮之遺闕，故名《禮記》。”" }
      - { type: z, text: "正義曰：夫禮者，經天地；理人倫，本其所起，在天地未分之前。故《禮運》雲：“夫禮必本於大一。”是天地未分之前已有禮也。禮者，理也。其用以治，則與天地俱興，故昭二十六年《左傳》稱晏子云：“禮之可以為國也久矣，與天地並。”但於時質略，物生則自然而有尊卑，若羊羔跪乳，鴻雁飛有行列，豈由教之者哉！是三才既判，尊卑自然而有。但天地初分之後，即應有君臣治國。但年代綿遠，無文以言。案《易緯·通卦驗》雲：“天皇之先，與乾曜合元，君有五期，輔有三名。”注云：“君之用事五行，王亦有五期。輔有三名，公、卿、大夫也。”又云“遂皇始出握機矩”，注云：“遂皇謂遂人，在伏犧前，始王天下也。矩，法也。言遂皇持鬥機運轉之法，指天以施政教。”既雲“始王天下”，是尊卑之禮起於遂皇也。持鬥星以施政教者，即《禮緯·鬥威儀》雲“宮主君，商主臣，角主父，徵主子，羽主夫，少宮主婦，少商主政”，是法北斗而為七政。七政之立，是禮跡所興也。鄭康成《六藝論》雲：“《易》者，陰陽之象，天地之所變化，政教之所生，自人皇初起。”人皇即遂皇也。既政教所生初起於遂皇，則七政是也。《六藝論》又云：“遂皇之後，歷六紀九十一代，至伏犧始作十言之教。”然則伏犧之時，《易》道既彰，則禮事彌著。案譙周《古史考》雲：“有聖人以火德王，造作鑽燧出火，教民熟食，人民大悅，號曰遂人。次有三姓，乃至伏犧，制嫁娶，以儷皮為禮，作琴瑟以為樂。”又《帝王世紀》雲：“燧人氏沒，包犧氏代之。”以此言之，則嫁娶嘉禮始於伏犧也。但《古史考》遂皇至於伏犧，唯經三姓；《六藝論》雲“歷六紀九十一代”，其文不同，未知孰是。或於三姓而為九十一代也。案《廣雅》雲：“一紀二十七萬六千年。”方叔機注《六藝論》雲：“六紀者，九頭紀、五龍紀、攝提紀、合洛紀、連通紀、序命紀、凡六紀也。九十一代者，九頭一，五龍五，攝提七十二，含洛三，連通六，序命四，凡九十一代也。”但伏犧之前及伏犧之後，年代參差，所說不一，緯候紛紜，各相乖背，且復煩而無用，今並略之，唯據《六藝論》之文及《帝王世紀》以為說也。案《易·系辭》雲：“包犧氏沒，神農氏作。”案《帝王世紀》雲，伏犧之後女媧氏，亦風姓也。女媧氏沒，“次有大庭氏、柏皇氏、中央氏、栗陸氏、驪連氏、赫胥氏、尊盧氏、渾沌氏、昊英氏、有巢氏、朱襄氏、葛天氏、陰康氏、無懷氏，凡十五代，皆襲伏犧之號”。然鄭玄以大庭氏是神農之別號。案《封禪書》無懷氏在伏犧之前，今在伏犧之後，則《世紀》之文未可信用。《世紀》又云：“神農始教天下種穀，故人號曰神農。”案《禮運》雲：“夫禮之初，始諸飲食，燔黍捭豚，蕢桴而土鼓。”又《明堂位》雲：“土鼓葦籥，伊耆氏之樂。”又《郊特牲》雲：“伊耆氏始為蠟。”蠟即田祭，與種穀相協，土鼓葦籥又與蕢桴土鼓相當，故熊氏雲：伊耆氏即神農也。既雲始諸飲食，致敬鬼神，則祭祀吉禮起於神農也。又《史記》雲“黃帝與蚩尢戰於涿鹿”，則有軍禮也。《易·系辭》“黃帝九事”章雲“古者葬諸中野”，則有凶禮也。又《論語撰考》雲：“軒知地利，九牧倡教。”既有九州之牧，當有朝聘，是賓禮也。若然，自伏犧以後至黃帝，吉、兇、賓、軍、嘉五禮始具。皇氏雲：“禮有三起，禮理起於太一，禮事起於遂皇，禮名起於黃帝。”其“禮理起於大一”，其義通也；其“禮事起於遂皇，禮名起於黃帝”，其義乖也。且遂皇在伏犧之前，《禮運》“燔黍捭豚”在伏犧之後，何得以祭祀在遂皇之時？其唐堯，則《舜典》雲“修五禮”，鄭康成以為公、侯、伯、子、男之禮。又云命伯夷“典朕三禮”。五禮其文，亦見經也。案《舜典》雲“類於上帝”，則吉禮也；“百姓如喪考妣”，則凶禮也；“群后四朝”，則賓禮也；“舜徵有苗”，則軍禮也；“嬪於虞”，則嘉禮也。是舜時五禮具備。直雲“典朕三禮”者，據事天、地與人為三禮。其實事天地唯吉禮也，其餘四禮並人事兼之也。案《論語》雲“殷因於夏禮”，“周因於殷禮”，則《禮記》總陳虞、夏、商、周，則是虞、夏、商、周各有當代之禮，則夏、商亦有五禮。鄭康成注《大宗伯》，唯雲唐虞有三禮，至周分為五禮。不言夏、商者，但書篇散亡，夏、商之禮絕滅，無文以言，故據《周禮》有文者而言耳。武王沒後，成王幼弱，周公代之攝政，六年致太平，述文武之德而制禮也。故《洛誥》雲：“考朕招子刑，及單文祖德。”又《禮記·明堂位》雲，周公攝政六年，制禮作樂，頒度量於天下。但所制之禮，則《周官》、《儀禮》也。鄭作序雲：“禮者，體也，履也。統之於心曰體，踐而行之曰履。”鄭知然者，《禮器》雲：“禮者，體也。”《祭義》雲：“禮者，履此者也。”《禮記》既有此釋，故鄭依而用之。禮雖合訓體、履，則《周官》為體，《儀禮》為履，故鄭序又云：“然則三百三千雖混同為禮，至於並立俱陳，則曰此經禮也，此曲禮也。或雲此經文也，此威儀也。”是《周禮》、《儀禮》有體、履之別也。所以《周禮》為體者，《周禮》是立治之本，統之心體，以齊正於物，故為體。賀瑒雲：“其體有二。一是物體，言萬物貴賤高下小大文質各有其體。二曰禮體，言聖人制法，體此萬物，使高下貴賤各得其宜也。”其《儀禮》但明體之所行踐履之事，物唯萬體，皆同一履，履無兩義也。於周之禮，其文大備，故《論語》雲“周監於二代，鬱郁乎文哉！吾從周”也。然周既禮道大用，何以《老子》雲“失道而後德，失德而後仁，失仁而後義，失義而後禮。禮者，忠信之薄，道德之華，爭愚之始”。故先師準緯候之文，以為三皇行道，五帝行德，茸荃行仁，五霸行義。若失義而後禮，豈周之成康在五霸之後？所以不同者，《老子》盛言道德質素之事、無為靜默之教，故云此也。禮為浮薄而施，所以抑浮薄，故云“忠信之薄”。且聖人之王天下，道、德、仁、義及禮，並蘊於心，但量時設教，道、德、仁、義及禮，須用則行，豈可三皇五帝之時，全無仁、義、禮也？殷周之時，全無道、德也？《老子》意有所主，不可據之以難經也。既《周禮》為體，其《周禮》見於經籍，其名異者，見有七處。案《孝經說》雲“經禮三百”，一也；《禮器》雲“經禮三百”，二也；《中庸》雲“禮儀三百”，三也；《春秋說》雲“禮經三百”，四也；禮說雲“有正經三百”，五也；《周官外題》謂‘為《周禮》’，六也；《漢書·藝文志》雲“《周官》經六篇”，七也。七者皆雲三百，故知俱是《周官》。《周官》三百六十，舉其大數而云三百也。其《儀禮》之別，亦有七處，而有五名。一則《孝經說》、《春秋》及《中庸》並雲“威儀三千”，二則《禮器》雲“《曲禮》三千”，三則《禮說》雲“動儀三千”，四則謂“為《儀禮》”，五則《漢書·藝文志》謂《儀禮》為“古禮經”。凡此七處五名，稱謂並承三百之下，故知即《儀禮》也。所以三千者，其履行《周官》五禮之別，其事委曲，條數繁廣，故有三千也。非謂篇有三千，但事之殊別有三千條耳。或一篇一卷，則有數條之事。今行於世者，唯十七篇而已。故《漢書·藝文志》雲“漢初，高堂生傳《禮》十七篇”是也。至武帝時，河間獻王得古《禮》五十六篇，獻王獻之。又《六藝論》雲：“後得孔子壁中古文《禮》，凡五十六篇。其十七篇與高堂生所傳同而字多異，其十七篇外則逸禮是也。”《周禮》為本，則聖人體之；《儀禮》為末，賢人履之。故鄭序雲“體之謂聖，履之為賢”是也。既《周禮》為本，則重者在前，故宗伯序五禮，以吉禮為上；《儀禮》為末，故輕者在前，故《儀禮》先冠、昏，後喪、祭。故鄭序雲：“二者或施而上，或循而下。”其《周禮》，《六藝論》雲：“《周官》壁中所得六篇。”《漢書》說河間獻王開獻書之路，得《周官》有五篇，失其《冬官》一篇，乃購千金不得，取《考工記》以補其闕。《漢書》雲得五篇，《六藝論》雲得其六篇，其文不同，未知孰是。其《禮記》之作，出自孔氏。但正《禮》殘缺，無復能明，故範武子不識殽烝，趙鞅及魯君謂《儀》為《禮》。至孔子沒後，七十二之徒共撰所聞，以為此《記》。或錄舊禮之義，或錄變禮所由，或兼記體履，或雜序得失，故編而錄之，以為《記》也。《中庸》是子思伋所作，《緇衣》公孫尼子所撰。鄭康成雲：《月令》，呂不韋所修。盧植雲：《王制》，謂漢文時博士所錄。其餘眾篇，皆如此例，但未能盡知所記之人也。其《周禮》、《儀禮》，是《禮記》之書，自漢以後各有傳授。鄭君《六藝論》雲：“案《漢書·藝文志》、《儒林傳》雲，傳禮者十三家，唯高堂生及五傳弟子戴德、戴聖名在也。”又案《儒林傳》雲：“漢興，高堂生傳《禮》十七篇，而魯徐生善為容。孝文時，徐生以容為禮官大夫。瑕丘蕭奮以禮至淮陽太守。孟卿，東海人，事蕭奮，以授戴德、戴聖。”《六藝論》雲“五傳弟子”者，熊氏雲：“則高堂生、蕭奮、孟卿、後倉及戴德、戴聖為五也。”此所傳皆《儀禮》也。《六藝論》雲：“今禮行於世者，戴德、戴聖之學也。”又云“戴德傳《記》八十五篇”，則《大戴禮》是也；“戴聖傳《禮》四十九篇”，則此《禮記》是也。《儒林傳》雲：“大戴授琅邪徐氏，小戴授梁人橋仁字季卿、楊榮字子孫。仁為大鴻臚，家世傳業。”其《周官》者，始皇深惡之。至孝武帝時，始開獻書之路，既出於山岩屋壁，復入秘府，五家之儒莫得見焉。至孝成時，通人劉歆校理秘書，始得列序，著於錄略。為眾儒排棄，歆獨識之，知是周公致太平之道。河南緱氏杜子春，永平時初能通其讀，鄭眾、賈逵往授業焉。其後馬融、鄭玄之等，各有傳授，不復繁言也。" }
      - { type: j, text: "陸曰：“本或作《曲禮》，上者，後人加也，《檀弓》、《雜記》放此。《曲禮》者，是《儀禮》之舊名，委曲說禮之事。”" }
      - { type: z, text: "正義曰：案鄭《目錄》雲：“名曰《曲禮》者，以其篇記五禮之事。祭祀之說，吉禮也。喪荒去國之說，凶禮也。致貢朝會之說，賓禮也。兵車旌鴻之說，軍禮也。事長敬老、執贄納女之說，嘉禮也。此於《別錄》屬《制度》。”案鄭此說，則此《曲禮》篇中有含五禮之義。是以經雲“禱祠祭祀”之說，當吉禮也。“送喪不由徑”，“歲凶，年穀不登”，又云“大夫士去國”，如此之類，是喪荒去國之說，當凶禮也。“五官致貢曰享”，“天子當寧而立曰朝”，“相見於郤地曰會”，如此之類，是致貢朝會之說，當賓禮也。“兵車不式”，“前有水，則載青旌”，如此之類，是兵車旌鴻之說，當軍禮也。“侍坐於長者”，“故君子式黃髮”，“婦人之贄，椇榛棗栗”，“納女於天子”，如此之類，是事長敬老、執贄納女之說，當嘉禮也。必知執贄當婦人之贄者，以其《士相見》，鄭《目錄》以士執贄為賓禮故也。此篇既含五禮，故其篇名為《曲禮》。《曲禮》之與《儀禮》，其事是一。以其屈曲行事，則曰《曲禮》；見於威儀，則曰《儀禮》。但曲之與儀相對。《周禮》統心為號若，若總而言之，則《周禮》亦有曲名，故《藝文志》雲：“帝王為政，世有損益，至周曲為之防，事為之制，故曰，經禮三百，威儀三千。”是二禮互而相通，皆有曲稱也。雲“上”者，對下生名。本以語多，簡策重大，分為上下，更無義也。“第一”者，《小爾雅》雲：“第，次也。”呂靖雲：“一者，數之始。”《禮記》者，一部之大名。《曲禮》者，當篇之小目。既題《曲禮》於上，故著《禮記》於下，以配注耳。鄭氏者，姓鄭名玄，字康成，北海高密縣人，前漢僕射鄭崇八世之孫也。後漢徵為大司農，年七十四乃卒。然鄭亦附盧、馬之本而為之注。注者，即解書之名。但釋義之人，多稱為傳。傳謂傳述為義，或親承聖旨，或師儒相傳，故云傳。今謂之注者，謙也，不敢傳授，直注己意而己。若然，則傳之與注，各出己情。皇氏以為自漢以前為傳，自漢以後為注。然王肅在鄭之後，何以亦謂之傳？其義非也。" }
      - { type: j, text: "《曲禮》曰：“毋不敬，禮主於敬。○陸曰：“毋音無。《說文》雲：‘止之詞，其字從女，內有一畫，象有奸之形，禁止之勿令奸。古人云毋，猶今人言莫也。’案‘毋’字與父母字不同，俗本多亂，讀者皆朱點‘母’字以作‘無’音，非也。後放此。疑者，特複音之。”儼若思，儼，矜莊貌，人之坐思，貌必儼然。○嚴，魚檢反，本亦作儼，同，矜莊貌。思如字，徐息嗣反。矜，君冰反。安定辭。審言語也。《易》曰：“言語者，君子之樞機。”○樞，昌朱反。安民哉！此上三句可以安民，說《曲禮》者，美之雲耳。" }
      - { type: z, text: "正義曰：此一節明人君立治之本，先當肅心謹身，慎口之事。○“《曲禮》曰”者，案下文“安民哉”，是為君上所行，故記人引《儀禮》正經“毋不敬”以下三句而為實驗也。○“毋不敬”者，人君行禮無有不敬，行五禮皆須敬也。“儼若思”者，儼，矜莊貌也。若，如也。思，計慮也。夫人計慮，狀必端愨。今明人君矜莊之貌，如人之思也。○“安定辭”者，安定，審也。辭，言語也。人君出言，必當慮之於心，然後宣之於口，是詳審於言語也。○“安民哉”者，但人君發舉，不離口與身心，既心能肅敬，身乃矜莊，口複審慎，三者依於德義，則政教可以安民也。雲“哉”者，記人美此三句者也。○注“禮主於敬”。○正義曰：《孝經》雲：“禮者敬而已矣。”是也。又案鄭《目錄》雲“《曲禮》之中，體含五禮”，今雲“《曲禮》曰：毋不敬”，則五禮皆須敬，故鄭雲：“禮主於敬。”然五禮皆以拜為敬禮，則祭極敬、主人拜屍之類，是吉禮須敬也。拜而後稽顙之類，是凶禮須敬也。主人拜迎賓之類，是賓禮須敬也。軍中之拜肅拜之類，是軍禮須敬也。冠昏飲酒，皆有賓主拜答之類，是嘉禮須敬也。兵車不式，乘玉路不式，鄭雲“大事不崇曲敬者”，謂敬天神及軍之大事，故不崇曲小之敬。熊氏以為唯此不敬者，恐義不然也。既雲“《曲禮》曰”，“是引《儀禮》正經，若引“《春秋》曰”、“《詩》曰”之類。所引者若《冠禮》戒辭雲“壽考惟祺，介爾景福”之等，今不見者，或在三千散亡之中也。○注“儼矜”至“儼然”。○正義曰：經唯雲“儼若思”，不雲“坐”，鄭必知“坐思”者，案《大學》雲：“定而後能靜，靜而後能安，安而後能慮。”慮即思，故知思必當坐也。○注“審言”至“樞機”。○正義曰：《論語》雲：“駟不及舌。”故審言語也。“《易》曰”者，《易·系辭》之文也，故彼雲：“君子出其言善，則千里之外應之，況其邇者乎！出其言不善，則千里之外違之，況其邇者乎！言行者，君子之樞機。”鄭注：“樞謂戶樞，機謂弩牙，戶樞之發，或明或闇；弩牙之發，或中或否，以喻君子之言，或榮或辱。”引之者，證審言語之事。彼為“言行”，鄭雲“言語”者，既證經辭，無取於行，故變文為語也。" }
      - { type: j, text: "敖不可長，欲不可從，志不可滿，樂不可極。四者慢游之道，桀、紂所以自禍。○敖，五報反，慢也；王肅五高反，遨游也。長，丁丈反，盧植、馬融、王肅並直良反。欲如字，一音喻。從，足用反，放縱也。樂音洛，皇侃音嶽，極如字，皇紀力反。桀，其列反，夏之末主，名癸。紂，直醜反，殷之末主，名辛。" }
      - { type: z, text: "“敖不”至“可極”。○正義曰：此一節承上人君敬慎之道，此亦據人君恭謹節儉之事，故鄭引桀、紂以證之。○“敖不可長”者，敖者矜慢在心之名，長者行敖著跡之稱。夫矜我慢物，中人不免，若有心而無跡，則於物無傷；若跡著而行用，則侵虐為甚。傾國亡家，必由乎此，故戒不可長。○“欲不可從”者，心所貪愛為欲，則“飲食男女，人之大欲存焉”是也。人皆有欲，但不得從之也。○“志不可滿”者，六情遍睹在心未見為志。凡人各有志意，但不得自滿，故《六韜》雲：“器滿則傾，志滿則覆。”○“樂不可極”者，樂者天子宮縣以下，皆得有樂，但主歡心，人情所不能已，當自抑止，不可極為，故《樂記》雲：“樂盈而反，以反為文。”○注“四者”至“自禍”。○正義曰：案《尚書》、《史記》說紂惡甚多，不可具載。皇氏雲：“斮朝涉之脛，剖賢人之心，是長敖也。糟丘酒池之等，是從欲也。玉杯象箸之等，是志滿也。靡靡之樂，是樂極也。桀之為惡，唯有民隊塗炭，淫於妹嬉之事，雖史傳不言四事，亦應俱有四者之惡，故紂焚宣室，桀放南巢，但‘天作孽，猶可違，自作孽，不可逭’，桀、紂皆自身為惡，以致滅亡，故云‘自禍’也。”" }
      - { type: j, text: "賢者狎而敬之，狎，習也，近也，謂附而近之，習其所行也。《月令》曰：“雖有貴戚近習。”○狎，戶甲反。近，附近之近，下注內不出者皆同。傶音戚，本亦作戚。畏而愛之。心服曰畏。曾子曰：“吾先子之所畏。”愛而知其惡，憎而知其善。謂凡與人交，不可以己心之愛憎，誣人之善惡。○誣音無，後並同。積而能散，謂已有蓄積，見貧窮者，則當能散以周救之，若宋樂氏。○蓄，敕六反。周音周。樂音嶽，謂宋司城樂喜。安安而能遷。謂已今安此之安，圖後有害，則當能遷。晉咎犯與姜氏醉重耳而行，近之。○害如字，本亦作難，乃旦反。咎，其九反。重，直尨反。臨財毋苟得，為傷廉也。○為，於偽反，下“為傷”、“為近”皆同。臨難毋苟免。為傷義也。○難，乃旦反。很毋求勝，分毋求多。為傷平也。很，鬩也，謂爭訟也。《詩》雲：“兄弟鬩於牆。”○很，胡懇反。勝，舒證反。分，扶問反。鬩，呼歷反，猶鬥也。爭，爭鬥之爭，下文皆同。疑事毋質，質，成也。彼已俱疑，而已成言之，終不然，則傷知。○知音智。直而勿有。直，正也。已若不疑，則當稱師友而正之，謙也。" }
      - { type: z, text: "“賢者”至“勿有”。○正義曰：此一節總明愛敬安危忠信之事，各隨文解之。○“賢者狎而敬之”者，賢是有德成之稱，狎謂近也，習也。賢者身有道藝，朋類見賢思齊焉，必須附而近之，習其德藝，儕倫易相褻慢，故戒令相敬也。○注“狎習”至“近習”。○正義曰：引《月令》者，案《月令》仲冬之月，禁戒婦功，不得奢慢。貴戚謂王之姑姊妹。近習謂王之所親倖嬪御之屬。言近習者，王附而近之，習其色。引之者，證賢者附而近之，習其道藝。連引貴戚，於義無所當也。○“畏而愛之”。○正義曰：賢者有其德行，人皆心服畏之。既有所畏，必當愛其德義，不可疏之。○注“心服”至“所畏”。○正義曰：引“曾子曰：吾先子之所畏”者，《孟子》雲：“或問曾西曰：‘吾子與子路孰賢？’曾西蹴然曰：‘吾先子之所畏也。’”先子謂祖曾參，不在四科，○而子路入四科，故曾參心服子路。引之者，證經“畏”是心服之義。○“愛而知其惡，憎而知其善”。正義曰：愛謂己所親倖，憎謂己所嫌慢。人多愛而不知其惡，憎而不知其善，故記人戒之雲，凡人雖愛，必當知其心懷惡行。崔氏雲：“若石碏知子厚是也。心雖憎疾，亦當知其善能。若祁奚知其解狐是也。若然，乃可審知人之賢愚。”○“積而能散”。正義曰：凡人貪嗇，皆好積而不好散。今謂已有蓄積，能賑乏周無，則是仁惠也。○注“謂已”至“樂氏”。○正義曰：引宋樂氏者，案襄二十九年《左傳》雲，鄭國飢，子皮貸民粟，戶一鍾。樂氏者，宋司城官，姓樂，名喜，字子罕。宋亦飢，樂喜請於平公雲：“鄰於善，民之望。”請貸民粟，並使諸大夫亦貸之。今不引鄭罕氏而引宋樂氏者，鄭罕氏施而斂之，宋樂氏施而不斂，故晉叔向聞之曰：“鄭之罕，宋之樂，施而不德，樂氏加焉。”熊氏雲：“禮，家施不及國，大夫不收公利，二家皆非也。”今鄭為能散者，直取一邊能散之義是同，不據家施非禮之事。鄭不言“是”而言“若”者，但禮與諸經事實是一，惟文字不同，鄭則言“是”。若《檀弓》雲：“諸侯伐秦，曹桓公卒於會。”鄭注引《春秋傳》雲：“曹伯廬卒於師是也。”以其一事，故云“是”也。此禮本不為樂氏而作，但事類相似，引以為證，故云“若”也。○“安安而能遷”。○正義曰：上安據心，下安據處。凡人多居危如安，故記人戒之雲，謂已心安於此所處之安，當圖謀於後有害以否。若後當有害，必須早遷，則離害也。○注“謂已”至“近之”。○正義曰：晉舅犯者，案《左傳》僖二十三年，晉重耳自翟之齊，齊桓公妻之，有馬二十乘，重耳心安於齊，不欲歸晉。從者重耳之舅，字子犯，“謀於桑下。蠶妾在其上，以告姜氏。姜氏殺之，而謂公子曰：‘子有四方之志，其聞之者，吾殺之矣。’公子曰：‘無之。’姜氏曰：‘行也，懷與安，實敗名。’公子不可，姜氏與子犯謀，醉而遣之。醒，以戈逐子犯。”至秦，秦伯納之，卒為霸主。是“安安而能遷”之事。鄭不雲“是”，又不雲“若”，而言“近之”者，安安能遷，亦不為重耳而作，不得雲“是”，遷又非重耳之意，不得雲“若”，故云“近之”也。○“臨財毋苟得”。○正義曰：財利，人之所貪，非義而取謂之苟得。故記人戒之，今有財利，元非兩人之物，兩人俱臨而求之，若苟得入已，則傷廉隅，故鄭雲：“為傷廉也。”○“臨難毋苟免”。○正義曰：難謂有寇仇謀害君父，為人臣子，當致身授命以救之。故記人戒之雲，若君父有難，臣子若苟且免身而不鬥，則陷君父於危亡，故云“毋苟免”。見義不為，無勇也，故鄭雲：“為傷義也。”○“很毋求勝，分毋求多”。○正義曰：很謂小小鬩很。凡人所爭，皆欲求勝。故記人戒之雲，而有小小鬩很，當引過歸已，不可求勝。○“分毋求多”者，此元是眾人之物，當共分之，人皆貪欲，望多入已。故記人戒之雲，所分之物毋得求多也。○注“為傷”至“於牆”。○正義曰：所引《詩》者，是《小雅·常棣》，閔管蔡失道之詩也。彼雲：“兄弟鬩於牆，外禦其侮。”引之者，證經很亦是小小鬩很之事，若大很則當報之，故《論語》孔子云“以直報怨”是也。○“疑事毋質”。○正義曰：人多專固，未知而為已知。故戒之雲，彼已俱疑，而來問已。質，成也。若已亦疑，則無得成言之；若成言疑事，後為賢人所譏，則傷已智也。故孔子戒子路雲“不知為不知”也。○“直而勿有”。○正義曰：此謂彼疑已不疑者，仍須謙退。直，正也。彼有疑事而來問已，已若不疑而答之，則當稱師友所說以正之，勿為巳有此義也。" }
      - { type: j, text: "若夫，言若欲為丈夫也。《春秋傳》曰：“是謂我非夫。○夫，方於反，丈夫也。坐如屍，視貌正。立如齊。磬且聽也。齊謂祭祀時。○齊，側皆反，本亦作齋，音同，注同。禮從宜，事不可常也。晉士匄帥師侵齊，聞齊侯卒，乃還，《春秋》善之。○丐本亦作匄，音蓋。還音旋，後放此。使從俗。亦事不可常也。牲幣之屬，則當從俗所出。《禮器》曰：“天不生，地不養，君子不以為禮，鬼神不饗。”○使，色吏反。幣，徐扶世反。饗，許兩反。" }
      - { type: z, text: "“若夫”至“從俗”。○正義曰：此一節論為丈夫之法，當“坐如屍”以下四行並備，乃可立身，各依文解之。○“若夫”者，凡人若為丈夫之法，必當如下所陳，故目丈夫於上，下乃論其行以結之。○注“言若”至“非夫”。○正義曰：案《左傳》宣十二年邲之戰，楚侵鄭、晉救之。及河，聞鄭既及楚平，中軍將荀林父欲還，不濟。上軍將士會曰：“善。”中軍佐先穀曰：“不可，成師以出，聞敵強而退，非夫也。”又哀十一年，齊伐魯，魯武叔初不欲戰，為冉求所非。武叔曰：“是謂我不成丈夫也。”退而蒐乘。二傳之言，當是先縠之辭也。彼無“是謂我”，鄭君足之也。○“坐如屍”者，屍居神位，坐必矜莊。言人雖不為屍，若所在坐法，必當如屍之坐，故鄭雲“視貌正”也。○“立如齊”者，人之倚立，多慢不恭，故戒之雲，倚立之時雖不齊，亦當如祭前之齊，必須磬折屈身。○注“磬且”至“祀時”。○正義曰：“磬且聽”，案《士虞禮》雲：“無屍者，主人哭，出復位，祝闔牖戶，如食間。”是祭時主人有聽法。雲“磬”者，謂屈身如磬之折殺。案《考工記》雲：“磬氏為磬，倨句一矩有半。”鄭雲：“必先度一矩為句，一矩為股，而求其弦。既而以一矩有半觸其弦，則磬之倨句也。”是磬之折殺，其形必曲。人之倚立，亦當然也。又云“齊謂祭祀時”者，凡齊皆在祭前，自整齊之名，並於適寢之中，坐而無立。今雲“立如齊”者，齊有立者，但祭前有齊，所以自整齊也，則祭日神前亦當齊，則齋者是先後通稱。此言“立如齋”，非祭前坐齋，故鄭雲：“齋謂祭祀時也。”若然，此立謂侍尊者之時，故《玉藻》雲“凡侍於君，紳垂，足如履齋，視下聽上”是也。○“禮從宜”者，皇氏雲：“上二事，丈夫為儼恪之儀。此下二事，丈夫為君出使之法。”義或然也。“禮從宜”者，謂人臣奉命出使征伐之禮，雖奉命出征，梱外之事，將軍裁之，知可而進，知難而退，前事不可準定，貴從當時之宜也。○注“事不”至“善之”。○正義曰：案《春秋》襄十九年，“齊侯還卒，晉士匄帥師侵齊，至穀，聞齊侯卒，乃還。”《公羊》雲：“還者何？善辭也。何善爾？大其不伐喪也。此受命於君而伐齊，則何大其不伐喪也？大夫以君命出使，進退在大夫也。”○“使從俗”者，使謂臣為君出聘之法，皆出土俗牲幣以為享禮，土俗若無，不可境外求物，故云“使從俗”也。皇氏雲：“上‘禮從宜’，與此‘使從俗’，互而相通，皆是以禮而使。”義或然也。○注“亦事”至“不饗”。○正義曰：“牲幣之屬，當從俗所出”者，謂若《郊特牲》及《聘禮》，朝聘皆有皮馬龜金竹箭璧帛之等，有則致之，無則已，故云“不可常也”。“《禮器》曰：天不生”者，謂天不以四時而生，若李梅冬實。“地不養”者，謂居山以魚鱉，居澤以鹿豕。“君子不以為禮”者，謂天不生地不養之等，君子不將為饗禮。“鬼神不饗”者，言君子不以為禮者，祇由鬼神不歆饗此非常之物，明鬼神依人也。" }
      - { type: j, text: "夫禮者，所以定親疏，決嫌疑，別同異，明是非也。禮不妄說人，為近佞媚也。君子說之不以其道，則不說也。○夫音扶，凡發語之端皆然，後放此。疏，所居反，或作疏。決，徐古穴反。嫌，戶恬反。別，彼列反，下注、下文同。說音悅，又始悅反，注同。伎，乃定反，口才曰佞。媚，眉忌反，意向曰媚。不辭費。為傷信，君子先行其言而後從之。○辭，本又作詞，同；《說文》以詞為言詞之字；辭，不受也，後皆放此。費，芳味反，言而不行為辭費。禮不逾節，不侵侮，不好狎。為傷敬也。人則習近為好狎。○侮，徐雲撫反，輕慢也。好，呼報反，注同。脩身踐言，謂之善行。踐，履也，言履而行之。○行，下孟反，下“行脩”同。行脩言道，禮之質也。言道，言合於道。質猶本也，禮為之文飾耳。禮聞取於人，不聞取人。謂君人者。取於人，謂高尚其道。取人，謂制服其身。○取於，舊七樹反，謂趣就師求道也；皇如字，謂取師之道。取人如字，謂制師使從已。禮聞來學，不聞往教。尊道藝。" }
      - { type: z, text: "“夫禮”至“往教”。○正義曰：此一節總明治身立行，交接得否，皆由於禮，故以禮為目，各隨文解之。○“夫禮者，所以定親疏”者，五服之內，大功已上服粗者為親，小功已下服精者為疏，故《周禮》小史掌定系世，辨昭穆也。○“決嫌疑”者，若妾為女君期，女君為妾若報之則太重，降之則有舅姑為婦之嫌，故全不服，是決嫌疑者，孔子之喪，門人疑所服。子貢曰：“昔者夫子喪顏回，若喪子而無服。喪子路亦然，請喪夫子，若喪父而無服。”是決疑也。○“別同異”者，賀瑒雲：“本同今異，姑姊妹是也。本異今同，世母叔母及子婦是也。”○“明是非也”者，得禮為是，失禮為非，若主人未斂，子游裼裘而吊，得禮，是也。曾子襲裘而吊，失禮，非也。但嫌疑同異是非之屬，在禮甚眾，各舉一事為證。而皇氏具引，今亦略之。○“禮不妄說人”者，禮動不虛，若說人之德，則爵之。問人之寒，則衣之。若無爵無衣，則為妄說，近於佞媚也。○注“君子”至“說也”。○正義曰：此《論語》文。孔子曰：“君子說之不以其道，則不說也。”不以其道說之，是妄說，故君子不說也，引證經禮不妄說人之事。○“不辭費者”。正義曰：凡為人之道，當言行相副，今直有言而無行，為辭費。○“禮不”至“好狎”。○禮者所以辨尊卑，別等級，使上不逼下，下不僣上，故云禮不逾越節度也。“不侵侮”者，禮主於敬，自卑而尊人，故戒之不得侵犯侮慢於人也。○“不好狎”者，賢者當狎而敬之，若直近而習之，不加於敬，則是好狎，故鄭雲“習近為好狎”也。○“行脩”至“質也”。○凡為禮之法，皆以忠信仁義為本，禮以文飾。“行脩”者，忠信之行脩。“言道”者，言合於仁義之道。“質”，本也，則可與禮為本也。○“禮聞取於人，不聞取人”者，熊氏以為此謂人君在上招賢之禮，當用賢人德行，不得虛致其身。“禮聞取於人”者，謂禮之所聞，既招致有賢之人，當於身上取於德行，用為政教，不聞直取賢人，授之以位，制服而已，故鄭雲“謂君人者”。皇氏以為人君取師受學之法，“取於人”，謂自到師門，取其道藝。○“禮聞來學，不聞往教”。○“禮聞來學”者，凡學之法，當就其師，處北面伏膺。“不聞往教”者，不可以屈師親來就己，故鄭雲“尊道藝”也。" }
      - { type: j, text: "道德仁義，非禮不成。教訓正俗，非禮不備。分爭辨訟，非禮不決。君臣、上下、父子、兄弟，非禮不定。宦學事師，非禮不親。班朝治軍，涖官行法，非禮威嚴不行。禱祠祭祀，供給鬼神，非禮不誠不莊。分、辨，皆別也。官，仕也。班，次也。涖，臨也。莊，敬也。學或為御。○辨，皮勉反，徐方勉反。上下，上謂公卿，下謂大夫、士。宧音患。朝，直遙反。涖，本亦作蒞，徐音利，沈力二反，又力位反。禱，丁老反，鄭雲：“求福曰禱。”祠音詞，求得曰祠。共音恭，本或作供。莊，側良反，徐側亮反。學或為御，鄭此注為見他本也，後放此。是以君子恭敬撙節退讓以明禮。撙猶趨也。○撙，祖本反。趨，士俱反，就也，向也。鸚鵡能言，不離飛鳥。猩猩能言，不離禽獸。今人而無禮，雖能言，不亦禽獸之心乎？夫唯禽獸無禮，故父子聚麀。聚猶共也。鹿牝曰麀。○嬰，本或作鸚，厄耕反。母，本或作鵡，同，音武，諸葛恪茂後反。離，力智反，下同。狌，本又作猩，音生。禽獸，盧本作走獸。麀音憂，牝鹿也。牝，頻忍反，徐扶盡反，舊扶允反。是故聖人作為禮以教人，使人以有禮，知自別於禽獸。" }
      - { type: z, text: "“道德”至“禽獸”。○正義曰：此一節明禮為諸事之本。言人能有禮，然可異於禽獸也。○“道德仁義，非禮不成”者，道者通物之名，德者得理之稱，仁是施恩及物，義是裁斷合宜，言人欲行四，事不用禮無由得成，故云“非禮不成”也。道德為萬事之本，仁義為群行之大，故舉此四者為用禮之主，則餘行須禮可知也。道是通物，德是理物，理物由於開通，是德從道生，故道在德上。此經道謂才藝，德謂善行，故鄭注《周禮》雲：“道多才藝，德能躬行，非是《老子》之道德也。”熊氏雲：“此是《老子》‘失道而後德，失德而後仁，失仁而後義’。今謂道德，大而言之則包羅萬事，小而言之則人之才藝善行。無問大小，皆須禮以行之，是禮為道德之具，故云‘非禮不成’。然人之才藝善行得為道德者，以身有才藝，事得開通，身有美善，於理為得，故稱道德也。”○“教訓正俗，非禮不備”者，熊氏雲：“教謂教人師法，訓謂訓說義理，以此教訓，正其風俗，非得其禮，不能備具，故云‘非禮不備’。但教之與訓，小異大同。”“分爭辨訟，非禮不決”者，《周禮·司寇》“以兩造禁民訟”，又云“以兩劑禁民獄”，故鄭雲：“爭罪曰獄，爭財曰訟。”則萬事通名。故《左傳》雲“凡有血氣，皆有爭心”，又云“錐刀之末，將盡爭之”是也。此“爭財曰訟”，對文異耳，散則通名。故《左傳》雲“衛侯與元咺訟”，是爭罪亦曰訟也。○“君臣、上下、父子、兄弟，非禮不定”者，上謂公卿大夫，下謂士也。君父南面，臣子北面，公卿大夫則列位於上，士則列位於下，兄前弟後，唯禮能定也。《白虎通》雲：“君，群也，群下之所歸心也。臣，堅也，厲志自堅也。父，矩也，以法度教子也。子，孳也，孳孳無已也。兄，況也，況父法也。弟，悌也，心順行篤也。”“官學事師，非禮不親”者，熊氏雲：“官謂學仕官之事，學謂習學六藝，此二者俱是事師，非禮不親。”《左傳》宣二年，趙盾見靈輒餓，問之，雲：“官三年矣。”服虔雲：“官，學也。”是學職事為官也。○“班朝治軍，涖官行法，非禮威嚴不行”者，班，次也；朝，朝廷也；次，謂司士正朝儀之位次也；治軍，謂師旅卒伍各正其部分也；涖，臨也；官，謂卿、大夫、士各有職掌；行法，謂司寇士師明刑法也。皆用禮，威嚴乃行也。“禱祠祭祀，供給鬼神，非禮不誠不莊”者，《周禮·都宗人》雲：“國有大故，則令禱祠。”鄭注云：“祠謂報塞。”又《小宗伯》注云：“求福曰禱，得求曰祠。”熊氏雲：“祭祀者，國家常禮。牲幣之屬，以供給鬼神，唯有禮乃能誠敬。”○“是以君子恭敬撙節退讓以明禮”者，君子是有德有爵之通稱，王肅雲：“君上位，子下民。”又康成注《少儀》雲：“君子，卿大夫若有異德者。”凡禮有深疑，則舉君子以正之。恭敬者，何胤雲：“在貌為恭，在心為敬。”何之所說，從多舉也。夫貌多心少為恭，心多貌少為敬，所以知者，《書》雲“奉先思孝，接下思恭”，又云“貌曰恭”，又《少儀》雲“賓客主恭，祭祀主敬”，《論語》雲“巧言令色足恭”，又云“至於犬馬，皆能有養，不敬何以別乎”，又《孝經說》“君父同敬，為母不同敬”。以此諸文言之，凡稱敬多為尊，故知貌多為恭，心多為敬也。又通而言之，則恭敬是一。《左傳》雲：“敬恭父命。”《士昏禮》雲：“敬恭聽宗父母之言。”《孝經》雲：“恭敬安親。”此並恭敬連言，明是一也。撙者，趨也。節，法度也。言恆趨於法度。“退讓以明禮”者，應進而遷曰退，應受而推曰讓。“以明禮”者，既道德仁義已下，並須禮以成，故君子之身行恭敬，趨法度，及退讓之事，以明禮也。○“猩猩”至“禽獸”。○正義曰：《爾雅》雲：“猩猩小而好啼。”郭注《山海經》雲：“人面豕身，能言語，今交阯封谿縣出猩猩，狀如獾犭屯，聲似小兒啼。”今案，禽獸之名，經記不同。《爾雅》雲：“二足而羽謂之禽，四足而毛謂之獸。”今鸚鵡是羽曰禽，猩猩四足而毛，正可是獸。今並雲禽獸者，凡語有通別，別而言之，羽則曰禽，毛則曰獸。所以然者，禽者，擒也，言鳥力小可擒捉而取之；獸者，守也，言其力多，不易可擒，先須圍守，然後乃獲，故曰獸也。通而為說，鳥不可曰獸，獸亦可曰禽，故鸚鵡不曰獸，而猩猩通曰禽也。故《易》雲：“王用三驅，失前禽。”則驅走者亦曰禽也。又《周禮·司馬職》雲：“大獸公之，小禽私之。”以此而言，則禽未必皆鳥也。又康成注《周禮》雲：“凡鳥獸未孕曰禽。”《周禮》又云：“以禽作六摯，卿羔，大夫雁。”《白虎通》雲：“禽者，鳥獸之總名。”以此諸經證禽名通獸者，以其小獸可擒，故得通名禽也。" }
      - { type: j, text: "太上貴德，太上，帝皇之世，其民施而不惟報。○大音泰，注同；大上謂三皇五帝之世。施，始豉反，下同。其次務施報。茸荃之世，禮始興焉。禮尚往來，往而不來，非禮也；來而不往，亦非禮也。人有禮則安，無禮則危，故曰，禮者不可不學也。夫禮者，自卑而尊人，雖負販者，必有尊也，而況富貴乎？負販者尤輕恌志利，宜若無禮然。○販，方萬反。佻，吐彫反。富貴而知好禮，則不驕不淫；貧賤而知好禮，則志不懾。懾猶怯惑。○好，呼報反，下同。懾，之涉反。怯，丘劫反，何胤雲：“憚所行為怯。”" }
      - { type: z, text: "“太上”至“不懾”。○正義曰：此一節明世變道殊，所貴有異，雖負販者，必須有禮，各隨文解之。○“太上貴德”者，大上謂三皇五帝之世也。其時猶淳厚其德，不尚往來之禮，所貴者在於有德，故曰“貴德”也。德主務施其事，但施而不希其反也。皇是三皇，帝是五帝，不雲皇帝者，恐是一事不分，故鄭升“帝”於“皇”上，以殊異代矣。然五帝雖有三禮五玉陟方朝會，而猶是揖讓，故上同三皇，是以《禮運》注謂五帝為大道之時也。熊氏雲：“三皇稱皇者，皆行合天皇之星。”故《詩緯·含神霧》宋均注云：“北極天皇大帝，其精生人。”然則稱皇者，皆得天皇之氣也。鄭玄意則以伏犧、女媧、神農為三皇，故注《中候·數省圖》引《運鬥樞》：“伏犧、女媧、神農為三皇也。”然宋均注《援神契》引《甄耀度》數燧人、伏犧、神農為三皇，譙周《古史考》亦然。《白虎通》取伏犧、神農、祝融為三皇，孔安國則以伏犧、神農、黃帝為三皇，並與鄭不同。此皆無所據，其言非也。鄭數伏犧、女媧、神農，非謂其人身自相接，其間代之王多矣。《六藝論》雲：“燧人至伏犧一百八十七代。”宋均注《文耀鉤》雲：“女媧以下至神農七十二姓。”譙周以為伏犧以次有三姓始至女媧，女媧之後五十姓至神農，神農至炎帝一百三十三姓。是不當身相接。譙周以神農炎帝為別人，又以神農為木德，女媧為水德，皆非鄭義也。其五帝者，鄭注《中候·敕省圖》雲：“德合五帝坐星者稱帝，則黃帝、金天氏、高陽氏、高辛氏、陶唐氏、有虞氏”是也。實六人而稱五者，以其俱合五帝坐星也。五帝所以稱帝者，《坤靈圖》雲：“德配天地，在正不在私，稱之曰帝。”茸荃稱王者，莊三年《穀梁傳》曰：“其曰王者，人所歸往也。”散而言之，則三皇亦稱帝，則《月令》雲“其帝太昊”是也。五帝亦稱皇，則《呂刑》雲“皇帝清問下民”是也。至茸荃德劣，不得上同於天，唯稱王而已。此雲“太上貴德”，鄭雲“帝皇之世”，則帝皇以上皆行德也。所以《中候·握河紀》雲：“皇道帝德，非朕所事。”是三皇行道，五帝行德，不同者但德由道生，道為其本，故道優於德。散而言之，德亦是道，故總雲“貴德”。既三皇行道，五帝行德，以次推之，則茸荃行仁，五霸行義。五帝雖行德，亦能有仁，故《大學》雲“堯舜率天下以仁”是也。案《老子》雲：“道常無名。”河上公雲：“能生天地人，則當大《易》之氣也。”《道德經》雲：“上德不德。”其德稍劣於常道，則三皇之世，法大《易》之道行之也。然則可行之道，則伏犧畫八卦之屬是也，三皇所行者也。“下德不失德”，河上公雲：“下德謂號諡之君。”則五帝所行者也。但三皇則道多德少，五帝則道少德多，此皆熊氏之說也。今謂道者開通濟物之名，萬物由之而有，生之不為功，有之不自伐，虛無寂莫，隨物推移，則天地所生，微妙不測。聖人能同天地之性，其愛養如此，謂之為道。此則常道，人行大道也。其如此善行為心，於已為得，雖不矜伐，意恆為善，謂之為德，此則劣於道也。既能推恩濟養，惻隱矜恤於物，謂之為仁，又劣於德。若其以仁招物，物不從已，征伐刑戮，使人服從，謂之為義，又劣於仁。以義服從，恐其叛散，以禮制約，苟相羈縻，是之謂禮，又劣於義。此是人情小禮，非大禮也。聖人之身，俱包五事，遇可道行道，可德行德，可仁行仁，可義行義，皆隨時應物，其實諸事並有，非是有道德之時無仁義，有仁義之時無道德也。此道德以大言之，則天地聖人之功也。以小言之，則凡人之行也。故鄭注《同禮》雲：“道多才藝，德能躬行。”謂於一人之上，亦能開通，亦於已為德。以此言之，則《周禮》三德六德及《皋陶》九德，及《洪範》三德，諸經傳道德皆有分域，小大殊名，不足怪也。○注“其民施而不惟報”。○正義曰：惟，思也。世既貴德，但有施惠而不思求報也。○“其次務施報”。○正義曰：“其次”謂茸荃之世也。“務”猶事也。茸荃之世，獨親其親，獨子其子，貨力為己，施則望報，以為恆事，故云“務施報”。○“禮尚往來”者，言茸荃之世，其禮主尚往來。○“貧賤而知好禮，則志不懾”者，懾，怯也，惑也。貧者之容，好怯惑畏人，使心志不遂，若知禮者，則持禮而行之，故志不懾怯，是以於負販之中，必有所尊也。○注“懾猶怯惑”。○正義曰：何胤雲：“憚所行為怯，迷於事為惑。”義或當然。" }
      - { type: j, text: "人生十年曰“幼”，學。名曰幼，時始可學也。《內則》曰：“十年出就外傅，居宿於外，學書計。”二十曰“弱“，冠。三十曰“壯”，有室。有室，有妻也。妻稱室。○冠，古亂反。四十曰“強”，而仕。五十曰“艾”，服官政。艾，老也。○艾，五蓋反，謂蒼艾色也；一音刈，治也。六十曰“耆”，指使。指事使人也。六十不與服戎，不親學。○耆，渠夷反，賀瑒雲：“至也，至老境也。”與音預。七十曰“老”，而傳。傳家事，任子孫，是謂宗子之父。○傳，直專反，沈直戀反。八十、九十曰“耄”。耄，惛忘也。《春秋傳》曰：“謂老將知，耄又及之。”○旄，本又作耄，同，亡報反，注同：本或作“八十曰耋，九十曰旄”，後人妄加之。惛音昏，一音呼困反。忘，亡亮反，又如字。知音智。七年曰“悼”。悼，憐愛也。○悼，徒報反。悼與耄，雖有罪，不加刑焉。愛幼而尊老。百年曰“期頤”。期猶要也。頤，養也。不知衣服食味，孝子要盡養道而已。○頤，羊時反。要，於遙反，又如字，下同。養道，羊尚反，又如字。大夫七十而致事。致其所掌之事於君而告老。若不得謝，謝猶聽也。君必有命，勞苦辭謝之，其有德尚壯，則不聽耳。○聽，吐丁反，後可以意求，皆不音。勞如字，又力報反。則必賜之几杖，行役以婦人，適四方，乘安車，自稱曰“老夫”，几杖、婦人、安車，所以養其身體也。安車，坐乘，若今小車也。老夫，老人稱也。亦明君貪賢。《春秋傳》曰：“老夫耄矣。”於其國則稱名。君雖尊異之，自稱猶若臣。越國而問焉，必告之以其制。鄰國來問，必問於老者以答之。制，法度。" }
      - { type: z, text: "“人生”至“其制”。○正義曰：此一節明人幼而從學，至於成德，終始之行，皆遵禮制，各隨文解之。○“人生十年曰幼，學”者，謂初生之時至十歲。依《內則》，子生八年“始教之讓，九年教之數日，十年出就外傅，居宿於外，學書計”，故以十年為節也。幼者，自始生至十九時，故《檀弓》雲：“幼名者，三月為名稱幼。”冠禮雲：“棄爾幼志。”是十九以前為幼。《喪服傳》雲：“子幼。”鄭康成雲：“十五已下，皆別有義。”今雲“十年曰幼，學”，是十歲而就業也。○“二十曰弱，冠”者，二十成人，初加冠，體猶未壯，故曰弱也。至二十九，通得名弱冠，以其血氣未定故也。不曰“人生”，並承上可知也。今謂庶人及士之子，若卿大夫十五以上則冠，故《喪服》雲“大夫為昆弟之長殤”是也。其冠儀與士同，故《郊特牲》雲“無大夫冠禮”是也。其大夫之子亦二十而冠，其諸侯之子亦二十而冠，天子之子則十二而冠。若天子諸侯之身，則皆十二而冠。具釋在《冠義》。○“三十曰壯，有室”者，三十而立，血氣已定，故曰壯也。壯有妻，妻居室中，故呼妻為室。若通而言之，則宮室通名，故《爾雅》雲：“宮謂之室，室謂之宮。”別而言之，論其四面穹隆則宮，因其貯物充實則曰室，室之言實也。今不雲“有妻”而云“有室”者，妻者，齊也，齊為狹局，雲室者，含妾媵，事類為廣。案《媒氏》雲：“男三十，女二十。”鄭康成雲：“二三者，天地相承覆之數也。”《易》曰：“參天兩地而地而奇數焉。”《白虎通》雲：“男三十筋骨堅強，任為人父。女二十肌膚充盛，任為人母，合為五十，應大衍之數，生萬物也。”○“四十曰強，而仕”者，三十九以前通曰壯，壯久則強，故“四十曰強”。強有二義，一則四十不惑，是智慮強；二則氣力強也。○“五十曰艾，服官政”者，四十九以前通曰強，年至五十，氣力已衰，發蒼白，色如艾也。五十是知天命之年，堪為大夫服事也。大夫得專事其官政，故曰“服官政”也。鄭康成注《孝經》雲：“張官設府謂之卿大夫。”即此之謂也。熊氏雲：“案《中候·運衡》雲‘年耆既艾’，注云：‘七十曰艾。’言七十者，以時堯年七十，故以七十言之。又《中候·準讖哲》雲：‘仲父年艾，誰將逮政。’注云‘七十曰艾’者，雲誰將逮政，是告老致政，致政當七十之時，故以七十曰艾。”○“六十曰耆，指使“者，賀瑒雲：“耆，至也，至老之境也。六十耳順，不得執事，但指事使人也。”鄭注《射義》雲：“耆耋皆老也。”○注“六十”至“不親學”。○正義曰：此《王制》文。引之者，證不自使也。○“七十曰老，而傳”者，六十至老境而未全老，七十其老已至，故言老也。既年已老，則傳徙家事，付委子孫，不復指使也。○注“傳家”至“之父”。○正義曰：然庶子年老，亦得傳付子孫，而鄭唯雲“謂宗子”者，為《喪服》有“宗子孤為殤”，鄭雲：“言孤，有不孤者，謂父有廢疾，若七十而老，子代主宗事者也。”鄭今欲會成《喪服》義，故引“宗子之父”也。又一雲“宗子”並謂五宗也。五宗之子並是傳祭之身，故指之也。庶子乃授家事於子，非相傳之事，此既雲“傳”，故鄭知非庶子也。必為宗子父者，以經言“傳”，傳者，上受父祖之事，下傳子孫，子孫之所傳家事，祭事為重，若非宗子，無由傳之。但七十之時，祭祀之事猶親為之，其視濯溉則子孫，故《序卦》注云“謂父退居田裏，不能備祭宗廟，長子當親視滌濯鼎俎”是也。若至八十，祭亦不為，故《王制》雲：“八十齊喪之事不及也。”注云：“不齊，則不祭也。”○“八十、九十曰耄”，耄者，僻謬也。人或八十而耄，或九十而耄，故並言二時也。○注“耄惽”至“及之”。○正義曰：“耄，惽忘也”者，“惽忘”即“僻謬”也。○所引《春秋》，案《左傳》昭元年，周景王使劉定公勞晉趙孟，定公勸趙孟纂禹之績，廣樹之功。趙孟對雲：“老夫罪戾，朝不謀夕。”劉子歸語王曰：“諺所謂老將知而耄及之者，其趙孟之謂乎？”引之者，證老為耄。○“七年曰悼”者，悼，憐愛也。未有識慮，甚可憐愛也。年七歲而在九十後者，以其同不加刑，故退而次之也。○“悼與耄，雖有罪，不加刑焉”者，幼無識慮，則可憐愛，老已耄而可尊敬，雖有罪，而同不加其刑辟也。《周禮·司剌》有三赦，一曰幼弱，二曰老耄，三曰憃愚。鄭注云：“若今時律令，未滿八歲，八十以上，非手殺人，他皆不坐。”故司剌有三赦，皆放免不坐也。○“百年曰期頤”者，期，要也；頤，養也。人年百歲，不復知衣服飲食寒暖氣味，故人子用心，要求親之意而盡養道也。“頤，養也”，《易·序卦》文。“大夫七十而致事”者，七十曰老，在家則傳家事於子孫，在官致所掌職事還君，退還田裏也。不雲置而云致者，置是廢絕，致是與人，明朝廷必有賢代已也。《白虎通》雲：“臣年七十懸車致仕者，臣以執事趨走為職，七十耳目不聰明，是以退老去避賢也，所以長廉遠恥。懸車，示不用也。致事，致職於君。君不使退而自去者，尊賢也。”○“若不得謝”者，謝猶聽許也。君若許其罷職，必辭謝雲：“在朝日久，劬勞歲積。”是許其致事也。今不得聽，是其有德尚壯，猶堪掌事，不聽去也。“則必賜之几杖”者，熊氏雲：“既不聽致事，則《祭義》雲‘七十杖於朝’是也。聽致事，則《王制》雲‘七十杖於國，八十杖於朝’是也。”案《書傳》雲：“七十杖於朝。”鄭注云：“朝當為國者，以其下有‘八十杖於朝’，故以朝當為國也。與《王制》同，並謂聽致事也。”○“行役以婦人”者，行役，謂本國巡行役事。婦人能養人，故許自隨也。○“適四方，乘安車”者，“適四方”，謂遠聘異國時。乘安車，安車，小車也，亦老人所宜。然此養老之具，在國及出，皆得用之。今言行役婦人，四方安車，則相互也，從語便，故離言之耳。○“自稱曰老夫”者，若此老臣行役及適四方，應與人語，其自稱為老夫，言已是老大夫也。必稱老者，明君貪賢之故，而臣老猶在其朝也。○注“几杖”至“耄矣”。○正義曰：“安車，坐乘，若今小車”者，古者乘四馬之車立乘。此臣既老，故乘一馬小車坐乘也。庾蔚雲：“漢世駕一馬而坐乘也。”熊氏雲：“案《書傳略說》雲：‘致仕者以朝，乘車輲輪。’鄭雲：‘乘車，安車。言輲輪，明其小也。’”“《春秋傳》曰：老夫耄矣”者，引《左傳》，證老臣對他國人自稱老夫也。此是《春秋》隱四年衛石碏辭也。石碏子厚與衛州籲游，籲弒其異毋兄完而自立，未能和民，欲結強援，時陳侯有寵於周桓王，州籲與石厚往陳，欲因陳自達於周，而石碏遣人告陳曰：“衛國褊小，老夫耄矣，無能為也，此二人者，實弒寡君，敢即圖之。”○“於其國則稱名”者，“於其國”，謂自與其君言也，雖老，猶自稱名也。○注“君雖尊異之，自稱猶若臣”者，案《玉藻》雲“上大夫曰下臣”，《士相見禮》雲“士大夫於他邦之君曰外臣”，是上大夫於已君自稱為下臣，於他國君自稱為外臣。又《玉藻》雲“下大夫自名”，又鄭注《玉藻》雲“下大夫自名，於他國則曰外臣某”，其是下大夫於已君稱名，於他國曰外臣某。此既自稱老夫，宜是上大夫，而稱名從下大夫者，既被君尊異，故臣亦謙退，從下大夫之例而稱名也。且《玉藻》所云，是其從下大夫例，然臣於君，單稱名無嫌也。○“越國而問焉，必告之以其制”者，越國猶他國也，若他國來問已國君之政，君雖已達其事，猶宜問於老賢，老賢則稱國之舊制以對他國之問也。" }
      - { type: j, text: "謀於長者，必操几杖以從之。從，猶就也。○長，丁丈反，下皆同。操，七刀反。長者問，不辭讓而對，非禮也。當謝不敏，若曾子之為。" }
      - { type: z, text: "“謀於”至“從之”。○正義曰：此一節明有事取謀議於長者，各依文解之。○“操几杖以從之”者，操，執持也。杖可以策身，幾可以杖己，俱是養尊者之物，故於謀議之時將就也。" }
      - { type: j, text: "凡為人子之禮，冬溫而夏凊，昏定而晨省。安定其床衽也，省問其安否何如。○夏，遐嫁反。凊，七性反；字從冫，冰，冷也；本或作水旁，非也。衽，而審反，徐而鴆反，席也。在醜夷不爭。醜，眾也。夷猶儕也。四皓曰：“陛下之等夷。”○儕，仕皆反，等也，沈才詣反。皓，元老反；四皓，園公、綺季、夏黃公、角里先生。" }
      - { type: z, text: "“凡為”至“不爭”。○正義曰：此一節明人子事親奉養之禮，又去爭訟，今各隨文解之。○“昏定而晨省”者，上雲冬溫夏凊，是四時之法，今說一日之法。定，安也。晨，旦也。應臥，當齊整床衽，使親體安定之後，退。至明旦，既隔夜，早來視親之安否何如。先昏後晨，兼示經宿之禮。熊氏雲：“晨省者，案《內則》雲，同宮則雞初鳴，異宮則昧爽而朝。”○“在醜夷不爭”者，此一句明朋儕禮也。醜，眾也；夷猶儕也，皆等類之名。風俗語不同，故兼言之。夫貴賤相臨，則存畏憚，朋儕等輩，喜爭勝負，亡身及親，故宜誡之以不爭。○注“醜眾”至“等夷”。○正義曰：“醜，眾也”，《釋詁》文，謂在眾不忿爭也。雲“四皓曰：陛下之等夷”者，證夷是等類也。四皓，漢時隱人高士也。其四人，一東園公，二綺裏季，三夏黃公，四角里先生，皆老，發白皓素，因呼為四皓。隱商山不仕，高祖數召不出。後為高祖欲廢呂后之子盈，而立戚夫人之子趙王如意為大子，張良使太子卑辭安車遣辨士以請四皓，四皓果來，舍建城侯所。至漢十一年，黥布反，高祖令太子將兵擊之。四皓自相謂曰：“幾來欲以安太子，太子將兵，事危矣。”乃說建城侯曰：“太子將兵有功則位不益，無功則從此受禍。且太子所與諸將，皆嘗與上定天下驍將也。今使太子將之，此無異使羊將狼，皆不肯為用，其無功必矣。臣聞母愛者子抱之，今戚夫人日夜侍御，趙王常居前，上終不使不肖子居愛子之上，明乎其代大子之位必矣。君何不急請呂后承間為上泣言：“黥布天下猛將，善用兵，諸將皆陛下之等夷，今令大子將此屬，莫肯為用。’”於是呂后如四皓言以請高祖。高祖時疾，自行，十二年破黥布還而疾益甚，愈欲易太子。及燕置酒，太子侍，四皓從太子，高祖驚曰：“吾召公數歲，公逃我，今反從我兒乎！”四皓曰：“陛下輕士善罵，臣等義不受辱，故恐而亡匿。”" }
      - { type: j, text: "夫為人子者，三賜不及車馬，三賜，三命也。凡仕者，一命而受爵，再命而受衣服，三命而受車馬。車馬，而身所以尊者備矣。卿、大夫、士之子不受，不敢以成尊比逾於父。天子諸侯之子不受，自卑遠於君。○遠，於萬反。故州閭鄉黨稱其孝也，兄弟親戚稱其慈也，僚友稱其弟也，執友稱其仁也，交游稱其信也。不敢重受賜者，心也，如此而五者備有焉。《周禮》二十五家為閭，四閭為族，五族為黨，五黨為州，五州為鄉。僚友，官同者。執友，志同者。○僚，本又作寮，了彫反，同官者。弟，大計反，下注同。見父之執，不謂之進不敢進，不謂之退不敢退，不問不敢對，敬父同志，如事父。此孝子之行也。" }
      - { type: z, text: "“夫為”至“行也”。○正義曰：此一節明人子謙卑，行著於外，所敬又廣。今各隨文解之。言“夫”者，貴賤悉然也。“三賜”，三命也。言為人子，雖受三命之尊，終不敢受車馬，車馬則身有成尊，便比逾於父，故不受。所以許受三命，而不許受車馬者，命是榮美，光顯祖父，故受也；車馬是安身，身安不關先祖，故不受也。不雲“不受”，而云“不及”者，受是已到之日，明人子非唯外跡不受，抑亦心所不及於此賜也。○注“三賜”至“於君”。○正義曰：雲“三賜不及”者，受命即受賜，故三賜三命，故《公羊》雲：“命者何？加我服”，“錫者何？賜也。”是其命賜將相也。雲“凡仕者，一命受爵，再命受衣服，三命受車馬”者，皆約《周禮·大宗伯》之文。案《大宗伯》“一命受職”，職則爵也。又《宗伯》“三命受位”，鄭康成雲：“始有列位於王朝。”今言“受車馬”者，但三命受位，即受車馬。以經雲“車馬”，故以“車馬”言之。雲“卿、大夫、士之子不受，不敢以成尊比逾於父”者，以公侯伯卿三命，其子不受，不敢比於父；公侯伯大夫、子男卿再命，公侯伯士一命，子男之士不命，其子三命不受車馬者，皆是不敢逾於父。不言天子諸侯之子不敢受者，以其父位既尊，不得言不敢比逾，故云“自卑遠於君”。案《周禮》九儀，“一命受職，再命受服，三命受位，四命受器，五命賜則，六命賜官，七命賜國，八命作牧，九命作伯”。案《含文嘉》：“九賜：一曰車馬，二曰衣服，三曰樂則，四曰朱戶，五曰納陛，六曰虎賁，七曰斧鉞，八曰弓矢，九曰秬鬯。”宋均注云：“進退有節，行步有度，賜以車馬，以代其步。言成文章，行成法則，賜以衣服，以表其德。動作有禮，賜以納陛，以安其體。長於教誨，內懷至仁，賜以樂則，以化其民。居處修理，房內不洩，賜以朱戶，以明其別。勇猛勁疾，執義堅強，賜之虎賁，以備非常。抗揚威武，志在宿衛，賜以斧鉞，使得專殺。內懷仁德，執義不傾，賜以弓矢，使其專征。慈孝公母，賜以秬鬯，以歸祭祀。”鄭司農以《周禮》九命與九賜是一也。然則此“三賜”，鄭康成知非“九賜”之第三，而云“三命之賜”者，康成以九命與九賜不同，九賜謂“八命作牧，九命作伯”之後，始加九賜。知者，《王制》雲“三公一命卷，若有加，則賜。二曰衣服之屬”是也。又《宗伯》“八命作牧”注云：“侯伯有功德，加命得專征伐。”《王制》雲：“賜弓矢，然後徵。”《詩》雲：“瑟彼玉瓚，黃流在中。”傳曰：“九命然後賜以圭瓚。”又《尚書·文侯》：“仇受弓矢秬鬯。”《左傳》：“晉文公受大路、戎路、弓矢、秬鬯、虎賁。”此皆九命之外，始有衣服、弓矢、秬鬯等之賜，故知九賜不與九命同也。且此雲“三賜不及車馬”，其九賜“一曰車馬”，何由三賜不及車馬乎？故知此三賜非九賜之三賜也。若是九賜之三賜，即是身八命九命之尊，禮絕凡庶，何得下文雲州閭、鄉黨、僚友、交游也？故康成以為諸侯及卿大夫之子三命者。其《公羊》說九賜之次，與《含文嘉》不同，一曰加服，二曰朱戶，三曰納陛，四曰輿馬，五曰樂則，六曰虎賁，七曰斧鉞，八曰弓矢，九曰秬鬯。異人之說，故文有參差，大略同也。《異義》許慎說九賜九命，鄭康成以為不同，具如前說，其大夫賜樂，《鄉飲酒》注云“大夫若君賜樂”，及《左傳》“魏絳有金石之樂”，非九賜之正法也。車馬之賜，進退由於君命，今言不受者，君子仕，辭位不辭祿，其物終必受之，故鄭注下文“不敢受重賜者，心也。”○“故州閭”至“稱其信也”。《周禮·司徒》去王城百，置遠郊，遠郊之內為六鄉，六鄉之民，“五家為比，使之相保。五比為閭，使之相受。四閭為族，使之相葬。五族為黨，使之相救。五黨為州，使之相賙。五州為鄉，使之相賓”。又《遂人職》主六遂，六遂之民在遠郊之外，“五家為鄰，五鄰為裏，四里為酇，五酇為鄙，五鄙為縣，五縣為遂”。今不言六遂者，舉近耳。若六遂之中有此孝者，則亦稱之也。○“兄弟親戚稱其慈也”，親指族內，戚言族外。慈者，篤愛之名。兄弟，外內通稱。親疏交接，並見其慈而稱之。○“僚友稱其弟也”，僚友，同官者也。弟者，事長次弟之名。孝子能接同官，有所次序，不敢逾越等級，故同官之友稱之。○“執友稱其仁也”，執友，執志同者也。同師之友，意趣相得，綢繆切瑳，故其見仁恩之心而稱之。○“交游稱其信也”，交游，泛交也。結交游往，本資信合，故稱信也。熊氏雲：“然此五句，上始州閭，下及交游，亦其次也。前孝後信，又為差序，略舉五者，餘行可知。不敢受賜者，心也。不受由心，故有五稱也。”○“見父之執”者，此亦承為人子之事也。明非惟見交游為善，乃遍至父友也。自上詣下曰見，自下朝上曰見。父之執謂執友，與父同志者也。或故往見，或路中相見也。" }
      - { type: j, text: "夫為人子者，出必告，反必面。告、面同耳，反言面者，從外來，宜知親之顏色安否。○告，古毒反。所游必有常，所習必有業。緣親之意，欲知之。恆言不稱老。廣敬。年長以倍，則父事之。謂年二十於四十者，人年二十，弱冠成人，有為人父之端。今四十於二十者有子道。《內則》曰：“年二十，惇行孝弟。”○冠，工喚反。惇，都溫反。十年以長，則兄事之。五年以長，則肩隨之。肩隨者，與之並行差退。○差，初佳反，徐初宜反。群居五人，則長者必異席。席以四人為節，因宜有所尊。" }
      - { type: z, text: "“夫為”至“異席”。○正義曰：此一節亦明人子事親之法，游方習業，及汎交之禮，亦各隨文解之。○“恆言不稱老”者，老是尊稱，若其稱老，乃是己自尊大，非是孝子卑退之情，故注云：“廣敬。”言廣者，非但敬親，因敬親廣敬他人。或雲子若自稱老，父母則甚老，則感動其親，故舜年五十而慕是也。○“年長以倍，則父事之”者，此謂鄉里之中，非親非友，但二十以後，年長倍己，則以父道事之，即父黨隨行也。○注“謂年”至“孝弟”。○正義曰：人年三十而娶，於後乃有子，則三十於六十，乃是倍年。今鄭言二十於四十者，但二十加冠成人，責以為人父為人子之禮，雖未有妻子，有為人父之端，又《內則》雲“二十乃能敦行孝弟，可責以孝子之行”，故二十於四十，約之為倍年也。以二十未合有子，故鄭云為人父之端，有子道也。○“十年以長，則兄事之”者，謂年二十於三十者，全倍者父事之，半倍，故兄事之也。凡事之，則正差退而雁行也。○“五年以長，則肩隨之”者，謂並行而差退。若未二十童子則無此禮，以其不能惇行孝弟。《論語》雲“與先生並行”，《王制》雲“父之齒隨行，兄之齒雁行”者，舉成人有此禮也，童子禮則無也。此謂二十於二十五者肩隨，則齊於雁行也。然則以此肩隨而推之，上雲父兄事之，豈是溫凊如親，正言其或行來坐席，推前相類耳。○群居五人，則長者必異席”者，謂朋友居處法也。群，朋友也。子夏曰“吾離群”是也。古者地敷橫席而容四人，四人則推長者居席端。若有五人會，應一人別席，因推長者一人於異席也。○注“席以”至“所尊”。○正義曰：熊氏雲：“知四人為節者，以此雲‘群居五人，則長者必異席’，既長者一人異席，餘則四人矣。”案《公食大夫禮》雲：“蒲筵常，加萑席尋。”此以蒲席者，故得容四人，此群居之法。若賓主禮席，皆無同坐之法，故《鄉飲酒》賓介異席，又云：“眾賓之席，皆不屬焉。”不相連屬也。”《鄉射》“眾賓之席繼而西”，謂相連屬也。《燕禮》及《大射》公三重，大夫再重，是皆異席也。" }
      - { type: j, text: "為人子者，居不主奧，坐不中席，行不中道，立不中門。謂與父同宮者也，不敢當其尊處。室中西南隅謂之奧。道有左右。中門，謂棖闑之中央。《內則》曰：“由命士以上，父子皆異宮。”○奧，烏報反，沈於六反。處，昌慮反，下同。棖，宜衡反，闑也。闑，魚列、五結二反。上，時掌反，凡言“以上”皆放此。食饗不為，，量也。不制待賓客饌具之所有。○食音嗣。饗本又作享，香兩反。，古愛反。饌，士戀反。祭祀不為屍。尊者之處，為其失子之道。然則屍卜筮無父者。○為其，音於偽反，下注除“不為孤”皆同。聽於無聲，視於無形。恆若親之將有教使然。不登高，不臨深，不苟訾，不苟笑。為其近危辱也。人之性，不欲見毀訾，不欲見笑。君子樂然後笑。○訾音紫，毀也，沈又將知反。樂音洛。" }
      - { type: z, text: "“為人”至“苟笑”。○正義曰：此一節明孝子居處及行立待賓祭祀敬慎之事，各隨文解之。○此明孝子居處閨門之內。不言凡者，或異居禮則不然。○“居不主奧”者，主猶坐也。奧者，室內西南隅也。室鄉南戶，近東南角，則西南隅隱奧無事，故呼其名為奧。常推尊者於閒樂無事之處，故尊者居必主奧也。既是尊者所居，則人子不宜處之也。○“坐不中席”者，一席四人，則席端為上。今不雲上席而言中者，舊通有二，一雲敬無餘席，非唯不可上，亦不可中也；一雲共坐則席端為上，獨坐則席中為尊。尊者宜獨，不與人共，則坐常居中，故卑者坐不得居中也。○“行不中道”者，尊者常正路而行，卑者故不得也。男女各路，路各有中也。○“立不中門”者，中央有闑，闑傍有棖，棖謂之門梐。今雲“不中門”者，謂棖闑之中，是尊者所行，故人子不得當之而行也。○注“謂與”至“異宮”。○正義曰：凡上四事，皆謂與父同宮者爾。若命士以上，則父子異宮則不禁。所以爾者，有命既尊，各有臣僕，子孫應敬已故也。雲“不敢當其尊處”者，四事皆尊者之處。“室中西南隅謂之奧”者，《爾雅·釋宮》文。郭璞注云：“隱奧之處。”“西北隅謂之屋漏”，孫氏雲：“日光所漏入。”“東北隅謂之宧”，孫氏雲：“日側之明。”是宧，明也。“東隅謂之窔”，郭氏雲：“隱暗也。”雲“《內則》曰：由命士以上，父子皆異宮”者，證有異居之道也。○“食饗不為”者，熊氏雲：“謂傳家事任子孫，若不傳家事，則子孫無待賓之事。大夫士或相往來，設於饗食量也。不制設待賓饌，其事由尊者所裁，而子不得輒豫限量多少也。”○“祭祀不為屍”者，屍代尊者之處，故人子不為也。○“聽於無聲”者，謂聽而不聞父母之聲，此明人子常禮也。○“視於無形”者，謂視而不見父母之形，雖無聲無形，恆常於心想像，似見形聞聲，謂父母將有教，使己然也。○“不苟訾，不苟笑”者，苟，且也。相毀曰訾。不樂而笑為苟笑。彼雖有是非，而己苟譏毀訾笑之，皆非彼所欲，必反見毀辱，故孝子不為也。○注“為其”至“後笑”。○正義曰：“危”，解“不登高，不臨深”，“辱”釋不訾不笑也。雲“君子樂然後笑”者，引《論語》證不苟笑之事也。此是公明賈答孔子云：“夫子樂然後笑，人不厭其笑也。”" }
      - { type: j, text: "孝子不服暗，不登危，懼辱親也。服，事也。暗，冥也。。不於闇冥之中從事，為卒有非常，且嫌失禮也。男女夜行以燭。○瞑，本亦作冥，莫定反。下同。卒，才忽反。父母存，不許友以死。為忘親也，死為報仇讎。不有私財，" }
      - { type: z, text: "“孝子”至“私財”。○正義曰：此一節明孝子自謹慎其身，不許友以死，及不得有私財之事，各隨文解之。○“不服暗”者，服，事也，謂不行事於闇中也。一則為卒有非常，一則闇中行事，好生物嫌，故孝子深戒之。○“父母存，不許友以死”者，謂不許為其友報仇讎也，親存存須供養，則孝子不可死也。若父母存，許友報仇怨而死，是忘親也。親亡則得許友報仇，故《周禮》有“主友之讎，視從父兄弟”。《白虎通》雲：“朋友之道親存不得行者，不得許友以其身，亦不許友以死耳。”○“不有私財”者，家事統於尊，財關尊者，故無私財。" }
      - { type: j, text: "為人子者，父母存，冠衣不純素。為其有喪象也。純，緣也。《玉藻》曰：“縞冠玄武，子姓之冠也。高冠素紕，既祥之冠也。”《深衣》曰：“具父母，衣純以青。”○純，諸允反，又之閏反，下及注皆同。緣，悅絹反。縞，古老反，沈又古到反。紕，婢支反，徐補移反。" }
      - { type: z, text: "“為人”至“純素”。○正義曰：此一節明為人子父母存及孤子衣冠純飾不同之事，各隨文解之。不言凡者，若仕者或遇凶荒，雖親存亦須素服，非要在親沒，故不言凡。○“父母存，冠衣不純素”者，冠純謂冠飾也，衣純謂深衣領緣也。《禮》，具父母，太父母，存冠衣純以繢；若有父母，無太父母，則純以青；若少而並無，則乃純素也。故親存者不得純素也。○注“為其”至“以青”。○正義曰：引《玉藻》“縞冠玄武，子姓之冠”，證冠純有吉凶之別也。縞冠者，薄絹為之。玄武者，以黑繒為冠卷也。子姓者，姓，生也，孫是子所生，故謂孫為子姓。父有服未畢，子雖已除，猶未全吉也，故縞冠玄武。玄武是吉，縞冠為兇，明吉凶兼服也。何胤雲：“繒裏卷武也。”雲“縞冠素紕，既祥之冠也”，又證有素為兇也。當祥之日，朝服縞冠；祥祭之後，則縞冠素紕。何胤雲：“素紕謂緣冠兩邊。”雲“《深衣》曰：具父母衣純以青”者，引證不純以素之事。" }
      - { type: j, text: "孤子當室，冠衣不純採。早喪親，雖除喪，不忘哀也。謂年未三十者。三十壯，有室，有代親之端，不為孤也。當室，適子也。《深衣》曰：“孤子衣純以素。”○早喪，息浪反。適，下歷反。" }
      - { type: z, text: "“孤子”至“純採”。○正義曰：上言有親而不素，此言無親而素者也。孤子謂二十九以下而無父者，當室謂適子也。既少孤，故雖除服，猶自素也。然《深衣》雲：“孤子衣純以素。”則嫡庶悉然。今雲“當室”，則似庶子不同，所以爾者，通者有二，雲凡子皆然，豈唯當室，但嫡子內理蒸嘗，外交宗族，代親既備，嫌或不同，故特明之，所以鄭引《深衣》為注，會證凡孤子悉同也。崔靈恩雲：“指謂當室，不當室則純採，所以然者，當室之孤，內理蒸嘗，外交宗族，所履之事，莫不傷心，故特純素示哀也。《深衣》不雲當室者，文略耳。”○注“早喪”至“以素”。○正義曰：三十以外遭喪者，除服後即得純採。今所言雖是除喪，未三十不得純採。若至三十，則亦採也，故云“當室，適子也。《深衣》曰：‘孤子衣純以素也。’”然注前解適子，後引《深衣》，似崔解也。《深衣》不言冠者，從可知也。" }
      - { type: j, text: "幼子常視母誑。視，今之示字。小未有所知，常示以正物，以正教之無誑欺。○視音示。誑，本或作廷，注同，九況反，欺也。童子不衣裘裳。裘大溫，消陰氣，使不堪苦。不衣裘裳，便易。○衣，於既反，下同。大音泰，徐他佐反。便，婢面反。易，以豉反。立必正方，不傾聽。習其自端正。長者與之提攜，則兩手奉長者之手。習其扶持，尊者提攜，謂牽將行。○提，大兮反。攜，戶圭反。奉，芳勇反，又扶恭反，下及注“奉扃”、“奉席”、“奉箕”皆同。負劍辟咡詔之，負謂置之於背，劍謂挾之於旁。辟咡詔之，謂傾頭與語，口旁曰咡。○闢，匹亦反，側也，徐芳益反，沈扶赤反，注同。咡，徐如志反，何雲：“口耳之間曰咡。”挾音協。則掩口而對。習其鄉尊者屏氣也。○掩，於檢反。鄉，許亮反，本又作向，後文注皆同。屏，必領反。" }
      - { type: z, text: "“幼子”至“裘裳”。○正義曰：此一節明父母教子及衣裘裳之法也，各隨文解之。○小兒恆習效長者，長者常示以正事，不宜示以欺誑，恐即學之，故曾子兒啼，妻雲：“兒莫啼，吾當與汝殺豕。”兒聞輒止，妻後向曾子說之，曾子曰：“勿教兒欺。”即殺豕食兒。是不誑也。○注“視，今之示字”。○正義曰：古者觀視於物，及以物視人，則皆作示傍著見，後世已來，觀視於物，作示傍著見，以物示人單作示字，故鄭注經中視字者，是今之以物示人之示也。是舉今以辨古。《昏禮》“視諸衿鞶”，注云：“視乃正字，今文視作示，俗誤行之。”言視正字也，言古之以物示人作視字為正，故云“視乃正字”。今文《儀禮》應為古視字，乃作今示字，故言俗誤也。○“童子不衣裘裳”者，童子，未成人之名也，衣猶著也。童子體熱，不宜著裘，裘大溫，傷陰氣也。又應給役，若著裳則不便，故並不著也。故童子並緇布襦袴也。○注“裘大”至“便易”。○正義曰：“使不堪苦”者，熱消陰氣，則不堪苦使也。此“童子不衣裘裳”，二十則可，故《內則》雲，二十“可以衣裘帛”。國君十二冠，則裘裳早矣。女子十五許嫁者則亦衣帛。《詩》雲：“乃生男子，載衣之裳。”是初生暫行此禮。○“立必”至“而對”。○“立必正方”，立宜正鄉一方，不得傾頭屬聽左右也。張逸雲：“此說其威儀常然。”○“長者與之提攜，則兩手奉長者之手”者，非唯教之聽立，至於行步，亦宜教之。提攜謂牽將行時，因牽行之，又教之為節也。奉長者之手，為兒長大，方當供養扶持長者，故先使學之，令習便也。張逸雲：“說其見與行之法也。”○“負劍辟咡詔之”者，豈但在行須教，正在抱時亦令習也。負謂致兒背上也，劍謂挾於脅下，如帶劍也。闢，傾也。咡，口旁也，詔，告也。長者，或若負兒之時而與之語，當傾頭以告之也。不正向之，令氣不觸兒也，亦令見長者所為而複習之也。張逸雲：“辟咡詔之，傾頭以告教之也。”此長者之為也。此負謂兒在人背上曰負，兒在懷中亦稱負，謂兒負之，故《內則》雲：“三日始負子。”注云：“負之謂抱之。”○注“口旁曰咡”。○正義曰：案《管子書·弟子職》雲：“食已循咡覆手。”謂弟子食訖，以手循覆於咡，故知是口旁也。○“則掩口而對”者，向長者告語之，此是童子答長者。童子雖未能掩口而對，長者亦教其為之其禮，以為後法。掩口，恐氣觸人。張逸雲：“謂令小者如是，所習鄉尊者屏氣也。”" }
      - { type: j, text: "《禮記正義》" }
