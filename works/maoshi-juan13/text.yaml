# 毛詩正義卷13（孔穎達疏）：j 為經文＋毛亨傳、鄭玄箋，z 為疏文。
sections:
  - id: juan13
    name: 正文
    blocks:
      - { type: j, text: "《鼓鍾》，刺幽王也。" }
      - { type: z, text: "“《鼓鍾》四章，章五句”至“幽王”。○正義曰：毛以刺鼓其淫樂，以示諸侯。鄭以為作先王正樂於淮水之上。毛、鄭雖其意不同，俱是失所，故刺之。經四章，毛、鄭皆上三章是失禮之事，卒章陳正禮責之。此刺幽王明矣。鄭於《中候》、《握河》注云“昭王時，《鼓鍾》之詩所為作”者，鄭時未見《毛詩》，依三家為說也。" }
      - { type: j, text: "鼓鍾將將，淮水湯湯，憂心且傷。幽王用樂，不與德比，會諸侯於淮上，鼓其淫樂，以示諸侯。賢者為之憂傷。箋雲：為之憂傷者，嘉樂不野合，犧、象不出門。今乃於淮水之上，作先王之樂，失禮尤甚。○將，七羊反。湯音傷。比，毗志反。為，於偽反。下同。犧象，素何反，皆樽名，王音羲。" }
      - { type: j, text: "淑人君子，懷允不忘。箋雲：淑，善。懷，至也。古者，善人君子，其用禮樂，各得其宜，至信不可忘。" }
      - { type: z, text: "“鼓鍾”至“不忘”。毛以為，言幽王會諸侯於淮水之上，鼓其淫樂以示之。鼓擊其鍾而聲將將然，其傍淮水之流湯湯然。於淮上作樂，以示諸侯，而其樂不與德比，故賢者為之憂結於心，且復悲傷，傷其失所也。故相念古人，言古之善人君子，其用禮樂得宜者，至實信然不忘也。“至信”俱言其實然耳。鄭唯以為正樂為異，其文義則同。○傳“幽王”至“憂傷”。○正義曰：王者象功成以作樂，其意與道德和比。今幽王用樂，不與德比者，正謂鼓其淫樂是也。毛直言淫樂，不知以何為淫樂。王基曰：“所謂淫樂者，謂鄭、衛桑間濮上之音，師延所作新聲之屬。”王肅雲：“凡作樂而非所，則謂之淫。淫，過也。幽王既用樂不與德比，又鼓之於淮上，所謂過也。桑間濮上，亡國之音，非徒過而已。”未知二者誰當毛旨也。言會諸侯淮上者，以淮遠於京師，非王常行之處，不應遠適淮上，獨自作樂。明其有會聚而作之，故知會諸侯也。○箋“為之”至“尤甚”。○正義曰：“犧、象不出門，嘉樂不野合”，定十年《左傳》孔子辭也。服虔雲：犧、象，饗禮犧尊、象尊也。嘉樂，鍾鼓之樂也。引此者，以野尚不可，今乃於淮水之上作先王之樂，失禮尢甚大也。與彼文倒者，以證樂事，故先言樂也。傳言“淫樂”，箋易之為“先王之樂”者，以卒章所陳是先王正樂之事，舉得正以責王，明是王作之失所耳，非有他樂也，故孫毓雲：“此篇四章之義，明皆正聲之和。”“欽欽”，人樂進之善。“同音”，四縣克諧。“以雅以南”，既以其正，且廣所及。“以籥不僣”，又為和而不僣差。皆無淫樂在其間也。則未知幽王曷為作先王之樂於淮水之上耳。二者之說，箋義為長。如毓此言，不信毛為會諸侯也。箋於上下皆不言諸侯，或亦以如毓不知何為如此作，故不言也。" }
      - { type: j, text: "鼓鍾喈喈，淮水湝湝，憂心且悲。喈喈，猶將將。湝々，猶湯湯。悲，猶傷也。○喈音皆。湝，戶皆反。淑人君子，其德不回。回，邪也。○邪，似嗟反。" }
      - { type: j, text: "鼓鍾伐鼛，淮有三洲，憂心且妯。鼛，大鼓也。三洲，淮上地。妯，動也。箋雲：妯之言悼也。○{鼓咎}，古毛反，長丈二尺。妯，敕留反，徐又直留反，郭音《爾雅》盧叔反，又音迪。" }
      - { type: j, text: "淑人君子，其德不猶。猶，若也。箋雲：猶當作瘉。瘉，病也。○猶如字，鄭改作“瘉”，羊主反。" }
      - { type: z, text: "“鼓鍾”至“不猶”。毛以為，幽王會諸侯而示之淫樂，鼓擊其鍾，伐擊其{鼓咎}，於淮水有三洲之地。由此失所，賢者為之憂結於心，且為之變動容貌也。念古之善人君子，其用禮樂，當得其宜，其德不肯若今之幽王失所也。鄭以為，幽王作先王正樂，擊鍾伐{鼓咎}於淮上。賢者為憂心，且悼傷。思古之善人君子，其德不於禮法為病者。類上“不忘”、“不回”，故以“猶”為“瘉”。瘉是病名，與上相類。《角弓》雲“不令兄弟，交相為瘉”，《斯干》雲“兄及弟矣，無相猶矣”，以彼二文，知猶、瘉相近而誤。○傳“鼛大”至“上地”。○正義曰：鼛即皋也，古今字異耳。《韗人》雲：“皋鼓尋有四尺。”長丈二，是大鼓也。三洲系淮言之，水中可居曰洲，故知淮上之地。○箋“妯之言悼”。○正義曰：以類上傷、悲，故為悼也。" }
      - { type: j, text: "鼓鍾欽欽，鼓瑟鼓琴，笙磬同音。欽欽，言使人樂進也。笙磬，東方之樂也。同音，四縣皆同也。箋雲：同音者，謂堂上堂下八音克諧。○樂音嶽。縣音玄。" }
      - { type: j, text: "以雅以南，以籥不僣。為雅為南也。舞四夷之樂，大德廣所及也。東夷之樂曰昧，南夷之樂曰南，西夷之樂曰朱離，北夷之樂曰禁。以為籥舞，若是為和而不僣矣。箋雲：雅，萬舞也。萬也、南也、籥也，三舞不僣，言進退之旅也。周樂尚武，故謂萬舞為雅。雅，正也。籥舞，文樂也。○籥，以灼反，樂器。僣，七心反，沈又子念反，又楚林反。韎，本又作“昧”，音昧，又莫戒反。禁，居蔭反。" }
      - { type: z, text: "“鼓鍾”至“不僣”。○毛以為，幽王既作淫樂失所，故言其正者。言善人君子皆鼓擊其鍾，則其聲欽欽然，人聞而樂進其善。又鼓其瑟與琴，又擊其堂下東方之笙磬，於是四縣之樂皆得和同其音矣。琴瑟，堂上也；笙磬，堂下也，是上下之樂得所，以為王者之雅樂，以為四方之南樂，又以為羽舞之籥樂，如是音聲舒合，節奏得所，為和而不參差，此正樂之作也。王何為不如此作之，乃鼓其淫樂於淮水之上，以示諸侯乎？鄭以為，上三章言幽王作正樂於淮水之上，失其處，故此言其正樂，鼓其鍾欽欽然，又鼓其瑟與琴，吹匏竹之笙與玉石之磬，於是堂上之琴瑟，與堂下之磬鍾，皆同其聲音，不相奪倫。又以為雅樂之萬舞，以為南樂之夷舞，以為羽籥之翟舞，此三者，皆不僣差，又作不失處，故可為美，王今何故於淮水而作之乎？○傳“欽欽”至“皆同”。○正義曰：此欽欽亦鍾聲也。雲“使人樂進”者，以陳先王之正樂正聲之美，使人樂心於善。《樂記》說樂之和，感動人之善心而已。是聞樂而進於善也。以鍾在前，故先言其狀，雲“欽欽”，明下琴瑟等亦得所也。以鼓瑟、鼓琴類之，故鼓鍾為擊鍾也。樂器多矣，必以鍾為首而先言之者，以作樂必擊鍾。《左傳》謂之“金奏”，是先擊金以奏諸樂也。言“笙磬，東方樂”者，以東方物生之位，故謂其磬為笙磬也。《大射》“樂人宿縣阼階東，笙磬西面，其南笙鍾，其南鑮，皆南陳”，注云：“笙，猶生也。東為陽中，萬物以生。”是東方為笙磬。舉磬則鍾鑮可知矣。以笙磬之下，即言“同音”，故知四縣皆同也。《小胥》雲：“王宮縣。”鄭司農雲：“宮縣，四面縣。”是也。以東為始，舉笙磬則四方可知故也。○箋“同音”至“克諧”。○正義曰：以上言鍾及琴瑟，是琴瑟為堂上，鍾為堂下，故為笙與磬俱在堂下，以配鍾而同音。堂下既同，則堂上亦同，故云八音克諧。“八音克諧”，《尚書》文，言其能相諧和也。八音者，《春官·太師》雲：“以八音：金、石、土、革、絲、木、匏、竹。”注云：“金，鍾也。石，磬也。土，壎也。革，鼓也。絲，琴瑟也。木，柷敔也。匏，笙也。竹，管也。”此經言鍾、琴、笙、磬，是金、石、絲、匏四者矣。舉此明土、革、竹、木亦和同可知。○傳“為雅”至“僣矣”。○正義曰：以三者舞名，故與上異其文。詩言其志，歌詠其聲，舞動其容，故舞在後也。傳言“為雅為南”者，明以為此舞。以“籥”屬下句，故別言之雲“以為籥舞”，明其上皆為矣。若是和者，若，如也，謂此三舞與上琴、瑟、笙、磬節奏齊同，如是乃為和也。此三者雖是舞，包上琴、瑟謂之樂。箋“周樂尚武，故謂萬舞為雅”，是以先言雅也。南先籥者，進之以韻句。以上下類之，則知南亦舞也。以四夷之樂，所取者不盡取其樂器，唯取舞耳，故言“舞四夷之樂”。美大王者德廣能所及，故舞之也。《白虎通》雲：“王者制夷狄樂，不制夷狄禮何？”以為均中國也，即為夷禮，恐夷人不宜隨中國禮也。四夷之樂，唯為舞以使中國之人，是夷樂唯舞也。《明堂位》曰：“昧，東夷之樂也。任，南蠻之樂也。納夷蠻之樂於大廟，言廣魯於天下也。”是廣所及也。魯下天子，因在東南，用二方耳。《旄人》雲：“舞四夷之樂。”故此傳廣言四方以明之。經獨舉南，可以兼也。《孝經·鉤命決》雲：“東夷之樂曰昧，南夷之樂曰任，西夷之樂曰株離，北夷之樂曰禁。東方之舞，助時生也。南方，助時養也。西方，助時殺也。北方，助時藏也。”然則言“昧”者，物生根也。“南”者，物懷任也。秋物成而離其根株，冬物藏而禁閉於下，故以為名焉。以“南”訓“任”，故或名“任”，此為“南”，其實一也。定本作“朱離”，其義不合。於此言“南”而得總四夷者，以周之德先致南方，故《秋官》立“象胥”之職，以通譯四夷，是言“南”可以兼四夷也。然則舞不立“南師”，而立“昧師”者，以象胥曲以示法。昧，四夷之始，故從其常，而先立之也。若然《虞傳》雲：“東嶽陽伯之樂舞株離。”注云：“株離，舞曲名。言象物生株離也。”彼雖中國之舞，四嶽所獻，非四夷之舞。要名與此東西反者，以物生與成，皆有離其根株之義，故兩有其言也。以為籥舞，謂吹籥而舞也。《簡兮》曰：“左手執籥，右手秉翟。”以翟，或謂之羽舞也。“若是為和而不僣差”，結上三舞之辭。○箋“雅萬”至“文樂”。○正義曰：以干鏚而言“萬”者，舉本用兵人眾之大數為舞以象之，故言萬舞也。萬即武舞，故云“周樂尚武，故謂萬舞為雅”，以對籥為文樂也。“言進退之旅”者，謂此三舞進退皆旅眾齊一。鄭意直據三種之舞進退齊一，不包上經琴、瑟，與毛意異。必異毛者，以不僣謂行列不有參差，故特謂為舞也。故《樂記》雲：“古樂之發，進旅退旅。”注云：“言其齊一。”是為不僣也。" }
      - { type: j, text: "《鼓鍾》四章，章五句。" }
      - { type: j, text: "《楚茨》，刺幽王也。政煩賦重，田萊多荒，饑饉降喪，民卒流亡，祭祀不饗，故君子思古焉。田萊多荒，茨棘不除也。饑饉，倉庾不盈也。降喪，神不與福助也。" }
      - { type: z, text: "“《楚茨》六章，章十二句”至“思古焉”。○正義曰：作《楚茨》詩者，刺幽王也。以幽王政教既煩，賦斂又重，下民供上，廢闕營農，故使田萊多荒，而民皆饑饉。天又降喪病之疫，民盡皆棄業，流散而逃亡。祭祀又不為神所歆饗，不與之福。故當時君子，思古之明王，而作此詩。意言古之明王，能政簡斂輕，田疇墾闢，年有豐穰，時無災厲，下民則安土樂業，祭祀則鬼神歆饗。以明今不然，故刺之。田廢生莫謂之萊，自然多荒，而並言之者，《周禮》以田易者為萊，若使時無苛政，則所廢年滿亦當墾之，今乃與不易之田並不藝種，故言多荒也。既言降喪，而又言流亡者，明死者為天災所殺，在者又棄業而逃也。降喪流亡，由祭祀不饗所致，而後言祭祀不饗者，欲明喪亡亦由饑饉，以見人神相將也。經六章，皆陳古之善，以反明今之惡，故箋每事屬之。言田萊多荒，茨棘不除，則首章上四句是也。饑饉，倉庾不盈，首章次四句是也。降喪，神不與福助，首章下四句，盡於卒章言古之享祀，神錫爾福，反明今之不饗，神不祐助也。政煩賦重，則於經無所當，而下篇有其事耳。此及《信南山》、《甫田》、《大田》四篇之詩，事皆陳古，文指相類，故序有詳略，以相發明。此序反經以言今，《信南山序》據今以本古，《甫田》直言思古，略而不陳所由，《大田》言“矜寡不能自存”，又略而不言思古，皆文互見。《大田》曰“曾孫是若”，言成王止力役以順民，是政不煩也。《甫田》雲“歲取十千”，言稅有常法，是賦不重，明幽王政煩賦重也。《信南山》經雲“信彼南山，維禹甸之。畇畇原隰，曾孫田之”，而序雲“不能修成王之業，以奉禹功”，是曾孫為成王矣。而《甫田》、《大田》皆言“曾孫”，則所陳古皆為成王時也。此經無曾孫之言，而周之盛王致太平者莫過成王，則此思古者，思成王也。此篇思古明王先成其民而後致力於神，故首章言民除草以種黍稷，收之而盈倉庾，王者得為酒食，獻之宗廟，總言祭祀之事，其享妥侑，皆主人身之所行也。二章言助祭者各供其職，爰及執爨有俯仰之容，君婦有清濁之德，俎豆肥美，獻酬得法，以事鬼神。鬼神安之，報以多福。四章言孝子恭敬無愆，屍嘏以福。五章祭事既畢，告尸利成。卒章言於祭之末，與同族燕飲。六章共述祭事，而其文皆次。唯三章“獻酬”、“笑語”，事在祭末，當處嘏辭“工祝致告”之下。文在先者，以獻酬是賓客之事，因說群臣助祭而言之耳。三章傳曰：“繹而賓屍及賓客。”或以為三章則別陳繹祭之事。知不然者，以此篇所陳，上下有次，首章言酒食，二章言牛羊，三章言俎豆燔炙，四章言神嗜飲食，共論一祭，首尾接連，不得輒有繹祭廁之也。案三章傳曰“燔，取脺膋也”。禮，燔燎報陽，乃是朝事之節，繹祭事屍而已，無求陽燔燎之事。若傳以三章為繹祭，安得以燔為膟膋也？三章傳又曰：“豆謂內羞、庶羞。”案《有司徹》“陳羞豆”之下注雲：“此皆朝事之豆籩，大夫無朝事而用之賓屍。”然則天子有朝事則此豆當朝事用之矣。作者何得舍正祭而不述，越言之繹祭之末禮乎？又繹祭主於事屍，而事神禮簡，三章言神保、報福，與二章正同，豈禮簡之謂？以此知三章所陳非繹祭矣。然則傳言繹而賓屍及賓客者，正以經言“孔庶”。其豆既眾，則所用必廣，故因分之以為賓，謂繹日敬屍為客，謂正祭所薦，見用豆處廣之意，其文不主繹也。箋易傳以庶為<月多>，自然無繹祭之事矣。" }
      - { type: j, text: "楚楚者茨，言抽其棘。自昔何為？我蓺黍稷。楚楚，茨棘貌。抽，除也。箋雲：茨，蒺藜也。伐除蒺藜與棘，自古之人，何乃勤苦為此事乎？我將得黍稷焉。言古者先生之政以農為本。茨言楚楚，棘言抽，互辭也。○抽，敕留反，徐直留反。蓺，魚世反。蒺音疾。藜音梨，一音梨。我黍與與，我稷翼翼。我倉既盈，我庾維億。露積曰庾。萬萬曰億。箋雲：黍與與，稷翼翼，蕃廡貌。陰陽和，風雨時，則萬物成。萬物成，則倉庾充滿矣。倉言盈，庾言億，亦互辭，喻多也。十萬曰億。○與音餘。注同。積如字，又子賜反。蕃音煩，廡音無，又音武。" }
      - { type: j, text: "以為酒食，以享以祀。以妥以侑，以介景福。妥，安坐也。侑，勸也。箋雲：享，獻。介，助。景，大也。以黍稷為酒食，獻之以祀先祖。既又迎屍，使處神坐而食之。為其嫌不飽，祝以主人之辭勸之，所以助孝子受大福也。○妥，湯果反。侑音又。坐，才臥反。為其，於偽反。" }
      - { type: z, text: "“楚楚”至“景福”。○毛以為，彼明王之時，有楚楚然者，茨棘也。我明王之時，民皆除去其茨棘焉。自古昔之人，何為乃勤苦為此事乎？言我蓺黍與稷也。既種而值陰陽和，風雨時，萬物蕃盛，我所種之黍與與然，我所種之稷翼翼然蕃茂盛大，皆得成就。及秋收而治之，我倉之內既得滿矣，我庾之大維積一億也。明王乃以黍稷為酒之與食，以獻祀其先祖也。謂鬱鬯之酒以灌，朝踐酌醴饋熟酌盎以獻，比至於屍酳以酢，諸臣皆為用酒也。當饋獻，又迎屍於室以拜安之，乃設食以進。為屍嫌不飽，祝以主人之辭侑勸之。由祭祀以禮，神所歆享，故以得大大之福也。今王不能然，故舉以刺之。○鄭唯以介為助。餘同。○傳“楚楚，茨棘貌。抽，除也”。○正義曰：經言“楚楚者茨”，並言棘者，以茨言楚楚，須抽之，棘言抽，明楚楚，故箋雲“互辭也”。○箋“茨蒺”至“互辭”。○正義曰：“茨，蒺藜”，《釋草》文也。郭璞曰：“布地蔓生，細葉，子有三角刺。”是也。其古者，先王之政，以農為本。《太宰》九職，“一曰三農，生九穀”。《洪範》八政，“一曰食”。是也。○傳“露積曰庾”。○正義曰：《甫田》言“曾孫之稼，如茨如梁”，此聚稼也。又曰“曾孫之庾，如坻如京”，是積粟也。下言“乃求千斯倉，乃求萬斯箱”，欲以萬箱載稼，千倉納庾，是庾未入倉矣，故曰“露積”，言露地積聚之。《九章算術》“平地委粟”是也。《周語》雲：“野有庾積。”韋昭引唐尚書雲：“十六鬥曰庾。”昭謂“此庾，露積穀也”，引《詩》雲“曾孫之庾，如坻如京”，是取此傳為說也。且言野有，則非倉之類，亦露積之驗也。○箋“黍與與”至“喻多”。○正義曰：與與、翼翼，黍稷之狀，故言蕃廡貌。《釋詁》雲：“廡、茂，豐也。”謂黍稷之苗蕃殖而茂盛也。既言露積為庾，則庾在於空，非有可滿之期。言“互辭”者，庾舉億為多，以至億為滿也。倉無一億者，假令一億十萬斛，依《九章算術》，古粟斛方一尺，長二尺七寸，是一億之積，方一尺，而長二十七萬尺也。立方開之，幾六十五尺，雖則高大之倉，未有能容此者。知其不相通也。明在地則一億，入倉則盈倉，宜以庾至於億，倉至於滿，為相互耳。箋言“喻多”，明非實然也。若然《豐年》曰“亦有高廩，萬億及秭”，廩亦倉之類，而得萬億及秭者，彼論天下之粟，非據一廩所容，故得及億秭也。○傳“妥，安坐也。侑，勸也”。○正義曰：“妥，安坐也”，《釋詁》文。又云：“侑，報也。”傳以為勸者已飲食而後勸之，亦是重報之義。○箋“享獻”至“大福”。○正義曰：酒是大名。其鬱鬯、五齊、三酒，總名皆為酒也。《月令》命大酋為酒雲“秫稻必齊”，則為酒非直黍也。又天子之祭，其祭當用黍稷稻粱，然則為酒食者，非獨黍稷而已。以黍稷為國之主，故舉黍稷以總眾穀。順上我黍稷之文，上言黍稷，乃是天下民田稅以充倉庾耳。以為酒食，文承其下，則以稅得之粟為酒食矣。案《祭義》“君親耕，以供粢盛”，則當用積田黍稷。而此文勢得用稅物者，親耕示其孝敬之心以勸民耳，非必祭祀所用皆所親為。《信南山》雲：“曾孫之穡，以為酒食，畀我屍賓。”是用稅物之明文也。言獻之祀先祖者，此總辭也。終祭皆是祀事，因獻之於神以成祭祀，故並言享祀以便句也。言先祖者，以經雲“先祖是皇”，故據而言也。下章雲“以往烝嘗”，則時祭也。時祭當自禰以上，而言“先祖”者，據遠可以兼近。言“既又迎屍，使處神坐”者，解妥侑之意。文承享祀之下，而享祀雖總於祭，因在其前，則為灌及朝踐矣。妥侑當饋食之節，故云“又迎屍，使處神坐而食。於時拜以安之，是妥也。為其嫌不飽，祝以主人之辭勸之，是侑也。“又”者，亞前灌獻之辭。初，屍入，祝延之入廟奧而行灌禮，至朝踐。《祭統》注云：“天子諸侯之祭，延屍於戶外。”《郊特牲》注云：“朝事，延屍於戶西南面。”注又云：“至薦熟，乃更延主於室之奧。屍來升席，自北方升坐於主北焉。”即《郊特牲》曰“舉斝角，詔妥屍”。注云“妥，安坐也。屍始入，舉奠斝若奠角將祭之，祝則詔主人拜安屍，使之坐。屍即至尊之坐。或時不自安，則以拜安之”。是又迎屍使處神坐也。言“嫌”者，以天子使公卿為屍，屍為天子所尊，已有為臣之嫌，故言“嫌不飽，祝以主人之辭勸之”。知祝者，以今少牢、特牲之禮，主人及屍之言，皆祝之所傳故也。案《鳧鷖》雲：“公屍來燕來寧。”注云：“屍來燕也，其心安，不以己實臣之，故自嫌。”則屍意安而不嫌。雲嫌者，此據正祭，彼論繹祭，故屍安也。" }
      - { type: j, text: "濟濟蹌蹌，絜爾牛羊，以往烝嘗。或剝或亨，或肆或將。濟濟蹌蹌，言有容也。亨，飪之也。肆，陳。將，齊也。或陳於與，或齊其肉。箋雲：有容，言威儀敬慎也。冬祭曰烝，秋祭曰嘗。祭祀之禮，各有其事。有解剝其皮者，有煮熟之者，有肆其骨體於俎者，或奉持而進之者。○濟，子禮反，大夫之容也。蹌，七羊反，士之容也。亨，普庚反。注同。肆音四。飪，本又作“腍”，而甚反。齊，才細反。下“或齊”同。解剝，上佳買反，下邦角反。有肆，他歷反，解肆也。奉，芳勇反，又如字。祝祭於祊，祀事孔明。祊，門內也。箋雲：孔，甚也。明，猶備也，絜也。孝子不知神之所在，故使祝博求之平生門內之旁，待賓客之處，祀禮於是甚明。○祊，補彭反，《說文》作“{彭示}”，雲：“門內祭先祖，所彷徨也。”處，昌慮反。先祖是皇，神保是饗。皇，大。保，安也。箋雲：皇，暀也。先祖以孝子祀禮甚明之故，精氣歸暀之，其鬼神又安而享其祭祀。○暀，於況反。下篇同。" }
      - { type: j, text: "孝孫有慶，報以介福，萬壽無疆！箋雲：慶，賜也。疆，竟界也。○竟音境。" }
      - { type: z, text: "“濟濟”至“無疆”。○毛以為，古之明王，其助祭之臣大夫士，其義濟濟然、蹌蹌然，甚皆敬慎。乃鮮絜爾王者所祀之牛羊，以往為冬烝、秋嘗之祭也。於周禮祭祀之聯事，司徒奉牛，司馬奉羊，六牲各有司也。既絜此牲，其理治之，亦各有職，或解剝之者，或亨煮之者，或陳其肉於牙之上者，或分齊其肉所當用者。於是之時，祝則博求先祖之神，祭於門內之祊，既，群臣恪勤，各司其職，祭祀之事於是甚絜明矣。以此知先祖之精靈，於是美大之，其神安而，於是歆饗之。既為所饗，故令孝孫有慶賜之事，報之以大夫之福，使孝孫得萬年之壽，無有疆境也。由臣助得禮，令王受介福。今幽王之時，非徒王不敬神，臣又廢職，故神所不歆，降之喪禍，故刺焉。○鄭唯“或肆或將”、及“是皇”為異。既或亨而煮之，匕載而出。或有肆其骨體於俎者，或有奉持而進之者。為事之次，又先祖之神，以孝子祀事孔明，故於是精氣歸暀之。餘同。○傳“濟濟”至“其肉”。○正義曰：《曲禮下》曰：“大夫濟濟，士蹌蹌，是有容也。”祭祀之禮，主人自愨而趨，其賓客則有容儀，故濟濟蹌蹌也。亨謂煮之使熟，故云“亨，飪之也”。《行葦》雲“肆筵設席”，肆是設之言，故為陳也。“將，齊”，《釋言》文。郭樸曰：“謂分齊也。”《地官·牛人》雲：“凡祭祀，共其牛牲之互。”注云：“互若今屠家縣肉架。”則肆謂既殺乃陳之於互上也。“齊其肉”者，王肅雲：“分齊其肉所當用。”則是既陳於牙，就牙上而齊之也。或肆或將，其事俱在或亨之前。以二者事類相將，故進或亨於上，以配或剝耳。○箋“冬祭”至“進之者”。○正義曰：據四時則嘗先於烝，經先烝後嘗，便文耳。不言祠礿者，王肅雲：“舉盛言也。”然則以此二禮備於春夏，故特言之耳。祭祀各有其事者，解其每事言，或由名有所司故也。《禮運》曰：“腥其俎，熟其殽。”注云：“腥謂豚解而腥之，熟謂體解而爓之。”豚解腥之，是解剝其肉也。定本、《集註》皆雲“解剝其皮”。體解爓之，是煮熟之者。《禮運》又曰：“然後退而合亨體其犬豕牛羊。”注云：“謂分別骨體之貴賤，以為眾俎也。”是肆其骨體於俎也。《特牲》、《少牢》之禮每雲“佐食奉俎肉”，是奉持而進之。定本“持”作“將”。此說天子之祭，群臣各有所司。於《周禮》則《內饔》雲：“凡宗廟之祭祀，掌割亨之事。”則解剝其肉，是內饔也。《亨人》雲：“掌供鼎鑊，以給水火之齊，職外、內饔之爨亨煮。”則煮熟之者，是亨人也。《外饔》：“掌外祭祀之割亨，供其脯脩，刑撫，陳其鼎俎實之牲體。”則肆其骨體於俎，是外饔也。《大司徒》雲：“祀五帝，奉牛牲，羞其肆。亨先王亦如之。”注云：“肆進所解骨體。”又《小子職》雲：“掌祭祀，羞羊肆羊殽肉豆。”則奉持進之，是司徒、小子之類也。然群臣助祭，各有所掌，故稱奔走在廟，奉持進之，非獨此二職而已。易傳者，以祭雖有互，不施於既亨之後，非文次也。孫毓雲：“此章祭時之事，始於絜牛羊，成於神保享，各以次第也。既解剝，則當亨煮之於鑊。既煮熟，當陳其骨體於俎，然後奉持而進之為屍羞。不待既亨熟，乃分齊所當用也。箋義為長。”○傳“祊，門內”。○正義曰：《釋宮》雲：“閍，謂之門。”李巡曰：“閍，廟門名。”孫炎曰：“《詩》雲‘祝祭於祊’，祊謂廟門也。彼直言門，知門內者，以正祭之禮，不宜出廟門也。”而《郊特牲》雲：“直祭祝於主。”注云：“直，正也。謂薦熟時也。祭以熟為正。”又曰：“索祭祝於祊。”注云：“廟門外曰祊。”又注：“祊之禮，宜於廟門外之西室。”與此不同者，以彼祊對正祭，是明日之名。又彼《記》文稱祊之於東方為失明，在西方與繹俱在門外，故《禮器》曰：“為祊於外。”《祭統》曰：“而出於祊”，對設祭於堂為正，是以明日之繹故皆在門外，與此不同。以廟門謂之祊，知內外皆有祊稱也。○箋“明猶”至“甚明”。○正義曰：以此“祀事孔明”之言，總“濟濟蹌蹌”以下，故言“明，猶備也，絜也。”博求其神是備也。絜爾牛羊是絜也。所以於此而祝祭於祊者，以孝子不知神之所在，故使祝博求之平生門內之傍，待賓客之處也。每處求之，是“祀禮於是甚明”也。明此祊廟門之名，其內得有待賓客之處者，《聘禮》、《公食大夫》皆行事於廟，其待之迎於大門之內，則天子之禮焉。其迎諸侯之臣，或於廟門內也。繹祭之祊在廟門外之西，此正祭之祊或在廟門內之西，天子迎賓在門東，此祭當在門西，大率系之門內，為待賓客之處耳。○箋“皇暀”至“祭祀”。○正義曰：《信南山》箋雲：“皇之言暀也。”《泮水》箋雲：“皇當作暀，猶往也。”不同者，注意趨在義通，不為例也。先祖與神，一也。本其生存謂之祖，言其精氣謂之神。作者因“是皇”、“是享”異事變其文耳。箋易傳以皇為暀者，以論祭事宜為歸暀。孫毓雲：《孝經》稱：“宗廟致敬，鬼神著矣。”《禮》曰：“聖人為能享帝，孝子為能享親。”故此章雲“神保是享”，下章稱“神保是格”，皆取之往安來為義。箋說為長。" }
      - { type: j, text: "執爨，為俎孔碩，或燔或炙。爨，饔爨、廩爨也。，言爨灶有容也。燔，取膟膋。炙，炙肉也。箋雲：燔，燔肉也。炙，肝炙也。皆從獻之俎也。其為之於爨，必取肉也、肝也肥碩美者。○爨，七亂反。注唯“言爨灶”一字七端反，餘並同。，七夕反，又七略反。燔音煩。廩，力甚反。膟音律。膋音寮，脂膏。肝炙，之赦反。君婦莫莫，為豆孔庶，為賓為客。莫莫，言清靜而敬至也。豆，謂肉羞、庶羞也。繹而賓屍及賓客。箋雲：君婦，謂後也。凡適妻稱君婦，事舅姑之稱也。庶，<月多>也。祭祀之禮，後夫人主共籩豆，必取肉物肥<月多>美者也。○莫音麥。內羞如字。內羞，房中之羞，或作“肉羞”，非也。適音的。稱，尺證反。<月多>，字又作“侈”，昌紙反，何、沈都可反。共，亦作“供”，音恭。獻醻交錯，禮儀卒度，笑語卒獲。東西為交，邪行為錯。度，法度也。獲，得時也。箋雲：始主人酌賓為獻。賓既酌主人，主人又自飲酌賓曰醻。至旅而爵交錯以徧。卒，盡也，古者於旅也語。○醻，巿由反，又作“酬”。度如字，沈徒洛反。邪，似嗟反。徧音遍。下同。" }
      - { type: j, text: "神保是格，報以介福，萬壽攸酢！格，來。酢，報也。" }
      - { type: z, text: "“執爨”至“攸酢”。○毛以為，當古明王祭祀之時，其當執爨灶之人，皆然敬慎於事，而有容儀矣。其為俎之牲體甚博大，言肥腯而得禮也。或燔燒膟膋以報陽者，或炕炙其肉以薦獻者。君婦之後，又復莫莫然清淨而敬慎，以至其為薦豆甚眾多，非直以之薦神，又為釋而賓敬其屍，及令為賓客所用，是其眾多也。既有此豆以薦賓客，故令賓客於祭口飲酒行獻酬之禮，旅而交錯，以至於徧也。其賓客禮儀盡依法度，其為笑語盡得其時，是得萬國之歡心，恭敬事其先王，故神安而，於是來歸之，報以大大之福，以萬年之壽，所用報孝子也。今王君臣不能然，故舉以刺也。○鄭以為，“俎孔碩”謂為從獻之俎，必取肉及肝甚肥大而美者。或加火燔燒之，謂燔肉也。或炕火貫炙之，謂炙肝也。以從於獻酒之用也。“為豆孔庶”，謂於先為豆實之時，必取肉物肥<月多>美者。既以朝獻，為賓客以為薦，故賓客用而獻酬。餘同。○傳“爨饔”至“炙肉”。○正義曰：以祭祀之禮，饔爨以煮肉，廩爨以炊米。此言臣各有司，故兼二爨也。《少牢》雲：“雍人摡鼎匕俎於雍爨，雍爨在門東南北上。廩人摡甑獻匕與敦於廩爨，廩爨在雍爨之北。”故知有二焉。爨灶有容者，謂執爨之有容儀也。燔取膟膋，王肅雲：“取膟膋燔燎報陽也。”案《祭義》曰：“君牽牲既入廟門，麗於碑。卿大夫執鸞刀以刲之，取膟膋。”注云：“膟膋，血與腸間脂也。”《郊特牲》曰：“取膟膋燔燎升首，報陽也。”《禮器》曰：“君親制祭。”注云：“親制祭，謂朝事進血膋時也。”如是，則當朝事之時，取牲膟膋燎於爐炭，是燔膟膋也。既以燔為膟膋，故以炙為炙肉焉。傳以炙為炙肉，則是薦俎非從獻也。從獻之俎，炙用肝。○箋“燔燔肉”至“美者”。○正義曰：鄭以上“或肆”為陳其骨體於俎，則此非屍賓常俎，故為從獻之俎。既以為從獻之俎，明燔炙是從獻之物，故為燔肉、炙肝也。言從獻者，既獻酒，即以此燔肉從之，而置之在俎也。於此言之者，以其為之於爨，故就爨文言之。以其俎之常者，隨體所值，此特言孔碩，故云“必取肉也、肝也。肥而碩美者”也。知燔肉炙肝者，《特牲》：“主人獻屍，賓長以肝從；主婦獻屍，兄弟以燔從。”彼燔與此燔同，則彼肝與此炙同，故云“炙，肝炙也”。炙既用肝，明燔用肉矣。故《行葦》箋亦云“燔用肉，炙用肝”也。《特牲》先言肝，此後言炙者，便文耳。《夏官·量人》雲：“凡祭祀，制其從獻脯燔之數量。”是從獻之文也。然燔者，火燒之名；炙者，遠火之稱。以難熟者近火，易熟者遠之，故肝炙而肉燔也。《生民》傳曰：“傳火曰燔。”《瓠葉》傳曰：“加火曰燔。”對遙炙者為近火，故云“傅火”、“加之”。留其實亦炙，非炮燒之也。故《量人》注云：“燔從於獻酒之肉炙。”《特牲》雲：“燔，炙肉。”是燔亦炙也。且燔亦炙，為臠而貫之，以炙於火，如今炙肉矣，故《量人》制其數量。注云：“數多少，量長短。”若非臠而炙之，何有多少長短之數量乎？故知燔亦臠而貫炙之。易傳者，以燔燎報陽，祭初之事，君親為之。此文承“為俎”之下，言執爨有容，則序助祭之人，非君親之也。且膟膋燎之於爐，此燔炙為之於爨，禮有燔肉、炙肝從獻所用，以此知非報陽燎薦之事，故易之也。此“為豆孔庶”，若正祭則先薦豆然後獻，繹祭則先獻後薦。知者，《少牢》正祭雲：“主婦薦韭菹醓醢”，主人乃獻屍。案《有司徹》大夫賓屍禮雲“主人獻屍”，乃始雲“主婦薦韭菹”。是以鄭注《祭義》雲：“君獻屍，夫人薦豆，謂繹日也”。○傳“莫莫”至“賓客”。○正義曰：毛以孔庶為甚眾，故云“莫莫，清靜而敬至”。由後能清靜恭敬又至篤，故能為豆甚多。若簡躁不恭，則不能也。此豆實則菹醢也。《周禮·醢人》注云：“凡醢者，必先膊乾其肉乃莝之，雜以粱麴及鹽漬，以美酒塗置瓶中，百日則成矣。”然則為豆先祭而豫作。此本而言之，非當祭時也。豆內羞、庶羞者，以言“孔庶”則非一，故為兼二羞也。《有司徹》雲：“宰夫羞房中之羞於屍侑，主人主婦皆右之。司士羞庶羞於屍侑，主人主婦皆左之。”注云：“二羞所以盡歡心。房中之羞，其籩則糗餌粉餈，其豆則酏食糝食。庶羞，羊臐豕膮皆有胾醢。房中之羞，內羞也。內羞在右，陰也。庶羞在左，陽也。”是有二羞之事也。彼大夫賓屍尚有二羞，明天子之正祭有二羞矣。天子庶羞百有二十品，明內羞亦多矣。毛又以豆言甚眾為過常之辭，而云為賓為客，則所為有二事也。然則非但正祭所用，至繹又用之，故云“繹而賓屍及賓客也”。言於繹祭可以此賓敬於屍而薦之，解“為賓”也。又今正祭賓用之為薦，是為客也。繹雖在後，而屍尊於賓客，故先言為賓也。○箋“君婦”至“<月多>美”。○正義曰：凡適妻稱君婦，故妾稱之為女君也。婦有舅姑之稱，《公羊》、《穀梁傳》文也。“庶，<月多>也”，《釋言》文。舍人曰：“庶，眾也。<月多>，炙也。”孫炎曰：“庶，豐也，多雲<月多>。”然則豐<月多>亦肥多之義。《爾雅》既有此釋，且以“為俎孔碩”類之，宜為肉甚肥<月多>，故易傳也。《天官·九嬪職》曰：“贊後薦徹豆籩。”是後、夫人主供籩豆。此論天子之事，言後足矣。兼雲夫人者，以諸侯夫人於其國與王后同，故連言之。由後主供籩豆，故為豆實，必命有司，令取肉物肥<月多>美者。言物者，籩豆有非肉者也。若棗栗及菹與糗粉之屬不用肉，故言肉物也。後、夫人所主籩豆，唯有朝事饋食之籩豆後薦之耳。於《周禮》，加籩則內宗薦之，內羞、庶羞則世婦薦之。而此言君婦為豆、為賓、為客者，以後、夫人總主之故也。○箋“始主人”至“旅也語”。○正義曰：此《特牲》、《少牢》鹹有其事。獻酬據其初，故依彼節而言也。交錯言其末，故云“至於旅而爵交錯以徧也”。“古者於旅也語”，《鄉射記》文，引之者，證笑語得時。" }
      - { type: j, text: "我孔矣，式禮莫愆。工祝致告：“徂賚孝孫，，敬也。善其事曰工。賚，予也。箋雲：我，我孝孫也。式，法。莫，無。愆，過。徂，往也。孝孫甚敬矣，於禮法無過者。祝以此故致神意造主人使受嘏。既而以嘏之物往予主人。○，而善反，又呼但反。賚如字，徐音來。嘏，古嘏反。苾芬孝祀，神嗜飲食。卜爾百福，如幾如式。幾，期。式，法也。箋雲：卜，予也。苾苾芬芬有馨香矣，女之以孝敬享祀也，神乃歆嗜女之飲食。今予女之百福，其來如有期矣，多少如有法矣。此皆嘏辭之意。○苾，蒲蔑反，一音蒲必反。下篇同。芬，孚雲反。嗜，巿志反，徐雲：“又巨之反。”下章同。幾音機。予，羊汝反。下同。歆，喜今反。女音汝。下同。" }
      - { type: j, text: "既齊既稷，既匡既敕。永錫爾極，時萬時億。”稷，疾。敕，固也。箋雲：齊，減取也。稷之言即也。永，長。極，中也。嘏之禮，祝遍取黍稷牢肉魚擩於醢以授屍，孝孫前就屍受之。天子使宰夫受之以筐，祝則釋嘏辭以敕之。又曰：長賜女以中和之福，是萬是億。言多無數。○齊，王申毛如字，整齊也。鄭音資，一音才細反，謂分之齊也。筐，本亦作“匡”，丘方反。擩，而專反，又音芮，又而純反，何耳誰反。醢音海。" }
      - { type: z, text: "“我孔”至“時億”。○毛以為，上三章既言孝子助祭之人皆得其禮，為神饗報，故此承而結之。言我孝子甚能恭敬矣，其於祭祀之法，與禮儀無過差者。孝子既能如此，工善之祝以此之故，於是致神之意以告主人，令之受嘏。既而因以所嘏之物，往與主人孝孫也。神本所以與孝孫嘏福者，能苾苾芬芬有馨香，乃汝以孝敬享祀，故鬼神忻說，乃歆嗜汝之飲食。今所以與汝百種之福，其來早晚，如有期節矣。其福多少，如有法度矣。我孝子既能整齊矣，既能極疾矣，既能誠正矣，既能慎固矣，於祀之禮無所失，是知神永賜汝中和之福，於是得萬，於是得億。言多無數。此即報以介福之事也。今王不能然，故以刺之。鄭唯“既齊既稷，既筐既敕”二句為異。以徂賚孝孫，言以嘏之物往予主人也。次四句乃本所以嘏之意。“既齊”以下，陳為嘏之禮。祭有黍稷牢肉魚，祝就中齊減取其物以擩於醢以受屍矣。孝子既就屍而受之矣。既得，乃使宰夫受之以筐矣。既得，屍令祝釋嘏辭以敕之。“永錫爾極”，即嘏辭之略也。○傳“敬”至“賚予”。○正義曰：“，敬”，《釋詁》文。以工者巧於所能，《論語》曰“工欲善其事”，故云“善其事曰工”。“賚，予也”，《釋詁》文。○箋“我我孝”至“主人”。○正義曰：以上章說臣事既然，此總結之，故知“我，我孝孫也”。《特牲》、《少牢》薦獻禮終，屍皆命祝以嘏於主人，故知“工祝致告”是致神意告主人使受嘏也。告之下即雲“徂賚孝孫”，故知以嘏之物往與主人。其嘏之物，即下箋雲“黍稷牢肉”是也。此及下章再言“工祝致告”，箋以此章祝以神意告主人使受嘏，下章祝以主人之意告屍以利成。知者，此致告之下即雲“徂賚孝孫”，以物予主人，明是告之使受嘏也。下章乃雲“工祝致告”訖，即雲“皇屍載起”，明致孝子之意以告屍也。又《特牲》、《少牢》皆受嘏在前，告利成在後，以此知之，二者皆祝傳其辭，故並稱工祝致告。○箋“苾苾”至“之意”。○正義曰：以其馨香，宜重言，故云“苾苾芬芬有馨香矣”。汝以孝敬祭祀，曰孝子能盡其誠信，致其孝敬，故馨香也。由飲食馨香，故神歆嗜之，而予之百福，其來如有期矣。言須而即來，不遲晚也。多少如有法矣，謂來必豐足，不乏少也。嘏辭予主人以福，此說得福之事，故云皆嘏辭之意。言嘏辭之意耳，此非嘏辭。○傳“稷，疾。敕，固也”。○正義曰：王肅雲：“執事已整齊，已極疾，已誠正，已固慎也。”傳意或然。○箋“齊減取”至“敕之”。○正義曰：齊與資，古今字異。資訓取，齊為減取，非訓齊為減取也。以上言嘏之意，此言嘏之事，參之以《特牲》、《少牢》而事有似，故說為嘏之禮也。其不同者，天子與大夫尊卑既殊，故禮數有異耳。《少牢禮》曰：“二佐食各取黍於一敦。上佐食兼受摶之以授屍。屍執以命祝，率命祝。祝受以東北面於戶西，以嘏於主人曰。”既稱嘏辭，“主人坐奠爵，興受黍，坐振祭齊之，詩懷之，實於左袂，掛於季指。執爵以興，出。宰夫以籩受嗇黍。主人嘗之，納諸內”。是大夫受嘏之禮也。《特牲禮》曰：“佐食摶黍授祝，祝授屍，屍受以菹豆，執以親嘏主人。主人左執角，再拜稽首，受。復位，詩懷之，實於左袂，掛於季指，卒角拜。屍答拜。主人出寫嗇於房，祝以籩受。”是士受嘏之禮。二禮皆取黍而已。《特牲》注云：“獨用黍者，食之主也。”又云：“變黍直言嗇者，因事託戒，欲其重稼嗇。”此言遍取黍稷牢肉魚者，以齊者是減取諸物，故知遍減取也。知祝取之者，嘏禮祝所主，又《特牲》言“佐食博黍授祝，祝授屍”，准此故為祝也。知擩於醢者，以醢亦宜在遍取之中，而《少牢禮》雲“屍取韭菹辯擩於三豆”，有擩醢之事。此既遍取以嘏天子，天子當嘗之，故知擩於醢以授屍也。既以授屍，故孝子前就凡受之。《特牲》“屍親嘏”，《少牢》“命祝嘏”，此言既，即是孝子自就取，則亦屍親嘏，不嫌與士同也。言天子使宰夫受之以筐者，以《少牢》宰夫受之，故知此亦宰夫。《特牲》、《少牢》皆受以籩，此經雲“既筐”，故知受之以筐也。以《少牢》“主人受之出，以授宰夫”，此初即宰夫受之，不至於出，故言“天子使宰夫”，以為別異之文也。定本、《集註》“天子宰受之”，無“使夫”兩字。“祝則釋嘏辭以敕之”，《少牢》嘏辭雲：“皇屍命工祝，承致多福無疆。於汝孝孫，來汝孝孫，使汝受祿於天，宜稼于田，眉壽萬年，勿替以之。”是亦大夫之嘏辭也。天子嘏辭，無以言之。此“永錫爾極，時萬時億”，是其辭之略。以《少牢》嘏辭準之，知天子嘏辭必多於是。彼先設嘏辭，乃嘏以黍；此先以嘏予之，乃釋辭者，亦天子之禮，大節文之數，與大夫異也。易傳者，以“徂賚孝孫”是嘏之事也，“永錫爾極”是嘏之辭也，則此章唯說受嘏之禮耳，不得有執事於其間。若不指執事，則極疾固慎文無所主，故易之以為受嘏之禮。" }
      - { type: j, text: "禮儀既備，鍾鼓既戒。孝孫徂位，工祝致告。致告，告利成也。箋雲：鍾鼓既戒，戒諸在廟中者，以祭禮畢，孝孫往位堂下西面位也，祝於是致孝孫之意，告屍以利成。○“祭禮畢”，“禮”或作“祀”。神具醉止，皇屍載起。鼓鍾送屍，神保聿歸。皇，大也。箋雲：具，皆也。皇，君也。載之言則也。屍，節神者也。神醉而屍謖，送屍而神歸。屍出入奏《肆夏》。屍稱君，尊之也。神安歸者，歸於天也。○謖，所六反，起也。夏，戶雅反。諸宰君婦，廢徹不遲。箋雲：廢，去也。屍出而可徹，諸宰徹去諸饌，君婦籩豆而已。不遲，以疾為敬也。○廢，方吠反。徹，直列反。去，起呂反。下同。" }
      - { type: j, text: "諸父兄弟，備言燕私。燕而盡其私恩。箋雲：祭祀畢，歸賓客之俎，同姓則留與之。燕所以尊賓客，親骨肉也。" }
      - { type: z, text: "“禮儀”至“燕私”。○正義曰：此受嘏之後，言祭畢之事，故云祭祀之禮儀既畢備矣，鍾鼓之音聲既告戒矣。謂擊鍾鼓以告戒廟中之人，言祭畢也。主人孝孫於此之時，則往於堂下西面之位。工善之祝，則從西堂下，致孝孫之意，告屍言利養之成也，於時神皆醉飽矣。故皇屍則起而出也。屍以節神，屍畢而神醉，故神醉而屍起也。乃鳴鍾鼓以送屍，謂奏《肆夏》也。神安而遂歸於天也。屍已出矣，而諸宰及君婦肅敬於事，其徹去俎豆皆不遲矣。於是之時，賓客歸之俎，其諸父兄弟留之，使皆備具，我當與之燕而盡其私恩也。今王不能然，故舉以刺之。○箋“鍾鼓”至“利成”。○正義曰：以禮儀既畢，而擊鍾鼓以戒知。戒諸在廟中者，告以祭禮畢也。祭禮畢，即禮儀既備是也。孝孫往位堂下西面位，知者，以言往而自此適彼之辭，而《特牲》告利成之位，雲“主人出立於戶外西面”，《少牢》告利成之位，雲“主人出立於阼階上西面”，是尊者出稍遠也。此雲“徂位”，明遠於大夫，故知至堂下也。《特牲》、《少牢》皆西面，故知天子之位亦西面也。既言“徂位”，即雲“致告”，故云於是致孝子之意，告屍以利成也。《少牢》“主人立於阼階，祝立於西階上，告利成。”此孝孫在堂下西面，則祝當以西階下告利成也。若然，《特牲》告利成，即雲“屍謖祝前，主人降”，《少牢》祝告利成，即雲“祝入屍謖，主人降”，此二者皆祝告主人以利成，是致屍意也。此言致孝子之意告屍者，以孝子之事屍，有尊親及賓客之義，命當由尊者出，讓當從賓客來。禮畢，義由於屍，非主人所當先發，故知彼二禮皆言祝告主人以利成也，則天子彌尊，備儀盡飾，蓋有節文。準彼二禮祝告主人，則此以祝先致屍意告主人，乃更致主人之意以告屍，故云“告屍以利成”也。此雲“皇屍載起”，即彼“屍謖”也，但此舉主人之報告，則得屍告而可知矣。必知然者，以彼大夫與士尊卑而俱告主人，明亦有告主人矣。其告主人則同，主人報告則有差。彼士禮告主人利成，屍即謖，大夫則祝入乃屍謖，明天子則祝人又報以利成，然後屍乃起。準彼為差，故知然也。言利成者，《少牢》注云：“利，猶養也。成，畢也。孝子之養禮畢。”○傳“皇，大也”。○正義曰：箋依《釋詁》，以皇為君稱，君尊之。《少牢》亦云“皇屍命工祝”，傳皇為大，言尊大之，屍亦君義。○箋“具皆”至“於天”。○正義曰：言皆醉者，所祭群廟非止一神故也。又解神屍相將之意，故云“屍，節神者也”。《郊特牲》雲：“屍，神象也。”此詩所陳，言神醉而屍謖，送屍而神歸，是屍與神為節度也。神無形，故屍象焉。《特牲》、《少牢》注皆依《釋言》，雲“謖，起也”。又解以鼓鍾送屍，由屍出入奏《肆夏》故也。屍出入奏《肆夏》，《春官·大司樂職》文也。《祭義》雲：“樂以迎來，哀以送往。”此鼓鍾送屍者，以哀其享否不可知，自孝子之心耳，其送屍猶自作樂也。神者，魂魄之氣。《郊特牲》雲：“魂氣歸於天。”故言神安歸於天也。○箋“屍出”至“為敬”。○正義曰：案《特牲》、《少牢禮》屍出之後乃饗，乃陽厭，尋亦徹之，故此係於屍起也。而諸宰徹去諸饌，君婦籩豆而已者，以《周禮·九嬪》雲“凡祭祀，贊後薦徹豆籩”，知君婦籩豆而已，餘饌諸宰徹之也。《周禮·宰夫》無徹饌之文。《膳夫》雲：“凡王祭祀，賓客則徹王之胙俎。”注云：“膳夫親徹胙俎，胙俎最尊也。其餘則其屬徹之。”然則徹饌者，膳夫也。言諸宰者，以膳夫是宰之屬官，宰、膳皆食官之名，故系之宰。言諸者，《序官》“膳夫上士二人，中士四人，下士八人”，故言諸也。祭末嫌其惰慢，故言以疾為敬。○箋“祭祀”至“骨肉”。○正義曰：《祭統》曰：“貴者取貴骨，賤者取賤骨。”《論語》曰：“祭於公，不宿肉。”《特牲》、《少牢》皆曰“祝執其俎以出”。是祭祀畢，賓客歸之俎也；其同姓則皆留之與燕，而盡其私恩也。《特牲》雲：“祝命徹胙俎豆籩，設於東序下。”注云：“胙俎，主人之俎。設於東序下，亦將私燕也。”是祭末而燕私之事。歸之俎，所以尊賓客。留之燕，所以親骨肉也。《大宗伯》雲：“以脤膰之禮，親兄弟之國。”注云：“脤膰，社稷宗廟之肉，以賜同姓之國，同福祿也。”《春秋》定十四年：“天王使石尚來歸脤。”同姓得肉者。彼謂不助祭者不得與燕，故歸之也。" }
      - { type: j, text: "樂具入奏，以綏後祿。爾殽既將，莫怨具慶。綏，安也。安然後受福祿也。將，行也。箋雲：燕而祭時之樂復皆入奏，以安後日之福祿。骨肉歡而君之福祿安。女之殽羞已行，同姓之臣無有怨者，而皆慶君，是其歡也。○復，扶又反。既醉既飽，小大稽首。“神嗜飲食，使君壽考。箋雲：小大，猶長幼也。同姓之臣，燕已醉飽，皆再拜稽首曰：神乃歆嗜君之飲食，使君壽旦考。此其慶辭。○長，張丈反。" }
      - { type: j, text: "孔惠孔時，維其盡之。子子孫孫，勿替引之。”替，廢。引，長也。箋雲：惠，順也。甚順於禮，甚得其時，維君德能盡之，願子孫勿廢而長行之。○替，天帝反。" }
      - { type: z, text: "“樂具”至“引之”。○正義曰：以上章雲“備言燕私”，故此即陳燕私之事。以祭時在廟，燕當在寢，故言祭時之樂皆復來入於寢而奏之，以安其從今以後之福祿。言骨肉歡樂，然後君之福祿安也。其燕之時，非直以鼓鍾樂之，又爾之殽羞既行之，長幼皆遍，故同姓之臣莫有嗟怨，而皆慶君，是其骨肉歡矣。於是之時，既醉於酒矣，既飽於食矣，其同姓小大長幼皆再拜稽首，而共慶君曰：由君明德馨香，神乃嗜君飲食，使君得壽考之福也。祭甚順於禮，甚得其時，唯君德其能盡此順時之美，願君之子孫世世勿廢而長行之。欲使長行此禮，常得福祿，此即所謂具慶也。今王不能然，故舉以刺之。○箋“燕而”至“其歡”。○正義曰：案前文而言入奏，故知祭之樂復皆入也。燕、祭不得同樂，而云皆入者，歌詠雖異，樂器則同，故皆入也。後日，從今以後之日也。宗族不親，則公室傾危，故骨肉歡而君之福祿安。同姓無怨而皆慶，是其歡矣。神嗜飲食以下，是慶辭也。○傳“替，廢。引，長”。○正義曰：“替，廢”，《釋言》文。“引，長”，《釋詁》文。《釋訓》雲：“子子孫孫，引無極也。”舍人曰：“子孫長行美道，引無極也。”郭璞曰：“世世昌盛，長無窮，是勿廢長行之。”" }
      - { type: j, text: "《楚茨》六章，章十二句。" }
      - { type: j, text: "《信南山》，刺幽王也。不能修成王之業，疆理天下，以奉禹功，故君子思古焉。" }
      - { type: z, text: "“《信南山》六章，章六句”至“思古焉”。○正義曰：作《信南山》詩者，刺幽王也。刺其不能修成王之事業，疆界分理天下之田畝，使之勤稼，以奉行大禹之功，故其時君子思古成王焉，所以刺之。經六章，皆陳古而反以刺今。言成王能疆理天下，以奉禹功，而幽王不能修之。經先雲禹功，乃言曾孫，見成王能遠奉禹功。今幽王不能述修成王之業，非責幽王令奉禹功也，故箋雲：“言成王乃遠修禹之功，今王反不修其業乎？”是思古之內，直思成王耳，而成王又有所奉，故經言禹焉。首章言“我疆我理”，是疆理天下也。“維禹甸之”，是禹功也。以下言云雨生穀，乃稅以祭祀，鬼神降福，皆由疆理使然，故序者略之也。" }
      - { type: j, text: "信彼南山，維禹甸之。畇畇原隰，曾孫田之。甸，治也。畇畇，墾闢貌。曾孫，成王也。箋雲：信乎彼南山之野，禹治而丘甸之。今原隰墾闢，則又成王之所佃。言成王乃遠修禹之功，今王反不脩其業乎？六十四井為甸，甸方八里，居一成之中，成方十里，出兵車一乘，以為賦法。○甸，毛田見反，鄭繩證反。畇音勻，又作“<田旬>”，蘇遵反，又音旬。墾闢，上苦很反，下婢亦反。佃音田，本亦作田。乘，繩證反。我疆我理，疆，畫經界也。理，分地理也。" }
      - { type: j, text: "南東其畝。或南或東。" }
      - { type: z, text: "“信彼”至“其畝”。○毛以為，信乎彼南山之傍，田野得成平田可種殖者，維本禹所治之。又此地今畇畇然成其墾闢之原隰者，由曾孫成王所田之。又正我天下經界之疆，又分我天下土宜之理，而隨事之便，使南東其畝。成王能疆理天下，奉禹之功，而幽王不能修之，故以刺焉。○鄭唯甸之為丘甸之為異。餘同。○傳“甸治”至“成王”。○正義曰：此及《韓奕》之傳皆言“甸，治”，則訓甸為治，不為丘甸之異於鄭也。“墾闢貌”者，謂墾耕其地，闢除草萊，以成柔田也。《釋訓》雲：“畇畇，田也。”注引此“畇畇原隰”，與勻音同也。知曾孫是成王者，序言成王奉禹之功，此言曾孫田禹之地，故知曾孫與序成王，一人也。成王而謂之曾孫者，以古者祖有德而宗有功，因為之號。文、武為受命伐紂，定天下之基，以為祖宗。《祭法》雲：“祖文王而宗武王。”是也。成王繼文、武之後，為太平之主，特異其號，故《詩經》通稱成王為曾孫也。不繼於文王，不直言孫者，蓋周雖文王受命，而大王亦有王跡，所起見其王業之遠，故繼而稱曾孫。不言玄孫者，玄孫對高祖為定名，世數更多，則不得稱玄孫矣。曾者，重也，自曾祖以至無窮，皆得稱曾孫，故《維天之命》箋雲：“自孫之子而下，事先祖皆稱曾孫。”是為遠辭。明周德之隆久，故繼大王而不稱玄也。毛以此及《維天之命言》曾“孫篤之亦”，為成王。鄭以禮非一人所行，唯彼不從之耳。○箋“信乎”至“賦法”。○正義曰：言信乎者，文通於下。言禹治南山，成王田之，皆信然矣。上雲“南山”，下雲“原隰”，皆南山之傍，見禹之所甸、成王所修為一處，互其文以相曉也。箋雲“彼南山之野，禹治而丘甸之”，即雲“今原隰墾闢，則又成王之所田。言成王乃遠修禹之功。今王反不脩其業乎？”言修禹功而文相因，明南山、原隰二者為一處。成王之修禹功，實天下盡然，而獨言南山者，作者指一處以表之，其意通及天下也。故序言“疆理天下”，下注言“上天同雲”，是非獨南山之傍修禹功也。獨舉原隰以為言者，鄭《駁異義》引此詩以盡三章。此詩之意，以原隰生生百穀，原隰之功，於人尤大，故獨言也。甸之為字，既訓為治，音又為乘，以治其地使平成田則訓為治，以方十里出兵車一乘故又音為乘也。《韓奕》箋雲：“禹甸之者，決除其災，使成平田，定貢賦於天子。”是亦以治為義也。《地官·小司徒》雲：“四丘為甸。”注云：“甸之言乘也，讀如中甸之甸。”《稍人》雲：“掌令丘乘之政令。”注云：“丘乘，四丘為甸，甸讀與‘維禹陳之’之陳同。其訓曰乘，由是改雲。”《郊特牲》雲：“丘乘共粢盛。”注云：“甸或謂之乘，以其於車賦出馬四匹，長轂一乘。”是以乘為義也。知六十四井為甸者，《小司徒》雲：“四井為邑，四邑為丘，四丘為甸。”如數計之，丘十六井，甸六十四井也。知方八里者，以《孟子》雲：“方里為井。”計之則邑方一里，丘方四里，甸方八里也。又解方八里名為甸之意，以其居一成之中，成方十里，出兵車一乘，以為賦法，故謂之甸。甸，乘也。“十里為成”，《冬官·匠人》文也。知甸居一成之中者，以《匠人》既雲“十里為成”，即雲“成間廣八尺，深八尺，謂之洫”。是當甸在其中，傍一里以治洫。故彼注云：“方十里為成，成中容一甸，甸方八里出田稅，緣邊一里治洫。”是也。《論語注》引《司馬法》雲：“井十為通，通十為成，成出革車一乘。”是據成方十里，出車一乘也。成元年《左傳》服注引《司馬法》雲：“四邑為丘，有戎馬一匹，牛三頭，是曰匹馬丘牛。四丘為甸，甸六十四井，出長轂一乘，馬四匹，牛十二頭，甲士三人，步卒七十二人，戈楯具備，謂之乘馬。”是據甸方八里，出車一乘也。二者事得相通，故各據一焉。若然，成出兵車一乘，為七十五人耳。而哀元年《左傳》說夏少康“有田一成，有眾一旅”，十里有五百人者，計成方十里，其地有九百夫之田也。授民田有不易、一易、再易，通率二而當一，有四百五十人矣。其中上地差多，則得容五百人也。其出兵夫，則眾不盡行，故一車士卒唯七十五人。傳說少康言有眾一旅，盡舉大眾，故與出賦異也。箋以此“維禹甸之”為“丘甸”。孫毓雲：“禹平治水土，以除洪水之災。”當此之時，未及丘甸。其田也，且井、邑、丘、甸出於周法，虞夏之制未有聞焉。今以周之法為虞、夏之說，又謂禹治水土皆丘甸之，非其義也。然則鄭為禹亦丘甸之者，《禮運》說“大道既隱”，而曰“以立田裏”，是則三王之初而有井甸田裏之法也。《論語》說“禹盡力乎溝洫”，與《匠人》“成間有洫”同也。《皋陶謨》“畎氵會距川”，與《匠人》“同間有氵會，專達於川”同也。是則丘甸之法，禹之所為。《左傳》少康之在虞思，有田一成，有眾一旅，於是則十里為成，非周之賦法也。禹之治水既平，乃任土作貢，有何不暇，而云未及丘甸之也？故鄭以為禹治而丘甸之。○傳“疆畫”至“地理”。○正義曰：《孟子》曰：“夫仁政必自經界始。經界不正，井田不均。”趙岐注云：“經亦界也。”然則經界者，地畔之名也。疆謂正其封疆，故云畫經界。襄四年《左傳》曰：“茫茫禹跡，畫為九州。”九州尚畫其界，是田之經界須畫之也。分地理者，分別地所宜之理，若《孝經》注云“高田宜黍稷，下田宜稻麥”，是也。○傳“或南或東”。○正義曰：成二年《左傳》曰：“先王疆理天下物土之宜。故《詩》曰：‘我疆我理，南東其畝。’”是於土之宜，須縱須橫，故或南或東也。" }
      - { type: j, text: "上天同雲，雨雪雰雰。雰雰，雪貌。豐年之冬，必有積雪。○雨，於傅反，崔如字。雰，芳雲反。益之以霢霂，既優既渥，小雨曰霢霂。箋雲：成王之時，陰陽和，風雨時，冬有積雪，春而益之以小雨，潤澤則饒洽。○霢，亡革反。霂音木。優，《說文》作“瀀”，音憂。渥，烏學反。" }
      - { type: j, text: "既霑既足，生我百穀。" }
      - { type: z, text: "“上天”至“百穀”。○正義曰：言成王時，在上天同起其雲，正於冬月雨下此雪雰雰然多而積也。至於春日，又益之以小雨而霢霂然，以接冬澤，既已優洽，既已饒渥，既已沾潤，既已豐足，是以故得生我之眾穀也。今王不能然，故舉以刺之。言“上天同雲”，明澤之遍也，以雲在於天上，雨從上下，故云上天，非有義例。○傳“豐年”至“積雪”。○正義曰：謂明年將豐，今冬積雪為宿澤也。然則積雪是年之前冬，而言豐年之冬，必有積雪者，以此章言穀之生，下章言其成熟，舉一年之生成，以為首尾之次，非復言歲初歲末，限以同年。傳達經意，故言豐年冬耳。○傳“小雨霢霂”。○正義曰：《釋天》文也。李巡曰：“水雪俱下。”案彼文上有暴雨，下雲久雨，於間無雪事。而李巡雲“俱下”，妄矣。此傳有云小雪者，誤。今定本雲“小雨”。" }
      - { type: j, text: "疆埸翼翼，黍稷彧彧。場，畔也。翼翼，讓畔也。彧彧，茂盛貌。○埸音亦。下同。彧彧，於六反。曾孫之穡，以為酒食。畀我屍賓，壽考萬年。箋雲：斂稅曰穡。畀，予也。成王以黍稷之稅為酒食，至祭祀齊戒則以賜屍與賓。尊屍與賓，所以敬神也。敬神則得壽考萬年。○畀，必寐反。注同。齊，側皆反。" }
      - { type: z, text: "“疆埸”至“萬年”。○正義曰：上既言百穀以生成，故此雲稅取供祭也。言所生百穀之處，其農人理之，使疆埸之上翼翼然閒整讓畔。今黍稷之苗彧彧然茂盛而成長。至秋收刈，則曾孫成王之所稅斂，而以為酒之與食也。既為酒食，於祭前齊戒之時，乃賜我屍之與賓以尊養之。屍實未至，祭時而豫賜之酒食，為敬神故也。神既為王所敬，故令王得壽考萬年之福也。今王不能然，故舉以刺之。○傳“埸畔”至“盛貌”。○正義曰：以田之疆畔至此而易主，名之為埸。翼翼是間暇之名，故舉讓畔之敬，以明其田事之理也。上言“生我百穀”，此獨言黍稷者，黍稷為穀之長，故特言之也。○箋“斂”至“萬年”。○正義曰：上言黍稷，或是天下民田也。“曾孫之穡”，文承其下，故知稅斂曰穡也。賓之與屍，祭時所有，經雲“畀我屍賓”，何知不指謂祭時予之？而箋以為齋戒則以賜屍賓者，以此詩陳事而有次序，五章、卒章始言祭時之事，清酒、騂牡享於祖考，則此未祭而言“畀我屍賓”，明祭前矣。又不言享祀，而云“畀我”，是賜下之辭，故為祭祀齊戒以賜屍賓也。《祭義》雲：“祭前十日，散齊七日，致齊三日。”《周禮》所謂“前期十日”，是也。於齊之時，官當與之酒食。而箋雲賜者，以其未祭，則屍猶臣道，故言賜也。經言敬事屍賓，而令神降福者，以其尊屍與賓，即所敬神也。由能敬神，則壽考萬年也。神與壽考，祭時嘏辭，與卒章“萬壽無疆”，明其同時也。以宿敬於神，以及屍賓，於後得福，故此致其意而逆言之耳。" }
      - { type: j, text: "中田有廬，疆埸有瓜。是剝是菹，剝瓜為菹也。箋雲：中田，田中也。農人作廬焉，以便其田事。於畔上種瓜，瓜成又入其稅，天子剝削淹漬以為菹，貴四時之異物。○廬，力居反。剝，邦角反。菹，側居反。便，毗戰反。削，思約反。淹，英鉗反。漬，子賜反，淹也。" }
      - { type: j, text: "獻之皇祖。曾孫壽考，受天之祜。箋雲：皇，君。祜，福也。獻瓜菹於先祖者，順孝子之心也。孝子則獲福。○祜音戶。" }
      - { type: z, text: "箋“中田”至“異物”。○正義曰：古者宅在都邑，田於外野，農時則出而就田，須有廬舍，故言中田，謂農人於田中作廬，以便其田事。於田中種穀，於畔上種瓜，亦所以便地也。於畔上種瓜，廣謂天下民田瓜成，又入其稅。民以瓜新熟，獻於天子。天子得之，乃剝削淹漬以為菹，欲以供祭祀，貴四時之異物故也。遍檢《書傳》，未見天子稅民瓜以供祭祀者，故《地官·場人》“掌國之場圃，而樹之果蓏珍異之物，以時斂而藏之。凡祭祀，共其果蓏瓜瓠之屬。”《郊特牲》曰：“天子樹瓜華，不斂藏之種。”是則天子之瓜，自令有司供之，不稅於民。此言瓜成，入其稅於天子者，《周禮》言其正法，瓜不稅民。此述成王之時，民盡力於農業，故畔上種瓜，獻諸天子。天子得為菹以祭，欲見天子孝於親，而下民愛其主。反以刺今幽王也。箋以對前“曾孫之穡”為正稅，故云又入其稅耳。非謂正法所當稅也。○箋“獻瓜”至“獲福”。○正義曰：《周禮·場人》“祭祀供其果蓏”，是祭必有瓜菹矣。《醢人》豆實無瓜菹者，主說正豆之實，故文不具耳。" }
      - { type: j, text: "祭以清酒，從以騂牡，享於祖考。周尚赤也。箋雲：清，謂玄酒也。酒，鬱鬯五齊三酒也。祭之禮，先以鬱鬯降神，然後迎牲。享於祖考，納亨時。○騂，息營反，《字林》許營反。享，許兩反，徐許亮反。注及下同。鬱，雍勿反。齊，才細反。亨，普庚反。" }
      - { type: j, text: "執其鸞刀，以啟其毛，取其血膋。鸞刀，刀有鸞者，言割中節也。箋雲：毛以告純也。膋，脂膏也。血以告殺，膋以升臭，合之黍稷，實之於蕭，合馨香也。○膋音聊。中，丁仲反。臭，昌救反。" }
      - { type: z, text: "“祭以”至“血膋”。○正義曰：此章陳正祭之事。古者成王為祭之時，祭神以清與酒。清謂玄酒也。酒謂鬱鬯與五齊三酒也。先以鬱鬯祼而降神，乃隨從於後，以騂牡之牲迎而入於廟門，以獻於祖考之神。既納以告神，乃令卿大夫執持其鸞鈴之刀，以此刀開其牲之皮毛，取牲血與脂膏之膟膋，而退毛以告純，血以告殺，膋以升臭，合馨香以薦神。各有其人，皆肅其事。今王不能然，故刺之。○傳“周尚赤也”。○正義曰：《地官·牧人》雲：“陽祀，用騂牲毛之。”注以陽祀為宗廟。似由陽祀，故用騂。此雲尚赤者，《牧人》以周尚赤，故郊廟用騂，為陽以相對。其實由所尚，故曰“白牡，周公牲。”三代祭其廟，各用其所尚之毛色也。○箋“清謂”至“亨時”。○正義曰：《禮運》說祭之禮雲：“玄酒在室。”是祭祀有玄酒也。《春官·鬱人》：“掌祼器。凡祭祀之祼事，和鬱鬯以實彝而陳之。”《司尊彝》四時之祭，皆祼用彝。是祀祼用鬱鬯也。《天官·酒正》雲：“辨五齊之名：一曰泛齊，二曰醴齊，三曰盎齊，四曰緹齊，五曰沈齊。辨三酒之物：一曰事酒，二曰昔酒，三曰清酒。”《酒人》“掌為五齊三酒，祭祀則供奉之”。是祭祀有五齊三酒也。《酒正》鄭注云：“泛者，成而滓浮泛泛然，如今宜成醪矣。醴，猶體也。成而汁滓相將，如今恬酒矣。盎，猶翁也。成而翁翁然蔥白色，如今酇白矣。緹者，成而紅赤，如今下酒矣。沈者，成而滓沈，如今造清酒矣。齊者，每有祭祀，以度量節作之也。”又云：“事酒，酌有事者之酒，其酒則今時醳酒也。昔酒，今之酋久白酒，所謂舊醳者也。清酒，今之中山冬釀接夏而成者是也。”鄭解五齊三酒之事也。此言“祭以清酒”，廣言祭用酒事，則文當總攝諸酒，故箋分而屬之。清謂玄酒也。酒謂鬱與五齊三酒也。玄酒，水也，故以當清。五齊三酒，則釀而為之，故以當酒。然《鬱人》注云：“鬱金，香草也。”則鬱非酒矣。亦以為酒者，祭之用鬱煮之以和鬯，《郊特牲》所謂“臭鬱合鬯”，是也。《鬯人》注：“鬯，釀秬為酒，芬香條暢於上下者也。”然則祼之有鬱和秬鬯而用之，故鬱亦為酒也。此言清酒，箋既辨之。《旱麓》雲：“清酒既載，騂牡既備。”箋直言祭祀先為清酒，其次擇牲。不復曲辨清酒之名者，此下有鸞刀，謂殺牲。祭時則騂牡在其上，據迎牲時。清酒又在其上，明據灌時。今經直雲清酒，恐不兼鬱鬯，故箋備解之。彼《旱麓》泛說，未是祭時，故注與此不同。《烈祖》雲：“既載清酤。”箋雲：“既載清酒於尊中，酌以祼獻。”以《周禮》言之，祼獻所用，則鬱鬯與醴齊也。清酤之言，亦總諸酒，與此同也。案三酒之名，三曰清酒。何知清酒非三酒之清酒者，以言祭以清酒，則以清酒祭神也。三酒卑於五齊，非祼獻所用，故《司尊彝》“凡六尊之酌，鬱齊獻酌，醴齊縮酌，盎齊涗酌，凡酒脩酌”。鄭注差次之雲：“凡祭酒三酒也。四者，祼用鬱齊，朝用醴齊，饋用盎齊，諸臣自酢用凡酒。”然則三酒乃是諸臣之所酢，不用之以獻神，故知《詩》之清酒，非三酒之清酒也。《司尊彝》又注云：“唯大事於太廟，備五齊三酒。”此不必大事，言五齊三酒者，以獻饋必醴盎，在五齊之中，諸臣所酢，必當用酒，故因言五齊耳，不必此祭備三五也。箋又以經先言“祭以清酒”，乃雲“從以騂牡”，言從，是相亞之辭。《郊特牲》曰：“既灌然後迎牲。”是先用酒，後用牲，故云“祭之禮，先以鬱鬯降神，然後迎牲。”《郊特牲》又曰：“灌用鬯臭，鬱合鬯。臭陰達於淵泉。”是以鬱降神也。又言“享於祖考”謂納亨時者，《大宰》雲：“及納亨，贊王牲事。”注云：“納牲將告殺，謂向祭之晨。既殺，以授亨人。”然則納亨者，謂牽牲入廟，將殺，授亨人，故謂之納亨也。亨於祖考知是納亨時者，《祭義》雲：“君牽牲入廟門，麗於碑。卿大夫袒，而毛牛尚耳，鸞刀以刲之。”此下文乃言“執其鸞刀”，故知是納亨時也。納亨而謂之獻於祖考者，《地官·充人》雲：“碩牲則贊。”注云：“贊，助也。”助君牽牲入告肥，是獻之也。○傳“鸞刀”至“中節”。○正義曰：鸞即鈴也，謂刀環有鈴，其聲中節，故《郊特牲》曰：“割刀之用，而鸞刀之貴，貴其義也。聲和而後斷，是中節也。”《祭義》曰：“卿大夫鸞刀以刲之，取膟膋。”則此亦卿大夫也。○箋“毛以”至“馨香”。○正義曰：經言“以啟其毛，取其血膋”，據文言之，直開毛取血，不似取毛。箋言“毛以告純”者，以祭禮用毛，不言啟皮。而云啟毛，明是取毛用之。《郊特牲》曰：“毛血告幽全之物，貴純之道也。”《楚語》觀射父雲：“毛以示物。”韋昭曰：“物，色。”是毛以告純。膋者，腸間脂也。脂釋者曰膏，故云“膋，脂膏也”。“血以告殺”，亦《楚語》文也。若不殺則無血，故以血告殺也。韋昭曰：“明不因故是也。”“膋以升臭”，謂燒其脂膏，升其臭氣，使神聞之。又申明升臭之事。以此脂膏，合之黍稷，置之蕭，乃以火燒之，合其馨香之氣，是升臭也。知者，《郊特牲》曰：“取膟膋燔燎升首，報陽也。”又曰：“蕭合黍稷，臭陽達於牆屋。故既奠然後爇蕭合馨香。”注云：“蕭香，蒿染以脂，合黍稷燒之。”是合馨香之事也。定本及《集註》皆以此注為毛傳，無“箋雲”兩字。" }
      - { type: j, text: "是烝是享，苾苾芬芬，祀事孔明。烝，進也。箋雲：既有牲物而進獻之，苾苾芬芬然香，祀禮於是則甚明也。" }
      - { type: j, text: "先祖是皇，報以介福，萬壽無疆。箋雲：皇之言暀也。先祖之靈歸暀是孝孫而報之以福。○疆，居良反。" }
      - { type: z, text: "“是烝”至“無疆”。○皇、介二字別。毛以先祖之精魂於是美大之，報以大大之福。鄭以先祖之神靈於是歸往之，報之所以助受大福祿。餘同。○箋“既有牲物”。○正義曰：上章騂牡是牲也，酒及血膋是物也。以承上文而言“是烝是享”，故云“既有牲物而進獻之”也。" }
