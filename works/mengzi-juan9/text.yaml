# 孟子注疏卷9（孫奭疏）：j 為經文＋漢趙岐注，z 為疏文。
sections:
  - id: juan9
    name: 正文
    blocks:
      - { type: z, text: "正义曰：此卷即赵注分上卷为此卷也。此卷凡三十有二章一章言圣人殊世而合其道。二章言重民之道，平政为首。三章言君臣之道，以义为表，以恩为里，旧君之服，盖有所兴，讽喻宣王，劝以仁也。四章言君子见几而作。五章言上为下效。六章言大人不为非礼非义。七章言父兄已贤，子弟既顽，教而不改，乃归自然。八章言好言人恶，殆非君子。九章言疾之已甚，乱也。十章言大人所求合义。十一章言视民如子，则民怀矣。十二章言养生竭力，人情所勉，哀死送终，谓之大事。十三章言学必根源，如性自得。十四章言广寻道意，详说其事，要约至义，还反於朴。十五章言五伯服人，三王服心。十六章言进贤受赏，蔽贤蒙戮。十七章言有本不竭，无本则涸。十八章言禽兽俱含天气，众人皆然，圣人超绝，识仁义之主於己也。十九章言周公能思三王之道，以辅成王。二十章言《诗》、《书》与《春秋》。二十一章言五世一体，上下通流。二十二章言廉惠勇三者。二十三章言求交取友，必得其人。二十四章言貌好行恶，当修饰之，惟义为常。二十五章言能修性守故，天道可知。二十六章言循理而动，不合时人。二十七章言君子责己，小人不改，蹈仁行礼，不患其患。二十八章言颜子之心，有同禹稷。二十九章言匡章得罪，出妻屏子。三十章言曾子子思，处义非谬者也。三十一章言人以道殊，贤愚体别。三十二章言小人苟得，妻妾犹羞。凡此三十二章合前卷二十八章是《离娄》一篇有六十章矣。" }
      - { type: j, text: "孟子曰：“舜生於诸冯，迁於负夏，卒於鸣条，东夷之人也。（生，始。卒，终。记终始也。诸冯、负夏、鸣条，皆地名也。负海也，在东方夷服之地，故曰东夷之人也。）文王生於岐周，卒於毕郢，西夷之人也。（岐周、毕郢，地名也。岐山下周之旧邑，近畎夷。畎夷在西，故曰西夷之人也。《书》曰：“大子发上祭于毕，下至于盟津。”毕，文王墓，近於酆、镐之地。）地之相去也千有馀里，世之相後也千有馀岁，得志行乎中国，若合符节。先圣後圣，其揆一也。（土地相去千有馀里，千里以外也。舜至文王，千二百岁。得志行政於中国，盖谓王也。如合符节，节，玉节也，《周礼》有六节。揆，度也，言圣人之度量同也。）" }
      - { type: z, text: "“孟子曰”至“其揆一也”。○正义曰：此章指言圣人殊世而合其道，地虽不比，由通一轨，故可以为百王法也。“孟子曰：舜生於诸冯，迁於负夏，卒於鸣条，东夷之人也”者，孟子言舜帝其始生於诸冯之地，其後迁居於负夏之地，其卒死於鸣条之野，是东夷之人也。以其地在东方，故曰东夷之人。“文王生於岐周，卒於毕郢，西夷之人也”者，孟子又言文王其始生岐山之下，其终卒於毕郢之地，是西夷之人也。以其地在西，故曰西夷之人。岐山本是周邑，故曰岐周。“地之相去也千有馀里，世之相後也千有馀岁，得志行乎中国，若合符节。先圣後圣，其揆一也”者，孟子言自舜帝所居终、始之地，与文王所居终、始之地，有千里以外之远，自舜所生之世，文王所生之世，相後有千二百岁之久，其皆得志行政於中国，以致治，如合其符节，有同而无异。一为先圣於前，一为後圣在後，其所揆度，则一而无二也。以其同也，揆，度也。○注“生始”至“东夷之人也”。○正义曰：案《史记》云：“舜，冀州之人也，耕於历山，渔雷泽，陶河滨，作什器於寿丘，就时於负夏，年二十，以孝闻。三十，尧娶以二女，遂举用之。五十摄行天子事。五十八，尧崩。六十一，代尧践帝位。践帝位三十九年，南巡狩，崩於苍梧之野，葬於江南九嶷山，是为零陵。”今云舜生於诸冯，则诸冯在冀州之分。郑玄云：“负夏，卫地。”案《地理志》云：“卫地，营室东壁之分野，今之东郡是也。”其本颛顼之墟，推之则卫地与冀州之地相近，是负夏之为地名也。一云负夏鸣条者，《书》云：“汤与桀战于鸣条之野。”孔传云：“地在安邑之西。”郑玄云：“地在南夷。”云“东夷之人”者，案《史记》云：“帝舜为有虞。”皇甫谧云“舜嫔于虞，今河东大阳”是也。○注“岐周毕郢”至“酆镐也”。○正义曰：案《本纪》云：“古公父，去逾梁山，止於岐下。”徐广曰：“岐山在扶风义阳西北，其南有周原。”裴る案：皇甫谧曰：“邑於周地，故始改曰周。古公有少子季历生昌，有圣瑞，後立为西伯，移徙都酆。”徐广曰：“酆在京兆县东，有灵台；高阝在上林昆明，北有高阝池，去酆有二十五里，皆在长安南数十里。”徐广云：“文王九十七崩，谥为文王。”《谥法》曰：“慈惠爱民曰文。”“忠蒙接礼曰文。”武王即位九年，上祭于毕。马融曰：毕，文王墓地名也。《南越志》云：郢，故楚都，在南郡。则知毕在郢之地，故曰毕郢。○注“舜至文王，千二百岁”，“《周礼》有六节”。○正义曰：案《史记·世表》推之，是自舜至文王有千二百岁矣，其文烦更不录。《周礼》六节，案《周礼》云：“守邦国者用玉节，守都鄙者用角节。凡邦国之使节，山国用虎节，土国用人节，泽国用龙节，皆金也。以英荡辅之。”郑注云：“以金为节，铸象也。必自以其国所多者，所以相别为信明也。今汉有铜虎符。”杜子春云：“荡当为帑，谓以函器盛此节。或曰英荡，或曰函关。门用符节，货贿用玺节，道路用旌节。注云符节，如今宫中诸官诏符也。玺节者，今之印章也。旌节，今使者所拥节。”是也。将送者，执此节以送行者也。凡此是《周礼》有六节之别尔。" }
      - { type: j, text: "子产听郑国之政，以其乘舆济人於溱洧。（子产，郑卿。为政，听讼也。溱洧，水名。见人有冬涉者，仁心不忍，以其乘车度之也。）孟子曰：“惠而不知为政。岁十一月徒杠成，十二月舆梁成，民未病涉也。（以为子产有惠民之心，而不知为政，当以时修桥梁，民何由病苦涉水乎？周十月，夏九月，可以成涉度之功。周十一月，夏十月，可以成舆梁也。）君子平其，政行辟人可也，焉得人人而济之。故为政者每人而悦之，日亦不足矣。”（君子为国家平治政事刑法，使无违失其道，辟除人，使卑辟尊可为也。安得人人济渡於水乎？每人而悦之欲自加恩，以成其意，则日力不足以足之也。）" }
      - { type: z, text: "“子产听郑国之政”至“亦不足矣”。○正义曰：此章指言重民之道，平政为首，人君由天，天不家抚，是以子产渡人，孟子不取也。“子产听郑国之政，以其乘舆济人於溱洧”者，子产，郑大夫公孙侨也。溱洧，郑国水名也。言子产为政听讼於郑国，於冬寒之月，见人涉溱洧之水，乃不忍，遂以所乘之车舆济渡人於溱洧。“孟子曰：惠而不知为政”至“日亦不足矣”，孟子言子产虽有恩惠及人，而以陆地乘舆而济人於溱洧，然而不知行其不忍人之政而济人矣。所谓岁十一月徒杠成，十二月舆梁成，是其政也。言岁中以十一月雨毕乾晴之时，乃以政命成其徒杠。徒杠者，《说文》云：“石工，石桥也，俗作杠，从木，所以整其徒步之石。”十月成津梁，则梁为在津之桥梁也。今云舆梁者，盖桥上横架之板，若车舆者，故谓之舆梁。如此，民皆得济，所以未有忧病其涉者也。君子之为，但平其政事，使无违失，行法於人，而使尊之。其若此则可也，又安得人人而济渡之乎？如人人济之，则人望我者无穷，而我应者有不足焉。故为国之政者，如每以人人而使之悦，虽日力之穷，亦不足以济之矣。但平其政事，使徒杠成於十一月，舆梁成於十月，则病涉之民无不济矣。子产不知为政之道在此，而徒知以乘舆济人为之惠，故宜孟子言之於当时，以激劝而讥讽之也。○注“子产，郑卿。为政，听讼。溱洧，水名”。○正义曰：案《左传》云：“子产，穆公之孙，公子发之子也。”又鲁襄三十年执郑国之政，故云郑卿，为政听讼也。云“溱洧，水名”者，盖郑国之水名。案《地理志》云：“溱洧，水在河南。”又《说文》云：“水在郑国南，入于洧。”则知溱洧，水名，在郑国也。○又於注周十一月，即夏十月。十月即夏九月，已说上篇，叔向云十月而津梁成，是其旨也。" }
      - { type: j, text: "孟子告齐宣王曰：“君之视臣如手足，则臣视君如腹心。君之视臣如犬马，则臣视君如国人。君之视臣如土芥，则臣视君如寇雠。（芥，草芥也。臣缘君恩，以为差等，其心所执若是也。）王曰：“礼，为旧君有服，何如斯可为服矣？”（宣王问礼旧臣为旧君服丧服，问君恩何如则可以为服。）曰：“谏行言听，膏泽下於民；有故而去，则使人导之出疆，又先於其所往；去三年不反，然後收其田里：此之谓三有礼焉。如此，则为之服矣。（为臣之时，谋行言从，惠泽加民。若有他故，不得不行，譬如华元奔晋、随会奔秦是也，古之贤君遭此，则使人导之出境，又先至其所到之国言其贤良。三年不反，乃收其田里。田，业也；里，居也。此三者有礼，则为之服矣。）今也为臣，谏则不行，言则不听，膏泽不下於民；有故而去，则君搏执之，又极之於其所往；去之日，遂收其田里：此之谓寇雠。寇雠何服之有？”（抟执其族亲也。极者，恶而困之也。遇臣若寇雠，何服之有乎？）" }
      - { type: z, text: "“孟子告齐”至“之有”。○正义曰：此章指言君臣之道，以义为表，以恩为里，表里相应，犹若影响。旧君之服，盖有所兴，讽谕宣王，劝以仁也。“孟子告齐宣王曰”至“如寇雠”者，孟子告谕齐宣王，谓君之视其臣如己之手足，则臣亦视君如己之腹心。君之视其臣如畜之犬马，则臣亦视其君但以国人遇之也。君之视其臣如土芥之贱而弃之，则臣视其君亦如寇雠恶而绝之也。凡此君臣施报相待以为用矣。盖无为於其内者，腹心也；有为於其外者，手足也：君臣相须，犹一体也。此言相待施报均於厚也。若以君视臣如犬马之畜，而臣视君如国人而弗亲，此言不相待施报，均於薄也。以君视臣如土芥之贱，而臣视君如寇雠而恶之，此言不相待施报，均於贱也。然则君臣施报，亦随之而已。“王曰：礼，为旧君有服，何如斯可为服矣”，宣王问孟子：於礼为旧君有丧服，何如斯可为之服言。旧君，所去之国君也。“曰谏行言听”至“则为之服矣”，孟子答之，谓臣之於君，君有过谬而谏之则行，事有可为而言之则听，而膏润之恩泽施之又下浃於民，此得行其道也。然不幸遭其事故而去之，则国君使人导之，以达其情，至出国之疆界，又先去其所往之邦以称誉之。去三年之久而不反归，然後国君乃收其田业里居。此三者是谓三有礼焉。如此三有礼，则可为之丧服矣。“今也为臣，谏则不行，言则不听”至“何服之有”，孟子又言今之为臣於国君，君有过谬，及其谏也则拒之而弗得行，言则违之而弗听，而膏泽又不得以下浃，此不得行其道也。及其所遭事故而去之，君乃不使人导之，且搏执其亲族而戮之，又困极而恶之於其所往之邦，即自离去之日，遂便收其田业里居，此是谓遇其臣如寇雠之恶。既以寇雠遇其臣，则臣尚何有丧服为哉？○注“旧臣为旧君服丧服”。○正义曰：如《仪礼》言“以道去君，而未绝者，服齐衰三月”，《礼记》云“臣之去国，君不扫其宗庙，则为之服”，是为旧臣服丧服之谓也。○注“如华元奔晋，随会奔秦”。○正义曰：案《左传》成十五年：“华元为右师。华元曰：‘我为右师，君臣之训，师所司也。今公室卑而不能正，吾罪大矣。不能治官，敢赖宠乎？’乃出，奔晋。鱼石为左师，自止华元於河上，後及奔晋，得五月日，乃反。”《书》曰“宋华元出奔晋”、“宋华元自晋归于宋”是也。云“随会奔秦”者，案文公七年先蔑奔秦，随会从之，至十三年，晋人患秦之用士会也，晋侯乃使魏寿馀伪以魏叛者以诱士会，士会既济，魏人噪而还。杜注云“喜得士会也”是矣。" }
      - { type: j, text: "孟子曰：“无罪而杀士，则大夫可以去。无罪而戮民，则士可以徙。”（恶伤其类，视其下等，惧次及也。语曰：“鸢鹊蒙害，仁鸟曾逝。”此之谓也。）" }
      - { type: z, text: "“孟子”至“可以徙”。○正义曰：此章指言君子见几而作，故赵杀鸣犊，孔子临河而不济也，是上为下则也。孟子谓国君无罪而杀戮其士，则为之大夫者可以奔去。无他，盖大夫虽於士为尊，不可命以为士，然亦未离乎士之类也，是其恶伤其类耳。国君无罪而诛戮其民，则为之士者可以徙而避之。无他，盖士於民虽以为尊，不可命以为民，然亦未离乎民之类也，是亦恶伤其类耳。於士言杀，於民言戮者，总而言之皆然也，别而言之，则戮又轻於杀矣。案《周礼》“司稽掌巡市”，云凡有罪者挞戮而罚之。是知戮不过挞而辱之耳，而杀乃至於亡命故也。《史记》：赵杀鸣犊，孔子临河而不济，乃叹曰：“刳胎杀天，则麒麟不至郊；竭泽涸鱼，则蛟龙不会；覆巢毁卵，则凤凰不翔。”君子讳伤其类也。今注云“语曰鸢鹊蒙害，仁鸟增逝”，是亦《史记》之文，赵注引之。" }
      - { type: j, text: "孟子曰：“君仁莫不仁，君义莫不义。”（君者，一国所瞻仰以为法，政必从之，是上为下则也。）" }
      - { type: z, text: "正义曰：此章指言君以仁义率众，孰不顺焉，上为下效也。孟子谓国君在上，能以仁义先率於一国，则一国之人莫不从而化之，亦以仁义为也。○注云上为下效者。○正义曰：如所谓君子之德风，小人之德草，草上之风必偃也。又荀卿所谓表正则影正，盘圆则水圆，盂方则水方，是其旨也。" }
      - { type: j, text: "孟子曰：“非礼之礼，非义之义，大人弗为。”（若礼而非礼，陈质娶妇而长拜之也。若义而非义，藉交报雠是也。此皆大人之所不为也。）" }
      - { type: z, text: "正义曰：此章指言礼义，人之所以折中，履其正者，乃可为中，是以大人疑礼。孟子谓有所为礼，有所为非礼，有所为义，有所为非义。如非礼非义，惟大夫能弗为之也。○注“陈质娶妇，藉交报雠”者。○正义曰：此盖史传之文而云然。" }
      - { type: j, text: "孟子曰：“中也养不中，才也养不才，故人乐有贤父兄也。（中者，履中和之气所生，谓之贤。才者，是谓人之有俊才者。有此贤者，当以养育教诲不能，进之以善，故乐父兄之贤以养己也。）如中也弃不中，才也弃不才，则贤不肖之相去，其间不能以寸。”（如使贤者弃愚，不养其所以当养，则贤亦近愚矣。如此，贤不肖相觉，何能分寸，明不可不相训导也。）" }
      - { type: z, text: "“孟子”至“不能以寸”。○正义曰：此章指言父兄之贤，子弟既顽，教而不改，乃归自然也。孟子言君子以性德而教养灭其性德者，以性之能而教养灭其性之才能者，故人所以乐得其贤父兄而教养也。如君子有贤父兄之道，而不推己之性德以教养人之不中，不推己之才性而教养人之不才，是弃去其不中、不才之人也。如此，则贤不肖，恶能相去以寸哉？是不足以相贤矣。盖中者，性之德也。才，性之能也。贤父兄者，所以对弟子而言之也，如孟子所谓曾子居武城而谓之为师也、父兄也，是其意也。○注“中者履中和之气”至“养己也”。○正义曰：“中和之气”者，盖人受天地之中而生，禀阴阳之秀气，莫非所谓中和也。《中庸》云：“喜怒哀乐，未发谓之中，发而皆中节谓之和。”贤以德言。云俊才者，俊智过千人曰俊，则知才能有过於千人之才能，是为俊才也。一云：俊，敏也，疾也。" }
      - { type: j, text: "孟子曰：“人有不为也，而後可以有为。”（人不为苟得，乃能有让千乘之志也。）" }
      - { type: z, text: "正义曰：此章指言贵贱廉耻，乃有不为，不为非义，义乃可由也。孟子言人之有不为非义之事，然後可以有为其义矣。又所谓人皆有所不为，达之於其所为义也，亦是意也。以此推之，则仁也，礼也，智也，皆待是而裁成之矣。" }
      - { type: j, text: "孟子曰：“言人之不善，当如後患何！”（人之有恶，恶人言之。言之，当如後有患难及己乎。）" }
      - { type: z, text: "正义曰：此章指言好言人恶，殆非君子，故曰：“不忮不求，何用不藏。”孟子谓人有好谈人之不善者，必有患难及之矣。故曰：言人之不善，当如後患何如？《庄子》云：“人者人必反之。”《论语》云：“不忮不求，何用不臧？”亦与此同意。" }
      - { type: j, text: "孟子曰：“仲尼不为已甚者。”（仲尼弹邪以正，正斯可矣，故不欲为已甚泰过也。孟子所以讥逾墙距门者也。）" }
      - { type: z, text: "正义曰：此章指言《论》曰：“疾之已甚，乱也。”故孟子所以讥逾墙距门者也。孟子言孔子凡所为，不为已甚泰过者也，如《论语》云“疾之已甚，乱也”，同意。○注云“孟子所以讥逾墙距门者”，盖谓如段干木逾垣而避文侯，泄柳闭门而拒缪公，是为已甚者。" }
      - { type: j, text: "孟子曰：“大人者，言不必信，行不必果，惟义所在。”（果，能也。大人仗义，义有不得必信其言，子为父隐也；有不能得果行其所欲行者，若亲在不得以其身许友也；义或重於信：故曰惟义所在也。）" }
      - { type: z, text: "正义曰：此章指言大人之行，行其重者，不信不果，所求合义也。孟子言大人者，其於言不以必信，所行不以必果，惟义之所在，可以信则信，可以行则行耳。如言必信、行必果，则所谓然小人哉矣，岂大人肯如是邪？盖孔子与蒲人盟，不卫而终卫，是言不必信也。佛召，子欲往而终不往，是行不必果也。○注“子为父隐”，“以其身许友也”。○正义曰：此案《论语》、《礼记》云也。" }
      - { type: j, text: "孟子曰：“大人者，不失其赤子之心者也。”（大人谓君。国君视民，当如赤子，不失其民心之谓也。一说曰：赤子，婴儿也，少小之子，专一未变化，人能不失其赤子时心，则为贞正大人也。）" }
      - { type: z, text: "正义曰：此章指言人之所爱，莫过赤子，视民则然，民怀之张。大人之行，不过是也。孟子言世之所谓为之大人者，是其能不失去其婴儿之时心也，故谓之大人，如《老子》所谓“常德不离，复归於婴儿”之意同。" }
      - { type: j, text: "孟子曰：“养生者不足以当大事，惟送死可以当大事。”（孝子事亲致养，未足以为大事，送终如礼，则为能奉大事也。）" }
      - { type: z, text: "正义曰：此章指言养生竭力，人情所勉。哀死送终，行之高者，事不违礼，可谓难矣，故谓之大事。孟子言人奉养父母於其生日，虽昏定晨省，冬温夏清，然以此之孝，亦不足以当其大事也。惟父母终，能辟踊哭泣，哀以送之，卜其宅兆，而安厝之，斯可以当之也。" }
      - { type: j, text: "孟子曰：“君子深造之以道，欲其自得之也。（造，致也。言君子学问之法，欲深致极竟之以知道意，欲使己得其原本，如性自有之然也。故曰欲其自得之而已。）自得之，则居之安；居之安，则资之深；资之深，则取之左右逢其原：故君子欲其自得之也。”（居之安，若己所自有也。资，取也。取之深，则得其根也。左右取之，在所逢遇皆知其愿本也。故使君子欲其自得之也。）" }
      - { type: z, text: "“孟子”至“得之也”。○正义曰：此章指言学必根源，如性自得，物来能名，事来不惑，君子好之，朝益暮习，道所以臻也。“孟子曰：君子深造之以道”至“君子欲其自得之也”者，此孟子教人学道之法也，言君子所以深造至其道奥之妙者，是欲其如己之所自有之也。己之所自有，则居之安。居之安者，是使权利不能移，群众不能倾，天下不能荡是也。居之安则资质以深，则自本自根，取之不殚，酌之不竭是也。资之既深，则取之左右逢其原。左右逢其愿者，则理与万物得，性与万物明，取之左则左，取之右则右，无非自本自根也，故云取之左右逢其原。如此，故君子所以学道，欲其自得之也。如庄生所谓黄帝遗其玄珠，使智索之不得，使离朱索之不得，使契诟索之不得，乃使象罔得之。盖玄珠譬则道也；智有待於思，言思之亦不能得其道也；离朱有待於明，言以明求之亦不能得道也；契诟有待於言，以言求之亦不能得其道也；象罔则无所待矣，唯无所待，故能得其道，是其所谓自得也。" }
      - { type: j, text: "孟子曰：“博学而详说之，将以反说约也。”（博，广。详，悉也。广学悉其微言而说之者，将以约说其要，意不尽知，则不能要言之也。是谓广寻道意，还反於朴，说之美者也。）" }
      - { type: z, text: "正义曰：此章指言广寻道意，详说其事，要约至义，还反於朴，说之美者也。孟子言人之学道，当先广博而学之，又当详悉其微言而辩说之，其相将又当以还反说其至要者也。以得其至要之义而说之者，如非广博寻学，详悉辩说之，则是非可否，未能决断，故未有能反其要也。是必将先有以博学详说，然後斯可以反说其约而已。" }
      - { type: j, text: "孟子曰：“以善服人者，未有能服人者也。以善养人，然後能服天下。天下不心服而王者，未之有也。”（以善服人之道治世，谓以威力服人者也，故人不心服。以善养人，养之以仁恩，然後心服矣，若文王治於岐邑是也。天下不心服，何由而王也。）" }
      - { type: z, text: "“孟子曰”至“未之有也”。○正义曰：此章指言五霸服人，三王服心，其服一也，功则不同也。上论尧舜，其是违乎！“孟子曰：以善服人者，未有能服人者也”至“未之有也”者，孟子言人君之治天下，如以善政而屈服人者，未有能屈服其人也。以善教而养人者，然後故能屈服其天下。然以善教养天下，天下不以心服而归往为之王，未之有也。以其能如此，则必为之王者，使天下心服而归往之矣。盖所谓善政民畏之、善教民爱之之意也。又云善教得民心是矣，若文王作辟雍，是能以善养人者也，故自西自东，自南自北，无思不服，此之谓也。" }
      - { type: j, text: "孟子曰：“言无实不祥。不祥之实，蔽贤者当之。”（凡言皆有实，孝子之实，养亲是也。善之实，仁义是也。祥，善。当，直也。不善之实何等也，蔽贤之人直於不善之实也。）" }
      - { type: z, text: "正义曰：此章指言进贤受上赏，蔽贤蒙显戮，故谓之不祥也。“孟子曰”至“蔽贤者当之”者，孟子谓人之言，无其实本者，乃虚妄之言也。以虚妄之言言之，则或掩人之善，或饰人之恶，为人所恶者也，故其为不祥莫大焉，不祥则祸是矣。不祥之实者，乃蔽贤直之也。所谓蔽贤，则掩人之善是矣。如臧文仲知柳下惠而不举，虞丘知叔敖之贤而不进，凡此之类，是谓蔽贤者也。" }
      - { type: j, text: "徐子曰：“仲尼亟称於水，曰：‘水哉水哉！’何取於水也？”（徐子，徐辟也。问仲尼何取於水而称之也。）孟子曰：“原泉混混，不舍昼夜，盈科而後进，放乎四海。有本者如是，是之取尔。（言水不舍昼夜而进。盈，满。科，坎。放，至也。至於四海者，有原本也。以况於事，有本者，皆如是是之取也。）苟为无本，七八月之间雨集，沟浍皆盈，其涸也。可立而待也。（苟，诚也。诚令无本，若周七八月，夏五六月，天之大雨，潦水卒集，大沟小浍皆满，然其涸也可立待之者，以其无本故也。）故声闻过情，君子耻之。（人无本，行暴得善声，令闻过其情，若潦水不能久也，故君子耻之。○）" }
      - { type: z, text: "“徐子”至“君子耻之”。○正义曰：此章指言有本不竭，无本则涸，虚声过实，君子耻诸，是以仲尼在川上曰：“逝者如斯。”“徐子曰：仲尼亟称於水，曰：水哉水哉！何取於水也”者，徐子即徐辟者也，徐辟问孟子，以谓孔子数数称道於水，乃复自而叹之，曰“水哉水哉”云，水之为水哉水哉，何仲尼独数数称於水也？“孟子曰：源泉混混，不舍昼夜”至“是之取尔”，孟子答之曰：孔子所以数数称於水者，以其有本源之泉水，混混滚势而流，不舍昼夜，是流之不竭，至，有坎科则必待盈满而後流进，以至乎四海之中。以其道大有本亦如是。是孔子所以亟称而必取之尔。“苟为无本”至“君子耻之”者，孟子又言苟为无本之水，是若周之七八月，夏之五六月间，天之大雨骤降，其雨之水卒然聚集于大沟小浍，皆盈盈然而满溢，则其乾涸但可立而守之也。以无本源，故如是之速乾耳。孟子复於此，言如声誉名闻，有或过於情实，而君子所以羞耻之，亦无本之水矣。然则孟子答徐辟以此者，非特言“原泉混混，不舍昼夜，盈科而後进，放乎四海”而已矣，盖有为而言之也，以其原泉混混，则譬君子之德性；不舍昼夜，则譬君子之学问；盈科而後进，则譬君子之成章；放乎四海，则譬君子於是造乎道也。○注云“徐子徐辟”。○正义曰：经於《滕文公》篇云：“墨者夷之，因徐辟而见孟子。”又曰：“徐子以告夷子。”是知徐子即徐辟也。○注“大沟小浍”。○正义曰：案《周礼·遂人》：“掌邦之野，凡治野，夫间有遂，遂上有径。十夫有沟，沟上有畛。百夫有洫，洫上有涂。千夫有浍，浍上有道。”郑注云：“十夫，二邻之田。百夫，一ガ之田。千夫，二鄙之田。遂、沟、畎、浍，皆所以通水於川也。遂广深各二尺；沟倍之，是广深各四尺也；洫又倍之，是洫广深各八尺也；浍广二寻，深二寻。”然则注云大沟、小浍，又非以常制言之尔。《论语》云：“子在川上曰：逝者如斯夫，不舍昼夜。”是仲尼常称於水者也。" }
      - { type: j, text: "孟子曰：“人之所以异於禽兽者几希，庶民去之，君子存之。（几希，无几也。知义与不知义之间耳。众民去义，君子存义也。）舜明於庶物，察於人伦。由仁义行，非行仁义也。（伦，序。察，识也。舜明庶物之情，识人事之序。仁义生於内，由其中而行，非强力行仁义也。故道性善，言必称於尧舜。但君子存之，庶民去之而不由尔。）" }
      - { type: z, text: "“孟子曰”至“行仁义也”。○正义曰：此章指言禽兽，俱含天气，就利避害，其间不希。众人皆然，君子则否。圣人超绝，识仁义之生於己也。“孟子曰：人之所以异於禽兽者几希”至“非行仁义也”者，孟子言世之人所以有别异於禽兽畜者无几也，以其皆含天地之气而生耳，皆能辟去其害而就其利矣。但小人去其异於禽兽之心，所以为小人也；君子知存其异於禽兽之心，所以为君子也。所谓异於禽兽之心者，即仁义是也。禽兽俱不知仁义，所以为禽兽。今夫舜之为帝，在深山之中，与木石居，与鹿豕游，虽与禽兽杂居其，然能闻一善言，见一善行，莫不从之，若决江河也，而无滞之耳。如此，是舜能明於庶物之无知，而存乎异於禽兽之心，详察人伦之类，而由仁义之道而行之矣。然舜既由其仁义而行之，非所谓行仁义而得之人也，是由仁义而行以得之天性也。孟子以此言之其有以异於禽兽者，皆舜之徒也。曰舜亦人也，我亦人也，有为者亦若是，但当存其异於禽兽之心耳，如杨雄“由於礼义，入自仁门，由於情欲，入自禽门”，斯其旨欤。" }
      - { type: j, text: "孟子曰：“禹恶旨酒而好善言。（旨酒，美酒也。仪狄作酒，禹饮而甘之。遂疏仪狄，而绝旨酒。《书》曰：“禹拜昌言。”）汤执中，立贤无方。（执中正之道，惟贤速立之，不问其从何方来。举伊尹以为相也。）文王视民如伤，望道而未之见。（视民如伤者，雍容不动扰也。望道而未至，殷录未尽，尚有贤臣，道未得至，故望而不致诛於纣也。）武王不泄迩，不忘远。（泄，狎。迩，近也。不泄狎近贤，不遗忘远善。近，谓朝臣。远，谓诸侯也。）周公思兼三王，以施四事，其有不合者，仰而思之，夜以继日；幸而得之，坐以待旦。”（三王，三代之王也。四事，禹、汤、文、武所行之事也。不合，己行有不合也。仰而思之，参诸天也。坐以待旦，言欲急施之也。）" }
      - { type: z, text: "“孟子曰”至“坐以待旦”。○正义曰：此章指言周公能思三王之道，以辅成王，太平之隆，礼乐之备，盖由此也。“孟子曰：禹恶旨酒而好善言”，孟子言禹王恶疾其美酒，而乐好人之善言，以其酒甘而易溺，常情之所嗜者也，故禹王所以恶之。盖仪狄造酒，禹王饮而甘之，遂疏仪狄是也。善言谈而难人，常情之所厌者也，故禹王所以好之耳。盖闻皋陶昌言，禹受而拜之是也。“汤执中，立贤无方”，孟子言汤王执大中至正之道，使其贤者、智者得以俯而就，而不为狂者，愚者、不肖者得以而及，而不为狷者矣。未尝立骄伉崖异绝俗之道，而使人不可得而至也。所谓中道而立，能者从之，是其旨欤。《尚书》云“汤懋昭大德，建中于民”，是其事矣。立其贤，则不以一方任之，但随其才而用之，以其人之材，固有长短小大，不可概以取之矣。《书》云“佑贤辅德，显忠遂良”，是其事矣。总以汤言之，则所谓常善救人，故无弃人，常善用人，故无遗贤，是其旨欤。“文王视民如伤，望道而未之见”，孟子言文王常有恤民之心，故视下民常若有所伤，而不敢以横役而扰动之也。《尚书》曰“文王不敢侮鳏寡”，又曰“怀保小民”，是其事矣。盖以望商之有贤，道未得至，故不敢诛於纣也，故曰未之见也。“武王不泄迩，不忘远”者，孟子言武王於在迩之臣，则常钦之而不泄狎；在远之臣，则常爱之而不遗忘：是所谓不泄迩，不忘远也。非特臣也，虽远迩之民，亦如是。《尚书》云“武王不宝远物，则远人格，所宝惟贤，则远人安”，又曰“华夏蛮貊，罔不率俾”，是其事矣。“周公思兼三王，以施四事”至“坐以待旦”者，孟子言周公辅相成王，常思念兼此三王而施行此四事，以为功业矣。三王即禹、汤、文武之三代王也。然以孟子则曰三王者，盖文、武明父子也。言其父，则子不待言而在其中，故但云三王四事者，即恶旨酒好善言、汤执中立贤无方、与视民如伤望道而未之见、不泄迩不忘远，是四事也。然以孟子於事则云四，盖父子所为有不同，所以别言之也。言周公施为，其有不合於此三王四事，则常仰望而思索之，必夜以继日，而未尝敢忘去之也；及幸而思索，得合於此三王之四事，则鸡鸣而起，坐以守待其旦明而施行之耳。是其急於有行，如恐失之谓也。○注“三王三代之王也”。○正义曰：禹，夏之代始王也；汤，殷之代始王也；文、武，周之代始王也：是为三代之王也。" }
      - { type: j, text: "孟子曰：“王者之迹熄而《诗》亡，《诗》亡然後《春秋》作。（王者谓圣王也。太平道衰，王迹止熄，颂声不作，故《诗》亡。《春秋》拨乱，作於衰世也。）晋之《乘》，楚之《杌》，鲁之《春秋》，一也。‘其事则齐桓、晋文，其文则史。’孔子曰：‘其义则丘窃取之矣。’”（此三大国史记之异名。“乘”者，兴於田赋乘马之事，因以为名；“杌”者，へ凶之类，兴於记恶之戒，因以为名；“春秋”，以二始举四时，记万事之名。其事，则五霸所理也，桓、文，五霸之盛者，故举之。其文，史记之文也。孔子自谓窃取之，以为素王也。孔子人臣，不受君命，私作之，故言窃，亦圣人之谦辞尔。）" }
      - { type: z, text: "“孟子曰”至“窃取之矣”。○正义曰：此章指言《诗》可以言，咏颂太平，时无所咏，《春秋》乃兴，假史记之文，孔子正之，以匡邪也。“孟子曰：王者之迹熄”至“丘窃取之矣”者，孟子言自周之王者风化之迹熄灭而《诗》亡，歌咏於是乎衰亡，歌咏既以衰亡，然後《春秋》褒贬之书於是乎作。《春秋》其名有三，自晋国所记言之，则谓之《乘》，以其所载以田赋乘马之事，故以因名为《乘》也；自楚国所记而言之，则谓之《杌》，以其所载以记へ凶之恶，故以因名为《杌》也；鲁以编年，举四时，记为事之名，故以因名为《春秋》也。凡此虽曰异其名，然究其实则一也。盖王者迹熄，则所存者但霸者之迹而已。言其霸，则齐桓、晋文为五霸之盛者。故其所载之文，则鲁史之文。而孔子自言之曰：其《春秋》之义，则丘私窃取之矣。盖《春秋》以义断之，则赏罚之意於是乎在，是天子之事也，故曰其义则丘窃取之矣。窃取之者，不敢显述也，故以赏罚之意寓之褒贬，而褒贬之意则寓於一言耳。○注云“乘为乘马之事，杌为へ凶之类”。○正义曰：乘马之事已详，故不再述。云“杌へ凶”者，案文公十八年《左传》所谓浑敦、穷奇、杌、饕餮四凶，其言“杌”，乃曰颛顼氏有不才子，不可教训，告之则顽，舍之则へ，天下之民，谓之“杌”。杜预云：“杌，へ凶无畴匹之貌也。”" }
      - { type: j, text: "孟子曰：“君子之泽，五世而斩。小人之泽，五世而斩。予未得为孔子徒也，予私淑诸人也。”（泽者，滋润之泽。大德大凶，流及後世，自高祖至玄孙，善恶之气乃断，故曰五世而斩。予，我也。我未得为孔子门徒也。淑，善也。我私善之於贤人耳，盖恨其不得学於大圣人也。）" }
      - { type: z, text: "“孟子”至“诸人也”。○正义曰：此章指言五世一体，上下通流，君子小人，斩各有时，企以高山，跌以陷污，是以君子恨不及乎仲尼也。孟子恨以不及仲尼也。“孟子曰：居子之泽”至“予私淑诸人也”者，孟子言君子小人虽有贤、不肖之异，然自礼服而推之，则馀泽之所及，但皆五世而断耳，以其亲属替之者焉。惟孔子有道德之泽，流於无穷，虽万世亦莫不尊亲者矣。孟子所言我未得为孔子徒党者矣，我但私有所善於己，未有善诸人人也。盖孟子学孔子者也，然必於此乃言予未得为孔子徒者，盖亦公孙丑问“夫子既圣矣乎”、则曰“夫圣孔子不居”之意也。孟子之志，又可知矣。斩，断也。淑，善也。○注云“自高祖至於玄孙”。○正义曰：自高祖至玄孙者，凡有九等，高祖、曾祖、祖父、己身、子、孙、曾孙、玄孙是也。今注乃以此证五世而斩者，据己身而推之，则上自高祖，至玄孙，是为无服者也。" }
      - { type: j, text: "孟子曰：“可以取，可以无取，取伤廉。可以与，可以无与，与伤惠。可以死，可以无死，死伤勇。”（三者，皆谓事可出入，不至违义，但伤此名，亦不陷於恶也。）" }
      - { type: z, text: "正义曰：此章指言廉、惠、勇，人之高行也，丧此三名，则士病诸，故设斯科以进能者也。“孟子曰”至“死伤勇”者，盖言凡於所取之道，可以取之则取之，故无伤害於为廉；可以无取而乃取之，是为伤害於廉也。又言凡所与之道，可以与之则与之，而不为伤其惠；可以无与而乃与之，是为伤害於惠也。又言凡於所死之道，可以死之则死，不为伤害其勇；可以无死而乃死之，是为伤害其勇也。如孟子受薛七十镒，是可以取则取之也；求也为聚敛而附益之，是可以无取而乃取之者也。孔子与愿思之粟，是可以与则与之者也；冉子与子华之粟五秉，是可以无与而乃与之者也。比干谏而死，是可以死则死也；荀息不能格君心之非，而终遽以死许，是可以无死而乃死之也。" }
      - { type: j, text: "逢蒙学射於羿，尽羿之道，思天下惟羿为愈己，於是杀羿。（羿，有穷后羿。逢蒙，羿之家众也。《春秋传》曰：“羿将归自田，家众杀之。”）孟子曰：“是亦羿有罪焉。”（罪羿不择人也，故以下事喻之）公明仪曰：“宜若无罪焉。”曰：“薄乎云尔，恶得无罪？郑人使子濯孺子侵卫，卫使庾公之斯追之。子濯孺子曰：‘今日我疾作，不可以执弓，吾死矣夫！’（孺子，郑大夫。庾公，卫大夫。疾作疟疾。）问其仆曰：‘追我者谁也？’其仆曰：‘庾公之斯也。’曰：‘吾生矣。’（仆，御也。孺子曰：吾必生矣。）其仆曰：‘庾公之斯，卫之善射者也。夫子曰吾生，何谓也？’曰：‘庾公之斯学射於尹公之他，尹公之他学射於我。夫尹公之他，端人也，其取友必端矣。’（端人，用心不邪辟。知我是其道本所出，必不害我也。）庾公之斯至，曰：‘夫子何为不执弓？’曰：‘今日我疾作，不可以执弓。’曰：‘小人学射於尹公之他，尹公之他学射於夫子，我不忍以夫子之道反害夫子。虽然，今日之事，君事也，我不敢废。’抽矢叩轮，去其金，发乘矢而後反。”（庾公之斯至，竟如孺子之所言。而曰：我不敢废君事，故叩轮去镞，使不害人，乃以射孺子，礼射四发而去。乘，四也。《诗》云：“四矢反兮。”孟子言是以明羿之罪，假使如子濯孺子之得尹公之他而教之，何由有逢蒙之祸乎。）" }
      - { type: z, text: "“逢蒙学射”至“乘矢而後反”。○正义曰：此章指言求交取友，必得其人，得善以全，养凶获患，是故子濯济难，夷羿以残，可以鉴也。“逢蒙学射于羿，尽羿之道，思天下惟后羿所射有强於己，於是反妒之，而杀其后羿。“孟子曰：是亦羿有罪焉”，孟子复言逢蒙所以杀其后羿，是后羿亦有可罪之道者焉。“公明仪曰：宜若无罪焉”，孟子引公明仪於往日尝曰逢蒙杀羿，宜若羿无罪而见杀焉，又鄙之公明仪之言，曰：薄乎此言尔，安得谓之无罪焉？昔郑国之君使子濯孺子为大夫，以侵伐其卫国。卫君乃使大夫庾公之斯追捉其子濯，子濯乃曰：今日我疟疾发作，不可以执弓而敌之，我必死矣。遂问其御仆曰：卫之追赶我者是谁也。其御仆乃告之曰：卫大夫庾公之斯者也。子濯即曰：我得生矣，不能死我也。其御仆乃问：庾公之斯是卫国之最善射者也，而夫子乃曰吾生矣，是何之谓也？子濯乃与之御仆曰：庾公之斯学射於尹公之他，尹公之他学射於我，夫尹公之他，端正之人也，其所友亦必端正之人然後教其射矣。庾公之斯遂追至子濯之所，见子濯不执弓矢，乃问曰：夫子何为不执弓以拒之。子濯告之曰：今日我疟疾发作，不可以执弓矣。庾公之斯乃自称己为小人，言小人学射於尹公之他，尹公之他学射於夫子，今不忍以夫子之道而反归害其夫子矣。虽然，不忍害夫子，奈以今日所追之事，乃君命之事也，我亦不敢废背其君命耳，遂不免抽取其矢，而敲之於车轮之上，乃去其镞利而发射子濯，至发其四矢，然後乃反归而不追之。盖去镞利，所以无害於子濯耳。云乘矢者，乘，四矢也，盖四马为一乘，是亦取其意也。○注“羿有穷”至“杀之”。○正义曰：羿有穷后羿者，说在《梁王》首篇详矣。云“逢蒙，羿之家众”至“杀之”者，案襄公四年《左传》云：“将归自田，家众杀而烹之，以食其子。子不忍食诸，死于穷门。”杜注云“子，羿之子也，不忍食，又杀之国门。”○注“孺子，郑大夫。庾公，卫大夫”。○正义曰：襄公十四年《左传》云：“尹公他学射於庾公差，庾公差学射於公孙丁。二子追卫献公，公孙丁御公。子曰：‘射为背师，不射为戮，射为礼乎？’射两钩而还。尹公他曰：‘子为师，我则远矣。’乃反之。公孙丁授公辔而射之，贯臂。”杜预曰：“子鱼，庾公差。”然则孟子之言，与此不同，是二说必有取一焉。" }
      - { type: j, text: "孟子曰：“西子蒙不洁，则人皆掩鼻而过之。（西子，古之好女西施也。蒙不洁，以不洁汗巾帽而蒙其头面。面虽好，以蒙不洁，人过之者皆自掩鼻，惧闻其臭也。）虽有恶人，斋戒沐浴，则可以祀上帝。（恶人，丑类者也。面虽丑而斋戒沐浴，自治洁净，可以待上帝之祀。言人当自治以仁义乃为善也。）" }
      - { type: z, text: "“孟子”至“上帝”。○正义曰：此章指言貌好行恶，西子蒙臭，丑人洁服，供事上帝，明当修饰，惟义为常也。孟子言西施之女，其貌虽好，然加之不洁巾帽而蒙其头，则人见之亦必遮掩鼻而过之，更不顾也；如恶人虽曰至丑，然能斋戒沐浴，自洁净其身，则亦可以供事上帝矣。孟子之意，盖人能修其己，虽神犹享，而况於人乎？然知人修治其己，不可以已也。○注“西子西施”。○正义曰：案《史记》云：西施，越之美女，越王勾践以献之，吴王夫差大幸之。每入市，人愿见者，先输金钱一文。是西施也。" }
      - { type: j, text: "孟子曰：“天下之言性也，则故而已矣。故者以利为本。（今天下之言性，则以故而已矣。以言其故者，以利为本耳。若杞柳为杯卷，非杞柳之性也。）所恶於智者，为其凿也。（恶人欲用智而妄穿凿，不顺物之性，而改道以养之。）如智者若禹之行水也，则无恶於智矣。禹之行水也，行其所无事也。（禹之用智，决江疏河，因水之性，因地之宜，引之就下，行其空虚无事之处。）如智者亦行其所无事，则智亦大矣。（如用智者，不妄改作，但循理，若禹之行水於无事，则为大智也。）天之高也，星辰之远也，苟求其故，千岁之日至可坐而致也。”（天虽高，星辰虽远，诚能推求其故常，千岁日至之日可坐而致也。星辰，日月之会。致，至也。知其日至在何日也。）" }
      - { type: z, text: "“孟子曰”至“可坐而致也”。○正义曰：此章指言能修性守故，天道可知，妄智改常，必与道乖，性命之指也。“孟子曰：天下之言性也，则故而已矣。故者以利为本”至“可坐而致也”者，孟子言今夫天下之人有言其性也者，非性之谓也，则事而已矣。盖故者事也，如所谓故旧无大故之故同意。以其人生之初，万理已具於性矣，但由性而行，本乎自然，固不待於有为则可也，是则为性矣。今天下之人，皆以待於有为为性，是行其性也，非本乎自然而为性者耳，是则为事矣。事者必以利为本，是人所行事必择其利然後行之矣，是谓“故者以利为本”矣。我之所以有恶於智者，非谓其智也，为其不本性之自然之为智，但穿凿逆其自然之性而为智者矣，故曰“所恶於智者，为其凿也”。孟子言此，又恐後人因是遂以为故与智为不美，所以复为明言之，故言如为智者，若禹之治水，则我无恶於为智矣。以其大禹之治行其水也，但因水自然之性引而通之，是行其所无事者也，非逆其水性而行之也。若今之人为智，但因性之自然而为智，是亦行其无事耳，而其为智亦大智者矣。此孟子於此以为智之美，又非所谓恶之者也。且天之最高者也，星辰最远者也，然而诚能但推求其故常，虽千岁之後，其日至之日，亦可坐而计之也。孟子於此以故为美，所以又执是而言之耳，以其恐人不知已前所谓则故而已矣为事之故，遂引天与星辰而言故常之故，於此为美也。谓人之言性者，但本乎故常自然之性而为性，不以妄自穿凿改作，则身之修，亦若天与星辰之故常，而千岁日至之日，但可坐而致也：此所以明其前所谓故为事故之故，终於此云故乃故常之故，盖故义亦训常，所谓必循其故之故同。○注“以杞柳为杯卷”。○正义曰：经之《告子》篇文也。○注“星辰，日月之会”。○案孔安国《尚书传》云：“星辰，日月所会也。”《书》云“辰弗集于房”是也。" }
      - { type: j, text: "公行子有子之丧。右师往吊，入门，有进而与右师言者，有就右师之位而与右师言者。（公行子，齐大夫也。右师，齐之贵臣王，字子敖者。公行之丧，齐卿大夫以君命会，各有位次，故下云朝廷也。与言者，皆谄於贵人也。）孟子不与右师言，右师不悦，曰：“诸君子皆与言，孟子独不与言，是简也。”（右师谓孟子简其无德，故不与言，是以不悦也。）孟子闻之曰：“礼，朝廷不历位而相与言，不逾阶而相揖也。我欲行礼，子敖以我为简，不亦异乎”（孟子闻子敖之言，曰：我欲行礼，故不历位而言，反以我为简异也。云以礼者，心恶子敖，而外顺其辞也。）" }
      - { type: z, text: "“公行子”至“不亦异乎”。○正义曰：此章指言循理而动，不合时人，阿意事贵，胁肩所尊，俗之情也。是以万物皆流，而金石独止。“公行子有子之丧。右师往吊，人门，有进而与右师言者，有就右师之位而与右师言”者，公行子，齐国之大夫，丧其子，故有子之丧。王字子敖者，公行子家而吊慰，入公行之门，其间有进揖而与右师王言者，又有就右师王之位所而与言者。“孟子不与右师言”至“不亦异乎”者，言孟子独不与右师言。右师见孟子不与之言，乃不说而有愤愤之色，曰：诸君子之众贤皆与我言，独孟子不与我言，是孟子简略不礼於我也。孟子闻王此言，乃告之曰：不与右师言者，乃是礼然也，於礼，则朝廷之间不历位所而相与言，又不逾越阶而相揖，我欲行其溃故如是不与之言也。子敖今以我为简略而为不礼，是其言不亦乖异於礼乎。○注“右师，齐之贵臣”。○正义曰：古者天子之卿，尊者谓之大师，卑者谓之少师。诸侯之卿，尊者谓之左师，卑者谓之右师故也。" }
      - { type: j, text: "孟子曰：“君子所以异於人者，以其存心也。君子以仁存心，以礼存心。仁者爱人，有礼者敬人。爱人者，人常爱之。敬人者，人常敬之（存，在也。君子之在心者，仁与礼也。爱敬施行於人，人亦必反报之於已也。）有人於此，其待我以横逆，则君子必自反也：‘我必不仁也，必无礼也，此物奚宜至哉。’（横逆者，以暴虐之道来加我也。君子反自思省，谓己仁、礼不至也，物，事也，推此人何为以此事来加於我也。）其自反而仁矣，自反而有礼矣，其横逆由是也，君子必自反也：‘我必不忠。’（君子自谓我必不忠。）自反而忠矣，其横逆由是也，君子曰：‘此亦妄人也已矣。如此，则与禽兽奚择哉？於禽兽又何难焉？’（妄人，妄作之人。无知者与禽兽何择异也？无异於禽兽，又何足难矣？）是故君子有终身之忧，无一朝之患也。乃若所忧则有之：舜，人也；我，亦人也。舜为法於天下，可传於後世，我由未免为乡人也，是则可忧也。（君子之忧，忧不如尧舜也。）忧之如何？如舜而已矣。（忧之当如何乎？如舜而後可，故终身忧也。）若夫君子所患则亡矣，非仁无为也，非礼无行也。如有一朝之患，则君子不患矣。”（君子之行，本自不致患，常行仁礼，如有一朝横来之患，非己愆也。故君子归天，不以为患也。）" }
      - { type: z, text: "“孟子曰”至“君子不患矣”。○正义曰：此章指言君子责己，小人不改，比之禽兽，不足难矣，蹈仁行礼，不患其患，惟不若舜，可能忧也。“孟子曰：君子所以异於人者”至“人常敬之”者，孟子言君子之人所以有别於众人者，以其存心与众人别也，君子之人，常以仁道存乎心，又以礼存乎心。以仁存乎心者，是爱人者也；有礼存乎心者，是敬人者也。爱人者，人亦常爱之；敬人者，人亦常敬之：盖人所以亦常爱敬之者，抑以施报自然之道也。“有人於此”至“又何难焉”，孟子又托言，今有人在此，其待我者，皆以横逆暴虐之道而待我，则为君子者，必自反责於已也，以其是我必不仁，又无礼也，此所以待我横逆，故曰“此物奚宜至哉”。言此人何为以此横逆加我哉？是必於我有不仁之心，有无礼之行，此人所以如是而加我矣。其自反而仁矣，自反而有礼矣，其横逆加我又由此者，君子之人，又必自反责其己，以为是我必有不忠之心矣。自反既以有忠，其横逆加我者又由此，君子之人乃曰：此人以横逆暴虐之道加我，是必妄人矣。如此为妄人矣，则与禽兽奚择有异哉？既为禽兽，於我又何足责难焉？此君子之人又自归己，而不谴彼之罪矣。“是故君子有终身之忧”至“君子不患矣”者，孟子言如此，是故君子有终身之忧虑，而无一朝之患难。乃若君子有所忧虑，是亦不为无焉，然而有忧者，但忧虑而为舜帝亦一人也，我亦一人也，舜帝既为法於天下，可传之於後世，以为人所取则，而我犹尚未免为乡俗之人，此则君子可忧也。既以忧之，是如之何忧？言忧但慕如舜为法、可传於後世而止矣。然则君子其於有所患则无矣，非仁之事，既以无为，非礼之事，既以不行，然而如有一朝之患，则君子亦不为之患矣。无他，以其非己之有愆过而招之也。其所以有患者，亦彼之患，不足为我之患也。前所谓横逆待我，是必妄人也，己於禽兽又何足难焉，正此之谓也。孟子言之，是亦欲人以仁、礼存心，其有横逆加己，又当反己，故无患及耳。" }
      - { type: j, text: "禹、稷当平世，三过其门而不入。孔子贤之。颜子当乱世，居於陋巷，一箪食，一瓢饮，人不堪其忧，颜子不改其乐。孔子贤之。孟子曰：“禹、稷、颜回同道。禹思天下有溺者，由己溺之也；稷思天下有饥者，由己饥之也：是以如是其急也。禹、稷、颜子，易地则皆然。（当平世，三过其门者，身为公卿，忧民者也；当乱世，安陋巷者，不用於世，穷而乐道者也：孟子以为忧民之道同，用与不用之宜若是也，故孔子俱贤之。禹、稷急民之难若是，颜子与之易地，其心皆然。不在其位，故劳佚异。）今有同室之人斗者，救之，虽被发缨冠而救之可也。乡邻有斗者，被发缨冠而往救之，则惑也，虽闭户可也。”（缨冠者，以冠缨贯头也。乡邻，同乡也。同室相救，是其理也，喻禹、稷。走赴乡邻，非其事，颜子所以闭户而高枕也。）" }
      - { type: z, text: "“禹、稷当平世”至“可也”。○正义曰：此章指言上贤之士，得圣一概，颜子之心，有同禹、稷，时行则行，时止则止，失期节则惑矣。“禹、稷当平世”至“易地则皆然”者，孟子言大禹与后稷皆当平治之世，急於为民，三过家门而不入其室，孔子皆助为贤，故尊贤之；颜渊当危乱之世，不得其用，居处於隘陋之巷，但以一箪盛其食、一瓢盛其饮而饮、食之，时人皆不堪忍此之忧，颜渊独乐於道而不改此忧，孔子亦以为贤。孟子乃至於此，乃自曰：禹、稷、颜回三人，其道则同耳。以其大禹於是时思念天下有因洪水而沉溺也，后稷於是时思念天下有因水土未平而被饥饿之者，亦如已被其饥饿也，是以三过家门而不入其室，而为民如是之急也。禹、稷与颜子更易其地，则皆能如是。谓颜子在禹、稷之世，亦能如禹、稷如是为民之急；禹、稷在颜子之世，亦能不改其乐：是则为同道者也。若其有异，但时之一平一乱矣。“今有同室之人”至“可也”者，孟子又以此言比喻之，谓禹、稷为民如是之急，若今有同室之人有斗争之者，救劝之者虽被发而缨冠於头而救劝之可也，无它，以其人情於同居，是为亲者也，如有争斗而不救劝之，是疏其亲也；禹、稷当平世，既达而在上，亦急於为民也，如不急於民，是在上位而不恤民者也。孟子固以同室之人救斗为喻。颜子在陋巷而不改其乐，若今有同乡之人有争斗者，如被散其发而缨冠於头而救劝之，则为惑者矣，虽闭户而勿救之可也，无它，以其乡邻於己为疏，非亲也，如往救之，是亲其疏矣；颜子当危乱之世，既穷而不得用，亦宜处陋巷而不改其乐耳，如改其乐，是媚於世而非贤者也。孟子故以乡邻之人不救为喻。由此推之，则孟子为禹、稷、颜回同道，是其不诬於後世也。孔子曰“贤哉！回也”。是孔子贤颜回之谓也；又曰“禹，吾无间然矣”。是孔子贤禹之谓也；南宫适曰“禹、稷躬稼而有天下”，子曰“君子哉若人，尚德哉若人”，以此观之，孔子美南宫适云及此二人者如此，是知孔子有贤於禹、稷也，抑亦是孔子贤稷之谓也。然而“三过其门”则主乎禹，今孟子则兼稷言之，何也？曰：孔子言躬稼，其亦主於稷而乃兼禹言之，以禹之治水，非暨稷之播殖则无以奏艰食，非得禹之平水土则无以为躬稼，是二者未常不相待为用耳。孔、孟交言之，是亦一道也。盖躬稼而有天下，虽出乎南宫适之言，然孔子美之者，亦孔子之言也，故云孔子言也。" }
      - { type: j, text: "公都子曰：“匡章通国皆称不孝焉。夫子与之游，又从而礼貌之，敢问何也？”（匡章齐人也，一国皆称不孝，问孟子何为与之游，又礼之以颜色喜悦之貌也？）孟子曰：“世俗所谓不孝者五：惰其四支，不顾父母之养，一不孝也；博弈好饮酒，不顾父母之养，二不孝也；好货财，私妻子，不顾父母之养，三不孝也；从耳目之欲，以为父母戮，四不孝也；好勇斗很，以危父母，五不孝也。章子有一於是乎？（惰懈不作，极耳目之欲以陷罪，戮及父母。凡此五者，人所谓不孝之行。章子岂有一事於此五不孝中也。）夫章子，子父责善而不相遇也。责善，朋友之道也。父子责善，贼恩之大者。（遇，得也。章子子父亲教，相责以善，不能相得，父逐之也。朋友切磋，乃当责善耳。父子相责以善，贼恩之大者也。）夫章子岂不欲有夫妻子母之属哉？为得罪於父，不得近，出妻屏子，终身不养焉。（夫章子岂不欲身有夫妻之配，子有子母之属哉？但以身得罪於父，不得近父，故出去其妻，屏远其子，终身不为妻子所养也。）其设心以为不若是，是则罪之大者。是则章子已矣。”（章子张设其心，执持此屏妻子之意，以为得罪於父，而不若是以自责罚，是则罪益大矣。是章子之行已矣，何为不可与言。）" }
      - { type: z, text: "“公都子曰”至“则章子而已矣”。○正义曰：此章指言匡章得罪，出妻屏子，上不得养，下以责己，众曰不孝，其实则否，是以孟子以为礼貌之也。“公都子曰：匡章通国皆称不孝焉”至“敢问何也”者，公都子谓孟子曰：匡章子，遍国人皆称为不孝者焉，夫子乃与之游，又从而敬悦之，敢问夫子是如之何？“孟子曰：世俗所谓不孝者五”至“於是乎”，孟子答公都子曰：世俗之人所谓为不孝之行有五，怠惰其四支，不作事业，而不顾父母之所养，为一不孝也；博弈好饮酒，而不顾父母之所养，为三不孝也；好货财，私爱妻子，而不顾父母之所养，为三不孝也；纵其耳目之所欲，陷於其罪，以辱及父母，是四不孝也；好勇暴，好争斗，好顽很，以惊危父母，是五不孝也。章子岂有一事於此五不孝乎。“夫章子，子父责善而不相遇也。责善，朋友之道也，父子责善，贼恩之大者”，孟子言章子但失於父子责善不相遇也。不遇者，是不相得也。其所以相责於善，乃朋友切磋琢磨之道也。如父子相责善，是贼害其父子之恩大者矣。“夫章子岂不欲有夫妻子母之属哉”至“是则章子而已矣”，孟子又言夫章子与父子不相遇而离之，岂以章子不欲有夫妻子母之为亲属哉？为其得罪於父，不得近焉，故用出去其妻，屏逐其子，终身不为妻子所养也。其章子如或开设於心为不若是，离之父，故出妻屏子，是陷父於不义之罪者矣，是则罪之莫大者矣。是则章子之行，以此而已，我何可绝而不与之邪？以此论之，则章子之过，过於厚者矣，宜孟子与之游，又从而礼貌之也。盖谓不顾父母之养者，是有逆於父母，而不顺父母之意耳。《孝经》云：“父有争，子则身不陷於不义。”礼云：“与其得罪於州闾乡党，宁熟谏。”然则父有不义，虽熟谏以争之可也，又安可以朋友责善施於父子之间哉。故章子所以离之，遂用出妻屏子，为其父有不义而不可言耳。" }
      - { type: j, text: "曾子居武城，有越寇。或曰：“寇至，盍去诸？”（盍，何不也。曾子居武城，有越寇将来，人曰寇方至，何不去之？）曰：“无寓人於我室，毁伤其薪木。”寇退，则曰：“我墙屋，我将反。”（寓，寄也。曾子欲去，戒其守人曰：无寄人於我室，恐其伤我薪草树木也。寇退，则曰：治墙屋之坏者，我将来反。）寇退，曾子反。左右曰：“待先生如此其忠且敬也，寇职则先去以为民望，寇退则反，殆於不可。”（左右相与非议曾子者，言武城邑大夫敬曾子，武城人为曾子忠谋，劝使避寇，君臣忠敬如此，而先生寇至则先去，使百姓瞻望而效之，寇退安宁则复来还，殆不可如是。怪曾子何以行之也。）沈犹行曰：“是非汝所知也。昔沈犹有负刍之祸，从先生者七十人，未有与焉。”（沈犹行，曾子弟子也。行谓左右之人曰：先生之行，非汝所能知也。先生，曾子也。往者先生尝从门徒七十人，舍吾沈犹氏，时有作乱者曰负刍，来攻沈犹氏，先生率弟子去之，不与其难。言宾师不与臣同耳。）子思居於卫，有齐寇。或曰：“寇至，盍去诸？”子思曰：“如去，君谁与守？”（，子思名也。子思欲助卫君赴难。）孟子曰：“曾子、子思同道。曾子，师也，父兄也。子思，臣也，微也。曾子、子思易地则皆然。”（孟子以为二人同道。曾子为武城人作师，则其父兄，故去留无毁。子思，微少也，又为臣，委质为臣当死难，故不去也。子思与曾子，易地皆然。）" }
      - { type: z, text: "“曾子居武城”至“易地则皆然”。○正义曰：此章指言臣当营君，师在余裕，二人处义，非殊者也。是故孟子纪之，谓得其同。“曾子居武城，有越寇”至“或曰：寇至，盍去诸”者，孟子言曾子尝居於武城之邑，有南越寇贼兴，或人告之曰：寇贼来，何不去之？“曰：无寓人於我室，毁伤其薪木。寇退，则曰：修我墙屋，我将反”者，言曾子欲去，乃戒其所守之人，曰：无寓人於我此室，而毁伤我薪木。寇贼既退，则曰：修我墙屋，我将反居此。“寇退，曾子反，左右曰：待先生如此其忠且敬也”至“殆於不可”者，言寇贼已退，曾子於是乎反居此也，左右之大夫皆曰：待先生如此其忠而不敢慢也，寇贼至则先去，以使民瞻望而效之。寇退平静，则反其居，殆不可如是也。“沈犹行曰”至“未有与焉”者，言沈犹行答左右之人，曰：先生之去，非汝所能知者也，往日沈犹有寇贼，自负其刍草来攻我室，随从先生者有七十人，言曾子率弟子而去之，故未有与及此难也，故得免其祸焉。先生，曾子也。“子思居於卫，有齐寇”至“君谁与守”者，孟子又言子思居於卫邑，有齐国之寇贼兴，或人告之曰：寇贼来，何不去之。子思乃自称名，答或人曰：如使见其寇贼至则去之，卫君则谁与为守护。，子思名也。“孟子曰，曾子、子思同道”至“易地则皆然”，孟子引至於此，乃曰：曾子、子思二人其道则同也。以其曾子居於武城，则师之道也，如人之父兄也，则去留人不可毁，无它，其以无所拘也；子思居於卫，则臣之道也，其势则微小也，当赴君之难，不可去也，无它，以其有所拘也。虽然，二人如更易其地，则皆能如是也。谓子思居於曾子之所而为之师，亦未必不能如曾子去留无所拘也，曾子居於子思之所而为之臣，亦未必不能如子思赴君之难而不去也。故曰“曾子、子思同道”。案《史记·弟子传》：“曾子名参，字子舆，武城人。少孔子四十六岁，孔子以为能通孝道，故授之业，作《孝经》，死於鲁国。”○注“，子思名也”。○正义曰：案《世家》云：“子思名，字子思，伯鱼之子，孔子之孙也。六十二，尝困於宋。子思作《中庸》，没於卫。”" }
      - { type: j, text: "储子曰：“王使人间夫子，果有以异於人乎？”（储子，齐人也。间，视也。果，能也。谓孟子曰：王言贤者身貌必当有异，故使人视夫子能有异於众人之容乎？）孟子曰：“何以异於人哉！尧舜与人同耳。”（人生同受法於天地之形，我当何以异於人哉？且尧舜之貌与凡人同耳。其所以异，乃以仁义之道，在於内也。）" }
      - { type: z, text: "“储子”至“同耳”。○正义曰：此章指言人以道殊，贤愚体别，头员足方，善恶如一。储子之言，齐王之不达也。储子谓孟子曰：齐王使人视夫子能有以异别於众人乎？以其齐王必谓孟子之贤，貌状须有异於人也。孟子答之曰：我何以有别异於众人哉？虽尧舜之盛帝亦与人同其貌状耳。但其所以有异於众人者，特以仁义之道与人异耳。孟子言此，则知齐王是为不达者也。盖古之人善观人者，不索人於形骸之外，而索之於形骸之内。今齐王乃索孟子於形骸之外，宜其过也。○注“储子，齐人也”。○正义曰：盖亦因经而为言之也，故孟子仕於齐，今此乃曰王使人来者，是知为齐人。" }
      - { type: j, text: "齐人有一妻一妾而处室者。其良人出，则必餍酒肉而後反。其妻问所与饮食者，则尽富贵也。（良人，夫也。尽富贵者，夫诈言其姓名也。）其妻告其妾曰：“良人出，则必餍酒肉而後反，问其与饮食者，尽富贵也，而未尝有显者来。吾将间良人之所之也。”（妻疑其诈，故欲视其所之。）蚤起，施从良人之所之，遍国中无与立谈者。卒之东郭番间之祭者，乞其馀；不足，又顾而之他。此其为餍足之道也。（施者，邪施而行，不欲使良人觉也。番间，郭外冢间也。乞其祭者所馀酒肉也。）其妻归告其妾曰：“良人者，所仰望而终身也。今若此！”与其妾讪其良人，而相泣於中庭。（妻妾於中庭悲伤其良人，相对涕泣而谤毁之。）而良人未之知也，施施从外来，骄其妻妾。（施施犹扁扁喜悦之貌。以为妻妾不知，如故骄之也。）由君子观之，则人之所以求富贵利达者，其妻妾不羞也而不相泣者，几希矣。（由，用也。用君子之道观之，今求富贵者，皆以枉曲之道，昏夜乞哀而求之，以骄人於白日。此良人为妻妾所羞而泣伤也。几希者，言今苟求富贵，妻妾虽不羞泣者，与此良人妻妾何异也。）" }
      - { type: z, text: "“齐人”至“几希矣”。○正义曰：此章指言小人苟得，谓不见知，君子观之，与正道乖。妻妾犹羞，况于国人。著以为戒，耻之甚焉。“齐人有一妻一妾”至“几希矣”者，孟子托此以讥时人苟贪富贵而骄人者也，言齐国中人有一妻一妾者，而居处於室，其良人出外，则必餍饱酒肉而後归，其妻问所与饮食酒肉者，良人则尽以为富贵者与之也。其妻遂告其妾曰：良人出门则必餍饱酒肉而後归，问其所与者，良人皆以为富贵者与之也，而未尝见有富贵显达者来家中，我将视其良人所往。妻疑之，故欲视其所往也。明日蚤起，乃邪施其身，微从良人之所往，遍尽一国之中，无有与良人立谈话者，终往齐国东郭之处，有冢间之祭者，良人乃就乞其馀祭之酒肉，不饱餍，又顾视而求之於他人，以此遂为餍足之道。其妻乃先归告其妾，曰：良人者，所仰望而终身者也，今乃若此而乞之祭者为餍足。遂与其妾共讪良人，而相对涕泣於中庭之间，而良人未之知其妻妾非讪其已，又施施然喜悦从外来，归复骄泰其妻妾。孟子引至此，乃曰：由此齐人观之，则今之人所以谄求富贵利达者，其妻与妾而不羞耻不相对涕泣於中庭者几希矣。言其少也，皆若此齐人耳。盖孟子之言，每每及此者，所以救时之弊，不得不如已矣。" }
