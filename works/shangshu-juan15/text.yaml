# 尚書正義卷十五（孔穎達疏）：j 為經文＋孔安國注，z 為正義疏文。
sections:
  - id: juan15
    name: 卷十五
    blocks:
      - { type: j, text: "召公既相宅，周公往營成周，使來告卜，召公先相宅卜之，周公自後至，經營作之，遣使以所卜吉兆逆告成王。○相，息亮反，注及下同。使，所吏反，注“遣使”同。作《洛誥》。" }
      - { type: j, text: "洛誥既成洛邑，將致政成王，告以居洛之義。" }
      - { type: z, text: "“召公”至“洛誥”○正義曰：序自上下相顧為文，上篇序雲“召公先相宅”，此承其下，故云“召公既相宅”。召公以三月戊申相宅而卜，周公自後而往，以乙卯日至，經營成周之邑。周公即遣使人來告成王以召公所卜之吉兆。及周公將欲歸於成王，乃陳本營洛邑之事，以告成王。王因請教誨之言，周公與王更相報答。史敘其事，作《洛誥》。史錄此篇，錄周公與王相對之言，以為後法，非獨相宅告卜而已。但周公因致政本說往前告卜，經文既具，故序略其事，直舉其發言之端耳。○傳“召公”至“成王”○正義曰：上篇雲：“三月戊申，太保朝至於洛，卜宅。厥既得卜，則經營。”是召公先相宅則卜之。又云：“乙卯，周公朝至於洛，則達觀於新邑營。”是周公自後至，經營作之。召公相洛邑，亦相成周，周公營成周，亦營洛邑，各舉其一，互以相明。“卜”者，召公卜也。周公既至洛邑，案行所營之處，遣使以所卜吉兆逆告成王也。案上篇傳雲“王與周公俱至”，何得周公至洛逆告王者？王與周公雖相與俱行，欲至洛之時，必周公先到行處所，故得逆告也。顧氏雲“周公既至洛邑，乃遣以所卜吉兆來告於王”是也。經稱成王言：“公既定宅，伻來，來視予卜休恆吉。”是以得吉兆告成王也。上篇召公以戊申至，周公乙卯至，周公在召公後七日也。至洛較七日，其發鎬京或亦較七日。○傳“既成”至“之義”○正義曰：周公攝政七年三月經營洛邑，既成洛邑，又歸向西都，其年冬將致政成王，告以居洛之義，故名之曰《洛誥》，言以居洛之事告王也。篇末乃雲“戊辰，王在新邑”，明戊辰已上皆是西都時所誥也。" }
      - { type: j, text: "周公拜手稽首曰：“朕復子明辟。”周公盡禮致敬，言我復還明君之政於子。子，成王。年二十成人，故必歸政而退老。○闢，必亦反。王如弗敢及天基命定命，如，往也。言王往日幼少，不敢及知天始命周家安定天下之命，故己攝。予乃胤保，大相東土，其基作民明闢。我乃繼文武安天下之道，大相洛邑，其始為民明君之治。" }
      - { type: z, text: "“周公”至“民明闢”○正義曰：周公將反歸政，陳成王將居其位，周公拜手稽首，盡禮致敬於王，既拜乃興而言曰，我今復還子明君之政。言王往日幼少，其志意未成，不敢及知天之始命我周家安定天下之命，故我攝王之位，代王為治。我乃繼文王、武王安定天下之道，以此故大視東土洛邑之居，其始欲王居之，為民明君之治。言欲為民明君，必當治土中，故為王營洛邑也。○傳“周公”至“退老”○正義曰：周公還政而已，明暗在於人君，而云“復還明君之政”者，其意欲令王明，故稱“復子明辟”也。正以此年還政者，以成王年已二十成人，故必歸政而退老也。傳說成王之年，惟此而已。王肅於《金縢》篇末雲：“武王年九十三而已，冬十一月崩。其明年稱元年，周公攝政，遭流言，作《大誥》而東征。二年克殷，殺管叔。三年歸，制禮作樂，出入四年，六年而成。七年營洛邑，作《康誥》、《召誥》、《洛誥》，致政成王。然則武王崩時，成王年已十三矣。周公攝政七年，成王適滿二十。”孔於此言成王年二十，則其義如王肅也。又《家語》雲：“武王崩時，成王年十三。”是孔之所據也。○傳“如往”至“己攝”○正義曰：“如，往”，《釋詁》文。“及”訓與也，言王往日幼少，志意未成，不敢與知上天始命我周家安定天下之命，故己攝也。天命周家安定天下者，必令天下太平，乃為安定。成王幼少，未能使之安定，故不敢與知之，周公所以攝也。○傳“我乃”至“之治”○正義曰：“胤”訓繼也，文王受命，武王伐紂，意在安定天下。天下未得安定，故周公言我乃繼續文武安定天下之道，大相洛邑之地，其處可行教化，始營此都，為民明君之政治。言欲為民明君，其意當在此。" }
      - { type: j, text: "予惟乙卯，朝至於洛師。致政在冬，本其春來至洛眾，說始卜定都之意。我卜河朔黎水，我乃卜澗水東、瀍水西，惟洛食。我使人卜河北黎水上，不吉。又卜澗瀍之間，南近洛，吉。今河南城也。卜必先墨畫龜，然後灼之，兆順食墨。○河朔，朔北也。瀍，直連反。近，附近之近。我又卜瀍水東，亦惟洛食。伻來以圖及獻卜。”今洛陽也。將定下都，遷殷頑民，故並卜之。遣使以所卜地圖及獻所卜吉兆，來告成王。○伻，普耕反，徐敷耕反，又甫耕反，下同。" }
      - { type: z, text: "“予惟”至“獻卜”○正義曰：周公追述立東都之事，我惟以七年三月乙卯之日，朝至於洛邑眾作之處，經營此都。其未往之前，我使人卜河北黎水之上，不得吉兆。乃卜澗水東、瀍水西，惟近洛，而其兆得吉，依規食墨。我亦使人卜瀍水東，亦惟近洛，其兆亦吉，依規食墨。我以乙卯至洛，我即使人來以所卜地圖及獻所卜吉兆於王。言卜吉立此都，王宜居之為治也。○傳“致政”至“之意”○正義曰：下文總結周公攝政之事雲“在十有二月”，是“致政在冬”也。“在冬”，發言嫌此事是冬，故辨之雲“本其春來至洛眾”，追說始卜定都之意也。周公至洛之時，庶殷已集於洛邑，故云“至於洛師”。○傳“我使”至“食墨”○正義曰：嫌周公自卜，故云“我使人”，謂使召公也。案上篇召公至洛，其日即卜，而得“卜河朔黎水”者，以地合龜，非就地內，此言所卜三處皆一時事也。“黎水”之下不言吉凶者，“我乃”是改卜之辭，明其不吉乃改，故知“卜河北黎水之上，不吉”也。武王定鼎於郟鄏，已有遷都之意，而先卜黎水上者，以帝王所都，不常厥邑，夏殷皆在河北，所以博求吉地，故令先卜河北，不吉乃卜河南也。其“卜澗瀍之間，南近洛，吉。今河南城也”，基趾仍在，可驗而知。所卜黎水之上，其處不可知矣。凡卜之者，必先以墨畫龜，要坼依此墨，然後灼之求其兆，順食此墨畫之處，故云“惟洛食。”顏氏雲：“先卜河北黎水者，近於紂都，為其懷土重遷，故先卜近以悅之。”用鄭康成之說，義或然也。○傳“今洛”至“成王”○正義曰：洛陽即成周，敬王自王城遷而都之。《春秋》昭三十二年“城成周”是也。周公慮此頑民未從周化，故既營洛邑，將定下都，以遷殷之頑民，故命召公即並卜之。周公既至，即遣使以所卜地圖及獻所卜吉兆，來告於成王。言己重其事，並獻卜兆者，使王觀兆知其審吉也。" }
      - { type: j, text: "王拜手稽首曰：“公不敢不敬天之休，來相宅，其作周匹休。成王尊敬周公，答其拜手稽首而受其言。述而美之，言公不敢不敬天之美，來相宅，其作周以配天之美。公既定宅，伻來，來視予卜休恆吉。我二人共貞。言公前已定宅，遣使來，來視我以所卜之美、常吉之居，我與公共正其美。○貞，正也，馬雲：“當也。”公其以予萬億年敬天之休。”公其當用我萬億年敬天之美。十千為萬，十萬為億，言久遠。拜手稽首誨言。成王盡禮致敬於周公，求教誨之言。○盡，子忍反。" }
      - { type: z, text: "“王拜手”至“誨言”○正義曰：成王尊敬周公，故亦盡禮致敬，拜手稽首，乃受公之語，述公之美曰：“不敢不敬天之美，來至洛相宅，其意欲作周家配天之美故也。公既定洛邑，即使人來告，亦來視我以所卜之美、常吉之居，我當與公二人共正其美。公定其宅，其當用我萬億年敬天之美故也。”王既言此，又拜手稽首於周公，求教誨之言。○傳“成王”至“之美”○正義曰：拜手稽首，施於極敬。哀十七年《左傳》雲：“非天子，寡君無所稽首。”諸侯小事大尚不稽首，況於臣乎？成王尊敬周公，答言其拜手稽首而受其言。又述而美之，天命文武使王天下，是天之美事，言公不敢不敬天之美，來相洛邑之宅。○傳“言公”至“其美”○正義曰：周公追述往前遣使獻卜，故成王複述公言。言公前已定宅，遣使來，來視我所卜之吉兆、常吉之居。自言前已知其卜，既有此美，我當與公二人共正其美意。欲留公輔己，共公正此美事。“來來”重文者，上“來”言使來，下“來”為視我卜也。鄭雲：“伻來來者，使二人也。”與孔意異。○傳“公其”至“久遠”○正義曰：言居洛為治，可以永久，公意其當用我使萬億年敬天之美，言公欲令己祚胤久遠，美公意之深也。《王制》雲：“方百里者，為方十里者百，為田九十億畝。”方里者萬，則是為田九百萬畝。今《記》乃雲“九十億畝”，是名十萬為億也。《楚語》雲“百姓、千品、萬官、億醜”，每數相十，是古十萬曰億。今之算術乃萬萬為億也。○傳“成王”至“之言”○正義曰：此一段史官所錄，非王言也。王求教誨之言，必有求教誨之辭，史略取其意，故直雲“誨言”。為求誨言而拜，故言“成王盡禮致敬於周公，求教誨之言”也。" }
      - { type: j, text: "周公曰：“王肇稱殷禮，祀於新邑，鹹秩無文。言王當始舉殷家祭祀，以禮典祀於新邑，皆次秩不在禮文者而祀之。予齊百工，伻從王於周。予惟曰：‘庶有事。’我整齊百官，使從王於周，行其禮典。我惟曰：‘庶幾有善政事。’今王即命曰：‘記功，宗以功，作元祀。’今王就行王命於洛邑，曰：“當記人之功，尊人亦當用功大小為序，有大功則列大祀。”謂功施於民者。○曰記，上音越，一音人實反。惟命曰：‘汝受命篤，弼丕視功載，乃汝其悉自教工。’惟天命我周邦，汝受天命厚矣，當輔大天命，視群臣有功者記載之，乃汝新即政，其當儘自教眾官，躬化之。孺子其朋，孺子其朋，其往。少子慎其朋黨，少子慎朋黨，戒其自今已往。無若火始焰焰，厥攸灼敘，弗其絕。言朋黨敗俗，所宜禁絕。無令若火始然，焰焰尚微，其所及，灼然有次序，不其絕。事從微至著，防之宜以初。○焰音豔。“敘”絕句，馬讀“敘”句字屬下。令，力呈反。厥若彝，及撫事如予，惟以在周工。其順常道，及撫國事，如我所為，惟用在周之百官。往新邑，伻鄉即有僚，明作有功，惇大成裕，汝永有辭。”往行政化於新邑，當使臣下各鄉就有官，明為有功，厚大成寬裕之德，則汝長有歎譽之辭於後世。○向，許亮反，注同。惇，都混反。" }
      - { type: z, text: "“周公”至“有辭”○正義曰：王求教誨之言，公乃誨之。周公曰：“王居此洛邑，當始舉殷家祭祀以為禮典，祀於洛之新邑，皆次秩在禮無文法應祀者，亦次秩而祀之。我雖致政，為王整齊百官，使從王於周，行其禮典。若能如此，我惟曰：‘庶幾有善政事。’今王就行王命於洛邑，曰：‘王當記人之功，尊人亦當用功大小為次序，有大功者則列為大祀。’”又申述所以祀神記臣功者。“政事由臣而立，惟天命我周邦之故，曰：‘汝受天命厚矣，當輔大天命，故須視群臣有功者記載之。君知臣功，則臣皆盡力。欲令群臣盡力，宜於初即教之。乃汝新始即政，其當儘自教誨眾官。’”令王躬自化之，使之立功。又以朋黨害政，尤宜禁絕，故丁寧戒之：“少子慎其朋黨，少子慎其朋黨，戒其自今已往。”令常慎此朋黨之事。“若欲絕止，禁其未犯，無令若火始然。焰焰尚微，火既然焰，其火所及，將灼然有次序矣，不其復可絕也。汝成王其當順此常道，及撫循國事，如我攝政所為。惟當用我此事，在周之百官則當畏服，各立功矣。汝當以此往行政化於新邑，當使臣下百官各向就有官，明為有功，厚大成寬裕之德，則汝長有歎譽之辭於後世”。此周公誨王之言也。○傳“言王”至“祀之”正義曰：於時制禮已訖，而云“殷禮”者，此“殷禮”即周公所制禮也。雖有損益，以其從殷而來，故稱“殷禮”。猶上篇雲“庶殷”，“本其所由來”，孔於上傳已具，故於此不言。必知殷禮即周禮者，以此雲“祀於新邑”，即下文“烝祭歲”也，既用“騂牛”，明用周禮。雲“始”者，謂於新邑始為此祭。顧氏雲：“舉行殷家舊祭祀，用周之常法。”言周禮即殷家之舊禮也。鄭玄雲：“王者未制禮樂，恆用先王之禮樂。”是言伐紂以來，皆用殷之禮樂，非始成王用之也。周公制禮樂既成，不使成王即用周禮，仍令用殷禮者，欲待明年即取，告神受職，然後班行周禮。班訖始得用周禮，故告神且印用殷禮也。孔義或然，故復存之。神數多而禮文少，應祭之神名有不在禮文者，故令皆次秩不在禮文而應祀者，皆舉而祀之。○傳“我整”至“政事”○正義曰：時成王未有留公之意，公以成王初始即政，自慮百官不齊，故雖即致政，猶欲整齊百官，使從王於周，謂從至新邑，行其典禮。周公以成王賢君，今復成長，故言“我惟曰：‘庶幾有善政事。’”言己私為此言，冀王為政善也。○傳“今王”至“民者”○正義曰：記臣功者是人主之事，故言“今王就行王命於洛邑”，謂正位為王，臨察臣下，知其有功以否。恐王輕忽此事，故曰“當記人之功”。更言“曰”者，所以致殷勤也。尊人必當用功大小為次序，令功大者居上位，功小者處下位也。“有大功則列為大祀”，謂有殊功，堪載祀典者。《祭法》雲：“聖王之制祭祀也，法施於民則祀之，以死勤事則祀之，以勞定國則祀之，能御大災則祀之，能捍大患則祀之。”是為大祀“謂功施於民”者也。或時立其祀配享廟廷，亦是也。○傳“惟天”至“化之”○正義曰：“惟天命我周邦”，謂天命我文武，故及汝成王復受天命為天子，是天之恩德深厚矣。天以厚德被汝，汝當輔大天命，任賢使能，行合天意，是輔大天也。汝當輔大天命，故宜視群臣有功者記載之，覆上“記功，宗以功”言之也。欲令群臣有功，必須躬自教化之在於初始，故言“乃汝新即政，其當儘自教眾官”。欲令王“躬化之”者，正己之身，使群臣法之，非謂以辭化之也。言“儘自教”者，政有大小，恐王輕大略小，令王儘自親化之。言“惟命曰”，亦是致殷勤。“乃”者，緩辭也。義異上句，故言“乃”耳。王肅雲：“此其儘自教百官，謂正身以先之。”○傳“少子”至“已往”○正義曰：鄭雲：“孺子，幼少之稱，謂成王也。”此上皆雲成王，此句特言少子者，以明朋黨敗俗，為害尢大，恐年少所忽，故特言“孺子”也。“朋黨”謂臣相朋黨。“慎其朋黨”，令禁絕之。“戒其自今已往”，謂從即政以後，常以此事為戒也。○傳“言朋”至“以初”○正義曰：“無令若火始然”，以喻無令朋黨始發。若火既然，初雖焰焰尚微，其火所及，灼然有次序，不其復可絕也。以喻朋黨若起，漸漸益大，群黨既成，不可復禁止也。“事從微至著，防之宜以初”，謂朋黨未發之前，防之使不發。○傳“其順”至“百官”○正義曰：考古依法，為“順常道”。號令治民，為“撫國事”。周公大聖，動成軌則，“如我所為”，謂如攝政之時事所施為也。惟當用我所為在周之百官，令其行周公之道法於百官也。○傳“往行”至“後世”○正義曰：此時在西都戒王，故云“往行政化於新邑”。當使臣下各鄉就所有之官，令其各守其職，思不出其位，自當陳力就列，明為有功。在官者當以褊小急躁為累，故令臣下厚大成寬裕之德。臣下既賢，君必明聖，則汝長有歎譽之辭於後世矣。今《周頌》所歌即歎譽成王之辭也。" }
      - { type: j, text: "公曰：“已！汝惟衝子惟終。已乎！汝惟童子，嗣父祖之位，惟當終其美業。汝其敬識百辟享，亦識其有不享。享多儀，儀不及物，惟曰不享。奉上謂之享。言汝為王，其當敬識百君諸侯之奉上者，亦識其有違上者。奉上之道多威儀，威儀不及禮物，惟曰不奉上。惟不役志於享，凡民惟曰不享，惟事其爽侮。言人君惟不役志於奉上，則凡人化之，惟曰不奉上矣。如此則惟政事其差錯侮慢不可治理。" }
      - { type: z, text: "“公曰”至“爽侮”○正義曰：周公復誨王曰：“嗚呼！前言已如是。”更復教誨：“汝惟童子，嗣父祖之位，惟當終其美業。天子居百官諸侯之上，須知臣下恭之與慢。奉上謂之享，汝為天子，其當恭敬記識百官諸侯奉上者，亦當記識其有不奉上者。奉上之道多威儀，威儀不及禮物，則人惟曰不奉上之道矣。所以須記之者，百官諸侯為下民之君，惟為政教不肯役用其志於此奉上之事，則凡民化之，亦惟曰不奉上矣。百官不承天子，民復不奉百官，上下不相畏敬，惟政事其皆差錯侮慢不可治理矣。故天子須知百官奉上與否也。”○傳“已乎”至“美業”○正義曰：周公止而復言，故更言“公曰”。“已乎”者，道前言已如是矣，為後言發端也。“童子”者，言其年幼而任重。“嗣父祖之位，當終其美業”，能致太平，是終之也。○傳“奉上”至“奉上”○正義曰：“享”訓獻也，獻是奉上之辭，故“奉上謂之享”。百官諸侯上事天子，凡所恭承皆是奉上，非獨朝覲貢獻乃為奉上。鄭玄專以朝聘說之，理未盡也。言汝為王當敬識百官諸侯之奉上者，亦識其有違上者，察其恭承王命如法以否，奉上違上皆須記之。奉上者當以禮接之，違上者當以刑威之，所謂賞慶刑威。為君之道，奉上之道，其事非一，故云“多威儀”。威儀既多，皆須合禮，其威儀不及禮物，惟曰不奉上矣。謂旁人觀之，亦言其不奉上也。鄭雲：“朝聘之禮至大，其禮之儀不及物，所謂貢篚多而威儀簡也。威儀既簡，亦是不享也。”" }
      - { type: j, text: "乃惟孺子，頒朕不暇，聽朕教汝於棐民彝。我為政常若不暇，汝為小子當分取我之不暇而行之，聽我教汝於輔民之常而用之。○頒音班，徐甫雲反，馬雲：“猶也。”棐音匪，又芳鬼反。汝乃是不，乃時惟不永哉！汝乃是不勉為政，汝是惟不可長哉！欲其必勉為可長。○，徐莫剛反，又武剛反，馬雲：“勉也。”篤敘乃正父，罔不若予，不敢廢乃命。厚次序汝正父之道而行之，無不順我所為，則天下不敢棄汝命，常奉之。汝往敬哉！茲予其明農哉！彼裕我民，無遠用戾。”汝往居新邑，敬行教化哉！如此我其退老，明教農人以義哉！彼天下被寬裕之政，則我民無遠用來。言皆來。○被，皮寄反，又彼美反。" }
      - { type: z, text: "“乃惟”至“用戾”○正義曰：又曰：“己居攝之時，為政常若不暇，汝惟小子，當分取我之不暇而施行之。又聽我教汝於輔民之常而用之。汝乃於是事不勉力為政，則汝是惟不可長久哉！必須勉力為之，乃可長久。此所言皆是汝父所行，汝欲勉之，但厚次序汝正父之道而行之，無不順我所為，則天下不敢棄廢汝命，必常奉而行之。汝往居新邑，敬行教化哉！如此我其退老，明教農人以義哉！汝若能使彼天下之民被寬裕之政，則我天下之民無問遠近者，悉皆用來歸汝矣。”○傳“我為”至“用之”○正義曰：“為政常若不暇”，謂居攝時也。聖人為政，務在化人，雖復治致太平，猶恨意之不盡，故謙言己所不暇，若言猶有美事未得施者然。故戒之成王：“汝惟小子，當分取我之不暇而行之。”言己所不暇行者，欲令成王勉行之。鄭玄雲：“成王之才，周公倍之，猶未而言分者，誘掖之言也。”生民之為業，雖復志有經營，不能獨自成就，須王者設教以輔助之。“聽我教汝輔民之常法而用之”，謂用善政以安民。《說文》雲：“頒，分也。”○傳“汝乃”至“可長”○正義曰：成王言“公其以予萬億年”，言欲己長久也，故周公於此戒之：“汝乃於是不勉力為政，汝惟不可長哉！”欲其必勉力勤行政教，為可長久之道，然後可至萬億年耳。“”之為勉，相傳訓也。鄭、王皆以為勉。○傳“厚次”至“奉之”○正義曰：“正父”謂武王，言其德正，故稱“正父”。“厚次序汝正父之道而行之”，令其為武王之政也。武王、周公俱是大聖，無不順我所為。又令法周公之道，既言法武王，又法周公，則天下不敢棄汝命，常奉行之。○傳“汝往”至“皆來”○正義曰：歸其王政令，汝往居新邑，敬行教化哉！公既歸政，則身當無事，如此我其退老於州里，明教農人以義哉！又令成王行寬裕之政，以治下民。民被寬裕之政，則天下之民無問遠近者，用來歸王，言遠處皆來也。上文使之“惇大成裕”，故此言裕政來民結上事也。伏生《書傳》稱，禮致仕之臣，教於州里，大夫為父師，士為少師，朝夕坐於門塾，而教出入之子弟。是“教農人以義”也。" }
      - { type: j, text: "王若曰：“公，明保予衝子。成王順周公意，請留之自輔。言公當明安我童子，不可去之。公稱丕顯德，以予小子揚文武烈，言公當留，舉大明德，用我小子襃揚文武之業而奉順天。○襃，薄謀反，《切韻》博毛反。奉答天命，和恆四方民，居師。又當奉當天命，以和常四方之民，居處其眾。惇宗將禮，稱秩元祀，鹹秩無文。厚尊大禮，舉秩大祀，皆次秩無禮文而宜在祀典者，凡此待公而行。惟公德明，光於上下，勤施於四方。言公明德光於天地，勤政施於四海，萬邦四夷服仰公德而化之。旁作穆穆迓衡，不迷文武勤教，四方旁來為敬敬之道，以迎太平之政，不迷惑於文武所勤之教。言化治。○旁，步光反。迓，五嫁反，馬、鄭、王皆音魚據反。予衝子夙夜毖祀。”言政化由公而立，我童子徒早起夜寐，慎其祭祀而已。無所能。" }
      - { type: z, text: "“王若”至“毖祀”○正義曰：王以周公將退，因誨之而請留公，王順周公之意而言曰：“公當留住而明安我童子，不可去也。所以不可去者，當舉行大明之德，用使我小子褒揚文武之業，而奉當天命，以和常四方之民，居處其眾故也。其厚尊大禮，謂舉秩大祀，皆次秩禮所無文者而皆祀之。凡此皆待公而行，非我能也。”更述居攝時事：“惟公明德光於天地，勤政施於四方，使四方旁來為敬敬之道，以迎太平之政，下民皆不復迷惑於文武所勤之教。”言公化洽使如此也。“今若留輔我童子，惟當早起夜寐，慎其祭祀而已”。言政化由公而立，我無所能也。○傳“成王”至“去之”○正義曰：成王以周公誨己為善，順周公之意，示己欲行善政，而請留之自輔。王以公若舍我而去，則已政暗而治危，故云“公當明安我童子，不可去”也。○傳“言公”至“順天”○正義曰：文武受命，功德盛隆，成王自量己身不能繼業，言公當留，舉大明德，以佑助我。“用我小子褒揚文武之業而奉順天”者，下句“奉答天命”是也。孔分經為傳，故探取下句以申之。○傳“又當”至“其眾”○正義曰：天命周家，欲令民治，故“又當奉當天命，以和常四方之民，居處其眾”也。“奉當”者，尊天意，使允當天心，和協民心，使常行善也。“居處其眾”，使之安土樂業也。○傳“厚尊”至“而行”○正義曰：《釋詁》雲：“將，大也。”“厚尊大禮”，謂祭祀之禮。《祭統》雲：“禮有五經，莫重於祭。”是祭禮最尊大。公誨成王，令“肇稱殷禮，祀於新邑，鹹秩無文”，欲答公誨己之事，還述公辭：“舉秩大祀，皆次秩無禮文而宜在祀典者。”其祀事非我所為，凡此皆待公而行者也。言公不可舍我以去也。○傳“言公”至“化之”○正義曰：此與下經皆追述居攝時事。《堯典》訓“光”為充，此“光”亦為充也。言公之明德充滿天地，即《堯典》“格於上下”，勤政施於四方，即《堯典》“光被四表”也，意言萬邦四夷皆服仰公德而化之。上言待公乃行之，此言公有是德，言其將來，說其已然，所以深美公也。○傳“四方”至“化洽”○正義曰：上言施化在公，此言民化公德，四方旁來為敬敬之道，民皆敬鄉公以迎太平之政。言“迎”者，公政從上而下，民皆自下迎之，言其慕化速也。文武勤行教化，欲以教訓利民，民蒙公化，識文武之心，不復迷惑文武所勤之教，言公居攝之時，政化已洽於民也。○傳“言政”至“所能”○正義曰：此述留公之意，陳自今已後之事。言公若留住，政化由公而立。我童子徒早起夜寐，慎其祭祀而已。於政事無所能，欲惟典祭祀，以政事委公。襄二十六年《左傳》雲，衛獻公使與甯喜言曰：“苟得反國，政由甯氏，祭則寡人。”亦猶是也。" }
      - { type: j, text: "王曰：“公功棐迪篤，罔不若時。”公之功輔道我已厚矣，天下無不順而是公之功。" }
      - { type: z, text: "“王曰公功”至“若時”○正義曰：王又重述前言，還說居攝時事也。曰：“公之功輔道我已厚矣，天下無有不順而是公之功者，公所以須留也。”○傳“公之”至“之功”○正義曰：王意言公之居攝，天下若為非，則可舍我而去。公之居攝，天下無不順而是公之功，不可舍我去。" }
      - { type: j, text: "王曰：“公，予小子其退即闢於周，命公後。我小子退坐之後，便就君於周，命正公後，公當留佑我。四方迪亂，未定於宗禮，亦未克敉公功。言四方雖道治，猶未定於尊禮。禮未彰，是亦未能撫順公之大功。明不可以去。○敉，亡婢反。治，直吏反，下同。迪將其後，監我士師工，公留教道，將助我其今已後之政，監篤我政事眾官。委任之言。○監，工銜反，注同。誕保文武受民亂，為四輔。”太安文武所受之民治之，為我四維之輔。明當依倚公。" }
      - { type: z, text: "“王曰公予”至“四輔”○正義曰：王呼周公曰：“我小子其退此坐，就為君於周。”謂順公之言，行天子之政於洛邑也。“至洛邑當命公後，立公之世子為國君，公當留輔我也。公之攝政，四方雖已道治理，猶自未能定於尊禮，是亦未能撫順公之大功。公當待其定大禮，順公之大功，此時未可去也。公當留教道，將助我其今已後之政，監篤我政事眾官，以此大安文武所受之民而治之，為我四維之輔助”。明己當依倚公也。○傳“我小”至“佑我”○正義曰：“退”者，退朝也。周公於時令成王坐王位而以政歸之，成王順周公言受其政也。言我小子退坐之後，便就君位於周。“周”謂洛邑，許其從公言，適洛邑而行新政也。古者臣有大功，必封為國君，今周公將欲退老，故命立公後，使公子伯禽為國君，公當留佑我。王肅雲：“成王前春亦俱至洛邑，是顧無事，既會而還宗周。周公往營成周，還來致政成王也。”○傳“言四”至“以去”○正義曰：王意恐公意以四方既定，不須更留，故謂公雲，四方雖已道治，而猶未能定於尊大之禮。言其禮樂未能彰明也。禮既未彰，是天下之民亦未能撫安順行公之大功，公當待其禮法明，公功順乃可去耳。明今不可以去。○傳“大安”至“倚公”○正義曰：文武受民之於天下，今大安文武所受之民，助我治之，為我四維之輔，明己當依倚公也。“維”者，為之綱紀，猶如用繩維持之。《文王世子》雲“設四輔”，謂設眾官為四方輔助。周公一人，事無不統，故一人為四輔。《管子》雲：“四維不張，國乃滅亡。”傳取《管子》之意，故言“四維之輔”也。" }
      - { type: j, text: "王曰：“公定，予往已。公功肅將祗歡，公留以安定我，我從公言，往至洛邑已矣。公功以進大，天下鹹敬樂公功。○樂音洛。公無困哉！我惟無斁其康事，公勿替刑，四方其世享。”公必留，無去以困我哉！我惟無厭其安天下事。公勿去以廢法，則四方其世世享公之德。○斁音亦。厭，於豔反。" }
      - { type: z, text: "“王曰公定”至“世享”○正義曰：王又呼公：“公留以安定我，我從公言，往至洛邑已矣。公功已進且大矣，天下皆樂公之功，敬而歡樂。公必留，無去以困我哉！公留助我，我惟無厭其安天下之事。公勿去以廢法，則四方之民其世世享公之德矣。”○傳“公留”至“公功”○正義曰：讀文以“公定”為句，王稱“定”者，言定己也，故傳言“公留以安定我”，“我”字傳加之。“我從公言”，是經之“予”也。“往至洛邑已矣”，言已順從公命，受歸政也。“公功已進大，天下鹹敬樂公之功”，亦謂居攝時也。《釋詁》雲：“肅，進也。”○傳“公必”至“之德”○正義曰：王言己才智淺短，公去則困，故請公“無去以困我哉”。我意欲致太平，惟無厭倦其安天下之事，是以留公，公勿去以廢治國之法，則天下四方之民蒙公之恩，其世世享公之德。“享”謂荷負之。" }
      - { type: j, text: "周公拜手稽首曰：“王命予來，承保乃文祖受命民，拜而後言，許成王留。言王命我來，承安汝文德之祖文王所受命之民，是所以不得去。越乃光烈考武王，弘朕恭。於汝大業之父武王，大使我恭奉其道。敘成王留己意。孺子來相宅，其大惇典殷獻民，少子今所以來相宅於洛邑，其大厚行典常於殷賢人。亂為四方新闢，作周恭先。言當治理天下，新其政化，為四方之新君，為周家見恭敬之王，後世所推先也。曰，其自時中乂，萬邦鹹休，惟王有成績。曰，其當用是土中為治，使萬國皆被美德，如此惟王乃有成功。予旦以多子越御事，篤前人成烈，答其師，作周孚先。我旦以眾卿大夫於御治事之臣，厚率行先王成業，當其眾心，為周家立信者之所推先。" }
      - { type: z, text: "“周公”至“孚先”○正義曰：周公拜手稽首，盡禮致敬，許王之留，乃興而為言曰：“王今命我來居臣位，承安汝文德之祖文王所受命之民，令我繼文祖大業，我所以不得去也。又於汝大業父武王，大使我恭奉其道，王意以禮留我，其事甚大，我所以為王留也。”公呼成王雲：“小子今所以來相宅於洛邑者，欲其大厚行常道於殷賢人。王當治理天下，新其政化，為四方之新君，為周家後世見恭敬之王所推先也。”重誨王曰：“其當用是土中為治，使萬國皆被美德，如此惟王乃有成功也。”公自稱名曰：“若王居洛邑，則我旦以多眾君子卿大夫等及於御治事之臣，厚率行前人先王成業，使當其眾心，為周家後世人臣立信者之所推先。”言我留輔王，使君臣皆為後世所推先，期於上下俱顯也。○傳“拜而”至“得去”○正義曰：“拜”是從命之事，故云“拜而後言，許成王留”也。以“退”為去，以“留”為來，故言“王令我來”，來居臣位，為太師也。“承安汝文德之祖文王所受命之民”，天命文王，使為民主，天以民命文王，故民是“文王所受命之民”。“承安”者，承文王之意，安定此民。言王之留己，乃為此事，其事既大，是所以不得去也。○傳“於汝”至“己意”○正義曰：於汝成王大功業之父武王，王意大使我恭奉其道，敘成王留已之意也。王於文王、武王，皆欲令周公奉其道，安其民，其意一也，周公分言之耳。承安其文王之民，恭奉其武王之道，互相通也。○傳“少子”至“賢人”○正義曰：“少子”者，呼成王之辭。言我“今所以來相宅於洛邑”者，欲令王居洛，其大厚行典常於殷賢人。而據洛為政，故言“來”。訓“典”為常，故連言“典常”，言其行常道也。周受於殷，故繼之於殷，人有賢性，故稱“賢人”。○傳“言當”至“推先”○正義曰：《易》稱“日新之謂盛德”，雖舊有美政，令王更復新之。言當治理天下，新其政化，為四方之新君，與後人為軌訓，為周家見恭敬之王，後世所推先也。謂周家後世子孫，有德之王被人恭敬推先王。戒成王使為善政，令后王崇重之。○傳“曰其”至“成功”○正義曰：重以誨王，成其上事，故言“曰”以起之。○傳“我旦”至“推先”○正義曰：“旦”是周公之名，故自稱“我旦”也。“子”者，有德之稱，大夫皆稱“子”，故以“多子”為眾卿大夫。同欲令成王行善政，為後世賢王所推先。公與群臣盡誠節，為後世賢臣所推先。故欲以眾卿大夫及於御治事之臣，深厚率行先王之業，使當其人眾之心，為周家後世賢臣立信者之所推先也。傳於此不言“後世”，從上省文也。於君言“見恭敬”，於臣言“立信”者，以君尊言人敬，臣卑言自立信，因其所宜以設文也。" }
      - { type: j, text: "考朕昭子刑，乃單文祖德，伻來毖殷，乃命寧。我所成明子法，乃盡文祖之德，謂典禮也。所以居土中，是文武使己來慎教殷民，乃見命而安之。○單音丹，馬丁但反，信也。予以秬鬯二卣，曰明禋，拜手稽首，休享。周公攝政七年致太平，以黑黍酒二器，明絜致敬，告文武以美享。既告而致政，成王留之。本說之。○秬音巨。鬯，敕亮反，香酒也。卣，由手反，又音由，中樽也。禋音因。予不敢宿，則禋於文王武王。言我見天下太平，則絜告文武，不經宿。惠篤敘，無有遘自疾。萬年厭乃德，殷乃引考。汝為政當順典常，厚行之使有次序，無有遇用患疾之道者，則天下萬年厭於汝德，殷乃長成為周。○遘，工豆反。厭，於豔反，注同，馬雲：“厭，飲也。”徐於廉反。王伻殷乃承敘萬年，其永觀朕子懷德。”王使殷民上下相承有次序，則萬年之道，民其長觀我子孫而歸其德矣勉使終之。" }
      - { type: z, text: "“考朕”至“懷德”○正義曰：周公又說制禮授王，使王奉之。我所成明子之法，乃盡是汝文祖之德，言用文王之道制禮，其事大不可輕也。又言所以須善治殷獻民者，文武使己來居土中，慎教殷民，乃是見命於文武而安之故也。制典當待太平，我以時既太平，即以秬黍鬯酒，盛於二卣樽內，我言曰：“當以此酒須明絜致敬於文武，我則拜手稽首，告文武以美享。”告雲：“今太平，即速告廟，我不敢經宿，則禋告文王武王以致太平之事。”汝王為政，當順典常厚行之，使有次序，則諸為政者無雲有遇用患疾之道苦毒下民，則天下萬年厭飽於汝王之德，殷乃長成為周。王使殷民上下相承有次序，則萬年之道，下民其長觀我子孫而歸其德矣。勸王使終之，皆是誨王之言也。○傳“我所”至“安之”○正義曰：典禮治國，事資聖人，前聖後聖，其終一揆，故言所欲成明子之法，乃盡是汝祖文王之德也。“子”斥成王，下句並告文武，兼用武王可知。又述居洛邑之意，所以居土中者，是文武使己來居此地，周公自言非己意也。文武令我營此洛邑，欲使居土中，慎教殷民，乃是見命於文武而安殷民也。顧氏雲：“文武使我來慎教殷民，我今受文武之命以安民也。”○傳“周公”至“說之”○正義曰：《康誥》之作，事在七年，雲“四方民大和會”。“和會”即太平之驗，是“周公攝政七年致太平”也。《釋草》雲：“秬，黑黍。”《釋器》雲：“卣，中樽也。”以黑黍為酒，煮鬱金之草，築而和之，使芬香調暢，謂之“秬鬯”。鬯酒二器，明絜致敬，告文王武王以美享，謂以太平之美事享祭也。《國語》稱：“精意以享謂之禋。”《釋詁》雲：“禋，敬也。”是明“禋”為“明絜致敬”也。太平是王之美事，故太平告廟是以美享祭也。公既告太平而致政成王，成王留之，故本而說之此事者，欲令成王重其事，厚行之。《周禮》鬱鬯之酒實之於彝，此言在卣者，《詩·大雅·江漢》及《文侯之命》皆言“秬鬯一卣，告於文人”，則未祭實之於卣，祭時實之於彝。彼“一卣”，此“二卣”者，此一告文王，一告武王；彼王賜臣使告其太祖，故惟一卣耳。此經“卣”下言“曰”者，說本盛酒於樽，乃為此辭，故言“曰”也。○傳“言我”至“經宿”○正義曰：此申述上“明禋”之事，言我見天下太平，則絜告文武，不敢經宿，示虔恭之意也。此三月營洛邑，民已和會，則三月之時已太平矣。既告而致政，則告在歲末，而云“不經宿”者，蓋周公營洛邑，至冬始成，得還鎬京，即告文武，是為“不經宿”也。且太平非一日之事，公雲“不經宿”者，示虔恭之意耳，未必旦見太平，即此日告也。鄭玄以“文祖”為明堂，“曰明禋者，六典成祭於明堂，告五帝太皞之屬也”。既告明堂，則復禋於文武之廟，告成洛邑。○傳“汝為”至“為周”○正義曰：《釋言》雲：“惠，順也。”此經述上“惇典”，故言“汝為政當順典常，厚行之使有次序”。《釋詁》雲：“遘，遇也。”患疾之道謂虐政，使人患疾之。厚行典常，使有次序，則百官諸侯凡為政者皆無有遇用患疾之政以害下民，則經歷萬年厭飽於汝德，則殷國乃長成為周。○傳“王使”至“終之”○正義曰：上言天下民萬年厭飽王德，此教為王德，使萬年令民厭飽王德也。能使殷民上下有次序，則王德堪至萬年之道。王之子孫當行不怠，則民其長觀我子孫，知其有德，而歸其德矣，此則長成為周。勸勉王使終之。" }
      - { type: j, text: "戊辰，王在新邑，成王既受周公誥，遂就居洛邑，以十二月戊辰晦到。○王在新邑，馬孔絕句，鄭讀“王在新邑烝”。烝祭歲，文王騂牛一，武王騂牛一。王命作冊，逸祝冊，惟告周公其後。明月，夏之仲冬，始於新邑烝祭，故曰“烝祭歲”。古者褒德賞功，必於祭日，示不專也。特加文武各一牛，告曰尊周公，立其後為魯侯。王賓，殺禋，鹹格，王入太室祼。王賓異周公，殺牲精意以享文武，皆至其廟親告也。太室，清廟。祼鬯告神。○王賓，絕句。殺禋，絕句，一讀連“鹹格”絕句。太室，馬雲：“廟中之夾室。”祼，官喚反。王命周公後，作冊逸誥。王為冊書，使史逸誥伯禽封命之書，皆同在烝祭日，周公拜前，魯公拜後。在十有二月，惟周公誕保文武受命，惟七年。言周公攝政盡此十二月，大安文武受命之事，惟七年，天下太平。自“戊辰”已下，史所終述。○受命，絕句，馬同。惟七年，周公攝政七年，天下太平，馬同；鄭雲：“文王武王受命及周公居攝皆七年。”" }
      - { type: z, text: "“戊辰”至“七年”○正義曰：自此以下，史終述之。周公歸政，成王既受言誥之，王即東行赴洛邑。其年十二月晦戊辰日，王在新邑。後月是夏之仲冬，為冬節烝祭，其月節是周之歲首，特異常祭，加文王騂牛一，武王騂牛一。王命有司作策書，乃使史官名逸者祝讀此策，惟告文武之神，言周公有功，宜立其後為國君也。其時王尊異周公，以為賓，殺牲享祭文王武王，皆親至其廟，王入廟之大室，行祼鬯之禮。言其尊異周公而禮敬深也。於此祭時，王命周公後，令作策書，使逸讀此策辭以告伯禽，言封之於魯，命為周公後也。又總述之，在十有二月，惟周公大安文武受命之事，於此時惟攝攻七年矣。○傳“成王”至“晦到”○正義曰：周公告成王令居洛邑為治，王既受周公之誥，遂東行就居洛邑，以十二月戊辰晦日到洛。指言“戊辰，王在新邑”，知其晦日始到者，此歲入戊午蔀五十六年，三月雲丙午朏，以算術計之，三月甲辰朔大，四月甲戌朔小，五月癸卯朔大，六月癸酉朔小，七月壬寅朔大，八月壬申朔小，九月辛丑朔大，又有閏九月辛未朔小，十月庚子朔大，十一月庚午朔小，十二月己亥朔大，計十二月三十日戊辰晦到洛也。○傳“明月”至“魯侯”○正義曰：下雲“在十有二月”者，周之十二月，建亥之月也。戊辰是其晦日，故明日即是夏之仲冬建子之月也。言“明月”者，此烝祭非朔日，故言“月”也。自作新邑已來，未嘗於此祭祀，此歲始於新邑烝祭，故曰“烝祭歲”也。《周禮·大司馬》仲冬教大閱，遂以享烝是也。王者冬祭，必用仲月，此是周之歲首，故言“歲”耳。王既戊辰晦到，又須戒日致齊，不得以朔日即祭之。《祭統》雲：“古者明君爵有德而祿有功，必賜爵祿於太廟，示不敢專也。”故云“古者褒德賞功，必於祭日，示不專也”。因封之，特設祭烝之禮。宗廟用大牢，此文武皆言“牛一”，知於太牢之外特加一牛。告白文武之神，言為尊周公，立其後為魯侯。《魯頌》所云“王曰叔父，建爾元子，俾侯於魯”，是此時也。“王命作策”者，命有司作策書也。讀策告神謂之“祝”，“逸祝策”者，使史逸讀策書也。鄭玄以“烝祭”上屬。“歲文王騂牛一”者，“歲”是成王元年，正月朔日，特告文武封周公也。案《周頌·烈文序》雲：“成王即政，諸侯助祭。”鄭箋雲：“新王即政，必以朝享之禮祭於祖考，告嗣位也。”則鄭意以朝享之後，特以二牛告文武，封周公之後，與孔義不同。○傳“王賓”至“告神”○正義曰：“王賓異周公”者，王尊周公為賓，異於其臣。王肅雲“成王尊周公，不敢臣之，以為賓，故封其子”是也。《周語》雲：“精意以享謂之禋。”既殺二牲，精誠其意以享祭文武。“鹹”，皆也。“格”，至也。“皆至其廟”，言王重其事，親告之也。“太室”，室之大者，故為清廟。廟有五室，中央曰“太室”。王肅雲：“太室，清廟中央之室。”“清廟”，神之所在，故王入太室祼獻鬯酒以告神也。“祼”者，灌也。王以圭瓚酌鬱鬯之酒以獻屍，屍受祭而灌於地，因奠不飲謂之“祼”。《郊特牲》雲“既灌，然後迎牲”，則殺在祼後。此經先言“殺”，後言“祼”者，“殺”者、“鹹格”錶王敬公之意，非行事之次也。其“王入太室祼”，乃是祭時行事耳。周人尚臭，祭禮以祼為重，故言王祼。其封伯禽，乃是祭之將末，非祼時也。《祭統》賜臣爵祿之法雲：“祭之日，一獻，君降立於阼階之南，南向，所命者北面，史由君右，執策命之。”鄭雲：“一獻，一酳屍也。”《禮》酳屍，屍獻而祭畢，是祭末乃命之，以祼為重，故特言之。○傳“王為”至“拜後”○正義曰：“王為策書”，亦命有司為之也。上雲“作策”，作告神之策。此言“作策”，誥伯禽之策。祭於神謂之“祝”，於人謂之“誥”，故云“使史逸誥伯禽封命之書”。封康叔謂之《康誥》，此命伯禽，當雲《伯禽之誥》。定四年《左傳》雲“命以伯禽”，即史逸所讀之策也。上言“逸祝策”，此“誥”下不言“策”者，“祝”是讀書之名，故上雲“祝策”；此“誥”是誥伯禽使知，雖復讀書以誥之，不得言“誥策”也。上告周公，其後已言告神封周公，嫌此“逸誥”以他日告之，故云“皆同在烝祭日”。以《祭統》言一獻命之，知此亦祭日也。文十三年《公羊傳》曰：“封魯公以為周公也，周公拜乎前，魯公拜乎後。曰生以養周公，死以為周公主。”○傳“言周”至“終述”○正義曰：自“戊辰”已上，周公與成王相對語，未有致政年月，故史於此總結之。自“戊辰”已下非是王與周公之辭，故辨之雲“史所終述”也。" }
      - { type: j, text: "《尚書正義》" }
