# 論語注疏卷9（邢昺疏）：j 為經文＋魏何晏集解，z 為疏文。
sections:
  - id: juan9
    name: 正文
    blocks:
      - { type: z, text: "正义曰：此篇皆论孔子之德行也，故以次泰伯、尧、禹之至德。" }
      - { type: j, text: "子罕言利与命与仁。（罕者，希也。利者，义之和也。命者，天之命也。仁" }
      - { type: j, text: "者，行之盛也。寡能及之，故希言也。）" }
      - { type: z, text: "“子罕言利与命与仁”。○正义曰：此章论孔子希言难及之事也。罕，" }
      - { type: j, text: "希也。与，及也。利者，义之和也。命者，天之命也。仁者，行之盛也。孔子以" }
      - { type: j, text: "其利、命、仁三者常人寡能及之，故希言也。○注“罕者”至“言也”。○正义" }
      - { type: j, text: "曰：《释诂》云：“希，罕也。”转互相训，故罕得为希也。云“利者，义之和" }
      - { type: j, text: "也”者，《乾卦·文言》文也。言天能利益庶物，使物各得其宜而和同也。此云" }
      - { type: j, text: "利者，谓君子利益万物，使物各得其宜，足以和合於义，法天之利也。云“命者，" }
      - { type: j, text: "天之命也”者，谓天所命生人者也。天本无体，亦无言语之命，但人感自然而生，" }
      - { type: j, text: "有贤愚、吉凶、穷通、夭寿，若天之付命遣使之然，故云天之命也。云“仁者，" }
      - { type: j, text: "行之盛也”者，仁者爱人以及物，是善行之中最盛者也。以此三者，中知以下寡" }
      - { type: j, text: "能及知，故孔子希言也。" }
      - { type: j, text: "达巷党人曰：“大哉孔子！博学而无所成名。”（郑曰：“达巷者，党名也。" }
      - { type: j, text: "五百家为党，此党之人，美孔子博学道艺，不成一名而已。”）子闻之，谓门弟" }
      - { type: j, text: "子曰：“吾何执？执御乎？执射乎？吾执御矣。”（郑曰：“闻人美之，承之以" }
      - { type: j, text: "谦。吾执御，欲名六艺之卑也。”）" }
      - { type: z, text: "“达巷”至“御矣”。○正义曰：此章论孔子道艺该博也。“达巷党人" }
      - { type: j, text: "曰：大哉孔子！博学而无所成名”者，达巷者，党名也。五百家为党。此党之人，" }
      - { type: j, text: "美孔子博学道艺，不成一名而已。“子闻之，谓门弟子曰：吾何执？执御乎？执" }
      - { type: j, text: "射乎？吾执御矣”者，孔子闻人美之，承之以谦，故告谓门弟子曰：“我於六艺" }
      - { type: j, text: "之中，何所执守乎？但能执御乎？执射乎？”乎者，疑而未定之辞。又复谦指云：" }
      - { type: j, text: "“吾执御矣。”以为人仆御，是六艺之卑者，孔子欲名六艺之卑，故云“吾执御" }
      - { type: j, text: "矣。”谦之甚矣。" }
      - { type: j, text: "子曰：“麻冕，礼也。今也纯，俭，吾从众。（孔曰：“冕，缁布冠也，古" }
      - { type: j, text: "者绩麻三十升布以为之。纯，丝也。丝易成，故从俭。”）拜下，礼也。今拜乎" }
      - { type: j, text: "上，泰也。虽违众，吾从下。”（王曰：“臣之与君行礼者，下拜然後升成礼。" }
      - { type: j, text: "时臣骄泰，故於上拜。今从下，礼之恭也。”）" }
      - { type: z, text: "“子曰”至“从下”。○正义曰：此章作孔子从恭俭。“麻冕，礼也。" }
      - { type: j, text: "今也纯，俭，吾从众”者，冕，缁布冠也。古者绩麻三十升布以为之，故云“麻" }
      - { type: j, text: "冕，礼也。”今也，谓当孔子时。纯，丝也。丝易成，故云纯，俭。用丝虽不合" }
      - { type: j, text: "礼，以其俭易，故孔子从之也。“拜下，礼也。今拜乎上，泰也。虽违众，吾从" }
      - { type: j, text: "下”者，礼，臣之与君行礼者，下拜然後升成拜，是礼也。今时之臣，皆拜於上" }
      - { type: j, text: "长骄泰也。孔子以其骄泰则不孙，故违众而从下拜之礼也。下拜，礼之恭故也。" }
      - { type: j, text: "○注“孔曰”至“从俭”。○正义曰：云“冕，缁布冠也”者，冠者，首服之大" }
      - { type: j, text: "名；冕者，冠中之别号，故冕得为缁布冠也。《士冠礼》曰：“陈服，缁布冠" }
      - { type: j, text: "项青组，缨属于。”记曰：“始冠缁布之冠也。大古冠布，齐则缁之，其也，" }
      - { type: j, text: "孔子曰：‘吾未之闻也。冠而敝之，可也。’”云“古者绩麻三十升布以为之”" }
      - { type: j, text: "者，郑注《丧服》云：“布八十缕为升。”○注“王曰”至“恭也”。○正义曰：" }
      - { type: j, text: "云“臣之与君行礼者，下拜然後升成礼”者，案《燕礼》，君燕卿大夫之礼也。" }
      - { type: j, text: "其礼云：“公坐取大夫所媵觯兴，以酬宾。宾降西阶下，再拜稽首。公命小臣辞，" }
      - { type: j, text: "宾升成拜。”郑注：“升成拜，复再拜稽首也。先时君辞之，於礼若未成然。”" }
      - { type: j, text: "又《觐礼》：“天子赐侯氏以车服。诸公奉箧服，如命书于其上。升自西阶东面，" }
      - { type: j, text: "大史氏右。侯氏升西面立，大史述命。侯氏降两阶之间，北面再拜稽首，升成拜。”" }
      - { type: j, text: "皆是臣之与君行礼，下拜然後升成礼也。" }
      - { type: j, text: "子绝四：毋意，（以道为度，故不任意。）毋必，（用之则行，舍之则藏，" }
      - { type: j, text: "故无专必。）毋固，（无可无不可，故无固行。）毋我。（述古而不自作处，群" }
      - { type: j, text: "萃而不自异，唯道是从，故不有其身。）" }
      - { type: z, text: "“子绝四：毋意，毋必，毋固，毋我。○正义曰：此章论孔子绝去四事，" }
      - { type: j, text: "与常人异也。毋，不也。我，身也。常人师心徇惑，自任已意。孔子以道为度，" }
      - { type: j, text: "故不任意。常人行藏不能随时用舍，好自专必。惟孔子用之则行，舍之则藏，不" }
      - { type: j, text: "专必也。常人之情，可者与之，不可者拒之，好坚固其所行也。孔子则无可无不" }
      - { type: j, text: "可，不固行也。人多制作自异，以擅其身。孔子则述古而不自作处，群众萃聚，" }
      - { type: j, text: "和光同尘，而不自异，故不有其身也。" }
      - { type: j, text: "子畏於匡，（包曰：“匡人误围夫子，以为阳虎。阳虎曾暴於匡，夫子弟子" }
      - { type: j, text: "颜克时又与虎俱行。後克为夫子御，至於匡。匡人相与共识克，又" }
      - { type: j, text: "夫子容貌与虎相似，故匡人以兵围之。”）曰：“文王既没，文不在兹乎？（孔" }
      - { type: j, text: "曰：“兹，此也。言文王虽已死，其文见在此。此，自谓其身。”）天之将丧斯" }
      - { type: j, text: "文也，後死者不得与於斯文也。（孔曰：“文王既没，故孔子自谓後死。言天将" }
      - { type: j, text: "丧此文者，本不当使我知之。今使我知之，未欲丧也。”）天之未丧斯文也，匡" }
      - { type: j, text: "人其如予何？”（马曰：“其如予何者，犹言奈我何也。天之未丧此文，则我当" }
      - { type: j, text: "传之。匡人欲奈我何，言其不能违天以害已也。”）" }
      - { type: z, text: "“子畏”至“予何”。○正义曰：此章记孔子知天命也。“子畏於匡”" }
      - { type: j, text: "者，谓匡人以兵围孔子，记者以众情言之，故云“子畏於匡”。其实孔子无所畏" }
      - { type: j, text: "也。“曰“文王既没，文不在兹乎”者，孔子以弟子等畏惧，故以此言谕之。兹，" }
      - { type: j, text: "此也。言文王虽已死，其文岂不见在我此身乎？言其文见在我此身也。“天之将" }
      - { type: j, text: "丧斯文也，後死者不得与於斯文也”者，後死者，孔子自谓也。以文王既没，故" }
      - { type: j, text: "孔子自谓已为後死者。言天将丧此文者，本不当使我与知之。今既使我知之，是" }
      - { type: j, text: "天未欲丧此文也。“天之未丧斯文也，匡人其如予何”者，如予何，犹言奈我何" }
      - { type: j, text: "也。天之未丧此文，则我当传之。匡人其欲奈我何，言匡人不能违天以害已也。" }
      - { type: j, text: "○注“包曰”至“围之”。○正义曰：此注皆约《世家》，述其畏匡之由也。案" }
      - { type: j, text: "《世家》云：“孔子去卫。将陈，过匡。颜克为仆，以策指之曰：‘昔日" }
      - { type: j, text: "吾入此，由彼缺也。’匡人闻之，以为鲁之阳虎。阳虎尝暴匡人，匡人於是遂止" }
      - { type: j, text: "孔子。孔子状貌类阳虎，拘焉五日。匡人拘孔子益急，弟子惧。孔子曰：‘文王" }
      - { type: j, text: "既没，文不在兹乎？’”已下文与此正同，是其事也。" }
      - { type: j, text: "大宰问於子贡曰：“夫子圣者与？何其多能也？”（孔曰：“大宰，大夫官" }
      - { type: j, text: "名，或吴或宋，未可分也。疑孔子多能於小艺。”）子贡曰：“固天纵之将圣，" }
      - { type: j, text: "又多能也。”（孔曰：“言天固纵大圣之德，又使多能也。”）子闻之，曰：" }
      - { type: j, text: "“大宰知我乎！吾少也贱，故多能鄙事。君子多乎哉？不多也。”（包曰：“我" }
      - { type: j, text: "少小贫贱，常自执事，故多能为鄙人之事。君子固不当多能。”）" }
      - { type: z, text: "“大宰”至“多也”。○正义曰：此章论孔子多小艺也。“大宰问於子" }
      - { type: j, text: "贡曰：夫子圣者与？何其多能也”者，大宰，大夫官名。大宰之意，以为圣人当" }
      - { type: j, text: "务大忽小，今夫子既曰圣者与，又何其多能小艺乎？以为疑，故问於子贡也。" }
      - { type: j, text: "“子贡曰：固天纵之将圣，又多能也”者，将，大也。言天固纵大圣之德，又使" }
      - { type: j, text: "多能也。“子闻之曰：大宰知我乎”者，孔子闻大宰疑已多能非圣，故云：知我" }
      - { type: j, text: "乎。谦谦之意也。“吾少也贱，故多能鄙事”者，又说以多能之由也。言我自小" }
      - { type: j, text: "贫贱，常自执事，故多能为鄙人之事也。“君子多乎哉，不多也”者，又言圣人" }
      - { type: j, text: "君子当多能乎哉？言君子固不当多能也。今已多能，则为非圣，所以为谦谦也。" }
      - { type: j, text: "○注“孔曰”至“小艺”。○正义曰：云“大宰，大夫官名”者，案《周礼》，" }
      - { type: j, text: "大宰六卿之长，卿即上大夫也，故云大夫官名也。云“或吴或宋，未可分也”者，" }
      - { type: j, text: "以当时惟吴、宋二国上大夫称大宰，诸国虽有大宰，非上大夫，故云“或吴或宋，" }
      - { type: j, text: "未可分也”。郑云“是吴大宰也”。以《左传》哀十二年，“公会吴于橐皋，" }
      - { type: j, text: "吴子使大宰请寻盟。公不欲，使子贡对”，又子贡尝吴，故郑以为是吴大宰" }
      - { type: j, text: "也。" }
      - { type: j, text: "牢曰：“子云：‘吾不试，故艺。’”（郑曰：“牢，弟子子牢也。试，用" }
      - { type: j, text: "也。言孔子自云，我不见用，故多技艺。”）" }
      - { type: z, text: "“牢曰：子云：吾不试，故艺”。○正义曰：此章论孔子多技艺之由，" }
      - { type: j, text: "但与前章异时而语，故分之。牢，弟子琴牢也。试，用也。言孔子自云：“我不" }
      - { type: j, text: "见用於时，故多能技艺。”○注“牢，弟子子牢也”。○正义曰：《家语·弟子" }
      - { type: j, text: "篇》云：“琴牢，卫人也，字子开，一字张。”此云弟子子牢，当是耳。" }
      - { type: j, text: "子曰：“吾有知乎哉？无知也。（知者，知意之知也。知者言未必尽，今我" }
      - { type: j, text: "诚尽。）有鄙夫问於我，空空如也。我叩其两端而竭焉。”（孔曰：“有鄙夫来" }
      - { type: j, text: "问於我，其意空空然，我则发事之终始两端以语之，竭尽所知，不为有爱。”）" }
      - { type: z, text: "“子曰”至“竭焉”。○正义曰：此章言孔子教人必尽其诚也。“子曰：" }
      - { type: j, text: "吾有知乎哉？无知也”者，知者，意之所知也。孔子言，我有意之所知，不尽以" }
      - { type: j, text: "教人乎哉？无之也。常人知者言未必尽，今我诚尽也。“有鄙夫问於我，空空如" }
      - { type: j, text: "也。我叩其两端而竭焉”者，此举无知而诚尽之事也。空空，虚心也。叩，发动" }
      - { type: j, text: "也。两端，终始也。言设有鄙贱之夫来问於我，其意空空然，我则发事之终始两" }
      - { type: j, text: "端以告语之，竭尽所知，不为有爱。言我教鄙夫尚竭尽所知，况知礼义之弟子乎。" }
      - { type: j, text: "明无爱惜乎其意之所知也。○注“知者”至“诚尽”。○正义曰：云“知者，知" }
      - { type: j, text: "意之知也”者，知意之知，犹言意之所知也。云“知者言未必尽”者，言他人之" }
      - { type: j, text: "短者，言之以教人，未必竭尽所知，谓多所爱惜也。云“今我诚尽”者，谓孔子" }
      - { type: j, text: "言今我教人实尽其意之所知，无爱惜也，故云无知也。" }
      - { type: j, text: "子曰：“凤鸟不至，河不出图，吾已矣夫！”（孔曰：“圣人受命则凤鸟至，" }
      - { type: j, text: "河出图。今天无此瑞。‘吾已矣夫’者，伤不得见也。河图，八卦是也。”）" }
      - { type: z, text: "“子曰：凤鸟不至，河不出图，吾已矣夫！”○正义曰：此章言孔子伤" }
      - { type: j, text: "时无明君也。圣人受命则凤鸟至，河出图。今天无此瑞，则时无圣人也。故叹曰：" }
      - { type: j, text: "“吾已矣夫”，伤不得见也。○注“孔曰”至“是也”。○正义曰：云“圣人受" }
      - { type: j, text: "命则凤鸟至，河出图”者，《礼器》云：“升中於天而凤皇降。”《援神契》云：" }
      - { type: j, text: "“德至鸟兽则凤皇来。”天老曰：“凤象：麟前鹿後，蛇颈鱼尾，龙文龟背，燕" }
      - { type: j, text: "含鸡喙，五色备举。出於东方君子之国，翔四海之外，过昆仑，饮砥柱，濯羽弱" }
      - { type: j, text: "水，莫宿丹穴。见则天下大安宁。”郑玄以为，河图、洛书，龟龙衔负而出，如" }
      - { type: j, text: "《中候》所说“龙马衔甲，赤文绿色，甲似龟背，袤广九尺，上有列宿斗正之度，" }
      - { type: j, text: "帝王录纪兴亡之数”是也。孔安国以为河图即八卦，是也。" }
      - { type: j, text: "子见齐衰者、冕衣裳者与瞽者，（包曰：“冕者，冠也，大夫之服。瞽，盲" }
      - { type: j, text: "也。）见之，虽少，必作；过之，必趋。（包曰：“作，起也；趋，疾行也。此" }
      - { type: j, text: "夫子哀有丧，尊在位，恤不成人。”）" }
      - { type: z, text: "“子见”至“必趋”。○正义曰：此章言孔子哀有丧，尊在位，恤不成" }
      - { type: j, text: "人也。“子见齐衰者、冕衣裳者与瞽”者，齐衰，周亲之丧服也。言齐衰，则斩" }
      - { type: j, text: "衰从可知也。冕，冠也，大夫之服也。瞽，盲也。“见之，虽少，必作；过之，" }
      - { type: j, text: "必趋”者，作，起也；趋，疾行也。言夫子见此三种之人，虽少，坐则必起，行" }
      - { type: j, text: "则必趋。" }
      - { type: j, text: "颜渊喟然叹曰：“（喟，叹声。）仰之弥高，钻之弥坚。（言不可穷尽。）" }
      - { type: j, text: "瞻之在前，忽焉在後。（言恍惚不可为形象。）夫子循循然善诱人，（循循，次" }
      - { type: j, text: "序貌。诱，进也。言夫子正以此道进劝人有所序。）博我以文，约我以礼，欲罢" }
      - { type: j, text: "不能。既竭吾才，如有所立卓尔，虽欲从之，末由也已。”（孔曰：“言夫子既" }
      - { type: j, text: "以文章开博我，又以礼节节约我，使我欲罢而不能。已竭我才矣，其有所立则又" }
      - { type: j, text: "卓然不可及。言已虽蒙夫子之善诱，犹不能及夫子之所立。”）" }
      - { type: z, text: "“颜渊”至“也已”。○正义曰：此章美夫子之道也。“颜渊喟然叹曰：" }
      - { type: j, text: "仰之弥高，钻之弥坚。瞻之在前，忽焉在後”者，喟，叹声也。弥，益也。颜渊" }
      - { type: j, text: "喟然发叹，言夫子之道高坚不可穷尽，恍惚不可为形象，故仰而求之则益高，钻" }
      - { type: j, text: "研求之则益坚，瞻之似若在前，忽然又复在後也。“夫子循循然善诱人”者，循" }
      - { type: j, text: "循，次序貌；诱，进也。言夫子以此道教人，循循然有次序，可谓善进劝人也。" }
      - { type: j, text: "“博我以文，约我以礼，欲罢不能。既竭吾才，如有所立卓尔，虽欲从之，末由" }
      - { type: j, text: "也已”者，末，无也。言夫子既开博我以文章，又节约我以礼节，使我欲罢止而" }
      - { type: j, text: "不能。已竭尽我才矣，其夫子更有所创立，则又卓然绝异，已虽欲从之，无由得" }
      - { type: j, text: "及。言已虽蒙夫子之善诱，犹不能及夫子之所立也。" }
      - { type: j, text: "子疾病，（包曰：“疾甚曰病。”）子路使门人为臣。（郑曰：“孔子尝为" }
      - { type: j, text: "大夫，故子路欲使弟子行其臣之礼。”）病间，曰：“久矣哉，由之行诈也！无" }
      - { type: j, text: "臣而为有臣。吾谁欺？欺天乎？（孔曰：“少差曰间。言子路久有是心，非今日" }
      - { type: j, text: "也。”）且予与其死於臣之手也，无宁死於二三子之手乎！（马曰：“无宁，宁" }
      - { type: j, text: "也；二三子，门人也。就使我有臣而死其手，我宁死於弟子之手乎！”）且予纵" }
      - { type: j, text: "不得大葬，（孔曰：“君臣礼葬。”）予死於道路乎？”（马曰：“就使我不得" }
      - { type: j, text: "以君臣礼葬，有二三子在，我宁当忧弃於道路乎？”）" }
      - { type: z, text: "“子疾”至“路乎”。○正义曰：此章言孔子不欺也。“子疾病”者，" }
      - { type: j, text: "疾甚曰病。“子路使门人为臣”者，以孔子尝为鲁大夫，故子路欲使弟子行其家" }
      - { type: j, text: "臣之礼，以夫子为大夫君也。“病间，曰：久矣哉，由之行诈也”者，少差曰间。" }
      - { type: j, text: "当其疾甚时，子路以门人为臣，夫子不知。及病少差，知之，乃责之，言子路久" }
      - { type: j, text: "有是诈欺之心，非今日也，故云“久矣哉，由之行诈也！”“无臣而为有臣。吾" }
      - { type: j, text: "谁欺？欺天乎”者，言我既去大夫，是无臣也。女使门人为臣，是无臣而为有臣。" }
      - { type: j, text: "如此行诈，人盖知之，是人不可欺，故云吾谁欺。既人不可欺，乃欲远欺天乎？" }
      - { type: j, text: "“且予与其死於臣之手也，无宁死於二三子之手乎”者，无宁，宁也；二三子，" }
      - { type: j, text: "门人也。言就使我有臣，且我等其死於臣之手，宁如死於其弟子之手乎？“且予" }
      - { type: j, text: "纵不得大葬，予死於道路乎”者，大葬，谓君臣礼葬。言且就使我纵不得以君臣" }
      - { type: j, text: "礼葬，有二三子在，我宁当忧弃於道路乎？言必不至死於道路也。" }
      - { type: j, text: "子贡曰：“有美玉於斯，韫椟而藏诸？求善贾而沽诸？”（马曰：“韫，藏" }
      - { type: j, text: "也。椟，匮也。谓藏诸匮中沽卖也。得善贾，宁肯卖之邪？”）子曰：“沽之哉！" }
      - { type: j, text: "沽之哉！我待贾者也。”（包曰：“沽之哉，不卖之辞。我居而待贾。”）" }
      - { type: z, text: "“子贡”至“者也”。○正义曰：此章言孔子藏德待用也。“子贡曰：" }
      - { type: j, text: "有美玉於斯，韫椟而藏诸？求善贾而沽诸”者，子贡欲观孔子圣德藏用何如，故" }
      - { type: j, text: "玉以谘问也。韫，藏也。椟，匮也。诸，之。沽，卖也。言人有美玉於此，藏" }
      - { type: j, text: "在椟中而藏之，若求得善贵之贾，宁肯卖之邪？君子於玉比德。子贡之意，言夫" }
      - { type: j, text: "子有美德而怀藏之，若人虚心尽礼求之，夫子肯与之乎？“子曰：沽之哉！沽之" }
      - { type: j, text: "哉！我待贾者也”者，孔子答言，我卖之哉。不卖之辞。虽不卖，我居而待" }
      - { type: j, text: "贾。言有人虚心尽礼以求我道，我即与之而不吝也。" }
      - { type: j, text: "子欲居九夷。（马曰：“九夷，东方之夷，有九种。”）或曰：“陋，如之" }
      - { type: j, text: "何？”子曰：“君子居之，何陋之有？”（马曰：“君子所居则化。”）" }
      - { type: z, text: "“子欲”至“之有”。正义曰：此章论孔子疾中国无明君也。“子欲居" }
      - { type: j, text: "九夷”者，东方之夷有九种。孔子以时无明君，故欲居东夷。“或曰：陋，如之" }
      - { type: j, text: "何”者，或人谓孔子言，东夷僻陋无礼，如何可居？“子曰：君子居之，何陋之" }
      - { type: j, text: "有”者，孔子答或人言，君子所居则化，使有礼义，故云何陋之有。○注“马曰：" }
      - { type: j, text: "九夷，东方之夷，有九种”。○正义曰：案《东夷传》云：“夷有九种，曰畎夷，" }
      - { type: j, text: "于夷，方夷，黄夷，白夷，赤夷，玄夷，风夷，阳夷。”又一曰玄菟，二曰乐浪，" }
      - { type: j, text: "三曰高丽，四曰满饰，五曰凫臾，六曰索家，七曰东屠，八曰倭人，九曰天鄙。" }
      - { type: j, text: "子曰：“吾自卫反鲁，然後乐正，《雅》、《颂》各得其所。”（郑曰：" }
      - { type: j, text: "“反鲁，哀公十一年冬，是时道衰乐废，孔子来还，乃正之，故《雅》、《颂》" }
      - { type: j, text: "各得其所。”）" }
      - { type: z, text: "“子曰：吾自卫反，鲁然後乐正，《雅》、《颂》各得其所。”○正义" }
      - { type: j, text: "曰：此章记孔子言正废乐之事也。孔子以定十四年去鲁，应聘诸国。鲁哀公十一" }
      - { type: j, text: "年，自卫反鲁，是时道衰乐废，孔子来还，乃正之，故《雅》、《颂》各得其所" }
      - { type: j, text: "也。○注“反鲁，鲁哀公十一年冬”。○正义曰：案《左传》哀十一年冬，“卫" }
      - { type: j, text: "孔文子之将攻大叔也，访於仲尼。仲尼曰：‘胡簋之事则尝学之矣，甲兵之事未" }
      - { type: j, text: "之闻也。’退，命驾而行，曰：‘鸟则择木，木岂能择鸟？’文子遽止之曰：" }
      - { type: j, text: "‘圉岂敢度其私，访卫国之难也。’将止，鲁人以币召之，乃归。”杜注云：" }
      - { type: j, text: "“於是自卫反鲁，乐正，《雅》、《颂》各得其所。”是也。" }
      - { type: j, text: "子曰：“出则事公卿，入则事父兄，丧事不敢不勉，不为酒困，何有於我哉？”" }
      - { type: j, text: "（马曰：“困，乱也。”）" }
      - { type: z, text: "“子曰：出则事公卿，入则事父兄，丧事不敢不勉，不为酒困，何有於" }
      - { type: j, text: "我哉？”○正义曰：此章记孔子言忠顺孝悌哀丧慎酒之事也。困，乱也。言出仕" }
      - { type: j, text: "朝廷，则尽其忠顺以事公卿也；入居私门，则尽其孝悌以事父兄也；若有丧事，" }
      - { type: j, text: "则不敢不勉力以从礼也，未尝为酒乱其性也。他人无是行，於我，我独有之，故" }
      - { type: j, text: "曰：何有於我哉。" }
      - { type: j, text: "子在川上曰：“逝者如斯夫！不舍昼夜。”（包曰：“逝，往也。言凡往也" }
      - { type: j, text: "者如川之流。”）" }
      - { type: z, text: "“子在川上曰：逝者如斯夫！不舍昼夜”。○正义曰：此章记孔子感叹" }
      - { type: j, text: "时事既往，不可追复也。逝，往也。夫子因在川水之上，见川水之流迅速，且不" }
      - { type: j, text: "可追复，故感之而兴叹，言凡时事往者，如此川之流夫，不以昼夜而有舍止也。" }
      - { type: j, text: "子曰：“吾未见好德如好色者也。”（疾时人薄於德而厚於色，故发此言。）" }
      - { type: z, text: "“子曰：吾未见好德如好色者也”。○正义曰：此章孔子疾时人薄於德" }
      - { type: j, text: "而厚於色也。" }
      - { type: j, text: "子曰：“譬如为山，未成一篑，止，吾止也。（包曰：“篑，土笼也。此劝" }
      - { type: j, text: "人进於道德。为山者，其功虽已多，未成一笼而中道止者，我不以其前功多而善" }
      - { type: j, text: "之，见其志不遂，故不与也。”）譬如平地，虽覆一篑，进，吾往也。”（马曰：" }
      - { type: j, text: "“平地者将进加功，虽始覆一篑，我不以其功少而薄之，据其欲进而与之。”）" }
      - { type: z, text: "“子曰”至“往也”。○正义曰：此章孔子劝人进於道德也。“譬如为" }
      - { type: j, text: "山，未成一篑，止，吾止也”者，篑，土笼也。言人之学道，垂成而止，前功虽" }
      - { type: j, text: "多，吾不与也。譬如为山者，其功虽已多，未成一笼，而中道止者，我不以其前" }
      - { type: j, text: "功多而善之，见其志不遂，故吾止而不与也。“譬如平地，虽覆一篑，进，吾往" }
      - { type: j, text: "也”者，言人进德业，功虽未多，而强学不息，则吾与之也。譬如平地者，将" }
      - { type: j, text: "进加功，虽始覆一篑，我不以其功少而薄之，据其欲进，故吾则往而与之也。" }
      - { type: j, text: "子曰：“语之而不惰者，其回也与！”（颜渊解，故语之而不惰。馀人不解，" }
      - { type: j, text: "故有惰语之时。）" }
      - { type: z, text: "“子曰：语之而不惰者，其回也与！”○正义曰：此章美颜回也。惰，" }
      - { type: j, text: "谓懈惰也。言馀人不能尽解，故有懈惰於夫子之语时。其语之而不懈惰者，其唯" }
      - { type: j, text: "颜回也与，颜渊解故也。" }
      - { type: j, text: "子谓颜渊，曰：“惜乎！吾见其进也，未见其止也。”（包曰：“孔子谓颜" }
      - { type: j, text: "渊进益未止，痛惜之甚。”）" }
      - { type: z, text: "“子谓颜渊，曰：惜乎！吾见其进也，未见其止也”。○正义曰：此章" }
      - { type: j, text: "以颜回早死，孔子於後叹惜之也。孔子谓颜渊进益未止，痛惜之甚也。" }
      - { type: j, text: "子曰：“苗而不秀者有矣！夫秀而不实者有矣夫！”（孔曰：“言万物有生" }
      - { type: j, text: "而不育成者，喻人亦然。”）" }
      - { type: z, text: "“子曰：苗而不秀者有矣夫！秀而不实者有矣夫！”○正义曰：此章亦" }
      - { type: j, text: "以颜回早卒，孔子痛惜之，为之作譬也。言万物有生而不育成者，喻人亦然也。" }
      - { type: j, text: "子曰：“後生可畏，焉知来者之不如今也？（後生谓年少。）四十、五十而" }
      - { type: j, text: "无闻焉，斯亦不足畏也已矣。”" }
      - { type: z, text: "“子曰”至“也已”。○正义曰：此章劝学也。“子曰：後生可畏，焉" }
      - { type: j, text: "知来者之不如今也”者，後生谓年少也。言年少之人，足以积学成德，诚可畏也，" }
      - { type: j, text: "安知将来者之道德不如我今日也？“四十、五十而无闻焉，斯亦不足畏也已”者，" }
      - { type: j, text: "言年少时不能积学成德，至於四十、五十而令名无闻，虽欲强学，终无成德，故" }
      - { type: j, text: "不足畏也。" }
      - { type: j, text: "子曰：“法语之言，能无从乎？改之为贵。（孔曰：“人有过，以正道告之，" }
      - { type: j, text: "口无不顺从之，能必自改之，乃为贵。”）巽与之言，能无说乎？绎之为贵。（" }
      - { type: j, text: "马曰：“巽，恭也。谓恭孙谨敬之言，闻之无不说者，能寻绎行之，乃为贵。”）" }
      - { type: j, text: "说而不绎，从而不改，吾末如之何也已矣。”" }
      - { type: z, text: "“子曰”至“已矣”。○正义曰：此章贵行也。“子曰：法语之言，能" }
      - { type: j, text: "无从乎？改之为贵”者，谓人有过，以礼法正道之言告语之，当时口无不顺从之" }
      - { type: j, text: "者。口虽服从，未足可贵，能必自改之，乃为贵耳。“巽与之言，能无说乎？绎" }
      - { type: j, text: "之为贵”者，巽，恭也；绎，寻绎也。谓以恭孙谨敬之言教与之，当时闻之，无" }
      - { type: j, text: "不喜说者。虽闻之喜说，未足可贵，必能寻绎其言行之，乃为贵也。“说而不绎，" }
      - { type: j, text: "从而不改，吾末如之何也已矣”者，谓口虽说从，而行不寻绎追改，疾夫形服而" }
      - { type: j, text: "心不化，故云末如之何，犹言不可奈何也。" }
      - { type: j, text: "子曰：“主忠信，毋友不如已者，过则勿惮改。”（慎所主友，有过务改，" }
      - { type: j, text: "皆所以为益。）" }
      - { type: z, text: "“子曰：主忠信，毋友不如己者，过则勿惮改”。○正义曰：此章戒人" }
      - { type: j, text: "忠信改过也。主犹亲也。惮犹难也。言凡所亲狎，皆须有忠信者也，无得以忠信" }
      - { type: j, text: "不如己者为友也。苟有其过，无难於改也。《学而篇》已有此文，记者异人，故" }
      - { type: j, text: "重出之。" }
      - { type: j, text: "子曰：“三军可夺帅也，匹夫不可夺志也。”（孔曰：“三军虽众，人心不" }
      - { type: j, text: "一，则其将帅可夺而取之。匹夫虽微，苟守其志，不可得而夺也。”）" }
      - { type: z, text: "“子曰：三军可夺帅也，匹夫不可夺志也。”○正义曰：此章言人守志" }
      - { type: j, text: "不移也。万二千五百人为军。帅，谓将也。匹夫，谓庶人也。三军虽众，人心不" }
      - { type: j, text: "一，则其将帅可夺而取之。匹夫虽微，苟守其志，不可得而夺也。士大夫已上有" }
      - { type: j, text: "妾媵，庶人贱，但夫妇相匹配而已，故云匹夫。" }
      - { type: j, text: "子曰：“衣敝袍，与衣狐貉者立而不耻者，其由也与？（孔曰：“，" }
      - { type: j, text: "著。”）‘不忮不求，何用不臧？’”（马曰：“忮，害也。臧，善也。言不忮" }
      - { type: j, text: "害，不贪求，何用为不善？疾贪恶忮害之诗。”）子路终身诵之。子曰：“是道" }
      - { type: j, text: "也，何足以臧？”（马曰：“臧，善也。尚复有美於是者，何足以为善？”）" }
      - { type: z, text: "“子曰”至“以臧”。○正义曰：此章善仲由也。“子曰：衣敝袍，" }
      - { type: j, text: "与衣狐貉者立而不耻者，其由也与”者，，著也。袍，衣之贱者。狐貉，" }
      - { type: j, text: "裘之贵者。常人之情，著破败之袍，与著狐貉之裘者并立，则皆惭耻。而能不" }
      - { type: j, text: "耻者，唯其仲由也与？“不忮不求，何用不臧”者，忮，害也。臧，善也。言不" }
      - { type: j, text: "忮害，不贪求，何用为不善？言仲由不忮害，不贪求，何用为不善？此《诗·邶" }
      - { type: j, text: "风·雄雉》之篇，疾贪恶忮害之诗也。孔子言之，以善子路也。“子路终身诵之”" }
      - { type: j, text: "者，子路以夫子善已，故常称诵之。“子曰：是道也，何足以臧”者，孔子见子" }
      - { type: j, text: "路诵之不止，惧其伐善，故抑之。言人行尚复有美於是者，此何足以为善？○注" }
      - { type: j, text: "“孔曰：，著”。○正义曰：《玉藻》云：“纩为茧，为袍。”郑玄云：" }
      - { type: j, text: "“衣有著之异名也。纩谓今之新绵，谓今纩及旧絮也。”然则今云著者，杂" }
      - { type: j, text: "用麻以著袍也。" }
      - { type: j, text: "子曰：“岁寒然後知松柏之後也。”（大寒之岁，众木皆死，然後知松柏" }
      - { type: j, text: "小伤；平岁则众木亦有不死者，故须岁寒而後别之。喻凡人处治世亦能自整，" }
      - { type: j, text: "与君子同；在浊世，然後知君子之正不苟容。）" }
      - { type: z, text: "“子曰：岁寒然後知松柏之後也”。○正义曰：此章喻君子也。大寒" }
      - { type: j, text: "之岁，众木皆死，然後知松柏小伤；若平岁，则众木亦有不死者，故须岁寒而" }
      - { type: j, text: "後别之。喻凡人处治世亦能自整，与君子同；在浊世，然後知君子之正不苟容" }
      - { type: j, text: "也。" }
      - { type: j, text: "子曰：“知者不惑，（包曰：“不惑乱。”）仁者不忧，（孔曰：“无忧患。”）" }
      - { type: j, text: "勇者不惧。”" }
      - { type: z, text: "“子曰：知者不惑，仁者不忧，勇者不惧”。○正义曰：此章言知者明" }
      - { type: j, text: "於事，故不惑乱；仁者知命，故无忧患；勇者果敢，故不恐惧。" }
      - { type: j, text: "子曰：“可与共学，未可与道；（，之也。虽学，或得异端，未必能之" }
      - { type: j, text: "道。）可与道，未可与立；（虽能之道，未必能有所立。）可与立，未可与权。" }
      - { type: j, text: "（“虽能”有所立，未必能权量其轻重之极。）“唐棣之华，偏其反而。岂不尔" }
      - { type: j, text: "思？室是远而”。（逸诗也。唐棣，多也，华反而後合。赋此诗者，以言权道" }
      - { type: j, text: "反而後至於大顺。思其人而不得见者，其室远也。以言思权而不得见者，其道远" }
      - { type: j, text: "也。）子曰：“未之思也，夫何远之有！”（夫思者，当思其反，反是不思，所" }
      - { type: j, text: "以为远。能思其反，何远之有！言权可知，唯不知思耳。思之有次序，斯可知矣。）" }
      - { type: z, text: "“子曰”至“之有”。○正义曰：此章论权道也。“子曰：可与共学，" }
      - { type: j, text: "未可与道”者，，之也。言人虽可与共学，所学或得异端，未必能之正道，" }
      - { type: j, text: "故未可与也。“可与道，未可与立”者，言人虽能之道，未必能有所立，故未" }
      - { type: j, text: "可与也。“可与立，未可与权”者，言人虽能有所立，未必能随时变通权量其轻" }
      - { type: j, text: "重之极也。“唐棣之华，偏其反而。岂不尔思，室是远而”者，此逸诗也。唐棣，" }
      - { type: j, text: "多也，其华偏然反而後合。赋此诗者，以言权道亦先反常而後至於大顺也。" }
      - { type: j, text: "“岂不尔思”者，言诚思尔也。诚思其人而不得见者，其室远也。以喻思权而不" }
      - { type: j, text: "得见者，其道远也。“子曰：未之思也，夫何远之有”者，言夫思者，当思其反" }
      - { type: j, text: "常。若不思是反，所以为远。能思其反，何远之有！言权可知，唯不知思尔。傥" }
      - { type: j, text: "能思之有次序，斯可知矣。记者嫌与诗言相乱，故重言“子曰”也。○注“唐棣，" }
      - { type: j, text: "多也”。○正义曰：《释木》文也。舍人曰：“唐棣一名多。”郭璞曰：" }
      - { type: j, text: "“似白杨，江东呼夫多。《诗·召南》云：唐棣之华。”陆机云：“奥李也。" }
      - { type: j, text: "一名雀梅，亦曰车下李。所在山皆有其华，或白或赤。六月中熟，大如李子，可" }
      - { type: j, text: "食。”" }
