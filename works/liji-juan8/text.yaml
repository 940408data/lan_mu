# 禮記正義卷8（孔穎達疏）：j 為經文＋鄭玄注，z 為疏文。
sections:
  - id: juan8
    name: 正文
    blocks:
      - { type: j, text: "子柳之母死，子碩請具。具，葬之器用。子柳，魯叔仲皮之子，子碩兄。○碩音石。子柳曰：“何以哉？”言無其財。子碩曰：“請粥庶弟之母。”粥，謂嫁之也。妾賤，取之曰買。○鬻，本又作“粥”，音育，賣也，注同。子柳曰：“如之何其粥人之母以葬其母也？不可。忠恕。既葬，子碩欲以賻布之餘具祭器。古者謂錢為泉布，所以通布貨財。子柳曰：“不可，吾聞之也，君子不家於喪。惡因死者以為利。○惡，烏路反。請班諸兄弟之貧者。”以分死者所矜也。祿多，則與鄰里鄉黨。" }
      - { type: z, text: "“子柳”至“貧者”。○正義曰：此一節論不粥人之母及因死為利之事，各依文解之。○注“子柳”至“碩兄”。正義曰：案下《檀弓》雲“叔仲皮學子柳”，故知子柳是叔仲皮之子。知“子碩兄”者，以此雲“子碩曰：請粥庶弟之母”，故知“子碩兄”也。○注“古者”至“貨財”。○正義曰：解布名也，言古者謂錢為泉布，所以然者，言其通流有如水泉而遍，布貨買天下貨財也。而鄭注《周禮》雲：“藏曰泉，其行曰布，取名於水泉，其流行無不遍也。”鄭又云：“泉始蓋一品，周景王鑄大泉而有二品，後數變易，不復識本制，至漢唯有五銖久行。”案鄭此者雲五銖者，其重五銖。凡十黍為一參，一參為一銖，二十四銖為一兩，故錢邊作“五銖”字也。鄭又云：“王莽改貨而異作泉布，多至十品。今存於民間多者，有貨布、大泉、貨泉。貨布長二寸五分，廣寸，首長八分有奇，廣八分，其圜好徑二分半，足枝長八分，其右文曰貨，左文曰布，重二十五銖，直貨泉二十五。大泉徑一寸二分，重十二銖，文曰大泉，直十五貨泉，貨泉徑一寸，重五銖，右文曰貨，左曰泉，直一也。”案《食貨志》雲今世謂之笮錢是也。邊猶為貨泉之字，大泉即今大四文錢也，四邊並有文也。貨布之形，今世難識，世人或耕地猶有得者，古時一個準二十五錢也。然古又有刀。刀有二種，一是契刀，一是錯刀也。契刀直五百，錯刀直一千。契刀無縷，而錯刀用金縷之。刀形如錢，而邊作刀字形也，故世猶呼錢為錢刀也。" }
      - { type: j, text: "君子曰：“謀人之軍師，敗則死之。謀人之邦邑，危則亡之。”利己亡眾，非忠也。言亡之者，雖闢賢，非義退。" }
      - { type: j, text: "公叔文子升於瑕丘，蘧伯玉從。二子，衛大夫。文子，獻公之孫，名拔。○蘧，木又作璩，其魚反。從，才用反，又如字。拔，皮八反，徐蒲末反。文子曰：“樂哉，斯丘也！死則我欲葬焉。”蘧伯玉曰：“吾子樂之，則瑗請前。刺其欲害人良田。瑗，伯玉名。○樂音洛，下同，一讀下樂，五教反。瑗，於卷反，又於原反。剌，七賜反。" }
      - { type: z, text: "“公叔”至“請前”。○正義曰：此一節論蘧伯玉仁者，剌文子欲害人良田之事。○注“文子，獻公之孫，名拔”。○正義曰：案《世本》雲：“獻公生成子當，當生文子拔，拔生朱，為公叔氏。”" }
      - { type: j, text: "弁人有其母死而孺子泣者。言聲無節。○弁，皮彥反。孺，而注反。孔子曰：“哀則哀矣，此誠哀。而難為繼也。失禮中。夫禮，為可傳也，為可繼也，故哭踴有節。”○傳，直專反。" }
      - { type: z, text: "“弁人”至“有節”。○正義曰：此一節論孔子譏弁人哀過之事。○“而難為繼也”者，此哀之深，後人無能繼學之者也。○“夫禮，為可傳也，為可繼也，故器踴有節”者，又廣述其難繼為失也。夫聖人禮制，使後人可傳可繼，故製為哭踴之節，以中為度耳，豈可過甚，皆使後人不可傳繼乎？然《雜記》：“曾申問於曾子曰：“哭父母有常聲乎？’曰：‘中路嬰兒失其母，何常聲之有？’”則與此違者，雲曾子所言，是始死之時，悲哀志懣，未可為節。此之所言，在襲斂之後，可以制禮，故哭踴有節也。所以知然者，曾申之問，泛問於哭時，故知舉重時答也。此之所言哭踴有節，節哭之時，在於後也。" }
      - { type: j, text: "叔孫武叔之母死，武叔，公子牙之六世孫，名州仇，毀孔子者。既小斂，舉者出戶，出戶袒，且投其冠，括髮。屍出戶，乃變服，失哀節。冠，素委貌。○括，古活反。子游曰：“知禮。”嗤之。○嗤，昌之反。" }
      - { type: z, text: "“叔孫”至“知禮”。○正義曰：此一節論武叔失禮之事，各依文解之。○注“武叔”至“子者”。○正義曰：案《世本》：“桓公生僖叔牙，牙生戴伯茲，茲生莊叔得臣，臣生穆叔豹，豹生昭子婼，婼生戌子不敢，敢生武叔州仇。”仇是公子牙六世孫，故云“公子牙六世孫”也。雲“毀孔子者”，《論語》雲“叔孫武叔毀仲尼”是也。○注“屍出”至“委貌”。○正義曰，案《士喪禮》“卒斂徹帷，主人西面馮屍，踴，無筭，主婦東面馮，亦如之。主人髻發，袒，眾主人免”。下雲：“士舉，男女奉屍，夷於堂。”《喪大記》亦云：“卒小斂，主人袒，說髦，括髮以麻。”下雲：“奉屍夷於堂。”是括髮在小斂之後，奉屍夷於堂之前，主人為欲奉屍，故袒而括髮在前。今武叔奉屍夷堂之後，乃投冠括髮，故云“屍出戶，乃變服，失哀節”。雲“冠，素委貌”者，案《雜記》雲：“小斂環絰，公、大夫、士一也。”注云：“士素委貌，大夫以上素爵弁，而加此絰焉。”鄭知然者，以《喪大記》雲：“君將大斂，子弁絰。”大夫大斂無文，明亦弁絰，大斂既爾，明小斂亦然，故云大夫以上弁絰。案武叔投冠，武叔是諸侯大夫，當天子之士，故云：“士素委貌。若然，案《士喪禮》主人括髮，鄭注云“始死，將斬衰者雞斯，將括髮者去笄，纚而紒”，無素委貌者，熊氏雲：“《士喪禮》謂諸侯之士，故無素冠也。”崔氏雲：“將小斂之時已括髮，括髮後，大夫以上加素弁，士加素委貌。至小斂訖，乃投去其冠，而見括髮。”今案《士喪禮》及《大記》皆小斂卒，乃括髮，無小斂之前為括髮者，崔氏之言非也。案《士喪禮》小斂括髮，鄭注《喪服》變除雲：“襲而括髮者，彼據大夫以上之禮，死之明日而襲，與士小斂同日，俱是死後二日也。”鄭注《士喪禮》一括髮之後，比至大斂自若。所以《大記》雲：“小斂，主人袒，說髦，括髮。”是諸侯小斂之時更括髮者，崔氏雲：“謂說去其髦，更正括髮，非重為括髮也。”○“子游曰知禮”。○子游是習禮之人，見武叔失禮，反謂之“知禮”，故知嗤之也。" }
      - { type: j, text: "扶君，卜人師扶右，射人師扶左。謂君疾時也。卜當為僕，聲之誤也。僕人、射人，皆平生時贊正君服位者。○卜人師，依注音僕；師，長也，謂大僕也；本或無“師”字者，非也。前儒如字，卜人及醫師也。君薨，以是舉。不忍變也。《周禮·射人》：“大喪，與僕人遷屍。”" }
      - { type: z, text: "“扶君”至“是舉”。○正義曰：此一節論君薨，所舉遷屍之人。○注“謂君”至“位者”。○正義曰：知是“君疾時”者，以下雲“君薨，以是舉”，故知君疾時也。知卜當為僕者，以卜人無正君之事。案《周禮·大僕職》：“掌兆荃之服位。”《射人職》：“掌國之三公孤卿大夫之位。”及王舉動，悉隨王。故知也。" }
      - { type: j, text: "從母之夫，舅之妻，二夫人相為服，君子未之言也。二夫人猶言此二人也。時有此二人同居，死相為服者，甥居外家而非之。○從，才用反。夫人音扶，注同。為，於偽反，注及下注“夫為妻”同或曰，同爨緦。以同居生緦之親可。○爨緦，上七亂反，下音思。" }
      - { type: z, text: "“從母”至“爨緦”。○正義曰：此一節論失禮之事，各依文解之。○注“時有”至“非之”。○正義曰：知“同居”者，以下雲“同爨緦”，故知同居也。雲“甥居外家而非之”者，以言從母及舅，皆是外甥稱謂之辭，故知甥也。若他人之言，應雲妻之兄弟婦、夫之姊妹夫相為服，不得雲“從母之夫，舅之妻”也。言“甥居外家而非之”者，謂甥來居在外姓舅氏之家，見有此事而非之。或雲“外家”者，以二人同住甥居外旁之家，遙譏之。○“或曰同爨緦”者，甥既將為非禮，或人以為於禮可許，既同爨而食，合有緦麻之親。此皆據緦麻正衰，非吊服也，故云“相為服”。若是吊服，疏人皆可，何怪此二人。何胤以為吊服加麻絰如朋友然，非也。凡吊服不得稱服，故上雲“請喪夫子若喪父而無服”，時朋友吊服而稱無服，故知此“相為服”非吊服也。" }
      - { type: j, text: "喪事欲其縱縱爾，趨事貌。縱，讀如“總領”之總。○縱，依注音總，急遽貌。吉事欲其折折爾。安舒貌。《詩》雲：“好人提提”。○折，大兮反，注同。故喪事雖遽不陵節，吉事雖止不怠。陵，躐也。止，立俟事時也。怠，惰也。○躐，力輒反。惰，徒臥反。故騷騷爾則野，謂大疾。○騷，素刀反，急疾貌。大音泰，一音他佐反，下注同。鼎鼎爾則小人，謂大舒。君子蓋猶猶爾。疾舒之中。" }
      - { type: z, text: "“喪事”至“猶爾”。○正義曰：此一節論吉凶趨容之事，各依文解之。○注“《詩》雲：好人提提”。○正義曰：所引者《魏風·葛屨》之詩也。魏俗褊薄，遣新來婦人縫作衣裳，故述而剌之雲，美好婦人，初來之時提提然。引之者，證安舒之意。○“故喪”至“猶爾”。○正義曰：以上喪事欲疾，吉事欲舒，因上生下，故云喪事雖須促遽，亦當有常，不得陵越喪禮之節。吉事雖有行止住之時，不得怠墮寬慢。故喪事騷騷爾，過為急疾，則如田野之人，急切無禮。若吉事鼎鼎爾，不自嚴敬，則如小人然，形體寬慢也。若君子之人，於喪事之內得疾之中，於吉事之內得舒之中。蓋行禮之時，明閒法，則志意猶猶然。猶猶是曉達之貌。" }
      - { type: j, text: "喪具，君子恥具。闢不懷也。喪具，棺衣之屬。一日二日而可為也者，君子弗為也。謂絞、紟、衾、冒。○絞，戶交反，後同。紟，其蔭反。冒，莫報反。" }
      - { type: z, text: "“喪具”至“弗為也”。○正義曰：此一節論孝子備喪具之事，各依文解之。○注“闢不”至“之屬”。○正義曰：此“闢不懷”，宣八年《左傳》雲：“禮，卜葬先遠日，闢不懷也。”懷，思也。葬用近日，則是不思念其親。今送死百物皆具，是速棄其親。今未即辦具，是闢不思親之事也。雲“喪具，棺衣之屬”者，棺即預造，衣亦漸制，但不一時頓具，故《王制》雲“六十歲制，七十時制，八十月制，九十日修。唯絞、紟、衾、冒，死而後制”是也。" }
      - { type: j, text: "喪服，兄弟之子猶子也，蓋引而進之也。嫂叔之無服也，蓋推而遠之也。或引或推，重親遠別。○遠，於萬反。別，彼列反。姑姊妹之薄也，蓋有受我而厚之者也。欲其一心於厚之者，姑姊妹嫁大功，夫為妻期。○期音基。" }
      - { type: z, text: "“喪服”至“者也”。○正義曰：《喪服》是《儀禮》正經，記者錄《喪服》中有下三事，各以釋之。其兄弟之子期，姑姊妹出適大功，皆《喪服》經文，嫂叔無服，《喪服》傳文。所以嫂叔無服，進在姑姊妹之上者，取或引或推，二者相對。其子服重，是引而進之，其嫂無服，是推而遠之。並雲“蓋”者，記人雖解其義，猶若不審然，故謙而言“蓋”。○注“或引”至“遠別”。○正義曰：已子服期，今昆弟之子亦服期，牽引進之，同於已子。案《喪服》傳：“昆弟之子期報之也。”此雲“引”者，《喪服》有世父母叔父母期，又云昆弟之子，何以亦期也？有相報答之義，故云“報”也。已子服期，昆弟之子應降一等服大功，今乃服期，故云“引”也。二文相兼乃備。或推者，昆弟相為服期，其妻應降一等服大功，今乃使之無服，是推使疏而斥遠之也。言“重親”解“或引”，言“遠別”解“或推”。“遠別”者，何平叔雲：“夫男女相為服，不有骨肉之親，則有尊卑之異也。嫂叔親非骨肉，不異尊卑，恐有混交之失，推使無服也。”○“姑姊妹之薄也”者，未嫁之時為之厚，今姑姊妹出嫁之後為之薄，蓋有夫婿受我之厚而重親之，欲一心事於厚重，故我為之薄。" }
      - { type: j, text: "食於有喪者之側，未嘗飽也。助哀戚也。" }
      - { type: j, text: "曾子與客立於門側，其徒趨而出。徒，謂客之旅。曾子曰：“爾將何之？”曰：“吾父死，將出哭於巷。”以為不可發兇於人之館。曰：“反哭於爾次。”次，舍也。禮：館人使專之，若其自有然。曾子北面而吊焉。" }
      - { type: z, text: "“曾子”至“吊焉”。○正義曰：此一節論館客使如其己有之事。○“曰：反哭於爾次”者，於時立曾子之門，故曾許其反哭於汝次舍之處。依禮，喪主西面，曾子所以北面吊者，案《士喪禮》主人西面，其賓亦在東門北面，謂同國之賓，曾子既許其哭於次，故以同國賓禮北面吊焉。" }
      - { type: j, text: "孔子曰：“之死而致死之，不仁而不可為也。之死而致生之，不知而不可為也。之，往也。死之、生之，謂無知與有知也。為，猶行也。○知音智。是故竹不成用，瓦不成味，木不成斫，成猶善也，竹不可善用，謂邊無縢。味當作沫。沫，靧也。○味依注音沫，亡曷反。斫，陟角反。縢本又作滕，徒登反。靧音悔，洗面。琴瑟張而不平，竽笙備而不和，無宮商之調。○竽笙音於，下音生。和，胡臥反。調，直吊反。有鐘磬而無簨虡。不縣之也。橫曰簨，植曰虡。○簨，息允反。虡音巨。植，時力反，又音值。其曰明器，神明之也。”言神明死者也。神明者，非人所知，故其器如此。" }
      - { type: z, text: "“孔子”至“之也”。○正義曰：此一節論生人於死者不可致死致生之事。○“之死而致死之”者，之，往也。謂生者，以物往送葬於死者，而致死之意，謂之無復有知，是不仁之事也，而不可為也。○“之死而致生之”者，謂以物往送葬者，而雖死猶致生之意，是不知之事，而不可為也。○注“之往”至“知也”。○正義曰：謂生者以物往送死者，故何胤雲：“言往死者處而致此死之者之意，謂死如草木無知，如此用情則不仁，不可行於世也。往死者處而致此死者於全生之物，則不知而不可行也。舍此二塗，不仁不知之間，聖人之所難言，付之不測之竟，言‘無知與有知’者，即下雲‘夏后氏用明器，示民無知。殷人用祭器，示民有知‘也。’”。○“是故竹不成用”者，聖人為教，使人子不死於亡者，不便謂無知，不生於死者，不便謂有知，故制明器，以神明求之。不死不生，不可測也。成，善也。故為器用並不精善也。竹不善用，謂竹器邊無縢緣也。何胤雲：“若全無知，則不應用。若全有知，則亦不應不成。故有器不成，是不死不生也。”○“瓦不成味”者，味猶黑光也。今世亦呼黑為沫也。瓦不善沫，謂瓦器無光澤也。○“木不成斫”者，斫，雕飾也，木不善斫。鄭注云：“味當作沫，沫，靧也。”靧謂靧面，證沫為光澤也。“琴瑟張而不平”者，亦張弦而不調平也。○“竽笙備而不和”者，亦備而無宮商之調和也。“有鐘磬而無簨虡”者，簨虡，縣鐘磬格也，亦有鐘磬而不用格縣掛之。鄭雲“不縣之也”者，案《典庸器》雲：“大喪廞筍虡。”明知有而不縣之也。雲“橫曰簨、植曰虡”者，虡，距也，以用力，故曰虡也。○注“言神”至“所知”。○正義曰：神明微妙無方，不可測度，故云“非人所知”也。" }
      - { type: j, text: "有子問於曾子曰：“問喪於夫子乎？”有子，孔子弟子有若也。夫子卒後問此，庶有異聞也。喪，謂仕失位也。魯昭公孫於齊曰：“喪人其何稱。”○問喪，問或作聞。喪，息浪反，注及下皆同。孫音遜。曰：“聞之矣，喪欲速貧，死欲速朽。”有子曰：“是非君子之言也。”貧、朽，非人所欲。○朽，許久反。曾子曰：“參也聞諸夫子也。”有子又曰：“是非君子之言也。”曾子曰：“參也與子游聞之。”有子曰：“然，然則夫子有為言之也。”曾子以斯言告於子游。子游曰：“甚哉！有子之言似夫子也。昔者夫子居於宋，見桓司馬自為石槨，三年而不成。桓司馬，宋向戌之孫，名魋。○有為，於偽反，下“為桓司馬”、“為敬叔”、“則為之”、注“為民作”、“為嫁母”皆同。向，式上反。戌音恤。魋，大回反。夫子曰：‘若是其靡也，死不如速朽之愈也。’死之欲速朽，為桓司馬言之也。靡，侈。○侈，昌氏反，又申氏反。南宮敬叔反，必載寶而朝。敬叔，魯孟僖子之子仲孫閱。蓋嘗失位去魯，得反，載其寶來朝於君。○朝，直遙反，注同。僖，許宜反。閱音悅。夫子曰：‘若是其貨也，喪不如速貧之愈也。’喪之欲速貧，為敬叔言之也。”曾子以子游之言告於有子，有子曰：“然，吾固曰非夫子之言也。”曾子曰：“子何以知之？”有子曰：“夫子制於中都，四寸之棺，五寸之槨，以斯知不欲速朽也。中都，魯邑名也。孔子嘗為之宰，為民作制。孔子由中都宰為司空，由司空為司寇。昔者夫子失魯司寇，將之荊，將應聘於楚。○應，應對之應。蓋先之以子夏，又申之以冉有，以斯知不欲速貧也。”言汲汲於仕得祿。○伋音急。" }
      - { type: z, text: "“有子”至“貧也”。○正義曰：此一節論喪不欲速貧、死不欲速朽之事，各隨文解之。○“有子問於曾子”者，此孔子卒後，弟子相問，冀有所異聞也。“問喪”，謂問失本位居他國禮也。有子問於曾子云：“汝曾聞失位在他國之禮於孔子否乎？”○注“有子”至“何稱”。正義曰：案《仲尼弟子傳》：“有若，少孔子四十三歲。”彼注云：“魯人也。”“曾參，南武城人，字子輿，少孔子四十六歲。”雲“魯昭公孫於齊曰：喪人其何稱”者，引《公羊》，證失位者稱喪也。昭公孫於齊，次於楊州，齊侯唁公於野井，昭公曰：“喪人其何稱。”○“有子”至“言也”。○以曾子云“喪欲速貧，死欲速朽”，有子云：“如是之語，非君子之言也。”夫子既是君子，必不為此言。時有子唯問喪，不問死，曾子以喪、死二事報有子者，以喪、死俱為惡事，貧、朽又事類相似。既言“喪欲速貧”，遂言“死欲速朽”。案此“速貧”在前，“速朽”在後，而下子游之對，先雲“死欲速朽”，後言“喪欲速貧”，隨孔子所見言之先後也。且孔子為中都宰之時，制其棺槨，不用速朽，其事在前。夫子失魯司寇，使子夏、冉有先適楚，不欲速貧，其事在後，故子游先言“速朽”，後言“速貧”，亦隨夫子之事前前後。○注“桓司”至“名魋”。○正義曰：案《世本》：“向戌生東鄰叔子超，超生左師眇，眇即向巢也”。魋是巢之弟，故云向戌孫也。○注“孔子”至“司寇”。○正義曰：《孔子世家》，定公九年，孔子年五十，定公以孔子為中都宰。一年，四方皆則之。由中都宰為司空，由司空為司寇，定公十年會於夾谷，攝相事。此雲“司寇”者，崔靈恩雲：“諸侯三卿，司徒兼冢宰，司馬兼宗伯，司空兼司寇，三卿之下，則五小卿為五大夫，故《周禮·太宰職》雲：‘諸侯立三卿五大夫也。’五大夫者，司徒之下立二人，小宰、小司徒；司馬之下，以其事省，立一人為小司馬，兼宗伯之事；司空之下立二人，小司寇、小司空。今夫子為司空者，為小司空也，從小司空為小司寇也。”崔所以知然者，魯有孟、叔、季三卿為政，又有臧氏為司寇，故知孔子為小司寇，崔解可依。○“昔夫”至“之荊”。○案《世家》定十四年，齊人歸女樂，孔子去魯適衛。從衛之陳，過匡邑，匡人圍之。又復去，過蒲，又反於衛。又去衛，過曹，適宋。時定公卒，宋桓魋欲殺孔子，伐夫子所過之樹，削夫子所過之跡。去宋，適鄭。去鄭，適陳，居三歲，又適衛。既不見用，將西見趙簡子，至河而聞殺竇鳴犢與舜華也。又反於衛，復行如陳。時哀公三年，孔子年六十。明年孔子自陳遷於蔡。三歲，孔子在陳蔡之間，楚使人聘孔子，陳蔡乃圍孔子，絕糧乏食七日。於是使子貢至楚，楚昭王興師迎孔子，將書社七百里封孔子，楚令尹子西諫而止之。是歲楚昭王卒，孔子自楚反於衛，孔子年六十三，是魯哀公六年。以此言之，失司寇在定十四年，之楚在哀公六年，其間年月甚遠。且失司寇之後，向宋不向楚。而云“失魯司寇，將之荊”者，謂失魯司寇之後，將往之荊，則哀公六年之荊，亦是失司寇之後，非謂失司寇之年即之荊也。" }
      - { type: j, text: "陳莊子死，赴於魯，魯人欲勿哭，君無哭鄰國大夫之禮。陳莊子，齊大夫陳恆之孫，名伯。繆公召縣子而問焉。縣子曰：“古之大夫，束脩之問不出竟，雖欲哭之，安得而哭之？以其不外交。○繆音木。竟音境。今之大夫，交政於中國，雖欲勿哭，焉得而弗哭？言時君弱臣強，政在大夫，專盟會以交接。○焉，於虔反。且臣聞之，哭有二道，有愛而哭之，有畏而哭之。”以權微勸之。公曰：“然，然則如之何而可？”縣子曰：“請哭諸異姓之廟。”明不當哭。於是與哭諸縣氏。" }
      - { type: z, text: "“陳莊”至“縣氏”。○正義曰：此一節論哭鄰國臣之法。○注“陳莊”至“名伯”。○正義曰：案《世本》：“成子當生襄子班，班生莊子伯。”鄭依《世本》知也。" }
      - { type: j, text: "仲憲言於曾子曰：“夏后氏用明器，示民無知也。所謂“致死之”。仲憲，孔子弟子原憲。殷人用祭器，示民有知也。所謂“致生之”。周人兼用之，示民疑也。”言使民疑於無知與有知。曾子曰：“其不然乎，其不然乎！非其說之非也。夫明器，鬼器也。祭器，人器也。夫古之人，胡為而死其親乎？”言仲憲之言，三者皆非。此或用鬼器，或用人器。" }
      - { type: z, text: "“仲憲”至“親乎”。○正義曰：此一節論不可致意於死人為死為生之事，各隨文解之。○注“仲憲，孔子弟子原憲”。○正義曰：案《仲尼弟子傳》雲：“原憲字子思。”彼注云：“魯人也。”其時與曾子評論三代送終器具之義也。○“曰夏後”至“親乎”。○此以下是原憲所說，並非也。其言夏后氏所以別作明器送亡人者，言亡人無知，故以不堪用之器送之，表示其無知也。○“殷人用祭器，示民有知也”者，憲又言殷家不別作明器，而即用祭祀之器送亡人者，祭器堪為人用，以言亡者有知，與人同，故以有用之器送之，表示其有知也。○“周人兼用之，示民疑也”者，憲又言周世並用夏、殷二代之器送亡者，不知定無知如夏，為當定有知如殷，周人為之致惑，不可定者，故並用送之，是示於民疑惑不定也。○”曾子曰：其不然乎，其不然乎”者，曾子聞憲所說不是，故重稱不然，深鄙之也。○“夫明器，鬼器也。祭器，人器也”者，曾子鄙憲言畢，而自更說其義也。言二代用此器送亡者，非是為有知與無知也，正是質文異耳。夏代文，言鬼與人異，故純用鬼器送之，非言為無知也。殷世質，言雖復鬼與人有異，亦應恭敬是同，故用恭敬之器，仍貯食送之，非言為有知也。說二代既了，則周兼用之，非為疑可知，故不重說。尋周家極文，言亡者亦宜鬼事，亦宜敬事，故並用鬼敬二器，非為示民言疑惑也。然周唯大夫以上兼用耳，士唯用鬼器，不用人器。崔靈恩雲：“此王者質文相變耳。”○“夫古之人，胡為而死其親乎”者，曾子說義既竟，又更鄙於仲憲所言也。“古”謂夏時也，言古人雖質，何容死其親乎？若是無知，則是死之義也。然憲子言三事皆非，而曾子此獨譏“無知”者，以夏后氏尤古故也。譏一，則餘從可知也。" }
      - { type: j, text: "公叔木有同母異父之昆弟死，問於子游。木當為朱，《春秋》作戌，衛公叔文子之子，定公十四年奔魯。○木音式樹反，又音朱，徐之樹反。子游曰：“其大功乎？”疑所服也，親者屬大功是。狄儀有同母異父之昆弟死，問於子夏，子夏曰：“我未之前聞也。魯人則為之齊衰。”狄儀行齊衰。今之齊衰，狄儀之問也。" }
      - { type: z, text: "“公叔木有同母異父之昆弟死，問於子游”至“狄儀之問也”。○正義曰：此一節論為同母異父昆弟死著服得失之事，各依文解之。○注“木當為朱”至“十四年奔魯”。○正義曰：案《世本》“衛獻公生成子當，當生文子拔，拔生朱”。故知“木當為朱”也。言“《春秋》作戌”者，定十四年“衛公叔戌來奔”是也。○注“疑所服也，親者屬大功是”。正義曰：同母異父昆弟之服，《喪服》無文，故子游疑之：“其大功乎？”“乎”是疑辭也。雲“親者屬大功是”者，鄭意以為同母兄弟，母之親屬服大功是也。所以是者，以同父同母則服期，今但同母，而以母是我親生，其兄弟是親者血屬，故降一等而服大功，案《聖證論》王肅難鄭：“禮，稱親者血屬，謂出母之身，不謂出母之子服也。若出母之子服大功，則出母之父母服應更重，何以為出母之父母無服？”王肅雲：“同母異父兄弟服大功者，謂繼父服齊衰，其子降一等，故服大功。”馬昭難王肅雲：“異父昆弟，恩繼於母，不繼於父，肅以為從繼父而服，非也。”張融以為繼父同居有子，正服齊衰三月，乃為其子大功，非服之差，互說是也。○“今之齊衰，狄儀之問也”。○不雲自狄儀始者，庾蔚雲：“狄儀之前，魯人先已行之，故不雲自狄儀始也。”" }
      - { type: j, text: "子思之母死於衛，子思，孔子孫，伯魚之子。伯魚卒，其妻嫁於衛。柳若謂子思曰：“子，聖人之後也。四方於子乎觀禮，子蓋慎諸。”柳若，衛人也。見子思欲為嫁母服，恐其失禮，戒之。嫁母齊衰期。子思曰：“吾何慎哉？吾聞之：‘有其禮，無其財，君子弗行也。謂時可行，而財不足以備禮。有其禮，有其財，無其時，君子弗行也。’謂財足以備禮，而時不得行者。吾何慎哉？”時所止則止，時所行則行，無所疑也。喪之禮如子，贈襚之屬，不逾主人。○襚音遂。" }
      - { type: z, text: "“子思”至“慎哉”。○正義曰：此一節論為出嫁母之喪行禮之事。○注“子思，孔子孫，伯魚之子”。○正義曰：《孔子世家》文。鄭言之者，以下雲“子，聖人之後”，故具言之。○注“柳若”至“衰期”。○正義曰：雲“嫁母齊衰期”者，嫁母之服，《喪服》無文。案《喪服》杖期章雲：“父卒，繼母嫁，從為之服報”，則親母可知。故鄭約雲“齊衰期也”。又鄭止言“齊衰期”，不言嫡庶，故譙周、袁準並雲：“父卒，母嫁，非父所絕。嫡子雖主祭，猶宜服期。而《喪服》為出母期，嫁母與出母俱是絕族，故知與出母同也。”張逸問舊儒：“《世本》皆以孔子後數世皆一子，禮，適子為父後，為嫁母無服。《檀弓》說子思從於嫁母服，何？”鄭答雲：“子思哭嫂為位，必非適子，或者兄若早死，無繼，故云數世皆一子。”○注“謂財”至“行者”。○正義曰：謂若嫁母之家主人貧乏，斂手足形還葬，已雖有財，不得過於主人。故下注“喪之禮如子，贈襚之屬，不逾主人”是也。" }
      - { type: j, text: "縣子曰：“吾聞之，古者不降，上下各以其親。古謂殷時也。上不降遠，下不降卑。○，息果反，依字作瑣。滕伯文為孟虎齊衰，其叔父也。為孟皮齊衰，其叔父也。”伯文，殷時滕君也。爵為伯，名文。○滕，徒登反。為，於偽反。下及下注“為人”同。" }
      - { type: z, text: "“縣子”至“父也”。○正義曰：此一節論古者著服上不降遠，下不降卑之事，各依文解之。○瑣，縣子名。據所聞而言也，“古者不降”，所聞之事也。古者，殷時也。周禮以貴降賤，以適降庶，唯不降正耳。而殷世以上，雖貴不降賤也。“上下各以其親”，不降之事也。“上”謂旁親，族曾祖、從祖及伯叔之班族。“下”謂從子從孫之流。彼雖賤，不以己尊降之，猶各隨本屬之親輕重而服之，故云“上下各以其親”。庾蔚雲：“上下猶尊卑也。正尊，周禮猶不降，則知所明者旁尊也。鄭恐尊名亂於正尊，故變文言‘遠’也。”○“滕伯”至“父也”。○謂滕國之伯名文，為叔父孟虎著齊衰之服，其虎是滕伯文叔父也。“為孟皮齊衰，其叔父也”，謂滕伯為兄弟之子孟皮著齊衰之服，其滕伯是皮之叔父也。言滕伯上為叔父、下為兄弟之子，皆著齊衰，是“上不降遠，下不降卑”也。" }
      - { type: j, text: "後木曰：“喪，吾聞諸縣子曰：‘夫喪，不可不深長思也。後木，魯孝公子惠伯鞏之後。○{鞏恭}，恭勇反。買棺外內易。’我死則亦然。”此孝子之事，非所託。○易，以豉反。" }
      - { type: z, text: "“後木”至“亦然”。○正義曰：此一節論屬子以死事非禮之事，各依文解之。○後木雲：“孝子居喪之禮，吾聞之於縣子云：‘夫居喪不可不深思長慮也。孝子既深思長慮，故買棺之時，當令精好，斫削外內，使之平易。’”後木既述縣子之言，以語其子，又云：“在後我身若死，則亦當然。”“然”猶如是，我死亦當如是縣子之言，買棺外內易也。○注“後木”至“之後”。○正義曰：案《世本》：“孝公生惠伯革，其後為厚氏。”《世本》雲“革”，此雲“鞏”，《世本》雲“厚”，此雲“後”，其字異耳。則惠伯之子孫，無名木者，故鄭直雲其後。○注此“此孝”至“所託”。○正義曰：言買棺外內滑易者，此是孝子所為之事，非是父母豫所屬託，譏後木也。" }
      - { type: j, text: "曾子曰：“屍未設飾，故帷堂，小斂而徹帷。”仲樑子曰：“夫婦方亂，故帷堂，小斂而徹帷。”斂者，動搖屍，帷堂，為人褻之。言“方亂”，非也。仲樑子，魯人也。○帷，意悲反。○小斂之奠，子游曰：“於東方。”曾子曰：“於西方，斂斯席矣。”曾子以俗說非。又大斂奠於堂，乃有席。小斂之奠在西方，魯禮之末失也。末世失禮之為。" }
      - { type: z, text: "“曾子”至“失也”。○正義曰：此一節論小斂失禮之事，各依文解之。○注“言方”至“人也”。○正義曰：知“方亂，非”者，以小斂之後，豈無夫婦方亂之事，何故徹帷乃雲“方亂”？明為動搖屍柩，故帷堂。案《春秋》定五年，魯有仲梁懷，是仲梁，魯人之姓，故知“仲樑子，魯人也”。○“曾子”至“西方”。○依禮，小斂之奠設於東方，奠又無席，魯之衰末，奠於西方，而又有席，曾子見時如是，謂將為禮，故云小斂於西方。“斯”，此也。其斂之時，於此席上而設奠矣。曾子之言失禮，故記者正之雲，小斂奠所以在西方，是魯人行禮，末世失其法也。○注“曾子”至“有席”。○正義曰：知曾子所言非者，案《士喪禮》“小斂之奠，設於屍東”，今曾子言西方，故為非也。雲“大斂奠於堂，乃有席”者，案《士喪禮》“大斂之奠設於室”，今雲堂者，後人轉寫之誤，當雲奠於室，故鄭答趙商：“堂當為室也。”" }
      - { type: j, text: "縣子曰：“綌衰、繐裳，非古也。”非時尚輕涼慢禮。○綌衰，去逆反，粗葛也，下七回反。繐音歲，布細而疏曰繐。涼音良。" }
      - { type: z, text: "“縣子”至“古也”。○正義曰：此以下論縣子非當時人尚輕涼慢禮之事。綌，葛也。繐，布疏者，漢時南陽鄧縣能作之。當記時失禮，多尚輕細，故有喪者不服粗衰，但疏葛為衰，繐布為裳，故云“非古”也，“古”謂周初制禮時也。" }
      - { type: j, text: "子蒲卒，哭者呼滅。滅，蓋子蒲名。子皋曰：“若是野哉！”非之也。唯復呼名。子皋，孔子弟子高柴。○皋音高。哭者改之。" }
      - { type: z, text: "“子蒲”至“改之”。○正義曰：此一節論哭者呼名非禮之事。滅，子蒲名。子蒲卒，哭者呼其名，故子皋曰：“若是野哉！”野，不達禮也。唯復呼名，冀其聞名而反，哭則敬鬼神，不復呼其名，而此家哭獨呼滅，子皋深譏之，故云“野哉”也。非之乃改也。" }
      - { type: j, text: "杜橋之母之喪，宮中無相，以為沽也。沽猶略也。○相，息亮反。沽音古。" }
      - { type: z, text: "“杜橋”至“沽也”。○正義曰：此一節論喪須立相導之事。沽，粗略也。禮，孝子喪親，悲迷不復自知，禮節事儀，皆須人相導。而杜橋家母死，宮中不立相侍，故時人謂其於禮為粗略。" }
      - { type: j, text: "夫子曰：“始死，羔裘、玄冠者，易之而已。”羔裘、玄冠，夫子不以吊。不以吉服吊喪。○易音亦，徐以豉反。" }
      - { type: z, text: "“夫子”至“以吊”。○正義曰：此一節論始死易服，小斂後不得吉服吊之事。但養疾者朝服，羔裘、玄冠，即朝服也。始死則易去朝服，著深衣，故云“易之而已”。記時有不易者，又有小斂後羔裘吊者，記人引《論語·鄉黨》孔子身自行事之禮，以譏當時之事，故曰“羔裘玄冠，夫子不以吊”。時多失禮，唯孔子獨能行之，故言之也。" }
      - { type: j, text: "子游問喪具。夫子曰：“稱家之有亡。”子游曰：“有無惡乎齊？”惡乎齊，問豐省之比。○稱，尺證反。有亡，皇如字，無也，一音無，下同。惡音烏，注同。齊，才細反，又如字，注同。省，所領反。比，必利反。夫子曰：“有，毋過禮。苟亡矣，斂首足形，形，體。○毋音無。還葬，還之言便也。言已斂即葬，不待三月。○還音旋。斂，力驗反。縣棺而封。不設碑繂，不備禮。封當為窆，窆，下棺也。《春秋傳》作“塴”。○縣音玄。封依注作窆，彼驗反，徐又甫鄧反。碑，彼皮反。繂音律。塴，比鄧反。人豈有非之者哉？”不責於人所不能。" }
      - { type: z, text: "“子游”至“者哉”。○正義曰：此一節論問送終所須當辦具也。“夫子曰：稱家之有亡”，“稱”猶隨也。“亡”，無也。言各隨其家計豐薄有無也。“子游曰：有無惡乎齊”，“惡乎”猶於何也。子游言若必隨家之有無，貧富於何可齊，故子游疑而問之。○“夫子曰：有，毋過禮”，此答是稱富家也。“毋”猶不也，禮有節限，設若家富，有正禮可依，而不得過禮。○“苟亡矣，斂首足形”，此答貧家也。“亡”，無也，家無財也，但使衣衾斂於首足，形體不令露見而已。“還葬”，“還”，便也。禮雖眾多，葬日有數。若貧者斂竟便葬，不須停殯待其月數足也。“還之言便也”，言已斂即葬，不待三月也。○“縣棺而封”，“封”即窆，窆，下棺內壙中也。貴者則用碑繂，若貧而即葬者，但手縣棺而下之，同於庶人，不待碑繂，不設碑繂，不設碑繂不備禮。○注“封當”至“作塴”。○正義曰：“《春秋傳》作塴”者，案《左傳》昭十二年，“鄭簡公卒，將為葬除。司墓之室，有當道者，毀之，則朝而塴。弗毀，則日中而塴。”杜注云：“司墓之室，鄭之掌公墓大夫徒屬之家。塴，下棺也。”" }
      - { type: j, text: "司士賁告於子游曰：“請襲於床。”時失之也，禮：唯始死廢床。○賁音奔，人名。子游曰：“諾。”縣子聞之，曰：“汰哉，叔氏！專以禮許人。”當言禮然，言諾，非也。叔氏，子游字。○汰，本又作“大”，音泰，自矜大。" }
      - { type: z, text: "“司士”至“許人”。○正義曰：此一節論不可以禮許人之事。案《喪大記》始死廢床，至遷屍及襲，皆在於床。當時失禮，襲在於地，故司士賁告子游。“子游曰諾”者，子游知襲在床為是，故以許諾之。“縣子聞之，曰：汰哉，叔氏！專以禮許人”，汰，自矜大也。叔氏，子游別字也。言凡有來諮禮事，當據禮以答之。今子游不據前禮以答之，專輒許諾，如似禮出於己，是自矜大，故縣子聞而譏之曰“汰哉”。當言禮也，言諾，非禮也。" }
      - { type: j, text: "宋襄公葬其夫人，醯醢百甕。曾子曰：“既曰明器矣，而又實之。”言名之為明器，而與祭器皆實之，是亂鬼器與人器。○醯，呼兮反。醢音海。甕，烏弄反。" }
      - { type: z, text: "“宋襄”至“實之”。○正義曰：此一節論宋襄公失禮之事。案《春秋》宋襄公卒在僖二十三年。案文十六年傳雲，宋昭公將田孟諸，未至，襄夫人，周襄王之姊，使甸師攻而殺之。則宋襄公夫人卒在襄公後，其年極多。此得雲“宋襄公葬其夫人”者，蓋襄公初取夫人死在襄公之時，故得葬之，其後取夫人，是襄王之姊，死在襄公之後，義不相妨。○“曾子曰：既曰明器，而又實之”者，曾子不譏器之多，但譏其實為非也。言既曰神明之器，當虛也，故譏雲“而又實之”也。“言名之為明器，而與祭器皆實之，是亂鬼器與人器也”，案《既夕禮》“陳明器”後雲：“無祭器。”鄭雲：“士禮略也，大夫以上兼用鬼器與人器。”若此，大夫諸侯並得人鬼兼用，則空鬼而實人，故鄭雲“與祭器皆實之，是亂鬼器與人器”也。士既無人器，則亦實明器，故《既夕禮》雲：“罋三，醯、醢、屑。”又云：“甒二，醴、酒也。”若夏后氏專用明器，則分半以實之。殷人全用祭器，則亦分半以虛之。周人兼用明器、人器，人器實之，明器虛之。" }
      - { type: j, text: "孟獻子之喪，獻子，魯大夫仲孫蔑。司徒旅歸四布。旅，下士也。司徒使下士歸四方之賻布。夫子曰：“可也。”時人皆貪，善其能廉。○讀賵，曾子曰：“非古也，是再告也。”曾子言非禮，祖而讀賵，致命將行，主人之吏又讀賵，所以存錄之。" }
      - { type: z, text: "“孟獻”至“可也”。○正義曰：此一節論喪不貪利之事。孟獻子之喪，送終既具，賻布有餘，其家臣司徒敬子稟承主人之意，使旅下士歸還四方賻主人之泉布也。謂“四方賻”者，泉布本助喪用，今既有餘，故歸還之也。時人皆貪，獻子之家獨能如此，故夫子曰：“可也。”善其能廉。皇氏以為獻子有餘布，歸之於君，君令國之司徒歸賻於四方。案《春秋》魯上卿季氏也，仲孫蔑之卒，季氏無諡曰敬子者，皇氏之言非也。熊氏以為獻子家臣為司徒，故《左傳》“叔孫氏之司馬鬷戾”，是家臣亦有司徒司馬也。" }
      - { type: j, text: "成子高寢疾，成子高，齊大夫國成伯高父也。慶遺入，請曰：“子之病革矣。如至乎大病，則如之何？”觀其意。革，急也。遺，慶封之族。○遺，於季反，又如字。革，紀力反。子高曰：“吾聞之也，生有益於人，死不害於人。吾縱生無益於人，吾可以死害於人乎哉！我死，則擇不食之地而葬我焉。”不食，謂不墾耕。○墾，苦很反。" }
      - { type: z, text: "“成子”至“我焉”。○正義曰：此一節論臨死不忘儉之事。○注“成子”至“父也”。○正義曰：知者，以其有“慶遺入請”，齊有慶氏，故知是齊大夫。齊有國子高，故知姓國，又見《齊世本》：“懿伯生貞孟，貞孟生成伯高父。”國氏以此知也。" }
      - { type: j, text: "子夏問諸夫子曰：“居君之母與妻之喪。”“居處、言語、飲食衎爾”。衎爾，自得貌。為小君惻隱不能至。○衎，苦旦反，注同。為，於偽反，下“為之”、“殷為其久”、“為君服”同○賓客至，無所館，夫子曰：“生於我乎館，死於我乎殯。”仁者不厄人。" }
      - { type: z, text: "“子夏”至“衎爾”。○正義曰：此一節論臣服小君儀容之事。上子夏問居君之母與妻之喪，此“居處言語”是夫子答辭，不雲“子曰”者，記人略也。" }
      - { type: j, text: "國子高曰：“葬也者，藏也。藏也者，欲人之弗得見也。是故衣足以飾身，棺周於衣，槨周於棺，土周於槨。言皆所以為深邃，難人發見之也。國子高，成子高也。成，諡也。○邃，先遂反。難，乃旦反。見如字，又賢遍反。反壤樹之哉！”反，覆也。怪不如大古也，而反封樹之。意在於儉，非周禮。○壤，而丈反。復，扶又反，舊音服，非。大音泰。" }
      - { type: z, text: "“國子”至“之哉”。○正義曰：此一節論重古非今之事。子高之意，人死可惡，故備以衣衾棺槨，欲其深邃，不使人知，今乃反更封壤為墳，而種樹以標之哉！言不可封壤種樹也。國子意在於儉，非周禮之法。○注“怪不”至“周禮”。○正義曰：唐虞以上謂之“大古”，《易·系辭》雲：“古之葬者，厚衣之以薪，不封不樹。”今既封樹，故云“怪不如大古也”。" }
      - { type: j, text: "孔子之喪，有自燕來觀者，舍於子夏氏。子夏曰：“聖人之葬人，與人之葬聖人也，子何觀焉？與，及也。○燕，烏田反。昔者夫子言之曰：‘吾見封之若堂者矣，封，築土為壟。堂形四方而高。○壟，力勇反。見若坊者矣，坊形旁殺，平上而長。○坊音防。殺，色戒反，下同。見若覆夏屋者矣，覆謂茨瓦也。夏屋，今之門廡也，其形旁廣而卑。○茨，徐在私反，茅覆屋。廡音武。卑如字，又音婢。見若斧者矣。斧形旁殺，刃上而長。從若斧者焉，孔子以為刃上難登，狹又易為功。○狹，戶甲反。易，以豉反。馬鬛封之謂也。’俗間名。○鬛，力輒反。今一日而三斬板，而已封。板，蓋廣二尺，長六尺。斬板，謂斷其縮也。三斷止之，旁殺，蓋高四尺，其廣袤未聞也。《詩》雲：“縮板以載。”○斷音短，下同。上，時掌反，下“以上”同。廣袤，古曠反，下音茂，徐又亡侯反。尚行夫子之志乎哉！”尚，庶幾也。" }
      - { type: z, text: "“孔子”至“乎哉”。○正義曰：此一節論葬夫子封墳之法。○燕國人聞葬聖人，恐有異禮，故從燕來魯觀之。“舍於子夏氏”，舍，住也，燕人來住子夏家也。“子夏曰：聖人之葬人，與人之葬聖人也，子何觀焉”，與，及也。子夏謂燕人云：若聖人葬人，及人葬聖人，皆用一禮，而子遠來，何所觀乎？王肅雲：“‘聖人葬人與’，屬上句以言。若聖人葬人與，則人庶有異聞，得來觀者；若人之葬聖人，與凡人何異，而子何觀之？然公西赤為志，遍用茸荃禮，子夏謂葬聖人與凡人不異者，今謂聖凡相葬，禮儀不殊，而孔子葬異此，是賢葬聖師，別自表義，不施世為法，而子夏恐燕人學斆此禮，故懸而拒之，雲其禮本應如一也。而下又述昔聞夫子見四封之異者，此處可共，是許燕人學之，故備陳其教，以赴遠觀之意。”○“昔者夫子言之曰：吾見封之若堂者矣”，既已語燕人無觀，又此歷述孔子之言者，欲以此語與燕人為法。封謂墳之也，若如堂基，四方而高。○“見若坊者矣”，坊，堤也。堤坊水，上平而兩旁殺，其南北長也。言又見有築墳形如坊者也。“見若覆夏屋者矣”，殷人以來，始屋四阿。夏家之屋，唯兩下而已，無四阿，如漢之門廡。又言見其封墳如覆夏屋，唯兩下而殺，卑而寬廣。又見封如斧之形，其刃向上，長而高也。既言四墳之異，夫子之意，從若斧者焉。以為刃上難登，狹又易為功力。子夏既道從若斧形，恐燕人不識，故舉俗稱馬鬛封之謂也，以語燕人。馬鬷鬛之上，其肉薄，封形似之。○“今一日而三斬板”，子夏前述明夫子語，又引今會古竟，更述其今葬孔子。既是從斧之墳，“今一日”者，謂今作孔子墳，正用一日之功，儉約不假多時。於一日之中而三斬板者，謂作墳法也。築墳之法，所安板側於兩邊，而用繩約板。令立後，復內土於板之上，中央築之，令土與板平，則斬所約板。繩斷，而更置於見築土上，又載土其中，三遍如此，其墳乃成，故云“今一日而三斬板”也。“而己封”者，為三遍設板，築土而止已其封也，故鄭注：“板，蓋廣二尺，長六尺。”板廣二尺，疊側三板，應高六尺，而云“四尺”者，但形旁表漸斂，上狹下舒，如斧刃之形，使三板取高四尺，以合周制也。○“尚行夫子之志乎哉”者，尚，庶幾也。言今一日三斬板，是庶幾慕行於孔子平生所志也，以示燕人。○注“板蓋”至“以載”。○正義曰：知“板，蓋廣二尺”，案《祭義》曰“築宮仞有三尺”，是牆高一丈。《公羊傳》雲“五板為堵”，則板廣二尺，故五板高一丈也。知板長六尺者，以《春秋左氏》說雉長三丈，高一丈，《公羊傳》雲“五板為堵，五堵為雉”，按五堵而為雉，則堵長六尺，故《詩箋》雲“雉長三丈”，則板六尺。知“蓋高四尺”者，以上合葬於防，崇四尺，今葬夫子不可過之，又板廣二尺，三板斜殺，唯高四尺耳。其東西之廣，南北之袤，則未聞也。引《詩》“縮板以載”，是《大雅·綿》之篇也。引之者，證縮為約板之繩。孫毓難雲“孔子墓，魯城北門外西，墳四方，前高後下，形似臥斧，高八九尺。今無馬鬛封之形，不止於三板，記似誤”者，孫毓雲據當時所見，其墳或後人增益，不與元葬墳同，無足怪也。" }
      - { type: j, text: "婦人不葛帶。婦人質，不變重者，至期除之，卒哭變絰而已。" }
      - { type: z, text: "“婦人不葛帶”。○正義曰：此論齊斬婦人帶要絰也。葬後卒哭，變麻易葛，而婦人重要而質，不變所重，故不葛帶。至期除之，卒哭直變絰而已。大功以下輕，至卒哭並變為葛，與男子同。絰，首絰也，婦人輕首重要故也。" }
      - { type: j, text: "有薦新，如朔奠。重新物，為之殷奠。" }
      - { type: z, text: "“有薦新，如朔奠”。○正義曰：“薦新“謂未葬中間得新味而薦亡者。“如朔奠”者，謂未葬前月朔大奠於殯宮者。大奠則牲饌豐也，朔禮視大斂，士則特豚三鼎。今若有新物，及五穀始熟，薦於亡者，則其禮牲物如朔之奠也。大夫以上則朔望大奠，若士但朔而不望。" }
      - { type: j, text: "既葬，各以其服除。卒哭，當變衰麻者變之。或有除者，不視主人。" }
      - { type: z, text: "“既葬”至“服除”。○正義曰：“既葬謂三月葬竟後至卒哭，重親各隨所受而變服。若三月之親，至三月數滿應除者，葬竟各自除，不待主人卒哭之變，故云“各以其服除”也。" }
      - { type: j, text: "池視重霤。如堂之有承霤也。承霤以木為之，用行水，亦宮之飾也。柳，宮象也。以竹為池，衣以青布，縣銅魚焉。今宮中有承霤，雲以銅為之。○重，直容反。衣，於既反。" }
      - { type: z, text: "池視重霤。○正義曰：“池“者，柳車之池也。“重霤”者，屋承霤也。以木為之，承於屋霤，入此木中，又從木中而霤於地，故謂此木為“重霤”也。天子則四注，四面為重霤。諸侯四注，重霤則差降，去後，餘三。大夫唯餘前後二，士則唯一在前。而生時既屋有重霤以行水，死時柳車亦象宮室，而在車覆鱉甲之下，牆帷之上，織竹為之，形如籠，衣以青布，以承鱉甲，名之為池。以象重霤方面之數，各視生時重霤。" }
      - { type: j, text: "君即位而為椑，椑謂杝棺親屍者。椑，堅著之言也。言天子椑內又有水兕革棺。○椑，蒲歷反，徐戾益反，櫬屍棺。杝音移。著，直略反。兕，徐裏反。歲壹漆之，若未成然。○漆音七。藏焉。虛之不令。○令，力政反，本又作合。" }
      - { type: z, text: "“君即”至“藏焉”。○正義曰：此一節論人君尊，即位得為棺之事。“君”，諸侯也。言諸侯，則王可知也。椑，杝棺也。漆之堅強，甓甓然也。人君無論少長，而體尊備物，故亦即位而造為此棺也。椑謂杝棺親屍者也。古者天子椑內有水兕，而諸侯無，但用杝在內以親屍也。○“歲一漆之”者，雖為尊得造，交未供用，故不欲即成，但每年一漆，示如未成也。唯雲漆杝，則知不漆杝棺外屬等。“藏焉”者，棺中不欲空虛，如急有待也。虛之不令也，令，善也。言若虛空，便為不善，故藏物於其中。一本為“虛之不合”者，謂不以蓋合覆其上，既不合覆，不欲令人見，故藏焉。" }
      - { type: j, text: "復、楔齒、綴足、飯、設飾、帷堂並作。設飾謂遷屍又加新衣。○楔，悉節反。綴，丁劣反，又音丁衛反。飯，煩晚反，唅也。父兄命赴者。謂大夫以上也，士主人親命之。" }
      - { type: z, text: "“復楔”至“赴者”。○正義曰：此一節論始死之事。“復”，招魂也。“楔”，柱也。招魂之後，用角柶柱亡人之齒令開，使含時不閉也。○“綴足”者，複用燕几綴亡人之足令直，使著屨時不闢戾也。○飯者，飯食也。“設飾”者，謂襲斂遷屍之時，及又加著新衣也。○“帷堂”者，謂小斂時。○“並作”者，作，起為也。自“復”以下，諸事並起以帷堂，故云“並作”。○“父兄命赴者”，亦復後之事。赴謂死者生時於他人有恩識者，今死，則其家宜使人往相赴告也。《士喪禮》則孝子自命赴者，若大夫以上，則父兄命之也。何以然？尊許其病深，故使人代命之也。雖代命之，猶稱孝子名也。" }
      - { type: j, text: "君復於小寢、大寢、小祖、大祖、庫門、四郊。尊者求之備也，亦他日所嘗有事。" }
      - { type: z, text: "“君復”至“四郊”。○正義曰：此一節論人君禮備，復處又多。自小寢以下，明招魂處所也。“君”，王侯也。“於小寢”者，前曰廟，後曰寢。《爾雅》雲：“室有東西廂曰廟，無東西廂有室曰寢。”此“小寢”者，所謂高祖以下寢也，王侯同。“大寢”謂天子始祖，諸侯大祖也。“小祖”，高祖以下廟也，王侯同。“大祖”，天子始祖，諸侯大祖廟也。兩言於廟，求神備也。《周禮·夏採》“以冕服復於大祖廟”是也。其小廟則祭僕復之，其小寢、大寢則隸僕復之。故《祭僕》雲：“復於小廟。”鄭注云：“小廟，高祖以下也。”《隸僕》雲：“復於小寢、大寢。”注云：“小寢，高祖以下廟之寢也。始祖曰大寢。”四郊則夏採復之，故《夏採》雲：“乘車建綏，復於四郊。”此天子之事也。其諸侯復則小臣，故《喪大記》雲“小臣復”。案《周禮·內小臣職》：“小臣上士四人。”案《雜記》雲：“復西上。”注：“各如其命數。”上公九命，侯伯七命，則小臣不足，明更有餘官。又復人雖依命數，復處既多，則復人不足，當於此復了，更轉鄉他處。" }
      - { type: j, text: "喪不剝奠也與？祭肉也與？剝猶倮也。有牲肉則巾之，為其久設，塵埃加也。脯、醢之奠不巾。○剝，邦角反。與音餘，下同。倮，力果反，謂不巾覆也。埃音哀。" }
      - { type: z, text: "“喪不”至“也與”。○正義曰：此一節論祭肉不可露見之事。剝猶倮露也，言喪奠脯醢，不復設巾，可得倮露。“與”是語辭，謂喪不倮露奠者，為有祭肉也。無祭肉，即得倮露。○注“有牲”至“不巾”。○正義曰：案《士喪禮》小斂，陳一鼎，既斂奠於屍東，祝受巾巾之，是“有牲肉則巾之”也。《士喪禮》又云，始死，脯、醢、醴、酒，奠於屍東，無巾；又殯後朝夕乃奠，醴、酒、脯、醢，如初設，不巾，是脯、醢、醴、酒不巾也。案《既夕禮》柩朝廟，重先，奠從，奠設如初，巾之。此亦脯、醢之奠，巾之者，為其在堂，恐埃塵，故雖脯、醢亦巾之。此文“脯醢之奠不巾”者，據室內也。" }
      - { type: j, text: "既殯旬，而布材與明器。木工宜乾臘，且豫成。材，槨材也。○臘音昔。" }
      - { type: z, text: "“既殯”至“明器”。○正義曰：此一節論葬禮須豫備之事。○“既殯旬”，謂殯後十日也。○“而布材與明器”者，“布”，班也。“材”謂槨材也。殯後十日，而班佈告下覓槨材，及送葬明器之材。或雲布其木宜乾臘，故豫須暴之也。《士喪禮》筮宅吉，左還槨，獻明器之材於殯門外，是也。" }
      - { type: j, text: "朝奠日出，夕奠逮日。陰陽交接，庶幾遇之。○逮音代，或大計反。" }
      - { type: j, text: "父母之喪，哭無時，使必知其反也。謂既練，或時為君服金革之事，反必有祭。" }
      - { type: z, text: "“父母”至“反也”。○正義曰：禮哭無時有三種，一是初喪未殯之前，哭不絕聲。二是殯後，除朝夕之外，廬中思憶則哭。三是小祥之後，哀至而哭。或一日二日，而無復朝夕之時也。此雲“哭無時”，謂小祥之後也。何以知然？下雲“使必知其反”，是其可使之時也。○“使必知其反也”者，“使”謂君使之也。既小祥無哭時，其時可為君所使服金革之事也。反，還也。若為使還家，當必設祭告親之神，令知其反，亦出必告、反必面之義也。○注“謂既練，或時為君服金革之事，反必有祭”者，《禮運》雲“三年之喪，期不使”，《公羊傳》亦期不使，是知期內不使，則期外可使也。而《曾子問》雲：“卒哭，服金革之事，無闢。”此魯侯有為為之也。《喪大記》雲卒哭而服金革之事。鄭雲：“權禮也。”是知卒哭而使非正禮也。" }
      - { type: j, text: "練，練衣黃裏，縓緣。小祥練冠，練中衣，以黃為內，縓為飾。黃之色卑於纁。縓，纁之類，明外除。○縓，七絹反，淺赤色，今之紅也。緣，悅絹反，下注同。薰，本又作纁，許雲反。葛要絰，繩屨無絇，角瑱。瑱，充耳也。吉時以玉，人君有瑱。○要絰，一遙反，下注“小要”同；下大結反。絇，其俱反，屨頭飾。瑱，吐練反。鹿裘衡長袪。衡當為橫，字之誤也。袪，謂褎緣袂口也。練而為裘，橫廣之，又長之。又為袪，則先時狹短無袪可知。吉時麛裘。○衡，依注作橫，華彭反，下“衡三”同。袪，起魚反，一音丘據反。褎，本又作袖，音徐秀反。袂，面世反。袪，裼之可也。裼，表裘也。有袪而裼之，備飾也。《玉藻》曰：“麛裘青犴，褎絞衣以裼之。”鹿裘亦用絞乎？○裼音昔。麛音迷，本又作麑，同，鹿子也。犴音岸，胡地野犬。絞，戶交反。" }
      - { type: z, text: "“練練”至“可也”。○正義曰：“練”，小祥也。小祥而著練冠，練中衣，故曰練也。“練衣”者，練為中衣。“黃裏”者，黃為中衣裏也。正服不可變，中衣非正服，但承衰而已，故小祥而為之黃拾裏也。“縓緣”者，“縓”為淺絳色也，“緣”謂中衣領及褎緣也。裏用黃而領緣用縓者，領緣，外也，明其外除，故飾見外也。“葛要絰”者，亦小祥後事也。小祥，男子去葛絰，唯餘要葛也。○“繩屨”者，謂父喪，菅屨卒哭，受齊衰蒯藨屨，至小祥受大功繩麻屨也。“無絇”，屨頭飾也，吉有，喪無。“角瑱”者，“瑱”，充耳也，人君平常吉用玉為之，以掩於耳。在初喪亦無，至小祥微飾，以角為之。○“鹿裘”者，亦小祥後也。為冬時吉凶衣裏皆有裘，吉時則貴賤有異，喪時則同用大鹿皮為之。鹿色近白，與喪相宜也。○“衡長袪”者，衡，橫也。袪，褎緣口也。小祥之前，裘狹而短袂，又無袪。至小祥稍飾，則更易作橫廣大者也，又長之，又設其袪也。“練而為裘”者，“為”猶作也。前時已有裘，但短小。至小祥，更作大長者，橫廣之，又長之為袪，更新造之，又加此三法也。○“袪，裼之可也”者，“裼”謂裘上又加衣也。吉時裘上皆有裼衣，喪已後，既兇質，雖有裘，裘上未有裼衣。至小祥，裘既橫長，又有袪為吉轉文，故加裼之可也。案如此文，明小祥時外有衰，衰內有練中衣，中衣內有裼衣，裼衣內有鹿裘，鹿裘內自有常著襦衣。○注“黃之”至“外除”。○正義曰：纁是赤色也，其色華美。黃雖是正色，質卑於纁。《爾雅·釋器》雲：“一染謂之縓，三染謂之纁。”故言纁類也。華者在外，故云“明外除”。○注“吉時以玉，人君有瑱”。○正義曰：案吉時君大夫士皆有瑱，此唯雲“人君有瑱”者，以經雲“角瑱”，故鄭雲“吉時以玉”，據人君吉時，又云“人君有瑱”，故知人臣兇時無瑱。○注“《玉藻》”至“絞乎”。○正義曰：引《玉藻》者，以此經鹿裘直雲“裼之可”，不知裼用何衣。大者曰鹿，小者曰麛，同類之物。麛裘既用絞為裼，則鹿裘亦用絞乎？“乎”者，疑辭。然麛裘用青犴為褎，則鹿裘之褎，亦用青犴也。" }
      - { type: j, text: "有殯，開遠兄弟之喪，雖緦必往；親骨肉也。非兄弟，雖鄰不往。疏無親也。所識，其兄弟不同居者皆吊。就其家吊之，成恩舊也。" }
      - { type: z, text: "“有殯”至“皆吊”。○正義曰：此一節論哭吊之事。○“所識，其兄弟不同居者皆吊”者，此文連上“有殯”之下，若其骨血兄弟，雖緦必往。若其非兄弟骨血疏外之人，雖鄰不往。今有既非兄弟，又非疏外，平生所共知識，往來同恩好，今若身死者，兄弟雖不同居，亦就往吊之，成其死者之恩舊也。其死者兄弟不同居，尚往吊之，則死者子孫就吊可知，舉疏以見親也。已有殯得吊之者，以其死者與我有恩舊也。皇氏以為別更起文，不連“有殯”之事，“所識”者謂識其死者之兄弟，是小功以下之親，既識兄弟，雖不同居，皆一一就吊之。未知然否，故兩存焉。" }
      - { type: j, text: "天子之棺四重，尚深邃也。諸公三重，諸侯再重，大夫一重，士不重。○重，直龍反，注皆同。邃，雖遂反。水、兕革棺被之，其厚三寸，以水牛兕牛之革以為棺被。革各厚三寸，合六寸也。此為一重。○被，皮寄皮，注同。厚，胡豆反，度厚薄曰厚，皆同此音。杝棺一，所謂椑棺也。《爾雅》曰：“椴，杝。”杝，羊支反，木名。椴，徒亂反。梓棺二，所謂屬與大棺。○梓音子。屬音燭。四者皆周。周，幣也。凡棺因能溼之物。○幣，本又作匝。同，子答反。能溼，乃代反。棺束縮二衡三，衽每束一。衡亦當為橫。衽，今小要。衽或作漆，或作髹。○衽，而審反，又而鴆反。髹又作魨，許求反。柏槨以端長六尺。以端，題湊也。其方蓋一尺。○題，徒低反，頭也。湊，七豆反，聚也。" }
      - { type: z, text: "“天子”至“六尺”。○正義曰：此一節論天子諸侯以下棺槨厚薄長短之事。○“天子之棺四重”者，尊者尚深邃也。四重者，水牛兕牛皮二物為一重也，又杝，為第二重也，又屬為第三重也，又大棺為第四重也。四重凡五物也。以次而差之，上公三重，則去水牛，餘兕、杝、屬、大棺也。侯伯子男再重，又去兕，餘杝、屬、大棺。大夫一重，又去杝，餘屬、大棺也。士不重，又去屬，唯單用大棺也。天子大棺厚八寸，屬六寸，椑四寸，又二皮六寸，合二尺四寸也。上公去水牛之三寸，餘兕、椑、屬、大棺，則合二尺一寸。諸侯又去兕之三寸，餘合一尺八寸也。列國上卿又除椑四寸，餘合一尺四寸也。大夫大棺六寸，屬四寸，合一尺。士則不重，但大棺六寸耳，故庶人四寸矣。而天子卿大夫文不見有通者，雲天子卿大夫並與列國咀墁，若天子之士與諸侯大夫同也，喪質不得依吉時祭服也。若吉時祭服，則天子臣與諸侯同。然春秋時多僣，趙簡子言罰乃不設屬、椑，非也。水、兕二皮，並不能厚三寸，故合被之，令各厚三寸也。二皮能溼，故最在裏近屍也。○“杝棺一”者，椴，也。材亦能溼，故次皮也。杝唯一種，故云一也。諸侯無革，則杝親屍也，所謂梓棺也，即前言君即位為椑是也。杝即椴木，鄭引《爾雅》曰：“椴，杝。”一物二名，名椴，又名杝也。○“梓棺二”者，杝棺之外，又有屬棺，屬棺之外，又有大棺。大棺與屬棺並用梓，故云二也，則《喪大記》雲：“屬六寸，大棺八寸也。”○“四者皆周”者，四，四重也。周，幣也。謂四重之棺，上下四方，悉周幣也。唯槨不周，下有茵，上有杭席故也。○“棺束”者，古棺木無釘，故用皮束合之。○“縮二”者，縮，縱也。縱束者用二行也。○“衡三”者，橫束者三行也。○“衽每束一”者，衽，小要也。其形兩頭廣，中央小也。既不用釘棺，但先鑿棺邊及兩頭合際處作坎形，則以小要連之，令固棺，並相對，每束之處，以一行之衽連之。若豎束之處，則豎著其衽以連棺。蓋及底之木，使與棺頭尾之材相固。漢時呼衽為小要也。○“柏槨”者，謂為槨用柏也。天子柏，諸侯松，大夫柏，士雜木也。鄭注《方相職》雲：“天子槨柏，黃腸為裏，而表以石焉。”○“以端”者，“端”猶頭也。積柏材作槨，並葺材頭也，故云“以端”。○“長六尺”者，天子槨材，每段長六尺而方一尺。天子以下，庶人以上，鄭注《喪大記》具之。○注“衽或作漆，或作髹”。○正義曰：經之“衽”字，諸《禮記》本或有作“漆”字者，或有作“髹”字者。○注“以端”至“一尺”。○正義曰：以此木之端首，題湊向內。知其方蓋一尺者，以庶人四寸之棺，五寸之槨，厚於棺一寸。案《喪大記》“君大棺八寸”，“君”謂諸侯，則天子之大棺，或當九寸，其槨厚一尺，故云“其方蓋一尺”，則槨之厚也。如鄭此言，槨材並皆從下壘至上，始為題湊。湊，向也。言木之頭相鄉而作四阿也。如此乃得槨之厚薄，與棺相準。皇氏以為壘槨材從下即題湊，郭六尺，與槨全不相應，又鄭何雲“其方蓋一尺”？皇氏之義非也。" }
      - { type: j, text: "天子之哭諸侯也，爵弁絰糹才衣。服士之祭服以哭之，明為變也。天子至尊，不見屍柩，不吊服，麻不加於採。此言“絰”，衍字也。時人間有弁絰，因雲之耳。《周禮》：“王吊諸侯，弁絰緦衰也。”○糹才，本又作緇，又作純，同，側其反。為，於偽反，下文及注“為其變”皆同。衍，以善反。或曰，使有司哭之。非也。哀戚之事不可虛。為之不以樂食。蓋謂殯、斂之間。" }
      - { type: z, text: "“天子”至“樂食”。○正義曰：此一節論天子哭諸侯之事。○注“服士”至“衰也”。○正義曰：“天子至尊，不見屍柩，不吊服”者，薨在本國，天子遙哭之，不親見屍柩，不服緦衰。吊而服爵弁糹才衣，糹才衣，絲衣也。則諸侯以下，雖不見屍柩，仍吊服也。○“或曰使有司哭之”者，或人云，天子不自哭，但令有司哭之耳。非也。○“為之不以樂食”，此是記者之言，非復或人之說也。天子食有樂，今哭諸侯，故食不復奏樂也。此“不以樂食”者，蓋謂殯斂之間，鄭以意斷不用樂之期也。諸侯五日殯也。然諸侯為其臣，或至葬不食肉，卒哭不舉樂，蓋臣少而巳卑，不得同王也。" }
      - { type: j, text: "天子之殯也，菆塗龍輴以槨，菆木以周龍輴，如槨而塗之。天子殯以輴車，畫轅為龍。○菆，才官反。輴，敕倫反。轅音袁。加斧於槨上，畢塗屋。斧謂之黼，白黑文也。以剌繡於縿幕，加槨以覆棺，已乃屋其上，盡塗之。○黼音甫。剌，七亦反。縿音消。幕音莫。天子之禮也。" }
      - { type: z, text: "“天子”至“禮也”。○正義曰：此一飾論菆塗為古天子殯法也。菆，叢也，謂用木菆棺而四面塗之，故云“菆塗”也。○“龍輴”者，殯時輴車載柩，而畫轅為龍，故云“龍輴”也。○“以槨”者，亦題湊菆木，象槨之形，故云“以槨”。○“加斧於槨上”者，“斧”謂繡覆棺之衣為斧文也。先菆四面為槨，使上與棺齊，而上猶開也。以棺衣從槨上入覆於棺，故云“加斧於槨上”也。○“畢塗屋”者，畢，盡也。斧覆既竟，又四注為屋，覆上而下，四面盡塗之也。故云“畢塗屋”。鄭雲“菆木以周龍輴”者，謂叢眾木直壘，周龍輴至上乃題湊，則諸侯至上，不題湊也。" }
      - { type: j, text: "唯天子之喪，有別姓而哭。使諸侯同姓、異姓、庶姓，相從而為位，別於朝覲來時，朝覲爵同同位。○別，彼列反，注同。朝，直遙反，下同。" }
      - { type: z, text: "“唯天”至“而哭”。○正義曰：此一節論哭天子之事，各依文解之。○注“使諸”至“同位”。○正義曰：“異姓“者，鄭注《周禮》雲：“王昏姻甥舅。”“庶姓”者，謂與王無親者。此言“朝覲爵同同位”，則不分別同姓異姓。然《覲禮》：“諸侯受舍於朝，同姓西面，異姓東面。”鄭注云：“分別同姓異姓，受之將有先後也。”與此不同者，《覲禮》先公而後侯，先侯而後伯，是亦爵同同位，但就同姓之中，先爵尊耳，與此無別。" }
      - { type: j, text: "魯哀公誄孔丘曰：“天不遺耆老，莫相予位焉。嗚呼哀哉！尼父！”誄其行以為諡也。莫，無也。相，佐也。言孔子死，無佐助我處位者。尼父，因且字以為之諡。○誄，力軌反。耆，巨支反。相，息亮反，注同。父音甫。行，下孟反。" }
      - { type: z, text: "“魯哀”至“尼父”。○正義曰：此一節論哀公誄孔子之事。孔子以哀公十六年夏四月已丑日卒，哀公欲為作諡。作諡宜先列其生時行狀，謂之為誄。○“曰天不遺耆老，莫相予位焉”者，作誄辭也。遺，置也。“耆老”謂孔子也。莫，無也。相，佐也。言上天不置孔子，故無復佐助我處於位也。○“嗚呼哀哉”，傷痛之辭也。○“尼父”，“尼”則諡也。父且字甫，是丈夫之美稱，稱字而呼之“尼父”也。" }
      - { type: j, text: "國亡大縣邑，公、卿、大夫、士皆厭冠，哭於大廟三日，君不舉。軍敗失地，以喪歸也。厭冠，今喪冠，其服未聞。○大縣，郡縣之縣。厭，於葉反，注同。大音泰。或曰，君舉而哭於后土。后土，社也。" }
      - { type: z, text: "“國亡”至“后土”。○正義曰：此一節論人君為國致憂之事。○“國亡大縣邑”者，亡，失也。國之軍敗，亡失土邑也。○“公卿大夫、士皆厭冠，哭於大廟三日”者，公，孤也。《士喪禮》雲：“公卿大夫繼主人。”鄭雲：“公，大國之孤四命者是也。”厭冠，喪冠也。國既失地，是諸侯無德所招，故諸臣皆著喪冠而哭於君之大廟三日也。失地為先祖所哀，故在廟也。○“君不舉”者，舉謂舉樂也。臣入廟三日哭，故君亦三日不舉樂也。“或曰，君舉而哭於后土”者，后土，社也。又有或者言亦舉樂，而自於社中哭之，社主土故也。然二處之哭，鄭皆不非，未知孰是。庾蔚雲：“舉者謂舉饌。”引《周禮·膳夫》：“王日一舉”，又“王齊日三舉”。注云：“殺牲盛饌曰舉。”案庾蔚及前通合而為用也。" }
      - { type: j, text: "孔子惡野哭者。為其變眾。《周禮》：“銜枚氏掌禁野叫呼、歎呼於國中者、行歌哭於國中之道者。”○惡，烏路反。銜枚，上音鹹，下木杯反。呼，火故、火胡二反。" }
      - { type: z, text: "“孔子惡野哭者”。○正義曰：哭非其地謂之野，為變眾，故惡之也。" }
      - { type: j, text: "未仕者不敢稅人，如稅人，則以父兄之命。不專家財也。稅謂遺於人。○稅，始銳反，謂以物遺人也。遺，維季反。" }
      - { type: z, text: "“未仕”至“之命”。○正義曰：此論人子之法也。“稅人”謂以物遺人也。未仕未尊，則亦不敢專家財餉人也。“如稅人”，謂已仕者也，雖得遺人，亦當必稱父兄以將遺之。" }
      - { type: j, text: "士備入而後朝夕踴。備猶盡也。國君之喪，嫌主人哭，入則踴。" }
      - { type: z, text: "“士備”至“夕踴”。○正義曰：此一節論君喪，群臣朝夕哭踴之事。備，盡也。國君喪，群臣則朝夕即位哭踴。嗣君孝子雖先入即位哭，必待諸臣皆入列位畢後，乃俱踴者也。士卑最後，故舉士入為畢也。所入有前後，而相待踴者，孝子哀深，故前入也，踴須相視為節，故俟齊也。" }
      - { type: j, text: "祥而縞。縞冠，素紕也。○縞，古老反，注同。紕，避支反。是月禫，徙月樂。言禫明月可以用樂。○禫，大感反。樂音嶽。" }
      - { type: z, text: "“祥而”至“月樂”。○正義曰：祥，大祥也。“縞”謂縞冠，大祥日著之，故《小記》除成喪者，其祭朝服縞冠是也。○“是月禫，徙月樂”者，《鄭志》曰：“既禫徙月而樂作，禮之正也。孔子五日彈琴，自省樂，哀未忘耳。逾月可以歌，皆自身逾月所為也。此非當月所受樂名。既禫，始得備樂，而在心猶未忘能歡，徙月之樂極歡也。哀殺有漸，是以樂亦隨之也。”" }
      - { type: j, text: "君於士有賜帟。帟，幕之小者，所以承塵，賜之則張於殯上。大夫以上，幕人職供焉。○帟音亦。共音恭，本亦作供。" }
      - { type: z, text: "“君於士有賜帟”。正義曰：賜，惠賜也。帟者，幕之小者也。大夫以上喪，則幕人職供之也。士唯有君恩賜之，乃得有帟也。" }
      - { type: j, text: "《禮記正義》" }
