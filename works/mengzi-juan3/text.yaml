# 孟子注疏卷3（孫奭疏）：j 為經文，漢趙岐注為注，z 為疏文。
sections:
  - id: juan3
    name: 正文
    blocks:
      - { type: z, text: "正义曰：此卷赵氏分别为第二卷也。故云《梁惠王章句》下。今据此卷“章指”，凡十六章。一章言人君田猎以时，锺鼓有节，与民同乐。二章讥王广囿专利，以严刑陷民。三章言圣人乐天事小，以勇安天下。四章言与天下同忧乐者，不为慢游恣溢之行。五章言齐王好色好货，孟子推以公刘、太王好货色与民同之。六章言君臣上下，各勤其任，无堕其职。七章言人君进贤退恶。八章言孟子云纣以崇恶，失其尊名。九章言任贤使能，不遗其学。十章言征伐之道，在顺民心。十一章言伐恶养善，无贪其富，以小王大。十二章言上恤其下，下赴其难，恶出於已，害及其身。十三章言事无礼之国，不若得民心，与之守死善道。十四章言君子之道，正己在天，强暴之来，非已所召，独善其身而已。十五章言太王居，权也，效死弗去，义也。十六章言谗邪构贤，贤者归於天，不尤人也。凡十六章合上卷七章是《梁惠王篇》有二十三章矣。故各於卷首总列其章目，而分别其指焉。" }
      - { type: j, text: "庄暴见孟子，曰：“暴见於王，王语暴以好乐，暴未有以对也。”曰：“好乐何如？”" }
      - { type: z, text: "庄暴，齐臣也。不能决知之，故无以对。而问曰：王好乐何如。" }
      - { type: j, text: "孟子曰：“王之好乐甚，则齐国其庶几乎？”" }
      - { type: z, text: "王诚能大好古之乐，齐国其庶几治乎。" }
      - { type: j, text: "他日见於王，曰：“王尝语庄子以好乐，有诸？" }
      - { type: z, text: "孟子问王有是语不。" }
      - { type: j, text: "王变乎色，曰：“寡人非能好先王之乐也，直好世俗之乐耳。”" }
      - { type: z, text: "变乎色，愠恚庄子道其好乐也。王言我不能好先圣王之乐，直好世俗之乐，谓郑声也。" }
      - { type: j, text: "曰：“王之好乐甚，则齐其庶几乎！今之乐，犹古之乐也。" }
      - { type: z, text: "甚，大也。谓大要与民同乐，古今何异也。" }
      - { type: j, text: "曰：“可得闻与？”" }
      - { type: z, text: "王问古今同乐之意，宁可得闻邪？" }
      - { type: j, text: "曰：“独乐乐，与人乐乐，孰乐？”" }
      - { type: z, text: "孟子复问王独自作乐乐邪？与人共听其乐为乐邪？" }
      - { type: j, text: "曰：“不若与人。”" }
      - { type: z, text: "王曰：“独听乐不如与众共听之为乐也。" }
      - { type: j, text: "曰：“与少乐乐，与众乐乐，孰乐？”" }
      - { type: z, text: "孟子复问王与少之人共听乐乐邪？众人共听乐乐也？" }
      - { type: j, text: "曰：“不若与众。”" }
      - { type: z, text: "王言不若与众人共听乐为乐。" }
      - { type: j, text: "“臣请为王言乐。" }
      - { type: z, text: "孟子欲为王陈独乐与众人乐乐状。" }
      - { type: j, text: "今王鼓乐於此，百姓闻王锺鼓之声、管之音，举疾首蹙而相告曰：‘吾王之好鼓乐，夫何使我至於此极也！父子不相见，兄弟妻子离散。’" }
      - { type: z, text: "鼓乐者，乐以鼓为节也。管，笙。，箫。或曰若笛短而有三孔。《诗》云“左手执”，以节众也。疾首，头痛也。蹙，愁貌。言王击鼓作乐，发赋徭役皆出於民，而德不加之，故使民愁也。" }
      - { type: j, text: "今王田猎於此，百姓闻王车马之音，见羽旄之美，举疾首蹙而相告曰：‘吾王之好田猎，夫何使我至於此极也？父子不相见，兄弟妻子离散。’此无他，不与民同乐也。" }
      - { type: z, text: "田猎无节，以非时取牲也。羽旄之美，但饰羽旄，使之美好也。发民驱兽，供给役使，不得休息，故民穷极而离散奔走也。" }
      - { type: j, text: "今王鼓乐於此，百姓闻王锺鼓之声、管之音，举欣欣然有喜色而相告曰：‘吾王庶几无疾病与？何以能鼓乐也！’" }
      - { type: z, text: "百姓欲令王康强而鼓乐也。今无赋敛於民，而有惠益，故欣欣然而喜也。" }
      - { type: j, text: "今王田猎於此，百姓闻王车马之音，见羽旄之美，举欣欣然有喜色而相告曰：‘吾王庶几无疾病与？何以能田猎也！’此无他，与民同乐也。" }
      - { type: z, text: "王以农隙而田，不妨民时，有悯民之心。因田猎而加抚恤之，是以民悦之也。" }
      - { type: j, text: "今王与百姓同乐，则王矣。”" }
      - { type: z, text: "孟子言王何故不大好乐，效古贤君与民同乐，则可以王天下也。何恶庄子之言王之好乐也。“庄暴见孟子”至“则王矣”。○正义曰：此章言人君田猎以时，锺鼓有节，发政行仁，民乐其事，则王道之阶，在于此矣。故曰天时不如地利，地利不如人和矣，与民同乐也。“庄暴见孟子，曰：暴见於王，王语暴以好乐，暴未有以对也”者，庄暴，齐臣也，庄，姓也；暴，名也。言庄暴见孟子，谓暴朝见於齐王，王语暴以好乐之事，暴是时未有言以对答之。“曰好乐何如者”，故庄暴问孟子，以谓王之所以好乐，是如之何？“孟子曰王之好乐甚，则齐国其庶几乎”者，孟子答庄暴之问也，言齐王之好乐至甚，则齐国庶几其治安乎！“他日见於王，曰：王尝语庄子以好乐，有诸”者，是孟子自见庄暴言好乐之後，他一日见於齐王而问之，曰：王曾与庄子语以好乐之事，还有此言否乎？孟子称庄子，不称曰暴者，是孟子尊王之臣，故不欲称其名也。“王变乎色，曰：寡人非能好先王之乐也，直好世俗之乐耳”者，是齐王自孟子问之後，变其常容而有愤怒之色，盖愤庄暴言己之好乐於孟子也，故答孟子曰：寡人不能好古圣王之乐，古圣王之乐，如黄帝之《咸池》，尧之《大章》，舜禹之《韶》，夏商周之《》、《武》是也，但能直好世俗乐耳，如郑、卫之声是也。“曰王之好乐甚，则齐其庶几乎”者，孟子复对王而言也，言王之好乐至甚，则齐几乎治安。孟子言“齐国其庶几乎”以对庄子，对之齐王则止曰“齐其庶几乎”者，盖对庄子则称其国，及对齐王故不必称国焉耳。“今之乐，犹古之乐”者，是孟子见齐王言不能好先王之乐，直好世俗之乐，故以此言今之乐亦若古之圣王乐也。但其要在能与民同听乐为乐耳，遂以此问之。“曰可得闻与”者，是齐王问孟子，言古今之乐一同，宁可得而闻知之与？“曰独乐乐，与人乐乐，孰乐”者，是孟子欲以此问王，使王知与民同乐乐为乐也，故问之曰：王独作乐为乐邪，与人同乐为乐邪？“曰不若与人”者，是齐王答孟子，亦以为独乐乐不若与人同乐为乐也。“曰与少乐乐，与众乐乐，孰乐”者，是孟子复问王与少人同乐为乐，与众人同乐为乐，孰乐邪？“曰不若与众”者，齐王亦复答孟子，以为不若与众人同乐为乐也。“臣请为王言乐”，孟子於此知齐王亦识与众同乐之意，乃为王陈其独乐与众同乐之效，故不待王问而自请言之也。“今王鼓乐於此”至“与民同乐也”者，皆孟子陈独乐与众乐乐之文也。言今王鼓作其乐於此国也，百姓之人闻王锺鼓之声与管之音，举皆疾痛其头，又蹙愁闷，而交相告曰：我王之好作乐为乐，发赋徭役，使我至於此之极也，父子不得以相见，兄弟妻子又皆离散之。以其如此，故百姓所以头痛蹙愁闷也。又言今王田猎於此国，百姓之人闻王车马之音，见羽旄之美好，举皆蹙愁闷，疾痛其首，而交相告曰：我王之好田猎禽兽，如何使我供给役使，不得休息，而至於如此之迹父子不得以相见，兄弟妻子皆离散之。然则王之鼓乐田猎，而百姓皆如此者，无他事焉，是王之不与民同其乐也。言今王鼓乐於此国，百姓闻王锺鼓之声、管之音，举皆欣欣然有喜色，而交相告曰：我王庶几无疾病也，何以能鼓乐。於此言百姓皆欲之康强，不特止於庶几无疾病也。苟即庶几近於无疾病，则王亦何以能鼓乐也。又言今王田猎禽兽於此国，百姓之人闻王车马之音，见羽旄之美好，举皆欣欣然有喜色，而交相告曰：我王即庶几近於无疾病，又何以能田猎也。此言又欲王之康强，不特止於庶几无疾病也。然则王之鼓乐田猎，百姓皆如此欲王之康强者，无他事焉，是王能与民同其乐也。言今之王能与民同乐为乐，则为之王者矣。云“鼓乐”者，盖锺以止为体，鼓以作为用，故凡作乐所以谓之鼓乐也。云“音与声”者，盖锺鼓言声，以其声之单出，故云声也；管车马言音，以其音之杂比，故云音也。然车马亦谓之音者，盖升车则马动，马动则鸾鸣，鸾鸣则和应故也。声之与音，合而言之则，声、音则一也；别而言之，则单出为声，杂比为音。《诗》云“ィィ管声”，此言管之音，是声音之通论也。齐王悦南郭先生吹竽，廪食以数百人；喜邹忌鼓琴，卒授之国政：是安知与众乐乐邪？此孟子所以陈其与民同乐之意也。○注“郑声也”。○正义曰：《论语》云“郑声淫”，以其能惑人心也。《孔传》云：“郑声惑人心，其与雅乐同也。”○注“鼓乐”至“百姓愁”。○正义曰：《周礼·鼓人》“掌教六鼓，以节声乐”。《锺师》“掌金奏”，注云：以锺鼓奏者，先击锺，次击鼓，以奏《九夏》。夏，大也。乐之大歌有九：《王夏》、《肆夏》、《昭夏》、《纳夏》、《章夏》、《齐夏》、《族夏》、《衤戒夏》、《骜夏》，凡九夏是也，故附于此。云“管笙箫，或曰若笛而有三孔”者，案《礼图》云：“笙长四尺，诸管参差，亦如鸟翼。”《尔雅》曰：“大笙谓之巢，小者谓之和。”郭璞《尔雅》云：“二十三管为箫。”《风俗通》云：“舜作竹箫，以象凤翼。”《周礼·笙师》“掌教吹”，後郑云“如笛，有三孔”是也。《诗》云“左手执”，盖《邶诗·简兮》之篇文也，注云：“六孔，言硕人多才艺，又能舞，言文武备也。”释云：“首，头也。”，鼻颈也。”言齐王击鼓作乐，其使民徭役苦楚，皆蹙其鼻颈而愁闷也。○注“田猎”至“奔走也”。○正义曰：释云：猎，田也，狩苗是也。案鲁隐公五年《左传》云：“春、夏苗、秋、冬狩，皆於农隙讲武事也。”杜预曰：“，索择取不孕者。苗，为苗除害也。，杀也，以杀为名，顺秋气也。狩，围守也，冬物毕成，获则取之，无所择也。”羽旄者，案《左传》鲁襄公十四年，范宣子假羽旄於齐。定公四年，晋人假羽旄於郑。杜预曰：“以析羽为旌，为王者ヵ车之所建也。”又案《司常》九旗之数，又有全羽、析羽。释云：全羽，析羽，直有羽而无帛也。云“天时不如地利，地利不如人和”，盖《公孙丑》篇文也。" }
      - { type: j, text: "齐宣王问曰：“文王之囿方七十里，有诸？”" }
      - { type: z, text: "王言闻文王苑囿方七十里，宁有之？" }
      - { type: j, text: "孟子对曰：“於传有之。”" }
      - { type: z, text: "於传文有是言。" }
      - { type: j, text: "曰：“若是其大乎？”" }
      - { type: z, text: "王怪其大。" }
      - { type: j, text: "曰：“民犹以为小也。”" }
      - { type: z, text: "言文王之民尚以为小也。" }
      - { type: j, text: "曰：“寡人之囿方四十里，民犹以为大，何也？”" }
      - { type: z, text: "王以为文王在岐山之时，虽为西伯，土地尚狭，而囿已大矣。今我地方千里而囿小之，民以为寡人之囿为大，何故也。" }
      - { type: j, text: "曰：“文王之囿方七十里，刍荛者往焉，雉免者往焉。与民同之，民以为小，不亦宜乎！" }
      - { type: z, text: "刍荛者，取刍薪之贱人也。雉免，猎人，取雉兔者。言文王听民往取禽兽，刈其刍薪，民苦其小，是其宜也。" }
      - { type: j, text: "臣始至於境，问国之大禁，然後敢入。" }
      - { type: z, text: "言王之政严、刑重也。" }
      - { type: j, text: "臣闻郊关之内，有囿方四十里，杀其麋鹿者如杀人之罪。" }
      - { type: z, text: "郊关，齐四境之郊皆有关。" }
      - { type: j, text: "则是方四十里为阱於国中，民以为大，不亦宜乎？”" }
      - { type: z, text: "设陷阱者不过丈尺之间耳，今王陷阱乃方四十里，民言其大，不亦宜乎。“齐宣王”至“不亦宜乎”。○正义曰：此章讥王广囿专利严，刑陷民也。“齐宣王问曰：文王之囿方七十里，有诸”者，是宣王尝闻文王有囿方阔七十里，故见孟子，问之还是有之否？“孟子对曰：於传有之”者，孟子答之，以为书传之文有言也。“曰：若是其大乎”者，宣王怪之，以为文王囿如此之阔大，民犹尚以为之小也。“曰：寡人之囿方四十里，民犹以为大，何也”者，宣王又问孟子，言寡人之囿但方阔四十里，而民犹尚以为之大，是如之何其差也。“曰：文王之囿方七十里，刍荛者往焉，雉免者往焉。与民同之，民以为小，不亦宜乎”者，孟子言文王之囿方阔七十里，而采刍草薪木之贱人，与猎雉鸟兔兽者皆得往其中而有所取之，是其与民同共之，故民以为小，不亦宜乎也。“臣始至於境，问国之大禁，然後敢入”者，孟子对王称臣，言自臣始初至於王之齐境，问其王国禁令，然後乃敢入其国中也。“臣闻郊关之内，有囿方四十里，杀其麋鹿者如杀人之罪。则是方四十里为阱於国中，民以为大，不亦宜乎”者，孟子言自臣入王郊关之内，乃闻王有苑囿方四十里之广，其有於中杀其麋鹿者，如杀其人之罪，而科之如此，则是王为阱陷方四十里之广於国中，以陷其民也。故民以为大，不亦宜之乎！凡此是皆孟子讥王之专利而不与民同也。传云天子之囿方百里，大国四十里，次国三十里，小国二十里。文王之国，百里之国，或者以谓有七十之里为苑囿，是如之何其差殊？不知文王百里之国是其始封之时制也，七十里之囿乃文王作西伯之时有也。周制，上公封四百里，其食者三之一，岂七十里之囿特止山川不可食之地与？彼有子虚者以谓楚地方千里，而囿居其九，是可食之地亦鞠为游畋之地耶，是安知周制之法与？○注云“文王在岐山之时，虽为西伯，土地尚狭，而囿以大”者。○正义曰：案郑玄《诗谱》云：“周之先公曰太王者，避狄难，自豳始迁焉，商王帝乙之初，命其子王季为西伯，至纣，又命文王典治南国江汉汝坟之诸侯。是文王继父之业为西伯於岐邑也。商之州长曰伯，谓为雍州伯也。子夏云：王季以九命作伯於西，文王因之，亦为西伯焉。《论语》云：“三分天下有其二，以服事殷。”是时宜七十里之囿而民犹以为小也。○注“郊关，齐四境之郊皆有关”者。○正义曰：《周官·闾师》：“掌国中及四郊之人民。”《司马法》曰：“王国百里为郊，二百里为州，三百里为野，四百里为县，五百里为都。”《载师》掌任土之法，“以宅田、土田、贾田、任近郊之地。以官田、牛田、赏田、牧田任远郊之地”。杜子春云：“五十里为近郊，百里为远郊。”云“四境郊皆有关”者，盖四郊之门也。" }
      - { type: j, text: "齐宣王问曰：“交邻国有道乎？”" }
      - { type: z, text: "问与邻国交接之道。" }
      - { type: j, text: "孟子对曰：“有。" }
      - { type: z, text: "欲为王陈古圣王之比也。" }
      - { type: j, text: "惟仁者为能以大事小，是故汤事葛，文王事昆夷。" }
      - { type: z, text: "葛伯放而不祀，汤先助之祀。《诗》云：“昆夷兑矣，惟其啄矣。”谓文王也。是则圣人行仁政，能以大事小者也。" }
      - { type: j, text: "惟智者为能以小事大，故太王事獯鬻，勾践事吴。" }
      - { type: z, text: "獯鬻，北狄疆者，今匈奴也。大王去避獯鬻。越王勾践退於会稽，身自臣事吴王夫差。是则智者用智，是故以小事大而全其国也。" }
      - { type: j, text: "以大事小者，乐天者也。以小事大者，畏天者也。乐天者保天下，畏天者保其国。《诗》云：‘畏天之威，于时保之。’”" }
      - { type: z, text: "圣人乐行天道，如天无不盖也，故保天下，汤、文是也。智者量时畏天，故保其国，大王、勾践是也。《诗·周颂·我将》之篇，言成王尚畏天之威，於是时故能安其太平之道也。" }
      - { type: j, text: "王曰：“大哉言矣！寡人有疾，寡人好勇。”" }
      - { type: z, text: "王谓孟子之言大，不合於其意。答之云寡人有疾，在於好勇，不能行圣贤之所履也。" }
      - { type: j, text: "对曰：“王请无好小勇。夫抚剑疾视，曰：‘彼恶敢当我哉’此匹夫之勇，敌一人者也。" }
      - { type: z, text: "疾视，恶视也。抚剑目曰：人安敢当我哉！此一匹夫之勇，足以当一人之敌者也。" }
      - { type: j, text: "王请大之。《诗》云：‘王赫斯怒，爰整其旅，以遏徂莒，以笃周祜，以对于天下。’此文王之勇也。文王一怒而安天下之民。" }
      - { type: z, text: "《诗·大雅·皇矣》之篇也。言文王赫然斯怒，於是整其师旅，以遏止往伐莒者，以笃周家之福，以扬名於天下。文王一怒而安民，愿王慕其大勇，无论匹夫之小勇。" }
      - { type: j, text: "《书》曰：‘天降下民，作之君，作之师。惟曰其助上帝宠之。四方有罪无罪，惟我在，天下曷敢有越厥志？’" }
      - { type: z, text: "《书》，《尚书》逸篇也。言天生下民，为作君，为作师，以助天光宠之也。四方善恶皆在己，所谓在予一人，天下何敢有越其志者也。" }
      - { type: j, text: "一人衡行於天下，武王耻之，此武王之勇也。" }
      - { type: z, text: "衡，横也。武王耻天下一人有横行不顺天道者，故伐纣也。" }
      - { type: j, text: "而武王亦一怒而安天下之民。今王亦一怒而安天下之民，民惟恐王之不好勇也。" }
      - { type: z, text: "孟子言武王好勇，亦则文王一怒而安天下之民也。今王好勇，亦则武王一怒而安天下之民。民恐王之不好勇耳，王何为欲小勇而自谓有疾也。自“齐宣王”至“惟恐王之不好勇也”。○正义曰：此章言圣人乐天，贤者知时，仁必有勇，勇以讨乱，而不为暴，则百姓安之。“齐宣王问曰：交邻国有道乎”者，是宣王问孟子，以交接邻国其有道乎？“孟子对曰有”者，孟子欲陈古之圣王而比之，故答之曰：有道也。“惟仁者为能以大事小，是故汤事葛，文王事昆夷”至“于时保之”者，是皆孟子陈古之圣王而比之之文也。言惟有仁者之君乃能以大而奉事其小，是故葛国之伯不祭祀，而汤且遗之牛羊而助之，是汤事葛也。文王西有昆夷之患，而以采薇薄伐，肆不殄厥愠，是文王事昆夷也。昆夷，西戎之国也。惟智者乃能以小奉事其大，是故太王去避狄，始事之以皮币、珠玉、犬马而不免，是大王事獯鬻也。勾践退会稽，身自官事吴王夫差，是勾践事吴也。勾践，越王也。以大奉事其小，是乐行天道，如天无不覆者也；以小奉事其大，以其量时畏天者也。故乐天者如汤、文，遂能安天下；畏天者如大王、勾践，遂能安其国。故《诗》之《周颂·我将》之篇有云“畏天之威，于时保之”，盖言成王能钦畏上天之威，故能安持盈守，成太平之道也。此孟子所以引之而证其言。“王曰：大哉言矣，寡人有疾，寡人好勇”者，宣王谓孟子之言大，不合己意，故答之曰“大哉言矣”，以言其寡人有疾，而疾在於好勇也。“对曰：王请无好小勇。夫抚剑疾视，曰彼恶敢当我哉，此匹夫之勇，敌一人者也”者，是孟子又答宣王，言宣王也今请之无好其小勇也，夫按剑目，疾视而号於众，曰彼安敢当敌我哉，此则一匹夫之小勇，只可以抵敌於一人者也。故曰王请大之也。“《诗》云：王赫斯怒，爰整其旅，以遏徂莒，以笃周祜，以对于天下”者，此《诗·大雅·皇矣》之篇文也，孟子所以引此者，盖欲言文王之勇而陈于王也，故曰此文王之勇也。其《诗》盖言文王赫然大怒，以整其师旅，以止往伐莒，以笃厚周家之福，以扬天下之名也。言文王亦一怒而安天下之民者，谓文王亦以此一怒而安天下之民也。“《书》曰：天降下民，作之君，作之师，惟曰其助上帝，宠之四方。有罪无罪惟我在，天下曷敢有越厥志”者，此周书之文也。孟子所以又引此《书》云者，盖又欲言武王之勇而陈于王也。言天生下民，而立之君师以治以教之，惟曰其在助相上帝，宠安四方，有善有恶皆在我，天下安有敢违越其志者也。“一人衡行於天下，武王耻之，此武王之勇也”者，一人指纣而言之也，言纣一人纵横逆行其道而不顺其天，故武王心愧耻之，於是伐纣也。凡此是武王之大勇也。而武王於是亦一怒而安天下之民，故曰“武王亦一怒而安天下之民”。“今王亦一怒而安天下之民，民惟恐王之不好勇也”者，孟子言今王若能如文王、武王一怒而安天下之民，则天下之民惟恐王之不好勇也。○注“葛伯不祀”至“小者也”。○正义曰：《书》云：“葛伯不祀，汤始征之。”孔安国云：“葛，国也。伯，爵也。汤居亳，与葛为邻。葛伯不祀，汤使人遗之牛羊，又不祀，汤又使入往为之耕。”是其助之也。“《诗》云：混夷兑矣，惟其喙矣。谓文王也”者，盖引《大雅·绵》之篇文也。笺云：“混夷，夷狄国也。见文王之使者将士众过己国，则惶怖惊走，奔突入柞或之中而逃，甚困剧也。”又云：“兑，突也。喙，困也。”赵注引此而证以解作文王事混夷，大与《诗》注不合。又云：“大王避狄，文王伐混夷，成道兴国，其志一也。”是文王未尝事之也。今孟子乃曰：“文王事混夷者，混夷，西戎之国也，《诗》之《采薇》云“文王之时，西有昆夷之患”，注云“混夷，西戎也”是也。今据《诗》之笺云乃曰伐昆夷，与孟子不合者，盖文王始初事之，卒不免，故伐之也。始初之时，乃服事殷之时也。赵注引“混夷兑矣，惟其喙矣”，盖失之矣。○注“獯鬻”至“其国也”。○正义曰：案《匈奴传》云：“唐虞以上有山戎、犭佥狁、獯戎居于北边。夏道衰，公刘变于西戎，邑于豳。其後三百馀岁，戎狄攻大王父，父走于岐山。後至六国，遂为匈奴。”是也。云“越王勾践退会稽，而身自官事吴王夫差”者，案《史记·世家》云：“吴王阖庐十五年伐越，至吴王夫差元年，悉以精兵伐越，败之。越王勾践乃以甲兵五千人栖於会稽，请委国为臣妾。”是也。贾逵曰：“会稽，山名也。”○注“《周颂·我将》之篇”至“太平之道”。○正义曰：笺云：于时，於是也。言成王畏天之威，於是得安文王之道，是其解也。○注“疾视”至“敌也”。○正义曰：庄书云：“蓬头突鬓，目而语，此庶人之勇，无异於斗鸡，一旦命已绝矣。”是与此同意。○注“《大雅》”至“小勇”。○正义曰：案《大雅·皇矣》之篇，其文乃曰“以遏徂旅”，今孟子乃曰“以遏徂莒”者。又案《春秋》鲁隐公二年书“莒子盟于密”，则莒者，密之近地。《诗》言“密之众”，孟子言“密之地”其旨同也。○注“《尚书》逸篇”。○正义曰：案《周书·泰誓》篇，今有云“天佑下民，作之君，作之师，惟其克相上帝，宠绥四方，有罪无罪，予曷敢有越厥志”，孔安国云：“宠绥四方，言当能助宠安天下。越，远也。言已志欲为民除恶，是与否不敢远其志。”赵注乃以“其助上帝宠之”而断其句，以“四方”为下文，则其意俱通，故二解皆录焉。○注“衡横也”至“伐纣也”。○正义曰：《周书·泰誓》篇云“惟十有一年，武王伐纣”是也。释文云：“衡，横也。”" }
      - { type: j, text: "齐宣王见孟子於雪宫。王曰：“贤者亦有此乐乎？”" }
      - { type: z, text: "雪宫，离宫之名也。宫中有苑囿台池之饰，禽兽之饶，王自多有此乐，故问曰：贤者亦有此之乐乎？" }
      - { type: j, text: "孟子对曰：“有人不得则非其上矣。不得而非其上者，非也。为民上而不与民同乐者，亦非也。" }
      - { type: z, text: "有人不得，人有不得其志也。不责已仁义不自修，而责上之不用己，此非君子之道。人君情从欲，独乐其身，而不与民同乐，亦非在上不骄之义也。" }
      - { type: j, text: "乐民之乐者，民亦乐其乐。忧民之忧者，民亦忧其忧。" }
      - { type: z, text: "言民之所乐，君与之同，故民亦乐使其君有乐也。民之所忧者，君亦助之忧，故民亦能忧君之忧，为之赴难也。" }
      - { type: j, text: "乐以天下，忧以天下，然而不王者，未之有也。" }
      - { type: z, text: "言古贤君乐则以已之乐与天下同之，忧则以天下之忧与已共之，如是未有不王者。孟子以是答王者，言虽有此乐，未能与人共之。" }
      - { type: j, text: "昔者齐景公问於晏子曰：‘吾欲观於转附、朝亻舞、遵海而南，放於琅邪，吾何而可以比於先王观也？’" }
      - { type: z, text: "孟子言往者齐景公尝问其相晏子若此也。转附、朝亻舞，皆山名也。又言朝，水名也。遵，循也。放，至也。循海而南，至於琅邪。琅邪，齐东境上邑也。当何修治，可以比先王之观游乎？先王，先圣王也。" }
      - { type: j, text: "晏子对曰：‘善哉问也！天子诸侯曰巡狩，巡狩者，巡所守也。诸侯朝於天子曰述职，述职者，述所职也。无非事者，春省耕而补不足，秋省敛而助不给。" }
      - { type: z, text: "言天子、诸侯出，必因王事，有所补助於民，无非事而空行者也。春省耕，补耒耜之不足。秋省敛，助其力不给也。" }
      - { type: j, text: "夏谚曰：吾王不游，吾何以休？吾王不豫，吾何以助？一游一豫，为诸侯度。" }
      - { type: z, text: "晏子道夏禹之世民之谚语也。言王者巡狩观民，其行从容，若游若豫。豫亦游也，《春秋传》曰：“鲁季氏有嘉树，晋范宣子豫焉。”吾王不游，吾何以得见劳苦蒙休息也。吾王不豫，我何以得见赈赡助不足也。王者一游一豫，行恩布德，应法而出，可以为诸侯之法度也。" }
      - { type: j, text: "今也不然，师行而粮食，饥者弗食，劳者弗息。胥谗，民乃作慝。" }
      - { type: z, text: "今也者，晏子言今时天下之民，人君行师兴军，皆远转粮食而食之，有饥不得饱食者，劳者致重，亦不得休息；在位在职者又侧目相视，更相谗恶，民由是化之而作其慝恶也。" }
      - { type: j, text: "方命虐民，饮食若流。流连荒亡，为诸侯忧。" }
      - { type: z, text: "方犹逆也。逆先王之命，但为虐民之政，恣意饮食，若水流之无穷极也。谓沈湎于酒，熊蹯不熟、怒而杀人之类也。流连荒亡，皆骄君之溢行也。言王道亏，诸侯行霸，由当相匡正，故为诸侯忧也。" }
      - { type: j, text: "从流下而忘反谓之流，从流上而忘反谓之连，从兽无厌谓之荒，乐酒无厌谓之亡。先王无流连之乐、荒亡之行。惟君所行也。’" }
      - { type: z, text: "言骄君放游，无所不为。或浮水而下，乐而忘反谓之流，若齐桓与蔡姬乘舟於囿之类也。连，引也。使人徒引舟舡上行，而亡反以为乐，故谓之连。《书》曰：“罔水行舟”，丹朱慢游，是好无水而行舟，岂不引舟於水上而行乎？此其类也。从兽无厌，若羿之好田猎，无有厌极，以亡其身，故谓之荒乱也。乐酒无厌，若殷纣以酒丧国也，故谓之亡。言圣人之行无此四者，惟君所欲行也。晏子之意，不欲使景公空游於琅邪而无益於民也。" }
      - { type: j, text: "景公说，大戒於国，出舍於郊。於是始兴发，补不足。" }
      - { type: z, text: "景公说晏子之言也。戒，备也。大修戒备於国。出舍於郊，示忧民困。始兴惠政，发仓廪以赈贫困不足者也。" }
      - { type: j, text: "召大师，曰：‘为我作君臣相说之乐。’盖《徵招》、《角招》是也。" }
      - { type: z, text: "大师，乐师也。《徵招》、《角招》，其所作乐章名也。" }
      - { type: j, text: "其《诗》曰：‘畜君何尤？’畜君者，好君也。”" }
      - { type: z, text: "其诗，乐诗也。言臣说君，谓之好君。何尤者，无过也。孟子所以导晏子、景公之事者，欲以感喻宣王，非其矜夸雪宫而欲以苦贤者。“齐宣王”至“好君也”。○正义曰：此章指言与天下同忧者，不为慢游之乐，不循肆溢之行也。是以文王不敢盘于游田也。“齐宣王见孟子於雪宫”者，雪宫，离宫之名也，中间有池囿。言宣王在雪宫之中，而见孟子来至也。“王曰贤者亦乐此乎”者，是宣王称孟子为贤者，问之孟子亦尝有此雪宫之乐也？云“乎”者，亦未知孟子可否若何？所以云“乎”而疑之之辞也，亦梁惠王在沼上而问孟子贤者亦乐此乎同意。“孟子对曰：有人不得，则非其上矣”至“然而不王者未之有也”者，孟子答宣王之言，而欲宣王有此雪宫之乐在与民同其乐也。故言有为人下者，不得此乐则必非谤其上矣。为人下者，既不得此乐，而以非谤其上，非也，以其不可也。无他，是不知命与分定故也。为民之上者，既有此乐，而不与下民同其乐，亦非也，以其亦不可也。无他，是不知义而失之於骄也。盖为之君，在民之上，凡有所乐，皆出於民之赋役而成之也，岂可骄之哉！故曰亦非也。苟为君能以民之所乐而为己之乐，则在下之民，见君之所乐亦乐之，面不敢非谤也。以民之所忧而己亦为忧之，则在己有所忧，而在下之民亦分忧之矣。凡此皆君、民忧乐施报之效也，故曰在上为君者，凡有所乐，与天下之民同其乐；凡有所忧，天下之民同其忧：然而天下不归往而为之王者，未之有也。言其无也。“昔者齐景公问於晏子曰：吾欲观於转附、朝亻舞、遵海而南，放於琅邪，吾何而可比於先王观也”至“好君也”者，是皆孟子引景公问晏子、晏子告景公之言而诲齐宣王也。昔，往也。齐景公，齐庄公之後、景公杵臼是也。鲁襄公二十六年立，在位五十八年薨。转附、朝亻舞皆山名也。又云朝，水也。言往者齐景公尝问於晏子曰：我欲游观於转附、朝亻舞，循海而南，至於琅邪，我何以修治而可以比效於先圣王之游观也。晏子，齐景公之相，齐大夫也，姓晏名婴者。晏子答曰善哉王之问也，乃言天子往於诸侯谓之巡狩，巡狩者，谓巡诸侯为天子所守土也，如岁二月东巡狩，五月南巡狩，八月西巡狩，十一月北巡狩是也。诸侯朝觐於天子谓之述职，述职者，谓述已之所守职，如春朝以图天下之事，夏宗以陈天下之谟，秋觐以比邦国之功，冬遇以协诸侯之虑是也。然此皆无非事而已，春则省察民之耕，而食不足者则补之，如《周礼·旅师》春颁其粟是也；收则省察民之收，而有力不足者则助之，如《遂师》巡其稼穑，而移用其民，以救时事是也：凡如此是皆下之所以有望於上而巡也。故夏禹之世，民俗谚有曰：我王不游，我何以得其休息；我王不豫，我何以得助其力。此先圣王所以一游一豫而为诸侯之法度也。统而言之，则游与豫皆巡行也；别而言之，则游者有所纵至於也，豫者有所而至於乐也。故於游则未至於豫，豫则不止於游也。今也景公则不如此，其兴师行军，皆远转粮食而食之，有饥之民而不得饱食，有劳乏之民则不得休息。在位者皆然侧目相视而非其上，而下民又皆作为邪慝也，故“方命虐民，饮食若流，流连荒亡，为诸侯忧”。方，逆也，凡物圆则行，方则止，行则顺，止则逆。所谓方命虐民者，是逆先王之命，而下则暴虐民人也。凡游豫补助，皆先王之命也。今则方命而虐民，又饮食无穷极而若水之流。盖流、连、荒、亡四行，皆为诸侯之所忧也，以其皆能丧亡其身而已。故流者是从流下而忘反之谓也，如齐桓与蔡姬乘舟於囿是也；连者从流上而忘反之谓也，如《书》曰“罔水行舟”，若丹朱是也；荒者从兽无厌之谓也，如羿之好田猎无有厌极，以亡其身是也；亡者乐酒无厌之谓也，如殷纣以酒丧国是也。故曰“从流下而忘反谓之流，从流上而忘反谓之连，从兽无厌谓之荒，乐酒无厌谓之亡”，以其晏子自解之耳。言“先王无流连之乐、荒亡之行。惟君所行也”者，谓古之先王无此流连之极乐、荒亡之溢行，惟独在君所行也。君者指景公而言也。景公自知已小有流连之乐，大有荒亡之行，遂一闻晏子之言而喜悦之。景公所以说者，以其能悟而改过也。乃大戒敕於国，而敢慢其事；出舍於郊，而不敢宁其居；於是能兴发仓廪而补赡其不足者。又召乐师之官曰：为我作君臣相说之乐。以作《徵招》、《角招》是也。必作其《徵招》、《角招》之者，盖徵以为事，角以为民，皆以招名之，曰亦舜作歌以康庶事、鼓琴歌南风以阜民财之意也，此所以谓之《徵招》、《角招》矣。又引《乐诗》曰“畜君何尤”，畜君者，好君也。言说君所以好君，何有其过也，故又曰畜君者是好君也。凡此皆晏子所言，是其畜君者也。孟子引此诲宣王，亦欲宣王如景公说晏子之言而悟之也。○注“转附、朝亻舞”至“邑也”。正义曰：云转附、朝亻舞皆山名，今案诸经并未详，据梁时顾野王释云：氵舞，水名，出南阳。恐误氵舞为亻舞，他并未详。云“琅邪为齐东南上邑”者，案《地理志》云：“齐地东有琅邪。”《南越志》云“琅邪，邑名”是也。○注“沉湎于酒，熊蹯不熟、怒而杀人”者。○正义曰：注云：“羲和湎淫，胤往征之。”孔安国云：“羲和氏世业天地四时之官，自唐虞至三代世职不绝承，太康之後，沉湎于酒，过差非度。”又曰：“纣沉湎冒乱，敢行暴虐。”孔安国《传》云：“沉湎耆酒。”《春秋》鲁宣公二年：“晋灵公不君，厚敛以雕墙，从台上弹人，而观其避九也。宰夫而熊蹯不熟，杀之，置诸畚，使妇人载以过朝。”释云：“而，煮也。畚，草器也。”○注“齐桓与蔡姬乘舟於囿”。正义曰：案鲁僖公三年《左传》云：“齐侯与蔡姬乘舟于囿，荡公，公怒。”杜预曰：“蔡姬，齐侯夫人。荡，摇也。囿，苑也。盖鱼池在苑中耳。”○注“《书》云罔水行舟，若丹朱慢游”者。○正义曰：案《书·益稷》篇云：“无若丹朱傲，惟慢游是好，傲虐是作。罔昼夜额额，罔水行舟，朋淫于家，用殄厥世。”孔安国云：“丹朱，尧之子。傲戏而为虐，无昼夜，常额额，肆恶无休息，习於无水陆地行舟，言无度，群淫於家，妻妾乱用，是绝其世不得嗣。”○注“羿之好田猎无有厌极，以亡其身”。○正义曰：案《书》云：“太康尸位，以逸豫灭厥德，黎民咸贰，乃盘游无度，畋于有洛之表。十旬弗反，有穷后羿因民弗忍，距于河。”孔注曰：“有穷，国名。羿，诸侯名。距太康於河，不得入，遂废之。”鲁襄公四年《左传》云，事录在梁惠王首章。贾逵曰：“羿之先祖，世为射官，故帝喾赐羿弓矢，使司射。”《淮南子》云：“尧十日并出，尧使羿射九日而落之。”《归藏易》云：“羿弹十日。”凡此其说羿为诸侯名，皆难取信。欲言帝喾时有羿，尧时亦有羿，则羿是善射之号，非为人名。信如是，则不知言以羿为穷国君号、为诸侯者何也。○注“殷纣以酒丧国”。○正义曰：案《史记》云：“殷王纣乐戏於沙丘，以酒为池，以肉为林，使男女裸，相逐其间，为长夜之饮。百姓怨望，而诸侯有畔。於是有炮烙之法，後为武王所伐。”是也。○注“《徵招》、《角招》，乐章也”。○正义曰：凡宫、商、角、徵、羽，盖乐之五声也。《晋志》云：“宫，土音，数有八十一，为声之始，属土者，以其最浊者也，君之象也。宫乱则荒，其君骄。商，金音，三分徵益一以生，其数七十二，属金者，以其浊，次宫，臣之象也。商乱则讠皮，其官坏也。角，木音，三分羽益一以，生其数六十四，属木者，以其清浊，中人之象也。乱则忧，其人怨也。徵，火音，三分宫去一以生，其数五十四，属火者，以其微清，事之象也。乱则哀，其事隳也。羽，水音，三分商去一以生，其数四十八，属水者，以其最清，物之象也。乱则危，其财匮也。凡此乃为乐章之名也。然则景公所以作角、徵乐，以其为民、为事也。○注“文王不敢盘于游畋也”。○正义曰：注云此者，盖引《周书·无逸》之篇文也。孔注云文王不敢盘于游畋者，是不敢乐於游逸田猎者也，故录此焉。）" }
      - { type: j, text: "齐宣王问曰：“人皆谓我毁明堂，毁诸？已乎？”" }
      - { type: z, text: "谓泰山下明堂，本周天子东巡狩朝诸侯之处也，齐侵地而得有之。人劝齐宣王，诸侯不用明堂，可毁坏，故疑而问於孟子当毁之乎。已，止也。" }
      - { type: j, text: "孟子对曰：“夫明堂者，王者之堂也，王欲行王政，则勿毁之矣。”" }
      - { type: z, text: "言王能行王道者，则可无毁也。" }
      - { type: j, text: "王曰：“王政可得闻与？”" }
      - { type: z, text: "王言王政当何施，其法宁可得闻。" }
      - { type: j, text: "对曰：“昔者文王之治岐也，耕者九一，仕者世禄，关市讥而不征，泽梁无禁，罪人不孥。" }
      - { type: z, text: "言往者文王为西伯时，始行王政，使岐民修井田，八家耕八百亩，其百亩者以为公田及庐井，故曰九一也。纣时税重，文王复行古法也。仕者世禄，贤者子孙必有土地。关以讥难非常，不征税也。陂池鱼梁不设禁，与民共之也。孥，妻子也。《诗》云：“乐尔妻孥。”罪人不孥，恶恶止其身，不及妻子也。" }
      - { type: j, text: "老而无妻曰鳏，老而无夫曰寡，老而无子曰独，幼而无父曰。孤此四者天下之穷民而无告者，文王发政施仁，必先斯四者。" }
      - { type: z, text: "言此四者皆天下之穷民，而文王常恤鳏寡存孤独也。" }
      - { type: j, text: "《诗》云：‘哿矣富人，哀此茕独。’”" }
      - { type: z, text: "《诗·小雅·正月》之篇。哿，可也。诗人言居今之世可矣，富人但怜悯此茕独羸弱者耳。文王行政如此也。" }
      - { type: j, text: "王曰：“善哉言乎！”" }
      - { type: z, text: "善此王政之言。" }
      - { type: j, text: "曰：“王如善之，则何为不行？”" }
      - { type: z, text: "孟子言王如善此王政，则何为不行也。" }
      - { type: j, text: "王曰：“寡人有疾，寡人好货。”" }
      - { type: z, text: "王言我有疾，疾於好货，故不能行。" }
      - { type: j, text: "对曰：“昔者公刘好货，《诗》云‘乃积乃仓，乃裹糇粮，于橐于囊，思戢用光。弓矢斯张，干戈戚扬，爰方启行’。故居者有积仓，行者有裹囊也，然後可以爰方启行。王如好货，与百姓同之，於王何有？”" }
      - { type: z, text: "《诗·大雅·公刘》之篇也。乃积於仓，乃裹盛乾食之粮於橐囊也。思安民，故用有宠光也。戚，斧；扬，钺也。又以武备之，曰方启行道路。孟子言公刘好货若此，王若则之，於王何有不可也。" }
      - { type: j, text: "王曰：“寡人有疾，寡人好色。”" }
      - { type: z, text: "王言我有疾，疾於好色，不能行也。" }
      - { type: j, text: "对曰：“昔者太王好色，爱厥妃。《诗》云：‘古公父，来朝走马。率西水浒，至于岐下。爰及姜女，聿来胥宇。’当是时也，内无怨女，外无旷夫。王如好色，与百姓同之，於王何有？”" }
      - { type: z, text: "《诗·大雅·绵》之篇也。父，大王名也，号称古公。来朝走马，远避狄难，去恶疾也。率，循也。浒，水涯也。循西方水浒，来至岐山下也。姜女，大王妃也。於是与姜女俱来相土居也。言太王亦好色，非但与姜女俱行而已，普使一国男女无有怨旷。王如则之，与百姓同欲，皆使无过时之思，则於王之政何有不可乎！“齐宣王问”至“於王何有”。○正义曰：此章指言夫子恂恂然善诱人，诱人进于善也。齐王好货色，孟子推以公刘、大王，所谓“责难于君谓之恭”者也“齐宣问曰：人皆谓我毁明堂，毁诸？已乎”者，是齐王问孟子，以为在国之人皆谓劝我毁坏其明堂。今毁坏之已？而勿毁坏乎？鲁太山下有明堂，後为齐侵其地，故齐有明堂。齐宣王尚疑之，所以问也。“孟子对曰：夫明堂者，王之堂也。王欲行王政，则勿毁之矣”者，孟子欲使宣王行王政，所以劝之勿毁耳。“王曰：王政可得闻与”者，是宣王问孟子，以谓王政之法宁可得而闻知之欤？“对曰：昔者文王之治岐也，耕者九一，仕者世禄，关市讥而不征，泽梁无禁，罪人不孥”至“必先斯四”者，是孟子对答宣王为王政之法也。言往者文王为西伯行政，自岐邑耕者，皆以井田之法制之，一夫受私田百亩，八夫家计受私田八百亩，井田中百亩是为公田，以其九分抽一分为公，以抵其赋税也；仕者不特身受其禄，而至子孙之世亦与土地禄焉；关市，司关、司市之所，但讥问之，不令奸人出入，而不征取其税；川泽鱼梁之所，但与民共之，而不设禁止之法；罪人但诛辱止其一身，而不诛辱其妻子，孥，妻子也。老而无妻曰鳏，老而无夫曰寡，老而无子曰独，幼而无父曰孤，凡此鳏、寡、孤、独四者，是皆天下之民穷而无告者也。文王发政施仁，必先及此四者焉。无告者，以其鳏、寡、孤、独，单只上下，无所告者之人也。是皆孟子言文王在岐邑之时，为王政之法，如此而已。“《诗》云：“哿矣富人，哀此茕独”者，哿，可也，盖《诗》之《小雅·正月》之篇文也。其意盖言当今之世可矣，富人但先哀悯此茕独羸弱者耳。孟子所以引之，谓其文王行政是如此也，故援之以答宣王。“王曰：善哉言乎”者，是宣王问、孟子答之以文王行王政之法而善其言也。故曰：“善哉言乎。”“曰：王如善之，则何为不行”者，孟子言王如能善此王政之言，则何为不行此也。“王曰：寡人有疾，寡人好货”者，宣王言我有疾，疾在於好货财也。“昔者公刘好货，《诗》云”至“於王何有”者，孟子引公刘好货，故《诗》有《大雅·公刘》之篇文，而答于宣王也。言往者公刘好其货财，其诗盖谓乃积于仓，乃裹乾食之粮於橐囊之中，其思在於辑和其民以光显于时。张其弓矢，执其干戈斧钺，告其士卒曰：为女方开道路而行。如此，故居者有积于仓，行者有粮裹于囊，然後可以曰方开道路而行。王如能好货，与民人同之，亦若公刘之如此，则於王也何有不可。云“橐囊”者，大曰囊，小曰橐也。爰，曰也。“王曰寡人有疾，寡人好色”者，是宣王又言我有疾，疾在於好色也。“对曰：昔者太王好色，爱厥妃，《诗》云”至“於何有”者，是孟子又引太王好色，故《诗·大雅·绵》之篇文也，答宣王也。父，大王名也。古公，号也。言往者太王好色，爱厥妃，其诗盖谓古公父，来朝走马，而避恶且早又疾急，循西水涯而至于岐山之下，曰与姜女自来相土居如此，故当是之时，内无怨女，外无旷夫。皆男、女嫁娶过时者，谓之怨女、旷夫也。女生向内，故云内。男生向外，故云外。王如能好色，与百姓同之，亦若大王之如此，则於王也，又何有不可。姜女，大姜也，是太王之妃也。○注“谓太山下明堂”至“已，止也”。○正义曰：案《地理志》云：“齐南有太山。”《史记·封禅书》云：“舜二月东巡狩，至于岱宗。岱宗，太山也。遂觐东后。”又云：“此山黄帝之所常游，自古受命帝王，未有睹符瑞见而不臻乎太山也。”云“太山下明堂，本周天子东巡狩朝诸侯之地”，案《礼记·明堂位》云：“明堂者，明诸侯之尊卑。昔殷纣乱天下，脯诸侯以享诸侯。是以周公相武伐纣。武王崩，成王幼弱，周公践天子之位。六年，朝诸侯於明堂。七年，执政於成王。成王封周公於曲阜，令鲁世世祀周公以天子之礼乐。”然则太山下明堂即周公朝诸侯之处。盖鲁封内有太山，後尝为齐所伐，故齐南有太山。《文中子》云：“如有用我者，当处於太山矣。”注云：“太山，黄帝有合宫在其下，可以立明堂之制焉。”《礼器》云：“鲁人将有事於上帝，必先有事於郊宫。齐人将有事於太山，必先有事於配林。”则太山在齐明矣。案周制明堂云：“周人明堂，度九尺之筵，东西九筵，南北七筵，堂崇一筵，五室，凡室二筵。”贾释云：“明堂者，明政教之堂。”又夏度以步，殷度以寻，周度以筵，是王者明政也。周堂高九尺，殷三尺，以一相参之数而卑宫室，则夏堂高一尺矣。又上注云：堂上为五室，象五行，以宗庙制如明堂，明堂中有五天帝、五人神之座，皆法五行，以五行先起於东方，故东北之堂为木，其实兼水矣；东南火室矣，兼木；西南金室，兼火：西北水室，兼金。以中央太室有四堂，四角之室亦皆有堂，乃知义然也。贾释《太史》“闰月”下义云“明堂、路寝及宗庙皆有五室十二堂门”，是也。四角之堂，皆於太室外接四角为之，则五室南北止有二筵，东西角二筵有六尺，乃得其度。若听朔皆於时之堂，不於木火等室居。若闰月则阖门左扉，立其中而听朔焉。○注“往者文王为西伯”至“妻子也”。○正义曰：《史记》云：“古公父为獯鬻戎狄所攻，遂去，逾梁山，止於岐下。古公少子季历生昌，有圣瑞，立季历以传昌。昌立，是为西伯。西伯阴行善，诸侯皆来。”徐广曰：“文王九十七乃崩。”云修井田八家八百亩以为公田者，亦依孟子云“方里而井，井九百亩”是也。小司徒佐大司徒，当都鄙三等之菜地而为井田，经云“九夫为井，四井为邑，四邑为丘，四丘为甸，四甸为县，四县为都”，以任役万民，使营地事而贡军赋，出车徒。又菜地之中，每一井之田，出一夫之税以入於官也，故曰九一也。云“纣时税重”者，《史记》云：“纣为人资辨捷疾，闻见甚敏，材力过人，手格猛兽，智足以拒谏，言足以饰非，好酒淫乐，嬖於妇人。爱妲已，於是厚赋税以实鹿台之财，盈距桥之栗。”是纣时税重也。“关讥不征税，鱼梁不设禁”者，《周礼·司关》“国凶札，则无关门之征，犹讥”，《司市》“国凶荒，则市无征而作布”，《泽虞》“掌国泽之政令，为之厉禁”，《川衡》“以时舍其守，犯禁者，执而罚之”，《司厉》“男子入于罪隶，女子入于舂藁”。此而推之，则关市非无征也，泽梁非无禁也，罪人非不孥也，而文王必皆无者，盖亦见文王权一时之宜，不得不然耳。故孟子於宣王之一时，亦以此引之以救弊矣。○注“《诗·小雅·正月》之篇”者。○注云：“哿，可也”，“独，单也”。笺云：“此言王政如是，富人已可独困也。”○注“《诗·大雅·公刘》之篇也”至“不可也”。○正义曰：注云：“公刘居於邰而遭夏人乱，迫逐公刘，公刘乃辟中国之难，遂平西戎，而迁其民，邑於焉。‘乃积乃仓’，言民事时和，国有积仓也。小曰橐，大曰囊。‘思辑用光’，言民相与和睦，与显於时也。”笺云：“公刘乃有积仓，积委及仓也。安安而能迁，积而能散，为夏人迫逐已之故，不忍斗其民乃，裹粮食於橐囊之中，弃其馀而去，思在和其人民，用光其道，为今子孙之基。”又毛注云：“戚，斧也。扬，钺也。张其弓矢，秉其干戈戚扬，以方开道路去之。盖诸侯之从者，十有八国焉。”笺云：“干，盾也。戈，勾矛戟也。爰，曰也。公刘之去邰，整其师，设其兵器，告其士卒曰：为方开道而行。明已之迁非为迫逐之，故乃欲全民也。”○注“《诗·大雅·绵》之篇也”至“不可乎”。正义曰：“《绵》诗，兴也，绵绵不绝貌也。”毛注云：“古公，豳公也，古言久也。父，字。或因以名，言质也。古公处豳，狄人侵之，事之以皮币，不得免焉，事之以犬马，不得免焉，事之以珠玉，不得免焉。乃属其耆老而告之曰：狄之所欲者吾土地，吾闻君子不以所养人者害人。於逾梁山，邑于岐山之下居焉。率，循也。浒，水涯也。姜女，大姜也。胥，相也。宇，居也。”笺云：“来朝走马，言其辞恶早且疾也。循西水涯，涯，漆水侧也。爰，於也。及，与也。聿，自也。於是与其妃大姜自来相可居者。著大姜之贤知也。”" }
      - { type: j, text: "孟子谓齐宣王曰：“王之臣有托其妻子於其友而之楚游者，（假此言以为喻。）比其反也，则冻馁其妻子，则如之何？”" }
      - { type: z, text: "言无友道，当如之何。" }
      - { type: j, text: "王曰：“弃之。”" }
      - { type: z, text: "言当弃之，绝友道也。" }
      - { type: j, text: "曰：“士师不能治士，则如之何？”" }
      - { type: z, text: "士师，狱官吏也。不能治狱，当如之何。" }
      - { type: j, text: "王曰：“已之。”" }
      - { type: z, text: "已之者，去之也。" }
      - { type: j, text: "曰：“四境之内不治，则如之何？”" }
      - { type: z, text: "境内之事，王所当理，不胜其任，当如之何。孟子以此动王心，令戒惧也。" }
      - { type: j, text: "王顾左右而言他。" }
      - { type: z, text: "王惭而左右顾视，道他事，无以答此言也。“孟子”至“言他”。○正义曰：此章言君臣上下，各勤其任，无堕其职，乃安其身也。“孟子谓齐宣王曰：王之臣有托其妻子於其友而之楚游”者，是孟子欲以此比喻而讽之也，言王之臣下有寄托妻子於交友，而往楚国游戏者。“比其反也，则冻馁其妻子，则如之何”者，言寄妻子於交友而往楚国，在近则反归，而妻子在交友之所，皆寒冻其肤，饥馁其腹，则为交友之道，当如之何。冻者，寒之过之谓也。馁者，饥之过之谓也。“王曰：弃之”者，是宣王答孟子，以为交友之道既如此，当弃去之，而不必与为友也。“曰：士师不能治士，则为如之何”者，孟子因循又问宣王，言为之狱吏者，而不能主治其士，则为士师者当如之何处之。“王曰：己之”者，言当止之，而不可与为士师也。“曰：四境之内不治，则如之何”者，孟子因循问至於此，乃欲讽谏之，故问之曰：自一国四境之内，皆乱而不治，则为之君，当如之何处之。“王顾左右而言他”者，宣王知罪在诸己，乃自惭羞之，而顾视左右道其他事，无以答此言也。○注“士师，狱官吏也”。○正义曰：士师即周司寇之属，有士师、乡士，皆以士为官。郑玄云：“士，察也。主察狱讼之事。”是士师为狱官之吏者也。" }
      - { type: j, text: "孟子见齐宣王曰：“所谓故国者，非谓有乔木之谓也，有世臣之谓也。" }
      - { type: z, text: "故者，旧也。乔，高也。人所谓是旧国也者，非但见其有高大树木也，当有累世修德之臣，常能辅其君以道，乃为旧国，可法则也。" }
      - { type: j, text: "王无亲臣矣。" }
      - { type: z, text: "今王无可亲任之臣。" }
      - { type: j, text: "昔者所进，今日不知其亡也。”" }
      - { type: z, text: "言王取臣不详审，往日之所知，今日为恶当诛亡，王无以知也。" }
      - { type: j, text: "王曰：“吾何以识其不才而舍之？”" }
      - { type: z, text: "王言我当何以先知其不才而舍之不用也。" }
      - { type: j, text: "曰：“国君进贤，如不得已，将使卑逾尊，疏逾戚，可不慎与！" }
      - { type: z, text: "言国君欲进用人，当留意考择，如使忽然不精心意而详审之，如不得己而取备官，则将使尊卑疏戚相逾，岂可不慎欤。" }
      - { type: j, text: "左右皆曰贤，未可也；诸大夫皆曰贤，未可也；国人皆曰贤，然後察之。见贤焉，然後用之。" }
      - { type: z, text: "谓选乃臣，邻比周之誉，核其乡原之徒，《论语》曰：“众好之，必察焉。”" }
      - { type: j, text: "左右皆曰不可，勿听；诸大夫皆曰不可，勿听；国人皆曰不可，然後察之。见不可焉，然後去之。" }
      - { type: z, text: "众恶之，必察焉。恶直丑正，实繁有徒，防其朋党，以毁忠正也。" }
      - { type: j, text: "左右皆曰可杀，勿听；诸大夫皆曰可杀，勿听；国人皆曰可杀，然後察之。见可杀焉，然後杀之，故曰国人杀之也。" }
      - { type: z, text: "言当慎行大辟之罪，五听三宥。古者刑人於市，与众弃之。" }
      - { type: j, text: "如此，然後可以为民父母。”" }
      - { type: z, text: "行此三慎之听，乃可以子畜百姓也。“孟子见”至“为民父母”。○正义曰：此章言人君进贤退恶，翔而後集，有世贤臣，称曰旧国，则四方瞻仰之，以为则矣。“孟子见齐宣王曰：所谓故国者，非谓有乔木之谓也”者，是孟子见齐宣王而问之，言人所谓旧国者，非谓有高大木而谓之旧国也，以其有世世修德之旧臣也，故谓之旧国，故曰有世臣之谓也。故，旧也。乔，高也。世臣，累世修德之旧臣也。“王无亲臣矣，昔者所进，今日不知其亡也”者，孟子言今王无有亲任用之臣矣，往日所进者，今日为恶，而王又不知诛亡之。“王曰：吾何以识其不才而舍之”者，宣王言我何以知其臣之不才而舍去之而不用也。“曰：国君进贤如不得已，将使卑逾尊，疏逾戚，可不慎欤”者，孟子言国君进用贤人，当留意拣择，如使混然，不能精心拣择，但如不得已而取备官职，则将使其卑逾尊，疏逾戚，而ゾ乱之矣，其如是，岂可不重慎之欤。“左右皆曰贤，未可也。诸大夫皆曰贤，未可也。国人皆曰贤，然後察之。见贤焉，然後用之”至“如此，然後可以为民父母”者，此皆孟子教宣王进退贤不肖之言也。言於进用贤人之际，虽自王之左右臣者，皆曰此人贤，当进用之，则王未可进而用之也。以至诸大夫皆曰此人之贤，当进用之，则王又未可进而用之也。逮至一国之人，皆曰此人之贤，当进而用之，则王然後详察，亦见其真足为贤人，故然後进而用之矣。如左右皆曰此人不贤，不可进用，则王莫听之。以至诸大夫皆曰此人不贤，不可进用，当去之，则王亦当莫听。迨至一国之人皆曰此人不贤，不可进用，当去之，则王然後审察之，见其真实不贤，不可进用，然後去之乃不进用也。如左右皆曰此人之罪，可以杀之，则王又当莫听。以至诸大夫皆曰此人之罪，当杀之，则王又当勿听。迨至一国之人，皆曰此人之罪，可以杀之，则王然後详察，亦见其人实有可杀之罪，故然後方可杀之也。无他，以其一国之人皆曰可杀而杀之也。夫如此，则王然後可以为民父母，而子畜百姓矣。○注“故旧也”至“可法则也”。○正义曰：释云：“故，旧也，文从古，故也。”《诗·伐木》之篇云“出自幽谷，迁于乔木”，注云“乔，高也”。故知乔木为高大之木。郭璞云：“乔，树枝曲卷似鸟羽也。”《书》云：“图任旧人共政。”又周任有言曰“人惟求旧”，是故臣之谓也。○注“乡原之徒”。○正义曰：《语》云：“乡原，德之贼也。”周氏注曰：“所至之乡，辄原其人情而为意以待之，是贼乱其德也。”何晏云：一曰乡，向也，古字同。谓人不能刚毅，而见人辄原其趣向，容媚而合之，言此所以合德也，故有三说焉。○注“大辟之罪五听三宥”。○正义曰：孔安国《传》云：“大辟，死刑也。”《周礼·大司寇》：“以五声听狱讼，求民情：一曰辞听，二曰色听，三曰气听，四曰耳听，五曰目听。”郑注云：“辞听者，观其出不直则烦也。色听者，观其颜色不直则赧然也。气听者，观其气息不直则惴也。耳听者，观其听聆不直则惑也。目听者，观其眸子视不直则毛然也。”凡此五听是也，三宥者，“司剌掌三宥，一宥曰不识，再宥曰过失，三宥曰遗忘”。郑司农云：“不识，谓愚民无所识则宥之；过失，若今律过失杀人，不坐死。”郑玄云：“遗亡，若间惟薄忘有在焉，而以兵矢投射之。”凡此三宥也。○注云：行此三慎之听也，盖指孟子言自“左右皆曰贤”至“国人杀之也”者，是为之解也。" }
      - { type: j, text: "齐宣王问曰：“汤放桀，武王伐纣，有诸？”" }
      - { type: z, text: "有之否乎？" }
      - { type: j, text: "孟子对曰：“於传有之。”" }
      - { type: z, text: "於传文有之矣。" }
      - { type: j, text: "曰：“臣弑其君，可乎？”" }
      - { type: z, text: "王问臣何以得弑其君，岂可行乎？" }
      - { type: j, text: "曰：“贼仁者谓之贼，贼义者谓之残，残贼之人，谓之一夫。闻诛一夫纣矣，未闻弑君也。”" }
      - { type: z, text: "言残贼仁义之道者，虽位在王公，将必降为匹夫，故谓之一夫也。但闻武王诛一夫纣耳，不闻弑君也，《书》云“独夫纣”此之谓也。“齐宣王问”至“未闻弑君也”。○正义曰：此章言孟子云纣崇恶，失其尊名，不得以君臣论之，欲以深寤宣王，垂戒于後也。“齐宣王问曰：汤放桀，武王伐纣，有诸”者，是宣王问孟子，言商之汤王放其夏王桀於南巢之地，周武王伐商王纣於鹿台之中，还是有此言也否乎。“孟子对曰：於传有之”者，孟子答宣王，以为传文有是言也。故《书》云“汤放桀於南巢，惟十有一年，武王伐纣”。又《史记》“武王伐纣，纣走入，登鹿台，蒙衣其珠玉，自燔于火而死。武王以黄钺斩纣头，县大白之旗”是也。“曰臣弑其君，可乎”者，宣王问孟子，如是则为臣下者，得以杀其君上，岂可乎？“曰贼仁者谓之贼，贼义者谓之残，残贼之人，谓之一夫。闻诛一夫纣矣，未闻弑君也”者，孟子答宣王，以谓贼害其仁者，名谓之贼；贼害其义者，名谓之残。名谓残贼者，皆谓之一匹夫也。我但闻诛亡其一匹夫纣矣，未尝闻知有弑君者也，故《尚书》有云“独夫纣”，是其证也。" }
      - { type: j, text: "孟子谓齐宣王曰：“为巨室则必使工师求大木，工师得大木则王喜，以为能胜其任也。匠人斫而小之，则王怒，以为不胜其任矣。" }
      - { type: z, text: "巨室，大宫也。《尔雅》曰：宫谓之室。工师，主工匠之吏。匠人，工匠之人也。将以比喻之也。" }
      - { type: j, text: "夫人幼而学之，壮而欲行之。王曰：‘姑舍女所学而从我，则何如？’" }
      - { type: z, text: "姑，且也。谓人少学先王之道，壮大而仕，欲施行其道，而王止之曰：且舍置汝所学，而从我之教命，此如何也。" }
      - { type: j, text: "今有璞玉於此，虽万镒，必使玉人琢之。至於治国家，则曰‘姑舍女所学而从我’，则何以异於教玉人琢玉哉？”" }
      - { type: z, text: "二十两为镒。琢，治饰玉也，《诗》云：“琢其章”。虽有万镒在此，言众多也，必须玉人能治之耳。至於治国家而令从我，是为教玉人治玉也。教人治玉，不得其道，则玉不得美好。教人治国，不以其道，则何由能治乎。“孟子谓齐宣王”至“玉人琢玉哉”。○正义曰：此章言任贤使能，不遗其学，则功成而不堕。“孟子谓齐宣王曰：为巨室则必使工师求大木，工师得大木，则王喜，以为能胜其任也。匠人斫而小之，则王怒，以为不胜其任矣”者，是孟子谓齐宣王，言为大宫，则王必遣使工匠之吏求其大木，工匠之吏求得其大木则王喜，以为工匠之吏能胜其所任用矣。则至匠人斫削而小之，则王怒，以为匠人不胜其任矣。凡此皆孟子将以比喻而言也，以其欲使宣王易晓其意也。巨室，大宫也。工师，主工匠之吏也。又言“夫人幼而学之，壮而欲行之。王曰：姑舍女所学而从我，则何如”者，是孟子又言夫人既以幼少而学先王之道，及壮大仕而欲施行其幼之所学之道，而王乃曰且舍去汝所学之道而从我教命，则如之何也。“今有璞玉於此，虽万镒必使玉人琢之，至於治国家，则曰姑舍女所学而从我，则何以异於教玉人琢玉哉”者，是孟子又复以此而比喻于宣王也。言今假有素璞之玉於此，虽有万镒之多，然必使治玉之人，琢而治饰之耳。至於治国家，则固当以先王之道治之，而曰且舍去女所学，而令从我教命，则何以有异於教玉人治饰玉哉！言其无以异也。以其治国家当取学先王之道者，乃能治之。今乃至於治国家，则曰且舍汝所学，而从我教命，是何以异於此哉。盖巨室则国家比也，用人犹制木，木则君子之道比也，工师则君子比也，匠人则人君比也。意言治国家必用君子之道，施而後治，人君反小而用之，未有能治国家者也。不特若此，又有以喻焉。璞玉则亦国家比也，玉人则亦君子比也，意谓璞玉，人之所宝也，然不敢自治饰之，必用使治玉人，然後得成美器也。若国家则人君之所宝也，然人君不能自治，必用君子治之，然後安也。今也君子不得施所学之道以治国家，反使从己所教以治之，此亦教玉人琢玉同也，固不足以成美器，所以残害之也，故孟子所以有此譬之。○注“巨室大宫也”至“喻之也”。○正义曰：《字林》云：“巨，大也。”《白虎通》曰：“黄帝始作宫室，”是知巨室则大宫也。《周礼·考工记》云：“审曲面，以饬五材，以辨民器，谓之工。凡攻木之工七，攻金之工六，攻皮之工五，设色之工五，刮摩之工五，砖埴之工二。”轮、舆、弓、庐、匠、车、梓，凡此者，是攻木之工也。馀工不敢烦述。所谓工师者，师，范也。教也，即掌教百工者，如《汉书》云“将作少府秦官掌理宫室者”是也。匠人即斫削之人也，《风俗通》云“凡是於事巫卜陶匠”是也。然则此言匠人者，即攻木之匠也。○注“金二十两为镒”。○正义曰：《国语》云二十四两为镒；《礼》云“朝一镒米”，注亦谓“二十四两”。今注误为二十两。" }
      - { type: j, text: "齐人伐燕，胜之。宣王问曰：“或谓寡人勿取，或谓寡人取之。以万乘之国伐万乘之国，五旬而举之，人力不至於此，不取必有天殃，取之何如？”" }
      - { type: z, text: "万乘，非诸侯之号，时燕国皆侵地广大，僭号称王，故曰万乘。五旬，五十日也。《书》曰：“期三百有六旬。”言五旬未久而取之，非人力，乃天也。天与不取，惧有殃咎，取之何如？" }
      - { type: j, text: "孟子对曰：“取之而燕民悦，则取之。古之人有行之者，武王是也。" }
      - { type: z, text: "武王伐纣而殷民喜悦，匪厥玄黄而来迎之，是以取之也。" }
      - { type: j, text: "取之而燕民不悦，则勿取。古之人有行之者，文王是也。" }
      - { type: z, text: "文王以三仁尚在，乐师未奔，取之惧殷民不悦，故未取之也。" }
      - { type: j, text: "以万乘之国，伐万乘之国，箪食壶浆以迎王师，岂有它哉！避水火也。如水益深，如火益热，亦运而已矣。”" }
      - { type: z, text: "燕人所以持箪食壶浆来迎王师者，欲避水火难耳。如其所患益甚，则亦运行奔走而去矣。今王诚能使燕民免於水火，亦若武王伐纣，殷民喜悦之，则取之而已。“齐人伐燕胜之”至“亦运而已矣”。○正义曰：此章言征伐之道，当顺民心，民心悦则天意得，天意得，然后乃取人之国也。“齐人伐燕，胜之。宣王问曰：或谓寡人勿取，或谓寡人取之”至“何如”者，言齐国之人伐燕之人，必强胜之。齐宣乃问孟子，以谓或有人教我勿取此燕国，或有人又教我取之。今以万乘之国伐万乘之国，但五十日足以兴举之，非人力所能至，此乃天也。天与之而勿取，必有天殃而祸之。今则取之，何如？故以此问孟子。“孟子对曰：“取之而燕民悦，则取之，古之人有行之者，武王是也”者，是孟子答齐宣，以为今伐取之燕国，而燕国之民悦乐，则可以伐取之也。古之人有行征伐之道如此国者，若武王伐纣是也。《书》曰：“肆予东征，绥厥士女，惟其士女，篚厥玄黄，昭我周王。”是其武王伐纣之事耳。孟子所以引此答齐宣，盖欲齐宣征伐顺民心，亦若武王也。“取之而燕民不悦，则勿取，古之人有行之者，文王是也”者，孟子又以此答之齐宣，言今欲取之燕国，苟燕国之民愁怨而不悦，则当勿取之。故古之人有欲行征伐之道若此者，如文王於纣是也。孔子有云“文王三分天下有其二，犹服事殷”，是文王於纣之事耳。孟子所以又引此答齐宣者，复欲齐宣如文王顺民心而未取之耳。“以万乘之国，伐万乘之国，箪食壶浆，以迎王师”至“亦运而已矣”者，孟子言今且托以万乘之国伐取万乘之国，其有以箪食壶浆而来迎王兵师者，岂有它事哉，盖欲避去水火之患难耳，如若水弥深，火弥热，则民亦运行而奔走矣，岂来迎王之兵师哉。意谓今齐诚能使燕民得免水火之难，亦若武王伐纣，殷民皆悦乐之，则可以取燕也。如不然，则若文王之於纣，故未取之耳。云“万乘”者，盖六国之时为诸侯者，皆僭王号，故皆曰万乘。云“箪笥”者，案《曲礼》曰：“圆曰箪，方曰笥，饭器也。”《书》云：“衣裳在笥。”则笥亦盛衣。云“壶浆”者，《礼图》云：“酒壶受一斛，口径尺足高二寸径尺。”又《公羊传》云：“齐侯唁公于野井，国子执壶浆。”何休云：“壶，礼器，腹方口圆曰壶。”《释名》曰：“浆，水也，饮也，或云浆，酒也。”○注“篚厥玄黄”。正义曰：孔安国《传》云：“以筐篚盛其丝帛也。”《礼图》云：篚以竹为之，长三尺，广一尺，深六寸，足高三寸，上有盖也。○注“万乘非诸侯之号”至“如何”。○正义曰：云万乘非诸侯之号，时燕国皆侵地僭号称王者，说在上卷首章“《书》曰期三百有六旬”者，案孔安国《传》云：匝四时曰期，一岁十二月，月三十日，正三百六十日，除小月六日为六日，是为一岁有馀十二日，未盈三岁，足得一月，则置闰焉。是其解也。○注“武王伐纣”至“取之也”。○正义曰：《书》云：“惟十一年，武王伐纣。”《史记》云：武王伐纣，发兵七十万人距纣师。纣师倒兵以战以斗武王，武王驰之，纣兵崩叛。纣走反入鹿台，蒙衣其珠玉，自燔于火而死。武王以黄钺斩纣，悬其头於大白之旗。”是也。○注“文王以三仁尚在，乐师未奔”者。○正义曰：《语》云殷有三仁焉，盖微子、箕子、比干是也。《吕氏春秋·仲冬纪》云：“纣之母生微子启与仲衍，其时犹尚为妾，改而为妻，後生纣，纣之父欲立微子启为太子。太史曰：妻之有子，不可立妾之子。故立纣为後。”微子名启，《世家》曰开，孔安国曰：微，圻内国名。子，爵，为纣卿士。箕子者，《庄子》云：“箕子名胥。”郑玄云：“箕亦在圻内。”比干者，《家语》曰：比干是纣之亲则诸父。知比干乃纣之诸父也。《宋世家》云：“箕子乃纣之亲戚也。”言为亲戚，又莫知其为父为兄也。郑玄、王肃皆以箕子为纣之诸父，杜预以为纣之庶兄，皆以意言之耳。赵云：三仁尚在者，盖文王为西伯之时，三仁尚未之亡去。及西伯卒，武王东伐，至盟津，诸侯会者八百，皆曰纣可伐，武王犹曰：尔未知天命。纣愈淫乱不止，微子谏不听，乃与大师谋遂去。比干曰：为人臣者不得不以死谏，乃强谏纣。纣怒曰：吾闻圣人心有七窍。刳比干，观其心。箕子惧，乃佯狂为奴，纣又囚之，後因武王乃释之耳。" }
      - { type: j, text: "齐人伐燕，取之。诸侯将谋救燕，宣王曰：“诸侯多谋伐寡人者，何以待之？”" }
      - { type: z, text: "宣王贪燕而取之。诸侯不义其事，将谋救燕伐齐，宣王惧而问之。" }
      - { type: j, text: "孟子对曰：“臣闻七十里为政於天下者汤是也。未闻以千里畏人者也。" }
      - { type: z, text: "成汤修德，以七十里而得天下。今齐地方千里，何畏惧哉。" }
      - { type: j, text: "《书》曰：‘汤一征，自葛始。’天下信之，东面而征西夷怨，南面而征北狄怨，曰‘奚为後我’？民望之，若大旱之望云霓也。归市者不止，耕者不变，诛其君而吊其民，若时雨降，民大悦。《书》曰：‘我后，后来其苏。’" }
      - { type: z, text: "此二篇皆《尚书》逸篇之文也，言汤初征自葛始，诛其君，恤其民，天下信汤之德。面者，向也。东向征，西夷怨王。去王城四千里，夷服之国也，故谓之四夷。言远国思望圣化之甚也，故曰何为後我。霓，虹也。雨则虹见，故大旱而思见之。，待也。后，君也。待我君来，则我苏息而已。" }
      - { type: j, text: "今燕虐其民，王往而征之，民以为将拯已於水火之中也。箪食壶浆，以迎王师。若杀其父兄，系累其子弟，毁其宗庙，迁其重器，如之何其可也？" }
      - { type: z, text: "拯，济也。系累犹缚结也。燕民所以悦喜迎王师者，谓济救於水火之中耳，今又残之若此，安可哉。" }
      - { type: j, text: "天下固畏齐之强也，今又倍地而不行仁政，是动天下之兵也。" }
      - { type: z, text: "言天下诸侯素畏齐强，今复并燕一倍之地，以是行暴，则多所危，是动天下之兵共谋齐也。" }
      - { type: j, text: "王速出令，反其旄倪，止其重器，谋於燕众，置君而後去之，则犹可及止也。”" }
      - { type: z, text: "速，疾也。旄，老耄也。倪，弱小倪倪者也。孟子劝王急出令，先还其老小，止勿徙其宝重之器，与燕民谋置所欲立君而去之归齐，天下之兵，犹可及其未发而止之也。“齐人伐燕取之”至“犹可及士也”。○正义曰：此章言伐恶养善，无贪其富，以小王大，夫将何惧也。“齐人伐燕，取之，诸侯将谋救燕”者，齐国伐其燕国，而取其地，天下诸侯皆将谋度救燕国也。“宣王曰：诸侯多谋伐寡人者，何以待之”者，是齐宣见诸侯将谋度救燕国，而共伐我，乃曰天下多有谋度与燕共伐我者，则我当如之何以待它，故以此问孟子。“孟子对曰：臣闻七十里为政於天下者，汤是也。未闻以千里畏人也”者，孟子答齐宣，以为臣尝闻有地但方阔七十里，而能为王政於天下者，如商汤王是也。未尝闻有地方阔千里，而犹畏人者也。盖汤为夏方伯之时，但有七十里而後为天下商王。今天下方千里者有九，而得其一，是齐之有千里地也。所以云然。“《书》曰：汤一征，自葛始，天下信之，东面而征，西夷怨”至“民大悦”者，此皆《尚书》遗亡篇文也。今据《商书·仲虺之诰》篇，则云“乃葛伯仇饷，初征自葛，东征西夷怨，南征北狄怨，曰：奚为後予”。大抵孟子引此者，盖恐齐王为己之臆说，以引此而证之，欲使齐宣信之也。故言《书》云汤一征，自葛国为始，天下皆信汤王之德。後汤东向而征伐，则西夷之人思望，而怨不先自此而正君之罪；南乡而征伐，则北狄之人又皆思望，而怨以为不先自此而正君之罪，乃曰何为後去其我，而先向他国而征之，故其民望汤之来，皆若於大旱而望云霓如霓。不特此也，又使归市者皆不止，以其皆得货易有无也。耕于郊野者又不变易其事，以言其常得耕作也。虽诛亡其君，又吊问而存恤其民，其如时之旱而雨降，民皆悦乐之也。“《书》曰我后，后来其苏”者，注云：自上文与此，皆逸篇之文也。今据《仲虺之篇》有云，大抵孟子引此而言者，又欲齐王知民如此之慕汤而则法汤也，盖谓民皆喜曰：待我君来而苏息我也。“今燕虐其民，王往而征之，民以为将拯已於水火之中也”至“如之何其可也”者，是孟子又言今燕国之暴虐其民，而王以兵往征伐之，民皆以为王兵之来，将拯救己於水火之中如也。故以箪食壶浆，迎其王师之来。今乃若以杀其民之父兄，系缚其民之子弟，又毁坏其国中之宗庙，使民不得其祀，复迁徙其国中之宝器，如之何可也。“天下固畏齐之强也，今又倍地而不行王”至“可及止也”者，孟子又言天下之诸侯，素畏齐国之强也，今王又并燕国一倍之地，而且复不行其王政，是所以兴动天下诸侯之兵而共伐之也。王今即速疾出其命令，还其老耄幼小，勿迁移其宝器，复谋度於燕国之众，为置立其君而後去之而归齐，则天下诸侯之兵，尚可得及止之也。○注云“去王城四千里夷服之国”至“苏息”。○正义曰：《周礼·九服》，又案《礼图》云“自王畿千里至夷服，凡四千里”是也。云霓，虹也，《尔雅》云：“云出天之正气，霓出地之正气，雄谓之虹，雌谓之霓。”则云，阳物也，阴阳和而既雨，则云散而霓见矣。○注“旄，老耄，倪，弱小倪倪”者。○正义曰：释云“耄<齿>”，案《尔雅》云：“黄发、倪齿，寿也。然则赵注云“倪，弱小”，非止幼童之弱小，亦老之有弱小尔。" }
      - { type: j, text: "邹与鲁，穆公问曰：“吾有司死者三十三人，而民莫之死也。诛之则不可胜诛，不诛则疾视其长上之死而不救，如之何则可也。”" }
      - { type: z, text: "，斗声也，犹构兵而斗也。长上，军帅也。邹穆公忿其民不赴难而问其罚当谓何则可也。" }
      - { type: j, text: "孟子对曰：“凶年饥岁，君之民，老弱转乎沟壑，壮者散而之四方者，几千人矣，而君之仓廪实，府库充，有司莫以告，是上慢而残下也。" }
      - { type: z, text: "言往者遭凶年之厄，民困如是。有司诸臣无告白於君有以账救之，是上骄慢以残贼其下也。" }
      - { type: j, text: "曾子曰：‘戒之戒之，出乎尔者，反乎尔者也。’" }
      - { type: z, text: "曾子有言，上所出善恶之命，下终反之，不可不戒也。" }
      - { type: j, text: "夫民今而後得反之也，君无尤焉。" }
      - { type: z, text: "尤，过也。孟子言百姓乃今得反报诸臣不哀矜耳，君无过责之也。" }
      - { type: j, text: "君行仁政，斯民亲其上，死其长矣。”" }
      - { type: z, text: "君行仁恩，忧民困穷，则民化而亲其上，死其长矣。“邹与鲁”至“死其长矣”。○正义曰：此章指言上恤其下，下赴其难，恶出乎己，害及其身，如影响自然也。“邹与鲁”者，言邹国与鲁国相斗也。“穆公问曰：吾有司死者三十三人，而民莫之死也，诛之则不可胜诛，不诛则疾视其长上之死而不救，如之何则可也”者，是邹穆公问孟子，言我国与鲁国相斗战，而有司死者有三十三人，而民皆莫之死。我今欲诛亡其民，不可胜诛。不可胜诛者，是民众之多，难以诛亡也。不诛其民，则我恶疾视其长上有司之死而不救之，故问孟子当何则可以诛亡也。“孟子对曰：凶年饥岁，君之民老羸转乎沟壑”至“是上慢而残下也”者，孟子答穆公，以为凶荒之年，而民皆饥饿，君之民人老羸者转落死於沟壑之中，强壮者又离散之於四方者，几近千人矣，而君之仓廪盈实，府库充塞，为君之有司者，皆莫以告白其上发仓廪以济其食之不给，开府库以佐其用之不足，如此则有司在民之上，而以骄慢残害其下也。“曾子曰：戒之戒之，出乎尔者，反乎尔者”，孟子言曾子有云在戒慎之，戒慎之，以其凡有善恶之命，苟善之出乎尔，则终亦以善反归乎尔也；苟出乎尔以恶，则其终反归尔亦以恶也。“夫民今而後得反之也，君无尤焉”者，孟子言夫民今所以不救长上之死者，以其在凶荒饥馑之岁，君之有司不以告白其君发仓廪，开府库，以救赈之，所以於今视其死而不救，以报之也。然非君之过也，是有司自取之尔，故曰君无尤焉。“君行仁政，斯民亲其上，死其长矣”者，孟子言君能行仁为政，则在下之民皆亲其上，乐其君，而轻其死以为其长上矣。○注“斗声”。释云：“，斗也，故曰犹构兵而斗也。" }
      - { type: j, text: "滕文公问曰：“滕，小国也，间於齐楚，事齐乎？事楚乎？”" }
      - { type: z, text: "文公言我居齐楚二国之间，非其所事，不能自保也。" }
      - { type: j, text: "孟子对曰：“是谋非吾所能及也。无已，则有一焉，凿斯池也，筑斯城也，与民守之，死而民弗去，则是可为也。”" }
      - { type: z, text: "孟子以二大国之君皆不由礼义，我不能知谁可事者也。不得已则有一谋焉，惟施德义以养民，与之坚守城池至死，使民不畔去，则是可以为也。“滕文公”至“可为也”。○正义曰：此章指言事无礼之国，不若得民心，与之守死善道也。“滕文公问曰：滕，小国也，间於齐楚，事齐乎，事楚乎”者，是滕文公问孟子，言我之滕国则小国也，今间厕在齐楚二国之间，而我今当奉事齐国乎，楚国乎？故以此问孟子。“孟子对曰：是谋非吾所能及也。无已，则有一焉，凿斯池”至“是可为也”者，是孟子答文公，以谓若此之谋，而指谁国可事，非我所能及知也。以其齐楚二国，皆是无礼义之国，孟子所以答曰是谋非吾所能及也。言不得已，则有一谋计焉，言但凿此滕国之池，筑此滕国之城，与人民坚守此滕国至死，使民不畔去，则是一谋可以为也，其它非吾所及。" }
      - { type: j, text: "滕文公问曰：“齐人将筑薛，吾甚恐。如之何则可？”" }
      - { type: z, text: "齐人并得薛，筑其城以逼於滕，故文公恐也。" }
      - { type: j, text: "孟子对曰：“昔者大王居，狄人侵之，去之岐山之下居焉，非择而取之，不得已也。" }
      - { type: z, text: "大王非好岐山之下，择而居之焉，迫不得已，困於强暴，故避之。" }
      - { type: j, text: "苟为善，後世子孙必有王者矣。" }
      - { type: z, text: "诚能为善，虽失其地，後世乃有王者，若周家也。" }
      - { type: j, text: "君子创业垂统，为可继也，若夫成功，则天也。君如彼何哉，强为善而已矣。”" }
      - { type: z, text: "君子创业垂统，贵令後世可继续而行耳，又何能必有成功，成功乃天助之也。君岂如彼齐何乎，但当自强为善法，以遗後世而已矣。“滕文公”至“强为善而已矣”。正义曰：此章指言君子之道正己任天，强暴之来，非已所招，谓穷则独善其身也。“滕文公问曰：齐人将筑薛，吾甚恐，如之何则可”者，言齐人并得薛地，将欲筑其城於此，故滕文公恐其逼，乃问孟子，当如何则可免为不见迫。“孟子对曰：昔者太王居，狄人侵之，去之岐山之下居焉，非择而取之，不得已也”者，孟子答滕文公，以谓往者太王居国，後为戎狄之国所侵伐，遂去之岐山下为居焉，当此之时，非太王择此岐山之下为居焉，不得已而避狄所侵患，故之岐山下为居耳。“苟为善，後世子孙必有王者矣”者，孟子言滕文公诚能为善修德而布政於民，今虽失其薛地，至後世子孙必有王者兴作矣。“君子创业垂统，为可继也。若夫成功，则天也。君如彼何哉，强为善而已矣”者，孟子又言君子在上，基创其业，垂统法於後世，盖令後世可以继续而承之耳。若夫其有成功，乃天助之也，於人又不可必其成功。君今岂奈彼齐之大国何？但勉强自为善以遗法於後世也。" }
      - { type: j, text: "滕文公问曰：“滕，小国也，竭力以事大国，则不得免焉，如之何则可？”" }
      - { type: z, text: "问免难全国於孟子。" }
      - { type: j, text: "孟子对曰：“昔者大王居，狄人侵之。事之以皮币，不得免焉；事之以犬马，不得免焉；事之以珠玉，不得免焉。" }
      - { type: z, text: "皮，狐貉之裘。币，缯帛之货也。" }
      - { type: j, text: "乃属其耆老而告之曰：‘狄人之所欲者，吾土地也。吾闻之也。君子不以其所以养人者害人，二三子何患乎无君，我将去之。’去，逾梁山，邑于岐山之下居焉。" }
      - { type: z, text: "属，会也。土地生五，所以养人也。会长老告之如此，而去之矣。" }
      - { type: j, text: "人曰：‘仁人也，不可失也。’从之者如归市。" }
      - { type: z, text: "言乐随大王，如归趋於市，若将有得也。" }
      - { type: j, text: "或曰：‘世守也，非身之所能为也。’效死勿去。君请择於斯二者，”" }
      - { type: z, text: "或曰：土地乃先人之所受也，世世守之，非已身所能专为，至死不可去也。欲令文公择此二者，惟所行也。“滕文公问曰”至“择於斯二者”。○正义曰：此章言大王去，权也，效死守业，义也。义权不并，故曰择而处之也。“滕文公问曰：滕，小国也，竭力以事大国，则不得免焉。如之何则可”者，是滕文公问孟子，言我之滕国，小国也，今竭尽其力以奉事大国，则不得免其侵伐。当如何则可以免焉？“孟子对曰：昔者大王居，狄人侵之”至“事之以珠玉，不得免焉”者，孟子答文公，以谓往大王所居国，後为戎狄所侵伐。是时也，大王事之以皮币，且尚不免其侵伐，又事之以犬马，又不得免其侵伐，复事以珠玉，又且犹不免其侵伐焉。“乃属耆老而告之曰”至“邑于岐山居焉，人曰：仁人也，不可失也，从之者如归市”者，孟子言大王以皮币、犬马、珠玉奉事戎狄，犹不免其侵伐，乃会耆老而告之，曰：狄人所欲者在我之土地也，我闻君子不以所养人之土地而残贼其民，汝二三子何忧患乎无君，我将去之，以让狄也。遂去国，逾梁山，而邑于岐山下居焉。国之人，遂闻大王此言，乃曰：仁人之君，不可失去也。故从之者如归趋於市，若将有所得耳。“或曰：世守也，非身之所能为也，效死勿去”者，孟子又言：或人有云土地者，乃先人之所受也，非己身所能为专也，乃世世守之也，当效死而不可去也。故请文公择斯二者而处之。二者，其一如太王去，其二如或云效死勿去是也。○注“皮，狐貉之裘。币，缯帛之货”。○正义曰：盖狐貉之皮为裘也。释云：狐貉，妖兽也，後人以其狐貉性多疑，故以皮为之裘也。孔子曰“黄衣狐裘”，又曰“狐貉之厚以居”是也。《周礼·行人职》云：“合六币：圭以马，璋以皮，壁以帛，琮以锦，琥以绣，璜以黼。此六物以和诸侯之好。”郑注云：“合，同也。六币所以享也。”是币即缯帛之货也。云“属，会也”，《释文》云：“会也，又曰付也。”" }
      - { type: j, text: "鲁平公将出，嬖人臧仓者请曰：“他日君出，则必命有司所之。今乘舆已驾矣，有司未知所之，敢请！”" }
      - { type: z, text: "平，谥也。嬖人，爱幸小人也。" }
      - { type: j, text: "公曰：“将见孟子。”" }
      - { type: z, text: "平公敬孟子有德，不敢请召，将往就见之。" }
      - { type: j, text: "曰：“何哉！君所为轻身以先於匹夫者，以为贤乎？礼义由贤者出，而孟子之後丧逾前丧，君无见焉。”" }
      - { type: z, text: "匹夫，一夫也。臧仓言君何为轻千乘而先匹夫乎？以为孟子贤故也，贤者当行礼义，而孟子前丧父约，後丧母奢，君无见也。" }
      - { type: j, text: "公曰：“诺。”" }
      - { type: z, text: "诺，止不出" }
      - { type: j, text: "乐正子入见，曰：“君奚为不见孟轲也？”" }
      - { type: z, text: "乐正，姓也。子，通称，孟子弟子也，为鲁臣，问公何为不便见孟轲也。" }
      - { type: j, text: "曰：“或告寡人曰：‘孟子之後丧逾前丧。’是以不往见也。”" }
      - { type: z, text: "公言以此故也。" }
      - { type: j, text: "曰：“何哉？君所谓逾者，前以士，後以大夫。前以三鼎，而後以五鼎与？”" }
      - { type: z, text: "乐正子曰：君所谓逾者，前以士礼，後以大夫礼。士祭三鼎，大夫祭五鼎故也。" }
      - { type: j, text: "曰：“否。谓棺椁衣衾之美也。”" }
      - { type: z, text: "公曰：不谓鼎数也，以其棺椁衣衾之美恶也。" }
      - { type: j, text: "曰：“非所谓逾也，贫富不同也。”" }
      - { type: z, text: "乐正子曰：此非薄父厚母，令母丧逾父也。丧父时为士，丧母时为大夫。大夫禄重於士，故使然，贫富不同也。" }
      - { type: j, text: "乐正子见孟子，曰：“克告於君，君为来见也。嬖人有臧仓者沮君，君是以不果来也。”" }
      - { type: z, text: "克，乐正子名也。果，能也。曰：克告君以孟子之贤，君将欲来，臧仓者沮君，故君不能来也。" }
      - { type: j, text: "曰：“行或使之，止或尼之，行止非人所能也。吾之不遇鲁侯，天也。臧氏之子，焉能使我不遇哉。" }
      - { type: z, text: "尼，止也。孟子之意，以为鲁侯欲行，天使之矣，及其欲止，天令嬖人止之耳。行止天意，非人所能为也。如使吾见鲁侯，冀得行道，天欲使济斯民也，故曰吾之不遭遇鲁侯，乃天所为也。臧氏小子，何能使我不遇哉。“鲁平公将出”至“焉能使予不遇哉”。○正义曰：此章指言谗邪构贤，贤者归天，不尤人也。“鲁平公将出，嬖人臧仓者请曰：他日君出，则必命有司所之，今乘舆已驾矣，有司未知所之，敢请”者，鲁平公，鲁国之君也，谥曰平。嬖人，平公爱幸之人也。臧，嬖人姓也；仓，名也。言鲁平公将欲出见孟子，有司皆未知，惟臧仓为平公爱幸之人，乃请问之，曰：所往，他日君之所出，则必挥命有司同所往，今君乘车已驾行矣，有司之人皆未知君之所往，敢请问之，君何所往？驾，行也。之，往也。“公曰：将见孟子”者，鲁平公答臧仓，言将欲出见孟子也。“曰：何哉，君所为轻身以先於匹夫者，以为贤乎？礼义由贤者出，而孟子之後丧逾前丧，君无见焉”者，臧仓者言：君今欲见孟子，以其为何往哉？君今所为自轻薄其身，以先往见於一匹之贱夫，以谓之为贤乎？臧仓言此，谓孟子则一匹之贱夫，不足谓之为贤也，故曰礼义之道，皆由贤者所出，而孟子乃以後丧其母之丧事，奢过於前丧其父之丧事，请君无更往而见焉。仓谓孟子母丧用事丰备，父丧用事俭约。父母皆己之所亲也，其丧用事有厚薄者，此孟子所以不知礼义也。故云礼义由贤者出，而孟子之後丧逾前丧，君无见焉。“公曰诺”者，平公许允，止而不出也。“乐正子入见，曰：君奚为不见孟轲也”者，是日，乐正子见平公乘舆既行而止之，遂入见平公，而问之曰：君何为不往见於孟子也。乐正子为平公之臣，亦是孟子之弟子也。姓乐正，名克。称子者，盖男子之通称也。“曰：或告寡人曰：孟子之後丧逾前丧，是以不往见也”者，平公答乐正子，以谓或有臧仓者告我曰：孟子後有母丧用事丰备过於前父之丧用事，我是以见其如此，遂止其驾而不往见也。“曰何哉！君所谓逾者，前以士，後以大夫。前以三鼎，而後以五鼎与”者，乐正子见平公为此而不往见孟子，乃曰君不往见，是为其何哉？君今所谓孟子以後丧过前丧者，盖孟子前丧父之时，孟子正为之士，故以士礼用之；後丧母之时，孟子以为之大夫，故得以大夫礼用之。为其前为士，即得以三鼎之礼祭之；其後为大夫，遂得以五鼎之礼祭之故也。“曰否，谓棺椁衣衾之美也”者，平公以谓否，不为鼎数之有不同也，是为棺椁衣衾被服之美好有前後之不同也。“曰非所谓逾也，贫富不同也”者，乐正子谓非所谓孟子有过於前也，为其前後贫富之不同也，非薄其父厚其母也。“乐正子见孟子曰：克告於君，君为来见也。嬖人有臧仓者沮君，君是以不果来也”者，盖平公先欲见孟子者，以其乐正子告之也。故乐正自入见平公，所问君之不往意已毕，乃出而见於孟子，遂曰克前告其君，尝言孟子。君是以欲往来见之，平公爱幸之人有一姓臧名仓者，沮止其君，所以不能来也。“曰行或使之，止或尼之，行止非人所能也。吾之不遇鲁侯，天也，臧氏之子焉能使予不遇哉”者，孟子见乐正子告之以此意，遂曰：君所欲行，天使之行也；君所欲止，天使之止也。臧氏之子，安能使我不遇鲁侯哉。○注“平，谥也。嬖人，爱幸小人也”。○正义曰：《谥法》云：“法治而清省曰平。”《春秋左传》：“鲁隐公有云嬖人之子。”杜预曰：“嬖，亲幸也。”释云：贱而得幸曰嬖。○注“乐正，姓也，为鲁臣，孟子弟子也”。○正义曰：自微子之後，宋戴公四世孙乐莒为大司寇，又《左传》宋上卿正考甫之後。是乐、正皆姓也。赵注乐正者为姓，案《礼记》有乐正子春，是乐正之姓，有自矣。云“孟子弟子”者，盖尝受教於孟子者，无非弟子也；为鲁臣者，盖非鲁平公之臣，何以克告於君？是以知为鲁臣明矣。赵注详其意，故云为鲁臣，如於他经书则未详。○注“士祭三鼎，大夫祭五鼎”。○正义曰：如子路有列鼎之奉，主父在汉有五鼎之食，是其爵有差也。盖士则爵卑而贱，大夫则爵尊而贵，孟子前以士，後以大夫，是其爵命贵贱之不同耳。○经云衣衾者，盖衾，今之被也。案《丧大记》：“小敛，君锦衾，大夫缟，士缁。凡衾皆五幅。”郑注云：“衾，单被也。”" }
