# 論語注疏卷5（邢昺疏）：j 為經文＋魏何晏集解，z 為疏文。
sections:
  - id: juan5
    name: 正文
    blocks:
      - { type: z, text: "正义曰：此篇大指明贤人君子仁知刚直，以前篇择仁者之里而居，故得" }
      - { type: j, text: "学为君子，即下云“鲁无君子，斯焉取斯”是也，故次《里仁》。" }
      - { type: j, text: "子谓公冶长：“可妻也，虽在纟累纟曳之中，非其罪也。”以其子妻之。" }
      - { type: j, text: "（孔曰：“公冶长，弟子，鲁人也。姓公冶，名长。纟累，黑索；纟曳，挛也，" }
      - { type: j, text: "所以拘罪人。”）" }
      - { type: z, text: "“子谓”至“妻之”。○正义曰：此章明弟子公冶长之贤也。“子谓公" }
      - { type: j, text: "冶长可妻也”者，纳女於人曰妻。孔子评论弟子公冶长德行纯备，可纳女与之为" }
      - { type: j, text: "妻也。“虽在纟累纟曳之中，非其罪也”者，纟累，黑索；纟曳，挛也。古狱以" }
      - { type: j, text: "黑索拘挛罪人。於时冶长以枉滥被系，故孔子论之曰：“虽在纟累纟曳之中，实" }
      - { type: j, text: "非其冶长之罪也。”“以其子妻之”者，论竟，遂以其女子妻之也。○注“孔曰”" }
      - { type: j, text: "至“罪人”。○正义曰：云“冶长，弟子，鲁人也”者，案《家语·弟子篇》云：" }
      - { type: j, text: "“公冶长，鲁人，字子长。为人能忍耻，孔子以女妻之。”又案《史记·弟子传》" }
      - { type: j, text: "云：“公冶长，齐人。”而此云鲁人，用《家语》为说也。张华云：“公冶长墓" }
      - { type: j, text: "在阳城姑幕城东南五里所，基极高。旧说冶长解禽语，故系之纟累纟曳。”以其" }
      - { type: j, text: "不经，今不取也。" }
      - { type: j, text: "子谓南容：“邦有道，不废；邦无道，免於刑戮。”以其兄之子妻之。（王" }
      - { type: j, text: "曰：“南容，弟子南宫纟舀，鲁人也，字子容。不废，言见用。”）" }
      - { type: z, text: "“子谓南容”至“妻之”。○正义曰：此章孔子评论弟子南容之贤行也。" }
      - { type: j, text: "“邦有道，不废；邦无道，免於刑戮”者，此南容之德也。若遇邦国有道，则常" }
      - { type: j, text: "得见用在官，不被废弃。若遇邦国无道，则必危行言逊，以脱免於刑罚戮辱也。" }
      - { type: j, text: "“以其兄之子妻之”者，言德行如此，故以其兄之女与之为妻也。○注“王曰”" }
      - { type: j, text: "至“见用”。○正义曰：云“南容，弟子南宫纟舀，鲁人也，字子容”者，此" }
      - { type: j, text: "《家语·弟子篇》文也。案《史记·弟子传》云：“南宫括字子容。”郑注《檀" }
      - { type: j, text: "弓》云：“南宫纟舀，孟僖子之子南宫阅。”以昭七年《左氏传》云孟僖子将卒，" }
      - { type: j, text: "召其大夫云，“属说与何忌於夫子”，以事仲尼，以南宫为氏，故《世本》云“" }
      - { type: j, text: "中孙ㄑ生南宫纟舀”是也。然则名纟舀，名括，又名阅，字子容，氏南宫，本孟" }
      - { type: j, text: "氏之後也。" }
      - { type: j, text: "子谓子贱，（孔曰：“子贱，鲁人，弟子宓不齐。”）君子哉若人！鲁无君" }
      - { type: j, text: "子者，斯焉取斯？”（包曰：“若人者，若此人也。如鲁无君子，子贱安得此行" }
      - { type: j, text: "而学行之？”）" }
      - { type: z, text: "“子谓子贱”至“取斯”。○正义曰：此章论子贱之德也。“君子哉若" }
      - { type: j, text: "人！鲁无君子者，斯焉取斯”者，此评论之辞也。因美鲁多君子，故曰：“有君" }
      - { type: j, text: "子之德哉，若此人也！鲁国若更无君子者，斯子贱安得取斯君子之德行而学行之" }
      - { type: j, text: "乎？”明鲁多君子，故子贱得学为君子也。○注“孔曰”至“不齐”。○正义曰：" }
      - { type: j, text: "案《家语·弟子篇》云：“宓不齐，鲁人，字子贱，少孔子四十九岁。为单父宰，" }
      - { type: j, text: "有才知，仁爱百姓，不忍欺之，故孔子大之也。”" }
      - { type: j, text: "子贡问曰：“赐也何如？”子曰：“女，器也。”（孔曰：“言女器用之人。”）" }
      - { type: j, text: "曰：“何器也？”曰：“瑚琏也。”（包曰：“瑚琏，黍稷之器。夏曰瑚，殷曰" }
      - { type: j, text: "琏，周曰簋，宗庙之器贵者。”）" }
      - { type: z, text: "“子贡”至“瑚琏也”。○正义曰：此章明弟子子贡之德也。“子贡曰：" }
      - { type: j, text: "赐也何如”者，子贡见夫子历说诸弟子，不及於己，故问之曰：“赐也，已自不" }
      - { type: j, text: "知其行何如也。”“子曰：女器也”，夫子答之，言女器用之人也。“曰：何器" }
      - { type: j, text: "也”者，子贡虽得夫子言己为器用之人，但器有善恶，犹未知己器云何，故复问" }
      - { type: j, text: "之也。”曰：瑚琏也”者，此夫子又为指其定分。瑚琏，黍稷之器，宗庙之器贵" }
      - { type: j, text: "者也。言女是贵器也。。○注“包曰”至“贵者”。○正义曰：云“瑚琏，黍稷" }
      - { type: j, text: "之器。夏曰瑚，殷曰琏，周曰簋”者，案《明堂位》说四代之器云：“有虞氏" }
      - { type: j, text: "之两敦，夏后氏之四琏，殷之六瑚，周之八簋。”注云：“皆黍稷器。制之异同" }
      - { type: j, text: "未闻。”郑注《周礼·舍人》云：“方曰，圆曰簋。”如《记》文，则夏器名" }
      - { type: j, text: "琏，殷器名瑚。而包咸、郑玄等注此《论语》，贾、服、杜等注《左传》，皆云" }
      - { type: j, text: "夏曰瑚。或别有所据，或相从而误也。" }
      - { type: j, text: "或曰：“雍也仁而不佞。”（马曰：“雍，弟子。仲弓，名。姓冉。”）子" }
      - { type: j, text: "曰：“焉用佞？御人以口给，屡憎於人。不知其仁，焉用佞？”（孔曰：“屡，" }
      - { type: j, text: "数也。佞人口辞捷给，数为人所憎恶。”）" }
      - { type: z, text: "“或曰”至“用佞”。○正义曰：此章明仁不须佞也。“或曰：雍也仁" }
      - { type: j, text: "而不佞”者，佞，口才也。或有一人言於夫子曰：“弟子冉雍，虽身有仁德，而" }
      - { type: j, text: "口无才辩。”或人嫌其德未备也。“子曰：焉用佞”者，夫子语或人言，仁人安" }
      - { type: j, text: "用其佞也。“御人以口给，屡憎於人”者，夫子更为或人说佞人之短。屡，数也。" }
      - { type: j, text: "言佞人御当於人以口才捷给，屡致憎恶於人，谓数为人所憎恶也。“不知其仁，" }
      - { type: j, text: "焉用佞”者，言佞人既数为人所憎恶，则不知其有仁德之人，复安用其佞邪？○" }
      - { type: j, text: "注“马曰：雍，弟子。仲弓，名。姓冉”。○正义曰：案《史记·弟子传》：" }
      - { type: j, text: "“冉雍字仲弓。”郑玄曰：“鲁人也。”○注“孔曰”至“憎恶”。○正义曰：" }
      - { type: j, text: "“屡，数也”者，《释言》云：“屡，亟也。”郭璞云：“亟亦数也。”云“佞" }
      - { type: j, text: "人口辞捷给，数谓人所憎恶”者，案《左传》云：“寡人不佞。”服虔云：“佞，" }
      - { type: j, text: "才也。不才者，自谦之辞也。”而此云“焉用佞？御人以口给，屡憎於人”，则" }
      - { type: j, text: "佞非善事。而以不佞为谦者，佞是口才捷利之名，本非善恶之称，但为佞有善恶" }
      - { type: j, text: "耳。为善捷敏是善佞，祝它是也。为恶捷敏是恶佞，即“远佞人”是也。但君" }
      - { type: j, text: "子欲讷於言而敏於行，言之虽多，情或不信，故云焉用佞耳。" }
      - { type: j, text: "子使漆开仕。对曰：“吾斯之未能信。”（孔曰：“开，弟子。漆姓，" }
      - { type: j, text: "开名。仕进之道未能信者，未能究习。”）子说。（郑曰：“善其志道深。”）" }
      - { type: z, text: "“子使”至“子说”。○正义曰：此章明弟子漆开之行。“子使漆" }
      - { type: j, text: "开仕”者，弟子姓漆，名开，孔子使之仕进也。“对曰：吾斯之未能信”者，" }
      - { type: j, text: "开意志於学道，不欲仕进，故对曰：吾於斯仕进之道未能信。言未能究习也。" }
      - { type: j, text: "“子说”者，孔子见其不汲汲於荣禄，知其志道深，故喜说也。○注“孔曰”至" }
      - { type: j, text: "“究习”。○正义曰：案《史记·弟子传》：“漆开字子开。”郑玄曰：“鲁" }
      - { type: j, text: "人也。”" }
      - { type: j, text: "子曰：“道不行，乘桴浮于海。从我者，其由与？”（马曰：“桴，编竹木" }
      - { type: j, text: "大者曰筏，小者曰桴。”）子路闻之喜。（孔曰：“喜与已俱行。”）子曰：" }
      - { type: j, text: "“由也好勇过我，无所取材。”（郑曰：“子路信夫子欲行，故言好勇过我。" }
      - { type: j, text: "‘无所取材’者，无所取於桴材。以子路不解微言，故戏之耳。”一曰：“子路" }
      - { type: j, text: "闻孔子欲浮海便喜，不复顾望，故孔子叹其勇曰过我。‘无所取哉’，言唯取於" }
      - { type: j, text: "己。古字材、哉同。”）" }
      - { type: z, text: "“子曰”至“取材”。○正义曰：此章仲尼患中国不能行已之道也。" }
      - { type: j, text: "“道不行，乘桴浮于海”者，桴，竹木所编小筏也。言我之善道中国既不能行，" }
      - { type: j, text: "即欲乘其桴筏浮渡于海而居九夷，庶几能行已道也。“从我者，其由与”者，由，" }
      - { type: j, text: "子路名。以子路果敢有勇，故孔子欲令从己。意未决定，故云“与”以疑之。" }
      - { type: j, text: "“子路闻之喜”者，喜夫子欲与己俱行也。“子曰：由也好勇过我，无所取材”" }
      - { type: j, text: "者，孔子以子路不解微言，故以此戏之耳。其说有二：郑以为，材，桴材也。子" }
      - { type: j, text: "路信夫子欲行，故言好勇过我。“无所取材”者，无所取於桴材也。示子路令知" }
      - { type: j, text: "己但叹世无道耳，非实即欲浮海也。一曰材读曰哉，子路闻孔子欲浮海便喜，不" }
      - { type: j, text: "复顾望孔子之微意，故孔子叹其勇曰过我。“无所取哉”者，言唯取於已，无所" }
      - { type: j, text: "取於他人哉。○注“马曰”至“曰桴”。○正义曰：云“桴，编竹木大者曰筏，" }
      - { type: j, text: "小者曰桴”者，《尔雅》云：“舫，氵付也。”郭璞云：“水中[B18C]筏。”孙炎云：" }
      - { type: j, text: "“舫，水中为氵付筏也。”《方言》云：“氵付谓之[B18C]，[B18C]谓之筏。筏，秦、" }
      - { type: j, text: "晋之通语也。”方、舫、氵付、桴，音义同也。" }
      - { type: j, text: "孟武伯问：“子路仁乎？”子曰：“不知也。”（孔曰：“仁道至大，不可" }
      - { type: j, text: "全名也。”）又问。子曰：“由也，千乘之国，可使治其赋也，（孔曰：“赋，" }
      - { type: j, text: "兵赋。”）不知其仁也。”“求也何如？”子曰：“求也，千室之邑，百乘之家，" }
      - { type: j, text: "可使为之宰也，（孔曰：“千室之邑，卿大夫之邑。卿大夫称家。诸侯千乘。大" }
      - { type: j, text: "夫百乘。宰，家臣。”）不知其仁也。”“赤也何如？”子曰：“赤也，束带立" }
      - { type: j, text: "於朝，可使与宾客言也，（马曰：“赤，弟子公西华。有容仪，可使为行人。”）" }
      - { type: j, text: "不知其仁也。" }
      - { type: z, text: "“孟武”至“仁也”。○正义曰：此章明仁之难也。“孟武伯问：子路" }
      - { type: j, text: "仁乎？子曰：不知也”者，鲁大夫孟武伯问於夫子曰：“弟子子路有仁德否乎？”" }
      - { type: j, text: "夫子以为，仁道至大，不可全名，故答曰：“不知也。”“又问”者，武伯意其" }
      - { type: j, text: "子路有仁，故夫子虽答以不知，又复问之也。“子曰：由也，千乘之国，可使治" }
      - { type: j, text: "其赋也，不知其仁也”者，此夫子更为武伯说子路之能，言由也有勇，千乘之大" }
      - { type: j, text: "国，可使治其兵赋也，不知其仁也。言仁道则不全也。“求也何如”者，此句又" }
      - { type: j, text: "武伯问辞，言弟子冉求仁道何如。“子曰：求也，千室之邑，百乘之家，可使为" }
      - { type: j, text: "之宰也，不知其仁也”者，此孔子又答武伯以冉求之能也，言求也，若卿大夫千" }
      - { type: j, text: "室之邑，百乘卿大夫之家，可使为之邑宰也。仁则不知也。“赤也何如”者，此" }
      - { type: j, text: "句又武伯问辞，言弟子公西赤仁道何如。“子曰：赤也，束带立於朝，可使与宾" }
      - { type: j, text: "客言也，不知其仁也”者，此孔子又答以公西赤之才也，言赤也有容仪，可使为" }
      - { type: j, text: "行人之官，盛服束带立於朝廷，可使与邻国之大宾小客言语应对也，仁则不知。" }
      - { type: j, text: "○注“孔曰：赋，兵赋。○正义曰：案隐四年《左传》云：“敝邑以赋，与陈、" }
      - { type: j, text: "蔡从。”服虔云：“赋，兵也。以田赋出兵，故谓之兵赋。”正谓以兵从也。其" }
      - { type: j, text: "赋法依《周礼》“九夫为井，四井为邑，四邑为丘，丘十六井，出戎马一匹，牛" }
      - { type: j, text: "三头。四丘为甸，甸六十四井，出长毂一乘，戎马四匹，牛十三头，甲士三人，" }
      - { type: j, text: "步卒七十二人”是也。○注“孔曰”至“家臣”。○正义曰：云“千室之邑，卿" }
      - { type: j, text: "大夫之邑”者，《大学》云：“百乘之家，不畜聚敛之臣。”郑注云：“百乘之" }
      - { type: j, text: "家，有采地者也。”又郑注云：“采地，一同之广轮也。”然则此云“千室之邑，" }
      - { type: j, text: "百乘之家”者，谓卿大夫采邑，地有一同，民有千家者也。《左传》曰：“唯卿" }
      - { type: j, text: "备百邑。”《司马法》：“成方十里，出革车一乘。”故知百乘之家，地一同也。" }
      - { type: j, text: "○注“马曰”至“行人”。○正义曰：云“赤，弟子公西华”者，案《史记·弟" }
      - { type: j, text: "子传》云：“公西赤字子华。”郑玄曰：“鲁人，少孔子四十二岁。”云“有容" }
      - { type: j, text: "仪，可使为行人”者，按《周礼》有大行人、小行人之职，掌宾客之礼仪及朝觐" }
      - { type: j, text: "聘问之事。言公西华任此官也。" }
      - { type: j, text: "子谓子贡曰：“女与回也孰愈？”（孔曰：“愈，犹胜也。”）对曰：“赐" }
      - { type: j, text: "也何敢望回？回也闻一以知十，赐也闻一以知二。”子曰：“弗如也，吾与女弗" }
      - { type: j, text: "如也。”（包曰：“既然子贡不如，复云吾与女俱不如者，盖欲以慰子贡也。”）" }
      - { type: z, text: "“子谓”至“如也”。○正义曰：此章美颜回之德。“子谓子贡曰：女" }
      - { type: j, text: "与回也孰愈”者，愈，犹胜也。孔子乘间问弟子子贡曰：“女之才能与颜回谁胜？”" }
      - { type: j, text: "“对曰：赐也何敢望回”者，望，谓比视。子贡称名，言赐也才劣，何敢比视颜" }
      - { type: j, text: "回也？“回也闻一以知十，赐也闻一以知二”者，子贡更言不敢望回之事。假设" }
      - { type: j, text: "数名以明优劣，一者数之始，十者数之终，颜回亚圣，故闻始知终，子贡识浅，" }
      - { type: j, text: "故闻一才知二，以明已与回十分及二，是其悬殊也。“子曰：弗如也，吾与女弗" }
      - { type: j, text: "如也”者，夫子见子贡之答识有悬殊，故云不如也。弗者，不之深也。既然答子" }
      - { type: j, text: "贡不如，又恐子贡惭愧，故复云吾与女俱不如，欲以安慰子贡之心，使无惭也。" }
      - { type: j, text: "宰予昼寝。（孔曰：“宰予，弟子宰我。”）子曰：“朽木不可雕也，（包" }
      - { type: j, text: "曰：“朽，腐也。，琢刻画。”）粪土之墙不可亏也。（王曰：“亏，" }
      - { type: j, text: "镘也。此二者以喻虽施功犹不成。”）於予与何诛？”（孔曰：“诛，责也。今" }
      - { type: j, text: "我当何责於女乎？深责之。”）子曰：“始吾於人也，听其言而信其行，今吾於" }
      - { type: j, text: "人也，听其言而观其行。於予与改是。”（孔曰：“改是，听言信行，更察言观" }
      - { type: j, text: "行，发於宰我之昼寝。”）" }
      - { type: z, text: "“宰予”至“汝是”。○正义曰：此章勉人学也。“宰予昼寝”者，弟" }
      - { type: j, text: "子宰我昼日寝寐也。“子曰：朽木不可雕也，粪土之墙不可亏也”者，此孔子" }
      - { type: j, text: "责宰我之辞也。朽，腐也。，琢刻画也。亏，镘也。言腐烂之木，不可" }
      - { type: j, text: "琢刻画以成器物；粪土之墙，易为危坏，不可亏镘涂冥以成华美。此二者，" }
      - { type: j, text: "以喻人之学道，当轻尺璧而重寸阴。今乃废惰昼寝，虽欲施功教之，亦终无成也。" }
      - { type: j, text: "“於予与何诛”者，诛，责也；与，语辞。言於宰我何足责乎？谓不足可责，乃" }
      - { type: j, text: "是责之深也。然宰我处四科，而孔子深责者，之以设教，卑宰我非实惰学之人" }
      - { type: j, text: "也。“子曰：始吾於人也，听其言而信其行，今吾於人也，听其言而观其行。於" }
      - { type: j, text: "予与改是”者，与亦语辞。以宰予尝谓夫子言已勤学，今乃昼寝，是言与行违，" }
      - { type: j, text: "故孔子责之曰：“始前吾於人也，听其所言即信其行，以为人皆言行相副。今後" }
      - { type: j, text: "吾於人也，虽听其言，更观其行，待其相副，然後信之。因发於宰予昼寝，言行" }
      - { type: j, text: "相违，改是听言信行，更察言观行也。”○注“包曰：宰予，弟子宰我”。○正" }
      - { type: j, text: "义曰：案《史记·弟子传》云：“宰予字子我。”郑玄曰：“鲁人也。”○注" }
      - { type: j, text: "“王曰：亏，镘也”。○正义曰：《释宫》云：“镘谓之亏。”郭璞云：" }
      - { type: j, text: "“泥涂也。”李巡曰：“涂一名朽。涂土之作具也。”然则亏是涂之所用，因" }
      - { type: j, text: "谓泥涂为亏。" }
      - { type: j, text: "子曰：“吾未见刚者。”或对曰：“申枨。”（包曰：“申枨，鲁人。”）" }
      - { type: j, text: "子曰：“枨也欲，焉得刚？”（孔曰：“欲，多情欲。”）" }
      - { type: z, text: "“子曰”至“得刚”。○正义曰：此章明刚。“子曰：吾未见刚”者，" }
      - { type: j, text: "刚谓质直而理者也。夫子以时皆柔佞，故云吾未见刚者。“或对曰：申枨”者，" }
      - { type: j, text: "或人闻孔子之言，乃对曰申枨性刚。“子曰：枨也欲，焉得刚”者，夫子谓或人" }
      - { type: j, text: "言，刚者质直寡欲，今枨也多情欲，情欲既多，或私佞媚，安得刚乎？○注“包" }
      - { type: j, text: "曰：申枨，鲁人。”○正义曰：郑云：“盖孔子弟子申续。”《史记》云：“申" }
      - { type: j, text: "棠字周。”《家语》云：“申续字周。”" }
      - { type: j, text: "子贡曰：“我不欲人之加诸我也，吾亦欲无加诸人。”（马曰：“加，陵也。”）" }
      - { type: j, text: "子曰：“赐也，非尔所及也。”（孔曰：“言不能止人使不加非义於己。”）" }
      - { type: z, text: "“子贡”至“及也”。○正义曰：此章明子贡之志。“子贡曰：我不欲" }
      - { type: j, text: "人之加诸我也，吾亦欲无加诸人”者，加，陵也。诸，於也。子贡言，我不欲他" }
      - { type: j, text: "人以非义加陵於已，吾亦欲无以非义加陵於人也。“子曰：赐也，非尔所及也”" }
      - { type: j, text: "者，尔，女也。夫子言使人不加非义於己，亦为难事，故曰：“赐也，此事非女" }
      - { type: j, text: "所能及。”言不能止人使不加非义於己也。" }
      - { type: j, text: "子贡曰：“夫子之文章，可得而闻也。（章，明也。文彩形质著见，可以耳" }
      - { type: j, text: "目循。）夫子之言性与天道，不可得而闻也已矣。（性者，人之所受以生也。天" }
      - { type: j, text: "道者，元亨日新之道。深微，故不可得而闻也。）" }
      - { type: z, text: "“子贡”至“闻也”。○正义曰：此章言夫子之道深微难知也。“子贡" }
      - { type: j, text: "曰：夫子之文章，可得而闻也”者，章，明也。子贡言，夫子之述作威仪礼法有" }
      - { type: j, text: "文彩，形质著明，可以耳听目视，依循学习，故可得而闻也。“夫子之言性与天" }
      - { type: j, text: "道，不可得而闻也”者，天之所命，人所受以生，是性也。自然化育，元亨日新，" }
      - { type: j, text: "是天道也与，及也。子贡言，若夫子言天命之性，及元亨日新之道，其理深微，" }
      - { type: j, text: "故不可得而闻也。○注“性者”至“闻也”。○正义曰：云“性者，人之所受以" }
      - { type: j, text: "生也”者，《中庸》云：“天命之谓性。”注云：“天命，谓天所命生人者也。" }
      - { type: j, text: "是谓性命。木神则仁，金神则义，火神则礼，水神则信，土神则知。《孝经说》" }
      - { type: j, text: "曰：‘性者，生之质命，人所禀受度也。’”言人感自然而生，有贤愚吉凶，或" }
      - { type: j, text: "仁或义，若天之付命遣使之然，其实自然天性，故云：“性者，人之所受以生也。”" }
      - { type: j, text: "云“天道者，元亨日新之道”者，案《易·乾卦》云：“乾，元亨利贞。”《文" }
      - { type: j, text: "言》曰：“元者，善之长也。亨者，嘉之会也。利者，义之和也。贞者，事之" }
      - { type: j, text: "也。”谓天之体性，生养万物，善之大者，莫善施生，元为施生之宗，故言元者" }
      - { type: j, text: "善之长也。嘉，美也。言天能通畅万物，使物嘉美而会聚，故云嘉之会也。“利" }
      - { type: j, text: "者，义之和也”者，言天能利益庶物，使物各得其宜而和同也。“贞者，事之”" }
      - { type: j, text: "者，言天能以中正之气成就万物，使物皆得济。此明天之德也。天本无心，岂" }
      - { type: j, text: "造元亨利贞之德也？天本无心，岂造元亨利贞之名也？但圣人以人事之，谓此" }
      - { type: j, text: "自然之功，为天之四德也。此但言元亨者，略言之也。天之为道，生生相续，新" }
      - { type: j, text: "新不停，故曰日新也。以其自然而然，故谓之道。云“深微，故不可得而闻也”" }
      - { type: j, text: "者，言人禀自然之性，及天之自然之道，皆不知所以然而然，是其理深微，故不" }
      - { type: j, text: "可得而闻也。" }
      - { type: j, text: "子路有闻，未之能行，唯恐有闻。（孔曰：“前所闻未及行，故恐後有闻不" }
      - { type: j, text: "得并行也。”）" }
      - { type: z, text: "“子路有闻，未之能行，唯恐有闻”。○正义曰：此章言子路之志也。" }
      - { type: j, text: "子路於夫子之道，前有所闻，未能及行，唯恐後有闻不得并行也。" }
      - { type: j, text: "子贡问曰：“孔文子何以谓之文也？”（孔曰：“孔文子，卫大夫孔圉。文，" }
      - { type: j, text: "谥也。”）子曰：“敏而好学，不耻下问，是以谓之文也。”（孔曰：“敏者，" }
      - { type: j, text: "识之疾也。下问，谓凡在已下者。”）" }
      - { type: z, text: "“子贡”至“文也”。○正义曰：此章言文为美谥也。“子贡问曰：" }
      - { type: j, text: "‘孔文子何以谓之文也’”者，言文是谥之美者，故问卫大夫孔圉有何善行，而" }
      - { type: j, text: "得谓之闻也？“子曰：敏而好学，不耻下问，是以谓之文也”者，此夫子为子贡" }
      - { type: j, text: "说文子之美行也。敏者，疾也。下问，问凡在己下者。言文子知识敏疾，而又好" }
      - { type: j, text: "学，有所未辨，不羞耻於问己下之人。有此美行，是以谥谓之文也。○注“孔曰”" }
      - { type: j, text: "至“谥也”。○正义曰：云“孔文子，卫大夫孔圉”者，《左传》文也。云“文，" }
      - { type: j, text: "谥也”者，案《谥法》云：“勤学好问曰文。”" }
      - { type: j, text: "子谓子产：“有君子之道四焉：（孔曰：“子产，郑大夫公孙侨。”）其行" }
      - { type: j, text: "已也恭，其事上也敬，其养民也惠，其使民也义。" }
      - { type: z, text: "“子谓”至“也义”。○正义曰：此章美子产之德。“子谓：子产有君" }
      - { type: j, text: "子之道四焉”者，孔子评论郑大夫子产，事上使下有君子之道四焉，下文是也。" }
      - { type: j, text: "“其行已也恭”者，一也，言已之所行，常能恭顺，不违忤於物也。“其事上也" }
      - { type: j, text: "敬”者，二也，言承事在已上之人及君亲，则忠心复加谨敬也。“其养民也惠”" }
      - { type: j, text: "者，三也，言爱养於民，振乏周无以恩惠也。“其使民也义”者，四也。义，宜" }
      - { type: j, text: "也。言役使下民，皆於礼法得宜，不妨农也。○注“孔曰”至“孙侨”。○正义" }
      - { type: j, text: "曰：案《左传》，子产，穆公之孙，公子发之子，名侨。公子之子称公孙。襄三" }
      - { type: j, text: "十年执郑国之政，故云郑大夫公孙侨也。公子发字子国，公孙之子以王父字为氏，" }
      - { type: j, text: "据後而言，故後或谓之国侨。" }
      - { type: j, text: "子曰：“晏平仲善与人交，久而敬之。”（周曰：“齐大夫。晏，姓。平，" }
      - { type: j, text: "谥。名婴。”）" }
      - { type: z, text: "“子曰：晏平仲善与人交，久而敬之”。○正义曰：此章言齐大夫晏平" }
      - { type: j, text: "仲之德。凡人轻交易绝，平仲则久而愈敬，所以为善。○注“周曰”至“名婴”。" }
      - { type: j, text: "○正义曰：云“齐大夫。晏，姓。平，谥。名婴”者，案《左传》文知之，是晏" }
      - { type: j, text: "桓子之子也。《谥法》：“治而清省曰平。”" }
      - { type: j, text: "子曰：“臧文仲居蔡，（包曰：“臧文仲，鲁大夫臧孙辰。文，谥也。蔡，" }
      - { type: j, text: "国君之守龟，出蔡地，因以为名焉，长尺有二寸。居蔡，僭也。”）山节藻，" }
      - { type: j, text: "（包曰：“节者，而也。刻镂为山。者，梁上楹，画为藻文。言其奢侈。”）" }
      - { type: j, text: "何如其知也？”（孔曰：“非时人谓之为知。”）" }
      - { type: z, text: "“子曰”至“知也”。○正义曰：此章明臧文仲不知也。“子曰：臧文" }
      - { type: j, text: "仲居蔡”者，蔡，国君之守龟名也，而鲁大夫臧文仲居守之，言其僭也。“山节”" }
      - { type: j, text: "者，节，而也，刻镂为山形，故云山节也。“藻”者，藻，水草有文者也。" }
      - { type: j, text: "，梁上短柱也。画为藻文，故云藻。此言其奢侈也。“何如其知也”者，言" }
      - { type: j, text: "僭奢若此，是不知也，所以非时人谓之为知。○注“包曰”至“僭也”。○正义" }
      - { type: j, text: "曰：云“臧文仲，鲁大夫臧孙辰”者，案《世本》“孝公生僖伯区，区生哀" }
      - { type: j, text: "伯达，达生伯氏瓶，瓶生文仲辰”，则辰是公子区曾孙也。区字子臧，公孙" }
      - { type: j, text: "之子以王父字为氏，故姓曰臧也。云“文，谥也”者，《谥法》云：“道德博厚" }
      - { type: j, text: "曰文。”云“蔡，国君之守龟，出蔡地，因以为名焉，长尺有二寸。居蔡，僭也”" }
      - { type: j, text: "者，《汉书·食货志》云：“元龟为蔡。”《家语》称“漆平对孔子云：‘臧" }
      - { type: j, text: "氏有守龟，其名曰蔡。文仲三年而为一兆，武仲三年而为二兆。’”是大蔡为大" }
      - { type: j, text: "龟，蔡是龟之名耳。郑玄、包咸皆云出蔡地，因以为名，未知孰是。《食货志》" }
      - { type: j, text: "云：“龟不盈尺，不得为宝。”故知此龟长尺二寸，此国君之守龟。臧氏为大夫" }
      - { type: j, text: "而居之，故云僭也。○注“包曰”至“奢侈”。○正义曰：云“节者，而也”" }
      - { type: j, text: "者，《释宫》文。云“刻镂为山者，梁上楹，画为藻文”者，《释宫》云：" }
      - { type: j, text: "“{亡木}瘤谓之梁，其上楹谓之，而谓之。”郭璞曰：“，侏儒柱也。" }
      - { type: j, text: "即栌也。”此言山节者，谓刻镂柱头为斗拱形如山也。“藻”者，谓画梁上" }
      - { type: j, text: "短柱为藻文也。此是天子庙饰，而文仲僭为之，故言其奢侈。文二年《左传》仲" }
      - { type: j, text: "尼谓之“作虚器”，言有其器而无其位，故曰虚也。" }
      - { type: j, text: "子张问曰：“令尹子文，（孔曰：“令尹子文，楚大夫，姓斗名，字於菟。”）" }
      - { type: j, text: "三仕为令尹，无喜色。三已之，无愠色。旧令尹之政，必以告新令尹。何如？”" }
      - { type: j, text: "子曰：“忠矣。”曰：“仁矣乎？”曰：“未知。焉得仁？”（但闻其忠事，未" }
      - { type: j, text: "知其仁也。）“崔子弑齐君，陈文子有马十乘，弃而违之。（孔曰：“皆齐大夫。" }
      - { type: j, text: "崔杼作乱，陈文子恶之，捐其四十匹马，违而去之。”）至於他邦，则曰：‘犹" }
      - { type: j, text: "吾大夫崔子也。’违之。之一邦，则又曰：‘犹吾大夫崔子也。’违之。何如？”" }
      - { type: j, text: "子曰：“清矣。”曰：“仁矣乎？”曰：“未知。焉得仁？”（孔曰：“文子辟" }
      - { type: j, text: "恶逆，去无道，求有道。当春秋时，臣陵其君，皆如崔子，无有可止者。”）" }
      - { type: z, text: "“子张”至“得仁”。○正义曰：此章明仁之难成也。“子张问曰：令" }
      - { type: j, text: "尹子文，三仕为令尹，无喜色。三已之，无愠色。旧令尹之政，必以告新令尹。" }
      - { type: j, text: "何如”者，弟子子张问於孔子曰：“楚大夫令尹子文，三被任用，仕为令尹之官，" }
      - { type: j, text: "而无喜见於颜色。三被已退，无愠怼之色。旧令尹之政令规矩，必以告新令尹，" }
      - { type: j, text: "虑其未晓也。”子文有此美行，子张疑可谓仁，故问曰：“何如？”“子曰：忠" }
      - { type: j, text: "矣”者，孔子答之，为行如此，是忠臣也。“曰：仁矣乎”者，子张复问子文此" }
      - { type: j, text: "德可谓仁矣乎？“曰：未知。焉得仁”者，孔子答言，如其所说，但闻其忠事，" }
      - { type: j, text: "未知其仁也。“崔子弑齐君，陈文子有马十乘，弃而违之。至於他邦，则曰：" }
      - { type: j, text: "‘犹吾大夫崔子也。’违之。之一邦，则又曰：‘犹吾大夫崔子也。’违之。何" }
      - { type: j, text: "如”者，此子张又举齐大夫陈文子之行而问孔子也。崔子，崔杼也，为齐大夫，" }
      - { type: j, text: "作乱弑其君光。陈文子恶之，故家虽富有马十乘（谓四十匹也），而辄捐弃，违" }
      - { type: j, text: "去之。至於他国，亦遇其乱，陈文子则曰，“犹吾齐大夫崔子也”，而违去之。" }
      - { type: j, text: "复往一他邦，则又曰，“犹吾齐大夫崔子也”，而违去之。为行若此，其人何如？" }
      - { type: j, text: "“子曰：清矣”者，孔子答言，文子辟恶逆，去无道，求有道。当春秋时，臣陵" }
      - { type: j, text: "其君，皆如崔子，无可止者，可谓清洁矣。“曰：仁矣乎”者，子张意其为仁，" }
      - { type: j, text: "故复问之曰：“可以为仁矣乎？”“曰：“未知。焉得仁”者，孔子答言：“据" }
      - { type: j, text: "其所闻，但是清耳，未知他行，安得仁乎？”○注“孔曰”至“於菟”。○正义" }
      - { type: j, text: "曰：案宣四年《左传》云：“初，若敖娶於云阝，生斗伯比。若敖卒，从其母畜" }
      - { type: j, text: "於云阝，淫於云阝子之女，生子文焉。云阝夫人使弃诸梦中。虎乳之。云阝子田，" }
      - { type: j, text: "见之，惧而归。夫人以告，遂使收之。楚人谓乳，谓虎於菟，故命之曰斗於" }
      - { type: j, text: "菟。实为令尹子文。”是也。令尹，宰也。《周礼》六卿，太宰为长，遂以宰为" }
      - { type: j, text: "上卿之号。楚臣令尹为长，从他国之言，或亦谓之宰。宣十二年《左传》云“" }
      - { type: j, text: "敖为宰”是也。令，善也；尹，正也，言用善人正此官也。楚官多以尹为名，皆" }
      - { type: j, text: "取其正直也。○注“孔曰”至“去之”。○正义曰：云“皆齐大夫”者，并见" }
      - { type: j, text: "《春秋》，故知之。云“崔杼作乱”者，左襄二十五年。云“四十匹马”者，古" }
      - { type: j, text: "以四马其驾一车，因谓四匹为乘。《经》言十乘，故知四十匹也。" }
      - { type: j, text: "季文子三思而後行。子闻之，曰：“再，斯可矣。”（郑曰：“季文子，鲁" }
      - { type: j, text: "大夫季孙行父，文，谥也。文子忠而有贤行，其举事寡过，不必及三思。”）" }
      - { type: z, text: "“季文子三思而後行。子闻之，曰：再，斯可矣”。○正义曰：此章美" }
      - { type: j, text: "鲁大夫季文子之德。文子忠而有贤行，其举事皆三思之然後乃行，常寡过咎。孔" }
      - { type: j, text: "子闻之，曰：“不必及三思，但再思之，斯亦可矣。”○注“郑曰”至“三思”。" }
      - { type: j, text: "○正义曰：案《春秋》文六年《经》书“秋，季孙行父如晋”。《左传》曰：" }
      - { type: j, text: "“季文子将聘於晋，使求遭丧之礼以行。其人曰：‘将焉用之？’文子曰：‘备" }
      - { type: j, text: "豫不虞，古之善教也。’求而无之，实难。过求，何害？”杜预云：“所谓文子" }
      - { type: j, text: "三思。”故知“文子，鲁大夫季孙行父”也。《谥法》云：“道德博厚曰文。”" }
      - { type: j, text: "子曰：“甯武子，（马曰：“卫大夫宁俞。武，谥也。”）邦有道则知，邦" }
      - { type: j, text: "无道则愚。其知可及也，其愚不可及也。”（孔曰：“佯愚似实，故曰不可及也。”）" }
      - { type: z, text: "“子曰”至“及也”。○正义曰：此章美卫大夫甯武子之德也。“邦有" }
      - { type: j, text: "道则知，邦无道则愚”者，此其德也。若遇邦国有道，则显其知谋。若遇无道，" }
      - { type: j, text: "则韬藏其知而佯愚。“其知可及也，其愚不可及也”者，言有道则知，人或可及；" }
      - { type: j, text: "佯愚似实，不可及也。○注“马曰：卫大夫甯俞。武，谥也”。○正义曰：案" }
      - { type: j, text: "《春秋》文四年：“卫侯使甯俞来聘。”《左传》曰：“卫甯武子来聘，公与之" }
      - { type: j, text: "燕，为赋《湛露》及《彤弓》。不辞，又不答赋。使行人私焉。对曰：‘臣以为" }
      - { type: j, text: "肄业及之也。’”杜元凯注云：“此其愚不可及也。”是甯武子即甯俞也。《谥" }
      - { type: j, text: "法》云：“刚︹直理曰武。”" }
      - { type: j, text: "子在陈，曰：“归与！归与！吾党之小子狂简，斐然成章，不知所以裁之。”" }
      - { type: j, text: "（孔曰：“简，大也。孔子在陈，思归欲去，故曰：‘吾党之小子，狂简者进取" }
      - { type: j, text: "於大道，妄作穿凿以成文章，不知所以裁制，我当归以裁之耳。’遂归。”）" }
      - { type: z, text: "“子在陈，曰：归与！归与！吾党之小子狂简，斐然成章，不知所以裁" }
      - { type: j, text: "之”。○正义曰：此章孔子在陈既久，言其欲归之意也。与，语辞。再言“归与”" }
      - { type: j, text: "者，思归之深也。狂者，进取也。简，大也。斐然，文章貌。言我所以归者，以" }
      - { type: j, text: "吾乡党之中，未学之小子等，进取大道，妄作穿凿，斐然而成文章，不知所以裁" }
      - { type: j, text: "制，故我当归以裁之耳。遂归也。不即归而言此者，恐人怪已，故此为辞耳。" }
      - { type: j, text: "子曰：“伯夷、叔齐不念旧恶，怨是用希。”（孔曰：“伯夷、叔齐，孤竹" }
      - { type: j, text: "君之二子。孤竹，国名。”）" }
      - { type: z, text: "“子曰：伯夷、叔齐不念旧恶，怨是用希”。○正义曰：此章美伯夷、" }
      - { type: j, text: "叔齐二人之行。不念旧时之恶而欲报复，故希为人所怨恨也。○注“伯夷、叔齐，" }
      - { type: j, text: "孤竹君之二子。孤竹，国名”。○正义曰：案《春秋少阳篇》：“伯夷姓墨，名" }
      - { type: j, text: "允，字公信。伯，长也。夷，谥。叔齐名智，字公达，伯夷之弟。齐亦谥也。”" }
      - { type: j, text: "太史公曰“伯夷、叔齐，孤竹君之二子也。父欲立叔齐，及父卒，叔齐让伯夷。" }
      - { type: j, text: "伯夷曰：‘父命也。’遂逃去。叔齐亦不肯立而逃之。国人立其中子。於是伯夷、" }
      - { type: j, text: "叔齐闻西伯昌善养老，盍往归焉。及至，西伯卒，武王载木主，号为文王，东伐" }
      - { type: j, text: "纣。伯夷、叔齐叩马而谏曰：“父死不葬，爰及干戈，可谓孝乎？以臣弑君，可" }
      - { type: j, text: "谓仁乎？”左右欲兵之。太公曰：‘此义人也。’扶而去之。武王已平殷乱，天" }
      - { type: j, text: "下宗周，而伯夷、叔齐耻之，义不食周粟，隐於首阳山，采薇而食之。及饿且死”" }
      - { type: j, text: "者，是也。孤竹，北方之远国名。《地里志》：“辽西令支有孤竹城。”应劭曰：" }
      - { type: j, text: "“故伯夷国。”" }
      - { type: j, text: "子曰：“孰谓微生高直？（孔曰：“微生，姓，名高，鲁人也。”）或乞醯" }
      - { type: j, text: "焉，乞诸其邻而与之。”（孔曰：“乞之四邻，以应求者，用意委曲，非为直人。”）" }
      - { type: z, text: "“子曰”至“与之”。○正义曰：此章明直者不应委曲也。“孰谓微生" }
      - { type: j, text: "高直”者，孰，谁也。孔子曰：“谁言鲁人微生高性行正直？”“或乞醯焉，乞" }
      - { type: j, text: "诸其邻而与之”者，此孔子言其不直之事。醯，醋也。诸，之也。或有一人就微" }
      - { type: j, text: "生高乞醯，时自无之，即可答云无。高乃乞之其四邻，以应求者，用意委曲，非" }
      - { type: j, text: "为直人也。" }
      - { type: j, text: "子曰：“巧言、令色、足恭，（孔曰：“足恭，便僻貌。”）左丘明耻之，" }
      - { type: j, text: "丘亦耻之。（孔曰：“左丘明，鲁太史。”）匿怨而友其人，（孔曰：“心内相" }
      - { type: j, text: "怨而外诈亲。”）左丘明耻之，丘亦耻之。”" }
      - { type: z, text: "“子曰”至“耻之”。○正义曰：此章言鲁太史左丘明与圣同耻之事。" }
      - { type: j, text: "“巧言、令色、足恭”者，孔以为，巧好言语，令善颜色，便僻其足以为恭，谓" }
      - { type: j, text: "前却俯仰以足为恭也。一曰：足，将树切。足，成也。谓巧言令色以成其恭，取" }
      - { type: j, text: "媚於人也。“左丘明耻之，丘亦耻之”者，左丘明，鲁太史，受《春秋经》於仲" }
      - { type: j, text: "尼者也。耻此诸事不为，合孔子之意，故云丘亦耻之。“匿怨而友其人”者，" }
      - { type: j, text: "友，亲也；匿，隐也。言心内隐其相怨，而外貌诈相亲友也。左丘明耻之，丘亦" }
      - { type: j, text: "耻之”者，亦俱耻而不为也。○注“孔曰：足恭，便僻”貌。○正义曰：此读足" }
      - { type: j, text: "如字。便僻，谓便习盘僻其足以为恭也。○注“左丘明，鲁太史”。○正义曰：" }
      - { type: j, text: "《汉书·艺文志》文也。" }
      - { type: j, text: "颜渊、季路侍。子曰：“盍各言尔志？”子路曰：“愿车马衣轻裘与朋友共" }
      - { type: j, text: "敝之而无憾。”（孔曰：“憾，恨也。”）颜渊曰：“愿无伐善，（孔曰：“不" }
      - { type: j, text: "自称己之善。”）无施劳。”（孔曰：“不以劳事置施於人。”）子路曰：“愿" }
      - { type: j, text: "闻子之志。”子曰：“老者安之，朋友信之，少者怀之。”（孔曰：“怀，归也。”）" }
      - { type: z, text: "“颜渊”至“怀之”。○正义曰：此章仲尼、颜渊、季路各言其志也。" }
      - { type: j, text: "“颜渊、季路侍”者，弟子侍孔子也。卑在尊旁曰侍。“子曰：盍各言尔志”者，" }
      - { type: j, text: "尔，女也；盍，何不也。夫子谓二弟子曰：“何不各言女心中之所志也？”“子" }
      - { type: j, text: "路曰：愿车马衣轻裘与朋友共敝之而无憾”者，憾，恨也。衣裘以轻者为美，言" }
      - { type: j, text: "原以己之车马衣裘与朋友共乘服而被敝之而无恨也。此重义轻财之志也。“颜渊" }
      - { type: j, text: "曰：愿无伐善，无施劳”者，夸功曰伐。言原不自称伐己之善，不置施劳役之事" }
      - { type: j, text: "於人也。此仁人之志也。“子路曰：原闻子之志”者，二子各言其志毕，子路复" }
      - { type: j, text: "问夫子曰：“原闻子之志。”古者称师曰子。“子曰：老者安之，朋友信之，少" }
      - { type: j, text: "者怀之”者，此夫子之志也。怀，归也。言已原老者安，己事之以孝敬也。朋友" }
      - { type: j, text: "信，已待之以不欺也。少者，归己施之以恩惠也。" }
      - { type: j, text: "子曰：“已矣乎！吾未见能见其过而内自讼者也。”（包曰：“讼，犹责也。" }
      - { type: j, text: "言人有过，莫能自责。”）" }
      - { type: z, text: "“子曰：已矣乎！吾未见能见其过而内自讼者也”。○正义曰：此章疾" }
      - { type: j, text: "时人有过，莫能自责也。讼，犹责也。已，终也。吾未见有人能自见其已过而内" }
      - { type: j, text: "自责者也。言将终不复见，故云已矣乎。" }
      - { type: j, text: "子曰：“十室之邑，必有忠信如丘者焉。不如丘之好学也。”" }
      - { type: z, text: "“子曰：十室之邑，必有忠信如丘者焉，不如丘之好学也”。○正义曰：" }
      - { type: j, text: "此章夫子言己勤学也。十室之邑，邑之小者也。其邑虽小，亦不诬之，必有忠信" }
      - { type: j, text: "如我者焉，但不如我之好学不厌也。卫读“焉，为虔切”，为下句首。焉，犹" }
      - { type: j, text: "安也。言十室之邑虽小，必有忠信如我者也，安不如我之好学也？言亦不如我之" }
      - { type: j, text: "好学也，义并得通，故具存焉。" }
