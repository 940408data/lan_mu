# 尚書正義卷八（孔穎達疏）：j 為經文＋孔安國注，z 為正義疏文。
sections:
  - id: juan8
    name: 卷八
    blocks:
      - { type: j, text: "伊尹作《鹹有一德》。言君臣皆有純一之德，以戒太甲。" }
      - { type: z, text: "“伊尹作《鹹有一德》”○正義曰：太甲既歸於亳，伊尹致仕而退，恐太甲德不純一，故作此篇以戒之。經稱尹躬及湯鹹有一德，言己君臣皆有純一之德，戒太甲使君臣亦然。此主戒太甲而言臣有一德者，欲令太甲亦任一德之臣。經雲“任官惟賢材，左右惟其人”，是戒太甲使善用臣也。伊尹既放太甲，又迎而復之，是伊尹有純一之德，己為太甲所信，是己君臣純一，欲令太甲法之。" }
      - { type: j, text: "鹹有一德即政之後恐其不一，故以戒之。" }
      - { type: z, text: "“鹹有一德”○正義曰：此篇終始皆言一德之事，發首至“陳戒於德”敘其作戒之由，已下皆戒辭也。“德”者，得也，內得於心，行得其理，既得其理，執之必固，不為邪見更致差貳，是之謂“一德”也。而凡庸之主，監不周物，志既少決，性復多疑，與智者謀之，與愚者敗之，則是二三其德，不為一也。經雲：“德惟一，動罔不吉。德二三，動罔不兇。”是不二三則為一德也。又曰：“終始惟一，時乃日新。”言守一必須固也。太甲新始即政，伊尹恐其二三，故專以一德為戒。" }
      - { type: j, text: "伊尹既復政厥闢，還政太甲。將告歸，乃陳戒於德。告老歸邑，陳德以戒。" }
      - { type: z, text: "“伊尹”至“於德”○正義曰：自太甲居桐，而伊尹秉政。太甲既歸於亳，伊尹還政其君，將欲告老歸其私邑，乃陳言戒王於德，以一德戒王也。太甲既得復歸，伊尹即應還政，其告歸陳戒，未知在何年也。下雲“今嗣王新服厥命”，則是初始即政，蓋太甲居亳之後即告老也。《君奭》雲：“在太甲，時則有若保衡。”保衡，伊尹也。襄二十一年《左傳》雲：“伊尹放太甲而相之，卒無怨色。”則伊尹又相太甲。蓋伊尹此時將欲告歸，太甲又留之為相，如成王之留周公，不得歸也。○傳“告老”至“以戒”○正義曰：伊尹湯之上相，位為三公，必封為國君。又受邑於畿內，告老致政事於君，欲歸私邑以自安。將離王朝，故陳戒以德也。《無逸》雲“肆祖甲之享國三十三年”，傳稱祖甲即太甲也。《殷本紀》雲：“太甲崩，子沃丁立。”《沃丁》序雲：“沃丁既葬伊尹於亳。”則伊尹卒在沃丁之世。湯為諸侯之時已得伊尹，此至沃丁始卒，伊尹壽年百有餘歲。此告歸之時，已應七十左右也。《殷本紀》雲：“太甲既立三年，伊尹放之於桐宮。居桐宮三年，悔過反善，伊尹乃迎而受之政。”謂太甲歸亳之歲已為即位六年，與此經相違，馬遷之說妄也。《紀年》雲，殷仲壬“即位，居亳，其卿士伊尹”。仲壬崩，伊尹乃放太甲於桐而自立也。伊尹即位於太甲七年。太甲潛出自桐，殺伊尹，乃立其子伊陟、伊奮，命復其父之田宅而中分之。案此經序伊尹奉太甲歸於亳，其文甚明。《左傳》又稱“伊尹放太甲而相之”，《孟子》雲“有伊尹之志則可，無伊尹之志則篡”，伊尹不肯自立，太甲不殺伊尹也。必若伊尹放君自立，太甲起而殺之，則伊尹死有餘罪，義當汙宮滅族，太甲何所感德而復立其子，還其田宅乎？《紀年》之書，晉太康八年汲郡民發魏安僖王冢得之，蓋當時流俗有此妄說，故其書因記之耳。" }
      - { type: j, text: "曰：“嗚呼！天難諶，命靡常。以其無常，故難信。○諶，徐巿林反。常厥德，保厥位。厥德匪常，九有以亡。人能常其德，則安其位。九有，諸侯。桀不能常其德，湯伐而兼之。" }
      - { type: z, text: "“九有以亡”○正義曰：《毛詩》傳雲：“九有，九州也。”此傳雲“九有，諸侯”，謂九州所有之諸侯。伊尹此言，泛說大理，未指夏桀，但傳顧下文比桀，為此言之驗，故云“桀不能常其德，湯伐而兼之”。" }
      - { type: j, text: "夏王弗克庸德，慢神虐民。言桀不能常其德，不敬神明，不恤下民。皇天弗保，監於萬方，啟迪有命，言天不安桀所為，廣視萬方，有天命者開道之。眷求一德，俾作神主。天求一德，使伐桀為天地神祇之主。惟尹躬暨湯，鹹有一德，克享天心，受天明命，享，當也。所徵無敵，謂之受天命。" }
      - { type: z, text: "傳“享當”至“天命”○正義曰：德當神意，神乃享之，故以“享”為當也。天道遠而人道近，天之命人，非有言辭文誥，正以神明祐之，使之所徵無敵，謂之受天命也。緯候之書乃稱有黃龍白龜白魚赤雀負圖銜書以授聖人，正典無其事也。漢自哀平之間，緯候始起，假託鬼神，妄稱祥瑞，孔時未有其說，縱使時已有之，亦非孔所信也。" }
      - { type: j, text: "以有九有之師，爰革夏正。爰，於也。於得九有之眾，遂伐夏勝之，改其正。非天私我有商，惟天佑於一德。非天私商而王之，佑助一德，所以王。○王，於況反，下同；或如字。非商求於下民，惟民歸於一德。非商以力求民，民自歸於一德。德惟一，動罔不吉。德二三，動罔不兇。二三，言不一。惟吉凶不僣在人，惟天降災祥在德。行善則吉，行惡則兇，是不差。德一，天降之善；不一，天降之災；是在德。○僣，子念反。" }
      - { type: z, text: "“惟吉”至“在德”○正義曰：指其已然，則為“吉凶”；言其徵兆，則曰“災祥”；其事不甚異也。吉凶已成之事，指人言之，故曰“在人”。災祥未至之徵，行之所招，故言“在德”。“在德”謂為德有一與不一，“在人”謂人行有善與不善也。吉凶已在其身，故不言來處；災祥自外而至，故言“天降”；其實吉凶亦天降也。" }
      - { type: j, text: "“今嗣王新服厥命，惟新厥德。其命，王命。新其德，戒勿怠。終始惟一，時乃日新。言德行終始不衰殺，是乃日新之義。○行，下孟反。殺，色界反，衰微也，殺害也，言小小害也。任官惟賢材，左右惟其人。官賢才而任之，非賢材不可任。選左右，必忠良。不忠良，非其人。臣為上為德，為下為民。言臣奉上佈德，順下訓民，不可官所私，任非其人。○為上，於偽反，下“為民”同。為德，如字，下“為下”同，徐皆於偽反。其難其慎，惟和惟一。其難無以為易，其慎無以輕之，群臣當和一心以事君，政乃善。○易，以豉反。" }
      - { type: z, text: "“今嗣王”至“惟一”○正義曰：上既言“在德”，此指戒嗣王，今新始服其王命，惟當新其所行之德。所云“新”者，終始所行，惟常如一，無有衰殺之時，是乃“日新”也。王既身行一德，臣亦當然。任人為官，惟用其賢材。輔弼左右，惟當用其忠良之人，乃可為左右耳。此“任官”、“左右”即王之臣也。臣之為用，所施多矣。何者？言臣之助為在上，當施為道德；身為臣下，當須助為於民也。臣之既當為君，又須為民，故不可任非其才，用非其人。此臣之所職，其事甚難，無得以為易。其事須慎，無得輕忽。為臣之難如此，惟當群臣和順，惟當共秉一心，以此事君，然後政乃善耳。言君臣宜皆有一德。○傳“其命”至“勿怠”○正義曰：《說命》雲：“王言惟作命。”成十八年《左傳》雲：“人之求君，使出命也。”是言人君職在發命。“新服厥命”，新始服行王命，故云“其命，王命”也。“新其德”者，勤行其事，日日益新，戒王勿懈怠也。○傳“言德”至“之義”○正義曰：“日新”者，日日益新也。若今日勤而明日惰，昨日是而今日非，自旁觀之，則有新有舊。言王德行終始皆同，不有衰殺，從旁觀之，每日益新，是乃“日新”之義也。○傳“官賢”至“其人”○正義曰：“任官”謂任人以官，故云“官賢才而任之”，言官用賢才而委任之。《詩序》雲“任賢使能”，非賢才不可任也。《冏命》雲：“小大之臣，鹹懷忠良。”故言“選左右，必忠良”，不忠良，即是非其人。“任官”是用人為官，“左右”亦是任而用之，故言“選左右”也。直言其人，“人”字不見，故據《冏命》之文，以“忠良”充之。○傳“言臣”至“其人”○正義曰：“言臣奉上佈德”者，“奉上”謂奉為在上，解經“為上”也；“佈德”者謂布為道德，解經“為德”也。“順下訓民”者，“順下”謂卑順以為臣下，解經“為下”也；“訓民”者，謂以善道訓助下民，解經“為民”也。顧氏亦同此解。○傳“其難”至“乃善”○正義曰：此經申上臣事既所為如此，其難無以為易，其慎無以輕忽之，戒臣無得輕易臣之職也。既事不可輕，宜和協奉上，群臣當一心以事君，如此政乃善耳。一心即一德，言臣亦當一德也。" }
      - { type: j, text: "德無常師，主善為師。德非一方，以善為主，乃可師。善無常主，協於克一。言以合於能一為常德。俾萬姓鹹曰：‘大哉！王言。’一德之言，故曰大。又曰：‘一哉！王心。’能一德，則一心。克綏先王之祿，永厎烝民之生。言為王而令萬姓如此，則能保安先王之寵祿，長致眾民所以自生之道，是明王之事。○烝，之丞反。嗚呼！七世之廟，可以觀德。天子立七廟，有德之王則為祖宗，其廟不毀，故可觀德。萬夫之長，可以觀政。能整齊萬夫，其政可知。○長，丁丈反。" }
      - { type: z, text: "“嗚呼”至“觀政”○正義曰：此又勸王修德以立後世之名。禮王者祖有功、宗有德，雖七世之外其廟不毀。嗚呼！七世之廟其外則猶有不毀者，可以觀知其有明德也。立德在於為政，萬夫之長能使其整齊，可以觀知其善政也。萬夫之長尚爾，況天子乎？觀王使為善政也。○傳“天子”至“觀德”○正義曰：天子立七廟，是其常事，其有德之王則列為祖宗，雖七廟親盡，而其廟不毀，故於七廟之外可以觀德矣。下雲“萬夫之長，可以觀政”，謂觀其萬夫之長。此“七世之廟，可以觀德”，謂觀七世之外。文雖同而義小異耳，所謂辭不害意。漢氏以來，論七廟諸多矣，其文見於記傳，《禮器》、《家語》、《荀卿書》、《穀梁傳》皆曰天子立七廟，以為天子常法，不辨其廟之名。《王制》雲：“天子七廟，三昭三穆，與太祖之廟而七。”《祭法》雲：“王立七廟，曰考廟，曰王考廟，曰皇考廟，曰顯考廟，曰祖考廟，皆月祭之。遠廟為祧，有二祧，享嘗乃止。”《漢書》韋玄成議曰：“周之所以七廟者，后稷始封，文王武王受命而王，是以三廟不毀，與親廟四而七也。”鄭玄用此為說。惟周有七廟，二祧為文王武王廟也，故鄭玄《王制》注云：“此周制。七者，太祖及文王武王二祧，與親廟四。太祖，后稷也。殷則六廟，契及湯與二昭二穆。夏則五廟，無太祖，禹與二昭二穆而已。”良由不見古文，故為此謬說。此篇乃是《商書》，已雲“七世之廟”，則天子立七廟，王者常禮，非獨周人始有七廟也。文武則為祖宗，不在昭穆之數，《王制》之文不得雲“三昭三穆”也。劉歆、馬融、王肅雖則不見古文，皆以七廟為天子常禮。所言二祧者，王肅以為高祖之父及祖也，並高祖已下共為三昭三穆耳。《喪服小記》雲：“王者禘其祖之所自出，以其祖配之而立四廟。庶子王亦如之。”所以不同者，王肅等以為受命之王是初基之王，故立四廟。“庶子王”者，謂庶子之後自外繼立，雖承正統之後，自更別立己之高祖已下之廟，猶若漢宣帝別立戾太子悼皇考廟之類也。或可庶子初基為王，亦得與嫡子同，正立四廟也。" }
      - { type: j, text: "後非民罔使，民非後罔事。君以使民自尊，民以事君自生。無自廣以狹人，匹夫匹婦，不獲自盡，民主罔與成厥功。”上有狹人之心，則下無所自盡矣。言先盡其心，然後乃能盡其力，人君所以成功。○狹，戶夾反。盡，徐子忍反，注同。" }
      - { type: z, text: "“無自”至“厥功”○正義曰：既言君民相須，又戒王虛心待物。凡為人主，無得自為廣大，以狹小前人，勿自以所知為大，謂彼所知為小。若謂彼狹小，必待之輕薄。彼知遇薄，則意不自盡。匹夫匹婦不得自盡其意，則在下不肯親上，在上不得下情，如是則人主無與成其功也。" }
      - { type: j, text: "沃丁既葬伊尹於亳，沃丁，太甲子。伊尹既致仕老終，以三公禮葬。○沃，烏毒反，徐於毒反。咎單遂訓伊尹事，訓暢其所行功德之事。作《沃丁》。咎單，忠臣名。作此篇以戒也，亡。" }
      - { type: z, text: "“沃丁”至“作沃丁”○正義曰：沃丁，殷王名也。“沃丁既葬伊尹”，言重其賢德，備禮而葬之。咎單以沃丁愛慕伊尹，遂訓暢伊尹之事以告沃丁。史錄其事，作《沃丁》之篇。○傳“沃丁”至“禮葬”○正義曰：《世本》、《本紀》皆雲“太甲崩，子沃丁立”，是為太甲子也。伊尹本是三公，上篇言其告歸，知“致仕老終，以三公禮葬”。皇甫謐雲：“沃丁八年，伊尹卒，卒年百有餘歲。大霧三日。沃丁葬之以天子禮，葬祀以太牢，親臨喪，以報大德。”晉文請遂，襄王不許，沃丁不當以天子之禮葬伊尹也。孔言三公禮葬，未必有文，要情事當然也。" }
      - { type: j, text: "伊陟相大戊，伊陟，伊尹子。太戊，沃丁弟之子。○陟，張力反。相，息亮反。太戊，馬雲：“太甲子。”亳有祥，桑穀共生於朝。祥，妖怪。二木合生，七日大拱，不恭之罰。○桑，蘇臧反。穀，工木反，楮也。朝，直遙反。伊陟贊於巫咸，作《鹹乂》四篇。贊，告也。巫咸，臣名。皆亡。○巫咸，馬雲：“巫，男巫也，名鹹，殷之巫也。”" }
      - { type: z, text: "“伊陟”至“四篇”○正義曰：伊陟輔相太戊，於亳都之內，有不善之祥，桑穀二木共生於朝。朝非生木之處，是為不善之徵，伊陟以此桑穀之事告於巫咸。史錄其事，作《鹹乂》四篇。“乂”訓治也，言所以致妖，須治理之，故名篇為《鹹乂》也。伊陟不先告太戊而告巫咸者，《君奭》雲：“在太戊，時則有若巫咸乂王家。”則鹹是賢臣，能治王事，大臣見怪而懼，先共議論，而後以告君。下篇序雲：“太戊贊於伊陟。”明先告於巫咸，而後告太戊。○傳“伊陟”至“之子”○正義曰：“伊陟，伊尹子”，相傳為然。《殷本紀》雲：“沃丁崩，弟太庚立。崩，子小甲立。崩，弟雍己立。崩，弟太戊立。”是太戊為小甲弟，太庚之子。○傳“祥妖”至“之罰”○正義曰：《漢書·五行志》雲：“凡草物之類謂之妖，自外來謂之祥。”“祥”是惡事先見之徵，故為“妖怪”也。“二木合生”謂共處生也。“七日大拱”，伏生《書傳》有其文，或當別出餘書，則孔用之也。鄭玄注《書傳》雲：“兩手扼之曰拱。”生七日而見其大滿兩手也。《殷本紀》雲“一暮大拱”，言一夜即滿拱，所聞不同，故說異也。《五行傳》曰：“貌之不恭，是謂不肅。時則有青眚之祥。”《漢書·五行志》夏侯始昌、劉向等說雲：“肅，敬也。內曰恭，外曰敬。人君行己，體貌不恭，怠慢驕蹇，則不能敬。木色青，故有青眚之祥。”是言木之變怪，是貌不恭之罰。人君貌不恭，天將罰之，木怪見其徵也。皇甫謐雲：“太戊問於伊陟，伊陟曰：‘臣聞妖不勝德，帝之政事有闕。’白帝修德。太戊退而佔之曰：‘桑穀野木而不合生於朝，意者朝亡乎？’太戊懼，修先王之政，明養老之禮，三年而遠方重譯而至七十六國。”是言妖不勝德也。○傳“贊告”至“臣名”○正義曰：禮有贊者，皆以言告人，故“贊”為告也。《君奭》傳曰：“巫，氏也。”當以“巫”為氏，名“鹹”。此言“臣名”者，言是臣之名號也。鄭玄雲“巫咸謂之巫官”者，案《君奭》鹹子又稱，賢父子併為大臣，必不世作巫官，故孔言“巫，氏”是也。" }
      - { type: j, text: "太戊贊於伊陟，告以改過自新。作《伊陟》、《原命》。原，臣名。《原命》、《伊陟》二篇皆亡。" }
      - { type: z, text: "“太戊”至“原命”○正義曰：言太戊贊於伊陟，惟告伊陟，不告原也。史錄其事，而作《伊陟》、《原命》二篇，則太戊告伊陟，亦告原，俱以桑穀事告，故序裛以為文也。“原”是臣名而云“原命”，謂以言命原，故以“原命”名篇，猶如《冏命》、《畢命》也。" }
      - { type: j, text: "仲丁遷於囂，太戊子。去亳。囂，地名。○囂，五羔反。" }
      - { type: z, text: "“仲丁遷於囂”○正義曰：此三篇皆是遷都之事，俱以君名名篇，並陳遷都之義，如《盤庚》之誥民也。發其舊都謂之“遷”，到彼新邑謂之“居”，“遷於囂”與“居相”亦事同也。以“河亶甲”三字句長，不言“於”，其實亦是俱於相也。“圮於耿”者，孔意以為毀於相地，乃遷於耿地，其篇蓋言毀意，故序特言“圮”也。李顒雲：“囂在陳留浚儀縣。”皇甫謐雲：“仲丁自亳徙囂，在河北也。或曰今河南敖倉，二說未知孰是也。”相地孔雲“在河北”，蓋有文而知也。謐又以耿在河東，皮氏縣耿鄉是也。○傳“太戊”至“地名”○正義曰：此及下傳言仲丁是太戊之子，河亶甲仲丁弟也。祖乙河亶甲子，皆《世本》文也。仲丁是太戊之子，太戊之時仍雲亳有祥，知仲丁遷於囂去亳也。" }
      - { type: j, text: "作《仲丁》。陳遷都之義，亡。" }
      - { type: j, text: "河亶甲居相，仲丁弟。相，地名，在河北。○亶，丁但反。相，息亮反，在河北，今魏郡有相縣。作《河亶甲》。亡。" }
      - { type: j, text: "祖乙圮於耿，亶甲子。圮於相，遷於耿。河水所毀曰圮。○圮，備美反，徐扶鄙反。馬雲：“毀也。”" }
      - { type: z, text: "傳“亶甲”至“曰圮”○正義曰：孔以河亶甲居相，祖乙即亶甲之子，故以為圮於相地，乃遷都於耿。《釋詁》雲：“圮，毀也。”故云“河水所毀曰圮”。據文“圮於耿”也，知非圮毀於耿，更遷餘處，必雲圮於相地，遷於耿者，明與其上文連。上雲“遷於囂”，謂遷來向囂；“居於相”，謂居於相地，故知“圮於耿”謂遷來於耿，以文相類，故孔為此解。謂古人之言，雖尚要約，皆使言足其文，令人曉解，若圮於相，遷居於耿，經言“圮於耿”，大不辭乎？且亶甲居於相，祖乙居耿，今為水所毀，更遷他處，故言毀於耿耳，非既毀乃遷耿也。《盤庚》雲：“不常厥邑，於今五邦。”及其數之，惟有亳、囂、相、耿四處而已。知此既毀於耿，更遷一處，盤庚又自彼處而遷於殷耳。《殷本紀》雲：“祖乙遷於邢。”馬遷所為說耳。鄭玄雲：“祖乙又去相居耿，而國為水所毀，於是修德以御之，不復徙也。錄此篇者善其國圮毀，改政而不徙。”如鄭所言，稍為文便。但上有《仲丁》、《亶甲》，下有《盤庚》，皆為遷事，作書述其遷意，匆陽毀而不遷，序當改文見義，不應文類遷居，更以不遷為義。汲冢古文雲“盤庚自奄遷於殷”者，蓋祖乙圮於耿，遷於奄，盤庚自奄遷於殷，亳、囂、相、耿與此奄五邦者。此蓋不經之書，未可依信也。" }
      - { type: j, text: "作《祖乙》。亡。" }
      - { type: j, text: "《尚書正義》" }
