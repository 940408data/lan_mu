labels:
  - page: 459
    col: 1
    role: j
    text: 孟子卷第十三朱熹集注
  - page: 459
    col: 2
    role: title
    text: 盡心章句上
  - page: 459
    col: 3
    role: z
    text: 凡四十六章
  - page: 459
    col: 4
    role: j
    text: 孟子曰盡其心者知其性也知其性則
  - page: 459
    col: 5
    role: j
    text: 知天矣
  - page: 459
    col: 6
    role: j
    text: 心者人之神明所以具衆理而應萬
  - page: 459
    col: 7
    role: j
    text: 事者也性則心之所具之理而天又
  - page: 459
    col: 8
    role: j
    text: 理之所從以出者也人有是心莫非
  - page: 460
    col: 1
    role: z
    text: 全體然不窮理則有所蔽而無以盡
  - page: 460
    col: 2
    role: z
    text: 乎此心之量故能極其心之全體而
  - page: 460
    col: 3
    role: z
    text: 無不盡者必其能窮夫理而無不知
  - page: 460
    col: 4
    role: z
    text: 者也既知其理則其所從出亦不外
  - page: 460
    col: 5
    role: z
    text: 是矣以大學之序言之知性則物格
  - page: 460
    col: 6
    role: z
    text: 之謂盡心則知至之謂也
  - page: 460
    col: 7
    role: j
    text: 存其心養其性所以事天也
  - page: 460
    col: 8
    role: z
    text: 存謂操而不捨養謂順而不害事則
  - page: 460
    col: 9
    role: z
    text: 奉承而不違也
  - page: 460
    col: 10
    role: j
    text: 殀壽不貳脩身以俟之所以立命也
  - page: 460
    col: 11
    role: z
    text: 殀壽命之短長也貳疑也不貳者知
  - page: 460
    col: 12
    role: z
    text: 天之至脩身以俟死則事天以終身
  - page: 460
    col: 13
    role: z
    text: 也立命謂全其天之所付不以人為
  - page: 460
    col: 14
    role: z
    text: 害之○程子曰心也性也天也一理
  - page: 460
    col: 15
    role: z
    text: 也自理而言謂之天自禀受而言謂
  - page: 460
    col: 16
    role: z
    text: 之性自存諸人而言謂之心○張子
  - page: 461
    col: 1
    role: z
    text: 曰由太虚有天之名由氣化有道之
  - page: 461
    col: 2
    role: z
    text: 名合虚與氣有性之名合性與知覺
  - page: 461
    col: 3
    role: z
    text: 有心之名愚謂盡心知性而知天所
  - page: 461
    col: 4
    role: z
    text: 以造其理也存心養性以事天所以
  - page: 461
    col: 5
    role: z
    text: 履其事也不知其理固不能履其事
  - page: 461
    col: 6
    role: z
    text: 然徒造其理而不履其事則亦無以
  - page: 461
    col: 7
    role: z
    text: 有諸已矣知天而不以夭壽貳其心
  - page: 461
    col: 8
    role: z
    text: 智之盡也事天而能脩身以俟死仁
  - page: 461
    col: 9
    role: z
    text: 之至也智有不盡固不知所以爲仁
  - page: 461
    col: 10
    role: z
    text: 然智而不仁則亦將流蕩不法而不
  - page: 461
    col: 11
    role: z
    text: 足以爲智矣
  - page: 461
    col: 12
    role: j
    text: 孟子曰莫非命也順受其正
  - page: 461
    col: 13
    role: z
    text: 人物之生吉凶禍福皆天所命然惟
  - page: 461
    col: 14
    role: z
    text: 莫之致而至者乃爲正命故君子脩
  - page: 461
    col: 15
    role: z
    text: 身以俟之所以順受乎此也
  - page: 461
    col: 16
    role: j
    text: 是故知命者不立乎巖牆之下
  - page: 462
    col: 1
    role: z
    text: 命謂正命巖牆之將覆者知正命
  - page: 462
    col: 2
    role: z
    text: 則不處危地以取覆壓之禍
  - page: 462
    col: 3
    role: j
    text: 盡其道而死者正命也
  - page: 462
    col: 4
    role: z
    text: 盡其道則所值之吉凶皆莫之致而
  - page: 462
    col: 5
    role: z
    text: 至者矣
  - page: 462
    col: 6
    role: j
    text: 桎梏死者非正命也
  - page: 462
    col: 7
    role: z
    text: 桎梏所以拘罪人者言犯罪而死與
  - page: 462
    col: 8
    role: z
    text: 立巖牆之下者同皆人所取非天所
  - page: 462
    col: 9
    role: z
    text: 爲也○此章與上章蓋一時之言所
  - page: 462
    col: 10
    role: z
    text: 以發其末句未盡之意
  - page: 462
    col: 11
    role: j
    text: 孟子曰求則得之舍則失之是求有益
  - page: 462
    col: 12
    role: j
    text: 於得也求在我者也
  - page: 462
    col: 13
    role: z
    text: 舍上聲○在我者謂仁義禮智凡性
  - page: 462
    col: 14
    role: z
    text: 之所有者
  - page: 462
    col: 15
    role: j
    text: 求之有道得之有命是求無益於得也
  - page: 462
    col: 16
    role: j
    text: 求在外者也
  - page: 463
    col: 1
    role: z
    text: 有道言不可妄求有命則不可必得
  - page: 463
    col: 2
    role: z
    text: 在外者謂富貴利達凡外物皆是○
  - page: 463
    col: 3
    role: z
    text: 趙氏曰言爲仁由己富貴在天如不
  - page: 463
    col: 4
    role: z
    text: 可求從吾所好
  - page: 463
    col: 5
    role: j
    text: 孟子曰萬物皆備於我矣
  - page: 463
    col: 6
    role: z
    text: 此言理之本然也大則君臣父子小
  - page: 463
    col: 7
    role: z
    text: 則事物細微其當然之理無一不具
  - page: 463
    col: 8
    role: z
    text: 於性分之内也
  - page: 463
    col: 9
    role: j
    text: 反身而誠樂莫大焉
  - page: 463
    col: 10
    role: z
    text: 樂音洛○誠實也言反諸身而所備
  - page: 463
    col: 11
    role: z
    text: 之理皆如惡惡臭好好色之實然則
  - page: 463
    col: 12
    role: z
    text: 其行之不待勉強而無不利矣其爲
  - page: 463
    col: 13
    role: z
    text: 樂孰大於是
  - page: 463
    col: 14
    role: j
    text: 強恕而行求仁莫近焉
  - page: 463
    col: 15
    role: z
    text: 強上聲○強勉強也恕推己以及人
  - page: 463
    col: 16
    role: z
    text: 也反身而誠則仁矣其有未誠則是
  - page: 464
    col: 1
    role: z
    text: 猶有私意之隔而理未純也故當凡
  - page: 464
    col: 2
    role: z
    text: 事勉強推己及人庶幾心公理得而
  - page: 464
    col: 3
    role: z
    text: 仁不遠也○此章言萬物之理具於
  - page: 464
    col: 4
    role: z
    text: 吾身體之而實則道在我而樂有餘
  - page: 464
    col: 5
    role: z
    text: 行之以恕則私不容而仁可得
  - page: 464
    col: 6
    role: j
    text: 孟子曰行之而不著焉習矣而不察焉
  - page: 464
    col: 7
    role: j
    text: 終身由之而不知其道者衆也
  - page: 464
    col: 8
    role: z
    text: 著者知之明察者識之精言方行之
  - page: 464
    col: 9
    role: z
    text: 而不能明其所當然既習矣而猶不
  - page: 464
    col: 10
    role: z
    text: 識其所以然所以終身由之而不知
  - page: 464
    col: 11
    role: z
    text: 其道者多也
  - page: 464
    col: 12
    role: j
    text: 孟子曰人不可以無恥無恥之恥無恥
  - page: 464
    col: 13
    role: j
    text: 矣
  - page: 464
    col: 14
    role: z
    text: 趙氏曰人能恥己之無所恥是能改
  - page: 464
    col: 15
    role: z
    text: 行從善之人終身無復有恥辱之累
  - page: 464
    col: 16
    role: j
    text: 矣
  - page: 465
    col: 1
    role: j
    text: 孟子曰恥之於人大矣
  - page: 465
    col: 2
    role: j
    text: 恥者吾所固有羞惡之心也存之則
  - page: 465
    col: 3
    role: j
    text: 進於聖賢失之則入於禽獸故所繫
  - page: 465
    col: 4
    role: z
    text: 為甚大
  - page: 465
    col: 5
    role: j
    text: 為機變之巧者無所用恥焉
  - page: 465
    col: 6
    role: j
    text: 為機械變詐之巧者所為之事皆人
  - page: 465
    col: 7
    role: j
    text: 所深恥而彼方且自以為得計故無
  - page: 465
    col: 8
    role: j
    text: 所用其愧恥之心也
  - page: 465
    col: 9
    role: j
    text: 不恥不若人何若人有
  - page: 465
    col: 10
    role: j
    text: 但無恥一事不如人則事事不如人
  - page: 465
    col: 11
    role: j
    text: 矣或曰不恥其不如人則何能有如
  - page: 465
    col: 12
    role: j
    text: 人之事其義亦通○或問人有恥不
  - page: 465
    col: 13
    role: j
    text: 能之心如何○程子曰恥其不能而
  - page: 465
    col: 14
    role: j
    text: 為之可也恥其不能而掩藏之不可
  - page: 465
    col: 15
    role: z
    text: 也
  - page: 465
    col: 16
    role: j
    text: 孟子曰古之賢王好善而忘勢古之賢
  - page: 466
    col: 1
    role: j
    text: 士何獨不然樂其道而忘人之勢故王
  - page: 466
    col: 2
    role: j
    text: 公不致敬盡禮則不得亟見之見且由
  - page: 466
    col: 3
    role: j
    text: 不得亟而況得而臣之乎
  - page: 466
    col: 4
    role: z
    text: 好去聲樂音洛亟去吏反○言君當
  - page: 466
    col: 5
    role: z
    text: 屈己以下賢士不枉道而求利二者
  - page: 466
    col: 6
    role: z
    text: 勢若相反而實則相成蓋亦各盡其
  - page: 466
    col: 7
    role: z
    text: 道而已
  - page: 466
    col: 8
    role: j
    text: 孟子謂宋句踐曰子好遊乎吾語子遊
  - page: 466
    col: 9
    role: z
    text: 句音鈎好語皆去聲○宋姓句踐名
  - page: 466
    col: 10
    role: z
    text: 遊遊說也
  - page: 466
    col: 11
    role: j
    text: 人知之亦囂囂人不知亦囂囂
  - page: 466
    col: 12
    role: z
    text: 趙氏曰囂囂自得無欲之貌
  - page: 466
    col: 13
    role: j
    text: 曰何如斯可以囂囂矣曰尊德樂義則
  - page: 466
    col: 14
    role: j
    text: 可以囂囂矣
  - page: 466
    col: 15
    role: z
    text: 樂音洛○德謂所得之善尊之則有
  - page: 466
    col: 16
    role: z
    text: 以自重而不慕乎人爵之榮義謂所
  - page: 467
    col: 1
    role: z
    text: 守之正樂之則有以自安而不徇乎
  - page: 467
    col: 2
    role: z
    text: 外物之誘也
  - page: 467
    col: 3
    role: j
    text: 故士窮不失義達不離道
  - page: 467
    col: 4
    role: z
    text: 離力智反○言不以貧賤而移不以
  - page: 467
    col: 5
    role: z
    text: 富貴而淫此尊德樂義見於行事之
  - page: 467
    col: 6
    role: z
    text: 實也
  - page: 467
    col: 7
    role: j
    text: 窮不失義故士得己焉達不離道故民
  - page: 467
    col: 8
    role: j
    text: 不失望焉
  - page: 467
    col: 9
    role: z
    text: 得己言不失己也民不失望言人素
  - page: 467
    col: 10
    role: z
    text: 望其興道致治而今果如所望也
  - page: 467
    col: 11
    role: j
    text: 古之人得志澤加於民不得志脩身見
  - page: 467
    col: 12
    role: j
    text: 於世窮則獨善其身達則兼善天下
  - page: 467
    col: 13
    role: z
    text: 見音現○見謂名實之顯著也此又
  - page: 467
    col: 14
    role: z
    text: 言士得己民不失望之實○此章言
  - page: 467
    col: 15
    role: z
    text: 內重而外輕則無往而不善
  - page: 467
    col: 16
    role: j
    text: 孟子曰待文王而後興者凡民也若夫
  - page: 468
    col: 1
    role: j
    text: 豪傑之士雖無文王猶興
  - page: 468
    col: 2
    role: z
    text: 夫音扶○興者感動奮發之意凡民
  - page: 468
    col: 3
    role: z
    text: 庸常之人也豪傑有過人之才知者
  - page: 468
    col: 4
    role: z
    text: 也蓋降衷秉彜人所同得唯上智之
  - page: 468
    col: 5
    role: z
    text: 資無物欲之蔽爲能無待於教而自
  - page: 468
    col: 6
    role: z
    text: 能感發以有爲也
  - page: 468
    col: 7
    role: j
    text: 孟子曰附之以韓魏之家如其自視欿
  - page: 468
    col: 8
    role: j
    text: 然則過人遠矣
  - page: 468
    col: 9
    role: z
    text: 欿音坎○附益也韓魏晉卿冨家也
  - page: 468
    col: 10
    role: z
    text: 欿然不自滿之意○尹氏曰言有過
  - page: 468
    col: 11
    role: z
    text: 人之識則不以冨貴爲事
  - page: 468
    col: 12
    role: j
    text: 孟子曰以佚道使民雖勞不怨以生道
  - page: 468
    col: 13
    role: j
    text: 殺民雖死不怨殺者
  - page: 468
    col: 14
    role: z
    text: 程子曰以佚道使民謂本欲佚之也
  - page: 468
    col: 15
    role: z
    text: 播穀乘屋之類是也以生道殺民謂
  - page: 468
    col: 16
    role: z
    text: 本欲生之也除害去惡之類是也蓋
  - page: 469
    col: 1
    role: z
    text: 不得已而爲其所當爲則雖咈民之
  - page: 469
    col: 2
    role: z
    text: 欲而民不怨其不然者反是
  - page: 469
    col: 3
    role: j
    text: 孟子曰霸者之民驩虞如也王者之民
  - page: 469
    col: 4
    role: j
    text: 皞皞如也
  - page: 469
    col: 5
    role: z
    text: 皞胡老反○驩虞與歡娛同皞皞廣
  - page: 469
    col: 6
    role: z
    text: 大自得之貌○程子曰驩虞有所造
  - page: 469
    col: 7
    role: z
    text: 爲而然豈能乆也耕田鑿井帝力何
  - page: 469
    col: 8
    role: z
    text: 有於我如天之自然乃王者之政○
  - page: 469
    col: 9
    role: z
    text: 楊氏曰所以致人驩虞必有違道干
  - page: 469
    col: 10
    role: z
    text: 譽之事若王者則如天亦不令人喜
  - page: 469
    col: 11
    role: z
    text: 亦不令人怒
  - page: 469
    col: 12
    role: j
    text: 殺之而不怨利之而不庸民日遷善而
  - page: 469
    col: 13
    role: j
    text: 不知爲之者
  - page: 469
    col: 14
    role: z
    text: 此所謂皞皞如也庸功也○豐氏曰
  - page: 469
    col: 15
    role: z
    text: 因民之所惡而去之非有心於殺之
  - page: 469
    col: 16
    role: z
    text: 也何怨之有因民之所利而利之非
  - page: 470
    col: 1
    role: z
    text: 有心於利之也何庸之有輔其性之
  - page: 470
    col: 2
    role: z
    text: 自然使自得之故民日遷善而不知
  - page: 470
    col: 3
    role: z
    text: 誰之所爲也
  - page: 470
    col: 4
    role: j
    text: 夫君子所過者化所存者神上下與天
  - page: 470
    col: 5
    role: j
    text: 地同流豈曰小補之哉
  - page: 470
    col: 6
    role: z
    text: 夫音扶○君子聖人之通稱也所過
  - page: 470
    col: 7
    role: z
    text: 者化身所經歷之處即人無不化如
  - page: 470
    col: 8
    role: z
    text: 舜之耕歷山而田者遜畔陶河濱而
  - page: 470
    col: 9
    role: z
    text: 器不苦窳也所存者神心所存主處
  - page: 470
    col: 10
    role: z
    text: 便神妙不測如孔子之立斯立道斯
  - page: 470
    col: 11
    role: z
    text: 行綏斯來動斯和莫知其所以然而
  - page: 470
    col: 12
    role: z
    text: 然也是其德業之盛乃與天地之化
  - page: 470
    col: 13
    role: z
    text: 同運並行舉一世而甄陶之非如霸
  - page: 470
    col: 14
    role: z
    text: 者但小小補塞其罅漏而已此則王
  - page: 470
    col: 15
    role: z
    text: 道之所以爲大而學者所當盡心也
  - page: 470
    col: 16
    role: j
    text: 孟子曰仁言不如仁聲之入人深也
  - page: 471
    col: 1
    role: j
    text: 程子曰仁言謂以仁厚之言加於民
  - page: 471
    col: 2
    role: j
    text: 仁聲謂仁聞謂有仁之實而爲衆所
  - page: 471
    col: 3
    role: j
    text: 稱道也此尤見仁德之昭著故其感
  - page: 471
    col: 4
    role: z
    text: 人尤深也
  - page: 471
    col: 5
    role: j
    text: 善政不如善教之得民也
  - page: 471
    col: 6
    role: z
    text: 政謂法度禁令所以制其外也教謂
  - page: 471
    col: 7
    role: z
    text: 道德齊禮所以格其心也
  - page: 471
    col: 8
    role: j
    text: 善政民畏之善教民愛之善政得民財
  - page: 471
    col: 9
    role: j
    text: 善教得民心
  - page: 471
    col: 10
    role: z
    text: 得民財者百姓足而君無不足也得
  - page: 471
    col: 11
    role: z
    text: 民心者不遺其親不後其君也
  - page: 471
    col: 12
    role: j
    text: 孟子曰人之所不學而能者其良能也
  - page: 471
    col: 13
    role: j
    text: 所不慮而知者其良知也
  - page: 471
    col: 14
    role: j
    text: 良者本然之善也○程子曰良知良
  - page: 471
    col: 15
    role: z
    text: 能皆無所由乃出於天不係於人
  - page: 471
    col: 16
    role: j
    text: 孩提之童無不知愛其親者及其長也
  - page: 472
    col: 1
    role: j
    text: 無不知敬其兄也
  - page: 472
    col: 2
    role: z
    text: 長上聲下同○孩提二三歲之間知
  - page: 472
    col: 3
    role: z
    text: 孩笑可提抱者也愛親敬長所謂良
  - page: 472
    col: 4
    role: z
    text: 知良能者也
  - page: 472
    col: 5
    role: j
    text: 親親仁也敬長義也無他達之天下也
  - page: 472
    col: 6
    role: z
    text: 言親親敬長雖一人之私然達之天
  - page: 472
    col: 7
    role: z
    text: 下無不同者所以爲仁義也
  - page: 472
    col: 8
    role: j
    text: 孟子曰舜之居深山之中與木石居與
  - page: 472
    col: 9
    role: j
    text: 鹿豕遊其所以異於深山之野人者幾
  - page: 472
    col: 10
    role: j
    text: 希及其聞一善言見一善行若決江河
  - page: 472
    col: 11
    role: j
    text: 沛然莫之能禦也
  - page: 472
    col: 12
    role: z
    text: 行去聲○居深山謂耕歷山時蓋
  - page: 472
    col: 13
    role: z
    text: 聖人之心至虛至明渾然之中萬理
  - page: 472
    col: 14
    role: z
    text: 畢具一有感觸則其應甚速而無所
  - page: 472
    col: 15
    role: z
    text: 不通非孟子造道之深不能形容至
  - page: 472
    col: 16
    role: z
    text: 此也
  - page: 473
    col: 1
    role: j
    text: 孟子曰無爲其所不爲無欲其所不欲
  - page: 473
    col: 2
    role: j
    text: 如此而巳矣
  - page: 473
    col: 3
    role: z
    text: 李氏曰有所不爲不欲人皆有是心
  - page: 473
    col: 4
    role: z
    text: 也至於私意一萌而不能以禮義制
  - page: 473
    col: 5
    role: z
    text: 之則爲所不爲欲所不欲者多矣能
  - page: 473
    col: 6
    role: z
    text: 反是心則所謂擴充其羞惡之心者
  - page: 473
    col: 7
    role: z
    text: 而義不可勝用矣故曰如此而巳矣
  - page: 473
    col: 8
    role: j
    text: 孟子曰人之有德慧術知者恆存乎疢
  - page: 473
    col: 9
    role: j
    text: 疾
  - page: 473
    col: 10
    role: z
    text: 知去聲疢丑刃反○德慧者德之慧
  - page: 473
    col: 11
    role: z
    text: 術知者術之知疢疾猶災患也言人
  - page: 473
    col: 12
    role: z
    text: 必有疢疾則能動心忍性增益其所
  - page: 473
    col: 13
    role: z
    text: 不能也
  - page: 473
    col: 14
    role: j
    text: 獨孤臣孽子其操心也危其慮患也深
  - page: 473
    col: 15
    role: j
    text: 故達
  - page: 473
    col: 16
    role: z
    text: 孤臣遠臣孽子庶子皆不得於君親
  - page: 474
    col: 1
    role: z
    text: 而常有疢疾者也達謂達於事理即
  - page: 474
    col: 2
    role: z
    text: 所謂德慧術知也
  - page: 474
    col: 3
    role: j
    text: 孟子曰有事君人者事是君則爲容悅
  - page: 474
    col: 4
    role: j
    text: 者也
  - page: 474
    col: 5
    role: z
    text: 阿徇以爲容逢迎以爲悅此鄙夫之
  - page: 474
    col: 6
    role: z
    text: 事妾婦之道也
  - page: 474
    col: 7
    role: j
    text: 有安社稷臣者以安社稷爲悅者也
  - page: 474
    col: 8
    role: z
    text: 言大臣之計安社稷如小人之務悅
  - page: 474
    col: 9
    role: z
    text: 其君眷眷於此而不忘也
  - page: 474
    col: 10
    role: j
    text: 有天民者達可行於天下而後行之者
  - page: 474
    col: 11
    role: j
    text: 也
  - page: 474
    col: 12
    role: z
    text: 民者無位之稱以其全盡天理乃天
  - page: 474
    col: 13
    role: z
    text: 之民故謂之天民必其道可行於天
  - page: 474
    col: 14
    role: z
    text: 下然後行之不然則寧没世不見知
  - page: 474
    col: 15
    role: z
    text: 而不悔不肯小用其道以徇於人也
  - page: 474
    col: 16
    role: z
    text: ○張子曰必功覆斯民然後出如伊
  - page: 475
    col: 1
    role: j
    text: 吕之徒
  - page: 475
    col: 2
    role: j
    text: 有大人者正己而物正者也
  - page: 475
    col: 3
    role: j
    text: 大人德盛而上下化之所謂見龍在
  - page: 475
    col: 4
    role: j
    text: 田天下文明者○此章言人品不同
  - page: 475
    col: 5
    role: j
    text: 略有四等容悅佞臣不足言安社稷
  - page: 475
    col: 6
    role: j
    text: 則忠矣然猶一國之士也天民則非
  - page: 475
    col: 7
    role: j
    text: 一國之士矣然猶有意也無意無必
  - page: 475
    col: 8
    role: j
    text: 唯其所在而物無不化惟聖者能之
  - page: 475
    col: 9
    role: j
    text: 孟子曰君子有三樂而王天下不與存
  - page: 475
    col: 10
    role: j
    text: 焉
  - page: 475
    col: 11
    role: z
    text: 樂音洛王與皆去聲下並同
  - page: 475
    col: 12
    role: j
    text: 父母俱存兄弟無故一樂也
  - page: 475
    col: 13
    role: z
    text: 此人所深願而不可必得者今既得
  - page: 475
    col: 14
    role: z
    text: 之其樂可知
  - page: 475
    col: 15
    role: j
    text: 仰不愧於天俯不怍於人二樂也
  - page: 475
    col: 16
    role: z
    text: 程子曰人能克己則仰不愧俯不怍
  - page: 476
    col: 1
    role: z
    text: 心廣體胖其樂可知有息則餒矣
  - page: 476
    col: 2
    role: j
    text: 得天下英才而教育之三樂也
  - page: 476
    col: 3
    role: z
    text: 盡得一世明睿之才而以所樂乎己
  - page: 476
    col: 4
    role: z
    text: 者教養之則斯道之傳得之者衆
  - page: 476
    col: 5
    role: z
    text: 而天下後世將無不被其澤矣聖人
  - page: 476
    col: 6
    role: z
    text: 之心所願欲者莫大於此今旣得之
  - page: 476
    col: 7
    role: z
    text: 其樂爲如何哉
  - page: 476
    col: 8
    role: j
    text: 君子有三樂而王天下不與存焉
  - page: 476
    col: 9
    role: z
    text: 林氏曰此三樂者一係於天一係於
  - page: 476
    col: 10
    role: z
    text: 人其可以自致者惟不愧不怍而已
  - page: 476
    col: 11
    role: z
    text: 學者可不勉哉
  - page: 476
    col: 12
    role: j
    text: 孟子曰廣土衆民君子欲之所樂不存
  - page: 476
    col: 13
    role: j
    text: 焉
  - page: 476
    col: 14
    role: z
    text: 樂音洛下同○地闢民聚澤可遠施
  - page: 476
    col: 15
    role: z
    text: 故君子欲之然未足以爲樂也
  - page: 476
    col: 16
    role: j
    text: 中天下而立定四海之民君子樂之所
  - page: 477
    col: 1
    role: j
    text: 性不存焉
  - page: 477
    col: 2
    role: z
    text: 其道大行無一夫不被其澤故君子
  - page: 477
    col: 3
    role: z
    text: 樂之然其所得於天者則不在是也
  - page: 477
    col: 4
    role: j
    text: 君子所性雖大行不加焉雖窮居不損
  - page: 477
    col: 5
    role: j
    text: 焉分定故也
  - page: 477
    col: 6
    role: z
    text: 分去聲○分者所得於天之全體故
  - page: 477
    col: 7
    role: z
    text: 不以窮達而有異
  - page: 477
    col: 8
    role: j
    text: 君子所性仁義禮智根於心其生色也
  - page: 477
    col: 9
    role: j
    text: 睟然見於面盎於背施於四體四體不
  - page: 477
    col: 10
    role: j
    text: 言而喻
  - page: 477
    col: 11
    role: z
    text: 睟音粹見音現盎烏浪反○上言所
  - page: 477
    col: 12
    role: z
    text: 性之分與所欲所樂不同此乃言其
  - page: 477
    col: 13
    role: z
    text: 蘊也仁義禮智性之四德也根本也
  - page: 477
    col: 14
    role: z
    text: 生發見也睟然清和潤澤之貌盎豐
  - page: 477
    col: 15
    role: z
    text: 厚盈溢之意施於四體謂見於動作
  - page: 477
    col: 16
    role: z
    text: 威儀之間也喻曉也四體不言而喻
  - page: 478
    col: 1
    role: z
    text: 言四體不待吾言而自能曉吾意也
  - page: 478
    col: 2
    role: z
    text: 蓋氣禀清明無物欲之累則性之四
  - page: 478
    col: 3
    role: z
    text: 德根本於心其積之盛則發而著見
  - page: 478
    col: 4
    role: z
    text: 於外者不待言而無不順也○程子
  - page: 478
    col: 5
    role: z
    text: 曰睟靣盎背皆積盛致然四體不言
  - page: 478
    col: 6
    role: z
    text: 而喻惟有德者能之○此章言君子
  - page: 478
    col: 7
    role: j
    text: 固欲其道之大行然其所得於天者
  - page: 478
    col: 8
    role: z
    text: 則不以是而有所加損也
  - page: 478
    col: 9
    role: j
    text: 孟子曰伯夷辟紂居東海之濱聞文王
  - page: 478
    col: 10
    role: j
    text: 作興曰盍歸乎來吾聞西伯善養老者
  - page: 478
    col: 11
    role: j
    text: 大公辟紂居東海之濱聞文王作興曰
  - page: 478
    col: 12
    role: j
    text: 盍歸乎來吾聞西伯善養老者天下有
  - page: 478
    col: 13
    role: j
    text: 善養老則仁人以爲巳歸矣
  - page: 478
    col: 14
    role: z
    text: 辟去聲下同大他盖反○巳歸謂巳
  - page: 478
    col: 15
    role: z
    text: 之所歸餘見前篇
  - page: 478
    col: 16
    role: j
    text: 五畒之宅樹牆下以桑匹婦蠶之則老
  - page: 479
    col: 1
    role: j
    text: 者足以衣帛矣五母雞二母彘無失其
  - page: 479
    col: 2
    role: j
    text: 時老者足以無失肉矣百畝之田匹夫
  - page: 479
    col: 3
    role: j
    text: 耕之八口之家足以無飢矣
  - page: 479
    col: 4
    role: z
    text: 衣去聲○此文王之政也一家養母
  - page: 479
    col: 5
    role: z
    text: 雞五母彘二也餘見前篇
  - page: 479
    col: 6
    role: j
    text: 所謂西伯善養老者制其田里教之樹
  - page: 479
    col: 7
    role: j
    text: 畜導其妻子使養其老五十非帛不煖
  - page: 479
    col: 8
    role: j
    text: 七十非肉不飽不煖不飽謂之凍餒文
  - page: 479
    col: 9
    role: j
    text: 王之民無凍餒之老者此之謂也
  - page: 479
    col: 10
    role: z
    text: 田謂百畝之田里謂五畝之宅樹謂
  - page: 479
    col: 11
    role: z
    text: 耕桑畜謂雞彘也○趙氏曰善養老
  - page: 479
    col: 12
    role: z
    text: 者教導之使可以養其老耳非家賜
  - page: 479
    col: 13
    role: z
    text: 而人益之也
  - page: 479
    col: 14
    role: j
    text: 孟子曰易其田疇薄其稅歛民可使富
  - page: 479
    col: 15
    role: j
    text: 也
  - page: 479
    col: 16
    role: z
    text: 易歛皆去聲○易治也疇耕治之田
  - page: 480
    col: 1
    role: j
    text: 也
  - page: 480
    col: 2
    role: j
    text: 食之以時用之以禮財不可勝用也
  - page: 480
    col: 3
    role: z
    text: 勝音升○教民節儉則財用足也
  - page: 480
    col: 4
    role: j
    text: 民非水火不生活昏暮叩人之門户求
  - page: 480
    col: 5
    role: j
    text: 水火無弗與者至足矣聖人治天下使
  - page: 480
    col: 6
    role: j
    text: 有菽粟如水火菽粟如水火而民焉有
  - page: 480
    col: 7
    role: j
    text: 不仁者乎
  - page: 480
    col: 8
    role: z
    text: 焉於虔反○水火民之所急宜其愛
  - page: 480
    col: 9
    role: z
    text: 之而反不愛者多故也○尹氏曰言
  - page: 480
    col: 10
    role: z
    text: 禮義生於富足民無常産則無常心
  - page: 480
    col: 11
    role: z
    text: 矣
  - page: 480
    col: 12
    role: j
    text: 孟子曰孔子登東山而小魯登太山而
  - page: 480
    col: 13
    role: j
    text: 小天下故觀於海者難爲水遊於聖人
  - page: 480
    col: 14
    role: j
    text: 之門者難爲言
  - page: 480
    col: 15
    role: z
    text: 此言聖人之道大也東山蓋魯城東
  - page: 480
    col: 16
    role: z
    text: 之髙山而太山則又髙矣此言所處
  - page: 481
    col: 1
    role: z
    text: 益高則其視下益小所見旣大則其
  - page: 481
    col: 2
    role: z
    text: 小者不足觀也難爲水難爲言猶仁
  - page: 481
    col: 3
    role: z
    text: 不可爲衆之意
  - page: 481
    col: 4
    role: j
    text: 觀水有術必觀其瀾日月有明容光必
  - page: 481
    col: 5
    role: j
    text: 照焉
  - page: 481
    col: 6
    role: z
    text: 此言道之有本也瀾水之湍急處也
  - page: 481
    col: 7
    role: z
    text: 明者光之體光者明之用也觀水之
  - page: 481
    col: 8
    role: z
    text: 瀾則知其源之有本矣觀日月於容
  - page: 481
    col: 9
    role: z
    text: 光之隙無不照則知其明之有本矣
  - page: 481
    col: 10
    role: j
    text: 流水之爲物也不盈科不行君子之志
  - page: 481
    col: 11
    role: j
    text: 於道也不成章不達
  - page: 481
    col: 12
    role: z
    text: 言學當以漸乃能至也成章所積者
  - page: 481
    col: 13
    role: z
    text: 厚而文章外見也達者足於此而通
  - page: 481
    col: 14
    role: z
    text: 於彼也○此章言聖人之道大而有
  - page: 481
    col: 15
    role: z
    text: 本學之者必以其漸乃能至也
  - page: 481
    col: 16
    role: j
    text: 孟子曰雞鳴而起孳孳爲善者舜之徒
  - page: 482
    col: 1
    role: j
    text: 也
  - page: 482
    col: 2
    role: j
    text: 孳孳勤勉之意言雖未至於聖人亦
  - page: 482
    col: 3
    role: z
    text: 是聖人之徒也
  - page: 482
    col: 4
    role: j
    text: 雞鳴而起孳孳爲利者蹠之徒也
  - page: 482
    col: 5
    role: z
    text: 蹠盜蹠也
  - page: 482
    col: 6
    role: j
    text: 欲知舜與蹠之分無他利與善之間也
  - page: 482
    col: 7
    role: j
    text: 程子曰言間者謂相去不遠所爭毫
  - page: 482
    col: 8
    role: j
    text: 末耳善與利公私而已矣才出於善
  - page: 482
    col: 9
    role: j
    text: 便以利言也○楊氏曰舜蹠之相去
  - page: 482
    col: 10
    role: j
    text: 遠矣而其分乃在利善之間而已是
  - page: 482
    col: 11
    role: j
    text: 豈可以不謹然講之不熟見之不明
  - page: 482
    col: 12
    role: j
    text: 未有不以利爲義者又學者所當深
  - page: 482
    col: 13
    role: j
    text: 察也或問雞鳴而起若未接物如何
  - page: 482
    col: 14
    role: z
    text: 爲善○程子曰只主於敬便是爲善
  - page: 482
    col: 15
    role: j
    text: 孟子曰楊子取爲我拔一毛而利天下
  - page: 482
    col: 16
    role: j
    text: 不爲也
  - page: 483
    col: 1
    role: j
    text: 爲我之爲去聲○楊子名朱取者僅
  - page: 483
    col: 2
    role: j
    text: 足之意取爲我者僅足於爲我而已
  - page: 483
    col: 3
    role: j
    text: 不及爲人也列子稱其言曰伯成子
  - page: 483
    col: 4
    role: j
    text: 高不以一毫利物是也
  - page: 483
    col: 5
    role: j
    text: 墨子兼愛摩頂放踵利天下爲之
  - page: 483
    col: 6
    role: j
    text: 放上聲○墨子名翟兼愛無所不愛
  - page: 483
    col: 7
    role: j
    text: 也摩頂摩突其頂也放至也
  - page: 483
    col: 8
    role: j
    text: 子莫執中執中爲近之執中無權猶執
  - page: 483
    col: 9
    role: j
    text: 一也
  - page: 483
    col: 10
    role: j
    text: 子莫魯之賢人也知楊墨之失中也
  - page: 483
    col: 11
    role: j
    text: 故度於二者之間而執其中近近道
  - page: 483
    col: 12
    role: j
    text: 也權稱錘也所以稱物之輕重而取
  - page: 483
    col: 13
    role: j
    text: 中也執中而無權則膠於一定之中
  - page: 483
    col: 14
    role: j
    text: 而不知變是亦執一而已矣○程子
  - page: 483
    col: 15
    role: j
    text: 曰中字最難識須是默識心通且試
  - page: 483
    col: 16
    role: j
    text: 言一廳則中央爲中一家則廳非中
  - page: 484
    col: 1
    role: z
    text: 而堂為中一國則堂非中而國之中
  - page: 484
    col: 2
    role: z
    text: 為中推此類可見矣又曰中不可執
  - page: 484
    col: 3
    role: z
    text: 也識得則事事物物皆有自然之中
  - page: 484
    col: 4
    role: z
    text: 不待安排安排著則不中矣
  - page: 484
    col: 5
    role: j
    text: 所惡執一者為其賊道也舉一而廢百
  - page: 484
    col: 6
    role: j
    text: 也
  - page: 484
    col: 7
    role: z
    text: 惡為皆去聲○賊害也為我害仁兼
  - page: 484
    col: 8
    role: z
    text: 愛害義執中者害於時中皆舉一而
  - page: 484
    col: 9
    role: z
    text: 廢百者也○此章言道之所貴者中
  - page: 484
    col: 10
    role: z
    text: 中之所貴者權○楊氏曰禹稷三過
  - page: 484
    col: 11
    role: z
    text: 其門而不入苟不當其可則與墨子
  - page: 484
    col: 12
    role: z
    text: 無異顏子在陋巷不改其樂苟不當
  - page: 484
    col: 13
    role: z
    text: 其可則與楊氏無異子莫執為我兼
  - page: 484
    col: 14
    role: z
    text: 愛之中而無權鄉鄰有鬬而不知閉
  - page: 484
    col: 15
    role: z
    text: 戶同室有鬬而不知救之是亦猶執
  - page: 484
    col: 16
    role: z
    text: 一耳故孟子以為賊道禹稷顏回易
  - page: 485
    col: 1
    role: z
    text: 地則皆然以其有權也不然則是亦
  - page: 485
    col: 2
    role: z
    text: 楊墨而已矣
  - page: 485
    col: 3
    role: j
    text: 孟子曰飢者甘食渴者甘飲是未得飲
  - page: 485
    col: 4
    role: j
    text: 食之正也飢渴害之也豈惟口腹有飢
  - page: 485
    col: 5
    role: j
    text: 渴之害人心亦皆有害
  - page: 485
    col: 6
    role: z
    text: 口腹爲飢渴所害故於飲食不暇擇
  - page: 485
    col: 7
    role: z
    text: 而失其正味人心爲貧賤所害故於
  - page: 485
    col: 8
    role: z
    text: 冨貴不暇擇而失其正理
  - page: 485
    col: 9
    role: j
    text: 人能無以飢渴之害爲心害則不及人
  - page: 485
    col: 10
    role: j
    text: 不爲憂矣
  - page: 485
    col: 11
    role: z
    text: 人能不以貧賤之故而動其心則過
  - page: 485
    col: 12
    role: z
    text: 人逺矣
  - page: 485
    col: 13
    role: j
    text: 孟子曰柳下惠不以三公易其介
  - page: 485
    col: 14
    role: z
    text: 介有分辨之意柳下惠進不隱賢必
  - page: 485
    col: 15
    role: z
    text: 以其道遺佚不怨阨窮不憫直道事
  - page: 485
    col: 16
    role: z
    text: 人至於三黜是其介也○此章言柳
  - page: 486
    col: 1
    role: z
    text: 下惠和而不流與孔子論夷齊不念
  - page: 486
    col: 2
    role: z
    text: 舊惡意正相類皆聖賢微顯闡幽之
  - page: 486
    col: 3
    role: z
    text: 意也
  - page: 486
    col: 4
    role: j
    text: 孟子曰有為者辟若掘井掘井九軔而
  - page: 486
    col: 5
    role: j
    text: 不及泉猶為棄井也
  - page: 486
    col: 6
    role: z
    text: 辟讀作譬軔音刃與仞同○八尺為
  - page: 486
    col: 7
    role: z
    text: 仞言鑿井雖深然未及泉而止猶為
  - page: 486
    col: 8
    role: z
    text: 自棄其井也○吕侍講曰仁不如堯
  - page: 486
    col: 9
    role: z
    text: 孝不如舜學不如孔子終未入於聖
  - page: 486
    col: 10
    role: z
    text: 人之域終未至於天道未免為半塗
  - page: 486
    col: 11
    role: z
    text: 而廢自棄前功也
  - page: 486
    col: 12
    role: j
    text: 孟子曰堯舜性之也湯武身之也五霸
  - page: 486
    col: 13
    role: j
    text: 假之也
  - page: 486
    col: 14
    role: z
    text: 堯舜天性渾全不假修習湯武脩身
  - page: 486
    col: 15
    role: z
    text: 體道以復其性五霸則假借仁義之
  - page: 486
    col: 16
    role: z
    text: 名以求濟其貪欲之私耳
  - page: 487
    col: 1
    role: j
    text: 乆假而不歸惡知其非有也
  - page: 487
    col: 2
    role: z
    text: 惡平聲○歸還也有實有也言竊其
  - page: 487
    col: 3
    role: z
    text: 名以終身而不自知其非眞有或曰
  - page: 487
    col: 4
    role: z
    text: 蓋歎世人莫覺其僞者亦通舊說乆
  - page: 487
    col: 5
    role: z
    text: 假不歸即爲眞有則誤矣○尹氏曰
  - page: 487
    col: 6
    role: z
    text: 性之者與道一也身之者履之也及
  - page: 487
    col: 7
    role: z
    text: 其成功則一也五霸則假之而已是
  - page: 487
    col: 8
    role: z
    text: 以功烈如彼其卑也
  - page: 487
    col: 9
    role: j
    text: 公孫丑曰伊尹曰予不狎于不順放太
  - page: 487
    col: 10
    role: j
    text: 甲于桐民大悅太甲賢又反之民大悅
  - page: 487
    col: 11
    role: z
    text: 予不狎于不順商書太甲篇文狎習
  - page: 487
    col: 12
    role: z
    text: 見也不順言太甲所爲不順義理也
  - page: 487
    col: 13
    role: z
    text: 餘見前篇
  - page: 487
    col: 14
    role: j
    text: 賢者之爲人臣也其君不賢則固可放
  - page: 487
    col: 15
    role: j
    text: 與
  - page: 487
    col: 16
    role: z
    text: 與平聲
  - page: 488
    col: 1
    role: j
    text: 孟子曰有伊尹之志則可無伊尹之志
  - page: 488
    col: 2
    role: j
    text: 則篡也
  - page: 488
    col: 3
    role: z
    text: 伊尹之志公天下以爲心而無一毫
  - page: 488
    col: 4
    role: z
    text: 之私者也
  - page: 488
    col: 5
    role: j
    text: 公孫丑曰詩曰不素餐兮君子之不耕
  - page: 488
    col: 6
    role: j
    text: 而食何也孟子曰君子居是國也其君
  - page: 488
    col: 7
    role: j
    text: 用之則安富尊榮其子弟從之則孝弟
  - page: 488
    col: 8
    role: j
    text: 忠信不素餐兮孰大於是
  - page: 488
    col: 9
    role: z
    text: 餐七丹反○詩魏國風伐檀之篇素
  - page: 488
    col: 10
    role: z
    text: 空也無功而食祿謂之素餐此與告
  - page: 488
    col: 11
    role: z
    text: 陳相彭更之意同
  - page: 488
    col: 12
    role: j
    text: 王子墊問曰士何事
  - page: 488
    col: 13
    role: z
    text: 墊丁念反○墊齊王之子也上則公
  - page: 488
    col: 14
    role: z
    text: 卿大夫下則農工商賈皆有所事而
  - page: 488
    col: 15
    role: z
    text: 士居其間獨無所事故王子問之也
  - page: 488
    col: 16
    role: j
    text: 孟子曰尚志
  - page: 489
    col: 1
    role: z
    text: 尚高尚也志者心之之也士既未
  - page: 489
    col: 2
    role: z
    text: 得行公卿大夫之道又不當爲農工
  - page: 489
    col: 3
    role: z
    text: 商賈之業則高尚其志而已
  - page: 489
    col: 4
    role: j
    text: 曰何謂尚志曰仁義而已矣殺一無罪
  - page: 489
    col: 5
    role: j
    text: 非仁也非其有而取之非義也居惡在
  - page: 489
    col: 6
    role: j
    text: 仁是也路惡在義是也居仁由義大人
  - page: 489
    col: 7
    role: j
    text: 之事備矣
  - page: 489
    col: 8
    role: z
    text: 惡平聲○非仁非義之事雖小不爲
  - page: 489
    col: 9
    role: z
    text: 而所居所由無不在於仁義此士所
  - page: 489
    col: 10
    role: z
    text: 以尚其志也大人謂公卿大夫言士
  - page: 489
    col: 11
    role: z
    text: 雖未得大人之位而其志如此則大
  - page: 489
    col: 12
    role: z
    text: 人之事體用已全若小人之事則固
  - page: 489
    col: 13
    role: z
    text: 非所當爲也
  - page: 489
    col: 14
    role: j
    text: 孟子曰仲子不義與之齊國而弗受人
  - page: 489
    col: 15
    role: j
    text: 皆信之是舍簞食豆羹之義也人莫大
  - page: 489
    col: 16
    role: j
    text: 焉亡親戚君臣上下以其小者信其大
  - page: 490
    col: 1
    role: j
    text: 者奚可哉
  - page: 490
    col: 2
    role: z
    text: 舎音捨食音嗣○仲子陳仲子也言
  - page: 490
    col: 3
    role: z
    text: 仲子設若非義而與之齊國必不肯
  - page: 490
    col: 4
    role: z
    text: 受齊人皆信其賢然此但小廉耳其
  - page: 490
    col: 5
    role: z
    text: 辟兄離母不食禄無人道之大倫
  - page: 490
    col: 6
    role: z
    text: 罪莫大焉豈可以小廉信其大節而
  - page: 490
    col: 7
    role: z
    text: 遂以爲賢哉
  - page: 490
    col: 8
    role: j
    text: 桃應問曰舜爲天子皐陶爲士瞽瞍殺
  - page: 490
    col: 9
    role: j
    text: 人則如之何
  - page: 490
    col: 10
    role: z
    text: 桃應孟子弟子也其意以爲舜雖愛
  - page: 490
    col: 11
    role: z
    text: 父而不可以私害公皐陶雖執法而
  - page: 490
    col: 12
    role: z
    text: 不可以刑天子之父故設此問以觀
  - page: 490
    col: 13
    role: z
    text: 聖賢用心之所極非以爲眞有此事
  - page: 490
    col: 14
    role: z
    text: 也
  - page: 490
    col: 15
    role: j
    text: 孟子曰執之而已矣
  - page: 490
    col: 16
    role: z
    text: 言皐陶之心知有法而已不知有天
  - page: 491
    col: 1
    role: z
    text: 子之父也
  - page: 491
    col: 2
    role: j
    text: 然則舜不禁與
  - page: 491
    col: 3
    role: z
    text: 與平聲○桃應問也
  - page: 491
    col: 4
    role: j
    text: 曰夫舜惡得而禁之夫有所受之也
  - page: 491
    col: 5
    role: z
    text: 夫音扶惡平聲○言臯陶之法有所
  - page: 491
    col: 6
    role: z
    text: 傳受非所敢私雖天子之命亦不得
  - page: 491
    col: 7
    role: z
    text: 而廢之也
  - page: 491
    col: 8
    role: j
    text: 然則舜如之何
  - page: 491
    col: 9
    role: z
    text: 桃應問也
  - page: 491
    col: 10
    role: j
    text: 曰舜視天下猶棄敝蹤也竊負而逃
  - page: 491
    col: 11
    role: j
    text: 遵海濵而處終身訢然樂而忘天下
  - page: 491
    col: 12
    role: z
    text: 蹤音徙訢與欣同樂音洛○蹤草履
  - page: 491
    col: 13
    role: z
    text: 也遵循也言舜之心知有父而已不
  - page: 491
    col: 14
    role: z
    text: 知有天下也孟子甞言舜視天下猶
  - page: 491
    col: 15
    role: z
    text: 草芥而惟順於父母可以解憂與此
  - page: 491
    col: 16
    role: z
    text: 意互相發○此章言爲士者但知有
  - page: 492
    col: 1
    role: j
    text: 法而不知天子父之爲尊爲子者但
  - page: 492
    col: 2
    role: j
    text: 知有父而不知天下之爲大蓋其所
  - page: 492
    col: 3
    role: j
    text: 以爲心者莫非天理之極人倫之至
  - page: 492
    col: 4
    role: j
    text: 學者察此而有得焉則不待較計論
  - page: 492
    col: 5
    role: z
    text: 量而天下無難處之事矣
  - page: 492
    col: 6
    role: j
    text: 孟子自范之齊望見齊王之子喟然歎
  - page: 492
    col: 7
    role: j
    text: 曰居移氣養移體大哉居乎夫非盡人
  - page: 492
    col: 8
    role: j
    text: 之子與
  - page: 492
    col: 9
    role: j
    text: 夫音扶與平聲○范齊邑居謂所處
  - page: 492
    col: 10
    role: j
    text: 之位養奉養也言人之居處所繫甚
  - page: 492
    col: 11
    role: j
    text: 大王子亦人子耳特以所居不同故
  - page: 492
    col: 12
    role: j
    text: 所養不同而其氣體有異也
  - page: 492
    col: 13
    role: j
    text: 孟子曰
  - page: 492
    col: 14
    role: z
    text: 張鄒皆云羡文也
  - page: 492
    col: 15
    role: j
    text: 王子宫室車馬衣服多與人同而王子
  - page: 492
    col: 16
    role: j
    text: 若彼者其居使之然也况居天下之廣
  - page: 493
    col: 1
    role: j
    text: 居者平
  - page: 493
    col: 2
    role: z
    text: 廣居見前篇○尹氏曰睟然見於靣
  - page: 493
    col: 3
    role: z
    text: 盎於背居天下之廣居者然也
  - page: 493
    col: 4
    role: j
    text: 魯君之宋呼於垤澤之門守者曰此非
  - page: 493
    col: 5
    role: j
    text: 吾君也何其聲之似我君也此無他居
  - page: 493
    col: 6
    role: j
    text: 相似也
  - page: 493
    col: 7
    role: z
    text: 呼去聲○垤澤宋城門名也孟子又
  - page: 493
    col: 8
    role: z
    text: 引此事爲證
  - page: 493
    col: 9
    role: j
    text: 孟子曰食而弗愛豕交之也愛而不敬
  - page: 493
    col: 10
    role: j
    text: 獸畜之也
  - page: 493
    col: 11
    role: z
    text: 食音嗣畜許六反○交接也畜養也
  - page: 493
    col: 12
    role: z
    text: 獸謂犬馬之屬
  - page: 493
    col: 13
    role: j
    text: 恭敬者幣之未將者也
  - page: 493
    col: 14
    role: z
    text: 將猶奉也詩曰承箱是將○程子曰
  - page: 493
    col: 15
    role: z
    text: 恭敬雖因威儀幣帛而後發見然幣
  - page: 493
    col: 16
    role: z
    text: 之未將時巳有此恭敬之心非因幣
  - page: 494
    col: 1
    role: z
    text: 帛而後有也
  - page: 494
    col: 2
    role: j
    text: 恭敬而無實君子不可虚拘
  - page: 494
    col: 3
    role: j
    text: 此言當時諸侯之待賢者特以幣帛
  - page: 494
    col: 4
    role: z
    text: 爲恭敬而無其實也拘留也
  - page: 494
    col: 5
    role: j
    text: 孟子曰形色天性也惟聖人然後可以
  - page: 494
    col: 6
    role: j
    text: 踐形
  - page: 494
    col: 7
    role: z
    text: 人之有形有色無不各有自然之理
  - page: 494
    col: 8
    role: z
    text: 所謂天性也踐如踐言之踐蓋衆人
  - page: 494
    col: 9
    role: z
    text: 有是形而不能盡其理故無以踐其
  - page: 494
    col: 10
    role: z
    text: 形惟聖人有是形而又能盡其理然
  - page: 494
    col: 11
    role: z
    text: 後可以踐其形而無歉也○程子曰
  - page: 494
    col: 12
    role: z
    text: 此言聖人盡得人道而能充其形也
  - page: 494
    col: 13
    role: z
    text: 蓋人得天地之正氣而生與萬物不
  - page: 494
    col: 14
    role: z
    text: 同既爲人須盡得人理然後稱其名
  - page: 494
    col: 15
    role: z
    text: 衆人有之而不知賢人踐之而未盡
  - page: 494
    col: 16
    role: z
    text: 能充其形惟聖人也○楊氏曰天生
  - page: 495
    col: 1
    role: z
    text: 烝民有物有則物者形色也則者性
  - page: 495
    col: 2
    role: z
    text: 也各盡其則則可以踐形矣
  - page: 495
    col: 3
    role: j
    text: 齊宣王欲短喪公孫丑曰爲朞之喪猶
  - page: 495
    col: 4
    role: j
    text: 愈於已乎
  - page: 495
    col: 5
    role: z
    text: 已猶止也
  - page: 495
    col: 6
    role: j
    text: 孟子曰是猶或紾其兄之臂子謂之姑
  - page: 495
    col: 7
    role: j
    text: 徐徐云爾亦教之孝弟而已矣
  - page: 495
    col: 8
    role: z
    text: 紾之忍反○紾戾也教之以孝弟之
  - page: 495
    col: 9
    role: z
    text: 道則彼當自知兄之不可戾而喪之
  - page: 495
    col: 10
    role: z
    text: 不可短矣○孔子曰子生三年然後
  - page: 495
    col: 11
    role: z
    text: 免於父母之懷予也有三年之愛於
  - page: 495
    col: 12
    role: z
    text: 其父母乎所謂教之以孝弟者如此
  - page: 495
    col: 13
    role: z
    text: 蓋示之以至情之不能已者非強之
  - page: 495
    col: 14
    role: z
    text: 也
  - page: 495
    col: 15
    role: j
    text: 王子有其母死者其傅爲之請數月之
  - page: 495
    col: 16
    role: j
    text: 喪公孫丑曰若此者何如也
  - page: 496
    col: 1
    role: z
    text: 為去聲○陳氏曰王子所生之母死
  - page: 496
    col: 2
    role: z
    text: 厭於嫡母而不敢終喪其傅為請於
  - page: 496
    col: 3
    role: z
    text: 王欲使得行數月之喪也時又適有
  - page: 496
    col: 4
    role: z
    text: 此事丑問如此者是非何如按儀禮
  - page: 496
    col: 5
    role: z
    text: 公子為其母練冠麻衣縓緣既葬除
  - page: 496
    col: 6
    role: z
    text: 之疑當時此禮已廢或既葬而未忍
  - page: 496
    col: 7
    role: z
    text: 即除故請之也
  - page: 496
    col: 8
    role: j
    text: 曰是欲終之而不可得也雖加一日愈
  - page: 496
    col: 9
    role: j
    text: 於已謂夫莫之禁而弗為者也
  - page: 496
    col: 10
    role: z
    text: 夫音扶○言王子欲終喪而不可得
  - page: 496
    col: 11
    role: z
    text: 其傅為請雖止得加一日猶勝不加
  - page: 496
    col: 12
    role: z
    text: 我前所譏乃謂夫莫之禁而自不為
  - page: 496
    col: 13
    role: z
    text: 者耳○此章言三年通喪天經地義
  - page: 496
    col: 14
    role: z
    text: 不容私意有所短長示之至情則不
  - page: 496
    col: 15
    role: z
    text: 肖者有以企而及之矣
  - page: 496
    col: 16
    role: j
    text: 孟子曰君子之所以教者五
  - page: 497
    col: 1
    role: z
    text: 下文五者蓋因人品高下或相去遠
  - page: 497
    col: 2
    role: z
    text: 近先後之不同
  - page: 497
    col: 3
    role: j
    text: 有如時雨化之者
  - page: 497
    col: 4
    role: z
    text: 時雨及時之雨也草木之生播種封
  - page: 497
    col: 5
    role: z
    text: 殖人力已至而未能自化所少者雨
  - page: 497
    col: 6
    role: z
    text: 露之滋耳及此時而雨之則其化速
  - page: 497
    col: 7
    role: z
    text: 矣教人之妙亦由是也若孔子之於
  - page: 497
    col: 8
    role: z
    text: 顏曾是已
  - page: 497
    col: 9
    role: j
    text: 有成德者有達財者
  - page: 497
    col: 10
    role: z
    text: 財與材同此各因其所長而教之者
  - page: 497
    col: 11
    role: z
    text: 也成德如孔子之於冉閔達財如孔
  - page: 497
    col: 12
    role: z
    text: 子之於由賜
  - page: 497
    col: 13
    role: j
    text: 有答問者
  - page: 497
    col: 14
    role: z
    text: 就所問而答之若孔孟之於樊遲萬
  - page: 497
    col: 15
    role: z
    text: 章也
  - page: 497
    col: 16
    role: j
    text: 有私淑艾者
  - page: 498
    col: 1
    role: z
    text: 艾音乂。私竊也淑善也艾治也人
  - page: 498
    col: 2
    role: z
    text: 或不能及門受業但聞君子之道於
  - page: 498
    col: 3
    role: z
    text: 人而竊以善治其身是亦君子教誨
  - page: 498
    col: 4
    role: z
    text: 之所及若孔孟之於陳亢夷之是也
  - page: 498
    col: 5
    role: z
    text: 孟子亦曰予未得爲孔子徒也予私
  - page: 498
    col: 6
    role: z
    text: 淑諸人也
  - page: 498
    col: 7
    role: j
    text: 此五者君子之所以教也
  - page: 498
    col: 8
    role: z
    text: 聖賢施教各因其材小以成小大以
  - page: 498
    col: 9
    role: z
    text: 成大無弃人也
  - page: 498
    col: 10
    role: j
    text: 公孫丑曰道則髙矣美矣冝若登天然
  - page: 498
    col: 11
    role: j
    text: 似不可及也何不使彼爲可幾及而日
  - page: 498
    col: 12
    role: j
    text: 孳孳也
  - page: 498
    col: 13
    role: z
    text: 幾音機
  - page: 498
    col: 14
    role: j
    text: 孟子曰大匠不爲拙工改廢繩墨羿不
  - page: 498
    col: 15
    role: j
    text: 爲拙射變其彀率
  - page: 498
    col: 16
    role: z
    text: 爲去聲彀古候反率音律。彀率彎
  - page: 499
    col: 1
    role: z
    text: 弓之限也言教人皆有不可易之之
  - page: 499
    col: 2
    role: z
    text: 法不容自貶以徇學者之不能也
  - page: 499
    col: 3
    role: j
    text: 君子引而不發躍如也中道而立能者
  - page: 499
    col: 4
    role: j
    text: 從之
  - page: 499
    col: 5
    role: z
    text: 引引弓也發發矢也躍如如踊躍而
  - page: 499
    col: 6
    role: z
    text: 出也因上文彀率而言君子教人但
  - page: 499
    col: 7
    role: z
    text: 授以學之之法而不告以得之之妙
  - page: 499
    col: 8
    role: z
    text: 如射者之引弓而不發矢然其所不
  - page: 499
    col: 9
    role: z
    text: 告者已如踊躍而見於前矣中者無
  - page: 499
    col: 10
    role: z
    text: 過不及之謂中道而立言其非難非
  - page: 499
    col: 11
    role: z
    text: 易能者從之言學者當自勉也○此
  - page: 499
    col: 12
    role: z
    text: 章言道有定體教有成法卑不可抗
  - page: 499
    col: 13
    role: z
    text: 高不可貶語不能顯默不能藏
  - page: 499
    col: 14
    role: j
    text: 孟子曰天下有道以道殉身天下無道
  - page: 499
    col: 15
    role: j
    text: 以身殉道
  - page: 499
    col: 16
    role: z
    text: 殉如殉葬之殉以死隨物之名也身
  - page: 500
    col: 1
    role: z
    text: 出則道在必行道屈則身在必退以
  - page: 500
    col: 2
    role: z
    text: 死相從而不離也
  - page: 500
    col: 3
    role: j
    text: 未聞以道殉乎人者也
  - page: 500
    col: 4
    role: z
    text: 以道從人妾婦之道
  - page: 500
    col: 5
    role: j
    text: 公都子曰滕更之在門也若在所禮而
  - page: 500
    col: 6
    role: j
    text: 不答何也
  - page: 500
    col: 7
    role: z
    text: 更平聲○趙氏曰滕更滕君之弟來
  - page: 500
    col: 8
    role: z
    text: 學者也
  - page: 500
    col: 9
    role: j
    text: 孟子曰挾貴而問挾賢而問挾長而問
  - page: 500
    col: 10
    role: j
    text: 挾有勳勞而問挾故而問皆所不答也
  - page: 500
    col: 11
    role: j
    text: 滕更有二焉
  - page: 500
    col: 12
    role: z
    text: 長上聲○趙氏曰二謂挾貴挾賢也
  - page: 500
    col: 13
    role: z
    text: ○尹氏曰有所挾則受道之心不專
  - page: 500
    col: 14
    role: z
    text: 所以不答也○此言君子雖誨人不
  - page: 500
    col: 15
    role: z
    text: 倦又惡夫意之不誠者
  - page: 500
    col: 16
    role: j
    text: 孟子曰於不可已而已者無所不已於
  - page: 501
    col: 1
    role: j
    text: 所厚者薄無所不薄也
  - page: 501
    col: 2
    role: z
    text: 已止也不可止謂所不得不為者也
  - page: 501
    col: 3
    role: z
    text: 所厚所當厚者也此言不及者之弊
  - page: 501
    col: 4
    role: j
    text: 其進銳者其退速
  - page: 501
    col: 5
    role: z
    text: 進銳者用心太過其氣易衰故退速
  - page: 501
    col: 6
    role: z
    text: ○三者之弊理勢必然雖過不及之
  - page: 501
    col: 7
    role: z
    text: 不同然卒同歸於廢弛
  - page: 501
    col: 8
    role: j
    text: 孟子曰君子之於物也愛之而弗仁於
  - page: 501
    col: 9
    role: j
    text: 民也仁之而弗親親親而仁民仁民而
  - page: 501
    col: 10
    role: j
    text: 愛物
  - page: 501
    col: 11
    role: z
    text: 物謂禽獸草木愛謂取之有時用之
  - page: 501
    col: 12
    role: z
    text: 有節○程子曰仁推己及人如老吾
  - page: 501
    col: 13
    role: z
    text: 老以及人之老於民則可於物則不
  - page: 501
    col: 14
    role: z
    text: 可統而言之則皆仁分而言之則有
  - page: 501
    col: 15
    role: z
    text: 序○楊氏曰其分不同故所施不能
  - page: 501
    col: 16
    role: z
    text: 無差等所謂理一而分殊者也○尹
  - page: 502
    col: 1
    role: z
    text: 氏曰何以有是差等一本故也無偽
  - page: 502
    col: 2
    role: z
    text: 也
  - page: 502
    col: 3
    role: j
    text: 孟子曰知者無不知也當務之爲急仁
  - page: 502
    col: 4
    role: j
    text: 者無不愛也急親賢之爲務堯舜之知
  - page: 502
    col: 5
    role: j
    text: 而不徧物急先務也堯舜之仁不徧愛
  - page: 502
    col: 6
    role: j
    text: 人急親賢也
  - page: 502
    col: 7
    role: z
    text: 知者之知並去聲○知者固無不知
  - page: 502
    col: 8
    role: z
    text: 然常以所當務者爲急則事無不治
  - page: 502
    col: 9
    role: z
    text: 而其爲知也大矣仁者固無不愛然
  - page: 502
    col: 10
    role: z
    text: 常急於親賢則恩無不洽而其爲仁
  - page: 502
    col: 11
    role: z
    text: 也愽矣
  - page: 502
    col: 12
    role: j
    text: 不能三年之喪而緦小功之察放飯流
  - page: 502
    col: 13
    role: j
    text: 歠而問無齒決是之謂不知務
  - page: 502
    col: 14
    role: z
    text: 飯扶晚反歠昌恱反○三年之喪服
  - page: 502
    col: 15
    role: z
    text: 之重者也緦麻三月小功五月服之
  - page: 502
    col: 16
    role: z
    text: 輕者也察致詳也放飯大飯流歠長
  - page: 503
    col: 1
    role: j
    text: 歠不敬之大者也齒決齧斷乾肉不
  - page: 503
    col: 2
    role: j
    text: 敬之小者也問講求之意○此章言
  - page: 503
    col: 3
    role: j
    text: 君子之於道識其全體則心不狹知
  - page: 503
    col: 4
    role: j
    text: 所先後則事有序○豐氏曰智不急
  - page: 503
    col: 5
    role: j
    text: 於先務雖徧知人之所知徧能人之
  - page: 503
    col: 6
    role: j
    text: 所能徒弊精神而無益於天下之治
  - page: 503
    col: 7
    role: j
    text: 矣仁不急於親賢雖有仁民愛物之
  - page: 503
    col: 8
    role: j
    text: 心小人在位無由下達聰明日蔽於
  - page: 503
    col: 9
    role: j
    text: 上而惡政日加於下此孟子所謂不
  - page: 503
    col: 10
    role: j
    text: 知務也
  - page: 503
    col: 14
    role: j
    text: 孟子卷第十三
