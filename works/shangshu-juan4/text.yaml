# 尚書正義卷四（孔穎達疏）：j 為經文＋孔安國注，z 為正義疏文。
sections:
  - id: juan4
    name: 卷四
    blocks:
      - { type: j, text: "皋陶謨謨，謀也。皋陶為帝舜謀。○為，於偽反。" }
      - { type: z, text: "傳“謨謀”至“舜謀”○正義曰：孔以此篇惟與禹言，嫌其不對帝舜，故言“為帝舜謀”。將言“為帝舜謀”故又訓“謨”為謀，以詳其文。" }
      - { type: j, text: "曰若稽古，皋陶亦順考古道以言之。夫典、謨，聖帝所以立治之本，皆師法古道以成不易之則。○夫音扶。治，直吏反，下同。曰：“允迪厥德，謨明弼諧。”迪，蹈。厥，其也。其，古人也。言人君當信蹈行古人之德，謀廣聰明以輔諧其政。○蹈，徒報反。禹曰：“俞，如何？”然其言，問所以行。皋陶曰：“都！慎厥身修，思永。歎美之重也。慎修其身，思為長久之道。○“身修”絕句。惇敘九族，庶明勵翼，邇可遠，在茲。”言慎修其身，厚次敘九族，則眾庶皆明其教，而自勉勵翼戴上命，近可推而遠者，在此道。○惇，《切韻》都昆反。禹拜昌言曰：“俞。”以皋陶言為當，故拜受而然之。○當，丁浪反，下同。" }
      - { type: z, text: "“曰若”至“曰俞”○正義曰：史將言皋陶之能謀，故為題目之辭曰，能順而考案古道而言之者，是皋陶也。其為帝謀曰：“為人君者當信實蹈行古人之德，而謀廣其聰明之性，以輔諧己之政事，則善矣。”禹曰：“然。”然其謀是也。“此當如何行之？”皋陶曰：“嗚呼！重其事而歎美之。“行上謀者，當謹慎其己身，而修治人之事，思為久長之道。又厚次敘九族之親而不遺棄，則眾人皆明曉上意，而各自勉勵翼戴上命，行之於近，而可推而至遠者，在此道也。”禹乃拜受其當理之言，曰：“然。”美其言而拜受之。○傳“亦順”至“之則”○正義曰：二謨其目正同，故云“亦順考古道以言”也。堯舜考古以行，謂之為“典”，大禹皋陶考古以言謂之為“謨”。“典”、“謨”之文不同，其目皆雲考古，故傳明言其意：“夫典、謨，聖帝所以立治之本。”雖言行有異，皆是考法古道以成不易之則，故史皆以“稽古”為端目。但君則行之，臣則言之，以尊卑不同，故“典”、“謨”名異。禹亦為君而云“謨者，禹在舜時未為君也。顧氏亦同此解。皋陶德劣於禹，皆是考古以言，故得同其題目。但禹能“敷於四海，祇承於帝”，皋陶不能然，故此下更無別辭耳。○傳“迪蹈”至“其政”○正義曰：《釋詁》雲：“迪，道也。”聲借為導，導音與蹈同，故“迪”又為蹈也。其德即其上“稽古”，故曰“其，古人也”。而臣為君謀，故云“言人君當信蹈行古人之德”，謂蹈履依行之也。“謀廣聰明”，“聰明”者自是己性，又當受納人言，使多所聞見，以博大此聰明，以輔弼和諧其政。經惟言“明”，傳亦有“聰”者，以耳目同是所用，故以“聰明”言之。此“曰”上不言“皋陶”，猶大禹為謀，“曰”上不言“禹”。鄭玄雲：“以皋陶下屬為句。”則“稽古”之下無人名，與上三篇不類甚矣。○傳“歎美”至“之道”○正義曰：案傳之言以“修”為上讀，顧氏亦同也。○傳“言慎”至“此道”○正義曰：自身以外，九族為近，故慎修其身，又厚次敘九族，猶堯之為政，先以親九族也。人君既能如此，則眾庶皆明其教，而各自勉勵翼戴上命。昭九年《左傳》說晉叔向言“翼戴天子”，故以為“翼戴上命”，言如鳥之羽翼而奉戴之。王者率己以化物，親親以及遠，故從近可推而至於遠者，在修己身、親九族之道。王肅雲：“以眾賢明為砥礪，為羽翼。”鄭雲：“厲，作也，以眾賢明作輔翼之臣。”與孔不同。" }
      - { type: j, text: "皋陶曰：“都！在知人，在安民。”歎修身親親之道在知人所信任，在能安民。禹曰：“籲！鹹若時，惟帝其難之。言帝堯亦以知人安民為難，故曰：“籲！”知人則哲，能官人。安民則惠，黎民懷之。哲，智也。無所不知，故能官人。惠，愛也。愛則民歸之。能哲而惠，何憂乎驩兜？佞人亂德，堯憂其敗政，故流放之。何遷乎有苗？何畏乎巧言令色孔壬？”孔，甚也。巧言，靜言庸違。令色，象恭滔天。禹言有苗、驩兜之徒甚佞如此，堯畏其亂政，故遷放之。" }
      - { type: z, text: "“皋陶曰都在”至“孔壬”○正義曰：皋陶以禹然其言，更述修身親親之道，歎而言曰：“人君行此道者，在於知人善惡，擇善而信任之；在於能安下民，為政以安定之也。”禹聞此言，乃驚而言曰：“籲！人君皆如是。能知人，能安民，惟帝堯猶其難之，況餘人乎？知人善惡，則為大智。能用官，得其人矣。能安下民，則為惠政，眾民皆歸之矣。此甚不易也，若帝堯能智而惠，則當朝無奸佞，何憂懼於驩兜之佞而流放之？何須遷徙於有苗之君？何所畏懼於彼巧言令色為甚佞之人？”三兇見惡，帝堯方始去之，是知人之難。○傳“哲智”至“歸之”○正義曰：“哲，智”，《釋言》文。舍人曰：“哲，大智也。”無所不知，知人之善惡，是能官人。“惠，愛”，《釋詁》文。君愛民則民歸之。○傳“孔甚”至“放之”○正義曰：“孔，甚”，《釋詁》文。上句既言“驩兜”、“有苗”，則此“巧言令色”共工之行也，故以《堯典》共工之事解之：“巧言，靜言庸違”也，“令色，象恭滔天”也。“孔壬”之文在三人之下，總上三人皆甚佞也。“苗”言其名，“巧言令色”言其行，令其文首尾互相見，故傳通言之：“禹言有苗、驩兜之徒甚佞如此，堯畏其亂政，故遷放之。”傳不言共工，故云“之徒”以包之。“遷”與“憂”、“畏”亦互相承言，畏之而憂，乃遷之也。四凶惟言三者，馬融雲：“禹為父隱，故不言鯀也。”" }
      - { type: j, text: "皋陶曰：“都！亦行有九德。言人性行有九德，以考察真偽則可知。○行，下孟反，注“性行”、“行正直”之“行”同。亦言其人有德，乃言曰，載采采。”載，行。採，事也。稱其人有德，必言其所行某事某事以為驗。" }
      - { type: z, text: "“皋陶”至“采采”○正義曰：禹既言知人為難，皋陶又言行之有術，故言曰：“嗚呼！人性雖則難知，亦當考察其所行有九種之德。人欲稱薦人者，不直言可用而已，亦當言其人有德。問其德之狀，乃言曰其德之所行某事某事。以所行之事為九德之驗，如此則可知也。”○傳“言人”至“可知”○正義曰：“言人性行有九德”，下文所云是也。如此九者考察其真偽，則人之善惡皆可知矣。然則皋陶之賢不及帝堯遠矣，皋陶知有此術，帝堯無容不知；而有四凶在朝，禹言帝難之者，堯朝之有四凶，晦跡以顯舜爾。禹言惟帝難之，說彼甚佞，因其成敗以示教法，欲開皋陶之志，故舉大事以為戒；非是此實甚佞，堯不能知也。顧氏亦云：“堯實不以此為難。今雲難者，俯同流俗之稱也。”○傳“載行”至“為驗”○正義曰：“載”者，運行之義，故為行也。此謂薦舉人者稱其人有德，欲使在上用之，必須言其所行之事，雲見此人常行其某事某事，由此所行之事以為有德之驗。《論語》雲：“如有所譽者，其有所試矣。”是言試之於事，乃可知其德。" }
      - { type: j, text: "禹曰：“何？”問九德品例。皋陶曰：“寬而栗，性寬弘而能莊栗。柔而立，和柔而能立事。愿而恭，愨愿而恭恪。○願音願。愨《切韻》苦角反。恪，苦各反。亂而敬，亂，治也。有治而能謹敬。擾而毅，擾，順也。致果為毅。○擾，而小反，徐音饒。毅，五既反。直而溫，行正直而氣溫和。簡而廉，性簡大而有廉隅。剛而塞，剛斷而實塞。○斷，丁亂反。彊而義。無所屈撓，動必合義。○撓，女孝反。彰厥有常，吉哉！彰，明。吉，善也。明九德之常，以擇人而官之，則政之善。" }
      - { type: z, text: "“禹曰”至“吉哉”○正義曰：皋陶既言其九德，禹乃問其品例曰：“何謂也？”皋陶曰：“人性有寬弘而能莊栗也，和柔而能立事也，愨願而能恭恪也，治理而能謹敬也，和順而能果毅也，正直而能溫和也，簡大而有廉隅也，剛斷而能實塞也，強勁而合道義也。人性不同，有此九德。人君明其九德所有之常，以此擇人而官之，則為政之善哉！”○傳“性寬”至“莊栗”○正義曰：此九德之文，《舜典》雲“寬而栗，直而溫”，與此正同。彼雲“剛而無虐，簡而無傲”，與此小異。彼言“剛失入虐”，此言“剛斷而能實塞”，“實塞”亦是不為虐。彼言“簡失入傲”，此言“簡大而有廉隅”，“廉隅”亦是不為傲也。九德皆人性也。鄭玄雲：“凡人之性有異，有其上者，不必有下；有其下者，不必有上。上下相協，乃成其德。”是言上下以相對，各令以相對兼而有之，乃為一德。此二者雖是本性，亦可以長短自矯。寬弘者失於緩慢，故性寬弘而能矜莊嚴栗，乃成一德。九者皆然也。○傳“愨愿而恭恪”○正義曰：“願”者愨謹良善之名。謹願者失於遲鈍，貌或不恭，故愨願而能恭恪乃為德。○傳“亂治”至“謹敬”○正義曰：“亂，治”，《釋詁》文。有能治者，謂才高於人也，堪撥煩理劇者也。負才輕物，人之常性，故有治而能謹敬乃為德也。“願”言“恭”，“治”雲“敬”者，恭在貌，敬在心；願者遲鈍，外失於儀，故言“恭”以表貌；治者輕物，內失於心，故稱“敬”以顯情。“恭”與“敬”其事亦通，“願”其貌恭而心敬也。○傳“擾順”至“為毅”○正義曰：《周禮·大宰》雲：“以擾萬民。”鄭玄雲：“擾猶馴也。”《司徒》雲：“安擾邦國。”鄭雲：“擾亦安也。”“擾”是安馴之義，故為順也。“致果為毅”，宣二年《左傳》文。彼文以“殺敵為果，致果為毅”，謂能致果敢殺敵之心，是為強毅也。和順者失於不斷，故順而能決乃為德也。○傳“性簡”至“廉隅”○正義曰：“簡”者，寬大率略之名。志遠者遺近，務大者輕細，弘大者失於不謹，細行者不修廉隅，故簡大而有廉隅乃為德也。○傳“剛斷”至“實塞”○正義曰：“塞”訓實也。剛而能斷失於空疏，必性剛正而內充實乃為德也。○傳“無所”至“合義”○正義曰：強直自立，無所屈撓，或任情違理，失於事宜，動合道義乃為德也。鄭注《論語》雲：“剛謂強，志不屈撓。”即“剛”、“強”義同。此“剛”、“強”異者，“剛”是性也，“強”是志也。當官而行，無所避忌，剛也。執己所是，不為眾撓，強也。“剛”、“強”相近，鄭連言之。“寬”謂度量寬弘，“柔”謂性行和柔，“擾”謂事理擾順，三者相類，即《洪範》雲“柔克”也。“願”謂容貌恭正，“亂”謂剛柔治理，“直”謂身行正直，三者相類，即《洪範》雲“正直”也。“簡”謂器量凝簡，“剛”謂事理剛斷，“強”謂性行堅強，三者相類，即《洪範》雲“剛克”也。而九德之次，從“柔”而至“剛”也，惟“擾而毅”在“願”、“亂”之下耳。其《洪範》三德，先人事而後天地，與此不同。○傳“彰明”至“之善”○正義曰：“彰，明”、“吉，善”，常訓也。此句言用人之義。所言九德，謂彼人常能然者。若暫能為之，未成為德。故人君取士，必明其九德之常，知其人常能行之，然後以此九者之法擇人而官之，則為政之善也。“明”謂人君明知之。王肅雲：“明其有常則善也，言有德當有恆也。”其意亦言彼能有常，人君能明之也。鄭雲：“人能明其德，所行使有常，則成善人矣。”其意謂彼人自明之，與孔異也。" }
      - { type: j, text: "日宣三德，夙夜浚明有家。三德，九德之中有其三。宣，布。夙，早。浚，須也。卿大夫稱家。言能日日布行三德，早夜思之，須明行之，可以為卿大夫。○浚，息俊反，馬雲：“大也。”日嚴祗敬六德，亮採有邦。有國，諸侯。日日嚴敬其身，敬行六德，以信治政事，則可以為諸侯。○嚴如字，馬、徐魚檢反。翕受敷施，九德鹹事，俊乂在官。翕，和也。能合受三六之德而用之，以佈施政教，使九德之人皆用事。謂天子如此，則俊德治能之士並在官。○翕，許及反。俊乂，馬曰：“千人曰俊，百人曰乂。”百僚師師，百工惟時，僚、工皆官也。師師，相師法。百官皆是，言政無非。○僚本又作寮。撫於五辰，庶績其凝。”凝，成也。言百官皆撫順五行之時，眾功皆成。○撫，方武反。凝，魚陵反，馬雲：“定也。”" }
      - { type: z, text: "“日宣”至“其凝”○正義曰：皋陶既陳人有九德，宜擇而官之，此又言官之所宜：“若人能日日宣佈三德，早夜思念而須明行之，此人可以為卿大夫，使有家也。若日日嚴敬其身，又能敬行六德，信能治理其事，此人可以為諸侯，使有國也。然後撫以天子之任，合受有家有國三六之德而用之，佈施政教，使九德之人皆得用事，事各盡其能，無所遺棄，則天下俊德治能之士並在官矣。皆隨賢才任職，百官各師其師，轉相教誨，則百官惟皆是矣，無有非者。以此撫順五行之時，以化隘天下之民，則眾功其皆成矣。”結上知人安民之意。○傳“三德”至“大夫”○正義曰：此文承“九德”之下，故知“三德”是九德之內課有其三也。《周語》雲：“宣佈哲人之令德。”“宣”以布義，故為布也。“夙，早”，《釋詁》文。又云：“須，待也。”此經之意，謂夜思之，明旦行之，“須”為待之意，故“浚”為須也。大夫受采邑，賜氏族，立宗廟，世不絕祀，故稱“家”。位不虛受，非賢臣不可，言能日日布行三德，早夜思之，待明行之，如此念德不懈怠者，乃可以為大夫也。以士卑，故言不及也。計有一德二德，即可以為士也。鄭以“‘三德’、‘六德’，皆‘亂而敬’以下之文”，經無此意也。○傳“有國”至“諸侯”○正義曰：天子分地建國，諸侯專為己有，故“有國”謂諸侯也。“祗”亦為敬，“敬”有二文，上謂敬身，下謂敬德，“嚴”則敬之狀也。故言“日日嚴敬其身，敬行六德，以信治政事，則可以為諸侯”也。諸侯大夫皆言“日日”者，言人之行德，不可暫時舍也。臣當行君之令，故早夜思之。君是出令者，故言敬身行德。此文以小至大，總以天子之事，故先大夫而後諸侯。○傳“翕合”至“在官”○正義曰：“翕，合”，《釋詁》文。以文承“三德”、“六德”之下，故言合受三六之德而用之。以此人為官，令其佈施政教，使此九德之人皆居官用事。謂天子各任其所能。大夫所行三德，或在諸侯六德之內，但並此三六之德，既充九數，故言九德皆用事，謂用為大夫，用為諸侯，使之治民事也。大夫諸侯當身自行之，故言“日宣”、“日嚴”。天子當任人使行之，故言“合受而用之”。其實天子亦備九德，故能任用三德、六德也，則俊德治能之士並在官矣。“乂”訓為治，故云“治能”。馬、王、鄭皆雲：“才德過千人為俊，百人為乂。”○傳“僚工”至“無非”○正義曰：“僚，官”，《釋詁》文。“工，官”，常訓也。“師師”謂相師法也。○傳“凝成”至“皆成”○正義曰：鄭玄亦云：“凝，成也。”王肅雲：“凝猶定也。”皆以意訓耳。文承“百工”之下，“撫於五辰”還是百工撫之，故云“百官皆撫順五行之時，則眾功皆成”也。“五行之時”即四時也。《禮運》曰“播五行於四時”，土寄王四季，故為“五行之時”也。所撫順者，即《堯典》“敬授民時”，“平秩東作”之類是也。" }
      - { type: j, text: "無教逸欲有邦，不為逸豫貪欲之教，是有國者之常。兢兢業業，一日二日萬幾。兢兢，戒慎。業業，危懼。幾，微也。言當戒懼萬事之微。○兢，居凌反。業如字，徐五荅反。幾，徐音機。無曠庶官，天工人其代之。曠，空也。位非其人為空官。言人代天理官，不可以天官私非其才。天敘有典，敕我五典五惇哉！天次敘人之常性，各有分義，當敕正我五常之敘，使合於五厚，厚天下。○有典，馬本作“五典”。分，扶問反。天秩有禮，自我五禮有庸哉！庸，常。自，用也。天次秩有禮，當用我公、侯、伯、子、男五等之禮以接之，使有常。○有庸，馬本作“五庸”。同寅協恭，和衷哉！衷，善也。以五禮正諸侯，使同敬合恭而和善。○衷音中。天命有德，五服五章哉！五服，天子、諸侯、卿、大夫、士之服也。尊卑彩章各異，所以命有德。天討有罪，五刑五用哉！言天以五刑討五罪，用五刑宜必當。政事懋哉！懋哉！言敘典秩禮，命德討罰無非天意者，故人君居天官，聽政治事，不可以不自勉。" }
      - { type: z, text: "“無教”至“懋哉”○正義曰：皋陶既言用人之法，又戒以居官之事：“上之所為，下必效之。無教在下為逸豫貪欲之事，是有國之常道也。為人君當兢兢然戒慎，業業然危懼。”言當戒慎。“一日二日之間而有萬種幾微之事，皆須親自知之，不得自為逸豫也。萬幾事多，不可獨治，當立官以佐己，無得空廢眾官，使才非其任。此官乃是天官，人其代天治之，不可以天之官而用非其人”。又言：“典禮德刑皆從天出，天次敘人倫，使有常性，故人君為政，當敕正我父、母、兄、弟、子五常之教教之，使五者皆惇厚哉！天又次敘爵命，使有禮法，故人君為政，當奉用我公、侯、伯、子、男五等之禮接之，使五者皆有常哉！接以常禮，當使同敬合恭而和善哉！天又命用有九德，使之居官，當承天意為五等之服，使五者尊卑彰明哉！天又討治有罪，使之絕惡，當承天意為五等之刑，使五者輕重用法哉！典禮德刑，無非天意，人君居天官，聽治政事，當須勉之哉！”○傳“不為”至“之常”○正義曰：“毋”者禁戒之辭，人君身為逸欲，下則效之，是以禁人君使不自為耳。不為逸豫貪欲之教，是有國者之常也。此文主於天子，天子謂天下為國。《詩》雲“生此王國”之類是也。○傳“兢兢”至“之微”○正義曰：《釋訓》雲：“兢兢，戒也。業業，危也。”戒必慎，危必懼，傳言“慎”、“懼”以足之。《易·系辭》雲：“幾者動之微。”故“幾”為微也。一日二日之間，微者乃有萬事，言當戒慎萬事之微。微者尚有萬，則大事必多矣。且微者難察，察則勞神，以言不可逸耳。馬、王皆雲：“一日、二日，猶日日也。”○傳“曠空”至“其才”○正義曰：“曠”之為空，常訓也。位非其人，所職不治，是為空官。天不自治，立君乃治之。君不獨治，為臣以佐之。下典、禮、德、刑，無非天意者。天意既然，人君當順天，是言人當代天治官。官則天之官，居天之官，代天為治，苟非其人，不堪此任，人不可以天之官而私非其才。王肅雲：“天不自下治之，故人代天居之，不可不得其人也。”○傳“天次”至“天下”○正義曰：天敘有典，有此五典，即父義、母慈、兄友、弟恭、子孝是也。五者人之常性，自然而有，但人性有多少耳。天次敘人之常性，使之各有分義。義，宜也。今此義、慈、友、恭、孝各有定分，合於事宜。此皆出天然，是為天次敘之。天意既然，人君當順天之意，敕正我五常之教，使合於五者皆厚，以教天下之民也。五常之教，人君為之，故言“我”也。五教遍於海內，故以“天下”言之。○傳“庸常”至“有常”○正義曰：“庸，常”，《釋詁》文。又云：“由，自也。”“由”是用，故“自”為用也。“天次敘有禮”，謂使賤事貴，卑承尊，是天道使之然也。天意既然，人君當順天意，用我公、侯、伯、子、男五等之禮以接之，使之貴賤有常也。此文主於天子，天子至於諸侯，車旗衣服、國家禮儀、饗食燕好、饔餼飧牢，禮各有次秩以接之。上言“天敘”，此雲“天秩”者，“敘”謂定其倫次，“秩”謂制其差等，義亦相通。上雲“敕我”，此言“自我”者，五等以教下民，須敕戒之；五禮以接諸侯，當用我意；故文不同也。上言“五惇”，此言“五庸”者，五典施於近親，欲其恩厚；五禮施於臣下，欲其有常；故文異也。王肅雲：“五禮謂王、公、卿、大夫、士。”鄭玄雲：“五禮，天子也，諸侯也，卿大夫也，士也，庶民也。”此無文可據，各以意說耳。○傳“衷善”至“和善”○正義曰：“衷”之為善，常訓也。故《左傳》雲“天誘其衷”，說者皆以衷為善。此文承“五禮”之下，禮尚恭敬，故“以五禮正諸侯，使同敬合恭而和善”也。鄭玄以為“並上之禮共有此事”。五典室家之內，務在相親，非復言以恭敬，恭敬惟為五禮而已，孔言是也。○傳“五服”至“有德”○正義曰：《益稷》雲：“以五采彰施於五色，作服，汝明。”是天子、諸侯、卿、大夫、士之服也。其“尊卑採章各異”，於彼傳具之。天命有德，使之居位，命有貴賤之倫，位有上下之異，不得不立名，以此等之，象物以彰之。先王制為五服，所以表貴賤也。服有等差，所以別尊卑也。" }
      - { type: j, text: "天聰明，自我民聰明。言天因民而降之福，民所歸者天命之。天視聽人君之行，用民為聰明。天明畏，自我民明威。天明可畏，亦用民成其威。民所叛者天討之，是天明可畏之效。○畏如字，徐音威，馬本作威。達於上下，敬哉有土！”言天所賞罰，惟善惡所在，不避貴賤。有土之君，不可不敬懼。皋陶曰：“朕言惠，可厎行。”其所陳“九德”以下之言，順於古道，可致行。禹曰：“俞，乃言厎可績。”然其所陳，從而美之曰：“用汝言，致可以立功。”皋陶曰：“予未有知思，曰贊贊襄哉！”言我未有所知，未能思致於善，徒亦贊奏上古行事而言之。因禹美之，承以謙辭，言之序。○知如字，徐音智。思如字，徐音息吏反。襄，息羊反，上也。馬雲：“因也。”案《爾雅》作儴，因也，如羊反。" }
      - { type: z, text: "“天聰”至“襄哉正義曰：此承上“懋哉”以下言所勉之者。以天之聰明視聽，觀人有德。用我民以為耳目之聰明，察人言善者，天意歸賞之。又天之明德可畏，天威者，用我民言惡而叛之，因討而伐之，成其明威。天所賞罰，達於上下，不避貴賤，故須敬哉，有土之君！皋陶既陳此戒，欲其言入之，故曰：“我之此言，順於古道，可致行，不可忽也。”禹即受之曰：“然，汝言用而致可以立功。”重其言以深戒帝。皋陶乃承之以謙曰：“我未有所知，未能思致於善，我所言曰，徒贊奏上古所行而言之哉！非己知思而所自能。”是其謙也。○傳“言天”至“聰明”○正義曰：皇天無心，以百姓之心為心。此經大意言民之所欲，天必從之。“聰明”謂聞見也，天之所聞見，用民之所聞見也。然則“聰明”直是見聞之義，其言未有善惡；以下言“明威”，是天降之禍，知此“聰明”是天降之福。此即《泰誓》所云“天聽自我民聽，天視自我民視”。故“民所歸者，天命之。”大而言之，民所歸就，天命之為天子也。小而言之，雖公卿大夫之任，亦為民所歸向，乃得居之。此文主於天子，故言“天視聽人君之行，用民為聰明”，戒天子使順民心，受天之福也。○傳“言天”至“敬懼”○正義曰：上句有賞罰，故言“天所賞罰，不避貴賤”。此之“達於上下”，言天子亦不免也。《喪服》鄭玄注云：“天子諸侯及卿大夫有地者皆曰君。”即此“有土”可兼大夫以上。但此文本意實主於天子，戒天子不可不敬懼也。○傳“言我”至“之序”○正義曰：皋陶目言“可致行”，禹言“致可績”，此承而為謙，知其目言未有所知，未能思致於善也。“思”字屬上句，王肅雲：“贊贊猶贊奏也。”顯氏雲：“襄，上也。謂贊奏上古行事而言之也。”經雲“曰”者，謂我上之所言也。傳不訓“襄”為上，已從“襄陵”而釋之。故二劉並以“襄”為因，若必為因，孔傳無容不訓其意。言進習上古行事，因贊成其辭而言之也。傳雖不訓“襄”字，其義當如王說。皋陶慮忽之，自雲“言順可行”。因禹美之，即承謙辭。一揚一抑，言之次序也。鄭玄雲：“贊，明也。襄之言暢，言我未有所知，所思徒贊明帝德，暢我忠言而已。謙也。”" }
