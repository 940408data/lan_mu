labels:
  - page: 385
    col: 1
    role: j
    text: 孟子卷第十一朱熹集注
  - page: 385
    col: 2
    role: title
    text: 告子章句上
  - page: 385
    col: 3
    role: z
    text: 凡二十章
  - page: 385
    col: 4
    role: j
    text: 告子曰性猶杞柳也義猶桮棬也以人
  - page: 385
    col: 5
    role: j
    text: 性爲仁義猶以杞柳爲桮棬
  - page: 385
    col: 6
    role: j
    text: 桮音杯捲丘圓反○性者人生所禀
  - page: 385
    col: 7
    role: z
    text: 之天理也杞柳柜柳桮棬屈木所爲
  - page: 385
    col: 8
    role: z
    text: 若巵匜之屬告子言人性本無仁義
  - page: 386
    col: 1
    role: z
    text: 必待矯揉而後成如荀子性惡之說
  - page: 386
    col: 2
    role: z
    text: 也
  - page: 386
    col: 3
    role: j
    text: 孟子曰子能順杞柳之性而以爲桮棬
  - page: 386
    col: 4
    role: j
    text: 乎將戕賊杞柳而後以爲桮棬也如將戕
  - page: 386
    col: 5
    role: j
    text: 賊杞柳而以爲桮棬則亦將戕賊人以
  - page: 386
    col: 6
    role: j
    text: 爲仁義與率天下之人而禍仁義者必
  - page: 386
    col: 7
    role: j
    text: 子之言夫
  - page: 386
    col: 8
    role: z
    text: 戕音墻與平聲夫音扶○言如此則
  - page: 386
    col: 9
    role: z
    text: 天下之人皆以仁義爲害性而不肯
  - page: 386
    col: 10
    role: z
    text: 爲是因子之言而爲仁義之禍也
  - page: 386
    col: 11
    role: j
    text: 告子曰性猶湍水也决諸東方則東流
  - page: 386
    col: 12
    role: j
    text: 决諸西方則西流人性之無分於善不
  - page: 386
    col: 13
    role: j
    text: 善也猶水之無分於東西也
  - page: 386
    col: 14
    role: z
    text: 湍他端反○湍波流瀠回之貌也告
  - page: 386
    col: 15
    role: z
    text: 子因前說而小變之近於楊子善惡
  - page: 386
    col: 16
    role: z
    text: 混之說
  - page: 387
    col: 1
    role: j
    text: 孟子曰水信無分於東西無分於上下
  - page: 387
    col: 2
    role: j
    text: 乎人性之善也猶水之就下也人無有
  - page: 387
    col: 3
    role: j
    text: 不善水無有不下
  - page: 387
    col: 4
    role: z
    text: 言水誠不分東西矣然豈不分上下
  - page: 387
    col: 5
    role: z
    text: 乎性即天理未有不善者也
  - page: 387
    col: 6
    role: j
    text: 今夫水搏而躍之可使過顙激而行之
  - page: 387
    col: 7
    role: j
    text: 可使在山是豈水之性哉其勢則然也
  - page: 387
    col: 8
    role: j
    text: 人之可使為不善其性亦猶是也
  - page: 387
    col: 9
    role: z
    text: 夫音扶搏補各反○搏擊也躍跳也
  - page: 387
    col: 10
    role: z
    text: 顙額也水之過額在山皆不就下也
  - page: 387
    col: 11
    role: z
    text: 然其本性未嘗不就下但為搏激所
  - page: 387
    col: 12
    role: z
    text: 使而逆其性耳○此章言性本善故
  - page: 387
    col: 13
    role: z
    text: 順之而無不善本無惡故反之而後
  - page: 387
    col: 14
    role: z
    text: 為惡非本無定體而可以無所不為
  - page: 387
    col: 15
    role: z
    text: 也
  - page: 387
    col: 16
    role: j
    text: 告子曰生之謂性
  - page: 388
    col: 1
    role: z
    text: 生指人物之所以知覺運動者而言
  - page: 388
    col: 2
    role: z
    text: 告子論性前後四章語雖不同然其
  - page: 388
    col: 3
    role: z
    text: 大指不外乎此與近世佛氏所謂作
  - page: 388
    col: 4
    role: z
    text: 用是性者略相似
  - page: 388
    col: 5
    role: j
    text: 孟子曰生之謂性也猶白之謂白與曰
  - page: 388
    col: 6
    role: j
    text: 然白羽之白也猶白雪之白白雪之白
  - page: 388
    col: 7
    role: j
    text: 猶白玉之白與曰然
  - page: 388
    col: 8
    role: z
    text: 與平聲下同○白之謂白猶言凡物
  - page: 388
    col: 9
    role: z
    text: 之白者同謂之白更無差別也白羽
  - page: 388
    col: 10
    role: z
    text: 以下孟子再問而告子曰然則是謂
  - page: 388
    col: 11
    role: z
    text: 凡有生者同是一性矣
  - page: 388
    col: 12
    role: j
    text: 然則犬之性猶牛之性牛之性猶人之
  - page: 388
    col: 13
    role: j
    text: 性與
  - page: 388
    col: 14
    role: z
    text: 孟子又言若果如此則犬牛與人皆
  - page: 388
    col: 15
    role: z
    text: 有知覺皆能運動其性皆無以異矣
  - page: 388
    col: 16
    role: z
    text: 於是告子自知其說之非而不能對
  - page: 389
    col: 1
    role: j
    text: 也。愚按性者人之所得於天之理也
  - page: 389
    col: 2
    role: j
    text: 生者人之所得於天之氣也性形而上
  - page: 389
    col: 3
    role: j
    text: 者也氣形而下者也人物之生莫不有
  - page: 389
    col: 4
    role: j
    text: 是性亦莫不有是氣然以氣言之則知
  - page: 389
    col: 5
    role: z
    text: 覺運動人與物若不異也以理言之
  - page: 389
    col: 6
    role: j
    text: 則仁義禮智之稟豈物之所得而全哉
  - page: 389
    col: 7
    role: j
    text: 此人之性所以無不善而爲萬物之靈
  - page: 389
    col: 8
    role: j
    text: 也告子不知性之爲理而以所謂氣者
  - page: 389
    col: 9
    role: z
    text: 當之是以杞柳湍水之喻食色無善
  - page: 389
    col: 10
    role: z
    text: 無不善之說縱橫繆戾紛紜舛錯而
  - page: 389
    col: 11
    role: z
    text: 此章之誤乃其本根所以然者蓋徒
  - page: 389
    col: 12
    role: z
    text: 知知覺運動之蠢然者人與物同而
  - page: 389
    col: 13
    role: z
    text: 不知仁義禮智之粹然者人與物異
  - page: 389
    col: 14
    role: z
    text: 也孟子以是折之其義精矣
  - page: 389
    col: 15
    role: j
    text: 告子曰食色性也仁內也非外也義外
  - page: 389
    col: 16
    role: j
    text: 也非內也
  - page: 390
    col: 1
    role: z
    text: 告子以人之知覺運者爲性故言
  - page: 390
    col: 2
    role: z
    text: 人之甘食悅色者即其性故仁愛之
  - page: 390
    col: 3
    role: z
    text: 心生於内而事物之冝由乎外學者
  - page: 390
    col: 4
    role: z
    text: 但當用力於仁而不必求合於義也
  - page: 390
    col: 5
    role: j
    text: 孟子曰何以謂仁内義外也曰彼長而
  - page: 390
    col: 6
    role: j
    text: 我長之非有長於我也猶彼白而我白
  - page: 390
    col: 7
    role: j
    text: 之從其白於外也故謂之外也
  - page: 390
    col: 8
    role: z
    text: 長上聲下同○我長之我以彼爲長
  - page: 390
    col: 9
    role: z
    text: 也我白之我以彼爲白也
  - page: 390
    col: 10
    role: j
    text: 曰異於白馬之白也無以異於白人之
  - page: 390
    col: 11
    role: j
    text: 白也不識長馬之長也無以異於長人
  - page: 390
    col: 12
    role: j
    text: 之長與且謂長者義乎長之者義乎
  - page: 390
    col: 13
    role: z
    text: 與平聲下同○張氏曰上異於二字
  - page: 390
    col: 14
    role: z
    text: 冝衍○李氏曰或有闕文焉愚按白
  - page: 390
    col: 15
    role: z
    text: 馬白人所謂彼白而我白之也長馬
  - page: 390
    col: 16
    role: z
    text: 長人所謂彼長而我長之也白馬白
  - page: 391
    col: 1
    role: z
    text: 人不異而長焉長人不同是乃所謂
  - page: 391
    col: 2
    role: z
    text: 義也義不在彼之長而在我長之之
  - page: 391
    col: 3
    role: z
    text: 心則義之非外明矣
  - page: 391
    col: 4
    role: j
    text: 曰吾弟則愛之秦人之弟則不愛也是
  - page: 391
    col: 5
    role: j
    text: 以我為悅者也故謂之內長楚人之長
  - page: 391
    col: 6
    role: j
    text: 亦長吾之長是以長為悅者也故謂之
  - page: 391
    col: 7
    role: j
    text: 外也
  - page: 391
    col: 8
    role: z
    text: 言愛主於我故仁在內敬主於長故
  - page: 391
    col: 9
    role: z
    text: 義在外
  - page: 391
    col: 10
    role: j
    text: 曰耆秦人之炙無以異於耆吾炙夫物
  - page: 391
    col: 11
    role: j
    text: 則亦有然者也然則耆炙亦有外與
  - page: 391
    col: 12
    role: z
    text: 耆與嗜同夫音扶○言長之耆之皆
  - page: 391
    col: 13
    role: z
    text: 出於心也○林氏曰告子以食色為
  - page: 391
    col: 14
    role: z
    text: 性故因其所明者而通之○自篇首
  - page: 391
    col: 15
    role: z
    text: 至此四章告子之辯屢屈而屢變其
  - page: 391
    col: 16
    role: z
    text: 說以求勝卒不聞其能自反而有所
  - page: 392
    col: 1
    role: z
    text: 疑也此正其所謂不得於言勿求於
  - page: 392
    col: 2
    role: z
    text: 心者所以卒於鹵莽而不得其正也
  - page: 392
    col: 3
    role: j
    text: 孟季子問公都子曰何以謂義内也
  - page: 392
    col: 4
    role: z
    text: 孟季子疑孟仲子之弟也蓋聞孟子
  - page: 392
    col: 5
    role: z
    text: 之言而未逹故私論之
  - page: 392
    col: 6
    role: j
    text: 曰行吾敬故謂之内也
  - page: 392
    col: 7
    role: z
    text: 所敬之人雖在外然知其當敬而行
  - page: 392
    col: 8
    role: z
    text: 吾心之敬以敬之則不在外也
  - page: 392
    col: 9
    role: j
    text: 郷人長於伯兄一歳則誰敬曰敬兄酌
  - page: 392
    col: 10
    role: j
    text: 則誰先曰先酌郷人所敬在此所長在
  - page: 392
    col: 11
    role: j
    text: 彼果在外非由内也
  - page: 392
    col: 12
    role: z
    text: 長上聲○伯長也酌酌酒也此皆季
  - page: 392
    col: 13
    role: z
    text: 子問公都子答而季子又言如此則
  - page: 392
    col: 14
    role: z
    text: 敬長之心果不由中出也
  - page: 392
    col: 15
    role: j
    text: 公都子不能答以告孟子孟子曰敬叔
  - page: 392
    col: 16
    role: j
    text: 父乎敬弟乎彼將曰敬叔父曰弟爲尸
  - page: 393
    col: 1
    role: j
    text: 則誰敬彼將曰敬弟子曰惡在其敬叔
  - page: 393
    col: 2
    role: j
    text: 父也彼將曰在位故也子亦曰在位故
  - page: 393
    col: 3
    role: j
    text: 也庸敬在兄斯須之敬在鄉人
  - page: 393
    col: 4
    role: z
    text: 惡平聲○尸祭祀所主以象神雖子
  - page: 393
    col: 5
    role: z
    text: 弟爲之然敬之當如祖考也在位弟
  - page: 393
    col: 6
    role: z
    text: 在尸位鄉人在賔客之位也庸常也
  - page: 393
    col: 7
    role: z
    text: 斯須暫時也言因時制宜皆由中出
  - page: 393
    col: 8
    role: z
    text: 也
  - page: 393
    col: 9
    role: j
    text: 季子聞之曰敬叔父則敬敬弟則敬果
  - page: 393
    col: 10
    role: j
    text: 在外非由內也公都子曰冬日則飲湯
  - page: 393
    col: 11
    role: j
    text: 夏日則飲水然則飲食亦在外也
  - page: 393
    col: 12
    role: z
    text: 此亦上章耆炙之意○范氏曰二章
  - page: 393
    col: 13
    role: z
    text: 問答大指略同皆反覆譬喻以曉當
  - page: 393
    col: 14
    role: z
    text: 世使明仁義之在內則知人之性善
  - page: 393
    col: 15
    role: z
    text: 而皆可以爲堯舜矣
  - page: 393
    col: 16
    role: j
    text: 公都子曰告子曰性無善無不善也
  - page: 394
    col: 1
    role: z
    text: 此亦生之謂性食色性也之意近世
  - page: 394
    col: 2
    role: z
    text: 蘇氏胡氏之說蓋如此
  - page: 394
    col: 3
    role: j
    text: 或曰性可以爲善可以爲不善是故文
  - page: 394
    col: 4
    role: j
    text: 武興則民好善幽厲興則民好暴
  - page: 394
    col: 5
    role: z
    text: 好去聲○此即湍水之說也
  - page: 394
    col: 6
    role: j
    text: 或曰有性善有性不善是故以堯爲君
  - page: 394
    col: 7
    role: j
    text: 而有象以瞽瞍爲父而有舜以紂爲兄
  - page: 394
    col: 8
    role: j
    text: 之子且以爲君而有微子啓王子比干
  - page: 394
    col: 9
    role: z
    text: 韓子性有三品之說蓋如此按此文
  - page: 394
    col: 10
    role: z
    text: 則微子比干皆紂之叔父而書稱微
  - page: 394
    col: 11
    role: z
    text: 子爲商王元子疑此或有誤字
  - page: 394
    col: 12
    role: j
    text: 今曰性善然則彼皆非與
  - page: 394
    col: 13
    role: z
    text: 與平聲
  - page: 394
    col: 14
    role: j
    text: 孟子曰乃若其情則可以爲善矣乃所
  - page: 394
    col: 15
    role: j
    text: 謂善也
  - page: 394
    col: 16
    role: z
    text: 乃若發語辭情者性之動也人之情
  - page: 395
    col: 1
    role: z
    text: 本但可以爲善而不可以爲惡則性
  - page: 395
    col: 2
    role: z
    text: 之本善可知矣
  - page: 395
    col: 3
    role: j
    text: 若夫爲不善非才之罪也
  - page: 395
    col: 4
    role: z
    text: 夫音扶○才猶材質人之能也人有
  - page: 395
    col: 5
    role: z
    text: 是性則有是才性旣善則才亦善人
  - page: 395
    col: 6
    role: z
    text: 之爲不善乃物欲陷溺而然非其才
  - page: 395
    col: 7
    role: z
    text: 之罪也
  - page: 395
    col: 8
    role: j
    text: 惻隱之心人皆有之羞惡之心人皆有
  - page: 395
    col: 9
    role: j
    text: 之恭敬之心人皆有之是非之心人皆
  - page: 395
    col: 10
    role: j
    text: 有之惻隱之心仁也羞惡之心義也恭
  - page: 395
    col: 11
    role: j
    text: 敬之心禮也是非之心智也仁義禮智
  - page: 395
    col: 12
    role: j
    text: 非由外鑠我也我固有之也弗思耳矣
  - page: 395
    col: 13
    role: j
    text: 故曰求則得之舎則失之或相倍蓰而
  - page: 395
    col: 14
    role: j
    text: 無筭者不能盡其才者也
  - page: 395
    col: 15
    role: z
    text: 惡去聲舎上聲蓰音師○恭者敬之
  - page: 395
    col: 16
    role: z
    text: 發於外者也敬者恭之主於中者也
  - page: 396
    col: 1
    role: z
    text: 鑠以火消金之名自外以至内也算
  - page: 396
    col: 2
    role: z
    text: 數也言四者之心人所固有但人自
  - page: 396
    col: 3
    role: z
    text: 不思而求之耳所以善惡相去之遠
  - page: 396
    col: 4
    role: z
    text: 由不思不求而不能擴充以盡其才
  - page: 396
    col: 5
    role: z
    text: 也前篇言是四者爲仁義禮智之端
  - page: 396
    col: 6
    role: z
    text: 而此不言端者彼欲其擴而充之此
  - page: 396
    col: 7
    role: z
    text: 直因用以著其本體故言有不同耳
  - page: 396
    col: 8
    role: j
    text: 詩曰天生蒸民有物有則民之秉夷好
  - page: 396
    col: 9
    role: j
    text: 是懿德孔子曰爲此詩者其知道乎故
  - page: 396
    col: 10
    role: j
    text: 有物必有則民之秉夷也故好是懿德
  - page: 396
    col: 11
    role: z
    text: 好去聲○詩大雅蒸民之篇蒸詩作
  - page: 396
    col: 12
    role: z
    text: 烝衆也物事也則法也夷詩作彝常
  - page: 396
    col: 13
    role: z
    text: 也懿美也有物必有法如有耳目則
  - page: 396
    col: 14
    role: z
    text: 有聰明之德有父子則有慈孝之心
  - page: 396
    col: 15
    role: z
    text: 是民所秉執之常性也故人之情無
  - page: 396
    col: 16
    role: z
    text: 不好此懿德者以此觀之則人性之
  - page: 397
    col: 1
    role: z
    text: 善可見而公都子所問之三說皆不
  - page: 397
    col: 2
    role: z
    text: 辨而自明矣○程子曰性即理也理
  - page: 397
    col: 3
    role: z
    text: 則堯舜至於塗人一也才稟於氣氣
  - page: 397
    col: 4
    role: z
    text: 有清濁稟其清者為賢稟其濁者為
  - page: 397
    col: 5
    role: z
    text: 愚學而知之則氣無清濁皆可至於
  - page: 397
    col: 6
    role: z
    text: 善而復性之本湯武身之是也孔子
  - page: 397
    col: 7
    role: z
    text: 所言下愚不移者則自暴自棄之人
  - page: 397
    col: 8
    role: z
    text: 也又曰論性不論氣不備論氣不論
  - page: 397
    col: 9
    role: z
    text: 性不明二之則不是○張子曰形而
  - page: 397
    col: 10
    role: z
    text: 後有氣質之性善反之則天地之性
  - page: 397
    col: 11
    role: z
    text: 存焉故氣質之性君子有弗性者焉
  - page: 397
    col: 12
    role: z
    text: 愚按程子此說才字與孟子本文小
  - page: 397
    col: 13
    role: z
    text: 異蓋孟子專以其發於性者言之故
  - page: 397
    col: 14
    role: z
    text: 以為才無不善程子兼指其稟於氣
  - page: 397
    col: 15
    role: z
    text: 者言之則人之才固有昬明強弱之
  - page: 397
    col: 16
    role: z
    text: 不同矣張子所謂氣質之性是也二
  - page: 398
    col: 1
    role: z
    text: 說雖殊各有所當然以事理考之程
  - page: 398
    col: 2
    role: z
    text: 子爲宻蓋氣質所禀雖有不善而不
  - page: 398
    col: 3
    role: z
    text: 害性之本善性雖本善而不可以無
  - page: 398
    col: 4
    role: z
    text: 省察矯揉之功學者所當深玩也
  - page: 398
    col: 5
    role: j
    text: 孟子曰冨歳子弟多頼凶歳子弟多暴
  - page: 398
    col: 6
    role: j
    text: 非天之降才爾殊也其所以䧟溺其心
  - page: 398
    col: 7
    role: j
    text: 者然也
  - page: 398
    col: 8
    role: z
    text: 冨歳豐年也賴藉也豐年衣食饒足
  - page: 398
    col: 9
    role: z
    text: 故有所顧藉而爲善凶年衣食不足
  - page: 398
    col: 10
    role: z
    text: 故有以䧟溺其心而爲暴
  - page: 398
    col: 11
    role: j
    text: 今夫麰麥播種而耰之其地同樹之時
  - page: 398
    col: 12
    role: j
    text: 又同浡然而生至於日至之時皆熟矣
  - page: 398
    col: 13
    role: j
    text: 雖有不同則地有肥磽雨露之養人事
  - page: 398
    col: 14
    role: j
    text: 之不齊也
  - page: 398
    col: 15
    role: z
    text: 夫音扶麰音牟耰音憂磽苦交反○
  - page: 398
    col: 16
    role: z
    text: 麰大麥也耰覆種也日至之時謂當
  - page: 399
    col: 1
    role: z
    text: 成熟之期也磽瘠薄也
  - page: 399
    col: 2
    role: j
    text: 故凡同類者舉相似也何獨至於人而
  - page: 399
    col: 3
    role: j
    text: 疑之聖人與我同類者
  - page: 399
    col: 4
    role: z
    text: 聖人亦人耳其性之善無不同也
  - page: 399
    col: 5
    role: j
    text: 故龍子曰不知足而為屨我知其不為
  - page: 399
    col: 6
    role: j
    text: 蕢也屨之相似天下之足同也
  - page: 399
    col: 7
    role: z
    text: 蕢音匱○蕢草器也不知人足之大
  - page: 399
    col: 8
    role: z
    text: 小而為之屨雖未必適中然必似足
  - page: 399
    col: 9
    role: z
    text: 形不至成蕢也
  - page: 399
    col: 10
    role: j
    text: 口之於味有同耆也易牙先得我口之
  - page: 399
    col: 11
    role: j
    text: 所耆者也如使口之於味也其性與人
  - page: 399
    col: 12
    role: j
    text: 殊若犬馬之與我不同類也則天下何
  - page: 399
    col: 13
    role: j
    text: 耆皆從易牙之於味也至於味天下期
  - page: 399
    col: 14
    role: j
    text: 於易牙是天下之口相似也
  - page: 399
    col: 15
    role: z
    text: 耆與嗜同下同○易牙古之知味者
  - page: 399
    col: 16
    role: z
    text: 言易牙所調之味則天下皆以為美
  - page: 400
    col: 1
    role: j
    text: 也
  - page: 400
    col: 2
    role: j
    text: 惟耳亦然至於聲天下期於師曠是天
  - page: 400
    col: 3
    role: j
    text: 下之耳相似也
  - page: 400
    col: 4
    role: z
    text: 師曠能審音者也言師曠所和之音
  - page: 400
    col: 5
    role: z
    text: 則天下皆以為美也
  - page: 400
    col: 6
    role: j
    text: 惟目亦然至於子都天下莫不知其姣
  - page: 400
    col: 7
    role: j
    text: 也不知子都之姣者無目者也
  - page: 400
    col: 8
    role: z
    text: 姣古卯反○子都古之美人也姣好
  - page: 400
    col: 9
    role: z
    text: 也
  - page: 400
    col: 10
    role: j
    text: 故曰口之於味也有同耆焉耳之於聲
  - page: 400
    col: 11
    role: j
    text: 也有同聽焉目之於色也有同美焉至
  - page: 400
    col: 12
    role: j
    text: 於心獨無所同然乎心之所同然者何
  - page: 400
    col: 13
    role: j
    text: 也謂理也義也聖人先得我心之所同
  - page: 400
    col: 14
    role: j
    text: 然耳故理義之悅我心猶芻豢之悅我
  - page: 400
    col: 15
    role: j
    text: 口
  - page: 400
    col: 16
    role: z
    text: 然猶可也草食曰芻牛羊是也穀食
  - page: 401
    col: 1
    role: z
    text: 曰豢犬豕是也○程子曰在物為理
  - page: 401
    col: 2
    role: z
    text: 處物為義體用之謂也孟子言人心
  - page: 401
    col: 3
    role: z
    text: 無不悅理義者但聖人則先知先覺
  - page: 401
    col: 4
    role: z
    text: 乎此耳非有以異於人也程子又曰
  - page: 401
    col: 5
    role: z
    text: 理義之悅我心猶芻豢之悅我口此
  - page: 401
    col: 6
    role: z
    text: 語親切有味須實體察得理義之悅
  - page: 401
    col: 7
    role: z
    text: 心眞猶芻豢之悅口始得
  - page: 401
    col: 8
    role: j
    text: 孟子曰牛山之木嘗美矣以其郊於大
  - page: 401
    col: 9
    role: j
    text: 國也斧斤伐之可以為美乎是其日夜
  - page: 401
    col: 10
    role: j
    text: 之所息雨露之所潤非無萌蘖之生焉
  - page: 401
    col: 11
    role: j
    text: 牛羊又從而牧之是以若彼濯濯也人
  - page: 401
    col: 12
    role: j
    text: 見其濯濯也以為未嘗有材焉此豈山
  - page: 401
    col: 13
    role: j
    text: 之性也哉
  - page: 401
    col: 14
    role: z
    text: 蘖五割反○牛山齊之東南山也邑
  - page: 401
    col: 15
    role: z
    text: 外謂之郊言牛山之木前此固嘗美
  - page: 401
    col: 16
    role: z
    text: 矣今為大國之郊伐之者衆故失其
  - page: 402
    col: 1
    role: j
    text: 羙耳息生長也日夜之所息謂氣化流
  - page: 402
    col: 2
    role: z
    text: 行未甞間斷故日夜之間凡物皆有
  - page: 402
    col: 3
    role: z
    text: 所生長也萌芽也蘖芽之旁出者也
  - page: 402
    col: 4
    role: z
    text: 濯濯光潔之貌材材木也言山木雖
  - page: 402
    col: 5
    role: z
    text: 伐猶有萌蘖而牛羊又從而害之是
  - page: 402
    col: 6
    role: z
    text: 以至於光潔而無草木也
  - page: 402
    col: 7
    role: j
    text: 雖存乎人者豈無仁義之心哉其所以
  - page: 402
    col: 8
    role: j
    text: 放其良心者亦猶斧斤之於木也旦旦
  - page: 402
    col: 9
    role: j
    text: 而伐之可以爲羙乎其日夜之所息平
  - page: 402
    col: 10
    role: j
    text: 旦之氣其好惡與人相近也者幾希則
  - page: 402
    col: 11
    role: j
    text: 其旦晝之所爲有梏亡之矣梏之反覆
  - page: 402
    col: 12
    role: j
    text: 則其夜氣不足以存夜氣不足以存則
  - page: 402
    col: 13
    role: j
    text: 其違禽獸不遠矣人見其禽獸也而以
  - page: 402
    col: 14
    role: j
    text: 爲未甞有才焉者是豈人之情也哉
  - page: 402
    col: 15
    role: z
    text: 好惡並去聲○良心者本然之善心
  - page: 402
    col: 16
    role: z
    text: 即所謂仁義之心也平旦之氣謂未
  - page: 403
    col: 1
    role: z
    text: 與物接時清明之氣也好惡與人
  - page: 403
    col: 2
    role: z
    text: 相近言得人心之所同然也幾希不
  - page: 403
    col: 3
    role: z
    text: 多也梏械也反覆展轉也言人之良
  - page: 403
    col: 4
    role: z
    text: 心雖已放失然其日夜之間亦必有
  - page: 403
    col: 5
    role: z
    text: 所生長故平旦未與物接其氣清明
  - page: 403
    col: 6
    role: z
    text: 之際良心必猶有發見者但其發見
  - page: 403
    col: 7
    role: z
    text: 至微而旦晝所爲之不善又已隨而
  - page: 403
    col: 8
    role: z
    text: 梏亡之如山木既伐猶有萌孽而牛
  - page: 403
    col: 9
    role: z
    text: 羊又牧之也晝之所爲既有以害其
  - page: 403
    col: 10
    role: z
    text: 夜之所息夜之所息又不能勝其晝
  - page: 403
    col: 11
    role: z
    text: 之所爲是以展轉相害至於夜氣之
  - page: 403
    col: 12
    role: z
    text: 生日以寖薄而不足以存其仁義之
  - page: 403
    col: 13
    role: z
    text: 良心則平旦之氣亦不能清而所好
  - page: 403
    col: 14
    role: z
    text: 惡遂與人遠矣
  - page: 403
    col: 15
    role: j
    text: 故苟得其養無物不長苟失其養無物
  - page: 403
    col: 16
    role: j
    text: 不消
  - page: 404
    col: 1
    role: j
    text: 長上聲○山木人心其理一也
  - page: 404
    col: 2
    role: j
    text: 孔子曰操則存舎則亡出入無時莫知
  - page: 404
    col: 3
    role: j
    text: 其鄉惟心之謂與
  - page: 404
    col: 4
    role: z
    text: 舎音捨與平聲○孔子言心操之則
  - page: 404
    col: 5
    role: z
    text: 在此捨之則失去其出入無定時亦
  - page: 404
    col: 6
    role: z
    text: 無定處如此孟子引之以明心之神
  - page: 404
    col: 7
    role: z
    text: 明不測得失之易而保守之難不可
  - page: 404
    col: 8
    role: z
    text: 頃刻失其養學者當無時而不用其
  - page: 404
    col: 9
    role: z
    text: 力使神清氣定常如平旦之時則此
  - page: 404
    col: 10
    role: z
    text: 心常存無適而非仁義也○程子曰
  - page: 404
    col: 11
    role: z
    text: 心豈有出入亦以操舎而言耳操之
  - page: 404
    col: 12
    role: z
    text: 之道敬以直内而已○愚聞之師曰
  - page: 404
    col: 13
    role: z
    text: 人理義之心未嘗無唯持守之即在
  - page: 404
    col: 14
    role: z
    text: 爾若於旦晝之間不至梏亡則夜氣
  - page: 404
    col: 15
    role: z
    text: 愈清夜氣清則平旦未與物接之時
  - page: 404
    col: 16
    role: z
    text: 湛然虚明氣象自可見矣孟子發此
  - page: 405
    col: 1
    role: z
    text: 夜氣之說於學者極有力宜熟玩而
  - page: 405
    col: 2
    role: z
    text: 深省之也
  - page: 405
    col: 3
    role: j
    text: 孟子曰無或乎王之不智也
  - page: 405
    col: 4
    role: z
    text: 或與惑同疑恠也王疑指齊王
  - page: 405
    col: 5
    role: j
    text: 雖有天下易生之物也一日暴之十日
  - page: 405
    col: 6
    role: j
    text: 寒之未有能生者也吾見亦罕矣吾退
  - page: 405
    col: 7
    role: j
    text: 而寒之者至矣吾如有萌焉何哉
  - page: 405
    col: 8
    role: j
    text: 易去聲暴步卜反見音現○暴温之
  - page: 405
    col: 9
    role: z
    text: 也我見王之時少猶一日暴之也我
  - page: 405
    col: 10
    role: z
    text: 退則謟諛雜進之日多是十日寒之
  - page: 405
    col: 11
    role: z
    text: 也雖有萌蘖之生我亦安能如之何
  - page: 405
    col: 12
    role: z
    text: 哉
  - page: 405
    col: 13
    role: j
    text: 今夫弈之爲數小數也不專心致志則
  - page: 405
    col: 14
    role: j
    text: 不得也弈秋通國之善弈者也使弈秋
  - page: 405
    col: 15
    role: j
    text: 誨二人弈其一人專心致志惟弈秋之
  - page: 405
    col: 16
    role: j
    text: 爲聽一人雖聽之一心以爲有鴻鵠將
  - page: 406
    col: 1
    role: j
    text: 至思援弓繳而射之雖與之俱學弗若
  - page: 406
    col: 2
    role: j
    text: 之矣爲是其智弗若與曰非然也
  - page: 406
    col: 3
    role: z
    text: 夫音扶繳音灼射食亦反爲是之爲
  - page: 406
    col: 4
    role: z
    text: 去聲若與之與平聲○弈圍棋也數
  - page: 406
    col: 5
    role: z
    text: 技也致極也弈秋善弈者名秋也繳
  - page: 406
    col: 6
    role: z
    text: 以繩繫矢而射也○程子爲講官言
  - page: 406
    col: 7
    role: z
    text: 於上曰人主一日之間接賢士大夫
  - page: 406
    col: 8
    role: z
    text: 之時多親宦官宫妾之時少則可以
  - page: 406
    col: 9
    role: z
    text: 涵養氣質而薰陶德性時不能用
  - page: 406
    col: 10
    role: z
    text: 范氏曰人君之心惟在所養君子養
  - page: 406
    col: 11
    role: z
    text: 之以善則智小人養之以惡則愚然
  - page: 406
    col: 12
    role: z
    text: 賢人易疎小人易親是以寡不能勝
  - page: 406
    col: 13
    role: z
    text: 衆正不能勝邪自古國家治日常少
  - page: 406
    col: 14
    role: z
    text: 而亂日常多蓋以此也
  - page: 406
    col: 15
    role: j
    text: 孟子曰魚我所欲也熊掌亦我所欲也
  - page: 406
    col: 16
    role: j
    text: 二者不可得兼舎魚而取熊掌者也生
  - page: 407
    col: 1
    role: j
    text: 亦我所欲也義亦我所欲也二者不可
  - page: 407
    col: 2
    role: j
    text: 得兼舎生而取義者也
  - page: 407
    col: 3
    role: z
    text: 舎上聲○魚與熊掌皆美味而熊掌
  - page: 407
    col: 4
    role: z
    text: 尤美也
  - page: 407
    col: 5
    role: j
    text: 生亦我所欲所欲有甚於生者故不為
  - page: 407
    col: 6
    role: j
    text: 苟得也死亦我所惡所惡有甚於死者
  - page: 407
    col: 7
    role: j
    text: 故患有所不辟也
  - page: 407
    col: 8
    role: z
    text: 惡辟皆去聲下同○釋所以舎生取
  - page: 407
    col: 9
    role: z
    text: 義之意得得生也欲生惡死者雖衆
  - page: 407
    col: 10
    role: z
    text: 人利害之常情而欲惡有甚於生死
  - page: 407
    col: 11
    role: z
    text: 者乃秉彞義理之良心是以欲生而
  - page: 407
    col: 12
    role: z
    text: 不為苟得惡死而有所不避也
  - page: 407
    col: 13
    role: j
    text: 如使人之所欲莫甚於生則凡可以得
  - page: 407
    col: 14
    role: j
    text: 生者何不用也使人之所惡莫甚於死
  - page: 407
    col: 15
    role: j
    text: 者則凡可以辟患者何不為也
  - page: 407
    col: 16
    role: z
    text: 設使人無秉彞之良心而但有利害
  - page: 408
    col: 1
    role: z
    text: 之私情則凡可以偷生免死者皆將
  - page: 408
    col: 2
    role: z
    text: 不顧禮義而為之矣
  - page: 408
    col: 3
    role: j
    text: 由是則生而有不用也由是則可以辟
  - page: 408
    col: 4
    role: j
    text: 患而有不為也
  - page: 408
    col: 5
    role: z
    text: 由其必有秉彝之良心是以其能捨
  - page: 408
    col: 6
    role: z
    text: 生取義如此
  - page: 408
    col: 7
    role: j
    text: 是故所欲有甚於生者所惡有甚於死
  - page: 408
    col: 8
    role: j
    text: 者非獨賢者有是心也人皆有之賢者
  - page: 408
    col: 9
    role: j
    text: 能勿喪耳
  - page: 408
    col: 10
    role: z
    text: 喪去聲○羞惡之心人皆有之但衆
  - page: 408
    col: 11
    role: z
    text: 人汨於利欲而忘之惟賢者能存之
  - page: 408
    col: 12
    role: z
    text: 而不喪耳
  - page: 408
    col: 13
    role: j
    text: 一簞食一豆羹得之則生弗得則死嘑
  - page: 408
    col: 14
    role: j
    text: 爾而與之行道之人弗受蹴爾而與之
  - page: 408
    col: 15
    role: j
    text: 乞人不屑也
  - page: 408
    col: 16
    role: z
    text: 食音嗣嘑呼故反蹴子六反○豆木
  - page: 409
    col: 1
    role: z
    text: 器也嘑咄啐之貌行道之人路中凡
  - page: 409
    col: 2
    role: z
    text: 人也蹴踐踏也乞人丐乞之人也不
  - page: 409
    col: 3
    role: z
    text: 屑不以為潔也言雖欲食之急而猶
  - page: 409
    col: 4
    role: z
    text: 惡無禮有寧死而不食者是其羞惡
  - page: 409
    col: 5
    role: z
    text: 之本心欲惡有甚於生死者人皆有
  - page: 409
    col: 6
    role: z
    text: 之也
  - page: 409
    col: 7
    role: j
    text: 萬鍾則不辨禮義而受之萬鍾於我何
  - page: 409
    col: 8
    role: j
    text: 加焉為宮室之美妻妾之奉所識窮乏
  - page: 409
    col: 9
    role: j
    text: 者得我與
  - page: 409
    col: 10
    role: z
    text: 為去聲與平聲○萬鍾於我何加言
  - page: 409
    col: 11
    role: z
    text: 於我身無所增益也所識窮乏者得
  - page: 409
    col: 12
    role: z
    text: 我謂所知識之窮乏者感我之惠也
  - page: 409
    col: 13
    role: z
    text: 上言人皆有羞惡之心此言衆人所
  - page: 409
    col: 14
    role: z
    text: 以喪之由此三者蓋理義之心雖曰
  - page: 409
    col: 15
    role: z
    text: 固有而物欲之蔽亦人所易昬也
  - page: 409
    col: 16
    role: j
    text: 鄉為身死而不受今為宮室之美為之
  - page: 410
    col: 1
    role: j
    text: 鄉爲身死而不受今爲妻妾之奉爲之
  - page: 410
    col: 2
    role: j
    text: 鄉爲身死而不受今爲所識窮乏者得
  - page: 410
    col: 3
    role: j
    text: 我而爲之是亦不可以已乎此之謂失
  - page: 410
    col: 4
    role: j
    text: 其本心
  - page: 410
    col: 5
    role: z
    text: 鄉爲並去聲爲之之爲並如字○言
  - page: 410
    col: 6
    role: z
    text: 三者身外之物其得失比生死爲甚
  - page: 410
    col: 7
    role: z
    text: 輕鄉爲身死猶不肯受嘑蹴之食今
  - page: 410
    col: 8
    role: z
    text: 乃爲此三者而受無禮義之萬鍾是
  - page: 410
    col: 9
    role: z
    text: 豈不可以止乎本心謂羞惡之心○
  - page: 410
    col: 10
    role: z
    text: 此章言羞惡之心人所固有或能决
  - page: 410
    col: 11
    role: z
    text: 死生於危迫之際而不免計豐約於
  - page: 410
    col: 12
    role: z
    text: 宴安之時是以君子不可頃刻而不
  - page: 410
    col: 13
    role: z
    text: 省察於斯焉
  - page: 410
    col: 14
    role: j
    text: 孟子曰仁人心也義人路也
  - page: 410
    col: 15
    role: z
    text: 仁者心之德程子所謂心如穀種仁
  - page: 410
    col: 16
    role: z
    text: 則其生之性是也然但謂之仁則人
  - page: 411
    col: 1
    role: z
    text: 不知其切於己故反而名之曰人心
  - page: 411
    col: 2
    role: z
    text: 則可以見其爲此身酬酢萬變之主
  - page: 411
    col: 3
    role: z
    text: 而不可須臾失矣義者行事之宜謂
  - page: 411
    col: 4
    role: z
    text: 之人路則可以見其爲出入往來必
  - page: 411
    col: 5
    role: z
    text: 由之道而不可須臾舎矣
  - page: 411
    col: 6
    role: j
    text: 舎其路而弗由放其心而不知求哀哉
  - page: 411
    col: 7
    role: z
    text: 舎上聲○哀哉二字最宜詳味令人
  - page: 411
    col: 8
    role: z
    text: 惕然有深省處
  - page: 411
    col: 9
    role: j
    text: 人有雞犬放則知求之有放心而不知
  - page: 411
    col: 10
    role: j
    text: 求
  - page: 411
    col: 11
    role: z
    text: 程子曰心至重雞犬至輕雞犬放則
  - page: 411
    col: 12
    role: z
    text: 知求之心放則不知求豈愛其至輕
  - page: 411
    col: 13
    role: z
    text: 而忘其至重哉弗思而已矣愚謂上
  - page: 411
    col: 14
    role: z
    text: 兼言仁義而此下專論求放心者能
  - page: 411
    col: 15
    role: z
    text: 求放心則不違於仁而義在其中矣
  - page: 411
    col: 16
    role: j
    text: 學問之道無他求其放心而已矣
  - page: 412
    col: 1
    role: z
    text: 學問之事固非一端然其道則在於
  - page: 412
    col: 2
    role: z
    text: 求其放心而已蓋能如是則志氣清
  - page: 412
    col: 3
    role: z
    text: 明義理昭著而可以上達不然則昏
  - page: 412
    col: 4
    role: z
    text: 昧放逸雖曰從事於學而終不能有
  - page: 412
    col: 5
    role: z
    text: 所發明矣故程子曰聖賢千言萬
  - page: 412
    col: 6
    role: z
    text: 語只是欲人將已放之心約之使反
  - page: 412
    col: 7
    role: z
    text: 復入身來自能尋向上去下學而上
  - page: 412
    col: 8
    role: z
    text: 達也此乃孟子開示要切之言程子
  - page: 412
    col: 9
    role: z
    text: 又發明之曲盡其指學者宜服膺而
  - page: 412
    col: 10
    role: z
    text: 勿失也
  - page: 412
    col: 11
    role: j
    text: 孟子曰今有無名之指屈而不信非疾
  - page: 412
    col: 12
    role: j
    text: 痛害事也如有能信之者則不遠秦楚
  - page: 412
    col: 13
    role: j
    text: 之路為指之不若人也
  - page: 412
    col: 14
    role: z
    text: 信與伸同為去聲○無名指手之第
  - page: 412
    col: 15
    role: z
    text: 四指也
  - page: 412
    col: 16
    role: j
    text: 指不若人則知惡之心不若人則不知
  - page: 413
    col: 1
    role: j
    text: 惡此之謂不知類也
  - page: 413
    col: 2
    role: z
    text: 惡去聲○不知類言其不知輕重之
  - page: 413
    col: 3
    role: z
    text: 等也
  - page: 413
    col: 4
    role: j
    text: 孟子曰拱把之桐梓人苟欲生之皆知
  - page: 413
    col: 5
    role: j
    text: 所以養之者至於身而不知所以養之
  - page: 413
    col: 6
    role: j
    text: 者豈愛身不若桐梓哉弗思甚也
  - page: 413
    col: 7
    role: z
    text: 拱兩手所圍也把一手所握也桐梓
  - page: 413
    col: 8
    role: z
    text: 二木名
  - page: 413
    col: 9
    role: j
    text: 孟子曰人之於身也兼所愛兼所愛則
  - page: 413
    col: 10
    role: j
    text: 兼所養也無尺寸之膚不愛焉則無尺
  - page: 413
    col: 11
    role: j
    text: 寸之膚不養也所以考其善不善者豈
  - page: 413
    col: 12
    role: j
    text: 有他哉於己取之而已矣
  - page: 413
    col: 13
    role: z
    text: 人於一身固當兼養然欲考其所養
  - page: 413
    col: 14
    role: z
    text: 之善否者惟在反之於身以審其輕
  - page: 413
    col: 15
    role: z
    text: 重而已矣
  - page: 413
    col: 16
    role: j
    text: 體有貴賤有小大無以小害大無以賤
  - page: 414
    col: 1
    role: j
    text: 害貴養其小者為小人養其大者為大
  - page: 414
    col: 2
    role: j
    text: 人
  - page: 414
    col: 3
    role: z
    text: 賤而小者口腹也貴而大者心志也
  - page: 414
    col: 4
    role: j
    text: 今有場師舍其梧檟養其樲棘則為賤
  - page: 414
    col: 5
    role: j
    text: 場師焉
  - page: 414
    col: 6
    role: z
    text: 舍上聲檟音賈樲音貳○場師治場
  - page: 414
    col: 7
    role: z
    text: 圃者梧桐也檟梓也皆美材也樲棘
  - page: 414
    col: 8
    role: z
    text: 小棗非美材也
  - page: 414
    col: 9
    role: j
    text: 養其一指而失其肩背而不知也則為
  - page: 414
    col: 10
    role: j
    text: 狼疾人也
  - page: 414
    col: 11
    role: z
    text: 狼善顧疾則不能故以為失肩背之
  - page: 414
    col: 12
    role: z
    text: 喻
  - page: 414
    col: 13
    role: j
    text: 飲食之人則人賤之矣為其養小以失
  - page: 414
    col: 14
    role: j
    text: 大也
  - page: 414
    col: 15
    role: z
    text: 為去聲○飲食之人專養口腹者也
  - page: 414
    col: 16
    role: j
    text: 飲食之人無有失也則口腹豈適為尺
  - page: 415
    col: 1
    role: j
    text: 寸之膚哉
  - page: 415
    col: 2
    role: z
    text: 此言若使專養口腹而能不失其大
  - page: 415
    col: 3
    role: z
    text: 體則口腹之養軀命所關不但爲尺
  - page: 415
    col: 4
    role: z
    text: 寸之膚而已但養小之人無不失其
  - page: 415
    col: 5
    role: z
    text: 大者故口腹雖所當養而終不可以
  - page: 415
    col: 6
    role: z
    text: 小害大賤害貴也
  - page: 415
    col: 7
    role: j
    text: 公都子問曰鈞是人也或爲大人或爲
  - page: 415
    col: 8
    role: j
    text: 小人何也孟子曰從其大體爲大人從
  - page: 415
    col: 9
    role: j
    text: 其小體爲小人
  - page: 415
    col: 10
    role: z
    text: 鈞同也從隨也大體心也小體耳目
  - page: 415
    col: 11
    role: z
    text: 之類也
  - page: 415
    col: 12
    role: j
    text: 曰鈞是人也或從其大體或從其小體
  - page: 415
    col: 13
    role: j
    text: 何也曰耳目之官不思而蔽於物物交
  - page: 415
    col: 14
    role: j
    text: 物則引之而已矣心之官則思思則得
  - page: 415
    col: 15
    role: j
    text: 之不思則不得也此天之所與我者先
  - page: 415
    col: 16
    role: j
    text: 立乎其大者則其小者弗能奪也此爲
  - page: 416
    col: 1
    role: j
    text: 大人而已矣
  - page: 416
    col: 2
    role: z
    text: 官之爲言司也耳司聽目司視各有
  - page: 416
    col: 3
    role: z
    text: 所職而不能思是以蔽於外物旣不
  - page: 416
    col: 4
    role: z
    text: 能思而蔽於外物則亦一物而已又
  - page: 416
    col: 5
    role: z
    text: 以外物交於此物其引之而去不難
  - page: 416
    col: 6
    role: z
    text: 矣心則能思而以思爲職凡事物之
  - page: 416
    col: 7
    role: z
    text: 來心得其職則得其理而物不能蔽
  - page: 416
    col: 8
    role: z
    text: 失其職則不得其理而物來蔽之此
  - page: 416
    col: 9
    role: z
    text: 三者皆天之所以與我者而心爲大
  - page: 416
    col: 10
    role: z
    text: 若能有以立之則事無不思而耳目
  - page: 416
    col: 11
    role: z
    text: 之欲不能奪之矣此所以爲大人也
  - page: 416
    col: 12
    role: z
    text: 然此天之此舊本多作比而趙注亦
  - page: 416
    col: 13
    role: z
    text: 以比方釋之今本旣多作此而注亦
  - page: 416
    col: 14
    role: z
    text: 作此乃未詳孰是但作比字於義爲
  - page: 416
    col: 15
    role: z
    text: 短故且從今本云○范浚心箴曰茫
  - page: 416
    col: 16
    role: z
    text: 茫堪輿俯仰無垠人於其間眇然有
  - page: 417
    col: 1
    role: z
    text: 身是身之微太倉稊米參爲三才曰
  - page: 417
    col: 2
    role: z
    text: 惟心耳往古來令孰無此心心爲形
  - page: 417
    col: 3
    role: z
    text: 役乃獸乃禽惟口耳目手足動靜投
  - page: 417
    col: 4
    role: z
    text: 間抵隙爲厥心病一心之微衆欲攻
  - page: 417
    col: 5
    role: z
    text: 之其所存者嗚呼幾希君子存誠克
  - page: 417
    col: 6
    role: z
    text: 念克敬天君泰然百體從令
  - page: 417
    col: 7
    role: j
    text: 孟子曰有天爵者有人爵者仁義忠信
  - page: 417
    col: 8
    role: j
    text: 樂善不倦此天爵也公卿大夫此人爵
  - page: 417
    col: 9
    role: j
    text: 也
  - page: 417
    col: 10
    role: z
    text: 樂音洛○天爵者德義可尊自然之
  - page: 417
    col: 11
    role: z
    text: 貴也
  - page: 417
    col: 12
    role: j
    text: 古之人脩其天爵而人爵從之
  - page: 417
    col: 13
    role: z
    text: 脩其天爵以爲吾分之所當然者耳
  - page: 417
    col: 14
    role: z
    text: 人爵從之蓋不待求之而自至也
  - page: 417
    col: 15
    role: j
    text: 今之人脩其天爵以要人爵旣得人爵
  - page: 417
    col: 16
    role: j
    text: 而棄其天爵則惑之甚者也終亦必亡
  - page: 418
    col: 1
    role: j
    text: 而已矣
  - page: 418
    col: 2
    role: z
    text: 要音邀○要求也脩天爵以要人爵
  - page: 418
    col: 3
    role: z
    text: 其心固已惑矣得人爵而棄天爵則
  - page: 418
    col: 4
    role: z
    text: 其惑又甚焉終必并其所得之人爵
  - page: 418
    col: 5
    role: z
    text: 而亡之也
  - page: 418
    col: 6
    role: j
    text: 孟子曰欲貴者人之同心也人人有貴
  - page: 418
    col: 7
    role: j
    text: 於己者弗思耳
  - page: 418
    col: 8
    role: z
    text: 貴於己者謂天爵也
  - page: 418
    col: 9
    role: j
    text: 人之所貴者非良貴也趙孟之所貴趙
  - page: 418
    col: 10
    role: j
    text: 孟能賤之
  - page: 418
    col: 11
    role: z
    text: 人之所貴謂人以爵位加己而後貴
  - page: 418
    col: 12
    role: z
    text: 也良者本然之善也趙孟晉卿也能
  - page: 418
    col: 13
    role: z
    text: 以爵祿與人而使之貴則亦能奪之
  - page: 418
    col: 14
    role: z
    text: 而使之賤矣若良貴則人安得而賤
  - page: 418
    col: 15
    role: z
    text: 之哉
  - page: 418
    col: 16
    role: j
    text: 詩云既醉以酒既飽以德言飽乎仁義
  - page: 419
    col: 1
    role: j
    text: 也所以不願人之膏粱之味也令聞廣
  - page: 419
    col: 2
    role: j
    text: 譽施於身所以不願人之文繡也
  - page: 419
    col: 3
    role: z
    text: 聞去聲○詩大雅既醉之篇飽充足
  - page: 419
    col: 4
    role: z
    text: 也願欲也膏肥肉粱美穀令善也聞
  - page: 419
    col: 5
    role: z
    text: 亦譽也文繡衣之美者也仁義充足
  - page: 419
    col: 6
    role: z
    text: 而聞譽彰著皆所謂良貴也○尹氏
  - page: 419
    col: 7
    role: z
    text: 曰言在我者重則外物輕
  - page: 419
    col: 8
    role: j
    text: 孟子曰仁之勝不仁也猶水勝火今之
  - page: 419
    col: 9
    role: j
    text: 爲仁者猶以一杯水救一車薪之火也
  - page: 419
    col: 10
    role: j
    text: 不熄則謂之水不勝火此又與於不仁
  - page: 419
    col: 11
    role: j
    text: 之甚者也
  - page: 419
    col: 12
    role: z
    text: 與猶助也仁之能勝不仁必然之理
  - page: 419
    col: 13
    role: z
    text: 也但爲之不力則無以勝不仁而人
  - page: 419
    col: 14
    role: z
    text: 遂以爲眞不能勝是我之所爲有以
  - page: 419
    col: 15
    role: z
    text: 深助於不仁者也
  - page: 419
    col: 16
    role: j
    text: 亦終必亡而已矣
  - page: 420
    col: 1
    role: z
    text: 言此人之心亦且自怠於爲仁終必
  - page: 420
    col: 2
    role: z
    text: 并與其小仁而云之○趙氏曰言爲
  - page: 420
    col: 3
    role: z
    text: 仁不至而不反諸己也
  - page: 420
    col: 4
    role: j
    text: 孟子曰五穀者種之美者也苟爲不熟
  - page: 420
    col: 5
    role: j
    text: 不如荑稗夫仁亦在乎熟之而已矣
  - page: 420
    col: 6
    role: z
    text: 荑音蹄稗蒲賣反夫音扶○荑稗草
  - page: 420
    col: 7
    role: z
    text: 之似穀者其實亦可食然不能如五
  - page: 420
    col: 8
    role: z
    text: 穀之美也但五穀不熟則反不如荑
  - page: 420
    col: 9
    role: z
    text: 稗之熟猶爲仁而不熟則反不如爲
  - page: 420
    col: 10
    role: z
    text: 它道之有成是以爲仁必貴乎熟而
  - page: 420
    col: 11
    role: z
    text: 不可徒恃其種之美又不可以仁之
  - page: 420
    col: 12
    role: z
    text: 難熟而甘爲他道之有成也○尹氏
  - page: 420
    col: 13
    role: z
    text: 曰日新而不已則熟
  - page: 420
    col: 14
    role: j
    text: 孟子曰羿之教人射必志於彀學者亦
  - page: 420
    col: 15
    role: j
    text: 必志於彀
  - page: 420
    col: 16
    role: z
    text: 彀古候反○羿善射者也志猶期也
  - page: 421
    col: 1
    role: z
    text: 彀弓蒲也蒲而後發射之法也學謂
  - page: 421
    col: 2
    role: z
    text: 學射
  - page: 421
    col: 3
    role: j
    text: 大匠誨人必以規矩學者亦必以規矩
  - page: 421
    col: 4
    role: j
    text: 大匠工師也規矩匠之法也○此章
  - page: 421
    col: 5
    role: z
    text: 言事必有法然後可成師舍是則無
  - page: 421
    col: 6
    role: z
    text: 以教弟子舍是則無以學曲藝且然
  - page: 421
    col: 7
    role: z
    text: 況聖人之道乎
  - page: 421
    col: 8
    role: j
    text: 孟子卷第十一
