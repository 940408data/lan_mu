# 禮記正義卷14（孔穎達疏）：j 為經文＋鄭玄注，z 為疏文。
sections:
  - id: juan14
    name: 正文
    blocks:
      - { type: j, text: "陸曰：“此是《呂氏春秋·十二紀》之首，後人刪合為此記。蔡伯喈、王肅雲周公所作。”" }
      - { type: z, text: "正義曰：按鄭《目錄》雲：“名曰《月令》者，以其記十二月政之所行也，本《呂氏春秋·十二月紀》之首章也，以禮家好事抄合之，後人因題之名曰《禮記》言周公所作，其中官名時事多不合周法。此於《別錄》屬《明堂陰陽記》。”此卷所出，解者不同，今且申鄭旨釋之。按呂不韋集諸儒士著為《十二月紀》，合十餘萬言，名為《呂氏春秋》，篇首皆有《月令》，與此文同，是一證也。又周無大尉，唯秦官有大尉，而此《月令》雲“乃命大尉”，此是官名不合周法，二證也。又秦以十月建亥為歲首，而《月令》雲“為來歲授朔日”，即是九月為歲終，十月為授朔，此是時不合周法，三證也。又周有六冕，郊天迎氣則用大裘，乘玉輅，建大常日月之章，而《月令》服飾車旗並依時色，此是事不合周法，四證也。故鄭雲“其中官名時事多不合周法“。然按秦始皇十二年呂不韋死，十六年並天下，然後以十月為歲首，歲首用十月時，不韋巳死十五年，而不韋不得以十月為正。又云《周書》先有《月令》，何得雲不韋所造？又秦並天下立郡，何得雲諸侯？又秦以好兵殺害，毒被天下，何能布德施惠，春不興兵？既如此不同，鄭必謂不韋作者，以《呂氏春秋·十二月紀》正與此同，不過三五字別，且不韋集諸儒所作，為一代大典，亦採擇善言之事，遵立舊章，但秦自不能依行，何怪不韋所作也？又秦為水位，其來巳久，秦文公獲黑龍以為水瑞，何怪未平天下前不以十月為歲首乎！是鄭以《月令》不韋所作。《月令》者，包天地陰陽之事，然天地有上下之形，陰陽有生成之理，日月有運行之度，星辰有次舍之常。今既贊釋其文，不得不略言其趣。按《老子》雲：“道生一，一生二，二生三，三生萬物。”《易》雲：“《易》有大極，是生兩儀。”《禮運》雲：“禮必本於大一，分而為天地。”《易乾鑿度》雲：“大極者未見其氣，大初者氣之始，大始者形之始，大素者質之始。此四者同論天地之前及天地之始。”《老子》雲“道生一”，道與大易，自然虛無之氣，無象，不可以形求，不可以類取，強名曰道，強謂之大易也。“道生一”者，一則混元之氣，與大初大始大素同。又與《易》之大極，《禮》之大一，其義不殊，皆為氣形之始也。“一生二”者，謂混元之氣分為二，二則天地也，與《易》之兩儀，又與《禮》之大一分而為天地同也。“二生三”者，謂參之以人為三才也。“三生萬物”者，謂天地人既定，萬物備生其間，分為天地，說有多家，形狀之殊，凡有六等：一曰蓋天，文見《周髀》，如蓋在上；二曰渾天，形如彈丸，地在其中，天包其外，猶如雞卵白之繞黃，楊雄、桓譚、張衡、蔡邕、陸績、王肅、鄭玄之徒並所依用；三曰宣夜，舊說雲殷代之制，其形體事義，無所出以言之；四曰昕天，昕讀為軒，言天北高南下，若車之軒，是吳時姚信所說；五曰穹天，雲穹隆在上，虞氏所說，不知其名也；六曰安天，是晉時虞喜所論。注《考靈耀》用渾天之法，今《禮記》是鄭氏所注，當用鄭義，以渾天為說。按鄭注《考靈耀》雲：“天者純陽，清明無形，聖人則之，制璇璣玉衡以度其象。”如鄭此言，則天是大虛，本無形體，但指諸星運轉以為天耳。但諸星之轉，從東而西，必三百六十五日四分日之一，星復舊處。星既左轉，日則右行，亦三百六十五日四分日之一，至舊星之處，即以一日之行而為一度，計二十八宿一周天，凡三百六十五度四分度之一，是天之一週之數也。天如彈丸，圍圜三百六十五度四分度之一。按《考靈耀》雲：“一度二千九百三十二里千四百六十一分裏之三百四十八。周天百七萬一千里者，是天圓周之裏數也。以圍三徑一言之，則直徑三十五萬七千裏，此為二十八宿週迴直徑之數也。然二十八宿之外，上下東西各有萬五千裏，是為四游之極，謂之四表。據四表之內，並星宿內，總有三十八萬七千裏。然則天之中央上下正半之處，則一十九萬三千五百里，地在其中，是地去天之數也。”鄭注《考靈耀》雲：“地蓋厚茸茯裏，春分之時，地正當中。自此地漸漸而下，至夏至之時，地下游萬五千裏，地之上畔與天中平。夏至之後地漸漸向上，至秋分地正當天之中央。自此地漸漸而上，至冬至上游萬五千裏，地之下畔與天中平。自冬至後地漸漸而下，此是地之升降於茸茯裏之中。但渾天之體，雖繞於地，地則中央正平，天則北高南下。北極高於地三十六度，南極下於地三十六度。然則北極之下三十六度常見不沒，南極之上三十六度常沒不見。南極去北極一百二十一度餘，若逐曲計之，則一百八十一度餘。若以南北中半言之，謂之赤道，去南極九十一度餘，去北極亦九十一度餘，此是春秋分之日道也。赤道之北二十四度，為夏至之日道，去北極六十七度也。赤道之南二十四度，為冬至之日道，去南極亦六十七度。”地有升降，星辰有四游。又鄭注《考靈耀》雲：“天旁行四表之中，冬南夏北，春西秋東，皆薄四表而止。地亦升降於天之中，冬至而下，夏至而上。二至上下，蓋極地厚也。地與星辰俱有四游升降。四游者，自立春地與星辰西游，春分西游之極，地雖西極，升降正中，從此漸漸而東，至春末復正。自立夏之後北游，夏至北游之極，地則升降極下，至夏季復正。立秋之後東游，秋分東游之極，地則升降正中，至秋季復正。立冬之後南游，冬至南游之極，地則升降極上，冬季復正。”此是地及星辰四游之義也。星辰亦隨地升降，故鄭注《考靈耀》雲：“夏日道，上與四表平，下去東井十二度，為茸茯裏，則是夏至之日，上極萬五千裏，星辰下極萬五千裏，故夏至之日，下至東井茸茯裏也。”日有九道，故《考靈耀》雲：“萬世不失九道謀。”鄭注引《河圖帝覽嬉》雲：“黃道一，青道二出黃道東。赤道二出黃道南，白道二出黃道西，黑道二出黃道北。日春東從青道，夏南從赤道，秋西從白道，冬北從黑道。立春，星辰西游，日則東游。春分，星辰西游之極，日東游之極，日與星辰相去茸茯裏。夏則星辰北游，日則南游。夏至，星辰北游之極，日南游之極，日與星辰相去茸茯裏。以此推之，秋冬放此可知。計夏至之日，日在井星，正當嵩高之上，以其南游之極，故在嵩高之南萬五千裏，所以夏至有尺五寸之景也。於時日又上極，星辰下極，故日下去東井茸茯裏也。”然鄭四游之極，元出《周髀》之文，但日與星辰四游相反，春分日在婁，則婁星極西，日體在婁星之東，去婁茸茯裏，以度言之，十二度也。則日沒之時，去昏中之星，近校十度。旦時日極於東，去旦中之星，遠校十度。若秋分日在角，則角星極東，日體在角星之西，去角茸茯裏，則日沒之時，去昏中之星，遠校十度。旦時日極於西，去旦中之星，近校十度。此皆歷乖遠，於數不合，鄭無指解，其事有疑。但《禮》是鄭學，故具言之耳，賢者裁焉。但二十八宿從東而左行，日從西而右行一度，逆沿二十八宿。按《漢書·律曆志》雲：冬至之時，日在牽牛初度，春分之時，日在婁四度。夏至之時，日在東井三十一度。秋分之時，日在角十度。若日在東井則極長，八尺之表，尺五寸之景。若春分在婁，秋分在角，晝夜等，八尺之表，七尺五寸之景。冬至日在鬥，則晝極短，八尺之表，一丈三尺之景。一丈三尺之中，去其一尺五寸，則餘有一丈一尺五寸之景，是冬夏往來之景也。凡於地千里而差一寸，則夏至去冬至，體漸南漸下，相去一十萬五千裏。又《考靈耀》雲：“正日假上八萬裏，假下一十萬四十里。”所以有假上假下者，鄭注《考靈耀》之意，以天去地十五萬三千五百里，正月雨水之時，日在上假於天八萬裏，下至地一十一萬三千五百里。夏至之時，日上極與天表平也。後日漸向下，故鄭注《考靈耀》雲：“夏至日與表平，冬至之時，日下至於地八萬裏，上至於天十一萬三千五百里也。”委曲俱見《考靈耀注》。凡二十八宿及諸星，皆循天左行，一日一夜一周天，一周天之外，更行一度，計一年三百六十五週天四分度之一。日月五星則右行，日一日一度，月一日一十三度十九分度之七。此相通之數也。今曆象之說，則月一日至於四日行最疾，日行十四度餘；自五日至八日行次疾，日行十三度餘；自九日至十九日行則遲，日行十二度餘；自二十日至二十三日又小疾，日行十三度餘；自二十四日至於晦行又最疾，日行一十四度餘，此是月行之大率也。二十七日月行一周天，至二十九日強半，月及於日，與日相會，乃為一月。故《考靈耀》雲：“九百四十分為一日，二十九日與四百九十九分為月，是一月二十九日之外，至第三十日分至四百九十九分。月及於日，計九百四十分，則四百七十為半。今四百九十九分，是過半二十九分也。但月是陰精，日為陽精，故《周髀》雲：‘日猶火，月猶水，火則外光，水則含景’，故月光生於日所照，魄生於日所蔽，當日則光盈，就日則明盡。”京房雲：“月與星辰，陰者也。有形無光，日照之乃有光。先師以為日似彈丸，月似鏡體，或以為月亦似彈丸，日照處則明，不照處則闇。”按《律曆志》雲：二十八宿之度，“角一十二度，亢九，氐十五，房五，心五，尾十八，箕十一，東方七十五度。鬥二十六，牛八，女十二，虛十，危十七，營室十六，壁九，北方九十八度。奎十六，婁十二，胃十四，昴十一，畢十六，觜二，參九，西方八十度。井三十三，鬼四，柳十五，星七，張十八，翼十八，軫十七，南方一百一十二度”。醜為星紀，初鬥十二度，終婺女七度。子為玄枵，初婺女八度，終於危十五度。亥為娵訾，初危十六，終於奎四度。戌為降婁，初奎五度，終於胃六度。酉為大梁，初胃七度，終於畢十一度。申為實沈，初畢十二度，終於井十五度。未為鶉首，初井十六度，終於柳八度。午為鶉火，初柳九度，終於張十六度。巳為鶉尾，初張十八度，終於軫十一度。辰為壽星，初軫十二度，終於氐四度。卯為大火，初氐五度，終於尾九度。寅為析木，初尾十度，終於鬥十一度。五星者，東方歲星，南方熒惑，西方太白，北方辰星，中央鎮星，其行之遲速，俱在《律曆志》，不更煩說。《春秋說題辭》雲：“天之為言顛也。”《說文》雲：“天，顛也。”劉熙《釋名》雲“天，顯也。”又云：“坦也。”“地，底也。其體底下戴萬物。”又云：“地，諦也。五土所生，莫不信諦。”《元命包》雲：“日之為言實也。月，闕也。”劉熙《釋名》雲：“日，實也，大明盛實。月，闕也，滿則缺也。”《說題辭》雲：“星，精陽之榮也。陽精為日，日分為星，故其字日下生也。”《釋名》雲：“星，散也，佈散於天。”又云：“陰，蔭也，氣在內奧蔭也。陽，揚也，陽氣在外發揚。”此等是天地陰陽日月之名也。《祭法》“黃帝正名百物”，其名蓋黃帝而有也。或後人更有增，是其天高地下，日盈月闕，觜星度少，共鬥度多。日月右行，星辰左轉，四游升降之差，二儀運動之法，非由人事所作，皆是造化自然。先儒因其自然，遂以人事為義。或據理是實，或構虛不經，既無正文可馮，今皆略而不錄。" }
      - { type: j, text: "孟春之月，日在營室，昏參中，旦尾中。孟，長也。日月之行，一歲十二會，聖王因其會而分之，以為大數焉。觀鬥所建，命其四時。此雲孟春者，日月會於諏訾，而鬥建寅之辰也。凡記昏明中星者，為人君南面而聽天下，視時以授民事。○參，析林反。中如字，徐丁仲反，後放此。長，丁丈反。諏，足俱反，又足侯，反本又作娵，同。訾，子斯反。為人，於偽反。" }
      - { type: z, text: "“孟春”至“尾中”。○正義曰：此言孟春者，夏正建寅之月也。呂不韋在於秦世，秦以十月為歲首，不用秦正，而用夏時者，以夏數得天正，故用之也。《周禮》雖以建子為正，其祭祀田獵亦用夏正也。“日在營室”者，按《茸艹歷》立春，日在危十六度；正月中，日在室十四度。《元嘉歷》立春，日在危三度；正月中，日在室一度。○“昏參中”者，按《茸艹歷》立春，昏畢十度中，去日八十九度；正月中，昏井二度中，去日九十三度。《元嘉歷》立春，昏昴九度中，月半昏觜觿一度中。皆不昏參中者，《月令》昏明中星，皆大略而言，不與歷兆墁，但有一月之內有中者，即得載之，計正月昏參中。依《茸艹歷》在立春之後六日，參星初度昏得中也。但二十八宿，其星體有廣狹，相去遠近。或月節月中之日，昏明之時，前星以過於午，後星未至正南。又星有明暗，見有早晚，明者昏早見而旦晚沒，暗者則昏晚見而旦早沒，所以昏明之星，不可正依曆法，但舉大略耳。餘月昏明，從此可知。○注“孟長”至“民事”。○正義曰：《禮緯》謂庶長稱孟，故云“孟，長也“。若於人言之，庶謂孟；若於物言之，直謂長也。不取庶長之義，先儒以孟春亦謂之庶長。按《尚書·康誥》雲“孟侯”，《書傳》“天子之子十八，稱孟侯”，並皆稱孟，豈亦庶長乎？先儒以孟春稱庶長者非也。雲“日月之行，一歲十二會”者，日行遲，一月行二十九度半餘；月行疾，一月行天一匝三百六十五度四分度之一，過匝更行二十九度半餘，逐及於日，而與日會，所會之處謂之為辰。鄭注《周禮·大師職》雲：“十一月辰在星紀，十二月辰在玄枵，正月辰在娵訾，二月辰在降婁，三月辰在大梁，四月辰在實沈，五月辰在鶉首，六月辰在鶉火，七月辰在鶉尾，八月辰在壽星，九月辰在大火，十月辰在析木。此是一歲十二會也。雲“聖王因其會而分之，以為大數焉”者，聖王因其日月自然之會，而分為十二分，以為大略之數焉。所以為大略之數者，以二十九日過半，月及於日，月不可分，兩月各有二十九日，又兩月各有強半之日，合兩半而成一日，是一月有三十日，一月二十九日，一大一小之外，仍有餘分。一年十二月，六大六小，總有三百五十四日，是歲十二會之實數也。仍少十一日四分日之一，未得周天。聖王總以三百六十五日四分日之一，為十二會之大數。一會即一辰也，是一辰有三十度，十二辰總有三百六十度，餘有五度四分度之一，度別為九十六分，總五度有四百八十分又四分度之一，為二十四分，並之為五百四分，十二辰分之，各得四十二分，則是每辰有三十度九十六分度之四十二，計之日月實行一會，唯二十九分過半。若通均一歲會數，則每會有三十度九十六分度之四十二，是以分之為大數也。“此雲孟春者，日月會於娵訾，而鬥建寅之辰”者，娵訾是亥次之號，立春之時，日在危十六度；月半雨水之時，日在營室十四度，營室號娵訾，但星次西流，日行東轉，東西相逆。若月初之時，則日在星分之初；月半之時，則在星分之半；月終之時，在星分之末。凡十二月日之所在，或舉月初，或舉月末，皆據其大略，不細與歷數齊同。其昏明中星，亦皆如此。鬥，謂北斗，循天而轉，行建一月一辰，辰三十度九十六分度之四十二。正月建寅，二月建卯，三月建辰，四月建巳，五月建午，六月建未，七月建申，八月建酉，九月建戌，十月建亥，十一月建子，十二月建醜也。其十二辰之名，按《律曆志》雲“孳萌於子”，則子，孳也。又云“紐牙於醜”，則醜，紐也。又云“引達於寅”，則寅，引也。又云“冒茆於卯”，則卯，冒也。又云“振美於辰”，則辰，振也。又云“巳盛於巳”，則巳，巳也。又云“萼布於午”，則午，萼也。又云“昧僾於未”，則未，昧也。又云“申堅於申”，則申，堅也。又云“留孰於酉”，則酉，留也。又云“畢入於戌”，則戌，畢也。又云“該閡於亥”，則亥，該也。《律曆志》又云：“北，伏也，陽氣伏於下，於時為冬，冬，終也：萬物終藏。南，任也，陽氣任養萬物，於時為夏，夏，假也；假，大也。西，遷也，陰氣遷落萬物，於時為秋，秋者揪也：物揪斂也。東者動也，陽氣動物，於時為春，春，蠢也：物蠢生也。”雲：“凡記昏明中星者，為人君南面而聽天下，視時候授民事”者，按《書緯考靈耀》雲：“主春者鳥星，昏中可以種稷。主夏者心星，昏中可以種黍。主秋者虛星，昏中可以種麥。主冬者昴星，昏中則入山可以斬伐、具器械。”王者南面而坐，視四星之中者，而知民之緩急，急則不賦力役，故敬授民時，是觀時候授民事也。" }
      - { type: j, text: "其日甲乙。乙之言軋也。日之行，春東從青道，發生萬物，月為之佐，時萬物皆解孚甲。自抽軋而出，因以為日名焉。乙不為月名者，咀艹臣功也。○軋，乙八反。孚音敷。" }
      - { type: z, text: "“其日甲乙”。○正義曰：其當孟春、仲春、季春之時，日之生養之功謂為甲乙。○注“乙之”至“功也”。○正義曰：乙、軋聲相近，故云“乙之言軋也”。雲“日之行，春東從青道”者，以星辰之次謂之黃道，春時星辰西游，黃道近西。黃道之東，謂之青道，日體不移，依舊而行，當青道之上，故云“東從青道”。雲“月為之佐”者，以日月皆經天而行，月亦從青道，陰佐於陽，故云“月為之佐”。知月亦從青道者，以《緯》雲“月行九道，九道者並與日同，而青道二，黃道東；赤道二，黃道南；白道二，黃道西；黑道二，黃道北；並黃道而為九道也”，並與日同也。雲“萬物皆解孚甲，自抽軋而出，因以為日名焉”者，以日能生養萬物，萬物皆抽軋而生，因其抽軋，以為日功之名也。孚甲在前，抽軋在後，則應孟春甲，季春為乙。今三春總雲甲乙者，孚甲抽軋，相去不遠，早生者，即孟春孚甲而抽軋也；晚生者，即季春孚甲而抽軋也。《律曆志》雲“出甲於甲”，則甲是孚甲也。又云“奮軋於乙”，則乙，軋也。又云“明炳於丙”，則丙，炳也。又云“大成於丁”，則丁，成也。又云“豐茂於戊”，則戊，茂也。又云“理紀於已”，則已，理也，理謂正紀綱也。又云“改更於庚”，則庚，更也，謂物改更也。又云“悉新於辛“，則辛，新也。又云“懷任於壬”，則壬，任也。又云“陳揆於癸”，則癸，揆也，謂物之陳列可揆度也。雲“乙不為月名者，咀艹臣功也”者，月既佐日，同有甲乙之功。今獨以甲乙為日名，不以乙為月名，故云“咀艹臣功”，君謂日也。日統領月之功，猶若咀艹領臣之功以為已功。俗本雲“咀艹臣功”，定本雲“咀艹功”，無臣字，義俱通也。" }
      - { type: j, text: "其帝大皞，其神句芒。此蒼精之君，木官之臣，自古以來，著德立功者也。大皞，宓戲氏。句芒，少皞氏之子，曰重，為木官。○大皞，上音太，後文及注“大蔟”、“太史”、“大寢”、“大室”、“大微”、“大廟”、“大祝”、“大尉”、“大宰”皆同：皞亦作昊，胡老反；大皞，宓戲也。句芒，古候反；下音亡。句芒，木正也，少皞之子曰重為之，後“句芒”皆放此。宓戲音密，又音服；戲又作虧，亦作犧，又作羲，同許宜反。重，直龍反。" }
      - { type: z, text: "“其帝”至“句芒”。○正義曰：自“孟春之月”訖“其日甲乙”，明於天道，其事略竟。從此以下至“鴻雁來”，明聖人奉天時，及萬物節候也。故蔡邕雲“法象莫大乎天地，變通莫大乎四時，縣象著明莫大乎日月”。故先建春以奉天，奉天然後立帝，立帝然後言佐，言佐然後列昆蟲之列，物有形可見，然後音聲可聞，故陳音。有音，然後清濁可聽，故言鍾律。音聲可以彰，故陳酸羶之屬也。群品以著五行，為用於人，然後宗而祀之，故陳五祀。此以上者，聖人記事之次也。“東風”以下者，效初氣之序也。二者既立，然後人君承天時行庶政，故言帝者居處之宜，衣服之制，佈政之節，所明欽若昊天，然後奉天時也。○“其帝大皞”者，謂自古以來，木德之君，其帝大皞也。謂之皞者，按《異義》，《古尚書》說“元氣廣大謂之皞天”，則皞皞廣大之意，以伏犧德能同天，故稱皞。以東方生養，元氣盛大，西方收斂，元氣便小，故東方之帝謂之大皞，西方之帝謂之少皞。○“其神句芒”者，謂自古以來，主春立功之臣，其祀以為神。是句芒者，生木之官，木初生之時，句屈而有芒角，故云句芒。言大皞、句芒者，以此二人生時，木王，主春，立德立功。及其死後，春祀之時，則祀此大皞、句芒，故言也。此之言，據死後享祭之時，不論生存之日，故云“其神句芒”。句芒言其神，則大皞亦神也。大皞言帝，則句芒當雲臣也。互而相通，大皞在前，句芒在後，相去縣遠，非是一時。大皞木王，句芒有主木之功，故取以相配也。○注“此蒼”至“木官”。○正義曰：蒼是東方之色，故下雲“駕蒼龍，服蒼玉”。此是蒼精之君也，則東方當木行之君也。雲“著德立功”者，著德謂大皞，立功謂句芒也。雲“大皞宓戲氏”者，以東方立德，則謂之大皞，德能執伏犧牲，謂之伏犧，即宓戲也。《律曆志》雲：“大皞作罔罟，以田漁取犧牲，故天下號曰庖犧氏。”又《帝王世紀》雲：“取犧牲以供庖廚食天下，故號曰庖犧氏。”或作密戲氏者，密字誤也，當宀下著必，是古之伏字。按《帝王世紀》雲：“大皞帝庖犧氏，風姓也。母曰華胥，遂人之世，有大人之跡出於雷澤之中，華胥履之，生庖犧於成紀，蛇身人首，有聖德，為百王先。帝出於震，未有所因，故位在東主春，象日之明，是以稱大皞，一號黃熊氏。”雲“少皞氏之子曰重，為木官”者，按昭二十九年《左傳》蔡墨雲，“少皞氏有四叔：曰重，曰該，曰脩，曰熙”，重為句芒，該為蓐收，脩及熙為玄冥”，“顓頊氏有子曰犁，為祝融。共工氏有子曰句龍，為后土”，是重為句芒。若然，按《楚語》雲：“重為南正司天，犁為火正司地。”所以又為南正、火正不同者，蓋重為木正，兼為南正司天；犁為火正，兼為北正司地，故韋昭注《國語》雲“火當為北，重既顓頊時為南正”。按《楚世家》高辛氏誅重、犁，依帝系，顓頊、高辛各有一人為帝，則重既事顓頊，又事高辛，鄭則依《命歷序》，以顓頊傳九世，帝嚳傳十世，則重何得事顓頊又事高辛者？師解“重，人號。雖子孫皆號曰重，猶若羿為堯時射官，至夏後相之時，猶有羿也”。自古以來，紀君臣之號，按昭十七年《左傳》雲“顓頊以來，不能紀遠，乃紀於近，命以民事”，服注云“自少皞以上，天子之號以其德，百官之號以其徵。自顓頊以來，天子之號以其地，百官之紀以其事”，則伏犧、神農、黃帝、少皞皆以德為號也，高陽、高辛、唐虞皆以地為號也。雖以地為號，兼有德號，則帝嚳、顓頊、堯、舜，是其德號。" }
      - { type: j, text: "其蟲鱗。象物孚甲將解。鱗，龍蛇之屬，其音角。謂樂器之聲也。三分羽益一以生角，角數六十四。屬木者，以其清濁中，民象也。春氣和，則角聲調。《樂記》曰：“角亂則憂，其民怨。”凡聲尊卑取象五行，數多者濁，數少者清，大不過宮，細不過羽。" }
      - { type: z, text: "“其音角”。○正義曰：其春時之音為當於角，取象木之聲。不雲其聲角，而云其音者，單出曰聲，雜比曰音，音則樂曲也。以春時調和，樂以角為主，故云“其音角”。○注“謂樂”至“過羽”。○正義曰：恐是他物之聲，故云樂器也。但角是扣木之聲，但作樂器之體，象此扣木之聲。雲“三分羽益一以生角，角數六十四”者，以天地人謂之三才，又陽數極於九，故《律曆志》雲“五聲之本生黃鍾，律之九寸為宮”，於管則九寸，於弦則九九八十一絲也。《律曆志》又云“或損或益，以定宮、商、角、徵、羽”。宮三分去一下生徵，徵數五十四；徵三分益一上生商，商數七十二；商三分去一下生羽，羽數四十八羽；三分益一上生角，角數六十四。是共損益相生之數也。《律曆志》雲：“商之為言章也，物成熟可章度也。角，觸也，觸地而出，戴芒角也。宮，中也，居中央，暢四方，唱始施生，為四聲綱也。徵，祉也，物盛大而蕃祉也。羽，聚也，聚藏宇覆之也。”雲“屬木者，以其清濁中，民象也”者，木之聲清於土金之聲，濁於水火之聲。今角聲亦清於宮商，濁於徵羽，故角聲屬木，所以清濁中。凡“數多者濁，數少者清”，今宮數八十一，商數七十二，徵數五十四，羽數四十八，角數六十四，少於宮商，多於徵羽，故云“清濁中”。既尊者為濁，卑者為清，民則卑於君臣，尊於事物，亦是尊卑之中，故云民之象也。按《樂記》及《律曆志》雲“宮為君，商為臣，角為民，徵為事，羽為物”。羽屬北方，其數少，所以黃鍾在子，其數多者，冬時凝寒之氣在於地上，水又清輕，羽既稟其寒氣，又象水聲，故其數少。冬至陽氣伏於地下，溫蛔芰中，黃鍾含藏陽氣，又象土聲，故其數多。各自為義，不相須也。引“《樂記》曰：角亂則憂，其民怨”者，證明角主於人。雲“凡聲尊卑取象五行”者，宮主土，土聲濁，其數多，故主君。商主金，金聲稍重，其數稍多，故為臣。角主木，木聲清濁中，其數多少中，故為民。徵主火，火聲稍輕，其數稍少，故為事，事謂人之所營事務也。羽為水，水聲極輕，其數最少，故為物也，物謂人之所用財物。指其所營謂之事，論其所用之體謂之物。人是萬物之靈，事物是人營作，故卑於人也。雲“大不過宮，細不過羽”者，按《國語》景王欲鑄無射，仱州鳩諫雲“大不逾宮，細不逾羽”，逾即過也。" }
      - { type: j, text: "律中大蔟。律，候氣之管，以銅為之。中猶應也。孟春氣至，則大蔟之律應。應謂吹灰也。大蔟者，林鍾之所生，三分益一，律長八寸。凡律空圍九分。《周語》曰：“大蔟所以金奏，贊陽出滯。”○律中，丁仲反，後放此；凡如此之例，十二月文注，皆可以類求之。蔟，七豆反，奏也。應，應對之應，下皆放此。長，直亮反，又如字。後皆放此。律空，徐音孔。其數八。數者，五行佐天地生物成物之次也。《易》曰：“天一地二，天三地四，天五地六，天七地八，天九地十。”而五行自水始，火次之，木次之，金次之，土為後。木生數三，成數八，但言八者，舉其成數。其味酸，其臭羶。木之臭味也。凡酸、羶者皆屬焉。○羶，失然反。其祀戶，祭先脾。春陽氣出，祀之於戶，內陽也。祀之先祭脾者，春為陽中，於藏直脾，脾為尊。凡祭五祀於廟，用特牲，有主有屍，皆先設席於奧。祀戶之禮，南面設主於戶內之西，乃制脾及腎為俎，尊於主北；又設盛於俎西，祭黍稷、祭肉、祭醴，皆三。祭肉，脾一，腎再，既祭，徹之，更陳鼎俎，設饌於筳前，迎屍，略如祭宗廟之儀。○脾，脾支反。藏，才浪反，後放此。直，丈吏反，又如字。下“宿直”同，後放此。奧，烏報反。腎，時忍反。" }
      - { type: z, text: "“律中大蔟”。○正義曰：上從“其日甲乙”，下終“其祀戶”，皆總主三月一時之事。此“律中大蔟”，惟主正月之氣，宜與東風解凍文次相連，必在於其此者，角是春時之音，律審正月之氣，音由氣成，以其音氣相須，故律角同處。言正月之時，候氣之管，中於大蔟，中猶應也，謂候氣飛灰，應於大蔟，其大蔟夾鍾，六律六呂之等，皆是候氣管名。言正月之時，律之候氣應於大蔟之管，又計大蔟管數，倍而更半，鑄之為鍾，名曰大蔟之鍾，是大蔟之鍾。元生於大蔟之律，是律在於前，鍾生於後，故《律曆志》雲：“黃帝使伶人氏，自大夏之西，崑崙之陰，坂竹之解谷，斷兩節間而吹之，以為黃鍾之宮，制十二筩，以聽鳳凰之鳴，其雄鳴則為六律，雌鳴則為六呂。”是律生在前。蔡氏以為大蔟鍾名，先有其鍾，後有其律，言律中此大蔟之鍾，其義非也。陽管為律，律，法也，言陽氣與陰氣為法，鄭雲“律，述也，述氣之管，陰管為呂”。《律曆志》雲“呂，助也。言助陽宣氣。”又云：“呂，拒也。言與陽相承，更迭而至。”又陰律稱同，言與陽同也。總而言之，陰陽皆稱律，故十二月皆雲“律中”是也。按《律曆志》雲“黃鍾，黃者，中之色，君之服也；鍾者，種也”，“陽氣施種於黃泉，孳萌萬物，為六氣元也”，“變動不居，周流六虛，位於子，在十一月。大呂，呂，旅也，言陰氣大旅，助黃鍾宣氣而牙物也，位於醜，在於十二月。大蔟，蔟，湊也，言陽氣大湊地而達物也，位於寅，在正月。夾鍾，鍾，鍾也；夾，助也，言陰夾助大蔟，宣四方之氣，而出鍾物也，位於卯，在二月。姑洗，洗之言絜也，言陽氣洗物姑絜之也，位於辰，在三月。仲呂，言微陰始起未成，著於其中，旅助姑洗，宣氣齊物也，位於巳，在四月。蕤賓，蕤，繼也；賓，道也，言陽氣始道陰氣，使繼養物也，位於午，在五月。林鍾，林，君也，陰氣受任，助蕤賓君主種物，使長大茂盛也，位於未，在六月。夷則，則，法也，言陽正法度，而使陰氣夷當傷之物，位於申，在七月。南呂，南，任也，言陰氣旅助夷則任成萬物也，位於酉，在八月。無射，射，厭也，言陽氣究物，而使陰氣畢剝落之，終而復始，無厭己也，位於戌，在九月。應鍾，言陰氣應無射，該藏萬物，而雜陽閡種也，位於亥，在十月”。其十二律，則有上生下生，同位異位，長短分寸之別，故鄭注《周禮·大師職》雲“其相生，則以陰陽六體為黃鍾初九也，下生林鍾之初六，林鍾又上生大蔟之九二，大蔟又下生南呂之六二，南呂又上生姑洗之九三，姑洗又下生應鍾之六三，應鍾又上生蕤賓之九四，蕤賓又上生大呂之六四，大呂又下生夷則之九五，夷則又上生夾鍾之六五，夾鍾又下生無射之上九，無射又上生中呂之上六。同位者象夫妻，異位者象子母，所謂律取妻而呂生子也。黃鍾長九寸，其實一籥。下生者三分去一，上生者三分益一，五下六上，乃一終矣。大呂長八寸二百四十三分寸之一百四，大蔟長八寸，夾鍾長七寸二千一百八十七分寸之千七十五，姑洗長七寸九分寸之一，中呂長六寸萬九千六百八十三分寸之萬二千九百七十四，蕤賓長六寸八十一分寸之二十六，林鍾長六寸，夷則長五寸七百二十九分寸之四百五十一，南呂長五寸三分寸之一，無射長四寸六千五百六十一分寸之六千五百二十四，應鍾長四寸二十七分寸之二十”是也。同位象夫妻者，則黃鍾之初九，下生林鍾之初六，同是初位，故為夫婦，又是律娶妻也。異位為子母者，謂林鍾上生大蔟，林鍾是初位，大蔟是二位，故云異位為子母，又是呂生子也。雲五下六上者，謂林鍾、夷則、南呂、無射、應鍾，皆被子午巳東之管，三分減一，而下生之。六上者，謂大呂、大蔟、夾鍾、姑洗、中呂、蕤賓，皆被子午已西之管，三分益一，而上生之。子午皆屬上生，應雲七上而云六上者，以黃鍾為諸律之首，物莫之先，似若無所稟生，故不數黃鍾也。其實十二律終於仲呂，還反歸黃鍾，生於仲呂，三分益一，大略得應黃鍾九寸之數也。《律曆志》雲“黃鍾為天統”，“林鍾為地統”，“大蔟為人統”，故數整，餘律則各有分數。○注“律候”至“出滯”。○正義曰：按司農注《周禮》雲：“陽律以竹為管，陰律以銅為管。”鄭康成則以皆用銅為之。知者，按《律曆志》“量者，籥合升斗斛”，“本起黃鍾之籥”，而五量如之，其法皆用銅，聲中黃鍾，以此準之，故知用銅也。司農雲陽律以竹，陰律以銅，非也。雲“應謂吹灰也”者，蔡邕雲：“以法為室三重，戶閉，塗釁必周密，布緹縵室中，以木為案，每律各一案，內庳外高，從其方位，加律其上，以葭灰實其端，其月氣至，則灰飛而管通。”如蔡所云，則是為十二月律，則布室內十二辰，若其月氣至，則其辰之管灰飛而管空也。然則十二律，各當其辰，邪埋地下，入地處庳，出地處高，故云“內庳外高”。黃鍾之管，埋於子位，上頭向南，以外諸管，推之可悉知。又律雲，以河內葭莩為灰，宜陽金門山竹為管。熊氏雲：“按吹灰者，謂作十二律管，於室中四時位上埋之，取蘆莩燒之作灰，而實之律管中，以羅縠覆之，氣至則吹灰動縠矣。小動為氣和，大動為君弱臣強專政之應，不動縠為君嚴猛之應。”雲“凡律空圍九分”者，以黃鍾為諸律之首，諸律雖長短有差，其圍皆以九分為限。孟康雲“林鍾長六寸，圍六分”，則圍之大小，逐管長短。然則分寸之數不可定也，故鄭皆為圍九分也。引“《周語》曰”以下者，按《周語》景王欲鑄無射，伶州鳩對以此辭。按彼注云：“大蔟正聲商，故為金奏，所以助陽出滯物也。”○注“數者”至“成數”。○正義曰：“五行佐天地，生成萬物之次”者，五行謂金木水火土。謂之五行者，按《白虎通》雲：“行者，言欲為天行氣也”。謂之水者，《白虎通》雲“水訓準，是平均法則之稱也，言水在黃泉養物，平均有準則也。木，觸也，陽氣動躍，觸地而出也。火之為言化也，陽氣用事，萬物變化也。金訓禁也，言秋時萬物，陰氣所禁止也。土訓吐也，言土居中，總吐萬物也”。生物者，謂木火七八之數也。成物者，謂金水九六之數也。則春夏生物也，春冬成物也。故《易·系辭》雲“精氣為物，游魂為變”也，注云“精氣謂七八，游魂謂九六，則是七八生物，九六終物”是也。引《易》曰：“以下者，《易·下》系文也。天陽地陰，陽數奇，陰數耦。陽所以奇者，陽為氣，氣則渾沌為一，無分別之象；又為日，日體常明，無虧盈之異，故其數奇。其陰數所以耦者，陰為形，形則有彼此之殊；又為月，則有晦朔之別，故其數耦。按《律曆志》雲：“天數二十五”，所以二十五者，天一、天三、天五、天七、天九，總為二十五。《律曆志》又云：“地數三十”者，地二、地四、地六、地八、地十，故三十也。以天地之數相合，則《易》之大衍之數五十五也。雲：“五行自水始，火次之，木次之，金次之，土為後”者，天一生水於北，地二生火於南，三生木於東，地四生金於西，天五生土於中，以益五行生之本。按《尚書·洪範》雲：“一曰水，二曰火，三曰木，四曰金，五曰土”故其次如是也。所以一曰水者，乾貞於十一月子，十一月一陽生，故水數一也，又天地之內，水體最微，故水為始也；二曰火者，坤貞於六月未，六月兩陰生，陰不敢當午，火比於水，嚴厲著見，故次火也；三曰木者，正月三陽生，是建寅之月，故三曰木，木比火象有體質，故次木也；四曰金者，八月四陰生，是建酉之月，故四曰金，金比木，其體堅剛，故次金也；五曰土者，三月五陽生，三月建辰之月，辰為土，是四季之首，土王四季，故五曰土載四行，又廣大，故次土也。水所以在北方者，從盛陰之氣，所以潤下者，下從陰也。火所以在南方者，從盛陽之氣，炎上者，從陽也。木所以在東者，東是半陰半陽，曲直以陰陽俱有，體質尚柔，故可曲可直也。金所以在西方者，西方亦半陰半陽，但物既成就，體性堅之，雖可改革，猶須火柔之。土所以在中者，以其包載四行，含養萬物為萬物之主，稼者，所以養萬物也。雲：“木生數三，成數八”者，鄭注《易·系辭》雲：“天一生水於北，地二生火於南，天三生木於東，地四生金於西，天五生土於中。陽無耦，陰無配，未得相成。地六成水於北，與天一併；天七成火於南，與地二並；地八成木於東，與天三並；天九成金於西，與地四並；地十成土於中，與天五並也。大衍之數五十，有五行各氣並，氣並而減五，惟有五十，以五十之數，不可以為七八九六卜筮之佔以用之，故更減其一，故四十有九也。”是鄭注之意，水數一，成數六，火數二，成數七，木數三，成數八，金數四，成數九，土數五，成數十，故此雲：“木生數三，成數八”。“但言八者，舉其成數”者，金木水火以成數為功，皇氏用先儒之義，以為金木水火得土而成，以水數一，得土數五，故六也；火數二，得土數五，為成數七；木數三，得土數五，為成數八，又金數四，得土數五，為成數九。此非鄭義，今所不取。○注“木之”至“屬焉”。○正義曰：通於鼻者謂之臭，在口者謂之味，臭則氣也。所以“木味酸”，《尚書》孔傳雲“木實之性”。然則木實酸。凡草木所生，其氣羶也。夏“其味苦，其臭焦”者，《尚書》孔傳雲：“焦之氣味，火燒物焦，焦則味苦”。中央雲：“其味甘，其臭香”，孔傳雲“甘味生於百穀，味甘則氣香”。秋“其味辛，其臭腥”者，孔傳雲“金之氣味，言金臭之氣則腥，在口則辛”。冬雲“其味鹹，其臭朽者”，孔傳雲“水滷所生，故味鹹。又水受惡穢，故有朽腐之氣”。○注“春陽”至“之儀”。○正義曰：“春陽氣出，祀之於戶”者，戶在內，從外向內，戶又在內，故云：“內陽也”。戶是人之出八，戶則有神，故《祭法》注“七祀”雲：“小神居人之間，司察小過，作譴誥者爾。”此戶神則陽氣在戶內之神，故云“祀之於戶，內陽也”，由位在戶內。又秋“其祀門”，注云“秋陰氣出，祀之於門”者，門在外，從內向外，門又在外，故云“外陰也”。則門神陰氣之神，是陰陽彆氣在門戶者，與人作神也。又云“春為陽中，於藏值脾，脾為尊”者，以祭戶之時，脾腎俱有，先用脾以祭之者，以春為陽中，於藏值脾。脾既春時最尊，故先祭之，脾為尊也。所以春位當脾者，牲立南首，肺祭在前而當夏也，腎最在後而當冬也。從冬稍前而當春，從腎稍前而當脾，故春位當脾。從肺稍卻而當心，故中央主心。從心稍卻而當肝，故秋位主肝。此等直據牲之五藏所在而當春夏秋冬之位耳。若其五行所生，主五藏，則不然矣。故《異義》雲：“《今文尚書》歐陽說：肝，木也；心，火也；脾，土也；肺，金也；腎，水也。《古尚書》說：脾，木也；肺，火也；心，土也；肝，金也；腎，水也。許慎按：《月令》‘春祭脾，夏祭肺，季夏祭心，秋祭肝，冬祭腎’。”與《古尚書》同。鄭駮之雲：“《月令》祭四時之位，及其五藏之上下次之耳。冬位在後而腎在下，夏位在前而肺在上，春位小前故祭先脾，秋位小卻故祭先肝。腎也、脾也，俱在鬲下。肺也、心也、肝也，俱在鬲上。祭者必三，故有先後焉，不得同五行之氣，今醫疾之法，以肝為木，心為火，脾為土，肺為金，腎為水，則有瘳也。若反其術，不死為劇。”如鄭此言，五行所主，則從《今文尚書》之說，不同許慎之義。雲“凡祭五祀於廟，用特牲”之下，皆《中霤禮》文。雲“祭五祀於廟”者，設祭戶，祭中霤，在於廟室之中，先設席於廟堂之奧。若祀灶、祀門、祀行，皆在廟門外，先設席於廟門之奧。雖廟室廟門有別，總而言之，皆謂之廟，故云“凡祭五祀於廟”。此謂殷禮也，若周則七祀，加司命與厲也。不審祀之處所，亦當與灶、門、行等俱在廟門之外祀也。若周總在宮內，故《宮正》注云“祭社稷七祀於宮中”。此特牲謂特牛，故《小司徒》雲：“小祭祀，奉牛牲。”注云：“小祭祀，王玄冕所祭，若諸侯或亦當然。其大夫所祭，或特羊也。”雲“有主有屍”者，謂天子諸侯。若卿大夫廟無主，則五祀無主也。雲“祀之禮設主於戶內西”者，先設席於奧，乃更設席於廟，戶西，夾北鄉置主位，設主之人南面，設主於戶西位上，使主北面。雲“乃制脾及腎為俎，奠於主北”者，謂設主之後，以割制脾之與腎為俎實，奠於主北，主既北面，奠於主前。雲“又設盛於俎西”者，盛於黍稷，俎在主前稍東，故黍稷之簋在主前稍西。雲“祭黍稷、祭肉、祭醴，皆三”者，當時惟始設主，未有迎屍，則是祀官祭簋中黍稷，祭俎中脾腎之肉，祭薦之醴，皆三度祭之，黍亦三祭，醴亦三祭，肉亦三祭，故云“皆三”。雲“祭肉，脾一，腎再”者，申明祭肉三度之事，其祭肉三者，脾尊故一祭，腎脾故再祭。雲“既祭，徹之，更陳鼎俎，設饌於筵前”者，謂既祭黍稷、祭肉、醴之後，徹去俎之與盛，更陳列鼎俎，設其饌食於初設奧之筳前，其時主已移於筵上，主人出戶迎屍，屍入即筵而坐，但宗廟之祭，屍入之後，始祭籩豆及黍、稷、醴。其祭戶之時，已於西祭黍、祭肉、祭醴。今迎屍而入，則應坐而饌食，不更祭黍稷、祭肉、祭醴，故云“略如祭宗廟之儀”。祭戶所以先設席於奧，乃設饌筵迎屍皆在奧者，就尊之處也。中間設主，祭黍祭肉祭醴。戶西者，就戶處也。其餘五祀所祭，設主皆就其處也。" }
      - { type: j, text: "東風解凍，蟄蟲始振，魚上冰，獺祭魚，鴻雁來。皆記時候也。振，動也。《夏小正》“正月啟蟄”，“魚陟負冰”。漢始亦以驚蟄為正月中。此時魚肥美，獺將食之，先以祭也。雁自南方來，將北反其居。今《月令》“鴻”皆為“候”。" }
      - { type: z, text: "“東風”至“雁來”。○正義曰：此記正月之時候，然十二月之時候，體例不一，而正月、七月記時候，凡有五句，自餘皆四句。多少不同者，時候多則五句，少則四句，無義例也。其二至二分之月，皆再記於時候者，以二至是陰陽之始終，二分是陰陽之交會，是節之大者，故再記之。季春亦記時候者，蠶之將生，故記其蠶候也，故季春“鳴鳩拂其羽，戴勝降於桑”，注“蠶將生之候”是也。凡記時候，先言者則氣候在前，後言者則氣候在後。言“蟄蟲始振”者，謂正月中氣之時，蟄蟲得陽氣，初始振動，至二月乃大驚而出，對二月故云“始振”。雲“魚上冰”者，魚當盛寒之時，伏於水下，逐其溫暖，至正月陽氣既上，魚游於水上，近於冰，故云“魚上冰”也。○注“夏小”至“為候”。○正義曰：《夏小正》，《大戴禮》之篇名。雲“正月啟蟄”者，證經中“蟄蟲始振”，始振則啟蟄也。雲“魚陟負冰”者，陟，升也，謂魚從水下升於冰上而負冰，證經中“魚上冰”。雲“漢始亦以驚蟄為正月中”者，以漢之時立春為正月節，驚蟄為正月中氣，雨水為二月節，春分為二月中氣。至前漢之末，以雨水為正月中，驚蟄為二月節，故《律曆志》雲：“正月立春節，雨水中。二月驚蟄節，春分中。”是前漢之末，劉歆作《茸艹歷》，改驚螫為二月節。鄭以舊曆正月啟蟄，即驚也，故云“漢始亦以驚蟄為正月中”。但蟄蟲正月始驚，二月大驚，故在後移驚蟄為二月節，雨水為正月中，凡二十四氣。按《茸艹歷》：“正月節立春，雨水中。二月節驚蟄，春分中。三月節穀雨，清明中。四月節立夏，小滿中。五月節芒種，夏至中。六月節小暑，大暑中。七月節立秋，處暑中。八月節白露，秋分中。九月節寒露，霜降中。十月節立冬，小雪中。十一月節大雪，冬至中。十二月節小寒，大寒中。”桉《通卦驗》及今歷，以清明為三月節，穀雨為三月中，餘皆與《律曆志》並同。謂之雨水者，言雪散為雨水也。謂之驚蟄者，蟄蟲驚而走出。謂之穀雨者，言雨以生百穀。謂之清明者，謂物生清淨明絜。謂之小滿者，言物長於此，小得盈滿。謂之芒種者，言有芒之穀，可稼種。謂之小暑大暑者，就極熱之中，分為小大，月初為小，月半為大。謂之處暑者，謂暑既將退伏而潛處。謂之白露者，陰氣漸重，露濃色白。謂之寒露者，言露氣寒，將欲凝結。謂之小雪大雪者，以霜雨凝結而雪，十月猶小，十一月轉大。謂之小寒大寒者，十二月極寒之時，相對為大小，月初寒為小，月半寒為大。凡二十四氣，氣有十五日有餘；每氣中半分之，為四十八氣，氣有七日半有餘，故鄭注《周禮》雲“有四十八箭”，是一氣易一箭也。凡二十四氣，每三分之，七十二氣，氣間五日有餘，故一年有七十二候也。故《通卦驗》：“冬至之前五日，商賈不行，兵甲伏匿，人主與群臣左右從東爾。”五日，以五日一候也。按《通卦驗》雲“立春，雨水降，條風至，雉雊雞乳，冰解”。條風，即東風也。冰解，即解凍也。與《月令》同。雨水者，謂節氣早，月初雨水也。雉雊雞乳，於《月令》在季冬，若節氣晚，亦得退在正月。《通卦驗》雲“正月中，猛風至”，注云“猛風，動搖樹木有聲”者，猛風即東風之甚也。“獺祭魚”與此同。按下季冬“雁北鄉”，據其從南始北，正月來至中國，故此雲“鴻雁來”。但來有先後，後者二月始來，故《通卦驗》二月節雲“候雁北”。雲“今《月令》鴻皆為候”者，但《月令》出有先後，入《禮記》者為古，不入《禮記》者為今，則《呂氏春秋》是也，“鴻”字皆為“候”也。" }
      - { type: j, text: "天子居青陽左個，乘鸞路，駕倉龍，載青旂，衣青衣，服倉玉，食麥與羊，其器疏以達。皆所以順時氣也。青陽左個，大寢東堂北偏。鸞路，有虞氏之車，有鸞和之節，而飾之以青，取其名耳。春言鸞，冬夏言色，互文。馬八尺以上為龍。凡所服玉，謂冠飾及所珮者之衡璜也。麥實有孚甲，屬木。羊，火畜也。時尚寒，食之以安性也。器疏者刻鏤之，象物當貫土而出也。凡此車馬衣服，皆所取於殷時而有變焉，非周制也。《周禮》：“朝祀戎獵事服各以其事，不以四時為異。”又《玉藻》曰：“天子龍捲以祭，玄端而朝日，皮弁以日視朝。”與此皆殊。○個，古賀反，後放此。鸞，力官反。路，本又作輅。載音戴，後放此。旂，巨機反，後放此。衣青，於既反，後放此，下注“衣甲保”、“猶衣”同。，本又作器，同。冬夏，此卷內可以意求之。璜音黃。畜，許六反。貫，古亂反。朝，直遙反，下文注同。卷，本又作袞，古本反。玄端音冕。" }
      - { type: z, text: "“天子”至“以達”。○正義曰：此巳前明天時氣侯早晚，此明天子每時居處及所乘車馬、所建旌旗、所服衣玉、所食牲穀及器物之屬。龍與玉言蒼者，蒼亦青也，遠望則蒼。旂與衣雲青者，欲見人功所為，故以近色言之。○注“皆所”至“皆殊”。○正義曰：色則順時，食與器則順氣也。雲“青陽左個，大寢東堂北偏”者，北偏，近北也。然則此是明堂北偏，而云大寢者，欲明明堂與大廟大寢制同，故兼明於明堂聽朔竟，次還大廟，次還大寢也。然雲東堂，則知聽朔皆堂，不於五角之室中也。雲“鸞路，有虞氏之車”者，《明堂位》雲：“鸞車，有虞氏之路也。”今既雲鸞路，故知是有虞氏之車也。用有虞氏，則知非周也。雲“有鸞和之節，而飾之以青，取其名耳”者，因其有鸞，故不言青而云鸞也。雲“春言鸞，冬夏言色，互文”者，春言鸞，則夏秋冬並鸞也。夏雲朱，冬雲玄，則春青秋白可知也。雲“馬八尺以上為龍”者，出《庾人職》。雲“凡所服玉，謂冠飾及所佩者之衡璜”者，冠飾即冕之旒及笄也。衡璜即是所佩玉之名也。佩玉之制，按《韓詩外傳》雲“佩玉，上有蔥衡，下有雙璜牙，蠙珠以納其間”，則古之佩玉，上以蔥為衡，橫置於上，以貫珠之繩三條縣於衡上，垂之而下，以雙璜懸於兩畔繩之下端，又以牙懸於中繩下端，使前後觸璜以為聲，衡之下，璜之上，皆貫蠙珠，故云“蠙珠以納其間”，謂納於衡璜之間也。雲“麥實有孚甲，屬木”者，鄭雲“黍秀舒散，屬火。麻實有文理，屬金。菽實孚甲堅合，屬水。稷五穀之長，屬土”，是五穀所配之方也。雲“羊，火畜也”者，按《尚書·五行傳》曰“貌之不恭，則有雞禍”，注“雞，畜之有冠翼者，屬貌”；“言之不從，則有犬禍”，注“犬，畜之以口吠守者，屬言”；“視之不明，則有羊禍”，注“羊畜之遠視者，屬視”；聽之不聰，則有豕禍”，注“豕，畜之居閒衛而聽者，屬聽”；“思之不睿，則有牛禍”，注“地厚德載物，牛，畜之任重者，屬思”；“王之不極，則有馬禍”，注“天行健，馬，畜之疾行者，屬王極”。是雞為木畜，羊為火畜，牛為土畜，犬為金畜，豕為水畜。但陰陽取象多塗，故午為馬，酉為雞，不可一定也。雲“時尚寒，食之以安性也”者，羊是火畜，而春時食之，明其有意食以安性也。春時尚寒，故食火畜以助之。夏食菽與雞者，以氣尤熱，水能克火，木必折土，故食北方之聲與東方之性，減其熱氣，亦以安性。秋食麻與犬者，秋氣既涼，又將鄉寒，不有其害，故食當方之穀牲也。冬食黍與彘者，冬氣極寒，故食火穀以減寒，寒勝於熱，故食當方之牲。雲“器疏者刻鏤之，象物當貫土而出也”者。諸刻鏤為文，使文理粗疏，直而通達也。雲“凡此車馬衣服，皆所取於殷時而有變焉，非周制也”者，以虞夏之制，有日月星辰十二章之服，周之制，朝祀戎獵車服各有殊。今此下與《周禮》不同，上與虞夏又異，故云“取殷時”也。殷乘木路，此乘鸞路，不純用殷，故云“而有變焉”，謂變殷而乘虞路也。雲“《周禮》朝祀戎獵車服，各以其事，不以四時為異”者，按《周禮》朝則皮弁服，祀則六冕服，戎則韋弁服，田獵冠弁服。又《周禮》朝乘象路，祀乘玉路，戎乘革路，獵乘木路。是車服各以其事，不以四時為異也。又引《玉藻》“天子龍袞以祭”者，證四時皆龍袞衣纁裳，不隨時而別。又引《玉藻》“玄端而朝日”者，證此朝日不玄端而著青衣。又引“皮弁以日視朝”者，皮弁白布衣，四時皆然，不隨時而變。是與此皆殊，明《月令》所云非周法也。" }
      - { type: j, text: "是月也，以立春。先立春三日，大史謁之天子曰：“某日立春，盛德在木。”天子乃齊。太史，禮官之屬，掌正歲年以序事。謁，告也。○先，悉薦反。齊，側皆反，本亦作齋，卷內放此。立春之日，天子親帥三公、九卿、諸侯、大夫，以迎春於東郊。還反，賞公、卿、諸侯、大夫於朝。迎春，祭蒼帝靈威仰於東郊之兆也。《王居明堂禮》曰：“出十五里迎歲。”蓋殷禮也。周近郊五十里。賞謂有功德者有以顯賜之也。朝，大寢門外。○還音旋，後放此。" }
      - { type: z, text: "“是月”至“於朝”。正義曰：此一節論立春天子迎春氣及行賞之事，各依文解之。○“是月也，以立春”者，十二月節氣有早晚，若節氣晚，則月之節氣在當月之內；若節氣早，月之節氣在前月之中。故立春為正月之節，有在十二月之時。但至立春之時，雖在十二月，即行立春之事。雲“是月”者，謂是月之氣，不謂是月之日也。凡四立之月，天子車服之下，皆雲是月，以其為下立春、立夏、立秋、立冬事重，故云是月。其非四立之月，仲夏即雲養壯佼，季夏雲命漁師剩敓一月雲飭死事，十二月雲命有司大難，皆不雲是月者，或是事為細小，或是事通他月，故不雲是月。季冬難事雖大，惟此月為之，亦不雲是月者，以年事既終，惟難而巳，故不須雲是月。或作記之人，辭有詳略，不為義例也。凡言是月者，是月之後，若是事相連接，辭有首尾，則因前是月，不別起是月之文；若別事異端，則更雲是月也，他皆仿此。此雲“是月”，下至“以初為常”，是皆立春之時告命之事，故不更雲是月。次雲“祈穀於上帝”，至“命曰勞酒”，論祈穀耕藉，反回勞飲，是其一事，故不更雲是月。次雲“是月也，命樂正入學習舞”至“埋胔”，論習舞修祭，母用牝牲，是含養之事，故毋覆巢及掩骼埋胔，中間小異，事亦相連，故不別雲是月。次雲“是月也，不可以稱兵”，與上事別，又論天地人之大道，故別雲是月。舉此為例，其餘月或雲是月，或不雲是月，就文可知。○“先立春三日”者，周法，四時迎氣，皆前期十日而齋，散齋七日，致齋三日。今秦法簡省，故三日也。蓋散齋二日，致齋一日。○“盛德在木”者，天以覆蓋生民為德，四時各有盛時，春則為生，天之生育盛德在於木位，故云“盛德在木”。○注“大史”至“謁告”也。○正義曰：按《周禮》大史屬春官，春官主禮，故云“大史，禮官之屬”。雲：“掌正歲年以序事者，大史職文鄭注云：“中數曰歲，朔數曰年。”中數者，謂十二月中氣一週，總三百六十五日四分之一，謂之一歲。朔數者，朔，十二月之朔，一週謂三百五十四日，謂之為年。此是歲年相對，故有朔數、中數之別。若散而言之，歲亦年也。故《爾雅·釋天》雲“唐虞曰載，夏曰歲，商日祀，周曰年”是也。按《釋言》雲：“告、謁，請也。”同訓為請，是謁為告也。○“立春”至“於朝”。○此立春立秋雲“天子親帥三公、九卿、諸侯、大夫”，立夏立冬雲“親帥三公、九卿、大夫”，不雲諸侯，文不備，當亦有諸侯，故立夏下雲“乃封諸侯”。於夏既然，明冬諸侯亦然。在孟春雲“賞公、卿、諸侯、大夫於朝”，孟夏雲“還乃行賞封諸侯，慶賜遂行，無不欣說”，孟秋雲“還乃賞軍帥武人於朝”，孟冬雲“還乃賞死事恤孤寡”。四時所賞不同者，庾雲：“順時氣也。春陽氣始著，仁澤之時，故順其時而賞朝臣及諸侯也。至夏陽氣尢盛，萬物增長，故用是時慶賜轉廣，是以無不欣說也。秋陰氣始著嚴凝之時，故從其時而賞軍帥及武人也。至冬陰氣尤盛，萬物衰殺，故用是時賞死事者及其妻子也。”○注“迎春”至“門外”。○正義曰：按賈、馬、蔡邕皆為迎春祭大皞及句芒，以上雲“其帝大皞，其神句芒”故也。今鄭獨以為蒼帝靈威仰者，以《春秋文耀鉤》雲：“蒼帝靈威仰。”《禮器》雲：“饗帝於郊，而風雨寒暑時。”是人帝，何能使風雨寒暑得時？又《詩》及《尚書》雲，上帝皆為天也。《周禮·司服》雲：“王祀昊天上帝，則服大裘而冕，祀五帝亦如之。”五帝若是人帝，何得與天帝同服？故以為靈威仰。上雲“盛德在木”者，盛德則靈威仰之盛德也。雲“王居明堂禮”者，《逸禮》之篇名。引之者，證十五里迎春與周不同，故云“蓋殷禮也”。雲“周近郊五十里”者，鄭注《尚書·君陳序》雲：“天子近郊五十里。”今河南洛陽相去則然是也。雲“朝，大寢門外”者，大寢則路寢。天子有三朝，一是燕朝，在路寢也。二是治朝，則此路寢門外，應門之內，以其賞賜公卿大夫，宜在治事之朝，故云“大寢門外”。三是外朝，在庫門之外，皋門之內，大詢眾庶，聽斷罪人之處也。" }
      - { type: j, text: "命相佈德和令，行慶施惠，下及兆民。相，謂三公，相王之事也。德，謂善教也。令，謂時禁也。慶，謂休其善也。惠，謂恤其不足也。天子曰兆民。○相，息亮反，注同，下“善相”並注放此。施如字，又始豉反。休，許收，許虯二反，美也。慶賜遂行，毋有不當。遂猶達也。言使當得者皆得，得者無非其人。○毋音無，本亦作無，下同。當，下浪反。" }
      - { type: z, text: "“命相”至“不當”。○正義曰：此一經因上天子迎春反國，命三公佈教施惠之事，各依文解之。○注“相謂”至“兆民”。○正義曰：按《公羊》隱五年傳雲：“三公者何？天子之相也。自陝而東者，周公主之。自陝而西者，召公主之。”一相處乎內，是三公相王之事也。至六國時，一人知事者，特謂之相，故《史記》稱穰侯、範睢、蔡澤皆為秦相，後又為丞相也。雲“天子曰兆民”者，《左傳》閔元年晉卜偃之辭也。○注“遂猶”至“其人”。○正義曰：遂是申遂，故《尚書》雲：“顯忠遂良。”《商頌》雲：“莫遂莫達。”是遂為達，言慶賜之事，通達施行，使之周遍。雲“使當得者皆得，無非其人也”者，謂當慶賜之人，皆是有功可慶賜，無此不合得慶之人。非人，謂無功無德之徒。" }
      - { type: j, text: "乃命大史，守典奉法，司天日月星辰之行，宿離不貸，母失經紀，以初為常。典，六典。法，八法也。離，讀如儷偶之儷。宿儷，謂其屬馮相氏、保章氏，掌天文者，相與宿偶，當審候伺不得過差也。經紀，謂天文進退度數。○宿，息六反，徐音秀。離，依注音儷，呂計反，偶也。貸，吐得反，徐音二。馮音憑。相，息亮反，又如字。伺音司，又息嗣反。" }
      - { type: z, text: "“乃命”至“為常”。○正義曰：迎春既還，行賞以畢，乃命大史之官，令守其六典，奉其八法，司主天文及日月星辰之行。天則左還，一日一度，一年三百六十五度四分度之一，又至週一度，日月五星並逆行天右行，各有多少，辰有二十八宿，亦隨天左行。大史令其屬官，在其候處，止宿配偶，相與審候，不得貸變過差。若應候不候，應知不知，則是候過差。“無失經紀”者，經紀謂天文進退度數，言當推勘考校，使得其中，應進則言進，應退則言退。若其推步不明，算曆失所，遲疾不依其度，進退或失其常，是失經紀。○“以初為常”者，初謂舊來所法，恆須遵奉，以為常行，故云“以初為常”。○注“典六”至“度數”。○正義曰：“六典”者，則《太宰》雲：天官治典，地官教典，春官禮典，夏官政典，秋官刑典，冬官事典。八法者：一曰官屬，二曰官職，三曰官聯，四曰官常，五曰官成，六曰官法，七曰官刑，八曰官計。雲“離讀為儷偶之儷”者，按成十一年《左傳》雲：“鳥獸猶不失儷。”禮有儷皮，儷是配偶，故云“讀如儷偶之儷”。雲“馮相氏、保章氏掌天文者”，馮相、保章，皆中土二人。“馮相”者，鄭注“馮，乘也。相，視也。世登高臺，以視天文之次序”。“保章”者，鄭注：“保，守也。世守天文之變。”雖俱掌天文，其事不同，馮相氏主日月五星，年氣節候，推步遲疾，審知所在之處，若今之司歷，主其筭術也。保章者，謂守天之文章，謂天文違變度數，失其恆次，妖孽所在，吉凶所生，若今之天文家，惟主變異也。此其所掌別也。雲“相與宿偶，常審候伺不得過差”者，言大史之官，使其僚屬馮相、保章恆在候處，相與止宿配偶，其審察伺候，不得怠慢，不覺天之變異也。" }
      - { type: j, text: "是月也，天子乃以元日，祈穀於上帝。謂以上辛郊祭天也。《春秋傳》曰：“夫郊祀后稷，以祈農事。是故啟蟄而郊，郊而後耕。”上帝，大微之帝也。乃擇元辰，天子親載耒耜，措之於參保介之御間，帥三公、九卿、諸侯、大夫躬耕帝藉。天子茸芷，三公五推，卿諸侯九推。元辰，蓋郊後古辰也。耒，耜之上曲也。保介，車右也。置耒於車右與御者之間，明巳勸農，非農者也。人君之車，必使勇士衣甲居右而參乘，備非常也。保猶衣也。介，甲也。帝藉，為天神借民力所治之田也。○耒，力對反，《字林》雲：“耕曲木，垂所作，力隹反。”又力水反。”耜音似。措，七故反，置也。介音界，注同。藉，在亦反，《說文》作“耤”，雲“帝耤千畝”。推，出隹反，又吐回反，下同；推謂伐也。乘，繩證反。為，於偽反，下“為神春”、“為傷”、“為死氣”皆同．反。執爵於大寢。三公、九卿、諸候、大夫皆御，命曰勞酒。既耕而宴飲，以勞群臣也。大寢，路寢。御，侍也。○勞，力報反，注同。" }
      - { type: z, text: "“是月”至“勞酒”。○正義曰：此一節論迎春既反，春事巳起，當祈穀親耕燕勞之事，各依文解之。○注“謂以”至“之帝”。○正義曰：按《郊特牲》雲：“郊之用辛。”鄭注：“凡為人君，當齋戒自新。”又云：“郊之祭也，迎長日之至。”鄭注引《易說》雲“茸荃之郊，一用夏正”，春分而日迎長，故云“迎長日之至”。《郊特牲》雲郊不言祈穀，此經言祈穀不言郊，鄭以為二祭是一，故此注謂“以上辛郊祭天也”。鄭既以二祭為一，恐人為疑，故引《春秋傳》以明之。按襄七年《左傳》雲：孟獻子曰：“郊祀后稷，以祈農事也。是故啟蟄而郊，郊而後耕。”彼祈農事者，則此祈穀也。彼雲郊而後耕，此是祈穀之後即躬耕帝藉，是祈穀與郊一也。雲“上帝，大微之帝”者，《春秋緯》文。紫微宮為大帝，大微為天庭，中有五帝座，是即靈威仰、赤熛怒、白招拒、汁光紀、含樞紐。祈穀郊天之時，各祭所感之帝，殷人則祭汁光紀，周人則祭靈威仰，以其不定，故總雲“大微之帝，若迎春之時，前帝后王，皆祭靈威仰，故前注云“迎春，祭蒼帝靈威仰”，特指一帝也。此郊雖祈穀，亦是報天，故《郊特牲》雲“郊之祭也”，“大報天而主日也”。○“乃擇元辰”至“九推”，甲乙丙丁等謂之日，郊之用辛，上雲“元日”。子醜寅卯之等謂之為辰，耕用亥日，故云“元辰”。○“天子親載耒耜”者，謂天子所乘車上，親載耕田之耒耜。“措之於參保介御之間”者，措，置也。保介，車右也。御者，御車之人。車右及御人，皆是主參乘。於時天子在左，御者在中，車右在右。言置此耒器於參乘保介及御者之間，然後帥三公九卿而往南郊躬耕藉田也。○注“元辰”至“之田”。○正義曰：知用亥者，以陰陽式法，正月亥為天倉，以其耕事，故用天倉也。盧植、蔡邕並雲：“郊天是陽，故用日，耕藉是陰，故用辰。”元者善也。郊雖用日，亦有辰，但日為吉主。耕之用辰，亦有日，但辰為主。皇氏雲：“正月建寅，日月會辰在亥，故耕用亥也。”未知然否？雲“置耒耜於車右與御者之間，明已勸農，非農者也”，王既親載耒器，置耒應須近王。今置耒乃於參御二人之間，不近王者，明王之巳身但是勸農，故載耒耜，非實農人，故不近耒器也。所以車右衣甲者，以人君尊重，故使勇士衣甲居右，備非常也。雲“保猶衣”者，保即襁保，保謂小被，所以衣覆小兒，故云“保猶衣也”。雲“帝藉，為天神借民力所治之田”者，耕藉所以為帝藉者，舉尊言之，故《祭義》雲：“天子為藉千畝，以共齊盛。”又《國語》雲：“宣王即位，不藉千畝。虢文公諫曰：‘夫民之大事在農，上帝之粢盛於是乎出。’”是藉田共上帝，故云“為天神借民力所治之田也”。按此立春後始郊，郊之後始耕。按《國語》：“先時九日，大史告以耕事。”注：“先，先立春日也。”謂先立春之前以耕，與此不同者，《國語》告耕在立春之前，其實耕時在立春之後，故《國語》下雲“先時五日”，“王即齋宮”，注“先耕時也”。是耕前五日，王即齋宮而齋，是知親耕在立春之後也。此言“天子茸芷，公五推，卿諸侯九推”，按《國語》：“王耕一發，班三之。”賈逵注：“班，次也，謂公卿大夫也。天之下各三其上也。王一發，公三發，卿九發，大夫二十七發。”天子茸芷，公五推，卿諸侯九推，此是貴賤耕發相三之數也。不雲士者，士賤不與耕也，故《國語》雲：“庶人終於千畝。”又《周禮》甸師是下士，雲“帥其屬而耕耨王藉”，鄭注云“庶人，謂徒三百人”。○注“既耕”至“路寢”。○正義曰：按《國語》耕後“宰夫陳饗”，“膳夫贊王，王歆大牢”。是耕後設饗。而此雲“既耕而燕飲”者，饗禮在廟，燕禮在寢。此雲“執爵於大寢”，故知燕也。《國語》雲饗者，蓋用饗之饌具而行燕禮，以勞群臣。按上迎春而反，賞公卿大夫於路寢門外正朝。此耕藉而反，勞群臣在於路寢。不同者，爵賞公事，與眾共之，故在正朝；燕勞私禮，主於歡心，故在路寢。" }
      - { type: j, text: "是月也，天氣下降，地氣上騰，天地和同，草木萌動。此陽氣蒸達，可耕之候也。《農書》曰：“土長冒橛，陳根可拔，耕者急發。”○上，時掌反，注“土上”同。萌，莫耕反。烝音證，又之烝反。冒，莫報反，覆也。橛，求月反。王命布農事，命田舍東郊，皆脩封疆，審端經術。田謂田畯，主農之官也。舍東郊，順時氣而居以命其事也。封疆，田首之分職。術，《周禮》作遂，“夫間有遂，遂上有徑”。遂，小溝也。步道曰徑。《今尚書》曰“分命羲仲，宅嵎夷”也。○疆，居良反，注皆同。徑術，古定反，注同；術依注音遂。畯音俊。分，扶間反。嵎音愚。善相丘陵、阪險、原隰、土地所宜，五穀所殖，以教道民，必躬親之。相，視也。○阪險，上音反，又蒲版反；下許檢反。道音導。田事既飭，先定準直，農乃不惑。說所以命國舍東郊之意也。準直，謂封疆徑遂也。《夏小正》曰：“農率均田。”○飭音敕。率，所類反，謂田正。" }
      - { type: z, text: "“天氣”至“不惑”。○正義曰：此一節論少陽之月，務其始生，故既耕之後，當勸農事，各依文解之。○“天氣下降”者，天地之氣謂之陰陽，一年之中，或升或降，故聖人作象，各分為六爻，以象十二月。陽氣之升，從十一月為始，陽氣漸升，陰氣漸下，至四月六陽皆升，六陰皆伏。至五月一陰初升，陰氣漸升，陽氣漸伏，至十月六陰盡升，六陽盡伏。然則天氣下降，地氣上騰，五月至十月也。地氣下降，天氣上騰，十一月至四月也。今正月雲“天氣下降，地氣土騰”者，陽氣五月之時，為陰從下起，上鄉排陽氣，第六陽氣上極反退，至十月之時，六陽退盡，皆伏於下。至十一月，陽之一爻始動地中，至十二月陽漸升，陽尚微，未能生物之極。正月三陽既上，成為乾卦，乾體在下；三陰為坤，坤體在上，乾為天，坤為地。今天居地下，故云“天氣下降”；地在天上，故云“地氣上騰”。是陽氣五月初降，至正月為天體而在坤下也。十一月一陽初生，而上排陰，陰之上六漸退，反歸於下，至四月陰爻伏盡，六陽在上。五月一陰生，六月二陰生，陰氣尚微，成物未具，七月三陰生而成坤體，坤體在下，三陽為乾而體在上，則是地氣在下，天氣在上，故正月為泰，泰，通也，天地交通；七月為否，否，塞也。言天地隔塞。所以十月雲“地氣下降，天氣上騰”者，以十月之時，純陰用事，地體凝凍，寒氣逼物，地又在下，故云“地氣下降”。於時六陽從上退盡，無複用事，天體在上，不近於物，似若陽歸於天，故云“天氣上騰”，其實十月天氣反歸地下。若審察於此，不足可疑，而劉洽、氾閣、皇侃之徒，既不審知其理，又不能定其旨趣，諠諠撓撓，亦無取焉。○注“此陽”至“急發”。○正義曰：經雲“天氣下降”，注“陽氣蒸達”，又似陽氣上升者，以陽氣從五月下降，至十一月從下初升，至正月始成乾體，而在三陰之下，故云“天氣下降”，其實於時陽從地中升也。引“《農書》曰”下者，按《漢書·藝文志》：農書有九家，百一十四篇，“神農二十篇，野老十七篇，宰氏十七篇，董安國十六，尹都尉十四，趙氏五篇，氾勝之十八篇，王氏六篇，蔡癸一篇”。鄭所引農書，先師以為《汜勝之書》也。《漢書》注：氾音汎，成帝時為議郎，使教田三輔也。“土長冒橛”者，謂置橛以候土，土長冒橛，陳根朽爛，可拔而去之，耕者，急速開發其地也。○“王命”至“徑術”。○於是春氣既和，王命群官分佈檢校農之事，命遣田畯官舍於郊之上，令農夫皆脩理地之封疆，審正田之徑路，及田之溝洫，故云“審端徑術”。○注“田謂”至“嵎夷”。○正義曰：知“田謂田畯”者，以經雲“命田”，田是受之人。《詩》雲：“田畯至喜。”故知田謂田畯。雲“舍東郊，順時氣而居”者，以其耕作歲時之氣，起於東方為始，故令田畯舍國之東郊，以命其事，其諸侯都邑田畯，各舍國邑之東郊也。雲“封疆，田首之分職”者，封疆則九夫為井，四井為邑，各有封境界域部分職掌也。雲“術，《周禮》作遂”，以田農之事無稱術者，術、遂聲相近，故疑術為遂。《學記》雲：“術有序。”義同於此。雲“夫間有遂，遂上有徑”者，《遂人職》文。按《匠人》雲：“廣二尺，深二尺。”“遂，小溝也，步道曰徑。”《遂人職》雲：“徑容牛馬。”雲“《今尚書》曰分命羲仲，宅嵎夷”者，證命田畯舍東郊之事。雲“《今尚書》”者，《尚書》有古有今，壁裏所得，膠東庸生所傳者，謂之《古文尚書》；晁錯所受伏生二十九篇，夏侯歐陽所傳者，謂之《今文尚書》。鄭據而引之，故云《今尚書》。○“田事”至“不惑”。○作記之人，解說天子所以命田畯舍於東郊者，欲明其政理田事，若田事既能正，又先定其封疆、徑遂以勸農夫，農夫知田事先後，審疆界畔域，乃不有疑惑。○注“準直”至“均田”。○正義曰：準謂輕重平均，直謂繩墨得中也。封疆有界限，徑遂有闊狹，皆先平均正直之，故云“準直，謂封疆徑遂”。雲“《夏小正》曰‘農率均田’”者，《夏小正》是《大戴禮》篇也。農率，則田畯也。均田，則審端徑遂也。" }
      - { type: j, text: "是月也，命樂正人學習舞。為仲春將釋菜。乃脩祭典。重祭禮，歲始省錄。命祀山林川澤，犧牲毋用牝。為傷妊生之類。○牝，頻忍反。妊，而林、而鴆二反。○禁止伐木。盛德所在。毋覆巢，毋殺孩蟲、胎、夭、飛鳥，毋麛毋卵。為傷萌幼之類。○覆，芳服反。孩，屍哀反。胎，吐來反。夭，烏老反。麛音迷。卵，刀管反。毋聚大眾，毋置城郭。為妨農之始。掩骼埋胔。謂死氣逆生也。骨枯曰骼，肉腐曰胔。”骼，江百反。胔，才賜反，蔡雲：“露骨曰骼，有肉曰胔。”胔亦作骴。胔，扶矩反。○是月也，不可以稱兵，稱兵必天殃。逆生氣。兵戎不起，不可從我始。為客不利，主人則可。毋變天之道，以陰政犯陽。毋絕地之理，易剛柔之宜。毋亂人之紀。仁之時而舉義事。" }
      - { type: z, text: "“是月”至“用牝”。○正義曰：此一節論此春為四時之首，當脩祀典及祭山川之事，各依文解之。“犧牲毋用牝”者，以山林川澤，其祀既卑，餘月之時，牲皆用牝，唯此月不用，故注“為傷妊生之類”。若天地宗廟大祭之時，雖非正月，皆不用牝。○“禁止”至“之紀”。○正義曰：此一節論時氣之事，各依文解之。○“禁止伐木”者，禁謂禁其欲伐，止謂止其巳伐者。此伐木在山中，或在禁障之處。十月許人採取，至正月之時，禁令止息，故《王制》雲“草木零落，然後入山林”，《詩·魚麗》傳雲“草木不折，不操斧斤，不入山林”是也。若國家隨時所須以為材用者，雖非冬月，亦得取之，故《山虞》有“仲冬斬陽木，仲夏斬陰木”，又云“邦工入山林而掄材，不禁”是也。其非是所禁之處，春、秋亦得取之，故《周禮》雲：“春、秋之斬木不入禁。”鄭注：“斬四野之木可，若於正月皆禁之。”○“毋覆”至“毋卵”。○此一節論禮法，餘月皆無覆巢，因初春施生之時，故設戒也。巢，若其夭鳥之巢則覆之，故《硩蔟氏》雲：“掌覆夭鳥之巢。”此月亦禁之。胎謂在腹中未，出夭為生而己出者，故《魯語》雲：“獸長麛夭。”此飛鳥，謂初飛之鳥，故注云“為傷萌幼之類”。麛卵四時皆禁，但於此月尢甚，若須薦獻，亦得取之，故《王制》雲“韭以卵，庖人秋行犢麛”是也。“掩骼埋胔”者，《蠟氏》雲：“掌除骴。”司農雲：“胔，骨之尚有肉者也，及禽獸之骨皆是。”康成不注，從司農義也。骼言掩，胔言埋，互言耳。○注“為客”至“可也”。○正義曰：起兵伐人者謂之客，敵來御捍者謂之主。此經雲兵戎不合興起之時，不可從我而始。我為主人也，主人既不先起兵，彼來伐我，我不得不應，故云“主人則可”。客既先興兵，故云“為客不利”。“毋變”至“之紀”。○天有陰陽之道路，恐人改變，故云“無變天之道”。地有剛柔之理，恐人斷絕，故云“毋絕地之理”。人有禮義綱紀，恐其迷亂，故云“毋亂人之紀”。按《易·說卦》雲：“立天之道，曰陰與陽。”故鄭此注“以陰政亂陽”。《說卦》雲：“立地之道，曰柔與剛。”故注地理雲“易剛柔之宜”。《說卦》雲：“立人之道，曰仁與義。”春為仁，故注“仁之時而舉義事”。天雲道，地雲理，人云紀，互辭也。" }
      - { type: j, text: "孟春行夏令，則雨水不時，巳之氣乘之也。四月於消息為乾。草木蚤落，生日促。○蚤音早。國時有恐。以火訛相驚。○恐，丘勇反。行秋令，則其民大疫，申之氣乘之也，七月始殺。○疫音役。猋風暴雨總至，正月宿直尾箕，箕好風，其氣逆也。迴風為猋。○猋，必遙反，徐芳遙反；本又作飄。宿音秀。好，呼報反。藜莠蓬蒿並興。生氣亂，惡物茂。○藜，力兮反。莠音酉。行冬令，則水潦為敗，雪霜大摯，首種不入。亥之氣乘之也。舊說首種謂稷。○潦音老。摯音至，蔡雲“傷折”。種，章勇反，蔡雲“宿麥”。" }
      - { type: z, text: "“孟春”至“不入”。正義曰：從上以來，論當月施令之事。若施之順時，則氣序調釋；若施令失所，則災害滋興。故自此而下，論政失致災之事。上既雲“毋變天之道，母絕地之理，母亂人之紀”，今若施之不失，則三才相應，以人與天地共相感動故也。施令有失，三才俱應者，則此孟春行夏令，雨水不時，天也。草木早落，地也。國時有恐，人也。十二月之節內，三才俱應者多，就三才俱應之中，論天地及人，亦先後不建。或先言天者，則此“孟春行夏令，雨水不時”是也。或先言民者，則孟春“行秋令，其民大疫”是也。或先言地者，則孟春“行冬令，水潦為敗”是也。所以然者，為害重者則在先言之，為害輕者後言之。大略於文可以意得，次第其輕重，無義例也。皇氏曲為別說，非經之旨，施令失所。亦惟有二才應者，故仲春“行夏令，則國乃大早，暖氣早來，蟲螟為害”。大早暖氣，併為天災，如此二類是也。以施令失所，惟二才應，就二才之中，或有天有人無地，或有地有人無天，隨應則書，不為義例也。行令失之於前，氣則應之於後。至如春夏及秋，施令有失，氣來為應，惟在當年，則“孟春行夏令，雨水不時，草木早落”之類是也。若其冬時失令，則氣應在於後年，故仲冬“行秋令，則天時雨汁，瓜瓠不成”，“行春令，蝗蟲為敗”。仲冬非瓜瓠不成之時，又非蝗蟲為敗之日，是據來年。又錄記之人，序行令之事，各次第先後，則有夏、有秋、有冬。孟春舉夏為始，仲春舉秋為始，季春舉冬為始，至於夏時之下，則有秋、有冬。次有來年之春，孟夏則舉秋為始，仲夏舉冬為始，季夏舉春為始。以此推例，秋冬亦然，不能備說也。○注“巳之”至“為乾”。○正義曰：此風雨不時者，謂風雨少，不得應時。所以風雨不應時者，以孟春建寅，其宿直箕星，箕星好風。孟春行夏令，寅氣不足，故風少，巳來乘之，四月純陽用事，純陽來乘，故雨少。雲“四月於消息為乾”者，陽生為息，陰死為消，十一月至四月為息，言萬物得陽氣蕃息，五月至十月為消，言萬物得陰氣消盡。凡孟月失令，則三時孟月之氣乘之；仲月失令，則仲月之氣乘之；季月失令，則季月之氣乘之。所以然者，以同為孟仲季，氣情相通，如其不和，則迭相乘入。鄭之所注，例亦不同，或一句之下，則雲某之氣乘之，即此風雨不時一句之下雲“已之氣乘之”，或兩句之下，則雲某之氣乘之，故“仲春行秋令，則其國大水，寒氣總至”，注“酉之氣乘之”，以二句俱當酉氣故也。或有三句之下，始雲某之氣乘之者，故孟春“行冬令，則水潦為敗，雪霜大摯，首種不入”，注云“亥之氣乘之”，以三句共當亥氣也。氣當則言，無義例也。凡一句為一事，亦有兩句共為一事者，則孟夏行冬令雲“後乃大水，敗其城郭”是也。○注“火訛相驚”。○正義曰：以巳來乘寅，巳為火，故火來也。寅為天漢之津，火雖欲來，而畏水終竟不來，但訛言道火相恐動也。注云“申之氣乘之，七月始殺”。○正義曰：七月建申，陰氣始殺，殺氣乘寅，故人多大疫。○注“正月”至“為焱”。○正義曰：按鄭注《洪範》中央土氣為風，東方木氣為雨，箕屬東方木，木克土，土為妃，尚妃之所好，故箕星好風也。西方金氣為陰，克東方木，木為妃，畢屬西方，尚妃之所好，故好雨也。今申氣乘寅，兩相沖破，申來逆寅，寅為風，風之被逆，故為焱風。寅往破申，申為雨，雨之被逆，故為暴雨也。按《爾雅》“扶搖謂之焱”，謂風之迴轉也，故云“迴風為焱”。○注“生氣亂惡物茂”。○正義曰：惡物所以害生氣，今生氣既亂，惡物乘之，故惡物茂。○注“首種謂稷”。○正義曰：按《考靈耀》雲：“日中星鳥，可以種稷。”則百穀之內稷先種，故云“首種”。首即先也，種在百穀之先也。" }
      - { type: j, text: "《禮記正義》" }
