# 毛詩正義卷9（孔穎達疏）：j 為經文＋毛亨傳、鄭玄箋，z 為疏文。
sections:
  - id: juan9
    name: 正文
    blocks:
      - { type: j, text: "《出車》，勞還率也。遣將率及戍役，同歌同時，欲其同心也。反而勞之，異歌異日，殊尊卑也。《禮記》曰：“賜君子小人不同日。”此其義也。○出車如字，沈尺遂反。勞，力報反。還音旋。" }
      - { type: z, text: "《出車》六章，章八句。○正義曰：作《出車》詩者，勞還帥也。謂文王所遣伐玁狁、西戎之將帥，以四年春行，五年春反，於其反也，述其行事之苦以慰勞之。六章皆勞辭也。○箋“遣將”至“其義”。○正義曰：箋解遣唯一篇，而勞有二篇之意，故曰“遣將帥及戌役，同歌同時，欲其同心”也。同歌，謂其共歌《采薇》也。同時，謂將帥與戍役俱行。雖三章三輩別行，每行將帥同發也。三輩各有將，此獨言南仲者，以元帥，故歸功焉，反而勞之。異歌，謂《出車》與《杕杜》之歌不一時，是異歌異日也。必異日者，殊尊卑故也。《玉藻》雲：“賜君子與小人不同日。”與此協，故曰此其義也。此將帥有功而還，本其初出以勞之。首章言四年春，將欲遣軍，出車就馬，命之為將，仍在國未行也。二章言就馬於牧地，設旌旐。既已受命，臨事而懼，是二月、三月之事也。從是而行，先伐玁狁。三章言往朔方營築壘壁。既以春末而行，當以夏初到朔方也。既至朔方，將設經略，五月猶尚停息，六月乃始出壘。四章言黍稷方華，出伐玁狁。玁狁既服，因伐西戎，至春凍始釋，又從西戎而反於朔方。慮有驚急，復且停住也。以六月出伐玁狁，當至秋末始平，乃移兵西戎。五章言晚秋之時，西方諸侯鄉望南仲也。至於五年之春，二方大定，乃始還帥。卒章言其迥歸其事次也。唯四章因言自壘而出，即說自西而反。五章乃更述在西方之事為小倒耳。" }
      - { type: j, text: "我出我車，於彼牧矣。出車就馬於牧地。箋雲：上我，我殷王也。下我，將率自謂也。西伯以天子之命，出我戎車於所牧之地，將使我出征伐。○牧音目。自天子所，謂我來矣。箋雲：自，從也。有人從王所來，謂我來矣，謂以王命召己，將使為將率也。先出戎車，乃召將率，將率尊也。" }
      - { type: j, text: "召彼僕伕，謂之載矣。“王事多難，維其棘矣”。僕伕，御夫也。箋雲：棘，急也。王命召己，己即召御夫，使裝載物而往。王之事多難，其召我必急，欲疾趍之。此序其忠敬也。○難，乃旦反，注及下皆同。裝，側良反，本又作“莊”。" }
      - { type: z, text: "“我出”至“棘矣”。○正義曰：文王述將帥之辭，言汝將帥雲：王今既以我天子之命，出我將帥之戎車，於彼郊牧之地而就馬矣。乃從王子之所，以王命召己，謂我來為將帥矣。我得王命，即自召彼僕御之夫，謂之今使裝載而往矣。所以不待受命即使裝載者，以王家之士多危難，其召我必急矣，不可緩以待命，欲疾趨之也。以王命不辭，即召僕伕，忠也。知自急難，欲疾趨之，敬也。序其忠敬以慰勞之。○傳“出車”至“牧地”。○正義曰：以言於彼牧矣，故知出車就之。下章雲“於彼郊矣”，則牧地在郊，故《地官·載師職》曰：“牧田任遠郊之地。”是也。馬已在牧，而得出車就之者，雖大數在牧，仍有在廄供用者，故《月令》“季春乃合累牛騰馬游牝於牧”，注云：“累系在廄者。”是也。廄有馬，可令引車以就牧。不即以在廄之馬駕戎車者，以戎車自有戎馬，齊力尚強。在廄不必征馬，故不用焉。○箋“上我”至“自謂”。○正義曰：此本將帥之辭以勞之，則我車馬為將帥之所乘，故知“下我，將帥自謂也”。以天子之命召己，故知出車者亦天子之命，故“上我，我殷王也”。時出車未命將帥，雲“我車”者，以出車本為將帥，出車才訖，王即命己為將，則將帥之車為己所乘，復從後本之，故云“我車”也。○傳“僕伕，御夫也”。○正義曰：《周禮·戎僕》：“掌御戎車。”注云：“師出，王乘以自將也。”《御夫》：“掌御二車、從車。”注云：“二車，象路之副。從車，戎路之副。”是僕伕與御夫別矣。而言“僕伕，御夫”者，以此雲謂之載矣，言裝載物，是從車之事，故為御夫。其實此僕伕亦有戎僕，何者？在牧戎車，將帥所乘，豈更有異人御之哉？則戎僕也。故下章“僕伕況瘁”，箋雲“憂其馬之不正”，是正御亦在焉。以戎車及副各自有御，不得一人兼之，則文當並有。或即兼官，其長者為戎僕，小者為御夫矣。" }
      - { type: j, text: "我出我車，於彼郊矣。設此旐矣，建彼旄矣。龜、蛇曰旐。旄，幹旄。箋雲：設旐者，屬之於幹旄，而建之戎車。將率既受命行乃乘焉。牧地在遠郊。○旐音兆。旄音毛。屬音燭，致也。彼旟旐斯，胡不旆旆？鳥隼曰旟。旆旆，旒垂貌。○旟音餘。旆，滿貝反。隼，息允反。旒音留。" }
      - { type: j, text: "憂心悄悄，僕伕況瘁。箋雲：況，茲也。將率既受命，行而憂，臨事而懼也。御夫則茲益憔悴，憂其馬之不正。○悄，七小反。瘁，似醉反，本亦作“萃”，依注作“悴”，音同。憔，慈遙反。“憂其馬之不正”，一本作“之不正也”，一本作“馬之政”。" }
      - { type: z, text: "“我出”至“況瘁”。○正義曰：王勞將帥，本其所言云：王本以我天子之命，出我將帥之戎車，於彼郊牧就馬矣。既命我為將帥，我受命當行，即就於郊牧之車，設此旐而屬之於旄之上幹矣。以屬旐於旄，乃建立彼旄於戎車之上矣。旄在地已屬之於幹旄，言建旐則亦同建之也。既建而後行，在道之時，彼旟旐斯隨車而行，何有不旆旆者乎？言皆旆旆然垂也。時既受命行，汝將帥則憂心悄悄然，臨事而懼。僕伕憂馬不正亦然，滋益憔悴矣。言其勞苦，示知其情也。言此旐彼旄者，凡兩事者，一言彼，一言此，便文耳。“於彼新田，於此菑畝”，皆此類也。○傳“龜蛇曰旐”。○正義曰：此及下傳雲“鳥隼曰旟”，“交龍為旂”，皆《周禮·司常》文也。雜互陳之，則軍之諸帥有建之者矣。《大司馬序》雲：“凡制軍，萬二千五百人為軍，軍將皆命卿。二千五百人為師，師帥皆中大夫。五百人為旅，旅帥皆下大夫。百人為卒，卒長皆上士。二十五人為兩，兩司馬皆中士。五人為伍，伍皆有長。”此言勞還帥，自伍長以上皆在焉。鄭於《大司馬職》注云：“凡旌旗，有軍眾者畫異物，無者帛而已。”則伍長以上皆軍眾，所建畫異物矣。其職曰：“王載大常，諸侯載旂，軍吏載旗，郊野載旐，百官載旟。”注云：軍吏，諸軍帥也。郊謂鄉遂之州長縣正以下，野謂公邑大夫。建旐者以其將羨卒，百官卿大夫以其屬衛王。彼據因田教戰，王親在焉。今南仲為將專行，若以文王承殷王之命，則南仲比軍吏而已，不過載熊虎之旗。但時未制禮，文王以諸侯而有王者之化，此錄入《雅》，當為天子法，則南仲一人或建旂。下雲“旂旐央央”，旂蓋南仲所建也。以下或載旐，或載旟，故此經所陳，唯旂、旐、旟三物而已。軍吏戴旗，則此行必有載旗者，經所不陳，文不具耳。○傳“旆旆，旒垂貌”。○正義曰：定本雲“旆旆，旒垂貌”，多一旆字。又箋雲“憂其馬之不正”，定本“正”作“政”，又無“不”字。義並通。" }
      - { type: j, text: "王命南仲，往城於方。出車彭彭，旂旐央央。王，殷王也。南仲，文王之屬。方，朔方，近玁狁之國也。彭彭，四馬貌。交龍為旂。央央，鮮明也。箋雲：王使南仲為將率，往築城於朔方，為軍壘以御北狄之難。○央，本亦作“英”，同於京反，又於良反。近，附近之近，下“近西戎”同。壘，力軌反。" }
      - { type: j, text: "天子命我，城彼朔方。赫赫南仲，玁狁於襄。朔方，北方也。赫赫，盛貌。襄，除也。箋雲：此我，我戍役也。戍役築壘，而美其將率自此出征也。○襄，如字，本或作“攘”，如羊反。" }
      - { type: z, text: "“王命”至“於襄”。○正義曰：此又本而勞之。言文王命以殷王之命，命南仲往城築於彼朔方，故南仲所以在朔方而築於也。其往築之時，出駕其車，四馬彭彭然。其所建旂旐鮮明央央然，而至於朔方也。南仲為將帥，得人歡心，故稱戍役當築壘之時雲：天子命我城築軍壘於朔方之地，欲令赫赫顯盛之南仲，從此徵玁狁，於是而平除之。能為戍役所美，所以可嘉也。○傳“朔方，近玁狁之國”。○正義曰：下雲“城彼朔方”，故知方是北方，近玁狁之國。朔方，地名，雲國者，以國表地，非國名。但北方大名皆言朔方。《堯典》雲：“宅朔方。”《爾雅》雲：“朔，北方也。”皆其廣號。此直雲“方”，即朔方也。○箋雲“往築”至“軍壘”。○正義曰：知為築壘者，以軍之所處而城之，唯有壘耳。《曲禮》雲：“四郊多壘。”注云：“壘，軍壁也。”言城是築之別名，《春秋》築都邑皆謂之城。《左傳》曰：“邑曰築，都曰城。”是也。《春秋》別大小之例，故城、築異文。散則城、築通，故此築軍壘亦謂之城也。" }
      - { type: j, text: "昔我往矣，黍稷方華。今我來思，雨雪載塗。王事多難，不遑啟居。塗，凍釋也。箋雲：黍稷方華，朔方之地六月時也。以此時始出壘征伐玁狁，因伐西戎，至春凍始釋而來反，其間非有休息。○雨雪，於付反，又如字。" }
      - { type: j, text: "豈不懷歸？畏此簡書。簡書，戒命也。鄰國有急，以簡書相告，則奔命救之。" }
      - { type: z, text: "“昔我”至“簡書”。○正義曰：此因築壘，從壘敘將帥之辭。言將帥雲：正月已還至壘，乃雲昔我從此壘出征伐玁狁矣，時黍稷方欲生華，六月之中也。今我自西戎還到此壘，時天降雨雪，則為塗泥，正月之中也。從六月以去，至於今而來，以王家之事多危難，其間不得間暇跪處也。雖則到此，尚不得還，我豈不思歸乎？誠思歸也。所以不得歸者，畏此簡書，奔命相救，故不得還耳。汝既如此，誠為勞苦。○箋“黍稷”至“休息”。○正義曰：《月令》孟秋雲“農乃登穀”，則中國黍稷亦六月華矣。言黍稷方華，朔方之地六月時者，明此為朔方之地發言耳，非謂中國不然也。知以此時出壘征伐玁狁者，上雲“城彼朔方”，“玁狁於襄”，此即雲“昔我往矣”，是出壘辭，故知始出壘伐玁狁也。既伐玁狁，而下章言“薄伐西戎”，故知因伐西戎也。言“雨雪載塗”，雪落而釋為塗泥，是春凍始釋也。卒章倉庚鳴，卉木茂，方始還歸，則此時未歸，而云“今我來思”，故知來反朔方之壘也。且雲“畏此簡書”，明是未歸之辭。言“不遑啟居”，故知其間非有休息也。○傳“簡書”至“救之”。○正義曰：古者無紙，有事書之於簡，謂之簡書。以相戒，命之救急，故云戒命。知鄰國有難，以簡書相告者，閔元年《左傳》引此詩乃雲：“簡書，同惡相恤之謂也。”言同惡於彼，共相憂念，故奔命相救。得彼告，則奔赴其命，救之。成七年《左傳》曰：“子重奔命。”是也。" }
      - { type: j, text: "喓々草蟲，趯趯阜螽。箋雲：草蟲鳴，阜螽躍而從之，天性也。喻近西戎之諸侯，聞南仲既徵玁狁，將伐西戎之命，則跳躍而鄉望之，如阜螽之聞草蟲鳴焉。草蟲鳴，晚秋之時也。此以其時所見而興之。○喓，於遙反。趯，吐歷反。螽音終。躍音藥。向，許亮反，或作“鄉”，音同。興，許反。未見君子，憂心忡忡。既見君子，我心則降。箋雲：君子，斥南仲也。降，下也。○忡，敕中反。降，戶江反，又如字，注下皆同。" }
      - { type: j, text: "赫赫南仲，薄伐西戎。" }
      - { type: z, text: "“喓喓”至“西戎”。○正義曰：南仲以平玁狁，將移伐西戎，是晚秋之時也。其近西戎之諸侯，聞南仲之伐，皆喜，時有草蟲鳴，故因興之焉。言喓々然為聲而鳴者，草蟲也。聞此草蟲之鳴，趯趯然跳躍而從之者，阜螽也。以喻赫赫然有德而盛者，南仲也。聞其南仲之將往，向望而美之者，近西戎之諸侯也。言阜螽之從草蟲，天性然也。西方諸侯之美南仲，事勢然也。故諸侯未見君子南仲之時，憂心忡忡然，以西戎為患，恐王師不至，故憂也。既見君子南仲，我心之憂則下矣，因即美之，此赫赫顯盛之南仲，遂薄往伐西戎而平之。○箋“草蟲鳴，晚秋之時”。○正義曰：知者，以凍釋而反朔方，則以冬日平西戎也。此南仲往之時，為諸侯向望，明在冬前矣。黍稷方華，始伐玁狁，明以秋日平之。既平玁狁，方始伐西戎，故知以晚秋之時，因有草蟲而為興耳。冬則蟲死，不得過於晚秋也。" }
      - { type: j, text: "春日遲遲，卉木萋萋。倉庚喈喈，采蘩祁祁。執訊獲醜，薄言還歸。卉，草也。訊，辭也。箋雲：訊，言。醜，眾也。伐西戎以凍釋時，反朔方之壘息戍役，至此時而歸京師，稱美時物以及其事，喜而詳之也。執其可言問、所獲之眾以歸者，當獻之也。○卉，許貴反。萋，七西反。喈音皆。蘩音煩。祁，巨移反。訊音信。" }
      - { type: j, text: "赫赫南仲，玁狁於夷。夷，平也。箋雲：平者，平之於王也。此時亦伐西戎，獨言平玁狁者，玁狁大，故以為始以為終。" }
      - { type: z, text: "“春日”至“於夷”。○正義曰：此序其歸來之事，陳戍役之辭。言季春之日，遲遲然陽氣舒緩之時，草之與木已萋萋然茂美，倉庚喈喈然和鳴，其在野已有采蘩菜之人，祁祁然眾多。我將帥正以此時，生執戎狄之囚可言問者及所獲之眾，以此而來，我薄言還歸於京師以獻之也。說其事終，又美其功大。言赫赫顯盛之南仲，伐玁狁而平之於王，是將帥成功，故勞之也。○傳“訊，辭”。箋“訊言”至“詳之”。○正義曰：“訊，言”，《釋言》文。傳雲“訊，辭”者，謂其有所知識，可與之為言辭，與箋同也。但箋正取《爾雅》之文，非易傳也。上“雨雪載塗”，到朔方之壘息戍役。此言還歸，自朔方而歸，故至此時而歸京師。時未稱王，而言京師者，以在《雅》，天子之事故也。言稱美時物及事，喜而詳之者，春日，時也；卉木、倉庚，物也；采蘩，事也。並以四者記時，是戍役喜其得歸，詳之時物也，故言喜而詳之。又云“赫赫南仲”，則非將帥自言也。“薄言還歸”，則是序行者之辭，非文王出意，故此章陳戍役之辭也。《七月》之篇言春日者，檢上下為三月。采蘩為蠶生所用，則此時物及事皆三月也。" }
      - { type: j, text: "《出車》六章，章八句。" }
      - { type: j, text: "《杕杜》，勞還役也。役，戍役也。" }
      - { type: j, text: "有杕之杜，有睆其實。興也。睆，實貌。杕杜猶得其時蕃滋，役夫勞苦，不得盡其天性。王事靡盬，繼嗣我日。箋雲：嗣，續也。王事無不堅固，我行役續嗣其日。言常勞苦，無休息。" }
      - { type: j, text: "日月陽止，女心傷止，征夫遑止！箋雲：十月為陽。遑，暇也。婦人思望其君子，陽月之時已憂傷矣。征夫如今已閒暇且歸也，而尚不得歸，故序其男女之情以說之。陽月而思望之者，以初時雲“歲亦莫止”。○閒音閒。說音悅。莫音暮，本亦作“暮”。" }
      - { type: z, text: "“有杕”至“遑止”。○正義曰：文王勞還役，言汝等在外，妻皆思汝。言有杕然特生之杜，猶得其時，有睍然其實，蕃滋得所。我君子獨行役勞苦，不得安於室家，以盡天性而生子孫，乃杕杜之不如。所以然者，由王之事理皆當，無不攻致，使我君子行役。繼續我所行之日，朝行明去，不得休息。至於此日月陽止十月之時，爾室家婦人之心憂傷矣。以為征夫而今已閒暇，且應歸矣，而尚不歸，所以憂傷。" }
      - { type: j, text: "有杕之杜，其葉萋萋。王事靡盬，我心傷悲。箋雲：傷悲者，念其君子於今勞苦。" }
      - { type: j, text: "卉木萋止，女心悲止，征夫歸止！室家逾時則思。○思，息嗣反，又如字。" }
      - { type: z, text: "傳“室家逾時則思”。○正義曰：傳以卉木萋止，則時未黃落，猶憂愁也。前期雲“歲亦暮止”，未至歸期而女心悲者，以室家之情，逾時則思也。" }
      - { type: j, text: "陟彼北山，言採其杞。王事靡盬，憂我父母。箋雲：杞非常菜也，而升北山採之，託有事以望君子。○杞音起。" }
      - { type: j, text: "檀車幝々，四牡痯々，征夫不遠！檀車，役車也。幝々，敝貌。痯々，罷貌。箋雲：不遠者，言其來，喻路近。○檀，徒丹反。幝，尺善反，又敕丹反，《說文》雲：“車敝也。從巾、單。”《韓詩》作“糹羨”，音同。痯，古緩反。敝，婢世反。罷音皮。" }
      - { type: z, text: "“陟彼”至“不遠”。○正義曰：言汝戍役之妻，思爾而不得，故升彼北山之上，我採其杞木之菜。杞木本非食菜，而升北山以採之者，是記有事，以望汝也。以汝勞苦，故言王事無不堅固。以君子勞苦堅故之由，是使我憂之。父母，實夫也，謂之父母，由己尊之、又親之也。又言我君子所乘檀木之役車，今幝々然弊；所乘四牡之馬，今痯々然疲。征夫之來不遠，當應至也。如何許時不至，使己念之。○箋“杞非”至“君子”。○正義曰：此類上下皆陳婦人思夫之事，故為託採以望君子，不與《北山》同也。以下章“期逝不至”，上章“我心傷悲”類，則“憂我父母”謂夫為父母也。《日月》雲：“父兮母兮，畜我不卒。”莊姜稱莊公為父母，與此同也。○傳“檀車，役車”。○正義曰：此戍役之妻說君子所乘役車也，以檀木為車。《伐檀》曰“坎坎伐檀兮”，又曰“伐輪”、“伐輻”，是檀可為車之輪、輻。又《大明》雲“檀車煌煌”，武王之戎車，是檀之所施於車廣矣。則役夫以從徵之故，其甲士三人所乘之車而備四馬，故曰四牡，非庶人尋常得乘四馬也。" }
      - { type: j, text: "匪載匪來，憂心孔疚。箋雲：匪，非。疚，病也。君子至期不裝載，意不為來。我念之，憂心甚病。○疚，居又反。期逝不至，而多為恤。逝，往。恤，憂也。遠行不必如期，室家之情以期望之。" }
      - { type: j, text: "卜筮偕止，會言近止，征夫邇止！卜之筮之，會人佔之。邇，近也。箋雲：偕，俱。會，合也。或卜之，或筮之，俱佔之，合言於繇為近，征夫如今近耳。○繇，直又反。" }
      - { type: z, text: "“匪載”至“邇止”。○毛以為，文王勞戍役，言汝之室家雲：我君子歸期已至，今非裝載乎？其意非為來乎？何為使我念之憂心，以至於甚病。所以然者，汝室家言，本與我期，已往過矣，於今由不來至，由是而使我念之，多為憂以致病矣。汝室家既憂，或卜之，或筮之，其卜筮俱會聚人佔之，其言近止。既佔雲近，則征夫如今且近止，應到不遠矣。汝室家念汝如是也。○鄭唯“卜之，筮之，俱佔之，合言於繇”為異。餘同。○傳“會人佔之”。○正義曰：傳以會之言，是會聚人佔之，義即與《士冠禮》“筮日”，《士喪禮》“筮宅旅佔”同，故為會人佔之。箋以上句言“偕止”者，俱佔之，若不為佔，則文皆空設。“偕”既為佔，則“會”當為合，故易之為合。言於繇謂合，言於兆卦之繇也。" }
      - { type: j, text: "《杕杜》四章，章七句。" }
      - { type: j, text: "《魚麗》，美萬物盛多，能備禮也。文、武以《天保》以上治內，《采薇》以下治外，始於憂勤，終於逸樂，故美萬物盛多，可以告於神明矣。內，謂諸夏也。外，謂夷狄也。告於神明者，於祭祀而歌之。○麗，力馳反，下同。上，時掌反。逸本或作“佚”。樂音洛。夏，戶雅反。" }
      - { type: z, text: "“《魚麗》六章，上三章章四句，下三章章二句”至“神明矣”。○正義曰：作《魚麗》詩者，美當時萬物盛多，能備禮也。謂武王之時，天下萬物草木盛多，鳥獸五穀魚鱉皆得所，盛大而眾多，故能備禮也。禮以財為用，須則有之，是能備禮也。又說所以得萬物盛多者，文王、武王以《天保》以上六篇燕樂之事，以治內之諸夏；以《采薇》以下三篇征伐之事，治外之夷狄。文王以此九篇治其內外，是始於憂勤也。今武王承於文王治平之後，內外無事，是終於逸樂。由其逸樂，萬物滋生，故此篇承上九篇，美萬物盛多，可以告於神明也。文、武並有者，以此篇武王詩之始，而武王因文王之業，欲見文治內外而憂勤，武承其後而逸樂，由是萬物盛多，能備禮也。“可以告於神明”，極美之言，可致頌之意，於經無所當也。○箋“內謂”至“歌之”。○正義曰：以《采薇》等三篇征伐，是治夷狄，故云“內謂諸夏，外謂夷狄”。僖二十五年《左傳》雲：“德以柔中國，刑以威四夷。”詩亦見此法也。言於祭祀歌之者，言時已太平，可以作頌。頌者，告神明之歌，雲可以告其成功之狀，陳於祭祀之事，歌作其詩，以告神明也。時雖太平，猶非政洽，頌聲未興，未可以告神明。但美而欲許之，故云“可以”。" }
      - { type: j, text: "魚麗於罶，鱨鯊。麗，歷也。罶，曲梁也，寡婦之筍也。鱨，楊也。鯊，鮀也。太平而後微物眾多，取之有時，用之有道，則物莫不多矣。古者不風不暴，不行火。草木不折，不操斧斤，不入山林。豺祭獸然後殺，獺祭魚然後漁，鷹隼擊然後罻羅設。是以天子不合圍，諸侯不掩群，大夫不麛不卵，士不隱塞，庶人不數罟，罟必四寸，然後入澤梁。故山不童，澤不竭，鳥獸魚鱉皆得其所然。○罶音柳。鱨音常。《草木疏》雲：“今江東呼黃鱨魚，尾微黃，大者長尺七八寸許。”鯊音沙，亦作“魦”，今吹沙小魚也，體圓而有黑點文。舍人雲：“鯊，石鮀也。”鮀，待何反。大平音泰。暴，蒲卜反。不操，草刀反，一本作“不折不芟”，定本“芟”作“操”。豺，仕皆反。獺，敕鎋反，又佗末反。漁音魚，一本作“”，同，取魚也。罻音畏。麛，亡兮反，本或作“麑”，同。卵，魯短反。隱如字，本又作“偃”，亦如字。塞，蘇代反，又新勒反。數，七欲反，又所角反，陳氏雲：“數，細也。”罟音古。" }
      - { type: j, text: "君子有酒旨且多。箋雲：酒美而此魚又多也。○“有酒旨”絕句。“且多”，此二字為句。後章放此。異此讀則非。" }
      - { type: z, text: "“魚麗”至“且多”。○正義曰：言武王之時，萬物殷盛。時捕魚者施笱於水中，則魚麗歷於罶者，是鱨鯊之大魚。非直有此大魚，又君子有酒矣。其魚酒如何？酒既旨美，且魚復眾多。魚酒多矣，如是，是萬物盛多，能備禮也。○傳“罶曲”至“所然”。○正義曰：《釋訓》雲：“凡曲者為罶。”是“罶，曲梁”也。《釋器》曰：“嫠婦之笱謂之罶。”是寡婦之笱也。《釋訓》注郭璞引《詩傳》曰：“罶，曲梁也。凡以薄取魚者，名為罶也。”《釋器》注孫炎曰：“罶，曲梁。其功易，故謂之寡婦之笱。”然則曲簿也，以簿為魚笱，其功易，故號之寡婦笱耳，非寡婦所作也。鱨，楊者，魚有二名，《釋魚》無文。陸機《疏》雲：“鱨，一名黃頰魚是也。似燕頭魚，身形厚而長大，頰骨正黃。魚之大而有力解飛者，徐州人謂之楊黃頰，通語也。”“鯊，鮀”，《釋魚》文。郭璞曰：“今吹沙也。”陸機《疏》雲：“魚狹而小，常張口吹沙，故曰吹沙。”此寡婦笱而得鱨鯊之大魚，是眾多也。魚所以眾多，傳因推而廣之雲：“大平而後微物眾多。”見此詩舉魚多，明此義也。微物尚眾多，況其著者。微物所以眾多，由取之以時，用之有道，不妄夭殺，使得生養，則物莫不多矣。古者不風不暴，不行火，言風暴然後行火也。風暴者，謂氣寒，其風疾。其風疾，即北風，謂之涼風。《北風》箋雲：“寒涼之風，病害萬物。”是也。北風，冬風之總名，自十月始，則暴風謂十月也。故《王制》雲：“昆蟲未蟄，不以火田。”《羅氏》雲：“蠟則作羅襦。”鄭雲：“謂建亥之月。今俗放火張羅，其遣教。”是十月也。草木不折不芟，斤斧不入山林，言草木折芟，斤斧乃入山林也。草木折芟，謂寒霜之勁，暴風又甚，草木枝折葉隕，謂之折芟。《月令》“季秋草木黃落”，則十月風暴當折芟矣。言芟者，蓋葉落而盡，似芟之。定本“芟”作“操”。又云“斧斤入山林”，無“不”字，誤也。然則十月而斤斧入山林。《月令》“季秋伐薪為炭”者，炭以時用。所伐者少耳，故未芟折，可伐之也。豺祭獸然後殺者，言豺殺獸，聚而祭其先，然後可田獵取獸也。《月令》“季秋，豺祭獸而戮禽”。雖九月始，十月猶祭也，故《夏小正》雲“十月豺祭獸”，《援神契》雲“獸蟄伏，豺食禽”，皆據十月。是以《羅氏》注云：“建亥之月，豺既祭獸，可施羅網，圍取禽獸。”是也。獺祭魚然後漁，亦謂獺聚其魚以祭先，然後可捕魚耳。《援神契》曰“獸蟄伏，獺祭魚”，亦十月也。《王制》曰“獺祭魚，然後虞人入澤梁”，與此一也。《月令》“孟春，獺祭魚”，則獺亦有二時祭魚。此類上文為孟冬矣。鷹隼擊，然後罻羅設，鷹及隼行威擊殺眾鳥，然後設羅以田也。案《夏小正》：“五月，鳩化為鷹。”《月令》：“季夏，鷹乃學習。孟秋，鷹乃祭鳥。”則一鷹也。仲春化為鳩，其變從五月始，至八月當全為鷹，與仲春相對，故《司裘》雲：“仲秋，王乃行羽物。”注云：“此羽物，小鳥鶉雀之屬，鷹所擊者。仲秋鳩化為鷹，順其始殺，而大班賜羽物。”《王制》亦云：“鳩化為鷹，而罻羅設。”故據此似八月也。但鳩化為鷹，得在八月。言罻羅設，則非八月之事。鄭雲“順其始殺”，則鷹八月始擊，十月乃甚。又文與隼連，共豺、獺相對，為十月事也。言罻羅設者，《說文》雲“罻，捕鳥網”，則是羅之別名，蓋其細密者也。自此以上，是取之以時也。既言取之以時，又說取之節度。天子不合圍，言天子雖田獵，不得圍之使匝，恐盡物也。《大司馬》雲：“仲春，鼓，遂圍禁。”則四時皆圍，但不匝耳。諸侯言不掩群，大夫言不麛不卵，各舉其力之所能以禁之耳。其實通皆不得，故《魯語》雲“獸長麛夭，鳥翼殼卵”，《王制》直言“不麛不卵，不殺胎，不殀夭，示人禁取麛卵”，是尊卑皆禁也。但急於春夏，緩於秋冬，差可為，恐盡物，以長養之故也。若時有所須，如春薦韭卵，秋膳犢麛之屬，得取而用，正不得，故田獵以取之。下《曲禮》雲“國君春田不圍澤，大夫不掩群，士不麛不卵”，與此異者，此自天子而下，彼自諸侯而下，各為等級，所以不同。亦推此知各禁其所能耳。國君直言春田不圍澤，不言夏者，以夏長養之時，彌不得，從可知也。雖秋冬得圍之，自然不得匝也。士不隱塞者，為梁止可為防於兩邊，不得當中，皆隱塞，亦為盡物也。庶人不總罟，謂罟目不得總之使小，言使小魚不得過也。《集註》“總”作“緵”，依《爾雅》定本作“數”，義俱通也。罟目必四寸，然後始得入澤梁耳。由其如此，故山不童，澤不竭。童者，若童子未冠者也。山無草木，若童子未冠然。草木之屬，不妄斬伐，則山不童也。萑蒲之類，取之以道，則澤不竭也。如是，則鳥獸魚鱉各得其所然也。是微物眾多。然者，語助。此皆似有成文，但典籍散亡，不知其出耳。○箋“酒美”至“又多”。○正義曰：言“且多”，文承“有酒”之下，則似酒多也。而以為魚多者，以此篇下三章還覆上三章也。首章言“旨且多”，四章雲“物其多矣”，二章雲“多且旨”，五章雲“物其旨矣”，三章言“旨且有”，卒章雲“物其有矣”，下章皆疊上章句末之字。謂之為物若酒，則人之所為，非自然之物，以此知“且多”、“且旨”、“且有”，皆是魚也。" }
      - { type: j, text: "魚麗於罶，魴鱧。鱧，鮦也。○鱧音禮。鮦。直冢反。" }
      - { type: j, text: "君子有酒，多且旨。箋雲：酒多而此魚又美也。" }
      - { type: z, text: "傳“鱧，鮦”。○正義曰：《釋魚》雲：“鱧，鯇。”舍人曰：“鱧名鯇。”郭璞曰：“‘鱧，鮦’，遍檢諸本，或作‘鱧，<魚重>’，或作‘鱧，鯇’。若作鮦，似與郭璞正同。若作鯇，又與舍人不異。或有本作‘鱧，<魚果>’者。”定本“鱣鮦”，鮦與<魚重>音同。" }
      - { type: j, text: "魚麗於罶，鰋鯉。鰋，鯰也。○鰋音偃，郭雲：“今偃額白魚。”鯰，乃兼反，江東呼鯰為鮧。鮧音啼，又在私反，毛及前儒皆以鯰釋鰋，鱧為鯇，鱣為鯉，唯郭注《爾雅》是六魚之名。今目驗，毛解與世不協，或恐古今名異，逐世移耳。" }
      - { type: j, text: "君子有酒，旨且有。箋雲：酒美而此魚又有。" }
      - { type: z, text: "傳“鰋，鯰”。○正義曰：《釋魚》有鰋、鯰。郭璞曰：“鰋，今鰋額白魚也。鯰，別名鯷。”孫炎以為鰋、鯰一魚，鱧、鯇一魚。郭璞以為鰋、鯰、鱧、鮦四者各為一魚。傳文質略，未知從誰。" }
      - { type: j, text: "物其多矣，維其嘉矣。箋雲：魚既多，又善。" }
      - { type: j, text: "物其旨矣，維其偕矣。箋雲：魚既美，又齊等。" }
      - { type: j, text: "物其有矣，維其時矣。箋雲：魚既有，又得其時。" }
      - { type: j, text: "《魚麗》六章，三章章四句，三章章二句。" }
      - { type: j, text: "《南陔》，孝子相戒以養也。○陔，古哀反。養，餘尚反。" }
      - { type: j, text: "《白華》，孝子之絜白也。《華黍》，時和歲豐，宜黍稷也。" }
      - { type: z, text: "“南陔”至“黍稷”。○正義曰：此三篇既亡其辭，其名曰《南陔》、《白華》、《華黍》之由，必是詩有此字，不可以意言也。" }
      - { type: j, text: "有其義而亡其辭。此三篇者，《鄉飲酒》、《燕禮》用焉，曰“笙入，立於縣中，奏《南陔》、《白華》、《華黍》”，是也。孔子論《詩》，雅、頌各得其所，時俱在耳。篇第當在於此，遭戰國及秦之世而亡之，其義則與眾篇之義合編，故存。至毛公為《詁訓傳》，乃分眾篇之義，各置於其篇端，雲又闕其亡者，以見在為數，故推改什首，遂通耳，而下非孔子之舊。○此三篇，蓋武王之時，周公制禮，用為樂章，吹笙以播其曲。孔子刪定在三百一十一篇內，遭戰國及秦而亡。子夏序《詩》，篇義合編，故詩雖亡而義猶在也。毛氏《訓傳》，各引序冠其篇首，故序存而詩亡。縣音玄。編，必先反。見，賢遍反。" }
      - { type: z, text: "“有其義而亡其辭”。○正義曰：此二句，毛氏著之也。言有其詩篇之義，而亡其詩辭，故置其篇義於本次，後別著此語記之焉。○箋雲“三篇”至“之舊”。○正義曰：鄭見三篇亡其詩辭，乃跡其所用亡之早晚。此三篇者，《鄉飲酒》及《燕禮》二處皆用焉。何者是用之也？曰“笙入立於縣中，奏《南陔》、《白華》、《華黍》”，是用之也。此雖總言《鄉飲酒》、《燕禮》用焉，其言“笙入立於縣中”，直《燕禮》文耳。《鄉飲酒》則雲：“笙入堂下，磬南北面，歌《南陔》、《白華》、《華黍》。”是文不同也。鄭據一而言之耳。孔子歸魯，論其《詩》，今雅、頌各得其所。此三篇時俱在耳。篇之次第，當在於此。知者，以子夏得為立序，則時未亡。以《六月》序知次在此處也。孔子之時尚在，漢氏之初已亡，故知戰國及秦之世而亡之也。戰國，謂六國韓、魏、燕、趙、齊、楚用兵力戰，故號戰國。六國之滅，皆秦並之。始皇三十四年而燔《詩》、《書》，故以為遭此而亡之。又解篇亡而義得存者，其義則以眾篇之義合編，故得存也。至毛公為《詁訓傳》，乃分別眾篇之義，各置於其篇端。此三篇之序，無詩可屬，故連聚置於此也。既言毛公分之，則此詩未亡之時，什當通數焉。今在什外者，毛公又闕其亡者，以見在為數，推改什篇之首，遂通盡小雅雲耳。是以亡者不在數中，從此而下，非孔子之舊矣。言“以下非”，則止《鹿鳴》一什是也。此雲有其義，而《鄉飲酒》、《燕禮》注皆雲“今亡，其義未聞”。《鄭志》答炅模雲：“為《記注》時就盧君耳。先師亦然。後乃得毛公傳。既古書義又當然，《記注》已行，不復改之。”是注《禮》之時，未見此序，故云“義未聞”也。彼注又云：“後世衰微，幽、厲尤甚，禮樂之書稍廢棄。”以為孔子之前，六篇已亡，亦為不見此序故也。案《儀禮》鄭註解《關雎》、《鵲巢》、《鹿鳴》、《四牡》之等，皆取《詩序》為義，而云未見毛傳者，注述大事，更須研精，得毛傳之後，大誤者追而正之，可知者不復改定故也。據《六月》之序，《由庚》本第在《華黍》之下，其義不備論。於此而與《崇丘》同處者，以其是成王之詩，故下從其類。" }
      - { type: j, text: "《鹿鳴之什》十篇，五十五章，三百一十五句。" }
      - { type: j, text: "《毛詩正義》" }
