# 春秋左傳正義卷53（孔穎達疏）：j 為經文＋杜預注，z 為疏文。
sections:
  - id: juan53
    name: 正文
    blocks:
      - { type: j, text: "【經】二十有九年，春，公至自乾侯，居於鄆。（以乾侯致，不得見晉侯故。）" }
      - { type: z, text: "注“以乾”至“侯故”。○正義曰：二十五年，“公孫於齊，齊侯唁公於野井”。二十六年經書“公至自齊”。公雖不至齊都，既入齊竟，得與齊侯相見，故書“公至自齊”。往年公如晉，次於乾侯。雖入晉竟，不得與晉侯相見，故書“至自乾侯”，以乾侯致告於廟者，為不得見晉侯故。" }
      - { type: j, text: "齊侯使高張來唁公。唁公至晉不見受。高張，高偃子。○唁音彥。" }
      - { type: z, text: "注“唁公至晉不見受”。○正義曰：《詩毛傳》曰“吊失國曰唁”。二十五年公新失國，齊侯唁公可矣。於此復唁公者，公以齊不憂已，棄而適晉，望得晉人矜之。晉侯不肯見公，齊侯心復恨公，嫌公此舉，故遣唁公所，以嗤笑公也，故云“唁公至晉不見受”。又似更復失國，故唁之。" }
      - { type: j, text: "公如晉，次於乾侯。復不見受，往乾侯。○復，扶又反。" }
      - { type: j, text: "夏四月庚子，叔詣卒。無傳。" }
      - { type: j, text: "秋七月。" }
      - { type: j, text: "冬十月，鄆潰。無傳。民逃其上曰潰，潰散叛公。○潰，戶對反。" }
      - { type: z, text: "注“民逃”至“叛公”。○正義曰：民逃其上曰潰，文三年傳例也。公自二十六年以來常居於鄆，此時公既如晉，必留人守鄆，鄆人潰散而叛公，使公不得更來，當是季氏道之使然。" }
      - { type: j, text: "【傳】二十九年，春，公至自乾侯，處於鄆。齊侯使高張來唁公，稱主君。（比公於大夫。）" }
      - { type: z, text: "注“比公於大夫”。○正義曰：傳稱範宣子撫荀偃雲：“事吳，敢不如事主！”醫和謂趙文子曰“主是謂矣”。如此之類，大夫稱主，傳文多矣。今高張以齊侯之命稱公為主君，以晉不受公，故輕侮之，比公於大夫也。" }
      - { type: j, text: "子家子曰：“齊卑君矣，君袛辱焉。”言往事齊，適取辱。○祗音支。公如乾侯。為齊所卑，故復適晉冀見恤。○復，扶又反。" }
      - { type: j, text: "三月己卯，京師殺召伯盈、尹氏固及原伯魯之子。皆子朝黨也。稱伯魯子，終不說學。○召，上照反。說音悅。尹固之復也，二十六年，尹固與子朝俱奔楚而道還。" }
      - { type: z, text: "注“二十”至“道還”。○正義曰：尹固復還之年，傳雖不載，以婦人尤之雲“其過三歲乎”？知以二十六年在道而還，至此為三歲也。" }
      - { type: j, text: "有婦人遇之周郊，尤之，曰：“處則勸人為禍，行則數日而反，是夫也，其過三歲乎？”夏五月庚寅，王子趙車入於鄻以叛，陰不佞敗之。趙車，子朝之餘也。見王殺伯盈等，故叛。鄻，周邑。○數，所主反。鄻，列勉反。" }
      - { type: j, text: "平子每歲賈馬，賈，買也。○賈，古買反。具從者之衣屨，而歸之於乾侯。公執歸馬者，賣之，賣其馬。乃不歸馬。衛侯來獻其乘馬，曰啟服，啟服，馬名。○乘，如字。" }
      - { type: z, text: "注“啟服馬名”。正義曰：《釋畜》雲：“馬前右足白，啟。”郭璞曰：“《左傳》曰啟服。”《詩》雲：“兩服上襄。”鄭玄雲：“兩服，中央夾來轅者。”此馬毛色名啟，公用以夾轅，故以啟服為名也。" }
      - { type: j, text: "塹而死。隋塹死也。○塹，七豔反。公將為之櫝。為作棺也。○將為，如字，一音於偽反。櫝，徒木反。為作，於偽反，下同。子家子曰：“從者病矣，請以食之。”乃以幃裹之。禮曰，敝幃不棄，為埋馬也。○食音似。裹，古火反。" }
      - { type: z, text: "注“禮曰”至“馬也”。○正義曰：《檀弓》文也。禮有埋馬之法，子家子請以馬肉食從者者，以公將為之櫝，所以深抑之。公感子家子之言，方始依禮以帷裹之。《史記·滑稽傳》雲：“楚莊王有所愛馬，衣以文繡，置之華屋之下，席之以路床，啖之以棗脯。馬病肥死，欲以棺槨大夫禮葬之。優孟者，故楚之樂人也。多辨，常以談笑風諫。於是入門大笑。王驚而問其故。優孟曰：‘馬者，王之所愛也，以楚國之大，何求不得，而以大夫禮葬之？薄，請以人君禮葬之。’王曰：‘何如？’對曰：‘臣請以雕玉為棺，文梓為槨，發甲卒為穿壙，老弱負土，廟食大牢，奉以萬戶之邑。諸侯聞之，皆知大王賤人而貴馬也。’王曰：‘寡人過一至於此！為之奈何？’優孟曰：‘請大王以六畜葬之。以壠灶為槨，銅歷為棺，齊以薑桂，薦以木蘭，祭以粳稻，衣以火光，葬之人腸。’於是王乃使以馬屬大官，無令天下聞之。”彼亦此之類也。" }
      - { type: j, text: "公賜公衍羔裘，使獻龍輔於齊侯，龍輔，玉名。" }
      - { type: z, text: "注“龍輔玉名”。○正義曰：《周禮》：“使澤國用龍節，皆金也。以英蕩輔之。”杜子春雲：“蕩，謂以函器盛此節。”謂鑄金為龍，以玉為函，輔盛龍節，謂之龍輔。此獻函不獻節，故直雲“獻龍輔”。玄卿雲：盛龍節之玉函耳。案《說文》雲：瓏，禱旱玉也，為龍文。又《玉人》雲：“上公用龍。”今輔與龍連文，故云“龍輔玉名”。蓋用此意。" }
      - { type: j, text: "遂入羔裘。齊侯喜，與之陽穀。陽穀，齊邑。公衍、公為之生也，其母偕出。出之產舍。" }
      - { type: z, text: "注“出之產舍”。○正義曰：《內則》雲：“妻將生子，及月辰，居側室。夫使人日再問之，作而自問之。妻不敢見，使姆衣服而對。至於子生，夫復使人日再問之。夫齊，則不入側室之門。子生，男子設弧於門左，女子設帨於門右。三日始負子，男射女否。”然則產舍是側室也。" }
      - { type: j, text: "公衍先生。公為之母曰：“相與偕出，請相與偕告。”留公衍母，使待已，共白公。三日，公為生。其母先以告，公為為兄。公私喜於陽穀，而思於魯，曰：“務人為此禍也。務人，公為也。始與公若謀逐季氏。且後生而為兄，其誣也久矣。”乃黜之，而以公衍為大子。" }
      - { type: j, text: "秋，龍見於絳郊。絳，晉國都。○見，賢遍反，下見龍、朝夕見皆同。魏獻子問於蔡墨蔡墨，晉太史。曰：“吾聞之，蟲莫知於龍，以其不生得也，謂之知，信乎？”對曰：“人實不知，非龍實知。言龍無知，乃人不知之耳。○莫知音智，下謂之知、實知、注無知同。" }
      - { type: z, text: "“人實”至“實知”。○正義曰：人以龍不生得而謂之為知者，此是人實不知，非是龍實能知。言龍可生得，非是不生得也。故說古有養龍之事，以證龍可生得也。以人不知有此事，故今說之。" }
      - { type: j, text: "古者畜龍，故國有豢龍氏，有御龍氏。”豢、御，養也。○豢音患。" }
      - { type: z, text: "注“豢、御，養也”。○正義曰：服虔曰：豢，養也，穀食曰豢。御亦養也。養馬曰圉。禮養犬、豕曰豢。知其以穀養，蓋龍亦食穀也。御與圉同，言養龍猶養馬，故稱御。" }
      - { type: j, text: "獻子曰：“是二氏者，吾亦聞之，而知其故，是何謂也？”對曰：“昔有飂叔安，飂，古國也。叔安，其君名。○飂，力謬反。有裔子曰董父，裔，遠也。玄孫之後為裔。○裔，以制反。實甚好龍，能求其耆欲以飲食之，龍多歸之，乃擾畜龍，以服事帝舜。帝賜之姓曰董，擾，順也。○好，呼報反。耆，時志反。飲，於鴆反，下同。食之音嗣，下不能食、飲食之、食夏後同。擾，而小反。" }
      - { type: z, text: "“乃擾畜龍”。○正義曰：擾，順也。順龍之所欲而畜養之。" }
      - { type: j, text: "氏曰豢龍，豢龍，官名。官有世功，則以官氏。封諸鬷川，鬷夷氏其後也。鬷水上夷，皆董姓。○鬷，子工反。" }
      - { type: z, text: "注“鬷水”至“董姓”。○正義曰：《鄭語》雲“黎為高辛氏火正，命之曰祝融”。其後八姓，董姓鬷夷、豢龍則夏滅之矣，是也。" }
      - { type: j, text: "故帝舜氏世有畜龍。及有夏孔甲，擾於有帝，孔甲，少康之後九世君也。其德能順於天。○夏，戶雅反，下皆同。少，詩照反，下少皞同。" }
      - { type: z, text: "注“孔甲”至“九世”。○正義曰：《帝王世紀》雲：“少康子帝杼，杼子帝芬，芬子帝芒，芒子帝洩，洩子帝不降，不降弟帝喬，喬子帝廣也。至帝孔甲，孔甲，不降子。”" }
      - { type: j, text: "帝賜之乘龍，河、漢各二，合為四。○乘，繩證反。河、漢各二，服雲，河漢各二乘。" }
      - { type: z, text: "注“合為四”。正義曰：服虔雲：四頭為乘，四乘十六頭也。傳言“賜之乘龍”，賜之一乘之龍也。即雲“河漢各二”，是河漢共一乘也。又云：各有雌雄，是河漢之二，皆一雌一雄也。故杜以“為合為四”。" }
      - { type: j, text: "各有雌雄。孔甲不能食，而未獲豢龍氏。有陶唐氏既衰，其後有劉累，陶唐，堯所治地。○治，直吏反。學擾龍於豢龍氏，以事孔甲，能飲食之。夏後嘉之，賜氏曰御龍，夏後，孔甲。以更豕韋之後。更，代也。以劉累代彭姓之豕韋。累尋遷魯縣。豕韋復國，至商而滅。累之後世，復承其國為豕韋氏，在襄二十四年。○更音庚，注同。復，扶又反。" }
      - { type: z, text: "注“更代”至“四年”。○正義曰：傳言“以更豕韋之後”。則豕韋是舊國，廢其君以劉累代之。《鄭語》雲“祝融之後八姓，大彭豕韋為商伯矣”。又云“彭姓彭祖、豕韋則商滅之矣”。如彼文，豕韋之國至商乃滅，於夏王孔甲之時，彭姓豕韋未全滅也。下文雲“劉累懼而遷於魯縣”。明是累遷之後，豕韋復國，至商乃滅耳。襄二十四年傳，範宣子自言“其祖在夏為御龍氏，在商為豕韋氏”，則劉累子孫復封豕韋。杜跡其事，知累之後世更復其國為豕韋氏也。舊無此解，杜自為證，故云在襄二十七年。" }
      - { type: j, text: "龍一雌死，潛醢以食夏後。潛，藏也。藏以為醢，明龍不知。○醢音海。知音智。夏後饗之，既而使求之。求致龍也。懼而遷於魯縣，不能致龍，故懼；遷魯縣，自貶退也。魯縣，今魯陽也。範氏其後也。”晉範氏也。獻子曰：“今何故無之？”對曰：“夫物，物有其官，官脩其方，方，法術。朝夕思之，一日失職，則死及之，失職有罪。○朝，如字，下朝夕見同。失官不食。不食祿。官宿其業，宿，猶安也。其物乃至。設水官脩則龍至。若泯棄之，物乃坻伏，泯，滅也。坻，止也。○泯，彌忍反。坻音旨，又丁禮反。鬱湮不育。鬱，滯也。湮，塞也。育，生也。○湮音因。" }
      - { type: z, text: "“夫物”至“不育”。○正義曰：此論致龍之事。物謂龍也。夫物物各有其官，當謂如龍之輩，蓋言鳳皇、麒麟、白虎、玄龜之屬，每物各有其官主掌之也。其人居此官者，脩其為官方術，從朝至夕，終日脩之。若一日失其所掌之職令，其官方不理，則有死罪及之，居官者當死矣。失其官方，則不得食祿，得死罪是不食祿也。居官者，安其為官之業，使職事脩理，則其所掌之物乃自生至。水官脩則龍至，其餘亦當然也。若滅棄所掌之事，令職事不脩，則其物乃止息而潛伏，沈滯壅塞不復生育，以此，故不可生而得也。○注“宿猶安也”。○正義曰：夜宿所以安身，故云“宿，猶安也”。謂安心思其職業。服虔雲：宿，思也。今日當預思明日之事，如家人宿火矣。玄卿以服義大迂曲。○注“泯，滅也。坻，止也”。○正義曰：《釋詁》文也。上言“官宿其業，其物乃至”。職業不脩，則物不至。物雖不至，尚有物在，若滅棄其官，百事不理，則其物止而潛伏，不復生育，乃令無有此物，非徒不至而已。○注“鬱，滯也。湮，塞也”。○正義曰：賈逵雲：然杜用之也，鬱積是沈滯之義，故為滯也。傳謂塞井為堙井，是堙為塞也。言此物沈滯壅塞不復生也。" }
      - { type: j, text: "故有五行之官，是謂五官，實列受氏姓，封為上公，爵上公。" }
      - { type: z, text: "“實列受氏姓”。正義曰：列謂行列，言五官皆然也。人臣有大功者，天子封為國君，又賜之以姓。諸侯以國為氏，言其得封又得姓，兼受之也。" }
      - { type: j, text: "祀為貴神。社稷五祀，是尊是奉。五官之君長能脩其業者，死皆配食於五行之神，為王者所尊奉。○長，丁丈反，下文同。" }
      - { type: z, text: "注“五官”至“尊奉”。○正義曰：五官之君長死則皆為貴神，王者社稷五祀則尊奉之，如祭配食於五行之神，即下重、該、脩、熙、犁是也。王者祭木、火、土、金、水之神，而以此人之神，配之耳非專祭此人也。分五行以配四時，故五行之神，句芒、祝融之徒，皆以時物之狀而為之名。此五者，本於五行之神作名耳，非與重、該之徒為名也。《晉語》雲：“虢公夢在廟，有神人面白毛虎爪，執鉞行西河，公懼而走。神曰：無走！帝命曰：‘使晉襲於爾門。’公拜稽首。覺，召史嚚佔之，對曰：‘如君之言，則蓐收也，天之刑神也。’”如彼文，虢公所夢之狀，必非該之貌，自是金神之形耳。由此言之，知句芒、祝融、玄冥、后土之徒，皆是木火水土之神名。非所配人之神名也。雖本非配人之名，而配者與之同食，亦得取彼神名以為配者神名。猶社本土神之名，稷本穀神之名，配者亦得稱社稷也。此五行之官，配食五行之神，天子制禮使祀焉，是為王者所尊奉也。" }
      - { type: j, text: "木正曰句芒，正，官長也。取木生句曲而有芒角也，其祀重焉。○句，古侯反，注及下皆同。重，直龍反，下文同。" }
      - { type: z, text: "注“正官”至“重焉”。○正義曰：正訓為長，故為官長，木官之最長也。其火、金、水、土正亦然。賈逵雲：總言萬物，句芒非專木生如句，杜誤耳。木正順春，萬物始生，句而有芒角。杜獨言木者，以木為其主。故經雲“木正”，且木比萬物，芒角為甚，故舉木而言。劉炫以杜不取賈義，而獨舉於木而規杜非也。" }
      - { type: j, text: "火正曰祝融，祝融，明貌，其祀犁焉。○犁，力兮反。" }
      - { type: z, text: "注“祝融”至“犁焉”。○正義曰：杜不解祝，則謂祝融二字共為明貌也。賈逵雲：夏，陽氣明朗。祝，甚也。融，明也。亦以夏氣為之名耳。《鄭語》雲：“黎為高辛氏火正，以焞燿敦大，光明四海，故命之曰‘祝融’。”如彼文，又似由人生名者。彼以其官掌夏，德又稱之，故以夏氣昭明命之耳。" }
      - { type: j, text: "金正曰蓐收，秋物摧蓐而可收也，其祀該焉。○蓐音辱；本又作辱。摧，徂回反。水正曰玄冥，水陰而幽冥，其祀脩及熙焉。○冥，亡丁反。土正曰后土。土為群物主，故稱後也，其祀句龍焉。在家則祀中霤，在野則為社。○霤，力救反。" }
      - { type: z, text: "注“土為”至“為社”。○正義曰：後者，君也。群物皆土所載，故土為群物之主，以君言之，故云后土也。賈逵雲：句芒祀於戶，祝融祀於灶，蓐收祀於門，玄冥祀於井，后土祀於中霤。今杜雲“在家則祀中霤”，是同賈說也。家謂宮室之內，對野為文，故稱家，非卿大夫之家也。言在野者，對家為文，雖在庫門之內，尚無宮室，故稱野。且卿大夫以下，社在野田。故《周禮·大司徒》雲：“辨其邦國都鄙之數，制其畿疆而溝封之，設其社稷之壝而樹之田主，各以其野之所宜木，遂以名其社。”鄭玄雲：“社稷后土及田正之神，田主田神，后土田正之所依也。詩人謂之田祖所宜木，謂若松柏栗也。”是在野則祭為社也。此野田之社，民所共祭，即《月令》“仲春之月，擇元日，命人社”。是也。劉炫雲：天子以下俱荷地德，皆當祭地，但名位有高下，祭之有等級。天子祭地，祭大地之神也。諸侯不得祭地，使之祭社也。家又不得祭社，使祭中霤也。霤亦地神，所祭小，故變其名。賈逵以句芒祀於戶云云，言雖天子之祭五神亦如此耳。杜以別祭五行神，以五官配之，非祀此五神於門、戶、井、灶、中霤也。門、戶、井、灶直祭門戶等神，不祭句芒等也。唯有祭后土者，亦是土神，故特辨之。雲“在家則祀中霤，在野則為社”。言彼與中霤亦是土神，但祭有大小。《郊特牲》雲：“社所以神地之道也。地載萬物，取財於地，教民美報焉。家主中霤而國主社，示本也。”是在家則祀中霤也。《大司徒》以下，同此禮也。" }
      - { type: j, text: "龍，水物也，水官棄矣，故龍不生得。棄，廢也。" }
      - { type: z, text: "“龍水”至“生得”。○正義曰：漢氏先儒說《左氏》者，皆以為五靈配五方，龍屬木，鳳屬火，麟為土，白虎屬金，神龜屬水。其五行之次，木生火，火生土，土生金，金生水，水生木。王者脩其母則致其子，水官脩則龍至，木官脩則鳳至，火官脩則麟至，士官脩則白虎至，金官脩則神龜至，故為其說雲：視明禮脩而麟至，思睿信立而白虎擾，言從文成而神龜在沼，聽聰知正而名川出龍，貌共體仁則鳳皇來儀，皆脩其母而致其子也。解此龍水物者，言龍為東方之獸，是此方水官之物也。水官廢矣，故龍不生得，言母不脩，故子不至也。杜氏既無其說，未知與舊同否。此下不注，似與舊說異，或當以為龍是水內生長，故為水官之物。水官廢矣，故龍不生得，言水官不脩故無水內之靈獸也。若如此解，則上雲“物有其官”，當謂五靈之物，各各自有其官，官能脩理，各自致物。龍是水內之物，可令水官致龍。其鳳、皇、麟、虎之輩共在天地之間，不是寢金、食火、木生、土出，未知何官致鳳？何官致虎？未測杜旨，不可強言。是用闕疑，以俟來哲。" }
      - { type: j, text: "不然，《周易》有之，言若不爾，《周易》無緣有龍。在《乾》《乾》下《乾》，上《乾》。○乾，其連反；本亦作乾。之《姤》，《巽》下《乾》上，《姤》。《乾》初九變。○姤，古豆反。曰‘潛龍勿用’；《乾》初九爻辭。○爻，戶交反。其《同人》《離》下《乾》上，《同人》。《乾》九二變。曰，‘見龍在田’；《乾》九二爻辭。其《大有》《乾》下《離》上，《大有》。《乾》九五變。曰，‘飛龍在天’；《乾》九五爻辭。其《夬》。《乾》下《兌》上，《夬》。《乾》上九變。○夬，古快反。兌，徒外反。曰，‘亢龍有悔’；《乾》上九爻辭。○亢，苦浪反。其《坤》《坤》下《坤》上，《坤》。《乾》六爻皆變。○坤，本又作巛，空門反。曰，‘見群龍無首，吉’；《乾》用九爻辭。《坤》之《剝》《坤》下《艮》上，《剝》。《坤》上六變。○剝，邦角反。艮，古恨反。曰，‘龍戰於野’。《坤》上六爻辭。" }
      - { type: z, text: "“在乾至於野”。○正義曰：傳例上下雖不用筮，但指此卦某爻之義者，即以某爻之變，更別為卦，即雲此卦之某卦。則此《乾》之《姤》，宣十二年“《師》之《臨》”，是也。劉炫雲：杜以“之”為“適”。炫謂《易》之爻變則成一卦，遂以彼卦名爻，《乾》之初九，《姤》卦。爻九二，《同人》。爻九五，《大有》。爻上九《夬》卦。爻用九全變則成《坤》卦，故謂用九為《坤》。蔡墨此意取《易》文耳，非揲蓍求卦，安有之適之義？若以之為之適，則其非之適之意，何以言其《同人》其《大有》？此本當言初九，九二。但以爻變成卦，即以彼卦名爻，其意不取於之適。所言其《同人》，其《大有》，猶引《詩》言其二章，其三章。先引初九，故言《乾》卦之《姤》，爻初九。言《乾》以下，不復須雲《乾》。故言其《同人》、其《大有》，就《乾》卦而其之，其此《同人》爻，其此《大有》爻，以下文勢悉皆若是也。○“之姤”。○正義曰：《巽》下《乾》上，《姤》。《乾》之初九爻變而成《姤》卦也。其《彖》曰：“姤，遇也。柔遇剛也。”《乾》為天，為剛。《巽》為風，為柔。風行必有所遇，猶女行而遇男，故名此卦為《姤》也。○注“《乾》初九爻辭”。○正義曰：蔡墨此言取《易》有龍字而已，無取於《易》之義理，故柱注唯指其辭之所在，不解其辭之意。其說《易》者，自具於此，不復煩言也。○“《同人》”。○正義曰：《離》下《乾》上，《同人》。《乾》之九二爻變而成《同人》之卦也。其《象》曰：“天與火，《同人》。”天體在上，火性炎上，同於天也。猶君設政教而臣民從之，和同之義，故名此卦為《同人》也。服虔雲：天在上，火炎上，同於天，天不可同，故曰“同人”。○“《大有》”。○正義曰：《乾》下《離》上，《大有》。《乾》之九五爻變而成《大有》之卦也。其《彖》曰：“《大有》，柔得尊位大中，而上下應之，曰《大有》。”柔得尊位，謂六五也。五位尊而柔居之，處尊以柔，居中以大，體無二陰，以分其應，上下應之，無所不納，大有之義，故名此卦為《大有》。○“夬”。○正義曰：《乾》下《兌》上，《夬》。《乾》之上九爻變而成《夬》卦也。其彖曰：“夬，決也。剛決柔也。”此卦五陽而決一陰，《乾》為天，為剛，為健。兌為澤，為柔，為說。以剛正決柔邪，故名此卦為《夬》。○注“《乾》用九爻辭”。○正義曰：《乾》之六爻皆陽，《坤》之六爻皆陰，以二卦其爻既純，故別總其用而為之辭。故《乾》有用九，《坤》有用六，餘卦其爻不純，無總用也。六爻皆變，乃得總用。《乾》之六爻皆變則成《坤卦》，故謂用九之辭為其《坤》也。六爻既變而不用卦下之辭者，《周易》用變，卦下之辭非變，又無龍文。史墨指說於龍，故以用為語。○“《坤》之《剝》”。○正義曰：《坤》下《艮》上，《剝》。《坤》之上六爻變而成《剝》卦也。其《彖》曰：“剝，剝也。柔變剛也。”《剝卦》五陰而一陽，陰漸長而滅陽。猶邪長而剝損正道，故名此卦為《剝》也。" }
      - { type: j, text: "若不朝夕見，誰能物之？”物，謂上六卦所稱龍各不同也。今說《易》者，皆以龍喻陽氣，如史墨之言，則為皆是真龍。" }
      - { type: z, text: "“若不”至“物之”。○正義曰：蔡墨言，古者，龍可生得，人皆見之，故《周易》之辭以龍為喻。若使龍不朝夕出見，誰能知其動靜，而得以物名之？《易》言“潛龍”、“飛龍”及“龍戰”之等，明是見其飛、潛，見其戰鬥，而得以物名之。是知龍可生得，古人見龍形也。" }
      - { type: j, text: "獻子曰：“社稷五祀，誰氏之五官也？”問五官之長皆是誰。對曰：“少皞氏有四叔，少皞，金天氏。○皞，戶老反。" }
      - { type: z, text: "“少皞氏有四叔”。○正義曰：少皞氏有四叔，四叔是少皞之子孫，非一時也，未知於少皞遠近也。四叔出於少皞耳，其使重為句芒，非少皞使之。《世族譜》雲：“少皞氏，其官以鳥為名。”然則此五官皆在高陽之世也。《楚語》雲：“少皞氏之衰也，九黎亂德，民神雜擾，不可方物。顓頊受之，乃命木正重司天以屬神，命火正黎司地以屬民。”是則重黎居官，在高陽之世也。又《鄭語》雲：“黎為高辛氏火正，命之曰祝融”，則黎為祝融，又在高辛氏之世。案《世本》及《楚世家》雲：“高陽生稱，稱生卷章，卷章生黎。”如彼文，黎是顓頊之曾孫也。《楚語》雲“少皞之衰，顓頊受之，即命重黎。”似是即位之初，不應即得命曾孫為火正也。少皞世代不知長短，顓頊初已命黎，至高辛又加命，不應一人之身綿歷兩代。事既久遠，書復散亡，如此參差，難可考校。《世家》雲：“共工作亂，帝嚳使黎誅之而不盡。帝誅黎，而以其弟吳回為黎，復居火正，為祝融。”即如此言，黎或是國名、官號，不是人之名字。顓頊命黎，高辛命黎，未必共是一人。傳言世不失職，二者或是父子，或是祖孫，其事不可知也。由此言之，少皞四叔，未必不有在高辛世者也。此五祀者，居官有功，以功見祀，不是一時之人。脩、熙相代為水正，即非一時也。且傳言“世不失職”，便是積世能官，其功益大，非是暫時有功，遂得萬世承祀，明是歷選上代，取其中最有功者，使之配食。亦不知初以此人配食，何代聖王為之，蓋在高辛、唐虞之世耳。" }
      - { type: j, text: "曰重、曰該、曰脩、曰熙，實能金、木及水。能治其官。○重，直龍反。該，古咳反。使重為句芒，木正。該為蓐收，金正。脩及熙為玄冥，二子相代為水正。世不失職，遂濟窮桑，此其三祀也。窮桑，少皞之號也。四子能治其官，使不失職，濟成少皞之功，死皆為民所祀。窮桑地在魯北。" }
      - { type: z, text: "注“窮桑”至“魯北”。○正義曰：窮桑，少皞之號。《帝王世紀》亦然。賈逵雲：處窮桑以登為帝，故天下號之曰窮桑帝。賈以濟為渡也。言四叔子孫，世不失職，遂渡少皞之世。杜以少皞之世以鳥名官，不得有木正火正，故以濟為成。四子能治其官，使不失職，濟成少皞之功。言少皞有王功，子孫能成之，故死皆為民所祀也。少皞居窮桑。定四年傳稱“封伯禽於少皞之虛”，故云“窮桑地在魯北”。《土地名》：窮桑闕。言在魯北，相傳雲耳。" }
      - { type: j, text: "顓頊氏有子曰犁，為祝融；犁為火正。○顓音專。頊，許玉反。共工氏有子曰句龍，為后土，共工在大皞後，神農前，以水名官。其子句龍，能平水土，故死而見祀。○共音恭。" }
      - { type: z, text: "注“共工”至“見祀”。○正義曰：十七年傳，郯子言前世名官，從下而上。先言炎帝以火名次，言共工以水名，次言大皞以龍名。是共工在大皞後、神農前，以水名官者也。《祭法》曰：“共工氏之霸九州也，其子曰后土，能平九州，故祀以為社。”能平九州，是能平水土也。言共工有子，謂後世子耳，亦不知句龍之為后土，在於何代。少皞氏既以鳥名官，此當在顓頊以來耳。" }
      - { type: j, text: "此其二祀也。后土為社；方答社稷，故明言為社。" }
      - { type: z, text: "注“方答”至“為社”。○正義曰：獻子問社稷五祀，既答五祀，當更答社稷。但句龍既為后土，又以配社。蔡墨既答五祀，方答社稷。故明言後上為社也。" }
      - { type: j, text: "稷，田正也。掌播殖也。" }
      - { type: z, text: "“稷田，正也”。○正義曰：《月令》雲：“孟春行冬令，則首種不入。”鄭玄雲：“首種謂稷也。”《周語》雲：“宣王不藉千畝。虢文公諫曰：‘民之大事在農，是故稷為大官。’”然則百穀稷為其長，遂以稷名為農官之長。正，長也。稷是田官之長。" }
      - { type: j, text: "有烈山氏之子曰柱，為稷，烈山氏，神農世諸侯。○烈，如字，《禮記》作厲山。" }
      - { type: z, text: "“烈山”至“諸侯”。○正義曰：《魯語》及《祭法》皆雲：“烈山氏之有天下也，其子能殖百穀，故祀以為稷。”言有天下則是天子矣。杜注不得為諸侯也。賈逵、鄭玄皆雲：烈山，炎帝之號。杜言神農世諸侯者，案《帝王世紀》，神農本起烈山。然則初封烈山為諸侯，後為天子，猶帝堯初為唐侯然也。若然，烈山即神農。而云“神農世為諸侯”者，案世紀，神農為君，總有八世，至榆罔而滅，亦稱神農氏，是總號神農也。故烈山氏得於神農之世為諸侯，後為神農也。劉炫以為烈山氏即神農非諸侯而規杜，非也。此及《魯語》皆雲“其子曰柱”，《祭法》雲“農者”，劉炫雲：蓋杜是名，其官曰農，猶呼周棄為稷。" }
      - { type: j, text: "自夏以上祀之。祀柱。○上，總掌反。周棄亦為稷，棄，周之始祖，能播百穀。湯既勝夏，廢柱而以棄代之。" }
      - { type: z, text: "注“棄周”至“代之”。○正義曰：棄為周之始祖，能播殖百穀，經傳備有其事。以其後世有天下，號國曰周，故以周冠棄，棄時未稱周也。《書·序》雲：“湯既勝夏，欲遷其社，不可。作夏社。”孔安國雲：“湯承堯舜禪代之後，順天應人，逆取順守，而有慚德，故革命創制，改正易服，變置社稷，而後世無及句龍者，故不可而止。”是言成湯變置社稷之由也。湯於帝世年代猶近，功之多少傳習可知，故得量其優劣。改易祀典，意欲遷社，而無及句龍。棄功乃過於柱，廢柱以棄為稷也。其五祀之神，重犁之輩，若更有賢能亦應遷徙，但其功莫之能先，帝王不敢改易，故得永流萬代，常在祀典。良由後世之臣弱，后王之意謙，故也。" }
      - { type: j, text: "自商以來祀之。”傳言蔡墨之博物。" }
      - { type: j, text: "冬，晉趙鞅、荀寅帥師城汝濱，趙鞅，趙武孫也。荀寅，中行荀吳之子。汝濱，晉所取陸渾地。○濱音賓。行，戶郎反。遂賦晉國一鼓鐵，以鑄刑鼎，令晉國各出功力，共鼓石為鐵，計令一鼓而足，因軍役而為之，故言遂。○鑄，之樹反。令，力呈反。" }
      - { type: z, text: "注“令晉”至“言遂”。○正義曰：服虔雲：鼓，量名也。《曲禮》曰：“獻米者操量鼓。”取晉國一鼓鐵以鑄之，但禮之將命，置重而執輕，鼓可操之，以將命即豆區之類，非大器也。唯用一鼓則不足以成鼎，家賦一鼓，而鐵又大多。且金鐵之物，當稱之以權衡，數之以鈞石，寧用量米之器量之哉？故杜以為賦晉國者，令民各出功力，均賦取其功也。冶石為鐵，用橐搧火，動橐謂之鼓，今時俗語猶然。令眾人鼓石為鐵，計令一鼓使足，故云“賦晉國一鼓鐵”也。遂者，因上生下為辭，因城汝濱，遂鑄刑鼎，故言遂也。" }
      - { type: j, text: "著範宣子所為刑書焉。仲尼曰：“晉其亡乎！失其度矣。夫晉國將守唐叔之所受法度，以經緯其民，卿大夫以序守之，序，位次也。" }
      - { type: z, text: "“著範”至“刑書”。○正義曰：範宣子製作刑書，施於晉國，自使朝廷承用，未嘗宣示下民。今荀寅謂此等宣子之書，可以長為國法，故鑄鼎而銘之，以示百姓。猶如鄭鑄刑鼎，仲尼譏之，其意亦與叔向譏子產同。" }
      - { type: j, text: "民是以能尊其貴，貴是以能守其業。貴賤不愆，所謂度也。" }
      - { type: z, text: "“民是”至“度也”。○正義曰：守其舊法，民不豫知，臨時制宜，輕重難測。民是以能尊其貴，畏其威刑也。官有正法，民常畏威，貴是以能守其業，保祿位也。貴者執其權柄，賤者畏其威嚴，貴賤尊卑不愆，此乃所謂度也。言所謂法度，正如此是也。" }
      - { type: j, text: "文公是以作執秩之官，為被廬之法，僖二十七年，文公蒐被廬，脩唐叔之法。○被，皮義反。廬，力居反。蒐，本又作搜，所求反。以為盟主。今棄是度也，而為刑鼎，民在鼎矣，何以尊貴？棄禮徵書，故不尊貴。貴何業之守？民不奉上，則上失業。貴賤無序，何以為國？" }
      - { type: z, text: "“今棄至為國”。○正義曰：今棄是貴賤常度而為刑書之鼎，民知罪之輕重在於鼎矣。貴者斷獄不敢加增，犯罪者取驗於書，更復何以尊貴？威權在鼎，民不忌上，貴復何業之守？貴之所以為貴，只為權勢在焉，勢不足畏，故業無可守，貴無可守則賤不畏威，貴賤既無次序，何以得成為國？" }
      - { type: j, text: "且夫宣子之刑，夷之蒐也，晉國之亂制也，範宣子所用刑，乃夷蒐之法也。夷蒐在文六年，一蒐而三易中軍帥，賈季、箕鄭之徒遂作亂，故曰亂制。○帥，所類反。" }
      - { type: z, text: "注“範宣”至“亂制”。○正義曰：於時晉侯將以士縠、梁益耳將中軍。先克曰：“狐、趙之勳，不可廢也。”以狐射姑將中軍，趙盾佐之。陽處父改蒐於董，更以趙盾將中軍，狐射姑佐之。是一蒐而三易中軍帥。三易者，士穀、梁益耳將中軍，是易代前人，是一易也。狐射姑將中軍是二易也。又趙盾將中軍是三易也。致使賈季、箕鄭之徒怨恨而作亂。其事文公傳具矣。因此蒐而有此亂，故曰“晉國之亂制”。" }
      - { type: j, text: "若之何以為法？”蔡史墨曰：“範氏、中行氏其亡乎！蔡史墨即蔡墨。中行寅為下卿，而幹上令，擅作刑器，以為國法，是法奸也。又加範氏焉，易之，亡也。範宣子刑書中既廢矣，今復興之，是成其咎。○擅，市戰反。復，扶又反。咎，其九反。" }
      - { type: z, text: "“又加”至“亡也”。○正義曰：宣子刑書久已廢矣，今復變易興之，以成其滅亡也。劉炫雲：範氏取蒐之法以為國制，雖則為非，書已廢矣。縱應有禍，亡釁已歇，今荀寅更述其事，又加增範氏之惡焉。範氏巳欲免禍，今復改易之而使亡。" }
      - { type: j, text: "其及趙氏，趙孟與焉。然不得已，若德，可以免。”鑄刑鼎本非趙鞅意，不得已而從之。若能脩德，可以免禍。為定十三年荀寅、士吉射人朝歌以叛。○與音預。朝，如字。" }
      - { type: j, text: "【經】三十年，春，王正月，公在乾侯。（釋不朝正於廟。）夏六月庚辰，晉侯去疾卒。（未同盟而赴以名。○去，起呂反。）" }
      - { type: j, text: "秋八月，葬晉頃公。三月而葬，速。○頃音傾。" }
      - { type: z, text: "“頃公”。○正義曰：諡法：“慈仁和民曰頃。”" }
      - { type: j, text: "冬十有二月，吳滅徐，徐子章羽奔楚。徐子稱名，以名告也。" }
      - { type: j, text: "【傳】三十年，春，王正月，公在乾侯，不先書鄆與乾侯，非公，且徵過也。（徵，明也。二十七年、二十八年，公在鄆，二十九年公在乾侯，而經不釋朝正之禮者，所以非責公之妄，且明過謬猶可掩，故不顯書其所在，使若在國然。自是鄆人潰叛，齊、晉卑公，子家忠謀，終不能用。內外棄之，非復過誤所當掩塞，故每歲書公所在。○徵，直升反；或本作懲誤。復，扶又反。）" }
      - { type: z, text: "“春王”至“過也”。○正義曰：經書“公在乾侯”者，季氏以此告廟，釋公不得朝正，故國史書之於策也。《釋例》曰：“昭公之孫，每正月必書者，以孫告廟也。公二十五年始出居鄆及乾侯，累歲居外，而仲尼不書於經，故傳曰‘不先書鄆與乾侯，非公，且徵過也’。既以非責公之妄，且明過謬之可掩，故不顯書其在外，使若在國然也。自三十年至於終沒，則皆顯書其所在之地，傳皆隨年而互言其事，明罪之在公，非復過謬也。三代封建，自上及下，降殺以兩。君不亢高，臣不極卑，彊弱相參，眾力相須，賢愚相廁，故雖有昏亂之君，亦有忠賢之輔。我周東遷，晉鄭是依。無知之亂，實獲小白。驪姬之妖，重耳以興。天下雖瓦解，而不土崩，海內雖鼎沸，而不盆溢。天生季氏，以貳魯侯，季氏未有篡奪之惡，公雖失志，亦無抽筋倒懸之急。聽用隸豎僥倖之私，既不能強，又不能弱，所以身死於外，見貶於春秋也。”是言罪在公，書公在之意也。杜言“見貶於春秋”者，公當在國治民，每歲書公在外，是其貶責公也。劉炫雲：序雲諸言不書，皆仲尼新意，然則前三年魯史皆書公在，仲尼去之。仲尼所以不於此先書公在鄆與乾侯者，所以非公之妄，妄伐季氏，且明過謬猶可掩。此年書者，自是鄆人潰叛云云。此年雲“非公，且徵過”；三十一年雲“言不能外內”；三十二年雲“言不能外內，又不能用其人”，每歲發傳，言公之罪也。○注“徵明”至“所在”。○正義曰：不先書鄆與乾侯，一事之中有兩種之意。一者，非責公之妄；一者，明公過謬猶可掩也。非責公之妄者，以君舉必書，公在乾侯與鄆，臣子當委曲詳錄，今輕略不記，似若不足可錄然，所以非責公之妄也。明公過謬猶可掩者，被臣所逐，出居於外，若顯然書之，則恥惡尢甚，故隱而不書，猶若在國，欲明公過謬之失尚可容掩也。此以徵為明，明公過可掩也。襄二十八年傳雲：“王人來告喪。問崩日，以甲寅告。故書之，以徵過。”徵，亦為明，明告喪者之過也。彼言徵，審也。審其事知無他故，以明其過失也。服虔雲：非公且徵過。昭公無道，久在外，季氏非公，不肯釋言公在某地，《春秋》之義亦以不書徵季氏之過。此年書者，公不得入晉，外內有困辱，季氏閔而釋之，所謂事君如在國。案明年傳雲“言不能外內”。又明年傳文“言不能外內，又不能用其人”。皆是傳說經意，非責昭公，不是季氏非公也。即如服言，往前季氏非公，不肯釋公所在，此年以後，方始閔而釋之，所謂事君如在國，則往前未釋之時不如在國矣，二十七年扈之會，範獻子何以已言季氏“事君如在國”也？季氏奪公鄆邑，與公交戰，行貨齊晉，使不納公。禱於煬宮，求君不入。及其死也，猶欲絕其兆域，加之惡諡，閔公之事復安在乎？" }
      - { type: j, text: "夏六月，晉頃公卒。秋八月，葬。鄭游吉吊，且送葬。魏獻子使士景伯詰之，曰：“悼公之喪，子西吊，子蟜送葬。在襄十五年。○詰，起吉反。矯，居表反。今吾子無貳，何故？”吊、喪共使。○使，所吏反。對曰：“諸侯所以歸晉君，禮也。禮也者，小事大、大字小之謂。事大在共其時命，隨時共所求。○共音恭，注及下同。字小在恤其所無。以敝邑居大國之間，共其職貢，與其備禦不虞之患，豈忘共命？言不敢忘共命，以所備禦者多，不及辦之。○御，魚呂反，注同。辦，皮莧反。先王之制；諸侯之喪，士吊，大夫送葬；唯嘉好、聘享、三軍之事於是乎使卿。晉之喪事，敝邑之間，先君有所助執紼矣。紼，輓索也。禮，送葬必執紼。○好，呼報反。間音閒，下同。紼音弗。輓，本又作挽，音晚。索，悉各反。" }
      - { type: z, text: "注“紼輓”至“執紼”。○正義曰：紼，禮或作綍。《禮記·緇衣》雲：“王言如絲，其出如綸。王言如綸，其出如綍。”綍是大繩也。《周禮》天子葬用六綍。《喪大記》君葬用四綍，大夫葬用二綍。紼為葬之所用，是輓索也。案《禮·雜記》，諸侯執綍五百人，大夫三百人。鄭玄雲：“天子蓋千人也。天子諸侯之喪殯於西序，而屬綍焉。備火災而輓之也。”《王制》雲：“喪三年不祭，唯祭天地社稷，為越紼而行事。”謂喪在殯，逾紼而行祭也。《周禮·大司徒》雲：“大喪，帥六鄉之眾庶。屬其六引。”又《遂人》雲：“大喪，帥六遂之役，屬六綍。”鄭玄《喪大記》注云：“在棺曰綍，行道曰引，至壙將窆又曰綍。”是綍引一物，從所在而異名耳。“禮送葬必執紼”，《曲禮》文也。鄭玄雲：“葬喪之大事，紼引車索也。”鄭之先君親送晉侯葬者，傳無其文，游吉今言之，蓋亦嘗有矣。" }
      - { type: j, text: "若其不間，雖士、大夫有所不獲數矣。不得如先王禮數。大國之惠，亦慶其加，慶，善也。謂善其君自行。而不討其乏，明厎其情，厎，致也。○厎音旨。取備而已，以為禮也。靈王之喪，在襄二十九年。" }
      - { type: z, text: "“慶其”至“而已”。○正義曰：善其有加，不討其乏，明知鄭國致其情實，取充備而已。" }
      - { type: j, text: "我先君簡公在楚，我先大夫印段實往，敝邑之少卿也。少，年少也。○印，一刃反。少，詩照反，注同。" }
      - { type: z, text: "“我先君簡公在楚”。正義曰：由簡公在楚，上卿守國，故少卿行耳。鄭玄以為簡公若在，君當自行。其言非傳旨也。" }
      - { type: j, text: "王吏不討，恤所無也。今大夫曰：‘女盍從舊？’盍，何不也。○女音汝。盍，胡獵反，下同。舊有豐有省，不知所從。從其豐，則寡君幼弱，是以不共。從其省，則吉在此矣。唯大夫圖之！”晉人不能詰。傳言大叔之敏。○省，所景反，下同。" }
      - { type: j, text: "吳子使徐人執掩餘，使鍾吾人執燭庸，二十七年奔故。二公子奔楚。楚子大封，而定其徙，大封與土田，定其所徙之居。使監馬尹大心逆吳公子，使居養，二子奔楚，楚使逆之於竟也。養，即所封之邑。○監，古銜反。竟音境。莠尹然、左司馬沈尹戌城之；城養。○莠音誘。取於城父與胡田以與之，胡田，鬍子之地。將以害吳也。子西諫曰：“吳光新得國，而親其民，視民如子，辛苦同之，將用之也。若好吳邊疆，使柔服焉，猶懼其至。柔服，謂不與吳構怨。○若好，呼報反，一本作吾好。疆，居良反。吾又疆其讎，以重怒之，無乃不可乎！讎，謂二公子。○重，直用反。吳，周之胄裔也，而棄在海濱，不與姬通，今而始大，比於諸華。光又甚文，將自同於先王。先王，謂大王、王季，亦自西戎始比諸華。○胄，直又反。大王音泰。不知天將以為虐乎，使翦喪吳國而封大異姓乎，其抑亦將卒以祚吳乎，其終不遠矣。言其事行可知不久。○喪，息浪反。祚，字故反。我盍姑億吾鬼神，億，安也。○億，於力反。而寧吾族姓，以待其歸，善惡之歸。將焉用自播揚焉？”播揚猶勞動也。○焉，於虔反。播，被我反，又波賀反，注同。王弗聽。吳子怒。冬十二月，吳子執鍾吳子。遂伐徐，防山以水之。防壅山水以灌徐。○壅，於勇反。灌，古亂反。己卯，滅徐。徐子章禹斷其發，斷髮自刑，示懼。○斷，丁管反，注同。攜其夫人以逆吳子。吳子唁而送之，使其邇臣從之，遂奔楚。邇，近也。楚沈尹戌帥師救徐，弗及。遂城夷，使徐子處之。夷，城父也。吳子問於伍員曰：“初而言伐楚，在二十年。○員音雲。餘知其可也，而恐其使餘往也，又惡人之有餘之功也。今餘將自有之矣。伐楚何如？”對曰：“楚執政眾而乖，莫適任患。”若為三師以肄焉，肄，猶勞也。○惡，烏路反。適，丁歷反。任音壬。肄，本又作肆，以制反，下同。一師至，彼必皆出。彼出則歸，彼歸則出，楚必道敝。罷敝於道。○罷音皮，下文同。亟肄以罷之，亟，數也。○亟，欺冀反。數，所角反。多方以誤之。既罷而後以三軍繼之，必大克之。”闔廬從之，楚於是乎始病。為定四年吳入楚傳。" }
      - { type: j, text: "【經】三十有一年，春，王正月，公在乾侯。季孫意如會晉荀躒於適歷。（適歷，晉地。○躒，力狄反。適，丁歷反。）" }
      - { type: j, text: "夏，四月，丁巳，薛伯穀卒。襄二十五年盟重丘。○重，直龍反。" }
      - { type: z, text: "注“襄二”至“重丘”。○正義曰：傳言“同盟故書”。此穀與魯必嘗同盟矣。薛於重丘以前，雖數與魯盟，伯薛入春秋以來卒葬，不見經傳，未知此穀以何年即位，故舉去今近者言之。" }
      - { type: j, text: "晉侯使荀躒唁公於乾侯。將使意如迎公，故荀躒來唁。" }
      - { type: j, text: "秋，葬薛獻公。無傳。" }
      - { type: j, text: "冬，黑肱以濫來奔。黑肱，邾大夫。濫，東海昌慮縣。不書邾，史闕文。○濫，力甘反，或力蹔反。慮音閭，又如字。" }
      - { type: z, text: "注“不書邾，史闕文”。○正義曰：《公羊》、《穀梁》亦以濫為邾邑，而傳解其無邾之意，言邾人以濫封此黑肱，使為別國，故不系於邾。以非天子所封，故無子男爵號。其言不可通於《左氏》，《左氏》無傳明是闕文。二傳見其文闕而妄為說耳。" }
      - { type: j, text: "十有二月，辛亥朔，曰有食之。" }
      - { type: j, text: "【傳】三十一年，春，王正月，公在乾侯，言不能外內也。（公內不容於臣子，外不容於齊、晉，所以久在乾侯。）" }
      - { type: j, text: "晉侯將以師納公。範獻子曰：“若召季孫而不來，則信不臣矣，然後伐之，若何？”晉人召季孫。獻子使私焉，曰：“子必來，我受其無咎。”言我為子受無咎之任。○咎，其九反，下注放此。為，於偽反。" }
      - { type: z, text: "“我受其無咎”。○正義曰：言我為子受其重任，其使子必無咎。受其貨故保任之。" }
      - { type: j, text: "季孫意如會晉荀躒於適歷。荀躒曰：“寡君使躒謂吾子：‘何故出君？有君不事，周有常刑。子其圖之！’”季孫練冠、麻衣，跣行，示憂戚。○出，如字，又敕律反。跣，素典反。" }
      - { type: z, text: "“季孫”至“跣行”。○正義曰：練冠蓋如喪服斬衰，既練之後布冠也。麻衣當是布深衣也。《問喪》雲：“親始死，徒跣。”跣行不屨，以其不得事君，示已憂戚之深也。" }
      - { type: j, text: "伏而對曰：“事君，臣之所不得也，敢逃刑命？言原事君，君不肯還，不敢闢罪。君若以臣為有罪，請囚於費，以待君之察也，亦唯君。若以先臣之故，不絕季氏，而賜之死。雖賜以死，不絕其後。○費音秘。" }
      - { type: z, text: "“不絕”至“之死”。○正義曰：此季孫探言罪已之意，不絕季氏之祀，或更立其子弟，直賜其身死而已。服虔雲：言賜不使死，是為以死賜之。若賜死即是不殺，下句何須更言“弗殺弗亡”？" }
      - { type: j, text: "若弗殺弗亡，君之惠也，死且不朽。若得從君而歸，則固臣之原也，敢有異心？”君皆謂魯侯也。蓋季孫探言罪已輕重，以答荀躒。○探，他南反。夏，四月，季孫從知伯如乾侯。知伯，荀躒。○知音智。子家子曰：“君與之歸。一慚之不忍，而終身慚乎？”公曰：“諾。”眾曰：“在一言矣，君必逐之！”言晉既憂君，君一言使晉，晉必逐之。荀躒以晉侯之命唁公，且曰：“寡君使躒以君命討於意如，意如不敢逃死，君其入也！”公曰：“君惠顧先君之好，施及亡人，將使歸糞除宗祧以事君，則不能見夫人。已所能見夫人者，有如河！”夫人，謂季孫也。言若見季孫，已當受禍，明如河以自誓。○好，呼報反。施，以豉反。祧，他彫反。夫音扶，下及注同。荀躒掩耳而走，怪公所言，示不忍聽。曰：“寡君其罪之恐，敢與知魯國之難！言恐獲不納君之罪，今納而不入，何敢復知耶。○與音預。難，乃旦反。復，扶又反。臣請復於寡君。”退而謂季孫：“君怒未怠，子姑歸祭。”歸攝君事。子家子曰：“君以一乘入於魯師，季孫必與君歸。”公欲從之。眾從者脅公，不得歸。傳言君弱，不得復自在。○乘，繩證反。眾從，才用反。" }
      - { type: j, text: "薛伯穀卒，同盟，故書。謂書名也。入《春秋》來，薛始書名，故發傳。經在荀躒唁公上，傳在下者，欲魯事相次。" }
      - { type: j, text: "秋，吳人侵楚，伐夷，侵潛、六。皆楚邑。楚沈尹戌帥師救潛，吳師還。楚師遷潛於南岡而還。吳師圍弦，左司馬戌、右司馬稽帥師救弦，及豫章，左司馬沈尹戌。○稽音啟，又古兮反。吳師還。始用子胥之謀也。謀在前年。" }
      - { type: j, text: "冬，邾黑肱以濫來奔。賤而書名，重地故也。黑肱非命卿，故曰賤。君子曰：“名之不可不慎也如是，是，黑肱也。夫有所有名而不如其已。有所，謂有地也。言雖有名，不如無名。已，止也。以地叛，雖賤，必書。地以名其人，終為不義，弗可滅已。是故君子動則思禮，行則思義；不為利回，回正心也。○不為，於偽反，下不為同。不為義疚。疚，病也。見義則為之。○疚，久又反。或求名而不得，或欲蓋而名章，懲不義也。齊豹為衛司寇，守嗣大夫，守先人嗣，言其尊。○懲，直升反，下同。作而不義，其書為‘盜’。求名而不得也。二十年，豹殺衛侯兄，欲求不畏彊禦之名。邾庶其、在襄二十一年。莒牟夷、在五年。邾黑肱以土地出，求食而已，不求其名，賤而必書。《春秋》叛者多，唯取三人來適魯者。三人皆小國大夫，故曰賤。此二物者，所以懲肆而去貪也。物，事也。肆，放也。齊豹書盜，懲肆也。三叛人名，去貪也。○去，起呂反。若艱難其身，身為艱難。以險危大人，大人，在位者。而有名章徹，謂得勇名。攻難之士將奔走之。攻猶作也。奔走猶赴趣也。○難，乃旦反。若竊邑叛君以徼大利而無名，謂不書其人名。○徼，古堯反。貪冒之民將寘力焉。盡力為之，不顧於見書。○冒，亡北反，又亡報反。寘，之豉反。是以《春秋》書齊豹曰‘盜’，三叛人名，以懲不義，數惡無禮，其善志也。無禮惡逆，皆數而不忘，記事之善者也。○數，所主反，注同。故曰，《春秋》之稱微而顯，文微而義著。○稱，尺證反。婉而辨。辭婉而旨別。○婉，於阮反。別，彼列反。" }
      - { type: z, text: "“婉而辨”。○正義曰：此“婉而辨”則與“微而顯”其意一也，故杜雲“辭婉而旨別”。辭婉則文微也，旨別則義顯也。上句“微而顯”者，據文雖微隱而義理顯著。下句“婉而辨”者，辭雖婉順相似，而旨意有殊，故重起其文也。此與成十四年“婉而成章”，其事異也。彼謂諱君惡，與此不同也。" }
      - { type: j, text: "上之人能使昭明，上之人，謂在位者。在位者能行其法，非賤人所能。善人勸焉，淫人懼焉，是以君子貴之。”" }
      - { type: j, text: "十二月，辛亥，朔，日有食之。是夜也，趙簡子夢童子臝而轉以歌。轉，婉轉也。○臝，本又作嬴，力果反。旦佔諸史墨，曰：“吾夢如是，今而日食，何也？”簡子夢適與日食會，謂咎在已，故問之。對曰：“六年及此月也，吳其入郢乎，終亦弗克。史墨知夢非日食之應，故釋日食之咎，而不釋其夢。○郢，以井反，又羊政反。應，應對之應。入郢必以庚辰，庚辰有變，日在辰尾，故曰以庚辰。定四年十一月庚辰，吳入郢。" }
      - { type: z, text: "注“庚日”至“入郢”。○正義曰：於天文房、心、尾為大。辰尾是辰後之星也。日在辰尾，自謂在辰星。庚辰入郢，乃謂日是辰日。二辰不同，而以日在辰尾配庚為庚辰者，二辰實雖不同，而同而同名曰辰，以其名同，故取以為佔。此則史墨能知，非是人情所測。定四年十一月，“庚辰，吳入郢”，是其言之驗也。此十二月日食，彼十一月入郢，則是未復其月，而云及此月者，《長曆》定四年閏十月，庚辰吳入郢，是十一月二十九日。杜雲“昭三十一年傳曰六年十二月庚辰吳入郢”，今十一月者，並閏數也。然則彼是新閏之後，且十一月二十九日又其月垂盡，故得為及此月也。" }
      - { type: j, text: "日月在辰尾。辰尾，龍尾也。周十二月，今之十月，日月合朔於辰尾而食。" }
      - { type: z, text: "注“辰尾”至“而食”。○正義曰：東方七宿：角、亢、氐、房、心、尾、箕，共為蒼龍之體。南首，北尾，角即龍角，尾即龍尾。《釋天》雲：“大辰，房、心、尾也。”是房、心與尾共為大辰，故言辰尾龍尾也。周十二月，今之十月。《月令》：“孟冬之月，日在尾。”是此時日月合朔於辰尾而日食也。" }
      - { type: j, text: "庚午之日，日始有謫。火勝金，故弗克。”謫，變氣也。庚午十月十九日，去辛亥朔四十一日。雖食在辛亥，更以始變為佔也。午，南方，楚之位也。午，火；庚，金也。日以庚午有變，故災在楚。楚之仇敵唯吳，故知入郢必吳。火勝金者，金為火妃，食在辛亥，亥，水也。水數六，故六年吳入郢也。○謫，直革反。" }
      - { type: z, text: "注“謫變”至“年也”。○正義曰：《昏義》雲：“陽事不得，適見於天，日為之食。”謫，譴責也。人有咎責，氣見於天，故謫為變氣也。《長曆》：此年十月壬子朔，故庚午是十月十九日也。從庚午下去十二月辛亥朔為四十一日。雖食在辛亥之日，而更以庚午為佔，舍近而取遠，自是史墨所見，其意不可知也。午為南方之辰，楚是南方之國，故午為楚之位也。午是南方之辰火也，庚是西方之日金也，日以庚午有變，午在南方，必南方之國當其咎，故災在楚。楚之仇敵唯有吳耳，故知入郢必是吳也。其日庚午，庚金，午火，五行相刻。火勝金，金以畏火之故，金為火妃。夫妻相得而彊，是楚彊盛之兆。雖被吳人，必不亡國，故知吳入郢，終亦弗克，言其不能滅楚也。食在辛亥之日，亥在北方水位也。北方水數六，故曰六年吳入郢也。" }
      - { type: j, text: "【經】三十有二年，春，王正月，公在乾侯。取闞。（無傳。公別居乾侯，遣人誘闞而取之，不用師徒。○闞，口暫反。）" }
      - { type: z, text: "“公別”至“師徒”。○正義曰：《公羊傳》曰：“闞者何？邾婁之邑也。”案傳，定元年將葬昭公，“季孫使役如闞公氏，將溝焉”。則闞是魯公葬地，非是邾邑。《公羊》不可通於《左氏》也。《土地名》“東平須昌縣東南有闞城”。是也。賈逵雲：昭公得闞，季氏奪之，不用師徒。謂此取闞，為季氏取於公也。案檢經傳，公自出奔以來，唯齊侯取鄆以居公耳，未有公取闞之處，安得取於公也？且若是季氏奪公，無由得告廟書經，故杜以為公取之也。四年傳例曰“凡克邑不用師徒曰取”。知公遣人誘而取之，不用師徒也。" }
      - { type: j, text: "夏，吳伐越。" }
      - { type: j, text: "秋七月。" }
      - { type: j, text: "冬，仲孫何忌會晉韓不信、齊高張、宋仲幾、衛世叔申、鄭國參、曹人、莒人、薛人、杞人、小邾人城成周。世叔申，世叔儀孫也。國參，子產之子。不書盟，時公在外，未及告公，公已薨。○參，七南反。" }
      - { type: z, text: "注“世叔”至“已薨”。○正義曰：傳稱“晉魏舒合諸侯之大夫於狄泉，尋盟，令城成周”。則此時為盟矣，而不書盟者，賈逵雲：魯有昭公難，故會而不盟。案傳文，無魯人辭盟之事，其城成周又魯人共城之矣，何以言會而不盟也？若以難辭，當辭不會；身既在會，何故辭？豈以昭公在外而欲背盟乎！故杜以為不書盟者，時公在外，未及告公，而公已薨。既不得告公，故不書於經也。案傳“尋盟，令城成周”，則盟在城前，猶得書城而盟。不書者，晉合諸侯、大夫本以城事召之，孟懿子將從晉命，即以告公，雖會還乃書而已，告公訖，故得書之。其尋盟之事，晉不豫令諸侯大夫，既集，晉始發意尋盟之事。未嘗告公，故行還不得書也。此雲“城成周”者，實未城也。晉人始計功庸賦丈數以令諸侯耳。明年傳稱“正月庚寅，裁三旬而畢”。是明年始城也。此未城而已書城，知本以城事召集，因集而書城耳。" }
      - { type: j, text: "十有二月，已未，公薨於乾侯。十五日。" }
      - { type: z, text: "注“十五日”。○正義曰：傳言十一月“令城成周”。雖無其日，明年乃始城之，當在月之將末。杜顯言此十五日者，言盟去公薨日近，以明未及告意也。" }
      - { type: j, text: "【傳】三十二年，春，王正月，公在乾侯，言不能外內，又不能用其人也。（其人，謂子家羈也。言公不能用其人，故於今猶在乾侯。）" }
      - { type: j, text: "夏，吳伐越，始用師於越也。自此之前，雖疆事小爭，未嘗用大兵。○疆，居良反。爭，爭鬥之爭。史墨曰：“不及四十年，越其有吳乎！存亡之數，不過三紀。歲星三週三十六歲，故曰不及四十年，哀二十二年，越滅吳，至此三十八歲。越得歲而吳伐之，必受其兇。”此年歲在星紀。星紀，吳越之分也。歲星所在，其國有福。吳先用兵，故反受其殃。○分，扶問反。殃，於良反。" }
      - { type: z, text: "注“此年”至“其殃”。○正義曰：十一年傳稱，萇弘對景王雲：“歲在豕韋。”言十一年歲星在豕韋也。又曰：“歲在大梁，蔡復，楚兇。”謂十三年歲星在大梁也。十三年距此十九年耳。歲星歲行一次十二年，而行天一週，則二十五年復在大梁。從彼而歷數之，則此年始至析木之津，而此年歲在星紀者，歲行一次，舉大數耳。其實一歲之行有餘一次，故劉歆《三統之術》以為歲星一百四十四年行天一百四十五次，計一千七百二十八年為歲星歲數，言數滿此年，剩得行天一週。《三統之歷》以庚戌為上元，從上元至襄二十八年，積十四萬二千六百八十六歲。置此歲數，以歲星歲一千七百二十八除之，得積終八十二，去之歲餘九百九十，以一百四十五乘歲餘，得十四萬三千五百五十，以一百四十四除之，得九百九十六為積次，不盡一百二十六為次餘。從襄二十八年至昭十五年，合有一十八年。歲星年行一次，年有一餘，以次加次，得一千一十四，以餘加餘，得一百四十四，餘數滿法又成一次，以從積次，得一千一十五也。以十二去之餘，餘次一百四十四，周七個，一百四十四年還得剩行天一週也。餘七命起星紀筭外，得鶉火。是昭十五年歲星在鶉火也。計十三年在大梁，十五年當在鶉首，而在鶉火者，由其餘分數滿，剩得一次，猶如閏餘滿而成月也。以十五年歲在鶉火歷而數之，則二十七年復在鶉火，故此年在星紀也。於十二次分野，星紀是吳越之分也。歲星是天之貴神，所在之次，其國有福。今越得歲星，故吳伐之則兇也。吳越同分，而云越福吳兇者，以吳先用兵故反受其殃。賈逵云然，杜從之也。鄭玄雲：天文分野，鬥主吳，牽牛主越。此年歲星在牽牛，故吳伐之兇。案史傳所云，吳越同分，不言於次之內，更復分星。姜氏、任氏共守玄枵，復以何星主齊、何星主薛也？且據《三統之術》，星紀之初鬥十二度至於牽牛初度，乃為中耳。十五年餘分始滿，則此年之初，歲星初入。此次伐越在夏，未得已至牽牛。鄭之此說，為妄之甚也。" }
      - { type: j, text: "秋，八月，王使富辛與石張如晉，請城成周。子朝之亂，其餘黨多在王城，敬王畏之，徙都成周。成周狹小，故請城之。○狹音洽。天子曰：“天降禍於周，俾我兄弟並有亂心，以為伯父憂。俾，使也。兄弟，謂子朝也。伯父，謂晉侯。○俾，本又作卑，同，必爾反，注同。我一二親暱甥舅不皇啟處，於今十年。謂二十三年，二師圍郊，至於今。○暱，女乙反。" }
      - { type: z, text: "注“謂二”至“於今”。正義曰：案二十七年，“十二月，晉藉秦致諸侯之戌於周”，而此杜雲“二十八年”者，以十二月垂盡，去在十二月，至周則在二十八年。故云五年也。" }
      - { type: j, text: "勤戍五年。謂二十八年，晉籍秦致諸侯之戍，至於今。餘一人無日忘之，念諸侯勞。閔閔焉如農夫之望歲，懼以待時。閔閔，憂貌。王憂亂，常閔閔冀望安定，如農夫之憂飢，冀望來歲之將熟。伯父若肆大惠，復二文之業，弛周室之憂，肆，展放也。二文，謂文侯仇、文公重耳。弛，猶解也。○弛，式氏反，注同。重，直龍反。徼文、武之福，以固盟主，宣昭令名，則餘一人有大原矣。昔成王合諸侯城成周，以為東都，崇文德焉。作成周，遷殷民以為京師之東都，所以崇文王之德。○徼，古堯反，下同。" }
      - { type: z, text: "注“作成”至“之德”。○正義曰：杜知作成周為崇文王之德者，以上傳雲“徼文武之福”，即雲“成王合諸侯城成周，以崇文德”，故以為崇文王之德。劉炫以為崇文德之教而規杜，非也。" }
      - { type: j, text: "今我欲徼福假靈於成王，脩成周之城，俾戍人無勤，諸侯用寧，蝥賊遠屏，晉之力也。蝥賊，謂災害。○蝥，亡侯反。" }
      - { type: z, text: "注“蝥賊謂災害”。正義曰：蝥賊，食苗之蟲。《釋蟲》雲：“食根蟊，食節賊。”故以蝥賊喻災害也。" }
      - { type: j, text: "其委諸伯父，使伯父實重圖之，俾我一人無徵怨於百姓，徵，召也。○徵，張升反。而伯父有榮施，先王庸之。”庸，功也。先王之靈，以為大功。○施，式豉反。範獻子謂魏獻子曰：“與其戍周，不如城之。天子實雲，雲欲罷戍而城。雖有後事，晉勿與知可也。從王命以紓諸侯，晉國無憂，是之不務，而又焉從事？”魏獻子曰：“善。”使伯音對伯音，韓不信。○勿與，音預。紓音舒。焉，於虔反。曰：“天子有命，敢不奉承以奔告於諸侯，遲速衰序，衰，差也。序，次也。○衰，初危反，注同。於是焉在。”在周所命。冬，十一月，晉魏舒、韓不信如京師，合諸侯之大夫於狄泉，尋盟，且令城成周。尋平丘盟。魏子南面。居君位。衛彪徯曰：“魏子必有大咎。幹位以令大事非其任也。彪徯？大夫。○彪彼蚪反徯音兮咎其九反詩曰：“敬天之怒不敢戲豫敬天之渝不敢馳驅詩大雅戒王者，言當敬畏天之譴怒不可游戲逸豫馳驅自恣渝變也。○渝羊朱反譴？戰反" }
      - { type: z, text: "注“詩大”至“譴怒”。○正義曰：此《詩·大雅·板》之篇，剌厲王之詩也。《詩》注以天謂厲王，此據上天斷章取意。" }
      - { type: j, text: "況敢幹位以作大事乎？”已醜，士彌牟營成周，計丈數，計所當城之丈數也。" }
      - { type: z, text: "注“計所”至“丈數”。正義曰：謂週迴遠近之丈數也。知者，下別雲“揣高卑，度厚薄”故也。" }
      - { type: j, text: "揣高卑，度高曰揣。○揣，丁累反，又初委反。度，待洛反，下文及注同。度厚薄，仞溝洫，度深曰仞。○仞本又作刃，而慎反。洫，況域反。物土方，議遠邇，物，相也。相取土之方面，遠近之宜。○相，息亮反，下同。量事期，知事幾時畢。○幾，居豈反，下皆同。計徒庸，知用幾人功。慮財用，知費幾財用。○費，芳貴反。書餱糧，知用幾糧食。○餱音侯，本亦作餱。糧音良。以令役於諸侯。屬役賦丈，付所當域尺丈。○屬，之欲反。" }
      - { type: z, text: "“屬役賦丈”。○正義曰：屬役，謂屬聚下役也。賦丈，謂課付尺丈上既號令丁役之事以告諸侯，令諸國國各出若干之役，築若干之丈，故云：“屬役賦丈，書以授帥”也。" }
      - { type: j, text: "書以授帥，帥諸侯之大夫。○帥，所類反，注同。而效諸劉子。效，致也。○效，戶孝反。韓簡子臨之，以為成命。臨履其事，以命諸侯。經所以不書魏舒。" }
      - { type: j, text: "十二月，公疾，徧賜大夫，從公者。○徧音遍。從，才用反，下同。大夫不受。賜子家子雙琥，琥，玉器。○琥音虎。" }
      - { type: z, text: "注“琥玉器”。○正義曰：《周禮·大宗伯》雲：“以玉作六器，以禮天地四方。白琥禮西方。”鄭玄雲：“虎猛象秋嚴。”禮、經及記言琥多矣，都不說其狀，蓋刻玉為虎形也。" }
      - { type: j, text: "一環、一璧、輕服，細好之服。" }
      - { type: z, text: "“一環一璧”。○正義曰：《釋器》雲：“肉倍好，謂之璧。肉好若一，謂之環。”李巡曰：肉倍好，璧邊肉大，其孔小也。肉好若一，其孔及邊肉大小適等曰環也。" }
      - { type: j, text: "受之。大夫皆受其賜。己未，公薨。子家子反賜於府人，曰：“吾不敢逆君命也。”大夫皆反其賜。書曰“公薨於乾侯”，言失其所也。不薨路寢為失所。趙簡子問於史墨曰：“季氏出其君，而民服焉，諸侯與之；君死於外而莫之或罪也。”對曰：“物生有兩、有三、有五、有陪貳。故天有三辰，謂有三。○陪，蒲回反。地有五行，謂有五。體有左右，謂有兩。各有妃耦，謂陪貳。○妃音配。王有公，諸侯有卿，皆有貳也。天生季氏，以貳魯侯，為日久矣。民之服焉，不亦宜乎！魯君世從其失，季氏世脩其勤，民忘君矣。雖死於外，其誰矜之？社稷無常奉，奉之無常人，言唯德也。○從，子用反；本亦作縱。君臣無常位，自古以然。史墨跡古今以實言。故《詩》曰：‘高岸為谷，深谷為陵。’《詩·小雅》。言高下有變易。" }
      - { type: z, text: "“故詩”至“為陵”。○正義曰：《詩·小雅·十月之交》，大夫剌幽王也。" }
      - { type: j, text: "三後之姓於今為庶，王所知也。三後，虞、夏、商。" }
      - { type: z, text: "注“三後虞夏商”。○正義曰：從周而上故數此三代。三代子孫，自有為國君者，言其賤者為庶人也。" }
      - { type: j, text: "在易卦，雷乘《乾》曰《大壯》，《乾》下《震》上，《大壯》。《震》在《乾》上，故曰雷乘《乾》。" }
      - { type: z, text: "“雷乘《乾》曰《大壯》”。○正義曰：《乾》為天，為剛，《震》為雷，為動。天以剛而動，動則為雷，壯之大者，故曰大壯。" }
      - { type: j, text: "天之道也。《乾》為天子，《震》為諸侯，而在《乾》上，君臣臣易位，猶臣大強壯，若天上有雷。" }
      - { type: z, text: "注“《乾》為至有雷”。○正義曰：《說卦》：“乾為天，為君。”君之極尊者是天子也。“震，為長子”，其卦雲：“震驚百里。”聲達百里之內，而有震曜之威，是諸侯。而在天子之上，象如君臣易位，是天之道也。" }
      - { type: j, text: "昔成季友，桓之季也，文姜之愛子也。始震而卜，卜人謁之，曰：‘生有嘉聞，嘉名聞於世。○始震，如字，一音身。聞音問。" }
      - { type: z, text: "“始震而卜”。○正義曰：震，動也。懷妊始動，知有震娠而即卜也。" }
      - { type: j, text: "其名曰友，為公室輔。’及生，如卜人之言，有文在其手曰“友’，遂以名之。既而有大功於魯，立僖公。○名之，音武政反。受費以為上卿。至於文子、武子，文子，行父；武子，宿。○費音秘。世增其業，不費舊績。魯文公薨，而東門遂殺適立庶，魯君於是乎失國，失國權。○適，丁歷反。政在季氏，於此君也四公矣。民不知君，何以得國？是以為君慎器與名，不可以假人。”器，車服。名，爵號。" }
      - { type: z, text: "“是以”至“假人”。○正義曰：器，謂車服也，名，謂爵號也。借人名器，則君失位矣，故不可以假人也。言魯君失民，是借季氏以權柄，故令昭公至此出外，因以戒人君使懲創也。" }
      - { type: j, text: "《春秋左傳正義》" }
