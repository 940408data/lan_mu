sections:
  - id: 秦始皇本紀
    name: 秦始皇本紀
    blocks:
      - type: j
        text: 秦始皇帝者秦莊襄王子也莊襄王為秦質子於趙見吕不韋姬悅而取之生始皇以秦昭王四十八年正月生於邯鄲及生名為政姓趙氏年十三歲莊襄王死政代立為秦王當是之時秦地已并巴蜀漢中越宛有郢置南郡矣北收上郡以東有河東太原上黨郡東至滎陽滅二周置三川郡吕不韋為相封十萬戶號曰文信侯招致賓客游士欲以并天下李斯
      - type: j
        text: 粟千石拜爵一級五年將軍驁攻魏定酸棗燕虛長平雍丘山陽城皆拔之取二十城初置東郡冬雷六年韓魏趙衛楚共擊秦取壽陵秦出兵五國兵罷拔衛迫東郡其君角率其支屬徙居野王阻其山以保魏之河內七年彗星先出東方見北方五月見西方將軍驁死以攻龍孤慶都還兵攻汲彗星復見西方十六日夏
      - type: j
        text: 以發縣卒及衛卒官騎戎翟君公舍人将欲攻蘄年宮為亂王知之令相國昌平君昌文君發卒攻毐戰咸陽斬首數百皆拜爵及宦者皆在戰中亦拜爵一級毐等敗走即令國中有生得毐賜錢百萬殺之五十萬盡得毐等衛尉竭內史肆佐弋竭中大夫令齊等二十人皆梟首車裂以徇滅其宗及其舍人輕者為鬼薪及奪爵遷蜀四千餘家家房陵四月寒凍有死者楊端和攻衍氏彗星見西方又見北方從斗以
      - type: j
        text: 但恐諸侯合從翕而出不意此乃智伯夫差湣王之所以亡也願大王毋愛財物賂其豪臣以亂其謀不過亡三十萬金則諸侯可盡秦王從其計見尉繚亢禮衣服食飲與繚同繚曰秦王為人蜂準長目摯鳥膺豺聲少恩而虎狼心居約易出人下得志亦輕食人我布衣然見我常身自下我誠使秦王得志於天下天下皆為虜矣不可與久游乃亡去秦王覺固止以為秦國尉卒用其計策而李斯用事
      - type: j
        text: 十三年桓齮攻趙平陽殺趙將扈輒斬首十萬王之河南正月彗星見東方十月桓齮攻趙十四年攻趙軍於平陽取宜安破之殺其將軍桓齮定平陽武城韓非使秦秦用李斯謀留非非死雲陽韓王請為臣十五年大興兵一軍至鄴一軍至太原取狼孟地動十六年九月發卒受地韓南陽假守騰初令男子書年魏獻地於秦秦置麗邑
      - type: j
        text: 燕合兵軍上谷大饑二十年燕太子丹患秦兵至國恐使荊軻刺秦王秦王覺之體解軻以徇而使王翦辛勝攻燕燕代發兵擊秦軍秦軍破燕易水之西二十一年王賁攻薊乃益發卒詣王翦軍遂破燕太子軍取燕薊城得太子丹之首燕王東收遼東而王之王翦謝病老歸新鄭反昌平君徙於郢大雨雪深二尺五寸
      - type: j
        text: 攻代虜代王嘉王翦遂定荆江南地降越君置會稽郡五月天下大酺二十六年齊王建與其相后勝發兵守其西界不通秦秦使將軍王賁從燕南攻齊得齊王建秦初并天下令丞相御史曰異日韓王納地效璽請為藩臣已而倍約與趙魏合從畔秦故興兵誅之虜其王寡人以為善庶幾息兵革趙王使其相李牧来約盟故歸其質子已而倍盟反我太原故興兵誅之得其王趙
      - type: j
        text: 斯等皆曰昔者五帝地方千里其外侯服夷服諸侯或朝或否天子不能制今陛下興義兵誅殘賊平定天下海內為郡縣法令由一統自上古以來未嘗有五帝所不及臣等謹與博士議曰古有天皇有地皇有泰皇泰皇最貴臣等昧死上尊號王為泰皇命為制令為詔天子自稱曰朕王曰去泰著皇采上古帝位號號曰皇帝他如議制曰可追尊莊襄王為太上皇制曰朕聞太古有號毋諡中古有號死而以行為
      - type: j
        text: 丞相綰等言諸侯初破燕齊荆地遠不為置王毋以填之請立諸子唯上幸許始皇下其議於羣臣羣臣皆以為便廷尉李斯議曰周文武所封子弟同姓甚衆然後屬疏遠相攻擊如仇讐諸侯更相誅伐周天子弗能禁止今海内賴陛下神靈一統皆為郡縣諸子功臣以公賦稅重賞賜之甚足易制天下無異意則安寧之術也置諸侯不便始皇曰天下共苦戰鬪不休以有侯王賴宗廟天下初定又復立國是樹兵
      - type: j
        text: 閣相屬所得諸侯美人鍾鼓以充入之二十七年始皇巡隴西北地出雞頭山過回中焉作信宫渭南已更命信宫為極廟象天極自極廟道通酈山作甘泉前殿築甬道自咸陽屬之是歲賜爵一級治馳道二十八年始皇東行郡縣上鄒嶧山立石與魯諸儒生議刻石頌秦德議封禪望祭山川之事乃遂上泰山立石封祠祀下風雨暴至休於樹下因封其樹為
      - type: j
        text: 於是乃並勃海以東過黃腄窮成山登之罘立石頌秦德焉而去南登琅邪大樂之留三月乃徙黔首三萬戶琅邪臺下復十二歲作琅邪臺立石刻頌秦德明德意曰維二十六年皇帝作始端平法度萬物之紀以明人事合同父子聖智仁義顯白道理東撫東土以省卒士事已大畢乃臨于海皇帝之功勤勞本事上農除末黔首是富普天之下摶心揖志器械一量同書文字日月所照舟輿所載皆終其命莫不得
      - type: j
        text: 戸東有東海北過大夏人迹所至無不臣者功盖五帝澤及牛馬莫不受德各安其宇維秦王兼有天下立名為皇帝乃撫東土至于琅邪列侯武城侯王離列侯通武侯王賁倫侯建成侯趙亥倫侯昌武侯成倫侯武信侯馮毋擇丞相隗林丞相王綰卿李斯卿王戊五大夫趙嬰五大夫楊樛從與議於海上曰古之帝者地不過千里諸侯各守其封域或朝或否相侵暴亂殘伐不止猶刻金石以自為紀古之五帝三
      - type: j
        text: 得乃西南渡淮水之衡山南郡浮江至湘山祠逢大風幾不得渡上問博士曰湘君何神博士對曰聞之堯女舜之妻而葬此於是始皇大怒使刑徒三千人皆伐湘山樹赭其山上自南郡由武關歸二十九年始皇東游至陽武博狼沙中為盜所驚求弗得乃令天下大索十日登之罘刻石其辭曰維二十九年時在中春陽和方起皇帝東游巡登之罘臨照于海從臣嘉觀原念休烈追誦本始大聖作治建
      - type: j
        text: 振動四極禽滅六王闡并天下菑害絶息永偃戎兵皇帝明徳經理宇内視聴不怠作立大義昭設備器咸有章旗職臣遵分各知所行事無嫌疑黔首改化遠邇同度臨古絶尤常職既定後嗣循業長承聖治羣臣嘉徳祇誦聖烈請刻之罘旋遂之琅邪道上黨入三十年無事三十一年十二月更名臘曰嘉平賜黔首里六石米
      - type: j
        text: 産久並来田莫不安所羣臣誦烈請刻此石垂著儀矩因使韓終侯公石生求仙人不死之藥始皇廵北邉從上郡入燕人盧生使入海還以鬼神事因奏録圖書曰亡秦者胡也始皇乃使将軍蒙恬發兵三十萬人北擊胡畧取河南地三十三年發諸嘗逋亡人贅壻賈人畧取陸梁地為桂林象郡南海以適遣戍西北斥逐匈奴自榆中並河以東屬之隂山以為三十四縣城河上為塞又使
      - type: j
        text: 餘歲封子弟功臣自為枝輔今陛下有海内而子弟為匹夫卒有田常六卿之臣無輔拂何以相救哉事不師古而能長久者非所聞也今青臣又面諛以重陛下之過非忠臣始皇下其議丞相李斯曰五帝不相復三代不相襲各以治非其相反時變異也今陛下創大業建萬世之功固非愚儒所知且越言乃三代之事何足法也異時諸侯並爭厚招游學今天下已定法令出一百姓當家則力農工士則學習法令
      - type: j
        text: 下敢有藏詩書百家語者悉詣守尉雜燒之有敢偶語詩書弃市以古非今者族吏見知不舉者與同罪令下三十日不燒黥為城旦所不去者醫藥卜筮種樹之書若欲有學法令以吏為師制曰可三十五年除道道九原抵雲陽塹山堙谷直通之於是始皇以為咸陽人多先王之宫廷小吾聞周文王都豐武王都鎬豐鎬之間帝王之都也乃營作朝宫渭南上林苑中先作前殿阿房東西五百步南北五
      - type: j
        text: 歲盧生說始皇曰臣等求芝奇藥仙者常弗遇類物有害之者方中人主時為微行以辟惡鬼惡鬼辟真人至人主所居而人臣知之則害於神真人者入水不濡入火不爇陵雲氣與天地久長今上治天下未能恬淡願上所居宫毋令人知然後不死之藥殆可得也於是始皇曰吾慕真人自謂真人不稱朕乃令咸陽之旁二百里内宫觀二百七十復道甬道相連帷帳鐘鼓美人充之各案署不移徙行所幸有言其
      - type: j
        text: 畏罪持祿莫敢盡忠上不聞過而日驕下懾伏謾欺以取容秦法不得兼方不驗輒死然候星氣者至三百人皆良士畏忌諱諛不敢端言其過天下之事無小大皆決於上上至以衡石量書日夜有呈不中呈不得休息貪於權勢至如此未可為求仙藥於是乃亡去始皇聞亡乃大怒曰吾前收天下書不中用者盡去之悉召文學方術士甚衆欲以興太平方士欲練以求奇藥今聞韓衆去不報徐市等費以巨萬計
      - type: j
        text: 三十六年熒惑守心有墜星下東郡至地為石黔首或刻其石曰始皇帝死而地分始皇聞之遣御史逐問莫服盡取石旁居人誅之因燔銷其石始皇不樂使博士為仙真人詩及行所游天下傳令樂人謌弦之秋使者從關東夜過華陰平舒道有人持璧遮使者曰為吾遺滈池君因言曰今年祖龍死使者問其故因忽不見置其璧去使者奉璧具以聞始皇默然良久曰山鬼固不過知一歲事也退言曰祖龍者人
      - type: j
        text: 皇帝休烈平一宇内徳恵修長三十有七年親廵天下周覽逺方遂登會稽宣省習俗黔首齋荘群臣誦功本原事迹追首高明秦聖臨國始定刑名顯陳舊章初平法式審别職任以立恒常六王專倍貪戾慠猛率衆自彊暴虐恣行負力而驕數動甲兵隂通間使以事合從行為辟方内飾詐謀外来侵邉遂起禍殃義威誅之殄熄暴悖亂賊滅亡聖徳廣密六合之中被澤無疆皇帝并宇兼聴萬事逺近畢清運理羣
      - type: j
        text: 譴乃詐曰蓬莱藥可得然常為大鮫魚所苦故不得至願請善射與俱見則以連弩射之始皇夢與海神戰如人状問占夢博士曰水神不可見以大魚蛟龍為候今上禱祠備謹而有此惡神當除去而善神可致乃令入海者齎捕巨魚具而自以連弩候大魚出射之自琅邪北至榮成山弗見至之罘見巨魚射殺一魚遂並海西至平原津而病始皇惡言死羣臣莫敢言死事上病益甚乃為璽書賜公子扶蘇曰與喪
      - type: j
        text: 斯受始皇遺詔沙丘立子胡亥為太子更為書賜公子扶蘇蒙恬數以罪其賜死語具在李斯傳中行遂從井陘抵九原會暑上輼車臭乃詔從官令車載一石鮑魚以亂其臭行從直道至咸陽發喪太子胡亥襲位為二世皇帝九月葬始皇酈山始皇初即位穿治酈山及并天下天下徒送詣七十餘萬人穿三泉下銅而致椁宮觀百官奇器珍怪徙臧滿之令匠作機弩矢有所穿近者輒射之以水銀為百川江河大
      - type: j
        text: 五大夫三雖萬世世不軼毀今始皇為極廟四海之内皆獻貢職增犧牲禮咸備毋以加先王廟或在西雍或在咸陽天子儀當獨奉酌祠始皇廟自襄公已下軼毀所置凡七廟羣臣以禮進祠以尊始皇廟為帝者祖廟皇帝復自稱朕二世與趙高謀曰朕年少初即位黔首未集附先帝廵行郡縣以示彊威服海内今晏然不廵行即見弱毋以臣畜天下春二世東行郡縣李斯從到碣石並海南至會稽而盡刻始皇
      - type: j
        text: 天下累世名貴人也積功勞世以相傳久矣今高素小賤陛下幸稱舉令在上位管中事大臣鞅鞅特以貌從臣其心實不服今上出不因此時案郡縣守尉有罪者誅之上以振威天下下以除去上生平所不可者今時不師文而決於武力願陛下遂從時毋疑即羣臣不及謀明主收舉餘民賤者貴之貧者富之遠者近之則上下集而國安矣二世曰善乃行誅大臣及諸公子以罪過連逮少近官三郎無得立者而
      - type: j
        text: 先帝為咸陽朝廷小故營阿房宫為室堂未就崩罷其作者復土酈山酈山事大畢今釋阿房就則是章先帝舉事過也復作阿房宫外撫四夷始皇計盡徵其材士五萬人為屯衛咸陽令教射狗馬禽獸當食者多度不足下調郡縣轉輸菽粟芻皆令自齎糧食咸陽三百里内不得食其穀用法益刻深七月戍卒陳勝等反故荆地為張楚勝自立為楚王居陳遣諸将徇地山東郡縣少年苦秦吏皆殺
      - type: j
        text: 乃大赦天下使章邯将擊破周章軍而走遂殺章曹陽二世益遣長史司馬欣董翳佐章邯擊盜殺陳勝城父破項梁定陶滅魏咎臨濟楚地盜名将已死章邯乃北渡河擊趙王歇等於鉅鹿趙高說二世曰先帝臨制天下久故羣臣不敢為非進邪說今陛下富於春秋初即位柰何與公卿廷决事事即有誤示羣臣短也天子稱朕固不聞聲於是二世常居禁中與高决諸事其後公卿希得朝見盜賊益多而關中卒
      - type: j
        text: 御海内矣夫虞夏之主貴為天子親處窮苦之實以徇百姓尚何扵法朕尊萬乗毋其實吾欲造千乗之駕萬乗之屬克吾號名且先帝起諸侯兼天下天下已定外攘四夷以安邉境作宫室以章得意而君觀先帝功業有緒今朕即位二年之間羣盜並起君不能禁又欲罷先帝之所為是上毋以報先帝次不為朕盡忠力何以在位下去疾斯劫吏案責他罪去疾劫曰将相不辱自殺斯卒囚就五刑
      - type: j
        text: 馬以阿順趙高或言鹿者高因隂中諸言鹿者以法後羣臣皆畏高高前數言關東盗毋能為也及項羽虜秦将王離等鉅鹿下而前章邯等軍數却上書請益助燕趙齊楚韓魏皆立為王自關以東大氐盡畔秦吏應諸侯諸侯咸率其衆西鄉沛公将數萬人已屠武關使人私於高高恐二世怒誅及其身乃謝病不朝見二世夢白虎齧其左驂馬殺之心不樂怪問占夢卜曰涇水為祟二世乃齋於望夷宫欲祠涇沉
      - type: j
        text: 令與樂俱入射上幄坐幃二世怒召左右左右皆惶擾不鬬旁有宦者一人侍不敢去二世入内謂曰公何不蚤告我乃至於此宦者曰臣不敢言故得全使臣蚤言皆已誅安得至今閻樂前即二世數曰足下驕恣誅殺無道天下共畔足下足下其自為計二世曰丞相可得見否樂曰不可二世曰吾願得一郡為王弗許又曰願為萬戸侯弗許曰願與妻子為黔首比諸公子閻樂曰臣受命於丞相為天下誅足下足
      - type: j
        text: 我齋見廟此欲因廟中殺我我稱病不行丞相必来来則殺之高使人請子嬰數軰子嬰不行高果自徃曰宗廟重事王柰何不行子嬰遂刺殺高於齋宫三族高家以徇咸陽子嬰為秦王四十六日楚将沛公破秦軍入武關遂至霸上使人約降子嬰子嬰即係頸以組白馬素車奉天子璽符降軹道旁沛公遂入咸陽封宫室府庫還軍霸上居月餘諸侯兵至項籍為從長殺子嬰及秦諸公子宗族遂屠咸陽燒其
      - type: j
        text: 秦并兼諸侯山東三十餘郡繕津關據險塞修甲兵而守之然陳涉以戍卒散亂之衆數百奮臂大呼不用弓戟之兵鉏擾白梃望屋而食横行天下秦人阻險不守關梁不闔長戟不刺彊弩不射楚師深入戰於鴻門曾無藩籬之艱於是山東大擾諸侯並起豪俊相立秦使章邯将而東征章邯因以三軍之衆要市於外以謀其上羣臣之不信可見於此矣子嬰立遂不寤籍使子嬰有庸主之材僅得中佐山東雖亂
      - type: j
        text: 以利合非有素王之行也其交未親其下未附名為亡秦其實利之也彼見秦阻之難犯也必退師安土息民以待其敝收弱扶罷以令大國之君不患不得意於海內貴為天子富有天下而身為禽者其救敗非也秦王足己不問遂過而不變二世受之因而不改暴虐以重禍子嬰孤立無親危弱無輔三主惑而終身不悟亡不亦宜乎當此時也世非無深慮知化之士也然所以不敢盡忠拂過者秦俗多忌諱之禁
      - type: j
        text: 故不長久由此觀之安危之統相去遠矣野諺曰前事之不忘後事之師也是以君子為國觀之上古驗之當世參以人事察盛衰之理審權勢之宜去就有序變化有時故曠日長久而社稷安矣秦孝公據殽函之固擁雍州之地君臣固守而窺周室有席捲天下包舉宇内囊括四海之意并吞八荒之心當是時商君佐之内立法度務耕織修守戰之備外連衡而鬭諸侯於是秦人拱手而取西河之外孝公既沒惠
      - type: j
        text: 孫臏帶佗兕良王廖田忌廉頗趙奢之朋制其兵常以十倍之地百萬之衆叩關而攻秦秦人開關延敵九國之師逡巡遁逃而不敢進秦無亡矢遺鏃之費而天下諸侯已困矣於是從散約解爭割地而奉秦秦有餘力而制其敝追亡逐北伏尸百萬流血漂鹵因利乘便宰割天下分裂河山彊國請服弱國入朝延及孝文王莊襄王享國日淺國家無事及至秦王續六世之餘烈振長策而御宇内吞二周而亡諸侯
      - type: j
        text: 精卒陳利兵而誰何天下以定秦王之心自以為關中之固金城千里子孫帝王萬世之業也秦王既沒餘威振於殊俗陳涉罋牖繩樞之子甿隷之人而遷徙之徒才能不及中人非有仲尼墨翟之賢陶朱猗頓之富躡足行伍之間而倔起什伯之中率罷散之卒將數百之衆而轉攻秦斬木為兵揭竿為旗天下雲集響應贏糧而景從山東豪俊遂並起而亡秦族矣且夫天下非小弱也雍州之地殽函之固自若也
      - type: j
        text: 并海内兼諸侯南面稱帝以養四海天下之士斐然鄉風若是者何也曰近古之無王者久矣周室卑微五霸既殁令不行於天下是以諸侯力政彊侵弱衆暴寡兵革不休士民罷敝今秦南面而王天下是上有天子也既元元之民冀得安其性命莫不虛心而仰上當此之時守威定功安危之本在於此矣秦王懷貪鄙之心行自奮之智不信功臣不親士民廢王道立私權禁文書而酷刑法先詐力而後仁義以暴
      - type: j
        text: 也鄉使二世有庸主之行而任忠賢臣主一心而憂海內之患縞素而正先帝之過表地分民以封功臣之後建國立君以禮天下虛囹圄而免刑戮除去收帑汙穢之罪使各反其鄉里發倉廩散財幣以振孤獨窮困之士輕賦少事以佐百姓之急約法省刑以持其後使天下之人皆得自新更節修行各慎其身塞萬民之望而以威德與天下天下集矣即四海之內皆讙然各自安樂其處唯恐有變雖有狡猾之民
      - type: j
        text: 者其民危也故先王見始終之變知存亡之機是以牧民之道務在安之而已天下雖有逆行之臣必無響應之助矣故曰安民可與行義而危民易與為非此之謂也貴為天子富有天下身不免於戮殺者正傾非也是二世之過也襄公立享國十二年初為西畤葬西垂生文公文公立居西垂宫五十年死葬西垂生靜公靜公不響國而死生憲公憲公饗國十二年居西新邑死葬衙生
      - type: j
        text: 共公共公享國五年居雍高寢葬康公南生栢公栢公享國二十七年居雍太寢葬義里丘北生景公景公享國四十年居雍高寢葬丘里南生畢公畢公饗國三十六年葬車里北生夷公夷公不享國允葬左宫生惠公惠公享國十年葬車里康景生悼公悼公享國十五年葬僖公西城雍生刺龔公刺龔公享國三十四年葬入里生躁公懷公其十年彗星見躁公享國十四年居受寢葬悼公南其元年彗星見懷公
      - type: j
        text: 享國五十六年葬茝陽生孝文王孝文王享國一年葬壽陵生莊襄王莊襄王享國三年葬茝陽生始皇帝吕不韋相獻公立七年初行為市十年為户籍相伍孝公立十六年時桃李冬華惠文王生十九年而立立二年初行錢有新生嬰兒曰秦且王悼武王生十九年而立立三年渭水赤三日昭襄王生十九年而立立四年初為田開阡陌孝文王生五十三年而立莊襄王生三十二年而立立二年取太原地莊襄
