# 尚書正義卷二十（孔穎達疏）：j 為經文＋孔安國注，z 為正義疏文。
sections:
  - id: juan20
    name: 卷二十
    blocks:
      - { type: j, text: "秦穆公伐鄭，遣三帥帥師往伐之。○事見魯僖公三十三年。三帥，謂孟明視、西乞術、白乙丙。帥，色類反，下注同。晉襄公帥師敗諸崤，崤，晉要塞也。以其不假道，伐而敗之，囚其三帥。○崤，戶交反。塞，悉代反。假，工下反。還歸，作《秦誓》。晉舍三帥，還歸秦，穆公悔過作誓。" }
      - { type: j, text: "秦誓貪鄭取敗，悔而自誓。" }
      - { type: z, text: "“秦穆”至“秦誓”○正義曰：秦穆公使孟明視、西乞術、白乙丙三帥帥師伐鄭，未至鄭而還。晉襄公帥師敗之於崤山，囚其三帥。後晉舍三帥，得還歸於秦。秦穆公自悔己過，誓戒群臣。史錄其誓辭，作《秦誓》。○傳“遣三”至“伐之”○正義曰：《左傳》僖三十年，晉文公與秦穆公圍鄭，鄭使燭之武說秦伯，秦伯竊與鄭人盟，使杞子、逢孫、揚孫戍之，乃還。三十二年，杞子自鄭使告於秦曰：“鄭人使我掌其北門之管，若潛師以，來國可得也。”穆公訪諸蹇叔，蹇叔曰：“不可。”公辭焉。召孟明、西乞、白乙，使出師伐鄭。是“遣三帥帥師往伐之”事也。序言“穆公伐鄭”，嫌似穆公親行，故辨之耳。○傳“崤晉”至“三帥”○正義曰：杜預雲：“殽在弘農澠池縣西。”築城守道謂之“塞”，言其要塞盜賊之路也。崤山險阨，是晉之要道關塞也。從秦向鄭，路經晉之南境，於南河之南崤關而東適鄭。《禮》征伐朝聘，過人之國，必遣使假道。晉以秦不假道，故伐之。《左傳》僖三十二年，晉文公卒。三十三年，秦師及滑，鄭商人弦高將市於周，遇之，矯鄭伯之命以牛十二犒師。孟明曰：“鄭有備矣，不可冀也。攻之不克，圍之不繼，吾其還也。”滅滑而還。晉先軫請伐秦師。襄公在喪，墨縗絰。夏四月，敗秦師於殽，獲百里孟明視、西乞術、白乙丙以歸。是襄公親自帥師伐而敗之，囚其三帥也。《春秋》之例，君將不言“帥師”，舉其重者。此言“襄公帥師”，依實為文，非彼例也。又《春秋》經書此事雲：“晉人及羑戎敗秦師於殽。”實是晉侯而書“晉人”者，杜預雲：“晉侯諱背喪用兵，通以賤者告也。”是言晉人告魯，不言晉侯親行，而云大夫將兵。大夫賤，不合書名氏，故稱“人”也。直言敗秦師於殽，不言秦之將帥之名，亦諱背喪用兵，故言辭略也。○傳“晉舍”至“作誓”○正義曰：《左傳》又稱，晉文公之夫人文嬴，秦女也，請三帥曰：“彼實構吾二君，寡君若得而食之，不厭，君何辱討焉？使歸就戮於秦，以逞寡君之志，若何？”公許之。秦伯素服郊次，向師而哭曰：“孤違蹇叔，以辱二三子，孤之罪也。不替孟明，孤之過也。”是晉舍三帥而得還，秦穆公於是悔過作誓。序言“還歸”，謂三帥還也，嫌穆公身還，故辨之。《公羊傳》說此事雲：“四馬只輪無反者。”《左傳》稱秦伯“向師而哭”，則師亦少有還者，" }
      - { type: j, text: "公曰：“嗟！我士，聽無譁。誓其群臣，通稱士也。予誓告汝總言之首。總言之本要。古人有言曰：‘民訖自若，是多盤。’言民之行己，盡用順道，是多樂。稱古人言，悔前不順忠臣。○樂音洛。責人斯無難，惟受責俾如流，是惟艱哉！人之有非，以義責之，此無難也。若己有非，惟受人責，即改之如水流下，是惟艱哉。○俾，必爾反，下同。我心之憂，日月逾邁，若弗雲來。言我心之憂，欲改過自新，如日月並行過，如不復雲來，雖欲改悔，恐死及之，無所益。○復，扶又反。" }
      - { type: z, text: "“公曰”至“雲來”○正義曰：穆公自悔伐鄭，召集群臣而告之。公曰：“諮嗟！我之朝廷之士，聽我告於汝，無得喧譁。我誓告汝眾言之首，誥汝以言中之最要者。古人有言曰：‘民之行己，盡用順道。是多樂。’言順善事，則身大樂也。見他有非理，以義責之，此無難也。惟己有非理，受人之責，即能改之，使如水之流下，此事是惟難哉！”言己已往之前不受人言，故自悔也。“今我心憂，欲自改過自新，但日月益為疾行，如似不復雲來，恐己老死不得改悔也”。○傳“誓其”至“稱士”○正義曰：“士”者，男子之大號，故群臣通稱之。鄭雲：“誓其群臣，下及萬民，獨雲士者，舉中言之。”○傳“言民”至“忠臣”○正義曰：“訖”，盡也。“自”，用。“若”，順。“盤”，樂也。盡用順道則有福，有福則身樂，故云“是多樂”也。“稱古人言”者，悔前不用古人之言，不順忠臣之謀故也。昔漢明帝問東平王劉蒼雲：“在家何者為樂？”對曰：“為善最樂。”是其用順道則多樂。○傳“言我”至“所益”○正義曰：“逾”，益。“邁”，行也。“員”即“雲”也。言日月益為疾行，並皆過去，如似不復雲來。畏其去而不復來，夜而不復明，言己年老，前途稍近，雖欲改悔，恐死及之，不得修改，身無所益也。王肅雲：“年已衰老，恐命將終，日月遂往，若不雲來，將不復見日月，雖欲改過，無所及益。自恨改過遲晚，深自咎責之辭。”" }
      - { type: j, text: "惟古之謀人，則曰未就予忌。惟為我執古義之謀人，謂忠賢蹇叔等也，則曰未成我所欲，反忌之耳。○為，於偽反，下“為我謀”同。惟今之謀人，姑將以為親。惟指今事為我所謀之人，我且將以為親而用之。悔前違古從今，以取破敗。" }
      - { type: z, text: "“惟古”至“為親”○正義曰：此穆公自說己之前過。我欲伐鄭之時，群臣共為謀計，惟為我執古義之謀人，我則曰未成我之所欲，反猜忌之。惟指今事為我所謀之人，我且將以為親己而用之。悔前違古從今，自取破敗也。其“古之謀人”，當謂忠賢之臣若蹇叔之等。“今之謀人”，勸穆公使伐鄭者，蓋謂杞子之類，國內亦當有此人。" }
      - { type: j, text: "“雖則云然，尚猷詢茲黃髮，則罔所愆。言前雖則有云然之過，今我庶幾以道謀此黃髮賢老，則行事無所過矣。番番良士，旅力既愆，我尚有之。勇武番番之良士，雖眾力已過老，我今庶幾欲有此人而用之。○番音波。仡仡勇夫，射御不違，我尚不欲。仡仡壯勇之夫，雖射御不違，我庶幾不欲用。自悔之至。○仡，許乞反。惟截截善諞言，俾君子易辭，我皇多有之，昧昧我思之。惟察察便巧善為辨佞之言，使君子迴心易辭，我前多有之，以我昧昧思之不明故也。○截，才節反。馬雲：“辭語截削省要也。”諞音辨，徐敷連反，又甫淺反，馬本作偏，雲：“少也，辭約損明，大辨佞之人。”易，羊石反。昧音妹。如有一介臣，斷斷猗，無他伎，其心休休焉，其如有容。如有束脩一介臣，斷斷猗然專一之臣，雖無他伎藝，其心休休焉樂善，其如是，則能有所容。言將任之。○介音界，馬本作界，雲：“一介，耿介，一心端愨者。”字又作個，音工佐反。斷，丁亂反，又音短。猗，於綺反，又於宜反。技，其綺反，本亦作伎。他，本亦作它，吐何反。樂音洛。" }
      - { type: z, text: "“雖則”至“不欲”○正義曰：言我前事雖則有云然之過，我今庶幾以道謀此黃髮賢老，受用其言，則行事無所過也。番番然勇武之善士，雖眾力既過老，而謀計深長，我庶幾欲有此人而用之。仡仡然壯勇之夫，雖射御不有違失，而智慮淺近，我庶幾不欲用之。自悔往前用壯勇之計失也。○“惟截截”至“有容”○正義曰：惟察察然便巧善為辯佞之言，能使君子迴心易辭。我前大多有之，昧昧然我思之不明故也。如有一心耿介之臣，斷斷守善猗然，雖無他技藝，而其心樂善休休焉，其如是，則能有所含容。如此者，我將任用之。悔前用巧佞之人，今將任寬容善士也。○傳“惟察”至“故也”○正義曰：“截截”猶“察察”，明辯便巧之意。“諞”猶辯也，由其便巧善為辯佞之言，使君子聽之迴心易辭。“皇”訓大也，我前大多有之，謂杞子之等，及在國從己之人。以我昧昧而暗，思之不明，故有此輩在我側也。○傳“如有”至“任之”○正義曰：孔注《論語》，以“束脩”為“束帶脩飾”，此亦當然。“一介”謂一心耿介。“斷斷”，守善之貌。“休休”，好善之意。如有束帶脩飾，一心耿介，斷斷然守善猗然專一之臣，雖復無他技藝，休休焉好樂善道，其心行如是，則能有所含容。言得此人將任用之。“猗”者，足句之辭，不為義也。《禮記·太學》引此作“斷斷兮”，“猗”是“兮”之類，《詩》雲“河水清且漣漪”是也。王肅雲：“一介，耿介，一心端愨，斷斷守善之貌。無他技能，徒守善而已。休休，好善之貌。其如是，人能有所容忍小過，寬則得眾。穆公疾技巧多端，故思斷斷無他技者。”" }
      - { type: j, text: "人之有技，若己有之。人之彥聖，其心好之，不啻若自其口出，是能容之。人之有技，若己有之樂，善之至也。人之美聖，其心好之，不啻如自其口出，心好之至也。是人必能容之。○好，呼報反。啻，失豉反。以保我子孫黎民，亦職有利哉！用此好技聖之人，安我子孫眾人，亦主有利哉！言能興國。" }
      - { type: z, text: "“人之”至“利哉”○正義曰：此說大賢之行也。大賢之人，見人之有技，如似己自有之。見人之有美善通聖者，其心愛好之，不啻如自其口出。愛彼美聖，口必稱揚而薦達之，其心愛之，又甚於口，言其愛之至也。是人於民必能含容之。用此愛好技聖之人，安我子孫眾民，則我子孫眾民亦主有利益哉！言其能興邦也。" }
      - { type: j, text: "人之有技，冒疾以惡之。人之彥聖，而違之，俾不達。見人之有技藝，蔽冒疾害以惡之。人之美聖，而違背壅塞之，使不得上通。○冒，莫報反。惡，烏路反。背音佩。壅，於勇反。塞，先得反。是不能容，以不能保我子孫黎民，亦曰殆哉！冒疾之人，是不能容人用之，不能安我子孫眾人，亦曰危殆哉！○殆，唐在反。" }
      - { type: z, text: "“人之”至“殆哉”○正義曰：此說大佞之行也。大佞之人，見人之有技，蔽冒疾害以惡之。見人之有美善通聖者，而違背壅塞之，使不達於在上。是人之不能含容人也。用此疾惡技聖之人，不能安我子孫眾民，則我子孫眾民亦曰危殆哉！言其必亂邦也。○傳“見人”至“上通”○正義曰：傳以“冒”為覆冒之“冒”，謂蔽障掩蓋之也。“疾”謂疾惡之，謂憎疾患害之也。見人之美善通聖而違背之，不從其言；壅塞之，使不得上通，皆是佞人害賢之行也。" }
      - { type: j, text: "邦之杌隉，曰由一人。杌隉，不安，言危也。一人所任用，國之傾危，曰由所任不用賢。○杌，五骨反。隉，五結反，徐語折反。邦之榮懷，亦尚一人之慶。”國之光榮，為民所歸，亦庶幾其所任用賢之善也。穆公陳戒，背賢則危，用賢則榮，自誓改前過之意。" }
      - { type: z, text: "“邦之”至“之慶”○正義曰：既言賢佞行異，又言用之安否。邦之杌隉，危而不安，曰由所任一人之不賢也；邦之光榮，為民所歸，亦庶幾所任一人之有慶也。言國家用賢則榮，背賢則危，穆公自誓將改前過，用賢人者也。人者也。" }
