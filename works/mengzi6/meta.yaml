aboutHtml: |-
  <h2>關於此卷</h2>
  <p>《孟子集注》為朱熹《四書章句集注》之一，此卷以宋刻本版式數字重刻，半葉八行、行十六字、注文雙行二十五字。</p>
  <p>卷之六收「滕文公章句下」十章，經注全帙；底本為本地《四書章句集注》電子本，識典古籍本對校，校錄重排，與宋本原刻容有出入。</p>
