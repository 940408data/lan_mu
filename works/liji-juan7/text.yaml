# 禮記正義卷7（孔穎達疏）：j 為經文＋鄭玄注，z 為疏文。
sections:
  - id: juan7
    name: 正文
    blocks:
      - { type: j, text: "大公封於營丘，比及五世，皆反葬於周。齊大公受封，留為大師，死葬於周，子孫生焉，不忍離也。五世之後，乃葬於齊，齊曰營丘。○大音泰，注及下注“大史公”皆同。離，力智反，下“相離”同。君子曰：“樂，樂其所自生。禮，不忘其本。言其似禮樂之義。○樂樂並音嶽，一讀下五教反，又音洛。古之人有言曰：‘狐死正丘首。’仁也。”正丘首，正首丘也。仁，恩也。○首，手又反，注同。" }
      - { type: z, text: "“大公”至“仁也”。○正義曰：此一節論忠臣不欲離王室之事。“太公封於營丘”者，周之大師大公封於營丘，及其死也，反葬於鎬京，陪文武之墓。其大公子孫，比及五世，雖死於齊，以大公在周，其子孫皆反葬於周也。言“反葬”者，既從周鄉齊，今又從齊反往歸周，君子善其反葬似禮樂之意，故云先王制禮樂者，樂其所自生，謂愛樂已之王業所由生，以制樂名。若舜愛樂其王業所由，能紹堯之德，即樂名《大韶》；禹愛樂其王業，所謂由治水廣大中國，則樂名《大夏》。○“禮，不忘其本”者，謂先王制禮，其王業根本，由質而興，則制禮不忘其本，而尚質也；若王業根本由文而興，制禮尚文也，是不忘其本也。禮之與樂皆是重本，今反葬於周，亦是重本，故引禮樂以美之。君子既引禮樂，又引古之人有遺言云：“狐死正丘首而向丘。”所以正首而向丘者，丘是狐窟穴根本之處，雖狼狽而死，意猶向此丘，是有仁恩之心也。今五世反葬，亦仁恩之心也。但樂之與禮，兩文相互。樂雲樂其所自生，則禮當雲反其所自本。禮雲不忘其本，則樂當雲不忘其生也。樂雲樂其所自生者，初生王業，因民之所樂而得天下。今王者制樂，自愛樂已之所由得天下。樂者，是王者自樂，不據民之所樂也。○注“齊大公受封”至“齊曰營丘”。○正義曰：知“留為大師”者，案《詩·大雅》雲：“維師尚父。”《毛傳》雲：“師，大師也。”《史記·齊世家》雲：大公望呂尚者，東海上人也。四嶽之後。尚佐武王伐紂，為大師。雲“死葬於周”，子孫是大公所生焉，故不忍離其先祖，非謂子孫生在於周。“子孫生焉”者，不忍離其生處。必五世者，五世之外則服盡也。然觀經及注，則太公之外為五世，便是玄孫之子，服盡亦反者。其實反葬正四世，知者，案《世本》，大公望生丁公伋，伋生乙公得，得生<疒酉>公慈母，慈母生哀公不臣。案《齊世家》，哀公荒淫，被紀侯譖之周，周夷王烹哀公，亦葬周也。哀公是大公玄孫，哀公死，弟胡公靖立。靖死，獻公山立。山死，武公壽立。若以相生為五世，則武公以上皆反葬於周；若以為君五世，則獻公以上反葬周。二者未知孰是。雲“齊曰營丘”者，《地理志》雲，臨淄縣，齊大公所封。案《釋丘》雲：“水出其前而左，曰營丘。”以水營繞，故曰營丘。然周公封魯，其子孫不反葬於周者，以其有次子在周，世守其采地，則《春秋》周公是也。故鄭康成作《詩譜》雲：“元子伯禽封魯，次子君陳世守采地。”下雲“延陵季子葬於嬴博之間”者，古禮也。故舜葬蒼梧，周則族葬，故《冢人》雲：“先王之葬居中，以昭穆為左右。”凡諸侯居左右以前，卿大夫士居後，各以其族是也。" }
      - { type: j, text: "伯魚之母死，期而猶哭。伯魚，孔子子也，名鯉。猶，尚也。○期音基。鯉音裏。”夫子聞之曰：“誰與哭者？”門人曰：“鯉也。”夫子曰：“嘻，其甚也。”嘻，悲恨之聲。○與音餘，下“餘閣也與”同。嘻，許其反，又於其反。伯魚聞之，遂除之。" }
      - { type: z, text: "“伯魚”至“除之”。○正義曰：此一節論過哀之事。○注“嘻，悲恨之聲”。○正義曰：“悲恨之聲”者，謂非責伯魚悲恨之聲也。時伯魚母出，父在，為出母亦應十三月祥，十五月禫。言期而猶哭，則是祥後禫前。祥外無哭，於時伯魚在外哭，故夫子怪之，恨其甚也。或曰，為出母無禫，期後全不合哭。" }
      - { type: j, text: "舜葬於蒼梧之野，舜徵有苗而死，因留葬焉。《書》說舜曰：“陟方乃死。”蒼梧，於周南越之地，今為郡。○梧音吾。陟，知力反，升也。蓋三妃未之從也。古者不合葬。帝嚳而立四妃矣，象后妃四星，其一明者為正妃，餘三小者為次妃。帝堯因焉。至舜不告而取，不立正妃，但三而已，謂之三夫人。《離騷》所歌湘夫人，舜妃也。夏后氏增以三三而九，合十二人。《春秋說》雲天子取十二，即夏制也。以虞、夏及周制差之，則殷人又增以三九二十七，合三十九人。周人上法帝嚳，立正妃，又三二十七為八十一人，以增之合百二十一人。其位後也、夫人也、嬪也、世婦也、女御也。五者相參以定尊卑。○嚳，苦毒反，高辛氏帝也。騷，素刀反，一音蕭。湘差，初佳反，又初宜反。嬪，婢人反。季武子曰：“周公蓋祔。”祔謂合葬。合葬自周公以來。○祔音父。" }
      - { type: z, text: "“舜葬”至“蓋祔”。○正義曰：此一節論古者不合葬之事。“舜葬於蒼梧之野”者，舜南巡守，因徵有苗而死，以古代不合葬，且天下為家，故遂葬於蒼梧之野。○“蓋三妃未之從也”者，從猶就也，古不合葬，故舜之三妃不就蒼梧與舜合葬也。雲“蓋”者，錄記之人傳雲舜時如此，未知審也，故云“蓋”。“未之從”者，記人以周公始附，舜時未有此禮，故云“未之從”也。記者既論古不合葬，與周不同，引季武子之言云周公以來蓋始附葬。附即合也，言將後喪合前喪。武子去周公不遠，無可疑，亦云“蓋”者，意有謙退，不敢指斥，事雖不疑，亦云“蓋”也。故《孝經》夫子雲“蓋天子之孝”也，“蓋諸侯之孝也”，非是不知，謙為疑辭。○注“舜徵”至“為郡”。○正義曰：鄭案《淮南子》雲：“舜徵三苗，而遂死蒼梧。”《史記》雲：“舜踐帝位三十九年，南巡守，崩於蒼梧之野，葬於九疑山，是為零陵。”案《尚書》“竄三苗於三危”，在西裔，今舜徵有苗，乃死於蒼梧者，張逸答焦氏問雲：“初竄西裔，後分之在南野。”《漢書·地理志》有蒼梧郡，是今為郡名也。○注“古者”至“尊卑”。○正義曰：知帝嚳立四妃者，案《大戴禮·帝系篇》雲：“帝嚳卜四妃之子，皆有天下。長妃有邰氏之女，曰姜嫄，生契。次妃有娀氏之女，曰簡狄，生契。次妃陳豐氏之女，曰慶都，生堯。次妃陬氏之女，曰常宜，生帝摯。帝嚳崩，帝摯即位。摯崩而堯立。”鄭此注用《帝系》之文，稷為堯之異母弟也。及注《詩·生民》之篇，與此異也，以為姜嫄是高辛之世妃，謂高辛後世子孫之妃，用《命歷序》之文，以為帝嚳傳十世，姜嫄是帝嚳十世以後子孫之妃。雲“象后妃四星”，案《援神契》雲：“辰極橫后妃四星，縱曲相扶。”案《祭法》雲“帝嚳能序星辰以著眾”，明象星立妃也。雲“帝堯因焉”者，以此經雲舜三妃未之從，明堯亦四妃也。雲“舜不告而取”者，案《孟子》萬章問孟子云：“舜不告而取，何也？”孟子曰：“告則不得取，父母終不為取妻，是絕其後也。”雲“但三妃而已”者，案《帝王世紀》雲：“長妃娥皇無子，次妃女英生商均，次妃癸比生二女，霄明、燭光是也。”雲“《離騷》所歌湘夫人”者，案《楚辭·九歌》第三曰《湘夫人》，雲“帝子降兮北渚，目眇眇兮愁予”是也。王逸注《離騷》雲：“娥皇女英，墮湘水溺焉。”又《秦紀》雲：“死而葬焉，非溺也。”《山海經》以為二女，此雲三者，當以《記》為正，《山海經》不可用。雲“周人上法帝嚳，立正妃”者，案《昏義》後一、夫人三是也。若然，案鄭注《尚書》帝乙妾生微子，後立為正妃，生紂。殷已有後者，謂三妃裏之正，仍無後也。雲“夫人也”者，即舜之三妃也。“嬪也”者，即夏所增九女也。“世婦也”者，即殷所增二十七人也。“女御也”者，即周所增八十一人也。自夏以下，節級三倍加之。" }
      - { type: j, text: "曾子之喪，浴於爨室。見曾元之辭易簀，矯之以謙儉也。禮，死浴於適室。○爨，七亂反。矯，居表反。儉，其檢反。適，於歷反。" }
      - { type: z, text: "“曾子”至“爨室”。○正義曰：此一節論曾子故為非禮，以正其子也。○注“見曾”至“適室”。○正義曰：案上易簀之後，反席未安而沒，焉得有浴爨室遺語者？以反席之前，欲易之後，足可有言，但記文不備。必知謂曾元之辭易簀，故矯之者，曾子達禮之人，應須浴於正寢，今乃浴於爨室，明知意有所為，故云“矯之”也。雲“禮，死浴於適室”者，《士喪禮》“死於適室”，下雲“甸人掘坎於階間，為垼於西牆下，新盆槃瓶造於西階下”，乃浴於適室也。於爨室為謙無甸人掘坎為垼之事，是儉也。" }
      - { type: j, text: "大功廢業。或曰：“大功誦可也。”許其口習故也。" }
      - { type: z, text: "“大功”至“可也”。○正義曰：此一節論遭喪廢業之事。“大功廢業者，業謂所學。習業，則身有外營，思慮他事，恐其忘哀，故廢業也。誦則在身所為，其事稍靜，不慮忘哀，故許其口習。言“或曰”者，以其事疑，故稱“或曰”。然錄記之人，必當明禮，應事無疑，使後世作法。今檢《禮記》，多有不定之辭。仲尼門徒親承聖，旨子游犭軍裘而吊，曾子襲裘而吊；又小斂之奠，或雲東方，或雲西方；同母異父昆弟，魯人或云為之齊衰，或雲大功。其作記之人，多雲“蓋”，多雲“或曰”，皆無指的，並設疑辭者，以周公制禮，永世作法，時經幽厲之亂，又遇齊晉之強，國異家殊，樂崩禮壞，諸侯奢僣，典法訛舛，是以普天率土，不閒禮教，故子思聖人之胤，不喪出母，隨武子晉之賢相，不識殽烝。作記之人，隨後撰錄，善惡兼載，得失備書。但初制禮之時，文已不具，略其細事，舉其大綱。況乃時經離亂，日月縣遠，數百年後，何能曉達？記人所以不定，止為失禮者多，推此而論，未為怪也。亦兼有或人之言也。" }
      - { type: j, text: "子張病，召申祥而語之曰：“君子曰終，小人曰死。申祥，子張子，欲使執喪，成已志也。死之言澌也，事卒為終，消盡為澌。《太史公傳》曰“子張姓顓孫”，今曰申祥，周、秦之聲，二者相近，未聞孰是。○語，魚據反。澌，本又作斯，音賜，下同。顓音專。近，附近之近。吾今日其庶幾乎？”言易成也。○易，以豉反。" }
      - { type: z, text: "“子張”至“幾乎”。○正義曰：此一節論子張將終，戒勖其子之事。子張病困，召子申祥而語之曰：“若君子之死謂之為終。”言但身終，功名尚在。“若小人之死，但謂之為死”。無功名可錄，但形骸澌盡也。子張言此，欲令子執治其喪，每事從禮，使我得成君子。○“吾今日其庶幾乎”者，庶，幸也。幾，冀也。言吾若平生為惡，不可幸冀為君子之人，吾即平生以善自修，今日將死，其幸冀為君子乎。汝但執喪成禮，以助我意，則功名得存，但身終而已。○注“申祥”至“孰是”。○正義曰：知“申祥，子張子”者，以病而召之，與曾子召申、元同，故知“子張子”也。雲“《大史公傳》曰子張姓顓孫”者，案《史記》，大史公姓司馬，名談，前漢人，作太史官，修史未成而卒，其子遷續成《史記》，作《仲尼七十二弟子傳》。雲“子張姓顓孫，今曰申祥”者，謂今《禮記》作申祥。雲“周、秦之聲，二者相近”者，謂周國秦國之人，言申與顓聲音相近，今不知顓是、不知申是，故云“未聞孰是”也。" }
      - { type: j, text: "曾子曰：“始死之奠，其餘閣也與。”不容改新。閣，庋藏食物。○奠，田練反。閣音各。庋，字又作庪，同，九毀反，又居偽反。" }
      - { type: z, text: "“曾子”至“也與”。○正義曰：此一節論初死奠之所用之事。○“始死之奠”者，鬼神所依於飲食，故必有祭酹，但始死未容改異，故以生時庋閣上所餘脯醢以為奠也。《士喪禮》復魄畢，“以脯醢升自阼，階奠於屍東”，此之謂也。○注“不容”至“食物”。○正義曰：閣，架橙之屬，人老及病，飲食不離寢，恐忽須無當，故並將近置室裏閣上也。若死仍用閣之餘奠者，為時期切促，急令奠酹，不容方始改新也。" }
      - { type: j, text: "曾子曰：“小功不為位也者，是委巷之禮也。譏之也。位謂以親疏敘列哭也。委巷，猶街裏委曲所為也。○街音佳。子思之哭嫂也為位，善之也。禮，嫂叔無服。○嫂，悉早反，注同。婦人倡踴，有服者，娣、姒婦小功。倡，先也。○倡，昌尚反，注同。踴音勇。娣姒，大計反，下音似。申祥之哭言思也亦然。”說者雲，言思，子游之子，申祥妻之昆弟，亦無服。過此以往，獨哭不為位。" }
      - { type: z, text: "“曾子”至“亦然”。○正義曰：此一節論無服為位哭之禮。○“小功不為位也”者，曾子以為哭小功之喪，當須為位。時有哭小功不為位者，故曾子非之，雲：若哭小功不為位者，是委細屈曲街巷之禮。言禮之末略，非典儀正法。既言其失，乃引得禮之人子思之哭嫂為親疏之位。於時子思婦與子思之嫂有小功之服，故子思之婦先踴，子思乃隨之而哭。非直子思如此，其申祥哭妻之兄弟言思亦然，是亦如子思也。○注“位謂”至“為也”。○正義曰：知位謂親疏敘列者，以其子思哭嫂為位，下雲“婦人倡踴”，婦人既在先，明知為位也。雲“委巷，猶街裏委曲所為也”者，謂庶人微賤在街巷裏邑，委細屈曲，所為不能方正也。此子思哭嫂，是孔子之孫，以兄先死，故有嫂也。皇氏以為原憲字子思，若然，鄭無容不注，鄭既不注，皇氏非也。孔氏《連叢》雲：“一子相承，以至九世。”及《史記》所說亦同者，不妨。雖有二子相承者，唯存一人，或其兄早死，故得有嫂。且雜說不與經合，非一也。○注“娣姒婦小功。倡，先也”。○正義曰：案《喪服》小功章：“娣姒婦報。”傳雲：“弟，長也。”鄭注“娣姒婦”者，兄弟之妻相名也。長婦謂稚婦為娣婦，娣婦謂長婦為姒婦。謂據婦年之長幼，則不據夫年之大小。故成十一年《左傳》雲：“聲伯之母不聘，穆姜曰：‘吾不以妾為姒。’”穆姜，魯宣公夫人，聲伯之母，魯宣公弟叔肸之妻，是弟妻為姒。又昭二十八年《左傳》雲：“子容之母走謁諸姑，曰：‘長叔姒生男。’”子容之母，伯華之妻也，長叔姒是伯華之弟叔肸之妻，是亦謂弟妻為姒也。皆不系夫身長幼。雲“倡，先也”者，案《詩》雲：“倡予和女。”是倡為先。○注“言思，子游之子，申詳妻之昆弟”者，謂妻之親昆弟也。自此以外，皆不為位，故《奔喪禮》“哭妻之黨於寢”，鄭引逸《奔喪禮》雲：“一哭而已，不為位矣。”" }
      - { type: j, text: "古者冠縮縫，今也衡縫。縮，從也。今禮制，衡讀為橫，今冠橫縫，以其闢積多。○縮，所六反。縫音逢，又扶用反，下同。衡依注音橫，華彭反。從，子容反。故喪冠之反吉，非古也。解時人之惑，喪冠縮縫，古冠耳。○解，佳買反。" }
      - { type: z, text: "“古者”至“古也”。○正義曰：此一節論記者解時人之惑也。古者，自殷以上也。縮，直也。殷以上質，吉凶冠皆直縫，直縫者，闢積攝少，故一一前後直縫之。○“今也衡縫”者，今，周也。衡，橫也。周世文，冠多闢積，下復一一直縫，但多作攝而並橫縫之。○“故喪冠之反吉，非古也”者，周吉冠文，故多積俵而橫縫也。若喪冠質，猶疏闢而直縫。是喪冠與吉冠相反，故云“喪冠之反吉”也。而時人因謂古時亦喪冠與吉冠反，故記者釋雲：“非古也，正是周世如此耳，古則吉凶冠同從縫。”" }
      - { type: j, text: "曾子謂子思曰：“伋，吾執親之喪也，水漿不入於口者七日。”言已以疾時禮而不如。○伋音急。漿，子良反。子思曰：“先王之制禮也，過之者俯而就之，不至焉者跂而及之。故君子之執親之喪也，水漿不入於口者三日，杖而後能起。”為曾子言難繼，以禮抑之。○俯音甫。跂，丘豉反。為，於偽反。" }
      - { type: z, text: "“曾子”至“能起”。○正義曰：此一節論曾子疾時居喪不能以禮，子思以正禮抑之之事。○曾子謂子思伋，誇己居親之喪能行於禮，故云“吾水漿不入於口七日”，意疾時人行禮不如已也。故子思以正禮抑之，雲“古昔先代聖王制其禮法，使後人依而行之，故賢者俯而就之，不肖者跂而及之。以水漿不入於口三日，尚以杖扶病”。若曾子之言，即後人難為繼也。" }
      - { type: j, text: "曾子曰：“小功不稅，據禮而言也。日月已過，乃聞喪而服曰稅，大功以上然，小功輕，不服。○稅，徐他外反，注同。上，時掌反。則是遠兄弟終無服也，言相離遠者，聞之恆晚。而可乎？”以己恩怪之。" }
      - { type: z, text: "“曾子”至“可乎”。○正義曰：此一節論曾子怪於禮小功不著稅服之事，曾子以為依禮小功之喪，日月已過，不更稅而追服，則是遠處兄弟聞喪恆晚，終無服而可乎？言其不可也。曾子仁厚，禮雖如此，猶以為薄，故怪之。此據正服小功也。故《喪服小記》雲“降而在緦小功者則稅之”，其餘則否。鄭康成義，若限內聞喪，則追全服。若王肅義，限內聞喪，但服殘日，若限滿即止。假令如王肅之義，限內秪少一日，乃始聞喪，若其成服，服未得成即除也。若其不服，又何名追服？進退無禮，王義非也。" }
      - { type: j, text: "伯高之喪，伯高死時在衛，未聞何國人。孔氏之使者未至，謂賻賵者。○使，色吏反。賻音附。賵，芳用反。冉子攝束帛乘馬而將之。冉子，孔子弟子冉有。攝猶貸也。○乘，繩證反，四馬曰乘。貸，他代反。孔子曰：“異哉！徒使我不誠於伯高。”徒猶空也。禮所以副忠信也，忠信而無禮，何傳乎？○副音僕。傳，直專反，一本作傅，音附。" }
      - { type: z, text: "“伯高”至“伯高”。○正義曰：此一節論禮所以副忠信之事，各依文解之。○注“冉子”至“貸也”。○正義曰：案《仲尼弟子傳》冉有名求，魯人也。攝猶貸也。謂冉子見孔子使人未至，貸之以束帛乘馬而行禮。○“孔子”至“伯高”。○孔子既聞冉有貸之行禮，故怪恨之，雲：“空使我不得誠信行禮於伯高。”○注“徒猶”至“傳乎”。○正義曰：忠信由心，禮在外貌。若內無忠信，禮何所施？故云“忠信而無禮”，謂無忠信也。既無忠信，禮何傳乎？言不可傳行也。冉有代孔子行吊，非孔子本意，是非孔子忠信，虛有吊禮。若孔子重遣人更吊，即彌為不可，故云空使我不得誠信行禮於伯高。" }
      - { type: j, text: "伯高死於衛，赴於孔子。赴，告也。凡有舊恩者，則使人告之。孔子曰：“吾惡乎哭諸？以其交會尚新。○惡音烏，惡乎猶“於何”也。兄弟，吾哭諸廟。父之友，吾哭諸廟門之外。別親疏也。○別，彼列反，下同。師，吾哭諸寢。朋友，吾哭諸寢門之外。所知，吾哭諸野。別輕重也。於野則已疏，於寢則已重。已猶大也。夫由賜也見我，吾哭諸賜氏。”本於恩，哭於子貢寢門之外。○夫，舊音扶，皇如字，謂丈夫即伯高。見如字，皇賢遍反。遂命子貢為之主，明恩所由。曰：“為爾哭也來者，拜之。知伯高而來者，勿拜也。”異於正主。○為，於偽反，下注“為其疾”、“為褻”、“為我”、“我為”皆同。來者，一本作“為爾哭也來者”。" }
      - { type: z, text: "“伯高”至“拜也”。○正義曰：此一節論親疏所哭之處，各依文解之。○注“別親疏也”。○正義曰：兄弟親，父友疏，必哭諸廟及廟門外者，兄弟是先祖子孫，則哭之於廟，此殷禮。周則哭於寢，故《雜記》雲，有殯，聞遠兄弟之喪，哭之側室；若無殯，當哭諸正寢。父之友與父同志，故哭諸廟門外。非先祖之親，故在門外也。○注“別輕重也”。○正義曰：師友為重，所知為輕，所以哭師於寢，寢是已之所居，師又成就於己，故哭之在正寢，此謂殷禮。若周禮，則《奔喪》雲，師哭諸廟門外。故鄭答趙商之問亦以為然。孫炎雲：“《奔喪》，師哭諸廟門外，是周禮也。”依禮而哭諸野，若不依此禮，則不可，故下雲“惡野哭者”，以違禮為野哭也。○“曰為”至“拜也”。○夫子既命子貢為主，又教子貢拜與不拜之法。若與女相知之人，為爾哭伯高之故而來吊爾者，則爾拜之。若與伯高相知而來哭者，女則勿拜也。凡喪之正主知生知死，來者悉拜。今與伯高相知而來不拜，故鄭雲“異於正主”。" }
      - { type: j, text: "曾子曰：“喪有疾，食肉飲酒，必有草木之滋焉。”增以香味，為其疾不嗜食。○滋音諮。嗜，市志反。以為薑桂之謂也。為記者正曾子所云草木滋者，謂薑桂。○姜，居良反。" }
      - { type: z, text: "“曾子”至“謂也”。○正義曰：此一節論居喪有疾，得食美味之事。○注“為記”至“薑桂”。○正義曰：知非曾子之言，而云“為記者”，以上雲“草木之滋焉”。下雲“以為薑桂之謂也”，是解上“草木之滋”，豈可曾子自言還自解乎？故以為記者正曾子之言。" }
      - { type: j, text: "子夏喪其子而喪其明。明，目精。○而喪，息浪反，下“喪明”、“喪爾明”同。曾子吊之，曰：“吾聞之也，朋友喪明則哭之。”痛之。曾子哭，子夏亦哭。曰：“天乎，予之無罪也！”怨天罰無罪。曾子怒曰：“商！女何無罪也？吾與女事夫子於洙、泗，之間，言其有師也。洙、泗、魯水名。○女音汝，下同。洙音殊。泗音四。洙、泗二水名。退而老於西河之上，西河，龍門至華陰之地。○華，徐胡化反。使西河之民，疑女於夫子，爾罪一也。言其不稱師也。喪爾親，使民未有聞焉，爾罪二也。言居親喪無異稱。○稱，尺證反。喪爾子，喪爾明，爾罪三也。言隆於妻子。而曰女何無罪與？”子夏投其杖而拜曰：“吾過矣！吾過矣！謝之，且服罪也。○與音餘。吾離群而索居，亦已久矣。”群謂同門朋友也。索猶散也。○離群，群，朋友也，上音詈。索，悉各反，猶散也，下注“索居”同。" }
      - { type: z, text: "“子夏”至“久矣”。○正義曰：此一節論子夏恩隆於子之事。案《仲尼弟子傳》雲，子夏姓卜，名商，魏人也。哀喪其子而哭，喪失其明。曾子是子夏之友，故云“朋友喪明則哭之”。子夏喪子之時，曾子已吊，今為喪明更吊，故曾子先哭，子夏始哭。雲“疑女於夫子”者，既不稱其師，自為談說，辨慧聰睿，絕異於人，使西河之民疑女道德與夫子相似。皇氏言，疑子夏是夫子之身。然子夏魏人，居在西河之上，姓卜名商，西河之民，無容不識，而言是魯國孔丘，不近人情，皇氏非也。" }
      - { type: j, text: "夫晝居於內，問其疾可也。似有疾。○晝，知又反。夜居於外，吊之可也。似有喪。是故君子非有大故，不宿於外，大故謂喪憂。非致齊也，非疾也，不晝夜居於內。內，正寢之中。○齊，側皆反。" }
      - { type: z, text: "“夫晝”至“於內”。○正義曰：此一節論君子居處當合於禮，各依文解之。○注“大故謂喪憂”。○正義曰：上文雲“夜居於外，吊之可也”。○鄭雲：“似有喪。”此注兼雲憂者，以其文雲“大故”，語意既寬，非獨喪也。故《周禮》每雲“國有大故”，皆據寇戎災禍，故此兼雲憂也。身既有憂，而夜在於外者，既憂禍難，不暇入內；或與臣下外人，夜裏在外圖謀禍患。此謂中門外也，故禮：斬衰及期喪，皆中門外為廬堊室。是有喪，夜居中門外也。○“非致”至“於內”。○平常無事之時，或出或入，雖晝居於外，亦有入內。雖夜居於內，亦有出外時。唯致齊與疾，無間晝夜，恆居於內，故云“非致齊也，非疾也，不晝夜居於內”。○注“內，正寢之中”。○正義曰：恐內是燕寢，故云“正寢之中”。必知正寢者，以其經雲非致齊，不居於內。致齊在正寢，疾則或容在內寢，若危篤亦在正寢。上文雲“晝居於內，問其疾可也”，不問齊者，齊是為祭之事，眾所共知，不須問也。此齊在內，《祭統》雲：“君致齊於外，夫人致齊於內。”對夫人之寢為外內耳。" }
      - { type: j, text: "高子皋之執親之喪也，子皋，孔子弟子，名柴。泣血三年，言泣無聲，如血出。未嘗見齒，言笑之微。○見，賢遍反。君子以為難。言人不能然。" }
      - { type: z, text: "“高子”至“為難”。○正義曰：此一節論高柴居喪過禮之事，各依文解之。○注“子皋，孔子弟子，名柴”。○正義曰：案《史記·孔子弟子傳》，高柴，鄭人，字子皋。○注“言泣無聲，如血出”。○正義曰：凡人涕淚，必因悲聲而出。若血出，則不由聲也。今子皋悲無聲，其涕亦出，如血之出，故云“泣血”。○注“言笑之微”。○正義曰：既雲“泣血三年”，得有微笑者，凡人之情，有哀有樂。哀至則泣血，樂至則微笑。凡人大笑則露齒本，中笑則露齒，微笑則不見齒。○“君子以為難”。○君子以高柴所為，凡人難可為之，何者？凡人發聲始涕出，樂至為大笑，今高柴恆能如此，餘人不能，故為難也。" }
      - { type: j, text: "衰，與其不當物也，寧無衰。惡其亂禮，不當物，謂精{分鹿}廣狹不應法制。○衰，七雷反，下同，後“五服之衰”皆放此，不復音。當，丁浪反，注同。惡，烏路反。{分鹿}本又作，七奴反。狹音洽。應，應對之應。齊衰不以邊坐，大功不以服勤。為褻喪服。邊，偏倚也。○褻，息列反。倚，於彼反，又於寄反。" }
      - { type: z, text: "“衰與”至“服勤”。○正義曰：此一節論衰裳升數形制必須依禮，及著服不得為褻之事，各依文解之。○“衰，與其不當物也”者，此語乃通於五服，而初發斬衰也。衰，喪服也。當猶應也。物謂升縷及法制長短幅數也。衰以表情，故制有法度。若精{分鹿}不應，廣狹乖法，便為失禮，故云“寧無衰”也，是雖有不如無也。○“齊衰不以邊坐”者，因上“寧無衰”以廣其事也。“邊坐”謂偏倚也。喪服宜敬，坐起必正，不可著衰而偏倚也。齊衰輕，既不倚，斬重，不言亦可知也。○“大功不以服勤”者，大功雖輕，亦不可著衰服以為勤勞事也。齊衰言“不邊坐”，則大功可也。大功不勤，則齊衰固不可，而小功可也。" }
      - { type: j, text: "孔子之衛，遇舊館人之喪，前日君所使捨己。入而哭之哀。出，使子貢說驂而賻之。賻，助喪用也。騑馬曰驂。○稅，本又作說，同，他活反，徐又始銳反，下及注同。驂，七南反，夾服馬也。騑，芳非反。子貢曰：“於門人之喪，未有所說驂，說驂於舊館，無乃已重乎？”言說驂大重，比於門人，恩為偏頗。○頗，破多反。夫子曰：“予鄉者入而哭之，遇於一哀而出涕。遇，見也。舊館人恩雖輕，我入哭見主人，為我盡一哀，是以厚恩待我，我為出涕。恩重，宜有施惠。○鄉，本又作鄉，許亮反。出如字，徐尺遂反。涕音體。施，始豉反。予惡夫涕之無從也，小子行之！”客行無他物可以易之者，使遂以往。○惡，烏路反。夫音扶。" }
      - { type: z, text: "“孔子”至“行之”。○正義曰：此一節論孔子欲示人行禮副忠信之事，各依文解之。○注“前日君所使捨己”。○正義曰：知非舊所經過主人，必以為君所使捨己者，若是經過主人，當雲遇舊主人之喪，故《禮》稱皆雲“主人”。是以《左傳》雲：“以為東道主。”又云：“昔吾主於趙氏。”皆主人為主。今此雲“館人”，明置館舍於己，故以為君所使舍已者。○注“賻助”至“曰驂”。○正義曰：謂助生者喪家使用，故《既夕禮》“知死者贈，知生者賻”，是賻為助生也。熊氏以此賻助喪用，謂助死者，因雲賻得生、死兩施，熊氏非也。案隱元年《穀梁傳》雲“錢財曰賻”，此用馬者，即財也。故《少儀》雲：“賻馬不入廟門。”雲“騑馬曰驂”者，《說文》雲：“騑，旁馬。”是在服馬之旁。又《詩》雲：“騏騮是中，騧驪是驂。”驂在外也。孔子得有驂馬者，案《王度記》雲“天子駕六馬，諸侯四，大夫三，士二”，古《毛詩》雲“天子至大夫皆駕四”，孔子既身為大夫，若依《王度記》則有一驂馬也，若依《毛詩說》則有二驂馬也。○“子貢”至“行之”，以子貢不欲說驂，故夫子語其說驂之意，雲我所說驂者，我鄉者入而哭之，遇值主人，盡於一哀，是厚恩待我，我為之出涕。既為出涕，當有厚施惠。“予惡夫涕之無從者”，謂我感舊館人恩深，涕淚交下，豈得虛？然客行更無他物易換此馬，女小子但將驂馬以行之，副此涕淚。然《論語》雲：“顏回之喪，子哭之慟。”慟比出涕，慟則為甚矣。又舊館之恩，不得比顏回之極。而說驂於舊館，惜車於顏回者，但舊館情疏，厚恩待我，須有賵賻，故說驂賻之。顏回則師徒之恩親，乃是常事，則顏回之死，必當以物與之。顏路無厭，更請賣車為槨，以其不知止足，故夫子抑之。" }
      - { type: j, text: "孔子在衛，有送葬者，而夫子觀之，曰：“善哉為喪乎！足以為法矣，小子識之。”子貢曰：“夫子何善爾也？”曰：“其往也如慕，其反也如疑。”慕謂小兒隨父母啼呼。疑者，哀親之在彼，如不欲還然。○識，式志反，又音式，下及注“章識”皆同。呼，火故反。子貢曰：“豈若速反而虞乎？”速，疾。子曰：“小子識之，我未之能行也。”哀戚，本也。祭祀，末也。" }
      - { type: z, text: "“孔子”至“行也”。○正義曰：此一節論喪禮以哀戚為本之事，各依文解之。○注“慕謂”至“還然”。○正義曰：言慕如小兒啼呼者，謂父母在前，嬰兒在後，恐不及之，故在後啼呼而隨之。今親喪在前，孝子在後，恐不逮及，如嬰兒之慕。疑者，謂凡人意有所疑，在傍徨不進。今孝子哀親在外，不知神之來否，如不欲還然，故如疑。《問喪》雲：“其反也如疑。”鄭注云“疑者不知神之來否”，與此相兼乃足。○“子貢曰，豈若速反而虞乎”。○子貢之意，葬既已竟，神靈須安，豈如速反虞祭安神乎？但哀親在彼，是痛切之本情，反而安神，是祭祀之末禮，故下文夫子不許。" }
      - { type: j, text: "顏淵之喪，饋祥肉，饋，遺也。○饋，其位反。遺，於季反。孔子出受之。入彈琴而後食之。彈琴以散哀也。" }
      - { type: j, text: "孔子與門人立，拱而尚右，二三子亦皆尚右。傚孔子也。○拱，恭勇反。傚，本又作效，胡教反，下同。孔子曰：“二三子之嗜學也，嗜，貪。○嗜，市志反，注同。我則有姊之喪故也。”二三子皆尚左。復正也。喪尚右，右，陰也。吉尚左，左，陽也。" }
      - { type: z, text: "“孔子”至“尚左”。○正義曰：此一節論拱手之禮。○注“喪尚”至“陽也”。○正義曰：此既凶事尚右，吉事尚左，案《特牲》、《少牢》吉祭皆載右胖，《士虞禮》是凶事載左胖者，取義不同。吉祭載右胖者，從地道尊右。《士虞禮》兇祭載左胖者，取其反吉，故《士虞禮》“設洗於西階西南”，鄭注“反吉”是也。" }
      - { type: j, text: "孔子蚤作，作，起。○蚤音早。負手曳杖，消搖於門，欲人之怪己。○抴，羊世反，亦作曳。消搖，本又作逍遙。歌曰：“泰山其頹乎？泰山，眾山所仰。○頹，徒回反。樑木其壞乎？梁木，眾木所放。○放，方兩反。哲人其萎乎？”哲人亦眾人所仰放也。以上二句喻之。萎，病也。《詩》雲：“無木不萎。”○委，本又作萎，同，紆危反，注同。既歌而入，當戶而坐。蚤坐，急見人也。子貢聞之曰：“泰山其頹，則吾將安仰？樑木其壞，哲人其萎，則吾將安放？夫子殆將病也。”覺孔子歌意。殆，幾也。○幾音祈，又音機。遂趨而入。夫子曰：“賜，爾來何遲也？坐則望之。夏后氏殯於東階之上，則猶在阼也。殷人殯於兩楹之間，則與賓主夾之也。周人殯於西階之上，則猶賓之也。以茸荃之禮佔已夢。○阼，才故反。楹音盈。夾，本又作俠，古洽反，下注同。而丘也，殷人也。予疇昔之夜，夢坐奠於兩楹之間。是夢坐兩楹之間而見饋食也。言奠者，以為兇象。疇，發聲也。昔猶前也。○食如字，又音嗣。疇，直留反。夫明王不興，而天下其孰能宗予？予殆將死也。”孰，誰也。宗，尊也。兩楹之間，南面鄉明，人君聽治正坐之處。今無明王，誰能尊我以為人君乎？是我殷家奠殯之象，以此自知將死。○鄉，本又作鄉，同，許亮反。治，直吏反。坐，才臥反，又如字。處，昌慮反。蓋寢疾七日而沒，明聖人知命。" }
      - { type: z, text: "“孔子”至“而沒”。○正義曰：此一節論孔子自說死之意狀，各依文解之。○注“欲人之怪己”。○正義曰：杖以扶身，恆在前面用，今乃反手卻後，以曳其杖，示不復杖也。又夫子禮度自守，貌恆矜莊，今乃消搖放蕩，以自寬縱，皆是特異尋常。陵且如此，故云“欲人之怪己”。杖曳於後，示不復用。消搖寬縱，示不能以禮自持，並將死之意狀。○注“梁木，眾木所放”。○正義曰：眾木，榱桷之屬，依放橫樑乃存，立放則依也。故《論語》雲：“放於利而行。”孔曰：“放，依也。”○注“以上”至“不萎”。○正義曰：“泰山”、“梁木”，並指他物，“哲人其萎”，指夫子之身，以二物比己，故云“以上二句喻之”。雲“《詩》雲：“無木不萎”者，此《小雅·穀風》剌幽王之詩，言天下俗薄，朋友道絕。其《詩》雲：“無草不死，無木不萎。”證“萎，病”。○注“蚤坐，急見人也”。○正義曰：君子尋常不自當戶，已歌而入，即當戶而坐，故云“蚤坐”，坐不在隱處，是急欲見人。○“泰山”至“安放”者，上既雲“泰山”、“梁木”、“哲人”三句，今子貢所云“泰山其頹”，雲“吾將安仰”，“梁木”“哲人”總雲“言將安放”者，以泰山、梁木共喻哲人，子貢意在忽遽，不暇句句別言，故直引梁木、哲人相喻，而足總雲“吾將安放”。○“夏後”至“之也”者，“夏后氏殯於東階，則猶在阼”，“周人殯於西階，則猶賓之”，夏與周並言“猶”者，以其既死，無所知識，孝子不忍，以生禮待之，猶尚阼階以為主，猶尚西階以為賓客，故言“猶”也。“殷人殯於兩楹之間”，不雲“猶”者，庾蔚雲：“東階西階，平生賓主所行禮之處，故云猶。兩楹之間，生無此禮，故不雲猶。”然禮：賓主敵者，授受於兩楹之間，又是南面聽朝之處，庾雲“生無此禮”，於義疑也。蓋以夫子夢在兩楹而見饋食，知是兇象，無聽朝之事，不得雲“則猶尊之”，以有賓主二事，故云“與”也。鄭注《考工記》，宗廟路寢，制如明堂。周之明堂，東西九筵，南北七筵，則五室，每室二筵，則五室之外，堂上窄狹，得容殯者。以路寢廣大，故得容之。其上圓下方，五室之屬如明堂。日至、明堂具解。○注“言奠者以為兇象”。○正義曰：時夫子夢見饋食，不夢兇奠也。但奠禮既死之後，未葬之前，柩仍在地，未立屍主，唯奠停飲食，故云奠也。○注“孰誰”至“將死”。○正義曰：“孰，誰也”，《釋詁》文。禮有大宗小宗，故云“宗，尊也”。知“兩楹之間，人君聽治正坐之處”者，案《覲禮》：“天子負斧依南面。”又《顧命》雲：“牖間南向。”是天子兩楹治事之處也。每日視朝雖在路門外，退坐當路寢兩楹也。其諸侯視朝亦南面，知者，以諸侯一國之尊，故《論語》雲：“雍也可使南面。”鄭注：“言在諸侯治也。”則在路寢南面聽政。若其燕饗，則在阼階西面，知《禮·大射》是也。案《莊子》：“聖人無夢。”莊子意在無為，欲令靜寂無事，不有思慮，故云“聖人無夢”。但聖人雖異人者神明，同人者五情，五情既同，焉得無夢？故《禮記·文王世子》有九齡之茫罻《尚書》有武王夢協之言。" }
      - { type: j, text: "孔子之喪，門人疑所服。無喪師之禮。子貢曰：“昔者夫子之喪顏淵，若喪子而無服，喪子路亦然。請喪夫子若喪父而無服。”無服，不為衰，吊服而加麻，心喪三年。" }
      - { type: z, text: "“孔子”至“無服”。○正義曰：此一節論弟子為師喪制之禮，各依文解之。○“門人疑所服”者，依禮，喪師無服，其事分明。今夫子之喪，門人疑者，以夫子聖人，與凡師不等，當應特加喪禮，故疑所服。○注“吊服”至“三年”。○正義曰：知為師吊服加麻者，案《喪服》“朋友麻”，其師與朋友同，故知亦加麻也。必知喪師與朋友同者，案下雲：“孔子之喪，二三子皆絰而出。群居則絰，出則否。”是弟子相為與為夫子同，但絰出與不出有異，明其服同也。雲“吊服而加麻”，麻謂絰與帶也，皆以麻為之，故云“加麻”也。又《喪服》緦麻章雲：“朋友麻。”鄭雲“朋友雖無親而有同道之恩，相為服緦之絰帶”是也。鄭知“服緦之絰帶”者，緦為五服之輕，又與錫衰等同為吊服之限，故知緦之絰帶也。論雲，為師及朋友皆既葬除之。案《司服》雲：“王為三公六卿錫衰，為諸侯緦衰，為大夫士疑衰，其首服皆弁絰。”鄭司農雲：“錫者十五升去其半，有事其布，無事其縷。”鄭康成雲：“無事其縷，哀在內。”以服稍重，故但治事其布，不治事其縷。鄭司農又云：“緦十五升布去其半，有事其縷，無事其布。鄭康成雲：“無事其布，哀在外。”以其稍輕，故得治縷也。司農又云：“疑衰十四升。”康成雲：“疑之言擬也，擬於吉服。”謂比擬吉服十五升也。“首服弁絰”者，鄭注《司服》雲：“弁絰如爵弁而素，加環絰。”鄭知如爵弁者，見下文雲“殷人哻而葬”，又云“弁絰葛而葬，與神交之道”。哻是祭冠也，故知弁絰是爵弁也。知加環絰者，以《雜記》雲：“小斂環絰，公大夫士一也。”天子吊諸臣之服，無問當事與不當事，皆弁絰也。諸侯以錫衰為吊服，但首服有異。吊他國皆首服皮弁，故《喪服小記》雲“諸侯吊，必皮弁錫衰”是也。若吊已臣，當事則弁絰，故《服問》雲：公吊，“當事則弁絰”，於士雖當事亦皮弁。諸侯雖以錫衰為常吊之服，其吊士亦有緦衰、疑衰，故鄭注《文王世子》雲：“同姓之士則緦衰，異姓之士則疑衰。”卿大夫亦以錫衰為吊服，當事亦弁絰，故鄭注《喪服》雲：“諸侯及卿大夫亦以錫衰為吊服，當事乃弁絰，否則皮弁，闢天子也。”其士之吊服則疑衰，故鄭注《喪服》雲：“士以緦衰為喪服，其吊服則疑衰也。”舊說以為士吊服布上素下，鄭注云：“此實疑衰也。改其裳以素，闢諸侯也。”當事亦弁絰，故鄭注《喪服》雲：“士弁絰皮弁之時，如卿大夫。”凡吊服惟有弁絰，皆無帶也。知無帶者，《周禮·司服》及《服問》但云“弁絰”，不雲帶，故知然也。其朋友之服，諸侯及大夫等則皆疑衰，故鄭注《喪服》雲：“朋友之相為服，則士吊服也。”既特雲“士吊服”，明諸侯大夫等皆用士之吊服，唯加緦之絰帶為異耳。是以《喪服》：“朋友麻。”鄭注云：“服緦之絰帶。”又下文雲：“子游襲裘，帶絰而入。”鄭注云：“所吊者朋友。”是朋友相為加帶。凡朋友相為者，雖不當事，亦弁絰，故下文雲“居則絰”是也。其庶人，鄭注《喪服》雲：“庶人不爵弁，則其吊服素冠委貌。”鄭注不顯所著之服，文承“疑衰素裳”之下，則庶人亦用疑衰。或者庶人布深衣，當服布深衣，冠素委貌也。" }
      - { type: j, text: "孔子之喪，公西赤為志焉。公西赤，孔子弟子，字子華。志謂章識。飾棺牆，牆之障柩，猶垣牆障家。置翣，牆，柳衣。翣，以布衣木，如攝與？○置，知吏反。翣，所甲反。衣，於既反。攝，所甲反，又所治反。與音餘。設披，周也。設崇，殷也。綢練設旐，夏也。夫子雖殷人，兼用茸荃之禮尊之。披，柩行夾引棺者。崇牙，旌旗飾也。綢練，以練綢旌之槓，此旌葬乘車所建也。旌之旒，緇布廣充幅，長尋曰旐。《爾雅》說旌旗曰：“素錦綢槓。”○披，彼義反。綢，吐刀反，韜也，徐直留反，注同。旐，直小反。槓音江，竿也。乘，繩證反。廣，光浪反，凡度廣狹曰廣，他皆放此。幅，方木反。" }
      - { type: z, text: "“孔子”至“夏也”。○正義曰：此一節論孔子之喪，送葬用茸荃之禮，各依文解之。○注“公西”至“子華”。○正義曰：案《仲尼弟子傳》雲：“公西赤，字子華，少孔子四十二歲。”鄭雲：“魯人也。”○“飾棺”至“夏也”。○孔子之喪，公西赤以飾棺榮夫子，故為盛禮，備茸荃之法，以章明志識焉。於是以素為褚，褚外加牆，車邊置翣，恐柩車傾虧，而以繩左右維持之，此皆周之法也。其送葬乘車所建旌旗，刻繒為崇牙之飾，此則殷法。又韜盛旌旗之竿以素錦，於槓首設長尋之旐，此則夏禮也。既尊崇夫子，故兼用三代之飾也。○注“牆柳”至“攝與”。○正義曰：“牆之障柩，猶垣牆障家”，故謂障柩之物為牆。障柩之物，即柳也。外旁惟荒，中央材木，總而言之，皆謂之為柳也。《縫人》注云：“柳，聚也。諸飾所聚。”前文注云“牆，柳”者，以經直雲“周人牆置翣”，文無所對，故注直雲“牆，柳也”。此文為下對“設披”、“設崇”、“設旐”之事，皆委曲備言，故亦委曲解之，故注云“牆，柳衣”也，其實牆則柳也。《雜記》喪從外來，雖非葬節，以裳帷障棺，亦與垣牆相似，故鄭注“不毀牆”之下雲：“牆，裳帷也。”皆望經為義，故三注不同。雲“翣，以布衣木”者，鄭注《喪大記》雲：“漢禮，翣以木為筐，廣三尺，高二尺四寸，方兩角高，衣以白布，畫雲氣，柄長五尺。”雲“如攝與”者，攝與，漢時之扇。與，疑辭。鄭恐人不識翣體，故云如今攝與。○注“披柩”至“綢槓”。○正義曰：案《喪大記》國君燻披六，鄭雲：“設之於旁，所以備傾虧也。故此雲“披，柩行夾引棺者”。雲“崇牙，旌旗飾也”者，對下“綢練設旐”，故為旌旗飾也。謂旌旗之旁，刻繒為崇牙。殷必以崇牙為飾者，殷湯以武受命，恆以牙為飾。雲“此旌葬乘車所建也”者，案《既夕禮》陳車門內右北面，乘車載旃，“道車載朝服，瑽車載蓑笠”，故知此旌乘車所建也。凡送葬之旌，經文不具。案《既夕》士禮而有二旌，一是銘旌，是初死書名於上，則《士喪禮》“為銘各以其物，書名於末曰，某氏某之柩，置於西階上”。葬則在柩車之前，至壙與茵，同入於壙也。二是乘車之旌，則《既夕禮》乘車載旃，亦在柩之前。至壙，柩既入壙，乃斂乘車所載之旌，載於柩車而還，故鄭注《既夕禮》雲：“柩車至壙，祝脫載除飾，乃斂乘車、道車、槁車之服，載之而還，不空以歸。送形而往，迎精而反。”此是士之二旌也，其大夫諸侯則無文，其天子亦有銘旌，與士禮同。故《司常》雲：“大喪共銘旌。”鄭注云：“王則大常也。”《士喪禮》曰，為銘各以其物，初死亦置於西階，將葬移置於茵，從遣車之後，亦入於壙也，是其一旌也。《司常》又云：“建廞車之旌。”廞，謂興作之則，明器之車也，其旌則明器之旌。止則陳建於遣車之上，行則執之以從。遣車至壙，從明器而納之壙中，此二旌也。案士禮既有乘車載旃，攝，孤卿之旃，則天子亦當有乘車載大常，謂以金路載之至壙，載之而歸，但禮文不具耳，此其三旌也。然則天子三旌也，士以禮無遣車，故無廞車之旌，但二旌耳。諸侯及大夫無文。熊氏以為大夫以上有遣車，即有廞旌，並有三旌也。雲“旌之旒，緇布廣充幅，長尋曰旐”者，《爾雅·釋天》文。引之者，證經中“設旐，夏也”。案鄭注《明堂位》雲：“有虞氏當言緌，夏后氏當言旂。”以此差之，古代尚質，有虞氏但注旄竿首，未有繒帛，故云緌也。夏後漸文，故有素錦綢槓，又垂八尺之旐，故夏雲旂也。旂是大古名，非交龍之旂。周則文物大備，旂有九等，垂之以縿，系之以旃，又有交龍之旂，龜蛇之旐，與夏不同。夏雖八尺之旐，更無餘飾。又引《爾雅》“素錦綢槓”者，亦《爾雅·釋天》文引之者，證經文“綢練”，練則素錦，用以為綢槓也。" }
      - { type: j, text: "子張之喪，公明儀為志焉。志亦謂章識。褚幕丹質，以丹布幕為褚，葬覆棺，不牆不翣。○褚，張呂反。幕音莫，褚幕，覆棺者。蟻結於四隅，懷嬉之四角，其文如蟻行往來相交錯，蟻，蚍蜉也。殷之蟻結，似今蛇文畫。○蟻，魚綺反，又作蛾。妣，避屍反，徐扶夷反。蜉音浮。殷士也。學於孔子，傚殷禮。" }
      - { type: z, text: "“子張”至“士也”。○正義曰：此一節論孔子弟子送葬車飾學孔子行殷禮之事，各隨文解之。○“子張之喪，公明儀為志焉”。公明儀是其弟子，亦如公西赤為章識焉。此公明儀又為曾子弟子，故《祭義》雲“公明儀問於曾子曰：‘夫子可以為孝乎’”是也。○“褚幕丹質”者，褚謂覆棺之物，若大夫以上，其形似幄，士則無褚。今公明儀尊敬其師，故特為褚，不得為幄，但似幕形，故云“褚幕”，以丹質之布而為之也。○“蟻結”者，蟻，蚍蜉也。又於褚之四角畫蚍蜉之形，交結往來，故云“蟻結於四隅”。所以不牆不翣者，用殷禮也。所以畫蟻者，殷禮士葬之飾也。棺蓋亦或取蚍蜉。夫子聖人，雖行殷禮，弟子尊之，故葬兼三代之禮。今公明儀雖尊其師，秪用殷法，不牆不翣，唯特加褚幕而已。上葬夫子用三代之飾，案《士喪禮》既非聖人，亦用夏祝、商祝，彼謂祝習夏禮、商禮，總是周祝也。故鄭注《士喪禮》雲：夏祝，祝習夏禮者也。夏人教以忠，其於養宜，故主饋食。商祝，祝習商禮者，商人教之以敬，於接神宜，故主衣服襲斂。周人之喪，皆有夏、商二祝，與夫子用三代之禮，其義不同。夫子用三代之禮，不為僣者，用其大夫之禮耳。必用三代者，夫子聖人，德備三代文物故也。" }
      - { type: j, text: "子夏問於孔子曰：“居父母之仇，如之何？”夫子曰：“寢苫枕幹，不仕，雖除喪，居處猶若喪也。幹，盾也。○仇音求，讎也。苫，始佔反，草也。枕，之鴆反。楯，本又作盾，食允反，又音允。弗與共天下也。不可以並生。遇諸市朝，不反兵而鬥。”言雖適市朝，不釋兵。○朝，直遙反，注同。曰：“請問居昆弟之仇，如之何？”曰：“仕弗與共國，銜君命而使，雖遇之，不鬥。”為負而廢君命。○銜音鹹。使，色吏反。為，於偽反，下“為其負”、“相為”同。曰：“請問居從父昆弟之仇，如之何？”曰：“不為魁。魁猶首也。天文北斗，魁為首，杓為末。○從如字，徐才用反。魁，苦回反。杓，必遙反，又匹遙反。主人能，則執兵而陪其後。”為其負當成之。○陪，步回反。" }
      - { type: z, text: "“子夏”至“其後”。○正義曰：此一節論親疏報仇之法，各依文解之。○“遇諸市朝”者，上既雲“不仕”，得有遇諸朝者，身雖不仕，或有事須入朝，故得有遇諸朝也。“不反兵而鬥”者，言執殺之備，身常帶兵，雖在市朝，不待反還取兵即當鬥也。然朝在公門之內，兵器不入公門，身得持兵入朝者，案《閽人》“掌中門之禁”，但兵器不得入中門耳。其大詢眾庶，在皋門之內，則得入也。且朝文既廣，設朝或在野外，或在縣、鄙、鄉、遂，但有公事之處，皆謂之朝。兵者，亦謂佩刀已上，不必要是矛戟。皇氏以為市朝正謂市也，市有行肆似朝，故謂市朝。此辭非也。上《曲禮》唯雲：“不與共載天。”文不備也。上《曲禮》雲：“兄弟之讎不反兵。”此父母之仇雲“不反兵”，又此昆弟之仇不雲“不反兵”者，父母與昆弟之仇皆不反兵。上《曲禮》昆弟之仇雲“不反兵”者，謂非公事，或不仕者，故恆執持殺之備。此文昆弟之仇，據身仕為君命出使，遇之不鬥，故不得雲“不反兵”也。二文相互乃足。○注“為負而廢君命”。○正義曰：負猶不勝也。為其鬥而不勝，廢君命也。下注雲：“為其負當成之，負亦謂不勝也。”○注“天文北斗，魁為首，杓為末”。○正義曰：案《春秋·運鬥樞》雲：“北斗七星，第一天樞，第二旋，第三機，第四權，第五衡，第六開陽，第七搖光。第一至第四為魁，第五至第七為杓。”是“魁為首，杓為末”。○“主人能，則執兵而陪其後”。○謂從父昆弟之仇，既不為報仇魁首，若主人能自報之，則執兵陪助其後。" }
      - { type: j, text: "孔子之喪，二三子皆絰而出。尊師也。出，謂有所之適。然則凡吊服加麻者，出則變服。○絰，大結反。群居則絰，出則否。群謂七十二弟子，相為朋友服。子夏曰：“吾離群而索居。”。" }
      - { type: j, text: "易墓，非古也。易謂芟治草木，不易者，丘陵也。○易，以豉反，注同。芟，所銜反。" }
      - { type: z, text: "“易墓非古也”。○正義曰：此一節論墓內不合芟治之事。○“易謂”至“陵也”。○正義曰：墓謂冢旁之地，易謂芟治草木，不使荒穢。不易者，使有草木如丘陵然。言“易墓，非古也”，則古者殷以前墓而不墳，是不治易也。" }
      - { type: j, text: "子路曰：“吾聞諸夫子：‘喪禮，與其哀不足而禮有餘也，不若禮不足而哀有餘也。喪主哀。祭禮，與其敬不足而禮有餘也，不若禮不足而敬有餘也。’”祭主敬。" }
      - { type: z, text: "“子路”至“餘也”。○正義曰：此一節論喪主哀，祭主敬之事。○“吾聞諸夫子”者，諸，之也，據所聞事於孔子也。○“喪禮，與其哀不足而禮有餘也”，此所聞事，“喪禮”，居喪之禮也；“與”，及也；“禮有餘”，明器衣衾之屬也；言居喪及其哀少而禮物多也。“不若禮不足而哀有餘也”者，若物多而哀少，則不如物少而哀多也。○“祭禮，與其敬不足而禮有餘也”者，“祭禮”謂祭祀之禮也，“而禮有餘”，謂俎豆牲牢之屬多也，言敬少而牢多也。“不若禮不足而敬有餘也”者，若牲器多而敬少，則不如牲器少而敬多也。" }
      - { type: j, text: "曾子吊於負夏，負夏，衛地，主人既祖，填池，祖謂移柩車去載處，為行始也。填池，當為“奠徹”，聲之誤也。奠徹謂徹遣奠，設祖奠。○填池，依注音奠徹，盧、王並如字。處，昌慮反，下同。遣奠，棄戰反，本或作“遷奠”，非。推柩而反之，反於載處，榮曾子吊，欲更始。○推，昌佳反，又吐回反。柩，其久反。降婦人而後行禮。禮，既祖而婦人降，今反柩，婦人闢之，復升堂矣。柩無反而反之，而又降婦人，蓋欲矜賓於此婦人，皆非。○闢音避，下“闢賢”、“闢不懷”並同。復，扶又反，從者曰：“禮與？”怪之。○從音才用反，下同。與音餘，下同。曾子曰：“夫祖者且也，且，未定之辭。○夫音扶。且胡為其不可以反宿也？”給說。從者又問諸子游曰：“禮與？”疑曾子言非。子游曰：“飯於牖下，小斂於戶內，大斂於阼，殯於客位，祖於庭，葬於墓，所以即遠也。故喪事有進而無退。”明反柩非。○飯，煩晚反。牖，羊久反。斂，力驗反，禮家凡“小斂”、“大斂”之字皆同，不重出。阼，才故反。曾子聞之曰：“多矣乎，予出祖者！”善子游言，且服。○且服，本或作“且服過”。" }
      - { type: z, text: "“曾子”至“祖者”。○正義曰：此一節論負夏氏葬禮所失之事。○“既祖，填池”者，案《既夕禮》啟殯之後，“柩遷於祖，重先，奠從，柩從，升自西階，正柩於兩楹間，用夷床”。鄭注云：“是時柩北首。”設奠於柩西，此奠謂啟殯之奠也。質明徹去啟奠，乃設遷祖之奠於柩西。至日側乃卻下柩，載於階間。乘蜃車，載訖，降下，遷祖之奠，設於柩車西，當前束。時柩猶北首，前束近北。前束者，謂棺於車束有前後，故云前束。乃飾柩設披屬引，徹去遷祖之奠，遷柩向外，而為行始，謂之祖也。婦人降，即位於階間，乃設祖奠於柩西。至厥明，徹祖奠，又設遣奠於柩車之西，然後徹之，苞牲取下體以載之，遂行。此是啟殯之後至柩車出之節也。曾子吊於負夏氏，正當主人祖祭之明旦，既徹祖奠之後、設遣奠之時而來吊，主人榮曾子之來，乃徹去遣奠，更設祖奠。又推柩少退而返之向北，又遣婦人升堂。至明旦，婦人從堂更降，而後乃行遣車禮。從曾子者意以為疑，問曾子云：“此是禮與？”曾子既見主人榮已，不欲指其錯失，為之隱諱雲：“夫祖者，且也。”“且”是未定之辭，祖是行始，未是實行。且去住二者皆得，既得且住，何為不可以反宿，明日乃去？○注“祖謂”至“祖奠”。○正義曰：“祖謂移柩車去載處，為行始”者，案《既夕禮》注云：“束棺於柩車，賓出，遂匠納車於階間。”柩從兩楹卻下，載於車，乃回車南出，是為祖也。祖，始也，謂將行之始也。雲“奠徹謂徹遣奠，設祖奠”者，案《既夕禮》祖曰“明”。旦徹祖奠，設遣奠。曾子正當設遣奠時來，主人乃徹去遣奠，還設祖奠，似若不為遣奠然。經雲“主人既祖”，祖之明日，既徹祖奠之時，故謂之“既祖”。鄭雲“祖謂移柩車去載處”者，解正祖之名也。皇氏、熊氏皆雲，曾子雖今日來吊，遙指昨日為既祖。於文賒緩，其義非也。○注“禮，既祖而婦人降”。○正義曰：《既夕禮》文。以既祖，柩車南出，階間既空，故婦人得降立階間。今柩車反還階間，故婦人闢之升堂。婦人既已升堂，柩車未回南出，則婦人未合降也。今乃降之者，以曾子賢人，欲矜誇賓於此婦人也。言“皆非”者，柩無反而反之，是一非。既反之未回車南出，不合降婦人而降之，是二非也。○注“給說”。○正義曰：《論語》雲：“御人以口給。”謂不顧道理，以捷給說於人也。○“曾子”至“祖者”。○多猶勝也。曾子自知已說之非，聞子游之答是，故善服子游也。故言子游所說出祖之事，勝於我所說出祖也。" }
      - { type: j, text: "曾子襲裘而吊，子游裼裘而吊。曾子指子游而示人曰：“夫夫也，為習於禮者，如之何其裼裘而吊也？”曾子蓋知臨喪無飾。夫夫，猶言此丈夫也。子游於時名為習禮。○裼，星曆反。夫夫，上音扶，下如字，一讀並如字，注及下同。主人既小斂，袒、括髮，子游趨而出，襲裘帶絰而入。於主人變乃變也，所吊者朋友。○袒括，徒旱反，下古活反。曾子曰：“我過矣，我過矣，夫夫是也。”服是善子游。" }
      - { type: z, text: "“曾子”至“是也”。○正義曰：此一節論吊禮得失之事，各依文解之。○“子游趍而出，襲裘帶絰而入”，凡吊喪之禮，主人未變之前，吊者吉服而吊。吉服謂羔裘、玄冠、緇衣、素裳。又袒去上服，以露裼衣，則此“裼裘而吊”是也。主人既變之後，雖著朝服而加武以絰，又掩其上服，若是朋友又加帶，則此“襲裘帶絰而入”是也。案《喪大記》雲：“吊者襲裘，加武，帶絰。”注云：“始死，吊者朝服裼裘，如吉時也。小斂則改襲裘而加武與帶絰矣。武，吉冠之卷也。加武者，明不改冠，但加絰於武。”《喪大記》所云亦據朋友，故云“帶絰”，帶既在腰，鄭注“加武與帶絰”，似帶亦加武者，其實加武唯絰，連言帶耳。主人成服之後，吊者大夫則錫衰，士則疑衰，當事皆首服弁絰。此子游之吊，未知主人小斂以否，何因出則有帶絰服之而入，但子游既及吊喪，豫備其事，故將帶絰行也。" }
      - { type: j, text: "子夏既除喪而見，見於孔子。○見，賢遍反，注及下同。予之琴，和之不和，彈之而不成聲。樂曲人心。○予，羊汝反，下同。和音禾，或胡臥反，下同。樂音嶽，又音洛。作而曰：“哀未忘也，先王制禮，而弗敢過也。”作，起。○忘音亡。子張既除喪而見，予之琴，和之而和，彈之而成聲。作而曰：“先王制禮，不敢不至焉。”雖情異，善其俱順禮。" }
      - { type: z, text: "“子夏”至“至焉”。○正義曰：此一節論子夏、子張居喪順禮之事。此言子夏、子張者，案《家語》及《詩傳》皆言子夏喪畢，夫子與琴，援琴而弦，衎衎而樂；閔子騫喪畢，夫子與琴，援琴而弦，切切而哀，與此不同者，當以《家語》及《詩傳》為正。知者，以子夏喪親無異聞，焉能彈琴而不成聲？而閔子騫至孝之人，故孔子善之雲：“孝哉，閔子騫！”然《家語》、《詩傳》雲：“援琴而弦，切切。”以為正也。熊氏以為子夏居父母之喪異，故不同也。" }
      - { type: j, text: "司寇惠子之喪，惠子，衛將軍文子彌牟之弟惠叔蘭也，生虎者。○彌，亡卑反。牟，莫侯反。子游為之麻衰、牡麻絰。惠子廢適立庶，為之重服以譏之。麻衰，以吉服之布為衰。○為之，於偽反，注“為之重服”、下“為之服”皆同。適，丁歷反，下文及注同。文子辭曰：“子辱與彌牟之弟游，謝其存時。又辱為之服，敢辭。”止之服也。子游曰：“禮也。”文子退反哭。子游名習禮，文子亦以為當然，未覺其所譏。子游趨而就諸臣之位，深譏之，大夫之家臣，位在賓後。文子又辭曰：“子辱與彌牟之弟游，又辱為之服，又辱臨其喪，敢辭。”止之在臣位，子游曰：“固以請。”再不從命。文子退，扶適子南面而立，曰：“子辱與彌牟之弟游，又辱為之服，又辱臨其喪，虎也敢不復位？”覺所譏也。虎，適子名。文子親扶而辭，敬子游也。南面而立，則諸臣位在門內北面明矣。子游趨而就客位。所譏行。" }
      - { type: z, text: "“司寇”至“客位”。○正義曰：此一節論子游譏司寇惠子廢適立庶得行之事，各依文解之。○注“惠子”至“虎者”。○正義曰：案《世本》：“靈公生昭子郢，郢生文子木及惠叔蘭，蘭生虎，為司寇氏。文子生簡子瑕，瑕生衛將軍文氏。”然則彌牟是木之字。○注“為之”至“為衰”。○正義曰：子游既與惠子為朋友，應著吊服，加緦麻帶絰，今乃著麻衰、牡麻絰，故云“重服譏之”。雲“麻衰，以吉服之布為衰”者，案《詩》雲：“麻衣如雪。”又《間傳》雲：“大祥，素縞麻衣。”皆吉服之布稱麻，故知此“麻衰”亦吉服之布也。案《喪服》雲：“公子為其母麻衣。”鄭注云：“小功布深衣者，以大夫之子，為其母厭降大功，則公子為其母厭降宜小功布衰。”與此別也。案吊服，錫衰十五升去其半，疑衰十四升。今子游麻衰，乃吉服十五升，輕於吊服，而云“重服以譏之”者，據牡麻絰，為重吊服。弁絰大如緦之絰，一股而環之。今乃用牡麻絞絰，與齊衰絰同，故云“重”也。○注“深譏”至“賓後”。○正義曰：大夫之賓位在門東近北，大夫之家臣位亦在門東而南近門，並皆北向，故在“向後”也。故盧雲：“喪賓後主人，同在門東，家臣賓後，則近南也。”○注“南面”至“明矣”。○正義曰：然鄭亦不知臣定位，今以此為證，故云“明”矣。子游吊在臣位，適子既鄉南面對子游，故知臣位在門內北面也。案鄭注之意，前既雲“大夫家臣，位在賓後”，則此又云“臣位在門內北面”，則凡賓位在門東，亦得與盧合也。而前《檀弓》雲：“趍而就伯子於門右。注云：“去賓位就主人之兄弟賢者。”若案彼注云，則未趍時賓位應在門左者，以《檀弓》之吊當在小斂前，同國並異國，並在門左。若諸侯禮，大國賓闢寄公，故在門右耳。或雲《檀弓》為異國禮，譏於仲子，故自處異國之賓，故在門西也。" }
      - { type: j, text: "將軍文子之喪。既除喪，而後越人來吊，主人深衣練冠，待於廟，垂涕洟。主人，文子之子簡子瑕也。深衣練冠，凶服變也。待於廟，受吊不迎賓也。○涕音他計反。洟音夷，自目曰涕，自鼻曰洟。瑕音遐，本又作嘏，音古雅反。子游觀之曰：“將軍文氏之子，其庶幾乎！亡於禮者之禮也。其動也中。”中禮之變。○丁仲反，注及下注“禮中”、“之中”同。" }
      - { type: z, text: "“將軍文子之喪”至“其動也中”。○正義曰：此一節論居喪得中禮之變，各依文解之。○將軍文子其身終亡，既除喪，大祥祭之後，越人來吊，謂遠國之人始吊其喪。主人文子之子，身著深衣，是既祥之麻衣也。首著練冠，謂未祥之練冠也。待賓於廟，目垂於涕，鼻垂於洟。“子游觀之曰：將軍文氏之子，其庶幾乎！亡於禮者之禮也”者，亡，無也。其始死至練祥來吊，是有文之禮，祥後來吊，是無文之禮。言文氏之子庶幾堪行乎無於禮文之禮也。所以堪行者，以其舉動也中。當於禮之變節也。○注“主人”至“賓也”。○正義曰：“文子之子簡子瑕也”，知者，《世本》文。雲“深衣練冠，凶服變也”者，深衣即《間傳》麻衣也，但制如深衣。緣之以布曰麻衣，緣之以素曰長衣，緣之以採曰深衣。○“練冠”者，謂祭前之冠，若祥祭則縞冠也。此謂由來未吊者，故練冠。若曾來已吊，祥後為喪事更來，雖不及祥祭之日，主人必服祥日之服以受之。故《雜記》雲：“既祥，雖不當縞者必縞，然後反服。”注云：“謂有以喪事贈賵來者，雖不及時，猶變服，服祥祭之服以受之，重其禮也。其於此時始吊者，則衛將軍文子之子為之。”《雜記》經文本為重來者，故縞冠，衛將軍之子始來者，故練冠，故《雜記》注引此文者，證祥後來吊之事一邊耳。推此而言，禫後始來吊者，則著祥冠。若禫後更來有事，主人則著禫服。其吉祭已後，或來吊者，其服無文。除喪之後，亦有吊法，故《春秋》文九年，“秦人來歸僖公成風之襚”是也。雲“待於廟，受吊不迎賓也”者，以其死者遷入於廟，故今待吊於廟就死者。案《士喪禮》：始死為君命出，小斂以後為大夫出。是有受吊迎賓。今以除服受吊，故不迎賓也。或曰此非已君之命，以敵禮待之，故不迎也。或雲此是禫後吉時來也，故不在寢，而待於廟也。《禮論》亦同。" }
      - { type: j, text: "幼名，冠字，五十以伯仲，死諡，周道也。絰也者，實也。所以表哀戚。○冠，古亂反。掘中霤而浴，毀灶以綴足，及葬，毀宗躐行，出於大門，殷道也。明不復有事於此。周人浴不掘中霤，葬不毀宗躐行。毀宗，毀廟門之西而出，行神之位在廟門之外。○掘，求月反，又求勿反。霤，力救反。綴，丁劣反。又丁衛反。躐，良輒反。復，扶又反。學者行之。學於孔子者行之，傚殷禮。" }
      - { type: z, text: "“幼名”至“行之”。○正義曰：此一節論殷、周禮異之事，各依文解之。○“幼名，冠字”者，名以名質，生若無名，不可分別，故始生三月而加名，故云“幼名”也。○“冠字”者，人年二十，有為人父之道，朋友等類，不可復呼其名，故冠而加字。年至五十耆艾轉尊，又舍其二十之字，直以伯仲別之，至死而加諡。凡此之事，皆周道也。然則自殷以前為字不在冠時，伯仲不當五十，以殷尚質，不諱名故也。又殷以上有生號，仍為死後之稱，更無別諡，堯、舜、禹、湯之例是也。周則死後別立諡，故總雲“周道”也。《士冠禮》二十已有“伯某甫、仲叔季”，此雲“五十以伯仲”者，二十之時，雖雲“伯仲”，皆配“某甫”而言。五十之時，直呼伯仲耳。《禮緯·含文嘉》雲：“質家稱仲，文家稱叔。”周代是文，故有管叔、蔡叔、霍叔、康叔、聃季等，末者稱季是也。○“掘中”至“道也”。○此以下三句明殷禮也。每一條義兼二事也。中霤，室中也，死而掘室中之地作坎。所以然者，一則言此室於死者無用，二則以床架坎上，屍於床上浴，令浴汁入坎，故云“掘中霤而浴”也。○“毀灶以綴足”者，亦義兼二事，一則死而毀灶，示死無復飲食之事，故毀灶也。二則恐死人冷強，足闢戾不可著屨，故用毀灶之甓，連綴死人足，令直可著屨也。○“及葬，毀宗躐行，出於大門”者，亦義兼二事也。“毀宗”，毀廟也。殷人殯於廟，至葬，柩出，毀廟門西邊牆而出於大門。所以然者，一則明此廟於死者無事，故毀之也。二則行神之位在廟門西邊，當所毀宗之外，若生時出行，則為壇幣告行神，告竟，車躐行壇上而出，使道中安穩如在壇。今向毀宗處出，仍得躐此行壇，如生時之出也。故云“毀宗躐行，出於大門”也。○“殷道也”者，道，禮也。上三句皆是殷禮也。○注“明不”至“之外”。○正義曰：此謂中霤、灶、宗，所以掘中霤毀灶及宗，是明不復有事於此處也。雲“周人浴不掘中霤”者，用盤承浴汁也。是以《喪大記》：“浴水用盆，沃水用枓。”沐用瓦盤。鄭注云：“浴沃用枓，沐於盤中，文相變也。”案鄭旨則知浴用盤也。雲“葬不毀宗躐行”者，周殯於正寢，至葬而朝廟，從正門出，不毀宗也。故《士喪禮》不雲“躐行”也。然周家亦不毀灶綴足，而鄭注不雲者，以周綴足用燕几，其文可見，故此不言耳。至於毀宗、躐行、掘中霤，周雖不為，而經文無雲不掘不毀，故鄭注言之也。但舉首末言之，則中從可知也。雲“毀宗，毀廟門之西而出”者，廟門西邊牆也。雲“行神之位，在廟門之外”者，以其毀宗，故云“躐行”，故知行神在廟門之外，當毀處之外也。行神於後更說。" }
