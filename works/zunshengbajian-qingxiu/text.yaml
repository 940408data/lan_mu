sections:
  - id: qingxiu
    name: 清修妙論箋上
    blocks:
      - type: j
        text: 清修妙論箋上
      - type: z
        text: 導：此箋錄養身格言，其旨多出二氏；「攝生尚玄，非崇異也」，先破養生必求奇異之迷。薦語：攝生尚玄、修身正心。
      - type: j
        text: 高子曰：攝生尚玄，非崇異也。三教法門，總是教人修身正心，立身行己，無所欠缺。為聖為賢，成仙成佛，皆由一念做去。
      - type: z
        text: 讀：「攝生尚玄，非崇異也」八字破迷：三教法門總歸修身正心，成聖成佛皆由一念。此箋門戶端正，非奇術之談。
