# 毛詩正義卷1（孔穎達疏）：j 為經文＋毛亨傳、鄭玄箋，z 為疏文。
sections:
  - id: juan1
    name: 正文
    blocks:
      - { type: j, text: "《摽有梅》，男女及時也。召南之國，被文王之化，男女得以及時也。○摽，婢小反，徐符表反。梅，木名也，《韓詩》作“楳”，《說文》“楳亦梅字”。“男女及時也”，本或作“得以及時”者，從下而誤。被，皮寄反。" }
      - { type: z, text: "“《摽有梅》三章，章四句”至“及時”。○正義曰：作《摽有梅》詩者，言男女及時也。召南之國，被文王之化，故男女皆得以及時。謂紂時俗衰政亂，男女喪其配耦，嫁娶多不以時。今被文王之化，故男女皆得以及時。俗本“男女”下有“得以”二字者，誤也。毛以卒章雲三十之男、二十之女為蕃育法，二章為男年二十八九、女年十八九，首章謂男年二十六七、女年十六七，以梅落喻男女年衰，則未落宜據男年二十五、女年十五矣，則毛以上二章陳年盛正昏之時，卒章蕃育法雖在期盡，亦是及時。《東門之楊》傳雲“不逮秋冬”，則毛意以秋冬皆得成昏。孫卿曰：“霜降逆女，冰泮殺止。”霜降，九月也。冰泮，正月也。孫卿，毛氏之師，明毛亦然，以九月至正月皆可為昏也。又《家語》曰：“霜降而婦功成，而嫁娶者行焉。冰泮農業起，昏禮殺於此。”又云：“冬合男女，春班爵位。”《邶詩》曰：“士如歸妻，迨冰未泮。”是其事也。其《周禮》言仲春，《夏小正》言二月者，皆為期盡蕃育之法。《禮記》雲“二十曰弱冠”，又曰“冠，成人之道”，成人乃可為人父矣。《喪服》傳曰“十九至十六為長殤”，禮子不殤父，明男二十為初娶之端。又《禮記》曰“女子十五許嫁而笄”，以十五為成人，許嫁不為殤，明女十五為初昏之端矣。王肅述毛曰：“前賢有言，丈夫二十不敢不有室，女子十五不敢不事人。”譙周亦云：“是故男自二十以及三十，女自十五以至二十，皆得以嫁娶。先是則速，後是則晚矣。凡人嫁娶，或以賢淑，或以方類，豈但年數而已。”此皆取說於毛氏矣。然則男自二十以至二十九，女自十五以至十九，皆為盛年，其昏，自季秋至於孟春，惟其所用，不限其月。若男三十、女二十為期盡蕃育，雖仲春猶可行，即此卒章是也。又男女之昏，為賢淑與方類，但男年二十以後，女年十五以後，隨任所當，嘉好則成，不必要以十五六女配二十一二男也。雖二十女配二十之男，三十之男配十五之女，亦可也。傳言三十之男，二十之女，據其並期盡者，依《周禮》文為正。鄭據《周禮》仲春為昏是其正。此序雲“男女得以及時”，言及者，汲汲之辭，故三章皆為蕃育之法，非仲春也。上二章陳及夏行嫁，卒章言夏晚大衰，不復得嫁，待明年仲春，亦是及時也。以梅實喻時之盛衰，不以喻年。若梅實未落，十分皆在，喻時未有衰，即仲春之月是也。此經所不陳。既以仲春之月為正，去之彌遠則時益衰，近則衰少，衰少則梅落少，衰多則似梅落多，時不可為昏則似梅落盡。首章“其實七兮”，謂在樹者七，梅落仍少，以喻衰猶少，謂孟夏也。以去春近，仍為善時，故下句言“迨其吉兮”，欲及其善時也。二章言“其實三兮”，謂在者唯三，梅落益多，謂仲夏也。過此則不復可嫁，故云“迨其今兮”。今，急辭，恐其過此，故急也。又卒章“頃筐塈之”，謂梅十分皆落，梅實既盡，喻去春光遠，善亦盡矣，謂季夏也。不可復昏，待至明年仲春，故下句雲“迨其謂之”。箋雲“女年二十而無嫁端，則有勤望之憂，明年仲春，不待以禮會之。時禮雖不備，相奔不禁”。由季夏時盡，故至明年也。季春亦非正時，箋不以首章當之者，以四月五月與春接連，猶可以嫁，三月則可以嫁明矣。六月則為晚。此篇三章，宜一章興一月，故以首章為初夏，二章為向晚，此得以及時，宜舉末以言之，故不以為季春也。所以於五月得為昏，至六月則不可者，以四月五月去春未一時，故可強嫁，故季夏，去春遠矣，故不得為昏。知待至明年春者，《周禮·媒氏》“仲春之月，奔者不禁”，故知明年得行也。鄭以仲春為昏月，故《行露》、《野有蔓草》皆引《周禮》“仲春之月，令會男女之無夫家者”。又《夏小正》“二月，綏多女士”，下雲“有女懷春”，故以仲春為昏月也。此首章箋雲女年二十，則依《周禮》、《書傳》、《穀梁》、《禮記》皆言男三十而娶，女二十而嫁，故不從毛傳。且女子十五，正言許嫁，不言即嫁也。《越語》曰：“女子十七不嫁，丈夫二十不娶，父母有罪。”越王謂欲報吳之故，特下此令。又若女年皆十五而嫁，越王欲速為昏，何由乃下十七之期乎？又諸經傳所以皆雲三十、二十，都不言正嫁娶之年，而皆為期盡也。孫卿《家語》未可據信，故據《周禮》三十之男，二十之女，昏用仲春也。案《異義》“人君年幾而娶？今《大戴禮》說男子三十而娶，女子二十而嫁，天子巳下及庶人同禮；又《左傳》說人君十五生子，禮，三十而娶，庶人禮也。謹案：舜生三十不娶，謂之鰥；《禮·文王世子》曰“文王十五生武王，武王有兄伯邑考”，故知人君早昏，所以重繼嗣。鄭玄不駁，明知天子諸侯十二而冠，冠而生子。大夫以下，明從庶人法也。《行露》之篇，女以多露拒男，此四月、五月而云猶可嫁者，《鄭志》答張逸雲：“《行露》以正言也，《標有梅》以蕃育人民。”然則《行露》為不從男，故以禮拒之；此為有故，不及正時許之，所以蕃育人民故也。《綢繆》首章“三星在天”，箋雲：“三月之末，四月之中。”二章“三星在隅”，箋雲：“四月之末，五月之中。”卒章“三星在戶”，箋雲：“五月之末，六月之中。”與此三章之喻大同。彼雲“不得其時”，此雲“及時”者，此文王之化，有故不得以仲春者，許之，所以蕃育人民。彼正時不行，故為違禮。事同意異，故美刺有殊。" }
      - { type: j, text: "摽有梅，其實七兮。興也。摽，落也。盛極則隋落者，梅也。尚在樹者七。箋雲：興者，梅實尚餘七未落，喻始衰也。謂女二十，春盛而不嫁，至夏則衰。○隋，迨果反，又徒火反。求我庶士，迨其吉兮。吉，善也。箋雲：我，我當嫁者。庶，眾。迨，及也。求女之當嫁者之眾士，宜及其善時。善時謂年二十，雖夏未大衰。○迨音待，《韓詩》雲：“顧也。”" }
      - { type: z, text: "“摽有”至“吉兮”。○毛以為隋落者是有梅，此梅雖落，其實十分之中，尚在樹者七，其三始落，是梅始衰，興女年十六七，亦女年始衰，求女之當嫁者之眾士，宜及其此善時以為昏。比十五為衰，對十八九故為善，此同興男女年，舉女年則男年可知矣。○鄭以梅落興時衰為異，言閜落者是有梅，此梅雖落，其實十分之中尚七未落。已三分落矣，而在者眾，以興漸衰者善時。此時雖衰，其十分之中尚七分未衰，唯三分衰耳，而善者猶多，謂孟夏之月初承春後，仍為善時，求我當嫁者之眾士，宜及孟夏善時以承昏事。○箋“梅實”至“始衰”。○正義曰：箋知不以梅記時者，以序雲“男女得以及時”，而經有三章，宜一章喻一月。若為記時，則梅已有落，不久則盡，“其實七兮”與“頃筐塈之”正同一月，非本歷陳及時之意，故為喻也。○箋“我，我當嫁者”。○正義曰：言此者，以女被文王之化，貞信之教興，必不自呼其夫，令及時之取己。鄭恐有女自我之嫌，故辨之，言我者，詩人我，此女之當嫁者，亦非女自我。" }
      - { type: j, text: "摽有梅，其實三兮。在者三也。箋雲：此夏鄉晚，梅之隋落差多，在者餘三耳。○鄉，本亦作“鄉”，又作“向”，同，許亮反。差，初賣反。求我庶士，迨其今兮。今，急辭也。" }
      - { type: j, text: "摽有梅，頃筐塈之。塈，取也。箋雲：頃筐取之，謂夏已晚，頃筐取之於地。○頃音傾。塈，許器反。求我庶士，迨其謂之。不待備禮也。三十之男，二十之女，禮未備則不待禮會而行之者，所以蕃育民人也。△箋雲：謂勤也。女年二十而無嫁端，則有勤望之憂。不待禮會而行之者，謂明年仲春，不待以禮會之也。時禮雖不備，相奔不禁。○蕃音煩。禁，居鴆反，一音金。" }
      - { type: z, text: "“摽有”至“謂之”。○毛以為隋落者是有梅，此梅落盡，故以頃筐取之，以興女年二十，顏色甚衰，而用蕃育之禮以取之，求我當嫁者之眾士，宜及其此時而謂之以成昏。謂者，以言謂女而取之，不待備禮。○鄭以隋落者是梅，此梅落盡，故頃筐取之於地，以興漸衰者善時，此善時已盡，故待至明年仲春，以時已過，不可復昏故也。求我當嫁者之眾士，宜及明年仲春，女勤望之時，謂女年二十而不嫁，至明年仲春則有勤望之憂，宜及此時取之。○傳“不待”至“民人”。○正義曰：傳先言不待備禮者，解“謂之”之意。所以得謂之而成昏者，由不待備禮故也。又解不待備禮之意，言三十之男，二十之女，禮雖未備，年期既滿，則不待禮會而行之，所以藩育民人也。謂多得成昏，令其有子，所以蕃息生育人民，使之眾多。○箋“不待”至“不禁”。○正義曰：傳意三十之男，二十之女，其年仲春即不待禮會而行之。故鄭易之，言“不待禮會而行之”，謂明年仲春，如不待禮會之也。又稱不待禮者，禮雖不備，相奔不禁，即《周禮》“仲春之月，令會男女於是時也，相奔者不禁”，是也。" }
      - { type: j, text: "《摽有梅》三章，章四句。" }
      - { type: j, text: "《小星》，惠及下也。夫人無妒忌之行，惠及賤妾，進御於君，知其命有貴賤，能盡其心矣。以色曰妒，以行曰忌。命謂禮命貴賤。○行，下孟反，注同。盡，津忍反，後放此。" }
      - { type: z, text: "“《小星》二章，章五句”至“其心矣”。○正義曰：作《小星》詩者，言夫人以恩惠及其下賤妾也。由夫人無妒忌之行，能以恩惠及賤妾，令得進御於君，故賤妾亦自知其禮命與夫人貴賤不同，能盡其心以事夫人焉。言夫人惠及賤妾，使進御於君，經二章上二句是也。眾妾自知卑賤，故抱衾而往御，不當夕，下三句是也。既荷恩惠，故能盡心述夫人惠下之美，於經無所當也。此賤妾對夫人而言，則總指眾妾媵與侄娣皆為賤妾也。《曲禮下》雲“公侯有妾”，謂在九女之外，若內司服、女御。注以衣服進者，彼暫時之事，不得次序進御，明不在此賤妾之中。○箋“命謂禮命貴賤”。○正義曰：命謂貴賤者，夫人禮命貴，與君同，故稱曰小君。眾妾則賤，故《喪服》注云：“貴者視卿，賤者視大夫也。”妾之貴者，夫人侄娣也，即《喪服》所謂“貴臣賤妾”也。《左氏》皆言以夫人之侄娣為繼室，明其貴也。何休雲：“夫人無子，立右媵之子。右媵無子，立左媵之子。”以二媵為貴，與禮不合，故《韓奕》箋獨言娣，舉其貴者，是侄娣貴於媵之義。" }
      - { type: j, text: "嘒彼小星，三五在東。嘒，微貌。小星，眾無名者。三，心。五，噣。四時更見。箋雲：眾無名之星，隨心、噣在天，猶諸妾隨夫人以次序進御於君也。心在東方，三月時也。噣在東方，正月時也。如是終歲列宿更見。○嘒，呼惠反。噣，張救反，又都豆反，《爾雅》雲：“噣謂之柳。”更音庚，下同。見，賢遍反，下同。宿音秀。肅肅宵征，夙夜在公。寔命不同！肅肅，疾貌。宵，夜。徵，行。寔，是也。命不得同於列位也。箋雲：夙，早也。謂諸妾肅肅然夜行，或早或夜，在於君所，以次序進御者，是其禮命之數不同也。凡妾御於君，不當夕。○寔，時職反，《韓詩》作“實”，雲“有也”。" }
      - { type: z, text: "“嘒彼”至“不同”。○正義曰：言嘒然微者，彼小星。此星雖微，亦隨三星之心、五星之噣以次列在天，見於東方，以興禮雖卑者，是彼賤妾雖卑，亦隨夫人以次序進御於君所，由夫人不妒忌，惠及故也。眾妾自知己賤，不敢同於夫人，故肅肅然夜行，或早或夜，在於君所。夜來早往，或夜往而早來，不敢當夕，是禮命之數不得同於夫人故也。○傳“嘒彼”至“更見”。○正義曰：此言小星，故為微貌。《雲漢》傳曰“嘒，星貌”者，以宣王仰視，不止小星，故直言星貌，兼大星皆在也。嘒之為貌，不甚大明，比於日月為小，故大星小星皆得為小貌。知三為星者，下章雲“維參與昴”，昴不五星，則五非下章之昴也。五既非昴，則三亦非參，列宿之大，房、心、參伐，三既非參，而心亦三星，故知三謂心也。《綢繆》傳曰“三星，參也”者，以其剌昏姻不得其時，舉正時以刺之。冬日之昏，在天在戶，唯參為然，故知非心也。三星在罶皆為心，心實三星，而傳不明說，蓋從此為心，以其心稱三為正，故此稱三以對參也。箋則三皆為心，以其心實三星，而列宿之尊，故《元命苞》曰“心為天王”，《公羊》又云“心為大辰”，故言三星。此及《綢繆》、《苕之華》皆雲心也。知五是噣者，《元命苞》雲“柳五星”，《釋天》雲“咮謂之柳”，《天文志》曰“柳謂鳥喙”，則喙者，柳星也。以其為鳥星之口，故謂之喙。心，東方之宿；柳，南方之宿，著明者，故以比夫人也。言四時更見者，見連言在東，恐其俱時在東，故云四時之中更迭見之。○箋“眾無”至“更見”。○正義曰：經言“在東”，箋雲“在天”者，在東據初見之方，此不取所見之方為義，直取星之在天，似婦人之進於夫，故變言在天。《綢繆》言“三星在天”，傳曰“見於東方”者，彼取記候，須所在之方為義，故變言在東。經取其韻，注說其義，故皆反其經也。又心在東方，三月時；喙在東方，正月時，是不同時見也。二者同在春見，但異月耳。雲四時者，如是終歲列宿更見，因明二十八宿更迭而見，不止於心、喙也。○傳“命不得同於列位”。○正義曰：雖同事於君，夫人貴而妾賤，禮命之數不得同於行列等位。○箋“諸妾”至“當夕”。○正義曰：《書傳》曰：“古者，後夫人將侍君，前息燭，後舉燭，至於房中，釋朝服，襲燕服，然後入御於君。雞鳴，大師奏《雞鳴》於階下，然後夫人鳴佩玉於房中，告去。”由此言之，夫人往來舒而有儀，諸妾則肅肅然夜而疾行，是其異也。言或早或夜在於君所者，謂諸妾夜晚始往，及早來也，亦異於夫人也。或以為早謂夜初，妾有貴賤，往有早晚。知不然者，以其詩言“夙夜”者，皆記昏為夜，晨初為早，未有以初昏為夙者。又序雲“知其命有貴賤”，與此“寔命不同”一也。明此亦不同於夫人，非妾中自不同也。言“凡妾御於君，不當夕”者，解所以夜晚乃往之意。由妾御於君，不當夕故也。《內則》雲：“妻不在，妾御莫敢當夕。”注云：“避女君之御日。”與此不同者，彼妻不在，妾不往御，此自往御之時，不敢當夕而往。文取於彼，義隨所證，亦斷章之義也。" }
      - { type: j, text: "嘒彼小星，維參與昴。參，伐也。昴，留也。箋雲：此言眾無名之星，亦隨伐、留在天。○參，所林反，星名也，一名伐。昴音卯，徐又音茅，一名留。二星皆西方宿也。留如字，又音柳，下同。" }
      - { type: z, text: "傳“參，伐。昴，留”。○正義曰：《天文志》雲：“參，白虎宿。三星直。下有三星，旒曰伐。其外四星，左右肩股也。”則參實三星，故《綢繆》傳曰：“三星，參也。”以伐與參連體，參為列宿，統名之，若同一宿然。但伐亦為大星，與參互見，皆得相統，故《周禮》“熊旂六旒以象伐”，注云：“伐屬白虎宿，與參連體，而六星言六旒，以象伐。”明伐得統參也。是以《演孔圖》雲“參以斬伐”，《公羊傳》曰“伐為大辰”，皆互舉相見之文也，故言“參，伐也”，見同體之義。《元命苞》元“昴六星，昴之為言留，言物成就係留”，是也。彼昴留為一，則參伐明亦為一也。" }
      - { type: j, text: "肅肅宵征，抱衾與裯。寔命不猶！衾，被也。裯，襌被也。猶，若也。箋雲：裯，床帳也。諸妾夜行，抱衾與床帳，待進御之，次序不若，亦言尊卑異也。○衾，起金反。裯，直留反，徐雲：“鄭音直俱反。”帳，張仗反。" }
      - { type: z, text: "傳“衾，被。裯，襌被”。○正義曰：《葛生》曰“錦衾爛兮”，是衾為臥物，故知為被也。今名曰被，古者曰衾，《論語》謂之寢衣也。以衾既是被，裯亦宜為臥物，故為襌被也。○箋“裯，床帳”。○正義曰：鄭以衾既為被，不宜復雲襌被也。漢世名帳為裯，蓋因於古，故以為床帳。《鄭志》張逸問：“此箋不知何以易傳？又諸妾抱帳，進御於君，有常寢，何其碎？”答曰：“今人名帳為裯，雖古無名被為裯。諸妾何必人抱一帳？施者因之，如今漢抱帳也。”是鄭之改傳之意，雲“施者因之”。《內則》注云：“諸侯取九女，侄娣兩兩而御，則三日也。次兩媵，則四日也。次夫人專夜，則五日也。”是五日之中，一夜夫人，四夜媵妾。夫人御後之夜，則次御者抱衾而往。其後三夜，御者因之，不復抱也。四夜既滿，其來者又抱之而還，以後夜夫人所專，不須帳也。所施帳者，為二人共侍於君，有須在帳者。妾往必二人俱往，不然不須帳，故天子九嬪以下，九人一夜，明九人更迭而往來矣。其御，望前先卑，望後先尊，宜二媵下侄娣畢，次二媵，次夫人。下侄娣次夫人。望後乃反之。則望前最賤，妾抱帳往，貴者抱之還。望後，貴者抱之往，賤者抱之還。帳為諸妾而有，異於夫人也。" }
      - { type: j, text: "《小星》二章，章五句。" }
      - { type: j, text: "《江有汜》，美媵也。勤而無怨，嫡能悔過也。文王之時，江沱之閒，有嫡不以其媵備數，媵遇勞而無怨，嫡亦自悔也。勤者，以已宜媵而不得，心望之。○汜音祀，江水名。媵音孕，又繩證反。古者諸侯娶夫人，則同姓二國媵之。嫡，都狄反，正夫人也，下同。沱，徒何反，江水之別也，篇內同。" }
      - { type: z, text: "“《江有汜》三章，章五句”至“自悔”。○正義曰：作《江有汜》詩者，言美媵也。美其勤而不怨，謂宜為媵而不得行，心雖勤勞而不怨於嫡，故嫡亦能自悔過，謂悔其不與俱行也。當文王之時，江、沱之間，有嫡不以其媵備妾御之數，媵遇憂思之勞而無所怨，而嫡有所思，亦能自悔過也。此本為美媵之不怨，因言嫡之能自悔，故美媵而後兼嫡也。嫡謂妻也。媵謂妾也。謂之媵者，以其從嫡，以送為名，故《士昏禮》注云：“媵，送也。”古者女嫁必侄娣從，謂之媵也。《士昏禮》雲：“雖無娣，媵先。”言若或無娣，猶先侄媵，是士有娣，娣但不必備耳。《喪大記》“大夫撫侄娣”，是大夫有侄娣矣。《公羊傳》曰：“諸侯一取九女，二國媵之。”所從皆名媵，獨言二國者，異國主為媵，故特名之。其實，雖夫人侄娣亦為媵也。此言嫡媵，不指其諸侯大夫及士庶，雖文得兼施，若夫人，宜與《小星》同言夫人。此直雲“有嫡”，似大夫以下，但無文以明之。媵之行否，所由嫡者，嫡尊專妒，抑之而不得行，後思之而悔也。勤、勞一也，勤者，心企望之，望之而不得，所以成勞，故云“遇勞”也。不以其媵備數，經三章次二句是也。嫡亦自悔，皆卒句是也。首章一句，為下而設。遇勞不怨，經無所當，稱美媵之本心耳。" }
      - { type: j, text: "江有汜，興也。決復入為汜。箋雲：興者，喻江水大，汜水小，然而並流，似嫡媵宜俱行。○決，古穴反，又音穴。復，扶福反。並，白猛反，又步頂反。之子歸，不我以。不我以，其後也悔。嫡能自悔也。箋雲：之子，是子也。是子，謂嫡也。婦人謂嫁曰歸。以猶與也。" }
      - { type: z, text: "“江有”至“也悔”。○正義曰：江水大，似嫡；汜水小，似媵。言江之有汜，得並流，以興嫡之有媵，宜俱行。言是子嫡妻往歸之時，不共我以俱行，由不以我俱去，故其後也悔。○傳“決復入為汜”。正義曰：《釋水》文也。此毛解汜之狀，其興與鄭同，知毛不以興夫人初過而後悔者，以後悔之文下章自見，故不解。" }
      - { type: j, text: "江有渚，渚，小洲也，水岐成渚。箋雲：江水流而渚留，是嫡與己異心，使已獨留不行。○渚，諸呂反，《韓詩》雲：“一溢一否曰渚。”“渚，小洲也”，本或無此注。“水岐”如字，何音其宜反，又音祗。之子歸，不我與。不我與，其後也處。處，止也。箋雲：嫡悔過自止。" }
      - { type: j, text: "江有沱，沱，江之別者。箋雲：岷山道江，東別為沱。○岷，本又作“頠”，武巾反，山名，在蜀。道，徒報反，本亦作“導”，下篇注同。之子歸，不我過。不我過，其嘯也歌。箋雲：嘯，蹙口而出聲。嫡有所思而為之，既覺自悔而歌。歌者，言其悔過，以自解說也。○過音戈，下文同。嘯，蕭叫反，沈蕭妙反。蹙，子六反，本亦作“蹴”。解，革買反，又閒買反。說，始拙反，又音悅。" }
      - { type: j, text: "《江有汜》三章，章五句。" }
      - { type: j, text: "《野有死麕》，惡無禮也。天下大亂，強暴相陵，遂成淫風。被文王之化，雖當亂世，猶惡無禮也。無禮者，為不由媒妁，雁幣不至，劫脅以成昏，謂紂之世。○麕，本亦作“麏”，又作“麇”，俱倫反。麏，獸名也。《草木疏》雲：“麏，獐也，青州人謂之麏。”惡，烏路反，下同。被，皮寄反。劫脅，上居業反，下許業反。" }
      - { type: z, text: "“《野有死麕》三章，二章章四句，一章三句”至“惡無禮”。○正義曰：作《野有死麕》詩者，言“惡無禮”，謂當紂之世，天下大亂，強暴相陵，遂成淫風之俗。被文王之化，雖當亂世，其貞女猶惡其無禮。經三章皆惡無禮之辭也。○箋“無禮”至“紂之世”。○正義曰：經言“吉士誘之”，女思媒氏導之，故知不由媒妁也。思其麕肉為禮，故知雁幣不至也。欲令舒而脫脫兮，故知劫脅以成昏也。箋反經為說，而先媒後幣，與經倒者，便文，見昏禮先媒。經主惡無禮，故先思所持之物也。或有俗本以“天下大亂”以下同為鄭注者，誤。定本、《集註》皆不然。" }
      - { type: j, text: "野有死麕，白茅包之。郊外曰野。包，裹也。凶荒則殺禮，猶有以將之。野有死麕，群田之獲而分其肉。白茅，取絜清也。箋雲：亂世之民貧，而強暴之男多行無禮，故貞女之情，欲令人以白茅裹束野中田者所分麕肉為禮而來。○包，逋茅反。裹音果。殺，所戒反，徐所例反。清如字，沈音淨。令，力呈反。有女懷春，吉士誘之。懷，思也。春，不暇待秋也。誘，道也。箋雲：有貞女思仲春以禮與男會，吉士使媒人道成之。疾時無禮而言然。○誘音酉。" }
      - { type: z, text: "“野有”至“誘之”。○毛以為皆惡無禮之辭也。言凶荒則殺禮，猶須禮以將之，故貞女欲男於野田中有死麕之肉，以白茅裹之為禮而來也。既欲其禮，又欲其及時，故有貞女思開春以禮與男會，不欲過時也。又欲令此吉士，先使媒人導成之，不欲無媒妁而自行也。○鄭唯“懷春”為異，言思仲春正昏之時，以禮與男會也。餘與毛同。言“春”，據成昏之時。“吉士誘之”，乃於納采之先，在春前矣。但以昏時為重，故先言“懷春”也。此詩所陳，皆是女之所欲，計有女懷春之文，應最在上。但昏禮主於交接，春是合昏之時，故以女懷配春為句，見春是所思之主。其實裹束麕肉亦是女之所思，故箋雲貞女之情，欲令以白茅裹束死麕肉為禮而來，是也。○傳“凶荒”至“絜清”。○正義曰：解以死麕之意。昏禮五禮用雁，唯納徵用幣，無麕鹿之肉。言死麕者，凶荒則殺禮，謂減殺其禮，不如豐年也。禮雖殺，猶須有物以將行之，故欲得用麕肉也。此由世亂民貧，故思以麕肉當雁幣也。故《有狐序》曰“古者凶荒，則殺禮多昏”。《司徒》“以荒政十有二聚萬民，十曰多昏”，鄭司農雲“多昏，不備禮而昏，娶者多”，是也。傳文解野中所以有死麕者，由群聚於田獵之中，獲而分得其肉。《繢人》注云“齊人謂麕為獐”，則麕是獐也。必以白茅包之者，由取其絜清也。《易》曰：“藉用白茅，無咎。”傳曰“爾貢包茅不入，王祭不供，無以縮酒，以供祭祀”，明其絜清。○傳“春，不暇待秋”。正義曰：傳以秋冬為正昏，此雲春者，此女年二十，期已盡，不暇待秋也。此思春，思開春，欲其以禮來。若仲春，則不待禮會而行之，無為思麕肉矣。此女惡其無禮，恐其過晚，故舉春而言。其實往歲之秋冬，亦可以為昏矣。《釋詁》雲：“誘，進也。”《曲禮》注“進客謂導之”，明進、導一也，故以誘為導也。。○箋“有貞”至“言然”。正義曰：箋以仲春為昏時，故知貞女思仲春之月以禮與男會也。言吉士誘之者，女欲令吉士使媒人導達成昏禮也。疾時無媒，故言然也。言“懷春”，自思及時與男會也。言“誘之”，自吉士遣媒也，非謂仲春之月始思遣媒。何者？女十五許嫁，已遣媒以納采，二十仲春始親迎，故知非仲春月始思媒也。吉士者，善士也，述女稱男之意，故以善士言之。“士如歸妻”，“求我庶士”，皆非女所稱，故不言吉。《卷阿》雲“用吉士”，謂朝廷之士有善德，故稱吉士也。" }
      - { type: j, text: "林有樸樕，野有死鹿。白茅純束，樸樕，小木也。野有死鹿，廣物也。純束，猶包之也。箋雲：樸樕之中及野有死鹿，皆可以白茅包裹束以為禮，廣可用之物，非獨麕也。純讀如屯。○樸，蒲木反，又音僕。樕音速。純，徒本反，沈雲：“鄭徒尊反。”屯，舊徒本反，沈徒尊反，雲：“屯，聚也。”有女如玉。德如玉也。箋雲：如玉者，取其堅而絜白。" }
      - { type: z, text: "“林有”至“如玉”。○正義曰：言凶荒殺禮，非直麕肉可用，貞女又欲男子於林中有樸樕小木之處，及野之中有群田所分死鹿之肉，以白茅純束而裹之，以為禮而來也。由有貞女，堅而絜白，德如玉然，故惡此無禮，欲有以將之。○傳“樸樕，小木”。○正義曰：《釋木》雲：“樸樕，心。”某氏曰：“樸樕，斛樕也，有心能溼，江河間以作柱。”孫炎曰：“樸樕一名心。”是樸樕為木名也。言小木者，以林有此木，故言小木也。“林有樸樕”，謂林中有樸樕之木也，故箋雲“樸樕之中及野有死鹿”，不言林者，則林與樸樕為一也。知不別者，以樸樕，木名，若一木，不得有死鹿；若木眾，即是林矣，不得林與樸樕並言也。且下雲有死鹿，言有，足得蒙林，林下之有，不為鹿施，明是林中有樸樕之處也。樸樕與林不別，《正月》箋雲：“林中大木之處。”此小木得為林者，謂林中有此小木，非小木獨為林也。此宜云“林中小木之處”。○箋“純讀如屯”。○正義曰：“純讀為屯”者，以純非束之義，讀為屯，取肉而裹束之，故傳雲“純束，猶包之”。○箋“如玉”至“絜白”。○正義曰：此皆比白玉，故言堅而絜白。《弁師》雲“五采玉”，則非一色。獨以白玉比之者，比其堅而絜白，不可汙以無禮。《小戎》箋雲“玉有五德”，不雲堅而絜白者，以男子百行，不可止貞絜故也。" }
      - { type: j, text: "舒而脫脫兮！舒，徐也。脫脫，舒遲也。箋雲：貞女欲吉士以禮來，脫脫然舒也。又疾時無禮，強暴之男相劫脅。○脫，敕外反，注同。無感我帨兮，感，動也。帨，佩巾也。箋雲：奔走失節，動其佩飾。○感如字，又胡坎反。帨，始銳反，沈始悅反。無使尨也吠！尨，狗也。非禮相陵則狗吠。○尨，美邦反。吠，符廢反。" }
      - { type: z, text: "“舒而”至“也吠”。○正義曰：此貞女思以禮來，惡其劫脅。言吉士當以禮而來，其威儀舒遲而脫脫兮，無動我之佩巾兮，又無令狗也吠。但以禮來，我則從之。疾時劫脅成昏，不得安舒，奔走失節，動其佩巾，其使尨也吠，己所以惡之，是謂惡無禮也。○傳“脫脫，舒遲”。○正義曰：脫脫，舒鷃之貌。不言貌者，略之。《采蘩》傳曰“僮僮，竦敬。祁祁，舒遲”，亦略而不言貌。定本“脫脫，舒貌”，有貌字，與俗本異。○傳“帨，佩巾”。○正義曰：《內則》雲子事父母，婦事舅姑，皆雲“左佩紛帨”。注云：“帨，拭物之巾。”又曰“女子設帨於門右”。然則帨者是巾，為拭物，名之曰帨紛，其自佩之，故曰佩巾。○傳“尨狗”至“狗吠”。○正義曰：“尨，狗”，《釋畜》文。李巡曰：“尨一名狗。”非禮相陵，主不迎客，則有狗吠。此女原其禮來，不用驚狗，故《鄭志》答張逸雲“正行昏禮，不得有狗吠”，是也。" }
      - { type: j, text: "《野有死麕》三章，二章四句，一章三句。" }
      - { type: j, text: "《何彼襛矣》，美王姬也。雖則王姬亦下嫁於諸侯，車服不系其夫，下王后一等，猶執婦道，以成肅雝之德也。下王后一等，謂車乘厭翟，勒面繢裛，服則褕翟。○襛，如容反，《韓詩》作“茙”。茙音戎，《說文》雲：“衣厚貌。”王姬音基。王姬，武王女。姬，周姓也。杜預雲：“王姬以上為尊。”“雖王姬”，一本作“雖則王姬”。車音居，他皆放此。《釋名》雲：“古者曰車聲如居，所以居人也。”今曰車音尺奢反，雲舍也，韋昭曰：“古皆音尺奢反，從漢以來，始有居音。”系，本或作“繼”。下王，遐嫁反，注同。厭，於葉反。翟，庭歷反。厭翟，王后五路之第二者也。翟，雉也，次其羽相迫，故曰厭也。繪，本又作“繢”，戶妹反，畫文也。糹忽，作孔反。褕翟音遙翟，或作狄，王后六服之第二也。" }
      - { type: z, text: "“《何彼襛矣》三章，章四句”至“之德”。正義曰：作《何彼襛矣》詩者，美王姬也。以其雖則王姬，天子之女，亦下嫁於諸侯。其所乘之車，所衣之服，皆不系其夫為尊卑，下王后一等而已。其尊如是，猶能執持婦道，以成肅敬雍和之德，不以已尊而慢人。此王姬之美，即經雲“曷不肅雍，王姬之車”是也。定本“雖王姬”無“則”字。此詩主美肅雍之德，因言顏色之美。以善道相求之事，敘者本其作意，略不言耳。王姬者，王女而姬姓。《春秋》“築王姬之館於外”，杜預雲“不稱字，以王為尊”是也。言“雖則王姬亦下嫁於諸侯”者，以諸侯之女嫁於諸侯，是其常令，雖則王姬之尊，亦下嫁於諸侯，亦謂諸侯主也。然上無二王，王姬必當嫁於諸侯，言“雖則”者，欲美其能執婦道，故言“雖則”，為屈尊之辭。言下嫁於諸侯，雖嫁於王者之後，亦是也。《禮記》注云：“周女因魯嫁卒服之，如內女，天子為之無服。嫁於王者之後，乃服之。”則王姬嫁於王者之後，似非下嫁。言王姬必下嫁者，必二王之後，通天三統，自行正朔，有與天子敵義。其實列土諸侯，不得純敵天子，亦為下嫁也。因姑姊妹女子有恩，二王后有敵義，故服之，非實敵也。若二王之後嫁女於諸侯，爵雖尊，非下嫁也，故魯之孝惠娶於商，及宋人來媵，皆無異於諸侯也。然得行禮樂，唯祭為然也。此王姬體王之尊，故下王后一等，不系夫之尊卑。唯二王后之夫人，得與王后同，亦降一等，不系於夫也。此時齊侯子未為諸侯，若為諸侯，其夫人車服自當下王后一等，要本王姬車服不為系於夫也。天子尊無二上，故其女可下王后一等。若諸侯之女下嫁，則各從夫之爵，不得下其母一等也。何休雲：“天子嫁女於諸侯，備侄娣，如諸侯禮義。不可以天子之尊，絕人繼嗣之路。”皇甫謐雲：“武王五男二女，元女妻胡公，王姬宜為媵，今何得適齊侯之子？何休事無所出，未可據信也。或以尊，故命同族為媵。”○箋“下王后”至“褕翟”。○正義曰：王后五路，重翟為上，厭翟次之。六服，褘衣為上，褕翟次之。今言下王后一等，故知車乘厭翟，服則褕翟也。《巾車職》雲：“王后之五路：重翟，鍚面朱裛；厭翟，勒面繢裛；安車，彫面鷖裛；皆有容蓋。”注云：“重翟，重翟雉之羽也。厭翟，次其羽使相迫也。勒面，謂以如玉龍勒之韋為當面飾也。雕者，畫之，不龍其韋。安車，坐乘車，凡婦人車皆坐乘。鄭司農雲：鍚馬，面鍚也。鷖裛者，青黑色，以繒為之，裛著馬勒，直兩耳與兩鑣。容謂幨車，山東謂之裳幃，或曰潼容，玄謂朱裛、繢裛。其施之如鷖裛，車衡輨亦宜有焉。繢，畫文也。蓋，如今小車蓋也。皆有容有蓋，則重翟、厭翟謂蔽也。重翟，後從王祭祀所乘。厭翟，後從王賓饗諸侯所乘。安車無蔽，後朝見於王所乘，謂去飾也。《詩·國風·碩人》曰‘翟蔽以朝’，謂諸侯夫人始來，乘翟蔽之車，以朝見於君，以盛之也。此翟蔽，蓋厭翟也。然則王后始來乘重翟矣。”《巾車》又云：“翟車，貝面組裛，有握；輦車，組輓，有翣，羽蓋。”注云“翟車以出桑，輦車宮中所乘”。此王后五等車所用也。其諸侯之夫人始嫁及常乘之車則無文，說者各為其見。崔靈恩以為，二王之後夫人各乘本國先王之上車，魯之夫人乘重翟。知者，以魯夫人服褘衣，與王后同，故知車亦同也。其同姓異姓侯伯夫人皆乘厭翟，子男夫人乘翟車，所用助祭、饗賓、朝見各依差次。其初嫁之時，侯伯以下夫人所乘車皆上攝一等，知者，以士妻乘墨車，上攝大夫之車故也。崔又一解雲：“諸侯夫人初嫁不得上攝，以其逼王后故也。卿大夫之妻得上攝一等。”案鄭注《巾車》引《詩》“翟茀以朝”，謂厭翟也。衛是侯爵，故厭翟。崔氏後解與鄭注同。既不上攝，鄭注《巾車》雲：“乘翟茀之車以盛之者，以乘祭祀之車，故言盛也。”二劉以五等諸侯夫人初嫁皆乘厭翟，與鄭不合。其三公之妻與子男同。其孤妻夏篆，卿妻夏縵，大夫墨車，士乘棧車，初嫁皆上攝一等。其始嫁之衣，皆以祭服加以纁袡，約《士昏禮》“女次純衣纁袡”故也。其諸侯夫人用自祭之服，卿大夫之妻用助祭之服。此序以經有王姬之車，故因言車服謂嫁時之車服耳。若其在國，則系於其夫，各從其爵也。" }
      - { type: j, text: "何彼襛矣？唐棣之華。興也。襛猶戎戎也。唐棣，栘也。箋雲：何乎彼戎戎者乃栘之華。興者，喻王姬顏色之美盛。○棣，徒帝反，《字林》大內反。華如字。栘音移，一音是兮反，郭璞雲：“今白栘也，似白楊，江東呼夫栘。”曷不肅雍？王姬之車。肅，敬。雍，和。箋雲：曷，何。之，往也。何不敬和乎，王姬往乘車也。言其嫁時，始乘車則已敬和。○車，協韻尺奢反，又音居。或雲古讀華為敷，與居為韻。後放此。" }
      - { type: z, text: "“何彼”至“之車”。○正義曰：何乎彼戎戎者，乃唐棣之華，以興王姬之顏色，亦如此華然。王姬非直顏色之美，又能執持婦道，何事不敬和乎！王姬往乘車時，則已敬和矣。以其尊而適卑，恐有傲慢，今初乘車時已能敬和，則每事皆敬和矣。○礎矮襛猶戎戎”。○正義曰：以戎戎者華形貌，故重言之，猶《柏舟》以汎為汎汎之義。言戎戎者，毛以華狀物色，言之不必有文。○傳“唐棣，栘”。○正義曰：《釋木》文。舍人曰：“唐棣一名栘。”郭璞曰：“今白栘也，似白楊，江東呼夫栘。”○箋“何不”至“敬和”。○正義曰：詩美王姬肅雍，非云何事不敬和乎？言事事皆敬和。王姬始乘車則已敬和，後至齊侯之家自然敬和，故《樂記》雲：“肅肅，敬也。雍雍，和也。”夫敬與和，何事不行也？" }
      - { type: j, text: "何彼襛矣？華如桃李。平王之孫，齊侯之子。平，正也。武王女，文王孫，適齊侯之子。箋雲：“華如桃李”者，興王姬與齊侯之子顏色俱盛。正王者，德能正天下之王。" }
      - { type: z, text: "“何彼”至“之子”。○正義曰：言何乎彼戎戎者，其華之色如桃李華也，以興王姬顏色之盛與齊侯之子。誰能有此顏色者，是平王之孫與齊侯之子耳。上章言唐棣之華，此章不言木名，直言華如桃李，則唐棣之華如桃李之華也。以王姬顏色如齊侯之子顏色，故舉二木也。箋雲“華如桃李者，興王姬與齊侯之子顏色俱盛”，是以華比華，然後為興。○傳“平，正也”。箋“正王者，德能正天下之王”。○正義曰：此文王也。文者，諡之正名也，稱之則隨德不一，故以德能正天下則稱平王。《鄭志》張逸問：“箋雲德能正天下之王，然則不必要文王也。”答曰：“德能平正天下則稱為平，故以號文王焉。”又《大誥》注“受命曰寧王，承平曰平王”，故《君奭》雲“割申勸寧王之德”，是文王也。又《洛誥》雲“平來毖殷，乃命寧”，即雲“予以秬鬯二卣，曰明禋。文王騂牛一，武王騂牛一”。則“乃命寧”，兼文武矣，故注云“周公謂文王為寧王”。成王亦謂武王為寧王，此一名二人兼之。武王亦受命，故亦稱寧王。理亦得稱平王，但無文耳。" }
      - { type: j, text: "其釣維何？維絲伊緡。齊侯之子，平王之孫。伊，維。緡，綸也。箋雲：釣者以此有求於彼。何以為之乎？以絲之為綸，則是善釣也。以言王姬與齊侯之子以善道相求。○緡，亡貧反。綸音倫，繩也。" }
      - { type: z, text: "“其釣”至“之孫”。○正義曰：其釣魚之法維何以為乎？維以絲為繩，則是善釣。以興其娶妻之法，亦何以為之乎？維以禮為之，則是善娶。釣者以此有求於彼，執絲綸以求魚；娶者以己有求於人，用善道而相呼。誰能以善道相求呼者？乃齊侯之子求平王之孫。上章主美王姬適齊侯之子，故先言平王之孫。此章主說齊侯之子以善道求王姬，故先言齊侯之子。○傳“緡，綸”。○正義曰：《釋言》文。孫炎曰：“皆繩名也。”故《采綠》箋雲：“綸、釣，繳。”《抑》又云“言緡之絲”，傳曰“緡，被”者，以荏染柔木，宜被之以弦，故云“緡，被”，謂被絲為弦也。綸，《禮記》雲“王言如絲，其出如綸”，謂嗇夫所佩，與此別。" }
      - { type: j, text: "《何彼襛矣》三章，章四句。" }
      - { type: j, text: "《騶虞》，《鵲巢》之應也。《鵲巢》之化行，人倫既正，朝廷既治，天下純被文王之化，則庶類蕃殖，蒐田以時，仁如騶虞，則王道成也。應者，應德自遠而至。○騶，側留反，《周書·王會》、《草木疏》並同。又云：“尾長於身，不履生草。”《尚書大傳》雲“尾倍於身”。應，應對之應，注皆同。朝，直遙反。治，直吏反。被，皮寄反。蕃音煩，多也。蒐，所留反，春獵為蒐，田獵也。杜預雲：“蒐索擇取不孕者也。”《穀梁傳》雲：“四時之田，春曰田，夏曰苗，秋曰蒐，冬曰狩。”" }
      - { type: z, text: "“《騶虞》二章，章三句”至“道成”。○正義曰：以《騶虞》處末者，見《鵲巢》之應也。言《鵲巢》之化行，則人倫夫婦既已得正，朝廷既治，天下純被文王之化，則庶類皆蕃息而殖長，故國君蒐田以時，其仁恩之心，不忍盡殺，如騶虞然，則王道成矣。《鵲巢》之化，謂國君之化行於天下也。人倫既正，謂夫人均一，不失其職是也。朝廷既治，謂以禮自防，聽訟決事是也。天下純被文王之化，謂《羔羊》以下也。此處《騶虞》於末，以為《鵲巢》之應，以故歷序《鵲巢》以下，然後言《騶虞》當篇之義，由文王之化被於天下也，故得庶類蕃殖，即豝豵是也。國君蒐田以時，即章首一句是也。“仁如騶虞”，下二句是也。言“王道成”者，以此篇處末，故總之言天下純被文王之化，庶類又蒙其澤，仁心能如騶虞，則王化之道成矣。所謂《周南》、《召南》，王化之基也。○箋“應者”至“而至”。正義曰：敘解德為應之意，故箋解應者，應國君之德，若自遠而至，然非實至也。" }
      - { type: j, text: "彼茁者葭，茁，出也。葭，蘆也。箋雲：記蘆始出者，著春田之早晚。○茁，側劣、側刷二反。葭音加。蘆音盧，草也。著，張慮反，後不音者放此。壹發五豝。豕牝曰豝。虞人翼五豝，以待公之發。箋雲：君射一發而翼五豬者，戰禽獸之命。必戰之者，仁心之至。○發如字，徐音廢。豝，百加反。牝，頻忍反，徐扶死反。射，食亦反。于嗟乎騶虞！騶虞，義獸也。白虎黑文，不食生物，有至信之德則應之。箋雲：于嗟者，美之也。" }
      - { type: z, text: "“彼茁”至“騶虞”。○正義曰：言彼茁茁然出而始生者，葭草也。國君於此草生之時出田獵，壹發矢而射五豝。獸五豝唯壹發者，不忍盡殺。仁心如是，故於嗟乎歎之，歎國君仁心如騶虞。騶虞，義獸，不食生物，有仁心，國君亦有仁心，故比之。○傳“茁，出。葭，蘆”。○正義曰：謂草生茁茁然出，故云“茁茁”也，非訓為“出”。“葭，蘆”，《釋草》文。李巡曰：“葦初生。”○傳“豕牝”至“之發”。○正義曰：“豕牝曰豝”，《釋獸》文。又解君射一發而翼五豝者，由虞人翼驅五豝，以待公之發矢故也。《多士》雲“敢翼殷命”，注云：“翼，驅也。”則此翼亦為驅也。知有驅之者，《吉日》雲“漆沮之從，天子之所”，傳曰：“驅禽而至天子之所。”又曰“悉率左右，以燕天子”，”，傳曰：“驅禽之左右，以安待天子之射。”又《易》曰：“王用三驅，失前禽也。”故知田獵有使人驅禽之義。知虞人驅之者，以田獵則虞人之事，故《山虞》雲：“若大田獵，則萊山田之野。”《澤虞》雲：“若大田獵，則萊澤野。”天子田獵使虞人，則諸侯亦然，故《駟驖》箋雲“奉是時牡者，謂虞人。”《田僕》雲：“設驅逆之車。”則僕人設車，虞人乘之以驅禽也。言驅逆，則驅之逆之皆為驅也。○箋“君射”至“之至”。正義曰：解雲君止一發，必翼五豝者，戰禽獸之命。必雲戰之者，不忍盡殺，令五豝止一發，中則殺一而已，亦不盡殺之，猶如戰然，故云“戰禽獸之命”也。而必雲戰之者，仁心之至，不忍盡殺故也。○傳“騶虞”至“應之”。○正義曰：白虎，西方毛蟲，故云義獸。《鄭志》張逸問：“傳曰‘白虎黑文’，又《禮記》曰‘樂官備’，何謂？”答曰：“白虎黑文，《周史·王會》雲備者，取其一發五豝，言多賢也。”《射義》注及《答志》皆喻得賢多，引《詩》斷章也。言不食生物者，解其仁心，故序雲“仁如騶虞”。雲“有至信之德則應之”者，騶虞之為瑞應，至信之德也。陸機雲：“騶虞，白虎黑文，尾長於驅，不食生物，不履生草，應信而至者也。”" }
      - { type: j, text: "彼茁者蓬，蓬，草名也。○蓬，蒲東反。壹發五豵。一歲曰豵。箋雲：豕生三曰豵。○豵，子公反，徐又在容反，字又作“豵”，同。" }
      - { type: j, text: "于嗟乎騶虞！" }
      - { type: z, text: "傳“一歲曰豵”。○正義曰：傳以《七月》雲“言私其豵，獻豜於公”，《大司馬》雲“大獸公之，小獸私之”，豜言私，明其小，故彼亦云“一歲曰豵”。獻豜於公，明其大，故彼與《還》傳皆雲“三歲曰豜”。《代檀》傳曰“三歲曰特”，蓋異獸別名。故三歲者有二名也。《大司馬職》注云：“一歲為豵，二歲為豝，三歲為特，四歲為肩，五歲為慎。”其說與毛或異或同，不知所據。○箋“豕生三曰豵”。○正義曰：箋以豵者豕生之數，非大小之名，故《釋獸》雲：“豕生三豵、二師、一特。”郭璞曰：“豬生子常多，故別其少者。”《鄭志》張逸問：“豕生三曰豵，不知母豕也？豚也？”答曰：“豚也。過三以往，猶謂之豵，以自三以上更無名也。”故知過三亦為豵。一解雖生數之名，大小皆得名之。“言私其豵”，謂小時，此國君蒐田所射，未必小也。《釋獸》麕、鹿皆雲“絕有力者，{鹿開}”，則“有懸特”謂豕生一名，獻豜從兩。肩為{鹿開}，{鹿開}，鹿也，絕有力者，非三歲矣。肩、{鹿開}，字雖異，音實同也。" }
      - { type: j, text: "《騶虞》二章，章三句。" }
      - { type: j, text: "召南之國十四篇，四十章，百七十七句。" }
      - { type: j, text: "《毛詩正義》" }
