sections:
  - id: 周本紀
    name: 周本紀
    blocks:
      - type: j
        text: 周后稷名弃其母有邰氏女曰姜原姜原為帝嚳元妃姜原出野見巨人蹟心欣然說欲踐之踐之而身動如孕者居期而生子以為不祥弃之隘巷馬牛過者皆辟不踐徙置之林中適會山林多人遷之而弃渠中氷上飛鳥以其翼覆薦之姜原以為神遂收養長之初欲弃之因名曰弃弃為兒時屹如巨人之志其游戲好種樹麻菽麻菽美及為成人遂好耕農相
      - type: j
        text: 之多徙而保歸焉周道之興自此始故詩人歌樂思其德公劉卒子慶節立國於豳慶節卒子皇僕立皇僕卒子差弗立差弗卒子毀隃立毀隃卒子公非立公非卒子高圉立高圉卒子亞圉立亞圉卒子公叔祖類立公叔祖類卒子古公亶父立古公亶父復修后稷公劉之業積德行義國人皆戴之薰育戎狄攻之欲得財物予之已復攻欲得地與民民皆怒欲戰古公曰有民立君將以利之今戎狄所為攻戰以吾
      - type: j
        text: 虞仲知古公欲立季歷以傳昌乃二人亡如荆蠻文身斷髮以讓季歷古公卒季歷立是為公季公季修古公遺道篤於行義諸侯順之公季卒子昌立是為西伯西伯曰文王遵后稷公劉之業則古公公季之法篤仁敬老慈少禮下賢者日中不暇食以待士士以此多歸之伯夷叔齊在孤竹聞西伯善養老盍往歸之太顛閎夭散宜生鬻子辛甲大夫之徒皆往歸之崇侯虎譖西伯於殷紂曰西伯積善累德諸侯皆
      - type: j
        text: 謂曰吾所爭周人所恥何徃為秪取辱耳遂還俱讓而去諸侯聞之曰西伯盖受命之君明年伐犬戎明年伐密須明年敗耆國殷之祖伊聞之懼以告帝紂紂曰不有天命乎是何能為明年伐邘明年伐崇侯虎而作豐邑自岐下而徙都豐明年西伯崩太子發立是為武王西伯盖即位五十年其囚羑里盖益易之八卦為六十四卦詩人道西伯盖受命之年稱王而斷虞芮之訟後十年而崩謚為文王改法度制正
      - type: j
        text: 中武王俯取以祭既渡有火自上復于下至于王屋流為烏其色赤其聲魄云是時諸侯不期而會盟津者八百諸侯諸侯皆曰紂可伐矣武王曰女未知天命未可也乃還師歸居二年聞紂昏亂暴虐滋甚殺王子比干囚箕子太師疵少師彊抱其樂器而犇周於是武王徧告諸侯曰殷有重罪不可以不畢伐乃遵文王遂率戎車三百乘虎賁三千人甲士四萬五千人以東伐紂十一年十二月戊午師畢渡盟津諸
      - type: j
        text: 爾干立爾矛予其誓王曰古人有言牝雞無晨牝雞之晨惟家之索今殷王紂維婦人言是用自弃其先祖肆祀不答昏弃其家國遺其王父母弟不用乃維四方之多罪逋逃是崇是長是信是使俾暴虐于百姓以姦軌于商國今予發維共行天之罰今日之事不過六步七步乃止齊焉夫子勉哉不過於四伐五伐六七伐乃止齊焉勉哉夫子尚桓桓如虎如羆如豺如離于商郊不禦克犇以役西土勉哉夫子爾
      - type: j
        text: 臣告語商百姓曰上天降休商人皆再拜稽首武王亦答拜遂入至紂死所武王自射之三發而後下車以輕劔擊之以黃鉞斬紂頭縣大白之旗已而至紂之嬖妾二女二女皆經自殺武王又射三發擊以劔斬以玄鉞縣其頭小白之旗武王已乃出復軍其明日除道修社及商紂宮及期百夫荷罕旗以先驅武王弟叔振鐸奉陳常車周公旦把大鉞畢公把小鉞以夾武王散宜生太顛閎夭皆執劔以衛武王既入
      - type: j
        text: 鹿臺之財發鉅橋之粟以振貧弱萌隷命南宫括史佚展九鼎保玉命閎夭封比干之墓命宗祝享祠于軍乃罷兵西歸行狩記政事作武成封諸侯班賜宗彝作分殷之器物武王追思先聖王乃褒封神農之後於焦黄帝之後於祝帝堯之後於薊帝舜之後於陳大禹之後於杞於是封功臣謀士而師尚父為首封封尚父於營丘曰齊封弟周公旦於曲阜曰魯封召公奭於燕封弟叔鮮於管弟叔度於蔡餘各以次
      - type: j
        text: 有河粵詹雒伊毋遠天室營周居于雒邑而後去縱馬於華山之陽放牛於桃林之虛偃干戈振兵釋旅示天下不復用也武王已克殷後二年問箕子殷所以亡箕子不忍言殷惡以存亡國宜告武王亦醜故問以天道武王病天下未集羣公懼穆卜周公乃祓齋自為質欲代武王武王有瘳後而崩太子誦代立是為成王成王少周初定天下周公恐諸侯畔周公乃攝行政當國管叔蔡叔羣弟疑周公與武庚作亂
      - type: j
        text: 申視率營築居九鼎焉曰此天下之中四方入貢道里均作召誥洛誥成王既遷殷遺民周公以王命告作多士無佚召公為保周公為師東伐淮夷殘奄遷其君薄姑成王自奄歸在宗周作多方既絀殷命襲淮夷歸在豐作周官興正禮樂度制於是改而民和睦頌聲興成王既伐東夷息慎來賀王賜榮伯作賄息慎之命成王將崩懼太子釗之不任乃命召公畢公率諸侯以相太子而立之成王既崩二公率諸侯
      - type: j
        text: 微穆王閔文武之道缺乃命伯臩申誡太僕國之政作臩命復寧穆王將征犬戎祭公謀父諫曰不可先王耀德不觀兵夫兵戢而時動動則威觀則玩玩則無震是故周文公之頌曰載戢干戈載櫜弓矢我求懿德肆于時夏允王保之先王之於民也茂正其德而厚其性阜其財求而利其器用明利害之鄉以文修之使之務利而辟害懷德而畏威故能保世以滋大昔我先王世后稷以服事虞夏及夏之衰也弃稷
      - type: j
        text: 荒服者王日祭月祀時享歲貢終王先王之順祀也有不祭則修意有不祀則修言有不享則修文有不貢則修名有不王則修德序成而有不至則修刑於是有刑不祭伐不祀征不享讓不貢告不王於是有刑罰之辟有攻伐之兵有征討之備有威讓之命有文告之辭布令陳辭而有不至則增修於德無勤民於遠是以近無不聽遠無不服今自大畢伯士之終也犬戎氏以其職来王天子曰予必以不享征之且
      - type: j
        text: 之疑有赦其審克之簡信有衆惟訊有稽無簡不疑共嚴天威黥辟疑赦其罰百率閱實其罪劓辟疑赦其罰倍灑閱實其罪臏辟疑赦其罰倍差閱實其罪宫辟疑赦其罰五百率閱實其罪大辟疑赦其罰千率閱實其罪墨罰之屬千劓罰之屬千臏罰之屬五百宫罰之屬三百大辟之罰其屬二百五刑之屬三千命曰甫刑穆王立五十五年崩子共王繄扈立共王游於涇上密康公從有三女犇之其母曰必致之
      - type: j
        text: 夫榮公好專利而不知大難夫利百物之所生也天地之所載也而有專之其害多矣天地百物皆将取焉何可專也所怒甚多而不備大難以是教王王其能久乎夫王人者将導利而布之上下者也使神人百物無不得極猶曰怵惕懼怨之来也故頌曰思文后稷克配彼天立我蒸民莫匪爾極大雅曰陳錫載周是不布利而懼難乎故能載周以至于今今王學專利其可乎匹夫專利猶謂之盜王而行之其歸鮮
      - type: j
        text: 瞍賦矇誦百工諫庶人傳語近臣盡規親戚補察瞽史教誨耆艾修之而後王斟酌焉是以事行而不悖民之有口也猶土之有山川也財用於是乎出猶其有原隰衍沃也衣食於是乎生口之宣言也善敗於是乎興行善而備敗所以產財用衣食者也夫民慮之於心而宣之於口成而行之若壅其口其與能幾何王不聽於是國莫敢出言三年乃相與畔襲厲王厲王出奔於彘厲王太子靜匿召公之家國人聞之
      - type: j
        text: 于千畝王師敗績于姜氏之戎宣王既亡南國之師乃料民於太原仲山甫諫曰民不可料也宣王不聽卒料民四十六年宣王崩子幽王宫涅立幽王二年西周三川皆震伯陽甫曰周將亡矣夫天地之氣不失其序若過其序民亂之也陽伏而不能出陰迫而不能蒸於是有地震今三川實震是陽失其所而填陰也陽失而在陰原必塞原塞國必亡夫水土演而民用也土無所演民乏財用不亡何待昔伊洛竭而
      - type: j
        text: 言曰余褒之二君夏帝卜殺之與去之與止之莫吉卜請其漦而藏之乃吉於是布幣而策告之龍亡而漦在櫝而去之夏亡傳此器殷殷亡又傳此器周比三代莫敢發之至厲王之末發而觀之漦流于庭不可除厲王使婦人裸而譟之漦化為玄黿以入王後宫後宫之童妾既齓而遭之既笄而孕無夫而生子懼而弃之宣王之時童女謡曰檿弧箕服實亡周國於是宣王聞之有夫婦賣是器者宣王使執而戮之
      - type: j
        text: 後不信諸侯益亦不至幽王以虢石父為卿用事國人皆怨石父為人佞巧善諛好利王用之又廢申后去太子也申侯怒與繒西夷犬戎攻幽王幽王舉烽火徵兵兵莫至遂殺幽王驪山下虜褒姒盡取周賂而去於是諸侯乃即申侯而共立故幽王太子宜臼是為平王以奉周祀平王立東遷于雒邑辟戎寇平王之時周室衰微諸侯彊并弱齊楚秦晉始大政由方伯四十九年魯隱公即位五十一年平王崩太子
      - type: j
        text: 有寵及惠王即位奪其大臣園以為囿故大夫邊伯等五人作亂謀召燕衛師伐惠王惠王犇温已居鄭之櫟立釐王弟頹為王樂及徧舞鄭虢君怒四年鄭與虢君伐殺王頹復入惠王惠王十年賜齊桓公為伯二十五年惠王崩子襄王鄭立襄王母蚤死後母曰惠后惠后生叔帶有寵於惠王襄王畏之三年叔帶與戎翟謀伐襄王襄王欲誅叔帶叔帶犇齊齊桓公使管仲平戎于周使隰朋平戎于晉王以上卿禮
      - type: j
        text: 翟師以伐鄭王德翟人将以其女為后富辰諫曰平桓荘惠皆受鄭勞王弃親親翟不可從王不聴十六年王絀翟后翟人来誅殺譚伯富辰曰吾數諫不從如是不出王以我為懟乎乃以其屬死之初惠后欲立王子帶故以黨開翟人翟人遂入周襄王出犇鄭鄭居王于汜子帶立為王取襄王所絀翟后與居温十七年襄王告急于晉晉文公納王而誅叔帶襄王乃賜晉文公珪鬯弓矢為伯以河内地與晉二十年
      - type: j
        text: 為悼公十四年簡王崩子靈王泄心立靈王二十四年齊崔杼弑其君莊公二十七年靈王崩子景王貴立景王十八年后太子聖而蚤卒二十年景王愛子朝欲立之會崩子丐之黨與爭立國人立長子猛為王子朝攻殺猛猛為悼王晉人攻子朝而立丐是為敬王敬王元年晉人入敬王子朝自立敬王不得入居澤四年晉率諸侯入敬王于周子朝為臣諸侯城周十六年子朝之徒復作亂敬王犇于晉十七年晉
      - type: j
        text: 卒子威公代立威公卒子惠公代立乃封其少子於鞏以奉王號東周惠公威烈王二十三年九鼎震命韓魏趙為諸侯二十四年崩子安王驕立是歲盜殺楚聲王安王立二十六年崩子烈王喜立烈王二年周太史儋見秦獻公曰始周與秦國合而別別五百載復合合十七歲而霸王者出焉十年烈王崩弟扁立是為顯王顯王五年賀秦獻公獻公稱伯九年致文武胙於秦孝公二十五年秦會諸侯於周二十六
      - type: j
        text: 子咎為太子八年秦攻宜陽楚救之而楚以周為秦故将伐之蘇代為周說楚王曰何以周為秦之禍也言周之為秦甚於楚者欲令周入秦也故謂周秦也周知其不可解必入於秦此為秦取周之精者也為王計者周於秦因善之不於秦亦言善之以疏之於秦周絕於秦必入於郢矣秦借道兩周之間将以伐韓周恐借之畏於韓不借畏於秦史厭謂周君曰何不令人謂韓公叔曰秦之敢絕周而伐韓者信東周
      - type: j
        text: 出可以德東周而西周之寶必可以盡矣王赧謂成君楚圍雍氏韓徵甲與粟於東周東周君恐召蘇代而告之代曰君何患於是臣能使韓毋徵甲與粟於周又能為君得高都周君曰子苟能請以國聽子代見韓相國曰楚圍雍氏期三月也今五月不能拔是楚病也今相國乃徵甲與粟於周是告楚病也韓相國曰善使者已行矣代曰何不與周高都韓相國大怒曰吾毋徵甲與粟扵周亦已多矣何故與周高都
      - type: j
        text: 怒釋弓搤劒曰客安能教我射乎客曰非吾能教子支左詘右也夫去柳葉百步而射之百發而百中之不以善息少焉氣衰力倦弓撥矢鉤一發不中者百發盡息今破韓魏扑師武北取趙藺離石者公之功多矣今又將兵出塞過兩周倍韓攻梁一舉不得前功盡弃公不如稱病而無出四十二年秦破華陽約馬犯謂周君曰請令梁城周乃謂梁王曰周王病若死則犯必死矣犯請以九鼎自入於王王受九鼎而
      - type: j
        text: 曰為王計者不攻周攻周實不足以利聲畏天下天下以聲畏秦必東合於齊兵弊於周合天下於齊則秦不王矣天下欲弊秦勸王攻周秦與天下弊則令不行矣五十八年三晉距秦周令其相國之秦以秦之輕也還其行客謂相國曰秦之輕重未可知也秦欲知三國之情公不如急見秦王曰請為王聽東方之變秦王必重公重公是秦重周周以取秦也齊重則固有周聚以收齊是周常不失重國之交也秦信
      - type: j
        text: 王營之成王使召公卜居居九鼎焉而周復都豐鎬至犬戎敗幽王周乃東徙于洛邑所謂周公葬我畢畢在鎬東南杜中秦滅周漢興九十有餘載天子將封太山東巡狩至河南求周苗裔封其後嘉三十里地號曰周子南君比列侯以奉其先祭祀
  - id: 秦本紀
    name: 秦本紀
    blocks:
      - type: j
        text: 秦之先帝顓頊之苗裔孫曰女脩女脩織玄鳥隕卵女脩吞之生子大業大業取少典之子曰女華女華生大費與禹平水土已成帝錫玄圭禹受曰非予能成亦大費為輔帝舜曰咨爾費賛禹功其賜爾皁游爾後嗣将大出乃妻之姚姓之玉女大費拜受佐舜調馴鳥獸鳥獸多馴服是為栢翳舜賜姓嬴氏大費生子二人一曰大廉實鳥俗氏二曰若木實費氏其
      - type: j
        text: 棺銘曰帝令處父不與殷亂賜爾石棺以華氏死遂葬於霍太山蜚廉復有子曰季勝季勝生孟增孟增幸於周成王是為宅皋狼皋狼生衡父衡父生造父造父以善御幸於周繆王得驥溫驪驊騮騄耳之駟西巡狩樂而忘歸徐偃王作亂造父為繆王御長驅歸周以救亂繆王以趙城封造父造父族由此為趙氏自蜚廉生季勝已下五世至造父別居趙趙衰其後也惡來革者蜚廉子也蚤死有子曰女防女防生
      - type: j
