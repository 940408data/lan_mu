# 禮記正義卷10（孔穎達疏）：j 為經文＋鄭玄注，z 為疏文。
sections:
  - id: juan10
    name: 正文
    blocks:
      - { type: j, text: "公叔文子卒，文子，衛獻公之孫，名拔，或作發。○拔，蒲八反。其子戍請諡於君，曰：“日月有時，將葬矣。請所以易其名者。”諡者，行之跡。有時，猶言有數也，大夫士三月而葬。○行，下孟反。君曰：“昔者衛國兇飢，夫子為粥與國之餓者，是不亦惠乎？君，靈公也。○粥音祝。昔者衛國有難，夫子以其死衛寡人，不亦貞乎？難，謂魯昭公二十年盜殺衛侯之兄縶也。時齊豹作亂，公如死鳥。○難，乃旦反，注同。夫子聽衛國之政，修其班制，以與四鄰交，衛國之社稷不辱，不亦文乎？班制，謂尊卑之差。故謂夫子貞惠文子。”後不言貞惠者，文足以兼之。" }
      - { type: z, text: "“公叔”至“文子”。○正義曰：此一節論請君誄臣之諡法，各依文解之。○注“文子”至“作發”。○正義曰：案《世本》：“衛獻公生成子當，當生文子拔。”拔是獻公孫也。“或作發”者，以《春秋左氏傳》作發，故云“或作發”。○“請所以易其名”者，生存之日，若呼其名，今既死將葬，故請所以誄行為之作諡，易代其名者。○注“難謂”至“死鳥”。○正義曰：案昭二十年《左傳》雲：“衛公孟縶狎齊豹，奪之司寇與鄄。公孟惡北宮喜、褚師圃，欲去之。公子朝通於襄夫人宣姜，懼而欲以作亂，故齊豹、北宮喜、褚師圃、公子朝作亂。丙辰，衛侯在平壽，公孟有事於蓋獲之門外。”又云：“齊氏用戈擊公孟，宗魯以背蔽之，斷肱，以中公孟之肩，皆殺之。公聞亂，乘驅自閱門入，載寶以出。又云：“公如死鳥。”注云：“死鳥，衛地。”○“故謂”至“文子”者，案《諡法》：“愛民好與曰惠，外內用情曰貞，道德博聞曰文。”既有道德，則能惠能貞，故鄭雲：“後不言貞惠者，文足以兼之。”案文次先“惠”後“貞”，此先雲“貞”者，以其致死死君事重，故在前，上先言“惠”者，據事先後言之。" }
      - { type: j, text: "石駘仲卒。駘仲，衛大夫石碏之族。○駘，大來反。碏，七略反。無適子，有庶子六人，卜所以為後者，莫適立也。○適，下歷反，注同。曰：“沐浴佩玉則兆。”言齊絜則得吉兆。○齊，側皆反。五人者皆沐浴佩玉。石祁子曰：“孰有執親之喪，而沐浴佩玉者乎？”不沐浴佩玉。心正且知禮。石祁子兆，衛人以龜為有知也。" }
      - { type: z, text: "“石駘”至“知也”。○正義曰：此一節論龜兆知賢知之事，各依文解之。○“卜所”至“則兆”。○既有庶子六人，莫適立也，故卜所以堪為後者。其掌卜之人謂之曰：“若沐浴佩玉，則得吉兆。”所以須有卜者，《春秋左氏》之義，故昭三十六年雲：“年鈞以德，德鈞以卜。王不立愛，公卿無私。”若《公羊》隱元年雲：“立適以長不以賢，立子以貴不以長。”何休雲：“適夫人無子，立右媵。右媵無子，立左媵。左媵無子，立嫡侄娣。嫡侄娣無子，立右媵侄娣。右媵侄娣無子，立左媵侄娣。質家親親，先立娣。文家尊尊，先立侄。嫡子有孫而死，質家親親，先立弟。文家尊尊，先立孫。其雙生也，質家據見立先生，文家據本意立後生。”何休作《膏肓》難《左氏》雲：“若其以卜，隱、桓以禍，皆由此作，乃曰古制，固亦謬矣。”鄭箴之雲：“立長以嫡不以賢，固立長矣。立子以貴不以長，固立貴矣。若長均貴均，何以別之？故須卜。《禮》有詢立君、卜立君，是有卜也。”是從《左氏》之義。○“孰有”至“者乎”。○居親之喪，必衰絰憔悴，安有居親之喪，而沐浴佩玉者乎？言不可，鄭雲“心正且知禮”者，不信邪言是心正，居喪不沐浴佩玉是知禮也。" }
      - { type: j, text: "陳子車死於衛，其妻與其家大夫謀以殉葬，子車，齊大夫。定而後陳子亢至。以告曰：“夫子疾，莫養於下，請以殉葬。”子亢，子車弟，孔子弟子。下，地下。○亢音剛，又苦浪反。養，羊尚反，下皆同。子亢曰：“以殉葬，非禮也。雖然，則彼疾當養者，孰若妻與宰？得已，則吾欲已。不得已，則吾欲以二子者之為之也。”度諫之不能正，以斯言拒之，已猶止也。○度，大洛反。於是弗果用。果，決。" }
      - { type: z, text: "“陳子”至“果用”。○正義曰：此一節論殉葬非禮之事，各依文解之。○注“子亢”至“弟子”。○正義曰：知“孔子弟子”者，以《論語》“陳亢問於伯魚”，與伯魚相問，故知孔子弟子。又知“子車，齊大夫”者，昭二十六年《左傳》齊師圍成，魯師及齊師戰於炊鼻。魯人將擊子車，子車射之，殪。鄭蓋據此謂“齊大夫”。知亢是子車弟者，以子車之妻，謀欲殉葬子車，子亢不能止之。若是子車之兄，當處分由已，故知是子車弟也。“子亢”至“之也”。○子亢既見兄家謀殉葬非禮之事，自度不能止，故云“殉葬，非禮也”。又云雖非禮，彼疾當養者，彼死者疾病，當須養侍於下者，以外人疏，誰若妻之與宰？言妻、宰最親，當須侍養。若得休已，不須侍養，吾意欲休已。若其不止，必須為殉葬，則吾欲以妻之與宰二子為之。" }
      - { type: j, text: "子路曰：“傷哉，貧也！生無以為養，死無以為禮也。”孔子曰：“啜菽飲水，盡其歡，斯之謂孝。斂手足形，還葬而無槨，稱其財，斯之謂禮。”還猶疾也。謂不及其日月。○啜，昌劣反。叔或作菽，音同，大豆也；王雲：“熬豆而食曰啜菽。”斂，力檢反。還音旋，後同。稱，尺證反，下注“之稱”同。" }
      - { type: z, text: "“子路”至“謂禮”。○正義曰：此一節論孝子事親稱家之有無之事。“孔子”至“謂禮”。○孔子以子路傷貧，故答之雲“啜菽飲水”，以菽為粥，以常啜之。飲水更無餘物，以水而已。雖使親啜菽飲水，盡其歡樂之情，謂使親盡其歡樂，此之謂孝。答上“生無以為養”。○“斂手足形”者，親亡，但以衣棺斂其頭首及足，形體不露，還速葬而無槨材，稱其家之財物所有以送終，此之謂禮。答上“死無以為禮”。" }
      - { type: j, text: "衛獻公出奔，反於衛，及郊，將班邑於從者而後入。欲賞從者，以懼居者，獻公以魯襄十四年出奔齊，二十六年復歸於衛。○從，才用反，注下同。柳莊曰：“如皆守社稷，則孰執羈靮而從？如皆從，則孰守社稷？”言從、守若一。靮，紖也。○羈音基。靮，丁歷反。紖，陳忍反。君反其國而有私也，毋乃不可乎！”言有私則生怨。弗果班。" }
      - { type: z, text: "“衛獻”至“果班”。○正義曰：此一節論衛君歸國不合私賞從者之事。○注“欲賞”至“於衛”。○正義曰：經直雲“班邑於從者”，鄭知“以懼居者”，見下柳莊雲“如皆從，則孰守社稷”，為居者而言，明知獻公欲懼居者也。故《左傳》雲“獻公反國，使人責大叔儀”是也。知“獻公以魯襄公十四年出奔齊”者，案襄十四年《左傳》雲，衛獻公戒孫文子、甯惠子食。二子皆朝服而朝，日旰不召。公射鴻於囿，二子從之，公不釋皮冠而與之言。二子怒，故攻公，公出奔齊。二十六年傳雲，甯惠子之子甯喜以父言攻孫氏而納衛侯，二十六年復歸於衛。是獻公以魯襄公十四年出奔，二十六年復歸於衛也。" }
      - { type: j, text: "衛有大史曰柳莊，寢疾。公曰：“若疾革，雖當祭必告。”革，急也。○革本又作亟，居力反，注同。公再拜稽首，請於屍曰：“有臣柳莊也”者，非寡人之臣，社稷之臣也。聞之死，請往。”急吊賢者。不釋服而往，遂以襚之。脫君祭服以襚臣，親賢也。所以此襚之者，以其不用襲也，凡襚以斂。○襚音遂。脫，本亦作說，又作稅，同，他活反。與之邑裘氏與縣潘氏，書而納諸棺曰：“世世萬子孫無變也。”所以厚賢也。裘、縣潘，邑名。○縣音玄，注同。潘，普幹反。" }
      - { type: z, text: "“衛有”至“變也”。○正義曰：此一節論君急吊臣之事。柳莊為衛大史。今寢疾，其家自告，公報之曰：“若疾急困，雖當我祭，必須告也。”其後柳莊果當公祭之時卒，而來告公。公祭事雖了，與屍為禮未畢，公再拜稽首，請於屍曰：有臣柳莊也者，才能賢異，非唯寡人之臣，乃是社稷之臣。今聞之身死，請往赴之。又不釋祭服，即往哭，遂以所著祭服脫而襚之。又與之采邑，曰裘氏及縣潘氏。與二邑，又書錄其賞辭而納之棺，雲：世世恆受此邑，至萬世子孫，無有改變。案《禮》：君入廟門，全為臣，請屍得言“寡人”者，是後人作記者之言也。○注“脫君”至“以斂”。○正義曰：案《士喪禮》“君使人襚”，不雲祭服襚臣。今君以祭服襚，故云：“親賢也。”得以祭服襚之者，《禮》：諸侯玄冕祭廟，大夫自玄冕而下。以其俱是玄冕，故得襚也。祭服既尊，得以襚臣者，以其臣卑，不敢用君襚衣而襲之也。所以不用襲者，襲是近屍形體，事褻惡，故不敢用君之襚衣也。案《士喪禮》雲君襚衣，及親者及庶兄弟之襚，皆不用襲。故《士喪禮》雲“庶襚繼陳不用”，注云：“不用，不用襲也。”至小斂，則得用庶襚，故《士喪禮》小斂“凡有十九稱，陳衣繼之，不必盡用”，鄭雲：“陳衣，庶襚也。”既雲“不必盡用”，明有用者，至大斂得用君襚，故《士喪禮》“大斂君襚，祭服、散衣、庶襚，凡三十稱”，又云“君襚不倒”，是大斂得用襚也。雲“凡襚以斂”者，謂庶襚以小斂，君襚以大斂也。鄭言此者，明襚衣不用襲也。" }
      - { type: j, text: "陳乾昔寢疾，屬其兄弟而命其子尊已，曰：“如我死，則必大為我棺，使吾二婢子夾我。”婢子，妾也。○乾音幹。屬，之玉反。夾，古洽反。陳乾昔死，其子曰：“以殉葬，非禮也，況又同棺乎？”弗果殺。善尊已不陷父於不義。" }
      - { type: z, text: "“陳乾”至“果殺”。○正義曰：此一節論人病時失禮也。○“屬其兄弟而命其子尊已”者，尊已，乾昔子名也。兄弟言“屬”，子云“命”，輕重之義也。○“曰如我死”者，此所屬命辭也，欲言其死後事也。○“則必大為我棺，使吾二婢子夾我”者，婢子，妾也。屬命雲令大為已棺，又使二婢夾已於棺中也。○“陳乾昔死”者，陳乾昔既屬兄弟之後而死。且言“陳乾昔”者，謂亦久纓疾病。或“陳乾昔”總是人名，但先儒無說，未知孰是。案《春秋》魏顆父病困，命使殺妾以殉，又晉趙孟、孝伯並將死，其語偷，又晉程鄭問降階之道，鄭然明以將死而有惑疾，此等並是將死之時，其言皆變常。而《論語》：“曾子曰：‘人之將死，其言也善。’”但人之疾患有深有淺，淺則神正，深則神亂，故魏顆父初欲嫁妾，是其神正之時。曾子云“其言也善”，是其未困之日。且曾子賢人，至困猶善。其中庸已下，未有疾病，天奪之魂魄，苟欲偷生，則趙孟、孝伯、程鄭之徒不足怪也。" }
      - { type: j, text: "仲遂卒於垂，壬午猶繹，《萬》入去《籥》。《春秋經》在宣八年。仲遂，魯莊公之子東門襄仲。先日辛巳，有事於太廟，而仲遂卒，明日而繹非也。《萬》，幹舞也。《籥》，籥舞也。傳曰：“去其有聲者，廢其無聲者。”○繹音亦。去，羌呂反，注同。籥，羊勺反。仲尼曰：“非禮也，卿卒不繹。”" }
      - { type: z, text: "“仲遂”至“不繹”。○正義曰：此一節論卿卒重於繹祭之事。○注“《春秋》”至“聲者”。○正義曰：此經所云者，《春秋經》文。案宣八年六月“辛巳，有事於大廟。仲遂卒於垂”是也。雲“仲遂，魯莊公之子東門襄仲”者，《世本》及《左傳》文也。雲“《萬》，幹舞也。《籥》，籥舞也”者，案宣八年《公羊傳》雲：“《萬》者何？幹舞也。《籥》者何？籥舞也。”《萬》是執幹而舞，武舞也，即《文王世子》雲“春夏學干戈”是也。《籥》舞執羽吹籥而舞，文舞也，《文王世子》雲“秋冬學羽籥”是也。雲“傳曰：去其有聲者，廢其無聲者”，亦宣八年《公羊傳》文。雲“去其有聲”，謂去《籥》舞，以吹籥有聲故也。“廢其無聲”，謂廢留《萬》舞而不去，以《萬》舞無聲故也。《鄭志》答張逸雲：“廢，置也。於去聲者為廢，謂廢留不去也。”然鄭引“《萬》，幹舞。《籥》，籥舞”，雖是傳文，鄭翦略其事，不全寫傳文，故於後始稱“傳曰：去其有聲，廢其無聲”，以二句全是傳文也。" }
      - { type: j, text: "季康子之母死，公輸若方小。公輸若，匠師。方小，言年尚幼，未知禮也。斂，般請以機封，斂，下棺於槨。般，若之族，多技巧者，見若掌斂事而年尚幼，請代之，而欲嘗其技巧。○般音班，注及下同。封，彼驗反。技，其騎反，下同。將從之。時人服般之巧。公肩假曰：“不可。夫魯有初，初，謂故事。公室視豐碑，言視者，時僣天子也。豐碑，斫大木為之，形如石碑，於槨前後四角樹之，穿中於間為鹿盧，下棺以繂繞。天子六繂四碑，前後各重鹿盧也。○碑，彼皮反。僣，子念反，後皆同。斫，丁角反。繂音律。繞，而沼反。重，直龍反。三家視桓楹。時僣諸侯。諸侯下天子也，斫之形如大楹耳，四植謂之桓。諸侯四繂二碑，碑如桓矣。大夫二繂二碑，士二繂無碑。○下，戶嫁反。植，時力反。般，爾以人之母嘗巧，則豈不得以？以，己字，言寧有強使女者與，僣於禮，有似；作機巧，非也。“以”與“己”字本同爾。，古以字。強，其丈反。女音汝，與音餘，下“苦與”同。其母以嘗巧者乎？則病者乎？毋，無也。於女寧有病苦與，止之。○毋音無。噫！”不寤之聲。○噫，於其反。弗果從。" }
      - { type: z, text: "“季康”至“果從”。○正義曰：此一節論非禮嘗巧不從之事。○季康子母死，公輸若為匠師之官，年方幼小，主掌窆事，欲下棺斂於壙中。其若之族人公輸般性有技巧，請為以轉動機關窆而下棺。時人服般之巧。○將從之時，有公肩假止而不許，曰：不可為機窆之事，夫魯有初始舊禮，公室之喪，視豐碑。豐，大也，謂用大木為碑。三家之葬，視桓楹也。桓，大也；楹，柱也。其用之碑如大楹柱。言之舊事，其法如此。遂呼般之名，般，女得以人之母而嘗巧乎？嘗，試也，欲以人母試己巧事。誰有強逼於女而為此乎？豈不得休已者哉！又語之雲，其無以人母嘗試己巧，則於女病者乎？言不得嘗巧，豈於女有病？公肩假既告般為此言，乃更噫而傷歎。於是眾人遂止，不果從般之事。○注“公輸若匠師”。○正義曰：以匠師主窆，故《鄉師》雲“及窆，執斧以蒞匠師”是也。○注“言視”至“盧也”。○正義曰：凡言“視”者，不正相當比擬之辭也。故《王制》雲“天子之三公視公侯，卿視伯，大夫視子男”是也。故云“言視，僣天子也”。雲“斫大木為之，形如石碑”者，以禮，廟庭有碑，故《祭義》雲：“牲入麗於碑。”《儀禮》每雲“當碑揖“，此雲“豐碑”，故知斫大木為碑也。雲“於槨前後四角樹之”者，謂槨前後乃兩旁樹之，角落相望，故云“四角”。非謂正當槨四角也。雲“穿中於間為鹿盧”者，謂穿鑿去碑中之木，令使空，於此空間著鹿盧，鹿盧兩頭各入碑木。雲“下棺以繂繞”者，繂即紼也，以紼之一頭系棺緘，以一頭繞鹿盧。既訖，而人各背碑負紼末頭，聽鼓聲，以漸卻行而下之。雲“天子六繂四碑”者，案《周禮》大喪屬其六引，故知天子六繂也。《喪大記》雲“君四繂二碑”，諸侯既二碑，故知天子四也。雲“前後各重鹿盧也”者，以六繂四碑，明有一碑兩紼者，故知一碑上下重著鹿盧。知唯前後碑重鹿盧者，以棺之入槨，南北豎長，前後用力深也。案《春秋》天子有隧，以羨道下棺。所以用碑者，凡天子之葬，掘地以為方壙，《漢書》謂之“方中”。又方中之內，先累槨於其方中，南畔為羨道。以蜃車載柩至壙，說而載以龍輴，從羨道而入。至方中，乃屬紼於棺之緘，從上而下，棺入於槨之中。於此之時用碑繂也。○注“諸侯下天子也，斫之形如大楹耳”。○正義曰：以言視桓楹，不雲碑，知不似碑形，故云“如大楹耳”。通而言之，亦謂之碑也。故《喪大記》雲“諸侯大夫二碑”是也。雲“四植謂之桓”者，案《說文》：“桓，亭郵表也。”謂亭郵之所，而立表木謂之桓，即今之橋旁表柱也。今諸侯二碑，兩柱為一碑而施鹿盧，故云“四植謂之桓”也。《周禮》桓圭而為雙植者，以一圭之上不應四柱，但瑑為二柱，象道旁二木，又宮室兩楹，故雙植謂之桓也。大夫亦二碑，但柱形不得粗大，所以異於諸侯也。○注“以已”至“本同”。正義曰：言經中“以用”之“以”，義是“休已”之字。所以用之“以”得為“休已”之字者，以其本同，謂古昔之本，用字本同，乃得通用。謂用，謂其兩字本昔是同，故得假借而用，後世始“以”、“已”義異也。雲“僣於禮，有似，作機巧，非也”者，皇氏解雲：“僣濫之事，於禮猶有所似，作機巧之事，全非也。”○注“毋無”至“止之”。○正義曰：依《說文》止毋是禁辭，故《說文》毋字從女，有人從中欲干犯，故禁約之，故鄭注《論語》雲：“毋止，其辭讓也。”故《曲禮》上篇多言“毋”，“毋”猶勿也，謂勿得如此。下“無”是無有之無，此經中之義是有無之無，故轉“毋”作“無”也。○注“不寤之聲”。○正義曰：公肩假唱噫，是歎公輸般不能寤於禮，故傷之而為此聲也。" }
      - { type: j, text: "戰於郎。郎，魯近邑也。哀十一年“齊國書帥師伐我”是也。公叔禺人遇負杖入保者息，遇，見也。見走闢齊師，將入保，罷倦，加其杖頸上，兩手掖之休息者。保，縣邑小城。禺人，昭公之子。《春秋》傳曰：“公叔務人。”○禺音遇，又音務，注同。闢音避。罷音皮。倦，其卷反。頸，吉領反。掖音亦。曰：“使之雖病也，謂時繇役。○繇，本亦作徭，音遙。任之雖重也，謂時賦稅。君子不能為謀也，士弗能死也。不可。君子，謂卿大夫也。魯政既惡，復無謀臣，士又不能死難，禺人恥之。○弗能，弗亦作不。為，於偽反，下注“國為”、下“為懿”同。復，扶又反，下“復射”、“謂不復”同。難，乃旦反。我則既言矣。欲敵齊師，踐其言。與其鄰重汪踦往，皆死焉。奔敵死齊寇。鄰，鄰里也。重皆當為童，童，未冠者之稱。姓汪名踦。鄰或為談。《春秋傳》曰：“童汪踦。”○重依注音童，下同。汪，烏黃反。踦，魚綺反。冠，古亂反。魯人欲勿殤重汪踦，見其死君事，有士行，欲以成人之喪治之。言魯人者，死君事，國為斂葬。○行，下孟反。問於仲尼，仲尼曰：“能執干戈以衛社稷，雖欲勿殤也，不亦可乎？”善之。" }
      - { type: z, text: "“戰於”至“可乎”。○正義曰：此節論童子死難之事。○“戰於郎”，哀十一年齊伐魯，魯與齊師戰於郎。郎者，魯之近邑也。案哀十一年魯人公叔禺人逢遇國人走闢齊師，兩手負杖於頸，走入城保，困而止息。禺人見而言曰：“國以徭役使此人，雖復病困，國以賦稅責任人民，雖復煩重，若上能竭心盡力，憂恤在下，則無以負愧。今君子卿大夫不能為謀士，又不能致死，是自全其身，不愛民庶，於理不可。”既嫌他不死，欲自為致死之事，故云“我則既言矣”。既，已也。雲我則已言之矣，乃踐其言，於是與鄰之童子姓汪名踦往赴齊師而死焉。依禮，童子為殤。魯人見其死寇，欲勿殤童汪踦，意以為疑，問於仲尼。仲尼報之雲：汪踦能執干戈以衛社稷。勿猶不也。雖欲不以為殤，不亦可乎？言其可為不殤也。○注“郎魯”至“是也”。○正義曰：案桓十年“齊侯、衛侯、鄭伯來戰於郎”，《公羊傳》雲：“郎者何？吾近邑也。”哀十一年齊國書師師伐我，戰於郊。是郊頭郎邑，故知近也。案《春秋》直雲“戰於郊”，知與此戰於郎為一事者，以其俱有童汪踦之事，故為一也。○注“禺人”至“務人”。○正義曰：案哀十一年傳雲：“公叔務人僮汪錡死。”昭公傳雲：“昭公子公為逐季氏，公曰：‘務人為此禍？’”“務人”即“公為”也，故云“昭公子”。此作“禺人”者，禺、務聲相近，聲轉字異也。○注“重皆當為童”。○正義曰：此雲“重汪踦”，下雲“重汪踦”，以重字有二，故云皆當為童，以言魯人欲勿殤，故從《春秋》為童也。注“見其”至“斂葬”。○正義曰：案《喪服》“小功”章“大夫為昆弟之長殤”，注云“謂為士者，若不仕者也”。以此言之，雖見為士，猶以殤服服之，何以此雲“死君事，有士行，欲以成人之喪治之”者，《喪服》所論，據尋常死者，雖見為士，猶以殤服服之。汪踦能致死於敵，故以成人之喪治之。雲“國為斂葬”者，以其經稱“魯人”，但指眾辭，汪踦非是家無親屬，但國家哀其死難，為斂葬之。" }
      - { type: j, text: "子路去魯，謂顏淵曰：“何以贈我？”贈，送。曰：“吾聞之也，去國，則哭於墓而後行。反其國，不哭，展墓而入。”無君事，主於孝。哭，哀去也。展，省視之。謂子路曰：“何以處我？”處猶安也。子路曰：“吾聞之也，過墓則式，過祀則下。”居者主於敬。" }
      - { type: z, text: "“子路”至“則下”。○正義曰：此一節論禮敬祀墓之事，各依文解之。○注“無事君，主於孝”。○正義曰：若有君事去國，則不得哭墓，故上《曲禮》雲“已受命，君言不宿於家”，是不哭於墓。○“過墓則式，過祀則下”。“墓”謂他家墳壟，“祀”謂神位有屋樹者，居無事，主於恭敬，故或“式”、或“下”也。他墳尚式則已，先祖墳墓當下也。" }
      - { type: j, text: "工尹商陽與陳棄疾追吳師，及之。工尹，楚官名。棄疾，楚公子棄疾也。以魯昭八年帥師滅陳，縣之，楚人善之，因號焉。至十二年，楚子狩於州來，使蕩侯、潘子、司馬督、囂尹午、陵尹喜圍徐以懼吳，於時有吳師。陳或作陵，楚人聲。○馬裻音篤，本亦作督。陳棄疾謂工尹商陽曰：“王事也，子手弓，而可手弓。”“子射諸。”商陽仁，不忍傷人，以王事勸之。○射，食亦反，下同。射之，斃一人，韔弓。不忍復射。斃，僕也。韔，韜也。○斃，本亦作獘，婢世反，下同。韔，敕亮反。僕，蒲北反，又音赴。韜，吐刀反。又及，謂之，又斃二人。每斃一人，揜其目。揜其目，不忍視之。○又及，本或作“又及一人”、“又一人”，後人妄加耳。止其御曰：“朝不坐，燕不與，殺三人，亦足以反命矣。”朝燕於寢，大夫坐於上，士立於下，然則商陽與御者皆士也。兵車參乘，射者在左，戈盾在右，御在中央。○朝，直遙反。與音預。乘，繩證反。盾，食允反，又音允。孔子曰：“殺人之中，又有禮焉。”善之。" }
      - { type: z, text: "“工尹”至“禮焉”。○正義曰：此一節論殺人有禮之事，各依文解之。○注“工尹”至“人聲”。○正義曰：案《春秋傳》楚皆以尹為官名也，故知工尹，楚官名也。雲“棄疾，楚公子棄疾也”者，《左傳》文。是楚恭王之子，後立為平王。雲“楚人善之，因號焉”者，案昭十三年《左傳》晉叔向雲：“棄疾君陳蔡，苛慝不作。”今此雲陳棄疾，故楚人善之，因號為陳棄疾也。雲“十二年楚子狩於州來”者，是昭十二年《左傳》文。楚子謂靈王，名虔，棄疾之兄也。使蕩侯一，潘子二，司馬督三，囂尹午四，陵尹喜五也。五大夫圍徐，以逼懼於吳也。案《左傳》直有圍徐，不見有吳師之事也。又棄疾不與圍徐，鄭必知有吳師，及棄疾追之者，以棄疾昭八年縣陳，十三年自立為王，於此之間，無與吳師相涉，今棄疾追吳師，復有圍徐懼吳之事，故鄭引以明之。雲“陳或作陵，楚人聲”者，謂陳棄疾，餘本有作“陵棄疾”者，故云“陳或作陵”。楚人呼“陳”及“陵”聲相似，故云“楚人聲”。“子手弓，而可手弓”者，棄疾謂商陽射吳之奔者，雲子是手弓之人，謂是能弓之手。而可手弓者，謂其堪可稱此能弓之手，謂宜須射也。又《家語》雲：“楚伐吳，工尹商陽與棄疾追吳師，及之。棄疾曰：‘王事也，子手弓而可。’商陽手弓。棄疾曰：‘子射諸。’射之，斃一人，韔其弓。”則此分句為異，解義亦別。言“手弓”者，令其彀弓而射之。未知孰是，故兩存焉，附之以廣聞見也。○注“朝燕”至“中央”。○正義曰：朝之與燕，皆在於寢。若路門外正朝，則大夫以下皆立。若其燕朝，在於路寢，如孔子攝齊升堂，又《詩傳》雲：“不脫屨升堂謂之飫。”明脫屨升堂則坐也，是“大夫坐於上”。燕亦在寢，故《燕禮》雲：“燕朝服於寢。”案《燕禮》獻卿大夫及樂作之後，西階上獻士。士既得獻者，立於東階下西面。無升堂之文，是“士立於下”。雲“兵車參乘，射者在左，戈盾在右，御在中央”者，謂兵車參乘之法，其事如此。若非兵車參乘，則尊者在左，故《曲禮》：“乘君之乘車，不敢曠左。”鄭注云：“君存，惡空其位。”又《月令》載耒耜於御與車右之間，君在左也。知“兵車參乘，射者在左，戈盾在右”者，案宣十二年《左傳》雲，楚許伯御，樂伯攝叔為右。於時樂伯主射，樂伯雲：“左射以菆。”是射者在左，攝叔雲：“右入壘，折馘執俘而還。”是戈盾勇力在右，自然御者在中央。此謂凡常戰士也。若是元帥則在中央鼓下，御者在左，戈盾亦在右。故成二年鞍之戰，於時郤克為中軍將，時流血及屨，未絕鼓音。是將居鼓下也。解張御郤克，解張雲：“矢貫餘手及肘，餘折以御，左輪朱殷。”是御者在左，自然戈盾在右。若天子諸侯親為將，亦居鼓下，故《戎右》雲贊王鼓。成二年齊侯圍龍，齊侯親鼓之是也。若非元帥，則皆在左，御者在中。故成二年韓厥自其車左居中代御而逐齊侯，故杜預雲：“其車自非元帥，御者皆在中。”故熊氏以為雖非元帥，上軍下軍之將亦居鼓下。故成十六年鄢陵之戰，子重將左，而云“子重鼓之”也。故為將皆在鼓下也，以其親鼓，故以為鼓下。案《周禮》諸侯執賁鼓，軍將執晉鼓，師帥執提，旅帥執鼙，豈皆居鼓下也？其義恐非也。“孔子曰：殺人之中，又有禮焉”者。言其既殺人之中，又有禮，則“韔弓”、“揜目”等是也。案《左氏傳》戎昭果毅，獲則殺之。商陽行仁，而孔子善之。傳之所云，謂彼勍敵與我決戰，雖是胡耈，獲則殺之。此謂吳師既走而後逐之義，故云“又及一人”，則是不逐奔之義，故以為有禮也。" }
      - { type: j, text: "諸侯伐秦，曹桓公卒於會。魯成十三年“曹伯廬卒於師”是也。廬諡宣，言桓，聲之誤也。桓依注音宣。諸侯請含，以朋友有相啖食之道。○含，胡闇反。啖，徒暫反。食音嗣，徐音自。使之襲。非也。襲，賤者之事。○襄公朝於荊，康王卒。在魯襄二十八年，康王，楚子昭也。楚言荊者，州言之。荊人曰：“必請襲。”欲使襄公衣之。○衣，於既反。魯人曰：“非禮也。”荊人強之。欲尊康王。○強，其丈反，下注同。巫先拂柩，荊人悔之。巫祝桃茢，君臨臣喪之禮。○拂，芳勿反。柩，其又反。茢音列。" }
      - { type: z, text: "“諸侯”至“悔之”。○正義曰：此一節論諸侯失禮之事。○注“在魯”至“言之”。○正義曰：不言楚而言荊者，楚屬荊，故荊言之也。《春秋》莊十年荊敗蔡師於莘，《公羊傳》曰：“荊者何？州名也。州不若國，國不若氏，氏不若人，人不若名，名不若字，字不若子。”而《左氏》無此義。荊蓋楚之本號，魯莊之世，告命皆稱荊。至僖元年始稱楚，故杜預雲：“荊始改號曰楚。”其“巫祝、桃茢”之事，已具於上。" }
      - { type: j, text: "滕成公之喪，魯昭三年。使子叔敬叔吊，進書，子叔敬叔，魯宣公弟叔肸之曾孫叔弓也。進書，奉君吊書。○肸，許乙反。子服惠伯為介。惠伯，慶父玄孫之子，名椒。介，副也。○介音界，注及後同。及郊，為懿伯之忌不入。郊，滕之近郊也。懿伯，惠伯之叔父。忌，怨也。敬叔有怨於懿伯，難惠伯也。《春秋傳》曰：“敬叔不入。”○難，乃旦反。惠伯曰：“政也，不可以叔父之私，不將公事。”政，君命所為，敬叔於昭穆以懿伯為叔父。○昭，常逆反。遂入。惠伯強之乃入。" }
      - { type: z, text: "“滕成”至“遂入”。○正義曰：此一節論不可以私廢公之事，各依文解之。○注“子叔”至“弓也”。○正義曰：案《世本》：“叔肸生聲伯嬰齊，齊生叔老，老生叔弓。”是叔弓為叔肸曾孫也。叔是其氏，此記雲“子叔”者，子是男子通稱，故以“子”冠“叔”也。○注“惠伯”至“副也”。○正義曰：案《世本》：“慶父生穆伯敖，敖生文伯穀，穀生獻子蔑。”蔑為慶父曾孫，惠伯是蔑之孫，是“慶父玄孫之子”也。案《春秋傳》曰“子服椒”，故知“名椒”也。○“及郊”至“公事”。○敬叔為使，惠伯為介，至滕之近郊。懿伯是惠伯叔父，敬叔於先有怨於懿伯，今至滕郊，為有懿伯之怨，故畏難惠伯不敢入，惠伯知其難已，遂開釋之：“今既奉君命政令，奉使滕國，不可以叔父私怨，遂欲報仇，不行公事也。”○注“郊滕”至“不入”。○正義曰：經直雲“郊”，知是“滕之近郊”者，下雲“不入”。謂不入國城，則郊與國城相近，故知郊是近郊也。知懿伯是惠伯叔父者，以下文惠伯雲“不可以叔父之私，”故知懿伯是惠伯叔父也。雲“敬叔有怨於懿伯，難惠伯也”者，謂敬叔殺懿伯，被懿伯家所怨，恐惠伯殺己，故難惠伯，不敢入也。然敬叔、惠伯同在君朝，又奉使滕國相隨在路，不相畏難，入滕始難者，雖有怨讎，恆為防備，今入滕國，是由主人，其防備之事不復在已，故難之。引《春秋傳》“敬叔不入”者，昭三年《左傳》文。引之者，以經直雲“不入”，恐是惠伯不入，故引以明之。○注“政君”至“叔父”。○正義曰：案《論語》注：“君之教令為政，臣之教令為事也。”故云其事也如有政。雲“敬叔於昭穆以懿伯為叔父”者，此後人轉寫鄭注之誤，當雲“敬叔於昭穆以惠伯為叔父”。撿勘《世本》，敬叔是桓公七世孫，惠伯是桓公六世孫，則惠伯是敬叔之父六從兄弟，則敬叔呼惠伯為叔父，敬叔呼懿伯為五從祖。此注乃雲“敬叔於昭穆以懿伯為叔父”，故知誤也。" }
      - { type: j, text: "哀公使人吊蕢尚，遇諸道，闢於路，畫宮而受吊焉。哀公，魯君也。畫宮，畫地為宮象。○蕢，苦怪反。闢音避，又婢亦反。畫音獲，注同。曾子曰：“蕢尚不如杞梁之妻之知禮也。行吊禮於野，非。齊莊公襲莒於奪，杞梁死焉。魯襄二十二年“齊侯襲莒”是也。《春秋傳》曰：“杞殖、華還載甲夜入且於之隧”，隧、奪，聲相近，或為兌。梁即殖也。○於奪，徒外反，注並“兌”同。杞音豈。殖，時職反。華，胡化反。且，子餘反。其妻迎其柩於路而哭之哀，莊公使人吊之，對曰：“君之臣不免於罪，則將肆諸市朝，而妻妾執。肆，陳屍也。大夫以上於朝，士以下於市。執，拘也。○肆，殺三日陳屍，音四。朝，直遙反。上，詩掌反。拘音俱。君之臣免於罪，則有先人之敝廬在，君無所辱命。”無所辱命，辭不受也。《春秋傳》曰：“齊侯吊諸其室。”○廬，力居反。" }
      - { type: z, text: "“哀公”至“辱命”。○正義曰：此一節論蕢尚不如婦人得禮之事。○注“肆陳”至“拘也”。○正義曰：案《周禮·鄉士職》雲：“協日刑殺，肆之三日。”是陳屍曰肆也。雲“大夫以上於朝，士以下於市”者，謂諸侯、大夫、士也。故襄二十二年楚殺令尹子南，屍諸朝三日。大夫既於朝，士則於市也。其天子臣則有爵者皆適甸師氏，不在朝，故《周禮·掌囚職》雲：“凡有爵者，奉而適甸師氏，以待刑殺。”《掌戮》雲“有爵者殺之於甸師氏”是也。天子士宜在朝，與諸侯大夫同。" }
      - { type: j, text: "孺子<享黃>之喪，魯哀公之少子。○<享黃>，吐孫反。哀公欲設撥，撥，可撥引輴車，所謂紼。○撥，半末反。輴，敕倫反。問於有若。有若曰：“其可也。君之三臣猶設之。”猶，尚也。以臣況子也。三臣，仲孫、叔孫、季孫氏。顏柳曰：“天子龍輴而槨幬，輴，殯車也。畫轅為龍。幬，覆也。殯以槨覆棺而塗之，所謂菆塗龍輴以槨。○槨音郭。幬，大報反。攢塗，才丸反，下音徒。諸侯輴而設幬，輴不畫龍。為榆沈，故設撥。以水澆榆白皮之汁，有急以播地，於引輴車滑。○沈，本又作審，同，昌審反。澆，古堯反。汁，之十反。滑，於八反。三臣者廢輴而設撥，竊禮之不中者也，而君何學焉？”止其學非禮也。廢，去也。紼系於輴，三臣於禮去輴。今有紼，是用輴，僣禮也。殯禮，大夫菆置西序，士掘肂見衽。○中，丁仲反，又如字。學如字，或音戶教反，非，注同。去，羌呂反，下同。掘，求勿反，又求月反，又戶忽反。肂，本又作肄，以二反，棺坎也。見，賢遍反。衽，而審反。" }
      - { type: z, text: "“孺子”至“學焉”。○正義曰：此論諫哀公不得學僣禮之事。○“顏柳”至“學焉”。○顏柳以有若對非其實，恐哀公從之，以其正禮而言。天子之殯，則以龍輴，謂畫輴車轅為龍，載柩於上，累材作槨，而題湊其木，幬覆棺上，而後塗之。其諸侯則以輴載柩，不畫為龍，亦累木為槨，設木於上以幬之，不為題湊，直橫木復之，亦泥塗其上。以其有輴，須設榆沈，備擬牽引。為有榆沈，故須設撥。撥謂紼也。今三臣者，依禮廢輴，不合用殯。今乃設撥用輴，是盜竊於禮，不中法式，而君何得學焉？○注“畫轅”至“以槨”。○正義曰：經直雲“龍輴”，知“畫轅為龍”者，以輴之形狀庳下而寬廣，無似龍形，唯轅與龍為形相類，故知畫轅也。雲“所謂菆，塗龍輴以槨”者，以其上篇有其文，故此言所謂上篇也。輴外邊從累其木，上與槨齊，乃菆木為題湊，為四阿槨，制而塗之。○注“輴不畫龍”。○正義曰：以上雲“龍輴”，此直雲“輴”，故云“不畫龍”。其木亦不題湊，故鄭注《喪大記》雲：“諸侯不題湊。”○注“三臣”至“見衽”。○正義曰：《喪大記》“大夫二綍二碑”，是大夫有綍，綍即紼也。又注《既夕禮》雲：“大夫以上始有四周，謂之輴。”是大夫有輴也。此雲三臣於禮去輴，用輴僣禮，不同者，大夫以柩，朝廟之時用輴繂，惟殯時用輁軸，不得用輴紼。此文據殯時，《大記》及《既夕禮》謂朝廟及下棺也。雲“大夫菆置西序，士掘肂見衽”者，是《喪大記》文。謂菆叢其木，以鄣三面，倚於西序。肂謂穿地為坎，深淺見其棺蓋上小要之衽，言棺上小要之衽出於平地。" }
      - { type: j, text: "悼公之母死，母，哀公之妾。哀公為之齊衰。有若曰：“為妾齊衰，禮與？”譏而問之。妾之貴者，為之緦耳。○為，於偽反，下“為妾”、注“為之”、下“弗為服”皆同，與音餘。公曰：“吾得已乎哉？魯人以妻我。”言國人皆名之為我妻，重服嬖妾，文過，非也。○嬖，必計反。" }
      - { type: z, text: "“悼公”至“妻我”。○正義曰：此一節論哀公為妾著服非禮之事。○注“妾之貴者，為之緦耳”。○正義曰：天子諸侯絕旁期，於妾無服，唯大夫貴妾緦。以哀公為妾著齊衰服，故舉大夫貴妾緦以對之耳。○“公曰：吾得已乎哉？魯人以妻我”者，公以有若之譏，遂文其過，雲：吾豈得休已而不服之乎？所以不得休已者，雖是其妾，魯人以我無夫人，皆以為我妻，故不得不服。" }
      - { type: j, text: "季子皋葬其妻，犯人之禾。季子皋，孔子弟子高柴，孟氏之邑成宰，或氏季。犯，躐也。○躐，力輒反。申祥以告，曰：“請庚之。”申祥，子張子。庚，償也。○庚，古衡反。償，徐音尚。子皋曰：“孟氏不以是罪予，時僣侈。○僣，子念反。侈，昌氏反，又赤氏反。朋友不以是棄予，言非大故。以吾為邑長於斯也，買道而葬，後難繼也。”恃寵虐民，非也。○長，丁丈反。" }
      - { type: z, text: "“季子棄葬其妻”至“繼也”。○正義曰：此一節論高柴非禮之事，各依文解之。○注“季子”至“成宰”。○正義曰：案《史記·仲尼弟子傳》雲：“高柴字子皋，少孔子三十歲，鄭人也。”知為成宰者，下文雲：“子皋為成宰。”雲“季”者，高是其正氏，今言“季子皋”，故鄭雲：“或氏季。”以身處季少，故以字為氏而稱季也，猶若子游稱叔氏，仲由稱季路，皆其例也。《弟子傳》及《論語》作“子羔”，與此文子“皋”字不同者，古字通用。○“子皋”至“繼也”。○子皋見申祥請償，故拒之雲：孟氏不以是犯禾之事罪責於我，以孟氏自為奢暴之故也。朋友不以是犯禾之事離於我，以其小失非大故也。斯，此也。以吾為邑，長於此成邑，乃買道而葬，清儉大過，在後世之人難可繼續也。以孟氏不罪於己，故鄭雲“恃寵”，不肯償禾，故云“虐民”。" }
      - { type: j, text: "仕而未有祿者，君有饋焉曰“獻”，使焉曰“寡君”。見在臣位，與有祿同也。君有饋，有饋於君。○餽，本又作饋，其位反，遺也。使，色吏反。見，賢遍反。違而君薨，弗為服也。以其恩輕也。違，去也。" }
      - { type: z, text: "“仕而”至“服也”。正義曰：此一節論臣之仕未得祿者與得祿之臣有同、有不同之事也。故《王制》雲：“位定然後祿之。”是先位定而後祿也。○“君有饋焉曰獻”者，饋，餉也。“君有饋”，謂臣有物饋獻於君。既奉餉君上，故曰“獻”。○“使焉曰寡君”者，“使焉”，謂為君使往他國。此臣若出使，則自稱已君為“寡君”也。言臣雖仕未得祿，而有物饋君，及出使他國，所稱則並與得祿者同也。嫌其或異，故明之也。○“違而君薨，弗為服也”者，此一條則異也。“違而君薨”者，違，去也，謂三諫不從，以禮去者，若已有祿，恩重者，雖放出仕他國，而所仕者敵，則猶反服。今此未得祿之臣，唯在朝時乃服，若放出他邦，而故君薨，所仕雖敵，亦不反服也，以其本無祿，恩輕故也。" }
      - { type: j, text: "虞而立屍，有几筵，卒哭而諱，諱，闢其名。○闢音避。生事畢而鬼事始已。謂不復饋食於下室，而鬼神祭之。已，辭也。既卒哭，宰夫執木鐸以命於宮曰：“舍故而諱新。”故，為高祖之父當遷者也。《易說》帝乙曰：“《易》之帝乙為成湯，《書》之帝乙六世王，天之錫命，疏可同名。”○鐸，大各反。舍音舍。自寢門至於庫門。百官所在。庫門，宮外門。《明堂位》曰：“庫門，天子皋門。”" }
      - { type: z, text: "“虞而立屍，有几筵，卒哭而諱”至“自寢門至於庫門”。○正義曰：此一節論葬後當以鬼神事之禮。未葬由生事之，故未有屍。既葬，親形已藏，故立屍以系孝子之心也。前所云“既窆，而祝宿虞屍”是也。○“有几筵”者，未葬之前，殯宮雖有脯醢之奠，不立几筵。其大斂之奠，雖在殯宮，但有席而已，亦無幾也。此席素席，故前雲“奠以素器”。其下室之內有吉几筵。今葬訖，既設虞祭，有素几筵。筵雖大斂之時巳有，至於虞祭，更立筵與幾相配，故云“有几筵”，故《士虞禮》雲：“祝免，澡葛絰帶，布席於室中，東面右幾”是也。然此虞祭而有幾，謂士大夫禮。若天子諸侯，則葬前有幾，故《周禮·司几筵》雲：“喪事素幾。”鄭注云：“謂凡奠時，天子既爾，諸侯南面之君其事亦然。”○“卒哭而諱”者，“諱”謂神名也。古者生不相諱，卒哭之前，猶生事之，故不諱。至卒哭，乃有神諱也。○“生事畢而鬼事始已”者，並解所以虞立屍、卒哭而為神諱義也。既虞卒哭、則生事畢，鬼神之義方為始也。○注“謂不”至“辭也”。○正義曰：合釋有屍、有几筵及諱也。“下室”謂內寢，生時飲食有事處也。未葬猶生事，當以脯醢奠殯，又於下室饋設黍稷，謝茲雲：“下室之饋，器物几杖如平生。”鄭君答張逸雲：“未葬，以脯醢奠於殯。又於下室設黍稷，曰饋。下室，內寢也。至朔月月半而殷奠，殷奠有黍稷，而下室不設也。既虞祭，遂用祭禮，下室遂無事也。”然不復饋食於下室，文承卒哭之下，卒哭之時，乃不復饋食於下室。皇氏以為虞則不復饋食於下室，於理有疑。○注“政謂”至“同名”。○正義曰：“高祖之父”，謂孝子高祖之父也。於死者高祖也，卒哭猶未遷，故云“當遷”也。至小祥乃遷毀也。“《易說》帝乙曰：易之帝乙為成湯”者，鄭引《易》證六世不諱，故卒哭而舍高祖之父也。“《易說》”者，鄭引雲《易緯》也。凡鄭雲“說”者，皆緯候也。時禁緯候，故轉“緯”為“說”也。故《鄭志》張逸問：“《禮》注曰‘《書說》’，《書說》何書也？”答曰：“《尚書緯》也。”當為注時，時在文網中，嫌引秘書，故諸所牽圖讖皆謂之“說”雲。案《易》雲：“帝乙歸妹。”《易·乾鑿度說》，《易》之帝乙，謂是殷湯也。“《書》之帝乙六世王”者，亦《易緯》言也。《書·酒誥》有帝乙，而《乾鑿度說》雲：“乙是殷六世王也。”先儒注皆以《酒誥》帝乙，紂父，紂父去湯多世，不啻於六世也。然《史記·殷本紀》雲，王名乙者甚眾，上皆有配字，惟紂父稱帝乙耳。而湯名乙，其六世孫名祖乙，即是六世王也。既併為帝，故皆得曰帝乙也。祖乙是湯六世孫，與湯同名，是六世得同名。雲“天之錫命，疏可同名”者，此注湯緯語也，言帝生之名，由天所錫，則世疏可同，故舉六世以為證也。謂天所錫者，殷以生日甲乙為名，則生日是天之命曰為名也．《白虎通》雲：“殷質，以生日名子也，故殷大甲、帝乙、武丁。”○“自寢門至於庫門”，前既執木鐸以命宮中，又出宮從寢門至於庫門。寢門、路門、庫門，是魯之外門也。百官及宗廟所在之次，至庫門，鹹使知之也。魯三門，故至庫門耳。若天子五門，則至皋門也。故鄭引《明堂位》雲：“庫門，天子皋門也。”若凡諸侯則皋應路也。" }
      - { type: j, text: "二名不偏諱。夫子之毋名“徵在”，言“在”不稱“徵”，言“徵”不稱“在”。稱，舉也。《雜記》曰：“妻之諱不舉諸其側。”" }
      - { type: z, text: "“二名”至“稱在”。○正義曰：此一節論不偏諱之事。○注“稱舉”至“其側”。○正義曰：引《雜記》者，證“稱”是“舉”之義。" }
      - { type: j, text: "軍有憂，則素服哭於庫門之外，憂，謂為敵所敗也。素服者，縞冠也。○敗，必邁反。赴車不載櫜韔。兵不戢，示當報也。以告喪之辭言之，謂還告於國。櫜，甲衣。韔，弓衣。○櫜音羔。<革長>衣亦作韔，敕亮反。戢，側立反。" }
      - { type: z, text: "“軍有”至“櫜韔”。○正義曰：此一節論軍敗當報之事。○“赴軍不載櫜韔”者，軍既有憂，從軍赴國之車，但露載其甲及弓，示有報敵之意，故甲則不以櫜戢之，弓則不以韔戢之，故注云：“兵不戢，示當報也。”○注“以告”至“弓衣”。○正義曰：案《春秋左氏傳》禍福稱“告”，崩薨稱“赴”，今軍敗應稱“告”而稱“赴”，故云：“以告喪之辭言之。”案《詩》雲：“載櫜弓矢。”《春秋傳》雲：“右屬櫜鞬。”皆以櫜為韜弓，此注為“甲衣”者，以下“韔”文，“韔”既是弓衣，故以“櫜”為甲衣。" }
      - { type: j, text: "有焚其先人之室，則三日哭。謂人燒其宗廟。哭者，哀精神之有虧傷。故曰：“新宮火，亦三日哭。”火，人火也。新宮火，在魯成三年。" }
      - { type: z, text: "“有焚”至“日哭”。○正義曰：此一節論哀先人宗廟傷之事。○注“火人”至“三年”。○正義曰：案宣十六年《左傳》雲：“人火曰火，天火曰災。”“新宮”者，魯宣公廟，故成三年《公羊傳》雲：“新宮者何？宣公之宮也。”" }
      - { type: j, text: "孔子過泰山側，有婦人哭於墓者而哀。夫子式而聽之，怪其哀甚。使子路問之，曰：“子之哭也，壹似重有憂者。”而曰：“然，昔者吾舅死於虎，吾夫又死焉，今吾子又死焉。而猶乃也。夫之父曰舅。○重，直用反。夫子曰：“何為不去也？”曰：“無苛政。”夫子曰：“小子識之，苛政猛於虎也。”苛音何，本亦作荷。識，申吉反，又如字。" }
      - { type: z, text: "“孔子”至“虎也”。○正義曰：此一節論苛政嚴於猛虎之事。○“子之哭也，壹似重有憂者”。○言子之哭也，壹似重疊有憂喪者也。“壹”者，決定之辭也。○“而曰然”者，而，乃也。婦人哭畢，乃答之曰“然”。“然”猶如是，是重疊有憂也。" }
      - { type: j, text: "魯人有周豐也者，哀公執摯請見之，下賢也。摯，禽摯也。諸侯而用禽摯，降尊就卑之義。○摯音志。下，戶嫁反。而曰不可。辭君以尊見卑。士禮，先生異爵者，請見之則辭。公曰：“我其已夫。”已，止也。重強變賢。○夫音符。強，其丈反。使人問焉，曰：“有虞氏未施信於民，而民信之。夏后氏未施敬於民，而民敬之。何施而得斯於民也？”時公與三桓始有惡，懼將不安。對曰：“墟墓之間，未施哀於民而民哀。社稷宗廟之中，未施敬於民而民敬。言民見悲哀之處則悲哀，見莊敬之處則莊敬，非必有使之者。墟，毀滅無後之地。○虛，本亦作墟，同，魚起反，注同。處，昌慮反，下同。殷人作誓而民始畔，周人作會而民始疑。會謂盟也。盟、誓所以結眾以信，其後外恃眾而信不由中，則民畔、疑之。孔子曰：“其身正，不令而行；其身不正，雖令不從。”苟無禮義、忠信、誠愨之心以涖之，雖固結之，民其不解乎？”涖，臨。○涖音利，又音類。解，佳買反，舊胡買反。" }
      - { type: z, text: "“魯人”至“解乎”。○正義曰：此一節論君之臨臣民當以禮義忠信為本之事，各依文解之。○“何施而得斯於民也”者。○“有虞氏未施信於民，而民信之。夏后氏未施敬於民，而民敬之”，言虞之與夏施何政教以化民。斯，此也，而得如此敬信於民也。○“對曰”至“民敬”。○周豐之意，以虞之與夏，由行敬信於民，民見其敬信，民自學之，不須設言號令。故云，古昔丘墟及墳墓之間，是所悲哀之處也。人在其所，未須施設教化令民使哀，而民自哀也。社稷宗廟之中，嚴凝之處，人在其所，未須施設教化而民自敬。言民之從君，在君身所行，不在言也。若身之不行，言亦無益。故殷人作誓，由身不自行，徒有言誓而民始畔也。周人作會，為身無誠信，而民始疑。苟，誠也。人君之身，誠無禮義、忠信、誠實質愨之心以臨化之，雖以言辭誓令堅固結之，民其不解散離貳乎？言當解散離貳也。周豐此言，欲令哀公身行敬信，不當唯以言辭率下而已。○注“墟，毀滅無後之地”。○正義曰：凡舊居皆曰“墟”，故《左傳》有“莘氏之墟”，有“昆吾之墟”，故知“毀滅無後”者，以可悲哀，故為無後也。○注“會謂”至“疑之”。○正義曰：案昭三年《左傳》雲“有事而會，不協而盟”，則盟、會別也。知此“會”謂“盟”者，以雲“而民始疑”，《司盟》雲“邦國有疑則盟詛之”，故以“會”為“盟”也。案《尚書》夏啟作《甘誓》，此言“殷人作誓”；《左傳》雲“夏啟有塗山之會”，又“禹會塗山”，此雲“周人作會”者，此據身無誠信，徒作誓盟，民因誓因盟而始疑畔，非謂殷人始作誓，周人始作會。若夏啟作《甘誓》，禹會塗山，皆身有誠信，於事善也。《穀梁傳》雲“告誓不及五帝，盟詛不及茸荃”者，五帝茸荃，身行德義，不專用誥誓盟詛，故云“不及”，與此不同。雲“信不由中，則民畔疑之”者，隱三年《左傳》雲：“信不由中，質無益也。”紂為苛政而作誓命，民乃畔之，亦是畔疑之事也。" }
      - { type: j, text: "喪不慮居，謂賣舍宅以奉喪。毀不危身，謂憔悴將滅性。○憔，在遙反。悴，在醉反。喪不慮居，為無廟也。毀不危身，為無後也。" }
      - { type: j, text: "延陵季子適齊，於其反也，其長子死，葬於贏、博之間。季子名札，魯昭二十七年，“吳公子札聘於上國”是也。季子讓國居延陵，因號焉。《春秋傳》謂延陵，延州來。贏、博，齊地，今泰山縣是也。○為，於偽反，下同。長，丁丈反，下“官長”並注同。贏音盈。札，側八反，孔子曰：“延陵季子，吳之習於禮者也。”往而觀其葬焉。往吊之。其坎深不至於泉，以生恕死。○深，式鴆反。其斂以時服，以時行之服，不改制節。既葬而封，廣輪揜坎，其高可隱也。示節也。輪，從也。隱，據也。封可手據，謂高四尺。○廣，古曠反。揜，本又作掩，於斂反。隱，於刃反，注同。從，子容反。" }
      - { type: z, text: "“延陵”至“隱也”。○正義曰：此一節論仲尼雲季子得禮之事，各依文解之。○注“季子”至“是也”。正義曰：知“季子名札”者，案襄二十九年“吳公子札來聘”，是名札也。又案襄二十九年季札來聘於魯，遂往聘齊、衛及晉，知非此時子死，而云昭二十七年聘上國者，此雲孔子聞之、往而觀其葬焉，若襄二十九年孔子才年九歲，焉得觀其葬而善之？故為昭二十七年也。雲“讓國居延陵”者，《春秋》襄二十九年，“吳公子札來聘”。《公羊》雲：“吳無君，無大夫，此何以有君，有大夫？賢季子也。何賢乎季子？讓國也。謁也，餘祭也，夷昧也，與季子同母者四。季子弱而才，兄弟皆愛之，同欲立之以為君。兄弟迭為君，而致國乎季子，皆曰：‘諾。’故諸為君者皆輕死為勇，飲食必祝曰：‘天苟有吳國，尚速有悔於予身。’及闔廬使專諸剌僚，而致國乎季子，季子不受，去，之延陵，終身不入吳國。”此即季子本封延陵，後讓國又居之，鄭舉後事言耳。延陵一名延州來，故《左傳》雲“延州來季子聘於上國”，所以鄭又引以會之，雲《春秋傳》謂延陵“延州來”，即此經延陵，即《左傳》延州來，明是一也。○注“以生恕死”。○正義曰：言坎以深不至泉，以生時不欲近泉，故死亦不至於泉，以生時之意，以恕於死者。○注“亦節”至“尺所”。○正義曰：以上斂以行時之服，不更製造，是其節也。今封墳廣輪揜坎，其高可隱，又是有其節制，故云“亦節”也。雲“謂高四尺所”者，言墳之高可四尺之所，以人長八尺，低而據之，半為四尺，且約上墳崇四尺，故云四尺所。“所”是不定之辭。既封，左袒，右還其封且號者三。曰：“骨肉歸復於土，命也。若魂氣則無不之也，無不之也。”還，圍也。號，哭且言也。命猶性也。○號，戶高反，注同。而遂行。行，去也。孔子曰：“延陵季子之於禮也，其合矣乎。”" }
      - { type: z, text: "“既封”至“矣乎”。○正義曰：既封墳巳竟，季子乃左袒其衣。案鄭注《覲禮》雲：“凡以禮事者左袒，若請罪待刑則右袒。”故《覲禮》雲“乃右肉袒於廟門之東”，在喪亦是禮事，故《喪禮》直雲“袒”，不雲左右。今季子長子之喪而左袒者，季子達死生之命，雲骨肉歸復於土，不須哀戚，以自寬慰，故從吉禮也。左袒訖，乃右而圍繞其封，兼且號哭而繞墳三匝也。號哭且言，曰，骨肉歸復於土，此是命也。命，性也。言自然之性，當歸復於土。言“歸復”者，言人之骨肉，由食土物而生，今還入土，故云“歸復”。若神魂之氣，則游於地上，故云則無不之適也。言無所不之適，上或適於天，旁適四方，不可更及。再言之者，愍傷離決之意。" }
      - { type: j, text: "邾婁考公之喪，考公，隱公益之曾孫，考或為定。○婁，力俱反，下同。徐君使容居來吊、含。吊且含。○含，胡闇反，注及下同。曰：“寡君使容居坐含，進侯玉。”其使容居以含。欲親含，非也。含不使賤者，君行則親含，大夫歸含耳。言侯玉者，時徐僣稱王，自比天子。○僣，子念反。有司曰：“諸侯之來辱敝邑者，易則易，於則於，易》於雜者，未之有也。”易謂臣禮，於謂君禮，雜者，容居以臣欲行君禮。徐自比天子，使大夫敵諸侯，有司拒之。○易則易，並以豉反，下及注同。拒，本又作距。容居對曰：“容居聞之，事君不敢忘其君，亦不敢遺其祖。昔我先君駒王西討，濟於河，無所不用斯言也。容居，魯人也。不敢忘其祖。”言我祖與今君於諸侯初如是，不聞義則服。駒王，徐先君僣號，容居，其子孫也。濟，渡也，言西討渡於河，廣大其國，魯，魯鈍也。言魯鈍者，欲自明不妄。○頓，徒困反，本亦作鈍。" }
      - { type: z, text: "“邾婁”至“其祖”。○正義曰：此一節論徐之僣禮之事。○邾婁考公之喪，徐君使大夫容居來吊且含。容居致其君命，雲：寡君使容居親坐行含，進侯玉於邾君。此是使致之辭也。○“其使容居以含”者，此是記人錄語，雲其使容居奉玉以行含禮。邾人有司乃拒之曰，諸侯之來屈辱臨於敝邑者，若是臣來，其禮簡易者，則行臣之簡易之禮。“於”謂廣大。若君來，其禮廣大者，則行君之廣大之禮。“易於雜”者，謂應簡易而為廣大，實是臣而行君禮，是君臣雜亂者，未之有也，謂由來未有此禮。容居乃對邾之有司雲：“容居聞之。”謂聞於舊日之言。雲臣之事君，奉命出使，不敢忘其君之言。子孫事祖，當光揚先祖，亦不敢遺棄其先祖言。即不遺先祖之事也。○“昔我先君駒王西討，濟於河”，言國土廣大。○“無所不用斯言也”者，“所”謂處所。斯，此也。謂我從先君駒王以來，於諸侯無一處不用此稱王之言也。言我對諸侯恆稱王也。容居恐邾人謂其虛誕，故云魯鈍之人，不解虛詐，唯知不敢忘其先祖。容居雲此者，先祖實有此事不虛也。上雲“不敢忘其君，不敢遺其祖”，下直雲“不敢遺其祖”者，祖是久遠，猶尚不遺忘，君見存，是不忘可悉，故不言也。其言先祖，即是不忘君。○注“君行”至“天子”。○正義曰：知“君行則親含”者，上雲“曹桓公卒於會，諸侯請含”是也。言“大夫歸含”者，上《雜記》諸侯之喪，君使人吊含贈襚是也。雲“言侯玉”者，徐自比於天子，以邾君為已之諸侯，言進侯氏以玉，故云“進侯玉”。案《春秋》昭三十年吳滅徐，此雲“徐僣稱王”者，滅而復興，至春秋之後，僣號強大稱王，猶楚滅陳、蔡後更興。○注“易謂”至“拒之”。○正義曰：“易”是簡易，故為臣禮易。既為臣禮，以對於“於”，故知“於”為君禮也。君禮謂之“於”者，“於”音近迂，迂是廣大之義，故《論語》雲：“子之迂也。”與此同也。“徐自比天子，使大夫敵諸侯”者，若諸侯使大夫親含諸侯，則不可，若天子使大夫敵諸侯，則得親含。徐欲自比天子，故有司拒之。○注“言我”至“不妄”。○正義曰：言我之先祖駒王與今日徐君稱謂於諸侯，自初以來如是，稱王非始今日。雲“容居，其子孫也”者，以經雲“不敢遺其祖”，即雲“我先君駒王”，故知容居是駒王子孫。雲“自明不妄”者，我若是曉利之人，或妄稱先祖之善，自言魯鈍，似若無識，知言語樸實，故言“欲自明不妄”。凡實行含禮，未斂之前，以玉實口。士則主人親含大夫以上即使人含若既斂已後至殯葬其有含者，親自致璧於柩及殯上者，謂之親含，若但致命，以璧授主人，主人受之，謂之不親含。" }
      - { type: j, text: "子思之母死於衛，嫁母也，姓庶氏。赴於子思，子思哭於廟。門人至，曰：“庶氏之母死，何為哭於孔氏之廟乎？”門人，弟子也。嫁母與廟絕族。子思曰：“吾過矣，吾過矣。”遂哭於他室。" }
      - { type: j, text: "天子崩，三日，祝先服。祝佐含斂先病。○祝，之六反。五日官長服。官長，大夫、士。七日，國中男女服。庶人。三日，天下服。諸侯之大夫。虞人致百祀之木，可以為棺槨者斬之。虞人，掌山澤之官。百祀，畿內百縣之祀也。以為棺槨，作棺槨也。斬，伐也。○畿音祈。不至者，廢其祀，刎其人。○刎，勿粉反，徐亡粉反。" }
      - { type: z, text: "“天子”至“其人”。○正義曰：此一節論天子崩，尊卑服杖及葬備槨材之事。“天子崩，三日，祝先服”者，祝，大祝商祝也。服，服杖也。是喪服之數，故呼杖為服。祝佐含斂先病，故先杖也。然雲祝服，故子亦三日而杖也。○“五日，官長服”者，大夫、士也，亦服杖也。病在祝後，故五日也。○“七日，國中男女服”者，謂畿內民及庶人在官者服，謂齊衰三月而除之。必待七日者，天子七日而殯，殯後嗣王成服，故民得成服也。○“三月天下服”者，謂諸侯之大夫為王繐衰，既葬而除之也。近者亦不待三月，今據遠者為言耳。然四條皆雲“服”，何以知其或杖服，或衰服？案《喪大記》雲：“君之喪三日，子大夫人杖。五日既殯，授大夫世婦杖。”又《喪服四制》雲：“三日授子杖，五日授大夫杖，七日授士杖。”案如《大記》及《四制》，則知今雲三日五日，是服杖明矣，其七日及三月者，唯服而已，無杖。《四制》雲“七日授士杖”，此雲五日士杖者，士若有地、德深者則五日，若無地、德薄則七日。崔氏雲：“此據朝廷之士，《四制》是邑宰之士也。”○“虞人致百祀之木，可以為棺槨者斬之”，謂王殯後事也。“虞人”者，主山澤之官也。“百祀”者，王畿內諸臣采地之祀也。言“百”者，舉其全數也。既殯，旬而布材，故虞人斬百祀之木可以為周棺之槨者送之也。必取祀木者，賀瑒雲：“君者德著幽顯，若存，則人神均其慶，沒，則靈祗等其衰傷也。”" }
      - { type: j, text: "齊大飢，黔敖為食於路，以待餓者而食之。有餓者蒙袂輯屨，貿貿然來。蒙袂，不欲見人也。輯，斂也。斂屨，力憊不能屨也。貿貿，目不明之貌。○飢，居宜反，《字林》九依反，本又作飢，同。黔，其廉反，徐渠嚴反。而食音嗣，下“奉食”同。袂，彌世反。輯，側立反。貿，徐亡救反，又音茂，一音牟。斂，力檢反，下同。黔敖左奉食，右執飲曰：“嗟來食，揚其目而視之，曰：“予唯不食嗟來之食，以至於斯也。”嗟來食，雖閔而呼之，非敬辭。○奉，芳勇反。從而謝焉，終不食而死。從猶就也。曾子聞之曰：“微與！其嗟也可去，其謝也“可食”。微猶無也。無與，止其狂狷之辭。○與音餘，注同。狷音絹。" }
      - { type: z, text: "“齊大”至“可食”。○正義曰：此一節論飢者狂狷之事。○黔敖既見餓者而來，乃左奉其飯，右執其飲，見其餓者困，諮嗟愍之，故曰：嗟乎，來食！餓者聞其嗟已，無敬已之心，於是發怒，揚舉其目而視之曰：予唯不食嗟來無禮之食，以至於斯。斯，此也，以至於此病困。怒而遂去。黔敖從逐其後，辭謝焉。餓者終不食而死。“曾子聞之曰：微與”者，微，無也；與，語助。言餓者無得如是與。初時無禮之嗟也，可怒之而去。其終有禮之謝也，可反回而食。曾子嫌其狂狷，故為此辭。狂者進取，一概之善，仰法夷齊耿介，狷者直申已意，不從無禮之為，而餓者有此二性，故止之。" }
      - { type: j, text: "邾婁定公之時，有弒其父者。定公，玃且也。魯文十四年即位。○有殺，本又作弒，同，式志反，下“臣殺”、“子殺”同。玃，俱縛反。且，子餘反。有司以告，公瞿然失席，曰：“是寡人之罪也。”民之無禮，教之罪。○瞿，本又作懼，紀具反。曰：“寡人嘗學斷斯獄矣。臣弒君，凡在官者，殺無赦。子弒父，凡在宮者，殺無赦。言諸臣子孫無尊卑皆得殺之，其罪無赦。○斷，丁亂反。殺其人，壞其室，洿其宮而豬焉。明其大逆，不欲人復處之。豬，都也。南方謂都為豬。○殺如字。壞音怪。洿音烏。<豕者>音誅。復，扶又反。蓋君逾月而後舉爵。”自貶損。" }
      - { type: z, text: "“邾婁”至“舉爵”。○正義曰：此一節論誅弒父之事。○“曰寡”至“無赦”。○定公既見有司告以人弒其父，乃言曰：寡人嘗試學斷此弒父之獄矣，臣之弒君，凡在官之人，無問貴賤，皆得殺此弒君之人，無得縱赦之也。子之弒父，凡在宮者，無問尊卑，皆得殺此弒父之人，不得縱赦之。此“在宮”字，諸本或為“在官”，恐與上“在官”相涉而誤也。○注“言諸”至“無赦”。○正義曰：言“諸臣”，解“在官”者，言“子孫”，解“在宮”者。言此等之人，若見弒君弒父之人，無問尊卑，皆得殺之。謂理合得殺，若力所不能，亦不責也。故《春秋》崔杼弒莊公，而晏子不討崔杼，而不責晏子。若力能討而不討，則責之。《春秋》董狐書趙盾雲“子為正卿，亡不出竟，反不討賊，書以弒君”是也。鄭此雲子孫無問尊卑，皆得殺之，則似父之弒祖，子得殺父。然子之於父，天性也，父雖不孝於祖，子不可不孝於父。今雲“子”者，因“孫”而連言之，或容兄弟之子耳。除子以外，皆得殺其弒父之人。《異義》：“衛輒拒父，《公羊》以為孝子不以父命辭王父之命，許拒其父。《左氏》以為子而拒父，悖德逆倫，大惡也。”鄭《駁異義》雲：“以父子私恩言之，則傷仁恩。”則鄭意以《公羊》所云，公義也；《左氏》所云，是私恩也。故知今子之報殺其父是傷仁恩也。若妻則得殺其弒父之夫，故《異義》雲：“妻甲夫乙歐母，甲見乙歐母而殺乙。《公羊》說甲為姑討夫，猶武王為天誅紂。”鄭駁之雲：“乙雖不孝，但歐之耳，殺之太甚。凡在宮者，未得殺之。殺之者，士官也。”知鄭此言，歐母，妻不得殺之；若其殺母，妻得殺之。○注“豬都”至“為豬”。○正義曰：案孔注《尚書》雲：“都謂所聚也。”此經雲“洿其宮而豬焉”，謂掘洿其宮，使水之聚積焉，故云“豬，都也”。鄭恐豬不得為都，故引南方之人謂都為豬，則“彭蠡既豬”，豬是水聚之名也。" }
      - { type: j, text: "晉獻文子成室，晉大夫發焉。文子，趙武也。作室成，晉君獻之，謂賀也。諸大夫亦發禮以往。張老曰：“美哉輪焉！美哉奐焉！心譏其奢也。輪，輪囷，言高大。奐，言眾多。○奐音渙，本亦作煥。奐爛，言眾多也。囷，起倫反。歌於斯，哭於斯，聚國族於斯。”祭祀、死喪、燕會於此足矣。言此者，欲防其後復為。文子曰：“武也得歌於斯，哭於斯，聚國族於斯，是全要領以從先大夫於九京也。”北面再拜稽首。全要領者，免於刑誅也。晉卿大夫之墓地在九原。京蓋字之誤，當為原。○要，一遙反，注及下注“要君”同。京音原，下同，下亦作“原”字。君子謂之善頌善禱。善頌，謂張老之言。善禱，謂文子之言。禱，求也。○禱，丁老反，祈也。" }
      - { type: z, text: "“晉獻”至“善禱”。○正義曰：此一節論文子成室相禱頌之事，各隨文解之。○“晉獻文子成室”者，“獻”謂慶賀也。文子，晉卿趙武也。“成室”，謂文子作宮室成也。文子宮室成，晉咀薺賀也。○“晉大夫發焉”者，發，禮也。晉君既賀，則朝廷大夫併發禮同從咀薺賀之。“張老曰：美哉輪焉”者，張老亦往慶之一大夫也。心譏文子宮室飾麗，故佯而美之也。“輪”謂輪囷高大也。《春秋外傳》曰“趙文子為室，斫其椽而礱之，張老諫之”，是也。○“美哉奐焉”者，“奐”謂其室奐爛眾多也。既高又多文飾，故重美之。王雲：“奐，言其文章之貌也。”○“歌於斯”者，“歌”謂祭祀時奏樂也。斯，此也。張老前美其飾麗，後又防更造也，言此室可以祭祀歌樂也。然大夫祭無樂，而春秋時或有之也。○“哭於斯”者，又言此室亦足居喪哭泣位也。○“聚國族於斯”者，又言此室可以燕聚國賓及會宗族也。終始永足，切勿復更造作。○“文子曰：武也得歌於斯，哭於斯，聚國族於斯”者，武，文子名也。文子覺譏，故稱名自陳，將自陳數前譏，具領述張老之言也。○“是全要領以從先大夫於九京也”者，領，頸也。古者罪重要斬，罪輕頸刑也。“先大夫”，謂文子父祖，以其世為大夫，故稱父祖為“先大夫”也。九原，文子家世舊葬地也。文子述張老語竟，故說此自陳也。言若得保此宅以歌哭，終於餘年，不被罪討，是完全要領，壽終而卒，以從先大夫葬於九原也。○“北面再拜稽首”者，辭畢，乃稽首謝過受諫也。“北面”者，在堂禮也。故《鄉飲酒禮》賓主皆北面拜。○“君子謂之善頌、善禱”者，“君子”者，知禮之人也。見張老與文子皆能中禮，故善之也。“頌”者，美盛德之形容。“禱”者，求福以自輔也。張老因美而譏之，故為“善頌”。文子聞過即服而拜，故為“善禱”也。○注“晉卿”至“為原”。○正義曰：案《墓大夫》雲：“令國民族葬。”注云：“族葬各從其親。”是卿大夫墓地得同在一處。知“京”當為“原”者，案《韓詩外傳》雲：“晉趙武與叔向觀於九原。”又《爾雅》雲：“絕高為京，廣平曰原。”非葬之處，原是墳墓之所，故為原也。" }
      - { type: j, text: "仲尼之畜狗死，畜狗，馴守。○畜，許六反，又許又反。馴守，上音巡，下如字，又手又反。使子貢埋之，曰：“吾聞之也，敝帷不棄，為埋馬也。敝蓋不棄，為埋狗也。棄也貧，無蓋，於其封也，亦予之席，毋使其首陷焉。”封當為窆。陷，謂沒於土。○貢，本亦作贛，音同。為埋，於偽反，下亡皆反，下並同。狗，古口反。封，彼劍反，出注。路馬死，埋之以帷。路馬，君所乘者。其他狗馬，不能以帷蓋。" }
      - { type: j, text: "季孫之母死，哀公吊焉。曾子與子貢吊焉，閽人為君在，弗內也。閽人，守門者。○閽音昏。弗內，上如字，下音納。曾子與子貢入於其廄而脩容焉。更莊飾。○廄，久又反。子貢先入，閽人曰：“鄉者已告矣。”既不敢止，以言下之。○鄉，許亮反，下戶嫁反。曾子後入，閽人闢之。見兩賢相隨，彌益恭也。○闢音避，下同。涉內霤，卿大夫皆闢位，公降一等而揖之。禮之。○霤，力又反。君子言之曰：“盡飾之道，斯其行者遠矣。”" }
      - { type: z, text: "“季孫”至“遠矣”。○正義曰：此一節論君子加服，人乃敬之事。○“卿大”至“遠矣”。○二子既入涉至內霤，卿與大夫皆逡巡闢位，公於堂上降階一等，揖而禮之。於時君子以二子盛飾備禮，遂美之雲，凡人盡其容飾，則被崇禮。其盡飾道理，斯，此，此其施行可久遠矣。所以可久遠者，以二子初時不具衣服，則閽人拒之。二子退而脩容，閽人雖是愚鄙，猶知敬畏，明其不愚之人則敬畏可知。是其盡飾之道，行之可長遠矣。案《喪大禮》君臨大夫之喪，“君即位於序端，卿大夫即位於堂廉楹西，北面東上”。是闢位者蓋少西，逡巡而東面，不當北面之位。然君在，大夫得斯為二子闢位者，卿大夫等見公將降，故先闢位。或可此公始入升堂之後，卿大夫猶庭中北面。“闢位”者，謂闢中庭之位，少近東耳。又吊有常服，而得特為盡飾者，謂更服新衣也。" }
      - { type: j, text: "陽門之介夫死，陽門，宋國門名。介夫，甲衛士。司城子罕入而哭之哀。宋以武公諱司空為司城。子罕，戴公子樂甫術之後樂喜也。○罕，籲旱反。晉人之覘宋者，反報於晉侯曰：“陽門之介夫死，而子罕哭之哀，而民說，殆不可伐也。”覘，闚視也。○覘，敕廉反，下同。說音悅，下注同。闚，去規反。孔子聞之曰：“善哉覘國乎！善其知微。《詩》雲：‘凡民有喪，扶服救之。’救猶助也。○扶服，並如字，又上音蒲，下音蒲北反，本又作匍匐，音同。雖微晉而已，天下其孰能當之？微猶非也。○當，丁郎反。" }
      - { type: z, text: "“陽門”至“當之”。○正義曰：此一節論善覘國之事，各依文解之。○注“宋以”至“喜也”。○正義曰：“宋以武公諱司空”者，桓六年《左傳》申繻之辭也。知有“司城”者，以春秋之時，唯宋有司城，無司空；又《冬官·考工記》“匠人營國”，是司空主營城郭，故知廢司空為司城。服虔、杜預注傳皆以為然。雲“子罕，戴公子樂甫術之後”者，案《世本》：“戴公生樂甫術，術生石甫原繹，繹生夷甫傾，傾生東鄉克，克生西鄉士曹，曹生子罕喜。”是子罕為術之五世孫也。○“殆不可伐也”者，言介夫匹庶之賤人，而子罕是國之卿相，以貴哭賤，感動民心，皆喜悅，與上共同死生。若有人伐，民必致死，故云“殆不可伐也”。殆，近也。不能正執，故云“殆不可伐”，為疑辭也。○“《詩》雲”至“當之”。○引《詩·邶·穀風》之篇也。時有愛其新昏，棄其舊室，舊室恨之：我初來之時，為女盡力。所以盡力者，以凡人家死喪，鄰里尚扶服盡力往救助之，況我於女夫家而何得不盡力？今此引《詩》斷章雲“凡民有喪”，則“陽門之介夫死”是也。在上扶服而救助之，則子罕哭之哀是也。○“雖微晉而已”者，微，非也。言晉之強盛，猶不能當宋，雖非晉之強，天下更有強於晉者，誰能當之？言縱有強者，不能當宋。“而已”是助語句也。" }
      - { type: j, text: "魯莊公之喪，既葬，而絰不入庫門。時子般弒，慶父作亂，閔公不敢居喪，葬己，吉服而反。正君臣，欲以防遏之。微弱之至。○般音斑。弒音試。遏，於葛反。士大夫既卒哭，麻不入。麻猶絰也。群臣畢虞卒哭，亦除喪也。閔公既吉服，不與虞卒哭。○與音預。" }
      - { type: z, text: "“魯莊”至“不入”。○正義曰：此一節論禮變所由也。莊公，閔公父也。絰，葛絰也。諸侯弁絰葛而葬也。魯之庫門，天子之皋門也。莊公以三十二年薨，大子般立。十月已未，共仲使圉人犖賊子般於黨氏，立閔公，慶父作亂。閔公時年八歲，不敢居喪三年，既葬竟，除凶服於外，吉服反，以正君臣，故絰不入庫門也。所以至庫門而去絰。○注“時子”至“而反”。○正義曰：案《春秋左氏傳》：“慶父使圉人犖賊子般於黨氏。”是子般弒、慶父作亂之事也。雲“閔公不敢居喪”者，閔公是莊公之子，夫人哀姜之娣叔姜所生，以葬畢即除服，故云“不敢居喪”。經雲“絰不入”者，謂葛絰，故前文雲：“天子諸侯葛絰帶而葬。”所以雲“不入庫門”者，以魯有三門庫、雉、路，庫門最在外，以從外來，故“絰不入庫門”。絰既不入，衰亦不入可知也。○注“麻猶”至“卒哭”。○正義曰：經雲“大夫既卒哭，麻不入”，上雲“絰不入”，故云“麻猶絰也”。其實上是君身，絰用葛，士大夫是臣，故絰用麻也。雲：“群臣畢虞卒哭，亦除喪也”者，亦閔公也。閔公葬而除喪，今群臣卒哭乃除喪者，以閔公既葬，須即位正君臣，故既葬而除，群臣須行虞卒哭之際，故卒哭乃除之。雲“閔公既吉服，不與虞卒哭”者，按《論語》雲“羔裘玄冠，不以吊”，虞卒哭並是凶事，閔公既服吉服，故不與也。此雲“麻不入”者，承上“庫門”，亦謂不入庫門也，謂卒哭已後，麻不復入。按《喪服》注“卿大夫既虞、士卒哭而受服”，則既虞服葛。此卒哭之麻不入者，皇氏雲：“時禍亂迫蹙，君既服吉服，故士大夫既虞不復受服，至卒哭總除。”" }
      - { type: j, text: "孔子之故人曰原壤，其母死，夫子助之沐槨。沐，治也。○壤，如丈反。原壤登木曰：“久矣，予之不託於音也。”木，槨材也。託，寄也，謂叩木以作音。○材音才。歌曰：“貍首之班然，執女手之卷然。”說人辭也。○貍，力知反。女如字，徐音汝。卷音權，本又作拳。夫子為弗聞也者而過之。佯不知。○佯音羊。從者曰：“子未可以已乎？”已猶止也。○從，才用反。以、已並音以。夫子曰：“丘聞之，親者毋失其為親也，故者毋失其為故也。”" }
      - { type: z, text: "“孔子”至“故也”。○正義曰：此一節論孔子無大故不遺故舊之事。○原壤登槨材而言曰：久矣，予之不託於音也。託，寄也，謂我遭喪母以來，日月久矣。我不得託寄此木以為音聲，於是乎叩木作音，口為歌。“曰：貍首之班然”者，言言斫材文采，似貍之首。○“執女手之卷然”者，孔子手執斤斧，如女子之手，卷卷然而柔弱。以此歡說仲尼，故注云“說人辭也”。然在喪而歌，非禮之甚，夫子為若不聞也者而過去之。從者見其無禮，謂夫子曰：“彼既無禮，子未可休已乎？”言應可休已，不須為治槨也。夫子對從者曰：朋友無大故，不相遺棄，丘聞之，與我骨肉親者雖有非禮，無失其為親之道，尚得與之和睦；故舊者雖有非禮，無失其為故之道，尚得往來。原壤有非禮，既是故舊，身無殺父害君之故，何以絕之？按《論語》雲：“主忠信，無友不如已者，”《左傳》吳季札譏叔孫穆子好善而不能擇人。原壤母死，登木而歌，夫子聖人，與之為友者，《論語》雲“無友不如已者”，謂方始為交游，須擇賢友。《左傳》雲“好善而不能擇人”者，謂不善之人，不可委之以政。今原壤是夫子故舊，為日已久。或平生舊交，或親屬恩好，苟無大惡，不可輒離。故《論語》雲：“故舊無大故，則不相遺棄。”彼注云：“大故謂惡逆之事。”殺父害君，乃為大故，雖登木之歌，未至於此。且夫子聖人，誨人不倦。宰我請喪親一期，終助陳桓之亂，互鄉童子，許其求進之情，故志在攜獎，不簡善惡。原壤為舊，何足怪也？而皇氏雲：“原壤是上聖之人，或雲是方外之士，離文棄本，不拘禮節，妄為流宕，非但敗於名教，亦是誤於學者。”義不可用。其雲原壤中庸下愚，義實得矣。" }
      - { type: j, text: "趙文子與叔譽觀乎九原。叔譽，叔向也，晉羊舌大夫之孫，名肸。○譽音預。向，許亮反。肸，許乙反。文子曰：“死者如可作也，吾誰與歸？”作，起也。叔譽曰：“其陽處父乎？”陽處父，襄公之大傅。○父音甫，注同。傅音賦。文子曰：“行並植於晉國，不沒其身，其知不足稱也。”並猶專也，謂剛而專已，為狐射姑所殺。沒，終也。植或為特。○行，舊下孟反，皇如字。並，必正反，注同。植，直吏反，又時力反，注同。知音智，射音亦，又音夜。“其舅犯乎？”文子曰：“見利不顧其君，其仁不足稱也。謂久與文公闢難，至將反國，無安君之心，及河授璧，詐請亡，要君以利是也。○難，乃旦反。要，一遙反。我則隨武子乎？利其君，不忘其身。謀其身，不遺其友。”武子，士會也，食邑於隨、範，字季。晉人謂文子知人。見其所善於前，則知其來所舉。文子其中退然如不勝衣，中，身也。退，柔和貌。《鄉射記》曰：“居二寸以為侯中。”退或為妥。○追然音退，本亦作退。勝音升。妥，他果反。其言吶吶然如不出其口。吶吶，舒小貌。○吶，如悅反，徐似劣反。所舉於晉國管庫之士七十有餘家，管庫之士，府史以下，官長所置也。舉之於君，以為大夫、士也。管，鍵也。庫，物所藏。○長，丁丈反。鍵，其展反，徐其偃反，鑰也。生不交利，廉也。死不屬其子焉。潔也。○屬音燭。" }
      - { type: z, text: "“趙文”至“子焉”。○正義曰：此一節論趙文子知人之事，各依文解之。○注“叔譽”至“名肸”。○正義曰：知叔譽是叔曏者，案《韓詩外傳》雲：“趙文子與叔向觀於九原。”故知叔譽是叔向也。雲“晉羊舌大夫之孫名肸”者，案《左氏》羊舌是邑名，晉大夫公族為羊舌大夫也。故閔二年《左傳》雲：“羊舌大夫為尉。”羊舌大夫生羊舌職，職生叔向，是羊舌大夫之孫也。又昭三年《左傳》叔向與齊晏子語云：“肸又無子。”是名肸。“死者如可作也，吾誰與歸”者，○文子云：此處先世大夫死者既眾，假令生而可作起，吾於眾大夫之內，而誰最賢，可以與歸？○“文子”至“稱也”者，“並”猶專也，“植”謂剛也，文子曰言處父唯行專權剛強於晉國，自招殺害，不得以理終沒其身，是不能防身遠害，以其無知故也。故云“其知不足稱”也。○注“並猶”至“為特”。○正義曰：“並”者謂並他事以為已有，是專權之事，故云並猶專也。雲“謂剛而專已”者，“剛”，經中“植”也。文五年“甯嬴從陽處父及溫而還，其妻問之，嬴曰：‘夫子剛。’”又文六年“晉蒐於夷，使狐射姑將中軍，趙盾佐之。陽處父至自溫，改蒐於董，易中軍”，以趙盾為將，狐射姑郤為佐。狐射姑恨之，使續鞫居殺陽處父，故傳雲：“賈季怨陽子之易其班也。”賈季即狐射姑也。賈是采邑，季則其字也。○“見利”至“稱也”者，文子云：舅犯見君反國，恐不與已利祿，遂不顧其君，詐欲奔去，唯求財利，無心念君，無仁愛之心，其仁不足稱也。○注“謂久”至“利是”。○正義曰：案《左傳》僖五年闢驪姬之難，至僖二十四年反國，是久與文公闢難也。又案僖二十四年《左傳》雲：“及河，子犯以璧授公子曰：‘臣負羈紲，從君巡於天下，臣之罪甚多矣。臣猶知之，而況君乎？請由此亡。’公子曰：‘所反國不與舅氏同心者，有如白水。’”是要君求利之事也。○“利其”至“其友”者，文子稱隨武子之德，凡人利君者，多性行偏特，不顧其身。今武子既能利君，又能不忘其身。“利其君”者，謂進思盡忠。“不忘其身”者，保全父母。“謀其身，不遺其友”者，凡人謀身，多獨善於已，遺棄故舊。今武子既能謀身，又能不遺其朋友。此二句言武子德行弘廣，外內周備，故襄二十七年《左傳》論範武子之德雲：“文子之家事治，言於晉國無隱情。”無隱情則利君也，家事治則不忘其身。處父、舅犯，其事顯於《春秋》，故鄭具言之；隨武子之事，《春秋》文無指的，故鄭亦不言也。文七年士會與先蔑俱迎公子雍，在秦三年，不見先蔑，及士會還晉，遂不見蔑而歸，是遺其友，而云“不遺”者，彼謂共先蔑俱仰公子雍，懼其同罪，禍及於已，故不見之，非是無故相遺也。○“文子”至“其口”者，作記者美文子知人，既美隨士會於前，知其所舉還如隨會之比。此論文子之貌，文子身形退然柔相，似不勝其衣，言形貌之卑退也。其發言舒小，似吶吶然如不出諸口，謂言語卑下也。○注“鄉射”至“侯中”。○正義曰：引之者，證“中”為身也，故《儀禮·鄉射記》曰：“鄉侯五十弓，弓長六尺”，謂鄉射去射處五十步，一步料二寸，以為侯中，則侯中方一丈，“中”謂身也。○注“舉之”至“鍵也”。○正義曰：知“為大夫、士”者，以經稱“家”，家是大夫、士之總號。案《月令》注：“管籥，搏鍵器。”鍵謂鎖之入內者，俗謂之鎖須；管謂夾取鍵，今謂之鑰匙；則是管、鍵為別物。而云“管鍵”者，對則細別，散則大同，為鍵而有，故云“管鍵”。○“生不交利”者，謂文子生存之日，不交涉為利，是謂不與利交涉也。○“死不屬其子”者，謂臨死時不私屬其子於君及朝廷也。案《禮記》文子成室，被張老所譏。樂奏《肆夏》，從趙文子始。《禮記》顯其奢僣者，晉為霸主，總領諸侯，武為晉相，光顯威德。此乃事勢須然，無廢德行之善。且仲尼之門，尚有柴愚參魯，管仲相齊亦有三歸反坫，亦何怪也？" }
      - { type: j, text: "叔仲皮學子柳。叔仲皮，魯叔孫氏之族。學，教也。子柳，仲皮之子。○學，戶教反，注同。叔仲皮死，其妻魯人也，衣衰而繆絰。衣，當為齊，壞字也。繆，當為“不樛垂”之樛。士妻為舅姑之服也。言雖魯鈍，其於禮勝學。○衣衰，依注衣作齊，音諮。繆，依注讀曰樛，音居虯反。為舅，於偽反。下“為舅”、“為天子”、“不為兄”、“不為蠶”同。魯鈍，徒困反，亦作頓。叔仲衍以告，告子柳，言此非也。衍，蓋皮之弟。衍或為皮。○衍，以善反，注同。請繐衰而環絰，繐衰，小功之縷，而四升半之衰。環絰，吊服之絰。時婦人好輕細，而多服者。衍既不知禮之本，子柳亦以為然，而請於衍，使其妻為舅服之。○繐衰，上音歲，下七雷反。縷，力主反。好，呼報反。曰：“昔者吾喪姑姊妹亦如斯，末吾禁也。”衍答子柳也。姑姊妹在室齊衰，與婦為舅姑同。末，無也。言無禁我，欲其言行。○喪如字。末，莫曷反。退，使其妻繐衰而環絰。婦以諸侯之大夫為天子之衰、吊服之絰服其舅，非。" }
      - { type: z, text: "“叔仲”至“環絰”。○正義曰：此一節論子柳失禮之事。○叔仲，氏也，皮是名。言叔仲皮教訓其子，子柳雖受父教，猶不知禮。在後叔仲皮死，其妻魯人也，其子柳之妻是魯鈍婦人。雖曰魯鈍，猶知為舅姑而身著齊衰，而首服繆絰也。謂絞麻為絰。○“叔仲衍以告”者，衍是皮之弟、子柳之叔。既見當時婦人好尚輕細，見子柳之妻身著齊衰，以告子柳：汝妻何以著非禮之服？子柳見時皆爾，亦以為然，以妻非禮，遂請於衍，欲令其妻身著緦衰，首服環絰。衍答子柳雲：昔者吾喪姑姊妹亦如斯。斯，此也。謂如此繐衰環絰。○“末吾禁也”者，末，無也。我著繐衰環絰，無人於吾而相禁者，既無禁，明其得著繐衰。衍告子柳如此。丁柳得衍言乃退，使其妻著繐衰而環絰。○注“叔仲”至“之族”。○正義曰：知者，案《世本》“桓公生僖叔牙，叔牙生武仲休，休生惠伯彭，彭生皮，為叔仲氏”。故云“叔孫氏之族”。○注“衣當”至“勝學”。○正義曰：《喪服》婦為舅姑齊衰，無“衣衰”之文，故知“衣”是“齊”字，但“齊”字壞滅而有“衣”在。雲“繆讀為不樛垂之樛”者，讀從《喪服傳》“不樛垂”之樛。樛謂兩股相交也，五服之絰皆然，唯吊服環絰不樛耳。雲“士妻為舅姑之服也”者，以子柳以仲叔為氏，則非庶人也，又《春秋》叔仲皮等經傳無文，則非卿大夫也，故以為“士妻”。其實大夫妻為舅姑亦齊衰。○注“衍蓋皮之弟”。○正義曰：知者，以叔仲衍、叔仲皮皆以單字為名，故疑是兄弟也。又子柳請衍，則衍尊於子柳，是子柳叔也。○“繐衰”至“服之”。○正義曰：知“繐衰，小功之縷，而四升半”者，約《喪服傳》文。雲“環絰，吊服之絰”者，約《周禮·司服》“首服弁絰”，鄭注云：“弁絰者，如爵弁而素，加環絰。”又鄭注《雜記》雲：“環絰者，一股，所謂纏絰也，纏而不樛。”是環絰不樛也。雲“時婦人好輕細，而多服此”者，若時人不服此服，則衍與子柳應知繐衰為非。今子柳既受學於父，不肯粥庶弟之母，非是下愚而不知其非禮，明當時皆著輕細故也。○注“婦以”至“舅非”。○正義曰：“以諸侯之大夫為天子之衰”，據《喪服》謂繐衰也。雲“吊服之絰”者，謂環絰，既以此服服舅，故云非也。" }
      - { type: j, text: "成人有其兄死而不為衰者，聞子皋將為成宰，遂為衰。成人曰：“蠶則績而蟹有匡，範則冠而蟬有緌，兄則死而子皋為之衰。”蚩兄死者。言其衰之不為兄死，如蟹有匡，蟬有緌，不為蠶之績，範之冠也。範，蜂也。蟬，蜩也。緌為蜩喙，長在腹下。○成，本或作鄭，音丞。蠶，七南反。蟹，戶買反。緌，耳佳反。蚩，昌之反。蜂，子逢反。蜩音條。喙，呼惠反。又，丁角反。" }
      - { type: z, text: "“成人”至“之衰”。○正義曰：此一節論成人無禮之事。成，孟氏所食采地也，即前犯禾之邑也。此邑中民，有兄死而弟不為兄制服者也。○“聞子皋將為成宰，遂為衰”者，此不服兄者，聞孔子弟子子皋，其性至孝，來為成之宰，必當冶前不孝之人，恐罪及已，故懼之，遂制衰服也。○正義曰：“蠶則績而蟹有匡”者，“成人”謂成邑中識禮之人也，譏笑不服兄衰，仍為設二譬也。蠶則績絲作繭。“蟹有匡”者，蟹背殼似匡，仍謂蟹背作匡。○“範則冠而蟬有緌”者，範，蜂也。蜂頭上有物似冠也。蟬，蜩也。緌謂蟬喙，長在口下，似冠之緌也。○“兄則死而子皋為之衰”者，以是合譬也。蠶則須匡以貯繭，而今無匡，蟹背有匡，匡自著蟹，則非為蠶設。蜂冠無緌，而蟬口有緌，緌自著蟬，非為蜂設。亦如成人兄死，初不作衰，後畏於子皋，方為制服。服是子皋為之，非為兄施，亦如蟹匡、蟬緌各不關於蠶，蜂也。" }
      - { type: j, text: "樂正子春之母死，五日而不食，曰：“吾悔之。勉強過禮。子春，曾子弟子。○強，其兩反。自吾母而不得吾情，吾惡乎用吾情？”惡乎猶於何也。○惡音烏，注同。" }
      - { type: z, text: "“樂正”至“吾情”。○正義曰：此一節論孝子遭喪哀過之事。樂正子春即曾子弟子，坐於床下者是也。此其母死五日而不食者，禮三日，其五日，過二日。○“曰吾悔之”者，悔其不以實情，勉強而至五日。○“自吾母而不得吾情，吾惡乎用吾情”者，自吾母死而不得吾之實情，而矯詐勉強為之，更於何處用吾之實情乎？" }
      - { type: j, text: "歲旱，穆公召縣子而問然。然之言焉也。凡穆或作繆。○旱音汗。縣音懸。繆音穆。曰：“天久不雨，吾欲暴尫而奚若？”奚若，何如也。尫者，面鄉天，覬天哀而雨之。○雨，於付反，注及下同。暴，步卜反，下同。尫，烏光反。鄉，許亮反。覬音冀，本又作幾，音同。曰：“天久不雨，而暴人之疾子，虐，毋乃不可與？”錮疾，人之所哀，暴之是虐。○暴人之疾子，一讀以子字向下。與音餘。錮音固。“然則吾欲暴巫而奚若？”曰：“天則不雨，而望之愚婦人，於以求之，毋乃已疏乎？”已猶甚也。巫主接神，亦覬天哀而雨之。《春秋傳》說巫曰：“在女曰巫，在男曰覡。”《周禮·女巫》：“旱則舞雩。”○覡，胡狄反。旱，呼旦反。雩，音於。“徙市則奚若？”曰：“天子崩，巷市七日，諸侯薨，巷市三日，為之徙市，不亦可乎？”徙市者，庶人之喪禮。今徙市，是憂戚於旱若喪。○徙市，上音死，下音是。為，於偽反。“不亦可乎”，“可”或作“善”。" }
      - { type: z, text: "“歲旱”至“可乎”。○正義曰：此一節論歲旱變之事。○“望之愚婦人，於以求之，毋乃已疏乎”。○縣子云：天道遠，人道近。天則不雨，而望於愚鄙之婦人，欲以暴之，以求其雨。已，甚也。無乃甚疏遠於求雨道理乎？言甚疏遠於道理矣。○注“《春秋》”至“曰覡”。○正義曰：所引《春秋傳》者，《外傳·楚語》昭王問觀射父絕地通天之事。觀射父對雲：“民之精爽不攜貳者，明神降之，在男曰覡，在女曰巫。”然案《楚語》“精爽不攜貳者”始得為巫，此經而云“愚婦人”者，據末世之巫，非復是精爽不攜貳之巫也。○注“徙市者，庶人之喪禮”。正義曰：今徙市是憂戚於旱，若居天子諸侯之喪，必巷市者，以庶人憂戚，無復求賝財利，要有急須之物不得不求，故於邑里之內而為巷市。" }
      - { type: j, text: "孔子曰：“衛人之祔也離之，祔謂合葬也。離之，有以間其槨中。○祔音附，下同。合音閤，下同。間，間廁之間。魯人之祔也合之，善夫！”善夫，善魯人也。祔葬當合也。○善夫音扶。" }
      - { type: z, text: "“孔子”至“善夫”。○正義曰：此一節論魯、衛得失，各依文解之。○魯、衛兄弟，應同周法，故並之也。“祔”謂合葬也。“離之”謂以一物隔二棺之間於槨中也。所以然者，明合葬猶生時，男女須隔居處也。○“魯人之祔也合之，善夫”者。○魯人則合併兩棺置槨中，無別物隔之。言異生，不須復隔，穀則異室，死則同穴，故善魯之祔也。" }
      - { type: j, text: "《禮記正義》" }
