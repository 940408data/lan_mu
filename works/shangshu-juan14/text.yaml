# 尚書正義卷十四（孔穎達疏）：j 為經文＋孔安國注，z 為正義疏文。
sections:
  - id: juan14
    name: 卷十四
    blocks:
      - { type: j, text: "梓材告康叔以為政之道，亦如梓人治材。○梓音子，本亦作杼，馬雲：“古作梓字。治木器曰梓，治土器曰陶，治金器曰冶。”" }
      - { type: z, text: "傳“告康”至“治材”○正義曰：此取下言“若作梓材，既勤樸斫”，故云“為政之道，如梓人治材”。此古“杍”字，今文作“梓”。“梓”，木名，木之善者，治之宜精，因以為木之工匠之名。下有“稽田”、“作室”，乃言“梓材”，三種獨用“梓材”者，雖三者同喻，田在於外，室總於家，猶非指事之器，故取“梓材”以為功也。因戒德刑與酒事終，言治人似治器而結之故也。" }
      - { type: j, text: "王曰：“封，以厥庶民暨厥臣，達大家，言當用其眾人之賢者與其小臣之良者，以通達卿大夫及都家之政於國。○暨，其器反。以厥臣達王，惟邦君。汝當信用其臣以通王教於民。言通民事於國，通王教於民，惟乃國君之道。汝若恆，越曰：‘我有師師。’汝惟君道使順常，於是曰：“我有典常之師可師法。”司徒、司馬、司空、尹旅曰：‘予罔厲殺人。’言國之三卿、正官眾大夫皆順典常，而曰：“我無厲虐殺人之事。”如此則善矣。亦厥君先敬勞，肆徂厥敬勞。亦其為君之道，當先敬勞民，故汝往治民，必敬勞來之。○勞，力報反，下同。來，力代反。肆往，奸宄殺人，歷人宥。以民當敬勞之故，汝往之國，又當詳察奸宄之人及殺人賊，所過歷之人，有所寬宥，亦所以敬勞之。○宄音軌。肆亦見厥君事，戕敗人宥。聽訟折獄，當務從寬恕，故往治民，亦當見其為君之事，察民以過誤殘敗人者，當寬宥之。○見如字，徐賢遍反。戕敗，徐在羊反，又七良反，馬雲：“殘也。”折，之舌反。" }
      - { type: z, text: "“王曰”至“人宥”○正義曰：王曰：“封，汝為政，當用其眾人之賢者與其小臣之良者，以通達卿大夫及都家等大家之政於國，然後汝當信用其臣以通達王教於民，惟乃可為國君之道。汝為君道，故當使上下順常，於是曰：‘我有典常之師可師法。’是君之順典常也。其下司徒、司馬、司空國之三卿，及正官眾大夫亦皆順典常，而曰：‘我無虐厲殺人之事。’是使臣之順常也。如此君臣皆能順常，則為善矣。為君之道，非但順常，亦須敬勞之。故云亦其為君之道，當先敬心以愛勞民。故汝往治民，必敬勞之。又以民須敬勞之故，汝往之國，詳察其奸宄及殺人之人，二者所過歷之人，原情不知，有所寬宥。以斷獄務從寬，故汝往治亦當見其為君之事，而民有過誤殘敗人者，當寬宥之，此亦為敬勞之也。”○傳“言當”至“於國”○正義曰：“以”，用也。“暨”，與也。言“用”，通“厥臣”可用，明此皆賢與良也。“厥臣”文在“大家”之上，故知“小臣”也。言用之者，既用其言以為政，又用其人以為輔，本之得大家所用統之，即君所遣也。以大夫稱家，對士庶有家而非大，故云“大家”，卿大夫在朝者。“都家”亦卿大夫所得邑也，又公邑而大夫所治亦是也。用此以行政令，上達於國，使人君知之也。即是庶人升為士，又用庶人進在官者，小臣亦得進等而用之。《周禮》有都家之官，鄭雲：“都謂王子弟所封及公卿所食邑，家謂大夫所食采地。”傳以“大家”言之，總包大臣，故言“卿大夫及都家之政”。卿大夫之政謂在朝所掌者，都家之政謂采邑所有政事，二者並當通達之於國，故連言之。○傳“汝當”至“之道”○正義曰：言汝當信用臣，即信用卿大夫及都家，自然大家也。傳用小臣與庶人，故得“通王教於民”也。人君上承於王，下治民事，故交通其政，“惟乃國君之道”而已。鄭以“於邑言達大家，於國言達王與邦君，王為二王之後”，即亂名實也。○傳“汝惟”至“師法”○正義曰：即上民事王教通於國人，是順常也，故總上“惟邦君”，言“汝惟君道使順常”也。“典常可師”即順常也。○傳“言國”至“善矣”○正義曰：此連上蒙“若恆”之文，故云“國之三卿、正官眾大夫皆順典常”也。不言“士”，從可知也。此曰“予罔厲殺人”，所謂令康叔之語，但在臣下，宜為此也。以上令下行，行之在臣，故云“我無厲虐殺人之事”，互明君及臣皆師法而無虐。○傳“亦其”至“來之”○正義曰：“亦其為君之道”者，為邦君之道，非直順常，亦須敬勞，故往必敬勞，即《論語》雲“先之，勞之”是也。○傳“以民”至“勞之”○正義曰：上文無罪敬勞，此惟就有罪者原情免宥，亦敬勞也。其實“奸宄”不殺人者，“殺人”亦是奸宄，但重言而別其文。奸宄及殺人，二者並是賊害，自當合罪，不可寬宥。其所過歷之人，情所不知，故詳察寬宥，以為敬勞之。○傳“聽訟”至“宥之”○正義曰：以君者立於無過之地，使物不失其所，故宥罪原情，當見其為君之事，與上“厥君”始終相承。於“奸”上言“肆往”，此亦以罪事往可知也。言“宥”，明情亦可原，故知“過誤殘敗人”也。" }
      - { type: j, text: "王啟監，厥亂為民。言王者開置監官，其治為民，不可不勉。○監，工暫反，劉工銜反，下同。為，於偽反，注同。治，直吏反。曰：‘無胥戕，無胥虐，至於敬寡，至於屬婦，合由以容。’當教民無得相殘傷，相虐殺，至於敬養寡弱，至於存恤妾婦，和合其教，用大道以容之，無令見冤枉。○屬婦，上音蜀，妾之事妻也。令，力呈反，篇末同。冤，紆元反，一本作以冤。王其效邦君，越御事，厥命曷以。王者其效實國君，及於御治事者，知其教命所施何用，不可不勤。引養引恬，自古王若茲監，罔攸闢。”能長養民，長安民，用古王道如此，監無所復罪，當務之。○恬，田廉反。闢，扶亦反。" }
      - { type: z, text: "“王啟”至“攸闢”○正義曰：周公雲：“所以敬勞者，以王者開置監官，其治主為於民故也。以此當教民曰：‘無得相殘傷，無得相虐殺，而為重害也。何但不可為重害，民之相於，當至於敬養寡弱，至於存恤屬婦，合和其教，用大道以相容，無使至冤枉。’所以如此者，以王者其當效實國君，及於御治事者，惟須知其教命所施何用，知其善惡，故不可不勤也。所效實若能長養民，長安民，用古昔明王之，道而治之如此為監，無所復罪，汝當務之。”○傳“當教”至“冤枉”○正義曰：以言“曰”，故知“當教民”也。“殘”謂不死，“虐”，甚則殺，故二文也。經言“屬婦”，傳言“妾婦”者，以妾屬於人，故名“屬婦”。此經“屬婦”與“寡弱”為例，則非關嫡婦也。何者？妻子是家中之貴者，不至冤枉故也。○傳“王者”至“不勤”○正義曰：以君臣共國事，故並效御治事，而知其所施，則下不得為非，即是王使存省侯伯監治是也，故不可不勤。" }
      - { type: j, text: "“惟曰，若稽田，既勤敷菑，惟其陳修，為厥疆畎。言為君監民，惟若農夫之考田，已勞力布發之，惟其陳列修治，為其疆畔畎壟，然後功成。以喻教化。○菑，側其反。畎，工犬反。若作室家，既勤垣墉，惟其塗塈茨。如人為室，家已勤立垣牆，惟其當塗既茨蓋之。○垣音袁。墉音庸，馬雲：“卑曰垣，高曰庸。”塈，徐許既反，《說文》雲：“仰塗也。”《廣雅》雲：“塗也。”馬雲：“堊色。”一音故愛反。茨，徐在私反。若作梓材，既勤樸斫，惟其塗丹雘。為政之術，如梓人治材為器，已勞力樸治斫削，惟其當塗以漆丹以朱而後成。以言教化亦須禮義然後治”。○樸，普角反，馬雲：“未成器也。”斫，丁角反。雘，枉略反，徐烏郭反。馬雲：“善丹也。”《說文》雲：“讀與霍同也。”又一郭反，《字林》音同。" }
      - { type: z, text: "“惟曰”至“丹雘”○正義曰：既言王者所以效實國君為政之事，故此言國君為政之喻惟為監之事。曰：“若農人之考田也，已勞力遍佈菑而耕發其田，又須為其陳列修治，為疆畔畎壟，以至收穫然後功成。又若人為室家，已勤力立其垣墉，又當惟其塗而暨飾茨蓋之，功乃成也。又若梓人治材為器，已勞力樸治斫削其材，惟其當塗而丹漆以朱雘乃後成。以喻人君為政之道，亦勞心施政，除民之疾，又當惟其飾以禮義，使之行善然後治。”○傳“為政”至“後治”○正義曰：此三者事別而喻同也。先遠而類疏者，乃漸漸以事近而切者次之。皆言既勤於初，乃言修治於未，明為政孜孜，因前基而修，使善垣墉故也。皆詳而復言之，室器皆雲其事終，而考田止言疆畎，不雲刈獲者，田以一種，但陳修終至收成，故開其初，與下二文互也。二文皆言“斁”，即古“塗”字，明其終而塗飾之。其室言“塗暨”，“暨”亦塗也，總是以物塗之。“茨”謂蓋覆也。器言“塗丹雘”，“塗”、“丹”皆飾物之名，謂塗雘以朱雘。“雘”是彩色之名，有青色者，有硃色者，故鄭玄引《山海經》雲：“青丘之山，多有青雘。”此經知是“朱”者，與“丹”連文故也。" }
      - { type: j, text: "今王惟曰，先王既勤用明德，懷為夾，言文武已勤用明德，懷遠為近，汝治國當法之。○夾音協，近也。庶邦享，作兄弟，方來，亦既用明德。眾國朝享於王，又親仁善鄰為兄弟之國，方方皆來賓服，亦已奉用先王之明德。○朝，直遙反。後式典集，庶邦丕享。君天下能用常法，則和集眾國，大來朝享。皇天既付中國民，越厥疆土，於先王肆。大天已付周家治中國民矣，能遠拓其界壤，則於先王之道遂大。○付如字，馬本作附。拓音托。王惟德用，和懌先後迷民，用懌先王受命。今王惟用德，和悅先後天下迷愚之民。先後謂教訓，所以悅先王受命之義。○懌音亦，字又作斁，下同。先，悉薦反，注同。已若茲監，惟曰欲至於萬年惟王，為監所行已如此所陳法，則我周家惟欲使至於萬年承奉王室。○監，古陷反。為，於威反。子子孫孫永保民。”又欲令其子孫累世長居國以安民。" }
      - { type: z, text: "“今王”至“保民”○正義曰：此戒康叔已滿三篇，其事將終，須有總結，因其政術言法於明王，上下相承，資以成治，故稱今者王命惟告汝曰：“先王文武在於前世，以自勤用明德，招懷遠人，使來以為親近也。以明德懷柔之故，眾國朝享於王，又相親善為兄弟之國，萬方皆來賓服，亦已化上奉用先王之明德矣。是先王有明德，下亦行明德，以從之而可法也。先王既然，凡為君以君天下者，亦如先王用常法，則和集眾國，使之大來朝享，亦須同先王用明德也。君天下者當如此，今大天已付周家治九州之中國民矣。周家之王，若能為政用明德以懷萬國，遠拓其疆界土壤，則先王之道遂更光大。以此今王須大先王之政，惟明德之大道而用之，以此和悅而先後其天下迷愚之民，使之政治用此，所以悅先王受命使之遂大之義故也。是明德不可不務，故我周王今亦行之。汝為人臣，可以不法乎？當法王家勤用明德治國也。汝若能法我王家而用明德，是為善不可加。”因歎雲：“已乎！如此為監，則我周家惟曰，欲汝至於萬年，惟以承奉王室，今其子子孫孫累世長居國以安民。”○傳“言文”至“法之”○正義曰：言“先王”，知謂文武也。“夾”者，是人左右而夾之，故言近也。○傳“眾國”至“明德”○正義曰：“享”施於王，而“兄弟”為相於之辭，明彼此皆和協。“親仁善鄰”，《左傳》文。以先王用明德，於下之所行，今亦奉用，為亦先王耳。○傳“大天”至“遂大”○正義曰：“肆”，遂也，申遂故為大。“越”，遠也，使天下賓服，故遠柘界壤以益先王，故為“遂大”也。○傳“今王”至“之義”○正義曰：言“用德”，亦是明德也。“先後”若《詩》雲“予曰有先後”，謂於民心先未悟，而啟之已悟，於後化成之，故謂“教訓”也。先王本欲子孫成其事，今化天下使善，是“悅先王受命”。其和悅先王即遠拓疆土，悅其受命即“遂大”也。" }
      - { type: j, text: "《尚書正義》" }
