aboutHtml: |-
  <h2>關於此卷</h2>
  <p>《中庸章句序》為朱熹淳熙己酉（一一八九）所作，述中庸教人之法、程氏表章此篇之由，及己重編章句之意。此卷以宋刻本版式數字重刻，純大字無注；《中庸章句》正文另成一卷。</p>
