    依<b>宋刻本</b>版式排比：一版兩個半葉，中縫為版心。序文純大字單行，無注；一列惟純經，遇段別行。<br>此卷錄朱子《中庸章句序》全文，自「中庸之書，古之中庸所以教人之法也」至「淳熙己酉春二月甲子，新安朱熹序」。<br>句讀依宋本朱筆圈點之法，附於字之右下，圈為句、點為讀，不占字位。<br>文本以朱熹《四書章句集注》通行本為據，校錄重排，與宋本原刻容有出入。
