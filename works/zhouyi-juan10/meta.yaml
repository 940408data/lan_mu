aboutHtml: |-
  <h2>關於此卷</h2>
  <p>《周易正義》為唐孔穎達等奉敕撰，以魏王、韓康伯注為本，兼採漢魏諸家之說，為十三經注疏之一。此卷以宋刻本版式數字重刻，半葉八行、行十六字、注文雙行二十五字。</p>
  <p>卷十為序卦傳，乃《十翼》之一，序六十四卦相次之義，經注疏全帙。</p>
